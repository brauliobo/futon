title: 📢 English 3A - Comandos e instruções
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Comandos de sala de aula — Stand up, Sit down, Open, Close, Listen.
repeatAll: 2
example: "Ex.: 'Stand up!' 'Open your book, please.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Comandos de sala de aula
    description: Aprenda os comandos mais usados na aula.
    exercises:
      - type: english_vocab
        question: Como se diz 'Levante-se!' em inglês?
        correctAnswer: Stand up!
        rationale: "'Stand up!' = Levante-se! Comando: verbo base."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Sente-se!' em inglês?
        correctAnswer: Sit down!
        rationale: "'Sit down!' = Sente-se! Oposto de 'Stand up'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Abra seu livro.' em inglês?
        correctAnswer: Open your book.
        rationale: "'Open your book.' — 'open' = abrir."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Feche seu caderno.' em inglês?
        correctAnswer: Close your notebook.
        rationale: "'Close your notebook.' — 'close' = fechar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Escute!' em inglês?
        correctAnswer: Listen!
        rationale: "'Listen!' = Escute/Ouça! Comando."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Olhe!' em inglês?
        correctAnswer: Look!
        rationale: "'Look!' = Olhe! 'Look at the board.' = Olhe para o quadro."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Repita.' em inglês?
        correctAnswer: Repeat.
        rationale: "'Repeat.' = Repita. 'Repeat after me.' = Repita depois de mim."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Escreva.' em inglês?
        correctAnswer: Write.
        rationale: "'Write.' = Escreva. 'Write your name.' = Escreva seu nome."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'por favor' em inglês?
        correctAnswer: please
        rationale: "'please' = por favor. 'Open your book, please.' = Abra seu livro, por favor."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'obrigado/obrigada' em inglês?
        correctAnswer: thank you
        rationale: "'thank you' = obrigado(a). 'Thanks' = versão informal."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Mais comandos e expressões de classe
    description: Aprenda comandos adicionais e expressões úteis.
    exercises:
      - type: english_vocab
        question: Como se diz 'Silêncio! / Cale-se!' em inglês?
        correctAnswer: Be quiet!
        rationale: "'Be quiet!' = Silêncio! 'quiet' = silencioso."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Vá para o quadro.' em inglês?
        correctAnswer: Go to the board.
        rationale: "'Go to the board.' — 'go to' = ir para."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Não entendo.' em inglês?
        correctAnswer: I don't understand.
        rationale: "'I don't understand.' — Expressão útil na aula."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Pode repetir?' em inglês?
        correctAnswer: Can you repeat?
        rationale: "'Can you repeat?' = Pode repetir?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Como se diz ___ em inglês?' em inglês?
        correctAnswer: How do you say ___ in English?
        rationale: "'How do you say ___ in English?' — Pergunta muito útil!"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Preste atenção!' em inglês?
        correctAnswer: Pay attention!
        rationale: "'Pay attention!' = Preste atenção!"
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Posso ir ao banheiro?' em inglês?
        correctAnswer: Can I go to the bathroom?
        rationale: "'Can I go to the bathroom?' — Pedido de permissão com 'can'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ your book and ___.' (abra/escreva)"
        correctAnswer: Open, write
        rationale: "'Open your book and write.' — Dois comandos com 'and'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Muito bem!' em inglês?
        correctAnswer: Very good!
        rationale: "'Very good!' = Muito bem! 'Well done!' = Parabéns!"
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Tente de novo.' em inglês?
        correctAnswer: Try again.
        rationale: "'Try again.' = Tente de novo. 'try' = tentar."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
