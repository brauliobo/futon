title: 👕 English 3A - Roupas
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.clothes
authorNotes: Roupas e vestuário básico em inglês.
repeatAll: 2
example: "Ex.: 'I wear a shirt.' 'She has a red dress.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Roupas básicas
    description: Aprenda shirt, pants, dress, shoes e mais.
    exercises:
      - type: english_vocab
        question: Como se diz 'camiseta' em inglês?
        correctAnswer: shirt
        rationale: "'shirt' = camisa/camiseta. A blue shirt."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'calça' em inglês?
        correctAnswer: pants
        rationale: "'pants' = calça. Blue pants. (Sempre no plural em inglês.)"
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'vestido' em inglês?
        correctAnswer: dress
        rationale: "'dress' = vestido. A red dress."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'sapatos' em inglês?
        correctAnswer: shoes
        rationale: "'shoes' = sapatos. A pair of shoes."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'meias' em inglês?
        correctAnswer: socks
        rationale: "'socks' = meias. White socks."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'chapéu' em inglês?
        correctAnswer: hat
        rationale: "'hat' = chapéu. A big hat."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Complete: 'I wear a blue ___.' (camiseta)
        correctAnswer: shirt
        rationale: "'I wear a blue shirt.' — 'wear' = usar/vestir."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Complete: 'She has a red ___.' (vestido)
        correctAnswer: dress
        rationale: "'She has a red dress.' — Ela tem um vestido vermelho."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Complete: 'I put on my ___.' (sapatos)
        correctAnswer: shoes
        rationale: "'I put on my shoes.' — 'put on' = calçar/vestir."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'jaqueta' em inglês?
        correctAnswer: jacket
        rationale: "'jacket' = jaqueta. A warm jacket."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
  - pageNumber: 2
    title: Mais roupas e frases
    description: Aprenda sweater, skirt, coat e use roupas em frases.
    exercises:
      - type: english_vocab
        question: Como se diz 'suéter/blusa de frio' em inglês?
        correctAnswer: sweater
        rationale: "'sweater' = suéter, blusa de lã. A warm sweater."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'saia' em inglês?
        correctAnswer: skirt
        rationale: "'skirt' = saia. A pink skirt."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'casaco' em inglês?
        correctAnswer: coat
        rationale: "'coat' = casaco. A big coat."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Complete: 'It is cold. I wear my ___.' (casaco)
        correctAnswer: coat
        rationale: "'It is cold. I wear my coat.' — Está frio. Uso meu casaco."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Complete: 'She wears a ___ and a ___.' (camisa e saia)
        correctAnswer: shirt and skirt
        rationale: "'She wears a shirt and a skirt.' — Ela usa camisa e saia."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'Eu uso calça azul.' em inglês?
        correctAnswer: I wear blue pants.
        rationale: "'I wear blue pants.' — 'pants' sem 'a/an' (já é plural)."
        difficulty: 2
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'Quais roupas você usa hoje?' em inglês?
        correctAnswer: What clothes do you wear today?
        rationale: "'What clothes do you wear today?' — 'clothes' = roupas (plural)."
        difficulty: 2
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Liste 5 roupas em inglês
        correctAnswer: shirt, pants, dress, shoes, hat
        rationale: "shirt, pants, dress, shoes, hat — 5 roupas básicas."
        difficulty: 2
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Complete: 'I ___ a hat and a coat.' (uso — verbo wear)
        correctAnswer: wear
        rationale: "'I wear a hat and a coat.' — 'wear' = usar roupas."
        difficulty: 2
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'uniforme escolar' em inglês?
        correctAnswer: school uniform
        rationale: "'school uniform' = uniforme escolar. I wear a school uniform."
        difficulty: 2
        objectives: [pre-A1.vocab.clothes]
target: 20
