title: 🌍 English 3A - Lugares na cidade
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.places
authorNotes: Lugares na cidade — school, park, shop, hospital, library, restaurant.
repeatAll: 2
example: "Ex.: 'I go to the park.' 'The hospital is near my school.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Lugares comuns
    description: Aprenda school, park, shop, supermarket, hospital, bank.
    exercises:
      - type: english_vocab
        question: Como se diz 'escola' em inglês?
        correctAnswer: school
        rationale: "'school' = escola. I go to school."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'parque' em inglês?
        correctAnswer: park
        rationale: "'park' = parque. I play in the park."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'loja' em inglês?
        correctAnswer: shop
        rationale: "'shop' = loja. I go to the shop."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'supermercado' em inglês?
        correctAnswer: supermarket
        rationale: "'supermarket' = supermercado."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'hospital' em inglês?
        correctAnswer: hospital
        rationale: "'hospital' = hospital. Go to the hospital."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'banco' em inglês?
        correctAnswer: bank
        rationale: "'bank' = banco."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: "Complete: 'I go to the ___ to buy food.' (supermercado)"
        correctAnswer: supermarket
        rationale: "'I go to the supermarket to buy food.' — Vou ao supermercado comprar comida."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: "Complete: 'I play football in the ___.' (parque)"
        correctAnswer: park
        rationale: "'I play football in the park.' — Jogo futebol no parque."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'restaurante' em inglês?
        correctAnswer: restaurant
        rationale: "'restaurant' = restaurante. We eat at a restaurant."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'cinema' em inglês?
        correctAnswer: cinema
        rationale: "'cinema' = cinema. We watch films at the cinema."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
  - pageNumber: 2
    title: Indo aos lugares
    description: Pratique frases com 'go to' + lugar.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu vou ao parque.' em inglês?
        correctAnswer: I go to the park.
        rationale: "'I go to the park.' — 'go to' = ir para/ao."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'Ela vai ao hospital.' em inglês?
        correctAnswer: She goes to the hospital.
        rationale: "'She goes to the hospital.' — 'goes' com she."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: "Complete: 'I go to ___ every day.' (escola)"
        correctAnswer: school
        rationale: "'I go to school every day.' — 'school' sem 'the' = sentido geral."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: "Complete: 'My mother goes to the ___.' (supermercado)"
        correctAnswer: supermarket
        rationale: "'My mother goes to the supermarket.' — Minha mãe vai ao supermercado."
        difficulty: 1
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'Onde fica o banco?' em inglês?
        correctAnswer: Where is the bank?
        rationale: "'Where is the bank?' — Perguntando pela localização."
        difficulty: 2
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'O parque fica ao lado da escola.' em inglês?
        correctAnswer: The park is next to the school.
        rationale: "'The park is next to the school.' — Preposição 'next to'."
        difficulty: 2
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Liste 6 lugares da cidade em inglês
        correctAnswer: school, park, shop, hospital, bank, restaurant
        rationale: "school, park, shop, hospital, bank, restaurant — 6 lugares."
        difficulty: 2
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'Eu moro perto da escola.' em inglês?
        correctAnswer: I live near the school.
        rationale: "'I live near the school.' — 'near' = perto de."
        difficulty: 2
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: "Complete: 'I go to the ___ to eat dinner.' (restaurante)"
        correctAnswer: restaurant
        rationale: "'I go to the restaurant to eat dinner.' — Vou ao restaurante jantar."
        difficulty: 2
        objectives: [pre-A1.vocab.places]
      - type: english_vocab
        question: Como se diz 'O hospital fica longe da minha casa.' em inglês?
        correctAnswer: The hospital is far from my house.
        rationale: "'The hospital is far from my house.' — 'far from' = longe de."
        difficulty: 2
        objectives: [pre-A1.vocab.places]
target: 20
