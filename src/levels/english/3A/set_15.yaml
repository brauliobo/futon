title: 📍 English 3A - Preposições de lugar
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Preposições de lugar — in, on, under, next to, in front of, behind.
repeatAll: 2
example: "Ex.: 'The cat is under the table.' 'The school is next to the park.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Preposições básicas
    description: Pratique in, on, under, next to com objetos.
    exercises:
      - type: english_vocab
        question: O que significa 'in' (preposição de lugar)?
        correctAnswer: dentro de
        rationale: "'in' = dentro de. The cat is in the box."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: O que significa 'on' (preposição de lugar)?
        correctAnswer: em cima de
        rationale: "'on' = em cima de. The book is on the table."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: O que significa 'under' (preposição de lugar)?
        correctAnswer: embaixo de
        rationale: "'under' = embaixo de. The dog is under the chair."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: O que significa 'next to' (preposição de lugar)?
        correctAnswer: ao lado de
        rationale: "'next to' = ao lado de. The school is next to the park."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The book is ___ the table.' (em cima)
        correctAnswer: on
        rationale: "'The book is on the table.' — 'on' para superfícies."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The cat is ___ the box.' (dentro)
        correctAnswer: in
        rationale: "'The cat is in the box.' — 'in' para dentro."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The ball is ___ the chair.' (embaixo)
        correctAnswer: under
        rationale: "'The ball is under the chair.' — 'under' para embaixo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The pen is ___ ___ the book.' (ao lado)
        correctAnswer: next to
        rationale: "'The pen is next to the book.' — 'next to' = ao lado."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O gato está em cima da cama.' em inglês?
        correctAnswer: The cat is on the bed.
        rationale: "'The cat is on the bed.' — 'on' para superfícies."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O livro está dentro da bolsa.' em inglês?
        correctAnswer: The book is in the bag.
        rationale: "'The book is in the bag.' — 'in' para interior."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Mais preposições
    description: Aprenda in front of, behind, between e mais.
    exercises:
      - type: english_vocab
        question: O que significa 'in front of'?
        correctAnswer: na frente de
        rationale: "'in front of' = na frente de. The car is in front of the house."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: O que significa 'behind'?
        correctAnswer: atrás de
        rationale: "'behind' = atrás de. The dog is behind the sofa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: O que significa 'between'?
        correctAnswer: entre
        rationale: "'between' = entre. The cat is between the two dogs."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The dog is ___ the sofa.' (atrás)
        correctAnswer: behind
        rationale: "'The dog is behind the sofa.' — 'behind' = atrás de."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The school is ___ ___ ___ the park.' (na frente)
        correctAnswer: in front of
        rationale: "'The school is in front of the park.' — Na frente do parque."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The cat is ___ the two dogs.' (entre)
        correctAnswer: between
        rationale: "'The cat is between the two dogs.' — O gato está entre os dois cães."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O supermercado fica atrás do banco.' em inglês?
        correctAnswer: The supermarket is behind the bank.
        rationale: "'The supermarket is behind the bank.' — 'behind' = atrás."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Liste as 6 preposições desta lição
        correctAnswer: in, on, under, next to, in front of, behind
        rationale: "in, on, under, next to, in front of, behind — 6 preposições de lugar."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Onde está o gato? Está embaixo da mesa.' em inglês?
        correctAnswer: Where is the cat? It is under the table.
        rationale: "'Where is the cat? It is under the table.' — Pergunta e resposta."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The book is ___ the bag, ___ the desk.' (dentro/em cima)
        correctAnswer: in, on
        rationale: "'The book is in the bag, on the desk.' — 'in' = dentro, 'on' = em cima."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
