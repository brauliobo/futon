title: 💬 English 3A - Frases 'She has / He is / They are'
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Usando 'to be' e 'have' com 3ª pessoa — she/he/they.
repeatAll: 2
example: "Ex.: 'She has a dog.' 'He is tall.' 'They are happy.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: She has / He has
    description: Use 'she has' e 'he has' para falar de posse.
    exercises:
      - type: english_vocab
        question: Como se diz 'Ela tem um cachorro.' em inglês?
        correctAnswer: She has a dog.
        rationale: "'She has a dog.' — 'has' com she/he/it."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ele tem um gato.' em inglês?
        correctAnswer: He has a cat.
        rationale: "'He has a cat.' — 'has' com he."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'She ___ a red ball.' (tem)"
        correctAnswer: has
        rationale: "'She has a red ball.' — 'has' para 3ª pessoa singular."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'He ___ two sisters.' (tem)"
        correctAnswer: has
        rationale: "'He has two sisters.' — 'has' para he."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela tem cabelo longo.' em inglês?
        correctAnswer: She has long hair.
        rationale: "'She has long hair.' — 'long hair' = cabelo longo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ele tem olhos azuis.' em inglês?
        correctAnswer: He has blue eyes.
        rationale: "'He has blue eyes.' — 'blue eyes' = olhos azuis."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'She ___ a book but he ___ a pen.' (tem/tem)"
        correctAnswer: has, has
        rationale: "'She has a book but he has a pen.' — 'has' com she e he."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O gato tem uma cauda longa.' em inglês?
        correctAnswer: The cat has a long tail.
        rationale: "'The cat has a long tail.' — 'it/the cat' + 'has'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Does she ___ a dog? Yes, she does.' (tem)"
        correctAnswer: have
        rationale: "'Does she have a dog?' — Com 'does', voltamos para 'have'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela não tem um irmão.' em inglês?
        correctAnswer: She doesn't have a brother.
        rationale: "'She doesn't have a brother.' — 'doesn't have' = não tem."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: He is / She is / They are
    description: Use 'to be' com descrições na 3ª pessoa.
    exercises:
      - type: english_vocab
        question: Como se diz 'Ele é alto.' em inglês?
        correctAnswer: He is tall.
        rationale: "'He is tall.' — 'is' com he/she/it."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela é inteligente.' em inglês?
        correctAnswer: She is smart.
        rationale: "'She is smart.' — 'smart' = inteligente."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eles são felizes.' em inglês?
        correctAnswer: They are happy.
        rationale: "'They are happy.' — 'are' com they."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'He ___ my brother. He ___ tall.' (is/is)"
        correctAnswer: is, is
        rationale: "'He is my brother. He is tall.' — 'is' para he."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'They ___ my friends. They ___ funny.' (are/are)"
        correctAnswer: are, are
        rationale: "'They are my friends. They are funny.' — 'are' para they."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela não é triste.' em inglês?
        correctAnswer: She is not sad.
        rationale: "'She is not sad.' — negativa: is + not."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'She ___ a teacher and she ___ kind.' (is/is)"
        correctAnswer: is, is
        rationale: "'She is a teacher and she is kind.' — Profissão e adjetivo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eles têm dois filhos.' em inglês?
        correctAnswer: They have two children.
        rationale: "'They have two children.' — 'have' com they."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ is my sister. ___ has brown hair.' (ela/ela)"
        correctAnswer: She, She
        rationale: "'She is my sister. She has brown hair.' — 'she' para feminino."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ele está cansado porque correu muito.' em inglês?
        correctAnswer: He is tired because he ran a lot.
        rationale: "'He is tired because he ran a lot.' — 'because' liga causa e efeito."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
