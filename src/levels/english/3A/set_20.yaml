title: ✅ English 3A - Revisão geral
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.adjectives
  - pre-A1.vocab.animals
  - pre-A1.vocab.body
  - pre-A1.vocab.clothes
  - pre-A1.vocab.days
  - pre-A1.vocab.family
  - pre-A1.vocab.food
  - pre-A1.vocab.house
  - pre-A1.vocab.transport
  - pre-A1.vocab.weather
  - pre-A1.phrases
authorNotes: Revisão completa do nível 3A — vocabulário temático e frases.
repeatAll: 2
example: "Ex.: 'I like dogs.' 'She has a red dress.' 'It is sunny today.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Revisão — Vocabulário temático
    description: Revise animais, comidas, roupas, família e casa.
    exercises:
      - type: english_vocab
        question: Dê o som de 3 animais em inglês (vaca, cachorro, gato)
        correctAnswer: moo, woof, meow
        rationale: "cow = moo, dog = woof, cat = meow."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Liste 3 frutas em inglês
        correctAnswer: apple, banana, orange
        rationale: "apple (maçã), banana, orange (laranja)."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Liste 3 roupas em inglês
        correctAnswer: shirt, pants, shoes
        rationale: "shirt (camisa), pants (calça), shoes (sapatos)."
        difficulty: 1
        objectives: [pre-A1.vocab.clothes]
      - type: english_vocab
        question: Como se diz 'mãe, pai, irmão, irmã' em inglês?
        correctAnswer: mother, father, brother, sister
        rationale: "Família imediata: mother, father, brother, sister."
        difficulty: 1
        objectives: [pre-A1.vocab.family]
      - type: english_vocab
        question: Liste 3 cômodos da casa em inglês
        correctAnswer: kitchen, bedroom, bathroom
        rationale: "kitchen (cozinha), bedroom (quarto), bathroom (banheiro)."
        difficulty: 1
        objectives: [pre-A1.vocab.house]
      - type: english_vocab
        question: Como se diz 'ônibus, carro, bicicleta' em inglês?
        correctAnswer: bus, car, bike
        rationale: "Transportes: bus (ônibus), car (carro), bike (bicicleta)."
        difficulty: 1
        objectives: [pre-A1.vocab.transport]
      - type: english_vocab
        question: Como se diz 'ensolarado, chuvoso, nublado' em inglês?
        correctAnswer: sunny, rainy, cloudy
        rationale: "Tempo: sunny, rainy, cloudy."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Liste as partes do rosto em inglês
        correctAnswer: eyes, ears, nose, mouth
        rationale: "Rosto: eyes (olhos), ears (orelhas), nose (nariz), mouth (boca)."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'grande, pequeno, rápido, lento' em inglês?
        correctAnswer: big, small, fast, slow
        rationale: "Adjetivos opostos: big/small, fast/slow."
        difficulty: 1
        objectives: [pre-A1.vocab.adjectives]
      - type: english_vocab
        question: Dê 3 dias da semana em inglês
        correctAnswer: Monday, Tuesday, Wednesday
        rationale: "Monday (segunda), Tuesday (terça), Wednesday (quarta)."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
  - pageNumber: 2
    title: Revisão — Frases e estruturas
    description: Revise as frases e estruturas essenciais do 3A.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu gosto de cães mas não gosto de aranhas.' em inglês?
        correctAnswer: I like dogs but I don't like spiders.
        rationale: "'I like dogs but I don't like spiders.' — 'but' para contraste."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela tem cabelo longo e olhos azuis.' em inglês?
        correctAnswer: She has long hair and blue eyes.
        rationale: "'She has long hair and blue eyes.' — 'has' com she."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Hoje está quente e ensolarado.' em inglês?
        correctAnswer: Today it is hot and sunny.
        rationale: "'Today it is hot and sunny.' — 'it is' para clima."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'São três horas.' em inglês?
        correctAnswer: It is three o'clock.
        rationale: "'It is three o'clock.' — Horas com 'o'clock'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O livro está em cima da mesa.' em inglês?
        correctAnswer: The book is on the table.
        rationale: "'The book is on the table.' — 'on' = em cima."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Abra seu livro, por favor.' em inglês?
        correctAnswer: Open your book, please.
        rationale: "'Open your book, please.' — Comando + 'please'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ele não gosta de vegetais.' em inglês?
        correctAnswer: He doesn't like vegetables.
        rationale: "'He doesn't like vegetables.' — 'doesn't like' com he."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Você gosta de nadar?' em inglês?
        correctAnswer: Do you like swimming?
        rationale: "'Do you like swimming?' — 'like + -ing'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I go to school ___ bus.' (de)"
        correctAnswer: by
        rationale: "'I go to school by bus.' — 'by' com meios de transporte."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Minha avó faz biscoitos gostosos.' em inglês?
        correctAnswer: My grandmother makes delicious cookies.
        rationale: "'My grandmother makes delicious cookies.' — 'delicious' = gostoso."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
