title: 🕐 English 3A - Horas simples
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.time
authorNotes: Dizendo as horas em inglês — o'clock, half past, quarter past.
repeatAll: 2
example: "Ex.: 'It is three o'clock.' 'It is half past two.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Horas exatas — o'clock
    description: Aprenda a dizer horas exatas com 'o'clock'.
    exercises:
      - type: english_vocab
        question: Como se diz 'É uma hora.' em inglês?
        correctAnswer: It is one o'clock.
        rationale: "'It is one o'clock.' — 'o'clock' = horas exatas."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'É três horas.' em inglês?
        correctAnswer: It is three o'clock.
        rationale: "'It is three o'clock.' — Padrão: It is + número + o'clock."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'São cinco horas.' em inglês?
        correctAnswer: It is five o'clock.
        rationale: "'It is five o'clock.' — Mesmo padrão."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'Que horas são?' em inglês?
        correctAnswer: What time is it?
        rationale: "'What time is it?' — Pergunta sobre a hora."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Responda: 'What time is it?' — (são 7 horas)
        correctAnswer: It is seven o'clock.
        rationale: "'It is seven o'clock.' — São sete horas."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Complete: 'It is ___ o'clock.' (nove)
        correctAnswer: nine
        rationale: "'It is nine o'clock.' — São nove horas."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Complete: 'It is ___ o'clock.' (doze)
        correctAnswer: twelve
        rationale: "'It is twelve o'clock.' — São doze horas (meio-dia ou meia-noite)."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'meio-dia' em inglês?
        correctAnswer: noon
        rationale: "'noon' = meio-dia. 'midday' também é correto."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'meia-noite' em inglês?
        correctAnswer: midnight
        rationale: "'midnight' = meia-noite. 'mid' + 'night'."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: O que significa 'o'clock'?
        correctAnswer: em ponto (hora exata)
        rationale: "'o'clock' significa que são horas exatas, sem minutos."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
  - pageNumber: 2
    title: Meias horas e quartos
    description: Aprenda 'half past' e 'quarter past/to'.
    exercises:
      - type: english_vocab
        question: Como se diz 'É uma e meia.' em inglês?
        correctAnswer: It is half past one.
        rationale: "'It is half past one.' — 'half past' = e meia."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'São três e meia.' em inglês?
        correctAnswer: It is half past three.
        rationale: "'It is half past three.' — 'half past three' = 3:30."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: O que significa 'half past'?
        correctAnswer: e meia (30 minutos)
        rationale: "'half past' = e meia. Half past two = duas e meia."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'É duas e quinze.' em inglês?
        correctAnswer: It is quarter past two.
        rationale: "'It is quarter past two.' — 'quarter past' = e quinze."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: O que significa 'quarter'?
        correctAnswer: um quarto (15 minutos)
        rationale: "'quarter' = um quarto. Quarter past = e quinze. Quarter to = menos quinze."
        difficulty: 1
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Complete: 'It is half past ___.' (cinco e meia)
        correctAnswer: five
        rationale: "'It is half past five.' — Cinco e meia."
        difficulty: 2
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'São oito e meia.' em inglês?
        correctAnswer: It is half past eight.
        rationale: "'It is half past eight.' — 8:30."
        difficulty: 2
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'Eu acordo às sete horas.' em inglês?
        correctAnswer: I wake up at seven o'clock.
        rationale: "'I wake up at seven o'clock.' — 'at' com horas."
        difficulty: 2
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Como se diz 'A escola começa às oito.' em inglês?
        correctAnswer: School starts at eight o'clock.
        rationale: "'School starts at eight o'clock.' — 'at' + hora."
        difficulty: 2
        objectives: [pre-A1.vocab.time]
      - type: english_vocab
        question: Complete: 'I go to bed at ___ o'clock.' (dez)
        correctAnswer: ten
        rationale: "'I go to bed at ten o'clock.' — Vou dormir às dez horas."
        difficulty: 2
        objectives: [pre-A1.vocab.time]
target: 20
