title: ☀️ English 3A - Clima e tempo
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.weather
authorNotes: Vocabulário de clima e tempo — sunny, rainy, cloudy, cold, hot.
repeatAll: 2
example: "Ex.: 'It is sunny today.' 'It is cold and windy.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Tipos de clima
    description: Aprenda sunny, rainy, cloudy, windy, snowy.
    exercises:
      - type: english_vocab
        question: Como se diz 'ensolarado' em inglês?
        correctAnswer: sunny
        rationale: "'sunny' = ensolarado. It is sunny today."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'chuvoso' em inglês?
        correctAnswer: rainy
        rationale: "'rainy' = chuvoso. It is rainy. I need an umbrella."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'nublado' em inglês?
        correctAnswer: cloudy
        rationale: "'cloudy' = nublado. It is cloudy."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'ventoso' em inglês?
        correctAnswer: windy
        rationale: "'windy' = ventoso. It is windy today."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'nevando' em inglês? (adj.)
        correctAnswer: snowy
        rationale: "'snowy' = nevando/nevoso. It is snowy in winter."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: "Complete: 'It is ___ today.' (ensolarado)"
        correctAnswer: sunny
        rationale: "'It is sunny today.' — Está ensolarado hoje."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: "Complete: 'Take an umbrella! It is ___.' (chuvoso)"
        correctAnswer: rainy
        rationale: "'Take an umbrella! It is rainy.' — Leve um guarda-chuva!"
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'Como está o tempo?' em inglês?
        correctAnswer: What is the weather like?
        rationale: "'What is the weather like?' — Pergunta padrão sobre o tempo."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: "Responda: 'What is the weather like?' — (está ensolarado)"
        correctAnswer: It is sunny.
        rationale: "'It is sunny.' — Resposta com 'It is + adjetivo de clima'."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: "Complete: 'It is ___ and ___.' (nublado e ventoso)"
        correctAnswer: cloudy and windy
        rationale: "'It is cloudy and windy.' — Dois adjetivos com 'and'."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
  - pageNumber: 2
    title: Temperatura e estações
    description: Aprenda hot, cold, warm e vocabulário de estações.
    exercises:
      - type: english_vocab
        question: Como se diz 'quente' em inglês?
        correctAnswer: hot
        rationale: "'hot' = quente. It is hot in summer."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'frio' em inglês?
        correctAnswer: cold
        rationale: "'cold' = frio. It is cold in winter."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'morno/agradável' em inglês?
        correctAnswer: warm
        rationale: "'warm' = morno, agradável. It is warm in spring."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'verão' em inglês?
        correctAnswer: summer
        rationale: "'summer' = verão. It is hot in summer."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'inverno' em inglês?
        correctAnswer: winter
        rationale: "'winter' = inverno. It is cold in winter."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: "Complete: 'In summer it is ___.' (quente)"
        correctAnswer: hot
        rationale: "'In summer it is hot.' — No verão está quente."
        difficulty: 1
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: "Complete: 'In winter it is ___.' (frio)"
        correctAnswer: cold
        rationale: "'In winter it is cold.' — No inverno está frio."
        difficulty: 2
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'Hoje está quente e ensolarado.' em inglês?
        correctAnswer: Today it is hot and sunny.
        rationale: "'Today it is hot and sunny.' — Temperatura + clima."
        difficulty: 2
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Como se diz 'Está chovendo.' em inglês?
        correctAnswer: It is raining.
        rationale: "'It is raining.' — Presente contínuo. '-ing' para ações em andamento."
        difficulty: 2
        objectives: [pre-A1.vocab.weather]
      - type: english_vocab
        question: Liste os 5 adjetivos de clima desta lição
        correctAnswer: sunny, rainy, cloudy, windy, snowy
        rationale: "sunny, rainy, cloudy, windy, snowy — os 5 adjetivos de clima."
        difficulty: 2
        objectives: [pre-A1.vocab.weather]
target: 20
