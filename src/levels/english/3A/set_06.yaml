title: 🎒 English 3A - Objetos escolares
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.school
authorNotes: Objetos usados na escola — pencil, pen, book, ruler, eraser.
repeatAll: 2
example: "Ex.: 'I have a pencil.' 'The book is on the desk.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Material escolar
    description: Aprenda pencil, pen, book, ruler, eraser, bag.
    exercises:
      - type: english_vocab
        question: Como se diz 'lápis' em inglês?
        correctAnswer: pencil
        rationale: "'pencil' = lápis. A yellow pencil."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'caneta' em inglês?
        correctAnswer: pen
        rationale: "'pen' = caneta. A blue pen."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'livro' em inglês?
        correctAnswer: book
        rationale: "'book' = livro. An English book."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'régua' em inglês?
        correctAnswer: ruler
        rationale: "'ruler' = régua. A plastic ruler."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'borracha' em inglês?
        correctAnswer: eraser
        rationale: "'eraser' = borracha. A pink eraser."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'mochila' em inglês?
        correctAnswer: backpack
        rationale: "'backpack' = mochila. A red backpack."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'I write with a ___.' (caneta)
        correctAnswer: pen
        rationale: "'I write with a pen.' — Escrevo com caneta."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'I draw with a ___.' (lápis)
        correctAnswer: pencil
        rationale: "'I draw with a pencil.' — Desenho com lápis."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'My ___ is heavy.' (mochila)
        correctAnswer: backpack
        rationale: "'My backpack is heavy.' — Minha mochila é pesada."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'caderno' em inglês?
        correctAnswer: notebook
        rationale: "'notebook' = caderno. 'note' + 'book'."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
  - pageNumber: 2
    title: Móveis e lugares na escola
    description: Aprenda desk, chair, board, classroom e mais.
    exercises:
      - type: english_vocab
        question: Como se diz 'carteira/mesa' (escolar) em inglês?
        correctAnswer: desk
        rationale: "'desk' = carteira/mesa escolar. Sit at the desk."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'cadeira' em inglês?
        correctAnswer: chair
        rationale: "'chair' = cadeira. Sit on the chair."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'quadro/lousa' em inglês?
        correctAnswer: board
        rationale: "'board' = lousa/quadro. The teacher writes on the board."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'sala de aula' em inglês?
        correctAnswer: classroom
        rationale: "'classroom' = sala de aula. 'class' + 'room'."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'The book is on the ___.' (carteira)
        correctAnswer: desk
        rationale: "'The book is on the desk.' — O livro está na carteira."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'Sit on your ___.' (cadeira)
        correctAnswer: chair
        rationale: "'Sit on your chair.' — Sente na sua cadeira."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Liste 5 objetos escolares em inglês
        correctAnswer: pencil, pen, book, ruler, eraser
        rationale: "pencil, pen, book, ruler, eraser — 5 objetos essenciais."
        difficulty: 2
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'Abra seu livro.' em inglês? (comando)
        correctAnswer: Open your book.
        rationale: "'Open your book.' — Comando com verbo base. 'open' = abrir."
        difficulty: 2
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'Feche seu caderno.' em inglês? (comando)
        correctAnswer: Close your notebook.
        rationale: "'Close your notebook.' — 'close' = fechar."
        difficulty: 2
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'Eu preciso de uma borracha.' em inglês?
        correctAnswer: I need an eraser.
        rationale: "'I need an eraser.' — 'an' porque 'eraser' começa com vogal."
        difficulty: 2
        objectives: [pre-A1.vocab.school]
target: 20
