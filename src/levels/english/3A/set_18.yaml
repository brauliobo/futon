title: 💪 English 3A - Partes do corpo
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.body
authorNotes: Partes do corpo humano em inglês — head, eyes, ears, nose, hands, feet.
repeatAll: 2
example: "Ex.: 'I have two eyes.' 'My head hurts.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Cabeça e rosto
    description: Aprenda head, face, eyes, ears, nose, mouth, hair.
    exercises:
      - type: english_vocab
        question: Como se diz 'cabeça' em inglês?
        correctAnswer: head
        rationale: "'head' = cabeça. My head hurts."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'rosto/face' em inglês?
        correctAnswer: face
        rationale: "'face' = rosto. A happy face."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'olhos' em inglês?
        correctAnswer: eyes
        rationale: "'eyes' = olhos. Blue eyes."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'orelhas' em inglês?
        correctAnswer: ears
        rationale: "'ears' = orelhas. Big ears."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'nariz' em inglês?
        correctAnswer: nose
        rationale: "'nose' = nariz. A big nose."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'boca' em inglês?
        correctAnswer: mouth
        rationale: "'mouth' = boca. Open your mouth."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'cabelo' em inglês?
        correctAnswer: hair
        rationale: "'hair' = cabelo. Long hair."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Complete: 'I have two ___.' (olhos)
        correctAnswer: eyes
        rationale: "'I have two eyes.' — Tenho dois olhos."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Complete: 'She has brown ___.' (cabelo)
        correctAnswer: hair
        rationale: "'She has brown hair.' — Ela tem cabelo marrom."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Complete: 'Open your ___!' (boca)
        correctAnswer: mouth
        rationale: "'Open your mouth!' — Abra sua boca!"
        difficulty: 1
        objectives: [pre-A1.vocab.body]
  - pageNumber: 2
    title: Corpo todo
    description: Aprenda neck, shoulders, arms, hands, legs, feet.
    exercises:
      - type: english_vocab
        question: Como se diz 'pescoço' em inglês?
        correctAnswer: neck
        rationale: "'neck' = pescoço. A long neck."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'ombros' em inglês?
        correctAnswer: shoulders
        rationale: "'shoulders' = ombros. Broad shoulders."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'braços' em inglês?
        correctAnswer: arms
        rationale: "'arms' = braços. Two arms."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'mãos' em inglês?
        correctAnswer: hands
        rationale: "'hands' = mãos. Wash your hands."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'pernas' em inglês?
        correctAnswer: legs
        rationale: "'legs' = pernas. Two legs."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'pés' em inglês?
        correctAnswer: feet
        rationale: "'feet' = pés. Plural irregular de 'foot'."
        difficulty: 1
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Qual é o singular de 'feet'?
        correctAnswer: foot
        rationale: "'foot' → 'feet'. Plural irregular. One foot, two feet."
        difficulty: 2
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Complete: 'I have two ___ and two ___.' (braços/pernas)
        correctAnswer: arms and two legs
        rationale: "'I have two arms and two legs.' — Braços e pernas."
        difficulty: 2
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Como se diz 'Lave as mãos!' em inglês?
        correctAnswer: Wash your hands!
        rationale: "'Wash your hands!' — Comando: 'wash' = lavar."
        difficulty: 2
        objectives: [pre-A1.vocab.body]
      - type: english_vocab
        question: Liste 4 partes da cabeça em inglês
        correctAnswer: eyes, ears, nose, mouth
        rationale: "eyes (olhos), ears (orelhas), nose (nariz), mouth (boca)."
        difficulty: 2
        objectives: [pre-A1.vocab.body]
target: 20
