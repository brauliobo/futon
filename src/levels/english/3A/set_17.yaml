title: 🏫 English 3A - Na escola
level: 3A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.school
authorNotes: Vocabulário da escola — teacher, student, class, homework, test.
repeatAll: 2
example: "Ex.: 'My teacher is kind.' 'I do my homework.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Pessoas e lugares na escola
    description: Aprenda teacher, student, principal, library, gym.
    exercises:
      - type: english_vocab
        question: Como se diz 'professor(a)' em inglês?
        correctAnswer: teacher
        rationale: "'teacher' = professor(a). My teacher is kind."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'aluno/estudante' em inglês?
        correctAnswer: student
        rationale: "'student' = aluno, estudante. I am a student."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'diretor(a)' em inglês?
        correctAnswer: principal
        rationale: "'principal' = diretor(a) da escola."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'biblioteca' em inglês?
        correctAnswer: library
        rationale: "'library' = biblioteca. I read in the library."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'ginásio' em inglês?
        correctAnswer: gym
        rationale: "'gym' = ginásio/academia. We play sports in the gym."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'My ___ is very kind.' (professora)
        correctAnswer: teacher
        rationale: "'My teacher is very kind.' — Minha professora é muito gentil."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'I am a ___ at this school.' (aluno)
        correctAnswer: student
        rationale: "'I am a student at this school.' — Sou aluno nesta escola."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'cantina/refeitório' em inglês?
        correctAnswer: canteen
        rationale: "'canteen' = cantina/refeitório escolar."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'pátio' em inglês?
        correctAnswer: playground
        rationale: "'playground' = pátio/parquinho. We play in the playground."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'I read books in the ___.' (biblioteca)
        correctAnswer: library
        rationale: "'I read books in the library.' — Leio livros na biblioteca."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
  - pageNumber: 2
    title: Atividades escolares
    description: Aprenda homework, test, lesson, recess e mais.
    exercises:
      - type: english_vocab
        question: Como se diz 'lição de casa' em inglês?
        correctAnswer: homework
        rationale: "'homework' = lição de casa. I do my homework."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'prova/teste' em inglês?
        correctAnswer: test
        rationale: "'test' = prova, teste. I have a test today."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'aula/lição' em inglês?
        correctAnswer: lesson
        rationale: "'lesson' = aula. An English lesson."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'recreio' em inglês?
        correctAnswer: recess
        rationale: "'recess' = recreio. We play at recess."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'I do my ___ after school.' (lição de casa)
        correctAnswer: homework
        rationale: "'I do my homework after school.' — Faço lição depois da escola."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Complete: 'I have an English ___ today.' (aula)
        correctAnswer: lesson
        rationale: "'I have an English lesson today.' — Tenho aula de inglês hoje."
        difficulty: 1
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'Tenho uma prova amanhã.' em inglês?
        correctAnswer: I have a test tomorrow.
        rationale: "'I have a test tomorrow.' — 'tomorrow' = amanhã."
        difficulty: 2
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'Brinco no recreio.' em inglês?
        correctAnswer: I play at recess.
        rationale: "'I play at recess.' — 'at recess' = no recreio."
        difficulty: 2
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Liste 5 palavras sobre a escola em inglês
        correctAnswer: teacher, student, homework, test, library
        rationale: "teacher, student, homework, test, library — vocabulário escolar."
        difficulty: 2
        objectives: [pre-A1.vocab.school]
      - type: english_vocab
        question: Como se diz 'Minha professora corrige minha lição.' em inglês?
        correctAnswer: My teacher marks my homework.
        rationale: "'My teacher marks my homework.' — 'marks' = corrige."
        difficulty: 2
        objectives: [pre-A1.vocab.school]
target: 20
