title: 🌍 English A - Countries & Nationalities
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: "Países e nacionalidades. Em inglês, nacionais e idiomas são escritos com letra maiúscula."
repeatAll: 2
example: "Type the English word. Ex.: Brasil → Brazil."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Countries
    description: Type the English name of each country.
    exercises:
      - type: english_vocab
        question: Brasil
        correctAnswer: Brazil
        rationale: "Em inglês, 'z' (AmE) ou 's' (BrE). 'Bra-ZIL'. Maiúscula sempre."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Estados Unidos
        correctAnswer: United States
        rationale: "Sempre com 'the' — 'the United States'. Abreviação: 'the US' ou 'the USA'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Inglaterra
        correctAnswer: England
        rationale: "'ENG-land'. Parte do Reino Unido (UK). 'Britain' é diferente de 'England'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Japão
        correctAnswer: Japan
        rationale: "Cognato próximo. 'Ja-PAN'. Os japoneses chamam o país de 'Nihon'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: França
        correctAnswer: France
        rationale: "Cognato direto. 'FRANTS'. Maiúscula em inglês."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Alemanha
        correctAnswer: Germany
        rationale: "Bem diferente do alemão ('Deutschland'). 'JER-ma-ni'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: China
        correctAnswer: China
        rationale: "Cognato direto. 'CHAI-na'. Também significa 'porcelana' (substantivo comum)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Itália
        correctAnswer: Italy
        rationale: "'I-ta-li'. Cognato próximo. Sem o acento de 'Itália'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: México
        correctAnswer: Mexico
        rationale: "Cognato. Pronúncia inglesa: 'MEK-si-ko'. O 'x' soa 'ks'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Austrália
        correctAnswer: Australia
        rationale: "Cognato direto. 'os-TREIL-ya'. Não confundir com 'Austria' (Áustria)."
        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: Nationalities & Languages
    description: Type the English word for each nationality or language.
    exercises:
      - type: english_vocab
        question: Brasileiro
        correctAnswer: Brazilian
        rationale: "Vem de 'Brazil' + '-ian'. Língua = 'Portuguese'. Maiúscula sempre."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Inglês (língua/pessoa)
        correctAnswer: English
        rationale: "Vem de 'England'. Mesmo para a língua e a nacionalidade. 'ING-glish'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Japonês
        correctAnswer: Japanese
        rationale: "'Japan' + '-ese'. Mesmo para língua e pessoa. 'Ja-pa-NEEZ'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Americano
        correctAnswer: American
        rationale: "Vem de 'America'. Língua = 'English'. 'a-MER-i-kan'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Francês
        correctAnswer: French
        rationale: "Não tem relação óbvia com 'France'. Também 'french fries' (batata frita)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Alemão
        correctAnswer: German
        rationale: "Vem de 'Germany'. Língua = 'German'. 'JER-man'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Chinês
        correctAnswer: Chinese
        rationale: "'China' + '-ese'. Mesmo para língua e pessoa. 'Chai-NEEZ'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Italiano
        correctAnswer: Italian
        rationale: "'Italy' + '-an'. Língua = 'Italian'. 'i-TAL-yan'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Espanhol
        correctAnswer: Spanish
        rationale: "Vem de 'Spain' (Espanha). Língua = 'Spanish'. 'SPAN-ish'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Português (língua)
        correctAnswer: Portuguese
        rationale: "Cognato. 'Por-chu-GEEZ'. A língua dos brasileiros em inglês."
        difficulty: 1
        objectives: [en.vocab]
target: 20
