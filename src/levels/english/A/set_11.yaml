title: English - Weather
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: "Vocabulário de clima. Estrutura 'It is + adjetivo' (It is sunny)."
repeatAll: 2
example: "Type the English word. Ex.: Sol → sunny"
pages:
  - pageNumber: 1
    title: Weather Conditions
    description: Type the English word for each weather.
    exercises:
      - type: english_vocab
        question: Ensolarado
        correctAnswer: sunny
        rationale: "Substantivo 'sun' + '-y' forma adjetivo. Duplica o N antes de '-y'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Chuvoso
        correctAnswer: rainy
        rationale: "'Rain' (chuva) + '-y'. Não duplica N (porque termina em vogal longa)."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Nublado
        correctAnswer: cloudy
        rationale: "'Cloud' (nuvem) + '-y'. Ditongo 'ou' soa 'au' — 'KLAU-di'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Ventoso
        correctAnswer: windy
        rationale: "'Wind' (vento) + '-y'. Pronúncia 'UIN-di' — 'w' soa 'u'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Frio
        correctAnswer: cold
        rationale: "Adjetivo sem '-y'. Comparativo — 'colder'. Rima com 'old'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Quente
        correctAnswer: hot
        rationale: "Três letras. Comparativo duplica o T — 'hotter'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Nevando
        correctAnswer: snowy
        rationale: "'Snow' (neve) + '-y'. 'Ow' soa 'ou'. Também 'it's snowing' (gerúndio)."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Com neblina
        correctAnswer: foggy
        rationale: "'Fog' (neblina) + '-y'. Duplica o G antes de '-y'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Tempestade
        correctAnswer: stormy
        rationale: "'Storm' (tempestade) + '-y'. Adjetivo — o substantivo é 'storm'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Morno
        correctAnswer: warm
        rationale: "'War' soa 'uôr'. Entre 'cool' (fresco) e 'hot' (quente)."

        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: Weather Phrases
    description: Translate weather sentences.
    exercises:
      - type: english_phrases
        question: Está ensolarado
        correctAnswer: it is sunny
        rationale: "'It' é sujeito vazio em tempo/clima — português omite, inglês exige."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Está chovendo
        correctAnswer: it is raining
        rationale: "Present continuous — 'is' + '-ing'. Ação em progresso."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Está quente hoje
        correctAnswer: it is hot today
        rationale: "Advérbios de tempo ('today', 'now') geralmente vão no final."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Está frio lá fora
        correctAnswer: it is cold outside
        rationale: "'Outside' é uma palavra só — 'out' + 'side'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Está nevando
        correctAnswer: it is snowing
        rationale: "'Snow' + '-ing'. Não duplica consoante (termina em vogal + W)."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Está ventando
        correctAnswer: it is windy
        rationale: "Inglês usa adjetivo 'windy', não o gerúndio 'winding'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Que tempo faz?
        correctAnswer: how is the weather
        rationale: "Wh-word 'how' + verbo 'is' + sujeito. 'Weather' sempre com artigo 'the'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Está um dia bonito
        correctAnswer: it is a nice day
        rationale: "'Day' é contável — exige artigo 'a' antes de 'nice day'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Vai chover amanhã
        correctAnswer: it will rain tomorrow
        rationale: "Futuro com 'will' + verbo base (sem '-s' nem '-ing')."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Eu gosto de dias ensolarados
        correctAnswer: i like sunny days
        rationale: "'I' sempre maiúsculo. 'Like' + plural sem artigo para ideia geral."

        difficulty: 1
        objectives: [en.vocab]
target: 20
