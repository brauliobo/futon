title: 💼 English A - Jobs & Professions
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: "Profissões em inglês. Muitas terminam em '-er' ou '-or'. Nenhuma variação de gênero."
repeatAll: 2
example: "Type the English word. Ex.: Dentista → dentist."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Common Jobs
    description: Type the English word for each job.
    exercises:
      - type: english_vocab
        question: Médico
        correctAnswer: doctor
        rationale: "Cognato. Termina em '-or'. 'DOC-tor'. Plural 'doctors'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Professor
        correctAnswer: teacher
        rationale: "Vem de 'to teach' (ensinar) + '-er'. 'TEE-cher'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Estudante
        correctAnswer: student
        rationale: "Cognato. 'STU-dent'. Sem variação de gênero — mesmo para menino e menina."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Policial
        correctAnswer: police officer
        rationale: "'Police' + 'officer'. Informal: 'cop'. 'Police' sozinho é plural coletivo."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Cozinheiro
        correctAnswer: cook
        rationale: "Também 'chef' (mais formal/profissional). 'Cook' é o cozinheiro do dia a dia."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Engenheiro
        correctAnswer: engineer
        rationale: "Cognato. 'en-ji-NEER'. Termina em '-eer' (som de 'ir')."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Enfermeiro
        correctAnswer: nurse
        rationale: "'Ur' soa 'er' fechado. Sem variação de gênero — mesmo para homem e mulher."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Motorista
        correctAnswer: driver
        rationale: "Vem de 'to drive' (dirigir) + '-er'. 'DRAI-ver'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Vendedor
        correctAnswer: seller
        rationale: "Vem de 'to sell' (vender) + '-er'. Duplo 'l'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Bombeiro
        correctAnswer: firefighter
        rationale: "'Fire' (fogo) + 'fighter' (lutador). Também 'fireman' (mais antigo)."
        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: More Professions
    description: Type the English word.
    exercises:
      - type: english_vocab
        question: Advogado
        correctAnswer: lawyer
        rationale: "'Law' (lei) + '-yer'. Soa 'LO-yer'. Também 'attorney' (AmE formal)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Jornalista
        correctAnswer: journalist
        rationale: "Cognato. 'JOR-na-list'. Vem de 'journal' (diário/jornal)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Artista
        correctAnswer: artist
        rationale: "Cognato direto. 'AR-tist'. Mesma raiz de 'art' (arte)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Músico
        correctAnswer: musician
        rationale: "Cognato. 'myu-ZI-shon'. Vem de 'music' + sufixo '-ian'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Cientista
        correctAnswer: scientist
        rationale: "Cognato. 'SAI-on-tist'. Vem de 'science' (ciência)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Arquiteto
        correctAnswer: architect
        rationale: "Cognato. 'AR-ki-tect'. Vem do grego 'arkhitekton'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Piloto
        correctAnswer: pilot
        rationale: "Cognato direto. 'PAI-lot'. Mesmo para avião, barco ou fórmula 1."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Dentista
        correctAnswer: dentist
        rationale: "Cognato. 'DEN-tist'. Vem do latim 'dens' (dente)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Fazendeiro
        correctAnswer: farmer
        rationale: "Vem de 'farm' (fazenda) + '-er'. 'FAR-mer'. Também 'rancher' (pecuarista)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Escritor
        correctAnswer: writer
        rationale: "Vem de 'to write' (escrever) + '-er'. O 'w' de 'write' é mudo."
        difficulty: 1
        objectives: [en.vocab]
target: 20
