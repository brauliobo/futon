title: English - Greetings & Phrases
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: Conjunto de english/A.
repeatAll: 2
example: "Type the English phrase. Ex.: Bom dia → good morning"
pages:
  - pageNumber: 1
    title: Greetings
    description: Type the English greeting.
    exercises:
      - type: english_phrases
        question: Olá
        correctAnswer: hello
        rationale: "Duplo L. Pronúncia 're-LÔ'. Usado em qualquer hora do dia."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Oi
        correctAnswer: hi
        rationale: "Informal — entre amigos e família. Evite em contextos formais."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Bom dia
        correctAnswer: good morning
        rationale: "Usado até o meio-dia. 'Morning' não leva artigo aqui."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Boa tarde
        correctAnswer: good afternoon
        rationale: "'Afternoon' é composto — 'after' (depois) + 'noon' (meio-dia)."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Boa noite (cumprimento)
        correctAnswer: good evening
        rationale: "'Evening' = começo da noite (ainda acordado). Usado ao chegar."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Boa noite (despedida)
        correctAnswer: good night
        rationale: "'Night' = na hora de dormir ou sair. Só na despedida, nunca ao chegar."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Tchau
        correctAnswer: bye
        rationale: "Informal. 'Goodbye' (formal) é 'good' + 'bye' — origem 'God be with you'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Até logo
        correctAnswer: see you later
        rationale: "Literal 'ver você mais tarde'. 'See ya' é forma falada."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Bem-vindo
        correctAnswer: welcome
        rationale: "Também usado como resposta a 'thank you' — 'you are welcome'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Até amanhã
        correctAnswer: see you tomorrow
        rationale: "'Tomorrow' — duplo R. Pronúncia 'tu-MÓ-rou'."

        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: Polite Phrases
    description: Type the English phrase.
    exercises:
      - type: english_phrases
        question: Por favor
        correctAnswer: please
        rationale: "Duplo 'ee' longo. Pode vir no fim ou início do pedido."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Obrigado
        correctAnswer: thank you
        rationale: "'Th' com língua entre os dentes. Não varia com gênero — 'thank you' serve para todos."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: De nada
        correctAnswer: you are welcome
        rationale: "Resposta padrão a 'thank you'. Informal — 'no problem' ou 'sure'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Desculpe
        correctAnswer: sorry
        rationale: "Para pedir perdão. Para pedir licença, use 'excuse me'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Com licença
        correctAnswer: excuse me
        rationale: "Para chamar atenção ou passar. 'X' soa 'ks'. Não é 'sorry'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Sim
        correctAnswer: yes
        rationale: "Três letras. Informal — 'yeah' ou 'yep'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Não
        correctAnswer: "no"
        rationale: "Duas letras. Também pode ser adjetivo — 'no money' (nenhum dinheiro)."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Como vai?
        correctAnswer: how are you
        rationale: "Inversão auxiliar-sujeito — 'are' antes de 'you' em pergunta."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Estou bem
        correctAnswer: i am fine
        rationale: "'I' sempre maiúsculo em inglês. 'Fine' = bem; 'great' = ótimo."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_phrases
        question: Qual é seu nome?
        correctAnswer: what is your name
        rationale: "'What' (Wh-word) + 'is' + sujeito. Contração comum — 'what's your name'."

        difficulty: 1
        objectives: [en.vocab]
target: 20
