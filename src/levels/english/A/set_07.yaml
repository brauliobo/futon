      - { type: english_phrases, question: "Boa tarde", correctAnswer: good afternoon }
      - { type: english_phrases, question: "Boa noite (cumprimento)", correctAnswer: good evening }
      - { type: english_phrases, question: "Boa noite (despedida)", correctAnswer: good night }
      - { type: english_phrases, question: "Tchau", correctAnswer: bye }
      - { type: english_phrases, question: "Até logo", correctAnswer: see you later }
      - { type: english_phrases, question: "Bem-vindo", correctAnswer: welcome }
      - { type: english_phrases, question: "Até amanhã", correctAnswer: see you tomorrow }
