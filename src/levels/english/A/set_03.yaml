title: English - Numbers
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: Conjunto de english/A.
repeatAll: 2
example: "Type the English number word. Ex.: 1 → one"
pages:
  - pageNumber: 1
    title: Numbers 1-10
    description: Type the English word for each number.
    exercises:
      - type: english_vocab
        question: "1"
        correctAnswer: one
        rationale: "Pronúncia 'uan'. 'O' inicial soa 'u' — surpresa de quem começa."

      - type: english_vocab
        question: "2"
        correctAnswer: two
        rationale: "'W' é mudo. Pronúncia igual a 'too' e 'to'."

      - type: english_vocab
        question: "3"
        correctAnswer: three
        rationale: "'Th' com língua entre os dentes. Plural de 'three' não existe."

      - type: english_vocab
        question: "4"
        correctAnswer: four
        rationale: "'Ou' soa 'ô'. Não confunda com 'for' (preposição)."

      - type: english_vocab
        question: "5"
        correctAnswer: five
        rationale: "'I_e' forma som longo 'ai'. '-ve' final soa 'v' leve."

      - type: english_vocab
        question: "6"
        correctAnswer: six
        rationale: "'X' final soa 'ks'. Rima com 'fix' e 'mix'."

      - type: english_vocab
        question: "7"
        correctAnswer: seven
        rationale: "Duas sílabas, 'SE-ven'. Também o dia 'Saturday' começa com 'S'."

      - type: english_vocab
        question: "8"
        correctAnswer: eight
        rationale: "'Gh' é mudo. Pronúncia 'eit' — rima com 'late'."

      - type: english_vocab
        question: "9"
        correctAnswer: nine
        rationale: "'I_e' forma som longo 'ai'. Plural 'nines'."

      - type: english_vocab
        question: "10"
        correctAnswer: ten
        rationale: "Três letras, vogal curta. Rima com 'pen' e 'hen'."

  - pageNumber: 2
    title: Numbers 11-20
    description: Type the English word for each number.
    exercises:
      - type: english_vocab
        question: "11"
        correctAnswer: eleven
        rationale: "Três sílabas 'e-LE-ven'. Forma única — não segue padrão '-teen'."

      - type: english_vocab
        question: "12"
        correctAnswer: twelve
        rationale: "Forma irregular (vem do antigo 'twa-lif' = 2+10). Cuidado — termina em '-ve'."

      - type: english_vocab
        question: "13"
        correctAnswer: thirteen
        rationale: "'Thir' + 'teen'. De 13 a 19 sempre tem sufixo '-teen'."

      - type: english_vocab
        question: "14"
        correctAnswer: fourteen
        rationale: "'Four' (4) + 'teen'. Mantém a forma de 'four'."

      - type: english_vocab
        question: "15"
        correctAnswer: fifteen
        rationale: "'Five' vira 'fif' + 'teen' (perde o 'v'). Irregular."

      - type: english_vocab
        question: "16"
        correctAnswer: sixteen
        rationale: "'Six' + 'teen'. Padrão regular."

      - type: english_vocab
        question: "17"
        correctAnswer: seventeen
        rationale: "'Seven' + 'teen'. Quatro sílabas no total."

      - type: english_vocab
        question: "18"
        correctAnswer: eighteen
        rationale: "'Eight' + 'een' (um 't' só). 'Gh' mudo, pronúncia 'ei-TIN'."

      - type: english_vocab
        question: "19"
        correctAnswer: nineteen
        rationale: "'Nine' + 'teen'. Tônica no 'teen' — diferente de 'ninety'."

      - type: english_vocab
        question: "20"
        correctAnswer: twenty
        rationale: "Quebra o padrão '-teen'. Aqui é '-ty' (20, 30, 40... todos terminam em '-ty')."

target: 20
