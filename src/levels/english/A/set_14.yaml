title: 🏠 English A - House & Rooms
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: "Cômodos e móveis da casa. 'Lounge' é outra palavra britânica para sala de estar."
repeatAll: 2
example: "Type the English word. Ex.: Cozinha → kitchen."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Rooms in the House
    description: Type the English word for each room.
    exercises:
      - type: english_vocab
        question: Cozinha
        correctAnswer: kitchen
        rationale: "'Ki' + 'tchen' — o 'tch' soa como em 'watch'. 'KI-tchin'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Quarto
        correctAnswer: bedroom
        rationale: "Composta: 'bed' (cama) + 'room' (quarto). A cama define o cômodo."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Banheiro
        correctAnswer: bathroom
        rationale: "Composta: 'bath' (banho) + 'room'. 'Restroom' é o banheiro público."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Sala de estar
        correctAnswer: living room
        rationale: "Duas palavras: 'living' (estar/viver) + 'room'. Também 'lounge' (BrE)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Sala de jantar
        correctAnswer: dining room
        rationale: "'Dining' vem de 'to dine' (jantar). 'Di-ning room'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Garagem
        correctAnswer: garage
        rationale: "Cognato. AmE: 'ga-RAZH'; BrE: 'GA-rij'. O 'g' final soa 'zh'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Jardim
        correctAnswer: garden
        rationale: "Cognato parcial. 'Garden' também é quintal (BrE). AmE usa 'yard' para quintal."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Varanda
        correctAnswer: balcony
        rationale: "Cognato próximo. Pronúncia 'BAL-co-ni'. Plural 'balconies'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Escritório
        correctAnswer: office
        rationale: "Em casa também se chama 'home office'. 'OF-is'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Corredor
        correctAnswer: hallway
        rationale: "Composta: 'hall' + 'way'. 'Hall' sozinho também funciona."
        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: Furniture & Objects
    description: Type the English word for each item.
    exercises:
      - type: english_vocab
        question: Mesa
        correctAnswer: table
        rationale: "Cognato com 'tábua'. '-le' mudo no fim — soa 'TEI-bol'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Cadeira
        correctAnswer: chair
        rationale: "'Ch' soa 'tch'. Rima com 'hair' e 'air'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Cama
        correctAnswer: bed
        rationale: "Três letras. Rima com 'red' e 'head'. Plural 'beds'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Sofá
        correctAnswer: sofa
        rationale: "Cognato direto. Também 'couch' (mais informal). 'SOF-a'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Janela
        correctAnswer: window
        rationale: "'Wind' (vento) + 'ow'. Pronúncia 'UIN-dou'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Porta
        correctAnswer: door
        rationale: "Duplo 'oo' longo + 'r'. Soa 'dor'. Plural 'doors'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Escada
        correctAnswer: stairs
        rationale: "Quase sempre plural 'stairs'. 'A flight of stairs' = um lance de escada."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Geladeira
        correctAnswer: fridge
        rationale: "Abreviação de 'refrigerator'. 'Fridge' é o uso cotidiano. 'Fr' + 'idge'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Fogão
        correctAnswer: stove
        rationale: "'Ov' soa 'ov'. Também 'cooker' (BrE). Rima com 'cove' e 'drove'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Espelho
        correctAnswer: mirror
        rationale: "Duplo 'r' — pronúncia 'MI-ror'. Rima com 'nearer'."
        difficulty: 1
        objectives: [en.vocab]
target: 20
