title: English - Animals
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: "Vocabulário de animais em inglês. Plurais irregulares (mouse→mice, sheep→sheep)."
repeatAll: 2
example: "Type the English word. Ex.: Cachorro → dog"
pages:
  - pageNumber: 1
    title: Pets & Farm Animals
    description: Type the English word for each animal.
    exercises:
      - type: english_vocab
        question: Cachorro
        correctAnswer: dog
        rationale: "Três letras, vogal curta. Plural 'dogs' — soa 'dogz'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Gato
        correctAnswer: cat
        rationale: "Três letras, vogal curta. Rima com 'hat' e 'bat'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Pássaro
        correctAnswer: bird
        rationale: "'Ir' soa 'ér' fechado. Mesmo som que 'girl' e 'shirt'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Peixe
        correctAnswer: fish
        rationale: "'Sh' soa 'ch'. Singular e plural iguais quando é comida ('fish')."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Coelho
        correctAnswer: rabbit
        rationale: "Duplo B. Vogal curta 'a', sílaba tônica no início."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Vaca
        correctAnswer: cow
        rationale: "Ditongo 'ow' soa 'au'. Rima com 'now' e 'how'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Porco
        correctAnswer: pig
        rationale: "Três letras, vogal curta 'i'. Rima com 'big' e 'dig'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Cavalo
        correctAnswer: horse
        rationale: "'Or' puxa o som como em 'north'. '-se' final é mudo."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Ovelha
        correctAnswer: sheep
        rationale: "Duplo 'ee' longo. Singular e plural iguais — 'one sheep, two sheep'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Galinha
        correctAnswer: chicken
        rationale: "'Ch' soa 'tch'. A carne é 'chicken'; o macho é 'rooster'."
        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: Wild Animals
    description: Type the English word for each wild animal.
    exercises:
      - type: english_vocab
        question: Leão
        correctAnswer: lion
        rationale: "Duas sílabas, 'LAI-on'. Fêmea é 'lioness'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Tigre
        correctAnswer: tiger
        rationale: "Cognato. Termina em '-er' (como 'river', 'mother')."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Elefante
        correctAnswer: elephant
        rationale: "Cognato, mas cuidado — 'ph' soa 'f'. Três sílabas 'E-le-fant'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Urso
        correctAnswer: bear
        rationale: "'Ea' aqui soa 'er' (não 'ír'). Homófono de 'bare' (nu)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Macaco
        correctAnswer: monkey
        rationale: "'O' soa 'a' curto — 'MAN-ki'. Termina em '-ey'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Cobra
        correctAnswer: snake
        rationale: "'A_e' forma som longo de 'ei'. Rima com 'lake' e 'make'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Rato
        correctAnswer: mouse
        rationale: "'Ou' soa 'au'. Plural irregular — 'mice', não 'mouses'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Lobo
        correctAnswer: wolf
        rationale: "'Ol' soa 'ul'. Plural irregular — 'wolves'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Raposa
        correctAnswer: fox
        rationale: "'X' final soa 'ks'. Rima com 'box' e 'socks'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Zebra
        correctAnswer: zebra
        rationale: "Cognato total. Britânico diz 'ZE-bra'; americano diz 'ZI-bra'."
        difficulty: 1
        objectives: [en.vocab]
target: 20
