title: English - Clothes
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: Conjunto de english/A.
repeatAll: 2
example: "Type the English word. Ex.: Camisa → shirt"
pages:
  - pageNumber: 1
    title: Basic Clothes
    description: Type the English word for each clothing item.
    exercises:
      - type: english_vocab
        question: Camisa
        correctAnswer: shirt
        rationale: "'Ir' soa 'ér' fechado. Mesmo som que em 'bird' e 'girl'."

      - type: english_vocab
        question: Calça
        correctAnswer: pants
        rationale: "Sempre plural (mesmo sendo uma peça só) — 'a pair of pants'."

      - type: english_vocab
        question: Sapato
        correctAnswer: shoe
        rationale: "'Sh' + 'oe' soa 'xu'. Plural 'shoes' — 'a pair of shoes'."

      - type: english_vocab
        question: Chapéu
        correctAnswer: hat
        rationale: "Três letras, 'h' pronunciado. Rima com 'cat' e 'bat'."

      - type: english_vocab
        question: Vestido
        correctAnswer: dress
        rationale: "Duplo S. Verbo também — 'to dress' (vestir-se)."

      - type: english_vocab
        question: Saia
        correctAnswer: skirt
        rationale: "'Ir' soa 'ér' fechado. Cuidado — 'shirt' (camisa) tem outras letras iniciais."

      - type: english_vocab
        question: Casaco
        correctAnswer: coat
        rationale: "'Oa' forma som longo 'ou'. Rima com 'goat' e 'boat'."

      - type: english_vocab
        question: Meia
        correctAnswer: sock
        rationale: "Termina em 'ck' seco. Plural 'socks' — 'a pair of socks'."

      - type: english_vocab
        question: Luva
        correctAnswer: glove
        rationale: "'O' soa 'a' curto — pronúncia 'glav'. Plural 'gloves' (par)."

      - type: english_vocab
        question: Cinto
        correctAnswer: belt
        rationale: "Quatro letras, 'l' pronunciado. Rima com 'felt' e 'melt'."

  - pageNumber: 2
    title: Accessories & More
    description: Type the English word.
    exercises:
      - type: english_vocab
        question: Relógio
        correctAnswer: watch
        rationale: "'Watch' é de pulso; 'clock' é de parede. 'Ch' soa 'tch'."

      - type: english_vocab
        question: Óculos
        correctAnswer: glasses
        rationale: "Sempre plural — 'a pair of glasses'. Singular 'a glass' = copo."

      - type: english_vocab
        question: Bolsa
        correctAnswer: bag
        rationale: "Três letras. Plural 'bags'. Rima com 'tag' e 'flag'."

      - type: english_vocab
        question: Cachecol
        correctAnswer: scarf
        rationale: "Plural irregular — 'scarves' (ou 'scarfs'). 'F' vira 'ves'."

      - type: english_vocab
        question: Suéter
        correctAnswer: sweater
        rationale: "'Ea' soa 'é' curto — 'SUÉ-ter'. Cognato informal."

      - type: english_vocab
        question: Camiseta
        correctAnswer: t-shirt
        rationale: "Hifenizado — a letra 'T' descreve o formato da peça."

      - type: english_vocab
        question: Bota
        correctAnswer: boot
        rationale: "Duplo 'oo' longo. Plural 'boots'. Também usado em PC — 'dar boot'."

      - type: english_vocab
        question: Anel
        correctAnswer: ring
        rationale: "Também verbo (tocar/ligar). 'Ring a bell' — literal e idiomático."

      - type: english_vocab
        question: Pijama
        correctAnswer: pajamas
        rationale: "Sempre plural — 'a pair of pajamas'. BrE — 'pyjamas' (com 'y')."

      - type: english_vocab
        question: Biquíni
        correctAnswer: bikini
        rationale: "Cognato. Vem da ilha 'Bikini Atoll' (bomba atômica de 1946)."

target: 20
