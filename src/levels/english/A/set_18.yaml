title: 🎭 English A - Hobbies & Activities
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: "Hobbies e atividades de lazer. Verbos no infinitivo — usados com 'I like...' e 'I love...'."
repeatAll: 2
example: "Type the English word. Ex.: Música → music."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Sports & Games
    description: Type the English word for each sport or game.
    exercises:
      - type: english_vocab
        question: Futebol
        correctAnswer: football
        rationale: "BrE 'football' = futebol. AmE 'football' = futebol americano! 'Soccer' = futebol (AmE)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Natação
        correctAnswer: swimming
        rationale: "Vem de 'to swim' + '-ming'. Duplo 'm'. 'SUI-ming'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Corrida
        correctAnswer: running
        rationale: "Vem de 'to run' + '-ning'. Duplo 'n'. 'RAN-ing'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Dança
        correctAnswer: dancing
        rationale: "Vem de 'to dance' + '-ing'. 'DAN-sing'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Basquete
        correctAnswer: basketball
        rationale: "'Basket' (cesta) + 'ball' (bola). 'BAS-ket-bol'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Vôlei
        correctAnswer: volleyball
        rationale: "'Volley' (rebater) + 'ball'. 'VOL-i-bol'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Tênis
        correctAnswer: tennis
        rationale: "Cognato. Duplo 'n'. 'TEN-is'. Não confundir com 'tennis shoes' (tênis de pé)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Ciclismo
        correctAnswer: cycling
        rationale: "Vem de 'cycle' (ciclo/roda) + '-ing'. 'SAI-kling'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Skate
        correctAnswer: skateboarding
        rationale: "'Skateboard' + '-ing'. O esporte completo. 'SKEIT-bor-ding'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Xadrez
        correctAnswer: chess
        rationale: "Duplo 's'. 'Tches'. Não tem relação com 'check' (verificar)... ou tem — 'check!' no xadrez."
        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: Arts & Other Hobbies
    description: Type the English word.
    exercises:
      - type: english_vocab
        question: Música
        correctAnswer: music
        rationale: "Cognato. 'MYU-zik'. O 's' soa 'z'. Adjetivo 'musical'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Leitura
        correctAnswer: reading
        rationale: "Vem de 'to read' + '-ing'. 'REE-ding'. 'Read' tem pronúncias diferentes no passado ('red')."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Cozinhar
        correctAnswer: cooking
        rationale: "Vem de 'to cook' + '-ing'. 'CUK-ing'. Hobby e profissão."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Pintura
        correctAnswer: painting
        rationale: "Vem de 'to paint' + '-ing'. 'PEIN-ting'. 'Paint' também é tinta."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Desenho
        correctAnswer: drawing
        rationale: "Vem de 'to draw' + '-ing'. 'DRO-ing'. 'Draw' também é empate em jogos."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Fotografia
        correctAnswer: photography
        rationale: "Cognato. 'fo-TOG-ra-fi'. Substantivo do hobby. Pessoa = 'photographer'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Viagem
        correctAnswer: travel
        rationale: "Cognato com 'travessia'. 'TRAV-el'. Verbo e substantivo. 'I love travel'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Jardinagem
        correctAnswer: gardening
        rationale: "Vem de 'garden' (jardim) + '-ing'. 'GAR-den-ing'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Filme
        correctAnswer: movie
        rationale: "AmE 'movie'. BrE 'film'. 'MOO-vi'. Plural 'movies'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Jogo (de videogame)
        correctAnswer: gaming
        rationale: "Vem de 'game' + '-ing'. 'GEI-ming'. 'Game' sozinho é o jogo; 'gaming' é o hobby."
        difficulty: 1
        objectives: [en.vocab]
target: 20
