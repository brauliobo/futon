title: English - Colors & Basic Words
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: Conjunto de english/A.
repeatAll: 2
example: "Type the English word. Ex.: Vermelho → red"
pages:
  - pageNumber: 1
    title: Primary Colors
    description: Type the English word for each color.
    exercises:
      - type: english_vocab
        question: Vermelho
        correctAnswer: red
        rationale: "Três letras, vogal curta. Rima com 'head' e 'bed'."

      - type: english_vocab
        question: Azul
        correctAnswer: blue
        rationale: "Termina em 'e' mudo. Associe com 'blueberry' (mirtilo)."

      - type: english_vocab
        question: Amarelo
        correctAnswer: yellow
        rationale: "Começa com 'y' (som de 'i'). Duplo L no meio, e 'ow' no fim."

      - type: english_vocab
        question: Verde
        correctAnswer: green
        rationale: "Duplo 'ee' com som longo de 'i'. Mesma raiz de 'greenhouse' (estufa)."

      - type: english_vocab
        question: Preto
        correctAnswer: black
        rationale: "Termina em 'ck' — som seco de 'k'. Oposto de 'white'."

      - type: english_vocab
        question: Branco
        correctAnswer: white
        rationale: "'Wh' tem som de 'u' aspirado. Rima com 'night' e 'light'."

      - type: english_vocab
        question: Laranja
        correctAnswer: orange
        rationale: "Cognato, mas pronúncia 'OR-inj' (G final soa 'j')."

      - type: english_vocab
        question: Rosa
        correctAnswer: pink
        rationale: "Cuidado — 'rose' é a flor, não a cor. Vogal curta 'i'."

      - type: english_vocab
        question: Roxo
        correctAnswer: purple
        rationale: "Termina em '-le' mudo. Pronúncia 'PUR-pol'."

      - type: english_vocab
        question: Marrom
        correctAnswer: brown
        rationale: "Rima com 'town' e 'down'. Ditongo 'ow' soa 'au'."

  - pageNumber: 2
    title: Common Objects
    description: Type the English word for each object.
    exercises:
      - type: english_vocab
        question: Livro
        correctAnswer: book
        rationale: "Duplo 'oo' curto — som como em 'look' e 'cook'."

      - type: english_vocab
        question: Caneta
        correctAnswer: pen
        rationale: "Três letras. Não confunda com 'pan' (panela) nem 'pin' (alfinete)."

      - type: english_vocab
        question: Mesa
        correctAnswer: table
        rationale: "Cognato com 'tábua'. '-le' final é mudo — soa 'TEI-bol'."

      - type: english_vocab
        question: Cadeira
        correctAnswer: chair
        rationale: "'Ch' soa 'tch'. Ditongo 'air' tem som de 'er' aberto."

      - type: english_vocab
        question: Porta
        correctAnswer: door
        rationale: "Duplo 'oo' + 'r' com som longo de 'ô'. Plural 'doors'."

      - type: english_vocab
        question: Janela
        correctAnswer: window
        rationale: "Palavra composta — 'wind' (vento) + 'ow'. Pronúncia 'UIN-dou'."

      - type: english_vocab
        question: Casa
        correctAnswer: house
        rationale: "'Ou' soa 'au'. Cuidado — 'home' é o lar, 'house' é o edifício."

      - type: english_vocab
        question: Carro
        correctAnswer: car
        rationale: "Três letras. 'Ar' puxa o som como em 'star' e 'far'."

      - type: english_vocab
        question: Escola
        correctAnswer: school
        rationale: "'Sch' soa 'sk'. Mesma raiz de 'scholar' (estudioso)."

      - type: english_vocab
        question: Relógio
        correctAnswer: clock
        rationale: "'Clock' é de parede; 'watch' é de pulso. Termina em 'ck' seco."

target: 20
