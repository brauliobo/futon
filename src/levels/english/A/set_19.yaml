title: 🔢 English A - Basic Sentences
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: "Frases básicas com I like, I have, I want, I need. Introdução natural às estruturas do nível B."
repeatAll: 2
example: "Type the English phrase. Ex.: Eu quero água → I want water."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: I like / I have
    description: Type the English sentence.
    exercises:
      - type: english_vocab
        question: Eu gosto de gatos
        correctAnswer: I like cats
        rationale: "'I like' + substantivo plural. Sem artigo para gostar em geral."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu gosto de música
        correctAnswer: I like music
        rationale: "'Music' é incontável — sem artigo e sem plural."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu tenho um cachorro
        correctAnswer: I have a dog
        rationale: "'Have' para posses. 'A' antes de substantivo singular contável."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu tenho dois irmãos
        correctAnswer: I have two brothers
        rationale: "Número antes do substantivo. 'Brother' + 's' para plural."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu gosto de futebol
        correctAnswer: I like football
        rationale: "Esportes sem artigo — 'I like football', não 'I like the football'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu tenho fome
        correctAnswer: I am hungry
        rationale: "Em inglês usa 'to be', não 'to have' — 'I am hungry' (não 'I have hunger')."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu gosto de sorvete
        correctAnswer: I like ice cream
        rationale: "'Ice cream' — duas palavras. 'I like ice cream' sem artigo (gosto em geral)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu tenho um livro
        correctAnswer: I have a book
        rationale: "'A book' — artigo indefinido antes de consoante."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu gosto de natação
        correctAnswer: I like swimming
        rationale: "Com hobby/atividade, usa-se '-ing'. 'I like swimming'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu tenho sede
        correctAnswer: I am thirsty
        rationale: "'Thirsty' — 'I am thirsty', não 'I have thirst'. Mesmo padrão que fome."
        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: I want / I need
    description: Type the English sentence.
    exercises:
      - type: english_vocab
        question: Eu quero água
        correctAnswer: I want water
        rationale: "'Water' é incontável — sem artigo em pedido geral."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu preciso de ajuda
        correctAnswer: I need help
        rationale: "'Need' = precisar. 'Help' incontável — sem artigo."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu quero um sanduíche
        correctAnswer: I want a sandwich
        rationale: "'A sandwich' — artigo indefinido. Pedido específico."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu preciso dormir
        correctAnswer: I need to sleep
        rationale: "'Need to' + verbo base. 'I need to sleep' (preciso dormir)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu quero ir à escola
        correctAnswer: I want to go to school
        rationale: "'Want to' + verbo base. 'Go to school' sem artigo."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu não gosto de espinafre
        correctAnswer: I don't like spinach
        rationale: "'Don't' = do not. Negativa com 'I'. 'Spinach' = espinafre."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu quero jogar
        correctAnswer: I want to play
        rationale: "'Want to' + infinitivo. 'Play' = jogar/brincar."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu preciso de dinheiro
        correctAnswer: I need money
        rationale: "'Money' é incontável — sem artigo e sem plural."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu gosto de viajar
        correctAnswer: I like to travel
        rationale: "'Like to' + infinitivo, ou 'like travelling'. Ambas formas são corretas."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Eu não tenho tempo
        correctAnswer: I don't have time
        rationale: "'Don't have' é a negativa de 'have'. 'Time' incontável aqui."
        difficulty: 1
        objectives: [en.vocab]
target: 20
