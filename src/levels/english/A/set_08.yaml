title: English - Actions & Verbs
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: "Verbos de ação em inglês. Foco em vocabulário de alta frequência (run, eat, go, see)."
repeatAll: 2
example: "Type the English verb. Ex.: Correr → run"
pages:
  - pageNumber: 1
    title: Common Actions
    description: Type the English verb.
    exercises:
      - type: english_vocab
        question: Correr
        correctAnswer: run
        rationale: "Verbo irregular. Passado — 'ran'; particípio — 'run'. Três letras."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Andar
        correctAnswer: walk
        rationale: "'L' é mudo. Pronúncia 'uôk'. Rima com 'talk'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Pular
        correctAnswer: jump
        rationale: "'J' soa 'dj'. Regular — 'jumped' no passado."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Nadar
        correctAnswer: swim
        rationale: "Verbo irregular. Passado — 'swam'; particípio — 'swum'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Voar
        correctAnswer: fly
        rationale: "Verbo irregular. Passado — 'flew'; particípio — 'flown'. 'Y' soa 'ai'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Dormir
        correctAnswer: sleep
        rationale: "Verbo irregular. Passado — 'slept'. Duplo 'ee' longo."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Comer
        correctAnswer: eat
        rationale: "Verbo irregular. Passado — 'ate'; particípio — 'eaten'. 'Ea' longo."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Beber
        correctAnswer: drink
        rationale: "Verbo irregular. Passado — 'drank'; particípio — 'drunk'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Ler
        correctAnswer: read
        rationale: "Verbo irregular pela pronúncia — passado escreve-se igual mas soa 'red'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Escrever
        correctAnswer: write
        rationale: "'W' é mudo. Verbo irregular — 'wrote' / 'written'."

        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: More Verbs
    description: Type the English verb.
    exercises:
      - type: english_vocab
        question: Falar
        correctAnswer: speak
        rationale: "Verbo irregular. Passado — 'spoke'; particípio — 'spoken'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Ouvir
        correctAnswer: listen
        rationale: "'T' é mudo. Pronúncia 'LI-sen'. 'Listen' = escutar ativamente; 'hear' = ouvir passivamente."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Ver
        correctAnswer: see
        rationale: "Verbo irregular. Passado — 'saw'; particípio — 'seen'. Duplo 'ee'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Cantar
        correctAnswer: sing
        rationale: "Verbo irregular. Passado — 'sang'; particípio — 'sung'. '-ing' sem som 'g' final."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Dançar
        correctAnswer: dance
        rationale: "Regular — 'danced'. '-ce' final soa 's'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Brincar
        correctAnswer: play
        rationale: "Regular — 'played'. Também 'tocar instrumento'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Estudar
        correctAnswer: study
        rationale: "Regular. No passado, 'y' vira 'i' — 'studied'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Trabalhar
        correctAnswer: work
        rationale: "'Or' soa 'ér' fechado — pronúncia 'uérk'. Regular — 'worked'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Abrir
        correctAnswer: open
        rationale: "Regular — 'opened'. Duas sílabas 'OU-pen'."

        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Fechar
        correctAnswer: close
        rationale: "Regular — 'closed'. 'O_e' forma som longo 'ou'. '-se' soa 'z'."

        difficulty: 1
        objectives: [en.vocab]
target: 20
