title: English - Food & Drinks
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: Conjunto de english/A.
repeatAll: 2
example: "Type the English word. Ex.: Maçã → apple"
pages:
  - pageNumber: 1
    title: Fruits
    description: Type the English word for each fruit.
    exercises:
      - type: english_vocab
        question: Maçã
        correctAnswer: apple
        rationale: "Duplo P. Termina em '-le' mudo — pronúncia 'Á-pol'."

      - type: english_vocab
        question: Banana
        correctAnswer: banana
        rationale: "Mesma grafia que em português. Tônica no meio — 'ba-NA-na'."

      - type: english_vocab
        question: Laranja
        correctAnswer: orange
        rationale: "'O' inicial aberto, 'g' final soa 'j'. Duas sílabas 'OR-inj'."

      - type: english_vocab
        question: Uva
        correctAnswer: grape
        rationale: "'A_e' forma som longo 'ei'. Singular; o conjunto é 'a bunch of grapes'."

      - type: english_vocab
        question: Morango
        correctAnswer: strawberry
        rationale: "Composto — 'straw' (palha) + 'berry' (baga). Duplo R, 'y' final soa 'i'."

      - type: english_vocab
        question: Limão
        correctAnswer: lemon
        rationale: "Tônica na primeira sílaba 'LE-mon'. O 'limão-verde' é 'lime'."

      - type: english_vocab
        question: Melancia
        correctAnswer: watermelon
        rationale: "Composto literal — 'water' (água) + 'melon' (melão)."

      - type: english_vocab
        question: Abacaxi
        correctAnswer: pineapple
        rationale: "Composto — 'pine' (pinheiro) + 'apple' (maçã). Duplo P no meio."

      - type: english_vocab
        question: Pêra
        correctAnswer: pear
        rationale: "'Ea' aqui soa 'er' (como em 'bear'). Homófono de 'pair' (par)."

      - type: english_vocab
        question: Manga
        correctAnswer: mango
        rationale: "Termina em 'o'. Plural irregular aceito — 'mangoes' ou 'mangos'."

  - pageNumber: 2
    title: Food & Drinks
    description: Type the English word for each food or drink.
    exercises:
      - type: english_vocab
        question: Pão
        correctAnswer: bread
        rationale: "'Ea' soa 'e' curto — 'bréd'. Substantivo incontável — 'some bread'."

      - type: english_vocab
        question: Água
        correctAnswer: water
        rationale: "'Wa' soa 'uô'. No AmE termina em '-er' suave 'uô-der'."

      - type: english_vocab
        question: Leite
        correctAnswer: milk
        rationale: "Quatro letras. 'Lk' final — som seco, sem vogal entre eles."

      - type: english_vocab
        question: Queijo
        correctAnswer: cheese
        rationale: "'Ch' soa 'tch'. Duplo 'ee' longo. Plural 'cheeses' para variedades."

      - type: english_vocab
        question: Arroz
        correctAnswer: rice
        rationale: "'I_e' forma som longo 'ai'. '-ce' final soa 's' (não 'k')."

      - type: english_vocab
        question: Peixe
        correctAnswer: fish
        rationale: "'Sh' soa 'ch'. Incontável quando é comida — 'some fish'."

      - type: english_vocab
        question: Frango
        correctAnswer: chicken
        rationale: "'Ch' soa 'tch'. Como carne é incontável; como ave, contável."

      - type: english_vocab
        question: Ovo
        correctAnswer: egg
        rationale: "Duplo G. Plural regular 'eggs'. Rima com 'leg'."

      - type: english_vocab
        question: Bolo
        correctAnswer: cake
        rationale: "'A_e' forma som longo 'ei'. Rima com 'make' e 'take'."

      - type: english_vocab
        question: Suco
        correctAnswer: juice
        rationale: "'J' + 'ui' soam 'dju'. '-ce' final soa 's'. Rima com 'loose'."

target: 20
