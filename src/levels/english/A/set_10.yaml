title: English - Time & Days
level: A
subject: english
difficulty: 1
objectives:
  - en.vocab
authorNotes: "Vocabulário de tempo e dias da semana em inglês. Atenção — dias iniciam com maiúscula (Monday, Tuesday)."
repeatAll: 2
example: "Type the English word. Ex.: Segunda → monday"
pages:
  - pageNumber: 1
    title: Days of the Week
    description: Type the English word for each day.
    exercises:
      - type: english_vocab
        question: Segunda-feira
        correctAnswer: monday
        rationale: "'Moon-day' — dia da lua. Em inglês formal, sempre maiúsculo."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Terça-feira
        correctAnswer: tuesday
        rationale: "De 'Tiw' (deus nórdico da guerra). Pronúncia 'TIUZ-dei'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Quarta-feira
        correctAnswer: wednesday
        rationale: "Letra 'd' é muda. Pronúncia 'UENZ-dei'. Vem de 'Odin' (nórdico)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Quinta-feira
        correctAnswer: thursday
        rationale: "Do deus 'Thor'. 'Th' surdo + 'ur' fechado — 'THÉRZ-dei'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Sexta-feira
        correctAnswer: friday
        rationale: "De 'Freya' (deusa nórdica). Dia favorito da semana — 'TGIF'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Sábado
        correctAnswer: saturday
        rationale: "Do planeta 'Saturn'. Três sílabas 'SÁ-ter-dei'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Domingo
        correctAnswer: sunday
        rationale: "'Sun-day' — dia do sol. Primeiro dia da semana no calendário americano."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Dia
        correctAnswer: day
        rationale: "Três letras. 'Ay' soa 'ei'. Plural 'days'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Semana
        correctAnswer: week
        rationale: "Duplo 'ee' longo. Homófono de 'weak' (fraco)."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Fim de semana
        correctAnswer: weekend
        rationale: "Composto — 'week' + 'end' (fim). Plural 'weekends'."
        difficulty: 1
        objectives: [en.vocab]
  - pageNumber: 2
    title: Months & Time
    description: Type the English word.
    exercises:
      - type: english_vocab
        question: Janeiro
        correctAnswer: january
        rationale: "Do deus romano 'Janus'. Meses sempre maiúsculos em inglês."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Fevereiro
        correctAnswer: february
        rationale: "Cuidado com a grafia — o primeiro 'r' é fácil esquecer."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Março
        correctAnswer: march
        rationale: "Cognato, mas 'ch' soa 'tch'. Também verbo — 'marchar'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Manhã
        correctAnswer: morning
        rationale: "Duas sílabas 'MÔR-ning'. Inclui do nascer do sol até o meio-dia."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Tarde
        correctAnswer: afternoon
        rationale: "Composto — 'after' (depois) + 'noon' (meio-dia). Do meio-dia ao anoitecer."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Noite
        correctAnswer: night
        rationale: "'Gh' é mudo. Pronúncia 'nait'. Rima com 'light' e 'right'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Hoje
        correctAnswer: today
        rationale: "Composto histórico — 'to' + 'day'. Pronúncia 'tu-DEI'."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Amanhã
        correctAnswer: tomorrow
        rationale: "Duplo R. Tônica no meio 'tu-MÓ-rou'. Plural não existe."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Ontem
        correctAnswer: yesterday
        rationale: "Três sílabas 'IES-ter-dei'. Começa com 'y' (som de 'i')."
        difficulty: 1
        objectives: [en.vocab]
      - type: english_vocab
        question: Ano
        correctAnswer: year
        rationale: "'Ea' soa 'ír'. Plural 'years'. Use 'a year' (artigo) para idades."
        difficulty: 1
        objectives: [en.vocab]
target: 20
