title: ✏️ English L - False Friends Portuguese & English
level: L
subject: english
difficulty: 5
objectives:
  - C1.mastery.false_friends
authorNotes: C1 false friends — actually (na verdade, não atualmente), eventually (eventualmente = finalmente), sensible (sensato, não sensível), comprehensive (abrangente, não compreensível), pretend (fingir), assist (ajudar), fabric (tecido), library (biblioteca), sympathetic (solidário), college (faculdade).
repeatAll: 2
example: "Ex.: 'Na verdade, eu discordo' → Actually, I disagree."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: False Friends — Core Set
    description: High-frequency false friends between Portuguese and English.
    exercises:
      - type: english_phrases
        question: Na verdade, eu discordo dessa afirmação
        correctAnswer: Actually, I disagree with that statement
        rationale: "'Actually' = na verdade (não 'atualmente'). 'Currently' = atualmente. C1."
        difficulty: 3
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: Finalmente, eles chegaram a um acordo
        correctAnswer: Eventually, they reached an agreement
        rationale: "'Eventually' = finalmente/no fim (não 'eventualmente'). 'Finally' também correto."
        difficulty: 3
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: Foi uma decisão sensata nas circunstâncias
        correctAnswer: It was a sensible decision in the circumstances
        rationale: "'Sensible' = sensato (não sensível). 'Sensitive' = sensível. C1 falsa cognata."
        difficulty: 3
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: O relatório foi abrangente e detalhado
        correctAnswer: The report was comprehensive and detailed
        rationale: "'Comprehensive' = abrangente (não compreensível). 'Understandable' = compreensível."
        difficulty: 3
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: Ele fingiu não saber de nada
        correctAnswer: He pretended not to know anything
        rationale: "'Pretend' = fingir (não 'pretender'). 'Intend' = pretender/ter intenção."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: A enfermeira ajudou o paciente a se levantar
        correctAnswer: The nurse assisted the patient in getting up
        rationale: "'Assist' = ajudar (não 'assistir' a). 'Watch/attend' = assistir."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: O tecido era macio e de alta qualidade
        correctAnswer: The fabric was soft and high quality
        rationale: "'Fabric' = tecido (não fábrica). 'Factory' = fábrica. C1 falsa cognata."
        difficulty: 3
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: Ela foi à biblioteca estudar para o exame
        correctAnswer: She went to the library to study for the exam
        rationale: "'Library' = biblioteca (não livraria). 'Bookshop/bookstore' = livraria. C1."
        difficulty: 3
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: Os amigos dela foram solidários com ela
        correctAnswer: Her friends were sympathetic towards her
        rationale: "'Sympathetic' = solidário/compreensivo (não simpático). 'Nice' = simpático."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: Ela se formou na faculdade de direito
        correctAnswer: She graduated from law college
        rationale: "'College' = faculdade/instituição (não colégio). 'School' = colégio/escola."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
  - pageNumber: 2
    title: False Friends — Advanced Set
    description: Less obvious false friends at C2 level.
    exercises:
      - type: english_phrases
        question: O argumento foi agressivo e sem embasamento
        correctAnswer: The argument was aggressive and unfounded
        rationale: "'Argument' = discussão/argumento (não briga). 'Fight' = briga. C1."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: O exame foi realizado em condições rigorosas
        correctAnswer: The exam was conducted under strict conditions
        rationale: "'Conduct an exam' = realizar/conduzir. 'Strict' = rigoroso C1."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: O texto era confuso e mal organizado
        correctAnswer: The text was confusing and poorly organised
        rationale: "'Confusing' = confuso para quem lê. 'Confused' = a pessoa está confusa. C1."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: A conferência foi muito interessante e produtiva
        correctAnswer: The conference was very interesting and productive
        rationale: "'Conference' = conferência/congresso (não conferência = check). C1 contexto."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: O professor explicou o conteúdo de forma clara
        correctAnswer: The lecturer explained the content clearly
        rationale: "'Lecturer' = professor universitário. 'Teacher' = professor básico. C1."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: Ela é muito competente em sua área
        correctAnswer: She is very competent in her field
        rationale: "'Competent' = competente (cognata correta). 'Field' = área/campo C1."
        difficulty: 3
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: O incidente causou grande constrangimento
        correctAnswer: The incident caused great embarrassment
        rationale: "'Embarrassment' = constrangimento (não embaraço físico). C2 nuance."
        difficulty: 5
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: Ele parecia exausto depois da reunião
        correctAnswer: He looked exhausted after the meeting
        rationale: "'Exhausted' = exausto (não exausto como evacuado). Cognata correta C1."
        difficulty: 3
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: O jornal publicou uma matéria polêmica
        correctAnswer: The newspaper published a controversial article
        rationale: "'Article' = matéria/artigo. 'Controversial' = polêmico. Colocação C1."
        difficulty: 4
        objectives: [C1.mastery.false_friends]
      - type: english_phrases
        question: Ele era aparentemente calmo, mas estava ansioso
        correctAnswer: He was apparently calm, but he was anxious
        rationale: "'Apparently' = aparentemente (cognata correta). 'Anxious' = ansioso C1."
        difficulty: 5
        objectives: [C1.mastery.false_friends]
target: 20
