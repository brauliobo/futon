title: English L - Phrasal Verbs with 'Get'
level: L
subject: english
difficulty: 4
objectives:
  - B2.vocab.phrasal_verbs
authorNotes: Core 'get' phrasals — get up, get on, get off, get along, get over, get through, get by, get away.
repeatAll: 2
example: Acordar → get up / Superar → get over
pages:
  - pageNumber: 1
    title: Everyday 'get' Phrasals
    description: Common daily-use combinations.
    exercises:
      - type: english_phrases
        question: Eu acordo cedo
        correctAnswer: i get up early
        rationale: "'Get up' = levantar-se/acordar. 'Early' advérbio ao final."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ele entrou no ônibus
        correctAnswer: he got on the bus
        rationale: "'Get on' = subir em (transporte público/bicicleta). 'Got' past."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ela desceu do trem
        correctAnswer: she got off the train
        rationale: "'Get off' = descer de (transporte público). Oposto de 'get on'."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Vá embora!
        correctAnswer: get away
        rationale: "'Get away' = ir embora/escapar. Imperativo sem sujeito."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Voltei ontem
        correctAnswer: i got back yesterday
        rationale: "'Get back' = voltar. 'Got' past. 'Yesterday' ao final."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Volte em breve
        correctAnswer: get back soon
        rationale: "'Get back' = voltar (imperativo). 'Soon' advérbio ao final."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Entre no carro
        correctAnswer: get in the car
        rationale: "'Get in' = entrar (carro/táxi). Diferente de 'get on' (ônibus)."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Saia do carro
        correctAnswer: get out of the car
        rationale: "'Get out of' = sair de (carro). Oposto de 'get in'."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Pegue ele no aeroporto
        correctAnswer: pick him up at the airport
        rationale: "'Pick up' = buscar/pegar. 'At the airport' (lugar específico com at)."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ele se levantou rapidamente
        correctAnswer: he got up quickly
        rationale: "'Got up' = levantou-se. 'Quickly' advérbio ao final."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
  - pageNumber: 2
    title: Abstract 'get' Phrasals
    description: Figurative meanings — relationships, coping, surviving.
    exercises:
      - type: english_phrases
        question: Nós nos damos bem
        correctAnswer: we get along well
        rationale: "'Get along' = se dar bem (relações). 'Well' advérbio."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ele superou a perda
        correctAnswer: he got over the loss
        rationale: "'Get over' = superar (algo difícil). 'The loss' específico."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Consegui atravessar o dia
        correctAnswer: i got through the day
        rationale: "'Get through' = passar por/atravessar (período difícil)."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ela se vira com pouco dinheiro
        correctAnswer: she gets by with little money
        rationale: "'Get by' = se virar (sobreviver). 'With little money' = com pouco."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Livre-se dele
        correctAnswer: get rid of it
        rationale: "'Get rid of' = livrar-se de. Expressão fixa com 'of'."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Vá direto ao ponto
        correctAnswer: get to the point
        rationale: "'Get to the point' = ir direto ao ponto (expressão)."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ela se acostumou
        correctAnswer: she got used to it
        rationale: "'Get used to' = acostumar-se a. 'It' após 'to' obrigatório."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ele escapou impune
        correctAnswer: he got away with it
        rationale: "'Get away with' = escapar impune de. 'It' após 'with'."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Estou começando a entender
        correctAnswer: i am getting it
        rationale: "'Get it' = entender (coloquial). 'Am getting' = começando a entender."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ela me deixa nervoso
        correctAnswer: she gets on my nerves
        rationale: "'Get on my nerves' = me deixar nervoso (expressão idiomática)."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
target: 20
