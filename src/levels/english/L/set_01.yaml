title: English L - Phrasal Verbs with 'Get'
level: L
subject: english
difficulty: 4
objectives: [B2.vocab.phrasal_verbs]
authorNotes: Core 'get' phrasals — get up, get on, get off, get along, get over, get through, get by, get away.
repeatAll: 2
example: "Acordar → get up / Superar → get over"
pages:
  - pageNumber: 1
    title: Everyday 'get' Phrasals
    description: Common daily-use combinations.
    exercises:
      - { type: english_phrases, question: "Eu acordo cedo", correctAnswer: i get up early }
      - { type: english_phrases, question: "Ele entrou no ônibus", correctAnswer: he got on the bus }
      - { type: english_phrases, question: "Ela desceu do trem", correctAnswer: she got off the train }
      - { type: english_phrases, question: "Vá embora!", correctAnswer: get away }
      - { type: english_phrases, question: "Voltei ontem", correctAnswer: i got back yesterday }
      - { type: english_phrases, question: "Volte em breve", correctAnswer: get back soon }
      - { type: english_phrases, question: "Entre no carro", correctAnswer: get in the car }
      - { type: english_phrases, question: "Saia do carro", correctAnswer: get out of the car }
      - { type: english_phrases, question: "Pegue ele no aeroporto", correctAnswer: pick him up at the airport }
      - { type: english_phrases, question: "Ele se levantou rapidamente", correctAnswer: he got up quickly }
  - pageNumber: 2
    title: Abstract 'get' Phrasals
    description: Figurative meanings — relationships, coping, surviving.
    exercises:
      - { type: english_phrases, question: "Nós nos damos bem", correctAnswer: we get along well }
      - { type: english_phrases, question: "Ele superou a perda", correctAnswer: he got over the loss }
      - { type: english_phrases, question: "Consegui atravessar o dia", correctAnswer: i got through the day }
      - { type: english_phrases, question: "Ela se vira com pouco dinheiro", correctAnswer: she gets by with little money }
      - { type: english_phrases, question: "Livre-se dele", correctAnswer: get rid of it }
      - { type: english_phrases, question: "Vá direto ao ponto", correctAnswer: get to the point }
      - { type: english_phrases, question: "Ela se acostumou", correctAnswer: she got used to it }
      - { type: english_phrases, question: "Ele escapou impune", correctAnswer: he got away with it }
      - { type: english_phrases, question: "Estou começando a entender", correctAnswer: i am getting it }
      - { type: english_phrases, question: "Ela me deixa nervoso", correctAnswer: she gets on my nerves }
target: 20
