title: English L - Phrasal Verbs with 'Get'
level: L
subject: english
difficulty: 4
objectives:
  - B2.vocab.phrasal_verbs
authorNotes: Core 'get' phrasals — get up, get on, get off, get along, get over, get through, get by, get away.
repeatAll: 2
example: Acordar → get up / Superar → get over
pages:
  - pageNumber: 1
    title: Everyday 'get' Phrasals
    description: Common daily-use combinations.
    exercises:
      - type: english_phrases
        question: Eu acordo cedo
        correctAnswer: i get up early
        rationale: "Não traduza literal — phrasal tem sentido próprio."
      - type: english_phrases
        question: Ele entrou no ônibus
        correctAnswer: he got on the bus
        rationale: "'Get + particípio' pode equivaler a passiva."
      - type: english_phrases
        question: Ela desceu do trem
        correctAnswer: she got off the train
        rationale: "'Get up' = levantar-se; 'get in' = entrar (carro)."
      - type: english_phrases
        question: Vá embora!
        correctAnswer: get away
        rationale: "Não traduza literal — phrasal tem sentido próprio."
      - type: english_phrases
        question: Voltei ontem
        correctAnswer: i got back yesterday
        rationale: "Phrasals com 'get' costumam ser inseparáveis."
      - type: english_phrases
        question: Volte em breve
        correctAnswer: get back soon
        rationale: "'Get back' = voltar; 'get away' = escapar."
      - type: english_phrases
        question: Entre no carro
        correctAnswer: get in the car
        rationale: "Contexto define sentido — decorar pelo uso."
      - type: english_phrases
        question: Saia do carro
        correctAnswer: get out of the car
        rationale: "'Get + particípio' pode equivaler a passiva."
      - type: english_phrases
        question: Pegue ele no aeroporto
        correctAnswer: pick him up at the airport
        rationale: "'Get up' = levantar-se; 'get in' = entrar (carro)."
      - type: english_phrases
        question: Ele se levantou rapidamente
        correctAnswer: he got up quickly
        rationale: "'Get off' = descer (ônibus); 'get on' = subir."
  - pageNumber: 2
    title: Abstract 'get' Phrasals
    description: Figurative meanings — relationships, coping, surviving.
    exercises:
      - type: english_phrases
        question: Nós nos damos bem
        correctAnswer: we get along well
        rationale: "Não traduza literal — phrasal tem sentido próprio."
      - type: english_phrases
        question: Ele superou a perda
        correctAnswer: he got over the loss
        rationale: "'Get along' = se dar bem; 'get over' = superar."
      - type: english_phrases
        question: Consegui atravessar o dia
        correctAnswer: i got through the day
        rationale: "'Get off' = descer (ônibus); 'get on' = subir."
      - type: english_phrases
        question: Ela se vira com pouco dinheiro
        correctAnswer: she gets by with little money
        rationale: "'Get through' = atravessar/concluir."
      - type: english_phrases
        question: Livre-se dele
        correctAnswer: get rid of it
        rationale: "'Get off' = descer (ônibus); 'get on' = subir."
      - type: english_phrases
        question: Vá direto ao ponto
        correctAnswer: get to the point
        rationale: "'Get + particípio' pode equivaler a passiva."
      - type: english_phrases
        question: Ela se acostumou
        correctAnswer: she got used to it
        rationale: "'Get back' = voltar; 'get away' = escapar."
      - type: english_phrases
        question: Ele escapou impune
        correctAnswer: he got away with it
        rationale: "'Get along' = se dar bem; 'get over' = superar."
      - type: english_phrases
        question: Estou começando a entender
        correctAnswer: i am getting it
        rationale: "'Get off' = descer (ônibus); 'get on' = subir."
      - type: english_phrases
        question: Ela me deixa nervoso
        correctAnswer: she gets on my nerves
        rationale: "'Get up' = levantar-se; 'get in' = entrar (carro)."
target: 20
