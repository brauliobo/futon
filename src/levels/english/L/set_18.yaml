title: ✏️ English L - Vocabulary in Context Literature & Culture
level: L
subject: english
difficulty: 5
objectives:
  - C1.mastery.literature_vocabulary
authorNotes: C1/C2 vocabulary for literary analysis and cultural discussion — genre, narrative, metaphor, tone, plot, theme, protagonist, irony, symbolism, allusion, imagery, foreshadowing. Contextualised in sentences about literature and culture.
repeatAll: 2
example: "Ex.: 'O enredo do romance é complexo e imprevisível' → The plot of the novel is complex and unpredictable."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Literary Terms in Context
    description: Core literary vocabulary applied in analytical sentences.
    exercises:
      - type: english_phrases
        question: O enredo do romance é complexo e imprevisível
        correctAnswer: The plot of the novel is complex and unpredictable
        rationale: "'Plot' = enredo. 'Novel' = romance literário. Colocação analítica C1."
        difficulty: 3
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: A narrativa é contada em primeira pessoa
        correctAnswer: The narrative is told in the first person
        rationale: "'Narrative is told in the first person' = estrutura de análise literária C1."
        difficulty: 3
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: A metáfora da luz representa esperança
        correctAnswer: The metaphor of light represents hope
        rationale: "'Metaphor of' = metáfora de. 'Represents hope' = análise simbólica C1."
        difficulty: 3
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O tom do poema é melancólico e reflexivo
        correctAnswer: The tone of the poem is melancholic and reflective
        rationale: "'Tone of the poem' = tom do poema. 'Melancholic' = C2 adjetivo literário."
        difficulty: 3
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O protagonista enfrenta um dilema moral
        correctAnswer: The protagonist faces a moral dilemma
        rationale: "'Protagonist faces' = colocação padrão de análise. 'Moral dilemma' C1."
        difficulty: 4
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O gênero do filme é difícil de classificar
        correctAnswer: The genre of the film is difficult to classify
        rationale: "'Genre' = gênero (cognata). 'Difficult to classify' = análise cultural C1."
        difficulty: 3
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: Há uma ironia profunda no desfecho
        correctAnswer: There is a profound irony in the ending
        rationale: "'Profound irony' = ironia profunda. 'Ending' = desfecho. C1 análise."
        difficulty: 4
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O simbolismo do mar representa liberdade
        correctAnswer: The symbolism of the sea represents freedom
        rationale: "'Symbolism of' = simbolismo de. Estrutura de análise literária C1."
        difficulty: 4
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O tema central da obra é a identidade
        correctAnswer: The central theme of the work is identity
        rationale: "'Central theme of' = tema central de. Colocação de ensaio literário C1."
        difficulty: 3
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O autor faz uma alusão à mitologia grega
        correctAnswer: The author makes an allusion to Greek mythology
        rationale: "'Make an allusion to' = fazer uma alusão a. Colocação literária C2."
        difficulty: 4
        objectives: [C1.mastery.literature_vocabulary]
  - pageNumber: 2
    title: Cultural and Advanced Literary Language
    description: C2 terms for cultural commentary and literary criticism.
    exercises:
      - type: english_phrases
        question: A imagística do poema é vívida e evocativa
        correctAnswer: The imagery of the poem is vivid and evocative
        rationale: "'Imagery' = imagística/imagens. 'Vivid and evocative' = adjetivos C2."
        difficulty: 4
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O início da história prenuncia o trágico desfecho
        correctAnswer: The opening foreshadows the tragic ending
        rationale: "'Foreshadow' = prenunciar. 'Tragic ending' = desfecho trágico C2."
        difficulty: 5
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O narrador não é confiável
        correctAnswer: The narrator is unreliable
        rationale: "'Unreliable narrator' = narrador não confiável. Conceito crítico C2."
        difficulty: 4
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O texto usa a sátira para criticar a sociedade
        correctAnswer: The text uses satire to criticise society
        rationale: "'Use satire to criticise' = colocação de análise cultural C1. BrE spelling."
        difficulty: 4
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O clímax da peça é emocionalmente intenso
        correctAnswer: The climax of the play is emotionally intense
        rationale: "'Climax of the play' = clímax da peça. 'Emotionally intense' = C2."
        difficulty: 4
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O flashback revela o passado do personagem
        correctAnswer: The flashback reveals the character's past
        rationale: "'Flashback reveals' = colocação narrativa C1. 'Character's past' C1."
        difficulty: 4
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O antagonista é retratado com complexidade
        correctAnswer: The antagonist is portrayed with complexity
        rationale: "'Portrayed with complexity' = retratado com complexidade. C2 análise."
        difficulty: 5
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: A obra questiona normas culturais estabelecidas
        correctAnswer: The work challenges established cultural norms
        rationale: "'Challenge established norms' = questionar normas. Crítica cultural C2."
        difficulty: 5
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: O diálogo do conto é repleto de subtexto
        correctAnswer: The dialogue of the short story is full of subtext
        rationale: "'Full of subtext' = repleto de subtexto. 'Short story' = conto. C2."
        difficulty: 5
        objectives: [C1.mastery.literature_vocabulary]
      - type: english_phrases
        question: A obra foi aclamada pela crítica especializada
        correctAnswer: The work was acclaimed by literary critics
        rationale: "'Acclaimed by critics' = aclamado pela crítica. Colocação cultural C2."
        difficulty: 5
        objectives: [C1.mastery.literature_vocabulary]
target: 20
