title: ✏️ English L - Writing C1 Essay Introduction & Conclusion Phrases
level: L
subject: english
difficulty: 5
objectives:
  - C1.mastery.essay_writing
authorNotes: C1 essay structure phrases — introductions (This essay argues, In recent years, It is widely acknowledged) and conclusions (In conclusion, To sum up, All things considered, It can be concluded). Portuguese→English translation of academic writing phrases.
repeatAll: 2
example: "Ex.: 'Nos últimos anos, o debate sobre a IA tem crescido' → In recent years, the debate on AI has grown."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Essay Introductions
    description: Formal C1 phrases for opening an academic argument.
    exercises:
      - type: english_phrases
        question: Este ensaio argumenta que a tecnologia beneficia a educação
        correctAnswer: This essay argues that technology benefits education
        rationale: "'This essay argues that' = estrutura de introdução padrão C1/C2."
        difficulty: 3
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Nos últimos anos, o debate sobre a mudança climática se intensificou
        correctAnswer: In recent years, the debate on climate change has intensified
        rationale: "'In recent years' + perfeito = colocação temporal C1. 'Intensified' C2."
        difficulty: 3
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: É amplamente reconhecido que a educação é um direito
        correctAnswer: It is widely acknowledged that education is a right
        rationale: "'It is widely acknowledged that' = estrutura passiva impessoal C1."
        difficulty: 3
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: O objetivo principal deste ensaio é examinar as causas
        correctAnswer: The main aim of this essay is to examine the causes
        rationale: "'The main aim of this essay is to' = abertura de propósito C1."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Há muito se debate se a globalização é positiva
        correctAnswer: It has long been debated whether globalisation is positive
        rationale: "'It has long been debated whether' = construção impessoal C2."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: À primeira vista, parece que a solução é simples
        correctAnswer: At first glance, it may seem that the solution is simple
        rationale: "'At first glance' + hedging 'may seem' = abertura com ressalva C1."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Muito tem sido escrito sobre o impacto das redes sociais
        correctAnswer: Much has been written about the impact of social media
        rationale: "'Much has been written about' = intro impessoal C1. 'Impact of' C1."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Esta questão levanta uma série de questões importantes
        correctAnswer: This issue raises a number of important questions
        rationale: "'Raise a number of questions' = colocação C1 para ampliar escopo."
        difficulty: 3
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Com o avanço da tecnologia, surgem novos desafios
        correctAnswer: With the advancement of technology, new challenges arise
        rationale: "'With the advancement of' = cláusula prepositional C2 de intro."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Este artigo pretende investigar a relação entre pobreza e crime
        correctAnswer: This paper aims to investigate the relationship between poverty and crime
        rationale: "'This paper aims to investigate' = propósito acadêmico C1."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
  - pageNumber: 2
    title: Essay Conclusions
    description: Formal C1/C2 phrases for closing arguments and summarising.
    exercises:
      - type: english_phrases
        question: Em conclusão, as evidências sugerem claramente que
        correctAnswer: In conclusion, the evidence clearly suggests that
        rationale: "'In conclusion, the evidence clearly suggests that' = fechamento C1."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Em suma, existem vantagens e desvantagens em ambos os lados
        correctAnswer: To sum up, there are advantages and disadvantages on both sides
        rationale: "'To sum up' = sintetizar. 'On both sides' = estrutura de ensaio C1."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Considerando tudo, a posição mais sustentável é a segunda
        correctAnswer: All things considered, the most sustainable position is the latter
        rationale: "'All things considered' = ponderando tudo. 'The latter' = o último C2."
        difficulty: 5
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Pode-se concluir que mais pesquisas são necessárias
        correctAnswer: It can be concluded that further research is needed
        rationale: "'It can be concluded that' = conclusão passiva impessoal C1."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: As questões levantadas merecem atenção contínua
        correctAnswer: The issues raised deserve continued attention
        rationale: "'Issues raised deserve continued attention' = encerramento acadêmico C2."
        difficulty: 5
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Dito isso, permanece muito por explorar nessa área
        correctAnswer: That said, much remains to be explored in this area
        rationale: "'That said' = dito isso (ressalva final). 'Much remains to be' C2."
        difficulty: 5
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Em última análise, a resposta depende do contexto
        correctAnswer: Ultimately, the answer depends on the context
        rationale: "'Ultimately' = em última análise. Advérbio conclusivo formal C1."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: É evidente que medidas urgentes devem ser tomadas
        correctAnswer: It is evident that urgent measures must be taken
        rationale: "'It is evident that' = é evidente que. Colocação conclusiva C1."
        difficulty: 4
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: Para concluir, este argumento defende uma abordagem equilibrada
        correctAnswer: To conclude, this argument advocates a balanced approach
        rationale: "'Advocate a balanced approach' = defender equilíbrio. Colocação C2."
        difficulty: 5
        objectives: [C1.mastery.essay_writing]
      - type: english_phrases
        question: As implicações dessa análise vão além do escopo deste ensaio
        correctAnswer: The implications of this analysis go beyond the scope of this essay
        rationale: "'Go beyond the scope of' = ir além do escopo. Estrutura conclusiva C2."
        difficulty: 5
        objectives: [C1.mastery.essay_writing]
target: 20
