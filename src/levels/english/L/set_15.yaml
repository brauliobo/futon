title: ✏️ English L - Writing Argument Development
level: L
subject: english
difficulty: 5
objectives:
  - C1.mastery.argument_development
authorNotes: C1 argument construction — counterargument, concession, rebuttal, hedging, contrast (however, nevertheless, admittedly, on the other hand, notwithstanding). Translate Portuguese argument phrases to English academic register.
repeatAll: 2
example: "Ex.: 'No entanto, existem razões para discordar' → However, there are reasons to disagree."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Counterargument and Concession
    description: Phrases for acknowledging opposing views at C1 level.
    exercises:
      - type: english_phrases
        question: No entanto, existem razões válidas para discordar
        correctAnswer: However, there are valid reasons to disagree
        rationale: "'However' = no entanto (adversativo formal). 'Valid reasons' = colocação C1."
        difficulty: 3
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Embora esse argumento seja válido, há exceções
        correctAnswer: Although this argument is valid, there are exceptions
        rationale: "'Although' = embora (concessão). Estrutura de concessão C1."
        difficulty: 3
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Admite-se que a proposta tem mérito
        correctAnswer: Admittedly, the proposal has merit
        rationale: "'Admittedly' = admite-se/é verdade que. Advérbio de concessão C1."
        difficulty: 3
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Por outro lado, alguns especialistas discordam
        correctAnswer: On the other hand, some experts disagree
        rationale: "'On the other hand' = por outro lado. Locução adversativa padrão C1."
        difficulty: 3
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Não obstante as críticas, a política foi mantida
        correctAnswer: Notwithstanding the criticism, the policy was maintained
        rationale: "'Notwithstanding' = não obstante. Preposição formal C2 de concessão."
        difficulty: 4
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Pode-se argumentar que essa visão é simplista
        correctAnswer: It could be argued that this view is simplistic
        rationale: "'It could be argued that' = pode-se argumentar que. Hedging C1."
        difficulty: 4
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Ainda assim, a maioria dos estudos apoia essa conclusão
        correctAnswer: Nevertheless, the majority of studies support this conclusion
        rationale: "'Nevertheless' = ainda assim/no entanto (mais formal que 'however'). C1."
        difficulty: 4
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Apesar das limitações, a abordagem é eficaz
        correctAnswer: Despite the limitations, the approach is effective
        rationale: "'Despite' = apesar de + nome. Contraste sem verbo. C1."
        difficulty: 3
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Ao contrário do que se pensa, os resultados são mistos
        correctAnswer: Contrary to popular belief, the results are mixed
        rationale: "'Contrary to popular belief' = ao contrário do que se acredita. C2."
        difficulty: 4
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Dada a complexidade do assunto, simplificar é um erro
        correctAnswer: Given the complexity of the issue, simplification is a mistake
        rationale: "'Given the complexity of' = dada a complexidade de. Cláusula C2."
        difficulty: 4
        objectives: [C1.mastery.argument_development]
  - pageNumber: 2
    title: Rebuttal and Hedging
    description: C1/C2 language for refuting claims and qualifying statements.
    exercises:
      - type: english_phrases
        question: Esse argumento, contudo, ignora fatores cruciais
        correctAnswer: This argument, however, overlooks crucial factors
        rationale: "'Overlook' = ignorar/desconsiderar. 'Crucial factors' = colocação C1."
        difficulty: 4
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Ao contrário, as evidências mostram o oposto
        correctAnswer: On the contrary, the evidence shows the opposite
        rationale: "'On the contrary' = ao contrário (refuta). Mais forte que 'however'. C1."
        difficulty: 4
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Essa afirmação carece de evidências concretas
        correctAnswer: This claim lacks concrete evidence
        rationale: "'Lack concrete evidence' = carecer de evidências. Refutação direta C1."
        difficulty: 4
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Parece provável que essa tendência continue
        correctAnswer: It seems likely that this trend will continue
        rationale: "'It seems likely that' = parece provável que. Hedging modal C1."
        difficulty: 4
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Embora haja mérito nessa visão, ela é incompleta
        correctAnswer: While there is merit in this view, it is incomplete
        rationale: "'While' concessivo = embora. 'There is merit in' = conceder parcialmente C1."
        difficulty: 5
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: É tentador concluir isso, mas os dados dizem outra coisa
        correctAnswer: It is tempting to conclude this, but the data suggests otherwise
        rationale: "'Tempting to conclude' + 'suggests otherwise' = refutação elegante C2."
        difficulty: 5
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Numa análise mais cuidadosa, essa teoria não se sustenta
        correctAnswer: On closer examination, this theory does not hold up
        rationale: "'On closer examination' = numa análise mais cuidadosa. Refutação C2."
        difficulty: 5
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Seria precipitado descartar essa possibilidade completamente
        correctAnswer: It would be premature to dismiss this possibility entirely
        rationale: "'It would be premature to' = seria precipitado. Hedging C2 sofisticado."
        difficulty: 5
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Embora convincente, o argumento tem lacunas notáveis
        correctAnswer: Although compelling, the argument has notable gaps
        rationale: "'Compelling' = convincente. 'Notable gaps' = lacunas notáveis. C2."
        difficulty: 5
        objectives: [C1.mastery.argument_development]
      - type: english_phrases
        question: Esse ponto merece uma consideração mais aprofundada
        correctAnswer: This point warrants further consideration
        rationale: "'Warrant further consideration' = merecer consideração adicional. C2."
        difficulty: 5
        objectives: [C1.mastery.argument_development]
target: 20
