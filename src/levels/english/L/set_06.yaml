title: English L - Reading Comprehension — News Style
level: L
subject: english
difficulty: 4
objectives:
  - B2.reading.comprehension
authorNotes: Short news-style passages that push inference and vocabulary recognition.
example: "Read the passage; answer in English. Ex.: When did the library reopen? → Monday."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 40
pages:
  - pageNumber: 1
    title: Local News
    description: Read and answer.
    passage: A small library in the city center reopened on Monday after three months of renovation. The project cost half a million dollars and doubled the reading space. Officials said the library would now offer free digital courses for seniors. Opening hours were also extended on weekends.
    exercises:
      - type: reading
        question: When did the library reopen? (sunday/monday/friday)
        correctAnswer: Monday
        rationale: "'Reopened on Monday' — dia explícito no 1º período."
        difficulty: 3
        objectives: [B2.reading.comprehension]
      - type: reading
        question: How long was the renovation? (a week/one year/three months)
        correctAnswer: Three months
        rationale: "'After three months of renovation' — duração no 1º período."
        difficulty: 3
        objectives: [B2.reading.comprehension]
      - type: reading
        question: How much did it cost? (a million dollars/half a million dollars/a thousand dollars)
        correctAnswer: Half a million dollars
        rationale: "'Cost half a million dollars' — valor no 2º período."
        difficulty: 3
        objectives: [B2.reading.comprehension]
      - type: reading
        question: What doubled? (the staff/the reading space/the budget)
        correctAnswer: The reading space
        rationale: "'Doubled the reading space' — objeto do verbo 'doubled'."
        difficulty: 3
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Who gets free digital courses? (seniors/teachers/children)
        correctAnswer: seniors
        rationale: "'Free digital courses for seniors' — público-alvo explícito."
        difficulty: 3
        objectives: [B2.reading.comprehension]
      - type: reading
        question: What was extended? (weekend hours/the building/weekday hours)
        correctAnswer: Weekend hours
        rationale: "'Opening hours were... extended on weekends' — última frase."
        difficulty: 3
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Where is the library? (countryside/suburbs/city center)
        correctAnswer: City center
        rationale: "'Library in the city center' — localização no 1º período."
        difficulty: 3
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Is the library big or small? (small/big/medium)
        correctAnswer: small
        rationale: "'A small library' — adjetivo 'small' antes de 'library'."
        difficulty: 3
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Is the library public? (no/yes/unknown)
        correctAnswer: yes
        rationale: "'Free digital courses' + 'officials said' indicam serviço público."
        difficulty: 3
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Did officials speak? (no/unknown/yes)
        correctAnswer: yes
        rationale: "'Officials said the library would...' — fala reportada explícita."
        difficulty: 3
        objectives: [B2.reading.comprehension]
  - pageNumber: 2
    title: Environment
    description: Read and answer.
    passage: Scientists reported that a coastal town planted ten thousand trees over the past year. Volunteers worked every weekend, and students from local schools also helped. The project aims to protect the coast from erosion and to create new habitats for birds. Early results already show increased bird activity.
    exercises:
      - type: reading
        question: How many trees were planted? (ten thousand/one hundred/one thousand)
        correctAnswer: Ten thousand
        rationale: "'Planted ten thousand trees' — número explícito no 1º período."
        difficulty: 4
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Over what period? (past decade/past month/past year)
        correctAnswer: Past year
        rationale: "'Over the past year' — período ao final do 1º período."
        difficulty: 4
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Who worked every weekend? (volunteers/scientists/officials)
        correctAnswer: volunteers
        rationale: "'Volunteers worked every weekend' — sujeito no 2º período."
        difficulty: 4
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Who else helped? (tourists/soldiers/students)
        correctAnswer: students
        rationale: "'Students from local schools also helped' — segundo grupo."
        difficulty: 4
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Why plant trees? (to build houses/to make money/to protect the coast)
        correctAnswer: To protect the coast
        rationale: "'To protect the coast from erosion' — objetivo explícito."
        difficulty: 4
        objectives: [B2.reading.comprehension]
      - type: reading
        question: What else was created? (new habitats/new hotels/new roads)
        correctAnswer: New habitats
        rationale: "'To create new habitats for birds' — 2º objetivo do projeto."
        difficulty: 4
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Which animals benefit? (horses/birds/fish)
        correctAnswer: birds
        rationale: "'Habitats for birds' + 'bird activity' — aves mencionadas 2x."
        difficulty: 4
        objectives: [B2.reading.comprehension]
      - type: reading
        question: What do early results show? (more tourism/increased bird activity/less erosion already)
        correctAnswer: Increased bird activity
        rationale: "'Early results show increased bird activity' — última frase."
        difficulty: 4
        objectives: [B2.reading.comprehension]
      - type: reading
        question: What kind of town is it? (desert/coastal/mountain)
        correctAnswer: coastal
        rationale: "'A coastal town' — adjetivo 'coastal' antes de 'town'."
        difficulty: 4
        objectives: [B2.reading.comprehension]
      - type: reading
        question: Is the project still ongoing? (unknown/yes/no)
        correctAnswer: yes
        rationale: "'Early results already show' sugere projeto em andamento."
        difficulty: 4
        objectives: [B2.reading.comprehension]
target: 20
