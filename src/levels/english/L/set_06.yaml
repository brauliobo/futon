title: English L - Reading Comprehension — News Style
level: L
subject: english
difficulty: 5
objectives:
  - B2.reading.comprehension
authorNotes: Short news-style passages that push inference and vocabulary recognition.
example: Read the passage; answer in English.
pages:
  - pageNumber: 1
    title: Local News
    description: Read and answer.
    passage: A small library in the city center reopened on Monday after three months of renovation. The project cost half a million dollars and doubled the reading space. Officials said the library would now offer free digital courses for seniors. Opening hours were also extended on weekends.
    exercises:
      - type: reading
        question: When did the library reopen? (monday/friday/sunday)
        correctAnswer: monday
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: How long was the renovation? (three months/one year/a week)
        correctAnswer: three months
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: How much did it cost? (half a million dollars/a million dollars/a thousand dollars)
        correctAnswer: half a million dollars
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What doubled? (the reading space/the budget/the staff)
        correctAnswer: the reading space
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Who gets free digital courses? (seniors/children/teachers)
        correctAnswer: seniors
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What was extended? (weekend hours/weekday hours/the building)
        correctAnswer: weekend hours
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Where is the library? (city center/suburbs/countryside)
        correctAnswer: city center
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Is the library big or small? (small/big/medium)
        correctAnswer: small
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Is the library public? (yes/no/unknown)
        correctAnswer: yes
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Did officials speak? (yes/no/unknown)
        correctAnswer: yes
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 2
    title: Environment
    description: Read and answer.
    passage: Scientists reported that a coastal town planted ten thousand trees over the past year. Volunteers worked every weekend, and students from local schools also helped. The project aims to protect the coast from erosion and to create new habitats for birds. Early results already show increased bird activity.
    exercises:
      - type: reading
        question: How many trees were planted? (ten thousand/one hundred/one thousand)
        correctAnswer: ten thousand
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Over what period? (past year/past month/past decade)
        correctAnswer: past year
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Who worked every weekend? (volunteers/scientists/officials)
        correctAnswer: volunteers
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Who else helped? (students/tourists/soldiers)
        correctAnswer: students
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Why plant trees? (to protect the coast/to make money/to build houses)
        correctAnswer: to protect the coast
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What else was created? (new habitats/new roads/new hotels)
        correctAnswer: new habitats
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Which animals benefit? (birds/fish/horses)
        correctAnswer: birds
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What do early results show? (increased bird activity/more tourism/less erosion already)
        correctAnswer: increased bird activity
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What kind of town is it? (coastal/mountain/desert)
        correctAnswer: coastal
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Is the project still ongoing? (yes/no/unknown)
        correctAnswer: yes
        rationale: Reveja o trecho relevante do texto.
target: 20
