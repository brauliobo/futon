title: English L - Separable vs Inseparable Phrasals
level: L
subject: english
difficulty: 5
objectives:
  - B2.grammar.phrasal_verbs
authorNotes: Separable — object (pronoun) goes between verb and particle. Inseparable — object always after the particle.
repeatAll: 2
example: Separable — turn the light off = turn it off. Inseparable — look after him (NOT *look him after).
pages:
  - pageNumber: 1
    title: Separable with Pronouns
    description: Pronouns must go between the verb and the particle.
    exercises:
      - type: english_phrases
        question: Apague a luz (usando 'it')
        correctAnswer: turn it off
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ligue a TV (usando 'it')
        correctAnswer: turn it on
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Pegue a caixa (pick up it)
        correctAnswer: pick it up
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Anote (write down it)
        correctAnswer: write it down
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Experimente (try on it, usando 'them')
        correctAnswer: try them on
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Jogue fora (throw away it)
        correctAnswer: throw it away
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Preencha o formulário (usando 'it')
        correctAnswer: fill it out
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Desligue-o (o computador)
        correctAnswer: shut it down
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Guarde-os
        correctAnswer: put them away
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Recolha-os
        correctAnswer: pick them up
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Inseparable
    description: Pronoun must follow the particle.
    exercises:
      - type: english_phrases
        question: Cuide dele
        correctAnswer: look after him
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Procure por ela
        correctAnswer: look for her
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Esbarrei nele
        correctAnswer: i ran into him
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Contamos com você
        correctAnswer: we count on you
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Fique de olho nela
        correctAnswer: watch out for her
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Apóie-se em mim
        correctAnswer: rely on me
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Penso em você
        correctAnswer: i think of you
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Procuramos por eles
        correctAnswer: we looked for them
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela se dá bem com ele
        correctAnswer: she gets along with him
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Entre no carro
        correctAnswer: get in the car
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
