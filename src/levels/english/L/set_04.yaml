title: English L - Separable vs Inseparable Phrasals
level: L
subject: english
difficulty: 5
objectives: [B2.grammar.phrasal_verbs]
authorNotes: Separable — object (pronoun) goes between verb and particle. Inseparable — object always after the particle.
repeatAll: 2
example: "Separable — turn the light off = turn it off. Inseparable — look after him (NOT *look him after)."
pages:
  - pageNumber: 1
    title: Separable with Pronouns
    description: Pronouns must go between the verb and the particle.
    exercises:
      - { type: english_phrases, question: "Apague a luz (usando 'it')", correctAnswer: turn it off }
      - { type: english_phrases, question: "Ligue a TV (usando 'it')", correctAnswer: turn it on }
      - { type: english_phrases, question: "Pegue a caixa (pick up it)", correctAnswer: pick it up }
      - { type: english_phrases, question: "Anote (write down it)", correctAnswer: write it down }
      - { type: english_phrases, question: "Experimente (try on it, usando 'them')", correctAnswer: try them on }
      - { type: english_phrases, question: "Jogue fora (throw away it)", correctAnswer: throw it away }
      - { type: english_phrases, question: "Preencha o formulário (usando 'it')", correctAnswer: fill it out }
      - { type: english_phrases, question: "Desligue-o (o computador)", correctAnswer: shut it down }
      - { type: english_phrases, question: "Guarde-os", correctAnswer: put them away }
      - { type: english_phrases, question: "Recolha-os", correctAnswer: pick them up }
  - pageNumber: 2
    title: Inseparable
    description: Pronoun must follow the particle.
    exercises:
      - { type: english_phrases, question: "Cuide dele", correctAnswer: look after him }
      - { type: english_phrases, question: "Procure por ela", correctAnswer: look for her }
      - { type: english_phrases, question: "Esbarrei nele", correctAnswer: i ran into him }
      - { type: english_phrases, question: "Contamos com você", correctAnswer: we count on you }
      - { type: english_phrases, question: "Fique de olho nela", correctAnswer: watch out for her }
      - { type: english_phrases, question: "Apóie-se em mim", correctAnswer: rely on me }
      - { type: english_phrases, question: "Penso em você", correctAnswer: i think of you }
      - { type: english_phrases, question: "Procuramos por eles", correctAnswer: we looked for them }
      - { type: english_phrases, question: "Ela se dá bem com ele", correctAnswer: she gets along with him }
      - { type: english_phrases, question: "Entre no carro", correctAnswer: get in the car }
target: 20
