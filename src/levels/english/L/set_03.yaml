title: English L - Phrasal Verbs with 'Look', 'Come', 'Go'
level: L
subject: english
difficulty: 4
objectives:
  - B2.vocab.phrasal_verbs
authorNotes: Look for/after/up/into/forward to; come back/across/up/over; go on/off/through/over/out.
repeatAll: 2
example: Procurar → look for / Visitar → come over
pages:
  - pageNumber: 1
    title: Look & Come
    description: Search, care, appearance, arrival, discovery.
    exercises:
      - type: english_phrases
        question: Estou procurando minhas chaves
        correctAnswer: i am looking for my keys
        rationale: "'Come along' = aparecer/acompanhar."
      - type: english_phrases
        question: Cuide do cachorro
        correctAnswer: look after the dog
        rationale: "'Come up with' = bolar ideia; 'come on' = vamos!"
      - type: english_phrases
        question: Pesquise essa palavra
        correctAnswer: look up that word
        rationale: "'Go away' = sair fora; 'go back' = voltar."
      - type: english_phrases
        question: Eles estão investigando o caso
        correctAnswer: they are looking into the case
        rationale: "'Look up' = pesquisar; 'look forward to' = ansiar."
      - type: english_phrases
        question: Mal posso esperar para te ver
        correctAnswer: i look forward to seeing you
        rationale: "'Look forward to + verb-ing' — 'to' é preposição."
      - type: english_phrases
        question: Ele voltou tarde
        correctAnswer: he came back late
        rationale: "'Come back' = voltar; 'come across' = encontrar por acaso."
      - type: english_phrases
        question: Encontrei uma foto antiga
        correctAnswer: i came across an old photo
        rationale: "'Go on' = continuar; 'go off' = disparar/estragar."
      - type: english_phrases
        question: Algo surgiu
        correctAnswer: something came up
        rationale: "'Come back' = voltar; 'come across' = encontrar por acaso."
      - type: english_phrases
        question: Passe na minha casa
        correctAnswer: come over to my place
        rationale: "'Look after' = cuidar; 'look for' = procurar."
      - type: english_phrases
        question: Ela inventou uma ideia
        correctAnswer: she came up with an idea
        rationale: "'Go away' = sair fora; 'go back' = voltar."
  - pageNumber: 2
    title: Go
    description: Continuation, explosion, examination, exit.
    exercises:
      - type: english_phrases
        question: Continue falando
        correctAnswer: go on talking
        rationale: "Sentido raramente literal — memorize."
      - type: english_phrases
        question: A bomba explodiu
        correctAnswer: the bomb went off
        rationale: "'Come along' = aparecer/acompanhar."
      - type: english_phrases
        question: Passe pelo documento
        correctAnswer: go through the document
        rationale: "'Come up with' = bolar ideia; 'come on' = vamos!"
      - type: english_phrases
        question: Revise suas respostas
        correctAnswer: go over your answers
        rationale: "Sentido raramente literal — memorize."
      - type: english_phrases
        question: Saímos ontem à noite
        correctAnswer: we went out last night
        rationale: "'Come back' = voltar; 'come across' = encontrar por acaso."
      - type: english_phrases
        question: Minha mãe faz isso há anos
        correctAnswer: my mom goes on about it
        rationale: "'Go away' = sair fora; 'go back' = voltar."
      - type: english_phrases
        question: O alarme disparou
        correctAnswer: the alarm went off
        rationale: "'Come along' = aparecer/acompanhar."
      - type: english_phrases
        question: Ele foi buscar ela
        correctAnswer: he went after her
        rationale: "'Go on' = continuar; 'go off' = disparar/estragar."
      - type: english_phrases
        question: A energia acabou
        correctAnswer: the power went out
        rationale: "'Come back' = voltar; 'come across' = encontrar por acaso."
      - type: english_phrases
        question: Volte para sua casa
        correctAnswer: go back home
        rationale: "'Look after' = cuidar; 'look for' = procurar."
target: 20
