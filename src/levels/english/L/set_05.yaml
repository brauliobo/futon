title: English L - Reading Comprehension — Daily Life
level: L
subject: english
difficulty: 4
objectives:
  - B2.reading.comprehension
authorNotes: Short passages followed by inference questions. Answers must match passage literally.
example: Read the passage; answer in English.
pages:
  - pageNumber: 1
    title: The Morning Routine
    description: Read and answer.
    passage: Every weekday, Clara wakes up at six. She drinks coffee, walks to the office, and starts work at eight. On Fridays, she leaves early to meet friends at a cafe near the park. She never skips breakfast.
    exercises:
      - type: reading
        question: What time does Clara wake up? (six/seven/eight)
        correctAnswer: six
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: How does she go to work? (walks/drives/by bus)
        correctAnswer: walks
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: When does she leave early? (on fridays/every day/on weekends)
        correctAnswer: on fridays
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Where does she meet friends? (at a cafe/at home/at the office)
        correctAnswer: at a cafe
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What does she never skip? (breakfast/lunch/dinner)
        correctAnswer: breakfast
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What time does she start work? (eight/seven/nine)
        correctAnswer: eight
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What does she drink in the morning? (coffee/tea/juice)
        correctAnswer: coffee
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Where is the cafe? (near the park/near the beach/at home)
        correctAnswer: near the park
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Does she work on weekends? (no/yes/sometimes)
        correctAnswer: no
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Is her routine regular or varied? (regular/varied/unknown)
        correctAnswer: regular
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 2
    title: A Weekend Trip
    description: Read and answer.
    passage: Last weekend, David and his brother drove to the mountains. They stayed in a small cabin for two nights. On Saturday they hiked a long trail and took many photos. On Sunday, they had breakfast by the lake before driving home in the afternoon. They plan to return next month.
    exercises:
      - type: reading
        question: Where did they go? (to the mountains/to the beach/abroad)
        correctAnswer: to the mountains
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: How many nights did they stay? (two/one/three)
        correctAnswer: two
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Who traveled with David? (his brother/his friend/alone)
        correctAnswer: his brother
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What did they do on Saturday? (hiked a trail/stayed in the cabin/went shopping)
        correctAnswer: hiked a trail
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Where did they have breakfast on Sunday? (by the lake/at the cabin/at a restaurant)
        correctAnswer: by the lake
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: How did they travel? (drove/flew/took a bus)
        correctAnswer: drove
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: When do they plan to return? (next month/next year/never)
        correctAnswer: next month
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What did they take? (photos/souvenirs/nothing)
        correctAnswer: photos
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Which day did they go home? (sunday/saturday/monday)
        correctAnswer: sunday
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Was the cabin big or small? (small/big/medium)
        correctAnswer: small
        rationale: Reveja o trecho relevante do texto.
target: 20
