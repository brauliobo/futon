title: ✏️ English L - Pronunciation & Spelling Patterns
level: L
subject: english
difficulty: 5
objectives:
  - C1.mastery.spelling_pronunciation
authorNotes: C1 spelling and pronunciation awareness — silent letters (knight, psychology, subtle), common irregulars (rhythm, queue, bureaucracy), homophones (there/their, affect/effect), and tricky spelling patterns. Sentences contextualize the target words.
repeatAll: 2
example: "Ex.: 'O psicólogo estuda o comportamento humano' → The psychologist studies human behaviour."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Silent Letters and Irregular Spelling
    description: Words with silent letters or non-phonetic spelling at C1 level.
    exercises:
      - type: english_phrases
        question: O psicólogo estudou o comportamento do grupo
        correctAnswer: The psychologist studied the group's behaviour
        rationale: "'Psychologist' — 'ps-' inicial mudo. 'Behaviour' (BrE) = comportamento."
        difficulty: 3
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: O cavaleiro cruzou a ponte à meia-noite
        correctAnswer: The knight crossed the bridge at midnight
        rationale: "'Knight' — 'kn-' mudo, pronuncia-se /naɪt/. Homófono de 'night'."
        difficulty: 3
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: A diferença era sutil mas importante
        correctAnswer: The difference was subtle but important
        rationale: "'Subtle' — 'b' mudo, pronuncia-se /ˈsʌtl/. Armadilha ortográfica C1."
        difficulty: 3
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: O ritmo da música era hipnotizante
        correctAnswer: The rhythm of the music was hypnotic
        rationale: "'Rhythm' = /ˈrɪðəm/ — sem vogal clara. 'Hypnotic' = adjetivo C1."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: Havia uma fila enorme do lado de fora
        correctAnswer: There was a huge queue outside
        rationale: "'Queue' = fila, pronuncia-se /kjuː/. Ortografia irregular C1."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: A burocracia atrasou o processo
        correctAnswer: The bureaucracy delayed the process
        rationale: "'Bureaucracy' = /bjʊˈrɒkrəsi/ — ortografia francesa no inglês C2."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: O conhecimento é a chave do sucesso
        correctAnswer: Knowledge is the key to success
        rationale: "'Knowledge' = /ˈnɒlɪdʒ/ — 'kn-' mudo, 'w' mudo. Ortografia irregular C1."
        difficulty: 3
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: A dívida pública cresceu consideravelmente
        correctAnswer: The public debt grew considerably
        rationale: "'Debt' = /det/ — 'b' mudo. Colocação 'public debt grew' C1."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: Ela respondeu à pergunta com confiança
        correctAnswer: She answered the question confidently
        rationale: "'Answer' = /ˈɑːnsə/ — 'w' mudo. 'Confidently' = advérbio C1."
        difficulty: 3
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: A consciência dele o perturbou por dias
        correctAnswer: His conscience troubled him for days
        rationale: "'Conscience' = /ˈkɒnʃəns/ — -sci- pronunciado /ʃ/. Armadilha C2."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
  - pageNumber: 2
    title: Homophones and Commonly Confused Words
    description: C1/C2 awareness of homophones and easily confused pairs.
    exercises:
      - type: english_phrases
        question: O estresse afeta a saúde mental
        correctAnswer: Stress affects mental health
        rationale: "'Affect' (verbo) = afetar. 'Effect' = o resultado/substantivo. C1 nuance."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: Os seus livros estão ali
        correctAnswer: Their books are over there
        rationale: "'Their' = deles (possessivo). 'There' = ali. Homófonos clássicos C1."
        difficulty: 3
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: O advogado citou o precedente legal correto
        correctAnswer: The lawyer cited the correct legal precedent
        rationale: "'Precedent' = /ˈpresɪdənt/ ≠ 'president'. Parônimos C2 de confusão."
        difficulty: 5
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: O complemento da frase estava errado
        correctAnswer: The complement of the sentence was wrong
        rationale: "'Complement' (completar) ≠ 'compliment' (elogio). Parônimos C1."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: Ele garantiu que o princípio estava correto
        correctAnswer: He ensured that the principle was correct
        rationale: "'Principle' = princípio/norma. 'Principal' = principal/diretor. C1."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: Ela foi discretamente influente na decisão
        correctAnswer: She was discreetly influential in the decision
        rationale: "'Discreetly' = discretamente. 'Discrete' = separado/distinto. C2 nuance."
        difficulty: 5
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: Eles aceitaram todos os imigrantes
        correctAnswer: They accepted all the immigrants
        rationale: "'Immigrate' (entrar) vs 'emigrate' (sair). 'Accepted' = aceitaram C1."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: O relatório foi enviado ao governo local
        correctAnswer: The report was sent to the local government
        rationale: "'Stationery' (papel) vs 'stationary' (parado). Contexto correto C1."
        difficulty: 4
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: A previsão do tempo para amanhã é chuvosa
        correctAnswer: The weather forecast for tomorrow is rainy
        rationale: "'Weather' = clima. 'Whether' = se (conj.). Homófonos C1 de alta frequência."
        difficulty: 3
        objectives: [C1.mastery.spelling_pronunciation]
      - type: english_phrases
        question: Ele ficou pasmo com a reação dos colegas
        correctAnswer: He was astounded by his colleagues' reaction
        rationale: "'Astounded' = pasmo. 'Colleagues'' possessivo plural C1."
        difficulty: 5
        objectives: [C1.mastery.spelling_pronunciation]
target: 20
