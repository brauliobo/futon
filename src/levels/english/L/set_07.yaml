title: English L - Phrasal Verbs & Reading Mixed
level: L
subject: english
difficulty: 5
objectives:
  - B2.vocab.phrasal_verbs
  - B2.reading.comprehension
authorNotes: Combined review — phrasal verbs in context plus a final short passage.
example: I ran into an old friend → esbarrei em um velho amigo
pages:
  - pageNumber: 1
    title: Phrasal Verbs in Context
    description: Pick the correct phrasal verb meaning.
    exercises:
      - type: english_phrases
        question: Esbarrei em um velho amigo
        correctAnswer: i ran into an old friend
        rationale: "Identifique verbo + partícula como unidade."
      - type: english_phrases
        question: Desligue o celular
        correctAnswer: turn off the phone
        rationale: "Revise listas temáticas de phrasals frequentes."
      - type: english_phrases
        question: Ele sempre se atrasa
        correctAnswer: he always shows up late
        rationale: "Identifique verbo + partícula como unidade."
      - type: english_phrases
        question: Chegou a hora de desistir
        correctAnswer: it is time to give up
        rationale: "Contexto do texto dá pista do sentido."
      - type: english_phrases
        question: Ele deixou de beber
        correctAnswer: he gave up drinking
        rationale: "Identifique verbo + partícula como unidade."
      - type: english_phrases
        question: Eu te peguei (ronda/pickup)
        correctAnswer: i picked you up
        rationale: "Nem todo 'verbo + preposição' é phrasal."
      - type: english_phrases
        question: Preencha o formulário
        correctAnswer: fill out the form
        rationale: "Phrasals têm registro mais informal."
      - type: english_phrases
        question: Descobri a verdade
        correctAnswer: i found out the truth
        rationale: "Separáveis vs inseparáveis: observe o objeto."
      - type: english_phrases
        question: Resolvemos o problema (work out)
        correctAnswer: we worked out the problem
        rationale: "Verbos comuns (get, take, put, look) formam muitos phrasals."
      - type: english_phrases
        question: Apareceu do nada
        correctAnswer: it came out of nowhere
        rationale: "Contexto do texto dá pista do sentido."
  - pageNumber: 2
    title: Short Passage — Mixed
    description: Apply inference and detail recognition.
    passage: Maya had been thinking about moving abroad for years. Last spring she finally made up her mind and started learning Japanese. She practiced every day and also signed up for an exchange program. In August she got on a plane to Tokyo, ready to face a new challenge.
    exercises:
      - type: reading
        question: What had Maya been thinking about? (moving abroad/changing jobs/buying a house)
        correctAnswer: moving abroad
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: When did she decide? (last spring/this summer/five years ago)
        correctAnswer: last spring
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What language did she start learning? (japanese/chinese/korean)
        correctAnswer: japanese
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: How often did she practice? (every day/once a week/rarely)
        correctAnswer: every day
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What did she sign up for? (an exchange program/a language school/a scholarship)
        correctAnswer: an exchange program
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: When did she travel? (in august/in june/in december)
        correctAnswer: in august
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Where did she go? (tokyo/kyoto/osaka)
        correctAnswer: tokyo
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What phrasal verb means 'decided'? (made up her mind/gave up/turned down)
        correctAnswer: made up her mind
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: What phrasal verb means 'boarded'? (got on/got off/got up)
        correctAnswer: got on
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Is she ready? (yes/no/unknown)
        correctAnswer: yes
        rationale: Reveja o trecho relevante do texto.
target: 20
