title: ✏️ English L - Advanced Phrasal Verbs Business
level: L
subject: english
difficulty: 5
objectives:
  - C1.mastery.business_phrasals
authorNotes: C1 business phrasals — take on, draw up, carry out, put forward, set up, follow through, back down, phase out, bring in, hand over.
repeatAll: 2
example: "Ex.: 'A empresa contratou novos funcionários' → The company took on new employees."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Phrasals in the Workplace
    description: High-frequency business phrasals at C1 level.
    exercises:
      - type: english_phrases
        question: A empresa contratou novos funcionários
        correctAnswer: The company took on new employees
        rationale: "'Take on' = contratar/assumir. Colocation empresarial padrão C1."
        difficulty: 3
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: Elaboramos um contrato novo
        correctAnswer: We drew up a new contract
        rationale: "'Draw up' = elaborar/redigir (documento formal). Past 'drew up'."
        difficulty: 3
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: A equipe realizou a pesquisa
        correctAnswer: The team carried out the research
        rationale: "'Carry out' = realizar/executar (tarefa ou projeto). Inseparável."
        difficulty: 3
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: Ela apresentou uma proposta inovadora
        correctAnswer: She put forward an innovative proposal
        rationale: "'Put forward' = apresentar/propor (ideia formal). Separável."
        difficulty: 3
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: Eles montaram uma nova filial
        correctAnswer: They set up a new branch
        rationale: "'Set up' = montar/estabelecer (empresa ou estrutura). Separável."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: O gerente seguiu com o plano
        correctAnswer: The manager followed through with the plan
        rationale: "'Follow through' = cumprir até o fim. 'With' introduz o objeto."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: A empresa está eliminando gradualmente esse produto
        correctAnswer: The company is phasing out that product
        rationale: "'Phase out' = eliminar gradualmente. Separável; produto = objeto."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: Eles trouxeram um consultor externo
        correctAnswer: They brought in an external consultant
        rationale: "'Bring in' = contratar externamente/trazer. Separável."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: A diretora entregou o cargo ao sucessor
        correctAnswer: The director handed over the role to her successor
        rationale: "'Hand over' = transferir/entregar responsabilidade formalmente."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: A gerência recuou na decisão
        correctAnswer: The management backed down on the decision
        rationale: "'Back down' = recuar/desistir de posição. 'On' introduz o tema."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
  - pageNumber: 2
    title: Phrasals in Meetings and Reports
    description: C1/C2 business phrasals in professional discourse.
    exercises:
      - type: english_phrases
        question: O projeto foi adiado indefinidamente
        correctAnswer: The project was put off indefinitely
        rationale: "'Put off' = adiar. Voz passiva; 'indefinitely' = sem prazo."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: Eles cortaram custos drasticamente
        correctAnswer: They cut back on costs drastically
        rationale: "'Cut back on' = reduzir (despesas). 'Drastically' reforça C1."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: O departamento deixou cair a bola
        correctAnswer: The department let the ball drop
        rationale: "'Let the ball drop' = negligenciar responsabilidade. Idioma empresarial."
        difficulty: 5
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: Precisamos escalar essa decisão para a liderança
        correctAnswer: We need to escalate this decision to leadership
        rationale: "'Escalate to' = levar a nível superior. Verbo formal em contexto corporativo."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: Eles terceirizaram o suporte técnico
        correctAnswer: They outsourced technical support
        rationale: "'Outsource' = terceirizar. Verbo simples mas de registro C1."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: O acordo foi selado com um aperto de mãos
        correctAnswer: The deal was sealed with a handshake
        rationale: "'Seal a deal' = fechar acordo. 'With a handshake' = metáfora de confiança."
        difficulty: 5
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: A empresa está se expandindo para novos mercados
        correctAnswer: The company is branching out into new markets
        rationale: "'Branch out into' = expandir para nova área. Phrasal inseparável."
        difficulty: 5
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: Eles cumpriram com todas as metas trimestrais
        correctAnswer: They met all quarterly targets
        rationale: "'Meet targets' = cumprir metas. Colocation formal de negócios C1."
        difficulty: 4
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: O CEO foi afastado do cargo
        correctAnswer: The CEO was removed from his position
        rationale: "'Remove from position' = afastar formalmente. Passiva de registro alto."
        difficulty: 5
        objectives: [C1.mastery.business_phrasals]
      - type: english_phrases
        question: A fusão foi concluída após meses de negociação
        correctAnswer: The merger was completed after months of negotiation
        rationale: "'Complete a merger' = concluir fusão. 'After months of' = colocação C1."
        difficulty: 5
        objectives: [C1.mastery.business_phrasals]
target: 20
