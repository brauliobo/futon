title: ✏️ English L - Collocations C1 Level
level: L
subject: english
difficulty: 5
objectives:
  - C1.mastery.collocations
authorNotes: C1 collocations — reach a consensus, draw a conclusion, raise awareness, bear responsibility, take initiative, make a breakthrough, run the risk, meet a deadline, hold a position, cast doubt.
repeatAll: 2
example: "Ex.: 'Chegamos a um consenso' → We reached a consensus."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Verb-Noun Collocations
    description: High-register verb+noun pairs essential at C1 level.
    exercises:
      - type: english_phrases
        question: Chegamos a um consenso
        correctAnswer: We reached a consensus
        rationale: "'Reach a consensus' = chegar a acordo coletivo. Colocação formal C1."
        difficulty: 3
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Ela tirou uma conclusão errada
        correctAnswer: She drew the wrong conclusion
        rationale: "'Draw a conclusion' = tirar/chegar a uma conclusão. 'Wrong' = errada."
        difficulty: 3
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: A campanha aumentou a conscientização sobre o problema
        correctAnswer: The campaign raised awareness of the problem
        rationale: "'Raise awareness' = aumentar conscientização. 'Of' introduz o tema."
        difficulty: 3
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Você deve assumir a responsabilidade
        correctAnswer: You must bear responsibility
        rationale: "'Bear responsibility' = assumir responsabilidade (registro formal/legal)."
        difficulty: 4
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Ela tomou a iniciativa de falar
        correctAnswer: She took the initiative to speak
        rationale: "'Take the initiative' = tomar a iniciativa. 'To' + infinitivo."
        difficulty: 3
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Os cientistas fizeram uma descoberta
        correctAnswer: The scientists made a breakthrough
        rationale: "'Make a breakthrough' = fazer uma descoberta/avanço. Colocação C1."
        difficulty: 4
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Não quero correr esse risco
        correctAnswer: I don't want to run that risk
        rationale: "'Run the risk' = correr o risco. 'That risk' específico."
        difficulty: 4
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Precisamos cumprir o prazo
        correctAnswer: We need to meet the deadline
        rationale: "'Meet a deadline' = cumprir prazo. Colocação padrão no contexto profissional."
        difficulty: 3
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Ela ocupa um cargo de liderança
        correctAnswer: She holds a leadership position
        rationale: "'Hold a position' = ocupar um cargo. Mais formal que 'have a position'."
        difficulty: 4
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Isso lança dúvidas sobre a teoria
        correctAnswer: This casts doubt on the theory
        rationale: "'Cast doubt on' = lançar dúvida sobre. Colocação C2 de argumento crítico."
        difficulty: 4
        objectives: [C1.mastery.collocations]
  - pageNumber: 2
    title: Adjective-Noun and Adverb Collocations
    description: C1/C2 collocations with adjectives, adverbs and intensifiers.
    exercises:
      - type: english_phrases
        question: Havia uma diferença marcante entre os dois
        correctAnswer: There was a striking difference between the two
        rationale: "'Striking difference' = diferença marcante. Colocação adjetival C1."
        difficulty: 4
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Ela fez um progresso notável
        correctAnswer: She made remarkable progress
        rationale: "'Remarkable progress' = progresso notável. 'Progress' incontável, sem artigo."
        difficulty: 4
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Ele claramente entendeu mal a situação
        correctAnswer: He clearly misunderstood the situation
        rationale: "'Clearly misunderstood' = entendeu mal claramente. Adv+V colocação C1."
        difficulty: 4
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Há uma crescente preocupação com o clima
        correctAnswer: There is growing concern about the climate
        rationale: "'Growing concern' = preocupação crescente. 'About' introduz tema."
        difficulty: 4
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Ele expressou forte oposição à proposta
        correctAnswer: He expressed strong opposition to the proposal
        rationale: "'Strong opposition' = oposição forte. 'Express opposition' = colocação formal."
        difficulty: 5
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: A decisão teve consequências de longo alcance
        correctAnswer: The decision had far-reaching consequences
        rationale: "'Far-reaching consequences' = consequências de longo alcance. Colocação C2."
        difficulty: 5
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: O discurso foi recebido com aplausos entusiásticos
        correctAnswer: The speech was met with enthusiastic applause
        rationale: "'Met with applause' = recebido com aplausos. 'Enthusiastic' reforça C1."
        difficulty: 5
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Isso levantou uma questão fundamental
        correctAnswer: This raised a fundamental question
        rationale: "'Raise a question' = levantar uma questão. 'Fundamental' = colocação C1."
        difficulty: 4
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: Ela manteve um silêncio eloquente
        correctAnswer: She maintained an eloquent silence
        rationale: "'Eloquent silence' = silêncio eloqüente. Colocação avançada C2."
        difficulty: 5
        objectives: [C1.mastery.collocations]
      - type: english_phrases
        question: O projeto exige uma atenção meticulosa aos detalhes
        correctAnswer: The project requires meticulous attention to detail
        rationale: "'Meticulous attention to detail' = colocação profissional C2."
        difficulty: 5
        objectives: [C1.mastery.collocations]
target: 20
