title: ✏️ English L - Word Formation Prefixes
level: L
subject: english
difficulty: 5
objectives:
  - C1.mastery.word_formation_prefixes
authorNotes: C1 prefix word formation — mis-, over-, under-, pre-, re-, dis-, un-, counter-, anti-, extra-. Translate Portuguese sentences containing prefixed words.
repeatAll: 2
example: "Ex.: 'Ele interpretou mal a situação' → He misinterpreted the situation."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Prefixes mis-, over-, under-
    description: Negative, excess and deficiency prefixes in context.
    exercises:
      - type: english_phrases
        question: Ele interpretou mal o sinal
        correctAnswer: He misread the signal
        rationale: "'Mis-' = erro/equívoco. 'Misread' = ler/interpretar mal. Passado irregular."
        difficulty: 3
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: O gerente superestimou os custos
        correctAnswer: The manager overestimated the costs
        rationale: "'Over-' = excesso. 'Overestimate' = superestimar. Past regular."
        difficulty: 3
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: Os trabalhadores estavam sobrecarregados
        correctAnswer: The workers were overworked
        rationale: "'Overworked' = sobrecarregado de trabalho. Predicativo com 'were'."
        difficulty: 3
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: Os talentos dela foram subestimados
        correctAnswer: Her talents were underestimated
        rationale: "'Under-' = abaixo/insuficiente. 'Underestimate' passiva C1."
        difficulty: 3
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: O financiamento do projeto estava aquém do necessário
        correctAnswer: The project was underfunded
        rationale: "'Underfunded' = com financiamento insuficiente. Adjetivo predicativo C1."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: Ela foi promovida antes do esperado
        correctAnswer: She was promoted ahead of schedule
        rationale: "Estrutura perifrástica; 'precocemente' → 'ahead of schedule' C1."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: O relatório foi mal elaborado
        correctAnswer: The report was poorly drafted
        rationale: "'Poorly' = mal (advérbio). 'Draft' = elaborar. Alternativa a 'mis-' C1."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: Eles supervisionaram o processo inteiro
        correctAnswer: They oversaw the entire process
        rationale: "'Oversee' = supervisionar. Past irregular 'oversaw'. Prefixo over- C1."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: A informação foi distorcida pela mídia
        correctAnswer: The information was misrepresented by the media
        rationale: "'Misrepresent' = distorcer/representar mal. Passiva C1."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: O produto não correspondeu às expectativas
        correctAnswer: The product underperformed
        rationale: "'Underperform' = ter desempenho abaixo do esperado. Forma simples C1."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
  - pageNumber: 2
    title: Prefixes pre-, re-, dis- and others
    description: Temporal, repetition and negation prefixes at C1/C2 level.
    exercises:
      - type: english_phrases
        question: A reunião foi agendada com antecedência
        correctAnswer: The meeting was pre-arranged
        rationale: "'Pre-' = antes/antecipação. 'Pre-arranged' = agendado previamente."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: Precisamos reformular a estratégia
        correctAnswer: We need to reformulate the strategy
        rationale: "'Re-' = repetição/nova ação. 'Reformulate' = formular novamente."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: Ela discordou da avaliação
        correctAnswer: She disagreed with the assessment
        rationale: "'Dis-' = negação/oposição. 'Disagree with' = discordar de. Colocação C1."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: O contrato foi rescindido
        correctAnswer: The contract was discontinued
        rationale: "'Dis-' = cessação. 'Discontinue' = rescindir/encerrar. Passiva formal."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: As condições foram predeterminadas
        correctAnswer: The conditions were predetermined
        rationale: "'Pre-' = estabelecido antes. 'Predetermined' = predefinido. Passiva C1."
        difficulty: 5
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: Os dados foram reinterpretados
        correctAnswer: The data was reinterpreted
        rationale: "'Re-' + 'interpret' = reinterpretar. 'Data' singular ou plural (C1 nuance)."
        difficulty: 5
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: O plano foi contrariado por circunstâncias externas
        correctAnswer: The plan was counteracted by external circumstances
        rationale: "'Counter-' = contra/em oposição. 'Counteract' = contrariar/neutralizar."
        difficulty: 5
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: Ela estava insatisfeita com o resultado
        correctAnswer: She was dissatisfied with the outcome
        rationale: "'Dis-' = negação de satisfação. 'Dissatisfied with' = colocação C1."
        difficulty: 4
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: A medida foi anticlimática
        correctAnswer: The measure was anticlimactic
        rationale: "'Anti-' = contra/oposição. 'Anticlimactic' = abaixo das expectativas C2."
        difficulty: 5
        objectives: [C1.mastery.word_formation_prefixes]
      - type: english_phrases
        question: Suas habilidades extraordinárias impressionaram a todos
        correctAnswer: His extraordinary skills impressed everyone
        rationale: "'Extra-' = além do normal. 'Extraordinary' = adjetivo C1 de registro alto."
        difficulty: 5
        objectives: [C1.mastery.word_formation_prefixes]
target: 20
