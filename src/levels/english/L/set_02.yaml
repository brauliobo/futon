title: English L - Phrasal Verbs with 'Take' and 'Put'
level: L
subject: english
difficulty: 4
objectives: [B2.vocab.phrasal_verbs]
authorNotes: Take off, take on, take over, take out, take after; put on, put off, put up with, put out, put down.
repeatAll: 2
example: "Tirar o casaco → take off the coat / Vestir → put on"
pages:
  - pageNumber: 1
    title: Take Phrasals
    description: Actions of removal, assumption, and inheritance.
    exercises:
      - { type: english_phrases, question: "Tirei o casaco", correctAnswer: i took off my coat }
      - { type: english_phrases, question: "O avião decolou", correctAnswer: the plane took off }
      - { type: english_phrases, question: "Ele assumiu o projeto", correctAnswer: he took on the project }
      - { type: english_phrases, question: "Ela assumiu a empresa", correctAnswer: she took over the company }
      - { type: english_phrases, question: "Leve o lixo para fora", correctAnswer: take out the garbage }
      - { type: english_phrases, question: "Ele puxou ao pai", correctAnswer: he takes after his father }
      - { type: english_phrases, question: "Anote isso", correctAnswer: write it down }
      - { type: english_phrases, question: "Leve ela para jantar", correctAnswer: take her out for dinner }
      - { type: english_phrases, question: "O projeto decolou", correctAnswer: the project took off }
      - { type: english_phrases, question: "Não leve para o lado pessoal", correctAnswer: do not take it personally }
  - pageNumber: 2
    title: Put Phrasals
    description: Placement, postponement, tolerance.
    exercises:
      - { type: english_phrases, question: "Coloquei meu casaco", correctAnswer: i put on my coat }
      - { type: english_phrases, question: "A reunião foi adiada", correctAnswer: the meeting was put off }
      - { type: english_phrases, question: "Não aguento mais isso", correctAnswer: i cannot put up with this anymore }
      - { type: english_phrases, question: "Apague o cigarro", correctAnswer: put out the cigarette }
      - { type: english_phrases, question: "Ponha o livro aí", correctAnswer: put down the book }
      - { type: english_phrases, question: "Guarde seus brinquedos", correctAnswer: put away your toys }
      - { type: english_phrases, question: "Ela economizou bastante", correctAnswer: she put aside a lot }
      - { type: english_phrases, question: "Adiei a viagem", correctAnswer: i put off the trip }
      - { type: english_phrases, question: "Ponha ele na linha", correctAnswer: put him through }
      - { type: english_phrases, question: "Eles fizeram um ótimo espetáculo", correctAnswer: they put on a great show }
target: 20
