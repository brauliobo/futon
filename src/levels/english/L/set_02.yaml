title: English L - Phrasal Verbs with 'Take' and 'Put'
level: L
subject: english
difficulty: 4
objectives:
  - B2.vocab.phrasal_verbs
authorNotes: Take off, take on, take over, take out, take after; put on, put off, put up with, put out, put down.
repeatAll: 2
example: Tirar o casaco → take off the coat / Vestir → put on
pages:
  - pageNumber: 1
    title: Take Phrasals
    description: Actions of removal, assumption, and inheritance.
    exercises:
      - type: english_phrases
        question: Tirei o casaco
        correctAnswer: i took off my coat
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O avião decolou
        correctAnswer: the plane took off
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele assumiu o projeto
        correctAnswer: he took on the project
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela assumiu a empresa
        correctAnswer: she took over the company
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Leve o lixo para fora
        correctAnswer: take out the garbage
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele puxou ao pai
        correctAnswer: he takes after his father
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Anote isso
