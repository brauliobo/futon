title: English L - Phrasal Verbs with 'Take' and 'Put'
level: L
subject: english
difficulty: 4
objectives:
  - B2.vocab.phrasal_verbs
authorNotes: Take off, take on, take over, take out, take after; put on, put off, put up with, put out, put down.
repeatAll: 2
example: Tirar o casaco → take off the coat / Vestir → put on
pages:
  - pageNumber: 1
    title: Take Phrasals
    description: Actions of removal, assumption, and inheritance.
    exercises:
      - type: english_phrases
        question: Tirei o casaco
        correctAnswer: I took off my coat
        rationale: "'Take off' = tirar (roupa). 'Took' past. 'My coat' (possessivo)."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: O avião decolou
        correctAnswer: The plane took off
        rationale: "'Take off' = decolar (avião). Mesmo verbo, sentido diferente."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ele assumiu o projeto
        correctAnswer: He took on the project
        rationale: "'Take on' = assumir (responsabilidade/projeto)."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ela assumiu a empresa
        correctAnswer: She took over the company
        rationale: "'Take over' = assumir controle de (empresa/posição)."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Leve o lixo para fora
        correctAnswer: Take out the garbage
        rationale: "'Take out' = pôr para fora. 'Garbage' = lixo (AmE)."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ele puxou ao pai
        correctAnswer: He takes after his father
        rationale: "'Take after' = parecer com/puxar a. 'Takes' (3ª pessoa)."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Anote isso
        correctAnswer: Write it down
        rationale: "'Write down' = anotar. 'It' no meio (separável com pronome)."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Leve ela para jantar
        correctAnswer: Take her out for dinner
        rationale: "'Take someone out' = levar para sair. 'For dinner' = jantar."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: O projeto decolou
        correctAnswer: The project took off
        rationale: "'Take off' = deslanchar (projeto/ideia). Uso figurado."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Não leve para o lado pessoal
        correctAnswer: Do not take it personally
        rationale: "'Take it personally' = levar para o lado pessoal (expressão)."
        difficulty: 3
        objectives: [B2.vocab.phrasal_verbs]
  - pageNumber: 2
    title: Put Phrasals
    description: Placement, postponement, tolerance.
    exercises:
      - type: english_phrases
        question: Coloquei meu casaco
        correctAnswer: I put on my coat
        rationale: "'Put on' = vestir/colocar (roupa). Oposto de 'take off'."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: A reunião foi adiada
        correctAnswer: The meeting was put off
        rationale: "'Put off' = adiar. Passiva: 'was put off' (particípio = past)."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Não aguento mais isso
        correctAnswer: I cannot put up with this anymore
        rationale: "'Put up with' = tolerar/aguentar. 'Anymore' = mais (negativa)."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Apague o cigarro
        correctAnswer: Put out the cigarette
        rationale: "'Put out' = apagar (fogo/cigarro)."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ponha o livro aí
        correctAnswer: Put down the book
        rationale: "'Put down' = pousar/colocar no chão (objeto)."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Guarde seus brinquedos
        correctAnswer: Put away your toys
        rationale: "'Put away' = guardar (no lugar). 'Your toys' (possessivo)."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ela economizou bastante
        correctAnswer: She put aside a lot
        rationale: "'Put aside' = pôr de lado/economizar. 'A lot' = bastante."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Adiei a viagem
        correctAnswer: I put off the trip
        rationale: "'Put off' = adiar. 'The trip' (viagem específica)."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Ponha ele na linha
        correctAnswer: Put him through
        rationale: "'Put through' = passar ligação. 'Him' entre verbo e partícula."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
      - type: english_phrases
        question: Eles fizeram um ótimo espetáculo
        correctAnswer: They put on a great show
        rationale: "'Put on a show' = fazer espetáculo (outro sentido de 'put on')."
        difficulty: 4
        objectives: [B2.vocab.phrasal_verbs]
target: 20
