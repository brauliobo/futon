title: English L - Phrasal Verbs with 'Take' and 'Put'
level: L
subject: english
difficulty: 4
objectives:
  - B2.vocab.phrasal_verbs
authorNotes: Take off, take on, take over, take out, take after; put on, put off, put up with, put out, put down.
repeatAll: 2
example: Tirar o casaco → take off the coat / Vestir → put on
pages:
  - pageNumber: 1
    title: Take Phrasals
    description: Actions of removal, assumption, and inheritance.
    exercises:
      - type: english_phrases
        question: Tirei o casaco
        correctAnswer: i took off my coat
        rationale: "'Put away' = guardar; 'put together' = montar."
      - type: english_phrases
        question: O avião decolou
        correctAnswer: the plane took off
        rationale: "'Take after' = puxar a — inseparável."
      - type: english_phrases
        question: Ele assumiu o projeto
        correctAnswer: he took on the project
        rationale: "'Take it off', 'put it on' — pronome no meio."
      - type: english_phrases
        question: Ela assumiu a empresa
        correctAnswer: she took over the company
        rationale: "'Put away' = guardar; 'put together' = montar."
      - type: english_phrases
        question: Leve o lixo para fora
        correctAnswer: take out the garbage
        rationale: "'Put on' = vestir; 'put off' = adiar."
      - type: english_phrases
        question: Ele puxou ao pai
        correctAnswer: he takes after his father
        rationale: "'Take after' = puxar a — inseparável."
      - type: english_phrases
        question: Anote isso
        correctAnswer: write it down
        rationale: "Separáveis aceitam pronome entre verbo e partícula."
      - type: english_phrases
        question: Leve ela para jantar
        correctAnswer: take her out for dinner
        rationale: "'Put away' = guardar; 'put together' = montar."
      - type: english_phrases
        question: O projeto decolou
        correctAnswer: the project took off
        rationale: "'Put on' = vestir; 'put off' = adiar."
      - type: english_phrases
        question: Não leve para o lado pessoal
        correctAnswer: do not take it personally
        rationale: "'Take off' = decolar/tirar; 'take on' = assumir."
  - pageNumber: 2
    title: Put Phrasals
    description: Placement, postponement, tolerance.
    exercises:
      - type: english_phrases
        question: Coloquei meu casaco
        correctAnswer: i put on my coat
        rationale: "Sentidos múltiplos: observe o contexto."
      - type: english_phrases
        question: A reunião foi adiada
        correctAnswer: the meeting was put off
        rationale: "Trate verbo + partícula como unidade."
      - type: english_phrases
        question: Não aguento mais isso
        correctAnswer: i cannot put up with this anymore
        rationale: "'Take it off', 'put it on' — pronome no meio."
      - type: english_phrases
        question: Apague o cigarro
        correctAnswer: put out the cigarette
        rationale: "'Put up with' = tolerar; 'put down' = colocar/humilhar."
      - type: english_phrases
        question: Ponha o livro aí
        correctAnswer: put down the book
        rationale: "'Take over' = assumir controle; 'take out' = sair com."
      - type: english_phrases
        question: Guarde seus brinquedos
        correctAnswer: put away your toys
        rationale: "'Put away' = guardar; 'put together' = montar."
      - type: english_phrases
        question: Ela economizou bastante
        correctAnswer: she put aside a lot
        rationale: "Sentidos múltiplos: observe o contexto."
      - type: english_phrases
        question: Adiei a viagem
        correctAnswer: i put off the trip
        rationale: "Trate verbo + partícula como unidade."
      - type: english_phrases
        question: Ponha ele na linha
        correctAnswer: put him through
        rationale: "Separáveis aceitam pronome entre verbo e partícula."
      - type: english_phrases
        question: Eles fizeram um ótimo espetáculo
        correctAnswer: they put on a great show
        rationale: "'Put away' = guardar; 'put together' = montar."
target: 20
