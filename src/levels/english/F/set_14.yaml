title: 🗺️ English F - Prepositions of Place & Time
level: F
subject: english
difficulty: 2
objectives:
  - A2.grammar.prepositions
authorNotes: Place prepositions — in, on, at, under, next to, between, behind, in front of. Time — in (months/years), on (days/dates), at (time/night).
repeatAll: 2
example: O livro está na mesa → The book is on the table / Às 9h → at 9 o'clock / Em janeiro → in January
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Prepositions of Place
    description: in, on, at, under, next to, between, behind, in front of.
    exercises:
      - type: english_phrases
        question: o gato está embaixo da mesa
        correctAnswer: The cat is under the table
        rationale: "'Under' = embaixo de. Posição abaixo de algo."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: o livro está em cima da cadeira
        correctAnswer: The book is on the chair
        rationale: "'On' = em cima de (superfície). The book is on the chair."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: ela está no banco (dentro)
        correctAnswer: She is in the bank
        rationale: "'In' = dentro de (espaço fechado). She is in the bank."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: ele está na parada de ônibus
        correctAnswer: He is at the bus stop
        rationale: "'At' = em um ponto específico. He is at the bus stop."
        difficulty: 2
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: o banco fica do lado da padaria
        correctAnswer: The bank is next to the bakery
        rationale: "'Next to' = ao lado de."
        difficulty: 2
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: ela está atrás da porta
        correctAnswer: She is behind the door
        rationale: "'Behind' = atrás de."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: o cachorro está na frente do sofá
        correctAnswer: The dog is in front of the sofa
        rationale: "'In front of' = na frente de."
        difficulty: 2
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: o café está entre a farmácia e o banco
        correctAnswer: The café is between the pharmacy and the bank
        rationale: "'Between' = entre (dois pontos)."
        difficulty: 2
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: o meu quarto é em cima (andar de cima)
        correctAnswer: My room is upstairs
        rationale: "'Upstairs' = no andar de cima."
        difficulty: 2
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: eles moram na rua principal
        correctAnswer: They live on the main street
        rationale: "'On' + nome de rua. They live on the main street."
        difficulty: 2
        objectives: [A2.grammar.prepositions]
  - pageNumber: 2
    title: Prepositions of Time
    description: at (hour/night/noon), on (day/date), in (month/year/season).
    exercises:
      - type: english_phrases
        question: às sete horas
        correctAnswer: at seven o'clock
        rationale: "'At' para horários específicos. At seven o'clock."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: na segunda-feira
        correctAnswer: on Monday
        rationale: "'On' para dias da semana e datas. On Monday."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: em julho
        correctAnswer: in July
        rationale: "'In' para meses e anos. In July."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: em 2020
        correctAnswer: in 2020
        rationale: "'In' para anos. In 2020."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: ao meio-dia
        correctAnswer: at noon
        rationale: "'At' + noon/midnight/night. At noon."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: no verão
        correctAnswer: in summer
        rationale: "'In' para estações do ano. In summer."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: no dia 15 de março
        correctAnswer: on the 15th of March
        rationale: "'On' para datas específicas. On the 15th of March."
        difficulty: 2
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: de manhã
        correctAnswer: in the morning
        rationale: "'In' para partes do dia (morning/afternoon/evening). In the morning."
        difficulty: 1
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: à noite (time expression)
        correctAnswer: at night
        rationale: "'At night' — exceção: 'night' usa 'at', não 'in'."
        difficulty: 2
        objectives: [A2.grammar.prepositions]
      - type: english_phrases
        question: na semana passada
        correctAnswer: last week
        rationale: "'Last week/month/year' não usam preposição. Last week."
        difficulty: 2
        objectives: [A2.grammar.prepositions]
target: 20
