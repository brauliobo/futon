title: ✏️ English F - Future — Will & Going to
level: F
subject: english
difficulty: 3
objectives:
  - A2.grammar.future
authorNotes: Will = spontaneous decisions/predictions; going to = plans/intentions already decided; be going to + base verb.
repeatAll: 2
example: Eu vou viajar amanhã (plano) → I am going to travel tomorrow / Vou ajudar (decisão agora) → I'll help
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Going to — Plans & Intentions
    description: Already-decided plans and intentions.
    exercises:
      - type: english_phrases
        question: eu vou viajar nas férias (plano)
        correctAnswer: I am going to travel on holiday
        rationale: "Am going to + base verb = plano já decidido. I am going to travel."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: ela vai estudar medicina (intenção)
        correctAnswer: She is going to study medicine
        rationale: "Is going to + base verb = intenção. She is going to study."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: nós vamos comprar uma casa
        correctAnswer: We are going to buy a house
        rationale: "Are going to + 'buy'. Plano futuro já decidido."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: ele não vai chegar a tempo
        correctAnswer: He isn't going to arrive on time
        rationale: "Isn't going to + base verb. Negativo de going to."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: o que você vai fazer amanhã? (pergunta)
        correctAnswer: What are you going to do tomorrow?
        rationale: "What + are you going to + base verb? WH-question com going to."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: olha as nuvens — vai chover!
        correctAnswer: Look at those clouds — it's going to rain!
        rationale: "Going to para previsão baseada em evidência presente (nuvens)."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: eles vão se casar no próximo mês
        correctAnswer: They are going to get married next month
        rationale: "Are going to + 'get married'. Plano futuro específico."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: você vai falar com ele? (pergunta)
        correctAnswer: Are you going to talk to him?
        rationale: "Are you going to + base verb? Pergunta com going to."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: ela vai começar um novo emprego
        correctAnswer: She is going to start a new job
        rationale: "Is going to + 'start'. Intenção já decidida."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: eu não vou comer isso
        correctAnswer: I am not going to eat that
        rationale: "Am not going to + base verb. Recusa firme."
        difficulty: 2
        objectives: [A2.grammar.future]
  - pageNumber: 2
    title: Will — Predictions & Spontaneous Decisions
    description: Will for spontaneous decisions, promises, and predictions.
    exercises:
      - type: english_phrases
        question: eu vou ajudar você (decisão agora)
        correctAnswer: I will help you
        rationale: "Will = decisão tomada no momento. I'll help you (contração)."
        difficulty: 1
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: eu acho que vai chover amanhã (previsão)
        correctAnswer: I think it will rain tomorrow
        rationale: "Will para previsão sem evidência presente. I think it will rain."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: ela vai ter sucesso (previsão)
        correctAnswer: She will be successful
        rationale: "Will + base verb 'be'. Previsão/opinião sobre o futuro."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: não vou contar para ninguém (promessa)
        correctAnswer: I won't tell anyone
        rationale: "Won't = will not (contração). Promessa ou recusa."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: você vai ajudar? (pergunta)
        correctAnswer: Will you help?
        rationale: "Will + you + base verb? Pergunta com will."
        difficulty: 1
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: ele provavelmente não virá
        correctAnswer: He probably won't come
        rationale: "Probably + won't = provavelmente não. He probably won't come."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: quando você vai terminar? (pergunta)
        correctAnswer: When will you finish?
        rationale: "When + will + subject + base verb? WH-question com will."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: não se preocupe — vai ficar tudo bem
        correctAnswer: Don't worry — everything will be fine
        rationale: "Will para confortar/prometer. Everything will be fine."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: pode ligar — eu atendo (decisão espontânea)
        correctAnswer: Call me — I'll answer
        rationale: "I'll = I will. Decisão tomada no momento da fala."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: você acha que eles vão ganhar? (pergunta)
        correctAnswer: Do you think they will win?
        rationale: "Do you think + they will + base verb? Pedido de opinião/previsão."
        difficulty: 3
        objectives: [A2.grammar.future]
target: 20
