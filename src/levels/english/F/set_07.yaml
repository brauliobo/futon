title: 📝 English F - Demonstratives & Mixed Review
level: F
subject: english
difficulty: 3
objectives:
  - A2.grammar.demonstratives
  - A2.grammar.articles
  - A2.grammar.pronouns
authorNotes: This/that/these/those by proximity. Combined review of articles, plurals, pronouns, possessives.
repeatAll: 2
example: Este livro → this book / Aqueles livros → those books
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: This / That / These / Those
    description: Near (this/these) vs far (that/those); singular vs plural.
    exercises:
      - type: english_phrases
        question: Este livro
        correctAnswer: This book
        rationale: "'This' = perto + singular. 'This book' (próximo e 1 livro)."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Essa cadeira (perto)
        correctAnswer: This chair
        rationale: "'This' = perto + singular. 'Chair' (singular) → 'this'."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Aquele carro (longe)
        correctAnswer: That car
        rationale: "'That' = longe + singular. 'Car' (singular) distante → 'that'."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Aquela casa
        correctAnswer: That house
        rationale: "'That house' — casa distante, singular → 'that'."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Estes livros
        correctAnswer: These books
        rationale: "'These' = perto + plural. 'Books' plural → 'these'."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Essas canetas (perto)
        correctAnswer: These pens
        rationale: "'These pens' — canetas próximas e plural → 'these'."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Aqueles dias
        correctAnswer: Those days
        rationale: "'Those' = longe + plural. 'Those days' (tempo passado distante)."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Aquelas pessoas
        correctAnswer: Those people
        rationale: "'People' é plural → 'those people'. Distantes."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Isto é bom
        correctAnswer: This is good
        rationale: "'This is' — pronome demonstrativo sozinho, referência próxima."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Aquilo é caro
        correctAnswer: That is expensive
        rationale: "'That is' — pronome demonstrativo, referência distante/anterior."
        difficulty: 2
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
  - pageNumber: 2
    title: Mixed Review
    description: Articles, plurals, pronouns and possessives together.
    exercises:
      - type: english_phrases
        question: Estas são minhas chaves
        correctAnswer: These are my keys
        rationale: "'These' (plural próximo) + 'are' + 'my keys' (possessivo)."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Aquele carro é dele
        correctAnswer: That car is his
        rationale: "'That car' (distante sg.) + 'is his' (pronome possessivo)."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Ela me deu um livro
        correctAnswer: She gave me a book
        rationale: "'Give me a book' — dois objetos: 'me' (indireto) + 'a book' (direto)."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Os homens estão trabalhando
        correctAnswer: The men are working
        rationale: "'Men' (plural irregular de man). 'The men are' (plural → are)."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Nosso time ganhou
        correctAnswer: Our team won
        rationale: "'Our team' (possessivo) + 'won' (past irregular de win)."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Essa informação é útil
        correctAnswer: This information is useful
        rationale: "'Information' incontável → 'this' (sg). 'Is useful' (singular)."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Ele comprou uma bicicleta
        correctAnswer: He bought a bicycle
        rationale: "'Bought' (past de buy). 'A bicycle' (consoante → 'a')."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: As crianças estão felizes
        correctAnswer: The children are happy
        rationale: "'Children' (plural irregular) → 'are happy'. 'The' específico."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Eu os vi no parque
        correctAnswer: I saw them in the park
        rationale: "'Them' (objeto plural). 'Saw' (past de see). 'In the park' com 'the'."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
      - type: english_phrases
        question: Aqueles livros são nossos
        correctAnswer: Those books are ours
        rationale: "'Those books' (plural distante) + 'are ours' (pronome possessivo)."
        difficulty: 3
        objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
target: 20
