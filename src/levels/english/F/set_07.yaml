title: English F - Demonstratives & Mixed Review
level: F
subject: english
difficulty: 3
objectives: [A2.grammar.demonstratives, A2.grammar.articles, A2.grammar.pronouns]
authorNotes: This/that/these/those by proximity. Combined review of articles, plurals, pronouns, possessives.
repeatAll: 2
example: "Este livro → this book / Aqueles livros → those books"
pages:
  - pageNumber: 1
    title: This / That / These / Those
    description: Near (this/these) vs far (that/those); singular vs plural.
    exercises:
      - { type: english_phrases, question: "Este livro", correctAnswer: this book }
      - { type: english_phrases, question: "Essa cadeira (perto)", correctAnswer: this chair }
      - { type: english_phrases, question: "Aquele carro (longe)", correctAnswer: that car }
      - { type: english_phrases, question: "Aquela casa", correctAnswer: that house }
      - { type: english_phrases, question: "Estes livros", correctAnswer: these books }
      - { type: english_phrases, question: "Essas canetas (perto)", correctAnswer: these pens }
      - { type: english_phrases, question: "Aqueles dias", correctAnswer: those days }
      - { type: english_phrases, question: "Aquelas pessoas", correctAnswer: those people }
      - { type: english_phrases, question: "Isto é bom", correctAnswer: this is good }
      - { type: english_phrases, question: "Aquilo é caro", correctAnswer: that is expensive }
  - pageNumber: 2
    title: Mixed Review
    description: Articles, plurals, pronouns and possessives together.
    exercises:
      - { type: english_phrases, question: "Estas são minhas chaves", correctAnswer: these are my keys }
      - { type: english_phrases, question: "Aquele carro é dele", correctAnswer: that car is his }
      - { type: english_phrases, question: "Ela me deu um livro", correctAnswer: she gave me a book }
      - { type: english_phrases, question: "Os homens estão trabalhando", correctAnswer: the men are working }
      - { type: english_phrases, question: "Nosso time ganhou", correctAnswer: our team won }
      - { type: english_phrases, question: "Essa informação é útil", correctAnswer: this information is useful }
      - { type: english_phrases, question: "Ele comprou uma bicicleta", correctAnswer: he bought a bicycle }
      - { type: english_phrases, question: "As crianças estão felizes", correctAnswer: the children are happy }
      - { type: english_phrases, question: "Eu os vi no parque", correctAnswer: i saw them in the park }
      - { type: english_phrases, question: "Aqueles livros são nossos", correctAnswer: those books are ours }
target: 20
