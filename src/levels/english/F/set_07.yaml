title: English F - Demonstratives & Mixed Review
level: F
subject: english
difficulty: 3
objectives:
  - A2.grammar.demonstratives
  - A2.grammar.articles
  - A2.grammar.pronouns
authorNotes: This/that/these/those by proximity. Combined review of articles, plurals, pronouns, possessives.
repeatAll: 2
example: Este livro → this book / Aqueles livros → those books
pages:
  - pageNumber: 1
    title: This / That / These / Those
    description: Near (this/these) vs far (that/those); singular vs plural.
    exercises:
      - type: english_phrases
        question: Este livro
        correctAnswer: this book
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Essa cadeira (perto)
        correctAnswer: this chair
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Aquele carro (longe)
        correctAnswer: that car
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Aquela casa
        correctAnswer: that house
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Estes livros
        correctAnswer: these books
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Essas canetas (perto)
        correctAnswer: these pens
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Aqueles dias
        correctAnswer: those days
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Aquelas pessoas
        correctAnswer: those people
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Isto é bom
        correctAnswer: this is good
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Aquilo é caro
        correctAnswer: that is expensive
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Mixed Review
    description: Articles, plurals, pronouns and possessives together.
    exercises:
      - type: english_phrases
        question: Estas são minhas chaves
        correctAnswer: these are my keys
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Aquele carro é dele
        correctAnswer: that car is his
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela me deu um livro
        correctAnswer: she gave me a book
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Os homens estão trabalhando
        correctAnswer: the men are working
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nosso time ganhou
        correctAnswer: our team won
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Essa informação é útil
        correctAnswer: this information is useful
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele comprou uma bicicleta
        correctAnswer: he bought a bicycle
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: As crianças estão felizes
        correctAnswer: the children are happy
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu os vi no parque
        correctAnswer: i saw them in the park
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Aqueles livros são nossos
        correctAnswer: those books are ours
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
