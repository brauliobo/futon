title: English F - Regular Plurals
level: F
subject: english
difficulty: 2
objectives:
  - A2.grammar.plurals
authorNotes: -s default; -es after ch, sh, s, x, z; y→ies after consonant; f/fe→ves on common words.
repeatAll: 2
example: Um livro / dois livros → one book / two books
pages:
  - pageNumber: 1
    title: Basic -s and -es
    description: Default -s; -es after ch, sh, s, x, z.
    exercises:
      - type: english_phrases
        question: dois livros
        correctAnswer: two books
        rationale: "Vogal + y: só +s. Boy → boys."
      - type: english_phrases
        question: três cães
        correctAnswer: three dogs
        rationale: "Plural regular: +s. Book → books."
      - type: english_phrases
        question: cinco carros
        correctAnswer: five cars
        rationale: "Vogal + y: só +s. Boy → boys."
      - type: english_phrases
        question: duas caixas
        correctAnswer: two boxes
        rationale: "Pronúncia: /s/, /z/ ou /ɪz/ conforme final."
      - type: english_phrases
        question: muitos ônibus
        correctAnswer: many buses
        rationale: "Final f/fe muda para ves: leaf → leaves."
      - type: english_phrases
        question: vários relógios (plural de watch)
        correctAnswer: several watches
        rationale: "Concordância: verbo plural com sujeito plural."
      - type: english_phrases
        question: pratos (plural de dish)
        correctAnswer: dishes
        rationale: "Consoante + y: y → i + es. Baby → babies."
      - type: english_phrases
        question: três raposas (fox)
        correctAnswer: three foxes
        rationale: "Plural regular: +s. Book → books."
      - type: english_phrases
        question: duas igrejas (church)
        correctAnswer: two churches
        rationale: "Final s, x, z, ch, sh: +es. Box → boxes."
      - type: english_phrases
        question: um beijo, dois beijos
        correctAnswer: one kiss two kisses
        rationale: "Olhe a terminação antes de formar o plural."
  - pageNumber: 2
    title: y→ies and f→ves
    description: Consonant + y becomes ies; f / fe becomes ves on common nouns.
    exercises:
      - type: english_phrases
        question: três bebês (baby)
        correctAnswer: three babies
        rationale: "Pronúncia: /s/, /z/ ou /ɪz/ conforme final."
      - type: english_phrases
        question: duas cidades (city)
        correctAnswer: two cities
        rationale: "Olhe a terminação antes de formar o plural."
      - type: english_phrases
        question: histórias (story)
        correctAnswer: stories
        rationale: "Vogal + y: só +s. Boy → boys."
      - type: english_phrases
        question: famílias (family)
        correctAnswer: families
        rationale: "Adjetivo é invariável em inglês."
      - type: english_phrases
        question: meninos e meninas
        correctAnswer: boys and girls
        rationale: "Consoante + y: y → i + es. Baby → babies."
      - type: english_phrases
        question: dias (day → days)
        correctAnswer: days
        rationale: "Plural indefinido sem artigo: 'I see books'."
      - type: english_phrases
        question: duas folhas (leaf)
        correctAnswer: two leaves
        rationale: "Olhe a terminação antes de formar o plural."
      - type: english_phrases
        question: vidas (life)
        correctAnswer: lives
        rationale: "Final f/fe muda para ves: leaf → leaves."
      - type: english_phrases
        question: lobos (wolf)
        correctAnswer: wolves
        rationale: "Final s, x, z, ch, sh: +es. Box → boxes."
      - type: english_phrases
        question: facas (knife)
        correctAnswer: knives
        rationale: "Concordância: verbo plural com sujeito plural."
target: 20
