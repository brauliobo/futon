title: English F - Regular Plurals
level: F
subject: english
difficulty: 2
objectives: [A2.grammar.plurals]
authorNotes: -s default; -es after ch, sh, s, x, z; y→ies after consonant; f/fe→ves on common words.
repeatAll: 2
example: "Um livro / dois livros → one book / two books"
pages:
  - pageNumber: 1
    title: Basic -s and -es
    description: Default -s; -es after ch, sh, s, x, z.
    exercises:
      - { type: english_phrases, question: "dois livros", correctAnswer: two books }
      - { type: english_phrases, question: "três cães", correctAnswer: three dogs }
      - { type: english_phrases, question: "cinco carros", correctAnswer: five cars }
      - { type: english_phrases, question: "duas caixas", correctAnswer: two boxes }
      - { type: english_phrases, question: "muitos ônibus", correctAnswer: many buses }
      - { type: english_phrases, question: "vários relógios (plural de watch)", correctAnswer: several watches }
      - { type: english_phrases, question: "pratos (plural de dish)", correctAnswer: dishes }
      - { type: english_phrases, question: "três raposas (fox)", correctAnswer: three foxes }
      - { type: english_phrases, question: "duas igrejas (church)", correctAnswer: two churches }
      - { type: english_phrases, question: "um beijo, dois beijos", correctAnswer: one kiss two kisses }
  - pageNumber: 2
    title: y→ies and f→ves
    description: Consonant + y becomes ies; f / fe becomes ves on common nouns.
    exercises:
      - { type: english_phrases, question: "três bebês (baby)", correctAnswer: three babies }
      - { type: english_phrases, question: "duas cidades (city)", correctAnswer: two cities }
      - { type: english_phrases, question: "histórias (story)", correctAnswer: stories }
      - { type: english_phrases, question: "famílias (family)", correctAnswer: families }
      - { type: english_phrases, question: "meninos e meninas", correctAnswer: boys and girls }
      - { type: english_phrases, question: "dias (day → days)", correctAnswer: days }
      - { type: english_phrases, question: "duas folhas (leaf)", correctAnswer: two leaves }
      - { type: english_phrases, question: "vidas (life)", correctAnswer: lives }
      - { type: english_phrases, question: "lobos (wolf)", correctAnswer: wolves }
      - { type: english_phrases, question: "facas (knife)", correctAnswer: knives }
target: 20
