title: English F - Possessive Adjectives & Pronouns
level: F
subject: english
difficulty: 3
objectives:
  - A2.grammar.possessives
authorNotes: Adjectives (my, your, his, her, its, our, their) precede nouns. Pronouns (mine, yours, his, hers, ours, theirs) stand alone.
repeatAll: 2
example: Meu livro → my book / É meu → it is mine
pages:
  - pageNumber: 1
    title: Possessive Adjectives
    description: Placed before the noun — my book, your car.
    exercises:
      - type: english_phrases
        question: Meu livro
        correctAnswer: my book
        rationale: "'My' (adjetivo possessivo 1ª pessoa) antes do substantivo 'book'."
      - type: english_phrases
        question: Seu nome
        correctAnswer: your name
        rationale: "'Your' (possessivo 2ª pessoa). Sem artigo: 'your name', não 'the your'."
      - type: english_phrases
        question: O carro dele
        correctAnswer: his car
        rationale: "'His' (possessivo masc.) — dele. Antes do substantivo 'car'."
      - type: english_phrases
        question: A casa dela
        correctAnswer: her house
        rationale: "'Her' (possessivo fem.) — dela. Concorda com o dono, não com 'house'."
      - type: english_phrases
        question: Sua cor (de algo, it)
        correctAnswer: its color
        rationale: "'Its' (possessivo neutro) — sem apóstrofo. 'It's' = 'it is'."
      - type: english_phrases
        question: Nosso time
        correctAnswer: our team
        rationale: "'Our' (possessivo 1ª plural) — nosso. 'Our team'."
      - type: english_phrases
        question: O filho deles
        correctAnswer: their son
        rationale: "'Their' (possessivo plural) — deles. Não 'there' (lá) nem 'they're'."
      - type: english_phrases
        question: Minha família
        correctAnswer: my family
        rationale: "'My' + 'family' — possessivo antes do substantivo, sem artigo."
      - type: english_phrases
        question: Seus amigos
        correctAnswer: your friends
        rationale: "'Your' não muda no plural: 'your friend' / 'your friends'."
      - type: english_phrases
        question: Nossa escola
        correctAnswer: our school
        rationale: "'Our school' — possessivo + substantivo. Sem artigo 'the'."
  - pageNumber: 2
    title: Possessive Pronouns
    description: Stand alone — This is mine, not yours.
    exercises:
      - type: english_phrases
        question: É meu
        correctAnswer: it is mine
        rationale: "'Mine' (pronome possessivo 1ª pessoa) — sozinho, sem substantivo."
      - type: english_phrases
        question: É seu
        correctAnswer: it is yours
        rationale: "'Yours' (pronome) — sem substantivo depois. 'Your' precisa de substantivo."
      - type: english_phrases
        question: É dele
        correctAnswer: it is his
        rationale: "'His' funciona como adjetivo e pronome: forma idêntica."
      - type: english_phrases
        question: É dela
        correctAnswer: it is hers
        rationale: "'Hers' (pronome fem.) — diferente de 'her' (adj). 'Hers' sozinho."
      - type: english_phrases
        question: É nosso
        correctAnswer: it is ours
        rationale: "'Ours' (pronome 1ª plural) — sem substantivo. 'Our' é adjetivo."
      - type: english_phrases
        question: É deles
        correctAnswer: it is theirs
        rationale: "'Theirs' (pronome plural) — sozinho. 'Their' precisa de substantivo."
      - type: english_phrases
        question: Este livro é meu, não seu
        correctAnswer: this book is mine not yours
        rationale: "'Mine' e 'yours' como pronomes (sem 'book' depois)."
      - type: english_phrases
        question: Aquelas chaves são dela
        correctAnswer: those keys are hers
        rationale: "'Those' (plural distante) + 'are' + 'hers' (pronome fem.)."
      - type: english_phrases
        question: A casa nova é nossa
        correctAnswer: the new house is ours
        rationale: "'The new house' (sujeito específico) + 'is ours' (pronome)."
      - type: english_phrases
        question: Essa mochila é deles
        correctAnswer: that backpack is theirs
        rationale: "'That backpack' (singular distante) + 'is theirs' (pronome plural)."
target: 20
