title: English F - Possessive Adjectives & Pronouns
level: F
subject: english
difficulty: 3
objectives:
  - A2.grammar.possessives
authorNotes: Adjectives (my, your, his, her, its, our, their) precede nouns. Pronouns (mine, yours, his, hers, ours, theirs) stand alone.
repeatAll: 2
example: Meu livro → my book / É meu → it is mine
pages:
  - pageNumber: 1
    title: Possessive Adjectives
    description: Placed before the noun — my book, your car.
    exercises:
      - type: english_phrases
        question: Meu livro
        correctAnswer: my book
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Seu nome
        correctAnswer: your name
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O carro dele
        correctAnswer: his car
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A casa dela
        correctAnswer: her house
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Sua cor (de algo, it)
        correctAnswer: its color
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nosso time
        correctAnswer: our team
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O filho deles
        correctAnswer: their son
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Minha família
        correctAnswer: my family
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Seus amigos
        correctAnswer: your friends
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nossa escola
        correctAnswer: our school
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Possessive Pronouns
    description: Stand alone — This is mine, not yours.
    exercises:
      - type: english_phrases
        question: É meu
        correctAnswer: it is mine
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: É seu
        correctAnswer: it is yours
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: É dele
        correctAnswer: it is his
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: É dela
        correctAnswer: it is hers
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: É nosso
        correctAnswer: it is ours
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: É deles
        correctAnswer: it is theirs
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Este livro é meu, não seu
        correctAnswer: this book is mine not yours
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Aquelas chaves são dela
        correctAnswer: those keys are hers
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A casa nova é nossa
        correctAnswer: the new house is ours
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Essa mochila é deles
        correctAnswer: that backpack is theirs
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
