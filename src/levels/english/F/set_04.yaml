title: English F - Irregular Plurals & Uncountables
level: F
subject: english
difficulty: 3
objectives:
  - A2.grammar.plurals
authorNotes: Irregular plurals (man/men, child/children, foot/feet, tooth/teeth) and uncountable nouns (water, information, advice).
repeatAll: 2
example: Homens → men / Água (incontável) → water
pages:
  - pageNumber: 1
    title: Irregular Plurals
    description: Memorize common irregular forms.
    exercises:
      - type: english_phrases
        question: dois homens
        correctAnswer: two men
        rationale: "'Man' → 'men' (irregular, mudança de vogal). Nunca 'mans'."
      - type: english_phrases
        question: três mulheres
        correctAnswer: three women
        rationale: "'Woman' → 'women' (irregular). Pronúncia do plural: /ˈwɪmɪn/."
      - type: english_phrases
        question: quatro crianças
        correctAnswer: four children
        rationale: "'Child' → 'children' (irregular). Nunca 'childs' ou 'childrens'."
      - type: english_phrases
        question: meus pés
        correctAnswer: my feet
        rationale: "'Foot' → 'feet' (irregular). Nunca 'foots'."
      - type: english_phrases
        question: dentes
        correctAnswer: teeth
        rationale: "'Tooth' → 'teeth' (irregular, mudança de vogal)."
      - type: english_phrases
        question: camundongos (mouse)
        correctAnswer: mice
        rationale: "'Mouse' → 'mice' (irregular). Nunca 'mouses'."
      - type: english_phrases
        question: gansos (goose)
        correctAnswer: geese
        rationale: "'Goose' → 'geese' (irregular, oo → ee)."
      - type: english_phrases
        question: pessoas (person)
        correctAnswer: people
        rationale: "'Person' → 'people' (plural irregular por supletismo)."
      - type: english_phrases
        question: peixes (fish — plural igual)
        correctAnswer: fish
        rationale: "'Fish' é invariável: singular e plural iguais."
      - type: english_phrases
        question: ovelhas (sheep — plural igual)
        correctAnswer: sheep
        rationale: "'Sheep' é invariável: 'one sheep, two sheep'."
  - pageNumber: 2
    title: Uncountables
    description: Nouns without a plural form; use 'some' / 'much' / 'a piece of'.
    exercises:
      - type: english_phrases
        question: água (incontável)
        correctAnswer: water
        rationale: "'Water' é incontável: sem 'a' e sem plural 'waters'."
      - type: english_phrases
        question: um pouco de dinheiro
        correctAnswer: some money
        rationale: "'Money' incontável → 'some money', nunca 'a money' ou 'moneys'."
      - type: english_phrases
        question: muita informação
        correctAnswer: much information
        rationale: "'Information' incontável → 'much' (não 'many'), sem plural."
      - type: english_phrases
        question: um conselho (peça)
        correctAnswer: a piece of advice
        rationale: "'Advice' incontável → 'a piece of advice', não 'an advice'."
      - type: english_phrases
        question: bagagem
        correctAnswer: luggage
        rationale: "'Luggage' é incontável — sem 'a' e sem plural 'luggages'."
      - type: english_phrases
        question: pão (incontável)
        correctAnswer: bread
        rationale: "'Bread' incontável → 'bread', não 'a bread'. 'A loaf of bread' conta."
      - type: english_phrases
        question: um copo de leite
        correctAnswer: a glass of milk
        rationale: "'Milk' incontável → medida 'a glass of milk'."
      - type: english_phrases
        question: notícias (sempre plural)
        correctAnswer: news
        rationale: "'News' é incontável apesar do -s: 'the news is good'."
      - type: english_phrases
        question: uma folha de papel
        correctAnswer: a sheet of paper
        rationale: "'Paper' incontável → 'a sheet of paper' para unidade."
      - type: english_phrases
        question: muito tempo
        correctAnswer: much time
        rationale: "'Time' (tempo) incontável → 'much time'. 'Times' = vezes."
target: 20
