title: English F - Irregular Plurals & Uncountables
level: F
subject: english
difficulty: 3
objectives:
  - A2.grammar.plurals
authorNotes: Irregular plurals (man/men, child/children, foot/feet, tooth/teeth) and uncountable nouns (water, information, advice).
repeatAll: 2
example: Homens → men / Água (incontável) → water
pages:
  - pageNumber: 1
    title: Irregular Plurals
    description: Memorize common irregular forms.
    exercises:
      - type: english_phrases
        question: dois homens
        correctAnswer: two men
        rationale: "Man → men, woman → women, child → children."
      - type: english_phrases
        question: três mulheres
        correctAnswer: three women
        rationale: "'Furniture', 'advice', 'luggage' — sem -s."
      - type: english_phrases
        question: quatro crianças
        correctAnswer: four children
        rationale: "Foot → feet, tooth → teeth, goose → geese."
      - type: english_phrases
        question: meus pés
        correctAnswer: my feet
        rationale: "Mouse → mice, louse → lice."
      - type: english_phrases
        question: dentes
        correctAnswer: teeth
        rationale: "'Sheep', 'deer' invariáveis."
      - type: english_phrases
        question: camundongos (mouse)
        correctAnswer: mice
        rationale: "'Fish' pode ser singular ou plural."
      - type: english_phrases
        question: gansos (goose)
        correctAnswer: geese
        rationale: "'Furniture', 'advice', 'luggage' — sem -s."
      - type: english_phrases
        question: pessoas (person)
        correctAnswer: people
        rationale: "Man → men, woman → women, child → children."
      - type: english_phrases
        question: peixes (fish — plural igual)
        correctAnswer: fish
        rationale: "'Sheep', 'deer' invariáveis."
      - type: english_phrases
        question: ovelhas (sheep — plural igual)
        correctAnswer: sheep
        rationale: "'People' já é plural de 'person'."
  - pageNumber: 2
    title: Uncountables
    description: Nouns without a plural form; use 'some' / 'much' / 'a piece of'.
    exercises:
      - type: english_phrases
        question: água (incontável)
        correctAnswer: water
        rationale: "'Fish' pode ser singular ou plural."
      - type: english_phrases
        question: um pouco de dinheiro
        correctAnswer: some money
        rationale: "'Furniture', 'advice', 'luggage' — sem -s."
      - type: english_phrases
        question: muita informação
        correctAnswer: much information
        rationale: "'Sheep', 'deer' invariáveis."
      - type: english_phrases
        question: um conselho (peça)
        correctAnswer: a piece of advice
        rationale: "Mouse → mice, louse → lice."
      - type: english_phrases
        question: bagagem
        correctAnswer: luggage
        rationale: "'News' é incontável: 'The news is good'."
      - type: english_phrases
        question: pão (incontável)
        correctAnswer: bread
        rationale: "'People' já é plural de 'person'."
      - type: english_phrases
        question: um copo de leite
        correctAnswer: a glass of milk
        rationale: "'News' é incontável: 'The news is good'."
      - type: english_phrases
        question: notícias (sempre plural)
        correctAnswer: news
        rationale: "'People' já é plural de 'person'."
      - type: english_phrases
        question: uma folha de papel
        correctAnswer: a sheet of paper
        rationale: "Man → men, woman → women, child → children."
      - type: english_phrases
        question: muito tempo
        correctAnswer: much time
        rationale: "Mouse → mice, louse → lice."
target: 20
