title: English F - Irregular Plurals & Uncountables
level: F
subject: english
difficulty: 3
objectives: [A2.grammar.plurals]
authorNotes: Irregular plurals (man/men, child/children, foot/feet, tooth/teeth) and uncountable nouns (water, information, advice).
repeatAll: 2
example: "Homens → men / Água (incontável) → water"
pages:
  - pageNumber: 1
    title: Irregular Plurals
    description: Memorize common irregular forms.
    exercises:
      - { type: english_phrases, question: "dois homens", correctAnswer: two men }
      - { type: english_phrases, question: "três mulheres", correctAnswer: three women }
      - { type: english_phrases, question: "quatro crianças", correctAnswer: four children }
      - { type: english_phrases, question: "meus pés", correctAnswer: my feet }
      - { type: english_phrases, question: "dentes", correctAnswer: teeth }
      - { type: english_phrases, question: "camundongos (mouse)", correctAnswer: mice }
      - { type: english_phrases, question: "gansos (goose)", correctAnswer: geese }
      - { type: english_phrases, question: "pessoas (person)", correctAnswer: people }
      - { type: english_phrases, question: "peixes (fish — plural igual)", correctAnswer: fish }
      - { type: english_phrases, question: "ovelhas (sheep — plural igual)", correctAnswer: sheep }
  - pageNumber: 2
    title: Uncountables
    description: Nouns without a plural form; use 'some' / 'much' / 'a piece of'.
    exercises:
      - { type: english_phrases, question: "água (incontável)", correctAnswer: water }
      - { type: english_phrases, question: "um pouco de dinheiro", correctAnswer: some money }
      - { type: english_phrases, question: "muita informação", correctAnswer: much information }
      - { type: english_phrases, question: "um conselho (peça)", correctAnswer: a piece of advice }
      - { type: english_phrases, question: "bagagem", correctAnswer: luggage }
      - { type: english_phrases, question: "pão (incontável)", correctAnswer: bread }
      - { type: english_phrases, question: "um copo de leite", correctAnswer: a glass of milk }
      - { type: english_phrases, question: "notícias (sempre plural)", correctAnswer: news }
      - { type: english_phrases, question: "uma folha de papel", correctAnswer: a sheet of paper }
      - { type: english_phrases, question: "muito tempo", correctAnswer: much time }
target: 20
