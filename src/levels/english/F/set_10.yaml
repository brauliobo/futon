title: 📅 English F - Frequency Adverbs
level: F
subject: english
difficulty: 2
objectives:
  - A2.grammar.adverbs
authorNotes: Always, usually, often, sometimes, rarely, never — position before main verb, after 'be'. Frequency expressions (once a week, every day).
repeatAll: 2
example: Eu sempre acordo cedo → I always wake up early / Ela nunca chega tarde → She never arrives late
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Adverbs Before Main Verb
    description: Always, usually, often, sometimes, rarely, never — before main verb.
    exercises:
      - type: english_phrases
        question: eu sempre tomo café de manhã
        correctAnswer: I always have coffee in the morning
        rationale: "'Always' vem antes do verbo principal 'have'. I always have..."
        difficulty: 1
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: ela nunca come carne
        correctAnswer: She never eats meat
        rationale: "'Never' antes do verbo 'eats'. She never eats..."
        difficulty: 1
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: eles geralmente chegam cedo
        correctAnswer: They usually arrive early
        rationale: "'Usually' antes do verbo 'arrive'. They usually arrive..."
        difficulty: 1
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: ele às vezes trabalha em casa
        correctAnswer: He sometimes works at home
        rationale: "'Sometimes' antes do verbo 'works'. He sometimes works..."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: nós frequentemente vamos ao cinema
        correctAnswer: We often go to the cinema
        rationale: "'Often' antes do verbo 'go'. We often go..."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: ela raramente come fast food
        correctAnswer: She rarely eats fast food
        rationale: "'Rarely' antes do verbo 'eats'. She rarely eats..."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: eu nunca fumo
        correctAnswer: I never smoke
        rationale: "'Never' antes do verbo 'smoke'. Frase negativa sem 'don't'."
        difficulty: 1
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: você sempre estuda de noite?
        correctAnswer: Do you always study at night?
        rationale: "Em pergunta: Do + you + always + base verb? 'Always' fica antes do verbo."
        difficulty: 3
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: ele geralmente dorme tarde
        correctAnswer: He usually sleeps late
        rationale: "'Usually' antes do verbo 'sleeps'. 3ª pessoa singular."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: elas sempre são pontuais
        correctAnswer: They are always punctual
        rationale: "Com 'be', o advérbio vem DEPOIS: They are always... (depois do 'are')."
        difficulty: 3
        objectives: [A2.grammar.adverbs]
  - pageNumber: 2
    title: Frequency Expressions
    description: Once a week, twice a month, every day, three times a year.
    exercises:
      - type: english_phrases
        question: eu vou ao médico uma vez por ano
        correctAnswer: I go to the doctor once a year
        rationale: "'Once a year' = uma vez por ano. Expressão de frequência."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: ela pratica inglês duas vezes por semana
        correctAnswer: She practises English twice a week
        rationale: "'Twice a week' = duas vezes por semana."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: nós jogamos futebol todo fim de semana
        correctAnswer: We play football every weekend
        rationale: "'Every weekend' = todo fim de semana."
        difficulty: 1
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: ele corre três vezes por semana
        correctAnswer: He runs three times a week
        rationale: "'Three times a week' = três vezes por semana."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: com que frequência você estuda? (pergunta)
        correctAnswer: How often do you study?
        rationale: "'How often' pergunta frequência. How often + do + you + base verb?"
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: ela assiste TV toda noite
        correctAnswer: She watches TV every night
        rationale: "'Every night' = toda noite. 'Watch' + es = 'watches' (3ª pessoa)."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: eu vou ao supermercado uma vez por semana
        correctAnswer: I go to the supermarket once a week
        rationale: "'Once a week' = uma vez por semana."
        difficulty: 1
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: eles viajam quatro vezes por ano
        correctAnswer: They travel four times a year
        rationale: "'Four times a year' = quatro vezes por ano."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: com que frequência ele vai à academia? (pergunta)
        correctAnswer: How often does he go to the gym?
        rationale: "'How often + does + he + go?' — 3ª pessoa singular."
        difficulty: 3
        objectives: [A2.grammar.adverbs]
      - type: english_phrases
        question: ela toma vitaminas todos os dias
        correctAnswer: She takes vitamins every day
        rationale: "'Every day' = todos os dias. 'Take' + s = 'takes' (3ª pessoa)."
        difficulty: 2
        objectives: [A2.grammar.adverbs]
target: 20
