title: ✏️ English F - Present Simple Affirmative
level: F
subject: english
difficulty: 2
objectives:
  - A2.grammar.present_simple
authorNotes: Present simple affirmative — I/you/we/they + base verb; he/she/it + verb+s (or -es/-ies).
repeatAll: 2
example: Eu trabalho → I work / Ela trabalha → She works
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: I / You / We / They
    description: Base verb with I, you, we, they.
    exercises:
      - type: english_phrases
        question: eu moro aqui
        correctAnswer: I live here
        rationale: "'I' + base verb 'live'. Sem -s na 1ª pessoa."
        difficulty: 1
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: você trabalha muito
        correctAnswer: You work a lot
        rationale: "'You' + base verb 'work'. Sem -s na 2ª pessoa."
        difficulty: 1
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: nós estudamos inglês
        correctAnswer: We study English
        rationale: "'We' + base verb 'study'. Sem -s na 1ª pessoa plural."
        difficulty: 1
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: eles moram no Brasil
        correctAnswer: They live in Brazil
        rationale: "'They' + base verb 'live'. Sem -s na 3ª pessoa plural."
        difficulty: 1
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: eu gosto de música
        correctAnswer: I like music
        rationale: "'I' + base verb 'like'. Hábito ou preferência no presente simples."
        difficulty: 1
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: vocês comem arroz
        correctAnswer: You eat rice
        rationale: "'You' (plural) + base verb 'eat'. Sem -s."
        difficulty: 1
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: nós dormimos cedo
        correctAnswer: We sleep early
        rationale: "'We' + 'sleep'. Presente simples para hábito."
        difficulty: 1
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: eles bebem água
        correctAnswer: They drink water
        rationale: "'They' + base verb 'drink'. Sem -s."
        difficulty: 1
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: eu leio livros
        correctAnswer: I read books
        rationale: "'I' + 'read'. 'Read' não muda na forma escrita no presente simples."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: nós corremos todo dia
        correctAnswer: We run every day
        rationale: "'We' + 'run'. Hábito expresso no presente simples."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
  - pageNumber: 2
    title: He / She / It — adds -s/-es/-ies
    description: Third person singular adds -s, -es, or changes y→ies.
    exercises:
      - type: english_phrases
        question: ele trabalha aqui
        correctAnswer: He works here
        rationale: "'He' + 'work' + s = 'works'. 3ª pessoa singular adiciona -s."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: ela mora no Rio
        correctAnswer: She lives in Rio
        rationale: "'She' + 'live' + s = 'lives'. 3ª pessoa singular adiciona -s."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: ele ensina inglês
        correctAnswer: He teaches English
        rationale: "'Teach' termina em -ch → +es = 'teaches'. 3ª pessoa singular."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: ela estuda muito
        correctAnswer: She studies a lot
        rationale: "'Study' — consoante + y → 'studies' (y→ies). 3ª pessoa singular."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: ele bebe café
        correctAnswer: He drinks coffee
        rationale: "'Drink' + s = 'drinks'. 3ª pessoa singular."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: ela gosta de dançar
        correctAnswer: She likes dancing
        rationale: "'Like' + s = 'likes'. 3ª pessoa singular."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: o gato come peixe
        correctAnswer: The cat eats fish
        rationale: "'Eat' + s = 'eats'. 3ª pessoa singular para animais (it)."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: ela corre de manhã
        correctAnswer: She runs in the morning
        rationale: "'Run' + s = 'runs'. 3ª pessoa singular."
        difficulty: 2
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: ele vai ao trabalho
        correctAnswer: He goes to work
        rationale: "'Go' termina em -o → +es = 'goes'. 3ª pessoa singular irregular."
        difficulty: 3
        objectives: [A2.grammar.present_simple]
      - type: english_phrases
        question: ela tem dois filhos
        correctAnswer: She has two children
        rationale: "'Have' → 'has' na 3ª pessoa singular (irregular)."
        difficulty: 3
        objectives: [A2.grammar.present_simple]
target: 20
