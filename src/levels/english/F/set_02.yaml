title: English F - Definite Article 'the'
level: F
subject: english
difficulty: 3
objectives: [A2.grammar.articles]
authorNotes: Use 'the' for specific items, unique things, superlatives. Drop 'the' before most proper nouns and abstract/general plurals.
repeatAll: 2
example: "O sol → The sun"
pages:
  - pageNumber: 1
    title: Unique and Specific
    description: "'The' for things there's only one of, or already mentioned."
    exercises:
      - { type: english_phrases, question: "O sol", correctAnswer: the sun }
      - { type: english_phrases, question: "A lua", correctAnswer: the moon }
      - { type: english_phrases, question: "O melhor aluno", correctAnswer: the best student }
      - { type: english_phrases, question: "O primeiro dia", correctAnswer: the first day }
      - { type: english_phrases, question: "O presidente", correctAnswer: the president }
      - { type: english_phrases, question: "O carro que comprei", correctAnswer: the car i bought }
      - { type: english_phrases, question: "A casa da esquina", correctAnswer: the house on the corner }
      - { type: english_phrases, question: "O oceano", correctAnswer: the ocean }
      - { type: english_phrases, question: "O último capítulo", correctAnswer: the last chapter }
      - { type: english_phrases, question: "O mesmo problema", correctAnswer: the same problem }
  - pageNumber: 2
    title: No Article
    description: Proper nouns, general plurals, abstract concepts.
    exercises:
      - { type: english_phrases, question: "Eu gosto de música (em geral)", correctAnswer: i like music }
      - { type: english_phrases, question: "Cachorros são leais (geral)", correctAnswer: dogs are loyal }
      - { type: english_phrases, question: "Moro no Brasil", correctAnswer: i live in brazil }
      - { type: english_phrases, question: "Ela fala inglês", correctAnswer: she speaks english }
      - { type: english_phrases, question: "Jantamos às sete", correctAnswer: we have dinner at seven }
      - { type: english_phrases, question: "Ela vai à escola", correctAnswer: she goes to school }
      - { type: english_phrases, question: "Amor é importante (geral)", correctAnswer: love is important }
      - { type: english_phrases, question: "Estudo matemática", correctAnswer: i study math }
      - { type: english_phrases, question: "Ele joga futebol", correctAnswer: he plays soccer }
      - { type: english_phrases, question: "Café da manhã às oito", correctAnswer: breakfast at eight }
target: 20
