title: English F - Definite Article 'the'
level: F
subject: english
difficulty: 3
objectives:
  - A2.grammar.articles
authorNotes: Use 'the' for specific items, unique things, superlatives. Drop 'the' before most proper nouns and abstract/general plurals.
repeatAll: 2
example: O sol → The sun
pages:
  - pageNumber: 1
    title: Unique and Specific
    description: "'The' for things there's only one of, or already mentioned."
    exercises:
      - type: english_phrases
        question: O sol
        correctAnswer: the sun
        rationale: "Superlativos pedem 'the': 'the best'."
      - type: english_phrases
        question: A lua
        correctAnswer: the moon
        rationale: "Evite 'the' com nomes de pessoas."
      - type: english_phrases
        question: O melhor aluno
        correctAnswer: the best student
        rationale: "Segunda menção ou contexto identifica."
      - type: english_phrases
        question: O primeiro dia
        correctAnswer: the first day
        rationale: "Países em regra sem 'the' (exceto 'the USA', 'the UK')."
      - type: english_phrases
        question: O presidente
        correctAnswer: the president
        rationale: "Esportes e refeições sem 'the'."
      - type: english_phrases
        question: O carro que comprei
        correctAnswer: the car i bought
        rationale: "Evite 'the' com nomes de pessoas."
      - type: english_phrases
        question: A casa da esquina
        correctAnswer: the house on the corner
        rationale: "Superlativos pedem 'the': 'the best'."
      - type: english_phrases
        question: O oceano
        correctAnswer: the ocean
        rationale: "'The' quando há só um no contexto."
      - type: english_phrases
        question: O último capítulo
        correctAnswer: the last chapter
        rationale: "Superlativos pedem 'the': 'the best'."
      - type: english_phrases
        question: O mesmo problema
        correctAnswer: the same problem
        rationale: "Países em regra sem 'the' (exceto 'the USA', 'the UK')."
  - pageNumber: 2
    title: No Article
    description: Proper nouns, general plurals, abstract concepts.
    exercises:
      - type: english_phrases
        question: Eu gosto de música (em geral)
        correctAnswer: i like music
        rationale: "'The' = específico, já conhecido pelo ouvinte."
      - type: english_phrases
        question: Cachorros são leais (geral)
        correctAnswer: dogs are loyal
        rationale: "Países em regra sem 'the' (exceto 'the USA', 'the UK')."
      - type: english_phrases
        question: Moro no Brasil
        correctAnswer: i live in brazil
        rationale: "Únicos por natureza: the sun, the moon, the earth."
      - type: english_phrases
        question: Ela fala inglês
        correctAnswer: she speaks english
        rationale: "'The' quando há só um no contexto."
      - type: english_phrases
        question: Jantamos às sete
        correctAnswer: we have dinner at seven
        rationale: "Países em regra sem 'the' (exceto 'the USA', 'the UK')."
      - type: english_phrases
        question: Ela vai à escola
        correctAnswer: she goes to school
        rationale: "Esportes e refeições sem 'the'."
      - type: english_phrases
        question: Amor é importante (geral)
        correctAnswer: love is important
        rationale: "Instrumentos: 'play the piano'."
      - type: english_phrases
        question: Estudo matemática
        correctAnswer: i study math
        rationale: "Países em regra sem 'the' (exceto 'the USA', 'the UK')."
      - type: english_phrases
        question: Ele joga futebol
        correctAnswer: he plays soccer
        rationale: "Superlativos pedem 'the': 'the best'."
      - type: english_phrases
        question: Café da manhã às oito
        correctAnswer: breakfast at eight
        rationale: "Rios, mares, oceanos: 'the Amazon', 'the Atlantic'."
target: 20
