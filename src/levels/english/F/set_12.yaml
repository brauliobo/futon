title: ✏️ English F - Simple Past — Regular Verbs
level: F
subject: english
difficulty: 3
objectives:
  - A2.grammar.simple_past
authorNotes: "Regular past tense with -ed; pronunciation: /t/, /d/, /ɪd/; spelling rules (double consonant, drop -e, y→ied)."
repeatAll: 2
example: Eu trabalhei ontem → I worked yesterday / Ela estudou muito → She studied a lot
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Regular -ed Forms
    description: Add -ed to base verb for past tense.
    exercises:
      - type: english_phrases
        question: eu trabalhei ontem
        correctAnswer: I worked yesterday
        rationale: "'Work' + ed = 'worked'. Passado regular."
        difficulty: 1
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: ela estudou a noite toda
        correctAnswer: She studied all night
        rationale: "'Study' — y→ied = 'studied'. Spelling rule: consoante + y → ied."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: eles chegaram tarde
        correctAnswer: They arrived late
        rationale: "'Arrive' termina em -e → só +d = 'arrived'."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: eu limpei a casa
        correctAnswer: I cleaned the house
        rationale: "'Clean' + ed = 'cleaned'. Passado regular."
        difficulty: 1
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: ele parou de correr
        correctAnswer: He stopped running
        rationale: "'Stop' — consoante-vogal-consoante → dobra a consoante + ed = 'stopped'."
        difficulty: 3
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: nós dançamos a noite toda
        correctAnswer: We danced all night
        rationale: "'Dance' termina em -e → só +d = 'danced'."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: ela ligou para mim
        correctAnswer: She called me
        rationale: "'Call' + ed = 'called'. Passado regular."
        difficulty: 1
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: eles viajaram no mês passado
        correctAnswer: They travelled last month
        rationale: "'Travel' — dobra o -l + ed = 'travelled' (inglês britânico)."
        difficulty: 3
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: eu abri a porta
        correctAnswer: I opened the door
        rationale: "'Open' + ed = 'opened'. Passado regular."
        difficulty: 1
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: ele tentou ajudar
        correctAnswer: He tried to help
        rationale: "'Try' — consoante + y → 'tried' (y→ied). 3ª pessoa mesmo passado."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
  - pageNumber: 2
    title: Negatives & Questions — Past
    description: Didn't + base verb; Did + subject + base verb?
    exercises:
      - type: english_phrases
        question: eu não trabalhei ontem
        correctAnswer: I didn't work yesterday
        rationale: "didn't + base verb (sem -ed no negativo). I didn't work."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: ela não estudou ontem à noite
        correctAnswer: She didn't study last night
        rationale: "didn't + base verb 'study'. Não usa 'studied' no negativo."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: você trabalhou ontem? (pergunta)
        correctAnswer: Did you work yesterday?
        rationale: "Did + subject + base verb? Para perguntas no passado simples."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: ela ligou para você? (pergunta)
        correctAnswer: Did she call you?
        rationale: "Did + she + base verb 'call'? Pergunta no passado."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: onde você morou? (pergunta)
        correctAnswer: Where did you live?
        rationale: "Where + did + you + base verb? WH-question no passado."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: eles não chegaram a tempo
        correctAnswer: They didn't arrive on time
        rationale: "didn't + 'arrive'. Negativo passado simples."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: ele não parou de falar
        correctAnswer: He didn't stop talking
        rationale: "didn't + base verb 'stop'. Não dobra consoante no negativo."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: quando ela chegou? (pergunta)
        correctAnswer: When did she arrive?
        rationale: "When + did + she + 'arrive'? WH-question passado."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: você gostou da festa? — Sim, gostei.
        correctAnswer: Did you enjoy the party? Yes, I did.
        rationale: "Did + you + enjoy? / Yes, I did. — Resposta curta positiva."
        difficulty: 3
        objectives: [A2.grammar.simple_past]
      - type: english_phrases
        question: eles não dançaram na festa
        correctAnswer: They didn't dance at the party
        rationale: "didn't + 'dance' (base verb). Negativo passado."
        difficulty: 2
        objectives: [A2.grammar.simple_past]
target: 20
