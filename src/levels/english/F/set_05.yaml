title: English F - Subject & Object Pronouns
level: F
subject: english
difficulty: 2
objectives:
  - A2.grammar.pronouns
authorNotes: I/me, you/you, he/him, she/her, it/it, we/us, they/them.
repeatAll: 2
example: Eu o vejo → I see him
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Subject Pronouns
    description: I, you, he, she, it, we, they — doers of the action.
    exercises:
      - type: english_phrases
        question: Eu estudo
        correctAnswer: I study
        rationale: "'I' (sujeito) sempre maiúsculo em inglês. 'Study' sem -s na 1ª pessoa."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Você ajuda
        correctAnswer: You help
        rationale: "'You' (sujeito, cobre 'tu/você/vocês'). Verbo sem -s."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Ele corre
        correctAnswer: He runs
        rationale: "'He' (sujeito masc.). 3ª pessoa adiciona -s: 'runs'."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Ela lê
        correctAnswer: She reads
        rationale: "'She' (sujeito fem.). 3ª pessoa + s: 'reads'."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Está chovendo
        correctAnswer: It is raining
        rationale: "'It' para clima (impessoal). Sujeito obrigatório em inglês."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Nós cantamos
        correctAnswer: We sing
        rationale: "'We' (sujeito, 1ª plural). 'Sing' sem -s (não 3ª pessoa)."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Eles dançam
        correctAnswer: They dance
        rationale: "'They' (sujeito plural). 'Dance' sem -s."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Ela e eu somos irmãs
        correctAnswer: She and I are sisters
        rationale: "Sujeito composto: 'she and I' (não 'her and me'). Plural → 'are'."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Você e ele são amigos
        correctAnswer: You and he are friends
        rationale: "'You and he' — ambos sujeitos. Plural → 'are friends'."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Nós vencemos
        correctAnswer: We won
        rationale: "'We' (sujeito plural). 'Won' = passado irregular de 'win'."
        difficulty: 1
        objectives: [A2.grammar.pronouns]
  - pageNumber: 2
    title: Object Pronouns
    description: me, you, him, her, it, us, them — receivers of the action.
    exercises:
      - type: english_phrases
        question: Me ajude
        correctAnswer: Help me
        rationale: "'Me' (objeto) após o verbo. Imperativo sem sujeito: 'help me'."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Eu te vejo
        correctAnswer: I see you
        rationale: "'I' (sujeito) + verbo + 'you' (objeto). 'You' cobre ambos."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Eu o vejo (him)
        correctAnswer: I see him
        rationale: "'Him' (objeto masc.) após o verbo. Não 'I see he'."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Ela a ama
        correctAnswer: She loves her
        rationale: "'She' (sujeito) + 'loves' (+s) + 'her' (objeto fem.)."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Eu o peguei (it)
        correctAnswer: I got it
        rationale: "'It' (objeto neutro) após verbo. 'Got' = past de get."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Ligue para nós
        correctAnswer: Call us
        rationale: "'Us' (objeto 1ª plural) após 'call'. Não 'call to us'."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Conheça eles
        correctAnswer: Meet them
        rationale: "'Them' (objeto plural) após 'meet'. Não 'meet they'."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Ele me ama
        correctAnswer: He loves me
        rationale: "'He' (sujeito) + 'loves' + 'me' (objeto 1ª pessoa)."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Dê para ela
        correctAnswer: Give it to her
        rationale: "'It' (objeto direto) + 'to her' (objeto indireto com 'to')."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
      - type: english_phrases
        question: Eu vou perguntar a ele
        correctAnswer: I will ask him
        rationale: "'Ask him' — 'ask' é transitivo direto, sem 'to'. 'Him' (objeto)."
        difficulty: 2
        objectives: [A2.grammar.pronouns]
target: 20
