title: English F - Subject & Object Pronouns
level: F
subject: english
difficulty: 2
objectives: [A2.grammar.pronouns]
authorNotes: I/me, you/you, he/him, she/her, it/it, we/us, they/them.
repeatAll: 2
example: "Eu o vejo → I see him"
pages:
  - pageNumber: 1
    title: Subject Pronouns
    description: I, you, he, she, it, we, they — doers of the action.
    exercises:
      - { type: english_phrases, question: "Eu estudo", correctAnswer: i study }
      - { type: english_phrases, question: "Você ajuda", correctAnswer: you help }
      - { type: english_phrases, question: "Ele corre", correctAnswer: he runs }
      - { type: english_phrases, question: "Ela lê", correctAnswer: she reads }
      - { type: english_phrases, question: "Está chovendo", correctAnswer: it is raining }
      - { type: english_phrases, question: "Nós cantamos", correctAnswer: we sing }
      - { type: english_phrases, question: "Eles dançam", correctAnswer: they dance }
      - { type: english_phrases, question: "Ela e eu somos irmãs", correctAnswer: she and i are sisters }
      - { type: english_phrases, question: "Você e ele são amigos", correctAnswer: you and he are friends }
      - { type: english_phrases, question: "Nós vencemos", correctAnswer: we won }
  - pageNumber: 2
    title: Object Pronouns
    description: me, you, him, her, it, us, them — receivers of the action.
    exercises:
      - { type: english_phrases, question: "Me ajude", correctAnswer: help me }
      - { type: english_phrases, question: "Eu te vejo", correctAnswer: i see you }
      - { type: english_phrases, question: "Eu o vejo (him)", correctAnswer: i see him }
      - { type: english_phrases, question: "Ela a ama", correctAnswer: she loves her }
      - { type: english_phrases, question: "Eu o peguei (it)", correctAnswer: i got it }
      - { type: english_phrases, question: "Ligue para nós", correctAnswer: call us }
      - { type: english_phrases, question: "Conheça eles", correctAnswer: meet them }
      - { type: english_phrases, question: "Ele me ama", correctAnswer: he loves me }
      - { type: english_phrases, question: "Dê para ela", correctAnswer: give it to her }
      - { type: english_phrases, question: "Eu vou perguntar a ele", correctAnswer: i will ask him }
target: 20
