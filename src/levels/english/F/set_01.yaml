title: English F - Articles a / an
level: F
subject: english
difficulty: 2
objectives: [A2.grammar.articles]
authorNotes: "'a' before consonant sounds, 'an' before vowel sounds — based on sound, not spelling (an hour, a university)."
repeatAll: 2
example: "Um livro → a book / Uma maçã → an apple"
pages:
  - pageNumber: 1
    title: A / An by Sound
    description: Choose the article that matches the initial sound.
    exercises:
      - { type: english_phrases, question: "Um livro", correctAnswer: a book }
      - { type: english_phrases, question: "Uma maçã", correctAnswer: an apple }
      - { type: english_phrases, question: "Um ovo", correctAnswer: an egg }
      - { type: english_phrases, question: "Uma laranja", correctAnswer: an orange }
      - { type: english_phrases, question: "Um carro", correctAnswer: a car }
      - { type: english_phrases, question: "Uma ideia", correctAnswer: an idea }
      - { type: english_phrases, question: "Uma hora", correctAnswer: an hour }
      - { type: english_phrases, question: "Uma universidade", correctAnswer: a university }
      - { type: english_phrases, question: "Um guarda-chuva", correctAnswer: an umbrella }
      - { type: english_phrases, question: "Um amigo honesto", correctAnswer: an honest friend }
  - pageNumber: 2
    title: A / An in Sentences
    description: Articles in simple contexts.
    exercises:
      - { type: english_phrases, question: "Eu tenho um cachorro", correctAnswer: i have a dog }
      - { type: english_phrases, question: "Ela é uma professora", correctAnswer: she is a teacher }
      - { type: english_phrases, question: "É uma oportunidade", correctAnswer: it is an opportunity }
      - { type: english_phrases, question: "Ele precisa de um emprego", correctAnswer: he needs a job }
      - { type: english_phrases, question: "Eu quero uma bebida", correctAnswer: i want a drink }
      - { type: english_phrases, question: "Ela comprou uma bicicleta", correctAnswer: she bought a bicycle }
      - { type: english_phrases, question: "Ele viu um elefante", correctAnswer: he saw an elephant }
      - { type: english_phrases, question: "Eu sou um estudante", correctAnswer: i am a student }
      - { type: english_phrases, question: "Precisamos de um plano", correctAnswer: we need a plan }
      - { type: english_phrases, question: "É uma história antiga", correctAnswer: it is an old story }
target: 20
