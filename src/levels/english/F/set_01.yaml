title: English F - Articles a / an
level: F
subject: english
difficulty: 2
objectives:
  - A2.grammar.articles
authorNotes: "'a' before consonant sounds, 'an' before vowel sounds — based on sound, not spelling (an hour, a university)."
repeatAll: 2
example: Um livro → a book / Uma maçã → an apple
pages:
  - pageNumber: 1
    title: A / An by Sound
    description: Choose the article that matches the initial sound.
    exercises:
      - type: english_phrases
        question: Um livro
        correctAnswer: a book
        rationale: "'Book' começa com /b/ (consoante) → 'a book'."
      - type: english_phrases
        question: Uma maçã
        correctAnswer: an apple
        rationale: "'Apple' começa com /æ/ (vogal) → 'an apple'."
      - type: english_phrases
        question: Um ovo
        correctAnswer: an egg
        rationale: "'Egg' começa com /e/ (vogal) → 'an egg', não 'a egg'."
      - type: english_phrases
        question: Uma laranja
        correctAnswer: an orange
        rationale: "'Orange' começa com /ɒ/ (vogal) → 'an orange'."
      - type: english_phrases
        question: Um carro
        correctAnswer: a car
        rationale: "'Car' começa com /k/ (consoante) → 'a car'."
      - type: english_phrases
        question: Uma ideia
        correctAnswer: an idea
        rationale: "'Idea' começa com /aɪ/ (vogal) → 'an idea'."
      - type: english_phrases
        question: Uma hora
        correctAnswer: an hour
        rationale: "'Hour' tem 'h' mudo, som inicial /aʊ/ (vogal) → 'an hour'."
      - type: english_phrases
        question: Uma universidade
        correctAnswer: a university
        rationale: "'University' começa com som /j/ (semi-consoante) → 'a university'."
      - type: english_phrases
        question: Um guarda-chuva
        correctAnswer: an umbrella
        rationale: "'Umbrella' começa com /ʌ/ (vogal) → 'an umbrella'."
      - type: english_phrases
        question: Um amigo honesto
        correctAnswer: an honest friend
        rationale: "'Honest' tem 'h' mudo, som /ɒ/ → 'an honest friend'."
  - pageNumber: 2
    title: A / An in Sentences
    description: Articles in simple contexts.
    exercises:
      - type: english_phrases
        question: Eu tenho um cachorro
        correctAnswer: i have a dog
        rationale: "'Dog' começa com /d/ (consoante) → 'a dog'. 'Have' = ter."
      - type: english_phrases
        question: Ela é uma professora
        correctAnswer: she is a teacher
        rationale: "Profissões exigem artigo: 'a teacher' (/t/ consoante)."
      - type: english_phrases
        question: É uma oportunidade
        correctAnswer: it is an opportunity
        rationale: "'Opportunity' começa com /ɒ/ (vogal) → 'an opportunity'."
      - type: english_phrases
        question: Ele precisa de um emprego
        correctAnswer: he needs a job
        rationale: "'Job' começa com /dʒ/ (consoante) → 'a job'. 'Needs' (+s)."
      - type: english_phrases
        question: Eu quero uma bebida
        correctAnswer: i want a drink
        rationale: "'Drink' começa com /d/ (consoante) → 'a drink'."
      - type: english_phrases
        question: Ela comprou uma bicicleta
        correctAnswer: she bought a bicycle
        rationale: "'Bicycle' → 'a' (consoante /b/). 'Bought' = passado de buy."
      - type: english_phrases
        question: Ele viu um elefante
        correctAnswer: he saw an elephant
        rationale: "'Elephant' começa com /e/ (vogal) → 'an elephant'. 'Saw' (see)."
      - type: english_phrases
        question: Eu sou um estudante
        correctAnswer: i am a student
        rationale: "'Student' começa com /s/ (consoante) → 'a student'."
      - type: english_phrases
        question: Precisamos de um plano
        correctAnswer: we need a plan
        rationale: "'Plan' começa com /p/ (consoante) → 'a plan'."
      - type: english_phrases
        question: É uma história antiga
        correctAnswer: it is an old story
        rationale: "Artigo concorda com adjetivo seguinte: 'old' /oʊ/ → 'an old story'."
target: 20
