title: ✏️ English G - Reported Speech
level: G
subject: english
difficulty: 4
objectives:
  - B1.grammar.reported_speech
authorNotes: Reported speech with backshift — present→past, past→past perfect, will→would, can→could. Reporting verbs say/tell. Pronoun and time expression changes.
repeatAll: 2
example: "Ela disse: 'Estou cansada'" → She said she was tired / "Ele disse para mim: 'Você pode vir'" → He told me I could come
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Say vs Tell
    description: say (+ that, no object); tell (+ object).
    exercises:
      - type: english_phrases
        question: ela disse que estava cansada
        correctAnswer: She said she was tired
        rationale: "Said + that-clause. 'Say' sem objeto — she said (não 'said me')."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ele me disse que estava atrasado
        correctAnswer: He told me he was late
        rationale: "'Tell' + objeto (me) + that-clause. He told me he was late."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: eles disseram que iriam à festa
        correctAnswer: They said they would go to the party
        rationale: "Said + would (will→would no backshift). They said they would go."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ela nos disse que o voo estava atrasado
        correctAnswer: She told us the flight was delayed
        rationale: "Told + us (objeto) + that-clause. Backshift: is→was."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ele disse que gostava de morar aqui
        correctAnswer: He said he liked living here
        rationale: "Said + liked (backshift: likes→liked). He said he liked..."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: a professora nos disse que a prova seria difícil
        correctAnswer: The teacher told us the exam would be difficult
        rationale: "Told + us + would be (will→would). Backshift obrigatório."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ele disse que tinha terminado o trabalho
        correctAnswer: He said he had finished the work
        rationale: "Said + had finished (backshift: finished→had finished — past perfect)."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ela me disse que podia ajudar
        correctAnswer: She told me she could help
        rationale: "Told + me + could (can→could no backshift)."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: eles disseram que não sabiam a resposta
        correctAnswer: They said they didn't know the answer
        rationale: "Said + didn't know (backshift: don't know→didn't know)."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ele me disse que eu estava errado
        correctAnswer: He told me I was wrong
        rationale: "Told + me + that I was (pronome 'you'→'I' muda). Backshift: are→was."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
  - pageNumber: 2
    title: Reported Questions & Commands
    description: Reported questions with if/whether; commands with infinitive.
    exercises:
      - type: english_phrases
        question: ela perguntou se eu morava ali
        correctAnswer: She asked if I lived there
        rationale: "Asked + if + subject + verb (sem inversão). Backshift: live→lived."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ele perguntou onde eu trabalhava
        correctAnswer: He asked where I worked
        rationale: "Asked + where + subject + verb. WH-question indireto — sem inversão."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ela me mandou fechar a porta
        correctAnswer: She told me to close the door
        rationale: "Told + object + to + base verb. Reported command afirmativo."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ele me pediu para não fazer barulho
        correctAnswer: He asked me not to make noise
        rationale: "Asked + object + not to + base verb. Reported command negativo."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ela perguntou se eu tinha comido
        correctAnswer: She asked if I had eaten
        rationale: "Asked + if + I had eaten. Backshift: have eaten→had eaten."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: o médico me disse para tomar o remédio
        correctAnswer: The doctor told me to take the medicine
        rationale: "Told + me + to + base verb. Instrução médica em discurso indireto."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: eles perguntaram o que eu queria
        correctAnswer: They asked what I wanted
        rationale: "Asked + what + subject + verb. WH-question indireto sem inversão."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: a mãe mandou os filhos irem dormir
        correctAnswer: The mother told the children to go to sleep
        rationale: "Told + the children + to go. Reported command com sujeito especificado."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ela perguntou quando eu chegaria
        correctAnswer: She asked when I would arrive
        rationale: "Asked + when + I would (will→would, backshift). WH-question indireto."
        difficulty: 3
        objectives: [B1.grammar.reported_speech]
      - type: english_phrases
        question: ele me disse para não preocupar
        correctAnswer: He told me not to worry
        rationale: "Told + me + not to worry. Reported negative command."
        difficulty: 2
        objectives: [B1.grammar.reported_speech]
target: 20
