title: English G - Present Perfect — Negatives & Questions
level: G
subject: english
difficulty: 3
objectives: [B1.grammar.present_perfect, B1.grammar.negation, B1.grammar.questions]
authorNotes: Haven't / hasn't + participle. Have/Has + subject + participle for questions. Often with 'never', 'ever', 'yet'.
repeatAll: 2
example: "Eu nunca fui → I have never been"
pages:
  - pageNumber: 1
    title: Negatives with Never / Yet
    description: Strong negation with 'never'; incomplete with 'yet'.
    exercises:
      - { type: english_phrases, question: "Eu nunca estive lá", correctAnswer: i have never been there }
      - { type: english_phrases, question: "Ela nunca viu a neve", correctAnswer: she has never seen snow }
      - { type: english_phrases, question: "Nós nunca comemos isso", correctAnswer: we have never eaten that }
      - { type: english_phrases, question: "Ele ainda não chegou", correctAnswer: he has not arrived yet }
      - { type: english_phrases, question: "Eles ainda não terminaram", correctAnswer: they have not finished yet }
      - { type: english_phrases, question: "Eu não a vi hoje", correctAnswer: i have not seen her today }
      - { type: english_phrases, question: "Ainda não comi", correctAnswer: i have not eaten yet }
      - { type: english_phrases, question: "Ela nunca dirigiu", correctAnswer: she has never driven }
      - { type: english_phrases, question: "Nós nunca perdemos", correctAnswer: we have never lost }
      - { type: english_phrases, question: "Eu nunca menti para você", correctAnswer: i have never lied to you }
  - pageNumber: 2
    title: Questions with Ever / Yet
    description: Experience questions (ever) and expected-action questions (yet).
    exercises:
      - { type: english_phrases, question: "Você já esteve em Paris?", correctAnswer: have you ever been to paris }
      - { type: english_phrases, question: "Ela já viu esse filme?", correctAnswer: has she ever seen this movie }
      - { type: english_phrases, question: "Vocês já comeram sushi?", correctAnswer: have you ever eaten sushi }
      - { type: english_phrases, question: "Ele já terminou?", correctAnswer: has he finished yet }
      - { type: english_phrases, question: "Você já leu isso?", correctAnswer: have you read this yet }
      - { type: english_phrases, question: "Eles já chegaram?", correctAnswer: have they arrived yet }
      - { type: english_phrases, question: "Você já a conheceu?", correctAnswer: have you met her }
      - { type: english_phrases, question: "Quantas vezes você foi lá?", correctAnswer: how many times have you been there }
      - { type: english_phrases, question: "Você já trabalhou aqui?", correctAnswer: have you ever worked here }
      - { type: english_phrases, question: "Quem viu meu livro?", correctAnswer: who has seen my book }
target: 20
