title: English G - Present Perfect — Affirmative
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.present_perfect
authorNotes: Subject + have/has + past participle. Experiences and results that affect now.
repeatAll: 2
example: Eu já fui para Londres → I have been to London
pages:
  - pageNumber: 1
    title: Experiences (Ever, Already)
    description: Life experiences without a specific time.
    exercises:
      - type: english_phrases
        question: Eu já fui para Londres
        correctAnswer: i have been to london
        rationale: "'Have been to' = já estive (experiência). 'Been' particípio de 'be'."
      - type: english_phrases
        question: Ela já viu o oceano
        correctAnswer: she has seen the ocean
        rationale: "'She has' (3ª pessoa → has) + 'seen' (particípio de see)."
      - type: english_phrases
        question: Nós já comemos sushi
        correctAnswer: we have eaten sushi
        rationale: "'We have' + 'eaten' (particípio de eat). Experiência de vida."
      - type: english_phrases
        question: Eles já visitaram Paris
        correctAnswer: they have visited paris
        rationale: "'They have visited' — 'visited' (particípio regular +ed)."
      - type: english_phrases
        question: Eu já terminei a tarefa
        correctAnswer: i have finished the homework
        rationale: "'Finished' (particípio regular). 'Homework' incontável, com 'the'."
      - type: english_phrases
        question: Ele já leu esse livro
        correctAnswer: he has read that book
        rationale: "'Read' particípio mantém grafia, mas pronuncia /red/. 'Has read'."
      - type: english_phrases
        question: Nós já conhecemos ela
        correctAnswer: we have met her
        rationale: "'Met' (particípio de meet). 'Her' (objeto) após verbo."
      - type: english_phrases
        question: Eu já vivi no Brasil
        correctAnswer: i have lived in brazil
        rationale: "'Lived' (particípio regular). 'In Brazil' (país sem 'the')."
      - type: english_phrases
        question: Ela já trabalhou aqui
        correctAnswer: she has worked here
        rationale: "'She has worked' — 3ª pessoa pede 'has'. 'Here' (lugar)."
      - type: english_phrases
        question: Eles já viajaram juntos
        correctAnswer: they have traveled together
        rationale: "'Traveled' (AmE, 1 l). 'Together' = juntos, ao final."
  - pageNumber: 2
    title: Results (Just, Already)
    description: Recent actions with present relevance.
    exercises:
      - type: english_phrases
        question: Acabei de chegar
        correctAnswer: i have just arrived
        rationale: "'Just' entre 'have' e particípio = ação recente. 'Arrived'."
      - type: english_phrases
        question: Ele acabou de sair
        correctAnswer: he has just left
        rationale: "'Has just left' — 'left' (particípio irregular de leave)."
      - type: english_phrases
        question: Ela já terminou
        correctAnswer: she has already finished
        rationale: "'Already' entre 'has' e particípio = já (ação completa)."
      - type: english_phrases
        question: Eles já chegaram
        correctAnswer: they have already arrived
        rationale: "'Already arrived' — 'already' antes do particípio."
      - type: english_phrases
        question: Acabei de entender
        correctAnswer: i have just understood
        rationale: "'Understood' (particípio irregular de understand). 'Just' recente."
      - type: english_phrases
        question: Nós já comemos
        correctAnswer: we have already eaten
        rationale: "'We have already eaten' — 'eaten' (particípio de eat)."
      - type: english_phrases
        question: Ele perdeu as chaves
        correctAnswer: he has lost his keys
        rationale: "'Lost' (particípio irregular de lose). 'His keys' (possessivo)."
      - type: english_phrases
        question: Ela acabou de ligar
        correctAnswer: she has just called
        rationale: "'Has just called' — 'called' (particípio regular +ed)."
      - type: english_phrases
        question: Eu consegui o emprego
        correctAnswer: i have gotten the job
        rationale: "'Gotten' (particípio AmE de get). 'The job' específico."
      - type: english_phrases
        question: Nós compramos uma casa
        correctAnswer: we have bought a house
        rationale: "'Bought' (particípio irregular de buy). 'A house' (consoante)."
target: 20
