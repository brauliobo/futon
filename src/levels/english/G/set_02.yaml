title: English G - Present Perfect — Affirmative
level: G
subject: english
difficulty: 3
objectives: [B1.grammar.present_perfect]
authorNotes: Subject + have/has + past participle. Experiences and results that affect now.
repeatAll: 2
example: "Eu já fui para Londres → I have been to London"
pages:
  - pageNumber: 1
    title: Experiences (Ever, Already)
    description: Life experiences without a specific time.
    exercises:
      - { type: english_phrases, question: "Eu já fui para Londres", correctAnswer: i have been to london }
      - { type: english_phrases, question: "Ela já viu o oceano", correctAnswer: she has seen the ocean }
      - { type: english_phrases, question: "Nós já comemos sushi", correctAnswer: we have eaten sushi }
      - { type: english_phrases, question: "Eles já visitaram Paris", correctAnswer: they have visited paris }
      - { type: english_phrases, question: "Eu já terminei a tarefa", correctAnswer: i have finished the homework }
      - { type: english_phrases, question: "Ele já leu esse livro", correctAnswer: he has read that book }
      - { type: english_phrases, question: "Nós já conhecemos ela", correctAnswer: we have met her }
      - { type: english_phrases, question: "Eu já vivi no Brasil", correctAnswer: i have lived in brazil }
      - { type: english_phrases, question: "Ela já trabalhou aqui", correctAnswer: she has worked here }
      - { type: english_phrases, question: "Eles já viajaram juntos", correctAnswer: they have traveled together }
  - pageNumber: 2
    title: Results (Just, Already)
    description: Recent actions with present relevance.
    exercises:
      - { type: english_phrases, question: "Acabei de chegar", correctAnswer: i have just arrived }
      - { type: english_phrases, question: "Ele acabou de sair", correctAnswer: he has just left }
      - { type: english_phrases, question: "Ela já terminou", correctAnswer: she has already finished }
      - { type: english_phrases, question: "Eles já chegaram", correctAnswer: they have already arrived }
      - { type: english_phrases, question: "Acabei de entender", correctAnswer: i have just understood }
      - { type: english_phrases, question: "Nós já comemos", correctAnswer: we have already eaten }
      - { type: english_phrases, question: "Ele perdeu as chaves", correctAnswer: he has lost his keys }
      - { type: english_phrases, question: "Ela acabou de ligar", correctAnswer: she has just called }
      - { type: english_phrases, question: "Eu consegui o emprego", correctAnswer: i have gotten the job }
      - { type: english_phrases, question: "Nós compramos uma casa", correctAnswer: we have bought a house }
target: 20
