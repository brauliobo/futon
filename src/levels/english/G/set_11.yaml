title: ✏️ English G - Modal Verbs — Should, Must, Have to
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.modals
authorNotes: Should (advice/recommendation); must (strong obligation/deduction); have to (external obligation); mustn't (prohibition); don't have to (no obligation).
repeatAll: 2
example: Você deveria estudar mais → You should study more / Você deve (tem que) fazer → You must/have to do it
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Should — Advice & Recommendation
    description: Should + base verb for advice; shouldn't for negative advice.
    exercises:
      - type: english_phrases
        question: você deveria dormir mais cedo
        correctAnswer: You should sleep earlier
        rationale: "Should + base verb. Conselho/recomendação."
        difficulty: 1
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: ela não deveria comer tanto açúcar
        correctAnswer: She shouldn't eat so much sugar
        rationale: "Shouldn't + base verb. Conselho negativo."
        difficulty: 1
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: você acha que eu devo ligar para ele? (conselho)
        correctAnswer: Do you think I should call him?
        rationale: "Do you think + I should + base verb? Pedindo conselho."
        difficulty: 2
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: todos deveriam ler mais
        correctAnswer: Everyone should read more
        rationale: "Should + base verb. Recomendação geral."
        difficulty: 1
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: você deveria ter estudado mais (passado)
        correctAnswer: You should have studied more
        rationale: "Should have + pp. Conselho sobre o passado (arrependimento)."
        difficulty: 3
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: nós não deveríamos ter saído tão tarde
        correctAnswer: We shouldn't have left so late
        rationale: "Shouldn't have + pp. Crítica a ação passada."
        difficulty: 3
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: o que eu devo fazer? (pedindo conselho)
        correctAnswer: What should I do?
        rationale: "What + should + I + base verb? Pergunta pedindo conselho."
        difficulty: 1
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: você deveria ver esse filme
        correctAnswer: You should see this film
        rationale: "Should + see. Recomendação."
        difficulty: 1
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: eles deveriam chegar a tempo
        correctAnswer: They should arrive on time
        rationale: "Should + arrive. Expectativa ou recomendação."
        difficulty: 1
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: ele deveria se desculpar
        correctAnswer: He should apologise
        rationale: "Should + apologise. Conselho moral."
        difficulty: 2
        objectives: [B1.grammar.modals]
  - pageNumber: 2
    title: Must / Have to / Mustn't / Don't have to
    description: Must = strong obligation/deduction; have to = external rule; mustn't = prohibition; don't have to = no obligation.
    exercises:
      - type: english_phrases
        question: você tem que usar cinto de segurança (lei)
        correctAnswer: You have to wear a seatbelt
        rationale: "Have to = obrigação externa (lei). You have to wear..."
        difficulty: 1
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: você deve ser o João! (dedução)
        correctAnswer: You must be João!
        rationale: "Must = dedução lógica. You must be... (sou quase certo)."
        difficulty: 2
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: você não pode fumar aqui (proibição)
        correctAnswer: You mustn't smoke here
        rationale: "Mustn't = proibição forte. Não é falta de obrigação."
        difficulty: 2
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: você não precisa pagar — é de graça
        correctAnswer: You don't have to pay — it's free
        rationale: "Don't have to = sem obrigação (não é proibição). It's free."
        difficulty: 2
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: ela tem que trabalhar aos sábados
        correctAnswer: She has to work on Saturdays
        rationale: "Has to (3ª pessoa) = obrigação externa. She has to work."
        difficulty: 2
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: eles não precisam vir cedo
        correctAnswer: They don't have to come early
        rationale: "Don't have to = não é necessário (mas podem)."
        difficulty: 1
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: você não deve dizer isso! (proibição moral)
        correctAnswer: You mustn't say that!
        rationale: "Mustn't = proibição. Forte obrigação negativa."
        difficulty: 2
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: eu preciso sair agora (obrigação pessoal)
        correctAnswer: I must leave now
        rationale: "Must = obrigação interna (própria decisão). I must leave."
        difficulty: 2
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: você tinha que ter passaporte (obrigação passada)
        correctAnswer: You had to have a passport
        rationale: "Had to = passado de have to/must. Obrigação no passado."
        difficulty: 3
        objectives: [B1.grammar.modals]
      - type: english_phrases
        question: ela deve estar cansada depois do trabalho (dedução)
        correctAnswer: She must be tired after work
        rationale: "Must = dedução lógica baseada em evidência. She must be tired."
        difficulty: 2
        objectives: [B1.grammar.modals]
target: 20
