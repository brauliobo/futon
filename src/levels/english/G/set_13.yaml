title: ✏️ English G - Quantifiers — Some, Any, Much, Many, Few, Little
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.quantifiers
authorNotes: Some (positive), any (negative/question), much/little (uncountable), many/few (countable), a lot of/lots of (both), plenty of, enough, too much/many.
repeatAll: 2
example: Tem leite? → Is there any milk? / Tem pouco leite → There is little milk / Muitos alunos → Many students
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Some / Any
    description: Some (positive), any (negative/question); both countable and uncountable.
    exercises:
      - type: english_phrases
        question: tem alguma água? (pergunta)
        correctAnswer: Is there any water?
        rationale: "'Any' em perguntas. Is there any + incontável?"
        difficulty: 1
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: não há nenhum livro disponível
        correctAnswer: There aren't any books available
        rationale: "'Any' em negativas. There aren't any + plural."
        difficulty: 1
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: eu tenho algum dinheiro
        correctAnswer: I have some money
        rationale: "'Some' em positivas. I have some money."
        difficulty: 1
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: você quer um pouco de café? (oferta)
        correctAnswer: Would you like some coffee?
        rationale: "'Some' em ofertas e pedidos. Would you like some...?"
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: eu não tenho nenhum amigo aqui
        correctAnswer: I don't have any friends here
        rationale: "'Any' em negativas com plural contável. Don't have any friends."
        difficulty: 1
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: há alguns problemas que precisamos resolver
        correctAnswer: There are some problems we need to solve
        rationale: "'Some' com plural contável em positivas. There are some problems."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: você pode me dar alguma informação? (pedido)
        correctAnswer: Can you give me some information?
        rationale: "'Some' em pedidos. Information é incontável."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: ela não tem nenhum tempo livre
        correctAnswer: She doesn't have any free time
        rationale: "'Any' em negativa. Free time é incontável."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: você tem alguma ideia de como fazer? (pergunta)
        correctAnswer: Do you have any idea how to do it?
        rationale: "'Any' em pergunta. 'Any idea' = alguma ideia."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: ele comprou alguns livros novos
        correctAnswer: He bought some new books
        rationale: "'Some' com plural contável em positiva."
        difficulty: 1
        objectives: [B1.grammar.quantifiers]
  - pageNumber: 2
    title: Much, Many, Few, Little, A lot of
    description: Countable: many/few; uncountable: much/little; both: a lot of/lots of.
    exercises:
      - type: english_phrases
        question: há muitas pessoas na festa
        correctAnswer: There are many people at the party
        rationale: "'Many' com plural contável. There are many people."
        difficulty: 1
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: não há muito tempo
        correctAnswer: There isn't much time
        rationale: "'Much' com incontável em negativas/perguntas. Not much time."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: poucas pessoas sabem disso
        correctAnswer: Few people know about this
        rationale: "'Few' com contável = not many. Few people know."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: há muito pouco açúcar no bolo
        correctAnswer: There is very little sugar in the cake
        rationale: "'Little' com incontável = not much. Very little sugar."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: ele tem muitos amigos
        correctAnswer: He has a lot of friends
        rationale: "'A lot of' com contável em positiva. He has a lot of friends."
        difficulty: 1
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: não coma muito sal
        correctAnswer: Don't eat too much salt
        rationale: "'Too much' com incontável = em excesso. Don't eat too much salt."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: eu tenho dinheiro suficiente
        correctAnswer: I have enough money
        rationale: "'Enough' = suficiente. Vem antes do substantivo."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: há bastante comida para todos
        correctAnswer: There is plenty of food for everyone
        rationale: "'Plenty of' = abundância. There is plenty of food."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: poucas coisas me surpreendem agora
        correctAnswer: Few things surprise me now
        rationale: "'Few' com plural contável = not many things."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
      - type: english_phrases
        question: há muitas coisas que eu ainda preciso aprender
        correctAnswer: There are lots of things I still need to learn
        rationale: "'Lots of' = a lot of com plural contável."
        difficulty: 2
        objectives: [B1.grammar.quantifiers]
target: 20
