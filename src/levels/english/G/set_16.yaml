title: ✏️ English G - Linking Words & Discourse Markers
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.discourse
authorNotes: Contrast (although, even though, despite, however, nevertheless), reason (because, as, since, due to), result (so, therefore, as a result), addition (moreover, furthermore, in addition), concession.
repeatAll: 2
example: Embora estivesse cansado, foi trabalhar → Although he was tired, he went to work
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Contrast — Although, Despite, However
    description: Linking words showing contrast.
    exercises:
      - type: english_phrases
        question: embora estivesse cansado, ele foi ao trabalho
        correctAnswer: Although he was tired, he went to work
        rationale: "'Although' = conjunction (embora). Although + clause + clause."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: apesar do cansaço, ele foi ao trabalho
        correctAnswer: Despite being tired, he went to work
        rationale: "'Despite' = preposition (apesar de). Despite + noun/gerund."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: o filme foi bom. Porém, era muito longo.
        correctAnswer: The film was good. However, it was very long.
        rationale: "'However' = adverb (porém/no entanto). Sentence connector."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: mesmo que seja difícil, vou tentar
        correctAnswer: Even though it is difficult, I will try
        rationale: "'Even though' = stronger than 'although'. Concessão enfática."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: apesar de tudo, ela conseguiu
        correctAnswer: Despite everything, she managed
        rationale: "'Despite' + noun (everything). Despite everything, she managed."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: era caro. Mesmo assim, eu comprei.
        correctAnswer: It was expensive. Nevertheless, I bought it.
        rationale: "'Nevertheless' = mesmo assim/apesar disso. Formal sentence connector."
        difficulty: 3
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: embora goste dele, não concordo
        correctAnswer: Although I like him, I don't agree
        rationale: "'Although' com present simple. Contraste de sentimentos/opinião."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: apesar do mau tempo, saímos
        correctAnswer: Despite the bad weather, we went out
        rationale: "'Despite' + the + noun phrase. Despite the bad weather."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: ela é boa aluna. No entanto, não passou.
        correctAnswer: She is a good student. However, she didn't pass.
        rationale: "'However' conecta duas frases mostrando contraste inesperado."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: apesar de ter estudado, eu reprovei
        correctAnswer: Despite having studied, I failed
        rationale: "'Despite' + having + pp. Contraste com ação passada."
        difficulty: 3
        objectives: [B1.grammar.discourse]
  - pageNumber: 2
    title: Reason, Result & Addition
    description: because/as/since, so/therefore/as a result, moreover/furthermore.
    exercises:
      - type: english_phrases
        question: eu fiquei em casa porque estava chovendo
        correctAnswer: I stayed at home because it was raining
        rationale: "'Because' = razão direta. Because + clause."
        difficulty: 1
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: como estava tarde, eu fui dormir
        correctAnswer: As it was late, I went to bed
        rationale: "'As' = since/because. Menos enfático que 'because'. As it was late..."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: ele estava cansado, então foi dormir cedo
        correctAnswer: He was tired, so he went to bed early
        rationale: "'So' = resultado imediato. Clause + so + result clause."
        difficulty: 1
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: foi mal organizado. Como resultado, falhou.
        correctAnswer: It was badly organised. As a result, it failed.
        rationale: "'As a result' = como resultado. Formal discourse marker."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: ela é inteligente; além disso, é trabalhadora
        correctAnswer: She is intelligent; moreover, she is hardworking
        rationale: "'Moreover' = além disso (formal addition). Adds positive point."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: é barato. Além do mais, fica perto.
        correctAnswer: It is cheap. Furthermore, it is nearby.
        rationale: "'Furthermore' = além disso (formal). Acrescenta argumento."
        difficulty: 3
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: por causa do trânsito, ele chegou tarde
        correctAnswer: Due to the traffic, he arrived late
        rationale: "'Due to' = por causa de + noun. Due to the traffic."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: o projeto fracassou. Portanto, precisamos replanejar.
        correctAnswer: The project failed. Therefore, we need to replan.
        rationale: "'Therefore' = portanto (formal). Formal logical consequence."
        difficulty: 2
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: ele não só cantou, como também dançou
        correctAnswer: Not only did he sing, but he also danced
        rationale: "'Not only... but also' = não só... mas também. Note inversão após 'not only'."
        difficulty: 3
        objectives: [B1.grammar.discourse]
      - type: english_phrases
        question: em adição ao salário, ele recebe bônus
        correctAnswer: In addition to his salary, he receives a bonus
        rationale: "'In addition to' = além de + noun. In addition to his salary."
        difficulty: 3
        objectives: [B1.grammar.discourse]
target: 20
