title: ✏️ English G - Mixed Review — Level G
level: G
subject: english
difficulty: 4
objectives:
  - B1.grammar.review
authorNotes: Comprehensive review of Level G topics — passive voice, reported speech, conditionals, modals, relative clauses, wish, linking words, gerunds/infinitives.
repeatAll: 2
example: "Review: She is loved → passive. He said he was tired → reported. If I had money → 2nd conditional."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Grammar Structures Review
    description: Passive, reported speech, conditionals, modals, relative clauses.
    exercises:
      - type: english_phrases
        question: o relatório foi escrito pela equipe (voz passiva)
        correctAnswer: The report was written by the team
        rationale: "Passive past: was/were + pp. The report was written by the team."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: ela disse que estava com fome (discurso indireto)
        correctAnswer: She said that she was hungry
        rationale: "Reported speech: is → was. She said (that) she was hungry."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: se eu fosse rico, viajaria o mundo (2ª condicional)
        correctAnswer: If I were rich, I would travel the world
        rationale: "2nd conditional: if + past → would + base verb. Were (not was) formal."
        difficulty: 3
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: você deveria se desculpar com ele
        correctAnswer: You should apologise to him
        rationale: "'Should' = conselho. You should + base verb. Apologise (formal)."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: a mulher que mora ao lado é médica (cláusula relativa)
        correctAnswer: The woman who lives next door is a doctor
        rationale: "Relative clause with 'who' for people. The woman who lives next door."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: eu gostaria de ter estudado mais (arrependimento)
        correctAnswer: I wish I had studied more
        rationale: "Wish + past perfect = arrependimento passado."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: apesar de estar cansada, ela terminou o trabalho
        correctAnswer: Despite being tired, she finished the work
        rationale: "'Despite' + gerúndio = apesar de. Contrast linking."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: eu parei de fumar há dois anos (ação concluída)
        correctAnswer: I stopped smoking two years ago
        rationale: "'Stop + ing' = parar de fazer. Stopped smoking (not 'to smoke')."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: se eu tivesse estudado, teria passado (3ª condicional)
        correctAnswer: If I had studied, I would have passed
        rationale: "3rd conditional: if + past perfect → would have + pp."
        difficulty: 3
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: o paciente deve ser operado amanhã (voz passiva — obrigação)
        correctAnswer: The patient must be operated on tomorrow
        rationale: "Modal passive: must + be + pp. Must be operated on."
        difficulty: 3
        objectives: [B1.grammar.review]
  - pageNumber: 2
    title: Vocabulary & Skills Review
    description: Phrasal verbs, quantifiers, discourse markers, register.
    exercises:
      - type: english_phrases
        question: ela desistiu de aprender guitarra (phrasal verb)
        correctAnswer: She gave up learning guitar
        rationale: "'Give up' + gerúndio = desistir de. Inseparable phrasal verb."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: há muitas pessoas mas pouca comida
        correctAnswer: There are many people but little food
        rationale: "Many + countable; little + uncountable. Key quantifier contrast."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: o projeto falhou. Por isso, precisamos replanejar. (conectivo de resultado)
        correctAnswer: The project failed. Therefore, we need to replan.
        rationale: "'Therefore' = portanto. Formal result discourse marker."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: como você diz 'comprar' formalmente numa carta de negócios?
        correctAnswer: Purchase
        rationale: "Formal register: purchase (not buy), receive (not get), require (not need)."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: nadar toda manhã é muito saudável (gerúndio como sujeito)
        correctAnswer: Swimming every morning is very healthy
        rationale: "Gerund as subject: Swimming (not 'to swim') is very healthy."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: o avião decolou às 8h (phrasal verb)
        correctAnswer: The plane took off at 8 o'clock
        rationale: "'Take off' = decolar. The plane took off at 8 o'clock."
        difficulty: 1
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: o livro que ele escreveu vendeu muito (cláusula relativa)
        correctAnswer: The book that he wrote sold very well
        rationale: "Relative clause with 'that' for things. The book that he wrote."
        difficulty: 2
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: eu me lembro de te ver na festa (memória do passado)
        correctAnswer: I remember seeing you at the party
        rationale: "'Remember + ing' = lembrar de algo que aconteceu no passado."
        difficulty: 3
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: se ao menos eu tivesse chegado mais cedo!
        correctAnswer: If only I had arrived earlier!
        rationale: "If only + past perfect = arrependimento enfático."
        difficulty: 3
        objectives: [B1.grammar.review]
      - type: english_phrases
        question: não só ela cantou, como também dançou
        correctAnswer: Not only did she sing, but she also danced
        rationale: "'Not only... but also' + inversão após 'not only'. Emphatic addition."
        difficulty: 3
        objectives: [B1.grammar.review]
target: 20
