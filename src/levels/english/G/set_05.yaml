title: English G - Past Continuous — Affirmative
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.past_continuous
authorNotes: Was/were + verb-ing. Action in progress in the past; often interrupted by another action.
repeatAll: 2
example: Eu estava estudando → I was studying
pages:
  - pageNumber: 1
    title: Was / Were + -ing
    description: Ongoing past actions.
    exercises:
      - type: english_phrases
        question: Eu estava estudando
        correctAnswer: i was studying
        rationale: "Pano de fundo: 'I was cooking when she called'."
      - type: english_phrases
        question: Ela estava cozinhando
        correctAnswer: she was cooking
        rationale: "'When + past simple' interrompe o continuous."
      - type: english_phrases
        question: Eles estavam correndo
        correctAnswer: they were running
        rationale: "I/he/she/it + was; you/we/they + were."
      - type: english_phrases
        question: Estava chovendo
        correctAnswer: it was raining
        rationale: "Marcadores: at 8 p.m. yesterday, all day."
      - type: english_phrases
        question: Nós estávamos falando
        correctAnswer: we were talking
        rationale: "Não use com verbos de estado."
      - type: english_phrases
        question: Ele estava dirigindo
        correctAnswer: he was driving
        rationale: "I/he/she/it + was; you/we/they + were."
      - type: english_phrases
        question: Você estava dormindo
        correctAnswer: you were sleeping
        rationale: "Marcadores: at 8 p.m. yesterday, all day."
      - type: english_phrases
        question: Eu estava lendo
        correctAnswer: i was reading
        rationale: "Não use com verbos de estado."
      - type: english_phrases
        question: Ela estava assistindo
        correctAnswer: she was watching
        rationale: "Sem 'be' não há past continuous."
      - type: english_phrases
        question: Estávamos comemorando
        correctAnswer: we were celebrating
        rationale: "Ação em progresso no passado."
  - pageNumber: 2
    title: Interrupted Actions
    description: Use 'when' to mark the interrupting event.
    exercises:
      - type: english_phrases
        question: Eu dormia quando ele ligou
        correctAnswer: i was sleeping when he called
        rationale: "'When + past simple' interrompe o continuous."
      - type: english_phrases
        question: Ela cozinhava quando cheguei
        correctAnswer: she was cooking when i arrived
        rationale: "Pano de fundo: 'I was cooking when she called'."
      - type: english_phrases
        question: Eles viajavam quando começou
        correctAnswer: they were traveling when it started
        rationale: "I/he/she/it + was; you/we/they + were."
      - type: english_phrases
        question: Chovia quando saímos
        correctAnswer: it was raining when we left
        rationale: "Não use com verbos de estado."
      - type: english_phrases
        question: Eu lia quando você me viu
        correctAnswer: i was reading when you saw me
        rationale: "Sem 'be' não há past continuous."
      - type: english_phrases
        question: Eles jogavam quando o telefone tocou
        correctAnswer: they were playing when the phone rang
        rationale: "I/he/she/it + was; you/we/they + were."
      - type: english_phrases
        question: Nós assistíamos TV quando ele chegou
        correctAnswer: we were watching tv when he arrived
        rationale: "Plano interrompido: 'They were leaving but...'."
      - type: english_phrases
        question: Você estudava enquanto eu cozinhava
        correctAnswer: you were studying while i was cooking
        rationale: "Past continuous: was/were + verbo-ing."
      - type: english_phrases
        question: Enquanto eles conversavam, eu dormia
        correctAnswer: while they were talking i was sleeping
        rationale: "'When + past simple' interrompe o continuous."
      - type: english_phrases
        question: Ela escrevia quando a luz apagou
        correctAnswer: she was writing when the light went out
        rationale: "I/he/she/it + was; you/we/they + were."
target: 20
