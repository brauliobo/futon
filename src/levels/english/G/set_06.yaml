title: English G - Past Continuous — Negatives & Questions
level: G
subject: english
difficulty: 3
objectives: [B1.grammar.past_continuous, B1.grammar.questions]
authorNotes: Wasn't / weren't + -ing; Was/Were + subject + -ing. Wh-word goes first.
repeatAll: 2
example: "Eu não estava dormindo → I was not sleeping"
pages:
  - pageNumber: 1
    title: Negatives
    description: Insert 'not' between was/were and -ing.
    exercises:
      - { type: english_phrases, question: "Eu não estava dormindo", correctAnswer: i was not sleeping }
      - { type: english_phrases, question: "Ela não estava me ouvindo", correctAnswer: she was not listening to me }
      - { type: english_phrases, question: "Eles não estavam trabalhando", correctAnswer: they were not working }
      - { type: english_phrases, question: "Não estava chovendo", correctAnswer: it was not raining }
      - { type: english_phrases, question: "Nós não estávamos esperando", correctAnswer: we were not waiting }
      - { type: english_phrases, question: "Ele não estava mentindo", correctAnswer: he was not lying }
      - { type: english_phrases, question: "Você não estava prestando atenção", correctAnswer: you were not paying attention }
      - { type: english_phrases, question: "Eu não estava com raiva", correctAnswer: i was not angry }
      - { type: english_phrases, question: "Ela não estava cantando", correctAnswer: she was not singing }
      - { type: english_phrases, question: "Não estávamos dirigindo rápido", correctAnswer: we were not driving fast }
  - pageNumber: 2
    title: Questions
    description: Yes/no and wh- questions.
    exercises:
      - { type: english_phrases, question: "Você estava ouvindo?", correctAnswer: were you listening }
      - { type: english_phrases, question: "Ela estava chorando?", correctAnswer: was she crying }
      - { type: english_phrases, question: "Eles estavam esperando?", correctAnswer: were they waiting }
      - { type: english_phrases, question: "O que você estava fazendo?", correctAnswer: what were you doing }
      - { type: english_phrases, question: "Onde ela estava indo?", correctAnswer: where was she going }
      - { type: english_phrases, question: "Por que ele estava correndo?", correctAnswer: why was he running }
      - { type: english_phrases, question: "Estava chovendo quando saiu?", correctAnswer: was it raining when you left }
      - { type: english_phrases, question: "Como eles estavam se sentindo?", correctAnswer: how were they feeling }
      - { type: english_phrases, question: "Quem estava cozinhando?", correctAnswer: who was cooking }
      - { type: english_phrases, question: "Vocês estavam estudando juntos?", correctAnswer: were you studying together }
target: 20
