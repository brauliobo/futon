title: 📝 English G - Past Continuous — Negatives & Questions
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.past_continuous
  - B1.grammar.questions
authorNotes: Wasn't / weren't + -ing; Was/Were + subject + -ing. Wh-word goes first.
repeatAll: 2
example: Eu não estava dormindo → I was not sleeping
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Negatives
    description: Insert 'not' between was/were and -ing.
    exercises:
      - type: english_phrases
        question: Eu não estava dormindo
        correctAnswer: I was not sleeping
        rationale: "'I was not' + 'sleeping'. Contração: 'wasn't'."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Ela não estava me ouvindo
        correctAnswer: She was not listening to me
        rationale: "'Listen to me' (preposição 'to'). 'She was not' (3ª pessoa)."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Eles não estavam trabalhando
        correctAnswer: They were not working
        rationale: "'They were not' (plural → were). Contração: 'weren't'."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Não estava chovendo
        correctAnswer: It was not raining
        rationale: "Clima com 'it'. 'It was not raining' → 'it wasn't raining'."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Nós não estávamos esperando
        correctAnswer: We were not waiting
        rationale: "'We were not waiting' — plural + 'were' + 'not' + verbo-ing."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Ele não estava mentindo
        correctAnswer: He was not lying
        rationale: "'Lie' → 'lying' (ie → ying). 'He was not' (3ª pessoa)."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Você não estava prestando atenção
        correctAnswer: You were not paying attention
        rationale: "'You were' + 'not paying attention' (expressão fixa)."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Eu não estava com raiva
        correctAnswer: I was not angry
        rationale: "'Be angry' = estar com raiva (adjetivo). 'I was not angry'."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Ela não estava cantando
        correctAnswer: She was not singing
        rationale: "'She was not singing' — 'sing' + ing. 3ª pessoa → 'was'."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Não estávamos dirigindo rápido
        correctAnswer: We were not driving fast
        rationale: "'Drive' → 'driving' (drop e). 'Fast' advérbio ao final."
        difficulty: 2
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
  - pageNumber: 2
    title: Questions
    description: Yes/no and wh- questions.
    exercises:
      - type: english_phrases
        question: Você estava ouvindo?
        correctAnswer: Were you listening
        rationale: "'Were you listening?' — inversão 'were' + 'you' + verbo-ing."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Ela estava chorando?
        correctAnswer: Was she crying
        rationale: "'Was she crying?' — 3ª pessoa → 'was'. 'Cry' → 'crying'."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Eles estavam esperando?
        correctAnswer: Were they waiting
        rationale: "'Were they waiting?' — plural → 'were'. Inversão padrão."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: O que você estava fazendo?
        correctAnswer: What were you doing
        rationale: "'What were you doing?' — Wh + were + sujeito + -ing."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Onde ela estava indo?
        correctAnswer: Where was she going
        rationale: "'Where was she going?' — 3ª pessoa → 'was'. 'Go' → 'going'."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Por que ele estava correndo?
        correctAnswer: Why was he running
        rationale: "'Why was he running?' — 'run' dobra 'n'. 3ª pessoa → 'was'."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Estava chovendo quando saiu?
        correctAnswer: Was it raining when you left
        rationale: "'Was it raining when you left?' — continuous + past simple."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Como eles estavam se sentindo?
        correctAnswer: How were they feeling
        rationale: "'How were they feeling?' — plural 'were'. 'Feel' + ing."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Quem estava cozinhando?
        correctAnswer: Who was cooking
        rationale: "'Who' (sujeito) → 'was' (3ª pessoa padrão). 'Cook' + ing."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
      - type: english_phrases
        question: Vocês estavam estudando juntos?
        correctAnswer: Were you studying together
        rationale: "'You' (plural) → 'were'. 'Together' ao final."
        difficulty: 3
        objectives: [B1.grammar.past_continuous, B1.grammar.questions]
target: 20
