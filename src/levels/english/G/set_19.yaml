title: ✏️ English G - Writing — Formal Email & Letter
level: G
subject: english
difficulty: 4
objectives:
  - B1.writing.formal
authorNotes: Formal email structure — subject, greeting, opening, body paragraphs, closing, sign-off. Formal vs informal register; linking paragraphs; standard phrases.
repeatAll: 2
example: Dear Mr Smith → formal greeting. I am writing to enquire about... → formal opening. Yours sincerely / Yours faithfully → closing.
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Formal Email — Structure & Register
    description: Greetings, openings, closings and formal phrases.
    exercises:
      - type: english_phrases
        question: como começar um email formal para alguém cujo nome você sabe?
        correctAnswer: Dear Mr Smith,
        rationale: "'Dear + title + surname' = abertura formal quando o nome é conhecido."
        difficulty: 1
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como começar quando você não sabe o nome da pessoa?
        correctAnswer: Dear Sir or Madam,
        rationale: "'Dear Sir or Madam' = abertura formal quando o nome é desconhecido."
        difficulty: 1
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como abrir um email formal de reclamação?
        correctAnswer: I am writing to complain about the service I received
        rationale: "'I am writing to + infinitive' = abertura padrão de email formal."
        difficulty: 2
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como pedir informações formalmente por email?
        correctAnswer: I am writing to enquire about the available positions
        rationale: "'Enquire about' = solicitar informação formalmente."
        difficulty: 2
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como encerrar um email formal quando você sabe o nome do destinatário?
        correctAnswer: Yours sincerely,
        rationale: "'Yours sincerely' = fechamento quando nome é conhecido. (Dear Mr X → Yours sincerely)"
        difficulty: 2
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como encerrar quando usou 'Dear Sir or Madam'?
        correctAnswer: Yours faithfully,
        rationale: "'Yours faithfully' = com 'Dear Sir or Madam'. Rule: no name → faithfully."
        difficulty: 2
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como dizer 'por favor encontre em anexo' formalmente?
        correctAnswer: Please find attached the required documents
        rationale: "'Please find attached' = fórmula formal para anexo."
        difficulty: 3
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como agradecer pelo email recebido formalmente?
        correctAnswer: Thank you for your email of 20th April
        rationale: "Agradecimento formal com referência à data do email recebido."
        difficulty: 2
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como dizer 'aguardo sua resposta' formalmente?
        correctAnswer: I look forward to hearing from you
        rationale: "'Look forward to + ing' = expressão formal de expectativa de resposta."
        difficulty: 2
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como pedir desculpas formalmente por um atraso?
        correctAnswer: I apologise for the delay in responding to your email
        rationale: "'I apologise for' = desculpa formal (British English: apologise)."
        difficulty: 3
        objectives: [B1.writing.formal]
  - pageNumber: 2
    title: Formal Letter — Purpose & Paragraphs
    description: Writing formal letters for different purposes with appropriate structure.
    exercises:
      - type: english_phrases
        question: qual o propósito do primeiro parágrafo de uma carta formal?
        correctAnswer: To state the reason for writing
        rationale: "Parágrafo 1 = propósito da carta. State why you are writing."
        difficulty: 1
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como começar o parágrafo principal numa carta de candidatura?
        correctAnswer: I am applying for the position of assistant advertised in the Guardian
        rationale: "Job application opening: I am applying for + position + source of advert."
        difficulty: 3
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como mencionar experiência prévia formalmente?
        correctAnswer: I have considerable experience in customer service
        rationale: "'I have experience in' = forma formal de mencionar experiência."
        difficulty: 2
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como referir a um documento enviado anteriormente?
        correctAnswer: With reference to your letter of 15th March
        rationale: "'With reference to' = referência formal a correspondência anterior."
        difficulty: 3
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como dizer que algo foi feito como solicitado?
        correctAnswer: As requested, I am sending you the updated report
        rationale: "'As requested' = conforme solicitado. Formal acknowledgement."
        difficulty: 2
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como expressar disponibilidade para entrevista formalmente?
        correctAnswer: I would be available for an interview at your convenience
        rationale: "'At your convenience' = quando for conveniente para você. Formal flexibility."
        difficulty: 3
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como substituir 'get' em um email formal?
        correctAnswer: Use 'receive' instead of 'get'
        rationale: "Formal register: receive (not get), purchase (not buy), require (not need)."
        difficulty: 2
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como dizer 'me avise' formalmente?
        correctAnswer: Please do not hesitate to contact me if you require further information
        rationale: "'Please do not hesitate to contact me' = fórmula formal de disponibilidade."
        difficulty: 3
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como expressar um pedido formal de forma educada?
        correctAnswer: I would be grateful if you could send me the catalogue
        rationale: "'I would be grateful if you could' = pedido educado e formal."
        difficulty: 3
        objectives: [B1.writing.formal]
      - type: english_phrases
        question: como dizer 'em nome da empresa' formalmente?
        correctAnswer: On behalf of the company, I would like to apologise
        rationale: "'On behalf of' = em nome de. Formal representation phrase."
        difficulty: 2
        objectives: [B1.writing.formal]
target: 20
