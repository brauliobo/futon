title: ✏️ English G - Passive Voice — Present & Past
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.passive
authorNotes: Passive voice with be + past participle. Present simple passive (is/are + pp), past simple passive (was/were + pp). By-phrase optional.
repeatAll: 2
example: Eles constroem casas → Houses are built / Eles construíram a ponte → The bridge was built
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Present Simple Passive
    description: is/are + past participle.
    exercises:
      - type: english_phrases
        question: o inglês é falado em todo o mundo
        correctAnswer: English is spoken all over the world
        rationale: "Is + spoken (pp de speak). Passiva presente simples."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: esses carros são fabricados no Brasil
        correctAnswer: These cars are made in Brazil
        rationale: "Are + made (pp de make). Passiva presente com 'are' (plural)."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: o correio é entregue todo dia
        correctAnswer: The mail is delivered every day
        rationale: "Is + delivered (regular pp). Passiva presente."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: os ingressos são vendidos online
        correctAnswer: The tickets are sold online
        rationale: "Are + sold (pp de sell). Passiva presente com 'are'."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: esse produto não é feito aqui
        correctAnswer: This product is not made here
        rationale: "Is not + pp. Passiva negativa presente."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: onde esse carro é montado? (pergunta)
        correctAnswer: Where is this car assembled?
        rationale: "Where + is + subject + pp? Pergunta na passiva presente."
        difficulty: 3
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: o museu é visitado por milhares de turistas
        correctAnswer: The museum is visited by thousands of tourists
        rationale: "Is + visited + by. 'By' introduz o agente na passiva."
        difficulty: 3
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: três refeições são servidas por dia
        correctAnswer: Three meals are served per day
        rationale: "Are + served. Passiva presente plural."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: essa língua é falada por poucos
        correctAnswer: This language is spoken by few people
        rationale: "Is + spoken + by. Agente introduzido por 'by'."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: os e-mails são verificados de manhã
        correctAnswer: The emails are checked in the morning
        rationale: "Are + checked. Hábito na passiva presente."
        difficulty: 2
        objectives: [B1.grammar.passive]
  - pageNumber: 2
    title: Past Simple Passive
    description: was/were + past participle.
    exercises:
      - type: english_phrases
        question: a ponte foi construída em 1950
        correctAnswer: The bridge was built in 1950
        rationale: "Was + built (pp de build). Passiva passado singular."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: os documentos foram perdidos
        correctAnswer: The documents were lost
        rationale: "Were + lost (pp de lose). Passiva passado plural."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: esse livro foi escrito por Machado de Assis
        correctAnswer: This book was written by Machado de Assis
        rationale: "Was + written + by (agente). Passiva passado com agente."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: ela foi convidada para a festa
        correctAnswer: She was invited to the party
        rationale: "Was + invited. Passiva passado — ação feita por alguém não especificado."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: os ladrões foram presos pela polícia
        correctAnswer: The thieves were arrested by the police
        rationale: "Were + arrested + by. Passiva passado com agente."
        difficulty: 3
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: quando foi construída essa igreja? (pergunta)
        correctAnswer: When was this church built?
        rationale: "When + was + subject + pp? WH-question passiva passado."
        difficulty: 3
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: o prêmio não foi dado para ele
        correctAnswer: The prize was not given to him
        rationale: "Was not + given. Passiva negativa passado."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: muitas pessoas foram afetadas pela crise
        correctAnswer: Many people were affected by the crisis
        rationale: "Were + affected + by. Passiva passado plural com agente."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: a decisão foi tomada ontem
        correctAnswer: The decision was made yesterday
        rationale: "Was + made. Passiva passado sem agente."
        difficulty: 2
        objectives: [B1.grammar.passive]
      - type: english_phrases
        question: esse restaurante foi fechado no ano passado
        correctAnswer: This restaurant was closed last year
        rationale: "Was + closed. Passiva passado regular."
        difficulty: 2
        objectives: [B1.grammar.passive]
target: 20
