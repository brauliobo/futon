title: English G - Past Participles
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.past_participle
authorNotes: Regular past participles end in -ed. Core irregulars — been, had, done, gone, seen, gotten, taken, given.
repeatAll: 2
example: Trabalhado → worked / Visto → seen
pages:
  - pageNumber: 1
    title: Regular Past Participles
    description: Same as past simple — add -ed.
    exercises:
      - type: english_phrases
        question: trabalhado
        correctAnswer: worked
        rationale: "Regular: verbo + ed. Work → worked."
      - type: english_phrases
        question: estudado
        correctAnswer: studied
        rationale: "Seen, done, gone, been — particípios comuns."
      - type: english_phrases
        question: jogado
        correctAnswer: played
        rationale: "Final y consonantal: y → i + ed. Study → studied."
      - type: english_phrases
        question: vivido
        correctAnswer: lived
        rationale: "Broke/broken, drive/driven, write/written."
      - type: english_phrases
        question: viajado
        correctAnswer: traveled
        rationale: "Duplicação: stop → stopped, plan → planned."
      - type: english_phrases
        question: visitado
        correctAnswer: visited
        rationale: "Não confunda passado simples com particípio em irregulares."
      - type: english_phrases
        question: assistido (to watch)
        correctAnswer: watched
        rationale: "Seen, done, gone, been — particípios comuns."
      - type: english_phrases
        question: gostado
        correctAnswer: liked
        rationale: "Final -e: +d. Live → lived."
      - type: english_phrases
        question: querido (to want)
        correctAnswer: wanted
        rationale: "Não confunda passado simples com particípio em irregulares."
      - type: english_phrases
        question: fechado
        correctAnswer: closed
        rationale: "Final y consonantal: y → i + ed. Study → studied."
  - pageNumber: 2
    title: Irregular Past Participles
    description: High-frequency irregulars used in perfect tenses.
    exercises:
      - type: english_phrases
        question: sido (to be)
        correctAnswer: been
        rationale: "Final -e: +d. Live → lived."
      - type: english_phrases
        question: tido (to have)
        correctAnswer: had
        rationale: "Final y consonantal: y → i + ed. Study → studied."
      - type: english_phrases
        question: feito (to do)
        correctAnswer: done
        rationale: "Particípio aparece em perfect, passive e adjetivo."
      - type: english_phrases
        question: ido (to go)
        correctAnswer: gone
        rationale: "Duplicação: stop → stopped, plan → planned."
      - type: english_phrases
        question: visto (to see)
        correctAnswer: seen
        rationale: "'Been' é particípio de 'be', não de 'go'."
      - type: english_phrases
        question: pego (to get)
        correctAnswer: gotten
        rationale: "Seen, done, gone, been — particípios comuns."
      - type: english_phrases
        question: tomado (to take)
        correctAnswer: taken
        rationale: "Regular: verbo + ed. Work → worked."
      - type: english_phrases
        question: dado (to give)
        correctAnswer: given
        rationale: "Irregulares: decorar. Go/went/gone."
      - type: english_phrases
        question: comido (to eat)
        correctAnswer: eaten
        rationale: "Final -e: +d. Live → lived."
      - type: english_phrases
        question: bebido (to drink)
        correctAnswer: drunk
        rationale: "Não confunda passado simples com particípio em irregulares."
target: 20
