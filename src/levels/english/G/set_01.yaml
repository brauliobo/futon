title: 📝 English G - Past Participles
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.past_participle
authorNotes: Regular past participles end in -ed. Core irregulars — been, had, done, gone, seen, gotten, taken, given.
repeatAll: 2
example: Trabalhado → worked / Visto → seen
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Regular Past Participles
    description: Same as past simple — add -ed.
    exercises:
      - type: english_phrases
        question: trabalhado
        correctAnswer: worked
        rationale: "'Work' + ed = 'worked' (particípio regular)."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: estudado
        correctAnswer: studied
        rationale: "'Study' — consoante + y → y vira i + ed = 'studied'."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: jogado
        correctAnswer: played
        rationale: "'Play' — vogal + y → mantém y + ed = 'played'."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: vivido
        correctAnswer: lived
        rationale: "'Live' termina em -e → só +d = 'lived'."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: viajado
        correctAnswer: traveled
        rationale: "'Travel' (AmE) → 'traveled' com 1 'l'. BrE: 'travelled'."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: visitado
        correctAnswer: visited
        rationale: "'Visit' + ed = 'visited'. Sílaba átona: não dobra o 't'."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: assistido (to watch)
        correctAnswer: watched
        rationale: "'Watch' + ed = 'watched'. Pronúncia do -ed: /t/ após /tʃ/."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: gostado
        correctAnswer: liked
        rationale: "'Like' termina em -e → só +d = 'liked'."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: querido (to want)
        correctAnswer: wanted
        rationale: "'Want' + ed = 'wanted'. Final /t/ cria sílaba: /ˈwɒntɪd/."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: fechado
        correctAnswer: closed
        rationale: "'Close' termina em -e → só +d = 'closed'."
        difficulty: 2
        objectives: [B1.grammar.past_participle]
  - pageNumber: 2
    title: Irregular Past Participles
    description: High-frequency irregulars used in perfect tenses.
    exercises:
      - type: english_phrases
        question: sido (to be)
        correctAnswer: been
        rationale: "'Be' → 'been' (particípio irregular). Usa-se em perfect tenses."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: tido (to have)
        correctAnswer: had
        rationale: "'Have' → 'had' (passado e particípio iguais)."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: feito (to do)
        correctAnswer: done
        rationale: "'Do' → 'done' (particípio irregular). Past = 'did'."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: ido (to go)
        correctAnswer: gone
        rationale: "'Go' → 'gone' (particípio). Past = 'went'. Três formas distintas."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: visto (to see)
        correctAnswer: seen
        rationale: "'See' → 'seen' (particípio irregular). Past = 'saw'."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: pego (to get)
        correctAnswer: gotten
        rationale: "'Get' → 'gotten' (AmE) ou 'got' (BrE). Past = 'got'."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: tomado (to take)
        correctAnswer: taken
        rationale: "'Take' → 'taken' (particípio). Past = 'took'."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: dado (to give)
        correctAnswer: given
        rationale: "'Give' → 'given' (particípio). Past = 'gave'."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: comido (to eat)
        correctAnswer: eaten
        rationale: "'Eat' → 'eaten' (particípio). Past = 'ate'."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
      - type: english_phrases
        question: bebido (to drink)
        correctAnswer: drunk
        rationale: "'Drink' → 'drunk' (particípio). Past = 'drank'."
        difficulty: 3
        objectives: [B1.grammar.past_participle]
target: 20
