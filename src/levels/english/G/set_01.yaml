      - type: english_phrases
        question: fechado
        correctAnswer: closed
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Irregular Past Participles
    description: High-frequency irregulars used in perfect tenses.
    exercises:
      - type: english_phrases
        question: sido (to be)
        correctAnswer: been
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
