title: English G - Past Participles
level: G
subject: english
difficulty: 3
objectives: [B1.grammar.past_participle]
authorNotes: Regular past participles end in -ed. Core irregulars — been, had, done, gone, seen, gotten, taken, given.
repeatAll: 2
example: "Trabalhado → worked / Visto → seen"
pages:
  - pageNumber: 1
    title: Regular Past Participles
    description: Same as past simple — add -ed.
    exercises:
      - { type: english_phrases, question: "trabalhado", correctAnswer: worked }
      - { type: english_phrases, question: "estudado", correctAnswer: studied }
      - { type: english_phrases, question: "jogado", correctAnswer: played }
      - { type: english_phrases, question: "vivido", correctAnswer: lived }
      - { type: english_phrases, question: "viajado", correctAnswer: traveled }
      - { type: english_phrases, question: "visitado", correctAnswer: visited }
      - { type: english_phrases, question: "assistido (to watch)", correctAnswer: watched }
      - { type: english_phrases, question: "gostado", correctAnswer: liked }
      - { type: english_phrases, question: "querido (to want)", correctAnswer: wanted }
      - { type: english_phrases, question: "fechado", correctAnswer: closed }
  - pageNumber: 2
    title: Irregular Past Participles
    description: High-frequency irregulars used in perfect tenses.
    exercises:
      - { type: english_phrases, question: "sido (to be)", correctAnswer: been }
      - { type: english_phrases, question: "tido (to have)", correctAnswer: had }
      - { type: english_phrases, question: "feito (to do)", correctAnswer: done }
      - { type: english_phrases, question: "ido (to go)", correctAnswer: gone }
      - { type: english_phrases, question: "visto (to see)", correctAnswer: seen }
      - { type: english_phrases, question: "pego (to get)", correctAnswer: gotten }
      - { type: english_phrases, question: "tomado (to take)", correctAnswer: taken }
      - { type: english_phrases, question: "dado (to give)", correctAnswer: given }
      - { type: english_phrases, question: "comido (to eat)", correctAnswer: eaten }
      - { type: english_phrases, question: "bebido (to drink)", correctAnswer: drunk }
target: 20
