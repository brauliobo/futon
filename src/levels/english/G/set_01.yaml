title: English G - Past Participles
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.past_participle
authorNotes: Regular past participles end in -ed. Core irregulars — been, had, done, gone, seen, gotten, taken, given.
repeatAll: 2
example: Trabalhado → worked / Visto → seen
pages:
  - pageNumber: 1
    title: Regular Past Participles
    description: Same as past simple — add -ed.
    exercises:
      - type: english_phrases
        question: trabalhado
        correctAnswer: worked
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: estudado
        correctAnswer: studied
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: jogado
        correctAnswer: played
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: vivido
        correctAnswer: lived
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: viajado
        correctAnswer: traveled
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: visitado
        correctAnswer: visited
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: assistido (to watch)
