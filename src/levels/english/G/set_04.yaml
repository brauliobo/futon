title: English G - For vs Since
level: G
subject: english
difficulty: 3
objectives: [B1.grammar.present_perfect]
authorNotes: "'for' + duration (for two years); 'since' + starting point (since 2020). Typical with present perfect."
repeatAll: 2
example: "Faz dois anos → for two years / Desde 2020 → since 2020"
pages:
  - pageNumber: 1
    title: For + Duration
    description: Length of time — two hours, a week, years.
    exercises:
      - { type: english_phrases, question: "Moro aqui há dois anos", correctAnswer: i have lived here for two years }
      - { type: english_phrases, question: "Ela trabalha aqui há seis meses", correctAnswer: she has worked here for six months }
      - { type: english_phrases, question: "Nós esperamos por uma hora", correctAnswer: we have waited for an hour }
      - { type: english_phrases, question: "Eles se conhecem há dez anos", correctAnswer: they have known each other for ten years }
      - { type: english_phrases, question: "Eu estudo inglês há muito tempo", correctAnswer: i have studied english for a long time }
      - { type: english_phrases, question: "Ele dorme há três horas", correctAnswer: he has slept for three hours }
      - { type: english_phrases, question: "Não a vejo há dias", correctAnswer: i have not seen her for days }
      - { type: english_phrases, question: "Somos amigos há toda a vida", correctAnswer: we have been friends for a lifetime }
      - { type: english_phrases, question: "Ela toca piano há vinte anos", correctAnswer: she has played piano for twenty years }
      - { type: english_phrases, question: "Trabalhamos juntos há pouco", correctAnswer: we have worked together for a short time }
  - pageNumber: 2
    title: Since + Starting Point
    description: Specific time or date the action began.
    exercises:
      - { type: english_phrases, question: "Moro aqui desde 2020", correctAnswer: i have lived here since 2020 }
      - { type: english_phrases, question: "Ela trabalha aqui desde janeiro", correctAnswer: she has worked here since january }
      - { type: english_phrases, question: "Estamos esperando desde às dez", correctAnswer: we have been waiting since ten }
      - { type: english_phrases, question: "Não comi desde o café da manhã", correctAnswer: i have not eaten since breakfast }
      - { type: english_phrases, question: "Não nos vemos desde segunda", correctAnswer: we have not seen each other since monday }
      - { type: english_phrases, question: "Ele mudou desde que você saiu", correctAnswer: he has changed since you left }
      - { type: english_phrases, question: "Não chove desde ontem", correctAnswer: it has not rained since yesterday }
      - { type: english_phrases, question: "Sou professor desde 2015", correctAnswer: i have been a teacher since 2015 }
      - { type: english_phrases, question: "Ela está doente desde terça", correctAnswer: she has been sick since tuesday }
      - { type: english_phrases, question: "Eles estão juntos desde a faculdade", correctAnswer: they have been together since college }
target: 20
