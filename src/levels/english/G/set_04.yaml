title: 📝 English G - For vs Since
level: G
subject: english
difficulty: 3
objectives:
  - B1.grammar.present_perfect
authorNotes: "'for' + duration (for two years); 'since' + starting point (since 2020). Typical with present perfect."
repeatAll: 2
example: Faz dois anos → for two years / Desde 2020 → since 2020
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: For + Duration
    description: Length of time — two hours, a week, years.
    exercises:
      - type: english_phrases
        question: Moro aqui há dois anos
        correctAnswer: I have lived here for two years
        rationale: "'For two years' = duração. 'Have lived' (present perfect)."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Ela trabalha aqui há seis meses
        correctAnswer: She has worked here for six months
        rationale: "'For six months' — 'for' + duração. 'Has' (3ª pessoa)."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Nós esperamos por uma hora
        correctAnswer: We have waited for an hour
        rationale: "'For an hour' — 'an' ('h' mudo). Duração de tempo."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Eles se conhecem há dez anos
        correctAnswer: They have known each other for ten years
        rationale: "'Known' (particípio de know). 'Each other' = um ao outro."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Eu estudo inglês há muito tempo
        correctAnswer: I have studied English for a long time
        rationale: "'For a long time' = há muito tempo (duração sem número)."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Ele dorme há três horas
        correctAnswer: He has slept for three hours
        rationale: "'Slept' (particípio de sleep). 'For three hours' duração."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Não a vejo há dias
        correctAnswer: I have not seen her for days
        rationale: "'For days' = há dias (duração). 'Have not seen' negativa."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Somos amigos há toda a vida
        correctAnswer: We have been friends for a lifetime
        rationale: "'For a lifetime' — 'for' + período. 'Have been friends'."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Ela toca piano há vinte anos
        correctAnswer: She has played piano for twenty years
        rationale: "'For twenty years' duração. 'Played' (+ ed regular)."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Trabalhamos juntos há pouco
        correctAnswer: We have worked together for a short time
        rationale: "'For a short time' = há pouco (duração curta)."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
  - pageNumber: 2
    title: Since + Starting Point
    description: Specific time or date the action began.
    exercises:
      - type: english_phrases
        question: Moro aqui desde 2020
        correctAnswer: I have lived here since 2020
        rationale: "'Since 2020' = desde (ponto no tempo, não duração)."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Ela trabalha aqui desde janeiro
        correctAnswer: She has worked here since January
        rationale: "'Since January' — mês em maiúscula. 'Since' + ponto específico."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Estamos esperando desde às dez
        correctAnswer: We have been waiting since ten
        rationale: "'Since ten' = desde as 10. 'Been waiting' (continuous perfect)."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Não comi desde o café da manhã
        correctAnswer: I have not eaten since breakfast
        rationale: "'Since breakfast' — 'breakfast' é ponto no dia. Sem artigo."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Não nos vemos desde segunda
        correctAnswer: We have not seen each other since Monday
        rationale: "'Since Monday' (dia específico). 'Each other' (recíproco)."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Ele mudou desde que você saiu
        correctAnswer: He has changed since you left
        rationale: "'Since + cláusula com past': 'since you left' (evento passado)."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Não chove desde ontem
        correctAnswer: It has not rained since yesterday
        rationale: "'Since yesterday' — ponto no tempo. Clima com 'it'."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Sou professor desde 2015
        correctAnswer: I have been a teacher since 2015
        rationale: "'Since 2015' + 'have been' (estado contínuo). Profissão com 'a'."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Ela está doente desde terça
        correctAnswer: She has been sick since Tuesday
        rationale: "'Since Tuesday' (dia). 'Been sick' = estar doente (estado)."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: Eles estão juntos desde a faculdade
        correctAnswer: They have been together since college
        rationale: "'Since college' — 'college' sem 'the' quando genérico/etapa."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
target: 20
