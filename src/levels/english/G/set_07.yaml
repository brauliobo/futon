title: English G - Perfect vs Past Simple & Mixed
level: G
subject: english
difficulty: 4
objectives:
  - B1.grammar.present_perfect
  - B1.grammar.past_continuous
authorNotes: Past simple for finished time (yesterday, last week); present perfect for unspecified or open time (ever, never, so far).
repeatAll: 2
example: Vi ele ontem → I saw him yesterday / Já o vi → I have seen him
pages:
  - pageNumber: 1
    title: Past Simple vs Present Perfect
    description: Specific time uses past simple; open time uses present perfect.
    exercises:
      - type: english_phrases
        question: Eu a vi ontem
        correctAnswer: i saw her yesterday
        rationale: "Ação concluída com efeito agora = present perfect."
      - type: english_phrases
        question: Eu já a vi
        correctAnswer: i have seen her
        rationale: "'Yesterday', 'last week' pedem simple past."
      - type: english_phrases
        question: Eles chegaram hoje cedo
        correctAnswer: they arrived this morning
        rationale: "'Already', 'yet', 'ever', 'never' pedem present perfect."
      - type: english_phrases
        question: Eles acabaram de chegar
        correctAnswer: they have just arrived
        rationale: "Past simple = tempo definido; present perfect = indefinido."
      - type: english_phrases
        question: Morei em Paris em 2018
        correctAnswer: i lived in paris in 2018
        rationale: "Narrativa: fundo continuous, fato simples."
      - type: english_phrases
        question: Já morei em Paris
        correctAnswer: i have lived in paris
        rationale: "Past simple usa 2ª coluna; perfect usa 3ª + have."
      - type: english_phrases
        question: Ela estudou na semana passada
        correctAnswer: she studied last week
        rationale: "Decida se o tempo é específico ou indefinido."
      - type: english_phrases
        question: Ela estudou por duas horas (e ainda está estudando)
        correctAnswer: she has studied for two hours
        rationale: "'Have you ever...?' pergunta experiência até agora."
      - type: english_phrases
        question: Ele viajou ano passado
        correctAnswer: he traveled last year
        rationale: "'Already', 'yet', 'ever', 'never' pedem present perfect."
      - type: english_phrases
        question: Ele já viajou muito
        correctAnswer: he has traveled a lot
        rationale: "'Yesterday', 'last week' pedem simple past."
  - pageNumber: 2
    title: Past Continuous vs Past Simple
    description: Continuous for background action; simple for interrupting event.
    exercises:
      - type: english_phrases
        question: Eu lia quando ela ligou
        correctAnswer: i was reading when she called
        rationale: "Past simple usa 2ª coluna; perfect usa 3ª + have."
      - type: english_phrases
        question: Ele caiu enquanto corria
        correctAnswer: he fell while he was running
        rationale: "Decida se o tempo é específico ou indefinido."
      - type: english_phrases
        question: Chovia quando cheguei
        correctAnswer: it was raining when i arrived
        rationale: "Past simple usa 2ª coluna; perfect usa 3ª + have."
      - type: english_phrases
        question: Eles comiam quando toquei a campainha
        correctAnswer: they were eating when i rang the bell
        rationale: "'For + duração' até agora = present perfect."
      - type: english_phrases
        question: Ela cantava e ele dançava
        correctAnswer: she was singing and he was dancing
        rationale: "Past simple = tempo definido; present perfect = indefinido."
      - type: english_phrases
        question: Comecei a estudar quando ela saiu
        correctAnswer: i started studying when she left
        rationale: "Ação concluída com efeito agora = present perfect."
      - type: english_phrases
        question: Dormia quando começou a tempestade
        correctAnswer: i was sleeping when the storm started
        rationale: "Pergunta 'When?' pede past simple."
      - type: english_phrases
        question: Ele escrevia quando perdi a internet
        correctAnswer: he was writing when i lost the internet
        rationale: "'Have you ever...?' pergunta experiência até agora."
      - type: english_phrases
        question: Aprendi inglês quando morei lá
        correctAnswer: i learned english when i lived there
        rationale: "'Yesterday', 'last week' pedem simple past."
      - type: english_phrases
        question: Eu assistia ao jogo quando acabou a energia
        correctAnswer: i was watching the game when the power went out
        rationale: "Narrativa: fundo continuous, fato simples."
target: 20
