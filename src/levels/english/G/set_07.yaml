title: English G - Perfect vs Past Simple & Mixed
level: G
subject: english
difficulty: 4
objectives: [B1.grammar.present_perfect, B1.grammar.past_continuous]
authorNotes: Past simple for finished time (yesterday, last week); present perfect for unspecified or open time (ever, never, so far).
repeatAll: 2
example: "Vi ele ontem → I saw him yesterday / Já o vi → I have seen him"
pages:
  - pageNumber: 1
    title: Past Simple vs Present Perfect
    description: Specific time uses past simple; open time uses present perfect.
    exercises:
      - { type: english_phrases, question: "Eu a vi ontem", correctAnswer: i saw her yesterday }
      - { type: english_phrases, question: "Eu já a vi", correctAnswer: i have seen her }
      - { type: english_phrases, question: "Eles chegaram hoje cedo", correctAnswer: they arrived this morning }
      - { type: english_phrases, question: "Eles acabaram de chegar", correctAnswer: they have just arrived }
      - { type: english_phrases, question: "Morei em Paris em 2018", correctAnswer: i lived in paris in 2018 }
      - { type: english_phrases, question: "Já morei em Paris", correctAnswer: i have lived in paris }
      - { type: english_phrases, question: "Ela estudou na semana passada", correctAnswer: she studied last week }
      - { type: english_phrases, question: "Ela estudou por duas horas (e ainda está estudando)", correctAnswer: she has studied for two hours }
      - { type: english_phrases, question: "Ele viajou ano passado", correctAnswer: he traveled last year }
      - { type: english_phrases, question: "Ele já viajou muito", correctAnswer: he has traveled a lot }
  - pageNumber: 2
    title: Past Continuous vs Past Simple
    description: Continuous for background action; simple for interrupting event.
    exercises:
      - { type: english_phrases, question: "Eu lia quando ela ligou", correctAnswer: i was reading when she called }
      - { type: english_phrases, question: "Ele caiu enquanto corria", correctAnswer: he fell while he was running }
      - { type: english_phrases, question: "Chovia quando cheguei", correctAnswer: it was raining when i arrived }
      - { type: english_phrases, question: "Eles comiam quando toquei a campainha", correctAnswer: they were eating when i rang the bell }
      - { type: english_phrases, question: "Ela cantava e ele dançava", correctAnswer: she was singing and he was dancing }
      - { type: english_phrases, question: "Comecei a estudar quando ela saiu", correctAnswer: i started studying when she left }
      - { type: english_phrases, question: "Dormia quando começou a tempestade", correctAnswer: i was sleeping when the storm started }
      - { type: english_phrases, question: "Ele escrevia quando perdi a internet", correctAnswer: he was writing when i lost the internet }
      - { type: english_phrases, question: "Aprendi inglês quando morei lá", correctAnswer: i learned english when i lived there }
      - { type: english_phrases, question: "Eu assistia ao jogo quando acabou a energia", correctAnswer: i was watching the game when the power went out }
target: 20
