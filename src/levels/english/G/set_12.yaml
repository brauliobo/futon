title: ✏️ English G - Relative Clauses
level: G
subject: english
difficulty: 4
objectives:
  - B1.grammar.relative_clauses
authorNotes: Defining relative clauses (no commas) with who, which, that, where, whose. Non-defining (commas) with who, which, where, whose. Omitting the pronoun when it's the object.
repeatAll: 2
example: "Defining: 'The man who called' → who = the man. Non-defining: 'My sister, who lives in London,' → extra info. Ex.: 'The book that I read' → that = the book."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Defining Relative Clauses
    description: Identifies which person/thing we mean — no commas.
    exercises:
      - type: english_phrases
        question: a pessoa que me ajudou era muito gentil
        correctAnswer: The person who helped me was very kind
        rationale: "Who = pronome relativo para pessoas. Defining (sem vírgula)."
        difficulty: 1
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o livro que eu li era fascinante
        correctAnswer: The book that I read was fascinating
        rationale: "That/which para objetos. Defining relative clause."
        difficulty: 1
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o restaurante onde a gente se encontrou fechou
        correctAnswer: The restaurant where we met has closed
        rationale: "Where = pronome relativo para lugares."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o homem cujo carro foi roubado é meu vizinho
        correctAnswer: The man whose car was stolen is my neighbour
        rationale: "Whose = posse. The man whose car..."
        difficulty: 3
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o aluno que passou na prova ficou muito feliz
        correctAnswer: The student who passed the exam was very happy
        rationale: "Who para pessoas. Defining clause — identifica qual aluno."
        difficulty: 1
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o filme que eu vi ontem foi incrível
        correctAnswer: The film that I saw yesterday was amazing
        rationale: "That (objeto) — pode ser omitido: 'The film I saw'. Relativa de objeto."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o dia em que nos conhecemos foi especial
        correctAnswer: The day when we met was special
        rationale: "When para tempo. The day when we met."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: a mulher que mora ao lado é professora
        correctAnswer: The woman who lives next door is a teacher
        rationale: "Who (sujeito) — pronome obrigatório na relativa de sujeito."
        difficulty: 1
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o livro que ele me deu foi muito útil
        correctAnswer: The book he gave me was very useful
        rationale: "Pronome relativo omitido quando é objeto: 'The book (that/which) he gave me'."
        difficulty: 3
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: a empresa onde ela trabalha fica no centro
        correctAnswer: The company where she works is in the centre
        rationale: "Where para lugares/organizações. Defining clause."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
  - pageNumber: 2
    title: Non-Defining Relative Clauses
    description: Adds extra information — commas used, no 'that'.
    exercises:
      - type: english_phrases
        question: minha irmã, que mora em Londres, é médica
        correctAnswer: My sister, who lives in London, is a doctor
        rationale: "Non-defining: vírgulas ao redor. Extra info sobre a irmã (única)."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o Rio de Janeiro, que fica no sudeste, é famoso
        correctAnswer: Rio de Janeiro, which is in the southeast, is famous
        rationale: "Non-defining para lugares/coisas: which (não 'that'). Com vírgulas."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o professor, cujo livro ganhei, foi generoso
        correctAnswer: The teacher, whose book I received, was generous
        rationale: "Whose em non-defining: posse com vírgulas."
        difficulty: 3
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: Paris, onde morei dois anos, é linda
        correctAnswer: Paris, where I lived for two years, is beautiful
        rationale: "Non-defining com where. Informação extra sobre Paris."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: meu pai, que tem 70 anos, ainda trabalha
        correctAnswer: My father, who is 70 years old, still works
        rationale: "Non-defining: informação adicional sobre o pai (único). Vírgulas."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o show, que durou 3 horas, foi incrível
        correctAnswer: The show, which lasted 3 hours, was incredible
        rationale: "Non-defining com which para objetos/eventos. Informação extra."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: a Amazônia, que cobre metade do Brasil, é vital
        correctAnswer: The Amazon, which covers half of Brazil, is vital
        rationale: "Non-defining: fato adicional sobre a Amazônia. Which + vírgulas."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: ela me ligou, o que foi uma surpresa
        correctAnswer: She called me, which was a surprise
        rationale: "Which referindo-se à oração anterior (não a um substantivo). Uso especial."
        difficulty: 3
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: meu chefe, cujo escritório é enorme, é simpático
        correctAnswer: My boss, whose office is huge, is friendly
        rationale: "Non-defining com whose. Posse com vírgulas."
        difficulty: 3
        objectives: [B1.grammar.relative_clauses]
      - type: english_phrases
        question: o jantar, que preparei ontem, ficou delicioso
        correctAnswer: The dinner, which I prepared yesterday, was delicious
        rationale: "Non-defining: extra info sobre o jantar. Which (não 'that')."
        difficulty: 2
        objectives: [B1.grammar.relative_clauses]
target: 20
