title: 📖 English 1A - Can / Can't
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Modal 'can/can't' para habilidades e permissão — afirmativo, negativo, pergunta.
repeatAll: 2
example: "Ex.: 'I can speak English.' 'She can't swim.' 'Can you help me?'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Can — habilidades
    description: Use 'can' para falar sobre o que você consegue fazer.
    exercises:
      - type: english_vocab
        question: Quais são os usos de 'can' em inglês?
        correctAnswer: ability and permission
        rationale: "'can' = habilidade (I can swim) e permissão (Can I go?)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I ___ speak English.' (consigo)"
        correctAnswer: can
        rationale: "'I can speak English.' — 'can' + verbo base."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'She ___ swim very well.' (consegue)"
        correctAnswer: can
        rationale: "'She can swim very well.' — 'can' não muda para 3ª pessoa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a forma do verbo após 'can'?
        correctAnswer: base form (no -s, no -ing)
        rationale: "'can' + verbo base: can swim, can read, can go. Nunca 'can swims'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'He ___ play guitar.' (consegue — sem -s!)"
        correctAnswer: can
        rationale: "'He can play guitar.' — 'can' não muda. NÃO: 'He cans'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu consigo falar três línguas.' em inglês?
        correctAnswer: I can speak three languages.
        rationale: "'I can speak three languages.' — 'can' + verbo base + objeto."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Birds ___ fly.' (podem voar)"
        correctAnswer: can
        rationale: "'Birds can fly.' — Habilidade natural."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela consegue correr muito rápido.' em inglês?
        correctAnswer: She can run very fast.
        rationale: "'She can run very fast.' — 'can' + base."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'We ___ dance and ___.' (can/sing)"
        correctAnswer: can, sing
        rationale: "'We can dance and sing.' — Dois verbos base após 'can'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu não consigo tocar violão.' em inglês?
        correctAnswer: I can't play guitar.
        rationale: "'I can't play guitar.' — 'can't' = cannot = não consigo."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Can — permissão e perguntas
    description: Use 'can' para pedir permissão e fazer perguntas.
    exercises:
      - type: english_vocab
        question: Como se diz 'Posso ir ao banheiro?' em inglês?
        correctAnswer: Can I go to the bathroom?
        rationale: "'Can I go to the bathroom?' — 'Can I' para pedir permissão."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Você pode me ajudar?' em inglês?
        correctAnswer: Can you help me?
        rationale: "'Can you help me?' — Pedido de ajuda com 'can you'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Can you swim?' — Sim!"
        correctAnswer: Yes, I can.
        rationale: "'Yes, I can.' — Resposta curta afirmativa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Can she drive?' — Não!"
        correctAnswer: No, she can't.
        rationale: "'No, she can't.' — Resposta curta negativa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ I open the window? Yes, you ___.' (permissão)"
        correctAnswer: Can, can
        rationale: "'Can I open the window? Yes, you can.' — Pedido e permissão."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a forma completa de 'can't'?
        correctAnswer: cannot
        rationale: "'can't' = cannot. I cannot fly = I can't fly."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O que você consegue fazer?' em inglês?
        correctAnswer: What can you do?
        rationale: "'What can you do?' — 'What can' para perguntar habilidades."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I ___ swim ___ I ___ fly.' (can/but/can't)"
        correctAnswer: can, but, can't
        rationale: "'I can swim but I can't fly.' — Contraste de habilidades."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela consegue falar inglês e francês.' em inglês?
        correctAnswer: She can speak English and French.
        rationale: "'She can speak English and French.' — Duas línguas."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Podemos jogar lá fora?' em inglês?
        correctAnswer: Can we play outside?
        rationale: "'Can we play outside?' — Pedido de permissão com 'we'."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
