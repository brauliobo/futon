title: ❤️ English 1A - Gostos e preferências
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Expressando gostos, preferências e opiniões com love/like/prefer/hate.
repeatAll: 2
example: "Ex.: 'I prefer cats to dogs.' 'I really like pizza.' 'What about you?'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Gostos com love/like/prefer/hate
    description: Expresse gostos e preferências de forma variada.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu prefiro gatos a cachorros.' em inglês?
        correctAnswer: I prefer cats to dogs.
        rationale: "'I prefer cats to dogs.' — 'prefer A to B' = preferir A a B."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Prefiro nadar a correr.' em inglês?
        correctAnswer: I prefer swimming to running.
        rationale: "'I prefer swimming to running.' — 'prefer + -ing to + -ing'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu realmente gosto de pizza.' em inglês?
        correctAnswer: I really like pizza.
        rationale: "'I really like pizza.' — 'really' reforça o gostar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Não gosto muito de vegetais.' em inglês?
        correctAnswer: I don't like vegetables very much.
        rationale: "'I don't like vegetables very much.' — 'very much' ao final."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'E você?' em inglês? (perguntando a mesma coisa)
        correctAnswer: What about you?
        rationale: "'What about you?' = E você? Convidando a pessoa a compartilhar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu também!' em inglês?
        correctAnswer: Me too!
        rationale: "'Me too!' = Eu também! Para concordar com preferências."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu não!' em inglês? (discordando)
        correctAnswer: Me neither! / I don't!
        rationale: "'Me neither!' = Eu também não! 'I don't!' = Eu não!"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Meu hobby favorito é jogar futebol.' em inglês?
        correctAnswer: My favourite hobby is playing football.
        rationale: "'My favourite hobby is playing football.' — 'playing' gerúndio."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I love ___ but I hate ___.' (reading/cleaning)"
        correctAnswer: reading, cleaning
        rationale: "'I love reading but I hate cleaning.' — Contraste com 'but'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela adora chocolate.' em inglês?
        correctAnswer: She loves chocolate.
        rationale: "'She loves chocolate.' — 'loves' com she."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Opiniões e reações
    description: Dê opiniões e reaja ao que outros dizem.
    exercises:
      - type: english_vocab
        question: Como se diz 'Acho que inglês é fácil.' em inglês?
        correctAnswer: I think English is easy.
        rationale: "'I think English is easy.' — 'I think' = acho que."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Na minha opinião, cães são melhores que gatos.' em inglês?
        correctAnswer: In my opinion, dogs are better than cats.
        rationale: "'In my opinion' = Na minha opinião. 'better than' = melhor que."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Que ótimo!' em inglês?
        correctAnswer: That's great!
        rationale: "'That's great!' = Que ótimo! Reação positiva."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Que pena!' em inglês?
        correctAnswer: What a pity! / That's a shame!
        rationale: "'What a pity!' = Que pena! 'That's a shame!' = Que vergonha/pena!"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Concordo.' em inglês?
        correctAnswer: I agree.
        rationale: "'I agree.' = Concordo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Discordo.' em inglês?
        correctAnswer: I disagree.
        rationale: "'I disagree.' = Discordo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Não sei ao certo.' em inglês?
        correctAnswer: I'm not sure.
        rationale: "'I'm not sure.' = Não sei ao certo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Depende.' em inglês?
        correctAnswer: It depends.
        rationale: "'It depends.' = Depende."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu prefiro o verão ao inverno.' em inglês?
        correctAnswer: I prefer summer to winter.
        rationale: "'I prefer summer to winter.' — 'prefer A to B'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Acho que a primavera é a melhor estação.' em inglês?
        correctAnswer: I think spring is the best season.
        rationale: "'I think spring is the best season.' — 'best' = superlativo de 'good'."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
