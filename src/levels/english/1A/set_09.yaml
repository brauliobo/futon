title: 👋 English 1A - Saudações e despedidas
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Saudações formais e informais, despedidas e expressões sociais em inglês.
repeatAll: 2
example: "Ex.: 'Good morning!' 'How are you?' 'See you tomorrow!'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Saudações
    description: Aprenda diferentes formas de cumprimentar em inglês.
    exercises:
      - type: english_vocab
        question: Como se diz 'Bom dia!' em inglês?
        correctAnswer: Good morning!
        rationale: "'Good morning!' — Usado pela manhã até meio-dia."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Boa tarde!' em inglês?
        correctAnswer: Good afternoon!
        rationale: "'Good afternoon!' — Usado do meio-dia até anoitecer."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Boa noite!' (ao encontrar) em inglês?
        correctAnswer: Good evening!
        rationale: "'Good evening!' — Ao encontrar alguém à noite."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Como você está?' em inglês?
        correctAnswer: How are you?
        rationale: "'How are you?' — Pergunta educada de saúde/bem-estar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'How are you?' — (estou bem, obrigado)"
        correctAnswer: I'm fine, thank you.
        rationale: "'I'm fine, thank you.' — Resposta educada padrão."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'How are you?' — (muito bem!)"
        correctAnswer: Very well, thanks!
        rationale: "'Very well, thanks!' — Resposta positiva."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Tudo bem?' em inglês? (informal)
        correctAnswer: How's it going?
        rationale: "'How's it going?' = Tudo bem? Informal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Há quanto tempo!' em inglês?
        correctAnswer: Long time no see!
        rationale: "'Long time no see!' — Quando você encontra alguém depois de muito tempo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Good ___, Mrs Smith!' (bom dia — de manhã)"
        correctAnswer: morning
        rationale: "'Good morning, Mrs Smith!' — Cumprimento formal de manhã."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Prazer em conhecê-lo.' em inglês?
        correctAnswer: Nice to meet you.
        rationale: "'Nice to meet you.' — Ao conhecer alguém pela primeira vez."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Despedidas e expressões sociais
    description: Aprenda diferentes formas de se despedir em inglês.
    exercises:
      - type: english_vocab
        question: Como se diz 'Tchau! / Até logo!' em inglês?
        correctAnswer: Goodbye! / Bye!
        rationale: "'Goodbye!' (formal) e 'Bye!' (informal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Boa noite!' (ao se despedir) em inglês?
        correctAnswer: Good night!
        rationale: "'Good night!' — Ao se despedir à noite ou antes de dormir."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Até amanhã!' em inglês?
        correctAnswer: See you tomorrow!
        rationale: "'See you tomorrow!' — 'see you' = até ver você."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Até logo!' em inglês?
        correctAnswer: See you later!
        rationale: "'See you later!' — 'later' = mais tarde."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Cuide-se!' em inglês?
        correctAnswer: Take care!
        rationale: "'Take care!' — Expressão de carinho ao se despedir."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Tenha um bom dia!' em inglês?
        correctAnswer: Have a good day!
        rationale: "'Have a good day!' — Desejo ao se despedir de manhã."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se responde 'Thank you!' em inglês?
        correctAnswer: You're welcome!
        rationale: "'You're welcome!' = De nada! Resposta a agradecimentos."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Com licença.' (passando) em inglês?
        correctAnswer: Excuse me.
        rationale: "'Excuse me.' — Para passar, chamar atenção ou pedir desculpa."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Desculpe.' (erro) em inglês?
        correctAnswer: Sorry.
        rationale: "'Sorry.' — Para pedir desculpa por um erro."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Monte um mini-diálogo de cumprimento e despedida
        correctAnswer: Hi! How are you? I'm fine, thanks. See you later! Bye!
        rationale: "Diálogo: cumprimento → perguntar bem-estar → responder → despedida."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
