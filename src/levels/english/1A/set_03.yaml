title: ✨ English 1A - Adjetivo + substantivo
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Combinações de adjetivo + substantivo em inglês — ordem correta, antes do substantivo.
repeatAll: 2
example: "Ex.: 'a big red ball' 'a nice old man' 'a beautiful white cat'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Adjetivo antes do substantivo
    description: Em inglês, o adjetivo vai ANTES do substantivo.
    exercises:
      - type: english_vocab
        question: Como se diz 'um gato grande' em inglês?
        correctAnswer: a big cat
        rationale: "'a big cat' — Adjetivo ANTES do substantivo em inglês."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'uma bola vermelha' em inglês?
        correctAnswer: a red ball
        rationale: "'a red ball' — 'red' (adjetivo) antes de 'ball' (substantivo)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'um livro velho' em inglês?
        correctAnswer: an old book
        rationale: "'an old book' — 'old' antes de 'book'. 'an' porque 'old' começa com vogal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'uma casa bonita' em inglês?
        correctAnswer: a beautiful house
        rationale: "'a beautiful house' — 'beautiful' antes de 'house'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'um cachorro pequeno e fofo' em inglês?
        correctAnswer: a small fluffy dog
        rationale: "'a small fluffy dog' — Dois adjetivos antes do substantivo. 'fluffy' = fofo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'uma menina inteligente' em inglês?
        correctAnswer: a smart girl
        rationale: "'a smart girl' — 'smart' antes de 'girl'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I have a ___ ___.' (bola vermelha — adjetivo + subst.)
        correctAnswer: red ball
        rationale: "'I have a red ball.' — Adjetivo antes do substantivo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Corrija a ordem: 'a cat black'
        correctAnswer: a black cat
        rationale: "'a black cat' — O adjetivo vai ANTES do substantivo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'um peixe laranja e amarelo' em inglês?
        correctAnswer: an orange and yellow fish
        rationale: "'an orange and yellow fish' — 'an' porque 'orange' começa com vogal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'uma árvore alta e verde' em inglês?
        correctAnswer: a tall green tree
        rationale: "'a tall green tree' — Dois adjetivos antes do substantivo."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Adjetivos com 'to be' e descrições
    description: Use adjetivos após 'to be' para descrever.
    exercises:
      - type: english_vocab
        question: Como se diz 'O gato é preto.' em inglês?
        correctAnswer: The cat is black.
        rationale: "'The cat is black.' — Adjetivo após 'to be'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela tem cabelo longo e escuro.' em inglês?
        correctAnswer: She has long dark hair.
        rationale: "'She has long dark hair.' — 'long dark hair' = cabelo longo e escuro."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ele é um homem alto e forte.' em inglês?
        correctAnswer: He is a tall strong man.
        rationale: "'He is a tall strong man.' — Dois adjetivos antes de 'man'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'uma camiseta branca e limpa' em inglês?
        correctAnswer: a clean white shirt
        rationale: "'a clean white shirt' — 'clean' e 'white' antes de 'shirt'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'uma bonita maçã vermelha' em inglês?
        correctAnswer: a beautiful red apple
        rationale: "'a beautiful red apple' — 'an' seria se o adjetivo inicial começasse com vogal."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Descreva: 'My school is ___.' (grande e bonita)
        correctAnswer: big and beautiful
        rationale: "'My school is big and beautiful.' — Adjetivos após 'is' com 'and'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu tenho um gato preto e branco fofo.' em inglês?
        correctAnswer: I have a fluffy black and white cat.
        rationale: "'a fluffy black and white cat' — Cor combinada: 'black and white'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete a descrição: 'She has ___ ___ eyes and ___ ___.' (olhos azuis e cabelo loiro)
        correctAnswer: blue, eyes, blonde hair
        rationale: "'She has blue eyes and blonde hair.' — 'blonde' = loiro(a)."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a ordem dos adjetivos em inglês?
        correctAnswer: before the noun
        rationale: "Em inglês: adjetivo ANTES do substantivo. Diferente do português."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela é uma menina alegre e esperta.' em inglês?
        correctAnswer: She is a cheerful and smart girl.
        rationale: "'She is a cheerful and smart girl.' — 'cheerful' = alegre."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
