title: 🔢 English 1A - Números em frases
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.numbers
authorNotes: Usando números em contextos reais — preços, quantidades, idades, medidas.
repeatAll: 2
example: "Ex.: 'It costs five dollars.' 'She is twelve years old.' 'There are thirty students.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Números em contextos variados
    description: Use números para falar de quantidade, preço e medidas.
    exercises:
      - type: english_vocab
        question: Como se diz 'Tenho doze anos.' em inglês?
        correctAnswer: I am twelve years old.
        rationale: "'I am twelve years old.' — 'years old' para idade."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'Custa cinco dólares.' em inglês?
        correctAnswer: It costs five dollars.
        rationale: "'It costs five dollars.' — 'costs' = custa."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'Há trinta alunos na sala.' em inglês?
        correctAnswer: There are thirty students in the class.
        rationale: "'There are thirty students in the class.' — 'thirty' = 30."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'Meu telefone tem vinte jogos.' em inglês?
        correctAnswer: My phone has twenty games.
        rationale: "'My phone has twenty games.' — 'twenty' = 20."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: "Complete: 'She is ___ years old.' (dezesseis)"
        correctAnswer: sixteen
        rationale: "'She is sixteen years old.' — 'sixteen' = 16."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'Preciso de dois lápis e três canetas.' em inglês?
        correctAnswer: I need two pencils and three pens.
        rationale: "'I need two pencils and three pens.' — Plural dos objetos."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'São duas e meia da tarde.' em inglês?
        correctAnswer: It is half past two in the afternoon.
        rationale: "'It is half past two in the afternoon.' — 'afternoon' = tarde."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: "Complete: 'I have ___ fingers on each hand.' (cinco)"
        correctAnswer: five
        rationale: "'I have five fingers on each hand.' — Cinco dedos em cada mão."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'Uma semana tem sete dias.' em inglês?
        correctAnswer: A week has seven days.
        rationale: "'A week has seven days.' — Sete dias na semana."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'Um ano tem doze meses.' em inglês?
        correctAnswer: A year has twelve months.
        rationale: "'A year has twelve months.' — Doze meses no ano."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
  - pageNumber: 2
    title: Números grandes e cálculos simples
    description: Use números maiores e faça operações simples em inglês.
    exercises:
      - type: english_vocab
        question: Como se diz 'quinhentos' em inglês?
        correctAnswer: five hundred
        rationale: "'five hundred' = 500."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'mil' em inglês?
        correctAnswer: one thousand
        rationale: "'one thousand' = 1000."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'dois mais dois é igual a quatro' em inglês?
        correctAnswer: Two plus two equals four.
        rationale: "'Two plus two equals four.' — 'plus' = mais, 'equals' = é igual a."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'dez menos três é igual a sete' em inglês?
        correctAnswer: Ten minus three equals seven.
        rationale: "'Ten minus three equals seven.' — 'minus' = menos."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: "Complete: 'My school has ___ students.' (duzentos)"
        correctAnswer: two hundred
        rationale: "'My school has two hundred students.' — 'two hundred' = 200."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '365' em inglês?
        correctAnswer: three hundred and sixty-five
        rationale: "'three hundred and sixty-five' = 365. Ano tem 365 dias."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'cinco vezes quatro é vinte' em inglês?
        correctAnswer: Five times four equals twenty.
        rationale: "'Five times four equals twenty.' — 'times' = vezes (multiplicação)."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se lê '2025' em inglês?
        correctAnswer: two thousand and twenty-five
        rationale: "'two thousand and twenty-five' = 2025."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'O livro custa quinze reais.' em inglês?
        correctAnswer: The book costs fifteen reais.
        rationale: "'The book costs fifteen reais.' — Preço com 'costs'."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'Quantas pessoas vivem no Brasil?' em inglês?
        correctAnswer: How many people live in Brazil?
        rationale: "'How many people live in Brazil?' — 'how many + people'."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
target: 20
