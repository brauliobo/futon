title: 👨‍👩‍👧 English 1A - Descrevendo a família
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Descrevendo membros da família com adjetivos e estruturas variadas.
repeatAll: 2
example: "Ex.: 'My mother is tall with brown hair.' 'My brother is funny and kind.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Descrevendo aparência física
    description: Descreva os membros da família com adjetivos físicos.
    exercises:
      - type: english_vocab
        question: Como se diz 'Minha mãe é alta e tem cabelo escuro.' em inglês?
        correctAnswer: My mother is tall and has dark hair.
        rationale: "'My mother is tall and has dark hair.' — is + adjetivo, has + cabelo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Meu pai tem olhos azuis.' em inglês?
        correctAnswer: My father has blue eyes.
        rationale: "'My father has blue eyes.' — 'has' para características físicas."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Minha irmã é baixa com cabelo loiro.' em inglês?
        correctAnswer: My sister is short with blonde hair.
        rationale: "'My sister is short with blonde hair.' — 'with' = com."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Meu irmão tem cabelo preto e curto.' em inglês?
        correctAnswer: My brother has short black hair.
        rationale: "'My brother has short black hair.' — Adjetivos: curto + cor."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'My grandmother ___ white hair and brown eyes.' (has)"
        correctAnswer: has
        rationale: "'My grandmother has white hair and brown eyes.' — 'has' para ela."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Meu avô é velho mas forte.' em inglês?
        correctAnswer: My grandfather is old but strong.
        rationale: "'My grandfather is old but strong.' — 'old but strong'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Minha prima é bonita e simpática.' em inglês?
        correctAnswer: My cousin is beautiful and nice.
        rationale: "'My cousin is beautiful and nice.' — 'nice' = simpático."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'My uncle is ___ and ___.' (gordo e engraçado — fat/funny)"
        correctAnswer: fat and funny
        rationale: "'My uncle is fat and funny.' — Dois adjetivos com 'and'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Meu bebê tem olhos grandes e azuis.' em inglês?
        correctAnswer: My baby has big blue eyes.
        rationale: "'My baby has big blue eyes.' — 'big blue eyes'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Minha tia é baixa e tem cabelo ruivo.' em inglês?
        correctAnswer: My aunt is short and has red hair.
        rationale: "'My aunt is short and has red hair.' — 'red hair' = cabelo ruivo."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Descrevendo personalidade e relações
    description: Descreva personalidade e relate memórias da família.
    exercises:
      - type: english_vocab
        question: Como se diz 'Minha mãe é gentil e carinhosa.' em inglês?
        correctAnswer: My mother is kind and caring.
        rationale: "'My mother is kind and caring.' — 'caring' = carinhoso."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Meu pai é trabalhador e engraçado.' em inglês?
        correctAnswer: My father is hardworking and funny.
        rationale: "'My father is hardworking and funny.' — 'hardworking' = trabalhador."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Minha irmã mais velha é esperta.' em inglês?
        correctAnswer: My older sister is smart.
        rationale: "'My older sister is smart.' — 'older' = mais velha."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Meu irmão mais novo é engraçado.' em inglês?
        correctAnswer: My younger brother is funny.
        rationale: "'My younger brother is funny.' — 'younger' = mais novo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Adoro minha família.' em inglês?
        correctAnswer: I love my family.
        rationale: "'I love my family.' — Expressão de afeto."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'My family has ___ people.' (cinco)"
        correctAnswer: five
        rationale: "'My family has five people.' — Número de membros."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Passamos as férias juntos toda família.' em inglês?
        correctAnswer: We spend the holidays together as a family.
        rationale: "'We spend the holidays together as a family.' — 'as a family' = em família."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Minha mãe é professora e meu pai é médico.' em inglês?
        correctAnswer: My mother is a teacher and my father is a doctor.
        rationale: "'My mother is a teacher and my father is a doctor.' — Profissões."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Meu irmão tem dez anos e minha irmã tem seis.' em inglês?
        correctAnswer: My brother is ten years old and my sister is six.
        rationale: "'My brother is ten and my sister is six.' — Idades com 'is'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Descreva um membro da sua família em inglês (3 informações)
        correctAnswer: My ___ is ___. She/He has ___. She/He likes ___.
        rationale: "Modelo: My [familiar] is [adjetivo]. She/He has [característica]. She/He likes [hobby]."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
