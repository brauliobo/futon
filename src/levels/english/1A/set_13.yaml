title: 📅 English 1A - Meses e estações
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.months
authorNotes: Meses em frases + as quatro estações do ano em inglês.
repeatAll: 2
example: "Ex.: 'My birthday is in June.' 'In summer it is hot.' 'Spring is my favourite season.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Meses em frases
    description: Use os meses em frases com 'in' e outras preposições.
    exercises:
      - type: english_vocab
        question: Qual preposição usamos com meses?
        correctAnswer: in
        rationale: "'in' + mês. My birthday is in June."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: "Complete: 'My birthday is ___ July.' (em julho)"
        correctAnswer: in
        rationale: "'My birthday is in July.' — 'in' com meses."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: "Complete: 'School starts ___ February.' (em fevereiro)"
        correctAnswer: in
        rationale: "'School starts in February.' — 'in' com meses."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'Natal é em dezembro.' em inglês?
        correctAnswer: Christmas is in December.
        rationale: "'Christmas is in December.' — 'Christmas' = Natal."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'Qual mês é agora?' em inglês?
        correctAnswer: What month is it?
        rationale: "'What month is it?' — Perguntando o mês atual."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'Meu aniversário é no dia 3 de março.' em inglês?
        correctAnswer: My birthday is on the third of March.
        rationale: "'on the third of March' — 'on' + ordinal + 'of' + mês."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: "Complete: 'School ends ___ June.' (em junho)"
        correctAnswer: in
        rationale: "'School ends in June.' — 'in' com meses."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'Em que mês é seu aniversário?' em inglês?
        correctAnswer: What month is your birthday?
        rationale: "'What month is your birthday?' — Pergunta sobre aniversário."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Liste os meses de verão no Brasil (dezembro-fevereiro) em inglês
        correctAnswer: December, January, February
        rationale: "Verão no Brasil: December, January, February."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Liste os meses de inverno no Brasil (junho-agosto) em inglês
        correctAnswer: June, July, August
        rationale: "Inverno no Brasil: June, July, August."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
  - pageNumber: 2
    title: As quatro estações
    description: Aprenda spring, summer, autumn/fall, winter e seus climas.
    exercises:
      - type: english_vocab
        question: Como se diz 'primavera' em inglês?
        correctAnswer: spring
        rationale: "'spring' = primavera. Flores desabrocham na primavera."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'verão' em inglês?
        correctAnswer: summer
        rationale: "'summer' = verão. Hot summer days."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'outono' em inglês?
        correctAnswer: autumn
        rationale: "'autumn' = outono. Também 'fall' no inglês americano."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'inverno' em inglês?
        correctAnswer: winter
        rationale: "'winter' = inverno. Cold winter nights."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: "Complete: 'In ___ it is hot and sunny.' (verão)"
        correctAnswer: summer
        rationale: "'In summer it is hot and sunny.' — Clima do verão."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: "Complete: 'In ___ it is cold and snowy.' (inverno)"
        correctAnswer: winter
        rationale: "'In winter it is cold and snowy.' — Clima do inverno."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'Minha estação favorita é a primavera.' em inglês?
        correctAnswer: My favourite season is spring.
        rationale: "'My favourite season is spring.' — 'season' = estação."
        difficulty: 2
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Liste as 4 estações do ano em inglês
        correctAnswer: spring, summer, autumn, winter
        rationale: "As 4 estações: spring, summer, autumn, winter."
        difficulty: 2
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'No outono as folhas caem das árvores.' em inglês?
        correctAnswer: In autumn the leaves fall from the trees.
        rationale: "'In autumn the leaves fall from the trees.' — 'leaves' = folhas."
        difficulty: 2
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Quais meses correspondem ao outono no hemisfério norte? em inglês
        correctAnswer: September, October, November
        rationale: "Outono no hemisfério norte: September, October, November."
        difficulty: 2
        objectives: [pre-A1.vocab.months]
target: 20
