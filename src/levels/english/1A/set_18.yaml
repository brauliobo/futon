title: 🔗 English 1A - Conectores avançados
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Conectores para construir frases complexas — also, too, however, although, when, if.
repeatAll: 2
example: "Ex.: 'I like cats. I also like dogs.' 'Although it is cold, I go outside.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Also, too, as well
    description: Aprenda formas de dizer 'também' em inglês.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu também gosto de gatos.' em inglês? (também = also)
        correctAnswer: I also like cats.
        rationale: "'I also like cats.' — 'also' vem antes do verbo principal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ele gosta de futebol também.' em inglês? (também no final)
        correctAnswer: He likes football too.
        rationale: "'He likes football too.' — 'too' vem no final da frase."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'She can swim. She can ___ dance.' (também)
        correctAnswer: also
        rationale: "'She can also dance.' — 'also' antes do verbo principal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I like pizza. I like pasta ___.' (também — final)
        correctAnswer: too
        rationale: "'I like pizza. I like pasta too.' — 'too' no final."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'quando' em inglês? (conector de tempo)
        correctAnswer: when
        rationale: "'when' = quando. When I am tired, I sleep."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ I am tired, I go to bed.' (quando)
        correctAnswer: When
        rationale: "'When I am tired, I go to bed.' — 'when' no início ou meio."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'se' em inglês? (condicional)
        correctAnswer: if
        rationale: "'if' = se. If it rains, I stay at home."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ it rains, I use an umbrella.' (se)
        correctAnswer: If
        rationale: "'If it rains, I use an umbrella.' — 'if' para condição."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I eat ___ I am hungry.' (quando)
        correctAnswer: when
        rationale: "'I eat when I am hungry.' — 'when' = quando."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ you study hard, you will learn English.' (se)
        correctAnswer: If
        rationale: "'If you study hard, you will learn English.' — Condição."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: However, although, because
    description: Aprenda conectores de contraste e causa.
    exercises:
      - type: english_vocab
        question: Como se diz 'entretanto/porém' em inglês?
        correctAnswer: however
        rationale: "'however' = entretanto, porém. Conecta frases contrastantes."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I like cats. ___, I am allergic to them.' (entretanto)
        correctAnswer: However
        rationale: "'I like cats. However, I am allergic to them.' — 'However' + vírgula."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'embora/apesar de' em inglês?
        correctAnswer: although
        rationale: "'although' = embora, apesar de. Although it is cold, I swim."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ it is cold, I go outside.' (embora)
        correctAnswer: Although
        rationale: "'Although it is cold, I go outside.' — 'although' no início."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I study hard ___ I want to learn English.' (porque)
        correctAnswer: because
        rationale: "'I study hard because I want to learn English.' — 'because' = razão."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a diferença entre 'but' e 'however'?
        correctAnswer: both show contrast, but however is more formal
        rationale: "'but' e 'however' ambos mostram contraste. 'however' é mais formal."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'She is shy. ___, she is very kind.' (porém)
        correctAnswer: However
        rationale: "'She is shy. However, she is very kind.' — Contraste formal."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Embora seja difícil, eu pratico todo dia.' em inglês?
        correctAnswer: Although it is difficult, I practise every day.
        rationale: "'Although it is difficult, I practise every day.' — 'although' = embora."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Liste os conectores desta lição
        correctAnswer: also, too, when, if, however, although, because
        rationale: "also, too, when, if, however, although, because — 7 conectores."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Se você estudar muito, você passará no teste.' em inglês?
        correctAnswer: If you study a lot, you will pass the test.
        rationale: "'If you study a lot, you will pass the test.' — 'if' + futuro com 'will'."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
