title: 🏫 English 1A - Linguagem de sala de aula
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Expressões úteis para comunicação em sala de aula de inglês.
repeatAll: 2
example: "Ex.: 'Can you repeat that?' 'I don't understand.' 'How do you spell it?'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Pedidos e dúvidas
    description: Expresse dúvidas e faça pedidos em inglês na aula.
    exercises:
      - type: english_vocab
        question: Como se diz 'Pode repetir?' em inglês?
        correctAnswer: Can you repeat that?
        rationale: "'Can you repeat that?' — Pedido de repetição."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Não entendo.' em inglês?
        correctAnswer: I don't understand.
        rationale: "'I don't understand.' — 'understand' = entender."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Como se escreve isso?' em inglês?
        correctAnswer: How do you spell it?
        rationale: "'How do you spell it?' — 'spell' = soletrar/escrever."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Como se pronuncia isso?' em inglês?
        correctAnswer: How do you pronounce it?
        rationale: "'How do you pronounce it?' — 'pronounce' = pronunciar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O que significa ___?' em inglês?
        correctAnswer: What does ___ mean?
        rationale: "'What does ___ mean?' — 'mean' = significar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Como se diz ___ em inglês?' em inglês?
        correctAnswer: How do you say ___ in English?
        rationale: "'How do you say ___ in English?' — Pergunta muito útil!"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Posso responder?' em inglês?
        correctAnswer: Can I answer?
        rationale: "'Can I answer?' — Pedindo para participar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Estou com dúvida.' em inglês?
        correctAnswer: I have a question.
        rationale: "'I have a question.' — 'question' = dúvida/pergunta."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Posso falar em português?' em inglês?
        correctAnswer: Can I speak Portuguese?
        rationale: "'Can I speak Portuguese?' — Pedido de permissão."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Não sei.' em inglês?
        correctAnswer: I don't know.
        rationale: "'I don't know.' — Expressão honesta."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Respostas e expressões de aula
    description: Aprenda as respostas do professor e expressões de aula.
    exercises:
      - type: english_vocab
        question: Como se diz 'Muito bem!' em inglês?
        correctAnswer: Very good! / Well done!
        rationale: "'Very good!' e 'Well done!' = Muito bem! Parabéns!"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Preste atenção, por favor!' em inglês?
        correctAnswer: Pay attention, please!
        rationale: "'Pay attention, please!' — Pedido do professor."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Está correto!' em inglês?
        correctAnswer: That's correct!
        rationale: "'That's correct!' = Está correto!"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Tente de novo.' em inglês?
        correctAnswer: Try again.
        rationale: "'Try again.' — Encorajamento para tentar novamente."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Entendeu?' em inglês?
        correctAnswer: Do you understand?
        rationale: "'Do you understand?' — Pergunta do professor para verificar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se responde 'Do you understand?' — Sim!
        correctAnswer: Yes, I understand.
        rationale: "'Yes, I understand.' — Confirmação de entendimento."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Trabalhem em pares.' em inglês?
        correctAnswer: Work in pairs.
        rationale: "'Work in pairs.' — Instrução de atividade em duplas."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ouça e repita.' em inglês?
        correctAnswer: Listen and repeat.
        rationale: "'Listen and repeat.' — Instrução clássica de aula."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Leia em voz alta.' em inglês?
        correctAnswer: Read aloud.
        rationale: "'Read aloud.' — 'aloud' = em voz alta."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Vocês fizeram um ótimo trabalho!' em inglês?
        correctAnswer: You did a great job!
        rationale: "'You did a great job!' — Elogio do professor à turma."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
