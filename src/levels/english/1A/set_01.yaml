title: 📖 English 1A - Artigo 'a' e 'an'
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Uso dos artigos indefinidos 'a' e 'an' com regras completas.
repeatAll: 2
example: "Ex.: 'a cat' 'an apple' 'a big dog' 'an old car'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: "Regras do 'a' e 'an'"
    description: "Use 'a' antes de consoante e 'an' antes de vogal."
    exercises:
      - type: english_vocab
        question: "Qual é a regra para usar 'a'?"
        correctAnswer: before consonant sounds
        rationale: "'a' antes de sons consonantais: a cat, a dog, a house."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Qual é a regra para usar 'an'?"
        correctAnswer: before vowel sounds
        rationale: "'an' antes de sons vocálicos (a, e, i, o, u): an apple, an egg."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ cat' (artigo)"
        correctAnswer: a
        rationale: "'a cat' — 'cat' começa com 'c' (consoante)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ apple' (artigo)"
        correctAnswer: an
        rationale: "'an apple' — 'apple' começa com 'a' (vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ elephant' (artigo)"
        correctAnswer: an
        rationale: "'an elephant' — 'elephant' começa com 'e' (vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ umbrella' (artigo)"
        correctAnswer: an
        rationale: "'an umbrella' — 'umbrella' começa com 'u' (vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ orange' (artigo)"
        correctAnswer: an
        rationale: "'an orange' — 'orange' começa com 'o' (vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ house' (artigo)"
        correctAnswer: a
        rationale: "'a house' — 'house' começa com 'h' (consoante)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ idea' (artigo)"
        correctAnswer: an
        rationale: "'an idea' — 'idea' começa com 'i' (vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ big dog' (artigo — olha para a primeira letra do adjetivo)"
        correctAnswer: a
        rationale: "'a big dog' — O artigo vai com 'big' (b = consoante), não com 'dog'."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: "'a/an' com adjetivos e casos especiais"
    description: O artigo concorda com a primeira letra que vem depois.
    exercises:
      - type: english_vocab
        question: "Complete: '___ old car' (artigo — começa com 'old')"
        correctAnswer: an
        rationale: "'an old car' — 'old' começa com 'o' (vogal), então usamos 'an'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ small ant' (artigo — 'small' começa com consoante)"
        correctAnswer: a
        rationale: "'a small ant' — 'small' começa com 's' (consoante)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ interesting book' (artigo)"
        correctAnswer: an
        rationale: "'an interesting book' — 'interesting' começa com 'i' (vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ ugly monster' (artigo)"
        correctAnswer: an
        rationale: "'an ugly monster' — 'ugly' começa com 'u' (vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ honest person' (artigo — 'h' é mudo)"
        correctAnswer: an
        rationale: "'an honest person' — 'honest' /ˈɒnɪst/: o 'h' é mudo, som vocálico."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'She is ___ doctor.' (artigo)"
        correctAnswer: a
        rationale: "'She is a doctor.' — 'doctor' começa com 'd' (consoante)."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'He has ___ unusual hobby.' (artigo)"
        correctAnswer: an
        rationale: "'He has an unusual hobby.' — 'unusual' começa com 'u' (vogal)."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Qual é a diferença entre 'a/an' e 'the'?"
        correctAnswer: a/an = indefinite (any), the = definite (specific)
        rationale: "'a/an' = indefinido (qualquer). 'the' = definido (específico). A cat vs The cat."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I saw ___ cat. ___ cat was black.' (a/an/the)"
        correctAnswer: a, The
        rationale: "'I saw a cat.' (primeiro: indefinido) 'The cat was black.' (segundo: já sabemos qual)."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'He is ___ engineer.' (artigo — 'engineer' começa com vogal)"
        correctAnswer: an
        rationale: "'He is an engineer.' — 'engineer' começa com 'e' (vogal)."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
