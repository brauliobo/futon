title: 📖 English 1A - This/That/These/Those
level: 1A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Pronomes demonstrativos — this, that, these, those em todos os contextos.
repeatAll: 2
example: "Ex.: 'This is my book.' 'Those are beautiful flowers.' 'I like this one.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: This/That — singular
    description: Pratique this (perto) e that (longe) em contextos variados.
    exercises:
      - type: english_vocab
        question: "Complete: '___ is my pen.' (essa — próxima)"
        correctAnswer: This
        rationale: "'This is my pen.' — 'this' para objeto próximo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ is a beautiful tree.' (aquela — distante)"
        correctAnswer: That
        rationale: "'That is a beautiful tree.' — 'that' para objeto distante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I like ___ shirt.' (essa — próxima)"
        correctAnswer: this
        rationale: "'I like this shirt.' — 'this' para indicar objeto próximo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is ___ your dog?' (aquele — distante)"
        correctAnswer: that
        rationale: "'Is that your dog?' — 'that' para objeto distante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Isso é incrível!' em inglês?
        correctAnswer: This is amazing!
        rationale: "'This is amazing!' — 'this' para algo presente."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Aquilo é uma escola?' em inglês?
        correctAnswer: Is that a school?
        rationale: "'Is that a school?' — 'that' para objeto distante + pergunta."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'What is ___? It's a clock.' (isso — próximo)"
        correctAnswer: this
        rationale: "'What is this? It's a clock.' — Perguntando sobre objeto próximo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Este livro é interessante.' em inglês?
        correctAnswer: This book is interesting.
        rationale: "'This book is interesting.' — 'this' como adjetivo antes do substantivo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Aquela mulher é minha professora.' em inglês?
        correctAnswer: That woman is my teacher.
        rationale: "'That woman is my teacher.' — 'that' antes de 'woman'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ is not my bag. ___ is.' (essa não é/aquela é)"
        correctAnswer: This, That
        rationale: "'This is not my bag. That is.' — Contraste: this/that."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: These/Those — plural
    description: Pratique these (perto, plural) e those (longe, plural).
    exercises:
      - type: english_vocab
        question: "Complete: '___ are my books.' (esses — próximos)"
        correctAnswer: These
        rationale: "'These are my books.' — 'these' = plural de 'this'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ are beautiful flowers.' (aquelas — distantes)"
        correctAnswer: Those
        rationale: "'Those are beautiful flowers.' — 'those' = plural de 'that'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I want ___ shoes.' (esses — próximos)"
        correctAnswer: these
        rationale: "'I want these shoes.' — 'these' como adjetivo plural próximo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Are ___ your glasses?' (aqueles — distantes)"
        correctAnswer: those
        rationale: "'Are those your glasses?' — 'those' para distante plural."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Esses meninos são meus amigos.' em inglês?
        correctAnswer: These boys are my friends.
        rationale: "'These boys are my friends.' — 'these' + plural + 'are'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Aquelas casas são muito grandes.' em inglês?
        correctAnswer: Those houses are very big.
        rationale: "'Those houses are very big.' — 'those' para plural distante."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete o resumo: this/that (___) e these/those (___)'"
        correctAnswer: singular, plural
        rationale: "this/that = singular. these/those = plural."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete o resumo: this/these (___) e that/those (___)'"
        correctAnswer: near, far
        rationale: "this/these = perto. that/those = longe."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Prefiro esses ao invés daqueles.' em inglês?
        correctAnswer: I prefer these ones to those ones.
        rationale: "'I prefer these ones to those ones.' — Comparação com 'ones'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Qual desses você quer?' em inglês?
        correctAnswer: Which of these do you want?
        rationale: "'Which of these do you want?' — 'which' = qual."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
