title: ✏️ English J - Mixed Review Level J
level: J
subject: english
difficulty: 4
objectives:
  - B2.grammar.noun_clauses
  - B2.grammar.adverbial_clauses
  - B2.grammar.ellipsis_substitution
  - B2.grammar.advanced_comparisons
  - B2.grammar.expressing_purpose
  - B2.grammar.result_consequence
  - B2.grammar.mixed_tenses_narrative
  - B2.vocabulary.register_formal_informal
  - B2.vocabulary.technology_innovation
  - B2.vocabulary.society_global_issues
  - B2.vocabulary.academic_science_research
  - B2.skills.summary_paraphrase
authorNotes: Comprehensive review of all Level J topics — grammar structures, vocabulary themes, and communication skills covered in sets 01–19.
repeatAll: 2
example: "Ex.: 'Quanto mais você pratica, mais confiante você fica' → The more you practise, the more confident you become."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Grammar Review
    description: Review of key Level J grammar structures.
    exercises:
      - type: english_phrases
        question: Parece que o problema foi resolvido
        correctAnswer: It seems that the problem has been resolved
        rationale: "Revisão: noun clause ('It seems that'). Passiva present perfect 'has been resolved'."
        difficulty: 2
        objectives: [B2.grammar.noun_clauses]
      - type: english_phrases
        question: Embora o projeto esteja atrasado, a qualidade é excelente
        correctAnswer: Although the project is behind schedule, the quality is excellent
        rationale: "Revisão: cláusula de concessão. 'Behind schedule' = atrasado (idioma comum)."
        difficulty: 2
        objectives: [B2.grammar.adverbial_clauses]
      - type: english_phrases
        question: Ela foi ao banco para tirar dinheiro
        correctAnswer: She went to the bank to withdraw money
        rationale: "Revisão: propósito com infinitivo simples. 'Withdraw money' = sacar dinheiro (formal)."
        difficulty: 2
        objectives: [B2.grammar.expressing_purpose]
      - type: english_phrases
        question: Eu também não fui à festa
        correctAnswer: Neither did I
        rationale: "Revisão: elipse/substituição. 'Neither did I' concorda com negativa passado simples."
        difficulty: 2
        objectives: [B2.grammar.ellipsis_substitution]
      - type: english_phrases
        question: Quanto mais ele se exercita, mais energia tem
        correctAnswer: The more he exercises, the more energy he has
        rationale: "Revisão: comparativa proporcional. 'Energy he has' (não 'the more energetic')."
        difficulty: 2
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: O projeto foi tão complexo que levou dois anos para ser concluído
        correctAnswer: The project was so complex that it took two years to be completed
        rationale: "Revisão: resultado 'so...that'. 'Took two years to be completed' passiva + tempo."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Quando ela percebeu o que tinha acontecido, já era tarde demais
        correctAnswer: When she realised what had happened, it was already too late
        rationale: "Revisão: tempos narrativos. 'Had happened' (past perfect anterior). 'Too late' (resultado)."
        difficulty: 3
        objectives: [B2.grammar.mixed_tenses_narrative]
      - type: english_phrases
        question: Leve um carregador extra caso sua bateria acabe
        correctAnswer: Take an extra charger in case your battery runs out
        rationale: "Revisão: propósito preventivo 'in case'. 'Runs out' = acabar (phrasal verb)."
        difficulty: 3
        objectives: [B2.grammar.expressing_purpose]
      - type: english_phrases
        question: O que mais me surpreende é a falta de comunicação
        correctAnswer: What surprises me most is the lack of communication
        rationale: "Revisão: noun clause como sujeito. 'What surprises me most' = sujeito-cláusula."
        difficulty: 3
        objectives: [B2.grammar.noun_clauses]
      - type: english_phrases
        question: Por mais que ele tentasse, não conseguia convencer o grupo
        correctAnswer: However hard he tried, he could not convince the group
        rationale: "Revisão: concessão enfática 'however + adjetivo'. 'Could not convince' modal passado."
        difficulty: 3
        objectives: [B2.grammar.adverbial_clauses]
  - pageNumber: 2
    title: Vocabulary & Skills Review
    description: Review of vocabulary topics and communication skills from Level J.
    exercises:
      - type: english_phrases
        question: A inteligência artificial está mudando o mercado de trabalho
        correctAnswer: Artificial intelligence is reshaping the labour market
        rationale: "Revisão: vocabulário de tecnologia. 'Reshaping' = reformular/transformar. 'Labour market'."
        difficulty: 3
        objectives: [B2.vocabulary.technology_innovation]
      - type: english_phrases
        question: A desigualdade de riqueza representa uma ameaça à coesão social
        correctAnswer: Wealth inequality poses a threat to social cohesion
        rationale: "Revisão: vocabulário de sociedade. 'Poses a threat to' colocação. 'Social cohesion'."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: Os dados foram analisados usando métodos estatísticos avançados
        correctAnswer: The data were analysed using advanced statistical methods
        rationale: "Revisão: vocabulário académico. 'Data were' (plural). Participial clause 'using'."
        difficulty: 3
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: Preciso verificar os detalhes antes de confirmar (formal)
        correctAnswer: I need to verify the details before confirming
        rationale: "Revisão: registo formal. 'Verify' formal de 'check'. Gerúndio após 'before'."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: Em resumo, os resultados confirmam a hipótese original
        correctAnswer: In summary, the results confirm the original hypothesis
        rationale: "Revisão: paráfrase/resumo. 'In summary' conector. 'Confirm the hypothesis' colocação."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: A falta de investimento resultou em infraestrutura deteriorada
        correctAnswer: The lack of investment resulted in deteriorating infrastructure
        rationale: "Revisão: resultado. 'Resulted in' + gerúndio. 'Deteriorating infrastructure' adjetivo participial."
        difficulty: 4
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Ela era muito mais qualificada do que os outros candidatos
        correctAnswer: She was far more qualified than the other candidates
        rationale: "Revisão: comparações avançadas. 'Far more qualified' intensificador + comparativo longo."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: A automação está tornando certos empregos obsoletos, gerando novos desafios
        correctAnswer: Automation is making certain jobs obsolete, creating new challenges
        rationale: "Revisão: tecnologia + participial clause de resultado. 'Obsolete' = obsoleto."
        difficulty: 4
        objectives: [B2.vocabulary.technology_innovation]
      - type: english_phrases
        question: Não está claro se as novas políticas terão o impacto desejado
        correctAnswer: It is not clear whether the new policies will have the desired impact
        rationale: "Revisão: noun clause com 'whether'. 'The desired impact' = o impacto desejado."
        difficulty: 4
        objectives: [B2.grammar.noun_clauses]
      - type: english_phrases
        question: Dito de outra forma, precisamos de uma abordagem completamente nova para este problema
        correctAnswer: Put differently, we need an entirely new approach to this problem
        rationale: "Revisão: paráfrase com conector 'put differently'. 'Entirely new approach to'."
        difficulty: 4
        objectives: [B2.skills.summary_paraphrase]
target: 20
