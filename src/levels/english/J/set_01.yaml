title: English J - Passive Present
level: J
subject: english
difficulty: 3
objectives:
  - B2.grammar.passive_present
authorNotes: Subject + am/is/are + past participle (+ by + agent). Use when the doer is unknown or unimportant.
repeatAll: 2
example: O carro é lavado → The car is washed
pages:
  - pageNumber: 1
    title: Simple Passive
    description: Basic present passive sentences.
    exercises:
      - type: english_phrases
        question: O carro é lavado todo sábado
        correctAnswer: the car is washed every saturday
        rationale: "Passiva: 'is washed' (is + particípio). 'Every Saturday' maiúscula."
      - type: english_phrases
        question: As cartas são escritas à mão
        correctAnswer: the letters are written by hand
        rationale: "'Are written' (plural + particípio irregular). 'By hand' = à mão."
      - type: english_phrases
        question: O inglês é falado em muitos países
        correctAnswer: english is spoken in many countries
        rationale: "'Spoken' (particípio de speak). 'English' maiúscula (idioma)."
      - type: english_phrases
        question: Esta sala é usada por alunos
        correctAnswer: this room is used by students
        rationale: "'Is used by' — 'by' introduz agente. 'Students' plural genérico."
      - type: english_phrases
        question: O café é servido pela manhã
        correctAnswer: coffee is served in the morning
        rationale: "'Coffee' incontável (sem artigo). 'In the morning' (período do dia)."
      - type: english_phrases
        question: Os livros são emprestados à biblioteca
        correctAnswer: the books are borrowed from the library
        rationale: "'Borrow from' = tomar emprestado de. 'The books are' (plural)."
      - type: english_phrases
        question: O bolo é feito pela minha avó
        correctAnswer: the cake is made by my grandmother
        rationale: "'Made' (particípio de make). 'By my grandmother' (agente)."
      - type: english_phrases
        question: As salas são limpas à noite
        correctAnswer: the rooms are cleaned at night
        rationale: "'Are cleaned' (plural + particípio regular). 'At night' expressão fixa."
      - type: english_phrases
        question: A porta é aberta às oito
        correctAnswer: the door is opened at eight
        rationale: "'Opened' (particípio). 'At eight' — 'at' com horas."
      - type: english_phrases
        question: Estes produtos são importados
        correctAnswer: these products are imported
        rationale: "'These products' + 'are imported' (plural). Sem agente, foco na ação."
  - pageNumber: 2
    title: With 'by' Agent
    description: Include the agent when it adds information.
    exercises:
      - type: english_phrases
        question: A música é composta por ela
        correctAnswer: the song is composed by her
        rationale: "'Is composed by her' — 'her' (objeto) após 'by'."
      - type: english_phrases
        question: Este prédio é usado pela empresa
        correctAnswer: this building is used by the company
        rationale: "'Is used by the company' — 'the company' específico como agente."
      - type: english_phrases
        question: O livro é lido por estudantes
        correctAnswer: the book is read by students
        rationale: "'Read' (particípio, pronunciado /red/). 'By students' (genérico)."
      - type: english_phrases
        question: A carta é assinada pelo diretor
        correctAnswer: the letter is signed by the director
        rationale: "'Signed' (particípio regular). 'By the director' específico."
      - type: english_phrases
        question: O trabalho é feito por voluntários
        correctAnswer: the work is done by volunteers
        rationale: "'Done' (particípio irregular de do). 'By volunteers' sem artigo."
      - type: english_phrases
        question: O filme é produzido por ele
        correctAnswer: the movie is produced by him
        rationale: "'Produced' (particípio). 'Him' (objeto) após 'by'."
      - type: english_phrases
        question: A comida é preparada por nós
        correctAnswer: the food is prepared by us
        rationale: "'Us' (objeto 1ª plural) após 'by'. 'Food' incontável com 'the'."
      - type: english_phrases
        question: A história é contada pela professora
        correctAnswer: the story is told by the teacher
        rationale: "'Told' (particípio irregular de tell). 'By the teacher' específico."
      - type: english_phrases
        question: Os problemas são resolvidos pela equipe
        correctAnswer: the problems are solved by the team
        rationale: "'Are solved' (plural). 'By the team' agente específico."
      - type: english_phrases
        question: Esses relatórios são escritos por ela
        correctAnswer: these reports are written by her
        rationale: "'These reports' + 'are written by her' (plural + particípio de write)."
target: 20
