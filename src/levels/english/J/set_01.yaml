title: English J - Passive Present
level: J
subject: english
difficulty: 3
objectives: [B2.grammar.passive_present]
authorNotes: Subject + am/is/are + past participle (+ by + agent). Use when the doer is unknown or unimportant.
repeatAll: 2
example: "O carro é lavado → The car is washed"
pages:
  - pageNumber: 1
    title: Simple Passive
    description: Basic present passive sentences.
    exercises:
      - { type: english_phrases, question: "O carro é lavado todo sábado", correctAnswer: the car is washed every saturday }
      - { type: english_phrases, question: "As cartas são escritas à mão", correctAnswer: the letters are written by hand }
      - { type: english_phrases, question: "O inglês é falado em muitos países", correctAnswer: english is spoken in many countries }
      - { type: english_phrases, question: "Esta sala é usada por alunos", correctAnswer: this room is used by students }
      - { type: english_phrases, question: "O café é servido pela manhã", correctAnswer: coffee is served in the morning }
      - { type: english_phrases, question: "Os livros são emprestados à biblioteca", correctAnswer: the books are borrowed from the library }
      - { type: english_phrases, question: "O bolo é feito pela minha avó", correctAnswer: the cake is made by my grandmother }
      - { type: english_phrases, question: "As salas são limpas à noite", correctAnswer: the rooms are cleaned at night }
      - { type: english_phrases, question: "A porta é aberta às oito", correctAnswer: the door is opened at eight }
      - { type: english_phrases, question: "Estes produtos são importados", correctAnswer: these products are imported }
  - pageNumber: 2
    title: With 'by' Agent
    description: Include the agent when it adds information.
    exercises:
      - { type: english_phrases, question: "A música é composta por ela", correctAnswer: the song is composed by her }
      - { type: english_phrases, question: "Este prédio é usado pela empresa", correctAnswer: this building is used by the company }
      - { type: english_phrases, question: "O livro é lido por estudantes", correctAnswer: the book is read by students }
      - { type: english_phrases, question: "A carta é assinada pelo diretor", correctAnswer: the letter is signed by the director }
      - { type: english_phrases, question: "O trabalho é feito por voluntários", correctAnswer: the work is done by volunteers }
      - { type: english_phrases, question: "O filme é produzido por ele", correctAnswer: the movie is produced by him }
      - { type: english_phrases, question: "A comida é preparada por nós", correctAnswer: the food is prepared by us }
      - { type: english_phrases, question: "A história é contada pela professora", correctAnswer: the story is told by the teacher }
      - { type: english_phrases, question: "Os problemas são resolvidos pela equipe", correctAnswer: the problems are solved by the team }
      - { type: english_phrases, question: "Esses relatórios são escritos por ela", correctAnswer: these reports are written by her }
target: 20
