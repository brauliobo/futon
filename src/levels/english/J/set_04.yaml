title: English J - Passive Perfect & Future
level: J
subject: english
difficulty: 4
objectives: [B2.grammar.passive_perfect, B2.grammar.passive_future]
authorNotes: Present perfect passive — has/have been + pp. Future passive — will be + pp.
repeatAll: 2
example: "Foi feito → It has been done / Será feito → It will be done"
pages:
  - pageNumber: 1
    title: Present Perfect Passive
    description: Recently completed or with present relevance.
    exercises:
      - { type: english_phrases, question: "Foi feito", correctAnswer: it has been done }
      - { type: english_phrases, question: "Foi enviado", correctAnswer: it has been sent }
      - { type: english_phrases, question: "Muitos livros foram escritos", correctAnswer: many books have been written }
      - { type: english_phrases, question: "O problema foi resolvido", correctAnswer: the problem has been solved }
      - { type: english_phrases, question: "A decisão foi tomada", correctAnswer: the decision has been made }
      - { type: english_phrases, question: "Ele foi avisado", correctAnswer: he has been warned }
      - { type: english_phrases, question: "As chaves foram perdidas", correctAnswer: the keys have been lost }
      - { type: english_phrases, question: "Nada foi decidido ainda", correctAnswer: nothing has been decided yet }
      - { type: english_phrases, question: "Você foi convidado", correctAnswer: you have been invited }
      - { type: english_phrases, question: "O relatório foi publicado", correctAnswer: the report has been published }
  - pageNumber: 2
    title: Future Passive
    description: Will be + past participle.
    exercises:
      - { type: english_phrases, question: "Será feito amanhã", correctAnswer: it will be done tomorrow }
      - { type: english_phrases, question: "Será anunciado em breve", correctAnswer: it will be announced soon }
      - { type: english_phrases, question: "Os resultados serão publicados", correctAnswer: the results will be published }
      - { type: english_phrases, question: "Novas regras serão criadas", correctAnswer: new rules will be created }
      - { type: english_phrases, question: "Os alunos serão avaliados", correctAnswer: the students will be evaluated }
      - { type: english_phrases, question: "O evento será organizado pela equipe", correctAnswer: the event will be organized by the team }
      - { type: english_phrases, question: "A casa será vendida", correctAnswer: the house will be sold }
      - { type: english_phrases, question: "Você será informado", correctAnswer: you will be informed }
      - { type: english_phrases, question: "O sistema será atualizado", correctAnswer: the system will be updated }
      - { type: english_phrases, question: "As propostas serão revisadas", correctAnswer: the proposals will be reviewed }
target: 20
