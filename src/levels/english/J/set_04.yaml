title: English J - Passive Perfect & Future
level: J
subject: english
difficulty: 4
objectives:
  - B2.grammar.passive_perfect
  - B2.grammar.passive_future
authorNotes: Present perfect passive — has/have been + pp. Future passive — will be + pp.
repeatAll: 2
example: Foi feito → It has been done / Será feito → It will be done
pages:
  - pageNumber: 1
    title: Present Perfect Passive
    description: Recently completed or with present relevance.
    exercises:
      - type: english_phrases
        question: Foi feito
        correctAnswer: it has been done
        rationale: "Perfect passive: 'has been done' (has + been + particípio)."
      - type: english_phrases
        question: Foi enviado
        correctAnswer: it has been sent
        rationale: "'Has been sent' — 'sent' (particípio irregular de send)."
      - type: english_phrases
        question: Muitos livros foram escritos
        correctAnswer: many books have been written
        rationale: "'Have been written' (plural). 'Written' particípio de write."
      - type: english_phrases
        question: O problema foi resolvido
        correctAnswer: the problem has been solved
        rationale: "'Has been solved' (singular). 'Solved' particípio regular."
      - type: english_phrases
        question: A decisão foi tomada
        correctAnswer: the decision has been made
        rationale: "'Make a decision' = tomar decisão. 'Has been made' (particípio de make)."
      - type: english_phrases
        question: Ele foi avisado
        correctAnswer: he has been warned
        rationale: "'He has been warned' (3ª pessoa + been + particípio regular)."
      - type: english_phrases
        question: As chaves foram perdidas
        correctAnswer: the keys have been lost
        rationale: "'Have been lost' (plural). 'Lost' particípio irregular de lose."
      - type: english_phrases
        question: Nada foi decidido ainda
        correctAnswer: nothing has been decided yet
        rationale: "'Nothing' é singular → 'has'. 'Yet' = ainda (negativa/pergunta)."
      - type: english_phrases
        question: Você foi convidado
        correctAnswer: you have been invited
        rationale: "'You have been invited' — 'you' plural/formal pede 'have'."
      - type: english_phrases
        question: O relatório foi publicado
        correctAnswer: the report has been published
        rationale: "'Has been published' (singular + particípio regular)."
  - pageNumber: 2
    title: Future Passive
    description: Will be + past participle.
    exercises:
      - type: english_phrases
        question: Será feito amanhã
        correctAnswer: it will be done tomorrow
        rationale: "Future passive: 'will be done' (will + be + particípio)."
      - type: english_phrases
        question: Será anunciado em breve
        correctAnswer: it will be announced soon
        rationale: "'Will be announced' + 'soon' (advérbio ao final)."
      - type: english_phrases
        question: Os resultados serão publicados
        correctAnswer: the results will be published
        rationale: "'Will be published' — 'will' invariável. 'Published' particípio."
      - type: english_phrases
        question: Novas regras serão criadas
        correctAnswer: new rules will be created
        rationale: "'Will be created' — 'created' particípio regular. Sem artigo 'new rules'."
      - type: english_phrases
        question: Os alunos serão avaliados
        correctAnswer: the students will be evaluated
        rationale: "'Will be evaluated' — particípio regular. 'The students' específico."
      - type: english_phrases
        question: O evento será organizado pela equipe
        correctAnswer: the event will be organized by the team
        rationale: "'Will be organized by' — agente específico após 'by'."
      - type: english_phrases
        question: A casa será vendida
        correctAnswer: the house will be sold
        rationale: "'Sold' (particípio irregular de sell). 'Will be sold'."
      - type: english_phrases
        question: Você será informado
        correctAnswer: you will be informed
        rationale: "'Will be informed' — particípio regular. 'You' formal."
      - type: english_phrases
        question: O sistema será atualizado
        correctAnswer: the system will be updated
        rationale: "'Updated' particípio regular. 'Will be updated' futuro passivo."
      - type: english_phrases
        question: As propostas serão revisadas
        correctAnswer: the proposals will be reviewed
        rationale: "'Will be reviewed' — plural não altera 'will'. 'Reviewed' particípio."
target: 20
