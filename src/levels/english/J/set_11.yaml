title: ✏️ English J - Advanced Comparisons
level: J
subject: english
difficulty: 4
objectives:
  - B2.grammar.advanced_comparisons
authorNotes: Proportional comparisons (the more...the more), intensifiers (far/much/a lot better), parallel structures (just as...as), and double comparatives.
repeatAll: 2
example: "Ex.: 'Quanto mais ele pratica, melhor fica' → The more he practises, the better he gets."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Proportional & Intensified
    description: The more...the more and comparatives with intensifiers.
    exercises:
      - type: english_phrases
        question: Quanto mais ele pratica, melhor fica
        correctAnswer: The more he practises, the better he gets
        rationale: "'The more...the better' — comparativa proporcional. Estrutura dupla com 'the'."
        difficulty: 2
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Quanto mais cedo você começar, mais rápido terminará
        correctAnswer: The sooner you start, the faster you will finish
        rationale: "Proporcional com advérbios comparativos. 'The sooner...the faster' — ambos com 'the'."
        difficulty: 2
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Este plano é muito melhor do que o anterior
        correctAnswer: This plan is far better than the previous one
        rationale: "'Far better' — intensificador 'far' reforça comparativo. 'The previous one' evita repetição."
        difficulty: 2
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: O novo sistema é bem mais eficiente
        correctAnswer: The new system is much more efficient
        rationale: "'Much more' intensifica comparativo longo. Alternativas: 'far more', 'a lot more'."
        difficulty: 2
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Ela canta tão bem quanto ele
        correctAnswer: She sings just as well as he does
        rationale: "'Just as...as' — igualdade enfática. 'Does' no final (elipse + contraste de sujeitos)."
        difficulty: 2
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Quanto mais tecnologia usamos, mais dependentes ficamos
        correctAnswer: The more technology we use, the more dependent we become
        rationale: "Proporcional com adjetivo: 'the more dependent'. 'Become' = ficar (mudança de estado)."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: O resultado foi ainda pior do que o esperado
        correctAnswer: The result was even worse than expected
        rationale: "'Even worse' — 'even' intensifica comparativo de superioridade negativa."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Ela é de longe a melhor candidata
        correctAnswer: She is by far the best candidate
        rationale: "'By far' + superlativo — intensificador de superlativo. Posição: entre 'is' e 'the best'."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: O problema é maior do que parece
        correctAnswer: The problem is bigger than it seems
        rationale: "'Bigger than it seems' — comparativo com oração subordinada. 'It' retoma 'the problem'."
        difficulty: 2
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Isso é tão importante quanto qualquer outra coisa
        correctAnswer: This is just as important as anything else
        rationale: "'Just as important as anything else' — igualdade com 'anything else' (qualquer outra coisa)."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
  - pageNumber: 2
    title: Complex Comparisons
    description: Double comparatives and less common comparison structures.
    exercises:
      - type: english_phrases
        question: Cada vez mais pessoas usam transporte público
        correctAnswer: More and more people are using public transport
        rationale: "'More and more' = cada vez mais. Presente contínuo para tendência atual."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: O trabalho está ficando cada vez mais difícil
        correctAnswer: The work is getting more and more difficult
        rationale: "'Getting more and more difficult' — 'get' para mudança gradual. Adjetivo longo."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Ele não é tão inteligente quanto você pensa
        correctAnswer: He is not as intelligent as you think
        rationale: "'Not as...as' — igualdade negativa (inferioridade). Mais neutro que 'less intelligent than'."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Quanto menos você se preocupa, melhor você dorme
        correctAnswer: The less you worry, the better you sleep
        rationale: "Proporcional negativa: 'The less...the better'. Advérbio 'better' modifica 'sleep'."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Esta tarefa é consideravelmente mais complexa do que a última
        correctAnswer: This task is considerably more complex than the last one
        rationale: "'Considerably more' — advérbio de grau + comparativo longo. 'The last one' (elipse)."
        difficulty: 4
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Ela é quase tão experiente quanto o gerente
        correctAnswer: She is almost as experienced as the manager
        rationale: "'Almost as...as' — igualdade aproximada. 'Almost' modifica a estrutura comparativa."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: O segundo relatório foi significativamente mais detalhado
        correctAnswer: The second report was significantly more detailed
        rationale: "'Significantly more detailed' — intensificador formal + comparativo. Registo académico."
        difficulty: 4
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Não é tão simples quanto parece
        correctAnswer: It is not as simple as it looks
        rationale: "'Not as simple as it looks' — igualdade negativa. 'Looks' (verbo de ligação sensorial)."
        difficulty: 3
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Quanto mais cuidadosa a análise, mais confiáveis os resultados
        correctAnswer: The more careful the analysis, the more reliable the results
        rationale: "Proporcional sem verbo explícito — estrutura elíptica avançada em inglês formal."
        difficulty: 4
        objectives: [B2.grammar.advanced_comparisons]
      - type: english_phrases
        question: Este modelo é ligeiramente mais caro, porém muito mais durável
        correctAnswer: This model is slightly more expensive but far more durable
        rationale: "'Slightly more' (pequena diferença) vs 'far more' (grande diferença). Contraste com 'but'."
        difficulty: 4
        objectives: [B2.grammar.advanced_comparisons]
target: 20
