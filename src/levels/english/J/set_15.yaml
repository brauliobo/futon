title: ✏️ English J - Formal vs Informal Register
level: J
subject: english
difficulty: 4
objectives:
  - B2.vocabulary.register_formal_informal
authorNotes: Recognising and switching between formal (academic/professional) and informal (conversational) registers in English.
repeatAll: 2
example: "Ex.: 'Preciso de uma força aqui' (informal) → I require some assistance here (formal)."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Informal to Formal
    description: Transform informal phrases into formal equivalents.
    exercises:
      - type: english_phrases
        question: Preciso de uma força aqui (formal)
        correctAnswer: I require some assistance here
        rationale: "'Require' = formal de 'need'. 'Assistance' = formal de 'help'. Sem contrações."
        difficulty: 2
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: A reunião foi uma bagunça total (formal)
        correctAnswer: The meeting was completely disorganised
        rationale: "'Completely disorganised' substitui gíria 'a mess'. Registo neutro-formal."
        difficulty: 2
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: Vou dar uma olhada no relatório (formal)
        correctAnswer: I will review the report
        rationale: "'Review' = formal de 'look at/check'. 'Will' em vez de 'gonna'. Sem contrações."
        difficulty: 2
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: Tipo, não sei o que fazer (formal)
        correctAnswer: I am not certain what course of action to take
        rationale: "Remove marcadores informais ('tipo'). 'Course of action' = opção formal e elaborada."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: Ele foi demitido por ser lerdo demais (formal)
        correctAnswer: He was dismissed due to insufficient performance
        rationale: "'Dismissed' = formal de 'fired'. 'Due to insufficient performance' substitui gíria."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: A empresa está quebrando (formal)
        correctAnswer: The company is facing financial difficulties
        rationale: "'Facing financial difficulties' — eufemismo formal para 'going bankrupt'."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: A gente combinou de se encontrar às três (formal)
        correctAnswer: We agreed to meet at three o'clock
        rationale: "'We agreed to' formal de 'we arranged'. 'At three o'clock' elimina informalidade."
        difficulty: 2
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: O chefe ficou bravo com os resultados (formal)
        correctAnswer: The manager was dissatisfied with the results
        rationale: "'Dissatisfied' = formal de 'upset/angry'. 'Manager' mais neutro que 'boss'."
        difficulty: 2
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: A ideia deles é bem legal (formal)
        correctAnswer: Their proposal is quite innovative
        rationale: "'Proposal' = formal de 'idea'. 'Quite innovative' substitui coloquial 'cool'."
        difficulty: 2
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: Não faz sentido continuar assim (formal)
        correctAnswer: It is not feasible to continue in this manner
        rationale: "'Feasible' = viável/possível. 'In this manner' = forma formal de 'like this'."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
  - pageNumber: 2
    title: Formal to Informal
    description: Transform formal phrases into natural informal equivalents.
    exercises:
      - type: english_phrases
        question: I would like to enquire about the vacancy (informal)
        correctAnswer: I want to ask about the job opening
        rationale: "'Want' substitui 'would like'. 'Ask' substitui 'enquire'. 'Job opening' é informal."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: Your assistance is greatly appreciated (informal)
        correctAnswer: Thanks a lot for your help
        rationale: "'Thanks a lot' = informal de 'greatly appreciated'. 'Help' = informal de 'assistance'."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: I regret to inform you that your application was unsuccessful (informal)
        correctAnswer: I'm sorry to tell you that you didn't get the job
        rationale: "Contrações, vocabulário simples: 'sorry to tell', 'didn't get the job'."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: Kindly refrain from using mobile devices during the session (informal)
        correctAnswer: Please don't use your phone during the session
        rationale: "'Please don't' substitui 'Kindly refrain from'. 'Phone' mais natural que 'mobile device'."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: We would be grateful if you could respond at your earliest convenience (informal)
        correctAnswer: Could you get back to us soon
        rationale: "'Get back to us' = phrasal verb informal. 'Soon' substitui 'at your earliest convenience'."
        difficulty: 4
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: The implementation of said policy has been suspended indefinitely (informal)
        correctAnswer: They've put that policy on hold for now
        rationale: "'Put on hold' = phrasal idiomático informal. 'They've' contração. 'For now' = coloquial."
        difficulty: 4
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: I wish to raise a concern regarding the proposed changes (informal)
        correctAnswer: I've got a problem with the changes they want to make
        rationale: "'I've got a problem with' = informal. 'They want to make' substitui 'proposed'."
        difficulty: 4
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: Further to our discussion, please find the document attached (informal)
        correctAnswer: As we talked about, here's the document
        rationale: "'As we talked about' + 'here's' — conversacional. Elimina jargão de e-mail formal."
        difficulty: 4
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: It has come to our attention that the deadline has not been met (informal)
        correctAnswer: We noticed that you missed the deadline
        rationale: "'We noticed' = informal. 'Missed the deadline' = phrasal mais direto."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
      - type: english_phrases
        question: Subsequent to the meeting, all parties reached a consensus (informal)
        correctAnswer: After the meeting, everyone agreed
        rationale: "'After' = informal de 'subsequent to'. 'Everyone agreed' simplifica 'reached a consensus'."
        difficulty: 3
        objectives: [B2.vocabulary.register_formal_informal]
target: 20
