title: ✏️ English J - Society & Global Issues
level: J
subject: english
difficulty: 4
objectives:
  - B2.vocabulary.society_global_issues
authorNotes: Key B2+ vocabulary for discussing migration, poverty, inequality, human rights, and social justice in academic and journalistic contexts.
repeatAll: 2
example: "Ex.: 'A desigualdade de renda aumentou nas últimas décadas' → Income inequality has increased over the past few decades."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Migration & Inequality
    description: Vocabulary on migration, poverty, and inequality.
    exercises:
      - type: english_phrases
        question: A desigualdade de renda aumentou nas últimas décadas
        correctAnswer: Income inequality has increased over the past few decades
        rationale: "'Income inequality' composto. 'Over the past few decades' = nas últimas décadas."
        difficulty: 2
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: Milhões de pessoas são forçadas a migrar devido a conflitos
        correctAnswer: Millions of people are forced to migrate due to conflict
        rationale: "'Are forced to migrate' = passiva com infinitivo. 'Due to conflict' sem artigo."
        difficulty: 2
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A pobreza extrema afeta comunidades em todo o mundo
        correctAnswer: Extreme poverty affects communities around the world
        rationale: "'Extreme poverty' sem artigo (geral). 'Around the world' = em todo o mundo."
        difficulty: 2
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: Os refugiados muitas vezes enfrentam barreiras significativas à integração
        correctAnswer: Refugees often face significant barriers to integration
        rationale: "'Face barriers to' = encarar obstáculos para. 'Integration' sem artigo."
        difficulty: 2
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A brecha de riqueza entre países ricos e pobres continua a crescer
        correctAnswer: The wealth gap between rich and poor countries continues to grow
        rationale: "'Wealth gap' = brecha/lacuna de riqueza. 'Continues to grow' (tendência contínua)."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A discriminação racial permanece um problema sério em muitas sociedades
        correctAnswer: Racial discrimination remains a serious problem in many societies
        rationale: "'Racial discrimination' sem artigo. 'Remains' (link verb de estado permanente)."
        difficulty: 2
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: Muitos migrantes econômicos buscam melhores oportunidades no exterior
        correctAnswer: Many economic migrants seek better opportunities abroad
        rationale: "'Economic migrants' distinção importante (vs refugiados). 'Abroad' = no exterior."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A exclusão social pode levar a sentimentos de alienação
        correctAnswer: Social exclusion can lead to feelings of alienation
        rationale: "'Social exclusion' + 'lead to' + substantivo. 'Feelings of alienation' plural."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: Governos devem garantir acesso igualitário à educação para todos
        correctAnswer: Governments must ensure equal access to education for all
        rationale: "'Ensure equal access to education' — 'must' obrigação moral. 'For all' no final."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A desigualdade de gênero persiste no local de trabalho
        correctAnswer: Gender inequality persists in the workplace
        rationale: "'Gender inequality' composto. 'Persists in the workplace' — 'workplace' com artigo."
        difficulty: 2
        objectives: [B2.vocabulary.society_global_issues]
  - pageNumber: 2
    title: Rights & Justice
    description: Human rights, justice, and global challenges.
    exercises:
      - type: english_phrases
        question: Cada pessoa tem o direito à liberdade de expressão
        correctAnswer: Every person has the right to freedom of expression
        rationale: "'The right to freedom of expression' — cadeia nominal. 'Every' + singular."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: As mudanças climáticas ameaçam desigualdades a populações vulneráveis
        correctAnswer: Climate change disproportionately threatens vulnerable populations
        rationale: "'Disproportionately threatens' — impacto desproporcional. 'Vulnerable populations'."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A corrupção mina a confiança pública nas instituições
        correctAnswer: Corruption undermines public trust in institutions
        rationale: "'Undermines public trust' = minar confiança. 'In institutions' sem artigo (geral)."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: Organizações de direitos humanos pressionam por reformas
        correctAnswer: Human rights organisations are pushing for reforms
        rationale: "'Pushing for reforms' (presente contínuo = tendência ativa). 'Human rights organisations'."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: O acesso à saúde é considerado um direito fundamental
        correctAnswer: Access to healthcare is considered a fundamental right
        rationale: "'Access to healthcare' sem artigo. 'Is considered' passiva de opinião."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A globalização trouxe benefícios e desafios para economias em desenvolvimento
        correctAnswer: Globalisation has brought both benefits and challenges to developing economies
        rationale: "'Has brought both...and' correlação. 'Developing economies' = economias em desenvolvimento."
        difficulty: 4
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A apatia política leva a baixa participação nas eleições
        correctAnswer: Political apathy leads to low voter turnout
        rationale: "'Voter turnout' = participação eleitoral (expressão técnica). 'Leads to' + substantivo."
        difficulty: 4
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: Sociedades diversas tendem a ser mais inovadoras e resilientes
        correctAnswer: Diverse societies tend to be more innovative and resilient
        rationale: "'Tend to be' = ter tendência. 'Resilient' = resiliente (palavra B2+ importante)."
        difficulty: 3
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A superpopulação coloca pressão sobre os recursos naturais
        correctAnswer: Overpopulation puts pressure on natural resources
        rationale: "'Puts pressure on' = colocar pressão em. 'Natural resources' sem artigo (geral)."
        difficulty: 4
        objectives: [B2.vocabulary.society_global_issues]
      - type: english_phrases
        question: A polarização política dificulta a formulação de políticas públicas eficazes
        correctAnswer: Political polarisation makes effective policymaking more difficult
        rationale: "'Policymaking' palavra composta. 'Makes...more difficult' = dificultar."
        difficulty: 4
        objectives: [B2.vocabulary.society_global_issues]
target: 20
