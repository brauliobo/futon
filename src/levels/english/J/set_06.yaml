title: English J - Active to Passive Transformation
level: J
subject: english
difficulty: 5
objectives:
  - B2.grammar.passive_transformation
authorNotes: Object of active becomes subject of passive; verb changes to 'be + pp'; agent becomes optional 'by + ...'.
repeatAll: 2
example: They built the house → The house was built
pages:
  - pageNumber: 1
    title: Transform Each Active
    description: Rewrite the active sentence as passive.
    exercises:
      - type: english_phrases
        question: "Transforme em passiva: They clean the office"
        correctAnswer: the office is cleaned
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "Transforme: She wrote the book"
        correctAnswer: the book was written by her
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "Transforme: They will announce the results"
        correctAnswer: the results will be announced
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "Transforme: Someone has stolen my bike"
        correctAnswer: my bike has been stolen
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "Transforme: The teacher explains the lesson"
        correctAnswer: the lesson is explained by the teacher
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "Transforme: We must follow the rules"
        correctAnswer: the rules must be followed
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "Transforme: They have cancelled the flight"
        correctAnswer: the flight has been cancelled
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "Transforme: Did he write the letter?"
        correctAnswer: was the letter written by him
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "Transforme: People speak English everywhere"
        correctAnswer: english is spoken everywhere
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "Transforme: Nobody invited me"
        correctAnswer: i was not invited
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Meaningful Passive Choices
    description: Realistic contexts where passive sounds natural.
    exercises:
      - type: english_phrases
        question: O carro foi roubado ontem
        correctAnswer: the car was stolen yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O e-mail foi enviado por engano
        correctAnswer: the email was sent by mistake
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Muitos idiomas são falados aqui
        correctAnswer: many languages are spoken here
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A decisão foi tomada ontem
        correctAnswer: the decision was made yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O prédio está sendo construído
        correctAnswer: the building is being built
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O suspeito foi detido
        correctAnswer: the suspect was detained
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A vacina foi descoberta em 2020
        correctAnswer: the vaccine was discovered in 2020
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Essa canção é tocada em todo lugar
        correctAnswer: that song is played everywhere
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O relatório será publicado na sexta
        correctAnswer: the report will be published on friday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A mensagem não foi recebida
        correctAnswer: the message was not received
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
