title: English J - Active to Passive Transformation
level: J
subject: english
difficulty: 5
objectives: [B2.grammar.passive_transformation]
authorNotes: Object of active becomes subject of passive; verb changes to 'be + pp'; agent becomes optional 'by + ...'.
repeatAll: 2
example: "They built the house → The house was built"
pages:
  - pageNumber: 1
    title: Transform Each Active
    description: Rewrite the active sentence as passive.
    exercises:
      - { type: english_phrases, question: "Transforme em passiva: They clean the office", correctAnswer: the office is cleaned }
      - { type: english_phrases, question: "Transforme: She wrote the book", correctAnswer: the book was written by her }
      - { type: english_phrases, question: "Transforme: They will announce the results", correctAnswer: the results will be announced }
      - { type: english_phrases, question: "Transforme: Someone has stolen my bike", correctAnswer: my bike has been stolen }
      - { type: english_phrases, question: "Transforme: The teacher explains the lesson", correctAnswer: the lesson is explained by the teacher }
      - { type: english_phrases, question: "Transforme: We must follow the rules", correctAnswer: the rules must be followed }
      - { type: english_phrases, question: "Transforme: They have cancelled the flight", correctAnswer: the flight has been cancelled }
      - { type: english_phrases, question: "Transforme: Did he write the letter?", correctAnswer: was the letter written by him }
      - { type: english_phrases, question: "Transforme: People speak English everywhere", correctAnswer: english is spoken everywhere }
      - { type: english_phrases, question: "Transforme: Nobody invited me", correctAnswer: i was not invited }
  - pageNumber: 2
    title: Meaningful Passive Choices
    description: Realistic contexts where passive sounds natural.
    exercises:
      - { type: english_phrases, question: "O carro foi roubado ontem", correctAnswer: the car was stolen yesterday }
      - { type: english_phrases, question: "O e-mail foi enviado por engano", correctAnswer: the email was sent by mistake }
      - { type: english_phrases, question: "Muitos idiomas são falados aqui", correctAnswer: many languages are spoken here }
      - { type: english_phrases, question: "A decisão foi tomada ontem", correctAnswer: the decision was made yesterday }
      - { type: english_phrases, question: "O prédio está sendo construído", correctAnswer: the building is being built }
      - { type: english_phrases, question: "O suspeito foi detido", correctAnswer: the suspect was detained }
      - { type: english_phrases, question: "A vacina foi descoberta em 2020", correctAnswer: the vaccine was discovered in 2020 }
      - { type: english_phrases, question: "Essa canção é tocada em todo lugar", correctAnswer: that song is played everywhere }
      - { type: english_phrases, question: "O relatório será publicado na sexta", correctAnswer: the report will be published on friday }
      - { type: english_phrases, question: "A mensagem não foi recebida", correctAnswer: the message was not received }
target: 20
