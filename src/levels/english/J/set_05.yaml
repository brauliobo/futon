title: English J - Passive Questions & Negatives
level: J
subject: english
difficulty: 4
objectives:
  - B2.grammar.passive
authorNotes: Invert the auxiliary for questions; insert 'not' for negatives.
repeatAll: 2
example: Foi feito? → Was it done? / Não foi feito → It was not done
pages:
  - pageNumber: 1
    title: Yes/No Questions
    description: Invert the first auxiliary.
    exercises:
      - type: english_phrases
        question: Foi feito?
        correctAnswer: was it done
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Foi enviado ontem?
        correctAnswer: was it sent yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você foi convidado?
        correctAnswer: were you invited
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O problema foi resolvido?
        correctAnswer: was the problem solved
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A reunião foi cancelada?
        correctAnswer: was the meeting canceled
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Será pago em dinheiro?
        correctAnswer: will it be paid in cash
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles foram informados?
        correctAnswer: were they informed
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O documento foi assinado?
        correctAnswer: was the document signed
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A chave foi encontrada?
        correctAnswer: was the key found
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: As portas serão fechadas?
        correctAnswer: will the doors be closed
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Wh- Questions & Negatives
    description: Information questions and denials.
    exercises:
      - type: english_phrases
        question: Quando foi construído?
        correctAnswer: when was it built
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Por quem foi escrito?
        correctAnswer: by whom was it written
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Onde é feito?
        correctAnswer: where is it made
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Como foi descoberto?
        correctAnswer: how was it discovered
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Por que foi cancelado?
        correctAnswer: why was it canceled
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Não foi feito
        correctAnswer: it was not done
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Não foi enviado ainda
        correctAnswer: it has not been sent yet
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você não foi avisado?
        correctAnswer: were you not warned
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nada foi perdido
        correctAnswer: nothing was lost
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele não foi convidado
        correctAnswer: he was not invited
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
