title: English J - Passive Mixed Review
level: J
subject: english
difficulty: 5
objectives: [B2.grammar.passive]
authorNotes: Integrate tenses, modals, questions, negatives and reporting passives (is said to / is believed to).
repeatAll: 2
example: "Diz-se que ele está doente → He is said to be ill"
pages:
  - pageNumber: 1
    title: Reporting Passives
    description: "'It is said / believed / reported that ...' and 'to be said to ...'."
    exercises:
      - { type: english_phrases, question: "Diz-se que ele está doente", correctAnswer: he is said to be ill }
      - { type: english_phrases, question: "Acredita-se que o quadro é autêntico", correctAnswer: the painting is believed to be authentic }
      - { type: english_phrases, question: "É dito que eles partiram", correctAnswer: it is said that they left }
      - { type: english_phrases, question: "É relatado que o rio subiu", correctAnswer: it is reported that the river rose }
      - { type: english_phrases, question: "Pensa-se que a ideia é boa", correctAnswer: the idea is thought to be good }
      - { type: english_phrases, question: "Espera-se que chova amanhã", correctAnswer: it is expected to rain tomorrow }
      - { type: english_phrases, question: "É dito que ela foi promovida", correctAnswer: she is said to have been promoted }
      - { type: english_phrases, question: "Acredita-se que ele escreveu o livro", correctAnswer: he is believed to have written the book }
      - { type: english_phrases, question: "Afirma-se que o produto é seguro", correctAnswer: the product is claimed to be safe }
      - { type: english_phrases, question: "Supõe-se que ele esteja viajando", correctAnswer: he is supposed to be traveling }
  - pageNumber: 2
    title: Mixed Everyday Passive
    description: Newsy and practical passive sentences.
    exercises:
      - { type: english_phrases, question: "A loja foi roubada ontem à noite", correctAnswer: the store was robbed last night }
      - { type: english_phrases, question: "A lei precisa ser obedecida", correctAnswer: the law has to be obeyed }
      - { type: english_phrases, question: "Muitas casas foram danificadas", correctAnswer: many houses were damaged }
      - { type: english_phrases, question: "O evento está sendo transmitido ao vivo", correctAnswer: the event is being broadcast live }
      - { type: english_phrases, question: "Vários prêmios foram distribuídos", correctAnswer: several awards were given out }
      - { type: english_phrases, question: "A reunião foi remarcada", correctAnswer: the meeting has been rescheduled }
      - { type: english_phrases, question: "Nenhum acordo foi alcançado", correctAnswer: no agreement was reached }
      - { type: english_phrases, question: "O escritório será realocado", correctAnswer: the office will be relocated }
      - { type: english_phrases, question: "O cachorro foi encontrado saudável", correctAnswer: the dog was found healthy }
      - { type: english_phrases, question: "Nenhuma decisão foi anunciada ainda", correctAnswer: no decision has been announced yet }
target: 20
