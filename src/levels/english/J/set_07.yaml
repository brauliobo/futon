title: English J - Passive Mixed Review
level: J
subject: english
difficulty: 5
objectives:
  - B2.grammar.passive
authorNotes: Integrate tenses, modals, questions, negatives and reporting passives (is said to / is believed to).
repeatAll: 2
example: Diz-se que ele está doente → He is said to be ill
pages:
  - pageNumber: 1
    title: Reporting Passives
    description: "'It is said / believed / reported that ...' and 'to be said to ...'."
    exercises:
      - type: english_phrases
        question: Diz-se que ele está doente
        correctAnswer: he is said to be ill
        rationale: "Modais: modal + be + particípio."
      - type: english_phrases
        question: Acredita-se que o quadro é autêntico
        correctAnswer: the painting is believed to be authentic
        rationale: "Particípio invariável — foque no 'be'."
      - type: english_phrases
        question: É dito que eles partiram
        correctAnswer: it is said that they left
        rationale: "Presente: is/are; passado: was/were; perfect: has been."
      - type: english_phrases
        question: É relatado que o rio subiu
        correctAnswer: it is reported that the river rose
        rationale: "Evite dupla passiva ou 'be' duplicado."
      - type: english_phrases
        question: Pensa-se que a ideia é boa
        correctAnswer: the idea is thought to be good
        rationale: "Futuro: will be + particípio."
      - type: english_phrases
        question: Espera-se que chova amanhã
        correctAnswer: it is expected to rain tomorrow
        rationale: "Negativa e pergunta seguem o auxiliar."
      - type: english_phrases
        question: É dito que ela foi promovida
        correctAnswer: she is said to have been promoted
        rationale: "Todo tempo: be + particípio."
      - type: english_phrases
        question: Acredita-se que ele escreveu o livro
        correctAnswer: he is believed to have written the book
        rationale: "Negativa e pergunta seguem o auxiliar."
      - type: english_phrases
        question: Afirma-se que o produto é seguro
        correctAnswer: the product is claimed to be safe
        rationale: "Evite dupla passiva ou 'be' duplicado."
      - type: english_phrases
        question: Supõe-se que ele esteja viajando
        correctAnswer: he is supposed to be traveling
        rationale: "Futuro: will be + particípio."
  - pageNumber: 2
    title: Mixed Everyday Passive
    description: Newsy and practical passive sentences.
    exercises:
      - type: english_phrases
        question: A loja foi roubada ontem à noite
        correctAnswer: the store was robbed last night
        rationale: "Presente: is/are; passado: was/were; perfect: has been."
      - type: english_phrases
        question: A lei precisa ser obedecida
        correctAnswer: the law has to be obeyed
        rationale: "Particípio invariável — foque no 'be'."
      - type: english_phrases
        question: Muitas casas foram danificadas
        correctAnswer: many houses were damaged
        rationale: "Todo tempo: be + particípio."
      - type: english_phrases
        question: O evento está sendo transmitido ao vivo
        correctAnswer: the event is being broadcast live
        rationale: "Sempre 'be' antes do particípio."
      - type: english_phrases
        question: Vários prêmios foram distribuídos
        correctAnswer: several awards were given out
        rationale: "Identifique o tempo para escolher a forma de 'be'."
      - type: english_phrases
        question: A reunião foi remarcada
        correctAnswer: the meeting has been rescheduled
        rationale: "Todo tempo: be + particípio."
      - type: english_phrases
        question: Nenhum acordo foi alcançado
        correctAnswer: no agreement was reached
        rationale: "Futuro: will be + particípio."
      - type: english_phrases
        question: O escritório será realocado
        correctAnswer: the office will be relocated
        rationale: "Sempre 'be' antes do particípio."
      - type: english_phrases
        question: O cachorro foi encontrado saudável
        correctAnswer: the dog was found healthy
        rationale: "Agente opcional com 'by'."
      - type: english_phrases
        question: Nenhuma decisão foi anunciada ainda
        correctAnswer: no decision has been announced yet
        rationale: "Presente: is/are; passado: was/were; perfect: has been."
target: 20
