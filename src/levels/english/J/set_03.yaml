title: English J - Passive with Modals
level: J
subject: english
difficulty: 4
objectives:
  - B2.grammar.passive_modals
authorNotes: Modal + be + past participle. Signals rules, possibilities, and advice applied to an object.
repeatAll: 2
example: Deve ser feito → It must be done
pages:
  - pageNumber: 1
    title: Must / Should / Can Be
    description: Rules, advice, capability in the passive.
    exercises:
      - type: english_phrases
        question: Deve ser feito com cuidado
        correctAnswer: it must be done carefully
        rationale: "'Must be done' (modal + be + particípio). 'Carefully' advérbio."
      - type: english_phrases
        question: Deve ser enviado hoje
        correctAnswer: it should be sent today
        rationale: "'Should be sent' — 'sent' (particípio de send). 'Today' ao final."
      - type: english_phrases
        question: Pode ser resolvido
        correctAnswer: it can be solved
        rationale: "'Can be solved' — 'solved' (particípio regular). Modal + be + pp."
      - type: english_phrases
        question: Precisa ser revisado
        correctAnswer: it needs to be reviewed
        rationale: "'Needs to be reviewed' — 'need' exige 'to be'. 'Reviewed' particípio."
      - type: english_phrases
        question: Não deve ser esquecido
        correctAnswer: it must not be forgotten
        rationale: "'Must not be forgotten' — 'forgotten' (particípio irregular de forget)."
      - type: english_phrases
        question: Deveria ser evitado
        correctAnswer: it should be avoided
        rationale: "'Should be avoided' — conselho. 'Avoided' particípio regular."
      - type: english_phrases
        question: Pode ser melhorado
        correctAnswer: it can be improved
        rationale: "'Can be improved' — possibilidade. 'Improved' (regular +ed)."
      - type: english_phrases
        question: Não pode ser trocado
        correctAnswer: it cannot be changed
        rationale: "'Cannot be changed' — 'cannot' junto. 'Changed' particípio."
      - type: english_phrases
        question: Tem que ser aprovado pelo gerente
        correctAnswer: it has to be approved by the manager
        rationale: "'Has to be approved' (3ª pessoa). 'By the manager' (agente)."
      - type: english_phrases
        question: Deve ser feito até sexta
        correctAnswer: it must be done by friday
        rationale: "'Must be done by Friday' — 'by' = prazo-limite. 'Done' particípio."
  - pageNumber: 2
    title: Passive in Instructions
    description: Manuals and signs rely on passive modals.
    exercises:
      - type: english_phrases
        question: A porta deve ser mantida fechada
        correctAnswer: the door must be kept closed
        rationale: "'Be kept closed' — 'kept' (particípio de keep) + 'closed' (adj)."
      - type: english_phrases
        question: Capacetes devem ser usados
        correctAnswer: helmets must be worn
        rationale: "'Worn' (particípio irregular de wear). 'Helmets' sem artigo (genérico)."
      - type: english_phrases
        question: Animais não podem ser alimentados
        correctAnswer: animals cannot be fed
        rationale: "'Fed' (particípio irregular de feed). 'Cannot' + be + pp."
      - type: english_phrases
        question: Fotografias não podem ser tiradas
        correctAnswer: photographs cannot be taken
        rationale: "'Taken' (particípio de take). 'Take a photograph' = tirar foto."
      - type: english_phrases
        question: O formulário deve ser preenchido
        correctAnswer: the form must be filled out
        rationale: "'Fill out' phrasal = preencher. 'Be filled out' (passiva)."
      - type: english_phrases
        question: A taxa deve ser paga antecipadamente
        correctAnswer: the fee must be paid in advance
        rationale: "'Paid' (particípio de pay). 'In advance' = antecipadamente."
      - type: english_phrases
        question: Crianças devem ser acompanhadas
        correctAnswer: children must be accompanied
        rationale: "'Children' (plural irregular). 'Accompanied' particípio (y → ied)."
      - type: english_phrases
        question: O software deve ser instalado primeiro
        correctAnswer: the software must be installed first
        rationale: "'Installed' particípio regular. 'First' = primeiro, advérbio."
      - type: english_phrases
        question: Visitantes devem ser registrados
        correctAnswer: visitors must be registered
        rationale: "'Registered' particípio regular. 'Visitors' plural sem artigo."
      - type: english_phrases
        question: As regras devem ser obedecidas
        correctAnswer: the rules must be obeyed
        rationale: "'Obeyed' (particípio regular). 'The rules' específico."
target: 20
