title: English J - Passive with Modals
level: J
subject: english
difficulty: 4
objectives: [B2.grammar.passive_modals]
authorNotes: Modal + be + past participle. Signals rules, possibilities, and advice applied to an object.
repeatAll: 2
example: "Deve ser feito → It must be done"
pages:
  - pageNumber: 1
    title: Must / Should / Can Be
    description: Rules, advice, capability in the passive.
    exercises:
      - { type: english_phrases, question: "Deve ser feito com cuidado", correctAnswer: it must be done carefully }
      - { type: english_phrases, question: "Deve ser enviado hoje", correctAnswer: it should be sent today }
      - { type: english_phrases, question: "Pode ser resolvido", correctAnswer: it can be solved }
      - { type: english_phrases, question: "Precisa ser revisado", correctAnswer: it needs to be reviewed }
      - { type: english_phrases, question: "Não deve ser esquecido", correctAnswer: it must not be forgotten }
      - { type: english_phrases, question: "Deveria ser evitado", correctAnswer: it should be avoided }
      - { type: english_phrases, question: "Pode ser melhorado", correctAnswer: it can be improved }
      - { type: english_phrases, question: "Não pode ser trocado", correctAnswer: it cannot be changed }
      - { type: english_phrases, question: "Tem que ser aprovado pelo gerente", correctAnswer: it has to be approved by the manager }
      - { type: english_phrases, question: "Deve ser feito até sexta", correctAnswer: it must be done by friday }
  - pageNumber: 2
    title: Passive in Instructions
    description: Manuals and signs rely on passive modals.
    exercises:
      - { type: english_phrases, question: "A porta deve ser mantida fechada", correctAnswer: the door must be kept closed }
      - { type: english_phrases, question: "Capacetes devem ser usados", correctAnswer: helmets must be worn }
      - { type: english_phrases, question: "Animais não podem ser alimentados", correctAnswer: animals cannot be fed }
      - { type: english_phrases, question: "Fotografias não podem ser tiradas", correctAnswer: photographs cannot be taken }
      - { type: english_phrases, question: "O formulário deve ser preenchido", correctAnswer: the form must be filled out }
      - { type: english_phrases, question: "A taxa deve ser paga antecipadamente", correctAnswer: the fee must be paid in advance }
      - { type: english_phrases, question: "Crianças devem ser acompanhadas", correctAnswer: children must be accompanied }
      - { type: english_phrases, question: "O software deve ser instalado primeiro", correctAnswer: the software must be installed first }
      - { type: english_phrases, question: "Visitantes devem ser registrados", correctAnswer: visitors must be registered }
      - { type: english_phrases, question: "As regras devem ser obedecidas", correctAnswer: the rules must be obeyed }
target: 20
