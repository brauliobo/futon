title: ✏️ English J - Summary & Paraphrase
level: J
subject: english
difficulty: 4
objectives:
  - B2.skills.summary_paraphrase
authorNotes: Rephrasing and paraphrasing key ideas using different grammar structures and synonyms. Essential skill for B2+ writing and reading comprehension.
repeatAll: 2
example: "Ex.: 'Apesar do alto custo, muitas pessoas compram produtos de luxo' → Although luxury products are expensive, many people still buy them."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Rephrasing with Different Structure
    description: Express the same idea using a different grammatical structure.
    exercises:
      - type: english_phrases
        question: Apesar do alto custo, muitas pessoas compram produtos de luxo (com "although")
        correctAnswer: Although luxury products are expensive, many people still buy them
        rationale: "Preposição 'despite' → concessão com 'although + oração'. 'Still' reforça contraste."
        difficulty: 2
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: Ele não conseguiu o emprego porque não tinha experiência (com "due to")
        correctAnswer: He did not get the job due to his lack of experience
        rationale: "'Due to + substantivo' substitui 'because + oração'. 'Lack of experience' nominalização."
        difficulty: 2
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: O projeto foi cancelado porque os custos eram muito altos (com "owing to")
        correctAnswer: The project was cancelled owing to the high costs
        rationale: "'Owing to' = formal de 'because of'. 'The high costs' (com artigo, específico)."
        difficulty: 2
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: É difícil para os jovens encontrar empregos hoje (com "young people find it")
        correctAnswer: Young people find it difficult to find jobs today
        rationale: "'Find it difficult to' — reformulação com sujeito ativo. 'It' expletivo com adjetivo."
        difficulty: 2
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: A empresa não investiu no projeto, então ele fracassou (com "as a result")
        correctAnswer: The company did not invest in the project; as a result, it failed
        rationale: "'As a result' substitui 'so'. Ponto-e-vírgula antes do conector de resultado."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: Muitos estudantes reprovam porque não estudam o suficiente (com "failure to")
        correctAnswer: Failure to study enough leads to many students failing
        rationale: "'Failure to + infinitivo' = nominalização da causa. 'Leads to...failing' (gerúndio)."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: A tecnologia mudou a forma como trabalhamos (com "has had a significant impact")
        correctAnswer: Technology has had a significant impact on the way we work
        rationale: "'Has had a significant impact on' = reformulação enfática. 'The way we work' = como."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: Ele era muito talentoso para ser ignorado (com "too...to be")
        correctAnswer: He was too talented to be ignored
        rationale: "'Too + adjetivo + to be + particípio' — 'too' negativo implícito + passiva."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: A falta de sono prejudica a concentração (com "sleep deprivation")
        correctAnswer: Sleep deprivation has a negative effect on concentration
        rationale: "'Sleep deprivation' = falta de sono (termo académico). 'Negative effect on'."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: As pessoas que moram em cidades grandes enfrentam mais stress (com "urban residents")
        correctAnswer: Urban residents tend to experience higher levels of stress
        rationale: "'Urban residents' = quem mora em cidade. 'Tend to experience higher levels of'."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
  - pageNumber: 2
    title: Summarising Key Ideas
    description: Summarise longer ideas concisely using appropriate vocabulary.
    exercises:
      - type: english_phrases
        question: Em resumo, o relatório mostra que as vendas caíram no último trimestre
        correctAnswer: In summary, the report shows that sales declined in the last quarter
        rationale: "'In summary' = em resumo (conector de conclusão). 'Declined' formal de 'fell/dropped'."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: Em linhas gerais, a proposta sugere uma redução nos gastos públicos
        correctAnswer: In broad terms, the proposal suggests a reduction in public spending
        rationale: "'In broad terms' = em linhas gerais. 'A reduction in' nominalização formal."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: O argumento central do artigo é que a educação reduz a pobreza
        correctAnswer: The central argument of the article is that education reduces poverty
        rationale: "'Central argument' colocação académica. 'Is that' + 'that-clause' como predicativo."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: Os autores concluem que intervenção precoce é fundamental
        correctAnswer: The authors conclude that early intervention is crucial
        rationale: "'Conclude that' verbo de reporte académico. 'Early intervention' composto nominal."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: O ponto principal é que investir em infraestrutura gera crescimento econômico
        correctAnswer: The main point is that investing in infrastructure drives economic growth
        rationale: "'The main point is that' + 'that-clause'. 'Drives growth' = impulsionar crescimento."
        difficulty: 4
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: Para resumir, as evidências apoiam a necessidade de reforma política
        correctAnswer: To summarise, the evidence supports the need for policy reform
        rationale: "'To summarise' (BrE) conector. 'Supports the need for' colocação formal."
        difficulty: 4
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: Em outras palavras, a empresa precisa mudar sua estratégia de marketing
        correctAnswer: In other words, the company needs to revise its marketing strategy
        rationale: "'In other words' = em outras palavras. 'Revise' = rever/reformular (formal)."
        difficulty: 3
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: O que o texto quer dizer é que ambos os lados precisam ceder
        correctAnswer: What the text implies is that both sides need to compromise
        rationale: "'What...implies' = paráfrase de ideia implícita. 'Compromise' = ceder/chegar a acordo."
        difficulty: 4
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: Dito de outra forma, mudança climática é uma ameaça existencial
        correctAnswer: Put differently, climate change poses an existential threat
        rationale: "'Put differently' = conector de reformulação. 'Poses a threat' colocação formal."
        difficulty: 4
        objectives: [B2.skills.summary_paraphrase]
      - type: english_phrases
        question: A ideia central é que mais não é necessariamente melhor
        correctAnswer: The underlying idea is that more is not necessarily better
        rationale: "'Underlying idea' = ideia central/subjacente. 'Not necessarily' = não necessariamente."
        difficulty: 4
        objectives: [B2.skills.summary_paraphrase]
target: 20
