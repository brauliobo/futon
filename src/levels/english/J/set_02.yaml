title: English J - Passive Past
level: J
subject: english
difficulty: 3
objectives:
  - B2.grammar.passive_past
authorNotes: Was/were + past participle. Typical in news and historical reports.
repeatAll: 2
example: A carta foi enviada ontem → The letter was sent yesterday
pages:
  - pageNumber: 1
    title: Simple Past Passive
    description: Past events told from the object's perspective.
    exercises:
      - type: english_phrases
        question: A carta foi enviada ontem
        correctAnswer: the letter was sent yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O prédio foi construído em 1950
        correctAnswer: the building was built in 1950
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O livro foi escrito no século XIX
        correctAnswer: the book was written in the nineteenth century
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O ladrão foi preso ontem
        correctAnswer: the thief was arrested yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: As árvores foram plantadas no ano passado
        correctAnswer: the trees were planted last year
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O quadro foi pintado por Picasso
        correctAnswer: the painting was painted by picasso
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A reunião foi cancelada
        correctAnswer: the meeting was canceled
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Os documentos foram perdidos
        correctAnswer: the documents were lost
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O problema foi resolvido rapidamente
        correctAnswer: the problem was solved quickly
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O prêmio foi entregue ontem
        correctAnswer: the prize was given yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Past Passive in Context
    description: News-style and historical sentences.
    exercises:
      - type: english_phrases
        question: A ponte foi destruída na tempestade
        correctAnswer: the bridge was destroyed in the storm
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O ministro foi informado ontem à noite
        correctAnswer: the minister was informed last night
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O paciente foi operado pela manhã
        correctAnswer: the patient was operated in the morning
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A Amazônia foi explorada por séculos
        correctAnswer: the amazon was explored for centuries
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O prédio foi inaugurado em 2001
        correctAnswer: the building was opened in 2001
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: As propostas foram aprovadas
        correctAnswer: the proposals were approved
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A lei foi aprovada ontem
        correctAnswer: the law was passed yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O filme foi dirigido por ela
        correctAnswer: the movie was directed by her
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O jogador foi contratado em julho
        correctAnswer: the player was signed in july
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A música foi gravada em Londres
        correctAnswer: the song was recorded in london
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
