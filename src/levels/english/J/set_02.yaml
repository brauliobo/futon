title: English J - Passive Past
level: J
subject: english
difficulty: 3
objectives: [B2.grammar.passive_past]
authorNotes: Was/were + past participle. Typical in news and historical reports.
repeatAll: 2
example: "A carta foi enviada ontem → The letter was sent yesterday"
pages:
  - pageNumber: 1
    title: Simple Past Passive
    description: Past events told from the object's perspective.
    exercises:
      - { type: english_phrases, question: "A carta foi enviada ontem", correctAnswer: the letter was sent yesterday }
      - { type: english_phrases, question: "O prédio foi construído em 1950", correctAnswer: the building was built in 1950 }
      - { type: english_phrases, question: "O livro foi escrito no século XIX", correctAnswer: the book was written in the nineteenth century }
      - { type: english_phrases, question: "O ladrão foi preso ontem", correctAnswer: the thief was arrested yesterday }
      - { type: english_phrases, question: "As árvores foram plantadas no ano passado", correctAnswer: the trees were planted last year }
      - { type: english_phrases, question: "O quadro foi pintado por Picasso", correctAnswer: the painting was painted by picasso }
      - { type: english_phrases, question: "A reunião foi cancelada", correctAnswer: the meeting was canceled }
      - { type: english_phrases, question: "Os documentos foram perdidos", correctAnswer: the documents were lost }
      - { type: english_phrases, question: "O problema foi resolvido rapidamente", correctAnswer: the problem was solved quickly }
      - { type: english_phrases, question: "O prêmio foi entregue ontem", correctAnswer: the prize was given yesterday }
  - pageNumber: 2
    title: Past Passive in Context
    description: News-style and historical sentences.
    exercises:
      - { type: english_phrases, question: "A ponte foi destruída na tempestade", correctAnswer: the bridge was destroyed in the storm }
      - { type: english_phrases, question: "O ministro foi informado ontem à noite", correctAnswer: the minister was informed last night }
      - { type: english_phrases, question: "O paciente foi operado pela manhã", correctAnswer: the patient was operated in the morning }
      - { type: english_phrases, question: "A Amazônia foi explorada por séculos", correctAnswer: the amazon was explored for centuries }
      - { type: english_phrases, question: "O prédio foi inaugurado em 2001", correctAnswer: the building was opened in 2001 }
      - { type: english_phrases, question: "As propostas foram aprovadas", correctAnswer: the proposals were approved }
      - { type: english_phrases, question: "A lei foi aprovada ontem", correctAnswer: the law was passed yesterday }
      - { type: english_phrases, question: "O filme foi dirigido por ela", correctAnswer: the movie was directed by her }
      - { type: english_phrases, question: "O jogador foi contratado em julho", correctAnswer: the player was signed in july }
      - { type: english_phrases, question: "A música foi gravada em Londres", correctAnswer: the song was recorded in london }
target: 20
