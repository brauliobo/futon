title: ✏️ English J - Academic Vocabulary: Science & Research
level: J
subject: english
difficulty: 4
objectives:
  - B2.vocabulary.academic_science_research
authorNotes: Academic vocabulary for science and research contexts including hypothesis, methodology, findings, evidence, peer review, and data interpretation.
repeatAll: 2
example: "Ex.: 'Os pesquisadores formularam uma hipótese para explicar os resultados' → The researchers formulated a hypothesis to explain the results."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Research Process
    description: Vocabulary for describing the scientific and research process.
    exercises:
      - type: english_phrases
        question: Os pesquisadores formularam uma hipótese para explicar os resultados
        correctAnswer: The researchers formulated a hypothesis to explain the results
        rationale: "'Formulate a hypothesis' = formular hipótese. Colocação académica padrão."
        difficulty: 2
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: O estudo usou uma metodologia mista de pesquisa
        correctAnswer: The study used a mixed research methodology
        rationale: "'Mixed research methodology' — ordem padrão de adjetivos em inglês académico."
        difficulty: 2
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: Os resultados foram consistentes com a hipótese inicial
        correctAnswer: The findings were consistent with the initial hypothesis
        rationale: "'Findings' (pl.) = resultados de pesquisa. 'Consistent with' = coerente com."
        difficulty: 2
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: Os dados foram coletados por meio de questionários e entrevistas
        correctAnswer: The data were collected through questionnaires and interviews
        rationale: "'Data were' (plural académico). 'Through' = por meio de. Dois métodos com 'and'."
        difficulty: 2
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: A amostra consistia em duzentos participantes adultos
        correctAnswer: The sample consisted of two hundred adult participants
        rationale: "'Consisted of' = era composta de. 'Adult participants' ordem adjetivo-substantivo."
        difficulty: 2
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: A pesquisa visa identificar padrões no comportamento do consumidor
        correctAnswer: The research aims to identify patterns in consumer behaviour
        rationale: "'Aims to identify' = visa identificar. 'Consumer behaviour' composto nominal."
        difficulty: 3
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: Os resultados sugerem uma forte correlação entre as duas variáveis
        correctAnswer: The findings suggest a strong correlation between the two variables
        rationale: "'Suggest a correlation between' — vocabulário estatístico padrão. 'Strong' (colocação)."
        difficulty: 3
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: O experimento foi conduzido em condições controladas
        correctAnswer: The experiment was conducted under controlled conditions
        rationale: "'Conducted under controlled conditions' — passiva + preposição 'under' (condições)."
        difficulty: 2
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: São necessárias mais pesquisas para confirmar esses achados
        correctAnswer: Further research is needed to confirm these findings
        rationale: "'Further research is needed' — passiva impessoal académica. 'Further' = adicional."
        difficulty: 3
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: O quadro teórico fundamenta a análise do estudo
        correctAnswer: The theoretical framework underpins the study's analysis
        rationale: "'Underpins' = fundamentar/sustentar. 'Theoretical framework' composto chave."
        difficulty: 3
        objectives: [B2.vocabulary.academic_science_research]
  - pageNumber: 2
    title: Evidence & Conclusions
    description: Evaluating evidence and drawing conclusions in academic writing.
    exercises:
      - type: english_phrases
        question: As evidências indicam que o tratamento foi eficaz
        correctAnswer: The evidence indicates that the treatment was effective
        rationale: "'Evidence indicates that' — 'evidence' incontável com 'the'. 'Effective' colocação."
        difficulty: 3
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: O artigo foi submetido para revisão por pares antes da publicação
        correctAnswer: The paper was submitted for peer review before publication
        rationale: "'Peer review' = revisão por pares (processo científico). 'Before publication' sem artigo."
        difficulty: 3
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: Os autores reconhecem as limitações do estudo
        correctAnswer: The authors acknowledge the limitations of the study
        rationale: "'Acknowledge the limitations' — colocação académica padrão em secção de discussão."
        difficulty: 3
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: Os resultados contradizem estudos anteriores sobre o assunto
        correctAnswer: The results contradict previous studies on the subject
        rationale: "'Contradict previous studies' = contradizer. 'On the subject' = sobre o tema."
        difficulty: 3
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: Concluiu-se que a variável independente teve impacto significativo
        correctAnswer: It was concluded that the independent variable had a significant impact
        rationale: "'It was concluded that' — passiva impessoal académica. 'Significant impact'."
        difficulty: 4
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: Os dados qualitativos complementaram as descobertas quantitativas
        correctAnswer: The qualitative data complemented the quantitative findings
        rationale: "'Qualitative' vs 'quantitative' — distinção metodológica fundamental. 'Complemented'."
        difficulty: 4
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: A validade do estudo foi questionada por vários revisores
        correctAnswer: The validity of the study was questioned by several reviewers
        rationale: "'Validity' = validade (conceito de pesquisa). Passiva com 'by several reviewers'."
        difficulty: 4
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: O estudo revelou uma lacuna significativa na literatura existente
        correctAnswer: The study revealed a significant gap in the existing literature
        rationale: "'Gap in the literature' — expressão académica padrão. 'Existing literature' colocação."
        difficulty: 4
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: As implicações deste estudo são relevantes para a prática clínica
        correctAnswer: The implications of this study are relevant to clinical practice
        rationale: "'Implications...are relevant to' colocação académica. 'Clinical practice' sem artigo."
        difficulty: 4
        objectives: [B2.vocabulary.academic_science_research]
      - type: english_phrases
        question: Pesquisas futuras deveriam examinar o papel dos fatores contextuais
        correctAnswer: Future research should examine the role of contextual factors
        rationale: "'Future research should' — recomendação académica. 'Contextual factors' composto."
        difficulty: 4
        objectives: [B2.vocabulary.academic_science_research]
target: 20
