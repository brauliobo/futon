title: ✏️ English J - Result & Consequence
level: J
subject: english
difficulty: 4
objectives:
  - B2.grammar.result_consequence
authorNotes: Expressing result with 'such...that', 'so...that', 'as a result', 'consequently', 'result in', 'lead to', and 'therefore'.
repeatAll: 2
example: "Ex.: 'Foi um erro tão grave que custou o emprego dele' → It was such a serious mistake that it cost him his job."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: So...That & Such...That
    description: Expressing degree and consequence.
    exercises:
      - type: english_phrases
        question: Ela estava tão cansada que dormiu imediatamente
        correctAnswer: She was so tired that she fell asleep immediately
        rationale: "'So + adjetivo + that' — grau e resultado. 'Fell asleep' (não 'slept') = adormecer."
        difficulty: 2
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Foi um erro tão grave que custou o emprego dele
        correctAnswer: It was such a serious mistake that it cost him his job
        rationale: "'Such + artigo + adjetivo + substantivo + that' — resultado com substantivo."
        difficulty: 2
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Havia tanto barulho que não conseguíamos nos concentrar
        correctAnswer: There was so much noise that we could not concentrate
        rationale: "'So much + incontável + that'. 'Could not concentrate' (inabilidade circunstancial)."
        difficulty: 2
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Havia tantos erros que o relatório teve que ser reescrito
        correctAnswer: There were so many errors that the report had to be rewritten
        rationale: "'So many + plural countable + that'. 'Had to be rewritten' (obrigação + passiva)."
        difficulty: 2
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Foi uma apresentação tão impressionante que todos aplaudiram
        correctAnswer: It was such an impressive presentation that everyone applauded
        rationale: "'Such an impressive presentation' — 'an' antes de vogal. 'Everyone' + singular."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Eles tinham pouco tempo que mal conseguiram terminar
        correctAnswer: They had so little time that they barely managed to finish
        rationale: "'So little + incontável + that'. 'Barely managed to' = mal conseguiu."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Ela cometeu tantos erros que perdeu a confiança
        correctAnswer: She made so many mistakes that she lost confidence
        rationale: "'Make mistakes' (não 'do'). 'Lost confidence' — sem artigo (confiança em geral)."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: A notícia foi tão chocante que ficamos em silêncio por um tempo
        correctAnswer: The news was so shocking that we were silent for a while
        rationale: "'So shocking that' — 'news' é singular. 'For a while' = por algum tempo."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Foi um sucesso tão grande que o produziram novamente
        correctAnswer: It was such a great success that they produced it again
        rationale: "'Such a great success' — substantivo contável. 'They produced it again' = ativo."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Ele falou tão devagar que todos entenderam
        correctAnswer: He spoke so slowly that everyone understood
        rationale: "'So + advérbio + that' — 'slowly' advérbio de modo. Resultado positivo."
        difficulty: 2
        objectives: [B2.grammar.result_consequence]
  - pageNumber: 2
    title: Connectors of Result
    description: Using 'as a result', 'consequently', 'therefore', 'lead to', 'result in'.
    exercises:
      - type: english_phrases
        question: O projeto atrasou; como resultado, perdemos o contrato
        correctAnswer: The project was delayed; as a result, we lost the contract
        rationale: "'As a result' — conector de resultado entre orações. Ponto-e-vírgula ou nova frase."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Os custos aumentaram consideravelmente. Consequentemente, o preço subiu
        correctAnswer: Costs increased considerably. Consequently, the price went up
        rationale: "'Consequently' — formal. 'Went up' (phrasal verb = aumentar preço)."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Não preparei suficientemente; portanto, reprovei
        correctAnswer: I did not prepare enough; therefore, I failed
        rationale: "'Therefore' — lógico/formal. 'Failed' = reprovar/fracassar. Posição após ponto-e-vírgula."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: A falta de sono levou a um desempenho fraco
        correctAnswer: The lack of sleep led to poor performance
        rationale: "'Lead to' (resultado) — 'led to' passado. 'Poor performance' sem artigo (geral)."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: O stress crônico pode resultar em problemas de saúde
        correctAnswer: Chronic stress can result in health problems
        rationale: "'Result in' — consequência direta. 'Can' possibilidade. 'Chronic' pré-nominal."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: O erro foi identificado cedo, evitando assim maiores danos
        correctAnswer: The error was identified early, thus preventing further damage
        rationale: "'Thus + particípio presente' — conector formal de resultado/consequência."
        difficulty: 4
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: A decisão gerou muita controvérsia, fazendo com que a empresa recuasse
        correctAnswer: The decision caused a lot of controversy, causing the company to back down
        rationale: "Participial clause: 'causing the company to back down'. 'Back down' = recuar."
        difficulty: 4
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: As novas políticas resultaram em maior satisfação dos funcionários
        correctAnswer: The new policies resulted in greater employee satisfaction
        rationale: "'Resulted in' + substantivo. 'Greater' (comparativo de 'great'). Sem artigo."
        difficulty: 4
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: O atraso acarretou pesadas multas para a empresa
        correctAnswer: The delay resulted in heavy fines for the company
        rationale: "'Resulted in heavy fines' — 'heavy fines' (multas pesadas). 'For the company'."
        difficulty: 3
        objectives: [B2.grammar.result_consequence]
      - type: english_phrases
        question: Sua falta de comunicação acabou por minar toda a confiança
        correctAnswer: Their lack of communication ultimately undermined all trust
        rationale: "'Ultimately' — advérbio de resultado final. 'Undermined' = minar (passado simples)."
        difficulty: 4
        objectives: [B2.grammar.result_consequence]
target: 20
