title: 📅 English 2A - Meses do ano
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.months
authorNotes: Os doze meses do ano em inglês — January a December.
repeatAll: 2
example: "Ex.: 'My birthday is in June.' 'December is a cold month.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Meses — Janeiro a Junho
    description: Aprenda os primeiros seis meses do ano.
    exercises:
      - type: english_vocab
        question: Como se diz 'janeiro' em inglês?
        correctAnswer: January
        rationale: "'January' = janeiro. Primeiro mês do ano."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'fevereiro' em inglês?
        correctAnswer: February
        rationale: "'February' = fevereiro. O mês mais curto."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'março' em inglês?
        correctAnswer: March
        rationale: "'March' = março."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'abril' em inglês?
        correctAnswer: April
        rationale: "'April' = abril."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'maio' em inglês?
        correctAnswer: May
        rationale: "'May' = maio."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'junho' em inglês?
        correctAnswer: June
        rationale: "'June' = junho."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Qual mês vem depois de 'March'?
        correctAnswer: April
        rationale: "Depois de March (março) vem April (abril)."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: "Complete a sequência: 'January, February, ___.' (março)"
        correctAnswer: March
        rationale: "'January, February, March' — jan, fev, mar."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Os meses em inglês são escritos com letra...?
        correctAnswer: maiúscula
        rationale: "Em inglês, todos os meses começam com maiúscula: January, February..."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: "Complete: 'My birthday is in ___.' (seu mês de aniversário)"
        correctAnswer: January / February / March / April / May / June
        rationale: "Use 'in' com meses. 'My birthday is in June.' — Resposta pessoal."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
  - pageNumber: 2
    title: Meses — Julho a Dezembro
    description: Aprenda os últimos seis meses do ano.
    exercises:
      - type: english_vocab
        question: Como se diz 'julho' em inglês?
        correctAnswer: July
        rationale: "'July' = julho."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'agosto' em inglês?
        correctAnswer: August
        rationale: "'August' = agosto."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'setembro' em inglês?
        correctAnswer: September
        rationale: "'September' = setembro."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'outubro' em inglês?
        correctAnswer: October
        rationale: "'October' = outubro."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'novembro' em inglês?
        correctAnswer: November
        rationale: "'November' = novembro."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Como se diz 'dezembro' em inglês?
        correctAnswer: December
        rationale: "'December' = dezembro. O último mês do ano."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: "Complete a sequência: 'September, October, ___.' (novembro)"
        correctAnswer: November
        rationale: "'September, October, November' — set, out, nov."
        difficulty: 1
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Escreva os doze meses em inglês
        correctAnswer: January, February, March, April, May, June, July, August, September, October, November, December
        rationale: "Os 12 meses: January, February, March, April, May, June, July, August, September, October, November, December."
        difficulty: 2
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Qual é o último mês do ano em inglês?
        correctAnswer: December
        rationale: "'December' = dezembro. O 12º mês."
        difficulty: 2
        objectives: [pre-A1.vocab.months]
      - type: english_vocab
        question: Qual mês tem menos dias?
        correctAnswer: February
        rationale: "'February' = fevereiro. Tem 28 ou 29 dias."
        difficulty: 2
        objectives: [pre-A1.vocab.months]
target: 20
