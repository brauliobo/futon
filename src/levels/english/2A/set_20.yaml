title: ✅ English 2A - Revisão geral
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Revisão completa do nível 2A — plural, conjugação, perguntas e frases.
repeatAll: 2
example: "Ex.: 'Does she have a dog? No, she doesn't.' 'How many cats do you have?'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Revisão — Gramática
    description: Revise plural, to be, have, presente simples e negativas.
    exercises:
      - type: english_vocab
        question: Escreva o plural: cat, box, baby, man
        correctAnswer: cats, boxes, babies, men
        rationale: "cat→cats (+s), box→boxes (+es), baby→babies (y→ies), man→men (irregular)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete 'to be' nas 6 pessoas
        correctAnswer: I am, you are, he/she/it is, we are, you are, they are
        rationale: "am (I), is (he/she/it), are (you/we/they)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete 'have' nas 6 pessoas
        correctAnswer: I have, you have, he/she/it has, we have, you have, they have
        rationale: "have (I/you/we/they), has (he/she/it)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Forme a negativa: 'She likes cats.' (doesn't)
        correctAnswer: She doesn't like cats.
        rationale: "'She doesn't like cats.' — 'likes' → 'doesn't like'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Forme a negativa: 'They have a dog.' (don't)
        correctAnswer: They don't have a dog.
        rationale: "'They don't have a dog.' — 'have' → 'don't have'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'She ___ basketball. She ___ cook.' (plays/doesn't)
        correctAnswer: plays, doesn't
        rationale: "'She plays basketball. She doesn't cook.' — Afirmativa e negativa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o gerúndio de: swim, dance, run?
        correctAnswer: swimming, dancing, running
        rationale: "swim→swimming (dobra+ing), dance→dancing (remove e+ing), run→running (dobra+ing)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Escreva os meses de 1 a 6 em inglês
        correctAnswer: January, February, March, April, May, June
        rationale: "Janeiro a junho: January, February, March, April, May, June."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Escreva os ordinais de 1 a 5 em inglês
        correctAnswer: first, second, third, fourth, fifth
        rationale: "1st-5th: first, second, third, fourth, fifth."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual a diferença entre 'Do' e 'Does' para perguntas?
        correctAnswer: Do = I/you/we/they, Does = he/she/it
        rationale: "'Do you...?' para I/you/we/they. 'Does she...?' para he/she/it."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Revisão — Perguntas e frases
    description: Pratique as estruturas de perguntas e frases do nível 2A.
    exercises:
      - type: english_vocab
        question: Como se diz 'De onde você é?' em inglês?
        correctAnswer: Where are you from?
        rationale: "'Where are you from?' — Pergunta sobre origem."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quantos anos você tem?' em inglês?
        correctAnswer: How old are you?
        rationale: "'How old are you?' — Pergunta de idade."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quando é seu aniversário?' em inglês?
        correctAnswer: When is your birthday?
        rationale: "'When is your birthday?' — 'when' = quando."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'De que cor é isso?' em inglês?
        correctAnswer: What colour is it?
        rationale: "'What colour is it?' — Perguntando sobre cor."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quantos livros há?' em inglês?
        correctAnswer: How many books are there?
        rationale: "'How many books are there?' — 'there are' = há."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quem é aquela menina?' em inglês?
        correctAnswer: Who is that girl?
        rationale: "'Who is that girl?' — 'who' para pessoas, 'that' para distante."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Escreva uma apresentação completa em inglês (5 informações)
        correctAnswer: Hello! My name is ___. I am ___ years old. I am from Brazil. I like ___. Nice to meet you!
        rationale: "Apresentação: name, age, country, hobby, greeting. Estrutura completa."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'Does she ___ cats? Yes, she ___.' (like/does)
        correctAnswer: like, does
        rationale: "'Does she like cats? Yes, she does.' — 'Does' na pergunta."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela gosta de ler mas não gosta de escrever.' em inglês?
        correctAnswer: She likes reading but she doesn't like writing.
        rationale: "'She likes reading but she doesn't like writing.' — Contraste."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ birthday is it? It's ___ birthday!' (whose/my)
        correctAnswer: Whose, my
        rationale: "'Whose birthday is it? It's my birthday!' — 'whose' = de quem."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
