title: ❓ English 2A - Perguntas com Is/Are
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Perguntas com Is/Are e respostas curtas Yes it is / No it isn't.
repeatAll: 2
example: "Ex.: 'Is she happy? Yes, she is.' 'Are they at home? No, they aren't.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Perguntas com 'Is'
    description: Forme perguntas com 'Is' e dê respostas curtas.
    exercises:
      - type: english_vocab
        question: Como se forma uma pergunta com 'Is'?
        correctAnswer: Is + sujeito + complemento?
        rationale: "'Is she happy?' — 'Is' + sujeito + complemento."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela é professora?' em inglês?
        correctAnswer: Is she a teacher?
        rationale: "'Is she a teacher?' — Inverter: Is + she + ..."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Is he tall?' — Sim!"
        correctAnswer: Yes, he is.
        rationale: "'Yes, he is.' — Resposta curta afirmativa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Is she happy?' — Não!"
        correctAnswer: No, she isn't.
        rationale: "'No, she isn't.' — Resposta curta negativa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ it a cat? Yes, it ___.' (pergunta/resposta)"
        correctAnswer: Is, is
        rationale: "'Is it a cat? Yes, it is.' — 'Is' na pergunta, 'is' na resposta."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'É um carro novo?' em inglês?
        correctAnswer: Is it a new car?
        rationale: "'Is it a new car?' — Adjetivo antes do substantivo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Is your mother at home?' — Sim!"
        correctAnswer: Yes, she is.
        rationale: "'Yes, she is.' — 'your mother' = she na resposta."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ your dog big? No, it ___.' (pergunta/resposta negativa)"
        correctAnswer: Is, isn't
        rationale: "'Is your dog big? No, it isn't.' — 'isn't' = is not."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ele está cansado?' em inglês?
        correctAnswer: Is he tired?
        rationale: "'Is he tired?' — 'tired' = cansado."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Is it raining?' — Não!"
        correctAnswer: No, it isn't.
        rationale: "'No, it isn't.' — Resposta negativa curta."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Perguntas com 'Are'
    description: Forme perguntas com 'Are' e dê respostas curtas.
    exercises:
      - type: english_vocab
        question: Como se forma uma pergunta com 'Are'?
        correctAnswer: Are + sujeito + complemento?
        rationale: "'Are you happy?' — 'Are' + sujeito + complemento."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Você está bem?' em inglês?
        correctAnswer: Are you OK?
        rationale: "'Are you OK?' — 'OK' = bem, tudo bem."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Are you happy?' — Sim!"
        correctAnswer: Yes, I am.
        rationale: "'Yes, I am.' — 'Are you' → resposta com 'I am'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Are they at school?' — Não!"
        correctAnswer: No, they aren't.
        rationale: "'No, they aren't.' — 'aren't' = are not."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ your parents at home? Yes, ___ ___.' (são/estão)"
        correctAnswer: Are, they are
        rationale: "'Are your parents at home? Yes, they are.' — 'parents' = they."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eles são seus amigos?' em inglês?
        correctAnswer: Are they your friends?
        rationale: "'Are they your friends?' — 'Are' + they + ..."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ the cats in the garden? No, ___ ___.' (negativa)"
        correctAnswer: Are, they aren't
        rationale: "'Are the cats in the garden? No, they aren't.' — Resposta curta."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a diferença entre 'Is' e 'Are' nas perguntas?
        correctAnswer: Is = he/she/it, Are = you/we/they
        rationale: "'Is' para singular (he/she/it). 'Are' para plural e you."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eles são irmãos?' em inglês?
        correctAnswer: Are they brothers?
        rationale: "'Are they brothers?' — 'brothers' no plural."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is she ___ Are they ___?' (a professora / os alunos — teacher/students)"
        correctAnswer: the teacher, the students
        rationale: "'Is she the teacher? Are they the students?' — Is/Are com os grupos."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
