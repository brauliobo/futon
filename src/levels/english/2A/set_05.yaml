title: 📖 English 2A - Presente simples
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Presente simples — afirmativo com I/you/we/they e he/she/it (-s).
repeatAll: 2
example: "Ex.: 'I eat breakfast.' 'She eats breakfast.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Presente simples — afirmativo
    description: Aprenda a conjugar verbos no presente simples.
    exercises:
      - type: english_vocab
        question: Como se conjuga o presente simples com 'I'?
        correctAnswer: verbo base (sem -s)
        rationale: "Com I: verbo base. I eat, I run, I read."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: O que acontece com o verbo na 3ª pessoa singular (he/she/it)?
        correctAnswer: acrescenta -s
        rationale: "Com he/she/it: verbo + -s. She eats, he runs, it flies."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I ___ breakfast every day.' (eat)
        correctAnswer: eat
        rationale: "'I eat breakfast every day.' — 1ª pessoa: verbo base."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'She ___ breakfast every day.' (eat → 3ª pessoa)
        correctAnswer: eats
        rationale: "'She eats breakfast every day.' — 3ª pessoa: eat + s."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'He ___ to school by bus.' (go → 3ª pessoa)
        correctAnswer: goes
        rationale: "'He goes to school by bus.' — 'go' → 'goes' (termina em -o, acrescenta -es)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'She ___ books every week.' (read → 3ª pessoa)
        correctAnswer: reads
        rationale: "'She reads books every week.' — 'read' + 's'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The dog ___ in the park.' (run → 3ª pessoa)
        correctAnswer: runs
        rationale: "'The dog runs in the park.' — 'run' + 's'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'My father ___ a car.' (drive → 3ª pessoa)
        correctAnswer: drives
        rationale: "'My father drives a car.' — 'drive' + 's'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'They ___ football on Saturdays.' (play)
        correctAnswer: play
        rationale: "'They play football on Saturdays.' — Plural: verbo base."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a 3ª pessoa de 'watch'?
        correctAnswer: watches
        rationale: "'watch' → 'watches'. Terminado em 'ch': acrescenta -es."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Presente simples — expressões de frequência
    description: Aprenda always, usually, sometimes, never com presente simples.
    exercises:
      - type: english_vocab
        question: Como se diz 'sempre' em inglês?
        correctAnswer: always
        rationale: "'always' = sempre. I always eat breakfast."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'geralmente' em inglês?
        correctAnswer: usually
        rationale: "'usually' = geralmente. She usually walks to school."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'às vezes' em inglês?
        correctAnswer: sometimes
        rationale: "'sometimes' = às vezes. I sometimes watch TV."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'nunca' em inglês?
        correctAnswer: never
        rationale: "'never' = nunca. He never eats fish."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Onde vai o advérbio de frequência na frase?
        correctAnswer: before the main verb
        rationale: "Antes do verbo principal: I always eat. She never reads."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I ___ eat vegetables.' (sempre)
        correctAnswer: always
        rationale: "'I always eat vegetables.' — 'always' antes do verbo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'She ___ goes to bed late.' (nunca)
        correctAnswer: never
        rationale: "'She never goes to bed late.' — 'never' antes do verbo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela sempre canta no chuveiro.' em inglês?
        correctAnswer: She always sings in the shower.
        rationale: "'She always sings in the shower.' — 'sings' + -s para she."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Escreva 'eat' no presente simples (todas as pessoas)
        correctAnswer: I eat, you eat, he/she/it eats, we eat, they eat
        rationale: "eat: I/you/we/they eat, he/she/it eats."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ele às vezes joga videogame.' em inglês?
        correctAnswer: He sometimes plays video games.
        rationale: "'He sometimes plays video games.' — 'plays' com he + 'sometimes'."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
