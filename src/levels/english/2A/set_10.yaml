title: ❓ English 2A - 'How many?'
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Perguntas de quantidade com 'How many?' e contagem de objetos.
repeatAll: 2
example: "Ex.: 'How many cats do you have? I have two cats.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: How many? — pergunta e resposta
    description: Aprenda a perguntar e responder quantidades.
    exercises:
      - type: english_vocab
        question: Como se diz 'Quantos?' em inglês?
        correctAnswer: How many?
        rationale: "'How many?' = Quantos? Usado com substantivos contáveis no plural."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quantos gatos você tem?' em inglês?
        correctAnswer: How many cats do you have?
        rationale: "'How many cats do you have?' — How many + plural + do you have?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'How many cats do you have?' — (tenho dois)"
        correctAnswer: I have two cats.
        rationale: "'I have two cats.' — Resposta com número + plural."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quantos livros há na mesa?' em inglês?
        correctAnswer: How many books are there on the table?
        rationale: "'How many books are there on the table?' — 'are there' = há."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'How many books are there?' — (há três)"
        correctAnswer: There are three books.
        rationale: "'There are three books.' — 'There are' = há. Plural."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'How ___ students are in the class?' (quantos)"
        correctAnswer: many
        rationale: "'How many students are in the class?' — 'many' com contáveis."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'How many ___ do you have?' (irmãos — brothers)"
        correctAnswer: brothers
        rationale: "'How many brothers do you have?' — Plural após 'how many'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'How many brothers do you have?' — (não tenho)"
        correctAnswer: I don't have any brothers.
        rationale: "'I don't have any brothers.' — 'any' em frases negativas."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quantos dias tem uma semana?' em inglês?
        correctAnswer: How many days are there in a week?
        rationale: "'How many days are there in a week?' — Pergunta de conhecimento geral."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'How many days are there in a week?' — (sete)"
        correctAnswer: There are seven days.
        rationale: "'There are seven days.' — Sete dias na semana."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: How many? — prática com números
    description: Pratique How many com objetos do cotidiano.
    exercises:
      - type: english_vocab
        question: Como se diz 'Quantas maçãs há?' em inglês?
        correctAnswer: How many apples are there?
        rationale: "'How many apples are there?' — 'apples' plural, 'are there' = há."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'How many fingers do you have?' — (dez)"
        correctAnswer: I have ten fingers.
        rationale: "'I have ten fingers.' — Dez dedos."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'How many ___ are in a year?' (meses — months)"
        correctAnswer: months
        rationale: "'How many months are in a year?' — Doze meses no ano."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'How many months are in a year?' — (doze)"
        correctAnswer: There are twelve months.
        rationale: "'There are twelve months.' — 12 meses no ano."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quantas pessoas há na sua família?' em inglês?
        correctAnswer: How many people are in your family?
        rationale: "'How many people are in your family?' — 'people' = pessoas."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ many legs does a spider have?' (quantas pernas)"
        correctAnswer: How
        rationale: "'How many legs does a spider have?' — Uma aranha tem 8 pernas."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'How many legs does a spider have?' — (oito)"
        correctAnswer: It has eight legs.
        rationale: "'It has eight legs.' — Uma aranha tem oito pernas."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quantos?' com substantivo não-contável?
        correctAnswer: How much?
        rationale: "'How much?' para incontáveis (água, leite). 'How many?' para contáveis."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Use 'How many' ou 'How much': ___ water do you drink?"
        correctAnswer: How much
        rationale: "'How much water?' — 'water' é incontável: usa 'How much'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Use 'How many' ou 'How much': ___ books do you have?"
        correctAnswer: How many
        rationale: "'How many books?' — 'books' é contável: usa 'How many'."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
