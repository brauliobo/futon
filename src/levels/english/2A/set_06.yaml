title: 📖 English 2A - Negativas com don't / doesn't
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Presente simples negativo — don't (I/you/we/they) e doesn't (he/she/it).
repeatAll: 2
example: "Ex.: 'I don't like fish.' 'She doesn't eat meat.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Negativa com 'don't'
    description: Use 'don't' para negar com I, you, we, they.
    exercises:
      - type: english_vocab
        question: Como se forma a negativa com 'I' no presente?
        correctAnswer: I don't + verbo base
        rationale: "'I don't' + verbo. I don't like fish."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a forma completa de 'don't'?
        correctAnswer: do not
        rationale: "'don't' = do not. I do not like = I don't like."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I ___ like vegetables.' (não gosto)"
        correctAnswer: don't
        rationale: "'I don't like vegetables.' — Não gosto de vegetais."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'We ___ have a car.' (não temos)"
        correctAnswer: don't
        rationale: "'We don't have a car.' — Não temos carro."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'They ___ play football.' (não jogam)"
        correctAnswer: don't
        rationale: "'They don't play football.' — Eles não jogam futebol."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'You ___ need to run.' (não precisa)"
        correctAnswer: don't
        rationale: "'You don't need to run.' — Você não precisa correr."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Transforme em negativa: 'I like spiders.'"
        correctAnswer: I don't like spiders.
        rationale: "'I like spiders.' → 'I don't like spiders.' — Adiciona 'don't'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Transforme em negativa: 'We have a dog.'"
        correctAnswer: We don't have a dog.
        rationale: "'We have a dog.' → 'We don't have a dog.'"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I like cats ___ I ___ like dogs.' (but/don't)"
        correctAnswer: but, don't
        rationale: "'I like cats but I don't like dogs.' — Contraste com 'but'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Não entendo.' em inglês?
        correctAnswer: I don't understand.
        rationale: "'I don't understand.' — Expressão muito útil."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Negativa com 'doesn't'
    description: Use 'doesn't' para negar com he, she, it.
    exercises:
      - type: english_vocab
        question: Como se forma a negativa com 'she' no presente?
        correctAnswer: she doesn't + verbo base
        rationale: "'she doesn't' + verbo. She doesn't like fish."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a forma completa de 'doesn't'?
        correctAnswer: does not
        rationale: "'doesn't' = does not. She does not eat = She doesn't eat."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'She ___ eat meat.' (não come)"
        correctAnswer: doesn't
        rationale: "'She doesn't eat meat.' — Não usa 'eats' na negativa, volta para 'eat'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'He ___ have a dog.' (não tem)"
        correctAnswer: doesn't
        rationale: "'He doesn't have a dog.' — 'doesn't' com he."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Transforme em negativa: 'She likes cats.'"
        correctAnswer: She doesn't like cats.
        rationale: "'She likes cats.' → 'She doesn't like cats.' — 'likes' → 'doesn't like'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Transforme em negativa: 'He goes to school by bus.'"
        correctAnswer: He doesn't go to school by bus.
        rationale: "'He goes' → 'He doesn't go'. Na negativa, volta para o verbo base."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a diferença entre 'don't' e 'doesn't'?
        correctAnswer: don't = I/you/we/they, doesn't = he/she/it
        rationale: "'don't' com I/you/we/they. 'doesn't' com he/she/it."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'He ___ ___ football but she ___.' (doesn't play/does)"
        correctAnswer: doesn't play, does
        rationale: "'He doesn't play football but she does.' — Contraste afirmativo/negativo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela não gosta de acordar cedo.' em inglês?
        correctAnswer: She doesn't like waking up early.
        rationale: "'She doesn't like waking up early.' — 'doesn't like + -ing'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Escreva as negativas: I like/She likes"
        correctAnswer: I don't like / She doesn't like
        rationale: "I like → I don't like. She likes → She doesn't like."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
