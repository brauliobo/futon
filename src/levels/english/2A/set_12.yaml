title: ❓ English 2A - 'Who is it?'
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Perguntas sobre pessoas — Who is it? Who are they? Identificando pessoas.
repeatAll: 2
example: "Ex.: 'Who is this? It's my mother.' 'Who are they? They're my friends.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Who is it? — identificando pessoas
    description: Use 'who' para perguntar sobre pessoas.
    exercises:
      - type: english_vocab
        question: O que significa 'who' em português?
        correctAnswer: quem
        rationale: "'who' = quem. Who is this? = Quem é este?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quem é essa pessoa?' em inglês?
        correctAnswer: Who is this person?
        rationale: "'Who is this person?' — 'who' para perguntas sobre pessoas."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Who is this?' — (é minha mãe)"
        correctAnswer: It's my mother.
        rationale: "'It's my mother.' — 'it's' para identificar pessoas em fotos."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quem é ele?' em inglês?
        correctAnswer: Who is he?
        rationale: "'Who is he?' — 'who' + 'is' + pronome."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Who is he?' — (é meu irmão)"
        correctAnswer: He's my brother.
        rationale: "'He's my brother.' — Usando pronome e possessivo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quem é ela?' em inglês?
        correctAnswer: Who is she?
        rationale: "'Who is she?' — 'who is she' para feminino."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Who is she?' — (é minha professora)"
        correctAnswer: She's my teacher.
        rationale: "'She's my teacher.' — 'She's' = She is."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ is that man? He's my father.' (quem)"
        correctAnswer: Who
        rationale: "'Who is that man? He's my father.' — 'Who' para pessoas."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quem é sua melhor amiga?' em inglês?
        correctAnswer: Who is your best friend?
        rationale: "'Who is your best friend?' — 'best friend' = melhor amigo(a)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Who is your best friend?' — (é a Maria)"
        correctAnswer: She's Maria. / My best friend is Maria.
        rationale: "'She's Maria.' ou 'My best friend is Maria.' — Ambas corretas."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Who are they? — plural
    description: Identifique grupos de pessoas com 'Who are they?'
    exercises:
      - type: english_vocab
        question: Como se diz 'Quem são eles?' em inglês?
        correctAnswer: Who are they?
        rationale: "'Who are they?' — Plural com 'are'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Who are they?' — (são meus amigos)"
        correctAnswer: They're my friends.
        rationale: "'They're my friends.' — 'They're' = They are."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ are these children? They're my cousins.' (quem)"
        correctAnswer: Who
        rationale: "'Who are these children? They're my cousins.' — 'Who are' + plural."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quem são aquelas mulheres?' em inglês?
        correctAnswer: Who are those women?
        rationale: "'Who are those women?' — 'those' para distante, 'women' plural."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Who ___ that boy? He ___ my cousin.' (is/is)"
        correctAnswer: is, is
        rationale: "'Who is that boy? He is my cousin.' — Singular: 'is'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quem é o professor de inglês?' em inglês?
        correctAnswer: Who is the English teacher?
        rationale: "'Who is the English teacher?' — Perguntando sobre uma função."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ lives next door? The Smith family does.' (quem mora)"
        correctAnswer: Who
        rationale: "'Who lives next door? The Smith family does.' — 'who' para pessoa."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quem é seu herói favorito?' em inglês?
        correctAnswer: Who is your favourite hero?
        rationale: "'Who is your favourite hero?' — 'favourite' = favorito."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a diferença entre 'who' e 'what'?
        correctAnswer: who = pessoas, what = coisas
        rationale: "'who' para pessoas: Who is he? 'what' para coisas: What is this?"
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Quem é você?' em inglês?
        correctAnswer: Who are you?
        rationale: "'Who are you?' — Perguntando a identidade de alguém."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
