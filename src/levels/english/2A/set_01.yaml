title: 📚 English 2A - Plural simples
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Formação do plural regular em inglês — acrescentar -s ou -es.
repeatAll: 2
example: "Ex.: 'one cat → two cats' 'one box → two boxes'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Plural com -s
    description: A maioria dos substantivos acrescenta -s no plural.
    exercises:
      - type: english_vocab
        question: Qual é o plural de 'cat'?
        correctAnswer: cats
        rationale: "'cat' → 'cats'. Plural regular: acrescenta -s."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'dog'?
        correctAnswer: dogs
        rationale: "'dog' → 'dogs'. Plural regular: acrescenta -s."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'book'?
        correctAnswer: books
        rationale: "'book' → 'books'. Plural regular: acrescenta -s."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'pen'?
        correctAnswer: pens
        rationale: "'pen' → 'pens'. Plural regular: acrescenta -s."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'apple'?
        correctAnswer: apples
        rationale: "'apple' → 'apples'. Plural regular: acrescenta -s."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I have two ___.' (gatos — plural)"
        correctAnswer: cats
        rationale: "'I have two cats.' — Dois gatos."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'There are three ___ on the table.' (livros)"
        correctAnswer: books
        rationale: "'There are three books on the table.' — Três livros."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'bird'?
        correctAnswer: birds
        rationale: "'bird' → 'birds'. Plural regular: acrescenta -s."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'girl'?
        correctAnswer: girls
        rationale: "'girl' → 'girls'. Plural regular: acrescenta -s."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'boy'?
        correctAnswer: boys
        rationale: "'boy' → 'boys'. Plural regular: acrescenta -s."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Plural com -es e -ies
    description: Substantivos terminados em ch, sh, x, s → -es. Em -y → -ies.
    exercises:
      - type: english_vocab
        question: Qual é o plural de 'box'?
        correctAnswer: boxes
        rationale: "'box' → 'boxes'. Terminado em 'x': acrescenta -es."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'bus'?
        correctAnswer: buses
        rationale: "'bus' → 'buses'. Terminado em 's': acrescenta -es."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'dish'?
        correctAnswer: dishes
        rationale: "'dish' → 'dishes'. Terminado em 'sh': acrescenta -es."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'baby'?
        correctAnswer: babies
        rationale: "'baby' → 'babies'. Terminado em 'y' (consoante + y): y→i + -es."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'city'?
        correctAnswer: cities
        rationale: "'city' → 'cities'. Terminado em 'y': y→i + -es."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'church'?
        correctAnswer: churches
        rationale: "'church' → 'churches'. Terminado em 'ch': acrescenta -es."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a regra para plurais terminados em -y?
        correctAnswer: y → ies
        rationale: "Quando antes do 'y' tem consoante: baby → babies, city → cities."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é o plural de 'class'?
        correctAnswer: classes
        rationale: "'class' → 'classes'. Terminado em 'ss': acrescenta -es."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I see two ___.' (ônibus — buses)"
        correctAnswer: buses
        rationale: "'I see two buses.' — Vejo dois ônibus."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Escreva o plural: box, bus, baby, city"
        correctAnswer: boxes, buses, babies, cities
        rationale: "box→boxes, bus→buses, baby→babies, city→cities."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
