title: 🔢 English 2A - Números ordinais
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.numbers
authorNotes: Números ordinais em inglês — 1st, 2nd, 3rd... first, second, third.
repeatAll: 2
example: "Ex.: 'I am in the third grade.' 'Today is the first of May.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Ordinais 1º a 10º
    description: Aprenda first, second, third... tenth.
    exercises:
      - type: english_vocab
        question: Como se diz '1º' em inglês?
        correctAnswer: first
        rationale: "'first' = 1º. Irregular: não segue padrão."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '2º' em inglês?
        correctAnswer: second
        rationale: "'second' = 2º. Irregular."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '3º' em inglês?
        correctAnswer: third
        rationale: "'third' = 3º. Irregular."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '4º' em inglês?
        correctAnswer: fourth
        rationale: "'fourth' = 4º. 'four' + 'th'."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '5º' em inglês?
        correctAnswer: fifth
        rationale: "'fifth' = 5º. 'five' → 'fif' + 'th'."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '6º' em inglês?
        correctAnswer: sixth
        rationale: "'sixth' = 6º. 'six' + 'th'."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '7º' em inglês?
        correctAnswer: seventh
        rationale: "'seventh' = 7º. 'seven' + 'th'."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '8º' em inglês?
        correctAnswer: eighth
        rationale: "'eighth' = 8º. 'eight' + 'h' (atenção: não 'eightth')."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '9º' em inglês?
        correctAnswer: ninth
        rationale: "'ninth' = 9º. 'nine' → 'nin' + 'th'."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '10º' em inglês?
        correctAnswer: tenth
        rationale: "'tenth' = 10º. 'ten' + 'th'."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
  - pageNumber: 2
    title: Ordinais 11º a 20º e uso
    description: Aprenda os ordinais maiores e como usá-los.
    exercises:
      - type: english_vocab
        question: Como se diz '11º' em inglês?
        correctAnswer: eleventh
        rationale: "'eleventh' = 11º. 'eleven' + 'th'."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '12º' em inglês?
        correctAnswer: twelfth
        rationale: "'twelfth' = 12º. 'twelve' → 'twelf' + 'th'."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz '20º' em inglês?
        correctAnswer: twentieth
        rationale: "'twentieth' = 20º. 'twenty' → 'twentie' + 'th'."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: "Complete: 'Today is the ___ of January.' (1º)"
        correctAnswer: first
        rationale: "'Today is the first of January.' — 'the' antes de ordinais em datas."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: "Complete: 'I am in the ___ grade.' (3ª série)"
        correctAnswer: third
        rationale: "'I am in the third grade.' — Ordinais para série escolar."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se diz 'Meu aniversário é no dia 15 de junho.' em inglês?
        correctAnswer: My birthday is on the fifteenth of June.
        rationale: "'on the fifteenth of June' — 'on' com datas, 'fifteenth' = 15º."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Escreva os 3 primeiros ordinais irregulares
        correctAnswer: first, second, third
        rationale: "first (1º), second (2º), third (3º) — os únicos verdadeiramente irregulares."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: "Complete: 'She finished ___.' (em primeiro lugar — 1st)"
        correctAnswer: first
        rationale: "'She finished first.' — 'first' = em primeiro lugar."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se escreve '21st' por extenso?
        correctAnswer: twenty-first
        rationale: "'twenty-first' = 21º. Dezena + '-first'."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Qual é a abreviação dos ordinais? (1º, 2º, 3º, 4º em inglês)
        correctAnswer: 1st, 2nd, 3rd, 4th
        rationale: "1st (first), 2nd (second), 3rd (third), 4th (fourth)."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
target: 20
