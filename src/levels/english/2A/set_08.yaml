title: ❓ English 2A - Perguntas com Do/Does
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Perguntas no presente simples com Do/Does e respostas Yes I do / No she doesn't.
repeatAll: 2
example: "Ex.: 'Do you like cats? Yes, I do.' 'Does she play football? No, she doesn't.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Perguntas com 'Do'
    description: Forme perguntas com 'Do' com I, you, we, they.
    exercises:
      - type: english_vocab
        question: Como se forma uma pergunta com 'Do'?
        correctAnswer: Do + sujeito + verbo base?
        rationale: "'Do you like cats?' — 'Do' + sujeito + verbo base."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Você gosta de gatos?' em inglês?
        correctAnswer: Do you like cats?
        rationale: "'Do you like cats?' — 'Do' + you + 'like'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Do you like cats?' — Sim!"
        correctAnswer: Yes, I do.
        rationale: "'Yes, I do.' — Resposta curta afirmativa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Do you eat fish?' — Não!"
        correctAnswer: No, I don't.
        rationale: "'No, I don't.' — Resposta curta negativa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Vocês falam inglês?' em inglês?
        correctAnswer: Do you speak English?
        rationale: "'Do you speak English?' — 'speak' = falar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ they live near here? Yes, they ___.' (pergunta/resposta)"
        correctAnswer: Do, do
        rationale: "'Do they live near here? Yes, they do.' — 'do' na resposta curta."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Você tem um animal de estimação?' em inglês?
        correctAnswer: Do you have a pet?
        rationale: "'Do you have a pet?' — 'pet' = animal de estimação."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Do you have a bike?' — Sim!"
        correctAnswer: Yes, I do.
        rationale: "'Yes, I do.' — Resposta curta afirmativa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ we have homework today? No, we ___.' (pergunta/resposta)"
        correctAnswer: Do, don't
        rationale: "'Do we have homework today? No, we don't.'"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O que você faz nos fins de semana?' em inglês?
        correctAnswer: What do you do at weekends?
        rationale: "'What do you do at weekends?' — 'what do you do' = o que você faz."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Perguntas com 'Does'
    description: Forme perguntas com 'Does' com he, she, it.
    exercises:
      - type: english_vocab
        question: Como se forma uma pergunta com 'Does'?
        correctAnswer: Does + he/she/it + verbo base?
        rationale: "'Does she play football?' — 'Does' + 3ª pessoa + verbo base."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela joga futebol?' em inglês?
        correctAnswer: Does she play football?
        rationale: "'Does she play football?' — 'Does' + she + 'play' (base)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Does he like cats?' — Sim!"
        correctAnswer: Yes, he does.
        rationale: "'Yes, he does.' — Resposta curta afirmativa com 'does'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Does she eat vegetables?' — Não!"
        correctAnswer: No, she doesn't.
        rationale: "'No, she doesn't.' — Resposta curta negativa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ he have a dog? No, he ___.' (pergunta/resposta)"
        correctAnswer: Does, doesn't
        rationale: "'Does he have a dog? No, he doesn't.'"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a diferença entre 'Do' e 'Does' nas perguntas?
        correctAnswer: Do = I/you/we/they, Does = he/she/it
        rationale: "'Do' com I/you/we/they. 'Does' com he/she/it."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Transforme em pergunta: 'She likes cats.'"
        correctAnswer: Does she like cats?
        rationale: "'She likes cats.' → 'Does she like cats?' — 'likes' → 'Does + like'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Transforme em pergunta: 'They play football.'"
        correctAnswer: Do they play football?
        rationale: "'They play football.' → 'Do they play football?'"
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Onde ela mora?' em inglês?
        correctAnswer: Where does she live?
        rationale: "'Where does she live?' — 'Where' + 'does' + she + verbo base."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O que ele come no café da manhã?' em inglês?
        correctAnswer: What does he eat for breakfast?
        rationale: "'What does he eat for breakfast?' — 'What does' + he + verbo base."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
