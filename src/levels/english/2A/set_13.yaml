title: ❓ English 2A - 'Where is it?'
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Perguntas de localização — Where is/are e respostas com preposições.
repeatAll: 2
example: "Ex.: 'Where is my bag? It's on the chair.' 'Where are the kids? They're in the garden.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Where is ___? — singular
    description: Pergunte e responda sobre a localização de objetos.
    exercises:
      - type: english_vocab
        question: Como se diz 'Onde está minha bolsa?' em inglês?
        correctAnswer: Where is my bag?
        rationale: "'Where is my bag?' — 'where is' + pronome possessivo + substantivo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where is the pen?' — (está em cima da mesa)"
        correctAnswer: It's on the table.
        rationale: "'It's on the table.' — 'on' = em cima."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where is the cat?' — (está embaixo da cama)"
        correctAnswer: It's under the bed.
        rationale: "'It's under the bed.' — 'under' = embaixo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where is the book?' — (está dentro da mochila)"
        correctAnswer: It's in the backpack.
        rationale: "'It's in the backpack.' — 'in' = dentro."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ is the bathroom? It's next to the bedroom.' (onde)"
        correctAnswer: Where
        rationale: "'Where is the bathroom?' — 'where' para localização."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where is the school?' — (fica ao lado do parque)"
        correctAnswer: It's next to the park.
        rationale: "'It's next to the park.' — 'next to' = ao lado de."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Where ___ the dog? It ___ in the garden.' (is/is)"
        correctAnswer: is, is
        rationale: "'Where is the dog? It is in the garden.' — Singular: 'is'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where is the hospital?' — (fica longe daqui)"
        correctAnswer: It's far from here.
        rationale: "'It's far from here.' — 'far from' = longe de."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Onde você mora?' em inglês?
        correctAnswer: Where do you live?
        rationale: "'Where do you live?' — 'where do you' + verbo base."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where do you live?' — (moro em São Paulo)"
        correctAnswer: I live in São Paulo.
        rationale: "'I live in São Paulo.' — 'live in' + cidade."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Where are ___? — plural
    description: Perguntas e respostas de localização no plural.
    exercises:
      - type: english_vocab
        question: Como se diz 'Onde estão os gatos?' em inglês?
        correctAnswer: Where are the cats?
        rationale: "'Where are the cats?' — Plural: 'are'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where are the keys?' — (estão em cima da mesa)"
        correctAnswer: They're on the table.
        rationale: "'They're on the table.' — Plural: 'they're'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where are the children?' — (estão no jardim)"
        correctAnswer: They're in the garden.
        rationale: "'They're in the garden.' — Plural: 'they're' + 'in'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Where ___ my glasses? They ___ on the shelf.' (are/are)"
        correctAnswer: are, are
        rationale: "'Where are my glasses? They are on the shelf.' — Plural."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Onde estão meus sapatos?' em inglês?
        correctAnswer: Where are my shoes?
        rationale: "'Where are my shoes?' — 'shoes' = plural, usa 'are'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where are your books?' — (estão na mochila)"
        correctAnswer: They're in my backpack.
        rationale: "'They're in my backpack.' — Plural: 'they're' + 'in'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Onde fica a padaria?' em inglês?
        correctAnswer: Where is the bakery?
        rationale: "'Where is the bakery?' — 'bakery' = padaria."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete o diálogo: 'Where ___ Tom? He ___ at school.' (is/is)"
        correctAnswer: is, is
        rationale: "'Where is Tom? He is at school.' — 'is' singular para pessoa."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Onde eles trabalham?' em inglês?
        correctAnswer: Where do they work?
        rationale: "'Where do they work?' — 'where do they' + verbo base."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Where does she work?' — (ela trabalha num hospital)"
        correctAnswer: She works in a hospital.
        rationale: "'She works in a hospital.' — 'works' com she, 'in a hospital'."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
