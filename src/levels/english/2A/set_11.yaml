title: ❓ English 2A - 'What colour is it?'
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Perguntas sobre cor — What colour is it? e What colour are they?
repeatAll: 2
example: "Ex.: 'What colour is the sky? It is blue.' 'What colour are the apples? They are red.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: What colour is it?
    description: Pergunte e responda sobre cores de objetos.
    exercises:
      - type: english_vocab
        question: Como se diz 'Qual é a cor do céu?' em inglês?
        correctAnswer: What colour is the sky?
        rationale: "'What colour is the sky?' — 'colour' = cor."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'What colour is the sky?' — (azul)"
        correctAnswer: It is blue.
        rationale: "'It is blue.' — O céu é azul."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Qual é a cor da grama?' em inglês?
        correctAnswer: What colour is the grass?
        rationale: "'What colour is the grass?' — 'grass' = grama."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'What colour is the grass?' — (verde)"
        correctAnswer: It is green.
        rationale: "'It is green.' — A grama é verde."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'What ___ is the sun?' (cor)"
        correctAnswer: colour
        rationale: "'What colour is the sun?' — Qual é a cor do sol?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'What colour is the sun?' — (amarelo)"
        correctAnswer: It is yellow.
        rationale: "'It is yellow.' — O sol é amarelo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'What colour ___ the car? It ___ red.' (is/is)"
        correctAnswer: is, is
        rationale: "'What colour is the car? It is red.' — 'is' para singular."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'De que cor é sua mochila?' em inglês?
        correctAnswer: What colour is your backpack?
        rationale: "'What colour is your backpack?' — Pronome possessivo 'your'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'What colour is your shirt?' — (minha camisa é azul)"
        correctAnswer: It is blue.
        rationale: "'It is blue.' — Resposta com 'It is + cor'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'De que cor é a neve?' em inglês?
        correctAnswer: What colour is snow?
        rationale: "'What colour is snow?' — Perguntando sobre neve."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: What colour are they? — plural
    description: Perguntas e respostas sobre cores no plural.
    exercises:
      - type: english_vocab
        question: Como se diz 'De que cor são as maçãs?' em inglês?
        correctAnswer: What colour are the apples?
        rationale: "'What colour are the apples?' — Plural: 'are'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'What colour are the apples?' — (vermelhas)"
        correctAnswer: They are red.
        rationale: "'They are red.' — Plural: 'They are + cor'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'What colour ___ the roses? They ___ pink.' (are/are)"
        correctAnswer: are, are
        rationale: "'What colour are the roses? They are pink.' — Plural."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'De que cor são as bananas?' em inglês?
        correctAnswer: What colour are bananas?
        rationale: "'What colour are bananas?' — Pergunta geral sobre bananas."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'What colour are bananas?' — (amarelas)"
        correctAnswer: They are yellow.
        rationale: "'They are yellow.' — Bananas são amarelas."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Meu gato é preto e branco.' em inglês?
        correctAnswer: My cat is black and white.
        rationale: "'My cat is black and white.' — Duas cores com 'and'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'What colour ___ your eyes?' (are/is — olhos)"
        correctAnswer: are
        rationale: "'What colour are your eyes?' — 'eyes' = plural, usa 'are'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'What colour are your eyes?' — (meus olhos são marrons)"
        correctAnswer: They are brown.
        rationale: "'They are brown.' — 'eyes' = plural, responde com 'they'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'A casa é branca e a porta é azul.' em inglês?
        correctAnswer: The house is white and the door is blue.
        rationale: "'The house is white and the door is blue.' — Duas frases com 'and'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Liste todas as cores que você aprendeu em inglês (pelo menos 8)
        correctAnswer: red, blue, green, yellow, black, white, orange, pink, purple, brown, grey
        rationale: "As cores básicas: red, blue, green, yellow, black, white, orange, pink, purple, brown, grey."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
