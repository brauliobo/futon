title: 📖 English 2A - Verbo 'to be' — conjugação completa
level: 2A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Todas as formas do verbo 'to be' no presente — am, is, are.
repeatAll: 2
example: "Ex.: 'I am happy.' 'She is tall.' 'We are friends.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Formas afirmativas do 'to be'
    description: Aprenda todas as formas positivas de am, is, are.
    exercises:
      - type: english_vocab
        question: Complete a conjugação: 'I ___, you ___, he/she/it ___.'
        correctAnswer: am, are, is
        rationale: "I am, you are, he/she/it is — presente do verbo 'to be'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'we ___, you ___, they ___.' (plural)
        correctAnswer: are, are, are
        rationale: "we are, you are, they are — plural usa 'are'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I ___ a student.' (sou)
        correctAnswer: am
        rationale: "'I am a student.' — Só 'I' usa 'am'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'She ___ my friend.' (é)
        correctAnswer: is
        rationale: "'She is my friend.' — he/she/it usa 'is'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'We ___ happy.' (somos)
        correctAnswer: are
        rationale: "'We are happy.' — Plural usa 'are'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The cats ___ big.' (são)
        correctAnswer: are
        rationale: "'The cats are big.' — Plural: 'are'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a contração de 'I am'?
        correctAnswer: I'm
        rationale: "'I am' → 'I'm'. I'm happy."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a contração de 'she is'?
        correctAnswer: she's
        rationale: "'she is' → 'she's'. She's tall."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a contração de 'they are'?
        correctAnswer: they're
        rationale: "'they are' → 'they're'. They're happy."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a contração de 'we are'?
        correctAnswer: we're
        rationale: "'we are' → 'we're'. We're friends."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Negativas e perguntas com 'to be'
    description: Forme negativas e perguntas com am/is/are.
    exercises:
      - type: english_vocab
        question: Como se forma a negativa de 'I am'?
        correctAnswer: I am not / I'm not
        rationale: "'I am not happy.' / 'I'm not happy.' — 'not' após o verbo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a contração de 'is not'?
        correctAnswer: isn't
        rationale: "'is not' → 'isn't'. She isn't tall."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a contração de 'are not'?
        correctAnswer: aren't
        rationale: "'are not' → 'aren't'. They aren't here."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'She ___ my sister.' (não é)
        correctAnswer: isn't
        rationale: "'She isn't my sister.' — Negativa com she."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se forma uma pergunta com 'is'?
        correctAnswer: Inverter: Is + sujeito?
        rationale: "'Is she happy?' — Inversão do sujeito e verbo para perguntar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ you happy? Yes, I ___.' (pergunta/resposta)
        correctAnswer: Are, am
        rationale: "'Are you happy? Yes, I am.' — 'Are' na pergunta, 'am' na resposta."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ she a teacher? No, she ___.' (pergunta/resposta negativa)
        correctAnswer: Is, isn't
        rationale: "'Is she a teacher? No, she isn't.' — 'Is' na pergunta, 'isn't' na resposta."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Escreva 'to be' nas 6 pessoas (forma completa)
        correctAnswer: I am, you are, he/she/it is, we are, you are, they are
        rationale: "Conjugação completa: am (I), are (you/we/they), is (he/she/it)."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'We ___ not tired. We ___ happy.' (aren't/are)
        correctAnswer: are, are
        rationale: "'We are not tired. We are happy.' — 'are' com 'we'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Escreva as contrações: I am, she is, they are
        correctAnswer: I'm, she's, they're
        rationale: "I am→I'm, she is→she's, they are→they're."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
