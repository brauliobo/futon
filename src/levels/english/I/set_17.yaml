title: ✏️ English I - Vocabulary: Abstract Concepts
level: I
subject: english
difficulty: 4
objectives:
  - B2.vocabulary.abstract_concepts
authorNotes: Key abstract nouns in social, political and ethical discourse — inequality, sustainability, ethics, democracy, justice, diversity, integrity, transparency, accountability, resilience. Focus on accurate usage and collocation.
repeatAll: 2
example: "Ex.: 'A desigualdade afeta milhões de pessoas' → Inequality affects millions of people."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Society & Politics
    description: Inequality, democracy, justice, diversity, sustainability.
    exercises:
      - type: english_phrases
        question: a desigualdade econômica está crescendo em muitos países
        correctAnswer: Economic inequality is growing in many countries
        rationale: "'Economic inequality' = pre-modified abstract noun. 'Is growing' = present continuous trend."
        difficulty: 2
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a democracia depende da participação dos cidadãos
        correctAnswer: Democracy depends on citizen participation
        rationale: "'Depends on' = depende de. 'Citizen participation' = participação dos cidadãos (noun string)."
        difficulty: 2
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a justiça nem sempre é alcançada
        correctAnswer: Justice is not always achieved
        rationale: "'Is not always achieved' = passive; 'not always' = nem sempre (mid-position between aux + past part)."
        difficulty: 2
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a diversidade fortalece as sociedades
        correctAnswer: Diversity strengthens societies
        rationale: "'Strengthens' = fortalece (3rd person -ens). 'Societies' = plural of 'society'."
        difficulty: 2
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a sustentabilidade é uma prioridade global
        correctAnswer: Sustainability is a global priority
        rationale: "'Sustainability' = incontável abstract noun. 'A global priority' = uma prioridade global."
        difficulty: 2
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a desigualdade de gênero persiste no mercado de trabalho
        correctAnswer: Gender inequality persists in the labour market
        rationale: "'Gender inequality' = compound noun. 'Labour market' = mercado de trabalho. 'Persists' = persiste."
        difficulty: 3
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: o desenvolvimento sustentável equilibra crescimento e meio ambiente
        correctAnswer: Sustainable development balances growth and the environment
        rationale: "'Sustainable development' = adjectival pre-modifier. 'Balances' = equilibra. 'The environment' = meio ambiente."
        difficulty: 3
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: uma democracia saudável precisa de uma imprensa livre
        correctAnswer: A healthy democracy requires a free press
        rationale: "'Requires a free press' = precisa de uma imprensa livre. 'Free press' = compound noun."
        difficulty: 3
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: o acesso à justiça é um direito fundamental
        correctAnswer: Access to justice is a fundamental right
        rationale: "'Access to justice' = acesso à justiça. 'Fundamental right' = direito fundamental."
        difficulty: 3
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: promover a diversidade cultural enriquece a sociedade
        correctAnswer: Promoting cultural diversity enriches society
        rationale: "'Promoting' = gerund as subject. 'Enriches' = enriquece (3rd person). 'Society' = incontável."
        difficulty: 3
        objectives: [B2.vocabulary.abstract_concepts]
  - pageNumber: 2
    title: Ethics & Governance
    description: Ethics, integrity, transparency, accountability, resilience.
    exercises:
      - type: english_phrases
        question: a ética nos negócios é fundamental para a confiança do consumidor
        correctAnswer: Business ethics is fundamental to consumer trust
        rationale: "'Business ethics' treated as singular. 'Fundamental to' = fundamental para. 'Consumer trust' = confiança do consumidor."
        difficulty: 3
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a integridade é essencial para líderes políticos
        correctAnswer: Integrity is essential for political leaders
        rationale: "'Integrity' = incontável. 'Essential for' = essencial para. 'Political leaders' = líderes políticos."
        difficulty: 3
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a transparência do governo aumenta a confiança pública
        correctAnswer: Government transparency increases public trust
        rationale: "'Government transparency' = genitive-free noun string. 'Public trust' = confiança pública."
        difficulty: 3
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: os políticos devem prestar contas ao povo
        correctAnswer: Politicians must be accountable to the people
        rationale: "'Be accountable to' = prestar contas a. 'Accountable' = adjective form of 'accountability'."
        difficulty: 4
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a resiliência das comunidades foi testada pela pandemia
        correctAnswer: The resilience of communities was tested by the pandemic
        rationale: "'Resilience of communities' = abstract noun + of-phrase. 'Was tested by' = passive + agent."
        difficulty: 4
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: há uma falta de responsabilização nas instituições públicas
        correctAnswer: There is a lack of accountability in public institutions
        rationale: "'Lack of accountability' = falta de responsabilização. 'Public institutions' = instituições públicas."
        difficulty: 4
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: dilemas éticos surgem frequentemente em pesquisas médicas
        correctAnswer: Ethical dilemmas frequently arise in medical research
        rationale: "'Ethical dilemmas' = pre-modified. 'Arise' = surgir (intransitive). 'Medical research' = incontável."
        difficulty: 4
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: construir resiliência requer tempo e apoio comunitário
        correctAnswer: Building resilience requires time and community support
        rationale: "'Building resilience' = gerund subject. 'Requires time and community support' — two objects."
        difficulty: 4
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a corrupção enfraquece a integridade das instituições
        correctAnswer: Corruption undermines the integrity of institutions
        rationale: "'Undermines' = enfraquece/mina (stronger verb). 'The integrity of institutions' = complex NP."
        difficulty: 4
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: a transparência e a responsabilização andam juntas
        correctAnswer: Transparency and accountability go hand in hand
        rationale: "'Go hand in hand' = andam juntas (fixed phrase). Two abstract nouns as compound subject."
        difficulty: 4
        objectives: [B2.vocabulary.abstract_concepts]
target: 20
