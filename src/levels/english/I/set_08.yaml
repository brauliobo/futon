title: ✏️ English I - Inversion for Emphasis
level: I
subject: english
difficulty: 4
objectives:
  - B2.grammar.inversion
authorNotes: Fronting negative/restrictive adverbials (Never, Not only, Rarely, Hardly, Only when) triggers subject-auxiliary inversion. Contrasts with standard SVO order.
repeatAll: 2
example: "Ex.: 'Nunca vi isso' → Never have I seen this."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Never & Rarely
    description: Inversion with negative frequency adverbs.
    exercises:
      - type: english_phrases
        question: nunca vi algo tão bonito
        correctAnswer: Never have I seen anything so beautiful
        rationale: "'Never have I...' — negative adverb fronted, auxiliary 'have' inverts before subject."
        difficulty: 2
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: raramente ela chega tarde
        correctAnswer: Rarely does she arrive late
        rationale: "'Rarely does she...' — 'Rarely' fronted; 'does' introduced as auxiliary, main verb 'arrive'."
        difficulty: 2
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: nunca eu tinha ouvido aquela música
        correctAnswer: Never had I heard that song
        rationale: "'Never had I heard' — past perfect inversion. 'That song' = referência específica."
        difficulty: 2
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: raramente eles discutem
        correctAnswer: Rarely do they argue
        rationale: "'Rarely do they...' — auxiliary 'do' inserted for inversion. No '-s' on 'argue' (they)."
        difficulty: 2
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: nunca vi tanto progresso
        correctAnswer: Never have I seen such progress
        rationale: "'Such progress' (incontável) intensifies meaning. 'Have I seen' = present perfect inversion."
        difficulty: 3
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: em nenhum momento ele mentiu
        correctAnswer: At no point did he lie
        rationale: "'At no point did he...' — negative phrase fronted, 'did' inverts before subject."
        difficulty: 3
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: raramente um livro me prende tanto
        correctAnswer: Rarely does a book grip me so much
        rationale: "'Grip' = prender a atenção. 'Does a book' — inversion with indefinite subject."
        difficulty: 3
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: nunca fui tão feliz
        correctAnswer: Never have I been so happy
        rationale: "'Never have I been' — 'be' in present perfect. 'So happy' (adverb + adjective)."
        difficulty: 3
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: em nenhum lugar me sinto tão bem
        correctAnswer: Nowhere do I feel so at ease
        rationale: "'Nowhere do I...' — negative place adverb fronted. 'At ease' = bem/à vontade."
        difficulty: 3
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: raramente o tempo estava tão bom
        correctAnswer: Rarely had the weather been so good
        rationale: "'Rarely had the weather been' — past perfect inversion. 'So good' intensifier."
        difficulty: 3
        objectives: [B2.grammar.inversion]
  - pageNumber: 2
    title: Not only & Only when
    description: Inversion with restrictive and additive adverbials.
    exercises:
      - type: english_phrases
        question: não só ele chegou atrasado como também não se desculpou
        correctAnswer: Not only did he arrive late but he also failed to apologise
        rationale: "'Not only did he...' — 'did' inverts after fronted phrase. 'Failed to apologise' = formal negative."
        difficulty: 3
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: não só ela fala inglês como também escreve muito bem
        correctAnswer: Not only does she speak English but she also writes very well
        rationale: "'Not only does she speak' — present simple inversion. 'Also' placed before main verb."
        difficulty: 3
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: só quando cheguei em casa percebi que havia perdido a carteira
        correctAnswer: Only when I got home did I realise I had lost my wallet
        rationale: "'Only when' clause, then main-clause inversion 'did I realise'. 'Had lost' = past perfect."
        difficulty: 4
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: mal ele saiu, o telefone tocou
        correctAnswer: Hardly had he left when the phone rang
        rationale: "'Hardly had he left when...' — past perfect inversion. 'When' links the two events."
        difficulty: 4
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: não apenas perdemos o jogo como também jogamos mal
        correctAnswer: Not only did we lose the game but we also played badly
        rationale: "'Not only did we lose' + 'but we also played badly'. 'Badly' = adverb from 'bad'."
        difficulty: 4
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: sob nenhuma circunstância você deve abrir essa porta
        correctAnswer: Under no circumstances should you open that door
        rationale: "'Under no circumstances should you' — modal 'should' inverts. Formal command/prohibition."
        difficulty: 4
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: somente depois que ele leu o relatório é que entendeu o problema
        correctAnswer: Only after he had read the report did he understand the problem
        rationale: "'Only after' + past perfect, then 'did he understand'. Sequence of past events."
        difficulty: 4
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: mal começamos a reunião quando surgiu um problema
        correctAnswer: Hardly had we started the meeting when a problem arose
        rationale: "'Arose' = past simple irregular of 'arise'. 'Hardly had we started when' — classic inversion pattern."
        difficulty: 4
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: não só o projeto atrasou como também custou mais
        correctAnswer: Not only did the project run late but it also cost more
        rationale: "'Run late' = atrasar (phrasal). 'Did the project run' — inversion with 'not only'."
        difficulty: 4
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: tão difícil era a questão que ninguém a respondeu
        correctAnswer: So difficult was the question that no one answered it
        rationale: "'So + adjective + was...' — inverted structure for emphasis. 'No one answered it' result clause."
        difficulty: 4
        objectives: [B2.grammar.inversion]
target: 20
