title: "✏️ English I - Vocabulary: Academic & Formal Register"
level: I
subject: english
difficulty: 4
objectives:
  - B2.vocabulary.academic_register
authorNotes: High-frequency academic verbs and collocations from the Academic Word List — demonstrate, constitute, indicate, vary, establish, assess, contribute, derive, distinguish, implement. Focus on register awareness and accurate collocation.
repeatAll: 2
example: "Ex.: 'Os dados indicam uma tendência clara' → The data indicates a clear trend."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Academic Verbs — Core Set
    description: Demonstrate, indicate, constitute, vary and establish.
    exercises:
      - type: english_phrases
        question: os resultados demonstram uma correlação forte
        correctAnswer: The results demonstrate a strong correlation
        rationale: "'Demonstrate' = demonstrar (academic verb). 'A strong correlation' = uma correlação forte."
        difficulty: 2
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: isso constitui uma violação dos direitos humanos
        correctAnswer: This constitutes a violation of human rights
        rationale: "'Constitutes' = constitui (3rd person). 'A violation of human rights' = uma violação dos direitos humanos."
        difficulty: 2
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: os preços variam dependendo da região
        correctAnswer: Prices vary depending on the region
        rationale: "'Vary depending on' = variar dependendo de. 'Region' = região. No article before 'prices' (general)."
        difficulty: 2
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: a pesquisa estabeleceu um vínculo entre dieta e saúde
        correctAnswer: The research established a link between diet and health
        rationale: "'Established a link between... and...' = estabeleceu um vínculo entre. Formal academic collocation."
        difficulty: 2
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: os dados indicam que a temperatura está aumentando
        correctAnswer: The data indicates that the temperature is rising
        rationale: "'Data indicates' (treated as singular in academic writing). 'Is rising' = present continuous trend."
        difficulty: 2
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: a teoria foi estabelecida no século XIX
        correctAnswer: The theory was established in the nineteenth century
        rationale: "'Was established' = passive (when agent unknown/unimportant). 'The nineteenth century' — ordinal."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: os resultados variam consideravelmente entre os grupos
        correctAnswer: The results vary considerably across the groups
        rationale: "'Vary considerably across' = variar consideravelmente entre. 'Across' used for groups/samples."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: o estudo demonstra que o exercício melhora o bem-estar
        correctAnswer: The study demonstrates that exercise improves wellbeing
        rationale: "'Demonstrates that' + present (general truth). 'Wellbeing' = bem-estar (one word)."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: isso não constitui prova suficiente
        correctAnswer: This does not constitute sufficient evidence
        rationale: "'Does not constitute' = negativa (não constitui). 'Sufficient evidence' = prova suficiente."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: os resultados indicam uma necessidade de mais pesquisas
        correctAnswer: The results indicate a need for further research
        rationale: "'Indicate a need for' = indicar a necessidade de. 'Further research' = mais pesquisas (formal)."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
  - pageNumber: 2
    title: Academic Verbs — Extended Set
    description: Assess, contribute, derive, distinguish and implement.
    exercises:
      - type: english_phrases
        question: é difícil avaliar o impacto total do projeto
        correctAnswer: It is difficult to assess the full impact of the project
        rationale: "'Assess' = avaliar (academic). 'The full impact of' = o impacto total de."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: esse fator contribui para o sucesso geral
        correctAnswer: This factor contributes to the overall success
        rationale: "'Contributes to' = contribui para. 'Overall success' = sucesso geral (pre-modified noun)."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: o conceito foi derivado de teorias mais antigas
        correctAnswer: The concept was derived from earlier theories
        rationale: "'Was derived from' = passive; foi derivado de. 'Earlier theories' = teorias mais antigas."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: é importante distinguir entre causa e efeito
        correctAnswer: It is important to distinguish between cause and effect
        rationale: "'Distinguish between... and...' = distinguir entre. 'Cause and effect' = causa e efeito (fixed phrase)."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: as novas políticas foram implementadas no ano passado
        correctAnswer: The new policies were implemented last year
        rationale: "'Were implemented' = passive (formal). 'Implement policies' = implementar políticas."
        difficulty: 4
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: o relatório avaliou a eficácia do programa
        correctAnswer: The report assessed the effectiveness of the programme
        rationale: "'Assessed the effectiveness of' = avaliou a eficácia de. 'Programme' = British spelling."
        difficulty: 4
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: vários fatores contribuem para as mudanças climáticas
        correctAnswer: Several factors contribute to climate change
        rationale: "'Several factors contribute to' = vários fatores contribuem para. 'Climate change' (no article, general)."
        difficulty: 4
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: os pesquisadores derivaram suas conclusões de observações de longo prazo
        correctAnswer: The researchers derived their conclusions from long-term observations
        rationale: "'Derived their conclusions from' = derivaram suas conclusões de. 'Long-term' = hyphenated pre-modifier."
        difficulty: 4
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: o estudo distingue entre dois tipos de aprendizagem
        correctAnswer: The study distinguishes between two types of learning
        rationale: "'Distinguishes between two types of' = distingue entre dois tipos de. Academic present tense."
        difficulty: 4
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: as recomendações foram implementadas com sucesso
        correctAnswer: The recommendations were successfully implemented
        rationale: "'Were successfully implemented' — adverb between auxiliary and past participle. Passive formal."
        difficulty: 4
        objectives: [B2.vocabulary.academic_register]
target: 20
