title: English I - Conditionals Mixed Review
level: I
subject: english
difficulty: 5
objectives: [B1.grammar.conditionals]
authorNotes: Identify the correct conditional type across varied realistic contexts.
repeatAll: 2
example: "Se eu fosse você... / Se eu tivesse sabido..."
pages:
  - pageNumber: 1
    title: Spot the Type
    description: Choose the right form based on context.
    exercises:
      - { type: english_phrases, question: "Se chover amanhã, cancelamos (first)", correctAnswer: if it rains tomorrow we will cancel }
      - { type: english_phrases, question: "Se eu fosse você, eu perguntaria (second)", correctAnswer: if i were you i would ask }
      - { type: english_phrases, question: "Se ela tivesse ligado, eu teria ido (third)", correctAnswer: if she had called i would have gone }
      - { type: english_phrases, question: "Se você aquece o gelo, derrete (zero)", correctAnswer: if you heat ice it melts }
      - { type: english_phrases, question: "Se eu tivesse sabido ontem, teria te avisado", correctAnswer: if i had known yesterday i would have warned you }
      - { type: english_phrases, question: "Se eu tiver tempo hoje, te ligo", correctAnswer: if i have time today i will call you }
      - { type: english_phrases, question: "Se eu morasse no Japão, falaria japonês", correctAnswer: if i lived in japan i would speak japanese }
      - { type: english_phrases, question: "Quando a luz acaba, o sistema desliga", correctAnswer: when the power goes out the system shuts down }
      - { type: english_phrases, question: "Se ele tivesse aceitado, estaria famoso", correctAnswer: if he had accepted he would be famous }
      - { type: english_phrases, question: "A menos que estude, não passa", correctAnswer: unless you study you will not pass }
  - pageNumber: 2
    title: Real Situations
    description: Conditionals in daily life.
    exercises:
      - { type: english_phrases, question: "Se eu sair agora, chego a tempo", correctAnswer: if i leave now i will arrive on time }
      - { type: english_phrases, question: "Se ela soubesse, teria me contado", correctAnswer: if she had known she would have told me }
      - { type: english_phrases, question: "Se você ficar, eu fico também", correctAnswer: if you stay i will stay too }
      - { type: english_phrases, question: "Se eu tivesse dinheiro agora, compraria", correctAnswer: if i had money now i would buy it }
      - { type: english_phrases, question: "Queria que estivéssemos juntos", correctAnswer: i wish we were together }
      - { type: english_phrases, question: "Se perder o voo, pego o próximo", correctAnswer: if i miss the flight i will take the next one }
      - { type: english_phrases, question: "Se eu fosse mais rápido, já teria terminado", correctAnswer: if i were faster i would have finished already }
      - { type: english_phrases, question: "Se fosse verdade, seria incrível", correctAnswer: if it were true it would be amazing }
      - { type: english_phrases, question: "Queria ter tido a chance", correctAnswer: i wish i had had the chance }
      - { type: english_phrases, question: "Se você precisar, me avise", correctAnswer: if you need anything let me know }
target: 20
