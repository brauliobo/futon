title: English I - Conditionals Mixed Review
level: I
subject: english
difficulty: 5
objectives:
  - B1.grammar.conditionals
authorNotes: Identify the correct conditional type across varied realistic contexts.
repeatAll: 2
example: Se eu fosse você... / Se eu tivesse sabido...
pages:
  - pageNumber: 1
    title: Spot the Type
    description: Choose the right form based on context.
    exercises:
      - type: english_phrases
        question: Se chover amanhã, cancelamos (first)
        correctAnswer: if it rains tomorrow we will cancel
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se eu fosse você, eu perguntaria (second)
        correctAnswer: if i were you i would ask
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se ela tivesse ligado, eu teria ido (third)
        correctAnswer: if she had called i would have gone
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se você aquece o gelo, derrete (zero)
        correctAnswer: if you heat ice it melts
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se eu tivesse sabido ontem, teria te avisado
        correctAnswer: if i had known yesterday i would have warned you
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se eu tiver tempo hoje, te ligo
        correctAnswer: if i have time today i will call you
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se eu morasse no Japão, falaria japonês
        correctAnswer: if i lived in japan i would speak japanese
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quando a luz acaba, o sistema desliga
        correctAnswer: when the power goes out the system shuts down
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se ele tivesse aceitado, estaria famoso
        correctAnswer: if he had accepted he would be famous
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A menos que estude, não passa
        correctAnswer: unless you study you will not pass
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Real Situations
    description: Conditionals in daily life.
    exercises:
      - type: english_phrases
        question: Se eu sair agora, chego a tempo
        correctAnswer: if i leave now i will arrive on time
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se ela soubesse, teria me contado
        correctAnswer: if she had known she would have told me
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se você ficar, eu fico também
        correctAnswer: if you stay i will stay too
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se eu tivesse dinheiro agora, compraria
        correctAnswer: if i had money now i would buy it
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria que estivéssemos juntos
        correctAnswer: i wish we were together
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se perder o voo, pego o próximo
        correctAnswer: if i miss the flight i will take the next one
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se eu fosse mais rápido, já teria terminado
        correctAnswer: if i were faster i would have finished already
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se fosse verdade, seria incrível
        correctAnswer: if it were true it would be amazing
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria ter tido a chance
        correctAnswer: i wish i had had the chance
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se você precisar, me avise
        correctAnswer: if you need anything let me know
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
