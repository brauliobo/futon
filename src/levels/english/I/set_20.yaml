title: ✏️ English I - Mixed Review Level I
level: I
subject: english
difficulty: 4
objectives:
  - B2.grammar.inversion
  - B2.grammar.cleft_sentences
  - B2.grammar.modals_deduction
  - B2.grammar.subjunctive
  - B2.grammar.participle_clauses
  - B2.grammar.linking_concession
  - B2.writing.discourse_markers
  - B2.vocabulary.academic_register
  - B2.vocabulary.abstract_concepts
  - B2.vocabulary.idioms
  - B2.writing.cohesion
authorNotes: Comprehensive review of all Level I topics — inversion, cleft sentences, advanced modals, subjunctive, participle clauses, concession/contrast, discourse markers, academic vocabulary, abstract concepts, idioms and cohesion.
repeatAll: 2
example: "Ex.: 'Nunca vi algo assim' → Never have I seen anything like it."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Grammar Review
    description: Inversion, clefts, modals, subjunctive and participle clauses.
    exercises:
      - type: english_phrases
        question: nunca trabalhei tanto na minha vida
        correctAnswer: Never have I worked so hard in my life
        rationale: "'Never have I worked' = inversion. 'So hard' = tanto/tão intensamente. Full emphatic structure."
        difficulty: 2
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: foi o professor que me inspirou a estudar linguística
        correctAnswer: It was my teacher who inspired me to study linguistics
        rationale: "'It was + noun + who' = it-cleft. Focuses on the person. 'Inspired me to' = inspirou a."
        difficulty: 2
        objectives: [B2.grammar.cleft_sentences]
      - type: english_phrases
        question: ela deve ter passado horas preparando essa apresentação
        correctAnswer: She must have spent hours preparing that presentation
        rationale: "'Must have spent' = certainty about past. 'Preparing' = gerund after 'spend time'."
        difficulty: 2
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: é essencial que todos os relatórios sejam entregues na sexta
        correctAnswer: It is essential that all reports be submitted on Friday
        rationale: "'Be submitted' = mandative subjunctive (passive). 'On Friday' = na sexta."
        difficulty: 3
        objectives: [B2.grammar.subjunctive]
      - type: english_phrases
        question: tendo revisado o documento, ela o enviou
        correctAnswer: Having reviewed the document she sent it
        rationale: "'Having reviewed' = perfect participle clause. Prior action before 'sent'."
        difficulty: 2
        objectives: [B2.grammar.participle_clauses]
      - type: english_phrases
        question: não só ele chegou tarde como também esqueceu os materiais
        correctAnswer: Not only did he arrive late but he also forgot the materials
        rationale: "'Not only did he...' = inversion. 'Also forgot' = also + past verb. Double negative emphasis."
        difficulty: 3
        objectives: [B2.grammar.inversion]
      - type: english_phrases
        question: o que o governo precisa fazer é investir em educação
        correctAnswer: What the government needs to do is invest in education
        rationale: "'What... needs to do is + bare infinitive' = wh-cleft. Focuses on the required action."
        difficulty: 3
        objectives: [B2.grammar.cleft_sentences]
      - type: english_phrases
        question: eles podem ter malentendido o propósito da reunião
        correctAnswer: They might have misunderstood the purpose of the meeting
        rationale: "'Might have misunderstood' = past possibility. 'Misunderstood' = irregular past participle."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: proponho que um grupo de trabalho seja formado imediatamente
        correctAnswer: I propose that a working group be formed immediately
        rationale: "'Be formed' = passive mandative subjunctive. 'Immediately' = adverb at end."
        difficulty: 3
        objectives: [B2.grammar.subjunctive]
      - type: english_phrases
        question: situada no centro histórico, a biblioteca atrai muitos visitantes
        correctAnswer: Situated in the historic centre the library attracts many visitors
        rationale: "'Situated in the historic centre' = past participle clause (passive, reduced relative). 'Attracts' = 3rd person."
        difficulty: 3
        objectives: [B2.grammar.participle_clauses]
  - pageNumber: 2
    title: Vocabulary & Discourse Review
    description: Linking, discourse markers, academic vocabulary, idioms and cohesion.
    exercises:
      - type: english_phrases
        question: embora cara, a solução foi a mais eficaz
        correctAnswer: Albeit costly the solution was the most effective
        rationale: "'Albeit costly' = concessive. 'The most effective' = superlative. Formal register throughout."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: além disso, o projeto contribuiu para o desenvolvimento local
        correctAnswer: Furthermore the project contributed to local development
        rationale: "'Furthermore' = addition discourse marker. 'Contributed to local development' = academic past."
        difficulty: 3
        objectives: [B2.writing.discourse_markers]
      - type: english_phrases
        question: o estudo demonstra que a desigualdade está aumentando
        correctAnswer: The study demonstrates that inequality is increasing
        rationale: "'Demonstrates that' = academic verb + reporting clause. 'Is increasing' = present trend."
        difficulty: 3
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: a sustentabilidade e a transparência são princípios-chave
        correctAnswer: Sustainability and transparency are key principles
        rationale: "'Key principles' = abstract concepts. Compound subject with plural verb 'are'."
        difficulty: 3
        objectives: [B2.vocabulary.abstract_concepts]
      - type: english_phrases
        question: ela foi muito além do esperado para terminar o projeto
        correctAnswer: She went the extra mile to finish the project
        rationale: "'Go the extra mile' = idiom for exceptional effort. 'To finish' = infinitive of purpose."
        difficulty: 3
        objectives: [B2.vocabulary.idioms]
      - type: english_phrases
        question: esse resultado levanta questões importantes sobre a metodologia
        correctAnswer: This result raises important questions about the methodology
        rationale: "'This result' = anaphoric reference. 'Raises questions about' = formal academic collocation."
        difficulty: 4
        objectives: [B2.writing.cohesion]
      - type: english_phrases
        question: ao passo que a teoria prevê crescimento, os dados mostram estagnação
        correctAnswer: Whereas the theory predicts growth the data shows stagnation
        rationale: "'Whereas' = contrast. 'Predicts/shows' = academic present. 'Stagnation' = estagnação."
        difficulty: 4
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: portanto, disso se segue que são necessárias mais evidências
        correctAnswer: Therefore it follows that further evidence is needed
        rationale: "'Therefore it follows that' = compound discourse logic. 'Further evidence' = mais evidências (formal)."
        difficulty: 4
        objectives: [B2.writing.discourse_markers]
      - type: english_phrases
        question: as recomendações foram implementadas; no entanto, os resultados variaram
        correctAnswer: The recommendations were implemented nevertheless the results varied
        rationale: "'Were implemented' = passive. 'Nevertheless' = concessive connector. 'Varied' = varied (regular past)."
        difficulty: 4
        objectives: [B2.vocabulary.academic_register]
      - type: english_phrases
        question: sob nenhuma circunstância devemos cortar caminho nessa questão
        correctAnswer: Under no circumstances should we cut corners on this matter
        rationale: "'Under no circumstances should we' = inversion. 'Cut corners on this matter' = idiom + formal prepositional phrase."
        difficulty: 4
        objectives: [B2.grammar.inversion]
target: 20
