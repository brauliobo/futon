title: ✏️ English I - Advanced Modals: Deduction & Speculation
level: I
subject: english
difficulty: 4
objectives:
  - B2.grammar.modals_deduction
authorNotes: Must have / can't have (certainty), might have / could have / may have (possibility), should have (expectation) — all referring to past situations. Contrasts with present deduction (must be, can't be).
repeatAll: 2
example: "Ex.: 'Ele deve ter saído' → He must have left."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Certainty — Must have & Can't have
    description: Expressing logical certainty about past events.
    exercises:
      - type: english_phrases
        question: ela deve ter perdido o trem
        correctAnswer: She must have missed the train
        rationale: "'Must have + past participle' = dedução certa no passado. 'Missed the train' = perdeu o trem."
        difficulty: 2
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: ele não pode ter feito isso sozinho
        correctAnswer: He can't have done that alone
        rationale: "'Can't have done' = impossibilidade no passado. 'Done' = past participle de 'do'."
        difficulty: 2
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: eles devem ter chegado já
        correctAnswer: They must have arrived already
        rationale: "'Must have arrived' = certainty in the past. 'Already' placed at end of sentence."
        difficulty: 2
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: isso não pode ter sido barato
        correctAnswer: That can't have been cheap
        rationale: "'Can't have been' — modal + have + been (past of be). Logical impossibility about past state."
        difficulty: 2
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: ela deve ter trabalhado a noite toda
        correctAnswer: She must have worked all night
        rationale: "'Must have worked' (regular past participle). 'All night' = a noite toda."
        difficulty: 2
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: ele não pode ter esquecido o nosso aniversário
        correctAnswer: He can't have forgotten our anniversary
        rationale: "'Forgotten' = past participle irregular of 'forget'. 'Our anniversary' = nosso aniversário."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: eles devem ter estado esperando por horas
        correctAnswer: They must have been waiting for hours
        rationale: "'Must have been waiting' = past perfect continuous. Prolonged action inferred from evidence."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: a reunião não pode ter durado tanto tempo
        correctAnswer: The meeting can't have lasted that long
        rationale: "'Lasted' = durou (regular). 'That long' = tanto tempo (informal). Modal impossibility."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: ela deve ter sido avisada sobre o problema
        correctAnswer: She must have been warned about the problem
        rationale: "'Must have been warned' — passive modal deduction. 'Warned about' = avisada sobre."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: eles não podem ter viajado sem passaporte
        correctAnswer: They can't have travelled without a passport
        rationale: "'Can't have travelled' = impossibilidade. 'Without a passport' = sem passaporte."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
  - pageNumber: 2
    title: Possibility — Might / Could / May have
    description: Expressing uncertainty and expectation about past events.
    exercises:
      - type: english_phrases
        question: ela pode ter esquecido a reunião
        correctAnswer: She might have forgotten the meeting
        rationale: "'Might have forgotten' = possibilidade no passado. 'Forgotten' = irregular past participle."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: eles podem ter saído mais cedo
        correctAnswer: They may have left early
        rationale: "'May have left' = weak possibility in the past. 'May' slightly more formal than 'might'."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: ele poderia ter tomado a estrada errada
        correctAnswer: He could have taken the wrong road
        rationale: "'Could have taken' = past possibility. 'The wrong road' = a estrada errada."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: o pacote pode ter sido entregue ao vizinho
        correctAnswer: The parcel might have been delivered to a neighbour
        rationale: "'Might have been delivered' — passive modal possibility. 'Neighbour' = British spelling."
        difficulty: 4
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: ela pode ter estado se sentindo mal
        correctAnswer: She may have been feeling unwell
        rationale: "'May have been feeling' — continuous aspect with modal. 'Unwell' = formal for 'sick/ill'."
        difficulty: 4
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: o acidente poderia ter sido evitado
        correctAnswer: The accident could have been avoided
        rationale: "'Could have been avoided' — passive + modal. 'Avoided' = evitado."
        difficulty: 4
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: deveria ter chovido ontem
        correctAnswer: It should have rained yesterday
        rationale: "'Should have rained' = expectation that wasn't met. 'It' for weather/impersonal."
        difficulty: 3
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: o resultado deveria ter sido diferente
        correctAnswer: The outcome should have been different
        rationale: "'Should have been' = expectation about past state. 'Outcome' = resultado (formal)."
        difficulty: 4
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: eles podem ter estado trabalhando no projeto a noite toda
        correctAnswer: They might have been working on the project all night
        rationale: "'Might have been working' = perfect continuous modal. Prolonged past possibility."
        difficulty: 4
        objectives: [B2.grammar.modals_deduction]
      - type: english_phrases
        question: a decisão pode ter sido tomada sem consultar a equipe
        correctAnswer: The decision may have been taken without consulting the team
        rationale: "'May have been taken' = passive possibility. 'Without consulting' = gerund after preposition."
        difficulty: 4
        objectives: [B2.grammar.modals_deduction]
target: 20
