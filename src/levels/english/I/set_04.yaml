title: English I - Third Conditional
level: I
subject: english
difficulty: 5
objectives:
  - B1.grammar.conditionals_third
authorNotes: Past regret. If + past perfect, would have + past participle. Something that did NOT happen.
repeatAll: 2
example: Se eu tivesse sabido, teria ajudado → If I had known, I would have helped
pages:
  - pageNumber: 1
    title: Past Regret
    description: Imagining a different past.
    exercises:
      - type: english_phrases
        question: Se eu tivesse sabido, teria ajudado
        correctAnswer: if i had known i would have helped
        rationale: "3rd conditional: if + past perfect, would have + particípio."
      - type: english_phrases
        question: Se ela tivesse estudado, teria passado
        correctAnswer: if she had studied she would have passed
        rationale: "Negativa: 'If he hadn't helped, I wouldn't have finished'."
      - type: english_phrases
        question: Se tivéssemos saído mais cedo, não teríamos perdido
        correctAnswer: if we had left earlier we would not have missed it
        rationale: "Inversão formal: 'Had I known, I would have called'."
      - type: english_phrases
        question: Se ele tivesse ligado, eu teria atendido
        correctAnswer: if he had called i would have answered
        rationale: "Negativa: 'If he hadn't helped, I wouldn't have finished'."
      - type: english_phrases
        question: Se você tivesse perguntado, eu teria dito
        correctAnswer: if you had asked i would have told you
        rationale: "Contrações: I'd studied (had); I'd have passed (would)."
      - type: english_phrases
        question: Se tivesse chovido, teríamos ficado
        correctAnswer: if it had rained we would have stayed
        rationale: "Negativa: 'If he hadn't helped, I wouldn't have finished'."
      - type: english_phrases
        question: Se eu tivesse comido, não estaria com fome
        correctAnswer: if i had eaten i would not be hungry
        rationale: "3rd conditional: if + past perfect, would have + particípio."
      - type: english_phrases
        question: Se eles tivessem vindo, teríamos celebrado
        correctAnswer: if they had come we would have celebrated
        rationale: "Hipótese no passado — já não pode mudar."
      - type: english_phrases
        question: Se eu tivesse acordado cedo, teria ido
        correctAnswer: if i had woken up early i would have gone
        rationale: "Inversão formal: 'Had I known, I would have called'."
      - type: english_phrases
        question: Se ela tivesse dito, eu teria entendido
        correctAnswer: if she had said so i would have understood
        rationale: "'If I had studied, I would have passed'."
  - pageNumber: 2
    title: Counterfactual Narratives
    description: Unrealised past scenarios.
    exercises:
      - type: english_phrases
        question: Se ele não tivesse saído, teria visto
        correctAnswer: if he had not left he would have seen it
        rationale: "Negativa: 'If he hadn't helped, I wouldn't have finished'."
      - type: english_phrases
        question: Se nós tivéssemos previsto, teríamos evitado
        correctAnswer: if we had predicted it we would have avoided it
        rationale: "Sem 'would' na if-cláusula."
      - type: english_phrases
        question: Se você tivesse treinado, teria vencido
        correctAnswer: if you had trained you would have won
        rationale: "Três passados: pensamento contrafactual."
      - type: english_phrases
        question: Se ela tivesse aceitado, estaria aqui
        correctAnswer: if she had accepted she would be here
        rationale: "Negativa: 'If he hadn't helped, I wouldn't have finished'."
      - type: english_phrases
        question: Se eu tivesse nascido antes, teria visto o show
        correctAnswer: if i had been born earlier i would have seen the show
        rationale: "Sem 'would' na if-cláusula."
      - type: english_phrases
        question: Se não tivéssemos ido, teríamos perdido a festa
        correctAnswer: if we had not gone we would have missed the party
        rationale: "Hipótese no passado — já não pode mudar."
      - type: english_phrases
        question: Se o ônibus tivesse atrasado, teríamos ido a pé
        correctAnswer: if the bus had been late we would have walked
        rationale: "Negativa: 'If he hadn't helped, I wouldn't have finished'."
      - type: english_phrases
        question: Se ele tivesse escutado, não teria errado
        correctAnswer: if he had listened he would not have made a mistake
        rationale: "Arrependimento ou resultado imaginário do passado."
      - type: english_phrases
        question: Se tivessem me avisado, eu teria ajudado
        correctAnswer: if they had told me i would have helped
        rationale: "Contrações: I'd studied (had); I'd have passed (would)."
      - type: english_phrases
        question: Se eu tivesse visto, teria avisado
        correctAnswer: if i had seen i would have warned
        rationale: "'If I had studied, I would have passed'."
target: 20
