title: ✏️ English I - Advanced Linking: Concession & Contrast
level: I
subject: english
difficulty: 4
objectives:
  - B2.grammar.linking_concession
authorNotes: Concession connectors (albeit, notwithstanding, even so, nevertheless) and contrast connectors (whereas, while, on the other hand, by contrast). Critical for B2 writing coherence and argument structure.
repeatAll: 2
example: "Ex.: 'Embora caro, o hotel valia a pena' → Albeit expensive the hotel was worth it."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Concession Connectors
    description: Expressing concession with albeit, notwithstanding, nevertheless, even so.
    exercises:
      - type: english_phrases
        question: embora pequeno, o apartamento é bem localizado
        correctAnswer: Albeit small the apartment is well located
        rationale: "'Albeit + adjective/clause' = although. Formal, often used without a subject. 'Well located' = bem localizado."
        difficulty: 2
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: apesar dos problemas, o projeto foi concluído com sucesso
        correctAnswer: Notwithstanding the problems the project was completed successfully
        rationale: "'Notwithstanding + noun phrase' = apesar de. Formal alternative to 'despite'. Precedes main clause."
        difficulty: 2
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: mesmo assim, ela decidiu continuar
        correctAnswer: Even so she decided to continue
        rationale: "'Even so' = mesmo assim — adverbial connector. Starts a new clause, separated by comma."
        difficulty: 2
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: no entanto, os resultados foram decepcionantes
        correctAnswer: Nevertheless the results were disappointing
        rationale: "'Nevertheless' = no entanto/mesmo assim. Formal concessive adverb introducing the contrast."
        difficulty: 2
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: embora caro, o tratamento foi eficaz
        correctAnswer: Albeit expensive the treatment was effective
        rationale: "'Albeit expensive' = although it was expensive. Adjective phrase follows 'albeit'. Concise and formal."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: apesar dos riscos, eles investiram no projeto
        correctAnswer: Notwithstanding the risks they invested in the project
        rationale: "'Notwithstanding the risks' = despite the risks. Formal register, common in legal/business writing."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: ele falhou em muitas tentativas; mesmo assim, não desistiu
        correctAnswer: He failed many times even so he did not give up
        rationale: "'Even so' links two clauses showing concession. 'Give up' = desistir."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: o relatório tinha falhas; contudo, foi aceito
        correctAnswer: The report had flaws nevertheless it was accepted
        rationale: "'Nevertheless' = contudo/no entanto. Mid-position connector between two independent clauses."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: apesar das dificuldades econômicas, o país cresceu
        correctAnswer: Notwithstanding the economic difficulties the country grew
        rationale: "'Economic difficulties' = noun phrase with adjective pre-modifier. Formal written concession."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: embora imperfeita, a solução foi a melhor disponível
        correctAnswer: Albeit imperfect the solution was the best available
        rationale: "'Best available' = post-modified superlative (short for 'best solution available'). 'Albeit imperfect' = concessive."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
  - pageNumber: 2
    title: Contrast Connectors
    description: Expressing contrast with whereas, while, by contrast, on the other hand.
    exercises:
      - type: english_phrases
        question: enquanto ele prefere trabalhar à noite, ela prefere de manhã
        correctAnswer: Whereas he prefers working at night she prefers mornings
        rationale: "'Whereas' = ao passo que — direct contrast between two subjects. Both clauses share same structure."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: enquanto alguns concordam, outros discordam totalmente
        correctAnswer: While some agree others strongly disagree
        rationale: "'While' = ao passo que (contrast, not time). 'Strongly disagree' = discordam totalmente."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: por outro lado, há algumas vantagens em trabalhar remotamente
        correctAnswer: On the other hand there are some advantages to working remotely
        rationale: "'On the other hand' = por outro lado. Introduces the contrasting perspective. 'To working' = gerund after 'advantages to'."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: em contraste, os países nórdicos têm altos índices de felicidade
        correctAnswer: By contrast Nordic countries have high happiness levels
        rationale: "'By contrast' = em contraste. Adverbial phrase fronted to highlight the comparison."
        difficulty: 3
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: ao passo que a demanda aumentou, a oferta diminuiu
        correctAnswer: While demand increased supply fell
        rationale: "'While demand increased supply fell' — economic contrast. 'Supply' = oferta; 'fell' = past of 'fall'."
        difficulty: 4
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: ao passo que países ricos poluem mais, os pobres sofrem mais
        correctAnswer: Whereas rich countries pollute more poor countries suffer more
        rationale: "'Whereas' contrasts two noun phrases in parallel structure. Common in academic argument."
        difficulty: 4
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: por outro lado, a tecnologia também criou novos problemas
        correctAnswer: On the other hand technology has also created new problems
        rationale: "'Has also created' = present perfect with 'also' mid-position. Balancing a previous argument."
        difficulty: 4
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: ao contrário, os testes mostraram resultados positivos
        correctAnswer: By contrast the tests showed positive results
        rationale: "'By contrast' introduces opposing evidence. 'Showed positive results' = mostraram resultados positivos."
        difficulty: 4
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: enquanto uns valorizam a segurança, outros priorizam a liberdade
        correctAnswer: While some value security others prioritise freedom
        rationale: "'Value' and 'prioritise' as parallel verbs. 'While' contrasts two values/positions."
        difficulty: 4
        objectives: [B2.grammar.linking_concession]
      - type: english_phrases
        question: ao passo que a teoria é simples, a prática é bem mais complexa
        correctAnswer: Whereas the theory is straightforward the practice is far more complex
        rationale: "'Straightforward' = simples/direto. 'Far more complex' = bem mais complexo (far intensifies comparatives)."
        difficulty: 4
        objectives: [B2.grammar.linking_concession]
target: 20
