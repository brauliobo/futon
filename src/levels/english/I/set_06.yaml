title: English I - Wishes & Regrets
level: I
subject: english
difficulty: 4
objectives: [B1.grammar.wish]
authorNotes: Wish + past simple (present regret), Wish + past perfect (past regret), Wish + would (annoyance / desired change).
repeatAll: 2
example: "Queria saber → I wish I knew"
pages:
  - pageNumber: 1
    title: Present & Past Wishes
    description: Present situation regret (past simple) and past situation regret (past perfect).
    exercises:
      - { type: english_phrases, question: "Queria saber", correctAnswer: i wish i knew }
      - { type: english_phrases, question: "Queria ser mais alto", correctAnswer: i wish i were taller }
      - { type: english_phrases, question: "Queria que ela estivesse aqui", correctAnswer: i wish she were here }
      - { type: english_phrases, question: "Queria ter tempo", correctAnswer: i wish i had time }
      - { type: english_phrases, question: "Queria falar francês", correctAnswer: i wish i spoke french }
      - { type: english_phrases, question: "Queria ter estudado mais", correctAnswer: i wish i had studied more }
      - { type: english_phrases, question: "Queria ter ido à festa", correctAnswer: i wish i had gone to the party }
      - { type: english_phrases, question: "Queria não ter dito isso", correctAnswer: i wish i had not said that }
      - { type: english_phrases, question: "Queria ter te conhecido antes", correctAnswer: i wish i had met you earlier }
      - { type: english_phrases, question: "Queria ter aceitado o emprego", correctAnswer: i wish i had accepted the job }
  - pageNumber: 2
    title: Wish + Would & If Only
    description: Expressing annoyance or strong desire for change.
    exercises:
      - { type: english_phrases, question: "Queria que ele parasse de falar", correctAnswer: i wish he would stop talking }
      - { type: english_phrases, question: "Queria que o ônibus chegasse logo", correctAnswer: i wish the bus would come soon }
      - { type: english_phrases, question: "Queria que parasse de chover", correctAnswer: i wish it would stop raining }
      - { type: english_phrases, question: "Queria que ela me ligasse", correctAnswer: i wish she would call me }
      - { type: english_phrases, question: "Queria que eles escutassem", correctAnswer: i wish they would listen }
      - { type: english_phrases, question: "Se eu ao menos soubesse", correctAnswer: if only i knew }
      - { type: english_phrases, question: "Se ao menos ele estivesse aqui", correctAnswer: if only he were here }
      - { type: english_phrases, question: "Se ao menos eu pudesse ir", correctAnswer: if only i could go }
      - { type: english_phrases, question: "Se ao menos tivéssemos tempo", correctAnswer: if only we had time }
      - { type: english_phrases, question: "Se ao menos eles entendessem", correctAnswer: if only they understood }
target: 20
