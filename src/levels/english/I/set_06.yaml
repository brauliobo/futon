title: English I - Wishes & Regrets
level: I
subject: english
difficulty: 4
objectives:
  - B1.grammar.wish
authorNotes: Wish + past simple (present regret), Wish + past perfect (past regret), Wish + would (annoyance / desired change).
repeatAll: 2
example: Queria saber → I wish I knew
pages:
  - pageNumber: 1
    title: Present & Past Wishes
    description: Present situation regret (past simple) and past situation regret (past perfect).
    exercises:
      - type: english_phrases
        question: Queria saber
        correctAnswer: i wish i knew
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria ser mais alto
        correctAnswer: i wish i were taller
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria que ela estivesse aqui
        correctAnswer: i wish she were here
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria ter tempo
        correctAnswer: i wish i had time
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria falar francês
        correctAnswer: i wish i spoke french
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria ter estudado mais
        correctAnswer: i wish i had studied more
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria ter ido à festa
        correctAnswer: i wish i had gone to the party
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria não ter dito isso
        correctAnswer: i wish i had not said that
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria ter te conhecido antes
        correctAnswer: i wish i had met you earlier
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria ter aceitado o emprego
        correctAnswer: i wish i had accepted the job
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Wish + Would & If Only
    description: Expressing annoyance or strong desire for change.
    exercises:
      - type: english_phrases
        question: Queria que ele parasse de falar
        correctAnswer: i wish he would stop talking
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria que o ônibus chegasse logo
        correctAnswer: i wish the bus would come soon
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria que parasse de chover
        correctAnswer: i wish it would stop raining
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria que ela me ligasse
        correctAnswer: i wish she would call me
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Queria que eles escutassem
        correctAnswer: i wish they would listen
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se eu ao menos soubesse
        correctAnswer: if only i knew
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se ao menos ele estivesse aqui
        correctAnswer: if only he were here
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se ao menos eu pudesse ir
        correctAnswer: if only i could go
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se ao menos tivéssemos tempo
        correctAnswer: if only we had time
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Se ao menos eles entendessem
        correctAnswer: if only they understood
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
