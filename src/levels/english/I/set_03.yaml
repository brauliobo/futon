title: English I - Second Conditional
level: I
subject: english
difficulty: 4
objectives:
  - B1.grammar.conditionals_second
authorNotes: Hypothetical present/future. If + past simple, would + base verb. Use 'were' for all persons (formal).
repeatAll: 2
example: Se eu fosse rico, viajaria → If I were rich, I would travel
pages:
  - pageNumber: 1
    title: Hypothetical Situations
    description: Imagined scenarios in the present/future.
    exercises:
      - type: english_phrases
        question: Se eu fosse rico, viajaria
        correctAnswer: if i were rich i would travel
        rationale: "2º cond.: 'if I were' (subjuntivo, não 'was') + 'would + base'."
      - type: english_phrases
        question: Se ela tivesse tempo, viria
        correctAnswer: if she had time she would come
        rationale: "'Had' (past de have) no if. 'Would come' no resultado hipotético."
      - type: english_phrases
        question: Se eu soubesse, te contaria
        correctAnswer: if i knew i would tell you
        rationale: "'Knew' (past de know). 'Tell you' — 'tell' pede objeto."
      - type: english_phrases
        question: Se ele fosse mais alto, jogaria basquete
        correctAnswer: if he were taller he would play basketball
        rationale: "'Were' (subjuntivo). 'Taller' comparativo. 'Play basketball' sem 'the'."
      - type: english_phrases
        question: Se morássemos perto, nos víamos sempre
        correctAnswer: if we lived near we would see each other often
        rationale: "'Lived' (past). 'See each other' = ver-se (recíproco). 'Often' ao final."
      - type: english_phrases
        question: Se você fosse eu, o que faria?
        correctAnswer: if you were me what would you do
        rationale: "'Were me' (hipotético). 'What would you do?' pergunta na result clause."
      - type: english_phrases
        question: Se eu ganhasse na loteria, compraria uma casa
        correctAnswer: if i won the lottery i would buy a house
        rationale: "'Won the lottery' = ganhou (past de win). 'The lottery' específico."
      - type: english_phrases
        question: Se ela estudasse mais, passaria
        correctAnswer: if she studied more she would pass
        rationale: "'Studied more' (past). 'Would pass' (no resultado). Hipotético."
      - type: english_phrases
        question: Se tivéssemos dinheiro, viajaríamos
        correctAnswer: if we had money we would travel
        rationale: "'Had money' (past). 'Would travel' resultado irreal presente."
      - type: english_phrases
        question: Se ele me amasse, me diria
        correctAnswer: if he loved me he would tell me
        rationale: "'Loved me' (past). 'Tell me' — 'tell' + objeto indireto."
  - pageNumber: 2
    title: Advice with 'If I were you'
    description: Common advice pattern.
    exercises:
      - type: english_phrases
        question: Se eu fosse você, eu iria
        correctAnswer: if i were you i would go
        rationale: "'If I were you' — subjuntivo para conselho. 'Would go' na base."
      - type: english_phrases
        question: Se eu fosse você, eu aceitaria
        correctAnswer: if i were you i would accept
        rationale: "'If I were you I would accept' — conselho. 'Accept' na base."
      - type: english_phrases
        question: Se eu fosse você, eu descansaria
        correctAnswer: if i were you i would rest
        rationale: "'Would rest' = descansaria. Conselho hipotético."
      - type: english_phrases
        question: Se eu fosse você, eu não faria isso
        correctAnswer: if i were you i would not do that
        rationale: "'Would not do that' — negativa no resultado. 'That' = isso."
      - type: english_phrases
        question: Se eu fosse você, eu estudaria mais
        correctAnswer: if i were you i would study more
        rationale: "'Would study more' — 'more' ao final (não 'more study')."
      - type: english_phrases
        question: Se eu fosse você, eu ligaria agora
        correctAnswer: if i were you i would call now
        rationale: "'Would call now' — 'call' na base, 'now' ao final."
      - type: english_phrases
        question: Se eu fosse você, eu pediria desculpas
        correctAnswer: if i were you i would apologize
        rationale: "'Apologize' = pedir desculpas (um verbo só). 'Would apologize'."
      - type: english_phrases
        question: Se eu fosse você, eu ficaria quieto
        correctAnswer: if i were you i would stay quiet
        rationale: "'Stay quiet' = ficar quieto (adj após stay). 'Would stay'."
      - type: english_phrases
        question: Se eu fosse você, eu economizaria
        correctAnswer: if i were you i would save
        rationale: "'Save' = economizar (sem objeto aqui). 'Would save' hipotético."
      - type: english_phrases
        question: Se eu fosse você, eu viajaria agora
        correctAnswer: if i were you i would travel now
        rationale: "'Would travel now' — 'travel' na base. 'Now' ao final."
target: 20
