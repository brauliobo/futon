title: English I - Second Conditional
level: I
subject: english
difficulty: 4
objectives: [B1.grammar.conditionals_second]
authorNotes: Hypothetical present/future. If + past simple, would + base verb. Use 'were' for all persons (formal).
repeatAll: 2
example: "Se eu fosse rico, viajaria → If I were rich, I would travel"
pages:
  - pageNumber: 1
    title: Hypothetical Situations
    description: Imagined scenarios in the present/future.
    exercises:
      - { type: english_phrases, question: "Se eu fosse rico, viajaria", correctAnswer: if i were rich i would travel }
      - { type: english_phrases, question: "Se ela tivesse tempo, viria", correctAnswer: if she had time she would come }
      - { type: english_phrases, question: "Se eu soubesse, te contaria", correctAnswer: if i knew i would tell you }
      - { type: english_phrases, question: "Se ele fosse mais alto, jogaria basquete", correctAnswer: if he were taller he would play basketball }
      - { type: english_phrases, question: "Se morássemos perto, nos víamos sempre", correctAnswer: if we lived near we would see each other often }
      - { type: english_phrases, question: "Se você fosse eu, o que faria?", correctAnswer: if you were me what would you do }
      - { type: english_phrases, question: "Se eu ganhasse na loteria, compraria uma casa", correctAnswer: if i won the lottery i would buy a house }
      - { type: english_phrases, question: "Se ela estudasse mais, passaria", correctAnswer: if she studied more she would pass }
      - { type: english_phrases, question: "Se tivéssemos dinheiro, viajaríamos", correctAnswer: if we had money we would travel }
      - { type: english_phrases, question: "Se ele me amasse, me diria", correctAnswer: if he loved me he would tell me }
  - pageNumber: 2
    title: Advice with 'If I were you'
    description: Common advice pattern.
    exercises:
      - { type: english_phrases, question: "Se eu fosse você, eu iria", correctAnswer: if i were you i would go }
      - { type: english_phrases, question: "Se eu fosse você, eu aceitaria", correctAnswer: if i were you i would accept }
      - { type: english_phrases, question: "Se eu fosse você, eu descansaria", correctAnswer: if i were you i would rest }
      - { type: english_phrases, question: "Se eu fosse você, eu não faria isso", correctAnswer: if i were you i would not do that }
      - { type: english_phrases, question: "Se eu fosse você, eu estudaria mais", correctAnswer: if i were you i would study more }
      - { type: english_phrases, question: "Se eu fosse você, eu ligaria agora", correctAnswer: if i were you i would call now }
      - { type: english_phrases, question: "Se eu fosse você, eu pediria desculpas", correctAnswer: if i were you i would apologize }
      - { type: english_phrases, question: "Se eu fosse você, eu ficaria quieto", correctAnswer: if i were you i would stay quiet }
      - { type: english_phrases, question: "Se eu fosse você, eu economizaria", correctAnswer: if i were you i would save }
      - { type: english_phrases, question: "Se eu fosse você, eu viajaria agora", correctAnswer: if i were you i would travel now }
target: 20
