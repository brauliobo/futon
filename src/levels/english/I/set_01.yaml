title: English I - Zero Conditional
level: I
subject: english
difficulty: 2
objectives:
  - B1.grammar.conditionals_zero
authorNotes: Zero conditional — general truths and rules. If/When + present simple, present simple.
repeatAll: 2
example: Se chove, eu fico em casa → If it rains, I stay at home
pages:
  - pageNumber: 1
    title: General Truths
    description: Scientific facts and rules.
    exercises:
      - type: english_phrases
        question: Se você aquece a água, ela ferve
        correctAnswer: if you heat water it boils
        rationale: "Dois presentes simples: receita do zero."
      - type: english_phrases
        question: Se chove, as ruas ficam molhadas
        correctAnswer: if it rains the streets get wet
        rationale: "Uso científico e instrucional."
      - type: english_phrases
        question: Se você mistura azul e amarelo, fica verde
        correctAnswer: if you mix blue and yellow you get green
        rationale: "Sujeito genérico ou 'you' impessoal."
      - type: english_phrases
        question: Plantas morrem se não regam
        correctAnswer: plants die if you do not water them
        rationale: "Sem 'will' — é regra, não previsão."
      - type: english_phrases
        question: O gelo derrete se aquece
        correctAnswer: ice melts if you heat it
        rationale: "Zero conditional: if + present simple, present simple."
      - type: english_phrases
        question: Se toca fogo em papel, queima
        correctAnswer: if you light paper it burns
        rationale: "Uso científico e instrucional."
      - type: english_phrases
        question: Quando faz frio, eu uso casaco
        correctAnswer: when it is cold i wear a coat
        rationale: "Intercambiável com 'when + present simple'."
      - type: english_phrases
        question: Se o semáforo está vermelho, pare
        correctAnswer: if the light is red stop
        rationale: "Uso científico e instrucional."
      - type: english_phrases
        question: Se bebê está com fome, chora
        correctAnswer: if the baby is hungry it cries
        rationale: "Fato geral ou verdade: 'If you heat water, it boils'."
      - type: english_phrases
        question: Quando você aperta o botão, a luz acende
        correctAnswer: when you press the button the light turns on
        rationale: "Inverta ordem sem vírgula: 'Plants grow if it rains'."
  - pageNumber: 2
    title: Habits and Routines
    description: Predictable results in repeated situations.
    exercises:
      - type: english_phrases
        question: Se eu acordo cedo, faço exercício
        correctAnswer: if i wake up early i exercise
        rationale: "Uso científico e instrucional."
      - type: english_phrases
        question: Quando ela tem tempo, ela lê
        correctAnswer: when she has time she reads
        rationale: "Vírgula separa if-cláusula quando vem primeiro."
      - type: english_phrases
        question: Se estudamos juntos, aprendemos mais
        correctAnswer: if we study together we learn more
        rationale: "Zero conditional: if + present simple, present simple."
      - type: english_phrases
        question: Ele fica cansado se não dorme bem
        correctAnswer: he gets tired if he does not sleep well
        rationale: "Sujeito genérico ou 'you' impessoal."
      - type: english_phrases
        question: Se meus amigos vêm, cozinhamos
        correctAnswer: if my friends come we cook
        rationale: "Intercambiável com 'when + present simple'."
      - type: english_phrases
        question: Quando chove, eles ficam dentro de casa
        correctAnswer: when it rains they stay indoors
        rationale: "Sujeito genérico ou 'you' impessoal."
      - type: english_phrases
        question: Se eu perco o ônibus, vou a pé
        correctAnswer: if i miss the bus i walk
        rationale: "Sem 'will' — é regra, não previsão."
      - type: english_phrases
        question: Você fica saudável se come bem
        correctAnswer: you stay healthy if you eat well
        rationale: "Uso científico e instrucional."
      - type: english_phrases
        question: Se a bateria acaba, o telefone desliga
        correctAnswer: if the battery dies the phone turns off
        rationale: "Sem 'will' — é regra, não previsão."
      - type: english_phrases
        question: Quando o professor entra, paramos de falar
        correctAnswer: when the teacher comes in we stop talking
        rationale: "Vírgula separa if-cláusula quando vem primeiro."
target: 20
