title: English I - Mixed & Inverted Conditionals
level: I
subject: english
difficulty: 5
objectives: [B1.grammar.conditionals_mixed]
authorNotes: Mixed conditionals — past condition / present result, or present condition / past result. Inversion replaces 'if' (Had I known…).
repeatAll: 2
example: "Se eu tivesse estudado, estaria melhor agora → If I had studied, I would be better now"
pages:
  - pageNumber: 1
    title: Mixed Conditionals
    description: Different time references across clauses.
    exercises:
      - { type: english_phrases, question: "Se eu tivesse estudado, estaria melhor agora", correctAnswer: if i had studied i would be better now }
      - { type: english_phrases, question: "Se eu fosse mais organizado, teria terminado ontem", correctAnswer: if i were more organized i would have finished yesterday }
      - { type: english_phrases, question: "Se ela não tivesse perdido o voo, estaria aqui", correctAnswer: if she had not missed the flight she would be here }
      - { type: english_phrases, question: "Se ele soubesse nadar, teria pulado", correctAnswer: if he knew how to swim he would have jumped in }
      - { type: english_phrases, question: "Se não tivéssemos corrido, estaríamos atrasados", correctAnswer: if we had not run we would be late }
      - { type: english_phrases, question: "Se eu fosse mais paciente, não teria brigado", correctAnswer: if i were more patient i would not have argued }
      - { type: english_phrases, question: "Se ele tivesse acordado, não estaria cansado", correctAnswer: if he had woken up he would not be tired }
      - { type: english_phrases, question: "Se você soubesse cozinhar, teria feito o jantar", correctAnswer: if you knew how to cook you would have made dinner }
      - { type: english_phrases, question: "Se tivéssemos salvado, teríamos dinheiro agora", correctAnswer: if we had saved we would have money now }
      - { type: english_phrases, question: "Se ele fosse mais atento, teria visto", correctAnswer: if he were more attentive he would have seen it }
  - pageNumber: 2
    title: Inversion (Had / Were / Should)
    description: Formal omission of 'if' by inversion.
    exercises:
      - { type: english_phrases, question: "Tivesse eu sabido, teria ajudado", correctAnswer: had i known i would have helped }
      - { type: english_phrases, question: "Fosse eu você, iria agora", correctAnswer: were i you i would go now }
      - { type: english_phrases, question: "Caso você precise, me ligue", correctAnswer: should you need anything call me }
      - { type: english_phrases, question: "Tivéssemos ido, teríamos visto", correctAnswer: had we gone we would have seen it }
      - { type: english_phrases, question: "Fosse ela aqui, resolveria", correctAnswer: were she here she would solve it }
      - { type: english_phrases, question: "Caso ele ligue, me avise", correctAnswer: should he call let me know }
      - { type: english_phrases, question: "Tivesse ela dito, teríamos ajudado", correctAnswer: had she said so we would have helped }
      - { type: english_phrases, question: "Caso isso aconteça, fique calmo", correctAnswer: should that happen stay calm }
      - { type: english_phrases, question: "Tivéssemos sabido, teríamos vindo", correctAnswer: had we known we would have come }
      - { type: english_phrases, question: "Fossem eles mais rápidos, venceriam", correctAnswer: were they faster they would win }
target: 20
