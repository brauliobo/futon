title: English I - Mixed & Inverted Conditionals
level: I
subject: english
difficulty: 5
objectives:
  - B1.grammar.conditionals_mixed
authorNotes: Mixed conditionals — past condition / present result, or present condition / past result. Inversion replaces 'if' (Had I known…).
repeatAll: 2
example: Se eu tivesse estudado, estaria melhor agora → If I had studied, I would be better now
pages:
  - pageNumber: 1
    title: Mixed Conditionals
    description: Different time references across clauses.
    exercises:
      - type: english_phrases
        question: Se eu tivesse estudado, estaria melhor agora
        correctAnswer: if i had studied i would be better now
        rationale: "'Had + sujeito + particípio' — 3rd invertido."
      - type: english_phrases
        question: Se eu fosse mais organizado, teria terminado ontem
        correctAnswer: if i were more organized i would have finished yesterday
        rationale: "Inversão substitui 'if' em registro formal."
      - type: english_phrases
        question: Se ela não tivesse perdido o voo, estaria aqui
        correctAnswer: if she had not missed the flight she would be here
        rationale: "Mantenha coerência temporal e lógica."
      - type: english_phrases
        question: Se ele soubesse nadar, teria pulado
        correctAnswer: if he knew how to swim he would have jumped in
        rationale: "Terceiro invertido: 'Had I known, I would have come'."
      - type: english_phrases
        question: Se não tivéssemos corrido, estaríamos atrasados
        correctAnswer: if we had not run we would be late
        rationale: "'Had + sujeito + particípio' — 3rd invertido."
      - type: english_phrases
        question: Se eu fosse mais paciente, não teria brigado
        correctAnswer: if i were more patient i would not have argued
        rationale: "'Were + sujeito' só no 2nd conditional."
      - type: english_phrases
        question: Se ele tivesse acordado, não estaria cansado
        correctAnswer: if he had woken up he would not be tired
        rationale: "Inversão formal: 'Were I rich, I would travel'."
      - type: english_phrases
        question: Se você soubesse cozinhar, teria feito o jantar
        correctAnswer: if you knew how to cook you would have made dinner
        rationale: "'Had + sujeito + particípio' — 3rd invertido."
      - type: english_phrases
        question: Se tivéssemos salvado, teríamos dinheiro agora
        correctAnswer: if we had saved we would have money now
        rationale: "Inversão substitui 'if' em registro formal."
      - type: english_phrases
        question: Se ele fosse mais atento, teria visto
        correctAnswer: if he were more attentive he would have seen it
        rationale: "'Had + sujeito + particípio' — 3rd invertido."
  - pageNumber: 2
    title: Inversion (Had / Were / Should)
    description: Formal omission of 'if' by inversion.
    exercises:
      - type: english_phrases
        question: Tivesse eu sabido, teria ajudado
        correctAnswer: had i known i would have helped
        rationale: "Primeiro invertido: 'Should you need help, call me'."
      - type: english_phrases
        question: Fosse eu você, iria agora
        correctAnswer: were i you i would go now
        rationale: "Terceiro invertido: 'Had I known, I would have come'."
      - type: english_phrases
        question: Caso você precise, me ligue
        correctAnswer: should you need anything call me
        rationale: "Misturas combinam tempos diferentes."
      - type: english_phrases
        question: Tivéssemos ido, teríamos visto
        correctAnswer: had we gone we would have seen it
        rationale: "Terceiro invertido: 'Had I known, I would have come'."
      - type: english_phrases
        question: Fosse ela aqui, resolveria
        correctAnswer: were she here she would solve it
        rationale: "Primeiro invertido: 'Should you need help, call me'."
      - type: english_phrases
        question: Caso ele ligue, me avise
        correctAnswer: should he call let me know
        rationale: "'Had + sujeito + particípio' — 3rd invertido."
      - type: english_phrases
        question: Tivesse ela dito, teríamos ajudado
        correctAnswer: had she said so we would have helped
        rationale: "Mantenha coerência temporal e lógica."
      - type: english_phrases
        question: Caso isso aconteça, fique calmo
        correctAnswer: should that happen stay calm
        rationale: "Misto: passado afeta presente. 'If I had studied, I would be a doctor now'."
      - type: english_phrases
        question: Tivéssemos sabido, teríamos vindo
        correctAnswer: had we known we would have come
        rationale: "Mantenha coerência temporal e lógica."
      - type: english_phrases
        question: Fossem eles mais rápidos, venceriam
        correctAnswer: were they faster they would win
        rationale: "Primeiro invertido: 'Should you need help, call me'."
target: 20
