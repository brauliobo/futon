title: ✏️ English I - Complex Noun Phrases
level: I
subject: english
difficulty: 4
objectives:
  - B2.vocabulary.complex_noun_phrases
authorNotes: Nominalisation (converting verbs/adjectives to nouns), abstract noun phrases, pre-modification and post-modification. Key for academic and formal writing at B2+.
repeatAll: 2
example: "Ex.: 'O governo decidiu aumentar os impostos' → The government's decision to raise taxes."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Nominalisation
    description: Converting verbs and adjectives into noun phrases.
    exercises:
      - type: english_phrases
        question: a chegada dos delegados foi adiada
        correctAnswer: The arrival of the delegates was postponed
        rationale: "'Arrival' = nominalisation of 'arrive'. 'Of the delegates' = post-modification. 'Postponed' = passive."
        difficulty: 2
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: a decisão de fechar a fábrica surpreendeu todos
        correctAnswer: The decision to close the factory surprised everyone
        rationale: "'Decision to close' = nominalisation + infinitive complement. 'Surprised everyone' = past simple."
        difficulty: 2
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: houve uma melhora significativa nos resultados
        correctAnswer: There was a significant improvement in the results
        rationale: "'Improvement' = nominalisation of 'improve'. 'In the results' = prepositional post-modifier."
        difficulty: 2
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: a recusa deles em cooperar causou atrasos
        correctAnswer: Their refusal to cooperate caused delays
        rationale: "'Refusal to cooperate' = nominalisation of 'refuse' + infinitive. 'Their' = pre-modifier."
        difficulty: 2
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: um aumento nos preços do petróleo afetou a economia
        correctAnswer: A rise in oil prices affected the economy
        rationale: "'Rise in oil prices' — noun + prepositional phrase + noun string. 'Oil prices' = pre-modifier."
        difficulty: 3
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: o fracasso do projeto foi investigado
        correctAnswer: The failure of the project was investigated
        rationale: "'Failure of the project' = abstract noun + of-phrase. 'Was investigated' = passive."
        difficulty: 3
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: a capacidade de aprender rapidamente é muito valorizada
        correctAnswer: The ability to learn quickly is highly valued
        rationale: "'Ability to learn quickly' = abstract noun + infinitive + adverb. 'Highly valued' = passive + adverb."
        difficulty: 3
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: a implementação de novas políticas levou tempo
        correctAnswer: The implementation of new policies took time
        rationale: "'Implementation of new policies' — long nominalised subject. 'Took time' = levou tempo."
        difficulty: 3
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: o crescimento da população nas cidades é preocupante
        correctAnswer: The growth of the urban population is worrying
        rationale: "'Urban population' = pre-modified noun. 'Worrying' = participial adjective predicate."
        difficulty: 3
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: o reconhecimento de seu trabalho foi importante para ela
        correctAnswer: The recognition of her work was important to her
        rationale: "'Recognition of her work' = nominalisation + of-phrase. 'Important to her' = adjective + prep."
        difficulty: 3
        objectives: [B2.vocabulary.complex_noun_phrases]
  - pageNumber: 2
    title: Abstract Nouns & Noun Strings
    description: Multi-word noun phrases with pre- and post-modification.
    exercises:
      - type: english_phrases
        question: uma política de saúde pública de longo prazo é necessária
        correctAnswer: A long-term public health policy is needed
        rationale: "'Long-term public health policy' — hyphenated pre-modifier + noun string. 'Is needed' = passive."
        difficulty: 3
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: os resultados do estudo de caso foram publicados
        correctAnswer: The results of the case study were published
        rationale: "'Case study' = noun string (compound noun). 'Results of the case study' = abstract post-modified NP."
        difficulty: 3
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: a qualidade de vida nas zonas rurais melhorou
        correctAnswer: The quality of life in rural areas has improved
        rationale: "'Quality of life in rural areas' — double post-modification. Present perfect = recent change."
        difficulty: 4
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: medidas de controle de emissão de carbono foram adotadas
        correctAnswer: Carbon emission control measures were adopted
        rationale: "'Carbon emission control measures' — long noun string as pre-modifier. 'Were adopted' = passive."
        difficulty: 4
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: a falta de evidências suficientes enfraqueceu o argumento
        correctAnswer: The lack of sufficient evidence weakened the argument
        rationale: "'Lack of sufficient evidence' — abstract noun + of-phrase + pre-modified noun. 'Weakened' = past."
        difficulty: 4
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: houve uma queda acentuada na taxa de desemprego
        correctAnswer: There was a sharp fall in the unemployment rate
        rationale: "'Sharp fall' = adjective pre-modifier. 'Unemployment rate' = compound noun. 'In' = post-modifier."
        difficulty: 4
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: o relatório anual de desempenho da empresa foi divulgado
        correctAnswer: The company's annual performance report was released
        rationale: "'Company's annual performance report' — possessive + adjective + noun string pre-modifier."
        difficulty: 4
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: a necessidade de reforma no sistema de saúde é urgente
        correctAnswer: The need for reform in the healthcare system is urgent
        rationale: "'Need for reform in the healthcare system' — double prepositional post-modification."
        difficulty: 4
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: uma estratégia de desenvolvimento sustentável foi proposta
        correctAnswer: A sustainable development strategy was proposed
        rationale: "'Sustainable development strategy' — participial adjective + compound noun. 'Was proposed' = passive."
        difficulty: 4
        objectives: [B2.vocabulary.complex_noun_phrases]
      - type: english_phrases
        question: o impacto de longo prazo das mudanças climáticas preocupa cientistas
        correctAnswer: The long-term impact of climate change concerns scientists
        rationale: "'Long-term impact of climate change' — hyphenated pre-mod + of-phrase. 'Concerns' = 3rd person."
        difficulty: 4
        objectives: [B2.vocabulary.complex_noun_phrases]
target: 20
