title: English I - First Conditional
level: I
subject: english
difficulty: 3
objectives: [B1.grammar.conditionals_first]
authorNotes: Real future condition — If + present simple, will + base verb.
repeatAll: 2
example: "Se chover, vou ficar em casa → If it rains, I will stay home"
pages:
  - pageNumber: 1
    title: Real Future Possibilities
    description: Likely outcome if condition happens.
    exercises:
      - { type: english_phrases, question: "Se chover, vou ficar em casa", correctAnswer: if it rains i will stay home }
      - { type: english_phrases, question: "Se você estudar, vai passar", correctAnswer: if you study you will pass }
      - { type: english_phrases, question: "Se ela chegar cedo, começamos", correctAnswer: if she arrives early we will start }
      - { type: english_phrases, question: "Se eles vierem, teremos festa", correctAnswer: if they come we will have a party }
      - { type: english_phrases, question: "Se você me ligar, eu atendo", correctAnswer: if you call me i will answer }
      - { type: english_phrases, question: "Se eu tiver tempo, te ajudo", correctAnswer: if i have time i will help you }
      - { type: english_phrases, question: "Se ele pedir, vou dizer a verdade", correctAnswer: if he asks i will tell the truth }
      - { type: english_phrases, question: "Se fizer sol, vamos à praia", correctAnswer: if it is sunny we will go to the beach }
      - { type: english_phrases, question: "Se perder o trem, pego um táxi", correctAnswer: if i miss the train i will take a taxi }
      - { type: english_phrases, question: "Se esquentar, abrimos a janela", correctAnswer: if it gets warm we will open the window }
  - pageNumber: 2
    title: Negatives and Questions
    description: Won't, unless, what if.
    exercises:
      - { type: english_phrases, question: "Se você não sair, vai perder", correctAnswer: if you do not leave you will miss it }
      - { type: english_phrases, question: "A menos que ela ligue, não vou", correctAnswer: unless she calls i will not go }
      - { type: english_phrases, question: "O que você faz se chover?", correctAnswer: what will you do if it rains }
      - { type: english_phrases, question: "E se ele atrasar?", correctAnswer: what if he is late }
      - { type: english_phrases, question: "Se você não comer, vai ficar com fome", correctAnswer: if you do not eat you will be hungry }
      - { type: english_phrases, question: "A menos que chova, vamos sair", correctAnswer: unless it rains we will go out }
      - { type: english_phrases, question: "Se ela não vier, começamos sem ela", correctAnswer: if she does not come we will start without her }
      - { type: english_phrases, question: "O que você diz se ele perguntar?", correctAnswer: what will you say if he asks }
      - { type: english_phrases, question: "Se não terminarmos, continuamos amanhã", correctAnswer: if we do not finish we will continue tomorrow }
      - { type: english_phrases, question: "A menos que o tempo mude, ficaremos", correctAnswer: unless the weather changes we will stay }
target: 20
