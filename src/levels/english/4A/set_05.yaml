title: 👁️ English 4A - Sight words — in, on, at, under, up, down
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.sight.words
authorNotes: Preposições de lugar essenciais para descrever posições.
repeatAll: 2
example: "Ex.: 'The cat is in the box.' 'The book is on the table.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Preposições in, on, at
    description: Aprenda as preposições mais comuns em inglês.
    exercises:
      - type: english_vocab
        question: Qual preposição significa 'dentro de'?
        correctAnswer: in
        rationale: "'in' = dentro de. The cat is in the box."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual preposição significa 'em cima de/sobre'?
        correctAnswer: on
        rationale: "'on' = em cima de, sobre. The book is on the table."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual preposição significa 'em (lugar específico)'?
        correctAnswer: at
        rationale: "'at' = em um lugar específico. I am at school. At home."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'The fish is ___ the water.' (dentro de)
        correctAnswer: in
        rationale: "'The fish is in the water.' — O peixe está dentro da água."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'The pen is ___ the desk.' (sobre/em cima de)
        correctAnswer: on
        rationale: "'The pen is on the desk.' — A caneta está sobre a mesa."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'She is ___ home.' (em um lugar)
        correctAnswer: at
        rationale: "'She is at home.' — Ela está em casa. 'at home' é expressão fixa."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'The bird is ___ the tree.' (em cima de)
        correctAnswer: on
        rationale: "'The bird is on the tree.' — O pássaro está na árvore."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I am ___ school now.' (em um lugar)
        correctAnswer: at
        rationale: "'I am at school now.' — Estou na escola agora."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'The juice is ___ the cup.' (dentro de)
        correctAnswer: in
        rationale: "'The juice is in the cup.' — O suco está dentro do copo."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual é a diferença entre 'in' e 'on'?
        correctAnswer: in = inside, on = surface
        rationale: "'in' = dentro. 'on' = sobre/na superfície. in the box vs on the table."
        difficulty: 2
        objectives: [pre-A1.sight.words]
  - pageNumber: 2
    title: Preposições under, up, down
    description: Aprenda under (embaixo), up (para cima) e down (para baixo).
    exercises:
      - type: english_vocab
        question: Qual preposição significa 'embaixo de/sob'?
        correctAnswer: under
        rationale: "'under' = embaixo de, sob. The cat is under the table."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual preposição/advérbio significa 'para cima'?
        correctAnswer: up
        rationale: "'up' = para cima. The bird flies up. Jump up!"
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual preposição/advérbio significa 'para baixo'?
        correctAnswer: down
        rationale: "'down' = para baixo. Sit down. The ball fell down."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'The cat is ___ the table.' (embaixo de)
        correctAnswer: under
        rationale: "'The cat is under the table.' — O gato está embaixo da mesa."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'The bird flies ___.' (direção — subindo)
        correctAnswer: up
        rationale: "'The bird flies up.' — O pássaro voa para cima."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'Sit ___!' (comando — sentar)
        correctAnswer: down
        rationale: "'Sit down!' — Sente-se! 'down' complementa o movimento."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual é o oposto de 'up'?
        correctAnswer: down
        rationale: "'down' (para baixo) é o oposto de 'up' (para cima)."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Quantas preposições você aprendeu nesta lição?
        correctAnswer: six
        rationale: "Você aprendeu 6 preposições/advérbios: in, on, at, under, up, down."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'The shoe is ___ the bed.' (sob/embaixo de)
        correctAnswer: under
        rationale: "'The shoe is under the bed.' — O sapato está embaixo da cama."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Escreva as 6 preposições desta lição em ordem
        correctAnswer: in, on, at, under, up, down
        rationale: "in, on, at, under, up, down — seis preposições/advérbios de lugar."
        difficulty: 2
        objectives: [pre-A1.sight.words]
target: 20
