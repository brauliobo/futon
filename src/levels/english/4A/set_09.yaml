title: 💬 English 4A - Frases — 'I am a ___'
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Apresentação pessoal e identidade com 'I am a/an'.
repeatAll: 2
example: "Ex.: 'I am a boy.' 'I am a student.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Identidade com 'I am'
    description: Use 'I am' para se identificar.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu sou um menino.' em inglês?
        correctAnswer: I am a boy.
        rationale: "'I am a boy.' — Identidade masculina. 'boy' = menino."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu sou uma menina.' em inglês?
        correctAnswer: I am a girl.
        rationale: "'I am a girl.' — Identidade feminina. 'girl' = menina."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu sou um estudante.' em inglês?
        correctAnswer: I am a student.
        rationale: "'I am a student.' — 'student' = estudante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu sou um professor.' em inglês?
        correctAnswer: I am a teacher.
        rationale: "'I am a teacher.' — 'teacher' = professor(a)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu sou um amigo.' em inglês?
        correctAnswer: I am a friend.
        rationale: "'I am a friend.' — 'friend' = amigo(a)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I ___ ___ child.' (sou uma criança)
        correctAnswer: am a
        rationale: "'I am a child.' — Eu sou uma criança."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I am ___ English student.' (artigo antes de vogal)
        correctAnswer: an
        rationale: "'I am an English student.' — Eu sou um estudante de inglês. 'an' antes de 'English'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: 'I am a boy' — como fazemos negativa?
        correctAnswer: I am not a boy.
        rationale: "'I am not a boy.' — 'not' vai depois de 'am'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu sou feliz.' em inglês? (adjetivo, não substantivo)
        correctAnswer: I am happy.
        rationale: "'I am happy.' — Com adjetivo, não usamos 'a'. I am happy (não: I am a happy)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a diferença: 'I am a student' vs 'I am happy'?
        correctAnswer: noun needs a/an, adjective doesn't
        rationale: "Com substantivo: 'I am a student'. Com adjetivo: 'I am happy' (sem 'a')."
        difficulty: 2
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Variações de 'I am'
    description: Use 'I am' com mais profissões e descrições.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu sou um médico.' em inglês?
        correctAnswer: I am a doctor.
        rationale: "'I am a doctor.' — 'doctor' = médico."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu sou um atleta.' em inglês?
        correctAnswer: I am an athlete.
        rationale: "'I am an athlete.' — 'an' antes de 'athlete' (começa com vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: 'I am' pode ser contraído para...?
        correctAnswer: I'm
        rationale: "'I am' pode ser contraído para 'I'm'. I'm happy. I'm a student."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu não sou um professor.' em inglês?
        correctAnswer: I am not a teacher.
        rationale: "'I am not a teacher.' — negativa com 'not' após 'am'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I ___ a good student.' (sou)
        correctAnswer: am
        rationale: "'I am a good student.' — Eu sou um bom estudante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Você é uma menina?' em inglês?
        correctAnswer: Are you a girl?
        rationale: "'Are you a girl?' — Para perguntas com 'you', invertemos: Are you...?"
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete a apresentação: 'Hello! I ___ Maria. I ___ a student.'
        correctAnswer: am, am
        rationale: "'Hello! I am Maria. I am a student.' — Olá! Eu sou Maria. Sou estudante."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Sou um(a) brasileiro(a).' em inglês?
        correctAnswer: I am Brazilian.
        rationale: "'I am Brazilian.' — Nacionalidades funcionam como adjetivos: sem 'a'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ am ___ seven years old.' (pronome/verbo/número)
        correctAnswer: I, am
        rationale: "'I am seven years old.' — Eu tenho sete anos."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Estou com fome.' em inglês?
        correctAnswer: I am hungry.
        rationale: "'I am hungry.' — Em inglês, usamos 'am' para estados físicos também."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
