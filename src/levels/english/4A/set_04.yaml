title: 👁️ English 4A - Sight words — can, can't, do, don't, will, won't
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.sight.words
authorNotes: Verbos modais e auxiliares básicos — habilidade, ação, futuro.
repeatAll: 2
example: "Ex.: 'I can swim.' 'I don't like rain.' 'I will help.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: "Can, can't, do, don't"
    description: "Aprenda os verbos modais can/can't e auxiliar do/don't."
    exercises:
      - type: english_vocab
        question: "Como se diz 'posso/sei' em inglês? (habilidade)"
        correctAnswer: can
        rationale: "'can' = posso/sei fazer. I can swim. She can sing."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Como se diz 'não posso/não sei' em inglês?"
        correctAnswer: can't
        rationale: "'can't' = cannot. I can't fly. She can't drive."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Como se diz 'faço/fazes' em inglês? (auxiliar presente)"
        correctAnswer: do
        rationale: "'do' é auxiliar do presente. Do you like? I do like it."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Como se diz 'não faço/não fazes' em inglês?"
        correctAnswer: don't
        rationale: "'don't' = do not. I don't like rain. You don't know."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'I ___ run fast.' (habilidade)"
        correctAnswer: can
        rationale: "'I can run fast.' — Eu sei/posso correr rápido."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'Pigs ___ fly.' (negativa de habilidade)"
        correctAnswer: can't
        rationale: "'Pigs can't fly.' — Porcos não podem/sabem voar."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'I ___ like vegetables.' (negativa — não gosto)"
        correctAnswer: don't
        rationale: "'I don't like vegetables.' — Eu não gosto de vegetais."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: '___ you like cats?' (pergunta com auxiliar)"
        correctAnswer: Do
        rationale: "'Do you like cats?' — Você gosta de gatos?"
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "'can't' é a contração de qual expressão?"
        correctAnswer: cannot
        rationale: "'can't' = cannot. A forma completa é 'cannot'."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "'don't' é a contração de qual expressão?"
        correctAnswer: do not
        rationale: "'don't' = do not. I don't = I do not."
        difficulty: 1
        objectives: [pre-A1.sight.words]
  - pageNumber: 2
    title: Will e won't — futuro
    description: Aprenda o futuro simples com will/won't.
    exercises:
      - type: english_vocab
        question: "Como se diz 'vou/irei' (futuro) em inglês?"
        correctAnswer: will
        rationale: "'will' indica futuro. I will help. She will come."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Como se diz 'não vou/não irei' (futuro negativo) em inglês?"
        correctAnswer: won't
        rationale: "'won't' = will not. I won't go. She won't come."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'I ___ help you.' (futuro — vou ajudar)"
        correctAnswer: will
        rationale: "'I will help you.' — Eu vou te ajudar."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'She ___ go to school today.' (futuro negativo)"
        correctAnswer: won't
        rationale: "'She won't go to school today.' — Ela não vai à escola hoje."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "'won't' é a contração de qual expressão?"
        correctAnswer: will not
        rationale: "'won't' = will not. I won't = I will not."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'It ___ rain tomorrow.' (futuro)"
        correctAnswer: will
        rationale: "'It will rain tomorrow.' — Vai chover amanhã."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'I ___ eat spinach!' (recusa firme)"
        correctAnswer: won't
        rationale: "'I won't eat spinach!' — Eu não vou comer espinafre!"
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Quantos verbos/auxiliares você aprendeu nesta lição?
        correctAnswer: six
        rationale: "Você aprendeu 6: can, can't, do, don't, will, won't."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Qual é a diferença entre 'can't' e 'won't'?"
        correctAnswer: ability vs choice
        rationale: "'can't' = não sou capaz (habilidade). 'won't' = não vou querer/escolho não (vontade)."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Escreva as 6 palavras desta lição
        correctAnswer: "can, can't, do, don't, will, won't"
        rationale: "can, can't, do, don't, will, won't — verbos modais e auxiliares essenciais."
        difficulty: 2
        objectives: [pre-A1.sight.words]
target: 20
