title: 💬 English 4A - Frases — 'Where is the ___?'
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Localização com 'Where is the ___?' e preposições in/on/under.
repeatAll: 2
example: "Ex.: 'Where is the book? It is on the table.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Perguntando localização
    description: Use 'Where is the ___?' para perguntar onde está algo.
    exercises:
      - type: english_vocab
        question: Como se diz 'Onde está o livro?' em inglês?
        correctAnswer: Where is the book?
        rationale: "'Where is the book?' — 'where' = onde. 'the book' = o livro."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Onde está o gato?' em inglês?
        correctAnswer: Where is the cat?
        rationale: "'Where is the cat?' — Mesmo padrão: Where is the + substantivo?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Responda: 'Where is the book?' — (está na mesa — on the table)
        correctAnswer: It is on the table.
        rationale: "'It is on the table.' — 'on' = em cima de. 'on the table' = na mesa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Responda: 'Where is the cat?' — (está na caixa — in the box)
        correctAnswer: It is in the box.
        rationale: "'It is in the box.' — 'in' = dentro de. 'in the box' = na caixa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Responda: 'Where is the ball?' — (está embaixo da cadeira — under the chair)
        correctAnswer: It is under the chair.
        rationale: "'It is under the chair.' — 'under' = embaixo de."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ is the pen? It is on the desk.' (onde)
        correctAnswer: Where
        rationale: "'Where is the pen?' — Pergunta com 'where' para localização."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'Where is ___ dog? It is in the garden.' (artigo)
        correctAnswer: the
        rationale: "'Where is the dog?' — 'the' para objeto específico."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'It is ___ the bag.' (dentro — preposição)
        correctAnswer: in
        rationale: "'It is in the bag.' — 'in' = dentro. O gato está dentro da bolsa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The book is ___ the shelf.' (na prateleira — em cima)
        correctAnswer: on
        rationale: "'The book is on the shelf.' — 'on' = em cima, sobre a prateleira."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The cat is ___ the table.' (embaixo)
        correctAnswer: under
        rationale: "'The cat is under the table.' — 'under' = embaixo."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Mais preposições e prática
    description: Pratique 'next to', 'in front of' e mais localizações.
    exercises:
      - type: english_vocab
        question: Como se diz 'ao lado de' em inglês?
        correctAnswer: next to
        rationale: "'next to' = ao lado de. The cat is next to the dog."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'na frente de' em inglês?
        correctAnswer: in front of
        rationale: "'in front of' = na frente de. The ball is in front of the door."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'Where is the bag? It is ___ ___ the door.' (na frente)
        correctAnswer: in front of
        rationale: "'It is in front of the door.' — Está na frente da porta."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The pencil is ___ ___ the book.' (ao lado)
        correctAnswer: next to
        rationale: "'The pencil is next to the book.' — O lápis está ao lado do livro."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Onde está meu livro?' em inglês?
        correctAnswer: Where is my book?
        rationale: "'Where is my book?' — Pronome possessivo 'my' no lugar de 'the'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ele está em cima da mesa.' em inglês?
        correctAnswer: It is on the table.
        rationale: "'It is on the table.' — 'on' para superfícies horizontais."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'Where ___ the cats? They are ___ the garden.' (são/no)
        correctAnswer: are, in
        rationale: "'Where are the cats? They are in the garden.' — Plural: 'are' e 'they'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Onde está minha mochila?' em inglês?
        correctAnswer: Where is my backpack?
        rationale: "'Where is my backpack?' — 'backpack' = mochila."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The dog is ___ the sofa.' (em cima do sofá)
        correctAnswer: on
        rationale: "'The dog is on the sofa.' — 'on' para superfícies."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Diga as 3 preposições de lugar desta lição
        correctAnswer: in, on, under
        rationale: "'in' = dentro, 'on' = em cima, 'under' = embaixo. As 3 principais."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
