title: 🍎 English 4A - Alimentos simples
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.food
authorNotes: Alimentos básicos — apple, banana, bread, milk, water, rice, egg.
repeatAll: 2
example: "Ex.: 'I like apples.' 'I drink milk.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Frutas e bebidas
    description: Aprenda apple, banana, orange, milk, water, juice.
    exercises:
      - type: english_vocab
        question: Como se diz 'maçã' em inglês?
        correctAnswer: apple
        rationale: "'apple' = maçã. A red apple. An apple a day."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'banana' em inglês?
        correctAnswer: banana
        rationale: "'banana' = banana. Mesma palavra! A yellow banana."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'laranja' (fruta) em inglês?
        correctAnswer: orange
        rationale: "'orange' = laranja. Fruta e cor têm o mesmo nome."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'leite' em inglês?
        correctAnswer: milk
        rationale: "'milk' = leite. I drink milk. A glass of milk."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'água' em inglês?
        correctAnswer: water
        rationale: "'water' = água. I drink water. A bottle of water."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'suco' em inglês?
        correctAnswer: juice
        rationale: "'juice' = suco. Orange juice. Apple juice."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: "Complete: 'I drink ___ every day.' (leite)"
        correctAnswer: milk
        rationale: "'I drink milk every day.' — Bebo leite todo dia."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: "Complete: 'I eat a red ___.' (maçã)"
        correctAnswer: apple
        rationale: "'I eat a red apple.' — Eu como uma maçã vermelha."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: "Complete: 'I want orange ___.' (suco de laranja)"
        correctAnswer: juice
        rationale: "'I want orange juice.' — Quero suco de laranja."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'Bebo água.' em inglês?
        correctAnswer: I drink water.
        rationale: "'I drink water.' — 'drink' = beber."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
  - pageNumber: 2
    title: Outros alimentos
    description: Aprenda bread, rice, egg, cheese e frases sobre comida.
    exercises:
      - type: english_vocab
        question: Como se diz 'pão' em inglês?
        correctAnswer: bread
        rationale: "'bread' = pão. A piece of bread."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'arroz' em inglês?
        correctAnswer: rice
        rationale: "'rice' = arroz. I eat rice and beans."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'ovo' em inglês?
        correctAnswer: egg
        rationale: "'egg' = ovo. An egg. Fried eggs."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'queijo' em inglês?
        correctAnswer: cheese
        rationale: "'cheese' = queijo. I like cheese. A cheese sandwich."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: "Complete: 'I eat ___ and beans.' (arroz)"
        correctAnswer: rice
        rationale: "'I eat rice and beans.' — Eu como arroz e feijão."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: "Complete: 'I eat ___ for breakfast.' (pão)"
        correctAnswer: bread
        rationale: "'I eat bread for breakfast.' — Como pão no café da manhã."
        difficulty: 1
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'Eu gosto de queijo.' em inglês?
        correctAnswer: I like cheese.
        rationale: "'I like cheese.' — 'like' = gostar."
        difficulty: 2
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Como se diz 'Eu não gosto de ovos.' em inglês?
        correctAnswer: I don't like eggs.
        rationale: "'I don't like eggs.' — 'eggs' no plural. 'don't like' = não gosto."
        difficulty: 2
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: Liste as bebidas desta lição em inglês
        correctAnswer: milk, water, juice
        rationale: "milk (leite), water (água), juice (suco) — as 3 bebidas."
        difficulty: 2
        objectives: [pre-A1.vocab.food]
      - type: english_vocab
        question: "Complete: 'For breakfast I eat ___ and drink ___.' (pão/leite)"
        correctAnswer: bread, milk
        rationale: "'I eat bread and drink milk.' — Como pão e bebo leite."
        difficulty: 2
        objectives: [pre-A1.vocab.food]
target: 20
