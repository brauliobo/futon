title: 👁️ English 4A - Sight words — is, am, are, was, were
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.sight.words
authorNotes: Verbo 'to be' — as formas mais usadas no presente e passado.
repeatAll: 2
example: "Ex.: 'I am happy.' 'She is tall.' 'They are friends.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Presente do verbo 'to be'
    description: is, am, are — as formas do presente.
    exercises:
      - type: english_vocab
        question: Qual forma do verbo 'to be' usamos com 'I'?
        correctAnswer: am
        rationale: "'I am' — I am happy, I am a student."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual forma do verbo 'to be' usamos com 'he/she/it'?
        correctAnswer: is
        rationale: "'he/she/it is' — She is tall, He is nice, It is big."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual forma do verbo 'to be' usamos com 'we/they/you'?
        correctAnswer: are
        rationale: "'we/they/you are' — We are friends, They are students, You are nice."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I ___ seven years old.' (verbo to be)
        correctAnswer: am
        rationale: "'I am seven years old.' — Eu tenho sete anos."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'She ___ my teacher.' (verbo to be)
        correctAnswer: is
        rationale: "'She is my teacher.' — Ela é minha professora."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'They ___ happy.' (verbo to be)
        correctAnswer: are
        rationale: "'They are happy.' — Eles estão felizes."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'We ___ friends.' (verbo to be)
        correctAnswer: are
        rationale: "'We are friends.' — Nós somos amigos."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'The dog ___ big.' (verbo to be — animal)
        correctAnswer: is
        rationale: "'The dog is big.' — O cachorro é grande."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'You ___ very nice.' (verbo to be)
        correctAnswer: are
        rationale: "'You are very nice.' — Você é muito legal."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'He ___ my brother.' (verbo to be)
        correctAnswer: is
        rationale: "'He is my brother.' — Ele é meu irmão."
        difficulty: 1
        objectives: [pre-A1.sight.words]
  - pageNumber: 2
    title: Passado do verbo 'to be' — was/were
    description: was e were — formas do passado de 'to be'.
    exercises:
      - type: english_vocab
        question: Qual é o passado de 'am' e 'is'?
        correctAnswer: was
        rationale: "'was' é o passado de 'am' e 'is'. I was, he was, she was, it was."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual é o passado de 'are'?
        correctAnswer: were
        rationale: "'were' é o passado de 'are'. We were, they were, you were."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I ___ happy yesterday.' (passado)
        correctAnswer: was
        rationale: "'I was happy yesterday.' — Eu estava feliz ontem."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'They ___ at school.' (passado)
        correctAnswer: were
        rationale: "'They were at school.' — Eles estavam na escola."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'She ___ very tall as a child.' (passado)
        correctAnswer: was
        rationale: "'She was very tall as a child.' — Ela era muito alta quando criança."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'We ___ friends in school.' (passado)
        correctAnswer: were
        rationale: "'We were friends in school.' — Éramos amigos na escola."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual é a negativa de 'is'?
        correctAnswer: is not / isn't
        rationale: "'is not' ou 'isn't' é a negativa de 'is'. She is not here = She isn't here."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual é a negativa de 'are'?
        correctAnswer: are not / aren't
        rationale: "'are not' ou 'aren't' é a negativa de 'are'. They are not students."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Escreva as 5 formas de 'to be' que você aprendeu
        correctAnswer: is, am, are, was, were
        rationale: "is (he/she/it), am (I), are (we/you/they), was (passado singular), were (passado plural)."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'The cat ___ on the mat.' (presente) → 'The cat ___ on the mat.' (passado)
        correctAnswer: is, was
        rationale: "Presente: 'is'. Passado: 'was'. The cat is/was on the mat."
        difficulty: 2
        objectives: [pre-A1.sight.words]
target: 20
