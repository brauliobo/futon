title: 📅 English 4A - Dias da semana
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.days
authorNotes: Dias da semana em inglês — Monday a Sunday.
repeatAll: 2
example: "Ex.: 'Monday, Tuesday, Wednesday...'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Dias da semana — parte 1
    description: Aprenda Monday, Tuesday, Wednesday, Thursday.
    exercises:
      - type: english_vocab
        question: Como se diz 'segunda-feira' em inglês?
        correctAnswer: Monday
        rationale: "'Monday' = segunda-feira. Começa a semana de trabalho."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Como se diz 'terça-feira' em inglês?
        correctAnswer: Tuesday
        rationale: "'Tuesday' = terça-feira."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Como se diz 'quarta-feira' em inglês?
        correctAnswer: Wednesday
        rationale: "'Wednesday' = quarta-feira. Pronuncia-se 'Wenzdei'."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Como se diz 'quinta-feira' em inglês?
        correctAnswer: Thursday
        rationale: "'Thursday' = quinta-feira. 'Thurs' + 'day'."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Qual dia é 'Monday'?
        correctAnswer: segunda-feira
        rationale: "'Monday' = segunda-feira. Primeiro dia útil da semana."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Qual dia é 'Wednesday'?
        correctAnswer: quarta-feira
        rationale: "'Wednesday' = quarta-feira. Metade da semana."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: "Complete a sequência: 'Monday, Tuesday, ___.' (quarta)"
        correctAnswer: Wednesday
        rationale: "'Monday, Tuesday, Wednesday' — segunda, terça, quarta."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: "Complete a sequência: 'Wednesday, ___, Friday.' (quinta)"
        correctAnswer: Thursday
        rationale: "'Wednesday, Thursday, Friday' — quarta, quinta, sexta."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Os dias da semana em inglês são escritos com letra...?
        correctAnswer: maiúscula
        rationale: "Em inglês, todos os dias da semana começam com letra MAIÚSCULA: Monday, Tuesday..."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Qual dia vem depois de 'Tuesday'?
        correctAnswer: Wednesday
        rationale: "Depois de Tuesday (terça) vem Wednesday (quarta)."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
  - pageNumber: 2
    title: Dias da semana — parte 2
    description: Aprenda Friday, Saturday, Sunday e revise a semana completa.
    exercises:
      - type: english_vocab
        question: Como se diz 'sexta-feira' em inglês?
        correctAnswer: Friday
        rationale: "'Friday' = sexta-feira."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Como se diz 'sábado' em inglês?
        correctAnswer: Saturday
        rationale: "'Saturday' = sábado. Fim de semana começa!"
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Como se diz 'domingo' em inglês?
        correctAnswer: Sunday
        rationale: "'Sunday' = domingo. 'Sun' = sol. Dia do sol!"
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Qual dia é 'Saturday'?
        correctAnswer: sábado
        rationale: "'Saturday' = sábado."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Qual dia é 'Sunday'?
        correctAnswer: domingo
        rationale: "'Sunday' = domingo."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: "Complete: 'Thursday, Friday, ___.' (sábado)"
        correctAnswer: Saturday
        rationale: "'Thursday, Friday, Saturday' — quinta, sexta, sábado."
        difficulty: 1
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Quais são os dois dias do fim de semana?
        correctAnswer: Saturday and Sunday
        rationale: "'Saturday and Sunday' — sábado e domingo são o fim de semana."
        difficulty: 2
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Escreva os 7 dias da semana em inglês
        correctAnswer: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
        rationale: "Os 7 dias: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday."
        difficulty: 2
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Qual dia vem antes de 'Sunday'?
        correctAnswer: Saturday
        rationale: "Antes de Sunday (domingo) vem Saturday (sábado)."
        difficulty: 2
        objectives: [pre-A1.vocab.days]
      - type: english_vocab
        question: Quais são os dias de semana (sem fim de semana)?
        correctAnswer: Monday, Tuesday, Wednesday, Thursday, Friday
        rationale: "Os 5 dias úteis: Monday a Friday."
        difficulty: 2
        objectives: [pre-A1.vocab.days]
target: 20
