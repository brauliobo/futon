title: 👁️ English 4A - Sight words — and, but, or, so, because
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.sight.words
authorNotes: Conjunções — palavras que conectam ideias em frases.
repeatAll: 2
example: "Ex.: 'I like cats and dogs.' 'It is cold, so I wear a coat.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Conjunções and, but, or
    description: Conecte ideias com and, but, or.
    exercises:
      - type: english_vocab
        question: Como se diz 'e' (conectivo) em inglês?
        correctAnswer: and
        rationale: "'and' = e. I have a cat and a dog."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se diz 'mas/porém' em inglês?
        correctAnswer: but
        rationale: "'but' = mas, porém. I like cats but not dogs."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se diz 'ou' (opção) em inglês?
        correctAnswer: or
        rationale: "'or' = ou. Do you like cats or dogs?"
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I like red ___ blue.' (e — conectando cores)
        correctAnswer: and
        rationale: "'I like red and blue.' — Eu gosto de vermelho e azul."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I like cats ___ not dogs.' (mas)
        correctAnswer: but
        rationale: "'I like cats but not dogs.' — Eu gosto de gatos, mas não de cachorros."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'Tea ___ coffee?' (ou — pergunta de escolha)
        correctAnswer: or
        rationale: "'Tea or coffee?' — Chá ou café?"
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'She is tall ___ strong.' (e — combinando adjetivos)
        correctAnswer: and
        rationale: "'She is tall and strong.' — Ela é alta e forte."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I want to play ___ it is raining.' (mas)
        correctAnswer: but
        rationale: "'I want to play but it is raining.' — Quero brincar, mas está chovendo."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'Cat ___ dog — which do you prefer?' (ou)
        correctAnswer: or
        rationale: "'Cat or dog — which do you prefer?' — Gato ou cachorro — qual você prefere?"
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: 'and' conecta ideias similares ou opostas?
        correctAnswer: similar
        rationale: "'and' conecta ideias similares/complementares. 'but' conecta ideias opostas."
        difficulty: 2
        objectives: [pre-A1.sight.words]
  - pageNumber: 2
    title: Conjunções so e because
    description: Aprenda so (então) e because (porque).
    exercises:
      - type: english_vocab
        question: Como se diz 'então/por isso' (resultado) em inglês?
        correctAnswer: so
        rationale: "'so' = então, por isso. It is cold, so I wear a coat."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se diz 'porque' (razão) em inglês?
        correctAnswer: because
        rationale: "'because' = porque. I wear a coat because it is cold."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I am hungry ___ I want to eat.' (então)
        correctAnswer: so
        rationale: "'I am hungry so I want to eat.' — Estou com fome, então quero comer."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I eat ___ I am hungry.' (porque)
        correctAnswer: because
        rationale: "'I eat because I am hungry.' — Eu como porque estou com fome."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'She is sad ___ her dog is sick.' (porque)
        correctAnswer: because
        rationale: "'She is sad because her dog is sick.' — Ela está triste porque o cachorro está doente."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'It is hot ___ I drink water.' (então)
        correctAnswer: so
        rationale: "'It is hot so I drink water.' — Está quente, então bebo água."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual é a diferença entre 'so' e 'because'?
        correctAnswer: so = result, because = reason
        rationale: "'so' = resultado (It's cold SO I wear a coat). 'because' = razão (I wear a coat BECAUSE it's cold)."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Quantas conjunções você aprendeu nesta lição?
        correctAnswer: five
        rationale: "Você aprendeu 5 conjunções: and, but, or, so, because."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I like pizza ___ pasta.' (e — comidas)
        correctAnswer: and
        rationale: "'I like pizza and pasta.' — Eu gosto de pizza e massa."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'He is smart ___ lazy.' (mas — contraste)
        correctAnswer: but
        rationale: "'He is smart but lazy.' — Ele é inteligente mas preguiçoso."
        difficulty: 2
        objectives: [pre-A1.sight.words]
target: 20
