title: 👁️ English 4A - Sight words — have, has, had, get, got
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.sight.words
authorNotes: Verbos have/has/had (ter) e get/got (conseguir/obter).
repeatAll: 2
example: "Ex.: 'I have a cat.' 'She has a dog.' 'I got a gift.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Have e Has — presente
    description: "Aprenda as formas do verbo 'ter' no presente."
    exercises:
      - type: english_vocab
        question: "Como se diz 'tenho/tens/têm (você)' em inglês?"
        correctAnswer: have
        rationale: "'have' = tenho (I have), tens (you have), têm (we/they have)."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Como se diz 'tem (ele/ela)' em inglês?"
        correctAnswer: has
        rationale: "'has' = tem (3ª pessoa singular). She has, he has, it has."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'I ___ a cat.' (tenho)"
        correctAnswer: have
        rationale: "'I have a cat.' — Eu tenho um gato."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'She ___ a dog.' (tem — 3ª pessoa)"
        correctAnswer: has
        rationale: "'She has a dog.' — Ela tem um cachorro."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'We ___ two cats.' (temos)"
        correctAnswer: have
        rationale: "'We have two cats.' — Nós temos dois gatos."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'He ___ a big house.' (tem — masculino)"
        correctAnswer: has
        rationale: "'He has a big house.' — Ele tem uma casa grande."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'They ___ three children.' (têm — plural)"
        correctAnswer: have
        rationale: "'They have three children.' — Eles têm três filhos."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'The cat ___ a long tail.' (tem — animal)"
        correctAnswer: has
        rationale: "'The cat has a long tail.' — O gato tem uma cauda longa."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Qual é a diferença entre 'have' e 'has'?"
        correctAnswer: have = I/you/we/they, has = he/she/it
        rationale: "'have' com I, you, we, they. 'has' com he, she, it (3ª pessoa singular)."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "'You ___ a nice smile.' (have ou has?)"
        correctAnswer: have
        rationale: "'You have a nice smile.' — Você tem um sorriso bonito. 'you' usa 'have'."
        difficulty: 1
        objectives: [pre-A1.sight.words]
  - pageNumber: 2
    title: Had, get, got — passado e obter
    description: Aprenda had (passado de have), get e got.
    exercises:
      - type: english_vocab
        question: "Qual é o passado de 'have/has'?"
        correctAnswer: had
        rationale: "'had' = passado de have/has. I had, she had, they had."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'I ___ a dog when I was young.' (passado de have)"
        correctAnswer: had
        rationale: "'I had a dog when I was young.' — Eu tinha um cachorro quando era criança."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Como se diz 'conseguir/obter' em inglês?"
        correctAnswer: get
        rationale: "'get' = conseguir, obter, pegar. I get up at 7. Get a book."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Qual é o passado de 'get'?"
        correctAnswer: got
        rationale: "'got' = passado de 'get'. I got a gift. She got an A."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'She ___ a new book for her birthday.' (passado de get)"
        correctAnswer: got
        rationale: "'She got a new book for her birthday.' — Ela ganhou um livro novo no aniversário."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'I need to ___ up early.' (levantar/acordar)"
        correctAnswer: get
        rationale: "'I need to get up early.' — Preciso acordar cedo."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'They ___ a cat last year.' (passado de have)"
        correctAnswer: had
        rationale: "'They had a cat last year.' — Eles tinham um gato no ano passado."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Escreva as 5 palavras desta lição em ordem
        correctAnswer: have, has, had, get, got
        rationale: "have, has, had, get, got — verbos essenciais de posse e obtenção."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Qual é o contrário de 'lose' (perder)? (dica: uma das palavras desta lição)"
        correctAnswer: get
        rationale: "'get' pode significar 'conseguir/ganhar', oposto de 'lose' em alguns contextos."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: "Complete: 'I ___ a lot of homework.' (tenho — presente)"
        correctAnswer: have
        rationale: "'I have a lot of homework.' — Eu tenho muita lição de casa."
        difficulty: 2
        objectives: [pre-A1.sight.words]
target: 20
