title: 💬 English 4A - Frases — 'I can ___'
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Habilidades e capacidades com 'I can' e 'I can't'.
repeatAll: 2
example: "Ex.: 'I can run.' 'I can jump high.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Habilidades com 'I can'
    description: Use 'I can' para falar sobre o que você consegue fazer.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu consigo correr.' em inglês?
        correctAnswer: I can run.
        rationale: "'I can run.' — 'can' indica capacidade. 'run' = correr."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu consigo pular.' em inglês?
        correctAnswer: I can jump.
        rationale: "'I can jump.' — 'jump' = pular/saltar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu consigo nadar.' em inglês?
        correctAnswer: I can swim.
        rationale: "'I can swim.' — 'swim' = nadar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu consigo cantar.' em inglês?
        correctAnswer: I can sing.
        rationale: "'I can sing.' — 'sing' = cantar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu consigo ler.' em inglês?
        correctAnswer: I can read.
        rationale: "'I can read.' — 'read' = ler."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I ___ fly.' (consigo voar)
        correctAnswer: can
        rationale: "'I can fly.' — Eu consigo voar. 'can' + verbo base."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I can ___.' (desenhar — draw)
        correctAnswer: draw
        rationale: "'I can draw.' — Eu consigo desenhar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I can ___ fast.' (correr rápido)
        correctAnswer: run
        rationale: "'I can run fast.' — Eu consigo correr rápido."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ can swim.' (eu — pronome)
        correctAnswer: I
        rationale: "'I can swim.' — Eu consigo nadar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu consigo pular alto.' em inglês?
        correctAnswer: I can jump high.
        rationale: "'I can jump high.' — 'high' = alto. Adverbio após o verbo."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: "'I can't' — negativa e perguntas"
    description: Use 'I can't' para negar e 'Can you?' para perguntar.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu não consigo voar.' em inglês?
        correctAnswer: I can't fly.
        rationale: "'I can't fly.' — 'can't' = cannot = não consigo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a forma completa de 'can't'?
        correctAnswer: cannot
        rationale: "'can't' = cannot. Ambas corretas. 'I cannot fly.' = 'I can't fly.'"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Você consegue nadar?' em inglês?
        correctAnswer: Can you swim?
        rationale: "'Can you swim?' — Pergunta com 'can': Can + sujeito + verbo?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ you sing? Yes, I ___!' (pergunta/resposta)
        correctAnswer: Can, can
        rationale: "'Can you sing? Yes, I can!' — Você consegue cantar? Sim, consigo!"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I can read ___ I can't write.' (mas)
        correctAnswer: but
        rationale: "'I can read but I can't write.' — Consigo ler mas não consigo escrever."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Você consegue correr rápido?' em inglês?
        correctAnswer: Can you run fast?
        rationale: "'Can you run fast?' — Can you + verbo + adverbio?"
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'She ___ swim but she ___ fly.' (consegue/não consegue)
        correctAnswer: can, can't
        rationale: "'She can swim but she can't fly.' — Ela nada mas não voa."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ ___ jump? No, I can't.' (pergunta negativa)
        correctAnswer: Can you
        rationale: "'Can you jump? No, I can't.' — Você consegue pular? Não, não consigo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu consigo correr e pular.' em inglês?
        correctAnswer: I can run and jump.
        rationale: "'I can run and jump.' — Duas habilidades com 'and'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'I ___ draw. Look at my picture!'
        correctAnswer: can
        rationale: "'I can draw. Look at my picture!' — Consigo desenhar. Olha minha figura!"
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
