title: 💬 English 4A - Frases — 'I have a ___'
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Posse com 'I have a/an' e objetos cotidianos.
repeatAll: 2
example: "Ex.: 'I have a ball.' 'I have a dog.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Posse com 'I have'
    description: Use 'I have' para falar sobre o que você tem.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu tenho uma bola.' em inglês?
        correctAnswer: I have a ball.
        rationale: "'I have a ball.' — 'have' = tenho. 'a ball' = uma bola."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu tenho um cachorro.' em inglês?
        correctAnswer: I have a dog.
        rationale: "'I have a dog.' — 'a dog' porque 'dog' começa com consoante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu tenho um livro.' em inglês?
        correctAnswer: I have a book.
        rationale: "'I have a book.' — 'a book' porque 'book' começa com consoante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu tenho uma maçã.' em inglês?
        correctAnswer: I have an apple.
        rationale: "'I have an apple.' — 'an apple' porque 'apple' começa com vogal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu tenho um gato.' em inglês?
        correctAnswer: I have a cat.
        rationale: "'I have a cat.' — 'a cat' porque 'cat' começa com consoante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I ___ a pen.' (tenho uma caneta)"
        correctAnswer: have
        rationale: "'I have a pen.' — Eu tenho uma caneta."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I have ___ umbrella.' (artigo antes de vogal)"
        correctAnswer: an
        rationale: "'I have an umbrella.' — 'an' antes de 'umbrella' (começa com vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I have a big ___.' (bola — ball)"
        correctAnswer: ball
        rationale: "'I have a big ball.' — Eu tenho uma bola grande."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ have a red bag.' (eu — pronome)"
        correctAnswer: I
        rationale: "'I have a red bag.' — Eu tenho uma bolsa vermelha."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu tenho dois gatos.' em inglês?
        correctAnswer: I have two cats.
        rationale: "'I have two cats.' — Com números, não usamos 'a/an'. 'cats' no plural."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: "'I don't have' e perguntas"
    description: Use 'I don't have' e 'Do you have?' para expandir.
    exercises:
      - type: english_vocab
        question: Como se diz 'Eu não tenho um carro.' em inglês?
        correctAnswer: I don't have a car.
        rationale: "'I don't have a car.' — 'don't have' = não tenho."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Você tem um lápis?' em inglês?
        correctAnswer: Do you have a pencil?
        rationale: "'Do you have a pencil?' — Pergunta com 'do': Do you have...?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ you have a ruler? Yes, I do.' (pergunta)"
        correctAnswer: Do
        rationale: "'Do you have a ruler? Yes, I do.' — Você tem uma régua? Sim, tenho."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I ___ have a bike.' (não tenho)"
        correctAnswer: don't
        rationale: "'I don't have a bike.' — Eu não tenho uma bicicleta."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu tenho um irmão e uma irmã.' em inglês?
        correctAnswer: I have a brother and a sister.
        rationale: "'I have a brother and a sister.' — 'brother' = irmão, 'sister' = irmã."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I have ___ orange and ___ banana.' (artigos)"
        correctAnswer: an, a
        rationale: "'I have an orange and a banana.' — 'an' antes de vogal, 'a' antes de consoante."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Ela tem um gato mas não tem um cachorro.' em inglês?
        correctAnswer: She has a cat but she doesn't have a dog.
        rationale: "'She has a cat but she doesn't have a dog.' — 'has'/'doesn't have' para she."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Do you have a pet? Yes, I ___ ___ cat.' (resposta)"
        correctAnswer: have a
        rationale: "'Yes, I have a cat.' — Sim, tenho um gato."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Eu tenho fome.' em inglês?
        correctAnswer: I am hungry.
        rationale: "Em inglês: 'I am hungry.' — Sensações físicas usam 'am', não 'have'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'I have ___ idea!' (uma ótima — an ou a?)"
        correctAnswer: an
        rationale: "'I have an idea!' — 'an' porque 'idea' começa com vogal."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
