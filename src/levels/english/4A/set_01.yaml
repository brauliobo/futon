title: 👁️ English 4A - Sight words — I, you, he, she, it, we, they
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.sight.words
authorNotes: Pronomes pessoais — essenciais para qualquer frase em inglês.
repeatAll: 2
example: "Ex.: 'eu' → I. 'eles' → they."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Pronomes singulares
    description: Aprenda os pronomes I, you, he, she, it.
    exercises:
      - type: english_vocab
        question: Como se diz 'eu' em inglês?
        correctAnswer: I
        rationale: "'I' = eu. Em inglês, 'I' é sempre maiúsculo. I am happy."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se diz 'você/tu' em inglês?
        correctAnswer: you
        rationale: "'you' = você/tu. You are nice."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se diz 'ele' em inglês?
        correctAnswer: he
        rationale: "'he' = ele (masculino). He is tall."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se diz 'ela' em inglês?
        correctAnswer: she
        rationale: "'she' = ela (feminino). She is nice."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se diz 'ele/ela' para objetos e animais em inglês?
        correctAnswer: it
        rationale: "'it' = pronome neutro para objetos/animais. It is a cat."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: '___ am a student.' (pronome — 1ª pessoa singular)
        correctAnswer: I
        rationale: "'I am a student.' — Eu sou um estudante."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: '___ are my friend.' (pronome — 2ª pessoa)
        correctAnswer: You
        rationale: "'You are my friend.' — Você é meu amigo."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: '___ is tall.' (pronome masculino singular)
        correctAnswer: He
        rationale: "'He is tall.' — Ele é alto."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: '___ is my sister.' (pronome feminino singular)
        correctAnswer: She
        rationale: "'She is my sister.' — Ela é minha irmã."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: '___ is a big dog.' (pronome para animal)
        correctAnswer: It
        rationale: "'It is a big dog.' — É um cachorro grande."
        difficulty: 1
        objectives: [pre-A1.sight.words]
  - pageNumber: 2
    title: Pronomes plurais
    description: Aprenda os pronomes we e they.
    exercises:
      - type: english_vocab
        question: Como se diz 'nós' em inglês?
        correctAnswer: we
        rationale: "'we' = nós. We are friends."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se diz 'eles/elas' em inglês?
        correctAnswer: they
        rationale: "'they' = eles/elas. They are students."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: '___ are happy.' (pronome plural — nós)
        correctAnswer: We
        rationale: "'We are happy.' — Nós estamos felizes."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: '___ are my friends.' (pronome plural — eles)
        correctAnswer: They
        rationale: "'They are my friends.' — Eles são meus amigos."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual pronome usamos para uma menina?
        correctAnswer: she
        rationale: "'she' para feminino singular. He para masculino, it para objetos/animais."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Quantos pronomes pessoais você aprendeu?
        correctAnswer: seven
        rationale: "Você aprendeu 7 pronomes: I, you, he, she, it, we, they."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: 'I' é sempre maiúsculo em inglês?
        correctAnswer: yes
        rationale: "Sim! O pronome 'I' (eu) é sempre escrito em maiúsculo em inglês."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'My parents are nice. ___ are teachers.' (pronome para eles)
        correctAnswer: They
        rationale: "'They are teachers.' — Substituímos 'my parents' por 'they'."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Escreva os 7 pronomes pessoais em inglês
        correctAnswer: I, you, he, she, it, we, they
        rationale: "I, you, he, she, it, we, they — os sete pronomes pessoais."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: 'you' é singular ou plural em inglês?
        correctAnswer: both
        rationale: "'you' pode ser singular (você) ou plural (vocês) em inglês. Mesmo para grupos."
        difficulty: 2
        objectives: [pre-A1.sight.words]
target: 20
