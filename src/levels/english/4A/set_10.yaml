title: 💬 English 4A - Frases — 'It is a ___'
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Identificação de objetos e animais com 'It is a/an'.
repeatAll: 2
example: "Ex.: 'It is a cat.' 'It is big.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Identificando com 'It is a'
    description: "Use 'It is' para identificar objetos e animais."
    exercises:
      - type: english_vocab
        question: "Como se diz 'É um gato.' em inglês?"
        correctAnswer: It is a cat.
        rationale: "'It is a cat.' — 'it' para animal/objeto. 'a cat' porque 'cat' começa com consoante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Como se diz 'É um cachorro.' em inglês?"
        correctAnswer: It is a dog.
        rationale: "'It is a dog.' — 'a dog' porque 'dog' começa com consoante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Como se diz 'É uma maçã.' em inglês?"
        correctAnswer: It is an apple.
        rationale: "'It is an apple.' — 'an apple' porque 'apple' começa com vogal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Como se diz 'É um livro.' em inglês?"
        correctAnswer: It is a book.
        rationale: "'It is a book.' — 'a book' porque 'book' começa com consoante."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Como se diz 'É um ovo.' em inglês?"
        correctAnswer: It is an egg.
        rationale: "'It is an egg.' — 'an egg' porque 'egg' começa com vogal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ ___ a big ball.' (pronome/verbo — objeto)"
        correctAnswer: It is
        rationale: "'It is a big ball.' — É uma bola grande."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Como se diz 'É grande.' em inglês? (adjetivo)"
        correctAnswer: It is big.
        rationale: "'It is big.' — Com adjetivo, não precisa de 'a/an'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Como se diz 'É vermelho.' em inglês?"
        correctAnswer: It is red.
        rationale: "'It is red.' — Com adjetivo de cor, não precisa de 'a/an'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Look at this! ___ ___ a fish!' (pronome/verbo)"
        correctAnswer: It is
        rationale: "'Look at this! It is a fish!' — Olha! É um peixe!"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "'It is' pode ser contraído para...?"
        correctAnswer: It's
        rationale: "'It is' pode ser contraído para 'It's'. It's a cat. It's big."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: "'It is' — negativa e perguntas"
    description: "Use 'It is not' e 'Is it...?' para negar e perguntar."
    exercises:
      - type: english_vocab
        question: "Como se diz 'Não é um gato.' em inglês?"
        correctAnswer: It is not a cat.
        rationale: "'It is not a cat.' — negativa com 'not' após 'is'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Como se diz 'É um gato?' em inglês? (pergunta)"
        correctAnswer: Is it a cat?
        rationale: "'Is it a cat?' — Para perguntas com 'is', invertemos: Is + it...?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ it a dog? Yes, ___ is.' (pergunta/resposta)"
        correctAnswer: Is, it
        rationale: "'Is it a dog? Yes, it is.' — É um cachorro? Sim, é."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ it big? No, it ___ not.' (pergunta/resposta negativa)"
        correctAnswer: Is, is
        rationale: "'Is it big? No, it is not.' — É grande? Não, não é."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Como se diz 'É um elefante enorme!' em inglês?"
        correctAnswer: It is a huge elephant!
        rationale: "'It is a huge elephant!' — huge = enorme. Adjetivo antes do substantivo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'What is it? ___ ___ ___ pen.' (é uma caneta)"
        correctAnswer: It is a
        rationale: "'What is it? It is a pen.' — O que é isso? É uma caneta."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is it hot? Yes, ___ ___ very hot.' (resposta)"
        correctAnswer: it is
        rationale: "'Is it hot? Yes, it is very hot.' — Está quente? Sim, está muito quente."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Como se diz 'Não é uma bola, é uma maçã.' em inglês?"
        correctAnswer: It is not a ball, it is an apple.
        rationale: "'It is not a ball, it is an apple.' — Negativa + afirmativa."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'It isn't a cat. ___ ___ ___ dog.' (mas é um cachorro)"
        correctAnswer: It is a
        rationale: "'It isn't a cat. It is a dog.' — Não é um gato. É um cachorro."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Qual é a contração de 'It is not'?"
        correctAnswer: "It isn't / It's not"
        rationale: "'It is not' pode virar 'It isn't' ou 'It's not'. Ambas são corretas."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
