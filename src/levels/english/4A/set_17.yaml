title: 🎨 English 4A - Mais cores
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.colors
authorNotes: Mais cores além das básicas — orange, pink, purple, brown, grey, white.
repeatAll: 2
example: "Ex.: 'The sky is blue.' 'Roses are pink.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Novas cores — orange, pink, purple
    description: Aprenda orange (laranja), pink (rosa), purple (roxo).
    exercises:
      - type: english_vocab
        question: Como se diz 'laranja' (cor) em inglês?
        correctAnswer: orange
        rationale: "'orange' = laranja (cor e fruta). An orange sky. An orange fruit."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'rosa' (cor) em inglês?
        correctAnswer: pink
        rationale: "'pink' = rosa. Pink flowers. A pink dress."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'roxo' em inglês?
        correctAnswer: purple
        rationale: "'purple' = roxo. A purple grape. Purple flowers."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Qual é a cor da laranja (fruta)?
        correctAnswer: orange
        rationale: "A laranja é 'orange'. A cor laranja tem o mesmo nome que a fruta!"
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: "Complete: 'Roses are ___.' (rosas são cor-de-rosa)"
        correctAnswer: pink
        rationale: "'Roses are pink.' — Rosas são cor-de-rosa."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: "Complete: 'Grapes are ___.' (uvas são roxas)"
        correctAnswer: purple
        rationale: "'Grapes are purple.' — Uvas são roxas."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: "Complete: 'The sunset is ___.' (o pôr do sol é laranja)"
        correctAnswer: orange
        rationale: "'The sunset is orange.' — O pôr do sol é laranja."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'uma flor rosa' em inglês?
        correctAnswer: a pink flower
        rationale: "'a pink flower' — adjetivo antes do substantivo em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'um carro roxo' em inglês?
        correctAnswer: a purple car
        rationale: "'a purple car' — adjetivo de cor antes do substantivo."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: "Qual cor rimaria com 'think'? (dica: uma cor desta página)"
        correctAnswer: pink
        rationale: "'pink' rima com 'think'. /pɪŋk/ e /θɪŋk/."
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
  - pageNumber: 2
    title: Mais cores — brown, grey, white e revisão
    description: Aprenda brown (marrom), grey (cinza), white (branco) e revise.
    exercises:
      - type: english_vocab
        question: Como se diz 'marrom' em inglês?
        correctAnswer: brown
        rationale: "'brown' = marrom. Brown chocolate. Brown eyes."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'cinza' em inglês?
        correctAnswer: grey
        rationale: "'grey' = cinza. Grey clouds. A grey cat."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'branco' em inglês?
        correctAnswer: white
        rationale: "'white' = branco. White snow. A white cat."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: "Complete: 'Chocolate is ___.' (chocolate é marrom)"
        correctAnswer: brown
        rationale: "'Chocolate is brown.' — Chocolate é marrom."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: "Complete: 'The clouds are ___.' (as nuvens são cinzas)"
        correctAnswer: grey
        rationale: "'The clouds are grey.' — As nuvens são cinzas."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: "Complete: 'Snow is ___.' (neve é branca)"
        correctAnswer: white
        rationale: "'Snow is white.' — Neve é branca."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Quais cores você aprendeu nesta lição? (lista as 6)
        correctAnswer: orange, pink, purple, brown, grey, white
        rationale: "orange, pink, purple, brown, grey, white — 6 novas cores!"
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'um gato marrom' em inglês?
        correctAnswer: a brown cat
        rationale: "'a brown cat' — adjetivo 'brown' antes de 'cat'."
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Qual é a cor oposta de 'black'?
        correctAnswer: white
        rationale: "'white' (branco) é oposto de 'black' (preto)."
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: "Complete: 'My hair is ___.' (meu cabelo é marrom)"
        correctAnswer: brown
        rationale: "'My hair is brown.' — Meu cabelo é marrom."
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
target: 20
