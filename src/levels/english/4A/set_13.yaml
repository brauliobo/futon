title: 💬 English 4A - Frases — 'Is it a ___?'
level: 4A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Perguntas de identificação — 'Is it a ___?' com respostas 'Yes!' e 'No!'.
repeatAll: 2
example: "Ex.: 'Is it a cat? Yes, it is!' 'Is it a dog? No, it isn't.'"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Perguntas com 'Is it a ___?'
    description: Faça perguntas para identificar objetos e animais.
    exercises:
      - type: english_vocab
        question: Como se diz 'É um gato?' em inglês?
        correctAnswer: Is it a cat?
        rationale: "'Is it a cat?' — Inversão: Is + it + a + substantivo?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'É um cachorro?' em inglês?
        correctAnswer: Is it a dog?
        rationale: "'Is it a dog?' — Mesmo padrão: Is it a + substantivo?"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'É uma maçã?' em inglês?
        correctAnswer: Is it an apple?
        rationale: "'Is it an apple?' — 'an' porque 'apple' começa com vogal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Is it a cat?' — Sim!"
        correctAnswer: Yes, it is!
        rationale: "'Yes, it is!' — Resposta afirmativa. Yes + pronome + verbo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Is it a dog?' — Não!"
        correctAnswer: No, it isn't.
        rationale: "'No, it isn't.' — Resposta negativa. No + pronome + isn't."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: '___ it a book? Yes, it is!' (pergunta)"
        correctAnswer: Is
        rationale: "'Is it a book? Yes, it is!' — É um livro? Sim, é!"
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is it ___ egg? Yes, it is.' (artigo)"
        correctAnswer: an
        rationale: "'Is it an egg?' — 'an' antes de 'egg' (começa com vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is it a bird? No, it ___.' (negativa curta)"
        correctAnswer: isn't
        rationale: "'No, it isn't.' — Contração de 'is not'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'É um elefante?' em inglês?
        correctAnswer: Is it an elephant?
        rationale: "'Is it an elephant?' — 'an' porque 'elephant' começa com vogal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is it a ___? Yes, it is a ball.' (bola)"
        correctAnswer: ball
        rationale: "'Is it a ball? Yes, it is a ball.' — Pergunta e resposta completa."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Variações e prática
    description: Pratique com mais exemplos e variações.
    exercises:
      - type: english_vocab
        question: Como se diz 'É grande?' em inglês? (adjetivo)
        correctAnswer: Is it big?
        rationale: "'Is it big?' — Com adjetivo, não precisa de 'a/an'."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'Is it big?' — Sim!"
        correctAnswer: Yes, it is!
        rationale: "'Yes, it is!' — Resposta afirmativa para adjetivo também."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is it a cat ___ a dog?' (ou — dando opção)"
        correctAnswer: or
        rationale: "'Is it a cat or a dog?' — 'or' para dar opções."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O que é isso?' em inglês?
        correctAnswer: What is it?
        rationale: "'What is it?' — Pergunta aberta sobre identidade."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Responda: 'What is it?' — (é um peixe — fish)"
        correctAnswer: It is a fish.
        rationale: "'It is a fish.' — Resposta completa com 'It is a...'"
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is ___ a pen? No, it is a pencil.' (pronome)"
        correctAnswer: it
        rationale: "'Is it a pen? No, it is a pencil.' — É uma caneta? Não, é um lápis."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'É um inseto ou um pássaro?' em inglês?
        correctAnswer: Is it an insect or a bird?
        rationale: "'Is it an insect or a bird?' — 'an' antes de 'insect' (vogal)."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is it a cat? ___, it is!' (resposta afirmativa)"
        correctAnswer: Yes
        rationale: "'Yes, it is!' — Resposta curta afirmativa."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'Is it red? No, it ___ ___.' (não é — forma longa)"
        correctAnswer: is not
        rationale: "'No, it is not.' — Forma longa de 'isn't'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'É uma formiga pequena!' em inglês?
        correctAnswer: It is a small ant!
        rationale: "'It is a small ant!' — 'an ant' mas com adjetivo: 'a small ant'. O 'a/an' depende do que vem depois."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
