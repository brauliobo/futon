        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'sapato' em inglês? (começa com 'sh')"
        correctAnswer: shoe
        rationale: "'shoe' tem o som /ʃ/ — 'sh' como 'x'. S-H-O-E."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'prateleira' em inglês? (começa com 'sh')"
        correctAnswer: shelf
        rationale: "'shelf' tem o som /ʃ/ — 'sh' como 'x'. S-H-E-L-F."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'ovelha' em inglês? (começa com 'sh')"
        correctAnswer: sheep
        rationale: "'sheep' tem o som /ʃ/ — 'sh' como 'x'. S-H-E-E-P."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'concha/casca' em inglês? (começa com 'sh')"
        correctAnswer: shell
        rationale: "'shell' tem o som /ʃ/ — 'sh' como 'x'. S-H-E-L-L."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'brilhar' em inglês? (começa com 'sh')"
        correctAnswer: shine
        rationale: "'shine' tem o som /ʃ/ — 'sh' como 'x'. S-H-I-N-E."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'compartilhar' em inglês? (começa com 'sh')"
        correctAnswer: share
        rationale: "'share' tem o som /ʃ/ — 'sh' como 'x'. S-H-A-R-E."
