        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "O 'sh' em inglês faz o mesmo som que 'ch' em português?"
        correctAnswer: yes
        rationale: "Sim! O 'sh' inglês (/ʃ/) faz o mesmo som que o 'ch' português, como em 'chave', 'chá'."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual som faz 'sh' em 'ship': /ʃ/ ou /tʃ/?"
        correctAnswer: /ʃ/
        rationale: "'sh' faz /ʃ/ (como 'x'). Não confunda com 'ch' que faz /tʃ/ (como 'tch')."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
  - pageNumber: 2
    title: "Som 'sh' em mais posições"
    description: "'sh' pode aparecer no meio e no final das palavras também."
    exercises:
      - type: english_vocab
        question: "Como se diz 'peixe' em inglês? (tem 'sh' no final)"
        correctAnswer: fish
        rationale: "'fish' tem o som /ʃ/ no final — F-I-S-H."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'prato/prato de comida' em inglês? (tem 'sh' no final)"
        correctAnswer: dish
        rationale: "'dish' tem o som /ʃ/ no final — D-I-S-H."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'desejo/quero' em inglês? (tem 'sh' no final)"
        correctAnswer: wish
        rationale: "'wish' tem o som /ʃ/ no final — W-I-S-H."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'lavagem/lavando' em inglês? (tem 'sh' no meio)"
        correctAnswer: washing
        rationale: "'washing' tem o som /ʃ/ no meio — W-A-SH-I-N-G."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual palavra começa com 'sh': 'ship' ou 'sip'?"
        correctAnswer: ship
        rationale: "'ship' começa com 'sh' (/ʃ/). 'sip' começa apenas com 's' (/s/)."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual é a diferença entre 'ship' e 'chip'?"
        correctAnswer: sh vs ch sound
        rationale: "'ship' tem /ʃ/ (sh). 'chip' tem /tʃ/ (ch). Sons diferentes, uma letra diferente."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Escreva o som que 'sh' faz em inglês (como em português)"
        correctAnswer: x
        rationale: "Em inglês, 'sh' faz o som /ʃ/ — parecido com o 'x' de 'xampu' ou 'ch' de 'chave'."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Complete a frase: 'The ___ is in the sea.' (animal com 'sh')"
        correctAnswer: fish
        rationale: "Fish (peixe) — 'The fish is in the sea.' Termina com 'sh'."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Complete: 'sh' é um dígrafo — duas letras que fazem ___ som"
        correctAnswer: one
        rationale: "'sh' é um dígrafo: duas letras, um (one) único som /ʃ/."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual dígrafo faz o som de 'x' em inglês: 'ch' ou 'sh'?"
        correctAnswer: sh
        rationale: "'sh' faz o som /ʃ/ (como 'x'). 'ch' faz /tʃ/ (como 'tch')."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
target: 20
