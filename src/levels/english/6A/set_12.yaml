title: 🔊 English 6A - Combinação 'sh' (ship, shop, shoe, shelf)
level: 6A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.sounds
authorNotes: Dígrafo 'sh' — faz o som /ʃ/ como 'x' em inglês.
repeatAll: 2
example: "Ex.: 'sh' de ship → som /ʃ/ como 'x' de 'xampu'."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: "Som 'sh' no início de palavras"
    description: "A combinação 'sh' faz o som /ʃ/ como 'x' português."
    exercises:
      - type: english_vocab
        question: "Como se diz 'navio' em inglês? (começa com 'sh')"
        correctAnswer: ship
        rationale: "'ship' tem o som /ʃ/ — 'sh' como 'x'. S-H-I-P."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'loja' em inglês? (começa com 'sh')"
