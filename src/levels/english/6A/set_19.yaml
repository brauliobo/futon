title: 🔊 English 6A - Combinação '-ight' (light, night, right, fight)
level: 6A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.sounds
authorNotes: Padrão '-ight' — as letras 'gh' são mudas, fazendo o som /aɪt/.
repeatAll: 2
example: "Ex.: 'light' → '-ight' soa /aɪt/, o 'gh' é mudo."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
