    description: "Palavras com '-ight' — o 'gh' é sempre mudo neste padrão."
    exercises:
      - type: english_vocab
        question: "Como se diz 'luz' em inglês? (tem padrão '-ight')"
        correctAnswer: light
        rationale: "'light' tem o padrão '-ight' — /aɪt/. O 'gh' é mudo. L-I-G-H-T."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'noite' em inglês? (tem padrão '-ight')"
