        rationale: "'night' tem o padrão '-ight' — /aɪt/. O 'gh' é mudo. N-I-G-H-T."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'correto/direito' em inglês? (tem padrão '-ight')"
        correctAnswer: right
        rationale: "'right' tem o padrão '-ight' — /aɪt/. O 'gh' é mudo. R-I-G-H-T."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'lutar' em inglês? (tem padrão '-ight')"
        correctAnswer: fight
        rationale: "'fight' tem o padrão '-ight' — /aɪt/. O 'gh' é mudo. F-I-G-H-T."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'visão' em inglês? (tem padrão '-ight')"
        correctAnswer: sight
        rationale: "'sight' tem o padrão '-ight' — /aɪt/. O 'gh' é mudo. S-I-G-H-T."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'pode/força' em inglês? (tem padrão '-ight')"
        correctAnswer: might
        rationale: "'might' tem o padrão '-ight' — /aɪt/. O 'gh' é mudo. M-I-G-H-T."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'à noite' em inglês? (tem padrão '-ight')"
        correctAnswer: tonight
        rationale: "'tonight' tem o padrão '-ight' — /aɪt/. T-O-N-I-G-H-T."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'susto/espantar' em inglês? (tem padrão '-ight')"
        correctAnswer: fright
        rationale: "'fright' tem o padrão '-ight' — /aɪt/. F-R-I-G-H-T."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "'light' e 'night' rimam?"
        correctAnswer: yes
        rationale: "Sim! 'light' e 'night' têm o mesmo final '-ight' — /aɪt/. Rimam perfeitamente."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Em 'night', o 'gh' é pronunciado?"
        correctAnswer: no
        rationale: "Não! O 'gh' em '-ight' é mudo (silent). Pronuncia-se 'nait', não 'nigot'."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
  - pageNumber: 2
    title: Usando palavras com '-ight'
    description: "Pratique as palavras '-ight' em contexto."
    exercises:
      - type: english_vocab
        question: "Complete: 'Turn on the ___.' (luz)"
        correctAnswer: light
        rationale: "'Turn on the light' — Acenda a luz. 'light' tem '-ight'."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Complete: 'Good ___!' (despedida noturna)"
        correctAnswer: night
        rationale: "'Good night!' — Boa noite! 'night' tem '-ight'."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Complete: 'You are ___!' (quando alguém acerta)"
        correctAnswer: right
        rationale: "'You are right!' — Você está certo! 'right' tem '-ight'."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Como se diz 'apavorado' em inglês? (tem '-ight')"
        correctAnswer: frightened
        rationale: "'frightened' vem de 'fright' (susto). Tem '-ight'. F-R-I-G-H-T-E-N-E-D."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Complete a família de rimas: light, night, right, fight, ___"
        correctAnswer: sight
        rationale: "'sight' completa a família -ight. Todas têm o mesmo som /aɪt/."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual é o oposto de 'left'? (tem '-ight')"
        correctAnswer: right
        rationale: "'right' (direita) é o oposto de 'left' (esquerda). Também significa 'correto'."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Quantas letras tem a palavra 'night'?"
        correctAnswer: five
        rationale: "N-I-G-H-T: cinco letras. Mas soa como 3 sons: /n/ + /aɪ/ + /t/."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual é o oposto de 'day'? (tem '-ight')"
        correctAnswer: night
        rationale: "'night' (noite) é o oposto de 'day' (dia)."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "O '-ight' rima com 'kite'? Por que?"
        correctAnswer: yes, both have /aɪ/
        rationale: "Sim! '-ight' e 'kite' têm o som /aɪ/ — o 'i' longo. 'night' rima com 'kite'."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Escreva três palavras da família '-ight'
        correctAnswer: light, night, right
        rationale: "Light, night, right — ou qualquer três de: light, night, right, fight, sight, might, tight."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
target: 20
