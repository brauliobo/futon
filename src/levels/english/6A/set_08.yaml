        rationale: "'fly' tem o som /aɪ/ — padrão 'y'. F-L-Y."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Complete a família de rimas: kite, bite, site, ___"
        correctAnswer: mite
        rationale: "'mite' (ácaro) completa a família -ite. Todas têm o som /aɪ/ longo."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Complete a família de rimas: ride, hide, wide, ___"
        correctAnswer: side
        rationale: "'side' (lado) completa a família -ide. Todas têm o som /aɪ/ longo."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual padrão faz o som /aɪ/ em 'kite'?
        correctAnswer: i_e
        rationale: "O padrão i_e (vogal + consoante + e mudo) faz o 'i' ficar longo: kite, ride, wide."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O número cinco em inglês tem som /aɪ/. Como se escreve?
