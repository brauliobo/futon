  - pageNumber: 2
    title: Som /aɪ/ com outros padrões
    description: O som /aɪ/ também aparece com 'igh' e 'y'.
    exercises:
      - type: english_vocab
        question: Como se diz 'eu' em inglês? (tem som /aɪ/)
        correctAnswer: I
        rationale: "O pronome 'I' (eu) tem o som /aɪ/ — mesma pronúncia que 'eye' (olho)."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
