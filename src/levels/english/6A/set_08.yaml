      - type: english_vocab
        question: Qual é a diferença entre 'rid' e 'ride'?
        correctAnswer: the silent e makes i long
        rationale: "O 'e' mudo em 'ride' alonga o 'i': /ɪ/ em 'rid' vs /aɪ/ em 'ride'."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O /aɪ/ de 'kite' soa como qual ditongo do português?
        correctAnswer: ai
        rationale: "O /aɪ/ de 'kite' soa como o 'ai' do português, como em 'pai' e 'mais'."
        difficulty: 2
