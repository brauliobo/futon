title: 🔊 English 6A - Revisão — fonemas principais do inglês
level: 6A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.sounds
authorNotes: Revisão completa dos padrões fonéticos aprendidos no nível 6A.
repeatAll: 2
example: "Ex.: 'cake' → som /eɪ/ vogal longa. 'cat' → som /æ/ vogal curta."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Revisão — vogais curtas e longas
    description: Diferencie os sons de vogais curtas e longas aprendidos.
    exercises:
      - type: english_vocab
        question: Qual é o som de vogal em 'cat'?
        correctAnswer: short a /æ/
        rationale: "'cat' tem o /æ/ curto — a vogal 'a' curta do inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual é o som de vogal em 'cake'?
        correctAnswer: long a /eɪ/
        rationale: "'cake' tem o /eɪ/ longo — a vogal 'a' longa do inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual é o som de vogal em 'tree'?
        correctAnswer: long e /iː/
        rationale: "'tree' tem o /iː/ longo — padrão 'ee'."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual é o som de vogal em 'kite'?
        correctAnswer: long i /aɪ/
        rationale: "'kite' tem o /aɪ/ longo — padrão i_e."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual é o som de vogal em 'home'?
        correctAnswer: long o /oʊ/
        rationale: "'home' tem o /oʊ/ longo — padrão o_e."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual é o som de vogal em 'cube'?
        correctAnswer: long u /juː/
        rationale: "'cube' tem o /juː/ longo — padrão u_e."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual é o som de vogal em 'bed'?
        correctAnswer: short e /ɛ/
        rationale: "'bed' tem o /ɛ/ curto — a vogal 'e' curta do inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual é o som de vogal em 'pig'?
        correctAnswer: short i /ɪ/
        rationale: "'pig' tem o /ɪ/ curto — a vogal 'i' curta do inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual é o som de vogal em 'hot'?
        correctAnswer: short o /ɒ/
        rationale: "'hot' tem o /ɒ/ curto — a vogal 'o' curta do inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Qual é o som de vogal em 'cup'?
        correctAnswer: short u /ʌ/
        rationale: "'cup' tem o /ʌ/ curto — a vogal 'u' curta do inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
  - pageNumber: 2
    title: Revisão — dígrafos e padrões
    description: Revise os dígrafos e padrões especiais aprendidos.
    exercises:
      - type: english_vocab
        question: O dígrafo 'ch' em 'chair' faz qual som?
        correctAnswer: /tʃ/ tch
        rationale: "'ch' em inglês faz /tʃ/ — como 'tch'. Ex.: chair, cheese, chick."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O dígrafo 'sh' em 'ship' faz qual som?
        correctAnswer: /ʃ/ x
        rationale: "'sh' em inglês faz /ʃ/ — como 'x' ou 'ch' português. Ex.: ship, shop, shoe."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O dígrafo 'th' em 'this' faz qual som?
        correctAnswer: /ð/ suave
        rationale: "'th' em 'this' faz /ð/ suave — língua entre os dentes, com vibração."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O dígrafo 'th' em 'three' faz qual som?
        correctAnswer: /θ/ surdo
        rationale: "'th' em 'three' faz /θ/ surdo — língua entre os dentes, sem vibração."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O padrão '-ck' em 'back' faz qual som?
        correctAnswer: /k/
        rationale: "'-ck' faz o som /k/ seco. Aparece depois de vogais curtas: back, duck, rock."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O padrão '-ng' em 'ring' faz qual som?
        correctAnswer: /ŋ/ nasal
        rationale: "'-ng' faz o som nasal /ŋ/. Ex.: ring, king, song, long."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O padrão '-all' em 'ball' faz qual som?
        correctAnswer: /ɔːl/
        rationale: "'-all' faz o som /ɔːl/. Ex.: ball, call, fall, tall, wall."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Em 'moon', o 'oo' faz qual som: /uː/ longo ou /ʊ/ curto?
        correctAnswer: /uː/ longo
        rationale: "'moon' tem 'oo' longo /uː/. Compare com 'book' que tem 'oo' curto /ʊ/."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O padrão '-ight' em 'night' — o 'gh' é pronunciado?
        correctAnswer: no
        rationale: "O 'gh' em '-ight' é mudo. 'night' soa 'nait' — /naɪt/."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Parabéns! Qual é a regra do 'e mudo' (silent e) em palavras como cake, kite, home, cube?
        correctAnswer: makes the vowel long
        rationale: "O 'e' mudo no final faz a vogal anterior ficar longa: cake /eɪ/, kite /aɪ/, home /oʊ/, cube /juː/."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
target: 20
