title: 🔊 English 6A - Combinação 'th' (this, that, three, thick)
level: 6A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.sounds
authorNotes: Dígrafo 'th' — faz dois sons distintos /ð/ suave (this) e /θ/ surdo (three).
repeatAll: 2
example: "Ex.: 'th' de three → som /θ/ como língua entre os dentes."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Som 'th' suave /ð/ — this, that, the
    description: O 'th' suave aparece em palavras comuns como 'this' e 'the'.
    exercises:
      - type: english_vocab
        question: Como se diz 'este/isso' em inglês? (começa com 'th' suave)
        correctAnswer: this
        rationale: "'this' tem o 'th' suave /ð/ — língua tocando os dentes. T-H-I-S."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'aquele/aquilo' em inglês? (começa com 'th' suave)
        correctAnswer: that
        rationale: "'that' tem o 'th' suave /ð/ — língua tocando os dentes. T-H-A-T."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se escreve o artigo 'o/a/os/as' em inglês? (começa com 'th' suave)
        correctAnswer: the
        rationale: "'the' tem o 'th' suave /ð/ — é a palavra mais comum em inglês! T-H-E."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'estes/estas' em inglês? (começa com 'th' suave)
        correctAnswer: these
        rationale: "'these' tem o 'th' suave /ð/ — T-H-E-S-E."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'aqueles/aquelas' em inglês? (começa com 'th' suave)
        correctAnswer: those
        rationale: "'those' tem o 'th' suave /ð/ — T-H-O-S-E."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'eles/elas' em inglês? (começa com 'th' suave)
        correctAnswer: they
        rationale: "'they' tem o 'th' suave /ð/ — T-H-E-Y."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'então/portanto' em inglês? (começa com 'th' suave)
        correctAnswer: then
        rationale: "'then' tem o 'th' suave /ð/ — T-H-E-N."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'lá/ali' em inglês? (começa com 'th' suave)
        correctAnswer: there
        rationale: "'there' tem o 'th' suave /ð/ — T-H-E-R-E."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "O 'th' de 'this' faz qual som: /ð/ suave ou /θ/ surdo?"
        correctAnswer: /ð/ suave
        rationale: "'this', 'that', 'the', 'they' — todos têm o 'th' suave /ð/."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se produz o som 'th' em inglês?
        correctAnswer: tongue between teeth
        rationale: "Para fazer 'th', coloque a língua levemente entre os dentes e sopre ar."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
  - pageNumber: 2
    title: Som 'th' surdo /θ/ — three, thick, think
    description: O 'th' surdo aparece em números e outros palavras.
    exercises:
      - type: english_vocab
        question: Como se diz 'três' em inglês? (começa com 'th' surdo)
        correctAnswer: three
        rationale: "'three' tem o 'th' surdo /θ/ — T-H-R-E-E."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'grosso/espesso' em inglês? (começa com 'th' surdo)
        correctAnswer: thick
        rationale: "'thick' tem o 'th' surdo /θ/ — T-H-I-C-K."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'pensar' em inglês? (começa com 'th' surdo)
        correctAnswer: think
        rationale: "'think' tem o 'th' surdo /θ/ — T-H-I-N-K."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'obrigado' em inglês? (começa com 'th' surdo)
        correctAnswer: thank
        rationale: "'thank' tem o 'th' surdo /θ/ — T-H-A-N-K."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'trono' em inglês? (começa com 'th' surdo)
        correctAnswer: throne
        rationale: "'throne' tem o 'th' surdo /θ/ — T-H-R-O-N-E."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "O 'th' de 'three' faz qual som: /ð/ suave ou /θ/ surdo?"
        correctAnswer: /θ/ surdo
        rationale: "'three', 'thick', 'think', 'thank' — todos têm o 'th' surdo /θ/."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual palavra tem 'th' suave: 'this' ou 'three'?"
        correctAnswer: this
        rationale: "'this' tem /ð/ suave. 'three' tem /θ/ surdo. Ambos são 'th', mas diferentes."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: O 'th' existe no português?
        correctAnswer: no
        rationale: "Não! O 'th' é um som exclusivo do inglês — não existe em português. Por isso é difícil!"
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Complete: 'th' é um ___ — duas letras, um som"
        correctAnswer: digraph
        rationale: "'th' é um dígrafo (digraph) — duas letras que fazem um único som."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: Como se diz 'muito obrigado' em inglês? (tem 'th')
        correctAnswer: thank you
        rationale: "'thank you' — 'thank' tem o 'th' surdo /θ/. Uma das frases mais úteis!"
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
target: 20
