  - pageNumber: 2
    title: Som /juː/ — revisão das vogais longas
    description: Revise os cinco sons de vogais longas.
    exercises:
      - type: english_vocab
        question: "Qual é o som longo de 'a' (como em cake)?"
        correctAnswer: /eɪ/
        rationale: "O 'a' longo faz o som /eɪ/ — como em cake, name, rain, day."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual é o som longo de 'e' (como em tree)?"
        correctAnswer: /iː/
        rationale: "O 'e' longo faz o som /iː/ — como em tree, see, meat, tea."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual é o som longo de 'i' (como em kite)?"
        correctAnswer: /aɪ/
        rationale: "O 'i' longo faz o som /aɪ/ — como em kite, ride, time, fly."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual é o som longo de 'o' (como em home)?"
        correctAnswer: /oʊ/
        rationale: "O 'o' longo faz o som /oʊ/ — como em home, note, boat, grow."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual é o som longo de 'u' (como em cube)?"
        correctAnswer: /juː/
        rationale: "O 'u' longo faz o som /juː/ — como em cube, tune, cute, mule."
        difficulty: 1
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Qual padrão faz o 'u' ficar longo em 'cube'?"
        correctAnswer: u_e
        rationale: "O padrão u_e (vogal + consoante + e mudo) faz o 'u' ficar longo: cube, tune, cute."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Complete a família de rimas: cube, tube, ___"
        correctAnswer: lube
        rationale: "'lube' completa a família -ube. Todas têm o som /juː/ longo."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "O /juː/ de 'cube' soa como 'yu' ou 'oo'?"
        correctAnswer: yu
        rationale: "O /juː/ de 'cube' soa como 'yu' — não é apenas /uː/, mas /j/ + /uː/."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "Parabéns! Você aprendeu as 5 vogais longas. Escreva a palavra exemplo de cada: a, e, i, o, u"
        correctAnswer: cake, tree, kite, home, cube
        rationale: "Vogais longas: /eɪ/ cake, /iː/ tree, /aɪ/ kite, /oʊ/ home, /juː/ cube."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
      - type: english_vocab
        question: "O 'e' no final de 'cube' é pronunciado?"
        correctAnswer: no
        rationale: "O 'e' final de 'cube' é mudo (silent e). Ele faz o 'u' ficar longo."
        difficulty: 2
        objectives: [pre-A1.phonics.sounds]
