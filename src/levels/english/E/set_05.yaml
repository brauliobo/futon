title: English E - Present Continuous — Time Markers
level: E
subject: english
difficulty: 3
objectives:
  - A2.grammar.present_continuous
authorNotes: Now, right now, at the moment, today, this week — anchors of ongoing actions.
repeatAll: 2
example: Agora estou trabalhando → Right now I am working
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Now, Right Now, At the Moment
    description: Emphasise action in progress.
    exercises:
      - type: english_phrases
        question: Agora estou trabalhando
        correctAnswer: Right now I am working
        rationale: "'Right now' abre e reforça o agora. 'I am working' (1ª pessoa + am)."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Neste momento ela está estudando
        correctAnswer: At the moment she is studying
        rationale: "'At the moment' = neste momento. 'She is' + 'studying'."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Agora eles estão assistindo TV
        correctAnswer: Now they are watching tv
        rationale: "'Now' abre a frase. 'They are watching' (plural 'are')."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Estou cozinhando agora
        correctAnswer: I am cooking now
        rationale: "'Now' ao final reforça presente. 'I am cooking' (1ª pessoa)."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Neste momento chove
        correctAnswer: At the moment it is raining
        rationale: "Clima pede 'it'. 'At the moment it is raining' — ação em curso."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Agora mesmo estamos saindo
        correctAnswer: Right now we are leaving
        rationale: "'Right now' + 'we are leaving' (leave → leaving, drop e)."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Ele está falando no telefone agora
        correctAnswer: He is talking on the phone now
        rationale: "'On the phone' (preposição 'on' com telefone). 'He is talking'."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Estou te ligando agora
        correctAnswer: I am calling you right now
        rationale: "'Call you' — 'call' transitivo, sem 'to'. 'Right now' ao final."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Ela está no meio de uma reunião
        correctAnswer: She is in the middle of a meeting
        rationale: "'In the middle of' — expressão fixa para 'no meio de'."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Estamos escutando música
        correctAnswer: We are listening to music
        rationale: "'Listen to music' — 'listen' precisa de 'to'. 'Music' sem artigo."
        difficulty: 2
        objectives: [A2.grammar.present_continuous]
  - pageNumber: 2
    title: Today, This Week, These Days
    description: Temporary ongoing situations.
    exercises:
      - type: english_phrases
        question: Hoje estou trabalhando em casa
        correctAnswer: Today I am working from home
        rationale: "'Work from home' (expressão fixa). 'Today' abre a frase."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Esta semana ela está viajando
        correctAnswer: This week she is traveling
        rationale: "'This week' (sem artigo) + 'she is traveling' = temporário."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Estes dias estamos ocupados
        correctAnswer: These days we are busy
        rationale: "'These days' = hoje em dia. 'Busy' adjetivo, só precisa de 'be'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Este mês ele está estudando muito
        correctAnswer: This month he is studying a lot
        rationale: "'This month' + 'he is studying a lot' ('a lot' = muito, ao final)."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Este ano estou aprendendo inglês
        correctAnswer: This year I am learning English
        rationale: "'This year' + 'I am learning English' (maiúscula em English)."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Hoje ela está trabalhando até tarde
        correctAnswer: Today she is working late
        rationale: "'Working late' — 'late' como advérbio (não 'lately' = recentemente)."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Estes dias eles moram comigo
        correctAnswer: These days they are living with me
        rationale: "'Live with me' = morar comigo. 'Live' → 'living' (drop e)."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Esta semana eu estou cozinhando mais
        correctAnswer: This week I am cooking more
        rationale: "'Cooking more' — 'more' ao final. Marca mudança temporária."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Este semestre ele está melhor
        correctAnswer: This semester he is doing better
        rationale: "'Doing better' = indo melhor (continuous + 'better' irregular)."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
      - type: english_phrases
        question: Hoje em dia as pessoas estão mudando
        correctAnswer: These days people are changing
        rationale: "'People' é plural → 'are'. 'Change' → 'changing' (drop e)."
        difficulty: 3
        objectives: [A2.grammar.present_continuous]
target: 20
