title: English E - Present Continuous — Time Markers
level: E
subject: english
difficulty: 2
objectives: [A2.grammar.present_continuous]
authorNotes: Now, right now, at the moment, today, this week — anchors of ongoing actions.
repeatAll: 2
example: "Agora estou trabalhando → Right now I am working"
pages:
  - pageNumber: 1
    title: Now, Right Now, At the Moment
    description: Emphasise action in progress.
    exercises:
      - { type: english_phrases, question: "Agora estou trabalhando", correctAnswer: right now i am working }
      - { type: english_phrases, question: "Neste momento ela está estudando", correctAnswer: at the moment she is studying }
      - { type: english_phrases, question: "Agora eles estão assistindo TV", correctAnswer: now they are watching tv }
      - { type: english_phrases, question: "Estou cozinhando agora", correctAnswer: i am cooking now }
      - { type: english_phrases, question: "Neste momento chove", correctAnswer: at the moment it is raining }
      - { type: english_phrases, question: "Agora mesmo estamos saindo", correctAnswer: right now we are leaving }
      - { type: english_phrases, question: "Ele está falando no telefone agora", correctAnswer: he is talking on the phone now }
      - { type: english_phrases, question: "Estou te ligando agora", correctAnswer: i am calling you right now }
      - { type: english_phrases, question: "Ela está no meio de uma reunião", correctAnswer: she is in the middle of a meeting }
      - { type: english_phrases, question: "Estamos escutando música", correctAnswer: we are listening to music }
  - pageNumber: 2
    title: Today, This Week, These Days
    description: Temporary ongoing situations.
    exercises:
      - { type: english_phrases, question: "Hoje estou trabalhando em casa", correctAnswer: today i am working from home }
      - { type: english_phrases, question: "Esta semana ela está viajando", correctAnswer: this week she is traveling }
      - { type: english_phrases, question: "Estes dias estamos ocupados", correctAnswer: these days we are busy }
      - { type: english_phrases, question: "Este mês ele está estudando muito", correctAnswer: this month he is studying a lot }
      - { type: english_phrases, question: "Este ano estou aprendendo inglês", correctAnswer: this year i am learning english }
      - { type: english_phrases, question: "Hoje ela está trabalhando até tarde", correctAnswer: today she is working late }
      - { type: english_phrases, question: "Estes dias eles moram comigo", correctAnswer: these days they are living with me }
      - { type: english_phrases, question: "Esta semana eu estou cozinhando mais", correctAnswer: this week i am cooking more }
      - { type: english_phrases, question: "Este semestre ele está melhor", correctAnswer: this semester he is doing better }
      - { type: english_phrases, question: "Hoje em dia as pessoas estão mudando", correctAnswer: these days people are changing }
target: 20
