title: ✏️ English E - There is / There are
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.there_is_are
authorNotes: There is + singular/uncountable; there are + plural. Negatives with isn't/aren't; questions invert verb.
repeatAll: 2
example: "Ex.: 'Há um gato no jardim.' → There is a cat in the garden."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Afirmativo — There is / There are
    description: Use there is para singular/incontável; there are para plural.
    exercises:
      - type: english_phrases
        question: Há um gato no jardim.
        correctAnswer: There is a cat in the garden.
        rationale: "Singular: 'there is a cat'. Existência de algo no lugar."
        difficulty: 1
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há três janelas na sala.
        correctAnswer: There are three windows in the room.
        rationale: "Plural: 'there are + número + substantivo plural'."
        difficulty: 1
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há água na garrafa.
        correctAnswer: There is some water in the bottle.
        rationale: "Incontável usa 'there is (some)': there is some water."
        difficulty: 1
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há muitas pessoas na festa.
        correctAnswer: There are many people at the party.
        rationale: "'People' é plural: 'there are many people'."
        difficulty: 1
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há um problema aqui.
        correctAnswer: There is a problem here.
        rationale: "Singular: 'there is a problem'."
        difficulty: 1
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há dois banheiros no apartamento.
        correctAnswer: There are two bathrooms in the apartment.
        rationale: "Plural: 'there are two bathrooms'."
        difficulty: 1
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há leite na geladeira.
        correctAnswer: There is some milk in the fridge.
        rationale: "Incontável: 'there is some milk'."
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há uma farmácia perto daqui.
        correctAnswer: There is a pharmacy near here.
        rationale: "Singular: 'there is a pharmacy'."
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há vários parques na cidade.
        correctAnswer: There are several parks in the city.
        rationale: "Plural: 'there are several parks'."
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há muita fumaça aqui.
        correctAnswer: There is a lot of smoke here.
        rationale: "Incontável: 'there is a lot of smoke'."
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
  - pageNumber: 2
    title: Negativo e Perguntas
    description: There isn't / There aren't; Is there? / Are there?
    exercises:
      - type: english_phrases
        question: Não há açúcar no café.
        correctAnswer: There isn't any sugar in the coffee.
        rationale: "Negativo incontável: 'there isn't any sugar'."
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Não há cadeiras suficientes.
        correctAnswer: There aren't enough chairs.
        rationale: "Negativo plural: 'there aren't enough chairs'."
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há um banco por aqui?
        correctAnswer: Is there a bank near here?
        rationale: "Pergunta singular: inverte para 'is there a bank?'"
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há ônibus para o centro?
        correctAnswer: Are there any buses to the centre?
        rationale: "Pergunta plural: 'are there any buses?'"
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Não há nenhum hospital na cidade.
        correctAnswer: There isn't a hospital in the city.
        rationale: "Negativo singular: 'there isn't a hospital'."
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há alguma informação sobre o curso?
        correctAnswer: Is there any information about the course?
        rationale: "Pergunta com incontável: 'is there any information?'"
        difficulty: 3
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Não há crianças no parque hoje.
        correctAnswer: There aren't any children in the park today.
        rationale: "Negativo plural: 'there aren't any children'."
        difficulty: 2
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há lojas abertas aos domingos?
        correctAnswer: Are there any shops open on Sundays?
        rationale: "Pergunta plural: 'are there any shops?'"
        difficulty: 3
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Não há tempo suficiente.
        correctAnswer: There isn't enough time.
        rationale: "Incontável negativo: 'there isn't enough time'."
        difficulty: 3
        objectives: [A2.grammar.there_is_are]
      - type: english_phrases
        question: Há algum problema com o pedido?
        correctAnswer: Is there a problem with the order?
        rationale: "Pergunta singular: 'is there a problem?'"
        difficulty: 3
        objectives: [A2.grammar.there_is_are]
target: 20
