title: ✏️ English E - Simple Present — 3rd Person Singular
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.simple_present_3rd
authorNotes: He/she/it + verb-s. Spelling rules — add -es after s/sh/ch/x/o; drop y→ies; have→has. Negative uses doesn't; question uses Does.
repeatAll: 2
example: "Ex.: 'Ela trabalha muito.' → She works a lot."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Verb + s/es/ies
    description: Regras de ortografia da 3ª pessoa do singular.
    exercises:
      - type: english_phrases
        question: Ela trabalha muito.
        correctAnswer: She works a lot.
        rationale: "3ª pessoa sing.: work → works. Acrescenta -s."
        difficulty: 1
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ele mora em Londres.
        correctAnswer: He lives in London.
        rationale: "live → lives. Acrescenta -s (o 'e' final mantém a pronúncia)."
        difficulty: 1
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ela assiste televisão à noite.
        correctAnswer: She watches television at night.
        rationale: "watch → watches. Verbos em -ch recebem -es."
        difficulty: 1
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ele estuda inglês todo dia.
        correctAnswer: He studies English every day.
        rationale: "study → studies. Consoante + y: troca y por -ies."
        difficulty: 1
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ela tem dois irmãos.
        correctAnswer: She has two brothers.
        rationale: "have → has. Forma irregular da 3ª pessoa."
        difficulty: 1
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ele vai à academia de manhã.
        correctAnswer: He goes to the gym in the morning.
        rationale: "go → goes. Verbos em -o recebem -es."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ela lava o carro toda semana.
        correctAnswer: She washes the car every week.
        rationale: "wash → washes. Verbos em -sh recebem -es."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ele joga futebol aos sábados.
        correctAnswer: He plays football on Saturdays.
        rationale: "play → plays. Vogal + y: acrescenta -s normalmente."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: O bebê chora muito.
        correctAnswer: The baby cries a lot.
        rationale: "cry → cries. Consoante + y: troca y por -ies."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ela ensina matemática.
        correctAnswer: She teaches mathematics.
        rationale: "teach → teaches. Verbos em -ch recebem -es."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
  - pageNumber: 2
    title: Negativo e Perguntas — 3ª Pessoa
    description: Doesn't + infinitivo; Does … ?
    exercises:
      - type: english_phrases
        question: Ele não come carne.
        correctAnswer: He doesn't eat meat.
        rationale: "Negativo 3ª pessoa: 'doesn't + verbo base (sem -s)'."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ela não fala espanhol.
        correctAnswer: She doesn't speak Spanish.
        rationale: "'Doesn't speak' — o -s vai no auxiliar, não no verbo."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ele trabalha aos domingos?
        correctAnswer: Does he work on Sundays?
        rationale: "Pergunta 3ª pessoa: 'Does + sujeito + verbo base?'"
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ela mora perto daqui?
        correctAnswer: Does she live near here?
        rationale: "'Does she live?' — verbo base sem -s na pergunta."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: O trem não para aqui.
        correctAnswer: The train doesn't stop here.
        rationale: "'Doesn't stop' — auxiliar carrega a negação."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ela não gosta de acordar cedo.
        correctAnswer: She doesn't like waking up early.
        rationale: "'Doesn't like + -ing': she doesn't like waking up early."
        difficulty: 3
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: O seu irmão estuda na universidade?
        correctAnswer: Does your brother study at university?
        rationale: "'Does + sujeito + verbo base': Does your brother study?"
        difficulty: 3
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ela não tem carro.
        correctAnswer: She doesn't have a car.
        rationale: "'Doesn't have' — negativo de 'have' na 3ª pessoa."
        difficulty: 2
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ele vai ao trabalho de bicicleta?
        correctAnswer: Does he go to work by bike?
        rationale: "'Does he go?' — 'go' sem -es na pergunta."
        difficulty: 3
        objectives: [A2.grammar.simple_present_3rd]
      - type: english_phrases
        question: Ela não entende a pergunta.
        correctAnswer: She doesn't understand the question.
        rationale: "'Doesn't understand' — verbo base sem modificação."
        difficulty: 3
        objectives: [A2.grammar.simple_present_3rd]
target: 20
