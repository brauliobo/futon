title: ✏️ English E - Mixed Review Level E
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.mixed_review_E
authorNotes: Comprehensive review covering all Level E topics — articles, pronouns, prepositions, there is/are, have got, adverbs of frequency, simple present 3rd person, short answers.
repeatAll: 2
example: "Ex.: 'Ela tem um gato e o ama muito.' → She has a cat and she loves it a lot."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Revisão — Parte 1
    description: Artigos, pronomes possessivos, preposições e there is/are.
    exercises:
      - type: english_phrases
        question: Há um supermercado perto da escola.
        correctAnswer: There is a supermarket near the school.
        rationale: "there is + singular: 'there is a supermarket'."
        difficulty: 1
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Minha irmã tem cabelo curto.
        correctAnswer: My sister has short hair.
        rationale: "'My' adjetivo possessivo; 'hair' incontável sem artigo."
        difficulty: 1
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: O livro está na mochila dela.
        correctAnswer: The book is in her bag.
        rationale: "'In' para interior; 'her' possessivo feminino: in her bag."
        difficulty: 1
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Não há nenhuma maçã na fruteira.
        correctAnswer: There aren't any apples in the fruit bowl.
        rationale: "Plural negativo: 'there aren't any apples'."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Eu te vejo todos os dias.
        correctAnswer: I see you every day.
        rationale: "'You' como objeto: I see you every day."
        difficulty: 1
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Essa caneta é minha, não é sua.
        correctAnswer: This pen is mine, not yours.
        rationale: "'Mine' e 'yours' — pronomes possessivos independentes."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: O museu abre às dez da manhã.
        correctAnswer: The museum opens at ten in the morning.
        rationale: "'At' com hora; 'in the morning' com parte do dia."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Eles nos ensinam muitas coisas.
        correctAnswer: They teach us many things.
        rationale: "'Us' objeto indireto: they teach us."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: O cachorro da Ana é muito dócil.
        correctAnswer: Ana's dog is very gentle.
        rationale: "Possessivo 's: Ana's dog."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Há livros em cima da mesa.
        correctAnswer: There are books on the table.
        rationale: "Plural afirmativo: 'there are books'; 'on' para superfície."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
  - pageNumber: 2
    title: Revisão — Parte 2
    description: Have got, advérbios de frequência, 3ª pessoa e respostas curtas.
    exercises:
      - type: english_phrases
        question: Ele sempre chega antes de mim.
        correctAnswer: He always arrives before me.
        rationale: "'Always' antes do verbo; 'before me' com pronome objeto."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Ela não tem ingressos para o show.
        correctAnswer: She hasn't got any tickets for the show.
        rationale: "'She hasn't got any tickets' — negativo de have got."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: "Você fala francês? — Não, não falo."
        correctAnswer: No, I don't.
        rationale: "Resposta curta negativa com 'do': No, I don't."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Ela nunca esquece os aniversários dos amigos.
        correctAnswer: She never forgets her friends' birthdays.
        rationale: "'Never' antes do verbo; friends' plural possessivo."
        difficulty: 3
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: O trem passa pela estação às oito e meia.
        correctAnswer: The train passes through the station at half past eight.
        rationale: "3ª pessoa pass → passes; 'at' com horário."
        difficulty: 3
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Há algum restaurante vegetariano por aqui?
        correctAnswer: Is there a vegetarian restaurant near here?
        rationale: "Pergunta singular: 'Is there a vegetarian restaurant?'"
        difficulty: 3
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Nós geralmente tomamos café da manhã juntos.
        correctAnswer: We usually have breakfast together.
        rationale: "'Usually' antes do verbo principal: usually have breakfast."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: "Ela tem um irmão? — Sim, tem."
        correctAnswer: Yes, she has.
        rationale: "Resposta curta de have got: Yes, she has."
        difficulty: 2
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Ele estuda em uma escola particular.
        correctAnswer: He studies at a private school.
        rationale: "3ª pessoa study → studies; 'at' com instituição."
        difficulty: 3
        objectives: [A2.grammar.mixed_review_E]
      - type: english_phrases
        question: Os livros deles estão na estante.
        correctAnswer: Their books are on the shelf.
        rationale: "'Their' possessivo de they; 'on' para superfície."
        difficulty: 3
        objectives: [A2.grammar.mixed_review_E]
target: 20
