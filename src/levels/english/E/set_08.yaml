title: ✏️ English E - Countable & Uncountable Nouns
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.countable_uncountable
authorNotes: Countable nouns use a/an and plural; uncountable nouns use some/any and no plural. there is/there are agreement.
repeatAll: 2
example: "Ex.: 'Eu tenho um livro.' → I have a book."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: A / An / Some
    description: Use a/an with countable nouns; some with uncountable nouns.
    exercises:
      - type: english_phrases
        question: Eu tenho um livro.
        correctAnswer: I have a book.
        rationale: "'Book' é contável: usa 'a' no singular."
        difficulty: 1
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Ela quer uma maçã.
        correctAnswer: She wants an apple.
        rationale: "'Apple' começa com vogal: usa 'an', não 'a'."
        difficulty: 1
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Eu preciso de água.
        correctAnswer: I need some water.
        rationale: "'Water' é incontável: usa 'some', nunca 'a water'."
        difficulty: 1
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Há pão na mesa.
        correctAnswer: There is some bread on the table.
        rationale: "'Bread' é incontável: usa 'there is' + 'some'."
        difficulty: 1
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Ele tem três gatos.
        correctAnswer: He has three cats.
        rationale: "Substantivos contáveis podem ser pluralizados: cats."
        difficulty: 1
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Quero um pouco de leite.
        correctAnswer: I want some milk.
        rationale: "'Milk' é incontável: usa 'some milk', sem plural."
        difficulty: 1
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Há duas cadeiras aqui.
        correctAnswer: There are two chairs here.
        rationale: "Contável plural: 'there are' + número + substantivo plural."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Precisamos de dinheiro.
        correctAnswer: We need some money.
        rationale: "'Money' é incontável: usa 'some', sem plural."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Há um cão no jardim.
        correctAnswer: There is a dog in the garden.
        rationale: "'Dog' é contável singular: 'there is a dog'."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Ela comprou arroz.
        correctAnswer: She bought some rice.
        rationale: "'Rice' é incontável: usa 'some', sem artigo 'a'."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
  - pageNumber: 2
    title: Any / Plural / There is-are
    description: Use any in negatives/questions; distinguish there is from there are.
    exercises:
      - type: english_phrases
        question: Não há leite na geladeira.
        correctAnswer: There is no milk in the fridge.
        rationale: "Incontável negativo: 'there is no milk' ou 'there isn't any milk'."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Você tem algum açúcar?
        correctAnswer: Do you have any sugar?
        rationale: "Em perguntas com incontável usa-se 'any': any sugar?"
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Não há cadeiras na sala.
        correctAnswer: There are no chairs in the room.
        rationale: "Contável plural negativo: 'there are no chairs'."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Há algumas laranjas na cesta.
        correctAnswer: There are some oranges in the basket.
        rationale: "Contável plural afirmativo: 'there are some oranges'."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Você tem algum café?
        correctAnswer: Do you have any coffee?
        rationale: "Em perguntas com incontável usa-se 'any coffee?'."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Não tenho amigos aqui.
        correctAnswer: I don't have any friends here.
        rationale: "Contável plural negativo: 'don't have any friends'."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Há muita informação nesse livro.
        correctAnswer: There is a lot of information in that book.
        rationale: "'Information' é incontável: 'there is a lot of information'."
        difficulty: 3
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Ela não tem tempo.
        correctAnswer: She doesn't have any time.
        rationale: "'Time' (no sentido de tempo disponível) é incontável: 'any time'."
        difficulty: 3
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Há alguns estudantes na classe.
        correctAnswer: There are some students in the class.
        rationale: "Contável plural afirmativo: 'there are some students'."
        difficulty: 2
        objectives: [A2.grammar.countable_uncountable]
      - type: english_phrases
        question: Não há música na festa.
        correctAnswer: There is no music at the party.
        rationale: "'Music' é incontável: 'there is no music'."
        difficulty: 3
        objectives: [A2.grammar.countable_uncountable]
target: 20
