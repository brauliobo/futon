title: English E - Present Continuous — Mixed Review
level: E
subject: english
difficulty: 4
objectives:
  - A2.grammar.present_continuous
authorNotes: Combines affirmative, negative, and question forms plus future use of continuous for arrangements.
repeatAll: 2
example: Amanhã estamos viajando → Tomorrow we are traveling
pages:
  - pageNumber: 1
    title: Everyday Mixed Practice
    description: Mix of affirmative, negative, and question forms.
    exercises:
      - type: english_phrases
        question: Você está me ouvindo?
        correctAnswer: are you listening to me
        rationale: "'Listen to me' — 'listen' precisa de 'to'. Inversão 'are you'."
      - type: english_phrases
        question: Ela não está trabalhando hoje
        correctAnswer: she is not working today
        rationale: "Negativa: 'is not' + 'working'. 'Today' ao final."
      - type: english_phrases
        question: Estou tentando entender
        correctAnswer: i am trying to understand
        rationale: "'Try to + base' — 'try' + infinitivo. 'Trying' (y mantido, +ing)."
      - type: english_phrases
        question: Eles estão se divertindo
        correctAnswer: they are having fun
        rationale: "'Have fun' = divertir-se (expressão). 'Having' (drop e)."
      - type: english_phrases
        question: Por que você está rindo?
        correctAnswer: why are you laughing
        rationale: "Wh- + 'are' + 'you' + 'laughing'. Inversão padrão."
      - type: english_phrases
        question: Não estou brincando
        correctAnswer: i am not joking
        rationale: "'Joke' → 'joking' (drop e). 'I am not' (negativa com 'am')."
      - type: english_phrases
        question: O que ele está fazendo aí?
        correctAnswer: what is he doing there
        rationale: "'What is he doing' — Wh + is + he + -ing. 'There' = aí/lá."
      - type: english_phrases
        question: Ela está se sentindo melhor
        correctAnswer: she is feeling better
        rationale: "'Feel better' — 'feel' pode ir em continuous. 'Better' (irregular)."
      - type: english_phrases
        question: Estamos comemorando o aniversário
        correctAnswer: we are celebrating the birthday
        rationale: "'Celebrate' → 'celebrating' (drop e). 'The birthday' com artigo."
      - type: english_phrases
        question: Você está gostando?
        correctAnswer: are you enjoying it
        rationale: "'Enjoy it' — 'enjoy' é transitivo, sempre pede objeto. Inversão."
  - pageNumber: 2
    title: Present Continuous for Future Arrangements
    description: Planned future events use continuous in English.
    exercises:
      - type: english_phrases
        question: Amanhã estamos viajando
        correctAnswer: tomorrow we are traveling
        rationale: "Plano confirmado → continuous. 'Tomorrow' abre a frase."
      - type: english_phrases
        question: Semana que vem ele está se mudando
        correctAnswer: next week he is moving
        rationale: "'Move' → 'moving' (drop e). 'Next week' sem artigo."
      - type: english_phrases
        question: Hoje à noite estou saindo
        correctAnswer: tonight i am going out
        rationale: "'Tonight' sem preposição. 'Going out' = saindo (phrasal)."
      - type: english_phrases
        question: Ela está chegando às oito
        correctAnswer: she is arriving at eight
        rationale: "'At eight' — 'at' com horas. 'Arriving' = plano marcado."
      - type: english_phrases
        question: Estamos nos encontrando mais tarde
        correctAnswer: we are meeting later
        rationale: "'Meet' → 'meeting' (dobra 't'? não, ee já é dupla). 'Later' ao fim."
      - type: english_phrases
        question: Ele está voando para Nova York
        correctAnswer: he is flying to new york
        rationale: "'Fly to' — destino com 'to'. 'Fly' → 'flying' (y mantido)."
      - type: english_phrases
        question: Eu estou visitando meus avós domingo
        correctAnswer: i am visiting my grandparents on sunday
        rationale: "'On Sunday' — dias da semana com 'on'. 'Visit' + ing."
      - type: english_phrases
        question: Eles estão começando segunda
        correctAnswer: they are starting on monday
        rationale: "'Start' → 'starting'. 'On Monday' — dias com 'on', maiúsculo."
      - type: english_phrases
        question: Ela está se casando no próximo mês
        correctAnswer: she is getting married next month
        rationale: "'Get married' = casar-se (expressão). 'Next month' sem preposição."
      - type: english_phrases
        question: Vocês estão vindo jantar?
        correctAnswer: are you coming for dinner
        rationale: "'Come for dinner' = vir jantar. 'Come' → 'coming' (drop e)."
target: 20
