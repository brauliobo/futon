title: English E - Present Continuous — Mixed Review
level: E
subject: english
difficulty: 4
objectives: [A2.grammar.present_continuous]
authorNotes: Combines affirmative, negative, and question forms plus future use of continuous for arrangements.
repeatAll: 2
example: "Amanhã estamos viajando → Tomorrow we are traveling"
pages:
  - pageNumber: 1
    title: Everyday Mixed Practice
    description: Mix of affirmative, negative, and question forms.
    exercises:
      - { type: english_phrases, question: "Você está me ouvindo?", correctAnswer: are you listening to me }
      - { type: english_phrases, question: "Ela não está trabalhando hoje", correctAnswer: she is not working today }
      - { type: english_phrases, question: "Estou tentando entender", correctAnswer: i am trying to understand }
      - { type: english_phrases, question: "Eles estão se divertindo", correctAnswer: they are having fun }
      - { type: english_phrases, question: "Por que você está rindo?", correctAnswer: why are you laughing }
      - { type: english_phrases, question: "Não estou brincando", correctAnswer: i am not joking }
      - { type: english_phrases, question: "O que ele está fazendo aí?", correctAnswer: what is he doing there }
      - { type: english_phrases, question: "Ela está se sentindo melhor", correctAnswer: she is feeling better }
      - { type: english_phrases, question: "Estamos comemorando o aniversário", correctAnswer: we are celebrating the birthday }
      - { type: english_phrases, question: "Você está gostando?", correctAnswer: are you enjoying it }
  - pageNumber: 2
    title: Present Continuous for Future Arrangements
    description: Planned future events use continuous in English.
    exercises:
      - { type: english_phrases, question: "Amanhã estamos viajando", correctAnswer: tomorrow we are traveling }
      - { type: english_phrases, question: "Semana que vem ele está se mudando", correctAnswer: next week he is moving }
      - { type: english_phrases, question: "Hoje à noite estou saindo", correctAnswer: tonight i am going out }
      - { type: english_phrases, question: "Ela está chegando às oito", correctAnswer: she is arriving at eight }
      - { type: english_phrases, question: "Estamos nos encontrando mais tarde", correctAnswer: we are meeting later }
      - { type: english_phrases, question: "Ele está voando para Nova York", correctAnswer: he is flying to new york }
      - { type: english_phrases, question: "Eu estou visitando meus avós domingo", correctAnswer: i am visiting my grandparents on sunday }
      - { type: english_phrases, question: "Eles estão começando segunda", correctAnswer: they are starting on monday }
      - { type: english_phrases, question: "Ela está se casando no próximo mês", correctAnswer: she is getting married next month }
      - { type: english_phrases, question: "Vocês estão vindo jantar?", correctAnswer: are you coming for dinner }
target: 20
