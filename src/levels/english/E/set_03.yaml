title: English E - Present Continuous — Negatives
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.present_continuous
  - A2.grammar.negation
authorNotes: Subject + am/is/are + not + verb-ing. Contractions — isn't, aren't.
repeatAll: 2
example: Eu não estou estudando → I am not studying
pages:
  - pageNumber: 1
    title: Am not / is not / are not + -ing
    description: Insert 'not' between auxiliary and -ing.
    exercises:
      - type: english_phrases
        question: Eu não estou estudando
        correctAnswer: i am not studying
        rationale: "'I am not' + 'studying'. 'Not' entre 'be' e o verbo-ing."
      - type: english_phrases
        question: Ele não está trabalhando
        correctAnswer: he is not working
        rationale: "'He is not working' — 'is' (3ª pessoa) + not + working."
      - type: english_phrases
        question: Ela não está dormindo
        correctAnswer: she is not sleeping
        rationale: "'She is not' + 'sleeping' (ee, só +ing). Contração: 'isn't'."
      - type: english_phrases
        question: Nós não estamos indo
        correctAnswer: we are not going
        rationale: "'We are not going' — plural 'are' + not. 'Go' → 'going'."
      - type: english_phrases
        question: Eles não estão comendo
        correctAnswer: they are not eating
        rationale: "'They are not eating' — 'are' pluraliza; não use 'don't' com be."
      - type: english_phrases
        question: Não está chovendo
        correctAnswer: it is not raining
        rationale: "Clima exige 'it'. 'Is not raining' — contração 'isn't raining'."
      - type: english_phrases
        question: Eu não estou ouvindo
        correctAnswer: i am not listening
        rationale: "'I am not' — 'I'm not' (não 'I amn't'). 'Listen' + ing."
      - type: english_phrases
        question: Você não está prestando atenção
        correctAnswer: you are not paying attention
        rationale: "'Pay attention' = prestar atenção (expressão). 'Pay' → 'paying'."
      - type: english_phrases
        question: Ele não está falando sério
        correctAnswer: he is not being serious
        rationale: "'Being' = estado temporário. 'Is not being serious' ≠ 'is not serious'."
      - type: english_phrases
        question: Nós não estamos esperando
        correctAnswer: we are not waiting
        rationale: "'We are not waiting' — 'wait' + ing. Plural 'are'."
  - pageNumber: 2
    title: Contextual Negatives
    description: Negatives in everyday situations.
    exercises:
      - type: english_phrases
        question: Não estou com fome agora
        correctAnswer: i am not hungry now
        rationale: "'Hungry' é adjetivo — 'be hungry', não 'have hunger'. 'I am not hungry'."
      - type: english_phrases
        question: Ela não está lendo esse livro
        correctAnswer: she is not reading that book
        rationale: "'That book' = 'esse livro' (distante). 'Reading' = 'read' + ing."
      - type: english_phrases
        question: O bebê não está dormindo
        correctAnswer: the baby is not sleeping
        rationale: "'The baby is' (singular → is) + 'not sleeping'."
      - type: english_phrases
        question: Eles não estão assistindo TV
        correctAnswer: they are not watching tv
        rationale: "'Watch TV' sem artigo. 'They are not watching' (plural → are)."
      - type: english_phrases
        question: Eu não estou mentindo
        correctAnswer: i am not lying
        rationale: "'Lie' → 'lying' (ie → ying). 'I am not lying'."
      - type: english_phrases
        question: Ele não está nos ajudando
        correctAnswer: he is not helping us
        rationale: "'Us' (pronome objeto) após 'helping'. 'He is not helping us'."
      - type: english_phrases
        question: Nós não estamos perdendo
        correctAnswer: we are not losing
        rationale: "'Lose' perde o 'e': losing. 'We are not' (plural)."
      - type: english_phrases
        question: Você não está me ouvindo
        correctAnswer: you are not listening to me
        rationale: "'Listen to me' — 'listen' exige 'to' antes da pessoa."
      - type: english_phrases
        question: Ela não está chorando
        correctAnswer: she is not crying
        rationale: "'Cry' → 'crying' (consoante+y mantém y). 'She is not'."
      - type: english_phrases
        question: Eles não estão saindo hoje
        correctAnswer: they are not going out today
        rationale: "'Go out' = sair. 'Going out' (phrasal). 'Today' no fim."
target: 20
