title: English E - Present Continuous — Negatives
level: E
subject: english
difficulty: 2
objectives: [A2.grammar.present_continuous, A2.grammar.negation]
authorNotes: Subject + am/is/are + not + verb-ing. Contractions — isn't, aren't.
repeatAll: 2
example: "Eu não estou estudando → I am not studying"
pages:
  - pageNumber: 1
    title: Am not / is not / are not + -ing
    description: Insert 'not' between auxiliary and -ing.
    exercises:
      - { type: english_phrases, question: "Eu não estou estudando", correctAnswer: i am not studying }
      - { type: english_phrases, question: "Ele não está trabalhando", correctAnswer: he is not working }
      - { type: english_phrases, question: "Ela não está dormindo", correctAnswer: she is not sleeping }
      - { type: english_phrases, question: "Nós não estamos indo", correctAnswer: we are not going }
      - { type: english_phrases, question: "Eles não estão comendo", correctAnswer: they are not eating }
      - { type: english_phrases, question: "Não está chovendo", correctAnswer: it is not raining }
      - { type: english_phrases, question: "Eu não estou ouvindo", correctAnswer: i am not listening }
      - { type: english_phrases, question: "Você não está prestando atenção", correctAnswer: you are not paying attention }
      - { type: english_phrases, question: "Ele não está falando sério", correctAnswer: he is not being serious }
      - { type: english_phrases, question: "Nós não estamos esperando", correctAnswer: we are not waiting }
  - pageNumber: 2
    title: Contextual Negatives
    description: Negatives in everyday situations.
    exercises:
      - { type: english_phrases, question: "Não estou com fome agora", correctAnswer: i am not hungry now }
      - { type: english_phrases, question: "Ela não está lendo esse livro", correctAnswer: she is not reading that book }
      - { type: english_phrases, question: "O bebê não está dormindo", correctAnswer: the baby is not sleeping }
      - { type: english_phrases, question: "Eles não estão assistindo TV", correctAnswer: they are not watching tv }
      - { type: english_phrases, question: "Eu não estou mentindo", correctAnswer: i am not lying }
      - { type: english_phrases, question: "Ele não está nos ajudando", correctAnswer: he is not helping us }
      - { type: english_phrases, question: "Nós não estamos perdendo", correctAnswer: we are not losing }
      - { type: english_phrases, question: "Você não está me ouvindo", correctAnswer: you are not listening to me }
      - { type: english_phrases, question: "Ela não está chorando", correctAnswer: she is not crying }
      - { type: english_phrases, question: "Eles não estão saindo hoje", correctAnswer: they are not going out today }
target: 20
