title: English E - Present Continuous — Affirmative
level: E
subject: english
difficulty: 2
objectives: [A2.grammar.present_continuous]
authorNotes: Subject + am/is/are + verb-ing. Actions happening now.
repeatAll: 2
example: "Eu estou estudando → I am studying"
pages:
  - pageNumber: 1
    title: I am / You are + -ing
    description: First and second person present continuous.
    exercises:
      - { type: english_phrases, question: "Eu estou estudando", correctAnswer: i am studying }
      - { type: english_phrases, question: "Eu estou trabalhando", correctAnswer: i am working }
      - { type: english_phrases, question: "Você está lendo", correctAnswer: you are reading }
      - { type: english_phrases, question: "Eu estou comendo", correctAnswer: i am eating }
      - { type: english_phrases, question: "Você está ouvindo?", correctAnswer: are you listening }
      - { type: english_phrases, question: "Eu estou aprendendo inglês", correctAnswer: i am learning english }
      - { type: english_phrases, question: "Estou indo para casa", correctAnswer: i am going home }
      - { type: english_phrases, question: "Você está falando comigo?", correctAnswer: are you talking to me }
      - { type: english_phrases, question: "Estou cozinhando", correctAnswer: i am cooking }
      - { type: english_phrases, question: "Você está me ajudando", correctAnswer: you are helping me }
  - pageNumber: 2
    title: He/She/It is and We/They are + -ing
    description: Third person and plural present continuous.
    exercises:
      - { type: english_phrases, question: "Ele está correndo", correctAnswer: he is running }
      - { type: english_phrases, question: "Ela está cantando", correctAnswer: she is singing }
      - { type: english_phrases, question: "Está chovendo", correctAnswer: it is raining }
      - { type: english_phrases, question: "Nós estamos assistindo", correctAnswer: we are watching }
      - { type: english_phrases, question: "Eles estão brincando", correctAnswer: they are playing }
      - { type: english_phrases, question: "Ela está escrevendo uma carta", correctAnswer: she is writing a letter }
      - { type: english_phrases, question: "Os meninos estão dormindo", correctAnswer: the boys are sleeping }
      - { type: english_phrases, question: "O bebê está rindo", correctAnswer: the baby is laughing }
      - { type: english_phrases, question: "Estamos comemorando", correctAnswer: we are celebrating }
      - { type: english_phrases, question: "Eles estão esperando o ônibus", correctAnswer: they are waiting for the bus }
target: 20
