title: English E - Present Continuous — Affirmative
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.present_continuous
authorNotes: Subject + am/is/are + verb-ing. Actions happening now.
repeatAll: 2
example: Eu estou estudando → I am studying
pages:
  - pageNumber: 1
    title: I am / You are + -ing
    description: First and second person present continuous.
    exercises:
      - type: english_phrases
        question: Eu estou estudando
        correctAnswer: i am studying
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu estou trabalhando
        correctAnswer: i am working
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você está lendo
        correctAnswer: you are reading
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu estou comendo
        correctAnswer: i am eating
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você está ouvindo?
        correctAnswer: are you listening
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu estou aprendendo inglês
        correctAnswer: i am learning english
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Estou indo para casa
        correctAnswer: i am going home
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você está falando comigo?
        correctAnswer: are you talking to me
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Estou cozinhando
        correctAnswer: i am cooking
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você está me ajudando
        correctAnswer: you are helping me
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: He/She/It is and We/They are + -ing
    description: Third person and plural present continuous.
    exercises:
      - type: english_phrases
        question: Ele está correndo
        correctAnswer: he is running
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela está cantando
        correctAnswer: she is singing
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Está chovendo
        correctAnswer: it is raining
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós estamos assistindo
        correctAnswer: we are watching
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles estão brincando
        correctAnswer: they are playing
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela está escrevendo uma carta
        correctAnswer: she is writing a letter
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Os meninos estão dormindo
        correctAnswer: the boys are sleeping
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O bebê está rindo
        correctAnswer: the baby is laughing
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Estamos comemorando
        correctAnswer: we are celebrating
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles estão esperando o ônibus
        correctAnswer: they are waiting for the bus
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
