title: English E - Present Continuous — ing Form
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.present_continuous
authorNotes: Spelling rules for -ing form. Drop silent e, double consonant after short stressed vowel, ie→ying.
repeatAll: 2
example: Correr → running
pages:
  - pageNumber: 1
    title: Regular -ing
    description: Add -ing to the base verb.
    exercises:
      - type: english_phrases
        question: Correr (forma -ing)
        correctAnswer: running
        rationale: "'Run' (CVC tônica) dobra o 'n': running."
      - type: english_phrases
        question: Trabalhar (forma -ing)
        correctAnswer: working
        rationale: "'Work' termina em consoante + consoante: só adiciona -ing."
      - type: english_phrases
        question: Ler (forma -ing)
        correctAnswer: reading
        rationale: "'Read' tem vogal dupla (ea): não dobra consoante. Só +ing."
      - type: english_phrases
        question: Brincar (forma -ing)
        correctAnswer: playing
        rationale: "'Play' termina em vogal+y: não muda nada, só +ing."
      - type: english_phrases
        question: Comer (forma -ing)
        correctAnswer: eating
        rationale: "'Eat' — vogal dupla (ea), só adiciona -ing sem dobrar."
      - type: english_phrases
        question: Estudar (forma -ing)
        correctAnswer: studying
        rationale: "'Study' termina em consoante+y: mantém y e adiciona -ing."
      - type: english_phrases
        question: Dormir (forma -ing)
        correctAnswer: sleeping
        rationale: "'Sleep' tem vogal dupla (ee): não dobra 'p'. Só +ing."
      - type: english_phrases
        question: Falar (forma -ing)
        correctAnswer: speaking
        rationale: "'Speak' — vogal dupla (ea): só adiciona -ing."
      - type: english_phrases
        question: Ouvir (forma -ing)
        correctAnswer: listening
        rationale: "'Listen' — sílaba final átona: não dobra o 'n'. Listening."
      - type: english_phrases
        question: Cantar (forma -ing)
        correctAnswer: singing
        rationale: "'Sing' termina em -ng: só +ing, não se dobra nada."
  - pageNumber: 2
    title: Spelling Exceptions
    description: Drop the final 'e'; double final consonant after short stressed vowel; ie→ying.
    exercises:
      - type: english_phrases
        question: Escrever (forma -ing)
        correctAnswer: writing
        rationale: "'Write' perde o 'e' mudo antes de -ing: writing."
      - type: english_phrases
        question: Chegar (forma -ing, drop e)
        correctAnswer: arriving
        rationale: "'Arrive' perde o 'e' final: arriving (regra do -e mudo)."
      - type: english_phrases
        question: Dar (forma -ing, drop e)
        correctAnswer: giving
        rationale: "'Give' perde o 'e' final: giving, não 'giveing'."
      - type: english_phrases
        question: Fazer (to make, forma -ing)
        correctAnswer: making
        rationale: "'Make' perde o 'e' antes de -ing: making, não 'makeing'."
      - type: english_phrases
        question: Tomar (to take, forma -ing)
        correctAnswer: taking
        rationale: "'Take' perde o 'e' final: taking (e mudo cai antes de -ing)."
      - type: english_phrases
        question: Parar (double p)
        correctAnswer: stopping
        rationale: "'Stop' (CVC tônica) dobra o 'p': stopping."
      - type: english_phrases
        question: Correr (double r)
        correctAnswer: running
        rationale: "'Run' (CVC tônica) dobra o 'n': running."
      - type: english_phrases
        question: Planejar (to plan, double n)
        correctAnswer: planning
        rationale: "'Plan' (CVC tônica) dobra o 'n': planning."
      - type: english_phrases
        question: Mentir (to lie, ie→ying)
        correctAnswer: lying
        rationale: "Verbos em -ie viram -ying: lie → lying."
      - type: english_phrases
        question: Morrer (to die, ie→ying)
        correctAnswer: dying
        rationale: "Verbos em -ie viram -ying: die → dying."
target: 20
