title: English E - Present Continuous — ing Form
level: E
subject: english
difficulty: 2
objectives: [A2.grammar.present_continuous]
authorNotes: Spelling rules for -ing form. Drop silent e, double consonant after short stressed vowel, ie→ying.
repeatAll: 2
example: "Correr → running"
pages:
  - pageNumber: 1
    title: Regular -ing
    description: Add -ing to the base verb.
    exercises:
      - { type: english_phrases, question: "Correr (forma -ing)", correctAnswer: running }
      - { type: english_phrases, question: "Trabalhar (forma -ing)", correctAnswer: working }
      - { type: english_phrases, question: "Ler (forma -ing)", correctAnswer: reading }
      - { type: english_phrases, question: "Brincar (forma -ing)", correctAnswer: playing }
      - { type: english_phrases, question: "Comer (forma -ing)", correctAnswer: eating }
      - { type: english_phrases, question: "Estudar (forma -ing)", correctAnswer: studying }
      - { type: english_phrases, question: "Dormir (forma -ing)", correctAnswer: sleeping }
      - { type: english_phrases, question: "Falar (forma -ing)", correctAnswer: speaking }
      - { type: english_phrases, question: "Ouvir (forma -ing)", correctAnswer: listening }
      - { type: english_phrases, question: "Cantar (forma -ing)", correctAnswer: singing }
  - pageNumber: 2
    title: Spelling Exceptions
    description: Drop the final 'e'; double final consonant after short stressed vowel; ie→ying.
    exercises:
      - { type: english_phrases, question: "Escrever (forma -ing)", correctAnswer: writing }
      - { type: english_phrases, question: "Chegar (forma -ing, drop e)", correctAnswer: arriving }
      - { type: english_phrases, question: "Dar (forma -ing, drop e)", correctAnswer: giving }
      - { type: english_phrases, question: "Fazer (to make, forma -ing)", correctAnswer: making }
      - { type: english_phrases, question: "Tomar (to take, forma -ing)", correctAnswer: taking }
      - { type: english_phrases, question: "Parar (double p)", correctAnswer: stopping }
      - { type: english_phrases, question: "Correr (double r)", correctAnswer: running }
      - { type: english_phrases, question: "Planejar (to plan, double n)", correctAnswer: planning }
      - { type: english_phrases, question: "Mentir (to lie, ie→ying)", correctAnswer: lying }
      - { type: english_phrases, question: "Morrer (to die, ie→ying)", correctAnswer: dying }
target: 20
