title: ✏️ English E - Articles — A, An, The
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.articles
authorNotes: A/an for first mention or non-specific; the for specific or unique referents; zero article for generalisations and proper nouns.
repeatAll: 2
example: "Ex.: 'Ela tem um cão.' → She has a dog."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: A e An — Artigo Indefinido
    description: Use a antes de consoante; an antes de vogal.
    exercises:
      - type: english_phrases
        question: Ela tem um cão.
        correctAnswer: She has a dog.
        rationale: "Primeira menção, não específico, começa com consoante: 'a dog'."
        difficulty: 1
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Ele comeu uma laranja.
        correctAnswer: He ate an orange.
        rationale: "'Orange' começa com vogal 'o': usa 'an'."
        difficulty: 1
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Eu quero uma maçã.
        correctAnswer: I want an apple.
        rationale: "'Apple' começa com 'a' (vogal): usa 'an apple'."
        difficulty: 1
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Ela é professora.
        correctAnswer: She is a teacher.
        rationale: "Profissão no singular usa artigo indefinido: 'a teacher'."
        difficulty: 1
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Isso é um elefante.
        correctAnswer: That is an elephant.
        rationale: "'Elephant' começa com vogal 'e': usa 'an elephant'."
        difficulty: 1
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Eu vi um pássaro.
        correctAnswer: I saw a bird.
        rationale: "Primeira menção, consoante: 'a bird'."
        difficulty: 1
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Ela tem uma ideia.
        correctAnswer: She has an idea.
        rationale: "'Idea' começa com vogal 'i': usa 'an idea'."
        difficulty: 2
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Ele é um estudante.
        correctAnswer: He is a student.
        rationale: "'Student' começa com consoante (som /st/): usa 'a student'."
        difficulty: 1
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Preciso de um guarda-chuva.
        correctAnswer: I need an umbrella.
        rationale: "'Umbrella' começa com vogal 'u': usa 'an umbrella'."
        difficulty: 2
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Há um ônibus às nove.
        correctAnswer: There is a bus at nine.
        rationale: "'Bus' começa com consoante: usa 'a bus'."
        difficulty: 2
        objectives: [A2.grammar.articles]
  - pageNumber: 2
    title: The e Artigo Zero
    description: The para referentes específicos/únicos; sem artigo para generalizações.
    exercises:
      - type: english_phrases
        question: O sol nasce no leste.
        correctAnswer: The sun rises in the east.
        rationale: "'The sun' — único no mundo, usa 'the'; direções cardeais também usam 'the'."
        difficulty: 2
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Feche a porta, por favor.
        correctAnswer: Close the door, please.
        rationale: "Referente específico (a porta que sabemos qual é): 'the door'."
        difficulty: 2
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Gatos são animais independentes.
        correctAnswer: Cats are independent animals.
        rationale: "Generalização sobre a espécie: sem artigo ('cats', não 'the cats')."
        difficulty: 2
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Ela mora no Brasil.
        correctAnswer: She lives in Brazil.
        rationale: "Nomes de países na maioria não usam artigo: 'in Brazil'."
        difficulty: 2
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Eu gosto de música.
        correctAnswer: I like music.
        rationale: "Generalização com incontável: sem artigo ('music', não 'the music')."
        difficulty: 2
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: O livro está na mesa.
        correctAnswer: The book is on the table.
        rationale: "Ambos são específicos/já mencionados: 'the book', 'the table'."
        difficulty: 2
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Ela toca piano.
        correctAnswer: She plays the piano.
        rationale: "Instrumentos musicais usam 'the': 'plays the piano'."
        difficulty: 3
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Eles foram ao cinema ontem.
        correctAnswer: They went to the cinema yesterday.
        rationale: "Lugares de lazer comuns usam 'the': 'the cinema'."
        difficulty: 3
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: A lua está linda hoje.
        correctAnswer: The moon is beautiful tonight.
        rationale: "'The moon' — único no contexto, usa 'the'."
        difficulty: 2
        objectives: [A2.grammar.articles]
      - type: english_phrases
        question: Ele vai à escola de segunda a sexta.
        correctAnswer: He goes to school on weekdays.
        rationale: "'School' em sentido institucional: sem artigo ('to school', não 'to the school')."
        difficulty: 3
        objectives: [A2.grammar.articles]
target: 20
