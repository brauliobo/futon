title: English E - Present Continuous — Questions
level: E
subject: english
difficulty: 3
objectives:
  - A2.grammar.present_continuous
  - A2.grammar.questions
authorNotes: Invert 'be' — Am/Is/Are + subject + verb-ing. Wh-word goes first.
repeatAll: 2
example: Você está estudando? → Are you studying?
pages:
  - pageNumber: 1
    title: Yes/No Questions
    description: Invert auxiliary with subject.
    exercises:
      - type: english_phrases
        question: Você está estudando?
        correctAnswer: are you studying
        rationale: "'Are you studying?' — inversão 'are' + 'you' + verbo-ing."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Ele está trabalhando?
        correctAnswer: is he working
        rationale: "'Is he working?' — 3ª pessoa usa 'is' invertido antes de 'he'."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Está chovendo?
        correctAnswer: is it raining
        rationale: "Clima pede 'it'. 'Is it raining?' — inversão com 'it'."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Eles estão vindo?
        correctAnswer: are they coming
        rationale: "'Are they coming?' — plural 'are'. 'Come' → 'coming' (drop e)."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Ela está comendo?
        correctAnswer: is she eating
        rationale: "'Is she eating?' — inversão 'is' + 'she' + 'eating'."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Vocês estão prestando atenção?
        correctAnswer: are you paying attention
        rationale: "'Pay attention' = prestar atenção. 'Are you paying attention?'."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Você está me ouvindo?
        correctAnswer: are you listening to me
        rationale: "'Listen to me' — 'listen' precisa de 'to'. Inversão 'are you'."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Ele está brincando?
        correctAnswer: is he playing
        rationale: "'Is he playing?' — 'play' mantém 'y', +ing. Inversão."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Nós estamos indo?
        correctAnswer: are we going
        rationale: "'Are we going?' — plural 'are'. 'Go' → 'going'."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Elas estão rindo?
        correctAnswer: are they laughing
        rationale: "'Are they laughing?' — 'laugh' + ing, sem dobrar consoante."
        difficulty: 2
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
  - pageNumber: 2
    title: Wh- Questions
    description: Question word + am/is/are + subject + verb-ing.
    exercises:
      - type: english_phrases
        question: O que você está fazendo?
        correctAnswer: what are you doing
        rationale: "Wh- + 'be' + sujeito: 'What are you doing?'. 'Do' → 'doing'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Onde ela está indo?
        correctAnswer: where is she going
        rationale: "'Where is she going?' — Wh + is + sujeito + -ing."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Por que ele está chorando?
        correctAnswer: why is he crying
        rationale: "'Why is he crying?' — 'cry' → 'crying'. Wh + is + he."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Com quem você está falando?
        correctAnswer: who are you talking to
        rationale: "'Who...talking to?' — 'to' ao final (preposição stranding)."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: O que está acontecendo?
        correctAnswer: what is happening
        rationale: "'What is happening?' — 'happen' dobra 'n'? Não: átona, só +ing."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Por que eles estão rindo?
        correctAnswer: why are they laughing
        rationale: "'Why are they laughing?' — plural 'are' + sujeito + -ing."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Como eles estão se saindo?
        correctAnswer: how are they doing
        rationale: "'How are they doing?' = como estão indo (saúde/situação)."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: O que ela está lendo?
        correctAnswer: what is she reading
        rationale: "'What is she reading?' — Wh + is + she + verbo-ing."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Aonde você está me levando?
        correctAnswer: where are you taking me
        rationale: "'Take me' — pronome objeto após 'taking'. 'Take' → 'taking'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
      - type: english_phrases
        question: Por que o bebê está chorando?
        correctAnswer: why is the baby crying
        rationale: "'The baby is' (singular → is). Inversão: 'Why is the baby crying?'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.questions]
target: 20
