title: ✏️ English E - Object Pronouns
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.object_pronouns
authorNotes: Object pronouns (me, you, him, her, it, us, them) replace noun objects. Contrast with subject pronouns.
repeatAll: 2
example: "Ex.: 'Ele me ajuda.' → He helps me."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Me, You, Him, Her
    description: Pronomes objeto para I, you, he, she.
    exercises:
      - type: english_phrases
        question: Ele me ajuda.
        correctAnswer: He helps me.
        rationale: "'Me' é o pronome objeto de 'I': He helps me."
        difficulty: 1
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Eu te amo.
        correctAnswer: I love you.
        rationale: "'You' funciona como sujeito e objeto: I love you."
        difficulty: 1
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Ela o conhece. (referindo-se a ele)
        correctAnswer: She knows him.
        rationale: "'Him' é o pronome objeto de 'he': She knows him."
        difficulty: 1
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Nós a vemos todos os dias. (referindo-se a ela)
        correctAnswer: We see her every day.
        rationale: "'Her' é o pronome objeto de 'she': We see her."
        difficulty: 1
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: A professora nos chama.
        correctAnswer: The teacher calls us.
        rationale: "'Us' é o pronome objeto de 'we': calls us."
        difficulty: 1
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Eu o ouço. (referindo-se a ele)
        correctAnswer: I hear him.
        rationale: "'Him' substitui o nome masculino como objeto."
        difficulty: 1
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Ele a visita toda semana. (referindo-se a ela)
        correctAnswer: He visits her every week.
        rationale: "'Her' substitui o nome feminino como objeto."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Ela me espera lá fora.
        correctAnswer: She waits for me outside.
        rationale: "'Me' é objeto após preposição 'for': waits for me."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Minha mãe nos liga todo dia.
        correctAnswer: My mother calls us every day.
        rationale: "'Us' é o pronome objeto de 'we': calls us."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: O professor te explica a tarefa.
        correctAnswer: The teacher explains the homework to you.
        rationale: "'You' como objeto indireto após 'to': to you."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
  - pageNumber: 2
    title: It, Us, Them — Frases Completas
    description: Pronomes objeto para it, we/us, they/them em contexto.
    exercises:
      - type: english_phrases
        question: Eu o compro. (referindo-se ao livro)
        correctAnswer: I buy it.
        rationale: "'It' substitui objeto neutro (book, thing): I buy it."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Ela os vê no parque. (referindo-se a eles)
        correctAnswer: She sees them in the park.
        rationale: "'Them' é o pronome objeto de 'they': sees them."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Você pode me ajudar?
        correctAnswer: Can you help me?
        rationale: "'Me' como objeto direto do verbo 'help': help me."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Ele os convida para a festa. (referindo-se a eles)
        correctAnswer: He invites them to the party.
        rationale: "'Them' substitui plural de pessoas como objeto."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Ela o usa todos os dias. (referindo-se ao telefone)
        correctAnswer: She uses it every day.
        rationale: "'It' substitui objeto inanimado (phone): uses it."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: O diretor nos chama.
        correctAnswer: The director calls us.
        rationale: "'Us' é o pronome objeto de 'we'."
        difficulty: 2
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Eu não os conheço. (referindo-se a eles)
        correctAnswer: I don't know them.
        rationale: "'Them' como objeto em frase negativa: don't know them."
        difficulty: 3
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Ela nos ensina inglês.
        correctAnswer: She teaches us English.
        rationale: "'Us' é o objeto indireto de 'teach': teaches us English."
        difficulty: 3
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Você a encontrou ontem? (referindo-se a ela)
        correctAnswer: Did you meet her yesterday?
        rationale: "'Her' como objeto em pergunta no passado: meet her."
        difficulty: 3
        objectives: [A2.grammar.object_pronouns]
      - type: english_phrases
        question: Ele me manda mensagens todo dia.
        correctAnswer: He sends me messages every day.
        rationale: "'Me' como objeto indireto: sends me messages."
        difficulty: 3
        objectives: [A2.grammar.object_pronouns]
target: 20
