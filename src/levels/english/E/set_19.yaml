title: ✏️ English E - Short Answers
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.short_answers
authorNotes: Short answers repeat the auxiliary (do/does/is/are/have/has/can). Never use the main verb; never use 'yes, I work' or 'no, she speaks'.
repeatAll: 2
example: "Ex.: 'Você fala inglês?' — 'Sim, falo.' → Yes, I do."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Yes/No com Do/Does/Is/Are
    description: Respostas curtas usam o auxiliar da pergunta.
    exercises:
      - type: english_phrases
        question: "Você fala inglês? — Sim, falo."
        correctAnswer: Yes, I do.
        rationale: "A pergunta usa 'do', então a resposta repete 'do': Yes, I do."
        difficulty: 1
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Ela mora aqui? — Não, ela não mora."
        correctAnswer: No, she doesn't.
        rationale: "3ª pessoa negativo: 'No, she doesn't.' (não 'No, she don't')."
        difficulty: 1
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Você é estudante? — Sim, sou."
        correctAnswer: Yes, I am.
        rationale: "Pergunta com 'are you': resposta 'Yes, I am.' (verbo be)."
        difficulty: 1
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Eles trabalham aqui? — Não, não trabalham."
        correctAnswer: No, they don't.
        rationale: "Plural negativo: 'No, they don't.'"
        difficulty: 1
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Ele é seu irmão? — Não, não é."
        correctAnswer: No, he isn't.
        rationale: "Negativo de be 3ª sing.: 'No, he isn't.' (ou 'he's not')."
        difficulty: 1
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Ela gosta de música? — Sim, gosta."
        correctAnswer: Yes, she does.
        rationale: "3ª pessoa positivo: 'Yes, she does.' (não 'she do')."
        difficulty: 1
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Você está cansado? — Sim, estou."
        correctAnswer: Yes, I am.
        rationale: "Pergunta com 'are you': 'Yes, I am.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Eles são brasileiros? — Sim, são."
        correctAnswer: Yes, they are.
        rationale: "Plural de be positivo: 'Yes, they are.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Você mora em São Paulo? — Não, não moro."
        correctAnswer: No, I don't.
        rationale: "1ª pessoa negativo: 'No, I don't.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Ele estuda muito? — Sim, estuda."
        correctAnswer: Yes, he does.
        rationale: "3ª pessoa positivo: 'Yes, he does.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
  - pageNumber: 2
    title: Have/Has, Can e Misturados
    description: Respostas curtas com have got, can e formas mistas.
    exercises:
      - type: english_phrases
        question: "Você tem um carro? — Sim, tenho."
        correctAnswer: Yes, I have.
        rationale: "Com 'have got': 'Have you got?' → 'Yes, I have.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Ela tem irmãos? — Não, não tem."
        correctAnswer: No, she hasn't.
        rationale: "3ª pessoa negativo de have got: 'No, she hasn't.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Você pode me ajudar? — Sim, posso."
        correctAnswer: Yes, I can.
        rationale: "Modal 'can': resposta repete 'can': Yes, I can."
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Ele sabe nadar? — Não, não sabe."
        correctAnswer: No, he can't.
        rationale: "Modal negativo: 'No, he can't.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Vocês estão prontos? — Sim, estamos."
        correctAnswer: Yes, we are.
        rationale: "Plural be positivo: 'Yes, we are.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Você vai à festa? — Não, não vou."
        correctAnswer: No, I'm not.
        rationale: "'Are you going?' → 'No, I'm not.' (present continuous)."
        difficulty: 3
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Eles têm filhos? — Sim, têm."
        correctAnswer: Yes, they have.
        rationale: "'Have they got?' → 'Yes, they have.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Ela está estudando agora? — Sim, está."
        correctAnswer: Yes, she is.
        rationale: "'Is she studying?' → 'Yes, she is.'"
        difficulty: 2
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Vocês falam português? — Sim, falamos."
        correctAnswer: Yes, we do.
        rationale: "'Do you speak?' (plural you) → 'Yes, we do.'"
        difficulty: 3
        objectives: [A2.grammar.short_answers]
      - type: english_phrases
        question: "Você pode vir amanhã? — Não, não posso."
        correctAnswer: No, I can't.
        rationale: "Modal negativo: 'No, I can't.'"
        difficulty: 3
        objectives: [A2.grammar.short_answers]
target: 20
