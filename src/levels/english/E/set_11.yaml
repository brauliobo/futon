title: ✏️ English E - Possessive Adjectives
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.possessive_adjectives
authorNotes: Possessive adjectives (my, your, his, her, its, our, their) agree with the possessor, not the noun possessed.
repeatAll: 2
example: "Ex.: 'Meu livro é novo.' → My book is new."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: My, Your, His, Her
    description: Adjetivos possessivos para I, you, he, she.
    exercises:
      - type: english_phrases
        question: Meu livro é novo.
        correctAnswer: My book is new.
        rationale: "'My' é o adjetivo possessivo de 'I': my book."
        difficulty: 1
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: O seu cão é grande.
        correctAnswer: Your dog is big.
        rationale: "'Your' é o adjetivo possessivo de 'you': your dog."
        difficulty: 1
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: O irmão dele é alto.
        correctAnswer: His brother is tall.
        rationale: "'His' é o adjetivo possessivo de 'he': his brother."
        difficulty: 1
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: A mochila dela é azul.
        correctAnswer: Her backpack is blue.
        rationale: "'Her' é o adjetivo possessivo de 'she': her backpack."
        difficulty: 1
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Minha professora é simpática.
        correctAnswer: My teacher is nice.
        rationale: "Em inglês o possessivo não muda com o gênero do objeto: 'my teacher'."
        difficulty: 1
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: O nome dele é Pedro.
        correctAnswer: His name is Pedro.
        rationale: "'His' concorda com o possuidor (ele), não com o objeto (name)."
        difficulty: 1
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Os amigos dela são legais.
        correctAnswer: Her friends are cool.
        rationale: "'Her' concorda com a possuidora (she), não com o plural: her friends."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Qual é o seu endereço?
        correctAnswer: What is your address?
        rationale: "'Your' é o possessivo de 'you' (sing./pl.): your address."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Ele perdeu o passaporte dele.
        correctAnswer: He lost his passport.
        rationale: "'His' para posse masculina: he lost his passport."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Ela lavou o cabelo dela.
        correctAnswer: She washed her hair.
        rationale: "'Her' para posse feminina: she washed her hair."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
  - pageNumber: 2
    title: Its, Our, Their — Frases Completas
    description: Adjetivos possessivos para it, we, they.
    exercises:
      - type: english_phrases
        question: O gato perdeu a coleira dele.
        correctAnswer: The cat lost its collar.
        rationale: "'Its' é o possessivo para 'it' (animais/objetos): its collar."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Nossa casa é pequena.
        correctAnswer: Our house is small.
        rationale: "'Our' é o adjetivo possessivo de 'we': our house."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Os filhos deles são inteligentes.
        correctAnswer: Their children are intelligent.
        rationale: "'Their' é o adjetivo possessivo de 'they': their children."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: O carro deles é vermelho.
        correctAnswer: Their car is red.
        rationale: "'Their' para plural de possuidores: their car."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: A empresa perdeu seus clientes.
        correctAnswer: The company lost its clients.
        rationale: "'Its' para entidades neutras (company): its clients."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Nosso time ganhou o jogo.
        correctAnswer: Our team won the game.
        rationale: "'Our' para o grupo de que faço parte: our team."
        difficulty: 2
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Eles adoram a cidade deles.
        correctAnswer: They love their city.
        rationale: "'Their' possessivo de 'they': they love their city."
        difficulty: 3
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: O cachorro está comendo a ração dele.
        correctAnswer: The dog is eating its food.
        rationale: "'Its' para animal neutro como possuidor: its food."
        difficulty: 3
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Nós precisamos de ajuda com os nossos deveres.
        correctAnswer: We need help with our homework.
        rationale: "'Our' para posse do grupo: our homework."
        difficulty: 3
        objectives: [A2.grammar.possessive_adjectives]
      - type: english_phrases
        question: Os alunos abriram os livros deles.
        correctAnswer: The students opened their books.
        rationale: "'Their' para possuidores no plural: their books."
        difficulty: 3
        objectives: [A2.grammar.possessive_adjectives]
target: 20
