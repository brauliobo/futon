title: ✏️ English E - Adverbs of Frequency
level: E
subject: english
difficulty: 2
objectives:
  - A2.grammar.adverbs_frequency
authorNotes: Always/usually/often/sometimes/never go before main verb but after be. Questions and negatives follow normal word order.
repeatAll: 2
example: "Ex.: 'Ela sempre bebe café.' → She always drinks coffee."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Posição dos Advérbios de Frequência
    description: O advérbio vem antes do verbo principal; depois de be.
    exercises:
      - type: english_phrases
        question: Ela sempre bebe café.
        correctAnswer: She always drinks coffee.
        rationale: "'Always' vem antes do verbo principal: always drinks."
        difficulty: 1
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Eu nunca como carne.
        correctAnswer: I never eat meat.
        rationale: "'Never' vem antes do verbo principal: never eat."
        difficulty: 1
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Ele às vezes chega atrasado.
        correctAnswer: He sometimes arrives late.
        rationale: "'Sometimes' vem antes do verbo principal: sometimes arrives."
        difficulty: 1
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Nós geralmente almoçamos em casa.
        correctAnswer: We usually have lunch at home.
        rationale: "'Usually' vem antes do verbo principal: usually have."
        difficulty: 1
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Ela frequentemente estuda à noite.
        correctAnswer: She often studies at night.
        rationale: "'Often' vem antes do verbo principal: often studies."
        difficulty: 1
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Eu sempre sou pontual.
        correctAnswer: I am always punctual.
        rationale: "Com 'be': advérbio vem DEPOIS do verbo: am always."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Eles raramente viajam de avião.
        correctAnswer: They rarely travel by plane.
        rationale: "'Rarely' vem antes do verbo principal: rarely travel."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Ele nunca está em casa.
        correctAnswer: He is never at home.
        rationale: "Com 'be': advérbio depois de 'is': is never at home."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Você geralmente acorda cedo?
        correctAnswer: Do you usually wake up early?
        rationale: "Em perguntas: 'Do you usually wake up?' — 'usually' antes do verbo principal."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Ela às vezes é impaciente.
        correctAnswer: She is sometimes impatient.
        rationale: "Com 'be': 'is sometimes impatient' — advérbio após 'is'."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
  - pageNumber: 2
    title: Frases Mais Complexas
    description: Advérbios de frequência em contextos variados.
    exercises:
      - type: english_phrases
        question: Eu sempre esqueço as chaves.
        correctAnswer: I always forget my keys.
        rationale: "'Always' antes do verbo principal: always forget."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Eles frequentemente jogam futebol no fim de semana.
        correctAnswer: They often play football at the weekend.
        rationale: "'Often' antes do verbo: often play football."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Ela nunca bebe álcool.
        correctAnswer: She never drinks alcohol.
        rationale: "'Never' é negativo por si só: she never drinks (sem 'doesn't')."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Nós às vezes vemos um filme à noite.
        correctAnswer: We sometimes watch a film in the evening.
        rationale: "'Sometimes' antes do verbo: sometimes watch a film."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Ele raramente está disponível.
        correctAnswer: He is rarely available.
        rationale: "Com 'be': 'is rarely available' — advérbio após 'is'."
        difficulty: 3
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Você sempre come café da manhã?
        correctAnswer: Do you always eat breakfast?
        rationale: "Pergunta: 'Do you always eat?' — 'always' antes do verbo principal."
        difficulty: 2
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Ela geralmente é muito calma.
        correctAnswer: She is usually very calm.
        rationale: "Com 'be': 'is usually very calm' — advérbio após 'is'."
        difficulty: 3
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Nós nunca chegamos tarde.
        correctAnswer: We never arrive late.
        rationale: "'Never' é negativo — não usar 'don't never': we never arrive."
        difficulty: 3
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Ele frequentemente viaja a trabalho.
        correctAnswer: He often travels for work.
        rationale: "'Often' antes do verbo: often travels for work."
        difficulty: 3
        objectives: [A2.grammar.adverbs_frequency]
      - type: english_phrases
        question: Às vezes eu fico em casa no domingo.
        correctAnswer: Sometimes I stay at home on Sundays.
        rationale: "'Sometimes' pode aparecer no início da frase para ênfase."
        difficulty: 3
        objectives: [A2.grammar.adverbs_frequency]
target: 20
