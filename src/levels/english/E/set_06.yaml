title: English E - Present Continuous vs Present Simple
level: E
subject: english
difficulty: 4
objectives:
  - A2.grammar.present_continuous
  - A2.grammar.present_simple
authorNotes: Continuous for actions in progress / temporary situations; simple for habits / permanent truths.
repeatAll: 2
example: Geralmente ando, mas hoje estou dirigindo → I usually walk, but today I am driving
pages:
  - pageNumber: 1
    title: Habit vs In Progress
    description: Choose between simple and continuous.
    exercises:
      - type: english_phrases
        question: Eu trabalho em um banco (hábito)
        correctAnswer: i work at a bank
        rationale: "'Work at a bank' = hábito/profissão → simple present, não continuous."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Hoje estou trabalhando em casa
        correctAnswer: today i am working from home
        rationale: "'Today' = temporário → continuous. 'Work from home' fixo."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Ela joga futebol às quartas
        correctAnswer: she plays soccer on wednesdays
        rationale: "Rotina semanal → simple. 'Plays' (3ª pessoa +s). 'On Wednesdays'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Neste momento ela está jogando
        correctAnswer: at the moment she is playing
        rationale: "'At the moment' = agora → continuous. 'Is playing'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Normalmente ando, mas hoje dirijo (going)
        correctAnswer: i usually walk but today i am driving
        rationale: "'Usually walk' = simple (hábito); 'today...driving' = continuous."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Ele mora em Londres
        correctAnswer: he lives in london
        rationale: "Residência permanente → simple. 'Lives' (3ª pessoa +s). 'In London'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Este mês ele está morando em Paris
        correctAnswer: this month he is living in paris
        rationale: "'This month' = temporário → 'is living', não 'lives'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Eles sempre chegam cedo
        correctAnswer: they always arrive early
        rationale: "'Always' = hábito → simple present. 'Arrive' (plural sem -s)."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Hoje eles estão chegando tarde
        correctAnswer: today they are arriving late
        rationale: "'Today' + ação atípica → continuous 'are arriving'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: O sol nasce no leste
        correctAnswer: the sun rises in the east
        rationale: "Verdade universal → simple. 'Rises' (3ª pessoa). 'In the east' com 'the'."
        difficulty: 3
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
  - pageNumber: 2
    title: Stative Verbs
    description: Verbs of state (know, like, want) normally use simple present even with now.
    exercises:
      - type: english_phrases
        question: Eu sei a resposta
        correctAnswer: i know the answer
        rationale: "'Know' é verbo de estado → nunca 'am knowing'. Sempre simple."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Ela quer um café
        correctAnswer: she wants a coffee
        rationale: "'Want' é stative → simple 'wants', não 'is wanting'."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Eu gosto dessa música
        correctAnswer: i like this song
        rationale: "'Like' é stative → simple, nunca 'am liking'. 'This song' (próximo)."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Ele entende português
        correctAnswer: he understands portuguese
        rationale: "'Understand' é stative → 'understands' (3ª pessoa + s)."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Nós precisamos de ajuda
        correctAnswer: we need help
        rationale: "'Need' é stative → simple. 'Help' incontável, sem artigo."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Ela acredita em você
        correctAnswer: she believes in you
        rationale: "'Believe in' + pessoa. 'Believe' é stative → 'believes'."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Isso importa
        correctAnswer: it matters
        rationale: "'Matter' = importar (impessoal). 'It matters' → simple."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Eu concordo com ela
        correctAnswer: i agree with her
        rationale: "'Agree with' + pessoa. Stative → simple, nunca 'am agreeing'."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Ele pertence a esse clube
        correctAnswer: he belongs to that club
        rationale: "'Belong to' = pertencer a. Stative → 'belongs' (3ª pessoa + s)."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
      - type: english_phrases
        question: Parece bom
        correctAnswer: it seems good
        rationale: "'Seem' é stative → 'it seems'. 'Good' após verbo de percepção."
        difficulty: 4
        objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
target: 20
