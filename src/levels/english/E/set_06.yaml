title: English E - Present Continuous vs Present Simple
level: E
subject: english
difficulty: 4
objectives: [A2.grammar.present_continuous, A2.grammar.present_simple]
authorNotes: Continuous for actions in progress / temporary situations; simple for habits / permanent truths.
repeatAll: 2
example: "Geralmente ando, mas hoje estou dirigindo → I usually walk, but today I am driving"
pages:
  - pageNumber: 1
    title: Habit vs In Progress
    description: Choose between simple and continuous.
    exercises:
      - { type: english_phrases, question: "Eu trabalho em um banco (hábito)", correctAnswer: i work at a bank }
      - { type: english_phrases, question: "Hoje estou trabalhando em casa", correctAnswer: today i am working from home }
      - { type: english_phrases, question: "Ela joga futebol às quartas", correctAnswer: she plays soccer on wednesdays }
      - { type: english_phrases, question: "Neste momento ela está jogando", correctAnswer: at the moment she is playing }
      - { type: english_phrases, question: "Normalmente ando, mas hoje dirijo (going)", correctAnswer: i usually walk but today i am driving }
      - { type: english_phrases, question: "Ele mora em Londres", correctAnswer: he lives in london }
      - { type: english_phrases, question: "Este mês ele está morando em Paris", correctAnswer: this month he is living in paris }
      - { type: english_phrases, question: "Eles sempre chegam cedo", correctAnswer: they always arrive early }
      - { type: english_phrases, question: "Hoje eles estão chegando tarde", correctAnswer: today they are arriving late }
      - { type: english_phrases, question: "O sol nasce no leste", correctAnswer: the sun rises in the east }
  - pageNumber: 2
    title: Stative Verbs
    description: Verbs of state (know, like, want) normally use simple present even with now.
    exercises:
      - { type: english_phrases, question: "Eu sei a resposta", correctAnswer: i know the answer }
      - { type: english_phrases, question: "Ela quer um café", correctAnswer: she wants a coffee }
      - { type: english_phrases, question: "Eu gosto dessa música", correctAnswer: i like this song }
      - { type: english_phrases, question: "Ele entende português", correctAnswer: he understands portuguese }
      - { type: english_phrases, question: "Nós precisamos de ajuda", correctAnswer: we need help }
      - { type: english_phrases, question: "Ela acredita em você", correctAnswer: she believes in you }
      - { type: english_phrases, question: "Isso importa", correctAnswer: it matters }
      - { type: english_phrases, question: "Eu concordo com ela", correctAnswer: i agree with her }
      - { type: english_phrases, question: "Ele pertence a esse clube", correctAnswer: he belongs to that club }
      - { type: english_phrases, question: "Parece bom", correctAnswer: it seems good }
target: 20
