title: 🔤 English 7A - Maiúsculas e minúsculas A a, B b, C c
level: 7A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.letters
authorNotes: Correspondência entre letras maiúsculas e minúsculas das primeiras letras.
repeatAll: 2
example: "Ex.: 'A' maiúscula → 'a' minúscula."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: A maiúsculo e a minúsculo
    description: Reconheça a letra A nas formas maiúscula e minúscula.
    exercises:
      - type: english_vocab
        question: Escreva a forma minúscula (lowercase) de 'A'
        correctAnswer: a
        rationale: "'A' maiúsculo (uppercase) corresponde a 'a' minúsculo (lowercase)."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva a forma maiúscula (uppercase) de 'a'
        correctAnswer: A
        rationale: "'a' minúsculo (lowercase) corresponde a 'A' maiúsculo (uppercase)."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'apple' começa com letra maiúscula ou minúscula?"
        correctAnswer: lowercase
        rationale: "'apple' começa com 'a' minúsculo. Usamos maiúscula só no início de frases e nomes."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Qual é a maiúscula de 'b'?"
        correctAnswer: B
        rationale: "'b' minúsculo corresponde a 'B' maiúsculo. São a mesma letra, formas diferentes."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Qual é a minúscula de 'B'?"
        correctAnswer: b
        rationale: "'B' maiúsculo corresponde a 'b' minúsculo. São a mesma letra, formas diferentes."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Em inglês, como se chama letra maiúscula?
        correctAnswer: uppercase
        rationale: "Letra maiúscula = uppercase letter. Letra minúscula = lowercase letter."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Em inglês, como se chama letra minúscula?
        correctAnswer: lowercase
        rationale: "Letra minúscula = lowercase letter. Letra maiúscula = uppercase letter."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Qual é a maiúscula de 'c'?"
        correctAnswer: C
        rationale: "'c' minúsculo corresponde a 'C' maiúsculo. São a mesma letra, formas diferentes."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Qual é a minúscula de 'C'?"
        correctAnswer: c
        rationale: "'C' maiúsculo corresponde a 'c' minúsculo."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'Cat' começa com maiúscula ou minúscula? Por que?"
        correctAnswer: uppercase
        rationale: "'Cat' com maiúscula aparece no início de frase. Em meio de frase seria 'cat'."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
  - pageNumber: 2
    title: Pares maiúsculo-minúsculo A, B, C
    description: Combine as letras maiúsculas e minúsculas corretamente.
    exercises:
      - type: english_vocab
        question: "Escreva o par completo da letra A: maiúscula e minúscula"
        correctAnswer: A a
        rationale: "O par completo é 'A a' — maiúscula e minúscula da mesma letra."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Escreva o par completo da letra B: maiúscula e minúscula"
        correctAnswer: B b
        rationale: "O par completo é 'B b' — maiúscula e minúscula da mesma letra."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Escreva o par completo da letra C: maiúscula e minúscula"
        correctAnswer: C c
        rationale: "O par completo é 'C c' — maiúscula e minúscula da mesma letra."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a minúscula que combina com A?
        correctAnswer: a
        rationale: "'a' é a forma minúscula de 'A'. Mesmo som, mesma letra, aparência diferente."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a maiúscula que combina com b?
        correctAnswer: B
        rationale: "'B' é a forma maiúscula de 'b'. Mesmo som, mesma letra, aparência diferente."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Na frase 'A big cat', quantas letras são maiúsculas?"
        correctAnswer: one
        rationale: "Na frase 'A big cat', apenas o 'A' inicial é maiúsculo — uma letra maiúscula."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Quando usamos letra maiúscula em inglês?
        correctAnswer: at the start of a sentence
        rationale: "Usamos maiúscula no início de cada frase e em nomes próprios."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Escreva 'apple' com letra maiúscula no início"
        correctAnswer: Apple
        rationale: "Para começar uma frase, 'apple' vira 'Apple' com A maiúsculo."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Escreva 'ball' com letra maiúscula no início"
        correctAnswer: Ball
        rationale: "Para começar uma frase, 'ball' vira 'Ball' com B maiúsculo."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Escreva 'cat' com letra maiúscula no início"
        correctAnswer: Cat
        rationale: "Para começar uma frase, 'cat' vira 'Cat' com C maiúsculo."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
target: 20
