title: 🔤 English 7A - Letras S, T, U
level: 7A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.letters
authorNotes: Reconhecimento das letras S, T, U — incluindo a vogal U.
repeatAll: 2
example: "Ex.: 'S' → S is for Sun."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letras S e T
    description: Identifique as letras S e T e suas palavras-chave.
    exercises:
      - type: english_vocab
        question: Qual é a décima nona letra do alfabeto inglês?
        correctAnswer: S
        rationale: "...Q, R, S — 'S' é a décima nona letra do alfabeto."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A palavra 'Sun' começa com qual letra?"
        correctAnswer: S
        rationale: "Sun (sol) começa com a letra S. S é consoante."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'S is for ___' — qual palavra começa com S? (palavra: estrela)"
        correctAnswer: Star
        rationale: "'S is for Star' — Star significa estrela em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva a letra minúscula de 'S'
        correctAnswer: s
        rationale: "A letra maiúscula 'S' se escreve 's' em minúscula."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a vigésima letra do alfabeto inglês?
        correctAnswer: T
        rationale: "...R, S, T — 'T' é a vigésima letra do alfabeto."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A palavra 'Tree' começa com qual letra?"
        correctAnswer: T
        rationale: "Tree (árvore) começa com a letra T. T é consoante."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'T is for ___' — qual palavra começa com T? (palavra: tigre)"
        correctAnswer: Tiger
        rationale: "'T is for Tiger' — Tiger significa tigre em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Complete a sequência: R, S, ___"
        correctAnswer: T
        rationale: "Depois de S vem T. Sequência: R, S, T."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Entre R e T, qual letra está no meio?
        correctAnswer: S
        rationale: "A sequência é R, S, T. A letra S fica no meio."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual letra vem depois de T?
        correctAnswer: U
        rationale: "Depois de T vem U. U é vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
  - pageNumber: 2
    title: Letra U
    description: Reconheça a vogal U e complete S-T-U.
    exercises:
      - type: english_vocab
        question: Qual é a vigésima primeira letra do alfabeto inglês?
        correctAnswer: U
        rationale: "...S, T, U — 'U' é a vigésima primeira letra e uma vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A palavra 'Umbrella' começa com qual letra?"
        correctAnswer: U
        rationale: "Umbrella (guarda-chuva) começa com a letra U. U é vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'U is for ___' — qual palavra começa com U? (palavra: guarda-chuva)"
        correctAnswer: Umbrella
        rationale: "'U is for Umbrella' — Umbrella significa guarda-chuva em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A letra 'U' é vogal ou consoante?"
        correctAnswer: vowel
        rationale: "'U' é uma vogal (vowel). As cinco vogais são A, E, I, O, U."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Complete a sequência: S, T, ___"
        correctAnswer: U
        rationale: "Depois de T vem U. Sequência: S, T, U."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Quais são as cinco vogais do inglês?
        correctAnswer: A E I O U
        rationale: "As cinco vogais do inglês são: A, E, I, O, U."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Quantas vogais existem em S, T, U?
        correctAnswer: one
        rationale: "Entre S, T e U, apenas o U é vogal. S e T são consoantes."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva a letra minúscula de 'U'
        correctAnswer: u
        rationale: "A letra maiúscula 'U' se escreve 'u' em minúscula."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva as letras S, T, U em ordem
        correctAnswer: S T U
        rationale: "A sequência correta é S, T, U — décima nona, vigésima e vigésima primeira letras."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Agora você conhece todas as 5 vogais! Escreva-as em ordem.
        correctAnswer: A E I O U
        rationale: "As cinco vogais em ordem são: A, E, I, O, U. Parabéns!"
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
target: 20
