title: 🔤 English 7A - Letras M, N, O
level: 7A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.letters
authorNotes: Reconhecimento das letras M, N, O — incluindo a vogal O.
repeatAll: 2
example: "Ex.: 'M' → M is for Moon."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letras M e N
    description: Identifique as letras M e N e suas palavras-chave.
    exercises:
      - type: english_vocab
        question: Qual é a décima terceira letra do alfabeto inglês?
        correctAnswer: M
        rationale: "...K, L, M — 'M' é a décima terceira letra do alfabeto."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A palavra 'Moon' começa com qual letra?"
        correctAnswer: M
        rationale: "Moon (lua) começa com a letra M. M é consoante."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'M is for ___' — qual palavra começa com M? (palavra: macaco)"
        correctAnswer: Monkey
        rationale: "'M is for Monkey' — Monkey significa macaco em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva a letra minúscula de 'M'
        correctAnswer: m
        rationale: "A letra maiúscula 'M' se escreve 'm' em minúscula."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a décima quarta letra do alfabeto inglês?
        correctAnswer: N
        rationale: "...L, M, N — 'N' é a décima quarta letra do alfabeto."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A palavra 'Nose' começa com qual letra?"
        correctAnswer: N
        rationale: "Nose (nariz) começa com a letra N. N é consoante."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'N is for ___' — qual palavra começa com N? (palavra: ninho)"
        correctAnswer: Nest
        rationale: "'N is for Nest' — Nest significa ninho em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Complete a sequência: L, M, ___"
        correctAnswer: N
        rationale: "Depois de M vem N. Sequência: L, M, N."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Entre L e N, qual letra está no meio?
        correctAnswer: M
        rationale: "A sequência é L, M, N. A letra M fica no meio."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual letra vem depois de N?
        correctAnswer: O
        rationale: "Depois de N vem O. O é vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
  - pageNumber: 2
    title: Letra O
    description: Reconheça a vogal O e complete M-N-O.
    exercises:
      - type: english_vocab
        question: Qual é a décima quinta letra do alfabeto inglês?
        correctAnswer: O
        rationale: "...M, N, O — 'O' é a décima quinta letra e uma vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A palavra 'Orange' começa com qual letra?"
        correctAnswer: O
        rationale: "Orange (laranja) começa com a letra O. O é vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'O is for ___' — qual palavra começa com O? (palavra: polvo)"
        correctAnswer: Octopus
        rationale: "'O is for Octopus' — Octopus significa polvo em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A letra 'O' é vogal ou consoante?"
        correctAnswer: vowel
        rationale: "'O' é uma vogal (vowel). As vogais são A, E, I, O, U."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Complete a sequência: M, N, ___"
        correctAnswer: O
        rationale: "Depois de N vem O. Sequência: M, N, O."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Quantas vogais existem em M, N, O?
        correctAnswer: one
        rationale: "Entre M, N e O, apenas o O é vogal. M e N são consoantes."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva a letra minúscula de 'O'
        correctAnswer: o
        rationale: "A letra maiúscula 'O' se escreve 'o' em minúscula."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual animal em inglês começa com M?
        correctAnswer: Monkey
        rationale: "Monkey (macaco) é um animal que começa com a letra M."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva as letras M, N, O em ordem
        correctAnswer: M N O
        rationale: "A sequência correta é M, N, O — décima terceira, décima quarta e décima quinta letras."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Quais vogais você aprendeu até agora? (A, E, I, ___)
        correctAnswer: O
        rationale: "As vogais aprendidas até agora são A, E, I, O. Falta apenas o U."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
target: 20
