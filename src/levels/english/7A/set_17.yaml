        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a palavra em inglês para 'porco'? (tem som /ɪ/)
        correctAnswer: pig
        rationale: "'pig' (porco) tem o som /ɪ/ — 'i' curto. P-I-G."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a palavra em inglês para 'grande'? (tem som /ɪ/)
