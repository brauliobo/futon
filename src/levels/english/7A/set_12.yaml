title: 🔤 English 7A - Consoantes grupo 3 (Q R S T V W X Y Z)
level: 7A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.letters
authorNotes: Reconhecimento das consoantes finais do alfabeto Q, R, S, T, V, W, X, Y, Z.
repeatAll: 2
example: "Ex.: 'R' → R is for Rain (consoante)."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Consoantes Q, R, S, T
    description: Reconheça as consoantes Q, R, S e T.
    exercises:
      - type: english_vocab
        question: A palavra-chave da consoante Q é ___ (pessoa nobre, mulher)
        correctAnswer: Queen
        rationale: "'Q is for Queen' — Queen (rainha) começa com a consoante Q."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Em inglês, a letra Q é sempre seguida de qual letra?
        correctAnswer: U
        rationale: "Em inglês, Q é seguido de U: Queen, Quick, Quiet. O QU faz som /kw/."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra-chave da consoante R é ___ (precipitação de água)
        correctAnswer: Rain
        rationale: "'R is for Rain' — Rain (chuva) começa com a consoante R."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual som faz a letra R? (R de Rain)
        correctAnswer: r
        rationale: "Em inglês, R faz um som mais suave que o R português — como em Rain, Run, Red."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra-chave da consoante S é ___ (estrela do sistema solar)
        correctAnswer: Sun
        rationale: "'S is for Sun' — Sun (sol) começa com a consoante S."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra-chave da consoante T é ___ (planta alta da floresta)
        correctAnswer: Tree
        rationale: "'T is for Tree' — Tree (árvore) começa com a consoante T."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual som faz a letra S? (S de Sun)
        correctAnswer: s
        rationale: "A letra S faz o som /s/ — como em Sun (sol) e Sit (sentar)."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Q, R, S e T são vogais ou consoantes?
        correctAnswer: consonants
        rationale: "Q, R, S e T são todas consoantes (consonants). Nenhuma é vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Qual a letra de: 'chuva' em inglês começa com ___?"
        correctAnswer: R
        rationale: "Rain (chuva) começa com R. R é a décima oitava letra do alfabeto."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva as consoantes Q, R, S, T em ordem
        correctAnswer: Q R S T
        rationale: "As consoantes Q, R, S, T — décima sétima a vigésima letras do alfabeto."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
  - pageNumber: 2
    title: Consoantes V, W, X, Y, Z
    description: As últimas consoantes do alfabeto inglês.
    exercises:
      - type: english_vocab
        question: A palavra-chave da consoante V é ___ (instrumento de cordas)
        correctAnswer: Violin
        rationale: "'V is for Violin' — Violin (violino) começa com a consoante V."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra-chave da consoante W é ___ (animal marinho gigante)
        correctAnswer: Whale
        rationale: "'W is for Whale' — Whale (baleia) começa com a consoante W."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual som faz a letra W? (W de Water)
        correctAnswer: w
        rationale: "A letra W faz o som /w/ — como 'u' antes de vogal em Water, Win, Wet."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra-chave da consoante X é ___ (instrumento musical)
        correctAnswer: Xylophone
        rationale: "'X is for Xylophone' — Xylophone (xilofone) começa com a consoante X."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra-chave da consoante Y é ___ (cor do sol)
        correctAnswer: Yellow
        rationale: "'Y is for Yellow' — Yellow (amarelo) começa com a consoante Y."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra-chave da consoante Z é ___ (animal listrado preto e branco)
        correctAnswer: Zebra
        rationale: "'Z is for Zebra' — Zebra começa com a consoante Z."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: V, W, X, Y, Z são vogais ou consoantes?
        correctAnswer: consonants
        rationale: "V, W, X, Y, Z são consoantes. Y às vezes age como vogal, mas geralmente é consoante."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Quantas consoantes você aprendeu nesta lição? (Q, R, S, T, V, W, X, Y, Z)
        correctAnswer: nine
        rationale: "Você aprendeu 9 (nine) consoantes nesta lição: Q, R, S, T, V, W, X, Y, Z."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva as últimas três consoantes do alfabeto em ordem
        correctAnswer: X Y Z
        rationale: "As três últimas letras do alfabeto são X, Y, Z."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a última consoante (e última letra) do alfabeto inglês?
        correctAnswer: Z
        rationale: "Z é a última letra — e última consoante — do alfabeto inglês."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
target: 20
