title: 🔤 English 7A - Letras G, H, I
level: 7A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.letters
authorNotes: Reconhecimento das letras G, H, I — incluindo a vogal I.
repeatAll: 2
example: "Ex.: 'G' → G is for Goat."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letras G e H
    description: Identifique as letras G e H e suas palavras-chave.
    exercises:
      - type: english_vocab
        question: Qual é a sétima letra do alfabeto inglês?
        correctAnswer: G
        rationale: "A, B, C, D, E, F, G — 'G' é a sétima letra."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A palavra 'Goat' começa com qual letra?"
        correctAnswer: G
        rationale: "Goat (cabra) começa com a letra G. G é consoante."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'G is for ___' — qual palavra começa com G? (palavra: uva)"
        correctAnswer: Grape
        rationale: "'G is for Grape' — Grape significa uva em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva a letra minúscula de 'G'
        correctAnswer: g
        rationale: "A letra maiúscula 'G' se escreve 'g' em minúscula."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a oitava letra do alfabeto inglês?
        correctAnswer: H
        rationale: "A, B, C, D, E, F, G, H — 'H' é a oitava letra."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A palavra 'Hat' começa com qual letra?"
        correctAnswer: H
        rationale: "Hat (chapéu) começa com a letra H. H é consoante."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'H is for ___' — qual palavra começa com H? (palavra: chapéu)"
        correctAnswer: Hat
        rationale: "'H is for Hat' — Hat significa chapéu em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Complete a sequência: F, G, ___"
        correctAnswer: H
        rationale: "Depois de G vem H. Sequência: F, G, H."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual letra vem depois de H?
        correctAnswer: I
        rationale: "Depois de H vem I. I é vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Entre G e I, qual letra está no meio?
        correctAnswer: H
        rationale: "A sequência é G, H, I. A letra H fica no meio."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
  - pageNumber: 2
    title: Letra I
    description: Reconheça a vogal I e complete G-H-I.
    exercises:
      - type: english_vocab
        question: Qual é a nona letra do alfabeto inglês?
        correctAnswer: I
        rationale: "A, B, C, D, E, F, G, H, I — 'I' é a nona letra e uma vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A palavra 'Igloo' começa com qual letra?"
        correctAnswer: I
        rationale: "Igloo (iglu) começa com a letra I. I é vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "'I is for ___' — qual palavra começa com I? (palavra: iglu)"
        correctAnswer: Igloo
        rationale: "'I is for Igloo' — Igloo significa iglu em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "A letra 'I' é vogal ou consoante?"
        correctAnswer: vowel
        rationale: "'I' é uma vogal (vowel). As vogais são A, E, I, O, U."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Quantas vogais existem em G, H, I?
        correctAnswer: one
        rationale: "Entre G, H e I, apenas o I é vogal. G e H são consoantes."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: "Complete a sequência: G, H, ___"
        correctAnswer: I
        rationale: "Depois de H vem I. Sequência: G, H, I."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva a letra minúscula de 'I'
        correctAnswer: i
        rationale: "A letra maiúscula 'I' se escreve 'i' em minúscula."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Quais são as vogais que você já aprendeu? (A, ___, I)
        correctAnswer: E
        rationale: "As vogais aprendidas até agora são A, E, I. As próximas são O e U."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva as letras G, H, I em ordem
        correctAnswer: G H I
        rationale: "A sequência correta é G, H, I — sétima, oitava e nona letras do alfabeto."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual palavra em inglês começa com H e é uma peça de roupa?
        correctAnswer: Hat
        rationale: "Hat (chapéu) é uma peça de roupa que começa com a letra H."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
target: 20
