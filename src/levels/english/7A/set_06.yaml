title: 🔤 English 7A - Letras P, Q, R
level: 7A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.letters
authorNotes: Reconhecimento das letras P, Q, R do alfabeto inglês.
repeatAll: 2
example: "Ex.: 'P' → P is for Pig."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letras P e Q
    description: Identifique as letras P e Q e suas palavras-chave.
    exercises:
      - type: english_vocab
        question: Qual é a décima sexta letra do alfabeto inglês?
        correctAnswer: P
        rationale: "...N, O, P — 'P' é a décima sexta letra do alfabeto."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra 'Pig' começa com qual letra?
        correctAnswer: P
        rationale: "Pig (porco) começa com a letra P. P é consoante."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: 'P is for ___' — qual palavra começa com P? (palavra: pinguim)
        correctAnswer: Penguin
        rationale: "'P is for Penguin' — Penguin significa pinguim em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva a letra minúscula de 'P'
        correctAnswer: p
        rationale: "A letra maiúscula 'P' se escreve 'p' em minúscula."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a décima sétima letra do alfabeto inglês?
        correctAnswer: Q
        rationale: "...O, P, Q — 'Q' é a décima sétima letra do alfabeto."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra 'Queen' começa com qual letra?
        correctAnswer: Q
        rationale: "Queen (rainha) começa com a letra Q. Em inglês, Q é sempre seguido de U."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: 'Q is for ___' — qual palavra começa com Q? (palavra: rainha)
        correctAnswer: Queen
        rationale: "'Q is for Queen' — Queen significa rainha em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Complete a sequência: O, P, ___
        correctAnswer: Q
        rationale: "Depois de P vem Q. Sequência: O, P, Q."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Entre O e Q, qual letra está no meio?
        correctAnswer: P
        rationale: "A sequência é O, P, Q. A letra P fica no meio."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual letra vem depois de Q?
        correctAnswer: R
        rationale: "Depois de Q vem R. Sequência: ...Q, R, S..."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
  - pageNumber: 2
    title: Letra R
    description: Reconheça a letra R e complete P-Q-R.
    exercises:
      - type: english_vocab
        question: Qual é a décima oitava letra do alfabeto inglês?
        correctAnswer: R
        rationale: "...P, Q, R — 'R' é a décima oitava letra do alfabeto."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra 'Rain' começa com qual letra?
        correctAnswer: R
        rationale: "Rain (chuva) começa com a letra R. R é consoante."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: 'R is for ___' — qual palavra começa com R? (palavra: arco-íris)
        correctAnswer: Rainbow
        rationale: "'R is for Rainbow' — Rainbow significa arco-íris em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva a letra minúscula de 'R'
        correctAnswer: r
        rationale: "A letra maiúscula 'R' se escreve 'r' em minúscula."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Complete a sequência: P, Q, ___
        correctAnswer: R
        rationale: "Depois de Q vem R. Sequência: P, Q, R."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: P, Q e R são vogais ou consoantes?
        correctAnswer: consonants
        rationale: "P, Q e R são todas consoantes (consonants). Nenhuma é vogal."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual animal em inglês começa com P?
        correctAnswer: Pig
        rationale: "Pig (porco) é um animal que começa com a letra P."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Em inglês, a letra Q é sempre seguida de qual letra?
        correctAnswer: U
        rationale: "Em inglês, Q é quase sempre seguido de U, formando o som 'kw' (queen, quick)."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva as letras P, Q, R em ordem
        correctAnswer: P Q R
        rationale: "A sequência correta é P, Q, R — décima sexta, décima sétima e décima oitava letras."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a primeira letra de 'Run' (correr)?
        correctAnswer: R
        rationale: "Run (correr) começa com a letra R. R é consoante."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
target: 20
