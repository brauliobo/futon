title: 🔤 English 7A - Letras V, W, X, Y, Z
level: 7A
subject: english
difficulty: 1
objectives:
  - pre-A1.phonics.letters
authorNotes: As últimas cinco letras do alfabeto inglês.
repeatAll: 2
example: "Ex.: 'V' → V is for Van."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letras V, W e X
    description: Identifique as letras V, W e X e suas palavras-chave.
    exercises:
      - type: english_vocab
        question: A palavra 'Van' começa com qual letra?
        correctAnswer: V
        rationale: "Van (van/furgão) começa com a letra V. V é consoante."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: 'V is for ___' — qual palavra começa com V? (palavra: violino)
        correctAnswer: Violin
        rationale: "'V is for Violin' — Violin significa violino em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Complete a sequência: T, U, ___
        correctAnswer: V
        rationale: "Depois de U vem V. Sequência: T, U, V."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra 'Water' começa com qual letra?
        correctAnswer: W
        rationale: "Water (água) começa com a letra W. W soa como 'u' antes de vogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: 'W is for ___' — qual palavra começa com W? (palavra: baleia)
        correctAnswer: Whale
        rationale: "'W is for Whale' — Whale significa baleia em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Complete a sequência: U, V, ___
        correctAnswer: W
        rationale: "Depois de V vem W. Sequência: U, V, W."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra 'X-ray' começa com qual letra?
        correctAnswer: X
        rationale: "X-ray (raio-x) começa com a letra X. X soa como 'ks'."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: 'X is for ___' — qual palavra começa com X? (palavra: xilofone)
        correctAnswer: Xylophone
        rationale: "'X is for Xylophone' — Xylophone significa xilofone em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Complete a sequência: V, W, ___
        correctAnswer: X
        rationale: "Depois de W vem X. Sequência: V, W, X."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Entre V e X, qual letra está no meio?
        correctAnswer: W
        rationale: "A sequência é V, W, X. A letra W fica no meio."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
  - pageNumber: 2
    title: Letras Y e Z
    description: As últimas letras do alfabeto inglês.
    exercises:
      - type: english_vocab
        question: A palavra 'Yellow' começa com qual letra?
        correctAnswer: Y
        rationale: "Yellow (amarelo) começa com a letra Y. Y pode ser consoante ou semivogal."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: 'Y is for ___' — qual palavra começa com Y? (palavra: iogurte)
        correctAnswer: Yogurt
        rationale: "'Y is for Yogurt' — Yogurt significa iogurte em inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Complete a sequência: W, X, ___
        correctAnswer: Y
        rationale: "Depois de X vem Y. Sequência: W, X, Y."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Qual é a última letra do alfabeto inglês?
        correctAnswer: Z
        rationale: "Z é a vigésima sexta e última letra do alfabeto inglês."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: A palavra 'Zebra' começa com qual letra?
        correctAnswer: Z
        rationale: "Zebra começa com a letra Z. Z soa como 'z' (zumbido)."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: 'Z is for ___' — qual palavra começa com Z? (palavra: zebra)
        correctAnswer: Zebra
        rationale: "'Z is for Zebra' — Zebra é a mesma palavra em inglês e português!"
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Complete a sequência: X, Y, ___
        correctAnswer: Z
        rationale: "Depois de Y vem Z. Z é a última letra: X, Y, Z."
        difficulty: 1
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Quantas letras tem o alfabeto inglês no total?
        correctAnswer: twenty-six
        rationale: "O alfabeto inglês tem 26 (twenty-six) letras: de A a Z."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: Escreva as três últimas letras do alfabeto em ordem
        correctAnswer: X Y Z
        rationale: "As três últimas letras são X, Y, Z — vigésima quarta, vigésima quinta e vigésima sexta."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
      - type: english_vocab
        question: V, W, X, Y, Z são vogais ou consoantes?
        correctAnswer: consonants
        rationale: "V, W, X, Y e Z são consoantes (consonants). Y às vezes funciona como vogal."
        difficulty: 2
        objectives: [pre-A1.phonics.letters]
target: 20
