title: English B - Yes/No Questions
level: B
subject: english
difficulty: 2
objectives: [A1.grammar.questions]
authorNotes: Yes/No questions with 'to be' and 'do/does'. Word order inversion with 'to be'; auxiliary fronting with 'do/does'.
repeatAll: 2
example: "Você é brasileiro? → Are you Brazilian?"
pages:
  - pageNumber: 1
    title: Questions with 'to be'
    description: Move the verb before the subject.
    exercises:
      - { type: english_phrases, question: "Você é brasileiro?", correctAnswer: are you brazilian }
      - { type: english_phrases, question: "Ela é sua professora?", correctAnswer: is she your teacher }
      - { type: english_phrases, question: "Eles estão em casa?", correctAnswer: are they at home }
      - { type: english_phrases, question: "Eu estou atrasado?", correctAnswer: am i late }
      - { type: english_phrases, question: "Ele é alto?", correctAnswer: is he tall }
      - { type: english_phrases, question: "Vocês estão prontos?", correctAnswer: are you ready }
      - { type: english_phrases, question: "Isso está correto?", correctAnswer: is this correct }
      - { type: english_phrases, question: "O café está quente?", correctAnswer: is the coffee hot }
      - { type: english_phrases, question: "Nós estamos certos?", correctAnswer: are we right }
      - { type: english_phrases, question: "O livro é interessante?", correctAnswer: is the book interesting }
  - pageNumber: 2
    title: Questions with 'do / does'
    description: Start with 'Do' or 'Does' before the subject; use the base verb.
    exercises:
      - { type: english_phrases, question: "Você fala inglês?", correctAnswer: do you speak english }
      - { type: english_phrases, question: "Ele mora aqui?", correctAnswer: does he live here }
      - { type: english_phrases, question: "Ela gosta de música?", correctAnswer: does she like music }
      - { type: english_phrases, question: "Vocês trabalham juntos?", correctAnswer: do you work together }
      - { type: english_phrases, question: "Eles estudam inglês?", correctAnswer: do they study english }
      - { type: english_phrases, question: "Você tem um carro?", correctAnswer: do you have a car }
      - { type: english_phrases, question: "Ele entende português?", correctAnswer: does he understand portuguese }
      - { type: english_phrases, question: "Eu preciso de ajuda?", correctAnswer: do i need help }
      - { type: english_phrases, question: "Ela quer café?", correctAnswer: does she want coffee }
      - { type: english_phrases, question: "Nós começamos agora?", correctAnswer: do we start now }
target: 20
