title: English B - Yes/No Questions
level: B
subject: english
difficulty: 2
objectives:
  - A1.grammar.questions
authorNotes: Yes/No questions with 'to be' and 'do/does'. Word order inversion with 'to be'; auxiliary fronting with 'do/does'.
repeatAll: 2
example: Você é brasileiro? → Are you Brazilian?
pages:
  - pageNumber: 1
    title: Questions with 'to be'
    description: Move the verb before the subject.
    exercises:
      - type: english_phrases
        question: Você é brasileiro?
        correctAnswer: are you brazilian
        rationale: "Com \"to be\", inverte-se o verbo com o sujeito. Nacionalidades sempre maiúsculas."
      - type: english_phrases
        question: Ela é sua professora?
        correctAnswer: is she your teacher
        rationale: "\"Is\" (3ª pessoa singular) vem primeiro. Possessivo \"your\" antes do substantivo."
      - type: english_phrases
        question: Eles estão em casa?
        correctAnswer: are they at home
        rationale: "Inversão \"are they\" + expressão fixa \"at home\". Plural \"they\" exige \"are\"."
      - type: english_phrases
        question: Eu estou atrasado?
        correctAnswer: am i late
        rationale: "\"Am\" só para 1ª pessoa. Inversão — \"am I\" (única vez que \"I\" não é inicial)."
      - type: english_phrases
        question: Ele é alto?
        correctAnswer: is he tall
        rationale: "\"Is he\" + adjetivo sem artigo. \"Tall\" — adjetivo invariável."
      - type: english_phrases
        question: Vocês estão prontos?
        correctAnswer: are you ready
        rationale: "\"You\" serve para singular e plural — sempre com \"are\". \"Ready\" sem artigo."
      - type: english_phrases
        question: Isso está correto?
        correctAnswer: is this correct
        rationale: "\"This\" (isto, próximo). Inversão com \"is\". \"Correct\" — cognato português."
      - type: english_phrases
        question: O café está quente?
        correctAnswer: is the coffee hot
        rationale: "\"Coffee\" com artigo definido (\"the\") — café específico. Ordem — is + sujeito + adjetivo."
      - type: english_phrases
        question: Nós estamos certos?
        correctAnswer: are we right
        rationale: "\"Are we\" — inversão com \"we\". \"Right\" aqui = certo/correto."
      - type: english_phrases
        question: O livro é interessante?
        correctAnswer: is the book interesting
        rationale: "\"Interesting\" tem 4 sílabas — tônica no \"IN\". Adjetivo com terminação \"-ing\"."
  - pageNumber: 2
    title: Questions with 'do / does'
    description: Start with 'Do' or 'Does' before the subject; use the base verb.
    exercises:
      - type: english_phrases
        question: Você fala inglês?
        correctAnswer: do you speak english
        rationale: "Verbo comum exige auxiliar \"do\". Estrutura — do + sujeito + verbo base."
      - type: english_phrases
        question: Ele mora aqui?
        correctAnswer: does he live here
        rationale: "3ª pessoa singular → \"does\". Verbo \"live\" fica base (não \"lives\")."
      - type: english_phrases
        question: Ela gosta de música?
        correctAnswer: does she like music
        rationale: "\"Like\" é transitivo direto — sem preposição. \"Music\" é incontável, sem artigo."
      - type: english_phrases
        question: Vocês trabalham juntos?
        correctAnswer: do you work together
        rationale: "\"Together\" é advérbio — vai no fim. \"You\" (singular/plural) sempre com \"do\"."
      - type: english_phrases
        question: Eles estudam inglês?
        correctAnswer: do they study english
        rationale: "\"They\" + \"do\". Idioma sempre maiúsculo (\"English\")."
      - type: english_phrases
        question: Você tem um carro?
        correctAnswer: do you have a car
        rationale: "\"Have\" em pergunta — usa \"do\" como auxiliar. Cuidado — \"have you a car\" é arcaico."
      - type: english_phrases
        question: Ele entende português?
        correctAnswer: does he understand portuguese
        rationale: "\"Understand\" é verbo comum — exige \"does\". Idioma maiúsculo."
      - type: english_phrases
        question: Eu preciso de ajuda?
        correctAnswer: do i need help
        rationale: "\"Need\" sem \"de\" — \"need help\" direto. Auxiliar \"do\" na pergunta."
      - type: english_phrases
        question: Ela quer café?
        correctAnswer: does she want coffee
        rationale: "\"Want\" é verbo comum — \"does\" na 3ª pessoa. \"Coffee\" genérico — sem artigo."
      - type: english_phrases
        question: Nós começamos agora?
        correctAnswer: do we start now
        rationale: "\"Start now\" — advérbio de tempo no final. \"We\" com \"do\" (não \"does\")."
target: 20
