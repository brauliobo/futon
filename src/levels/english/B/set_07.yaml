title: English B - Conversations
level: B
subject: english
difficulty: 1
objectives:
  - A1.grammar.to_be_have
repeatAll: 2
example: Common conversation exchanges.
pages:
  - pageNumber: 1
    title: Introducing Yourself
    description: Translate common introductions.
    exercises:
      - type: english_phrases
        question: Meu nome é Ana
        correctAnswer: my name is ana
        rationale: "Inglês informal — \"I'm Ana\" é mais comum. \"My name is\" é levemente formal."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu sou do Brasil
        correctAnswer: i am from brazil
        rationale: "Origem pede preposição \"from\" — \"I am from Brazil\". Países são sempre maiúsculos."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu moro em São Paulo
        correctAnswer: i live in são paulo
        rationale: "\"Live in\" + cidade/país. Para endereço exato — \"live at\" (at 10 Main Street)."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Prazer em conhecê-lo
        correctAnswer: nice to meet you
        rationale: "Expressão fixa — literal \"bom conhecer você\". Usado no primeiro encontro."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu tenho 10 anos
        correctAnswer: i am 10 years old
        rationale: "Idade com \"to be\" — \"I am 10\". Nunca \"I have 10 years\" (erro comum)."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu sou estudante
        correctAnswer: i am a student
        rationale: "Profissão/status sempre com artigo \"a\" — \"I am a student\", não \"I am student\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu estudo inglês
        correctAnswer: i study english
        rationale: "\"Study\" é verbo transitivo direto — sem preposição. Idioma sempre maiúsculo."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu gosto de ler
        correctAnswer: i like to read
        rationale: "\"Like to\" + infinitivo OU \"like\" + verbo-ing. Ambos corretos — aqui — \"to read\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Minha cor favorita é azul
        correctAnswer: my favorite color is blue
        rationale: "\"Favorite\" (AmE) ou \"favourite\" (BrE). Possessivo \"my\" não leva artigo."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu tenho uma família grande
        correctAnswer: i have a big family
        rationale: "Adjetivo antes do substantivo — \"big family\" (não \"family big\" como em PT)."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
  - pageNumber: 2
    title: Asking for Help
    description: Translate help-asking phrases.
    exercises:
      - type: english_phrases
        question: Você pode me ajudar?
        correctAnswer: can you help me
        rationale: "Modal \"can\" + sujeito + verbo base. \"Me\" é pronome objeto (não \"I\" aqui)."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Pode repetir, por favor?
        correctAnswer: can you repeat please
        rationale: "\"Please\" no fim é mais educado. Forma mais formal — \"could you repeat, please\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu não entendo
        correctAnswer: i do not understand
        rationale: "\"Understand\" não tem contração no positivo. Negativa — \"don't understand\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Como se diz em inglês?
        correctAnswer: how do you say in english
        rationale: "Inglês não tem partícula \"se\" — usa-se sujeito genérico \"you\". Wh-word + auxiliar."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: O que significa isto?
        correctAnswer: what does this mean
        rationale: "Terceira pessoa (\"this\") exige \"does\". Verbo \"mean\" fica na forma base."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Fale mais devagar, por favor
        correctAnswer: speak slower please
        rationale: "Imperativo começa com verbo — \"speak\". Comparativo \"slower\" = mais devagar."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Onde fica o banheiro?
        correctAnswer: where is the bathroom
        rationale: "\"Bathroom\" (casa) ou \"restroom\" (público). Cuidado — \"toilet\" é o vaso em AmE."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu preciso de ajuda
        correctAnswer: i need help
        rationale: "\"Need\" não pede preposição — \"need help\" (sem \"of\"). \"Help\" é incontável."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Estou perdido
        correctAnswer: i am lost
        rationale: "\"Lost\" é particípio de \"lose\" usado como adjetivo. Sempre com \"to be\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Você fala português?
        correctAnswer: do you speak portuguese
        rationale: "\"Do you speak\" + idioma (maiúsculo). Pergunta comum ao conhecer alguém."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
target: 20
