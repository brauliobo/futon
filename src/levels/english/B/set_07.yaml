title: English B - Conversations
level: B
subject: english
repeatAll: 2
example: "Common conversation exchanges."
pages:
  - pageNumber: 1
    title: Introducing Yourself
    description: Translate common introductions.
    exercises:
      - { type: english_phrases, question: "Meu nome é Ana", correctAnswer: my name is ana }
      - { type: english_phrases, question: "Eu sou do Brasil", correctAnswer: i am from brazil }
      - { type: english_phrases, question: "Eu moro em São Paulo", correctAnswer: i live in são paulo }
      - { type: english_phrases, question: "Prazer em conhecê-lo", correctAnswer: nice to meet you }
      - { type: english_phrases, question: "Eu tenho 10 anos", correctAnswer: i am 10 years old }
      - { type: english_phrases, question: "Eu sou estudante", correctAnswer: i am a student }
      - { type: english_phrases, question: "Eu estudo inglês", correctAnswer: i study english }
      - { type: english_phrases, question: "Eu gosto de ler", correctAnswer: i like to read }
      - { type: english_phrases, question: "Minha cor favorita é azul", correctAnswer: my favorite color is blue }
      - { type: english_phrases, question: "Eu tenho uma família grande", correctAnswer: i have a big family }
  - pageNumber: 2
    title: Asking for Help
    description: Translate help-asking phrases.
    exercises:
      - { type: english_phrases, question: "Você pode me ajudar?", correctAnswer: can you help me }
      - { type: english_phrases, question: "Pode repetir, por favor?", correctAnswer: can you repeat please }
      - { type: english_phrases, question: "Eu não entendo", correctAnswer: i do not understand }
      - { type: english_phrases, question: "Como se diz em inglês?", correctAnswer: how do you say in english }
      - { type: english_phrases, question: "O que significa isto?", correctAnswer: what does this mean }
      - { type: english_phrases, question: "Fale mais devagar, por favor", correctAnswer: speak slower please }
      - { type: english_phrases, question: "Onde fica o banheiro?", correctAnswer: where is the bathroom }
      - { type: english_phrases, question: "Eu preciso de ajuda", correctAnswer: i need help }
      - { type: english_phrases, question: "Estou perdido", correctAnswer: i am lost }
      - { type: english_phrases, question: "Você fala português?", correctAnswer: do you speak portuguese }
target: 20
