title: 📅 English B - There is / There are
level: B
subject: english
difficulty: 1
objectives:
  - A1.grammar.there_is_are
authorNotes: "There is (singular/incontável) vs there are (plural). Negativa e pergunta com inversão."
repeatAll: 2
example: "Complete the sentence. Ex.: Há um gato → There is a cat."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: There is — Singular
    description: Translate the sentence using "there is".
    exercises:
      - type: english_phrases
        question: Há um gato na sala
        correctAnswer: There is a cat in the room
        rationale: "'There is' para singular. 'A cat' — artigo indefinido. 'In the room' — local."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há um livro na mesa
        correctAnswer: There is a book on the table
        rationale: "'On the table' — sobre a superfície da mesa. 'In' seria dentro."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há uma maçã na cozinha
        correctAnswer: There is an apple in the kitchen
        rationale: "'An apple' — artigo 'an' antes de vogal. 'An apple', não 'a apple'."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há uma escola aqui
        correctAnswer: There is a school here
        rationale: "'Here' = aqui. Posição no final da frase."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Não há um cão aqui
        correctAnswer: There is no dog here
        rationale: "'There is no' + substantivo. Alternativa — 'There is not a dog here'."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há água na garrafa?
        correctAnswer: Is there water in the bottle
        rationale: "Pergunta — inverter 'is' e 'there'. 'Water' incontável — sem artigo."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há um parque perto daqui
        correctAnswer: There is a park near here
        rationale: "'Near here' = perto daqui. 'Near' é preposição/adjetivo."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há um problema
        correctAnswer: There is a problem
        rationale: "Cognato 'problem'. Frase comum e muito útil no dia a dia."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há um menino no jardim
        correctAnswer: There is a boy in the garden
        rationale: "'In the garden' — dentro do espaço do jardim."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há um banco na rua
        correctAnswer: There is a bank on the street
        rationale: "'On the street' — endereços e ruas usam 'on' em inglês."
        difficulty: 1
        objectives: [A1.grammar.there_is_are]
  - pageNumber: 2
    title: There are — Plural
    description: Translate the sentence using "there are".
    exercises:
      - type: english_phrases
        question: Há dois gatos no sofá
        correctAnswer: There are two cats on the sofa
        rationale: "'There are' para plural. 'Two cats' — numeral + substantivo plural."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há muitas crianças no parque
        correctAnswer: There are many children in the park
        rationale: "'Many' para plural contável. 'Children' é plural irregular de 'child'."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há livros na mochila
        correctAnswer: There are books in the bag
        rationale: "'Books' — plural com 's'. 'In the bag' — dentro da mochila."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Não há cadeiras aqui
        correctAnswer: There are no chairs here
        rationale: "'There are no' + plural. Alternativa — 'There are not any chairs here'."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há estudantes na sala?
        correctAnswer: Are there students in the room
        rationale: "Pergunta plural — 'Are there' (invertido). 'Students' sem artigo (plural geral)."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há três janelas no quarto
        correctAnswer: There are three windows in the bedroom
        rationale: "'Three windows' — número + plural. 'In the bedroom'."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há muitas flores no jardim
        correctAnswer: There are many flowers in the garden
        rationale: "'Many flowers' — contável plural. 'Much' seria para incontável."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há cinco meninos na turma
        correctAnswer: There are five boys in the class
        rationale: "'In the class' — dentro do contexto da turma/aula."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há algumas cadeiras na sala
        correctAnswer: There are some chairs in the room
        rationale: "'Some' = algumas/alguns. Usado em frases afirmativas com plural."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
      - type: english_phrases
        question: Há muitos carros na rua
        correctAnswer: There are many cars on the street
        rationale: "'Many cars' — contável plural. 'On the street' — em endereços/ruas."
        difficulty: 2
        objectives: [A1.grammar.there_is_are]
target: 20
