title: 🔢 English B - How many / How much?
level: B
subject: english
difficulty: 1
objectives:
  - A1.grammar.quantity
authorNotes: "'How many' para contáveis, 'how much' para incontáveis. Erro clássico de aprendizes."
repeatAll: 2
example: "Translate the question. Ex.: Quantos gatos? → How many cats?"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: How many — Countable Nouns
    description: Translate using "how many" for countable nouns.
    exercises:
      - type: english_phrases
        question: Quantos gatos você tem?
        correctAnswer: How many cats do you have
        rationale: "'How many' + plural contável + 'do you have'. 'Cats' — plural com 's'."
        difficulty: 1
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quantos irmãos você tem?
        correctAnswer: How many brothers do you have
        rationale: "'Brothers' — plural. 'Do you have' — presente simples interrogativo."
        difficulty: 1
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quantas maçãs há?
        correctAnswer: How many apples are there
        rationale: "'Are there' — existência. 'Apples' plural contável com 'how many'."
        difficulty: 1
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quantos alunos estão na sala?
        correctAnswer: How many students are in the room
        rationale: "'Students' plural. 'Are in the room' — localização no presente."
        difficulty: 1
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quantas cadeiras há na sala?
        correctAnswer: How many chairs are there in the room
        rationale: "'Are there' para existência. 'Chairs' — contável plural."
        difficulty: 1
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quantas pessoas estão aqui?
        correctAnswer: How many people are here
        rationale: "'People' é plural de 'person'. Sem 's' — já é plural. 'Are here'."
        difficulty: 1
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quantos livros você tem?
        correctAnswer: How many books do you have
        rationale: "'Books' plural contável. 'Do you have' — auxiliar para presente simples."
        difficulty: 1
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quantas janelas há no quarto?
        correctAnswer: How many windows are there in the bedroom
        rationale: "'Windows' plural. 'Are there' — existência. 'In the bedroom' — local."
        difficulty: 1
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quantas línguas você fala?
        correctAnswer: How many languages do you speak
        rationale: "'Languages' plural. 'Do you speak' — presente simples interrogativo."
        difficulty: 1
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quantos anos você tem?
        correctAnswer: How many years old are you
        rationale: "'How many years old' — forma completa, porém 'How old' é mais natural."
        difficulty: 1
        objectives: [A1.grammar.quantity]
  - pageNumber: 2
    title: How much — Uncountable Nouns
    description: Translate using "how much" for uncountable nouns.
    exercises:
      - type: english_phrases
        question: Quanto leite você quer?
        correctAnswer: How much milk do you want
        rationale: "'How much' + incontável. 'Milk' — líquido, sem plural."
        difficulty: 2
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quanta água há?
        correctAnswer: How much water is there
        rationale: "'Water' incontável. 'Is there' — existência no singular."
        difficulty: 2
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quanto dinheiro você tem?
        correctAnswer: How much money do you have
        rationale: "'Money' é incontável em inglês — nunca 'moneys'. 'How much money'."
        difficulty: 2
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quanto açúcar você quer?
        correctAnswer: How much sugar do you want
        rationale: "'Sugar' incontável. 'How much sugar' — típico de café/culinária."
        difficulty: 2
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quanta comida há?
        correctAnswer: How much food is there
        rationale: "'Food' incontável em inglês. 'Is there' — singular para incontável."
        difficulty: 2
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quanto tempo você tem?
        correctAnswer: How much time do you have
        rationale: "'Time' incontável aqui (não 'how many times', que seria 'quantas vezes')."
        difficulty: 2
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quanta energia você tem?
        correctAnswer: How much energy do you have
        rationale: "Cognato 'energy'. 'How much energy' — incontável abstrato."
        difficulty: 2
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quanto pão há na mesa?
        correctAnswer: How much bread is there on the table
        rationale: "'Bread' incontável. 'On the table' — superfície. 'Is there'."
        difficulty: 2
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quanta ajuda você precisa?
        correctAnswer: How much help do you need
        rationale: "'Help' incontável. 'Do you need' — presente simples interrogativo."
        difficulty: 2
        objectives: [A1.grammar.quantity]
      - type: english_phrases
        question: Quanto trabalho você tem?
        correctAnswer: How much work do you have
        rationale: "'Work' incontável (o trabalho em geral). 'A work' seria uma obra de arte."
        difficulty: 2
        objectives: [A1.grammar.quantity]
target: 20
