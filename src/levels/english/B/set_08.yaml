title: English B - Negatives
level: B
subject: english
difficulty: 2
objectives:
  - A1.grammar.negation
authorNotes: Negations with 'to be' and 'do/does' for present simple. Focus on subject-verb agreement.
repeatAll: 2
example: Eu não sou professor → I am not a teacher
pages:
  - pageNumber: 1
    title: Negatives with 'to be'
    description: Translate negative sentences using 'am not / is not / are not'.
    exercises:
      - type: english_phrases
        question: Eu não sou professor
        correctAnswer: i am not a teacher
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele não é alto
        correctAnswer: he is not tall
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não está cansada
        correctAnswer: she is not tired
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós não somos amigos
        correctAnswer: we are not friends
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles não estão em casa
        correctAnswer: they are not at home
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Não estou com fome
        correctAnswer: i am not hungry
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você não está certo
        correctAnswer: you are not right
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Isso não é meu
        correctAnswer: this is not mine
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não é minha irmã
        correctAnswer: she is not my sister
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Não somos do Brasil
        correctAnswer: we are not from brazil
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Negatives with 'do / does'
    description: Use 'do not / does not' before the base verb.
    exercises:
      - type: english_phrases
        question: Eu não gosto de café
        correctAnswer: i do not like coffee
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele não fala inglês
        correctAnswer: he does not speak english
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não mora aqui
        correctAnswer: she does not live here
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós não comemos carne
        correctAnswer: we do not eat meat
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles não estudam à noite
        correctAnswer: they do not study at night
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você não sabe a resposta
        correctAnswer: you do not know the answer
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele não trabalha aos sábados
        correctAnswer: he does not work on saturdays
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu não quero ir
        correctAnswer: i do not want to go
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não entende
        correctAnswer: she does not understand
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós não temos tempo
        correctAnswer: we do not have time
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
