title: 🕐 English B - Telling the Time
level: B
subject: english
difficulty: 1
objectives:
  - A1.grammar.time
authorNotes: "Horas em inglês: o'clock, half past, quarter past/to. AmE também usa forma digital (three fifteen)."
repeatAll: 2
example: "Translate the time. Ex.: São três horas → It's three o'clock."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: O'clock and Half Past
    description: Say the time in English.
    exercises:
      - type: english_phrases
        question: São duas horas
        correctAnswer: It's two o'clock
        rationale: "'O'clock' marca horas exatas. 'It's' — 'it is' contraído. Hora cheia."
        difficulty: 1
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São seis horas
        correctAnswer: It's six o'clock
        rationale: "'Six o'clock' — hora exata. 'O'clock' vem de 'of the clock'."
        difficulty: 1
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São duas e meia
        correctAnswer: It's half past two
        rationale: "'Half past' + hora. 'Half' = metade (30 minutos). Ordem: half past + hora."
        difficulty: 1
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São sete e meia
        correctAnswer: It's half past seven
        rationale: "'Half past seven' — 7h30. Também aceito: 'It's seven thirty'."
        difficulty: 1
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São doze horas
        correctAnswer: It's twelve o'clock
        rationale: "'Twelve o'clock' pode ser meio-dia ou meia-noite. 'Noon' = meio-dia. 'Midnight' = meia-noite."
        difficulty: 1
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São dez e meia
        correctAnswer: It's half past ten
        rationale: "'Half past ten' — 10h30. Forma britânica comum."
        difficulty: 1
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São três horas
        correctAnswer: It's three o'clock
        rationale: "'Three o'clock' — hora exata. Base de muitos exemplos desta estrutura."
        difficulty: 1
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São nove e meia
        correctAnswer: It's half past nine
        rationale: "'Half past nine' — 9h30. Note a ordem: half past + hora."
        difficulty: 1
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São cinco horas
        correctAnswer: It's five o'clock
        rationale: "'Five o'clock' — hora exata. 'O'clock' sempre depois do número."
        difficulty: 1
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São quatro e meia
        correctAnswer: It's half past four
        rationale: "'Half past four' — 4h30. Forma mais usada no inglês britânico."
        difficulty: 1
        objectives: [A1.grammar.time]
  - pageNumber: 2
    title: Quarter Past and Quarter To
    description: Say the time using quarter past or quarter to.
    exercises:
      - type: english_phrases
        question: São três e quinze
        correctAnswer: It's quarter past three
        rationale: "'Quarter past' = 15 minutos após a hora. 'Quarter' = quarto (1/4 de hora)."
        difficulty: 2
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São dez e quinze
        correctAnswer: It's quarter past ten
        rationale: "'Quarter past ten' — 10h15. Muito comum em inglês britânico."
        difficulty: 2
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: Faltam quinze para as quatro
        correctAnswer: It's quarter to four
        rationale: "'Quarter to' = 15 minutos antes da hora. 3h45 = 'quarter to four'."
        difficulty: 2
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: Faltam quinze para as oito
        correctAnswer: It's quarter to eight
        rationale: "'Quarter to eight' — 7h45. Menciona a hora seguinte, não a atual."
        difficulty: 2
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São seis e quinze
        correctAnswer: It's quarter past six
        rationale: "'Quarter past six' — 6h15. Forma britânica clássica."
        difficulty: 2
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: Faltam quinze para as duas
        correctAnswer: It's quarter to two
        rationale: "'Quarter to two' — 1h45. Usa a hora que ainda está por vir."
        difficulty: 2
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São onze e quinze
        correctAnswer: It's quarter past eleven
        rationale: "'Quarter past eleven' — 11h15. 'Eleven' — pronunciar 'I-le-ven'."
        difficulty: 2
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: Faltam quinze para as doze
        correctAnswer: It's quarter to twelve
        rationale: "'Quarter to twelve' — 11h45. Próximo ao meio-dia."
        difficulty: 2
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: São nove e quinze
        correctAnswer: It's quarter past nine
        rationale: "'Quarter past nine' — 9h15. Forma padrão britânica."
        difficulty: 2
        objectives: [A1.grammar.time]
      - type: english_phrases
        question: Faltam quinze para as cinco
        correctAnswer: It's quarter to five
        rationale: "'Quarter to five' — 4h45. Preste atenção: é 'to five', não 'to four'."
        difficulty: 2
        objectives: [A1.grammar.time]
target: 20
