title: English B - Daily Actions
level: B
subject: english
repeatAll: 2
example: "Translate the sentence. Ex.: Eu como pão → I eat bread"
pages:
  - pageNumber: 1
    title: Simple Present
    description: Translate the sentence to English.
    exercises:
      - { type: english_phrases, question: "Eu como maçã", correctAnswer: i eat an apple }
      - { type: english_phrases, question: "Eu bebo água", correctAnswer: i drink water }
      - { type: english_phrases, question: "Eu leio um livro", correctAnswer: i read a book }
      - { type: english_phrases, question: "Eu escrevo uma carta", correctAnswer: i write a letter }
      - { type: english_phrases, question: "Eu ando para a escola", correctAnswer: i walk to school }
      - { type: english_phrases, question: "Eu brinco com meus amigos", correctAnswer: i play with my friends }
      - { type: english_phrases, question: "Eu estudo inglês", correctAnswer: i study english }
      - { type: english_phrases, question: "Eu vou para casa", correctAnswer: i go home }
      - { type: english_phrases, question: "Eu gosto de música", correctAnswer: i like music }
      - { type: english_phrases, question: "Eu amo minha família", correctAnswer: i love my family }
  - pageNumber: 2
    title: He/She actions
    description: Translate. He/She adds 's' to verbs.
    exercises:
      - { type: english_phrases, question: "Ele come pão", correctAnswer: he eats bread }
      - { type: english_phrases, question: "Ela bebe leite", correctAnswer: she drinks milk }
      - { type: english_phrases, question: "Ele lê um livro", correctAnswer: he reads a book }
      - { type: english_phrases, question: "Ela escreve bem", correctAnswer: she writes well }
      - { type: english_phrases, question: "Ele anda rápido", correctAnswer: he walks fast }
      - { type: english_phrases, question: "Ela canta uma música", correctAnswer: she sings a song }
      - { type: english_phrases, question: "Ele joga futebol", correctAnswer: he plays soccer }
      - { type: english_phrases, question: "Ela estuda matemática", correctAnswer: she studies math }
      - { type: english_phrases, question: "O cachorro corre", correctAnswer: the dog runs }
      - { type: english_phrases, question: "O pássaro voa", correctAnswer: the bird flies }
target: 20
