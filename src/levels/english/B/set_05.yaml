title: English B - Daily Actions
level: B
subject: english
repeatAll: 2
example: "Translate the sentence. Ex.: Eu como pão → I eat bread"
pages:
  - pageNumber: 1
    title: Simple Present
    description: Translate the sentence to English.
    exercises:
      - type: english_phrases
        question: Eu como maçã
        correctAnswer: i eat an apple
        rationale: "Artigo \"an\" antes de vogal (\"apple\"). Se fosse \"pear\" — seria \"a pear\"."
      - type: english_phrases
        question: Eu bebo água
        correctAnswer: i drink water
        rationale: "\"Water\" é incontável — sem artigo. \"A water\" só no informal (copo/garrafa)."
      - type: english_phrases
        question: Eu leio um livro
        correctAnswer: i read a book
        rationale: "\"Read\" no presente soa \"rid\"; no passado soa \"red\" (mesma grafia)."
      - type: english_phrases
        question: Eu escrevo uma carta
        correctAnswer: i write a letter
        rationale: "\"Write\" — \"w\" mudo. Não confunda com \"right\" (direita/correto)."
      - type: english_phrases
        question: Eu ando para a escola
        correctAnswer: i walk to school
        rationale: "\"To school\" sem artigo — atividade genérica (ir para estudar). Com artigo seria edifício."
      - type: english_phrases
        question: Eu brinco com meus amigos
        correctAnswer: i play with my friends
        rationale: "\"Play with\" (brincar com) — preposição \"with\" obrigatória. \"Friends\" no plural."
      - type: english_phrases
        question: Eu estudo inglês
        correctAnswer: i study english
        rationale: "Idiomas em inglês são sempre maiúsculos — \"English\", \"Portuguese\", \"Spanish\"."
      - type: english_phrases
        question: Eu vou para casa
        correctAnswer: i go home
        rationale: "\"Go home\" sem preposição nem artigo — expressão fixa. \"Go to home\" é erro."
      - type: english_phrases
        question: Eu gosto de música
        correctAnswer: i like music
        rationale: "\"Like\" não precisa de preposição — \"like music\" (não \"like of music\"). \"Music\" é incontável."
      - type: english_phrases
        question: Eu amo minha família
        correctAnswer: i love my family
        rationale: "\"Family\" é singular (um grupo). Possessivo \"my\" sem artigo depois."
  - pageNumber: 2
    title: He/She actions
    description: Translate. He/She adds 's' to verbs.
    exercises:
      - type: english_phrases
        question: Ele come pão
        correctAnswer: he eats bread
        rationale: "3ª pessoa singular (he/she/it) + \"-s\" no verbo. \"Bread\" é incontável — sem artigo."
      - type: english_phrases
        question: Ela bebe leite
        correctAnswer: she drinks milk
        rationale: "\"Drinks\" — verbo com \"-s\" da 3ª pessoa. \"Milk\" é incontável."
      - type: english_phrases
        question: Ele lê um livro
        correctAnswer: he reads a book
        rationale: "\"Reads\" — \"-s\" da 3ª pessoa. Pronúncia \"riidz\" no presente."
      - type: english_phrases
        question: Ela escreve bem
        correctAnswer: she writes well
        rationale: "Advérbio \"well\" = bem. Não confunda com \"good\" (bom, adjetivo)."
      - type: english_phrases
        question: Ele anda rápido
        correctAnswer: he walks fast
        rationale: "\"Fast\" funciona como advérbio sem \"-ly\". Cuidado — não é \"fastly\"."
      - type: english_phrases
        question: Ela canta uma música
        correctAnswer: she sings a song
        rationale: "\"Sings\" + \"a song\" — artigo \"a\" obrigatório antes de \"song\" (contável singular)."
      - type: english_phrases
        question: Ele joga futebol
        correctAnswer: he plays soccer
        rationale: "\"Plays\" — verbos terminados em vogal + y mantêm o y. \"Soccer\" (AmE) ou \"football\" (BrE)."
      - type: english_phrases
        question: Ela estuda matemática
        correctAnswer: she studies math
        rationale: "\"Study\" termina em consoante + y — vira \"studies\" na 3ª pessoa (y vira ies)."
      - type: english_phrases
        question: O cachorro corre
        correctAnswer: the dog runs
        rationale: "\"The dog\" é sujeito singular → \"runs\" com \"-s\". Cuidado — cães no plural seriam \"run\"."
      - type: english_phrases
        question: O pássaro voa
        correctAnswer: the bird flies
        rationale: "\"Fly\" termina em consoante + y → \"flies\" na 3ª pessoa. Mesma regra de \"studies\"."
target: 20
