title: English B - Daily Actions
level: B
subject: english
repeatAll: 2
example: "Translate the sentence. Ex.: Eu como pão → I eat bread"
pages:
  - pageNumber: 1
    title: Simple Present
    description: Translate the sentence to English.
    exercises:
      - type: english_phrases
        question: Eu como maçã
        correctAnswer: i eat an apple
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
