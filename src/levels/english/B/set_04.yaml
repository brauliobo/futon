title: English B - Simple Questions
level: B
subject: english
repeatAll: 2
example: "Translate. Ex.: Qual é seu nome? → what is your name"
pages:
  - pageNumber: 1
    title: What / Who / Where
    description: Translate the question to English.
    exercises:
      - { type: english_phrases, question: "Qual é seu nome?", correctAnswer: what is your name }
      - { type: english_phrases, question: "Quantos anos você tem?", correctAnswer: how old are you }
      - { type: english_phrases, question: "Onde você mora?", correctAnswer: where do you live }
      - { type: english_phrases, question: "Quem é ele?", correctAnswer: who is he }
      - { type: english_phrases, question: "Quem é ela?", correctAnswer: who is she }
      - { type: english_phrases, question: "Onde está o gato?", correctAnswer: where is the cat }
      - { type: english_phrases, question: "O que é isto?", correctAnswer: what is this }
      - { type: english_phrases, question: "O que é aquilo?", correctAnswer: what is that }
      - { type: english_phrases, question: "Quem está aí?", correctAnswer: who is there }
      - { type: english_phrases, question: "O que você faz?", correctAnswer: what do you do }
  - pageNumber: 2
    title: How / When / Why
    description: Translate the question to English.
    exercises:
      - { type: english_phrases, question: "Como você está?", correctAnswer: how are you }
      - { type: english_phrases, question: "Como está o tempo?", correctAnswer: how is the weather }
      - { type: english_phrases, question: "Quando é seu aniversário?", correctAnswer: when is your birthday }
      - { type: english_phrases, question: "Quando é a aula?", correctAnswer: when is the class }
      - { type: english_phrases, question: "Por que você está triste?", correctAnswer: why are you sad }
      - { type: english_phrases, question: "Por que está chovendo?", correctAnswer: why is it raining }
      - { type: english_phrases, question: "Quantos livros?", correctAnswer: how many books }
      - { type: english_phrases, question: "Quanto custa?", correctAnswer: how much is it }
      - { type: english_phrases, question: "Você gosta de pizza?", correctAnswer: do you like pizza }
      - { type: english_phrases, question: "Você fala inglês?", correctAnswer: do you speak english }
target: 20
