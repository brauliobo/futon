title: English B - Simple Questions
level: B
subject: english
difficulty: 1
objectives:
  - A1.grammar.to_be_have
repeatAll: 2
authorNotes: "English B - Simple Questions. Foque no conceito central do conjunto e nos erros comuns."
example: "Translate. Ex.: Qual é seu nome? → what is your name"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: What / Who / Where
    description: Translate the question to English.
    exercises:
      - type: english_phrases
        question: Qual é seu nome?
        correctAnswer: What is your name
        rationale: "Wh-word (\"what\") vem primeiro, depois o verbo \"is\", depois o sujeito. Inversão obrigatória."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Quantos anos você tem?
        correctAnswer: How old are you
        rationale: "Inglês pergunta \"how old are you\" — literalmente \"quão velho você é\". Nada de \"how many years\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Onde você mora?
        correctAnswer: Where do you live
        rationale: "Verbo normal (não \"to be\") exige auxiliar \"do\". Estrutura — Wh + do + sujeito + verbo."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Quem é ele?
        correctAnswer: Who is he
        rationale: "\"Who\" (quem) + \"is\" + \"he\". Inversão clássica com verbo \"to be\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Quem é ela?
        correctAnswer: Who is she
        rationale: "\"Who\" serve para pessoa (quem). \"What\" seria para coisa/profissão."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Onde está o gato?
        correctAnswer: Where is the cat
        rationale: "\"Where\" + \"is\" + sujeito com artigo \"the\" (gato específico)."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: O que é isto?
        correctAnswer: What is this
        rationale: "\"This\" aponta para o próximo; \"that\" para o distante. Aqui — \"this\" (isto)."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: O que é aquilo?
        correctAnswer: What is that
        rationale: "\"That\" indica objeto distante. Plural seria \"those\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Quem está aí?
        correctAnswer: Who is there
        rationale: "\"There\" (lá/aí). Contração informal — \"who's there\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: O que você faz?
        correctAnswer: What do you do
        rationale: "Dois \"do\" — primeiro é auxiliar, segundo é verbo principal (fazer/ocupar-se)."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
  - pageNumber: 2
    title: How / When / Why
    description: Translate the question to English.
    exercises:
      - type: english_phrases
        question: Como você está?
        correctAnswer: How are you
        rationale: "\"How\" + \"are\" + \"you\" — inversão com \"to be\". Saudação padrão."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Como está o tempo?
        correctAnswer: How is the weather
        rationale: "\"Weather\" (tempo meteorológico) leva artigo \"the\" obrigatório."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Quando é seu aniversário?
        correctAnswer: When is your birthday
        rationale: "\"Birthday\" é composto — \"birth\" (nascimento) + \"day\". Leva possessivo \"your\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Quando é a aula?
        correctAnswer: When is the class
        rationale: "\"Class\" com artigo \"the\" — aula específica. Sem artigo seria genérico (\"in class\")."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Por que você está triste?
        correctAnswer: Why are you sad
        rationale: "\"Why\" + \"are\" + \"you\" + adjetivo. \"Because\" introduz a resposta."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Por que está chovendo?
        correctAnswer: Why is it raining
        rationale: "Clima sempre com sujeito \"it\" — mesmo em pergunta. \"Is it raining\" (inversão)."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Quantos livros?
        correctAnswer: How many books
        rationale: "\"How many\" + plural contável (books). \"How much\" + incontável (water, money)."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Quanto custa?
        correctAnswer: How much is it
        rationale: "Para preço — \"how much is it?\" ou \"how much does it cost?\". Dinheiro é incontável."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Você gosta de pizza?
        correctAnswer: Do you like pizza
        rationale: "Verbo \"like\" exige auxiliar \"do\" em pergunta. Sem \"de\" — inglês — \"like something\" direto."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Você fala inglês?
        correctAnswer: Do you speak English
        rationale: "\"Do you speak\" — estrutura padrão para perguntas com verbo comum. Idiomas em inglês são maiúsculos."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
target: 20
