title: 🎨 English B - Adjectives — Describing Things
level: B
subject: english
difficulty: 1
objectives:
  - A1.grammar.adjectives
authorNotes: "Adjetivos descritivos. Em inglês o adjetivo vem ANTES do substantivo ou após 'to be'. Sem variação de gênero/número."
repeatAll: 2
example: "Translate the sentence. Ex.: O carro é grande → The car is big."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Size, Age & Condition
    description: Translate the sentence using adjectives.
    exercises:
      - type: english_phrases
        question: A casa é grande
        correctAnswer: The house is big
        rationale: "'Big' = grande. Adjetivo após 'to be'. Sem variação — mesmo para casa, carro, etc."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: O gato é pequeno
        correctAnswer: The cat is small
        rationale: "'Small' = pequeno. Adjetivo invariável. Oposto de 'big'."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: O livro é velho
        correctAnswer: The book is old
        rationale: "'Old' = velho/antigo. Oposto de 'new'. Para pessoas, 'old' é natural."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: O carro é novo
        correctAnswer: The car is new
        rationale: "'New' = novo. Rima com 'blue' e 'true'. Oposto de 'old'."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: A comida está quente
        correctAnswer: The food is hot
        rationale: "'Hot' = quente/picante. Também 'warm' (morno). 'Hot' é mais intenso."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: A água está fria
        correctAnswer: The water is cold
        rationale: "'Cold' = frio. Também usado para resfriado — 'I have a cold'."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: O quarto está limpo
        correctAnswer: The room is clean
        rationale: "'Clean' = limpo. Rima com 'green'. Oposto de 'dirty'."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: A rua está suja
        correctAnswer: The street is dirty
        rationale: "'Dirty' = sujo. Termina em '-y'. Oposto de 'clean'."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: O exercício é fácil
        correctAnswer: The exercise is easy
        rationale: "'Easy' = fácil. Termina em '-y' (soa 'i'). Oposto de 'difficult' ou 'hard'."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: A pergunta é difícil
        correctAnswer: The question is difficult
        rationale: "Cognato 'difficult'. Também 'hard' (informal). 'The question' — artigo definido."
        difficulty: 1
        objectives: [A1.grammar.adjectives]
  - pageNumber: 2
    title: Appearance & Quality
    description: Translate the sentence.
    exercises:
      - type: english_phrases
        question: O jardim é bonito
        correctAnswer: The garden is beautiful
        rationale: "'Beautiful' = bonito. Três sílabas 'BEW-ti-ful'. Forte elogio."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: O cachorro é feio
        correctAnswer: The dog is ugly
        rationale: "'Ugly' = feio. Termina em '-y'. Oposto de 'beautiful'."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: É um livro interessante
        correctAnswer: It is an interesting book
        rationale: "Adjetivo antes do substantivo: 'an interesting book'. 'An' antes de vogal."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: É uma criança simpática
        correctAnswer: She is a nice child
        rationale: "'Nice' = simpático/agradável. Adjetivo antes do substantivo na frase."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: A loja é cara
        correctAnswer: The shop is expensive
        rationale: "Cognato 'expensive'. 'ex-PEN-siv'. Oposto de 'cheap' (barato)."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: O ônibus está cheio
        correctAnswer: The bus is full
        rationale: "'Full' = cheio. Rima com 'bull' e 'pull'. Oposto de 'empty'."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: A mochila está vazia
        correctAnswer: The bag is empty
        rationale: "'Empty' = vazio. 'EMP-ti'. Oposto de 'full'."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: A música é alta
        correctAnswer: The music is loud
        rationale: "'Loud' = alto (barulhento). Não confundir com 'tall' (alto em estatura)."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: O filme é longo
        correctAnswer: The movie is long
        rationale: "'Long' = longo/comprido. Oposto de 'short'."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
      - type: english_phrases
        question: É uma boa ideia
        correctAnswer: It is a good idea
        rationale: "'Good' = bom. 'A good idea' — adjetivo antes do substantivo."
        difficulty: 2
        objectives: [A1.grammar.adjectives]
target: 20
