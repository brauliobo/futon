title: 🏃 English B - Present Simple — Actions
level: B
subject: english
difficulty: 1
objectives:
  - A1.grammar.present_simple
authorNotes: "Present simple: I/you/we/they + verbo base; he/she/it + verbo-s. Terceira pessoa é o ponto crítico."
repeatAll: 2
example: "Translate the sentence. Ex.: Eu como arroz → I eat rice."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: I / You / We / They
    description: Translate the sentence using present simple.
    exercises:
      - type: english_phrases
        question: Eu como arroz todo dia
        correctAnswer: I eat rice every day
        rationale: "'I eat' — primeira pessoa, verbo base. 'Every day' = todo dia."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Você bebe água
        correctAnswer: You drink water
        rationale: "'You drink' — segunda pessoa, verbo base. 'Water' incontável."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Nós jogamos futebol
        correctAnswer: We play football
        rationale: "'We play' — primeira pessoa plural, verbo base. Sem artigo com esportes."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Eles estudam inglês
        correctAnswer: They study English
        rationale: "'They study' — terceira pessoa plural, verbo base. 'English' com maiúscula."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Eu durmo cedo
        correctAnswer: I sleep early
        rationale: "'I sleep' — verbo base. 'Early' = cedo (adjetivo e advérbio)."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Você mora aqui
        correctAnswer: You live here
        rationale: "'You live' — verbo base. 'Here' = aqui (advérbio de lugar)."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Nós gostamos de música
        correctAnswer: We like music
        rationale: "'We like' — verbo base. 'Music' incontável — sem artigo."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Eles correm no parque
        correctAnswer: They run in the park
        rationale: "'They run' — verbo base. 'In the park' — local específico."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Eu leio livros
        correctAnswer: I read books
        rationale: "'I read' — verbo base. 'Books' — plural. 'Read' present e past têm grafia igual."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Você trabalha aqui
        correctAnswer: You work here
        rationale: "'You work' — verbo base. Mesmo com endereço específico, 'here' é suficiente."
        difficulty: 1
        objectives: [A1.grammar.present_simple]
  - pageNumber: 2
    title: He / She / It — The "-s" Rule
    description: Translate the sentence. Remember the "-s" for he/she/it.
    exercises:
      - type: english_phrases
        question: Ela come maçãs
        correctAnswer: She eats apples
        rationale: "'She eats' — 3ª pessoa singular: verbo + 's'. 'Eat' → 'eats'."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Ele bebe leite
        correctAnswer: He drinks milk
        rationale: "'He drinks' — 3ª pessoa, 's' no verbo. 'Milk' incontável — sem artigo."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Ela mora em Londres
        correctAnswer: She lives in London
        rationale: "'She lives' — 'live' + 's'. 'In London' — cidades usam 'in'."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Ele estuda muito
        correctAnswer: He studies a lot
        rationale: "'Study' + 3ª pessoa — 'y' vira 'ies': 'studies'. 'A lot' = muito."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: O cachorro corre rápido
        correctAnswer: The dog runs fast
        rationale: "'Dog runs' — 3ª pessoa com artigo definido. 'Fast' = rápido (adv. e adj.)."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Ela gosta de dançar
        correctAnswer: She likes dancing
        rationale: "'She likes' — 'like' + 's'. 'Dancing' — após 'like', pode usar '-ing'."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Ele acorda às sete
        correctAnswer: He wakes up at seven
        rationale: "'Wakes up' — phrasal verb 'wake up' com 's'. 'At seven' = às sete."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Ela fala inglês bem
        correctAnswer: She speaks English well
        rationale: "'She speaks' — 3ª pessoa. 'Well' = bem (advérbio). 'Good' seria adjetivo."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: Ele vai à escola de ônibus
        correctAnswer: He goes to school by bus
        rationale: "'Go' + 3ª pessoa: 'goes' (não 'gos'). 'By bus' = de ônibus (transporte)."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
      - type: english_phrases
        question: O gato dorme no sofá
        correctAnswer: The cat sleeps on the sofa
        rationale: "'Cat sleeps' — 3ª pessoa. 'On the sofa' — sobre a superfície."
        difficulty: 2
        objectives: [A1.grammar.present_simple]
target: 20
