title: English B - Have / Has
level: B
subject: english
repeatAll: 2
example: "Use 'have' or 'has'. Ex.: Eu tenho um cachorro → I have a dog"
pages:
  - pageNumber: 1
    title: I/You/We/They have
    description: Translate using "have".
    exercises:
      - { type: english_phrases, question: "Eu tenho um cachorro", correctAnswer: i have a dog }
      - { type: english_phrases, question: "Eu tenho um gato", correctAnswer: i have a cat }
      - { type: english_phrases, question: "Eu tenho um livro", correctAnswer: i have a book }
      - { type: english_phrases, question: "Eu tenho dois irmãos", correctAnswer: i have two brothers }
      - { type: english_phrases, question: "Você tem uma bicicleta", correctAnswer: you have a bike }
      - { type: english_phrases, question: "Nós temos amigos", correctAnswer: we have friends }
      - { type: english_phrases, question: "Eles têm um carro", correctAnswer: they have a car }
      - { type: english_phrases, question: "Eu tenho fome", correctAnswer: i am hungry }
      - { type: english_phrases, question: "Eu tenho sede", correctAnswer: i am thirsty }
      - { type: english_phrases, question: "Nós temos aulas", correctAnswer: we have classes }
  - pageNumber: 2
    title: He/She/It has
    description: Translate using "has".
    exercises:
      - { type: english_phrases, question: "Ele tem um carro", correctAnswer: he has a car }
      - { type: english_phrases, question: "Ela tem uma boneca", correctAnswer: she has a doll }
      - { type: english_phrases, question: "Ele tem um irmão", correctAnswer: he has a brother }
      - { type: english_phrases, question: "Ela tem cabelo longo", correctAnswer: she has long hair }
      - { type: english_phrases, question: "Ele tem olhos azuis", correctAnswer: he has blue eyes }
      - { type: english_phrases, question: "Ela tem 5 anos", correctAnswer: she is 5 years old }
      - { type: english_phrases, question: "O cachorro tem ossos", correctAnswer: the dog has bones }
      - { type: english_phrases, question: "Ele tem um amigo", correctAnswer: he has a friend }
      - { type: english_phrases, question: "Ela tem uma caneta", correctAnswer: she has a pen }
      - { type: english_phrases, question: "A casa tem janelas", correctAnswer: the house has windows }
target: 20
