title: English B - Have / Has
level: B
subject: english
repeatAll: 2
example: "Use 'have' or 'has'. Ex.: Eu tenho um cachorro → I have a dog"
pages:
  - pageNumber: 1
    title: I/You/We/They have
    description: Translate using "have".
    exercises:
      - type: english_phrases
        question: Eu tenho um cachorro
        correctAnswer: i have a dog
        rationale: "\"Have\" vai com I/you/we/they. Só muda para \"has\" na 3ª pessoa singular."
      - type: english_phrases
        question: Eu tenho um gato
        correctAnswer: i have a cat
        rationale: "\"I have\" + \"a\" (artigo indefinido) + substantivo contável singular."
      - type: english_phrases
        question: Eu tenho um livro
        correctAnswer: i have a book
        rationale: "Artigo \"a\" antes de consoante. Se fosse \"apple\" — seria \"an apple\"."
      - type: english_phrases
        question: Eu tenho dois irmãos
        correctAnswer: i have two brothers
        rationale: "Plural regular — substantivo + \"s\". Números ≥ 2 pedem plural."
      - type: english_phrases
        question: Você tem uma bicicleta
        correctAnswer: you have a bike
        rationale: "\"You\" sempre com \"have\" (não \"has\"). \"Bike\" é informal — formal é \"bicycle\"."
      - type: english_phrases
        question: Nós temos amigos
        correctAnswer: we have friends
        rationale: "\"We\" + \"have\". Sem artigo — plural genérico indica conjunto indefinido."
      - type: english_phrases
        question: Eles têm um carro
        correctAnswer: they have a car
        rationale: "\"They\" + \"have\" (não \"has\"). \"They\" serve para gente, coisas e animais plurais."
      - type: english_phrases
        question: Eu tenho fome
        correctAnswer: i am hungry
        rationale: "Inglês usa \"to be\" + adjetivo para sensações físicas — não \"have\" como em português."
      - type: english_phrases
        question: Eu tenho sede
        correctAnswer: i am thirsty
        rationale: "Mesmo padrão — \"am thirsty\" (estou com sede). Nunca \"I have thirst\" em inglês coloquial."
      - type: english_phrases
        question: Nós temos aulas
        correctAnswer: we have classes
        rationale: "Plural irregular de \"class\" — \"classes\" (adiciona \"-es\" após \"s/ss/sh/ch/x\")."
  - pageNumber: 2
    title: He/She/It has
    description: Translate using "has".
    exercises:
      - type: english_phrases
        question: Ele tem um carro
        correctAnswer: he has a car
        rationale: "3ª pessoa singular (he/she/it) + \"has\" — regra fixa. Nunca \"he have\"."
      - type: english_phrases
        question: Ela tem uma boneca
        correctAnswer: she has a doll
        rationale: "\"She\" exige \"has\". \"Doll\" — duplo L."
      - type: english_phrases
        question: Ele tem um irmão
        correctAnswer: he has a brother
        rationale: "\"Has\" é a única forma irregular de \"have\" no presente — memorize separadamente."
      - type: english_phrases
        question: Ela tem cabelo longo
        correctAnswer: she has long hair
        rationale: "\"Hair\" é incontável — \"long hair\" (não \"hairs\"). Adjetivo vem antes."
      - type: english_phrases
        question: Ele tem olhos azuis
        correctAnswer: he has blue eyes
        rationale: "Plural \"eyes\" (contável). Adjetivo \"blue\" não varia com número."
      - type: english_phrases
        question: Ela tem 5 anos
        correctAnswer: she is 5 years old
        rationale: "Idade pede \"to be\" — \"she is 5\", não \"she has 5\". Erro comum de PT falante."
      - type: english_phrases
        question: O cachorro tem ossos
        correctAnswer: the dog has bones
        rationale: "Sujeito específico (\"the dog\") leva \"has\" — singular pede terceira pessoa."
      - type: english_phrases
        question: Ele tem um amigo
        correctAnswer: he has a friend
        rationale: "\"Friend\" — grafia irregular, \"ie\" soa \"é\". Artigo \"a\" antes de consoante."
      - type: english_phrases
        question: Ela tem uma caneta
        correctAnswer: she has a pen
        rationale: "\"A pen\" — artigo + substantivo. \"She has\" é a construção fixa do presente simples."
      - type: english_phrases
        question: A casa tem janelas
        correctAnswer: the house has windows
        rationale: "Objetos usam \"it\" ou substantivo específico (\"the house\") — aqui \"has\". Plural \"windows\" sem artigo."
target: 20
