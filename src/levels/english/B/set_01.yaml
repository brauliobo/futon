title: English B - I am / You are
level: B
subject: english
repeatAll: 2
example: "Complete the phrase. Ex.: Eu sou um menino → I am a boy"
pages:
  - pageNumber: 1
    title: Using "I am"
    description: Translate the Portuguese sentence to English.
    exercises:
      - { type: english_phrases, question: "Eu sou um menino", correctAnswer: i am a boy }
      - { type: english_phrases, question: "Eu sou uma menina", correctAnswer: i am a girl }
      - { type: english_phrases, question: "Eu sou um estudante", correctAnswer: i am a student }
      - { type: english_phrases, question: "Eu sou feliz", correctAnswer: i am happy }
      - { type: english_phrases, question: "Eu sou alto", correctAnswer: i am tall }
      - { type: english_phrases, question: "Eu tenho 10 anos", correctAnswer: i am 10 years old }
      - { type: english_phrases, question: "Eu estou cansado", correctAnswer: i am tired }
      - { type: english_phrases, question: "Eu estou em casa", correctAnswer: i am at home }
      - { type: english_phrases, question: "Eu estou na escola", correctAnswer: i am at school }
      - { type: english_phrases, question: "Eu sou seu amigo", correctAnswer: i am your friend }
  - pageNumber: 2
    title: Using "You are"
    description: Translate the Portuguese sentence to English.
    exercises:
      - { type: english_phrases, question: "Você é legal", correctAnswer: you are nice }
      - { type: english_phrases, question: "Você é meu amigo", correctAnswer: you are my friend }
      - { type: english_phrases, question: "Você está certo", correctAnswer: you are right }
      - { type: english_phrases, question: "Você está errado", correctAnswer: you are wrong }
      - { type: english_phrases, question: "Você é inteligente", correctAnswer: you are smart }
      - { type: english_phrases, question: "Você é bonito", correctAnswer: you are beautiful }
      - { type: english_phrases, question: "Você está atrasado", correctAnswer: you are late }
      - { type: english_phrases, question: "Você está pronto", correctAnswer: you are ready }
      - { type: english_phrases, question: "Você é forte", correctAnswer: you are strong }
      - { type: english_phrases, question: "Você é jovem", correctAnswer: you are young }
target: 20
