title: English B - I am / You are
level: B
subject: english
repeatAll: 2
example: "Complete the phrase. Ex.: Eu sou um menino → I am a boy"
pages:
  - pageNumber: 1
    title: Using "I am"
    description: Translate the Portuguese sentence to English.
    exercises:
      - type: english_phrases
        question: Eu sou um menino
        correctAnswer: i am a boy
        rationale: "\"I am\" é a forma do verbo to be na primeira pessoa. Artigo \"a\" antes de substantivo contável."
      - type: english_phrases
        question: Eu sou uma menina
        correctAnswer: i am a girl
        rationale: "Em inglês o artigo \"a/an\" não varia com gênero — é \"a girl\" e \"a boy\"."
      - type: english_phrases
        question: Eu sou um estudante
        correctAnswer: i am a student
        rationale: "Profissão/status leva artigo \"a\" em inglês — \"I am a student\", não \"I am student\"."
      - type: english_phrases
        question: Eu sou feliz
        correctAnswer: i am happy
        rationale: "Adjetivo vem direto após \"am\", sem artigo — \"I am happy\", não \"I am a happy\"."
      - type: english_phrases
        question: Eu sou alto
        correctAnswer: i am tall
        rationale: "Adjetivos são invariáveis em inglês — \"tall\" serve para alto, alta, altos, altas."
      - type: english_phrases
        question: Eu tenho 10 anos
        correctAnswer: i am 10 years old
        rationale: "Inglês usa \"to be\" para idade — \"I am 10\", não \"I have 10\" (erro comum de PT)."
      - type: english_phrases
        question: Eu estou cansado
        correctAnswer: i am tired
        rationale: "Inglês usa um só verbo \"to be\" para \"ser\" e \"estar\". \"Tired\" = particípio usado como adjetivo."
      - type: english_phrases
        question: Eu estou em casa
        correctAnswer: i am at home
        rationale: "\"At home\" é fixo — não use \"in the home\". \"At\" marca local específico."
      - type: english_phrases
        question: Eu estou na escola
        correctAnswer: i am at school
        rationale: "\"At school\" (na escola, como atividade) — sem artigo. \"In the school\" é dentro do prédio."
      - type: english_phrases
        question: Eu sou seu amigo
        correctAnswer: i am your friend
        rationale: "\"Your\" = seu/sua (adjetivo possessivo). Não se altera com gênero nem número."
  - pageNumber: 2
    title: Using "You are"
    description: Translate the Portuguese sentence to English.
    exercises:
      - type: english_phrases
        question: Você é legal
        correctAnswer: you are nice
        rationale: "\"You\" + \"are\" sempre — mesmo no singular. Inglês não tem \"you is\"."
      - type: english_phrases
        question: Você é meu amigo
        correctAnswer: you are my friend
        rationale: "\"My\" (meu/minha) é invariável. Singular \"friend\"; plural seria \"friends\"."
      - type: english_phrases
        question: Você está certo
        correctAnswer: you are right
        rationale: "\"Right\" cobre vários sentidos — \"correto\", \"à direita\", \"direito/privilégio\"."
      - type: english_phrases
        question: Você está errado
        correctAnswer: you are wrong
        rationale: "\"Wrong\" = errado/incorreto. Oposto de \"right\". Pronúncia \"rong\" (W mudo)."
      - type: english_phrases
        question: Você é inteligente
        correctAnswer: you are smart
        rationale: "\"Smart\" (AmE) e \"clever\" (BrE) são sinônimos. \"Intelligent\" existe mas é mais formal."
      - type: english_phrases
        question: Você é bonito
        correctAnswer: you are beautiful
        rationale: "\"Beautiful\" = bonito/a, lindo/a. Mais forte que \"pretty\" ou \"nice\"."
      - type: english_phrases
        question: Você está atrasado
        correctAnswer: you are late
        rationale: "\"Late\" vs \"later\" (depois) vs \"latest\" (mais recente). Aqui — \"atrasado\"."
      - type: english_phrases
        question: Você está pronto
        correctAnswer: you are ready
        rationale: "\"Ready\" termina em \"-y\" que soa \"i\". Contração comum — \"you're ready\"."
      - type: english_phrases
        question: Você é forte
        correctAnswer: you are strong
        rationale: "\"Strong\" é adjetivo. Substantivo — \"strength\". Comparativo — \"stronger\"."
      - type: english_phrases
        question: Você é jovem
        correctAnswer: you are young
        rationale: "\"Young\" pronúncia \"iang\" — \"y\" soa \"i\". Oposto de \"old\"."
target: 20
