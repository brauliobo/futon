title: English B - He/She/It is
level: B
subject: english
repeatAll: 2
example: "Complete. Ex.: Ele é um doutor → he is a doctor"
pages:
  - pageNumber: 1
    title: Using "He/She is"
    description: Translate the Portuguese sentence.
    exercises:
      - type: english_phrases
        question: Ele é um doutor
        correctAnswer: he is a doctor
        rationale: "Terceira pessoa singular pede \"is\" (não \"am\" nem \"are\"). Artigo \"a\" antes de profissão."
      - type: english_phrases
        question: Ela é uma professora
        correctAnswer: she is a teacher
        rationale: "\"Teacher\" é o professor(a) de escola. \"Professor\" em inglês é só universitário."
      - type: english_phrases
        question: Ele é meu irmão
        correctAnswer: he is my brother
        rationale: "\"My\" (invariável) + substantivo. Mesmo que em português \"meu/minha\", um só em inglês."
      - type: english_phrases
        question: Ela é minha irmã
        correctAnswer: she is my sister
        rationale: "\"Sister\" e \"brother\" não têm gênero gramatical — gênero vem do pronome (he/she)."
      - type: english_phrases
        question: Ele é alto
        correctAnswer: he is tall
        rationale: "\"Tall\" é alto em altura. \"High\" é alto em altitude/elevação."
      - type: english_phrases
        question: Ela é bonita
        correctAnswer: she is pretty
        rationale: "\"Pretty\" = bonitinha/graciosa. \"Beautiful\" é mais forte; \"cute\" mais informal."
      - type: english_phrases
        question: Ele está feliz
        correctAnswer: he is happy
        rationale: "Inglês não distingue ser/estar — \"is happy\" serve para ambos."
      - type: english_phrases
        question: Ela está triste
        correctAnswer: she is sad
        rationale: "\"Sad\" = triste. Três letras, vogal curta \"a\". Rima com \"bad\" e \"mad\"."
      - type: english_phrases
        question: Ele está ocupado
        correctAnswer: he is busy
        rationale: "\"Busy\" pronúncia \"BI-zi\" — \"u\" soa \"i\". Comparativo — \"busier\"."
      - type: english_phrases
        question: Ela está aqui
        correctAnswer: she is here
        rationale: "\"Here\" (aqui) vs \"hear\" (ouvir) — homófonos, grafia diferente."
  - pageNumber: 2
    title: Using "It is"
    description: Translate the Portuguese sentence.
    exercises:
      - type: english_phrases
        question: É um gato
        correctAnswer: it is a cat
        rationale: "Inglês exige sujeito — \"it\" representa coisas/animais genéricos. Português omite."
      - type: english_phrases
        question: É uma mesa
        correctAnswer: it is a table
        rationale: "Objetos sem gênero em inglês — sempre \"it\". Artigo \"a\" porque \"table\" começa com consoante."
      - type: english_phrases
        question: É grande
        correctAnswer: it is big
        rationale: "Adjetivo direto após \"is\", sem artigo. Contração — \"it's big\"."
      - type: english_phrases
        question: É pequeno
        correctAnswer: it is small
        rationale: "\"Small\" tem duplo L. Sinônimo — \"little\" (usado também com conotação afetuosa)."
      - type: english_phrases
        question: É vermelho
        correctAnswer: it is red
        rationale: "Adjetivo invariável — \"red\" serve para todos os gêneros e números."
      - type: english_phrases
        question: É novo
        correctAnswer: it is new
        rationale: "\"New\" pronúncia \"niu\" — \"w\" soa \"u\". Oposto de \"old\"."
      - type: english_phrases
        question: Está quente
        correctAnswer: it is hot
        rationale: "\"It\" como sujeito vazio para clima — regra fixa. Não diga \"is hot\" sozinho."
      - type: english_phrases
        question: Está frio
        correctAnswer: it is cold
        rationale: "Para clima sempre \"it is\" + adjetivo. Comparativo — \"colder\"."
      - type: english_phrases
        question: Está chovendo
        correctAnswer: it is raining
        rationale: "Present continuous (is + -ing) para ação em progresso. \"It\" obrigatório."
      - type: english_phrases
        question: É meu livro
        correctAnswer: it is my book
        rationale: "Possessivo \"my\" não leva artigo depois — \"my book\" (não \"my a book\")."
target: 20
