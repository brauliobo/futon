title: English B - He/She/It is
level: B
subject: english
repeatAll: 2
example: "Complete. Ex.: Ele é um doutor → he is a doctor"
pages:
  - pageNumber: 1
    title: Using "He/She is"
    description: Translate the Portuguese sentence.
    exercises:
      - { type: english_phrases, question: "Ele é um doutor", correctAnswer: he is a doctor }
      - { type: english_phrases, question: "Ela é uma professora", correctAnswer: she is a teacher }
      - { type: english_phrases, question: "Ele é meu irmão", correctAnswer: he is my brother }
      - { type: english_phrases, question: "Ela é minha irmã", correctAnswer: she is my sister }
      - { type: english_phrases, question: "Ele é alto", correctAnswer: he is tall }
      - { type: english_phrases, question: "Ela é bonita", correctAnswer: she is pretty }
      - { type: english_phrases, question: "Ele está feliz", correctAnswer: he is happy }
      - { type: english_phrases, question: "Ela está triste", correctAnswer: she is sad }
      - { type: english_phrases, question: "Ele está ocupado", correctAnswer: he is busy }
      - { type: english_phrases, question: "Ela está aqui", correctAnswer: she is here }
  - pageNumber: 2
    title: Using "It is"
    description: Translate the Portuguese sentence.
    exercises:
      - { type: english_phrases, question: "É um gato", correctAnswer: it is a cat }
      - { type: english_phrases, question: "É uma mesa", correctAnswer: it is a table }
      - { type: english_phrases, question: "É grande", correctAnswer: it is big }
      - { type: english_phrases, question: "É pequeno", correctAnswer: it is small }
      - { type: english_phrases, question: "É vermelho", correctAnswer: it is red }
      - { type: english_phrases, question: "É novo", correctAnswer: it is new }
      - { type: english_phrases, question: "Está quente", correctAnswer: it is hot }
      - { type: english_phrases, question: "Está frio", correctAnswer: it is cold }
      - { type: english_phrases, question: "Está chovendo", correctAnswer: it is raining }
      - { type: english_phrases, question: "É meu livro", correctAnswer: it is my book }
target: 20
