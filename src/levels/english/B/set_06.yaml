title: English B - Negatives (not/don't)
level: B
subject: english
repeatAll: 2
example: "Negative sentences. Ex.: Eu não sou alto → I am not tall"
pages:
  - pageNumber: 1
    title: Negatives with "am/is/are"
    description: Translate negative sentences.
    exercises:
      - { type: english_phrases, question: "Eu não sou alto", correctAnswer: i am not tall }
      - { type: english_phrases, question: "Você não está cansado", correctAnswer: you are not tired }
      - { type: english_phrases, question: "Ele não é professor", correctAnswer: he is not a teacher }
      - { type: english_phrases, question: "Ela não está feliz", correctAnswer: she is not happy }
      - { type: english_phrases, question: "Não é meu livro", correctAnswer: it is not my book }
      - { type: english_phrases, question: "Nós não somos irmãos", correctAnswer: we are not brothers }
      - { type: english_phrases, question: "Eles não estão prontos", correctAnswer: they are not ready }
      - { type: english_phrases, question: "Não está chovendo", correctAnswer: it is not raining }
      - { type: english_phrases, question: "Não sou médico", correctAnswer: i am not a doctor }
      - { type: english_phrases, question: "Ele não está aqui", correctAnswer: he is not here }
  - pageNumber: 2
    title: Negatives with "don't/doesn't"
    description: Translate using don't or doesn't.
    exercises:
      - { type: english_phrases, question: "Eu não gosto de bolo", correctAnswer: i do not like cake }
      - { type: english_phrases, question: "Você não fala inglês", correctAnswer: you do not speak english }
      - { type: english_phrases, question: "Ele não estuda", correctAnswer: he does not study }
      - { type: english_phrases, question: "Ela não come carne", correctAnswer: she does not eat meat }
      - { type: english_phrases, question: "Nós não trabalhamos", correctAnswer: we do not work }
      - { type: english_phrases, question: "Eles não correm", correctAnswer: they do not run }
      - { type: english_phrases, question: "Eu não tenho tempo", correctAnswer: i do not have time }
      - { type: english_phrases, question: "Ela não quer", correctAnswer: she does not want }
      - { type: english_phrases, question: "Ele não sabe", correctAnswer: he does not know }
      - { type: english_phrases, question: "Eu não entendo", correctAnswer: i do not understand }
target: 20
