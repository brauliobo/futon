title: English B - Negatives (not/don't)
level: B
subject: english
difficulty: 1
objectives:
  - A1.grammar.to_be_have
repeatAll: 2
example: "Negative sentences. Ex.: Eu não sou alto → I am not tall"
pages:
  - pageNumber: 1
    title: Negatives with "am/is/are"
    description: Translate negative sentences.
    exercises:
      - type: english_phrases
        question: Eu não sou alto
        correctAnswer: I am not tall
        rationale: "Com verbo \"to be\", basta inserir \"not\" depois dele. Contração — \"I'm not\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Você não está cansado
        correctAnswer: You are not tired
        rationale: "\"Are not\" pode contrair — \"aren't\". Estrutura — sujeito + to be + not + adjetivo."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Ele não é professor
        correctAnswer: He is not a teacher
        rationale: "Profissão pede artigo \"a\" mesmo em negativas — \"is not a teacher\", não \"is not teacher\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Ela não está feliz
        correctAnswer: She is not happy
        rationale: "\"Is not\" contrai para \"isn't\". \"Happy\" é adjetivo — sem artigo antes."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Não é meu livro
        correctAnswer: It is not my book
        rationale: "\"It\" obrigatório como sujeito. \"My book\" — possessivo não admite artigo."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Nós não somos irmãos
        correctAnswer: We are not brothers
        rationale: "Plural \"brothers\" sem artigo — ideia genérica. Contração comum — \"we aren't\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eles não estão prontos
        correctAnswer: They are not ready
        rationale: "\"They\" + \"are\" + \"not\" + adjetivo. Singular/plural não muda adjetivo em inglês."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Não está chovendo
        correctAnswer: It is not raining
        rationale: "Clima sempre \"it\". Present continuous negativo — \"is not\" + verbo-ing."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Não sou médico
        correctAnswer: I am not a doctor
        rationale: "\"I am not\" não admite a forma contraída \"*amn't\" (não existe). Use \"I'm not\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Ele não está aqui
        correctAnswer: He is not here
        rationale: "\"Here\" é advérbio de lugar — vem depois do adjetivo/complemento. Contração — \"he isn't here\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
  - pageNumber: 2
    title: Negatives with "don't/doesn't"
    description: Translate using don't or doesn't.
    exercises:
      - type: english_phrases
        question: Eu não gosto de bolo
        correctAnswer: I do not like cake
        rationale: "Verbo comum exige auxiliar \"do\" + \"not\". Contração — \"don't\". \"Cake\" genérico — sem artigo."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Você não fala inglês
        correctAnswer: You do not speak english
        rationale: "\"You do not speak\" — verbo base após \"not\". Nunca \"do not speaks\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Ele não estuda
        correctAnswer: He does not study
        rationale: "3ª pessoa singular usa \"does not\" (não \"do not\"). Verbo fica no infinitivo após \"does\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Ela não come carne
        correctAnswer: She does not eat meat
        rationale: "\"Does not eat\" — \"does\" absorve o \"-s\" da conjugação; verbo perde o \"-s\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Nós não trabalhamos
        correctAnswer: We do not work
        rationale: "\"We\" vai com \"do not\". Contração — \"we don't\". Verbo \"work\" na forma base."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eles não correm
        correctAnswer: They do not run
        rationale: "\"They don't run\". Verbos regulares e irregulares seguem a mesma regra na negativa."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu não tenho tempo
        correctAnswer: I do not have time
        rationale: "\"Have\" na negativa — \"do not have\" (não \"have not\" em inglês moderno). \"Time\" é incontável."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Ela não quer
        correctAnswer: She does not want
        rationale: "\"Want\" é verbo comum, não modal — pede auxiliar \"does\" na 3ª pessoa singular negativa."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Ele não sabe
        correctAnswer: He does not know
        rationale: "\"Know\" — \"k\" inicial é mudo. \"Does not know\" contrai para \"doesn't know\"."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
      - type: english_phrases
        question: Eu não entendo
        correctAnswer: I do not understand
        rationale: "\"Understand\" é verbo comum — exige auxiliar \"do\". Prefixo \"under-\" aparece em vários verbos."
        difficulty: 1
        objectives: [A1.grammar.to_be_have]
target: 20
