title: 👤 English B - Describing People
level: B
subject: english
difficulty: 1
objectives:
  - A1.grammar.describing_people
authorNotes: "Descrever pessoas: to be + adjetivo (aparência/personalidade), have/has + substantivo (características físicas)."
repeatAll: 2
example: "Translate the sentence. Ex.: Ele é baixo → He is short."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Height, Age & Personality
    description: Translate the description using "to be".
    exercises:
      - type: english_phrases
        question: Ela é alta
        correctAnswer: She is tall
        rationale: "'Tall' = alto (estatura). Adjetivo invariável. Não confundir com 'loud' (alto/barulhento)."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ele é baixo
        correctAnswer: He is short
        rationale: "'Short' = baixo (estatura) ou curto (comprimento). Oposto de 'tall'."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Eles são jovens
        correctAnswer: They are young
        rationale: "'Young' = jovem. Pronúncia 'iang'. Oposto de 'old'. Invariável no plural."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ela é simpática
        correctAnswer: She is nice
        rationale: "'Nice' = simpática/agradável. Muito usado para personalidade."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ele é engraçado
        correctAnswer: He is funny
        rationale: "'Funny' = engraçado/cômico. Também pode ser 'strange' em contexto informal."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ela é inteligente
        correctAnswer: She is smart
        rationale: "'Smart' = inteligente (AmE). 'Clever' é a versão britânica. Invariável."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Eles são fortes
        correctAnswer: They are strong
        rationale: "'Strong' = forte. 'They are strong' — adjetivo invariável no plural."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ela é bonita
        correctAnswer: She is pretty
        rationale: "'Pretty' = bonita (moderado). 'Beautiful' é mais intenso. Termina em '-y'."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ele é tímido
        correctAnswer: He is shy
        rationale: "'Shy' = tímido. Rima com 'my' e 'fly'. Oposto de 'outgoing'."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ela é velha
        correctAnswer: She is old
        rationale: "'Old' para pessoas é natural. Mais suave: 'elderly'. Oposto de 'young'."
        difficulty: 1
        objectives: [A1.grammar.describing_people]
  - pageNumber: 2
    title: Physical Appearance with "Have"
    description: Translate using "have/has" for physical features.
    exercises:
      - type: english_phrases
        question: Ele tem cabelo castanho
        correctAnswer: He has brown hair
        rationale: "'Has' — 3ª pessoa de 'have'. 'Brown hair' — cor antes do substantivo."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ela tem olhos azuis
        correctAnswer: She has blue eyes
        rationale: "'Blue eyes' — adjetivo antes do substantivo. 'Eyes' plural — 'has'."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Eu tenho cabelo longo
        correctAnswer: I have long hair
        rationale: "'Long hair' — adjetivo antes do substantivo. 'Hair' incontável — sem artigo."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ela tem cabelo curto
        correctAnswer: She has short hair
        rationale: "'Short hair' — 'short' para comprimento de cabelo. Adjetivo antes."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ele tem olhos verdes
        correctAnswer: He has green eyes
        rationale: "'Green eyes' — cor + substantivo. Ordem fixa em inglês."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Você tem cabelo preto
        correctAnswer: You have black hair
        rationale: "'Black hair' — cabelo preto. 'You have' — 2ª pessoa."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ela tem nariz pequeno
        correctAnswer: She has a small nose
        rationale: "'A small nose' — artigo indefinido para característica específica. 'Nose' = nariz."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ele tem um sorriso bonito
        correctAnswer: He has a nice smile
        rationale: "'A nice smile' — artigo indefinido + adjetivo + substantivo. 'Smile' = sorriso."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Nós temos olhos castanhos
        correctAnswer: We have brown eyes
        rationale: "'We have' — 1ª pessoa plural. 'Brown eyes' — cor + substantivo."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
      - type: english_phrases
        question: Ela tem cabelo loiro
        correctAnswer: She has blonde hair
        rationale: "'Blonde hair' — 'blonde' é a forma feminina; 'blond' é masculina (mas ambas aceitas)."
        difficulty: 2
        objectives: [A1.grammar.describing_people]
target: 20
