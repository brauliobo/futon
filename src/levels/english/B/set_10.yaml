title: English B - Wh- Questions
level: B
subject: english
difficulty: 3
objectives: [A1.grammar.wh_questions]
authorNotes: Wh- questions (what, where, when, who, why, how). Question word + auxiliary + subject + verb.
repeatAll: 2
example: "Onde você mora? → Where do you live?"
pages:
  - pageNumber: 1
    title: What, Where, When
    description: Translate questions asking for information.
    exercises:
      - { type: english_phrases, question: "O que você está fazendo?", correctAnswer: what are you doing }
      - { type: english_phrases, question: "Onde ela mora?", correctAnswer: where does she live }
      - { type: english_phrases, question: "Quando o filme começa?", correctAnswer: when does the movie start }
      - { type: english_phrases, question: "O que é isso?", correctAnswer: what is this }
      - { type: english_phrases, question: "Onde está meu livro?", correctAnswer: where is my book }
      - { type: english_phrases, question: "Quando vocês chegam?", correctAnswer: when do you arrive }
      - { type: english_phrases, question: "O que ele quer?", correctAnswer: what does he want }
      - { type: english_phrases, question: "Onde fica a escola?", correctAnswer: where is the school }
      - { type: english_phrases, question: "Quando é seu aniversário?", correctAnswer: when is your birthday }
      - { type: english_phrases, question: "O que ela estuda?", correctAnswer: what does she study }
  - pageNumber: 2
    title: Who, Why, How
    description: Translate questions with who, why, and how.
    exercises:
      - { type: english_phrases, question: "Quem é você?", correctAnswer: who are you }
      - { type: english_phrases, question: "Por que ele está triste?", correctAnswer: why is he sad }
      - { type: english_phrases, question: "Como você está?", correctAnswer: how are you }
      - { type: english_phrases, question: "Quem mora aqui?", correctAnswer: who lives here }
      - { type: english_phrases, question: "Por que ela chora?", correctAnswer: why is she crying }
      - { type: english_phrases, question: "Como funciona?", correctAnswer: how does it work }
      - { type: english_phrases, question: "Quem é seu professor?", correctAnswer: who is your teacher }
      - { type: english_phrases, question: "Por que estamos esperando?", correctAnswer: why are we waiting }
      - { type: english_phrases, question: "Como você aprende inglês?", correctAnswer: how do you learn english }
      - { type: english_phrases, question: "Quantos anos você tem?", correctAnswer: how old are you }
target: 20
