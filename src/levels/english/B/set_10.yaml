title: English B - Wh- Questions
level: B
subject: english
difficulty: 3
objectives:
  - A1.grammar.wh_questions
authorNotes: Wh- questions (what, where, when, who, why, how). Question word + auxiliary + subject + verb.
repeatAll: 2
example: Onde você mora? → Where do you live?
pages:
  - pageNumber: 1
    title: What, Where, When
    description: Translate questions asking for information.
    exercises:
      - type: english_phrases
        question: O que você está fazendo?
        correctAnswer: What are you doing
        rationale: "Wh + verbo \"to be\" + sujeito + verbo-ing. Present continuous."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Onde ela mora?
        correctAnswer: Where does she live
        rationale: "3ª pessoa (\"she\") exige \"does\" + verbo base (\"live\", não \"lives\")."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Quando o filme começa?
        correctAnswer: When does the movie start
        rationale: "Sujeito específico (\"the movie\") — 3ª pessoa singular → \"does\". Verbo \"start\" base."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: O que é isso?
        correctAnswer: What is this
        rationale: "Wh-word + \"is\" + demonstrativo. \"This\" (próximo) vs \"that\" (distante)."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Onde está meu livro?
        correctAnswer: Where is my book
        rationale: "Objetos usam \"is\" (3ª pessoa singular). \"My book\" — possessivo + substantivo."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Quando vocês chegam?
        correctAnswer: When do you arrive
        rationale: "\"You\" sempre com \"do\" (não \"does\"). Verbo \"arrive\" na forma base."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: O que ele quer?
        correctAnswer: What does he want
        rationale: "\"He\" + \"does\" + \"want\" (base). \"Does want\" absorve o \"-s\" da 3ª pessoa."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Onde fica a escola?
        correctAnswer: Where is the school
        rationale: "Localização fixa usa \"to be\" — \"where is\". Edifício específico → \"the school\"."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Quando é seu aniversário?
        correctAnswer: When is your birthday
        rationale: "\"Birthday\" é contável singular — com possessivo \"your\", sem artigo."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: O que ela estuda?
        correctAnswer: What does she study
        rationale: "\"She\" — \"does\" + \"study\" base. Nunca \"does studies\"."
        difficulty: 2
        objectives: [A1.grammar.wh_questions]
  - pageNumber: 2
    title: Who, Why, How
    description: Translate questions with who, why, and how.
    exercises:
      - type: english_phrases
        question: Quem é você?
        correctAnswer: Who are you
        rationale: "\"Who\" (quem/pessoa) + \"are\" + \"you\". Identifica pessoa, não coisa."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Por que ele está triste?
        correctAnswer: Why is he sad
        rationale: "\"Why\" + \"is\" + sujeito + adjetivo. \"Because\" introduz a resposta."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Como você está?
        correctAnswer: How are you
        rationale: "\"How are you\" — saudação fixa. Respostas padrão — fine/good/great."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Quem mora aqui?
        correctAnswer: Who lives here
        rationale: "Quando \"who\" é sujeito — não há inversão. Verbo \"lives\" (3ª pessoa) segue normal."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Por que ela chora?
        correctAnswer: Why is she crying
        rationale: "\"Why is she\" + verbo-ing (present continuous). \"Cry\" — y vira i em flexões."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Como funciona?
        correctAnswer: How does it work
        rationale: "\"It\" (coisa/máquina) + \"does\" + \"work\" base. Para objetos genéricos."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Quem é seu professor?
        correctAnswer: Who is your teacher
        rationale: "\"Who\" + \"is\" + possessivo + substantivo. \"Teacher\" = professor/a de escola."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Por que estamos esperando?
        correctAnswer: Why are we waiting
        rationale: "\"Why are we\" + verbo-ing. Present continuous para ação no momento."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Como você aprende inglês?
        correctAnswer: How do you learn English
        rationale: "\"How do\" + sujeito + verbo base. \"Learn\" é verbo comum (exige \"do\")."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
      - type: english_phrases
        question: Quantos anos você tem?
        correctAnswer: How old are you
        rationale: "Inglês pergunta idade com \"how old\" + \"to be\" — \"quão velho é você\"."
        difficulty: 3
        objectives: [A1.grammar.wh_questions]
target: 20
