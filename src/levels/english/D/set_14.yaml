title: "💬 English D - Modal Verbs: Can/Could/Would"
level: D
subject: english
difficulty: 2
objectives:
  - A2.grammar.modals
authorNotes: Focuses on polite requests using can, could, and would. Could and would are more formal/polite than can.
repeatAll: 2
example: "Ex.: 'Você pode me ajudar?' → Can you help me?"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Making Requests
    description: Use can, could, and would for polite requests.
    exercises:
      - type: english_phrases
        question: Você pode me ajudar?
        correctAnswer: Can you help me?
        rationale: "'Can you...?' = pedido direto e informal. 'Help me' sem preposição."
        difficulty: 1
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Eu posso entrar?
        correctAnswer: Can I come in?
        rationale: "'Can I...?' pede permissão. 'Come in' = entrar (phrasal verb)."
        difficulty: 1
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você poderia repetir, por favor?
        correctAnswer: Could you repeat that, please?
        rationale: "'Could you...?' é mais educado que 'can'. 'Please' ao fim."
        difficulty: 1
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Eu poderia falar com o gerente?
        correctAnswer: Could I speak to the manager?
        rationale: "'Could I...?' pede permissão formalmente. 'Speak to' = falar com."
        difficulty: 2
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você poderia abrir a janela?
        correctAnswer: Could you open the window?
        rationale: "'Could you open...?' — pedido educado. 'Open the window' direto."
        difficulty: 2
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você gostaria de um café?
        correctAnswer: Would you like a coffee?
        rationale: "'Would you like...?' = oferecer algo. Mais formal que 'Do you want'."
        difficulty: 2
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você poderia me emprestar uma caneta?
        correctAnswer: Could you lend me a pen?
        rationale: "'Lend me a pen' — dois objetos (indireto + direto). 'Could' = educado."
        difficulty: 2
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você faria isso por mim?
        correctAnswer: Would you do that for me?
        rationale: "'Would you do...?' = pedido cortês. 'For me' ao fim."
        difficulty: 2
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você pode falar mais devagar?
        correctAnswer: Can you speak more slowly?
        rationale: "'Speak more slowly' — 'slowly' (advérbio). 'More slowly' correto."
        difficulty: 2
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você gostaria de sentar?
        correctAnswer: Would you like to sit down?
        rationale: "'Would you like to + infinitivo'. 'Sit down' = sentar-se (phrasal)."
        difficulty: 2
        objectives: [A2.grammar.modals]
  - pageNumber: 2
    title: Formal and Extended Requests
    description: More complex polite expressions.
    exercises:
      - type: english_phrases
        question: Eu poderia usar o seu telefone?
        correctAnswer: Could I use your phone?
        rationale: "'Could I use...?' = permissão educada. 'Your phone' sem artigo."
        difficulty: 2
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você poderia me dizer onde fica o banheiro?
        correctAnswer: Could you tell me where the bathroom is?
        rationale: "Pergunta indireta: 'where the bathroom is' (ordem afirmativa)."
        difficulty: 3
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você gostaria de tentar de novo?
        correctAnswer: Would you like to try again?
        rationale: "'Would you like to try again?' — 'try again' = tentar de novo."
        difficulty: 3
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você pode esperar um momento?
        correctAnswer: Can you wait a moment?
        rationale: "'Wait a moment' sem preposição em inglês. 'Can you' = pedido direto."
        difficulty: 2
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você poderia verificar isso para mim?
        correctAnswer: Could you check that for me?
        rationale: "'Check that for me' — 'for me' indica beneficiário."
        difficulty: 3
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você gostaria de vir à festa?
        correctAnswer: Would you like to come to the party?
        rationale: "'Come to the party' — 'to' antes de evento/lugar."
        difficulty: 3
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você poderia me ajudar com isso?
        correctAnswer: Could you help me with this?
        rationale: "'Help me with this' — 'with' indica o assunto da ajuda."
        difficulty: 3
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você pode fechar a porta?
        correctAnswer: Can you close the door?
        rationale: "'Close the door' — pedido informal e direto com 'can'."
        difficulty: 2
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você gostaria de mais água?
        correctAnswer: Would you like some more water?
        rationale: "'Some more water' — 'some more' em oferta. 'Water' incontável."
        difficulty: 3
        objectives: [A2.grammar.modals]
      - type: english_phrases
        question: Você poderia ligar para mim mais tarde?
        correctAnswer: Could you call me later?
        rationale: "'Call me later' — objeto direto + advérbio de tempo ao fim."
        difficulty: 3
        objectives: [A2.grammar.modals]
target: 20
