title: English D - Irregular Comparison
level: D
subject: english
difficulty: 3
objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
authorNotes: good/better/best, bad/worse/worst, far/farther/farthest, many-much/more/most, little/less/least.
repeatAll: 2
example: "Melhor que ontem → Better than yesterday"
pages:
  - pageNumber: 1
    title: Better / Worse / More / Less
    description: Irregular comparatives.
    exercises:
      - { type: english_phrases, question: "Melhor que ontem", correctAnswer: better than yesterday }
      - { type: english_phrases, question: "Pior que o anterior", correctAnswer: worse than the previous one }
      - { type: english_phrases, question: "Mais dinheiro que eu", correctAnswer: more money than me }
      - { type: english_phrases, question: "Menos tempo que você", correctAnswer: less time than you }
      - { type: english_phrases, question: "Mais longe que eu pensava", correctAnswer: farther than i thought }
      - { type: english_phrases, question: "Melhor agora", correctAnswer: better now }
      - { type: english_phrases, question: "Menos ruído que antes", correctAnswer: less noise than before }
      - { type: english_phrases, question: "Mais amigos que nunca", correctAnswer: more friends than ever }
      - { type: english_phrases, question: "Pior que imaginei", correctAnswer: worse than i imagined }
      - { type: english_phrases, question: "Muito melhor", correctAnswer: much better }
  - pageNumber: 2
    title: Best / Worst / Most / Least
    description: Irregular superlatives.
    exercises:
      - { type: english_phrases, question: "O melhor dia", correctAnswer: the best day }
      - { type: english_phrases, question: "O pior filme", correctAnswer: the worst movie }
      - { type: english_phrases, question: "A maior parte do tempo", correctAnswer: most of the time }
      - { type: english_phrases, question: "A menor quantidade", correctAnswer: the least amount }
      - { type: english_phrases, question: "O mais distante", correctAnswer: the farthest }
      - { type: english_phrases, question: "Meu melhor amigo", correctAnswer: my best friend }
      - { type: english_phrases, question: "O pior resultado", correctAnswer: the worst result }
      - { type: english_phrases, question: "A maioria das pessoas", correctAnswer: most people }
      - { type: english_phrases, question: "O que eu menos gosto", correctAnswer: what i like the least }
      - { type: english_phrases, question: "O melhor do mundo", correctAnswer: the best in the world }
target: 20
