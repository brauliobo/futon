title: English D - Irregular Comparison
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.comparatives
  - A2.grammar.superlatives
authorNotes: good/better/best, bad/worse/worst, far/farther/farthest, many-much/more/most, little/less/least.
repeatAll: 2
example: Melhor que ontem → Better than yesterday
pages:
  - pageNumber: 1
    title: Better / Worse / More / Less
    description: Irregular comparatives.
    exercises:
      - type: english_phrases
        question: Melhor que ontem
        correctAnswer: better than yesterday
        rationale: "Good → better → the best. Decorar."
      - type: english_phrases
        question: Pior que o anterior
        correctAnswer: worse than the previous one
        rationale: "Bad → worse → the worst."
      - type: english_phrases
        question: Mais dinheiro que eu
        correctAnswer: more money than me
        rationale: "Little → less → the least (quantidade)."
      - type: english_phrases
        question: Menos tempo que você
        correctAnswer: less time than you
        rationale: "Much/many → more → the most."
      - type: english_phrases
        question: Mais longe que eu pensava
        correctAnswer: farther than i thought
        rationale: "Irregulares nunca levam '-er' ou 'more'."
      - type: english_phrases
        question: Melhor agora
        correctAnswer: better now
        rationale: "'Worse' já é comparativo; 'the worst' já superlativo."
      - type: english_phrases
        question: Menos ruído que antes
        correctAnswer: less noise than before
        rationale: "Much/many → more → the most."
      - type: english_phrases
        question: Mais amigos que nunca
        correctAnswer: more friends than ever
        rationale: "Tabela: good/better/best; bad/worse/worst."
      - type: english_phrases
        question: Pior que imaginei
        correctAnswer: worse than i imagined
        rationale: "'Worse' já é comparativo; 'the worst' já superlativo."
      - type: english_phrases
        question: Muito melhor
        correctAnswer: much better
        rationale: "Irregulares nunca levam '-er' ou 'more'."
  - pageNumber: 2
    title: Best / Worst / Most / Least
    description: Irregular superlatives.
    exercises:
      - type: english_phrases
        question: O melhor dia
        correctAnswer: the best day
        rationale: "Far → farther/further → the farthest/furthest."
      - type: english_phrases
        question: O pior filme
        correctAnswer: the worst movie
        rationale: "'Worse' já é comparativo; 'the worst' já superlativo."
      - type: english_phrases
        question: A maior parte do tempo
        correctAnswer: most of the time
        rationale: "Good → better → the best. Decorar."
      - type: english_phrases
        question: A menor quantidade
        correctAnswer: the least amount
        rationale: "Evite 'gooder' ou 'baddest'."
      - type: english_phrases
        question: O mais distante
        correctAnswer: the farthest
        rationale: "Much/many → more → the most."
      - type: english_phrases
        question: Meu melhor amigo
        correctAnswer: my best friend
        rationale: "Old → older/elder → the oldest/eldest."
      - type: english_phrases
        question: O pior resultado
        correctAnswer: the worst result
        rationale: "Bad → worse → the worst."
      - type: english_phrases
        question: A maioria das pessoas
        correctAnswer: most people
        rationale: "Good → better → the best. Decorar."
      - type: english_phrases
        question: O que eu menos gosto
        correctAnswer: what i like the least
        rationale: "Far → farther/further → the farthest/furthest."
      - type: english_phrases
        question: O melhor do mundo
        correctAnswer: the best in the world
        rationale: "Good → better → the best. Decorar."
target: 20
