title: English D - Irregular Comparison
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.comparatives
  - A2.grammar.superlatives
authorNotes: good/better/best, bad/worse/worst, far/farther/farthest, many-much/more/most, little/less/least.
repeatAll: 2
example: Melhor que ontem → Better than yesterday
pages:
  - pageNumber: 1
    title: Better / Worse / More / Less
    description: Irregular comparatives.
    exercises:
      - type: english_phrases
        question: Melhor que ontem
        correctAnswer: better than yesterday
        rationale: "'Good' é irregular: good → better. Nunca 'gooder' ou 'more good'."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Pior que o anterior
        correctAnswer: worse than the previous one
        rationale: "'Bad' → 'worse' (irregular). 'Worse', não 'badder'."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Mais dinheiro que eu
        correctAnswer: more money than me
        rationale: "'Money' é incontável → 'more money', não 'more moneys'."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Menos tempo que você
        correctAnswer: less time than you
        rationale: "'Time' é incontável → 'less'. Use 'fewer' só com contáveis."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Mais longe que eu pensava
        correctAnswer: farther than i thought
        rationale: "'Far' → 'farther' (distância física). 'Further' para sentido abstrato."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Melhor agora
        correctAnswer: better now
        rationale: "'Better' sem 'than' quando não há 2º termo explícito. 'Good → better'."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Menos ruído que antes
        correctAnswer: less noise than before
        rationale: "'Noise' é incontável → 'less noise'. 'Before' = antes."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Mais amigos que nunca
        correctAnswer: more friends than ever
        rationale: "'Friends' é contável no plural → 'more'. 'Than ever' = que nunca."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Pior que imaginei
        correctAnswer: worse than i imagined
        rationale: "'Worse' (irregular de bad) + 'than I imagined'. Passado do verbo."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Muito melhor
        correctAnswer: much better
        rationale: "'Much' intensifica comparativo: 'much better'. Não 'very better'."
        difficulty: 2
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
  - pageNumber: 2
    title: Best / Worst / Most / Least
    description: Irregular superlatives.
    exercises:
      - type: english_phrases
        question: O melhor dia
        correctAnswer: the best day
        rationale: "'Good' → 'the best' (superlativo irregular). Nunca 'the goodest'."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: O pior filme
        correctAnswer: the worst movie
        rationale: "'Bad' → 'the worst'. 'Movie' = filme (AmE)."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: A maior parte do tempo
        correctAnswer: most of the time
        rationale: "'Most of the time' = expressão fixa, sem 'the' antes de 'most'."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: A menor quantidade
        correctAnswer: the least amount
        rationale: "'Little' → 'the least'. 'Amount' = quantidade (incontável)."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: O mais distante
        correctAnswer: the farthest
        rationale: "'Far' → 'the farthest'. Alternativa: 'the furthest'."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: Meu melhor amigo
        correctAnswer: My best friend
        rationale: "'My best friend' — possessivo substitui 'the'. 'Best' (irregular)."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: O pior resultado
        correctAnswer: the worst result
        rationale: "'Bad' → 'the worst'. 'Result' = resultado, countable."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: A maioria das pessoas
        correctAnswer: most people
        rationale: "'Most people' sem artigo e sem 'of the' quando genérico."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: O que eu menos gosto
        correctAnswer: What i like the least
        rationale: "'The least' = o mínimo. Após verbo: 'I like it the least'."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
      - type: english_phrases
        question: O melhor do mundo
        correctAnswer: the best in the world
        rationale: "'The best' + 'in the world' (lugar após superlativo usa 'in')."
        difficulty: 3
        objectives: [A2.grammar.comparatives, A2.grammar.superlatives]
target: 20
