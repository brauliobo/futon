title: English D - Future Negatives & Questions
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.future
  - A2.grammar.negation
  - A2.grammar.questions
authorNotes: won't / will not; am/is/are not going to; Will + subject + base verb; Are you going to...?
repeatAll: 2
example: Eu não vou sair → I will not go out
pages:
  - pageNumber: 1
    title: Negatives
    description: Will not and be not going to.
    exercises:
      - type: english_phrases
        question: Eu não vou sair
        correctAnswer: i will not go out
        rationale: "'Will not' + base 'go out'. Contração: 'won't go out'."
      - type: english_phrases
        question: Ela não vai esquecer
        correctAnswer: she will not forget
        rationale: "'Will not' invariável — sem 's' em 3ª pessoa. 'Forget' na base."
      - type: english_phrases
        question: Eles não vão vir
        correctAnswer: they will not come
        rationale: "'Come' na base após 'will not'. Contração padrão: 'won't come'."
      - type: english_phrases
        question: Não vai chover
        correctAnswer: it will not rain
        rationale: "Clima exige 'it' + 'will not rain'. Contração: 'it won't rain'."
      - type: english_phrases
        question: Eu não vou estudar hoje
        correctAnswer: i am not going to study today
        rationale: "Negativa 'going to': 'am + not + going to'. Plano negado."
      - type: english_phrases
        question: Nós não vamos comprar
        correctAnswer: we are not going to buy
        rationale: "'We are not going to' — plural com 'are'. Negativa de plano."
      - type: english_phrases
        question: Ele não vai trabalhar
        correctAnswer: he is not going to work
        rationale: "'He is not going to' — 3ª pessoa pede 'is'. Contração: 'isn't going to'."
      - type: english_phrases
        question: Você não vai gostar
        correctAnswer: you will not like it
        rationale: "'Like' exige objeto: 'like it', não só 'you will not like'."
      - type: english_phrases
        question: Eu nunca vou desistir
        correctAnswer: i will never give up
        rationale: "'Never' vai entre 'will' e verbo: 'will never give up'. 'Give up' = desistir."
      - type: english_phrases
        question: Não vou demorar
        correctAnswer: i will not take long
        rationale: "'Take long' = demorar (expressão fixa). 'Will not take long'."
  - pageNumber: 2
    title: Questions
    description: Will you / Are you going to questions.
    exercises:
      - type: english_phrases
        question: Você vai estudar?
        correctAnswer: will you study
        rationale: "Pergunta com 'will': inversão 'will you + base'. Sem 'do you will'."
      - type: english_phrases
        question: Ela vai viajar?
        correctAnswer: is she going to travel
        rationale: "Pergunta 'going to': inverte 'be' → 'Is she going to'. Plano específico."
      - type: english_phrases
        question: Vocês vão vir?
        correctAnswer: are you going to come
        rationale: "'Are you going to come?' — 'you' plural usa 'are'. Plano futuro."
      - type: english_phrases
        question: Ele vai ajudar?
        correctAnswer: will he help
        rationale: "'Will he help?' — inverte modal antes do sujeito. 'Help' na base."
      - type: english_phrases
        question: Vai chover amanhã?
        correctAnswer: will it rain tomorrow
        rationale: "Clima + pergunta: 'Will it rain?'. 'Tomorrow' ao final."
      - type: english_phrases
        question: O que você vai fazer?
        correctAnswer: what are you going to do
        rationale: "Wh- + 'going to': 'What are you going to do?'. Inversão do 'be'."
      - type: english_phrases
        question: Onde vocês vão?
        correctAnswer: where are you going
        rationale: "'Where are you going?' — pergunta com present continuous para plano."
      - type: english_phrases
        question: Quando ele vai chegar?
        correctAnswer: when will he arrive
        rationale: "Wh- + 'will': 'When will he arrive?'. 'Arrive' na base."
      - type: english_phrases
        question: Você vai me esperar?
        correctAnswer: will you wait for me
        rationale: "'Wait for me' — 'wait' exige preposição 'for' antes do objeto."
      - type: english_phrases
        question: Como vamos resolver isso?
        correctAnswer: how are we going to solve this
        rationale: "'How are we going to solve this?' — Wh- + 'be' + 'going to' + base."
target: 20
