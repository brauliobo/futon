title: English D - Future Negatives & Questions
level: D
subject: english
difficulty: 3
objectives: [A2.grammar.future, A2.grammar.negation, A2.grammar.questions]
authorNotes: won't / will not; am/is/are not going to; Will + subject + base verb; Are you going to...?
repeatAll: 2
example: "Eu não vou sair → I will not go out"
pages:
  - pageNumber: 1
    title: Negatives
    description: Will not and be not going to.
    exercises:
      - { type: english_phrases, question: "Eu não vou sair", correctAnswer: i will not go out }
      - { type: english_phrases, question: "Ela não vai esquecer", correctAnswer: she will not forget }
      - { type: english_phrases, question: "Eles não vão vir", correctAnswer: they will not come }
      - { type: english_phrases, question: "Não vai chover", correctAnswer: it will not rain }
      - { type: english_phrases, question: "Eu não vou estudar hoje", correctAnswer: i am not going to study today }
      - { type: english_phrases, question: "Nós não vamos comprar", correctAnswer: we are not going to buy }
      - { type: english_phrases, question: "Ele não vai trabalhar", correctAnswer: he is not going to work }
      - { type: english_phrases, question: "Você não vai gostar", correctAnswer: you will not like it }
      - { type: english_phrases, question: "Eu nunca vou desistir", correctAnswer: i will never give up }
      - { type: english_phrases, question: "Não vou demorar", correctAnswer: i will not take long }
  - pageNumber: 2
    title: Questions
    description: Will you / Are you going to questions.
    exercises:
      - { type: english_phrases, question: "Você vai estudar?", correctAnswer: will you study }
      - { type: english_phrases, question: "Ela vai viajar?", correctAnswer: is she going to travel }
      - { type: english_phrases, question: "Vocês vão vir?", correctAnswer: are you going to come }
      - { type: english_phrases, question: "Ele vai ajudar?", correctAnswer: will he help }
      - { type: english_phrases, question: "Vai chover amanhã?", correctAnswer: will it rain tomorrow }
      - { type: english_phrases, question: "O que você vai fazer?", correctAnswer: what are you going to do }
      - { type: english_phrases, question: "Onde vocês vão?", correctAnswer: where are you going }
      - { type: english_phrases, question: "Quando ele vai chegar?", correctAnswer: when will he arrive }
      - { type: english_phrases, question: "Você vai me esperar?", correctAnswer: will you wait for me }
      - { type: english_phrases, question: "Como vamos resolver isso?", correctAnswer: how are we going to solve this }
target: 20
