title: English D - Modal Verbs (can, must, should)
level: D
subject: english
repeatAll: 2
example: "Can, must, should express ability, necessity, advice."
pages:
  - pageNumber: 1
    title: Can / Cannot (ability)
    description: Translate using can/cannot.
    exercises:
      - { type: english_phrases, question: "Eu posso correr", correctAnswer: i can run }
      - { type: english_phrases, question: "Você pode ler", correctAnswer: you can read }
      - { type: english_phrases, question: "Ele pode cantar", correctAnswer: he can sing }
      - { type: english_phrases, question: "Ela pode nadar", correctAnswer: she can swim }
      - { type: english_phrases, question: "Nós podemos dançar", correctAnswer: we can dance }
      - { type: english_phrases, question: "Eu não posso voar", correctAnswer: i cannot fly }
      - { type: english_phrases, question: "Ele não pode ver", correctAnswer: he cannot see }
      - { type: english_phrases, question: "Você pode me ajudar?", correctAnswer: can you help me }
      - { type: english_phrases, question: "Eles podem vir?", correctAnswer: can they come }
      - { type: english_phrases, question: "Eu posso tentar", correctAnswer: i can try }
  - pageNumber: 2
    title: Must / Should (obligation & advice)
    description: Translate using must/should.
    exercises:
      - { type: english_phrases, question: "Eu devo estudar", correctAnswer: i must study }
      - { type: english_phrases, question: "Você deve esperar", correctAnswer: you must wait }
      - { type: english_phrases, question: "Nós devemos ir", correctAnswer: we must go }
      - { type: english_phrases, question: "Ele deveria descansar", correctAnswer: he should rest }
      - { type: english_phrases, question: "Você deveria tentar", correctAnswer: you should try }
      - { type: english_phrases, question: "Nós deveríamos ajudar", correctAnswer: we should help }
      - { type: english_phrases, question: "Eu não devo esquecer", correctAnswer: i must not forget }
      - { type: english_phrases, question: "Você não deveria correr", correctAnswer: you should not run }
      - { type: english_phrases, question: "Ele deve estar em casa", correctAnswer: he must be at home }
      - { type: english_phrases, question: "Eu deveria ligar?", correctAnswer: should i call }
target: 20
