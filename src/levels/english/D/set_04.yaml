title: English D - Modal Verbs (can, must, should)
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.comparatives
repeatAll: 2
authorNotes: "English D - Modal Verbs (can, must, should). Foque no conceito central do conjunto e nos erros comuns."
example: "Can, must, should express ability, necessity, advice. Ex.: Eu posso correr → I can run."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Can / Cannot (ability)
    description: Translate using can/cannot.
    exercises:
      - type: english_phrases
        question: Eu posso correr
        correctAnswer: I can run
        rationale: "'Can' + verbo base 'run'. Nunca 'I can to run' nem 'I can running'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Você pode ler
        correctAnswer: You can read
        rationale: "'Can' + 'read' (base). 'You' pede mesma forma que 'I': sem '-s'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Ele pode cantar
        correctAnswer: He can sing
        rationale: "'He can sing' — com 'he' o 'can' é invariável: não 'he cans'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Ela pode nadar
        correctAnswer: She can swim
        rationale: "'She can swim' — modal 'can' não recebe '-s' na 3ª pessoa."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Nós podemos dançar
        correctAnswer: We can dance
        rationale: "'We can dance' — modal + base, sem 'to' entre 'can' e 'dance'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Eu não posso voar
        correctAnswer: I cannot fly
        rationale: "Negativa: 'cannot' é escrito junto (uma palavra). Contração: can't."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Ele não pode ver
        correctAnswer: He cannot see
        rationale: "'He cannot see' — 'cannot' invariável, sem 'doesn't can'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Você pode me ajudar?
        correctAnswer: Can you help me
        rationale: "Pergunta com modal: inverte-se 'can you...?', sem 'do you can'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Eles podem vir?
        correctAnswer: Can they come
        rationale: "'Can they come?' — modal antes do sujeito em perguntas."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Eu posso tentar
        correctAnswer: I can try
        rationale: "'I can try' — 'try' na base. 'Can' expressa possibilidade/oferta."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
  - pageNumber: 2
    title: Must / Should (obligation & advice)
    description: Translate using must/should.
    exercises:
      - type: english_phrases
        question: Eu devo estudar
        correctAnswer: I must study
        rationale: "'Must' = obrigação forte. 'Study' na base, sem 'to'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Você deve esperar
        correctAnswer: You must wait
        rationale: "'You must wait' — obrigação clara. Mais forte que 'should'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Nós devemos ir
        correctAnswer: We must go
        rationale: "'We must go' — 'go' na base. 'Must' não tem forma conjugada."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Ele deveria descansar
        correctAnswer: He should rest
        rationale: "'Should' = conselho/recomendação, mais brando que 'must'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Você deveria tentar
        correctAnswer: You should try
        rationale: "'You should try' = sugestão. Diferente de 'you must try' (obrigação)."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Nós deveríamos ajudar
        correctAnswer: We should help
        rationale: "'Should' cobre 'deveria' em PT. Sem 'to': 'should help'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Eu não devo esquecer
        correctAnswer: I must not forget
        rationale: "'Must not' = proibição/obrigação negativa. Contração: 'mustn't'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Você não deveria correr
        correctAnswer: You should not run
        rationale: "'Should not' = conselho negativo. Contração: 'shouldn't'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Ele deve estar em casa
        correctAnswer: He must be at home
        rationale: "'Must be' = dedução lógica ('deve estar'). 'At home' sem 'the'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Eu deveria ligar?
        correctAnswer: Should I call
        rationale: "'Should I call?' — modal antes do sujeito em pergunta, sem 'do'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
target: 20
