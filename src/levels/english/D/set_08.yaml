title: English D - Comparatives (-er / more)
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.comparatives
authorNotes: Short adjectives add -er; adjectives with 2+ syllables use 'more'. Pattern — X is -er/more ... than Y.
repeatAll: 2
example: Mais alto que → Taller than
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Short Adjectives (+ -er)
    description: One-syllable adjectives add -er.
    exercises:
      - type: english_phrases
        question: Mais alto que você
        correctAnswer: Taller than you
        rationale: "'Tall' + -er + 'than you'. Comparativo sempre com 'than' em PT = 'que'."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais rápido que um carro
        correctAnswer: Faster than a car
        rationale: "'Fast' + -er. Artigo 'a' antes de 'car' (consoante)."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais velho que ela
        correctAnswer: Older than her
        rationale: "'Old' + -er. Após 'than' usa pronome objeto: 'her', não 'she'."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais novo que ele
        correctAnswer: Younger than him
        rationale: "'Young' + -er + 'him' (pronome objeto depois de 'than')."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais forte que nós
        correctAnswer: Stronger than us
        rationale: "'Strong' + -er. 'Us' (objeto) após 'than', não 'we'."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais barato que isso
        correctAnswer: Cheaper than that
        rationale: "'Cheap' + -er. 'That' = isso/aquilo para referência distante."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais frio que ontem
        correctAnswer: Colder than yesterday
        rationale: "'Cold' + -er. 'Yesterday' sem preposição — advérbio direto."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais quente que o verão
        correctAnswer: Hotter than summer
        rationale: "'Hot' dobra o 't': hotter (CVC tônica). Estações sem artigo em geral."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais longo que o rio
        correctAnswer: Longer than the river
        rationale: "'Long' + -er. 'The river' — rios específicos pedem 'the'."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais curto que um minuto
        correctAnswer: Shorter than a minute
        rationale: "'Short' + -er. 'A minute' — indefinido antes de consoante."
        difficulty: 2
        objectives: [A2.grammar.comparatives]
  - pageNumber: 2
    title: Long Adjectives (more + ...)
    description: Two or more syllables use 'more'.
    exercises:
      - type: english_phrases
        question: Mais interessante que o livro
        correctAnswer: More interesting than the book
        rationale: "'Interesting' (4 sílabas) → 'more', nunca 'interestinger'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais caro que o outro
        correctAnswer: More expensive than the other
        rationale: "'Expensive' é longo → 'more expensive'. Não 'expensiver'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais difícil que a prova
        correctAnswer: More difficult than the test
        rationale: "'Difficult' (3 sílabas) → 'more difficult'. 'Test' = prova."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais bonito que uma foto
        correctAnswer: More beautiful than a picture
        rationale: "'Beautiful' → 'more beautiful'. 'A picture' (consoante)."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais cansativo que correr
        correctAnswer: More tiring than running
        rationale: "'Tiring' = cansativo (adj). Após 'than', verbo vira gerúndio: 'running'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais popular que antes
        correctAnswer: More popular than before
        rationale: "'Popular' (3 sílabas) → 'more'. 'Before' = antes, sem preposição."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais importante que dinheiro
        correctAnswer: More important than money
        rationale: "'Important' é longo → 'more'. 'Money' incontável, sem artigo."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais perigoso que pular
        correctAnswer: More dangerous than jumping
        rationale: "'Dangerous' → 'more'. Após 'than', ação vira -ing: 'jumping'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais famoso que o rei
        correctAnswer: More famous than the king
        rationale: "'Famous' → 'more famous'. 'The king' — título específico com 'the'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: Mais útil que um mapa
        correctAnswer: More useful than a map
        rationale: "'Useful' (2 sílabas, termina -ful) → 'more useful'. 'A map' (consoante)."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
target: 20
