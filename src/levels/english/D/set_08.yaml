title: English D - Comparatives (-er / more)
level: D
subject: english
difficulty: 2
objectives: [A2.grammar.comparatives]
authorNotes: Short adjectives add -er; adjectives with 2+ syllables use 'more'. Pattern — X is -er/more ... than Y.
repeatAll: 2
example: "Mais alto que → Taller than"
pages:
  - pageNumber: 1
    title: Short Adjectives (+ -er)
    description: One-syllable adjectives add -er.
    exercises:
      - { type: english_phrases, question: "Mais alto que você", correctAnswer: taller than you }
      - { type: english_phrases, question: "Mais rápido que um carro", correctAnswer: faster than a car }
      - { type: english_phrases, question: "Mais velho que ela", correctAnswer: older than her }
      - { type: english_phrases, question: "Mais novo que ele", correctAnswer: younger than him }
      - { type: english_phrases, question: "Mais forte que nós", correctAnswer: stronger than us }
      - { type: english_phrases, question: "Mais barato que isso", correctAnswer: cheaper than that }
      - { type: english_phrases, question: "Mais frio que ontem", correctAnswer: colder than yesterday }
      - { type: english_phrases, question: "Mais quente que o verão", correctAnswer: hotter than summer }
      - { type: english_phrases, question: "Mais longo que o rio", correctAnswer: longer than the river }
      - { type: english_phrases, question: "Mais curto que um minuto", correctAnswer: shorter than a minute }
  - pageNumber: 2
    title: Long Adjectives (more + ...)
    description: Two or more syllables use 'more'.
    exercises:
      - { type: english_phrases, question: "Mais interessante que o livro", correctAnswer: more interesting than the book }
      - { type: english_phrases, question: "Mais caro que o outro", correctAnswer: more expensive than the other }
      - { type: english_phrases, question: "Mais difícil que a prova", correctAnswer: more difficult than the test }
      - { type: english_phrases, question: "Mais bonito que uma foto", correctAnswer: more beautiful than a picture }
      - { type: english_phrases, question: "Mais cansativo que correr", correctAnswer: more tiring than running }
      - { type: english_phrases, question: "Mais popular que antes", correctAnswer: more popular than before }
      - { type: english_phrases, question: "Mais importante que dinheiro", correctAnswer: more important than money }
      - { type: english_phrases, question: "Mais perigoso que pular", correctAnswer: more dangerous than jumping }
      - { type: english_phrases, question: "Mais famoso que o rei", correctAnswer: more famous than the king }
      - { type: english_phrases, question: "Mais útil que um mapa", correctAnswer: more useful than a map }
target: 20
