title: English D - Future Tense
level: D
subject: english
repeatAll: 2
example: "Future tense with 'will'. Ex.: Eu vou correr → I will run"
pages:
  - pageNumber: 1
    title: Future with "will"
    description: Translate sentences about the future.
    exercises:
      - { type: english_phrases, question: "Eu vou correr", correctAnswer: i will run }
      - { type: english_phrases, question: "Ele vai jogar", correctAnswer: he will play }
      - { type: english_phrases, question: "Ela vai estudar", correctAnswer: she will study }
      - { type: english_phrases, question: "Nós vamos comer", correctAnswer: we will eat }
      - { type: english_phrases, question: "Eles vão viajar", correctAnswer: they will travel }
      - { type: english_phrases, question: "Amanhã eu irei", correctAnswer: tomorrow i will go }
      - { type: english_phrases, question: "Vai chover", correctAnswer: it will rain }
      - { type: english_phrases, question: "Eu vou ajudar você", correctAnswer: i will help you }
      - { type: english_phrases, question: "Vamos ganhar", correctAnswer: we will win }
      - { type: english_phrases, question: "Eu vou aprender inglês", correctAnswer: i will learn english }
  - pageNumber: 2
    title: Future with "going to"
    description: Translate using "going to".
    exercises:
      - { type: english_phrases, question: "Eu vou dormir", correctAnswer: i am going to sleep }
      - { type: english_phrases, question: "Ele vai ler", correctAnswer: he is going to read }
      - { type: english_phrases, question: "Ela vai cantar", correctAnswer: she is going to sing }
      - { type: english_phrases, question: "Nós vamos dançar", correctAnswer: we are going to dance }
      - { type: english_phrases, question: "Eles vão trabalhar", correctAnswer: they are going to work }
      - { type: english_phrases, question: "Vai fazer sol", correctAnswer: it is going to be sunny }
      - { type: english_phrases, question: "Eu vou comprar um livro", correctAnswer: i am going to buy a book }
      - { type: english_phrases, question: "Ela vai visitar a avó", correctAnswer: she is going to visit grandma }
      - { type: english_phrases, question: "Vamos jogar futebol", correctAnswer: we are going to play soccer }
      - { type: english_phrases, question: "Eles vão cozinhar", correctAnswer: they are going to cook }
target: 20
