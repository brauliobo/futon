title: English D - Future Tense
level: D
subject: english
repeatAll: 2
example: "Future tense with 'will'. Ex.: Eu vou correr → I will run"
pages:
  - pageNumber: 1
    title: Future with "will"
    description: Translate sentences about the future.
    exercises:
      - type: english_phrases
        question: Eu vou correr
        correctAnswer: i will run
        rationale: "Futuro com 'will' + verbo no infinitivo sem 'to'. Não conjugue: 'I will run', nunca 'I will to run'."
      - type: english_phrases
        question: Ele vai jogar
        correctAnswer: he will play
        rationale: "'Will' é invariável: mesmo com 'he/she/it' não recebe '-s'. Diga 'he will play', não 'he wills'."
      - type: english_phrases
        question: Ela vai estudar
        correctAnswer: she will study
        rationale: "Futuro 'will' não muda no feminino nem exige 'to'. O verbo segue na forma base: 'study'."
      - type: english_phrases
        question: Nós vamos comer
        correctAnswer: we will eat
        rationale: "'Vamos + verbo' em PT vira 'will + verbo' no inglês. Evite traduzir por 'we go eat'."
      - type: english_phrases
        question: Eles vão viajar
        correctAnswer: they will travel
        rationale: "'Vão' indicando futuro = 'will'. Não confunda com presente de movimento ('they go')."
      - type: english_phrases
        question: Amanhã eu irei
        correctAnswer: tomorrow i will go
        rationale: "Advérbio de tempo pode abrir a frase, mas o sujeito ainda precede 'will': 'Tomorrow I will go'."
      - type: english_phrases
        question: Vai chover
        correctAnswer: it will rain
        rationale: "Fenômenos meteorológicos usam 'it' como sujeito obrigatório. Em inglês não existe sujeito oculto."
      - type: english_phrases
        question: Eu vou ajudar você
        correctAnswer: i will help you
        rationale: "Pronome objeto vem após o verbo: 'help you'. Evite calque 'I will you help'."
      - type: english_phrases
        question: Vamos ganhar
        correctAnswer: we will win
        rationale: "'Ganhar' no sentido de vencer = 'win' (não 'earn' nem 'gain'). 'Earn' é ganhar dinheiro."
      - type: english_phrases
        question: Eu vou aprender inglês
        correctAnswer: i will learn english
        rationale: "Nomes de idiomas são sempre maiúsculos em inglês: 'English'. Use 'learn', não 'study', para aquisição."
  - pageNumber: 2
    title: Future with "going to"
    description: Translate using "going to".
    exercises:
      - type: english_phrases
        question: Eu vou dormir
        correctAnswer: i am going to sleep
        rationale: "'Going to' exige o verbo 'be' conjugado: 'I am going to'. Não omita o 'am'."
      - type: english_phrases
        question: Ele vai ler
        correctAnswer: he is going to read
        rationale: "Com 'he/she/it' use 'is going to'. Cuidado: o auxiliar muda, mas 'going to' permanece."
      - type: english_phrases
        question: Ela vai cantar
        correctAnswer: she is going to sing
        rationale: "'She is going to sing' — 'sing' na base. Nunca 'she is going to sings'."
      - type: english_phrases
        question: Nós vamos dançar
        correctAnswer: we are going to dance
        rationale: "Plural 'we/you/they' pede 'are going to'. Erro comum: 'we is going to'."
      - type: english_phrases
        question: Eles vão trabalhar
        correctAnswer: they are going to work
        rationale: "'Eles vão' = 'they are going to', não 'they go to'. 'Going to' sinaliza plano/intenção."
      - type: english_phrases
        question: Vai fazer sol
        correctAnswer: it is going to be sunny
        rationale: "Clima usa 'it' + 'be': 'it is going to be sunny'. 'Sunny' é adjetivo, por isso precisa de 'be'."
      - type: english_phrases
        question: Eu vou comprar um livro
        correctAnswer: i am going to buy a book
        rationale: "Artigo indefinido 'a' antes de consoante ('book'). Não esqueça o 'a' — inglês exige artigo."
      - type: english_phrases
        question: Ela vai visitar a avó
        correctAnswer: she is going to visit grandma
        rationale: "'Grandma' como nome próprio afetivo dispensa 'the'. Em PT usamos 'a avó', em EN não."
      - type: english_phrases
        question: Vamos jogar futebol
        correctAnswer: we are going to play soccer
        rationale: "Esportes com 'play' não levam artigo: 'play soccer', não 'play the soccer'."
      - type: english_phrases
        question: Eles vão cozinhar
        correctAnswer: they are going to cook
        rationale: "'Cook' cobre tanto 'cozinhar' quanto 'cozinheiro'. Aqui é verbo: na base após 'going to'."
target: 20
