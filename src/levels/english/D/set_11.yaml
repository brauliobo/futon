title: English D - As ... As and Less ... Than
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.comparatives
authorNotes: Equality with 'as + adjective + as' and reduction with 'less ... than'.
repeatAll: 2
example: Tão alto quanto você → As tall as you
pages:
  - pageNumber: 1
    title: As ... As
    description: Equal comparison.
    exercises:
      - type: english_phrases
        question: Tão alto quanto você
        correctAnswer: as tall as you
        rationale: "'As tall as' — igualdade, adjetivo na forma base (não 'taller')."
      - type: english_phrases
        question: Tão rápido quanto um carro
        correctAnswer: as fast as a car
        rationale: "'As fast as a car' — 'fast' na base entre os dois 'as'."
      - type: english_phrases
        question: Tão inteligente quanto ela
        correctAnswer: as smart as her
        rationale: "Após 'as...as' usa-se pronome objeto coloquial: 'her', não 'she'."
      - type: english_phrases
        question: Tão caro quanto o outro
        correctAnswer: as expensive as the other
        rationale: "'As expensive as' — mesmo adjetivos longos ficam na base com 'as...as'."
      - type: english_phrases
        question: Tão forte quanto possível
        correctAnswer: as strong as possible
        rationale: "'As strong as possible' = o mais forte possível (expressão fixa)."
      - type: english_phrases
        question: Tão interessante quanto o livro
        correctAnswer: as interesting as the book
        rationale: "'As interesting as the book' — 'interesting' na base entre os 'as'."
      - type: english_phrases
        question: Tão cedo quanto possível
        correctAnswer: as soon as possible
        rationale: "'As soon as possible' (ASAP) — expressão fixa. 'Soon' = cedo/logo."
      - type: english_phrases
        question: Tão bom quanto novo
        correctAnswer: as good as new
        rationale: "'As good as new' — expressão idiomática para 'como novo'."
      - type: english_phrases
        question: Tão frio quanto gelo
        correctAnswer: as cold as ice
        rationale: "'As cold as ice' — comparação idiomática, sem artigo antes de 'ice'."
      - type: english_phrases
        question: Não tão alto quanto eu
        correctAnswer: not as tall as me
        rationale: "'Not as...as' = negativa de igualdade = menos que. 'Me' (objeto)."
  - pageNumber: 2
    title: Less ... Than
    description: Comparison of inferiority.
    exercises:
      - type: english_phrases
        question: Menos caro que o anterior
        correctAnswer: less expensive than the previous
        rationale: "'Less + adjetivo + than'. 'Expensive' fica na base, sem -er."
      - type: english_phrases
        question: Menos difícil que pensei
        correctAnswer: less difficult than i thought
        rationale: "'Less difficult than' — 'thought' (past de think) encerra a frase."
      - type: english_phrases
        question: Menos barulhento que ontem
        correctAnswer: less noisy than yesterday
        rationale: "'Less noisy than yesterday' — 'noisy' (não 'noisier') após 'less'."
      - type: english_phrases
        question: Menos comum que antes
        correctAnswer: less common than before
        rationale: "'Less common than before' — 'common' na base, sem 'commoner'."
      - type: english_phrases
        question: Menos útil que este
        correctAnswer: less useful than this one
        rationale: "'This one' (pronome) para evitar repetir substantivo. 'Less useful'."
      - type: english_phrases
        question: Menos interessante que o filme
        correctAnswer: less interesting than the movie
        rationale: "'Less interesting than the movie' — nunca 'less interestinger'."
      - type: english_phrases
        question: Menos importante que você pensa
        correctAnswer: less important than you think
        rationale: "'Less important than you think' — 'think' no presente para opinião."
      - type: english_phrases
        question: Menos rápido que ele
        correctAnswer: less fast than him
        rationale: "'Less fast than him' — pronome objeto 'him' após 'than'."
      - type: english_phrases
        question: Menos cedo que ontem
        correctAnswer: less early than yesterday
        rationale: "'Less early than yesterday' — 'early' base, sem 'earlier'."
      - type: english_phrases
        question: Menos forte que antes
        correctAnswer: less strong than before
        rationale: "'Less strong than before' — 'strong' base (não 'stronger') após 'less'."
target: 20
