title: 🔤 English D - Subject & Object Questions
level: D
subject: english
difficulty: 2
objectives:
  - A2.grammar.questions
authorNotes: Distinguishes subject questions (who called?) from object questions (who did you call?). Subject questions have no auxiliary; object questions use did/does/do.
repeatAll: 2
example: "Ex.: 'Quem ligou?' → Who called?"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Subject Questions
    description: Ask about the subject — no auxiliary needed.
    exercises:
      - type: english_phrases
        question: Quem ligou?
        correctAnswer: Who called?
        rationale: "'Who' é sujeito → sem auxiliar. 'Called' na forma passada."
        difficulty: 1
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: Quem ganhou o jogo?
        correctAnswer: Who won the game?
        rationale: "'Who' é sujeito de 'won'. Sem 'did' — 'who' substitui o sujeito."
        difficulty: 1
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: O que aconteceu?
        correctAnswer: What happened?
        rationale: "'What' como sujeito → sem auxiliar. 'Happened' no simples passado."
        difficulty: 1
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: Quem quebrou o copo?
        correctAnswer: Who broke the glass?
        rationale: "'Who' = sujeito. 'Broke' (irregular de break). Sem 'did'."
        difficulty: 1
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: Quem mora aqui?
        correctAnswer: Who lives here?
        rationale: "'Who' sujeito no presente → 'lives' (3ª pessoa, -s). Sem 'does'."
        difficulty: 2
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: O que aconteceu ontem?
        correctAnswer: What happened yesterday?
        rationale: "'What' como sujeito no passado. 'Yesterday' ao fim."
        difficulty: 2
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: Quem me mandou mensagem?
        correctAnswer: Who sent me a message?
        rationale: "'Sent' (irregular de send). 'Who' = sujeito; sem auxiliar."
        difficulty: 2
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: O que te fez rir?
        correctAnswer: What made you laugh?
        rationale: "'What' = sujeito de 'made'. 'Make + objeto + infinitivo' (sem to)."
        difficulty: 2
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: Quem chegou primeiro?
        correctAnswer: Who arrived first?
        rationale: "'Who' sujeito. 'First' = primeiro (advérbio de ordem)."
        difficulty: 2
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: O que causou o problema?
        correctAnswer: What caused the problem?
        rationale: "'What' como sujeito. 'Caused' regular no passado."
        difficulty: 2
        objectives: [A2.grammar.questions]
  - pageNumber: 2
    title: Object Questions
    description: Ask about the object — auxiliary did/does required.
    exercises:
      - type: english_phrases
        question: Para quem você ligou?
        correctAnswer: Who did you call?
        rationale: "'Who' = objeto (você ligou para quem?). Auxiliar 'did' obrigatório."
        difficulty: 2
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: O que você comeu?
        correctAnswer: What did you eat?
        rationale: "'What' = objeto de 'eat'. Estrutura: What + did + sujeito + verbo base."
        difficulty: 2
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: Quem ela conhece?
        correctAnswer: Who does she know?
        rationale: "'Who' = objeto. Presente simples pede 'does' + she + verbo base."
        difficulty: 2
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: O que você quer?
        correctAnswer: What do you want?
        rationale: "'What' = objeto de 'want'. 'Do you' no presente simples."
        difficulty: 2
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: Quem você convidou?
        correctAnswer: Who did you invite?
        rationale: "'Who' = objeto (você convidou quem?). 'Did you invite' no passado."
        difficulty: 3
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: O que ele disse?
        correctAnswer: What did he say?
        rationale: "'Say' é verbo base após 'did'. 'Said' nunca após auxiliar."
        difficulty: 3
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: Quem você encontrou no mercado?
        correctAnswer: Who did you meet at the supermarket?
        rationale: "'Who' = objeto. 'Meet' → base após 'did'. 'At the supermarket'."
        difficulty: 3
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: O que eles estão construindo?
        correctAnswer: What are they building?
        rationale: "'What' = objeto no contínuo. Estrutura: What + are + they + -ing."
        difficulty: 3
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: Quem você está esperando?
        correctAnswer: Who are you waiting for?
        rationale: "Objeto no contínuo: 'Who are you waiting for?' — preposição ao fim."
        difficulty: 3
        objectives: [A2.grammar.questions]
      - type: english_phrases
        question: O que você vai fazer amanhã?
        correctAnswer: What are you going to do tomorrow?
        rationale: "'What are you going to do?' — objeto com 'going to'. 'Tomorrow' ao fim."
        difficulty: 3
        objectives: [A2.grammar.questions]
target: 20
