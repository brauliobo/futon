title: English D - Future Time Expressions
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.future
authorNotes: Tomorrow, next week/month/year, in + time, soon, later, by.
repeatAll: 2
example: Semana que vem → Next week
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Next, Tomorrow, Soon
    description: Close future anchors.
    exercises:
      - type: english_phrases
        question: Amanhã vou estudar
        correctAnswer: Tomorrow I will study
        rationale: "'Tomorrow' abre a frase mas o sujeito ainda precede 'will': 'Tomorrow I will'."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Semana que vem viajo
        correctAnswer: Next week I will travel
        rationale: "'Next week' = semana que vem, sem artigo ('the'). Não 'the next week'."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: No mês que vem
        correctAnswer: Next month
        rationale: "'Next month' sem artigo e sem preposição ('in'). Apenas 'next + tempo'."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Ano que vem ele se forma
        correctAnswer: Next year he will graduate
        rationale: "'Graduate' = formar-se. 'Next year' abre; 'he will' segue."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Nos vemos em breve
        correctAnswer: See you soon
        rationale: "Despedida fixa: 'See you soon'. 'Soon' = em breve, sem preposição."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Logo estará pronto
        correctAnswer: It will be ready soon
        rationale: "'Ready' exige 'be'. 'Soon' ao final da frase é o padrão."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Volto mais tarde
        correctAnswer: I will be back later
        rationale: "'Be back' = voltar. 'Later' = mais tarde, no fim da frase."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Até mais tarde
        correctAnswer: See you later
        rationale: "Despedida fixa: 'See you later'. 'Later' encerra a expressão."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Na próxima segunda
        correctAnswer: Next Monday
        rationale: "'Next Monday' — dias da semana em maiúscula. Sem 'on' com 'next'."
        difficulty: 2
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Amanhã à noite vamos jantar
        correctAnswer: Tomorrow night we will have dinner
        rationale: "'Tomorrow night' sem preposição. 'Have dinner' (não 'dine')."
        difficulty: 2
        objectives: [A2.grammar.future]
  - pageNumber: 2
    title: In + Time, By
    description: Distance in time and deadlines.
    exercises:
      - type: english_phrases
        question: Em dois dias
        correctAnswer: In two days
        rationale: "'In + período' = daqui a X. 'In two days' = daqui a dois dias."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Em uma hora
        correctAnswer: In an hour
        rationale: "'An hour' — 'h' mudo exige 'an' (som de vogal). 'In' = daqui a."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Em alguns minutos
        correctAnswer: In a few minutes
        rationale: "'A few' = alguns (contáveis). 'In' marca tempo à frente."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Até sexta-feira
        correctAnswer: By Friday
        rationale: "'By + dia' = até (prazo final). 'Friday' maiúscula. Não 'until'."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Até o final do dia
        correctAnswer: By the end of the day
        rationale: "'By the end of the day' — deadline. 'The' obrigatório com 'end of'."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Em 2030
        correctAnswer: In 2030
        rationale: "Anos usam 'in': 'in 2030'. Nunca 'on 2030' ou 'at 2030'."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Em três semanas
        correctAnswer: In three weeks
        rationale: "'In three weeks' = daqui a três semanas. 'In' com futuro."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Chego em dez minutos
        correctAnswer: I will arrive in ten minutes
        rationale: "'Arrive' sem preposição direta. 'In ten minutes' = daqui a 10 min."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Termino até amanhã
        correctAnswer: I will finish by tomorrow
        rationale: "'By tomorrow' = prazo-limite. 'By' ≠ 'until' (período contínuo)."
        difficulty: 3
        objectives: [A2.grammar.future]
      - type: english_phrases
        question: Até o natal
        correctAnswer: By christmas
        rationale: "'By Christmas' — feriado em maiúscula. 'By' = até lá como prazo."
        difficulty: 3
        objectives: [A2.grammar.future]
target: 20
