title: English D - Future Time Expressions
level: D
subject: english
difficulty: 2
objectives:
  - A2.grammar.future
authorNotes: Tomorrow, next week/month/year, in + time, soon, later, by.
repeatAll: 2
example: Semana que vem → Next week
pages:
  - pageNumber: 1
    title: Next, Tomorrow, Soon
    description: Close future anchors.
    exercises:
      - type: english_phrases
        question: Amanhã vou estudar
        correctAnswer: tomorrow i will study
        rationale: "'This weekend' sem 'the': 'este fim de semana'."
      - type: english_phrases
        question: Semana que vem viajo
        correctAnswer: next week i will travel
        rationale: "'Soon' indica em breve, sem precisão."
      - type: english_phrases
        question: No mês que vem
        correctAnswer: next month
        rationale: "'Tomorrow' pode abrir ou fechar a frase."
      - type: english_phrases
        question: Ano que vem ele se forma
        correctAnswer: next year he will graduate
        rationale: "Evite 'the' com dias/meses: 'on Monday'."
      - type: english_phrases
        question: Nos vemos em breve
        correctAnswer: see you soon
        rationale: "'Tomorrow' pode abrir ou fechar a frase."
      - type: english_phrases
        question: Logo estará pronto
        correctAnswer: it will be ready soon
        rationale: "'Next' não leva artigo: 'next week', não 'the next week'."
      - type: english_phrases
        question: Volto mais tarde
        correctAnswer: i will be back later
        rationale: "'Tomorrow' pode abrir ou fechar a frase."
      - type: english_phrases
        question: Até mais tarde
        correctAnswer: see you later
        rationale: "Diferença: 'later' (depois) x 'after' (depois de algo)."
      - type: english_phrases
        question: Na próxima segunda
        correctAnswer: next monday
        rationale: "'Soon' indica em breve, sem precisão."
      - type: english_phrases
        question: Amanhã à noite vamos jantar
        correctAnswer: tomorrow night we will have dinner
        rationale: "Diferença: 'later' (depois) x 'after' (depois de algo)."
  - pageNumber: 2
    title: In + Time, By
    description: Distance in time and deadlines.
    exercises:
      - type: english_phrases
        question: Em dois dias
        correctAnswer: in two days
        rationale: "'By + tempo' = até (prazo-limite)."
      - type: english_phrases
        question: Em uma hora
        correctAnswer: in an hour
        rationale: "Evite 'the' com dias/meses: 'on Monday'."
      - type: english_phrases
        question: Em alguns minutos
        correctAnswer: in a few minutes
        rationale: "'Tomorrow' pode abrir ou fechar a frase."
      - type: english_phrases
        question: Até sexta-feira
        correctAnswer: by friday
        rationale: "'Soon' indica em breve, sem precisão."
      - type: english_phrases
        question: Até o final do dia
        correctAnswer: by the end of the day
        rationale: "'Tonight' dispensa preposição: 'I'll study tonight'."
      - type: english_phrases
        question: Em 2030
        correctAnswer: in 2030
        rationale: "'This weekend' sem 'the': 'este fim de semana'."
      - type: english_phrases
        question: Em três semanas
        correctAnswer: in three weeks
        rationale: "'By + tempo' = até (prazo-limite)."
      - type: english_phrases
        question: Chego em dez minutos
        correctAnswer: i will arrive in ten minutes
        rationale: "'This weekend' sem 'the': 'este fim de semana'."
      - type: english_phrases
        question: Termino até amanhã
        correctAnswer: i will finish by tomorrow
        rationale: "'Next' não leva artigo: 'next week', não 'the next week'."
      - type: english_phrases
        question: Até o natal
        correctAnswer: by christmas
        rationale: "'In + período' = daqui a: 'in two hours'."
target: 20
