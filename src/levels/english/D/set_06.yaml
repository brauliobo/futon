title: English D - Future Time Expressions
level: D
subject: english
difficulty: 2
objectives: [A2.grammar.future]
authorNotes: Tomorrow, next week/month/year, in + time, soon, later, by.
repeatAll: 2
example: "Semana que vem → Next week"
pages:
  - pageNumber: 1
    title: Next, Tomorrow, Soon
    description: Close future anchors.
    exercises:
      - { type: english_phrases, question: "Amanhã vou estudar", correctAnswer: tomorrow i will study }
      - { type: english_phrases, question: "Semana que vem viajo", correctAnswer: next week i will travel }
      - { type: english_phrases, question: "No mês que vem", correctAnswer: next month }
      - { type: english_phrases, question: "Ano que vem ele se forma", correctAnswer: next year he will graduate }
      - { type: english_phrases, question: "Nos vemos em breve", correctAnswer: see you soon }
      - { type: english_phrases, question: "Logo estará pronto", correctAnswer: it will be ready soon }
      - { type: english_phrases, question: "Volto mais tarde", correctAnswer: i will be back later }
      - { type: english_phrases, question: "Até mais tarde", correctAnswer: see you later }
      - { type: english_phrases, question: "Na próxima segunda", correctAnswer: next monday }
      - { type: english_phrases, question: "Amanhã à noite vamos jantar", correctAnswer: tomorrow night we will have dinner }
  - pageNumber: 2
    title: In + Time, By
    description: Distance in time and deadlines.
    exercises:
      - { type: english_phrases, question: "Em dois dias", correctAnswer: in two days }
      - { type: english_phrases, question: "Em uma hora", correctAnswer: in an hour }
      - { type: english_phrases, question: "Em alguns minutos", correctAnswer: in a few minutes }
      - { type: english_phrases, question: "Até sexta-feira", correctAnswer: by friday }
      - { type: english_phrases, question: "Até o final do dia", correctAnswer: by the end of the day }
      - { type: english_phrases, question: "Em 2030", correctAnswer: in 2030 }
      - { type: english_phrases, question: "Em três semanas", correctAnswer: in three weeks }
      - { type: english_phrases, question: "Chego em dez minutos", correctAnswer: i will arrive in ten minutes }
      - { type: english_phrases, question: "Termino até amanhã", correctAnswer: i will finish by tomorrow }
      - { type: english_phrases, question: "Até o natal", correctAnswer: by christmas }
target: 20
