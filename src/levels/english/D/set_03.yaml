title: English D - Telling Time
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.comparatives
repeatAll: 2
authorNotes: "English D - Telling Time. Foque no conceito central do conjunto e nos erros comuns."
example: "What time is it? It's 3 o'clock. Ex.: 3:30 → Half past three."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Full Hours
    description: Tell time in English.
    exercises:
      - type: english_phrases
        question: 3:00
        correctAnswer: Three o clock
        rationale: "Hora cheia: 'three o'clock'. 'O'clock' só vale quando minutos = 00."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 5:00
        correctAnswer: Five o clock
        rationale: "'Five o'clock' — número por extenso + o'clock (abreviação de 'of the clock')."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 7:00
        correctAnswer: Seven o clock
        rationale: "'Seven o'clock' = 7:00. Não use 'hours': inglês prefere 'o'clock'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 9:00
        correctAnswer: Nine o clock
        rationale: "'Nine o'clock'. Evite 'the nine' — artigo não entra antes da hora."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 12:00
        correctAnswer: Twelve o clock
        rationale: "12:00 = 'twelve o'clock'. Pode ser 'noon' (meio-dia) ou 'midnight'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 1:00
        correctAnswer: One o clock
        rationale: "'One o'clock' — mesmo com 1, sem 'hour'. Sujeito implícito é 'it'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 6:00
        correctAnswer: Six o clock
        rationale: "'Six o'clock'. A construção 'número + o'clock' funciona de 1 a 12."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 8:00
        correctAnswer: Eight o clock
        rationale: "'Eight o'clock'. Pronúncia: /eɪt əˈklɒk/, o 'gh' é mudo."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 10:00
        correctAnswer: Ten o clock
        rationale: "'Ten o'clock' = 10:00. Relógio de 12 horas é o padrão oral."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 2:00
        correctAnswer: Two o clock
        rationale: "'Two o'clock' = 2:00. Número cardinal (não 'second')."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
  - pageNumber: 2
    title: Half Hours and Quarters
    description: Half past and quarter past/to.
    exercises:
      - type: english_phrases
        question: 3:30 (metade após 3)
        correctAnswer: Half past three
        rationale: "3:30 = 'half past three' — meia hora após as 3. 'Past' = depois."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 7:30
        correctAnswer: Half past seven
        rationale: "7:30 = 'half past seven'. Também cabe 'seven thirty' (digital)."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 2:15 (quinze após)
        correctAnswer: Quarter past two
        rationale: "2:15 = 'quarter past two'. 'A quarter' = 15 min (um quarto da hora)."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 5:15
        correctAnswer: Quarter past five
        rationale: "5:15 = 15 min após as 5 → 'quarter past five'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 4:45 (quinze para 5)
        correctAnswer: Quarter to five
        rationale: "4:45 = 15 min 'para' as 5 → 'quarter to five'. 'To' = antes."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 8:45
        correctAnswer: Quarter to nine
        rationale: "8:45 = faltam 15 para as 9 → 'quarter to nine' (não 'past eight')."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 6:30
        correctAnswer: Half past six
        rationale: "6:30 = 'half past six'. 'Half' sozinho já significa meia hora."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 10:15
        correctAnswer: Quarter past ten
        rationale: "10:15 = 'quarter past ten' — 15 min depois das 10."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 11:45
        correctAnswer: Quarter to twelve
        rationale: "11:45 = 'quarter to twelve' — faltam 15 para as 12, não 'past eleven'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_phrases
        question: 1:30
        correctAnswer: Half past one
        rationale: "1:30 = 'half past one'. Depois da hora cheia usa 'past'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
target: 20
