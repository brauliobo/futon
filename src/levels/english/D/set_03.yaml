title: English D - Telling Time
level: D
subject: english
repeatAll: 2
example: What time is it? It's 3 o'clock.
pages:
  - pageNumber: 1
    title: Full Hours
    description: Tell time in English.
    exercises:
      - type: english_phrases
        question: 3:00
        correctAnswer: three o clock
        rationale: "'O'clock' só em horas cheias."
      - type: english_phrases
        question: 5:00
        correctAnswer: five o clock
        rationale: "Meio-dia = noon; meia-noite = midnight."
      - type: english_phrases
        question: 7:00
        correctAnswer: seven o clock
        rationale: "Hora cheia: número + 'o'clock'. 'Three o'clock' = 3:00."
      - type: english_phrases
        question: 9:00
        correctAnswer: nine o clock
        rationale: "Use 'a.m.' até meio-dia e 'p.m.' após."
      - type: english_phrases
        question: 12:00
        correctAnswer: twelve o clock
        rationale: "'Half past' = e meia: 'half past two' = 2:30."
      - type: english_phrases
        question: 1:00
        correctAnswer: one o clock
        rationale: "Sempre use 'it' como sujeito para hora: 'It's five'."
      - type: english_phrases
        question: 6:00
        correctAnswer: six o clock
        rationale: "Minutos antes da hora usam 'to'; depois, 'past'."
      - type: english_phrases
        question: 8:00
        correctAnswer: eight o clock
        rationale: "Formato digital aceito: 'seven thirty' = 7:30."
      - type: english_phrases
        question: 10:00
        correctAnswer: ten o clock
        rationale: "Minutos antes da hora usam 'to'; depois, 'past'."
      - type: english_phrases
        question: 2:00
        correctAnswer: two o clock
        rationale: "Hora cheia: número + 'o'clock'. 'Three o'clock' = 3:00."
  - pageNumber: 2
    title: Half Hours and Quarters
    description: Half past and quarter past/to.
    exercises:
      - type: english_phrases
        question: 3:30 (metade após 3)
        correctAnswer: half past three
        rationale: "'O'clock' só em horas cheias."
      - type: english_phrases
        question: 7:30
        correctAnswer: half past seven
        rationale: "Formato digital aceito: 'seven thirty' = 7:30."
      - type: english_phrases
        question: 2:15 (quinze após)
        correctAnswer: quarter past two
        rationale: "'O'clock' só em horas cheias."
      - type: english_phrases
        question: 5:15
        correctAnswer: quarter past five
        rationale: "Use 'a.m.' até meio-dia e 'p.m.' após."
      - type: english_phrases
        question: 4:45 (quinze para 5)
        correctAnswer: quarter to five
        rationale: "Pergunta padrão: 'What time is it?'."
      - type: english_phrases
        question: 8:45
        correctAnswer: quarter to nine
        rationale: "'A quarter to' = quinze para; 'a quarter past' = e quinze."
      - type: english_phrases
        question: 6:30
        correctAnswer: half past six
        rationale: "Pergunta padrão: 'What time is it?'."
      - type: english_phrases
        question: 10:15
        correctAnswer: quarter past ten
        rationale: "Minutos antes da hora usam 'to'; depois, 'past'."
      - type: english_phrases
        question: 11:45
        correctAnswer: quarter to twelve
        rationale: "'Half past' = e meia: 'half past two' = 2:30."
      - type: english_phrases
        question: 1:30
        correctAnswer: half past one
        rationale: "Pergunta padrão: 'What time is it?'."
target: 20
