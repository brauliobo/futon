title: English D - Going to vs Will
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.future
authorNotes: "'Going to' for intentions and evidence-based predictions; 'will' for spontaneous decisions and general predictions."
repeatAll: 2
example: Vou estudar hoje → I am going to study today
pages:
  - pageNumber: 1
    title: Going to — Intentions
    description: Planned actions, intentions, and predictions from evidence.
    exercises:
      - type: english_phrases
        question: Eu vou estudar hoje
        correctAnswer: i am going to study today
        rationale: "'Going to' marca plano já decidido. 'Am' concorda com 'I'."
      - type: english_phrases
        question: Ela vai viajar amanhã
        correctAnswer: she is going to travel tomorrow
        rationale: "'She is going to' — 3ª pessoa pede 'is'. Plano futuro: 'going to'."
      - type: english_phrases
        question: Nós vamos comprar uma casa
        correctAnswer: we are going to buy a house
        rationale: "'We are going to' — plural usa 'are'. Intenção concreta = 'going to'."
      - type: english_phrases
        question: Eles vão assistir ao filme
        correctAnswer: they are going to watch the movie
        rationale: "'Watch the movie' (não 'assist'). 'Assistir a filme' = 'watch', sem 'to'."
      - type: english_phrases
        question: Ele vai começar um curso
        correctAnswer: he is going to start a course
        rationale: "'He is going to start' — decisão já tomada. Artigo 'a' antes de 'course'."
      - type: english_phrases
        question: Vai chover (há nuvens escuras)
        correctAnswer: it is going to rain
        rationale: "Evidência visível (nuvens) → 'going to', não 'will'. 'It' é obrigatório."
      - type: english_phrases
        question: Eu vou me mudar em julho
        correctAnswer: i am going to move in july
        rationale: "Plano datado usa 'going to'. 'In July' — preposição 'in' com meses."
      - type: english_phrases
        question: Você vai adorar
        correctAnswer: you are going to love it
        rationale: "Previsão com base em evidência → 'going to'. 'Love it' exige 'it'."
      - type: english_phrases
        question: Eles vão se casar
        correctAnswer: they are going to get married
        rationale: "'Get married' = casar-se (phrasal). Plano confirmado = 'going to'."
      - type: english_phrases
        question: Vou ficar em casa
        correctAnswer: i am going to stay home
        rationale: "'Stay home' (sem 'at') — expressão fixa. 'Going to' = intenção."
  - pageNumber: 2
    title: Will — Decisions and Offers
    description: Spontaneous decisions, offers, promises.
    exercises:
      - type: english_phrases
        question: Eu te ajudo (decisão agora)
        correctAnswer: i will help you
        rationale: "Decisão espontânea = 'will'. Ofertas de ajuda típicas usam 'I will/I'll'."
      - type: english_phrases
        question: Eu atendo (o telefone tocou)
        correctAnswer: i will get it
        rationale: "'I'll get it' — reação imediata ao telefone/porta. 'Will' espontâneo."
      - type: english_phrases
        question: Não se preocupe, eu faço
        correctAnswer: do not worry i will do it
        rationale: "Tranquilização com decisão instantânea → 'will'. 'Do not' = don't."
      - type: english_phrases
        question: Eu te ligo depois
        correctAnswer: i will call you later
        rationale: "Promessa/decisão na hora → 'will'. 'Call you', não 'call to you'."
      - type: english_phrases
        question: Acho que vai dar certo
        correctAnswer: i think it will work
        rationale: "Previsão/opinião com 'I think' → sempre 'will', nunca 'going to'."
      - type: english_phrases
        question: Não vou desistir
        correctAnswer: i will not give up
        rationale: "'Will not' = recusa firme. Contração: 'won't'. 'Give up' = desistir."
      - type: english_phrases
        question: Talvez eu vá
        correctAnswer: maybe i will go
        rationale: "'Maybe' + 'will' — incerteza/possibilidade, não plano concreto."
      - type: english_phrases
        question: Ele provavelmente virá
        correctAnswer: he will probably come
        rationale: "'Probably' vai entre 'will' e verbo: 'will probably come'."
      - type: english_phrases
        question: Prometo que vou tentar
        correctAnswer: i promise i will try
        rationale: "Promessa explícita → 'will'. 'Try' na base, sem 'to'."
      - type: english_phrases
        question: Um dia eu viajo pelo mundo
        correctAnswer: one day i will travel the world
        rationale: "Previsão vaga/sonho → 'will'. 'Travel the world' sem preposição."
target: 20
