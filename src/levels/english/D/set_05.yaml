title: English D - Going to vs Will
level: D
subject: english
difficulty: 3
objectives: [A2.grammar.future]
authorNotes: "'Going to' for intentions and evidence-based predictions; 'will' for spontaneous decisions and general predictions."
repeatAll: 2
example: "Vou estudar hoje → I am going to study today"
pages:
  - pageNumber: 1
    title: Going to — Intentions
    description: Planned actions, intentions, and predictions from evidence.
    exercises:
      - { type: english_phrases, question: "Eu vou estudar hoje", correctAnswer: i am going to study today }
      - { type: english_phrases, question: "Ela vai viajar amanhã", correctAnswer: she is going to travel tomorrow }
      - { type: english_phrases, question: "Nós vamos comprar uma casa", correctAnswer: we are going to buy a house }
      - { type: english_phrases, question: "Eles vão assistir ao filme", correctAnswer: they are going to watch the movie }
      - { type: english_phrases, question: "Ele vai começar um curso", correctAnswer: he is going to start a course }
      - { type: english_phrases, question: "Vai chover (há nuvens escuras)", correctAnswer: it is going to rain }
      - { type: english_phrases, question: "Eu vou me mudar em julho", correctAnswer: i am going to move in july }
      - { type: english_phrases, question: "Você vai adorar", correctAnswer: you are going to love it }
      - { type: english_phrases, question: "Eles vão se casar", correctAnswer: they are going to get married }
      - { type: english_phrases, question: "Vou ficar em casa", correctAnswer: i am going to stay home }
  - pageNumber: 2
    title: Will — Decisions and Offers
    description: Spontaneous decisions, offers, promises.
    exercises:
      - { type: english_phrases, question: "Eu te ajudo (decisão agora)", correctAnswer: i will help you }
      - { type: english_phrases, question: "Eu atendo (o telefone tocou)", correctAnswer: i will get it }
      - { type: english_phrases, question: "Não se preocupe, eu faço", correctAnswer: do not worry i will do it }
      - { type: english_phrases, question: "Eu te ligo depois", correctAnswer: i will call you later }
      - { type: english_phrases, question: "Acho que vai dar certo", correctAnswer: i think it will work }
      - { type: english_phrases, question: "Não vou desistir", correctAnswer: i will not give up }
      - { type: english_phrases, question: "Talvez eu vá", correctAnswer: maybe i will go }
      - { type: english_phrases, question: "Ele provavelmente virá", correctAnswer: he will probably come }
      - { type: english_phrases, question: "Prometo que vou tentar", correctAnswer: i promise i will try }
      - { type: english_phrases, question: "Um dia eu viajo pelo mundo", correctAnswer: one day i will travel the world }
target: 20
