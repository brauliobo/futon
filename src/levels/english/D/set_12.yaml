title: English D - Future + Comparison Mixed
level: D
subject: english
difficulty: 4
objectives:
  - A2.grammar.future
  - A2.grammar.comparatives
authorNotes: Integrates future forms with comparative/superlative structures in realistic contexts.
repeatAll: 2
example: Amanhã será melhor → Tomorrow will be better
pages:
  - pageNumber: 1
    title: Everyday Mixed Practice
    description: Combine future and comparison.
    exercises:
      - type: english_phrases
        question: Amanhã será melhor
        correctAnswer: tomorrow will be better
        rationale: "'Tomorrow' abre; sujeito implícito 'it'. 'Better' = irregular de good."
      - type: english_phrases
        question: O próximo ano será mais importante
        correctAnswer: next year will be more important
        rationale: "'Next year' + 'will be more important' — 'important' longo pede 'more'."
      - type: english_phrases
        question: Vai ser a melhor viagem da vida
        correctAnswer: it is going to be the best trip of my life
        rationale: "'Going to be the best' — superlativo com 'the'. 'Of my life' (posse)."
      - type: english_phrases
        question: A prova será mais difícil
        correctAnswer: the test will be more difficult
        rationale: "'More difficult' — 'difficult' (3 sílabas) usa 'more'."
      - type: english_phrases
        question: Vou chegar mais cedo amanhã
        correctAnswer: i will arrive earlier tomorrow
        rationale: "'Early' → 'earlier' (y → ier). 'Tomorrow' no fim."
      - type: english_phrases
        question: Eles serão os melhores
        correctAnswer: they will be the best
        rationale: "'The best' (superlativo irregular de good) após 'will be'."
      - type: english_phrases
        question: Vai ser mais rápido assim
        correctAnswer: it will be faster this way
        rationale: "'Faster' (fast + -er). 'This way' = assim/desta forma."
      - type: english_phrases
        question: Semana que vem será mais calma
        correctAnswer: next week will be calmer
        rationale: "'Calm' + -er = calmer (monossílabo). 'Next week' sem artigo."
      - type: english_phrases
        question: Ela vai trabalhar menos
        correctAnswer: she is going to work less
        rationale: "'Work less' — 'less' como advérbio após verbo. 'Going to' = plano."
      - type: english_phrases
        question: Vamos precisar de mais tempo
        correctAnswer: we will need more time
        rationale: "'Time' é incontável → 'more time', não 'more times' (= várias vezes)."
  - pageNumber: 2
    title: Plans and Expectations
    description: Broader context sentences.
    exercises:
      - type: english_phrases
        question: No ano que vem serei mais velho
        correctAnswer: next year i will be older
        rationale: "'Older' = comparativo de 'old' (+er). 'Next year' abre a frase."
      - type: english_phrases
        question: O mundo será diferente
        correctAnswer: the world will be different
        rationale: "'The world' — lugar único. 'Different' é adjetivo após 'be'."
      - type: english_phrases
        question: Vou comprar um carro melhor
        correctAnswer: i am going to buy a better car
        rationale: "'A better car' — comparativo 'better' precede o substantivo."
      - type: english_phrases
        question: O dia mais longo do ano
        correctAnswer: the longest day of the year
        rationale: "'Longest' (superlativo de long) + 'of the year' para período."
      - type: english_phrases
        question: Em cinco anos eu estarei melhor
        correctAnswer: in five years i will be better
        rationale: "'In five years' = daqui a 5 anos. 'Better' (irregular de good)."
      - type: english_phrases
        question: Vai ser mais caro que imaginamos
        correctAnswer: it is going to be more expensive than we thought
        rationale: "'More expensive than we thought' — 'thought' (past de think)."
      - type: english_phrases
        question: Ela será a melhor da turma
        correctAnswer: she will be the best in the class
        rationale: "'The best in the class' — 'in' após superlativo + grupo/lugar."
      - type: english_phrases
        question: Vamos terminar mais rápido
        correctAnswer: we will finish faster
        rationale: "'Faster' como advérbio após 'finish'. Monossílabo → -er."
      - type: english_phrases
        question: Logo ficará mais fácil
        correctAnswer: it will get easier soon
        rationale: "'Get easier' = ficar mais fácil. 'Easy' → 'easier' (y → ier)."
      - type: english_phrases
        question: Na próxima vez eu faço melhor
        correctAnswer: next time i will do better
        rationale: "'Do better' = fazer melhor. 'Better' após verbo como advérbio."
target: 20
