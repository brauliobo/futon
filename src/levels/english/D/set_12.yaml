title: English D - Future + Comparison Mixed
level: D
subject: english
difficulty: 4
objectives: [A2.grammar.future, A2.grammar.comparatives]
authorNotes: Integrates future forms with comparative/superlative structures in realistic contexts.
repeatAll: 2
example: "Amanhã será melhor → Tomorrow will be better"
pages:
  - pageNumber: 1
    title: Everyday Mixed Practice
    description: Combine future and comparison.
    exercises:
      - { type: english_phrases, question: "Amanhã será melhor", correctAnswer: tomorrow will be better }
      - { type: english_phrases, question: "O próximo ano será mais importante", correctAnswer: next year will be more important }
      - { type: english_phrases, question: "Vai ser a melhor viagem da vida", correctAnswer: it is going to be the best trip of my life }
      - { type: english_phrases, question: "A prova será mais difícil", correctAnswer: the test will be more difficult }
      - { type: english_phrases, question: "Vou chegar mais cedo amanhã", correctAnswer: i will arrive earlier tomorrow }
      - { type: english_phrases, question: "Eles serão os melhores", correctAnswer: they will be the best }
      - { type: english_phrases, question: "Vai ser mais rápido assim", correctAnswer: it will be faster this way }
      - { type: english_phrases, question: "Semana que vem será mais calma", correctAnswer: next week will be calmer }
      - { type: english_phrases, question: "Ela vai trabalhar menos", correctAnswer: she is going to work less }
      - { type: english_phrases, question: "Vamos precisar de mais tempo", correctAnswer: we will need more time }
  - pageNumber: 2
    title: Plans and Expectations
    description: Broader context sentences.
    exercises:
      - { type: english_phrases, question: "No ano que vem serei mais velho", correctAnswer: next year i will be older }
      - { type: english_phrases, question: "O mundo será diferente", correctAnswer: the world will be different }
      - { type: english_phrases, question: "Vou comprar um carro melhor", correctAnswer: i am going to buy a better car }
      - { type: english_phrases, question: "O dia mais longo do ano", correctAnswer: the longest day of the year }
      - { type: english_phrases, question: "Em cinco anos eu estarei melhor", correctAnswer: in five years i will be better }
      - { type: english_phrases, question: "Vai ser mais caro que imaginamos", correctAnswer: it is going to be more expensive than we thought }
      - { type: english_phrases, question: "Ela será a melhor da turma", correctAnswer: she will be the best in the class }
      - { type: english_phrases, question: "Vamos terminar mais rápido", correctAnswer: we will finish faster }
      - { type: english_phrases, question: "Logo ficará mais fácil", correctAnswer: it will get easier soon }
      - { type: english_phrases, question: "Na próxima vez eu faço melhor", correctAnswer: next time i will do better }
target: 20
