title: English D - Comparatives & Superlatives
level: D
subject: english
difficulty: 3
objectives:
  - A2.grammar.comparatives
repeatAll: 2
authorNotes: "English D - Comparatives & Superlatives. Foque no conceito central do conjunto e nos erros comuns."
example: "Comparatives. Ex.: Maior → bigger. Maior (entre todos) → biggest"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Comparatives (-er / more)
    description: Translate comparatives.
    exercises:
      - type: english_vocab
        question: Maior
        correctAnswer: bigger
        rationale: "'Big' dobra o 'g' antes de -er: bigger (CVC tônica)."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: Menor
        correctAnswer: smaller
        rationale: "'Small' + -er = smaller. Monossílabo curto: regra padrão."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: Mais alto
        correctAnswer: taller
        rationale: "'Tall' + -er. Para altura de pessoa/prédio use 'tall', não 'high'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: Mais rápido
        correctAnswer: faster
        rationale: "'Fast' + -er. Mesmo em advérbio usa-se 'faster', sem 'more'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: Mais devagar
        correctAnswer: slower
        rationale: "'Slow' + -er. Evite 'more slow' — monossílabo usa sufixo."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: Mais forte
        correctAnswer: stronger
        rationale: "'Strong' + -er = stronger. Pronúncia: /ˈstrɒŋɡə/ com /ɡ/ audível."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: Mais antigo / velho
        correctAnswer: older
        rationale: "'Old' + -er. Para irmãos mais velhos também cabe 'elder'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: Mais jovem
        correctAnswer: younger
        rationale: "'Young' + -er. Pronúncia com /ɡ/: /ˈjʌŋɡə/."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: Mais bonito
        correctAnswer: More beautiful
        rationale: "Adjetivos longos (3+ sílabas) usam 'more', não -er: 'more beautiful'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: Mais interessante
        correctAnswer: More interesting
        rationale: "'Interesting' tem 4 sílabas: usa 'more', nunca 'interestinger'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
  - pageNumber: 2
    title: Superlatives (-est / most)
    description: Translate superlatives.
    exercises:
      - type: english_vocab
        question: O maior
        correctAnswer: The biggest
        rationale: "Superlativo exige 'the'. 'Big' dobra o 'g': the biggest."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: O menor
        correctAnswer: The smallest
        rationale: "'Small' + -est com 'the' obrigatório antes do superlativo."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: O mais alto
        correctAnswer: The tallest
        rationale: "'Tall' + -est = tallest. 'The' marca o superlativo."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: O mais rápido
        correctAnswer: The fastest
        rationale: "'Fast' + -est. Nunca 'the most fast' — monossílabo."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: O mais forte
        correctAnswer: The strongest
        rationale: "'Strong' + -est = strongest, com 'the' antes."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: O melhor
        correctAnswer: The best
        rationale: "'Good' é irregular: good → better → the best."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: O pior
        correctAnswer: The worst
        rationale: "'Bad' é irregular: bad → worse → the worst."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: O mais antigo
        correctAnswer: The oldest
        rationale: "'Old' + -est. 'Eldest' é variante só para parentesco."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: O mais bonito
        correctAnswer: The most beautiful
        rationale: "'Beautiful' é longo: 'the most beautiful', não 'beautifulest'."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
      - type: english_vocab
        question: O mais feliz
        correctAnswer: The happiest
        rationale: "'Happy' termina em 'y': troca por 'i' + est = happiest."
        difficulty: 3
        objectives: [A2.grammar.comparatives]
target: 20
