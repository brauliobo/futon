title: English D - Superlatives (-est / most)
level: D
subject: english
difficulty: 2
objectives: [A2.grammar.superlatives]
authorNotes: Short adjectives add -est with 'the'; long adjectives use 'the most'.
repeatAll: 2
example: "O mais alto → The tallest"
pages:
  - pageNumber: 1
    title: Short Adjectives (+ -est)
    description: Use 'the' + adjective + -est.
    exercises:
      - { type: english_phrases, question: "O mais alto da turma", correctAnswer: the tallest in the class }
      - { type: english_phrases, question: "O mais rápido do mundo", correctAnswer: the fastest in the world }
      - { type: english_phrases, question: "A mais velha da família", correctAnswer: the oldest in the family }
      - { type: english_phrases, question: "O mais novo dos três", correctAnswer: the youngest of the three }
      - { type: english_phrases, question: "O mais forte do time", correctAnswer: the strongest on the team }
      - { type: english_phrases, question: "O mais barato da loja", correctAnswer: the cheapest in the store }
      - { type: english_phrases, question: "O dia mais frio do ano", correctAnswer: the coldest day of the year }
      - { type: english_phrases, question: "O mais quente do verão", correctAnswer: the hottest of the summer }
      - { type: english_phrases, question: "O rio mais longo", correctAnswer: the longest river }
      - { type: english_phrases, question: "O livro mais fino", correctAnswer: the thinnest book }
  - pageNumber: 2
    title: Long Adjectives (the most ...)
    description: Use 'the most' before the adjective.
    exercises:
      - { type: english_phrases, question: "O livro mais interessante", correctAnswer: the most interesting book }
      - { type: english_phrases, question: "O carro mais caro", correctAnswer: the most expensive car }
      - { type: english_phrases, question: "A prova mais difícil", correctAnswer: the most difficult test }
      - { type: english_phrases, question: "A cidade mais bonita", correctAnswer: the most beautiful city }
      - { type: english_phrases, question: "O esporte mais popular", correctAnswer: the most popular sport }
      - { type: english_phrases, question: "A matéria mais importante", correctAnswer: the most important subject }
      - { type: english_phrases, question: "A atividade mais perigosa", correctAnswer: the most dangerous activity }
      - { type: english_phrases, question: "A pessoa mais famosa", correctAnswer: the most famous person }
      - { type: english_phrases, question: "A ferramenta mais útil", correctAnswer: the most useful tool }
      - { type: english_phrases, question: "A melhor escolha (most suitable)", correctAnswer: the most suitable choice }
target: 20
