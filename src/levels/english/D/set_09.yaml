title: English D - Superlatives (-est / most)
level: D
subject: english
difficulty: 2
objectives:
  - A2.grammar.superlatives
authorNotes: Short adjectives add -est with 'the'; long adjectives use 'the most'.
repeatAll: 2
example: O mais alto → The tallest
pages:
  - pageNumber: 1
    title: Short Adjectives (+ -est)
    description: Use 'the' + adjective + -est.
    exercises:
      - type: english_phrases
        question: O mais alto da turma
        correctAnswer: the tallest in the class
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O mais rápido do mundo
        correctAnswer: the fastest in the world
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: A mais velha da família
        correctAnswer: the oldest in the family
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O mais novo dos três
        correctAnswer: the youngest of the three
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O mais forte do time
        correctAnswer: the strongest on the team
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O mais barato da loja
