title: English D - Superlatives (-est / most)
level: D
subject: english
difficulty: 2
objectives:
  - A2.grammar.superlatives
authorNotes: Short adjectives add -est with 'the'; long adjectives use 'the most'.
repeatAll: 2
example: O mais alto → The tallest
pages:
  - pageNumber: 1
    title: Short Adjectives (+ -est)
    description: Use 'the' + adjective + -est.
    exercises:
      - type: english_phrases
        question: O mais alto da turma
        correctAnswer: the tallest in the class
        rationale: "'Tall' + -est. Grupo/lugar após superlativo usa 'in': 'in the class'."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O mais rápido do mundo
        correctAnswer: the fastest in the world
        rationale: "'Fast' + -est. 'In the world' — preposição 'in' para lugar global."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: A mais velha da família
        correctAnswer: the oldest in the family
        rationale: "'Old' + -est. 'In the family' — grupo fechado pede 'in'."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O mais novo dos três
        correctAnswer: the youngest of the three
        rationale: "'Young' + -est. 'Of the three' — 'of' quando especifica quantidade."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O mais forte do time
        correctAnswer: the strongest on the team
        rationale: "'Strong' + -est. Time usa 'on the team' (AmE), não 'in'."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O mais barato da loja
        correctAnswer: the cheapest in the store
        rationale: "'Cheap' + -est. 'In the store' — dentro de um lugar físico."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O dia mais frio do ano
        correctAnswer: the coldest day of the year
        rationale: "'Cold' + -est + substantivo ('day'). 'Of the year' = do ano."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O mais quente do verão
        correctAnswer: the hottest of the summer
        rationale: "'Hot' dobra o 't': hottest. 'Of the summer' — período fechado."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O rio mais longo
        correctAnswer: the longest river
        rationale: "'Long' + -est. Superlativo antes do substantivo: 'longest river'."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O livro mais fino
        correctAnswer: the thinnest book
        rationale: "'Thin' dobra o 'n': thinnest (CVC tônica). Superlativo + 'book'."
        difficulty: 1
        objectives: [A2.grammar.superlatives]
  - pageNumber: 2
    title: Long Adjectives (the most ...)
    description: Use 'the most' before the adjective.
    exercises:
      - type: english_phrases
        question: O livro mais interessante
        correctAnswer: the most interesting book
        rationale: "'Interesting' é longo → 'the most interesting', nunca 'interestingest'."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O carro mais caro
        correctAnswer: the most expensive car
        rationale: "'Expensive' (3 sílabas) → 'the most expensive car'."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: A prova mais difícil
        correctAnswer: the most difficult test
        rationale: "'Difficult' (3 sílabas) → 'the most difficult'. 'Test' = prova."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: A cidade mais bonita
        correctAnswer: the most beautiful city
        rationale: "'Beautiful' → 'the most beautiful'. 'Beautifulest' não existe."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: O esporte mais popular
        correctAnswer: the most popular sport
        rationale: "'Popular' (3 sílabas) → 'the most popular'. Não 'popularest'."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: A matéria mais importante
        correctAnswer: the most important subject
        rationale: "'Important' → 'the most important'. 'Subject' = matéria escolar."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: A atividade mais perigosa
        correctAnswer: the most dangerous activity
        rationale: "'Dangerous' → 'the most dangerous activity'. Longo pede 'most'."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: A pessoa mais famosa
        correctAnswer: the most famous person
        rationale: "'Famous' (2 sílabas, -ous) → 'the most'. 'Person', não 'people' (sg)."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: A ferramenta mais útil
        correctAnswer: the most useful tool
        rationale: "'Useful' (-ful) → 'the most useful'. Sufixo -ful pede 'most'."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
      - type: english_phrases
        question: A melhor escolha (most suitable)
        correctAnswer: the most suitable choice
        rationale: "'Suitable' → 'the most suitable'. 'Choice' = escolha (substantivo)."
        difficulty: 2
        objectives: [A2.grammar.superlatives]
target: 20
