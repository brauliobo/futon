title: 📅 English D - Sequence Connectors
level: D
subject: english
difficulty: 2
objectives:
  - A2.grammar.discourse
authorNotes: Time connectors sequence events in a story or procedure. 'While' is simultaneous; the others (first, then, next, after that, finally) are sequential. Students practice narrating events in order.
repeatAll: 2
example: "Ex.: 'Primeiro, lave as mãos.' → First, wash your hands."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Telling a Sequence
    description: Use first, then, next, after that, and finally.
    exercises:
      - type: english_phrases
        question: Primeiro, lave as mãos.
        correctAnswer: First, wash your hands.
        rationale: "'First' abre a sequência. Imperativo 'wash' sem sujeito."
        difficulty: 1
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Então, adicione o açúcar.
        correctAnswer: Then, add the sugar.
        rationale: "'Then' = depois/então. Imperativo 'add'. 'The sugar' = ingrediente específico."
        difficulty: 1
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Em seguida, misture bem.
        correctAnswer: Next, mix well.
        rationale: "'Next' = em seguida. Imperativo 'mix'. 'Well' = advérbio de modo."
        difficulty: 1
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Depois disso, leve ao forno.
        correctAnswer: After that, put it in the oven.
        rationale: "'After that' = depois disso. 'Put it in the oven' = levar ao forno."
        difficulty: 2
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Finalmente, sirva quente.
        correctAnswer: Finally, serve it hot.
        rationale: "'Finally' = por fim. 'Serve it hot' — adjetivo após objeto."
        difficulty: 1
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Primeiro, abri o livro.
        correctAnswer: First, I opened the book.
        rationale: "'First' + sujeito explícito no passado. 'Opened' regular."
        difficulty: 2
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Então ela ligou para mim.
        correctAnswer: Then she called me.
        rationale: "'Then' sem vírgula após sujeito. 'Called me' — objeto ao fim."
        difficulty: 2
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Em seguida, fomos ao restaurante.
        correctAnswer: Next, we went to the restaurant.
        rationale: "'Went' (passado irregular de go). 'To the restaurant'."
        difficulty: 2
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Depois disso, ele pagou a conta.
        correctAnswer: After that, he paid the bill.
        rationale: "'Paid' (irregular de pay). 'The bill' = a conta (restaurante/loja)."
        difficulty: 2
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Finalmente, nós fomos para casa.
        correctAnswer: Finally, we went home.
        rationale: "'Went home' sem preposição 'to'. 'Home' como advérbio de destino."
        difficulty: 2
        objectives: [A2.grammar.discourse]
  - pageNumber: 2
    title: Simultaneous and Extended Sequences
    description: Use while and combine connectors in narratives.
    exercises:
      - type: english_phrases
        question: Enquanto ela cozinhava, eu arrumei a mesa.
        correctAnswer: While she was cooking, I set the table.
        rationale: "'While + contínuo' para ação de fundo. 'Set the table' = arrumar a mesa."
        difficulty: 2
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Enquanto eu estudava, ele dormia.
        correctAnswer: While I was studying, he was sleeping.
        rationale: "Dois contínuos simultâneos no passado. 'While' marca a simultaneidade."
        difficulty: 2
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Primeiro, comprei os ingredientes. Então, comecei a cozinhar.
        correctAnswer: First, I bought the ingredients. Then, I started cooking.
        rationale: "'Bought' (irregular). 'Started cooking' = started + gerúndio."
        difficulty: 3
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Enquanto esperávamos, ela chegou.
        correctAnswer: While we were waiting, she arrived.
        rationale: "'Were waiting' (contínuo) + 'arrived' (simples) — evento que interrompe."
        difficulty: 3
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Em seguida, verificamos as respostas.
        correctAnswer: Next, we checked the answers.
        rationale: "'Checked' regular. 'The answers' = artigo definido (respostas específicas)."
        difficulty: 2
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Depois disso, ela tomou um banho.
        correctAnswer: After that, she took a shower.
        rationale: "'Take a shower' = tomar banho (chuveiro). Expressão fixa em inglês."
        difficulty: 2
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Finalmente, conseguimos terminar tudo.
        correctAnswer: Finally, we managed to finish everything.
        rationale: "'Managed to finish' = conseguiu terminar. 'Everything' = tudo."
        difficulty: 3
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Enquanto eu dormia, ela saiu.
        correctAnswer: While I was sleeping, she left.
        rationale: "'Left' (irregular de leave). Contínuo de fundo + simples de evento."
        difficulty: 3
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Primeiro acordei, então tomei café e depois fui trabalhar.
        correctAnswer: First I woke up, then I had breakfast, and after that I went to work.
        rationale: "Três conectores em cadeia. 'Have breakfast' = tomar café da manhã."
        difficulty: 3
        objectives: [A2.grammar.discourse]
      - type: english_phrases
        question: Finalmente, ela entendeu o problema.
        correctAnswer: Finally, she understood the problem.
        rationale: "'Understood' (irregular de understand). 'The problem' = artigo definido."
        difficulty: 3
        objectives: [A2.grammar.discourse]
target: 20
