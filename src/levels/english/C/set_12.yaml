title: English C - Past Mixed Review
level: C
subject: english
difficulty: 3
objectives:
  - A2.grammar.past_simple
authorNotes: Mixed affirmative, negative, questions and narrative sentences using regular and irregular past.
repeatAll: 2
example: Onde você foi ontem? → Where did you go yesterday?
pages:
  - pageNumber: 1
    title: Everyday Past Situations
    description: Short narrative sentences.
    exercises:
      - type: english_phrases
        question: Ontem eu acordei cedo
        correctAnswer: yesterday i woke up early
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não tomou café
        correctAnswer: she did not have breakfast
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Pegamos o ônibus às sete
        correctAnswer: we took the bus at seven
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele esqueceu o guarda-chuva
        correctAnswer: he forgot the umbrella
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Choveu à tarde
        correctAnswer: it rained in the afternoon
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu li um livro bom
        correctAnswer: i read a good book
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles não vieram
        correctAnswer: they did not come
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você dormiu tarde?
        correctAnswer: did you sleep late
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela comprou pão
        correctAnswer: she bought bread
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós jantamos juntos
        correctAnswer: we had dinner together
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Narrative Continuity
    description: Sequence of past actions.
    exercises:
      - type: english_phrases
        question: Cheguei e fiz café
        correctAnswer: i arrived and made coffee
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela entrou e sentou
        correctAnswer: she came in and sat down
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles correram até o parque
        correctAnswer: they ran to the park
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele ligou, mas ninguém atendeu
        correctAnswer: he called but no one answered
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quando acordei, chovia
        correctAnswer: when i woke up it was raining
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Estudei por duas horas
        correctAnswer: i studied for two hours
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela perdeu a chave
        correctAnswer: she lost the key
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós assistimos a um filme
        correctAnswer: we watched a movie
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu escrevi uma carta
        correctAnswer: i wrote a letter
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles ganharam o jogo
        correctAnswer: they won the game
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
