title: English C - Past Mixed Review
level: C
subject: english
difficulty: 3
objectives: [A2.grammar.past_simple]
authorNotes: Mixed affirmative, negative, questions and narrative sentences using regular and irregular past.
repeatAll: 2
example: "Onde você foi ontem? → Where did you go yesterday?"
pages:
  - pageNumber: 1
    title: Everyday Past Situations
    description: Short narrative sentences.
    exercises:
      - { type: english_phrases, question: "Ontem eu acordei cedo", correctAnswer: yesterday i woke up early }
      - { type: english_phrases, question: "Ela não tomou café", correctAnswer: she did not have breakfast }
      - { type: english_phrases, question: "Pegamos o ônibus às sete", correctAnswer: we took the bus at seven }
      - { type: english_phrases, question: "Ele esqueceu o guarda-chuva", correctAnswer: he forgot the umbrella }
      - { type: english_phrases, question: "Choveu à tarde", correctAnswer: it rained in the afternoon }
      - { type: english_phrases, question: "Eu li um livro bom", correctAnswer: i read a good book }
      - { type: english_phrases, question: "Eles não vieram", correctAnswer: they did not come }
      - { type: english_phrases, question: "Você dormiu tarde?", correctAnswer: did you sleep late }
      - { type: english_phrases, question: "Ela comprou pão", correctAnswer: she bought bread }
      - { type: english_phrases, question: "Nós jantamos juntos", correctAnswer: we had dinner together }
  - pageNumber: 2
    title: Narrative Continuity
    description: Sequence of past actions.
    exercises:
      - { type: english_phrases, question: "Cheguei e fiz café", correctAnswer: i arrived and made coffee }
      - { type: english_phrases, question: "Ela entrou e sentou", correctAnswer: she came in and sat down }
      - { type: english_phrases, question: "Eles correram até o parque", correctAnswer: they ran to the park }
      - { type: english_phrases, question: "Ele ligou, mas ninguém atendeu", correctAnswer: he called but no one answered }
      - { type: english_phrases, question: "Quando acordei, chovia", correctAnswer: when i woke up it was raining }
      - { type: english_phrases, question: "Estudei por duas horas", correctAnswer: i studied for two hours }
      - { type: english_phrases, question: "Ela perdeu a chave", correctAnswer: she lost the key }
      - { type: english_phrases, question: "Nós assistimos a um filme", correctAnswer: we watched a movie }
      - { type: english_phrases, question: "Eu escrevi uma carta", correctAnswer: i wrote a letter }
      - { type: english_phrases, question: "Eles ganharam o jogo", correctAnswer: they won the game }
target: 20
