title: English C - Past Time Expressions
level: C
subject: english
difficulty: 2
objectives:
  - A2.grammar.past_simple
authorNotes: Yesterday, last week, ago, in + year, when. Anchoring past events in time.
repeatAll: 2
example: Eu trabalhei ontem → I worked yesterday
pages:
  - pageNumber: 1
    title: Yesterday, Last, Ago
    description: Common time anchors for the past.
    exercises:
      - type: english_phrases
        question: Eu trabalhei ontem
        correctAnswer: i worked yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela veio na semana passada
        correctAnswer: she came last week
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós viajamos mês passado
        correctAnswer: we traveled last month
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele chegou ontem à noite
        correctAnswer: he arrived last night
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu vi ele três dias atrás
        correctAnswer: i saw him three days ago
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles se mudaram dois anos atrás
        correctAnswer: they moved two years ago
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu nasci em 1995
        correctAnswer: i was born in 1995
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Estudei no ano passado
        correctAnswer: i studied last year
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela ligou há uma hora
        correctAnswer: she called an hour ago
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nos encontramos semana passada
        correctAnswer: we met last week
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: When, In, On
    description: Subordinators and dated events in the past.
    exercises:
      - type: english_phrases
        question: Quando eu era criança
        correctAnswer: when i was a child
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Na segunda-feira passada
        correctAnswer: on last monday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Em 2010 eu morava em São Paulo
        correctAnswer: in 2010 i lived in são paulo
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quando eles chegaram
        correctAnswer: when they arrived
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Em janeiro fez frio
        correctAnswer: in january it was cold
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Na semana passada choveu
        correctAnswer: last week it rained
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quando o filme acabou
        correctAnswer: when the movie ended
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Em 2020 tudo mudou
        correctAnswer: in 2020 everything changed
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Na quinta eu estudei
        correctAnswer: on thursday i studied
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quando ela ligou eu dormia
        correctAnswer: when she called i was sleeping
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
