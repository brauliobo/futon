title: English C - Past Wh- Questions
level: C
subject: english
difficulty: 3
objectives:
  - A2.grammar.past_simple
  - A2.grammar.wh_questions
authorNotes: Wh-word + did + subject + base verb. Exception when subject itself is the wh-word.
repeatAll: 2
example: O que você fez? → What did you do?
pages:
  - pageNumber: 1
    title: What, Where, When in Past
    description: Information questions about the past.
    exercises:
      - type: english_phrases
        question: O que você fez?
        correctAnswer: what did you do
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Onde ela foi?
        correctAnswer: where did she go
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quando eles chegaram?
        correctAnswer: when did they arrive
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O que você comeu?
        correctAnswer: what did you eat
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Onde você morava?
        correctAnswer: where did you live
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quando o filme começou?
        correctAnswer: when did the movie start
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O que ele disse?
        correctAnswer: what did he say
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Onde eles se conheceram?
        correctAnswer: where did they meet
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O que aconteceu?
        correctAnswer: what happened
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quando você soube?
        correctAnswer: when did you know
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Who, Why, How in Past
    description: Questions about cause, manner and subject.
    exercises:
      - type: english_phrases
        question: Quem ligou?
        correctAnswer: who called
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Por que ela chorou?
        correctAnswer: why did she cry
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Como você aprendeu?
        correctAnswer: how did you learn
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quem viu isso?
        correctAnswer: who saw this
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Por que eles saíram?
        correctAnswer: why did they leave
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Como foi a viagem?
        correctAnswer: how was the trip
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quem te ajudou?
        correctAnswer: who helped you
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Por que ele parou?
        correctAnswer: why did he stop
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Como ela descobriu?
        correctAnswer: how did she find out
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Por que não funcionou?
        correctAnswer: why did it not work
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
