title: 💬 English C - Past Continuous
level: C
subject: english
difficulty: 2
objectives:
  - A2.grammar.past_continuous
authorNotes: Past continuous (was/were + -ing) for ongoing actions interrupted by past simple. Key pattern — I was doing X when Y happened.
repeatAll: 2
example: "Ex.: 'Eu estava comendo quando ela ligou' → I was eating when she called."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Was/Were + -ing
    description: Past continuous for ongoing actions in the past.
    exercises:
      - type: english_phrases
        question: Eu estava comendo quando ela ligou
        correctAnswer: I was eating when she called
        rationale: "'Was eating' = ação contínua. 'Called' = ação pontual que interrompeu."
        difficulty: 1
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Eles estavam dormindo quando o alarme tocou
        correctAnswer: They were sleeping when the alarm went off
        rationale: "'Were sleeping' — plural. 'Go off' = tocar (alarme). Passado 'went off'."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Ela estava lendo quando eu cheguei
        correctAnswer: She was reading when I arrived
        rationale: "'Was reading' = contínua. 'Arrived' = pontual. Padrão clássico."
        difficulty: 1
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Nós estávamos jantando às oito
        correctAnswer: We were having dinner at eight
        rationale: "'Were having dinner' = contínua em ponto fixo no tempo. 'At eight'."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Ele estava trabalhando até meia-noite
        correctAnswer: He was working until midnight
        rationale: "'Was working' = ação em progresso. 'Until midnight' = duração até ponto."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: O que você estava fazendo às dez?
        correctAnswer: What were you doing at ten
        rationale: "'What were you doing' — wh-question passado contínuo."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Eu estava assistindo TV quando a luz apagou
        correctAnswer: I was watching TV when the light went out
        rationale: "'Was watching' + 'went out' (luz apagou). 'Go out' = apagar."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Ela não estava prestando atenção
        correctAnswer: She was not paying attention
        rationale: "'Was not paying attention' — negativa contínua. 'Pay attention' = prestar atenção."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Eles estavam rindo quando eu entrei
        correctAnswer: They were laughing when I came in
        rationale: "'Were laughing' contínua. 'Come in' = entrar. Passado 'came in'."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Você estava esperando há muito tempo?
        correctAnswer: Were you waiting for a long time
        rationale: "'Were you waiting' — pergunta passado contínuo. 'For a long time' = duração."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
  - pageNumber: 2
    title: Past Continuous — Complex Sentences
    description: More complex sentences combining past continuous and past simple.
    exercises:
      - type: english_phrases
        question: Enquanto eu estudava, ela cozinhava
        correctAnswer: While I was studying, she was cooking
        rationale: "'While' + duas ações contínuas paralelas. Ambas 'was/were + -ing'."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Eu vi seu carro quando estava dirigindo
        correctAnswer: I saw your car while I was driving
        rationale: "'Saw' = pontual. 'While I was driving' = contínua de fundo."
        difficulty: 3
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Eles estavam conversando quando o professor entrou
        correctAnswer: They were talking when the teacher came in
        rationale: "'Were talking' contínua interrompida por 'came in' pontual."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Quando acordei, chovia
        correctAnswer: When I woke up it was raining
        rationale: "'Woke up' pontual. 'Was raining' = situação contínua que encontrei."
        difficulty: 3
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Ela estava sorrindo quando tirei a foto
        correctAnswer: She was smiling when I took the photo
        rationale: "'Was smiling' contínua. 'Took' pontual. Note 'smil-ing' (sem duplo 'e')."
        difficulty: 3
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: O que estava acontecendo quando você chegou?
        correctAnswer: What was happening when you arrived
        rationale: "'What was happening' — wh-question passado contínuo. 'Arrived' pontual."
        difficulty: 3
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Eu estava ouvindo música e não ouvi o telefone
        correctAnswer: I was listening to music and did not hear the phone
        rationale: "'Was listening' contínua. 'Did not hear' pontual negativo. 'Hear' + objeto direto."
        difficulty: 3
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Ela não estava esperando por mim
        correctAnswer: She was not waiting for me
        rationale: "'Was not waiting' — negativa contínua. 'Wait for' = esperar por."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: Nós estávamos andando quando começou a chover
        correctAnswer: We were walking when it started to rain
        rationale: "'Were walking' contínua. 'Started to rain' ou 'started raining' — pontual."
        difficulty: 3
        objectives: [A2.grammar.past_continuous]
      - type: english_phrases
        question: O que você estava pensando?
        correctAnswer: What were you thinking
        rationale: "'What were you thinking' — wh-question passado contínuo. Tom de surpresa."
        difficulty: 2
        objectives: [A2.grammar.past_continuous]
target: 20
