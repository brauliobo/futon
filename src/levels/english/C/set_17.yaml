title: 💬 English C - Past Conversations
level: C
subject: english
difficulty: 2
objectives:
  - A2.grammar.past_simple
authorNotes: Conversational past questions — What did you do? Where did you go? How was it? — with natural answers.
repeatAll: 2
example: "Ex.: 'O que você fez ontem?' → What did you do yesterday?"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Common Past Questions
    description: Key questions used in everyday conversations about the past.
    exercises:
      - type: english_phrases
        question: O que você fez ontem?
        correctAnswer: What did you do yesterday
        rationale: "'What did you do' — wh-question passado. 'Yesterday' no final."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Onde você foi no fim de semana?
        correctAnswer: Where did you go at the weekend
        rationale: "'Where did you go' + time. 'At the weekend' (BrE) = no fim de semana."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Como foi a festa?
        correctAnswer: How was the party
        rationale: "'How was' + noun = como foi? 'The party' — evento específico."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Com quem você foi?
        correctAnswer: Who did you go with
        rationale: "'Who did you go with' — preposição 'with' no final. Natural em inglês falado."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: O que você comeu?
        correctAnswer: What did you eat
        rationale: "'What did you eat' — wh-question sobre comida no passado."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Você curtiu?
        correctAnswer: Did you enjoy it
        rationale: "'Did you enjoy it' = você curtiu? 'It' refere ao evento/atividade."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Quanto tempo você ficou lá?
        correctAnswer: How long did you stay there
        rationale: "'How long did you stay' — duração. 'There' = lá, no final."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Quando você chegou?
        correctAnswer: When did you arrive
        rationale: "'When did you arrive' — wh-question de tempo passado."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Como você foi lá?
        correctAnswer: How did you get there
        rationale: "'How did you get there' = como você chegou lá. 'Get there' = chegar lá."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: O que você achou?
        correctAnswer: What did you think
        rationale: "'What did you think' = o que você achou/pensou. 'Think' → 'thought'."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
  - pageNumber: 2
    title: Natural Answers in Conversations
    description: Answers to common past questions.
    exercises:
      - type: english_phrases
        question: Foi ótimo, eu adorei
        correctAnswer: It was great, I loved it
        rationale: "'It was great' descreve o evento. 'Love' regular → 'loved'. 'It' como objeto."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu fiquei em casa e assisti séries
        correctAnswer: I stayed home and watched series
        rationale: "'Stay home' (sem preposição). 'Watch' → 'watched'. Duas ações ligadas por 'and'."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu fui com minha família
        correctAnswer: I went with my family
        rationale: "'Go with' = ir com. Passado 'went with'. 'My family'."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Não foi muito bom, para falar a verdade
        correctAnswer: It was not very good, to be honest
        rationale: "'It was not very good' — negativa de 'be'. 'To be honest' = para falar a verdade."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu comi frutos do mar pela primeira vez
        correctAnswer: I ate seafood for the first time
        rationale: "'Eat' → 'ate'. 'Seafood' incontável. 'For the first time' = pela primeira vez."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Fui de ônibus, demorou muito
        correctAnswer: I went by bus, it took a long time
        rationale: "'By bus' = de ônibus. 'It took a long time' = demorou muito."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu não fiz muita coisa
        correctAnswer: I did not do much
        rationale: "'Did not do' — auxiliar + base. 'Much' em negativas para incontável/geral."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Foi bem diferente do que eu esperava
        correctAnswer: It was very different from what I expected
        rationale: "'Different from' (preposição correta). 'Expected' regular passado."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu dormi a maior parte do tempo
        correctAnswer: I slept most of the time
        rationale: "'Sleep' → 'slept'. 'Most of the time' = a maior parte do tempo."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu aproveitei muito
        correctAnswer: I really enjoyed it
        rationale: "'Really enjoyed it' = aproveitou muito. 'Really' intensifica 'enjoyed'."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
target: 20
