title: 🔤 English C - Irregular Verbs II
level: C
subject: english
difficulty: 2
objectives:
  - A2.grammar.past_simple
authorNotes: Focus on make/made, take/took, give/gave, put/put, find/found, know/knew, think/thought, tell/told.
repeatAll: 2
example: "Ex.: 'Eu fiz um bolo' → I made a cake."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Irregular Verbs — Affirmative
    description: Common irregular past verbs in positive sentences.
    exercises:
      - type: english_phrases
        question: Eu fiz um sanduíche
        correctAnswer: I made a sandwich
        rationale: "'Make' → 'made' (irregular). 'Sandwich' — artigo indefinido 'a'."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ela pegou o ônibus
        correctAnswer: She took the bus
        rationale: "'Take' → 'took' (irregular). 'The bus' — transporte público usa 'the'."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ele deu um presente
        correctAnswer: He gave a present
        rationale: "'Give' → 'gave' (irregular). 'A present' — artigo indefinido."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu coloquei o livro na mesa
        correctAnswer: I put the book on the table
        rationale: "'Put' → 'put' (não muda!). Preposição 'on' para superfícies."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Nós encontramos as chaves
        correctAnswer: We found the keys
        rationale: "'Find' → 'found' (irregular). 'Keys' plural — 'the' para objeto específico."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu sabia a resposta
        correctAnswer: I knew the answer
        rationale: "'Know' → 'knew' (irregular). 'The answer' — resposta específica."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ela pensou em você
        correctAnswer: She thought about you
        rationale: "'Think' → 'thought' (irregular). 'Think about' — preposição correta."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ele me contou a verdade
        correctAnswer: He told me the truth
        rationale: "'Tell' → 'told' (irregular). 'Tell someone something' — dois objetos."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eles fizeram barulho
        correctAnswer: They made noise
        rationale: "'Make noise' = fazer barulho. 'Noise' incontável — sem artigo."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu achei isso estranho
        correctAnswer: I found it strange
        rationale: "'Find' → 'found'. 'Find something + adjective' = achar algo + adj."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
  - pageNumber: 2
    title: Irregular Verbs — Negatives & Questions
    description: Negatives and questions with the same irregular verbs.
    exercises:
      - type: english_phrases
        question: Ela não deu nenhuma resposta
        correctAnswer: She did not give any answer
        rationale: "Negativa — 'did not give' + base. 'Any' em negativas."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu não sabia seu nome
        correctAnswer: I did not know his name
        rationale: "'did not know' — base após auxiliar. Nunca 'did not knew'."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Você achou o passaporte?
        correctAnswer: Did you find the passport
        rationale: "Pergunta — 'Did you find' + base. 'passport' específico = 'the'."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: O que você fez no fim de semana?
        correctAnswer: What did you do at the weekend
        rationale: "'What did you do' — wh-question no passado. 'At the weekend' (BrE)."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eles não me contaram nada
        correctAnswer: They did not tell me anything
        rationale: "'did not tell' + base. 'Anything' em negativas — não 'nothing'."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ele não colocou açúcar
        correctAnswer: He did not put any sugar
        rationale: "'Put' base = put. 'did not put' — forma não muda no passado."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Quem te deu isso?
        correctAnswer: Who gave you that
        rationale: "'Who' como sujeito — sem auxiliar 'did'. 'Who gave' direto."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ela pensou muito antes de responder
        correctAnswer: She thought a lot before answering
        rationale: "'thought' + 'before answering' (-ing depois de preposição)."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu não pensei nisso
        correctAnswer: I did not think about that
        rationale: "'did not think' + base. 'Think about' — preposição mantida."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Você pegou meu guarda-chuva?
        correctAnswer: Did you take my umbrella
        rationale: "'Did you take' — pergunta passado. 'My umbrella' — possessivo."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
target: 20
