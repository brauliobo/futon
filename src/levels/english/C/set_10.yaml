title: English C - Past Yes/No Questions
level: C
subject: english
difficulty: 3
objectives:
  - A2.grammar.past_simple
  - A2.grammar.questions
authorNotes: "'Did' + subject + base verb. With 'to be', invert was/were."
repeatAll: 2
example: Você foi? → Did you go?
pages:
  - pageNumber: 1
    title: Did + Subject + Base Verb
    description: Standard past yes/no questions.
    exercises:
      - type: english_phrases
        question: Você foi?
        correctAnswer: did you go
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele viu o filme?
        correctAnswer: did he see the movie
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela gostou?
        correctAnswer: did she like it
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Vocês comeram?
        correctAnswer: did you eat
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles estudaram?
        correctAnswer: did they study
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você me ligou?
        correctAnswer: did you call me
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele trabalhou ontem?
        correctAnswer: did he work yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você dormiu bem?
        correctAnswer: did you sleep well
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela chegou cedo?
        correctAnswer: did she arrive early
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles te viram?
        correctAnswer: did they see you
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Was / Were Questions
    description: Past questions with 'to be'.
    exercises:
      - type: english_phrases
        question: Você estava em casa?
        correctAnswer: was you at home
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela estava cansada?
        correctAnswer: was she tired
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles estavam juntos?
        correctAnswer: were they together
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Estava frio?
        correctAnswer: was it cold
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você era estudante?
        correctAnswer: were you a student
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles estavam lá?
        correctAnswer: were they there
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele estava certo?
        correctAnswer: was he right
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós estávamos atrasados?
        correctAnswer: were we late
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela estava doente?
        correctAnswer: was she sick
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Vocês estavam prontos?
        correctAnswer: were you ready
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
