title: English C - Past Yes/No Questions
level: C
subject: english
difficulty: 3
objectives:
  - A2.grammar.past_simple
  - A2.grammar.questions
authorNotes: "'Did' + subject + base verb. With 'to be', invert was/were."
repeatAll: 2
example: Você foi? → Did you go?
pages:
  - pageNumber: 1
    title: Did + Subject + Base Verb
    description: Standard past yes/no questions.
    exercises:
      - type: english_phrases
        question: Você foi?
        correctAnswer: did you go
        rationale: "'Did' + sujeito + verbo BASE. 'Go' (não 'went') — o 'did' já marca passado."
      - type: english_phrases
        question: Ele viu o filme?
        correctAnswer: did he see the movie
        rationale: "'See' base (não 'saw'). 'The movie' específico — artigo obrigatório."
      - type: english_phrases
        question: Ela gostou?
        correctAnswer: did she like it
        rationale: "'Like' precisa de objeto — 'it' completa a frase. 'Did she like' é incompleto."
      - type: english_phrases
        question: Vocês comeram?
        correctAnswer: did you eat
        rationale: "'Eat' base. 'Did' serve singular e plural — 'did you' funciona para ambos."
      - type: english_phrases
        question: Eles estudaram?
        correctAnswer: did they study
        rationale: "'Study' base (não 'studied'). Regra fixa — 'did' + verbo base."
      - type: english_phrases
        question: Você me ligou?
        correctAnswer: did you call me
        rationale: "'Call' regular, base após 'did'. 'Me' pronome objeto."
      - type: english_phrases
        question: Ele trabalhou ontem?
        correctAnswer: did he work yesterday
        rationale: "'Work' base. Marcador 'yesterday' reforça o passado."
      - type: english_phrases
        question: Você dormiu bem?
        correctAnswer: did you sleep well
        rationale: "'Sleep' base (não 'slept'). 'Well' advérbio no fim."
      - type: english_phrases
        question: Ela chegou cedo?
        correctAnswer: did she arrive early
        rationale: "'Arrive' base. 'Early' = cedo (adjetivo/advérbio invariável)."
      - type: english_phrases
        question: Eles te viram?
        correctAnswer: did they see you
        rationale: "'See' base + objeto 'you'. Ordem — verbo + objeto no final."
  - pageNumber: 2
    title: Was / Were Questions
    description: Past questions with 'to be'.
    exercises:
      - type: english_phrases
        question: Você estava em casa?
        correctAnswer: were you at home
        rationale: "'You' sempre com 'were' (singular ou plural). 'At home' expressão fixa."
      - type: english_phrases
        question: Ela estava cansada?
        correctAnswer: was she tired
        rationale: "Inversão direta com 'to be' — sem 'did'. 'Was she' (3ª pessoa singular)."
      - type: english_phrases
        question: Eles estavam juntos?
        correctAnswer: were they together
        rationale: "'They' + 'were'. 'Together' é advérbio — depois do verbo."
      - type: english_phrases
        question: Estava frio?
        correctAnswer: was it cold
        rationale: "Clima — 'it' obrigatório. 'Was it' — inversão + sujeito."
      - type: english_phrases
        question: Você era estudante?
        correctAnswer: were you a student
        rationale: "'Were you' + artigo 'a' obrigatório antes de profissão/status."
      - type: english_phrases
        question: Eles estavam lá?
        correctAnswer: were they there
        rationale: "'There' (lá). Inversão — 'were they'."
      - type: english_phrases
        question: Ele estava certo?
        correctAnswer: was he right
        rationale: "'Was he' — inversão. 'Right' adjetivo."
      - type: english_phrases
        question: Nós estávamos atrasados?
        correctAnswer: were we late
        rationale: "'We' plural → 'were'. 'Late' adjetivo direto."
      - type: english_phrases
        question: Ela estava doente?
        correctAnswer: was she sick
        rationale: "'Sick' (AmE) ou 'ill' (BrE). 'Was she' — 3ª pessoa."
      - type: english_phrases
        question: Vocês estavam prontos?
        correctAnswer: were you ready
        rationale: "'You' singular ou plural — sempre 'were'. 'Ready' adjetivo sem artigo."
target: 20
