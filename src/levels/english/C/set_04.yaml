title: English C - Was / Were
level: C
subject: english
repeatAll: 2
example: "Past 'to be': was (I/he/she/it), were (you/we/they)."
pages:
  - pageNumber: 1
    title: Was / Were
    description: Translate past sentences of "to be".
    exercises:
      - { type: english_phrases, question: "Eu estava feliz", correctAnswer: i was happy }
      - { type: english_phrases, question: "Você estava cansado", correctAnswer: you were tired }
      - { type: english_phrases, question: "Ele era aluno", correctAnswer: he was a student }
      - { type: english_phrases, question: "Ela estava aqui", correctAnswer: she was here }
      - { type: english_phrases, question: "Nós estávamos juntos", correctAnswer: we were together }
      - { type: english_phrases, question: "Eles eram amigos", correctAnswer: they were friends }
      - { type: english_phrases, question: "Estava frio", correctAnswer: it was cold }
      - { type: english_phrases, question: "Eu era criança", correctAnswer: i was a child }
      - { type: english_phrases, question: "Ela estava doente", correctAnswer: she was sick }
      - { type: english_phrases, question: "Vocês estavam certos", correctAnswer: you were right }
  - pageNumber: 2
    title: Was not / Were not
    description: Translate past negatives of "to be".
    exercises:
      - { type: english_phrases, question: "Eu não estava feliz", correctAnswer: i was not happy }
      - { type: english_phrases, question: "Ele não estava aqui", correctAnswer: he was not here }
      - { type: english_phrases, question: "Nós não éramos amigos", correctAnswer: we were not friends }
      - { type: english_phrases, question: "Ela não era aluna", correctAnswer: she was not a student }
      - { type: english_phrases, question: "Eles não estavam prontos", correctAnswer: they were not ready }
      - { type: english_phrases, question: "Não estava chovendo", correctAnswer: it was not raining }
      - { type: english_phrases, question: "Você não estava em casa", correctAnswer: you were not at home }
      - { type: english_phrases, question: "Eu não era alto", correctAnswer: i was not tall }
      - { type: english_phrases, question: "Ele não estava cansado", correctAnswer: he was not tired }
      - { type: english_phrases, question: "Não era meu livro", correctAnswer: it was not my book }
target: 20
