title: English C - Was / Were
level: C
subject: english
repeatAll: 2
example: "Past 'to be': was (I/he/she/it), were (you/we/they)."
pages:
  - pageNumber: 1
    title: Was / Were
    description: Translate past sentences of "to be".
    exercises:
      - type: english_phrases
        question: Eu estava feliz
        correctAnswer: i was happy
        rationale: "Regra do passado de 'to be' — 'was' para I/he/she/it; 'were' para you/we/they."
      - type: english_phrases
        question: Você estava cansado
        correctAnswer: you were tired
        rationale: "'You' sempre com 'were' (mesmo no singular). Nunca 'you was' em inglês padrão."
      - type: english_phrases
        question: Ele era aluno
        correctAnswer: he was a student
        rationale: "'Was' para 'he'. Profissão/status com artigo 'a' — 'a student', não 'student'."
      - type: english_phrases
        question: Ela estava aqui
        correctAnswer: she was here
        rationale: "'She' pede 'was'. 'Here' é advérbio — vem depois do verbo."
      - type: english_phrases
        question: Nós estávamos juntos
        correctAnswer: we were together
        rationale: "'We' → 'were'. 'Together' é advérbio (juntos) — vem depois do verbo."
      - type: english_phrases
        question: Eles eram amigos
        correctAnswer: they were friends
        rationale: "'They' pede 'were'. Plural 'friends' sem artigo — ideia genérica."
      - type: english_phrases
        question: Estava frio
        correctAnswer: it was cold
        rationale: "Clima — sujeito 'it' obrigatório. 'It' + 'was' para ambiente/tempo."
      - type: english_phrases
        question: Eu era criança
        correctAnswer: i was a child
        rationale: "Substantivo contável exige artigo — 'a child'. Plural irregular 'children'."
      - type: english_phrases
        question: Ela estava doente
        correctAnswer: she was sick
        rationale: "'Sick' = doente. 'Ill' é mais formal/britânico. 'Was' para 'she'."
      - type: english_phrases
        question: Vocês estavam certos
        correctAnswer: you were right
        rationale: "'You' (singular ou plural) sempre com 'were'. 'Right' aqui = certo/correto."
  - pageNumber: 2
    title: Was not / Were not
    description: Translate past negatives of "to be".
    exercises:
      - type: english_phrases
        question: Eu não estava feliz
        correctAnswer: i was not happy
        rationale: "Negativa — insere 'not' depois de 'was'. Contração — 'wasn't'."
      - type: english_phrases
        question: Ele não estava aqui
        correctAnswer: he was not here
        rationale: "'Was not' contrai para 'wasn't'. Estrutura — sujeito + was/were + not + complemento."
      - type: english_phrases
        question: Nós não éramos amigos
        correctAnswer: we were not friends
        rationale: "'Were not' → 'weren't'. Plural de 'we' exige 'were', não 'was'."
      - type: english_phrases
        question: Ela não era aluna
        correctAnswer: she was not a student
        rationale: "Profissão mesmo em negativa pede artigo 'a' — 'was not a student'."
      - type: english_phrases
        question: Eles não estavam prontos
        correctAnswer: they were not ready
        rationale: "'Were not' contrai 'weren't'. Adjetivo 'ready' direto — sem artigo."
      - type: english_phrases
        question: Não estava chovendo
        correctAnswer: it was not raining
        rationale: "Past continuous — was/were + verbo-ing. 'It was not raining' — ação em progresso no passado."
      - type: english_phrases
        question: Você não estava em casa
        correctAnswer: you were not at home
        rationale: "'At home' — expressão fixa, sem artigo. 'You were' sempre (nunca 'you was')."
      - type: english_phrases
        question: Eu não era alto
        correctAnswer: i was not tall
        rationale: "'I was not' — mesma regra. 'Tall' adjetivo sem artigo."
      - type: english_phrases
        question: Ele não estava cansado
        correctAnswer: he was not tired
        rationale: "'Tired' particípio usado como adjetivo. Invariável em inglês."
      - type: english_phrases
        question: Não era meu livro
        correctAnswer: it was not my book
        rationale: "'It' como sujeito — necessário em inglês. 'My book' — possessivo sem artigo."
target: 20
