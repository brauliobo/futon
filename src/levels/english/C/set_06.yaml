title: English C - Past Irregular (be, have, do)
level: C
subject: english
difficulty: 2
objectives:
  - A2.grammar.past_irregular
authorNotes: High-frequency irregular verbs — was/were, had, did. Taught before lexical irregulars.
repeatAll: 2
example: Eu era feliz → I was happy
pages:
  - pageNumber: 1
    title: Was / Were
    description: Past of 'to be' — singular 'was', plural 'were'.
    exercises:
      - type: english_phrases
        question: Eu era feliz
        correctAnswer: i was happy
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele estava cansado
        correctAnswer: he was tired
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela estava em casa
        correctAnswer: she was at home
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós estávamos atrasados
        correctAnswer: we were late
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles eram amigos
        correctAnswer: they were friends
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você estava certo
        correctAnswer: you were right
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Estava frio ontem
        correctAnswer: it was cold yesterday
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Éramos estudantes
        correctAnswer: we were students
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O filme foi longo
        correctAnswer: the movie was long
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Elas estavam felizes
        correctAnswer: they were happy
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Had / Did
    description: Past of 'to have' (had) and 'to do' (did).
    exercises:
      - type: english_phrases
        question: Eu tive uma ideia
        correctAnswer: i had an idea
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela teve um sonho
        correctAnswer: she had a dream
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós tivemos sorte
        correctAnswer: we had luck
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles tinham um cachorro
        correctAnswer: they had a dog
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele fez a lição
        correctAnswer: he did the homework
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu fiz o meu melhor
        correctAnswer: i did my best
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você fez isso?
        correctAnswer: did you do it
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela teve que sair
        correctAnswer: she had to leave
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós fizemos o bolo
        correctAnswer: we made the cake
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu tive um bom dia
        correctAnswer: i had a good day
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
