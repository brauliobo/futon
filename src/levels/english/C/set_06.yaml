title: English C - Past Irregular (be, have, do)
level: C
subject: english
difficulty: 2
objectives: [A2.grammar.past_irregular]
authorNotes: High-frequency irregular verbs — was/were, had, did. Taught before lexical irregulars.
repeatAll: 2
example: "Eu era feliz → I was happy"
pages:
  - pageNumber: 1
    title: Was / Were
    description: Past of 'to be' — singular 'was', plural 'were'.
    exercises:
      - { type: english_phrases, question: "Eu era feliz", correctAnswer: i was happy }
      - { type: english_phrases, question: "Ele estava cansado", correctAnswer: he was tired }
      - { type: english_phrases, question: "Ela estava em casa", correctAnswer: she was at home }
      - { type: english_phrases, question: "Nós estávamos atrasados", correctAnswer: we were late }
      - { type: english_phrases, question: "Eles eram amigos", correctAnswer: they were friends }
      - { type: english_phrases, question: "Você estava certo", correctAnswer: you were right }
      - { type: english_phrases, question: "Estava frio ontem", correctAnswer: it was cold yesterday }
      - { type: english_phrases, question: "Éramos estudantes", correctAnswer: we were students }
      - { type: english_phrases, question: "O filme foi longo", correctAnswer: the movie was long }
      - { type: english_phrases, question: "Elas estavam felizes", correctAnswer: they were happy }
  - pageNumber: 2
    title: Had / Did
    description: Past of 'to have' (had) and 'to do' (did).
    exercises:
      - { type: english_phrases, question: "Eu tive uma ideia", correctAnswer: i had an idea }
      - { type: english_phrases, question: "Ela teve um sonho", correctAnswer: she had a dream }
      - { type: english_phrases, question: "Nós tivemos sorte", correctAnswer: we had luck }
      - { type: english_phrases, question: "Eles tinham um cachorro", correctAnswer: they had a dog }
      - { type: english_phrases, question: "Ele fez a lição", correctAnswer: he did the homework }
      - { type: english_phrases, question: "Eu fiz o meu melhor", correctAnswer: i did my best }
      - { type: english_phrases, question: "Você fez isso?", correctAnswer: did you do it }
      - { type: english_phrases, question: "Ela teve que sair", correctAnswer: she had to leave }
      - { type: english_phrases, question: "Nós fizemos o bolo", correctAnswer: we made the cake }
      - { type: english_phrases, question: "Eu tive um bom dia", correctAnswer: i had a good day }
target: 20
