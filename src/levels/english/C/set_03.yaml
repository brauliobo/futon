title: English C - Past Sentences
level: C
subject: english
difficulty: 2
objectives:
  - A2.grammar.past_simple
repeatAll: 2
authorNotes: "English C - Past Sentences. Foque no conceito central do conjunto e nos erros comuns."
example: "Yesterday I went to school. Ex.: Ontem eu fui à escola → Yesterday I went to school."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Yesterday Sentences
    description: Translate full sentences in past tense.
    exercises:
      - type: english_phrases
        question: Ontem eu fui à escola
        correctAnswer: Yesterday I went to school
        rationale: "Marcador temporal 'yesterday' aciona o past simple. 'To school' — atividade, sem artigo."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ela viu um filme
        correctAnswer: She saw a movie
        rationale: "See → saw (irregular). 'Movie' (AmE) / 'film' (BrE). Artigo 'a' antes de consoante."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Nós comemos pizza
        correctAnswer: We ate pizza
        rationale: "Eat → ate. 'Pizza' incontável em contexto genérico — sem artigo."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ele jogou futebol
        correctAnswer: He played soccer
        rationale: "Play → played (regular). Esportes em inglês geralmente sem artigo — 'play soccer', 'play chess'."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eles foram ao parque
        correctAnswer: They went to the park
        rationale: "Go → went. 'The park' — artigo obrigatório para lugar físico específico."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu estudei matemática
        correctAnswer: I studied math
        rationale: "Study → studied (y vira ied). 'Math' (AmE) / 'maths' (BrE). Disciplinas sem artigo."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ela leu um livro
        correctAnswer: She read a book
        rationale: "Read no passado escreve-se igual, mas soa 'réd' (vogal curta). Contexto + tempo diferenciam."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Nós dançamos a noite toda
        correctAnswer: We danced all night
        rationale: "Dance → danced (só -d, já termina em -e). 'All night' — sem artigo nem preposição."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ele trabalhou ontem
        correctAnswer: He worked yesterday
        rationale: "Marcador temporal 'yesterday' confirma o passado. Posição — geralmente no fim ou início da frase."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu dormi cedo
        correctAnswer: I slept early
        rationale: "Sleep → slept (irregular). 'Early' é advérbio sem -ly — forma invariável."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
target: 10
