title: English C - Past Irregular (go, come, see, get)
level: C
subject: english
difficulty: 3
objectives: [A2.grammar.past_irregular]
authorNotes: Core lexical irregulars — went, came, saw, got. Frequency-prioritised set.
repeatAll: 2
example: "Eu fui → I went"
pages:
  - pageNumber: 1
    title: Go / Come / See
    description: went, came, saw.
    exercises:
      - { type: english_phrases, question: "Eu fui para a escola", correctAnswer: i went to school }
      - { type: english_phrases, question: "Ela foi embora", correctAnswer: she went away }
      - { type: english_phrases, question: "Eles foram para casa", correctAnswer: they went home }
      - { type: english_phrases, question: "Ele veio aqui", correctAnswer: he came here }
      - { type: english_phrases, question: "Nós viemos cedo", correctAnswer: we came early }
      - { type: english_phrases, question: "Você veio ontem", correctAnswer: you came yesterday }
      - { type: english_phrases, question: "Eu vi o filme", correctAnswer: i saw the movie }
      - { type: english_phrases, question: "Ela viu o acidente", correctAnswer: she saw the accident }
      - { type: english_phrases, question: "Nós vimos um pássaro", correctAnswer: we saw a bird }
      - { type: english_phrases, question: "Eles viram a notícia", correctAnswer: they saw the news }
  - pageNumber: 2
    title: Get / Take / Give
    description: got, took, gave.
    exercises:
      - { type: english_phrases, question: "Eu peguei o ônibus", correctAnswer: i took the bus }
      - { type: english_phrases, question: "Ela recebeu uma carta", correctAnswer: she got a letter }
      - { type: english_phrases, question: "Nós pegamos o trem", correctAnswer: we took the train }
      - { type: english_phrases, question: "Ele deu um presente", correctAnswer: he gave a gift }
      - { type: english_phrases, question: "Eu consegui o emprego", correctAnswer: i got the job }
      - { type: english_phrases, question: "Ela tirou uma foto", correctAnswer: she took a photo }
      - { type: english_phrases, question: "Eles deram uma festa", correctAnswer: they gave a party }
      - { type: english_phrases, question: "Você pegou as chaves?", correctAnswer: did you take the keys }
      - { type: english_phrases, question: "Eu me levantei cedo", correctAnswer: i got up early }
      - { type: english_phrases, question: "Ela me deu um livro", correctAnswer: she gave me a book }
target: 20
