title: English C - Past Irregular (go, come, see, get)
level: C
subject: english
difficulty: 3
objectives:
  - A2.grammar.past_irregular
authorNotes: Core lexical irregulars — went, came, saw, got. Frequency-prioritised set.
repeatAll: 2
example: Eu fui → I went
pages:
  - pageNumber: 1
    title: Go / Come / See
    description: went, came, saw.
    exercises:
      - type: english_phrases
        question: Eu fui para a escola
        correctAnswer: i went to school
        rationale: "Go → went (totalmente irregular). 'To school' sem artigo — atividade genérica."
      - type: english_phrases
        question: Ela foi embora
        correctAnswer: she went away
        rationale: "'Went away' = foi embora. 'Away' é advérbio de direção (para longe)."
      - type: english_phrases
        question: Eles foram para casa
        correctAnswer: they went home
        rationale: "'Go home' — expressão fixa, sem preposição nem artigo. No passado 'went home'."
      - type: english_phrases
        question: Ele veio aqui
        correctAnswer: he came here
        rationale: "Come → came; come (particípio). Vogal 'a' no passado, 'o' no infinitivo."
      - type: english_phrases
        question: Nós viemos cedo
        correctAnswer: we came early
        rationale: "'Early' advérbio invariável. 'We came' — 'came' para todos os sujeitos."
      - type: english_phrases
        question: Você veio ontem
        correctAnswer: you came yesterday
        rationale: "'Came' sem flexão para 'you'. Marcador 'yesterday' confirma o passado."
      - type: english_phrases
        question: Eu vi o filme
        correctAnswer: i saw the movie
        rationale: "See → saw. 'The movie' específico. Cuidado com 'seen' (particípio, precisa de 'have')."
      - type: english_phrases
        question: Ela viu o acidente
        correctAnswer: she saw the accident
        rationale: "'Saw' na 3ª pessoa — sem -s no passado. 'Accident' com artigo 'the' (acidente específico)."
      - type: english_phrases
        question: Nós vimos um pássaro
        correctAnswer: we saw a bird
        rationale: "'A bird' — indefinido (qualquer pássaro). Plural seria 'saw birds'."
      - type: english_phrases
        question: Eles viram a notícia
        correctAnswer: they saw the news
        rationale: "'News' é sempre singular em inglês (incontável) — 'the news'."
  - pageNumber: 2
    title: Get / Take / Give
    description: got, took, gave.
    exercises:
      - type: english_phrases
        question: Eu peguei o ônibus
        correctAnswer: i took the bus
        rationale: "Take → took; taken. 'Take the bus' = pegar o ônibus. 'The bus' específico."
      - type: english_phrases
        question: Ela recebeu uma carta
        correctAnswer: she got a letter
        rationale: "Get → got; gotten (AmE) / got (BrE). 'Got' pode significar receber, pegar, ter."
      - type: english_phrases
        question: Nós pegamos o trem
        correctAnswer: we took the train
        rationale: "'Take the train' — mesma estrutura de 'take the bus'. Transporte público usa 'take'."
      - type: english_phrases
        question: Ele deu um presente
        correctAnswer: he gave a gift
        rationale: "Give → gave; given. 'Gift' ou 'present' — sinônimos para presente."
      - type: english_phrases
        question: Eu consegui o emprego
        correctAnswer: i got the job
        rationale: "'Got the job' = consegui o emprego. 'Get' tem muitos sentidos — contexto define."
      - type: english_phrases
        question: Ela tirou uma foto
        correctAnswer: she took a photo
        rationale: "'Take a photo' (AmE) / 'take a picture' — expressão fixa. Não use 'make' aqui."
      - type: english_phrases
        question: Eles deram uma festa
        correctAnswer: they gave a party
        rationale: "'Give a party' = dar/fazer uma festa. Também aceita 'throw a party' (coloquial)."
      - type: english_phrases
        question: Você pegou as chaves?
        correctAnswer: did you take the keys
        rationale: "Pergunta no passado — 'did' + verbo base ('take', não 'took'). 'Keys' plural."
      - type: english_phrases
        question: Eu me levantei cedo
        correctAnswer: i got up early
        rationale: "'Get up' = levantar-se. Phrasal verb — 'up' é essencial. Passado 'got up'."
      - type: english_phrases
        question: Ela me deu um livro
        correctAnswer: she gave me a book
        rationale: "'Give' aceita dois objetos — 'gave me a book' ou 'gave a book to me'. 'Me' pronome objeto."
target: 20
