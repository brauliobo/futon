        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles viram a notícia
        correctAnswer: they saw the news
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Get / Take / Give
    description: got, took, gave.
    exercises:
      - type: english_phrases
        question: Eu peguei o ônibus
        correctAnswer: i took the bus
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela recebeu uma carta
        correctAnswer: she got a letter
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
