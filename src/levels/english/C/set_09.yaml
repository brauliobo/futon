title: English C - Past Negatives
level: C
subject: english
difficulty: 3
objectives:
  - A2.grammar.past_simple
  - A2.grammar.negation
authorNotes: "'didn't' + base verb (never the past form). Use 'wasn't / weren't' for 'to be'."
repeatAll: 2
example: Eu não fui → I did not go
pages:
  - pageNumber: 1
    title: Didn't + Base Verb
    description: Base verb after 'didn't', not the past form.
    exercises:
      - type: english_phrases
        question: Eu não fui
        correctAnswer: i did not go
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não viu
        correctAnswer: she did not see
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele não comeu
        correctAnswer: he did not eat
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós não trabalhamos
        correctAnswer: we did not work
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles não estudaram
        correctAnswer: they did not study
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu não dormi bem
        correctAnswer: i did not sleep well
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não gostou
        correctAnswer: she did not like it
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você não respondeu
        correctAnswer: you did not answer
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele não entendeu
        correctAnswer: he did not understand
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós não compramos
        correctAnswer: we did not buy
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Wasn't / Weren't
    description: Negative of 'was/were' — no 'did'.
    exercises:
      - type: english_phrases
        question: Eu não estava cansado
        correctAnswer: i was not tired
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não estava em casa
        correctAnswer: she was not at home
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele não era alto
        correctAnswer: he was not tall
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós não estávamos prontos
        correctAnswer: we were not ready
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles não eram amigos
        correctAnswer: they were not friends
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Não estava frio
        correctAnswer: it was not cold
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você não estava lá
        correctAnswer: you were not there
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu não estava feliz
        correctAnswer: i was not happy
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles não estavam certos
        correctAnswer: they were not right
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não estava doente
        correctAnswer: she was not sick
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
