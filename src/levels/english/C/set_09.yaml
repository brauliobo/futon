title: English C - Past Negatives
level: C
subject: english
difficulty: 3
objectives:
  - A2.grammar.past_simple
  - A2.grammar.negation
authorNotes: "'didn't' + base verb (never the past form). Use 'wasn't / weren't' for 'to be'."
repeatAll: 2
example: Eu não fui → I did not go
pages:
  - pageNumber: 1
    title: Didn't + Base Verb
    description: Base verb after 'didn't', not the past form.
    exercises:
      - type: english_phrases
        question: Eu não fui
        correctAnswer: i did not go
        rationale: "Negativa no passado — 'did not' + verbo BASE. 'Did not went' é erro comum. 'Did' já é passado."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Ela não viu
        correctAnswer: she did not see
        rationale: "'See' na base (não 'saw'). Auxiliar 'did' carrega o tempo; verbo principal fica nu."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Ele não comeu
        correctAnswer: he did not eat
        rationale: "'Eat' base, não 'ate'. Contração — 'he didn't eat'."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Nós não trabalhamos
        correctAnswer: we did not work
        rationale: "'Work' base. Mesmo auxiliar 'did' para todos os sujeitos — sem flexão de pessoa."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Eles não estudaram
        correctAnswer: they did not study
        rationale: "'Study' base (não 'studied'). Não aplica a regra y→ied quando precedido por 'did'."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Eu não dormi bem
        correctAnswer: i did not sleep well
        rationale: "'Sleep' base (não 'slept'). 'Well' = bem (advérbio invariável)."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Ela não gostou
        correctAnswer: she did not like it
        rationale: "'Like' precisa de objeto — 'like it'. Sem objeto, a frase fica incompleta."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Você não respondeu
        correctAnswer: you did not answer
        rationale: "'Answer' é regular, mas fica na base após 'did'. 'Did not answered' é erro."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Ele não entendeu
        correctAnswer: he did not understand
        rationale: "'Understand' irregular (understood), mas volta à base com 'did'. Nunca 'did not understood'."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Nós não compramos
        correctAnswer: we did not buy
        rationale: "'Buy' base (não 'bought'). 'We didn't buy anything' — negativa comum."
        difficulty: 2
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
  - pageNumber: 2
    title: Wasn't / Weren't
    description: Negative of 'was/were' — no 'did'.
    exercises:
      - type: english_phrases
        question: Eu não estava cansado
        correctAnswer: i was not tired
        rationale: "Com 'to be', insere 'not' direto — sem auxiliar 'did'. Contração 'wasn't'."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Ela não estava em casa
        correctAnswer: she was not at home
        rationale: "'She' pede 'was not'. 'At home' — expressão fixa."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Ele não era alto
        correctAnswer: he was not tall
        rationale: "'Was' para 'he/she/it' no passado. 'Tall' direto."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Nós não estávamos prontos
        correctAnswer: we were not ready
        rationale: "'We/you/they' pede 'were'. 'Weren't' (contração) é informal."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Eles não eram amigos
        correctAnswer: they were not friends
        rationale: "'Were not' — plural. Plural 'friends' sem artigo — genérico."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Não estava frio
        correctAnswer: it was not cold
        rationale: "Clima — 'it' obrigatório. 'It was not cold' ou 'it wasn't cold'."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Você não estava lá
        correctAnswer: you were not there
        rationale: "'You' sempre 'were'. 'There' = lá/aí (advérbio de lugar)."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Eu não estava feliz
        correctAnswer: i was not happy
        rationale: "'I was not' — sem contração natural ('*Iwasn't' não existe). Use 'I wasn't'."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Eles não estavam certos
        correctAnswer: they were not right
        rationale: "'They were not'. 'Right' adjetivo = certo/correto."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
      - type: english_phrases
        question: Ela não estava doente
        correctAnswer: she was not sick
        rationale: "'Was not'. 'Sick' (AmE) ou 'ill' (BrE) — ambos corretos."
        difficulty: 3
        objectives: [A2.grammar.past_simple, A2.grammar.negation]
target: 20
