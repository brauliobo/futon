title: English C - Past Negatives
level: C
subject: english
difficulty: 3
objectives: [A2.grammar.past_simple, A2.grammar.negation]
authorNotes: "'didn't' + base verb (never the past form). Use 'wasn't / weren't' for 'to be'."
repeatAll: 2
example: "Eu não fui → I did not go"
pages:
  - pageNumber: 1
    title: Didn't + Base Verb
    description: Base verb after 'didn't', not the past form.
    exercises:
      - { type: english_phrases, question: "Eu não fui", correctAnswer: i did not go }
      - { type: english_phrases, question: "Ela não viu", correctAnswer: she did not see }
      - { type: english_phrases, question: "Ele não comeu", correctAnswer: he did not eat }
      - { type: english_phrases, question: "Nós não trabalhamos", correctAnswer: we did not work }
      - { type: english_phrases, question: "Eles não estudaram", correctAnswer: they did not study }
      - { type: english_phrases, question: "Eu não dormi bem", correctAnswer: i did not sleep well }
      - { type: english_phrases, question: "Ela não gostou", correctAnswer: she did not like it }
      - { type: english_phrases, question: "Você não respondeu", correctAnswer: you did not answer }
      - { type: english_phrases, question: "Ele não entendeu", correctAnswer: he did not understand }
      - { type: english_phrases, question: "Nós não compramos", correctAnswer: we did not buy }
  - pageNumber: 2
    title: Wasn't / Weren't
    description: Negative of 'was/were' — no 'did'.
    exercises:
      - { type: english_phrases, question: "Eu não estava cansado", correctAnswer: i was not tired }
      - { type: english_phrases, question: "Ela não estava em casa", correctAnswer: she was not at home }
      - { type: english_phrases, question: "Ele não era alto", correctAnswer: he was not tall }
      - { type: english_phrases, question: "Nós não estávamos prontos", correctAnswer: we were not ready }
      - { type: english_phrases, question: "Eles não eram amigos", correctAnswer: they were not friends }
      - { type: english_phrases, question: "Não estava frio", correctAnswer: it was not cold }
      - { type: english_phrases, question: "Você não estava lá", correctAnswer: you were not there }
      - { type: english_phrases, question: "Eu não estava feliz", correctAnswer: i was not happy }
      - { type: english_phrases, question: "Eles não estavam certos", correctAnswer: they were not right }
      - { type: english_phrases, question: "Ela não estava doente", correctAnswer: she was not sick }
target: 20
