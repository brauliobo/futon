title: English C - Past Questions
level: C
subject: english
repeatAll: 2
example: "Did you go? Did he see? Was she happy?"
pages:
  - pageNumber: 1
    title: Past Questions with "did"
    description: Form questions in past tense.
    exercises:
      - { type: english_phrases, question: "Você foi?", correctAnswer: did you go }
      - { type: english_phrases, question: "Ele viu?", correctAnswer: did he see }
      - { type: english_phrases, question: "Ela comeu?", correctAnswer: did she eat }
      - { type: english_phrases, question: "Vocês chegaram?", correctAnswer: did you arrive }
      - { type: english_phrases, question: "Eles jogaram?", correctAnswer: did they play }
      - { type: english_phrases, question: "Você gostou?", correctAnswer: did you like it }
      - { type: english_phrases, question: "Ele ajudou?", correctAnswer: did he help }
      - { type: english_phrases, question: "Ela estudou?", correctAnswer: did she study }
      - { type: english_phrases, question: "Nós vencemos?", correctAnswer: did we win }
      - { type: english_phrases, question: "Eles viajaram?", correctAnswer: did they travel }
  - pageNumber: 2
    title: Was/Were Questions
    description: Form questions using was/were.
    exercises:
      - { type: english_phrases, question: "Você estava aqui?", correctAnswer: were you here }
      - { type: english_phrases, question: "Ele estava feliz?", correctAnswer: was he happy }
      - { type: english_phrases, question: "Ela estava em casa?", correctAnswer: was she at home }
      - { type: english_phrases, question: "Nós estávamos certos?", correctAnswer: were we right }
      - { type: english_phrases, question: "Eles estavam prontos?", correctAnswer: were they ready }
      - { type: english_phrases, question: "Estava chovendo?", correctAnswer: was it raining }
      - { type: english_phrases, question: "Você era criança?", correctAnswer: were you a child }
      - { type: english_phrases, question: "Ele era professor?", correctAnswer: was he a teacher }
      - { type: english_phrases, question: "Eles eram amigos?", correctAnswer: were they friends }
      - { type: english_phrases, question: "Estava quente?", correctAnswer: was it hot }
target: 20
