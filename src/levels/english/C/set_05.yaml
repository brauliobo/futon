title: English C - Past Questions
level: C
subject: english
repeatAll: 2
example: Did you go? Did he see? Was she happy?
pages:
  - pageNumber: 1
    title: Past Questions with "did"
    description: Form questions in past tense.
    exercises:
      - type: english_phrases
        question: Você foi?
        correctAnswer: did you go
        rationale: "Perguntas no passado — 'did' + sujeito + verbo BASE (não passado). 'Did you go', não 'did you went'."
      - type: english_phrases
        question: Ele viu?
        correctAnswer: did he see
        rationale: "'Did' é o passado do auxiliar 'do'. Verbo principal volta à forma base ('see', não 'saw')."
      - type: english_phrases
        question: Ela comeu?
        correctAnswer: did she eat
        rationale: "'Did she eat' — 'eat' base, sem flexão. O 'did' já carrega o tempo passado."
      - type: english_phrases
        question: Vocês chegaram?
        correctAnswer: did you arrive
        rationale: "'Did' serve para todos os sujeitos (singular e plural). 'Arrive' base."
      - type: english_phrases
        question: Eles jogaram?
        correctAnswer: did they play
        rationale: "'Did they play' — não 'did they played'. O auxiliar marca o tempo."
      - type: english_phrases
        question: Você gostou?
        correctAnswer: did you like it
        rationale: "'Like' precisa de objeto — 'like it'. Sem 'it', a pergunta fica incompleta."
      - type: english_phrases
        question: Ele ajudou?
        correctAnswer: did he help
        rationale: "'Did he help' sem complemento é válido — pergunta geral. Com objeto — 'did he help you?'"
      - type: english_phrases
        question: Ela estudou?
        correctAnswer: did she study
        rationale: "'Study' volta à base. Cuidado — no afirmativo seria 'she studied', mas com 'did' é 'study'."
      - type: english_phrases
        question: Nós vencemos?
        correctAnswer: did we win
        rationale: "'Win' é irregular (won no passado). Com 'did', sempre base — 'did we win'."
      - type: english_phrases
        question: Eles viajaram?
        correctAnswer: did they travel
        rationale: "'Travel' base após 'did'. Em AmE escreve-se 'traveled'; BrE 'travelled' (duplica L)."
  - pageNumber: 2
    title: Was/Were Questions
    description: Form questions using was/were.
    exercises:
      - type: english_phrases
        question: Você estava aqui?
        correctAnswer: were you here
        rationale: "Com 'to be', inverte-se direto — sem 'did'. 'Were you here' (não 'did you were here')."
      - type: english_phrases
        question: Ele estava feliz?
        correctAnswer: was he happy
        rationale: "'Was' (he/she/it) + sujeito + adjetivo. Regra de inversão para 'to be'."
      - type: english_phrases
        question: Ela estava em casa?
        correctAnswer: was she at home
        rationale: "'Was she at home' — inversão + expressão fixa 'at home'."
      - type: english_phrases
        question: Nós estávamos certos?
        correctAnswer: were we right
        rationale: "'We' pede 'were'. Inversão — 'were we'."
      - type: english_phrases
        question: Eles estavam prontos?
        correctAnswer: were they ready
        rationale: "'They' + 'were' → pergunta 'were they'. 'Ready' adjetivo sem artigo."
      - type: english_phrases
        question: Estava chovendo?
        correctAnswer: was it raining
        rationale: "Past continuous em pergunta — 'was/were' + sujeito + verbo-ing. Clima exige 'it'."
      - type: english_phrases
        question: Você era criança?
        correctAnswer: were you a child
        rationale: "'Were you' + substantivo contável com artigo 'a'. Plural 'children' seria 'were you children'."
      - type: english_phrases
        question: Ele era professor?
        correctAnswer: was he a teacher
        rationale: "'Was he' + 'a teacher'. Profissão precisa do artigo 'a'."
      - type: english_phrases
        question: Eles eram amigos?
        correctAnswer: were they friends
        rationale: "Plural 'friends' — sem artigo, ideia genérica. 'Were they friends' — pergunta com inversão."
      - type: english_phrases
        question: Estava quente?
        correctAnswer: was it hot
        rationale: "Clima — 'was it' (inversão) + adjetivo. 'It' como sujeito vazio obrigatório."
target: 20
