title: English C - Past Tense (Regular)
level: C
subject: english
repeatAll: 2
example: "Past tense regular verbs. Ex.: Eu andei → I walked"
pages:
  - pageNumber: 1
    title: Regular Past — Simple Actions
    description: Translate using regular past tense (verb + ed).
    exercises:
      - { type: english_phrases, question: "Eu andei", correctAnswer: i walked }
      - { type: english_phrases, question: "Eu joguei", correctAnswer: i played }
      - { type: english_phrases, question: "Eu olhei", correctAnswer: i looked }
      - { type: english_phrases, question: "Eu toquei", correctAnswer: i touched }
      - { type: english_phrases, question: "Eu dancei", correctAnswer: i danced }
      - { type: english_phrases, question: "Eu cozinhei", correctAnswer: i cooked }
      - { type: english_phrases, question: "Eu gostei", correctAnswer: i liked }
      - { type: english_phrases, question: "Eu quis (desejei)", correctAnswer: i wanted }
      - { type: english_phrases, question: "Eu terminei", correctAnswer: i finished }
      - { type: english_phrases, question: "Eu abri (to open = opened)", correctAnswer: i opened }
  - pageNumber: 2
    title: Past Tense — He/She/They
    description: Translate using past tense.
    exercises:
      - { type: english_phrases, question: "Ele jogou", correctAnswer: he played }
      - { type: english_phrases, question: "Ela andou", correctAnswer: she walked }
      - { type: english_phrases, question: "Eles estudaram", correctAnswer: they studied }
      - { type: english_phrases, question: "Ela ajudou", correctAnswer: she helped }
      - { type: english_phrases, question: "Ele trabalhou", correctAnswer: he worked }
      - { type: english_phrases, question: "Nós brincamos", correctAnswer: we played }
      - { type: english_phrases, question: "Eles pularam", correctAnswer: they jumped }
      - { type: english_phrases, question: "Ela terminou", correctAnswer: she finished }
      - { type: english_phrases, question: "Nós caminhamos", correctAnswer: we walked }
      - { type: english_phrases, question: "Eles gostaram", correctAnswer: they liked }
target: 20
