title: English C - Past Tense (Regular)
level: C
subject: english
repeatAll: 2
example: "Past tense regular verbs. Ex.: Eu andei → I walked"
pages:
  - pageNumber: 1
    title: Regular Past — Simple Actions
    description: Translate using regular past tense (verb + ed).
    exercises:
      - type: english_phrases
        question: Eu andei
        correctAnswer: i walked
        rationale: "Verbos regulares no passado recebem sufixo -ed. Pronúncia -t após consoante surda (walk → walked, soa 'uôkt')."
      - type: english_phrases
        question: Eu joguei
        correctAnswer: i played
        rationale: "Verbo terminado em vogal + y mantém o y — play → played. -ed soa 'd' suave."
      - type: english_phrases
        question: Eu olhei
        correctAnswer: i looked
        rationale: "Look + ed. Pronúncia 'lúkt' — k surdo faz -ed soar 't'."
      - type: english_phrases
        question: Eu toquei
        correctAnswer: i touched
        rationale: "Touch termina em -ch — adiciona -ed direto (sem -e extra). Pronúncia 'tatcht'."
      - type: english_phrases
        question: Eu dancei
        correctAnswer: i danced
        rationale: "Dance já termina em -e — adiciona só -d. Pronúncia 'danst' — -ed soa 't'."
      - type: english_phrases
        question: Eu cozinhei
        correctAnswer: i cooked
        rationale: "Cook + ed. Consoante surda (k) → pronúncia 'kúkt'. Cuidado — não duplica o k."
      - type: english_phrases
        question: Eu gostei
        correctAnswer: i liked
        rationale: "Like termina em -e — adiciona só -d. Pronúncia 'laikt' (k surdo → -ed soa 't')."
      - type: english_phrases
        question: Eu quis (desejei)
        correctAnswer: i wanted
        rationale: "Want termina em -t — -ed soa sílaba nova 'UAN-tid'. Regra — após t/d, -ed vira -id."
      - type: english_phrases
        question: Eu terminei
        correctAnswer: i finished
        rationale: "Finish + ed. Consoante surda (sh) → -ed soa 't'. Pronúncia 'FI-nisht'."
      - type: english_phrases
        question: Eu abri (to open = opened)
        correctAnswer: i opened
        rationale: "Open + ed. Consoante sonora (n) → -ed soa 'd'. Pronúncia 'OU-pend'."
  - pageNumber: 2
    title: Past Tense — He/She/They
    description: Translate using past tense.
    exercises:
      - type: english_phrases
        question: Ele jogou
        correctAnswer: he played
        rationale: "Passado NÃO muda com pessoa — 'he played', 'I played', 'they played'. Só o presente varia."
      - type: english_phrases
        question: Ela andou
        correctAnswer: she walked
        rationale: "Walked serve para todos os sujeitos no passado. Diferença de presente — 'she walks' vs 'I walk'."
      - type: english_phrases
        question: Eles estudaram
        correctAnswer: they studied
        rationale: "Study termina em consoante + y — y vira i antes de -ed (studied). Regra ortográfica."
      - type: english_phrases
        question: Ela ajudou
        correctAnswer: she helped
        rationale: "Help + ed. Consoante surda (p) → -ed soa 't'. Pronúncia 'hélpt'."
      - type: english_phrases
        question: Ele trabalhou
        correctAnswer: he worked
        rationale: "Work + ed. 'Uôrkt' — k surdo faz -ed soar 't'. Cuidado com vogal — 'work' soa 'uórk'."
      - type: english_phrases
        question: Nós brincamos
        correctAnswer: we played
        rationale: "Same as 'I played' — passado é invariável. 'We played' é nós jogamos/brincamos."
      - type: english_phrases
        question: Eles pularam
        correctAnswer: they jumped
        rationale: "Jump + ed. Consoante surda (p) → 't'. Pronúncia 'djampt'."
      - type: english_phrases
        question: Ela terminou
        correctAnswer: she finished
        rationale: "Mesma forma que 'I finished' — passado é uniforme. Só o sujeito muda."
      - type: english_phrases
        question: Nós caminhamos
        correctAnswer: we walked
        rationale: "'We walked' pode ser passado (caminhamos) ou presente (caminhamos) — contexto decide."
      - type: english_phrases
        question: Eles gostaram
        correctAnswer: they liked
        rationale: "Like → liked (termina em -e, só adiciona -d). Consoante surda (k) → -ed soa 't'."
target: 20
