title: 📅 English C - Time Ago
level: C
subject: english
difficulty: 2
objectives:
  - A2.grammar.past_simple
authorNotes: "Structure 'X ago' to express how long ago something happened. Ago always follows the time expression."
repeatAll: 2
example: "Ex.: 'Comi pizza há duas horas' → I ate pizza two hours ago."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Time Ago — Short Sentences
    description: Express when things happened using 'ago'.
    exercises:
      - type: english_phrases
        question: Eu comi pizza há duas horas
        correctAnswer: I ate pizza two hours ago
        rationale: "'Ago' vem depois da expressão de tempo: 'two hours ago'. 'Eat' → 'ate'."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ela saiu há três dias
        correctAnswer: She left three days ago
        rationale: "'Leave' → 'left'. 'Three days ago' — tempo + 'ago'."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ele chegou há uma semana
        correctAnswer: He arrived a week ago
        rationale: "'Arrive' → 'arrived'. 'A week ago' — artigo 'a' antes de 'week'."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Nós nos mudamos há um ano
        correctAnswer: We moved a year ago
        rationale: "'Move' regular → 'moved'. 'A year ago' — um ano atrás."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eles se casaram há cinco anos
        correctAnswer: They got married five years ago
        rationale: "'Get married' = casar. Passado 'got married'. 'Five years ago'."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu comprei este telefone há seis meses
        correctAnswer: I bought this phone six months ago
        rationale: "'Buy' → 'bought'. 'Six months ago' — meses + 'ago'."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ela terminou o trabalho há pouco tempo
        correctAnswer: She finished work a short time ago
        rationale: "'Finish' regular → 'finished'. 'A short time ago' = há pouco tempo."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ele aprendeu inglês há dois anos
        correctAnswer: He learned English two years ago
        rationale: "'Learn' → 'learned'. 'Two years ago' — dois anos atrás."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Nós visitamos Paris há três anos
        correctAnswer: We visited Paris three years ago
        rationale: "'Visit' regular → 'visited'. 'Three years ago'."
        difficulty: 1
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu vi esse filme há muito tempo
        correctAnswer: I saw that film a long time ago
        rationale: "'See' → 'saw'. 'A long time ago' = há muito tempo."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
  - pageNumber: 2
    title: Time Ago — Questions & Negatives
    description: Ask and answer about time using 'ago'.
    exercises:
      - type: english_phrases
        question: Quando você chegou? — Há uma hora
        correctAnswer: When did you arrive? An hour ago
        rationale: "'When did you arrive?' + resposta curta 'An hour ago' — sem verbo repetido."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Há quanto tempo você veio para o Brasil?
        correctAnswer: How long ago did you come to Brazil
        rationale: "'How long ago' pergunta há quanto tempo. 'Come' → 'came' no afirmativo."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Isso aconteceu há muito tempo
        correctAnswer: That happened a long time ago
        rationale: "'Happen' regular → 'happened'. 'A long time ago'."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ela não saiu há muito tempo
        correctAnswer: She did not go out for a long time
        rationale: "'did not go out' — negativa. 'For a long time' = duração, não 'ago'."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eles se conheceram há dez anos
        correctAnswer: They met ten years ago
        rationale: "'Meet' → 'met'. 'Ten years ago' — dez anos atrás."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Você foi ao médico há quanto tempo?
        correctAnswer: How long ago did you go to the doctor
        rationale: "'How long ago did you go' — estrutura para perguntar tempo passado."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Eu terminei a escola há cinco anos
        correctAnswer: I finished school five years ago
        rationale: "'Finish' regular → 'finished'. 'Five years ago'. 'School' sem artigo."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Ela nasceu há trinta anos
        correctAnswer: She was born thirty years ago
        rationale: "'Be born' = nascer. Passado 'was born'. 'Thirty years ago'."
        difficulty: 3
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Isso começou há poucos minutos
        correctAnswer: That started a few minutes ago
        rationale: "'Start' → 'started'. 'A few minutes ago' = poucos minutos atrás."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
      - type: english_phrases
        question: Nós almoçamos há duas horas
        correctAnswer: We had lunch two hours ago
        rationale: "'Have lunch' = almoçar. Passado 'had lunch'. 'Two hours ago'."
        difficulty: 2
        objectives: [A2.grammar.past_simple]
target: 20
