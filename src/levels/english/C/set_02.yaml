title: English C - Past Tense (Irregular)
level: C
subject: english
repeatAll: 2
example: "Irregular past: go→went, see→saw, eat→ate"
pages:
  - pageNumber: 1
    title: Common Irregular Verbs
    description: Translate using irregular past tense.
    exercises:
      - type: english_phrases
        question: Eu fui (ir)
        correctAnswer: i went
        rationale: "Go → went — um dos mais irregulares. Particípio é 'gone'. Não há padrão — decorar."
      - type: english_phrases
        question: Eu vi
        correctAnswer: i saw
        rationale: "See → saw (passado); seen (particípio). Pronúncia de 'saw' é 'sô' — não 'su'."
      - type: english_phrases
        question: Eu comi
        correctAnswer: i ate
        rationale: "Eat → ate; eaten (particípio). 'Ate' pronúncia 'eit' — rima com 'late'."
      - type: english_phrases
        question: Eu bebi
        correctAnswer: i drank
        rationale: "Drink → drank; drunk (particípio). Padrão i→a→u (sing, sang, sung / drink, drank, drunk)."
      - type: english_phrases
        question: Eu dormi
        correctAnswer: i slept
        rationale: "Sleep → slept. Padrão vogal longa → curta + -t (keep/kept, feel/felt)."
      - type: english_phrases
        question: Eu corri
        correctAnswer: i ran
        rationale: "Run → ran; run (particípio). Mesma forma no presente e particípio — passado troca a vogal."
      - type: english_phrases
        question: Eu fiz
        correctAnswer: i did
        rationale: "Do → did; done. 'Did' serve também como auxiliar no passado — 'did you go?'"
      - type: english_phrases
        question: Eu disse
        correctAnswer: i said
        rationale: "Say → said. Grafia quase igual, mas pronúncia muda — 'sei' (presente) → 'séd' (passado)."
      - type: english_phrases
        question: Eu tinha (eu tive)
        correctAnswer: i had
        rationale: "Have → had; had (particípio). Serve para 'tive' e 'tinha' — passado simples em ambos."
      - type: english_phrases
        question: Eu peguei
        correctAnswer: i took
        rationale: "Take → took; taken. Padrão 'took' — pronúncia 'túk' (oo curto como em 'book')."
  - pageNumber: 2
    title: More Irregular Past
    description: Translate using irregular past.
    exercises:
      - type: english_phrases
        question: Ele foi
        correctAnswer: he went
        rationale: "Passado é invariável — 'he went', 'I went', 'they went'. Sem -s mesmo na 3ª pessoa."
      - type: english_phrases
        question: Ela viu
        correctAnswer: she saw
        rationale: "Saw para qualquer sujeito. Cuidado — não confunda com 'seen' (particípio) — 'I have seen'."
      - type: english_phrases
        question: Ele comeu
        correctAnswer: he ate
        rationale: "Ate — mesmo para he/she/it. Não existe 'ated'."
      - type: english_phrases
        question: Nós demos
        correctAnswer: we gave
        rationale: "Give → gave; given. Padrão i→a (give/gave, drive/drove)."
      - type: english_phrases
        question: Eles vieram
        correctAnswer: they came
        rationale: "Come → came; come (particípio). Infinitivo e particípio iguais — passado é 'came'."
      - type: english_phrases
        question: Ela encontrou
        correctAnswer: she found
        rationale: "Find → found; found. Passado e particípio iguais — padrão -ind → -ound (find, bind, wind)."
      - type: english_phrases
        question: Ele comprou
        correctAnswer: he bought
        rationale: "Buy → bought; bought. Padrão -gh mudo, soa 'bôt'. Mesmo som que 'thought', 'brought'."
      - type: english_phrases
        question: Nós escrevemos
        correctAnswer: we wrote
        rationale: "Write → wrote; written. Cuidado — particípio duplica o t ('written')."
      - type: english_phrases
        question: Eles beberam
        correctAnswer: they drank
        rationale: "Drank é passado simples. 'Drunk' é particípio OU adjetivo (bêbado)."
      - type: english_phrases
        question: Ela dormiu
        correctAnswer: she slept
        rationale: "Slept — mesmo padrão em todos os sujeitos. Pronúncia 'slépt' (vogal curta)."
target: 20
