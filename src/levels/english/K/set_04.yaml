title: English K - Reported Commands & Requests
level: K
subject: english
difficulty: 4
objectives:
  - B2.grammar.reported_commands
authorNotes: Use tell/ask + object + (not) to + verb. Suggest/advise/warn + verb-ing or that clause.
repeatAll: 2
example: "'Feche a porta!' → She told me to close the door"
pages:
  - pageNumber: 1
    title: Tell / Ask + Object + to
    description: Direct orders and requests in reported form.
    exercises:
      - type: english_phrases
        question: "'Feche a porta' — Ela me disse..."
        correctAnswer: she told me to close the door
        rationale: "'Tell + me + to + base'. Imperativo → 'to close the door'."
      - type: english_phrases
        question: "'Espere aqui' — Ele me disse..."
        correctAnswer: he told me to wait there
        rationale: "'Tell me to wait'. 'Here' → 'there' no relato."
      - type: english_phrases
        question: "'Me ajude, por favor' — Ela me pediu..."
        correctAnswer: she asked me to help her
        rationale: "'Ask + me + to' para pedido. 'Me' original → 'her' (ela no relato)."
      - type: english_phrases
        question: "'Não fale' — Ele me disse..."
        correctAnswer: he told me not to speak
        rationale: "Negativa: 'not to' antes da base. 'Not to speak'."
      - type: english_phrases
        question: "'Sente-se' — O professor me disse..."
        correctAnswer: the teacher told me to sit down
        rationale: "'Sit down' phrasal. 'The teacher told me to + base'."
      - type: english_phrases
        question: "'Não toque nisso' — Ele me disse..."
        correctAnswer: he told me not to touch that
        rationale: "'Not to touch that' (negativa). 'This' → 'that'."
      - type: english_phrases
        question: "'Me ligue depois' — Ela me pediu..."
        correctAnswer: she asked me to call her later
        rationale: "'Ask me to call her' — 'me' (original) → 'her' (referência)."
      - type: english_phrases
        question: "'Venha comigo' — Ele me disse..."
        correctAnswer: he told me to come with him
        rationale: "'Come with me' → 'with him' (perspectiva do relator)."
      - type: english_phrases
        question: "'Não se atrase' — Ela me pediu..."
        correctAnswer: she asked me not to be late
        rationale: "'Ask + me + not to be late'. 'Be late' = estar atrasado."
      - type: english_phrases
        question: "'Pague a conta' — Ele me disse..."
        correctAnswer: he told me to pay the bill
        rationale: "'Pay the bill' = pagar conta. 'Tell me to + base'."
  - pageNumber: 2
    title: Suggest / Advise / Warn
    description: Verbs with different complement patterns.
    exercises:
      - type: english_phrases
        question: "'Vamos sair' — Ele sugeriu..."
        correctAnswer: he suggested going out
        rationale: "'Suggest' + gerúndio (going out), não infinitivo."
      - type: english_phrases
        question: "'Você deveria estudar mais' — Ela me aconselhou..."
        correctAnswer: she advised me to study more
        rationale: "'Advise + me + to + base'. 'Study more' = estudar mais."
      - type: english_phrases
        question: "'Cuidado com o degrau' — Ele me avisou..."
        correctAnswer: he warned me about the step
        rationale: "'Warn + me + about' (= sobre algo). 'The step' específico."
      - type: english_phrases
        question: "'Não faça isso' — Ele me avisou..."
        correctAnswer: he warned me not to do that
        rationale: "'Warn + me + not to'. 'This' → 'that'."
      - type: english_phrases
        question: "'Vamos almoçar juntos' — Ela sugeriu..."
        correctAnswer: she suggested having lunch together
        rationale: "'Suggest + gerúndio': 'having lunch'. Nunca 'to have'."
      - type: english_phrases
        question: "'Desculpe pelo atraso' — Ele se desculpou..."
        correctAnswer: he apologized for being late
        rationale: "'Apologize for + gerúndio'. 'For being late' (gerúndio de be)."
      - type: english_phrases
        question: "'Obrigado pela ajuda' — Ela me agradeceu..."
        correctAnswer: she thanked me for helping
        rationale: "'Thank + objeto + for + gerúndio'. 'For helping'."
      - type: english_phrases
        question: "'Vou pagar a conta' — Ele prometeu..."
        correctAnswer: he promised to pay the bill
        rationale: "'Promise + to + base'. 'To pay the bill'."
      - type: english_phrases
        question: "'Eu quebrei o vaso' — Ela admitiu..."
        correctAnswer: she admitted breaking the vase
        rationale: "'Admit + gerúndio': 'admitted breaking'. Não 'to break'."
      - type: english_phrases
        question: "'Eu não fiz isso' — Ele negou..."
        correctAnswer: he denied doing it
        rationale: "'Deny + gerúndio': 'denied doing it'. Nunca 'to do'."
target: 20
