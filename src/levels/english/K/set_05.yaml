title: English K - Reporting Verbs
level: K
subject: english
difficulty: 5
objectives:
  - B2.grammar.reporting_verbs
authorNotes: Common reporting verbs — claim, insist, deny, admit, suggest, promise, refuse, threaten, agree, decide. Each has its own complement pattern.
repeatAll: 2
example: Ele admitiu ter cometido um erro → He admitted making a mistake
pages:
  - pageNumber: 1
    title: Claim, Insist, Deny, Admit
    description: Reporting verbs with that-clauses or -ing.
    exercises:
      - type: english_phrases
        question: Ele afirmou ser inocente
        correctAnswer: he claimed to be innocent
        rationale: "'Claim + to + base': 'claimed to be innocent'."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ela insistiu em pagar
        correctAnswer: she insisted on paying
        rationale: "'Insist on + gerúndio': 'insisted on paying'. Não 'to pay'."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Eles negaram envolvimento
        correctAnswer: they denied any involvement
        rationale: "'Deny + substantivo/gerúndio'. 'Any involvement' = qualquer envolvimento."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ele admitiu ter mentido
        correctAnswer: he admitted lying
        rationale: "'Admit + gerúndio': 'admitted lying'. Não 'to lie'."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ela alegou que estava ocupada
        correctAnswer: she claimed she was busy
        rationale: "'Claim + that-clause'. 'Was busy' (backshift de 'is busy')."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ele insistiu em ter razão
        correctAnswer: he insisted on being right
        rationale: "'Insist on + gerúndio'. 'Being right' = ter razão (gerúndio de be)."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Eles negaram saber da verdade
        correctAnswer: they denied knowing the truth
        rationale: "'Deny + gerúndio': 'denied knowing'. 'The truth' específico."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ela admitiu que errou
        correctAnswer: she admitted that she was wrong
        rationale: "'Admit + that-clause'. 'Be wrong' = estar errado."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ele alegou inocência
        correctAnswer: he claimed innocence
        rationale: "'Claim + substantivo'. 'Innocence' abstrato, sem artigo."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ela insistiu em ajudar
        correctAnswer: she insisted on helping
        rationale: "'Insist on + gerúndio': 'insisted on helping'."
        difficulty: 4
        objectives: [B2.grammar.reporting_verbs]
  - pageNumber: 2
    title: Promise, Refuse, Agree, Decide, Threaten
    description: Verbs typically followed by 'to + verb'.
    exercises:
      - type: english_phrases
        question: Ele prometeu ligar
        correctAnswer: he promised to call
        rationale: "'Promise + to + base': 'promised to call'."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ela se recusou a responder
        correctAnswer: she refused to answer
        rationale: "'Refuse + to + base': 'refused to answer'."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Nós concordamos em ficar
        correctAnswer: we agreed to stay
        rationale: "'Agree + to + base': 'agreed to stay'."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ele decidiu partir
        correctAnswer: he decided to leave
        rationale: "'Decide + to + base': 'decided to leave' (= partir)."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ela ameaçou sair
        correctAnswer: she threatened to leave
        rationale: "'Threaten + to + base': 'threatened to leave'."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Eles concordaram em ajudar
        correctAnswer: they agreed to help
        rationale: "'Agree + to + base': 'agreed to help'."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ele prometeu não contar
        correctAnswer: he promised not to tell
        rationale: "Negativa: 'promise + not to + base'. 'Not to tell'."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ela recusou-se a aceitar
        correctAnswer: she refused to accept
        rationale: "'Refuse + to + base': 'refused to accept'."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Decidimos esperar
        correctAnswer: we decided to wait
        rationale: "'Decide + to + base': 'decided to wait'."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
      - type: english_phrases
        question: Ele ameaçou denunciar
        correctAnswer: he threatened to report
        rationale: "'Threaten + to + base': 'threatened to report'."
        difficulty: 5
        objectives: [B2.grammar.reporting_verbs]
target: 20
