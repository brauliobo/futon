title: ✏️ English K - Register Shift
level: K
subject: english
difficulty: 5
objectives:
  - C1.grammar.register_shift
authorNotes: Register shift means adapting language from formal to informal or vice versa. C1 learners must recognize bureaucratic/academic language and know how to render the same idea naturally in another register.
repeatAll: 2
example: "Ex.: 'Precisamos de conversar sobre isso' → We need to discuss this matter (formal) / We should talk about this (informal)."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Informal to Formal
    description: Translate the informal Portuguese into formal written English.
    exercises:
      - type: english_phrases
        question: Quero saber mais sobre o emprego.
        correctAnswer: I would like to enquire about the position
        rationale: "'Would like to enquire' = formal para 'quero saber'; 'position' = mais formal que 'job'."
        difficulty: 2
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Pode me dizer quando a reunião é?
        correctAnswer: Could you please advise me as to when the meeting is scheduled?
        rationale: "'Could you please advise' + 'as to when' + 'scheduled' = registro formal escrito."
        difficulty: 2
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Obrigado pela sua ajuda.
        correctAnswer: I am most grateful for your assistance
        rationale: "'Most grateful' intensifica formalmente; 'assistance' = mais formal que 'help'."
        difficulty: 2
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Vou pensar e te digo qualquer coisa.
        correctAnswer: I will give the matter due consideration and revert to you in due course
        rationale: "'Due consideration' + 'revert to you in due course' = linguagem burocrática formal."
        difficulty: 3
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Não consegui resolver o problema sozinho.
        correctAnswer: I was unable to resolve the issue independently
        rationale: "'Unable to resolve the issue' = negação formal; 'independently' = sozinho (formal)."
        difficulty: 3
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Eles não responderam ao nosso email.
        correctAnswer: No response has been received to our correspondence
        rationale: "Passiva impessoal 'No response has been received' eleva o registo ao formal oficial."
        difficulty: 3
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Precisamos de fazer mudanças no plano.
        correctAnswer: It will be necessary to make amendments to the plan
        rationale: "'It will be necessary to' + 'amendments' = duas marcas de formalização."
        difficulty: 3
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Algo correu mal com o pedido.
        correctAnswer: An irregularity appears to have occurred with the request
        rationale: "'Irregularity' + 'appears to have occurred' = eufemismo burocrático para erro."
        difficulty: 3
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Quando posso começar a trabalhar?
        correctAnswer: Could you indicate the proposed commencement date?
        rationale: "'Commencement date' = data de início (formal); 'proposed' = prevista."
        difficulty: 3
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Desculpe o atraso na resposta.
        correctAnswer: Please accept my apologies for the delay in responding
        rationale: "'Please accept my apologies for' = fórmula formal; mais cerimonioso que 'I am sorry'."
        difficulty: 4
        objectives: [C1.grammar.register_shift]
  - pageNumber: 2
    title: Formal to Informal
    description: Render formal English into natural informal Portuguese→English.
    exercises:
      - type: english_phrases
        question: Foi comunicado que a reunião ficou para a semana que vem.
        correctAnswer: They have let us know that the meeting has been pushed back to next week
        rationale: "'Let us know' = informal para 'foi comunicado'; 'pushed back' = adiado (coloquial)."
        difficulty: 3
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: A utilização do presente sistema não é aconselhável.
        correctAnswer: It is not a good idea to use the current system
        rationale: "'Not a good idea to use' = informal para 'utilização não é aconselhável'."
        difficulty: 3
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Subsistem dúvidas relativamente à viabilidade do projeto.
        correctAnswer: There are still questions about whether the project will work
        rationale: "'Still questions about whether it will work' = simplificação informal do burocratês."
        difficulty: 4
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: A sua candidatura foi objeto de análise aprofundada.
        correctAnswer: We have looked carefully at your application
        rationale: "'We have looked carefully at' = ativo informal; contrastado com 'foi objeto de análise'."
        difficulty: 4
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Procedeu-se à retificação dos dados mencionados.
        correctAnswer: The data mentioned has been corrected
        rationale: "'Has been corrected' = passiva simples; mais direta que 'procedeu-se à retificação'."
        difficulty: 5
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Solicita-se que os participantes se abstenham de utilizar dispositivos eletrónicos.
        correctAnswer: Please refrain from using electronic devices
        rationale: "'Please refrain from' = diretivo ameno; elimina a voz passiva burocrática."
        difficulty: 4
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Em virtude do exposto, recomenda-se uma revisão do processo.
        correctAnswer: In light of the above, a review of the process is recommended
        rationale: "'In light of the above' substitui 'em virtude do exposto'; mantém registo semi-formal."
        difficulty: 5
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: A empresa não detém quaisquer responsabilidades pelos danos decorrentes.
        correctAnswer: The company is not liable for any resulting damages
        rationale: "'Not liable for any resulting damages' = legalmente equivalente mas mais direto."
        difficulty: 5
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: Deu-se início às diligências necessárias para apurar os factos.
        correctAnswer: Steps have been taken to establish the facts
        rationale: "'Steps have been taken to establish' = passiva simples; remove o burocratês."
        difficulty: 5
        objectives: [C1.grammar.register_shift]
      - type: english_phrases
        question: No que concerne à questão supra mencionada, importa salientar que...
        correctAnswer: Regarding the above-mentioned issue, it is worth noting that...
        rationale: "'Regarding' + 'it is worth noting' = registo académico semi-formal, mais natural."
        difficulty: 5
        objectives: [C1.grammar.register_shift]
target: 20
