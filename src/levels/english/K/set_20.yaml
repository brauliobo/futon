title: ✏️ English K - Mixed Review Level K
level: K
subject: english
difficulty: 5
objectives:
  - C1.grammar.mixed_review_K
authorNotes: Final review of all Level K topics — fronting, hedging, nominalization, concession, approximation, law/politics, economics, register, relative clauses, impersonal passive, cause-effect, essay phrases.
repeatAll: 2
example: "Ex.: 'Raramente vemos tal comprometimento' → Rarely do we see such commitment."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: K Review — Part 1
    description: One exercise from each K topic (sets 08–13).
    exercises:
      - type: english_phrases
        question: Nunca tinha visto uma tal falta de organização.
        correctAnswer: Never had I seen such a lack of organization
        rationale: "Fronting (set 08): 'Never' + inversão com past perfect: 'had I seen'."
        difficulty: 3
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Ao que parece, a proposta pode não ser viável.
        correctAnswer: It would appear that the proposal may not be feasible
        rationale: "Hedging (set 09): 'It would appear that' + 'may not be feasible' = duplo hedge."
        difficulty: 3
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: A implementação desta política requer recursos substanciais.
        correctAnswer: The implementation of this policy requires substantial resources
        rationale: "Nominalization (set 10): 'Implementar' → 'implementation of'; 'substantial' = substanciais."
        difficulty: 3
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Seja como for, a decisão já foi anunciada.
        correctAnswer: Be that as it may, the decision has already been announced
        rationale: "Concession (set 11): 'Be that as it may' = seja como for; fórmula fixa C1."
        difficulty: 3
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: O evento atraiu na região de três mil visitantes.
        correctAnswer: The event attracted in the region of three thousand visitors
        rationale: "Approximation (set 12): 'In the region of' = na região de; estimativa de grande escala."
        difficulty: 2
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: O tribunal declarou-se incompetente para julgar o caso.
        correctAnswer: The court ruled that it lacked jurisdiction to hear the case
        rationale: "Law & Politics (set 13): 'Ruled that it lacked jurisdiction to hear' = colocação jurídica."
        difficulty: 4
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: O banco central reduziu as taxas para estimular o crescimento.
        correctAnswer: The central bank cut rates to stimulate growth
        rationale: "Economics (set 14): 'Cut rates to stimulate growth' = colocação padrão de política monetária."
        difficulty: 3
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Gostaria de obter mais informações sobre a vaga disponível.
        correctAnswer: I would like to enquire further about the available vacancy
        rationale: "Register Shift (set 15): 'Would like to enquire further' = registo formal de carta/email."
        difficulty: 3
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: A decisão, a qual foi tomada sem consulta, gerou controvérsia.
        correctAnswer: The decision, which was taken without consultation, sparked controversy
        rationale: "Relative Clauses (set 16): não-restritiva com vírgulas; 'sparked controversy' = gerou."
        difficulty: 4
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Afirma-se que o acordo foi alcançado em segredo.
        correctAnswer: It is alleged that the agreement was reached in secret
        rationale: "Impersonal Passive (set 17): 'It is alleged that' = afirma-se/alega-se; jornalístico."
        difficulty: 3
        objectives: [C1.grammar.mixed_review_K]
  - pageNumber: 2
    title: K Review — Part 2
    description: Integrated C1 structures from sets 14–19.
    exercises:
      - type: english_phrases
        question: A instabilidade política deu origem a uma fuga de investimento estrangeiro.
        correctAnswer: Political instability gave rise to a flight of foreign investment
        rationale: "Cause & Effect (set 18): 'Gave rise to a flight of' = deu origem a; 'foreign investment'."
        difficulty: 4
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Em conclusão, esta análise demonstrou que reformas são urgentes.
        correctAnswer: In conclusion, this analysis has demonstrated that reforms are urgently needed
        rationale: "Essay Phrases (set 19): 'In conclusion...has demonstrated that...urgently needed'."
        difficulty: 4
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Não só os custos aumentaram, como a qualidade diminuiu.
        correctAnswer: Not only have costs increased, but the quality has also declined
        rationale: "Fronting + Economics: 'Not only have' + inversão; 'declined' = mais formal que 'gone down'."
        difficulty: 5
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Pode-se argumentar que o problema decorre de décadas de subinvestimento.
        correctAnswer: It could be argued that the problem stems from decades of underinvestment
        rationale: "Hedging + Cause-effect: 'It could be argued' + 'stems from decades of underinvestment'."
        difficulty: 5
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: A deterioração das relações diplomáticas levou a sanções económicas.
        correctAnswer: The deterioration of diplomatic relations led to economic sanctions
        rationale: "Nominalization + Cause-effect: 'deterioration of' + 'led to economic sanctions'."
        difficulty: 4
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Embora o plano tenha mérito, as suas implicações a longo prazo são incertas.
        correctAnswer: For all its merits, the plan's long-term implications remain uncertain
        rationale: "Concession + Nominalization: 'For all its merits' + 'long-term implications remain uncertain'."
        difficulty: 5
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: O relatório, cujas conclusões foram contestadas, foi retirado de circulação.
        correctAnswer: The report, whose conclusions were disputed, was withdrawn from circulation
        rationale: "Relative Clause: 'whose conclusions were disputed' = cujas conclusões; 'withdrawn from circulation'."
        difficulty: 5
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Estima-se que cerca de metade da população urbana vive em condições precárias.
        correctAnswer: It is estimated that roughly half of the urban population lives in precarious conditions
        rationale: "Impersonal Passive + Approximation: 'It is estimated that roughly half' = dupla estrutura C1."
        difficulty: 5
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Em termos de legislação ambiental, progressos consideráveis foram alcançados.
        correctAnswer: In terms of environmental legislation, considerable progress has been made
        rationale: "Essay + Law: 'In terms of' + 'considerable progress has been made' = passiva académica."
        difficulty: 4
        objectives: [C1.grammar.mixed_review_K]
      - type: english_phrases
        question: Solicita-se que todos os candidatos apresentem os documentos necessários até sexta-feira.
        correctAnswer: All candidates are kindly requested to submit the required documents by Friday
        rationale: "Register (formal): 'are kindly requested to submit' = passiva formal cortês. 'By Friday' = prazo."
        difficulty: 4
        objectives: [C1.grammar.mixed_review_K]
target: 20
