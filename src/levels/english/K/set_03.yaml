title: English K - Reported Questions
level: K
subject: english
difficulty: 5
objectives: [B2.grammar.reported_questions]
authorNotes: Affirmative order in the reported clause. Yes/no questions use 'if/whether'; wh-questions keep the wh-word.
repeatAll: 2
example: "'Você está bem?' → She asked if I was okay"
pages:
  - pageNumber: 1
    title: Yes/No Questions → If / Whether
    description: Subject-verb order switches to statement order.
    exercises:
      - { type: english_phrases, question: "'Você está bem?' — Ela perguntou...", correctAnswer: she asked if i was okay }
      - { type: english_phrases, question: "'Ele estuda aqui?' — Ela perguntou...", correctAnswer: she asked if he studied there }
      - { type: english_phrases, question: "'Vocês comeram?' — Ele perguntou...", correctAnswer: he asked if we had eaten }
      - { type: english_phrases, question: "'Você sabe nadar?' — Ela perguntou...", correctAnswer: she asked if i could swim }
      - { type: english_phrases, question: "'Eles chegaram?' — Ele perguntou...", correctAnswer: he asked if they had arrived }
      - { type: english_phrases, question: "'Você vai amanhã?' — Ela perguntou...", correctAnswer: she asked if i would go the next day }
      - { type: english_phrases, question: "'Está chovendo?' — Ele perguntou...", correctAnswer: he asked if it was raining }
      - { type: english_phrases, question: "'Você me ouviu?' — Ela perguntou...", correctAnswer: she asked if i had heard her }
      - { type: english_phrases, question: "'Vocês aceitam isso?' — Ele perguntou...", correctAnswer: he asked whether we accepted that }
      - { type: english_phrases, question: "'Ela está em casa?' — Ele perguntou...", correctAnswer: he asked if she was at home }
  - pageNumber: 2
    title: Wh- Questions
    description: Keep the wh-word; use statement order.
    exercises:
      - { type: english_phrases, question: "'O que você quer?' — Ela perguntou...", correctAnswer: she asked what i wanted }
      - { type: english_phrases, question: "'Onde ele mora?' — Ela perguntou...", correctAnswer: she asked where he lived }
      - { type: english_phrases, question: "'Quando você chegou?' — Ele perguntou...", correctAnswer: he asked when i had arrived }
      - { type: english_phrases, question: "'Por que eles saíram?' — Ela perguntou...", correctAnswer: she asked why they had left }
      - { type: english_phrases, question: "'Quem ligou?' — Ele perguntou...", correctAnswer: he asked who had called }
      - { type: english_phrases, question: "'Como você aprendeu?' — Ela perguntou...", correctAnswer: she asked how i had learned }
      - { type: english_phrases, question: "'O que significa isso?' — Ele perguntou...", correctAnswer: he asked what that meant }
      - { type: english_phrases, question: "'Quanto custou?' — Ela perguntou...", correctAnswer: she asked how much it had cost }
      - { type: english_phrases, question: "'Onde estão as chaves?' — Ele perguntou...", correctAnswer: he asked where the keys were }
      - { type: english_phrases, question: "'Que horas são?' — Ela perguntou...", correctAnswer: she asked what time it was }
target: 20
