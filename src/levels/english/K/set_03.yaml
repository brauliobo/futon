title: English K - Reported Questions
level: K
subject: english
difficulty: 5
objectives:
  - B2.grammar.reported_questions
authorNotes: Affirmative order in the reported clause. Yes/no questions use 'if/whether'; wh-questions keep the wh-word.
repeatAll: 2
example: "'Você está bem?' → She asked if I was okay"
pages:
  - pageNumber: 1
    title: Yes/No Questions → If / Whether
    description: Subject-verb order switches to statement order.
    exercises:
      - type: english_phrases
        question: "'Você está bem?' — Ela perguntou..."
        correctAnswer: she asked if i was okay
        rationale: "'He asked me if I was ready'."
      - type: english_phrases
        question: "'Ele estuda aqui?' — Ela perguntou..."
        correctAnswer: she asked if he studied there
        rationale: "Sem ponto de interrogação no relato."
      - type: english_phrases
        question: "'Vocês comeram?' — Ele perguntou..."
        correctAnswer: he asked if we had eaten
        rationale: "Verbos: ask, wonder, want to know."
      - type: english_phrases
        question: "'Você sabe nadar?' — Ela perguntou..."
        correctAnswer: she asked if i could swim
        rationale: "Backshift normal: present → past."
      - type: english_phrases
        question: "'Eles chegaram?' — Ele perguntou..."
        correctAnswer: he asked if they had arrived
        rationale: "Sem ponto de interrogação no relato."
      - type: english_phrases
        question: "'Você vai amanhã?' — Ela perguntou..."
        correctAnswer: she asked if i would go the next day
        rationale: "Pronomes e tempos ajustam."
      - type: english_phrases
        question: "'Está chovendo?' — Ele perguntou..."
        correctAnswer: he asked if it was raining
        rationale: "'He asked me if I was ready'."
      - type: english_phrases
        question: "'Você me ouviu?' — Ela perguntou..."
        correctAnswer: she asked if i had heard her
        rationale: "Use ordem afirmativa: sujeito + verbo."
      - type: english_phrases
        question: "'Vocês aceitam isso?' — Ele perguntou..."
        correctAnswer: he asked whether we accepted that
        rationale: "'He asked where I was going', não 'where was I going'."
      - type: english_phrases
        question: "'Ela está em casa?' — Ele perguntou..."
        correctAnswer: he asked if she was at home
        rationale: "Sem ponto de interrogação no relato."
  - pageNumber: 2
    title: Wh- Questions
    description: Keep the wh-word; use statement order.
    exercises:
      - type: english_phrases
        question: "'O que você quer?' — Ela perguntou..."
        correctAnswer: she asked what i wanted
        rationale: "Wh-question: mantenha a wh-word; ordem afirmativa."
      - type: english_phrases
        question: "'Onde ele mora?' — Ela perguntou..."
        correctAnswer: she asked where he lived
        rationale: "'He asked me if I was ready'."
      - type: english_phrases
        question: "'Quando você chegou?' — Ele perguntou..."
        correctAnswer: he asked when i had arrived
        rationale: "Verbos: ask, wonder, want to know."
      - type: english_phrases
        question: "'Por que eles saíram?' — Ela perguntou..."
        correctAnswer: she asked why they had left
        rationale: "'He asked me if I was ready'."
      - type: english_phrases
        question: "'Quem ligou?' — Ele perguntou..."
        correctAnswer: he asked who had called
        rationale: "Sem 'do/does/did' no relato."
      - type: english_phrases
        question: "'Como você aprendeu?' — Ela perguntou..."
        correctAnswer: she asked how i had learned
        rationale: "Pronomes e tempos ajustam."
      - type: english_phrases
        question: "'O que significa isso?' — Ele perguntou..."
        correctAnswer: he asked what that meant
        rationale: "Wh-question: mantenha a wh-word; ordem afirmativa."
      - type: english_phrases
        question: "'Quanto custou?' — Ela perguntou..."
        correctAnswer: she asked how much it had cost
        rationale: "Pronomes e tempos ajustam."
      - type: english_phrases
        question: "'Onde estão as chaves?' — Ele perguntou..."
        correctAnswer: he asked where the keys were
        rationale: "'He asked me if I was ready'."
      - type: english_phrases
        question: "'Que horas são?' — Ela perguntou..."
        correctAnswer: she asked what time it was
        rationale: "Sem ponto de interrogação no relato."
target: 20
