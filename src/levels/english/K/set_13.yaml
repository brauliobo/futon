title: ✏️ English K - Formal Vocabulary — Law & Politics
level: K
subject: english
difficulty: 5
objectives:
  - C1.vocabulary.law_politics
authorNotes: C1 learners need precise legal and political vocabulary. Focus on false friends (jurisdiction ≠ jurisdição exact), collocations (exercise jurisdiction, legislative body) and register (litigation vs lawsuit).
repeatAll: 2
example: "Ex.: 'O parlamento aprovou a lei' → The legislature passed the bill."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Core Legal & Political Terms
    description: Translate using precise legal and political vocabulary.
    exercises:
      - type: english_phrases
        question: O parlamento tem poder para criar novas leis.
        correctAnswer: The legislature has the power to enact new laws
        rationale: "'Legislature' = poder legislativo (instituição); 'enact laws' = promulgar leis (colocação técnica)."
        difficulty: 2
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: O tribunal tem jurisdição sobre os crimes federais.
        correctAnswer: The court has jurisdiction over federal crimes
        rationale: "'Jurisdiction over' = jurisdição sobre; 'have jurisdiction' é a colocação standard."
        difficulty: 2
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: A soberania nacional não pode ser cedida unilateralmente.
        correctAnswer: National sovereignty cannot be surrendered unilaterally
        rationale: "'Sovereignty' = soberania; 'surrendered' em contexto político = cedida/abdicada."
        difficulty: 2
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: O processo judicial pode durar vários anos.
        correctAnswer: The litigation may last several years
        rationale: "'Litigation' = litígio/processo judicial (mais formal que 'lawsuit'); 'may' para possibilidade."
        difficulty: 3
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: O réu foi absolvido por falta de provas.
        correctAnswer: The defendant was acquitted due to insufficient evidence
        rationale: "'Defendant' = réu; 'acquitted' = absolvido (jurídico); 'insufficient evidence' = provas insuficientes."
        difficulty: 3
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: A constituição protege os direitos fundamentais dos cidadãos.
        correctAnswer: The constitution safeguards the fundamental rights of citizens
        rationale: "'Safeguards' = protege/salvaguarda; verbo mais forte e formal que 'protects' neste contexto."
        difficulty: 2
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: O governo propôs uma emenda à legislação existente.
        correctAnswer: The government proposed an amendment to the existing legislation
        rationale: "'Amendment' = emenda; 'existing legislation' = legislação em vigor (colocação formal)."
        difficulty: 3
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: O estado de direito deve ser respeitado por todos.
        correctAnswer: The rule of law must be respected by all
        rationale: "'Rule of law' = estado de direito; expressão fixa fundamental no discurso político."
        difficulty: 2
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: A câmara baixa votou contra a proposta.
        correctAnswer: The lower house voted against the bill
        rationale: "'Lower house' = câmara baixa (ex: House of Commons/Representatives); 'bill' = projeto de lei."
        difficulty: 3
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: Ele foi acusado de tráfico de influências.
        correctAnswer: He was charged with influence peddling
        rationale: "'Charged with' = acusado de (crime); 'influence peddling' = tráfico de influências."
        difficulty: 3
        objectives: [C1.vocabulary.law_politics]
  - pageNumber: 2
    title: Advanced Legal & Political Usage
    description: Complex sentences combining legal vocabulary.
    exercises:
      - type: english_phrases
        question: O tratado foi ratificado pelo senado após longos debates.
        correctAnswer: The treaty was ratified by the senate following lengthy deliberations
        rationale: "'Ratified' = ratificado; 'deliberations' mais formal que 'debates' em contexto legislativo."
        difficulty: 4
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: O tribunal superior derrubou a decisão anterior.
        correctAnswer: The supreme court overturned the previous ruling
        rationale: "'Overturned' = derrubou/reverteu (decisão); 'ruling' = decisão judicial (mais preciso que 'decision')."
        difficulty: 4
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: A lei foi promulgada sem debate parlamentar adequado.
        correctAnswer: The law was enacted without adequate parliamentary debate
        rationale: "'Enacted' = promulgada; 'parliamentary debate' = debate parlamentar; 'adequate' = adequado."
        difficulty: 4
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: A extradição foi recusada com base em razões humanitárias.
        correctAnswer: Extradition was refused on humanitarian grounds
        rationale: "'Extradition refused on grounds' = colocação jurídica; 'grounds' = razões/fundamentos."
        difficulty: 4
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: O poder executivo não pode interferir no poder judicial.
        correctAnswer: The executive branch cannot interfere with the judiciary
        rationale: "'Executive branch' = poder executivo; 'judiciary' = poder judicial (substantivo coletivo)."
        difficulty: 5
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: As sanções foram levantadas após o cumprimento dos acordos.
        correctAnswer: The sanctions were lifted following compliance with the agreements
        rationale: "'Lifted' = levantadas (sanções); 'compliance with' = cumprimento de (termo jurídico-diplomático)."
        difficulty: 5
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: O partido de oposição apresentou um voto de censura.
        correctAnswer: The opposition party tabled a vote of no confidence
        rationale: "'Tabled' (UK) = apresentou formalmente; 'vote of no confidence' = voto de censura."
        difficulty: 5
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: O precedente legal estabelecido neste caso será vinculativo.
        correctAnswer: The legal precedent established in this case will be binding
        rationale: "'Legal precedent' = precedente legal; 'binding' = vinculativo (obrigação jurídica)."
        difficulty: 5
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: As negociações diplomáticas estão num impasse.
        correctAnswer: The diplomatic negotiations are at an impasse
        rationale: "'At an impasse' = num impasse; 'diplomatic negotiations' = colocação padrão."
        difficulty: 4
        objectives: [C1.vocabulary.law_politics]
      - type: english_phrases
        question: A impunidade corrói a confiança nas instituições.
        correctAnswer: Impunity erodes trust in institutions
        rationale: "'Impunity' = impunidade; 'erodes' = corrói (metáfora formal de desgaste gradual)."
        difficulty: 4
        objectives: [C1.vocabulary.law_politics]
target: 20
