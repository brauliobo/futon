title: English K - No Backshift Cases
level: K
subject: english
difficulty: 4
objectives:
  - B2.grammar.reported_speech
authorNotes: When the reporting verb is present ('says'), when the fact remains true, or when using past perfect / modals (must, should, would, could, might), no backshift is needed.
repeatAll: 2
example: She says she loves music — stays present.
pages:
  - pageNumber: 1
    title: Reporting Verb in Present
    description: No tense shift when report happens in the present.
    exercises:
      - type: english_phrases
        question: "'Eu adoro música' — Ela diz que..."
        correctAnswer: she says she loves music
        rationale: "'Says' (presente) → sem backshift. 'Loves' mantém presente."
      - type: english_phrases
        question: "'Eu moro em Londres' — Ele diz que..."
        correctAnswer: he says he lives in london
        rationale: "'Says' (presente) → 'lives' mantido. Sem recuo."
      - type: english_phrases
        question: "'Eu trabalho muito' — Ela diz que..."
        correctAnswer: she says she works a lot
        rationale: "'Says' + 'works' (presente mantido). 'A lot' = muito."
      - type: english_phrases
        question: "'Vou viajar amanhã' — Ele diz que..."
        correctAnswer: he says he will travel tomorrow
        rationale: "'Says' presente → 'will travel' mantido (sem 'would')."
      - type: english_phrases
        question: "'Estou com fome' — Ela diz que..."
        correctAnswer: she says she is hungry
        rationale: "'Says' → 'is hungry' mantém presente. Sem backshift."
      - type: english_phrases
        question: "'Posso ajudar' — Ele diz que..."
        correctAnswer: he says he can help
        rationale: "'Says' presente → 'can' mantido (sem virar 'could')."
      - type: english_phrases
        question: "'Ainda não terminei' — Ela diz que..."
        correctAnswer: she says she has not finished
        rationale: "'Says' → 'has not finished' mantido (present perfect)."
      - type: english_phrases
        question: "'Eu entendo' — Ele diz que..."
        correctAnswer: he says he understands
        rationale: "'Says' presente + 'understands' (3ª pessoa +s) mantido."
      - type: english_phrases
        question: "'Eu vou chegar em breve' — Ela diz que..."
        correctAnswer: she says she will arrive soon
        rationale: "'Says' → 'will arrive' mantido. 'Soon' ao final."
      - type: english_phrases
        question: "'Eu quero saber' — Ele diz que..."
        correctAnswer: he says he wants to know
        rationale: "'Says' → 'wants' (3ª pessoa +s) mantido. 'Want to + base'."
  - pageNumber: 2
    title: Unchanging Truths & Unshifted Modals
    description: General truths, must/should/might remain the same in past reports.
    exercises:
      - type: english_phrases
        question: "'A Terra gira em torno do Sol' — O professor disse que..."
        correctAnswer: the teacher said the earth rotates around the sun
        rationale: "Verdade universal → sem backshift. 'Rotates' mantido."
      - type: english_phrases
        question: "'Água ferve a 100°C' — Ele disse que..."
        correctAnswer: he said water boils at 100 degrees
        rationale: "Fato científico → 'boils' mantido. 'At 100 degrees' (com at)."
      - type: english_phrases
        question: "'O sol nasce no leste' — Ela disse que..."
        correctAnswer: she said the sun rises in the east
        rationale: "Verdade universal → 'rises' mantido. 'In the east' específico."
      - type: english_phrases
        question: "'Você deveria descansar' — Ele me disse que..."
        correctAnswer: he said i should rest
        rationale: "'Should' não tem forma passada → mantido. 'You' → 'I'."
      - type: english_phrases
        question: "'Talvez eu vá' — Ela disse que..."
        correctAnswer: she said she might go
        rationale: "'Might' não tem backshift (não existe 'mighted'). Mantido."
      - type: english_phrases
        question: "'Você deve obedecer' — Ele disse que..."
        correctAnswer: he said i must obey
        rationale: "'Must' não muda (backshift opcional para 'had to'). 'You' → 'I'."
      - type: english_phrases
        question: "'Eu poderia tentar' — Ela disse que..."
        correctAnswer: she said she could try
        rationale: "'Could' já é forma passada → mantido. 'I' → 'she'."
      - type: english_phrases
        question: "'Cães são leais' — Ele disse que..."
        correctAnswer: he said dogs are loyal
        rationale: "Verdade geral → 'are loyal' mantido. Sem backshift."
      - type: english_phrases
        question: "'Eu gostaria de ir' — Ela disse que..."
        correctAnswer: she said she would like to go
        rationale: "'Would' já é forma passada → mantido. 'I' → 'she'."
      - type: english_phrases
        question: "'Londres fica na Inglaterra' — Ele disse que..."
        correctAnswer: he said london is in england
        rationale: "Fato geográfico permanente → 'is' mantido. Sem backshift."
target: 20
