        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Posso ajudar' — Ele diz que..."
        correctAnswer: he says he can help
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Ainda não terminei' — Ela diz que..."
        correctAnswer: she says she has not finished
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu entendo' — Ele diz que..."
        correctAnswer: he says he understands
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu vou chegar em breve' — Ela diz que..."
        correctAnswer: she says she will arrive soon
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu quero saber' — Ele diz que..."
