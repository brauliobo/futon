title: English K - No Backshift Cases
level: K
subject: english
difficulty: 4
objectives:
  - B2.grammar.reported_speech
authorNotes: When the reporting verb is present ('says'), when the fact remains true, or when using past perfect / modals (must, should, would, could, might), no backshift is needed.
repeatAll: 2
example: She says she loves music — stays present.
pages:
  - pageNumber: 1
    title: Reporting Verb in Present
    description: No tense shift when report happens in the present.
    exercises:
      - type: english_phrases
        question: "'Eu adoro música' — Ela diz que..."
        correctAnswer: she says she loves music
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu moro em Londres' — Ele diz que..."
        correctAnswer: he says he lives in london
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu trabalho muito' — Ela diz que..."
        correctAnswer: she says she works a lot
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Vou viajar amanhã' — Ele diz que..."
        correctAnswer: he says he will travel tomorrow
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Estou com fome' — Ela diz que..."
