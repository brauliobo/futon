        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Unchanging Truths & Unshifted Modals
    description: General truths, must/should/might remain the same in past reports.
    exercises:
      - type: english_phrases
        question: "'A Terra gira em torno do Sol' — O professor disse que..."
        correctAnswer: the teacher said the earth rotates around the sun
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Água ferve a 100°C' — Ele disse que..."
        correctAnswer: he said water boils at 100 degrees
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'O sol nasce no leste' — Ela disse que..."
        correctAnswer: she said the sun rises in the east
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Você deveria descansar' — Ele me disse que..."
