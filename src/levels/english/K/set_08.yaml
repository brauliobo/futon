title: ✏️ English K - Fronting & Topicalization
level: K
subject: english
difficulty: 5
objectives:
  - C1.grammar.fronting_topicalization
authorNotes: Fronting moves a non-subject element to the front for emphasis. Negative/restrictive adverbials (rarely, not only, never) trigger inversion.
repeatAll: 2
example: "Ex.: 'O que me surpreende é a coragem dele' → What surprises me is his courage."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Fronting with Emphasis
    description: Move the highlighted element to the front of the sentence.
    exercises:
      - type: english_phrases
        question: O que acho mais fascinante é a complexidade da língua.
        correctAnswer: What I find most fascinating is the complexity of the language
        rationale: "'What I find...' = clivagem com wh-clause no início; 'is' liga ao predicativo."
        difficulty: 2
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: A razão pela qual ele partiu ainda é um mistério.
        correctAnswer: The reason why he left is still a mystery
        rationale: "Fronting da noun phrase 'the reason why' como sujeito topicalizado."
        difficulty: 2
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: A sua dedicação é o que o diferencia dos outros.
        correctAnswer: It is his dedication that sets him apart from the others
        rationale: "Estrutura clivada 'It is X that...' enfatiza 'his dedication'."
        difficulty: 3
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Raramente vemos tanta generosidade num só lugar.
        correctAnswer: Rarely do we see such generosity in one place
        rationale: "'Rarely' no início exige inversão sujeito-auxiliar: 'do we see'."
        difficulty: 3
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Somente depois da reunião é que percebemos o erro.
        correctAnswer: Only after the meeting did we realize the mistake
        rationale: "'Only after...' + inversão: 'did we realize'. Típica estrutura C1 de ênfase."
        difficulty: 3
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: O que me preocupa é a falta de comunicação.
        correctAnswer: What worries me is the lack of communication
        rationale: "Pseudo-clivada com 'what' como sujeito; predicativo = 'the lack of communication'."
        difficulty: 2
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Nunca antes havia visto uma paisagem tão linda.
        correctAnswer: Never before had I seen such a beautiful landscape
        rationale: "'Never before' + inversão com past perfect: 'had I seen'."
        difficulty: 3
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Foi nesse momento que ele tomou a decisão certa.
        correctAnswer: It was at that moment that he made the right decision
        rationale: "Clivada 'It was X that' posiciona o adjunto temporal no foco."
        difficulty: 3
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Isso, eu nunca aceitaria.
        correctAnswer: That, I would never accept
        rationale: "Topicalização do objeto direto 'that' antes do sujeito — ênfase contrastiva."
        difficulty: 2
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Não só ele chegou atrasado, como também esqueceu os documentos.
        correctAnswer: Not only did he arrive late, but he also forgot the documents
        rationale: "'Not only' + inversão: 'did he arrive'. Segunda oração: 'but he also...'"
        difficulty: 3
        objectives: [C1.grammar.fronting_topicalization]
  - pageNumber: 2
    title: Advanced Inversion & Cleft Sentences
    description: Complex fronting with negative adverbials and cleft structures.
    exercises:
      - type: english_phrases
        question: Em nenhum momento ela duvidou da sua capacidade.
        correctAnswer: At no point did she doubt her own ability
        rationale: "'At no point' + inversão: 'did she doubt'. 'Sua' → 'her own' para reflexividade."
        difficulty: 4
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Mal tínhamos saído quando começou a chover.
        correctAnswer: Hardly had we left when it started to rain
        rationale: "'Hardly' + past perfect invertido: 'had we left'. Correlativo 'when'."
        difficulty: 4
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Foi ele quem assinou o contrato.
        correctAnswer: It was he who signed the contract
        rationale: "Clivada formal: 'It was he who'. Pronome sujeito 'he' (não 'him') no registo formal."
        difficulty: 4
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Tão complexa era a situação que ninguém sabia o que fazer.
        correctAnswer: So complex was the situation that no one knew what to do
        rationale: "'So + adj' no início + inversão: 'was the situation'. Estrutura literária/formal."
        difficulty: 5
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Não é apenas o preço que importa, mas também a qualidade.
        correctAnswer: It is not just the price that matters, but also the quality
        rationale: "Clivada negativa 'It is not just X that' + 'but also' para contrabalançar."
        difficulty: 4
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Só quando vi os resultados é que acreditei.
        correctAnswer: Only when I saw the results did I believe it
        rationale: "'Only when' + inversão na oração principal: 'did I believe it'."
        difficulty: 5
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Essa proposta, o comitê rejeitou imediatamente.
        correctAnswer: This proposal, the committee rejected immediately
        rationale: "Topicalização do objeto: 'This proposal' deslocado para o início sem inversão."
        difficulty: 4
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Em nenhuma outra cidade a diversidade cultural é tão visível.
        correctAnswer: In no other city is cultural diversity so visible
        rationale: "'In no other city' + inversão: 'is cultural diversity'. Advérbio negativo."
        difficulty: 5
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: Não tinha sido ele que prometeu ajuda?
        correctAnswer: Had it not been him who promised help?
        rationale: "Inversão interrogativa com 'had' + negação: 'Had it not been him who...'?"
        difficulty: 5
        objectives: [C1.grammar.fronting_topicalization]
      - type: english_phrases
        question: O que eles precisam não é de dinheiro, mas de orientação.
        correctAnswer: What they need is not money but guidance
        rationale: "Pseudo-clivada 'What they need is...' + contraste 'not X but Y'."
        difficulty: 4
        objectives: [C1.grammar.fronting_topicalization]
target: 20
