title: ✏️ English K - Formal Vocabulary — Economics
level: K
subject: english
difficulty: 5
objectives:
  - C1.vocabulary.economics
authorNotes: Economic vocabulary at C1 requires knowing collocations (fiscal policy, monetary tightening, trade deficit) and the difference between near-synonyms (revenue vs income, deficit vs debt).
repeatAll: 2
example: "Ex.: 'O banco central aumentou as taxas de juro' → The central bank raised interest rates."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Core Economic Terms
    description: Translate using precise economic vocabulary and collocations.
    exercises:
      - type: english_phrases
        question: O governo adotou uma política fiscal mais restritiva.
        correctAnswer: The government adopted a tighter fiscal policy
        rationale: "'Fiscal policy' = política fiscal; 'tighter' = mais restritiva/contracionista em economia."
        difficulty: 2
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: A inflação atingiu o nível mais alto em vinte anos.
        correctAnswer: Inflation reached its highest level in twenty years
        rationale: "'Inflation reached' = colocação padrão; 'its highest level' com possessivo."
        difficulty: 2
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: O défice orçamental aumentou devido às despesas com a pandemia.
        correctAnswer: The budget deficit increased due to pandemic spending
        rationale: "'Budget deficit' = défice orçamental; 'spending' incontável para despesas públicas."
        difficulty: 2
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: O PIB cresceu dois por cento no último trimestre.
        correctAnswer: GDP grew by two per cent in the last quarter
        rationale: "'GDP' = Gross Domestic Product; 'grew by' + percentagem; 'quarter' = trimestre."
        difficulty: 2
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: O banco central manteve a política monetária inalterada.
        correctAnswer: The central bank kept monetary policy unchanged
        rationale: "'Monetary policy' = política monetária; 'kept unchanged' = manteve inalterada."
        difficulty: 3
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: O desemprego estrutural é difícil de resolver a curto prazo.
        correctAnswer: Structural unemployment is difficult to address in the short term
        rationale: "'Structural unemployment' = desemprego estrutural; 'address' = enfrentar/resolver (formal)."
        difficulty: 3
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: As receitas fiscais caíram abaixo das previsões.
        correctAnswer: Tax revenues fell below projections
        rationale: "'Tax revenues' = receitas fiscais; 'fell below projections' = ficaram abaixo das previsões."
        difficulty: 3
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: A dívida pública superou cento e vinte por cento do PIB.
        correctAnswer: Public debt exceeded one hundred and twenty per cent of GDP
        rationale: "'Public debt exceeded' = dívida pública superou; 'as a percentage of GDP' = colocação opcional."
        difficulty: 3
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: A recessão levou a um aumento do desemprego.
        correctAnswer: The recession led to a rise in unemployment
        rationale: "'Led to a rise in' = colocação causa-efeito económica; mais preciso que 'increase'."
        difficulty: 2
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: O banco central subiu as taxas para controlar a inflação.
        correctAnswer: The central bank raised rates to curb inflation
        rationale: "'Raised rates' = subiu as taxas; 'curb inflation' = controlar inflação (colocação chave)."
        difficulty: 3
        objectives: [C1.vocabulary.economics]
  - pageNumber: 2
    title: Economic Policy & Analysis
    description: Complex economic sentences in analytical register.
    exercises:
      - type: english_phrases
        question: A política monetária expansionista estimulou o crescimento económico.
        correctAnswer: The expansionary monetary policy stimulated economic growth
        rationale: "'Expansionary' = expansionista; 'stimulated economic growth' = colocação padrão."
        difficulty: 4
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: A balança de pagamentos registou um superávite histórico.
        correctAnswer: The balance of payments recorded a historic surplus
        rationale: "'Balance of payments' = balança de pagamentos; 'surplus' = superávite (oposto de 'deficit')."
        difficulty: 4
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: O ajuste estrutural foi imposto como condição do empréstimo.
        correctAnswer: Structural adjustment was imposed as a condition of the loan
        rationale: "'Structural adjustment' = ajuste estrutural; 'as a condition of' = como condição de."
        difficulty: 4
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: A liberalização do comércio aumentou a competitividade do setor.
        correctAnswer: Trade liberalization boosted the competitiveness of the sector
        rationale: "'Trade liberalization' = liberalização do comércio; 'boosted' = aumentou (dinamismo)."
        difficulty: 4
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: Os mercados emergentes sofreram com a fuga de capitais.
        correctAnswer: Emerging markets suffered from capital flight
        rationale: "'Capital flight' = fuga de capitais; termo técnico; 'emerging markets' sem artigo."
        difficulty: 5
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: O austeridade fiscal afetou desproporcionalmente as classes mais baixas.
        correctAnswer: Fiscal austerity disproportionately affected the lower classes
        rationale: "'Fiscal austerity' = austeridade fiscal; 'disproportionately' = advérbio de impacto."
        difficulty: 5
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: A especulação financeira contribuiu para a bolha imobiliária.
        correctAnswer: Financial speculation contributed to the housing bubble
        rationale: "'Financial speculation' + 'housing bubble' = vocabulário da crise de 2008."
        difficulty: 5
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: O quantitative easing foi usado para injetar liquidez no sistema.
        correctAnswer: Quantitative easing was used to inject liquidity into the system
        rationale: "'Quantitative easing' = termo técnico; 'inject liquidity into' = colocação bancária central."
        difficulty: 5
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: A depreciação da moeda tornou as exportações mais competitivas.
        correctAnswer: Currency depreciation made exports more competitive
        rationale: "'Currency depreciation' sem artigo; 'made exports more competitive' = efeito standard."
        difficulty: 4
        objectives: [C1.vocabulary.economics]
      - type: english_phrases
        question: O crescimento inclusivo permanece um objetivo difícil de alcançar.
        correctAnswer: Inclusive growth remains an elusive goal
        rationale: "'Inclusive growth' = crescimento inclusivo; 'elusive goal' = objetivo difícil de alcançar (C1 colocação)."
        difficulty: 4
        objectives: [C1.vocabulary.economics]
target: 20
