title: ✏️ English K - C1 Essay Writing Phrases
level: K
subject: english
difficulty: 5
objectives:
  - C1.writing.essay_phrases
authorNotes: Academic essays at C1 use specific discourse markers for each rhetorical function — introducing, developing, conceding, concluding. Mastering these phrases signals high register and cohesion.
repeatAll: 2
example: "Ex.: 'Para concluir, ambas as perspetivas têm mérito' → In conclusion, both perspectives have merit."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Introduction & Development Phrases
    description: Translate using standard academic essay discourse markers.
    exercises:
      - type: english_phrases
        question: Esta redação examina as causas e consequências da desigualdade.
        correctAnswer: This essay examines the causes and consequences of inequality
        rationale: "'This essay examines' = abertura académica padrão; não usar 'I will write about'."
        difficulty: 2
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: É importante salientar que nem toda a evidência apoia esta visão.
        correctAnswer: It is worth noting that not all evidence supports this view
        rationale: "'It is worth noting that' = é de salientar/notar; introduz ressalva ou nuance."
        difficulty: 2
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Além disso, as implicações económicas não podem ser ignoradas.
        correctAnswer: Furthermore, the economic implications cannot be ignored
        rationale: "'Furthermore' = além disso (grau mais formal que 'also'); acrescenta argumento."
        difficulty: 2
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Em termos gerais, a política provou ser ineficaz.
        correctAnswer: On the whole, the policy has proved to be ineffective
        rationale: "'On the whole' = em termos gerais/no geral; generalização cuidadosa. 'Proved to be'."
        difficulty: 3
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: No que diz respeito às medidas ambientais, o progresso tem sido lento.
        correctAnswer: With regard to environmental measures, progress has been slow
        rationale: "'With regard to' = no que diz respeito a; 'progress' incontável sem artigo."
        difficulty: 3
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Importa primeiro definir o que entendemos por 'desenvolvimento sustentável'.
        correctAnswer: It is first necessary to define what is meant by 'sustainable development'
        rationale: "'What is meant by' = passiva nominal; define termo técnico antes de argumentar."
        difficulty: 3
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Os dados apresentados sustentam o argumento de que...
        correctAnswer: The data presented supports the argument that...
        rationale: "'Supports the argument that' = sustenta o argumento de que; colocação académica."
        difficulty: 3
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: É de igual relevância considerar o papel dos fatores externos.
        correctAnswer: It is equally relevant to consider the role of external factors
        rationale: "'It is equally relevant to consider' = peso igual a argumento anterior. Transição paralela."
        difficulty: 3
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Dito de outro modo, a solução proposta é insuficiente.
        correctAnswer: In other words, the proposed solution is insufficient
        rationale: "'In other words' = dito de outro modo/ou seja; reformula para clareza."
        difficulty: 3
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Há que reconhecer que a situação é mais complexa do que parece.
        correctAnswer: It must be acknowledged that the situation is more complex than it appears
        rationale: "'It must be acknowledged that' = há que reconhecer; concessão formal introdutória."
        difficulty: 4
        objectives: [C1.writing.essay_phrases]
  - pageNumber: 2
    title: Conclusion & Evaluative Phrases
    description: Translate conclusion and evaluation phrases typical of C1 essays.
    exercises:
      - type: english_phrases
        question: Em suma, as vantagens superam claramente as desvantagens.
        correctAnswer: In sum, the advantages clearly outweigh the disadvantages
        rationale: "'In sum' = em suma; 'outweigh' = superar em peso/importância. Colocação de conclusão."
        difficulty: 3
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Num balanço geral, esta abordagem merece mais atenção.
        correctAnswer: On balance, this approach deserves greater attention
        rationale: "'On balance' = num balanço geral; sinaliza avaliação ponderada. 'Greater' = mais."
        difficulty: 3
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Em conclusão, há argumentos convincentes de ambos os lados.
        correctAnswer: In conclusion, there are compelling arguments on both sides
        rationale: "'In conclusion' = em conclusão; 'compelling arguments' = argumentos convincentes."
        difficulty: 4
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: A evidência disponível sugere fortemente que uma reforma é necessária.
        correctAnswer: The available evidence strongly suggests that reform is necessary
        rationale: "'Strongly suggests that' = sugere fortemente; 'reform' incontável para conceito geral."
        difficulty: 4
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Tendo em conta tudo o que foi dito, a segunda abordagem parece mais viável.
        correctAnswer: Taking everything into account, the second approach seems more viable
        rationale: "'Taking everything into account' = tendo em conta tudo; participial absoluta de conclusão."
        difficulty: 5
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Não obstante as limitações desta análise, as conclusões são sólidas.
        correctAnswer: Notwithstanding the limitations of this analysis, the conclusions are robust
        rationale: "'Notwithstanding the limitations' = não obstante as limitações; 'robust' = sólido (académico)."
        difficulty: 5
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: É necessária mais investigação antes de se poderem tirar conclusões definitivas.
        correctAnswer: Further research is needed before definitive conclusions can be drawn
        rationale: "'Further research is needed before...can be drawn' = passiva académica de conclusão."
        difficulty: 5
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Este ensaio procurou demonstrar que a cooperação internacional é essencial.
        correctAnswer: This essay has sought to demonstrate that international cooperation is essential
        rationale: "'Has sought to demonstrate' = present perfect + infinitivo de finalidade. Encerramento reflexivo."
        difficulty: 5
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: Para além do que foi dito, seria simplista ignorar as perspetivas culturais.
        correctAnswer: Beyond what has been said, it would be simplistic to ignore cultural perspectives
        rationale: "'Beyond what has been said' = para além do que foi dito; 'simplistic to ignore' = acusação crítica."
        difficulty: 5
        objectives: [C1.writing.essay_phrases]
      - type: english_phrases
        question: À luz das evidências apresentadas, a hipótese inicial é confirmada.
        correctAnswer: In light of the evidence presented, the initial hypothesis is confirmed
        rationale: "'In light of the evidence presented' = à luz das evidências; colocação de conclusão académica."
        difficulty: 5
        objectives: [C1.writing.essay_phrases]
target: 20
