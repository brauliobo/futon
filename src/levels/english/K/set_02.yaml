title: English K - Pronoun & Time Changes
level: K
subject: english
difficulty: 4
objectives: [B2.grammar.reported_speech]
authorNotes: Pronouns shift to match reporter's perspective (I→he/she, my→his/her). Time — now→then, today→that day, tomorrow→the next day.
repeatAll: 2
example: "'Estou aqui hoje' → He said he was there that day"
pages:
  - pageNumber: 1
    title: Pronoun Shift
    description: First person becomes third when reporting others.
    exercises:
      - { type: english_phrases, question: "'Eu gosto disso' — Ana disse que...", correctAnswer: ana said she liked it }
      - { type: english_phrases, question: "'Meu livro é novo' — Ele disse que...", correctAnswer: he said his book was new }
      - { type: english_phrases, question: "'Nós vamos' — Eles disseram que...", correctAnswer: they said they would go }
      - { type: english_phrases, question: "'Eu te vejo depois' — Ela me disse que...", correctAnswer: she told me she would see me later }
      - { type: english_phrases, question: "'Minha mãe está bem' — Ele disse que...", correctAnswer: he said his mother was fine }
      - { type: english_phrases, question: "'Nosso carro é velho' — Ela disse que...", correctAnswer: she said their car was old }
      - { type: english_phrases, question: "'Eu vou com você' — Ele me disse que...", correctAnswer: he told me he would go with me }
      - { type: english_phrases, question: "'Seus amigos ligaram' — Ela me disse que...", correctAnswer: she told me my friends had called }
      - { type: english_phrases, question: "'Eu adoro meu trabalho' — Ele disse que...", correctAnswer: he said he loved his job }
      - { type: english_phrases, question: "'Nossa casa é grande' — Eles disseram que...", correctAnswer: they said their house was big }
  - pageNumber: 2
    title: Time & Place Markers
    description: now→then, today→that day, yesterday→the day before, here→there, this→that.
    exercises:
      - { type: english_phrases, question: "'Estou aqui hoje' — Ele disse que...", correctAnswer: he said he was there that day }
      - { type: english_phrases, question: "'Vou amanhã' — Ela disse que...", correctAnswer: she said she would go the next day }
      - { type: english_phrases, question: "'Cheguei ontem' — Ele disse que...", correctAnswer: he said he had arrived the day before }
      - { type: english_phrases, question: "'Este livro é meu' — Ela disse que...", correctAnswer: she said that book was hers }
      - { type: english_phrases, question: "'Moro aqui' — Ele disse que...", correctAnswer: he said he lived there }
      - { type: english_phrases, question: "'Vou ligar agora' — Ela disse que...", correctAnswer: she said she would call then }
      - { type: english_phrases, question: "'Fiquei em casa esta semana' — Ele disse que...", correctAnswer: he said he had stayed home that week }
      - { type: english_phrases, question: "'Começa na próxima segunda' — Ela disse que...", correctAnswer: she said it would start the following monday }
      - { type: english_phrases, question: "'Eu te encontro aqui' — Ele me disse que...", correctAnswer: he told me he would meet me there }
      - { type: english_phrases, question: "'Estes livros são meus' — Ela disse que...", correctAnswer: she said those books were hers }
target: 20
