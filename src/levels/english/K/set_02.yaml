title: English K - Pronoun & Time Changes
level: K
subject: english
difficulty: 4
objectives:
  - B2.grammar.reported_speech
authorNotes: Pronouns shift to match reporter's perspective (I→he/she, my→his/her). Time — now→then, today→that day, tomorrow→the next day.
repeatAll: 2
example: "'Estou aqui hoje' → He said he was there that day"
pages:
  - pageNumber: 1
    title: Pronoun Shift
    description: First person becomes third when reporting others.
    exercises:
      - type: english_phrases
        question: "'Eu gosto disso' — Ana disse que..."
        correctAnswer: Ana said she liked it
        rationale: "'I' → 'she'. 'Like' → 'liked'. 'It' como objeto de 'like'."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Meu livro é novo' — Ele disse que..."
        correctAnswer: He said his book was new
        rationale: "'My' → 'his'. 'Is' → 'was' (backshift)."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Nós vamos' — Eles disseram que..."
        correctAnswer: They said they would go
        rationale: "'We' → 'they'. 'Will go' → 'would go' (backshift)."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Eu te vejo depois' — Ela me disse que..."
        correctAnswer: She told me she would see me later
        rationale: "'I' → 'she'. 'You' (= falante original) → 'me'. 'Will' → 'would'."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Minha mãe está bem' — Ele disse que..."
        correctAnswer: He said his mother was fine
        rationale: "'My' → 'his'. 'Is' → 'was'. 'Fine' = bem (adjetivo)."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Nosso carro é velho' — Ela disse que..."
        correctAnswer: She said their car was old
        rationale: "'Our' → 'their'. 'Is' → 'was' (backshift)."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Eu vou com você' — Ele me disse que..."
        correctAnswer: He told me he would go with me
        rationale: "'I' → 'he'. 'You' → 'me' (ouvinte). 'Tell + objeto'."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Seus amigos ligaram' — Ela me disse que..."
        correctAnswer: She told me my friends had called
        rationale: "'Your' (= meu na perspectiva reportada) → 'my'. 'Called' → 'had called'."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Eu adoro meu trabalho' — Ele disse que..."
        correctAnswer: He said he loved his job
        rationale: "'I' → 'he'. 'My' → 'his'. 'Love' → 'loved'."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Nossa casa é grande' — Eles disseram que..."
        correctAnswer: They said their house was big
        rationale: "'Our' → 'their'. 'Is big' → 'was big' (backshift)."
        difficulty: 3
        objectives: [B2.grammar.reported_speech]
  - pageNumber: 2
    title: Time & Place Markers
    description: now→then, today→that day, yesterday→the day before, here→there, this→that.
    exercises:
      - type: english_phrases
        question: "'Estou aqui hoje' — Ele disse que..."
        correctAnswer: He said he was there that day
        rationale: "'Here' → 'there'. 'Today' → 'that day'. 'Am' → 'was'."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Vou amanhã' — Ela disse que..."
        correctAnswer: She said she would go the next day
        rationale: "'Tomorrow' → 'the next day'. 'Will go' → 'would go'."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Cheguei ontem' — Ele disse que..."
        correctAnswer: He said he had arrived the day before
        rationale: "'Yesterday' → 'the day before'. 'Arrived' → 'had arrived'."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Este livro é meu' — Ela disse que..."
        correctAnswer: She said that book was hers
        rationale: "'This' → 'that'. 'Mine' → 'hers'. 'Is' → 'was'."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Moro aqui' — Ele disse que..."
        correctAnswer: He said he lived there
        rationale: "'Here' → 'there'. 'Live' → 'lived' (backshift)."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Vou ligar agora' — Ela disse que..."
        correctAnswer: She said she would call then
        rationale: "'Now' → 'then'. 'Will call' → 'would call'."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Fiquei em casa esta semana' — Ele disse que..."
        correctAnswer: He said he had stayed home that week
        rationale: "'This week' → 'that week'. 'Stayed' → 'had stayed' (backshift)."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Começa na próxima segunda' — Ela disse que..."
        correctAnswer: She said it would start the following Monday
        rationale: "'Next Monday' → 'the following Monday'. 'Will start' → 'would start'."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Eu te encontro aqui' — Ele me disse que..."
        correctAnswer: He told me he would meet me there
        rationale: "'Here' → 'there'. 'You' → 'me'. 'Will meet' → 'would meet'."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
      - type: english_phrases
        question: "'Estes livros são meus' — Ela disse que..."
        correctAnswer: She said those books were hers
        rationale: "'These' → 'those'. 'Mine' → 'hers'. 'Are' → 'were'."
        difficulty: 4
        objectives: [B2.grammar.reported_speech]
target: 20
