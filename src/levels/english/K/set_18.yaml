title: ✏️ English K - Cause & Effect — Advanced Linking
level: K
subject: english
difficulty: 5
objectives:
  - C1.grammar.cause_effect_advanced
authorNotes: Advanced cause-effect linking goes beyond 'because' and 'so'. C1 requires verbs (stem from, give rise to, culminate in, trigger), adjectives (attributable to, conducive to) and phrases (as a consequence of, in response to).
repeatAll: 2
example: "Ex.: 'O problema decorre de uma má comunicação' → The problem stems from poor communication."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Cause & Effect Verbs and Phrases
    description: Translate using advanced cause-effect connectors.
    exercises:
      - type: english_phrases
        question: O problema decorre de uma falta de supervisão adequada.
        correctAnswer: The problem stems from a lack of adequate supervision
        rationale: "'Stems from' = decorre de/tem origem em; denota causa raiz. 'A lack of' = falta de."
        difficulty: 2
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: A pobreza deu origem a tensões sociais significativas.
        correctAnswer: Poverty gave rise to significant social tensions
        rationale: "'Give rise to' = dar origem a; causa que produz efeito mais amplo. Colocação C1."
        difficulty: 2
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: Os protestos culminaram na queda do governo.
        correctAnswer: The protests culminated in the fall of the government
        rationale: "'Culminate in' = culminar em; implica ponto máximo de uma série de eventos."
        difficulty: 2
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: O fracasso é atribuível a uma estratégia mal concebida.
        correctAnswer: The failure is attributable to a poorly conceived strategy
        rationale: "'Attributable to' = atribuível a; formal e neutro; 'poorly conceived' = mal concebida."
        difficulty: 3
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: As mudanças climáticas desencadearam uma série de eventos extremos.
        correctAnswer: Climate change has triggered a series of extreme weather events
        rationale: "'Triggered' = desencadeou; implica ação repentina que inicia uma cadeia. 'Weather' acrescentado."
        difficulty: 3
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: O stresse prolongado contribui para o desenvolvimento de doenças crónicas.
        correctAnswer: Prolonged stress contributes to the development of chronic diseases
        rationale: "'Contributes to the development of' = nominalização após 'contribute to'. Colocação médica."
        difficulty: 3
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: A decisão resultou em consequências imprevistas.
        correctAnswer: The decision resulted in unforeseen consequences
        rationale: "'Resulted in' = resultou em; seguido de substantivo; mais formal que 'led to'."
        difficulty: 2
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: A recessão foi responsável pelo encerramento de milhares de empresas.
        correctAnswer: The recession was responsible for the closure of thousands of businesses
        rationale: "'Was responsible for' + nominalização 'closure of'; 'businesses' = empresas."
        difficulty: 3
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: O aumento das temperaturas pode provocar a subida do nível do mar.
        correctAnswer: Rising temperatures may bring about a rise in sea levels
        rationale: "'Bring about' = provocar/causar; 'may' = hedge de possibilidade. 'Sea levels' plural."
        difficulty: 3
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: A invasão precipitou uma crise humanitária de grandes proporções.
        correctAnswer: The invasion precipitated a large-scale humanitarian crisis
        rationale: "'Precipitated' = precipitou/acelerou; implica urgência. 'Large-scale' = de grandes proporções."
        difficulty: 3
        objectives: [C1.grammar.cause_effect_advanced]
  - pageNumber: 2
    title: Complex Causal Structures
    description: Multi-clause cause-effect chains in analytical writing.
    exercises:
      - type: english_phrases
        question: A inflação crescente levou a um aumento do custo de vida, o que por sua vez gerou descontentamento social.
        correctAnswer: Rising inflation led to a higher cost of living, which in turn fuelled social discontent
        rationale: "'In turn fuelled' = gerou por sua vez; 'fuelled' = alimentou (metáfora). Cadeia causal."
        difficulty: 4
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: O desemprego está intrinsecamente ligado às políticas de austeridade adotadas.
        correctAnswer: Unemployment is intrinsically linked to the austerity policies adopted
        rationale: "'Intrinsically linked to' = intrinsecamente ligado a; relação causal estreita."
        difficulty: 4
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: O fracasso das negociações pode ter implicações de longo prazo para a paz regional.
        correctAnswer: The failure of the negotiations may have far-reaching implications for regional peace
        rationale: "'Far-reaching implications' = implicações de longo alcance; 'for regional peace' = para a paz regional."
        difficulty: 4
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: O colapso económico originou uma onda de migrações em massa.
        correctAnswer: The economic collapse gave rise to a wave of mass migration
        rationale: "'Gave rise to a wave of' = originou uma onda de; nominalização após 'give rise to'."
        difficulty: 4
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: Esta situação é propícia ao desenvolvimento da corrupção.
        correctAnswer: This situation is conducive to the development of corruption
        rationale: "'Conducive to' = propício a; seguido de substantivo ou gerúndio. Colocação formal."
        difficulty: 5
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: O choque petrolífero de 1973 está na origem da crise que se seguiu.
        correctAnswer: The 1973 oil shock was at the root of the crisis that followed
        rationale: "'Was at the root of' = está na origem de; metáfora de raiz para causa fundamental."
        difficulty: 5
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: A combinação de fatores despoletou um efeito dominó devastador.
        correctAnswer: The combination of factors set off a devastating domino effect
        rationale: "'Set off' = despoletou/acionou; 'domino effect' = efeito em cascata/dominó."
        difficulty: 5
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: O investimento em educação tem consequências positivas no crescimento económico a longo prazo.
        correctAnswer: Investment in education has a positive knock-on effect on long-term economic growth
        rationale: "'Knock-on effect on' = efeito cascata positivo; colocação idiomática britânica."
        difficulty: 5
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: A perda de biodiversidade acarreta riscos graves para os ecossistemas.
        correctAnswer: The loss of biodiversity entails serious risks for ecosystems
        rationale: "'Entails' = acarreta/implica necessariamente; mais forte que 'involves'."
        difficulty: 4
        objectives: [C1.grammar.cause_effect_advanced]
      - type: english_phrases
        question: O escândalo acabou por levar à demissão do presidente.
        correctAnswer: The scandal ultimately led to the resignation of the president
        rationale: "'Ultimately led to' = acabou por levar a; 'ultimately' marca o ponto final de causalidade."
        difficulty: 4
        objectives: [C1.grammar.cause_effect_advanced]
target: 20
