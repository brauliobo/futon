title: English K - Reported Statements — Backshift
level: K
subject: english
difficulty: 4
objectives:
  - B2.grammar.reported_speech
authorNotes: Tenses shift back one step — present simple→past simple, will→would, can→could, present perfect→past perfect.
repeatAll: 2
example: "'Eu estudo' → She said she studied"
pages:
  - pageNumber: 1
    title: Present to Past
    description: Reporting present statements.
    exercises:
      - type: english_phrases
        question: "'Eu estudo inglês' — Ela disse que..."
        correctAnswer: she said she studied english
        rationale: "Pronomes e tempos também ajustam."
      - type: english_phrases
        question: "'Ele trabalha aqui' — Ela disse que..."
        correctAnswer: she said he worked here
        rationale: "'Said that + oração' com verbo recuado."
      - type: english_phrases
        question: "'Nós somos amigos' — Ele disse que..."
        correctAnswer: he said they were friends
        rationale: "Must → had to."
      - type: english_phrases
        question: "'Eu moro no Brasil' — Ele disse que..."
        correctAnswer: he said he lived in brazil
        rationale: "'That' é opcional após 'said'."
      - type: english_phrases
        question: "'Eu gosto de música' — Ela disse que..."
        correctAnswer: she said she liked music
        rationale: "'Said that + oração' com verbo recuado."
      - type: english_phrases
        question: "'Eu estou cansado' — Ele disse que..."
        correctAnswer: he said he was tired
        rationale: "Pronomes e tempos também ajustam."
      - type: english_phrases
        question: "'Eles estão estudando' — Ela disse que..."
        correctAnswer: she said they were studying
        rationale: "Present simple → past simple; present perfect → past perfect."
      - type: english_phrases
        question: "'Eu quero ir' — Ele disse que..."
        correctAnswer: he said he wanted to go
        rationale: "Modais: can → could, will → would, may → might."
      - type: english_phrases
        question: "'Eu não entendo' — Ela disse que..."
        correctAnswer: she said she did not understand
        rationale: "Pronomes e tempos também ajustam."
      - type: english_phrases
        question: "'Estou com fome' — Ele disse que..."
        correctAnswer: he said he was hungry
        rationale: "Past simple → past perfect."
  - pageNumber: 2
    title: Past / Perfect / Modal Shift
    description: Past simple→past perfect, will→would, can→could.
    exercises:
      - type: english_phrases
        question: "'Eu fui' — Ela disse que..."
        correctAnswer: she said she had gone
        rationale: "Recuo de tempo: 'is' → 'was'; 'will' → 'would'."
      - type: english_phrases
        question: "'Nós vamos' — Ele disse que..."
        correctAnswer: he said they would go
        rationale: "Must → had to."
      - type: english_phrases
        question: "'Eu sei a resposta' — Ele disse que..."
        correctAnswer: he said he knew the answer
        rationale: "'Said that + oração' com verbo recuado."
      - type: english_phrases
        question: "'Eu posso nadar' — Ela disse que..."
        correctAnswer: she said she could swim
        rationale: "Past simple → past perfect."
      - type: english_phrases
        question: "'Eu já terminei' — Ele disse que..."
        correctAnswer: he said he had finished
        rationale: "'That' é opcional após 'said'."
      - type: english_phrases
        question: "'Eu vou ajudar' — Ela disse que..."
        correctAnswer: she said she would help
        rationale: "Must → had to."
      - type: english_phrases
        question: "'Eu vi o filme' — Ele disse que..."
        correctAnswer: he said he had seen the movie
        rationale: "Past simple → past perfect."
      - type: english_phrases
        question: "'Eles estavam esperando' — Ela disse que..."
        correctAnswer: she said they had been waiting
        rationale: "Modais: can → could, will → would, may → might."
      - type: english_phrases
        question: "'Eu terei tempo' — Ele disse que..."
        correctAnswer: he said he would have time
        rationale: "Recuo de tempo: 'is' → 'was'; 'will' → 'would'."
      - type: english_phrases
        question: "'Eu estou estudando' — Ela disse que..."
        correctAnswer: she said she was studying
        rationale: "Modais: can → could, will → would, may → might."
target: 20
