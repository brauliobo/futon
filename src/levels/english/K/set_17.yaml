title: ✏️ English K - Impersonal Passive Constructions
level: K
subject: english
difficulty: 5
objectives:
  - C1.grammar.impersonal_passive
authorNotes: Impersonal passives (It is claimed that, It has been suggested that, It is widely believed that) are essential for academic English. They convey objectivity and remove the human agent.
repeatAll: 2
example: "Ex.: 'Dizem que o clima está a mudar rapidamente' → It is said that the climate is changing rapidly."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: It + Passive Reporting Verbs
    description: Translate using It is/was + past participle + that.
    exercises:
      - type: english_phrases
        question: Dizem que a empresa está à beira da falência.
        correctAnswer: It is said that the company is on the verge of bankruptcy
        rationale: "'It is said that' = dizem que/afirma-se que; 'on the verge of' = à beira de."
        difficulty: 2
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Alegam que o ministro sabia da fraude.
        correctAnswer: It is alleged that the minister knew about the fraud
        rationale: "'It is alleged that' = alegam que; usado em jornalismo antes de condenação."
        difficulty: 2
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Sugere-se que a dieta mediterrânica reduz o risco cardíaco.
        correctAnswer: It has been suggested that the Mediterranean diet reduces cardiac risk
        rationale: "'It has been suggested that' = present perfect; sugere pesquisa acumulada."
        difficulty: 2
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Acredita-se amplamente que o aquecimento global é uma ameaça existencial.
        correctAnswer: It is widely believed that global warming is an existential threat
        rationale: "'Widely believed' = crença difundida; 'existential threat' = ameaça existencial."
        difficulty: 3
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Assume-se que os custos serão absorvidos pelo orçamento existente.
        correctAnswer: It is assumed that the costs will be absorbed by the existing budget
        rationale: "'It is assumed that' = assume-se que; 'absorbed by' = passiva na oração encaixada."
        difficulty: 3
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Reporta-se que várias pessoas ficaram feridas.
        correctAnswer: It has been reported that several people were injured
        rationale: "'It has been reported that' = reporta-se que; present perfect para notícia recente."
        difficulty: 2
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Reconhece-se que os recursos naturais são finitos.
        correctAnswer: It is recognized that natural resources are finite
        rationale: "'It is recognized that' = reconhece-se; afirmação de consenso académico/científico."
        difficulty: 2
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Estima-se que o projeto custará dez milhões de euros.
        correctAnswer: It is estimated that the project will cost ten million euros
        rationale: "'It is estimated that' = estima-se que; 'will cost' = projeção futura."
        difficulty: 3
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Argumenta-se que as medidas de austeridade pioraram a situação.
        correctAnswer: It has been argued that austerity measures worsened the situation
        rationale: "'It has been argued that' = argumenta-se; present perfect indica debate em curso."
        difficulty: 3
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Demonstrou-se que o exercício regular melhora a saúde mental.
        correctAnswer: It has been demonstrated that regular exercise improves mental health
        rationale: "'It has been demonstrated that' = demonstrou-se; robusto, baseado em evidências."
        difficulty: 3
        objectives: [C1.grammar.impersonal_passive]
  - pageNumber: 2
    title: Subject + Passive Infinitive
    description: Subject + is/are said/believed/reported to + infinitive.
    exercises:
      - type: english_phrases
        question: Diz-se que ele tem uma fortuna considerável.
        correctAnswer: He is said to have a considerable fortune
        rationale: "'Subject + is said to have' = alternativa à estrutura 'It is said that he has'."
        difficulty: 4
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Acredita-se que o tratamento foi bem-sucedido.
        correctAnswer: The treatment is believed to have been successful
        rationale: "'Subject + is believed to have been' = perfect infinitive para ação anterior."
        difficulty: 4
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Reportam que a empresa está a contratar.
        correctAnswer: The company is reported to be hiring
        rationale: "'Subject + is reported to be + gerúndio' = ação em curso reportada impessoalmente."
        difficulty: 4
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Presume-se que os réus sejam inocentes até prova em contrário.
        correctAnswer: The defendants are presumed to be innocent until proven otherwise
        rationale: "'Presumed to be innocent until proven otherwise' = princípio jurídico padrão."
        difficulty: 4
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Afirma-se que as negociações estão em fase avançada.
        correctAnswer: The negotiations are claimed to be at an advanced stage
        rationale: "'Subject + are claimed to be' com predicativo; 'advanced stage' = fase avançada."
        difficulty: 5
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Pensa-se que a crise foi causada por má gestão financeira.
        correctAnswer: The crisis is thought to have been caused by poor financial management
        rationale: "'Is thought to have been caused' = passiva + perfect infinitive passivo. Dupla passiva."
        difficulty: 5
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Suspeita-se que ele tenha manipulado os dados.
        correctAnswer: He is suspected of having manipulated the data
        rationale: "'Suspected of having done' = suspect + preposition 'of' + gerúndio perfeito."
        difficulty: 5
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Considera-se que o método é mais eficaz do que os tradicionais.
        correctAnswer: The method is considered to be more effective than traditional ones
        rationale: "'Considered to be' = passiva + infinitivo; 'than traditional ones' = substituição pronominal."
        difficulty: 4
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Espera-se que os resultados sejam publicados no próximo mês.
        correctAnswer: The results are expected to be published next month
        rationale: "'Expected to be published' = passiva + infinitivo passivo; expectativa impessoal."
        difficulty: 5
        objectives: [C1.grammar.impersonal_passive]
      - type: english_phrases
        question: Mostrou-se que a nova vacina é segura e eficaz.
        correctAnswer: The new vaccine has been shown to be safe and effective
        rationale: "'Has been shown to be' = passiva + perfect + infinitivo; linguagem de ensaio clínico."
        difficulty: 4
        objectives: [C1.grammar.impersonal_passive]
target: 20
