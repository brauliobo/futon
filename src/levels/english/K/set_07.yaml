title: English K - Reported Speech Mixed Review
level: K
subject: english
difficulty: 5
objectives: [B2.grammar.reported_speech]
authorNotes: Combined practice — statements, questions, commands, reporting verbs, no-backshift cases.
repeatAll: 2
example: "He asked if I could help → Ele perguntou se eu podia ajudar"
pages:
  - pageNumber: 1
    title: Mixed Practice
    description: Identify the form and translate the report.
    exercises:
      - { type: english_phrases, question: "'Estou ocupado' — Ele disse que...", correctAnswer: he said he was busy }
      - { type: english_phrases, question: "'Você está ouvindo?' — Ela perguntou...", correctAnswer: she asked if i was listening }
      - { type: english_phrases, question: "'Não saia' — Ele me disse...", correctAnswer: he told me not to leave }
      - { type: english_phrases, question: "'Eu chegarei cedo' — Ela prometeu...", correctAnswer: she promised to arrive early }
      - { type: english_phrases, question: "'Onde você estuda?' — Ele perguntou...", correctAnswer: he asked where i studied }
      - { type: english_phrases, question: "'Eu moro em Berlim' — Ela diz que...", correctAnswer: she says she lives in berlin }
      - { type: english_phrases, question: "'Vamos sair' — Ele sugeriu...", correctAnswer: he suggested going out }
      - { type: english_phrases, question: "'Eu já terminei' — Ela disse que...", correctAnswer: she said she had finished }
      - { type: english_phrases, question: "'Não faça isso' — Ele me avisou...", correctAnswer: he warned me not to do that }
      - { type: english_phrases, question: "'Eu posso ajudar' — Ela disse que...", correctAnswer: she said she could help }
  - pageNumber: 2
    title: Realistic Narrative
    description: Short reports in story contexts.
    exercises:
      - { type: english_phrases, question: "'Estamos atrasados' — Eles disseram que...", correctAnswer: they said they were late }
      - { type: english_phrases, question: "'Você mora aqui?' — Ela perguntou...", correctAnswer: she asked if i lived there }
      - { type: english_phrases, question: "'Eu te encontro às sete' — Ele prometeu...", correctAnswer: he promised to meet me at seven }
      - { type: english_phrases, question: "'Por que você está triste?' — Ela perguntou...", correctAnswer: she asked why i was sad }
      - { type: english_phrases, question: "'Eu não fiz isso' — Ele negou...", correctAnswer: he denied doing it }
      - { type: english_phrases, question: "'Me desculpe' — Ela pediu...", correctAnswer: she apologized }
      - { type: english_phrases, question: "'Obrigado' — Ele agradeceu...", correctAnswer: he thanked me }
      - { type: english_phrases, question: "'Eu vou tentar' — Ela concordou...", correctAnswer: she agreed to try }
      - { type: english_phrases, question: "'Você é incrível' — Ele me disse que...", correctAnswer: he told me i was amazing }
      - { type: english_phrases, question: "'Eu não posso vir' — Ela se recusou...", correctAnswer: she refused to come }
target: 20
