title: English K - Reported Speech Mixed Review
level: K
subject: english
difficulty: 5
objectives:
  - B2.grammar.reported_speech
authorNotes: Combined practice — statements, questions, commands, reporting verbs, no-backshift cases.
repeatAll: 2
example: He asked if I could help → Ele perguntou se eu podia ajudar
pages:
  - pageNumber: 1
    title: Mixed Practice
    description: Identify the form and translate the report.
    exercises:
      - type: english_phrases
        question: "'Estou ocupado' — Ele disse que..."
        correctAnswer: he said he was busy
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Você está ouvindo?' — Ela perguntou..."
        correctAnswer: she asked if i was listening
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Não saia' — Ele me disse..."
        correctAnswer: he told me not to leave
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu chegarei cedo' — Ela prometeu..."
        correctAnswer: she promised to arrive early
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Onde você estuda?' — Ele perguntou..."
        correctAnswer: he asked where i studied
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu moro em Berlim' — Ela diz que..."
        correctAnswer: she says she lives in berlin
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Vamos sair' — Ele sugeriu..."
        correctAnswer: he suggested going out
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu já terminei' — Ela disse que..."
        correctAnswer: she said she had finished
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Não faça isso' — Ele me avisou..."
        correctAnswer: he warned me not to do that
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu posso ajudar' — Ela disse que..."
        correctAnswer: she said she could help
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Realistic Narrative
    description: Short reports in story contexts.
    exercises:
      - type: english_phrases
        question: "'Estamos atrasados' — Eles disseram que..."
        correctAnswer: they said they were late
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Você mora aqui?' — Ela perguntou..."
        correctAnswer: she asked if i lived there
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu te encontro às sete' — Ele prometeu..."
        correctAnswer: he promised to meet me at seven
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Por que você está triste?' — Ela perguntou..."
        correctAnswer: she asked why i was sad
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu não fiz isso' — Ele negou..."
        correctAnswer: he denied doing it
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Me desculpe' — Ela pediu..."
        correctAnswer: she apologized
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Obrigado' — Ele agradeceu..."
        correctAnswer: he thanked me
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu vou tentar' — Ela concordou..."
        correctAnswer: she agreed to try
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Você é incrível' — Ele me disse que..."
        correctAnswer: he told me i was amazing
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: "'Eu não posso vir' — Ela se recusou..."
        correctAnswer: she refused to come
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
