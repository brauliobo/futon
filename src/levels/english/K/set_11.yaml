title: ✏️ English K - Concession — Formal
level: K
subject: english
difficulty: 5
objectives:
  - C1.grammar.concession_formal
authorNotes: Formal concession acknowledges an opposing point before asserting the main argument. Key markers include admittedly, granted, for all its merits, whatever the drawbacks, notwithstanding.
repeatAll: 2
example: "Ex.: 'Embora haja méritos, existem riscos sérios' → For all its merits, there are serious risks."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Concessive Markers
    description: Translate using formal concession expressions.
    exercises:
      - type: english_phrases
        question: Reconheço que a proposta tem pontos fortes.
        correctAnswer: Admittedly, the proposal has its strengths
        rationale: "'Admittedly' = reconheço/admito; abre parágrafo concedendo um ponto ao oponente."
        difficulty: 2
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Dado que os custos são altos, o projeto ainda vale a pena.
        correctAnswer: Granted that the costs are high, the project is still worthwhile
        rationale: "'Granted that' = dado que/concedendo que; concessão seguida de contraponto."
        difficulty: 2
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Apesar dos seus méritos, a política tem falhas graves.
        correctAnswer: For all its merits, the policy has serious flaws
        rationale: "'For all its merits' = apesar dos seus méritos; 'for all' + noun phrase de concessão."
        difficulty: 2
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Seja quais forem as desvantagens, a decisão já foi tomada.
        correctAnswer: Whatever the drawbacks, the decision has already been made
        rationale: "'Whatever the drawbacks' = seja quais forem; concessão vaga antes de fait accompli."
        difficulty: 3
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Embora o progresso seja inegável, os desafios persistem.
        correctAnswer: While progress is undeniable, challenges remain
        rationale: "'While' concessivo + presente simples; 'remain' = persistir (mais formal que 'persist')."
        difficulty: 3
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Não obstante as dificuldades, a equipa manteve o foco.
        correctAnswer: Notwithstanding the difficulties, the team maintained its focus
        rationale: "'Notwithstanding' = não obstante; preposição formal de concessão."
        difficulty: 3
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Mesmo assim, é difícil ignorar as evidências contrárias.
        correctAnswer: Even so, it is difficult to ignore the contrary evidence
        rationale: "'Even so' = mesmo assim; retoma após concessão prévia. 'Contrary evidence' = formal."
        difficulty: 3
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Por mais que se tente, algumas questões permanecem sem solução.
        correctAnswer: However hard one tries, some issues remain unresolved
        rationale: "'However + adj/adv' = por mais que; 'one' impessoal; 'unresolved' = predicativo."
        difficulty: 3
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: De igual modo, nenhuma das soluções é perfeita.
        correctAnswer: Likewise, neither solution is perfect
        rationale: "'Likewise' = de igual modo; 'neither' para dois elementos sem 'not'."
        difficulty: 3
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Isso posto, algumas reservas ainda se justificam.
        correctAnswer: That said, some reservations are still justified
        rationale: "'That said' = isso posto/dito isto; fórmula de transição concessiva muito comum em C1."
        difficulty: 4
        objectives: [C1.grammar.concession_formal]
  - pageNumber: 2
    title: Extended Concessive Structures
    description: Multi-clause formal concession typical of essays and reports.
    exercises:
      - type: english_phrases
        question: Embora seja verdade que os resultados melhoraram, as causas profundas permanecem.
        correctAnswer: While it is true that results have improved, the root causes remain
        rationale: "'While it is true that' = concessão explícita com estrutura clivada. 'Root causes' = causas profundas."
        difficulty: 3
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Independentemente da sua posição, todos concordam que a mudança é necessária.
        correctAnswer: Regardless of one's position, all agree that change is necessary
        rationale: "'Regardless of one's position' = independentemente; 'one's' impessoal genérico."
        difficulty: 3
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Reconheço plenamente que erros foram cometidos.
        correctAnswer: I fully acknowledge that mistakes were made
        rationale: "'Fully acknowledge' reforça a concessão; passiva 'were made' distribui responsabilidade."
        difficulty: 4
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Apesar de todo o otimismo inicial, os resultados ficaram aquém das expetativas.
        correctAnswer: For all the initial optimism, the results fell short of expectations
        rationale: "'For all the...' + 'fell short of expectations' = expressão idiomática de desapontamento."
        difficulty: 4
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Mesmo que os dados sejam precisos, a interpretação pode variar.
        correctAnswer: Even if the data is accurate, the interpretation may vary
        rationale: "'Even if' = mesmo que; hipotético concessivo com modal 'may' de possibilidade."
        difficulty: 5
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: É de admitir que o sistema tem limitações estruturais.
        correctAnswer: It must be admitted that the system has structural limitations
        rationale: "'It must be admitted that' = passiva impessoal concessiva; grau máximo de formalidade."
        difficulty: 5
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Por todas as suas falhas, a teoria continua sendo influente.
        correctAnswer: For all its flaws, the theory remains influential
        rationale: "'For all its flaws' + 'remains' (link verb) + predicativo 'influential'."
        difficulty: 4
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Seja como for, o debate precisa continuar.
        correctAnswer: Be that as it may, the debate must continue
        rationale: "'Be that as it may' = seja como for; frase idiomática fixa de concessão formal."
        difficulty: 5
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: O argumento tem peso, mas há contrapontos igualmente válidos.
        correctAnswer: The argument carries weight, but there are equally valid counterpoints
        rationale: "'Carries weight' = tem peso/credibilidade; 'equally valid counterpoints' = registo formal."
        difficulty: 4
        objectives: [C1.grammar.concession_formal]
      - type: english_phrases
        question: Com todas as suas virtudes, o modelo não é universalmente aplicável.
        correctAnswer: With all its virtues, the model is not universally applicable
        rationale: "'With all its virtues' = com todas as suas virtudes; adjetivo 'applicable' pós-nominalmente."
        difficulty: 5
        objectives: [C1.grammar.concession_formal]
target: 20
