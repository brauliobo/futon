title: 🐝 English 5A - Palavras CVC — família 'og' (bog, dog, fog, hog, jog, log)
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.cvc.words
authorNotes: Família CVC com '-og'. Todas têm som /ɒg/.
repeatAll: 2
example: "Ex.: 'cachorro' → dog. Todas terminam em '-og'."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Família '-og'
    description: "Palavras CVC com o final '-og'."
    exercises:
      - type: english_vocab
        question: "Como se diz 'cachorro' em inglês?"
        correctAnswer: dog
        rationale: "'dog' — cachorro. D-O-G. Família '-og'."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'névoa/neblina' em inglês?"
        correctAnswer: fog
        rationale: "'fog' — névoa/neblina. F-O-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'tronco de madeira' em inglês?"
        correctAnswer: log
        rationale: "'log' — tronco de madeira. L-O-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'correr levemente/jogging' em inglês?"
        correctAnswer: jog
        rationale: "'jog' — correr em ritmo lento, fazer jogging. J-O-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'pântano' em inglês?"
        correctAnswer: bog
        rationale: "'bog' — pântano/terreno pantanoso. B-O-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'porco/egoísta' em inglês?"
        correctAnswer: hog
        rationale: "'hog' — porco (maior que pig) ou pessoa egoísta. H-O-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'I have a ___.' (animal de estimação — canino)"
        correctAnswer: dog
        rationale: "'I have a dog.' — Eu tenho um cachorro."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'There is ___ in the morning.' (condição climática)"
        correctAnswer: fog
        rationale: "'There is fog in the morning.' — Há névoa de manhã."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'He threw a ___ on the fire.' (pedaço de madeira)"
        correctAnswer: log
        rationale: "'He threw a log on the fire.' — Ele jogou um tronco no fogo."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual vogal têm todas as palavras da família '-og'?"
        correctAnswer: o
        rationale: "A vogal é 'o' (som /ɒ/ curto) em todas: bog, dog, fog, hog, jog, log."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
  - pageNumber: 2
    title: Usando a família '-og'
    description: "Pratique as palavras '-og' em frases."
    exercises:
      - type: english_vocab
        question: "'I ___ every morning.' (exercício de corrida leve)"
        correctAnswer: jog
        rationale: "'I jog every morning.' — Eu faço jogging toda manhã."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual é a família '-og' completa?"
        correctAnswer: bog, dog, fog, hog, jog, log
        rationale: "A família -og: bog, dog, fog, hog, jog, log."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "A família '-og' rima com a família '-ig'?"
        correctAnswer: no
        rationale: "Não! '-og' tem som /ɒg/ (dog, log). '-ig' tem som /ɪg/ (pig, big)."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete a rima: 'The ___ sat in the ___.' (cachorro/neblina)"
        correctAnswer: dog, fog
        rationale: "'The dog sat in the fog.' — O cachorro sentou na névoa. dog e fog rimam!"
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'frog' (sapo) pertence à família '-og'?"
        correctAnswer: yes
        rationale: "Sim! 'frog' (sapo) termina em '-og' — F-R-O-G. Rima com dog, log, fog."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual é a diferença entre 'dog' e 'hog'?"
        correctAnswer: dog is a pet, hog is a pig
        rationale: "'dog' é cachorro (animal doméstico). 'hog' é um porco grande."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'log in' significa o quê em computação?"
        correctAnswer: sign in
        rationale: "'log in' = fazer login, entrar em um sistema. Deriva de 'log' (registro)."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Quantas palavras têm a família '-og'?"
        correctAnswer: six
        rationale: "A família -og tem 6 palavras: bog, dog, fog, hog, jog, log."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'The ___ runs fast.' (animal doméstico)"
        correctAnswer: dog
        rationale: "'The dog runs fast.' — O cachorro corre rápido."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'fog' é um fenômeno climático. Qual é seu plural?"
        correctAnswer: fogs
        rationale: "'fogs' é o plural de 'fog'. Ex.: 'London fogs are famous.'"
        difficulty: 2
        objectives: [pre-A1.cvc.words]
target: 20
