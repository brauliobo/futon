title: 👋 English 5A - Frases simples — 'A ___ is ___'
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Primeiras frases descritivas com estrutura 'A ___ is ___'.
repeatAll: 2
example: "Ex.: 'A cat is big.' — Um gato é grande."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Estrutura 'A ___ is ___'
    description: Descreva objetos e animais com a estrutura básica.
    exercises:
      - type: english_vocab
        question: "Complete: 'A cat ___ big.' (verbo ser)"
        correctAnswer: is
        rationale: "'A cat is big.' — Um gato é grande. 'is' vai com 3ª pessoa singular."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'A dog is ___.' (o contrário de small)"
        correctAnswer: big
        rationale: "'A dog is big.' — Um cachorro é grande."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'A sun is ___.' (cor amarela e temperatura)"
        correctAnswer: hot
        rationale: "'A sun is hot.' — O sol é quente."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'A pig is ___.' (cor da pele do animal)"
        correctAnswer: pink
        rationale: "'A pig is pink.' — Um porco é rosa."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Um gato é um animal.' em inglês?
        correctAnswer: A cat is an animal.
        rationale: "'A cat is an animal.' — Note: 'an' antes de 'animal' pois começa com vogal."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Um livro é vermelho.' em inglês?
        correctAnswer: A book is red.
        rationale: "'A book is red.' — Estrutura: artigo + substantivo + is + adjetivo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Um ovo é branco.' em inglês?
        correctAnswer: An egg is white.
        rationale: "'An egg is white.' — Use 'an' antes de 'egg' (começa com vogal)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'A fish is ___.' (onde o peixe vive — no water)"
        correctAnswer: wet
        rationale: "'A fish is wet.' — Um peixe está molhado."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Uma bola é redonda.' em inglês?
        correctAnswer: A ball is round.
        rationale: "'A ball is round.' — round = redondo."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Um ônibus é grande.' em inglês?
        correctAnswer: A bus is big.
        rationale: "'A bus is big.' — Um ônibus é grande."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Variações da estrutura descritiva
    description: Expanda a estrutura com mais adjetivos e substantivos.
    exercises:
      - type: english_vocab
        question: Como se diz 'Um elefante é enorme.' em inglês?
        correctAnswer: An elephant is huge.
        rationale: "'An elephant is huge.' — 'an' antes de 'elephant' (vogal). 'huge' = enorme."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Uma cama é macia.' em inglês?
        correctAnswer: A bed is soft.
        rationale: "'A bed is soft.' — soft = macio."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'A lemon is ___.' (sabor)"
        correctAnswer: sour
        rationale: "'A lemon is sour.' — Um limão é azedo. sour = azedo."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'A rock is ___.' (textura)"
        correctAnswer: hard
        rationale: "'A rock is hard.' — Uma pedra é dura. hard = duro."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a estrutura das frases que você aprendeu nesta lição?
        correctAnswer: A + noun + is + adjective
        rationale: "A estrutura é: A + substantivo + is + adjetivo. Ex.: A cat is big."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Por que 'An egg' e não 'A egg'?
        correctAnswer: egg starts with a vowel
        rationale: "'egg' começa com vogal 'e', então usamos 'an' ao invés de 'a'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Uma ovelha é branca.' em inglês?
        correctAnswer: A sheep is white.
        rationale: "'A sheep is white.' — Uma ovelha é branca."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Complete: 'A sun is yellow and ___.' (temperatura)"
        correctAnswer: hot
        rationale: "'A sun is yellow and hot.' — O sol é amarelo e quente."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'Uma formiga é pequena.' em inglês?
        correctAnswer: An ant is small.
        rationale: "'An ant is small.' — 'an' antes de 'ant' (começa com vogal 'a')."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: "Crie uma frase com 'dog': 'A dog is ___.'"
        correctAnswer: friendly
        rationale: "'A dog is friendly.' — Um cachorro é amigável. Ou: big, fast, cute, etc."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
