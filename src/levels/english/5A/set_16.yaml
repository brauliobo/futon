title: 🔢 English 5A - Números 1–10 em inglês
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.numbers
authorNotes: Os números de 1 a 10 em inglês com palavras.
repeatAll: 2
example: "Ex.: '1' → one. '5' → five."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Números 1 a 5
    description: Aprenda a escrever os primeiros cinco números em inglês.
    exercises:
      - type: english_vocab
        question: Como se escreve o número 1 em inglês?
        correctAnswer: one
        rationale: "1 = one. O-N-E. Um/uma em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se escreve o número 2 em inglês?
        correctAnswer: two
        rationale: "2 = two. T-W-O. Dois em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se escreve o número 3 em inglês?
        correctAnswer: three
        rationale: "3 = three. T-H-R-E-E. Três em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se escreve o número 4 em inglês?
        correctAnswer: four
        rationale: "4 = four. F-O-U-R. Quatro em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se escreve o número 5 em inglês?
        correctAnswer: five
        rationale: "5 = five. F-I-V-E. Cinco em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: 'I have ___ hand(s).' (número de mãos)
        correctAnswer: two
        rationale: "'I have two hands.' — Eu tenho duas mãos."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: 'A cat has ___ legs.' (número de patas)
        correctAnswer: four
        rationale: "'A cat has four legs.' — Um gato tem quatro patas."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: 'I have ___ finger(s) on one hand.' (número)
        correctAnswer: five
        rationale: "'I have five fingers on one hand.' — Tenho cinco dedos em uma mão."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: 'A triangle has ___ sides.' (número de lados)
        correctAnswer: three
        rationale: "'A triangle has three sides.' — Um triângulo tem três lados."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: 'There is ___ sun.' (número de sóis)
        correctAnswer: one
        rationale: "'There is one sun.' — Há apenas um sol."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
  - pageNumber: 2
    title: Números 6 a 10
    description: Complete os números de um a dez.
    exercises:
      - type: english_vocab
        question: Como se escreve o número 6 em inglês?
        correctAnswer: six
        rationale: "6 = six. S-I-X. Seis em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se escreve o número 7 em inglês?
        correctAnswer: seven
        rationale: "7 = seven. S-E-V-E-N. Sete em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se escreve o número 8 em inglês?
        correctAnswer: eight
        rationale: "8 = eight. E-I-G-H-T. Oito em inglês. O 'gh' é mudo."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se escreve o número 9 em inglês?
        correctAnswer: nine
        rationale: "9 = nine. N-I-N-E. Nove em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Como se escreve o número 10 em inglês?
        correctAnswer: ten
        rationale: "10 = ten. T-E-N. Dez em inglês."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: 'A week has ___ days.' (número de dias)
        correctAnswer: seven
        rationale: "'A week has seven days.' — Uma semana tem sete dias."
        difficulty: 1
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: 'An octopus has ___ legs.' (número)
        correctAnswer: eight
        rationale: "'An octopus has eight legs.' — Um polvo tem oito pernas."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: 'I have ___ toes on both feet.' (dedos dos pés)
        correctAnswer: ten
        rationale: "'I have ten toes on both feet.' — Tenho dez dedos nos pés."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: Escreva os números de 1 a 10 em inglês em ordem
        correctAnswer: one two three four five six seven eight nine ten
        rationale: "1=one, 2=two, 3=three, 4=four, 5=five, 6=six, 7=seven, 8=eight, 9=nine, 10=ten."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
      - type: english_vocab
        question: 'A cat has ___ lives, they say.' (número)
        correctAnswer: nine
        rationale: "'A cat has nine lives, they say.' — Dizem que um gato tem nove vidas."
        difficulty: 2
        objectives: [pre-A1.vocab.numbers]
target: 20
