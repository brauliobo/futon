title: 🐠 English 5A - Animais simples (cat, dog, fish, bird, cow, pig, hen)
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.animals
authorNotes: Sete animais básicos com seus nomes e sons em inglês.
repeatAll: 2
example: "Ex.: 'gato' → cat. 'peixe' → fish."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Animais domésticos e da fazenda
    description: Aprenda os nomes de animais comuns em inglês.
    exercises:
      - type: english_vocab
        question: Como se diz 'gato' em inglês?
        correctAnswer: cat
        rationale: "'cat' = gato. C-A-T. Faz o som 'meow'."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Como se diz 'cachorro' em inglês?
        correctAnswer: dog
        rationale: "'dog' = cachorro. D-O-G. Faz o som 'woof'."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Como se diz 'peixe' em inglês?
        correctAnswer: fish
        rationale: "'fish' = peixe. F-I-S-H. Vive na água."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Como se diz 'pássaro' em inglês?
        correctAnswer: bird
        rationale: "'bird' = pássaro. B-I-R-D. Pode voar."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Como se diz 'vaca' em inglês?
        correctAnswer: cow
        rationale: "'cow' = vaca. C-O-W. Faz o som 'moo'."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Como se diz 'porco' em inglês?
        correctAnswer: pig
        rationale: "'pig' = porco. P-I-G. Faz o som 'oink'."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Como se diz 'galinha (fêmea)' em inglês?
        correctAnswer: hen
        rationale: "'hen' = galinha fêmea. H-E-N. Bota ovos."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: 'The ___ says moo.' (animal)
        correctAnswer: cow
        rationale: "'The cow says moo.' — A vaca faz 'moo'."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: 'The ___ can fly.' (animal)
        correctAnswer: bird
        rationale: "'The bird can fly.' — O pássaro pode voar."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: 'The ___ lays eggs.' (ave da fazenda)
        correctAnswer: hen
        rationale: "'The hen lays eggs.' — A galinha bota ovos."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
  - pageNumber: 2
    title: Animais em frases
    description: Use os animais em frases descritivas.
    exercises:
      - type: english_vocab
        question: 'The ___ lives in water.' (animal aquático)
        correctAnswer: fish
        rationale: "'The fish lives in water.' — O peixe vive na água."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: 'The ___ is pink.' (animal da fazenda)
        correctAnswer: pig
        rationale: "'The pig is pink.' — O porco é rosa."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: 'The ___ says woof.' (animal doméstico)
        correctAnswer: dog
        rationale: "'The dog says woof.' — O cachorro faz 'woof'."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Quantos animais você aprendeu nesta lição?
        correctAnswer: seven
        rationale: "Você aprendeu 7 animais: cat, dog, fish, bird, cow, pig, hen."
        difficulty: 1
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Quais animais desta lição são da fazenda?
        correctAnswer: cow, pig, hen
        rationale: "Cow (vaca), pig (porco), hen (galinha) são animais de fazenda."
        difficulty: 2
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Quais animais desta lição são domésticos?
        correctAnswer: cat, dog
        rationale: "Cat (gato) e dog (cachorro) são animais domésticos comuns."
        difficulty: 2
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Complete: 'I have a ___ and a ___.' (dois animais domésticos)
        correctAnswer: cat, dog
        rationale: "'I have a cat and a dog.' — Eu tenho um gato e um cachorro."
        difficulty: 2
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: 'The ___ is black and white.' (animal da fazenda — leite)
        correctAnswer: cow
        rationale: "'The cow is black and white.' — A vaca é preta e branca (Holstein)."
        difficulty: 2
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Qual animal voa mas não é um pássaro de casa? (dica: 'fish' não voa!)
        correctAnswer: bird
        rationale: "'bird' (pássaro) voa. O peixe (fish) nada, o gato (cat) e o cachorro (dog) correm."
        difficulty: 2
        objectives: [pre-A1.vocab.animals]
      - type: english_vocab
        question: Escreva os 7 animais que você aprendeu
        correctAnswer: cat, dog, fish, bird, cow, pig, hen
        rationale: "cat, dog, fish, bird, cow, pig, hen — sete animais!"
        difficulty: 2
        objectives: [pre-A1.vocab.animals]
target: 20
