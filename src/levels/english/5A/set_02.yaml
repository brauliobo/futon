title: 🐶 English 5A - Palavras CVC — família 'an' (can, fan, man, pan, ran, van)
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.cvc.words
authorNotes: Família de palavras CVC com '-an'. Todas rimam e têm o som /æn/.
repeatAll: 2
example: "Ex.: 'lata' → can. Todas as palavras terminam em '-an'."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Família '-an'
    description: Palavras CVC com o final '-an'.
    exercises:
      - type: english_vocab
        question: Como se diz 'lata/poder' em inglês?
        correctAnswer: can
        rationale: "'can' — lata ou poder (I can run). C-A-N."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'ventilador/fã' em inglês?
        correctAnswer: fan
        rationale: "'fan' — ventilador ou fã. F-A-N."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'homem' em inglês?
        correctAnswer: man
        rationale: "'man' — homem adulto. M-A-N."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'frigideira/panela' em inglês?
        correctAnswer: pan
        rationale: "'pan' — frigideira/panela rasa. P-A-N."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'correu' em inglês?
        correctAnswer: ran
        rationale: "'ran' — passado de 'run' (correr). R-A-N."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'van/furgão' em inglês?
        correctAnswer: van
        rationale: "'van' — van ou furgão. V-A-N."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Qual palavra da família '-an' significa 'correu'?
        correctAnswer: ran
        rationale: "'ran' é o passado de 'run'. R-A-N."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Qual palavra da família '-an' é um veículo?
        correctAnswer: van
        rationale: "'van' é um tipo de veículo — maior que um carro, menor que um caminhão."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: 'can', 'fan', 'man' — quantas letras cada uma?
        correctAnswer: three
        rationale: "Todas têm 3 letras: C-A-N, F-A-N, M-A-N."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Complete: 'The ___ can run.' (homem adulto)
        correctAnswer: man
        rationale: "'The man can run.' — O homem pode correr."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
  - pageNumber: 2
    title: Usando a família '-an'
    description: Use as palavras '-an' em frases simples.
    exercises:
      - type: english_vocab
        question: 'I ___ swim.' (posso/sou capaz de)
        correctAnswer: can
        rationale: "'I can swim.' — Eu posso nadar. 'can' expressa habilidade."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: 'The ___ is on the table.' (objeto para cozinhar)
        correctAnswer: pan
        rationale: "'The pan is on the table.' — A frigideira está na mesa."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: 'She ___ to school.' (passado de run/correr)
        correctAnswer: ran
        rationale: "'She ran to school.' — Ela correu para a escola."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Qual é a família '-an' completa? (6 palavras)
        correctAnswer: can, fan, man, pan, ran, van
        rationale: "A família -an: can, fan, man, pan, ran, van. Todas rimam!"
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: 'The ___ is very hot today.' (aparelho de resfriamento)
        correctAnswer: fan
        rationale: "'The fan is very hot today.' — O ventilador está muito quente hoje."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Complete: 'A ___ is a type of vehicle.' (furgão)
        correctAnswer: van
        rationale: "'A van is a type of vehicle.' — Uma van é um tipo de veículo."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Qual é a diferença entre 'can' (verbo) e 'can' (objeto)?
        correctAnswer: ability vs container
        rationale: "'can' verbo = posso/sou capaz. 'can' substantivo = lata/recipiente."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Qual vogal têm todas as palavras da família '-an'?
        correctAnswer: a
        rationale: "A vogal é 'a' (som /æ/) em todas: can, fan, man, pan, ran, van."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: 'ran' é o passado de qual verbo?
        correctAnswer: run
        rationale: "'ran' é o passado irregular de 'run' (correr). I run → I ran."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Complete a rima: 'The man with the fan ran to the ___.' (veículo)
        correctAnswer: van
        rationale: "'The man with the fan ran to the van.' — Todas rimam: man, fan, ran, van!"
        difficulty: 2
        objectives: [pre-A1.cvc.words]
target: 20
