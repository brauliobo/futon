title: 🍳 English 5A - Palavras CVC — família 'ot' (dot, got, hot, lot, not, pot)
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.cvc.words
authorNotes: Família CVC com '-ot'. Todas têm som /ɒt/.
repeatAll: 2
example: "Ex.: 'quente' → hot. Todas terminam em '-ot'."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Família '-ot'
    description: Palavras CVC com o final '-ot'.
    exercises:
      - type: english_vocab
        question: Como se diz 'quente' em inglês?
        correctAnswer: hot
        rationale: "'hot' — quente. H-O-T. Família '-ot'."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'panela' em inglês?
        correctAnswer: pot
        rationale: "'pot' — panela. P-O-T. Rima com hot."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'não' em inglês?
        correctAnswer: not
        rationale: "'not' — não (negação). N-O-T."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'ponto/pinta' em inglês?
        correctAnswer: dot
        rationale: "'dot' — ponto/pinta. D-O-T."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'conseguiu/pegou' em inglês?
        correctAnswer: got
        rationale: "'got' — passado de 'get' (conseguir/pegar). G-O-T."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Como se diz 'muito/lote' em inglês?
        correctAnswer: lot
        rationale: "'lot' — muito, grande quantidade. L-O-T. 'A lot' = muito."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Complete: 'The soup is ___.' (temperatura alta)
        correctAnswer: hot
        rationale: "'The soup is hot.' — A sopa está quente."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Complete: 'I like it a ___.' (muito)
        correctAnswer: lot
        rationale: "'I like it a lot.' — Eu gosto muito disso."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Complete: 'She is ___ here.' (ausência/negação)
        correctAnswer: not
        rationale: "'She is not here.' — Ela não está aqui."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Qual vogal têm todas as palavras da família '-ot'?
        correctAnswer: o
        rationale: "A vogal é 'o' (som /ɒ/ curto) em todas: dot, got, hot, lot, not, pot."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
  - pageNumber: 2
    title: Usando a família '-ot'
    description: Pratique as palavras '-ot' em contexto.
    exercises:
      - type: english_vocab
        question: 'I cook in a ___.' (objeto de cozinha)
        correctAnswer: pot
        rationale: "'I cook in a pot.' — Eu cozinho em uma panela."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: 'She ___ a new book.' (passado de 'get')
        correctAnswer: got
        rationale: "'She got a new book.' — Ela ganhou/pegou um livro novo."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Qual é a família '-ot' completa?
        correctAnswer: dot, got, hot, lot, not, pot
        rationale: "A família -ot: dot, got, hot, lot, not, pot. Todas têm /ɒt/."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: 'got' é o passado de qual verbo?
        correctAnswer: get
        rationale: "'got' é o passado irregular de 'get' (conseguir/obter)."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Complete: 'It is ___ or cold?' (temperatura)
        correctAnswer: hot
        rationale: "'Is it hot or cold?' — Está quente ou frio?"
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: 'not' é usado para formar frases negativas. Ex.: 'I am ___ a dog.'
        correctAnswer: not
        rationale: "'I am not a dog.' — Eu não sou um cachorro. 'not' = negação."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Complete a rima: 'A ___ in a ___.' (ponto/panela)
        correctAnswer: dot, pot
        rationale: "'A dot in a pot.' — Um ponto em uma panela. dot e pot rimam!"
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Qual é o oposto de 'hot'?
        correctAnswer: cold
        rationale: "'cold' (frio) é o oposto de 'hot' (quente)."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: Quantas palavras têm a família '-ot'?
        correctAnswer: six
        rationale: "A família -ot tem 6 palavras: dot, got, hot, lot, not, pot."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: 'a lot' significa o quê em português?
        correctAnswer: muito
        rationale: "'a lot' = muito. 'I like it a lot' = Eu gosto muito disso."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
target: 20
