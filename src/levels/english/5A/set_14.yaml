title: 🐾 English 5A - Frases simples — 'The ___ can ___'
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.phrases
authorNotes: Frases com 'can' expressando habilidade de animais e pessoas.
repeatAll: 2
example: "Ex.: 'The dog can run.' — O cachorro pode correr."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Estrutura 'The ___ can ___'
    description: Use 'can' para expressar o que animais e pessoas podem fazer.
    exercises:
      - type: english_vocab
        question: Complete: 'The dog can ___.' (o que cães fazem bem)
        correctAnswer: run
        rationale: "'The dog can run.' — O cachorro pode correr."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The bird can ___.' (o que pássaros fazem)
        correctAnswer: fly
        rationale: "'The bird can fly.' — O pássaro pode voar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The fish can ___.' (o que peixes fazem)
        correctAnswer: swim
        rationale: "'The fish can swim.' — O peixe pode nadar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The frog can ___.' (o que sapos fazem)
        correctAnswer: jump
        rationale: "'The frog can jump.' — O sapo pode pular."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O gato pode pular.' em inglês?
        correctAnswer: The cat can jump.
        rationale: "'The cat can jump.' — estrutura: The + animal + can + verb."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O menino pode correr.' em inglês?
        correctAnswer: The boy can run.
        rationale: "'The boy can run.' — O menino pode correr."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'A menina pode cantar.' em inglês?
        correctAnswer: The girl can sing.
        rationale: "'The girl can sing.' — A menina pode cantar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O pato pode nadar.' em inglês?
        correctAnswer: The duck can swim.
        rationale: "'The duck can swim.' — O pato pode nadar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: 'can' expressa qual ideia em inglês?
        correctAnswer: ability
        rationale: "'can' expressa habilidade/capacidade. I can run = Eu sei/posso correr."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O elefante pode andar.' em inglês?
        correctAnswer: The elephant can walk.
        rationale: "'The elephant can walk.' — O elefante pode/sabe andar."
        difficulty: 1
        objectives: [pre-A1.phrases]
  - pageNumber: 2
    title: Negativa e perguntas com 'can'
    description: Use 'can't' para negar e aprenda a estrutura básica.
    exercises:
      - type: english_vocab
        question: Como se diz 'O porco não pode voar.' em inglês?
        correctAnswer: The pig can't fly.
        rationale: "'The pig can't fly.' — 'can't' = cannot (negativo de can)."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The cat ___ swim.' (negativa — gatos não nadam bem)
        correctAnswer: can't
        rationale: "'The cat can't swim.' — O gato não (sabe) nadar bem."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O peixe não pode voar.' em inglês?
        correctAnswer: The fish can't fly.
        rationale: "'The fish can't fly.' — O peixe não pode voar."
        difficulty: 1
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: 'can't' é a contração de qual expressão?
        correctAnswer: cannot
        rationale: "'can't' = cannot. A forma completa é 'cannot'."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual é a estrutura das frases negativas com 'can'?
        correctAnswer: The + noun + can't + verb
        rationale: "The + substantivo + can't + verbo. Ex.: The pig can't fly."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O cachorro pode comer?' (pergunta)
        correctAnswer: Can the dog eat?
        rationale: "'Can the dog eat?' — Para perguntas, 'can' vem antes do sujeito."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: '___ the bird fly? Yes, it ___.' (pergunta/resposta)
        correctAnswer: Can, can
        rationale: "'Can the bird fly? Yes, it can.' — O pássaro pode voar? Sim, pode."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Como se diz 'O leão pode rugir.' em inglês?
        correctAnswer: The lion can roar.
        rationale: "'The lion can roar.' — O leão pode rugir. 'roar' = rugir."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Complete: 'The snake ___ walk.' (negativa — cobras não têm pernas)
        correctAnswer: can't
        rationale: "'The snake can't walk.' — A cobra não pode andar."
        difficulty: 2
        objectives: [pre-A1.phrases]
      - type: english_vocab
        question: Qual verbo segue 'can' — no infinitivo com ou sem 'to'?
        correctAnswer: without to
        rationale: "Após 'can', o verbo vai sem 'to'. 'I can run' (não 'I can to run')."
        difficulty: 2
        objectives: [pre-A1.phrases]
target: 20
