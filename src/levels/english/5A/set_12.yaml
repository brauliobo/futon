title: 👁️ English 5A - Palavras de visão — it, at, am, an, as
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.sight.words
authorNotes: Mais sight words básicas muito frequentes em inglês.
repeatAll: 2
example: "Ex.: 'it' → pronome para objetos. 'am' → verbo ser (I am)."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Pronomes e verbos essenciais
    description: Sight words usadas em quase toda frase em inglês.
    exercises:
      - type: english_vocab
        question: Como se diz 'ele/ela' para objetos e animais em inglês?
        correctAnswer: it
        rationale: "'it' — pronome neutro para objetos e animais. It is a cat."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se escreve 'em/no/na' para locais em inglês?
        correctAnswer: at
        rationale: "'at' — preposição de lugar/tempo. I am at school. At 3 o'clock."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se escreve o verbo 'ser/estar' para 'eu' (I) em inglês?
        correctAnswer: am
        rationale: "'am' — verbo to be para 'I'. I am happy. I am a student."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se escreve o artigo indefinido antes de vogal em inglês?
        correctAnswer: an
        rationale: "'an' — artigo indefinido antes de vogal. An apple, an egg, an igloo."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Como se escreve 'como/enquanto/assim como' em inglês?
        correctAnswer: as
        rationale: "'as' — comparação ou função. As big as. As a teacher."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: '___ is a big cat.' (pronome para objeto/animal)
        correctAnswer: It
        rationale: "'It is a big cat.' — É um gato grande. 'it' para animais e objetos."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I ___ happy.' (verbo ser, 1ª pessoa)
        correctAnswer: am
        rationale: "'I am happy.' — Eu estou feliz. 'am' é usado com 'I'."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I am ___ school.' (preposição de lugar)
        correctAnswer: at
        rationale: "'I am at school.' — Estou na escola. 'at' = preposição de localização."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'I have ___ orange.' (artigo indefinido antes de vogal)
        correctAnswer: an
        rationale: "'I have an orange.' — Eu tenho uma laranja. 'an' antes de vogal."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: 'She works ___ a teacher.' (função/profissão)
        correctAnswer: as
        rationale: "'She works as a teacher.' — Ela trabalha como professora."
        difficulty: 1
        objectives: [pre-A1.sight.words]
  - pageNumber: 2
    title: Usando it, at, am, an, as
    description: Pratique as sight words em frases variadas.
    exercises:
      - type: english_vocab
        question: 'I ___ a student.' (verbo ser)
        correctAnswer: am
        rationale: "'I am a student.' — Eu sou um estudante. 'am' vai com 'I'."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: '___ is hot today.' (sobre o tempo/temperatura)
        correctAnswer: It
        rationale: "'It is hot today.' — Está quente hoje. 'it' para condições climáticas."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: 'Look ___ the bird!' (preposição — olhar para)
        correctAnswer: at
        rationale: "'Look at the bird!' — Olhe para o pássaro! 'look at' = olhar para."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: '___ elephant is big.' (artigo antes de vogal)
        correctAnswer: An
        rationale: "'An elephant is big.' — Um elefante é grande. 'an' antes de 'e' (vogal)."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: 'She is ___ tall ___ a tree.' (comparação)
        correctAnswer: as, as
        rationale: "'She is as tall as a tree.' — Ela é tão alta quanto uma árvore."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Qual é a diferença entre 'in' e 'at' para locais?
        correctAnswer: in = inside, at = at a place
        rationale: "'in' = dentro (in the box). 'at' = em um lugar (at school, at home)."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Complete: '___ is a beautiful day.' (pronome para clima)
        correctAnswer: It
        rationale: "'It is a beautiful day.' — É um dia lindo. 'it' para condições."
        difficulty: 1
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: 'I am ___ home.' (preposição)
        correctAnswer: at
        rationale: "'I am at home.' — Estou em casa. 'at home' é expressão fixa."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: Quantas sight words você aprendeu em set_11 e set_12 juntos?
        correctAnswer: ten
        rationale: "Set 11: the, a, is, in, on. Set 12: it, at, am, an, as. Total = 10 sight words."
        difficulty: 2
        objectives: [pre-A1.sight.words]
      - type: english_vocab
        question: '___ umbrella is red.' (artigo antes de vogal)
        correctAnswer: An
        rationale: "'An umbrella is red.' — Um guarda-chuva é vermelho. 'an' antes de 'u' (vogal)."
        difficulty: 2
        objectives: [pre-A1.sight.words]
target: 20
