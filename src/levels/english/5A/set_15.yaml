title: 🎨 English 5A - Cores básicas (red, blue, green, yellow, black, white)
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.colors
authorNotes: As seis cores básicas em inglês, aplicadas a objetos do cotidiano.
repeatAll: 2
example: "Ex.: 'vermelho' → red. The apple is red."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Cores primárias e básicas
    description: Aprenda as cores mais importantes em inglês.
    exercises:
      - type: english_vocab
        question: Como se diz 'vermelho' em inglês?
        correctAnswer: red
        rationale: "'red' = vermelho. The apple is red. Maçãs são vermelhas."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'azul' em inglês?
        correctAnswer: blue
        rationale: "'blue' = azul. The sky is blue. O céu é azul."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'verde' em inglês?
        correctAnswer: green
        rationale: "'green' = verde. The grass is green. A grama é verde."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'amarelo' em inglês?
        correctAnswer: yellow
        rationale: "'yellow' = amarelo. The sun is yellow. O sol é amarelo."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'preto' em inglês?
        correctAnswer: black
        rationale: "'black' = preto. The night is black. A noite é preta."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Como se diz 'branco' em inglês?
        correctAnswer: white
        rationale: "'white' = branco. The snow is white. A neve é branca."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: 'The grass is ___.' (cor)
        correctAnswer: green
        rationale: "'The grass is green.' — A grama é verde."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: 'The sky is ___.' (cor)
        correctAnswer: blue
        rationale: "'The sky is blue.' — O céu é azul."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: 'The sun is ___.' (cor)
        correctAnswer: yellow
        rationale: "'The sun is yellow.' — O sol é amarelo."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: 'The snow is ___.' (cor)
        correctAnswer: white
        rationale: "'The snow is white.' — A neve é branca."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
  - pageNumber: 2
    title: Cores em frases e combinações
    description: Use as cores para descrever objetos.
    exercises:
      - type: english_vocab
        question: 'The apple is ___.' (cor da fruta)
        correctAnswer: red
        rationale: "'The apple is red.' — A maçã é vermelha."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: 'The night is ___.' (cor)
        correctAnswer: black
        rationale: "'The night is black.' — A noite é preta."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Qual cor tem 'red + blue'? (mistura)
        correctAnswer: purple
        rationale: "Vermelho + azul = roxo (purple). Mas 'purple' aprenderemos depois!"
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Qual cor é o oposto de 'black'?
        correctAnswer: white
        rationale: "'white' (branco) é o oposto de 'black' (preto)."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: 'A ___ ball' — qual cor é típica de bolas de futebol americano?
        correctAnswer: brown
        rationale: "Bolas de futebol americano são marrons (brown). 'brown' aprenderemos depois."
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Complete: 'I see a ___ cat.' (cor oposta de white)
        correctAnswer: black
        rationale: "'I see a black cat.' — Eu vejo um gato preto."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Complete: 'She has ___ eyes.' (cor dos olhos — como o céu)
        correctAnswer: blue
        rationale: "'She has blue eyes.' — Ela tem olhos azuis."
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Quantas cores básicas você aprendeu nesta lição?
        correctAnswer: six
        rationale: "Você aprendeu 6 cores: red, blue, green, yellow, black, white."
        difficulty: 1
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Complete: 'The frog is ___.' (cor do anfíbio)
        correctAnswer: green
        rationale: "'The frog is green.' — O sapo é verde."
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
      - type: english_vocab
        question: Escreva as 6 cores básicas que você aprendeu
        correctAnswer: red, blue, green, yellow, black, white
        rationale: "As 6 cores: red (vermelho), blue (azul), green (verde), yellow (amarelo), black (preto), white (branco)."
        difficulty: 2
        objectives: [pre-A1.vocab.colors]
target: 20
