title: 🐷 English 5A - Palavras CVC — família 'ig' (big, dig, fig, pig, rig, wig)
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.cvc.words
authorNotes: Família CVC com '-ig'. Todas têm som /ɪg/.
repeatAll: 2
example: "Ex.: 'porco' → pig. Todas terminam em '-ig'."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Família '-ig'
    description: "Palavras CVC com o final '-ig'."
    exercises:
      - type: english_vocab
        question: "Como se diz 'grande' em inglês?"
        correctAnswer: big
        rationale: "'big' — grande. B-I-G. Família '-ig'."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'porco' em inglês?"
        correctAnswer: pig
        rationale: "'pig' — porco. P-I-G. Rima com big."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'cavar' em inglês?"
        correctAnswer: dig
        rationale: "'dig' — cavar. D-I-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'figo (fruta)' em inglês?"
        correctAnswer: fig
        rationale: "'fig' — figo (fruta). F-I-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'aparato/plataforma' em inglês?"
        correctAnswer: rig
        rationale: "'rig' — aparato ou plataforma de petróleo. R-I-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'peruca' em inglês?"
        correctAnswer: wig
        rationale: "'wig' — peruca. W-I-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual palavra da família '-ig' é um animal da fazenda?"
        correctAnswer: pig
        rationale: "'pig' (porco) é um animal da fazenda. P-I-G."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual palavra da família '-ig' é o oposto de 'small'?"
        correctAnswer: big
        rationale: "'big' (grande) é o oposto de 'small' (pequeno)."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'The ___ is pink.' (animal)"
        correctAnswer: pig
        rationale: "'The pig is pink.' — O porco é rosa."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'That is a ___ dog!' (tamanho)"
        correctAnswer: big
        rationale: "'That is a big dog!' — Aquele é um cachorro grande!"
        difficulty: 1
        objectives: [pre-A1.cvc.words]
  - pageNumber: 2
    title: Usando a família '-ig'
    description: "Pratique as palavras '-ig' em contexto."
    exercises:
      - type: english_vocab
        question: "'Dogs ___ holes in the garden.' (cavar)"
        correctAnswer: dig
        rationale: "'Dogs dig holes in the garden.' — Cães cavam buracos no jardim."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'She wears a ___ for the show.' (cabelo falso)"
        correctAnswer: wig
        rationale: "'She wears a wig for the show.' — Ela usa uma peruca para o show."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual é a família '-ig' completa?"
        correctAnswer: big, dig, fig, pig, rig, wig
        rationale: "A família -ig: big, dig, fig, pig, rig, wig. Todas têm /ɪg/."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual vogal têm todas as palavras da família '-ig'?"
        correctAnswer: i
        rationale: "A vogal é 'i' (som /ɪ/ curto) em todas: big, dig, fig, pig, rig, wig."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete a rima: 'The ___ ___ wore a ___.' (animal/tamanho/cabelo falso)"
        correctAnswer: big pig wig
        rationale: "'The big pig wore a wig.' — O porco grande usava uma peruca! Todas rimam."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "A família '-ig' rima com a família '-ed'?"
        correctAnswer: no
        rationale: "Não! '-ig' tem som /ɪg/ (pig, big). '-ed' tem som /ɛd/ (bed, red)."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'fig' é uma fruta. Qual é a forma plural?"
        correctAnswer: figs
        rationale: "'figs' é o plural de 'fig'. Adicionamos '-s' para a maioria dos plurais."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'The elephant is ___.' (enorme/grande)"
        correctAnswer: big
        rationale: "'The elephant is big.' — O elefante é grande."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Quantas palavras têm a família '-ig'?"
        correctAnswer: six
        rationale: "A família -ig tem 6 palavras: big, dig, fig, pig, rig, wig."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'dig' é verbo. Qual é o seu significado em português?"
        correctAnswer: cavar
        rationale: "'dig' = cavar (buraco no solo). Dogs dig holes."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
target: 20
