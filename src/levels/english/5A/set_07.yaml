title: 🌙 English 5A - Palavras CVC — família 'up' (cup, cut, gut, hut, nut, put)
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.cvc.words
authorNotes: Família CVC com '-ut'/'-up' e som /ʌ/. Inclui cup, cut, gut, hut, nut, put.
repeatAll: 2
example: "Ex.: 'xícara' → cup. Palavras com vogal 'u' curta."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: "Família '-up' e '-ut'"
    description: "Palavras CVC com vogal 'u' curta."
    exercises:
      - type: english_vocab
        question: "Como se diz 'xícara/copo' em inglês?"
        correctAnswer: cup
        rationale: "'cup' — xícara ou copo. C-U-P."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'cortar' em inglês?"
        correctAnswer: cut
        rationale: "'cut' — cortar. C-U-T."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'barriga/intestino' em inglês?"
        correctAnswer: gut
        rationale: "'gut' — barriga/intestino ou coragem (guts = coragem). G-U-T."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'cabana' em inglês?"
        correctAnswer: hut
        rationale: "'hut' — cabana pequena. H-U-T."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'noz' em inglês?"
        correctAnswer: nut
        rationale: "'nut' — noz ou parafuso. N-U-T."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Como se diz 'colocar' em inglês?"
        correctAnswer: put
        rationale: "'put' — colocar/pôr. P-U-T."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'I drink tea from a ___.' (objeto)"
        correctAnswer: cup
        rationale: "'I drink tea from a cup.' — Eu bebo chá de uma xícara."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'Please ___ it on the table.' (colocar)"
        correctAnswer: put
        rationale: "'Please put it on the table.' — Por favor, coloque na mesa."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual vogal têm todas essas palavras: cup, cut, gut, hut, nut, put?"
        correctAnswer: u
        rationale: "A vogal é 'u' (som /ʌ/ curto) em todas."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: 'I eat a ___.' (alimento — semente/fruta seca)"
        correctAnswer: nut
        rationale: "'I eat a nut.' — Eu como uma noz."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
  - pageNumber: 2
    title: "Usando palavras com 'u' curto"
    description: "Pratique as palavras com 'u' curto em contexto."
    exercises:
      - type: english_vocab
        question: "'She ___ the cake.' (cortou)"
        correctAnswer: cut
        rationale: "'She cut the cake.' — Ela cortou o bolo."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'They live in a small ___.' (moradia simples)"
        correctAnswer: hut
        rationale: "'They live in a small hut.' — Eles moram em uma cabana pequena."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual palavra significa 'colocar'?"
        correctAnswer: put
        rationale: "'put' = colocar. Put it here = Coloque aqui."
        difficulty: 1
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'pup' e 'cup' rimam? (pup = filhote)"
        correctAnswer: yes
        rationale: "Sim! 'pup' e 'cup' rimam — ambos têm /ʌp/."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete a rima: 'A ___ in a ___.' (noz/xícara)"
        correctAnswer: nut, cup
        rationale: "'A nut in a cup.' — Uma noz em uma xícara. nut e cup — família 'u'!"
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'cut', 'but', 'hut', 'nut', 'gut' — qual é a vogal delas?"
        correctAnswer: u
        rationale: "Todas têm a vogal 'u' com som /ʌ/ curto."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "'put' tem som de /ʊ/ como 'book' ou /ʌ/ como 'cup'?"
        correctAnswer: /ʊ/ like book
        rationale: "'put' tem o som /ʊ/ (como 'book', 'foot'), não /ʌ/ de 'cup'. É uma exceção!"
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual é o plural de 'nut'?"
        correctAnswer: nuts
        rationale: "'nuts' é o plural de 'nut'. 'I eat nuts every day.'"
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Complete: '___ the book on the shelf.' (imperativo de colocar)"
        correctAnswer: Put
        rationale: "'Put the book on the shelf.' — Coloque o livro na prateleira."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
      - type: english_vocab
        question: "Qual palavra significa tanto 'cortar' quanto 'ferida'?"
        correctAnswer: cut
        rationale: "'cut' é verbo (cortar) e substantivo (corte/ferida). I cut my finger."
        difficulty: 2
        objectives: [pre-A1.cvc.words]
target: 20
