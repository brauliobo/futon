title: 📦 English 5A - Objetos simples (ball, book, box, bag, cup, pen, key)
level: 5A
subject: english
difficulty: 1
objectives:
  - pre-A1.vocab.objects
authorNotes: Objetos do cotidiano que aparecem frequentemente em frases básicas.
repeatAll: 2
example: "Ex.: 'bola' → ball. 'chave' → key."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Objetos do dia a dia — parte 1
    description: Aprenda os nomes de objetos comuns em inglês.
    exercises:
      - type: english_vocab
        question: "Como se diz 'bola' em inglês?"
        correctAnswer: ball
        rationale: "'ball' = bola. B-A-L-L."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "Como se diz 'livro' em inglês?"
        correctAnswer: book
        rationale: "'book' = livro. B-O-O-K."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "Como se diz 'caixa' em inglês?"
        correctAnswer: box
        rationale: "'box' = caixa. B-O-X."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "Como se diz 'bolsa/sacola' em inglês?"
        correctAnswer: bag
        rationale: "'bag' = bolsa ou sacola. B-A-G."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "Como se diz 'xícara/copo' em inglês?"
        correctAnswer: cup
        rationale: "'cup' = xícara ou copo. C-U-P."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "Como se diz 'caneta' em inglês?"
        correctAnswer: pen
        rationale: "'pen' = caneta. P-E-N."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "Como se diz 'chave' em inglês?"
        correctAnswer: key
        rationale: "'key' = chave. K-E-Y."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "'I write with a ___.' (instrumento)"
        correctAnswer: pen
        rationale: "'I write with a pen.' — Eu escrevo com uma caneta."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "'I open the door with a ___.' (objeto)"
        correctAnswer: key
        rationale: "'I open the door with a key.' — Abro a porta com uma chave."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "'I put my things in a ___.' (recipiente para carregar)"
        correctAnswer: bag
        rationale: "'I put my things in a bag.' — Coloco minhas coisas em uma bolsa."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
  - pageNumber: 2
    title: Objetos em frases
    description: Use os objetos em frases simples.
    exercises:
      - type: english_vocab
        question: "'The ___ is on the shelf.' (objeto para ler)"
        correctAnswer: book
        rationale: "'The book is on the shelf.' — O livro está na prateleira."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "'The cat is in the ___.' (recipiente/caixa)"
        correctAnswer: box
        rationale: "'The cat is in the box.' — O gato está na caixa."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "'I drink from a ___.' (utensílio)"
        correctAnswer: cup
        rationale: "'I drink from a cup.' — Eu bebo de uma xícara."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "'The ___ is round.' (objeto de brincar)"
        correctAnswer: ball
        rationale: "'The ball is round.' — A bola é redonda."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: Quantos objetos você aprendeu nesta lição?
        correctAnswer: seven
        rationale: "Você aprendeu 7 objetos: ball, book, box, bag, cup, pen, key."
        difficulty: 1
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "Qual objeto começa com 'b' e serve para ler?"
        correctAnswer: book
        rationale: "'book' (livro) começa com 'b' e serve para ler."
        difficulty: 2
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "Quais objetos desta lição começam com a letra 'b'?"
        correctAnswer: ball, book, box, bag
        rationale: "Ball (bola), book (livro), box (caixa), bag (bolsa) — todos começam com 'b'!"
        difficulty: 2
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "'She has a ___ in her hand.' (objeto para escrever)"
        correctAnswer: pen
        rationale: "'She has a pen in her hand.' — Ela tem uma caneta na mão."
        difficulty: 2
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: "'The ___ opens the lock.' (objeto metálico)"
        correctAnswer: key
        rationale: "'The key opens the lock.' — A chave abre a fechadura."
        difficulty: 2
        objectives: [pre-A1.vocab.objects]
      - type: english_vocab
        question: Escreva os 7 objetos que você aprendeu
        correctAnswer: ball, book, box, bag, cup, pen, key
        rationale: "ball, book, box, bag, cup, pen, key — sete objetos cotidianos!"
        difficulty: 2
        objectives: [pre-A1.vocab.objects]
target: 20
