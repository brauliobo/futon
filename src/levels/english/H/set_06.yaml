title: English H - Would (Requests, Preferences, Hypotheticals)
level: H
subject: english
difficulty: 3
objectives:
  - B1.grammar.modals_would
authorNotes: Would for polite requests, preferences, hypothetical present/future, and past habits.
repeatAll: 2
example: Você gostaria de um café? → Would you like a coffee?
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Polite Requests & Preferences
    description: "'Would like' / 'Would you like …?' and 'would rather'."
    exercises:
      - type: english_phrases
        question: Você gostaria de um café?
        correctAnswer: Would you like a coffee
        rationale: "'Would you like?' = oferta educada. 'A coffee' (uma xícara)."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Eu gostaria de saber
        correctAnswer: I would like to know
        rationale: "'Would like to + base' — 'to know' (infinitivo)."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Ela gostaria de ir
        correctAnswer: She would like to go
        rationale: "'Would like to go' — 'would' invariável. 'To' + base."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Gostaríamos de reservar uma mesa
        correctAnswer: We would like to book a table
        rationale: "'Book a table' = reservar mesa. 'Would like to' (educado)."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Eu prefiro ficar em casa
        correctAnswer: I would rather stay home
        rationale: "'Would rather' + base (sem 'to'). 'Stay home' fixo."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Ele prefere não comentar
        correctAnswer: He would rather not comment
        rationale: "'Would rather not' — 'not' antes do verbo. 'Comment' base."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Você prefere chá ou café?
        correctAnswer: Would you rather have tea or coffee
        rationale: "'Would you rather have?' — escolha. 'Tea or coffee' sem artigo."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Eu prefiro caminhar
        correctAnswer: I would rather walk
        rationale: "'Would rather walk' — base sem 'to'. Preferência imediata."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Poderia me passar o sal?
        correctAnswer: Would you pass me the salt
        rationale: "'Would you pass me?' — pedido educado. 'The salt' específico."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Poderia esperar um momento?
        correctAnswer: Would you wait a moment
        rationale: "'Would you wait?' — pedido formal. 'A moment' indefinido."
        difficulty: 2
        objectives: [B1.grammar.modals_would]
  - pageNumber: 2
    title: Hypothetical and Past Habits
    description: Would for imagined situations and repeated past actions.
    exercises:
      - type: english_phrases
        question: Eu compraria se pudesse
        correctAnswer: I would buy it if I could
        rationale: "2º condicional: 'would + base' + 'if + past'. 'Could' (past de can)."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Ela ficaria feliz
        correctAnswer: She would be happy
        rationale: "'Would be happy' — 'happy' adjetivo exige 'be'. Hipotético."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Eu diria a verdade
        correctAnswer: I would tell the truth
        rationale: "'Tell the truth' = dizer a verdade (expressão fixa com 'the')."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Nós não faríamos isso
        correctAnswer: We would not do that
        rationale: "'Would not do' = não faríamos. Contração: 'wouldn't'."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Ele viria se soubesse
        correctAnswer: He would come if he knew
        rationale: "2º condicional: 'would come' + 'if he knew' (past de know)."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Quando criança, eu jogava futebol
        correctAnswer: As a child I would play soccer
        rationale: "'Would play' = hábito passado. 'As a child' = quando criança."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Aos domingos, eles visitavam a avó
        correctAnswer: On sundays they would visit grandma
        rationale: "'Would visit' = hábito passado. 'On Sundays' (plural, dias)."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Eu caminharia todo dia
        correctAnswer: I would walk every day
        rationale: "'Would walk' = hábito. 'Every day' (dois termos, não 'everyday')."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: O que você faria?
        correctAnswer: What would you do
        rationale: "'What would you do?' — Wh + would + sujeito + base hipotético."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
      - type: english_phrases
        question: Como você reagiria?
        correctAnswer: How would you react
        rationale: "'How would you react?' — 'react' na base. Pergunta hipotética."
        difficulty: 3
        objectives: [B1.grammar.modals_would]
target: 20
