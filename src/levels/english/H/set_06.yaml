title: English H - Would (Requests, Preferences, Hypotheticals)
level: H
subject: english
difficulty: 3
objectives: [B1.grammar.modals_would]
authorNotes: Would for polite requests, preferences, hypothetical present/future, and past habits.
repeatAll: 2
example: "Você gostaria de um café? → Would you like a coffee?"
pages:
  - pageNumber: 1
    title: Polite Requests & Preferences
    description: "'Would like' / 'Would you like …?' and 'would rather'."
    exercises:
      - { type: english_phrases, question: "Você gostaria de um café?", correctAnswer: would you like a coffee }
      - { type: english_phrases, question: "Eu gostaria de saber", correctAnswer: i would like to know }
      - { type: english_phrases, question: "Ela gostaria de ir", correctAnswer: she would like to go }
      - { type: english_phrases, question: "Gostaríamos de reservar uma mesa", correctAnswer: we would like to book a table }
      - { type: english_phrases, question: "Eu prefiro ficar em casa", correctAnswer: i would rather stay home }
      - { type: english_phrases, question: "Ele prefere não comentar", correctAnswer: he would rather not comment }
      - { type: english_phrases, question: "Você prefere chá ou café?", correctAnswer: would you rather have tea or coffee }
      - { type: english_phrases, question: "Eu prefiro caminhar", correctAnswer: i would rather walk }
      - { type: english_phrases, question: "Poderia me passar o sal?", correctAnswer: would you pass me the salt }
      - { type: english_phrases, question: "Poderia esperar um momento?", correctAnswer: would you wait a moment }
  - pageNumber: 2
    title: Hypothetical and Past Habits
    description: Would for imagined situations and repeated past actions.
    exercises:
      - { type: english_phrases, question: "Eu compraria se pudesse", correctAnswer: i would buy it if i could }
      - { type: english_phrases, question: "Ela ficaria feliz", correctAnswer: she would be happy }
      - { type: english_phrases, question: "Eu diria a verdade", correctAnswer: i would tell the truth }
      - { type: english_phrases, question: "Nós não faríamos isso", correctAnswer: we would not do that }
      - { type: english_phrases, question: "Ele viria se soubesse", correctAnswer: he would come if he knew }
      - { type: english_phrases, question: "Quando criança, eu jogava futebol", correctAnswer: as a child i would play soccer }
      - { type: english_phrases, question: "Aos domingos, eles visitavam a avó", correctAnswer: on sundays they would visit grandma }
      - { type: english_phrases, question: "Eu caminharia todo dia", correctAnswer: i would walk every day }
      - { type: english_phrases, question: "O que você faria?", correctAnswer: what would you do }
      - { type: english_phrases, question: "Como você reagiria?", correctAnswer: how would you react }
target: 20
