title: "✏️ English H - Collocations: Make, Do, Have, Take"
level: H
subject: english
difficulty: 3
objectives:
  - B1.vocabulary.collocations_verbs
authorNotes: High-frequency B1+ collocations with make, do, have, take. Students must recall which verb collocates with each noun.
repeatAll: 2
example: "Ex.: 'Tomar uma decisão' → Make a decision."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Make & Do Collocations
    description: "'Make' = create/produce; 'do' = activities/tasks. Many exceptions must be memorised."
    exercises:
      - type: english_phrases
        question: tomar uma decisão
        correctAnswer: Make a decision
        rationale: "'Make a decision' = tomar/fazer uma decisão. NÃO 'do a decision'."
        difficulty: 1
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer uma pergunta
        correctAnswer: Ask a question
        rationale: "'Ask a question' (não make/do). 'Ask' é o verbo correto para perguntas."
        difficulty: 1
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer o dever de casa
        correctAnswer: Do your homework
        rationale: "'Do homework' = tarefas/atividades de rotina. NÃO 'make homework'."
        difficulty: 1
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer um erro
        correctAnswer: Make a mistake
        rationale: "'Make a mistake' = cometer um erro. NÃO 'do a mistake'."
        difficulty: 1
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer exercício
        correctAnswer: Do exercise
        rationale: "'Do exercise' = atividade física de rotina. NÃO 'make exercise'."
        difficulty: 1
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer uma oferta
        correctAnswer: Make an offer
        rationale: "'Make an offer' = propor um valor/negócio. NÃO 'do an offer'."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer pesquisa
        correctAnswer: Do research
        rationale: "'Do research' = realizar pesquisa. 'Research' incontável (sem artigo). NÃO 'make research'."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer um progresso enorme
        correctAnswer: Make great progress
        rationale: "'Make progress' = progredir. 'Great' = enorme aqui. NÃO 'do progress'."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer negócios com alguém
        correctAnswer: Do business with someone
        rationale: "'Do business' = conduzir negócios. 'With someone' = com alguém. NÃO 'make business'."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer faxina na casa
        correctAnswer: Do the housework
        rationale: "'Do the housework' = tarefas domésticas. NÃO 'make the housework'."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
  - pageNumber: 2
    title: Have & Take Collocations
    description: "'Have' = experience/possess; 'take' = receive/perform an action."
    exercises:
      - type: english_phrases
        question: tomar um banho
        correctAnswer: Have a shower
        rationale: "'Have a shower' (BrE) = tomar banho de chuveiro. NÃO 'take a shower' em BrE, mas ambos são aceitos."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: tirar uma foto
        correctAnswer: Take a photo
        rationale: "'Take a photo' = fotografar. NÃO 'make a photo'."
        difficulty: 1
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: ter uma reunião
        correctAnswer: Have a meeting
        rationale: "'Have a meeting' = participar de/realizar reunião. NÃO 'make a meeting'."
        difficulty: 1
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: tomar um remédio
        correctAnswer: Take medication
        rationale: "'Take medication' = tomar remédio. 'Medication' incontável. NÃO 'have medication'."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: ter uma boa noite de sono
        correctAnswer: Have a good night's sleep
        rationale: "'Have a good night's sleep' = dormir bem. 'Night's' = possessivo de tempo. Have a good night's sleep."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: fazer uma pausa
        correctAnswer: Take a break
        rationale: "'Take a break' = fazer uma pausa. NÃO 'have a break' em muitos contextos (ambos possíveis)."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: ter uma conversa
        correctAnswer: Have a conversation
        rationale: "'Have a conversation' = conversar formalmente. NÃO 'make a conversation'."
        difficulty: 2
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: assumir a responsabilidade
        correctAnswer: Take responsibility
        rationale: "'Take responsibility' = assumir a responsabilidade. NÃO 'have responsibility' (que significa ter responsabilidade)."
        difficulty: 3
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: ter dificuldade em aprender
        correctAnswer: Have difficulty learning
        rationale: "'Have difficulty + gerúndio' = ter dificuldade em. NÃO 'have difficulty to learn'."
        difficulty: 3
        objectives: [B1.vocabulary.collocations_verbs]
      - type: english_phrases
        question: aproveitar uma oportunidade
        correctAnswer: Take an opportunity
        rationale: "'Take an opportunity' = aproveitar/aceitar uma oportunidade. NÃO 'make an opportunity'."
        difficulty: 3
        objectives: [B1.vocabulary.collocations_verbs]
target: 20
