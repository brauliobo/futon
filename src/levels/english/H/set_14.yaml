title: ✏️ English H - Articles
level: H
subject: english
difficulty: 3
objectives:
  - B1.grammar.articles
authorNotes: A/an for first mention or classification, the for specific/unique nouns, zero article for generalisations and proper nouns.
repeatAll: 2
example: "Ex.: 'Ela é médica' → She is a doctor."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: A, An & The — Core Rules
    description: A/an = indefinite; the = definite (specific or previously mentioned).
    exercises:
      - type: english_phrases
        question: ela é médica
        correctAnswer: She is a doctor
        rationale: "'A' antes de profissão na predicativa. Consoante inicial: 'a doctor'. She is a doctor."
        difficulty: 1
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: eu vi um elefante no zoológico
        correctAnswer: I saw an elephant at the zoo
        rationale: "'An' antes de vogal inicial. 'The zoo' = lugar específico/único. I saw an elephant at the zoo."
        difficulty: 1
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: o sol nasce no leste
        correctAnswer: The sun rises in the east
        rationale: "'The sun' = único. 'The east' = direção específica. The sun rises in the east."
        difficulty: 1
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: eu comprei um livro. o livro era caro
        correctAnswer: I bought a book. The book was expensive
        rationale: "Primeira menção = 'a'. Segunda menção = 'the'. I bought a book. The book was expensive."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: ela toca violino na orquestra
        correctAnswer: She plays the violin in the orchestra
        rationale: "'Play the + instrumento musical'. 'The orchestra' = grupo específico. She plays the violin in the orchestra."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: eu fui ao hospital ontem
        correctAnswer: I went to the hospital yesterday
        rationale: "'The hospital' = instituição específica (ao contrário de 'in hospital' sem artigo). I went to the hospital yesterday."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: é um hotel muito caro
        correctAnswer: It is a very expensive hotel
        rationale: "Ordem: a + advérbio + adjetivo + substantivo. 'A very expensive hotel'. It is a very expensive hotel."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: o café da manhã está na mesa
        correctAnswer: The breakfast is on the table
        rationale: "Tanto café da manhã quanto mesa são específicos ao contexto. The breakfast is on the table."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: eu aprendo inglês na escola
        correctAnswer: I learn English at school
        rationale: "'At school' = zero article (função da instituição). 'English' sem artigo (idioma). I learn English at school."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: o presidente vai falar na televisão
        correctAnswer: The president will speak on television
        rationale: "'The president' = cargo único. 'On television' = zero article (meio de comunicação). The president will speak on television."
        difficulty: 3
        objectives: [B1.grammar.articles]
  - pageNumber: 2
    title: Zero Article & Common Exceptions
    description: No article with generalisations, languages, meals, sports, proper nouns, and common expressions.
    exercises:
      - type: english_phrases
        question: gatos são animais independentes
        correctAnswer: Cats are independent animals
        rationale: "Generalização com plural = zero article. 'Cats' sem 'the'. Cats are independent animals."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: ela joga futebol todo fim de semana
        correctAnswer: She plays football every weekend
        rationale: "'Football' = esporte sem artigo. 'Every weekend' = zero article. She plays football every weekend."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: o amor é mais importante que o dinheiro
        correctAnswer: Love is more important than money
        rationale: "Conceitos abstratos genéricos = zero article. 'Love' e 'money' sem 'the'. Love is more important than money."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: eu tomo café da manhã às sete
        correctAnswer: I have breakfast at seven
        rationale: "'Breakfast' = refeição sem artigo. 'At seven' = hora específica. I have breakfast at seven."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: ela foi para a cama tarde
        correctAnswer: She went to bed late
        rationale: "'Go to bed' = expressão fixa sem artigo. Diferente de 'the bed' (o objeto). She went to bed late."
        difficulty: 3
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: ele vai para a escola de metrô
        correctAnswer: He goes to school by metro
        rationale: "'Go to school' = função, zero article. 'By metro' = meio de transporte sem artigo. He goes to school by metro."
        difficulty: 3
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: o Brasil fica na América do Sul
        correctAnswer: Brazil is in South America
        rationale: "Países sem artigo (Brazil). Continentes sem artigo (South America). Brazil is in South America."
        difficulty: 2
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: o oceano atlântico é mais fundo que o mediterrâneo
        correctAnswer: The Atlantic Ocean is deeper than the Mediterranean
        rationale: "'The' com oceanos e mares. 'The Atlantic Ocean', 'the Mediterranean'. The Atlantic Ocean is deeper than the Mediterranean."
        difficulty: 3
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: você precisa de experiência para esse trabalho
        correctAnswer: You need experience for this job
        rationale: "'Experience' = incontável e genérico = zero article. You need experience for this job."
        difficulty: 3
        objectives: [B1.grammar.articles]
      - type: english_phrases
        question: a vida é muito curta para se preocupar
        correctAnswer: Life is too short to worry
        rationale: "Generalização filosófica: 'Life' sem artigo. 'Too short to + infinitivo'. Life is too short to worry."
        difficulty: 4
        objectives: [B1.grammar.articles]
target: 20
