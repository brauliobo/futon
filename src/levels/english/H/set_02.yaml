title: 📝 English H - Could & Was Able To
level: H
subject: english
difficulty: 2
objectives:
  - B1.grammar.modals_ability
authorNotes: "'Could' for past general ability; 'was/were able to' for specific successful occasion. Also polite request."
repeatAll: 2
example: Eu sabia nadar aos cinco → I could swim at five
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Could — Past Ability
    description: Skill or capability in the past.
    exercises:
      - type: english_phrases
        question: Eu sabia nadar aos cinco anos
        correctAnswer: I could swim at five
        rationale: "'Could' = habilidade geral passada. 'At five' = aos cinco anos."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Ela sabia ler cedo
        correctAnswer: She could read early
        rationale: "'She could read' — 'could' invariável. 'Early' advérbio ao final."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Nós corríamos rápido quando éramos jovens
        correctAnswer: We could run fast when we were young
        rationale: "'Could run fast' = habilidade geral. 'Were young' (past de be)."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Ele não sabia dirigir
        correctAnswer: He could not drive
        rationale: "'Could not drive' = não sabia. Contração: 'couldn't'."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Eles falavam francês
        correctAnswer: They could speak French
        rationale: "'Could speak French' = sabiam falar (habilidade)."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Você conseguia ver a estrela
        correctAnswer: You could see the star
        rationale: "'Could see' = conseguia ver (percepção, não ação). 'The star' específico."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Eu não conseguia dormir
        correctAnswer: I could not sleep
        rationale: "'Could not sleep' = incapacidade passada. Contração: 'couldn't sleep'."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Nós dançávamos a noite toda
        correctAnswer: We could dance all night
        rationale: "'Could dance all night' = habilidade. 'All night' sem preposição."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Eles não conseguiam ouvir
        correctAnswer: They could not hear
        rationale: "'Could not hear' = não conseguiam. Verbo de percepção + could."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Crianças aprendiam mais rápido
        correctAnswer: Children could learn faster
        rationale: "'Could learn faster' — 'faster' (fast + er) após o verbo."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
  - pageNumber: 2
    title: Was/Were Able To & Polite Could
    description: Specific success in the past; polite requests.
    exercises:
      - type: english_phrases
        question: Consegui terminar o projeto
        correctAnswer: I was able to finish the project
        rationale: "'Was able to' = sucesso específico. Não 'could' (= geral)."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Ela conseguiu escapar
        correctAnswer: She was able to escape
        rationale: "'Was able to escape' — 'to' + base após 'able'. Evento específico."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Não conseguimos entrar
        correctAnswer: We were not able to get in
        rationale: "'Were not able to get in' — 'get in' = entrar (phrasal). 'Were' (plural)."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Eles conseguiram resolver
        correctAnswer: They were able to solve it
        rationale: "'Solve it' — 'solve' transitivo pede objeto 'it'. 'Were' (plural)."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Eu consegui ligar para ele
        correctAnswer: I was able to call him
        rationale: "'Call him' — 'call' transitivo, sem 'to'. 'Him' (objeto)."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Você poderia me ajudar?
        correctAnswer: Could you help me
        rationale: "'Could you' = pedido educado (mais formal que 'can you')."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Poderia repetir?
        correctAnswer: Could you repeat
        rationale: "'Could you repeat?' — pedido educado. 'Repeat' na base."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Poderia falar mais devagar?
        correctAnswer: Could you speak more slowly
        rationale: "'More slowly' — 'slowly' advérbio longo usa 'more'."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Eu poderia tentar?
        correctAnswer: Could I try
        rationale: "'Could I try?' = pedido de permissão educado. Inversão 'could I'."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Poderíamos começar agora?
        correctAnswer: Could we start now
        rationale: "'Could we start?' — sugestão polida. 'Start' na base."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
target: 20
