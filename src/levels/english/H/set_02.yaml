title: English H - Could & Was Able To
level: H
subject: english
difficulty: 3
objectives: [B1.grammar.modals_ability]
authorNotes: "'Could' for past general ability; 'was/were able to' for specific successful occasion. Also polite request."
repeatAll: 2
example: "Eu sabia nadar aos cinco → I could swim at five"
pages:
  - pageNumber: 1
    title: Could — Past Ability
    description: Skill or capability in the past.
    exercises:
      - { type: english_phrases, question: "Eu sabia nadar aos cinco anos", correctAnswer: i could swim at five }
      - { type: english_phrases, question: "Ela sabia ler cedo", correctAnswer: she could read early }
      - { type: english_phrases, question: "Nós corríamos rápido quando éramos jovens", correctAnswer: we could run fast when we were young }
      - { type: english_phrases, question: "Ele não sabia dirigir", correctAnswer: he could not drive }
      - { type: english_phrases, question: "Eles falavam francês", correctAnswer: they could speak french }
      - { type: english_phrases, question: "Você conseguia ver a estrela", correctAnswer: you could see the star }
      - { type: english_phrases, question: "Eu não conseguia dormir", correctAnswer: i could not sleep }
      - { type: english_phrases, question: "Nós dançávamos a noite toda", correctAnswer: we could dance all night }
      - { type: english_phrases, question: "Eles não conseguiam ouvir", correctAnswer: they could not hear }
      - { type: english_phrases, question: "Crianças aprendiam mais rápido", correctAnswer: children could learn faster }
  - pageNumber: 2
    title: Was/Were Able To & Polite Could
    description: Specific success in the past; polite requests.
    exercises:
      - { type: english_phrases, question: "Consegui terminar o projeto", correctAnswer: i was able to finish the project }
      - { type: english_phrases, question: "Ela conseguiu escapar", correctAnswer: she was able to escape }
      - { type: english_phrases, question: "Não conseguimos entrar", correctAnswer: we were not able to get in }
      - { type: english_phrases, question: "Eles conseguiram resolver", correctAnswer: they were able to solve it }
      - { type: english_phrases, question: "Eu consegui ligar para ele", correctAnswer: i was able to call him }
      - { type: english_phrases, question: "Você poderia me ajudar?", correctAnswer: could you help me }
      - { type: english_phrases, question: "Poderia repetir?", correctAnswer: could you repeat }
      - { type: english_phrases, question: "Poderia falar mais devagar?", correctAnswer: could you speak more slowly }
      - { type: english_phrases, question: "Eu poderia tentar?", correctAnswer: could i try }
      - { type: english_phrases, question: "Poderíamos começar agora?", correctAnswer: could we start now }
target: 20
