title: English H - Modals Mixed Review
level: H
subject: english
difficulty: 4
objectives: [B1.grammar.modals]
authorNotes: Integrate ability, advice, obligation, possibility, requests. Choose the best modal in context.
repeatAll: 2
example: "Você deveria ir, mas não precisa → You should go, but you don't have to"
pages:
  - pageNumber: 1
    title: Context-driven Modal Choice
    description: Pick the modal that fits the meaning.
    exercises:
      - { type: english_phrases, question: "Você deveria descansar mais", correctAnswer: you should rest more }
      - { type: english_phrases, question: "Eu sei tocar violão", correctAnswer: i can play the guitar }
      - { type: english_phrases, question: "Pode estar frio hoje", correctAnswer: it may be cold today }
      - { type: english_phrases, question: "Você precisa esperar", correctAnswer: you have to wait }
      - { type: english_phrases, question: "Ele não pode falar agora", correctAnswer: he cannot talk now }
      - { type: english_phrases, question: "Poderia me emprestar a caneta?", correctAnswer: could you lend me the pen }
      - { type: english_phrases, question: "Você não deve dizer isso", correctAnswer: you must not say that }
      - { type: english_phrases, question: "Talvez ela esteja certa", correctAnswer: she might be right }
      - { type: english_phrases, question: "Eu não precisaria trabalhar se fosse rico", correctAnswer: i would not need to work if i were rich }
      - { type: english_phrases, question: "Podemos começar a reunião?", correctAnswer: can we start the meeting }
  - pageNumber: 2
    title: Real-life Sentences
    description: Realistic situational usage.
    exercises:
      - { type: english_phrases, question: "Você precisa ver o médico", correctAnswer: you should see the doctor }
      - { type: english_phrases, question: "Posso tirar uma foto aqui?", correctAnswer: can i take a photo here }
      - { type: english_phrases, question: "Ela pode chegar a qualquer momento", correctAnswer: she may arrive any moment }
      - { type: english_phrases, question: "Eu não conseguia encontrar as chaves", correctAnswer: i could not find the keys }
      - { type: english_phrases, question: "Você não deveria ligar para ele tão tarde", correctAnswer: you should not call him so late }
      - { type: english_phrases, question: "Talvez eu precise de ajuda", correctAnswer: i might need help }
      - { type: english_phrases, question: "Você pode me ligar mais tarde?", correctAnswer: can you call me later }
      - { type: english_phrases, question: "Ele deve dinheiro, tem que pagar", correctAnswer: he owes money he has to pay }
      - { type: english_phrases, question: "Eu adoraria ir, mas não posso", correctAnswer: i would love to go but i cannot }
      - { type: english_phrases, question: "Devemos chegar até as oito", correctAnswer: we should arrive by eight }
target: 20
