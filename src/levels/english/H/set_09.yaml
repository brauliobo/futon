title: ✏️ English H - Past Perfect
level: H
subject: english
difficulty: 3
objectives:
  - B1.grammar.past_perfect
authorNotes: Past Perfect (had + past participle) to sequence past events. Key connectors before/after/by the time/already/never.
repeatAll: 2
example: "Ex.: 'Ela já tinha saído quando liguei' → She had already left when I called."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Sequencing Past Events
    description: Use 'had + past participle' for the earlier of two past actions.
    exercises:
      - type: english_phrases
        question: ele já tinha comido quando chegamos
        correctAnswer: He had already eaten when we arrived
        rationale: "'Had already eaten' = ação anterior. 'When we arrived' = ação posterior. He had already eaten when we arrived."
        difficulty: 1
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: ela tinha estudado antes do exame
        correctAnswer: She had studied before the exam
        rationale: "'Had studied' = Past Perfect. 'Before the exam' marca a sequência. She had studied before the exam."
        difficulty: 1
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: eu nunca tinha viajado de avião
        correctAnswer: I had never travelled by plane
        rationale: "'Had never + particípio' = experiência anterior a outro momento. I had never travelled by plane."
        difficulty: 1
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: eles já tinham saído quando chegamos
        correctAnswer: They had already left when we arrived
        rationale: "'Left' = particípio de 'leave'. 'Already' entre had e o particípio. They had already left when we arrived."
        difficulty: 2
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: nós tínhamos terminado antes de ele ligar
        correctAnswer: We had finished before he called
        rationale: "'Before he called' = conector de sequência. 'Finished' = regular. We had finished before he called."
        difficulty: 2
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: o filme já tinha começado quando sentamos
        correctAnswer: The film had already started when we sat down
        rationale: "'Sat down' = Simple Past de 'sit down'. 'Had started' = antes. The film had already started when we sat down."
        difficulty: 2
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: eu tinha perdido minha carteira
        correctAnswer: I had lost my wallet
        rationale: "'Lost' = particípio de 'lose'. 'My wallet' = minha carteira. I had lost my wallet."
        difficulty: 2
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: ela nunca tinha mentido antes
        correctAnswer: She had never lied before
        rationale: "'Before' ao final = até aquele momento. 'Lied' = particípio regular de 'lie'. She had never lied before."
        difficulty: 2
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: depois de ele chegar, nós tínhamos cozinhado
        correctAnswer: After he arrived, we had cooked
        rationale: "'After' introduz a ação posterior; had + particípio marca a anterior. After he arrived, we had cooked."
        difficulty: 3
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: quando ela acordou, a chuva tinha parado
        correctAnswer: When she woke up, the rain had stopped
        rationale: "'Woke up' = Simple Past. 'Had stopped' = antes. When she woke up, the rain had stopped."
        difficulty: 3
        objectives: [B1.grammar.past_perfect]
  - pageNumber: 2
    title: By the Time & Narrative Sequences
    description: Use 'by the time' and mixed connectors for narrative past sequences.
    exercises:
      - type: english_phrases
        question: quando a polícia chegou, o ladrão tinha fugido
        correctAnswer: By the time the police arrived, the thief had escaped
        rationale: "'By the time' = quando (com ênfase em completude). 'Had escaped' = anterior. By the time the police arrived, the thief had escaped."
        difficulty: 2
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: quando terminamos, já era tarde
        correctAnswer: By the time we finished, it was already late
        rationale: "'By the time' + Simple Past + Simple Past para resultado. By the time we finished, it was already late."
        difficulty: 2
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: eu tinha lido o livro antes de ver o filme
        correctAnswer: I had read the book before watching the film
        rationale: "'Before watching' = gerúndio após before. 'Read' = particípio. I had read the book before watching the film."
        difficulty: 3
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: depois de estudar, ela tinha ficado cansada
        correctAnswer: After studying, she had become tired
        rationale: "'After studying' = gerúndio após after. 'Become' = particípio. After studying, she had become tired."
        difficulty: 3
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: eles tinham construído a casa antes do inverno
        correctAnswer: They had built the house before winter
        rationale: "'Built' = particípio de 'build'. 'Before winter' = antes do inverno. They had built the house before winter."
        difficulty: 3
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: quando cheguei, ela já tinha ligado duas vezes
        correctAnswer: When I arrived, she had already called twice
        rationale: "'Twice' = duas vezes. 'Had called' = já tinha ligado antes. When I arrived, she had already called twice."
        difficulty: 3
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: ele não tinha dormido bem antes da apresentação
        correctAnswer: He had not slept well before the presentation
        rationale: "'Had not slept' = negativa do Past Perfect. 'Slept' = particípio. He had not slept well before the presentation."
        difficulty: 3
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: a reunião já tinha terminado quando eles chegaram
        correctAnswer: The meeting had already ended when they arrived
        rationale: "'Had already ended' = concluído antes. 'When they arrived' = ação posterior. The meeting had already ended when they arrived."
        difficulty: 3
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: quando soube a notícia, ela já tinha ido embora
        correctAnswer: When I heard the news, she had already gone
        rationale: "'Gone' = particípio de 'go'. 'Had already gone' = foi antes. When I heard the news, she had already gone."
        difficulty: 4
        objectives: [B1.grammar.past_perfect]
      - type: english_phrases
        question: quando chegamos, tudo tinha acabado
        correctAnswer: By the time we arrived, everything had finished
        rationale: "'By the time' reforça que tudo já terminou. 'Had finished' = anterior ao arriving. By the time we arrived, everything had finished."
        difficulty: 4
        objectives: [B1.grammar.past_perfect]
target: 20
