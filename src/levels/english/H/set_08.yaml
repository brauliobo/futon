title: ✏️ English H - Present Perfect
level: H
subject: english
difficulty: 3
objectives:
  - B1.grammar.present_perfect
authorNotes: Present Perfect with have/has + past participle. Focus on ever/never/just/already/yet for experience and recent events.
repeatAll: 2
example: "Ex.: 'Eu já estive em Londres' → I have already been to London."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Experience & Life Events
    description: Use 'have/has + past participle' to talk about life experiences with ever/never/already.
    exercises:
      - type: english_phrases
        question: eu já comi sushi
        correctAnswer: I have already eaten sushi
        rationale: "'Already' = já (afirmativa). 'Eaten' = particípio de 'eat'. I have already eaten sushi."
        difficulty: 1
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: ela nunca foi à Europa
        correctAnswer: She has never been to Europe
        rationale: "'Never' = nunca (negativa). 'Been to' = foi a (particípio de 'be'). She has never been to Europe."
        difficulty: 1
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: você já assistiu esse filme?
        correctAnswer: Have you ever watched this film
        rationale: "'Ever' em perguntas = alguma vez. Inversão Have + sujeito. Have you ever watched this film?"
        difficulty: 1
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: nós nunca vimos neve
        correctAnswer: We have never seen snow
        rationale: "'Seen' = particípio de 'see'. 'Never' entre have e o particípio. We have never seen snow."
        difficulty: 1
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: ele já leu esse livro
        correctAnswer: He has already read this book
        rationale: "'Has' com he/she/it. 'Read' (passado/particípio = mesma forma). He has already read this book."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: eles já visitaram o museu
        correctAnswer: They have already visited the museum
        rationale: "'Visited' = particípio regular (-ed). 'Already' antes do particípio. They have already visited the museum."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: eu nunca bebi café
        correctAnswer: I have never drunk coffee
        rationale: "'Drunk' = particípio de 'drink'. 'Never' entre have e particípio. I have never drunk coffee."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: ela já falou com o chefe
        correctAnswer: She has already spoken to the boss
        rationale: "'Spoken' = particípio de 'speak'. 'To the boss' = com o chefe. She has already spoken to the boss."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: vocês alguma vez andaram de metrô?
        correctAnswer: Have you ever ridden the metro
        rationale: "'Ridden' = particípio de 'ride'. 'Ever' em perguntas de experiência. Have you ever ridden the metro?"
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: ele nunca perdeu um voo
        correctAnswer: He has never missed a flight
        rationale: "'Missed' = particípio regular. 'Miss a flight' = perder um voo. He has never missed a flight."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
  - pageNumber: 2
    title: Recent Events with Just & Yet
    description: Use 'just' for very recent events and 'yet' in negatives/questions.
    exercises:
      - type: english_phrases
        question: eu acabei de chegar
        correctAnswer: I have just arrived
        rationale: "'Just' = acabou de acontecer, entre have e o particípio. I have just arrived."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: ela ainda não terminou
        correctAnswer: She has not finished yet
        rationale: "'Yet' no final em negativas. 'Has not finished yet' = ainda não terminou."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: eles acabaram de sair
        correctAnswer: They have just left
        rationale: "'Left' = particípio de 'leave'. 'Just' antes do particípio. They have just left."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: você já tomou café da manhã?
        correctAnswer: Have you had breakfast yet
        rationale: "'Yet' no final em perguntas. 'Have breakfast' = tomar café. Have you had breakfast yet?"
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: ele acabou de ligar para mim
        correctAnswer: He has just called me
        rationale: "'Called' = regular. 'Me' = objeto direto após o verbo. He has just called me."
        difficulty: 2
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: nós ainda não decidimos
        correctAnswer: We have not decided yet
        rationale: "'Have not... yet' = ainda não. 'Decided' = regular. We have not decided yet."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: o trem acabou de partir
        correctAnswer: The train has just departed
        rationale: "'Has' com 'the train' (3ª pessoa). 'Departed' = regular. The train has just departed."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: ela ainda não respondeu o email
        correctAnswer: She has not replied to the email yet
        rationale: "'Reply to' = responder a. 'Yet' ao final. She has not replied to the email yet."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: eu já mandei a mensagem
        correctAnswer: I have already sent the message
        rationale: "'Sent' = particípio de 'send'. 'Already' antes do particípio. I have already sent the message."
        difficulty: 3
        objectives: [B1.grammar.present_perfect]
      - type: english_phrases
        question: eles ainda não chegaram?
        correctAnswer: Have they arrived yet
        rationale: "'Yet' em perguntas = já. Inversão Have + sujeito. Have they arrived yet?"
        difficulty: 4
        objectives: [B1.grammar.present_perfect]
target: 20
