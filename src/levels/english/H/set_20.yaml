title: ✏️ English H - Mixed Review Level H
level: H
subject: english
difficulty: 3
objectives:
  - B1.grammar.mixed_review_H
authorNotes: Comprehensive review of all key H-level topics — present perfect, past perfect, conditionals, passive, reported speech, future forms, articles, collocations, and vocabulary.
repeatAll: 2
example: "Ex.: 'Se eu tivesse sabido, teria vindo' → If I had known, I would have come."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Grammar Review
    description: Mixed grammar questions covering all H-level structures.
    exercises:
      - type: english_phrases
        question: eu já terminei o relatório
        correctAnswer: I have already finished the report
        rationale: "Present Perfect + already. 'Have already finished' = já terminei. I have already finished the report."
        difficulty: 1
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: o contrato deve ser assinado hoje
        correctAnswer: The contract must be signed today
        rationale: "Modal Passive: must be + pp. 'Signed' = particípio de 'sign'. The contract must be signed today."
        difficulty: 2
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: se ele tivesse estudado mais, teria passado
        correctAnswer: If he had studied more, he would have passed
        rationale: "Third Conditional: if + Past Perfect + would have + pp. If he had studied more, he would have passed."
        difficulty: 2
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: ela me disse que estava procurando um novo apartamento
        correctAnswer: She told me she was looking for a new flat
        rationale: "Reported Speech: backshift is→was. 'Flat' = apartamento (BrE). She told me she was looking for a new flat."
        difficulty: 2
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: eu vou fazer um curso de inglês no próximo semestre
        correctAnswer: I am going to take an English course next semester
        rationale: "'Going to' = plano. 'Take a course' = fazer um curso. I am going to take an English course next semester."
        difficulty: 2
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: quando chegamos, a reunião já tinha começado
        correctAnswer: When we arrived, the meeting had already started
        rationale: "Past Perfect para ação anterior. 'Had already started' = começou antes de chegarmos."
        difficulty: 2
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: a menos que você economize, não poderá viajar
        correctAnswer: Unless you save money, you will not be able to travel
        rationale: "'Unless' = if not. 'Will not be able to' = não conseguirá. Unless you save money, you will not be able to travel."
        difficulty: 3
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: todos os ingressos foram vendidos
        correctAnswer: All the tickets have been sold
        rationale: "Present Perfect Passive: have been + pp. 'All the tickets have been sold'."
        difficulty: 2
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: você alguma vez trabalhou no exterior?
        correctAnswer: Have you ever worked abroad
        rationale: "'Have you ever + pp' = experiência de vida. 'Abroad' = no exterior. Have you ever worked abroad?"
        difficulty: 2
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: ela perguntou se eu tinha terminado o trabalho
        correctAnswer: She asked if I had finished the work
        rationale: "Reported Yes/No question com backshift: have finished→had finished. She asked if I had finished the work."
        difficulty: 3
        objectives: [B1.grammar.mixed_review_H]
  - pageNumber: 2
    title: Vocabulary & Usage Review
    description: Mixed vocabulary and collocation review from H-level topics.
    exercises:
      - type: english_phrases
        question: ela se candidatou a várias vagas
        correctAnswer: She applied for several vacancies
        rationale: "'Apply for' + 'vacancies' (plural de 'vacancy'). She applied for several vacancies."
        difficulty: 2
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: é necessário reduzir as emissões de carbono urgentemente
        correctAnswer: It is necessary to reduce carbon emissions urgently
        rationale: "'It is necessary to + infinitivo'. 'Carbon emissions urgently' = emissões com urgência."
        difficulty: 3
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: uma bela mesa redonda de madeira antiga
        correctAnswer: A beautiful old round wooden table
        rationale: "Ordem: opinion (beautiful) → age (old) → shape (round) → material (wooden). A beautiful old round wooden table."
        difficulty: 3
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: a empresa foi fundada em mil novecentos e cinquenta
        correctAnswer: The company was founded in nineteen fifty
        rationale: "'Was founded' = Simple Past Passive. Anos: 1950 = 'nineteen fifty'. The company was founded in nineteen fifty."
        difficulty: 2
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: ele foi promovido depois de dois anos na empresa
        correctAnswer: He was promoted after two years with the company
        rationale: "'Was promoted' = passiva. 'Two years with the company' = dois anos na empresa. He was promoted after two years with the company."
        difficulty: 3
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: recomendamos que as medidas sejam tomadas imediatamente
        correctAnswer: We recommend that the measures be taken immediately
        rationale: "'Recommend that + base' = subjuntivo. 'Be taken immediately' = passiva. We recommend that the measures be taken immediately."
        difficulty: 3
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: a poluição do ar piorou nos últimos anos
        correctAnswer: Air pollution has worsened in recent years
        rationale: "'Has worsened' = Present Perfect para mudança. 'In recent years' = nos últimos anos."
        difficulty: 3
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: se eu fosse você, pediria um aumento
        correctAnswer: If I were you, I would ask for a raise
        rationale: "Second Conditional: 'were' (formal). 'Ask for a raise' = pedir aumento. If I were you, I would ask for a raise."
        difficulty: 3
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: o paciente acabou de ser operado
        correctAnswer: The patient has just been operated on
        rationale: "'Has just been + pp + particle' = Present Perfect Passive + just. 'Operated on' = ser operado."
        difficulty: 4
        objectives: [B1.grammar.mixed_review_H]
      - type: english_phrases
        question: dado o sucesso do programa, propomos sua expansão
        correctAnswer: Given the success of the programme, we propose its expansion
        rationale: "'Given' = dado. 'We propose its expansion' = linguagem formal de proposta. Given the success of the programme, we propose its expansion."
        difficulty: 4
        objectives: [B1.grammar.mixed_review_H]
target: 20
