title: English H - Must & Have To (Obligation)
level: H
subject: english
difficulty: 3
objectives:
  - B1.grammar.modals_obligation
authorNotes: "'Must' for strong internal obligation; 'have to' for external rules. 'Mustn't' = prohibition; 'don't have to' = not necessary."
repeatAll: 2
example: Eu preciso ir → I have to go
pages:
  - pageNumber: 1
    title: Must & Have To
    description: Strong and rule-based obligation.
    exercises:
      - type: english_phrases
        question: Eu preciso ir
        correctAnswer: i have to go
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela tem que trabalhar
        correctAnswer: she has to work
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você deve respeitar as regras
        correctAnswer: you must respect the rules
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles precisam estudar
        correctAnswer: they have to study
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós devemos ser honestos
        correctAnswer: we must be honest
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele tem que acordar cedo
        correctAnswer: he has to wake up early
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você deve ver isto
        correctAnswer: you must see this
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu tenho que pagar a conta
        correctAnswer: i have to pay the bill
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela tem que fazer exercício
        correctAnswer: she has to exercise
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós precisamos sair agora
        correctAnswer: we have to leave now
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Mustn't & Don't Have To
    description: Prohibition vs. lack of necessity.
    exercises:
      - type: english_phrases
        question: Você não deve mentir
        correctAnswer: you must not lie
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Não deve fumar aqui
        correctAnswer: you must not smoke here
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele não pode esquecer
        correctAnswer: he must not forget
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Não devemos nos atrasar
        correctAnswer: we must not be late
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Crianças não podem correr aqui
        correctAnswer: children must not run here
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você não precisa pagar
        correctAnswer: you do not have to pay
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não precisa vir
        correctAnswer: she does not have to come
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Não precisamos gritar
        correctAnswer: we do not have to shout
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você não precisa fazer agora
        correctAnswer: you do not have to do it now
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles não precisam se preocupar
        correctAnswer: they do not have to worry
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
