title: ✏️ English H - Adjective Order & Compound Adjectives
level: H
subject: english
difficulty: 3
objectives:
  - B1.grammar.adjective_order
authorNotes: Adjective order rule — opinion, size, age, shape, colour, origin, material, purpose + noun. Compound adjectives with hyphens.
repeatAll: 2
example: "Ex.: 'Uma linda bolsa italiana de couro' → A beautiful Italian leather bag."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Adjective Order
    description: English adjectives follow a fixed order — opinion → size → age → colour → origin → material → noun.
    exercises:
      - type: english_phrases
        question: uma linda bolsa italiana de couro
        correctAnswer: A beautiful Italian leather bag
        rationale: "Ordem: opinion (beautiful) → origin (Italian) → material (leather). A beautiful Italian leather bag."
        difficulty: 1
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: uma camisa azul velha grande
        correctAnswer: A large old blue shirt
        rationale: "Ordem: size (large) → age (old) → colour (blue). A large old blue shirt."
        difficulty: 1
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: um lindo carro esportivo vermelho
        correctAnswer: A beautiful red sports car
        rationale: "Ordem: opinion (beautiful) → colour (red) → purpose (sports). A beautiful red sports car."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: uma mesa quadrada pequena de madeira
        correctAnswer: A small square wooden table
        rationale: "Ordem: size (small) → shape (square) → material (wooden). A small square wooden table."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: um homem alto e magro
        correctAnswer: A tall thin man
        rationale: "Dois adjetivos de tamanho/forma: tall, thin. Sem vírgula quando fluem naturalmente. A tall thin man."
        difficulty: 1
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: uma antiga casa francesa de pedra
        correctAnswer: An old French stone house
        rationale: "Ordem: age (old) → origin (French) → material (stone). An old French stone house."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: um anel dourado pequeno e bonito
        correctAnswer: A lovely small gold ring
        rationale: "Ordem: opinion (lovely) → size (small) → material (gold). A lovely small gold ring."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: uma jovem médica inteligente
        correctAnswer: A clever young doctor
        rationale: "Ordem: opinion (clever) → age (young). 'Doctor' = profissão sem artigo definido. A clever young doctor."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: umas cortinas compridas de seda verde
        correctAnswer: Long green silk curtains
        rationale: "Ordem: size (long) → colour (green) → material (silk). Long green silk curtains."
        difficulty: 3
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: um velho chinês sábio
        correctAnswer: A wise old Chinese man
        rationale: "Ordem: opinion (wise) → age (old) → origin (Chinese). A wise old Chinese man."
        difficulty: 3
        objectives: [B1.grammar.adjective_order]
  - pageNumber: 2
    title: Compound Adjectives
    description: Compound adjectives use hyphens (well-known, three-year-old, good-looking) and are placed before nouns.
    exercises:
      - type: english_phrases
        question: um ator bem conhecido
        correctAnswer: A well-known actor
        rationale: "'Well-known' = composto com hífen antes do substantivo. A well-known actor."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: uma criança de cinco anos
        correctAnswer: A five-year-old child
        rationale: "'Five-year-old' = número + unit + old com hífen. A five-year-old child."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: um homem de boa aparência
        correctAnswer: A good-looking man
        rationale: "'Good-looking' = composto de opinião. Hífen obrigatório antes do substantivo. A good-looking man."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: uma viagem de duas semanas
        correctAnswer: A two-week trip
        rationale: "Número + unidade de tempo = composto. Singular: 'two-week' (sem -s). A two-week trip."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: um apartamento pronto para morar
        correctAnswer: A ready-to-move-in apartment
        rationale: "Composto com infinitivo: 'ready-to-move-in'. A ready-to-move-in apartment."
        difficulty: 3
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: um estudante dedicado e inteligente de cabelos escuros
        correctAnswer: A hard-working dark-haired student
        rationale: "'Hard-working' (dedicado) + 'dark-haired' (cabelos escuros). Dois compostos antes do substantivo."
        difficulty: 3
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: uma decisão de longo prazo
        correctAnswer: A long-term decision
        rationale: "'Long-term' = composto fixo. Oposto: 'short-term'. A long-term decision."
        difficulty: 2
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: um país desenvolvido
        correctAnswer: A well-developed country
        rationale: "'Well-developed' = advérbio + particípio com hífen. A well-developed country."
        difficulty: 3
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: uma jovem garota de olhos azuis
        correctAnswer: A young blue-eyed girl
        rationale: "'Blue-eyed' = composto de cor + órgão. Ordem: age (young) + colour-compound. A young blue-eyed girl."
        difficulty: 3
        objectives: [B1.grammar.adjective_order]
      - type: english_phrases
        question: um contrato de dez anos com uma empresa italiana
        correctAnswer: A ten-year contract with an Italian company
        rationale: "'Ten-year' = composto de duração. 'Italian company' = origin adjective sem hífen. A ten-year contract with an Italian company."
        difficulty: 4
        objectives: [B1.grammar.adjective_order]
target: 20
