title: ✏️ English H - Vocabulary: Work & Career
level: H
subject: english
difficulty: 3
objectives:
  - B1.vocabulary.work_career
authorNotes: Core B1+ professional vocabulary — job titles, workplace actions (apply, resign, promote), and HR terminology.
repeatAll: 2
example: "Ex.: 'Ela se candidatou para o emprego' → She applied for the job."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Job Search & Application
    description: Vocabulary for finding and applying for work — apply, vacancy, CV, interview, salary.
    exercises:
      - type: english_phrases
        question: ela se candidatou para o emprego
        correctAnswer: She applied for the job
        rationale: "'Apply for' = candidatar-se a. Preposição 'for' é obrigatória. She applied for the job."
        difficulty: 1
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: há uma vaga no departamento de marketing
        correctAnswer: There is a vacancy in the marketing department
        rationale: "'Vacancy' = vaga de emprego. 'Marketing department' = departamento. There is a vacancy in the marketing department."
        difficulty: 1
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ele enviou o currículo ontem
        correctAnswer: He sent his CV yesterday
        rationale: "'CV' = curriculum vitae (BrE). 'Resume' em AmE. He sent his CV yesterday."
        difficulty: 1
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: o salário é de três mil euros por mês
        correctAnswer: The salary is three thousand euros a month
        rationale: "'Salary' = salário fixo (mensal/anual). 'Wages' = pagamento por hora/semana. The salary is three thousand euros a month."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ela teve uma entrevista de emprego na segunda
        correctAnswer: She had a job interview on Monday
        rationale: "'Job interview' = entrevista de emprego. 'On Monday' = na segunda. She had a job interview on Monday."
        difficulty: 1
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: o candidato foi contratado
        correctAnswer: The candidate was hired
        rationale: "'Hire' = contratar. 'Was hired' = passiva. 'Applicant/candidate' = candidato. The candidate was hired."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: a empresa está recrutando novos funcionários
        correctAnswer: The company is recruiting new employees
        rationale: "'Recruit' = recrutar. 'Employees' = funcionários (formal). The company is recruiting new employees."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: qual é o seu cargo atual?
        correctAnswer: What is your current position
        rationale: "'Position' = cargo/função. 'Current' = atual. What is your current position?"
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ele tem muita experiência em gestão
        correctAnswer: He has a lot of experience in management
        rationale: "'Experience in' = experiência em (área). 'Management' = gestão. He has a lot of experience in management."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ela negociou um salário mais alto
        correctAnswer: She negotiated a higher salary
        rationale: "'Negotiate' = negociar. 'Higher salary' = salário mais alto. She negotiated a higher salary."
        difficulty: 3
        objectives: [B1.vocabulary.work_career]
  - pageNumber: 2
    title: Workplace Events & Progression
    description: Vocabulary for career events — promotion, resignation, redundancy, retirement, overtime.
    exercises:
      - type: english_phrases
        question: ele foi promovido a gerente
        correctAnswer: He was promoted to manager
        rationale: "'Be promoted to' = ser promovido a. Preposição 'to' + cargo. He was promoted to manager."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ela pediu demissão na semana passada
        correctAnswer: She resigned last week
        rationale: "'Resign' = pedir demissão voluntariamente. 'Last week' = na semana passada. She resigned last week."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ele foi demitido por corte de custos
        correctAnswer: He was made redundant due to cost cuts
        rationale: "'Made redundant' = demitido (BrE, por reestruturação). 'Due to' = devido a. He was made redundant due to cost cuts."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ela se aposentou aos sessenta anos
        correctAnswer: She retired at the age of sixty
        rationale: "'Retire' = aposentar-se. 'At the age of' = aos X anos. She retired at the age of sixty."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: eu trabalhei horas extras esta semana
        correctAnswer: I worked overtime this week
        rationale: "'Work overtime' = trabalhar horas extras. Sem artigo com 'overtime'. I worked overtime this week."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ele está de licença médica
        correctAnswer: He is on sick leave
        rationale: "'On sick leave' = de licença médica. 'On leave' = de licença (geral). He is on sick leave."
        difficulty: 3
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: a empresa oferece bons benefícios
        correctAnswer: The company offers good benefits
        rationale: "'Benefits' = benefícios (saúde, plano, bônus). 'Offer good benefits' = oferecer bons benefícios."
        difficulty: 2
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ela está trabalhando como freelancer
        correctAnswer: She is working as a freelancer
        rationale: "'Freelancer' = autônomo. 'Work as' + função. She is working as a freelancer."
        difficulty: 3
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: o prazo para a candidatura é amanhã
        correctAnswer: The deadline for the application is tomorrow
        rationale: "'Deadline' = prazo final. 'Application' = candidatura/inscrição. The deadline for the application is tomorrow."
        difficulty: 3
        objectives: [B1.vocabulary.work_career]
      - type: english_phrases
        question: ela gerencia uma equipe de dez pessoas
        correctAnswer: She manages a team of ten people
        rationale: "'Manage' = gerenciar. 'A team of ten people' = equipe de dez. She manages a team of ten people."
        difficulty: 3
        objectives: [B1.vocabulary.work_career]
target: 20
