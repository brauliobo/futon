title: English H - Can & Cannot (Ability)
level: H
subject: english
difficulty: 2
objectives:
  - B1.grammar.modals_ability
authorNotes: Can/can't + base verb. Present ability and informal permission.
repeatAll: 2
example: Eu sei nadar → I can swim
pages:
  - pageNumber: 1
    title: Ability with Can
    description: Use 'can' + base verb. No -s on third person.
    exercises:
      - type: english_phrases
        question: Eu sei nadar
        correctAnswer: I can swim
        rationale: "'I can swim' — 'can' + base 'swim'. 'Saber fazer' algo = 'can'."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Ela sabe cozinhar
        correctAnswer: she can cook
        rationale: "'She can cook' — modal 'can' não recebe '-s' na 3ª pessoa."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Eles falam inglês
        correctAnswer: they can speak english
        rationale: "'Speak English' (maiúsculo). 'Can' + base, sem 'to'."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Ele sabe dirigir
        correctAnswer: he can drive
        rationale: "'He can drive' — 'can' invariável. 'Drive' na base."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Nós sabemos dançar
        correctAnswer: we can dance
        rationale: "'We can dance' — modal + base. 'Dance' sem -ing nem 'to'."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Você consegue ouvir?
        correctAnswer: can you hear
        rationale: "'Can you hear?' — modal antes do sujeito em pergunta, sem 'do'."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Ela consegue ver bem
        correctAnswer: she can see well
        rationale: "'See well' — 'well' (advérbio), não 'good' (adjetivo)."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Eu posso ajudar
        correctAnswer: I can help
        rationale: "'I can help' — 'can' oferece ajuda. 'Help' na base."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Você pode tentar
        correctAnswer: you can try
        rationale: "'You can try' — 'can' expressa possibilidade/permissão. Base 'try'."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Crianças aprendem rápido
        correctAnswer: children can learn fast
        rationale: "'Children' (plural irregular). 'Fast' advérbio ao final."
        difficulty: 1
        objectives: [B1.grammar.modals_ability]
  - pageNumber: 2
    title: Cannot / Can't
    description: Inability or prohibition.
    exercises:
      - type: english_phrases
        question: Eu não sei nadar
        correctAnswer: I cannot swim
        rationale: "'Cannot' é escrito junto (uma palavra). Contração: 'can't'."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Ela não sabe dirigir
        correctAnswer: she cannot drive
        rationale: "'She cannot drive' — 'cannot' invariável (sem -s na 3ª pessoa)."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Não consigo ouvir
        correctAnswer: I cannot hear
        rationale: "'I cannot hear' = não consigo ouvir. 'Hear' na base."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Não conseguimos ir hoje
        correctAnswer: we cannot go today
        rationale: "'We cannot go' — 'cannot' para todas as pessoas. 'Today' ao final."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Você não pode entrar
        correctAnswer: you cannot come in
        rationale: "'Come in' = entrar (phrasal). 'Cannot come in' = proibição."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Ele não pode trabalhar agora
        correctAnswer: he cannot work now
        rationale: "'He cannot work' — modal negativo + base. 'Now' ao final."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Não posso te ouvir bem
        correctAnswer: I cannot hear you well
        rationale: "'Hear you' (objeto). 'Well' (advérbio) ao final."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Eles não conseguem entender
        correctAnswer: they cannot understand
        rationale: "'They cannot understand' — 'understand' na base após modal."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Não dá para ver daqui
        correctAnswer: you cannot see from here
        rationale: "'From here' = daqui. 'You cannot' = impessoal/genérico."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
      - type: english_phrases
        question: Ele não sabe ler ainda
        correctAnswer: he cannot read yet
        rationale: "'Yet' = ainda (negativa). 'He cannot read yet' (ainda não)."
        difficulty: 2
        objectives: [B1.grammar.modals_ability]
target: 20
