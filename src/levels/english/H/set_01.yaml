title: English H - Can & Cannot (Ability)
level: H
subject: english
difficulty: 2
objectives:
  - B1.grammar.modals_ability
authorNotes: Can/can't + base verb. Present ability and informal permission.
repeatAll: 2
example: Eu sei nadar → I can swim
pages:
  - pageNumber: 1
    title: Ability with Can
    description: Use 'can' + base verb. No -s on third person.
    exercises:
      - type: english_phrases
        question: Eu sei nadar
        correctAnswer: i can swim
        rationale: "Passado de 'can' = 'could'."
      - type: english_phrases
        question: Ela sabe cozinhar
        correctAnswer: she can cook
        rationale: "Pronúncia de 'can't': BrE /kɑːnt/, AmE /kænt/."
      - type: english_phrases
        question: Eles falam inglês
        correctAnswer: they can speak english
        rationale: "Sem 'to' após 'can'."
      - type: english_phrases
        question: Ele sabe dirigir
        correctAnswer: he can drive
        rationale: "'Can' = habilidade/permissão. 'Can + base'."
      - type: english_phrases
        question: Nós sabemos dançar
        correctAnswer: we can dance
        rationale: "Resposta curta: 'Yes, I can' / 'No, I can't'."
      - type: english_phrases
        question: Você consegue ouvir?
        correctAnswer: can you hear
        rationale: "Modal invariável: sem '-s' em he/she/it."
      - type: english_phrases
        question: Ela consegue ver bem
        correctAnswer: she can see well
        rationale: "Pronúncia de 'can't': BrE /kɑːnt/, AmE /kænt/."
      - type: english_phrases
        question: Eu posso ajudar
        correctAnswer: i can help
        rationale: "'Can' = habilidade/permissão. 'Can + base'."
      - type: english_phrases
        question: Você pode tentar
        correctAnswer: you can try
        rationale: "Modal invariável: sem '-s' em he/she/it."
      - type: english_phrases
        question: Crianças aprendem rápido
        correctAnswer: children can learn fast
        rationale: "Passado de 'can' = 'could'."
  - pageNumber: 2
    title: Cannot / Can't
    description: Inability or prohibition.
    exercises:
      - type: english_phrases
        question: Eu não sei nadar
        correctAnswer: i cannot swim
        rationale: "Resposta curta: 'Yes, I can' / 'No, I can't'."
      - type: english_phrases
        question: Ela não sabe dirigir
        correctAnswer: she cannot drive
        rationale: "Pronúncia de 'can't': BrE /kɑːnt/, AmE /kænt/."
      - type: english_phrases
        question: Não consigo ouvir
        correctAnswer: i cannot hear
        rationale: "'Can' = habilidade/permissão. 'Can + base'."
      - type: english_phrases
        question: Não conseguimos ir hoje
        correctAnswer: we cannot go today
        rationale: "Negativa: cannot/can't."
      - type: english_phrases
        question: Você não pode entrar
        correctAnswer: you cannot come in
        rationale: "Sem 'to' após 'can'."
      - type: english_phrases
        question: Ele não pode trabalhar agora
        correctAnswer: he cannot work now
        rationale: "Pedido informal: 'Can you help?'."
      - type: english_phrases
        question: Não posso te ouvir bem
        correctAnswer: i cannot hear you well
        rationale: "'Can' = habilidade/permissão. 'Can + base'."
      - type: english_phrases
        question: Eles não conseguem entender
        correctAnswer: they cannot understand
        rationale: "Sem auxiliar 'do' em perguntas com modal."
      - type: english_phrases
        question: Não dá para ver daqui
        correctAnswer: you cannot see from here
        rationale: "Pergunta: 'Can you...?'."
      - type: english_phrases
        question: Ele não sabe ler ainda
        correctAnswer: he cannot read yet
        rationale: "Negativa: cannot/can't."
target: 20
