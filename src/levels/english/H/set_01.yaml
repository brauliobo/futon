title: English H - Can & Cannot (Ability)
level: H
subject: english
difficulty: 2
objectives: [B1.grammar.modals_ability]
authorNotes: Can/can't + base verb. Present ability and informal permission.
repeatAll: 2
example: "Eu sei nadar → I can swim"
pages:
  - pageNumber: 1
    title: Ability with Can
    description: Use 'can' + base verb. No -s on third person.
    exercises:
      - { type: english_phrases, question: "Eu sei nadar", correctAnswer: i can swim }
      - { type: english_phrases, question: "Ela sabe cozinhar", correctAnswer: she can cook }
      - { type: english_phrases, question: "Eles falam inglês", correctAnswer: they can speak english }
      - { type: english_phrases, question: "Ele sabe dirigir", correctAnswer: he can drive }
      - { type: english_phrases, question: "Nós sabemos dançar", correctAnswer: we can dance }
      - { type: english_phrases, question: "Você consegue ouvir?", correctAnswer: can you hear }
      - { type: english_phrases, question: "Ela consegue ver bem", correctAnswer: she can see well }
      - { type: english_phrases, question: "Eu posso ajudar", correctAnswer: i can help }
      - { type: english_phrases, question: "Você pode tentar", correctAnswer: you can try }
      - { type: english_phrases, question: "Crianças aprendem rápido", correctAnswer: children can learn fast }
  - pageNumber: 2
    title: Cannot / Can't
    description: Inability or prohibition.
    exercises:
      - { type: english_phrases, question: "Eu não sei nadar", correctAnswer: i cannot swim }
      - { type: english_phrases, question: "Ela não sabe dirigir", correctAnswer: she cannot drive }
      - { type: english_phrases, question: "Não consigo ouvir", correctAnswer: i cannot hear }
      - { type: english_phrases, question: "Não conseguimos ir hoje", correctAnswer: we cannot go today }
      - { type: english_phrases, question: "Você não pode entrar", correctAnswer: you cannot come in }
      - { type: english_phrases, question: "Ele não pode trabalhar agora", correctAnswer: he cannot work now }
      - { type: english_phrases, question: "Não posso te ouvir bem", correctAnswer: i cannot hear you well }
      - { type: english_phrases, question: "Eles não conseguem entender", correctAnswer: they cannot understand }
      - { type: english_phrases, question: "Não dá para ver daqui", correctAnswer: you cannot see from here }
      - { type: english_phrases, question: "Ele não sabe ler ainda", correctAnswer: he cannot read yet }
target: 20
