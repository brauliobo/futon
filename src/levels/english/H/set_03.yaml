title: English H - Should & Shouldn't (Advice)
level: H
subject: english
difficulty: 2
objectives: [B1.grammar.modals_advice]
authorNotes: Should + base verb — advice, recommendation, expectation. Negative — shouldn't.
repeatAll: 2
example: "Você deveria estudar → You should study"
pages:
  - pageNumber: 1
    title: Advice and Recommendation
    description: Use 'should' to suggest.
    exercises:
      - { type: english_phrases, question: "Você deveria estudar", correctAnswer: you should study }
      - { type: english_phrases, question: "Ele deveria descansar", correctAnswer: he should rest }
      - { type: english_phrases, question: "Ela deveria ligar para eles", correctAnswer: she should call them }
      - { type: english_phrases, question: "Nós deveríamos ir agora", correctAnswer: we should go now }
      - { type: english_phrases, question: "Você deveria experimentar", correctAnswer: you should try it }
      - { type: english_phrases, question: "Você deveria ver este filme", correctAnswer: you should see this movie }
      - { type: english_phrases, question: "Eles deveriam pedir desculpas", correctAnswer: they should apologize }
      - { type: english_phrases, question: "Eu deveria dormir mais cedo", correctAnswer: i should go to bed earlier }
      - { type: english_phrases, question: "Você deveria beber água", correctAnswer: you should drink water }
      - { type: english_phrases, question: "Ela deveria economizar dinheiro", correctAnswer: she should save money }
  - pageNumber: 2
    title: Shouldn't & Questions
    description: Shouldn't for bad ideas; Should ... ? for seeking advice.
    exercises:
      - { type: english_phrases, question: "Você não deveria fumar", correctAnswer: you should not smoke }
      - { type: english_phrases, question: "Ele não deveria dirigir tão rápido", correctAnswer: he should not drive so fast }
      - { type: english_phrases, question: "Não deveríamos demorar", correctAnswer: we should not take long }
      - { type: english_phrases, question: "Ela não deveria se preocupar", correctAnswer: she should not worry }
      - { type: english_phrases, question: "Eles não deveriam esperar", correctAnswer: they should not wait }
      - { type: english_phrases, question: "Eu deveria ligar?", correctAnswer: should i call }
      - { type: english_phrases, question: "Nós deveríamos começar?", correctAnswer: should we start }
      - { type: english_phrases, question: "O que eu deveria fazer?", correctAnswer: what should i do }
      - { type: english_phrases, question: "Aonde deveríamos ir?", correctAnswer: where should we go }
      - { type: english_phrases, question: "Quando deveríamos sair?", correctAnswer: when should we leave }
target: 20
