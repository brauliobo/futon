title: English H - Should & Shouldn't (Advice)
level: H
subject: english
difficulty: 2
objectives:
  - B1.grammar.modals_advice
authorNotes: Should + base verb — advice, recommendation, expectation. Negative — shouldn't.
repeatAll: 2
example: Você deveria estudar → You should study
pages:
  - pageNumber: 1
    title: Advice and Recommendation
    description: Use 'should' to suggest.
    exercises:
      - type: english_phrases
        question: Você deveria estudar
        correctAnswer: you should study
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele deveria descansar
        correctAnswer: he should rest
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela deveria ligar para eles
        correctAnswer: she should call them
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós deveríamos ir agora
        correctAnswer: we should go now
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você deveria experimentar
        correctAnswer: you should try it
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você deveria ver este filme
        correctAnswer: you should see this movie
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles deveriam pedir desculpas
        correctAnswer: they should apologize
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu deveria dormir mais cedo
        correctAnswer: i should go to bed earlier
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Você deveria beber água
        correctAnswer: you should drink water
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela deveria economizar dinheiro
        correctAnswer: she should save money
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
  - pageNumber: 2
    title: Shouldn't & Questions
    description: Shouldn't for bad ideas; Should ... ? for seeking advice.
    exercises:
      - type: english_phrases
        question: Você não deveria fumar
        correctAnswer: you should not smoke
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ele não deveria dirigir tão rápido
        correctAnswer: he should not drive so fast
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Não deveríamos demorar
        correctAnswer: we should not take long
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Ela não deveria se preocupar
        correctAnswer: she should not worry
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eles não deveriam esperar
        correctAnswer: they should not wait
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Eu deveria ligar?
        correctAnswer: should i call
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Nós deveríamos começar?
        correctAnswer: should we start
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: O que eu deveria fazer?
        correctAnswer: what should i do
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Aonde deveríamos ir?
        correctAnswer: where should we go
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
      - type: english_phrases
        question: Quando deveríamos sair?
        correctAnswer: when should we leave
        rationale: Observe a estrutura da frase (sujeito + verbo + complemento).
target: 20
