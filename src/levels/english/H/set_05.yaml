title: English H - May, Might (Possibility & Permission)
level: H
subject: english
difficulty: 3
objectives: [B1.grammar.modals_possibility]
authorNotes: "'May' and 'might' express possibility. 'May' is also formal permission."
repeatAll: 2
example: "Pode chover → It may rain"
pages:
  - pageNumber: 1
    title: Possibility
    description: "'May / might' + base verb — 'perhaps'."
    exercises:
      - { type: english_phrases, question: "Pode chover", correctAnswer: it may rain }
      - { type: english_phrases, question: "Ela pode vir mais tarde", correctAnswer: she may come later }
      - { type: english_phrases, question: "Talvez eu vá", correctAnswer: i might go }
      - { type: english_phrases, question: "Eles podem estar cansados", correctAnswer: they might be tired }
      - { type: english_phrases, question: "Ele talvez saiba a resposta", correctAnswer: he might know the answer }
      - { type: english_phrases, question: "Pode ser difícil", correctAnswer: it may be difficult }
      - { type: english_phrases, question: "Talvez ela queira ajudar", correctAnswer: she might want to help }
      - { type: english_phrases, question: "Pode acontecer de novo", correctAnswer: it may happen again }
      - { type: english_phrases, question: "Talvez nós cheguemos atrasados", correctAnswer: we might arrive late }
      - { type: english_phrases, question: "Ele pode estar em casa", correctAnswer: he may be at home }
  - pageNumber: 2
    title: Permission
    description: "'May' for formal permission; 'might' mainly literary here."
    exercises:
      - { type: english_phrases, question: "Posso entrar?", correctAnswer: may i come in }
      - { type: english_phrases, question: "Posso te ajudar?", correctAnswer: may i help you }
      - { type: english_phrases, question: "Você pode sair (formal)", correctAnswer: you may leave }
      - { type: english_phrases, question: "Posso fazer uma pergunta?", correctAnswer: may i ask a question }
      - { type: english_phrases, question: "Você pode usar meu carro", correctAnswer: you may use my car }
      - { type: english_phrases, question: "Posso ver seu ingresso?", correctAnswer: may i see your ticket }
      - { type: english_phrases, question: "Os alunos podem sair cedo", correctAnswer: students may leave early }
      - { type: english_phrases, question: "Posso usar seu telefone?", correctAnswer: may i use your phone }
      - { type: english_phrases, question: "Ele pode me acompanhar", correctAnswer: he may come with me }
      - { type: english_phrases, question: "Você pode começar", correctAnswer: you may begin }
target: 20
