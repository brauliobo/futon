title: English H - May, Might (Possibility & Permission)
level: H
subject: english
difficulty: 3
objectives:
  - B1.grammar.modals_possibility
authorNotes: "'May' and 'might' express possibility. 'May' is also formal permission."
repeatAll: 2
example: Pode chover → It may rain
pages:
  - pageNumber: 1
    title: Possibility
    description: "'May / might' + base verb — 'perhaps'."
    exercises:
      - type: english_phrases
        question: Pode chover
        correctAnswer: it may rain
        rationale: "'Might have + particípio' = talvez tenha."
      - type: english_phrases
        question: Ela pode vir mais tarde
        correctAnswer: she may come later
        rationale: "Permissão: 'You may go now'."
      - type: english_phrases
        question: Talvez eu vá
        correctAnswer: i might go
        rationale: "Diferente de 'can': não indica habilidade."
      - type: english_phrases
        question: Eles podem estar cansados
        correctAnswer: they might be tired
        rationale: "Permissão: 'You may go now'."
      - type: english_phrases
        question: Ele talvez saiba a resposta
        correctAnswer: he might know the answer
        rationale: "Pergunta com 'may' soa formal."
      - type: english_phrases
        question: Pode ser difícil
        correctAnswer: it may be difficult
        rationale: "'May' e 'might' = possibilidade."
      - type: english_phrases
        question: Talvez ela queira ajudar
        correctAnswer: she might want to help
        rationale: "'Might' sugere possibilidade um pouco menor."
      - type: english_phrases
        question: Pode acontecer de novo
        correctAnswer: it may happen again
        rationale: "'May' e 'might' = possibilidade."
      - type: english_phrases
        question: Talvez nós cheguemos atrasados
        correctAnswer: we might arrive late
        rationale: "Pergunta com 'may' soa formal."
      - type: english_phrases
        question: Ele pode estar em casa
        correctAnswer: he may be at home
        rationale: "'Might' sugere possibilidade um pouco menor."
  - pageNumber: 2
    title: Permission
    description: "'May' for formal permission; 'might' mainly literary here."
    exercises:
      - type: english_phrases
        question: Posso entrar?
        correctAnswer: may i come in
        rationale: "Permissão: 'You may go now'."
      - type: english_phrases
        question: Posso te ajudar?
        correctAnswer: may i help you
        rationale: "Modal sem 'to' e sem '-s'."
      - type: english_phrases
        question: Você pode sair (formal)
        correctAnswer: you may leave
        rationale: "'Might' sugere possibilidade um pouco menor."
      - type: english_phrases
        question: Posso fazer uma pergunta?
        correctAnswer: may i ask a question
        rationale: "'Might have + particípio' = talvez tenha."
      - type: english_phrases
        question: Você pode usar meu carro
        correctAnswer: you may use my car
        rationale: "Negativa: may not / might not."
      - type: english_phrases
        question: Posso ver seu ingresso?
        correctAnswer: may i see your ticket
        rationale: "'Might have + particípio' = talvez tenha."
      - type: english_phrases
        question: Os alunos podem sair cedo
        correctAnswer: students may leave early
        rationale: "Diferente de 'can': não indica habilidade."
      - type: english_phrases
        question: Posso usar seu telefone?
        correctAnswer: may i use your phone
        rationale: "'Might' sugere possibilidade um pouco menor."
      - type: english_phrases
        question: Ele pode me acompanhar
        correctAnswer: he may come with me
        rationale: "'Might have + particípio' = talvez tenha."
      - type: english_phrases
        question: Você pode começar
        correctAnswer: you may begin
        rationale: "'May' e 'might' = possibilidade."
target: 20
