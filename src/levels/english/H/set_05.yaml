title: English H - May, Might (Possibility & Permission)
level: H
subject: english
difficulty: 3
objectives:
  - B1.grammar.modals_possibility
authorNotes: "'May' and 'might' express possibility. 'May' is also formal permission."
repeatAll: 2
example: Pode chover → It may rain
pages:
  - pageNumber: 1
    title: Possibility
    description: "'May / might' + base verb — 'perhaps'."
    exercises:
      - type: english_phrases
        question: Pode chover
        correctAnswer: It may rain
        rationale: "'May rain' = possibilidade. Clima com 'it'. 'Rain' na base."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Ela pode vir mais tarde
        correctAnswer: She may come later
        rationale: "'May come later' = talvez venha. 'Come' na base após modal."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Talvez eu vá
        correctAnswer: I might go
        rationale: "'Might' = talvez (possibilidade menor que 'may'). 'Go' na base."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Eles podem estar cansados
        correctAnswer: They might be tired
        rationale: "'Might be tired' — 'be' + adjetivo 'tired'. Suposição."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Ele talvez saiba a resposta
        correctAnswer: He might know the answer
        rationale: "'Might know' — 'know' (stative) após modal. 'The answer' específico."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Pode ser difícil
        correctAnswer: It may be difficult
        rationale: "'May be difficult' — 'be' + adjetivo. 'It' sujeito impessoal."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Talvez ela queira ajudar
        correctAnswer: She might want to help
        rationale: "'Might want to' — 'want' pede 'to' + infinitivo 'to help'."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Pode acontecer de novo
        correctAnswer: It may happen again
        rationale: "'May happen again' = possibilidade futura. 'Again' ao final."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Talvez nós cheguemos atrasados
        correctAnswer: We might arrive late
        rationale: "'Might arrive late' — 'late' (advérbio). 'Arrive' na base."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Ele pode estar em casa
        correctAnswer: He may be at home
        rationale: "'May be at home' — 'be' + localização 'at home' (sem 'the')."
        difficulty: 2
        objectives: [B1.grammar.modals_possibility]
  - pageNumber: 2
    title: Permission
    description: "'May' for formal permission; 'might' mainly literary here."
    exercises:
      - type: english_phrases
        question: Posso entrar?
        correctAnswer: May I come in
        rationale: "'May I come in?' — 'may' formal para pedir permissão."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Posso te ajudar?
        correctAnswer: May I help you
        rationale: "'May I help you?' — fórmula educada (atendimento)."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Você pode sair (formal)
        correctAnswer: You may leave
        rationale: "'You may leave' — concessão formal de permissão."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Posso fazer uma pergunta?
        correctAnswer: May I ask a question
        rationale: "'May I ask a question?' — 'a question' (contável singular)."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Você pode usar meu carro
        correctAnswer: You may use my car
        rationale: "'You may use my car' — permissão formal. 'My car' (possessivo)."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Posso ver seu ingresso?
        correctAnswer: May I see your ticket
        rationale: "'May I see your ticket?' — pedido educado formal."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Os alunos podem sair cedo
        correctAnswer: Students may leave early
        rationale: "'Students may leave' — 'students' genérico sem artigo."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Posso usar seu telefone?
        correctAnswer: May I use your phone
        rationale: "'May I use your phone?' — pedido formal. 'Your phone' (possessivo)."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Ele pode me acompanhar
        correctAnswer: He may come with me
        rationale: "'Come with me' = me acompanhar. 'May' dá permissão."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
      - type: english_phrases
        question: Você pode começar
        correctAnswer: You may begin
        rationale: "'You may begin' — autorização formal para iniciar."
        difficulty: 3
        objectives: [B1.grammar.modals_possibility]
target: 20
