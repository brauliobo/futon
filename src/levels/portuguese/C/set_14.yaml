title: Construção de Frases - Períodos Compostos
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Períodos Compostos
    description: Una as orações formando períodos compostos.
    exercises:
      - type: sentence_building
        question: "Una: 'Estudei muito.' + 'Passei na prova.' (usando 'e')"
        correctAnswer: Estudei muito e passei na prova
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
      - type: sentence_building
        question: "Una: 'Queria sair.' + 'Estava chovendo.' (usando 'mas')"
        correctAnswer: Queria sair
        mas estava chovendo: null
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
      - type: sentence_building
        question: "Una: 'Não vim à aula.' + 'Estava doente.' (usando 'porque')"
        correctAnswer: Não vim à aula porque estava doente
        rationale: "Substantivo comum nomeia genericamente — inicial minúscula."
      - type: sentence_building
        question: "Una: 'Chegamos cedo.' + 'A festa já havia começado.' (usando 'porém')"
        correctAnswer: Chegamos cedo
        porém a festa já havia começado: null
        rationale: "Predicado é tudo que se declara sobre o sujeito."
      - type: sentence_building
        question: "Una: 'Ela trabalha muito.' + 'Ganha pouco.' (usando 'embora')"
        correctAnswer: Embora trabalhe muito
        ela ganha pouco: null
        rationale: "Pronome demonstrativo indica posição (este, esse, aquele)."
      - type: sentence_building
        question: "Una: 'O filme era interessante.' + 'Adormecemos.' (usando 'mesmo assim')"
        correctAnswer: O filme era interessante
        mesmo assim adormecemos: null
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
      - type: sentence_building
        question: "Una: 'Correu rapidamente.' + 'Perdeu o ônibus.' (usando 'contudo')"
        correctAnswer: Correu rapidamente
        contudo perdeu o ônibus: null
        rationale: "Locução verbal = verbo auxiliar + principal."
      - type: sentence_building
        question: "Una: 'Choveu muito.' + 'Fomos ao parque.' (usando 'apesar de')"
        correctAnswer: Apesar de ter chovido muito
        fomos ao parque: null
        rationale: "Conjunção adversativa contrasta ideias (mas, porém, contudo)."
      - type: sentence_building
        question: "Una: 'Terminou o trabalho.' + 'Foi descansar.' (usando 'logo')"
        correctAnswer: Terminou o trabalho e logo foi descansar
        rationale: "Pronome demonstrativo indica posição (este, esse, aquele)."
      - type: sentence_building
        question: "Una: 'Não gosta de doces.' + 'Come chocolate.' (usando 'no entanto')"
        correctAnswer: Não gosta de doces
        no entanto come chocolate: null
        rationale: "Conjunção adversativa contrasta ideias (mas, porém, contudo)."
target: 10
