title: Construção de Frases - Crase
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Crase — fusão de 'a + a'. Use antes de palavra feminina que pede artigo (fui à escola)."
pages:
  - pageNumber: 1
    title: Crase
    description: Use ou não use a crase adequadamente.
    exercises:
      - type: sentence_building
        question: Vou ___ escola todos os dias. (a/à)
        correctAnswer: à
        rationale: "Crase (à) ocorre quando há fusão da preposição 'a' com artigo 'a'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Ela se refere ___ pessoas conhecidas. (a/à)
        correctAnswer: a
        rationale: "Crase (à) ocorre quando há fusão da preposição 'a' com artigo 'a'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Assistimos ___ peça de teatro. (a/à)
        correctAnswer: à
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Chegamos ___ uma hora da tarde. (a/à)
        correctAnswer: à
        rationale: "Use crase antes de palavra feminina que aceite artigo 'a'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Ele obedece ___ regras da escola. (as/às)
        correctAnswer: às
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Vamos ___ praia no verão. (a/à)
        correctAnswer: à
        rationale: "Não há crase antes de palavra masculina (a pé, a cavalo)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Ela gosta de ir ___ casa da avó. (a/à)
        correctAnswer: à
        rationale: "Não há crase antes de verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Prefere ___ montanha ao mar. (a/à)
        correctAnswer: a
        rationale: "Não há crase antes de pronome pessoal."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Dedico este livro ___ minha mãe. (a/à)
        correctAnswer: à
        rationale: "Há crase em locuções femininas (à tarde, à noite)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Saímos ___ duas horas. (as/às)
        correctAnswer: às
        rationale: "Há crase em 'à medida que', 'à proporção que'."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
