title: Construção de Frases - Crase
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Crase
    description: Use ou não use a crase adequadamente.
    exercises:
      - type: sentence_building
        question: Vou ___ escola todos os dias. (a/à)
        correctAnswer: à
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
      - type: sentence_building
        question: Ela se refere ___ pessoas conhecidas. (a/à)
        correctAnswer: a
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
      - type: sentence_building
        question: Assistimos ___ peça de teatro. (a/à)
        correctAnswer: à
        rationale: "Adjunto adverbial de tempo responde 'quando'."
      - type: sentence_building
        question: Chegamos ___ uma hora da tarde. (a/à)
        correctAnswer: à
        rationale: "Conjunção aditiva soma ideias (e, nem, também)."
      - type: sentence_building
        question: Ele obedece ___ regras da escola. (as/às)
        correctAnswer: às
        rationale: "Adjunto adverbial de modo responde 'como'."
      - type: sentence_building
        question: Vamos ___ praia no verão. (a/à)
        correctAnswer: à
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
      - type: sentence_building
        question: Ela gosta de ir ___ casa da avó. (a/à)
        correctAnswer: à
        rationale: "Adjunto adverbial de tempo responde 'quando'."
      - type: sentence_building
        question: Prefere ___ montanha ao mar. (a/à)
        correctAnswer: a
        rationale: "Advérbio de modo frequentemente termina em -mente."
      - type: sentence_building
        question: Dedico este livro ___ minha mãe. (a/à)
        correctAnswer: à
        rationale: "Adjetivo concorda em gênero e número com o substantivo."
      - type: sentence_building
        question: Saímos ___ duas horas. (as/às)
        correctAnswer: às
        rationale: "Substantivo comum nomeia genericamente — inicial minúscula."
target: 10
