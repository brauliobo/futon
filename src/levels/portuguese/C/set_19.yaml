title: Construção de Frases - Crase
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Crase — fusão de 'a + a'. Use antes de palavra feminina que pede artigo (fui à escola)."
example: "Pratique construção de frases - crase. Ex.: Vamos ___ praia no verão. → à."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 40
pages:
  - pageNumber: 1
    title: Crase
    description: Use ou não use a crase adequadamente.
    exercises:
      - type: sentence_building
        question: "Vou ___ escola todos os dias. (a/à)"
        correctAnswer: à
        rationale: "Crase (à) ocorre quando há fusão da preposição 'a' com artigo 'a'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Ela se refere ___ pessoas conhecidas. (à/a)
        correctAnswer: a
        rationale: "Sem crase: 'pessoas' (plural indefinido) não pede artigo 'as'; usa-se só a preposição 'a'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Assistimos ___ peça de teatro. (à/a)
        correctAnswer: à
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Chegamos ___ uma hora da tarde. (a/à)"
        correctAnswer: à
        rationale: "Use crase antes de palavra feminina que aceite artigo 'a'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Ele obedece ___ regras da escola. (às/as)
        correctAnswer: às
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Vamos ___ praia no verão. (a/à)"
        correctAnswer: à
        rationale: "'Ir a + a praia' → fusão 'a+a = à'; 'praia' é feminina e pede artigo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Ela gosta de ir ___ casa da avó. (à/a)
        correctAnswer: à
        rationale: "'Casa da avó' é casa específica (com posse) — pede artigo 'a'; 'ir a + a = à'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Prefere ___ montanha ao mar. (à/a)
        correctAnswer: a
        rationale: "'Preferir' é transitivo direto: objeto direto sem preposição → artigo 'a' (sem crase)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Dedico este livro ___ minha mãe. (a/à)"
        correctAnswer: à
        rationale: "'Dedicar a + a minha mãe' → fusão 'a+a = à' antes de feminino com possessivo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Saímos ___ duas horas. (às/as)
        correctAnswer: às
        rationale: "Com horas definidas usa-se crase: 'às duas' (a + as horas) — regra das horas."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
