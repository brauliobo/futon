title: Construção de Frases - Ordem das Palavras
level: C
subject: portuguese
pages:
  - pageNumber: 1
    title: Ordem das Palavras
    description: Organize as palavras na ordem correta para formar frases.
    exercises:
      - { type: sentence_building, question: ""Organize: 'escola / para / vou / a / eu'"", correctAnswer: eu vou para a escola }
      - { type: sentence_building, question: ""Organize: 'gato / o / dorme / sofá / no'"", correctAnswer: o gato dorme no sofá }
      - { type: sentence_building, question: ""Organize: 'livro / interessante / um / li / eu'"", correctAnswer: eu li um livro interessante }
      - { type: sentence_building, question: ""Organize: 'parque / crianças / brincam / as / no'"", correctAnswer: as crianças brincam no parque }
      - { type: sentence_building, question: ""Organize: 'casa / minha / bonita / é / muito'"", correctAnswer: minha casa é muito bonita }
      - { type: sentence_building, question: ""Organize: 'amigos / meus / cinema / foram / ao'"", correctAnswer: meus amigos foram ao cinema }
      - { type: sentence_building, question: ""Organize: 'flores / jardim / no / crescem / as'"", correctAnswer: as flores crescem no jardim }
      - { type: sentence_building, question: ""Organize: 'carro / novo / pai / comprou / meu / um'"", correctAnswer: meu pai comprou um carro novo }
      - { type: sentence_building, question: ""Organize: 'prova / estudantes / fizeram / os / a'"", correctAnswer: os estudantes fizeram a prova }
      - { type: sentence_building, question: ""Organize: 'música / ouvimos / bonita / uma / nós'"", correctAnswer: nós ouvimos uma música bonita }
target: 10
