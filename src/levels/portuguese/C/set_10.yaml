title: Construção de Frases - Tempos Verbais
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Tempos verbais na frase — presente, pretérito, futuro. Consistência temporal no texto."
example: "Pratique construção de frases - tempos verbais. Ex.: Ontem eu ___ ao cinema. → fui."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 40
pages:
  - pageNumber: 1
    title: Tempos Verbais
    description: Escolha o tempo verbal correto para cada situação.
    exercises:
      - type: sentence_building
        question: Ontem eu ___ ao cinema. (fui/irei/vou)
        correctAnswer: fui
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Amanhã nós ___ de viagem. (partíamos/partiremos/partimos)
        correctAnswer: partiremos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Agora elas ___ na escola. (estavam/estarão/estão)
        correctAnswer: estão
        rationale: "Com 'eles/elas' o verbo vai na 3ª pessoa do plural."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: No ano passado ele ___ português. (aprenderá/aprendeu/aprende)
        correctAnswer: aprendeu
        rationale: "Tempo verbal situa a ação no tempo (presente, passado ou futuro)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Todos os dias eu ___ exercícios. (fiz/farei/faço)
        correctAnswer: faço
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Na semana que vem você ___ seus amigos. (visitará/visita/visitou)
        correctAnswer: visitará
        rationale: "Adjetivo concorda em gênero e número com o substantivo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Quando criança, nós ___ muito. (brincávamos/brincamos/brincaremos)
        correctAnswer: brincávamos
        rationale: "O tempo responde 'quando' ocorreu a ação."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Neste momento ela ___ um livro. (lê/leu/lerá)
        correctAnswer: lê
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Daqui a pouco eles ___ o trabalho. (terminaram/terminam/terminarão)
        correctAnswer: terminarão
        rationale: "Com 'eles/elas' o verbo vai na 3ª pessoa do plural."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Sempre nós ___ juntos. (jantamos/jantávamos/jantaremos)
        correctAnswer: jantamos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
