title: Construção de Frases - Tempos Verbais
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Tempos Verbais
    description: Escolha o tempo verbal correto para cada situação.
    exercises:
      - type: sentence_building
        question: Ontem eu ___ ao cinema. (vou/fui/irei)
        correctAnswer: fui
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Amanhã nós ___ de viagem. (partimos/partimos/partiremos)
        correctAnswer: partiremos
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Agora elas ___ na escola. (estão/estavam/estarão)
        correctAnswer: estão
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: No ano passado ele ___ português. (aprende/aprendeu/aprenderá)
        correctAnswer: aprendeu
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Todos os dias eu ___ exercícios. (faço/fiz/farei)
        correctAnswer: faço
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Na semana que vem você ___ seus amigos. (visita/visitou/visitará)
        correctAnswer: visitará
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Quando criança, nós ___ muito. (brincamos/brincávamos/brincaremos)
        correctAnswer: brincávamos
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Neste momento ela ___ um livro. (lê/leu/lerá)
        correctAnswer: lê
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Daqui a pouco eles ___ o trabalho. (terminam/terminaram/terminarão)
        correctAnswer: terminarão
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Sempre nós ___ juntos. (jantamos/jantávamos/jantaremos)
        correctAnswer: jantamos
        rationale: Combine sujeito, verbo e complemento na ordem correta.
target: 10
