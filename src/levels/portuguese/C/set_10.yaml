title: Construção de Frases - Tempos Verbais
level: C
subject: portuguese
pages:
  - pageNumber: 1
    title: Tempos Verbais
    description: Escolha o tempo verbal correto para cada situação.
    exercises:
      - { type: sentence_building, question: "Ontem eu ___ ao cinema. (vou/fui/irei)", correctAnswer: fui }
      - { type: sentence_building, question: "Amanhã nós ___ de viagem. (partimos/partimos/partiremos)", correctAnswer: partiremos }
      - { type: sentence_building, question: "Agora elas ___ na escola. (estão/estavam/estarão)", correctAnswer: estão }
      - { type: sentence_building, question: "No ano passado ele ___ português. (aprende/aprendeu/aprenderá)", correctAnswer: aprendeu }
      - { type: sentence_building, question: "Todos os dias eu ___ exercícios. (faço/fiz/farei)", correctAnswer: faço }
      - { type: sentence_building, question: "Na semana que vem você ___ seus amigos. (visita/visitou/visitará)", correctAnswer: visitará }
      - { type: sentence_building, question: "Quando criança, nós ___ muito. (brincamos/brincávamos/brincaremos)", correctAnswer: brincávamos }
      - { type: sentence_building, question: "Neste momento ela ___ um livro. (lê/leu/lerá)", correctAnswer: lê }
      - { type: sentence_building, question: "Daqui a pouco eles ___ o trabalho. (terminam/terminaram/terminarão)", correctAnswer: terminarão }
      - { type: sentence_building, question: "Sempre nós ___ juntos. (jantamos/jantávamos/jantaremos)", correctAnswer: jantamos }
target: 10
