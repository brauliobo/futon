title: Construção de Frases - Tipos de Frase
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Tipos de Frase
    description: Identifique o tipo de frase apresentada.
    exercises:
      - type: sentence_building
        question: "'Você gosta de sorvete?' é uma frase (declarativa/interrogativa/exclamativa)"
        correctAnswer: interrogativa
        rationale: "Frase exclamativa termina em ponto de exclamação."
      - type: sentence_building
        question: "'Que dia lindo!' é uma frase (declarativa/interrogativa/exclamativa)"
        correctAnswer: exclamativa
        rationale: "Frase declarativa termina em ponto final e afirma um fato."
      - type: sentence_building
        question: "'O livro está na mesa.' é uma frase (declarativa/interrogativa/exclamativa)"
        correctAnswer: declarativa
        rationale: "Frase declarativa termina em ponto final e afirma um fato."
      - type: sentence_building
        question: "'Feche a porta, por favor.' é uma frase (imperativa/interrogativa/exclamativa)"
        correctAnswer: imperativa
        rationale: "Frase interrogativa termina em ponto de interrogação."
      - type: sentence_building
        question: "'Onde você mora?' é uma frase (declarativa/interrogativa/exclamativa)"
        correctAnswer: interrogativa
        rationale: "Frase exclamativa termina em ponto de exclamação."
      - type: sentence_building
        question: "'Cuidado com o degrau!' é uma frase (imperativa/interrogativa/exclamativa)"
        correctAnswer: exclamativa
        rationale: "Frase exclamativa termina em ponto de exclamação."
      - type: sentence_building
        question: "'As flores estão bonitas.' é uma frase (declarativa/interrogativa/imperativa)"
        correctAnswer: declarativa
        rationale: "Frase declarativa termina em ponto final e afirma um fato."
      - type: sentence_building
        question: "'Não corra na escada.' é uma frase (imperativa/interrogativa/exclamativa)"
        correctAnswer: imperativa
        rationale: "Frase interrogativa termina em ponto de interrogação."
      - type: sentence_building
        question: "'Como você se chama?' é uma frase (declarativa/interrogativa/exclamativa)"
        correctAnswer: interrogativa
        rationale: "Frase interrogativa termina em ponto de interrogação."
      - type: sentence_building
        question: "'Que susto levei!' é uma frase (declarativa/interrogativa/exclamativa)"
        correctAnswer: exclamativa
        rationale: "Conjunção adversativa contrasta ideias (mas, porém, contudo)."
target: 10
