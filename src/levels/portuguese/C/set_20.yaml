title: Construção de Frases - Revisão Geral
level: C
subject: portuguese
difficulty: 3
objectives: [pt.sentence_building]
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Revisão Geral
    description: Revisão de todos os conceitos estudados em construção de frases.
    exercises:
      - { type: sentence_building, question: "Complete: 'Os meninos ___ brincando no parque.' (está/estão/estamos)", correctAnswer: estão }
      - { type: sentence_building, question: "Organize: 'livro / interessante / um / li / eu'", correctAnswer: eu li um livro interessante }
      - { type: sentence_building, question: "'Que dia maravilhoso!' é uma frase (declarativa/interrogativa/exclamativa)", correctAnswer: exclamativa }
      - { type: sentence_building, question: "Complete: 'Estudei ___ passei na prova.' (e/mas/ou)", correctAnswer: e }
      - { type: sentence_building, question: "Substitua: 'As meninas cantam.' ___ cantam. (Ela/Elas/Eles)", correctAnswer: Elas }
      - { type: sentence_building, question: "Complete: 'Ontem eu ___ ao médico.' (vou/fui/irei)", correctAnswer: fui }
      - { type: sentence_building, question: "João disse: 'Estou cansado.' (discurso indireto)", correctAnswer: João disse que estava cansado }
      - { type: sentence_building, question: "Complete: 'Gosto ___ música clássica.' (de/em/com)", correctAnswer: de }
      - { type: sentence_building, question: "Complete: 'A___ menina___ estudiosa___.' (s/s)", correctAnswer: A menina estudiosa }
      - { type: sentence_building, question: "Complete: 'Vou ___ escola.' (a/à)", correctAnswer: à }
target: 10
