title: Construção de Frases - Revisão Geral
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Pratique construção de frases - revisão geral."
pages:
  - pageNumber: 1
    title: Revisão Geral
    description: Revisão de todos os conceitos estudados em construção de frases.
    exercises:
      - type: sentence_building
        question: "Complete: 'Os meninos ___ brincando no parque.' (está/estão/estamos)"
        correctAnswer: estão
        rationale: "Verbo concorda com o sujeito: 'meninos' (3ª pessoa plural) → 'estão'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Organize: 'livro / interessante / um / li / eu'"
        correctAnswer: eu li um livro interessante
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Que dia maravilhoso!' é uma frase (declarativa/interrogativa/exclamativa)"
        correctAnswer: exclamativa
        rationale: "Frase exclamativa expressa emoção e termina em ponto de exclamação (!)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Complete: 'Estudei ___ passei na prova.' (e/mas/ou)"
        correctAnswer: e
        rationale: "'E' é conjunção aditiva — liga ideias que se somam: estudou E passou."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Substitua: 'As meninas cantam.' ___ cantam. (Ela/Elas/Eles)"
        correctAnswer: Elas
        rationale: "Pronome concorda com o substantivo: 'meninas' (fem. plural) → 'Elas'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Complete: 'Ontem eu ___ ao médico.' (vou/fui/irei)"
        correctAnswer: fui
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Discurso indireto de 'João disse: Estou cansado': (João disse que estava cansado/João disse que está cansado/João disse que estará cansado)"
        correctAnswer: João disse que estava cansado
        rationale: "Discurso indireto reproduz fala sem aspas, usando 'que/se'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Complete: 'Gosto ___ música clássica.' (de/em/com)"
        correctAnswer: de
        rationale: "Regência verbal: 'gostar' exige a preposição 'de'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "A menina é ___. (estudiosa/estudiosas/estudioso)"
        correctAnswer: estudiosa
        rationale: "Adjetivo concorda com o substantivo: 'menina' (fem. singular) → 'estudiosa'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Complete: 'Vou ___ escola.' (a/à)"
        correctAnswer: à
        rationale: "Crase (à) ocorre quando há fusão da preposição 'a' com artigo 'a'."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
