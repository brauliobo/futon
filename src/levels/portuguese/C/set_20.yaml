title: Construção de Frases - Revisão Geral
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Revisão Geral
    description: Revisão de todos os conceitos estudados em construção de frases.
    exercises:
      - type: sentence_building
        question: "Complete: 'Os meninos ___ brincando no parque.' (está/estão/estamos)"
        correctAnswer: estão
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
      - type: sentence_building
        question: "Organize: 'livro / interessante / um / li / eu'"
        correctAnswer: eu li um livro interessante
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: sentence_building
        question: "'Que dia maravilhoso!' é uma frase (declarativa/interrogativa/exclamativa)"
        correctAnswer: exclamativa
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: sentence_building
        question: "Complete: 'Estudei ___ passei na prova.' (e/mas/ou)"
        correctAnswer: e
        rationale: "'Mas' é conjunção adversativa — liga ideias opostas."
      - type: sentence_building
        question: "Substitua: 'As meninas cantam.' ___ cantam. (Ela/Elas/Eles)"
        correctAnswer: Elas
        rationale: "Adjetivo concorda em gênero e número com o substantivo."
      - type: sentence_building
        question: "Complete: 'Ontem eu ___ ao médico.' (vou/fui/irei)"
        correctAnswer: fui
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
      - type: sentence_building
        question: "João disse: 'Estou cansado.' (discurso indireto)"
        correctAnswer: João disse que estava cansado
        rationale: "Discurso indireto reproduz fala sem aspas, usando 'que/se'."
      - type: sentence_building
        question: "Complete: 'Gosto ___ música clássica.' (de/em/com)"
        correctAnswer: de
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: sentence_building
        question: "Complete: 'A___ menina___ estudiosa___.' (s/s)"
        correctAnswer: A menina estudiosa
        rationale: "Pronome possessivo indica posse (meu, teu, seu)."
      - type: sentence_building
        question: "Complete: 'Vou ___ escola.' (a/à)"
        correctAnswer: à
        rationale: "Crase (à) ocorre quando há fusão da preposição 'a' com artigo 'a'."
target: 10
