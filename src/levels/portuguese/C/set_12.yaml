title: Construção de Frases - Figuras de Linguagem
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Figuras de linguagem — metáfora, metonímia, hipérbole. Efeitos de sentido no texto."
example: "Pratique construção de frases - figuras de linguagem. Ex.: 'Seus olhos são duas estrelas.' é → metáfora."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 40
pages:
  - pageNumber: 1
    title: Figuras de Linguagem
    description: Identifique a figura de linguagem presente em cada frase.
    exercises:
      - type: sentence_building
        question: "'Seus olhos são duas estrelas.' é (hipérbole/metáfora/personificação)"
        correctAnswer: metáfora
        rationale: "Metáfora é comparação implícita, sem conectivo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'O vento sussurrava segredos.' é (personificação/metáfora/hipérbole)"
        correctAnswer: personificação
        rationale: "Metáfora é comparação implícita, sem conectivo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Morreu de tanto rir.' é (hipérbole/personificação/metáfora)"
        correctAnswer: hipérbole
        rationale: "Comparação (símile) usa conectivo (como, tal qual)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Pedro é um leão na defesa.' é (símile/personificação/metáfora)"
        correctAnswer: metáfora
        rationale: "Metonímia substitui um termo por outro ligado (autor pela obra)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Ela é forte como um touro.' é (hipérbole/símile/metáfora)"
        correctAnswer: símile
        rationale: "O modo responde 'como' a ação aconteceu."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'As árvores dançavam no vento.' é (hipérbole/metáfora/personificação)"
        correctAnswer: personificação
        rationale: "Personificação atribui ações humanas a seres inanimados."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Chorei rios de lágrimas.' é (símile/hipérbole/metáfora)"
        correctAnswer: hipérbole
        rationale: "Hipérbole é exagero expressivo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'A vida é uma viagem.' é (personificação/símile/metáfora)"
        correctAnswer: metáfora
        rationale: "Ironia diz o oposto do que se pensa."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Veloz como o vento.' é (símile/hipérbole/metáfora)"
        correctAnswer: símile
        rationale: "O modo responde 'como' a ação aconteceu."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'O mar cantava uma melodia triste.' é (personificação/metáfora/hipérbole)"
        correctAnswer: personificação
        rationale: "Antítese aproxima ideias contrárias."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
