title: Construção de Frases - Figuras de Linguagem
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Figuras de Linguagem
    description: Identifique a figura de linguagem presente em cada frase.
    exercises:
      - type: sentence_building
        question: "'Seus olhos são duas estrelas.' é (metáfora/hipérbole/personificação)"
        correctAnswer: metáfora
        rationale: "Adjunto adverbial de tempo responde 'quando'."
      - type: sentence_building
        question: "'O vento sussurrava segredos.' é (metáfora/hipérbole/personificação)"
        correctAnswer: personificação
        rationale: "Adjunto adverbial de lugar responde 'onde'."
      - type: sentence_building
        question: "'Morreu de tanto rir.' é (metáfora/hipérbole/personificação)"
        correctAnswer: hipérbole
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
      - type: sentence_building
        question: "'Pedro é um leão na defesa.' é (metáfora/símile/personificação)"
        correctAnswer: metáfora
        rationale: "Adjunto adverbial de tempo responde 'quando'."
      - type: sentence_building
        question: "'Ela é forte como um touro.' é (metáfora/símile/hipérbole)"
        correctAnswer: símile
        rationale: "Advérbio de modo frequentemente termina em -mente."
      - type: sentence_building
        question: "'As árvores dançavam no vento.' é (metáfora/hipérbole/personificação)"
        correctAnswer: personificação
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: sentence_building
        question: "'Chorei rios de lágrimas.' é (metáfora/hipérbole/símile)"
        correctAnswer: hipérbole
        rationale: "Conjunção aditiva soma ideias (e, nem, também)."
      - type: sentence_building
        question: "'A vida é uma viagem.' é (metáfora/símile/personificação)"
        correctAnswer: metáfora
        rationale: "Artigo definido (o, a, os, as) particulariza o substantivo."
      - type: sentence_building
        question: "'Veloz como o vento.' é (metáfora/símile/hipérbole)"
        correctAnswer: símile
        rationale: "Predicado é tudo que se declara sobre o sujeito."
      - type: sentence_building
        question: "'O mar cantava uma melodia triste.' é (metáfora/hipérbole/personificação)"
        correctAnswer: personificação
        rationale: "Adjunto adverbial de modo responde 'como'."
target: 10
