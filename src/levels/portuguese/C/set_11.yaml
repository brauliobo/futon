title: Construção de Frases - Vozes Verbais
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Vozes Verbais
    description: Transforme as frases da voz ativa para a voz passiva ou vice-versa.
    exercises:
      - type: sentence_building
        question: "'O menino quebrou o vaso.' Na voz passiva: 'O vaso ___ pelo menino.'"
        correctAnswer: foi quebrado
        rationale: "Pronome pessoal reto funciona como sujeito."
      - type: sentence_building
        question: "'A professora corrigiu as provas.' Na voz passiva: 'As provas ___ pela professora.'"
        correctAnswer: foram corrigidas
        rationale: "Sujeito simples tem um núcleo; composto tem dois ou mais."
      - type: sentence_building
        question: "'Os livros foram lidos pelos alunos.' Na voz ativa: '___ leram os livros.'"
        correctAnswer: Os alunos
        rationale: "Adjunto adverbial de modo responde 'como'."
      - type: sentence_building
        question: "'Maria pintou o quadro.' Na voz passiva: 'O quadro ___ por Maria.'"
        correctAnswer: foi pintado
        rationale: "Locução verbal = verbo auxiliar + principal."
      - type: sentence_building
        question: "'A carta foi escrita por João.' Na voz ativa: '___ escreveu a carta.'"
        correctAnswer: João
        rationale: "Artigo definido (o, a, os, as) particulariza o substantivo."
      - type: sentence_building
        question: "'O gato bebeu o leite.' Na voz passiva: 'O leite ___ pelo gato.'"
        correctAnswer: foi bebido
        rationale: "Pronome possessivo indica posse (meu, teu, seu)."
      - type: sentence_building
        question: "'As flores foram regadas pela jardineira.' Na voz ativa: '___ regou as flores.'"
        correctAnswer: A jardineira
        rationale: "Adjunto adverbial de modo responde 'como'."
      - type: sentence_building
        question: "'Pedro construiu a casa.' Na voz passiva: 'A casa ___ por Pedro.'"
        correctAnswer: foi construída
        rationale: "Locução verbal = verbo auxiliar + principal."
      - type: sentence_building
        question: "'O bolo foi feito pela vovó.' Na voz ativa: '___ fez o bolo.'"
        correctAnswer: A vovó
        rationale: "Adjetivo concorda em gênero e número com o substantivo."
      - type: sentence_building
        question: "'Ana vendeu o carro.' Na voz passiva: 'O carro ___ por Ana.'"
        correctAnswer: foi vendido
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
target: 10
