title: Construção de Frases - Orações Subordinadas
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Orações subordinadas — substantivas, adjetivas, adverbiais. Função sintática na oração principal."
pages:
  - pageNumber: 1
    title: Orações Subordinadas
    description: Complete as frases com orações subordinadas adequadas.
    exercises:
      - type: sentence_building
        question: Espero ___ você venha à festa. (que/quando/se)
        correctAnswer: que
        rationale: "O tempo responde 'quando' ocorreu a ação."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Não sei ___ ela chegará. (que/quando/onde)
        correctAnswer: quando
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: ___ estudar, você passará na prova. (Se/Que/Como)
        correctAnswer: Se
        rationale: "O modo responde 'como' a ação aconteceu."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: A casa ___ moro é pequena. (que/onde/quando)
        correctAnswer: onde
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: O livro ___ li era interessante. (que/onde/quando)
        correctAnswer: que
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: ___ chegou, todos se alegraram. (Quando/Que/Se)
        correctAnswer: Quando
        rationale: "O tempo responde 'quando' ocorreu a ação."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Não encontro ___ coloquei as chaves. (que/onde/quando)
        correctAnswer: onde
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: ___ faz frio, uso casaco. (Sempre que/Que/Se)
        correctAnswer: Sempre que
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: É importante ___ você descanse. (que/onde/quando)
        correctAnswer: que
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: O menino ___ brinca aqui é meu vizinho. (que/onde/quando)
        correctAnswer: que
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
