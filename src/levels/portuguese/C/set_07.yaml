title: Construção de Frases - Conectivos
level: C
subject: portuguese
pages:
  - pageNumber: 1
    title: Conectivos
    description: Complete as frases com o conectivo adequado.
    exercises:
      - type: sentence_building
        question: "Estudei muito ___ passei na prova. (e/mas/ou)"
        correctAnswer: e
      - type: sentence_building
        question: "Queria sair, ___ estava chovendo. (e/mas/porque)"
        correctAnswer: mas
      - type: sentence_building
        question: "Não fui à escola ___ estava doente. (e/mas/porque)"
        correctAnswer: porque
      - type: sentence_building
        question: "Você prefere café ___ chá? (e/mas/ou)"
        correctAnswer: ou
      - type: sentence_building
        question: "Ela é inteligente ___ estudiosa. (e/mas/ou)"
        correctAnswer: e
      - type: sentence_building
        question: "O filme era bom, ___ muito longo. (e/mas/porque)"
        correctAnswer: mas
      - type: sentence_building
        question: "Ficamos em casa ___ fazia frio. (e/mas/porque)"
        correctAnswer: porque
      - type: sentence_building
        question: "Podemos ir ao parque ___ ao cinema. (e/mas/ou)"
        correctAnswer: ou
      - type: sentence_building
        question: "Correu muito ___ chegou na hora. (e/mas/porque)"
        correctAnswer: e
      - type: sentence_building
        question: "Tentei ligar, ___ ninguém atendeu. (e/mas/porque)"
        correctAnswer: mas
target: 10
