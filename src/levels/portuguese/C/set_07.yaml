title: Construção de Frases - Conectivos
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Conectivos (e, mas, porque, embora). Estabelecem relação entre ideias."
example: "Pratique construção de frases - conectivos. Ex.: Estudei muito ___ passei na prova. → e."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 40
pages:
  - pageNumber: 1
    title: Conectivos
    description: Complete as frases com o conectivo adequado.
    exercises:
      - type: sentence_building
        question: Estudei muito ___ passei na prova. (ou/e/mas)
        correctAnswer: e
        rationale: "O verbo concorda com o sujeito: 'e'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Queria sair, ___ estava chovendo. (e/mas/porque)
        correctAnswer: mas
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Não fui à escola ___ estava doente. (porque/mas/e)
        correctAnswer: porque
        rationale: "Adjunto adverbial de lugar responde 'onde'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Você prefere café ___ chá? (ou/e/mas)
        correctAnswer: ou
        rationale: "Adjunto adverbial de lugar responde 'onde'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Ela é inteligente ___ estudiosa. (e/ou/mas)
        correctAnswer: e
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: O filme era bom, ___ muito longo. (porque/e/mas)
        correctAnswer: mas
        rationale: "Artigo indefinido (um, uma, uns, umas) generaliza."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Ficamos em casa ___ fazia frio. (mas/porque/e)
        correctAnswer: porque
        rationale: "Pronome possessivo indica posse (meu, teu, seu)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Podemos ir ao parque ___ ao cinema. (mas/ou/e)
        correctAnswer: ou
        rationale: "O verbo concorda com o sujeito: 'ou'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Correu muito ___ chegou na hora. (e/porque/mas)
        correctAnswer: e
        rationale: "Artigo indefinido (um, uma, uns, umas) generaliza."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Tentei ligar, ___ ninguém atendeu. (mas/porque/e)
        correctAnswer: mas
        rationale: "Predicado é tudo que se declara sobre o sujeito."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
