title: Construção de Frases - Concordância Nominal
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Concordância nominal — artigo, adjetivo e numeral concordam com o substantivo."
example: "Pratique construção de frases - concordância nominal. Ex.: A menina ___. → inteligente."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 40
pages:
  - pageNumber: 1
    title: Concordância Nominal
    description: Faça a concordância nominal correta.
    exercises:
      - type: sentence_building
        question: "A menina ___. (inteligente/inteligentes)"
        correctAnswer: inteligente
        rationale: "Adjetivo concorda em número com o substantivo: 'menina' (singular) → 'inteligente' (singular)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Os meninos ___. (estudiosos/estudiosas/estudioso)"
        correctAnswer: estudiosos
        rationale: "Adjetivo concorda em gênero e número: 'meninos' (masc. plural) → 'estudiosos' (masc. plural)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "As flores são ___. (bonitas/bonita/bonitos)"
        correctAnswer: bonitas
        rationale: "Adjetivo concorda em gênero e número: 'flores' (fem. plural) → 'bonitas' (fem. plural)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "___ casa é grande. (A/Os/O)"
        correctAnswer: A
        rationale: "Artigo concorda em gênero: 'casa' (feminino) → 'A' (artigo feminino)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Muito ___, disse ela. (obrigada/obrigado/obrigados)"
        correctAnswer: obrigada
        rationale: "'Obrigado' concorda com quem fala: ela (feminino) → 'obrigada'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Ela ___ fez o trabalho. (mesmo/mesmas/mesma)"
        correctAnswer: mesma
        rationale: "'Mesmo' concorda com o sujeito: 'ela' (feminino singular) → 'mesma'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "É ___ entrada. (proibido/proibida)"
        correctAnswer: proibido
        rationale: "Sem artigo determinando o substantivo, predicativo fica no masculino singular: 'É proibido entrada'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Água gelada é ___. (boas/bom/boa)"
        correctAnswer: boa
        rationale: "Com artigo ('A água'), predicativo concorda: feminino → 'boa'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "Ele está ___ nervoso. (meios/meia/meio)"
        correctAnswer: meio
        rationale: "'Meio' como advérbio (= um pouco) é invariável: 'meio nervoso'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "___ seguem as fotos. (Anexas/Anexos/Anexo)"
        correctAnswer: Anexas
        rationale: "'Anexo' concorda com o substantivo: 'fotos' (fem. plural) → 'Anexas'."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
