title: Construção de Frases - Concordância Nominal
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Concordância Nominal
    description: Faça a concordância nominal correta.
    exercises:
      - type: sentence_building
        question: A___ menina___ inteligente___. (s/s/s)
        correctAnswer: A menina inteligente
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
      - type: sentence_building
        question: Os menino___ estudioso___. (s/s)
        correctAnswer: Os meninos estudiosos
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: sentence_building
        question: As flor___ bonita___. (es/as)
        correctAnswer: As flores bonitas
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: sentence_building
        question: O___ casa___ grande___. (A/A)
        correctAnswer: A casa grande
        rationale: "Crase (à) ocorre quando há fusão da preposição 'a' com artigo 'a'."
      - type: sentence_building
        question: Muito___ obrigad___ (disse ela). (a/a)
        correctAnswer: Muito obrigada
        rationale: "Crase (à) ocorre quando há fusão da preposição 'a' com artigo 'a'."
      - type: sentence_building
        question: Ela___ mesm___ fez o trabalho. (a/a)
        correctAnswer: Ela mesma
        rationale: "Crase (à) ocorre quando há fusão da preposição 'a' com artigo 'a'."
      - type: sentence_building
        question: É proibid___ entrada. (o/a)
        correctAnswer: É proibido entrada
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: sentence_building
        question: Agua gelad___ é bom___. (a/a)
        correctAnswer: Água gelada é boa
        rationale: "Crase (à) ocorre quando há fusão da preposição 'a' com artigo 'a'."
      - type: sentence_building
        question: Meia___ nervos___ (disse ele). (o/o)
        correctAnswer: Meio nervoso
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: sentence_building
        question: Anexo___ segue___ as foto___. (as/s)
        correctAnswer: Anexas seguem as fotos
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
target: 10
