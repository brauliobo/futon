title: Tipos de Frases
level: C
subject: portuguese
example: "Frases declarativas, interrogativas, exclamativas e imperativas."
pages:
  - pageNumber: 1
    title: Identificando Tipos
    description: Qual tipo de frase?
    exercises:
      - { type: grammar, question: "'O sol brilha.' é (declarativa/interrogativa/exclamativa)", correctAnswer: declarativa }
      - { type: grammar, question: "'Que sol lindo!' é (declarativa/interrogativa/exclamativa)", correctAnswer: exclamativa }
      - { type: grammar, question: "'Onde você está?' é (declarativa/interrogativa/exclamativa)", correctAnswer: interrogativa }
      - { type: grammar, question: "'Venha aqui.' é (declarativa/imperativa/exclamativa)", correctAnswer: imperativa }
      - { type: grammar, question: "'Eu gosto de música.' é (declarativa/interrogativa/exclamativa)", correctAnswer: declarativa }
      - { type: grammar, question: "'Que susto!' é (declarativa/interrogativa/exclamativa)", correctAnswer: exclamativa }
      - { type: grammar, question: "'Quantos anos você tem?' é (declarativa/interrogativa/exclamativa)", correctAnswer: interrogativa }
      - { type: grammar, question: "'Fique em silêncio!' é (imperativa/interrogativa/declarativa)", correctAnswer: imperativa }
      - { type: grammar, question: "'A lua está cheia.' é (declarativa/interrogativa/exclamativa)", correctAnswer: declarativa }
      - { type: grammar, question: "'Que alegria!' é (declarativa/interrogativa/exclamativa)", correctAnswer: exclamativa }
  - pageNumber: 2
    title: Pontuação Correta
    description: Complete com ponto final (.), interrogação (?) ou exclamação (!).
    exercises:
      - { type: grammar, question: "Pergunta termina com (./?/!)", correctAnswer: "?" }
      - { type: grammar, question: "Exclamação termina com (./?/!)", correctAnswer: "!" }
      - { type: grammar, question: "Declaração termina com (./?/!)", correctAnswer: "." }
      - { type: grammar, question: "'Que legal' — qual pontuação? (./?/!)", correctAnswer: "!" }
      - { type: grammar, question: "'Como vai' — qual pontuação? (./?/!)", correctAnswer: "?" }
      - { type: grammar, question: "'Hoje choveu' — qual pontuação? (./?/!)", correctAnswer: "." }
      - { type: grammar, question: "'Olhe lá' — imperativa, qual pontuação? (./?/!)", correctAnswer: "." }
      - { type: grammar, question: "'Socorro' — qual pontuação? (./?/!)", correctAnswer: "!" }
      - { type: grammar, question: "'O que é isto' — qual pontuação? (./?/!)", correctAnswer: "?" }
      - { type: grammar, question: "'Parabéns' — qual pontuação? (./?/!)", correctAnswer: "!" }
  - pageNumber: 3
    title: Transformando Frases
    description: Transforme de um tipo para outro.
    exercises:
      - { type: grammar, question: "Transforme 'Você gosta.' em pergunta: (Você gosta?/Gosta você!/Você gosta)", correctAnswer: "Você gosta?" }
      - { type: grammar, question: "Transforme 'O dia está bonito.' em exclamação: (O dia está bonito!/É bonito o dia?/O dia está bonito.)", correctAnswer: "O dia está bonito!" }
      - { type: grammar, question: "Interrogativa: 'Que horas são' falta: (?/!/.)", correctAnswer: "?" }
      - { type: grammar, question: "Exclamativa: 'Que dia lindo' falta: (?/!/.)", correctAnswer: "!" }
      - { type: grammar, question: "Transforme 'Ele chegou.' em pergunta: (Ele chegou?/Chegou ele./Ele chegou!)", correctAnswer: "Ele chegou?" }
      - { type: grammar, question: "Transforme 'Estamos felizes.' em exclamação: (Estamos felizes!/Estamos felizes?/Estamos felizes.)", correctAnswer: "Estamos felizes!" }
      - { type: grammar, question: "Imperativa: mandar fazer silêncio: (Silêncio!/Silêncio?/O silêncio.)", correctAnswer: "Silêncio!" }
      - { type: grammar, question: "Imperativa: mandar sentar: (Sente-se./Sente-se?/Você senta?)", correctAnswer: "Sente-se." }
      - { type: grammar, question: "A pergunta usa qual palavra? (onde/aqui/sempre)", correctAnswer: "onde" }
      - { type: grammar, question: "A exclamação expressa: (emoção/fato/pergunta)", correctAnswer: "emoção" }
target: 30
