title: Tipos de Frases
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
example: Frases declarativas, interrogativas, exclamativas e imperativas.
pages:
  - pageNumber: 1
    title: Identificando Tipos
    description: Qual tipo de frase?
    exercises:
      - type: grammar
        question: "'O sol brilha.' é (declarativa/interrogativa/exclamativa)"
        correctAnswer: declarativa
        rationale: "Frase exclamativa termina em ponto de exclamação."
      - type: grammar
        question: "'Que sol lindo!' é (declarativa/interrogativa/exclamativa)"
        correctAnswer: exclamativa
        rationale: "Frase declarativa termina em ponto final e afirma um fato."
      - type: grammar
        question: "'Onde você está?' é (declarativa/interrogativa/exclamativa)"
        correctAnswer: interrogativa
        rationale: "Frase declarativa termina em ponto final e afirma um fato."
      - type: grammar
        question: "'Venha aqui.' é (declarativa/imperativa/exclamativa)"
        correctAnswer: imperativa
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
      - type: grammar
        question: "'Eu gosto de música.' é (declarativa/interrogativa/exclamativa)"
        correctAnswer: declarativa
        rationale: "Frase declarativa termina em ponto final e afirma um fato."
      - type: grammar
        question: "'Que susto!' é (declarativa/interrogativa/exclamativa)"
        correctAnswer: exclamativa
        rationale: "Frase interrogativa termina em ponto de interrogação."
      - type: grammar
        question: "'Quantos anos você tem?' é (declarativa/interrogativa/exclamativa)"
        correctAnswer: interrogativa
        rationale: "Frase exclamativa termina em ponto de exclamação."
      - type: grammar
        question: "'Fique em silêncio!' é (imperativa/interrogativa/declarativa)"
        correctAnswer: imperativa
        rationale: "Frase interrogativa termina em ponto de interrogação."
      - type: grammar
        question: "'A lua está cheia.' é (declarativa/interrogativa/exclamativa)"
        correctAnswer: declarativa
        rationale: "Frase exclamativa termina em ponto de exclamação."
      - type: grammar
        question: "'Que alegria!' é (declarativa/interrogativa/exclamativa)"
        correctAnswer: exclamativa
        rationale: "Frase interrogativa termina em ponto de interrogação."
  - pageNumber: 2
    title: Pontuação Correta
    description: Complete com ponto final (.), interrogação (?) ou exclamação (!).
    exercises:
      - type: grammar
        question: Pergunta termina com (./?/!)
        correctAnswer: "?"
        rationale: "Pronome pessoal reto funciona como sujeito."
      - type: grammar
        question: Exclamação termina com (./?/!)
        correctAnswer: "!"
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: Declaração termina com (./?/!)
        correctAnswer: .
        rationale: "Advérbio de modo frequentemente termina em -mente."
      - type: grammar
        question: "'Que legal' — qual pontuação? (./?/!)"
        correctAnswer: "!"
        rationale: "Adjunto adverbial de modo responde 'como'."
      - type: grammar
        question: "'Como vai' — qual pontuação? (./?/!)"
        correctAnswer: "?"
        rationale: "Pronome demonstrativo indica posição (este, esse, aquele)."
      - type: grammar
        question: "'Hoje choveu' — qual pontuação? (./?/!)"
        correctAnswer: .
        rationale: "Pronome pessoal reto funciona como sujeito."
      - type: grammar
        question: "'Olhe lá' — imperativa, qual pontuação? (./?/!)"
        correctAnswer: .
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
      - type: grammar
        question: "'Socorro' — qual pontuação? (./?/!)"
        correctAnswer: "!"
        rationale: "Sujeito simples tem um núcleo; composto tem dois ou mais."
      - type: grammar
        question: "'O que é isto' — qual pontuação? (./?/!)"
        correctAnswer: "?"
        rationale: "Numeral cardinal indica quantidade; ordinal indica ordem."
      - type: grammar
        question: "'Parabéns' — qual pontuação? (./?/!)"
        correctAnswer: "!"
        rationale: "Substantivo próprio nomeia ser específico — inicial maiúscula."
  - pageNumber: 3
    title: Transformando Frases
    description: Transforme de um tipo para outro.
    exercises:
      - type: grammar
        question: "Transforme 'Você gosta.' em pergunta: (Você gosta?/Gosta você!/Você gosta)"
        correctAnswer: Você gosta?
        rationale: "Adjunto adverbial de modo responde 'como'."
      - type: grammar
        question: "Transforme 'O dia está bonito.' em exclamação: (O dia está bonito!/É bonito o dia?/O dia está bonito.)"
        correctAnswer: O dia está bonito!
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: "Interrogativa: 'Que horas são' falta: (?/!/.)"
        correctAnswer: "?"
        rationale: "Pronome demonstrativo indica posição (este, esse, aquele)."
      - type: grammar
        question: "Exclamativa: 'Que dia lindo' falta: (?/!/.)"
        correctAnswer: "!"
        rationale: "Locução verbal = verbo auxiliar + principal."
      - type: grammar
        question: "Transforme 'Ele chegou.' em pergunta: (Ele chegou?/Chegou ele./Ele chegou!)"
        correctAnswer: Ele chegou?
        rationale: "Sujeito simples tem um núcleo; composto tem dois ou mais."
      - type: grammar
        question: "Transforme 'Estamos felizes.' em exclamação: (Estamos felizes!/Estamos felizes?/Estamos felizes.)"
        correctAnswer: Estamos felizes!
        rationale: "Pronome pessoal reto funciona como sujeito."
      - type: grammar
        question: "Imperativa: mandar fazer silêncio: (Silêncio!/Silêncio?/O silêncio.)"
        correctAnswer: Silêncio!
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
      - type: grammar
        question: "Imperativa: mandar sentar: (Sente-se./Sente-se?/Você senta?)"
        correctAnswer: Sente-se.
        rationale: "Locução verbal = verbo auxiliar + principal."
      - type: grammar
        question: A pergunta usa qual palavra? (onde/aqui/sempre)
        correctAnswer: onde
        rationale: "Pronome demonstrativo indica posição (este, esse, aquele)."
      - type: grammar
        question: "A exclamação expressa: (emoção/fato/pergunta)"
        correctAnswer: emoção
        rationale: "Sujeito simples tem um núcleo; composto tem dois ou mais."
target: 30
