title: Construção de Frases - Pontuação
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Pontuação na frase. Vírgula separa termos e orações; ponto encerra."
example: "Pratique construção de frases - pontuação. Ex.: 'Hoje é segunda-feira___' → .."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 40
pages:
  - pageNumber: 1
    title: Pontuação
    description: Escolha a pontuação correta para cada frase.
    exercises:
      - type: sentence_building
        question: "'Que bela manhã___' (./!/?)"
        correctAnswer: "!"
        rationale: "Frase exclamativa expressa emoção e termina em ponto de exclamação (!)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Você vai à festa___' (./?/!)"
        correctAnswer: "?"
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'O menino brinca no jardim___' (./?/!)"
        correctAnswer: .
        rationale: "Frase declarativa termina em ponto final (.)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Maria___ você pode me ajudar?' (,/./?)"
        correctAnswer: ","
        rationale: "Vírgula separa vocativo do restante da frase."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Socorro___ me ajudem!' (!/?/.)"
        correctAnswer: "!"
