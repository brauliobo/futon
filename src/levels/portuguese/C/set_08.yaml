title: Construção de Frases - Pontuação
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Pontuação
    description: Escolha a pontuação correta para cada frase.
    exercises:
      - type: sentence_building
        question: "'Que bela manhã___' (./!/?))"
        correctAnswer: "!"
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
      - type: sentence_building
        question: "'Você vai à festa___' (./?/!))"
        correctAnswer: "?"
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: sentence_building
        question: "'O menino brinca no jardim___' (./?/!))"
        correctAnswer: .
        rationale: "Advérbio de modo frequentemente termina em -mente."
      - type: sentence_building
        question: "'Maria___ você pode me ajudar?' (,/./?)"
        correctAnswer: ","
        rationale: "Pronome demonstrativo indica posição (este, esse, aquele)."
      - type: sentence_building
        question: "'Socorro___ me ajudem!' (!/?/.)"
        correctAnswer: "!"
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
      - type: sentence_building
        question: "'Hoje é segunda-feira___' (./?/!))"
        correctAnswer: .
        rationale: "Adjunto adverbial de lugar responde 'onde'."
      - type: sentence_building
        question: "'Onde você colocou as chaves___' (./?/!))"
        correctAnswer: "?"
        rationale: "Numeral cardinal indica quantidade; ordinal indica ordem."
      - type: sentence_building
        question: "'João___ Pedro e Ana foram passear.' (,/./;)"
        correctAnswer: ","
        rationale: "Adjunto adverbial de modo responde 'como'."
      - type: sentence_building
        question: "'Que alegria te encontrar___' (!/?/.)"
        correctAnswer: "!"
        rationale: "Locução verbal = verbo auxiliar + principal."
      - type: sentence_building
        question: "'A aula termina às cinco horas___' (./?/!))"
        correctAnswer: .
        rationale: "Locução verbal = verbo auxiliar + principal."
target: 10
