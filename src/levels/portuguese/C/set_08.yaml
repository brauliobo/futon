title: Construção de Frases - Pontuação
level: C
subject: portuguese
difficulty: 3
objectives: [pt.sentence_building]
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Pontuação
    description: Escolha a pontuação correta para cada frase.
    exercises:
      - { type: sentence_building, question: "'Que bela manhã___' (./!/?))", correctAnswer: "!" }
      - { type: sentence_building, question: "'Você vai à festa___' (./?/!))", correctAnswer: "?" }
      - { type: sentence_building, question: "'O menino brinca no jardim___' (./?/!))", correctAnswer: "." }
      - { type: sentence_building, question: "'Maria___ você pode me ajudar?' (,/./?)", correctAnswer: "," }
      - { type: sentence_building, question: "'Socorro___ me ajudem!' (!/?/.)", correctAnswer: "!" }
      - { type: sentence_building, question: "'Hoje é segunda-feira___' (./?/!))", correctAnswer: "." }
      - { type: sentence_building, question: "'Onde você colocou as chaves___' (./?/!))", correctAnswer: "?" }
      - { type: sentence_building, question: "'João___ Pedro e Ana foram passear.' (,/./;)", correctAnswer: "," }
      - { type: sentence_building, question: "'Que alegria te encontrar___' (!/?/.)", correctAnswer: "!" }
      - { type: sentence_building, question: "'A aula termina às cinco horas___' (./?/!))", correctAnswer: "." }
target: 10
