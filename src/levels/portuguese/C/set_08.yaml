      - type: sentence_building
        question: "'João___ Pedro e Ana foram passear.' (,/;/.)"
        correctAnswer: ","
        rationale: "Vírgula separa termos de mesma função sintática."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'Que alegria te encontrar___' (!/?/.)"
        correctAnswer: "!"
        rationale: "Frase exclamativa expressa emoção e termina em ponto de exclamação (!)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: "'A aula termina às cinco horas___' (./?/!)"
