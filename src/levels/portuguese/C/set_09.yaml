title: Construção de Frases - Pronomes
level: C
subject: portuguese
pages:
  - pageNumber: 1
    title: Pronomes
    description: Substitua as palavras sublinhadas pelo pronome correto.
    exercises:
      - { type: sentence_building, question: ""Pedro comprou livros. ___ comprou livros. (Ele/Ela/Eles)"", correctAnswer: Ele }
      - { type: sentence_building, question: ""As meninas brincam. ___ brincam. (Ela/Elas/Eles)"", correctAnswer: Elas }
      - { type: sentence_building, question: ""A professora explica. ___ explica. (Ele/Ela/Elas)"", correctAnswer: Ela }
      - { type: sentence_building, question: ""Meus pais trabalham. ___ trabalham. (Ele/Ela/Eles)"", correctAnswer: Eles }
      - { type: sentence_building, question: ""Tu estudas muito. ___ estudas muito. (Eu/Tu/Ele)"", correctAnswer: Tu }
      - { type: sentence_building, question: ""Nós cantamos juntos. ___ cantamos juntos. (Nós/Vós/Eles)"", correctAnswer: Nós }
      - { type: sentence_building, question: ""Vocês chegaram cedo. ___ chegaram cedo. (Nós/Vocês/Eles)"", correctAnswer: Vocês }
      - { type: sentence_building, question: ""Eu leio histórias. ___ leio histórias. (Eu/Tu/Ele)"", correctAnswer: Eu }
      - { type: sentence_building, question: ""O cachorro late. ___ late. (Ele/Ela/Eles)"", correctAnswer: Ele }
      - { type: sentence_building, question: ""As flores crescem. ___ crescem. (Ela/Elas/Eles)"", correctAnswer: Elas }
target: 10
