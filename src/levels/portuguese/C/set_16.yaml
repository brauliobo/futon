title: Construção de Frases - Regência Verbal
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Regência Verbal
    description: Complete as frases com a preposição correta.
    exercises:
      - type: sentence_building
        question: Ela gosta ___ chocolate. (de/em/a)
        correctAnswer: de
        rationale: "Adjunto adverbial de tempo responde 'quando'."
      - type: sentence_building
        question: Preciso ___ sua ajuda. (de/em/com)
        correctAnswer: de
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
      - type: sentence_building
        question: Assistimos ___ filme ontem. (o/ao/do)
        correctAnswer: ao
        rationale: "Predicado é tudo que se declara sobre o sujeito."
      - type: sentence_building
        question: Prefiro café ___ chá. (de/a/em)
        correctAnswer: a
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
      - type: sentence_building
        question: Concordo ___ sua opinião. (de/com/em)
        correctAnswer: com
        rationale: "Pronome pessoal reto funciona como sujeito."
      - type: sentence_building
        question: Obedeço ___ meus pais. (os/aos/dos)
        correctAnswer: aos
        rationale: "Numeral cardinal indica quantidade; ordinal indica ordem."
      - type: sentence_building
        question: Acredito ___ você. (de/em/com)
        correctAnswer: em
        rationale: "Adjunto adverbial de lugar responde 'onde'."
      - type: sentence_building
        question: Lembro-me ___ nossa conversa. (de/em/com)
        correctAnswer: de
        rationale: "Conjunção adversativa contrasta ideias (mas, porém, contudo)."
      - type: sentence_building
        question: Simpatizo ___ aquela professora. (de/com/em)
        correctAnswer: com
        rationale: "Adjunto adverbial de lugar responde 'onde'."
      - type: sentence_building
        question: Aspiro ___ uma vida melhor. (de/a/em)
        correctAnswer: a
        rationale: "Sujeito simples tem um núcleo; composto tem dois ou mais."
target: 10
