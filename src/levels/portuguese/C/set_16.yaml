title: Construção de Frases - Regência Verbal
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Regência verbal. Verbo exige preposição específica (gostar DE, obedecer A)."
pages:
  - pageNumber: 1
    title: Regência Verbal
    description: Complete as frases com a preposição correta.
    exercises:
      - type: sentence_building
        question: Ela gosta ___ chocolate. (de/em/a)
        correctAnswer: de
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Preciso ___ sua ajuda. (de/em/com)
        correctAnswer: de
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Assistimos ___ filme ontem. (o/ao/do)
        correctAnswer: ao
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Prefiro café ___ chá. (de/a/em)
        correctAnswer: a
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Concordo ___ sua opinião. (de/com/em)
        correctAnswer: com
        rationale: "Concordância: verbo e adjetivo se ajustam ao sujeito em número e gênero."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Obedeço ___ meus pais. (os/aos/dos)
        correctAnswer: aos
        rationale: "Analise a frase e aplique a regra de concordância correta."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Acredito ___ você. (de/em/com)
        correctAnswer: em
        rationale: "Adjunto adverbial de lugar responde 'onde'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Lembro-me ___ nossa conversa. (de/em/com)
        correctAnswer: de
        rationale: "Analise a frase e aplique a regra de concordância correta."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Simpatizo ___ aquela professora. (de/com/em)
        correctAnswer: com
        rationale: "Analise a frase e aplique a regra de concordância correta."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Aspiro ___ uma vida melhor. (de/a/em)
        correctAnswer: a
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
