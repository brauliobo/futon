title: Construção de Frases - Regência Verbal
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Regência verbal. Verbo exige preposição específica (gostar DE, obedecer A)."
example: "Pratique construção de frases - regência verbal. Ex.: Obedeço ___ meus pais. → aos."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 40
pages:
  - pageNumber: 1
    title: Regência Verbal
    description: Complete as frases com a preposição correta.
    exercises:
      - type: sentence_building
        question: Ela gosta ___ chocolate. (em/de/a)
        correctAnswer: de
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Preciso ___ sua ajuda. (em/com/de)
        correctAnswer: de
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Assistimos ___ filme ontem. (ao/o/do)
        correctAnswer: ao
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Prefiro café ___ chá. (a/em/de)
        correctAnswer: a
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Concordo ___ sua opinião. (com/de/em)
        correctAnswer: com
        rationale: "O verbo 'concordar' rege a preposição 'com' (concordar com algo/alguém)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Obedeço ___ meus pais. (aos/dos/os)
        correctAnswer: aos
        rationale: "'Obedecer' é transitivo indireto, rege preposição 'a' + artigo 'os' = 'aos'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Acredito ___ você. (com/de/em)
        correctAnswer: em
        rationale: "Adjunto adverbial de lugar responde 'onde'."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Lembro-me ___ nossa conversa. (em/com/de)
        correctAnswer: de
        rationale: "O verbo concorda com o sujeito em pessoa e número."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Simpatizo ___ aquela professora. (com/de/em)
        correctAnswer: com
        rationale: "O verbo concorda com o sujeito em pessoa e número."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Aspiro ___ uma vida melhor. (em/de/a)
        correctAnswer: a
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
