title: Construção de Frases - Regência Verbal
level: C
subject: portuguese
pages:
  - pageNumber: 1
    title: Regência Verbal
    description: Complete as frases com a preposição correta.
    exercises:
      - { type: sentence_building, question: ""Ela gosta ___ chocolate. (de/em/a)"", correctAnswer: de }
      - { type: sentence_building, question: ""Preciso ___ sua ajuda. (de/em/com)"", correctAnswer: de }
      - { type: sentence_building, question: ""Assistimos ___ filme ontem. (o/ao/do)"", correctAnswer: ao }
      - { type: sentence_building, question: ""Prefiro café ___ chá. (de/a/em)"", correctAnswer: a }
      - { type: sentence_building, question: ""Concordo ___ sua opinião. (de/com/em)"", correctAnswer: com }
      - { type: sentence_building, question: ""Obedeço ___ meus pais. (os/aos/dos)"", correctAnswer: aos }
      - { type: sentence_building, question: ""Acredito ___ você. (de/em/com)"", correctAnswer: em }
      - { type: sentence_building, question: ""Lembro-me ___ nossa conversa. (de/em/com)"", correctAnswer: de }
      - { type: sentence_building, question: ""Simpatizo ___ aquela professora. (de/com/em)"", correctAnswer: com }
      - { type: sentence_building, question: ""Aspiro ___ uma vida melhor. (de/a/em)"", correctAnswer: a }
target: 10
