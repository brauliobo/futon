title: ✏️ Construção de Frases - Concordância Verbal
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Concordância verbal — verbo concorda com o sujeito em número e pessoa."
example: "Concorde verbo e sujeito em número e pessoa. Ex.: Eles ___ médicos. → são."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 36
pages:
  - pageNumber: 1
    title: Concordância em Número
    description: Escolha o verbo certo (singular ou plural).
    exercises:
      - type: grammar
        question: O pássaro ___ (cantam/canta)
        correctAnswer: canta
        rationale: "Sujeito no singular pede verbo no singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Os cães ___ (latem/late)
        correctAnswer: latem
        rationale: "Sujeito no plural exige verbo no plural."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: A menina ___ (correm/corre)
        correctAnswer: corre
        rationale: "Sujeito no singular pede verbo no singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Os meninos ___ (jogam/joga)
        correctAnswer: jogam
        rationale: "Sujeito no plural exige verbo no plural."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O professor ___ (ensinam/ensina)
        correctAnswer: ensina
        rationale: "Sujeito no singular exige verbo no singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: As crianças ___ (estudam/estuda)
        correctAnswer: estudam
        rationale: "Sujeito plural ('As crianças') exige verbo no plural ('estudam')."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O peixe ___ (nadam/nada)
        correctAnswer: nada
        rationale: "Sujeito singular ('O peixe') pede verbo no singular ('nada')."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Os pássaros ___ (voam/voa)
        correctAnswer: voam
        rationale: "Sujeito plural ('Os pássaros') exige verbo no plural ('voam')."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: A flor ___ (cheiram/cheira)
        correctAnswer: cheira
        rationale: "Sujeito singular ('A flor') pede verbo no singular ('cheira')."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Os carros ___ (passam/passa)
        correctAnswer: passam
        rationale: "Sujeito plural ('Os carros') exige verbo no plural ('passam')."
        difficulty: 2
        objectives: [pt.sentence_building]
  - pageNumber: 2
    title: Concordância em Pessoa
    description: Use o verbo certo para cada pessoa.
    exercises:
      - type: grammar
        question: Eu ___ feliz. (está/estou)
        correctAnswer: estou
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: Tu ___ rápido. (és/é)
        correctAnswer: és
        rationale: "Com 'tu' o verbo vai na 2ª pessoa do singular (-s)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ele ___ aluno. (é/são)
        correctAnswer: é
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós ___ amigos. (somos/são)
        correctAnswer: somos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vós ___ jovens. (são/sois)
        correctAnswer: sois
        rationale: "Pronome possessivo indica posse (meu, teu, seu)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eles ___ médicos. (são/é)
        correctAnswer: são
        rationale: "Com 'eles/elas' o verbo vai na 3ª pessoa do plural."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eu ___ café. (tomo/toma)
        correctAnswer: tomo
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: Você ___ leite. (bebem/bebe)
        correctAnswer: bebe
        rationale: "Com 'você' o verbo vai na 3ª pessoa do singular."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós ___ pão. (come/comemos)
        correctAnswer: comemos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vocês ___ TV. (assiste/assistem)
        correctAnswer: assistem
        rationale: "O verbo concorda com o sujeito em pessoa e número."
        difficulty: 3
        objectives: [pt.sentence_building]
  - pageNumber: 3
    title: Erros Comuns
    description: Escolha a forma correta.
    exercises:
      - type: grammar
        question: "Certo: (Tem 3 livros/Há 3 livros)"
        correctAnswer: Há 3 livros
        rationale: "No sentido de 'existir', use 'há' (do verbo haver); 'tem' é coloquial mas impreciso na norma culta."
        difficulty: 4
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Certo: (Fazem 2 anos/Faz 2 anos)"
        correctAnswer: Faz 2 anos
        rationale: "'A gente' leva verbo na 3ª pessoa do singular."
        difficulty: 4
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Certo: (Pode ter erros/Pode haver erros)"
        correctAnswer: Pode haver erros
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
        difficulty: 4
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Certo: (Aconteceram casos/Aconteceu casos)"
        correctAnswer: Aconteceram casos
        rationale: "Adjunto adverbial de tempo responde 'quando'."
        difficulty: 4
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Certo: (Eu e você vamos/Eu e você vai)"
        correctAnswer: Eu e você vamos
        rationale: "Adjetivo concorda em gênero e número com o substantivo."
        difficulty: 4
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Certo: (Você e ele foi/Você e ele foram)"
        correctAnswer: Você e ele foram
        rationale: "Expressão partitiva: verbo pode ir ao singular ou plural."
        difficulty: 4
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Certo: (Haviam muitos/Havia muitos)"
        correctAnswer: Havia muitos
        rationale: "Sujeito 'quem' leva verbo na 3ª pessoa do singular."
        difficulty: 4
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Certo: (Falta 5 minutos/Faltam 5 minutos)"
        correctAnswer: Faltam 5 minutos
        rationale: "Sujeito 'quem' leva verbo na 3ª pessoa do singular."
        difficulty: 4
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Certo: (Minha avó chegaram/Minha avó chegou)"
        correctAnswer: Minha avó chegou
        rationale: "Sujeito no singular exige verbo no singular."
        difficulty: 4
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Certo: (Eles leram/Eles leu)"
        correctAnswer: Eles leram
        rationale: "Sujeito composto com 'e' geralmente leva verbo ao plural."
        difficulty: 4
        objectives: [pt.sentence_building]
target: 30
