title: Construção de Frases - Concordância Verbal
level: C
subject: portuguese
difficulty: 3
objectives: [pt.sentence_building]
authorNotes: Conjunto de portuguese/C.
example: "Concorde verbo e sujeito em número e pessoa."
pages:
  - pageNumber: 1
    title: Concordância em Número
    description: Escolha o verbo certo (singular ou plural).
    exercises:
      - { type: grammar, question: "O pássaro ___ (canta/cantam)", correctAnswer: canta }
      - { type: grammar, question: "Os cães ___ (late/latem)", correctAnswer: latem }
      - { type: grammar, question: "A menina ___ (corre/correm)", correctAnswer: corre }
      - { type: grammar, question: "Os meninos ___ (joga/jogam)", correctAnswer: jogam }
      - { type: grammar, question: "O professor ___ (ensina/ensinam)", correctAnswer: ensina }
      - { type: grammar, question: "As crianças ___ (estuda/estudam)", correctAnswer: estudam }
      - { type: grammar, question: "O peixe ___ (nada/nadam)", correctAnswer: nada }
      - { type: grammar, question: "Os pássaros ___ (voa/voam)", correctAnswer: voam }
      - { type: grammar, question: "A flor ___ (cheira/cheiram)", correctAnswer: cheira }
      - { type: grammar, question: "Os carros ___ (passa/passam)", correctAnswer: passam }
  - pageNumber: 2
    title: Concordância em Pessoa
    description: Use o verbo certo para cada pessoa.
    exercises:
      - { type: grammar, question: "Eu ___ feliz. (estou/está)", correctAnswer: estou }
      - { type: grammar, question: "Tu ___ rápido. (é/és)", correctAnswer: és }
      - { type: grammar, question: "Ele ___ aluno. (é/são)", correctAnswer: é }
      - { type: grammar, question: "Nós ___ amigos. (somos/são)", correctAnswer: somos }
      - { type: grammar, question: "Vós ___ jovens. (sois/são)", correctAnswer: sois }
      - { type: grammar, question: "Eles ___ médicos. (são/é)", correctAnswer: são }
      - { type: grammar, question: "Eu ___ café. (tomo/toma)", correctAnswer: tomo }
      - { type: grammar, question: "Você ___ leite. (bebe/bebem)", correctAnswer: bebe }
      - { type: grammar, question: "Nós ___ pão. (comemos/come)", correctAnswer: comemos }
      - { type: grammar, question: "Vocês ___ TV. (assistem/assiste)", correctAnswer: assistem }
  - pageNumber: 3
    title: Erros Comuns
    description: Escolha a forma correta.
    exercises:
      - { type: grammar, question: "Certo: (Há 3 livros/Tem 3 livros)", correctAnswer: "Há 3 livros" }
      - { type: grammar, question: "Certo: (Fazem 2 anos/Faz 2 anos)", correctAnswer: "Faz 2 anos" }
      - { type: grammar, question: "Certo: (Pode haver erros/Pode ter erros)", correctAnswer: "Pode haver erros" }
      - { type: grammar, question: "Certo: (Aconteceu casos/Aconteceram casos)", correctAnswer: "Aconteceram casos" }
      - { type: grammar, question: "Certo: (Eu e você vamos/Eu e você vai)", correctAnswer: "Eu e você vamos" }
      - { type: grammar, question: "Certo: (Você e ele foram/Você e ele foi)", correctAnswer: "Você e ele foram" }
      - { type: grammar, question: "Certo: (Havia muitos/Haviam muitos)", correctAnswer: "Havia muitos" }
      - { type: grammar, question: "Certo: (Faltam 5 minutos/Falta 5 minutos)", correctAnswer: "Faltam 5 minutos" }
      - { type: grammar, question: "Certo: (Minha avó chegou/Minha avó chegaram)", correctAnswer: "Minha avó chegou" }
      - { type: grammar, question: "Certo: (Eles leu/Eles leram)", correctAnswer: "Eles leram" }
target: 30
