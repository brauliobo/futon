title: Construção de Frases - Concordância Verbal
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
example: Concorde verbo e sujeito em número e pessoa.
pages:
  - pageNumber: 1
    title: Concordância em Número
    description: Escolha o verbo certo (singular ou plural).
    exercises:
      - type: grammar
        question: O pássaro ___ (canta/cantam)
        correctAnswer: canta
        rationale: "Frase exclamativa termina em ponto de exclamação."
      - type: grammar
        question: Os cães ___ (late/latem)
        correctAnswer: latem
        rationale: "Pronome possessivo indica posse (meu, teu, seu)."
      - type: grammar
        question: A menina ___ (corre/correm)
        correctAnswer: corre
        rationale: "Adjunto adverbial de modo responde 'como'."
      - type: grammar
        question: Os meninos ___ (joga/jogam)
        correctAnswer: jogam
        rationale: "Artigo definido (o, a, os, as) particulariza o substantivo."
      - type: grammar
        question: O professor ___ (ensina/ensinam)
        correctAnswer: ensina
        rationale: "Substantivo comum nomeia genericamente — inicial minúscula."
      - type: grammar
        question: As crianças ___ (estuda/estudam)
        correctAnswer: estudam
        rationale: "Conjunção aditiva soma ideias (e, nem, também)."
      - type: grammar
        question: O peixe ___ (nada/nadam)
        correctAnswer: nada
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: Os pássaros ___ (voa/voam)
        correctAnswer: voam
        rationale: "Pronome pessoal reto funciona como sujeito."
      - type: grammar
        question: A flor ___ (cheira/cheiram)
        correctAnswer: cheira
        rationale: "Artigo indefinido (um, uma, uns, umas) generaliza."
      - type: grammar
        question: Os carros ___ (passa/passam)
        correctAnswer: passam
        rationale: "Adjunto adverbial de lugar responde 'onde'."
  - pageNumber: 2
    title: Concordância em Pessoa
    description: Use o verbo certo para cada pessoa.
    exercises:
      - type: grammar
        question: Eu ___ feliz. (estou/está)
        correctAnswer: estou
        rationale: "Conjunção aditiva soma ideias (e, nem, também)."
      - type: grammar
        question: Tu ___ rápido. (é/és)
        correctAnswer: és
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
      - type: grammar
        question: Ele ___ aluno. (é/são)
        correctAnswer: é
        rationale: "Pronome demonstrativo indica posição (este, esse, aquele)."
      - type: grammar
        question: Nós ___ amigos. (somos/são)
        correctAnswer: somos
        rationale: "Conjunção adversativa contrasta ideias (mas, porém, contudo)."
      - type: grammar
        question: Vós ___ jovens. (sois/são)
        correctAnswer: sois
        rationale: "Pronome possessivo indica posse (meu, teu, seu)."
      - type: grammar
        question: Eles ___ médicos. (são/é)
        correctAnswer: são
        rationale: "Frase interrogativa termina em ponto de interrogação."
      - type: grammar
        question: Eu ___ café. (tomo/toma)
        correctAnswer: tomo
        rationale: "Adjetivo concorda em gênero e número com o substantivo."
      - type: grammar
        question: Você ___ leite. (bebe/bebem)
        correctAnswer: bebe
        rationale: "Frase declarativa termina em ponto final e afirma um fato."
      - type: grammar
        question: Nós ___ pão. (comemos/come)
        correctAnswer: comemos
        rationale: "Numeral cardinal indica quantidade; ordinal indica ordem."
      - type: grammar
        question: Vocês ___ TV. (assistem/assiste)
        correctAnswer: assistem
        rationale: "Predicado é tudo que se declara sobre o sujeito."
  - pageNumber: 3
    title: Erros Comuns
    description: Escolha a forma correta.
    exercises:
      - type: grammar
        question: "Certo: (Há 3 livros/Tem 3 livros)"
        correctAnswer: Há 3 livros
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
      - type: grammar
        question: "Certo: (Fazem 2 anos/Faz 2 anos)"
        correctAnswer: Faz 2 anos
        rationale: "Substantivo comum nomeia genericamente — inicial minúscula."
      - type: grammar
        question: "Certo: (Pode haver erros/Pode ter erros)"
        correctAnswer: Pode haver erros
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
      - type: grammar
        question: "Certo: (Aconteceu casos/Aconteceram casos)"
        correctAnswer: Aconteceram casos
        rationale: "Adjunto adverbial de tempo responde 'quando'."
      - type: grammar
        question: "Certo: (Eu e você vamos/Eu e você vai)"
        correctAnswer: Eu e você vamos
        rationale: "Adjetivo concorda em gênero e número com o substantivo."
      - type: grammar
        question: "Certo: (Você e ele foram/Você e ele foi)"
        correctAnswer: Você e ele foram
        rationale: "Frase interrogativa termina em ponto de interrogação."
      - type: grammar
        question: "Certo: (Havia muitos/Haviam muitos)"
        correctAnswer: Havia muitos
        rationale: "Frase imperativa expressa ordem, pedido ou conselho."
      - type: grammar
        question: "Certo: (Faltam 5 minutos/Falta 5 minutos)"
        correctAnswer: Faltam 5 minutos
        rationale: "Frase exclamativa termina em ponto de exclamação."
      - type: grammar
        question: "Certo: (Minha avó chegou/Minha avó chegaram)"
        correctAnswer: Minha avó chegou
        rationale: "Pronome pessoal reto funciona como sujeito."
      - type: grammar
        question: "Certo: (Eles leu/Eles leram)"
        correctAnswer: Eles leram
        rationale: "Substantivo próprio nomeia ser específico — inicial maiúscula."
target: 30
