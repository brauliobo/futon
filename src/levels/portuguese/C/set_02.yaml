title: Construção de Frases - Concordância Verbal
level: C
subject: portuguese
pages:
  - pageNumber: 1
    title: Concordância Verbal
    description: Escolha a forma verbal correta para cada frase.
    exercises:
      - { type: sentence_building, question: "O pássaro ___ no céu. (voa/voam)", correctAnswer: voa }
      - { type: sentence_building, question: "Os estudantes ___ na biblioteca. (estuda/estudam)", correctAnswer: estudam }
      - { type: sentence_building, question: "A menina ___ muito bem. (desenha/desenham)", correctAnswer: desenha }
      - { type: sentence_building, question: "Nós ___ pizza no jantar. (come/comemos)", correctAnswer: comemos }
      - { type: sentence_building, question: "Vocês ___ cedo amanhã. (acorda/acordam)", correctAnswer: acordam }
      - { type: sentence_building, question: "Tu ___ um bom aluno. (é/és)", correctAnswer: és }
      - { type: sentence_building, question: "As plantas ___ água para crescer. (precisa/precisam)", correctAnswer: precisam }
      - { type: sentence_building, question: "O time ___ muito bem hoje. (jogou/jogaram)", correctAnswer: jogou }
      - { type: sentence_building, question: "Minhas irmãs ___ música clássica. (gosta/gostam)", correctAnswer: gostam }
      - { type: sentence_building, question: "A professora ___ exercícios novos. (trouxe/trouxeram)", correctAnswer: trouxe }
target: 10
