title: Construção de Frases - Complementos
level: C
subject: portuguese
pages:
  - pageNumber: 1
    title: Complementos do Verbo
    description: Complete as frases com o complemento adequado.
    exercises:
      - { type: sentence_building, question: "João comprou ___. (uma bicicleta/ontem)", correctAnswer: uma bicicleta }
      - { type: sentence_building, question: "Maria precisa ___. (de ajuda/rapidamente)", correctAnswer: de ajuda }
      - { type: sentence_building, question: "As crianças gostam ___. (de brincar/sempre)", correctAnswer: de brincar }
      - { type: sentence_building, question: "O professor ensina ___. (matemática/cuidadosamente)", correctAnswer: matemática }
      - { type: sentence_building, question: "Nós assistimos ___. (ao filme/na sala)", correctAnswer: ao filme }
      - { type: sentence_building, question: "Ela deu ___ para o irmão. (o livro/gentilmente)", correctAnswer: o livro }
      - { type: sentence_building, question: "Os alunos fizeram ___. (os exercícios/silenciosamente)", correctAnswer: os exercícios }
      - { type: sentence_building, question: "Papai conta ___ antes de dormir. (histórias/sempre)", correctAnswer: histórias }
      - { type: sentence_building, question: "A menina desenhou ___. (uma flor/ontem)", correctAnswer: uma flor }
      - { type: sentence_building, question: "Vocês trouxeram ___ da escola. (os cadernos/hoje)", correctAnswer: os cadernos }
target: 10
