title: Construção de Frases - Adjuntos Adverbiais
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: "Adjuntos adverbiais. Circunstâncias de tempo, lugar, modo."
pages:
  - pageNumber: 1
    title: Adjuntos Adverbiais
    description: Complete as frases com adjuntos adverbiais de tempo, lugar ou modo.
    exercises:
      - type: sentence_building
        question: As crianças brincam ___. (no parque/felizes)
        correctAnswer: no parque
        rationale: "Analise a frase e aplique a regra de concordância correta."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Estudamos ___ para a prova. (ontem/concentrados)
        correctAnswer: ontem
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Ela fala ___. (educadamente/português)
        correctAnswer: educadamente
        rationale: "Analise a frase e aplique a regra de concordância correta."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: O gato dorme ___. (na cama/profundamente)
        correctAnswer: na cama
        rationale: "Adjunto adverbial modifica verbo indicando circunstância."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Chegamos ___ à festa. (cedo/animados)
        correctAnswer: cedo
        rationale: "Preposição relaciona termos na frase (de, em, por, para)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Os passarinhos cantam ___. (alegremente/música)
        correctAnswer: alegremente
        rationale: "Adjunto de tempo responde 'quando?' (ontem, cedo)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Minha avó mora ___. (na fazenda/sozinha)
        correctAnswer: na fazenda
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: Vamos viajar ___. (amanhã/de carro)
        correctAnswer: amanhã
        rationale: "Adjunto de lugar responde 'onde?' (aqui, em casa)."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: O menino corre ___. (rapidamente/na pista)
        correctAnswer: rapidamente
        rationale: "Predicado é tudo que se declara sobre o sujeito."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: sentence_building
        question: A família janta ___. (às sete horas/junta)
        correctAnswer: às sete horas
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 10
