title: Construção de Frases - Adjuntos Adverbiais
level: C
subject: portuguese
pages:
  - pageNumber: 1
    title: Adjuntos Adverbiais
    description: Complete as frases com adjuntos adverbiais de tempo, lugar ou modo.
    exercises:
      - { type: sentence_building, question: "As crianças brincam ___. (no parque/felizes)", correctAnswer: no parque }
      - { type: sentence_building, question: "Estudamos ___ para a prova. (ontem/concentrados)", correctAnswer: ontem }
      - { type: sentence_building, question: "Ela fala ___. (educadamente/português)", correctAnswer: educadamente }
      - { type: sentence_building, question: "O gato dorme ___. (na cama/profundamente)", correctAnswer: na cama }
      - { type: sentence_building, question: "Chegamos ___ à festa. (cedo/animados)", correctAnswer: cedo }
      - { type: sentence_building, question: "Os passarinhos cantam ___. (alegremente/música)", correctAnswer: alegremente }
      - { type: sentence_building, question: "Minha avó mora ___. (na fazenda/sozinha)", correctAnswer: na fazenda }
      - { type: sentence_building, question: "Vamos viajar ___. (amanhã/de carro)", correctAnswer: amanhã }
      - { type: sentence_building, question: "O menino corre ___. (rapidamente/na pista)", correctAnswer: rapidamente }
      - { type: sentence_building, question: "A família janta ___. (às sete horas/junta)", correctAnswer: às sete horas }
target: 10
