title: Construção de Frases - Discurso Direto e Indireto
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Discurso Direto e Indireto
    description: Transforme as frases do discurso direto para o indireto ou vice-versa.
    exercises:
      - type: sentence_building
        question: "Maria disse: 'Eu estou feliz.' (discurso indireto)"
        correctAnswer: Maria disse que estava feliz
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: João falou que chegaria cedo. (discurso direto)
        correctAnswer: 'João falou: "Chegarei cedo"'
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: "A professora perguntou: 'Vocês fizeram a lição?' (discurso indireto)"
        correctAnswer: A professora perguntou se eles fizeram a lição
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Pedro disse que gostava de futebol. (discurso direto)
        correctAnswer: 'Pedro disse: "Eu gosto de futebol"'
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: "Ana exclamou: 'Que dia bonito!' (discurso indireto)"
        correctAnswer: Ana exclamou que era um dia bonito
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: O menino afirmou que não quebrou o vaso. (discurso direto)
        correctAnswer: 'O menino afirmou: "Eu não quebrei o vaso"'
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: "Ela perguntou: 'Onde está meu livro?' (discurso indireto)"
        correctAnswer: Ela perguntou onde estava seu livro
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Papai disse que viajaria amanhã. (discurso direto)
        correctAnswer: 'Papai disse: "Viajarei amanhã"'
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: "O médico avisou: 'Tome este remédio.' (discurso indireto)"
        correctAnswer: O médico avisou que tomasse aquele remédio
        rationale: Combine sujeito, verbo e complemento na ordem correta.
      - type: sentence_building
        question: Ela respondeu que não sabia a resposta. (discurso direto)
        correctAnswer: 'Ela respondeu: "Não sei a resposta"'
        rationale: Combine sujeito, verbo e complemento na ordem correta.
target: 10
