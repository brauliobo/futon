title: Construção de Frases - Colocação Pronominal
level: C
subject: portuguese
difficulty: 3
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/C.
pages:
  - pageNumber: 1
    title: Colocação Pronominal
    description: Coloque o pronome na posição correta.
    exercises:
      - type: sentence_building
        question: "'Eu te amo' ou 'Eu amo-te'? (próclise/ênclise)"
        correctAnswer: Eu te amo
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
      - type: sentence_building
        question: "'Dar-lhe-ei' ou 'Lhe darei'? (ênclise/próclise)"
        correctAnswer: Dar-lhe-ei
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
      - type: sentence_building
        question: "'Não me fale' ou 'Não fale-me'? (próclise/ênclise)"
        correctAnswer: Não me fale
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
      - type: sentence_building
        question: "'Quero vê-lo' ou 'Quero o ver'? (ênclise/próclise)"
        correctAnswer: Quero vê-lo
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
      - type: sentence_building
        question: "'Ninguém se machucou' ou 'Ninguém machucou-se'? (próclise/ênclise)"
        correctAnswer: Ninguém se machucou
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
      - type: sentence_building
        question: "'Encontrei-a' ou 'A encontrei'? (ênclise/próclise)"
        correctAnswer: Encontrei-a
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
      - type: sentence_building
        question: "'Ele se feriu' ou 'Ele feriu-se'? (próclise/ênclise)"
        correctAnswer: Ele se feriu
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
      - type: sentence_building
        question: "'Vou contar-lhe' ou 'Vou lhe contar'? (ênclise/próclise)"
        correctAnswer: Vou contar-lhe
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
      - type: sentence_building
        question: "'Talvez nos vejamos' ou 'Talvez vejamo-nos'? (próclise/ênclise)"
        correctAnswer: Talvez nos vejamos
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
      - type: sentence_building
        question: "'Empresta-me' ou 'Me empresta'? (ênclise/próclise)"
        correctAnswer: Empresta-me
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
target: 10
