title: Palavras de 3 Letras
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: Conjunto de portuguese/1A.
example: Reconheça palavras simples de 3 letras.
pages:
  - pageNumber: 1
    title: Palavra CAR
    description: Reconheça palavras com 3 letras.
    exercises:
      - type: reading
        question: Quantas letras tem 'BOI'? (2/3/4)
        correctAnswer: "3"
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 2
    title: Palavra SOL
    description: Identifique palavras simples.
    exercises:
      - type: reading
        question: "Que palavra é esta: SOL? (SOL/SAL/SUL)"
        correctAnswer: SOL
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 3
    title: Palavra MEL
    description: Reconheça palavras conhecidas.
    exercises:
      - type: reading
        question: "Que palavra é esta: MEL? (MEL/MAL/MIL)"
