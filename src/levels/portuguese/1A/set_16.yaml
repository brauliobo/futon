        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 4
    title: Palavra MAR
    description: Identifique a palavra correta.
    exercises:
      - type: reading
        question: "Que palavra é esta: MAR? (MAR/MOR/MUR)"
