        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 5
    title: Palavra PAZ
    description: Reconheça a palavra PAZ.
    exercises:
      - type: reading
        question: "Que palavra é esta: PAZ? (PAZ/POZ/PIZ)"
