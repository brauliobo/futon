title: Palavras Simples - PA PE PI PO PU
level: 1A
subject: portuguese
difficulty: 1
objectives: [pt.basic_literacy]
authorNotes: Conjunto de portuguese/1A.
example: Reconheça sílabas simples com a letra P.
pages:
