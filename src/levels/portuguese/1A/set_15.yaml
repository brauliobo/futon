    title: PA
    description: Reconheça a sílaba PA.
    exercises:
      - { type: reading, question: "Que sílaba é esta: PA? (PA/PE/PI)", correctAnswer: "PA" }
  - pageNumber: 2
    title: PE
    description: Reconheça a sílaba PE.
    exercises:
      - { type: reading, question: "Que sílaba é esta: PE? (PA/PE/PI)", correctAnswer: "PE" }
  - pageNumber: 3
    title: PI
    description: Reconheça a sílaba PI.
    exercises:
      - { type: reading, question: "Que sílaba é esta: PI? (PE/PI/PO)", correctAnswer: "PI" }
  - pageNumber: 4
    title: PO
    description: Reconheça a sílaba PO.
    exercises:
      - { type: reading, question: "Que sílaba é esta: PO? (PI/PO/PU)", correctAnswer: "PO" }
  - pageNumber: 5
    title: PU
    description: Reconheça a sílaba PU.
    exercises:
      - { type: reading, question: "Que sílaba é esta: PU? (PO/PU/PA)", correctAnswer: "PU" }
  - pageNumber: 6
    title: Palavra PAPAI
    description: Reconheça a palavra PAPAI.
