    exercises:
      - { type: reading, question: "Qual é a primeira sílaba de PUMA? (PU/MA)", correctAnswer: "PU" }
  - pageNumber: 9
    title: Última Sílaba
    description: Identifique a última sílaba.
    exercises:
      - { type: reading, question: "Qual é a última sílaba de SAPO? (SA/PO)", correctAnswer: "PO" }
  - pageNumber: 10
    title: Revisão P
    description: Revise as sílabas com P.
    exercises:
