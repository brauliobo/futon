title: Frases Simples
level: 1A
subject: portuguese
example: Reconheça frases muito simples.
pages:
  - pageNumber: 1
    title: EU SOU
    description: Reconheça frases de 2 palavras.
    exercises:
      - { type: reading, question: "Quantas palavras tem 'EU SOU'? (1/2/3)", correctAnswer: "2" }
  - pageNumber: 2
    title: A CASA
    description: Identifique frases simples.
    exercises:
      - { type: reading, question: "Que frase é esta: 'A CASA'? (A CASA/O CASA/AS CASA)", correctAnswer: "A CASA" }
  - pageNumber: 3
    title: O GATO
    description: Reconheça artigos com substantivos.
    exercises:
      - { type: reading, question: "Que frase é esta: 'O GATO'? (A GATO/O GATO/OS GATO)", correctAnswer: "O GATO" }
  - pageNumber: 4
    title: MEU PAI
    description: Identifique possessivos.
    exercises:
      - { type: reading, question: "Que frase é esta: 'MEU PAI'? (MEU PAI/MIA PAI/MEU MÃE)", correctAnswer: "MEU PAI" }
  - pageNumber: 5
    title: Primeira Palavra
    description: Identifique a primeira palavra.
    exercises:
      - { type: reading, question: "Qual é a primeira palavra de 'A BOLA'? (A/BOLA)", correctAnswer: "A" }
  - pageNumber: 6
    title: Segunda Palavra
    description: Identifique a segunda palavra.
    exercises:
      - { type: reading, question: "Qual é a segunda palavra de 'O DADO'? (O/DADO)", correctAnswer: "DADO" }
  - pageNumber: 7
    title: É DOCE
    description: Reconheça frases com verbo ser.
    exercises:
      - { type: reading, question: "Que frase é esta: 'É DOCE'? (É DOCE/É DOSE/É DOCA)", correctAnswer: "É DOCE" }
  - pageNumber: 8
    title: VOU CASA
    description: Identifique frases de ação.
    exercises:
      - { type: reading, question: "Quantas palavras tem 'VOU CASA'? (1/2/3)", correctAnswer: "2" }
  - pageNumber: 9
    title: Espaços
    description: Identifique espaços entre palavras.
    exercises:
      - { type: reading, question: "Onde há espaço em 'EU VOU'? (EU VOU/EUVOU)", correctAnswer: "EU VOU" }
  - pageNumber: 10
    title: Revisão Frases
    description: Revise frases simples.
    exercises:
      - { type: reading, question: "O que separa palavras numa frase? (vírgula/espaço/ponto)", correctAnswer: "espaço" }
target: 10
