title: Reconhecimento da Letra U
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Reconhecimento de vogal isolada. Associe som ao traçado — base da alfabetização."
example: "Identifique e reconheça a letra U. Ex.: Qual é a letra U? → U."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: U Maiúscula
    description: Encontre a letra U maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra U? (W/V/U)
        correctAnswer: U
        rationale: "U — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: U Minúscula
    description: Encontre a letra u minúscula.
    exercises:
      - type: reading
        question: Qual é a letra u? (u/v/w)
        correctAnswer: u
        rationale: "u — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: U em Palavras
    description: Encontre a letra U em uma palavra.
    exercises:
      - type: reading
        question: Onde está o U em 'UVA'? (início/fim/meio)
        correctAnswer: início
        rationale: "Em UVA, o U está no início."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: Som da Letra U
    description: Reconheça o som da letra U.
    exercises:
      - type: reading
        question: Que letra faz o som 'uuu'? (U/O/I)
        correctAnswer: U
        rationale: "Abra a boca e diga 'uuu' — é o som de U."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: U ou Não U
    description: Identifique se é a letra U.
    exercises:
      - type: reading
        question: Esta é a letra U? 'V' (não/sim)
        correctAnswer: não
        rationale: "Não — essa é a letra V, não U."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Contando U's
    description: Conte quantas letras U.
    exercises:
      - type: reading
        question: Quantos U's em 'TUTU'? (1/2/3)
        correctAnswer: "2"
        rationale: "TUTU tem 2 U's: conte letra por letra."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: U Grande
    description: Identifique U maiúscula.
    exercises:
      - type: reading
        question: Qual é o U grande? (u/U)
        correctAnswer: U
        rationale: "O U grande é o maiúsculo — usado no começo de nomes."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: U Pequeno
    description: Identifique u minúscula.
    exercises:
      - type: reading
        question: Qual é o u pequeno? (u/U)
        correctAnswer: u
        rationale: "O u pequeno é o minúsculo — usado dentro das palavras."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: U na Palavra
    description: Identifique onde está o U.
    exercises:
      - type: reading
        question: Onde está o U em 'AZUL'? (fim/meio/início)
        correctAnswer: fim
        rationale: "Em AZUL, o U está no fim."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão U
    description: Revise tudo sobre a letra U.
    exercises:
      - type: reading
        question: A letra U é uma? (consoante/vogal)
        correctAnswer: vogal
        rationale: "U é uma vogal (A, E, I, O, U)."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
