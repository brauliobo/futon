title: Reconhecimento da Letra U
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: Conjunto de portuguese/1A.
example: Identifique e reconheça a letra U.
pages:
  - pageNumber: 1
    title: U Maiúscula
    description: Encontre a letra U maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra U? (U/V/W)
        correctAnswer: U
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 2
    title: U Minúscula
    description: Encontre a letra u minúscula.
    exercises:
      - type: reading
        question: Qual é a letra u? (u/v/w)
        correctAnswer: u
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 3
    title: U em Palavras
    description: Encontre a letra U em uma palavra.
    exercises:
      - type: reading
        question: Onde está o U em 'UVA'? (início/meio/fim)
        correctAnswer: início
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 4
    title: Som da Letra U
    description: Reconheça o som da letra U.
    exercises:
      - type: reading
        question: Que letra faz o som 'uuu'? (I/O/U)
        correctAnswer: U
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 5
    title: U ou Não U
    description: Identifique se é a letra U.
    exercises:
      - type: reading
        question: Esta é a letra U? 'V' (sim/não)
        correctAnswer: não
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 6
    title: Contando U's
    description: Conte quantas letras U.
    exercises:
      - type: reading
        question: Quantos U's em 'TUTU'? (1/2/3)
        correctAnswer: "2"
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 7
    title: U Grande
    description: Identifique U maiúscula.
    exercises:
      - type: reading
        question: Qual é o U grande? (U/u)
        correctAnswer: U
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 8
    title: U Pequeno
    description: Identifique u minúscula.
    exercises:
      - type: reading
        question: Qual é o u pequeno? (U/u)
        correctAnswer: u
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 9
    title: U na Palavra
    description: Identifique onde está o U.
    exercises:
      - type: reading
        question: Onde está o U em 'AZUL'? (início/meio/fim)
        correctAnswer: fim
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 10
    title: Revisão U
    description: Revise tudo sobre a letra U.
    exercises:
      - type: reading
        question: A letra U é uma? (vogal/consoante)
        correctAnswer: vogal
        rationale: Reveja o trecho relevante do texto.
target: 10
