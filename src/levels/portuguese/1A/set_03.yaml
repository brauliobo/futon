title: Reconhecimento da Letra I
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Reconhecimento de vogal isolada. Associe som ao traçado — base da alfabetização."
example: Identifique e reconheça a letra I.
pages:
  - pageNumber: 1
    title: I Maiúscula
    description: Encontre a letra I maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra I? (I/J/K)
        correctAnswer: I
        rationale: "I — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: I Minúscula
    description: Encontre a letra i minúscula.
    exercises:
      - type: reading
        question: Qual é a letra i? (i/j/k)
        correctAnswer: i
        rationale: "i — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: I em Palavras
    description: Encontre a letra I em uma palavra.
    exercises:
      - type: reading
        question: Onde está o I em 'GIGA'? (início/meio/fim)
        correctAnswer: meio
        rationale: "Em GIGA, o I está no meio."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: Som da Letra I
    description: Reconheça o som da letra I.
    exercises:
      - type: reading
        question: Que letra faz o som 'iii'? (A/E/I)
        correctAnswer: I
        rationale: "Abra a boca e diga 'iii' — é o som de I."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: I ou Não I
    description: Identifique se é a letra I.
    exercises:
      - type: reading
        question: Esta é a letra I? 'L' (sim/não)
        correctAnswer: não
        rationale: "Não — essa é a letra L, não I."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Contando I's
    description: Conte quantas letras I.
    exercises:
      - type: reading
        question: Quantos I's em 'XIXI'? (1/2/3)
        correctAnswer: "2"
        rationale: "XIXI tem 2 I's: conte letra por letra."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: I Grande
    description: Identifique I maiúscula.
    exercises:
      - type: reading
        question: Qual é o I grande? (I/i)
        correctAnswer: I
        rationale: "O I grande é o maiúsculo — usado no começo de nomes."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: I Pequeno
    description: Identifique i minúscula.
    exercises:
      - type: reading
        question: Qual é o i pequeno? (I/i)
        correctAnswer: i
        rationale: "O i pequeno é o minúsculo — usado dentro das palavras."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: Meio da Palavra
    description: Identifique a letra do meio.
    exercises:
      - type: reading
        question: Qual é a letra do meio de 'RIO'? (R/I/O)
        correctAnswer: I
        rationale: "Em 'RIO', a letra do meio é I."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão I
    description: Revise tudo sobre a letra I.
    exercises:
      - type: reading
        question: A letra I é uma? (vogal/consoante)
        correctAnswer: vogal
        rationale: "I é uma vogal (A, E, I, O, U)."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
