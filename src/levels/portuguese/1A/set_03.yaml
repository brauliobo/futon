title: Reconhecimento da Letra I
level: 1A
subject: portuguese
example: Identifique e reconheça a letra I.
pages:
  - pageNumber: 1
    title: I Maiúscula
    description: Encontre a letra I maiúscula.
    exercises:
      - { type: reading, question: "Qual é a letra I? (I/J/K)", correctAnswer: "I" }
  - pageNumber: 2
    title: I Minúscula
    description: Encontre a letra i minúscula.
    exercises:
      - { type: reading, question: "Qual é a letra i? (i/j/k)", correctAnswer: "i" }
  - pageNumber: 3
    title: I em Palavras
    description: Encontre a letra I em uma palavra.
    exercises:
      - { type: reading, question: "Onde está o I em 'GIGA'? (início/meio/fim)", correctAnswer: "meio" }
  - pageNumber: 4
    title: Som da Letra I
    description: Reconheça o som da letra I.
    exercises:
      - { type: reading, question: "Que letra faz o som 'iii'? (A/E/I)", correctAnswer: "I" }
  - pageNumber: 5
    title: I ou Não I
    description: Identifique se é a letra I.
    exercises:
      - { type: reading, question: "Esta é a letra I? 'L' (sim/não)", correctAnswer: "não" }
  - pageNumber: 6
    title: Contando I's
    description: Conte quantas letras I.
    exercises:
      - { type: reading, question: "Quantos I's em 'XIXI'? (1/2/3)", correctAnswer: "2" }
  - pageNumber: 7
    title: I Grande
    description: Identifique I maiúscula.
    exercises:
      - { type: reading, question: "Qual é o I grande? (I/i)", correctAnswer: "I" }
  - pageNumber: 8
    title: I Pequeno
    description: Identifique i minúscula.
    exercises:
      - { type: reading, question: "Qual é o i pequeno? (I/i)", correctAnswer: "i" }
  - pageNumber: 9
    title: Meio da Palavra
    description: Identifique a letra do meio.
    exercises:
      - { type: reading, question: "Qual é a letra do meio de 'RIO'? (R/I/O)", correctAnswer: "I" }
  - pageNumber: 10
    title: Revisão I
    description: Revise tudo sobre a letra I.
    exercises:
      - { type: reading, question: "A letra I é uma? (vogal/consoante)", correctAnswer: "vogal" }
target: 10
