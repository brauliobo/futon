title: Reconhecimento da Letra B
level: 1A
subject: portuguese
example: Identifique e reconheça a letra B.
pages:
  - pageNumber: 1
    title: B Maiúscula
    description: Encontre a letra B maiúscula.
    exercises:
      - type: reading
        question: "Qual é a letra B? (B/D/P)"
        correctAnswer: "B"
  - pageNumber: 2
    title: B Minúscula
    description: Encontre a letra b minúscula.
    exercises:
      - type: reading
        question: "Qual é a letra b? (b/d/p)"
        correctAnswer: "b"
  - pageNumber: 3
    title: B em Palavras
    description: Encontre a letra B em uma palavra.
    exercises:
      - type: reading
        question: "Onde está o B em 'BOLA'? (início/meio/fim)"
        correctAnswer: "início"
  - pageNumber: 4
    title: Som da Letra B
    description: Reconheça o som da letra B.
    exercises:
      - type: reading
        question: "Que letra faz o som 'bbb'? (B/D/P)"
        correctAnswer: "B"
  - pageNumber: 5
    title: B ou Não B
    description: Identifique se é a letra B.
    exercises:
      - type: reading
        question: "Esta é a letra B? 'B' (sim/não)"
        correctAnswer: "sim"
  - pageNumber: 6
    title: Contando B's
    description: Conte quantas letras B.
    exercises:
      - type: reading
        question: "Quantos B's em 'BEBÊ'? (1/2/3)"
        correctAnswer: "2"
  - pageNumber: 7
    title: B Grande
    description: Identifique B maiúscula.
    exercises:
      - type: reading
        question: "Qual é o B grande? (B/b)"
        correctAnswer: "B"
  - pageNumber: 8
    title: B Pequeno
    description: Identifique b minúscula.
    exercises:
      - type: reading
        question: "Qual é o b pequeno? (B/b)"
        correctAnswer: "b"
  - pageNumber: 9
    title: B na Palavra
    description: Identifique onde está o B.
    exercises:
      - type: reading
        question: "Onde está o B em 'CABO'? (início/meio/fim)"
        correctAnswer: "meio"
  - pageNumber: 10
    title: Revisão B
    description: Revise tudo sobre a letra B.
    exercises:
      - type: reading
        question: "A letra B é uma? (vogal/consoante)"
        correctAnswer: "consoante"
target: 10
