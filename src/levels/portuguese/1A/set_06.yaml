title: Reconhecimento da Letra B
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Reconhecimento de consoante. Associe som ao traçado, incluindo variações (C = /k/ ou /s/)."
example: "Identifique e reconheça a letra B. Ex.: Qual é a letra B? → B."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: B Maiúscula
    description: Encontre a letra B maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra B? (D/B/P)
        correctAnswer: B
        rationale: "B — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: B Minúscula
    description: Encontre a letra b minúscula.
    exercises:
      - type: reading
        question: Qual é a letra b? (d/b/p)
        correctAnswer: b
        rationale: "b — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: B em Palavras
    description: Encontre a letra B em uma palavra.
    exercises:
      - type: reading
        question: Onde está o B em 'BOLA'? (início/fim/meio)
        correctAnswer: início
        rationale: "Em BOLA, o B está no início."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: Som da Letra B
    description: Reconheça o som da letra B.
    exercises:
      - type: reading
        question: Que letra faz o som 'bbb'? (D/B/P)
        correctAnswer: B
        rationale: "Abra a boca e diga 'bbb' — é o som de B."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: B ou Não B
    description: Identifique se é a letra B.
    exercises:
      - type: reading
        question: Esta é a letra B? 'B' (não/sim)
        correctAnswer: sim
        rationale: "Sim — é mesmo a letra B."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Contando B's
    description: Conte quantas letras B.
    exercises:
      - type: reading
        question: Quantos B's em 'BEBÊ'? (2/1/3)
        correctAnswer: "2"
        rationale: "BEBÊ tem 2 B's: conte letra por letra."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: B Grande
    description: Identifique B maiúscula.
    exercises:
      - type: reading
        question: Qual é o B grande? (B/b)
        correctAnswer: B
        rationale: "O B grande é o maiúsculo — usado no começo de nomes."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: B Pequeno
    description: Identifique b minúscula.
    exercises:
      - type: reading
        question: Qual é o b pequeno? (B/b)
        correctAnswer: b
        rationale: "O b pequeno é o minúsculo — usado dentro das palavras."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: B na Palavra
    description: Identifique onde está o B.
    exercises:
      - type: reading
        question: Onde está o B em 'CABO'? (meio/fim/início)
        correctAnswer: meio
        rationale: "Em CABO, o B está no meio."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão B
    description: Revise tudo sobre a letra B.
    exercises:
      - type: reading
        question: A letra B é uma? (consoante/vogal)
        correctAnswer: consoante
        rationale: "B é uma consoante (todas as letras que não são vogais)."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
