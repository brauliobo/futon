title: Revisão Geral - Alfabeto Completo
level: 1A
subject: portuguese
example: Revise tudo que aprendeu sobre letras e palavras.
pages:
  - pageNumber: 1
    title: Vogais
    description: Revise todas as vogais.
    exercises:
      - { type: reading, question: "Quantas vogais existem? (4/5/6)", correctAnswer: "5" }
  - pageNumber: 2
    title: Consoantes
    description: Identifique consoantes.
    exercises:
      - { type: reading, question: "B, C, D são? (vogais/consoantes)", correctAnswer: "consoantes" }
  - pageNumber: 3
    title: Alfabeto
    description: Reconheça ordem do alfabeto.
    exercises:
      - { type: reading, question: "Que letra vem depois de A? (B/C/D)", correctAnswer: "B" }
  - pageNumber: 4
    title: Primeira Letra
    description: Identifique a primeira letra do alfabeto.
    exercises:
      - { type: reading, question: "Qual é a primeira letra do alfabeto? (A/B/C)", correctAnswer: "A" }
  - pageNumber: 5
    title: Sons
    description: Relacione letras com sons.
    exercises:
      - { type: reading, question: "Que letra faz 'mmm'? (M/N/L)", correctAnswer: "M" }
  - pageNumber: 6
    title: Palavra Completa
    description: Reconheça palavras completas.
    exercises:
      - { type: reading, question: "Que palavra está completa? (CA/CASA/CAS)", correctAnswer: "CASA" }
  - pageNumber: 7
    title: Sílabas
    description: Identifique sílabas.
    exercises:
      - { type: reading, question: "Quantas sílabas tem 'BOLA'? (1/2/3)", correctAnswer: "2" }
  - pageNumber: 8
    title: Frases
    description: Reconheça frases.
    exercises:
      - { type: reading, question: "O que é 'EU SOU'? (palavra/frase/letra)", correctAnswer: "frase" }
  - pageNumber: 9
    title: Letras e Palavras
    description: Diferencie letras de palavras.
    exercises:
      - { type: reading, question: "O que tem mais letras? (A/CASA)", correctAnswer: "CASA" }
  - pageNumber: 10
    title: Parabéns!
    description: Celebre o que aprendeu.
    exercises:
      - { type: reading, question: "Você aprendeu o básico da leitura? (sim/não)", correctAnswer: "sim" }
target: 10
