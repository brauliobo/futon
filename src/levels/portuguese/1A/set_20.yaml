title: Revisão Geral - Alfabeto Completo
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Revise tudo que aprendeu sobre letras e palavras. Ex.: Quantas vogais existem? → 5."
pages:
  - pageNumber: 1
    title: Vogais
    description: Revise todas as vogais.
    exercises:
      - type: reading
        question: Quantas vogais existem? (4/5/6)
        correctAnswer: "5"
        rationale: "As vogais são A, E, I, O, U — cinco ao todo."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: Consoantes
    description: Identifique consoantes.
    exercises:
      - type: reading
        question: B, C, D são? (vogais/consoantes)
        correctAnswer: consoantes
        rationale: "Não são vogais — pertencem ao grupo das consoantes."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: Alfabeto
    description: Reconheça ordem do alfabeto.
    exercises:
      - type: reading
        question: Que letra vem depois de A? (B/C/D)
        correctAnswer: B
        rationale: "No alfabeto, após A vem B."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: Primeira Letra
    description: Identifique a primeira letra do alfabeto.
    exercises:
      - type: reading
        question: Qual é a primeira letra do alfabeto? (A/B/C)
        correctAnswer: A
        rationale: "Observe as opções e escolha a que responde \"Qual é a primeira letra do alfabeto?\": 'A'."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: Sons
    description: Relacione letras com sons.
    exercises:
      - type: reading
        question: Que letra faz 'mmm'? (M/N/L)
        correctAnswer: M
        rationale: "Observe as opções e escolha a que responde \"Que letra faz 'mmm'?\": 'M'."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Palavra Completa
    description: Reconheça palavras completas.
    exercises:
      - type: reading
        question: Que palavra está completa? (CA/CASA/CAS)
        correctAnswer: CASA
        rationale: "Observe as opções e escolha a que responde \"Que palavra está completa?\": 'CASA'."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: Sílabas
    description: Identifique sílabas.
    exercises:
      - type: reading
        question: Quantas sílabas tem 'BOLA'? (1/2/3)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'BOLA' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: Frases
    description: Reconheça frases.
    exercises:
      - type: reading
        question: O que é 'EU SOU'? (palavra/frase/letra)
        correctAnswer: frase
        rationale: "Observe as opções e escolha a que responde \"O que é 'EU SOU'?\": 'frase'."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: Letras e Palavras
    description: Diferencie letras de palavras.
    exercises:
      - type: reading
        question: O que tem mais letras? (A/CASA)
        correctAnswer: CASA
        rationale: "Observe as opções e escolha a que responde \"O que tem mais letras?\": 'CASA'."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Parabéns!
    description: Celebre o que aprendeu.
    exercises:
      - type: reading
        question: Você aprendeu o básico da leitura? (sim/não)
        correctAnswer: sim
        rationale: "Observe as opções e escolha a que responde \"Você aprendeu o básico da leitura?\": 'sim'."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
