title: Reconhecimento da Letra C
level: 1A
subject: portuguese
difficulty: 1
objectives: [pt.basic_literacy]
authorNotes: Conjunto de portuguese/1A.
example: Identifique e reconheça a letra C.
pages:
  - pageNumber: 1
    title: C Maiúscula
    description: Encontre a letra C maiúscula.
    exercises:
      - { type: reading, question: "Qual é a letra C? (C/G/O)", correctAnswer: "C" }
  - pageNumber: 2
    title: C Minúscula
    description: Encontre a letra c minúscula.
    exercises:
      - { type: reading, question: "Qual é a letra c? (c/g/o)", correctAnswer: "c" }
  - pageNumber: 3
    title: C em Palavras
    description: Encontre a letra C em uma palavra.
    exercises:
      - { type: reading, question: "Onde está o C em 'CASA'? (início/meio/fim)", correctAnswer: "início" }
  - pageNumber: 4
    title: Som da Letra C
    description: Reconheça o som da letra C.
    exercises:
      - { type: reading, question: "Que letra faz o som 'ccc'? (C/K/Q)", correctAnswer: "C" }
  - pageNumber: 5
    title: C ou Não C
    description: Identifique se é a letra C.
    exercises:
      - { type: reading, question: "Esta é a letra C? 'G' (sim/não)", correctAnswer: "não" }
  - pageNumber: 6
    title: Contando C's
    description: Conte quantas letras C.
    exercises:
      - { type: reading, question: "Quantos C's em 'COCÔ'? (1/2/3)", correctAnswer: "2" }
  - pageNumber: 7
    title: C Grande
    description: Identifique C maiúscula.
    exercises:
      - { type: reading, question: "Qual é o C grande? (C/c)", correctAnswer: "C" }
  - pageNumber: 8
    title: C Pequeno
    description: Identifique c minúscula.
    exercises:
      - { type: reading, question: "Qual é o c pequeno? (C/c)", correctAnswer: "c" }
  - pageNumber: 9
    title: C na Palavra
    description: Identifique onde está o C.
    exercises:
      - { type: reading, question: "Onde está o C em 'SUCO'? (início/meio/fim)", correctAnswer: "meio" }
  - pageNumber: 10
    title: Revisão C
    description: Revise tudo sobre a letra C.
    exercises:
      - { type: reading, question: "A letra C é uma? (vogal/consoante)", correctAnswer: "consoante" }
target: 10
