title: 🔤 Reconhecimento da Letra C
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Reconhecimento de consoante. Associe som ao traçado, incluindo variações (C = /k/ ou /s/)."
example: "Identifique e reconheça a letra C. Ex.: Qual é a letra C? → C."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: C Maiúscula
    description: Encontre a letra C maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra C? (G/O/C)
        correctAnswer: C
        rationale: "C — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: C Minúscula
    description: Encontre a letra c minúscula.
    exercises:
      - type: reading
        question: Qual é a letra c? (c/g/o)
        correctAnswer: c
        rationale: "c — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: C em Palavras
    description: Encontre a letra C em uma palavra.
    exercises:
      - type: reading
        question: Onde está o C em 'CASA'? (início/fim/meio)
        correctAnswer: início
        rationale: "Em CASA, o C está no início."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: Som da Letra C
    description: Reconheça o som da letra C.
    exercises:
      - type: reading
        question: Que letra faz o som 'ccc'? (C/K/Q)
        correctAnswer: C
        rationale: "Abra a boca e diga 'ccc' — é o som de C."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: C ou Não C
    description: Identifique se é a letra C.
    exercises:
      - type: reading
        question: "Esta é a letra C? 'G' (não/sim)"
        correctAnswer: não
        rationale: "Não — essa é a letra G, não C."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Contando C's
    description: Conte quantas letras C.
    exercises:
      - type: reading
        question: Quantos C's em 'COCÔ'? (2/1/3)
        correctAnswer: "2"
        rationale: "COCÔ tem 2 C's: conte letra por letra."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: C Grande
    description: Identifique C maiúscula.
    exercises:
      - type: reading
        question: Qual é o C grande? (C/c)
        correctAnswer: C
        rationale: "O C grande é o maiúsculo — usado no começo de nomes."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: C Pequeno
    description: Identifique c minúscula.
    exercises:
      - type: reading
        question: Qual é o c pequeno? (C/c)
        correctAnswer: c
        rationale: "O c pequeno é o minúsculo — usado dentro das palavras."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: C na Palavra
    description: Identifique onde está o C.
    exercises:
      - type: reading
        question: Onde está o C em 'SUCO'? (início/meio/fim)
        correctAnswer: meio
        rationale: "Em SUCO, o C está no meio."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão C
    description: Revise tudo sobre a letra C.
    exercises:
      - type: reading
        question: "A letra C é uma? (vogal/consoante)"
        correctAnswer: consoante
        rationale: "C é uma consoante (todas as letras que não são vogais)."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
