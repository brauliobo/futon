title: Reconhecimento da Letra E
level: 1A
subject: portuguese
example: Identifique e reconheça a letra E.
pages:
  - pageNumber: 1
    title: E Maiúscula
    description: Encontre a letra E maiúscula.
    exercises:
      - { type: reading, question: ""Qual é a letra E? (E/F/G)"", correctAnswer: "E" }
  - pageNumber: 2
    title: E Minúscula
    description: Encontre a letra e minúscula.
    exercises:
      - { type: reading, question: ""Qual é a letra e? (e/f/g)"", correctAnswer: "e" }
  - pageNumber: 3
    title: E em Palavras
    description: Encontre a letra E em uma palavra.
    exercises:
      - { type: reading, question: ""Onde está o E em 'BEBÊ'? (início/meio/fim)"", correctAnswer: "início" }
  - pageNumber: 4
    title: Som da Letra E
    description: Reconheça o som da letra E.
    exercises:
      - { type: reading, question: ""Que letra faz o som 'ééé'? (A/E/I)"", correctAnswer: "E" }
  - pageNumber: 5
    title: E ou Não E
    description: Identifique se é a letra E.
    exercises:
      - { type: reading, question: ""Esta é a letra E? 'E' (sim/não)"", correctAnswer: "sim" }
  - pageNumber: 6
    title: Contando E's
    description: Conte quantas letras E.
    exercises:
      - { type: reading, question: ""Quantos E's em 'BEBÊ'? (1/2/3)"", correctAnswer: "3" }
  - pageNumber: 7
    title: E Grande
    description: Identifique E maiúscula.
    exercises:
      - { type: reading, question: ""Qual é o E grande? (E/e)"", correctAnswer: "E" }
  - pageNumber: 8
    title: E Pequeno
    description: Identifique e minúscula.
    exercises:
      - { type: reading, question: ""Qual é o e pequeno? (E/e)"", correctAnswer: "e" }
  - pageNumber: 9
    title: Última Letra
    description: Identifique a última letra.
    exercises:
      - { type: reading, question: ""Qual é a última letra de 'DOCE'? (D/C/E)"", correctAnswer: "E" }
  - pageNumber: 10
    title: Revisão E
    description: Revise tudo sobre a letra E.
    exercises:
      - { type: reading, question: ""A letra E é uma? (vogal/consoante)"", correctAnswer: "vogal" }
target: 10
