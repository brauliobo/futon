title: Reconhecimento da Letra E
level: 1A
subject: portuguese
example: "Identifique e reconheça a letra E em diversas situações."
pages:
  - pageNumber: 1
    title: E Maiúscula e Minúscula
    description: Identifique as formas da letra E.
    exercises:
      - { type: reading, question: "Qual é a letra E? (D/E/F)", correctAnswer: "E" }
      - { type: reading, question: "Qual é a letra e? (d/e/f)", correctAnswer: "e" }
      - { type: reading, question: "E maiúscula ou minúscula? 'E' (maiúscula/minúscula)", correctAnswer: "maiúscula" }
      - { type: reading, question: "E maiúscula ou minúscula? 'e' (maiúscula/minúscula)", correctAnswer: "minúscula" }
      - { type: reading, question: "Qual letra vem depois de D? (C/E/F)", correctAnswer: "E" }
      - { type: reading, question: "Qual letra vem antes de F? (D/E/G)", correctAnswer: "E" }
  - pageNumber: 2
    title: E em Palavras
    description: Encontre a letra E em palavras.
    exercises:
      - { type: reading, question: "Onde está o E em 'EVA'? (início/meio/fim)", correctAnswer: "início" }
      - { type: reading, question: "Onde está o E em 'MESA'? (início/meio/fim)", correctAnswer: "meio" }
      - { type: reading, question: "Onde está o E em 'PELE'? (início/meio/fim)", correctAnswer: "fim" }
      - { type: reading, question: "Quantos E's em 'EVA'? (1/2/3)", correctAnswer: "1" }
      - { type: reading, question: "Quantos E's em 'BEBÊ'? (1/2/3)", correctAnswer: "2" }
      - { type: reading, question: "Quantos E's em 'ELEFANTE'? (2/3/4)", correctAnswer: "3" }
  - pageNumber: 3
    title: Som da Letra E
    description: Reconheça o som da letra E.
    exercises:
      - { type: reading, question: "Que letra faz o som 'eee'? (A/E/I)", correctAnswer: "E" }
      - { type: reading, question: "E é (vogal/consoante)", correctAnswer: "vogal" }
      - { type: reading, question: "Qual começa com E? (escola/livro/sol)", correctAnswer: "escola" }
      - { type: reading, question: "Qual começa com E? (elefante/mesa/dia)", correctAnswer: "elefante" }
      - { type: reading, question: "Qual começa com E? (estrela/casa/pé)", correctAnswer: "estrela" }
      - { type: reading, question: "Qual tem E no meio? (perna/casa/rua)", correctAnswer: "perna" }
  - pageNumber: 4
    title: Comparando Letras
    description: Distinga a letra E.
    exercises:
      - { type: reading, question: "Esta é a letra E? 'F' (sim/não)", correctAnswer: "não" }
      - { type: reading, question: "Esta é a letra E? 'E' (sim/não)", correctAnswer: "sim" }
      - { type: reading, question: "Qual NÃO é a letra E? (E/e/F)", correctAnswer: "F" }
      - { type: reading, question: "Qual é o E grande? (E/e)", correctAnswer: "E" }
      - { type: reading, question: "Qual é o e pequeno? (E/e)", correctAnswer: "e" }
      - { type: reading, question: "Qual é a letra e? (c/e/d)", correctAnswer: "e" }
  - pageNumber: 5
    title: Palavras com E
    description: Reconheça palavras que começam com E.
    exercises:
      - { type: reading, question: "Primeira letra de 'ESCOLA'? (E/S/C)", correctAnswer: "E" }
      - { type: reading, question: "Primeira letra de 'ESTRELA'? (E/S/T)", correctAnswer: "E" }
      - { type: reading, question: "Primeira letra de 'ELEFANTE'? (E/L/F)", correctAnswer: "E" }
      - { type: reading, question: "Primeira letra de 'ESPELHO'? (E/S/P)", correctAnswer: "E" }
      - { type: reading, question: "'EU' começa com qual letra? (E/U/eu)", correctAnswer: "E" }
      - { type: reading, question: "'ELA' começa com qual letra? (E/L/A)", correctAnswer: "E" }
target: 30
