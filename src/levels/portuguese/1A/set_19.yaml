title: Maiúsculas e Minúsculas
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Maiúsculas vs minúsculas. Pareamento de forma caixa-alta/caixa-baixa."
example: "Diferencie letras maiúsculas e minúsculas. Ex.: Qual é diferente: A, a, A, A? → segunda."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: A Grande e Pequeno
    description: Compare A e a.
    exercises:
      - type: reading
        question: "Qual é diferente: A, a, A, A? (terceira/primeira/segunda)"
        correctAnswer: segunda
        rationale: "A segunda é a que difere das demais no formato."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: Nomes Próprios
    description: Identifique nomes que começam maiúsculos.
    exercises:
      - type: reading
        question: Como escrevemos nomes de pessoas? (ana/ANA)
        correctAnswer: ANA
        rationale: "Nomes próprios começam com letra maiúscula."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: Início de Frase
    description: Reconheça maiúscula no início.
    exercises:
      - type: reading
        question: Como começa uma frase? (Casa/casa)
        correctAnswer: Casa
        rationale: "Frases começam com letra maiúscula."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: B ou b
    description: Diferencie B maiúsculo de b minúsculo.
    exercises:
      - type: reading
        question: Qual é o B grande? (B/b)
        correctAnswer: B
        rationale: "O B grande é o maiúsculo — usado no começo de nomes."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: Meio da Palavra
    description: Identifique minúsculas no meio.
    exercises:
      - type: reading
        question: Como escrevemos o meio de 'Casa'? (ASA/asa)
        correctAnswer: asa
        rationale: "O miolo da palavra é escrito em minúsculas: 'asa'."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: C ou c
    description: Diferencie C de c.
    exercises:
      - type: reading
        question: Qual é o c pequeno? (c/C)
        correctAnswer: c
        rationale: "O c pequeno é o minúsculo — usado dentro das palavras."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: Palavra GATO
    description: Identifique maiúsculas e minúsculas.
    exercises:
      - type: reading
        question: Quantas maiúsculas tem 'Gato'? (1/0/2)
        correctAnswer: "1"
        rationale: "Conte as letras maiúsculas: 1."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: Todas Maiúsculas
    description: Reconheça palavras em maiúsculas.
    exercises:
      - type: reading
        question: Qual está toda em maiúsculas? (Casa/casa/CASA)
        correctAnswer: CASA
        rationale: "'CASA' — todas as letras são maiúsculas."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: Todas Minúsculas
    description: Reconheça palavras em minúsculas.
    exercises:
      - type: reading
        question: Qual está toda em minúsculas? (bola/BOLA/Bola)
        correctAnswer: bola
        rationale: "'bola' — todas as letras são minúsculas."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão Maiúsculas
    description: Revise maiúsculas e minúsculas.
    exercises:
      - type: reading
        question: Nomes próprios começam com letra? (minúscula/maiúscula)
        correctAnswer: maiúscula
        rationale: "Nomes próprios começam com letra maiúscula."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
