title: Palavras Simples - DA DE DI DO DU
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Palavras com sílabas em D. Consolida som /d/."
example: Reconheça sílabas simples com a letra D.
pages:
  - pageNumber: 1
    title: DA
    description: Reconheça a sílaba DA.
    exercises:
      - type: reading
        question: "Que sílaba é esta: DA? (DA/DE/DI)"
        correctAnswer: DA
        rationale: "A sílaba DA forma-se juntando suas letras."
        difficulty: 1
        objectives: [pt.basic_literacy]
