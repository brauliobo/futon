title: Palavras Simples - CA CE CI CO CU
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Palavras com sílabas em C. Reforça distinção CA/CO/CU = /k/ vs CE/CI = /s/."
example: "Reconheça sílabas simples com a letra C. Ex.: Que sílaba é esta: CA? → CA."
pages:
  - pageNumber: 1
    title: CA
    description: Reconheça a sílaba CA.
    exercises:
      - type: reading
        question: "Que sílaba é esta: CA? (CA/CE/CI)"
        correctAnswer: CA
        rationale: "A sílaba CA forma-se juntando suas letras."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: CE
    description: Reconheça a sílaba CE.
    exercises:
      - type: reading
        question: "Que sílaba é esta: CE? (CA/CE/CI)"
        correctAnswer: CE
        rationale: "A sílaba CE forma-se juntando suas letras."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: CI
    description: Reconheça a sílaba CI.
    exercises:
      - type: reading
        question: "Que sílaba é esta: CI? (CE/CI/CO)"
        correctAnswer: CI
        rationale: "A sílaba CI forma-se juntando suas letras."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: CO
    description: Reconheça a sílaba CO.
    exercises:
      - type: reading
        question: "Que sílaba é esta: CO? (CI/CO/CU)"
        correctAnswer: CO
        rationale: "A sílaba CO forma-se juntando suas letras."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: CU
    description: Reconheça a sílaba CU.
    exercises:
      - type: reading
        question: "Que sílaba é esta: CU? (CO/CU/CA)"
        correctAnswer: CU
        rationale: "A sílaba CU forma-se juntando suas letras."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Palavra CASA
    description: Reconheça a palavra CASA.
    exercises:
      - type: reading
        question: "Que palavra é esta: CASA? (CASA/CAÇA/CAMA)"
        correctAnswer: CASA
        rationale: "Leia as letras em ordem — forma a palavra CASA."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: Palavra COCO
    description: Reconheça a palavra COCO.
    exercises:
      - type: reading
        question: "Que palavra é esta: COCO? (COCO/COCA/COMO)"
        correctAnswer: COCO
        rationale: "Leia as letras em ordem — forma a palavra COCO."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: Primeira Sílaba
    description: Identifique a primeira sílaba.
    exercises:
      - type: reading
        question: Qual é a primeira sílaba de CUCA? (CU/CA)
        correctAnswer: CU
        rationale: "A primeira sílaba de 'CUCA' é CU."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: Última Sílaba
    description: Identifique a última sílaba.
    exercises:
      - type: reading
        question: Qual é a última sílaba de SACO? (SA/CO)
        correctAnswer: CO
        rationale: "A última sílaba de 'SACO' é CO."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão C
    description: Revise as sílabas com C.
    exercises:
      - type: reading
        question: Qual sílaba forma 'see'? (CE/CI/CO)
        correctAnswer: CE
        rationale: "A sílaba CE representa o som 'see'."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
