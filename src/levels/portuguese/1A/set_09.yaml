title: Reconhecimento da Letra M
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Reconhecimento de consoante. Associe som ao traçado, incluindo variações (C = /k/ ou /s/)."
example: Identifique e reconheça a letra M.
pages:
  - pageNumber: 1
    title: M Maiúscula
    description: Encontre a letra M maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra M? (M/N/W)
        correctAnswer: M
        rationale: Reveja o trecho relevante do texto.
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: M Minúscula
    description: Encontre a letra m minúscula.
    exercises:
      - type: reading
        question: Qual é a letra m? (m/n/w)
        correctAnswer: m
        rationale: Reveja o trecho relevante do texto.
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: M em Palavras
    description: Encontre a letra M em uma palavra.
    exercises:
      - type: reading
        question: Onde está o M em 'MAMÃ'? (início/meio/fim)
        correctAnswer: início
        rationale: Reveja o trecho relevante do texto.
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: Som da Letra M
    description: Reconheça o som da letra M.
    exercises:
      - type: reading
        question: Que letra faz o som 'mmm'? (M/N/L)
        correctAnswer: M
        rationale: Reveja o trecho relevante do texto.
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: M ou Não M
    description: Identifique se é a letra M.
    exercises:
      - type: reading
        question: Esta é a letra M? 'N' (sim/não)
        correctAnswer: não
        rationale: Reveja o trecho relevante do texto.
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Contando M's
    description: Conte quantas letras M.
    exercises:
      - type: reading
        question: Quantos M's em 'MAMÃ'? (1/2/3)
        correctAnswer: "2"
        rationale: Reveja o trecho relevante do texto.
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: M Grande
    description: Identifique M maiúscula.
    exercises:
      - type: reading
        question: Qual é o M grande? (M/m)
        correctAnswer: M
        rationale: Reveja o trecho relevante do texto.
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: M Pequeno
    description: Identifique m minúscula.
    exercises:
      - type: reading
        question: Qual é o m pequeno? (M/m)
        correctAnswer: m
        rationale: Reveja o trecho relevante do texto.
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: M na Palavra
    description: Identifique onde está o M.
    exercises:
      - type: reading
        question: Onde está o M em 'GOMA'? (início/meio/fim)
        correctAnswer: meio
        rationale: Reveja o trecho relevante do texto.
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão M
    description: Revise tudo sobre a letra M.
    exercises:
      - type: reading
        question: A letra M é uma? (vogal/consoante)
        correctAnswer: consoante
        rationale: Reveja o trecho relevante do texto.
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
