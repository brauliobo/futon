title: Reconhecimento da Letra M
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Reconhecimento de consoante. Associe som ao traçado, incluindo variações (C = /k/ ou /s/)."
example: "Identifique e reconheça a letra M. Ex.: Qual é a letra M? → M."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: M Maiúscula
    description: Encontre a letra M maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra M? (W/N/M)
        correctAnswer: M
        rationale: "M — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: M Minúscula
    description: Encontre a letra m minúscula.
    exercises:
      - type: reading
        question: Qual é a letra m? (w/n/m)
        correctAnswer: m
        rationale: "m — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: M em Palavras
    description: Encontre a letra M em uma palavra.
    exercises:
      - type: reading
        question: Onde está o M em 'MAMÃ'? (fim/meio/início)
        correctAnswer: início
        rationale: "Em MAMÃ, o M está no início."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: Som da Letra M
    description: Reconheça o som da letra M.
    exercises:
      - type: reading
        question: Que letra faz o som 'mmm'? (M/N/L)
        correctAnswer: M
        rationale: "Abra a boca e diga 'mmm' — é o som de M."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: M ou Não M
    description: Identifique se é a letra M.
    exercises:
      - type: reading
        question: Esta é a letra M? 'N' (não/sim)
        correctAnswer: não
        rationale: "Não — essa é a letra N, não M."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Contando M's
    description: Conte quantas letras M.
    exercises:
      - type: reading
        question: Quantos M's em 'MAMÃ'? (3/2/1)
        correctAnswer: "2"
        rationale: "MAMÃ tem 2 M's: conte letra por letra."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: M Grande
    description: Identifique M maiúscula.
    exercises:
      - type: reading
        question: Qual é o M grande? (m/M)
        correctAnswer: M
        rationale: "O M grande é o maiúsculo — usado no começo de nomes."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: M Pequeno
    description: Identifique m minúscula.
    exercises:
      - type: reading
        question: Qual é o m pequeno? (m/M)
        correctAnswer: m
        rationale: "O m pequeno é o minúsculo — usado dentro das palavras."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: M na Palavra
    description: Identifique onde está o M.
    exercises:
      - type: reading
        question: Onde está o M em 'GOMA'? (fim/meio/início)
        correctAnswer: meio
        rationale: "Em GOMA, o M está no meio."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão M
    description: Revise tudo sobre a letra M.
    exercises:
      - type: reading
        question: A letra M é uma? (consoante/vogal)
        correctAnswer: consoante
        rationale: "M é uma consoante (todas as letras que não são vogais)."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
