title: Palavras Simples - BA BE BI BO BU
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Palavras com sílabas em B. Consolida som /b/."
example: "Reconheça sílabas simples com a letra B. Ex.: Que sílaba é esta: BA? → BA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
