title: Palavras de 4 Letras
level: 1A
subject: portuguese
example: Reconheça palavras simples de 4 letras.
pages:
  - pageNumber: 1
    title: Palavra CASA
    description: Reconheça palavras com 4 letras.
    exercises:
      - { type: reading, question: ""Quantas letras tem 'CASA'? (3/4/5)"", correctAnswer: "4" }
  - pageNumber: 2
    title: Palavra BOLA
    description: Identifique palavras de 4 letras.
    exercises:
      - { type: reading, question: ""Que palavra é esta: BOLA? (BOLA/BELA/BILA)"", correctAnswer: "BOLA" }
  - pageNumber: 3
    title: Palavra GATO
    description: Reconheça a palavra GATO.
    exercises:
      - { type: reading, question: ""Que palavra é esta: GATO? (GATO/PATO/MATO)"", correctAnswer: "GATO" }
  - pageNumber: 4
    title: Palavra PATO
    description: Identifique a palavra PATO.
    exercises:
      - { type: reading, question: ""Que palavra é esta: PATO? (GATO/PATO/RATO)"", correctAnswer: "PATO" }
  - pageNumber: 5
    title: Palavra DADO
    description: Reconheça a palavra DADO.
    exercises:
      - { type: reading, question: ""Que palavra é esta: DADO? (DADO/DEDO/DODO)"", correctAnswer: "DADO" }
  - pageNumber: 6
    title: Primeira Sílaba
    description: Identifique a primeira sílaba.
    exercises:
      - { type: reading, question: ""Qual é a primeira sílaba de 'MALA'? (MA/LA)"", correctAnswer: "MA" }
  - pageNumber: 7
    title: Segunda Sílaba
    description: Identifique a segunda sílaba.
    exercises:
      - { type: reading, question: ""Qual é a segunda sílaba de 'SOPA'? (SO/PA)"", correctAnswer: "PA" }
  - pageNumber: 8
    title: Quantas Sílabas
    description: Conte as sílabas da palavra.
    exercises:
      - { type: reading, question: ""Quantas sílabas tem 'COCA'? (1/2/3)"", correctAnswer: "2" }
  - pageNumber: 9
    title: Letras Iguais
    description: Identifique letras repetidas.
    exercises:
      - { type: reading, question: ""Que letra aparece duas vezes em 'COCO'? (C/O)"", correctAnswer: "O" }
  - pageNumber: 10
    title: Revisão 4 Letras
    description: Revise palavras de 4 letras.
    exercises:
      - { type: reading, question: ""Qual palavra tem 4 letras? (EU/CASA/ESCOLA)"", correctAnswer: "CASA" }
target: 10
