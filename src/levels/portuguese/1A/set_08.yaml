title: Reconhecimento da Letra D
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: Conjunto de portuguese/1A.
example: Identifique e reconheça a letra D.
pages:
  - pageNumber: 1
    title: D Maiúscula
    description: Encontre a letra D maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra D? (D/B/P)
        correctAnswer: D
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 2
    title: D Minúscula
    description: Encontre a letra d minúscula.
    exercises:
      - type: reading
        question: Qual é a letra d? (d/b/p)
        correctAnswer: d
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 3
    title: D em Palavras
    description: Encontre a letra D em uma palavra.
    exercises:
      - type: reading
        question: Onde está o D em 'DEDO'? (início/meio/fim)
        correctAnswer: início
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 4
    title: Som da Letra D
    description: Reconheça o som da letra D.
    exercises:
      - type: reading
        question: Que letra faz o som 'ddd'? (D/B/T)
        correctAnswer: D
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 5
    title: D ou Não D
    description: Identifique se é a letra D.
    exercises:
      - type: reading
        question: Esta é a letra D? 'D' (sim/não)
        correctAnswer: sim
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 6
    title: Contando D's
    description: Conte quantas letras D.
    exercises:
      - type: reading
        question: Quantos D's em 'DADOS'? (1/2/3)
        correctAnswer: "2"
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 7
    title: D Grande
    description: Identifique D maiúscula.
    exercises:
      - type: reading
        question: Qual é o D grande? (D/d)
        correctAnswer: D
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 8
    title: D Pequeno
    description: Identifique d minúscula.
    exercises:
      - type: reading
        question: Qual é o d pequeno? (D/d)
        correctAnswer: d
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 9
    title: D na Palavra
    description: Identifique onde está o D.
    exercises:
      - type: reading
        question: Onde está o D em 'NADA'? (início/meio/fim)
        correctAnswer: meio
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 10
    title: Revisão D
    description: Revise tudo sobre a letra D.
    exercises:
      - type: reading
        question: A letra D é uma? (vogal/consoante)
        correctAnswer: consoante
        rationale: Reveja o trecho relevante do texto.
target: 10
