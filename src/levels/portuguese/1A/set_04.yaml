title: Reconhecimento da Letra O
level: 1A
subject: portuguese
example: Identifique e reconheça a letra O.
pages:
  - pageNumber: 1
    title: O Maiúscula
    description: Encontre a letra O maiúscula.
    exercises:
      - { type: reading, question: ""Qual é a letra O? (O/P/Q)"", correctAnswer: "O" }
  - pageNumber: 2
    title: O Minúscula
    description: Encontre a letra o minúscula.
    exercises:
      - { type: reading, question: ""Qual é a letra o? (o/p/q)"", correctAnswer: "o" }
  - pageNumber: 3
    title: O em Palavras
    description: Encontre a letra O em uma palavra.
    exercises:
      - { type: reading, question: ""Onde está o O em 'OVO'? (início/meio/fim)"", correctAnswer: "início" }
  - pageNumber: 4
    title: Som da Letra O
    description: Reconheça o som da letra O.
    exercises:
      - { type: reading, question: ""Que letra faz o som 'ooo'? (A/O/U)"", correctAnswer: "O" }
  - pageNumber: 5
    title: O ou Não O
    description: Identifique se é a letra O.
    exercises:
      - { type: reading, question: ""Esta é a letra O? 'O' (sim/não)"", correctAnswer: "sim" }
  - pageNumber: 6
    title: Contando O's
    description: Conte quantas letras O.
    exercises:
      - { type: reading, question: ""Quantos O's em 'BOLO'? (1/2/3)"", correctAnswer: "2" }
  - pageNumber: 7
    title: O Grande
    description: Identifique O maiúscula.
    exercises:
      - { type: reading, question: ""Qual é o O grande? (O/o)"", correctAnswer: "O" }
  - pageNumber: 8
    title: O Pequeno
    description: Identifique o minúscula.
    exercises:
      - { type: reading, question: ""Qual é o o pequeno? (O/o)"", correctAnswer: "o" }
  - pageNumber: 9
    title: Final da Palavra
    description: Identifique a letra final.
    exercises:
      - { type: reading, question: ""Qual é a última letra de 'GATO'? (A/T/O)"", correctAnswer: "O" }
  - pageNumber: 10
    title: Revisão O
    description: Revise tudo sobre a letra O.
    exercises:
      - { type: reading, question: ""A letra O é uma? (vogal/consoante)"", correctAnswer: "vogal" }
target: 10
