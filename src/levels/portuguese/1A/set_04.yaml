title: Reconhecimento da Letra O
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Reconhecimento de vogal isolada. Associe som ao traçado — base da alfabetização."
example: "Identifique e reconheça a letra O. Ex.: Qual é a letra O? → O."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: O Maiúscula
    description: Encontre a letra O maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra O? (O/P/Q)
        correctAnswer: O
        rationale: "O — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: O Minúscula
    description: Encontre a letra o minúscula.
    exercises:
      - type: reading
        question: Qual é a letra o? (o/p/q)
        correctAnswer: o
        rationale: "o — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: O em Palavras
    description: Encontre a letra O em uma palavra.
    exercises:
      - type: reading
        question: Onde está o O em 'OVO'? (início/meio/fim)
        correctAnswer: início
        rationale: "Em OVO, o O está no início."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: Som da Letra O
    description: Reconheça o som da letra O.
    exercises:
      - type: reading
        question: Que letra faz o som 'ooo'? (A/O/U)
        correctAnswer: O
        rationale: "Abra a boca e diga 'ooo' — é o som de O."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: O ou Não O
    description: Identifique se é a letra O.
    exercises:
      - type: reading
        question: Esta é a letra O? 'O' (sim/não)
        correctAnswer: sim
        rationale: "Sim — é mesmo a letra O."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Contando O's
    description: Conte quantas letras O.
    exercises:
      - type: reading
        question: Quantos O's em 'BOLO'? (1/2/3)
        correctAnswer: "2"
        rationale: "BOLO tem 2 O's: conte letra por letra."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: O Grande
    description: Identifique O maiúscula.
    exercises:
      - type: reading
        question: Qual é o O grande? (o/O)
        correctAnswer: O
        rationale: "O O grande é o maiúsculo — usado no começo de nomes."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: O Pequeno
    description: Identifique o minúscula.
    exercises:
      - type: reading
        question: Qual é o o pequeno? (o/O)
        correctAnswer: o
        rationale: "O o pequeno é o minúsculo — usado dentro das palavras."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: Final da Palavra
    description: Identifique a letra final.
    exercises:
      - type: reading
        question: Qual é a última letra de 'GATO'? (A/O/T)
        correctAnswer: O
        rationale: "Em 'GATO', a última letra é 'O'."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão O
    description: Revise tudo sobre a letra O.
    exercises:
      - type: reading
        question: A letra O é uma? (consoante/vogal)
        correctAnswer: vogal
        rationale: "O é uma vogal (A, E, I, O, U)."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
