title: Reconhecimento da Letra O
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: Conjunto de portuguese/1A.
example: Identifique e reconheça a letra O.
pages:
  - pageNumber: 1
    title: O Maiúscula
    description: Encontre a letra O maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra O? (O/P/Q)
        correctAnswer: O
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 2
    title: O Minúscula
    description: Encontre a letra o minúscula.
    exercises:
      - type: reading
        question: Qual é a letra o? (o/p/q)
        correctAnswer: o
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 3
    title: O em Palavras
    description: Encontre a letra O em uma palavra.
    exercises:
      - type: reading
        question: Onde está o O em 'OVO'? (início/meio/fim)
        correctAnswer: início
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 4
    title: Som da Letra O
    description: Reconheça o som da letra O.
    exercises:
      - type: reading
        question: Que letra faz o som 'ooo'? (A/O/U)
        correctAnswer: O
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 5
    title: O ou Não O
    description: Identifique se é a letra O.
    exercises:
      - type: reading
        question: Esta é a letra O? 'O' (sim/não)
        correctAnswer: sim
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 6
    title: Contando O's
    description: Conte quantas letras O.
    exercises:
      - type: reading
        question: Quantos O's em 'BOLO'? (1/2/3)
        correctAnswer: "2"
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 7
    title: O Grande
    description: Identifique O maiúscula.
    exercises:
      - type: reading
        question: Qual é o O grande? (O/o)
        correctAnswer: O
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 8
    title: O Pequeno
    description: Identifique o minúscula.
    exercises:
      - type: reading
        question: Qual é o o pequeno? (O/o)
        correctAnswer: o
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 9
    title: Final da Palavra
    description: Identifique a letra final.
    exercises:
      - type: reading
        question: Qual é a última letra de 'GATO'? (A/T/O)
        correctAnswer: O
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 10
    title: Revisão O
    description: Revise tudo sobre a letra O.
    exercises:
      - type: reading
        question: A letra O é uma? (vogal/consoante)
        correctAnswer: vogal
        rationale: Reveja o trecho relevante do texto.
target: 10
