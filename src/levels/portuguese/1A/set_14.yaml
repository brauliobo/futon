title: Palavras Simples - MA ME MI MO MU
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Palavras com sílabas em M. Consolida som /m/ nasal."
example: "Reconheça sílabas simples com a letra M. Ex.: Que sílaba é esta: MA? → MA."
pages:
  - pageNumber: 1
    title: MA
    description: Reconheça a sílaba MA.
    exercises:
      - type: reading
        question: "Que sílaba é esta: MA? (MA/ME/MI)"
        correctAnswer: MA
        rationale: "A sílaba MA forma-se juntando suas letras."
        difficulty: 1
        objectives: [pt.basic_literacy]
