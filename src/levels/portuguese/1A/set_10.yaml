title: Reconhecimento da Letra P
level: 1A
subject: portuguese
difficulty: 1
objectives: [pt.basic_literacy]
authorNotes: Conjunto de portuguese/1A.
example: Identifique e reconheça a letra P.
pages:
  - pageNumber: 1
    title: P Maiúscula
    description: Encontre a letra P maiúscula.
    exercises:
      - { type: reading, question: "Qual é a letra P? (P/B/R)", correctAnswer: "P" }
  - pageNumber: 2
    title: P Minúscula
    description: Encontre a letra p minúscula.
    exercises:
      - { type: reading, question: "Qual é a letra p? (p/b/q)", correctAnswer: "p" }
  - pageNumber: 3
    title: P em Palavras
    description: Encontre a letra P em uma palavra.
    exercises:
      - { type: reading, question: "Onde está o P em 'PAPAI'? (início/meio/fim)", correctAnswer: "início" }
  - pageNumber: 4
    title: Som da Letra P
    description: Reconheça o som da letra P.
    exercises:
      - { type: reading, question: "Que letra faz o som 'ppp'? (P/B/T)", correctAnswer: "P" }
  - pageNumber: 5
    title: P ou Não P
    description: Identifique se é a letra P.
    exercises:
      - { type: reading, question: "Esta é a letra P? 'P' (sim/não)", correctAnswer: "sim" }
  - pageNumber: 6
    title: Contando P's
    description: Conte quantas letras P.
    exercises:
      - { type: reading, question: "Quantos P's em 'PAPAI'? (1/2/3)", correctAnswer: "2" }
  - pageNumber: 7
    title: P Grande
    description: Identifique P maiúscula.
    exercises:
      - { type: reading, question: "Qual é o P grande? (P/p)", correctAnswer: "P" }
  - pageNumber: 8
    title: P Pequeno
    description: Identifique p minúscula.
    exercises:
      - { type: reading, question: "Qual é o p pequeno? (P/p)", correctAnswer: "p" }
  - pageNumber: 9
    title: P na Palavra
    description: Identifique onde está o P.
    exercises:
      - { type: reading, question: "Onde está o P em 'SOPA'? (início/meio/fim)", correctAnswer: "meio" }
  - pageNumber: 10
    title: Revisão P
    description: Revise tudo sobre a letra P.
    exercises:
      - { type: reading, question: "A letra P é uma? (vogal/consoante)", correctAnswer: "consoante" }
target: 10
