title: Reconhecimento da Letra P
level: 1A
subject: portuguese
difficulty: 1
objectives:
  - pt.basic_literacy
authorNotes: "Reconhecimento de consoante. Associe som ao traçado, incluindo variações (C = /k/ ou /s/)."
example: Identifique e reconheça a letra P.
pages:
  - pageNumber: 1
    title: P Maiúscula
    description: Encontre a letra P maiúscula.
    exercises:
      - type: reading
        question: Qual é a letra P? (P/B/R)
        correctAnswer: P
        rationale: "P — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 2
    title: P Minúscula
    description: Encontre a letra p minúscula.
    exercises:
      - type: reading
        question: Qual é a letra p? (p/b/q)
        correctAnswer: p
        rationale: "p — observe o traçado e escolha a forma certa."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 3
    title: P em Palavras
    description: Encontre a letra P em uma palavra.
    exercises:
      - type: reading
        question: Onde está o P em 'PAPAI'? (início/meio/fim)
        correctAnswer: início
        rationale: "Em PAPAI, o P está no início."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 4
    title: Som da Letra P
    description: Reconheça o som da letra P.
    exercises:
      - type: reading
        question: Que letra faz o som 'ppp'? (P/B/T)
        correctAnswer: P
        rationale: "Abra a boca e diga 'ppp' — é o som de P."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 5
    title: P ou Não P
    description: Identifique se é a letra P.
    exercises:
      - type: reading
        question: Esta é a letra P? 'P' (sim/não)
        correctAnswer: sim
        rationale: "Sim — é mesmo a letra P."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 6
    title: Contando P's
    description: Conte quantas letras P.
    exercises:
      - type: reading
        question: Quantos P's em 'PAPAI'? (1/2/3)
        correctAnswer: "2"
        rationale: "PAPAI tem 2 P's: conte letra por letra."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 7
    title: P Grande
    description: Identifique P maiúscula.
    exercises:
      - type: reading
        question: Qual é o P grande? (P/p)
        correctAnswer: P
        rationale: "O P grande é o maiúsculo — usado no começo de nomes."
        difficulty: 1
        objectives: [pt.basic_literacy]
  - pageNumber: 8
    title: P Pequeno
    description: Identifique p minúscula.
    exercises:
      - type: reading
        question: Qual é o p pequeno? (P/p)
        correctAnswer: p
        rationale: "O p pequeno é o minúsculo — usado dentro das palavras."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 9
    title: P na Palavra
    description: Identifique onde está o P.
    exercises:
      - type: reading
        question: Onde está o P em 'SOPA'? (início/meio/fim)
        correctAnswer: meio
        rationale: "Em SOPA, o P está no meio."
        difficulty: 2
        objectives: [pt.basic_literacy]
  - pageNumber: 10
    title: Revisão P
    description: Revise tudo sobre a letra P.
    exercises:
      - type: reading
        question: A letra P é uma? (vogal/consoante)
        correctAnswer: consoante
        rationale: "P é uma consoante (todas as letras que não são vogais)."
        difficulty: 2
        objectives: [pt.basic_literacy]
target: 10
