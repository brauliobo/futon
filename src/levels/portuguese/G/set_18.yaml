title: 📖 Literatura Brasileira - Pré-Modernismo e Modernismo
level: G
subject: portuguese
difficulty: 4
objectives: [EF09LP02, EF09LP03]
authorNotes: Pré-Modernismo (1902-1922) — Euclides da Cunha, Lima Barreto, Monteiro Lobato. Modernismo 1ª fase (1922-1930) — Semana de Arte Moderna, Oswald de Andrade, Manuel Bandeira.
example: "Modernismo: ruptura com tradição, linguagem coloquial, verso livre. Ex.: Semana de Arte Moderna de 1922."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Pré-Modernismo - Contexto
    description: Transição entre século XIX e XX — questões sociais brasileiras.
    exercises:
      - type: paragraph
        question: "O Pré-Modernismo se caracteriza por: (perfeição formal/ruptura total com o passado/denúncia de problemas sociais do Brasil real/idealização da nação)"
        correctAnswer: denúncia de problemas sociais do Brasil real
        difficulty: 2
        rationale: Pré-Modernismo = retrato crítico do Brasil profundo — sertão, exclusão social, crise da república.
        objectives: [EF09LP02]
  - pageNumber: 2
    title: Euclides da Cunha
    description: "'Os Sertões' — Guerra de Canudos e o sertanejo."
    exercises:
      - type: paragraph
        question: "A obra 'Os Sertões' de Euclides da Cunha descreve: (a abolição da escravidão/a cidade do Rio de Janeiro/a Guerra de Canudos e o sertanejo nordestino/a vida no litoral)"
        correctAnswer: a Guerra de Canudos e o sertanejo nordestino
        difficulty: 2
        rationale: Os Sertões = relato jornalístico e literário da Guerra de Canudos — marco do Pré-Modernismo.
        objectives: [EF09LP02]
  - pageNumber: 3
    title: Lima Barreto
    description: Crítica à sociedade carioca e ao preconceito racial.
    exercises:
      - type: paragraph
        question: "Lima Barreto é conhecido por: (parnasianismo/poesia indianista/crítica social ao Rio de Janeiro e ao preconceito racial/naturalismo científico)"
        correctAnswer: crítica social ao Rio de Janeiro e ao preconceito racial
        difficulty: 2
        rationale: Lima Barreto = Pré-Modernismo; denúncia do preconceito e exclusão social na Primeira República.
        objectives: [EF09LP02]
  - pageNumber: 4
    title: Semana de Arte Moderna
    description: 1922 — ruptura com o passado e proposta de uma arte verdadeiramente brasileira.
    exercises:
      - type: paragraph
        question: "A Semana de Arte Moderna de 1922 aconteceu em: (Rio de Janeiro/Salvador/Recife/São Paulo)"
        correctAnswer: São Paulo
        difficulty: 1
        rationale: A Semana de Arte Moderna foi realizada no Teatro Municipal de São Paulo, em fevereiro de 1922.
        objectives: [EF09LP02]
  - pageNumber: 5
    title: Características do Modernismo
    description: Verso livre, linguagem coloquial, humor, ruptura com tradição.
    exercises:
      - type: paragraph
        question: "O Modernismo brasileiro se caracteriza por: (culto à forma perfeita/verso livre, linguagem coloquial e ruptura com modelos europeus/indianismo/naturalismo científico)"
        correctAnswer: verso livre, linguagem coloquial e ruptura com modelos europeus
        difficulty: 1
        rationale: Modernismo = liberdade formal, brasilidade, linguagem do povo, ruptura com parnasianismo.
        objectives: [EF09LP02]
  - pageNumber: 6
    title: Oswald de Andrade
    description: "'Manifesto Antropófago' — devoração crítica da cultura europeia."
    exercises:
      - type: paragraph
        question: "O 'Manifesto Antropófago' de Oswald de Andrade propunha: (rejeitar toda cultura estrangeira/devorar criticamente a cultura europeia para criar algo brasileiro/copiar o estilo europeu/retornar ao Romantismo)"
        correctAnswer: devorar criticamente a cultura europeia para criar algo brasileiro
        difficulty: 2
        rationale: Antropofagia = metáfora de consumir e transformar a influência estrangeira em algo original.
        objectives: [EF09LP03]
  - pageNumber: 7
    title: Manuel Bandeira
    description: Poesia coloquial e intimista — 'Libertinagem', 'Pasárgada'.
    exercises:
      - type: paragraph
        question: "Manuel Bandeira é conhecido pelo: (condoreirismo/poesia intimista, coloquial e de temas cotidianos/naturalismo/parnasianismo)"
        correctAnswer: poesia intimista, coloquial e de temas cotidianos
        difficulty: 2
        rationale: Manuel Bandeira = modernismo intimista; linguagem simples, cotidiano, humor e melancolia.
        objectives: [EF09LP02]
  - pageNumber: 8
    title: Tarsila do Amaral
    description: Pintura modernista — 'Abaporu', 'Operários'.
    exercises:
      - type: paragraph
        question: "A pintura 'Abaporu' de Tarsila do Amaral inspirou: (o Romantismo/o Manifesto Antropófago de Oswald de Andrade/o Naturalismo/o Parnasianismo)"
        correctAnswer: o Manifesto Antropófago de Oswald de Andrade
        difficulty: 2
        rationale: Abaporu (homem que come gente) inspirou a metáfora antropofágica do manifesto de Oswald.
        objectives: [EF09LP03]
  - pageNumber: 9
    title: Verso Livre
    description: Sem métrica nem rima obrigatórias — liberdade formal.
    exercises:
      - type: paragraph
        question: "O verso livre do Modernismo significa: (versos muito curtos/ausência de métrica e rima obrigatórias/rimas pobres/ausência de ritmo qualquer)"
        correctAnswer: ausência de métrica e rima obrigatórias
        difficulty: 2
        rationale: Verso livre = liberdade da forma; pode ter ritmo mas dispensa métrica e rima fixas.
        objectives: [EF09LP02]
  - pageNumber: 10
    title: Revisão Integrada
    description: Cronologia e características literárias.
    exercises:
      - type: paragraph
        question: "O evento que marca o início do Modernismo brasileiro é: (publicação de Os Sertões/Semana de Arte Moderna de 1922/publicação de Iracema/abolição da escravidão)"
        correctAnswer: Semana de Arte Moderna de 1922
        difficulty: 1
        rationale: A Semana de Arte Moderna de 1922 é o marco inaugural do Modernismo brasileiro.
        objectives: [EF09LP02]
target: 10
