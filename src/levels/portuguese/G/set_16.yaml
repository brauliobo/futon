title: 📖 Literatura Brasileira - Realismo e Naturalismo
level: G
subject: portuguese
difficulty: 4
objectives: [EF08LP02, EF09LP02]
authorNotes: Realismo (1881-1902) — objetividade, crítica social, psicologia dos personagens; Machado de Assis. Naturalismo — determinismo, cientificismo; Aluísio Azevedo, Zola.
example: "Realismo: foco na realidade objetiva e crítica social. Ex.: Machado de Assis — ironia e análise psicológica em 'Dom Casmurro'."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Realismo - Características
    description: Objetividade, crítica social, personagens complexos.
    exercises:
      - type: paragraph
        question: "O Realismo se opõe ao Romantismo por valorizar: (sentimentalismo exacerbado/emoção e idealização/objetividade e crítica da realidade social/indianismo e patriotismo)"
        correctAnswer: objetividade e crítica da realidade social
        difficulty: 1
        rationale: Realismo reage ao Romantismo — privilegia observação objetiva da realidade e crítica social.
        objectives: [EF08LP02]
  - pageNumber: 2
    title: Machado de Assis
    description: Maior escritor do Realismo brasileiro — estilo irônico e psicológico.
    exercises:
      - type: paragraph
        question: "Machado de Assis é reconhecido pelo uso de: (sentimentalismo extremo/ironia, psicologia dos personagens e crítica social/indianismo/condoreirismo)"
        correctAnswer: ironia, psicologia dos personagens e crítica social
        difficulty: 2
        rationale: Machado = ironia fina, análise psicológica profunda e crítica às classes dominantes brasileiras.
        objectives: [EF09LP02]
  - pageNumber: 3
    title: Obras de Machado
    description: Dom Casmurro, Memórias Póstumas, Quincas Borba.
    exercises:
      - type: paragraph
        question: "Em qual obra Machado usa um narrador morto para contar sua própria história? (Dom Casmurro/Quincas Borba/Memórias Póstumas de Brás Cubas/O Alienista)"
        correctAnswer: Memórias Póstumas de Brás Cubas
        difficulty: 2
        rationale: Memórias Póstumas = narrador defunto autor, inovação radical na literatura brasileira.
        objectives: [EF09LP02]
  - pageNumber: 4
    title: Dom Casmurro
    description: Capitu traiu Bentinho? — ambiguidade como recurso literário.
    exercises:
      - type: paragraph
        question: "A grande questão de 'Dom Casmurro' é: (o destino do Brasil/Capitu traiu ou não Bentinho?/a morte do filho/a pobreza do narrador)"
        correctAnswer: Capitu traiu ou não Bentinho?
        difficulty: 1
        rationale: A ambiguidade sobre a fidelidade de Capitu é a questão central e mais debatida de Dom Casmurro.
        objectives: [EF09LP02]
  - pageNumber: 5
    title: Naturalismo - Características
    description: Determinismo, cientificismo, classes populares, impulsos biológicos.
    exercises:
      - type: paragraph
        question: "O Naturalismo é marcado pelo: (idealismo/determinismo — comportamento determinado por herança e meio/subjetivismo/indianismo)"
        correctAnswer: determinismo — comportamento determinado por herança e meio
        difficulty: 2
        rationale: Naturalismo = determinismo científico; personagens são determinados pela hereditariedade e pelo ambiente social.
        objectives: [EF09LP02]
  - pageNumber: 6
    title: Aluísio Azevedo
    description: Principal representante do Naturalismo brasileiro — 'O Cortiço'.
    exercises:
      - type: paragraph
        question: "A obra 'O Cortiço' de Aluísio Azevedo descreve: (a vida da burguesia/a vida em uma habitação coletiva pobre com denúncia social/o mundo dos índios/uma história de amor romântico)"
        correctAnswer: a vida em uma habitação coletiva pobre com denúncia social
        difficulty: 2
        rationale: O Cortiço = Naturalismo; vida miserável, determinismo ambiental, crítica à exploração social.
        objectives: [EF09LP02]
  - pageNumber: 7
    title: Narrador Realista
    description: Onisciente e crítico — olhar exterior e analítico.
    exercises:
      - type: paragraph
        question: "O narrador realista geralmente é: (participante/em 1ª pessoa sentimental/onisciente analítico em 3ª pessoa/lírico e apaixonado)"
        correctAnswer: onisciente analítico em 3ª pessoa
        difficulty: 2
        rationale: Narrador realista = 3ª pessoa, onisciente, distanciado, analisando os personagens como um cientista.
        objectives: [EF08LP02]
  - pageNumber: 8
    title: Linguagem Realista
    description: Objetiva, sem excessos sentimentais, com ironia.
    exercises:
      - type: paragraph
        question: "Qual recurso é típico de Machado de Assis? (hipérbole sentimental/ironia que questiona a moralidade burguesa/linguagem técnica científica/poesia indianista)"
        correctAnswer: ironia que questiona a moralidade burguesa
        difficulty: 2
        rationale: A ironia machadiana desmascara a hipocrisia e as contradições da sociedade burguesa brasileira.
        objectives: [EF08LP02]
  - pageNumber: 9
    title: Contexto Histórico
    description: Realismo surgiu com abolição, república e positivismo.
    exercises:
      - type: paragraph
        question: "O Realismo brasileiro surgiu em contexto de: (descobrimento do Brasil/abolição da escravidão, proclamação da república e cientificismo/industrialização europeia/guerra colonial)"
        correctAnswer: abolição da escravidão, proclamação da república e cientificismo
        difficulty: 2
        rationale: Realismo surgiu no período de transformações sociais e influência do cientificismo (Darwin, Comte).
        objectives: [EF09LP02]
  - pageNumber: 10
    title: Revisão Integrada
    description: Comparar Romantismo e Realismo.
    exercises:
      - type: paragraph
        question: "Qual afirmação diferencia Realismo de Romantismo? (Romantismo é objetivo; Realismo é subjetivo/Realismo critica a realidade; Romantismo idealiza/ambos são iguais/Realismo é anterior ao Romantismo)"
        correctAnswer: Realismo critica a realidade; Romantismo idealiza
        difficulty: 2
        rationale: "Oposição fundamental: Romantismo = idealização/evasão; Realismo = crítica/objetividade."
        objectives: [EF09LP02]
target: 10
