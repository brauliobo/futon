title: 📚 Leitura - Texto Argumentativo
level: G
subject: portuguese
difficulty: 4
objectives: [EF08LP01, EF09LP03]
authorNotes: Interpretação de texto argumentativo — identificar tese, argumentos, contra-argumentos, operadores argumentativos e estratégias persuasivas.
example: "Tese = posição defendida; argumentos = razões para crer na tese; operadores = conectivos que orientam a argumentação."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Texto Argumentativo
    description: |
      Leia e responda:
      "As redes sociais prejudicam a saúde mental dos jovens. Estudos apontam que o uso excessivo aumenta casos de ansiedade e depressão. Além disso, a exposição a padrões de beleza irreais gera baixa autoestima. Embora ofereçam conexão e entretenimento, seus malefícios superam os benefícios. Portanto, é urgente regular o acesso de adolescentes a essas plataformas."
    exercises:
      - type: paragraph
        question: "Qual é a tese do texto? (redes sociais são úteis/redes sociais prejudicam a saúde mental dos jovens/jovens usam redes sociais demais/redes sociais geram depressão)"
        correctAnswer: redes sociais prejudicam a saúde mental dos jovens
        difficulty: 1
        rationale: A tese está na primeira frase — posição que o texto defende ao longo da argumentação.
        objectives: [EF08LP01]
  - pageNumber: 2
    title: Identificar Argumentos
    description: Encontrar os argumentos que sustentam a tese.
    exercises:
      - type: paragraph
        question: "Qual é um dos argumentos usados no texto? (jovens gostam de redes sociais/estudos apontam aumento de ansiedade e depressão/redes conectam pessoas/a internet é útil)"
        correctAnswer: estudos apontam aumento de ansiedade e depressão
        difficulty: 1
        rationale: Este dado de pesquisa é argumento de autoridade que sustenta a tese sobre malefícios.
        objectives: [EF08LP01]
  - pageNumber: 3
    title: Contra-Argumento
    description: Reconhecer o argumento contrário.
    exercises:
      - type: paragraph
        question: "Qual trecho é o contra-argumento do texto? (Estudos apontam.../Embora ofereçam conexão e entretenimento.../Além disso, a exposição.../Portanto, é urgente...)"
        correctAnswer: Embora ofereçam conexão e entretenimento...
        difficulty: 2
        rationale: "'Embora' introduz concessão — reconhece benefício das redes para depois refutá-lo."
        objectives: [EF09LP03]
  - pageNumber: 4
    title: Operadores Argumentativos
    description: Conectivos que orientam a argumentação.
    exercises:
      - type: paragraph
        question: "O conectivo 'Além disso' no texto serve para: (introduzir a tese/acrescentar argumento/apresentar contra-argumento/concluir)"
        correctAnswer: acrescentar argumento
        difficulty: 2
        rationale: "'Além disso' é operador aditivo — acrescenta novo argumento à tese."
        objectives: [EF09LP03]
  - pageNumber: 5
    title: Argumento de Autoridade
    description: Citação de pesquisa ou especialista.
    exercises:
      - type: paragraph
        question: "Qual estratégia argumentativa é usada em 'Estudos apontam que'? (exemplificação/autoridade/comparação/ironia)"
        correctAnswer: autoridade
        difficulty: 2
        rationale: Citar estudos/pesquisas = argumento de autoridade — recorre a fontes confiáveis.
        objectives: [EF09LP03]
  - pageNumber: 6
    title: Conclusão
    description: Identificar a conclusão do texto.
    exercises:
      - type: paragraph
        question: "Qual frase é a conclusão do texto? (As redes sociais prejudicam.../Estudos apontam que.../Portanto, é urgente regular.../A exposição a padrões...)"
        correctAnswer: Portanto, é urgente regular...
        difficulty: 1
        rationale: "'Portanto' é conectivo conclusivo — indica a proposta final que decorre dos argumentos."
        objectives: [EF08LP01]
  - pageNumber: 7
    title: Proposta do Texto
    description: O que o texto propõe ou defende como solução.
    exercises:
      - type: paragraph
        question: "Qual é a proposta do texto? (proibir redes sociais/regular o acesso de adolescentes/fechar plataformas/educar professores)"
        correctAnswer: regular o acesso de adolescentes
        difficulty: 2
        rationale: A proposta explícita é regulação do acesso dos adolescentes às plataformas.
        objectives: [EF09LP03]
  - pageNumber: 8
    title: Intenção do Autor
    description: Identificar o objetivo comunicativo.
    exercises:
      - type: paragraph
        question: "A intenção do autor é: (informar sobre redes sociais/convencer o leitor da necessidade de regulação/divertir com histórias/descrever como as redes funcionam)"
        correctAnswer: convencer o leitor da necessidade de regulação
        difficulty: 2
        rationale: Texto argumentativo visa persuadir — o autor quer convencer sobre a necessidade de regulação.
        objectives: [EF09LP03]
  - pageNumber: 9
    title: Linguagem do Texto
    description: Características da linguagem argumentativa.
    exercises:
      - type: paragraph
        question: "A linguagem deste texto argumentativo é: (poética e metafórica/objetiva e persuasiva/coloquial e informal/descritiva e neutra)"
        correctAnswer: objetiva e persuasiva
        difficulty: 2
        rationale: Texto argumentativo usa linguagem objetiva com dados e conectivos que orientam a persuasão.
        objectives: [EF09LP03]
  - pageNumber: 10
    title: Avaliação da Argumentação
    description: Avaliar a qualidade dos argumentos.
    exercises:
      - type: paragraph
        question: "A argumentação do texto é eficaz porque: (usa muitos adjetivos/apresenta tese clara, dados e contra-argumento/repete a tese várias vezes/é muito longa)"
        correctAnswer: apresenta tese clara, dados e contra-argumento
        difficulty: 3
        rationale: Argumentação eficaz = tese explícita + argumentos com evidências + reconhecimento e refutação do contra-argumento.
        objectives: [EF09LP03]
target: 10
