title: Predicativo e Complementos
level: G
subject: portuguese
difficulty: 3
objectives: [EF09LP07]
authorNotes: Predicativo do sujeito, predicativo do objeto, agente da passiva.
example: "Ele é professor (predicativo do sujeito). Ex.: Em 'Ela está cansada', 'cansada' é: → predicativo do sujeito."
pages:
  - pageNumber: 1
    title: Predicativo do Sujeito
    description: Qualifica o sujeito por meio de verbo de ligação.
    exercises:
      - type: paragraph
        question: "Em 'Ela está cansada', 'cansada' é: (predicativo do sujeito/do objeto/adjunto/aposto)"
        correctAnswer: predicativo do sujeito
        difficulty: 1
        rationale: Verbo 'estar' liga; 'cansada' qualifica o sujeito.
        objectives: [EF09LP07]
  - pageNumber: 2
    title: Predicativo do Objeto
    description: Qualifica o objeto.
    exercises:
      - type: paragraph
        question: "Em 'Considero Ana inteligente', 'inteligente' é: (predicativo do objeto/do sujeito/adjunto/aposto)"
        correctAnswer: predicativo do objeto
        difficulty: 3
        rationale: "'Inteligente' caracteriza o objeto 'Ana'."
        objectives: [EF09LP07]
  - pageNumber: 3
    title: Complemento Nominal
    description: Completa o sentido de um nome — necessário e com preposição.
    exercises:
      - type: paragraph
        question: "Em 'A necessidade de estudo aumentou', 'de estudo' é: (complemento nominal/adjunto/objeto/sujeito)"
        correctAnswer: complemento nominal
        difficulty: 3
        rationale: "'Necessidade' exige complemento regido por 'de'."
        objectives: [EF09LP07]
  - pageNumber: 4
    title: Agente da Passiva
    description: Quem pratica a ação na voz passiva.
    exercises:
      - type: paragraph
        question: "Em 'O livro foi escrito por ela', 'por ela' é: (agente da passiva/objeto/sujeito/adjunto)"
        correctAnswer: agente da passiva
        difficulty: 2
        rationale: Agente da passiva é introduzido por 'por' (ou 'de').
        objectives: [EF09LP07]
  - pageNumber: 5
    title: Sujeito Paciente
    description: Quem sofre a ação em voz passiva.
    exercises:
      - type: paragraph
        question: "Em 'A carta foi lida pelo professor', o sujeito paciente é: (A carta/pelo professor/foi lida/professor)"
        correctAnswer: A carta
        difficulty: 2
        rationale: Na passiva, o sujeito é paciente — recebe a ação.
        objectives: [EF09LP07]
  - pageNumber: 6
    title: Voz Ativa e Passiva
    description: Reorganização de termos entre as vozes.
    exercises:
      - type: paragraph
        question: "Passiva de 'Os alunos escreveram o texto': (O texto foi escrito pelos alunos/O texto escreveu os alunos/Os alunos foram escritos/O texto foram escrito)"
        correctAnswer: O texto foi escrito pelos alunos
        difficulty: 3
        rationale: Voz passiva — ser + particípio + agente.
        objectives: [EF09LP07]
  - pageNumber: 7
    title: Voz Reflexiva
    description: Sujeito e objeto coincidem.
    exercises:
      - type: paragraph
        question: "Frase em voz reflexiva: (Ela se feriu/Ela foi ferida/Ela feriu o vidro/Ela feriu-o)"
        correctAnswer: Ela se feriu
        difficulty: 2
        rationale: Sujeito 'Ela' pratica e recebe a ação.
        objectives: [EF09LP07]
  - pageNumber: 8
    title: Conversão Ativa → Passiva
    description: O verbo deve ser transitivo direto.
    exercises:
      - type: paragraph
        question: "Qual voz não pode ser convertida em passiva? (Gosto de música/Comprei um livro/Escrevi uma carta/Ela enviou a mensagem)"
        correctAnswer: Gosto de música
        difficulty: 3
        rationale: "'Gostar' é transitivo indireto; não admite passiva analítica."
        objectives: [EF09LP07]
  - pageNumber: 9
    title: Aposto vs Predicativo
    description: Aposto identifica (substantivo); predicativo qualifica.
    exercises:
      - type: paragraph
        question: "Em 'Pedro, meu irmão, chegou', 'meu irmão' é: (aposto/predicativo/adjunto/vocativo)"
        correctAnswer: aposto
        difficulty: 2
        rationale: Explica quem é Pedro; função de aposto.
        objectives: [EF09LP07]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique o termo indicado.
    exercises:
      - type: paragraph
        question: "Em 'O povo elegeu-o presidente', 'presidente' é: (predicativo do objeto/do sujeito/aposto/adjunto)"
        correctAnswer: predicativo do objeto
        difficulty: 4
        rationale: "'Presidente' qualifica o objeto direto 'o'."
        objectives: [EF09LP07]
target: 10
