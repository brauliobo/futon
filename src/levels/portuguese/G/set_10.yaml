title: 📝 Regência Verbal
level: G
subject: portuguese
difficulty: 4
objectives: [EF08LP06, EF09LP05]
authorNotes: Regência verbal — relação de dependência entre verbo e complemento; uso correto das preposições exigidas por verbos comuns.
example: "Assistir (ver) exige preposição 'a': assisto ao jogo. Assistir (ajudar) admite OD. Preferir: prefiro X a Y."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Regência de 'Assistir'
    description: Assistir (ver/presenciar) = VTI com preposição 'a'.
    exercises:
      - type: paragraph
        question: "Correto: (Assisti o filme/Assisti ao filme/Assisti do filme/Assisti pelo filme)"
        correctAnswer: Assisti ao filme
        difficulty: 2
        rationale: "Assistir (ver/presenciar) é transitivo indireto — exige preposição 'a': assisti ao filme."
        objectives: [EF08LP06]
  - pageNumber: 2
    title: Regência de 'Visar'
    description: Visar (almejar) = VTI com 'a'; visar (apor visto) = VTD.
    exercises:
      - type: paragraph
        question: "Complete: 'O projeto visa ___ melhorar a educação.' (a/de/em/para)"
        correctAnswer: a
        difficulty: 3
        rationale: "Visar (no sentido de almejar) é transitivo indireto — exige preposição 'a': visa a melhorar."
        objectives: [EF09LP05]
  - pageNumber: 3
    title: Regência de 'Obedecer'
    description: Obedecer = VTI com 'a'.
    exercises:
      - type: paragraph
        question: "Correto: (Ele obedeceu a lei/Ele obedeceu à lei/Ele obedeceu de lei/Ele obedeceu na lei)"
        correctAnswer: Ele obedeceu à lei
        difficulty: 2
        rationale: "Obedecer é transitivo indireto — exige 'a': obedeceu à lei (a + a = à — crase obrigatória)."
        objectives: [EF08LP06]
  - pageNumber: 4
    title: Regência de 'Preferir'
    description: Preferir = VTD + OI introduzido por 'a'.
    exercises:
      - type: paragraph
        question: "Correto: (Prefiro café do que chá/Prefiro café mais que chá/Prefiro café a chá/Prefiro mais café que chá)"
        correctAnswer: Prefiro café a chá
        difficulty: 3
        rationale: Preferir = VTD (café) + OI com 'a' (a chá). Não se usa 'do que' com preferir.
        objectives: [EF09LP05]
  - pageNumber: 5
    title: Regência de 'Chegar / Ir'
    description: Chegar e ir = preposição 'a' (não 'em') com lugares.
    exercises:
      - type: paragraph
        question: "Correto: (Cheguei em casa/Cheguei a casa/Cheguei para casa/Cheguei de casa)"
        correctAnswer: Cheguei a casa
        difficulty: 2
        rationale: "Chegar + lugar = preposição 'a'. Em língua culta: cheguei a casa/ao aeroporto."
        objectives: [EF08LP06]
  - pageNumber: 6
    title: Regência de 'Namorar'
    description: Namorar = VTD (sem preposição).
    exercises:
      - type: paragraph
        question: "Correto: (Ela namora com ele/Ela namora de ele/Ela namora ele/Ela namora para ele)"
        correctAnswer: Ela namora ele
        difficulty: 2
        rationale: "Namorar é transitivo direto — não usa preposição: ela namora ele."
        objectives: [EF08LP06]
  - pageNumber: 7
    title: Regência de 'Implicar'
    description: Implicar (acarretar) = VTD; implicar (tomar implicância) = VTI com 'com'.
    exercises:
      - type: paragraph
        question: "Complete: 'A decisão implica ___ riscos.' (em/de/a/zero — sem preposição)"
        correctAnswer: zero — sem preposição
        difficulty: 3
        rationale: Implicar (acarretar) é transitivo direto — implica riscos (sem preposição).
        objectives: [EF09LP05]
  - pageNumber: 8
    title: Regência de 'Querer'
    description: Querer = VTD sem preposição na maioria dos casos.
    exercises:
      - type: paragraph
        question: "Correto: (Quero que você venha/Quero de que você venha/Quero para que você venha/Quero por você venha)"
        correctAnswer: Quero que você venha
        difficulty: 2
        rationale: Querer é transitivo direto — quero que você venha (OSS OD introduzida por 'que').
        objectives: [EF08LP06]
  - pageNumber: 9
    title: Regência de 'Precisar'
    description: Precisar = VTI com 'de'.
    exercises:
      - type: paragraph
        question: "Correto: (Preciso ajuda/Preciso de ajuda/Preciso para ajuda/Preciso em ajuda)"
        correctAnswer: Preciso de ajuda
        difficulty: 1
        rationale: "Precisar é transitivo indireto — exige preposição 'de': preciso de ajuda."
        objectives: [EF08LP06]
  - pageNumber: 10
    title: Revisão Integrada
    description: Regência verbal em contexto.
    exercises:
      - type: paragraph
        question: "Correto: (Aspiro um cargo melhor/Aspiro a um cargo melhor/Aspiro por um cargo/Aspiro para um cargo)"
        correctAnswer: Aspiro a um cargo melhor
        difficulty: 3
        rationale: "Aspirar (almejar) = VTI com preposição 'a': aspiro a um cargo melhor."
        objectives: [EF09LP05]
target: 10
