title: 📝 Revisão Geral - Nível G
level: G
subject: portuguese
difficulty: 4
objectives: [EF07LP08, EF08LP06, EF09LP02, EF09LP05, EF09LP10]
authorNotes: Revisão integrada de todos os tópicos do nível G — concordância, regência, crase, literatura brasileira, texto argumentativo e resenha.
example: "Nível G cobre: concordância verbal/nominal, regência, crase, Romantismo ao Modernismo, texto argumentativo. Ex.: 'Assisti ao filme' (regência de assistir)."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Concordância Verbal
    description: Verbo no plural correto.
    exercises:
      - type: paragraph
        question: "Complete: 'A maioria dos estudantes ___ aprovados.' (seja/foi/foram/era)"
        correctAnswer: foram
        difficulty: 2
        rationale: Expressão partitiva + plural (dos estudantes) permite concordância com o plural — foram.
        objectives: [EF08LP06]
  - pageNumber: 2
    title: Concordância Nominal
    description: Adjetivo concorda com o substantivo.
    exercises:
      - type: paragraph
        question: "Complete: 'Os alunos estavam ___ com o resultado.' (contentes/contente/contenta/contentas)"
        correctAnswer: contentes
        difficulty: 1
        rationale: Predicativo 'contentes' concorda com o sujeito plural 'alunos'.
        objectives: [EF07LP08]
  - pageNumber: 3
    title: Regência Verbal
    description: Preposição correta.
    exercises:
      - type: paragraph
        question: "Correto: (Assisti pelo jogo/Assisti o jogo/Assisti ao jogo/Assisti de jogo)"
        correctAnswer: Assisti ao jogo
        difficulty: 2
        rationale: "Assistir (ver) exige preposição 'a': assisti ao jogo."
        objectives: [EF09LP05]
  - pageNumber: 4
    title: Crase
    description: Uso correto do acento grave.
    exercises:
      - type: paragraph
        question: "Correto: (Fui a escola/Fui à escola/Fui em escola/Fui de escola)"
        correctAnswer: Fui à escola
        difficulty: 2
        rationale: "'Escola' aceita artigo 'a' → crase obrigatória: fui à escola."
        objectives: [EF09LP05]
  - pageNumber: 5
    title: Literatura - Romantismo
    description: Identificar geração/característica.
    exercises:
      - type: paragraph
        question: "Castro Alves pertence à ___ geração romântica. (1ª/2ª/3ª/4ª)"
        correctAnswer: 3ª
        difficulty: 2
        rationale: Castro Alves = 3ª geração, condoreirismo — poesia social e abolicionista.
        objectives: [EF09LP02]
  - pageNumber: 6
    title: Literatura - Realismo
    description: Identificar autor/obra.
    exercises:
      - type: paragraph
        question: "Qual obra de Machado de Assis tem um narrador defunto? (Dom Casmurro/Memórias Póstumas de Brás Cubas/O Cortiço/Iracema)"
        correctAnswer: Memórias Póstumas de Brás Cubas
        difficulty: 2
        rationale: Brás Cubas é o defunto autor — inovação machadiana no Realismo.
        objectives: [EF09LP02]
  - pageNumber: 7
    title: Literatura - Modernismo
    description: Marco do Modernismo.
    exercises:
      - type: paragraph
        question: "O Modernismo brasileiro começou com: (publicação de Dom Casmurro/Semana de Arte Moderna de 1922/publicação de Os Sertões/abolição da escravidão)"
        correctAnswer: Semana de Arte Moderna de 1922
        difficulty: 1
        rationale: 1922, São Paulo — Semana de Arte Moderna marca a ruptura modernista com a tradição literária.
        objectives: [EF09LP02]
  - pageNumber: 8
    title: Texto Argumentativo
    description: Identificar estratégia argumentativa.
    exercises:
      - type: paragraph
        question: "Usar dados de pesquisa para sustentar uma tese é um argumento de: (exemplificação/autoridade/comparação/causa e efeito)"
        correctAnswer: autoridade
        difficulty: 2
        rationale: Dados de pesquisa = argumento de autoridade; recorre à credibilidade da fonte científica.
        objectives: [EF09LP05]
  - pageNumber: 9
    title: Resenha
    description: Componente que diferencia resenha de resumo.
    exercises:
      - type: paragraph
        question: "O que a resenha tem que o resumo não tem? (mais parágrafos/avaliação crítica da obra/linguagem informal/mais citações)"
        correctAnswer: avaliação crítica da obra
        difficulty: 1
        rationale: Resenha = resumo + análise + avaliação; o resumo apenas condensa sem avaliar.
        objectives: [EF09LP10]
  - pageNumber: 10
    title: Síntese do Nível G
    description: Conceito central do nível.
    exercises:
      - type: paragraph
        question: "O que é regência verbal? (concordância do verbo com o sujeito/relação de dependência entre o verbo e seus complementos, incluindo as preposições exigidas/a forma dos verbos irregulares/o uso do hífen nos verbos)"
        correctAnswer: relação de dependência entre o verbo e seus complementos, incluindo as preposições exigidas
        difficulty: 3
        rationale: Regência verbal trata das preposições (ou sua ausência) que os verbos exigem — essencial para escrever com correção.
        objectives: [EF09LP05]
target: 10
