title: 📚 Leitura - Texto Científico e Jornalístico
level: G
subject: portuguese
difficulty: 4
objectives: [EF08LP01, EF09LP03]
authorNotes: Características do texto científico — linguagem técnica, objetividade, impessoalidade; jornalístico — manchete, lide, notícia, reportagem, editorial.
example: "Texto científico: impessoal, técnico, baseado em dados. Notícia: responde quem? o quê? quando? onde? como? por quê?"
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Texto Científico - Características
    description: Linguagem objetiva, técnica e impessoal.
    exercises:
      - type: paragraph
        question: "Qual característica NÃO é típica do texto científico? (linguagem objetiva/uso de dados e evidências/opinião pessoal do autor/impessoalidade)"
        correctAnswer: opinião pessoal do autor
        difficulty: 1
        rationale: Texto científico evita subjetividade — é objetivo, baseado em dados e impessoal.
        objectives: [EF08LP01]
  - pageNumber: 2
    title: Vocabulário Técnico
    description: Texto científico usa terminologia específica da área.
    exercises:
      - type: paragraph
        question: "Em texto de biologia, 'fotossíntese' é um exemplo de: (metáfora/ironia/vocabulário técnico/linguagem coloquial)"
        correctAnswer: vocabulário técnico
        difficulty: 1
        rationale: Vocabulário técnico (jargão científico) é específico de uma área do conhecimento.
        objectives: [EF08LP01]
  - pageNumber: 3
    title: Estrutura da Notícia - Lide
    description: Primeiro parágrafo responde quem, o quê, quando, onde.
    exercises:
      - type: paragraph
        question: "O lide de uma notícia responde principalmente: (o contexto histórico/a opinião do redator/quem, o quê, quando, onde/a história completa)"
        correctAnswer: quem, o quê, quando, onde
        difficulty: 1
        rationale: Lide (lead) = abertura informativa que responde às perguntas básicas da notícia.
        objectives: [EF09LP03]
  - pageNumber: 4
    title: Manchete
    description: Título da notícia — conciso e informativo.
    exercises:
      - type: paragraph
        question: "A manchete de uma notícia deve ser: (longa e detalhada/concisa e informativa/poética e figurada/opinativa e subjetiva)"
        correctAnswer: concisa e informativa
        difficulty: 1
        rationale: Manchete é título que sintetiza o fato de forma clara e atraente — concisa e informativa.
        objectives: [EF09LP03]
  - pageNumber: 5
    title: Notícia vs Reportagem
    description: Notícia relata fato atual; reportagem aprofunda com contexto e análise.
    exercises:
      - type: paragraph
        question: "Qual diferencia reportagem de notícia? (a reportagem é mais curta/a reportagem aprofunda o tema com análise e contexto/notícia tem mais fontes/notícia é mais antiga)"
        correctAnswer: a reportagem aprofunda o tema com análise e contexto
        difficulty: 2
        rationale: Reportagem = notícia + aprofundamento; inclui análise, múltiplas fontes e contexto.
        objectives: [EF09LP03]
  - pageNumber: 6
    title: Editorial
    description: Texto opinativo de um jornal — expressa posição da publicação.
    exercises:
      - type: paragraph
        question: "O editorial de um jornal expressa: (fatos objetivos/a opinião da publicação/resultados científicos/a fala de entrevistados)"
        correctAnswer: a opinião da publicação
        difficulty: 2
        rationale: Editorial é gênero opinativo — representa a posição do veículo de imprensa sobre um tema.
        objectives: [EF09LP03]
  - pageNumber: 7
    title: Impessoalidade
    description: Texto científico usa construções impessoais.
    exercises:
      - type: paragraph
        question: "Qual frase é mais adequada em texto científico? (Eu descobri que.../Os resultados indicam que.../Achei que.../Parece que...)"
        correctAnswer: Os resultados indicam que...
        difficulty: 2
        rationale: Texto científico usa impessoalidade — sujeito são dados/resultados, não o pesquisador.
        objectives: [EF08LP01]
  - pageNumber: 8
    title: Fonte no Jornalismo
    description: Credibilidade exige citar fontes.
    exercises:
      - type: paragraph
        question: "Por que jornalistas citam fontes? (para ser mais longo/para dar credibilidade e responsabilidade à informação/para confundir o leitor/para economizar palavras)"
        correctAnswer: para dar credibilidade e responsabilidade à informação
        difficulty: 2
        rationale: Citar fontes responsabiliza a informação e aumenta a credibilidade da reportagem.
        objectives: [EF09LP03]
  - pageNumber: 9
    title: Inferência em Texto Informativo
    description: Deduzir informação não explícita.
    exercises:
      - type: paragraph
        question: "Em uma notícia que diz 'as temperaturas caíram 15°C em 24h', podemos inferir: (houve uma chuva/provavelmente houve impacto no cotidiano das pessoas/o sol brilhou/as temperaturas aumentaram)"
        correctAnswer: provavelmente houve impacto no cotidiano das pessoas
        difficulty: 3
        rationale: Queda brusca de temperatura implica impactos (vestuário, saúde, transporte) — inferência lógica.
        objectives: [EF08LP01]
  - pageNumber: 10
    title: Revisão Integrada
    description: Comparar texto científico e jornalístico.
    exercises:
      - type: paragraph
        question: "O que distingue texto científico de notícia? (científico é mais curto/notícia apresenta hipóteses/científico busca comprovar hipóteses com método; notícia relata fatos atuais/ambos são idênticos)"
        correctAnswer: científico busca comprovar hipóteses com método; notícia relata fatos atuais
        difficulty: 3
        rationale: "Diferença fundamental: método científico (hipótese → experimento → conclusão) vs. relato jornalístico (fato atual)."
        objectives: [EF09LP03]
target: 10
