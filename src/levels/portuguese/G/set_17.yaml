title: 📖 Literatura Brasileira - Parnasianismo e Simbolismo
level: G
subject: portuguese
difficulty: 4
objectives: [EF08LP02, EF09LP02]
authorNotes: Parnasianismo (1882-1902) — forma perfeita, impessoalidade, 'arte pela arte'; Olavo Bilac, Alberto de Oliveira. Simbolismo — subjetividade, musicalidade, sinestesia; Cruz e Sousa, Alphonsus de Guimaraens.
example: "Parnasianismo: forma rigorosa, perfeição técnica. Simbolismo: musicaidade e sugestão. Ex.: sinestesia = mistura de sentidos."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Parnasianismo - Características
    description: Arte pela arte, perfeição formal, impessoalidade.
    exercises:
      - type: paragraph
        question: "A principal característica do Parnasianismo é: (sentimentalismo/perfeição técnica e formal — arte pela arte/engajamento social/liberdade formal)"
        correctAnswer: perfeição técnica e formal — arte pela arte
        difficulty: 1
        rationale: Parnasianismo = culto à forma perfeita (métrica, rima) sem compromisso com sentimento ou engajamento.
        objectives: [EF08LP02]
  - pageNumber: 2
    title: Olavo Bilac
    description: Maior parnasiano brasileiro — 'Via Láctea', 'Ouvir Estrelas'.
    exercises:
      - type: paragraph
        question: "Olavo Bilac é o principal representante do: (Romantismo/Realismo/Parnasianismo/Modernismo)"
        correctAnswer: Parnasianismo
        difficulty: 1
        rationale: Olavo Bilac = Parnasianismo; famoso pela precisão formal e pelo soneto perfeito.
        objectives: [EF09LP02]
  - pageNumber: 3
    title: Soneto Parnasiano
    description: Forma preferida — 14 versos, rimas ricas, decassílabos.
    exercises:
      - type: paragraph
        question: "Por que parnasianos preferiam o soneto? (é a forma mais longa/permite máxima liberdade/exige perfeição formal com estrutura rígida/é a forma mais emocional)"
        correctAnswer: exige perfeição formal com estrutura rígida
        difficulty: 2
        rationale: Soneto = forma rígida que desafia e demonstra o domínio técnico — ideal para o ideal parnasiano.
        objectives: [EF09LP02]
  - pageNumber: 4
    title: Simbolismo - Características
    description: Subjetividade, musicaidade, sugestão, sinestesia.
    exercises:
      - type: paragraph
        question: "Qual característica define o Simbolismo? (objetividade/subjetividade, musicaidade e uso de símbolos e sinestesia/crítica social/perfeição formal)"
        correctAnswer: subjetividade, musicaidade e uso de símbolos e sinestesia
        difficulty: 2
        rationale: Simbolismo = expressão indireta e sugestiva da realidade interior — símbolo, música, sinestesia.
        objectives: [EF08LP02]
  - pageNumber: 5
    title: Sinestesia
    description: Mistura de sensações de diferentes sentidos.
    exercises:
      - type: paragraph
        question: "Em 'O silêncio doce da tarde', qual figura de linguagem é usada? (metáfora/comparação/sinestesia/hipérbole)"
        correctAnswer: sinestesia
        difficulty: 2
        rationale: Silêncio (audição) + doce (paladar/tato) — mistura de sensações de sentidos diferentes = sinestesia.
        objectives: [EF08LP02]
  - pageNumber: 6
    title: Cruz e Sousa
    description: Principal simbolista brasileiro — 'Broquéis', 'Faróis'.
    exercises:
      - type: paragraph
        question: "Cruz e Sousa é o principal representante do: (Romantismo/Parnasianismo/Simbolismo/Realismo)"
        correctAnswer: Simbolismo
        difficulty: 1
        rationale: Cruz e Sousa = Simbolismo; negro que usou a poesia para transcender o preconceito racial.
        objectives: [EF09LP02]
  - pageNumber: 7
    title: Musicalidade no Simbolismo
    description: Aliteração, assonância, ritmo — poesia como música.
    exercises:
      - type: paragraph
        question: "A musicalidade no Simbolismo é obtida principalmente por: (rimas perfeitas/aliteração, assonância e ritmo que evocam sons musicais/língua coloquial/clareza lógica)"
        correctAnswer: aliteração, assonância e ritmo que evocam sons musicais
        difficulty: 2
        rationale: Simbolismo = poesia musical; sons das palavras evocam sensações, como na música.
        objectives: [EF08LP02]
  - pageNumber: 8
    title: Parnasianismo vs Simbolismo
    description: Principais diferenças.
    exercises:
      - type: paragraph
        question: "Qual diferença básica entre Parnasianismo e Simbolismo? (Parnasianismo é subjetivo; Simbolismo é objetivo/Parnasianismo = perfeição formal objetiva; Simbolismo = subjetividade e sugestão/ambos são idênticos/Simbolismo é anterior)"
        correctAnswer: Parnasianismo = perfeição formal objetiva; Simbolismo = subjetividade e sugestão
        difficulty: 2
        rationale: Parnasianismo = forma + objetividade; Simbolismo = símbolo + música + subjetividade.
        objectives: [EF09LP02]
  - pageNumber: 9
    title: Arte pela Arte
    description: Conceito parnasiano de valorização da beleza formal sem finalidade prática.
    exercises:
      - type: paragraph
        question: "'Arte pela arte' significa que: (a arte deve ter função social/a arte tem valor em si mesma, independente de mensagem ou utilidade/a arte deve ensinar/a arte deve ser fácil)"
        correctAnswer: a arte tem valor em si mesma, independente de mensagem ou utilidade
        difficulty: 2
        rationale: "'Arte pela arte' = estética como valor supremo, sem compromisso com utilidade ou engajamento."
        objectives: [EF09LP02]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identificar autores e movimentos.
    exercises:
      - type: paragraph
        question: "Olavo Bilac pertence ao ___ e Cruz e Sousa ao ___. (Romantismo/Realismo/Parnasianismo/Simbolismo)"
        correctAnswer: Parnasianismo/Simbolismo
        difficulty: 2
        rationale: Olavo Bilac = Parnasianismo; Cruz e Sousa = Simbolismo — dupla emblemática da poesia fin-de-siècle brasileira.
        objectives: [EF09LP02]
target: 10
