title: Sujeito e Predicado
level: G
subject: portuguese
difficulty: 3
objectives: [EF08LP06, EF09LP07]
authorNotes: Identificação de sujeito (simples, composto, oculto, indeterminado, inexistente) e predicado.
example: "O aluno estuda. — sujeito 'O aluno', predicado 'estuda'."
pages:
  - pageNumber: 1
    title: Definição de Sujeito
    description: Sujeito é o termo sobre o qual se declara algo.
    exercises:
      - type: paragraph
        question: "Em 'As crianças brincam no parque', o sujeito é: (As crianças/brincam/no parque/parque)"
        correctAnswer: As crianças
        difficulty: 2
        rationale: Sujeito concorda com o verbo e realiza a ação.
        objectives: [EF08LP06]
  - pageNumber: 2
    title: Sujeito Simples
    description: Um único núcleo.
    exercises:
      - type: paragraph
        question: "Em 'O gato dorme', o núcleo do sujeito é: (gato/dorme/o/dormindo)"
        correctAnswer: gato
        difficulty: 1
        rationale: "'Gato' é o núcleo nominal do sujeito simples."
        objectives: [EF08LP06]
  - pageNumber: 3
    title: Sujeito Composto
    description: Dois ou mais núcleos.
    exercises:
      - type: paragraph
        question: "Em 'Pedro e Ana chegaram', o sujeito é: (composto/simples/oculto/inexistente)"
        correctAnswer: composto
        difficulty: 2
        rationale: Dois núcleos coordenados — Pedro e Ana.
        objectives: [EF08LP06]
  - pageNumber: 4
    title: Sujeito Oculto
    description: Desinência verbal indica a pessoa.
    exercises:
      - type: paragraph
        question: "Em 'Estudamos à noite', o sujeito é: (nós — oculto/simples expresso/inexistente/indeterminado)"
        correctAnswer: nós — oculto
        difficulty: 2
        rationale: A desinência -mos revela a 1ª pessoa do plural.
        objectives: [EF08LP06]
  - pageNumber: 5
    title: Sujeito Indeterminado
    description: Verbo na 3ª pessoa do plural sem antecedente, ou verbo + se.
    exercises:
      - type: paragraph
        question: "Em 'Roubaram meu carro', o sujeito é: (indeterminado/simples/composto/oculto)"
        correctAnswer: indeterminado
        difficulty: 3
        rationale: 3ª pessoa plural sem referência clara indica sujeito indeterminado.
        objectives: [EF09LP07]
  - pageNumber: 6
    title: Oração sem Sujeito
    description: Verbos impessoais — haver (existir), fazer (tempo), chover.
    exercises:
      - type: paragraph
        question: "Em 'Faz muito calor hoje', o sujeito é: (inexistente/simples/oculto/composto)"
        correctAnswer: inexistente
        difficulty: 3
        rationale: Verbo 'fazer' referente a tempo é impessoal.
        objectives: [EF09LP07]
  - pageNumber: 7
    title: Predicado Verbal
    description: Núcleo é um verbo significativo.
    exercises:
      - type: paragraph
        question: "'As crianças correm no parque' tem predicado: (verbal/nominal/verbo-nominal/nenhum)"
        correctAnswer: verbal
        difficulty: 2
        rationale: Núcleo 'correm' é verbo de ação.
        objectives: [EF08LP06]
  - pageNumber: 8
    title: Predicado Nominal
    description: Verbo de ligação + predicativo do sujeito.
    exercises:
      - type: paragraph
        question: "Em 'Ela está feliz', o predicativo é: (feliz/está/ela/está feliz)"
        correctAnswer: feliz
        difficulty: 3
        rationale: "'Está' liga; 'feliz' qualifica o sujeito."
        objectives: [EF08LP06]
  - pageNumber: 9
    title: Predicado Verbo-Nominal
    description: Tem dois núcleos — um verbo e um predicativo.
    exercises:
      - type: paragraph
        question: "Em 'As crianças chegaram cansadas', o predicativo do sujeito é: (cansadas/chegaram/crianças/as)"
        correctAnswer: cansadas
        difficulty: 4
        rationale: "'Chegaram' expressa ação; 'cansadas' qualifica o sujeito."
        objectives: [EF09LP07]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique sujeito e predicado em contexto.
    exercises:
      - type: paragraph
        question: "'Choveu ontem à noite' tem: (sujeito inexistente/sujeito oculto/sujeito simples/sujeito composto)"
        correctAnswer: sujeito inexistente
        difficulty: 3
        rationale: Verbo 'chover' referente a fenômeno meteorológico é impessoal.
        objectives: [EF09LP07]
target: 10
