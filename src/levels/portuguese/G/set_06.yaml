title: Pontuação no Período Simples
level: G
subject: portuguese
difficulty: 3
objectives: [EF08LP07, EF09LP08]
authorNotes: Vírgula, ponto, ponto e vírgula, dois-pontos, reticências, travessão.
example: "Fui ao mercado, à padaria e à farmácia — vírgulas separam termos coordenados. Ex.: Pontuação correta: → Comprei pão, queijo e leite."
pages:
  - pageNumber: 1
    title: Vírgula em Enumerações
    description: Separa termos da mesma função.
    exercises:
      - type: paragraph
        question: "Pontuação correta: (Comprei pão, queijo e leite/Comprei pão queijo e leite/Comprei pão; queijo; e leite/Comprei pão: queijo: e leite)"
        correctAnswer: Comprei pão, queijo e leite
        difficulty: 1
        rationale: Vírgula separa itens; 'e' antes do último substitui vírgula.
        objectives: [EF08LP07]
  - pageNumber: 2
    title: Vírgula em Adjunto Deslocado
    description: Adjunto adverbial deslocado pede vírgula.
    exercises:
      - type: paragraph
        question: "Pontuação correta: (Ontem, cheguei cedo/Ontem cheguei cedo/Ontem: cheguei cedo/Ontem; cheguei cedo)"
        correctAnswer: Ontem, cheguei cedo
        difficulty: 2
        rationale: Adjunto adverbial antes do sujeito recebe vírgula.
        objectives: [EF08LP07]
  - pageNumber: 3
    title: Vírgula com Vocativo
    description: Vocativo é sempre isolado por vírgula.
    exercises:
      - type: paragraph
        question: "Pontuação correta: (Pedro, feche a porta/Pedro feche a porta/Pedro; feche a porta/Pedro: feche a porta)"
        correctAnswer: Pedro, feche a porta
        difficulty: 1
        rationale: Vocativo requer vírgula.
        objectives: [EF08LP07]
  - pageNumber: 4
    title: Vírgula com Aposto
    description: Aposto explicativo aparece entre vírgulas.
    exercises:
      - type: paragraph
        question: "Pontuação correta: (Machado de Assis, grande escritor, morreu em 1908/Machado de Assis grande escritor morreu em 1908/Machado de Assis: grande escritor morreu em 1908/Machado de Assis grande escritor, morreu em 1908)"
        correctAnswer: Machado de Assis, grande escritor, morreu em 1908
        difficulty: 2
        rationale: Aposto explicativo isolado por vírgulas.
        objectives: [EF08LP07]
  - pageNumber: 5
    title: Ponto e Vírgula
    description: Separa itens complexos ou orações coordenadas longas.
    exercises:
      - type: paragraph
        question: "Uso correto do ponto e vírgula: (Ele estudou; ela trabalhou/Ele estudou ela trabalhou/Ele estudou, e ela trabalhou/Ele estudou: ela trabalhou)"
        correctAnswer: Ele estudou; ela trabalhou
        difficulty: 3
        rationale: Separa orações coordenadas independentes mais longas.
        objectives: [EF09LP08]
  - pageNumber: 6
    title: Dois-pontos
    description: Anuncia enumeração, fala ou explicação.
    exercises:
      - type: paragraph
        question: "Uso correto dos dois-pontos: (Ele disse: 'Vamos!'/Ele disse; 'Vamos!'/Ele disse 'Vamos!'/Ele disse, 'Vamos!')"
        correctAnswer: "Ele disse: 'Vamos!'"
        difficulty: 2
        rationale: Dois-pontos introduz fala direta.
        objectives: [EF09LP08]
  - pageNumber: 7
    title: Travessão
    description: Marca fala de personagem ou aposto longo.
    exercises:
      - type: paragraph
        question: "Uso correto do travessão: (— Vamos embora./- Vamos embora./, Vamos embora./; Vamos embora.)"
        correctAnswer: — Vamos embora.
        difficulty: 2
        rationale: Travessão (—) indica fala direta.
        objectives: [EF09LP08]
  - pageNumber: 8
    title: Reticências
    description: Indicam suspensão, dúvida ou continuidade.
    exercises:
      - type: paragraph
        question: "Quando usar reticências? (para suspender a fala/para finalizar com certeza/para separar itens/para apresentar diálogo)"
        correctAnswer: para suspender a fala
        difficulty: 3
        rationale: Reticências sinalizam pausa ou continuidade implícita.
        objectives: [EF09LP08]
  - pageNumber: 9
    title: Vírgula entre Sujeito e Verbo
    description: Proibida.
    exercises:
      - type: paragraph
        question: "Pontuação correta: (As crianças brincam no parque/As crianças, brincam no parque/As crianças; brincam no parque/As crianças: brincam no parque)"
        correctAnswer: As crianças brincam no parque
        difficulty: 2
        rationale: Vírgula entre sujeito e verbo é erro gramatical.
        objectives: [EF08LP07]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique erro de pontuação.
    exercises:
      - type: paragraph
        question: "Frase com erro: (A professora explicou a matéria, com muita clareza/A professora, explicou a matéria/A professora explicou a matéria com clareza/A professora explicou, com clareza, a matéria)"
        correctAnswer: A professora, explicou a matéria
        difficulty: 3
        rationale: Não se coloca vírgula entre sujeito e verbo.
        objectives: [EF09LP08]
target: 10
