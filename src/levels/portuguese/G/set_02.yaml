title: Objetos Direto e Indireto
level: G
subject: portuguese
difficulty: 3
objectives: [EF08LP06, EF09LP07]
authorNotes: Verbo transitivo direto pede objeto sem preposição; transitivo indireto pede preposição.
example: "Eu comprei um livro (OD) / Eu gosto de chocolate (OI). Ex.: Em 'A ele, eu o vi ontem', o objeto pleonástico é: → o."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Verbo Transitivo Direto
    description: Completa-se sem preposição.
    exercises:
      - type: paragraph
        question: "Em 'Eu comprei um livro', o objeto direto é: (eu/livro/um livro/comprei)"
        correctAnswer: um livro
        difficulty: 2
        rationale: "'Comprar' é transitivo direto; 'um livro' completa seu sentido sem preposição."
        objectives: [EF08LP06]
  - pageNumber: 2
    title: Verbo Transitivo Indireto
    description: Completa-se com preposição.
    exercises:
      - type: paragraph
        question: "Em 'Eu gosto de chocolate', o objeto indireto é: (chocolate/de chocolate/gosto/eu)"
        correctAnswer: de chocolate
        difficulty: 3
        rationale: "'Gostar' exige preposição 'de'."
        objectives: [EF08LP06]
  - pageNumber: 3
    title: Verbo Transitivo Direto e Indireto
    description: Pede dois objetos.
    exercises:
      - type: paragraph
        question: "'Entreguei o livro ao aluno' — 'ao aluno' é: (sujeito/direto/objeto indireto/adjunto)"
        correctAnswer: objeto indireto
        difficulty: 3
        rationale: "'Entregar' é transitivo direto e indireto: livro (OD) ao aluno (OI)."
        objectives: [EF09LP07]
  - pageNumber: 4
    title: Verbo Intransitivo
    description: Não precisa de complemento.
    exercises:
      - type: paragraph
        question: "Qual verbo é intransitivo? (amar/gostar/entregar/nascer)"
        correctAnswer: nascer
        difficulty: 2
        rationale: "'Nascer' não exige complemento."
        objectives: [EF08LP06]
  - pageNumber: 5
    title: Verbo de Ligação
    description: Liga o sujeito ao predicativo, sem transitividade.
    exercises:
      - type: paragraph
        question: "Qual frase tem verbo de ligação? (Ela comprou/Ela corre/Ela está feliz/Ela chegou)"
        correctAnswer: Ela está feliz
        difficulty: 2
        rationale: "'Estar' é de ligação em 'está feliz'."
        objectives: [EF08LP06]
  - pageNumber: 6
    title: Objeto Pleonástico
    description: Repete-se para dar ênfase — geralmente pronome oblíquo.
    exercises:
      - type: paragraph
        question: "Em 'A ele, eu o vi ontem', o objeto pleonástico é: (eu/vi/ele/o)"
        correctAnswer: o
        difficulty: 4
        rationale: "'O' retoma 'a ele' para ênfase — objeto direto pleonástico."
        objectives: [EF09LP07]
  - pageNumber: 7
    title: Objetos com Pronome Oblíquo
    description: Me, te, o, a, lhe, nos funcionam como objetos.
    exercises:
      - type: paragraph
        question: "Em 'Ela me viu', 'me' é: (objeto direto/adjunto/indireto/sujeito)"
        correctAnswer: objeto direto
        difficulty: 3
        rationale: "'Ver' é transitivo direto; 'me' recebe a ação."
        objectives: [EF09LP07]
  - pageNumber: 8
    title: Distinção OD x OI
    description: Pergunte 'o quê?' (OD) ou 'a quem / de quê?' (OI).
    exercises:
      - type: paragraph
        question: "'Ele se lembrou do aniversário' — 'do aniversário' é: (sujeito/direto/adjunto/objeto indireto)"
        correctAnswer: objeto indireto
        difficulty: 3
        rationale: "'Lembrar-se' exige preposição 'de'."
        objectives: [EF09LP07]
  - pageNumber: 9
    title: Verbos Pronominais
    description: Usam pronome obrigatório — arrepender-se, queixar-se.
    exercises:
      - type: paragraph
        question: "Verbo essencialmente pronominal: (falar/caminhar/ir/arrepender-se)"
        correctAnswer: arrepender-se
        difficulty: 3
        rationale: "'Arrepender-se' exige pronome reflexivo."
        objectives: [EF09LP07]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique o complemento.
    exercises:
      - type: paragraph
        question: "'Ela deu um presente ao amigo' — 'um presente' é: (sujeito/indireto/objeto direto/adjunto)"
        correctAnswer: objeto direto
        difficulty: 3
        rationale: "'Dar' é transitivo direto e indireto: presente (OD) ao amigo (OI)."
        objectives: [EF09LP07]
target: 10
