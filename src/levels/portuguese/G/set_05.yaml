title: Tipos de Frase
level: G
subject: portuguese
difficulty: 2
objectives: [EF08LP06]
authorNotes: Frase declarativa, interrogativa, imperativa, exclamativa e optativa.
example: "Você vem? — interrogativa."
pages:
  - pageNumber: 1
    title: Frase Declarativa
    description: Informa ou afirma algo.
    exercises:
      - type: paragraph
        question: "Qual frase é declarativa? (O sol brilha/Vem aqui!/Você estuda?/Ah, que pena!)"
        correctAnswer: O sol brilha
        difficulty: 1
        rationale: Declarativa afirma fato sem exclamação nem pergunta.
        objectives: [EF08LP06]
  - pageNumber: 2
    title: Frase Interrogativa
    description: Pergunta direta ou indireta.
    exercises:
      - type: paragraph
        question: "Frase interrogativa direta: (Você vem?/Ele disse que viria/Que legal!/Cale-se!)"
        correctAnswer: Você vem?
        difficulty: 1
        rationale: Interrogativa direta termina com ponto de interrogação.
        objectives: [EF08LP06]
  - pageNumber: 3
    title: Frase Imperativa
    description: Ordem, pedido, conselho.
    exercises:
      - type: paragraph
        question: "Frase imperativa: (Estude!/Eu estudo/Estuda-se/Estudarei)"
        correctAnswer: Estude!
        difficulty: 2
        rationale: Verbo no imperativo expressa ordem.
        objectives: [EF08LP06]
  - pageNumber: 4
    title: Frase Exclamativa
    description: Expressa emoção ou ênfase.
    exercises:
      - type: paragraph
        question: "Frase exclamativa: (Que dia lindo!/Que dia é hoje?/O dia é lindo/Não é lindo)"
        correctAnswer: Que dia lindo!
        difficulty: 1
        rationale: Exclamativa expressa emoção, fechada com '!'.
        objectives: [EF08LP06]
  - pageNumber: 5
    title: Frase Optativa
    description: Expressa desejo.
    exercises:
      - type: paragraph
        question: "Frase optativa: (Que Deus te abençoe!/Deus te abençoa/Deus te abençoará/Deus abençoou)"
        correctAnswer: Que Deus te abençoe!
        difficulty: 3
        rationale: Optativa expressa desejo, geralmente no subjuntivo.
        objectives: [EF08LP06]
  - pageNumber: 6
    title: Pontuação e Sentido
    description: A pontuação altera o tipo da frase.
    exercises:
      - type: paragraph
        question: "'Você vem' vira interrogativa com: (?/!/.//,)"
        correctAnswer: '?'
        difficulty: 1
        rationale: O ponto de interrogação converte em pergunta.
        objectives: [EF08LP06]
  - pageNumber: 7
    title: Afirmativa vs Negativa
    description: Presença ou ausência de advérbio de negação.
    exercises:
      - type: paragraph
        question: "Frase negativa: (Ele não veio/Ele veio/Ele virá/Ele vem)"
        correctAnswer: Ele não veio
        difficulty: 1
        rationale: Negativa contém 'não' ou equivalente.
        objectives: [EF08LP06]
  - pageNumber: 8
    title: Período Simples vs Composto
    description: Simples tem um verbo; composto tem dois ou mais.
    exercises:
      - type: paragraph
        question: "Período simples: (Chegamos cedo/Chegamos e saímos/Se chover, volto/Gosto porque é bom)"
        correctAnswer: Chegamos cedo
        difficulty: 2
        rationale: Um único verbo → período simples.
        objectives: [EF08LP06]
  - pageNumber: 9
    title: Oração Absoluta
    description: Período simples = oração absoluta.
    exercises:
      - type: paragraph
        question: "Qual é oração absoluta? (Ele saiu cedo/Ele saiu porque estava com pressa/Se chover não vou/Quero que venha)"
        correctAnswer: Ele saiu cedo
        difficulty: 3
        rationale: Uma oração independente sem outra associada.
        objectives: [EF08LP06]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o tipo de frase.
    exercises:
      - type: paragraph
        question: "'Quem ousa desafiar?' é frase: (interrogativa/declarativa/imperativa/optativa)"
        correctAnswer: interrogativa
        difficulty: 2
        rationale: Pergunta direta.
        objectives: [EF08LP06]
target: 10
