title: 📝 Regência Nominal e Crase
level: G
subject: portuguese
difficulty: 4
objectives: [EF08LP06, EF09LP05]
authorNotes: Regência nominal — preposições exigidas por substantivos, adjetivos e advérbios derivados. Crase = fusão de 'a' com 'a' do artigo feminino ou pronome.
example: "Crase obrigatória: 'Fui à escola' (a + a). Proibida antes de masculino: 'Fui a pé'. Ex.: 'Propenso a/Propensa a'."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: O que é Regência Nominal?
    description: Substantivos, adjetivos e advérbios que exigem preposição.
    exercises:
      - type: paragraph
        question: "Complete: 'Ele tem medo ___ altura.' (de/a/em/por)"
        correctAnswer: de
        difficulty: 1
        rationale: Medo + 'de' — regência nominal do substantivo 'medo'.
        objectives: [EF08LP06]
  - pageNumber: 2
    title: Adjetivos com Preposições
    description: Adjetivos exigem preposições específicas.
    exercises:
      - type: paragraph
        question: "Complete: 'Ela é propensa ___ erros.' (a/de/em/para)"
        correctAnswer: a
        difficulty: 2
        rationale: "Propensa + 'a' — adjetivo rege preposição 'a': propensa a erros."
        objectives: [EF09LP05]
  - pageNumber: 3
    title: Substantivos com Preposições
    description: Substantivos exigem preposições específicas.
    exercises:
      - type: paragraph
        question: "Complete: 'Tenho certeza ___ sua honestidade.' (de/a/em/para)"
        correctAnswer: de
        difficulty: 2
        rationale: "Certeza + 'de' — substantivo rege 'de': certeza de sua honestidade."
        objectives: [EF08LP06]
  - pageNumber: 4
    title: Crase - Conceito
    description: Fusão da preposição 'a' com o artigo 'a' (fem.) ou pronome demonstrativo.
    exercises:
      - type: paragraph
        question: "Em 'Fui à escola', o acento grave indica: (preposição/artigo/fusão de preposição + artigo/pronome)"
        correctAnswer: fusão de preposição + artigo
        difficulty: 2
        rationale: À = preposição 'a' + artigo definido 'a'. Crase = fusão obrigatória.
        objectives: [EF08LP06]
  - pageNumber: 5
    title: Crase Obrigatória
    description: Antes de substantivo feminino com artigo definido.
    exercises:
      - type: paragraph
        question: "Correto: (Fui a cidade/Fui à cidade/Fui de cidade/Fui por cidade)"
        correctAnswer: Fui à cidade
        difficulty: 1
        rationale: "'A cidade' aceita artigo definido → crase obrigatória: à cidade."
        objectives: [EF08LP06]
  - pageNumber: 6
    title: Crase Proibida
    description: Não se usa crase antes de masculino, verbo, pronome pessoal.
    exercises:
      - type: paragraph
        question: "Correto: (Fui à pé/Fui a pé/Fui com pé/Fui por pé)"
        correctAnswer: Fui a pé
        difficulty: 2
        rationale: "'Pé' é masculino — sem artigo definido feminino → não há crase."
        objectives: [EF09LP05]
  - pageNumber: 7
    title: Crase Facultativa
    description: Antes de pronomes possessivos femininos.
    exercises:
      - type: paragraph
        question: "Qual é correto? (Dei a minha roupa/Dei à minha roupa/Ambas são corretas/Nenhuma é correta)"
        correctAnswer: Ambas são corretas
        difficulty: 3
        rationale: Antes de pronomes possessivos femininos, a crase é facultativa — ambas as formas são aceitas.
        objectives: [EF09LP05]
  - pageNumber: 8
    title: Crase com Horas
    description: Antes de horas no feminino, crase é obrigatória.
    exercises:
      - type: paragraph
        question: "Correto: (Chegou a duas horas/Chegou às duas horas/Chegou em duas horas/Chegou de duas horas)"
        correctAnswer: Chegou às duas horas
        difficulty: 2
        rationale: "Horas no feminino plural → crase: às duas horas (a + as = às)."
        objectives: [EF08LP06]
  - pageNumber: 9
    title: Crase com Pronome Demonstrativo
    description: "'Àquele/àquela' = 'a' + aquele/aquela."
    exercises:
      - type: paragraph
        question: "Complete: 'Me refiro ___ aluna.' (a/à/aquela/àquela)"
        correctAnswer: àquela
        difficulty: 3
        rationale: "'A' (preposição) + 'aquela' (pronome demonstrativo) = àquela (crase obrigatória)."
        objectives: [EF09LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Regência nominal e crase em contexto.
    exercises:
      - type: paragraph
        question: "Correto: (Ele é indiferente a problemas/Ele é indiferente aos problemas/Ambas corretas/Nenhuma correta)"
        correctAnswer: Ambas corretas
        difficulty: 3
        rationale: "'Indiferente a/aos' — ambas formas são aceitas; o uso do artigo definido varia."
        objectives: [EF09LP05]
target: 10
