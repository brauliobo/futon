title: Análise Sintática - Revisão
level: G
subject: portuguese
difficulty: 4
objectives: [EF09LP07]
authorNotes: Análise integrada de termos em períodos simples — reconhecimento das funções sintáticas.
example: "O livro que comprei é interessante. Ex.: Em 'Os alunos estudaram para a prova', o suje… → Os alunos."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Identificar o Sujeito
    description: Pergunte 'quem' ou 'o quê' antes do verbo.
    exercises:
      - type: paragraph
        question: "Em 'Os alunos estudaram para a prova', o sujeito é: (alunos/para a prova/Os alunos/estudaram)"
        correctAnswer: Os alunos
        difficulty: 2
        rationale: Quem estudou? Os alunos — núcleo 'alunos'.
        objectives: [EF09LP07]
  - pageNumber: 2
    title: Identificar o Objeto Direto
    description: Completa o verbo sem preposição.
    exercises:
      - type: paragraph
        question: "Em 'Ela leu o livro', o objeto direto é: (livro/o livro/ela/leu)"
        correctAnswer: o livro
        difficulty: 2
        rationale: "'Ler' é transitivo direto; 'o livro' é OD."
        objectives: [EF09LP07]
  - pageNumber: 3
    title: Identificar o Objeto Indireto
    description: Completa o verbo com preposição.
    exercises:
      - type: paragraph
        question: "Em 'Ele obedeceu aos pais', o objeto indireto é: (ele/pais/obedeceu/aos pais)"
        correctAnswer: aos pais
        difficulty: 3
        rationale: "'Obedecer' é TI: regência com 'a'."
        objectives: [EF09LP07]
  - pageNumber: 4
    title: Identificar o Adjunto Adverbial
    description: Ligado ao verbo ou adjetivo; tempo, lugar, modo etc.
    exercises:
      - type: paragraph
        question: "Em 'Ela chegou ontem cedo', o adjunto adverbial de tempo é: (ontem/chegou/cedo/ela)"
        correctAnswer: ontem
        difficulty: 3
        rationale: "'Ontem' situa a ação no tempo."
        objectives: [EF09LP07]
  - pageNumber: 5
    title: Identificar o Adjunto Adnominal
    description: Refere-se a substantivo.
    exercises:
      - type: paragraph
        question: "Em 'Aquela casa antiga é bela', o adjunto adnominal é: (casa/é/aquela e antiga/bela)"
        correctAnswer: aquela e antiga
        difficulty: 3
        rationale: "'Aquela' e 'antiga' qualificam o substantivo 'casa'."
        objectives: [EF09LP07]
  - pageNumber: 6
    title: Identificar o Predicativo
    description: Liga-se ao sujeito via verbo de ligação.
    exercises:
      - type: paragraph
        question: "Em 'Os alunos ficaram cansados', o predicativo do sujeito é: (ficaram/cansados/os/alunos)"
        correctAnswer: cansados
        difficulty: 3
        rationale: "'Cansados' qualifica o sujeito após verbo de ligação 'ficar'."
        objectives: [EF09LP07]
  - pageNumber: 7
    title: Identificar o Aposto
    description: Explica ou resume.
    exercises:
      - type: paragraph
        question: "Em 'O Brasil, país tropical, encanta', o aposto é: (país tropical/O Brasil/encanta/país)"
        correctAnswer: país tropical
        difficulty: 3
        rationale: "'País tropical' define o sujeito entre vírgulas."
        objectives: [EF09LP07]
  - pageNumber: 8
    title: Identificar o Vocativo
    description: Chamamento.
    exercises:
      - type: paragraph
        question: "Em 'Meus amigos, vamos começar', o vocativo é: (Meus amigos/começar/vamos/vamos começar)"
        correctAnswer: Meus amigos
        difficulty: 2
        rationale: Chamamento no início, isolado por vírgula.
        objectives: [EF09LP07]
  - pageNumber: 9
    title: Identificar Tipo de Predicado
    description: Verbal, nominal ou verbo-nominal.
    exercises:
      - type: paragraph
        question: "'Ele saiu apressado' tem predicado: (nominal/misto/verbal/verbo-nominal)"
        correctAnswer: verbo-nominal
        difficulty: 4
        rationale: "'Saiu' é ação; 'apressado' é predicativo — dois núcleos."
        objectives: [EF09LP07]
  - pageNumber: 10
    title: Revisão Integrada
    description: Análise sintática completa.
    exercises:
      - type: paragraph
        question: "Em 'Meus pais compraram um carro novo', o núcleo do objeto direto é: (novo/meus pais/um/carro)"
        correctAnswer: carro
        difficulty: 3
        rationale: "'Um carro novo' é OD; núcleo 'carro'."
        objectives: [EF09LP07]
target: 10
