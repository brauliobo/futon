title: 🔬 Análise Linguística no Texto
level: J
subject: portuguese
difficulty: 5
objectives: [EF89LP04, EF89LP05, EF89LP27]
authorNotes: Análise linguística parte do texto para refletir sobre recursos gramaticais e seus efeitos de sentido.
example: "A escolha lexical constrói sentido. Ex.: 'manifestantes' vs. 'baderneiros' → mesmo referente, avaliações opostas."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Escolha Lexical e Efeito de Sentido
    description: Palavras diferentes sobre o mesmo referente produzem avaliações distintas.
    exercises:
      - type: paragraph
        question: "Chamar o mesmo grupo de 'ativistas' ou 'agitadores' revela: (diferença de registro vocabular apenas/posicionamento ideológico do enunciador/erro gramatical/variação fonética)"
        correctAnswer: posicionamento ideológico do enunciador
        difficulty: 3
        rationale: A escolha lexical carrega julgamento de valor — é recurso discursivo intencional.
        objectives: [EF89LP04]
  - pageNumber: 2
    title: Eufemismo e Disfemismo
    description: Suavizar ou intensificar negativamente uma realidade pelo léxico.
    exercises:
      - type: paragraph
        question: "'Colaborador' no lugar de 'empregado' é exemplo de: (disfemismo/neologismo/eufemismo/arcaísmo)"
        correctAnswer: eufemismo
        difficulty: 3
        rationale: Eufemismo substitui termo direto por outro mais suave ou valorizado.
        objectives: [EF89LP04]
  - pageNumber: 3
    title: Modalização
    description: Marcas linguísticas que indicam grau de certeza ou julgamento do autor.
    exercises:
      - type: paragraph
        question: "'Provavelmente, os dados indicam melhora' — o modalizador 'provavelmente' indica: (certeza absoluta/dúvida ou possibilidade/negação/ironia)"
        correctAnswer: dúvida ou possibilidade
        difficulty: 3
        rationale: Modalizadores epistêmicos como 'provavelmente' relativizam a certeza da afirmação.
        objectives: [EF89LP05]
  - pageNumber: 4
    title: Polifonia Textual
    description: Vozes diversas coexistem no discurso.
    exercises:
      - type: paragraph
        question: "Ao citar especialistas, o artigo de opinião usa polifonia para: (fugir da responsabilidade/enriquecer e fundamentar o argumento/decorar o texto/substituir a tese)"
        correctAnswer: enriquecer e fundamentar o argumento
        difficulty: 4
        rationale: A polifonia agrega autoridade e diversidade de perspectivas ao discurso argumentativo.
        objectives: [EF89LP05]
  - pageNumber: 5
    title: Discurso Direto e Indireto
    description: Formas de introduzir a fala do outro no texto.
    exercises:
      - type: paragraph
        question: "'O ministro afirmou que os índices melhoraram' é discurso: (direto livre/indireto/direto/indireto livre)"
        correctAnswer: indireto
        difficulty: 3
        rationale: Há verbo dicendi + oração completiva — forma canônica do discurso indireto.
        objectives: [EF89LP27]
      - type: paragraph
        question: "'A ministra declarou: \"vamos revisar a proposta\".' O trecho citado entre aspas é: (discurso indireto/discurso direto/discurso indireto livre/resumo argumentativo)"
        correctAnswer: discurso direto
        difficulty: 3
        rationale: As aspas preservam literalmente a fala da fonte — marca típica de discurso direto.
        objectives: [EF89LP27]
  - pageNumber: 6
    title: Discurso Indireto Livre
    description: Fusão entre voz do narrador e voz da personagem, sem marcação clara.
    exercises:
      - type: paragraph
        question: "'Ela olhou para a fila. Que suplício, mais um dia perdido.' O segundo período é: (discurso direto/narração pura/discurso indireto livre/discurso indireto)"
        correctAnswer: discurso indireto livre
        difficulty: 4
        rationale: Não há verbo dicendi nem travessão — a voz da personagem se funde à narração.
        objectives: [EF89LP27]
      - type: paragraph
        question: "Em 'O aluno pensou que precisava estudar mais', a fala interna aparece como: (discurso direto/discurso indireto/discurso direto livre/citação literal)"
        correctAnswer: discurso indireto
        difficulty: 4
        rationale: O pensamento é introduzido por verbo dicendi e oração subordinada, sem reprodução literal.
        objectives: [EF89LP27]
  - pageNumber: 7
    title: Ironia
    description: Dizer o contrário do que se pensa para produzir efeito crítico.
    exercises:
      - type: paragraph
        question: "'Que governo eficiente — só três anos para consertar um semáforo.' O recurso é: (hipérbole/gradação/ironia/metonímia)"
        correctAnswer: ironia
        difficulty: 4
        rationale: Elogiar o oposto do que se crê é ironia — o contexto desfaz o sentido literal.
        objectives: [EF89LP04]
  - pageNumber: 8
    title: Nominalização
    description: Substantivos derivados de verbos condensam processos e ocultam agentes.
    exercises:
      - type: paragraph
        question: "Em 'A demissão de trabalhadores foi anunciada', a nominalização 'demissão' oculta: (o objeto direto/o agente que demitiu/o tempo verbal/o complemento nominal)"
        correctAnswer: o agente que demitiu
        difficulty: 4
        rationale: Nominalizar apaga o sujeito agente — estratégia de atenuação de responsabilidade.
        objectives: [EF89LP05]
  - pageNumber: 9
    title: Intertextualidade Implícita
    description: Referência a outro texto sem citar explicitamente.
    exercises:
      - type: paragraph
        question: "Um anúncio que usa 'Ser ou não ser consumidor consciente' evoca: (Camões/Drummond/Shakespeare/Guimarães Rosa)"
        correctAnswer: Shakespeare
        difficulty: 4
        rationale: Paráfrase de Hamlet — 'Ser ou não ser' é intertextualidade implícita com Shakespeare.
        objectives: [EF89LP05]
  - pageNumber: 10
    title: Análise Integrada
    description: Relacionar escolhas linguísticas ao projeto discursivo do texto.
    exercises:
      - type: paragraph
        question: "Quando um editorial usa verbos no imperativo, modalizadores de obrigação e léxico valorativo negativo, o efeito discursivo pretendido é: (narrar eventos/descrever personagens/persuadir o leitor a uma posição/explicar terminologia técnica)"
        correctAnswer: persuadir o leitor a uma posição
        difficulty: 5
        rationale: Imperativo + obrigação + léxico valorativo configuram estratégia de persuasão discursiva.
        objectives: [EF89LP04]
target: 12