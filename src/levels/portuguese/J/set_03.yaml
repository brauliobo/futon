title: 📝 Carta e Correspondências
level: J
subject: portuguese
difficulty: 3
objectives: [EF89LP05]
authorNotes: Carta pessoal, carta aberta, carta do leitor, e-mail formal. Estrutura — local/data, vocativo, corpo, despedida, assinatura.
example: "Caro leitor, / Escrevo para comentar... Ex.: Em carta, o vocativo é → saudação dirigida ao destinatário."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Estrutura Básica
    description: Local, data, vocativo, corpo, despedida, assinatura.
    exercises:
      - type: paragraph
        question: "Em carta, o vocativo é: (assinatura ao final do texto/saudação dirigida ao destinatário/fórmula de despedida final/data de envio da carta)"
        correctAnswer: saudação dirigida ao destinatário
        difficulty: 2
        rationale: Vocativo chama o destinatário.
        objectives: [EF89LP05]
  - pageNumber: 2
    title: Carta Pessoal
    description: Tom íntimo, linguagem mais livre.
    exercises:
      - type: paragraph
        question: "Linguagem em carta pessoal é: (publicitária/mais informal/estritamente formal/protocolar)"
        correctAnswer: mais informal
        difficulty: 2
        rationale: Tom próximo e familiar.
        objectives: [EF89LP05]
  - pageNumber: 3
    title: Carta Aberta
    description: Publicada em meio jornalístico, dirige-se a figura pública.
    exercises:
      - type: paragraph
        question: "Carta aberta é publicada para: (registrar memórias em um diário pessoal/comunicar colegas do mesmo trabalho/pressionar autoridade ou gerar debate/mandar uma mensagem ao amigo próximo)"
        correctAnswer: pressionar autoridade ou gerar debate
        difficulty: 3
        rationale: Cartas abertas têm circulação pública.
        objectives: [EF89LP05]
  - pageNumber: 4
    title: Carta do Leitor
    description: Enviada à revista/jornal comentando publicações.
    exercises:
      - type: paragraph
        question: "Carta do leitor geralmente: (substitui o editorial do jornal/oferece serviço ao assinante/vende um produto anunciado/comenta uma matéria publicada)"
        correctAnswer: comenta uma matéria publicada
        difficulty: 3
        rationale: Reage a conteúdo jornalístico.
        objectives: [EF89LP05]
  - pageNumber: 5
    title: E-mail Formal
    description: Estrutura adaptada ao meio eletrônico.
    exercises:
      - type: paragraph
        question: "E-mail profissional dispensa: (assinatura ao final da mensagem/saudação inicial ao destinatário/linha de assunto clara/timbre físico em papel)"
        correctAnswer: timbre físico em papel
        difficulty: 3
        rationale: E-mail digital substitui timbre por assinatura automática.
        objectives: [EF89LP05]
  - pageNumber: 6
    title: Despedida
    description: Saudação de encerramento.
    exercises:
      - type: paragraph
        question: "Despedida formal comum: (Beijos/Abraço apertado/Tchau/Atenciosamente)"
        correctAnswer: Atenciosamente
        difficulty: 2
        rationale: "'Atenciosamente' é padrão formal."
        objectives: [EF89LP05]
  - pageNumber: 7
    title: Adequação ao Interlocutor
    description: Pronome de tratamento define o registro.
    exercises:
      - type: paragraph
        question: "Ao escrever a juiz, use: (Tu/Meu caro/Você/Vossa Excelência)"
        correctAnswer: Vossa Excelência
        difficulty: 3
        rationale: "'Vossa Excelência' é tratamento protocolar para autoridades judiciais."
        objectives: [EF89LP05]
  - pageNumber: 8
    title: Carta Argumentativa
    description: Pode ser aberta ou do leitor com tese e argumentos.
    exercises:
      - type: paragraph
        question: "Carta argumentativa combina: (apenas opinião sem fundamentação/tese + argumentos + vocativo/uma sequência só de perguntas/apenas narrativa de eventos)"
        correctAnswer: tese + argumentos + vocativo
        difficulty: 4
        rationale: Soma estrutura de carta com argumentação.
        objectives: [EF89LP05]
  - pageNumber: 9
    title: Registros na Carta
    description: Formal x informal depende do contexto.
    exercises:
      - type: paragraph
        question: "Carta para empresa usa: (emojis e figurinhas coloridas/registro formal e impessoal/gírias regionais do autor/abreviações de rede social)"
        correctAnswer: registro formal e impessoal
        difficulty: 2
        rationale: Contextos profissionais pedem formalidade.
        objectives: [EF89LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o tipo de carta.
    exercises:
      - type: paragraph
        question: "Carta dirigida a governo e publicada em jornal é: (carta aberta/pessoal/comercial/do leitor)"
        correctAnswer: carta aberta
        difficulty: 3
        rationale: Carta aberta busca esfera pública.
        objectives: [EF89LP05]
target: 10
