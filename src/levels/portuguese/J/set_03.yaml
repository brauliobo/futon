title: Carta e Correspondências
level: J
subject: portuguese
difficulty: 3
objectives: [EF89LP05]
authorNotes: Carta pessoal, carta aberta, carta do leitor, e-mail formal. Estrutura — local/data, vocativo, corpo, despedida, assinatura.
example: "Caro leitor, / Escrevo para comentar... Ex.: Em carta, o vocativo é: → saudação dirigida ao destin…."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Estrutura Básica
    description: Local, data, vocativo, corpo, despedida, assinatura.
    exercises:
      - type: paragraph
        question: "Em carta, o vocativo é: (data/despedida/saudação dirigida ao destinatário/assinatura)"
        correctAnswer: saudação dirigida ao destinatário
        difficulty: 2
        rationale: Vocativo chama o destinatário.
        objectives: [EF89LP05]
  - pageNumber: 2
    title: Carta Pessoal
    description: Tom íntimo, linguagem mais livre.
    exercises:
      - type: paragraph
        question: "Linguagem em carta pessoal é: (estritamente formal/protocolar/publicitária/mais informal)"
        correctAnswer: mais informal
        difficulty: 2
        rationale: Tom próximo e familiar.
        objectives: [EF89LP05]
  - pageNumber: 3
    title: Carta Aberta
    description: Publicada em meio jornalístico, dirige-se a figura pública.
    exercises:
      - type: paragraph
        question: "Carta aberta é publicada para: (registrar memórias/comunicar colegas de trabalho/pressionar autoridade ou gerar debate/mandar ao amigo)"
        correctAnswer: pressionar autoridade ou gerar debate
        difficulty: 3
        rationale: Cartas abertas têm circulação pública.
        objectives: [EF89LP05]
  - pageNumber: 4
    title: Carta do Leitor
    description: Enviada à revista/jornal comentando publicações.
    exercises:
      - type: paragraph
        question: "Carta do leitor geralmente: (substitui editorial/oferece serviço/vende produto/comenta matéria publicada)"
        correctAnswer: comenta matéria publicada
        difficulty: 3
        rationale: Reage a conteúdo jornalístico.
        objectives: [EF89LP05]
  - pageNumber: 5
    title: E-mail Formal
    description: Estrutura adaptada ao meio eletrônico.
    exercises:
      - type: paragraph
        question: "E-mail profissional dispensa: (assinatura/saudação/assunto/timbre físico)"
        correctAnswer: timbre físico
        difficulty: 3
        rationale: E-mail digital substitui timbre por assinatura automática.
        objectives: [EF89LP05]
  - pageNumber: 6
    title: Despedida
    description: Saudação de encerramento.
    exercises:
      - type: paragraph
        question: "Despedida formal comum: (Beijos/Abraço apertado/Tchau/Atenciosamente)"
        correctAnswer: Atenciosamente
        difficulty: 2
        rationale: "'Atenciosamente' é padrão formal."
        objectives: [EF89LP05]
  - pageNumber: 7
    title: Adequação ao Interlocutor
    description: Pronome de tratamento define o registro.
    exercises:
      - type: paragraph
        question: "Ao escrever a juiz, use: (Tu/Meu caro/Você/Vossa Excelência)"
        correctAnswer: Vossa Excelência
        difficulty: 3
        rationale: "'Vossa Excelência' é tratamento protocolar para autoridades judiciais."
        objectives: [EF89LP05]
  - pageNumber: 8
    title: Carta Argumentativa
    description: Pode ser aberta ou do leitor com tese e argumentos.
    exercises:
      - type: paragraph
        question: "Carta argumentativa combina: (tese + argumentos + vocativo/apenas narrativa/só perguntas/apenas opinião)"
        correctAnswer: tese + argumentos + vocativo
        difficulty: 4
        rationale: Soma estrutura de carta com argumentação.
        objectives: [EF89LP05]
  - pageNumber: 9
    title: Registros na Carta
    description: Formal x informal depende do contexto.
    exercises:
      - type: paragraph
        question: "Carta para empresa usa: (emojis/registro formal/gíria/abreviações)"
        correctAnswer: registro formal
        difficulty: 2
        rationale: Contextos profissionais pedem formalidade.
        objectives: [EF89LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o tipo de carta.
    exercises:
      - type: paragraph
        question: "Carta dirigida a governo e publicada em jornal é: (pessoal/do leitor/comercial/carta aberta)"
        correctAnswer: carta aberta
        difficulty: 3
        rationale: Carta aberta busca esfera pública.
        objectives: [EF89LP05]
target: 10
