title: ✍️ Pontuação Avançada no Texto
level: J
subject: portuguese
difficulty: 5
objectives: [EF89LP04, EF89LP05, EF89LP28]
authorNotes: Pontuação organiza o ritmo, delimita unidades sintáticas e carrega efeitos de sentido específicos.
example: "A vírgula pode mudar o sentido. Ex.: 'Vamos comer, crianças.' vs. 'Vamos comer crianças.' → vírgula de vocativo é essencial."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Vírgula no Vocativo
    description: Vocativo é sempre delimitado por vírgulas.
    exercises:
      - type: paragraph
        question: "A frase 'Venha aqui meu filho' deve ser pontuada como: (Venha aqui, meu filho./Venha, aqui meu filho./Venha aqui meu, filho./Venha aqui meu filho!)"
        correctAnswer: Venha aqui, meu filho.
        difficulty: 2
        rationale: O vocativo 'meu filho', no final, é separado por vírgula antes do ponto.
        objectives: [EF89LP28]
  - pageNumber: 2
    title: Vírgula e Adjunto Adverbial
    description: Adjunto adverbial deslocado exige vírgula.
    exercises:
      - type: paragraph
        question: "'No ano passado, a empresa cresceu 20%.' A vírgula se justifica porque: (há uma conjunção adversativa/o adjunto adverbial está anteposto e deslocado/há aposto explicativo/o sujeito é composto)"
        correctAnswer: o adjunto adverbial está anteposto e deslocado
        difficulty: 3
        rationale: Adjunto adverbial deslocado para antes do sujeito exige vírgula de demarcação.
        objectives: [EF89LP28]
  - pageNumber: 3
    title: Vírgula Proibida — Sujeito e Predicado
    description: Nunca se separa sujeito de predicado por vírgula.
    exercises:
      - type: paragraph
        question: "Qual frase está CORRETAMENTE pontuada? (Os alunos, foram aprovados./Os alunos foram, aprovados./Os alunos foram aprovados./Os alunos, foram, aprovados.)"
        correctAnswer: Os alunos foram aprovados.
        difficulty: 3
        rationale: Vírgula entre sujeito e predicado é erro — não deve separar 'os alunos' de 'foram aprovados'.
        objectives: [EF89LP28]
  - pageNumber: 4
    title: Ponto e Vírgula
    description: Separa orações coordenadas longas ou itens de enumeração complexa.
    exercises:
      - type: paragraph
        question: "O ponto e vírgula é adequado para: (separar sujeito do predicado/marcar pausa menor que a vírgula/separar orações longas e coordenadas de sentido contrastante/substituir o ponto final em qualquer contexto)"
        correctAnswer: separar orações longas e coordenadas de sentido contrastante
        difficulty: 3
        rationale: Ponto e vírgula marca pausa mais longa que a vírgula, usada em coordenação complexa.
        objectives: [EF89LP28]
  - pageNumber: 5
    title: Dois-Pontos — Funções
    description: Anunciam explicação, enumeração ou discurso direto.
    exercises:
      - type: paragraph
        question: "Em 'Ele disse: — Não vou.' os dois-pontos introduzem: (explicação/enumeração/discurso direto/aposto)"
        correctAnswer: discurso direto
        difficulty: 3
        rationale: Dois-pontos antes de travessão anunciam a fala da personagem — discurso direto.
        objectives: [EF89LP28]
  - pageNumber: 6
    title: Travessão vs. Parênteses vs. Vírgula
    description: Três formas de inserir aposto — cada uma com efeito de ênfase diferente.
    exercises:
      - type: paragraph
        question: "O recurso que confere MAIOR destaque ao aposto é: (vírgulas/parênteses/travessões/dois-pontos)"
        correctAnswer: travessões
        difficulty: 4
        rationale: Travessões isolam e enfatizam a informação intercalada mais do que vírgulas ou parênteses.
        objectives: [EF89LP04]
  - pageNumber: 7
    title: Reticências
    description: Indicam suspensão, hesitação ou subtendido.
    exercises:
      - type: paragraph
        question: "'Não sei se devo falar, mas…' — as reticências indicam: (fim de enumeração/hesitação ou informação subentendida/ironia do autor/pausa para respiração apenas)"
        correctAnswer: hesitação ou informação subentendida
        difficulty: 3
        rationale: Reticências suspensivas sugerem omissão intencional ou dúvida do enunciador.
        objectives: [EF89LP04]
  - pageNumber: 8
    title: Aspas — Usos
    description: Aspas marcam citação, ironia, neologismo ou estrangeirismo.
    exercises:
      - type: paragraph
        question: "'O governador fez um trabalho \"extraordinário\"' — as aspas em 'extraordinário' indicam: (citação direta/neologismo técnico/ironia ou sarcasmo/palavra estrangeira)"
        correctAnswer: ironia ou sarcasmo
        difficulty: 4
        rationale: Aspas em adjetivo positivo dentro de contexto crítico marcam ironia distanciadora.
        objectives: [EF89LP04]
  - pageNumber: 9
    title: Pontuação e Ambiguidade
    description: Pontuação incorreta pode gerar duplo sentido.
    exercises:
      - type: paragraph
        question: "'A professora disse o aluno mentiu' — para indicar que foi o aluno que mentiu, o correto é: (A professora disse, o aluno mentiu./A professora disse: o aluno mentiu./A professora, disse o aluno, mentiu./A professora disse — o aluno mentiu.)"
        correctAnswer: "A professora disse: o aluno mentiu."
        difficulty: 4
        rationale: Dois-pontos marcam que o conteúdo após é a informação dita — atribui mentira ao aluno.
        objectives: [EF89LP04]
  - pageNumber: 10
    title: Efeitos Expressivos da Pontuação
    description: Pontuação como recurso estilístico em literatura e publicidade.
    exercises:
      - type: paragraph
        question: "Em textos publicitários, o uso de reticências e pontos de exclamação tem função predominantemente: (sintática e normativa/estilística e persuasiva/descritiva e informativa/corretiva e didática)"
        correctAnswer: estilística e persuasiva
        difficulty: 5
        rationale: Na publicidade, pontuação expressiva manipula emoções e cria ritmo persuasivo intencional.
        objectives: [EF89LP05]
target: 10
