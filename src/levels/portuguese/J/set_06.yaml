title: Gêneros Digitais
level: J
subject: portuguese
difficulty: 3
objectives: [EF89LP09]
authorNotes: Post, comentário, meme, podcast, e-mail, blog. Convergência midiática.
example: "Post de rede social prioriza concisão e engajamento. Ex.: Característica típica de post: → concisão."
pages:
  - pageNumber: 1
    title: Post em Rede Social
    description: Texto curto com apelo visual e imediato.
    exercises:
      - type: paragraph
        question: "Característica típica de post: (concisão/longa extensão/estrutura acadêmica/sem imagens)"
        correctAnswer: concisão
        difficulty: 2
        rationale: Plataformas incentivam textos curtos.
        objectives: [EF89LP09]
  - pageNumber: 2
    title: Hashtag
    description: Marcador para agrupar conteúdos.
    exercises:
      - type: paragraph
        question: "Hashtag serve para: (agrupar conteúdo por tema/iniciar frase/substituir pontuação/finalizar texto)"
        correctAnswer: agrupar conteúdo por tema
        difficulty: 2
        rationale: Hashtags organizam por tópico.
        objectives: [EF89LP09]
  - pageNumber: 3
    title: Meme
    description: Humor imagético com referência cultural.
    exercises:
      - type: paragraph
        question: "Meme caracteriza-se por: (humor e referência cultural/dados estatísticos/texto longo/linguagem técnica)"
        correctAnswer: humor e referência cultural
        difficulty: 3
        rationale: Memes dependem de contexto compartilhado.
        objectives: [EF89LP09]
  - pageNumber: 4
    title: E-mail
    description: Texto digital com estrutura de carta adaptada.
    exercises:
      - type: paragraph
        question: "E-mail difere da carta por: (incluir campo 'assunto'/dispensar vocativo/eliminar despedida/ignorar destinatário)"
        correctAnswer: incluir campo 'assunto'
        difficulty: 2
        rationale: "'Assunto' é campo próprio do e-mail."
        objectives: [EF89LP09]
  - pageNumber: 5
    title: Blog
    description: Publicação periódica com comentários de leitores.
    exercises:
      - type: paragraph
        question: "Blog permite: (comentários e interação/texto estático/publicação em papel/apenas vídeo)"
        correctAnswer: comentários e interação
        difficulty: 2
        rationale: Interação é característica dos blogs.
        objectives: [EF89LP09]
  - pageNumber: 6
    title: Podcast
    description: Áudio com roteiro, distribuído em episódios.
    exercises:
      - type: paragraph
        question: "Podcast tem: (roteiro em áudio/apenas texto/apenas imagem/estrutura de romance)"
        correctAnswer: roteiro em áudio
        difficulty: 2
        rationale: Podcast é formato de áudio roteirizado.
        objectives: [EF89LP09]
  - pageNumber: 7
    title: Linguagem em Chat
    description: Abreviações, emojis, tom informal.
    exercises:
      - type: paragraph
        question: "Linguagem de chat é: (majoritariamente informal/formal protocolar/poética/acadêmica)"
        correctAnswer: majoritariamente informal
        difficulty: 2
        rationale: Chat privilegia fluidez e rapidez.
        objectives: [EF89LP09]
  - pageNumber: 8
    title: Fake News
    description: Informação falsa disfarçada de notícia.
    exercises:
      - type: paragraph
        question: "Fake news deve ser: (identificada e combatida/compartilhada sem checar/ignorada completamente/promovida)"
        correctAnswer: identificada e combatida
        difficulty: 3
        rationale: Leitura crítica é fundamental.
        objectives: [EF89LP09]
  - pageNumber: 9
    title: Intertextualidade Digital
    description: Memes, gifs, citações criam diálogos entre textos.
    exercises:
      - type: paragraph
        question: "Meme que referencia outro meme é exemplo de: (intertextualidade/redundância/plágio/incoerência)"
        correctAnswer: intertextualidade
        difficulty: 3
        rationale: Diálogo entre textos/imagens.
        objectives: [EF89LP09]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o gênero digital.
    exercises:
      - type: paragraph
        question: "Episódio em áudio com convidado e roteiro é: (podcast/post/meme/blog)"
        correctAnswer: podcast
        difficulty: 2
        rationale: Áudio roteirizado é podcast.
        objectives: [EF89LP09]
target: 10
