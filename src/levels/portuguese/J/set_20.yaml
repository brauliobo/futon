title: 🏆 Revisão Geral Nível J
level: J
subject: portuguese
difficulty: 5
objectives: [EF89LP04, EF89LP05, EF89LP06, EF89LP07]
authorNotes: Revisão integrada cobrindo todos os eixos do Nível J — gêneros, análise linguística, argumentação, literatura e produção.
example: "Vestibular exige integração de saberes. Ex.: texto publicitário + intertextualidade + argumentação → leitura multidimensional."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Gêneros Textuais — Identificação
    description: Integrar conhecimentos sobre gêneros do nível J.
    exercises:
      - type: paragraph
        question: "Texto com tese, argumentos, refutação e proposta de intervenção é: (reportagem investigativa/conto realista/redação dissertativo-argumentativa/carta de reclamação)"
        correctAnswer: redação dissertativo-argumentativa
        difficulty: 3
        rationale: A estrutura tese-argumento-refutação-proposta é característica da redação argumentativa do ENEM.
        objectives: [EF89LP04]
  - pageNumber: 2
    title: Coesão e Coerência
    description: Revisar os conceitos centrais de coesão referencial e sequencial.
    exercises:
      - type: paragraph
        question: "'Embora o problema seja grave, soluções existem.' O conector 'embora' estabelece relação de: (conclusão/adição/concessão/causa)"
        correctAnswer: concessão
        difficulty: 3
        rationale: "'Embora' é conjunção concessiva — admite um fato adverso antes de superá-lo."
        objectives: [EF89LP04]
  - pageNumber: 3
    title: Análise Linguística
    description: Identificar recursos discursivos em fragmentos textuais.
    exercises:
      - type: paragraph
        question: "'O candidato prometeu mundos e fundos' usa: (discurso indireto livre/ironia/hipérbole/eufemismo)"
        correctAnswer: hipérbole
        difficulty: 3
        rationale: "'Prometeu mundos e fundos' é expressão hiperbólica — exagera a dimensão das promessas."
        objectives: [EF89LP05]
  - pageNumber: 4
    title: Intertextualidade
    description: Reconhecer relações entre textos.
    exercises:
      - type: paragraph
        question: "Uma campanha de conscientização ambiental que usa o verso 'Eu vi os olhos verdes do sertão' parodiando a poesia romântica usa: (citação acadêmica/intertextualidade com fins críticos/pastiche reverencial/epígrafe declarada)"
        correctAnswer: intertextualidade com fins críticos
        difficulty: 4
        rationale: Retomar e transformar verso poético com intenção crítica é intertextualidade funcional.
        objectives: [EF89LP05]
  - pageNumber: 5
    title: Ideologia e Discurso
    description: Aplicar leitura crítica a fragmento.
    exercises:
      - type: paragraph
        question: "Manchete 'Invasão de terras causa prejuízo ao agronegócio' apresenta viés ideológico porque: (usa linguagem técnica/tem título muito longo/nomeia como 'invasão' o que povos tradicionais chamam de retomada, legitimando apenas uma perspectiva/é publicada em jornal digital)"
        correctAnswer: nomeia como 'invasão' o que povos tradicionais chamam de retomada, legitimando apenas uma perspectiva
        difficulty: 4
        rationale: A escolha lexical ('invasão' vs. 'retomada') revela posicionamento ideológico favorável ao agronegócio.
        objectives: [EF89LP06]
  - pageNumber: 6
    title: Publicidade e Argumentação
    description: Identificar estratégias retóricas em texto publicitário.
    exercises:
      - type: paragraph
        question: "Anúncio com dados de pesquisa ('9 em cada 10 dentistas recomendam') usa principalmente: (apelo emocional/argumento de autoridade e logos/hipérbole estilística/concessão argumentativa)"
        correctAnswer: argumento de autoridade e logos
        difficulty: 3
        rationale: Dado quantitativo de especialistas constrói ethos e logos — estratégia de persuasão racional.
        objectives: [EF89LP05]
  - pageNumber: 7
    title: Literatura Brasileira
    description: Integrar contexto histórico e análise de obra.
    exercises:
      - type: paragraph
        question: "O romance 'Quarto de Despejo' de Carolina de Jesus é importante porque: (segue o cânone literário europeu/foi publicado por grande editora sem intervenção/rompe o silêncio sobre a favela ao dar voz à experiência de mulher negra e pobre/usa linguagem erudita e formal)"
        correctAnswer: rompe o silêncio sobre a favela ao dar voz à experiência de mulher negra e pobre
        difficulty: 4
        rationale: Carolina de Jesus é contra-cânone — testemunha e denuncia a marginalização a partir de dentro.
        objectives: [EF89LP07]
  - pageNumber: 8
    title: Pontuação e Sentido
    description: Avaliar efeito de sentido produzido pela pontuação.
    exercises:
      - type: paragraph
        question: "'Perdeu tudo: a casa, o emprego, a família.' Os dois-pontos introduzem: (discurso direto/explicação ou enumeração/oração adversativa/aposto adjetivo)"
        correctAnswer: explicação ou enumeração
        difficulty: 3
        rationale: Dois-pontos anunciam a enumeração que detalha 'tudo' — função explicativa.
        objectives: [EF89LP04]
  - pageNumber: 9
    title: Redação — Competência V
    description: Avaliar qualidade de proposta de intervenção.
    exercises:
      - type: paragraph
        question: "'O governo deve fazer alguma coisa para melhorar a educação.' Essa proposta recebe nota baixa porque: (usa linguagem informal/menciona o governo/é vaga e não especifica agente, ação, modo, finalidade nem efeito/é contrária aos direitos humanos)"
        correctAnswer: é vaga e não especifica agente, ação, modo, finalidade nem efeito
        difficulty: 4
        rationale: Proposta genérica sem os cinco elementos recebe nota mínima na Comp. V do ENEM.
        objectives: [EF89LP05]
  - pageNumber: 10
    title: Integração Final — Vestibular
    description: Questão de integração múltipla no nível de vestibular/ENEM.
    exercises:
      - type: paragraph
        question: "Um texto publicitário que cita dados científicos, usa metáforas visuais, apela à emoção e referencia uma obra clássica mobiliza simultaneamente: (apenas função referencial/apenas recursos poéticos/logos, pathos, ethos e intertextualidade/apenas argumentação científica)"
        correctAnswer: logos, pathos, ethos e intertextualidade
        difficulty: 5
        rationale: Dados = logos; emoção = pathos; autoridade científica = ethos; referência clássica = intertextualidade.
        objectives: [EF89LP06]
target: 10
