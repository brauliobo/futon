title: 🗣️ Argumentação — Estratégias Discursivas
level: J
subject: portuguese
difficulty: 5
objectives: [EF89LP04, EF89LP05, EF89LP06]
authorNotes: Argumentação eficaz combina tese, dados, raciocínio e refutação. Estratégias incluem autoridade, exemplificação e concessão.
example: "Argumento de autoridade usa especialistas. Ex.: 'Segundo a OMS, o tabagismo mata 8 milhões por ano.' → dado de autoridade para sustentar tese."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Tese e Argumento
    description: Tese é a posição defendida; argumento é a razão que a sustenta.
    exercises:
      - type: paragraph
        question: "Em 'O Brasil deve investir em energia solar, pois reduz custos e é renovável', a tese é: (reduz custos e é renovável/o Brasil deve investir em energia solar/energia solar é limpa/pois reduz custos)"
        correctAnswer: o Brasil deve investir em energia solar
        difficulty: 2
        rationale: A tese é a posição defendida; o 'pois' introduz os argumentos que a fundamentam.
        objectives: [EF89LP04]
  - pageNumber: 2
    title: Argumento por Exemplificação
    description: Exemplos concretos tornam o argumento mais persuasivo.
    exercises:
      - type: paragraph
        question: "'Países como Alemanha e Dinamarca já abriram mão do carvão.' Essa estratégia argumentativa é: (apelo emocional/argumento por analogia/argumento por exemplificação/argumento de autoridade)"
        correctAnswer: argumento por exemplificação
        difficulty: 3
        rationale: Citar casos concretos (países reais) exemplifica e fundamenta a tese.
        objectives: [EF89LP04]
  - pageNumber: 3
    title: Argumento de Autoridade
    description: Citar especialistas ou instituições confiáveis fortalece o argumento.
    exercises:
      - type: paragraph
        question: "Argumento de autoridade perde credibilidade quando: (cita órgão internacional reconhecido/usa dados atualizados/cita especialista fora de sua área de especialidade/apresenta pesquisa peer-reviewed)"
        correctAnswer: cita especialista fora de sua área de especialidade
        difficulty: 3
        rationale: Autoridade fora da área de competência não é referência válida — gera falácia.
        objectives: [EF89LP04]
  - pageNumber: 4
    title: Concessão Argumentativa
    description: Admitir o ponto do adversário antes de superá-lo fortalece a argumentação.
    exercises:
      - type: paragraph
        question: "'Embora o desemprego seja um risco, a automação é inevitável e pode gerar novos postos.' A estratégia usada é: (refutação direta/negação total do contra-argumento/concessão seguida de superação/argumentação circular)"
        correctAnswer: concessão seguida de superação
        difficulty: 4
        rationale: 'Embora' admite o problema (concessão) mas o texto o supera com argumento mais forte.
        objectives: [EF89LP05]
  - pageNumber: 5
    title: Refutação
    description: Contestar diretamente o argumento do oponente.
    exercises:
      - type: paragraph
        question: "Para refutar 'cotas rebaixam o nível das universidades', a estratégia mais eficaz é: (ignorar o argumento/repetir a tese/apresentar dados que mostram desempenho igual ou superior de cotistas/apelar para emoções apenas)"
        correctAnswer: apresentar dados que mostram desempenho igual ou superior de cotistas
        difficulty: 4
        rationale: Refutação com dados empíricos contradiz diretamente a premissa do argumento oposto.
        objectives: [EF89LP05]
  - pageNumber: 6
    title: Falácia do Apelo à Emoção
    description: Substituir raciocínio por apelo sentimental é argumento falacioso.
    exercises:
      - type: paragraph
        question: "'Pense nas crianças que morrem de fome — vote no meu projeto.' O problema argumentativo é: (uso de dados/apelo emocional no lugar de raciocínio lógico/concessão excessiva/excesso de autoridade)"
        correctAnswer: apelo emocional no lugar de raciocínio lógico
        difficulty: 4
        rationale: Manipular emoções sem apresentar provas lógicas é falácia do apelo emocional.
        objectives: [EF89LP06]
  - pageNumber: 7
    title: Generalização Indevida
    description: Concluir universalmente a partir de casos isolados é falácia.
    exercises:
      - type: paragraph
        question: "'Conheci dois médicos corruptos, logo todos os médicos são corruptos.' Essa falácia é: (ad hominem/falso dilema/generalização apressada/apelo à autoridade)"
        correctAnswer: generalização apressada
        difficulty: 4
        rationale: Generalizar para todos a partir de poucos casos é falácia de generalização indevida.
        objectives: [EF89LP06]
  - pageNumber: 8
    title: Argumento por Analogia
    description: Comparar situações semelhantes para fundamentar a tese.
    exercises:
      - type: paragraph
        question: "'Assim como vacinamos crianças contra polio, devemos vacinar adultos contra gripe.' Isso é: (falácia ad hominem/argumento por analogia/argumento de autoridade/concessão)"
        correctAnswer: argumento por analogia
        difficulty: 3
        rationale: Compara duas situações similares para transferir a lógica aceita ao caso em debate.
        objectives: [EF89LP04]
  - pageNumber: 9
    title: Estrutura da Redação Argumentativa
    description: Introdução-desenvolvimento-conclusão com proposta de intervenção.
    exercises:
      - type: paragraph
        question: "Na redação ENEM, o parágrafo de conclusão deve obrigatoriamente incluir: (nova tese divergente/resumo dos argumentos e proposta de intervenção/citação de autoridade/descrição do problema)"
        correctAnswer: resumo dos argumentos e proposta de intervenção
        difficulty: 3
        rationale: A competência V do ENEM exige proposta de intervenção detalhada na conclusão.
        objectives: [EF89LP05]
  - pageNumber: 10
    title: Avaliação Global da Argumentação
    description: Identificar pontos fortes e fracos de uma cadeia argumentativa.
    exercises:
      - type: paragraph
        question: "Uma argumentação é considerada sólida quando: (usa linguagem emocional e repetição/tem tese clara, argumentos pertinentes, refutação e conclusão coerente/apenas cita muitos autores famosos/é longa e usa vocabulário sofisticado)"
        correctAnswer: tem tese clara, argumentos pertinentes, refutação e conclusão coerente
        difficulty: 5
        rationale: Solidez argumentativa depende de estrutura lógica, pertinência e coerência — não de extensão ou vocabulário.
        objectives: [EF89LP06]
target: 10
