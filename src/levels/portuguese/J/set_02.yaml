title: Artigo de Opinião
level: J
subject: portuguese
difficulty: 3
objectives: [EF89LP03, EF89LP04]
authorNotes: Gênero argumentativo — tese, argumentos, contra-argumentos, conclusão. Autor identificado.
example: "Artigo defende uma tese com argumentos fundamentados. Ex.: Título adequado a artigo: → sugere posição."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Estrutura do Artigo
    description: Tese, argumentação, conclusão.
    exercises:
      - type: paragraph
        question: "Elemento obrigatório do artigo de opinião: (enquete/fofoca/diálogo/tese)"
        correctAnswer: tese
        difficulty: 1
        rationale: O articulista defende uma posição central.
        objectives: [EF89LP03]
  - pageNumber: 2
    title: Tese
    description: Posição clara sobre o tema.
    exercises:
      - type: paragraph
        question: "Tese eficaz é: (neutra/extensa demais/descritiva/afirmativa e clara)"
        correctAnswer: afirmativa e clara
        difficulty: 1
        rationale: Tese apresenta posição de forma direta.
        objectives: [EF89LP03]
  - pageNumber: 3
    title: Argumentos
    description: Sustentam a tese com dados, exemplos, autoridades.
    exercises:
      - type: paragraph
        question: "Argumento de autoridade usa: (citação de especialista/opinião pessoal/ameaça/xingamento)"
        correctAnswer: citação de especialista
        difficulty: 2
        rationale: Autoridade reforça a credibilidade.
        objectives: [EF89LP03]
  - pageNumber: 4
    title: Contra-argumentação
    description: Reconhecer e refutar objeções fortalece o texto.
    exercises:
      - type: paragraph
        question: "Ignorar contra-argumentos: (não altera/é obrigatório/fortalece/enfraquece a argumentação)"
        correctAnswer: enfraquece a argumentação
        difficulty: 2
        rationale: Antecipar objeções demonstra solidez.
        objectives: [EF89LP04]
  - pageNumber: 5
    title: Linguagem
    description: Formal, mas com traços autorais.
    exercises:
      - type: paragraph
        question: "Linguagem adequada ao artigo: (jargão técnico só/poética/informal cotidiana/formal com marcas autorais)"
        correctAnswer: formal com marcas autorais
        difficulty: 2
        rationale: Combina seriedade e voz do autor.
        objectives: [EF89LP04]
  - pageNumber: 6
    title: Título Opinativo
    description: Deve sugerir a posição sem revelar tudo.
    exercises:
      - type: paragraph
        question: "Título adequado a artigo: (sugere posição/apenas descreve/pura propaganda/slogan solto)"
        correctAnswer: sugere posição
        difficulty: 2
        rationale: Título opinativo indica o viés sem revelar todos os argumentos.
        objectives: [EF89LP03]
  - pageNumber: 7
    title: Conclusão
    description: Retoma a tese reforçando-a com síntese.
    exercises:
      - type: paragraph
        question: "Boa conclusão deve: (apresentar argumento novo/sintetizar e reforçar a tese/sumir do tema/repetir argumentos)"
        correctAnswer: sintetizar e reforçar a tese
        difficulty: 2
        rationale: Conclusão fecha o texto sem abrir novos temas.
        objectives: [EF89LP04]
  - pageNumber: 8
    title: Público-alvo
    description: Argumentos e linguagem devem considerar o leitor.
    exercises:
      - type: paragraph
        question: "Para público especializado, argumentos: (simplificados/poéticos/técnicos e com dados/emocionais apenas)"
        correctAnswer: técnicos e com dados
        difficulty: 2
        rationale: Público afinado valoriza precisão e evidência.
        objectives: [EF89LP04]
  - pageNumber: 9
    title: Distinção Notícia x Opinião
    description: Notícia informa; opinião interpreta.
    exercises:
      - type: paragraph
        question: "Qual frase é opinativa? (A medida é essencial para o país/A sessão durou três horas/O relatório foi divulgado/A medida foi aprovada ontem)"
        correctAnswer: A medida é essencial para o país
        difficulty: 2
        rationale: "'Essencial' é juízo de valor."
        objectives: [EF89LP04]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique a função.
    exercises:
      - type: paragraph
        question: "Texto com tese, argumentos e refutação caracteriza: (biografia/artigo de opinião/notícia/crônica)"
        correctAnswer: artigo de opinião
        difficulty: 1
        rationale: Estrutura argumentativa típica.
        objectives: [EF89LP04]
target: 10
