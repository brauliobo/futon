title: 📝 Resumo e Resenha
level: J
subject: portuguese
difficulty: 3
objectives:
  - EF89LP06
authorNotes: Resumo sintetiza; resenha sintetiza e avalia. Devem manter fidelidade ao original.
example: "Resumo informa; resenha interpreta. Ex.: Resenha acadêmica costuma: → dialogar com outras obras."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Definição de Resumo – Página 1
    description: Síntese breve, sem opinião, fiel ao original.
    exercises:
      - type: paragraph
        question: "Resumo deve ser: (criativo sem compromisso/sintético e fiel/opinativo e longo/detalhado e comparativo)"
        correctAnswer: sintético e fiel
        difficulty: 2
        rationale: Resumo preserva conteúdo central sem interpretação.
        objectives:
          - EF89LP06
  - pageNumber: 2
    title: Passos para Resumir – Página 2
    description: Ler, grifar, esquematizar, redigir.
    exercises:
      - type: paragraph
        question: "Primeiro passo para resumir: (julgar o estilo/escrever a síntese/comparar com outro autor do mesmo gênero/ler o texto integralmente)"
        correctAnswer: ler o texto integralmente
        difficulty: 2
        rationale: Entender o todo precede sintetizar.
        objectives:
          - EF89LP06
  - pageNumber: 3
    title: Resumo Esquemático – Página 3
    description: Usa tópicos ou mapa mental.
    exercises:
      - type: paragraph
        question: "Resumo esquemático utiliza: (período longo cheio de orações subordinadas/tópicos e palavras-chave/descrição lírica/figuras de linguagem)"
        correctAnswer: tópicos e palavras-chave
        difficulty: 2
        rationale: Prioriza visualização rápida.
        objectives:
          - EF89LP06
  - pageNumber: 4
    title: Revisão Integrada – Página 4
    description: Resumo ou resenha?
    exercises:
      - type: paragraph
        question: "Texto que avalia um filme e recomenda é: (crônica pessoal/resumo objetivo/resenha crítica/biografia do diretor)"
        correctAnswer: resenha crítica
        difficulty: 2
        rationale: Avaliação + recomendação caracterizam resenha.
        objectives:
          - EF89LP06
  - pageNumber: 5
    title: Resumo Informativo – Página 5
    description: Apresenta as ideias-chave.
    exercises:
      - type: paragraph
        question: O que NÃO deve constar em resumo? (tese original do autor do texto/Opinião do resumidor/dados do autor/exemplo central)
        correctAnswer: Opinião do resumidor
        difficulty: 3
        rationale: Resumo é neutro.
        objectives:
          - EF89LP06
  - pageNumber: 6
    title: Definição de Resenha – Página 6
    description: Síntese + avaliação crítica.
    exercises:
      - type: paragraph
        question: "Resenha difere do resumo por: (ser maior sempre/ter mais personagens e diálogos descritos/conter avaliação crítica/ter mais datas)"
        correctAnswer: conter avaliação crítica
        difficulty: 3
        rationale: Resenha posiciona-se, enquanto resumo informa.
        objectives:
          - EF89LP06
  - pageNumber: 7
    title: Estrutura da Resenha – Página 7
    description: Apresentação, síntese, análise, avaliação, recomendação.
    exercises:
      - type: paragraph
        question: "Elemento típico de resenha: (ata formal de reunião/vocativo inicial da carta/cabeçalho protocolar do ofício/recomendação final ao leitor)"
        correctAnswer: recomendação final ao leitor
        difficulty: 3
        rationale: Resenha costuma encerrar com indicação.
        objectives:
          - EF89LP06
  - pageNumber: 8
    title: Plágio vs Resumo – Página 8
    description: Copiar trechos inteiros sem citar é plágio.
    exercises:
      - type: paragraph
        question: "Resumo ético: (usa suas palavras e cita fonte/copia trechos sem citar a fonte original/inventa conteúdo/usa gírias juvenis)"
        correctAnswer: usa suas palavras e cita fonte
        difficulty: 3
        rationale: Evita plágio e preserva crédito.
        objectives:
          - EF89LP06
  - pageNumber: 9
    title: Linguagem na Resenha – Página 9
    description: Combina objetividade e argumentação.
    exercises:
      - type: paragraph
        question: "Resenha usa linguagem: (poética e metafórica/formal com posicionamento crítico/exclusivamente técnica e impessoal/totalmente subjetiva e emotiva)"
        correctAnswer: formal com posicionamento crítico
        difficulty: 3
        rationale: Mantém tom formal com voz crítica.
        objectives:
          - EF89LP06
  - pageNumber: 10
    title: Resenha Acadêmica – Página 10
    description: Leitura crítica em contexto universitário.
    exercises:
      - type: paragraph
        question: "Resenha acadêmica costuma: (dialogar com outras obras da área/narrar ficção com personagens/usar gíria da faixa etária/fazer propaganda de produtos comerciais)"
        correctAnswer: dialogar com outras obras da área
        difficulty: 4
        rationale: Aproxima-se do debate intelectual.
        objectives:
          - EF89LP06
target: 10
