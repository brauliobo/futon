title: Resumo e Resenha
level: J
subject: portuguese
difficulty: 3
objectives: [EF89LP06]
authorNotes: Resumo sintetiza; resenha sintetiza e avalia. Devem manter fidelidade ao original.
example: "Resumo informa; resenha interpreta. Ex.: Resumo deve ser: → sintético e fiel."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Definição de Resumo
    description: Síntese breve, sem opinião, fiel ao original.
    exercises:
      - type: paragraph
        question: "Resumo deve ser: (sintético e fiel/opinativo e longo/detalhado e comparativo/criativo sem compromisso)"
        correctAnswer: sintético e fiel
        difficulty: 2
        rationale: Resumo preserva conteúdo central sem interpretação.
        objectives: [EF89LP06]
  - pageNumber: 2
    title: Resumo Informativo
    description: Apresenta as ideias-chave.
    exercises:
      - type: paragraph
        question: "O que NÃO deve constar em resumo? (Opinião do resumidor/tese original/exemplo central/dados do autor)"
        correctAnswer: Opinião do resumidor
        difficulty: 3
        rationale: Resumo é neutro.
        objectives: [EF89LP06]
  - pageNumber: 3
    title: Passos para Resumir
    description: Ler, grifar, esquematizar, redigir.
    exercises:
      - type: paragraph
        question: "Primeiro passo para resumir: (ler o texto integralmente/escrever a síntese/comparar com outro autor/julgar o estilo)"
        correctAnswer: ler o texto integralmente
        difficulty: 2
        rationale: Entender o todo precede sintetizar.
        objectives: [EF89LP06]
  - pageNumber: 4
    title: Definição de Resenha
    description: Síntese + avaliação crítica.
    exercises:
      - type: paragraph
        question: "Resenha difere do resumo por: (conter avaliação crítica/ser maior sempre/ter mais datas/ter mais personagens)"
        correctAnswer: conter avaliação crítica
        difficulty: 3
        rationale: Resenha posiciona-se, enquanto resumo informa.
        objectives: [EF89LP06]
  - pageNumber: 5
    title: Estrutura da Resenha
    description: Apresentação, síntese, análise, avaliação, recomendação.
    exercises:
      - type: paragraph
        question: "Elemento típico de resenha: (recomendação/vocativo/cabeçalho/ata)"
        correctAnswer: recomendação
        difficulty: 3
        rationale: Resenha costuma encerrar com indicação.
        objectives: [EF89LP06]
  - pageNumber: 6
    title: Resenha Acadêmica
    description: Leitura crítica em contexto universitário.
    exercises:
      - type: paragraph
        question: "Resenha acadêmica costuma: (dialogar com outras obras/usar gíria/narrar ficção/fazer propaganda)"
        correctAnswer: dialogar com outras obras
        difficulty: 4
        rationale: Aproxima-se do debate intelectual.
        objectives: [EF89LP06]
  - pageNumber: 7
    title: Resumo Esquemático
    description: Usa tópicos ou mapa mental.
    exercises:
      - type: paragraph
        question: "Resumo esquemático utiliza: (tópicos e palavras-chave/período longo/figuras de linguagem/descrição lírica)"
        correctAnswer: tópicos e palavras-chave
        difficulty: 2
        rationale: Prioriza visualização rápida.
        objectives: [EF89LP06]
  - pageNumber: 8
    title: Plágio vs Resumo
    description: Copiar trechos inteiros sem citar é plágio.
    exercises:
      - type: paragraph
        question: "Resumo ético: (usa suas palavras e cita fonte/copia trechos sem citar/inventa conteúdo/usa gírias juvenis)"
        correctAnswer: usa suas palavras e cita fonte
        difficulty: 3
        rationale: Evita plágio e preserva crédito.
        objectives: [EF89LP06]
  - pageNumber: 9
    title: Linguagem na Resenha
    description: Combina objetividade e argumentação.
    exercises:
      - type: paragraph
        question: "Resenha usa linguagem: (formal com posicionamento/totalmente subjetiva/exclusivamente técnica/poética)"
        correctAnswer: formal com posicionamento
        difficulty: 3
        rationale: Mantém tom formal com voz crítica.
        objectives: [EF89LP06]
  - pageNumber: 10
    title: Revisão Integrada
    description: Resumo ou resenha?
    exercises:
      - type: paragraph
        question: "Texto que avalia um filme e recomenda é: (resenha/resumo/crônica/biografia)"
        correctAnswer: resenha
        difficulty: 2
        rationale: Avaliação + recomendação caracterizam resenha.
        objectives: [EF89LP06]
target: 10
