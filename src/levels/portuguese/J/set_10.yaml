title: 🔗 Gramática no Texto — Coesão Referencial e Sequencial
level: J
subject: portuguese
difficulty: 5
objectives: [EF89LP04, EF89LP05, EF89LP28]
authorNotes: Coesão mantém o texto unido por retomadas (referencial) e conectores lógico-temporais (sequencial).
example: "Coesão referencial retoma elementos. Ex.: 'A pesquisadora publicou seu estudo. Ela recebeu prêmio.' → 'ela' retoma a pesquisadora."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Anáfora Pronominal
    description: Pronome retoma termo anterior no texto.
    exercises:
      - type: paragraph
        question: "Em 'O aluno estudou muito. Ele foi aprovado.', o pronome 'ele' exerce função de: (anáfora pronominal/catáfora nominal/elipse verbal/substituição lexical)"
        correctAnswer: anáfora pronominal
        difficulty: 2
        rationale: "'Ele' retoma 'o aluno' — pronome anafórico que remete a elemento já mencionado."
        objectives: [EF89LP28]
  - pageNumber: 2
    title: Catáfora
    description: Elemento linguístico antecipa o que virá no texto.
    exercises:
      - type: paragraph
        question: "'Só quero uma coisa: que você estude.' O pronome 'uma coisa' remete: (ao que veio antes/ao que vem depois/a um elemento externo/a nenhum referente)"
        correctAnswer: ao que vem depois
        difficulty: 3
        rationale: "'Uma coisa' é catáfora — o referente ('que você estude') aparece após."
        objectives: [EF89LP28]
  - pageNumber: 3
    title: Substituição Lexical
    description: Sinônimos ou hiperônimos evitam repetição e criam coesão.
    exercises:
      - type: paragraph
        question: "'A dengue avançou. A doença já afetou mil famílias.' O termo 'a doença' funciona como: (catáfora pronominal/substituição lexical anafórica/elipse de sujeito/adjunto adverbial)"
        correctAnswer: substituição lexical anafórica
        difficulty: 3
        rationale: "'A doença' substitui 'a dengue' por hiperônimo — recurso de coesão referencial."
        objectives: [EF89LP28]
  - pageNumber: 4
    title: Elipse
    description: Omissão de elemento recuperável pelo contexto.
    exercises:
      - type: paragraph
        question: "'Joana saiu cedo e chegou tarde.' O sujeito de 'chegou' está: (expresso e repetido/implícito por elipse/substituído por pronome/indefinido)"
        correctAnswer: implícito por elipse
        difficulty: 3
        rationale: O sujeito 'Joana' foi elidido na segunda oração — coesão por elipse.
        objectives: [EF89LP28]
  - pageNumber: 5
    title: Conectores de Adição
    description: Acrescentam ideias de mesma natureza.
    exercises:
      - type: paragraph
        question: "'Não só estudou, mas também trabalhou.' Os conectores indicam relação de: (adversidade/concessão/adição enfática/conclusão)"
        correctAnswer: adição enfática
        difficulty: 3
        rationale: "'Não só… mas também' é estrutura de adição com ênfase, intensificando o acúmulo."
        objectives: [EF89LP04]
  - pageNumber: 6
    title: Conectores de Oposição
    description: Contrapõem ideias no texto.
    exercises:
      - type: paragraph
        question: "O conector que introduz concessão (admite e supera) é: (portanto/contudo/embora/logo)"
        correctAnswer: embora
        difficulty: 3
        rationale: "'Embora' é conjunção concessiva — admite um fato e supera-o com outro."
        objectives: [EF89LP04]
  - pageNumber: 7
    title: Conectores de Causa e Consequência
    description: Articulam relações causais no texto.
    exercises:
      - type: paragraph
        question: "'O trânsito piorou; por isso, adotamos o metrô.' O conector 'por isso' indica: (concessão/adição/consequência/condição)"
        correctAnswer: consequência
        difficulty: 3
        rationale: "'Por isso' é conector conclusivo-consecutivo — introduz consequência da causa anterior."
        objectives: [EF89LP04]
  - pageNumber: 8
    title: Progressão Textual e Paragrafação
    description: Cada parágrafo desenvolve um aspecto do tema central.
    exercises:
      - type: paragraph
        question: "Para garantir coesão sequencial entre parágrafos, é recomendável: (repetir a mesma frase em cada parágrafo/usar conectores inter-paragrafais e retomar o tópico anterior/iniciar cada parágrafo com novo tema sem relação/numerar os parágrafos explicitamente)"
        correctAnswer: usar conectores inter-paragrafais e retomar o tópico anterior
        difficulty: 4
        rationale: Conectores e retomadas garantem progressão coerente entre os parágrafos.
        objectives: [EF89LP05]
  - pageNumber: 9
    title: Coesão e Ambiguidade
    description: Referência mal feita gera ambiguidade.
    exercises:
      - type: paragraph
        question: "'O diretor chamou o ator quando ele chegou.' A ambiguidade ocorre porque: (há dois verbos na frase/o pronome 'ele' pode retomar tanto o diretor quanto o ator/falta conjunção/há erro de concordância)"
        correctAnswer: o pronome 'ele' pode retomar tanto o diretor quanto o ator
        difficulty: 4
        rationale: Ambiguidade referencial — o pronome não tem antecedente claro.
        objectives: [EF89LP28]
  - pageNumber: 10
    title: Análise Integrada de Coesão
    description: Identificar todos os tipos de coesão em um parágrafo.
    exercises:
      - type: paragraph
        question: "Num parágrafo bem construído, a ausência de coesão referencial e sequencial produz: (maior clareza e objetividade/texto mais literário/ruptura na leitura e comprometimento da coerência/efeito estilístico positivo)"
        correctAnswer: ruptura na leitura e comprometimento da coerência
        difficulty: 5
        rationale: Sem coesão, o leitor perde os fios condutores do texto, comprometendo a coerência global.
        objectives: [EF89LP05]
target: 10
