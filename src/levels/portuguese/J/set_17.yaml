title: 📚 Literatura e Sociedade
level: J
subject: portuguese
difficulty: 5
objectives: [EF89LP06, EF89LP07, EF89LP47]
authorNotes: Literatura reflete e transforma a sociedade — cada período literário corresponde a um contexto histórico e ideológico.
example: "Contexto histórico molda a literatura. Ex.: Realismo brasileiro (1881) → crítica à escravidão, ao romantismo idealizador e à burguesia."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Literatura como Documento Histórico
    description: Obras refletem o tempo, os conflitos e os valores de seu contexto.
    exercises:
      - type: paragraph
        question: "Ler 'O Cortiço' de Aluísio Azevedo nos permite entender principalmente: (a poesia romântica do séc. XIX/a vida urbana e social no Rio de Janeiro do séc. XIX/a linguagem arcaica do período colonial/a visão de mundo da aristocracia rural)"
        correctAnswer: a vida urbana e social no Rio de Janeiro do séc. XIX
        difficulty: 3
        rationale: O Realismo-Naturalismo retrata a sociedade com rigor científico — 'O Cortiço' é documento social.
        objectives: [EF89LP06]
  - pageNumber: 2
    title: Romantismo e Ideologia Nacional
    description: Romantismo construiu a identidade nacional brasileira via literatura.
    exercises:
      - type: paragraph
        question: "A idealização do índio no Romantismo (Iracema, Guarani) serve principalmente para: (descrever etnograficamente os povos indígenas/construir mito de origem da nação/criticar a colonização portuguesa/reproduzir narrativas europeias sem adaptação)"
        correctAnswer: construir mito de origem da nação
        difficulty: 3
        rationale: O indianismo romântico idealizou o índio como símbolo de uma identidade nacional original.
        objectives: [EF89LP07]
  - pageNumber: 3
    title: Realismo e Crítica Social
    description: Machado de Assis desvela hipocrisia, dominação e superficialidade da burguesia.
    exercises:
      - type: paragraph
        question: "Em 'Dom Casmurro', Machado de Assis critica principalmente: (a natureza tropical do Brasil/a poesia parnasiana de sua época/a hipocrisia e ambiguidade da burguesia fluminense/a industrialização europeia do século XIX)"
        correctAnswer: a hipocrisia e ambiguidade da burguesia fluminense
        difficulty: 3
        rationale: Machado usa o narrador não confiável para expor as contradições da elite brasileira.
        objectives: [EF89LP07]
  - pageNumber: 4
    title: Modernismo e Ruptura
    description: Semana de 22 rompe com o passado e busca uma arte genuinamente brasileira.
    exercises:
      - type: paragraph
        question: "O Modernismo de 1922 propõe ruptura com: (a estética barroca/a literatura indígena oral/o parnasianismo e suas formas rígidas e elitistas/a linguagem coloquial regional)"
        correctAnswer: o parnasianismo e suas formas rígidas e elitistas
        difficulty: 3
        rationale: A Semana de Arte Moderna opõe-se diretamente ao culto da forma parnasiana e da linguagem erudita.
        objectives: [EF89LP07]
  - pageNumber: 5
    title: Literatura Regionalista
    description: Retrata especificidades culturais de regiões do Brasil.
    exercises:
      - type: paragraph
        question: "'Vidas Secas' (Graciliano Ramos) e 'Grande Sertão: Veredas' (Guimarães Rosa) são obras que: (ignoram o contexto social/idealizam o sertão como paraíso/retratam a realidade e a linguagem do sertão/são exemplos do Naturalismo europeu)"
        correctAnswer: retratam a realidade e a linguagem do sertão
        difficulty: 3
        rationale: Regionalismo de 30 usa a especificidade regional para tratar questões universais.
        objectives: [EF89LP06]
  - pageNumber: 6
    title: Poesia Engajada
    description: Literatura como instrumento de denúncia e transformação social.
    exercises:
      - type: paragraph
        question: "A Poesia Concreta (anos 1950-60) difere da poesia engajada porque: (trata temas sociais com rima/prioriza a experimentação formal em vez do engajamento político direto/usa linguagem romântica/é exclusivamente oral e performática)"
        correctAnswer: prioriza a experimentação formal em vez do engajamento político direto
        difficulty: 4
        rationale: Concretismo enfatiza a materialidade da linguagem; poesia engajada prioriza conteúdo crítico-social.
        objectives: [EF89LP06]
  - pageNumber: 7
    title: Literatura e Identidade
    description: Obras constroem, questionam e desconstroem identidades sociais.
    exercises:
      - type: paragraph
        question: "A literatura afro-brasileira (Carolina de Jesus, Conceição Evaristo) cumpre o papel de: (reproduzir a visão eurocêntrica do cânone/silenciar experiências periféricas/dar visibilidade a experiências historicamente apagadas/imitar o realismo europeu)"
        correctAnswer: dar visibilidade a experiências historicamente apagadas
        difficulty: 4
        rationale: Literatura afro-brasileira insere no cânone vozes e experiências sistematicamente excluídas.
        objectives: [EF89LP07]
  - pageNumber: 8
    title: Cânone Literário e Exclusão
    description: O cânone é uma seleção histórica e ideológica — não universal.
    exercises:
      - type: paragraph
        question: "O cânone literário é problemático porque: (inclui autores de muitos países diferentes/é atualizado a cada ano por uma comissão neutra/foi construído priorizando vozes masculinas, brancas e europeias/é obrigatório por lei em todo o mundo)"
        correctAnswer: foi construído priorizando vozes masculinas, brancas e europeias
        difficulty: 4
        rationale: O cânone reflete escolhas históricas de poder que excluíram mulheres, negros e culturas periféricas.
        objectives: [EF89LP07]
  - pageNumber: 9
    title: Função Social da Literatura
    description: Literatura humaniza, questiona, empatiza e subverte o status quo.
    exercises:
      - type: paragraph
        question: "Para Antonio Candido, a literatura tem função humanizadora porque: (entretém sem comprometer a realidade/desenvolve empatia, amplia visões de mundo e constrói a personalidade/ensina gramática de modo acessível/supera a filosofia em transmitir saber)"
        correctAnswer: desenvolve empatia, amplia visões de mundo e constrói a personalidade
        difficulty: 4
        rationale: Para Candido, a literatura é direito — processa a realidade e humaniza quem a lê.
        objectives: [EF89LP47]
  - pageNumber: 10
    title: Análise Contextualizada
    description: Relacionar obra literária ao seu momento histórico e ideológico.
    exercises:
      - type: paragraph
        question: "Para analisar criticamente uma obra literária, é fundamental: (memorizar a biografia completa do autor/identificar apenas figuras de linguagem e rimas/relacionar forma, conteúdo e contexto histórico-social/resumir o enredo sem interpretar)"
        correctAnswer: relacionar forma, conteúdo e contexto histórico-social
        difficulty: 5
        rationale: Análise literária madura integra os três eixos — forma, conteúdo e contexto são inseparáveis.
        objectives: [EF89LP47]
target: 10
