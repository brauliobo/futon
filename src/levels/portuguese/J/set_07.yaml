title: Gêneros Textuais - Revisão
level: J
subject: portuguese
difficulty: 4
objectives: [EF89LP01, EF89LP04, EF89LP07, EF89LP09]
authorNotes: Identificação integrada de gêneros por características principais.
example: "Gêneros diferem por estrutura, função e público. Ex.: 'Como plantar alface em vasos' é característi… → manual instrucional."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Reconhecer pelo Título
    description: Título remete a formato típico.
    exercises:
      - type: paragraph
        question: "'Como plantar alface em vasos' é característico de: (notícia/biografia/poema/manual instrucional)"
        correctAnswer: manual instrucional
        difficulty: 2
        rationale: Título imperativo-descritivo sugere passo a passo.
        objectives: [EF89LP09]
  - pageNumber: 2
    title: Reconhecer pela Estrutura
    description: Lide + corpo vs. tese + argumentos.
    exercises:
      - type: paragraph
        question: "Texto com lide, corpo e pirâmide invertida é: (conto/artigo de opinião/notícia/carta)"
        correctAnswer: notícia
        difficulty: 3
        rationale: Pirâmide invertida é marca jornalística.
        objectives: [EF89LP01]
  - pageNumber: 3
    title: Reconhecer pelo Registro
    description: Informal vs. formal, subjetivo vs. objetivo.
    exercises:
      - type: paragraph
        question: "Registro com 'rs', abreviações e emojis típico de: (editorial/reportagem/artigo acadêmico/chat)"
        correctAnswer: chat
        difficulty: 2
        rationale: Plataforma de conversa digital admite esses recursos.
        objectives: [EF89LP09]
  - pageNumber: 4
    title: Função Social
    description: Informar, opinar, entreter, instruir, documentar.
    exercises:
      - type: paragraph
        question: "Função principal da notícia: (instruir/informar/opinar/entreter)"
        correctAnswer: informar
        difficulty: 2
        rationale: Notícia informa fatos.
        objectives: [EF89LP01]
  - pageNumber: 5
    title: Público-alvo
    description: Criança, público geral, especialista.
    exercises:
      - type: paragraph
        question: "Artigo científico dirige-se a: (público especializado/turistas/público adolescente comum/público infantil)"
        correctAnswer: público especializado
        difficulty: 3
        rationale: Termos técnicos exigem leitor afinado.
        objectives: [EF89LP04]
  - pageNumber: 6
    title: Suporte
    description: "Onde o texto circula — jornal, livro, internet, TV."
    exercises:
      - type: paragraph
        question: "Podcast circula em: (jornal diário/livros impressos/streaming de áudio/televisão analógica)"
        correctAnswer: streaming de áudio
        difficulty: 2
        rationale: Podcast é formato de áudio distribuído em plataformas digitais.
        objectives: [EF89LP09]
  - pageNumber: 7
    title: Intergeneridade
    description: Gêneros se cruzam — notícia-opinião, vídeo-post.
    exercises:
      - type: paragraph
        question: "Quando um vídeo inclui legendas, comentários e narração, caracteriza: (transgressão/fim do gênero/intergeneridade/monogênero)"
        correctAnswer: intergeneridade
        difficulty: 4
        rationale: Combinação de gêneros em um único suporte.
        objectives: [EF89LP09]
  - pageNumber: 8
    title: Adequação
    description: Escolher gênero apto ao objetivo comunicativo.
    exercises:
      - type: paragraph
        question: "Para pedir cancelamento a empresa, use: (meme/crônica/conto/carta formal)"
        correctAnswer: carta formal
        difficulty: 2
        rationale: Contexto empresarial exige formalidade.
        objectives: [EF89LP04]
  - pageNumber: 9
    title: Estratégias Argumentativas
    description: Dados, exemplos, autoridade, emoção.
    exercises:
      - type: paragraph
        question: "Um bom artigo de opinião mistura: (só opinião pessoal/só metáforas/dados, exemplos e autoridade/só dados)"
        correctAnswer: dados, exemplos e autoridade
        difficulty: 3
        rationale: Variedade argumentativa fortalece a tese.
        objectives: [EF89LP04]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o gênero pelo contexto.
    exercises:
      - type: paragraph
        question: "Texto curto, pessoal, sobre o café da manhã, em blog é: (notícia/biografia/manual/crônica)"
        correctAnswer: crônica
        difficulty: 3
        rationale: Reflexão cotidiana breve = crônica.
        objectives: [EF89LP07]
target: 10
