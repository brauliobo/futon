title: Crônica e Conto
level: J
subject: portuguese
difficulty: 3
objectives: [EF89LP07, EF89LP08]
authorNotes: Crônica — texto breve sobre o cotidiano. Conto — narrativa ficcional curta com clímax.
example: "Crônica — Rubem Braga; conto — Machado de Assis. Ex.: Crônica costuma ter: → tom pessoal e reflexivo."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Crônica
    description: Texto híbrido jornalístico-literário, geralmente curto.
    exercises:
      - type: paragraph
        question: "Crônica costuma ter: (conjunto de dados/tese argumentativa/ficha técnica/tom pessoal e reflexivo)"
        correctAnswer: tom pessoal e reflexivo
        difficulty: 1
        rationale: Autor comenta fatos do cotidiano com subjetividade.
        objectives: [EF89LP07]
  - pageNumber: 2
    title: Características da Crônica
    description: Curta, cotidiana, literária.
    exercises:
      - type: paragraph
        question: "Característica típica da crônica: (leveza e brevidade/análise técnica/estrutura científica/grande extensão)"
        correctAnswer: leveza e brevidade
        difficulty: 1
        rationale: Crônica é um texto curto com tom leve.
        objectives: [EF89LP07]
  - pageNumber: 3
    title: Cronistas Brasileiros
    description: Rubem Braga, Fernando Sabino, Luís Fernando Veríssimo.
    exercises:
      - type: paragraph
        question: "Cronista famoso brasileiro: (Luís Fernando Veríssimo/Caetano Veloso/Castro Alves/Ruy Barbosa)"
        correctAnswer: Luís Fernando Veríssimo
        difficulty: 2
        rationale: Veríssimo é cronista consagrado.
        objectives: [EF89LP07]
  - pageNumber: 4
    title: Definição de Conto
    description: Narrativa curta, ficcional, com enredo completo.
    exercises:
      - type: paragraph
        question: "Elemento fundamental do conto: (referências bibliográficas/cabeçalho/enredo com clímax/dados estatísticos)"
        correctAnswer: enredo com clímax
        difficulty: 1
        rationale: Conto é narrativa com clímax e desfecho.
        objectives: [EF89LP08]
  - pageNumber: 5
    title: Elementos Narrativos
    description: Narrador, personagens, espaço, tempo, enredo.
    exercises:
      - type: paragraph
        question: "Narrador em 3ª pessoa que sabe tudo é: (onisciente/personagem/observador/em 1ª pessoa)"
        correctAnswer: onisciente
        difficulty: 2
        rationale: Onisciente acessa pensamentos de todos.
        objectives: [EF89LP08]
  - pageNumber: 6
    title: Tipos de Conto
    description: Fantástico, realista, policial, psicológico.
    exercises:
      - type: paragraph
        question: "Conto com elementos sobrenaturais é: (realista/fantástico/psicológico/policial)"
        correctAnswer: fantástico
        difficulty: 2
        rationale: Fantástico rompe a realidade.
        objectives: [EF89LP08]
  - pageNumber: 7
    title: Machado de Assis — Contos
    description: Referência do conto brasileiro.
    exercises:
      - type: paragraph
        question: "Conto famoso de Machado: (A Moreninha/Grande Sertão/A Cartomante/Vidas Secas)"
        correctAnswer: A Cartomante
        difficulty: 2
        rationale: "'A Cartomante' é conto canônico de Machado."
        objectives: [EF89LP08]
  - pageNumber: 8
    title: Crônica x Conto
    description: Crônica parte de fato real; conto é ficcional.
    exercises:
      - type: paragraph
        question: "Principal diferença: (conto é ficção; crônica parte do cotidiano/conto é curto; crônica não/crônica tem diálogo/ambos são idênticos)"
        correctAnswer: conto é ficção; crônica parte do cotidiano
        difficulty: 2
        rationale: Conto é ficcional; crônica, cotidiano.
        objectives: [EF89LP08]
  - pageNumber: 9
    title: Foco Narrativo
    description: Quem conta a história.
    exercises:
      - type: paragraph
        question: "Narrador personagem usa: (2ª pessoa/3ª pessoa/1ª pessoa/sem pronome)"
        correctAnswer: 1ª pessoa
        difficulty: 2
        rationale: Personagem narra em primeira pessoa.
        objectives: [EF89LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o gênero.
    exercises:
      - type: paragraph
        question: "Texto curto com reflexão pessoal sobre o trânsito é: (notícia/conto/crônica/resenha)"
        correctAnswer: crônica
        difficulty: 1
        rationale: Crônica comenta o cotidiano com leveza.
        objectives: [EF89LP07]
target: 10
