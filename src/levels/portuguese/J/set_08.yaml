title: 🔍 Leitura e Interpretação Textual Avançada
level: J
subject: portuguese
difficulty: 5
objectives: [EF89LP03, EF89LP04, EF89LP06]
authorNotes: Leitura proficiente exige inferência, identificação de pressupostos e avaliação crítica do texto.
example: "Inferência vai além do explícito. Ex.: 'Ela entrou sem cumprimentar ninguém' → inferimos que estava irritada ou com pressa."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Sentido Literal e Figurado
    description: Distinguir o que o texto diz do que ele sugere.
    exercises:
      - type: paragraph
        question: "'O governo engoliu a derrota' usa linguagem: (literal e factual/figurada e metafórica/técnica e científica/poética e lírica)"
        correctAnswer: figurada e metafórica
        difficulty: 2
        rationale: Engolir a derrota é expressão figurada — significa aceitar a derrota sem resistência.
        objectives: [EF89LP03]
  - pageNumber: 2
    title: Inferência
    description: Deduzir informação não explícita a partir do contexto.
    exercises:
      - type: paragraph
        question: "Ao dizer 'Não trouxe guarda-chuva de novo', o leitor infere que: (o narrador é displicente/está chovendo naquele momento/a cidade é desértica/o narrador odeia guarda-chuva)"
        correctAnswer: o narrador é displicente
        difficulty: 3
        rationale: A recorrência ('de novo') indica hábito de esquecimento — inferência sobre o comportamento.
        objectives: [EF89LP03]
  - pageNumber: 3
    title: Tema vs. Assunto
    description: Assunto é o objeto tratado; tema é a ideia central defendida.
    exercises:
      - type: paragraph
        question: "Um texto sobre a Amazônia que argumenta pela preservação ambiental tem assunto e tema, respectivamente: (preservação; Amazônia/Amazônia; preservação ambiental/desmatamento; ecologia/ecologia; biodiversidade)"
        correctAnswer: Amazônia; preservação ambiental
        difficulty: 3
        rationale: Assunto é o objeto empírico (Amazônia); tema é a ideia central defendida (preservação).
        objectives: [EF89LP04]
  - pageNumber: 4
    title: Pressupostos e Subentendidos
    description: Informações implícitas que sustentam o enunciado.
    exercises:
      - type: paragraph
        question: "'Você parou de fumar?' pressupõe que: (o interlocutor nunca fumou/o interlocutor fumava antes/fumar é proibido/a pergunta é retórica)"
        correctAnswer: o interlocutor fumava antes
        difficulty: 3
        rationale: O verbo 'parar' pressupõe ação anterior — quem para, antes fazia.
        objectives: [EF89LP03]
  - pageNumber: 5
    title: Ponto de Vista
    description: Identificar a perspectiva do autor ou narrador.
    exercises:
      - type: paragraph
        question: "Narrador que usa 'nós' e participa dos eventos é: (onisciente neutro/em primeira pessoa do plural/observador externo/implícito e ausente)"
        correctAnswer: em primeira pessoa do plural
        difficulty: 3
        rationale: "'Nós' indica participação coletiva do narrador nos eventos."
        objectives: [EF89LP06]
  - pageNumber: 6
    title: Confiabilidade do Narrador
    description: O narrador pode ser tendencioso ou não confiável.
    exercises:
      - type: paragraph
        question: "Um narrador-personagem que relata apenas sua própria versão dos fatos é: (onisciente/não confiável/neutro/heterodiegético)"
        correctAnswer: não confiável
        difficulty: 4
        rationale: Narrador-personagem tem visão parcial e pode omitir ou distorcer fatos.
        objectives: [EF89LP06]
  - pageNumber: 7
    title: Progressão Temática
    description: Como o texto avança do tema para o rema.
    exercises:
      - type: paragraph
        question: "Na progressão temática linear, o rema de uma frase torna-se o ___ da seguinte: (rema/tema/predicado verbal/sujeito composto)"
        correctAnswer: tema
        difficulty: 4
        rationale: Na progressão linear, o novo de uma frase (rema) vira ponto de partida (tema) da próxima.
        objectives: [EF89LP04]
  - pageNumber: 8
    title: Coerência Global
    description: O texto precisa de unidade temática e lógica interna.
    exercises:
      - type: paragraph
        question: "Um texto coerente deve apresentar: (rimas em todos os parágrafos/unidade temática e não contradição/termos técnicos em toda frase/parágrafos longos obrigatoriamente)"
        correctAnswer: unidade temática e não contradição
        difficulty: 4
        rationale: Coerência global exige que as ideias se sustentem sem contradições internas.
        objectives: [EF89LP04]
  - pageNumber: 9
    title: Leitura Crítica
    description: Avaliar o texto quanto a valores, silêncios e ideologia.
    exercises:
      - type: paragraph
        question: "Ler criticamente significa: (decorar o vocabulário do texto/aceitar tudo que o autor diz/questionar posições, valores e omissões do texto/focar só nas rimas e metáforas)"
        correctAnswer: questionar posições, valores e omissões do texto
        difficulty: 4
        rationale: Leitura crítica inclui posicionar-se frente às escolhas discursivas e ideológicas do texto.
        objectives: [EF89LP06]
  - pageNumber: 10
    title: Integração de Habilidades
    description: Aplicar inferência, tema e ponto de vista conjuntamente.
    exercises:
      - type: paragraph
        question: "Num texto em que o narrador omite o nome do acusado mas descreve o crime detalhadamente, há: (neutralidade absoluta/estratégia de preservação e parcialidade seletiva/erro de revisão textual/progressão temática constante)"
        correctAnswer: estratégia de preservação e parcialidade seletiva
        difficulty: 5
        rationale: Omitir o nome protege ou preserva alguém; detalhar o crime é escolha discursiva parcial.
        objectives: [EF89LP06]
target: 10
