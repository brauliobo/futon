title: Estrutura de Parágrafos - Introdução
level: B
subject: portuguese
example: Identifique e construa parágrafos com estrutura básica.
pages:
  - pageNumber: 1
    title: Tópico Frasal
    description: Identifique a frase principal do parágrafo.
    exercises:
      - { type: reading, question: ""Qual é a ideia principal? 'O verão é quente. As pessoas vão à praia. Todos gostam do sol.' (verão/pessoas/praia/sol)"", correctAnswer: verão }
  - pageNumber: 2
    title: Detalhes de Apoio
    description: Reconheça frases que dão detalhes sobre o tópico.
    exercises:
      - { type: reading, question: ""Qual frase dá detalhe sobre 'Os cães são leais'? (Eles protegem/Gatos miam/Pássaros voam/Peixes nadam)"", correctAnswer: Eles protegem }
  - pageNumber: 3
    title: Sequência Lógica
    description: Organize frases em ordem lógica.
    exercises:
      - { type: reading, question: ""Ordem correta: A)Acordei B)Tomei banho C)Me vesti D)Saí (A-B-C-D/B-A-C-D/A-C-B-D/D-C-B-A)"", correctAnswer: A-B-C-D }
  - pageNumber: 4
    title: Conectores Básicos
    description: Use palavras que ligam ideias.
    exercises:
      - { type: reading, question: ""Complete: João correu ___ chegou atrasado. (mas/e/ou/se)"", correctAnswer: mas }
  - pageNumber: 5
    title: Conclusão
    description: Identifique a frase que encerra o parágrafo.
    exercises:
      - { type: reading, question: ""Qual conclui melhor o parágrafo sobre escola? (Estudar é bom/A escola acabou/Portanto, educação é importante/Amanhã é sábado)"", correctAnswer: Portanto, educação é importante }
  - pageNumber: 6
    title: Coerência
    description: Identifique se o parágrafo faz sentido.
    exercises:
      - { type: reading, question: ""O parágrafo é coerente? 'Gosto de frutas. Maçãs são doces. Meu carro é azul.' (sim/não)"", correctAnswer: não }
  - pageNumber: 7
    title: Unidade Temática
    description: Mantenha todas as frases sobre o mesmo assunto.
    exercises:
      - { type: reading, question: ""Qual frase não pertence ao parágrafo sobre animais? (Cães latem/Gatos mianem/Carros buzinem/Pássaros cantam)"", correctAnswer: Carros buzinem }
  - pageNumber: 8
    title: Parágrafo Completo
    description: Reconheça um parágrafo bem estruturado.
    exercises:
      - { type: reading, question: ""Qual está melhor organizado? A)'Gosto de ler. Livros são interessantes. A leitura ensina.' B)'Ler gosto. Interessantes livros. Ensina leitura.' (A/B)"", correctAnswer: A }
  - pageNumber: 9
    title: Revisão de Estrutura
    description: Aplique os conceitos aprendidos.
    exercises:
      - { type: reading, question: ""Um bom parágrafo precisa de: (tópico e detalhes/só detalhes/só tópico/nenhum dos dois)"", correctAnswer: tópico e detalhes }
  - pageNumber: 10
    title: Prática Final
    description: Demonstre compreensão da estrutura.
    exercises:
      - { type: reading, question: ""O melhor parágrafo sobre casa: A)'Casa é lugar de família. Lá nos sentimos seguros. É nosso lar.' B)'Casa família. Seguros lar sentimos.' (A/B)"", correctAnswer: A }
target: 10
