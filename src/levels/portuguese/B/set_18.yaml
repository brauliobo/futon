title: Sinônimos e Antônimos
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Sinônimos e antônimos. Expande vocabulário."
example: "Pratique sinônimos e antônimos. Ex.: Sinônimo de 'alegre': → feliz."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Palavras com Significados Relacionados
    description: Identifique sinônimos e antônimos das palavras dadas.
    exercises:
      - type: reading
        question: "Sinônimo de 'alegre': (triste/feliz/bravo/calmo)"
        correctAnswer: feliz
        rationale: "Sinônimos têm significado semelhante."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "Antônimo de 'grande': (pequeno/médio/enorme/alto)"
        correctAnswer: pequeno
        rationale: "Antônimos têm significados opostos."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "Sinônimo de 'bonito': (ruim/feio/lindo/normal)"
        correctAnswer: lindo
        rationale: "Sinônimos têm significado semelhante."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "Antônimo de 'claro': (brilhante/colorido/transparente/escuro)"
        correctAnswer: escuro
        rationale: "Antônimos têm significados opostos."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "Sinônimo de 'rápido': (quieto/lento/veloz/calmo)"
        correctAnswer: veloz
        rationale: "Sinônimos têm significado semelhante (casa/lar)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "Antônimo de 'quente': (morno/frio/temperado/ardente)"
        correctAnswer: frio
        rationale: "O contexto determina o sinônimo adequado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "Sinônimo de 'casa': (lar/bairro/cidade/rua)"
        correctAnswer: lar
        rationale: "Antônimos têm significado oposto (alto/baixo)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "Antônimo de 'subir': (crescer/elevar/descer/levantar)"
        correctAnswer: descer
        rationale: "Antônimos podem ser formados por prefixo (feliz/infeliz)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "Sinônimo de 'inteligente': (burro/tolo/ignorante/esperto)"
        correctAnswer: esperto
        rationale: "Sinonímia pode ser total ou parcial."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "Antônimo de 'começar': (terminar/prosseguir/iniciar/continuar)"
        correctAnswer: terminar
        rationale: "Alguns antônimos são palavras distintas (grande/pequeno)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
