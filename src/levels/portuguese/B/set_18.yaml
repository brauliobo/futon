title: Sinônimos e Antônimos
level: B
subject: portuguese
pages:
  - pageNumber: 1
    title: Palavras com Significados Relacionados
    description: Identifique sinônimos e antônimos das palavras dadas.
    exercises:
      - { type: reading, question: "Sinônimo de 'alegre': (triste/feliz/bravo/calmo)", correctAnswer: feliz }
      - { type: reading, question: "Antônimo de 'grande': (pequeno/enorme/médio/alto)", correctAnswer: pequeno }
      - { type: reading, question: "Sinônimo de 'bonito': (feio/lindo/normal/ruim)", correctAnswer: lindo }
      - { type: reading, question: "Antônimo de 'claro': (escuro/brilhante/colorido/transparente)", correctAnswer: escuro }
      - { type: reading, question: "Sinônimo de 'rápido': (lento/veloz/calmo/quieto)", correctAnswer: veloz }
      - { type: reading, question: "Antônimo de 'quente': (frio/morno/ardente/temperado)", correctAnswer: frio }
      - { type: reading, question: "Sinônimo de 'casa': (rua/lar/cidade/bairro)", correctAnswer: lar }
      - { type: reading, question: "Antônimo de 'subir': (descer/elevar/crescer/levantar)", correctAnswer: descer }
      - { type: reading, question: "Sinônimo de 'inteligente': (burro/esperto/tolo/ignorante)", correctAnswer: esperto }
      - { type: reading, question: "Antônimo de 'começar': (iniciar/terminar/continuar/prosseguir)", correctAnswer: terminar }
target: 10
