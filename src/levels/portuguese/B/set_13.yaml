title: 🔢 Substantivos - Gênero e Número
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Substantivos — gênero e número. Concordância com artigo e adjetivo."
example: "Pratique substantivos - gênero e número. Ex.: Complete: ___ aluno estuda muito. → O."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Masculino e Feminino
    description: Identifique o gênero correto dos substantivos.
    exercises:
      - type: grammar
        question: "O substantivo 'mesa' é: (feminino/masculino)"
        correctAnswer: feminino
        rationale: "Feminino muitas vezes termina em -a; masculino em -o."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "O substantivo 'livro' é: (feminino/masculino)"
        correctAnswer: masculino
        rationale: "Feminino muitas vezes termina em -a; masculino em -o."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "O substantivo 'casa' é: (feminino/masculino)"
        correctAnswer: feminino
        rationale: "Feminino normalmente termina em -a; masculino em -o."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "O substantivo 'carro' é: (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Plural geralmente se forma acrescentando -s ou -es."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Complete: ___ professora ensina bem. (O/A)"
        correctAnswer: A
        rationale: "'A' é o artigo feminino singular que concorda com 'professora' (feminino)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Complete: ___ aluno estuda muito. (A/O)"
        correctAnswer: O
        rationale: "Numeral indica quantidade (um, dois, primeiro)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "O substantivo 'flor' é: (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Gênero pode mudar a palavra inteira (homem/mulher)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "O substantivo 'sol' é: (feminino/masculino)"
        correctAnswer: masculino
        rationale: "Observe o artigo para identificar gênero (o/a, um/uma)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Complete: ___ menina brinca. (A/O)"
        correctAnswer: A
        rationale: "'A' é o artigo feminino singular que concorda com 'menina' (feminino)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Complete: ___ cachorro late. (A/O)"
        correctAnswer: O
        rationale: "'O' é o artigo masculino singular que concorda com 'cachorro' (masculino)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
