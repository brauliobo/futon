title: Substantivos - Gênero e Número
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Masculino e Feminino
    description: Identifique o gênero correto dos substantivos.
    exercises:
      - type: grammar
        question: "O substantivo 'mesa' é: (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Terminadas em -ão formam plural em -ões, -ãos ou -ães."
      - type: grammar
        question: "O substantivo 'livro' é: (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Adjetivo qualifica o substantivo (cor, tamanho, estado)."
      - type: grammar
        question: "O substantivo 'casa' é: (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Pronome substitui ou acompanha o substantivo."
      - type: grammar
        question: "O substantivo 'carro' é: (masculino/feminino)"
        correctAnswer: masculino
        rationale: "'O/os' acompanha masculino; 'a/as' acompanha feminino."
      - type: grammar
        question: "Complete: ___ professora ensina bem. (A/O)"
        correctAnswer: A
        rationale: "Pronome substitui ou acompanha o substantivo."
      - type: grammar
        question: "Complete: ___ aluno estuda muito. (A/O)"
        correctAnswer: O
        rationale: "Numeral indica quantidade (um, dois, primeiro)."
      - type: grammar
        question: "O substantivo 'flor' é: (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Conjunção 'e' soma; 'mas' contrasta; 'ou' alterna."
      - type: grammar
        question: "O substantivo 'sol' é: (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Pronome substitui ou acompanha o substantivo."
      - type: grammar
        question: "Complete: ___ menina brinca. (A/O)"
        correctAnswer: A
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: "Complete: ___ cachorro late. (A/O)"
        correctAnswer: O
        rationale: "Verbo concorda com o sujeito em número e pessoa."
target: 10
