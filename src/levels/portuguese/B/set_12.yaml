title: Verbos no Presente - Conjugação Regular
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Verbos Terminados em -ar
    description: Complete as frases com a conjugação correta.
    exercises:
      - type: grammar
        question: Eu ___ todos os dias. (estudar)
        correctAnswer: estudo
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
      - type: grammar
        question: Tu ___ muito bem. (cantar)
        correctAnswer: cantas
        rationale: "Com 'tu' o verbo vai na 2ª pessoa do singular (-s)."
      - type: grammar
        question: Ele ___ na praia. (nadar)
        correctAnswer: nada
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
      - type: grammar
        question: Nós ___ juntos. (trabalhar)
        correctAnswer: trabalhamos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
      - type: grammar
        question: Vós ___ cedo. (acordar)
        correctAnswer: acordais
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Eles ___ futebol. (jogar)
        correctAnswer: jogam
        rationale: "Com 'eles/elas' o verbo vai na 3ª pessoa do plural."
      - type: grammar
        question: Maria ___ a casa. (limpar)
        correctAnswer: limpa
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Os meninos ___ no parque. (brincar)
        correctAnswer: brincam
        rationale: "Sujeito no plural exige verbo no plural."
      - type: grammar
        question: Você ___ português. (falar)
        correctAnswer: fala
        rationale: "Com 'você' o verbo vai na 3ª pessoa do singular."
      - type: grammar
        question: As crianças ___ histórias. (contar)
        correctAnswer: contam
        rationale: "Sujeito no plural exige verbo no plural."
target: 10
