title: Verbos no Presente - Conjugação Regular
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Verbos Terminados em -ar
    description: Complete as frases com a conjugação correta.
    exercises:
      - type: grammar
        question: Eu ___ todos os dias. (estudar)
        correctAnswer: estudo
        rationale: "Conjunção 'e' soma; 'mas' contrasta; 'ou' alterna."
      - type: grammar
        question: Tu ___ muito bem. (cantar)
        correctAnswer: cantas
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: Ele ___ na praia. (nadar)
        correctAnswer: nada
        rationale: "Palavra-chave da frase define o sentido esperado."
      - type: grammar
        question: Nós ___ juntos. (trabalhar)
        correctAnswer: trabalhamos
        rationale: "'Nós' pede verbo em 1a pessoa do plural (-mos)."
      - type: grammar
        question: Vós ___ cedo. (acordar)
        correctAnswer: acordais
        rationale: "Aumentativo acrescenta ideia de grande (-ão, -zão)."
      - type: grammar
        question: Eles ___ futebol. (jogar)
        correctAnswer: jogam
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
      - type: grammar
        question: Maria ___ a casa. (limpar)
        correctAnswer: limpa
        rationale: "Conjunção 'e' soma; 'mas' contrasta; 'ou' alterna."
      - type: grammar
        question: Os meninos ___ no parque. (brincar)
        correctAnswer: brincam
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: Você ___ português. (falar)
        correctAnswer: fala
        rationale: "'O/os' acompanha masculino; 'a/as' acompanha feminino."
      - type: grammar
        question: As crianças ___ histórias. (contar)
        correctAnswer: contam
        rationale: "Diminutivo acrescenta ideia de pequeno (-inho, -zinho)."
target: 10
