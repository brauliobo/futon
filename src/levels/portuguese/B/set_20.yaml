title: Compreensão de Texto
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Interpretação de Pequenos Textos
    description: Leia os textos e responda às perguntas.
    exercises:
      - type: reading
        question: "'João acordou cedo e foi à escola.' Quem acordou cedo? (Maria/João/Pedro/Ana)"
        correctAnswer: João
        rationale: "Aumentativo acrescenta ideia de grande (-ão, -zão)."
      - type: reading
        question: "'A menina brinca no jardim com suas bonecas.' Onde a menina brinca? (casa/escola/jardim/praia)"
        correctAnswer: jardim
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: reading
        question: "'O cachorro late quando alguém chega.' O que o cachorro faz? (mia/late/canta/dorme)"
        correctAnswer: late
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: reading
        question: "'Maria comprou frutas no mercado.' O que Maria comprou? (livros/roupas/frutas/brinquedos)"
        correctAnswer: frutas
        rationale: "Preposição liga palavras (de, em, para, com)."
      - type: reading
        question: "'As crianças estudam pela manhã.' Quando as crianças estudam? (tarde/noite/manhã/madrugada)"
        correctAnswer: manhã
        rationale: "Sinônimo = palavra com mesmo sentido."
      - type: reading
        question: "'O gato dorme no sofá da sala.' Onde o gato dorme? (cama/sofá/chão/mesa)"
        correctAnswer: sofá
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: reading
        question: "'Pedro joga futebol com os amigos.' Com quem Pedro joga? (irmãos/amigos/pais/professores)"
        correctAnswer: amigos
        rationale: "Diminutivo acrescenta ideia de pequeno (-inho, -zinho)."
      - type: reading
        question: "'A professora explica a lição no quadro.' Onde ela explica? (livro/caderno/quadro/mesa)"
        correctAnswer: quadro
        rationale: "Diminutivo acrescenta ideia de pequeno (-inho, -zinho)."
      - type: reading
        question: "'Os pássaros cantam na árvore.' O que os pássaros fazem? (voam/cantam/dormem/comem)"
        correctAnswer: cantam
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
      - type: reading
        question: "'Ana lê um livro interessante.' Como é o livro? (chato/interessante/difícil/pequeno)"
        correctAnswer: interessante
        rationale: "Numeral indica quantidade (um, dois, primeiro)."
target: 10
