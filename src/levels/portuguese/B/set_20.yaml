title: Compreensão de Texto
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto. Ex.: 'João acordou cedo e foi à escola.' Quem acor… → João."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Interpretação de Pequenos Textos
    description: Leia os textos e responda às perguntas.
    exercises:
      - type: reading
        question: "'João acordou cedo e foi à escola.' Quem acordou cedo? (Pedro/Ana/Maria/João)"
        correctAnswer: João
        rationale: "O sujeito responde 'quem pratica a ação'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "'A menina brinca no jardim com suas bonecas.' Onde a menina brinca? (praia/casa/escola/jardim)"
        correctAnswer: jardim
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "'O cachorro late quando alguém chega.' O que o cachorro faz? (dorme/mia/late/canta)"
        correctAnswer: late
        rationale: "O tempo responde 'quando' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "'Maria comprou frutas no mercado.' O que Maria comprou? (frutas/brinquedos/roupas/livros)"
        correctAnswer: frutas
        rationale: "Preposição liga palavras (de, em, para, com)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "'As crianças estudam pela manhã.' Quando as crianças estudam? (noite/manhã/madrugada/tarde)"
        correctAnswer: manhã
        rationale: "O tempo responde 'quando' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "'O gato dorme no sofá da sala.' Onde o gato dorme? (chão/sofá/cama/mesa)"
        correctAnswer: sofá
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "'Pedro joga futebol com os amigos.' Com quem Pedro joga? (pais/amigos/irmãos/professores)"
        correctAnswer: amigos
        rationale: "O sujeito responde 'quem pratica a ação'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "'A professora explica a lição no quadro.' Onde ela explica? (caderno/mesa/livro/quadro)"
        correctAnswer: quadro
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "'Os pássaros cantam na árvore.' O que os pássaros fazem? (dormem/comem/cantam/voam)"
        correctAnswer: cantam
        rationale: "Observe as opções e escolha a que responde \"'Os pássaros cantam na árvore.' O que os pássaros fazem?\": 'cantam'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: "'Ana lê um livro interessante.' Como é o livro? (chato/difícil/interessante/pequeno)"
        correctAnswer: interessante
        rationale: "O modo responde 'como' a ação aconteceu."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
