pages:
  - pageNumber: 1
    title: Sinais de Pontuação e Acentos
    description: Complete as frases com a pontuação e acentuação corretas.
    exercises:
      - type: grammar
        question: "Como você se chama___ (./!/?) "
        correctAnswer: "?"
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: "Que lindo dia___ (./!/?) "
        correctAnswer: "!"
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: "Eu gosto de ler___ (./!/?) "
        correctAnswer: .
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Qual é a forma correta? (Jose/José)
        correctAnswer: José
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Qual é a forma correta? (musica/música)
        correctAnswer: música
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: "Complete: Comprei pão___ leite e ovos. (,/./?)"
        correctAnswer: ","
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Qual é a forma correta? (medico/médico)
        correctAnswer: médico
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Qual é a forma correta? (rapido/rápido)
        correctAnswer: rápido
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Maria disse___ 'Vou sair.' (:/./?)
        correctAnswer: ":"
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Qual é a forma correta? (facil/fácil)
        correctAnswer: fácil
        rationale: Aplique a regra gramatical estudada.
