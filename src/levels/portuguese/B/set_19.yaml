title: ✏️ Pontuação e Acentuação
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Regras de acentuação. Proparoxítonas sempre acentuadas."
example: "Pratique pontuação e acentuação. Ex.: Complete: Comprei pão___ leite e ovos. → ,."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Sinais de Pontuação e Acentos
    description: Complete as frases com a pontuação e acentuação corretas.
    exercises:
      - type: grammar
        question: "Como você se chama___ (./!/?)"
        correctAnswer: "?"
        rationale: "Frase interrogativa termina com '?'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Que lindo dia___ (./!/?)"
        correctAnswer: "!"
        rationale: "A pontuação correta é '!' — observe a entonação da frase."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Eu gosto de ler___ (./!/?)"
        correctAnswer: .
        rationale: "Frase declarativa (afirmação neutra) termina com ponto final '.'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Qual é a forma correta? (José/Jose)"
        correctAnswer: José
        rationale: "JOSÉ é oxítona terminada em E — leva acento agudo na última sílaba tônica."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Qual é a forma correta? (música/musica)
        correctAnswer: música
        rationale: "MÚSICA é proparoxítona (mú-si-ca) — todas proparoxítonas levam acento gráfico."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Complete: Comprei pão___ leite e ovos. (,/./?)"
        correctAnswer: ","
        rationale: "Vírgula separa itens de uma enumeração: 'pão, leite e ovos' (o último com 'e')."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Qual é a forma correta? (medico/médico)
        correctAnswer: médico
        rationale: "MÉDICO é proparoxítona (mé-di-co) — todas proparoxítonas levam acento gráfico."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Qual é a forma correta? (rápido/rapido)"
        correctAnswer: rápido
        rationale: "RÁPIDO é proparoxítona (rá-pi-do) — todas proparoxítonas levam acento gráfico."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Maria disse___ 'Vou sair.' (:/./?)
        correctAnswer: ":"
        rationale: "Dois-pontos ':' introduzem uma citação ou fala direta."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Qual é a forma correta? (facil/fácil)
        correctAnswer: fácil
        rationale: "FÁCIL é paroxítona terminada em -L — paroxítonas em -l/-n/-r/-x levam acento."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
