title: Pontuação e Acentuação
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Regras de acentuação. Proparoxítonas sempre acentuadas."
example: "Pratique pontuação e acentuação. Ex.: Complete: Comprei pão___ leite e ovos. → ,."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Sinais de Pontuação e Acentos
    description: Complete as frases com a pontuação e acentuação corretas.
    exercises:
      - type: grammar
        question: "Como você se chama___ (./!/?)"
        correctAnswer: "?"
        rationale: "Frase interrogativa termina com '?'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Que lindo dia___ (./!/?)"
        correctAnswer: "!"
        rationale: "A pontuação correta é '!' — observe a entonação da frase."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Eu gosto de ler___ (./!/?)"
        correctAnswer: .
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Qual é a forma correta? (José/Jose)"
        correctAnswer: José
        rationale: "JOSÉ é oxítona terminada em E — leva acento agudo na última sílaba tônica."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Qual é a forma correta? (música/musica)
        correctAnswer: música
        rationale: "Acento agudo marca vogal aberta; circunflexo, vogal fechada."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Complete: Comprei pão___ leite e ovos. (,/./?)"
        correctAnswer: ","
        rationale: "'E' é conjunção aditiva — soma ideias."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Qual é a forma correta? (medico/médico)
        correctAnswer: médico
        rationale: "Oxítonas acentuadas: terminadas em -a, -e, -o, -em, -ens."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Qual é a forma correta? (rápido/rapido)"
        correctAnswer: rápido
        rationale: "Plural regular: acrescentar -s ao final."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Maria disse___ 'Vou sair.' (:/./?)
        correctAnswer: ":"
        rationale: "Paroxítonas acentuadas: terminações como -l, -n, -r, -ps, -i(s), -us."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Qual é a forma correta? (facil/fácil)
        correctAnswer: fácil
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
