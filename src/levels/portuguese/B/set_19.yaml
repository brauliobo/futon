title: Pontuação e Acentuação
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Sinais de Pontuação e Acentos
    description: Complete as frases com a pontuação e acentuação corretas.
    exercises:
      - type: grammar
        question: "Como você se chama___ (./!/?) "
        correctAnswer: "?"
        rationale: "Artigo definido especifica; indefinido generaliza (um/uma)."
      - type: grammar
        question: "Que lindo dia___ (./!/?) "
        correctAnswer: "!"
        rationale: "'O/os' acompanha masculino; 'a/as' acompanha feminino."
      - type: grammar
        question: "Eu gosto de ler___ (./!/?) "
        correctAnswer: .
        rationale: "Palavra-chave da frase define o sentido esperado."
      - type: grammar
        question: Qual é a forma correta? (Jose/José)
        correctAnswer: José
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: Qual é a forma correta? (musica/música)
        correctAnswer: música
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: "Complete: Comprei pão___ leite e ovos. (,/./?)"
        correctAnswer: ","
        rationale: "Preposição liga palavras (de, em, para, com)."
      - type: grammar
        question: Qual é a forma correta? (medico/médico)
        correctAnswer: médico
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: Qual é a forma correta? (rapido/rápido)
        correctAnswer: rápido
        rationale: "Plural regular: acrescentar -s ao final."
      - type: grammar
        question: Maria disse___ 'Vou sair.' (:/./?)
        correctAnswer: ":"
        rationale: "Antônimo = palavra com sentido oposto."
      - type: grammar
        question: Qual é a forma correta? (facil/fácil)
        correctAnswer: fácil
        rationale: "Artigo concorda em gênero e número com o substantivo."
target: 10
