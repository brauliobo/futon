title: Preposições Básicas
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Preposições (a, de, em, para…). Conectam termos da frase."
example: "Pratique preposições básicas. Ex.: Vou ___ escola. → a."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Preposições de Lugar e Tempo
    description: Complete as frases com a preposição adequada.
    exercises:
      - type: grammar
        question: Vou ___ escola. (a/por/em/de)
        correctAnswer: a
        rationale: "Adjetivo qualifica o substantivo (cor, tamanho, estado)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O livro está ___ mesa. (para/com/da/na)
        correctAnswer: na
        rationale: "Numeral indica quantidade (um, dois, primeiro)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Venho ___ casa. (em/por/de/para)
        correctAnswer: de
        rationale: "O verbo concorda com o sujeito em pessoa e número."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Viajo ___ avião. (em/por/para/de)
        correctAnswer: de
        rationale: "O verbo concorda com o sujeito em pessoa e número."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Encontro você ___ 3 horas. (nas/pelas/às/das)
        correctAnswer: às
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Mora ___ Brasil. (ao/do/no/pelo)
        correctAnswer: no
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Caminhamos ___ praia. (para/na/da/pela)
        correctAnswer: pela
        rationale: "Artigo definido especifica; indefinido generaliza (um/uma)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Chego ___ tarde. (de/à/na/pela)
        correctAnswer: à
        rationale: "Preposições essenciais: a, ante, após, até, com, contra, de, desde, em, entre, para, por, sem, sob, sobre."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Saio ___ trabalho. (no/pelo/ao/do)
        correctAnswer: do
        rationale: "Preposição liga palavras estabelecendo relação de sentido."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vamos ___ cinema. (do/pelo/ao/no)
        correctAnswer: ao
        rationale: "'De' indica origem, posse ou matéria (casa de madeira)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
