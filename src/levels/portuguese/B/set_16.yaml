    title: Preposições de Lugar e Tempo
    description: Complete as frases com a preposição adequada.
    exercises:
      - { type: grammar, question: "Vou ___ escola. (a/de/em/por)", correctAnswer: a }
      - { type: grammar, question: "O livro está ___ mesa. (na/da/para/com)", correctAnswer: na }
      - { type: grammar, question: "Venho ___ casa. (de/para/em/por)", correctAnswer: de }
      - { type: grammar, question: "Viajo ___ avião. (de/em/por/para)", correctAnswer: de }
      - { type: grammar, question: "Encontro você ___ 3 horas. (às/das/nas/pelas)", correctAnswer: às }
      - { type: grammar, question: "Mora ___ Brasil. (no/do/ao/pelo)", correctAnswer: no }
      - { type: grammar, question: "Caminhamos ___ praia. (na/da/pela/para)", correctAnswer: pela }
      - { type: grammar, question: "Chego ___ tarde. (de/à/na/pela)", correctAnswer: à }
      - { type: grammar, question: "Saio ___ trabalho. (do/no/ao/pelo)", correctAnswer: do }
      - { type: grammar, question: "Vamos ___ cinema. (ao/do/no/pelo)", correctAnswer: ao }
