title: Preposições Básicas
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Preposições de Lugar e Tempo
    description: Complete as frases com a preposição adequada.
    exercises:
      - type: grammar
        question: Vou ___ escola. (a/de/em/por)
        correctAnswer: a
        rationale: "Adjetivo qualifica o substantivo (cor, tamanho, estado)."
      - type: grammar
        question: O livro está ___ mesa. (na/da/para/com)
        correctAnswer: na
        rationale: "Numeral indica quantidade (um, dois, primeiro)."
      - type: grammar
        question: Venho ___ casa. (de/para/em/por)
        correctAnswer: de
        rationale: "Conjunção 'e' soma; 'mas' contrasta; 'ou' alterna."
      - type: grammar
        question: Viajo ___ avião. (de/em/por/para)
        correctAnswer: de
        rationale: "Aumentativo acrescenta ideia de grande (-ão, -zão)."
      - type: grammar
        question: Encontro você ___ 3 horas. (às/das/nas/pelas)
        correctAnswer: às
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
      - type: grammar
        question: Mora ___ Brasil. (no/do/ao/pelo)
        correctAnswer: no
        rationale: "Sujeito no plural exige verbo no plural."
      - type: grammar
        question: Caminhamos ___ praia. (na/da/pela/para)
        correctAnswer: pela
        rationale: "Artigo definido especifica; indefinido generaliza (um/uma)."
      - type: grammar
        question: Chego ___ tarde. (de/à/na/pela)
        correctAnswer: à
        rationale: "Sujeito no plural exige verbo no plural."
      - type: grammar
        question: Saio ___ trabalho. (do/no/ao/pelo)
        correctAnswer: do
        rationale: "Sujeito no singular exige verbo no singular."
      - type: grammar
        question: Vamos ___ cinema. (ao/do/no/pelo)
        correctAnswer: ao
        rationale: "Diminutivo acrescenta ideia de pequeno (-inho, -zinho)."
target: 10
