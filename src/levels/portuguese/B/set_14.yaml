title: Adjetivos - Concordância
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Concordância com Substantivos
    description: Faça a concordância correta entre adjetivos e substantivos.
    exercises:
      - type: grammar
        question: A casa ___. (bonito/bonita)
        correctAnswer: bonita
        rationale: "Aumentativo acrescenta ideia de grande (-ão, -zão)."
      - type: grammar
        question: O menino ___. (inteligente/inteligentes)
        correctAnswer: inteligente
        rationale: "Conjunção 'e' soma; 'mas' contrasta; 'ou' alterna."
      - type: grammar
        question: As meninas ___. (alta/altas)
        correctAnswer: altas
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
      - type: grammar
        question: Os carros ___. (novo/novos)
        correctAnswer: novos
        rationale: "Antônimo = palavra com sentido oposto."
      - type: grammar
        question: A professora ___. (simpático/simpática)
        correctAnswer: simpática
        rationale: "Plural regular: acrescentar -s ao final."
      - type: grammar
        question: Os livros ___. (interessante/interessantes)
        correctAnswer: interessantes
        rationale: "Preposição liga palavras (de, em, para, com)."
      - type: grammar
        question: As flores ___. (perfumado/perfumadas)
        correctAnswer: perfumadas
        rationale: "Diminutivo acrescenta ideia de pequeno (-inho, -zinho)."
      - type: grammar
        question: O gato ___. (pequeno/pequena)
        correctAnswer: pequeno
        rationale: "Conjunção 'e' soma; 'mas' contrasta; 'ou' alterna."
      - type: grammar
        question: As alunas ___. (estudioso/estudiosas)
        correctAnswer: estudiosas
        rationale: "'O/os' acompanha masculino; 'a/as' acompanha feminino."
      - type: grammar
        question: Os professores ___. (paciente/pacientes)
        correctAnswer: pacientes
        rationale: "Terminadas em -ão formam plural em -ões, -ãos ou -ães."
target: 10
