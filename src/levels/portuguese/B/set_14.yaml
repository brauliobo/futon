title: Adjetivos - Concordância
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Adjetivos — concordância em gênero e número com o substantivo."
example: "Pratique adjetivos - concordância. Ex.: A casa ___. → bonita."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Concordância com Substantivos
    description: Faça a concordância correta entre adjetivos e substantivos.
    exercises:
      - type: grammar
        question: A casa ___. (bonito/bonita)
        correctAnswer: bonita
        rationale: "Sujeito no singular pede verbo no singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O menino ___. (inteligentes/inteligente)
        correctAnswer: inteligente
        rationale: "Sujeito no singular pede verbo no singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "As meninas ___. (alta/altas)"
        correctAnswer: altas
        rationale: "Sujeito no plural exige verbo no plural."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Os carros ___. (novos/novo)
        correctAnswer: novos
        rationale: "Sujeito no plural exige verbo no plural."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: A professora ___. (simpático/simpática)
        correctAnswer: simpática
        rationale: "Adjetivo qualifica ou caracteriza o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Os livros ___. (interessante/interessantes)"
        correctAnswer: interessantes
        rationale: "Adjetivos pátrios indicam origem (brasileiro, paulista)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: As flores ___. (perfumadas/perfumado)
        correctAnswer: perfumadas
        rationale: "Locução adjetiva é expressão com valor de adjetivo (de ouro = áureo)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "O gato ___. (pequena/pequeno)"
        correctAnswer: pequeno
        rationale: "Adjetivo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: As alunas ___. (estudiosas/estudioso)
        correctAnswer: estudiosas
        rationale: "Grau comparativo: mais/menos ... (do) que."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Os professores ___. (paciente/pacientes)"
        correctAnswer: pacientes
        rationale: "Grau superlativo absoluto: muito + adjetivo, ou sufixo -íssimo."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
