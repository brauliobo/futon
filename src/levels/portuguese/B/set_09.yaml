title: Construção de Frases - Pronomes
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Pronomes na construção — evitam repetição do substantivo."
example: "Pratique construção de frases - pronomes. Ex.: Pedro comprou livros. ___ comprou livros. → Ele."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Pronomes
    description: Substitua as palavras sublinhadas pelo pronome correto.
    exercises:
      - type: grammar
        question: Pedro comprou livros. ___ comprou livros. (Ela/Ele/Eles)
        correctAnswer: Ele
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: As meninas brincam. ___ brincam. (Eles/Ela/Elas)
        correctAnswer: Elas
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: A professora explica. ___ explica. (Elas/Ela/Ele)
        correctAnswer: Ela
        rationale: "Observe as opções e escolha a que responde \"A professora explica. ___ explica.\": 'Ela'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Meus pais trabalham. ___ trabalham. (Ele/Ela/Eles)
        correctAnswer: Eles
        rationale: "Pronome pessoal 'Eles' substitui sujeito masculino ('Meus')."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Tu estudas muito. ___ estudas muito. (Ele/Tu/Eu)
        correctAnswer: Tu
        rationale: "Pronome pessoal indica a pessoa do discurso (eu/tu/ele...)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós cantamos juntos. ___ cantamos juntos. (Vós/Eles/Nós)
        correctAnswer: Nós
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vocês chegaram cedo. ___ chegaram cedo. (Eles/Nós/Vocês)
        correctAnswer: Vocês
        rationale: "Pronome substitui ou acompanha o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eu leio histórias. ___ leio histórias. (Tu/Ele/Eu)
        correctAnswer: Eu
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O cachorro late. ___ late. (Ela/Ele/Eles)
        correctAnswer: Ele
        rationale: "Pessoais indicam pessoa do discurso (eu, tu, ele)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: As flores crescem. ___ crescem. (Eles/Ela/Elas)
        correctAnswer: Elas
        rationale: "Possessivos indicam posse (meu, teu, seu, nosso)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
