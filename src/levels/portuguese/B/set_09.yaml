title: Construção de Frases - Pronomes
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Pronomes na construção — evitam repetição do substantivo."
example: "Pratique construção de frases - pronomes. Ex.: Pedro comprou livros. ___ comprou livros. → Ele."
pages:
  - pageNumber: 1
    title: Pronomes
    description: Substitua as palavras sublinhadas pelo pronome correto.
    exercises:
      - type: grammar
        question: Pedro comprou livros. ___ comprou livros. (Ele/Ela/Eles)
        correctAnswer: Ele
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: As meninas brincam. ___ brincam. (Ela/Elas/Eles)
        correctAnswer: Elas
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: A professora explica. ___ explica. (Ele/Ela/Elas)
        correctAnswer: Ela
        rationale: "Observe as opções e escolha a que responde \"A professora explica. ___ explica.\": 'Ela'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Meus pais trabalham. ___ trabalham. (Ele/Ela/Eles)
        correctAnswer: Eles
        rationale: "Pronome pessoal 'Eles' substitui sujeito masculino ('Meus')."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Tu estudas muito. ___ estudas muito. (Eu/Tu/Ele)
        correctAnswer: Tu
        rationale: "Pronome pessoal indica a pessoa do discurso (eu/tu/ele...)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós cantamos juntos. ___ cantamos juntos. (Nós/Vós/Eles)
        correctAnswer: Nós
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vocês chegaram cedo. ___ chegaram cedo. (Nós/Vocês/Eles)
        correctAnswer: Vocês
        rationale: "Pronome substitui ou acompanha o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eu leio histórias. ___ leio histórias. (Eu/Tu/Ele)
        correctAnswer: Eu
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O cachorro late. ___ late. (Ele/Ela/Eles)
        correctAnswer: Ele
        rationale: "Pessoais indicam pessoa do discurso (eu, tu, ele)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: As flores crescem. ___ crescem. (Ela/Elas/Eles)
        correctAnswer: Elas
        rationale: "Possessivos indicam posse (meu, teu, seu, nosso)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
