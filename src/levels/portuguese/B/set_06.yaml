      - { type: grammar, question: "'O livro está na mesa.' é uma frase (declarativa/interrogativa/exclamativa)", correctAnswer: declarativa }
      - { type: grammar, question: "'Feche a porta, por favor.' é uma frase (imperativa/interrogativa/exclamativa)", correctAnswer: imperativa }
      - { type: grammar, question: "'Onde você mora?' é uma frase (declarativa/interrogativa/exclamativa)", correctAnswer: interrogativa }
      - { type: grammar, question: "'Cuidado com o degrau!' é uma frase (imperativa/interrogativa/exclamativa)", correctAnswer: exclamativa }
      - { type: grammar, question: "'As flores estão bonitas.' é uma frase (declarativa/interrogativa/imperativa)", correctAnswer: declarativa }
      - { type: grammar, question: "'Não corra na escada.' é uma frase (imperativa/interrogativa/exclamativa)", correctAnswer: imperativa }
      - { type: grammar, question: "'Como você se chama?' é uma frase (declarativa/interrogativa/exclamativa)", correctAnswer: interrogativa }
