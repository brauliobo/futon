title: Construção de Frases - Adjuntos Adverbiais
level: B
subject: portuguese
pages:
  - pageNumber: 1
    title: Adjuntos Adverbiais
    description: Complete as frases com adjuntos adverbiais de tempo, lugar ou modo.
    exercises:
      - { type: grammar, question: ""As crianças brincam ___. (no parque/felizes)"", correctAnswer: no parque }
      - { type: grammar, question: ""Estudamos ___ para a prova. (ontem/concentrados)"", correctAnswer: ontem }
      - { type: grammar, question: ""Ela fala ___. (educadamente/português)"", correctAnswer: educadamente }
      - { type: grammar, question: ""O gato dorme ___. (na cama/profundamente)"", correctAnswer: na cama }
      - { type: grammar, question: ""Chegamos ___ à festa. (cedo/animados)"", correctAnswer: cedo }
      - { type: grammar, question: ""Os passarinhos cantam ___. (alegremente/música)"", correctAnswer: alegremente }
      - { type: grammar, question: ""Minha avó mora ___. (na fazenda/sozinha)"", correctAnswer: na fazenda }
      - { type: grammar, question: ""Vamos viajar ___. (amanhã/de carro)"", correctAnswer: amanhã }
      - { type: grammar, question: ""O menino corre ___. (rapidamente/na pista)"", correctAnswer: rapidamente }
      - { type: grammar, question: ""A família janta ___. (às sete horas/junta)"", correctAnswer: às sete horas }
target: 10
