title: Construção de Frases - Complementos
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Complementos verbais (OD, OI). Verbos transitivos exigem complemento."
example: "Pratique construção de frases - complementos. Ex.: Ela deu ___ para o irmão. → o livro."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Complementos do Verbo
    description: Complete as frases com o complemento adequado.
    exercises:
      - type: grammar
        question: João comprou ___. (uma bicicleta/ontem)
        correctAnswer: uma bicicleta
        rationale: "O verbo concorda com o sujeito em pessoa e número."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Maria precisa ___. (de ajuda/rapidamente)
        correctAnswer: de ajuda
        rationale: "Substantivo nomeia seres, coisas ou ideias."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: As crianças gostam ___. (de brincar/sempre)
        correctAnswer: de brincar
        rationale: "'Gostar' pede complemento com 'de' + ação/objeto; 'sempre' seria advérbio de tempo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O professor ensina ___. (matemática/cuidadosamente)
        correctAnswer: matemática
        rationale: "Objeto direto completa verbo transitivo direto (sem preposição)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós assistimos ___. (na sala/ao filme)
        correctAnswer: ao filme
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ela deu ___ para o irmão. (gentilmente/o livro)
        correctAnswer: o livro
        rationale: "Objeto indireto completa verbo transitivo indireto (com preposição)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Os alunos fizeram ___. (silenciosamente/os exercícios)
        correctAnswer: os exercícios
        rationale: "Complemento nominal completa sentido de nome, com preposição."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Papai conta ___ antes de dormir. (histórias/sempre)
        correctAnswer: histórias
        rationale: "Para achar o objeto direto, pergunte 'o quê?' ou 'quem?' ao verbo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: A menina desenhou ___. (ontem/uma flor)
        correctAnswer: uma flor
        rationale: "Para achar o objeto indireto, pergunte 'a quem?' ou 'de quê?' ao verbo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vocês trouxeram ___ da escola. (hoje/os cadernos)
        correctAnswer: os cadernos
        rationale: "Preposição liga palavras (de, em, para, com)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
