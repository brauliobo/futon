title: Construção de Frases - Complementos
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Complementos verbais (OD, OI). Verbos transitivos exigem complemento."
pages:
  - pageNumber: 1
    title: Complementos do Verbo
    description: Complete as frases com o complemento adequado.
    exercises:
      - type: grammar
        question: João comprou ___. (uma bicicleta/ontem)
        correctAnswer: uma bicicleta
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Maria precisa ___. (de ajuda/rapidamente)
        correctAnswer: de ajuda
        rationale: "Substantivo nomeia seres, coisas ou ideias."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: As crianças gostam ___. (de brincar/sempre)
        correctAnswer: de brincar
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O professor ensina ___. (matemática/cuidadosamente)
        correctAnswer: matemática
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós assistimos ___. (ao filme/na sala)
        correctAnswer: ao filme
        rationale: "A regência verbal define qual preposição acompanha o verbo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ela deu ___ para o irmão. (o livro/gentilmente)
        correctAnswer: o livro
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Os alunos fizeram ___. (os exercícios/silenciosamente)
        correctAnswer: os exercícios
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Papai conta ___ antes de dormir. (histórias/sempre)
        correctAnswer: histórias
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: A menina desenhou ___. (uma flor/ontem)
        correctAnswer: uma flor
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vocês trouxeram ___ da escola. (os cadernos/hoje)
        correctAnswer: os cadernos
        rationale: "Preposição liga palavras (de, em, para, com)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
