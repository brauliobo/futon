title: Construção de Frases - Pontuação
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Pontuação
    description: Escolha a pontuação correta para cada frase.
    exercises:
      - type: grammar
        question: "'Que bela manhã___' (./!/?))"
        correctAnswer: "!"
        rationale: "Palavra-chave da frase define o sentido esperado."
      - type: grammar
        question: "'Você vai à festa___' (./?/!))"
        correctAnswer: "?"
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
      - type: grammar
        question: "'O menino brinca no jardim___' (./?/!))"
        correctAnswer: .
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: "'Maria___ você pode me ajudar?' (,/./?)"
        correctAnswer: ","
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: "'Socorro___ me ajudem!' (!/?/.)"
        correctAnswer: "!"
        rationale: "Pronome pessoal indica a pessoa do discurso (eu/tu/ele...)."
      - type: grammar
        question: "'Hoje é segunda-feira___' (./?/!))"
        correctAnswer: .
        rationale: "Verbo indica ação, estado ou fenômeno."
      - type: grammar
        question: "'Onde você colocou as chaves___' (./?/!))"
        correctAnswer: "?"
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: "'João___ Pedro e Ana foram passear.' (,/./;)"
        correctAnswer: ","
        rationale: "Substantivo nomeia seres, coisas ou ideias."
      - type: grammar
        question: "'Que alegria te encontrar___' (!/?/.)"
        correctAnswer: "!"
        rationale: "Sujeito no singular exige verbo no singular."
      - type: grammar
        question: "'A aula termina às cinco horas___' (./?/!))"
        correctAnswer: .
        rationale: "Verbo indica ação, estado ou fenômeno."
target: 10
