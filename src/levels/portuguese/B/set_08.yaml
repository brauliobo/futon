title: Construção de Frases - Pontuação
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Pontuação na frase. Vírgula separa termos e orações; ponto encerra."
example: "Pratique construção de frases - pontuação."
pages:
  - pageNumber: 1
    title: Pontuação
    description: Escolha a pontuação correta para cada frase.
    exercises:
      - type: grammar
        question: "'Que bela manhã___' (./!/?))"
        correctAnswer: "!"
        rationale: "Analise a frase e aplique a regra de concordância correta."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Você vai à festa___' (./?/!))"
        correctAnswer: "?"
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'O menino brinca no jardim___' (./?/!))"
        correctAnswer: .
        rationale: "Analise a frase e aplique a regra de concordância correta."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Maria___ você pode me ajudar?' (,/./?)"
        correctAnswer: ","
        rationale: "Ponto final encerra frase declarativa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Socorro___ me ajudem!' (!/?/.)"
        correctAnswer: "!"
        rationale: "Expressão de emoção pede ponto de exclamação (!)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Hoje é segunda-feira___' (./?/!))"
        correctAnswer: .
        rationale: "Vírgula separa termos de mesma função sintática."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Onde você colocou as chaves___' (./?/!))"
        correctAnswer: "?"
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'João___ Pedro e Ana foram passear.' (,/./;)"
        correctAnswer: ","
        rationale: "Ponto e vírgula separa orações com certa autonomia."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Que alegria te encontrar___' (!/?/.)"
        correctAnswer: "!"
        rationale: "Dois-pontos introduzem enumeração, fala ou explicação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'A aula termina às cinco horas___' (./?/!))"
        correctAnswer: .
        rationale: "Interrogação marca pergunta direta."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
