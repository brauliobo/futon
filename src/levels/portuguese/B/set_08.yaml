title: Construção de Frases - Pontuação
level: B
subject: portuguese
pages:
  - pageNumber: 1
    title: Pontuação
    description: Escolha a pontuação correta para cada frase.
    exercises:
      - { type: grammar, question: ""'Que bela manhã___' (./!/?))"", correctAnswer: "!" }
      - { type: grammar, question: ""'Você vai à festa___' (./?/!))"", correctAnswer: "?" }
      - { type: grammar, question: ""'O menino brinca no jardim___' (./?/!))"", correctAnswer: "." }
      - { type: grammar, question: ""'Maria___ você pode me ajudar?' (,/./?)"", correctAnswer: "," }
      - { type: grammar, question: ""'Socorro___ me ajudem!' (!/?/.)"", correctAnswer: "!" }
      - { type: grammar, question: ""'Hoje é segunda-feira___' (./?/!))"", correctAnswer: "." }
      - { type: grammar, question: ""'Onde você colocou as chaves___' (./?/!))"", correctAnswer: "?" }
      - { type: grammar, question: ""'João___ Pedro e Ana foram passear.' (,/./;)"", correctAnswer: "," }
      - { type: grammar, question: ""'Que alegria te encontrar___' (!/?/.)"", correctAnswer: "!" }
      - { type: grammar, question: ""'A aula termina às cinco horas___' (./?/!))"", correctAnswer: "." }
target: 10
