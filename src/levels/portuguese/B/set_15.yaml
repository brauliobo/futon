title: Pronomes Pessoais
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Pronomes pessoais (eu, tu, ele…). Concordância com o verbo."
example: "Pratique pronomes pessoais."
pages:
  - pageNumber: 1
    title: Pronomes do Caso Reto
    description: Complete as frases com o pronome correto.
    exercises:
      - type: grammar
        question: ___ gosto de ler. (Eu/Tu/Ele)
        correctAnswer: Eu
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ és muito inteligente. (Eu/Tu/Nós)
        correctAnswer: Tu
        rationale: "Pronome 'tu' (2ª pessoa do singular) concorda com o verbo na mesma pessoa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ brinca no jardim. (Ela/Eles/Nós)
        correctAnswer: Ela
        rationale: "Pronome 'ela' (3ª pessoa do singular) concorda com o verbo na mesma pessoa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ estudamos juntos. (Eu/Eles/Nós)
        correctAnswer: Nós
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ cantais muito bem. (Vós/Eles/Tu)
        correctAnswer: Vós
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ correm no parque. (Ele/Eles/Nós)
        correctAnswer: Eles
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ trabalha muito. (Eu/Você/Nós)
        correctAnswer: Você
        rationale: "Pronomes retos funcionam como sujeito (eu, tu, ele, nós, vós, eles)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ sou professor. (Eu/Tu/Ele)
        correctAnswer: Eu
        rationale: "Pronomes oblíquos funcionam como complemento (me, te, o, a, nos, vos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ são amigas. (Ela/Elas/Nós)
        correctAnswer: Elas
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ falamos português. (Eu/Eles/Nós)
        correctAnswer: Nós
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
