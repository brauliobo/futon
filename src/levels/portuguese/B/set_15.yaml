title: Pronomes Pessoais
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Pronomes do Caso Reto
    description: Complete as frases com o pronome correto.
    exercises:
      - type: grammar
        question: ___ gosto de ler. (Eu/Tu/Ele)
        correctAnswer: Eu
        rationale: "Artigo concorda em gênero e número com o substantivo."
      - type: grammar
        question: ___ és muito inteligente. (Eu/Tu/Nós)
        correctAnswer: Tu
        rationale: "'Nós' pede verbo em 1a pessoa do plural (-mos)."
      - type: grammar
        question: ___ brinca no jardim. (Ela/Eles/Nós)
        correctAnswer: Ela
        rationale: "'Nós' pede verbo em 1a pessoa do plural (-mos)."
      - type: grammar
        question: ___ estudamos juntos. (Eu/Eles/Nós)
        correctAnswer: Nós
        rationale: "Artigo concorda em gênero e número com o substantivo."
      - type: grammar
        question: ___ cantais muito bem. (Vós/Eles/Tu)
        correctAnswer: Vós
        rationale: "Artigo concorda em gênero e número com o substantivo."
      - type: grammar
        question: ___ correm no parque. (Ele/Eles/Nós)
        correctAnswer: Eles
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
      - type: grammar
        question: ___ trabalha muito. (Eu/Você/Nós)
        correctAnswer: Você
        rationale: "'Nós' pede verbo em 1a pessoa do plural (-mos)."
      - type: grammar
        question: ___ sou professor. (Eu/Tu/Ele)
        correctAnswer: Eu
        rationale: "Verbo indica ação, estado ou fenômeno."
      - type: grammar
        question: ___ são amigas. (Ela/Elas/Nós)
        correctAnswer: Elas
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
      - type: grammar
        question: ___ falamos português. (Eu/Eles/Nós)
        correctAnswer: Nós
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
target: 10
