title: Pronomes Pessoais
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Pronomes pessoais (eu, tu, ele…). Concordância com o verbo."
example: "Pratique pronomes pessoais. Ex.: ___ gosto de ler. → Eu."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Pronomes do Caso Reto
    description: Complete as frases com o pronome correto.
    exercises:
      - type: grammar
        question: ___ gosto de ler. (Ele/Eu/Tu)
        correctAnswer: Eu
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ és muito inteligente. (Tu/Nós/Eu)
        correctAnswer: Tu
        rationale: "Pronome 'tu' (2ª pessoa do singular) concorda com o verbo na mesma pessoa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ brinca no jardim. (Ela/Eles/Nós)
        correctAnswer: Ela
        rationale: "Pronome 'ela' (3ª pessoa do singular) concorda com o verbo na mesma pessoa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ estudamos juntos. (Eles/Eu/Nós)
        correctAnswer: Nós
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ cantais muito bem. (Tu/Vós/Eles)
        correctAnswer: Vós
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ correm no parque. (Nós/Eles/Ele)
        correctAnswer: Eles
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ trabalha muito. (Você/Nós/Eu)
        correctAnswer: Você
        rationale: "Pronomes retos funcionam como sujeito (eu, tu, ele, nós, vós, eles)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ sou professor. (Tu/Eu/Ele)
        correctAnswer: Eu
        rationale: "Pronomes oblíquos funcionam como complemento (me, te, o, a, nos, vos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ são amigas. (Ela/Nós/Elas)
        correctAnswer: Elas
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ falamos português. (Eles/Eu/Nós)
        correctAnswer: Nós
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
