title: Construção de Frases - Concordância Verbal
level: B
subject: portuguese
pages:
  - pageNumber: 1
    title: Concordância Verbal
    description: Escolha a forma verbal correta para cada frase.
    exercises:
      - type: grammar
        question: "O pássaro ___ no céu. (voa/voam)"
        correctAnswer: voa
      - type: grammar
        question: "Os estudantes ___ na biblioteca. (estuda/estudam)"
        correctAnswer: estudam
      - type: grammar
        question: "A menina ___ muito bem. (desenha/desenham)"
        correctAnswer: desenha
      - type: grammar
        question: "Nós ___ pizza no jantar. (come/comemos)"
        correctAnswer: comemos
      - type: grammar
        question: "Vocês ___ cedo amanhã. (acorda/acordam)"
        correctAnswer: acordam
      - type: grammar
        question: "Tu ___ um bom aluno. (é/és)"
        correctAnswer: és
      - type: grammar
        question: "As plantas ___ água para crescer. (precisa/precisam)"
        correctAnswer: precisam
      - type: grammar
        question: "O time ___ muito bem hoje. (jogou/jogaram)"
        correctAnswer: jogou
      - type: grammar
        question: "Minhas irmãs ___ música clássica. (gosta/gostam)"
        correctAnswer: gostam
      - type: grammar
        question: "A professora ___ exercícios novos. (trouxe/trouxeram)"
        correctAnswer: trouxe
target: 10
