title: Pronomes - Pessoais, Possessivos e Demonstrativos
level: B
subject: portuguese
example: "Identifique e use pronomes corretamente."
pages:
  - pageNumber: 1
    title: Pronomes Pessoais
    description: Identifique o pronome correto.
    exercises:
      - { type: grammar, question: "___ sou brasileiro. (Eu/Tu/Ele)", correctAnswer: "Eu" }
      - { type: grammar, question: "___ és feliz. (Eu/Tu/Ela)", correctAnswer: "Tu" }
      - { type: grammar, question: "___ é meu amigo. (Eu/Tu/Ele)", correctAnswer: "Ele" }
      - { type: grammar, question: "___ é minha irmã. (Eu/Ela/Eles)", correctAnswer: "Ela" }
      - { type: grammar, question: "___ somos alunos. (Eu/Nós/Eles)", correctAnswer: "Nós" }
      - { type: grammar, question: "___ são professores. (Eu/Ela/Eles)", correctAnswer: "Eles" }
      - { type: grammar, question: "Pronome da 1ª pessoa singular: (eu/tu/ele)", correctAnswer: "eu" }
      - { type: grammar, question: "Pronome da 3ª pessoa plural: (nós/eles/eu)", correctAnswer: "eles" }
      - { type: grammar, question: "'Nós' é de qual pessoa? (1ª/2ª/3ª)", correctAnswer: "1ª" }
      - { type: grammar, question: "'Vós' é de qual pessoa? (1ª/2ª/3ª)", correctAnswer: "2ª" }
  - pageNumber: 2
    title: Pronomes Possessivos
    description: Indique posse.
    exercises:
      - { type: grammar, question: "Livro de mim = ___ livro. (meu/teu/seu)", correctAnswer: "meu" }
      - { type: grammar, question: "Casa de você = ___ casa. (minha/tua/sua)", correctAnswer: "sua" }
      - { type: grammar, question: "Bola de nós = ___ bola. (minha/nossa/vossa)", correctAnswer: "nossa" }
      - { type: grammar, question: "Carro de eles = carro ___. (meu/deles/dela)", correctAnswer: "deles" }
      - { type: grammar, question: "Caneta de ela = caneta ___. (dela/dele/dessa)", correctAnswer: "dela" }
      - { type: grammar, question: "'Meu' indica posse de: (eu/tu/ele)", correctAnswer: "eu" }
      - { type: grammar, question: "'Seu' pode indicar posse de: (eu/você/ela)", correctAnswer: "você" }
      - { type: grammar, question: "'Nossa' é feminino ou masculino? (feminino/masculino)", correctAnswer: "feminino" }
      - { type: grammar, question: "'Nosso' é singular ou plural? (singular/plural)", correctAnswer: "singular" }
      - { type: grammar, question: "Posse de nós, plural feminino: (nosso/nossa/nossas)", correctAnswer: "nossas" }
  - pageNumber: 3
    title: Pronomes Demonstrativos
    description: Identifique o pronome certo (perto/meio/longe).
    exercises:
      - { type: grammar, question: "Perto de mim: (este/esse/aquele)", correctAnswer: "este" }
      - { type: grammar, question: "Perto de você: (este/esse/aquele)", correctAnswer: "esse" }
      - { type: grammar, question: "Longe de ambos: (este/esse/aquele)", correctAnswer: "aquele" }
      - { type: grammar, question: "'Este' é (próximo/distante)", correctAnswer: "próximo" }
      - { type: grammar, question: "'Aquele' é (próximo/distante)", correctAnswer: "distante" }
      - { type: grammar, question: "Feminino de 'este': (esta/esse/aquela)", correctAnswer: "esta" }
      - { type: grammar, question: "Feminino de 'aquele': (aquela/aquele/essa)", correctAnswer: "aquela" }
      - { type: grammar, question: "Plural de 'este': (estes/esses/aqueles)", correctAnswer: "estes" }
      - { type: grammar, question: "Plural de 'essa': (essas/aquelas/estas)", correctAnswer: "essas" }
      - { type: grammar, question: "'Este livro aqui' — está: (perto/longe)", correctAnswer: "perto" }
target: 30
