title: Pronomes - Pessoais, Possessivos e Demonstrativos
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Pronomes pessoais, possessivos e demonstrativos. Função: substituir ou acompanhar substantivo."
example: Identifique e use pronomes corretamente.
pages:
  - pageNumber: 1
    title: Pronomes Pessoais
    description: Identifique o pronome correto.
    exercises:
      - type: grammar
        question: ___ sou brasileiro. (Eu/Tu/Ele)
        correctAnswer: Eu
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ és feliz. (Eu/Tu/Ela)
        correctAnswer: Tu
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ é meu amigo. (Eu/Tu/Ele)
        correctAnswer: Ele
        rationale: "Artigo concorda em gênero e número com o substantivo."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ é minha irmã. (Eu/Ela/Eles)
        correctAnswer: Ela
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ somos alunos. (Eu/Nós/Eles)
        correctAnswer: Nós
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ são professores. (Eu/Ela/Eles)
        correctAnswer: Eles
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Pronome da 1ª pessoa singular: (eu/tu/ele)"
        correctAnswer: eu
        rationale: "Singular indica um único ser; plural, mais de um."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Pronome da 3ª pessoa plural: (nós/eles/eu)"
        correctAnswer: eles
        rationale: "No plural, geralmente acrescenta-se -s à palavra."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Nós' é de qual pessoa? (1ª/2ª/3ª)"
        correctAnswer: 1ª
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Vós' é de qual pessoa? (1ª/2ª/3ª)"
        correctAnswer: 2ª
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 1
        objectives: [pt.sentence_building]
  - pageNumber: 2
    title: Pronomes Possessivos
    description: Indique posse.
    exercises:
      - type: grammar
        question: Livro de mim = ___ livro. (meu/teu/seu)
        correctAnswer: meu
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Casa de você = ___ casa. (minha/tua/sua)
        correctAnswer: sua
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Bola de nós = ___ bola. (minha/nossa/vossa)
        correctAnswer: nossa
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Carro de eles = carro ___. (meu/deles/dela)
        correctAnswer: deles
        rationale: "Com 'eles/elas' o verbo vai na 3ª pessoa do plural."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Caneta de ela = caneta ___. (dela/dele/dessa)
        correctAnswer: dela
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Meu' indica posse de: (eu/tu/ele)"
        correctAnswer: eu
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Seu' pode indicar posse de: (eu/você/ela)"
        correctAnswer: você
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Nossa' é feminino ou masculino? (feminino/masculino)"
        correctAnswer: feminino
        rationale: "Feminino muitas vezes termina em -a; masculino em -o."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Nosso' é singular ou plural? (singular/plural)"
        correctAnswer: singular
        rationale: "No plural, geralmente acrescenta-se -s à palavra."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Posse de nós, plural feminino: (nosso/nossa/nossas)"
        correctAnswer: nossas
        rationale: "No plural, geralmente acrescenta-se -s à palavra."
        difficulty: 2
        objectives: [pt.sentence_building]
  - pageNumber: 3
    title: Pronomes Demonstrativos
    description: Identifique o pronome certo (perto/meio/longe).
    exercises:
      - type: grammar
        question: "Perto de mim: (este/esse/aquele)"
        correctAnswer: este
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Perto de você: (este/esse/aquele)"
        correctAnswer: esse
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Longe de ambos: (este/esse/aquele)"
        correctAnswer: aquele
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Este' é (próximo/distante)"
        correctAnswer: próximo
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Aquele' é (próximo/distante)"
        correctAnswer: distante
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Feminino de 'este': (esta/esse/aquela)"
        correctAnswer: esta
        rationale: "Feminino muitas vezes termina em -a; masculino em -o."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Feminino de 'aquele': (aquela/aquele/essa)"
        correctAnswer: aquela
        rationale: "Feminino muitas vezes termina em -a; masculino em -o."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Plural de 'este': (estes/esses/aqueles)"
        correctAnswer: estes
        rationale: "No plural, geralmente acrescenta-se -s à palavra."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "Plural de 'essa': (essas/aquelas/estas)"
        correctAnswer: essas
        rationale: "No plural, geralmente acrescenta-se -s à palavra."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'Este livro aqui' — está: (perto/longe)"
        correctAnswer: perto
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 3
        objectives: [pt.sentence_building]
target: 30
