title: 🔗 Construção de Frases - Conectivos
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Conectivos (e, mas, porque, embora). Estabelecem relação entre ideias."
example: "Pratique construção de frases - conectivos. Ex.: O filme era bom, ___ muito longo. → mas."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Conectivos
    description: Complete as frases com o conectivo adequado.
    exercises:
      - type: grammar
        question: Estudei muito ___ passei na prova. (mas/e/ou)
        correctAnswer: e
        rationale: "'E' conecta ideias que se somam (estudar + passar são causa e efeito positivo)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Queria sair, ___ estava chovendo. (mas/porque/e)
        correctAnswer: mas
        rationale: "'Mas' indica oposição entre ideias (queria sair vs. impedimento da chuva)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Não fui à escola ___ estava doente. (mas/porque/e)
        correctAnswer: porque
        rationale: "'Porque' indica causa — explica por que não foi à escola."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Você prefere café ___ chá? (ou/mas/e)
        correctAnswer: ou
        rationale: "'Ou' indica alternativa/escolha entre duas opções (café ou chá)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ela é inteligente ___ estudiosa. (ou/mas/e)
        correctAnswer: e
        rationale: "'E' soma características compatíveis (ambas qualidades positivas)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O filme era bom, ___ muito longo. (porque/mas/e)
        correctAnswer: mas
        rationale: "'Mas' indica oposição — 'bom' e 'muito longo' contrastam (qualidade vs. defeito)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ficamos em casa ___ fazia frio. (e/porque/mas)
        correctAnswer: porque
        rationale: "'Porque' indica causa — o frio é a razão para ficar em casa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Podemos ir ao parque ___ ao cinema. (mas/ou/e)
        correctAnswer: ou
        rationale: "'Ou' indica alternativa entre dois lugares (parque OU cinema, não ambos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Correu muito ___ chegou na hora. (mas/e/porque)
        correctAnswer: e
        rationale: "'E' soma ações sequenciais (correu; depois chegou — consequência positiva)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Tentei ligar, ___ ninguém atendeu. (mas/e/porque)
        correctAnswer: mas
        rationale: "'Mas' indica oposição — tentou ligar, porém não teve sucesso."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
