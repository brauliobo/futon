title: Construção de Frases - Conectivos
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Conectivos
    description: Complete as frases com o conectivo adequado.
    exercises:
      - type: grammar
        question: Estudei muito ___ passei na prova. (e/mas/ou)
        correctAnswer: e
        rationale: "Sujeito no plural exige verbo no plural."
      - type: grammar
        question: Queria sair, ___ estava chovendo. (e/mas/porque)
        correctAnswer: mas
        rationale: "Adjetivo qualifica o substantivo (cor, tamanho, estado)."
      - type: grammar
        question: Não fui à escola ___ estava doente. (e/mas/porque)
        correctAnswer: porque
        rationale: "Pronome pessoal indica a pessoa do discurso (eu/tu/ele...)."
      - type: grammar
        question: Você prefere café ___ chá? (e/mas/ou)
        correctAnswer: ou
        rationale: "Substantivo nomeia seres, coisas ou ideias."
      - type: grammar
        question: Ela é inteligente ___ estudiosa. (e/mas/ou)
        correctAnswer: e
        rationale: "Artigo definido especifica; indefinido generaliza (um/uma)."
      - type: grammar
        question: O filme era bom, ___ muito longo. (e/mas/porque)
        correctAnswer: mas
        rationale: "Sujeito no singular exige verbo no singular."
      - type: grammar
        question: Ficamos em casa ___ fazia frio. (e/mas/porque)
        correctAnswer: porque
        rationale: "'Nós' pede verbo em 1a pessoa do plural (-mos)."
      - type: grammar
        question: Podemos ir ao parque ___ ao cinema. (e/mas/ou)
        correctAnswer: ou
        rationale: "Substantivo nomeia seres, coisas ou ideias."
      - type: grammar
        question: Correu muito ___ chegou na hora. (e/mas/porque)
        correctAnswer: e
        rationale: "Artigo definido especifica; indefinido generaliza (um/uma)."
      - type: grammar
        question: Tentei ligar, ___ ninguém atendeu. (e/mas/porque)
        correctAnswer: mas
        rationale: "Plural regular: acrescentar -s ao final."
target: 10
