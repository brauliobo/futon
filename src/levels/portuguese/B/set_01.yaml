title: Construção de Frases - Sujeito e Predicado
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
example: Complete com o verbo correto (sujeito e predicado).
pages:
  - pageNumber: 1
    title: Concordância Singular/Plural
    description: Complete com o verbo na forma correta.
    exercises:
      - type: grammar
        question: O menino ___ no parque. (brinca/brincam)
        correctAnswer: brinca
        rationale: "Sujeito no singular pede verbo no singular."
      - type: grammar
        question: As crianças ___ felizes. (está/estão)
        correctAnswer: estão
        rationale: "Sujeito no plural exige verbo no plural."
      - type: grammar
        question: Maria ___ livros interessantes. (lê/leem)
        correctAnswer: lê
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Os alunos ___ a aula. (acompanha/acompanham)
        correctAnswer: acompanham
        rationale: "Sujeito no plural exige verbo no plural."
      - type: grammar
        question: O gato ___ no sofá. (dorme/dormem)
        correctAnswer: dorme
        rationale: "Sujeito no singular pede verbo no singular."
      - type: grammar
        question: As flores ___ bonitas. (é/são)
        correctAnswer: são
        rationale: "Sujeito no plural exige verbo no plural."
      - type: grammar
        question: O pássaro ___ no céu. (voa/voam)
        correctAnswer: voa
        rationale: "Sujeito no singular pede verbo no singular."
      - type: grammar
        question: Os pais ___ os filhos. (ama/amam)
        correctAnswer: amam
        rationale: "Sujeito no plural exige verbo no plural."
      - type: grammar
        question: A menina ___ uma canção. (canta/cantam)
        correctAnswer: canta
        rationale: "Sujeito no singular pede verbo no singular."
      - type: grammar
        question: Os cães ___ muito alto. (late/latem)
        correctAnswer: latem
        rationale: "Sujeito no plural exige verbo no plural."
  - pageNumber: 2
    title: Concordância de Artigos
    description: Escolha o artigo certo (o/a/os/as).
    exercises:
      - type: grammar
        question: ___ cachorro late muito. (O/Os)
        correctAnswer: O
        rationale: "Artigo concorda em gênero e número com o substantivo."
      - type: grammar
        question: ___ professores explicam bem. (A/Os)
        correctAnswer: Os
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: ___ gatos dormem no sofá. (O/Os)
        correctAnswer: Os
        rationale: "Artigo concorda em gênero e número com o substantivo."
      - type: grammar
        question: ___ flores são bonitas. (A/As)
        correctAnswer: As
        rationale: "O artigo concorda com o substantivo em gênero e número."
      - type: grammar
        question: ___ menina estuda. (O/A)
        correctAnswer: A
        rationale: "O artigo concorda com o substantivo em gênero e número."
      - type: grammar
        question: ___ livros estão na estante. (O/Os)
        correctAnswer: Os
        rationale: "O artigo concorda com o substantivo em gênero e número."
      - type: grammar
        question: ___ mesa é de madeira. (A/As)
        correctAnswer: A
        rationale: "O artigo concorda com o substantivo em gênero e número."
      - type: grammar
        question: ___ meninos brincam. (O/Os)
        correctAnswer: Os
        rationale: "Plural regular: acrescentar -s ao final."
      - type: grammar
        question: ___ bola é vermelha. (O/A)
        correctAnswer: A
        rationale: "O artigo concorda com o substantivo em gênero e número."
      - type: grammar
        question: ___ pássaros cantam. (O/Os)
        correctAnswer: Os
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
  - pageNumber: 3
    title: Pronomes Pessoais
    description: Complete com o verbo certo para cada pronome.
    exercises:
      - type: grammar
        question: Eu ___ para escola. (vou/vai)
        correctAnswer: vou
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
      - type: grammar
        question: Você ___ muito bem. (canta/cantam)
        correctAnswer: canta
        rationale: "Com 'você' o verbo vai na 3ª pessoa do singular."
      - type: grammar
        question: Eles ___ futebol. (joga/jogam)
        correctAnswer: jogam
        rationale: "Com 'eles/elas' o verbo vai na 3ª pessoa do plural."
      - type: grammar
        question: Nós ___ a tarefa. (faço/fazemos)
        correctAnswer: fazemos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
      - type: grammar
        question: Ela ___ uma história. (escreve/escrevem)
        correctAnswer: escreve
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
      - type: grammar
        question: Ele ___ televisão. (assiste/assistem)
        correctAnswer: assiste
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
      - type: grammar
        question: Vocês ___ comigo? (vem/vêm)
        correctAnswer: vêm
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Elas ___ no jardim. (passeia/passeiam)
        correctAnswer: passeiam
        rationale: "Com 'eles/elas' o verbo vai na 3ª pessoa do plural."
      - type: grammar
        question: Eu ___ feliz. (sou/é)
        correctAnswer: sou
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
      - type: grammar
        question: Nós ___ amigos. (somos/são)
        correctAnswer: somos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
  - pageNumber: 4
    title: Ordem da Frase
    description: Organize para formar uma frase correta.
    exercises:
      - type: grammar
        question: "Forma certa: (O menino corre/corre menino o/menino o corre)"
        correctAnswer: O menino corre
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: grammar
        question: "Forma certa: (bola a rola/A bola rola/rola bola a)"
        correctAnswer: A bola rola
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: grammar
        question: "Forma certa: (Ana lê um livro/livro um lê Ana/Ana livro um lê)"
        correctAnswer: Ana lê um livro
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: grammar
        question: "Forma certa: (canta pássaro o/O pássaro canta/canta o pássaro)"
        correctAnswer: O pássaro canta
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: grammar
        question: "Forma certa: (joga bola o menino/O menino joga bola/bola menino o joga)"
        correctAnswer: O menino joga bola
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: grammar
        question: "Forma certa: (As crianças brincam/crianças as brincam/brincam as crianças)"
        correctAnswer: As crianças brincam
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: grammar
        question: "Forma certa: (dorme gato o/gato o dorme/O gato dorme)"
        correctAnswer: O gato dorme
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: grammar
        question: "Forma certa: (está sol o quente/O sol está quente/quente sol o está)"
        correctAnswer: O sol está quente
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: grammar
        question: "Forma certa: (Eu gosto de pizza/pizza gosto eu de/de pizza eu gosto)"
        correctAnswer: Eu gosto de pizza
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
      - type: grammar
        question: "Forma certa: (Nós vamos ao parque/parque ao vamos nós/ao nós parque vamos)"
        correctAnswer: Nós vamos ao parque
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
target: 40
