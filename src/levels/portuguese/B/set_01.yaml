title: Construção de Frases - Sujeito e Predicado
level: B
subject: portuguese
example: "Complete com o verbo correto (sujeito e predicado)."
pages:
  - pageNumber: 1
    title: Concordância Singular/Plural
    description: Complete com o verbo na forma correta.
    exercises:
      - { type: grammar, question: "O menino ___ no parque. (brinca/brincam)", correctAnswer: brinca }
      - { type: grammar, question: "As crianças ___ felizes. (está/estão)", correctAnswer: estão }
      - { type: grammar, question: "Maria ___ livros interessantes. (lê/leem)", correctAnswer: lê }
      - { type: grammar, question: "Os alunos ___ a aula. (acompanha/acompanham)", correctAnswer: acompanham }
      - { type: grammar, question: "O gato ___ no sofá. (dorme/dormem)", correctAnswer: dorme }
      - { type: grammar, question: "As flores ___ bonitas. (é/são)", correctAnswer: são }
      - { type: grammar, question: "O pássaro ___ no céu. (voa/voam)", correctAnswer: voa }
      - { type: grammar, question: "Os pais ___ os filhos. (ama/amam)", correctAnswer: amam }
      - { type: grammar, question: "A menina ___ uma canção. (canta/cantam)", correctAnswer: canta }
      - { type: grammar, question: "Os cães ___ muito alto. (late/latem)", correctAnswer: latem }
  - pageNumber: 2
    title: Concordância de Artigos
    description: Escolha o artigo certo (o/a/os/as).
    exercises:
      - { type: grammar, question: "___ cachorro late muito. (O/Os)", correctAnswer: O }
      - { type: grammar, question: "___ professores explicam bem. (A/Os)", correctAnswer: Os }
      - { type: grammar, question: "___ gatos dormem no sofá. (O/Os)", correctAnswer: Os }
      - { type: grammar, question: "___ flores são bonitas. (A/As)", correctAnswer: As }
      - { type: grammar, question: "___ menina estuda. (O/A)", correctAnswer: A }
      - { type: grammar, question: "___ livros estão na estante. (O/Os)", correctAnswer: Os }
      - { type: grammar, question: "___ mesa é de madeira. (A/As)", correctAnswer: A }
      - { type: grammar, question: "___ meninos brincam. (O/Os)", correctAnswer: Os }
      - { type: grammar, question: "___ bola é vermelha. (O/A)", correctAnswer: A }
      - { type: grammar, question: "___ pássaros cantam. (O/Os)", correctAnswer: Os }
  - pageNumber: 3
    title: Pronomes Pessoais
    description: Complete com o verbo certo para cada pronome.
    exercises:
      - { type: grammar, question: "Eu ___ para escola. (vou/vai)", correctAnswer: vou }
      - { type: grammar, question: "Você ___ muito bem. (canta/cantam)", correctAnswer: canta }
      - { type: grammar, question: "Eles ___ futebol. (joga/jogam)", correctAnswer: jogam }
      - { type: grammar, question: "Nós ___ a tarefa. (faço/fazemos)", correctAnswer: fazemos }
      - { type: grammar, question: "Ela ___ uma história. (escreve/escrevem)", correctAnswer: escreve }
      - { type: grammar, question: "Ele ___ televisão. (assiste/assistem)", correctAnswer: assiste }
      - { type: grammar, question: "Vocês ___ comigo? (vem/vêm)", correctAnswer: vêm }
      - { type: grammar, question: "Elas ___ no jardim. (passeia/passeiam)", correctAnswer: passeiam }
      - { type: grammar, question: "Eu ___ feliz. (sou/é)", correctAnswer: sou }
      - { type: grammar, question: "Nós ___ amigos. (somos/são)", correctAnswer: somos }
  - pageNumber: 4
    title: Ordem da Frase
    description: Organize para formar uma frase correta.
    exercises:
      - { type: grammar, question: "Forma certa: (O menino corre/corre menino o/menino o corre)", correctAnswer: "O menino corre" }
      - { type: grammar, question: "Forma certa: (bola a rola/A bola rola/rola bola a)", correctAnswer: "A bola rola" }
      - { type: grammar, question: "Forma certa: (Ana lê um livro/livro um lê Ana/Ana livro um lê)", correctAnswer: "Ana lê um livro" }
      - { type: grammar, question: "Forma certa: (canta pássaro o/O pássaro canta/canta o pássaro)", correctAnswer: "O pássaro canta" }
      - { type: grammar, question: "Forma certa: (joga bola o menino/O menino joga bola/bola menino o joga)", correctAnswer: "O menino joga bola" }
      - { type: grammar, question: "Forma certa: (As crianças brincam/crianças as brincam/brincam as crianças)", correctAnswer: "As crianças brincam" }
      - { type: grammar, question: "Forma certa: (dorme gato o/gato o dorme/O gato dorme)", correctAnswer: "O gato dorme" }
      - { type: grammar, question: "Forma certa: (está sol o quente/O sol está quente/quente sol o está)", correctAnswer: "O sol está quente" }
      - { type: grammar, question: "Forma certa: (Eu gosto de pizza/pizza gosto eu de/de pizza eu gosto)", correctAnswer: "Eu gosto de pizza" }
      - { type: grammar, question: "Forma certa: (Nós vamos ao parque/parque ao vamos nós/ao nós parque vamos)", correctAnswer: "Nós vamos ao parque" }
target: 40
