title: Construção de Frases - Sujeito e Predicado
level: B
subject: portuguese
pages:
  - pageNumber: 1
    title: Identificando Sujeito e Predicado
    description: Complete as frases identificando o sujeito e predicado.
    exercises:
      - type: grammar
        question: "O menino ___ no parque. (brinca/brincam)"
        correctAnswer: brinca
      - type: grammar
        question: "As crianças ___ felizes. (está/estão)"
        correctAnswer: estão
      - type: grammar
        question: "___ cachorro late muito. (O/Os)"
        correctAnswer: O
      - type: grammar
        question: "Maria ___ livros interessantes. (lê/leem)"
        correctAnswer: lê
      - type: grammar
        question: "___ professores explicam bem. (A/Os)"
        correctAnswer: Os
      - type: grammar
        question: "Eu ___ para escola todos os dias. (vou/vai)"
        correctAnswer: vou
      - type: grammar
        question: "___ gatos dormem no sofá. (O/Os)"
        correctAnswer: Os
      - type: grammar
        question: "Você ___ muito bem. (canta/cantam)"
        correctAnswer: canta
      - type: grammar
        question: "___ flores são bonitas. (A/As)"
        correctAnswer: As
      - type: grammar
        question: "Eles ___ futebol no fim de semana. (joga/jogam)"
        correctAnswer: jogam
target: 10
