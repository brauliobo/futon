title: ✏️ Tempos Verbais - Passado e Futuro
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Passado e futuro. Contraste com presente; terminações regulares."
example: "Pratique tempos verbais - passado e futuro. Ex.: Tu ___ cedo amanhã. → acordarás."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: Pretérito Perfeito e Futuro
    description: Conjugue os verbos no tempo correto.
    exercises:
      - type: grammar
        question: Ontem eu ___ um livro. (ler - passado)
        correctAnswer: li
        rationale: "Tempo verbal situa a ação no tempo (presente, passado ou futuro)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Amanhã nós ___ ao cinema. (ir - futuro)
        correctAnswer: iremos
        rationale: "Tempo verbal situa a ação no tempo (presente, passado ou futuro)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ela ___ a lição ontem. (fazer - passado)
        correctAnswer: fez
        rationale: "Presente indica ação atual ou habitual."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vocês ___ na festa amanhã. (dançar - futuro)
        correctAnswer: dançarão
        rationale: "Pretérito perfeito indica ação concluída no passado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eu ___ português no ano passado. (estudar - passado)
        correctAnswer: estudei
        rationale: "Pretérito imperfeito indica ação contínua/habitual no passado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Tu ___ cedo amanhã. (acordar - futuro)
        correctAnswer: acordarás
        rationale: "Pretérito mais-que-perfeito: ação anterior a outra do passado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eles ___ futebol ontem. (jogar - passado)
        correctAnswer: jogaram
        rationale: "Futuro do presente indica ação posterior ao momento da fala."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós ___ uma viagem no próximo mês. (fazer - futuro)
        correctAnswer: faremos
        rationale: "Futuro do pretérito indica ação hipotética ou posterior ao passado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Você ___ bem na prova passada. (sair - passado)
        correctAnswer: saiu
        rationale: "Modo indicativo expressa fato real."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Elas ___ presentes amanhã. (comprar - futuro)
        correctAnswer: comprarão
        rationale: "Modo subjuntivo expressa hipótese, desejo ou dúvida."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
