title: Tempos Verbais - Passado e Futuro
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Pretérito Perfeito e Futuro
    description: Conjugue os verbos no tempo correto.
    exercises:
      - type: grammar
        question: Ontem eu ___ um livro. (ler - passado)
        correctAnswer: li
        rationale: "Palavra-chave da frase define o sentido esperado."
      - type: grammar
        question: Amanhã nós ___ ao cinema. (ir - futuro)
        correctAnswer: iremos
        rationale: "'Nós' pede verbo em 1a pessoa do plural (-mos)."
      - type: grammar
        question: Ela ___ a lição ontem. (fazer - passado)
        correctAnswer: fez
        rationale: "Terminadas em -ão formam plural em -ões, -ãos ou -ães."
      - type: grammar
        question: Vocês ___ na festa amanhã. (dançar - futuro)
        correctAnswer: dançarão
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: Eu ___ português no ano passado. (estudar - passado)
        correctAnswer: estudei
        rationale: "Artigo definido especifica; indefinido generaliza (um/uma)."
      - type: grammar
        question: Tu ___ cedo amanhã. (acordar - futuro)
        correctAnswer: acordarás
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: Eles ___ futebol ontem. (jogar - passado)
        correctAnswer: jogaram
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
      - type: grammar
        question: Nós ___ uma viagem no próximo mês. (fazer - futuro)
        correctAnswer: faremos
        rationale: "'Nós' pede verbo em 1a pessoa do plural (-mos)."
      - type: grammar
        question: Você ___ bem na prova passada. (sair - passado)
        correctAnswer: saiu
        rationale: "'O/os' acompanha masculino; 'a/as' acompanha feminino."
      - type: grammar
        question: Elas ___ presentes amanhã. (comprar - futuro)
        correctAnswer: comprarão
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
target: 10
