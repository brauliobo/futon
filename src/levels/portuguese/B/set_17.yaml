title: Tempos Verbais - Passado e Futuro
level: B
subject: portuguese
pages:
  - pageNumber: 1
    title: Pretérito Perfeito e Futuro
    description: Conjugue os verbos no tempo correto.
    exercises:
      - { type: grammar, question: ""Ontem eu ___ um livro. (ler - passado)"", correctAnswer: li }
      - { type: grammar, question: ""Amanhã nós ___ ao cinema. (ir - futuro)"", correctAnswer: iremos }
      - { type: grammar, question: ""Ela ___ a lição ontem. (fazer - passado)"", correctAnswer: fez }
      - { type: grammar, question: ""Vocês ___ na festa amanhã. (dançar - futuro)"", correctAnswer: dançarão }
      - { type: grammar, question: ""Eu ___ português no ano passado. (estudar - passado)"", correctAnswer: estudei }
      - { type: grammar, question: ""Tu ___ cedo amanhã. (acordar - futuro)"", correctAnswer: acordarás }
      - { type: grammar, question: ""Eles ___ futebol ontem. (jogar - passado)"", correctAnswer: jogaram }
      - { type: grammar, question: ""Nós ___ uma viagem no próximo mês. (fazer - futuro)"", correctAnswer: faremos }
      - { type: grammar, question: ""Você ___ bem na prova passada. (sair - passado)"", correctAnswer: saiu }
      - { type: grammar, question: ""Elas ___ presentes amanhã. (comprar - futuro)"", correctAnswer: comprarão }
target: 10
