title: Tipos de Parágrafos - Narrativo
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
example: Construa parágrafos narrativos com sequência temporal.
pages:
  - pageNumber: 1
    title: Sequência Temporal
    description: Organize eventos em ordem cronológica.
    exercises:
      - type: reading
        question: "Ordem dos eventos: A)Plantei B)Reguei C)Cresceu D)Colhi (A-B-C-D/B-A-D-C/A-C-B-D/D-A-B-C)"
        correctAnswer: A-B-C-D
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 2
    title: Marcadores Temporais
    description: Use palavras que indicam tempo.
    exercises:
      - type: reading
        question: "Complete: ___ fui ao parque, depois voltei para casa. (Primeiro/Talvez/Sempre/Nunca)"
        correctAnswer: Primeiro
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 3
    title: Personagens
    description: Apresente quem participa da história.
    exercises:
      - type: reading
        question: Em 'Maria e João foram ao cinema', quem são os personagens? (Maria/João/Maria e João/cinema)
        correctAnswer: Maria e João
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 4
    title: Cenário
    description: Identifique onde acontece a história.
    exercises:
      - type: reading
        question: "Onde acontece: 'Na escola, os alunos estudavam'? (casa/escola/parque/loja)"
        correctAnswer: escola
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 5
    title: Ação Principal
    description: Reconheça o que aconteceu de mais importante.
    exercises:
      - type: reading
        question: "Ação principal em 'Pedro correu, pulou o muro e escapou': (correu/pulou/escapou/todas)"
        correctAnswer: escapou
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 6
    title: Detalhe Descritivo
    description: Adicione informações que enriquecem a narrativa.
    exercises:
      - type: reading
        question: Qual detalhe melhora 'O cão latiu'? (muito alto/ontem/sempre/talvez)
        correctAnswer: muito alto
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 7
    title: Diálogo Simples
    description: Inclua falas dos personagens.
    exercises:
      - type: reading
        question: "Como escrever fala? A)'João disse oi' B)'João: oi' C)'João disse: oi' D)'João oi disse' (A/B/C/D)"
        correctAnswer: C
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 8
    title: Conflito Básico
    description: Identifique o problema na história.
    exercises:
      - type: reading
        question: "O problema em 'Ana perdeu a chave e não conseguia entrar': (perdeu a chave/não entrar/Ana/casa)"
        correctAnswer: perdeu a chave
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 9
    title: Resolução
    description: Reconheça como o problema foi resolvido.
    exercises:
      - type: reading
        question: "A solução para 'tinha fome, então comeu': (tinha fome/comeu/então/nenhuma)"
        correctAnswer: comeu
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 10
    title: Final da História
    description: Conclua a narrativa de forma satisfatória.
    exercises:
      - type: reading
        question: "Melhor final para história sobre viagem: (chegaram em casa/saíram de casa/estavam viajando/vão viajar)"
        correctAnswer: chegaram em casa
        rationale: Reveja o trecho relevante do texto.
target: 10
