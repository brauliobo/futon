title: Construção de Frases - Ordem das Palavras
level: B
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/B.
pages:
  - pageNumber: 1
    title: Ordem das Palavras
    description: Organize as palavras na ordem correta para formar frases.
    exercises:
      - type: grammar
        question: "Organize: 'escola / para / vou / a / eu'"
        correctAnswer: eu vou para a escola
        rationale: "Ordem canônica: sujeito + verbo + complemento."
      - type: grammar
        question: "Organize: 'gato / o / dorme / sofá / no'"
        correctAnswer: o gato dorme no sofá
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: "Organize: 'livro / interessante / um / li / eu'"
        correctAnswer: eu li um livro interessante
        rationale: "Diminutivo acrescenta ideia de pequeno (-inho, -zinho)."
      - type: grammar
        question: "Organize: 'parque / crianças / brincam / as / no'"
        correctAnswer: as crianças brincam no parque
        rationale: "Verbo concorda com o sujeito em número e pessoa."
      - type: grammar
        question: "Organize: 'casa / minha / bonita / é / muito'"
        correctAnswer: minha casa é muito bonita
        rationale: "'Nós' pede verbo em 1a pessoa do plural (-mos)."
      - type: grammar
        question: "Organize: 'amigos / meus / cinema / foram / ao'"
        correctAnswer: meus amigos foram ao cinema
        rationale: "Verbo indica ação, estado ou fenômeno."
      - type: grammar
        question: "Organize: 'flores / jardim / no / crescem / as'"
        correctAnswer: as flores crescem no jardim
        rationale: "Sinônimo = palavra com mesmo sentido."
      - type: grammar
        question: "Organize: 'carro / novo / pai / comprou / meu / um'"
        correctAnswer: meu pai comprou um carro novo
        rationale: "Conjunção 'e' soma; 'mas' contrasta; 'ou' alterna."
      - type: grammar
        question: "Organize: 'prova / estudantes / fizeram / os / a'"
        correctAnswer: os estudantes fizeram a prova
        rationale: "'Eles/elas' pede verbo em 3a pessoa do plural (-m)."
      - type: grammar
        question: "Organize: 'música / ouvimos / bonita / uma / nós'"
        correctAnswer: nós ouvimos uma música bonita
        rationale: "'Nós' pede verbo em 1a pessoa do plural (-mos)."
target: 10
