title: Palavras Simples - Roupas
level: 3A
subject: portuguese
example: Aprenda palavras relacionadas a roupas.
pages:
  - pageNumber: 1
    title: Peças de Roupa
    description: Identifique nomes de roupas.
    exercises:
      - { type: reading, question: "Como se escreve o que vestimos no corpo? (camisa/kamisa/samisa/tamisa)", correctAnswer: "camisa" }
      - { type: reading, question: "Quantas sílabas tem 'calça'? (1/2/3/4)", correctAnswer: "2" }
      - { type: reading, question: "Como se escreve o que usamos nos pés? (sapato/zapato/sapado/zapado)", correctAnswer: "sapato" }
      - { type: reading, question: "Qual é a primeira letra de 'vestido'? (v/b/f/p)", correctAnswer: "v" }
      - { type: reading, question: "Como se escreve o que protege a cabeça do sol? (chapéu/sapéu/xapéu/tapéu)", correctAnswer: "chapéu" }
      - { type: reading, question: "Quantas letras tem 'saia'? (3/4/5/6)", correctAnswer: "4" }
      - { type: reading, question: "Como se escreve o que usamos por baixo dos sapatos? (meia/mia/meio/meya)", correctAnswer: "meia" }
      - { type: reading, question: "Qual é a última sílaba de 'casaco'? (ca/sa/co/ac)", correctAnswer: "co" }
      - { type: reading, question: "Como se escreve o que usamos no pescoço quando faz frio? (cachecol/kashecol/saxecol/taxecol)", correctAnswer: "cachecol" }
      - { type: reading, question: "Quantas vogais tem 'luva'? (1/2/3/4)", correctAnswer: "2" }
target: 10
