title: Palavras Simples - Roupas
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário de roupas. Leitura e associação palavra-imagem."
example: Aprenda palavras relacionadas a roupas.
pages:
  - pageNumber: 1
    title: Peças de Roupa
    description: Identifique nomes de roupas.
    exercises:
      - type: reading
        question: Como se escreve o que vestimos no corpo? (camisa/kamisa/samisa/tamisa)
        correctAnswer: camisa
        rationale: "Resposta: camisa — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'calça'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'calça' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos nos pés? (sapato/zapato/sapado/zapado)
        correctAnswer: sapato
        rationale: "Resposta: sapato — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'vestido'? (v/b/f/p)
        correctAnswer: v
        rationale: "Resposta: v — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que protege a cabeça do sol? (chapéu/sapéu/xapéu/tapéu)
        correctAnswer: chapéu
        rationale: "Resposta: chapéu — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'saia'? (3/4/5/6)
        correctAnswer: "4"
        rationale: "'saia' tem 4 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos por baixo dos sapatos? (meia/mia/meio/meya)
        correctAnswer: meia
        rationale: "Resposta: meia — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'casaco'? (ca/sa/co/ac)
        correctAnswer: co
        rationale: "Resposta: co — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos no pescoço quando faz frio? (cachecol/kashecol/saxecol/taxecol)
        correctAnswer: cachecol
        rationale: "Resposta: cachecol — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'luva'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Resposta: 2 — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
