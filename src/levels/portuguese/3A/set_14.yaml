title: Palavras Simples - Escola
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário da escola. Palavras do cotidiano escolar."
example: "Aprenda palavras relacionadas à escola. Ex.: Como se escreve o que usamos para escrever? → lápis."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Objetos da Escola
    description: Identifique palavras escolares.
    exercises:
      - type: reading
        question: Como se escreve o que usamos para escrever? (lapiz/labis/ladis/lápis)
        correctAnswer: lápis
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que usamos para escrever?\": 'lápis'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'livro'? (1/4/3/2)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'livro' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve onde escrevemos? (tatel/papel/bapel/fadel)
        correctAnswer: papel
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde escrevemos?\": 'papel'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'mesa'? (n/b/p/m)
        correctAnswer: m
        rationale: "Em 'mesa', a primeira letra é 'm'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve onde sentamos na escola? (kadeira/tadeira/sadeira/cadeira)
        correctAnswer: cadeira
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde sentamos na escola?\": 'cadeira'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'giz'? (4/5/2/3)
        correctAnswer: "3"
        rationale: "'giz' tem 3 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve onde o professor escreve? (lousa/lowsa/lowza/louja)
        correctAnswer: lousa
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde o professor escreve?\": 'lousa'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'mochila'? (mo/la/chi/ila)
        correctAnswer: la
        rationale: "A última sílaba de 'mochila' é la."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos para apagar? (borracha/bolracha/bolraxa/borraxa)
        correctAnswer: borracha
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que usamos para apagar?\": 'borracha'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'régua'? (2/4/5/3)
        correctAnswer: "3"
        rationale: "Conte as vogais em 'r': 3."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
