title: Palavras Simples - Transporte
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário de meios de transporte. Leitura de palavras de alta frequência."
example: "Aprenda palavras relacionadas a meios de transporte. Ex.: Como se escreve o que tem quatro rodas e buzina? → carro."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Meios de Transporte
    description: Identifique nomes de transportes.
    exercises:
      - type: reading
        question: Como se escreve o que tem quatro rodas e buzina? (carro/karro/sarro/tarro)
        correctAnswer: carro
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que tem quatro rodas e buzina?\": 'carro'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'ônibus'? (2/3/4/5)
        correctAnswer: "3"
        rationale: "Conte os pedaços de 'ônibus' — cada sílaba tem uma vogal forte: 3."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que voa no céu? (avião/abião/afião/apião)
        correctAnswer: avião
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que voa no céu?\": 'avião'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'bicicleta'? (b/d/p/v)
        correctAnswer: b
        rationale: "Em 'bicicleta', a primeira letra é 'b'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que navega no mar? (navio/nabio/nafio/napio)
        correctAnswer: navio
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que navega no mar?\": 'navio'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'moto'? (3/4/5/6)
        correctAnswer: "4"
        rationale: "'moto' tem 4 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o transporte sobre trilhos? (trem/tren/drem/dren)
        correctAnswer: trem
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o transporte sobre trilhos?\": 'trem'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'barco'? (bar/co/ar/rc)
        correctAnswer: co
        rationale: "A última sílaba de 'barco' é co."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que tem duas rodas e pedal? (bicicleta/bisikleta/vicicleta/picicleta)
        correctAnswer: bicicleta
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que tem duas rodas e pedal?\": 'bicicleta'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'taxi'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Conte as vogais em 'taxi': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
