title: Palavras Simples - Transporte
level: 3A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/3A.
example: Aprenda palavras relacionadas a meios de transporte.
pages:
  - pageNumber: 1
    title: Meios de Transporte
    description: Identifique nomes de transportes.
    exercises:
      - { type: reading, question: "Como se escreve o que tem quatro rodas e buzina? (carro/karro/sarro/tarro)", correctAnswer: "carro" }
      - { type: reading, question: "Quantas sílabas tem 'ônibus'? (2/3/4/5)", correctAnswer: "3" }
      - { type: reading, question: "Como se escreve o que voa no céu? (avião/abião/afião/apião)", correctAnswer: "avião" }
      - { type: reading, question: "Qual é a primeira letra de 'bicicleta'? (b/d/p/v)", correctAnswer: "b" }
      - { type: reading, question: "Como se escreve o que navega no mar? (navio/nabio/nafio/napio)", correctAnswer: "navio" }
      - { type: reading, question: "Quantas letras tem 'moto'? (3/4/5/6)", correctAnswer: "4" }
      - { type: reading, question: "Como se escreve o transporte sobre trilhos? (trem/tren/drem/dren)", correctAnswer: "trem" }
      - { type: reading, question: "Qual é a última sílaba de 'barco'? (bar/co/ar/rc)", correctAnswer: "co" }
      - { type: reading, question: "Como se escreve o que tem duas rodas e pedal? (bicicleta/bisikleta/vicicleta/picicleta)", correctAnswer: "bicicleta" }
      - { type: reading, question: "Quantas vogais tem 'taxi'? (1/2/3/4)", correctAnswer: "2" }
target: 10
