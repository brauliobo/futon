title: Palavras Simples - Brinquedos
level: 3A
subject: portuguese
example: Aprenda palavras relacionadas a brinquedos.
pages:
  - pageNumber: 1
    title: Nomes de Brinquedos
    description: Identifique nomes de brinquedos.
    exercises:
      - type: reading
        question: "Como se escreve o brinquedo redondo que quica? (bola/vola/pola/fola)"
        correctAnswer: "bola"
      - type: reading
        question: "Quantas sílabas tem 'boneca'? (2/3/4/5)"
        correctAnswer: "3"
      - type: reading
        question: "Como se escreve o brinquedo de montar? (bloco/vloco/ploco/floco)"
        correctAnswer: "bloco"
      - type: reading
        question: "Qual é a primeira letra de 'jogo'? (j/g/c/q)"
        correctAnswer: "j"
      - type: reading
        question: "Como se escreve o brinquedo com quatro rodas pequenas? (carrinho/kalinho/salinho/talinho)"
        correctAnswer: "carrinho"
      - type: reading
        question: "Quantas letras tem 'dado'? (3/4/5/6)"
        correctAnswer: "4"
      - type: reading
        question: "Como se escreve o brinquedo que voa com vento? (pipa/bipa/fipa/tipa)"
        correctAnswer: "pipa"
      - type: reading
        question: "Qual é a última sílaba de 'quebra-cabeça'? (que/bra/ça/cabeça)"
        correctAnswer: "ça"
      - type: reading
        question: "Como se escreve o brinquedo que imita pessoas? (boneco/voneco/poneco/foneco)"
        correctAnswer: "boneco"
      - type: reading
        question: "Quantas vogais tem 'trem'? (1/2/3/4)"
        correctAnswer: "1"
target: 10
