title: Formando Palavras Simples
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Formação de palavras com sílabas conhecidas. Consolida leitura."
example: "Combine sílabas para formar palavras. Ex.: CA + SA = → CASA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Palavras com 2 Sílabas
    description: Combine duas sílabas para ler a palavra.
    exercises:
      - type: reading
        question: CA + SA = (SACA/CASA/ASCA)
        correctAnswer: CASA
        rationale: "CA + SA formam CASA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: PA + TO = (TAPO/OPTA/PATO)
        correctAnswer: PATO
        rationale: "PA + TO formam PATO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: BO + LA = (LABO/BOLA/OLAB)
        correctAnswer: BOLA
        rationale: "BO + LA formam BOLA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: GA + TO = (TOGA/GATO/AGTO)
        correctAnswer: GATO
        rationale: "GA + TO formam GATO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: PA + PA = (PAPE/PAPA/APPA)
        correctAnswer: PAPA
        rationale: "PA + PA formam PAPA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MA + MA = (MEMA/MUMA/MAMA)
        correctAnswer: MAMA
        rationale: "MA + MA formam MAMA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: VO + VÔ = (VUVÔ/VOVÔ/VAVÔ)
        correctAnswer: VOVÔ
        rationale: "VO + VÔ formam VOVÔ."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: VO + VÓ = (VAVÓ/VUVÓ/VOVÓ)
        correctAnswer: VOVÓ
        rationale: "VO + VÓ formam VOVÓ."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: LI + XO = (LOXO/LIXO/LUXO)
        correctAnswer: LIXO
        rationale: "LI + XO formam LIXO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: TI + OS = (TOIS/TUIS/TIOS)
        correctAnswer: TIOS
        rationale: "TI + OS formam TIOS."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Identificando Palavras
    description: Qual é a palavra correta?
    exercises:
      - type: reading
        question: "Animal que late: (cachorro/peixe/gato)"
        correctAnswer: cachorro
        rationale: "O cachorro é o animal que late."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Animal que mia: (gato/cavalo/pato)"
        correctAnswer: gato
        rationale: "O gato é o animal que mia."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Animal voador: (pássaro/peixe/cobra)"
        correctAnswer: pássaro
        rationale: "'pássaro' pertence à categoria: animal voador."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Fruta amarela: (uva/banana/limão)"
        correctAnswer: banana
        rationale: "'banana' pertence à categoria: fruta amarela."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Fruta vermelha: (maçã/uva/banana)"
        correctAnswer: maçã
        rationale: "'maçã' pertence à categoria: fruta vermelha."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Bebida: (água/pão/bolo)"
        correctAnswer: água
        rationale: "'água' pertence à categoria: bebida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Móvel: (maçã/mesa/carro)"
        correctAnswer: mesa
        rationale: Reveja o trecho relevante do texto.
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Veículo: (carro/flor/livro)"
        correctAnswer: carro
        rationale: Reveja o trecho relevante do texto.
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Astro: (sol/bola/casa)"
        correctAnswer: sol
        rationale: "'sol' pertence à categoria: astro."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Cor: (azul/gato/casa)"
        correctAnswer: azul
        rationale: "'azul' pertence à categoria: cor."
        difficulty: 1
        objectives: [pt.literacy]
