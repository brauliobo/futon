title: Reconhecimento de Letras - Vogais
level: 3A
subject: portuguese
example: Identifique e reconheça as vogais nas palavras.
pages:
  - pageNumber: 1
    title: Vogais Básicas
    description: Encontre as vogais nas palavras.
    exercises:
      - { type: reading, question: "Quantas vogais tem 'casa'? (1/2/3/4)", correctAnswer: "2" }
      - { type: reading, question: "Qual é a primeira vogal de 'escola'? (a/e/i/o)", correctAnswer: "e" }
      - { type: reading, question: "Quantas vogais tem 'bola'? (1/2/3/4)", correctAnswer: "2" }
      - { type: reading, question: "Qual é a última vogal de 'menino'? (a/e/i/o)", correctAnswer: "o" }
      - { type: reading, question: "Quantas vogais tem 'ave'? (1/2/3/4)", correctAnswer: "2" }
      - { type: reading, question: "Qual vogal aparece duas vezes em 'banana'? (a/e/i/o)", correctAnswer: "a" }
      - { type: reading, question: "Quantas vogais tem 'eu'? (1/2/3/4)", correctAnswer: "2" }
      - { type: reading, question: "Qual é a vogal do meio em 'rua'? (a/e/i/u)", correctAnswer: "u" }
      - { type: reading, question: "Quantas vogais tem 'livro'? (1/2/3/4)", correctAnswer: "2" }
      - { type: reading, question: "Qual é a primeira vogal de 'amigo'? (a/e/i/o)", correctAnswer: "a" }
target: 10
