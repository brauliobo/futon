title: Formando Palavras Simples
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Formação de palavras com sílabas conhecidas. Consolida leitura."
example: "Combine sílabas para formar palavras. Ex.: CA + SA = → CASA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Palavras com 2 Sílabas
    description: Combine duas sílabas para ler a palavra.
    exercises:
      - type: reading
        question: CA + SA = (SACA/CASA/ASCA)
        correctAnswer: CASA
        rationale: "CA + SA formam CASA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: PA + TO = (TAPO/PATO/OPTA)
        correctAnswer: PATO
        rationale: "PA + TO formam PATO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: BO + LA = (LABO/BOLA/OLAB)
        correctAnswer: BOLA
        rationale: "BO + LA formam BOLA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: GA + TO = (GATO/TOGA/AGTO)
        correctAnswer: GATO
        rationale: "GA + TO formam GATO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: PA + PA = (PAPE/APPA/PAPA)
        correctAnswer: PAPA
        rationale: "PA + PA formam PAPA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MA + MA = (MAMA/MUMA/MEMA)
        correctAnswer: MAMA
        rationale: "MA + MA formam MAMA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: VO + VÔ = (VAVÔ/VUVÔ/VOVÔ)
        correctAnswer: VOVÔ
        rationale: "VO + VÔ formam VOVÔ."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: VO + VÓ = (VAVÓ/VOVÓ/VUVÓ)
        correctAnswer: VOVÓ
        rationale: "VO + VÓ formam VOVÓ."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: LI + XO = (LOXO/LUXO/LIXO)
        correctAnswer: LIXO
        rationale: "LI + XO formam LIXO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: TI + OS = (TIOS/TOIS/TUIS)
        correctAnswer: TIOS
        rationale: "TI + OS formam TIOS."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Identificando Palavras
    description: Qual é a palavra correta?
    exercises:
      - type: reading
        question: "Animal que late: (gato/cachorro/peixe)"
        correctAnswer: cachorro
        rationale: "O cachorro é o animal que late."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Animal que mia: (gato/cavalo/pato)"
        correctAnswer: gato
        rationale: "O gato é o animal que mia."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Animal voador: (pássaro/peixe/cobra)"
        correctAnswer: pássaro
        rationale: "Pássaros têm asas e voam; peixe nada e cobra rasteja."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Fruta amarela: (banana/limão/uva)"
        correctAnswer: banana
        rationale: "Banana madura é amarela; limão é verde e uva roxa ou verde."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Fruta vermelha: (maçã/uva/banana)"
        correctAnswer: maçã
        rationale: "Maçã é geralmente vermelha; banana é amarela."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Bebida: (bolo/água/pão)"
        correctAnswer: água
        rationale: "Água se bebe; bolo e pão se comem."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Móvel: (carro/maçã/mesa)"
        correctAnswer: mesa
        rationale: "Mesa é móvel de casa; carro é veículo e maçã é fruta."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Veículo: (flor/livro/carro)"
        correctAnswer: carro
        rationale: "Carro transporta pessoas; flor é planta e livro se lê."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Astro: (bola/casa/sol)"
        correctAnswer: sol
        rationale: "Sol é astro (estrela do céu); bola e casa são objetos da Terra."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Cor: (azul/gato/casa)"
        correctAnswer: azul
        rationale: "Azul é cor; gato é animal e casa é lugar."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: Juntando Sílabas
    description: Ache a combinação correta.
    exercises:
      - type: reading
        question: "MO + TO = (MATO/MOTO)"
        correctAnswer: MOTO
        rationale: "MO + TO formam MOTO."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: MA + TO = (MATO/MOTO)
        correctAnswer: MATO
        rationale: "MA + TO formam MATO."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "PI + PO = (PEPO/PIPO)"
        correctAnswer: PIPO
        rationale: "PI + PO formam PIPO."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: LA + TA = (LATA/LUTA)
        correctAnswer: LATA
        rationale: "LA + TA formam LATA."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "FA + CA = (FECA/FACA)"
        correctAnswer: FACA
        rationale: "FA + CA formam FACA."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: BI + CO = (BICO/BECO)
        correctAnswer: BICO
        rationale: "BI + CO formam BICO."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "MA + LA = (MILO/MALA)"
        correctAnswer: MALA
        rationale: "MA + LA formam MALA."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: SA + PO = (SAPO/SEPO)
        correctAnswer: SAPO
        rationale: "SA + PO formam SAPO."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "CA + PA = (COPA/CAPA)"
        correctAnswer: CAPA
        rationale: "CA + PA formam CAPA."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: PÁ = (PÁ/PE)
        correctAnswer: PÁ
        rationale: "A leitura correta é 'PÁ'."
        difficulty: 2
        objectives: [pt.literacy]
target: 30
