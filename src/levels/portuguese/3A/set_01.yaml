title: Formando Palavras Simples
level: 3A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/3A.
example: "Combine sílabas para formar palavras."
pages:
  - pageNumber: 1
    title: Palavras com 2 Sílabas
    description: Combine duas sílabas para ler a palavra.
    exercises:
      - { type: reading, question: "CA + SA = (CASA/SACA/ASCA)", correctAnswer: "CASA" }
      - { type: reading, question: "PA + TO = (PATO/TAPO/OPTA)", correctAnswer: "PATO" }
      - { type: reading, question: "BO + LA = (BOLA/LABO/OLAB)", correctAnswer: "BOLA" }
      - { type: reading, question: "GA + TO = (GATO/TOGA/AGTO)", correctAnswer: "GATO" }
      - { type: reading, question: "PA + PA = (PAPA/PAPE/APPA)", correctAnswer: "PAPA" }
      - { type: reading, question: "MA + MA = (MAMA/MEMA/MUMA)", correctAnswer: "MAMA" }
      - { type: reading, question: "VO + VÔ = (VOVÔ/VAVÔ/VUVÔ)", correctAnswer: "VOVÔ" }
      - { type: reading, question: "VO + VÓ = (VOVÓ/VAVÓ/VUVÓ)", correctAnswer: "VOVÓ" }
      - { type: reading, question: "LI + XO = (LIXO/LUXO/LOXO)", correctAnswer: "LIXO" }
      - { type: reading, question: "TI + OS = (TIOS/TOIS/TUIS)", correctAnswer: "TIOS" }
  - pageNumber: 2
    title: Identificando Palavras
    description: Qual é a palavra correta?
    exercises:
      - { type: reading, question: "Animal que late: (gato/cachorro/peixe)", correctAnswer: "cachorro" }
      - { type: reading, question: "Animal que mia: (gato/cavalo/pato)", correctAnswer: "gato" }
      - { type: reading, question: "Animal voador: (peixe/pássaro/cobra)", correctAnswer: "pássaro" }
      - { type: reading, question: "Fruta amarela: (banana/uva/limão)", correctAnswer: "banana" }
      - { type: reading, question: "Fruta vermelha: (maçã/banana/uva)", correctAnswer: "maçã" }
      - { type: reading, question: "Bebida: (água/pão/bolo)", correctAnswer: "água" }
      - { type: reading, question: "Móvel: (mesa/maçã/carro)", correctAnswer: "mesa" }
      - { type: reading, question: "Veículo: (carro/livro/flor)", correctAnswer: "carro" }
      - { type: reading, question: "Astro: (sol/bola/casa)", correctAnswer: "sol" }
      - { type: reading, question: "Cor: (azul/casa/gato)", correctAnswer: "azul" }
  - pageNumber: 3
    title: Juntando Sílabas
    description: Ache a combinação correta.
    exercises:
      - { type: reading, question: "MO + TO = (MOTO/MATO)", correctAnswer: "MOTO" }
      - { type: reading, question: "MA + TO = (MATO/MOTO)", correctAnswer: "MATO" }
      - { type: reading, question: "PI + PO = (PIPO/PEPO)", correctAnswer: "PIPO" }
      - { type: reading, question: "LA + TA = (LATA/LUTA)", correctAnswer: "LATA" }
      - { type: reading, question: "FA + CA = (FACA/FECA)", correctAnswer: "FACA" }
      - { type: reading, question: "BI + CO = (BICO/BECO)", correctAnswer: "BICO" }
      - { type: reading, question: "MA + LA = (MALA/MILO)", correctAnswer: "MALA" }
      - { type: reading, question: "SA + PO = (SAPO/SEPO)", correctAnswer: "SAPO" }
      - { type: reading, question: "CA + PA = (CAPA/COPA)", correctAnswer: "CAPA" }
      - { type: reading, question: "PÁ = (PÁ/PE)", correctAnswer: "PÁ" }
target: 30
