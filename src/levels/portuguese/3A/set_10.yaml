title: Palavras Simples - Corpo Humano
level: 3A
subject: portuguese
example: Aprenda palavras das partes do corpo.
pages:
  - pageNumber: 1
    title: Partes do Corpo
    description: Identifique partes do corpo humano.
    exercises:
      - type: reading
        question: "Como se escreve onde ficam os olhos? (cabeça/kabesa/sabesa/tavesa)"
        correctAnswer: "cabeça"
      - type: reading
        question: "Quantas sílabas tem 'braço'? (1/2/3/4)"
        correctAnswer: "2"
      - type: reading
        question: "Como se escreve o que usamos para andar? (perna/pelna/perna/pelma)"
        correctAnswer: "perna"
      - type: reading
        question: "Qual é a primeira letra de 'mão'? (m/n/b/p)"
        correctAnswer: "m"
      - type: reading
        question: "Como se escreve o que usamos para ver? (olho/olha/oio/olo)"
        correctAnswer: "olho"
      - type: reading
        question: "Quantas letras tem 'pé'? (1/2/3/4)"
        correctAnswer: "2"
      - type: reading
        question: "Como se escreve o que usamos para ouvir? (ouvido/oubido/ouvindo/oubindo)"
        correctAnswer: "ouvido"
      - type: reading
        question: "Qual é a última sílaba de 'dedo'? (de/do/ed/od)"
        correctAnswer: "do"
      - type: reading
        question: "Como se escreve o que fica no meio da cara? (nariz/naliz/maliz/taliz)"
        correctAnswer: "nariz"
      - type: reading
        question: "Quantas vogais tem 'boca'? (1/2/3/4)"
        correctAnswer: "2"
target: 10
