title: Palavras Simples - Corpo Humano
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário do corpo humano. Base para descrições."
example: "Aprenda palavras das partes do corpo. Ex.: Como se escreve onde ficam os olhos? → cabeça."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Partes do Corpo
    description: Identifique partes do corpo humano.
    exercises:
      - type: reading
        question: Como se escreve onde ficam os olhos? (sabesa/tavesa/kabesa/cabeça)
        correctAnswer: cabeça
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde ficam os olhos?\": 'cabeça'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'braço'? (2/4/1/3)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'braço' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos para andar? (perna/pelma/perla/pelna)
        correctAnswer: perna
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que usamos para andar?\": 'perna'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'mão'? (b/p/n/m)
        correctAnswer: m
        rationale: "Em 'm', a primeira letra é 'm'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos para ver? (olha/olho/olo/oio)
        correctAnswer: olho
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que usamos para ver?\": 'olho'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'pé'? (2/1/4/3)
        correctAnswer: "2"
        rationale: "'pé' tem 2 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos para ouvir? (ouvido/oubindo/ouvindo/oubido)
        correctAnswer: ouvido
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que usamos para ouvir?\": 'ouvido'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'dedo'? (do/od/ed/de)
        correctAnswer: do
        rationale: "A última sílaba de 'dedo' é do."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que fica no meio da cara? (maliz/naliz/nariz/taliz)
        correctAnswer: nariz
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que fica no meio da cara?\": 'nariz'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'boca'? (2/4/3/1)
        correctAnswer: "2"
        rationale: "Conte as vogais em 'boca': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
