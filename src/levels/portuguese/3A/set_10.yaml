title: Palavras Simples - Corpo Humano
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário do corpo humano. Base para descrições."
example: Aprenda palavras das partes do corpo.
pages:
  - pageNumber: 1
    title: Partes do Corpo
    description: Identifique partes do corpo humano.
    exercises:
      - type: reading
        question: Como se escreve onde ficam os olhos? (cabeça/kabesa/sabesa/tavesa)
        correctAnswer: cabeça
        rationale: "Resposta: cabeça — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'braço'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'braço' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos para andar? (perna/pelna/perna/pelma)
        correctAnswer: perna
        rationale: "Resposta: perna — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'mão'? (m/n/b/p)
        correctAnswer: m
        rationale: "Resposta: m — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos para ver? (olho/olha/oio/olo)
        correctAnswer: olho
        rationale: "Resposta: olho — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'pé'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "'pé' tem 2 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que usamos para ouvir? (ouvido/oubido/ouvindo/oubindo)
        correctAnswer: ouvido
        rationale: "Resposta: ouvido — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'dedo'? (de/do/ed/od)
        correctAnswer: do
        rationale: "Resposta: do — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que fica no meio da cara? (nariz/naliz/maliz/taliz)
        correctAnswer: nariz
        rationale: "Resposta: nariz — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'boca'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Resposta: 2 — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
