title: Rimas e Sons - Palavras que Rimam
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Palavras que rimam. Desenvolve consciência fonológica."
example: "Identifique e complete rimas simples. Ex.: Qual palavra rima com 'gato'? → rato."
pages:
  - pageNumber: 1
    title: Palavras que Rimam
    description: Encontre palavras que rimam.
    exercises:
      - type: reading
        question: Qual palavra rima com 'gato'? (rato/cão/peixe/ave)
        correctAnswer: rato
        rationale: "'gato' e 'rato' têm terminação parecida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'casa'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'casa' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual palavra rima com 'flor'? (cor/sol/mar/céu)
        correctAnswer: cor
        rationale: "'flor' e 'cor' têm terminação parecida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'pato'? (p/b/f/d)
        correctAnswer: p
        rationale: "Em 'pato', a primeira letra é 'p'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual palavra rima com 'mão'? (pé/pão/sol/lua)
        correctAnswer: pão
        rationale: "'mão' e 'pão' têm terminação parecida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'céu'? (2/3/4/5)
        correctAnswer: "3"
        rationale: "'céu' tem 3 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual palavra rima com 'dia'? (noite/alegria/sol/lua)
        correctAnswer: alegria
        rationale: "'dia' e 'alegria' têm terminação parecida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'coração'? (co/ra/são/ção)
        correctAnswer: ção
        rationale: "A última sílaba de 'cora' é ção."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual palavra rima com 'amor'? (ódio/dor/paz/guerra)
        correctAnswer: dor
        rationale: "'amor' e 'dor' têm terminação parecida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'paz'? (1/2/3/4)
        correctAnswer: "1"
        rationale: "Conte as vogais em 'paz': 1."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
