title: Revisão Geral - Misturando Tudo
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Revisão geral de todos os conceitos aprendidos. Ex.: Quantas vogais existem no alfabeto português? → 5."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Revisão Final
    description: Teste seus conhecimentos gerais.
    exercises:
      - type: reading
        question: Quantas vogais existem no alfabeto português? (5/7/4/6)
        correctAnswer: "5"
        rationale: "As vogais são A, E, I, O, U — cinco ao todo."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal que é o melhor amigo do homem? (pássaro/cão/gato/peixe)
        correctAnswer: cão
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o animal que é o melhor amigo do homem?\": 'cão'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra do alfabeto? (D/A/B/C)
        correctAnswer: A
        rationale: "Observe as opções e escolha a que responde \"Qual é a primeira letra do alfabeto?\": 'A'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'borboleta'? (4/5/2/3)
        correctAnswer: "4"
        rationale: "Conte os pedaços de 'borboleta' — cada sílaba tem uma vogal forte: 4."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual palavra rima com 'coração'? (vida/alma/paixão/amor)
        correctAnswer: paixão
        rationale: "'coração' e 'paixão' têm terminação parecida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o número que vem depois do 9? (des/dis/dus/dez)
        correctAnswer: dez
        rationale: "Concordância: o termo deve concordar em gênero e número."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é o oposto de 'dia'? (noite/madrugada/manhã/tarde)
        correctAnswer: noite
        rationale: "Antônimo — ideia contrária: noite."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Como se completa: 'O pássaro voa no ___'? (rio/chão/céu/mar)"
        correctAnswer: céu
        rationale: "Observe as opções e escolha a que responde \"Como se completa: 'O pássaro voa no ___'?\": 'céu'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem a palavra 'escola'? (6/8/7/5)
        correctAnswer: "6"
        rationale: "Conte as letras em 'a': 6."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual palavra significa o mesmo que 'casa'? (lar/cidade/rua/bairro)
        correctAnswer: lar
        rationale: "Sinônimo de 'lar' — mesma ideia com outra palavra."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
