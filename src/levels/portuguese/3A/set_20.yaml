title: Revisão Geral - Misturando Tudo
level: 3A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/3A.
example: Revisão geral de todos os conceitos aprendidos.
pages:
  - pageNumber: 1
    title: Revisão Final
    description: Teste seus conhecimentos gerais.
    exercises:
      - { type: reading, question: "Quantas vogais existem no alfabeto português? (4/5/6/7)", correctAnswer: "5" }
      - { type: reading, question: "Como se escreve o animal que é o melhor amigo do homem? (gato/cão/pássaro/peixe)", correctAnswer: "cão" }
      - { type: reading, question: "Qual é a primeira letra do alfabeto? (A/B/C/D)", correctAnswer: "A" }
      - { type: reading, question: "Quantas sílabas tem 'borboleta'? (2/3/4/5)", correctAnswer: "4" }
      - { type: reading, question: "Qual palavra rima com 'coração'? (paixão/amor/vida/alma)", correctAnswer: "paixão" }
      - { type: reading, question: "Como se escreve o número que vem depois do 9? (dez/des/dis/dus)", correctAnswer: "dez" }
      - { type: reading, question: "Qual é o oposto de 'dia'? (manhã/tarde/noite/madrugada)", correctAnswer: "noite" }
      - { type: reading, question: "Como se completa: 'O pássaro voa no ___'? (chão/céu/mar/rio)", correctAnswer: "céu" }
      - { type: reading, question: "Quantas letras tem a palavra 'escola'? (5/6/7/8)", correctAnswer: "6" }
      - { type: reading, question: "Qual palavra significa o mesmo que 'casa'? (lar/rua/cidade/bairro)", correctAnswer: "lar" }
target: 10
