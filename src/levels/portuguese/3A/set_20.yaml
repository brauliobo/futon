title: Revisão Geral - Misturando Tudo
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: Revisão geral de todos os conceitos aprendidos.
pages:
  - pageNumber: 1
    title: Revisão Final
    description: Teste seus conhecimentos gerais.
    exercises:
      - type: reading
        question: Quantas vogais existem no alfabeto português? (4/5/6/7)
        correctAnswer: "5"
        rationale: "As vogais são A, E, I, O, U — cinco ao todo."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal que é o melhor amigo do homem? (gato/cão/pássaro/peixe)
        correctAnswer: cão
        rationale: "A resposta correta é 'cão'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra do alfabeto? (A/B/C/D)
        correctAnswer: A
        rationale: "A resposta correta é 'A'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'borboleta'? (2/3/4/5)
        correctAnswer: "4"
        rationale: "Conte os pedaços de 'borboleta' — cada sílaba tem uma vogal forte: 4."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual palavra rima com 'coração'? (paixão/amor/vida/alma)
        correctAnswer: paixão
        rationale: "'coração' e 'paixão' têm terminação parecida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o número que vem depois do 9? (dez/des/dis/dus)
        correctAnswer: dez
        rationale: "Concordância: o termo deve concordar em gênero e número."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é o oposto de 'dia'? (manhã/tarde/noite/madrugada)
        correctAnswer: noite
        rationale: "Antônimo — ideia contrária: noite."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Como se completa: 'O pássaro voa no ___'? (chão/céu/mar/rio)"
        correctAnswer: céu
        rationale: "A resposta correta é 'céu'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem a palavra 'escola'? (5/6/7/8)
        correctAnswer: "6"
        rationale: "A resposta correta é '6'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual palavra significa o mesmo que 'casa'? (lar/rua/cidade/bairro)
        correctAnswer: lar
        rationale: "Sinônimo de 'lar' — mesma ideia com outra palavra."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
