    exercises:
      - type: reading
        question: Quantas vogais existem no alfabeto português? (4/5/6/7)
        correctAnswer: "5"
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Como se escreve o animal que é o melhor amigo do homem? (gato/cão/pássaro/peixe)
