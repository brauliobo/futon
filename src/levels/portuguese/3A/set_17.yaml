title: Frases Simples - Completar
level: 3A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/3A.
example: Complete frases simples com palavras adequadas.
pages:
  - pageNumber: 1
    title: Completar Frases
    description: Complete as frases com a palavra certa.
    exercises:
      - { type: reading, question: "O gato subiu na ___. (árvore/água/avião/anel)", correctAnswer: "árvore" }
      - { type: reading, question: "A menina brinca com a ___. (boneca/bicicleta/banana/borboleta)", correctAnswer: "boneca" }
      - { type: reading, question: "O pássaro voa no ___. (céu/chão/carro/casa)", correctAnswer: "céu" }
      - { type: reading, question: "O peixe nada no ___. (mar/mato/mesa/muro)", correctAnswer: "mar" }
      - { type: reading, question: "A criança come ___. (pão/pau/parede/papel)", correctAnswer: "pão" }
      - { type: reading, question: "O cachorro late na ___. (rua/rio/rosa/rede)", correctAnswer: "rua" }
      - { type: reading, question: "A flor cresce no ___. (jardim/janela/jogo/jornal)", correctAnswer: "jardim" }
      - { type: reading, question: "O livro está na ___. (mesa/mala/moto/música)", correctAnswer: "mesa" }
      - { type: reading, question: "A lua brilha à ___. (noite/nome/nuvem/neve)", correctAnswer: "noite" }
      - { type: reading, question: "O sol aquece de ___. (dia/dado/dente/doce)", correctAnswer: "dia" }
target: 10
