title: Palavras Simples - Casa
level: 3A
subject: portuguese
example: Aprenda palavras relacionadas à casa.
pages:
  - pageNumber: 1
    title: Partes da Casa
    description: Identifique palavras da casa.
    exercises:
      - { type: reading, question: ""Como se escreve onde dormimos? (cama/kama/sama/tama)"", correctAnswer: "cama" }
      - { type: reading, question: ""Quantas sílabas tem 'porta'? (1/2/3/4)"", correctAnswer: "2" }
      - { type: reading, question: ""Como se escreve onde vemos através da parede? (janela/ganela/zanela/fanela)"", correctAnswer: "janela" }
      - { type: reading, question: ""Qual é a primeira letra de 'mesa'? (m/n/b/p)"", correctAnswer: "m" }
      - { type: reading, question: ""Como se escreve onde sentamos? (cadeira/kadeira/sadeira/tadeira)"", correctAnswer: "cadeira" }
      - { type: reading, question: ""Quantas letras tem 'sofá'? (3/4/5/6)"", correctAnswer: "4" }
      - { type: reading, question: ""Como se escreve onde cozinhamos? (fogão/fogam/frogão/foguan)"", correctAnswer: "fogão" }
      - { type: reading, question: ""Qual é a última sílaba de 'televisão'? (te/vi/são/são)"", correctAnswer: "são" }
      - { type: reading, question: ""Como se escreve onde guardamos roupas? (armário/almário/armario/armálio)"", correctAnswer: "armário" }
      - { type: reading, question: ""Quantas vogais tem 'teto'? (1/2/3/4)"", correctAnswer: "2" }
target: 10
