title: Palavras Simples - Casa
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — casa/objetos. Associa palavra escrita a referente concreto."
example: "Aprenda palavras relacionadas à casa. Ex.: Como se escreve onde dormimos? → cama."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Partes da Casa
    description: Identifique palavras da casa.
    exercises:
      - type: reading
        question: Como se escreve onde dormimos? (cama/kama/sama/tama)
        correctAnswer: cama
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde dormimos?\": 'cama'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'porta'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'porta' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve onde vemos através da parede? (janela/ganela/zanela/fanela)
        correctAnswer: janela
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde vemos através da parede?\": 'janela'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'mesa'? (m/n/b/p)
        correctAnswer: m
        rationale: "Em 'mesa', a primeira letra é 'm'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve onde sentamos? (cadeira/kadeira/sadeira/tadeira)
        correctAnswer: cadeira
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde sentamos?\": 'cadeira'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'sofá'? (3/4/5/6)
        correctAnswer: "4"
        rationale: "'sofá' tem 4 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve onde cozinhamos? (fogão/fogam/frogão/foguan)
        correctAnswer: fogão
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde cozinhamos?\": 'fogão'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'televisão'? (te/le/vi/são)
        correctAnswer: são
        rationale: "A última sílaba de 'televis' é são."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve onde guardamos roupas? (armário/almário/armario/armálio)
        correctAnswer: armário
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde guardamos roupas?\": 'armário'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'teto'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Conte as vogais em 'teto': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
