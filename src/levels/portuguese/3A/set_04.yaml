title: ✏️ Palavras Simples - Animais
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — animais. Leitura de palavras de alta frequência."
example: "Leia e identifique palavras simples de animais. Ex.: Como se escreve o animal que faz 'miau'? → gato."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nomes de Animais
    description: Complete e identifique nomes de animais.
    exercises:
      - type: reading
        question: Como se escreve o animal que faz 'miau'? (pato/cão/gato/rato)
        correctAnswer: gato
        rationale: "GATO faz 'miau'; pato grasna, cão late e rato guincha — cada um tem seu som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'peixe'? (4/5/7/6)
        correctAnswer: "5"
        rationale: "'peixe' tem 5 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal que voa? (uva/ave/ovo/eva)
        correctAnswer: ave
        rationale: "AVE é o nome geral do animal que voa (pássaros); uva é fruta e ovo é alimento."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual animal rima com 'rato'? (nato/mato/gato/pato)
        correctAnswer: gato
        rationale: "'gato' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal da fazenda que dá leite? (saca/faca/baca/vaca)
        correctAnswer: vaca
        rationale: "VACA começa com V (V-A-C-A); faca é para cortar, saca é bolsa, baca não é palavra."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'cavalo'? (2/5/4/3)
        correctAnswer: "3"
        rationale: "Conte os pedaços de 'cavalo' — cada sílaba tem uma vogal forte: 3."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal que late? (pão/são/mão/cão)
        correctAnswer: cão
        rationale: "CÃO começa com C (som /k/); pão é alimento, mão é parte do corpo, são = saudável."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'borboleta'? (f/b/d/p)
        correctAnswer: b
        rationale: "Em 'borboleta', a primeira letra é 'b'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal listrado? (tebra/zebra/sebra/lebra)
        correctAnswer: zebra
        rationale: "ZEBRA começa com Z (som /z/); soletre: Z-E-B-R-A."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'urso'? (2/3/1/4)
        correctAnswer: "2"
        rationale: "Conte as vogais em 'urso': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
