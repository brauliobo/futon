title: Palavras Simples - Animais
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — animais. Leitura de palavras de alta frequência."
example: "Leia e identifique palavras simples de animais. Ex.: Como se escreve o animal que faz 'miau'? → gato."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nomes de Animais
    description: Complete e identifique nomes de animais.
    exercises:
      - type: reading
        question: Como se escreve o animal que faz 'miau'? (pato/rato/gato/cão)
        correctAnswer: gato
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o animal que faz 'miau'?\": 'gato'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'peixe'? (5/7/6/4)
        correctAnswer: "5"
        rationale: "'peixe' tem 5 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal que voa? (ovo/uva/eva/ave)
        correctAnswer: ave
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o animal que voa?\": 'ave'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual animal rima com 'rato'? (pato/nato/gato/mato)
        correctAnswer: gato
        rationale: "'gato' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal da fazenda que dá leite? (faca/saca/vaca/baca)
        correctAnswer: vaca
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o animal da fazenda que dá leite?\": 'vaca'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'cavalo'? (2/5/4/3)
        correctAnswer: "3"
        rationale: "Conte os pedaços de 'cavalo' — cada sílaba tem uma vogal forte: 3."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal que late? (cão/pão/mão/são)
        correctAnswer: cão
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o animal que late?\": 'cão'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'borboleta'? (d/f/p/b)
        correctAnswer: b
        rationale: "Em 'borboleta', a primeira letra é 'b'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o animal listrado? (sebra/zebra/tebra/lebra)
        correctAnswer: zebra
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o animal listrado?\": 'zebra'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'urso'? (4/1/2/3)
        correctAnswer: "2"
        rationale: "Conte as vogais em 'urso': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
