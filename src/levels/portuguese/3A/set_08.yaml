title: Palavras Simples - Números
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: Conjunto de portuguese/3A.
example: Aprenda a ler e escrever números por extenso.
pages:
  - pageNumber: 1
    title: Números Básicos
    description: Identifique números escritos.
    exercises:
      - type: reading
        question: Como se escreve o número 1? (um/hum/un/on)
        correctAnswer: um
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Quantas sílabas tem 'dois'? (1/2/3/4)
        correctAnswer: "1"
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Como se escreve o número 3? (três/trez/treis/tres)
        correctAnswer: três
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Qual é a primeira letra de 'quatro'? (q/c/k/g)
        correctAnswer: q
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Como se escreve o número 5? (cinco/sinco/zinco/tinco)
        correctAnswer: cinco
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Quantas letras tem 'seis'? (3/4/5/6)
        correctAnswer: "4"
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Como se escreve o número 7? (sete/seti/setu/sede)
        correctAnswer: sete
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Qual é a última sílaba de 'oito'? (oi/to/it/ot)
        correctAnswer: to
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Como se escreve o número 9? (nove/nobe/nofe/nope)
        correctAnswer: nove
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Quantas vogais tem 'dez'? (1/2/3/4)
        correctAnswer: "1"
        rationale: Reveja o trecho relevante do texto.
target: 10
