title: Palavras Simples - Números
level: 3A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/3A.
example: Aprenda a ler e escrever números por extenso.
pages:
  - pageNumber: 1
    title: Números Básicos
    description: Identifique números escritos.
    exercises:
      - { type: reading, question: "Como se escreve o número 1? (um/hum/un/on)", correctAnswer: "um" }
      - { type: reading, question: "Quantas sílabas tem 'dois'? (1/2/3/4)", correctAnswer: "1" }
      - { type: reading, question: "Como se escreve o número 3? (três/trez/treis/tres)", correctAnswer: "três" }
      - { type: reading, question: "Qual é a primeira letra de 'quatro'? (q/c/k/g)", correctAnswer: "q" }
      - { type: reading, question: "Como se escreve o número 5? (cinco/sinco/zinco/tinco)", correctAnswer: "cinco" }
      - { type: reading, question: "Quantas letras tem 'seis'? (3/4/5/6)", correctAnswer: "4" }
      - { type: reading, question: "Como se escreve o número 7? (sete/seti/setu/sede)", correctAnswer: "sete" }
      - { type: reading, question: "Qual é a última sílaba de 'oito'? (oi/to/it/ot)", correctAnswer: "to" }
      - { type: reading, question: "Como se escreve o número 9? (nove/nobe/nofe/nope)", correctAnswer: "nove" }
      - { type: reading, question: "Quantas vogais tem 'dez'? (1/2/3/4)", correctAnswer: "1" }
target: 10
