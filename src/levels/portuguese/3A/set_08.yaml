title: Palavras Simples - Números
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Números por extenso. Associe numeral a palavra escrita."
example: "Aprenda a ler e escrever números por extenso. Ex.: Como se escreve o número 1? → um."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Números Básicos
    description: Identifique números escritos.
    exercises:
      - type: reading
        question: Como se escreve o número 1? (um/hum/un/on)
        correctAnswer: um
        rationale: "1 por extenso é 'um'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'dois'? (4/1/2/3)
        correctAnswer: "1"
        rationale: "Conte os pedaços de 'dois' — cada sílaba tem uma vogal forte: 1."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o número 3? (treis/tres/trez/três)
        correctAnswer: três
        rationale: "3 por extenso é 'três'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'quatro'? (c/k/g/q)
        correctAnswer: q
        rationale: "Em 'quatro', a primeira letra é 'q'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o número 5? (zinco/sinco/cinco/tinco)
        correctAnswer: cinco
        rationale: "5 por extenso é 'cinco'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'seis'? (3/4/5/6)
        correctAnswer: "4"
        rationale: "'seis' tem 4 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o número 7? (sete/seti/setu/sede)
        correctAnswer: sete
        rationale: "7 por extenso é 'sete'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'oito'? (it/ot/to/oi)
        correctAnswer: to
        rationale: "A última sílaba de 'oito' é to."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o número 9? (nofe/nobe/nove/nope)
        correctAnswer: nove
        rationale: "9 por extenso é 'nove'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'dez'? (3/4/2/1)
        correctAnswer: "1"
        rationale: "Conte as vogais em 'dez': 1."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
