title: Reconhecimento de Letras - Consoantes
level: 3A
subject: portuguese
example: Identifique e reconheça as consoantes nas palavras.
pages:
  - pageNumber: 1
    title: Consoantes Básicas
    description: Encontre as consoantes nas palavras.
    exercises:
      - { type: reading, question: "Quantas consoantes tem 'mão'? (1/2/3/4)", correctAnswer: "1" }
      - { type: reading, question: "Qual é a primeira consoante de 'papel'? (p/b/t/d)", correctAnswer: "p" }
      - { type: reading, question: "Quantas consoantes tem 'carro'? (1/2/3/4)", correctAnswer: "3" }
      - { type: reading, question: "Qual é a última consoante de 'animal'? (l/m/n/r)", correctAnswer: "l" }
      - { type: reading, question: "Quantas consoantes tem 'sol'? (1/2/3/4)", correctAnswer: "2" }
      - { type: reading, question: "Qual consoante aparece duas vezes em 'mamãe'? (m/n/p/t)", correctAnswer: "m" }
      - { type: reading, question: "Quantas consoantes tem 'flor'? (1/2/3/4)", correctAnswer: "3" }
      - { type: reading, question: "Qual é a consoante do meio em 'bode'? (b/d/f/g)", correctAnswer: "d" }
      - { type: reading, question: "Quantas consoantes tem 'nome'? (1/2/3/4)", correctAnswer: "2" }
      - { type: reading, question: "Qual é a primeira consoante de 'gato'? (g/c/t/d)", correctAnswer: "g" }
target: 10
