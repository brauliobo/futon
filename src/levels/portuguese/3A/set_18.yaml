title: ✏️ Palavras Compostas - Junção
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Palavras compostas por justaposição (guarda-chuva, passatempo)."
example: "Identifique e forme palavras compostas simples. Ex.: Guarda + chuva = ? → guarda-chuva."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Palavras Juntas
    description: Reconheça palavras formadas por junção.
    exercises:
      - type: reading
        question: Guarda + chuva = ? (guarda chuva/guardachuva/guardaxuva/guarda-chuva)
        correctAnswer: guarda-chuva
        rationale: "Guarda + chuva forma guarda-chuva."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas palavras formam 'passatempo'? (1/3/4/2)
        correctAnswer: "2"
        rationale: "PASSATEMPO = PASSA + TEMPO (2 palavras aglutinadas sem hífen)."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Porta + aviões = ? (portabiões/porta aviões/porta-aviões/portaaviões)
        correctAnswer: porta-aviões
        rationale: "Palavras compostas por justaposição usam hífen: porta-aviões."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira palavra de 'quebra-cabeça'? (quebrar/quebra/cabeçar/cabeça)
        correctAnswer: quebra
        rationale: "Em 'quebra-cabeça', a primeira palavra é 'quebra'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Beija + flor = ? (beija flor/beija-flor/beijaflor/beijaflol)
        correctAnswer: beija-flor
        rationale: "Beija + flor forma beija-flor."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'girassol'? (2/5/4/3)
        correctAnswer: "3"
        rationale: "Conte os pedaços de 'girassol' — cada sílaba tem uma vogal forte: 3."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Lava + louça = ? (lavalouca/lavalousa/lava-louça/lava louça)
        correctAnswer: lava-louça
        rationale: "Verbo + substantivo forma palavra composta com hífen: LAVA-LOUÇA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a segunda palavra de 'pé-de-moleque'? (de/pé/moleque/pé-de)
        correctAnswer: de
        rationale: "Em 'pé-de-moleque', a segunda palavra é 'de'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Ponto + virgula = ? (ponto vírgula/pontovírgula/pontovirgula/ponto-vírgula)
        correctAnswer: ponto-vírgula
        rationale: "Ponto + virgula forma ponto-vírgula."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'bem-te-vi'? (8/10/9/7)
        correctAnswer: "9"
        rationale: "'bem-te-vi' tem 9 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
