title: Palavras Compostas - Junção
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Palavras compostas por justaposição (guarda-chuva, passatempo)."
example: Identifique e forme palavras compostas simples.
pages:
  - pageNumber: 1
    title: Palavras Juntas
    description: Reconheça palavras formadas por junção.
    exercises:
      - type: reading
        question: Guarda + chuva = ? (guarda-chuva/guardachuva/guarda chuva/guardaxuva)
        correctAnswer: guarda-chuva
        rationale: "Guarda + chuva forma guarda-chuva."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas palavras formam 'passatempo'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "A resposta correta é '2'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Porta + aviões = ? (porta-aviões/portaaviões/porta aviões/portabiões)
        correctAnswer: porta-aviões
        rationale: "A resposta correta é 'porta-aviões'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira palavra de 'quebra-cabeça'? (quebra/cabeça/quebrar/cabeçar)
        correctAnswer: quebra
        rationale: "Em 'quebra-cabeça', a primeira palavra é 'quebra'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Beija + flor = ? (beija-flor/beijaflor/beija flor/beijaflol)
        correctAnswer: beija-flor
        rationale: "Beija + flor forma beija-flor."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'girassol'? (2/3/4/5)
        correctAnswer: "3"
        rationale: "Conte os pedaços de 'girassol' — cada sílaba tem uma vogal forte: 3."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Lava + louça = ? (lava-louça/lavalouca/lava louça/lavalousa)
        correctAnswer: lava-louça
        rationale: "A resposta correta é 'lava-louça'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a segunda palavra de 'pé-de-moleque'? (pé/de/moleque/pé-de)
        correctAnswer: de
        rationale: "Em 'pé-de-moleque', a segunda palavra é 'de'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Ponto + virgula = ? (ponto-vírgula/pontovírgula/ponto vírgula/pontovirgula)
        correctAnswer: ponto-vírgula
        rationale: "Ponto + virgula forma ponto-vírgula."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'bem-te-vi'? (7/8/9/10)
        correctAnswer: "9"
        rationale: "'bem-te-vi' tem 9 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
