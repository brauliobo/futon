title: Palavras Compostas - Junção
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Palavras compostas por justaposição (guarda-chuva, passatempo)."
example: "Identifique e forme palavras compostas simples. Ex.: Guarda + chuva = ? → guarda-chuva."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Palavras Juntas
    description: Reconheça palavras formadas por junção.
    exercises:
      - type: reading
        question: Guarda + chuva = ? (guardachuva/guardaxuva/guarda-chuva/guarda chuva)
        correctAnswer: guarda-chuva
        rationale: "Guarda + chuva forma guarda-chuva."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas palavras formam 'passatempo'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Observe as opções e escolha a que responde \"Quantas palavras formam 'passatempo'?\": '2'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Porta + aviões = ? (portaaviões/porta-aviões/portabiões/porta aviões)
        correctAnswer: porta-aviões
        rationale: "Observe as opções e escolha a que responde \"Porta + aviões = ?\": 'porta-aviões'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira palavra de 'quebra-cabeça'? (quebrar/cabeça/quebra/cabeçar)
        correctAnswer: quebra
        rationale: "Em 'quebra-cabeça', a primeira palavra é 'quebra'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Beija + flor = ? (beija flor/beijaflol/beijaflor/beija-flor)
        correctAnswer: beija-flor
        rationale: "Beija + flor forma beija-flor."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'girassol'? (2/5/4/3)
        correctAnswer: "3"
        rationale: "Conte os pedaços de 'girassol' — cada sílaba tem uma vogal forte: 3."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Lava + louça = ? (lavalouca/lava louça/lavalousa/lava-louça)
        correctAnswer: lava-louça
        rationale: "Observe as opções e escolha a que responde \"Lava + louça = ?\": 'lava-louça'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a segunda palavra de 'pé-de-moleque'? (de/pé-de/pé/moleque)
        correctAnswer: de
        rationale: "Em 'pé-de-moleque', a segunda palavra é 'de'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Ponto + virgula = ? (ponto vírgula/pontovirgula/pontovírgula/ponto-vírgula)
        correctAnswer: ponto-vírgula
        rationale: "Ponto + virgula forma ponto-vírgula."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'bem-te-vi'? (9/10/8/7)
        correctAnswer: "9"
        rationale: "'bem-te-vi' tem 9 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
