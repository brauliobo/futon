title: Formação de Sílabas - Simples
level: 3A
subject: portuguese
example: Forme e identifique sílabas simples.
pages:
  - pageNumber: 1
    title: Sílabas Simples
    description: Identifique e forme sílabas.
    exercises:
      - type: reading
        question: "Quantas sílabas tem 'casa'? (1/2/3/4)"
        correctAnswer: "2"
      - type: reading
        question: "Qual é a primeira sílaba de 'bonito'? (bo/ni/to/it)"
        correctAnswer: "bo"
      - type: reading
        question: "Quantas sílabas tem 'pé'? (1/2/3/4)"
        correctAnswer: "1"
      - type: reading
        question: "Qual é a última sílaba de 'menina'? (me/ni/na/in)"
        correctAnswer: "na"
      - type: reading
        question: "Quantas sílabas tem 'telefone'? (2/3/4/5)"
        correctAnswer: "4"
      - type: reading
        question: "Qual é a sílaba do meio em 'cabelo'? (ca/be/lo/el)"
        correctAnswer: "be"
      - type: reading
        question: "Quantas sílabas tem 'livro'? (1/2/3/4)"
        correctAnswer: "2"
      - type: reading
        question: "Qual é a primeira sílaba de 'família'? (fa/mí/li/a)"
        correctAnswer: "fa"
      - type: reading
        question: "Quantas sílabas tem 'sol'? (1/2/3/4)"
        correctAnswer: "1"
      - type: reading
        question: "Qual é a última sílaba de 'escola'? (es/co/la/ol)"
        correctAnswer: "la"
target: 10
