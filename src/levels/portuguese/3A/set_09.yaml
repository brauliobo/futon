title: Palavras Simples - Comida
level: 3A
subject: portuguese
example: Aprenda palavras relacionadas a alimentos.
pages:
  - pageNumber: 1
    title: Alimentos Básicos
    description: Identifique nomes de comidas.
    exercises:
      - { type: reading, question: ""Como se escreve a fruta vermelha redonda? (maçã/massa/maça/mação)"", correctAnswer: "maçã" }
      - { type: reading, question: ""Quantas sílabas tem 'banana'? (2/3/4/5)"", correctAnswer: "3" }
      - { type: reading, question: ""Como se escreve o alimento feito com trigo? (pão/pan/paõ/pau)"", correctAnswer: "pão" }
      - { type: reading, question: ""Qual é a primeira letra de 'queijo'? (q/c/k/g)"", correctAnswer: "q" }
      - { type: reading, question: ""Como se escreve o líquido branco nutritivo? (leite/leiti/leit/lete)"", correctAnswer: "leite" }
      - { type: reading, question: ""Quantas letras tem 'ovo'? (2/3/4/5)"", correctAnswer: "3" }
      - { type: reading, question: ""Como se escreve a fruta amarela comprida? (banana/vanana/fanana/ranana)"", correctAnswer: "banana" }
      - { type: reading, question: ""Qual é a última sílaba de 'chocolate'? (cho/co/late/te)"", correctAnswer: "te" }
      - { type: reading, question: ""Como se escreve o grão usado no café? (café/kafe/safé/tafé)"", correctAnswer: "café" }
      - { type: reading, question: ""Quantas vogais tem 'água'? (2/3/4/5)"", correctAnswer: "3" }
target: 10
