title: Palavras Simples - Comida
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — comida. Palavras de alta frequência."
example: "Aprenda palavras relacionadas a alimentos. Ex.: Como se escreve a fruta vermelha redonda? → maçã."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Alimentos Básicos
    description: Identifique nomes de comidas.
    exercises:
      - type: reading
        question: Como se escreve a fruta vermelha redonda? (massa/maça/mação/maçã)
        correctAnswer: maçã
        rationale: "Observe as opções e escolha a que responde \"Como se escreve a fruta vermelha redonda?\": 'maçã'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'banana'? (5/2/3/4)
        correctAnswer: "3"
        rationale: "Conte os pedaços de 'banana' — cada sílaba tem uma vogal forte: 3."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o alimento feito com trigo? (pan/paõ/pau/pão)
        correctAnswer: pão
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o alimento feito com trigo?\": 'pão'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'queijo'? (k/g/q/c)
        correctAnswer: q
        rationale: "Em 'queijo', a primeira letra é 'q'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o líquido branco nutritivo? (leit/leiti/leite/lete)
        correctAnswer: leite
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o líquido branco nutritivo?\": 'leite'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'ovo'? (2/4/5/3)
        correctAnswer: "3"
        rationale: "'ovo' tem 3 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a fruta amarela comprida? (banana/ranana/fanana/vanana)
        correctAnswer: banana
        rationale: "Observe as opções e escolha a que responde \"Como se escreve a fruta amarela comprida?\": 'banana'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'chocolate'? (late/te/cho/co)
        correctAnswer: te
        rationale: "A última sílaba de 'chocolate' é te."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o grão usado no café? (café/safé/tafé/kafe)
        correctAnswer: café
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o grão usado no café?\": 'café'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'água'? (4/3/2/5)
        correctAnswer: "3"
        rationale: "Observe as opções e escolha a que responde \"Quantas vogais tem 'água'?\": '3'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
