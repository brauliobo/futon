title: Palavras Simples - Família
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — família. Palavras de uso cotidiano."
example: "Aprenda palavras relacionadas à família. Ex.: Como se escreve o homem que é pai da sua mãe? → avô."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Membros da Família
    description: Identifique palavras da família.
    exercises:
      - type: reading
        question: Como se escreve o homem que é pai da sua mãe? (apô/avô/abô/afô)
        correctAnswer: avô
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o homem que é pai da sua mãe?\": 'avô'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'mamãe'? (2/5/4/3)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'mamãe' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a mulher que te deu à luz? (mãe/mão/mai/mae)
        correctAnswer: mãe
        rationale: "Observe as opções e escolha a que responde \"Como se escreve a mulher que te deu à luz?\": 'mãe'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'papai'? (b/p/f/m)
        correctAnswer: p
        rationale: "Em 'papai', a primeira letra é 'p'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o filho do seu tio? (premo/primmo/primo/prino)
        correctAnswer: primo
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o filho do seu tio?\": 'primo'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'irmã'? (3/5/4/6)
        correctAnswer: "4"
        rationale: "'irmã' tem 4 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a mãe do seu pai? (afó/abó/apó/avó)
        correctAnswer: avó
        rationale: "Observe as opções e escolha a que responde \"Como se escreve a mãe do seu pai?\": 'avó'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'irmão'? (rm/mão/ão/ir)
        correctAnswer: mão
        rationale: "A última sílaba de 'irm' é mão."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o homem casado com sua mãe? (pai/paí/pae/pay)
        correctAnswer: pai
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o homem casado com sua mãe?\": 'pai'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'tio'? (3/4/1/2)
        correctAnswer: "2"
        rationale: "Conte as vogais em 'tio': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
