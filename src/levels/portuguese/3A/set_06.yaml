title: Palavras Simples - Família
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — família. Palavras de uso cotidiano."
example: Aprenda palavras relacionadas à família.
pages:
  - pageNumber: 1
    title: Membros da Família
    description: Identifique palavras da família.
    exercises:
      - type: reading
        question: Como se escreve o homem que é pai da sua mãe? (avô/abô/afô/apô)
        correctAnswer: avô
        rationale: "Resposta: avô — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'mamãe'? (2/3/4/5)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'mamãe' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a mulher que te deu à luz? (mãe/mai/mão/mae)
        correctAnswer: mãe
        rationale: "Resposta: mãe — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'papai'? (p/b/m/f)
        correctAnswer: p
        rationale: "Resposta: p — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o filho do seu tio? (primo/primmo/prino/premo)
        correctAnswer: primo
        rationale: "Resposta: primo — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'irmã'? (3/4/5/6)
        correctAnswer: "4"
        rationale: "'irmã' tem 4 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a mãe do seu pai? (avó/abó/afó/apó)
        correctAnswer: avó
        rationale: "Resposta: avó — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'irmão'? (ir/mão/ão/rm)
        correctAnswer: mão
        rationale: "Resposta: mão — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o homem casado com sua mãe? (pai/pay/paí/pae)
        correctAnswer: pai
        rationale: "Resposta: pai — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'tio'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Resposta: 2 — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
