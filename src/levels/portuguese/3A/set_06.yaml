title: Palavras Simples - Família
level: 3A
subject: portuguese
example: Aprenda palavras relacionadas à família.
pages:
  - pageNumber: 1
    title: Membros da Família
    description: Identifique palavras da família.
    exercises:
      - { type: reading, question: ""Como se escreve o homem que é pai da sua mãe? (avô/abô/afô/apô)"", correctAnswer: "avô" }
      - { type: reading, question: ""Quantas sílabas tem 'mamãe'? (2/3/4/5)"", correctAnswer: "2" }
      - { type: reading, question: ""Como se escreve a mulher que te deu à luz? (mãe/mai/mão/mae)"", correctAnswer: "mãe" }
      - { type: reading, question: ""Qual é a primeira letra de 'papai'? (p/b/m/f)"", correctAnswer: "p" }
      - { type: reading, question: ""Como se escreve o filho do seu tio? (primo/primmo/prino/premo)"", correctAnswer: "primo" }
      - { type: reading, question: ""Quantas letras tem 'irmã'? (3/4/5/6)"", correctAnswer: "4" }
      - { type: reading, question: ""Como se escreve a mãe do seu pai? (avó/abó/afó/apó)"", correctAnswer: "avó" }
      - { type: reading, question: ""Qual é a última sílaba de 'irmão'? (ir/mão/ão/rm)"", correctAnswer: "mão" }
      - { type: reading, question: ""Como se escreve o homem casado com sua mãe? (pai/pay/paí/pae)"", correctAnswer: "pai" }
      - { type: reading, question: ""Quantas vogais tem 'tio'? (1/2/3/4)"", correctAnswer: "2" }
target: 10
