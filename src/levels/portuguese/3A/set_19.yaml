title: Sinônimos e Antônimos - Básico
level: 3A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/3A.
example: Identifique palavras com significados parecidos ou opostos.
pages:
  - pageNumber: 1
    title: Palavras Parecidas e Opostas
    description: Encontre sinônimos e antônimos simples.
    exercises:
      - { type: reading, question: "Qual palavra significa o mesmo que 'bonito'? (feio/belo/sujo/velho)", correctAnswer: "belo" }
      - { type: reading, question: "Qual é o oposto de 'grande'? (pequeno/médio/gigante/enorme)", correctAnswer: "pequeno" }
      - { type: reading, question: "Qual palavra significa o mesmo que 'feliz'? (triste/alegre/bravo/cansado)", correctAnswer: "alegre" }
      - { type: reading, question: "Qual é o oposto de 'quente'? (frio/morno/gelado/tépido)", correctAnswer: "frio" }
      - { type: reading, question: "Qual palavra significa o mesmo que 'rápido'? (lento/veloz/devagar/parado)", correctAnswer: "veloz" }
      - { type: reading, question: "Qual é o oposto de 'alto'? (baixo/médio/gigante/pequeno)", correctAnswer: "baixo" }
      - { type: reading, question: "Qual palavra significa o mesmo que 'começar'? (terminar/iniciar/parar/acabar)", correctAnswer: "iniciar" }
      - { type: reading, question: "Qual é o oposto de 'claro'? (escuro/brilhante/luminoso/branco)", correctAnswer: "escuro" }
      - { type: reading, question: "Qual palavra significa o mesmo que 'dormir'? (acordar/repousar/correr/brincar)", correctAnswer: "repousar" }
      - { type: reading, question: "Qual é o oposto de 'novo'? (moderno/velho/atual/recente)", correctAnswer: "velho" }
target: 10
