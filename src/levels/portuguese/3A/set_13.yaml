title: Palavras Simples - Natureza
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário de natureza. Palavras concretas do cotidiano."
example: Aprenda palavras relacionadas à natureza.
pages:
  - pageNumber: 1
    title: Elementos da Natureza
    description: Identifique palavras da natureza.
    exercises:
      - type: reading
        question: Como se escreve o que brilha no céu de dia? (sol/sal/sul/sil)
        correctAnswer: sol
        rationale: "A resposta correta é 'sol'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'lua'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'lua' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que cai do céu quando chove? (chuva/xuva/shuva/thuva)
        correctAnswer: chuva
        rationale: "A resposta correta é 'chuva'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'flor'? (f/v/p/b)
        correctAnswer: f
        rationale: "A resposta correta é 'f'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que é alto e tem folhas? (árvore/albore/arfore/arcore)
        correctAnswer: árvore
        rationale: "A resposta correta é 'árvore'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'mar'? (2/3/4/5)
        correctAnswer: "3"
        rationale: "'mar' tem 3 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve onde os peixes vivem? (rio/lio/mio/tio)
        correctAnswer: rio
        rationale: "A resposta correta é 'rio'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'montanha'? (mon/ta/nha/ha)
        correctAnswer: nha
        rationale: "A última sílaba de 'montanha' é nha."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que sopra e move as folhas? (vento/bento/fento/pento)
        correctAnswer: vento
        rationale: "A resposta correta é 'vento'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'terra'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "A resposta correta é '2'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
