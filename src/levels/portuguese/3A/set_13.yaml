title: Palavras Simples - Natureza
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário de natureza. Palavras concretas do cotidiano."
example: "Aprenda palavras relacionadas à natureza. Ex.: Como se escreve o que brilha no céu de dia? → sol."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Elementos da Natureza
    description: Identifique palavras da natureza.
    exercises:
      - type: reading
        question: Como se escreve o que brilha no céu de dia? (sol/sil/sul/sal)
        correctAnswer: sol
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que brilha no céu de dia?\": 'sol'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'lua'? (3/2/1/4)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'lua' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que cai do céu quando chove? (thuva/chuva/xuva/shuva)
        correctAnswer: chuva
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que cai do céu quando chove?\": 'chuva'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira letra de 'flor'? (p/b/f/v)
        correctAnswer: f
        rationale: "Em 'flor', a primeira letra é 'f'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que é alto e tem folhas? (arfore/arcore/albore/árvore)
        correctAnswer: árvore
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que é alto e tem folhas?\": 'árvore'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'mar'? (2/4/3/5)
        correctAnswer: "3"
        rationale: "'mar' tem 3 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve onde os peixes vivem? (mio/tio/lio/rio)
        correctAnswer: rio
        rationale: "Observe as opções e escolha a que responde \"Como se escreve onde os peixes vivem?\": 'rio'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última sílaba de 'montanha'? (nha/ta/mon/ha)
        correctAnswer: nha
        rationale: "A última sílaba de 'montanha' é nha."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve o que sopra e move as folhas? (bento/fento/pento/vento)
        correctAnswer: vento
        rationale: "Observe as opções e escolha a que responde \"Como se escreve o que sopra e move as folhas?\": 'vento'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'terra'? (1/3/2/4)
        correctAnswer: "2"
        rationale: "Conte as vogais em 'terra': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
