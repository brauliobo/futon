title: Palavras Simples - Natureza
level: 3A
subject: portuguese
example: Aprenda palavras relacionadas à natureza.
pages:
  - pageNumber: 1
    title: Elementos da Natureza
    description: Identifique palavras da natureza.
    exercises:
      - { type: reading, question: "Como se escreve o que brilha no céu de dia? (sol/sal/sul/sil)", correctAnswer: "sol" }
      - { type: reading, question: "Quantas sílabas tem 'lua'? (1/2/3/4)", correctAnswer: "2" }
      - { type: reading, question: "Como se escreve o que cai do céu quando chove? (chuva/xuva/shuva/thuva)", correctAnswer: "chuva" }
      - { type: reading, question: "Qual é a primeira letra de 'flor'? (f/v/p/b)", correctAnswer: "f" }
      - { type: reading, question: "Como se escreve o que é alto e tem folhas? (árvore/albore/arfore/arcore)", correctAnswer: "árvore" }
      - { type: reading, question: "Quantas letras tem 'mar'? (2/3/4/5)", correctAnswer: "3" }
      - { type: reading, question: "Como se escreve onde os peixes vivem? (rio/lio/mio/tio)", correctAnswer: "rio" }
      - { type: reading, question: "Qual é a última sílaba de 'montanha'? (mon/ta/nha/ha)", correctAnswer: "nha" }
      - { type: reading, question: "Como se escreve o que sopra e move as folhas? (vento/bento/fento/pento)", correctAnswer: "vento" }
      - { type: reading, question: "Quantas vogais tem 'terra'? (1/2/3/4)", correctAnswer: "2" }
target: 10
