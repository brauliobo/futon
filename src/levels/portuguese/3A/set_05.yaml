title: Palavras Simples - Cores
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — cores. Associe palavra à imagem."
example: Aprenda a ler e escrever nomes de cores.
pages:
  - pageNumber: 1
    title: Nomes de Cores
    description: Identifique e escreva nomes de cores.
    exercises:
      - type: reading
        question: Como se escreve a cor do sol? (amarelo/amarela/marelo/amrelo)
        correctAnswer: amarelo
        rationale: "A resposta correta é 'amarelo'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'azul'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'azul' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a cor das folhas? (verde/verd/ferde/berde)
        correctAnswer: verde
        rationale: "A resposta correta é 'verde'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última letra de 'rosa'? (a/o/s/r)
        correctAnswer: a
        rationale: "A resposta correta é 'a'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a cor da neve? (branco/blanco/franco/pranco)
        correctAnswer: branco
        rationale: "A resposta correta é 'branco'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'roxo'? (3/4/5/6)
        correctAnswer: "4"
        rationale: "'roxo' tem 4 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a cor da noite? (preto/peto/proto/predo)
        correctAnswer: preto
        rationale: "A resposta correta é 'preto'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira sílaba de 'laranja'? (la/ra/ja/ar)
        correctAnswer: la
        rationale: "A primeira sílaba de 'laranja' é 'la'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a cor mistura de branco e preto? (cinza/sinza/zinza/tinza)
        correctAnswer: cinza
        rationale: "A resposta correta é 'cinza'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'marrom'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "A resposta correta é '2'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
