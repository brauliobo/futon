title: Palavras Simples - Cores
level: 3A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — cores. Associe palavra à imagem."
example: "Aprenda a ler e escrever nomes de cores. Ex.: Como se escreve a cor do sol? → amarelo."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nomes de Cores
    description: Identifique e escreva nomes de cores.
    exercises:
      - type: reading
        question: Como se escreve a cor do sol? (amarela/amrelo/amarelo/marelo)
        correctAnswer: amarelo
        rationale: "Observe as opções e escolha a que responde \"Como se escreve a cor do sol?\": 'amarelo'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas sílabas tem 'azul'? (1/2/3/4)
        correctAnswer: "2"
        rationale: "Conte os pedaços de 'azul' — cada sílaba tem uma vogal forte: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a cor das folhas? (verde/ferde/verd/berde)
        correctAnswer: verde
        rationale: "Observe as opções e escolha a que responde \"Como se escreve a cor das folhas?\": 'verde'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a última letra de 'rosa'? (o/r/a/s)
        correctAnswer: a
        rationale: "Em 'rosa', a última letra é 'a'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a cor da neve? (blanco/pranco/branco/franco)
        correctAnswer: branco
        rationale: "Observe as opções e escolha a que responde \"Como se escreve a cor da neve?\": 'branco'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem 'roxo'? (3/5/6/4)
        correctAnswer: "4"
        rationale: "'roxo' tem 4 letras — conte uma a uma."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a cor da noite? (preto/predo/proto/peto)
        correctAnswer: preto
        rationale: "Observe as opções e escolha a que responde \"Como se escreve a cor da noite?\": 'preto'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual é a primeira sílaba de 'laranja'? (la/ra/ja/ar)
        correctAnswer: la
        rationale: "A primeira sílaba de 'laranja' é 'la'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Como se escreve a cor mistura de branco e preto? (cinza/zinza/sinza/tinza)
        correctAnswer: cinza
        rationale: "Observe as opções e escolha a que responde \"Como se escreve a cor mistura de branco e preto?\": 'cinza'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas vogais tem 'marrom'? (3/2/1/4)
        correctAnswer: "2"
        rationale: "Conte as vogais em 'marrom': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
