title: ✍️ Produção Textual - Parágrafo
level: E
subject: portuguese
difficulty: 3
objectives: [EF06LP10, EF07LP10]
authorNotes: Estrutura do parágrafo — frase-tópico, desenvolvimento e conclusão; coesão com conectivos.
example: "Parágrafo tem frase-tópico (ideia principal) + desenvolvimento + fecho. Use conectivos para ligar as ideias."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: O que é Parágrafo?
    description: Unidade de desenvolvimento de uma ideia.
    exercises:
      - type: paragraph
        question: "Para que serve o parágrafo? (decorar a página/organizar uma ideia com início, meio e fim/separar título do texto/numerar linhas)"
        correctAnswer: organizar uma ideia com início, meio e fim
        difficulty: 1
        rationale: Parágrafo organiza um bloco de ideias relacionadas — frase-tópico, desenvolvimento, conclusão.
        objectives: [EF06LP10]
  - pageNumber: 2
    title: Frase-Tópico
    description: A primeira frase que apresenta a ideia do parágrafo.
    exercises:
      - type: paragraph
        question: "Qual frase seria melhor frase-tópico? (Ontem fui ao mercado/A leitura traz inúmeros benefícios/Li um livro/Gosto de ler às vezes)"
        correctAnswer: A leitura traz inúmeros benefícios
        difficulty: 2
        rationale: Frase-tópico anuncia a ideia central de forma ampla e clara; as outras são muito específicas.
        objectives: [EF06LP10]
  - pageNumber: 3
    title: Desenvolvimento
    description: As frases que explicam ou provam a frase-tópico.
    exercises:
      - type: paragraph
        question: "No desenvolvimento, devemos: (repetir a frase-tópico/apresentar novos temas/explicar e exemplificar a ideia principal/mudar de assunto)"
        correctAnswer: explicar e exemplificar a ideia principal
        difficulty: 2
        rationale: O desenvolvimento sustenta a frase-tópico com argumentos, exemplos e detalhes.
        objectives: [EF06LP10]
  - pageNumber: 4
    title: Conclusão do Parágrafo
    description: Retoma ou fecha a ideia do parágrafo.
    exercises:
      - type: paragraph
        question: "A última frase do parágrafo deve: (introduzir ideia nova/retomar ou fechar a ideia central/ser a mais longa/repetir tudo)"
        correctAnswer: retomar ou fechar a ideia central
        difficulty: 2
        rationale: A conclusão do parágrafo amarra as ideias desenvolvidas, sem introduzir assuntos novos.
        objectives: [EF06LP10]
  - pageNumber: 5
    title: Coesão com Conectivos
    description: Conectivos ligam as ideias do parágrafo.
    exercises:
      - type: paragraph
        question: "Qual conectivo adiciona informação? (portanto/mas/além disso/no entanto)"
        correctAnswer: além disso
        difficulty: 2
        rationale: 'Além disso' é aditivo; portanto é conclusivo; mas/no entanto são adversativos.
        objectives: [EF07LP10]
  - pageNumber: 6
    title: Conectivos de Conclusão
    description: Introduzem a ideia final ou consequência.
    exercises:
      - type: paragraph
        question: "Qual conectivo é conclusivo? (todavia/entretanto/portanto/embora)"
        correctAnswer: portanto
        difficulty: 2
        rationale: Portanto e logo são conclusivos; todavia/entretanto são adversativos; embora é concessivo.
        objectives: [EF07LP10]
  - pageNumber: 7
    title: Unidade Temática
    description: Parágrafo deve tratar de apenas um assunto.
    exercises:
      - type: paragraph
        question: "Qual frase NÃO pertence a um parágrafo sobre água: (A água cobre 70% da Terra/Sem água não há vida/A água é essencial para os animais/O futebol é o esporte favorito do Brasil)"
        correctAnswer: O futebol é o esporte favorito do Brasil
        difficulty: 2
        rationale: Essa frase rompe a unidade temática — não tem relação com o tema água.
        objectives: [EF06LP10]
  - pageNumber: 8
    title: Progressão Textual
    description: Cada frase avança a ideia, sem repetição.
    exercises:
      - type: paragraph
        question: "O problema de repetir a mesma ideia em frases diferentes é: (o texto fica curto/não há progressão da ideia/fica mais claro/o leitor aprende mais)"
        correctAnswer: não há progressão da ideia
        difficulty: 2
        rationale: Repetição sem avanço não acrescenta informação — o texto não progride.
        objectives: [EF07LP10]
  - pageNumber: 9
    title: Indentação
    description: O parágrafo começa com recuo.
    exercises:
      - type: paragraph
        question: "O recuo no início do parágrafo serve para: (mostrar que o autor errou/indicar início de novo bloco de ideias/economizar papel/numerar parágrafos)"
        correctAnswer: indicar início de novo bloco de ideias
        difficulty: 1
        rationale: O recuo (indentação) marca visualmente o início de um novo parágrafo.
        objectives: [EF06LP10]
  - pageNumber: 10
    title: Revisão Integrada
    description: Avaliar a estrutura do parágrafo.
    exercises:
      - type: paragraph
        question: "Um bom parágrafo deve ter: (frase-tópico + exemplos + conclusão/muitas frases curtas sem relação/apenas a frase-tópico/apenas exemplos sem ideia central)"
        correctAnswer: frase-tópico + exemplos + conclusão
        difficulty: 2
        rationale: A estrutura clássica do parágrafo é frase-tópico (ideia), desenvolvimento (exemplos) e fecho.
        objectives: [EF07LP10]
target: 10
