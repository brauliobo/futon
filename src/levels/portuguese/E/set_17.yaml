title: 📚 Leitura - Texto Descritivo e Informativo
level: E
subject: portuguese
difficulty: 3
objectives: [EF06LP01, EF07LP02]
authorNotes: Interpretação de textos descritivos e informativos — ideia principal, detalhes, vocabulário em contexto.
example: "Texto informativo apresenta fatos. Identifique a ideia principal e os detalhes de apoio. Ex.: 'Abelhas vivem em colmeias e fazem polinização.' → ideia principal: abelhas são insetos sociais importantes para as plantas."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Texto Informativo
    description: |
      Leia e responda:
      "A abelha é um inseto social que vive em colônias chamadas colmeias. Cada colmeia tem uma rainha, obreiras e zangões. As obreiras coletam néctar das flores e produzem mel. As abelhas são essenciais para a polinização das plantas, garantindo a reprodução de muitas espécies vegetais."
    exercises:
      - type: paragraph
        question: "Qual é o assunto principal do texto? (mel/flores/abelhas/polinização)"
        correctAnswer: abelhas
        difficulty: 1
        rationale: O texto todo é sobre as abelhas — seu modo de vida, estrutura e importância.
        objectives: [EF06LP01]
  - pageNumber: 2
    title: Ideia Principal
    description: A informação mais importante do parágrafo.
    exercises:
      - type: paragraph
        question: "Qual afirmação resume melhor o texto? (abelhas produzem mel/abelhas são insetos sociais importantes para a polinização/flores precisam de néctar/colmeias têm rainhas)"
        correctAnswer: abelhas são insetos sociais importantes para a polinização
        difficulty: 2
        rationale: A ideia principal engloba tanto a estrutura social quanto a função ecológica das abelhas.
        objectives: [EF06LP01]
  - pageNumber: 3
    title: Informação Explícita
    description: Informação diretamente no texto.
    exercises:
      - type: paragraph
        question: "Quem coleta o néctar das flores? (rainha/zangões/obreiras/colmeia)"
        correctAnswer: obreiras
        difficulty: 1
        rationale: O texto afirma explicitamente que as obreiras coletam néctar.
        objectives: [EF06LP01]
  - pageNumber: 4
    title: Vocabulário em Contexto
    description: Significado de palavra pelo contexto.
    exercises:
      - type: paragraph
        question: "No texto, 'polinização' significa: (produção de mel/transporte de pólen entre flores/construção de colmeias/coleta de néctar)"
        correctAnswer: transporte de pólen entre flores
        difficulty: 2
        rationale: Polinização é o processo pelo qual o pólen é levado de uma flor a outra, garantindo reprodução.
        objectives: [EF07LP02]
  - pageNumber: 5
    title: Causa e Efeito
    description: Relação causal no texto informativo.
    exercises:
      - type: paragraph
        question: "Por que as abelhas são essenciais para as plantas? (produzem mel/vivem em colmeias/fazem a polinização/têm rainha)"
        correctAnswer: fazem a polinização
        difficulty: 2
        rationale: A polinização garante a reprodução das plantas — relação causa/efeito explícita no texto.
        objectives: [EF06LP01]
  - pageNumber: 6
    title: Detalhes de Apoio
    description: Informações que desenvolvem a ideia principal.
    exercises:
      - type: paragraph
        question: "Quais são os três tipos de abelhas mencionados? (rainha, obreira, zangão/rainha, obreira, larva/operária, rainha, filhote/drone, rainha, obreira)"
        correctAnswer: rainha, obreira, zangão
        difficulty: 2
        rationale: "O texto lista explicitamente: rainha, obreiras e zangões como membros da colmeia."
        objectives: [EF06LP01]
  - pageNumber: 7
    title: Inferência
    description: Conclusão baseada no texto mas não declarada.
    exercises:
      - type: paragraph
        question: "Se as abelhas desaparecessem, o que provavelmente aconteceria com as plantas? (cresceriam mais/muitas não conseguiriam se reproduzir/produziriam mais flores/ficariam mais bonitas)"
        correctAnswer: muitas não conseguiriam se reproduzir
        difficulty: 3
        rationale: Sem polinização, a reprodução das plantas seria comprometida — inferência lógica do texto.
        objectives: [EF07LP02]
  - pageNumber: 8
    title: Organização Textual
    description: Como o texto está estruturado.
    exercises:
      - type: paragraph
        question: "Como o texto é organizado? (narração de uma história/apresentação de dados e fatos sobre abelhas/diálogo entre personagens/poema sobre insetos)"
        correctAnswer: apresentação de dados e fatos sobre abelhas
        difficulty: 2
        rationale: Texto informativo apresenta fatos objetivos sem personagens ou enredo narrativo.
        objectives: [EF07LP02]
  - pageNumber: 9
    title: Finalidade do Texto
    description: Para que o texto foi escrito.
    exercises:
      - type: paragraph
        question: "A finalidade deste texto é: (entreter com uma história/convencer o leitor/informar sobre abelhas/ensinar a fazer mel)"
        correctAnswer: informar sobre abelhas
        difficulty: 2
        rationale: Textos informativos têm finalidade de transmitir conhecimento factual.
        objectives: [EF07LP02]
  - pageNumber: 10
    title: Linguagem do Texto
    description: Características da linguagem usada.
    exercises:
      - type: paragraph
        question: "A linguagem deste texto é: (subjetiva e emotiva/objetiva e informativa/poética e metafórica/informal e coloquial)"
        correctAnswer: objetiva e informativa
        difficulty: 3
        rationale: Textos informativos usam linguagem objetiva, sem emoções pessoais ou figuras de linguagem.
        objectives: [EF07LP02]
target: 10
