title: ✏️ Verbos - Tempos do Indicativo
level: E
subject: portuguese
difficulty: 3
objectives: [EF06LP05, EF07LP06]
authorNotes: Presente, pretérito perfeito e imperfeito do indicativo — formas e usos.
example: "Presente descreve agora ou habitualmente. Ex.: 'Eu canto' (presente) vs 'Eu cantei' (perfeito)."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Presente do Indicativo
    description: Ação que ocorre agora ou de forma habitual.
    exercises:
      - type: paragraph
        question: "Conjugue 'falar' na 3ª pessoa do singular, presente: (fala/falo/falas/falam)"
        correctAnswer: fala
        difficulty: 1
        rationale: Ele/ela fala — 3ª pessoa singular do presente do indicativo de falar.
        objectives: [EF06LP05]
  - pageNumber: 2
    title: Pretérito Perfeito
    description: Ação concluída no passado.
    exercises:
      - type: paragraph
        question: "Conjugue 'correr' na 1ª pessoa do singular, pretérito perfeito: (corri/corro/corria/correrei)"
        correctAnswer: corri
        difficulty: 2
        rationale: Eu corri — pretérito perfeito indica ação passada concluída.
        objectives: [EF06LP05]
  - pageNumber: 3
    title: Pretérito Imperfeito
    description: Ação passada habitual ou contínua.
    exercises:
      - type: paragraph
        question: "Conjugue 'brincar' na 1ª pessoa, pretérito imperfeito: (brincava/brinquei/brinco/brincarei)"
        correctAnswer: brincava
        difficulty: 2
        rationale: Eu brincava — imperfeito descreve hábito ou ação contínua no passado.
        objectives: [EF06LP05]
  - pageNumber: 4
    title: Futuro do Presente
    description: Ação que ocorrerá.
    exercises:
      - type: paragraph
        question: "Conjugue 'viajar' na 1ª pessoa, futuro do presente: (viajarei/viajei/viajava/viajo)"
        correctAnswer: viajarei
        difficulty: 2
        rationale: Eu viajarei — futuro indica ação que ainda vai acontecer.
        objectives: [EF07LP06]
  - pageNumber: 5
    title: Identificar o Tempo Verbal
    description: Reconheça o tempo do verbo na frase.
    exercises:
      - type: paragraph
        question: "Em 'Ela estudou ontem', o tempo verbal é: (presente/perfeito/imperfeito/futuro)"
        correctAnswer: perfeito
        difficulty: 2
        rationale: Estudou é pretérito perfeito — ação concluída ontem.
        objectives: [EF06LP05]
  - pageNumber: 6
    title: Imperfeito vs Perfeito
    description: Distinguir usos do imperfeito e perfeito.
    exercises:
      - type: paragraph
        question: "Em 'Quando criança, eu nadava todo dia', o verbo está no: (perfeito/imperfeito/presente/futuro)"
        correctAnswer: imperfeito
        difficulty: 2
        rationale: Nadava (imperfeito) descreve hábito passado; se fosse evento único seria perfeito.
        objectives: [EF06LP05]
  - pageNumber: 7
    title: Verbos Irregulares
    description: Alguns verbos têm formas especiais.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito de 'ir', 1ª pessoa singular: (foi/fui/ia/irei)"
        correctAnswer: fui
        difficulty: 3
        rationale: Ir é irregular — fui, foste, foi no pretérito perfeito.
        objectives: [EF07LP06]
  - pageNumber: 8
    title: Verbos Auxiliares
    description: Ter e haver formam tempos compostos.
    exercises:
      - type: paragraph
        question: "Em 'Eu tinha saído', o verbo auxiliar é: (saído/tinha/eu/já)"
        correctAnswer: tinha
        difficulty: 2
        rationale: Tinha é auxiliar que forma o pretérito mais-que-perfeito composto.
        objectives: [EF07LP06]
  - pageNumber: 9
    title: Concordância Verbal
    description: Verbo concorda com o sujeito.
    exercises:
      - type: paragraph
        question: "Complete: 'Os alunos ___ felizes.' (estão/está/esteve/estarão)"
        correctAnswer: estão
        difficulty: 2
        rationale: Alunos (plural) exige verbo no plural — estão.
        objectives: [EF06LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Conjugação em contexto amplo.
    exercises:
      - type: paragraph
        question: "Em 'Amanhã nós iremos ao parque', o tempo verbal é: (perfeito/imperfeito/presente/futuro)"
        correctAnswer: futuro
        difficulty: 3
        rationale: Iremos é futuro do presente — ação que acontecerá amanhã.
        objectives: [EF07LP06]
target: 10
