title: ✏️ Adjetivos
level: E
subject: portuguese
difficulty: 2
objectives: [EF06LP04, EF07LP05]
authorNotes: Adjetivo qualifica o substantivo. Flexões de gênero, número e grau. Locução adjetiva.
example: "Casa bonita → adjetivo 'bonita'"
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Identificar o Adjetivo
    description: Adjetivos atribuem característica ao substantivo.
    exercises:
      - type: paragraph
        question: "Qual é o adjetivo em 'céu azul'? (a/azul/céu/o)"
        correctAnswer: azul
        difficulty: 1
        rationale: Azul qualifica o substantivo céu.
        objectives: [EF06LP04]
  - pageNumber: 2
    title: Gênero
    description: Adjetivos concordam em gênero com o substantivo.
    exercises:
      - type: paragraph
        question: "Feminino de 'bom': (boã/bão/boa/boma)"
        correctAnswer: boa
        difficulty: 1
        rationale: Bom → boa é flexão regular de gênero.
        objectives: [EF06LP04]
  - pageNumber: 3
    title: Número
    description: Adjetivos concordam em número com o substantivo.
    exercises:
      - type: paragraph
        question: "Plural de 'azul': (azuli/azules/azulados/azuis)"
        correctAnswer: azuis
        difficulty: 2
        rationale: Adjetivos terminados em -l fazem plural em -is.
        objectives: [EF06LP04]
  - pageNumber: 4
    title: Grau Comparativo
    description: Expressa comparação de uma característica.
    exercises:
      - type: paragraph
        question: "Comparativo de superioridade de 'bom': (melhor/mais bom/bonzão/ótimo)"
        correctAnswer: melhor
        difficulty: 2
        rationale: "'Bom' tem comparativo irregular 'melhor'."
        objectives: [EF07LP05]
  - pageNumber: 5
    title: Grau Superlativo
    description: Superlativo absoluto ou relativo intensifica a característica.
    exercises:
      - type: paragraph
        question: "Superlativo absoluto sintético de 'fácil': (facílimo/mais fácil/facilzão/facilmente)"
        correctAnswer: facílimo
        difficulty: 3
        rationale: Facílimo é a forma sintética do superlativo absoluto.
        objectives: [EF07LP05]
  - pageNumber: 6
    title: Locução Adjetiva
    description: Expressão com valor de adjetivo — 'de ouro' = dourado.
    exercises:
      - type: paragraph
        question: "'Anel de ouro' é locução adjetiva equivalente a: (ornamentado/ouro/anel/dourado)"
        correctAnswer: dourado
        difficulty: 3
        rationale: "'De ouro' atribui característica; equivale ao adjetivo 'dourado'."
        objectives: [EF07LP05]
  - pageNumber: 7
    title: Adjetivos Compostos
    description: Formados por dois termos; a flexão ocorre no último.
    exercises:
      - type: paragraph
        question: "Plural de 'azul-claro': (azuis-claros/azul-claros/azuis-clarinhos/azuis-claro)"
        correctAnswer: azuis-claros
        difficulty: 3
        rationale: Em adjetivo composto, os dois elementos concordam quando o segundo é adjetivo.
        objectives: [EF07LP05]
  - pageNumber: 8
    title: Concordância Nominal
    description: O adjetivo concorda com o substantivo.
    exercises:
      - type: paragraph
        question: "'As alunas ___ chegaram'. (novas/nova/novos/novo)"
        correctAnswer: novas
        difficulty: 2
        rationale: "'Alunas' é feminino plural; adjetivo acompanha."
        objectives: [EF06LP04]
  - pageNumber: 9
    title: Adjetivos Pátrios
    description: Indicam origem ou nacionalidade.
    exercises:
      - type: paragraph
        question: "Adjetivo pátrio do estado do Rio de Janeiro: (brasiliense/carioca/fluminense/paulista)"
        correctAnswer: fluminense
        difficulty: 3
        rationale: "'Fluminense' é o pátrio do estado; 'carioca' refere-se à cidade do Rio; 'brasiliense/paulista' são de DF e SP."
        objectives: [EF07LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Reconheça e classifique adjetivos em contexto.
    exercises:
      - type: paragraph
        question: "Em 'É uma escola modelo', 'modelo' funciona como: (substantivo/adjetivo/advérbio/verbo)"
        correctAnswer: adjetivo
        difficulty: 4
        rationale: "'Modelo' aí qualifica o substantivo escola, atuando como adjetivo."
        objectives: [EF07LP05]
target: 10
