title: Preposições & Conjunções
level: E
subject: portuguese
difficulty: 3
objectives: [EF07LP09, EF08LP04]
authorNotes: Preposições ligam termos; conjunções ligam orações. Distinguir coordenativas e subordinativas.
example: "Preposição — 'a', 'de', 'para'. Conjunção — 'e', 'mas', 'porque'."
pages:
  - pageNumber: 1
    title: O Que É Preposição
    description: Palavras invariáveis que ligam termos, subordinando um ao outro.
    exercises:
      - type: paragraph
        question: "Qual é preposição? (de/e/mas/sim)"
        correctAnswer: de
        difficulty: 1
        rationale: "'De' conecta termos e subordina."
        objectives: [EF07LP09]
  - pageNumber: 2
    title: Preposições Essenciais
    description: A, ante, após, até, com, contra, de, desde, em, entre, para, perante, por, sem, sob, sobre, trás.
    exercises:
      - type: paragraph
        question: "Qual NÃO é preposição essencial? (logo/contra/até/desde)"
        correctAnswer: logo
        difficulty: 2
        rationale: "'Logo' é advérbio ou conjunção, não preposição."
        objectives: [EF07LP09]
  - pageNumber: 3
    title: Contração e Combinação
    description: "'De + o = do'; 'em + a = na'; 'a + o = ao'."
    exercises:
      - type: paragraph
        question: "'Em + as' resulta em: (nas/das/aos/pelos)"
        correctAnswer: nas
        difficulty: 2
        rationale: Contração regular — em + as = nas.
        objectives: [EF07LP09]
  - pageNumber: 4
    title: Locução Prepositiva
    description: Duas ou mais palavras com valor de preposição — 'acerca de', 'antes de'.
    exercises:
      - type: paragraph
        question: "Locução prepositiva: (acerca de/e/mas/logo)"
        correctAnswer: acerca de
        difficulty: 3
        rationale: "'Acerca de' é sequência fixa com função prepositiva."
        objectives: [EF07LP09]
  - pageNumber: 5
    title: O Que É Conjunção
    description: Palavras que ligam orações ou termos de mesma função.
    exercises:
      - type: paragraph
        question: "Qual é conjunção? (e/aqui/logo/muito)"
        correctAnswer: e
        difficulty: 1
        rationale: "'E' conecta orações ou termos equivalentes."
        objectives: [EF08LP04]
  - pageNumber: 6
    title: Coordenativas Aditivas
    description: E, nem, também, bem como.
    exercises:
      - type: paragraph
        question: "Aditiva: (e/mas/porém/porque)"
        correctAnswer: e
        difficulty: 1
        rationale: "'E' soma ideias."
        objectives: [EF08LP04]
  - pageNumber: 7
    title: Coordenativas Adversativas
    description: Mas, porém, contudo, todavia, entretanto.
    exercises:
      - type: paragraph
        question: "Adversativa: (porém/e/logo/por isso)"
        correctAnswer: porém
        difficulty: 2
        rationale: "'Porém' introduz oposição."
        objectives: [EF08LP04]
  - pageNumber: 8
    title: Subordinativas Causais
    description: Porque, pois, visto que, já que, como.
    exercises:
      - type: paragraph
        question: "Causal: (porque/embora/se/que)"
        correctAnswer: porque
        difficulty: 2
        rationale: "'Porque' apresenta a causa."
        objectives: [EF08LP04]
  - pageNumber: 9
    title: Subordinativas Concessivas
    description: Embora, ainda que, mesmo que, posto que.
    exercises:
      - type: paragraph
        question: "Concessiva: (embora/porque/assim/por isso)"
        correctAnswer: embora
        difficulty: 3
        rationale: "'Embora' admite objeção sem invalidar a ação."
        objectives: [EF08LP04]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique o conectivo em contexto.
    exercises:
      - type: paragraph
        question: "Em 'Estudei, mas não passei', 'mas' é: (adversativa/aditiva/causal/conclusiva)"
        correctAnswer: adversativa
        difficulty: 2
        rationale: Introduz oposição entre as duas ideias.
        objectives: [EF08LP04]
target: 10
