title: Substantivos
level: E
subject: portuguese
difficulty: 2
objectives: [EF06LP03, EF07LP04]
authorNotes: Identificação e classificação de substantivos — comuns, próprios, concretos, abstratos, coletivos.
example: "Livro é um substantivo comum, concreto. Ex.: Qual das palavras é um substantivo? → casa."
pages:
  - pageNumber: 1
    title: Definição de Substantivo
    description: Substantivos nomeiam seres, objetos, ideias, lugares.
    exercises:
      - type: paragraph
        question: "Qual das palavras é um substantivo? (casa/feliz/correr/rapidamente)"
        correctAnswer: casa
        difficulty: 1
        rationale: Substantivos nomeiam entidades; adjetivos qualificam; verbos indicam ação; advérbios modificam.
        objectives: [EF06LP03]
  - pageNumber: 2
    title: Comum vs Próprio
    description: Próprios nomeiam indivíduos específicos e começam com maiúscula.
    exercises:
      - type: paragraph
        question: "Qual é substantivo próprio? (Brasília/cidade/capital/país)"
        correctAnswer: Brasília
        difficulty: 1
        rationale: Próprios individualizam; comuns designam classes.
        objectives: [EF06LP03]
  - pageNumber: 3
    title: Concreto vs Abstrato
    description: Concretos existem por si; abstratos dependem de outro ser.
    exercises:
      - type: paragraph
        question: "Qual é substantivo abstrato? (alegria/mesa/árvore/cachorro)"
        correctAnswer: alegria
        difficulty: 2
        rationale: Sentimentos, ações e qualidades em estado são abstratos.
        objectives: [EF07LP04]
  - pageNumber: 4
    title: Coletivos
    description: Coletivos designam grupo de seres da mesma espécie.
    exercises:
      - type: paragraph
        question: "Coletivo de 'peixe': (cardume/manada/rebanho/alcateia)"
        correctAnswer: cardume
        difficulty: 2
        rationale: Cardume é o coletivo específico de peixes.
        objectives: [EF07LP04]
  - pageNumber: 5
    title: Gênero
    description: Substantivos têm gênero masculino ou feminino.
    exercises:
      - type: paragraph
        question: "Feminino de 'cidadão': (cidadã/cidadoa/cidadoã/cidadãozinha)"
        correctAnswer: cidadã
        difficulty: 2
        rationale: Cidadã é a forma feminina canônica de cidadão.
        objectives: [EF06LP03]
  - pageNumber: 6
    title: Número
    description: Singular / plural; regras de pluralização.
    exercises:
      - type: paragraph
        question: "Plural de 'cidadão': (cidadãos/cidadões/cidadães/cidadans)"
        correctAnswer: cidadãos
        difficulty: 2
        rationale: Nomes em -ão têm plural variável; cidadão faz cidadãos.
        objectives: [EF06LP03]
  - pageNumber: 7
    title: Grau
    description: Aumentativo e diminutivo expressam tamanho ou afeto.
    exercises:
      - type: paragraph
        question: "Aumentativo de 'casa': (casarão/casinha/casona/casinhão)"
        correctAnswer: casarão
        difficulty: 2
        rationale: Casarão é o aumentativo canônico de casa.
        objectives: [EF07LP04]
  - pageNumber: 8
    title: Substantivos Compostos
    description: Formados pela junção de duas ou mais palavras.
    exercises:
      - type: paragraph
        question: "Plural de 'guarda-chuva': (guarda-chuvas/guardas-chuva/guardas-chuvas/guarda-chuvinhas)"
        correctAnswer: guarda-chuvas
        difficulty: 3
        rationale: Em guarda-chuva, apenas o segundo elemento varia no plural porque o primeiro é verbo invariável.
        objectives: [EF07LP04]
  - pageNumber: 9
    title: Substantivos Derivados
    description: Derivados vêm de outra palavra por sufixação ou prefixação.
    exercises:
      - type: paragraph
        question: "Qual é derivado? (livraria/livro/papel/leitura)"
        correctAnswer: livraria
        difficulty: 3
        rationale: Livraria deriva de livro + sufixo -aria; livro é primitivo.
        objectives: [EF07LP04]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique o substantivo em contexto.
    exercises:
      - type: paragraph
        question: "Em 'A honestidade é rara', 'honestidade' é: (abstrato/concreto/próprio/coletivo)"
        correctAnswer: abstrato
        difficulty: 3
        rationale: Honestidade é qualidade, categoria típica de substantivos abstratos.
        objectives: [EF07LP04]
target: 10
