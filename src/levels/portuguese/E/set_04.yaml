title: Pronomes
level: E
subject: portuguese
difficulty: 3
objectives: [EF06LP06, EF07LP07]
authorNotes: Pessoais (reto/oblíquo), possessivos, demonstrativos, indefinidos, interrogativos, relativos, de tratamento.
example: "Eu, me, mim, meu, esta, qual, quem. Ex.: Pronome interrogativo em '___ chegou primeiro?' → Quem."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Pessoais Retos
    description: Função sujeito — eu, tu, ele, nós, vós, eles.
    exercises:
      - type: paragraph
        question: "Pronome pessoal reto: (me/comigo/eu/mim)"
        correctAnswer: eu
        difficulty: 1
        rationale: "'Eu' é a forma reta; as outras são oblíquas."
        objectives: [EF06LP06]
  - pageNumber: 2
    title: Pessoais Oblíquos
    description: Função de complemento — me, te, se, o, a, lhe, nos, vos, lhes.
    exercises:
      - type: paragraph
        question: "Em 'Ele me viu', 'me' é: (reto/demonstrativo/possessivo/oblíquo átono)"
        correctAnswer: oblíquo átono
        difficulty: 2
        rationale: Oblíquos átonos funcionam como objetos verbais sem acento próprio.
        objectives: [EF07LP07]
  - pageNumber: 3
    title: Possessivos
    description: Indicam posse — meu, teu, seu, nosso, vosso.
    exercises:
      - type: paragraph
        question: "Pronome possessivo: (eu/nele/nós/nosso)"
        correctAnswer: nosso
        difficulty: 1
        rationale: Possessivo indica a quem pertence o substantivo.
        objectives: [EF06LP06]
  - pageNumber: 4
    title: Demonstrativos
    description: Este (perto de mim), esse (perto de ti), aquele (distante dos dois).
    exercises:
      - type: paragraph
        question: "Para algo distante dos dois: (aqui/esse/este/aquele)"
        correctAnswer: aquele
        difficulty: 2
        rationale: "'Aquele' indica terceira pessoa / afastamento de ambos os falantes."
        objectives: [EF07LP07]
  - pageNumber: 5
    title: Indefinidos
    description: Algum, nenhum, todo, qualquer, alguém, ninguém, tudo, nada.
    exercises:
      - type: paragraph
        question: "Pronome indefinido: (ela/meu/qual/alguém)"
        correctAnswer: alguém
        difficulty: 2
        rationale: Alguém refere-se a pessoa indefinida.
        objectives: [EF06LP06]
  - pageNumber: 6
    title: Interrogativos
    description: Que, quem, qual, quanto — em perguntas diretas ou indiretas.
    exercises:
      - type: paragraph
        question: "Pronome interrogativo em '___ chegou primeiro?' (Esse/Meu/Quem/Alguém)"
        correctAnswer: Quem
        difficulty: 2
        rationale: Quem questiona sobre pessoa sujeito.
        objectives: [EF07LP07]
  - pageNumber: 7
    title: Relativos
    description: Que, quem, o qual, cujo, onde — introduzem orações adjetivas.
    exercises:
      - type: paragraph
        question: "Pronome relativo em 'A pessoa ___ chegou é meu amigo'. (que/nela/aquela/essa)"
        correctAnswer: que
        difficulty: 3
        rationale: "'Que' retoma 'a pessoa' e liga à oração."
        objectives: [EF07LP07]
  - pageNumber: 8
    title: Pronomes de Tratamento
    description: Você, senhor, Vossa Excelência, Vossa Santidade.
    exercises:
      - type: paragraph
        question: "Tratamento formal a juiz: (Vossa Santidade/Você/Vossa Majestade/Vossa Excelência)"
        correctAnswer: Vossa Excelência
        difficulty: 3
        rationale: Vossa Excelência é o tratamento formal para autoridades judiciais.
        objectives: [EF07LP07]
  - pageNumber: 9
    title: Colocação Pronominal
    description: Próclise, mesóclise, ênclise.
    exercises:
      - type: paragraph
        question: "Em 'Dar-te-ei a resposta', o pronome 'te' está em: (ênclise/adjacência/próclise/mesóclise)"
        correctAnswer: mesóclise
        difficulty: 4
        rationale: Mesóclise — pronome entre o radical e a desinência do futuro.
        objectives: [EF07LP07]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique o pronome em contexto.
    exercises:
      - type: paragraph
        question: "Em 'Aquilo foi incrível', 'aquilo' é: (indefinido/relativo/demonstrativo/pessoal)"
        correctAnswer: demonstrativo
        difficulty: 3
        rationale: Aquilo indica algo afastado, típico demonstrativo neutro.
        objectives: [EF07LP07]
target: 10
