title: Verbos - Conceitos Básicos
level: E
subject: portuguese
difficulty: 3
objectives: [EF06LP05, EF07LP06]
authorNotes: Identificação do verbo, conjugações (1ª -ar, 2ª -er, 3ª -ir), modos (indicativo, subjuntivo, imperativo), tempos principais. Conjugação detalhada fica no nível F.
example: "Cantar — 1ª conjugação, modo indicativo. Ex.: Qual palavra é verbo? → correr."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: O Que É Verbo
    description: Verbo exprime ação, estado ou fenômeno da natureza.
    exercises:
      - type: paragraph
        question: "Qual palavra é verbo? (correr/rápido/corredor/corrida)"
        correctAnswer: correr
        difficulty: 1
        rationale: Correr indica ação; os demais são adjetivo e substantivos.
        objectives: [EF06LP05]
  - pageNumber: 2
    title: Conjugações
    description: Três conjugações pela terminação do infinitivo.
    exercises:
      - type: paragraph
        question: "'Partir' pertence à: (3ª conjugação/1ª conjugação/2ª conjugação/4ª conjugação)"
        correctAnswer: 3ª conjugação
        difficulty: 2
        rationale: Infinitivo em -ir indica a 3ª conjugação.
        objectives: [EF06LP05]
  - pageNumber: 3
    title: Modo Indicativo
    description: Expressa fato real ou certo.
    exercises:
      - type: paragraph
        question: "Frase em modo indicativo: (Eu estudo todo dia/Que eu estude/Estude agora/Estudar é bom)"
        correctAnswer: Eu estudo todo dia
        difficulty: 2
        rationale: Indicativo apresenta o fato como certo; 'que eu estude' é subjuntivo.
        objectives: [EF07LP06]
  - pageNumber: 4
    title: Modo Subjuntivo
    description: Expressa dúvida, desejo, hipótese.
    exercises:
      - type: paragraph
        question: "Frase em modo subjuntivo: (Espero que ele venha/Ele vem amanhã/Venha agora/Vir é preciso)"
        correctAnswer: Espero que ele venha
        difficulty: 3
        rationale: Subjuntivo acompanha verbos de desejo/dúvida, como 'esperar que'.
        objectives: [EF07LP06]
  - pageNumber: 5
    title: Modo Imperativo
    description: Expressa ordem, pedido, conselho.
    exercises:
      - type: paragraph
        question: "Verbo no imperativo: (Estude!/Estuda/Estudei/Estudar)"
        correctAnswer: Estude!
        difficulty: 2
        rationale: Forma imperativa típica; 'estuda' é afirmativo de 'tu'; 'estudei' é indicativo perfeito.
        objectives: [EF07LP06]
  - pageNumber: 6
    title: Tempo Presente
    description: Ação no momento em que se fala ou habitual.
    exercises:
      - type: paragraph
        question: "Verbo no presente: (Ele estuda/Ele estudou/Ele estudará/Ele estudava)"
        correctAnswer: Ele estuda
        difficulty: 1
        rationale: Estuda indica ação atual / habitual.
        objectives: [EF06LP05]
  - pageNumber: 7
    title: Tempo Pretérito
    description: Ação anterior ao momento de fala.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito de 'cantar' (ele): (cantou/cantava/cantará/cante)"
        correctAnswer: cantou
        difficulty: 2
        rationale: Perfeito do indicativo — ação pontual no passado.
        objectives: [EF07LP06]
  - pageNumber: 8
    title: Tempo Futuro
    description: Ação posterior ao momento de fala.
    exercises:
      - type: paragraph
        question: "Futuro do presente de 'cantar' (eu): (cantarei/canto/cantei/cantasse)"
        correctAnswer: cantarei
        difficulty: 2
        rationale: Futuro do presente — ação que se realizará.
        objectives: [EF07LP06]
  - pageNumber: 9
    title: Formas Nominais
    description: Infinitivo, gerúndio e particípio não expressam tempo próprio.
    exercises:
      - type: paragraph
        question: "Gerúndio de 'correr': (correndo/correr/corrido/correrá)"
        correctAnswer: correndo
        difficulty: 2
        rationale: Gerúndio indica ação em curso.
        objectives: [EF06LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique verbos em contexto.
    exercises:
      - type: paragraph
        question: "Em 'Se eu estudasse, passaria', 'estudasse' está em modo: (subjuntivo/indicativo/imperativo/infinitivo)"
        correctAnswer: subjuntivo
        difficulty: 4
        rationale: Oração hipotética pede pretérito imperfeito do subjuntivo.
        objectives: [EF07LP06]
target: 10
