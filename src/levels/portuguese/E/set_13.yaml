title: 🔬 Análise Sintática - Complementos Verbais
level: E
subject: portuguese
difficulty: 3
objectives: [EF07LP08, EF08LP06]
authorNotes: Objeto direto, objeto indireto, complemento nominal e agente da passiva.
example: "OD responde 'o quê?'; OI responde 'a quem?' ou 'para quem?'. Ex.: 'Comprei um livro' — OD: um livro."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Objeto Direto
    description: Completa verbos transitivos diretos sem preposição.
    exercises:
      - type: paragraph
        question: "Em 'Ela comprou flores', o objeto direto é: (ela/comprou/flores/comprou flores)"
        correctAnswer: flores
        difficulty: 1
        rationale: OD responde 'ela comprou o quê? → flores'; sem preposição.
        objectives: [EF07LP08]
  - pageNumber: 2
    title: Objeto Indireto
    description: Completa verbos com preposição obrigatória.
    exercises:
      - type: paragraph
        question: "Em 'Ele gosta de música', o objeto indireto é: (ele/gosta/de música/música)"
        correctAnswer: de música
        difficulty: 2
        rationale: Gostar exige preposição 'de'; de música é OI.
        objectives: [EF07LP08]
  - pageNumber: 3
    title: OD vs OI
    description: Distinguir pelo uso ou ausência de preposição.
    exercises:
      - type: paragraph
        question: "Em 'Dei flores à Maria', qual é o OD? (dei/flores/à Maria/Maria)"
        correctAnswer: flores
        difficulty: 2
        rationale: Flores é OD (sem preposição); à Maria é OI (com preposição 'a').
        objectives: [EF07LP08]
  - pageNumber: 4
    title: Verbo Transitivo Direto
    description: VTD exige OD para completar o sentido.
    exercises:
      - type: paragraph
        question: "Qual verbo é transitivo direto? (gostar/depender/amar/precisar)"
        correctAnswer: amar
        difficulty: 2
        rationale: Amar alguém — OD sem preposição; gostar, depender e precisar pedem preposição.
        objectives: [EF07LP08]
  - pageNumber: 5
    title: Verbo Transitivo Indireto
    description: VTI exige OI com preposição.
    exercises:
      - type: paragraph
        question: "Qual verbo é transitivo indireto? (comer/ver/obedecer/trazer)"
        correctAnswer: obedecer
        difficulty: 3
        rationale: Obedecer a alguém — pede preposição 'a'; os outros são transitivos diretos.
        objectives: [EF07LP08]
  - pageNumber: 6
    title: Verbo Bitransitivo
    description: Exige OD e OI ao mesmo tempo.
    exercises:
      - type: paragraph
        question: "Em 'Enviei uma carta ao diretor', 'uma carta' é: (sujeito/OD/OI/predicado)"
        correctAnswer: OD
        difficulty: 2
        rationale: Enviar alguém algo — carta é OD; ao diretor é OI; verbo é bitransitivo.
        objectives: [EF08LP06]
  - pageNumber: 7
    title: Adjunto Adverbial
    description: Circunstância (tempo, lugar, modo) que não é exigida pelo verbo.
    exercises:
      - type: paragraph
        question: "Em 'Estudei muito ontem', 'ontem' é: (sujeito/OD/adjunto adverbial/predicado)"
        correctAnswer: adjunto adverbial
        difficulty: 2
        rationale: Ontem indica circunstância de tempo — adjunto adverbial, não exigido pelo verbo.
        objectives: [EF08LP06]
  - pageNumber: 8
    title: Adjunto Adnominal
    description: Modifica um substantivo.
    exercises:
      - type: paragraph
        question: "Em 'O livro bonito chegou', 'bonito' é: (sujeito/OD/adjunto adnominal/predicativo)"
        correctAnswer: adjunto adnominal
        difficulty: 2
        rationale: Bonito qualifica o substantivo livro — adjunto adnominal.
        objectives: [EF08LP06]
  - pageNumber: 9
    title: Agente da Passiva
    description: Quem pratica a ação na voz passiva.
    exercises:
      - type: paragraph
        question: "Em 'O bolo foi feito pela avó', o agente da passiva é: (o bolo/foi feito/pela avó/avó)"
        correctAnswer: pela avó
        difficulty: 3
        rationale: Na voz passiva, o agente vem introduzido por 'por' — pela avó.
        objectives: [EF08LP06]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique os termos sintáticos em contexto.
    exercises:
      - type: paragraph
        question: "Em 'O professor ensinou matemática aos alunos', o OD é: (o professor/ensinou/matemática/aos alunos)"
        correctAnswer: matemática
        difficulty: 3
        rationale: Matemática é OD (sem preposição); aos alunos é OI (preposição 'a').
        objectives: [EF08LP06]
target: 10
