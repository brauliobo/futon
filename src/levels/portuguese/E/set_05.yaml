title: Advérbios
level: E
subject: portuguese
difficulty: 3
objectives: [EF06LP07, EF07LP08]
authorNotes: Advérbios modificam verbos, adjetivos ou outros advérbios. Classificação por circunstância — tempo, modo, lugar, intensidade, afirmação, negação, dúvida.
example: "Ele chegou cedo → 'cedo' é advérbio de tempo."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: O Que É Advérbio
    description: Advérbios não variam e modificam verbo, adjetivo ou advérbio.
    exercises:
      - type: paragraph
        question: "Qual é advérbio? (rápido/rapidez/rápida/rapidamente)"
        correctAnswer: rapidamente
        difficulty: 1
        rationale: Advérbios em -mente modificam, não flexionam.
        objectives: [EF06LP07]
  - pageNumber: 2
    title: Tempo
    description: Hoje, ontem, amanhã, já, agora, cedo, tarde, sempre.
    exercises:
      - type: paragraph
        question: "Advérbio de tempo: (muito/aqui/sim/ontem)"
        correctAnswer: ontem
        difficulty: 1
        rationale: Ontem situa a ação no tempo.
        objectives: [EF06LP07]
  - pageNumber: 3
    title: Lugar
    description: Aqui, ali, lá, perto, longe, dentro, fora.
    exercises:
      - type: paragraph
        question: "Advérbio de lugar: (aqui/muito/sempre/talvez)"
        correctAnswer: aqui
        difficulty: 1
        rationale: Aqui indica posição espacial.
        objectives: [EF06LP07]
  - pageNumber: 4
    title: Modo
    description: Bem, mal, assim, rapidamente, depressa.
    exercises:
      - type: paragraph
        question: "Advérbio de modo: (hoje/não/bem/aqui)"
        correctAnswer: bem
        difficulty: 2
        rationale: "'Bem' indica a forma como a ação ocorre."
        objectives: [EF07LP08]
  - pageNumber: 5
    title: Intensidade
    description: Muito, pouco, bastante, tão, demais.
    exercises:
      - type: paragraph
        question: "Advérbio de intensidade: (muito/amanhã/talvez/ali)"
        correctAnswer: muito
        difficulty: 2
        rationale: Muito modifica em grau; típico de intensidade.
        objectives: [EF07LP08]
  - pageNumber: 6
    title: Afirmação
    description: Sim, certamente, realmente, decerto.
    exercises:
      - type: paragraph
        question: "Advérbio de afirmação: (talvez/aqui/sim/nunca)"
        correctAnswer: sim
        difficulty: 1
        rationale: Sim reafirma o enunciado.
        objectives: [EF06LP07]
  - pageNumber: 7
    title: Negação
    description: Não, nunca, jamais, tampouco.
    exercises:
      - type: paragraph
        question: "Advérbio de negação: (jamais/muito/sim/hoje)"
        correctAnswer: jamais
        difficulty: 2
        rationale: Jamais nega enfaticamente.
        objectives: [EF07LP08]
  - pageNumber: 8
    title: Dúvida
    description: Talvez, possivelmente, quiçá, acaso.
    exercises:
      - type: paragraph
        question: "Advérbio de dúvida: (talvez/muito/ontem/sim)"
        correctAnswer: talvez
        difficulty: 2
        rationale: Talvez expressa incerteza.
        objectives: [EF07LP08]
  - pageNumber: 9
    title: Locução Adverbial
    description: Conjunto que funciona como advérbio — às vezes, de repente, à noite.
    exercises:
      - type: paragraph
        question: "Locução adverbial de tempo: (muito/aqui/às vezes/ontem)"
        correctAnswer: às vezes
        difficulty: 3
        rationale: Expressão composta com valor adverbial.
        objectives: [EF07LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique circunstâncias expressas por advérbios.
    exercises:
      - type: paragraph
        question: "Em 'Ele chegou cedo e falou baixo', os advérbios são: (chegou e cedo/ele e falou/cedo e baixo/cedo e ele)"
        correctAnswer: cedo e baixo
        difficulty: 3
        rationale: "'Cedo' é advérbio de tempo; 'baixo' é de modo."
        objectives: [EF07LP08]
target: 10
