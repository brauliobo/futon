title: 🔀 Competência 4 ENEM — Coesão
level: L
subject: portuguese
difficulty: 5
objectives: [EM13LP45, ENEM.comp4]
authorNotes: Competência 4 avalia os mecanismos linguísticos que garantem a progressão e articulação do texto — coesão referencial e sequencial.
example: "Coesão é a costura do texto. Ex.: 'tal fenômeno' retomando 'desigualdade digital' → coesão referencial por demonstrativo."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: O que é Competência 4
    description: Entender o objeto da C4.
    exercises:
      - type: paragraph
        question: "A competência 4 avalia: (a gramática/a proposta de intervenção/os mecanismos de coesão textual/o repertório)"
        correctAnswer: os mecanismos de coesão textual
        difficulty: 2
        rationale: C4 mede o uso dos recursos linguísticos que garantem a articulação do texto.
        objectives: [ENEM.comp4]
  - pageNumber: 2
    title: Coesão Referencial
    description: Retomar elementos sem repetir.
    exercises:
      - type: paragraph
        question: "Substituir 'jovens em situação de risco' por 'esse grupo vulnerável' é: (pleonasmo/erro/coesão referencial/coesão sequencial)"
        correctAnswer: coesão referencial
        difficulty: 2
        rationale: Coesão referencial usa pronomes e expressões nominais para retomar termos.
        objectives: [ENEM.comp4]
  - pageNumber: 3
    title: Coesão Sequencial
    description: Articular as partes do texto.
    exercises:
      - type: paragraph
        question: "Usar 'além disso', 'em contrapartida' e 'portanto' entre parágrafos é: (argumentação/coesão referencial/coesão sequencial/coerência)"
        correctAnswer: coesão sequencial
        difficulty: 3
        rationale: Coesão sequencial usa conectivos para articular a progressão textual.
        objectives: [ENEM.comp4]
  - pageNumber: 4
    title: Repetição Desnecessária
    description: Evitar reiterar o mesmo termo.
    exercises:
      - type: paragraph
        question: "Repetir 'educação' doze vezes em uma redação indica: (ênfase/domínio do tema/pobreza de recursos coesivos/estilo pessoal)"
        correctAnswer: pobreza de recursos coesivos
        difficulty: 3
        rationale: Repetição excessiva sinaliza falta de domínio dos mecanismos coesivos.
        objectives: [ENEM.comp4]
  - pageNumber: 5
    title: Elipse
    description: Omitir termo já conhecido.
    exercises:
      - type: paragraph
        question: "'O governo propôs reformas e [o governo] as implementou.' A omissão do sujeito é: (erro/elipse coesiva/ambiguidade/crase)"
        correctAnswer: elipse coesiva
        difficulty: 3
        rationale: Elipse omite termo recuperável pelo contexto, garantindo concisão e fluidez.
        objectives: [EM13LP45]
  - pageNumber: 6
    title: Coesão por Sinonímia
    description: Usar sinônimo para retomar.
    exercises:
      - type: paragraph
        question: "Retomar 'desemprego' com 'crise laboral' é coesão por: (elipse/sinonímia contextual/referência pronominal/conjunção)"
        correctAnswer: sinonímia contextual
        difficulty: 4
        rationale: Sinônimos contextuais evitam repetição e enriquecem o texto.
        objectives: [EM13LP45]
  - pageNumber: 7
    title: Uso de Pronomes
    description: Pronomes como recurso coesivo.
    exercises:
      - type: paragraph
        question: "'O Congresso aprovou a lei. Ela entra em vigor em 2025.' 'Ela' exerce função de: (sujeito sem antecedente/pronome coesivo referencial/erro de concordância/elipse)"
        correctAnswer: pronome coesivo referencial
        difficulty: 4
        rationale: O pronome 'ela' retoma 'a lei', garantindo coesão referencial.
        objectives: [ENEM.comp4]
  - pageNumber: 8
    title: Ruptura Coesiva
    description: Identificar quebra na costura textual.
    exercises:
      - type: paragraph
        question: "Iniciar parágrafo sem conectivo ou retomada do anterior causa: (originalidade/ruptura coesiva — dificulta a leitura/efeito estilístico/brevidade)"
        correctAnswer: ruptura coesiva — dificulta a leitura
        difficulty: 4
        rationale: A falta de articulação entre parágrafos fragmenta o texto e prejudica a C4.
        objectives: [ENEM.comp4]
  - pageNumber: 9
    title: Coesão Entre Introdução e Conclusão
    description: Retomar a tese na conclusão.
    exercises:
      - type: paragraph
        question: "Retomar a tese da introdução na conclusão com novas palavras é: (repetição/coesão estrutural que dá unidade/erro/tangenciamento)"
        correctAnswer: coesão estrutural que dá unidade
        difficulty: 5
        rationale: A retomada da tese na conclusão fecha o círculo argumentativo do texto.
        objectives: [ENEM.comp4]
  - pageNumber: 10
    title: Nota 200 na C4
    description: Critérios para coesão máxima.
    exercises:
      - type: paragraph
        question: "Para 200 na C4, o texto deve apresentar: (ausência de conectivos/uso diversificado e preciso de recursos coesivos sem rupturas/repetições intencionais/parágrafos curtos)"
        correctAnswer: uso diversificado e preciso de recursos coesivos sem rupturas
        difficulty: 5
        rationale: C4 máxima exige variedade, precisão e continuidade coesiva em todo o texto.
        objectives: [ENEM.comp4]
target: 10
