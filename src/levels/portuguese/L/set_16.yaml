title: 🏗️ Competência 5 ENEM — Proposta de Intervenção Completa
level: L
subject: portuguese
difficulty: 5
objectives: [ENEM.comp5]
authorNotes: Competência 5 avalia a proposta de intervenção. São 5 elementos obrigatórios — agente, ação, modo/meio, finalidade, detalhamento — e respeito aos direitos humanos.
example: "Proposta completa vale 200 pontos. Ex.: 'O MEC (agente) deve implementar (ação) campanhas via redes sociais (meio) para conscientizar jovens (finalidade), com parceria de influenciadores educacionais (detalhamento)'."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Os 5 Elementos da Proposta
    description: Conhecer os componentes obrigatórios.
    exercises:
      - type: paragraph
        question: "A proposta de intervenção no ENEM exige: (só agente e ação/agente + ação + meio + finalidade + detalhamento/apenas a solução/uma lei nova)"
        correctAnswer: agente + ação + meio + finalidade + detalhamento
        difficulty: 2
        rationale: Os 5 elementos são obrigatórios para nota máxima na C5.
        objectives: [ENEM.comp5]
  - pageNumber: 2
    title: O Agente
    description: Quem vai executar a ação.
    exercises:
      - type: paragraph
        question: "O agente da proposta de intervenção deve ser: (o candidato/uma entidade concreta como governo ou escola/a sociedade em geral/qualquer pessoa)"
        correctAnswer: uma entidade concreta como governo ou escola
        difficulty: 2
        rationale: O agente precisa ser específico e ter poder real de executar a ação proposta.
        objectives: [ENEM.comp5]
  - pageNumber: 3
    title: A Ação
    description: O que o agente deve fazer.
    exercises:
      - type: paragraph
        question: "'O governo deve fazer algo.' Esta proposta é fraca porque a ação: (é muito curta/é vaga e não especifica o que fazer/usa 'deve'/menciona o governo)"
        correctAnswer: é vaga e não especifica o que fazer
        difficulty: 3
        rationale: A ação deve ser específica, como 'implementar', 'criar', 'ampliar'.
        objectives: [ENEM.comp5]
  - pageNumber: 4
    title: Modo e Meio
    description: Como a ação será executada.
    exercises:
      - type: paragraph
        question: "Em 'campanhas educativas via redes sociais', a expressão 'via redes sociais' indica: (a finalidade/o agente/o meio/o detalhamento)"
        correctAnswer: o meio
        difficulty: 3
        rationale: O meio especifica como a ação será realizada ou veiculada.
        objectives: [ENEM.comp5]
  - pageNumber: 5
    title: A Finalidade
    description: Para que serve a ação.
    exercises:
      - type: paragraph
        question: "'… a fim de reduzir o bullying escolar.' A expressão 'a fim de' introduz: (o agente/a ação/a finalidade/o detalhamento)"
        correctAnswer: a finalidade
        difficulty: 3
        rationale: A finalidade explica o objetivo da ação proposta.
        objectives: [ENEM.comp5]
  - pageNumber: 6
    title: O Detalhamento
    description: Especificar e aprofundar a proposta.
    exercises:
      - type: paragraph
        question: "Adicionar 'com treinamento de professores e apoio psicológico' é o elemento de: (ação/finalidade/detalhamento/agente)"
        correctAnswer: detalhamento
        difficulty: 4
        rationale: O detalhamento especifica como a proposta funcionará na prática.
        objectives: [ENEM.comp5]
  - pageNumber: 7
    title: Direitos Humanos
    description: Proposta não pode violar direitos.
    exercises:
      - type: paragraph
        question: "Proposta que sugere punição corporal para reduzir criminalidade viola: (a coesão/a gramática/os direitos humanos — causa nota zero na C5/o tema)"
        correctAnswer: os direitos humanos — causa nota zero na C5
        difficulty: 4
        rationale: Propostas que violam direitos humanos resultam em nota zero na competência 5.
        objectives: [ENEM.comp5]
  - pageNumber: 8
    title: Viabilidade da Proposta
    description: A proposta deve ser exequível.
    exercises:
      - type: paragraph
        question: "Propor 'eliminar toda a pobreza em 1 ano' é problemático porque: (é muito ambicioso e não viável/é muito curto/usa linguagem informal/menciona pobreza)"
        correctAnswer: é muito ambicioso e não viável
        difficulty: 4
        rationale: Propostas irreais demonstram falta de consistência argumentativa.
        objectives: [ENEM.comp5]
  - pageNumber: 9
    title: Articulação com a Tese
    description: Proposta deve dialogar com a tese.
    exercises:
      - type: paragraph
        question: "A proposta de intervenção deve estar: (no início do texto/no desenvolvimento/na conclusão, articulada com a tese/em qualquer parágrafo)"
        correctAnswer: na conclusão, articulada com a tese
        difficulty: 5
        rationale: A proposta fecha o texto e deve ser a resposta prática à tese defendida.
        objectives: [ENEM.comp5]
  - pageNumber: 10
    title: Nota 200 na C5
    description: Proposta completa e articulada.
    exercises:
      - type: paragraph
        question: "Para 200 na C5, a proposta deve ter os 5 elementos, respeitar direitos humanos e: (ser longa/estar articulada à discussão e ser detalhada/ter pontuação perfeita/ser poética)"
        correctAnswer: estar articulada à discussão e ser detalhada
        difficulty: 5
        rationale: C5 máxima exige proposta completa, viável, articulada e respeitosa aos DH.
        objectives: [ENEM.comp5]
target: 10
