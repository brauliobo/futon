title: 💡 Competência 3 ENEM — Argumentação
level: L
subject: portuguese
difficulty: 5
objectives: [EM13LP45, ENEM.comp3]
authorNotes: Competência 3 avalia a seleção, organização e interpretação de informações e argumentos em defesa da tese. Repertório sociocultural é essencial.
example: "Repertório pertinente distingue textos nota 800 dos 1000. Ex.: citar Bourdieu ao tratar de desigualdade educacional → repertório legitimado."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: O que é Competência 3
    description: Entender o foco da C3.
    exercises:
      - type: paragraph
        question: "A competência 3 avalia: (ortografia/coesão/argumentação e uso de repertório sociocultural/proposta de intervenção)"
        correctAnswer: argumentação e uso de repertório sociocultural
        difficulty: 2
        rationale: C3 mede a qualidade dos argumentos e o repertório usado para sustentá-los.
        objectives: [ENEM.comp3]
  - pageNumber: 2
    title: Repertório Sociocultural
    description: O que conta como repertório.
    exercises:
      - type: paragraph
        question: "Repertório sociocultural legítimo inclui: (opiniões de amigos/dados científicos, obras literárias e eventos históricos/notícias sem fonte/anedotas)"
        correctAnswer: dados científicos, obras literárias e eventos históricos
        difficulty: 2
        rationale: Repertório precisa ser verificável e reconhecido como fonte confiável.
        objectives: [ENEM.comp3]
  - pageNumber: 3
    title: Pertinência do Repertório
    description: O repertório deve estar ligado à tese.
    exercises:
      - type: paragraph
        question: "Citar o filósofo Rousseau ao argumentar sobre educação é repertório: (inadequado/pertinente e legitimado/pedante/aleatório)"
        correctAnswer: pertinente e legitimado
        difficulty: 3
        rationale: Repertório pertinente dialoga diretamente com o argumento desenvolvido.
        objectives: [ENEM.comp3]
  - pageNumber: 4
    title: Argumento Sem Sustentação
    description: Identificar argumento fraco.
    exercises:
      - type: paragraph
        question: "'Todos sabem que a educação é importante' é argumento fraco porque: (é curto/usa 'todos'/é senso comum sem fundamentação/cita muitas pessoas)"
        correctAnswer: é senso comum sem fundamentação
        difficulty: 3
        rationale: Argumentos de senso comum não demonstram repertório nem profundidade.
        objectives: [ENEM.comp3]
  - pageNumber: 5
    title: Sustentação Causal
    description: Argumentar com causa e efeito.
    exercises:
      - type: paragraph
        question: "Para sustentar 'pobreza perpetua analfabetismo', o candidato deve: (repetir a afirmação/citar dado de órgão como IBGE ou UNESCO/usar opinião própria/comparar países)"
        correctAnswer: citar dado de órgão como IBGE ou UNESCO
        difficulty: 3
        rationale: Dados verificáveis de fontes reconhecidas fundamentam o argumento causal.
        objectives: [ENEM.comp3]
  - pageNumber: 6
    title: Progressão Argumentativa
    description: Argumentos que avançam na tese.
    exercises:
      - type: paragraph
        question: "Repetir a mesma ideia com palavras diferentes nos dois desenvolvimentos indica: (redundância e falta de progressão/coesão/riqueza vocabular/habilidade)"
        correctAnswer: redundância e falta de progressão
        difficulty: 4
        rationale: Cada parágrafo deve acrescentar novo argumento, não repetir o anterior.
        objectives: [ENEM.comp3]
  - pageNumber: 7
    title: Profundidade Argumentativa
    description: Ir além do óbvio.
    exercises:
      - type: paragraph
        question: "Um argumento profundo vai além do senso comum ao: (ser longo/usar palavras difíceis/relacionar causas estruturais e citar especialistas/ter mais de 5 linhas)"
        correctAnswer: relacionar causas estruturais e citar especialistas
        difficulty: 4
        rationale: Profundidade requer análise das causas e não apenas constatação do problema.
        objectives: [ENEM.comp3]
  - pageNumber: 8
    title: Argumento Filosófico
    description: Uso de filósofos como repertório.
    exercises:
      - type: paragraph
        question: "Usar o conceito de 'panoptismo' de Foucault ao tratar de vigilância digital é: (excesso/repertório filosófico pertinente/pedantismo/erro conceitual)"
        correctAnswer: repertório filosófico pertinente
        difficulty: 4
        rationale: Foucault e panoptismo conectam-se diretamente ao tema de vigilância e controle.
        objectives: [ENEM.comp3]
  - pageNumber: 9
    title: Argumento Histórico
    description: Eventos históricos como repertório.
    exercises:
      - type: paragraph
        question: "Citar a Declaração Universal dos Direitos Humanos ao tratar de discriminação é: (irrelevante/repertório histórico-jurídico legitimado/cópia/exagero)"
        correctAnswer: repertório histórico-jurídico legitimado
        difficulty: 5
        rationale: Documentos históricos reconhecidos são repertório de alto valor na C3.
        objectives: [ENEM.comp3]
  - pageNumber: 10
    title: Nota 200 na C3
    description: Critérios para argumentação máxima.
    exercises:
      - type: paragraph
        question: "Para 200 pontos na C3, o texto deve ter: (muitas citações/argumentos consistentes, repertório pertinente e progressão lógica/parágrafos longos/tópicos frasais)"
        correctAnswer: argumentos consistentes, repertório pertinente e progressão lógica
        difficulty: 5
        rationale: C3 máxima exige argumentação sólida, bem fundamentada e progressiva.
        objectives: [ENEM.comp3]
target: 10
