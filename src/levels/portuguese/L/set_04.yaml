title: Proposta de Intervenção
level: L
subject: portuguese
difficulty: 4
objectives: [ENEM.redacao]
authorNotes: Competência 5 do ENEM — 5 elementos — agente, ação, meio/modo, finalidade, detalhamento. Deve respeitar direitos humanos.
example: "O MEC (agente) deve criar programa de bolsas (ação) via parceria com estados (meio) para ampliar acesso ao ensino (finalidade), prevendo avaliação anual (detalhamento). Ex.: Desrespeitar direitos humanos na proposta: → zera a competência."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 80
pages:
  - pageNumber: 1
    title: Agente
    description: Quem executa a ação.
    exercises:
      - type: paragraph
        question: "Exemplo de agente adequado: (a sociedade abstrata/alguém/MEC/o universo)"
        correctAnswer: MEC
        difficulty: 2
        rationale: Agente deve ser identificável.
        objectives: [ENEM.redacao]
  - pageNumber: 2
    title: Ação
    description: O que será feito.
    exercises:
      - type: paragraph
        question: "Exemplo de ação: (opinar/reclamar/lamentar/criar programa de bolsas)"
        correctAnswer: criar programa de bolsas
        difficulty: 2
        rationale: Ação é medida concreta.
        objectives: [ENEM.redacao]
  - pageNumber: 3
    title: Meio
    description: Como será feito.
    exercises:
      - type: paragraph
        question: "Exemplo de meio/modo: (por magia/por inspiração divina/via parceria com estados/por sorte)"
        correctAnswer: via parceria com estados
        difficulty: 2
        rationale: Meio aponta o instrumento da ação.
        objectives: [ENEM.redacao]
  - pageNumber: 4
    title: Finalidade
    description: Para que a ação serve.
    exercises:
      - type: paragraph
        question: "Exemplo de finalidade: (ampliar acesso ao ensino/nada específico/apenas punir/viajar)"
        correctAnswer: ampliar acesso ao ensino
        difficulty: 2
        rationale: Finalidade liga ação ao objetivo.
        objectives: [ENEM.redacao]
  - pageNumber: 5
    title: Detalhamento
    description: Como a proposta se sustentará ou será avaliada.
    exercises:
      - type: paragraph
        question: "Exemplo de detalhamento: (apenas repetir a ação/fazer poesia/prever avaliação anual/sem detalhes)"
        correctAnswer: prever avaliação anual
        difficulty: 3
        rationale: Detalhamento aprofunda a proposta.
        objectives: [ENEM.redacao]
  - pageNumber: 6
    title: Direitos Humanos
    description: Proposta que desrespeite direitos humanos leva nota zero.
    exercises:
      - type: paragraph
        question: "Desrespeitar direitos humanos na proposta: (aumenta nota/zera a competência/é neutro/é opcional)"
        correctAnswer: zera a competência
        difficulty: 3
        rationale: Critério explícito da banca.
        objectives: [ENEM.redacao]
  - pageNumber: 7
    title: Proposta Completa
    description: Todos os 5 elementos claros.
    exercises:
      - type: paragraph
        question: "Proposta completa inclui: (agente, ação, meio, finalidade, detalhamento/só ação/só agente/só finalidade)"
        correctAnswer: agente, ação, meio, finalidade, detalhamento
        difficulty: 3
        rationale: Todos obrigatórios para nota máxima.
        objectives: [ENEM.redacao]
  - pageNumber: 8
    title: Evitar Clichês
    description: "'A família, a escola e o governo devem se unir' é vago."
    exercises:
      - type: paragraph
        question: "Proposta clichê e fraca: (Família escola e governo devem se unir/ONGs promoverão campanhas/O MEC implementará programa X via Y/A ANS criará norma com fiscalização)"
        correctAnswer: Família escola e governo devem se unir
        difficulty: 3
        rationale: Agente genérico e ausência de ação concreta.
        objectives: [ENEM.redacao]
  - pageNumber: 9
    title: Conexão com a Tese
    description: Proposta deve resolver o problema da tese.
    exercises:
      - type: paragraph
        question: "Proposta deve: (mudar de assunto/ser irrelevante/ser utópica/responder ao problema da tese)"
        correctAnswer: responder ao problema da tese
        difficulty: 3
        rationale: Coerência com a tese é essencial.
        objectives: [ENEM.redacao]
  - pageNumber: 10
    title: Revisão Integrada
    description: Avalie a qualidade da proposta.
    exercises:
      - type: paragraph
        question: "Analise: 'O MEC deve implementar bolsas via parceria com estados para ampliar acesso, com avaliação anual.' A proposta: (tem os 5 elementos/falta detalhamento/falta ação/falta agente)"
        correctAnswer: tem os 5 elementos
        difficulty: 3
        rationale: MEC (agente), bolsas (ação), parceria (meio), acesso (finalidade), avaliação (detalhamento).
        objectives: [ENEM.redacao]
target: 10
