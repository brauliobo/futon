title: Estrutura da Dissertação-Argumentativa
level: L
subject: portuguese
difficulty: 4
objectives: [EM13LP45, ENEM.redacao]
authorNotes: Quatro parágrafos — introdução (com tese), 2 desenvolvimentos, conclusão com proposta de intervenção (ENEM).
example: "Tese ao final da introdução; cada desenvolvimento traz argumento com repertório. Ex.: A dissertação-argumentativa do ENEM costuma ter: → 4 parágrafos."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 80
pages:
  - pageNumber: 1
    title: Quatro Parágrafos
    description: Estrutura enxuta e clara.
    exercises:
      - type: paragraph
        question: "A dissertação-argumentativa do ENEM costuma ter: (2 parágrafos/1 parágrafo/10 parágrafos/4 parágrafos)"
        correctAnswer: 4 parágrafos
        difficulty: 2
        rationale: Introdução + 2 argumentativos + conclusão.
        objectives: [EM13LP45]
  - pageNumber: 2
    title: Introdução
    description: Contextualiza, apresenta tema e tese.
    exercises:
      - type: paragraph
        question: "A introdução deve terminar com: (a tese/a conclusão/a proposta de intervenção/uma citação)"
        correctAnswer: a tese
        difficulty: 3
        rationale: A tese sinaliza o posicionamento.
        objectives: [EM13LP45]
  - pageNumber: 3
    title: Desenvolvimento 1
    description: Primeiro argumento com repertório sociocultural.
    exercises:
      - type: paragraph
        question: "Um bom parágrafo de desenvolvimento tem: (piada/tópico frasal + argumento + repertório/apenas opiniões/pergunta retórica)"
        correctAnswer: tópico frasal + argumento + repertório
        difficulty: 4
        rationale: Tópico + sustentação + fonte externa.
        objectives: [EM13LP45]
  - pageNumber: 4
    title: Desenvolvimento 2
    description: Segundo argumento, preferencialmente de natureza diferente.
    exercises:
      - type: paragraph
        question: "O 2º desenvolvimento pode trazer argumento: (puramente emocional/sem fundamentação/idêntico ao 1º/de natureza diferente do 1º)"
        correctAnswer: de natureza diferente do 1º
        difficulty: 4
        rationale: Diversidade fortalece a argumentação.
        objectives: [EM13LP45]
  - pageNumber: 5
    title: Repertório Sociocultural
    description: Citações, dados, fatos, filmes, livros.
    exercises:
      - type: paragraph
        question: "Repertório adequado inclui: (opiniões da família/citações inventadas/rumores/estudos e citações pertinentes)"
        correctAnswer: estudos e citações pertinentes
        difficulty: 4
        rationale: Repertório legítimo precisa ser verificável e pertinente.
        objectives: [EM13LP45]
  - pageNumber: 6
    title: Conclusão
    description: Retoma a tese + proposta de intervenção (ENEM).
    exercises:
      - type: paragraph
        question: "Proposta de intervenção no ENEM exige: (agente + ação + meio + finalidade + detalhamento/nenhuma ação/apenas reclamação/apenas uma solução)"
        correctAnswer: agente + ação + meio + finalidade + detalhamento
        difficulty: 5
        rationale: São os 5 elementos esperados pela banca.
        objectives: [ENEM.redacao]
  - pageNumber: 7
    title: Coesão
    description: Uso variado de conectivos.
    exercises:
      - type: paragraph
        question: "Boa coesão exige: (repetição do mesmo conectivo/variedade de conectivos/somente pontuação/ausência de conectivos)"
        correctAnswer: variedade de conectivos
        difficulty: 3
        rationale: Variedade demonstra domínio da norma.
        objectives: [EM13LP45]
  - pageNumber: 8
    title: Norma Padrão
    description: Uso formal obrigatório no ENEM.
    exercises:
      - type: paragraph
        question: "No ENEM, a redação deve usar: (poesia livre/gíria/norma padrão culta/linguagem de chat)"
        correctAnswer: norma padrão culta
        difficulty: 2
        rationale: ENEM avalia domínio da norma padrão.
        objectives: [ENEM.redacao]
  - pageNumber: 9
    title: Título
    description: No ENEM o título é opcional.
    exercises:
      - type: paragraph
        question: "No ENEM o título: (aumenta ponto/é opcional/obrigatório/penaliza)"
        correctAnswer: é opcional
        difficulty: 3
        rationale: Título não é exigido no ENEM.
        objectives: [ENEM.redacao]
  - pageNumber: 10
    title: Revisão Integrada
    description: Reconheça o parágrafo.
    exercises:
      - type: paragraph
        question: "'Contextualização + tese' é estrutura típica de: (introdução/conclusão/título/desenvolvimento)"
        correctAnswer: introdução
        difficulty: 3
        rationale: Introdução apresenta o tema e a tese.
        objectives: [EM13LP45]
target: 10
