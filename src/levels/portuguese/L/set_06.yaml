title: Competências do ENEM
level: L
subject: portuguese
difficulty: 4
objectives: [ENEM.redacao]
authorNotes: Cinco competências avaliadas — domínio da norma, compreensão do tema, seleção de argumentos, coesão, proposta de intervenção.
example: "Cada competência vale 200 pontos, total 1000. Ex.: Nota máxima por competência: → 200."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 80
pages:
  - pageNumber: 1
    title: Competência 1
    description: Domínio da norma padrão.
    exercises:
      - type: paragraph
        question: "Competência 1 avalia: (proposta de intervenção/coesão/tese/norma padrão culta)"
        correctAnswer: norma padrão culta
        difficulty: 1
        rationale: Gramática e ortografia.
        objectives: [ENEM.redacao]
  - pageNumber: 2
    title: Competência 2
    description: Compreensão da proposta, temática e tipo textual.
    exercises:
      - type: paragraph
        question: "Fugir do tema prejudica: (nenhuma/competência 2/competência 1/competência 5)"
        correctAnswer: competência 2
        difficulty: 2
        rationale: C2 avalia compreensão e tipologia.
        objectives: [ENEM.redacao]
  - pageNumber: 3
    title: Competência 3
    description: Argumentação e organização.
    exercises:
      - type: paragraph
        question: "Competência 3 avalia: (ortografia/coesão/argumentos e organização/proposta de intervenção)"
        correctAnswer: argumentos e organização
        difficulty: 2
        rationale: Qualidade argumentativa.
        objectives: [ENEM.redacao]
  - pageNumber: 4
    title: Competência 4
    description: Coesão e recursos linguísticos.
    exercises:
      - type: paragraph
        question: "Competência 4 avalia: (coesão e recursos linguísticos/proposta/compreensão temática/norma padrão)"
        correctAnswer: coesão e recursos linguísticos
        difficulty: 2
        rationale: Conectivos e encadeamento.
        objectives: [ENEM.redacao]
  - pageNumber: 5
    title: Competência 5
    description: Proposta de intervenção respeitando direitos humanos.
    exercises:
      - type: paragraph
        question: "Competência 5 exige proposta com: (agente, ação, meio, finalidade, detalhamento/apenas ação/nenhum destes/só agente)"
        correctAnswer: agente, ação, meio, finalidade, detalhamento
        difficulty: 2
        rationale: Cinco elementos esperados.
        objectives: [ENEM.redacao]
  - pageNumber: 6
    title: Pontuação
    description: Cada competência vale 0 a 200; total 1000.
    exercises:
      - type: paragraph
        question: "Nota máxima por competência: (100/1000/50/200)"
        correctAnswer: '200'
        difficulty: 1
        rationale: 5 competências × 200 = 1000.
        objectives: [ENEM.redacao]
  - pageNumber: 7
    title: Motivos de Nota Zero
    description: Fuga ao tema, desrespeito aos direitos humanos, texto apenas copiado.
    exercises:
      - type: paragraph
        question: "Motivo de nota zero: (desrespeito aos direitos humanos/citação de autores/uso de conectivos/aprofundamento da tese)"
        correctAnswer: desrespeito aos direitos humanos
        difficulty: 2
        rationale: Critério explícito do ENEM.
        objectives: [ENEM.redacao]
  - pageNumber: 8
    title: Texto Dissertativo-Argumentativo
    description: Obrigatório no ENEM.
    exercises:
      - type: paragraph
        question: "Se o aluno escrever um poema no ENEM: (nota máxima/pontua extra/nota zero por tipologia/sem consequência)"
        correctAnswer: nota zero por tipologia
        difficulty: 2
        rationale: Gênero exigido é dissertativo-argumentativo.
        objectives: [ENEM.redacao]
  - pageNumber: 9
    title: Número de Linhas
    description: Mínimo de 8 linhas; máximo 30.
    exercises:
      - type: paragraph
        question: "Texto com menos de 7 linhas: (só conta parcialmente/ganha bônus/é zerado/pontua normalmente)"
        correctAnswer: é zerado
        difficulty: 2
        rationale: Texto insuficiente recebe nota zero.
        objectives: [ENEM.redacao]
  - pageNumber: 10
    title: Revisão Integrada
    description: Associe competência a critério.
    exercises:
      - type: paragraph
        question: "Coerência, organização de ideias e argumentação correspondem à: (competência 1/competência 2/competência 3/competência 5)"
        correctAnswer: competência 3
        difficulty: 2
        rationale: C3 trata da argumentação.
        objectives: [ENEM.redacao]
target: 10
