title: 🔍 Estratégias de Argumentação Avançadas
level: L
subject: portuguese
difficulty: 5
objectives: [EM13LP45, ENEM.redacao]
authorNotes: Argumentos por autoridade, exemplificação, causa-efeito, comparação e refutação. Competência 3 do ENEM.
example: "Estratégias diversificam e fortalecem a defesa da tese. Ex.: 'argumento de autoridade' → citar dado de fonte reconhecida para sustentar a ideia."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Argumento de Autoridade
    description: Citar fonte reconhecida.
    exercises:
      - type: paragraph
        question: "Usar dado da ONU para sustentar argumento é exemplo de: (falácia/argumento de autoridade/refutação/contra-argumento)"
        correctAnswer: argumento de autoridade
        difficulty: 2
        rationale: Argumento de autoridade recorre a fontes reconhecidas para dar credibilidade à tese.
        objectives: [EM13LP45]
  - pageNumber: 2
    title: Argumento por Exemplificação
    description: Ilustrar com caso concreto.
    exercises:
      - type: paragraph
        question: "Citar a experiência da Finlândia em educação para defender reforma escolar é: (argumento de senso comum/refutação/argumento por exemplificação/dedução)"
        correctAnswer: argumento por exemplificação
        difficulty: 2
        rationale: Exemplificação torna o argumento concreto e verificável.
        objectives: [EM13LP45]
  - pageNumber: 3
    title: Argumento Causal
    description: Relacionar causa e efeito.
    exercises:
      - type: paragraph
        question: "'A falta de saneamento gera doenças' é um argumento: (por comparação/por exemplificação/causal/de autoridade)"
        correctAnswer: causal
        difficulty: 3
        rationale: Argumentos causais estabelecem relação de causa e efeito.
        objectives: [EM13LP45]
  - pageNumber: 4
    title: Argumento Comparativo
    description: Comparar para convencer.
    exercises:
      - type: paragraph
        question: "Comparar o Brasil ao Canadá para defender investimento em C&T é argumento: (causal/comparativo/dedutivo/anedótico)"
        correctAnswer: comparativo
        difficulty: 3
        rationale: Comparação com modelos de sucesso é estratégia argumentativa eficaz.
        objectives: [EM13LP45]
  - pageNumber: 5
    title: Contra-Argumento e Refutação
    description: Antecipar e rebater objeção.
    exercises:
      - type: paragraph
        question: "Apresentar a visão oposta e depois desmontá-la é a estratégia de: (exemplificação/refutação/narração/descrição)"
        correctAnswer: refutação
        difficulty: 3
        rationale: Refutação demonstra que o autor conhece e supera os contra-argumentos.
        objectives: [EM13LP45]
  - pageNumber: 6
    title: Argumento Dedutivo
    description: Do geral para o particular.
    exercises:
      - type: paragraph
        question: "Partir de princípio geral ('todo cidadão merece saúde') para caso específico é raciocínio: (indutivo/analógico/dedutivo/emotivo)"
        correctAnswer: dedutivo
        difficulty: 4
        rationale: Dedução parte do universal para o particular.
        objectives: [EM13LP45]
  - pageNumber: 7
    title: Argumento Indutivo
    description: Do particular para o geral.
    exercises:
      - type: paragraph
        question: "Citar vários casos de evasão escolar para concluir que o problema é sistêmico é raciocínio: (dedutivo/indutivo/comparativo/causal)"
        correctAnswer: indutivo
        difficulty: 4
        rationale: Indução parte de casos particulares para conclusão geral.
        objectives: [EM13LP45]
  - pageNumber: 8
    title: Falácia Argumentativa
    description: Identificar raciocínio falho.
    exercises:
      - type: paragraph
        question: "'Todos fazem isso, logo está certo' é exemplo de: (argumento forte/falácia ad populum/argumento de autoridade/dedução válida)"
        correctAnswer: falácia ad populum
        difficulty: 4
        rationale: Apelar à maioria sem evidência lógica é falácia.
        objectives: [EM13LP45]
  - pageNumber: 9
    title: Encadeamento Argumentativo
    description: Progressão lógica dos argumentos.
    exercises:
      - type: paragraph
        question: "Organizar os argumentos do mais fraco ao mais forte é estratégia chamada de: (anticlímax/clímax argumentativo/refutação/inversão)"
        correctAnswer: clímax argumentativo
        difficulty: 5
        rationale: O clímax argumentativo reserva o argumento mais sólido para o fim.
        objectives: [ENEM.redacao]
  - pageNumber: 10
    title: Integração de Estratégias
    description: Usar múltiplas estratégias no mesmo texto.
    exercises:
      - type: paragraph
        question: "Um texto nota 1000 costuma combinar argumento de autoridade com: (apenas emoção/uma única estratégia/exemplificação e causalidade/opiniões pessoais)"
        correctAnswer: exemplificação e causalidade
        difficulty: 5
        rationale: Diversificar estratégias enriquece e consolida a argumentação.
        objectives: [EM13LP45]
target: 10
