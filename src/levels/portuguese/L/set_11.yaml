title: 📚 Vocabulário e Registro na Redação ENEM
level: L
subject: portuguese
difficulty: 5
objectives: [EM13LP45, ENEM.redacao]
authorNotes: Domínio lexical amplo e preciso eleva a nota nas competências 1 e 3. Evitar pobreza vocabular, redundâncias e palavras-fantasma.
example: "Vocabulário preciso diferencia redações nota 960 das 1000. Ex.: substituir 'muito importante' → 'imprescindível' demonstra domínio lexical."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Pobreza Lexical
    description: Identificar vocabulário pobre.
    exercises:
      - type: paragraph
        question: "Usar 'coisa', 'negócio' e 'fazer' repetidamente indica: (estilo simples/pobreza lexical/coesão/clareza)"
        correctAnswer: pobreza lexical
        difficulty: 2
        rationale: Termos vagos demonstram limitação vocabular e reduzem a nota.
        objectives: [EM13LP45]
  - pageNumber: 2
    title: Sinonímia
    description: Substituir sem alterar sentido.
    exercises:
      - type: paragraph
        question: "Substituir 'diminuição' por 'redução', 'queda' e 'declínio' no texto é uso de: (polissemia/antônimos/sinonímia/homonímia)"
        correctAnswer: sinonímia
        difficulty: 2
        rationale: Sinonímia evita repetição e enriquece o vocabulário.
        objectives: [EM13LP45]
  - pageNumber: 3
    title: Termos Técnicos
    description: Usar vocabulário técnico com precisão.
    exercises:
      - type: paragraph
        question: "Usar 'analfabetismo funcional' em vez de 'não saber ler direito' demonstra: (pedantismo/domínio lexical técnico/informalidade/erro conceitual)"
        correctAnswer: domínio lexical técnico
        difficulty: 3
        rationale: Termos técnicos pertinentes elevam a qualidade da redação.
        objectives: [ENEM.redacao]
  - pageNumber: 4
    title: Pleonasmo Vicioso
    description: Evitar redundâncias desnecessárias.
    exercises:
      - type: paragraph
        question: "'Subir para cima' é um exemplo de: (metáfora/pleonasmo vicioso/hipérbole/catacrese)"
        correctAnswer: pleonasmo vicioso
        difficulty: 3
        rationale: Pleonasmo vicioso repete informação já contida na palavra.
        objectives: [EM13LP45]
  - pageNumber: 5
    title: Neologismo e Estrangeirismo
    description: Quando evitar palavras estrangeiras.
    exercises:
      - type: paragraph
        question: "No texto dissertativo formal, estrangeirismos com equivalente em português devem ser: (incentivados/destacados em itálico/evitados/usados livremente)"
        correctAnswer: evitados
        difficulty: 3
        rationale: A banca valoriza o domínio do vocabulário português culto.
        objectives: [EM13LP45]
  - pageNumber: 6
    title: Palavras-Fantasma
    description: Expressões vagas sem sentido preciso.
    exercises:
      - type: paragraph
        question: "'No contexto atual da sociedade de hoje em dia' é exemplo de: (precisão/concisão/palavras-fantasma e redundância/coesão)"
        correctAnswer: palavras-fantasma e redundância
        difficulty: 4
        rationale: Expressões vagas e repetitivas ocupam espaço sem acrescentar sentido.
        objectives: [EM13LP45]
  - pageNumber: 7
    title: Adequação Semântica
    description: Usar a palavra com sentido correto.
    exercises:
      - type: paragraph
        question: "Usar 'implicar' no sentido de 'causar' (ex.: 'implica consequências') é: (erro semântico/uso correto/arcaísmo/neologismo)"
        correctAnswer: uso correto
        difficulty: 4
        rationale: "'Implicar' no sentido de 'acarretar' é uso correto e culto."
        objectives: [EM13LP45]
  - pageNumber: 8
    title: Registro Lexical e Tema
    description: Adequar vocabulário ao tema.
    exercises:
      - type: paragraph
        question: "Em redação sobre saúde mental, usar 'estigmatização', 'transtorno' e 'suporte psicossocial' revela: (pomposidade/adequação lexical ao tema/excesso/informalidade)"
        correctAnswer: adequação lexical ao tema
        difficulty: 4
        rationale: Vocabulário temático específico demonstra repertório e domínio do assunto.
        objectives: [ENEM.redacao]
  - pageNumber: 9
    title: Nominalização
    description: Recurso formal de substantivação.
    exercises:
      - type: paragraph
        question: "Transformar 'o governo deve agir' em 'a atuação do governo é necessária' é exemplo de: (nominalização/coloquialismo/erro/simplificação)"
        correctAnswer: nominalização
        difficulty: 5
        rationale: Nominalização confere formalidade e é recurso típico do texto dissertativo culto.
        objectives: [EM13LP45]
  - pageNumber: 10
    title: Revisão Lexical
    description: Identificar o vocabulário mais adequado.
    exercises:
      - type: paragraph
        question: "Em redação ENEM, 'evidencia-se' é preferível a 'dá pra ver' por ser: (mais difícil/formal e preciso/arcaico/rebuscado demais)"
        correctAnswer: formal e preciso
        difficulty: 5
        rationale: O texto dissertativo exige vocabulário formal e semanticamente preciso.
        objectives: [EM13LP45]
target: 10
