title: Coesão e Conectivos na Dissertação
level: L
subject: portuguese
difficulty: 4
objectives: [EM13LP45]
authorNotes: Conectivos de adição, contraste, causa, consequência, conclusão; progressão textual e referenciação.
example: "'Ademais'; 'por outro lado'; 'dessa forma'; 'uma vez que'. Ex.: Conectivo de adição: → ademais."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 80
pages:
  - pageNumber: 1
    title: Conectivos de Adição
    description: "'Além disso', 'ademais', 'outrossim'."
    exercises:
      - type: paragraph
        question: "Conectivo de adição: (entretanto/portanto/todavia/ademais)"
        correctAnswer: ademais
        difficulty: 2
        rationale: Soma ideias.
        objectives: [EM13LP45]
  - pageNumber: 2
    title: Conectivos de Contraste
    description: "'Entretanto', 'todavia', 'por outro lado'."
    exercises:
      - type: paragraph
        question: "Conectivo de contraste: (por isso/entretanto/ademais/portanto)"
        correctAnswer: entretanto
        difficulty: 2
        rationale: Marca oposição.
        objectives: [EM13LP45]
  - pageNumber: 3
    title: Conectivos de Causa
    description: "'Uma vez que', 'já que', 'visto que'."
    exercises:
      - type: paragraph
        question: "Conectivo de causa: (embora/uma vez que/ademais/assim)"
        correctAnswer: uma vez que
        difficulty: 3
        rationale: Introduz razão ou motivo.
        objectives: [EM13LP45]
  - pageNumber: 4
    title: Conectivos de Consequência
    description: "'Dessa forma', 'assim', 'por conseguinte'."
    exercises:
      - type: paragraph
        question: "Conectivo de consequência: (embora/uma vez que/por conseguinte/por exemplo)"
        correctAnswer: por conseguinte
        difficulty: 3
        rationale: Introduz efeito.
        objectives: [EM13LP45]
  - pageNumber: 5
    title: Conectivos de Conclusão
    description: "'Portanto', 'logo', 'em suma'."
    exercises:
      - type: paragraph
        question: "Conectivo conclusivo: (todavia/entretanto/ademais/portanto)"
        correctAnswer: portanto
        difficulty: 2
        rationale: Fecha argumentação.
        objectives: [EM13LP45]
  - pageNumber: 6
    title: Variedade
    description: Evite repetir o mesmo conectivo.
    exercises:
      - type: paragraph
        question: "Usar sempre 'mas' ao invés de variar: (não influencia/melhora a clareza/empobrece o texto/reforça a tese)"
        correctAnswer: empobrece o texto
        difficulty: 3
        rationale: Variedade demonstra domínio linguístico.
        objectives: [EM13LP45]
  - pageNumber: 7
    title: Progressão Textual
    description: As ideias devem avançar sem redundância.
    exercises:
      - type: paragraph
        question: "Progressão textual significa: (escrever de forma aleatória/avançar com novas informações/fazer rima/repetir o mesmo ponto)"
        correctAnswer: avançar com novas informações
        difficulty: 3
        rationale: Cada parágrafo deve agregar.
        objectives: [EM13LP45]
  - pageNumber: 8
    title: Referenciação
    description: Pronomes retomam termos anteriores.
    exercises:
      - type: paragraph
        question: "Em 'A educação avança; esta é prioridade nacional', 'esta' retoma: (avança/nacional/educação/prioridade)"
        correctAnswer: educação
        difficulty: 3
        rationale: Pronome demonstrativo retoma o sujeito.
        objectives: [EM13LP45]
  - pageNumber: 9
    title: Pontuação e Coesão
    description: Vírgula antes de conectivos adversativos e conclusivos.
    exercises:
      - type: paragraph
        question: "Pontuação correta: (A ideia é válida, entretanto precisa de prova/A ideia é válida entretanto, precisa de prova/A ideia é válida; entretanto: precisa de prova/A ideia é válida entretanto)"
        correctAnswer: A ideia é válida, entretanto precisa de prova
        difficulty: 4
        rationale: Vírgula separa oração adversativa.
        objectives: [EM13LP45]
  - pageNumber: 10
    title: Revisão Integrada
    description: Complete com conectivo adequado.
    exercises:
      - type: paragraph
        question: "'A educação é prioridade; ___, deve receber mais investimentos' (portanto/apesar/embora/uma vez que)"
        correctAnswer: portanto
        difficulty: 3
        rationale: Conclusão decorrente.
        objectives: [EM13LP45]
target: 10
