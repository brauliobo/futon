title: 📝 Análise Literária - Revisão Integrada
level: K
subject: portuguese
difficulty: 5
objectives: [EM13LP46, EM13LP47, EM13LP48, EM13LP49, EM13LP50]
authorNotes: Revisão transversal — identificar escolas literárias e autores a partir de traços estilísticos ou trechos.
example: "Reconhecer o Barroco pela antítese; Modernismo pelo verso livre. Ex.: Ordem cronológica correta: → Quinhentismo, Barroco, Arca…."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 80
pages:
  - pageNumber: 1
    title: Linha do Tempo
    description: Quinhentismo → Barroco → Arcadismo → Romantismo → Realismo → Modernismo.
    exercises:
      - type: paragraph
        question: "Ordem cronológica correta: (Quinhentismo, Barroco, Arcadismo, Romantismo/Barroco, Quinhentismo, Romantismo, Arcadismo/Arcadismo, Quinhentismo, Barroco, Romantismo/Romantismo, Barroco, Arcadismo, Quinhentismo)"
        correctAnswer: Quinhentismo, Barroco, Arcadismo, Romantismo
        difficulty: 3
        rationale: Sequência temporal das escolas literárias.
        objectives: [EM13LP46]
  - pageNumber: 2
    title: Reconhecer pelo Traço
    description: Linguagem rebuscada + antítese = Barroco.
    exercises:
      - type: paragraph
        question: "Antítese + fé vs razão indica: (Arcadismo/Romantismo/Barroco/Quinhentismo)"
        correctAnswer: Barroco
        difficulty: 3
        rationale: Dualismo é marca barroca.
        objectives: [EM13LP46]
  - pageNumber: 3
    title: Regionalismo
    description: Tema típico da 2ª geração modernista.
    exercises:
      - type: paragraph
        question: "Romances sobre o sertão e a seca pertencem a: (Arcadismo/1ª geração romântica/2ª geração modernista/Realismo)"
        correctAnswer: 2ª geração modernista
        difficulty: 3
        rationale: Regionalismo floresce nos anos 1930.
        objectives: [EM13LP48]
  - pageNumber: 4
    title: Machado x Alencar
    description: Realismo vs Romantismo.
    exercises:
      - type: paragraph
        question: "Machado de Assis pertence ao: (Realismo/Modernismo/Barroco/Romantismo)"
        correctAnswer: Realismo
        difficulty: 2
        rationale: Inaugura a fase realista em 1881.
        objectives: [EM13LP47]
  - pageNumber: 5
    title: Drummond e Bandeira
    description: Modernismo de 1930.
    exercises:
      - type: paragraph
        question: "Drummond e Bandeira pertencem ao: (Modernismo/Realismo/Simbolismo/Parnasianismo)"
        correctAnswer: Modernismo
        difficulty: 2
        rationale: 2ª geração modernista.
        objectives: [EM13LP48]
  - pageNumber: 6
    title: Guimarães Rosa
    description: 3ª geração modernista.
    exercises:
      - type: paragraph
        question: "Guimarães Rosa faz parte: (do Arcadismo/do Realismo/do Romantismo/da 3ª geração modernista)"
        correctAnswer: da 3ª geração modernista
        difficulty: 3
        rationale: Inovação linguística pós-1945.
        objectives: [EM13LP49]
  - pageNumber: 7
    title: Parnasianismo x Simbolismo
    description: Forma rígida vs sinestesias.
    exercises:
      - type: paragraph
        question: "Soneto perfeito com métrica rigorosa é traço: (parnasiano/romântico/simbolista/naturalista)"
        correctAnswer: parnasiano
        difficulty: 4
        rationale: Parnasianismo valoriza precisão formal.
        objectives: [EM13LP47]
  - pageNumber: 8
    title: Indianismo
    description: Romantismo brasileiro, 1ª geração.
    exercises:
      - type: paragraph
        question: "Autor indianista central: (Ana Maria Machado/Drummond/Gonçalves Dias/Vinicius de Moraes)"
        correctAnswer: Gonçalves Dias
        difficulty: 3
        rationale: Cantos de nacionalismo indígena.
        objectives: [EM13LP47]
  - pageNumber: 9
    title: Autoria Feminina
    description: Presença crescente da literatura escrita por mulheres.
    exercises:
      - type: paragraph
        question: "Qual autora é moderna contemporânea? (Conceição Evaristo/Olavo Bilac/Machado de Assis/Álvares de Azevedo)"
        correctAnswer: Conceição Evaristo
        difficulty: 3
        rationale: Voz contemporânea da literatura negra brasileira.
        objectives: [EM13LP50]
  - pageNumber: 10
    title: Trecho em Análise
    description: Reconheça a escola a partir do estilo.
    exercises:
      - type: paragraph
        question: "'Minha terra tem palmeiras/onde canta o sabiá' — escola literária: (Modernismo/Romantismo/Arcadismo/Barroco)"
        correctAnswer: Romantismo
        difficulty: 3
        rationale: Canção do Exílio, 1ª geração romântica.
        objectives: [EM13LP47]
target: 10
