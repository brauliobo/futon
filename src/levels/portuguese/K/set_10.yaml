title: ⚓ Classicismo e Camões (Os Lusíadas)
level: K
subject: portuguese
difficulty: 5
objectives: [EM13LP46, EM13LP47]
authorNotes: "Classicismo português (séc. XVI): Luís de Camões, Os Lusíadas (epopeia) e lírica camoniana."
example: "Os Lusíadas exaltam a expansão marítima. Ex.: 'invocação às Tágides' → proposta épica clássica."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: O Classicismo Português
    description: Renascimento e valores humanistas no séc. XVI.
    exercises:
      - type: paragraph
        question: "O Classicismo português tem como principal característica: (liberdade criativa/emoção exaltada/imitação dos modelos greco-latinos e equilíbrio formal/misticismo medieval)"
        correctAnswer: imitação dos modelos greco-latinos e equilíbrio formal
        difficulty: 2
        rationale: O Classicismo retoma a Antiguidade Clássica como modelo estético.
        objectives: [EM13LP46]
  - pageNumber: 2
    title: Luís de Camões — Vida
    description: Maior poeta da língua portuguesa.
    exercises:
      - type: paragraph
        question: "Camões participou da expedição que inspirou Os Lusíadas: (cruzada para Jerusalém/Batalha de Alcácer Quibir/viagem à Índia via Cabo da Boa Esperança/conquista do Brasil)"
        correctAnswer: viagem à Índia via Cabo da Boa Esperança
        difficulty: 3
        rationale: Camões vivenciou a rota das Índias, tema central d'Os Lusíadas.
        objectives: [EM13LP46]
  - pageNumber: 3
    title: Estrutura d'Os Lusíadas
    description: Organização formal da epopeia camoniana.
    exercises:
      - type: paragraph
        question: "Os Lusíadas são compostos de dez cantos em estrofes de oito versos chamadas: (redondilhas/sonetos/oitavas-rimas/sextilhas)"
        correctAnswer: oitavas-rimas
        difficulty: 3
        rationale: A oitava-rima (ABABABCC) é a estrofe épica clássica utilizada por Camões.
        objectives: [EM13LP47]
  - pageNumber: 4
    title: Partes da Epopeia
    description: As quatro partes que organizam uma epopeia clássica.
    exercises:
      - type: paragraph
        question: "As partes obrigatórias de uma epopeia clássica são: (enredo, clímax, desfecho, epílogo/proposição, invocação, dedicatória, narração/introdução, desenvolvimento, conclusão, apêndice/prólogo, peripécia, anagnórise, catástrofe)"
        correctAnswer: proposição, invocação, dedicatória, narração
        difficulty: 4
        rationale: Modelo clássico da Ilíada e Eneida seguido por Camões.
        objectives: [EM13LP47]
  - pageNumber: 5
    title: Mitologia n'Os Lusíadas
    description: Deuses gregos na narrativa da viagem portuguesa.
    exercises:
      - type: paragraph
        question: "Vênus favorece os portugueses n'Os Lusíadas porque: (é deusa da guerra/identificava-os com Roma e o Ocidente/odeia Baco/representa Portugal)"
        correctAnswer: identificava-os com Roma e o Ocidente
        difficulty: 4
        rationale: Vênus protege os lusitanos por sua ligação com a tradição latina e ocidental.
        objectives: [EM13LP46]
  - pageNumber: 6
    title: O Velho do Restelo
    description: Crítica às navegações dentro da epopeia.
    exercises:
      - type: paragraph
        question: "O Velho do Restelo representa: (entusiasmo pelas navegações/crítica moral à expansão marítima/profecia de vitória/elogio a Vasco da Gama)"
        correctAnswer: crítica moral à expansão marítima
        difficulty: 4
        rationale: O personagem condena a ambição e os riscos das navegações, voz crítica de Camões.
        objectives: [EM13LP47]
  - pageNumber: 7
    title: Inês de Castro
    description: Episódio lírico-trágico dentro da epopeia.
    exercises:
      - type: paragraph
        question: "O episódio de Inês de Castro n'Os Lusíadas é considerado: (lírico e trágico dentro da epopeia/cômico e satírico/alegórico e mitológico/épico e guerreiro)"
        correctAnswer: lírico e trágico dentro da epopeia
        difficulty: 3
        rationale: O episódio rompe o tom épico com lirismo e tragédia do amor de D. Pedro e Inês.
        objectives: [EM13LP47]
  - pageNumber: 8
    title: Lírica Camoniana
    description: Sonetos e redondilhas de Camões.
    exercises:
      - type: paragraph
        question: "Na lírica de Camões, o tema central do soneto 'Amor é fogo que arde sem se ver' é: (guerra/paradoxos do amor/saudade da pátria/morte heroica)"
        correctAnswer: paradoxos do amor
        difficulty: 3
        rationale: O soneto acumula antíteses para definir o amor como sentimento contraditório.
        objectives: [EM13LP46]
  - pageNumber: 9
    title: Neoplatonismo em Camões
    description: Influência filosófica na lírica camoniana.
    exercises:
      - type: paragraph
        question: "O neoplatonismo em Camões manifesta-se na: (valorização do corpo/busca do amor ideal e da beleza transcendente/crítica à religião/exaltação da guerra)"
        correctAnswer: busca do amor ideal e da beleza transcendente
        difficulty: 4
        rationale: Camões segue Platão ao buscar o amor espiritual além da beleza física.
        objectives: [EM13LP46]
  - pageNumber: 10
    title: Revisão Integrada
    description: Síntese do Classicismo e Os Lusíadas.
    exercises:
      - type: paragraph
        question: "Os Lusíadas pertencem ao gênero épico porque: (narram aventuras de um herói individual/celebram coletivamente feitos históricos de um povo/criticam a sociedade/exaltam a natureza)"
        correctAnswer: celebram coletivamente feitos históricos de um povo
        difficulty: 3
        rationale: A epopeia exalta façanhas coletivas — as navegações portuguesas.
        objectives: [EM13LP47]
target: 10
