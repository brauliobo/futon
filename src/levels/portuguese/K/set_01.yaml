title: Quinhentismo e Barroco
level: K
subject: portuguese
difficulty: 3
objectives: [EM13LP46, EM13LP47]
authorNotes: Primeiras manifestações literárias no Brasil (1500) e o Barroco (séc. XVII) com Gregório de Matos e Padre Vieira.
example: "Gregório de Matos — Boca do Inferno. Ex.: A Carta de Pero Vaz de Caminha pertence ao: → Quinhentismo."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 80
pages:
  - pageNumber: 1
    title: Quinhentismo
    description: Literatura de informação e catequese no Brasil colonial.
    exercises:
      - type: paragraph
        question: "A Carta de Pero Vaz de Caminha pertence ao: (Barroco/Romantismo/Quinhentismo/Arcadismo)"
        correctAnswer: Quinhentismo
        difficulty: 2
        rationale: Documento de 1500, marco do Quinhentismo.
        objectives: [EM13LP46]
  - pageNumber: 2
    title: Literatura de Catequese
    description: Padre José de Anchieta escrevia peças religiosas.
    exercises:
      - type: paragraph
        question: "Principal autor jesuíta do Quinhentismo: (Padre José de Anchieta/Gregório de Matos/Machado de Assis/Gonçalves Dias)"
        correctAnswer: Padre José de Anchieta
        difficulty: 3
        rationale: Anchieta compôs hinos e autos religiosos.
        objectives: [EM13LP46]
  - pageNumber: 3
    title: Barroco — Contexto
    description: Reforma, Contrarreforma; tensão religiosa e estética.
    exercises:
      - type: paragraph
        question: "O Barroco no Brasil surge no século: (XVII/XV/XIX/XXI)"
        correctAnswer: XVII
        difficulty: 2
        rationale: Barroco brasileiro é do século XVII.
        objectives: [EM13LP46]
  - pageNumber: 4
    title: Características Barrocas
    description: Conflito entre fé e razão, sagrado e profano.
    exercises:
      - type: paragraph
        question: "Dualismo típico do Barroco: (natureza vs cidade/passado vs futuro/fé vs razão/amor vs ódio)"
        correctAnswer: fé vs razão
        difficulty: 3
        rationale: Barroco explora tensões dualistas.
        objectives: [EM13LP46]
  - pageNumber: 5
    title: Cultismo
    description: Estilo rebuscado, cheio de figuras.
    exercises:
      - type: paragraph
        question: "Cultismo caracteriza-se por: (simplicidade/objetividade científica/coloquialismo/linguagem rebuscada)"
        correctAnswer: linguagem rebuscada
        difficulty: 3
        rationale: Culto à forma elaborada.
        objectives: [EM13LP46]
  - pageNumber: 6
    title: Conceptismo
    description: Jogo de ideias, argumentação engenhosa.
    exercises:
      - type: paragraph
        question: "Conceptismo foca em: (descrições sensoriais/poesia lírica/jogos de ideias/narrativas simples)"
        correctAnswer: jogos de ideias
        difficulty: 3
        rationale: Ideias encadeadas com engenho racional.
        objectives: [EM13LP46]
  - pageNumber: 7
    title: Gregório de Matos
    description: "'Boca do Inferno' — poeta satírico."
    exercises:
      - type: paragraph
        question: "Gregório de Matos é conhecido como: (Príncipe dos Poetas/Boca do Inferno/Bruxo do Cosme Velho/Mestre)"
        correctAnswer: Boca do Inferno
        difficulty: 3
        rationale: Alcunha devido à sátira mordaz.
        objectives: [EM13LP46]
  - pageNumber: 8
    title: Padre Vieira
    description: Sermões representam conceptismo barroco.
    exercises:
      - type: paragraph
        question: "Padre Vieira é conhecido por: (sermões/peças de teatro/romances/poemas líricos)"
        correctAnswer: sermões
        difficulty: 3
        rationale: Vieira produziu sermões emblemáticos do Barroco.
        objectives: [EM13LP46]
  - pageNumber: 9
    title: Antítese no Barroco
    description: Figura recorrente que reflete o dualismo.
    exercises:
      - type: paragraph
        question: "Figura de linguagem típica do Barroco: (elipse/catacrese/metonímia/antítese)"
        correctAnswer: antítese
        difficulty: 3
        rationale: Reflete tensões barrocas.
        objectives: [EM13LP47]
  - pageNumber: 10
    title: Revisão Integrada
    description: Associe autor ao movimento.
    exercises:
      - type: paragraph
        question: "Gregório de Matos pertence ao: (Barroco/Quinhentismo/Modernismo/Romantismo)"
        correctAnswer: Barroco
        difficulty: 2
        rationale: Principal poeta barroco brasileiro.
        objectives: [EM13LP47]
target: 10
