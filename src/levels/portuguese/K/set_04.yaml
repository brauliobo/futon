title: Pré-Modernismo e Semana de 22
level: K
subject: portuguese
difficulty: 4
objectives: [EM13LP48]
authorNotes: Euclides da Cunha, Lima Barreto e a Semana de Arte Moderna (1922).
example: "Os Sertões; Triste Fim de Policarpo Quaresma; Paulicéia Desvairada."
pages:
  - pageNumber: 1
    title: Pré-Modernismo
    description: Transição realista-modernista, começo do século XX.
    exercises:
      - type: paragraph
        question: "Pré-Modernismo é período de: (transição para o Modernismo/retorno ao Barroco/exílio total/fim da literatura)"
        correctAnswer: transição para o Modernismo
        difficulty: 3
        rationale: Marca os primeiros 20 anos do séc. XX.
        objectives: [EM13LP48]
  - pageNumber: 2
    title: Euclides da Cunha
    description: "'Os Sertões' — relato de Canudos."
    exercises:
      - type: paragraph
        question: "'Os Sertões' retrata: (Guerra de Canudos/Guerra do Paraguai/Independência/Revolução de 30)"
        correctAnswer: Guerra de Canudos
        difficulty: 3
        rationale: Euclides narra e analisa o conflito.
        objectives: [EM13LP48]
  - pageNumber: 3
    title: Lima Barreto
    description: Crítica social, sátira, negritude.
    exercises:
      - type: paragraph
        question: "'Triste Fim de Policarpo Quaresma' é de: (Lima Barreto/Machado de Assis/Mário de Andrade/Oswald de Andrade)"
        correctAnswer: Lima Barreto
        difficulty: 3
        rationale: Crítica ao nacionalismo ingênuo.
        objectives: [EM13LP48]
  - pageNumber: 4
    title: Semana de Arte Moderna
    description: Fevereiro de 1922, São Paulo.
    exercises:
      - type: paragraph
        question: "Semana de Arte Moderna ocorreu em: (1922/1822/1960/1988)"
        correctAnswer: 1922
        difficulty: 1
        rationale: Marco do Modernismo brasileiro.
        objectives: [EM13LP48]
  - pageNumber: 5
    title: Objetivos do Modernismo
    description: Romper com o passado, inovar na forma e temática.
    exercises:
      - type: paragraph
        question: "O Modernismo queria: (romper com o passado/voltar ao Barroco/preservar o Arcadismo/copiar o Romantismo)"
        correctAnswer: romper com o passado
        difficulty: 2
        rationale: Busca da originalidade e identidade nacional.
        objectives: [EM13LP48]
  - pageNumber: 6
    title: Oswald de Andrade
    description: "'Pau-Brasil' e o Manifesto Antropófago."
    exercises:
      - type: paragraph
        question: "Manifesto Antropófago foi escrito por: (Oswald de Andrade/Mário de Andrade/Manuel Bandeira/Cecília Meireles)"
        correctAnswer: Oswald de Andrade
        difficulty: 3
        rationale: Oswald propôs 'devorar' a cultura estrangeira.
        objectives: [EM13LP48]
  - pageNumber: 7
    title: Mário de Andrade
    description: "'Macunaíma' e a pesquisa folclórica."
    exercises:
      - type: paragraph
        question: "'Macunaíma' é obra de: (Mário de Andrade/Oswald de Andrade/Jorge Amado/Carlos Drummond)"
        correctAnswer: Mário de Andrade
        difficulty: 3
        rationale: Romance rapsódico do Modernismo.
        objectives: [EM13LP48]
  - pageNumber: 8
    title: Manuel Bandeira
    description: Poesia modernista com temas do cotidiano.
    exercises:
      - type: paragraph
        question: "'Vou-me embora pra Pasárgada' é de: (Manuel Bandeira/Oswald de Andrade/Mário de Andrade/Cecília Meireles)"
        correctAnswer: Manuel Bandeira
        difficulty: 3
        rationale: Poema clássico de Bandeira.
        objectives: [EM13LP48]
  - pageNumber: 9
    title: Verso Livre
    description: Característica central do Modernismo.
    exercises:
      - type: paragraph
        question: "Verso livre: (sem métrica fixa/com métrica rigorosa/só decassílabo/rima obrigatória)"
        correctAnswer: sem métrica fixa
        difficulty: 2
        rationale: Liberdade formal marca o Modernismo.
        objectives: [EM13LP48]
  - pageNumber: 10
    title: Revisão Integrada
    description: Reconheça característica ou autor.
    exercises:
      - type: paragraph
        question: "Poema 'Paulicéia Desvairada' é de: (Mário de Andrade/Oswald de Andrade/Manuel Bandeira/Carlos Drummond)"
        correctAnswer: Mário de Andrade
        difficulty: 3
        rationale: Marco poético do Modernismo brasileiro (1922).
        objectives: [EM13LP48]
target: 10
