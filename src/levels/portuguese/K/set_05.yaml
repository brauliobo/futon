title: Modernismo - 2ª e 3ª Gerações
level: K
subject: portuguese
difficulty: 4
objectives: [EM13LP48, EM13LP49]
authorNotes: 2ª geração (1930) — regionalismo e poesia madura (Drummond, Jorge Amado, Graciliano Ramos). 3ª geração (1945) — Guimarães Rosa, Clarice Lispector.
example: "Vidas Secas; Sentimento do Mundo; Grande Sertão: Veredas. Ex.: 2ª geração inicia em: → 1930."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 80
pages:
  - pageNumber: 1
    title: 2ª Geração Modernista
    description: Romances regionalistas e poesia engajada.
    exercises:
      - type: paragraph
        question: "2ª geração inicia em: (1930/1945/1922/1960)"
        correctAnswer: 1930
        difficulty: 2
        rationale: Período da consolidação do Modernismo.
        objectives: [EM13LP48]
  - pageNumber: 2
    title: Graciliano Ramos
    description: "'Vidas Secas' e 'São Bernardo'."
    exercises:
      - type: paragraph
        question: "'Vidas Secas' retrata: (seca nordestina/cidade grande/costas litorâneas/amazonas)"
        correctAnswer: seca nordestina
        difficulty: 3
        rationale: Retrato seco da retirada pela seca.
        objectives: [EM13LP48]
  - pageNumber: 3
    title: Jorge Amado
    description: Bahia, cultura popular, personagens memoráveis.
    exercises:
      - type: paragraph
        question: "Jorge Amado é associado a: (Bahia e cultura popular/sertão cearense/Rio Grande do Sul/Amazônia)"
        correctAnswer: Bahia e cultura popular
        difficulty: 2
        rationale: Obras ambientadas na Bahia.
        objectives: [EM13LP48]
  - pageNumber: 4
    title: Carlos Drummond de Andrade
    description: "'Sentimento do Mundo', 'No Meio do Caminho'."
    exercises:
      - type: paragraph
        question: "'No meio do caminho tinha uma pedra' é de: (Drummond/Bandeira/Vinicius/Ferreira Gullar)"
        correctAnswer: Drummond
        difficulty: 2
        rationale: Poema emblemático de Drummond.
        objectives: [EM13LP48]
  - pageNumber: 5
    title: Cecília Meireles
    description: Poesia lírica e musical.
    exercises:
      - type: paragraph
        question: "Cecília Meireles destaca-se por: (poesia lírica/romance regionalista/teatro popular/epopeia indígena)"
        correctAnswer: poesia lírica
        difficulty: 3
        rationale: Voz feminina de alta musicalidade.
        objectives: [EM13LP48]
  - pageNumber: 6
    title: 3ª Geração Modernista
    description: 1945 em diante — inovação estilística.
    exercises:
      - type: paragraph
        question: "3ª geração modernista começa em: (1945/1922/1980/1964)"
        correctAnswer: 1945
        difficulty: 3
        rationale: Pós-Segunda Guerra.
        objectives: [EM13LP49]
  - pageNumber: 7
    title: João Guimarães Rosa
    description: "'Grande Sertão: Veredas'."
    exercises:
      - type: paragraph
        question: "Guimarães Rosa é famoso por: (linguagem inventiva e sertão/poesia parnasiana/crônica urbana/teatro de arena)"
        correctAnswer: linguagem inventiva e sertão
        difficulty: 4
        rationale: Criação lexical e sintática única.
        objectives: [EM13LP49]
  - pageNumber: 8
    title: Clarice Lispector
    description: Prosa introspectiva e epifanias.
    exercises:
      - type: paragraph
        question: "Clarice Lispector é autora de: (A Paixão Segundo G.H./Macunaíma/Vidas Secas/Sagarana)"
        correctAnswer: A Paixão Segundo G.H.
        difficulty: 3
        rationale: Obra-chave de prosa introspectiva.
        objectives: [EM13LP49]
  - pageNumber: 9
    title: João Cabral de Melo Neto
    description: Poesia 'antilírica', concreta e cerebral.
    exercises:
      - type: paragraph
        question: "João Cabral escreve de forma: (concisa e antilírica/excessivamente emotiva/narrativa-fantástica/religiosa)"
        correctAnswer: concisa e antilírica
        difficulty: 4
        rationale: Poesia racional, com secura estilística.
        objectives: [EM13LP49]
  - pageNumber: 10
    title: Revisão Integrada
    description: Autor e movimento.
    exercises:
      - type: paragraph
        question: "'Morte e Vida Severina' é de: (João Cabral de Melo Neto/Drummond/Clarice Lispector/Graciliano Ramos)"
        correctAnswer: João Cabral de Melo Neto
        difficulty: 3
        rationale: Auto de Natal pernambucano, clássico de João Cabral.
        objectives: [EM13LP49]
target: 10
