title: 🎼 Análise de Poema — Métricas e Recursos
level: K
subject: portuguese
difficulty: 5
objectives: [EM13LP47, EM13LP49]
authorNotes: Técnicas de análise poética: métrica, escansão, figuras de linguagem, formas fixas e verso livre.
example: "Décima sílaba tônica = decassílabo. Ex.: 'Ca-mi-nha-va-len-ta-men-te-pe-la-rua' → decassílabo."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Escansão e Contagem de Sílabas
    description: Como fazer a contagem métrica dos versos.
    exercises:
      - type: paragraph
        question: "Na escansão, conta-se até a última sílaba tônica porque: (é regra arbitrária/sílabas átonas finais não têm valor métrico em português/facilita a rima/é a sílaba mais longa)"
        correctAnswer: sílabas átonas finais não têm valor métrico em português
        difficulty: 3
        rationale: O verso termina na última tônica; oxítono soma +0, paroxítono +1, proparoxítono +2.
        objectives: [EM13LP47]
  - pageNumber: 2
    title: Versos Mais Comuns
    description: Classificação dos versos por número de sílabas.
    exercises:
      - type: paragraph
        question: "Verso com sete sílabas poéticas é chamado: (decassílabo/alexandrino/redondilha maior/octossílabo)"
        correctAnswer: redondilha maior
        difficulty: 2
        rationale: Redondilha maior tem 7 sílabas; menor tem 5; decassílabo tem 10; alexandrino tem 12.
        objectives: [EM13LP47]
  - pageNumber: 3
    title: Rima Toante e Consoante
    description: Tipos de rima na poesia.
    exercises:
      - type: paragraph
        question: "Rima toante difere da consoante porque: (é mais perfeita/coincide apenas as vogais tônicas, não as consoantes/é interna/ocorre no mesmo verso)"
        correctAnswer: coincide apenas as vogais tônicas, não as consoantes
        difficulty: 3
        rationale: Rima consoante: coincidência total a partir da tônica. Toante: só vogais.
        objectives: [EM13LP47]
  - pageNumber: 4
    title: Figuras de Linguagem — Metáfora
    description: Principal figura de sentido na poesia.
    exercises:
      - type: paragraph
        question: "A diferença entre metáfora e comparação (símile) é que a metáfora: (usa 'como'/estabelece identidade direta sem conectivo comparativo/é mais longa/é mais fraca)"
        correctAnswer: estabelece identidade direta sem conectivo comparativo
        difficulty: 3
        rationale: Comparação usa 'como', 'tal qual'; metáfora identifica diretamente os termos.
        objectives: [EM13LP49]
  - pageNumber: 5
    title: Metonímia e Sinédoque
    description: Figuras de substituição por contiguidade.
    exercises:
      - type: paragraph
        question: "Usar 'ler Machado' em vez de 'ler obras de Machado' é exemplo de: (metáfora/antonomásia/metonímia/hipérbole)"
        correctAnswer: metonímia
        difficulty: 3
        rationale: Substitui a obra pelo nome do autor, relação de contiguidade — metonímia do criador.
        objectives: [EM13LP49]
  - pageNumber: 6
    title: Anáfora e Epífora
    description: Figuras de repetição estrutural no poema.
    exercises:
      - type: paragraph
        question: "Anáfora é a repetição de: (palavra no fim de versos/palavra ou expressão no início de versos consecutivos/sílabas internas/sons consonantais)"
        correctAnswer: palavra ou expressão no início de versos consecutivos
        difficulty: 3
        rationale: Anáfora é repetição inicial; epífora é repetição final de versos.
        objectives: [EM13LP47]
  - pageNumber: 7
    title: Hipérbato e Inversão
    description: Figuras de sintaxe na linguagem poética.
    exercises:
      - type: paragraph
        question: "O hipérbato consiste em: (criar imagens/inverter a ordem sintática natural da frase/repetir sons/usar palavras de sentido contrário)"
        correctAnswer: inverter a ordem sintática natural da frase
        difficulty: 3
        rationale: O hipérbato desloca termos de sua posição lógica para fins rítmicos ou expressivos.
        objectives: [EM13LP47]
  - pageNumber: 8
    title: Soneto — Forma Fixa
    description: Estrutura do soneto clássico.
    exercises:
      - type: paragraph
        question: "O soneto clássico é composto por: (três estrofes longas/dois quartetos e dois tercetos/quatro quintilhas/oito dísticos)"
        correctAnswer: dois quartetos e dois tercetos
        difficulty: 2
        rationale: 14 versos distribuídos em 4-4-3-3 é a estrutura canônica do soneto.
        objectives: [EM13LP47]
  - pageNumber: 9
    title: Verso Livre e Modernismo
    description: A ruptura métrica no Modernismo.
    exercises:
      - type: paragraph
        question: "O verso livre, adotado pelos modernistas, caracteriza-se por: (métrica regular e rima obrigatória/ausência de métrica fixa e rima obrigatória/hemistíquios iguais/uso de refrão)"
        correctAnswer: ausência de métrica fixa e rima obrigatória
        difficulty: 2
        rationale: O verso livre rompe com a tradição métrica clássica para ganhar liberdade expressiva.
        objectives: [EM13LP47]
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplicação das técnicas de análise poética.
    exercises:
      - type: paragraph
        question: "Em 'Amor é fogo que arde sem se ver', a figura predominante é a: (hipérbole/antítese/catacrese/eufemismo)"
        correctAnswer: antítese
        difficulty: 3
        rationale: O verso de Camões acumula contradições — antíteses que definem o amor paradoxal.
        objectives: [EM13LP49]
target: 10
