title: ✍️ Produção — Análise Crítica de Obra Literária
level: K
subject: portuguese
difficulty: 5
objectives: [EM13LP49, EM13LP50]
authorNotes: "Como escrever uma análise crítica literária: tese, argumento, evidência textual e síntese avaliativa."
example: "Análise crítica exige tese e evidência. Ex.: afirmar 'Bentinho é não confiável' → citar passos do texto."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: O que é Análise Crítica
    description: Distinção entre resumo e análise crítica.
    exercises:
      - type: paragraph
        question: "A análise crítica difere do resumo porque: (é mais curta/interpreta e avalia a obra com argumentação sustentada por evidências textuais/lista personagens/apenas descreve o enredo)"
        correctAnswer: interpreta e avalia a obra com argumentação sustentada por evidências textuais
        difficulty: 2
        rationale: Resumo descreve; análise crítica argumenta, interpreta e avalia com base no texto.
        objectives: [EM13LP49]
  - pageNumber: 2
    title: Formulação de Tese
    description: Como elaborar uma tese interpretativa.
    exercises:
      - type: paragraph
        question: "Uma boa tese de análise crítica deve ser: (óbvia e descritiva/interpretativa, específica e passível de sustentação textual/genérica e vaga/baseada em dados biográficos)"
        correctAnswer: interpretativa, específica e passível de sustentação textual
        difficulty: 3
        rationale: A tese é a posição crítica do analista, que deve poder ser provada com o texto.
        objectives: [EM13LP49]
  - pageNumber: 3
    title: Evidência Textual
    description: Uso de citações e referências ao texto.
    exercises:
      - type: paragraph
        question: "Ao usar citação do texto na análise crítica, o analista deve: (apenas transcrever/integrar a citação ao argumento e comentá-la analiticamente/colocar no final/evitar aspas)"
        correctAnswer: integrar a citação ao argumento e comentá-la analiticamente
        difficulty: 3
        rationale: Citações sem comentário não constroem argumento; devem ser analisadas, não só transcritas.
        objectives: [EM13LP49]
  - pageNumber: 4
    title: Estrutura da Análise Crítica
    description: Organização do texto de análise.
    exercises:
      - type: paragraph
        question: "A estrutura básica de uma análise crítica é: (narração, descrição, dissertação/introdução com tese, desenvolvimento argumentativo, conclusão avaliativa/ficha técnica, resumo, opinião/tema, contexto, apêndice)"
        correctAnswer: introdução com tese, desenvolvimento argumentativo, conclusão avaliativa
        difficulty: 2
        rationale: Toda análise crítica organiza-se em torno de uma tese que é desenvolvida e concluída.
        objectives: [EM13LP50]
  - pageNumber: 5
    title: Linguagem da Crítica Literária
    description: Registro e vocabulário adequados.
    exercises:
      - type: paragraph
        question: "A linguagem adequada para a análise crítica literária é: (coloquial e subjetiva/formal, analítica e com uso do vocabulário técnico-literário/poética e emotiva/jornalística e informativa)"
        correctAnswer: formal, analítica e com uso do vocabulário técnico-literário
        difficulty: 2
        rationale: A crítica literária requer registro formal e precisão terminológica para ser convincente.
        objectives: [EM13LP50]
  - pageNumber: 6
    title: Análise do Narrador
    description: Incluir análise narratológica na crítica.
    exercises:
      - type: paragraph
        question: "Ao analisar o narrador de Memórias Póstumas, o crítico deve identificar que Brás Cubas é: (neutro e confiável/não confiável, pois narra após a morte com ironia e parcialidade/onisciente e imparcial/personagem secundário)"
        correctAnswer: não confiável, pois narra após a morte com ironia e parcialidade
        difficulty: 4
        rationale: O narrador defunto de Machado usa a morte como liberdade para narrar com ironia e viés.
        objectives: [EM13LP49]
  - pageNumber: 7
    title: Contextualização Histórico-Literária
    description: Inserir a obra em seu contexto sem determinar o sentido.
    exercises:
      - type: paragraph
        question: "O contexto histórico na análise crítica deve ser usado para: (substituir a análise textual/iluminar escolhas da obra sem reduzir o texto ao contexto/comprovar a biografia/definir o gênero)"
        correctAnswer: iluminar escolhas da obra sem reduzir o texto ao contexto
        difficulty: 4
        rationale: O contexto auxilia a interpretação, mas a análise deve centrar-se no texto literário.
        objectives: [EM13LP50]
  - pageNumber: 8
    title: Análise Estilística
    description: Comentar escolhas linguísticas e seus efeitos.
    exercises:
      - type: paragraph
        question: "A análise estilística contribui para a crítica porque: (descreve o visual da página/mostra como as escolhas linguísticas produzem efeitos de sentido e intensidade/conta a biografia/mede o número de palavras)"
        correctAnswer: mostra como as escolhas linguísticas produzem efeitos de sentido e intensidade
        difficulty: 4
        rationale: Analisar estilo é vincular forma e conteúdo — a escolha das palavras constrói o significado.
        objectives: [EM13LP49]
  - pageNumber: 9
    title: Avaliação e Julgamento Crítico
    description: O papel da avaliação na análise crítica.
    exercises:
      - type: paragraph
        question: "Um juízo crítico de valor sobre a obra deve ser: (subjetivo e emocional/fundamentado em critérios estéticos e argumentação textual/baseado em preferência pessoal/omitido na análise formal)"
        correctAnswer: fundamentado em critérios estéticos e argumentação textual
        difficulty: 3
        rationale: A avaliação crítica deve ser justificada com critérios e evidências, não apenas intuição.
        objectives: [EM13LP50]
  - pageNumber: 10
    title: Revisão Integrada
    description: Síntese da análise crítica literária.
    exercises:
      - type: paragraph
        question: "O elemento que distingue uma análise crítica de alta qualidade é: (número de páginas/articulação coerente de tese, evidência textual e argumento bem desenvolvido/quantidade de citações/uso de notas de rodapé)"
        correctAnswer: articulação coerente de tese, evidência textual e argumento bem desenvolvido
        difficulty: 3
        rationale: A qualidade da análise está na coerência argumentativa e no rigor com o texto.
        objectives: [EM13LP49]
target: 10
