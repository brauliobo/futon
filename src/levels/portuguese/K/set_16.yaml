title: 🔬 Crítica Literária e Teoria
level: K
subject: portuguese
difficulty: 5
objectives: [EM13LP49, EM13LP50]
authorNotes: "Fundamentos de teoria e crítica literária: estruturalismo, formalismo, recepção, gêneros, cânone."
example: "Crítica imanente analisa o texto em si. Ex.: analisar rima sem citar biografia → crítica imanente."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Crítica Biográfica
    description: Relação entre vida do autor e obra literária.
    exercises:
      - type: paragraph
        question: "A crítica biográfica interpreta a obra a partir de: (estrutura do texto/vida e contexto do autor/recepção do leitor/ideologia social)"
        correctAnswer: vida e contexto do autor
        difficulty: 2
        rationale: A crítica biográfica usa dados da vida do autor para explicar escolhas e temas da obra.
        objectives: [EM13LP49]
  - pageNumber: 2
    title: Formalismo Russo
    description: Análise literária centrada nos recursos formais do texto.
    exercises:
      - type: paragraph
        question: "O Formalismo Russo estuda na obra literária: (a vida do autor/os recursos formais que tornam o texto literário — a 'literariedade'/o contexto histórico/a recepção do público)"
        correctAnswer: os recursos formais que tornam o texto literário — a 'literariedade'
        difficulty: 3
        rationale: Os formalistas buscavam definir o que faz um texto ser literário em sua forma.
        objectives: [EM13LP49]
  - pageNumber: 3
    title: Estruturalismo
    description: A análise da obra como sistema de signos.
    exercises:
      - type: paragraph
        question: "O estruturalismo literário trata a obra como: (expressão do autor/sistema de signos com relações internas/reflexo da sociedade/produto da recepção)"
        correctAnswer: sistema de signos com relações internas
        difficulty: 3
        rationale: O estruturalismo analisa relações sincrônicas internas, influenciado por Saussure.
        objectives: [EM13LP49]
  - pageNumber: 4
    title: Teoria da Recepção
    description: O papel do leitor na construção do sentido.
    exercises:
      - type: paragraph
        question: "A Estética da Recepção (Jauss) defende que o sentido do texto: (está fixo no texto/é construído na interação entre texto e leitor/pertence ao autor/é determinado pelo contexto histórico)"
        correctAnswer: é construído na interação entre texto e leitor
        difficulty: 3
        rationale: Jauss e Iser colocam o leitor como cocriador do sentido literário.
        objectives: [EM13LP50]
  - pageNumber: 5
    title: Horizonte de Expectativa
    description: Conceito central da Estética da Recepção.
    exercises:
      - type: paragraph
        question: "Horizonte de expectativa é o conjunto de: (erros do leitor/normas e expectativas do leitor que determinam sua recepção da obra/regras do autor/técnicas formais)"
        correctAnswer: normas e expectativas do leitor que determinam sua recepção da obra
        difficulty: 4
        rationale: O horizonte de expectativa determina como o leitor recepciona e avalia uma obra.
        objectives: [EM13LP50]
  - pageNumber: 6
    title: Cânone Literário
    description: A seleção de obras consideradas essenciais.
    exercises:
      - type: paragraph
        question: "O cânone literário é criticado por: (incluir muitos autores/refletir escolhas de grupos dominantes, excluindo vozes marginalizadas/ser muito antigo/mudar com frequência)"
        correctAnswer: refletir escolhas de grupos dominantes, excluindo vozes marginalizadas
        difficulty: 4
        rationale: Estudos pós-coloniais e feministas questionam o cânone por excluir mulheres e minorias.
        objectives: [EM13LP50]
  - pageNumber: 7
    title: Gêneros Literários
    description: Classificação das formas literárias.
    exercises:
      - type: paragraph
        question: "A tríade clássica dos gêneros literários é: (conto, novela, romance/épico, lírico, dramático/poema, prosa, teatro/narrativa, dissertação, descrição)"
        correctAnswer: épico, lírico, dramático
        difficulty: 2
        rationale: "Aristóteles define os três gêneros fundamentais: épica, lírica e drama."
        objectives: [EM13LP49]
  - pageNumber: 8
    title: Intertextualidade Teórica
    description: Relações entre textos na teoria literária.
    exercises:
      - type: paragraph
        question: "Julia Kristeva cunhou o termo intertextualidade para indicar que: (textos são independentes/todo texto é tecido de outros textos que o precederam/autores se copiam/há apenas uma tradição)"
        correctAnswer: todo texto é tecido de outros textos que o precederam
        difficulty: 4
        rationale: Para Kristeva, qualquer texto absorve e transforma textos anteriores.
        objectives: [EM13LP50]
  - pageNumber: 9
    title: Mimese e Representação
    description: O conceito de imitação na teoria literária.
    exercises:
      - type: paragraph
        question: "Para Aristóteles, a mimese literária é: (cópia servil da realidade/representação criativa que revela o universal pelo particular/mentira/exagero)"
        correctAnswer: representação criativa que revela o universal pelo particular
        difficulty: 4
        rationale: A mimese aristotélica não é cópia, mas representação que capta o essencial humano.
        objectives: [EM13LP49]
  - pageNumber: 10
    title: Revisão Integrada
    description: Síntese das correntes de crítica literária.
    exercises:
      - type: paragraph
        question: "Analisar como leitores de diferentes épocas interpretam Dom Casmurro é método da: (crítica biográfica/crítica marxista/Estética da Recepção/crítica formalista)"
        correctAnswer: Estética da Recepção
        difficulty: 3
        rationale: Estudar a recepção ao longo do tempo é central na teoria da recepção de Jauss.
        objectives: [EM13LP50]
target: 10
