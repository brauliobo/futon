title: 🇵🇹 Literatura Portuguesa Contemporânea
level: K
subject: portuguese
difficulty: 5
objectives: [EM13LP46, EM13LP47]
authorNotes: Fernando Pessoa (heterônimos, modernismo) e José Saramago (romance contemporâneo, Prêmio Nobel 1998).
example: "Pessoa cria heterônimos com biografias. Ex.: Alberto Caeiro → poeta da natureza sem metafísica."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Fernando Pessoa — Vida e Obra
    description: Maior poeta português do séc. XX e sua complexidade.
    exercises:
      - type: paragraph
        question: "Fernando Pessoa publica Mensagem em 1934, único livro em português que lançou em vida, de tema: (naturalista/amoroso/sebastianismo e destino místico de Portugal/satírico)"
        correctAnswer: sebastianismo e destino místico de Portugal
        difficulty: 3
        rationale: Mensagem celebra o mito sebastianista e a grandeza espiritual de Portugal.
        objectives: [EM13LP46]
  - pageNumber: 2
    title: Heterônimos de Pessoa
    description: Criação de identidades literárias autônomas.
    exercises:
      - type: paragraph
        question: "Um heterônimo difere de um pseudônimo porque: (é nome de editora/é nome falso/tem biografia, estética e visão de mundo próprias, independentes do autor/é personagem de romance)"
        correctAnswer: tem biografia, estética e visão de mundo próprias, independentes do autor
        difficulty: 3
        rationale: O heterônimo é uma pessoa literária completa; o pseudônimo é apenas outro nome.
        objectives: [EM13LP46]
  - pageNumber: 3
    title: Alberto Caeiro
    description: O heterônimo da sensação pura e da natureza.
    exercises:
      - type: paragraph
        question: "Alberto Caeiro é chamado 'mestre' de Pessoa porque: (escreveu mais obras/é o mais famoso/sua poesia pagã e sensacionista fundamenta os outros heterônimos/é o mais antigo)"
        correctAnswer: sua poesia pagã e sensacionista fundamenta os outros heterônimos
        difficulty: 4
        rationale: Caeiro nega o pensamento e valoriza apenas a sensação, origem filosófica dos demais.
        objectives: [EM13LP46]
  - pageNumber: 4
    title: Ricardo Reis e Álvaro de Campos
    description: Dois heterônimos de tendências opostas.
    exercises:
      - type: paragraph
        question: "Álvaro de Campos difere de Ricardo Reis por: (escrever odes horacianas/ser clássico e equilibrado/ser sensacionista, industrial e excessivo/ser pagão simples)"
        correctAnswer: ser sensacionista, industrial e excessivo
        difficulty: 4
        rationale: Campos é moderno, futurista, contraditório; Reis é classicista e estóico.
        objectives: [EM13LP47]
  - pageNumber: 5
    title: Fernando Pessoa Ortônimo
    description: A voz do 'ele mesmo' na obra pessoana.
    exercises:
      - type: paragraph
        question: "O ortônimo Fernando Pessoa caracteriza-se pela: (objetividade e simplicidade/fingimento poético e intelectualismo atormentado/naturalismo descritivo/crítica social direta)"
        correctAnswer: fingimento poético e intelectualismo atormentado
        difficulty: 4
        rationale: "'O poeta é um fingidor' — o ortônimo explora a dor de existir e o jogo da identidade."
        objectives: [EM13LP46]
  - pageNumber: 6
    title: José Saramago — Estilo
    description: Características formais da prosa de Saramago.
    exercises:
      - type: paragraph
        question: "A prosa de Saramago é reconhecida por: (parágrafos curtos e diálogos demarcados/períodos longos, diálogos sem aspas e pontuação não convencional/linguagem poética/narrador onisciente neutro)"
        correctAnswer: períodos longos, diálogos sem aspas e pontuação não convencional
        difficulty: 3
        rationale: Saramago usa fluxo narrativo contínuo que apaga fronteiras entre fala e narração.
        objectives: [EM13LP47]
  - pageNumber: 7
    title: Ensaio sobre a Cegueira
    description: Alegoria social na obra mais conhecida de Saramago.
    exercises:
      - type: paragraph
        question: "Em Ensaio sobre a Cegueira, a epidemia de cegueira branca é alegoria de: (doença real/degradação moral e perda de humanidade na sociedade/guerra nuclear/migração em massa)"
        correctAnswer: degradação moral e perda de humanidade na sociedade
        difficulty: 3
        rationale: A cegueira funciona como metáfora da indiferença e da barbárie humana.
        objectives: [EM13LP46]
  - pageNumber: 8
    title: Memorial do Convento
    description: Romance histórico de Saramago.
    exercises:
      - type: paragraph
        question: "Memorial do Convento reconstrói a história portuguesa focando: (a nobreza e o rei/os trabalhadores anônimos que construíram Mafra/a Inquisição/os descobrimentos)"
        correctAnswer: os trabalhadores anônimos que construíram Mafra
        difficulty: 3
        rationale: Saramago desloca o herói da nobreza para o povo, subvertendo a historiografia oficial.
        objectives: [EM13LP46]
  - pageNumber: 9
    title: Modernismo Português
    description: Geração da revista Orpheu e ruptura estética.
    exercises:
      - type: paragraph
        question: "A revista Orpheu (1915) representa no Portugal o mesmo papel que, no Brasil, representa: (Os Sertões/a Semana de Arte Moderna de 1922/o Romantismo/o Parnasianismo)"
        correctAnswer: a Semana de Arte Moderna de 1922
        difficulty: 4
        rationale: Orpheu e a Semana de 22 são marcos do Modernismo em Portugal e no Brasil.
        objectives: [EM13LP46]
  - pageNumber: 10
    title: Revisão Integrada
    description: Síntese de Pessoa e Saramago.
    exercises:
      - type: paragraph
        question: "Fernando Pessoa e José Saramago têm em comum: (o estilo simples/a grandeza na literatura portuguesa contemporânea e universal/o tema nacionalista/o verso clássico)"
        correctAnswer: a grandeza na literatura portuguesa contemporânea e universal
        difficulty: 2
        rationale: Ambos são os maiores nomes da literatura portuguesa nos séculos XX e XXI.
        objectives: [EM13LP47]
target: 10
