title: 🔗 Intertextualidade em Literatura
level: K
subject: portuguese
difficulty: 5
objectives: [EM13LP49, EM13LP50]
authorNotes: "Intertextualidade: paródia, pastiche, alusão, epígrafes; relações entre textos na literatura brasileira."
example: "Paródia transforma criticamente o texto fonte. Ex.: Oswald de Andrade relê Carta de Caminha → paródia."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Conceito de Intertextualidade
    description: Definição e abrangência do fenômeno intertextual.
    exercises:
      - type: paragraph
        question: "Intertextualidade ocorre quando: (há rima entre versos/um autor inventa tema totalmente novo/um texto dialoga com outros textos, citando, transformando ou aludindo/dois autores escrevem juntos)"
        correctAnswer: um texto dialoga com outros textos, citando, transformando ou aludindo
        difficulty: 2
        rationale: Intertextualidade é a relação de um texto com outros textos da tradição cultural.
        objectives: [EM13LP50]
  - pageNumber: 2
    title: Citação e Epígrafe
    description: Formas explícitas de intertextualidade.
    exercises:
      - type: paragraph
        question: "A epígrafe funciona como intertextualidade porque: (substitui o prefácio/abre o capítulo aleatoriamente/ativa um texto alheio para enquadrar o sentido da obra que se inicia/é nota de rodapé)"
        correctAnswer: ativa um texto alheio para enquadrar o sentido da obra que se inicia
        difficulty: 3
        rationale: A epígrafe cria um diálogo entre o texto-fonte e a obra que a utiliza.
        objectives: [EM13LP50]
  - pageNumber: 3
    title: Paródia
    description: Transformação crítica ou humorística de um texto.
    exercises:
      - type: paragraph
        question: "A diferença entre paródia e pastiche é que a paródia: (usa o mesmo tema/imita sem criticar/transforma criticamente ou ironiza o texto-fonte/é mais longa)"
        correctAnswer: transforma criticamente ou ironiza o texto-fonte
        difficulty: 3
        rationale: Pastiche imita sem ironia; paródia subverte o original com humor ou crítica.
        objectives: [EM13LP49]
  - pageNumber: 4
    title: Paródia Modernista
    description: Uso da paródia pelos modernistas brasileiros.
    exercises:
      - type: paragraph
        question: "Oswald de Andrade usa paródia ao reescrever a Carta de Caminha no poema 'Carta-Pêro', porque: (admira o original/subverte o discurso colonial com humor e crítica/desconhece a carta/imita o estilo quinhentista)"
        correctAnswer: subverte o discurso colonial com humor e crítica
        difficulty: 4
        rationale: Oswald reescreve a Carta ironicamente para desmistificar o discurso de descoberta.
        objectives: [EM13LP49]
  - pageNumber: 5
    title: Alusão Literária
    description: Referência implícita a outros textos.
    exercises:
      - type: paragraph
        question: "A alusão literária difere da citação porque: (é mais longa/é referência implícita que pressupõe o conhecimento do leitor/usa aspas/é sempre humorística)"
        correctAnswer: é referência implícita que pressupõe o conhecimento do leitor
        difficulty: 3
        rationale: A alusão evoca sem citar diretamente; depende do repertório do leitor para funcionar.
        objectives: [EM13LP50]
  - pageNumber: 6
    title: Hipotexto e Hipertexto
    description: Conceitos de Genette para relações intertextuais.
    exercises:
      - type: paragraph
        question: "Na teoria de Genette, hipotexto é o texto: (posterior e derivado/fonte que origina ou inspira o hipertexto/mais recente/publicado depois)"
        correctAnswer: fonte que origina ou inspira o hipertexto
        difficulty: 4
        rationale: Hipotexto é a origem; hipertexto é o texto que dele deriva ou o transforma.
        objectives: [EM13LP50]
  - pageNumber: 7
    title: Intertextualidade e Romantismo
    description: Romantismo como intertexto para obras posteriores.
    exercises:
      - type: paragraph
        question: "Macunaíma de Mário de Andrade dialoga com o Romantismo indianista ao: (imitá-lo/subvertê-lo com ironia e antropofagia cultural/ignorá-lo/traduzi-lo)"
        correctAnswer: subvertê-lo com ironia e antropofagia cultural
        difficulty: 4
        rationale: Mário retoma o índio romântico para desconstruí-lo com crítica modernista.
        objectives: [EM13LP49]
  - pageNumber: 8
    title: Tradução e Transcriação
    description: Haroldo de Campos e a tradução criativa.
    exercises:
      - type: paragraph
        question: "A transcriação de Haroldo de Campos é: (tradução literal/recriação poética que preserva o efeito estético em vez do sentido literal/adaptação para crianças/resumo do original)"
        correctAnswer: recriação poética que preserva o efeito estético em vez do sentido literal
        difficulty: 4
        rationale: Haroldo defende que traduzir poesia é recriar seus efeitos, não apenas seu conteúdo.
        objectives: [EM13LP50]
  - pageNumber: 9
    title: Intertextualidade Intermidiática
    description: Relações entre literatura e outras artes.
    exercises:
      - type: paragraph
        question: "Quando um romance é adaptado para o cinema, ocorre intertextualidade: (intratextual/intermidiática ou intersemiótica/interlinguística/fonológica)"
        correctAnswer: intermidiática ou intersemiótica
        difficulty: 3
        rationale: A transposição entre linguagens (literatura→cinema) é intertextualidade intersemiótica.
        objectives: [EM13LP50]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identificação de tipos de intertextualidade.
    exercises:
      - type: paragraph
        question: "A 'Canção do Exílio' de Murilo Mendes que ironiza a de Gonçalves Dias é exemplo de: (citação/epígrafe/paródia/pastiche)"
        correctAnswer: paródia
        difficulty: 3
        rationale: Murilo subverte ironicamente o poema romântico de Dias — intertextualidade paródica.
        objectives: [EM13LP49]
target: 10
