title: 📖 Análise de Texto em Prosa — Técnica
level: K
subject: portuguese
difficulty: 5
objectives: [EM13LP49, EM13LP50]
authorNotes: "Técnicas de análise de prosa: narrador, foco narrativo, tempo, espaço, personagens e enredo."
example: "Narrador onisciente sabe tudo. Ex.: 'ele pensou secretamente' → narrador onisciente intruso."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Tipos de Narrador
    description: Classificação do narrador quanto ao ponto de vista.
    exercises:
      - type: paragraph
        question: "Narrador que participa da história como personagem e usa 1ª pessoa é: (onisciente intruso/onisciente neutro/narrador-personagem/narrador testemunha)"
        correctAnswer: narrador-personagem
        difficulty: 2
        rationale: O narrador-personagem narra em 1ª pessoa e vive os fatos narrados.
        objectives: [EM13LP49]
  - pageNumber: 2
    title: Narrador Onisciente
    description: O narrador que sabe tudo sobre personagens e enredo.
    exercises:
      - type: paragraph
        question: "Narrador onisciente intruso difere do neutro porque: (limita-se ao exterior/usa 1ª pessoa/comenta e opina sobre os fatos e personagens/desconhece o futuro)"
        correctAnswer: comenta e opina sobre os fatos e personagens
        difficulty: 3
        rationale: O intrusivo intervém com julgamentos; o neutro relata sem opinião aparente.
        objectives: [EM13LP49]
  - pageNumber: 3
    title: Foco Narrativo
    description: Perspectiva pela qual a história é contada.
    exercises:
      - type: paragraph
        question: "Uma história narrada em 3ª pessoa com acesso limitado à mente de um só personagem usa foco: (onisciente total/câmera/onisciência seletiva/narrador-testemunha)"
        correctAnswer: onisciência seletiva
        difficulty: 3
        rationale: A onisciência seletiva penetra apenas na consciência do protagonista.
        objectives: [EM13LP49]
  - pageNumber: 4
    title: Tempo na Narrativa
    description: Tempo cronológico e psicológico.
    exercises:
      - type: paragraph
        question: "O tempo psicológico na narrativa refere-se ao: (ordem dos capítulos/calendário do enredo/tempo vivido pela consciência do personagem/duração em horas)"
        correctAnswer: tempo vivido pela consciência do personagem
        difficulty: 3
        rationale: O tempo psicológico é subjetivo, ligado à memória, sonho e fluxo de consciência.
        objectives: [EM13LP50]
  - pageNumber: 5
    title: Analepse e Prolepse
    description: Deslocamentos temporais na narrativa.
    exercises:
      - type: paragraph
        question: "Analepse (flashback) consiste em: (antecipar eventos futuros/retornar ao passado dentro da narrativa/narrar em tempo real/omitir tempo)"
        correctAnswer: retornar ao passado dentro da narrativa
        difficulty: 3
        rationale: Analepse é o recuo temporal; prolepse é a antecipação (flashforward).
        objectives: [EM13LP50]
  - pageNumber: 6
    title: Espaço na Narrativa
    description: Funções do espaço na construção do texto.
    exercises:
      - type: paragraph
        question: "O espaço psicológico na narrativa funciona como: (cenário descritivo/extensão do estado interior do personagem/lugar geográfico real/pano de fundo neutro)"
        correctAnswer: extensão do estado interior do personagem
        difficulty: 4
        rationale: O espaço psicológico reflete e amplifica o estado emocional e mental do personagem.
        objectives: [EM13LP50]
  - pageNumber: 7
    title: Personagens — Classificação
    description: Tipos de personagens na ficção.
    exercises:
      - type: paragraph
        question: "Personagem 'plana' ou 'tipo' é aquela que: (muda ao longo da narrativa/apresenta apenas uma dimensão psicológica constante/tem conflito interior/surpreende o leitor)"
        correctAnswer: apresenta apenas uma dimensão psicológica constante
        difficulty: 3
        rationale: Personagens planas têm um traço dominante e não evoluem; redondas são complexas.
        objectives: [EM13LP49]
  - pageNumber: 8
    title: Enredo — Estrutura
    description: Partes da estrutura narrativa clássica.
    exercises:
      - type: paragraph
        question: "A estrutura do enredo em ordem crescente de tensão é: (clímax, exposição, conflito, desfecho/exposição, conflito, clímax, desfecho/desfecho, clímax, conflito, exposição/conflito, exposição, desfecho, clímax)"
        correctAnswer: exposição, conflito, clímax, desfecho
        difficulty: 2
        rationale: A pirâmide de Freytag organiza o enredo em ordem crescente de tensão.
        objectives: [EM13LP50]
  - pageNumber: 9
    title: Discurso Direto, Indireto e Livre
    description: Formas de representar a fala e o pensamento.
    exercises:
      - type: paragraph
        question: "O discurso indireto livre caracteriza-se por: (usar travessão/fundir voz do narrador e pensamento do personagem sem marca formal/usar aspas/ser sempre em 1ª pessoa)"
        correctAnswer: fundir voz do narrador e pensamento do personagem sem marca formal
        difficulty: 4
        rationale: "O discurso indireto livre é ambíguo: mistura narrador e personagem sem delimitação."
        objectives: [EM13LP49]
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplicação dos conceitos de análise narrativa.
    exercises:
      - type: paragraph
        question: "Em 'Dom Casmurro', o narrador Bentinho é não confiável porque: (é onisciente/sua versão dos fatos é subjetiva e possivelmente distorcida pelo ciúme/é neutro/é testemunha externa)"
        correctAnswer: sua versão dos fatos é subjetiva e possivelmente distorcida pelo ciúme
        difficulty: 4
        rationale: Machado cria um narrador autodiegético cujo relato é enviesado pela dúvida e rancor.
        objectives: [EM13LP49]
target: 10
