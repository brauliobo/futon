title: 📖 Literatura Contemporânea
level: K
subject: portuguese
difficulty: 4
objectives:
  - EM13LP49
  - EM13LP50
authorNotes: Pós-1960 — poesia concreta, literatura marginal, autores contemporâneos como Drummond tardio, Ferreira Gullar, Conceição Evaristo, Mia Couto.
example: "Literatura negra e marginal ganha espaço. Ex.: Mia Couto é escritor: → moçambicano."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 80
pages:
  - pageNumber: 1
    title: Literatura Juvenil Contemporânea – Página 1
    description: Autores como Pedro Bandeira, Lygia Bojunga.
    exercises:
      - type: paragraph
        question: "Lygia Bojunga é autora de literatura: (científica/médica/autobiográfica adulta/infantojuvenil)"
        correctAnswer: infantojuvenil
        difficulty: 2
        rationale: Reconhecida com o Prêmio Hans Christian Andersen.
        objectives:
          - EM13LP50
  - pageNumber: 2
    title: Ferreira Gullar – Página 2
    description: "'Poema Sujo' — síntese política e memorial."
    exercises:
      - type: paragraph
        question: "'Poema Sujo' foi escrito por: (Ferreira Gullar/Drummond/Guimarães Rosa/João Cabral)"
        correctAnswer: Ferreira Gullar
        difficulty: 3
        rationale: Obra escrita no exílio em Buenos Aires.
        objectives:
          - EM13LP49
  - pageNumber: 3
    title: Literatura Marginal – Página 3
    description: Anos 1970, poesia mimeografada fora do circuito editorial.
    exercises:
      - type: paragraph
        question: "Literatura marginal foi predominante nos anos: (1840/1970/1990/1920)"
        correctAnswer: 1970
        difficulty: 3
        rationale: Movimento alternativo à ditadura.
        objectives:
          - EM13LP49
  - pageNumber: 4
    title: Paulo Lins – Página 4
    description: "'Cidade de Deus' — literatura de periferia."
    exercises:
      - type: paragraph
        question: "'Cidade de Deus' retrata: (aristocracia imperial/violência urbana carioca/sertão baiano/selva amazônica)"
        correctAnswer: violência urbana carioca
        difficulty: 3
        rationale: Romance sobre a favela homônima.
        objectives:
          - EM13LP50
  - pageNumber: 5
    title: Mia Couto – Página 5
    description: Literatura africana em língua portuguesa.
    exercises:
      - type: paragraph
        question: "Mia Couto é escritor: (moçambicano/brasileiro/cabo-verdiano/angolano)"
        correctAnswer: moçambicano
        difficulty: 3
        rationale: Autor de 'Terra Sonâmbula' nasceu em Moçambique.
        objectives:
          - EM13LP50
  - pageNumber: 6
    title: Diversidade Contemporânea – Página 6
    description: Vozes femininas, indígenas, LGBT+.
    exercises:
      - type: paragraph
        question: "A literatura contemporânea amplia: (exclusão de vozes sociais/foco apenas em autores canônicos/representatividade de grupos diversos/homogeneidade autoral)"
        correctAnswer: representatividade de grupos diversos
        difficulty: 3
        rationale: Panorama plural caracteriza o contemporâneo.
        objectives:
          - EM13LP50
  - pageNumber: 7
    title: Literatura de Cordel – Página 7
    description: Tradição popular nordestina.
    exercises:
      - type: paragraph
        question: "Cordel caracteriza-se por: (romance longo/crônica urbana/folhetos ilustrados em xilogravura/poesia concreta)"
        correctAnswer: folhetos ilustrados em xilogravura
        difficulty: 3
        rationale: Tradição popular com estrofes rimadas.
        objectives:
          - EM13LP50
  - pageNumber: 8
    title: Poesia Concreta – Página 8
    description: 1950-60, Campos, Pignatari — texto visual.
    exercises:
      - type: paragraph
        question: "Poesia concreta é: (dramática teatral/apenas música/visual e experimental/tradicional métrica)"
        correctAnswer: visual e experimental
        difficulty: 4
        rationale: Prioriza a disposição visual da palavra.
        objectives:
          - EM13LP49
  - pageNumber: 9
    title: Conceição Evaristo – Página 9
    description: Escrevivência, memória, negritude.
    exercises:
      - type: paragraph
        question: "Conceição Evaristo criou o conceito de: (condoreirismo/indianismo/escrevivência/cultismo)"
        correctAnswer: escrevivência
        difficulty: 4
        rationale: Combina experiência vivida e escrita.
        objectives:
          - EM13LP50
  - pageNumber: 10
    title: Revisão Integrada – Página 10
    description: Associe autor à obra contemporânea.
    exercises:
      - type: paragraph
        question: "'Olhos d'Água' é de: (Drummond/Clarice Lispector/Machado de Assis/Conceição Evaristo)"
        correctAnswer: Conceição Evaristo
        difficulty: 4
        rationale: Coletânea de contos marcante da autora.
        objectives:
          - EM13LP50
target: 10
