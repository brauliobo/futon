title: 📝 Realismo e Naturalismo
level: K
subject: portuguese
difficulty: 4
objectives: [EM13LP47, EM13LP48]
authorNotes: Realismo (Machado de Assis), Naturalismo (Aluísio Azevedo), crítica social e determinismo.
example: "Dom Casmurro; O Cortiço. Ex.: 'O Cortiço' é obra de: → Aluísio Azevedo."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 80
pages:
  - pageNumber: 1
    title: Realismo — Contexto
    description: Fim do século XIX, crítica ao Romantismo.
    exercises:
      - type: paragraph
        question: "Realismo opõe-se ao Romantismo por: (idealização emotiva/objetividade e crítica/alta emoção romântica/fé religiosa medieval)"
        correctAnswer: objetividade e crítica
        difficulty: 3
        rationale: Realismo busca retratar a sociedade sem idealização.
        objectives: [EM13LP47]
  - pageNumber: 2
    title: Machado de Assis
    description: Principal autor do Realismo brasileiro.
    exercises:
      - type: paragraph
        question: "'Memórias Póstumas de Brás Cubas' é obra de: (Aluísio Azevedo/Machado de Assis/José de Alencar/Eça de Queirós)"
        correctAnswer: Machado de Assis
        difficulty: 3
        rationale: Marco inicial do Realismo brasileiro é 'Memórias Póstumas' (1881) de Machado de Assis.
        objectives: [EM13LP47]
  - pageNumber: 3
    title: Narrador Machadiano
    description: Irônico, em diálogo com o leitor.
    exercises:
      - type: paragraph
        question: "Característica marcante do narrador machadiano: (neutralidade total/lirismo apaixonado/objetividade jornalística/ironia e metalinguagem)"
        correctAnswer: ironia e metalinguagem
        difficulty: 4
        rationale: Narrador dialoga com o leitor e critica convenções.
        objectives: [EM13LP47]
  - pageNumber: 4
    title: Dom Casmurro
    description: Obra emblemática sobre ciúmes e incerteza.
    exercises:
      - type: paragraph
        question: "'Dom Casmurro' explora: (viagens pelo espaço/batalhas navais históricas/ciúmes e incerteza/mitos indígenas antigos)"
        correctAnswer: ciúmes e incerteza
        difficulty: 3
        rationale: Bentinho x Capitu é tensão central.
        objectives: [EM13LP47]
  - pageNumber: 5
    title: Naturalismo — Contexto
    description: Extensão do Realismo com determinismo biológico/social.
    exercises:
      - type: paragraph
        question: "Naturalismo acrescenta ao Realismo: (fé religiosa cristã/bucolismo pastoral/determinismo científico/idealização romântica)"
        correctAnswer: determinismo científico
        difficulty: 4
        rationale: Ser humano como produto de meio e hereditariedade.
        objectives: [EM13LP48]
  - pageNumber: 6
    title: Aluísio Azevedo
    description: "'O Cortiço' representa o Naturalismo."
    exercises:
      - type: paragraph
        question: "'O Cortiço' é obra de: (Aluísio Azevedo/Machado de Assis/José de Alencar/Graciliano Ramos)"
        correctAnswer: Aluísio Azevedo
        difficulty: 3
        rationale: Romance naturalista sobre habitação coletiva.
        objectives: [EM13LP48]
  - pageNumber: 7
    title: Personagem Naturalista
    description: Determinado pelo meio.
    exercises:
      - type: paragraph
        question: "Em naturalismo, o personagem é: (livre do próprio destino/produto do meio em que vive/herói heroico idealizado/isento de influência externa)"
        correctAnswer: produto do meio em que vive
        difficulty: 4
        rationale: Determinismo ambiental é central.
        objectives: [EM13LP48]
  - pageNumber: 8
    title: Parnasianismo
    description: Poesia realista com forma rigorosa.
    exercises:
      - type: paragraph
        question: "Parnasianismo prioriza: (emoção livre e fluida/mitologia indígena local/teologia cristã medieval/forma rígida e métrica precisa)"
        correctAnswer: forma rígida e métrica precisa
        difficulty: 3
        rationale: Soneto perfeito, métrica precisa.
        objectives: [EM13LP47]
  - pageNumber: 9
    title: Simbolismo
    description: Reação ao Realismo; subjetividade, sinestesias.
    exercises:
      - type: paragraph
        question: "Simbolismo valoriza: (catequese religiosa/objetividade científica/sinestesias e subjetividade/humor popular cotidiano)"
        correctAnswer: sinestesias e subjetividade
        difficulty: 4
        rationale: Simbolismo cruza sentidos (sinestesia) e evoca estados subjetivos.
        objectives: [EM13LP47]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique movimento ou autor.
    exercises:
      - type: paragraph
        question: "Narrador irônico em diálogo com o leitor é marca de: (Machado de Assis/Castro Alves/José de Alencar/Aluísio Azevedo)"
        correctAnswer: Machado de Assis
        difficulty: 3
        rationale: Traço distintivo da narrativa machadiana.
        objectives: [EM13LP47]
target: 10
