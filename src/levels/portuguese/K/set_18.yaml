title: ⚖️ Leitura Comparada de Textos
level: K
subject: portuguese
difficulty: 5
objectives: [EM13LP49, EM13LP50]
authorNotes: Literatura comparada: aproximar textos de épocas, gêneros ou culturas para identificar convergências e divergências.
example: "Comparar Dom Casmurro e Otelo revela ciúme universal. Ex.: Capitu ≈ Desdêmona → tema comparado."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Literatura Comparada
    description: Definição e objetivos da leitura comparada.
    exercises:
      - type: paragraph
        question: "A literatura comparada estuda: (apenas um autor por vez/relações entre obras de diferentes épocas, línguas ou culturas/somente a literatura nacional/apenas textos contemporâneos)"
        correctAnswer: relações entre obras de diferentes épocas, línguas ou culturas
        difficulty: 2
        rationale: Literatura comparada aproxima textos distintos para revelar diálogos e contrastes.
        objectives: [EM13LP50]
  - pageNumber: 2
    title: Comparação Temática
    description: Aproximar textos pelo tema comum.
    exercises:
      - type: paragraph
        question: "A comparação entre 'Morte e Vida Severina' de João Cabral e os Evangelhos é válida porque: (são do mesmo período/ambos tratam da vida humana em contexto de miséria e esperança/têm a mesma forma/são do mesmo autor)"
        correctAnswer: ambos tratam da vida humana em contexto de miséria e esperança
        difficulty: 3
        rationale: A comparação temática une textos de épocas e gêneros distintos pelo tema partilhado.
        objectives: [EM13LP50]
  - pageNumber: 3
    title: Comparação de Estilos
    description: Aproximar autores pela técnica e estilo.
    exercises:
      - type: paragraph
        question: "Comparar Machado de Assis e Gustave Flaubert é pertinente porque: (são contemporâneos e viveram juntos/ambos usam narrador irônico e crítica à burguesia/escrevem no mesmo idioma/têm a mesma biografia)"
        correctAnswer: ambos usam narrador irônico e crítica à burguesia
        difficulty: 3
        rationale: A comparação estilística une Realismo brasileiro e francês por técnicas convergentes.
        objectives: [EM13LP49]
  - pageNumber: 4
    title: Dom Casmurro e Otelo
    description: Comparação clássica do ciúme na literatura.
    exercises:
      - type: paragraph
        question: "A comparação entre Dom Casmurro e Otelo de Shakespeare revela que o ciúme é: (tema exclusivamente brasileiro/tema universal da traição e destruição por ciúme/tema barroco/tema cômico)"
        correctAnswer: tema universal da traição e destruição por ciúme
        difficulty: 3
        rationale: Bentinho e Otelo são narradores/personagens destruídos pelo ciúme em culturas distintas.
        objectives: [EM13LP50]
  - pageNumber: 5
    title: Comparação de Gêneros
    description: Mesmo tema em géneros literários diferentes.
    exercises:
      - type: paragraph
        question: "Comparar um romance e um poema sobre o mesmo tema exige atenção para: (qual é mais antigo/as diferenças de linguagem, estrutura e efeito de cada gênero/o número de páginas/a popularidade do autor)"
        correctAnswer: as diferenças de linguagem, estrutura e efeito de cada gênero
        difficulty: 4
        rationale: Gêneros distintos constroem o mesmo tema de formas radicalmente diferentes.
        objectives: [EM13LP49]
  - pageNumber: 6
    title: Tradição e Ruptura
    description: Comparar obras que dialogam pela continuidade ou quebra.
    exercises:
      - type: paragraph
        question: "Comparar poetas parnasianos com modernistas revela que o Modernismo representa: (continuidade formal/ruptura com a métrica e os temas do Parnasianismo/imitação/tradução)"
        correctAnswer: ruptura com a métrica e os temas do Parnasianismo
        difficulty: 3
        rationale: A comparação diacrônica evidencia como o Modernismo reage contra o Parnasianismo.
        objectives: [EM13LP50]
  - pageNumber: 7
    title: Literatura e Sociedade
    description: Comparar obras pelo contexto social que representam.
    exercises:
      - type: paragraph
        question: "Comparar Vidas Secas de Graciliano Ramos com Morte e Vida Severina evidencia: (estilos opostos/a representação convergente da miséria nordestina em prosa e poesia/autores rivais/diferenças de vocabulário)"
        correctAnswer: a representação convergente da miséria nordestina em prosa e poesia
        difficulty: 4
        rationale: Os dois textos constroem o mesmo universo social nordestino em gêneros diferentes.
        objectives: [EM13LP50]
  - pageNumber: 8
    title: Perspectivas Femininas
    description: Comparar vozes femininas na literatura brasileira.
    exercises:
      - type: paragraph
        question: "Comparar Conceição Evaristo e Clarice Lispector revela: (semelhanças biográficas/perspectivas femininas distintas: uma afro-brasileira e periférica, outra universalista/o mesmo estilo/obras do mesmo período)"
        correctAnswer: perspectivas femininas distintas: uma afro-brasileira e periférica, outra universalista
        difficulty: 4
        rationale: A comparação evidencia como gênero, raça e classe moldam perspectivas literárias.
        objectives: [EM13LP49]
  - pageNumber: 9
    title: Método de Leitura Comparada
    description: Como conduzir uma análise comparativa.
    exercises:
      - type: paragraph
        question: "Uma leitura comparada rigorosa deve: (apenas elencar semelhanças/estabelecer critério claro de comparação e analisar convergências e divergências justificadas/resumir os dois textos/privilegiar o texto mais antigo)"
        correctAnswer: estabelecer critério claro de comparação e analisar convergências e divergências justificadas
        difficulty: 3
        rationale: A leitura comparada precisa de eixo metodológico para ser analítica, não superficial.
        objectives: [EM13LP49]
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplicação da leitura comparada.
    exercises:
      - type: paragraph
        question: "Comparar Iracema de Alencar com Macunaíma de Mário de Andrade quanto ao índio revela: (visões idênticas/a transformação do índio idealizado romântico para o herói ambíguo modernista/autores do mesmo período/textos sem relação)"
        correctAnswer: a transformação do índio idealizado romântico para o herói ambíguo modernista
        difficulty: 4
        rationale: A comparação diacrônica mostra a evolução da representação do índio na literatura.
        objectives: [EM13LP50]
target: 10
