title: ✍️ Texto Dissertativo-Argumentativo
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP17, EF09LP18]
authorNotes: Estrutura (introdução, desenvolvimento, conclusão), tese, argumentos e contra-argumentos. Base para a redação do ENEM e vestibulares.
example: "Tese = posição defendida. Ex.: 'A tecnologia beneficia o aprendizado' → tese que deve ser sustentada com argumentos ao longo do texto."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Estrutura do Texto Dissertativo
    description: Introdução, desenvolvimento e conclusão.
    exercises:
      - type: paragraph
        question: "No texto dissertativo-argumentativo, a tese principal é apresentada na: (bibliografia/conclusão/desenvolvimento/introdução)"
        correctAnswer: introdução
        difficulty: 2
        rationale: A introdução contextualiza o tema e apresenta a tese — posição a ser defendida.
        objectives: [EF09LP17]
  - pageNumber: 2
    title: Tese e Argumento
    description: Tese = opinião; argumento = prova ou razão.
    exercises:
      - type: paragraph
        question: "Em 'A leitura amplia o vocabulário porque expõe o leitor a novas palavras', a tese é: (expõe o leitor a novas palavras/A leitura amplia o vocabulário/novas palavras/o vocabulário)"
        correctAnswer: A leitura amplia o vocabulário
        difficulty: 2
        rationale: A tese é a afirmação principal; 'porque expõe a novas palavras' é o argumento que a sustenta.
        objectives: [EF09LP17]
  - pageNumber: 3
    title: Tipos de Argumento — Autoridade
    description: Citação de especialista ou fonte confiável.
    exercises:
      - type: paragraph
        question: "'Segundo a OMS, o sedentarismo é um dos maiores fatores de risco para doenças crônicas' é argumento de: (analogia/exemplificação/causa e consequência/autoridade)"
        correctAnswer: autoridade
        difficulty: 3
        rationale: Citar organização especializada (OMS) confere credibilidade — argumento de autoridade.
        objectives: [EF09LP17]
  - pageNumber: 4
    title: Tipos de Argumento — Exemplificação
    description: Caso concreto que ilustra a tese.
    exercises:
      - type: paragraph
        question: "'Países como a Finlândia, que investem em educação, têm baixos índices de desigualdade' é argumento de: (comparação abstrata/autoridade/analogia/exemplificação)"
        correctAnswer: exemplificação
        difficulty: 3
        rationale: Um caso concreto (Finlândia) é usado para ilustrar a tese — exemplificação.
        objectives: [EF09LP17]
  - pageNumber: 5
    title: Contra-Argumento e Refutação
    description: Apresentar objeção e rebatê-la fortalece a argumentação.
    exercises:
      - type: paragraph
        question: "No texto argumentativo, apresentar a posição contrária para depois rebatê-la é chamado de: (redundância/tese secundária/contra-argumento e refutação/exemplificação negativa)"
        correctAnswer: contra-argumento e refutação
        difficulty: 3
        rationale: Antecipar e refutar objeções demonstra domínio do tema e fortalece a tese.
        objectives: [EF09LP18]
  - pageNumber: 6
    title: Coesão Textual — Conectivos
    description: Conectivos garantem progressão lógica.
    exercises:
      - type: paragraph
        question: "Para introduzir uma conclusão no último parágrafo, usa-se: (entretanto/além disso/portanto/visto que)"
        correctAnswer: portanto
        difficulty: 3
        rationale: "'Portanto' (ou 'logo', 'assim') marca a conclusão lógica — uso típico na conclusão dissertativa."
        objectives: [EF09LP18]
  - pageNumber: 7
    title: Desenvolvimento — Parágrafos
    description: Cada parágrafo deve ter ideia-núcleo + desenvolvimento.
    exercises:
      - type: paragraph
        question: "Um parágrafo argumentativo bem construído deve: (ter apenas exemplos sem análise/ser o mais longo possível/apresentar tópico frasal, desenvolvimento e conclusão parcial/iniciar sempre com conjunção)"
        correctAnswer: apresentar tópico frasal, desenvolvimento e conclusão parcial
        difficulty: 4
        rationale: Tópico frasal anuncia a ideia; o desenvolvimento a comprova; a conclusão parcial a reforça.
        objectives: [EF09LP18]
  - pageNumber: 8
    title: Conclusão Dissertativa
    description: Retoma a tese e aponta encaminhamento ou solução.
    exercises:
      - type: paragraph
        question: "A conclusão ideal de um texto dissertativo-argumentativo deve: (repetir literalmente a introdução/apresentar um argumento completamente novo/retomar a tese e propor encaminhamento ou síntese/listar todos os argumentos usados)"
        correctAnswer: retomar a tese e propor encaminhamento ou síntese
        difficulty: 4
        rationale: A conclusão fecha o raciocínio retomando a tese com nova perspectiva ou proposta.
        objectives: [EF09LP18]
  - pageNumber: 9
    title: Impessoalidade e Registro Formal
    description: Texto dissertativo exige registro impessoal.
    exercises:
      - type: paragraph
        question: "Em texto dissertativo formal, qual construção é mais adequada? (Eu acho que a violência é um problema/Na minha opinião, a violência é ruim/Observa-se que a violência constitui grave problema social/A violência é muito ruim pra todo mundo)"
        correctAnswer: Observa-se que a violência constitui grave problema social
        difficulty: 4
        rationale: Voz impessoal e vocabulário preciso são exigências do registro formal dissertativo.
        objectives: [EF09LP18]
  - pageNumber: 10
    title: Revisão Integrada
    description: Avalie a qualidade argumentativa do trecho.
    exercises:
      - type: paragraph
        question: "Um texto que apresenta tese, dois argumentos com dados estatísticos e proposta de solução na conclusão tem qual nível de argumentação? (fraco, pois faltam exemplos literários/médio, pois só aborda um lado/forte, pois combina tese clara, dados e encaminhamento/fraco, pois não usa citações filosóficas)"
        correctAnswer: forte, pois combina tese clara, dados e encaminhamento
        difficulty: 5
        rationale: Tese, evidências quantitativas e proposta de intervenção constituem argumentação sólida e completa.
        objectives: [EF09LP18]
target: 10
