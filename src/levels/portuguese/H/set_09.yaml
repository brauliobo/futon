title: 🔁 Vozes do Verbo
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP09, EF09LP10]
authorNotes: Voz ativa (sujeito age), passiva (sujeito sofre ação) e reflexiva (sujeito age e sofre). Passiva analítica e sintética.
example: "Ativa: 'O gato comeu o rato'. Passiva: 'O rato foi comido pelo gato'. Ex.: 'Vendem-se casas' → passiva sintética."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Voz Ativa
    description: O sujeito pratica a ação.
    exercises:
      - type: paragraph
        question: "'A professora corrigiu as provas' está na voz: (reflexiva/passiva analítica/passiva sintética/ativa)"
        correctAnswer: ativa
        difficulty: 2
        rationale: O sujeito 'a professora' pratica a ação de corrigir.
        objectives: [EF09LP09]
  - pageNumber: 2
    title: Voz Passiva Analítica
    description: Formada por ser/estar/ficar + particípio.
    exercises:
      - type: paragraph
        question: "'As provas foram corrigidas pela professora' está na voz: (ativa/reflexiva/passiva analítica/passiva sintética)"
        correctAnswer: passiva analítica
        difficulty: 2
        rationale: "'foram' (verbo ser) + 'corrigidas' (particípio) — estrutura analítica."
        objectives: [EF09LP09]
  - pageNumber: 3
    title: Voz Passiva Sintética
    description: Formada por verbo transitivo + pronome 'se'.
    exercises:
      - type: paragraph
        question: "'Vendem-se apartamentos' está na voz: (ativa/reflexiva/passiva analítica/passiva sintética)"
        correctAnswer: passiva sintética
        difficulty: 3
        rationale: "'se' é partícula apassivadora; 'apartamentos' é sujeito paciente."
        objectives: [EF09LP09]
  - pageNumber: 4
    title: Agente da Passiva
    description: Introduzido por 'por', 'pelo', 'pelos', 'pela'.
    exercises:
      - type: paragraph
        question: "Em 'O livro foi escrito pelo autor', 'pelo autor' é: (objeto direto/sujeito/agente da passiva/predicativo)"
        correctAnswer: agente da passiva
        difficulty: 3
        rationale: Indica quem praticou a ação na construção passiva — introduzido por 'por'.
        objectives: [EF09LP09]
  - pageNumber: 5
    title: Conversão Ativa → Passiva
    description: Sujeito ativo vira agente; objeto direto vira sujeito.
    exercises:
      - type: paragraph
        question: "Transforme: 'O médico examinou o paciente'. Passiva correta: (O paciente examinou o médico/O médico foi examinado pelo paciente/O paciente foi examinado pelo médico/O paciente se examinou)"
        correctAnswer: O paciente foi examinado pelo médico
        difficulty: 3
        rationale: OD 'o paciente' vira sujeito paciente; sujeito 'o médico' vira agente.
        objectives: [EF09LP09]
  - pageNumber: 6
    title: Voz Reflexiva
    description: Sujeito pratica e recebe a ação; usa pronome reflexivo.
    exercises:
      - type: paragraph
        question: "'Ela se machucou' está na voz: (ativa/passiva sintética/reflexiva/passiva analítica)"
        correctAnswer: reflexiva
        difficulty: 3
        rationale: "'se' indica que a ação recai sobre o próprio sujeito."
        objectives: [EF09LP10]
  - pageNumber: 7
    title: Reflexiva vs. Passiva Sintética
    description: Distinção pelo tipo de verbo e sentido.
    exercises:
      - type: paragraph
        question: "'Contratam-se professores' — o 'se' é: (índice de indeterminação/partícula reflexiva/partícula apassivadora/conjunção)"
        correctAnswer: partícula apassivadora
        difficulty: 4
        rationale: Verbo transitivo direto + 'se' = voz passiva sintética; 'professores' é sujeito.
        objectives: [EF09LP10]
  - pageNumber: 8
    title: Índice de Indeterminação do Sujeito
    description: "'Se' com verbo intransitivo ou transitivo indireto."
    exercises:
      - type: paragraph
        question: "'Precisa-se de ajudantes' — o 'se' é: (partícula apassivadora/reflexivo/índice de indeterminação do sujeito/conjunção)"
        correctAnswer: índice de indeterminação do sujeito
        difficulty: 4
        rationale: Verbo transitivo indireto ('precisar de') não aceita passiva; 'se' indetermina o sujeito.
        objectives: [EF09LP10]
  - pageNumber: 9
    title: Concordância na Passiva Sintética
    description: O verbo concorda com o sujeito paciente.
    exercises:
      - type: paragraph
        question: "Correto: (Aluga-se casas/Alugam-se casas/Aluga-se as casas/Alugas casas)"
        correctAnswer: Alugam-se casas
        difficulty: 5
        rationale: "'casas' é sujeito paciente no plural; verbo deve concordar no plural."
        objectives: [EF09LP10]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique voz e função do 'se'.
    exercises:
      - type: paragraph
        question: "'Faz-se bolo aqui' — a voz verbal é: (ativa/reflexiva/passiva analítica/passiva sintética)"
        correctAnswer: passiva sintética
        difficulty: 5
        rationale: Verbo transitivo direto + 'se' apassivador; 'bolo' é sujeito paciente.
        objectives: [EF09LP10]
target: 10
