title: Concordância Verbal
level: H
subject: portuguese
difficulty: 4
objectives: [EF09LP07, EF09LP08]
authorNotes: Verbo concorda com sujeito. Casos especiais — sujeito composto, coletivo, partitivo, expressão 'mais de um', 'haver' e 'fazer' impessoais.
example: "Chegou a professora / Chegaram os alunos. Ex.: 'Os livros ___ na estante' (estar). → estão."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Sujeito Simples
    description: Verbo no mesmo número e pessoa do sujeito.
    exercises:
      - type: paragraph
        question: "'Os livros ___ na estante' (estar). (está/estão/esteja/estavam todos)"
        correctAnswer: estão
        difficulty: 1
        rationale: Sujeito plural → verbo no plural.
        objectives: [EF09LP07]
  - pageNumber: 2
    title: Sujeito Composto
    description: Verbo no plural se os núcleos estão antes.
    exercises:
      - type: paragraph
        question: "'Ana e Pedro ___ ao cinema' (ir). (iram/foram/foi/iria)"
        correctAnswer: foram
        difficulty: 2
        rationale: Sujeito composto → 3ª pessoa plural.
        objectives: [EF09LP08]
  - pageNumber: 3
    title: Coletivo
    description: Singular, a menos que especifique o grupo.
    exercises:
      - type: paragraph
        question: "'A multidão ___ em silêncio' (caminhar). (caminhavam/caminharam/caminhava/caminharem)"
        correctAnswer: caminhava
        difficulty: 2
        rationale: Coletivo singular → verbo singular.
        objectives: [EF09LP08]
  - pageNumber: 4
    title: Partitivo
    description: "'A maioria de', 'grande parte de' + plural → verbo singular ou plural."
    exercises:
      - type: paragraph
        question: "'A maioria dos alunos ___ (passar) na prova': (passou/passaram/passaremos/passávamos)"
        correctAnswer: passou
        difficulty: 4
        rationale: "Partitivo 'a maioria de' + plural admite singular (concordância com núcleo 'maioria', mais usual) ou plural (atrativa). Ambas aceitáveis."
        objectives: [EF09LP08]
  - pageNumber: 5
    title: 'Mais de um'
    description: Verbo no singular geralmente.
    exercises:
      - type: paragraph
        question: "'Mais de um aluno ___ (faltar)': (faltou/faltaram/falta/faltarão)"
        correctAnswer: faltou
        difficulty: 3
        rationale: "'Mais de um' + singular → verbo no singular."
        objectives: [EF09LP08]
  - pageNumber: 6
    title: Haver Impessoal
    description: Existir — sempre na 3ª pessoa do singular.
    exercises:
      - type: paragraph
        question: "'___ muitos livros na mesa' (haver): (Haviam/Houveram/Há/Hão)"
        correctAnswer: Há
        difficulty: 3
        rationale: "'Haver' no sentido de existir é impessoal; sempre no singular."
        objectives: [EF09LP08]
  - pageNumber: 7
    title: Fazer Tempo Decorrido
    description: Impessoal, sempre no singular.
    exercises:
      - type: paragraph
        question: "'___ dois anos que não o vejo' (fazer): (Fazia/Fazem/Faz/Fizeram)"
        correctAnswer: Faz
        difficulty: 3
        rationale: Fazer indicando tempo decorrido é impessoal.
        objectives: [EF09LP08]
  - pageNumber: 8
    title: Sujeito Posposto
    description: Verbo pode concordar com o núcleo mais próximo se pré-verbal.
    exercises:
      - type: paragraph
        question: "'Chegaram os convidados' — verbo concorda com: (os convidados/chegou/os/convidados)"
        correctAnswer: os convidados
        difficulty: 3
        rationale: Mesmo posposto, o sujeito 'os convidados' impõe concordância no plural ao verbo.
        objectives: [EF09LP08]
  - pageNumber: 9
    title: Percentuais
    description: Verbo concorda com número ou substantivo especificador.
    exercises:
      - type: paragraph
        question: "'30% dos alunos ___ aprovados' (ser): (será/foram/seriam apenas/foi)"
        correctAnswer: foram
        difficulty: 4
        rationale: Com especificador plural ('dos alunos'), verbo no plural é preferido.
        objectives: [EF09LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Corrija a concordância.
    exercises:
      - type: paragraph
        question: "'Nenhum dos alunos ___ presente' (estar): (estão/estava/estarão/estavam)"
        correctAnswer: estava
        difficulty: 4
        rationale: "'Nenhum' é singular; verbo no singular."
        objectives: [EF09LP08]
target: 10
