title: 🏆 Produção Textual — Redação ENEM
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP17, EF09LP18]
authorNotes: "Competências do ENEM para redação: domínio da norma, compreensão da proposta, argumentação, coesão e proposta de intervenção social respeitando os direitos humanos."
example: "Proposta de intervenção deve ter 5 elementos: agente, ação, modo/meio, efeito, detalhamento. Ex.: 'O governo (agente) deve criar (ação) campanhas educativas (meio) para reduzir o preconceito (efeito), com recursos do fundo social (detalhamento)' → proposta completa."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Competências do ENEM
    description: Cinco competências avaliadas na redação.
    exercises:
      - type: paragraph
        question: "O ENEM avalia a redação em quantas competências? (três/quatro/cinco/seis)"
        correctAnswer: cinco
        difficulty: 2
        rationale: "São 5 competências: norma culta, compreensão da proposta, seleção de argumentos, coesão, proposta de intervenção."
        objectives: [EF09LP17]
  - pageNumber: 2
    title: Norma Culta — Competência I
    description: Domínio da modalidade escrita formal da língua portuguesa.
    exercises:
      - type: paragraph
        question: "A Competência I da redação ENEM avalia principalmente: (a criatividade do tema escolhido/o domínio da norma culta e da escrita formal/a quantidade de argumentos usados/a extensão do texto produzido)"
        correctAnswer: o domínio da norma culta e da escrita formal
        difficulty: 2
        rationale: A primeira competência verifica ortografia, concordância, pontuação e vocabulário formal.
        objectives: [EF09LP17]
  - pageNumber: 3
    title: Tema e Proposta — Competência II
    description: Compreender e respeitar o tema é obrigatório.
    exercises:
      - type: paragraph
        question: "Uma redação que foge completamente ao tema proposto recebe: (nota máxima pela criatividade/nota mínima por fuga ao tema/nota média por ter boa argumentação/nota zero obrigatoriamente)"
        correctAnswer: nota zero obrigatoriamente
        difficulty: 3
        rationale: A fuga ao tema implica nota zero na Competência II, zerando a redação inteira.
        objectives: [EF09LP17]
  - pageNumber: 4
    title: Argumentação — Competência III
    description: Seleção, organização e interpretação de argumentos.
    exercises:
      - type: paragraph
        question: "Para obter nota máxima na Competência III, o candidato deve: (usar apenas dados históricos como argumentos/selecionar argumentos consistentes e organizá-los com repertório diversificado/repetir as informações dos textos motivadores/escrever o maior número possível de argumentos)"
        correctAnswer: selecionar argumentos consistentes e organizá-los com repertório diversificado
        difficulty: 3
        rationale: A Competência III exige argumentos sólidos, diversificados e bem articulados com a tese.
        objectives: [EF09LP18]
  - pageNumber: 5
    title: Coesão e Coerência — Competência IV
    description: Estruturação lógica e uso de mecanismos coesivos.
    exercises:
      - type: paragraph
        question: "A coesão textual é garantida principalmente pelo uso de: (figuras de linguagem/conectivos e recursos de retomada como pronomes e sinônimos/vocabulário variado e culto/parágrafos com igual número de linhas)"
        correctAnswer: conectivos e recursos de retomada como pronomes e sinônimos
        difficulty: 4
        rationale: Coesão é a ligação entre as partes do texto — garantida por conectivos e mecanismos referenciais.
        objectives: [EF09LP18]
  - pageNumber: 6
    title: Proposta de Intervenção — Competência V
    description: Solução detalhada e respeitosa dos direitos humanos.
    exercises:
      - type: paragraph
        question: "Uma proposta de intervenção completa no ENEM deve conter: (apenas o agente e a ação/o problema e a solução genérica/agente, ação, modo, efeito e detalhamento/tema, tese e conclusão)"
        correctAnswer: agente, ação, modo, efeito e detalhamento
        difficulty: 4
        rationale: A proposta completa exige os 5 elementos para pontuar ao máximo na Competência V.
        objectives: [EF09LP18]
  - pageNumber: 7
    title: Repertório Sociocultural
    description: Uso de dados, citações e referências culturais para fundamentar.
    exercises:
      - type: paragraph
        question: "No contexto do ENEM, 'repertório sociocultural' significa: (copiar trechos de textos famosos/introduzir dados, conceitos e referências culturais pertinentes que fundamentam a argumentação/mencionar filmes e músicas populares/usar gírias e expressões coloquiais)"
        correctAnswer: introduzir dados, conceitos e referências culturais pertinentes que fundamentam a argumentação
        difficulty: 4
        rationale: Repertório rico e pertinente demonstra leitura de mundo e potencializa a argumentação.
        objectives: [EF09LP18]
  - pageNumber: 8
    title: Violação dos Direitos Humanos
    description: Redações que ferem direitos humanos são zeradas.
    exercises:
      - type: paragraph
        question: "Uma redação que propõe punição cruel ou discriminação de grupos sociais como solução para um problema: (perde apenas pontos na Competência V/recebe nota máxima pela ousadia/tem nota zerada por violar os direitos humanos/é avaliada normalmente, pois é uma opinião)"
        correctAnswer: tem nota zerada por violar os direitos humanos
        difficulty: 3
        rationale: O ENEM zera redações que ferem os direitos humanos — critério inegociável.
        objectives: [EF09LP17]
  - pageNumber: 9
    title: Introdução Eficaz
    description: Contextualiza, levanta a problemática e apresenta a tese.
    exercises:
      - type: paragraph
        question: "Uma introdução de redação ENEM bem estruturada deve: (apresentar a solução imediatamente/ser longa com muitos dados/contextualizar o tema, apresentar a problemática e a tese/copiar frases dos textos motivadores)"
        correctAnswer: contextualizar o tema, apresentar a problemática e a tese
        difficulty: 4
        rationale: A introdução eficaz situa o leitor no tema, indica o problema e antecipa a posição defendida.
        objectives: [EF09LP17]
  - pageNumber: 10
    title: Revisão Integrada
    description: Avalie a redação pelo critério das competências.
    exercises:
      - type: paragraph
        question: "Uma redação com 1000 palavras, sem erros gramaticais, mas com argumentos desconexos e sem proposta de intervenção, obterá: (nota máxima por ter bom domínio linguístico/notas baixas nas Competências III, IV e V/nota máxima nas cinco competências/nota zero por exceder o limite de linhas)"
        correctAnswer: notas baixas nas Competências III, IV e V
        difficulty: 5
        rationale: Bom domínio linguístico pontua C1; argumentação fraca, incoerência e falta de proposta penalizam C3, C4 e C5.
        objectives: [EF09LP18]
target: 10
