title: 🎨 Interpretação de Texto Literário
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP21, EF09LP22]
authorNotes: "Análise de textos literários: narrador, ponto de vista, tempo, espaço, personagem, tema e recursos expressivos. Leitura crítica e apreciação estética."
example: "Narrador onisciente sabe tudo dos personagens. Ex.: 'Ela pensava em fugir, mas temia o julgamento alheio' → narrador onisciente (acessa pensamentos)."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Narrador — Tipos
    description: Onisciente, observador e personagem.
    exercises:
      - type: paragraph
        question: "Em 'Brás Cubas narrava sua própria história post-mortem' (Machado de Assis), o narrador é: (onisciente neutro/observador externo/protagonista/personagem secundário)"
        correctAnswer: protagonista
        difficulty: 2
        rationale: Brás Cubas é o próprio personagem principal narrando — narrador-protagonista.
        objectives: [EF09LP21]
  - pageNumber: 2
    title: Narrador Onisciente
    description: Sabe pensamentos, sentimentos e segredos dos personagens.
    exercises:
      - type: paragraph
        question: "'Ela sorria, mas por dentro sentia a dor crescer' indica narrador: (personagem/observador/onisciente/testemunha)"
        correctAnswer: onisciente
        difficulty: 2
        rationale: Acesso ao estado interior ('por dentro') é traço do narrador onisciente.
        objectives: [EF09LP21]
  - pageNumber: 3
    title: Tempo e Espaço Narrativos
    description: Quando e onde a história acontece.
    exercises:
      - type: paragraph
        question: "Em um romance, 'tempo psicológico' refere-se a: (data e hora registradas no relógio/a duração cronológica dos capítulos/o tempo subjetivo percebido pelo personagem/o período histórico em que a obra foi escrita)"
        correctAnswer: o tempo subjetivo percebido pelo personagem
        difficulty: 3
        rationale: Tempo psicológico é interno — minutos podem parecer horas conforme o estado emocional.
        objectives: [EF09LP21]
  - pageNumber: 4
    title: Personagem — Classificação
    description: Principal (protagonista), secundário, antagonista.
    exercises:
      - type: paragraph
        question: "O personagem que se opõe ao protagonista é chamado de: (deuteragonista/coadjuvante/figurante/antagonista)"
        correctAnswer: antagonista
        difficulty: 2
        rationale: O antagonista é o oposto do protagonista — cria conflito central na narrativa.
        objectives: [EF09LP21]
  - pageNumber: 5
    title: Tema e Enredo
    description: Tema = ideia central; enredo = sequência de eventos.
    exercises:
      - type: paragraph
        question: "O tema de uma obra literária é: (o resumo da história/a lista de personagens/a ideia central ou conflito humano que ela explora/o lugar onde a história ocorre)"
        correctAnswer: a ideia central ou conflito humano que ela explora
        difficulty: 3
        rationale: Tema é abstrato — amor, morte, poder, identidade — diferente do enredo que é concreto.
        objectives: [EF09LP21]
  - pageNumber: 6
    title: Recursos Expressivos — Ritmo e Sonoridade
    description: Aliteração, assonância e efeitos sonoros.
    exercises:
      - type: paragraph
        question: "'O sapo-tanoeiro, parnasiano aguado' (Manuel Bandeira) usa repetição de sons para criar: (rima toante/aliteração com efeito irônico/assonância temática/onomatopeia realista)"
        correctAnswer: aliteração com efeito irônico
        difficulty: 4
        rationale: Repetição do som /a/ e /o/ cria musicalidade irônica ao criticar o parnasiano 'aguado'.
        objectives: [EF09LP22]
  - pageNumber: 7
    title: Intertextualidade
    description: Relação de um texto com outros textos.
    exercises:
      - type: paragraph
        question: "Uma paródia que reescreve um poema clássico de forma humorística é exemplo de: (citação direta/intertextualidade por paródia/plagio literário/resumo crítico)"
        correctAnswer: intertextualidade por paródia
        difficulty: 4
        rationale: Paródia apropria-se da estrutura do original para subverter seu sentido — intertextualidade crítica.
        objectives: [EF09LP22]
  - pageNumber: 8
    title: Ponto de Vista e Ideologia
    description: Todo texto literário implica uma visão de mundo.
    exercises:
      - type: paragraph
        question: "Ao analisar um romance, perceber que o narrador favorece um grupo social em detrimento de outro é identificar: (o enredo principal/o clímax narrativo/a visão de mundo e posicionamento ideológico do narrador/a tipologia textual)"
        correctAnswer: a visão de mundo e posicionamento ideológico do narrador
        difficulty: 4
        rationale: Textos literários não são neutros — refletem perspectivas sociais e ideológicas.
        objectives: [EF09LP22]
  - pageNumber: 9
    title: Clímax e Desfecho
    description: Ponto de tensão máxima e sua resolução.
    exercises:
      - type: paragraph
        question: "O momento de maior tensão em uma narrativa é chamado de: (prólogo/flashback/clímax/epílogo)"
        correctAnswer: clímax
        difficulty: 3
        rationale: O clímax é o ponto culminante do conflito — a partir dele, a tensão se resolve.
        objectives: [EF09LP21]
  - pageNumber: 10
    title: Revisão Integrada
    description: Analise o fragmento literário.
    exercises:
      - type: paragraph
        question: "'A cidade crescia devorando seus filhos, silenciosa e inexorável' usa principalmente: (metonímia e eufemismo/personificação e metáfora/ironia e antítese/hipérbole e comparação)"
        correctAnswer: personificação e metáfora
        difficulty: 5
        rationale: "'Devorando' personifica a cidade; 'devorar os filhos' é metáfora da destruição dos habitantes."
        objectives: [EF09LP22]
target: 10
