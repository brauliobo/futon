title: Regência Verbal
level: H
subject: portuguese
difficulty: 4
objectives: [EF09LP07, EF09LP08]
authorNotes: Verbos que exigem determinada preposição no complemento — assistir, visar, obedecer, aspirar, implicar, preferir, lembrar-se.
example: "Assisti ao filme (TI) / Assisti o paciente (TD). Ex.: 'Prefiro café ___ chá': → a."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Assistir
    description: "'Ver' → transitivo indireto com 'a'; 'dar assistência' → transitivo direto."
    exercises:
      - type: paragraph
        question: "'Assisti ___ filme' (sentido de ver): (pelo/ao/o/com o)"
        correctAnswer: ao
        difficulty: 3
        rationale: "'Assistir' no sentido de 'ver' exige preposição 'a'."
        objectives: [EF09LP07]
  - pageNumber: 2
    title: Obedecer
    description: Transitivo indireto — obedece-se 'a' alguém ou algo.
    exercises:
      - type: paragraph
        question: "'Obedeço ___ regras': (às/de/nas/as)"
        correctAnswer: às
        difficulty: 3
        rationale: "'Obedecer' pede preposição 'a'; 'às regras' com crase."
        objectives: [EF09LP07]
  - pageNumber: 3
    title: Aspirar
    description: Respirar (TD); desejar (TI com 'a').
    exercises:
      - type: paragraph
        question: "'Aspirar ___ cargo' (almejar): (pelo/do/ao/o)"
        correctAnswer: ao
        difficulty: 4
        rationale: "'Aspirar' no sentido de desejar é TI com 'a'."
        objectives: [EF09LP08]
  - pageNumber: 4
    title: Visar
    description: "'Ter como alvo' (TI com 'a'); 'mirar, autenticar' (TD)."
    exercises:
      - type: paragraph
        question: "'Ele visa ___ sucesso': (o/ao/pelo/com o)"
        correctAnswer: ao
        difficulty: 3
        rationale: "'Visar' no sentido de almejar pede 'a'."
        objectives: [EF09LP08]
  - pageNumber: 5
    title: Implicar
    description: "'Acarretar' → transitivo direto."
    exercises:
      - type: paragraph
        question: "'Essa atitude implica ___ consequências': (em consequências/consequências/nas consequências/de consequências)"
        correctAnswer: consequências
        difficulty: 4
        rationale: "'Implicar' no sentido de acarretar é TD (sem preposição)."
        objectives: [EF09LP08]
  - pageNumber: 6
    title: Preferir
    description: Preferir X a Y — nunca 'do que' na norma culta.
    exercises:
      - type: paragraph
        question: "'Prefiro café ___ chá': (a/ao/que/do que)"
        correctAnswer: a
        difficulty: 4
        rationale: "'Preferir' exige 'a' comparando duas opções."
        objectives: [EF09LP08]
  - pageNumber: 7
    title: Lembrar-se / Esquecer-se
    description: Pronominais exigem preposição 'de'.
    exercises:
      - type: paragraph
        question: "'Ele se lembrou ___ aniversário': (do/o/no/com o)"
        correctAnswer: do
        difficulty: 3
        rationale: "'Lembrar-se' é transitivo indireto com 'de'."
        objectives: [EF09LP08]
  - pageNumber: 8
    title: Simpatizar
    description: Transitivo indireto — simpatizar com.
    exercises:
      - type: paragraph
        question: "'Simpatizo ___ a proposta': (pela/de/em/com)"
        correctAnswer: com
        difficulty: 4
        rationale: "'Simpatizar' pede preposição 'com'."
        objectives: [EF09LP08]
  - pageNumber: 9
    title: Chegar / Ir
    description: Transitivos indiretos — 'a' + lugar.
    exercises:
      - type: paragraph
        question: "Frase correta na norma culta: (Cheguei em casa/Cheguei a casa/Cheguei na casa/Chegou-se à casa)"
        correctAnswer: Cheguei a casa
        difficulty: 3
        rationale: Chegar e ir exigem preposição 'a' na norma padrão.
        objectives: [EF09LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Escolha a regência correta.
    exercises:
      - type: paragraph
        question: "'Namoro ___ Ana' (regência padrão): (à Ana/de Ana/com Ana/Ana)"
        correctAnswer: Ana
        difficulty: 4
        rationale: "'Namorar' é transitivo direto na norma culta."
        objectives: [EF09LP08]
target: 10
