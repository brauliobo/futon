title: Orações Subordinadas Adverbiais
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP07, EF09LP08]
authorNotes: Causais, consecutivas, concessivas, condicionais, comparativas, conformativas, finais, proporcionais, temporais.
example: "Se chover, não sairemos — subordinada adverbial condicional."
pages:
  - pageNumber: 1
    title: Causal
    description: "'Porque', 'visto que', 'já que'."
    exercises:
      - type: paragraph
        question: "'Ele faltou porque estava doente' — a subordinada é adverbial: (causal/condicional/concessiva/final)"
        correctAnswer: causal
        difficulty: 2
        rationale: "'Porque' expressa causa."
        objectives: [EF09LP07]
  - pageNumber: 2
    title: Condicional
    description: "'Se', 'caso', 'contanto que'."
    exercises:
      - type: paragraph
        question: "'Se chover, não sairemos' — a subordinada é adverbial: (condicional/causal/temporal/concessiva)"
        correctAnswer: condicional
        difficulty: 3
        rationale: "'Se' apresenta condição."
        objectives: [EF09LP08]
  - pageNumber: 3
    title: Concessiva
    description: "'Embora', 'ainda que', 'mesmo que'."
    exercises:
      - type: paragraph
        question: "'Embora chova, sairemos' — a subordinada é adverbial: (concessiva/condicional/causal/final)"
        correctAnswer: concessiva
        difficulty: 3
        rationale: "'Embora' admite oposição."
        objectives: [EF09LP08]
  - pageNumber: 4
    title: Final
    description: "'Para que', 'a fim de que'."
    exercises:
      - type: paragraph
        question: "'Estudei para que pudesse passar' — a subordinada é: (final/causal/consecutiva/condicional)"
        correctAnswer: final
        difficulty: 3
        rationale: "'Para que' expressa finalidade."
        objectives: [EF09LP08]
  - pageNumber: 5
    title: Temporal
    description: "'Quando', 'enquanto', 'assim que', 'logo que'."
    exercises:
      - type: paragraph
        question: "'Quando chegar, me avise' — a subordinada é: (temporal/causal/condicional/final)"
        correctAnswer: temporal
        difficulty: 2
        rationale: "'Quando' situa no tempo."
        objectives: [EF09LP08]
  - pageNumber: 6
    title: Consecutiva
    description: "'Tanto... que', 'tão... que' — expressa efeito."
    exercises:
      - type: paragraph
        question: "'Estudou tanto que passou' — a subordinada é: (consecutiva/causal/final/comparativa)"
        correctAnswer: consecutiva
        difficulty: 4
        rationale: "'Tanto que' introduz consequência."
        objectives: [EF09LP08]
  - pageNumber: 7
    title: Comparativa
    description: "'Como', 'tal qual', 'mais... que'."
    exercises:
      - type: paragraph
        question: "'Ele é mais alto que eu' — a subordinada é: (comparativa/causal/conformativa/final)"
        correctAnswer: comparativa
        difficulty: 4
        rationale: "'Que eu' introduz comparação."
        objectives: [EF09LP08]
  - pageNumber: 8
    title: Conformativa
    description: "'Conforme', 'segundo', 'como'."
    exercises:
      - type: paragraph
        question: "'Fiz conforme você pediu' — a subordinada é: (conformativa/causal/concessiva/temporal)"
        correctAnswer: conformativa
        difficulty: 4
        rationale: "'Conforme' indica conformidade."
        objectives: [EF09LP08]
  - pageNumber: 9
    title: Proporcional
    description: "'À medida que', 'à proporção que'."
    exercises:
      - type: paragraph
        question: "'À medida que estudava, aprendia mais' — a subordinada é: (proporcional/temporal/causal/conformativa)"
        correctAnswer: proporcional
        difficulty: 4
        rationale: "'À medida que' expressa aumento gradual."
        objectives: [EF09LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique a adverbial.
    exercises:
      - type: paragraph
        question: "'Caso chova, leve o guarda-chuva' — a subordinada é adverbial: (condicional/causal/concessiva/temporal)"
        correctAnswer: condicional
        difficulty: 3
        rationale: "'Caso' equivale a 'se' — condição."
        objectives: [EF09LP08]
target: 10
