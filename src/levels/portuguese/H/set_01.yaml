title: Orações Coordenadas
level: H
subject: portuguese
difficulty: 3
objectives: [EF09LP07, EF09LP08]
authorNotes: Coordenação — orações sintaticamente independentes. Assindéticas e sindéticas (aditivas, adversativas, alternativas, conclusivas, explicativas).
example: "Estudei e passei — aditiva. Ex.: 'Venha logo, porque está tarde' é coordenada: → explicativa."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Coordenação Assindética
    description: Sem conjunção, só pontuação.
    exercises:
      - type: paragraph
        question: "'Vim, vi, venci' é um exemplo de coordenação: (assindética/aditiva/conclusiva/alternativa)"
        correctAnswer: assindética
        difficulty: 2
        rationale: Orações separadas só por vírgulas.
        objectives: [EF09LP07]
  - pageNumber: 2
    title: Aditiva
    description: "'E', 'nem', 'mas também'."
    exercises:
      - type: paragraph
        question: "'Estudou e passou' é coordenada: (adversativa/alternativa/conclusiva/aditiva)"
        correctAnswer: aditiva
        difficulty: 1
        rationale: "'E' soma ideias."
        objectives: [EF09LP07]
  - pageNumber: 3
    title: Adversativa
    description: "'Mas', 'porém', 'contudo', 'todavia', 'entretanto'."
    exercises:
      - type: paragraph
        question: "'Estudou, mas não passou' é coordenada: (explicativa/adversativa/conclusiva/aditiva)"
        correctAnswer: adversativa
        difficulty: 2
        rationale: "'Mas' introduz oposição."
        objectives: [EF09LP07]
  - pageNumber: 4
    title: Alternativa
    description: "'Ou', 'ou...ou', 'ora...ora', 'quer...quer'."
    exercises:
      - type: paragraph
        question: "'Ou estuda, ou trabalha' é coordenada: (conclusiva/alternativa/aditiva/adversativa)"
        correctAnswer: alternativa
        difficulty: 2
        rationale: "'Ou' apresenta alternância."
        objectives: [EF09LP07]
  - pageNumber: 5
    title: Conclusiva
    description: "'Portanto', 'logo', 'assim', 'por isso'."
    exercises:
      - type: paragraph
        question: "'Estudou muito; portanto, passou' é coordenada: (explicativa/conclusiva/aditiva/adversativa)"
        correctAnswer: conclusiva
        difficulty: 3
        rationale: "'Portanto' marca conclusão lógica."
        objectives: [EF09LP08]
  - pageNumber: 6
    title: Explicativa
    description: "'Porque', 'pois', 'que' (quando não causal)."
    exercises:
      - type: paragraph
        question: "'Venha logo, porque está tarde' é coordenada: (explicativa/conclusiva/adversativa/causal)"
        correctAnswer: explicativa
        difficulty: 3
        rationale: Justifica a oração anterior sem subordinar sentido.
        objectives: [EF09LP08]
  - pageNumber: 7
    title: Coordenada vs Subordinada
    description: Coordenadas são autônomas; subordinadas dependem.
    exercises:
      - type: paragraph
        question: "'Espero que você venha' é: (coordenada/assindética/conclusiva/subordinada)"
        correctAnswer: subordinada
        difficulty: 3
        rationale: "'Que você venha' completa 'espero'; é subordinada substantiva."
        objectives: [EF09LP08]
  - pageNumber: 8
    title: Pontuação entre Coordenadas
    description: Vírgula antes de 'mas', 'porém'; opcional com 'e'.
    exercises:
      - type: paragraph
        question: "Pontuação correta: (Estudei; mas não passei/Estudei mas não passei/Estudei, mas não passei/Estudei: mas não passei)"
        correctAnswer: Estudei, mas não passei
        difficulty: 2
        rationale: Vírgula antes de adversativa.
        objectives: [EF09LP08]
  - pageNumber: 9
    title: Conectivos Adequados
    description: Escolha o conectivo pelo sentido.
    exercises:
      - type: paragraph
        question: "'Não estudei, ___ passei' (expressa surpresa): (mas/pois/e/logo)"
        correctAnswer: mas
        difficulty: 2
        rationale: Oposição inesperada pede adversativa.
        objectives: [EF09LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique a coordenação.
    exercises:
      - type: paragraph
        question: "'Ele chegou atrasado; por isso, perdeu a prova' — a segunda oração é: (aditiva/conclusiva/explicativa/adversativa)"
        correctAnswer: conclusiva
        difficulty: 3
        rationale: "'Por isso' expressa consequência."
        objectives: [EF09LP08]
target: 10
