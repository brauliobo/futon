title: 📖 Semântica
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP13, EF09LP14]
authorNotes: "Relações de sentido entre palavras: sinonímia (mesmo sentido), antonímia (sentidos opostos), polissemia (múltiplos sentidos), denotação/conotação (sentido literal vs. figurado)."
example: "Polissemia = uma palavra com vários sentidos. Ex.: 'banco' → banco de sentar, banco financeiro → polissemia."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Sinonímia
    description: Palavras com sentidos iguais ou próximos.
    exercises:
      - type: paragraph
        question: "Qual é sinônimo de 'ágil'? (lento/vagaroso/veloz/pesado)"
        correctAnswer: veloz
        difficulty: 2
        rationale: "'Veloz' tem sentido equivalente a 'ágil'; os demais são antônimos ou não equivalentes."
        objectives: [EF09LP13]
  - pageNumber: 2
    title: Antonímia
    description: Palavras com sentidos opostos.
    exercises:
      - type: paragraph
        question: "Antônimo de 'generoso': (bondoso/caridoso/solidário/avarento)"
        correctAnswer: avarento
        difficulty: 2
        rationale: "'Avarento' se opõe diretamente a 'generoso'."
        objectives: [EF09LP13]
  - pageNumber: 3
    title: Polissemia
    description: Uma palavra com múltiplos sentidos relacionados.
    exercises:
      - type: paragraph
        question: "A palavra 'pena' em 'tenho pena de você' e 'a pena do pássaro' apresenta: (sinonímia/homonímia/antonímia/polissemia)"
        correctAnswer: polissemia
        difficulty: 3
        rationale: Mesma palavra com sentidos distintos mas historicamente relacionados — polissemia.
        objectives: [EF09LP13]
  - pageNumber: 4
    title: Homonímia vs. Polissemia
    description: Homônimos têm origens diferentes; polissêmicos têm a mesma origem.
    exercises:
      - type: paragraph
        question: "'Manga' (fruta) e 'manga' (de camisa) são: (polissêmicas/sinônimas/antônimas/homônimas)"
        correctAnswer: homônimas
        difficulty: 3
        rationale: Mesma forma, mas origens etimológicas distintas — homonímia.
        objectives: [EF09LP13]
  - pageNumber: 5
    title: Denotação
    description: Sentido literal, de dicionário.
    exercises:
      - type: paragraph
        question: "Em 'O cachorro latiu toda a noite', 'cachorro' está em sentido: (conotativo/figurado/metafórico/denotativo)"
        correctAnswer: denotativo
        difficulty: 2
        rationale: Refere-se literalmente ao animal — sentido denotativo.
        objectives: [EF09LP14]
  - pageNumber: 6
    title: Conotação
    description: Sentido figurado, dependente do contexto.
    exercises:
      - type: paragraph
        question: "Em 'Aquele político é um verdadeiro cachorro', 'cachorro' está em sentido: (denotativo/literal/original/conotativo)"
        correctAnswer: conotativo
        difficulty: 3
        rationale: "'Cachorro' é usado figuradamente para indicar traição ou maldade — conotação."
        objectives: [EF09LP14]
  - pageNumber: 7
    title: Campo Semântico
    description: Conjunto de palavras relacionadas a um mesmo tema.
    exercises:
      - type: paragraph
        question: "Quais palavras pertencem ao campo semântico de 'escola'? (casa, rua, mercado/professor, aluno, aula/rio, mar, lago/pão, leite, manteiga)"
        correctAnswer: professor, aluno, aula
        difficulty: 3
        rationale: "'Professor', 'aluno' e 'aula' compartilham o campo semântico de 'educação/escola'."
        objectives: [EF09LP13]
  - pageNumber: 8
    title: Sinonímia Contextual
    description: Sinônimos perfeitos são raros; o contexto determina a escolha.
    exercises:
      - type: paragraph
        question: "Em texto formal, qual sinônimo de 'mostrar' é mais adequado? (exibir/ostentar/evidenciar/revelar)"
        correctAnswer: evidenciar
        difficulty: 4
        rationale: "'Evidenciar' tem registro formal e neutro; 'ostentar' tem conotação negativa; 'revelar' e 'exibir' são mais informais neste contexto."
        objectives: [EF09LP14]
  - pageNumber: 9
    title: Ambiguidade Semântica
    description: Quando uma frase admite mais de uma interpretação.
    exercises:
      - type: paragraph
        question: "'Vi o homem com o binóculo' é ambígua porque: (tem duas palavras homônimas/o sujeito e o objeto direto se confundem/pode ser quem usou o binóculo o narrador ou o homem/não tem verbo principal)"
        correctAnswer: pode ser quem usou o binóculo o narrador ou o homem
        difficulty: 4
        rationale: A frase não deixa claro se quem tem o binóculo é o falante ou o homem — ambiguidade sintático-semântica.
        objectives: [EF09LP14]
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplique os conceitos semânticos ao texto.
    exercises:
      - type: paragraph
        question: "Em 'O coração do bairro é a praça central', 'coração' está em sentido: (denotativo/sinonímico/antonímico/conotativo)"
        correctAnswer: conotativo
        difficulty: 5
        rationale: "'Coração' é usado metaforicamente para indicar o centro vital do bairro — conotação."
        objectives: [EF09LP14]
target: 10
