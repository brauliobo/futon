title: 🔄 Sintaxe do Período Composto — Revisão
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP07, EF09LP08]
authorNotes: Revisão integrada de coordenação e subordinação; identificação de tipos mistos em períodos complexos.
example: "Coordenada une independentes; subordinada encaixa uma na outra. Ex.: 'Ele saiu porque estava cansado' → subordinada adverbial causal."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Período Simples vs. Composto
    description: Um verbo = simples; dois ou mais = composto.
    exercises:
      - type: paragraph
        question: "'O aluno estudou muito e passou na prova' é período: (simples/subordinado/composto/exclamativo)"
        correctAnswer: composto
        difficulty: 2
        rationale: Dois verbos ('estudou', 'passou') formam período composto por coordenação.
        objectives: [EF09LP07]
  - pageNumber: 2
    title: Oração Coordenada Aditiva
    description: "'E', 'nem', 'mas também' somam ideias."
    exercises:
      - type: paragraph
        question: "'Leu o livro e fez o resumo' — a segunda oração é coordenada: (adversativa/conclusiva/alternativa/aditiva)"
        correctAnswer: aditiva
        difficulty: 2
        rationale: "'E' une ações sem oposição — relação de adição."
        objectives: [EF09LP07]
  - pageNumber: 3
    title: Oração Subordinada Substantiva
    description: Exerce função de sujeito, objeto ou predicativo.
    exercises:
      - type: paragraph
        question: "'É necessário que todos compareçam' — a oração sublinhada é subordinada: (adverbial/adjetiva/adversativa/substantiva)"
        correctAnswer: substantiva
        difficulty: 3
        rationale: "'Que todos compareçam' é sujeito de 'é necessário' — função nominal."
        objectives: [EF09LP07]
  - pageNumber: 4
    title: Oração Subordinada Adjetiva
    description: Modifica um substantivo, equivale a adjetivo.
    exercises:
      - type: paragraph
        question: "'O professor que explicou bem foi elogiado' — 'que explicou bem' é: (substantiva/adverbial/adjetiva/coordenada)"
        correctAnswer: adjetiva
        difficulty: 3
        rationale: Modifica 'professor' — equivale a um adjetivo.
        objectives: [EF09LP07]
  - pageNumber: 5
    title: Oração Subordinada Adverbial Causal
    description: Indica causa com 'porque', 'como', 'já que'.
    exercises:
      - type: paragraph
        question: "'Como choveu muito, o jogo foi cancelado' — 'Como choveu muito' é: (concessiva/final/consecutiva/causal)"
        correctAnswer: causal
        difficulty: 3
        rationale: "'Como' equivale a 'porque' — indica a causa do cancelamento."
        objectives: [EF09LP08]
  - pageNumber: 6
    title: Oração Subordinada Adverbial Concessiva
    description: Admite fato contrário com 'embora', 'ainda que'.
    exercises:
      - type: paragraph
        question: "'Embora estivesse doente, ela foi trabalhar' — a sublinhada é adverbial: (consecutiva/temporal/concessiva/causal)"
        correctAnswer: concessiva
        difficulty: 4
        rationale: "'Embora' introduz concessão — fato oposto ao esperado."
        objectives: [EF09LP08]
  - pageNumber: 7
    title: Oração Subordinada Adverbial Final
    description: Indica finalidade com 'para que', 'a fim de que'.
    exercises:
      - type: paragraph
        question: "'Estudou para que pudesse passar' — 'para que pudesse passar' é: (consecutiva/concessiva/final/temporal)"
        correctAnswer: final
        difficulty: 4
        rationale: "Exprime o objetivo da ação — relação de finalidade."
        objectives: [EF09LP08]
  - pageNumber: 8
    title: Período Composto Misto
    description: Combina coordenação e subordinação no mesmo período.
    exercises:
      - type: paragraph
        question: "'Sei que você virá, mas ainda estou preocupado' tem orações: (só subordinadas/só coordenadas/mistas: subordinada e coordenada/simples)"
        correctAnswer: "mistas: subordinada e coordenada"
        difficulty: 4
        rationale: "'que você virá' é subordinada; 'mas ainda estou preocupado' é coordenada adversativa."
        objectives: [EF09LP08]
  - pageNumber: 9
    title: Classificação pela Conjunção
    description: A conjunção determina o tipo de relação.
    exercises:
      - type: paragraph
        question: "'Trabalhei tanto que adoeci' — a segunda oração é adverbial: (causal/consecutiva/concessiva/final)"
        correctAnswer: consecutiva
        difficulty: 4
        rationale: "'tanto… que' indica consequência — adverbial consecutiva."
        objectives: [EF09LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique corretamente o período composto.
    exercises:
      - type: paragraph
        question: "'Quando terminar a prova, avise-me' — 'Quando terminar a prova' é: (substantiva/coordenada/adverbial temporal/adjetiva)"
        correctAnswer: adverbial temporal
        difficulty: 5
        rationale: "'Quando' introduz circunstância de tempo — adverbial temporal."
        objectives: [EF09LP08]
target: 10
