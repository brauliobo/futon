title: 🔬 Texto Expositivo e Científico
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP19, EF09LP20]
authorNotes: Texto expositivo informa sem persuadir; texto científico segue normas metodológicas (hipótese, dados, conclusão). Distinção de gêneros discursivos formais.
example: "Expositivo informa; científico prova. Ex.: 'A fotossíntese é o processo pelo qual plantas produzem glicose' → expositivo técnico."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Texto Expositivo — Conceito
    description: Apresenta informações sem defender tese.
    exercises:
      - type: paragraph
        question: "Um verbete de enciclopédia sobre 'fotossíntese' é exemplo de texto: (argumentativo/narrativo/expositivo/injuntivo)"
        correctAnswer: expositivo
        difficulty: 2
        rationale: Verbetes informam e explicam sem tomar partido — gênero expositivo.
        objectives: [EF09LP19]
  - pageNumber: 2
    title: Diferença Expositivo / Argumentativo
    description: Expositivo informa; argumentativo persuade.
    exercises:
      - type: paragraph
        question: "Qual característica distingue o texto expositivo do argumentativo? (o uso de verbos no passado/a ausência de defesa de ponto de vista/o uso de primeira pessoa/a presença de diálogos)"
        correctAnswer: a ausência de defesa de ponto de vista
        difficulty: 2
        rationale: O expositivo apresenta fatos sem intenção persuasiva; o argumentativo defende uma tese.
        objectives: [EF09LP19]
  - pageNumber: 3
    title: Linguagem do Texto Científico
    description: Precisão, objetividade e impessoalidade.
    exercises:
      - type: paragraph
        question: "No texto científico, utiliza-se preferencialmente: (linguagem coloquial e subjetiva/jargão técnico, impessoalidade e objetividade/linguagem literária e metafórica/gírias e expressões regionais)"
        correctAnswer: jargão técnico, impessoalidade e objetividade
        difficulty: 3
        rationale: O texto científico exige precisão terminológica e distância do autor em relação ao objeto.
        objectives: [EF09LP19]
  - pageNumber: 4
    title: Estrutura do Artigo Científico
    description: Introdução, metodologia, resultados e discussão.
    exercises:
      - type: paragraph
        question: "A seção que descreve como a pesquisa foi realizada chama-se: (introdução/resultados/discussão/metodologia)"
        correctAnswer: metodologia
        difficulty: 3
        rationale: A metodologia detalha os procedimentos usados para garantir a reprodutibilidade.
        objectives: [EF09LP20]
  - pageNumber: 5
    title: Hipótese Científica
    description: Suposição testável que orienta a investigação.
    exercises:
      - type: paragraph
        question: "'Se plantas receberem mais luz solar, crescerão mais rápido' é uma: (conclusão/resultado/hipótese/metodologia)"
        correctAnswer: hipótese
        difficulty: 3
        rationale: É uma afirmação condicional testável — hipótese que orienta o experimento.
        objectives: [EF09LP20]
  - pageNumber: 6
    title: Citação e Referência
    description: Usar fontes sem plágio — citação direta e indireta.
    exercises:
      - type: paragraph
        question: "Reproduzir literalmente as palavras de outro autor entre aspas, indicando a fonte, é: (citação indireta/plágio/paráfrase/citação direta)"
        correctAnswer: citação direta
        difficulty: 3
        rationale: Citação direta reproduz textualmente com aspas e referência — diferente de paráfrase (indireta).
        objectives: [EF09LP20]
  - pageNumber: 7
    title: Resumo e Resenha
    description: Resumo condensa; resenha avalia criticamente.
    exercises:
      - type: paragraph
        question: "Um texto que apresenta o conteúdo de um livro e emite julgamento crítico sobre ele é uma: (síntese/paráfrase/resumo/resenha)"
        correctAnswer: resenha
        difficulty: 4
        rationale: A resenha vai além do resumo — inclui avaliação fundamentada da obra.
        objectives: [EF09LP19]
  - pageNumber: 8
    title: Relatório Científico
    description: Registro objetivo de atividades ou experimentos.
    exercises:
      - type: paragraph
        question: "O relatório de um experimento escolar deve priorizar: (opiniões pessoais sobre o tema/narração em primeira pessoa do plural informal/descrição objetiva de procedimentos e resultados/recursos literários para tornar o texto mais atraente)"
        correctAnswer: descrição objetiva de procedimentos e resultados
        difficulty: 4
        rationale: Relatório científico exige objetividade, impessoalidade e clareza na descrição dos dados.
        objectives: [EF09LP20]
  - pageNumber: 9
    title: Coesão em Textos Técnicos
    description: Termos técnicos devem ser usados de forma consistente.
    exercises:
      - type: paragraph
        question: "Em um texto científico, substituir um termo técnico por sinônimos variados para evitar repetição é: (recomendado para maior elegância/obrigatório nas normas ABNT/desaconselhado pois pode gerar imprecisão/indiferente ao leitor especializado)"
        correctAnswer: desaconselhado pois pode gerar imprecisão
        difficulty: 4
        rationale: No texto científico, a precisão terminológica é mais importante que a variação estilística.
        objectives: [EF09LP20]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o gênero textual adequado à situação.
    exercises:
      - type: paragraph
        question: "Um aluno deve apresentar os resultados de uma pesquisa sobre dengue na escola. O gênero mais adequado é: (conto/crônica/redação de vestibular/artigo científico ou relatório)"
        correctAnswer: artigo científico ou relatório
        difficulty: 5
        rationale: A situação comunicativa (pesquisa científica escolar) exige gênero que organize hipótese, método e resultados.
        objectives: [EF09LP20]
target: 10
