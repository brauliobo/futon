title: 🎓 Revisão Geral — Nível H
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP07, EF09LP08, EF09LP11, EF09LP17, EF09LP25]
authorNotes: Revisão integradora dos conteúdos do Nível H: sintaxe, semântica, figuras de linguagem, literatura, gêneros textuais e funções da linguagem.
example: "Nível H cobre da sintaxe ao estilo literário. Ex.: 'Embora chovesse, saímos' → adverbial concessiva + 'embora' + subjuntivo imperfeito → domínio do período composto."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Oração Subordinada Adverbial
    description: Classifique a relação adverbial.
    exercises:
      - type: paragraph
        question: "'Saiu mais cedo para não se atrasar' — a oração sublinhada é adverbial: (concessiva/causal/consecutiva/final)"
        correctAnswer: final
        difficulty: 2
        rationale: "'Para não se atrasar' indica o objetivo — relação de finalidade.
        objectives: [EF09LP07]
  - pageNumber: 2
    title: Voz Passiva
    description: Identifique a voz verbal.
    exercises:
      - type: paragraph
        question: "'Os projetos foram aprovados pela comissão' está na voz: (ativa/reflexiva/passiva analítica/passiva sintética)"
        correctAnswer: passiva analítica
        difficulty: 2
        rationale: 'foram' + particípio 'aprovados' com agente explícito ('pela comissão') — passiva analítica.
        objectives: [EF09LP08]
  - pageNumber: 3
    title: Figura de Linguagem
    description: Identifique o recurso estilístico.
    exercises:
      - type: paragraph
        question: "'O silêncio gritava mais alto que as palavras' usa principalmente: (metonímia/hipérbole/eufemismo/personificação)"
        correctAnswer: personificação
        difficulty: 3
        rationale: 'Silêncio' recebe ação humana ('gritar') — personificação com efeito paradoxal.
        objectives: [EF09LP11]
  - pageNumber: 4
    title: Semântica — Denotação e Conotação
    description: Distingua o sentido da palavra no contexto.
    exercises:
      - type: paragraph
        question: "Em 'Ele tem um coração de ouro', 'ouro' está em sentido: (denotativo/polissêmico/antonímico/conotativo)"
        correctAnswer: conotativo
        difficulty: 3
        rationale: 'Ouro' não designa o metal — é metáfora para bondade e generosidade.
        objectives: [EF09LP11]
  - pageNumber: 5
    title: Concordância Verbal
    description: Aplicação das regras em contexto.
    exercises:
      - type: paragraph
        question: "'Muitos de nós ___ cansados' (estar): (estamos/estão/está/estais)"
        correctAnswer: estamos
        difficulty: 3
        rationale: Quando 'nós' está incluído em 'muitos de nós', o verbo vai para a 1ª pessoa do plural.
        objectives: [EF09LP08]
  - pageNumber: 6
    title: Funções da Linguagem
    description: Identifique a função predominante.
    exercises:
      - type: paragraph
        question: "'Prezado cliente, seu pedido foi enviado' é um exemplo de função: (poética/emotiva/fática/referencial)"
        correctAnswer: referencial
        difficulty: 3
        rationale: Informa objetivamente sobre um fato — função referencial dominante.
        objectives: [EF09LP25]
  - pageNumber: 7
    title: Texto Dissertativo — Argumento
    description: Reconheça o tipo de argumento.
    exercises:
      - type: paragraph
        question: "'De acordo com a UNESCO, 750 milhões de adultos são analfabetos no mundo' é argumento de: (exemplificação/analogia/autoridade/causa e efeito)"
        correctAnswer: autoridade
        difficulty: 4
        rationale: Dado de organização reconhecida (UNESCO) dá credibilidade — argumento de autoridade.
        objectives: [EF09LP17]
  - pageNumber: 8
    title: Literatura Modernista
    description: Reconheça características e autores.
    exercises:
      - type: paragraph
        question: "A valorização da identidade nacional, da linguagem coloquial e da ruptura com modelos europeus são características do: (Romantismo/Realismo/Parnasianismo/Modernismo)"
        correctAnswer: Modernismo
        difficulty: 4
        rationale: Essas são marcas centrais do Modernismo brasileiro — especialmente da primeira fase (1922-1930).
        objectives: [EF09LP17]
  - pageNumber: 9
    title: Crase em Contexto
    description: Aplique a regra da crase corretamente.
    exercises:
      - type: paragraph
        question: "Correto: (Ele se referiu à situação descrita/Ele se referiu a situação descrita/Ele se referiu às situação descrita/Ele se referiu ha situação descrita)"
        correctAnswer: Ele se referiu à situação descrita
        difficulty: 4
        rationale: 'Referir-se a' + 'a situação' → crase obrigatória ('à situação').
        objectives: [EF09LP08]
  - pageNumber: 10
    title: Revisão Final Integrada
    description: Análise completa de frase complexa.
    exercises:
      - type: paragraph
        question: "Em 'Embora o texto seja difícil, quem estuda consegue compreendê-lo', as orações são, respectivamente: (coordenada + subordinada substantiva/adverbial concessiva + principal com subordinada adjetiva/adverbial causal + coordenada conclusiva/ambas coordenadas adversativas)"
        correctAnswer: adverbial concessiva + principal com subordinada adjetiva
        difficulty: 5
        rationale: "'Embora…difícil' é adverbial concessiva; 'quem estuda' é subordinada adjetiva integrada à oração principal.
        objectives: [EF09LP07]
target: 10
