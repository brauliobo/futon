title: 🔤 Ortografia e Acentuação Avançada
level: H
subject: portuguese
difficulty: 5
objectives: [EF09LP23, EF09LP24]
authorNotes: Reforma ortográfica de 2009, acento diferencial, hífen, parônimos e homônimos. Aprofundamento além do nível básico.
example: "Acento diferencial distingue palavras. Ex.: 'pôde' (pretérito perfeito) ≠ 'pode' (presente) → acento diferencial obrigatório."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Reforma Ortográfica — Trema
    description: Trema eliminado em palavras de origem portuguesa.
    exercises:
      - type: paragraph
        question: "Após a reforma ortográfica de 2009, a grafia correta é: (lingüiça/frequência/freqüência/linguiça)"
        correctAnswer: linguiça
        difficulty: 2
        rationale: O trema foi abolido no português brasileiro; 'linguiça' é a grafia atual.
        objectives: [EF09LP23]
  - pageNumber: 2
    title: Acento no Hiato
    description: Vogais 'i' e 'u' tônicas em hiato recebem acento.
    exercises:
      - type: paragraph
        question: "Qual palavra está acentuada corretamente? (baul/bau/baúl/baú)"
        correctAnswer: baú
        difficulty: 2
        rationale: "'u' tônico em hiato (ba-ú) recebe acento agudo."
        objectives: [EF09LP23]
  - pageNumber: 3
    title: Acento Diferencial — pôde / pode
    description: Distingue formas verbais homógrafas.
    exercises:
      - type: paragraph
        question: "'Ontem ele não ___ terminar a tarefa' — forma correta: (pôde/pode/póde/pode-se)"
        correctAnswer: pôde
        difficulty: 3
        rationale: "'Pôde' (pretérito perfeito) leva acento circunflexo para distinguir de 'pode' (presente)."
        objectives: [EF09LP23]
  - pageNumber: 4
    title: Parônimos — distinção por escrita
    description: Palavras parecidas com sentidos diferentes.
    exercises:
      - type: paragraph
        question: "O aluno obteve uma boa ___ na prova. (cessão/seção/sessão/secção)"
        correctAnswer: sessão
        difficulty: 3
        rationale: "'Sessão' = período de tempo de uma atividade; 'seção' = parte; 'cessão' = ato de ceder."
        objectives: [EF09LP24]
  - pageNumber: 5
    title: Hífen — Prefixos
    description: Uso do hífen com prefixos após a reforma.
    exercises:
      - type: paragraph
        question: "A grafia correta com o prefixo 'anti' é: (anti-inflamatório/antiinflamatório/anti inflamatório/antinflamatório)"
        correctAnswer: anti-inflamatório
        difficulty: 3
        rationale: Usa-se hífen quando o prefixo termina em vogal e a palavra seguinte começa com a mesma vogal ou 'h'.
        objectives: [EF09LP23]
  - pageNumber: 6
    title: Homônimos — distinção pelo contexto
    description: Palavras iguais na escrita com sentidos diferentes.
    exercises:
      - type: paragraph
        question: "'São Paulo é uma cidade grande' — 'São' é: (verbo ser/substantivo/adjetivo masculino/pronome)"
        correctAnswer: verbo ser
        difficulty: 3
        rationale: "'São' = são (3ª pessoa do plural do verbo ser) — homônimo de 'são' (saudável)."
        objectives: [EF09LP24]
  - pageNumber: 7
    title: Acentuação — Oxítonas
    description: Acentuam-se oxítonas terminadas em -a(s), -e(s), -o(s), -em, -ens.
    exercises:
      - type: paragraph
        question: "Qual oxítona está grafada corretamente? (café/cafe/cafê/cafè)"
        correctAnswer: café
        difficulty: 2
        rationale: Oxítona terminada em -é recebe acento agudo obrigatório.
        objectives: [EF09LP23]
  - pageNumber: 8
    title: Acentuação — Proparoxítonas
    description: Todas as proparoxítonas são acentuadas.
    exercises:
      - type: paragraph
        question: "Qual das palavras abaixo é proparoxítona e está corretamente grafada? (matematica/matemática/matematíca/matematicá)"
        correctAnswer: matemática
        difficulty: 3
        rationale: Proparoxítonas têm acento na antepenúltima sílaba — regra sem exceção.
        objectives: [EF09LP23]
  - pageNumber: 9
    title: Uso de 'por que', 'porque', 'porquê', 'por quê'
    description: Distinção pelos contextos de uso.
    exercises:
      - type: paragraph
        question: "'Não sei ___ ele chegou tarde.' Forma correta: (por quê/porquê/porque/por que)"
        correctAnswer: por que
        difficulty: 4
        rationale: Em pergunta indireta, usa-se 'por que' (separado e sem acento) — equivale a 'pelo qual'.
        objectives: [EF09LP24]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o erro ortográfico.
    exercises:
      - type: paragraph
        question: "Qual frase contém erro ortográfico? (O nível d'água subiu/Ela previu o acontecimento/O juíz proferiu a sentença/O país atravessa uma crise)"
        correctAnswer: O juíz proferiu a sentença
        difficulty: 5
        rationale: "'juíz' deve ser escrito 'juiz' — sem acento, pois é paroxítona terminada em ditongo."
        objectives: [EF09LP24]
target: 10
