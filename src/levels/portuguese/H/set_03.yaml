title: Orações Subordinadas Adjetivas
level: H
subject: portuguese
difficulty: 3
objectives: [EF09LP07, EF09LP08]
authorNotes: Restritivas e explicativas. Introduzidas por pronomes relativos — que, quem, o qual, cujo, onde.
example: "O livro que li é bom — restritiva. Ex.: 'As flores que nasceram ontem são belas' — a … → restritiva."
pages:
  - pageNumber: 1
    title: Restritiva
    description: Especifica, não vai entre vírgulas.
    exercises:
      - type: paragraph
        question: "'As flores que nasceram ontem são belas' — a subordinada é: (restritiva/explicativa/substantiva/adverbial)"
        correctAnswer: restritiva
        difficulty: 2
        rationale: Sem vírgulas; restringe 'flores'.
        objectives: [EF09LP07]
  - pageNumber: 2
    title: Explicativa
    description: Acrescenta informação não essencial; entre vírgulas.
    exercises:
      - type: paragraph
        question: "'Os homens, que são mortais, temem a morte' — a subordinada é: (explicativa/restritiva/substantiva/adverbial)"
        correctAnswer: explicativa
        difficulty: 3
        rationale: Entre vírgulas e generaliza — explicativa.
        objectives: [EF09LP07]
  - pageNumber: 3
    title: Pronome Relativo 'que'
    description: O mais frequente; retoma o antecedente.
    exercises:
      - type: paragraph
        question: "Em 'O carro que comprei é novo', 'que' retoma: (carro/comprei/novo/o)"
        correctAnswer: carro
        difficulty: 1
        rationale: "'Que' retoma o antecedente imediato — o substantivo anterior ao pronome."
        objectives: [EF09LP07]
  - pageNumber: 4
    title: Pronome Relativo 'quem'
    description: Referente a pessoas, com preposição obrigatória.
    exercises:
      - type: paragraph
        question: "Em 'A pessoa a quem escrevi respondeu', 'a quem' retoma: (a pessoa/respondeu/escrevi/pessoa)"
        correctAnswer: a pessoa
        difficulty: 3
        rationale: "'Quem' exige preposição; retoma antecedente pessoal."
        objectives: [EF09LP08]
  - pageNumber: 5
    title: Pronome Relativo 'cujo'
    description: Indica posse; concorda com o substantivo posterior.
    exercises:
      - type: paragraph
        question: "Em 'O aluno cuja prova foi ótima passou', 'cuja' concorda com: (prova/aluno/ótima/foi)"
        correctAnswer: prova
        difficulty: 3
        rationale: "'Cujo/cuja' concorda em gênero e número com o substantivo seguinte."
        objectives: [EF09LP08]
  - pageNumber: 6
    title: Pronome Relativo 'onde'
    description: Usado apenas para lugar físico.
    exercises:
      - type: paragraph
        question: "Uso correto de 'onde': (A casa onde moro é antiga/O momento onde chegaram/A situação onde estávamos/O amor onde sentimos)"
        correctAnswer: A casa onde moro é antiga
        difficulty: 2
        rationale: "'Onde' refere-se a lugar físico; para tempo use 'em que'."
        objectives: [EF09LP08]
  - pageNumber: 7
    title: Restritiva vs Explicativa
    description: A pontuação muda o sentido.
    exercises:
      - type: paragraph
        question: "Qual sentido: 'Os alunos, que estudaram, passaram'? (todos os alunos estudaram e passaram/apenas os que estudaram passaram/nenhum aluno passou/não se pode inferir)"
        correctAnswer: todos os alunos estudaram e passaram
        difficulty: 3
        rationale: Entre vírgulas, explica o todo.
        objectives: [EF09LP08]
  - pageNumber: 8
    title: Reduzida de Particípio
    description: Forma compacta da oração adjetiva.
    exercises:
      - type: paragraph
        question: "'Os livros comprados ontem são caros' tem reduzida de: (particípio/gerúndio/infinitivo/presente)"
        correctAnswer: particípio
        difficulty: 3
        rationale: "'Comprados' é particípio, substitui 'que foram comprados'."
        objectives: [EF09LP08]
  - pageNumber: 9
    title: Reduzida de Gerúndio
    description: Equivalente à oração adjetiva com 'que + gerundial'.
    exercises:
      - type: paragraph
        question: "'Vi a menina chorando' pode ser substituída por: (Vi a menina que estava chorando/Vi a menina para chorar/Vi que a menina/Vi a menina chorou)"
        correctAnswer: Vi a menina que estava chorando
        difficulty: 3
        rationale: Gerúndio expressa ação simultânea.
        objectives: [EF09LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique a subordinada adjetiva.
    exercises:
      - type: paragraph
        question: "'Meu pai, que é médico, ajuda todos' — a subordinada é: (explicativa/restritiva/substantiva/adverbial)"
        correctAnswer: explicativa
        difficulty: 2
        rationale: Entre vírgulas, acrescenta informação.
        objectives: [EF09LP08]
target: 10
