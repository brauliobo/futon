title: Palavras Simples - Casa
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — casa/objetos. Associa palavra escrita a referente concreto."
example: "Pratique palavras simples - casa. Ex.: Onde dormimos? → CAMA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Partes da Casa
    description: Leia as palavras sobre a casa.
    exercises:
      - type: grammar
        question: Onde dormimos? (SOFÁ/CAMA/MESA)
        correctAnswer: CAMA
        rationale: "Dormimos na cama."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Onde comemos? (CAMA/PIA/MESA)
        correctAnswer: MESA
        rationale: "Comemos à mesa."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que usamos para entrar? (PORTA/TETO/JANELA)
        correctAnswer: PORTA
        rationale: "Para entrar, usamos a porta."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Por onde entra a luz? (CHÃO/JANELA/PORTA)
        correctAnswer: JANELA
        rationale: "Observe as opções e escolha a que responde \"Por onde entra a luz?\": 'JANELA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Onde pisamos? (TETO/PAREDE/CHÃO)
        correctAnswer: CHÃO
        rationale: "Observe as opções e escolha a que responde \"Onde pisamos?\": 'CHÃO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: CAMA tem quantas sílabas? (3/1/2)
        correctAnswer: 2
        rationale: "Conte as sílabas: 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: MESA começa com que letra? (N/B/M)
        correctAnswer: M
        rationale: "Observe as opções e escolha a que responde \"MESA começa com que letra?\": 'M'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: PORTA termina com que letra? (O/A/E)
        correctAnswer: A
        rationale: "A palavra termina com 'A'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual palavra tem 6 letras? (JANELA/CAMA/MESA)
        correctAnswer: JANELA
        rationale: "'JANELA' tem 6 letras."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: CHÃO tem quantas letras? (4/3/5)
        correctAnswer: 4
        rationale: "Conte as letras em 'O': 4."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
