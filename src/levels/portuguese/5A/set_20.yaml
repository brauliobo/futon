title: Revisão Geral - Tudo o que Aprendemos
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Pratique revisão geral - tudo o que aprendemos. Ex.: Quantas vogais tem o português? → 5."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Revisão Final
    description: Revise tudo sobre leitura e escrita.
    exercises:
      - type: grammar
        question: Quantas vogais tem o português? (6/5/4)
        correctAnswer: 5
        rationale: "Conte as vogais em 'o': 5."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: CA + SA = ? (COSA/CASA/CESA)
        correctAnswer: CASA
        rationale: "CA + SA formam CASA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com PATO? (FLOR/GATO/CASA)
        correctAnswer: GATO
        rationale: "'GATO' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: EU COMO PÃO. O que EU faço? (COMO/BEBO/CORRO)
        correctAnswer: COMO
        rationale: "Observe as opções e escolha a que responde \"EU COMO PÃO. O que EU faço?\": 'COMO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Como separar BOLA? (BO-LA/BOL-A/B-OLA)
        correctAnswer: BO-LA
        rationale: "Separe por sílabas: BO-LA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Que letra vem depois de A? (B/C/D)
        correctAnswer: B
        rationale: "No alfabeto, após A vem B."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O animal que mia é o? (PATO/GATO/CÃO)
        correctAnswer: GATO
        rationale: "Observe as opções e escolha a que responde \"O animal que mia é o?\": 'GATO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: ELA É BONITA. ELA fala sobre uma? (MENINA/COISA/MENINO)
        correctAnswer: MENINA
        rationale: "Observe as opções e escolha a que responde \"ELA É BONITA. ELA fala sobre uma?\": 'MENINA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: AMARELO tem quantas sílabas? (4/3/5)
        correctAnswer: 4
        rationale: "Conte as sílabas: 4."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual é a primeira letra do alfabeto? (B/C/A)
        correctAnswer: A
        rationale: "Observe as opções e escolha a que responde \"Qual é a primeira letra do alfabeto?\": 'A'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
