title: Leitura Simples - Dia de Chuva
level: 5A
subject: portuguese
pages:
  - pageNumber: 1
    title: História da Chuva
    description: Leia sobre um dia chuvoso.
    exercises:
      - type: reading
        question: "HOJE ESTÁ CHOVENDO. Como está o tempo? (CHOVENDO/SOL/VENTO)"
        correctAnswer: CHOVENDO
      - type: reading
        question: "JOÃO NÃO PODE SAIR. Quem não pode sair? (JOÃO/MARIA/PEDRO)"
        correctAnswer: JOÃO
      - type: reading
        question: "ELE BRINCA EM CASA. Onde ele brinca? (CASA/RUA/PARQUE)"
        correctAnswer: CASA
      - type: reading
        question: "JOÃO DESENHA E LÊ. O que JOÃO faz? (DESENHA E LÊ/SÓ DESENHA/SÓ LÊ)"
        correctAnswer: DESENHA E LÊ
      - type: reading
        question: "A CHUVA FAZ BARULHO. A chuva faz o que? (BARULHO/LUZ/CALOR)"
        correctAnswer: BARULHO
      - type: reading
        question: "Por que João não sai? (ESTÁ CHOVENDO/ESTÁ TARDE/ESTÁ FRIO)"
        correctAnswer: ESTÁ CHOVENDO
      - type: reading
        question: "Quantas atividades João faz em casa? (2/1/3)"
        correctAnswer: 2
      - type: reading
        question: "João fica onde quando chove? (EM CASA/NA RUA/NO CARRO)"
        correctAnswer: EM CASA
      - type: reading
        question: "A história fala sobre que tipo de dia? (CHUVOSO/ENSOLARADO/VENTOSO)"
        correctAnswer: CHUVOSO
      - type: reading
        question: "O que João NÃO pode fazer? (SAIR/DESENHAR/LER)"
        correctAnswer: SAIR
target: 10
