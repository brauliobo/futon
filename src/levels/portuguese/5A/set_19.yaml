title: 📝 Leitura Simples - Dia de Chuva
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Leitura de texto curto. Desenvolve fluência e compreensão básica."
example: "Pratique leitura simples - dia de chuva. Ex.: HOJE ESTÁ CHOVENDO. Como está o tempo? → CHOVENDO."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: História da Chuva
    description: Leia sobre um dia chuvoso.
    exercises:
      - type: reading
        question: HOJE ESTÁ CHOVENDO. Como está o tempo? (SOL/CHOVENDO/VENTO)
        correctAnswer: CHOVENDO
        rationale: "A frase diz 'ESTÁ CHOVENDO' — é o estado do tempo."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: JOÃO NÃO PODE SAIR. Quem não pode sair? (JOÃO/MARIA/PEDRO)
        correctAnswer: JOÃO
        rationale: "A frase diz 'JOÃO NÃO PODE SAIR' — JOÃO é o sujeito."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: ELE BRINCA EM CASA. Onde ele brinca? (CASA/PARQUE/RUA)
        correctAnswer: CASA
        rationale: "A frase diz 'EM CASA' — é o lugar onde ele brinca."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: JOÃO DESENHA E LÊ. O que JOÃO faz? (DESENHA E LÊ/SÓ DESENHA/SÓ LÊ)
        correctAnswer: DESENHA E LÊ
        rationale: "A frase lista as duas ações com 'E': DESENHA E LÊ (ambas)."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A CHUVA FAZ BARULHO. A chuva faz o que? (BARULHO/CALOR/LUZ)
        correctAnswer: BARULHO
        rationale: "A frase diz 'FAZ BARULHO' — é a ação da chuva."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Por que João não sai? (ESTÁ TARDE/ESTÁ FRIO/ESTÁ CHOVENDO)
        correctAnswer: ESTÁ CHOVENDO
        rationale: "A história começa com 'HOJE ESTÁ CHOVENDO' — é por isso que João não sai."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas atividades João faz em casa? (1/2/3)
        correctAnswer: 2
        rationale: "'DESENHA E LÊ' lista 2 atividades: desenhar (1) e ler (2)."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: João fica onde quando chove? (NO CARRO/EM CASA/NA RUA)
        correctAnswer: EM CASA
        rationale: "'ELE BRINCA EM CASA' — é onde João fica durante a chuva."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A história fala sobre que tipo de dia? (ENSOLARADO/VENTOSO/CHUVOSO)
        correctAnswer: CHUVOSO
        rationale: "'HOJE ESTÁ CHOVENDO' descreve um dia com chuva — CHUVOSO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O que João NÃO pode fazer? (DESENHAR/SAIR/LER)
        correctAnswer: SAIR
        rationale: "'JOÃO NÃO PODE SAIR' afirma exatamente o que ele NÃO pode fazer."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
