title: Formação de Sílabas - CA, CE, CI, CO, CU
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Sílabas com C. Atenção — CA/CO/CU = /k/, CE/CI = /s/."
example: "Pratique formação de sílabas - ca, ce, ci, co, cu. Ex.: C + A = ? → CA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Sílabas com C
    description: Complete as sílabas com C.
    exercises:
      - type: grammar
        question: C + A = ? (CE/CA/CI)
        correctAnswer: CA
        rationale: "C + A formam CA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: C + E = ? (CI/CE/CO)
        correctAnswer: CE
        rationale: "C + E formam CE."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: C + I = ? (CO/CU/CI)
        correctAnswer: CI
        rationale: "C + I formam CI."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: C + O = ? (CU/CO/CA)
        correctAnswer: CO
        rationale: "C + O formam CO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: C + U = ? (CE/CA/CU)
        correctAnswer: CU
        rationale: "C + U formam CU."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: CA + SA = ? (CESA/CASA/CISA)
        correctAnswer: CASA
        rationale: "CA + SA formam CASA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: CO + LA = ? (CELA/CULA/COLA)
        correctAnswer: COLA
        rationale: "CO + LA formam COLA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: CU + BA = ? (CEBA/CABA/CUBA)
        correctAnswer: CUBA
        rationale: "CU + BA formam CUBA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Como escrevo 'CEDO'? (CI+DO/CA+DO/CE+DO)
        correctAnswer: CE+DO
        rationale: "Observe: CEDO = CE + DO (som /s/ antes de E); CI+DO daria CIDO e CA+DO daria CADO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: CI + MA = ? (COMA/CIMA/CUMA)
        correctAnswer: CIMA
        rationale: "CI + MA formam CIMA."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
