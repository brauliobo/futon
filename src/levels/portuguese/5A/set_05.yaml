title: ✏️ Palavras Simples - Animais
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — animais. Leitura de palavras de alta frequência."
example: "Pratique palavras simples - animais. Ex.: O animal que mia é o? → GATO."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nomes de Animais
    description: Leia e identifique os animais.
    exercises:
      - type: grammar
        question: O animal que mia é o? (PATO/GATO/CÃO)
        correctAnswer: GATO
        rationale: "O gato faz 'miau'; o pato grasna e o cão late."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O animal que late é o? (CÃO/BOI/GATO)
        correctAnswer: CÃO
        rationale: "O cão late ('au au'); o boi muge e o gato mia."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O animal que voa é o? (BODE/RATO/PATO)
        correctAnswer: PATO
        rationale: "O pato tem asas e voa (também nada); bode e rato andam no chão."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O animal pequeno que rói é o? (BODE/RATO/LOBO)
        correctAnswer: RATO
        rationale: "Observe a característica: o rato é pequeno e rói com seus dentes afiados; bode e lobo são bem maiores."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O animal que dá leite é a? (VACA/LOBA/RATA)
        correctAnswer: VACA
        rationale: "A vaca dá leite (que bebemos); loba e rata não são criadas para leite."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Quantas letras tem GATO? (4/5/3)
        correctAnswer: 4
        rationale: "Conte as letras em 'GATO': 4."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A primeira letra de CÃO é? (G/C/P)
        correctAnswer: C
        rationale: "Em 'C', a primeira letra é 'C'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: PATO termina com que letra? (O/A/E)
        correctAnswer: O
        rationale: "A palavra termina com 'O'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: "Qual palavra é maior: RATO ou CÃO? (IGUAL/RATO/CÃO)"
        correctAnswer: RATO
        rationale: "RATO tem 4 letras (R-A-T-O); CÃO tem 3 (C-Ã-O). RATO é maior."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: VACA começa com que letra? (B/V/F)
        correctAnswer: V
        rationale: "Soletre VACA: V-A-C-A — começa com V."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
