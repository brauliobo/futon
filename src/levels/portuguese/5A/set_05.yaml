title: Palavras Simples - Animais
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — animais. Leitura de palavras de alta frequência."
example: "Pratique palavras simples - animais. Ex.: O animal que mia é o? → GATO."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nomes de Animais
    description: Leia e identifique os animais.
    exercises:
      - type: grammar
        question: O animal que mia é o? (PATO/GATO/CÃO)
        correctAnswer: GATO
        rationale: "Observe as opções e escolha a que responde \"O animal que mia é o?\": 'GATO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O animal que late é o? (BOI/GATO/CÃO)
        correctAnswer: CÃO
        rationale: "Observe as opções e escolha a que responde \"O animal que late é o?\": 'CÃO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O animal que voa é o? (PATO/BODE/RATO)
        correctAnswer: PATO
        rationale: "Observe as opções e escolha a que responde \"O animal que voa é o?\": 'PATO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O animal pequeno que rói é o? (BODE/LOBO/RATO)
        correctAnswer: RATO
        rationale: "Observe as opções e escolha a que responde \"O animal pequeno que rói é o?\": 'RATO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O animal que dá leite é a? (LOBA/RATA/VACA)
        correctAnswer: VACA
        rationale: "Observe as opções e escolha a que responde \"O animal que dá leite é a?\": 'VACA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Quantas letras tem GATO? (4/3/5)
        correctAnswer: 4
        rationale: "Conte as letras em 'GATO': 4."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A primeira letra de CÃO é? (G/C/P)
        correctAnswer: C
        rationale: "Em 'C', a primeira letra é 'C'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: PATO termina com que letra? (E/O/A)
        correctAnswer: O
        rationale: "A palavra termina com 'O'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: "Qual palavra é maior: RATO ou CÃO? (IGUAL/RATO/CÃO)"
        correctAnswer: RATO
        rationale: "Observe as opções e escolha a que responde \"Qual palavra é maior: RATO ou CÃO?\": 'RATO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: VACA começa com que letra? (B/F/V)
        correctAnswer: V
        rationale: "Observe as opções e escolha a que responde \"VACA começa com que letra?\": 'V'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
