title: Reconhecimento de Letras - Consoantes
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Reconhecimento de consoantes básicas. Base para sílabas CV."
example: "Pratique reconhecimento de letras - consoantes. Ex.: Qual consoante inicia 'bola'? → b."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Identificar Consoantes
    description: Identifique as consoantes nas palavras.
    exercises:
      - type: grammar
        question: Qual consoante inicia 'bola'? (b/p/d)
        correctAnswer: b
        rationale: "'bola' começa com a letra b."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Que letra começa 'casa'? (k/s/c)
        correctAnswer: c
        rationale: "'casa' começa com a letra c."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual consoante está no início de 'dado'? (b/d/t)
        correctAnswer: d
        rationale: "'dado' começa com 'd'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Que letra inicia 'foca'? (p/f/v)
        correctAnswer: f
        rationale: "'foca' começa com 'f'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual consoante começa 'gato'? (j/c/g)
        correctAnswer: g
        rationale: "'gato' começa com 'g'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Quantas consoantes tem 'mala'? (2/3/1)
        correctAnswer: 2
        rationale: "Em 'mala', conte as letras que não são A/E/I/O/U."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual consoante aparece em 'nana'? (l/n/m)
        correctAnswer: n
        rationale: "Em 'nana', 'n' aparece como consoante."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A palavra 'papa' tem quantas consoantes? (1/2/3)
        correctAnswer: 2
        rationale: "Conte as consoantes em 'papa': 2."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual consoante falta em '_ato'? (r/c/g)
        correctAnswer: g
        rationale: "Observe as opções e escolha a que responde \"Qual consoante falta em '_ato'?\": 'g'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Em 'rato', qual é a primeira consoante? (n/t/r)
        correctAnswer: r
        rationale: "Observe as opções e escolha a que responde \"Em 'rato', qual é a primeira consoante?\": 'r'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
