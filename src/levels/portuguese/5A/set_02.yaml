title: Reconhecimento de Letras - Consoantes
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Reconhecimento de consoantes básicas. Base para sílabas CV."
example: "Pratique reconhecimento de letras - consoantes."
pages:
  - pageNumber: 1
    title: Identificar Consoantes
    description: Identifique as consoantes nas palavras.
    exercises:
      - type: grammar
        question: Qual consoante inicia 'bola'? (b/p/d)
        correctAnswer: b
        rationale: "'bola' começa com a letra b."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Que letra começa 'casa'? (c/s/k)
        correctAnswer: c
        rationale: "'casa' começa com a letra c."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual consoante está no início de 'dado'? (d/t/b)
        correctAnswer: d
        rationale: "Resposta: d — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Que letra inicia 'foca'? (f/v/p)
        correctAnswer: f
        rationale: "Resposta: f — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual consoante começa 'gato'? (g/c/j)
        correctAnswer: g
        rationale: "Resposta: g — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Quantas consoantes tem 'mala'? (1/2/3)
        correctAnswer: 2
        rationale: "Em 'mala', conte as letras que não são A/E/I/O/U."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual consoante aparece em 'nana'? (n/m/l)
        correctAnswer: n
        rationale: "Resposta: n — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A palavra 'papa' tem quantas consoantes? (1/2/3)
        correctAnswer: 2
        rationale: "Resposta: 2 — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual consoante falta em '_ato'? (g/c/r)
        correctAnswer: g
        rationale: "Resposta: g — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Em 'rato', qual é a primeira consoante? (r/t/n)
