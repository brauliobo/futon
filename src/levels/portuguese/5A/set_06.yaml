title: Palavras Simples - Família
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — família. Palavras de uso cotidiano."
example: "Pratique palavras simples - família. Ex.: Quem é o homem adulto da família? → PAI."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Membros da Família
    description: Leia as palavras da família.
    exercises:
      - type: grammar
        question: Quem é o homem adulto da família? (MÃE/PAI/AVÔ)
        correctAnswer: PAI
        rationale: "O homem adulto é o pai."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Quem é a mulher adulta da família? (MÃE/PAI/AVÓ)
        correctAnswer: MÃE
        rationale: "A mulher adulta é a mãe."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O pai do pai é o? (TIO/PRIMO/AVÔ)
        correctAnswer: AVÔ
        rationale: "O pai do pai é o avô."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A mãe da mãe é a? (PRIMA/TIA/AVÓ)
        correctAnswer: AVÓ
        rationale: "A mãe da mãe é a avó."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O irmão do pai é o? (AVÔ/TIO/PRIMO)
        correctAnswer: TIO
        rationale: "TIO é o irmão do pai (ou da mãe); AVÔ é o pai do pai e PRIMO é filho do tio."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Quantas letras tem MÃE? (2/3/4)
        correctAnswer: 3
        rationale: "Conte as letras em 'M': 3."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: PAI termina com que letra? (I/A/O)
        correctAnswer: I
        rationale: "A palavra termina com 'I'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: AVÔ começa com que letra? (A/I/E)
        correctAnswer: A
        rationale: "Soletre AVÔ: A-V-Ô — começa com A."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: "Qual palavra é menor: TIO ou PRIMO? (IGUAL/PRIMO/TIO)"
        correctAnswer: TIO
        rationale: "TIO tem 3 letras (T-I-O); PRIMO tem 5 (P-R-I-M-O). TIO é menor."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: AVÓ tem quantas vogais? (2/1/3)
        correctAnswer: 2
        rationale: "Em A-V-Ó as vogais são A e Ó → 2 vogais."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
