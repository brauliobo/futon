title: Vogais em Palavras
level: 5A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/5A.
example: "Identifique e conte vogais nas palavras."
pages:
  - pageNumber: 1
    title: Primeira Vogal
    description: Identifique a primeira vogal de cada palavra.
    exercises:
      - { type: grammar, question: "Primeira vogal de 'avô'? (a/e/i)", correctAnswer: a }
      - { type: grammar, question: "Primeira vogal de 'eco'? (e/i/o)", correctAnswer: e }
      - { type: grammar, question: "Primeira vogal de 'ilha'? (i/a/u)", correctAnswer: i }
      - { type: grammar, question: "Primeira vogal de 'ovo'? (o/u/e)", correctAnswer: o }
      - { type: grammar, question: "Primeira vogal de 'uva'? (u/a/i)", correctAnswer: u }
      - { type: grammar, question: "Primeira vogal de 'pato'? (a/o/e)", correctAnswer: a }
      - { type: grammar, question: "Primeira vogal de 'dedo'? (e/o/i)", correctAnswer: e }
      - { type: grammar, question: "Primeira vogal de 'milho'? (i/o/a)", correctAnswer: i }
      - { type: grammar, question: "Primeira vogal de 'bolo'? (o/a/e)", correctAnswer: o }
      - { type: grammar, question: "Primeira vogal de 'lua'? (u/a/o)", correctAnswer: u }
  - pageNumber: 2
    title: Contando Vogais
    description: Conte quantas vogais tem em cada palavra.
    exercises:
      - { type: grammar, question: "Quantas vogais em 'casa'? (1/2/3)", correctAnswer: 2 }
      - { type: grammar, question: "Quantas vogais em 'mama'? (1/2/3)", correctAnswer: 2 }
      - { type: grammar, question: "Quantas vogais em 'bebê'? (1/2/3)", correctAnswer: 2 }
      - { type: grammar, question: "Quantas vogais em 'banana'? (2/3/4)", correctAnswer: 3 }
      - { type: grammar, question: "Quantas vogais em 'menino'? (2/3/4)", correctAnswer: 3 }
      - { type: grammar, question: "Quantas vogais em 'menina'? (2/3/4)", correctAnswer: 3 }
      - { type: grammar, question: "Quantas vogais em 'escola'? (2/3/4)", correctAnswer: 3 }
      - { type: grammar, question: "Quantas vogais em 'bicicleta'? (3/4/5)", correctAnswer: 4 }
      - { type: grammar, question: "Quantas vogais em 'sol'? (1/2/3)", correctAnswer: 1 }
      - { type: grammar, question: "Quantas vogais em 'avião'? (2/3/4)", correctAnswer: 3 }
  - pageNumber: 3
    title: Completando Palavras
    description: Adicione a vogal que falta.
    exercises:
      - { type: grammar, question: "p_to (pato): (a/e/i)", correctAnswer: a }
      - { type: grammar, question: "b_la (bola): (o/a/e)", correctAnswer: o }
      - { type: grammar, question: "l_va (luva): (u/a/o)", correctAnswer: u }
      - { type: grammar, question: "c_sa (casa): (a/e/i)", correctAnswer: a }
      - { type: grammar, question: "m_sa (mesa): (e/a/o)", correctAnswer: e }
      - { type: grammar, question: "g_to (gato): (a/e/i)", correctAnswer: a }
      - { type: grammar, question: "s_l (sol): (o/a/e)", correctAnswer: o }
      - { type: grammar, question: "l_a (lua): (u/o/a)", correctAnswer: u }
      - { type: grammar, question: "p_i (pai): (a/e/o)", correctAnswer: a }
      - { type: grammar, question: "v_vô (vovô): (o/a/e)", correctAnswer: o }
target: 30
