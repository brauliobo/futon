title: Frases Simples - Ele/Ela
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Frases com 'ele/ela'. Concordância em 3ª pessoa do singular."
example: "Pratique frases simples - ele/ela."
pages:
  - pageNumber: 1
    title: Frases com ELE e ELA
    description: Leia as frases com ELE e ELA.
    exercises:
      - type: grammar
        question: ELE É MEU PAI. Quem é ELE? (PAI/MÃE/AVÔ)
        correctAnswer: PAI
        rationale: "A resposta correta é 'PAI'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: ELA É LINDA. Como é ELA? (LINDA/FEA/ALTA)
        correctAnswer: LINDA
        rationale: "A resposta correta é 'LINDA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: ELE CORRE RÁPIDO. Como ELE corre? (RÁPIDO/DEVAGAR/LONGE)
        correctAnswer: RÁPIDO
        rationale: "A resposta correta é 'RÁPIDO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: ELA BRINCA NO PARQUE. Onde ELA brinca? (PARQUE/CASA/ESCOLA)
        correctAnswer: PARQUE
        rationale: "A resposta correta é 'PARQUE'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: ELE GOSTA DE UVA. Do que ELE gosta? (UVA/PERA/MAÇÃ)
        correctAnswer: UVA
        rationale: "A resposta correta é 'UVA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: "'ELE É MEU PAI' tem quantas palavras? (3/4/5)"
        correctAnswer: 4
        rationale: "A resposta correta é '4'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: ELA fala sobre uma? (MENINA/MENINO/ANIMAL)
        correctAnswer: MENINA
        rationale: "A resposta correta é 'MENINA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: ELE fala sobre um? (MENINO/MENINA/COISA)
        correctAnswer: MENINO
        rationale: "A resposta correta é 'MENINO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: "'ELA É LINDA' fala sobre? (BELEZA/COR/TAMANHO)"
        correctAnswer: BELEZA
        rationale: "A resposta correta é 'BELEZA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Em 'ELE CORRE', o que ELE faz? (CORRE/ANDA/PULA)
        correctAnswer: CORRE
        rationale: "A resposta correta é 'CORRE'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
