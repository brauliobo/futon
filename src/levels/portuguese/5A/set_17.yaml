title: Ordem Alfabética - N a Z
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Ordem alfabética N–Z. Complementa a primeira metade do alfabeto."
example: "Pratique ordem alfabética - n a z. Ex.: Que letra vem depois de N? → O."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Alfabeto N-Z
    description: Coloque as letras em ordem alfabética.
    exercises:
      - type: grammar
        question: Que letra vem depois de N? (M/O/P)
        correctAnswer: O
        rationale: "No alfabeto, após N vem O."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Que letra vem antes de R? (S/Q/P)
        correctAnswer: Q
        rationale: "Ordem alfabética P-Q-R: Q vem imediatamente antes de R."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Que letra vem depois de T? (V/S/U)
        correctAnswer: U
        rationale: "No alfabeto, após T vem U."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Que letra vem antes de X? (V/W/Y)
        correctAnswer: W
        rationale: "Ordem alfabética V-W-X: W vem imediatamente antes de X."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual é a última letra do alfabeto? (Z/Y/X)
        correctAnswer: Z
        rationale: "Ordem A-B-C-...-X-Y-Z termina em Z — é a 26ª e última."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Entre P e R, qual letra está no meio? (S/O/Q)
        correctAnswer: Q
        rationale: "Ordem P-Q-R: Q ocupa a posição central entre P e R."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Que letra vem antes de V? (T/U/W)
        correctAnswer: U
        rationale: "Ordem alfabética T-U-V: U vem imediatamente antes de V."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: S vem depois de? (R/Q/T)
        correctAnswer: R
        rationale: "Ordem alfabética Q-R-S: imediatamente antes de S está R."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Quantas letras há entre X e Z? (1/0/2)
        correctAnswer: 1
        rationale: "Entre X e Z há somente a letra Y — 1 letra."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Y vem antes de? (Z/X/W)
        correctAnswer: Z
        rationale: "Ordem alfabética X-Y-Z: Y é seguida imediatamente por Z."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
