title: Palavras Simples - Cores
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — cores. Associe palavra à imagem."
example: "Pratique palavras simples - cores."
pages:
  - pageNumber: 1
    title: Nomes das Cores
    description: Leia e identifique as cores.
    exercises:
      - type: grammar
        question: A cor do sol é? (AMARELO/AZUL/VERDE)
        correctAnswer: AMARELO
        rationale: "O sol tem cor AMARELO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A cor do céu é? (AZUL/VERDE/ROSA)
        correctAnswer: AZUL
        rationale: "O céu tem cor AZUL."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A cor da grama é? (VERDE/AZUL/ROXO)
        correctAnswer: VERDE
        rationale: "A grama tem cor VERDE."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A cor da noite é? (PRETO/BRANCO/CINZA)
        correctAnswer: PRETO
        rationale: "A noite tem cor PRETO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A cor da neve é? (BRANCO/PRETO/AZUL)
        correctAnswer: BRANCO
        rationale: "A neve tem cor BRANCO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: AMARELO tem quantas sílabas? (3/4/5)
        correctAnswer: 4
        rationale: "Conte as sílabas: 4."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: AZUL começa com que letra? (A/E/I)
        correctAnswer: A
        rationale: "A resposta correta é 'A'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: VERDE termina com que letra? (E/A/O)
        correctAnswer: E
        rationale: "A palavra termina com 'E'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual cor tem 5 letras? (PRETO/AZUL/ROSA)
        correctAnswer: PRETO
        rationale: "'PRETO' é a grafia correta desta cor."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: BRANCO tem quantas vogais? (2/3/4)
        correctAnswer: 2
        rationale: "Conte as vogais em 'BRANCO': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
