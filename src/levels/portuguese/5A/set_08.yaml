title: Palavras Simples - Cores
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — cores. Associe palavra à imagem."
example: "Pratique palavras simples - cores. Ex.: A cor do sol é? → AMARELO."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nomes das Cores
    description: Leia e identifique as cores.
    exercises:
      - type: grammar
        question: A cor do sol é? (VERDE/AMARELO/AZUL)
        correctAnswer: AMARELO
        rationale: "O sol tem cor AMARELO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A cor do céu é? (AZUL/ROSA/VERDE)
        correctAnswer: AZUL
        rationale: "O céu tem cor AZUL."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A cor da grama é? (AZUL/VERDE/ROXO)
        correctAnswer: VERDE
        rationale: "A grama tem cor VERDE."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A cor da noite é? (PRETO/CINZA/BRANCO)
        correctAnswer: PRETO
        rationale: "A noite tem cor PRETO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: A cor da neve é? (BRANCO/AZUL/PRETO)
        correctAnswer: BRANCO
        rationale: "A neve tem cor BRANCO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: AMARELO tem quantas sílabas? (4/3/5)
        correctAnswer: 4
        rationale: "Conte as sílabas: 4."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: AZUL começa com que letra? (I/A/E)
        correctAnswer: A
        rationale: "Soletre AZUL: A-Z-U-L — começa com A."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: VERDE termina com que letra? (A/O/E)
        correctAnswer: E
        rationale: "A palavra termina com 'E'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual cor tem 5 letras? (PRETO/AZUL/ROSA)
        correctAnswer: PRETO
        rationale: "'PRETO' é a grafia correta desta cor."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: BRANCO tem quantas vogais? (4/3/2)
        correctAnswer: 2
        rationale: "Conte as vogais em 'BRANCO': 2."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
