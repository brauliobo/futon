title: Frases Simples - Eu
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Frases com pronome 'eu'. Concordância verbo em 1ª pessoa."
example: "Pratique frases simples - eu. Ex.: EU SOU MARIA. Quem é Maria? → EU."
pages:
  - pageNumber: 1
    title: Frases com EU
    description: Leia as frases simples com EU.
    exercises:
      - type: grammar
        question: EU SOU MARIA. Quem é Maria? (EU/ELA/VOCÊ)
        correctAnswer: EU
        rationale: "A resposta correta é 'EU'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU COMO PÃO. O que eu como? (PÃO/BOLO/UVA)
        correctAnswer: PÃO
        rationale: "A resposta correta é 'PÃO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU BEBO ÁGUA. O que eu bebo? (ÁGUA/LEITE/SUCO)
        correctAnswer: ÁGUA
        rationale: "A resposta correta é 'ÁGUA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU AMO MAMÃE. Quem eu amo? (MAMÃE/PAPAI/VOVÓ)
        correctAnswer: MAMÃE
        rationale: "A resposta correta é 'MAMÃE'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU VEJO A LUA. O que eu vejo? (LUA/SOL/ESTRELA)
        correctAnswer: LUA
        rationale: "A resposta correta é 'LUA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Quantas palavras tem 'EU SOU MARIA'? (2/3/4)
        correctAnswer: 3
        rationale: "Separadas por espaços, há 3 palavras."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Em 'EU COMO', qual é a segunda palavra? (COMO/EU/PÃO)
        correctAnswer: COMO
        rationale: "A resposta correta é 'COMO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: "'EU BEBO' fala sobre o que faço com? (ÁGUA/COMIDA/AR)"
        correctAnswer: ÁGUA
        rationale: "A resposta correta é 'ÁGUA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Todas as frases começam com? (EU/ELA/NÓS)
        correctAnswer: EU
        rationale: "A resposta correta é 'EU'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: "'EU AMO' expressa um? (SENTIMENTO/COR/ANIMAL)"
        correctAnswer: SENTIMENTO
        rationale: "A resposta correta é 'SENTIMENTO'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
