    title: Frases com EU
    description: Leia as frases simples com EU.
    exercises:
      - type: grammar
        question: EU SOU MARIA. Quem é Maria? (EU/ELA/VOCÊ)
        correctAnswer: EU
        rationale: "Releia a informação: "EU SOU MARIA." — resposta: EU."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU COMO PÃO. O que eu como? (PÃO/BOLO/UVA)
        correctAnswer: PÃO
        rationale: "Releia a informação: "EU COMO PÃO." — resposta: PÃO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU BEBO ÁGUA. O que eu bebo? (ÁGUA/LEITE/SUCO)
        correctAnswer: ÁGUA
        rationale: "Releia a informação: "EU BEBO ÁGUA." — resposta: ÁGUA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU AMO MAMÃE. Quem eu amo? (MAMÃE/PAPAI/VOVÓ)
        correctAnswer: MAMÃE
        rationale: "Releia a informação: "EU AMO MAMÃE." — resposta: MAMÃE."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU VEJO A LUA. O que eu vejo? (LUA/SOL/ESTRELA)
