title: Frases Simples - Eu
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Frases com pronome 'eu'. Concordância verbo em 1ª pessoa."
example: "Pratique frases simples - eu. Ex.: EU SOU MARIA. Quem é Maria? → EU."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Frases com EU
    description: Leia as frases simples com EU.
    exercises:
      - type: grammar
        question: EU SOU MARIA. Quem é Maria? (ELA/VOCÊ/EU)
        correctAnswer: EU
        rationale: "A frase 'EU SOU MARIA' identifica 'eu' como Maria — a pessoa que fala."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU COMO PÃO. O que eu como? (BOLO/UVA/PÃO)
        correctAnswer: PÃO
        rationale: "A frase diz 'COMO PÃO' — PÃO é o objeto do verbo COMER."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU BEBO ÁGUA. O que eu bebo? (ÁGUA/LEITE/SUCO)
        correctAnswer: ÁGUA
        rationale: "A frase diz 'BEBO ÁGUA' — ÁGUA é o objeto do verbo BEBER."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU AMO MAMÃE. Quem eu amo? (PAPAI/MAMÃE/VOVÓ)
        correctAnswer: MAMÃE
        rationale: "A frase diz 'AMO MAMÃE' — MAMÃE é quem recebe o amor."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: EU VEJO A LUA. O que eu vejo? (ESTRELA/LUA/SOL)
        correctAnswer: LUA
        rationale: "A frase diz 'VEJO A LUA' — LUA é o objeto do verbo VER."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Quantas palavras tem 'EU SOU MARIA'? (2/4/3)
        correctAnswer: 3
        rationale: "Separadas por espaços, há 3 palavras."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Em 'EU COMO', qual é a segunda palavra? (EU/COMO/PÃO)
        correctAnswer: COMO
        rationale: "Em 'EU COMO': EU (1ª) e COMO (2ª) — a segunda palavra é o verbo COMO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: "'EU BEBO' fala sobre o que faço com? (COMIDA/ÁGUA/AR)"
        correctAnswer: ÁGUA
        rationale: "BEBER se usa com líquidos; entre as opções, ÁGUA é o líquido."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Todas as frases começam com? (ELA/EU/NÓS)
        correctAnswer: EU
        rationale: "Todas as frases da página iniciam pelo pronome EU (EU SOU, EU COMO, EU BEBO...)."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: "'EU AMO' expressa um? (ANIMAL/SENTIMENTO/COR)"
        correctAnswer: SENTIMENTO
        rationale: "Compare: AMAR é sentimento (afeto); animal é ser vivo e cor é propriedade visual."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
