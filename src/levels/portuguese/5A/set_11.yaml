title: Palavras que Rimam
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Palavras que rimam. Desenvolve consciência fonológica."
example: "Pratique palavras que rimam. Ex.: O que rima com GATO? → PATO."
pages:
  - pageNumber: 1
    title: Encontrar Rimas
    description: Encontre palavras que rimam.
    exercises:
      - type: grammar
        question: O que rima com GATO? (PATO/CASA/BOLO)
        correctAnswer: PATO
        rationale: "'PATO' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com CASA? (MESA/BOLA/RATO)
        correctAnswer: MESA
        rationale: "'MESA' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com BOLA? (COLA/GATO/PEIXE)
        correctAnswer: COLA
        rationale: "'COLA' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com PEIXE? (DEIXE/CARRO/FLOR)
        correctAnswer: DEIXE
        rationale: "'DEIXE' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com FLOR? (DOR/PAZ/RIO)
        correctAnswer: DOR
        rationale: "'DOR' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: GATO e PATO rimam porque terminam com? (ATO/GAS/PAT)
        correctAnswer: ATO
        rationale: "A resposta correta é 'ATO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: CASA e MESA rimam porque terminam com? (ASA/CAS/ESA)
        correctAnswer: ASA
        rationale: "A resposta correta é 'ASA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual NÃO rima com BELA? (VELA/CASA/TELA)
        correctAnswer: CASA
        rationale: "'CASA' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com SOL? (GOL/LUA/MAR)
        correctAnswer: GOL
        rationale: "'GOL' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: BONITO rima com? (GATITO/VERDE/AZUL)
        correctAnswer: GATITO
        rationale: "'GATITO' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
