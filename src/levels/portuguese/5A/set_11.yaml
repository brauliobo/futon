title: 🎵 Palavras que Rimam
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Palavras que rimam. Desenvolve consciência fonológica."
example: "Pratique palavras que rimam. Ex.: O que rima com GATO? → PATO."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Encontrar Rimas
    description: Encontre palavras que rimam.
    exercises:
      - type: grammar
        question: O que rima com GATO? (CASA/PATO/BOLO)
        correctAnswer: PATO
        rationale: "'PATO' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com CASA? (BOLA/RATO/MESA)
        correctAnswer: MESA
        rationale: "'MESA' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com BOLA? (GATO/PEIXE/COLA)
        correctAnswer: COLA
        rationale: "'COLA' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com PEIXE? (FLOR/CARRO/DEIXE)
        correctAnswer: DEIXE
        rationale: "'DEIXE' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com FLOR? (DOR/RIO/PAZ)
        correctAnswer: DOR
        rationale: "'DOR' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: GATO e PATO rimam porque terminam com? (GAS/PAT/ATO)
        correctAnswer: ATO
        rationale: "Observe a terminação: G-ATO e P-ATO compartilham a terminação ATO — por isso rimam."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: CASA e MESA rimam porque terminam com? (ASA/ESA/CAS)
        correctAnswer: ASA
        rationale: "A rima está na última sílaba tônica + final: CAS-A e MES-A compartilham o som final de /a/ após /s/."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: Qual NÃO rima com BELA? (TELA/VELA/CASA)
        correctAnswer: CASA
        rationale: "'CASA' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: O que rima com SOL? (LUA/GOL/MAR)
        correctAnswer: GOL
        rationale: "'GOL' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
      - type: grammar
        question: BONITO rima com? (VERDE/GATITO/AZUL)
        correctAnswer: GATITO
        rationale: "'GATITO' rima — terminam com o mesmo som."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
