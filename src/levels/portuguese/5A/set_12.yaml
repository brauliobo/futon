title: Leitura Simples - O Gato Mimi
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Leitura de texto curto. Desenvolve fluência e compreensão básica."
example: "Pratique leitura simples - o gato mimi. Ex.: O GATO SE CHAMA MIMI. Qual é o nome do gato? → MIMI."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: História do Gato Mimi
    description: Leia sobre o gato Mimi.
    exercises:
      - type: reading
        question: O GATO SE CHAMA MIMI. Qual é o nome do gato? (FIFI/TOTO/MIMI)
        correctAnswer: MIMI
        rationale: "A frase diz 'O GATO SE CHAMA MIMI' — MIMI é o nome."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MIMI É BRANCO E FOFO. Que cor é MIMI? (BRANCO/CINZA/PRETO)
        correctAnswer: BRANCO
        rationale: "'BRANCO' — cor correto neste contexto."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: ELE GOSTA DE LEITE. O que MIMI gosta? (ÁGUA/RAÇÃO/LEITE)
        correctAnswer: LEITE
        rationale: "A frase diz 'GOSTA DE LEITE' — LEITE é o objeto da preferência."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MIMI DORME NO SOFÁ. Onde MIMI dorme? (SOFÁ/CHÃO/CAMA)
        correctAnswer: SOFÁ
        rationale: "A frase diz 'NO SOFÁ' — é o lugar onde MIMI dorme."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: DE DIA ELE BRINCA. Quando MIMI brinca? (TARDE/DE NOITE/DE DIA)
        correctAnswer: DE DIA
        rationale: "A frase começa com 'DE DIA ELE BRINCA' — é quando MIMI brinca."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantos animais tem na história? (3/1/2)
        correctAnswer: 1
        rationale: "Conte: a história fala apenas do gato MIMI — 1 animal."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MIMI é um? (GATO/CÃO/PÁSSARO)
        correctAnswer: GATO
        rationale: "A primeira frase abre com 'O GATO SE CHAMA MIMI' — MIMI é um GATO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Além de branco, MIMI é? (GRANDE/DURO/FOFO)
        correctAnswer: FOFO
        rationale: "A frase diz 'MIMI É BRANCO E FOFO' — além de branco, é FOFO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MIMI faz o que no sofá? (COME/DORME/CORRE)
        correctAnswer: DORME
        rationale: "A frase 'MIMI DORME NO SOFÁ' diz que a ação no sofá é DORMIR."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A história fala sobre um animal? (TALVEZ/NÃO/SIM)
        correctAnswer: SIM
        rationale: "Note: a história descreve o gato MIMI — sim, fala de um animal."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
