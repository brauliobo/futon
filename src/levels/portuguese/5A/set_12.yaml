title: Leitura Simples - O Gato Mimi
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Leitura de texto curto. Desenvolve fluência e compreensão básica."
example: "Pratique leitura simples - o gato mimi. Ex.: O GATO SE CHAMA MIMI. Qual é o nome do gato? → MIMI."
pages:
  - pageNumber: 1
    title: História do Gato Mimi
    description: Leia sobre o gato Mimi.
    exercises:
      - type: reading
        question: O GATO SE CHAMA MIMI. Qual é o nome do gato? (MIMI/FIFI/TOTO)
        correctAnswer: MIMI
        rationale: "A resposta correta é 'MIMI'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MIMI É BRANCO E FOFO. Que cor é MIMI? (BRANCO/PRETO/CINZA)
        correctAnswer: BRANCO
        rationale: "'BRANCO' — cor correto neste contexto."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: ELE GOSTA DE LEITE. O que MIMI gosta? (LEITE/ÁGUA/RAÇÃO)
        correctAnswer: LEITE
        rationale: "A resposta correta é 'LEITE'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MIMI DORME NO SOFÁ. Onde MIMI dorme? (SOFÁ/CAMA/CHÃO)
        correctAnswer: SOFÁ
        rationale: "A resposta correta é 'SOFÁ'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: DE DIA ELE BRINCA. Quando MIMI brinca? (DE DIA/DE NOITE/TARDE)
        correctAnswer: DE DIA
        rationale: "A resposta correta é 'DE DIA'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantos animais tem na história? (1/2/3)
        correctAnswer: 1
        rationale: "A resposta correta é '1'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MIMI é um? (GATO/CÃO/PÁSSARO)
        correctAnswer: GATO
        rationale: "A resposta correta é 'GATO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Além de branco, MIMI é? (FOFO/DURO/GRANDE)
        correctAnswer: FOFO
        rationale: "A resposta correta é 'FOFO'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MIMI faz o que no sofá? (DORME/COME/CORRE)
        correctAnswer: DORME
        rationale: "A resposta correta é 'DORME'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A história fala sobre um animal? (SIM/NÃO/TALVEZ)
        correctAnswer: SIM
        rationale: "A resposta correta é 'SIM'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
