        correctAnswer: MIMI
        rationale: "Observe as opções e escolha a que responde \"O GATO SE CHAMA MIMI. Qual é o nome do gato?\": 'MIMI'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: MIMI É BRANCO E FOFO. Que cor é MIMI? (BRANCO/PRETO/CINZA)
        correctAnswer: BRANCO
        rationale: "'BRANCO' — cor correto neste contexto."
        difficulty: 1
        objectives: [pt.literacy]
