title: Leitura Simples - A Boneca Ana
level: 5A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Leitura de texto curto. Desenvolve fluência e compreensão básica."
example: "Pratique leitura simples - a boneca ana. Ex.: A BONECA SE CHAMA ANA. Qual é o nome da boneca? → ANA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: História da Boneca Ana
    description: Leia sobre a boneca Ana.
    exercises:
      - type: reading
        question: A BONECA SE CHAMA ANA. Qual é o nome da boneca? (EVA/ANA/IDA)
        correctAnswer: ANA
        rationale: "A frase diz 'A BONECA SE CHAMA ANA' — ANA é o nome."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: ANA TEM CABELO LOIRO. Que cor é o cabelo de ANA? (PRETO/LOIRO/RUIVO)
        correctAnswer: LOIRO
        rationale: "'LOIRO' — cor correto neste contexto."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: ELA USA VESTIDO AZUL. Que cor é o vestido? (AZUL/ROSA/VERDE)
        correctAnswer: AZUL
        rationale: "'AZUL' — cor correto neste contexto."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: ANA É DA MENINA LILA. De quem é ANA? (NINA/LILA/RITA)
        correctAnswer: LILA
        rationale: "A frase diz 'ANA É DA MENINA LILA' — LILA é a dona."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: ELAS BRINCAM JUNTAS. Quem brinca junto? (SÓ LILA/SÓ ANA/ANA E LILA)
        correctAnswer: ANA E LILA
        rationale: "'ELAS' retoma as duas personagens mencionadas — ANA (boneca) e LILA (menina)."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: ANA é uma? (MENINA/ANIMAL/BONECA)
        correctAnswer: BONECA
        rationale: "A primeira frase diz 'A BONECA SE CHAMA ANA' — ANA é uma BONECA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas personagens principais tem? (1/2/3)
        correctAnswer: 2
        rationale: "Conte: a história fala de ANA (boneca) e LILA (menina) — 2 personagens."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: LILA é uma? (MÃE/BONECA/MENINA)
        correctAnswer: MENINA
        rationale: "A frase diz 'A MENINA LILA' — LILA é uma MENINA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O que ANA e LILA fazem? (DORMEM/BRINCAM/ESTUDAM)
        correctAnswer: BRINCAM
        rationale: "A frase diz 'ELAS BRINCAM JUNTAS' — brincar é a ação."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A história fala sobre? (CASA/BRINQUEDO/COMIDA)
        correctAnswer: BRINQUEDO
        rationale: "ANA é uma boneca (brinquedo); a história descreve a boneca e como a menina brinca com ela."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
