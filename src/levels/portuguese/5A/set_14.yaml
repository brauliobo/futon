      - { type: grammar, question: ""MESA tem quantas sílabas? (1/2/3)"", correctAnswer: 2 }
      - { type: grammar, question: ""Como separar MESA? (ME-SA/MES-A/M-ESA)"", correctAnswer: ME-SA }
      - { type: grammar, question: ""LOBO tem quantas sílabas? (1/2/3)"", correctAnswer: 2 }
      - { type: grammar, question: ""Como separar LOBO? (LO-BO/LOB-O/L-OBO)"", correctAnswer: LO-BO }
