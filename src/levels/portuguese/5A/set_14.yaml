      - { type: grammar, question: ""Como separar GATO? (GA-TO/GAT-O/G-ATO)"", correctAnswer: GA-TO }
      - { type: grammar, question: ""Como separar PATO? (PA-TO/PAT-O/P-ATO)"", correctAnswer: PA-TO }
