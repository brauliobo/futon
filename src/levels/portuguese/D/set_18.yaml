title: Clareza e Objetividade
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Clareza e Objetividade. Foque no conceito central do conjunto e nos erros comuns."
example: Escreva de forma direta e compreensível.
pages:
  - pageNumber: 1
    title: Clareza e Objetividade - Parte 1
    description: Pratique escreva de forma direta e compreensível.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre escreva de forma direta e compreensível: A ideia principal é ___"
        correctAnswer: clara
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Clareza e Objetividade - Parte 2
    description: Pratique clareza e objetividade.
    exercises:
      - type: paragraph
        question: "Texto claro é aquele que: (comunica a ideia sem ambiguidade/usa palavras rebuscadas/é muito longo/tem muitas orações subordinadas)"
        correctAnswer: comunica a ideia sem ambiguidade
        rationale: "Clareza = o leitor entende na primeira leitura."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Clareza e Objetividade - Parte 3
    description: Pratique clareza e objetividade.
    exercises:
      - type: paragraph
        question: "Frase objetiva: (A reunião será às 14h/A reunião provavelmente talvez possa ser no horário da tarde/Há de se considerar a possibilidade da reunião/Quiçá haja reunião)"
        correctAnswer: A reunião será às 14h
        rationale: "Objetividade: informação direta, sem rodeios."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Clareza e Objetividade - Parte 4
    description: Pratique clareza e objetividade.
    exercises:
      - type: paragraph
        question: "\"O evento que será realizado na data que foi previamente agendada...\" Problema: (excesso de palavras/falta de pontuação/erro de concordância/falta de acento)"
        correctAnswer: excesso de palavras
        rationale: "Prolixidade dificulta a leitura — prefira frases diretas."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Clareza e Objetividade - Parte 5
    description: Pratique clareza e objetividade.
    exercises:
      - type: paragraph
        question: "Para ser objetivo, evite: (rodeios e redundâncias/dados concretos/frases curtas/verbos na voz ativa)"
        correctAnswer: rodeios e redundâncias
        rationale: "Redundância (\"subir para cima\") e rodeios comprometem a objetividade."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Clareza e Objetividade - Parte 6
    description: Pratique clareza e objetividade.
    exercises:
      - type: paragraph
        question: "Voz ativa torna a frase mais: (direta e clara/passiva/confusa/longa)"
        correctAnswer: direta e clara
        rationale: "\"O aluno escreveu\" (ativa) é mais direto que \"Foi escrito pelo aluno\" (passiva)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Clareza e Objetividade - Parte 7
    description: Pratique clareza e objetividade.
    exercises:
      - type: paragraph
        question: "\"Ele meio que talvez vá.\" Problema de clareza: (imprecisão/concordância/pontuação/ortografia)"
        correctAnswer: imprecisão
        rationale: "\"Meio que talvez\" cria dúvida — seja preciso: \"Ele provavelmente irá\"."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Clareza e Objetividade - Parte 8
    description: Pratique clareza e objetividade.
    exercises:
      - type: paragraph
        question: "Qual frase é mais clara? (O prazo é sexta-feira/O prazo é tipo assim num dia lá/Pretende-se estabelecer prazo breve/O prazo será oportunamente comunicado)"
        correctAnswer: O prazo é sexta-feira
        rationale: "Informação específica e direta = máxima clareza."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Clareza e Objetividade - Parte 9
    description: Pratique clareza e objetividade.
    exercises:
      - type: paragraph
        question: "Texto claro usa preferencialmente: (frases curtas e diretas/orações longas encadeadas/jargão técnico sem explicação/linguagem rebuscada)"
        correctAnswer: frases curtas e diretas
        rationale: "Frases curtas reduzem ambiguidade e facilitam a compreensão."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Clareza e Objetividade - Parte 10
    description: Pratique clareza e objetividade.
    exercises:
      - type: paragraph
        question: "Ambiguidade é quando a frase: (permite mais de uma interpretação/é muito curta/tem erro de ortografia/usa conectivos)"
        correctAnswer: permite mais de uma interpretação
        rationale: "Ambiguidade confunde o leitor — revise para eliminar duplo sentido."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
