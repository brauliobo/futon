title: Tipos de Parágrafos - Descritivo
level: D
subject: portuguese
example: "Use adjetivos e detalhes sensoriais para descrever."
pages:
  - pageNumber: 1
    title: Adjetivos Descritivos
    description: Identifique o melhor adjetivo.
    exercises:
      - { type: reading, question: "O sol é: (quente/triste/barulhento)", correctAnswer: "quente" }
      - { type: reading, question: "A água do mar é: (doce/salgada/amarga)", correctAnswer: "salgada" }
      - { type: reading, question: "Uma flor normalmente é: (cheirosa/ruidosa/pesada)", correctAnswer: "cheirosa" }
      - { type: reading, question: "Um leão é: (forte/frágil/pequeno)", correctAnswer: "forte" }
      - { type: reading, question: "A neve é: (fria/quente/morna)", correctAnswer: "fria" }
      - { type: reading, question: "O mel é: (azedo/doce/salgado)", correctAnswer: "doce" }
      - { type: reading, question: "Uma pedra é: (mole/dura/líquida)", correctAnswer: "dura" }
      - { type: reading, question: "O algodão é: (duro/macio/áspero)", correctAnswer: "macio" }
      - { type: reading, question: "O limão é: (azedo/doce/amargo)", correctAnswer: "azedo" }
      - { type: reading, question: "Um trovão é: (silencioso/barulhento/pequeno)", correctAnswer: "barulhento" }
  - pageNumber: 2
    title: Sentidos (5 sentidos)
    description: Relacione descrição com o sentido.
    exercises:
      - { type: reading, question: "'Vermelho' é: (visão/audição/paladar)", correctAnswer: "visão" }
      - { type: reading, question: "'Música alta' é: (audição/olfato/tato)", correctAnswer: "audição" }
      - { type: reading, question: "'Perfume' é: (visão/olfato/paladar)", correctAnswer: "olfato" }
      - { type: reading, question: "'Doce' é: (audição/paladar/tato)", correctAnswer: "paladar" }
      - { type: reading, question: "'Macio' é: (visão/tato/audição)", correctAnswer: "tato" }
      - { type: reading, question: "'Quente' é: (olfato/tato/visão)", correctAnswer: "tato" }
      - { type: reading, question: "'Amargo' é: (paladar/visão/audição)", correctAnswer: "paladar" }
      - { type: reading, question: "'Brilhante' é: (visão/tato/olfato)", correctAnswer: "visão" }
      - { type: reading, question: "'Silêncio' é: (paladar/audição/visão)", correctAnswer: "audição" }
      - { type: reading, question: "'Áspero' é: (tato/olfato/paladar)", correctAnswer: "tato" }
  - pageNumber: 3
    title: Descrição em Texto
    description: Identifique a melhor descrição.
    exercises:
      - { type: reading, question: "Descrever bem a praia: (mar azul e areia branca/comi um sorvete/ontem fui)", correctAnswer: "mar azul e areia branca" }
      - { type: reading, question: "Descrever uma maçã: (ela caiu/vermelha e doce/depois comi)", correctAnswer: "vermelha e doce" }
      - { type: reading, question: "Descrever um gato: (tem quatro patas/e pulou/fazia sol)", correctAnswer: "tem quatro patas" }
      - { type: reading, question: "Descrever o pôr do sol: (alaranjado e lindo/fiquei com fome/voltei cedo)", correctAnswer: "alaranjado e lindo" }
      - { type: reading, question: "Adjetivo descreve: (ação/substantivo/advérbio)", correctAnswer: "substantivo" }
      - { type: reading, question: "'Grande, vermelho, redondo' descreve: (tomate/verbo/advérbio)", correctAnswer: "tomate" }
      - { type: reading, question: "'Alto e forte' pode descrever: (uma árvore/correr/bem)", correctAnswer: "uma árvore" }
      - { type: reading, question: "Descrição é: (contar ação/pintar com palavras/fazer pergunta)", correctAnswer: "pintar com palavras" }
      - { type: reading, question: "Boa descrição usa: (adjetivos/verbos/números)", correctAnswer: "adjetivos" }
      - { type: reading, question: "O parágrafo descritivo cria: (uma imagem/um problema/uma ação)", correctAnswer: "uma imagem" }
target: 30
