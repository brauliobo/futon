title: Tipos de Parágrafos - Descritivo
level: D
subject: portuguese
example: Use adjetivos e detalhes sensoriais para descrever.
pages:
  - pageNumber: 1
    title: Adjetivos Descritivos
    description: Identifique o melhor adjetivo.
    exercises:
      - type: reading
        question: "O sol é: (quente/triste/barulhento)"
        correctAnswer: quente
        rationale: "Travessão marca fala direta no diálogo."
      - type: reading
        question: "A água do mar é: (doce/salgada/amarga)"
        correctAnswer: salgada
        rationale: "Frase de conclusão retoma e fecha o tema exposto."
      - type: reading
        question: "Uma flor normalmente é: (cheirosa/ruidosa/pesada)"
        correctAnswer: cheirosa
        rationale: "Proparoxítona sempre acentuada."
      - type: reading
        question: "Um leão é: (forte/frágil/pequeno)"
        correctAnswer: forte
        rationale: "Conectivo conclusivo (portanto, logo) fecha raciocínio."
      - type: reading
        question: "A neve é: (fria/quente/morna)"
        correctAnswer: fria
        rationale: "Ponto e vírgula separa orações longas ou itens complexos."
      - type: reading
        question: "O mel é: (azedo/doce/salgado)"
        correctAnswer: doce
        rationale: "Uso de 'mas' opõe; 'mais' indica quantidade/comparação."
      - type: reading
        question: "Uma pedra é: (mole/dura/líquida)"
        correctAnswer: dura
        rationale: "Parágrafo inicia com tópico frasal — ideia central."
      - type: reading
        question: "O algodão é: (duro/macio/áspero)"
        correctAnswer: macio
        rationale: "Ortografia: 'ss' entre vogais tem som de /s/ forte."
      - type: reading
        question: "O limão é: (azedo/doce/amargo)"
        correctAnswer: azedo
        rationale: "Coerência exige progressão lógica entre as ideias."
      - type: reading
        question: "Um trovão é: (silencioso/barulhento/pequeno)"
        correctAnswer: barulhento
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
  - pageNumber: 2
    title: Sentidos (5 sentidos)
    description: Relacione descrição com o sentido.
    exercises:
      - type: reading
        question: "'Vermelho' é: (visão/audição/paladar)"
        correctAnswer: visão
        rationale: "Conectivo temporal ordena eventos (primeiro, depois, finalmente)."
      - type: reading
        question: "'Música alta' é: (audição/olfato/tato)"
        correctAnswer: audição
        rationale: "'A' indica direção, tempo futuro ou objeto indireto."
      - type: reading
        question: "'Perfume' é: (visão/olfato/paladar)"
        correctAnswer: olfato
        rationale: "Vírgula separa itens em enumeração."
      - type: reading
        question: "'Doce' é: (audição/paladar/tato)"
        correctAnswer: paladar
        rationale: "Distinga 'x' e 'ch' consultando a etimologia."
      - type: reading
        question: "'Macio' é: (visão/tato/audição)"
        correctAnswer: tato
        rationale: "Conectivo adversativo (mas, porém) introduz contraste."
      - type: reading
        question: "'Quente' é: (olfato/tato/visão)"
        correctAnswer: tato
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
      - type: reading
        question: "'Amargo' é: (paladar/visão/audição)"
        correctAnswer: paladar
        rationale: "Distinga 'x' e 'ch' consultando a etimologia."
      - type: reading
        question: "'Brilhante' é: (visão/tato/olfato)"
        correctAnswer: visão
        rationale: "Conectivo de causa (porque, pois) explica motivo."
      - type: reading
        question: "'Silêncio' é: (paladar/audição/visão)"
        correctAnswer: audição
        rationale: "Proparoxítona sempre acentuada."
      - type: reading
        question: "'Áspero' é: (tato/olfato/paladar)"
        correctAnswer: tato
        rationale: "Pronome relativo 'que' retoma termo anterior."
  - pageNumber: 3
    title: Descrição em Texto
    description: Identifique a melhor descrição.
    exercises:
      - type: reading
        question: "Descrever bem a praia: (mar azul e areia branca/comi um sorvete/ontem fui)"
        correctAnswer: mar azul e areia branca
        rationale: "'Há' (verbo haver) indica existência ou tempo passado."
      - type: reading
        question: "Descrever uma maçã: (ela caiu/vermelha e doce/depois comi)"
        correctAnswer: vermelha e doce
        rationale: "Frase de conclusão retoma e fecha o tema exposto."
      - type: reading
        question: "Descrever um gato: (tem quatro patas/e pulou/fazia sol)"
        correctAnswer: tem quatro patas
        rationale: "Coesão se faz por conectivos e retomadas pronominais."
      - type: reading
        question: "Descrever o pôr do sol: (alaranjado e lindo/fiquei com fome/voltei cedo)"
        correctAnswer: alaranjado e lindo
        rationale: "Frase de conclusão retoma e fecha o tema exposto."
      - type: reading
        question: "Adjetivo descreve: (ação/substantivo/advérbio)"
        correctAnswer: substantivo
        rationale: "Conectivo adversativo (mas, porém) introduz contraste."
      - type: reading
        question: "'Grande, vermelho, redondo' descreve: (tomate/verbo/advérbio)"
        correctAnswer: tomate
        rationale: "Pronome relativo 'que' retoma termo anterior."
      - type: reading
        question: "'Alto e forte' pode descrever: (uma árvore/correr/bem)"
        correctAnswer: uma árvore
        rationale: "Acento agudo em paroxítona terminada em -l, -n, -r, -x, -ps."
      - type: reading
        question: "Descrição é: (contar ação/pintar com palavras/fazer pergunta)"
        correctAnswer: pintar com palavras
        rationale: "Conectivo de causa (porque, pois) explica motivo."
      - type: reading
        question: "Boa descrição usa: (adjetivos/verbos/números)"
        correctAnswer: adjetivos
        rationale: "Crase ocorre antes de palavra feminina (a + a = à)."
      - type: reading
        question: "O parágrafo descritivo cria: (uma imagem/um problema/uma ação)"
        correctAnswer: uma imagem
        rationale: "Parágrafo inicia com tópico frasal — ideia central."
target: 30
