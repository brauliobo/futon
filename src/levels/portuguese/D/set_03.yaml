title: Tipos de Parágrafos - Descritivo
level: D
subject: portuguese
example: Crie parágrafos descritivos com detalhes sensoriais.
pages:
  - pageNumber: 1
    title: Características Físicas
    description: Descreva como algo se parece.
    exercises:
      - { type: paragraph, question: ""Para descrever uma árvore, qual é mais específico? (grande/gigantesca de 20 metros/bonita/boa)"", correctAnswer: gigantesca de 20 metros }
  - pageNumber: 2
    title: Cores e Formas
    description: Use detalhes visuais na descrição.
    exercises:
      - { type: paragraph, question: ""Melhor descrição de bola: (redonda e vermelha/boa/grande/lisa)"", correctAnswer: redonda e vermelha }
  - pageNumber: 3
    title: Texturas e Sensações
    description: Inclua como algo se sente ao toque.
    exercises:
      - { type: paragraph, question: ""Como descrever tecido: (caro/macio e sedoso/novo/bonito)"", correctAnswer: macio e sedoso }
  - pageNumber: 4
    title: Sons e Ruídos
    description: Adicione elementos auditivos à descrição.
    exercises:
      - { type: paragraph, question: ""Som que caracteriza cidade: (barulhenta/grande/importante/moderna)"", correctAnswer: barulhenta }
  - pageNumber: 5
    title: Cheiros e Aromas
    description: Use o sentido do olfato na descrição.
    exercises:
      - { type: paragraph, question: ""Para descrever padaria: (cara/perfumada/grande/nova)"", correctAnswer: perfumada }
  - pageNumber: 6
    title: Organização Espacial
    description: Descreva seguindo uma ordem lógica.
    exercises:
      - { type: paragraph, question: ""Ordem para descrever casa: (telhado-porta-janela/porta-janela-telhado/janela-telhado-porta/telhado-janela-porta)"", correctAnswer: telhado-janela-porta }
  - pageNumber: 7
    title: Comparações
    description: Use comparações para enriquecer a descrição.
    exercises:
      - { type: paragraph, question: ""Melhor comparação para velocidade: (como o vento/muito rápido/super veloz/rapidíssimo)"", correctAnswer: como o vento }
  - pageNumber: 8
    title: Detalhes Importantes
    description: Selecione características relevantes.
    exercises:
      - { type: paragraph, question: ""Para descrever pessoa, o mais importante: (nome/aparência/idade/personalidade)"", correctAnswer: aparência }
  - pageNumber: 9
    title: Linguagem Precisa
    description: Use palavras específicas e claras.
    exercises:
      - { type: paragraph, question: ""Mais preciso para movimento: (foi/caminhou/andou/se moveu)"", correctAnswer: caminhou }
  - pageNumber: 10
    title: Impressão Geral
    description: Transmita a sensação geral do que se descreve.
    exercises:
      - { type: paragraph, question: ""Para transmitir paz: (O jardim era silencioso e sereno/O jardim era bom/O jardim era grande/O jardim era verde)"", correctAnswer: O jardim era silencioso e sereno }
target: 10
