title: Tipos de Parágrafos - Descritivo
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Tipos de Parágrafos - Descritivo. Foque no conceito central do conjunto e nos erros comuns."
example: "Use adjetivos e detalhes sensoriais para descrever. Ex.: O sol é: → quente."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Adjetivos Descritivos
    description: Identifique o melhor adjetivo.
    exercises:
      - type: reading
        question: "O sol é: (quente/barulhento/triste)"
        correctAnswer: quente
        rationale: "Travessão marca fala direta no diálogo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "A água do mar é: (salgada/amarga/doce)"
        correctAnswer: salgada
        rationale: "Observe as opções e escolha a que responde \"A água do mar é:\": 'salgada'."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Uma flor normalmente é: (pesada/cheirosa/ruidosa)"
        correctAnswer: cheirosa
        rationale: "Proparoxítona sempre acentuada."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Um leão é: (frágil/forte/pequeno)"
        correctAnswer: forte
        rationale: "Conectivo conclusivo (portanto, logo) fecha raciocínio."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "A neve é: (fria/quente/morna)"
        correctAnswer: fria
        rationale: "Ponto e vírgula separa orações longas ou itens complexos."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O mel é: (azedo/doce/salgado)"
        correctAnswer: doce
        rationale: "Observe as opções e escolha a que responde \"O mel é:\": 'doce'."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Uma pedra é: (líquida/mole/dura)"
        correctAnswer: dura
        rationale: "Parágrafo inicia com tópico frasal — ideia central."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O algodão é: (duro/macio/áspero)"
        correctAnswer: macio
        rationale: "Ortografia: 'ss' entre vogais tem som de /s/ forte."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O limão é: (azedo/amargo/doce)"
        correctAnswer: azedo
        rationale: "Coerência exige progressão lógica entre as ideias."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Um trovão é: (silencioso/pequeno/barulhento)"
        correctAnswer: barulhento
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Sentidos (5 sentidos)
    description: Relacione descrição com o sentido.
    exercises:
      - type: reading
        question: "'Vermelho' é: (audição/paladar/visão)"
        correctAnswer: visão
        rationale: "Adjetivo caracteriza ou qualifica o substantivo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Música alta' é: (audição/tato/olfato)"
        correctAnswer: audição
        rationale: "Fato é verificável; opinião é interpretação pessoal."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Perfume' é: (olfato/paladar/visão)"
        correctAnswer: olfato
        rationale: "Fato é verificável; opinião é interpretação pessoal."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Doce' é: (audição/paladar/tato)"
        correctAnswer: paladar
        rationale: "Adjetivo caracteriza ou qualifica o substantivo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Macio' é: (audição/visão/tato)"
        correctAnswer: tato
        rationale: "Adjetivos são essenciais para caracterizar."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Quente' é: (olfato/tato/visão)"
        correctAnswer: tato
        rationale: "Descrição estática retrata sem movimento; dinâmica incorpora ação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Amargo' é: (paladar/visão/audição)"
        correctAnswer: paladar
        rationale: "A ordem pode ir do geral ao específico ou inverso."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Brilhante' é: (visão/olfato/tato)"
        correctAnswer: visão
        rationale: "Fato é verificável; opinião é interpretação pessoal."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Silêncio' é: (visão/audição/paladar)"
        correctAnswer: audição
        rationale: "Os cinco sentidos são visão, audição, tato, paladar e olfato."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Áspero' é: (olfato/paladar/tato)"
        correctAnswer: tato
        rationale: "Boa descrição cria imagem mental precisa."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Descrição em Texto
    description: Identifique a melhor descrição.
    exercises:
      - type: reading
        question: "Descrever bem a praia: (comi um sorvete/mar azul e areia branca/ontem fui)"
        correctAnswer: mar azul e areia branca
        rationale: "'Há' (verbo haver) indica existência ou tempo passado."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Descrever uma maçã: (depois comi/ela caiu/vermelha e doce)"
        correctAnswer: vermelha e doce
        rationale: "Parágrafo descritivo caracteriza ser, objeto ou lugar."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Descrever um gato: (e pulou/fazia sol/tem quatro patas)"
        correctAnswer: tem quatro patas
        rationale: "Coesão se faz por conectivos e retomadas pronominais."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Descrever o pôr do sol: (fiquei com fome/alaranjado e lindo/voltei cedo)"
        correctAnswer: alaranjado e lindo
        rationale: "Descrição usa muitos adjetivos e detalhes sensoriais."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Adjetivo descreve: (advérbio/substantivo/ação)"
        correctAnswer: substantivo
        rationale: "Descrição objetiva retrata o objeto como ele é."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Grande, vermelho, redondo' descreve: (advérbio/verbo/tomate)"
        correctAnswer: tomate
        rationale: "Pronome relativo 'que' retoma termo anterior."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Alto e forte' pode descrever: (uma árvore/correr/bem)"
        correctAnswer: uma árvore
        rationale: "Acento agudo em paroxítona terminada em -l, -n, -r, -x, -ps."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Descrição é: (fazer pergunta/contar ação/pintar com palavras)"
        correctAnswer: pintar com palavras
        rationale: "Descrição subjetiva revela a impressão do observador."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Boa descrição usa: (verbos/números/adjetivos)"
        correctAnswer: adjetivos
        rationale: "Detalhes visuais, sonoros e táteis enriquecem a descrição."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O parágrafo descritivo cria: (uma imagem/um problema/uma ação)"
        correctAnswer: uma imagem
        rationale: "Comparações tornam a descrição mais vívida."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 30
