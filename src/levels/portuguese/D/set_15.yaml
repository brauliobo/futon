title: Transições entre Ideias
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Transições entre Ideias. Foque no conceito central do conjunto e nos erros comuns."
example: "Conecte pensamentos suavemente. Ex.: Complete a frase sobre conecte pensamentos su… → clara."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Transições entre Ideias - Parte 1
    description: Pratique conecte pensamentos suavemente.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre conecte pensamentos suavemente: A ideia principal é ___"
        correctAnswer: clara
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Transições entre Ideias - Parte 2
    description: Pratique transições entre ideias.
    exercises:
      - type: paragraph
        question: "Transição entre parágrafos serve para: (repetir o parágrafo anterior/conectar ideias com fluidez/encerrar o texto/iniciar tema totalmente novo)"
        correctAnswer: conectar ideias com fluidez
        rationale: "Transições criam progressão lógica entre parágrafos."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Transições entre Ideias - Parte 3
    description: Pratique transições entre ideias.
    exercises:
      - type: paragraph
        question: "Qual é conectivo de adição? (portanto/além disso/embora/porém)"
        correctAnswer: além disso
        rationale: "\"Além disso\" acrescenta informação, somando à ideia anterior."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Transições entre Ideias - Parte 4
    description: Pratique transições entre ideias.
    exercises:
      - type: paragraph
        question: "Qual é conectivo de oposição? (além disso/assim/no entanto/por exemplo)"
        correctAnswer: no entanto
        rationale: "\"No entanto\" introduz ideia contrária à anterior."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Transições entre Ideias - Parte 5
    description: Pratique transições entre ideias.
    exercises:
      - type: paragraph
        question: "\"Primeiramente... Em seguida... Por fim...\" Tipo de transição: (adversativa/causal/explicativa/temporal)"
        correctAnswer: temporal
        rationale: "Marcadores de sequência organizam ideias no tempo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Transições entre Ideias - Parte 6
    description: Pratique transições entre ideias.
    exercises:
      - type: paragraph
        question: "Texto sem transições fica: (confuso e fragmentado/elegante/objetivo/formal)"
        correctAnswer: confuso e fragmentado
        rationale: "Sem conectivos, as ideias parecem soltas — falta coesão."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Transições entre Ideias - Parte 7
    description: Pratique transições entre ideias.
    exercises:
      - type: paragraph
        question: "Qual conectivo indica causa? (porque/entretanto/além disso/enfim)"
        correctAnswer: porque
        rationale: "\"Porque\" explica o motivo — é conectivo causal."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Transições entre Ideias - Parte 8
    description: Pratique transições entre ideias.
    exercises:
      - type: paragraph
        question: "Qual conectivo indica consequência? (logo/mas/ou/embora)"
        correctAnswer: logo
        rationale: "\"Logo\" indica resultado — consequência da ideia anterior."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Transições entre Ideias - Parte 9
    description: Pratique transições entre ideias.
    exercises:
      - type: paragraph
        question: "\"A poluição aumenta. ___, a saúde pública piora.\" (Embora/Além disso/Consequentemente/Primeiramente)"
        correctAnswer: Consequentemente
        rationale: "\"Consequentemente\" liga causa (poluição) e efeito (saúde piora)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Transições entre Ideias - Parte 10
    description: Pratique transições entre ideias.
    exercises:
      - type: paragraph
        question: "Usar o mesmo conectivo muitas vezes: (enriquece o texto/não faz diferença/empobrece o texto/é obrigatório)"
        correctAnswer: empobrece o texto
        rationale: "Varie os conectivos para manter a fluência e evitar monotonia."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
