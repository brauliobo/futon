title: Estrutura de Parágrafos - Introdução
level: D
subject: portuguese
example: Identifique e construa parágrafos com estrutura básica.
pages:
  - pageNumber: 1
    title: Tópico Frasal
    description: Identifique a frase principal do parágrafo.
    exercises:
      - type: paragraph
        question: Qual é a ideia principal? 'O verão é quente. As pessoas vão à praia. Todos gostam do sol.' (verão/pessoas/praia/sol)
        correctAnswer: verão
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
  - pageNumber: 2
    title: Detalhes de Apoio
    description: Reconheça frases que dão detalhes sobre o tópico.
    exercises:
      - type: paragraph
        question: Qual frase dá detalhe sobre 'Os cães são leais'? (Eles protegem/Gatos miam/Pássaros voam/Peixes nadam)
        correctAnswer: Eles protegem
        rationale: "Frase interrogativa termina em ponto de interrogação (?)."
  - pageNumber: 3
    title: Sequência Lógica
    description: Organize frases em ordem lógica.
    exercises:
      - type: paragraph
        question: "Ordem correta: A)Acordei B)Tomei banho C)Me vesti D)Saí (A-B-C-D/B-A-C-D/A-C-B-D/D-C-B-A)"
        correctAnswer: A-B-C-D
        rationale: "Sequência lógica: ações seguem ordem temporal ou causal."
  - pageNumber: 4
    title: Conectores Básicos
    description: Use palavras que ligam ideias.
    exercises:
      - type: paragraph
        question: "Complete: João correu ___ chegou atrasado. (mas/e/ou/se)"
        correctAnswer: mas
        rationale: "'Mas' é conjunção adversativa — liga ideias opostas."
  - pageNumber: 5
    title: Conclusão
    description: Identifique a frase que encerra o parágrafo.
    exercises:
      - type: paragraph
        question: Qual conclui melhor o parágrafo sobre escola? (Estudar é bom/A escola acabou/Portanto, educação é importante/Amanhã é sábado)
        correctAnswer: Portanto, educação é importante
        rationale: "A conclusão retoma e encerra as ideias do parágrafo."
  - pageNumber: 6
    title: Coerência
    description: Identifique se o parágrafo faz sentido.
    exercises:
      - type: paragraph
        question: O parágrafo é coerente? 'Gosto de frutas. Maçãs são doces. Meu carro é azul.' (sim/não)
        correctAnswer: não
        rationale: "Coerência exige que todas as frases tratem do mesmo tema."
  - pageNumber: 7
    title: Unidade Temática
    description: Mantenha todas as frases sobre o mesmo assunto.
    exercises:
      - type: paragraph
        question: Qual frase não pertence ao parágrafo sobre animais? (Cães latem/Gatos mianem/Carros buzinem/Pássaros cantam)
        correctAnswer: Carros buzinem
        rationale: "Unidade temática: toda frase deve pertencer ao mesmo assunto."
  - pageNumber: 8
    title: Parágrafo Completo
    description: Reconheça um parágrafo bem estruturado.
    exercises:
      - type: paragraph
        question: Qual está melhor organizado? A)'Gosto de ler. Livros são interessantes. A leitura ensina.' B)'Ler gosto. Interessantes livros. Ensina leitura.' (A/B)
        correctAnswer: A
        rationale: "Um bom parágrafo tem tópico claro, detalhes coerentes e boa ordem."
  - pageNumber: 9
    title: Revisão de Estrutura
    description: Aplique os conceitos aprendidos.
    exercises:
      - type: paragraph
        question: "Um bom parágrafo precisa de: (tópico e detalhes/só detalhes/só tópico/nenhum dos dois)"
        correctAnswer: tópico e detalhes
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
  - pageNumber: 10
    title: Prática Final
    description: Demonstre compreensão da estrutura.
    exercises:
      - type: paragraph
        question: "O melhor parágrafo sobre casa: A)'Casa é lugar de família. Lá nos sentimos seguros. É nosso lar.' B)'Casa família. Seguros lar sentimos.' (A/B)"
        correctAnswer: A
        rationale: "Parágrafo bem construído une tópico e detalhes coerentes."
target: 10
