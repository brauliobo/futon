title: Revisão de Parágrafos
level: D
subject: portuguese
example: Identifique e corrija problemas estruturais.
pages:
  - pageNumber: 1
    title: Revisão de Parágrafos - Parte 1
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre identifique e corrija problemas estruturais: A ideia principal é ___"
        correctAnswer: clara
        rationale: "Parágrafo inicia com tópico frasal — ideia central."
  - pageNumber: 2
    title: Revisão de Parágrafos - Parte 2
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: Qual conecta melhor as ideias? (portanto/talvez/ontem/azul)
        correctAnswer: portanto
        rationale: "'Há' (verbo haver) indica existência ou tempo passado."
  - pageNumber: 3
    title: Revisão de Parágrafos - Parte 3
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Ordem lógica para Identifique e corrija problemas estruturais: A)Introduz B)Desenvolve C)Conclui (A-B-C/B-A-C/C-B-A/A-C-B)"
        correctAnswer: A-B-C
        rationale: "Conectivo temporal ordena eventos (primeiro, depois, finalmente)."
  - pageNumber: 4
    title: Revisão de Parágrafos - Parte 4
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Melhor exemplo para o tópico: (específico e claro/vago/longo/repetitivo)"
        correctAnswer: específico e claro
        rationale: "Parágrafo inicia com tópico frasal — ideia central."
  - pageNumber: 5
    title: Revisão de Parágrafos - Parte 5
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Para manter coerência: todas as frases devem (falar do mesmo assunto/ser longas/ter vírgulas/começar igual)"
        correctAnswer: falar do mesmo assunto
        rationale: "Vírgula separa itens em enumeração."
  - pageNumber: 6
    title: Revisão de Parágrafos - Parte 6
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Palavra que liga causa e efeito: (porque/verde/sempre/talvez)"
        correctAnswer: porque
        rationale: "Conectivo de causa (porque, pois) explica motivo."
  - pageNumber: 7
    title: Revisão de Parágrafos - Parte 7
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Em parágrafo argumentativo o mais importante é: (opinião fundamentada/só opinião/só fatos/nenhuma opinião)"
        correctAnswer: opinião fundamentada
        rationale: "Uso de 'mas' opõe; 'mais' indica quantidade/comparação."
  - pageNumber: 8
    title: Revisão de Parágrafos - Parte 8
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Para evitar repetição, use: (sinônimos/mesmas palavras/palavras difíceis/muitas vírgulas)"
        correctAnswer: sinônimos
        rationale: "Vírgula separa itens em enumeração."
  - pageNumber: 9
    title: Revisão de Parágrafos - Parte 9
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Transição suave entre ideias precisa de: (conectores apropriados/muitas palavras/frases longas/pontuação excessiva)"
        correctAnswer: conectores apropriados
        rationale: "Coesão se faz por conectivos e retomadas pronominais."
  - pageNumber: 10
    title: Revisão de Parágrafos - Parte 10
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Parágrafo bem estruturado tem: (início, meio e fim claros/só início/só fim/só meio)"
        correctAnswer: início
        meio e fim claros: null
        rationale: "Parágrafo inicia com tópico frasal — ideia central."
target: 10
