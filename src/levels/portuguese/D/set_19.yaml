title: Revisão de Parágrafos
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Revisão de Parágrafos. Foque no conceito central do conjunto e nos erros comuns."
example: "Identifique e corrija problemas estruturais. Ex.: Complete a frase sobre identifique e corrija … → clara."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Revisão de Parágrafos - Parte 1
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre identifique e corrija problemas estruturais: A ideia principal é ___"
        correctAnswer: clara
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Revisão de Parágrafos - Parte 2
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Ao revisar um parágrafo, verifique primeiro: (se a ideia central está clara/se está longo/se tem palavras difíceis/quantos parágrafos tem)"
        correctAnswer: se a ideia central está clara
        rationale: "Revisão começa pela macroestrutura — a ideia central é a prioridade."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Revisão de Parágrafos - Parte 3
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Revisão de coesão verifica: (se os conectivos ligam as ideias adequadamente/o tamanho das palavras/a fonte do texto/o número de linhas)"
        correctAnswer: se os conectivos ligam as ideias adequadamente
        rationale: "Coesão = ligação entre frases e parágrafos via conectivos e referências."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Revisão de Parágrafos - Parte 4
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Na revisão, frase fora do tema deve ser: (removida ou reescrita/mantida para preencher espaço/destacada em negrito/movida para a conclusão)"
        correctAnswer: removida ou reescrita
        rationale: "Frase fora do tema quebra a coerência e deve ser eliminada."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Revisão de Parágrafos - Parte 5
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Qual erro é de coerência? (contradição entre frases/falta de acento/vírgula mal posicionada/palavra errada)"
        correctAnswer: contradição entre frases
        rationale: "Coerência exige que as ideias não se contradigam."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Revisão de Parágrafos - Parte 6
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Ler o texto em voz alta ajuda a: (perceber problemas de ritmo e clareza/escrever mais rápido/aumentar o vocabulário/decorar o texto)"
        correctAnswer: perceber problemas de ritmo e clareza
        rationale: "A leitura oral revela frases truncadas e repetições."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Revisão de Parágrafos - Parte 7
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Revisão ortográfica verifica: (acentuação e grafia/coerência temática/organização de parágrafos/argumentação)"
        correctAnswer: acentuação e grafia
        rationale: "Ortografia é revisão de superfície — letras, acentos, hifens."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Revisão de Parágrafos - Parte 8
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Após escrever, o ideal é: (esperar um tempo antes de revisar/enviar imediatamente/não reler/pedir para outro escrever)"
        correctAnswer: esperar um tempo antes de revisar
        rationale: "Distanciamento temporal permite olhar crítico sobre o próprio texto."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Revisão de Parágrafos - Parte 9
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Ao revisar, se uma frase está confusa: (reescreva de forma mais simples/apague o parágrafo inteiro/ignore/acrescente mais palavras)"
        correctAnswer: reescreva de forma mais simples
        rationale: "Simplificar é o caminho para a clareza — menos é mais."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Revisão de Parágrafos - Parte 10
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Checklist de revisão inclui: (coerência, coesão, ortografia e pontuação/apenas ortografia/apenas pontuação/apenas tamanho)"
        correctAnswer: coerência, coesão, ortografia e pontuação
        rationale: "Revisão completa abrange todos os níveis: ideia, ligação, forma."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
