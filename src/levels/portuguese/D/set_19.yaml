title: Revisão de Parágrafos
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Revisão de Parágrafos. Foque no conceito central do conjunto e nos erros comuns."
example: "Identifique e corrija problemas estruturais. Ex.: Revisar um parágrafo envolve? → coesão, coerência e clareza."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Revisão de Parágrafos - Parte 1
    description: Pratique identifique e corrija problemas estruturais.
    exercises:
      - type: paragraph
        question: "Revisar um parágrafo envolve verificar: (apenas a ortografia/apenas o tamanho/coesão, coerência e clareza/apenas o número de palavras)"
        correctAnswer: coesão, coerência e clareza
        rationale: "Revisão vai além da ortografia — avalia se as ideias se conectam (coesão), fazem sentido juntas (coerência) e comunicam com nitidez (clareza)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Revisão de Parágrafos - Parte 2
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Ao revisar um parágrafo, verifique primeiro: (quantos parágrafos compõem o texto/se o parágrafo está longo demais/se a ideia central está clara/se tem palavras pouco usuais)"
        correctAnswer: se a ideia central está clara
        rationale: "Revisão começa pela macroestrutura — a ideia central é a prioridade."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Revisão de Parágrafos - Parte 3
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Revisão de coesão verifica: (a fonte de publicação do texto/o número total de linhas escritas/o tamanho médio das palavras/se os conectivos ligam as ideias adequadamente)"
        correctAnswer: se os conectivos ligam as ideias adequadamente
        rationale: "Coesão = ligação entre frases e parágrafos via conectivos e referências."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Revisão de Parágrafos - Parte 4
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Na revisão, frase fora do tema deve ser: (destacada em negrito/movida para a conclusão/removida ou reescrita/mantida para preencher espaço)"
        correctAnswer: removida ou reescrita
        rationale: "Frase fora do tema quebra a coerência e deve ser eliminada."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Revisão de Parágrafos - Parte 5
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Qual erro é de coerência? (falta de acento gráfico/vírgula em posição errada/palavra com grafia incorreta/contradição entre frases)"
        correctAnswer: contradição entre frases
        rationale: "Coerência exige que as ideias não se contradigam."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Revisão de Parágrafos - Parte 6
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Ler o texto em voz alta ajuda a: (perceber problemas de ritmo e clareza/aumentar o vocabulário do leitor/escrever o próximo texto mais rápido/decorar o texto inteiro)"
        correctAnswer: perceber problemas de ritmo e clareza
        rationale: "A leitura oral revela frases truncadas e repetições."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Revisão de Parágrafos - Parte 7
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Revisão ortográfica verifica: (qualidade da argumentação/organização dos parágrafos/acentuação e grafia das palavras/coerência temática geral)"
        correctAnswer: acentuação e grafia das palavras
        rationale: "Ortografia é revisão de superfície — letras, acentos, hifens."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Revisão de Parágrafos - Parte 8
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Após escrever, o ideal é: (pedir para outra pessoa reescrever/esperar um tempo antes de revisar/enviar imediatamente ao destinatário/não reler o próprio texto)"
        correctAnswer: esperar um tempo antes de revisar
        rationale: "Distanciamento temporal permite olhar crítico sobre o próprio texto."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Revisão de Parágrafos - Parte 9
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Ao revisar, se uma frase está confusa: (apague o parágrafo inteiro do texto/ignore o problema encontrado/acrescente mais palavras à frase/reescreva de forma mais simples)"
        correctAnswer: reescreva de forma mais simples
        rationale: "Simplificar é o caminho para a clareza — menos é mais."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Revisão de Parágrafos - Parte 10
    description: Pratique revisão de parágrafos.
    exercises:
      - type: paragraph
        question: "Checklist de revisão inclui: (apenas o tamanho do texto/apenas erros ortográficos/apenas sinais de pontuação/coerência, coesão, ortografia e pontuação)"
        correctAnswer: coerência, coesão, ortografia e pontuação
        rationale: "Revisão completa abrange todos os níveis: ideia, ligação, forma."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
