    title: Variação Vocabular - Parte 1
    description: Pratique evite repetições desnecessárias de palavras.
    exercises:
      - { type: paragraph, question: ""Complete a frase sobre evite repetições desnecessárias de palavras: A ideia principal é ___"", correctAnswer: clara }
