title: Parágrafos Expositivos
level: D
subject: portuguese
difficulty: 4
objectives: [EF08LP16, EF09LP06]
authorNotes: Estrutura expositiva — definição, classificação, descrição de processo, comparação, exemplificação.
example: "Explique conceitos com clareza e organização. Ex.: Qual objetivo caracteriza um parágrafo exposi… → explicar um conceito com cl…."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Função do Parágrafo Expositivo
    description: Expor é apresentar informação com objetividade, sem defender opinião.
    exercises:
      - type: paragraph
        question: "Qual objetivo caracteriza um parágrafo expositivo? (emocionar o leitor/convencer o leitor/narrar um acontecimento do passado/explicar um conceito com clareza)"
        correctAnswer: explicar um conceito com clareza
        difficulty: 3
        rationale: "Expositivo = explicar com objetividade; convencer é argumentativo, narrar é narrativo, emocionar é lírico."
        objectives: [EF08LP16]
  - pageNumber: 2
    title: Definição
    description: Muitos parágrafos expositivos começam definindo o termo-chave.
    exercises:
      - type: paragraph
        question: "Melhor abertura (definição) de parágrafo sobre fotossíntese: (Plantas são verdes pela clorofila presente nas folhas/Plantas precisam de água ao sol/Fotossíntese: processo de produzir energia da luz/A luz do sol é bonita)"
        correctAnswer: "Fotossíntese: processo de produzir energia da luz"
        difficulty: 3
        rationale: "Definição delimita o conceito: nome + categoria ('é um processo') + características distintivas ('produzem energia a partir da luz')."
        objectives: [EF08LP16]
  - pageNumber: 3
    title: Classificação
    description: Dividir o tema em categorias ajuda a organizar a exposição.
    exercises:
      - type: paragraph
        question: "Qual frase classifica? (Os animais selvagens vivem em florestas, savanas e oceanos pelo mundo inteiro/Gatos dormem dezesseis horas por dia/Os vertebrados dividem-se em mamíferos, aves, répteis, anfíbios e peixes/Eu gosto muito de cães)"
        correctAnswer: Os vertebrados dividem-se em mamíferos, aves, répteis, anfíbios e peixes
        difficulty: 3
        rationale: "Classificar = dividir em categorias. A frase com 'dividem-se em...' organiza os vertebrados em 5 grupos — é a classificação."
        objectives: [EF08LP16]
  - pageNumber: 4
    title: Descrição de Processo
    description: Ao descrever como algo ocorre, use marcadores de sequência.
    exercises:
      - type: paragraph
        question: "Ordem correta para explicar o ciclo da água: A) condensação B) evaporação C) precipitação D) escoamento (B-A-C-D/A-B-C-D/C-A-B-D/D-C-B-A)"
        correctAnswer: B-A-C-D
        difficulty: 4
        rationale: "Ciclo físico: B) evapora → A) condensa em nuvens → C) precipita como chuva → D) escoa para rios/mar."
        objectives: [EF09LP06]
  - pageNumber: 5
    title: Comparação e Contraste
    description: Comparar revela semelhanças; contrastar, diferenças.
    exercises:
      - type: paragraph
        question: "Conectivo que introduz contraste: (por outro lado/além disso/do mesmo modo que/também)"
        correctAnswer: por outro lado
        difficulty: 3
        rationale: "'Por outro lado' marca oposição/contraste; 'além disso' e 'também' somam; 'do mesmo modo' compara."
        objectives: [EF08LP16]
  - pageNumber: 6
    title: Exemplificação
    description: Exemplos tornam conceitos abstratos concretos.
    exercises:
      - type: paragraph
        question: "Expressão que introduz exemplo: (portanto/por exemplo/no entanto, de modo distinto/contudo)"
        correctAnswer: por exemplo
        difficulty: 2
        rationale: "'Por exemplo' introduz caso ilustrativo; 'portanto' conclui; 'no entanto/contudo' contrastam."
        objectives: [EF08LP16]
  - pageNumber: 7
    title: Linguagem Objetiva
    description: A exposição evita juízos de valor e marcas subjetivas.
    exercises:
      - type: paragraph
        question: "Qual frase é mais expositiva? (O Sol é a estrela central do sistema solar/O Sol é maravilhoso e nos enche de alegria/Adoro dias ensolarados de verão na praia/O Sol é o melhor astro de todos os tempos)"
        correctAnswer: O Sol é a estrela central do sistema solar
        difficulty: 3
        rationale: "Expositivo usa linguagem objetiva (fato verificável); 'maravilhoso/adoro/melhor' são juízos subjetivos."
        objectives: [EF08LP16]
  - pageNumber: 8
    title: Causa e Consequência
    description: Relações causais estruturam explicações científicas.
    exercises:
      - type: paragraph
        question: "'As queimadas aumentam a emissão de CO₂; ___ a temperatura global tende a subir.' (entretanto, no mesmo momento/consequentemente/apesar/embora)"
        correctAnswer: consequentemente
        difficulty: 4
        rationale: "'Consequentemente' marca causa→efeito (emissão ↑ ⇒ temperatura ↑); 'entretanto/apesar/embora' indicariam oposição."
        objectives: [EF09LP06]
  - pageNumber: 9
    title: Encerramento Expositivo
    description: A conclusão sintetiza a explicação sem introduzir opinião.
    exercises:
      - type: paragraph
        question: "Melhor fechamento para parágrafo sobre reciclagem: (Em síntese, a reciclagem reduz resíduos e preserva recursos/Reciclar dá muito trabalho especialmente nas casas pequenas sem espaço/Gosto de reciclar no meu bairro/Reciclagem é legal)"
        correctAnswer: Em síntese, a reciclagem reduz resíduos e preserva recursos
        difficulty: 3
        rationale: "'Em síntese' sinaliza conclusão resumindo fatos (expositivo); as demais opções são subjetivas."
        objectives: [EF08LP16]
  - pageNumber: 10
    title: Revisão Integrada
    description: Avalie um parágrafo expositivo completo.
    exercises:
      - type: paragraph
        question: "'A Amazônia é a maior floresta tropical. Abriga espécies e regula o clima. Por exemplo, forma rios voadores. Em síntese, protegê-la preserva o equilíbrio.' Usa: (definição, exemplificação e síntese/só narração/só opinião/só comparação entre biomas diferentes)"
        correctAnswer: definição, exemplificação e síntese
        difficulty: 5
        rationale: "Abre com definição ('é a maior floresta...'), dá exemplo ('Por exemplo...'), fecha com síntese ('Em síntese...')."
        objectives: [EF09LP06]
target: 10
