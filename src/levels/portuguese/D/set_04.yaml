title: Parágrafos Expositivos
level: D
subject: portuguese
difficulty: 4
objectives: [EF08LP16, EF09LP06]
authorNotes: Estrutura expositiva — definição, classificação, descrição de processo, comparação, exemplificação.
example: "Explique conceitos com clareza e organização."
pages:
  - pageNumber: 1
    title: Função do Parágrafo Expositivo
    description: Expor é apresentar informação com objetividade, sem defender opinião.
    exercises:
      - type: paragraph
        question: "Qual objetivo caracteriza um parágrafo expositivo? (explicar um conceito com clareza/convencer o leitor/emocionar o leitor/narrar um acontecimento)"
        correctAnswer: explicar um conceito com clareza
        difficulty: 3
        rationale: "Parágrafo inicia com tópico frasal — ideia central."
        objectives: [EF08LP16]
  - pageNumber: 2
    title: Definição
    description: Muitos parágrafos expositivos começam definindo o termo-chave.
    exercises:
      - type: paragraph
        question: "Melhor frase de definição para abrir um parágrafo sobre fotossíntese: (Fotossíntese é o processo pelo qual plantas produzem energia a partir da luz/As plantas são verdes/A luz é bonita/Plantas precisam de água)"
        correctAnswer: Fotossíntese é o processo pelo qual plantas produzem energia a partir da luz
        difficulty: 3
        rationale: "Tese é a ideia central defendida no texto argumentativo."
        objectives: [EF08LP16]
  - pageNumber: 3
    title: Classificação
    description: Dividir o tema em categorias ajuda a organizar a exposição.
    exercises:
      - type: paragraph
        question: "Qual frase classifica? (Os vertebrados dividem-se em mamíferos, aves, répteis, anfíbios e peixes/Os animais vivem em florestas/Eu gosto de cães/Gatos dormem muito)"
        correctAnswer: Os vertebrados dividem-se em mamíferos, aves, répteis, anfíbios e peixes
        difficulty: 3
        rationale: "Analise a frase e aplique a regra de concordância correta."
        objectives: [EF08LP16]
  - pageNumber: 4
    title: Descrição de Processo
    description: Ao descrever como algo ocorre, use marcadores de sequência.
    exercises:
      - type: paragraph
        question: "Ordem correta para explicar o ciclo da água: A) condensação B) evaporação C) precipitação D) escoamento (B-A-C-D/A-B-C-D/D-C-B-A/C-A-B-D)"
        correctAnswer: B-A-C-D
        difficulty: 4
        rationale: "Sequência lógica: ações seguem ordem temporal ou causal."
        objectives: [EF09LP06]
  - pageNumber: 5
    title: Comparação e Contraste
    description: Comparar revela semelhanças; contrastar, diferenças.
    exercises:
      - type: paragraph
        question: "Conectivo que introduz contraste: (por outro lado/além disso/do mesmo modo/também)"
        correctAnswer: por outro lado
        difficulty: 3
        rationale: "Analise a frase e aplique a regra de concordância correta."
        objectives: [EF08LP16]
  - pageNumber: 6
    title: Exemplificação
    description: Exemplos tornam conceitos abstratos concretos.
    exercises:
      - type: paragraph
        question: "Expressão que introduz exemplo: (por exemplo/no entanto/portanto/contudo)"
        correctAnswer: por exemplo
        difficulty: 2
        rationale: "Parágrafo expositivo apresenta informações e explica ideias."
        objectives: [EF08LP16]
  - pageNumber: 7
    title: Linguagem Objetiva
    description: A exposição evita juízos de valor e marcas subjetivas.
    exercises:
      - type: paragraph
        question: "Qual frase é mais expositiva? (O Sol é a estrela central do sistema solar/O Sol é maravilhoso/Adoro dias ensolarados/O Sol é o melhor astro)"
        correctAnswer: O Sol é a estrela central do sistema solar
        difficulty: 3
        rationale: "Tópico frasal anuncia a ideia principal do parágrafo."
        objectives: [EF08LP16]
  - pageNumber: 8
    title: Causa e Consequência
    description: Relações causais estruturam explicações científicas.
    exercises:
      - type: paragraph
        question: "'As queimadas aumentam a emissão de CO₂; ___ a temperatura global tende a subir.' (consequentemente/entretanto/embora/apesar)"
        correctAnswer: consequentemente
        difficulty: 4
        rationale: "Argumentos e exemplos sustentam o tópico."
        objectives: [EF09LP06]
  - pageNumber: 9
    title: Encerramento Expositivo
    description: A conclusão sintetiza a explicação sem introduzir opinião.
    exercises:
      - type: paragraph
        question: "Melhor fechamento para um parágrafo sobre reciclagem: (Em síntese, a reciclagem reduz resíduos e preserva recursos/Reciclagem é legal/Gosto de reciclar/Reciclar é chato)"
        correctAnswer: Em síntese, a reciclagem reduz resíduos e preserva recursos
        difficulty: 3
        rationale: "Tese é a ideia central defendida no texto argumentativo."
        objectives: [EF08LP16]
  - pageNumber: 10
    title: Revisão Integrada
    description: Avalie um parágrafo expositivo completo.
    exercises:
      - type: paragraph
        question: "'A Amazônia é a maior floresta tropical do planeta. Abriga milhares de espécies e regula o clima. Por exemplo, suas árvores liberam vapor d'água que forma rios voadores. Em síntese, protegê-la é preservar o equilíbrio global.' O parágrafo usa: (definição, exemplificação e síntese/só opinião/só narração/só comparação)"
        correctAnswer: definição, exemplificação e síntese
        difficulty: 5
        rationale: "Tese é a ideia central defendida no texto argumentativo."
        objectives: [EF09LP06]
target: 10
