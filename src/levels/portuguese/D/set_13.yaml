title: Desenvolvimento de Ideias
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Desenvolvimento de Ideias. Foque no conceito central do conjunto e nos erros comuns."
example: "Expanda conceitos com exemplos. Ex.: Desenvolver uma ideia é? → apresentá-la com exemplos e detalhes."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Desenvolvimento de Ideias - Parte 1
    description: Pratique expanda conceitos com exemplos.
    exercises:
      - type: paragraph
        question: "Desenvolver uma ideia em um parágrafo significa: (repeti-la em outras palavras muitas vezes seguidas/mudar para outro tema/apresentá-la com exemplos, dados e detalhes/encurtá-la ao máximo)"
        correctAnswer: apresentá-la com exemplos, dados e detalhes
        rationale: "Desenvolvimento = expandir a ideia central com detalhes, causas ou exemplos concretos; repetir ou resumir não desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Desenvolvimento de Ideias - Parte 2
    description: Pratique desenvolvimento de ideias.
    exercises:
      - type: paragraph
        question: "Desenvolver uma ideia significa: (mudar de assunto a cada frase/repetir a mesma frase com sinônimos/explicar, exemplificar e aprofundar/usar palavras difíceis sem necessidade)"
        correctAnswer: explicar, exemplificar e aprofundar
        rationale: "Desenvolvimento = expandir a ideia central com detalhes e exemplos."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Desenvolvimento de Ideias - Parte 3
    description: Pratique desenvolvimento de ideias.
    exercises:
      - type: paragraph
        question: "Qual recurso ajuda a desenvolver uma ideia? (um exemplo concreto e verificável/uma mudança abrupta de tema no meio/uma repetição literal da frase/o uso constante de gírias)"
        correctAnswer: um exemplo concreto e verificável
        rationale: "Exemplos tornam ideias abstratas compreensíveis e convincentes."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Desenvolvimento de Ideias - Parte 4
    description: Pratique desenvolvimento de ideias.
    exercises:
      - type: paragraph
        question: "\"Ler é importante.\" Para desenvolver, acrescente: (porque amplia o vocabulário e o conhecimento/livros existem em muitas bibliotecas/repita a frase 'ler é importante'/muitas pessoas leem todos os dias sem nunca parar)"
        correctAnswer: porque amplia o vocabulário e o conhecimento
        rationale: "Uma justificativa (\"porque...\") desenvolve a afirmação inicial."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Desenvolvimento de Ideias - Parte 5
    description: Pratique desenvolvimento de ideias.
    exercises:
      - type: paragraph
        question: "Parágrafo com ideia sem desenvolvimento: (A água é essencial. Sem ela, não há vida. O corpo humano é 70% água./A água sustenta ecossistemas inteiros./A água é essencial porque mantém funções vitais./A água é essencial.)"
        correctAnswer: A água é essencial.
        rationale: "Uma frase isolada não desenvolve a ideia — falta explicação ou exemplo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Desenvolvimento de Ideias - Parte 6
    description: Pratique desenvolvimento de ideias.
    exercises:
      - type: paragraph
        question: "Qual conectivo introduz um exemplo? (mas no entanto/por exemplo/embora/portanto)"
        correctAnswer: por exemplo
        rationale: "\"Por exemplo\" sinaliza que um caso concreto ilustrará a ideia."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Desenvolvimento de Ideias - Parte 7
    description: Pratique desenvolvimento de ideias.
    exercises:
      - type: paragraph
        question: "Ao desenvolver, cada frase deve: (repetir a frase anterior com outras palavras/contradizer a frase anterior sem motivo/acrescentar uma informação nova e relevante/mudar para um assunto completamente diferente)"
        correctAnswer: acrescentar uma informação nova e relevante
        rationale: "Cada frase deve progredir, adicionando dados, causas ou exemplos."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Desenvolvimento de Ideias - Parte 8
    description: Pratique desenvolvimento de ideias.
    exercises:
      - type: paragraph
        question: "\"Exercício faz bem à saúde.\" Desenvolvimento adequado: (Exercício faz bem à saúde em geral, dizem/Pessoas fazem exercício/Saúde é importante/Reduz risco de doenças e melhora o humor)"
        correctAnswer: Reduz risco de doenças e melhora o humor
        rationale: "Especifica os benefícios — desenvolve com detalhes concretos."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Desenvolvimento de Ideias - Parte 9
    description: Pratique desenvolvimento de ideias.
    exercises:
      - type: paragraph
        question: "Comparação ajuda a desenvolver porque: (repete a mesma ideia em outras palavras/elimina o tópico central do parágrafo/esclarece diferenças e semelhanças entre ideias/confunde o leitor com excesso de dados longos e complexos)"
        correctAnswer: esclarece diferenças e semelhanças entre ideias
        rationale: "Comparar é um recurso argumentativo que aprofunda a compreensão."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Desenvolvimento de Ideias - Parte 10
    description: Pratique desenvolvimento de ideias.
    exercises:
      - type: paragraph
        question: "Qual NÃO é recurso de desenvolvimento? (citar dados/exemplificar/mudar de assunto abruptamente/explicar causas e motivos profundos)"
        correctAnswer: mudar de assunto abruptamente
        rationale: "Mudar de tema quebra a coerência — não desenvolve a ideia central."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
