title: Conclusões Eficazes
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Conclusões Eficazes. Foque no conceito central do conjunto e nos erros comuns."
example: "Termine parágrafos de forma convincente. Ex.: Complete a frase sobre termine parágrafos de … → clara."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Conclusões Eficazes - Parte 1
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre termine parágrafos de forma convincente: A ideia principal é ___"
        correctAnswer: clara
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Conclusões Eficazes - Parte 2
    description: Pratique conclusões eficazes.
    exercises:
      - type: paragraph
        question: "Uma boa conclusão deve: (introduzir tema novo/repetir o texto inteiro/fazer muitas perguntas/retomar a ideia central e encerrar)"
        correctAnswer: retomar a ideia central e encerrar
        rationale: "A conclusão sintetiza sem introduzir informações novas."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Conclusões Eficazes - Parte 3
    description: Pratique conclusões eficazes.
    exercises:
      - type: paragraph
        question: "Qual expressão inicia uma conclusão? (Em resumo/Primeiramente/Por outro lado/Além disso)"
        correctAnswer: Em resumo
        rationale: "\"Em resumo\", \"portanto\", \"concluindo\" sinalizam fechamento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Conclusões Eficazes - Parte 4
    description: Pratique conclusões eficazes.
    exercises:
      - type: paragraph
        question: "Conclusão que introduz tema novo é: (inadequada/excelente/obrigatória/opcional)"
        correctAnswer: inadequada
        rationale: "A conclusão encerra — temas novos pertencem ao desenvolvimento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Conclusões Eficazes - Parte 5
    description: Pratique conclusões eficazes.
    exercises:
      - type: paragraph
        question: "\"Portanto, investir em educação transforma vidas.\" Essa frase é: (introdução/título/desenvolvimento/conclusão)"
        correctAnswer: conclusão
        rationale: "\"Portanto\" é conectivo conclusivo — sinaliza encerramento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Conclusões Eficazes - Parte 6
    description: Pratique conclusões eficazes.
    exercises:
      - type: paragraph
        question: "Qual NÃO é conectivo de conclusão? (portanto/logo/enfim/entretanto)"
        correctAnswer: entretanto
        rationale: "\"Entretanto\" é adversativo (oposição), não conclusivo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Conclusões Eficazes - Parte 7
    description: Pratique conclusões eficazes.
    exercises:
      - type: paragraph
        question: "Uma conclusão eficaz em texto argumentativo deve: (propor uma solução/ignorar o problema/repetir a introdução inteira/apresentar dados novos)"
        correctAnswer: propor uma solução
        rationale: "No ENEM, a conclusão (proposta de intervenção) apresenta solução concreta."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Conclusões Eficazes - Parte 8
    description: Pratique conclusões eficazes.
    exercises:
      - type: paragraph
        question: "Conclusão muito longa é: (ineficaz/obrigatória/ideal/comum)"
        correctAnswer: ineficaz
        rationale: "Conclusão deve ser concisa — síntese, não reescrita do texto."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Conclusões Eficazes - Parte 9
    description: Pratique conclusões eficazes.
    exercises:
      - type: paragraph
        question: "\"Assim, fica claro que a leitura enriquece.\" Tipo de conclusão: (interrogativa/descritiva/síntese/narrativa)"
        correctAnswer: síntese
        rationale: "\"Assim, fica claro que...\" sintetiza a argumentação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Conclusões Eficazes - Parte 10
    description: Pratique conclusões eficazes.
    exercises:
      - type: paragraph
        question: "Repetir a introdução na conclusão é: (excelente/fraco/inovador/obrigatório)"
        correctAnswer: fraco
        rationale: "Conclusão retoma a ideia, mas com novas palavras e visão ampliada."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
