title: Conclusões Eficazes
level: D
subject: portuguese
example: Termine parágrafos de forma convincente.
pages:
  - pageNumber: 1
    title: Conclusões Eficazes - Parte 1
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Complete a frase sobre termine parágrafos de forma convincente: A ideia principal é ___", correctAnswer: clara }
  - pageNumber: 2
    title: Conclusões Eficazes - Parte 2
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Qual conecta melhor as ideias? (portanto/talvez/ontem/azul)", correctAnswer: portanto }
  - pageNumber: 3
    title: Conclusões Eficazes - Parte 3
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Ordem lógica para Termine parágrafos de forma convincente: A)Introduz B)Desenvolve C)Conclui (A-B-C/B-A-C/C-B-A/A-C-B)", correctAnswer: A-B-C }
  - pageNumber: 4
    title: Conclusões Eficazes - Parte 4
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Melhor exemplo para o tópico: (específico e claro/vago/longo/repetitivo)", correctAnswer: específico e claro }
  - pageNumber: 5
    title: Conclusões Eficazes - Parte 5
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Para manter coerência: todas as frases devem (falar do mesmo assunto/ser longas/ter vírgulas/começar igual)", correctAnswer: falar do mesmo assunto }
  - pageNumber: 6
    title: Conclusões Eficazes - Parte 6
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Palavra que liga causa e efeito: (porque/verde/sempre/talvez)", correctAnswer: porque }
  - pageNumber: 7
    title: Conclusões Eficazes - Parte 7
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Em parágrafo argumentativo o mais importante é: (opinião fundamentada/só opinião/só fatos/nenhuma opinião)", correctAnswer: opinião fundamentada }
  - pageNumber: 8
    title: Conclusões Eficazes - Parte 8
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Para evitar repetição, use: (sinônimos/mesmas palavras/palavras difíceis/muitas vírgulas)", correctAnswer: sinônimos }
  - pageNumber: 9
    title: Conclusões Eficazes - Parte 9
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Transição suave entre ideias precisa de: (conectores apropriados/muitas palavras/frases longas/pontuação excessiva)", correctAnswer: conectores apropriados }
  - pageNumber: 10
    title: Conclusões Eficazes - Parte 10
    description: Pratique termine parágrafos de forma convincente.
    exercises:
      - { type: paragraph, question: "Parágrafo bem estruturado tem: (início, meio e fim claros/só início/só fim/só meio)", correctAnswer: início, meio e fim claros }
target: 10