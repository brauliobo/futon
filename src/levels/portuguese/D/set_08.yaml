title: Conectores de Causa e Efeito
level: D
subject: portuguese
difficulty: 4
objectives: [EF07LP12, EF08LP06]
authorNotes: Conectores causais e conclusivos que ligam motivos às suas consequências.
example: "Use porque, pois, portanto, logo para mostrar causa e efeito. Ex.: 'Perdi o ônibus; ___, cheguei atrasado.' → por isso."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Causa Direta
    description: Conectores que introduzem a causa de algo.
    exercises:
      - type: paragraph
        question: "'Não saí ___ estava chovendo.' (portanto/porque/assim/logo)"
        correctAnswer: porque
        difficulty: 2
        rationale: "'Porque' introduz a causa direta de não sair (a chuva); 'portanto/assim/logo' seriam conclusivos."
        objectives: [EF07LP12]
  - pageNumber: 2
    title: Pois
    description: "'Pois' introduz explicação entre vírgulas em registro formal."
    exercises:
      - type: paragraph
        question: "'Ele venceu, ___ treinou todos os dias.' (porém/contudo/mas/pois)"
        correctAnswer: pois
        difficulty: 3
        rationale: "'Pois' após vírgula explica o motivo da vitória (treino diário); 'mas/porém/contudo' seriam adversativos."
        objectives: [EF08LP06]
  - pageNumber: 3
    title: Já que, Visto que
    description: Causais que situam o motivo como conhecido ou pressuposto.
    exercises:
      - type: paragraph
        question: "'___ o prazo é curto, precisamos acelerar.' (Portanto/Logo/Assim/Já que)"
        correctAnswer: Já que
        difficulty: 4
        rationale: "'Já que' introduz causa pressuposta/conhecida (prazo curto); 'portanto/logo/assim' seriam conclusivos."
        objectives: [EF08LP06]
  - pageNumber: 4
    title: Consequência Direta
    description: Conectores que introduzem o efeito de uma causa.
    exercises:
      - type: paragraph
        question: "'Estudei muito; ___, passei na prova.' (portanto/porque/pois/já que)"
        correctAnswer: portanto
        difficulty: 3
        rationale: "'Portanto' é conclusivo — apresenta o efeito (passar) da causa (estudar); os demais introduziriam causa."
        objectives: [EF07LP12]
  - pageNumber: 5
    title: Logo, Assim
    description: Conclusivos usados em argumentação formal.
    exercises:
      - type: paragraph
        question: "'Ele é honesto; ___, merece confiança.' (já que/porque/pois/logo)"
        correctAnswer: logo
        difficulty: 3
        rationale: "'Logo' é conclusivo formal — da premissa (honesto) decorre a consequência (confiança); 'já que/porque/pois' marcariam causa."
        objectives: [EF08LP06]
  - pageNumber: 6
    title: Por Isso
    description: Expressão coloquial e formal de consequência.
    exercises:
      - type: paragraph
        question: "'Perdi o ônibus; ___, cheguei atrasado.' (mesmo que/apesar de que/por isso/ainda que)"
        correctAnswer: por isso
        difficulty: 3
        rationale: "'Por isso' liga causa (perder o ônibus) ao efeito (chegar atrasado); 'mesmo que/ainda que/apesar de que' seriam concessivos."
        objectives: [EF07LP12]
  - pageNumber: 7
    title: Causa vs Finalidade
    description: Causa explica o porquê; finalidade explica para quê.
    exercises:
      - type: paragraph
        question: "'Estudei ___ passar no exame.' (porque/já que/para/pois)"
        correctAnswer: para
        difficulty: 4
        rationale: "'Para' introduz finalidade (o propósito do estudo); 'porque/pois/já que' indicariam causa, e não objetivo."
        objectives: [EF08LP06]
  - pageNumber: 8
    title: Ordem Causa-Efeito
    description: Em português, causa pode vir antes ou depois do efeito.
    exercises:
      - type: paragraph
        question: "Qual ordem é mais natural em argumentação? (Efeito antes, causa depois/Sem ordem fixa/Só efeito sem causa/Causa antes, efeito depois)"
        correctAnswer: Causa antes, efeito depois
        difficulty: 4
        rationale: "Em argumentação, expõe-se o motivo primeiro e a consequência depois — facilita o leitor seguir o raciocínio causal."
        objectives: [EF08LP06]
  - pageNumber: 9
    title: Encadeamento Longo
    description: Múltiplas causas e efeitos podem se encadear em um parágrafo.
    exercises:
      - type: paragraph
        question: "Qual frase encadeia causa e efeito corretamente? (A chuva forte alagou ruas; portanto, o trânsito parou/A chuva, forte alagou ruas trânsito parou/Chuva forte rua alagou trânsito parou/A chuva forte; alagou ruas portanto o trânsito parou)"
        correctAnswer: A chuva forte alagou ruas; portanto, o trânsito parou
        difficulty: 5
        rationale: "Causa (chuva→alagar) e efeito (trânsito parou) separados por ponto-e-vírgula com 'portanto'; as outras cortam a oração sem coesão."
        objectives: [EF08LP06]
  - pageNumber: 10
    title: Revisão Integrada
    description: Escolha o conector correto para causa ou efeito.
    exercises:
      - type: paragraph
        question: "'Reduziu-se o uso de combustíveis fósseis; ___, a emissão de CO₂ caiu.' (porque/pois/já que/consequentemente)"
        correctAnswer: consequentemente
        difficulty: 4
        rationale: "'Consequentemente' marca o efeito (queda de CO₂) da causa (redução de combustíveis); 'porque/pois/já que' introduziriam causa."
        objectives: [EF08LP06]
target: 10
