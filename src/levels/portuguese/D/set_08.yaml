title: Conectores de Causa e Efeito
level: D
subject: portuguese
example: Ligue causas às suas consequências.
pages:
  - pageNumber: 1
    title: Conectores de Causa e Efeito - Parte 1
    description: Pratique ligue causas às suas consequências.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre ligue causas às suas consequências: A ideia principal é ___"
        correctAnswer: clara
