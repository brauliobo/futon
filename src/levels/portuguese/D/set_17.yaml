title: Organização Temática
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Organização Temática. Foque no conceito central do conjunto e nos erros comuns."
example: "Agrupe ideias relacionadas. Ex.: Complete a frase sobre agrupe ideias relacion… → clara."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Organização Temática - Parte 1
    description: Pratique agrupe ideias relacionadas.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre agrupe ideias relacionadas: A ideia principal é ___"
        correctAnswer: clara
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Organização Temática - Parte 2
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Organizar temas no texto significa: (agrupar ideias relacionadas em parágrafos/escrever tudo junto/misturar assuntos/usar muitas palavras)"
        correctAnswer: agrupar ideias relacionadas em parágrafos
        rationale: "Cada parágrafo deve tratar de um aspecto do tema."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Organização Temática - Parte 3
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Quando mudar de parágrafo? (ao iniciar subtema diferente/a cada frase/nunca/ao usar vírgula)"
        correctAnswer: ao iniciar subtema diferente
        rationale: "Novo parágrafo = nova faceta do tema ou novo argumento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Organização Temática - Parte 4
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Parágrafo que mistura vários assuntos é: (confuso/rico/persuasivo/informativo)"
        correctAnswer: confuso
        rationale: "Coerência exige foco — um assunto por parágrafo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Organização Temática - Parte 5
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Esquema de organização antes de escrever: (ajuda a estruturar ideias/é perda de tempo/prejudica a criatividade/só serve para textos longos)"
        correctAnswer: ajuda a estruturar ideias
        rationale: "Planejar a organização evita incoerência e facilita o desenvolvimento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Organização Temática - Parte 6
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Qual ordem é lógica para texto sobre poluição? (definição → causas → consequências → soluções/soluções → definição → causas/consequências → definição → soluções → causas/causas → soluções → definição → consequências)"
        correctAnswer: definição → causas → consequências → soluções
        rationale: "Do geral ao específico, de causa a efeito — progressão lógica."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Organização Temática - Parte 7
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "O tópico frasal fica geralmente: (no início do parágrafo/no final/no meio/em parágrafo separado)"
        correctAnswer: no início do parágrafo
        rationale: "O tópico frasal abre o parágrafo, anunciando o que será tratado."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Organização Temática - Parte 8
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Informação fora de lugar no texto prejudica: (a coerência/a gramática/o vocabulário/a pontuação)"
        correctAnswer: a coerência
        rationale: "Coerência é a relação lógica entre as partes do texto."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Organização Temática - Parte 9
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Texto bem organizado facilita: (a compreensão do leitor/a escrita do autor/a contagem de palavras/a formatação)"
        correctAnswer: a compreensão do leitor
        rationale: "Organização clara guia o leitor pela argumentação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Organização Temática - Parte 10
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Ao revisar, o que verificar sobre organização? (se cada parágrafo tem foco definido/se o texto é longo/se tem muitas vírgulas/se usa palavras difíceis)"
        correctAnswer: se cada parágrafo tem foco definido
        rationale: "Revisão de organização: cada parágrafo deve ter unidade temática."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
