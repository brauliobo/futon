title: 📝 Organização Temática
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Organização Temática. Foque no conceito central do conjunto e nos erros comuns."
example: "Agrupe ideias relacionadas. Ex.: Organizar tematicamente um texto é? → agrupar frases em torno do mesmo tópico."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Organização Temática - Parte 1
    description: Pratique agrupe ideias relacionadas.
    exercises:
      - type: paragraph
        question: "Organizar tematicamente um texto significa: (agrupar frases em torno do mesmo tópico/alternar temas a cada frase/ordenar alfabeticamente/repetir o parágrafo)"
        correctAnswer: agrupar frases em torno do mesmo tópico
        rationale: "Organização temática reúne num mesmo parágrafo ideias ligadas a um único tópico; alternar temas quebra a coerência."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Organização Temática - Parte 2
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Organizar temas no texto significa: (misturar vários assuntos na mesma frase/agrupar ideias relacionadas em parágrafos/usar muitas palavras rebuscadas/escrever tudo junto sem separação)"
        correctAnswer: agrupar ideias relacionadas em parágrafos
        rationale: "Cada parágrafo deve tratar de um aspecto do tema."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Organização Temática - Parte 3
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Quando mudar de parágrafo? (a cada frase do texto/ao iniciar subtema diferente/ao usar qualquer vírgula/nunca durante o texto)"
        correctAnswer: ao iniciar subtema diferente
        rationale: "Novo parágrafo = nova faceta do tema ou novo argumento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Organização Temática - Parte 4
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Parágrafo que mistura vários assuntos é: (rico e detalhado/persuasivo e forte/informativo e útil/confuso para o leitor)"
        correctAnswer: confuso para o leitor
        rationale: "Coerência exige foco — um assunto por parágrafo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Organização Temática - Parte 5
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Esquema de organização antes de escrever: (prejudica a criatividade do autor/só serve para textos muito longos/ajuda a estruturar ideias/é perda de tempo na redação)"
        correctAnswer: ajuda a estruturar ideias
        rationale: "Planejar a organização evita incoerência e facilita o desenvolvimento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Organização Temática - Parte 6
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Qual ordem é lógica para texto sobre poluição? (soluções → definição → causas/consequências → definição → soluções → causas/causas → soluções → definição → consequências/definição → causas → consequências → soluções)"
        correctAnswer: definição → causas → consequências → soluções
        rationale: "Do geral ao específico, de causa a efeito — progressão lógica."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Organização Temática - Parte 7
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "O tópico frasal fica geralmente: (no meio do parágrafo/em um parágrafo separado/no início do parágrafo/no final do parágrafo)"
        correctAnswer: no início do parágrafo
        rationale: "O tópico frasal abre o parágrafo, anunciando o que será tratado."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Organização Temática - Parte 8
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Informação fora de lugar no texto prejudica: (a coerência geral/a gramática da frase/o vocabulário utilizado/a pontuação correta)"
        correctAnswer: a coerência geral
        rationale: "Coerência é a relação lógica entre as partes do texto."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Organização Temática - Parte 9
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Texto bem organizado facilita: (a formatação visual/a contagem de palavras exatas/a compreensão do leitor/a escrita rápida do autor)"
        correctAnswer: a compreensão do leitor
        rationale: "Organização clara guia o leitor pela argumentação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Organização Temática - Parte 10
    description: Pratique organização temática.
    exercises:
      - type: paragraph
        question: "Ao revisar, o que verificar sobre organização? (se o texto ficou longo demais/se cada parágrafo tem foco definido/se usa palavras pouco comuns/se tem muitas vírgulas no total)"
        correctAnswer: se cada parágrafo tem foco definido
        rationale: "Revisão de organização: cada parágrafo deve ter unidade temática."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
