title: Parágrafos Argumentativos
level: D
subject: portuguese
difficulty: 3
objectives: [EF69LP56, EF08LP07, EF09LP07]
authorNotes: Estrutura tese–argumentos–conclusão, tipos de evidência, contra-argumentação.
example: "Identifique tese, argumentos e conclusão em um parágrafo."
pages:
  - pageNumber: 1
    title: Identificando a Tese
    description: A tese é a opinião principal a ser defendida.
    exercises:
      - type: paragraph
        question: "'A leitura diária melhora o vocabulário, amplia o repertório cultural e estimula o pensamento crítico.' Qual é a tese? (leitura diária traz benefícios/vocabulário é importante/cultura é essencial/pensar é difícil)"
        correctAnswer: leitura diária traz benefícios
        difficulty: 2
        rationale: A tese sintetiza o ponto central; detalhes são argumentos de apoio.
        objectives: [EF69LP56]
  - pageNumber: 2
    title: Tipos de Evidência
    description: Dados, exemplos, citações e analogias sustentam argumentos.
    exercises:
      - type: paragraph
        question: "'Segundo o IBGE, 60% dos brasileiros leem menos de um livro por ano.' Que tipo de evidência é essa? (dado estatístico/exemplo pessoal/opinião/analogia)"
        correctAnswer: dado estatístico
        difficulty: 2
        rationale: Dados estatísticos vêm de instituições e aumentam a credibilidade.
        objectives: [EF08LP07]
  - pageNumber: 3
    title: Argumento Forte vs Fraco
    description: Um argumento forte é verificável e relevante à tese.
    exercises:
      - type: paragraph
        question: "Para defender 'a escola deve oferecer educação financeira', qual argumento é mais forte? (estudos mostram menor endividamento em adultos que aprenderam finanças cedo/meu primo gasta mal/dinheiro é útil/todos gostam de economizar)"
        correctAnswer: estudos mostram menor endividamento em adultos que aprenderam finanças cedo
        difficulty: 3
        rationale: Argumentos baseados em evidência verificável superam opiniões pessoais isoladas.
        objectives: [EF08LP07]
  - pageNumber: 4
    title: Contra-argumentação
    description: Antecipar objeções fortalece a argumentação.
    exercises:
      - type: paragraph
        question: "Qual frase introduz uma contra-argumentação? (Embora alguns defendam o contrário/Portanto/Além disso/Por exemplo)"
        correctAnswer: Embora alguns defendam o contrário
        difficulty: 3
        rationale: Conjunções concessivas como 'embora' sinalizam reconhecimento de oposição.
        objectives: [EF09LP07]
  - pageNumber: 5
    title: Modalizadores
    description: Modalizadores indicam grau de certeza ou obrigação.
    exercises:
      - type: paragraph
        question: "Qual modalizador expressa maior certeza? (certamente/talvez/possivelmente/provavelmente)"
        correctAnswer: certamente
        difficulty: 2
        rationale: "'Certamente' afirma; os demais expressam graus de incerteza."
        objectives: [EF08LP07]
  - pageNumber: 6
    title: Progressão Argumentativa
    description: Os argumentos devem avançar do mais geral ao mais específico ou do mais fraco ao mais forte.
    exercises:
      - type: paragraph
        question: "Ordem mais eficaz: A) argumento principal B) contexto geral C) argumento secundário D) conclusão (B-C-A-D/A-B-C-D/D-C-B-A/C-A-D-B)"
        correctAnswer: B-C-A-D
        difficulty: 4
        rationale: Parte-se do contexto, escalona argumentos (secundário→principal) e fecha com conclusão.
        objectives: [EF09LP07]
  - pageNumber: 7
    title: Refutação
    description: Refutar é apresentar motivos pelos quais uma objeção não se sustenta.
    exercises:
      - type: paragraph
        question: "Objeção: 'Educação financeira na escola tira tempo de matérias essenciais.' Qual refutação é mais eficaz? (Pode ser integrada em matemática, sem carga extra/Não importa o tempo/A escola é longa/Matemática é chata)"
        correctAnswer: Pode ser integrada em matemática, sem carga extra
        difficulty: 4
        rationale: Refutar exige responder ao ponto específico da objeção, não descartá-lo.
        objectives: [EF09LP07]
  - pageNumber: 8
    title: Falácias Comuns
    description: Falácias enfraquecem a argumentação mesmo quando parecem convincentes.
    exercises:
      - type: paragraph
        question: "'Todos os meus amigos acham que essa lei é boa, logo ela é boa.' Que falácia é essa? (apelo à maioria/generalização apressada/ad hominem/falsa causa)"
        correctAnswer: apelo à maioria
        difficulty: 4
        rationale: Apelo à maioria (ad populum) confunde popularidade com verdade.
        objectives: [EF09LP07]
  - pageNumber: 9
    title: Conclusão Argumentativa
    description: A conclusão retoma a tese reforçada pelos argumentos, não introduz novos.
    exercises:
      - type: paragraph
        question: "Melhor conclusão para um parágrafo sobre benefícios da leitura: (Portanto, incentivar a leitura diária é investir em cidadãos mais críticos/A leitura é antiga/Livros custam caro/Meu professor lê muito)"
        correctAnswer: Portanto, incentivar a leitura diária é investir em cidadãos mais críticos
        difficulty: 3
        rationale: A conclusão sintetiza e amplia a tese; novos argumentos ou desvios enfraquecem o texto.
        objectives: [EF09LP07]
  - pageNumber: 10
    title: Revisão Integrada
    description: Avalie um parágrafo argumentativo completo.
    exercises:
      - type: paragraph
        question: "'O uso excessivo de telas prejudica o sono. Pesquisas indicam queda de melatonina após duas horas de luz azul. Ainda que muitos jovens contestem, a qualidade do descanso é mensurável. Reduzir o tempo de tela antes de dormir é, portanto, essencial.' O elemento ausente é: (exemplo prático/tese/evidência/conclusão)"
        correctAnswer: exemplo prático
        difficulty: 5
        rationale: O parágrafo tem tese, evidência, contra-argumento e conclusão, mas falta exemplo concreto.
        objectives: [EF09LP07]
target: 10
