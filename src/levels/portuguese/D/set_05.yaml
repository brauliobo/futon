title: Parágrafos Argumentativos
level: D
subject: portuguese
difficulty: 4
objectives: [EF08LP07, EF09LP07]
authorNotes: Estrutura tese–argumentos–conclusão, tipos de evidência, contra-argumentação.
example: "Identifique tese, argumentos e conclusão em um parágrafo. Ex.: 'A leitura diária melhora o vocabulário, ampl… → leitura diária traz benefícios."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Identificando a Tese
    description: A tese é a opinião principal a ser defendida.
    exercises:
      - type: paragraph
        question: "'A leitura diária melhora o vocabulário, amplia o repertório cultural e estimula o pensamento crítico.' Qual é a tese? (vocabulário é importante/pensar é difícil/leitura diária traz benefícios/cultura é essencial)"
        correctAnswer: leitura diária traz benefícios
        difficulty: 3
        rationale: "Tese é a ideia central defendida no texto argumentativo."
        objectives: [EF08LP07]
  - pageNumber: 2
    title: Tipos de Evidência
    description: Dados, exemplos, citações e analogias sustentam argumentos.
    exercises:
      - type: paragraph
        question: "'Segundo o IBGE, 60% dos brasileiros leem menos de um livro por ano.' Que tipo de evidência é essa? (opinião/exemplo pessoal/dado estatístico/analogia)"
        correctAnswer: dado estatístico
        difficulty: 3
        rationale: "Citação de pesquisa com percentual é dado estatístico, não opinião ou exemplo pessoal."
        objectives: [EF08LP07]
  - pageNumber: 3
    title: Argumento Forte vs Fraco
    description: Um argumento forte é verificável e relevante à tese.
    exercises:
      - type: paragraph
        question: "Para defender 'a escola deve oferecer educação financeira', qual argumento é mais forte? (todos gostam de economizar/dinheiro é útil/meu primo gasta mal/estudos mostram menor endividamento em adultos que aprenderam finanças cedo)"
        correctAnswer: estudos mostram menor endividamento em adultos que aprenderam finanças cedo
        difficulty: 4
        rationale: "Argumento forte = evidência verificável (estudos); os demais são generalização, obviedade ou caso único."
        objectives: [EF08LP07]
  - pageNumber: 4
    title: Contra-argumentação
    description: Antecipar objeções fortalece a argumentação.
    exercises:
      - type: paragraph
        question: "Qual frase introduz uma contra-argumentação? (Por exemplo/Além disso/Portanto/Embora alguns defendam o contrário)"
        correctAnswer: Embora alguns defendam o contrário
        difficulty: 4
        rationale: "'Embora' é conjunção concessiva que admite visão oposta — marca contra-argumento; 'por exemplo' ilustra, 'além disso' soma, 'portanto' conclui."
        objectives: [EF09LP07]
  - pageNumber: 5
    title: Modalizadores
    description: Modalizadores indicam grau de certeza ou obrigação.
    exercises:
      - type: paragraph
        question: "Qual modalizador expressa maior certeza? (certamente/possivelmente/talvez/provavelmente)"
        correctAnswer: certamente
        difficulty: 3
        rationale: "'Certamente' afirma sem dúvida; 'possivelmente/provavelmente/talvez' sinalizam incerteza (probabilidade < 100%)."
        objectives: [EF08LP07]
  - pageNumber: 6
    title: Progressão Argumentativa
    description: Os argumentos devem avançar do mais geral ao mais específico ou do mais fraco ao mais forte.
    exercises:
      - type: paragraph
        question: "Ordem mais eficaz: A) argumento principal B) contexto geral C) argumento secundário D) conclusão (B-C-A-D/A-B-C-D/D-C-B-A/C-A-D-B)"
        correctAnswer: B-C-A-D
        difficulty: 5
        rationale: "Progressão crescente: B) contextualizar → C) secundário → A) principal (clímax) → D) concluir; deixa o argumento mais forte perto da conclusão."
        objectives: [EF09LP07]
  - pageNumber: 7
    title: Refutação
    description: Refutar é apresentar motivos pelos quais uma objeção não se sustenta.
    exercises:
      - type: paragraph
        question: "Objeção: 'Educação financeira na escola tira tempo de matérias essenciais.' Qual refutação é mais eficaz? (Pode ser integrada em matemática, sem carga extra/Não importa o tempo/Matemática é chata/A escola é longa)"
        correctAnswer: Pode ser integrada em matemática, sem carga extra
        difficulty: 5
        rationale: "A refutação mais forte desarma a premissa: se o conteúdo é integrado em matemática, não há conflito de tempo — as outras opções desviam ou desqualificam sem argumentar."
        objectives: [EF09LP07]
  - pageNumber: 8
    title: Falácias Comuns
    description: Falácias enfraquecem a argumentação mesmo quando parecem convincentes.
    exercises:
      - type: paragraph
        question: "'Todos os meus amigos acham que essa lei é boa, logo ela é boa.' Que falácia é essa? (apelo à maioria/falsa causa/ad hominem/generalização apressada)"
        correctAnswer: apelo à maioria
        difficulty: 5
        rationale: "'Apelo à maioria' (ad populum) = afirmar que algo é verdade só porque muitos concordam; a popularidade não prova o mérito."
        objectives: [EF09LP07]
  - pageNumber: 9
    title: Conclusão Argumentativa
    description: A conclusão retoma a tese reforçada pelos argumentos, não introduz novos.
    exercises:
      - type: paragraph
        question: "Melhor conclusão para um parágrafo sobre benefícios da leitura: (Livros custam caro/Meu professor lê muito/Portanto, incentivar a leitura diária é investir em cidadãos mais críticos/A leitura é antiga)"
        correctAnswer: Portanto, incentivar a leitura diária é investir em cidadãos mais críticos
        difficulty: 4
        rationale: "A conclusão retoma e encerra as ideias do parágrafo."
        objectives: [EF09LP07]
  - pageNumber: 10
    title: Revisão Integrada
    description: Avalie um parágrafo argumentativo completo.
    exercises:
      - type: paragraph
        question: "'O uso excessivo de telas prejudica o sono. Pesquisas indicam queda de melatonina após duas horas de luz azul. Ainda que muitos jovens contestem, a qualidade do descanso é mensurável. Reduzir o tempo de tela antes de dormir é, portanto, essencial.' O elemento ausente é: (evidência/exemplo prático/tese/conclusão)"
        correctAnswer: exemplo prático
        difficulty: 5
        rationale: "Tem tese (1ª frase), evidência (pesquisas), contra-argumento (ainda que...) e conclusão (portanto) — falta um caso concreto ilustrativo."
        objectives: [EF09LP07]
target: 10
