title: Conectores de Contraste
level: D
subject: portuguese
difficulty: 4
objectives: [EF07LP12, EF08LP06]
authorNotes: Conectores adversativos e concessivos que marcam oposição ou ressalva entre ideias.
example: "Use palavras como mas, porém, embora, contudo para marcar oposição."
pages:
  - pageNumber: 1
    title: Adversativos Simples
    description: Conectores que ligam ideias opostas no mesmo nível.
    exercises:
      - type: paragraph
        question: "Qual é um conector adversativo? (mas/porque/então/assim)"
        correctAnswer: mas
        difficulty: 3
        rationale: "Conectores articulam ideias — adição, contraste, causa, conclusão."
        objectives: [EF07LP12]
  - pageNumber: 2
    title: Porém, Contudo, Todavia
    description: Sinônimos formais de 'mas' usados entre vírgulas.
    exercises:
      - type: paragraph
        question: "'Ele estudou bastante; ___, não passou no exame.' (contudo/portanto/por isso/pois)"
        correctAnswer: contudo
        difficulty: 4
        rationale: "Conectivos conclusivos (logo, portanto) introduzem consequência."
        objectives: [EF08LP06]
  - pageNumber: 3
    title: Concessivos
    description: Concessivas reconhecem uma ideia oposta antes de avançar.
    exercises:
      - type: paragraph
        question: "'___ chovesse, o jogo ocorreu.' (Embora/Portanto/Porque/Enquanto)"
        correctAnswer: Embora
        difficulty: 5
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        objectives: [EF08LP06]
  - pageNumber: 4
    title: Apesar de, Ainda que
    description: Concessivas adicionais para indicar contraste amortecido.
    exercises:
      - type: paragraph
        question: "'___ o custo alto, a viagem valeu a pena.' (Apesar do/Porque do/Assim do/Logo do)"
        correctAnswer: Apesar do
        difficulty: 4
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        objectives: [EF07LP12]
  - pageNumber: 5
    title: Por Outro Lado
    description: Expressão que introduz um segundo ponto de vista.
    exercises:
      - type: paragraph
        question: "'A cidade cresceu rápido. ___, o trânsito piorou.' (Por outro lado/Assim/Portanto/Logo)"
        correctAnswer: Por outro lado
        difficulty: 4
        rationale: "Conectores de contraste opõem ideias."
        objectives: [EF08LP06]
  - pageNumber: 6
    title: No Entanto
    description: "'No entanto' substitui 'mas' em registro mais elaborado."
    exercises:
      - type: paragraph
        question: "Qual frase usa 'no entanto' corretamente? (Trabalhou muito; no entanto, não foi promovido/No entanto trabalhou muito/Foi promovido no entanto/Trabalhou no entanto muito)"
        correctAnswer: Trabalhou muito; no entanto, não foi promovido
        difficulty: 5
        rationale: "Conectivo adversativo (mas, porém) introduz contraste."
        objectives: [EF08LP06]
  - pageNumber: 7
    title: Adversativo vs Concessivo
    description: Adversativos mostram oposição direta; concessivos amortecem-na.
    exercises:
      - type: paragraph
        question: "'Ele é jovem, mas tem experiência.' A relação é: (adversativa/concessiva/causal/conclusiva)"
        correctAnswer: adversativa
        difficulty: 5
        rationale: "A conclusão retoma e encerra as ideias do parágrafo."
        objectives: [EF08LP06]
  - pageNumber: 8
    title: Reforço do Contraste
    description: Combine conectores e advérbios para reforçar contraste.
    exercises:
      - type: paragraph
        question: "'É caro; ___, vale a pena.' (ainda assim/do mesmo modo/portanto/além disso)"
        correctAnswer: ainda assim
        difficulty: 5
        rationale: "'Mas', 'porém', 'contudo', 'todavia' marcam oposição."
        objectives: [EF08LP06]
  - pageNumber: 9
    title: Pontuação em Contraste
    description: Adversativos pedem vírgula ou ponto e vírgula para separar orações.
    exercises:
      - type: paragraph
        question: "Pontuação correta: (Estudei, porém não passei/Estudei porém, não passei/Estudei porém não passei/Estudei; porém não, passei)"
        correctAnswer: Estudei, porém não passei
        difficulty: 4
        rationale: "'Entretanto', 'no entanto' sinalizam contraste."
        objectives: [EF07LP12]
  - pageNumber: 10
    title: Revisão Integrada
    description: Escolha o conector mais preciso para o contexto.
    exercises:
      - type: paragraph
        question: "'A proposta é ambiciosa; ___, falta orçamento para executá-la.' (no entanto/portanto/assim/logo)"
        correctAnswer: no entanto
        difficulty: 5
        rationale: "'Apesar de', 'embora', 'ainda que' indicam concessão."
        objectives: [EF08LP06]
target: 10
