title: Concordância em Parágrafos
level: D
subject: portuguese
difficulty: 3
objectives: [EF07LP08, EF08LP05, EF09LP08]
authorNotes: Concordância verbal e nominal, referência pronominal e consistência de tempo/pessoa ao longo do parágrafo.
example: "Mantenha concordância e referência consistentes entre as frases."
pages:
  - pageNumber: 1
    title: Concordância Verbal
    description: O verbo concorda em número e pessoa com o sujeito.
    exercises:
      - type: paragraph
        question: "'Os alunos ___ à biblioteca todas as quartas.' (vão/vai/ia/iriam)"
        correctAnswer: vão
        difficulty: 2
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
        objectives: [EF07LP08]
  - pageNumber: 2
    title: Concordância Nominal
    description: Adjetivos e determinantes concordam em gênero e número com o substantivo.
    exercises:
      - type: paragraph
        question: "'As paisagens ___ do litoral encantam os visitantes.' (belas/belos/bela/belo)"
        correctAnswer: belas
        difficulty: 2
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
        objectives: [EF07LP08]
  - pageNumber: 3
    title: Sujeito Composto
    description: Sujeito composto antes do verbo geralmente pede verbo no plural.
    exercises:
      - type: paragraph
        question: "'Ana e Pedro ___ ao parque ontem.' (foram/foi/iria/iam)"
        correctAnswer: foram
        difficulty: 2
        rationale: "'Há' (verbo haver) indica existência ou tempo passado."
        objectives: [EF07LP08]
  - pageNumber: 4
    title: Referência Pronominal
    description: O pronome deve retomar um antecedente claro.
    exercises:
      - type: paragraph
        question: "'A professora conversou com a aluna porque ___ estava preocupada.' O pronome correto sem ambiguidade é: (esta/aquela/ela/lhe)"
        correctAnswer: esta
        difficulty: 3
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
        objectives: [EF08LP05]
  - pageNumber: 5
    title: Consistência de Tempo Verbal
    description: Dentro do parágrafo, mantenha o tempo verbal coerente com o recorte temporal.
    exercises:
      - type: paragraph
        question: "'Ontem, fomos à praia. Nadamos, brincamos na areia e ___ para casa felizes.' (voltamos/voltaremos/voltávamos/voltaríamos)"
        correctAnswer: voltamos
        difficulty: 2
        rationale: "'Há' (verbo haver) indica existência ou tempo passado."
        objectives: [EF08LP05]
  - pageNumber: 6
    title: Consistência de Pessoa
    description: Não alterne pessoas gramaticais sem motivo dentro do parágrafo.
    exercises:
      - type: paragraph
        question: "'Quando estudamos com foco, aprendemos mais. Por isso, ___ manter uma rotina.' (devemos/devem/deve/devia)"
        correctAnswer: devemos
        difficulty: 3
        rationale: "Uso de 'mas' opõe; 'mais' indica quantidade/comparação."
        objectives: [EF08LP05]
  - pageNumber: 7
    title: Concordância com Coletivos
    description: Substantivos coletivos pedem verbo no singular, salvo especificação.
    exercises:
      - type: paragraph
        question: "'A multidão ___ pela rua em silêncio.' (caminhava/caminhavam/caminharam/caminharia)"
        correctAnswer: caminhava
        difficulty: 3
        rationale: "Conectivo adversativo (mas, porém) introduz contraste."
        objectives: [EF07LP08]
  - pageNumber: 8
    title: Silepse
    description: Silepse é concordância ideológica, não gramatical.
    exercises:
      - type: paragraph
        question: "'A turma do nono ano ___ animados com a formatura.' Exemplo de silepse de: (número/pessoa/gênero/tempo)"
        correctAnswer: número
        difficulty: 4
        rationale: "Proparoxítona sempre acentuada."
        objectives: [EF09LP08]
  - pageNumber: 9
    title: Paralelismo Sintático
    description: Elementos coordenados devem ter estrutura gramatical semelhante.
    exercises:
      - type: paragraph
        question: "Qual frase mantém paralelismo? (Gosto de ler, escrever e desenhar/Gosto de ler, escrevendo e desenhar/Gosto de leitura, escrever e desenhos/Gosto de lendo, escrevendo e desenhos)"
        correctAnswer: Gosto de ler, escrever e desenhar
        difficulty: 3
        rationale: "Pronome relativo 'que' retoma termo anterior."
        objectives: [EF09LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o erro de concordância no parágrafo.
    exercises:
      - type: paragraph
        question: "'A maioria dos estudantes entregaram o trabalho no prazo. Alguns pediram prorrogação, mas a coordenadora negou.' O problema de concordância está em: (entregaram/pediram/negou/prazo)"
        correctAnswer: entregaram
        difficulty: 5
        rationale: "Uso de 'mas' opõe; 'mais' indica quantidade/comparação."
        objectives: [EF09LP08]
target: 10
