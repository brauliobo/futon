title: ✏️ Concordância em Parágrafos
level: D
subject: portuguese
difficulty: 4
objectives: [EF07LP08, EF08LP05, EF09LP08]
authorNotes: Concordância verbal e nominal, referência pronominal e consistência de tempo/pessoa ao longo do parágrafo.
example: "Mantenha concordância e referência consistentes entre as frases. Ex.: 'Quando estudamos com foco, aprendemos mais. Por isso, ___ manter uma rotina.' → devemos."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Concordância Verbal
    description: O verbo concorda em número e pessoa com o sujeito.
    exercises:
      - type: paragraph
        question: "'Os alunos ___ à biblioteca todas as quartas.' (vão/ia/vai/iriam)"
        correctAnswer: vão
        difficulty: 3
        rationale: "Sujeito plural 'os alunos' pede verbo na 3ª pessoa do plural ('vão'); 'vai' é singular e 'ia/iriam' quebram tempo."
        objectives: [EF07LP08]
  - pageNumber: 2
    title: Concordância Nominal
    description: Adjetivos e determinantes concordam em gênero e número com o substantivo.
    exercises:
      - type: paragraph
        question: "'As paisagens ___ do litoral encantam os visitantes.' (belas/belos/bela/belo)"
        correctAnswer: belas
        difficulty: 3
        rationale: "Adjetivo concorda com 'paisagens' (feminino plural) → 'belas'; 'belos/belo' quebram gênero ou número."
        objectives: [EF07LP08]
  - pageNumber: 3
    title: Sujeito Composto
    description: Sujeito composto antes do verbo geralmente pede verbo no plural.
    exercises:
      - type: paragraph
        question: "'Ana e Pedro ___ ao parque ontem.' (foi/iam/foram/iria)"
        correctAnswer: foram
        difficulty: 3
        rationale: "Sujeito composto 'Ana e Pedro' + passado → 'foram' (3ª plural pretérito); 'foi' é singular e 'iam/iria' trocam o tempo."
        objectives: [EF07LP08]
  - pageNumber: 4
    title: Referência Pronominal
    description: O pronome deve retomar um antecedente claro.
    exercises:
      - type: paragraph
        question: "'A professora conversou com a aluna porque ___ estava preocupada.' O pronome correto sem ambiguidade é: (ela/aquela/esta/lhe)"
        correctAnswer: esta
        difficulty: 4
        rationale: "'Esta' (demonstrativo) refere-se ao antecedente mais próximo — a 'aluna'; 'ela' fica ambíguo entre as duas pessoas citadas."
        objectives: [EF08LP05]
  - pageNumber: 5
    title: Consistência de Tempo Verbal
    description: Dentro do parágrafo, mantenha o tempo verbal coerente com o recorte temporal.
    exercises:
      - type: paragraph
        question: "'Ontem, fomos à praia. Nadamos, brincamos na areia e ___ para casa felizes.' (voltamos/voltaremos/voltávamos/voltaríamos)"
        correctAnswer: voltamos
        difficulty: 3
        rationale: "Consistência temporal: 'fomos/nadamos/brincamos' estão no pretérito perfeito — 'voltamos' mantém; futuro/imperfeito quebrariam o recorte."
        objectives: [EF08LP05]
  - pageNumber: 6
    title: Consistência de Pessoa
    description: Não alterne pessoas gramaticais sem motivo dentro do parágrafo.
    exercises:
      - type: paragraph
        question: "'Quando estudamos com foco, aprendemos mais. Por isso, ___ manter uma rotina.' (devem/devia/devemos/deve)"
        correctAnswer: devemos
        difficulty: 4
        rationale: "'Estudamos/aprendemos' são 1ª pessoa do plural — 'devemos' mantém a pessoa; 'devem/deve/devia' quebram a consistência."
        objectives: [EF08LP05]
  - pageNumber: 7
    title: Concordância com Coletivos
    description: Substantivos coletivos pedem verbo no singular, salvo especificação.
    exercises:
      - type: paragraph
        question: "'A multidão ___ pela rua em silêncio.' (caminhava/caminhavam/caminharam/caminharia)"
        correctAnswer: caminhava
        difficulty: 4
        rationale: "Coletivo 'multidão' é gramaticalmente singular → verbo no singular ('caminhava'); o plural só caberia com especificador ('multidão de pessoas')."
        objectives: [EF07LP08]
  - pageNumber: 8
    title: Silepse
    description: Silepse é concordância ideológica, não gramatical.
    exercises:
      - type: paragraph
        question: "'A turma do nono ano ___ animados com a formatura.' Exemplo de silepse de: (gênero/número/tempo/pessoa)"
        correctAnswer: número
        difficulty: 5
        rationale: "Silepse de número: 'turma' é singular, mas 'animados' concorda com a ideia de plural (vários alunos)."
        objectives: [EF09LP08]
  - pageNumber: 9
    title: Paralelismo Sintático
    description: Elementos coordenados devem ter estrutura gramatical semelhante.
    exercises:
      - type: paragraph
        question: "Qual frase mantém paralelismo? (Gosto de ler, escrever e desenhar/Gosto de leitura, escrever e desenhos/Gosto de ler, escrevendo e desenhar/Gosto de lendo, escrevendo e desenhos)"
        correctAnswer: Gosto de ler, escrever e desenhar
        difficulty: 4
        rationale: "Paralelismo: três infinitivos coordenados (ler, escrever, desenhar); as outras misturam substantivo, gerúndio e infinitivo."
        objectives: [EF09LP08]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique o erro de concordância no parágrafo.
    exercises:
      - type: paragraph
        question: "'A maioria dos estudantes entregaram o trabalho no prazo. Alguns pediram prorrogação, mas a coordenadora negou.' O problema de concordância está em: (negou/pediram/entregaram/prazo)"
        correctAnswer: entregaram
        difficulty: 5
        rationale: "O núcleo do sujeito é 'maioria' (singular); a concordância formal exige 'entregou', não 'entregaram'."
        objectives: [EF09LP08]
target: 10
