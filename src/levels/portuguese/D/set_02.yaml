title: Tipos de Parágrafos - Narrativo
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
example: Identifique elementos de parágrafos narrativos e conectivos.
pages:
  - pageNumber: 1
    title: Sequência Temporal
    description: Use conectivos que indicam tempo.
    exercises:
      - type: reading
        question: Que palavra indica início? (Primeiro/Finalmente/Depois)
        correctAnswer: Primeiro
        rationale: "Conectivo temporal ordena eventos (primeiro, depois, finalmente)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Que palavra indica fim? (Depois/Finalmente/Antes)
        correctAnswer: Finalmente
        rationale: "Dois pontos introduzem enumeração, fala ou explicação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Qual continua uma ação? (Depois/Primeiro/Nunca)
        correctAnswer: Depois
        rationale: "Analise a frase e aplique a regra de concordância correta."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Qual indica simultaneidade? (Enquanto/Depois/Antes)
        correctAnswer: Enquanto
        rationale: "Conectivo temporal ordena eventos (primeiro, depois, finalmente)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Qual indica ação passada? (Ontem/Amanhã/Hoje)
        correctAnswer: Ontem
        rationale: "Analise a frase e aplique a regra de concordância correta."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Conecta eventos em sequência: (e/mas/ou)"
        correctAnswer: e
        rationale: "Sequência lógica: ações seguem ordem temporal ou causal."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Indica contraste: (mas/e/também)"
        correctAnswer: mas
        rationale: "Conectivo adversativo (mas, porém) introduz contraste."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Indica alternativa: (ou/e/porque)"
        correctAnswer: ou
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Indica causa: (porque/também/depois)"
        correctAnswer: porque
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Indica conclusão: (portanto/enquanto/depois)"
        correctAnswer: portanto
        rationale: "A conclusão retoma e encerra as ideias do parágrafo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Elementos da Narrativa
    description: Identifique personagem, cenário e ação.
    exercises:
      - type: reading
        question: Em 'Ana caminhava na praia', quem é o personagem? (Ana/praia/caminhava)
        correctAnswer: Ana
        rationale: "O sujeito responde 'quem pratica a ação'."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Em 'Ana caminhava na praia', onde acontece? (Ana/praia/caminhava)
        correctAnswer: praia
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Em 'Ana caminhava na praia', qual é a ação? (Ana/praia/caminhava)
        correctAnswer: caminhava
        rationale: "Parágrafo narrativo conta um fato com personagens, tempo e lugar."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Pedro comeu bolo' — o personagem é: (Pedro/bolo/comeu)"
        correctAnswer: Pedro
        rationale: "Parágrafo narrativo: introdução, desenvolvimento e desfecho."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'O gato saltou do muro' — a ação é: (gato/saltou/muro)"
        correctAnswer: saltou
        rationale: "Narrativa tem começo, meio e fim."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Na escola estudamos' — o cenário é: (escola/estudamos/Na)"
        correctAnswer: escola
        rationale: "Vírgula separa itens em enumeração."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O personagem principal responde: (o quê/quem/quando)"
        correctAnswer: quem
        rationale: "O sujeito responde 'quem pratica a ação'."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O cenário responde: (o quê/onde/quando)"
        correctAnswer: onde
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "A ação responde: (o quê/onde/quem)"
        correctAnswer: o quê
        rationale: "Enredo é a sequência de acontecimentos."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O tempo responde: (quem/quando/onde)"
        correctAnswer: quando
        rationale: "Cenário é onde a ação acontece."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Ordem Cronológica
    description: Organize eventos em ordem.
    exercises:
      - type: reading
        question: "Ordem: (nascer/crescer/envelhecer)? (certo/errado)"
        correctAnswer: certo
        rationale: "'A' indica direção, tempo futuro ou objeto indireto."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Ordem: (almoço/café/jantar)? (certo/errado)"
        correctAnswer: errado
        rationale: "Personagens são os seres que participam da ação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Ordem correta do dia: (manhã-tarde-noite/noite-manhã-tarde)"
        correctAnswer: manhã-tarde-noite
        rationale: "Sequência lógica: ações seguem ordem temporal ou causal."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Ordem certa: acordar-___-dormir (comer/viajar/cantar)"
        correctAnswer: comer
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Primeiro: plantar-___-colher (regar/vender/cozinhar)"
        correctAnswer: regar
        rationale: "Acento agudo em paroxítona terminada em -l, -n, -r, -x, -ps."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O dia da semana: (segunda/terça/quarta)? próximo: (quinta/domingo)"
        correctAnswer: quinta
        rationale: "Narrador em 1ª pessoa participa da história."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Meses: (janeiro/fevereiro/março)? próximo: (abril/julho)"
        correctAnswer: abril
        rationale: "Narrador em 3ª pessoa observa/descreve de fora."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Verão vem depois de: (primavera/outono/inverno)"
        correctAnswer: primavera
        rationale: "Crase ocorre antes de palavra feminina (a + a = à)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Antes do meio-dia é: (manhã/tarde/noite)"
        correctAnswer: manhã
        rationale: "Ponto e vírgula separa orações longas ou itens complexos."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Depois da noite vem: (madrugada/tarde/manhã)"
        correctAnswer: madrugada
        rationale: "Distinga 'x' e 'ch' consultando a etimologia."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 30
