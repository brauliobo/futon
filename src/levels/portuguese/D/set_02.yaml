title: Tipos de Parágrafos - Narrativo
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Tipos de Parágrafos - Narrativo. Foque no conceito central do conjunto e nos erros comuns."
example: "Identifique elementos de parágrafos narrativos e conectivos. Ex.: 'Na escola estudamos' — o cenário é: → escola."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 36
pages:
  - pageNumber: 1
    title: Sequência Temporal
    description: Use conectivos que indicam tempo.
    exercises:
      - type: reading
        question: Que palavra indica início? (Finalmente/Primeiro/Depois)
        correctAnswer: Primeiro
        rationale: "Conectivo temporal ordena eventos (primeiro, depois, finalmente)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Que palavra indica fim? (Antes/Depois/Finalmente)
        correctAnswer: Finalmente
        rationale: "Dois pontos introduzem enumeração, fala ou explicação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Qual continua uma ação? (Primeiro/Depois/Nunca)
        correctAnswer: Depois
        rationale: "Observe as opções e escolha a que responde \"Qual continua uma ação?\": 'Depois'."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Qual indica simultaneidade? (Depois/Antes/Enquanto)
        correctAnswer: Enquanto
        rationale: "Conectivo temporal ordena eventos (primeiro, depois, finalmente)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Qual indica ação passada? (Amanhã/Hoje/Ontem)
        correctAnswer: Ontem
        rationale: "Observe as opções e escolha a que responde \"Qual indica ação passada?\": 'Ontem'."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Conecta eventos em sequência: (mas/ou/e)"
        correctAnswer: e
        rationale: "Sequência lógica: ações seguem ordem temporal ou causal."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Indica contraste: (também/e/mas)"
        correctAnswer: mas
        rationale: "Conectivo adversativo (mas, porém) introduz contraste."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Indica alternativa: (porque/e/ou)"
        correctAnswer: ou
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Indica causa: (também/porque/depois)"
        correctAnswer: porque
        rationale: "'Porque' (junto) responde; 'por que' (separado) pergunta."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Indica conclusão: (depois/portanto/enquanto)"
        correctAnswer: portanto
        rationale: "A conclusão retoma e encerra as ideias do parágrafo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Elementos da Narrativa
    description: Identifique personagem, cenário e ação.
    exercises:
      - type: reading
        question: Em 'Ana caminhava na praia', quem é o personagem? (Ana/caminhava/praia)
        correctAnswer: Ana
        rationale: "O sujeito responde 'quem pratica a ação'."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Em 'Ana caminhava na praia', onde acontece? (caminhava/Ana/praia)
        correctAnswer: praia
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: Em 'Ana caminhava na praia', qual é a ação? (Ana/praia/caminhava)
        correctAnswer: caminhava
        rationale: "Parágrafo narrativo conta um fato com personagens, tempo e lugar."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Pedro comeu bolo' — o personagem é: (Pedro/comeu/bolo)"
        correctAnswer: Pedro
        rationale: "Parágrafo narrativo: introdução, desenvolvimento e desfecho."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'O gato saltou do muro' — a ação é: (muro/gato/saltou)"
        correctAnswer: saltou
        rationale: "Narrativa tem começo, meio e fim."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "'Na escola estudamos' — o cenário é: (escola/estudamos/Na)"
        correctAnswer: escola
        rationale: "Vírgula separa itens em enumeração."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O personagem principal responde: (o quê/quando/quem)"
        correctAnswer: quem
        rationale: "O sujeito responde 'quem pratica a ação'."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O cenário responde: (quando/onde/o quê)"
        correctAnswer: onde
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "A ação responde: (quem/o quê/onde)"
        correctAnswer: o quê
        rationale: "Enredo é a sequência de acontecimentos."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O tempo responde: (quando/onde/quem)"
        correctAnswer: quando
        rationale: "Cenário é onde a ação acontece."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Ordem Cronológica
    description: Organize eventos em ordem.
    exercises:
      - type: reading
        question: "Ordem: (nascer/crescer/envelhecer)? (certo/errado)"
        correctAnswer: certo
        rationale: "'A' indica direção, tempo futuro ou objeto indireto."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Ordem: (almoço/café/jantar)? (errado/certo)"
        correctAnswer: errado
        rationale: "Personagens são os seres que participam da ação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Ordem correta do dia: (noite-manhã-tarde/manhã-tarde-noite)"
        correctAnswer: manhã-tarde-noite
        rationale: "Sequência lógica: ações seguem ordem temporal ou causal."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Ordem certa: acordar-___-dormir (cantar/comer/viajar)"
        correctAnswer: comer
        rationale: "Ordem canônica da frase: sujeito + verbo + complemento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Primeiro: plantar-___-colher (vender/cozinhar/regar)"
        correctAnswer: regar
        rationale: "Acento agudo em paroxítona terminada em -l, -n, -r, -x, -ps."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "O dia da semana: (segunda/terça/quarta)? próximo: (quinta/domingo)"
        correctAnswer: quinta
        rationale: "Narrador em 1ª pessoa participa da história."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Meses: (janeiro/fevereiro/março)? próximo: (julho/abril)"
        correctAnswer: abril
        rationale: "Narrador em 3ª pessoa observa/descreve de fora."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Verão vem depois de: (outono/inverno/primavera)"
        correctAnswer: primavera
        rationale: "Crase ocorre antes de palavra feminina (a + a = à)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Antes do meio-dia é: (tarde/manhã/noite)"
        correctAnswer: manhã
        rationale: "Ponto e vírgula separa orações longas ou itens complexos."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
      - type: reading
        question: "Depois da noite vem: (madrugada/tarde/manhã)"
        correctAnswer: madrugada
        rationale: "Distinga 'x' e 'ch' consultando a etimologia."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 30
