title: Tipos de Parágrafos - Narrativo
level: D
subject: portuguese
example: Identifique elementos de parágrafos narrativos e conectivos.
pages:
  - pageNumber: 1
    title: Sequência Temporal
    description: Use conectivos que indicam tempo.
    exercises:
      - type: reading
        question: Que palavra indica início? (Primeiro/Finalmente/Depois)
        correctAnswer: Primeiro
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Que palavra indica fim? (Depois/Finalmente/Antes)
        correctAnswer: Finalmente
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Qual continua uma ação? (Depois/Primeiro/Nunca)
        correctAnswer: Depois
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Qual indica simultaneidade? (Enquanto/Depois/Antes)
        correctAnswer: Enquanto
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Qual indica ação passada? (Ontem/Amanhã/Hoje)
        correctAnswer: Ontem
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Conecta eventos em sequência: (e/mas/ou)"
        correctAnswer: e
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Indica contraste: (mas/e/também)"
        correctAnswer: mas
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Indica alternativa: (ou/e/porque)"
        correctAnswer: ou
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Indica causa: (porque/também/depois)"
        correctAnswer: porque
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Indica conclusão: (portanto/enquanto/depois)"
        correctAnswer: portanto
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 2
    title: Elementos da Narrativa
    description: Identifique personagem, cenário e ação.
    exercises:
      - type: reading
        question: Em 'Ana caminhava na praia', quem é o personagem? (Ana/praia/caminhava)
        correctAnswer: Ana
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Em 'Ana caminhava na praia', onde acontece? (Ana/praia/caminhava)
        correctAnswer: praia
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Em 'Ana caminhava na praia', qual é a ação? (Ana/praia/caminhava)
        correctAnswer: caminhava
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "'Pedro comeu bolo' — o personagem é: (Pedro/bolo/comeu)"
        correctAnswer: Pedro
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "'O gato saltou do muro' — a ação é: (gato/saltou/muro)"
        correctAnswer: saltou
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "'Na escola estudamos' — o cenário é: (escola/estudamos/Na)"
        correctAnswer: escola
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "O personagem principal responde: (o quê/quem/quando)"
        correctAnswer: quem
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "O cenário responde: (o quê/onde/quando)"
        correctAnswer: onde
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "A ação responde: (o quê/onde/quem)"
        correctAnswer: o quê
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "O tempo responde: (quem/quando/onde)"
        correctAnswer: quando
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 3
    title: Ordem Cronológica
    description: Organize eventos em ordem.
    exercises:
      - type: reading
        question: "Ordem: (nascer/crescer/envelhecer)? (certo/errado)"
        correctAnswer: certo
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Ordem: (almoço/café/jantar)? (certo/errado)"
        correctAnswer: errado
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Ordem correta do dia: (manhã-tarde-noite/noite-manhã-tarde)"
        correctAnswer: manhã-tarde-noite
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Ordem certa: acordar-___-dormir (comer/viajar/cantar)"
        correctAnswer: comer
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Primeiro: plantar-___-colher (regar/vender/cozinhar)"
        correctAnswer: regar
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "O dia da semana: (segunda/terça/quarta)? próximo: (quinta/domingo)"
        correctAnswer: quinta
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Meses: (janeiro/fevereiro/março)? próximo: (abril/julho)"
        correctAnswer: abril
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Verão vem depois de: (primavera/outono/inverno)"
        correctAnswer: primavera
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Antes do meio-dia é: (manhã/tarde/noite)"
        correctAnswer: manhã
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: "Depois da noite vem: (madrugada/tarde/manhã)"
        correctAnswer: madrugada
        rationale: Reveja o trecho relevante do texto.
target: 30
