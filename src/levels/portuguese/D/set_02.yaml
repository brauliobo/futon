title: Tipos de Parágrafos - Narrativo
level: D
subject: portuguese
example: "Identifique elementos de parágrafos narrativos e conectivos."
pages:
  - pageNumber: 1
    title: Sequência Temporal
    description: Use conectivos que indicam tempo.
    exercises:
      - { type: reading, question: "Que palavra indica início? (Primeiro/Finalmente/Depois)", correctAnswer: "Primeiro" }
      - { type: reading, question: "Que palavra indica fim? (Depois/Finalmente/Antes)", correctAnswer: "Finalmente" }
      - { type: reading, question: "Qual continua uma ação? (Depois/Primeiro/Nunca)", correctAnswer: "Depois" }
      - { type: reading, question: "Qual indica simultaneidade? (Enquanto/Depois/Antes)", correctAnswer: "Enquanto" }
      - { type: reading, question: "Qual indica ação passada? (Ontem/Amanhã/Hoje)", correctAnswer: "Ontem" }
      - { type: reading, question: "Conecta eventos em sequência: (e/mas/ou)", correctAnswer: "e" }
      - { type: reading, question: "Indica contraste: (mas/e/também)", correctAnswer: "mas" }
      - { type: reading, question: "Indica alternativa: (ou/e/porque)", correctAnswer: "ou" }
      - { type: reading, question: "Indica causa: (porque/também/depois)", correctAnswer: "porque" }
      - { type: reading, question: "Indica conclusão: (portanto/enquanto/depois)", correctAnswer: "portanto" }
  - pageNumber: 2
    title: Elementos da Narrativa
    description: Identifique personagem, cenário e ação.
    exercises:
      - { type: reading, question: "Em 'Ana caminhava na praia', quem é o personagem? (Ana/praia/caminhava)", correctAnswer: "Ana" }
      - { type: reading, question: "Em 'Ana caminhava na praia', onde acontece? (Ana/praia/caminhava)", correctAnswer: "praia" }
      - { type: reading, question: "Em 'Ana caminhava na praia', qual é a ação? (Ana/praia/caminhava)", correctAnswer: "caminhava" }
      - { type: reading, question: "'Pedro comeu bolo' — o personagem é: (Pedro/bolo/comeu)", correctAnswer: "Pedro" }
      - { type: reading, question: "'O gato saltou do muro' — a ação é: (gato/saltou/muro)", correctAnswer: "saltou" }
      - { type: reading, question: "'Na escola estudamos' — o cenário é: (escola/estudamos/Na)", correctAnswer: "escola" }
      - { type: reading, question: "O personagem principal responde: (o quê/quem/quando)", correctAnswer: "quem" }
      - { type: reading, question: "O cenário responde: (o quê/onde/quando)", correctAnswer: "onde" }
      - { type: reading, question: "A ação responde: (o quê/onde/quem)", correctAnswer: "o quê" }
      - { type: reading, question: "O tempo responde: (quem/quando/onde)", correctAnswer: "quando" }
  - pageNumber: 3
    title: Ordem Cronológica
    description: Organize eventos em ordem.
    exercises:
      - { type: reading, question: "Ordem: (nascer/crescer/envelhecer)? (certo/errado)", correctAnswer: "certo" }
      - { type: reading, question: "Ordem: (almoço/café/jantar)? (certo/errado)", correctAnswer: "errado" }
      - { type: reading, question: "Ordem correta do dia: (manhã-tarde-noite/noite-manhã-tarde)", correctAnswer: "manhã-tarde-noite" }
      - { type: reading, question: "Ordem certa: acordar-___-dormir (comer/viajar/cantar)", correctAnswer: "comer" }
      - { type: reading, question: "Primeiro: plantar-___-colher (regar/vender/cozinhar)", correctAnswer: "regar" }
      - { type: reading, question: "O dia da semana: (segunda/terça/quarta)? próximo: (quinta/domingo)", correctAnswer: "quinta" }
      - { type: reading, question: "Meses: (janeiro/fevereiro/março)? próximo: (abril/julho)", correctAnswer: "abril" }
      - { type: reading, question: "Verão vem depois de: (primavera/outono/inverno)", correctAnswer: "primavera" }
      - { type: reading, question: "Antes do meio-dia é: (manhã/tarde/noite)", correctAnswer: "manhã" }
      - { type: reading, question: "Depois da noite vem: (madrugada/tarde/manhã)", correctAnswer: "madrugada" }
target: 30
