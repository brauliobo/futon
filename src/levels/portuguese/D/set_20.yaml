title: Síntese Final
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Síntese Final. Foque no conceito central do conjunto e nos erros comuns."
example: Aplique todos os conceitos de construção de parágrafos.
pages:
  - pageNumber: 1
    title: Síntese Final - Parte 1
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre aplique todos os conceitos de construção de parágrafos: A ideia principal é ___"
        correctAnswer: clara
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Síntese Final - Parte 2
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: Qual conecta melhor as ideias? (portanto/talvez/ontem/azul)
        correctAnswer: portanto
        rationale: "Conectivo conclusivo (portanto, logo) fecha raciocínio."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Síntese Final - Parte 3
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Ordem lógica para Aplique todos os conceitos de construção de parágrafos: A)Introduz B)Desenvolve C)Conclui (A-B-C/B-A-C/C-B-A/A-C-B)"
        correctAnswer: A-B-C
        rationale: "A conclusão retoma e encerra as ideias do parágrafo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Síntese Final - Parte 4
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Melhor exemplo para o tópico: (específico e claro/vago/longo/repetitivo)"
        correctAnswer: específico e claro
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Síntese Final - Parte 5
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Para manter coerência: todas as frases devem (falar do mesmo assunto/ser longas/ter vírgulas/começar igual)"
        correctAnswer: falar do mesmo assunto
        rationale: "Coerência exige que todas as frases tratem do mesmo tema."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Síntese Final - Parte 6
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Palavra que liga causa e efeito: (porque/verde/sempre/talvez)"
        correctAnswer: porque
        rationale: "Conectivos de causa (porque, pois) explicam motivo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Síntese Final - Parte 7
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Em parágrafo argumentativo o mais importante é: (opinião fundamentada/só opinião/só fatos/nenhuma opinião)"
        correctAnswer: opinião fundamentada
        rationale: "Opinião expressa ponto de vista pessoal."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Síntese Final - Parte 8
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Para evitar repetição, use: (sinônimos/mesmas palavras/palavras difíceis/muitas vírgulas)"
        correctAnswer: sinônimos
        rationale: "Sinônimos têm significado semelhante."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Síntese Final - Parte 9
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Transição suave entre ideias precisa de: (conectores apropriados/muitas palavras/frases longas/pontuação excessiva)"
        correctAnswer: conectores apropriados
        rationale: "Conectores articulam ideias — adição, contraste, causa, conclusão."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Síntese Final - Parte 10
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Parágrafo bem estruturado tem: (início, meio e fim claros/só início/só fim/só meio)"
        correctAnswer: "início, meio e fim claros"
        rationale: "Distinga 'x' e 'ch' consultando a etimologia."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
