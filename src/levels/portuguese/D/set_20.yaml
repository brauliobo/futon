title: Síntese Final
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Síntese Final. Foque no conceito central do conjunto e nos erros comuns."
example: "Aplique todos os conceitos de construção de parágrafos. Ex.: Complete a frase sobre aplique todos os conce… → clara."
pages:
  - pageNumber: 1
    title: Síntese Final - Parte 1
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre aplique todos os conceitos de construção de parágrafos: A ideia principal é ___"
        correctAnswer: clara
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Síntese Final - Parte 2
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Sintetizar um texto é: (resumir as ideias principais/copiar o texto/ampliar o texto/mudar o tema)"
        correctAnswer: resumir as ideias principais
        rationale: "Síntese = extrair o essencial, eliminando detalhes secundários."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Síntese Final - Parte 3
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Para um bom resumo, identifique: (a ideia principal de cada parágrafo/todas as palavras difíceis/o número de linhas/a fonte do texto)"
        correctAnswer: a ideia principal de cada parágrafo
        rationale: "O tópico frasal de cada parágrafo geralmente contém a ideia central."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Síntese Final - Parte 4
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Ao sintetizar, NÃO inclua: (opiniões pessoais sobre o texto/a ideia principal/informações essenciais/o tema geral)"
        correctAnswer: opiniões pessoais sobre o texto
        rationale: "Síntese reproduz fielmente as ideias do autor, sem acrescentar opinião."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Síntese Final - Parte 5
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Um parágrafo bem construído tem: (unidade temática, desenvolvimento e conclusão/apenas uma frase/muitas citações/repetição de palavras)"
        correctAnswer: unidade temática, desenvolvimento e conclusão
        rationale: "Esses três elementos garantem parágrafo completo e coeso."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Síntese Final - Parte 6
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Qual habilidade de escrita é mais abrangente? (revisão/digitação/decorar regras/copiar textos)"
        correctAnswer: revisão
        rationale: "Revisar exige leitura crítica, conhecimento gramatical e sensibilidade textual."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Síntese Final - Parte 7
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Texto argumentativo completo tem: (tese, argumentos e conclusão com proposta/só opinião/só fatos/só narração)"
        correctAnswer: tese, argumentos e conclusão com proposta
        rationale: "Estrutura clássica do texto dissertativo-argumentativo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Síntese Final - Parte 8
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Coesão e coerência são: (complementares/a mesma coisa/opostas/irrelevantes)"
        correctAnswer: complementares
        rationale: "Coesão liga as partes (forma); coerência liga as ideias (sentido)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Síntese Final - Parte 9
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "O maior desafio na produção textual é: (articular ideias com clareza e coesão/escrever palavras longas/usar caneta/contar linhas)"
        correctAnswer: articular ideias com clareza e coesão
        rationale: "A habilidade central é organizar pensamentos em texto compreensível."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Síntese Final - Parte 10
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Para melhorar a escrita: (leia muito e pratique/evite ler/copie textos prontos/escreva sem revisar)"
        correctAnswer: leia muito e pratique
        rationale: "Leitura amplia repertório; prática desenvolve fluência."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
