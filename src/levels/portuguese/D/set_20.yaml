title: Síntese Final
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Síntese Final. Foque no conceito central do conjunto e nos erros comuns."
example: "Aplique todos os conceitos de construção de parágrafos. Ex.: Parágrafo bem construído reúne? → tópico frasal, desenvolvimento e conclusão."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Síntese Final - Parte 1
    description: Pratique aplique todos os conceitos de construção de parágrafos.
    exercises:
      - type: paragraph
        question: "Um parágrafo bem construído reúne: (tópico frasal, desenvolvimento e conclusão/apenas opiniões pessoais/palavras em ordem alfabética/frases isoladas e sem relação)"
        correctAnswer: tópico frasal, desenvolvimento e conclusão
        rationale: "A estrutura canônica do parágrafo tem três partes: tópico frasal (introduz), desenvolvimento (expande) e conclusão (encerra)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Síntese Final - Parte 2
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Sintetizar um texto é: (copiar o texto/mudar o tema/resumir as ideias principais/ampliar o texto)"
        correctAnswer: resumir as ideias principais
        rationale: "Síntese = extrair o essencial, eliminando detalhes secundários."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Síntese Final - Parte 3
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Para um bom resumo, identifique: (a fonte do texto/o número de linhas/todas as palavras difíceis/a ideia principal de cada parágrafo)"
        correctAnswer: a ideia principal de cada parágrafo
        rationale: "O tópico frasal de cada parágrafo geralmente contém a ideia central."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Síntese Final - Parte 4
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Ao sintetizar, NÃO inclua: (opiniões pessoais sobre o texto/o tema geral/a ideia principal/informações essenciais)"
        correctAnswer: opiniões pessoais sobre o texto
        rationale: "Síntese reproduz fielmente as ideias do autor, sem acrescentar opinião."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Síntese Final - Parte 5
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Um parágrafo bem construído tem: (apenas uma frase/muitas citações/repetição de palavras/unidade temática, desenvolvimento e conclusão)"
        correctAnswer: unidade temática, desenvolvimento e conclusão
        rationale: "Esses três elementos garantem parágrafo completo e coeso."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Síntese Final - Parte 6
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Qual habilidade de escrita é mais abrangente? (digitação/decorar regras/copiar textos/revisão)"
        correctAnswer: revisão
        rationale: "Revisar exige leitura crítica, conhecimento gramatical e sensibilidade textual."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Síntese Final - Parte 7
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Texto argumentativo completo tem: (só fatos/só opinião/tese, argumentos e conclusão com proposta/só narração)"
        correctAnswer: tese, argumentos e conclusão com proposta
        rationale: "Estrutura clássica do texto dissertativo-argumentativo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Síntese Final - Parte 8
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Coesão e coerência são: (irrelevantes/a mesma coisa/complementares/opostas)"
        correctAnswer: complementares
        rationale: "Coesão liga as partes (forma); coerência liga as ideias (sentido)."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Síntese Final - Parte 9
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "O maior desafio na produção textual é: (escrever palavras longas/contar linhas/articular ideias com clareza e coesão/usar caneta)"
        correctAnswer: articular ideias com clareza e coesão
        rationale: "A habilidade central é organizar pensamentos em texto compreensível."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Síntese Final - Parte 10
    description: Pratique síntese final.
    exercises:
      - type: paragraph
        question: "Para melhorar a escrita: (evite ler/leia muito e pratique/escreva sem revisar/copie textos prontos)"
        correctAnswer: leia muito e pratique
        rationale: "Leitura amplia repertório; prática desenvolve fluência."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
