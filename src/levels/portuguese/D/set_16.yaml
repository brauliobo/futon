title: Parágrafos Persuasivos
level: D
subject: portuguese
difficulty: 4
objectives:
  - EM13LP10
  - EM13LP45
authorNotes: "Parágrafos Persuasivos. Foque no conceito central do conjunto e nos erros comuns."
example: "Convença o leitor de um ponto de vista. Ex.: Complete a frase sobre convença o leitor de u… → clara."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Parágrafos Persuasivos - Parte 1
    description: Pratique convença o leitor de um ponto de vista.
    exercises:
      - type: paragraph
        question: "Complete a frase sobre convença o leitor de um ponto de vista: A ideia principal é ___"
        correctAnswer: clara
        rationale: "A ideia principal é o tema central que o parágrafo desenvolve."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 2
    title: Parágrafos Persuasivos - Parte 2
    description: Pratique parágrafos persuasivos.
    exercises:
      - type: paragraph
        question: "Texto persuasivo tem como objetivo: (convencer o leitor/apenas informar/entreter/descrever)"
        correctAnswer: convencer o leitor
        rationale: "Persuadir é fazer o leitor aceitar uma ideia ou agir."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 3
    title: Parágrafos Persuasivos - Parte 3
    description: Pratique parágrafos persuasivos.
    exercises:
      - type: paragraph
        question: "Qual recurso é persuasivo? (argumento com evidência/descrição neutra/narração ficcional/lista de datas)"
        correctAnswer: argumento com evidência
        rationale: "Argumentos sustentados por evidências são o núcleo da persuasão."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 4
    title: Parágrafos Persuasivos - Parte 4
    description: Pratique parágrafos persuasivos.
    exercises:
      - type: paragraph
        question: "\"Dados mostram que 80% aprovam.\" Esse recurso é: (argumento de autoridade/opinião pessoal/metáfora/ironia)"
        correctAnswer: argumento de autoridade
        rationale: "Citar dados de pesquisa confere credibilidade ao argumento."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 5
    title: Parágrafos Persuasivos - Parte 5
    description: Pratique parágrafos persuasivos.
    exercises:
      - type: paragraph
        question: "Qual frase é persuasiva? (É fundamental investir em educação/A escola abriu às 7h/O prédio tem 3 andares/Ontem choveu)"
        correctAnswer: É fundamental investir em educação
        rationale: "\"É fundamental\" expressa juízo de valor — marca posicionamento persuasivo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 6
    title: Parágrafos Persuasivos - Parte 6
    description: Pratique parágrafos persuasivos.
    exercises:
      - type: paragraph
        question: "Em texto persuasivo, o autor deve: (defender um ponto de vista/ser neutro/evitar opiniões/só narrar fatos)"
        correctAnswer: defender um ponto de vista
        rationale: "Persuasão exige posicionamento claro e argumentação consistente."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 7
    title: Parágrafos Persuasivos - Parte 7
    description: Pratique parágrafos persuasivos.
    exercises:
      - type: paragraph
        question: "Contra-argumento serve para: (antecipar e refutar objeções/enfraquecer o texto/mudar de assunto/repetir a tese)"
        correctAnswer: antecipar e refutar objeções
        rationale: "Rebater objeções fortalece a argumentação."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 8
    title: Parágrafos Persuasivos - Parte 8
    description: Pratique parágrafos persuasivos.
    exercises:
      - type: paragraph
        question: "Qual NÃO é estratégia persuasiva? (inventar dados/citar especialistas/usar estatísticas/apresentar exemplos)"
        correctAnswer: inventar dados
        rationale: "Dados inventados destroem a credibilidade — ética é essencial na persuasão."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 9
    title: Parágrafos Persuasivos - Parte 9
    description: Pratique parágrafos persuasivos.
    exercises:
      - type: paragraph
        question: "\"Portanto, medidas urgentes são necessárias.\" Função no texto: (proposta de ação/descrição/narração/definição)"
        correctAnswer: proposta de ação
        rationale: "Propor ação concreta na conclusão reforça o caráter persuasivo."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
  - pageNumber: 10
    title: Parágrafos Persuasivos - Parte 10
    description: Pratique parágrafos persuasivos.
    exercises:
      - type: paragraph
        question: "Apelo emocional em texto persuasivo deve ser: (equilibrado com argumentos racionais/o único recurso/evitado sempre/exagerado)"
        correctAnswer: equilibrado com argumentos racionais
        rationale: "Emoção sem razão é manipulação — o equilíbrio torna o texto convincente."
        difficulty: 4
        objectives: [EM13LP10, EM13LP45]
target: 10
