title: Conectores de Sequência
level: D
subject: portuguese
difficulty: 4
objectives: [EF07LP12, EF08LP06]
authorNotes: Conectores temporais e ordinais que organizam etapas, eventos e instruções.
example: "Use palavras como primeiro, depois, finalmente para ordenar ideias. Ex.: 'Acordei cedo. ___ tomei café e saí correndo.' → Logo depois."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 45
pages:
  - pageNumber: 1
    title: Marcadores de Início
    description: Conectores que abrem uma sequência.
    exercises:
      - type: paragraph
        question: "Qual conector abre uma sequência? (Primeiramente/Finalmente/Por fim/Em seguida)"
        correctAnswer: Primeiramente
        difficulty: 3
        rationale: "Sequência lógica: ações seguem ordem temporal ou causal."
        objectives: [EF07LP12]
  - pageNumber: 2
    title: Marcadores Intermediários
    description: Conectores que ligam etapas no meio da sequência.
    exercises:
      - type: paragraph
        question: "'Comece misturando os ingredientes secos. ___ adicione os líquidos aos poucos.' (Antes de tudo/Em seguida/Finalmente/Primeiramente)"
        correctAnswer: Em seguida
        difficulty: 4
        rationale: "Pronome relativo 'que' retoma termo anterior."
        objectives: [EF07LP12]
  - pageNumber: 3
    title: Marcadores de Encerramento
    description: Conectores que sinalizam o fim de uma sequência.
    exercises:
      - type: paragraph
        question: "'Revise o texto, ajuste a pontuação e, ___, salve o arquivo.' (por fim/enquanto isso/primeiramente/ao mesmo tempo)"
        correctAnswer: por fim
        difficulty: 4
        rationale: "'Por fim' sinaliza o último passo de uma sequência."
        objectives: [EF07LP12]
  - pageNumber: 4
    title: Simultaneidade
    description: Conectores que indicam ações paralelas no tempo.
    exercises:
      - type: paragraph
        question: "Qual expressão indica simultaneidade? (depois/primeiro/finalmente/enquanto)"
        correctAnswer: enquanto
        difficulty: 4
        rationale: "Observe as opções e escolha a que responde \"Qual expressão indica simultaneidade?\": 'enquanto'."
        objectives: [EF08LP06]
  - pageNumber: 5
    title: Ordinais
    description: Números ordinais organizam passos com clareza.
    exercises:
      - type: paragraph
        question: "Ordem ordinal correta: (segundo, primeiro, terceiro/finalmente, depois, antes/primeiro, último, segundo/em primeiro lugar, em segundo lugar, em terceiro lugar)"
        correctAnswer: em primeiro lugar, em segundo lugar, em terceiro lugar
        difficulty: 3
        rationale: "Conectivo temporal ordena eventos (primeiro, depois, finalmente)."
        objectives: [EF07LP12]
  - pageNumber: 6
    title: Sequência em Narrativa
    description: Narrativas usam marcadores temporais para avançar a história.
    exercises:
      - type: paragraph
        question: "'Acordei cedo. ___ tomei café e saí correndo.' (Por fim/Antes/Logo depois/Finalmente)"
        correctAnswer: Logo depois
        difficulty: 4
        rationale: "Dois pontos introduzem enumeração, fala ou explicação."
        objectives: [EF08LP06]
  - pageNumber: 7
    title: Sequência em Instrução
    description: Manuais e receitas usam marcadores claros e curtos.
    exercises:
      - type: paragraph
        question: "Em uma receita, que marcador é mais direto? (Quiçá/Provavelmente/Eventualmente/1. Depois. 2. Em seguida.)"
        correctAnswer: 1. Depois. 2. Em seguida.
        difficulty: 4
        rationale: "Conectores de sequência organizam fatos no tempo."
        objectives: [EF07LP12]
  - pageNumber: 8
    title: Evitar Repetição
    description: Varie os conectores para evitar monotonia.
    exercises:
      - type: paragraph
        question: "No lugar de repetir 'depois', qual variação cabe? (finalmente/por fim/em seguida/primeiramente)"
        correctAnswer: em seguida
        difficulty: 4
        rationale: "'Primeiro', 'em seguida', 'depois' marcam ordem."
        objectives: [EF08LP06]
  - pageNumber: 9
    title: Coerência Temporal
    description: Os marcadores devem refletir a ordem real dos eventos.
    exercises:
      - type: paragraph
        question: "Frase incoerente: (Finalmente cheguei; primeiro peguei o ônibus/Depois cheguei; antes peguei o ônibus/Antes de sair, peguei o ônibus/Primeiro peguei o ônibus; depois cheguei)"
        correctAnswer: Finalmente cheguei; primeiro peguei o ônibus
        difficulty: 5
        rationale: "Coerência exige que todas as frases tratem do mesmo tema."
        objectives: [EF08LP06]
  - pageNumber: 10
    title: Revisão Integrada
    description: Complete o parágrafo com sequência coerente.
    exercises:
      - type: paragraph
        question: "'___ planejei o roteiro. Em seguida, arrumei a mochila. Por fim, parti.' (Por fim/Primeiramente/Finalmente/Enquanto isso)"
        correctAnswer: Primeiramente
        difficulty: 5
        rationale: "'Por fim', 'finalmente' encerram sequência."
        objectives: [EF08LP06]
target: 10
