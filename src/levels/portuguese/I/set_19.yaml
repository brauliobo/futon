title: 📝 Produção Textual — Dissertação Avançada
level: I
subject: portuguese
difficulty: 5
objectives:
  - EF09LP22
  - EF09LP23
authorNotes: Técnicas avançadas da redação dissertativo-argumentativa — repertório sociocultural, proposta de intervenção e coesão textual de nível vestibular/ENEM.
example: "A dissertação de nível ENEM exige repertório, argumentação coesa e proposta viável. Ex.: Usar dado do IBGE + conceito filosófico + exemplo histórico → repertório sociocultural legitimador."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Estrutura da Dissertação – Página 1
    description: Partes da redação dissertativo-argumentativa.
    exercises:
      - type: paragraph
        question: "A estrutura canônica da redação dissertativo-argumentativa do ENEM é: (narrativa, clímax, desfecho/introdução, desenvolvimento (2 parágrafos), conclusão/tese, antítese, síntese apenas/resumo, citação, análise)"
        correctAnswer: introdução, desenvolvimento (2 parágrafos), conclusão
        difficulty: 2
        rationale: A redação do ENEM segue estrutura de 4-5 parágrafos: introdução com tese, dois ou mais parágrafos de desenvolvimento argumentativo e conclusão propositiva.
        objectives:
          - EF09LP22
  - pageNumber: 2
    title: Repertório Sociocultural – Página 2
    description: Uso de repertório como estratégia argumentativa.
    exercises:
      - type: paragraph
        question: "Citar a Constituição Federal, um filósofo iluminista ou um dado estatístico do IBGE para fundamentar um argumento é usar: (argumento ad hominem/falácia de apelo à emoção/repertório sociocultural legitimador/paráfrase)  "
        correctAnswer: repertório sociocultural legitimador
        difficulty: 2
        rationale: O repertório sociocultural (dados, conceitos, obras, fatos históricos) legitima argumentos com referências de domínio coletivo e verificável.
        objectives:
          - EF09LP22
  - pageNumber: 3
    title: Parágrafo de Desenvolvimento – Página 3
    description: Estrutura do parágrafo argumentativo.
    exercises:
      - type: paragraph
        question: "Um parágrafo de desenvolvimento bem construído contém: (apenas exemplos sem afirmação geral/tópico frasal + argumento/evidência + análise/comentário + fechamento/apenas citações de terceiros sem análise própria)"
        correctAnswer: tópico frasal + argumento/evidência + análise/comentário + fechamento
        difficulty: 3
        rationale: A estrutura ideal do parágrafo argumentativo inicia com tópico frasal (ideia central), desenvolve com evidência, analisa e fecha com encaminhamento para o próximo parágrafo.
        objectives:
          - EF09LP22
  - pageNumber: 4
    title: Proposta de Intervenção – Página 4
    description: Elementos da conclusão propositiva no ENEM.
    exercises:
      - type: paragraph
        question: "A proposta de intervenção do ENEM deve conter: (apenas uma frase genérica de esperança/agente, ação, meio/modo, finalidade e detalhamento da proposta/repetição literal da tese/lista de culpados pelo problema)"
        correctAnswer: agente, ação, meio/modo, finalidade e detalhamento da proposta
        difficulty: 3
        rationale: A proposta de intervenção do ENEM exige cinco elementos: quem age, o que faz, como faz, para quê e com qual resultado esperado.
        objectives:
          - EF09LP23
  - pageNumber: 5
    title: Coesão por Referenciação – Página 5
    description: Uso de pronomes e expressões nominais.
    exercises:
      - type: paragraph
        question: "'O desmatamento cresce no Brasil. Esse processo devastador ameaça a biodiversidade.' O termo 'esse processo devastador' exerce a função de: (introduzir novo argumento/conectivo de causa/referenciação textual que retoma e avalia o termo anterior/contra-argumento)"
        correctAnswer: referenciação textual que retoma e avalia o termo anterior
        difficulty: 3
        rationale: Referenciação por expressão nominal ('esse processo devastador') retoma 'o desmatamento' e acrescenta avaliação — recurso de coesão e progressão temática.
        objectives:
          - EF09LP22
  - pageNumber: 6
    title: Coesão Sequencial – Página 6
    description: Conectivos para progressão lógica.
    exercises:
      - type: paragraph
        question: "Para introduzir um segundo argumento que acrescenta e reforça o primeiro, o conectivo ideal é: (contudo/logo/além disso/embora)"
        correctAnswer: além disso
        difficulty: 4
        rationale: 'Além disso' é operador de adição e reforço argumentativo — acrescenta novo argumento na mesma direção da tese.
        objectives:
          - EF09LP22
  - pageNumber: 7
    title: Argumento por Causa e Efeito – Página 7
    description: Cadeia causal no desenvolvimento.
    exercises:
      - type: paragraph
        question: "'A falta de saneamento básico provoca doenças infecciosas, que sobrecarregam o sistema de saúde, gerando prejuízo econômico bilionário ao país.' Esse argumento usa: (analogia/argumento de autoridade/argumento por cadeia causal/silogismo formal)"
        correctAnswer: argumento por cadeia causal
        difficulty: 4
        rationale: O argumento causal encadeia causa → efeito imediato → consequência secundária — demonstra profundidade analítica.
        objectives:
          - EF09LP23
  - pageNumber: 8
    title: Impessoalidade – Página 8
    description: Uso da impessoalidade na dissertação.
    exercises:
      - type: paragraph
        question: "Por que a dissertação argumentativa deve evitar a primeira pessoa do singular ('eu acho', 'na minha opinião')? (porque viola a norma gramatical/porque a primeira pessoa é proibida pela ABNT/porque a impessoalidade confere objetividade e credibilidade ao argumento/porque o ENEM proíbe qualquer autoria)"
        correctAnswer: porque a impessoalidade confere objetividade e credibilidade ao argumento
        difficulty: 4
        rationale: Na dissertação formal, evitar 'eu acho' e usar construções impessoais ('é evidente que', 'observa-se que') fortalece a credibilidade argumentativa.
        objectives:
          - EF09LP22
  - pageNumber: 9
    title: Revisão e Coerência – Página 9
    description: Consistência entre tese e argumentos.
    exercises:
      - type: paragraph
        question: "Uma redação tem a tese 'A tecnologia digital democratiza o acesso ao conhecimento' mas apresenta apenas argumentos sobre os malefícios das telas. Isso configura: (uma paráfrase/incoerência entre tese e desenvolvimento/argumento por analogia/uso de repertório cultural)"
        correctAnswer: incoerência entre tese e desenvolvimento
        difficulty: 5
        rationale: A coerência exige que tese, argumentos e conclusão apontem na mesma direção — qualquer desvio compromete a qualidade textual.
        objectives:
          - EF09LP23
  - pageNumber: 10
    title: Excelência Dissertativa – Página 10
    description: Integração de todos os recursos da dissertação avançada.
    exercises:
      - type: paragraph
        question: "Uma redação ENEM de nota máxima (1000) deve apresentar: (narração criativa com desfecho emotivo/boa gramática apenas, sem preocupação com argumentação/competência linguística, projeto de texto claro, argumentação consistente, coesão e proposta de intervenção detalhada/muitas citações literais sem análise)"
        correctAnswer: competência linguística, projeto de texto claro, argumentação consistente, coesão e proposta de intervenção detalhada
        difficulty: 5
        rationale: As cinco competências do ENEM abrangem norma culta, compreensão da proposta, estratégias argumentativas, mecanismos de coesão e proposta de intervenção — nenhuma isoladamente garante nota máxima.
        objectives:
          - EF09LP23
target: 10
