title: 🌹 Romantismo Brasileiro
level: I
subject: portuguese
difficulty: 5
objectives:
  - EF09LP12
  - EF09LP13
authorNotes: Principais autores, características e obras do Romantismo brasileiro em prosa e poesia (1836–1881).
example: "O Romantismo valoriza o subjetivismo, o nacionalismo e o amor idealizado. Ex.: Iracema de Alencar → romance indianista com idealização da figura indígena e da nação brasileira."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Início do Romantismo – Página 1
    description: Marco inicial do Romantismo no Brasil.
    exercises:
      - type: paragraph
        question: "O marco inicial do Romantismo brasileiro é considerado a publicação de 'Suspiros Poéticos e Saudades' (1836), de: (Castro Alves/Gonçalves Dias/Álvares de Azevedo/Gonçalves de Magalhães)"
        correctAnswer: Gonçalves de Magalhães
        difficulty: 2
        rationale: "'Suspiros Poéticos e Saudades' (1836) de Gonçalves de Magalhães é o marco inaugural do Romantismo no Brasil."
        objectives:
          - EF09LP12
  - pageNumber: 2
    title: Características Gerais – Página 2
    description: Identifique traços do Romantismo.
    exercises:
      - type: paragraph
        question: "Qual característica NÃO pertence ao Romantismo? (subjetivismo/idealização do amor/culto à razão e objetividade/nacionalismo)"
        correctAnswer: culto à razão e objetividade
        difficulty: 2
        rationale: O culto à razão é marca do Classicismo/Iluminismo. O Romantismo valoriza a emoção, o subjetivismo e a intuição.
        objectives:
          - EF09LP12
  - pageNumber: 3
    title: Indianismo – Página 3
    description: O índio como símbolo nacional.
    exercises:
      - type: paragraph
        question: "O indianismo romântico, presente em obras como 'O Guarani' e 'Iracema', idealiza o índio como: (figura bárbara a ser civilizada/símbolo da nação brasileira e herói nobre/personagem cômico/trabalhador rural)"
        correctAnswer: símbolo da nação brasileira e herói nobre
        difficulty: 3
        rationale: O indianismo romântico constrói um herói nacional a partir da figura indígena idealizada — projeto de identidade nacional.
        objectives:
          - EF09LP12
  - pageNumber: 4
    title: José de Alencar – Página 4
    description: Prosa romântica brasileira.
    exercises:
      - type: paragraph
        question: "José de Alencar é o principal romancista romântico brasileiro. Qual obra NÃO é de sua autoria? (O Guarani/Iracema/Senhora/Dom Casmurro)"
        correctAnswer: Dom Casmurro
        difficulty: 3
        rationale: "'Dom Casmurro' é de Machado de Assis, autor realista. As demais são todas de José de Alencar."
        objectives:
          - EF09LP12
  - pageNumber: 5
    title: Gonçalves Dias – Página 5
    description: Poesia indianista da 1ª geração.
    exercises:
      - type: paragraph
        question: "'Minha terra tem palmeiras / onde canta o Sabiá' é verso do poema 'Canção do Exílio', de: (Castro Alves/Álvares de Azevedo/Gonçalves Dias/Fagundes Varela)"
        correctAnswer: Gonçalves Dias
        difficulty: 3
        rationale: "'Canção do Exílio' (1843) de Gonçalves Dias é um dos poemas mais conhecidos do Romantismo brasileiro."
        objectives:
          - EF09LP13
  - pageNumber: 6
    title: Byronismo – Página 6
    description: 2ª geração romântica — mal do século.
    exercises:
      - type: paragraph
        question: "Álvares de Azevedo, autor de 'Noite na Taverna' e 'Lira dos Vinte Anos', representa a geração marcada pelo: (indianismo/condoreirismo/ultrarromantismo e mal do século/regionalismo)"
        correctAnswer: ultrarromantismo e mal do século
        difficulty: 4
        rationale: A 2ª geração romântica (byronismo) é marcada pelo pessimismo, erotismo velado, morte e tédio existencial.
        objectives:
          - EF09LP13
  - pageNumber: 7
    title: Castro Alves – Página 7
    description: 3ª geração — poesia social e abolicionista.
    exercises:
      - type: paragraph
        question: "Castro Alves, autor de 'Navio Negreiro', é o principal representante do Romantismo: (indianista/ultrarromântico/condoreiro e social/regionalista)"
        correctAnswer: condoreiro e social
        difficulty: 4
        rationale: A 3ª geração romântica usa o condoreirismo — poesia de voo alto, social e abolicionista, sendo Castro Alves seu maior nome.
        objectives:
          - EF09LP13
  - pageNumber: 8
    title: Prosa Urbana – Página 8
    description: Romance urbano e de costumes.
    exercises:
      - type: paragraph
        question: "Em 'Senhora' de Alencar, Aurélia Camargo compra o noivo que a rejeitou. Esse romance pertence à fase: (indianista/regionalista/urbana e de costumes/histórica)"
        correctAnswer: urbana e de costumes
        difficulty: 4
        rationale: Romances urbanos de Alencar retratam a sociedade burguesa carioca com crítica aos valores mercantis do casamento.
        objectives:
          - EF09LP12
  - pageNumber: 9
    title: Evasão Romântica – Página 9
    description: Fuga da realidade como traço estético.
    exercises:
      - type: paragraph
        question: "A evasão para o passado medieval, para a natureza idealizada ou para mundos exóticos é característica romântica chamada de: (realismo/naturalismo/mal do século/escapismo romântico)"
        correctAnswer: escapismo romântico
        difficulty: 4
        rationale: O escapismo romântico manifesta-se na fuga para tempos, espaços ou estados que representam o oposto da realidade burguesa.
        objectives:
          - EF09LP12
  - pageNumber: 10
    title: Síntese do Romantismo – Página 10
    description: Visão integrada do período romântico.
    exercises:
      - type: paragraph
        question: "A transição do Romantismo para o Realismo no Brasil é marcada principalmente por: (uma ruptura política/a obra de Machado de Assis e a crítica ao idealismo romântico/a chegada de autores portugueses/o fim do Império)"
        correctAnswer: a obra de Machado de Assis e a crítica ao idealismo romântico
        difficulty: 5
        rationale: Machado de Assis rompe com o idealismo romântico, introduzindo ironia, pessimismo e análise psicológica que inauguram o Realismo brasileiro.
        objectives:
          - EF09LP13
target: 10
