title: Denotação e Conotação
level: I
subject: portuguese
difficulty: 4
objectives: [EF09LP04]
authorNotes: Sentido literal (denotação) vs figurado (conotação). Base para interpretação de textos literários e publicitários.
example: "A estrela brilha no céu (denotativo) / Ela é a estrela da festa (conotativo). Ex.: 'A estrela brilha no céu' usa 'estrela' em se… → denotativo."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Sentido Denotativo
    description: Literal, objetivo, dicionarizado.
    exercises:
      - type: paragraph
        question: "'A estrela brilha no céu' usa 'estrela' em sentido: (irônico/conotativo/denotativo/metafórico)"
        correctAnswer: denotativo
        difficulty: 3
        rationale: Refere-se ao astro real.
        objectives: [EF09LP04]
  - pageNumber: 2
    title: Sentido Conotativo
    description: Figurado, subjetivo, contextual.
    exercises:
      - type: paragraph
        question: "'Ela é a estrela da festa' usa 'estrela' em sentido: (neutro/literal/denotativo/conotativo)"
        correctAnswer: conotativo
        difficulty: 3
        rationale: "'Estrela' = pessoa em destaque."
        objectives: [EF09LP04]
  - pageNumber: 3
    title: Textos Científicos
    description: Predominância denotativa.
    exercises:
      - type: paragraph
        question: "Em textos científicos, predomina: (paradoxo/denotação/conotação/ironia)"
        correctAnswer: denotação
        difficulty: 3
        rationale: Exigem clareza e objetividade.
        objectives: [EF09LP04]
  - pageNumber: 4
    title: Textos Literários
    description: Predominância conotativa.
    exercises:
      - type: paragraph
        question: "Em poemas líricos, predomina: (conotação/denotação/literalidade/ironia direta)"
        correctAnswer: conotação
        difficulty: 3
        rationale: Linguagem literária explora o sentido figurado.
        objectives: [EF09LP04]
  - pageNumber: 5
    title: Expressões Idiomáticas
    description: Frase lexicalizada com sentido conotativo.
    exercises:
      - type: paragraph
        question: "'Estou com a faca e o queijo na mão' significa: (ter controle/cozinhar/cortar/pegar arma)"
        correctAnswer: ter controle
        difficulty: 4
        rationale: Expressão idiomática de domínio da situação.
        objectives: [EF09LP04]
  - pageNumber: 6
    title: Ambiguidade
    description: Uma palavra pode ter sentido conotativo ou denotativo dependendo do contexto.
    exercises:
      - type: paragraph
        question: "'Quebrou o gelo' em 'Quebrou o gelo do copo' é: (conotativo/ambíguo/literal com figura/denotativo)"
        correctAnswer: denotativo
        difficulty: 4
        rationale: Aqui refere-se ao gelo real.
        objectives: [EF09LP04]
  - pageNumber: 7
    title: Conotação em Publicidade
    description: Explora duplo sentido e apelo emocional.
    exercises:
      - type: paragraph
        question: "'A energia da manhã' em publicidade de café explora: (ironia/conotação/paradoxo/denotação)"
        correctAnswer: conotação
        difficulty: 4
        rationale: "'Energia' sugere vitalidade, não apenas calor."
        objectives: [EF09LP04]
  - pageNumber: 8
    title: Leitura de Conotação
    description: Compreender metáforas e símbolos.
    exercises:
      - type: paragraph
        question: "'Coração' em 'a cidade é o coração do país' significa: (vida literal/amor/centro/órgão)"
        correctAnswer: centro
        difficulty: 4
        rationale: Metáfora — o elemento mais importante.
        objectives: [EF09LP04]
  - pageNumber: 9
    title: Função Poética
    description: Foco na forma da mensagem.
    exercises:
      - type: paragraph
        question: "A função da linguagem com ênfase na forma (figuras, ritmo) é: (referencial/poética/metalinguística/conativa)"
        correctAnswer: poética
        difficulty: 4
        rationale: Função poética prioriza a mensagem e o estilo.
        objectives: [EF09LP04]
  - pageNumber: 10
    title: Revisão Integrada
    description: Denotação ou conotação?
    exercises:
      - type: paragraph
        question: "'O tempo voa' é sentido: (denotativo/neutro/literal/conotativo)"
        correctAnswer: conotativo
        difficulty: 3
        rationale: "'Tempo' não voa literalmente; metáfora."
        objectives: [EF09LP04]
target: 10
