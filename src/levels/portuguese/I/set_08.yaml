title: 🗣️ Variedades Linguísticas
level: I
subject: portuguese
difficulty: 5
objectives:
  - EF09LP01
  - EF09LP02
authorNotes: Estudo das variedades da língua portuguesa — norma culta, coloquial, regional e técnica — e seus contextos de uso.
example: "A língua varia conforme o falante, a região e a situação. Ex.: 'A gente foi no mercado' (coloquial) → norma padrão: 'Nós fomos ao mercado'."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Norma Culta – Página 1
    description: Reconheça o registro de norma culta formal.
    exercises:
      - type: paragraph
        question: "Qual frase está na norma culta formal? (A gente foi lá/Nós fomos ao local/A gente foi ao local/A gente foi pro lugar)"
        correctAnswer: Nós fomos ao local
        difficulty: 2
        rationale: Uso de 'nós' e preposição 'ao' atendem à norma culta formal.
        objectives:
          - EF09LP01
  - pageNumber: 2
    title: Registro Coloquial – Página 2
    description: Identifique marcas da fala coloquial cotidiana.
    exercises:
      - type: paragraph
        question: "'Tô com uma saudade braba de você' é um exemplo de: (linguagem técnica/norma culta/linguagem coloquial/linguagem regional nordestina)"
        correctAnswer: linguagem coloquial
        difficulty: 2
        rationale: "'Tô' (estou) e 'braba' são marcas da fala informal cotidiana."
        objectives:
          - EF09LP01
  - pageNumber: 3
    title: Regionalismo – Página 3
    description: Reconheça traços do falar regional.
    exercises:
      - type: paragraph
        question: "A palavra 'saudade' usada no sentido de 'muita', como em 'Tenho saudade de feijão com arroz', é exemplo de: (tecnicismo/neologismo/regionalismo nordestino/gíria urbana)"
        correctAnswer: regionalismo nordestino
        difficulty: 3
        rationale: Esse sentido específico de 'saudade' é traço do falar nordestino.
        objectives:
          - EF09LP01
  - pageNumber: 4
    title: Linguagem Técnica – Página 4
    description: Identifique vocabulário técnico-científico.
    exercises:
      - type: paragraph
        question: "'O paciente apresentou bradicardia sinusal e hipotensão ortostática' é exemplo de: (linguagem coloquial/linguagem literária/linguagem técnica médica/linguagem regional)"
        correctAnswer: linguagem técnica médica
        difficulty: 3
        rationale: Termos como 'bradicardia sinusal' são privativos do vocabulário médico especializado.
        objectives:
          - EF09LP02
  - pageNumber: 5
    title: Variação Diatópica – Página 5
    description: Variação geográfica da língua.
    exercises:
      - type: paragraph
        question: "A diferença entre chamar o mesmo objeto de 'mandioca' (São Paulo) e 'aipim' (Rio) é um exemplo de variação: (diastrática/diafásica/diatópica/diacrônica)"
        correctAnswer: diatópica
        difficulty: 3
        rationale: Variação diatópica refere-se às diferenças geográficas/regionais.
        objectives:
          - EF09LP01
  - pageNumber: 6
    title: Variação Diastrática – Página 6
    description: Variação por grupos sociais.
    exercises:
      - type: paragraph
        question: "Gírias usadas por jovens, como 'printou' ou 'lacrou', são exemplos de variação: (diatópica/diacrônica/diastrática/diafásica)"
        correctAnswer: diastrática
        difficulty: 4
        rationale: Variação diastrática é ligada a grupos sociais, etários ou culturais.
        objectives:
          - EF09LP01
  - pageNumber: 7
    title: Variação Diafásica – Página 7
    description: Variação conforme a situação comunicativa.
    exercises:
      - type: paragraph
        question: "Quando um médico fala de forma diferente com colegas e com pacientes, ele usa: (variação diatópica/adequação diafásica/regionalismo/variação diacrônica)"
        correctAnswer: adequação diafásica
        difficulty: 4
        rationale: Variação diafásica é a adaptação do registro à situação e ao interlocutor.
        objectives:
          - EF09LP02
  - pageNumber: 8
    title: Preconceito Linguístico – Página 8
    description: Reflexão crítica sobre norma e preconceito.
    exercises:
      - type: paragraph
        question: "Considerar que quem diz 'nós vai' 'fala errado' é um exemplo de: (análise linguística correta/preconceito linguístico/norma gramatical/variação diacrônica)"
        correctAnswer: preconceito linguístico
        difficulty: 4
        rationale: Variantes estigmatizadas são sistemáticas; julgá-las como 'erro' é preconceito linguístico.
        objectives:
          - EF09LP01
  - pageNumber: 9
    title: Neologismo – Página 9
    description: Criação de novas palavras na língua.
    exercises:
      - type: paragraph
        question: "A palavra 'tuitar' (do inglês 'tweet'), incorporada ao português, é um exemplo de: (arcaísmo/estrangeirismo/neologismo/regionalismo)"
        correctAnswer: neologismo
        difficulty: 4
        rationale: Neologismo é palavra recém-criada ou incorporada ao léxico da língua.
        objectives:
          - EF09LP02
  - pageNumber: 10
    title: Adequação ao Contexto – Página 10
    description: Escolha do registro adequado para cada situação.
    exercises:
      - type: paragraph
        question: "Ao escrever um requerimento à diretoria escolar, o aluno deve usar: (gírias e linguagem coloquial/linguagem regional do bairro/norma culta e registro formal/linguagem técnica jurídica)"
        correctAnswer: norma culta e registro formal
        difficulty: 5
        rationale: Situações formais de escrita institucional exigem norma culta e registro formal.
        objectives:
          - EF09LP02
target: 10
