title: 🏆 Revisão Geral Nível I
level: I
subject: portuguese
difficulty: 5
objectives:
  - EF09LP04
  - EF09LP12
  - EF09LP19
  - EF09LP22
authorNotes: Revisão integrada de todos os conteúdos do Nível I — figuras de linguagem, variação linguística, análise do discurso, literatura e produção textual.
example: "O Nível I integra estilística, literatura, discurso e produção textual. Ex.: Identificar metáfora + função poética + escola literária + estratégia argumentativa num único texto → análise integrada."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Figuras de Linguagem – Página 1
    description: Revisão das principais figuras.
    exercises:
      - type: paragraph
        question: "'O tempo é dinheiro' é um exemplo clássico de: (comparação com conectivo/hipérbole numérica/metonímia/metáfora)"
        correctAnswer: metáfora
        difficulty: 2
        rationale: Metáfora é identificação direta entre dois termos sem conectivo — 'tempo' é identificado com 'dinheiro'.
        objectives:
          - EF09LP04
  - pageNumber: 2
    title: Variação Linguística – Página 2
    description: Revisão dos tipos de variação.
    exercises:
      - type: paragraph
        question: "A diferença entre a língua usada numa entrevista de emprego e numa conversa com amigos é um exemplo de variação: (diatópica/diacrônica/diastrática/diafásica)"
        correctAnswer: diafásica
        difficulty: 2
        rationale: Variação diafásica é a adaptação do registro à situação comunicativa — formal vs. informal conforme o contexto.
        objectives:
          - EF09LP04
  - pageNumber: 3
    title: Análise do Discurso – Página 3
    description: Revisão de intertextualidade e polifonia.
    exercises:
      - type: paragraph
        question: "Uma propaganda que recria o estilo visual dos filmes de faroeste para vender um produto usa: (intertextualidade explícita por citação/intertextualidade implícita e paródia/polifonia e interdiscurso/argumento de autoridade)"
        correctAnswer: intertextualidade implícita e paródia
        difficulty: 3
        rationale: Recriar o estilo sem citar é intertextualidade implícita; transformar com intenção comercial é paródia/pastiche.
        objectives:
          - EF09LP19
  - pageNumber: 4
    title: Argumentação – Página 4
    description: Revisão das estruturas argumentativas.
    exercises:
      - type: paragraph
        question: "'Apesar de ser cara, a energia solar é a opção mais sustentável para o futuro.' O elemento retórico destacado é: (tese sem ressalva/argumento causal/concessão seguida de argumento/silogismo)"
        correctAnswer: concessão seguida de argumento
        difficulty: 3
        rationale: 'Apesar de' introduz concessão ao ponto contrário; o argumento principal é mantido e reforçado após a ressalva.
        objectives:
          - EF09LP22
  - pageNumber: 5
    title: Romantismo – Página 5
    description: Revisão do período romântico.
    exercises:
      - type: paragraph
        question: "Castro Alves, Gonçalves Dias e Álvares de Azevedo pertencem, respectivamente, às gerações: (3ª, 1ª, 2ª/1ª, 2ª, 3ª/2ª, 3ª, 1ª/3ª, 2ª, 1ª)"
        correctAnswer: 3ª, 1ª, 2ª
        difficulty: 3
        rationale: Gonçalves Dias (indianismo, 1ª geração), Álvares de Azevedo (ultrarromantismo, 2ª geração), Castro Alves (condoreirismo, 3ª geração).
        objectives:
          - EF09LP12
  - pageNumber: 6
    title: Realismo vs. Naturalismo – Página 6
    description: Distinção entre os dois movimentos.
    exercises:
      - type: paragraph
        question: "Machado de Assis pertence ao Realismo; Aluísio Azevedo, ao Naturalismo. A principal diferença é que Aluísio: (ignora a crítica social/usa linguagem mais erudita/aplica o determinismo científico e mostra personagens condicionadas pelo meio e pela biologia/critica apenas a burguesia carioca)"
        correctAnswer: aplica o determinismo científico e mostra personagens condicionadas pelo meio e pela biologia
        difficulty: 4
        rationale: O Naturalismo é o Realismo radicalizado pelo determinismo — personagens são produto de forças biológicas e sociais inescapáveis.
        objectives:
          - EF09LP12
  - pageNumber: 7
    title: Modernismo – Página 7
    description: Revisão das três gerações modernistas.
    exercises:
      - type: paragraph
        question: "Qual autor pertence à 3ª geração modernista? (Oswald de Andrade/Manuel Bandeira/Graciliano Ramos/João Guimarães Rosa)"
        correctAnswer: João Guimarães Rosa
        difficulty: 4
        rationale: Guimarães Rosa ('Grande Sertão: Veredas', 1956) é da 3ª geração modernista; Oswald e Manuel Bandeira são da 1ª; Graciliano é da 2ª.
        objectives:
          - EF09LP12
  - pageNumber: 8
    title: Leitura Crítica – Página 8
    description: Revisão de estratégias de leitura crítica.
    exercises:
      - type: paragraph
        question: "Ao ler uma reportagem, identificar que o jornal pertence a um grupo empresarial com interesses políticos é praticar: (leitura literal/análise gramatical/leitura crítica com identificação de viés ideológico/análise estilística)"
        correctAnswer: leitura crítica com identificação de viés ideológico
        difficulty: 4
        rationale: Contextualizar quem produz o texto e seus interesses é etapa fundamental da leitura crítica — todo discurso tem posicionamento.
        objectives:
          - EF09LP19
  - pageNumber: 9
    title: Produção Textual – Página 9
    description: Revisão dos gêneros argumentativos.
    exercises:
      - type: paragraph
        question: "A diferença entre artigo de opinião e dissertação ENEM é que o artigo: (não tem tese/é mais longo e usa metodologia científica/é gênero jornalístico com maior liberdade de estilo; a dissertação ENEM segue formato e competências rígidas da avaliação/tem rima e metro obrigatórios)"
        correctAnswer: é gênero jornalístico com maior liberdade de estilo; a dissertação ENEM segue formato e competências rígidas da avaliação
        difficulty: 5
        rationale: O artigo de opinião é gênero de circulação real com maior flexibilidade; a dissertação ENEM é construção escolar com protocolo avaliativo fixo.
        objectives:
          - EF09LP22
  - pageNumber: 10
    title: Integração Final – Página 10
    description: Análise integrada de texto complexo.
    exercises:
      - type: paragraph
        question: "Um poema de Drummond que usa ironia para criticar a sociedade burguesa, em linguagem coloquial, dialogando com Marx — integra: (apenas figuras de linguagem/apenas literatura modernista/figuras de linguagem, variação linguística (coloquial), 2ª geração modernista, intertextualidade e função crítica do discurso/apenas análise do discurso)"
        correctAnswer: figuras de linguagem, variação linguística (coloquial), 2ª geração modernista, intertextualidade e função crítica do discurso
        difficulty: 5
        rationale: A análise literária integrada mobiliza simultaneamente múltiplas dimensões — estilística, histórica, discursiva e linguística.
        objectives:
          - EF09LP22
target: 10
