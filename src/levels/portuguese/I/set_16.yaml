title: 🌐 Literatura Contemporânea
level: I
subject: portuguese
difficulty: 5
objectives:
  - EF09LP16
  - EF09LP17
authorNotes: Pós-modernismo, pluralidade de vozes e estéticas na literatura brasileira a partir dos anos 1960 até o presente.
example: "A literatura pós-moderna desconstrói grandes narrativas e mistura gêneros. Ex.: 'Estação Carandiru' de Dráuzio Varella → prosa de testemunho que mistura jornalismo, memória e ficção."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Pós-Modernismo – Página 1
    description: Características da literatura pós-moderna.
    exercises:
      - type: paragraph
        question: "O pós-modernismo literário é marcado por: (crença em verdades absolutas e narrativas lineares/mistura de gêneros, metalinguagem, ironia e desconstrução de grandes narrativas/retorno ao formalismo clássico/valorização exclusiva do romance realista)"
        correctAnswer: mistura de gêneros, metalinguagem, ironia e desconstrução de grandes narrativas
        difficulty: 2
        rationale: O pós-modernismo recusa verdades totalizantes e experimenta com formas, vozes e gêneros de forma plural e autocrítica.
        objectives:
          - EF09LP16
  - pageNumber: 2
    title: Metalinguagem – Página 2
    description: Texto que fala de si mesmo.
    exercises:
      - type: paragraph
        question: "Um romance em que o narrador comenta que está escrevendo um romance usa: (intertextualidade implícita/fluxo de consciência/metalinguagem/argumento causal)"
        correctAnswer: metalinguagem
        difficulty: 2
        rationale: Metalinguagem é o uso da linguagem para falar sobre si mesma — recurso frequente na literatura pós-moderna.
        objectives:
          - EF09LP16
  - pageNumber: 3
    title: João Ubaldo Ribeiro – Página 3
    description: Prosa pós-moderna brasileira.
    exercises:
      - type: paragraph
        question: "'Viva o Povo Brasileiro' de João Ubaldo Ribeiro dá voz a escravizados e marginalizados, refletindo: (narrativa histórica oficial/desconstrução pós-moderna da história pelo ponto de vista do oprimido/indianismo romântico/naturalismo científico)"
        correctAnswer: desconstrução pós-moderna da história pelo ponto de vista do oprimido
        difficulty: 3
        rationale: O pós-modernismo questiona a historiografia oficial, dando voz a escravizados, mulheres e pobres.
        objectives:
          - EF09LP16
  - pageNumber: 4
    title: Poesia Concreta – Página 4
    description: Experiências visuais da poesia concreta.
    exercises:
      - type: paragraph
        question: "A Poesia Concreta (Noigandres, anos 50-60) inova ao: (retomar o parnasianismo/usar o espaço visual da página como elemento poético/escrever em versos alexandrinos/imitar a poesia trovadoresca)"
        correctAnswer: usar o espaço visual da página como elemento poético
        difficulty: 3
        rationale: Os poetas concretos (Augusto e Haroldo de Campos, Décio Pignatari) transformam a disposição visual das palavras em elemento construtivo do poema.
        objectives:
          - EF09LP16
  - pageNumber: 5
    title: Literatura de Testemunho – Página 5
    description: Prosa de testemunho e memória.
    exercises:
      - type: paragraph
        question: "Obras como 'Quarto de Despejo' (Carolina de Jesus) e 'Estação Carandiru' (Dráuzio Varella) pertencem à: (ficção científica/literatura de testemunho com valor documental/crônica jornalística formal/poesia concreta)"
        correctAnswer: literatura de testemunho com valor documental
        difficulty: 3
        rationale: A literatura de testemunho dá voz a sujeitos em situações extremas de marginalização, violência ou exclusão social.
        objectives:
          - EF09LP17
  - pageNumber: 6
    title: Diversidade de Vozes – Página 6
    description: Pluralidade de identidades na literatura atual.
    exercises:
      - type: paragraph
        question: "A presença de autores negros, indígenas, LGBTQ+ e periféricos na literatura brasileira contemporânea representa: (declínio da qualidade/homogeneização temática/democratização das vozes e ampliação do cânone/retorno ao indianismo)"
        correctAnswer: democratização das vozes e ampliação do cânone
        difficulty: 4
        rationale: A literatura contemporânea incorpora perspectivas historicamente excluídas, expandindo o cânone literário e as formas de representação.
        objectives:
          - EF09LP17
  - pageNumber: 7
    title: Conceito de Cânone – Página 7
    description: Questionamento do cânone literário.
    exercises:
      - type: paragraph
        question: "Questionar o cânone literário ocidental significa: (defender que só clássicos europeus têm valor/valorizar só a literatura do séc. XIX/reconhecer que a seleção de 'universais' reflete poder racial e de gênero/rejeitar toda literatura estrangeira)"
        correctAnswer: reconhecer que a seleção de 'universais' reflete poder racial e de gênero
        difficulty: 4
        rationale: O questionamento do cânone denuncia que a escolha de 'clássicos' reflete hegemonias culturais — eurocentrismo, androcentrismo.
        objectives:
          - EF09LP17
  - pageNumber: 8
    title: Escrita Periférica – Página 8
    description: Literatura marginal e periférica.
    exercises:
      - type: paragraph
        question: "Ferréz, Sacolinha e os Racionais ilustram a literatura periférica, que se caracteriza por: (linguagem erudita e temas abstratos/narrativas das periferias urbanas com linguagem própria e autoria local/regionalismo nordestino/indianismo revisitado)"
        correctAnswer: narrativas das periferias urbanas com linguagem própria e autoria local
        difficulty: 4
        rationale: A literatura periférica rompe com a ideia de que a produção literária legítima vem apenas de centros culturais dominantes.
        objectives:
          - EF09LP17
  - pageNumber: 9
    title: Realismo Mágico – Página 9
    description: Maravilhoso na prosa latino-americana.
    exercises:
      - type: paragraph
        question: "O realismo mágico, presente em autores como García Márquez e influente na literatura brasileira, integra: (narrativa histórica documental/fatos sobrenaturais de forma natural no cotidiano realista/verso livre modernista/linguagem técnica científica)"
        correctAnswer: fatos sobrenaturais de forma natural no cotidiano realista
        difficulty: 5
        rationale: O realismo mágico dissolve a fronteira entre real e sobrenatural — o extraordinário é tratado com naturalidade pelos personagens.
        objectives:
          - EF09LP16
  - pageNumber: 10
    title: Síntese Contemporânea – Página 10
    description: Visão integradora da literatura contemporânea.
    exercises:
      - type: paragraph
        question: "A principal marca da literatura brasileira contemporânea é: (retorno ao formalismo clássico/homogeneidade temática e estética/pluralidade de vozes, formas e identidades que questionam hierarquias culturais/abandono das tradições anteriores)"
        correctAnswer: pluralidade de vozes, formas e identidades que questionam hierarquias culturais
        difficulty: 5
        rationale: A contemporaneidade literária brasileira é definida pela diversidade de autores, perspectivas, gêneros e formas — em constante diálogo com e questionamento das tradições.
        objectives:
          - EF09LP17
target: 10
