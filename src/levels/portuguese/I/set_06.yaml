title: Funções da Linguagem
level: I
subject: portuguese
difficulty: 4
objectives: [EF09LP05]
authorNotes: Referencial, emotiva, conativa, metalinguística, fática, poética (Jakobson).
example: "Poesia enfatiza a forma; notícia, a informação."
pages:
  - pageNumber: 1
    title: Função Referencial
    description: Foco na informação objetiva.
    exercises:
      - type: paragraph
        question: "Qual texto usa função referencial? (Notícia de jornal/Poema lírico/Carta de amor/Propaganda)"
        correctAnswer: Notícia de jornal
        difficulty: 2
        rationale: Notícia busca informar de modo objetivo.
        objectives: [EF09LP05]
  - pageNumber: 2
    title: Função Emotiva
    description: Foco no emissor; expressa sentimento.
    exercises:
      - type: paragraph
        question: "'Estou muito feliz hoje!' predomina função: (emotiva/referencial/conativa/fática)"
        correctAnswer: emotiva
        difficulty: 2
        rationale: Centra-se no sentimento do emissor.
        objectives: [EF09LP05]
  - pageNumber: 3
    title: Função Conativa (Apelativa)
    description: Dirige-se ao receptor; apelo.
    exercises:
      - type: paragraph
        question: "'Compre já!' predomina função: (conativa/referencial/metalinguística/emotiva)"
        correctAnswer: conativa
        difficulty: 2
        rationale: Busca convencer o receptor.
        objectives: [EF09LP05]
  - pageNumber: 4
    title: Função Metalinguística
    description: A linguagem explica a si mesma.
    exercises:
      - type: paragraph
        question: "'Substantivo é a classe de palavras que nomeia seres' usa função: (metalinguística/poética/referencial/fática)"
        correctAnswer: metalinguística
        difficulty: 3
        rationale: A língua descreve a própria língua.
        objectives: [EF09LP05]
  - pageNumber: 5
    title: Função Fática
    description: Testa ou mantém o canal de comunicação.
    exercises:
      - type: paragraph
        question: "'Alô, alô, está me ouvindo?' usa função: (fática/emotiva/conativa/referencial)"
        correctAnswer: fática
        difficulty: 3
        rationale: Verifica o funcionamento do canal.
        objectives: [EF09LP05]
  - pageNumber: 6
    title: Função Poética
    description: Foco na mensagem, na forma.
    exercises:
      - type: paragraph
        question: "Poesia, letras de música e propagandas criativas exploram: (poética/emotiva/referencial/fática)"
        correctAnswer: poética
        difficulty: 3
        rationale: Atenção à construção estética da mensagem.
        objectives: [EF09LP05]
  - pageNumber: 7
    title: Funções Combinadas
    description: Um texto costuma ter mais de uma função, com predominância.
    exercises:
      - type: paragraph
        question: "Em publicidade, costumam estar presentes: (conativa e poética/fática e metalinguística/referencial e fática/apenas poética)"
        correctAnswer: conativa e poética
        difficulty: 3
        rationale: Publicidade apela ao receptor e usa forma estética.
        objectives: [EF09LP05]
  - pageNumber: 8
    title: Texto Científico
    description: Foco referencial, com metalinguística frequente.
    exercises:
      - type: paragraph
        question: "Qual função predomina em texto científico? (referencial/emotiva/conativa/poética)"
        correctAnswer: referencial
        difficulty: 2
        rationale: Objetividade é o foco.
        objectives: [EF09LP05]
  - pageNumber: 9
    title: Diário Pessoal
    description: Função emotiva predominante.
    exercises:
      - type: paragraph
        question: "Qual função predomina em diário? (emotiva/referencial/conativa/fática)"
        correctAnswer: emotiva
        difficulty: 2
        rationale: Centra-se nos sentimentos do autor.
        objectives: [EF09LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique a função predominante.
    exercises:
      - type: paragraph
        question: "'Que a vida seja leve, amigo' predomina função: (emotiva/conativa/referencial/poética)"
        correctAnswer: conativa
        difficulty: 3
        rationale: Dirige uma mensagem ao interlocutor.
        objectives: [EF09LP05]
target: 10
