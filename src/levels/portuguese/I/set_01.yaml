title: Figuras de Palavra (Semântica)
level: I
subject: portuguese
difficulty: 3
objectives: [EF09LP04, EF09LP05]
authorNotes: Metáfora, comparação, metonímia, catacrese, sinestesia, perífrase, antonomásia.
example: "Seus olhos são estrelas — metáfora. Ex.: 'Seus olhos são estrelas' é: → metáfora."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Metáfora
    description: Transfere sentido sem conectivo comparativo.
    exercises:
      - type: paragraph
        question: "'Seus olhos são estrelas' é: (comparação/catacrese/metáfora/metonímia)"
        correctAnswer: metáfora
        difficulty: 2
        rationale: Identifica 'olhos' com 'estrelas' sem 'como'.
        objectives: [EF09LP04]
  - pageNumber: 2
    title: Comparação
    description: Explicita conectivo — como, tal qual, feito.
    exercises:
      - type: paragraph
        question: "'Forte como um touro' é: (metáfora/personificação/metonímia/comparação)"
        correctAnswer: comparação
        difficulty: 1
        rationale: "'Como' sinaliza comparação."
        objectives: [EF09LP04]
  - pageNumber: 3
    title: Metonímia
    description: Parte pelo todo, autor pela obra, causa pelo efeito.
    exercises:
      - type: paragraph
        question: "'Li Machado de Assis' é: (catacrese/sinestesia/metáfora/metonímia)"
        correctAnswer: metonímia
        difficulty: 3
        rationale: Autor pela obra.
        objectives: [EF09LP04]
  - pageNumber: 4
    title: Catacrese
    description: Uso forçado por falta de palavra específica.
    exercises:
      - type: paragraph
        question: "'Dente de alho' é exemplo de: (metáfora/comparação/metonímia/catacrese)"
        correctAnswer: catacrese
        difficulty: 3
        rationale: "'Dente' usa-se por ausência de termo mais apropriado."
        objectives: [EF09LP04]
  - pageNumber: 5
    title: Sinestesia
    description: Cruza sensações — doce melodia, luz quente.
    exercises:
      - type: paragraph
        question: "'Uma voz áspera' é: (comparação/metáfora/sinestesia/metonímia)"
        correctAnswer: sinestesia
        difficulty: 3
        rationale: Mistura tato (áspera) e audição (voz).
        objectives: [EF09LP05]
  - pageNumber: 6
    title: Perífrase (Antonomásia)
    description: Expressão que substitui um nome próprio.
    exercises:
      - type: paragraph
        question: "'A Cidade Maravilhosa' refere-se a: (Rio de Janeiro/São Paulo/Salvador/Brasília)"
        correctAnswer: Rio de Janeiro
        difficulty: 3
        rationale: Perífrase consolidada para o Rio.
        objectives: [EF09LP05]
  - pageNumber: 7
    title: Metáfora Cotidiana
    description: Metáforas mortas — já lexicalizadas.
    exercises:
      - type: paragraph
        question: "'Pé da montanha' é exemplo de metáfora: (viva/inovadora/absoluta/morta)"
        correctAnswer: morta
        difficulty: 3
        rationale: Lexicalizada pelo uso corrente.
        objectives: [EF09LP04]
  - pageNumber: 8
    title: Metonímia Cotidiana
    description: Uso comum em contexto de consumo.
    exercises:
      - type: paragraph
        question: "'Tomei um copo de água' usa metonímia de: (todo pela parte/autor pela obra/efeito pela causa/continente pelo conteúdo)"
        correctAnswer: continente pelo conteúdo
        difficulty: 3
        rationale: "'Copo' representa 'a água que está no copo'."
        objectives: [EF09LP04]
  - pageNumber: 9
    title: Distinção Metáfora x Metonímia
    description: Metáfora — semelhança; metonímia — contiguidade.
    exercises:
      - type: paragraph
        question: "'Ele é um leão' é: (comparação/metáfora/metonímia/catacrese)"
        correctAnswer: metáfora
        difficulty: 2
        rationale: Relação por semelhança qualitativa.
        objectives: [EF09LP04]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classifique a figura semântica.
    exercises:
      - type: paragraph
        question: "'O Brasil venceu a Copa' é: (catacrese/comparação/metáfora/metonímia)"
        correctAnswer: metonímia
        difficulty: 3
        rationale: País pela seleção — parte/todo.
        objectives: [EF09LP05]
target: 10
