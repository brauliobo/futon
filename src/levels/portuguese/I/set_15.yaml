title: ✨ Modernismo — 2ª e 3ª Gerações
level: I
subject: portuguese
difficulty: 5
objectives:
  - EF09LP14
  - EF09LP15
authorNotes: Consolidação modernista com Drummond, a geração de 45, Clarice Lispector e João Guimarães Rosa.
example: "A 2ª geração aprofunda o engajamento social e existencial; a 3ª experimenta linguagem e introspecção. Ex.: 'E agora, José?' (Drummond) → poesia de angústia existencial e social da geração de 30."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: 2ª Geração Modernista – Página 1
    description: Características da geração de 1930.
    exercises:
      - type: paragraph
        question: "A 2ª geração modernista (geração de 30) se distingue da 1ª por: (ser mais festiva e iconoclasta/aprofundar a poesia social, existencial e o romance regionalista crítico/abandonar o verso livre/rejeitar a cultura popular)"
        correctAnswer: aprofundar a poesia social, existencial e o romance regionalista crítico
        difficulty: 2
        rationale: "A geração de 30 matura a ruptura iniciada em 22, com maior densidade temática: angústia existencial, crítica social e regionalismo nordestino."
        objectives:
          - EF09LP14
  - pageNumber: 2
    title: Carlos Drummond de Andrade – Página 2
    description: O maior poeta da 2ª geração.
    exercises:
      - type: paragraph
        question: "'No meio do caminho tinha uma pedra / tinha uma pedra no meio do caminho', de Drummond, usa a repetição para: (efeito de rima parnasiana/criar musicalidade erudita/simular travamento existencial e monotonia da vida/imitar a poesia simbolista)"
        correctAnswer: simular travamento existencial e monotonia da vida
        difficulty: 2
        rationale: A pedra é obstáculo simbólico da vida; a repetição icônica mimetiza o bloqueio existencial.
        objectives:
          - EF09LP15
  - pageNumber: 3
    title: Romance de 30 – Página 3
    description: Ficção regionalista da 2ª geração.
    exercises:
      - type: paragraph
        question: "'Vidas Secas' de Graciliano Ramos retrata a família de Fabiano fugindo da seca. Esse romance pertence ao: (indianismo tardio/Romance de 30 com foco no regionalismo nordestino e crítica social/Naturalismo científico/Simbolismo)"
        correctAnswer: Romance de 30 com foco no regionalismo nordestino e crítica social
        difficulty: 3
        rationale: O Romance de 30 (Graciliano, Jorge Amado, Rachel de Queiroz) é marcado pelo regionalismo crítico e pela denúncia das desigualdades sociais.
        objectives:
          - EF09LP14
  - pageNumber: 4
    title: Jorge Amado – Página 4
    description: Romance social e popular baiano.
    exercises:
      - type: paragraph
        question: "Jorge Amado, em obras como 'Capitães da Areia' e 'Gabriela, Cravo e Canela', combina: (indianismo e ultrarromantismo/linguagem erudita e temas históricos/realidade social da Bahia, cultura popular e humor/formalismo parnasiano e verso perfeito)"
        correctAnswer: realidade social da Bahia, cultura popular e humor
        difficulty: 3
        rationale: Jorge Amado une realismo social, oralidade, sensualidade e cultura afro-baiana numa literatura de amplo apelo popular.
        objectives:
          - EF09LP14
  - pageNumber: 5
    title: Geração de 45 – Página 5
    description: 3ª geração e a volta ao formalismo.
    exercises:
      - type: paragraph
        question: "A Geração de 45 (3ª geração modernista) reage contra a informalidade da 1ª geração, buscando: (verso livre e linguagem popular/retorno ao formalismo poético com rigor técnico/poesia engajada e panfletária/retomada do indianismo)"
        correctAnswer: retorno ao formalismo poético com rigor técnico
        difficulty: 3
        rationale: A Geração de 45 representa uma espécie de 'neoclassicismo moderno' — rigor formal sem abrir mão das conquistas modernistas.
        objectives:
          - EF09LP14
  - pageNumber: 6
    title: Clarice Lispector – Página 6
    description: Prosa introspectiva e linguagem inovadora.
    exercises:
      - type: paragraph
        question: "Clarice Lispector, em 'A Hora da Estrela' e 'A Maçã no Escuro', inova na prosa brasileira com: (enredo linear e personagens típicos/narrativa introspectiva, fluxo de consciência e crise existencial/regionalismo nordestino/romance histórico e indianista)"
        correctAnswer: narrativa introspectiva, fluxo de consciência e crise existencial
        difficulty: 4
        rationale: Clarice inaugura no Brasil uma prosa hermética e filosófica, centrada na consciência da personagem, não nos acontecimentos externos.
        objectives:
          - EF09LP15
  - pageNumber: 7
    title: João Guimarães Rosa – Página 7
    description: Linguagem inventiva e sertão mítico.
    exercises:
      - type: paragraph
        question: "'Grande Sertão: Veredas' de Guimarães Rosa é considerado revolucionário principalmente porque: (retrata a vida urbana do Rio de Janeiro/usa linguagem inventiva que recria o falar sertanejo e transforma o sertão em espaço mítico/segue a estrutura realista tradicional/imita a prosa parnasiana)"
        correctAnswer: usa linguagem inventiva que recria o falar sertanejo e transforma o sertão em espaço mítico
        difficulty: 4
        rationale: Guimarães Rosa cria um idioma literário novo — neologismos, sintaxe reinventada — e transforma o sertão mineiro em palco de questões universais.
        objectives:
          - EF09LP15
  - pageNumber: 8
    title: Fluxo de Consciência – Página 8
    description: Técnica narrativa modernista.
    exercises:
      - type: paragraph
        question: "A técnica do fluxo de consciência consiste em: (narrar apenas os diálogos entre personagens/registrar os pensamentos espontâneos e associações mentais de um personagem sem ordem lógica rígida/usar sempre narrador onisciente/descrever o ambiente de forma detalhada e objetiva)"
        correctAnswer: registrar os pensamentos espontâneos e associações mentais de um personagem sem ordem lógica rígida
        difficulty: 4
        rationale: O fluxo de consciência (stream of consciousness) imita o funcionamento da mente — associações livres, fragmentação, saltos temporais.
        objectives:
          - EF09LP15
  - pageNumber: 9
    title: Drummond e Engajamento – Página 9
    description: Poesia social de Drummond.
    exercises:
      - type: paragraph
        question: "Em 'E agora, José?', Drummond cria um poema de angústia coletiva. O nome 'José' representa: (um personagem histórico específico/o homem comum brasileiro diante de um mundo sem saídas claras/o herói indianista/um personagem de Alencar)"
        correctAnswer: o homem comum brasileiro diante de um mundo sem saídas claras
        difficulty: 5
        rationale: "'José' é um nome genérico que simboliza o homem comum em crise existencial e social — poema escrito no contexto do Estado Novo (1942)."
        objectives:
          - EF09LP14
  - pageNumber: 10
    title: Síntese das Gerações – Página 10
    description: Visão panorâmica das gerações modernistas.
    exercises:
      - type: paragraph
        question: "A diferença essencial entre a 2ª e a 3ª gerações modernistas é que: (a 2ª é mais iconoclasta e humorística; a 3ª é mais engajada/a 2ª aprofunda o engajamento e o regionalismo; a 3ª experimenta a linguagem e a introspecção/a 2ª retoma o Parnasianismo; a 3ª retoma o Romantismo/ambas têm as mesmas características)"
        correctAnswer: a 2ª aprofunda o engajamento e o regionalismo; a 3ª experimenta a linguagem e a introspecção
        difficulty: 5
        rationale: A geração de 30 é marcada pelo social e pelo regional; a geração de 45 e a prosa de Clarice/Guimarães Rosa exploram a linguagem e o universo interior.
        objectives:
          - EF09LP15
target: 10
