title: ✍️ Produção Textual — Artigo de Opinião
level: I
subject: portuguese
difficulty: 5
objectives:
  - EF09LP20
  - EF09LP21
authorNotes: Estrutura, recursos argumentativos e revisão do artigo de opinião — gênero central no ENEM e vestibulares.
example: "O artigo de opinião defende um ponto de vista com argumentos. Ex.: Título + apresentação do tema + tese + argumentos + conclusão → estrutura básica do artigo."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Definição do Gênero – Página 1
    description: O que é o artigo de opinião.
    exercises:
      - type: paragraph
        question: "O artigo de opinião é um gênero: (literário e ficcional/jornalístico-argumentativo que defende um ponto de vista sobre tema polêmico/científico com hipóteses e experimentos/instrucional com comandos diretos)"
        correctAnswer: jornalístico-argumentativo que defende um ponto de vista sobre tema polêmico
        difficulty: 2
        rationale: O artigo de opinião pertence ao domínio jornalístico e tem função argumentativa — defende tese sobre questão controversa.
        objectives:
          - EF09LP20
  - pageNumber: 2
    title: Título – Página 2
    description: Função e características do título.
    exercises:
      - type: paragraph
        question: "Um bom título para artigo de opinião deve: (ser neutro e não revelar o ponto de vista/anunciar o assunto e, idealmente, seduzir o leitor ou indicar o posicionamento/ser longo e explicativo com mais de 20 palavras/evitar qualquer referência ao tema)"
        correctAnswer: anunciar o assunto e, idealmente, seduzir o leitor ou indicar o posicionamento
        difficulty: 2
        rationale: O título é a entrada do texto — deve ser atraente e funcionalmente orientado para o tema e o posicionamento.
        objectives:
          - EF09LP20
  - pageNumber: 3
    title: Apresentação do Tema – Página 3
    description: Contextualização inicial do artigo.
    exercises:
      - type: paragraph
        question: "O parágrafo de abertura do artigo de opinião tem a função de: (já apresentar todos os argumentos em detalhes/contextualizar o tema e conduzir o leitor à tese/concluir o texto/refutar imediatamente o contra-argumento)"
        correctAnswer: contextualizar o tema e conduzir o leitor à tese
        difficulty: 3
        rationale: A abertura contextualiza o debate, desperta interesse e termina apresentando ou anunciando a tese que será defendida.
        objectives:
          - EF09LP20
  - pageNumber: 4
    title: Tese no Artigo – Página 4
    description: Formulação e posicionamento da tese.
    exercises:
      - type: paragraph
        question: "Qual é a melhor formulação de tese para um artigo sobre redes sociais e saúde mental? (As redes sociais existem./Muitas pessoas usam redes sociais./O uso irrestrito de redes sociais por adolescentes compromete o desenvolvimento emocional e deve ser regulamentado./Redes sociais têm prós e contras.)"
        correctAnswer: O uso irrestrito de redes sociais por adolescentes compromete o desenvolvimento emocional e deve ser regulamentado.
        difficulty: 3
        rationale: Uma boa tese é clara, delimitada, polêmica e defensável — apresenta posição e implica argumentação.
        objectives:
          - EF09LP20
  - pageNumber: 5
    title: Argumento de Autoridade – Página 5
    description: Uso adequado de fontes no artigo.
    exercises:
      - type: paragraph
        question: "Ao citar 'Segundo estudo publicado no JAMA Pediatrics, adolescentes com mais de 3 horas de tela por dia apresentam maior risco de depressão', o autor usa: (generalização indevida/argumento de exemplificação/argumento de autoridade com fonte científica verificável/falácia do espantalho)"
        correctAnswer: argumento de autoridade com fonte científica verificável
        difficulty: 3
        rationale: Citar publicação científica identificada é argumento de autoridade legítimo — fortalece a credibilidade da tese.
        objectives:
          - EF09LP21
  - pageNumber: 6
    title: Contra-argumento e Refutação – Página 6
    description: Como tratar objeções no artigo.
    exercises:
      - type: paragraph
        question: "Ao escrever 'Embora as redes facilitem o acesso à informação e à conexão social, os riscos para a saúde mental dos adolescentes superam esses benefícios', o autor: (abandona sua tese/apresenta contra-argumento e o refuta, fortalecendo sua posição/ignora o ponto contrário/comete incoerência argumentativa)"
        correctAnswer: apresenta contra-argumento e o refuta, fortalecendo sua posição
        difficulty: 4
        rationale: Antecipar e refutar o contra-argumento é estratégia retórica que demonstra que o autor conhece o debate e ainda assim mantém sua tese.
        objectives:
          - EF09LP21
  - pageNumber: 7
    title: Conectivos Argumentativos – Página 7
    description: Uso de operadores argumentativos.
    exercises:
      - type: paragraph
        question: "Para introduzir uma conclusão com proposta no artigo, o conectivo mais adequado é: (além disso/por outro lado/portanto, é fundamental que o poder público/ou seja)"
        correctAnswer: portanto, é fundamental que o poder público
        difficulty: 4
        rationale: 'Portanto' é operador de conclusão argumentativa — introduz a síntese final e a proposta de intervenção.
        objectives:
          - EF09LP21
  - pageNumber: 8
    title: Tom e Registro – Página 8
    description: Adequação do registro no artigo de opinião.
    exercises:
      - type: paragraph
        question: "O artigo de opinião deve ser escrito em: (gírias e linguagem coloquial informal/linguagem técnica especializada inacessível ao leitor médio/linguagem formal clara e persuasiva, acessível e rigorosa/fragmentos e linguagem poética)"
        correctAnswer: linguagem formal clara e persuasiva, acessível e rigorosa
        difficulty: 4
        rationale: O artigo de opinião é gênero público de circulação ampla — exige registro formal sem se tornar hermético.
        objectives:
          - EF09LP20
  - pageNumber: 9
    title: Conclusão com Proposta – Página 9
    description: Encerramento do artigo com intervenção.
    exercises:
      - type: paragraph
        question: "A conclusão de um artigo de opinião deve: (simplesmente repetir a introdução/apresentar novos argumentos não mencionados antes/retomar a tese e propor encaminhamento ou intervenção para o problema/encerrar com uma pergunta sem resposta)"
        correctAnswer: retomar a tese e propor encaminhamento ou intervenção para o problema
        difficulty: 5
        rationale: A conclusão fecha o ciclo argumentativo: retoma a tese, sintetiza os argumentos e apresenta solução ou chamada à ação.
        objectives:
          - EF09LP21
  - pageNumber: 10
    title: Revisão do Artigo – Página 10
    description: Critérios de qualidade na revisão textual.
    exercises:
      - type: paragraph
        question: "Ao revisar seu artigo de opinião, o estudante deve verificar principalmente: (se o texto tem rima e métrica/se o texto está coeso, coerente, a tese está clara, os argumentos são consistentes e a linguagem é adequada ao gênero/se os parágrafos têm exatamente 5 linhas/se há pelo menos 3 citações literais)"
        correctAnswer: se o texto está coeso, coerente, a tese está clara, os argumentos são consistentes e a linguagem é adequada ao gênero
        difficulty: 5
        rationale: A revisão de um artigo de opinião deve avaliar coesão, coerência, qualidade argumentativa e adequação ao gênero — não critérios formais de poesia.
        objectives:
          - EF09LP21
target: 10
