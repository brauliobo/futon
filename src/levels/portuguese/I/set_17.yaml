title: 🔍 Leitura e Interpretação Crítica
level: I
subject: portuguese
difficulty: 5
objectives:
  - EF09LP18
  - EF09LP19
authorNotes: Estratégias de leitura crítica — inferência, coerência, reconhecimento de pressupostos, distinção fato/opinião e análise de fontes.
example: "Ler criticamente exige identificar o que o texto diz, implica e pressupõe. Ex.: 'Você ainda não parou de fumar?' → pressupõe que a pessoa fumava; implica cobrança."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Leitura Literal – Página 1
    description: Identificação do que o texto diz explicitamente.
    exercises:
      - type: paragraph
        question: "'O Brasil é o maior produtor de café do mundo.' A leitura literal desse enunciado informa: (que o Brasil exporta mais café que consome/que o Brasil produz mais café que qualquer outro país/que o café brasileiro é o mais saboroso/que o café é o principal alimento do brasileiro)"
        correctAnswer: que o Brasil produz mais café que qualquer outro país
        difficulty: 2
        rationale: A leitura literal extrai apenas o que está dito explicitamente no enunciado, sem acrescentar inferências.
        objectives:
          - EF09LP18
  - pageNumber: 2
    title: Inferência – Página 2
    description: Dedução de informações implícitas.
    exercises:
      - type: paragraph
        question: "'Ao entrar na sala, Maria fechou o guarda-chuva.' Podemos inferir que: (a sala era escura/Maria estava nervosa/estava chovendo ou havia chovido/Maria tinha medo do trovão)"
        correctAnswer: estava chovendo ou havia chovido
        difficulty: 2
        rationale: Inferência é dedução lógica do implícito — fechar o guarda-chuva pressupõe que estava aberto por causa da chuva.
        objectives:
          - EF09LP18
  - pageNumber: 3
    title: Pressuposto – Página 3
    description: Informações tomadas como dadas no enunciado.
    exercises:
      - type: paragraph
        question: "'Quando você parar de mentir, as coisas melhorarão.' Qual é o pressuposto desse enunciado? (que as coisas estão boas/que a pessoa está mentindo/que a pessoa vai parar de mentir em breve/que as coisas não vão melhorar)"
        correctAnswer: que a pessoa está mentindo
        difficulty: 3
        rationale: O pressuposto é informação apresentada como verdade não questionada — 'quando parar' pressupõe que a mentira é fato atual.
        objectives:
          - EF09LP18
  - pageNumber: 4
    title: Fato x Opinião – Página 4
    description: Distinção entre afirmação factual e opinativa.
    exercises:
      - type: paragraph
        question: "Qual das frases abaixo é uma OPINIÃO? (A Independência do Brasil foi proclamada em 1822/O Brasil tem 26 estados e um Distrito Federal/A educação pública brasileira é insuficiente para as necessidades do país/O Rio Amazonas é o maior em volume de água do mundo)"
        correctAnswer: A educação pública brasileira é insuficiente para as necessidades do país
        difficulty: 3
        rationale: Opinião expressa julgamento de valor, não verificável objetivamente como os fatos históricos ou geográficos.
        objectives:
          - EF09LP19
  - pageNumber: 5
    title: Coerência Textual – Página 5
    description: Reconhecimento de incoerência no texto.
    exercises:
      - type: paragraph
        question: "'Sou vegetariano por razões éticas. Ontem almocei um delicioso churrasco de picanha.' Esse texto apresenta: (paradoxo literário/ironia sofisticada/incoerência entre posicionamento declarado e ação relatada/hipérbole)"
        correctAnswer: incoerência entre posicionamento declarado e ação relatada
        difficulty: 3
        rationale: Incoerência textual ocorre quando elementos do texto contradizem-se sem intenção irônica ou lógica interna justificável.
        objectives:
          - EF09LP18
  - pageNumber: 6
    title: Fonte e Credibilidade – Página 6
    description: Avaliação da confiabilidade de fontes.
    exercises:
      - type: paragraph
        question: "Uma notícia sobre saúde publicada por um blog sem autoria identificada, sem referências científicas e com linguagem alarmista deve ser tratada como: (fonte totalmente confiável/notícia fake, possivelmente/fonte científica primária/depoimento de autoridade)"
        correctAnswer: notícia fake, possivelmente
        difficulty: 4
        rationale: A ausência de autoria, referências verificáveis e linguagem manipuladora são alertas para desinformação — leitura crítica exige avaliar a fonte.
        objectives:
          - EF09LP19
  - pageNumber: 7
    title: Viés Ideológico – Página 7
    description: Identificação de viés nos textos.
    exercises:
      - type: paragraph
        question: "Uma manchete que diz 'Criminosos invadem propriedade de empresário' e outra que diz 'Sem-terra ocupam fazenda improdutiva' descrevem o mesmo fato com: (vieses ideológicos opostos que revelam posicionamentos diferentes/linguagem neutra e objetiva/figuras de linguagem/variação regional)"
        correctAnswer: vieses ideológicos opostos que revelam posicionamentos diferentes
        difficulty: 4
        rationale: A escolha lexical ('criminosos/sem-terra'; 'invadem/ocupam'; 'propriedade/fazenda improdutiva') revela posicionamento ideológico do veículo.
        objectives:
          - EF09LP19
  - pageNumber: 8
    title: Efeitos de Sentido – Página 8
    description: Análise de escolhas linguísticas e seus efeitos.
    exercises:
      - type: paragraph
        question: "O uso de 'faleceu' em vez de 'morreu' em uma notícia cria o efeito de: (dramatizar a morte/suavizar e formalizar o relato/ironizar o fato/criar ambiguidade)"
        correctAnswer: suavizar e formalizar o relato
        difficulty: 4
        rationale: 'Faleceu' é eufemismo mais formal — a escolha lexical impacta o tom e o efeito de sentido sobre o leitor.
        objectives:
          - EF09LP18
  - pageNumber: 9
    title: Leitura Multimodal – Página 9
    description: Integração de texto verbal e imagem.
    exercises:
      - type: paragraph
        question: "Em uma charge, a relação entre o texto verbal e a imagem cria sentido por: (justaposição aleatória sem intenção/complementação ou contradição irônica entre verbal e visual/mera decoração da página/reforço redundante sem acréscimo de sentido)"
        correctAnswer: complementação ou contradição irônica entre verbal e visual
        difficulty: 5
        rationale: Na charge e em textos multimodais, verbal e visual interagem — se completam ou se contradizem para produzir ironia, crítica ou humor.
        objectives:
          - EF09LP19
  - pageNumber: 10
    title: Leitura Crítica Integrada – Página 10
    description: Síntese das estratégias de leitura crítica.
    exercises:
      - type: paragraph
        question: "A leitura crítica vai além da literal ao: (ignorar o contexto de produção/aceitar toda informação como verdadeira/identificar implícitos, pressupostos, vieses e avaliar a confiabilidade do texto/focar apenas na gramática do texto)"
        correctAnswer: identificar implícitos, pressupostos, vieses e avaliar a confiabilidade do texto
        difficulty: 5
        rationale: Leitura crítica é um conjunto de estratégias que envolvem inferência, reconhecimento de viés, avaliação de fontes e análise dos efeitos de sentido.
        objectives:
          - EF09LP19
target: 10
