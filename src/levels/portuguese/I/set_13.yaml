title: 🔭 Realismo e Naturalismo
level: I
subject: portuguese
difficulty: 5
objectives:
  - EF09LP12
  - EF09LP13
authorNotes: Principais obras, autores e temas do Realismo e Naturalismo brasileiros (1881–1902), com destaque para Machado de Assis e Aluísio Azevedo.
example: "O Realismo critica objetivamente a sociedade burguesa; o Naturalismo aplica o determinismo científico. Ex.: 'Dom Casmurro' → narrador não-confiável como crítica à subjetividade humana."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 55
pages:
  - pageNumber: 1
    title: Marco do Realismo – Página 1
    description: O início do Realismo no Brasil.
    exercises:
      - type: paragraph
        question: "O marco inaugural do Realismo brasileiro é considerado a publicação de 'Memórias Póstumas de Brás Cubas' (1881), de: (Aluísio Azevedo/Raul Pompéia/José de Alencar/Machado de Assis)"
        correctAnswer: Machado de Assis
        difficulty: 2
        rationale: "'Memórias Póstumas de Brás Cubas' (1881) de Machado de Assis inaugura o Realismo brasileiro."
        objectives:
          - EF09LP12
  - pageNumber: 2
    title: Características Realistas – Página 2
    description: Traços definidores do Realismo.
    exercises:
      - type: paragraph
        question: "Qual característica é própria do Realismo? (idealização do amor e da natureza/herói nobre e perfeito/análise objetiva da sociedade e do comportamento humano/escapismo para o passado medieval)"
        correctAnswer: análise objetiva da sociedade e do comportamento humano
        difficulty: 2
        rationale: O Realismo rejeita a idealização romântica e busca representar a realidade com objetividade e crítica social.
        objectives:
          - EF09LP12
  - pageNumber: 3
    title: Narrador Não-Confiável – Página 3
    description: Técnica machadiana do narrador questionável.
    exercises:
      - type: paragraph
        question: "Em 'Dom Casmurro', Bentinho narra a própria história e culpa Capitu. O leitor deve: (aceitar a versão do narrador como verdade absoluta/questionar a versão de Bentinho, pois ele é narrador não-confiável/ignorar a perspectiva de Capitu/ler a obra como romance indianista)"
        correctAnswer: questionar a versão de Bentinho, pois ele é narrador não-confiável
        difficulty: 3
        rationale: Machado cria um narrador subjetivo e parcial — uma das maiores inovações da literatura brasileira.
        objectives:
          - EF09LP13
  - pageNumber: 4
    title: Naturalismo – Página 4
    description: Determinismo e cientificismo no Naturalismo.
    exercises:
      - type: paragraph
        question: "O Naturalismo aplica à literatura o determinismo científico, mostrando que o comportamento humano é condicionado por: (livre-arbítrio/hereditariedade, meio e momento histórico/religião e moral/escolhas individuais racionais)"
        correctAnswer: hereditariedade, meio e momento histórico
        difficulty: 3
        rationale: A tríade naturalista (hereditariedade, meio, momento) é base do determinismo de Hippolyte Taine, adotado pelo Naturalismo.
        objectives:
          - EF09LP12
  - pageNumber: 5
    title: Aluísio Azevedo – Página 5
    description: Principal autor naturalista brasileiro.
    exercises:
      - type: paragraph
        question: "'O Cortiço' (1890), de Aluísio Azevedo, retrata: (a aristocracia rural brasileira/a vida de imigrantes em cortiços cariocas com foco no determinismo social/o amor idealizado de personagens nobres/a saga de um índio brasileiro)"
        correctAnswer: a vida de imigrantes em cortiços cariocas com foco no determinismo social
        difficulty: 3
        rationale: "'O Cortiço' é o principal romance naturalista brasileiro, com personagens condicionadas pelo ambiente degradante."
        objectives:
          - EF09LP12
  - pageNumber: 6
    title: Machado de Assis – Fases – Página 6
    description: Distinção entre as duas fases machadianas.
    exercises:
      - type: paragraph
        question: "A segunda fase de Machado de Assis (a partir de 'Memórias Póstumas') se distingue da primeira por: (maior idealismo e otimismo/adoção do indianismo/uso de ironia, pessimismo e análise psicológica profunda/abandono da prosa para a poesia)"
        correctAnswer: uso de ironia, pessimismo e análise psicológica profunda
        difficulty: 4
        rationale: A 2ª fase machadiana rompe com o romantismo inicial e adota ironia corrosiva, pessimismo filosófico e análise do comportamento humano.
        objectives:
          - EF09LP13
  - pageNumber: 7
    title: Capitu – Análise – Página 7
    description: Interpretação literária de personagem clássica.
    exercises:
      - type: paragraph
        question: "Os 'olhos de ressaca' de Capitu, descritos por Bentinho em 'Dom Casmurro', são: (uma metáfora de tristeza/uma comparação com o mar como traço marcante e inquietante da personagem/uma hipérbole sem significado/uma onomatopeia)"
        correctAnswer: uma comparação com o mar como traço marcante e inquietante da personagem
        difficulty: 4
        rationale: A célebre descrição dos olhos de Capitu usa metáfora marítima que sugere profundidade, ambiguidade e sedução da personagem.
        objectives:
          - EF09LP13
  - pageNumber: 8
    title: Parnasianismo – Página 8
    description: Estética parnasiana contemporânea ao Realismo.
    exercises:
      - type: paragraph
        question: "Olavo Bilac, Raimundo Correia e Alberto de Oliveira são os três grandes do Parnasianismo, que valoriza: (subjetivismo e espontaneidade/forma perfeita, objetividade e 'a arte pela arte'/engajamento social/linguagem coloquial)"
        correctAnswer: forma perfeita, objetividade e 'a arte pela arte'
        difficulty: 4
        rationale: O Parnasianismo reage ao subjetivismo romântico, cultuando a forma poética perfeita e o ideal de arte desinteressada.
        objectives:
          - EF09LP12
  - pageNumber: 9
    title: Simbolismo – Página 9
    description: Poesia simbolista e seu misticismo.
    exercises:
      - type: paragraph
        question: "Cruz e Sousa, principal simbolista brasileiro, usa música, sugestão e espiritualidade na poesia. O Simbolismo reage contra: (o indianismo/o objetivismo parnasiano e o determinismo naturalista/a norma culta/o teatro greco-romano)"
        correctAnswer: o objetivismo parnasiano e o determinismo naturalista
        difficulty: 5
        rationale: O Simbolismo surge como reação ao materialismo e ao objetivismo do Parnasianismo e do Naturalismo, retomando a musicalidade e o espiritualismo.
        objectives:
          - EF09LP12
  - pageNumber: 10
    title: Síntese do Período – Página 10
    description: Visão panorâmica do Realismo/Naturalismo.
    exercises:
      - type: paragraph
        question: "A principal diferença entre Realismo e Naturalismo é que o Naturalismo: (abandona a prosa pelo verso/ignora a crítica social/radicaliza o determinismo científico, mostrando o homem dominado pelo meio e pela biologia/valoriza a religiosidade)"
        correctAnswer: radicaliza o determinismo científico, mostrando o homem dominado pelo meio e pela biologia
        difficulty: 5
        rationale: O Naturalismo é uma vertente radicalizada do Realismo, com base no positivismo e darwinismo — o ser humano é produto do meio e da hereditariedade.
        objectives:
          - EF09LP13
target: 10
