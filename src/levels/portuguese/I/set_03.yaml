title: Figuras de Construção
level: I
subject: portuguese
difficulty: 3
objectives: [EF09LP04, EF09LP05]
authorNotes: Anáfora, polissíndeto, assíndeto, elipse, pleonasmo, zeugma, anacoluto, hipérbato.
example: "É preciso viver. Viver intensamente. Viver sem medo — anáfora. Ex.: 'Ele prefere cinema; ela, teatro' tem zeugma de: → prefere."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 60
pages:
  - pageNumber: 1
    title: Anáfora
    description: Repetição intencional no início de frases.
    exercises:
      - type: paragraph
        question: "'Viva a vida, viva o amor, viva a paz' usa: (pleonasmo/zeugma/elipse/anáfora)"
        correctAnswer: anáfora
        difficulty: 2
        rationale: Repetição do mesmo termo inicial.
        objectives: [EF09LP04]
  - pageNumber: 2
    title: Polissíndeto
    description: Repetição da conjunção.
    exercises:
      - type: paragraph
        question: "'E anda e corre e voa e grita' é: (assíndeto/anáfora/polissíndeto/elipse)"
        correctAnswer: polissíndeto
        difficulty: 2
        rationale: Conjunção 'e' repetida enfatiza.
        objectives: [EF09LP04]
  - pageNumber: 3
    title: Assíndeto
    description: Ausência de conjunção; só vírgulas.
    exercises:
      - type: paragraph
        question: "'Cheguei, vi, venci' é: (elipse/hipérbato/polissíndeto/assíndeto)"
        correctAnswer: assíndeto
        difficulty: 2
        rationale: Coordenação sem conjunções.
        objectives: [EF09LP04]
  - pageNumber: 4
    title: Elipse
    description: Omissão de termo recuperável pelo contexto.
    exercises:
      - type: paragraph
        question: "'Na sala, três alunos' — há elipse de: (sujeito/adjunto/objeto/verbo)"
        correctAnswer: verbo
        difficulty: 2
        rationale: Omissão de 'estão/há'.
        objectives: [EF09LP05]
  - pageNumber: 5
    title: Pleonasmo
    description: Repetição enfática; pode ser vicioso.
    exercises:
      - type: paragraph
        question: "'Subir para cima' é pleonasmo: (enfático/vicioso/intencional/estilístico)"
        correctAnswer: vicioso
        difficulty: 2
        rationale: Repetição desnecessária, considerada erro.
        objectives: [EF09LP05]
  - pageNumber: 6
    title: Zeugma
    description: Omissão de termo já expresso na oração anterior.
    exercises:
      - type: paragraph
        question: "'Ele prefere cinema; ela, teatro' tem zeugma de: (teatro/ela/prefere/ele)"
        correctAnswer: prefere
        difficulty: 3
        rationale: O verbo anterior é retomado implicitamente.
        objectives: [EF09LP05]
  - pageNumber: 7
    title: Anacoluto
    description: Quebra da construção sintática esperada.
    exercises:
      - type: paragraph
        question: "'Eu, parece que vou chorar' apresenta: (elipse/pleonasmo/zeugma/anacoluto)"
        correctAnswer: anacoluto
        difficulty: 3
        rationale: "'Eu' não exerce função sintática no resto da frase."
        objectives: [EF09LP05]
  - pageNumber: 8
    title: Hipérbato
    description: Inversão da ordem natural dos termos.
    exercises:
      - type: paragraph
        question: "'Das Musas que em Helicona habitam, canto' tem: (pleonasmo/zeugma/hipérbato/anáfora)"
        correctAnswer: hipérbato
        difficulty: 3
        rationale: A ordem direta seria 'canto as musas que habitam em Helicona'.
        objectives: [EF09LP05]
  - pageNumber: 9
    title: Silepse
    description: Concordância ideológica em vez de gramatical.
    exercises:
      - type: paragraph
        question: "'A turma chegamos atrasados' é silepse de: (tempo/gênero/pessoa/número)"
        correctAnswer: pessoa
        difficulty: 3
        rationale: Concorda com 'nós' (implícito), não com 'turma'.
        objectives: [EF09LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Reconheça a figura de construção.
    exercises:
      - type: paragraph
        question: "'Lágrimas salgadas, amargos sorrisos, silêncios pesados' usa: (elipse do verbo/polissíndeto/anacoluto/hipérbato)"
        correctAnswer: elipse do verbo
        difficulty: 3
        rationale: O verbo de ligação está omitido.
        objectives: [EF09LP05]
target: 10
