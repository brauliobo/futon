title: Figuras de Pensamento
level: I
subject: portuguese
difficulty: 4
objectives: [EF09LP04, EF09LP05]
authorNotes: Antítese, paradoxo, ironia, hipérbole, eufemismo, personificação (prosopopeia), gradação, apóstrofe.
example: "O silêncio gritava dentro dele — personificação + paradoxo."
pages:
  - pageNumber: 1
    title: Antítese
    description: Justaposição de ideias contrárias.
    exercises:
      - type: paragraph
        question: "'Amor e ódio habitavam o mesmo coração' é: (antítese/paradoxo/ironia/hipérbole)"
        correctAnswer: antítese
        difficulty: 3
        rationale: Opostos coexistem claramente; não há contradição lógica.
        objectives: [EF09LP04]
  - pageNumber: 2
    title: Paradoxo
    description: Ideia que se contradiz logicamente mas faz sentido.
    exercises:
      - type: paragraph
        question: "'O silêncio gritava' é: (paradoxo/antítese/metáfora/hipérbole)"
        correctAnswer: paradoxo
        difficulty: 4
        rationale: Contradição interna no próprio conceito.
        objectives: [EF09LP04]
  - pageNumber: 3
    title: Ironia
    description: Diz o contrário do que se pensa, com tom crítico.
    exercises:
      - type: paragraph
        question: "Dizer 'que beleza!' ao ver algo feio é: (ironia/antítese/hipérbole/metáfora)"
        correctAnswer: ironia
        difficulty: 3
        rationale: Afirmação oposta ao sentido real.
        objectives: [EF09LP05]
  - pageNumber: 4
    title: Hipérbole
    description: Exagero proposital.
    exercises:
      - type: paragraph
        question: "'Estou morrendo de fome' é: (hipérbole/metáfora/antítese/ironia)"
        correctAnswer: hipérbole
        difficulty: 2
        rationale: Exagero para intensificar.
        objectives: [EF09LP04]
  - pageNumber: 5
    title: Eufemismo
    description: Suaviza o que é desagradável.
    exercises:
      - type: paragraph
        question: "'Partiu desta para melhor' em vez de 'morreu' é: (eufemismo/hipérbole/ironia/paradoxo)"
        correctAnswer: eufemismo
        difficulty: 3
        rationale: Atenua palavra desagradável.
        objectives: [EF09LP05]
  - pageNumber: 6
    title: Personificação (Prosopopeia)
    description: Atribui características humanas a seres não humanos.
    exercises:
      - type: paragraph
        question: "'O vento sussurrava segredos' é: (personificação/metáfora/metonímia/comparação)"
        correctAnswer: personificação
        difficulty: 3
        rationale: "'Sussurrar' é ação humana aplicada ao vento."
        objectives: [EF09LP04]
  - pageNumber: 7
    title: Gradação
    description: Ideias em sequência crescente ou decrescente.
    exercises:
      - type: paragraph
        question: "'Vim, vi, venci' é: (gradação/antítese/hipérbole/ironia)"
        correctAnswer: gradação
        difficulty: 3
        rationale: Sequência progressiva de ações.
        objectives: [EF09LP05]
  - pageNumber: 8
    title: Apóstrofe
    description: Chamamento enfático a pessoa, entidade ou coisa personificada.
    exercises:
      - type: paragraph
        question: "'Ó mar salgado, quanto do teu sal são lágrimas de Portugal' (Pessoa) é: (apóstrofe/metáfora/eufemismo/hipérbole)"
        correctAnswer: apóstrofe
        difficulty: 4
        rationale: Chamamento direto ao mar.
        objectives: [EF09LP05]
  - pageNumber: 9
    title: Hipérbole x Gradação
    description: Hipérbole exagera; gradação escalona.
    exercises:
      - type: paragraph
        question: "'Mil vezes te avisei' é: (hipérbole/gradação/antítese/paradoxo)"
        correctAnswer: hipérbole
        difficulty: 3
        rationale: Exagero numérico para intensificar.
        objectives: [EF09LP04]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique a figura.
    exercises:
      - type: paragraph
        question: "'Ela é doce como mel, áspera como espinho' usa: (antítese/gradação/hipérbole/ironia)"
        correctAnswer: antítese
        difficulty: 4
        rationale: Duas qualidades opostas coexistem.
        objectives: [EF09LP05]
target: 10
