title: Palavras Simples - Cores
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — cores. Associe palavra à imagem."
example: "Reconheça palavras simples de cores. Ex.: Escolha AZUL: → AZUL."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: AZUL
    description: Reconheça a palavra AZUL.
    exercises:
      - type: reading
        question: "Escolha AZUL: (AZUL/AZOL/AZIL)"
        correctAnswer: AZUL
        rationale: "AZUL é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: ROSA
    description: Reconheça a palavra ROSA.
    exercises:
      - type: reading
        question: "Escolha ROSA: (RASA/RUSA/ROSA)"
        correctAnswer: ROSA
        rationale: "ROSA é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: ROXO
    description: Reconheça a palavra ROXO.
    exercises:
      - type: reading
        question: "Escolha ROXO: (ROXO/RAXO/REXO)"
        correctAnswer: ROXO
        rationale: "ROXO é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: VERDE
    description: Reconheça a palavra VERDE.
    exercises:
      - type: reading
        question: "Escolha VERDE: (VIRDE/VERDE/VARDE)"
