    exercises:
      - type: reading
        question: "Escolha PRETO: (PRUTO/PRETO/PRATO)"
        correctAnswer: PRETO
        rationale: "PRETO é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: BRANCO
    description: Reconheça a palavra BRANCO.
    exercises:
      - type: reading
        question: "Escolha BRANCO: (BRANCO/BRENCO/BRONCO)"
        correctAnswer: BRANCO
        rationale: "BRANCO é a palavra correta — leia letra por letra e compare."
