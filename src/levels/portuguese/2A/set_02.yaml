title: Reconhecimento de Consoantes - B, C, D
level: 2A
subject: portuguese
example: Identifique e reconheça consoantes básicas.
pages:
  - pageNumber: 1
    title: Letra B
    description: Reconheça a letra B.
    exercises:
      - type: reading
        question: "Escolha a letra B: (A/B/C)"
        correctAnswer: B
  - pageNumber: 2
    title: Letra C
    description: Reconheça a letra C.
    exercises:
      - type: reading
        question: "Escolha a letra C: (B/C/D)"
        correctAnswer: C
  - pageNumber: 3
    title: Letra D
    description: Reconheça a letra D.
    exercises:
      - type: reading
        question: "Escolha a letra D: (C/D/E)"
        correctAnswer: D
  - pageNumber: 4
    title: B de BOLA
    description: Reconheça palavras com B.
    exercises:
      - type: reading
        question: "B de: (BOLA/COLA/DOLA)"
        correctAnswer: BOLA
  - pageNumber: 5
    title: C de CASA
    description: Reconheça palavras com C.
    exercises:
      - type: reading
        question: "C de: (BASA/CASA/DASA)"
        correctAnswer: CASA
  - pageNumber: 6
    title: D de DADO
    description: Reconheça palavras com D.
    exercises:
      - type: reading
        question: "D de: (BADO/CADO/DADO)"
        correctAnswer: DADO
  - pageNumber: 7
    title: Encontrar B
    description: Encontre a letra B.
    exercises:
      - type: reading
        question: "'BOCA' começa com B? (sim/não)"
        correctAnswer: sim
  - pageNumber: 8
    title: Encontrar C
    description: Encontre a letra C.
    exercises:
      - type: reading
        question: "'CAMA' começa com C? (sim/não)"
        correctAnswer: sim
  - pageNumber: 9
    title: Encontrar D
    description: Encontre a letra D.
    exercises:
      - type: reading
        question: "'DEDO' começa com D? (sim/não)"
        correctAnswer: sim
  - pageNumber: 10
    title: Revisão BCD
    description: Reconheça todas as letras.
    exercises:
      - type: reading
        question: "Qual letra falta em _OCA? (B/C/D)"
        correctAnswer: B
target: 10
