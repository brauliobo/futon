title: Reconhecimento de Consoantes - B, C, D
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Sílabas simples e formação de palavras curtas."
example: "Identifique e reconheça consoantes básicas. Ex.: Escolha a letra B: → B."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letra B
    description: Reconheça a letra B.
    exercises:
      - type: reading
        question: "Escolha a letra B: (A/B/C)"
        correctAnswer: B
        rationale: "B — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Letra C
    description: Reconheça a letra C.
    exercises:
      - type: reading
        question: "Escolha a letra C: (B/C/D)"
        correctAnswer: C
        rationale: "C — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: Letra D
    description: Reconheça a letra D.
    exercises:
      - type: reading
        question: "Escolha a letra D: (C/D/E)"
        correctAnswer: D
        rationale: "D — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: B de BOLA
    description: Reconheça palavras com B.
    exercises:
      - type: reading
        question: "B de: (BOLA/COLA/DOLA)"
        correctAnswer: BOLA
        rationale: "B aparece em BOLA como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 5
    title: C de CASA
    description: Reconheça palavras com C.
    exercises:
      - type: reading
        question: "C de: (BASA/CASA/DASA)"
        correctAnswer: CASA
        rationale: "C aparece em CASA como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: D de DADO
    description: Reconheça palavras com D.
    exercises:
      - type: reading
        question: "D de: (BADO/CADO/DADO)"
        correctAnswer: DADO
        rationale: "D aparece em DADO como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 7
    title: Encontrar B
    description: Encontre a letra B.
    exercises:
      - type: reading
        question: "'BOCA' começa com B? (sim/não)"
        correctAnswer: sim
        rationale: "'BOCA' começa com a letra B."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 8
    title: Encontrar C
    description: Encontre a letra C.
    exercises:
      - type: reading
        question: "'CAMA' começa com C? (sim/não)"
        correctAnswer: sim
        rationale: "'CAMA' começa com a letra C."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 9
    title: Encontrar D
    description: Encontre a letra D.
    exercises:
      - type: reading
        question: "'DEDO' começa com D? (sim/não)"
        correctAnswer: sim
        rationale: "'DEDO' começa com a letra D."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 10
    title: Revisão BCD
    description: Reconheça todas as letras.
    exercises:
      - type: reading
        question: Qual letra falta em _OCA? (B/C/D)
        correctAnswer: B
        rationale: "A letra B completa a palavra: BOCA."
        difficulty: 2
        objectives: [pt.literacy]
target: 10
