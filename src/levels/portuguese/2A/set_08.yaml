title: Palavras Simples - Comida
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — comida. Palavras de alta frequência."
example: "Reconheça palavras simples de comida. Ex.: Escolha PÃO: → PÃO."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: PÃO
    description: Reconheça a palavra PÃO.
    exercises:
      - type: reading
        question: "Escolha PÃO: (CÃO/MÃO/PÃO)"
        correctAnswer: PÃO
        rationale: "PÃO é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: LEITE
    description: Reconheça a palavra LEITE.
    exercises:
      - type: reading
        question: "Escolha LEITE: (LENTE/LEITE/LESTE)"
        correctAnswer: LEITE
        rationale: "LEITE é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: OVO
    description: Reconheça a palavra OVO.
    exercises:
      - type: reading
        question: "Escolha OVO: (UVO/OVO/AVO)"
        correctAnswer: OVO
        rationale: "OVO é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: ÁGUA
    description: Reconheça a palavra ÁGUA.
    exercises:
      - type: reading
        question: "Escolha ÁGUA: (AGUI/AGOA/ÁGUA)"
        correctAnswer: ÁGUA
        rationale: "ÁGUA é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 5
    title: SOPA
    description: Reconheça a palavra SOPA.
    exercises:
      - type: reading
        question: "Escolha SOPA: (SEPA/SUPE/SOPA)"
        correctAnswer: SOPA
        rationale: "SOPA é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: BOLO
    description: Reconheça a palavra BOLO.
    exercises:
      - type: reading
        question: "Escolha BOLO: (BULO/BOLO/BALO)"
        correctAnswer: BOLO
        rationale: "BOLO é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 7
    title: Completar P_O
    description: Complete a palavra PÃO.
    exercises:
      - type: reading
        question: "P_O é: (PIO/PEO/PÃO)"
        correctAnswer: PÃO
        rationale: "A letra que completa 'P_O' forma 'PÃO'."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 8
    title: Completar LEI_E
    description: Complete a palavra LEITE.
    exercises:
      - type: reading
        question: "LEI_E é: (LEISE/LEIRE/LEITE)"
        correctAnswer: LEITE
        rationale: "A letra que completa 'LEI_E' forma 'LEITE'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 9
    title: Completar BO_O
    description: Complete a palavra BOLO.
    exercises:
      - type: reading
        question: "BO_O é: (BOLO/BOMO/BOPO)"
        correctAnswer: BOLO
        rationale: "A letra que completa 'BO_O' forma 'BOLO'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 10
    title: O que Bebemos
    description: Escolha o que bebemos.
    exercises:
      - type: reading
        question: O que bebemos? (PÃO/LEITE/BOLO)
        correctAnswer: LEITE
        rationale: "LEITE é líquido (bebemos); pão e bolo são sólidos (comemos)."
        difficulty: 2
        objectives: [pt.literacy]
target: 10
