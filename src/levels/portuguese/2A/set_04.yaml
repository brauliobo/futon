title: Consoantes J, K, L
level: 2A
subject: portuguese
example: Continue aprendendo consoantes.
pages:
  - pageNumber: 1
    title: Letra J
    description: Reconheça a letra J.
    exercises:
      - { type: reading, question: ""Escolha a letra J: (I/J/K)"", correctAnswer: J }
  - pageNumber: 2
    title: Letra K
    description: Reconheça a letra K.
    exercises:
      - { type: reading, question: ""Escolha a letra K: (J/K/L)"", correctAnswer: K }
  - pageNumber: 3
    title: Letra L
    description: Reconheça a letra L.
    exercises:
      - { type: reading, question: ""Escolha a letra L: (K/L/M)"", correctAnswer: L }
  - pageNumber: 4
    title: J de JOGO
    description: Reconheça palavras com J.
    exercises:
      - { type: reading, question: ""J de: (JOGO/KOGO/LOGO)"", correctAnswer: JOGO }
  - pageNumber: 5
    title: K de KIWI
    description: Reconheça palavras com K.
    exercises:
      - { type: reading, question: ""K de: (JIWI/KIWI/LIWI)"", correctAnswer: KIWI }
  - pageNumber: 6
    title: L de LUA
