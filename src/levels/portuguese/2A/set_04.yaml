title: Consoantes J, K, L
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Consoantes J, K, L. K só aparece em empréstimos e nomes próprios."
example: "Continue aprendendo consoantes. Ex.: Escolha a letra J: → J."
pages:
  - pageNumber: 1
    title: Letra J
    description: Reconheça a letra J.
    exercises:
      - type: reading
        question: "Escolha a letra J: (I/J/K)"
        correctAnswer: J
        rationale: "J — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Letra K
    description: Reconheça a letra K.
    exercises:
      - type: reading
        question: "Escolha a letra K: (J/K/L)"
        correctAnswer: K
        rationale: "K — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: Letra L
    description: Reconheça a letra L.
    exercises:
      - type: reading
        question: "Escolha a letra L: (K/L/M)"
        correctAnswer: L
        rationale: "L — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: J de JOGO
    description: Reconheça palavras com J.
    exercises:
      - type: reading
        question: "J de: (JOGO/KOGO/LOGO)"
        correctAnswer: JOGO
        rationale: "J aparece em JOGO como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 5
    title: K de KIWI
    description: Reconheça palavras com K.
    exercises:
      - type: reading
        question: "K de: (JIWI/KIWI/LIWI)"
        correctAnswer: KIWI
        rationale: "K aparece em KIWI como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: L de LUA
    description: Reconheça palavras com L.
    exercises:
      - type: reading
        question: "L de: (JUA/KUA/LUA)"
        correctAnswer: LUA
        rationale: "L aparece em LUA como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 7
    title: Identificar J
    description: Encontre a letra J.
    exercises:
      - type: reading
        question: "'JANELA' começa com J? (sim/não)"
        correctAnswer: sim
        rationale: "'JANELA' começa com a letra J."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 8
    title: Identificar K
    description: Encontre a letra K.
    exercises:
      - type: reading
        question: "'KARATÊ' começa com K? (sim/não)"
        correctAnswer: sim
        rationale: "A resposta correta é 'sim'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 9
    title: Identificar L
    description: Encontre a letra L.
    exercises:
      - type: reading
        question: "'LIVRO' começa com L? (sim/não)"
        correctAnswer: sim
        rationale: "'LIVRO' começa com a letra L."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 10
    title: Revisão JKL
    description: Reconheça as três letras.
    exercises:
      - type: reading
        question: Qual letra falta em _UVA? (J/K/L)
        correctAnswer: L
        rationale: "A letra L completa a palavra: LUVA."
        difficulty: 2
        objectives: [pt.literacy]
target: 10
