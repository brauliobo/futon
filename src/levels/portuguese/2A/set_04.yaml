  - pageNumber: 8
    title: Identificar K
    description: Encontre a letra K.
    exercises:
      - { type: reading, question: ""'KARATÊ' começa com K? (sim/não)"", correctAnswer: sim }
  - pageNumber: 9
    title: Identificar L
    description: Encontre a letra L.
    exercises:
      - { type: reading, question: ""'LIVRO' começa com L? (sim/não)"", correctAnswer: sim }
  - pageNumber: 10
    title: Revisão JKL
    description: Reconheça as três letras.
    exercises:
      - { type: reading, question: ""Qual letra falta em _UVA? (J/K/L)"", correctAnswer: L }
target: 10
