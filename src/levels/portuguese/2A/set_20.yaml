title: Revisão Geral
level: 2A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/2A.
example: Revisão de tudo que aprendemos.
pages:
  - pageNumber: 1
    title: Vogais
    description: Reconheça vogais.
    exercises:
      - { type: reading, question: "Qual é uma vogal? (A/B/C)", correctAnswer: A }
  - pageNumber: 2
    title: Consoantes
    description: Reconheça consoantes.
    exercises:
      - { type: reading, question: "Qual é uma consoante? (A/B/E)", correctAnswer: B }
  - pageNumber: 3
    title: Palavras Familiares
    description: Reconheça palavras da família.
    exercises:
      - { type: reading, question: "Quem cuida dos filhos? (PAPAI/MESA/BOLA)", correctAnswer: PAPAI }
  - pageNumber: 4
    title: Animais
    description: Reconheça animais.
    exercises:
      - { type: reading, question: "Qual é um animal? (CASA/GATO/MESA)", correctAnswer: GATO }
  - pageNumber: 5
    title: Cores
    description: Reconheça cores.
    exercises:
      - { type: reading, question: "Qual é uma cor? (AZUL/CASA/PAPAI)", correctAnswer: AZUL }
  - pageNumber: 6
    title: Números
    description: Reconheça números.
    exercises:
      - { type: reading, question: "Qual é um número? (TRÊS/GATO/MESA)", correctAnswer: TRÊS }
  - pageNumber: 7
    title: Comida
    description: Reconheça comida.
    exercises:
      - { type: reading, question: "O que comemos? (PÃO/CASA/SOL)", correctAnswer: PÃO }
  - pageNumber: 8
    title: Ações
    description: Reconheça ações.
    exercises:
      - { type: reading, question: "O que fazemos quando temos fome? (DORME/COME/CORRE)", correctAnswer: COME }
  - pageNumber: 9
    title: Casa
    description: Reconheça coisas da casa.
    exercises:
      - { type: reading, question: "Onde dormimos? (CAMA/GATO/SOL)", correctAnswer: CAMA }
  - pageNumber: 10
    title: Parabéns!
    description: Você completou o nível 2A!
    exercises:
      - { type: reading, question: "Você aprendeu muito! Está pronto para o próximo nível? (SIM/NÃO)", correctAnswer: SIM }
target: 10
