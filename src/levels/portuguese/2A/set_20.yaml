title: Revisão Geral
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Revisão de tudo que aprendemos. Ex.: Qual é uma vogal? → A."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Vogais
    description: Reconheça vogais.
    exercises:
      - type: reading
        question: Qual é uma vogal? (A/B/C)
        correctAnswer: A
        rationale: "'A' é um(a) vogal. Lembre: A, E, I, O, U são as vogais."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Consoantes
    description: Reconheça consoantes.
    exercises:
      - type: reading
        question: Qual é uma consoante? (A/B/E)
        correctAnswer: B
        rationale: "'B' é um(a) consoante. Lembre: B, C, D, F, G, H, J, K, L, M, N, P, Q, R, S, T, V, W, X, Y, Z são consoantes."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: Palavras Familiares
    description: Reconheça palavras da família.
    exercises:
      - type: reading
        question: Quem cuida dos filhos? (PAPAI/MESA/BOLA)
        correctAnswer: PAPAI
        rationale: "Observe as opções e escolha a que responde \"Quem cuida dos filhos?\": 'PAPAI'."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: Animais
    description: Reconheça animais.
    exercises:
      - type: reading
        question: Qual é um animal? (CASA/GATO/MESA)
        correctAnswer: GATO
        rationale: "'GATO' é um(a) animal. Lembre: animais são seres vivos (gato, cachorro, pássaro…)."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 5
    title: Cores
    description: Reconheça cores.
    exercises:
      - type: reading
        question: Qual é uma cor? (AZUL/CASA/PAPAI)
        correctAnswer: AZUL
        rationale: "'AZUL' é um(a) cor. Lembre: cores descrevem tonalidade (azul, vermelho, verde…)."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: Números
    description: Reconheça números.
    exercises:
      - type: reading
        question: Qual é um número? (TRÊS/GATO/MESA)
        correctAnswer: TRÊS
        rationale: "'TRÊS' é a opção que corresponde a \"n\". Observe as outras e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 7
    title: Comida
    description: Reconheça comida.
    exercises:
      - type: reading
        question: O que comemos? (PÃO/CASA/SOL)
        correctAnswer: PÃO
        rationale: "Observe as opções e escolha a que responde \"O que comemos?\": 'PÃO'."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 8
    title: Ações
    description: Reconheça ações.
    exercises:
      - type: reading
        question: O que fazemos quando temos fome? (DORME/COME/CORRE)
        correctAnswer: COME
        rationale: "Observe as opções e escolha a que responde \"O que fazemos quando temos fome?\": 'COME'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 9
    title: Casa
    description: Reconheça coisas da casa.
    exercises:
      - type: reading
        question: Onde dormimos? (CAMA/GATO/SOL)
        correctAnswer: CAMA
        rationale: "Dormimos na cama."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 10
    title: Parabéns!
    description: Você completou o nível 2A!
    exercises:
      - type: reading
        question: Você aprendeu muito! Está pronto para o próximo nível? (SIM/NÃO)
        correctAnswer: SIM
        rationale: "Observe as opções e escolha a que responde \"Você aprendeu muito! Está pronto para o próximo nível?\": 'SIM'."
        difficulty: 2
        objectives: [pt.literacy]
target: 10
