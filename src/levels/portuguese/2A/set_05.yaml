title: Consoantes M, N, P
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Consoantes M, N, P. M e N podem nasalizar vogal anterior (também)."
example: Aprenda mais consoantes importantes.
pages:
  - pageNumber: 1
    title: Letra M
    description: Reconheça a letra M.
    exercises:
      - type: reading
        question: "Escolha a letra M: (L/M/N)"
        correctAnswer: M
        rationale: "M — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Letra N
    description: Reconheça a letra N.
    exercises:
      - type: reading
        question: "Escolha a letra N: (M/N/O)"
        correctAnswer: N
        rationale: "N — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: Letra P
    description: Reconheça a letra P.
    exercises:
      - type: reading
        question: "Escolha a letra P: (O/P/Q)"
        correctAnswer: P
        rationale: "P — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: M de MÃO
    description: Reconheça palavras com M.
    exercises:
      - type: reading
        question: "M de: (LÃO/MÃO/NÃO)"
        correctAnswer: MÃO
        rationale: "M aparece em MÃO como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 5
    title: N de NAVIO
    description: Reconheça palavras com N.
    exercises:
      - type: reading
        question: "N de: (MAVIO/NAVIO/PAVIO)"
        correctAnswer: NAVIO
        rationale: "N aparece em NAVIO como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: P de PATO
    description: Reconheça palavras com P.
    exercises:
      - type: reading
        question: "P de: (MATO/NATO/PATO)"
        correctAnswer: PATO
        rationale: "P aparece em PATO como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 7
    title: Identificar M
    description: Encontre a letra M.
    exercises:
      - type: reading
        question: "'MESA' começa com M? (sim/não)"
        correctAnswer: sim
        rationale: "Resposta: sim — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 8
    title: Identificar N
    description: Encontre a letra N.
    exercises:
      - type: reading
        question: "'NOME' começa com N? (sim/não)"
        correctAnswer: sim
        rationale: "Resposta: sim — consulte a informação dada."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 9
    title: Identificar P
    description: Encontre a letra P.
    exercises:
      - type: reading
        question: "'PAPEL' começa com P? (sim/não)"
        correctAnswer: sim
        rationale: "Resposta: sim — consulte a informação dada."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 10
    title: Revisão MNP
    description: Reconheça as três letras.
    exercises:
      - type: reading
        question: Qual letra falta em _ATO? (M/N/P)
        correctAnswer: P
        rationale: "Resposta: P — consulte a informação dada."
        difficulty: 2
        objectives: [pt.literacy]
target: 10
