    exercises:
      - { type: reading, question: ""Escolha BI: (BA/BE/BI)"", correctAnswer: BI }
  - pageNumber: 4
    title: BA de BALA
    description: Reconheça BA em palavras.
    exercises:
      - { type: reading, question: ""BALA começa com: (BA/BE/BI)"", correctAnswer: BA }
  - pageNumber: 5
    title: BE de BEBÊ
