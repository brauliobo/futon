title: Sílabas Simples - BA, BE, BI
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Sílabas com B. Padrão regular CV; base para palavras simples (bola, bebê)."
example: "Reconheça sílabas simples com B. Ex.: Escolha BA: → BA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Sílaba BA
    description: Reconheça a sílaba BA.
    exercises:
      - type: reading
        question: "Escolha BA: (BA/BI/BE)"
        correctAnswer: BA
        rationale: "BA é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Sílaba BE
    description: Reconheça a sílaba BE.
    exercises:
      - type: reading
        question: "Escolha BE: (BI/BE/BA)"
        correctAnswer: BE
        rationale: "BE é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: Sílaba BI
    description: Reconheça a sílaba BI.
    exercises:
      - type: reading
        question: "Escolha BI: (BA/BE/BI)"
        correctAnswer: BI
        rationale: "BI é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: BA de BALA
    description: Reconheça BA em palavras.
    exercises:
      - type: reading
        question: "BALA começa com: (BI/BA/BE)"
        correctAnswer: BA
        rationale: "'BALA' começa com a sílaba BA."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 5
    title: BE de BEBÊ
    description: Reconheça BE em palavras.
    exercises:
      - type: reading
        question: "BEBÊ começa com: (BA/BE/BI)"
        correctAnswer: BE
        rationale: "Começa com BE."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: BI de BICO
    description: Reconheça BI em palavras.
    exercises:
      - type: reading
        question: "BICO começa com: (BI/BE/BA)"
        correctAnswer: BI
        rationale: "'BICO' começa com a sílaba BI."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 7
    title: Completar _ALA
    description: Complete a palavra BALA.
    exercises:
      - type: reading
        question: "_ALA é: (BALA/FALA/CALA)"
        correctAnswer: BALA
        rationale: "A letra que completa '_ALA' forma 'BALA'."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 8
    title: Completar _EBÊ
    description: Complete a palavra BEBÊ.
    exercises:
      - type: reading
        question: "_EBÊ é: (DEBÊ/CEBÊ/BEBÊ)"
        correctAnswer: BEBÊ
        rationale: "A letra que falta forma 'BEBÊ'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 9
    title: Completar _ICO
    description: Complete a palavra BICO.
    exercises:
      - type: reading
        question: "_ICO é: (DICO/BICO/FICO)"
        correctAnswer: BICO
        rationale: "A letra que completa '_ICO' forma 'BICO'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 10
    title: Revisão B
    description: Escolha a sílaba correta com B.
    exercises:
      - type: reading
        question: "BOLA começa com: (BE/BO/BA)"
        correctAnswer: BO
        rationale: "'BOLA' começa com a sílaba BO."
        difficulty: 2
        objectives: [pt.literacy]
target: 10
