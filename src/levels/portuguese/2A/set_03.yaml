title: Consoantes F, G, H
level: 2A
subject: portuguese
example: Identifique e reconheça mais consoantes.
pages:
  - pageNumber: 1
    title: Letra F
    description: Reconheça a letra F.
    exercises:
      - { type: reading, question: "Escolha a letra F: (E/F/G)", correctAnswer: F }
  - pageNumber: 2
    title: Letra G
    description: Reconheça a letra G.
    exercises:
      - { type: reading, question: "Escolha a letra G: (F/G/H)", correctAnswer: G }
  - pageNumber: 3
    title: Letra H
    description: Reconheça a letra H.
    exercises:
      - { type: reading, question: "Escolha a letra H: (G/H/I)", correctAnswer: H }
  - pageNumber: 4
    title: F de FACA
    description: Reconheça palavras com F.
    exercises:
      - { type: reading, question: "F de: (FACA/GACA/HACA)", correctAnswer: FACA }
  - pageNumber: 5
    title: G de GATO
    description: Reconheça palavras com G.
    exercises:
      - { type: reading, question: "G de: (FATO/GATO/HATO)", correctAnswer: GATO }
  - pageNumber: 6
    title: H de HOTEL
    description: Reconheça palavras com H.
    exercises:
      - { type: reading, question: "H de: (FOTEL/GOTEL/HOTEL)", correctAnswer: HOTEL }
  - pageNumber: 7
    title: Identificar F
    description: Encontre a letra F.
    exercises:
      - { type: reading, question: "'FOGO' começa com F? (sim/não)", correctAnswer: sim }
  - pageNumber: 8
    title: Identificar G
    description: Encontre a letra G.
    exercises:
      - { type: reading, question: "'GELO' começa com G? (sim/não)", correctAnswer: sim }
  - pageNumber: 9
    title: Identificar H
    description: Encontre a letra H.
    exercises:
      - { type: reading, question: "'HOMEM' começa com H? (sim/não)", correctAnswer: sim }
  - pageNumber: 10
    title: Revisão FGH
    description: Reconheça as três letras.
    exercises:
      - { type: reading, question: "Qual letra falta em _OLA? (F/G/H)", correctAnswer: G }
target: 10
