title: Consoantes F, G, H
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Consoantes F, G, H. Atenção — H é mudo em português."
example: Identifique e reconheça mais consoantes.
pages:
  - pageNumber: 1
    title: Letra F
    description: Reconheça a letra F.
    exercises:
      - type: reading
        question: "Escolha a letra F: (E/F/G)"
        correctAnswer: F
        rationale: "F — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Letra G
    description: Reconheça a letra G.
    exercises:
      - type: reading
        question: "Escolha a letra G: (F/G/H)"
        correctAnswer: G
        rationale: "G — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: Letra H
    description: Reconheça a letra H.
    exercises:
      - type: reading
        question: "Escolha a letra H: (G/H/I)"
        correctAnswer: H
        rationale: "H — identifique pela forma."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: F de FACA
    description: Reconheça palavras com F.
    exercises:
      - type: reading
        question: "F de: (FACA/GACA/HACA)"
        correctAnswer: FACA
        rationale: "F aparece em FACA como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 5
    title: G de GATO
    description: Reconheça palavras com G.
    exercises:
      - type: reading
        question: "G de: (FATO/GATO/HATO)"
        correctAnswer: GATO
        rationale: "G aparece em GATO como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: H de HOTEL
    description: Reconheça palavras com H.
    exercises:
      - type: reading
        question: "H de: (FOTEL/GOTEL/HOTEL)"
        correctAnswer: HOTEL
        rationale: "H aparece em HOTEL como letra inicial."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 7
    title: Identificar F
    description: Encontre a letra F.
    exercises:
      - type: reading
        question: "'FOGO' começa com F? (sim/não)"
        correctAnswer: sim
        rationale: "Resposta: sim — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 8
    title: Identificar G
    description: Encontre a letra G.
    exercises:
      - type: reading
        question: "'GELO' começa com G? (sim/não)"
        correctAnswer: sim
        rationale: "Resposta: sim — consulte a informação dada."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 9
    title: Identificar H
    description: Encontre a letra H.
    exercises:
      - type: reading
        question: "'HOMEM' começa com H? (sim/não)"
        correctAnswer: sim
        rationale: "Resposta: sim — consulte a informação dada."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 10
    title: Revisão FGH
    description: Reconheça as três letras.
    exercises:
      - type: reading
        question: Qual letra falta em _OLA? (F/G/H)
        correctAnswer: G
        rationale: "Resposta: G — consulte a informação dada."
        difficulty: 2
        objectives: [pt.literacy]
target: 10
