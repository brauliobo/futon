        rationale: "DOIS é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: TRÊS
    description: Reconheça o número TRÊS.
    exercises:
      - type: reading
        question: "Escolha TRÊS: (TRÊS/TRIS/TRAS)"
        correctAnswer: TRÊS
        rationale: "TRÊS é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
