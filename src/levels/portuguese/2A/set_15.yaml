title: Números Simples
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Escrita por extenso. Atenção à ortografia de 'dezesseis', 'quatorze'."
example: "Reconheça números por extenso simples. Ex.: Escolha UM: → UM."
pages:
  - pageNumber: 1
    title: UM
    description: Reconheça o número UM.
    exercises:
      - type: reading
        question: "Escolha UM: (UM/UMA/UNS)"
        correctAnswer: UM
        rationale: "UM é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
