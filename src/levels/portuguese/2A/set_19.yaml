title: Natureza
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário de natureza. Palavras concretas do cotidiano."
example: "Reconheça palavras da natureza. Ex.: Escolha SOL: → SOL."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: SOL
    description: Reconheça a palavra SOL.
    exercises:
      - type: reading
        question: "Escolha SOL: (BOL/SOL/GOL)"
        correctAnswer: SOL
        rationale: "SOL é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: LUA
    description: Reconheça a palavra LUA.
    exercises:
      - type: reading
        question: "Escolha LUA: (LUA/SUA/RUA)"
        correctAnswer: LUA
        rationale: "LUA é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: MAR
    description: Reconheça a palavra MAR.
    exercises:
      - type: reading
        question: "Escolha MAR: (BAR/MAR/CAR)"
        correctAnswer: MAR
        rationale: "MAR é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: CÉU
    description: Reconheça a palavra CÉU.
    exercises:
      - type: reading
        question: "Escolha CÉU: (SEU/MEU/CÉU)"
        correctAnswer: CÉU
        rationale: "CÉU é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 5
    title: FLOR
    description: Reconheça a palavra FLOR.
    exercises:
      - type: reading
        question: "Escolha FLOR: (CLOR/FLOR/BLOR)"
        correctAnswer: FLOR
        rationale: "FLOR é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: ÁRVORE
    description: Reconheça a palavra ÁRVORE.
    exercises:
      - type: reading
        question: "Escolha ÁRVORE: (ÁRVORE/ARVIRE/ARVERE)"
        correctAnswer: ÁRVORE
        rationale: "ÁRVORE é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 7
    title: O que Brilha de Dia
    description: Escolha o que brilha de dia.
    exercises:
      - type: reading
        question: O que brilha de dia? (LUA/SOL/MAR)
        correctAnswer: SOL
        rationale: "Observe as opções e escolha a que responde \"O que brilha de dia?\": 'SOL'."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 8
    title: O que Aparece de Noite
    description: Escolha o que aparece de noite.
    exercises:
      - type: reading
        question: O que aparece de noite? (SOL/FLOR/LUA)
        correctAnswer: LUA
        rationale: "Observe as opções e escolha a que responde \"O que aparece de noite?\": 'LUA'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 9
    title: Completar FL_R
    description: Complete a palavra FLOR.
    exercises:
      - type: reading
        question: "FL_R é: (FLOR/FLER/FLAR)"
        correctAnswer: FLOR
        rationale: "A letra que completa 'FL_R' forma 'FLOR'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 10
    title: Completar ÁRV_RE
    description: Complete a palavra ÁRVORE.
    exercises:
      - type: reading
        question: "ÁRV_RE é: (ÁRVORE/ARVARE/ARVIRE)"
        correctAnswer: ÁRVORE
        rationale: "A letra que completa 'RV_RE' forma 'ÁRVORE'."
        difficulty: 2
        objectives: [pt.literacy]
target: 10
