title: Palavras Simples - Animais
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — animais. Leitura de palavras de alta frequência."
example: "Reconheça palavras simples de animais. Ex.: Escolha GATO: → GATO."
pages:
  - pageNumber: 1
    title: GATO
    description: Reconheça a palavra GATO.
    exercises:
      - type: reading
        question: "Escolha GATO: (GATO/PATO/RATO)"
        correctAnswer: GATO
        rationale: "GATO é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: PATO
    description: Reconheça a palavra PATO.
    exercises:
