title: Sílabas Simples - DA, DE, DI
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Sílabas com D. Padrão regular CV (dado, dedo)."
example: "Reconheça sílabas simples com D. Ex.: Escolha DA: → DA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Sílaba DA
    description: Reconheça a sílaba DA.
    exercises:
      - type: reading
        question: "Escolha DA: (DI/DE/DA)"
        correctAnswer: DA
        rationale: "DA é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Sílaba DE
    description: Reconheça a sílaba DE.
    exercises:
      - type: reading
        question: "Escolha DE: (DA/DE/DI)"
        correctAnswer: DE
        rationale: "DE é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: Sílaba DI
    description: Reconheça a sílaba DI.
    exercises:
      - type: reading
        question: "Escolha DI: (DA/DE/DI)"
        correctAnswer: DI
        rationale: "DI é a palavra correta — leia letra por letra e compare."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 4
    title: DA de DADO
    description: Reconheça DA em palavras.
    exercises:
      - type: reading
        question: "DADO começa com: (DA/DE/DI)"
        correctAnswer: DA
        rationale: "'DADO' começa com a sílaba DA."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 5
    title: DE de DEDO
    description: Reconheça DE em palavras.
    exercises:
      - type: reading
        question: "DEDO começa com: (DA/DE/DI)"
        correctAnswer: DE
        rationale: "'DEDO' começa com a sílaba DE."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 6
    title: DI de DICA
    description: Reconheça DI em palavras.
    exercises:
      - type: reading
        question: "DICA começa com: (DA/DI/DE)"
        correctAnswer: DI
        rationale: "'DICA' começa com a sílaba DI."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 7
    title: Completar _ADO
    description: Complete a palavra DADO.
    exercises:
      - type: reading
        question: "_ADO é: (LADO/DADO/FADO)"
        correctAnswer: DADO
        rationale: "A letra que completa '_ADO' forma 'DADO'."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 8
    title: Completar _EDO
    description: Complete a palavra DEDO.
    exercises:
      - type: reading
        question: "_EDO é: (FEDO/LEDO/DEDO)"
        correctAnswer: DEDO
        rationale: "A letra que completa '_EDO' forma 'DEDO'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 9
    title: Completar _ICA
    description: Complete a palavra DICA.
    exercises:
      - type: reading
        question: "_ICA é: (PICA/DICA/FICA)"
        correctAnswer: DICA
        rationale: "A letra que completa '_ICA' forma 'DICA'."
        difficulty: 2
        objectives: [pt.literacy]
  - pageNumber: 10
    title: Revisão D
    description: Escolha a sílaba correta com D.
    exercises:
      - type: reading
        question: "DOCE começa com: (DO/DE/DA)"
        correctAnswer: DO
        rationale: "'DOCE' começa com a sílaba DO."
        difficulty: 2
        objectives: [pt.literacy]
target: 10
