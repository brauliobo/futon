title: Sílabas Simples - DA, DE, DI
level: 2A
subject: portuguese
example: Reconheça sílabas simples com D.
pages:
  - pageNumber: 1
    title: Sílaba DA
    description: Reconheça a sílaba DA.
    exercises:
      - { type: reading, question: "Escolha DA: (DA/DE/DI)", correctAnswer: DA }
  - pageNumber: 2
    title: Sílaba DE
    description: Reconheça a sílaba DE.
    exercises:
      - { type: reading, question: "Escolha DE: (DA/DE/DI)", correctAnswer: DE }
  - pageNumber: 3
    title: Sílaba DI
    description: Reconheça a sílaba DI.
    exercises:
      - { type: reading, question: "Escolha DI: (DA/DE/DI)", correctAnswer: DI }
  - pageNumber: 4
    title: DA de DADO
    description: Reconheça DA em palavras.
    exercises:
      - { type: reading, question: "DADO começa com: (DA/DE/DI)", correctAnswer: DA }
  - pageNumber: 5
    title: DE de DEDO
    description: Reconheça DE em palavras.
    exercises:
      - { type: reading, question: "DEDO começa com: (DA/DE/DI)", correctAnswer: DE }
  - pageNumber: 6
    title: DI de DICA
    description: Reconheça DI em palavras.
    exercises:
      - { type: reading, question: "DICA começa com: (DA/DE/DI)", correctAnswer: DI }
  - pageNumber: 7
