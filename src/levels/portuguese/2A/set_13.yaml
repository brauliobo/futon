  - pageNumber: 8
    title: Completar _EDO
    description: Complete a palavra DEDO.
    exercises:
      - { type: reading, question: "_EDO é: (DEDO/FEDO/LEDO)", correctAnswer: DEDO }
  - pageNumber: 9
    title: Completar _ICA
    description: Complete a palavra DICA.
    exercises:
      - { type: reading, question: "_ICA é: (DICA/FICA/PICA)", correctAnswer: DICA }
  - pageNumber: 10
    title: Revisão D
    description: Escolha a sílaba correta com D.
    exercises:
      - { type: reading, question: "DOCE começa com: (DA/DE/DO)", correctAnswer: DO }
target: 10
