title: Primeiras Sílabas — BA, BE, BI, BO, BU
level: 2A
subject: portuguese
example: "Reconheça sílabas formadas por consoante + vogal."
pages:
  - pageNumber: 1
    title: Sílabas com B
    description: Forme sílabas com B + vogal.
    exercises:
      - { type: reading, question: "B + A forma: (BA/BB/BI)", correctAnswer: "BA" }
      - { type: reading, question: "B + E forma: (BE/BO/BU)", correctAnswer: "BE" }
      - { type: reading, question: "B + I forma: (BA/BI/BO)", correctAnswer: "BI" }
      - { type: reading, question: "B + O forma: (BO/BA/BU)", correctAnswer: "BO" }
      - { type: reading, question: "B + U forma: (BA/BE/BU)", correctAnswer: "BU" }
      - { type: reading, question: "Qual começa com BA? (banana/casa/mesa)", correctAnswer: "banana" }
      - { type: reading, question: "Qual começa com BO? (bola/gato/sol)", correctAnswer: "bola" }
      - { type: reading, question: "Qual começa com BE? (bebê/pato/gato)", correctAnswer: "bebê" }
      - { type: reading, question: "Qual começa com BI? (bicho/carro/dia)", correctAnswer: "bicho" }
      - { type: reading, question: "Qual começa com BU? (buzina/dedo/mão)", correctAnswer: "buzina" }
  - pageNumber: 2
    title: Sílabas com C (ca, ce, ci, co, cu)
    description: Forme sílabas com C + vogal.
    exercises:
      - { type: reading, question: "C + A forma: (CA/CI/CU)", correctAnswer: "CA" }
      - { type: reading, question: "C + O forma: (CO/CA/CE)", correctAnswer: "CO" }
      - { type: reading, question: "Qual começa com CA? (casa/pato/livro)", correctAnswer: "casa" }
      - { type: reading, question: "Qual começa com CO? (copo/pato/mesa)", correctAnswer: "copo" }
      - { type: reading, question: "Qual começa com CI? (cinco/banho/gato)", correctAnswer: "cinco" }
      - { type: reading, question: "C + E soa como: (que/se/ke)", correctAnswer: "se" }
      - { type: reading, question: "C + A soa como: (ka/sa/se)", correctAnswer: "ka" }
      - { type: reading, question: "Qual tem som de K? (casa/cebola)", correctAnswer: "casa" }
      - { type: reading, question: "Qual tem som de S? (cebola/cachorro)", correctAnswer: "cebola" }
      - { type: reading, question: "C + U forma: (CU/CE/CI)", correctAnswer: "CU" }
  - pageNumber: 3
    title: Leitura de Palavras Simples
    description: Leia palavras de 2 sílabas.
    exercises:
      - { type: reading, question: "Leia: BO + LA =", correctAnswer: "BOLA" }
      - { type: reading, question: "Leia: CA + SA =", correctAnswer: "CASA" }
      - { type: reading, question: "Leia: BE + BÊ =", correctAnswer: "BEBÊ" }
      - { type: reading, question: "Leia: LA + TA =", correctAnswer: "LATA" }
      - { type: reading, question: "Leia: PA + TO =", correctAnswer: "PATO" }
      - { type: reading, question: "Leia: GA + TO =", correctAnswer: "GATO" }
      - { type: reading, question: "Leia: MA + LA =", correctAnswer: "MALA" }
      - { type: reading, question: "Leia: MO + TO =", correctAnswer: "MOTO" }
      - { type: reading, question: "Leia: LA + TA =", correctAnswer: "LATA" }
      - { type: reading, question: "Leia: SA + PO =", correctAnswer: "SAPO" }
target: 30
