title: Reconhecimento de Letras - Vogais Básicas
level: 2A
subject: portuguese
example: Identifique e reconheça as vogais.
pages:
  - pageNumber: 1
    title: Vogal A
    description: Reconheça a letra A.
    exercises:
      - { type: reading, question: ""Escolha a letra A: (A/B/C)"", correctAnswer: A }
  - pageNumber: 2
    title: Vogal E
    description: Reconheça a letra E.
    exercises:
      - { type: reading, question: ""Escolha a letra E: (D/E/F)"", correctAnswer: E }
  - pageNumber: 3
    title: Vogal I
    description: Reconheça a letra I.
    exercises:
      - { type: reading, question: ""Escolha a letra I: (H/I/J)"", correctAnswer: I }
  - pageNumber: 4
    title: Vogal O
    description: Reconheça a letra O.
    exercises:
      - { type: reading, question: ""Escolha a letra O: (N/O/P)"", correctAnswer: O }
  - pageNumber: 5
    title: Vogal U
    description: Reconheça a letra U.
    exercises:
      - { type: reading, question: ""Escolha a letra U: (T/U/V)"", correctAnswer: U }
  - pageNumber: 6
    title: Identificar A
    description: Encontre a vogal A em palavras.
    exercises:
      - { type: reading, question: ""'CASA' tem a letra A? (sim/não)"", correctAnswer: sim }
  - pageNumber: 7
    title: Identificar E
    description: Encontre a vogal E em palavras.
    exercises:
      - { type: reading, question: ""'MESA' tem a letra E? (sim/não)"", correctAnswer: sim }
  - pageNumber: 8
    title: Identificar I
    description: Encontre a vogal I em palavras.
    exercises:
      - { type: reading, question: ""'BICO' tem a letra I? (sim/não)"", correctAnswer: sim }
  - pageNumber: 9
    title: Identificar O
    description: Encontre a vogal O em palavras.
    exercises:
      - { type: reading, question: ""'BOLO' tem a letra O? (sim/não)"", correctAnswer: sim }
  - pageNumber: 10
    title: Identificar U
    description: Encontre a vogal U em palavras.
    exercises:
      - { type: reading, question: ""'UVAS' tem a letra U? (sim/não)"", correctAnswer: sim }
target: 10
