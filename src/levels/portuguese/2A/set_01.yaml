title: Primeiras Sílabas — BA, BE, BI, BO, BU
level: 2A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Sílabas com B. Padrão regular CV; base para palavras simples (bola, bebê)."
example: "Reconheça sílabas formadas por consoante + vogal. Ex.: B + A forma: → BA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Sílabas com B
    description: Forme sílabas com B + vogal.
    exercises:
      - type: reading
        question: "B + A forma: (BA/BB/BI)"
        correctAnswer: BA
        rationale: "B+A forma a sílaba BA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "B + E forma: (BO/BE/BU)"
        correctAnswer: BE
        rationale: "B+E forma a sílaba BE."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "B + I forma: (BO/BA/BI)"
        correctAnswer: BI
        rationale: "B+I forma a sílaba BI."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "B + O forma: (BA/BU/BO)"
        correctAnswer: BO
        rationale: "B+O forma a sílaba BO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "B + U forma: (BE/BA/BU)"
        correctAnswer: BU
        rationale: "B+U forma a sílaba BU."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual começa com BA? (banana/casa/mesa)
        correctAnswer: banana
        rationale: "BANANA começa com B."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual começa com BO? (bola/gato/sol)
        correctAnswer: bola
        rationale: "BOLA começa com B."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual começa com BE? (pato/bebê/gato)
        correctAnswer: bebê
        rationale: "BEBÊ começa com B."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual começa com BI? (carro/dia/bicho)
        correctAnswer: bicho
        rationale: "BICHO começa com B."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual começa com BU? (dedo/mão/buzina)
        correctAnswer: buzina
        rationale: "BUZINA começa com B."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 2
    title: Sílabas com C (ca, ce, ci, co, cu)
    description: Forme sílabas com C + vogal.
    exercises:
      - type: reading
        question: "C + A forma: (CI/CA/CU)"
        correctAnswer: CA
        rationale: "C+A forma a sílaba CA."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "C + O forma: (CA/CE/CO)"
        correctAnswer: CO
        rationale: "C+O forma a sílaba CO."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual começa com CA? (livro/pato/casa)
        correctAnswer: casa
        rationale: "CASA começa com C."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual começa com CO? (pato/mesa/copo)
        correctAnswer: copo
        rationale: "COPO começa com C."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual começa com CI? (banho/gato/cinco)
        correctAnswer: cinco
        rationale: "CINCO começa com C."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "C + E soa como: (que/se/ke)"
        correctAnswer: se
        rationale: "A letra C antes de E tem som de 'se'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "C + A soa como: (sa/ka/se)"
        correctAnswer: ka
        rationale: "A letra C antes de A tem som de 'ka'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual tem som de K? (casa/cebola)
        correctAnswer: casa
        rationale: "'casa' tem som de K — a letra C muda de som conforme a vogal que segue."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual tem som de S? (cachorro/cebola)
        correctAnswer: cebola
        rationale: "'cebola' tem som de S — a letra C muda de som conforme a vogal que segue."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "C + U forma: (CE/CU/CI)"
        correctAnswer: CU
        rationale: "C+U forma a sílaba CU."
        difficulty: 1
        objectives: [pt.literacy]
  - pageNumber: 3
    title: Leitura de Palavras Simples
    description: Leia palavras de 2 sílabas.
    exercises:
      - type: reading
        question: "Leia: BO + LA ="
        correctAnswer: BOLA
        rationale: "Junte as sílabas: BO + LA = BOLA."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "Leia: CA + SA ="
        correctAnswer: CASA
        rationale: "Junte as sílabas: CA + SA = CASA."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "Leia: BE + BÊ ="
        correctAnswer: BEBÊ
        rationale: Reveja o trecho relevante do texto.
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "Leia: LA + TA ="
        correctAnswer: LATA
        rationale: "Junte as sílabas: LA + TA = LATA."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "Leia: PA + TO ="
        correctAnswer: PATO
        rationale: "Junte as sílabas: PA + TO = PATO."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "Leia: GA + TO ="
        correctAnswer: GATO
        rationale: "Junte as sílabas: GA + TO = GATO."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "Leia: MA + LA ="
        correctAnswer: MALA
        rationale: "Junte as sílabas: MA + LA = MALA."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "Leia: MO + TO ="
        correctAnswer: MOTO
        rationale: "Junte as sílabas: MO + TO = MOTO."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "Leia: LA + TA ="
        correctAnswer: LATA
        rationale: "Junte as sílabas: LA + TA = LATA."
        difficulty: 2
        objectives: [pt.literacy]
      - type: reading
        question: "Leia: SA + PO ="
        correctAnswer: SAPO
        rationale: "Junte as sílabas: SA + PO = SAPO."
        difficulty: 2
        objectives: [pt.literacy]
target: 30
