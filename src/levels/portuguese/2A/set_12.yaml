title: Sílabas Simples - CA, CO, CU
level: 2A
subject: portuguese
example: Reconheça sílabas simples com C.
pages:
  - pageNumber: 1
    title: Sílaba CA
    description: Reconheça a sílaba CA.
    exercises:
      - { type: reading, question: "Escolha CA: (CA/CO/CU)", correctAnswer: CA }
  - pageNumber: 2
    title: Sílaba CO
    description: Reconheça a sílaba CO.
    exercises:
      - { type: reading, question: "Escolha CO: (CA/CO/CU)", correctAnswer: CO }
  - pageNumber: 3
    title: Sílaba CU
    description: Reconheça a sílaba CU.
    exercises:
      - { type: reading, question: "Escolha CU: (CA/CO/CU)", correctAnswer: CU }
  - pageNumber: 4
    title: CA de CASA
    description: Reconheça CA em palavras.
    exercises:
      - { type: reading, question: "CASA começa com: (CA/CO/CU)", correctAnswer: CA }
  - pageNumber: 5
    title: CO de COXA
    description: Reconheça CO em palavras.
    exercises:
      - { type: reading, question: "COXA começa com: (CA/CO/CU)", correctAnswer: CO }
  - pageNumber: 6
    title: CU de CUBO
    description: Reconheça CU em palavras.
    exercises:
      - { type: reading, question: "CUBO começa com: (CA/CO/CU)", correctAnswer: CU }
  - pageNumber: 7
    title: Completar _ASA
    description: Complete a palavra CASA.
    exercises:
      - { type: reading, question: "_ASA é: (CASA/FASA/MASA)", correctAnswer: CASA }
  - pageNumber: 8
    title: Completar _OXA
    description: Complete a palavra COXA.
    exercises:
      - { type: reading, question: "_OXA é: (COXA/FOXA/ROXA)", correctAnswer: COXA }
  - pageNumber: 9
    title: Completar _UBO
    description: Complete a palavra CUBO.
    exercises:
      - { type: reading, question: "_UBO é: (CUBO/FUBO/LUBO)", correctAnswer: CUBO }
  - pageNumber: 10
    title: Revisão C
    description: Escolha a sílaba correta com C.
    exercises:
      - { type: reading, question: "COPO começa com: (CA/CO/CU)", correctAnswer: CO }
target: 10
