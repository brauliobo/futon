title: Alfabeto - Reconhecimento de Letras
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Revisão do alfabeto completo. Fluência em reconhecer todas as letras."
example: "Reconheça letras, distinga vogais de consoantes. Ex.: Primeira letra do alfabeto? → A."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Ordem do Alfabeto
    description: Qual letra vem antes ou depois?
    exercises:
      - type: reading
        question: Primeira letra do alfabeto? (B/A/C)
        correctAnswer: A
        rationale: "Observe as opções e escolha a que responde \"Primeira letra do alfabeto?\": 'A'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Última letra do alfabeto? (X/Z/Y)
        correctAnswer: Z
        rationale: "Observe as opções e escolha a que responde \"Última letra do alfabeto?\": 'Z'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Depois de A vem: (B/D/C)"
        correctAnswer: B
        rationale: "'B' pertence à categoria: depois de a vem."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Depois de M vem: (N/O/L)"
        correctAnswer: N
        rationale: "'N' pertence à categoria: depois de m vem."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Antes de D vem: (E/C/F)"
        correctAnswer: C
        rationale: "'C' pertence à categoria: antes de d vem."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Antes de H vem: (I/G/J)"
        correctAnswer: G
        rationale: "'G' pertence à categoria: antes de h vem."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Entre A e C vem: (E/D/B)"
        correctAnswer: B
        rationale: "'B' pertence à categoria: entre a e c vem."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Entre H e J vem: (L/I/K)"
        correctAnswer: I
        rationale: "'I' pertence à categoria: entre h e j vem."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quantas letras tem o alfabeto português? (26/27/23)
        correctAnswer: "26"
        rationale: "Conte as letras em 'o': 26."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: "Depois de Y vem: (X/Z/W)"
        correctAnswer: Z
        rationale: "'Z' pertence à categoria: depois de y vem."
