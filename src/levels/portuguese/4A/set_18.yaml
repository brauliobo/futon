title: Formação de Palavras Simples
level: 4A
subject: portuguese
example: Monte palavras juntando sílabas.
pages:
  - pageNumber: 1
    title: Juntando Sílabas
    description: Junte as sílabas para formar palavras.
    exercises:
      - { type: literacy, question: "CA + SA = ? (casa/cassa/caza)", correctAnswer: casa }
      - { type: literacy, question: "BO + LA = ? (bola/bolla/bula)", correctAnswer: bola }
      - { type: literacy, question: "GA + TO = ? (gato/gatto/goto)", correctAnswer: gato }
      - { type: literacy, question: "ME + SA = ? (mesa/messa/misa)", correctAnswer: mesa }
      - { type: literacy, question: "PA + TO = ? (pato/patto/peto)", correctAnswer: pato }
      - { type: literacy, question: "SO + PA = ? (sopa/soppa/supa)", correctAnswer: sopa }
      - { type: literacy, question: "FO + GO = ? (fogo/foggo/fugo)", correctAnswer: fogo }
      - { type: literacy, question: "LU + A = ? (lua/luva/luz)", correctAnswer: lua }
      - { type: literacy, question: "PI + PA = ? (pipa/pippa/popa)", correctAnswer: pipa }
      - { type: literacy, question: "VA + CA = ? (vaca/vacca/voca)", correctAnswer: vaca }
target: 10
