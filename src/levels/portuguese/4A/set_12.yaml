title: Compreensão Simples - História Curta
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Compreensão de texto curto. Desenvolve localização de informação explícita."
example: "Leia e responda sobre uma história simples. Ex.: João tem um? → cachorro."
pages:
  - pageNumber: 1
    title: O Menino e o Cachorro
    description: Responda sobre a história.
    exercises:
      - type: reading
        question: João tem um? (gato/cachorro/pássaro)
        correctAnswer: cachorro
        rationale: "Observe as opções e escolha a que responde \"João tem um?\": 'cachorro'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O nome do cachorro é? (Rex/Bob/Max)
        correctAnswer: Rex
        rationale: "Observe as opções e escolha a que responde \"O nome do cachorro é?\": 'Rex'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Rex gosta de? (brincar/dormir/comer)
        correctAnswer: brincar
        rationale: "Observe as opções e escolha a que responde \"Rex gosta de?\": 'brincar'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Eles brincam no? (quarto/quintal/banheiro)
        correctAnswer: quintal
        rationale: "Observe as opções e escolha a que responde \"Eles brincam no?\": 'quintal'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Rex é um cachorro? (grande/pequeno/médio)
        correctAnswer: pequeno
        rationale: "Observe as opções e escolha a que responde \"Rex é um cachorro?\": 'pequeno'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A cor de Rex é? (preto/marrom/branco)
        correctAnswer: marrom
        rationale: "Observe as opções e escolha a que responde \"A cor de Rex é?\": 'marrom'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: João alimenta Rex com? (osso/ração/peixe)
        correctAnswer: ração
        rationale: "Observe as opções e escolha a que responde \"João alimenta Rex com?\": 'ração'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Rex dorme na? (cama/casinha/cozinha)
        correctAnswer: casinha
        rationale: "Observe as opções e escolha a que responde \"Rex dorme na?\": 'casinha'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: João e Rex são? (inimigos/amigos/estranhos)
        correctAnswer: amigos
        rationale: "Observe as opções e escolha a que responde \"João e Rex são?\": 'amigos'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Todos os dias eles? (brigam/brincam/estudam)
        correctAnswer: brincam
        rationale: "Observe as opções e escolha a que responde \"Todos os dias eles?\": 'brincam'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
