title: Compreensão Simples - História Curta
level: 4A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/4A.
example: Leia e responda sobre uma história simples.
pages:
  - pageNumber: 1
    title: O Menino e o Cachorro
    description: Responda sobre a história.
    exercises:
      - { type: reading, question: "João tem um? (gato/cachorro/pássaro)", correctAnswer: cachorro }
      - { type: reading, question: "O nome do cachorro é? (Rex/Bob/Max)", correctAnswer: Rex }
      - { type: reading, question: "Rex gosta de? (brincar/dormir/comer)", correctAnswer: brincar }
      - { type: reading, question: "Eles brincam no? (quarto/quintal/banheiro)", correctAnswer: quintal }
      - { type: reading, question: "Rex é um cachorro? (grande/pequeno/médio)", correctAnswer: pequeno }
      - { type: reading, question: "A cor de Rex é? (preto/marrom/branco)", correctAnswer: marrom }
      - { type: reading, question: "João alimenta Rex com? (osso/ração/peixe)", correctAnswer: ração }
      - { type: reading, question: "Rex dorme na? (cama/casinha/cozinha)", correctAnswer: casinha }
      - { type: reading, question: "João e Rex são? (inimigos/amigos/estranhos)", correctAnswer: amigos }
      - { type: reading, question: "Todos os dias eles? (brigam/brincam/estudam)", correctAnswer: brincam }
target: 10
