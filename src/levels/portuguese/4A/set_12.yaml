title: Compreensão Simples - História Curta
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Compreensão de texto curto. Desenvolve localização de informação explícita."
example: Leia e responda sobre uma história simples.
pages:
  - pageNumber: 1
    title: O Menino e o Cachorro
    description: Responda sobre a história.
    exercises:
      - type: reading
        question: João tem um? (gato/cachorro/pássaro)
        correctAnswer: cachorro
        rationale: "Resposta: cachorro — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O nome do cachorro é? (Rex/Bob/Max)
        correctAnswer: Rex
        rationale: "Resposta: Rex — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Rex gosta de? (brincar/dormir/comer)
        correctAnswer: brincar
        rationale: "Resposta: brincar — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Eles brincam no? (quarto/quintal/banheiro)
        correctAnswer: quintal
        rationale: "Resposta: quintal — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Rex é um cachorro? (grande/pequeno/médio)
        correctAnswer: pequeno
        rationale: "Resposta: pequeno — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A cor de Rex é? (preto/marrom/branco)
        correctAnswer: marrom
        rationale: "Resposta: marrom — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: João alimenta Rex com? (osso/ração/peixe)
        correctAnswer: ração
        rationale: "Resposta: ração — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Rex dorme na? (cama/casinha/cozinha)
        correctAnswer: casinha
        rationale: "Resposta: casinha — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: João e Rex são? (inimigos/amigos/estranhos)
        correctAnswer: amigos
        rationale: "Resposta: amigos — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Todos os dias eles? (brigam/brincam/estudam)
        correctAnswer: brincam
        rationale: "Resposta: brincam — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
