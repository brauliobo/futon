title: Compreensão Simples - História Curta
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Compreensão de texto curto. Desenvolve localização de informação explícita."
example: "Leia e responda sobre uma história simples. Ex.: João tem um? → cachorro."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: O Menino e o Cachorro
    description: "História: João tem um cachorro pequeno e marrom chamado Rex. Rex gosta de brincar no quintal. João dá ração ao Rex, que dorme na sua casinha. João e Rex são amigos e brincam juntos todos os dias."
    exercises:
      - type: reading
        question: João tem um? (gato/pássaro/cachorro)
        correctAnswer: cachorro
        rationale: "A história diz: 'João tem um cachorro... chamado Rex'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O nome do cachorro é? (Bob/Rex/Max)
        correctAnswer: Rex
        rationale: "A história diz: 'um cachorro... chamado Rex'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Rex gosta de? (comer/brincar/dormir)
        correctAnswer: brincar
        rationale: "A história diz: 'Rex gosta de brincar no quintal'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Eles brincam no? (quarto/banheiro/quintal)
        correctAnswer: quintal
        rationale: "A história diz: 'brincar no quintal'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Rex é um cachorro? (pequeno/médio/grande)
        correctAnswer: pequeno
        rationale: "A história descreve Rex como 'cachorro pequeno'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A cor de Rex é? (preto/marrom/branco)
        correctAnswer: marrom
        rationale: "A história descreve Rex como 'pequeno e marrom'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: João alimenta Rex com? (osso/peixe/ração)
        correctAnswer: ração
        rationale: "A história diz: 'João dá ração ao Rex'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Rex dorme na? (cozinha/cama/casinha)
        correctAnswer: casinha
        rationale: "A história diz: 'dorme na sua casinha'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: João e Rex são? (amigos/inimigos/estranhos)
        correctAnswer: amigos
        rationale: "A história diz: 'João e Rex são amigos'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Todos os dias eles? (brigam/estudam/brincam)
        correctAnswer: brincam
        rationale: "A história diz: 'brincam juntos todos os dias'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
