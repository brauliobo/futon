title: Frases Simples - Ações
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Verbos simples (comer, correr, pular). Base para frases."
example: "Complete frases sobre ações. Ex.: O pássaro ___? → voa."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: O que fazem?
    description: Complete a frase com a ação correta.
    exercises:
      - type: literacy
        question: O pássaro ___? (voa/nada/corre)
        correctAnswer: voa
        rationale: "Pássaro voa — ação típica dele."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O peixe ___? (voa/nada/corre)
        correctAnswer: nada
        rationale: "Peixe nada — ação típica dele."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O cavalo ___? (nada/voa/corre)
        correctAnswer: corre
        rationale: "Cavalo corre — ação típica dele."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A criança ___ brinquedos? (brinca/dorme/come)
        correctAnswer: brinca
        rationale: "Observe as opções e escolha a que responde \"A criança ___ brinquedos?\": 'brinca'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O bebê ___ leite? (come/corre/bebe)
        correctAnswer: bebe
        rationale: "Observe as opções e escolha a que responde \"O bebê ___ leite?\": 'bebe'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O gato ___ o rato? (persegue/nada/voa)
        correctAnswer: persegue
        rationale: "Observe as opções e escolha a que responde \"O gato ___ o rato?\": 'persegue'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O aluno ___ na escola? (voa/estuda/dorme)
        correctAnswer: estuda
        rationale: "Observe as opções e escolha a que responde \"O aluno ___ na escola?\": 'estuda'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A mãe ___ o jantar? (voa/faz/nada)
        correctAnswer: faz
        rationale: "Observe as opções e escolha a que responde \"A mãe ___ o jantar?\": 'faz'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O pai ___ de carro? (nada/dirige/voa)
        correctAnswer: dirige
        rationale: "Observe as opções e escolha a que responde \"O pai ___ de carro?\": 'dirige'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: As crianças ___ no parque? (voam/nadam/brincam)
        correctAnswer: brincam
        rationale: "O verbo concorda com o sujeito em pessoa e número."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
