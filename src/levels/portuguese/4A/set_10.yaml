title: Frases Simples - Ações
level: 4A
subject: portuguese
example: Complete frases sobre ações.
pages:
  - pageNumber: 1
    title: O que fazem?
    description: Complete a frase com a ação correta.
    exercises:
      - { type: literacy, question: "O pássaro ___? (voa/nada/corre)", correctAnswer: voa }
      - { type: literacy, question: "O peixe ___? (voa/nada/corre)", correctAnswer: nada }
      - { type: literacy, question: "O cavalo ___? (voa/nada/corre)", correctAnswer: corre }
      - { type: literacy, question: "A criança ___ brinquedos? (come/brinca/dorme)", correctAnswer: brinca }
      - { type: literacy, question: "O bebê ___ leite? (bebe/come/corre)", correctAnswer: bebe }
      - { type: literacy, question: "O gato ___ o rato? (persegue/voa/nada)", correctAnswer: persegue }
      - { type: literacy, question: "O aluno ___ na escola? (dorme/estuda/voa)", correctAnswer: estuda }
      - { type: literacy, question: "A mãe ___ o jantar? (faz/voa/nada)", correctAnswer: faz }
      - { type: literacy, question: "O pai ___ de carro? (voa/dirige/nada)", correctAnswer: dirige }
      - { type: literacy, question: "As crianças ___ no parque? (voam/brincam/nadam)", correctAnswer: brincam }
target: 10
