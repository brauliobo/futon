title: 📝 Frases Simples - Ações
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Verbos simples (comer, correr, pular). Base para frases."
example: "Complete frases sobre ações. Ex.: O pássaro ___? → voa."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: O que fazem?
    description: Complete a frase com a ação correta.
    exercises:
      - type: literacy
        question: O pássaro ___? (corre/nada/voa)
        correctAnswer: voa
        rationale: "Pássaro voa — ação típica dele."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O peixe ___? (corre/nada/voa)
        correctAnswer: nada
        rationale: "Peixe nada — ação típica dele."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O cavalo ___? (corre/nada/voa)
        correctAnswer: corre
        rationale: "Cavalo corre — ação típica dele."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A criança ___ brinquedos? (brinca/dorme/come)
        correctAnswer: brinca
        rationale: "Crianças usam brinquedos para brincar; dormir e comer não envolvem brinquedos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O bebê ___ leite? (bebe/come/corre)
        correctAnswer: bebe
        rationale: "Leite é líquido — bebemos líquidos. Comer é para alimentos sólidos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O gato ___ o rato? (nada/voa/persegue)
        correctAnswer: persegue
        rationale: "Gatos são predadores de ratos — perseguem para caçar; nem nadam nem voam atrás deles."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O aluno ___ na escola? (dorme/estuda/voa)
        correctAnswer: estuda
        rationale: "Observe a função: o aluno estuda na escola; dormir e voar não acontecem lá."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A mãe ___ o jantar? (faz/voa/nada)
        correctAnswer: faz
        rationale: "Preparar comida = fazer o jantar (cozinhar); voar e nadar não preparam comida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O pai ___ de carro? (dirige/nada/voa)
        correctAnswer: dirige
        rationale: "Carro se dirige (controlando com volante e pedais); nada e voa são em outros meios."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: As crianças ___ no parque? (brincam/voam/nadam)
        correctAnswer: brincam
        rationale: "Observe: no parque as crianças brincam; voar e nadar são atividades de outros lugares."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
