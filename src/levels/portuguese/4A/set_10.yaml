title: Frases Simples - Ações
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Verbos simples (comer, correr, pular). Base para frases."
example: "Complete frases sobre ações. Ex.: O pássaro ___? → voa."
pages:
  - pageNumber: 1
    title: O que fazem?
    description: Complete a frase com a ação correta.
    exercises:
      - type: literacy
        question: O pássaro ___? (voa/nada/corre)
        correctAnswer: voa
        rationale: "Pássaro voa — ação típica dele."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O peixe ___? (voa/nada/corre)
        correctAnswer: nada
        rationale: "Peixe nada — ação típica dele."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O cavalo ___? (voa/nada/corre)
        correctAnswer: corre
        rationale: "Cavalo corre — ação típica dele."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A criança ___ brinquedos? (come/brinca/dorme)
        correctAnswer: brinca
        rationale: "A forma correta é 'brinca'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O bebê ___ leite? (bebe/come/corre)
        correctAnswer: bebe
        rationale: "A forma correta é 'bebe'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O gato ___ o rato? (persegue/voa/nada)
        correctAnswer: persegue
        rationale: "A forma correta é 'persegue'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O aluno ___ na escola? (dorme/estuda/voa)
        correctAnswer: estuda
        rationale: "A forma correta é 'estuda'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A mãe ___ o jantar? (faz/voa/nada)
        correctAnswer: faz
        rationale: "A forma correta é 'faz'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O pai ___ de carro? (voa/dirige/nada)
        correctAnswer: dirige
        rationale: "A forma correta é 'dirige'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: As crianças ___ no parque? (voam/brincam/nadam)
        correctAnswer: brincam
        rationale: "O verbo concorda com o sujeito em pessoa e número."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
