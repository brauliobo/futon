title: 🌟 Compreensão - Na Escola
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Compreensão de texto curto. Desenvolve localização de informação explícita."
example: "Leia sobre a escola e responda. Ex.: Onde as crianças aprendem? → escola."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Minha Escola
    description: Responda sobre a escola.
    exercises:
      - type: reading
        question: Onde as crianças aprendem? (parque/escola/casa)
        correctAnswer: escola
        rationale: "A escola é o lugar onde se aprende; parque é para brincar."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quem ensina na escola? (professor/médico/cozinheiro)
        correctAnswer: professor
        rationale: "Observe a função: professor ensina; médico cuida; cozinheiro cozinha."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Em que escrevemos? (caderno/parede/chão)
        correctAnswer: caderno
        rationale: "Escrevemos em cadernos (folhas com pauta); não na parede nem no chão."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Com que escrevemos? (lápis/dedo/colher)
        correctAnswer: lápis
        rationale: "Usamos lápis (ou caneta) para escrever; dedo e colher não deixam marca."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Onde sentamos na sala? (mesa/cadeira/chão)
        correctAnswer: cadeira
        rationale: "Sentamos em cadeiras; a mesa é para apoiar cadernos e livros."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O que usamos para carregar livros? (travesseiro/panela/sacola)
        correctAnswer: sacola
        rationale: "Observe: a sacola (ou mochila) é o objeto que serve para carregar livros."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quando tocamos para o recreio? (manhã/noite/meio-dia)
        correctAnswer: meio-dia
        rationale: "O recreio costuma ser no meio do período escolar — meio-dia."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O que fazemos no recreio? (brincar/dormir/cozinhar)
        correctAnswer: brincar
        rationale: "Recreio é o tempo de descanso entre as aulas para brincar."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quem estuda na escola? (professores/médicos/alunos)
        correctAnswer: alunos
        rationale: "Observe a função: alunos estudam; professores ensinam."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A escola é um lugar para? (aprender/dormir/cozinhar)
        correctAnswer: aprender
        rationale: "Observe a função de cada lugar: escola = aprender, casa = dormir, cozinha = cozinhar."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
