title: Compreensão - Na Escola
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Compreensão de texto curto. Desenvolve localização de informação explícita."
example: "Leia sobre a escola e responda. Ex.: Onde as crianças aprendem? → escola."
pages:
  - pageNumber: 1
    title: Minha Escola
    description: Responda sobre a escola.
    exercises:
