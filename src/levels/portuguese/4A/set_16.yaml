title: Compreensão - Na Escola
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Compreensão de texto curto. Desenvolve localização de informação explícita."
example: "Leia sobre a escola e responda. Ex.: Onde as crianças aprendem? → escola."
pages:
  - pageNumber: 1
    title: Minha Escola
    description: Responda sobre a escola.
    exercises:
      - type: reading
        question: Onde as crianças aprendem? (casa/escola/parque)
        correctAnswer: escola
        rationale: "A resposta correta é 'escola'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quem ensina na escola? (médico/professor/cozinheiro)
        correctAnswer: professor
        rationale: "A resposta correta é 'professor'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Em que escrevemos? (parede/caderno/chão)
        correctAnswer: caderno
        rationale: "A resposta correta é 'caderno'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Com que escrevemos? (dedo/lápis/colher)
        correctAnswer: lápis
        rationale: "A resposta correta é 'lápis'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Onde sentamos na sala? (chão/cadeira/mesa)
        correctAnswer: cadeira
        rationale: "A resposta correta é 'cadeira'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O que usamos para carregar livros? (sacola/panela/travesseiro)
        correctAnswer: sacola
        rationale: "A resposta correta é 'sacola'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quando tocamos para o recreio? (manhã/meio-dia/noite)
        correctAnswer: meio-dia
        rationale: "A resposta correta é 'meio-dia'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O que fazemos no recreio? (dormir/brincar/cozinhar)
        correctAnswer: brincar
        rationale: "A resposta correta é 'brincar'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quem estuda na escola? (professores/alunos/médicos)
        correctAnswer: alunos
        rationale: "A resposta correta é 'alunos'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A escola é um lugar para? (dormir/aprender/cozinhar)
        correctAnswer: aprender
        rationale: "A resposta correta é 'aprender'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
