title: Palavras Simples - Objetos da Casa
level: 4A
subject: portuguese
example: Identifique objetos comuns da casa.
pages:
  - pageNumber: 1
    title: Objetos da Casa
    description: Escolha o objeto correto.
    exercises:
      - { type: literacy, question: "Onde dormimos? (cama/mesa/cadeira)", correctAnswer: cama }
      - { type: literacy, question: "Onde comemos? (cama/mesa/sofá)", correctAnswer: mesa }
      - { type: literacy, question: "Onde sentamos para comer? (mesa/cadeira/cama)", correctAnswer: cadeira }
      - { type: literacy, question: "Onde assistimos TV? (cama/mesa/sofá)", correctAnswer: sofá }
      - { type: literacy, question: "O que usamos para escovar os dentes? (pente/escova/sabonete)", correctAnswer: escova }
      - { type: literacy, question: "O que usamos para pentear o cabelo? (escova/pente/sabonete)", correctAnswer: pente }
      - { type: literacy, question: "O que usamos para lavar as mãos? (pente/escova/sabonete)", correctAnswer: sabonete }
      - { type: literacy, question: "Onde guardamos roupas? (geladeira/armário/mesa)", correctAnswer: armário }
      - { type: literacy, question: "Onde guardamos comida gelada? (armário/geladeira/mesa)", correctAnswer: geladeira }
      - { type: literacy, question: "O que usamos para secar o corpo? (toalha/roupa/cobertor)", correctAnswer: toalha }
target: 10
