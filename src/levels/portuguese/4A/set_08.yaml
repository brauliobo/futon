title: Palavras Simples - Objetos da Casa
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — casa/objetos. Associa palavra escrita a referente concreto."
example: Identifique objetos comuns da casa.
pages:
  - pageNumber: 1
    title: Objetos da Casa
    description: Escolha o objeto correto.
    exercises:
      - type: literacy
        question: Onde dormimos? (cama/mesa/cadeira)
        correctAnswer: cama
        rationale: "Dormimos na cama."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde comemos? (cama/mesa/sofá)
        correctAnswer: mesa
        rationale: "Comemos à mesa."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde sentamos para comer? (mesa/cadeira/cama)
        correctAnswer: cadeira
        rationale: "Sentamos à cadeira para comer."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde assistimos TV? (cama/mesa/sofá)
        correctAnswer: sofá
        rationale: "A resposta correta é 'sofá'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que usamos para escovar os dentes? (pente/escova/sabonete)
        correctAnswer: escova
        rationale: "A resposta correta é 'escova'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que usamos para pentear o cabelo? (escova/pente/sabonete)
        correctAnswer: pente
        rationale: "A resposta correta é 'pente'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que usamos para lavar as mãos? (pente/escova/sabonete)
        correctAnswer: sabonete
        rationale: "A resposta correta é 'sabonete'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde guardamos roupas? (geladeira/armário/mesa)
        correctAnswer: armário
        rationale: "A resposta correta é 'armário'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde guardamos comida gelada? (armário/geladeira/mesa)
        correctAnswer: geladeira
        rationale: "A resposta correta é 'geladeira'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que usamos para secar o corpo? (toalha/roupa/cobertor)
        correctAnswer: toalha
        rationale: "A resposta correta é 'toalha'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
