title: Palavras Simples - Objetos da Casa
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — casa/objetos. Associa palavra escrita a referente concreto."
example: "Identifique objetos comuns da casa. Ex.: Onde dormimos? → cama."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Objetos da Casa
    description: Escolha o objeto correto.
    exercises:
      - type: literacy
        question: Onde dormimos? (cadeira/cama/mesa)
        correctAnswer: cama
        rationale: "Dormimos na cama."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde comemos? (cama/mesa/sofá)
        correctAnswer: mesa
        rationale: "Comemos à mesa."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde sentamos para comer? (cama/cadeira/mesa)
        correctAnswer: cadeira
        rationale: "Sentamos à cadeira para comer."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde assistimos TV? (cama/mesa/sofá)
        correctAnswer: sofá
        rationale: "Sofá é o móvel confortável da sala, em frente à TV."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que usamos para escovar os dentes? (escova/pente/sabonete)
        correctAnswer: escova
        rationale: "Compare: escova (de dentes) tem cerdas para os dentes; pente é para cabelo."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que usamos para pentear o cabelo? (pente/escova/sabonete)
        correctAnswer: pente
        rationale: "Compare: pente tem dentes longos para cabelos; escova (de dentes) é para boca."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que usamos para lavar as mãos? (sabonete/pente/escova)
        correctAnswer: sabonete
        rationale: "Sabonete faz espuma com água e limpa a pele; pente e escova não têm essa função."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde guardamos roupas? (geladeira/armário/mesa)
        correctAnswer: armário
        rationale: "Armário é móvel com portas e prateleiras para roupas; geladeira é para alimentos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde guardamos comida gelada? (geladeira/mesa/armário)
        correctAnswer: geladeira
        rationale: "Geladeira conserva alimentos resfriados; armário e mesa ficam em temperatura ambiente."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que usamos para secar o corpo? (cobertor/roupa/toalha)
        correctAnswer: toalha
        rationale: "Compare: toalha é tecido absorvente usada após o banho; cobertor esquenta na cama."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
