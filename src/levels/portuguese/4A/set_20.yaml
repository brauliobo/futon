title: Revisão Geral - 4A
level: 4A
subject: portuguese
example: Revise tudo que aprendeu no nível 4A.
pages:
  - pageNumber: 1
    title: Revisão Final
    description: Responda usando tudo que aprendeu.
    exercises:
      - { type: literacy, question: "Quantas vogais existem? (3/5/7)", correctAnswer: 5 }
      - { type: literacy, question: "O oposto de 'grande' é? (pequeno/médio/alto)", correctAnswer: pequeno }
      - { type: reading, question: "Onde dormimos? (sofá/cama/mesa)", correctAnswer: cama }
      - { type: literacy, question: "Qual palavra rima com 'sol'? (lua/gol/casa)", correctAnswer: gol }
      - { type: literacy, question: "Com que vemos? (olhos/ouvidos/nariz)", correctAnswer: olhos }
      - { type: reading, question: "Quem ensina na escola? (médico/professor/cozinheiro)", correctAnswer: professor }
      - { type: literacy, question: "BO + LA = ? (bola/bolla/bula)", correctAnswer: bola }
      - { type: reading, question: "O que fazemos no recreio? (dormir/brincar/cozinhar)", correctAnswer: brincar }
      - { type: literacy, question: "Qual palavra tem 'CH'? (chuva/casa/cola)", correctAnswer: chuva }
      - { type: literacy, question: "O primeiro dia da semana é? (domingo/segunda/sábado)", correctAnswer: domingo }
target: 10
