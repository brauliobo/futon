title: Revisão Geral - 4A
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Revise tudo que aprendeu no nível 4A. Ex.: Quantas vogais existem? → 5."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Revisão Final
    description: Responda usando tudo que aprendeu.
    exercises:
      - type: literacy
        question: Quantas vogais existem? (7/3/5)
        correctAnswer: 5
        rationale: "As vogais são A, E, I, O, U — cinco ao todo."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O oposto de 'grande' é? (pequeno/alto/médio)
        correctAnswer: pequeno
        rationale: "Antônimo — ideia contrária: pequeno."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Onde dormimos? (mesa/sofá/cama)
        correctAnswer: cama
        rationale: "Dormimos na cama."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra rima com 'sol'? (casa/gol/lua)
        correctAnswer: gol
        rationale: "'sol' e 'gol' têm terminação parecida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que vemos? (olhos/nariz/ouvidos)
        correctAnswer: olhos
        rationale: "Vemos com os olhos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quem ensina na escola? (professor/médico/cozinheiro)
        correctAnswer: professor
        rationale: "O professor é quem ensina; médico cuida da saúde e cozinheiro cozinha."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: BO + LA = ? (bula/bola/bolla)
        correctAnswer: bola
        rationale: "BO + LA forma bola."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O que fazemos no recreio? (brincar/dormir/cozinhar)
        correctAnswer: brincar
        rationale: "Recreio é o tempo de descanso entre as aulas para brincar."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'CH'? (cola/casa/chuva)
        correctAnswer: chuva
        rationale: "'chuva' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O primeiro dia da semana é? (segunda/domingo/sábado)
        correctAnswer: domingo
        rationale: "A semana começa no domingo."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
