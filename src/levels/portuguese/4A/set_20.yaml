title: Revisão Geral - 4A
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Revise tudo que aprendeu no nível 4A. Ex.: Quantas vogais existem? → 5."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Revisão Final
    description: Responda usando tudo que aprendeu.
    exercises:
      - type: literacy
        question: Quantas vogais existem? (7/5/3)
        correctAnswer: 5
        rationale: "Observe as opções e escolha a que responde \"Quantas vogais existem?\": '5'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O oposto de 'grande' é? (alto/pequeno/médio)
        correctAnswer: pequeno
        rationale: "Antônimo — ideia contrária: pequeno."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Onde dormimos? (cama/mesa/sofá)
        correctAnswer: cama
        rationale: "Dormimos na cama."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra rima com 'sol'? (lua/casa/gol)
        correctAnswer: gol
        rationale: "'sol' e 'gol' têm terminação parecida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que vemos? (nariz/ouvidos/olhos)
        correctAnswer: olhos
        rationale: "Vemos com os olhos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Quem ensina na escola? (médico/cozinheiro/professor)
        correctAnswer: professor
        rationale: "Observe as opções e escolha a que responde \"Quem ensina na escola?\": 'professor'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: BO + LA = ? (bola/bolla/bula)
        correctAnswer: bola
        rationale: "BO + LA forma bola."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: O que fazemos no recreio? (brincar/cozinhar/dormir)
        correctAnswer: brincar
        rationale: "Observe as opções e escolha a que responde \"O que fazemos no recreio?\": 'brincar'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'CH'? (cola/chuva/casa)
        correctAnswer: chuva
        rationale: "'chuva' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O primeiro dia da semana é? (sábado/domingo/segunda)
        correctAnswer: domingo
        rationale: "A semana começa no domingo."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
