title: Palavras Simples - Animais
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — animais. Leitura de palavras de alta frequência."
example: "Leia e identifique animais. Ex.: Qual animal faz 'miau'? → gato."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nomes de Animais
    description: Escolha o animal correto.
    exercises:
      - type: literacy
        question: Qual animal faz 'miau'? (gato/pássaro/cão)
        correctAnswer: gato
        rationale: "O som 'miau' é característico do gato."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal faz 'au au'? (vaca/gato/cão)
        correctAnswer: cão
        rationale: "O som 'au au' é característico do cão."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal dá leite? (vaca/peixe/galinha)
        correctAnswer: vaca
        rationale: "A vaca produz leite."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal voa? (gato/pássaro/peixe)
        correctAnswer: pássaro
        rationale: "Observe as opções e escolha a que responde \"Qual animal voa?\": 'pássaro'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal nada? (galinha/peixe/gato)
        correctAnswer: peixe
        rationale: "Observe as opções e escolha a que responde \"Qual animal nada?\": 'peixe'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal põe ovos? (galinha/vaca/cão)
        correctAnswer: galinha
        rationale: "Observe as opções e escolha a que responde \"Qual animal põe ovos?\": 'galinha'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal é grande e cinza? (rato/gato/elefante)
        correctAnswer: elefante
        rationale: "Observe as opções e escolha a que responde \"Qual animal é grande e cinza?\": 'elefante'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal pequeno gosta de queijo? (elefante/rato/vaca)
        correctAnswer: rato
        rationale: "Observe as opções e escolha a que responde \"Qual animal pequeno gosta de queijo?\": 'rato'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal salta e come cenoura? (peixe/galinha/coelho)
        correctAnswer: coelho
        rationale: "Observe as opções e escolha a que responde \"Qual animal salta e come cenoura?\": 'coelho'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal faz 'neigh'? (vaca/cão/cavalo)
        correctAnswer: cavalo
        rationale: "O som 'neigh' é característico do cavalo."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
