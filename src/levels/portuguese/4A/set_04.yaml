title: Palavras Simples - Animais
level: 4A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/4A.
example: Leia e identifique animais.
pages:
  - pageNumber: 1
    title: Nomes de Animais
    description: Escolha o animal correto.
    exercises:
      - { type: literacy, question: "Qual animal faz 'miau'? (gato/cão/pássaro)", correctAnswer: gato }
      - { type: literacy, question: "Qual animal faz 'au au'? (gato/cão/vaca)", correctAnswer: cão }
      - { type: literacy, question: "Qual animal dá leite? (galinha/vaca/peixe)", correctAnswer: vaca }
      - { type: literacy, question: "Qual animal voa? (peixe/gato/pássaro)", correctAnswer: pássaro }
      - { type: literacy, question: "Qual animal nada? (peixe/galinha/gato)", correctAnswer: peixe }
      - { type: literacy, question: "Qual animal põe ovos? (vaca/galinha/cão)", correctAnswer: galinha }
      - { type: literacy, question: "Qual animal é grande e cinza? (rato/elefante/gato)", correctAnswer: elefante }
      - { type: literacy, question: "Qual animal pequeno gosta de queijo? (elefante/rato/vaca)", correctAnswer: rato }
      - { type: literacy, question: "Qual animal salta e come cenoura? (coelho/peixe/galinha)", correctAnswer: coelho }
      - { type: literacy, question: "Qual animal faz 'neigh'? (vaca/cavalo/cão)", correctAnswer: cavalo }
target: 10
