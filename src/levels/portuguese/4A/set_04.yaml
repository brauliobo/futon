title: Palavras Simples - Animais
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — animais. Leitura de palavras de alta frequência."
example: "Leia e identifique animais. Ex.: Qual animal faz 'miau'? → gato."
pages:
  - pageNumber: 1
    title: Nomes de Animais
    description: Escolha o animal correto.
    exercises:
      - type: literacy
        question: Qual animal faz 'miau'? (gato/cão/pássaro)
        correctAnswer: gato
        rationale: "O som 'miau' é característico do gato."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal faz 'au au'? (gato/cão/vaca)
        correctAnswer: cão
        rationale: "O som 'au au' é característico do cão."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal dá leite? (galinha/vaca/peixe)
        correctAnswer: vaca
        rationale: "A vaca produz leite."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal voa? (peixe/gato/pássaro)
        correctAnswer: pássaro
        rationale: "A resposta correta é 'pássaro'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal nada? (peixe/galinha/gato)
        correctAnswer: peixe
        rationale: "A resposta correta é 'peixe'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal põe ovos? (vaca/galinha/cão)
        correctAnswer: galinha
        rationale: "A resposta correta é 'galinha'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal é grande e cinza? (rato/elefante/gato)
        correctAnswer: elefante
        rationale: "A resposta correta é 'elefante'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal pequeno gosta de queijo? (elefante/rato/vaca)
        correctAnswer: rato
        rationale: "A resposta correta é 'rato'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal salta e come cenoura? (coelho/peixe/galinha)
        correctAnswer: coelho
        rationale: "A resposta correta é 'coelho'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual animal faz 'neigh'? (vaca/cavalo/cão)
        correctAnswer: cavalo
        rationale: "O som 'neigh' é característico do cavalo."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
