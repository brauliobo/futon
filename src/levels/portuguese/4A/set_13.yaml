        rationale: "'olho' contém o dígrafo LH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'NH'? (novo/nota/ninho)
        correctAnswer: ninho
        rationale: "'ninho' contém o dígrafo NH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se fala o som de 'CH' em 'chocolate'? (s/tch/k)
        correctAnswer: tch
        rationale: "Observe as opções e escolha a que responde \"Como se fala o som de 'CH' em 'chocolate'?\": 'tch'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'LH'? (fino/filo/filho)
        correctAnswer: filho
        rationale: "'filho' contém o dígrafo LH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'NH'? (bando/bano/banho)
        correctAnswer: banho
        rationale: "'banho' contém o dígrafo NH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'CH'? (chave/clave/cave)
        correctAnswer: chave
        rationale: "'chave' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'LH'? (velho/vento/velo)
        correctAnswer: velho
        rationale: "'velho' contém o dígrafo LH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'NH'? (solo/sonho/sono)
        correctAnswer: sonho
        rationale: "'sonho' contém o dígrafo NH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'CH'? (chão/cão/são)
