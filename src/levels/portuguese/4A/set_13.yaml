      - { type: literacy, question: "Qual palavra tem 'NH'? (novo/ninho/nota)", correctAnswer: ninho }
      - { type: literacy, question: "Como se fala o som de 'CH' em 'chocolate'? (tch/k/s)", correctAnswer: tch }
      - { type: literacy, question: "Qual palavra tem 'LH'? (filho/filo/fino)", correctAnswer: filho }
      - { type: literacy, question: "Qual palavra tem 'NH'? (banho/bano/bando)", correctAnswer: banho }
      - { type: literacy, question: "Qual palavra tem 'CH'? (chave/cave/clave)", correctAnswer: chave }
      - { type: literacy, question: "Qual palavra tem 'LH'? (velho/velo/vento)", correctAnswer: velho }
      - { type: literacy, question: "Qual palavra tem 'NH'? (sonho/sono/solo)", correctAnswer: sonho }
      - { type: literacy, question: "Qual palavra tem 'CH'? (chão/cão/são)", correctAnswer: chão }
target: 10
