title: Palavras com CH, LH, NH
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Dígrafos CH, LH, NH. Duas letras, um som (chave, palha, ninho)."
example: "Identifique sons especiais em palavras. Ex.: Qual palavra tem 'CH'? → chuva."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Sons Especiais
    description: Escolha a palavra com o som correto.
    exercises:
      - type: literacy
        question: Qual palavra tem 'CH'? (cola/casa/chuva)
        correctAnswer: chuva
        rationale: "'chuva' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'LH'? (alto/bolo/olho)
        correctAnswer: olho
        rationale: "'olho' contém o dígrafo LH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'NH'? (nota/novo/ninho)
        correctAnswer: ninho
        rationale: "'ninho' contém o dígrafo NH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se fala o som de 'CH' em 'chocolate'? (k/s/tch)
        correctAnswer: tch
        rationale: "Em português, CH (dígrafo) não soa como /k/ nem /s/ — tem som próprio representado como 'tch'/'ch' (chocolate, chave)."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'LH'? (filo/fino/filho)
        correctAnswer: filho
        rationale: "'filho' contém o dígrafo LH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'NH'? (bano/bando/banho)
        correctAnswer: banho
        rationale: "'banho' contém o dígrafo NH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'CH'? (chave/cave/clave)
        correctAnswer: chave
        rationale: "'chave' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'LH'? (vento/velho/velo)
        correctAnswer: velho
        rationale: "'velho' contém o dígrafo LH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'NH'? (sonho/solo/sono)
        correctAnswer: sonho
        rationale: "'sonho' contém o dígrafo NH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'CH'? (chão/são/cão)
        correctAnswer: chão
        rationale: "'chão' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
