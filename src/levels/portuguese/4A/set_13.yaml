title: Palavras com CH, LH, NH
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Dígrafos CH, LH, NH. Duas letras, um som (chave, palha, ninho)."
example: Identifique sons especiais em palavras.
pages:
  - pageNumber: 1
    title: Sons Especiais
    description: Escolha a palavra com o som correto.
    exercises:
      - type: literacy
        question: Qual palavra tem 'CH'? (chuva/casa/cola)
        correctAnswer: chuva
        rationale: "'chuva' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'LH'? (bolo/olho/alto)
        correctAnswer: olho
        rationale: "'olho' contém o dígrafo LH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'NH'? (novo/ninho/nota)
        correctAnswer: ninho
        rationale: "'ninho' contém o dígrafo NH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se fala o som de 'CH' em 'chocolate'? (tch/k/s)
        correctAnswer: tch
        rationale: "Resposta: tch — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'LH'? (filho/filo/fino)
        correctAnswer: filho
        rationale: "'filho' contém o dígrafo LH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'NH'? (banho/bano/bando)
        correctAnswer: banho
        rationale: "'banho' contém o dígrafo NH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'CH'? (chave/cave/clave)
        correctAnswer: chave
        rationale: "'chave' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'LH'? (velho/velo/vento)
        correctAnswer: velho
        rationale: "'velho' contém o dígrafo LH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'NH'? (sonho/sono/solo)
        correctAnswer: sonho
        rationale: "'sonho' contém o dígrafo NH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'CH'? (chão/cão/são)
        correctAnswer: chão
        rationale: "'chão' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
