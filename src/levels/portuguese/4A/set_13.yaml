title: Palavras com CH, LH, NH
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Dígrafos CH, LH, NH. Duas letras, um som (chave, palha, ninho)."
example: "Identifique sons especiais em palavras. Ex.: Qual palavra tem 'CH'? → chuva."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Sons Especiais
    description: Escolha a palavra com o som correto.
    exercises:
      - type: literacy
        question: Qual palavra tem 'CH'? (cola/chuva/casa)
        correctAnswer: chuva
        rationale: "'chuva' contém o dígrafo CH."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem 'LH'? (bolo/alto/olho)
