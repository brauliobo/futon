title: Dias da Semana
level: 4A
subject: portuguese
example: Identifique os dias da semana.
pages:
  - pageNumber: 1
    title: Dias da Semana
    description: Responda sobre os dias da semana.
    exercises:
      - type: literacy
        question: O primeiro dia da semana é? (domingo/segunda/sábado)
        correctAnswer: domingo
      - type: literacy
        question: Que dia vem depois de domingo? (segunda/terça/sábado)
        correctAnswer: segunda
      - type: literacy
        question: Que dia vem depois de segunda? (terça/quarta/domingo)
        correctAnswer: terça
      - type: literacy
        question: Que dia vem depois de terça? (quarta/quinta/sexta)
        correctAnswer: quarta
      - type: literacy
        question: Que dia vem depois de quarta? (quinta/sexta/sábado)
        correctAnswer: quinta
      - type: literacy
        question: Que dia vem depois de quinta? (sexta/sábado/domingo)
        correctAnswer: sexta
      - type: literacy
        question: Que dia vem depois de sexta? (sábado/domingo/segunda)
        correctAnswer: sábado
      - type: literacy
        question: Quantos dias tem uma semana? (5/7/10)
        correctAnswer: 7
      - type: literacy
        question: Em que dias as crianças vão à escola? (segunda a sexta/sábado e
          domingo/todos os dias)
        correctAnswer: segunda a sexta
      - type: literacy
        question: O último dia da semana é? (sexta/sábado/domingo)
        correctAnswer: sábado
target: 10
