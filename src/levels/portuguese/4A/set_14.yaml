        question: O primeiro dia da semana é? (sábado/domingo/segunda)
        correctAnswer: domingo
        rationale: "A semana começa no domingo."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Que dia vem depois de domingo? (terça/sábado/segunda)
        correctAnswer: segunda
        rationale: "Depois de domingo vem segunda."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Que dia vem depois de segunda? (quarta/terça/domingo)
        correctAnswer: terça
        rationale: "Depois de segunda vem terça."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Que dia vem depois de terça? (quarta/quinta/sexta)
        correctAnswer: quarta
        rationale: "Depois de terça vem quarta."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Que dia vem depois de quarta? (sexta/quinta/sábado)
        correctAnswer: quinta
        rationale: "Depois de quarta vem quinta."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Que dia vem depois de quinta? (domingo/sábado/sexta)
        correctAnswer: sexta
        rationale: "Depois de quinta vem sexta."
