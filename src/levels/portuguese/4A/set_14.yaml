        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Em que dias as crianças vão à escola? (segunda a sexta/sábado e domingo/todos os dias)
        correctAnswer: segunda a sexta
        rationale: "Observe as opções e escolha a que responde \"Em que dias as crianças vão à escola?\": 'segunda a sexta'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O último dia da semana é? (sábado/domingo/sexta)
        correctAnswer: sábado
