      - { type: literacy, question: "A cor da neve é? (preto/branco/azul)", correctAnswer: branco }
      - { type: literacy, question: "A cor da noite é? (branco/preto/amarelo)", correctAnswer: preto }
      - { type: literacy, question: "A cor de uma laranja é? (laranja/azul/verde)", correctAnswer: laranja }
