title: Palavras Simples - Cores
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — cores. Associe palavra à imagem."
example: "Identifique cores básicas. Ex.: A cor do sol é? → amarelo."
pages:
  - pageNumber: 1
    title: Cores Básicas
    description: Escolha a cor correta.
    exercises:
      - type: literacy
        question: A cor do sol é? (azul/amarelo/verde)
        correctAnswer: amarelo
        rationale: "O sol tem cor amarelo."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A cor do céu é? (azul/vermelho/amarelo)
        correctAnswer: azul
        rationale: "O céu tem cor azul."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A cor da grama é? (azul/verde/vermelho)
        correctAnswer: verde
        rationale: "A grama tem cor verde."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A cor do sangue é? (verde/azul/vermelho)
        correctAnswer: vermelho
        rationale: "O sangue tem cor vermelho."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A cor da neve é? (preto/branco/azul)
        correctAnswer: branco
        rationale: "A neve tem cor branco."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A cor da noite é? (branco/preto/amarelo)
        correctAnswer: preto
        rationale: "A noite tem cor preto."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A cor de uma laranja é? (laranja/azul/verde)
        correctAnswer: laranja
        rationale: "A resposta correta é 'laranja'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A cor de uma uva roxa é? (verde/roxo/amarelo)
        correctAnswer: roxo
        rationale: "A resposta correta é 'roxo'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A cor do chocolate é? (azul/marrom/verde)
        correctAnswer: marrom
        rationale: "O chocolate tem cor marrom."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A cor de um flamingo é? (azul/rosa/verde)
        correctAnswer: rosa
        rationale: "A resposta correta é 'rosa'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
