title: Partes do Corpo
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário do corpo humano. Base para descrições."
example: "Identifique partes do corpo humano. Ex.: Com que vemos? → olhos."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nosso Corpo
    description: Escolha a parte do corpo correta.
    exercises:
      - type: literacy
        question: Com que vemos? (olhos/boca/ouvidos)
        correctAnswer: olhos
        rationale: "Vemos com os olhos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que ouvimos? (olhos/ouvidos/nariz)
        correctAnswer: ouvidos
        rationale: "Ouvimos com os ouvidos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que cheiramos? (nariz/olhos/boca)
        correctAnswer: nariz
        rationale: "Cheiramos com o nariz."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que comemos? (boca/nariz/ouvidos)
        correctAnswer: boca
        rationale: "Observe as opções e escolha a que responde \"Com que comemos?\": 'boca'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que andamos? (pés/mãos/braços)
        correctAnswer: pés
        rationale: "Observe as opções e escolha a que responde \"Com que andamos?\": 'pés'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
