        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que fica no topo da cabeça? (orelha/olho/cabelo)
        correctAnswer: cabelo
        rationale: "Observe as opções e escolha a que responde \"O que fica no topo da cabeça?\": 'cabelo'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Quantos dedos temos em cada mão? (5/4/6)
        correctAnswer: 5
        rationale: "Observe as opções e escolha a que responde \"Quantos dedos temos em cada mão?\": '5'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que conecta a cabeça ao corpo? (perna/braço/pescoço)
        correctAnswer: pescoço
        rationale: "Observe as opções e escolha a que responde \"O que conecta a cabeça ao corpo?\": 'pescoço'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde fica o coração? (cabeça/peito/barriga)
