title: 🌟 Partes do Corpo
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário do corpo humano. Base para descrições."
example: "Identifique partes do corpo humano. Ex.: Com que vemos? → olhos."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nosso Corpo
    description: Escolha a parte do corpo correta.
    exercises:
      - type: literacy
        question: Com que vemos? (ouvidos/olhos/boca)
        correctAnswer: olhos
        rationale: "Vemos com os olhos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que ouvimos? (ouvidos/olhos/nariz)
        correctAnswer: ouvidos
        rationale: "Ouvimos com os ouvidos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que cheiramos? (boca/olhos/nariz)
        correctAnswer: nariz
        rationale: "Cheiramos com o nariz."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que comemos? (ouvidos/nariz/boca)
        correctAnswer: boca
        rationale: "A boca tem dentes e língua — serve para mastigar e engolir comida."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que andamos? (braços/mãos/pés)
        correctAnswer: pés
        rationale: "Os pés suportam o corpo e nos levam de um lugar a outro ao caminhar."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Com que pegamos coisas? (mãos/ombros/pés)
        correctAnswer: mãos
        rationale: "As mãos têm dedos que se fecham e seguram objetos."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que fica no topo da cabeça? (olho/orelha/cabelo)
        correctAnswer: cabelo
        rationale: "O cabelo cobre o topo da cabeça; olhos e orelhas ficam nas laterais do rosto."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Quantos dedos temos em cada mão? (4/6/5)
        correctAnswer: 5
        rationale: "Conte os dedos de uma mão: polegar, indicador, médio, anular e mindinho → 5."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O que conecta a cabeça ao corpo? (braço/perna/pescoço)
        correctAnswer: pescoço
        rationale: "O pescoço é a parte fina entre a cabeça e os ombros; braços saem dos ombros e pernas do quadril."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Onde fica o coração? (peito/barriga/cabeça)
        correctAnswer: peito
        rationale: "Observe a anatomia: o coração fica no peito (tórax), protegido pelas costelas."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
