title: Palavras com R e RR
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "R vs RR. R no início ou após consoante = som forte; RR sempre forte entre vogais; R simples entre vogais = som fraco."
example: "Diferencie sons do R simples e duplo. Ex.: Qual palavra tem R forte? → carro."
pages:
  - pageNumber: 1
    title: Som do R
    description: Escolha a palavra com o som correto.
    exercises:
      - type: literacy
        question: Qual palavra tem R forte? (carro/caro/cara)
        correctAnswer: carro
        rationale: "R forte ocorre em RR, R no início ou após consoante: carro."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem R fraco? (rato/caro/rua)
        correctAnswer: caro
        rationale: "R fraco ocorre entre vogais: caro."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como soa o RR em 'cachorro'? (forte/fraco)
        correctAnswer: forte
        rationale: "Observe as opções e escolha a que responde \"Como soa o RR em 'cachorro'?\": 'forte'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como soa o R em 'Maria'? (forte/fraco)
        correctAnswer: fraco
        rationale: "Observe as opções e escolha a que responde \"Como soa o R em 'Maria'?\": 'fraco'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem RR? (barato/barraca/parado)
        correctAnswer: barraca
        rationale: "Observe as opções e escolha a que responde \"Qual palavra tem RR?\": 'barraca'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem R simples? (terra/para/roda)
        correctAnswer: para
        rationale: "Observe as opções e escolha a que responde \"Qual palavra tem R simples?\": 'para'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem R forte no início? (rede/carro/para)
        correctAnswer: rede
        rationale: "R forte ocorre em RR, R no início ou após consoante: rede."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem RR? (ferro/fero/faro)
        correctAnswer: ferro
        rationale: "Observe as opções e escolha a que responde \"Qual palavra tem RR?\": 'ferro'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como soa o R em 'girafa'? (forte/fraco)
        correctAnswer: fraco
        rationale: "Observe as opções e escolha a que responde \"Como soa o R em 'girafa'?\": 'fraco'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem som forte de R? (morro/moro/mora)
        correctAnswer: morro
        rationale: "Observe as opções e escolha a que responde \"Qual palavra tem som forte de R?\": 'morro'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
