title: Palavras com R e RR
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "R vs RR. R no início ou após consoante = som forte; RR sempre forte entre vogais; R simples entre vogais = som fraco."
example: "Diferencie sons do R simples e duplo. Ex.: Qual palavra tem R forte? → carro."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Som do R
    description: Escolha a palavra com o som correto.
    exercises:
      - type: literacy
        question: "Qual palavra tem R forte? (carro/caro/cara)"
        correctAnswer: carro
        rationale: "R forte ocorre em RR, R no início ou após consoante: carro."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem R fraco? (rua/rato/caro)
        correctAnswer: caro
        rationale: "R fraco ocorre entre vogais: caro."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como soa o RR em 'cachorro'? (fraco/forte)
        correctAnswer: forte
        rationale: "RR entre vogais sempre soa forte (duplo R) — 'cachorro' tem som de R forte."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como soa o R em 'Maria'? (fraco/forte)
        correctAnswer: fraco
        rationale: "R simples entre vogais (a-R-i) soa fraco — 'Maria' tem R fraco."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem RR? (parado/barraca/barato)
        correctAnswer: barraca
        rationale: "BARRACA tem duplo R entre vogais (a-RR-a); parado e barato têm R simples."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem R simples? (para/roda/terra)
        correctAnswer: para
        rationale: "PARA tem R simples entre vogais (a-R-a); terra tem RR e roda tem R no início."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: "Qual palavra tem R forte no início? (rede/para/carro)"
        correctAnswer: rede
        rationale: "R forte ocorre em RR, R no início ou após consoante: rede."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Qual palavra tem RR? (fero/faro/ferro)
        correctAnswer: ferro
        rationale: "FERRO tem duplo R entre vogais (e-RR-o); fero e faro têm R simples."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como soa o R em 'girafa'? (fraco/forte)
        correctAnswer: fraco
        rationale: "R simples entre vogais (i-R-a) soa fraco — 'girafa' tem R fraco."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: "Qual palavra tem som forte de R? (morro/mora/moro)"
        correctAnswer: morro
        rationale: "Observe o dígrafo: MORRO tem RR (duplo R) — único com som forte; mora e moro têm R simples fraco."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
