        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: A água é? (ruim/desnecessária/importante)
        correctAnswer: importante
        rationale: "Observe as opções e escolha a que responde \"A água é?\": 'importante'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
