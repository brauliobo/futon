title: Compreensão - Alimentação
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Compreensão de texto curto. Desenvolve localização de informação explícita."
example: "Responda sobre alimentos e refeições. Ex.: Que comemos no café da manhã? → pão."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Nossa Alimentação
    description: Responda sobre comida e refeições.
    exercises:
      - type: reading
        question: Que comemos no café da manhã? (macarrão/pão/sopa)
        correctAnswer: pão
        rationale: "Observe as opções e escolha a que responde \"Que comemos no café da manhã?\": 'pão'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Que bebemos de manhã? (vinho/refrigerante/leite)
        correctAnswer: leite
        rationale: "Observe as opções e escolha a que responde \"Que bebemos de manhã?\": 'leite'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Qual refeição fazemos ao meio-dia? (jantar/café/almoço)
        correctAnswer: almoço
        rationale: "Observe as opções e escolha a que responde \"Qual refeição fazemos ao meio-dia?\": 'almoço'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Que comemos no almoço? (cereal/torrada/arroz e feijão)
        correctAnswer: arroz e feijão
        rationale: "Observe as opções e escolha a que responde \"Que comemos no almoço?\": 'arroz e feijão'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
