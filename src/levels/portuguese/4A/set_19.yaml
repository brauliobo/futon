title: Compreensão - Alimentação
level: 4A
subject: portuguese
difficulty: 1
objectives: [pt.literacy]
authorNotes: Conjunto de portuguese/4A.
example: Responda sobre alimentos e refeições.
pages:
  - pageNumber: 1
    title: Nossa Alimentação
    description: Responda sobre comida e refeições.
    exercises:
      - { type: reading, question: "Que comemos no café da manhã? (pão/macarrão/sopa)", correctAnswer: pão }
      - { type: reading, question: "Que bebemos de manhã? (refrigerante/leite/vinho)", correctAnswer: leite }
      - { type: reading, question: "Qual refeição fazemos ao meio-dia? (café/almoço/jantar)", correctAnswer: almoço }
      - { type: reading, question: "Que comemos no almoço? (cereal/arroz e feijão/torrada)", correctAnswer: arroz e feijão }
      - { type: reading, question: "Qual refeição fazemos à noite? (café/almoço/jantar)", correctAnswer: jantar }
      - { type: reading, question: "Frutas são? (saudáveis/ruins/perigosas)", correctAnswer: saudáveis }
      - { type: reading, question: "Verduras são? (vermelhas/verdes/azuis)", correctAnswer: verdes }
      - { type: reading, question: "Para crescer forte, devemos comer? (doces/verduras/balas)", correctAnswer: verduras }
      - { type: literacy, question: "Quantas refeições fazemos por dia? (2/3/5)", correctAnswer: 3 }
      - { type: reading, question: "A água é? (importante/desnecessária/ruim)", correctAnswer: importante }
target: 10
