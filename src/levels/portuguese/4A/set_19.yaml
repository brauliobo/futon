        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
        question: Verduras são? (azuis/vermelhas/verdes)
        correctAnswer: verdes
        rationale: "Observe as opções e escolha a que responde \"Verduras são?\": 'verdes'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: reading
