title: Números - Escrita por Extenso
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Escrita por extenso. Atenção à ortografia de 'dezesseis', 'quatorze'."
example: Leia números escritos por extenso.
pages:
  - pageNumber: 1
    title: Números de 1 a 10
    description: Escolha o número correto.
    exercises:
      - type: literacy
        question: Como se escreve o número 1? (um/dois/três)
        correctAnswer: um
        rationale: "1 por extenso é "um"."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se escreve o número 2? (um/dois/três)
        correctAnswer: dois
        rationale: "2 por extenso é "dois"."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se escreve o número 3? (dois/três/quatro)
        correctAnswer: três
        rationale: "3 por extenso é "três"."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se escreve o número 4? (três/quatro/cinco)
        correctAnswer: quatro
        rationale: "4 por extenso é "quatro"."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se escreve o número 5? (quatro/cinco/seis)
        correctAnswer: cinco
        rationale: "5 por extenso é "cinco"."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se escreve o número 6? (cinco/seis/sete)
        correctAnswer: seis
        rationale: "6 por extenso é "seis"."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se escreve o número 7? (seis/sete/oito)
        correctAnswer: sete
        rationale: "7 por extenso é "sete"."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se escreve o número 8? (sete/oito/nove)
        correctAnswer: oito
        rationale: "8 por extenso é "oito"."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se escreve o número 9? (oito/nove/dez)
        correctAnswer: nove
        rationale: "9 por extenso é "nove"."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Como se escreve o número 10? (nove/dez/onze)
        correctAnswer: dez
        rationale: "10 por extenso é "dez"."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
