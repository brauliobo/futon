title: Palavras Simples - Família
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — família. Palavras de uso cotidiano."
example: "Identifique membros da família. Ex.: Quem é o pai do seu pai? → avô."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Família
    description: Escolha o membro da família correto.
    exercises:
      - type: literacy
        question: Quem é o pai do seu pai? (avô/irmão/tio)
        correctAnswer: avô
        rationale: "O pai do pai é o avô."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Quem é a mãe da sua mãe? (irmã/tia/avó)
        correctAnswer: avó
        rationale: "A mãe da mãe é a avó."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Quem cuida de você em casa? (professor/vizinho/pai e mãe)
        correctAnswer: pai e mãe
        rationale: "Em casa, quem cuida são pai e mãe."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Seu irmão do sexo masculino é? (primo/irmão/irmã)
        correctAnswer: irmão
        rationale: "Concordância: o termo deve concordar em gênero e número."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Sua irmã do sexo feminino é? (prima/irmã/irmão)
        correctAnswer: irmã
        rationale: "Concordância: o termo deve concordar em gênero e número."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O filho do seu tio é seu? (primo/avô/irmão)
        correctAnswer: primo
        rationale: "Observe as opções e escolha a que responde \"O filho do seu tio é seu?\": 'primo'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A filha da sua tia é sua? (avó/irmã/prima)
        correctAnswer: prima
        rationale: "Observe as opções e escolha a que responde \"A filha da sua tia é sua?\": 'prima'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O irmão do seu pai é seu? (tio/primo/avô)
        correctAnswer: tio
        rationale: "Observe as opções e escolha a que responde \"O irmão do seu pai é seu?\": 'tio'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A irmã da sua mãe é sua? (avó/tia/prima)
        correctAnswer: tia
        rationale: "Observe as opções e escolha a que responde \"A irmã da sua mãe é sua?\": 'tia'."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Você é o que dos seus pais? (neto/sobrinho/filho)
        correctAnswer: filho
        rationale: "Observe as opções e escolha a que responde \"Você é o que dos seus pais?\": 'filho'."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
