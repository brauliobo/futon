title: Palavras Simples - Família
level: 4A
subject: portuguese
difficulty: 1
objectives:
  - pt.literacy
authorNotes: "Vocabulário básico — família. Palavras de uso cotidiano."
example: Identifique membros da família.
pages:
  - pageNumber: 1
    title: Família
    description: Escolha o membro da família correto.
    exercises:
      - type: literacy
        question: Quem é o pai do seu pai? (tio/avô/irmão)
        correctAnswer: avô
        rationale: "O pai do pai é o avô."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Quem é a mãe da sua mãe? (tia/avó/irmã)
        correctAnswer: avó
        rationale: "A mãe da mãe é a avó."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Quem cuida de você em casa? (vizinho/pai e mãe/professor)
        correctAnswer: pai e mãe
        rationale: "Em casa, quem cuida são pai e mãe."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Seu irmão do sexo masculino é? (irmão/irmã/primo)
        correctAnswer: irmão
        rationale: "Resposta: irmão — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Sua irmã do sexo feminino é? (irmão/irmã/prima)
        correctAnswer: irmã
        rationale: "Resposta: irmã — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O filho do seu tio é seu? (irmão/primo/avô)
        correctAnswer: primo
        rationale: "Resposta: primo — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A filha da sua tia é sua? (irmã/prima/avó)
        correctAnswer: prima
        rationale: "Resposta: prima — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: O irmão do seu pai é seu? (avô/tio/primo)
        correctAnswer: tio
        rationale: "Resposta: tio — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: A irmã da sua mãe é sua? (avó/tia/prima)
        correctAnswer: tia
        rationale: "Resposta: tia — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
      - type: literacy
        question: Você é o que dos seus pais? (neto/filho/sobrinho)
        correctAnswer: filho
        rationale: "Resposta: filho — consulte a informação dada."
        difficulty: 1
        objectives: [pt.literacy]
target: 10
