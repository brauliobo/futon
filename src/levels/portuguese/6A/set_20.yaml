title: Revisão Geral
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: Conjunto de portuguese/6A.
example: Revisão de tudo que aprendemos.
pages:
  - pageNumber: 1
    title: Revisão Vogais
    description: Lembre-se das vogais.
    exercises:
      - type: reading
        question: Quantas vogais existem? (5/4/6)
        correctAnswer: 5
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 2
    title: Revisão Alfabeto
    description: Lembre-se do alfabeto.
    exercises:
      - type: reading
        question: Primeira letra do alfabeto? (A/B/C)
        correctAnswer: A
        rationale: Reveja o trecho relevante do texto.
  - pageNumber: 3
    title: Revisão Sílabas
    description: Lembre-se das sílabas.
    exercises:
      - type: reading
        question: BA + NA + NA = ? (BANANA/BACANA/BATANA)
        correctAnswer: BANANA
        rationale: Reveja o trecho relevante do texto.
