title: Revisão Geral
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Revisão de tudo que aprendemos. Ex.: Quantas vogais existem? → 5."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Revisão Vogais
    description: Lembre-se das vogais.
    exercises:
      - type: reading
        question: Quantas vogais existem? (5/4/6)
        correctAnswer: 5
        rationale: "As vogais são A, E, I, O, U — cinco ao todo."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 2
    title: Revisão Alfabeto
    description: Lembre-se do alfabeto.
    exercises:
      - type: reading
        question: Primeira letra do alfabeto? (A/C/B)
        correctAnswer: A
        rationale: "Observe as opções e escolha a que responde \"Primeira letra do alfabeto?\": 'A'."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 3
    title: Revisão Sílabas
    description: Lembre-se das sílabas.
    exercises:
      - type: reading
        question: BA + NA + NA = ? (BATANA/BACANA/BANANA)
        correctAnswer: BANANA
        rationale: "Observe as opções e escolha a que responde \"BA + NA + NA = ?\": 'BANANA'."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 4
    title: Revisão Animais
    description: Lembre-se dos animais.
    exercises:
      - type: reading
        question: Animal que mia? (PATO/RATO/GATO)
        correctAnswer: GATO
        rationale: "'GATO' é animal que mia."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 5
    title: Revisão Cores
    description: Lembre-se das cores.
    exercises:
      - type: reading
        question: Cor do céu? (ROSA/VERDE/AZUL)
        correctAnswer: AZUL
        rationale: "Observe as opções e escolha a que responde \"Cor do céu?\": 'AZUL'."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 6
    title: Revisão Família
    description: Lembre-se da família.
    exercises:
      - type: reading
        question: Mãe da mamãe é? (VOVÔ/VOVÓ/TIA)
        correctAnswer: VOVÓ
        rationale: "Observe as opções e escolha a que responde \"Mãe da mamãe é?\": 'VOVÓ'."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 7
    title: Revisão Comida
    description: Lembre-se das comidas.
    exercises:
      - type: reading
        question: Bebida branca? (CAFÉ/ÁGUA/LEITE)
        correctAnswer: LEITE
        rationale: "'LEITE' é bebida branca."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 8
    title: Revisão Números
    description: Lembre-se dos números.
    exercises:
      - type: reading
        question: Depois de DOIS vem? (QUATRO/CINCO/TRÊS)
        correctAnswer: TRÊS
        rationale: "Observe as opções e escolha a que responde \"Depois de DOIS vem?\": 'TRÊS'."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 9
    title: Revisão Ações
    description: Lembre-se das ações.
    exercises:
      - type: reading
        question: O que fazemos com comida? (CANTAR/PULAR/COMER)
        correctAnswer: COMER
        rationale: "Observe as opções e escolha a que responde \"O que fazemos com comida?\": 'COMER'."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 10
    title: Parabéns!
    description: Você completou o nível 6A!
    exercises:
      - type: reading
        question: Você aprendeu muito! Está? (TRISTE/BRAVO/FELIZ)
        correctAnswer: FELIZ
        rationale: "Observe as opções e escolha a que responde \"Você aprendeu muito! Está?\": 'FELIZ'."
        difficulty: 2
        objectives: [pt.pre_reading]
target: 10
