title: 📝 Revisão Geral
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Revisão de tudo que aprendemos. Ex.: Quantas vogais existem? → 5."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Revisão Vogais
    description: Lembre-se das vogais.
    exercises:
      - type: reading
        question: Quantas vogais existem? (5/6/4)
        correctAnswer: 5
        rationale: "As vogais são A, E, I, O, U — cinco ao todo."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 2
    title: Revisão Alfabeto
    description: Lembre-se do alfabeto.
    exercises:
      - type: reading
        question: Primeira letra do alfabeto? (B/A/C)
        correctAnswer: A
        rationale: "A ordem A-B-C-...-Z começa por A — a 1ª letra."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 3
    title: Revisão Sílabas
    description: Lembre-se das sílabas.
    exercises:
      - type: reading
        question: BA + NA + NA = ? (BANANA/BATANA/BACANA)
        correctAnswer: BANANA
        rationale: "Junte as sílabas: BA-NA-NA → BANANA (fruta amarela)."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 4
    title: Revisão Animais
    description: Lembre-se dos animais.
    exercises:
      - type: reading
        question: Animal que mia? (RATO/PATO/GATO)
        correctAnswer: GATO
        rationale: "'GATO' é animal que mia."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 5
    title: Revisão Cores
    description: Lembre-se das cores.
    exercises:
      - type: reading
        question: Cor do céu? (VERDE/ROSA/AZUL)
        correctAnswer: AZUL
        rationale: "O céu durante o dia aparece AZUL (cor da atmosfera)."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 6
    title: Revisão Família
    description: Lembre-se da família.
    exercises:
      - type: reading
        question: Mãe da mamãe é? (VOVÓ/VOVÔ/TIA)
        correctAnswer: VOVÓ
        rationale: "VOVÓ é a mãe da mãe (feminino); VOVÔ é o pai da mãe e tia é irmã."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 7
    title: Revisão Comida
    description: Lembre-se das comidas.
    exercises:
      - type: reading
        question: Bebida branca? (LEITE/CAFÉ/ÁGUA)
        correctAnswer: LEITE
        rationale: "'LEITE' é bebida branca."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 8
    title: Revisão Números
    description: Lembre-se dos números.
    exercises:
      - type: reading
        question: Depois de DOIS vem? (CINCO/QUATRO/TRÊS)
        correctAnswer: TRÊS
        rationale: "Contagem 1, 2, 3: depois de 2 (DOIS) vem 3 (TRÊS)."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 9
    title: Revisão Ações
    description: Lembre-se das ações.
    exercises:
      - type: reading
        question: O que fazemos com comida? (COMER/PULAR/CANTAR)
        correctAnswer: COMER
        rationale: "A comida serve para COMER (alimentação); pular e cantar são outras ações."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 10
    title: Parabéns!
    description: Você completou o nível 6A!
    exercises:
      - type: reading
        question: Você aprendeu muito! Está? (BRAVO/TRISTE/FELIZ)
        correctAnswer: FELIZ
        rationale: "Quando aprendemos coisas novas e chegamos ao fim do nível, ficamos FELIZES."
        difficulty: 2
        objectives: [pt.pre_reading]
target: 10
