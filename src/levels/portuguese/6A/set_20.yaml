title: Revisão Geral
level: 6A
subject: portuguese
example: Revisão de tudo que aprendemos.
pages:
  - pageNumber: 1
    title: Revisão Vogais
    description: Lembre-se das vogais.
    exercises:
      - type: reading
        question: "Quantas vogais existem? (5/4/6)"
        correctAnswer: 5
  - pageNumber: 2
    title: Revisão Alfabeto
    description: Lembre-se do alfabeto.
    exercises:
      - type: reading
        question: "Primeira letra do alfabeto? (A/B/C)"
        correctAnswer: A
  - pageNumber: 3
    title: Revisão Sílabas
    description: Lembre-se das sílabas.
    exercises:
      - type: reading
        question: "BA + NA + NA = ? (BANANA/BACANA/BATANA)"
        correctAnswer: BANANA
  - pageNumber: 4
    title: Revisão Animais
    description: Lembre-se dos animais.
    exercises:
      - type: reading
        question: "Animal que mia? (GATO/PATO/RATO)"
        correctAnswer: GATO
  - pageNumber: 5
    title: Revisão Cores
    description: Lembre-se das cores.
    exercises:
      - type: reading
        question: "Cor do céu? (AZUL/ROSA/VERDE)"
        correctAnswer: AZUL
  - pageNumber: 6
    title: Revisão Família
    description: Lembre-se da família.
    exercises:
      - type: reading
        question: "Mãe da mamãe é? (VOVÓ/VOVÔ/TIA)"
        correctAnswer: VOVÓ
  - pageNumber: 7
    title: Revisão Comida
    description: Lembre-se das comidas.
    exercises:
      - type: reading
        question: "Bebida branca? (LEITE/ÁGUA/CAFÉ)"
        correctAnswer: LEITE
  - pageNumber: 8
    title: Revisão Números
    description: Lembre-se dos números.
    exercises:
      - type: reading
        question: "Depois de DOIS vem? (TRÊS/QUATRO/CINCO)"
        correctAnswer: TRÊS
  - pageNumber: 9
    title: Revisão Ações
    description: Lembre-se das ações.
    exercises:
      - type: reading
        question: "O que fazemos com comida? (COMER/PULAR/CANTAR)"
        correctAnswer: COMER
  - pageNumber: 10
    title: Parabéns!
    description: Você completou o nível 6A!
    exercises:
      - type: reading
        question: "Você aprendeu muito! Está? (FELIZ/TRISTE/BRAVO)"
        correctAnswer: FELIZ
target: 10
