title: Reconhecimento de Vogais
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Reconhecimento das vogais A E I O U. Pré-req para formação de sílabas."
example: "Identifique as vogais A, E, I, O, U e suas aplicações. Ex.: Escolha a vogal A: → A."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: As 5 Vogais
    description: Identifique cada vogal.
    exercises:
      - type: reading
        question: "Escolha a vogal A: (C/A/B)"
        correctAnswer: A
        rationale: "A vogal A — identifique pela forma."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: "Escolha a vogal E: (D/E/F)"
        correctAnswer: E
        rationale: "A vogal E — identifique pela forma."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: "Escolha a vogal I: (I/G/H)"
        correctAnswer: I
        rationale: "A vogal I — identifique pela forma."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: "Escolha a vogal O: (P/O/N)"
        correctAnswer: O
        rationale: "A vogal O — identifique pela forma."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: "Escolha a vogal U: (V/U/T)"
        correctAnswer: U
        rationale: "A vogal U — identifique pela forma."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Quantas vogais tem o alfabeto? (3/5/7)
        correctAnswer: "5"
        rationale: "Conte as vogais em 'o': 5."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: B é vogal? (não/sim)
        correctAnswer: não
        rationale: "As vogais são A, E, I, O, U. B é consoante."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A é vogal? (não/sim)
        correctAnswer: sim
        rationale: "A é a primeira das 5 vogais (A, E, I, O, U)."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O é vogal? (não/sim)
        correctAnswer: sim
        rationale: "O está entre as 5 vogais (A, E, I, O, U)."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Z é vogal? (não/sim)
        correctAnswer: não
        rationale: "As vogais são A, E, I, O, U. Z é consoante."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 2
    title: Primeira Vogal das Palavras
    description: Identifique a primeira vogal de cada palavra.
    exercises:
      - type: reading
        question: Primeira vogal de 'AMOR'? (O/A/M)
        correctAnswer: A
        rationale: "Em 'AMOR', a primeira vogal é 'A'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Primeira vogal de 'ESCOLA'? (E/O/S)
        correctAnswer: E
        rationale: "Em 'ESCOLA', a primeira vogal é 'E'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Primeira vogal de 'IGREJA'? (G/E/I)
        correctAnswer: I
        rationale: "Em 'IGREJA', a primeira vogal é 'I'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Primeira vogal de 'OVO'? (U/O/V)
        correctAnswer: O
        rationale: "Em 'OVO', a primeira vogal é 'O'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Primeira vogal de 'UVA'? (V/U/A)
        correctAnswer: U
        rationale: "Em 'UVA', a primeira vogal é 'U'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Primeira vogal de 'CASA'? (A/S/C)
        correctAnswer: A
        rationale: "Em 'CASA', a primeira vogal é 'A'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Primeira vogal de 'PEIXE'? (E/P/I)
        correctAnswer: E
        rationale: "Em 'PEIXE', a primeira vogal é 'E'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Primeira vogal de 'MILHO'? (I/L/M)
        correctAnswer: I
        rationale: "Em 'MILHO', a primeira vogal é 'I'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Primeira vogal de 'BOLO'? (L/O/B)
        correctAnswer: O
        rationale: "Em 'BOLO', a primeira vogal é 'O'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Primeira vogal de 'LUA'? (A/L/U)
        correctAnswer: U
        rationale: "Em 'LUA', a primeira vogal é 'U'."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 3
    title: Contando Vogais
    description: Conte as vogais em cada palavra.
    exercises:
      - type: reading
        question: Vogais em 'CASA'? (3/1/2)
        correctAnswer: "2"
        rationale: "Em C-A-S-A, as vogais são A e A → 2."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Vogais em 'BOLA'? (2/1/3)
        correctAnswer: "2"
        rationale: "Em B-O-L-A, as vogais são O e A → 2."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Vogais em 'PATO'? (2/3/1)
        correctAnswer: "2"
        rationale: "Em P-A-T-O, as vogais são A e O → 2."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Vogais em 'BICICLETA'? (5/4/3)
        correctAnswer: "4"
        rationale: "Em BICICLETA, as vogais são I, I, E, A → 4."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Vogais em 'BANANA'? (2/3/4)
        correctAnswer: "3"
        rationale: "Em B-A-N-A-N-A, as vogais são A, A, A → 3."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Vogais em 'PIZZA'? (2/1/3)
        correctAnswer: "2"
        rationale: "Em P-I-Z-Z-A, as vogais são I e A → 2."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Vogais em 'CABEÇA'? (3/4/2)
        correctAnswer: "3"
        rationale: "Em C-A-B-E-Ç-A, as vogais são A, E, A → 3."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Vogais em 'ÁRVORE'? (4/2/3)
        correctAnswer: "3"
        rationale: "Em ÁRVORE, as vogais são Á, O, E → 3."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Vogais em 'SOL'? (2/1/3)
        correctAnswer: "1"
        rationale: "Em S-O-L, a única vogal é O → 1."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Vogais em 'FAMÍLIA'? (4/2/3)
        correctAnswer: "4"
        rationale: "Em FAMÍLIA, as vogais são A, Í, I, A → 4."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 4
    title: Vogais em Sequência
    description: Identifique a ordem das vogais.
    exercises:
      - type: reading
        question: "Ordem do alfabeto: (A-E-I-O-U/E-A-I-O-U/A-I-E-O-U)"
        correctAnswer: A-E-I-O-U
        rationale: "As vogais aparecem no alfabeto nesta ordem: A (1ª), E (5ª), I (9ª), O (15ª), U (21ª)."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: Qual vem depois de A? (B/C/D)
        correctAnswer: B
        rationale: "Depois de A vem B."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: Qual vogal vem depois de I? (J/P/O)
        correctAnswer: O
        rationale: "Depois de I vem O."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: Qual vogal vem antes de I? (H/E/A)
        correctAnswer: E
        rationale: "Na ordem A-E-I-O-U, a vogal antes de I é E."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: Qual é a última vogal? (U/A/O)
        correctAnswer: U
        rationale: "Observe a ordem A-E-I-O-U: a última é U."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: Qual é a primeira vogal? (I/A/E)
        correctAnswer: A
        rationale: "Observe a ordem A-E-I-O-U: a primeira é A."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: Qual vogal é do meio? (U/A/I)
        correctAnswer: I
        rationale: "Na ordem A-E-I-O-U (5 vogais), a do meio é I."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: "Vem depois de O: (A/P/U)"
        correctAnswer: U
        rationale: "Depois de O vem U."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: "Vem antes de A: (E/I/nada)"
        correctAnswer: nada
        rationale: "A é a primeira vogal; nada vem antes dela na sequência A-E-I-O-U."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: "Vem antes de E: (A/O/I)"
        correctAnswer: A
        rationale: "Na sequência A-E-I-O-U, A é a vogal antes de E."
        difficulty: 2
        objectives: [pt.pre_reading]
target: 40
