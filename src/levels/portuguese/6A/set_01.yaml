title: Reconhecimento de Vogais
level: 6A
subject: portuguese
example: "Identifique as vogais A, E, I, O, U e suas aplicações."
pages:
  - pageNumber: 1
    title: As 5 Vogais
    description: Identifique cada vogal.
    exercises:
      - { type: reading, question: "Escolha a vogal A: (A/B/C)", correctAnswer: "A" }
      - { type: reading, question: "Escolha a vogal E: (D/E/F)", correctAnswer: "E" }
      - { type: reading, question: "Escolha a vogal I: (G/H/I)", correctAnswer: "I" }
      - { type: reading, question: "Escolha a vogal O: (N/O/P)", correctAnswer: "O" }
      - { type: reading, question: "Escolha a vogal U: (T/U/V)", correctAnswer: "U" }
      - { type: reading, question: "Quantas vogais tem o alfabeto? (3/5/7)", correctAnswer: "5" }
      - { type: reading, question: "B é vogal? (sim/não)", correctAnswer: "não" }
      - { type: reading, question: "A é vogal? (sim/não)", correctAnswer: "sim" }
      - { type: reading, question: "O é vogal? (sim/não)", correctAnswer: "sim" }
      - { type: reading, question: "Z é vogal? (sim/não)", correctAnswer: "não" }
  - pageNumber: 2
    title: Primeira Vogal das Palavras
    description: Identifique a primeira vogal de cada palavra.
    exercises:
      - { type: reading, question: "Primeira vogal de 'AMOR'? (A/M/O)", correctAnswer: "A" }
      - { type: reading, question: "Primeira vogal de 'ESCOLA'? (E/S/O)", correctAnswer: "E" }
      - { type: reading, question: "Primeira vogal de 'IGREJA'? (I/G/E)", correctAnswer: "I" }
      - { type: reading, question: "Primeira vogal de 'OVO'? (O/V/O)", correctAnswer: "O" }
      - { type: reading, question: "Primeira vogal de 'UVA'? (U/V/A)", correctAnswer: "U" }
      - { type: reading, question: "Primeira vogal de 'CASA'? (C/A/S)", correctAnswer: "A" }
      - { type: reading, question: "Primeira vogal de 'PEIXE'? (P/E/I)", correctAnswer: "E" }
      - { type: reading, question: "Primeira vogal de 'MILHO'? (M/I/L)", correctAnswer: "I" }
      - { type: reading, question: "Primeira vogal de 'BOLO'? (B/O/L)", correctAnswer: "O" }
      - { type: reading, question: "Primeira vogal de 'LUA'? (L/U/A)", correctAnswer: "U" }
  - pageNumber: 3
    title: Contando Vogais
    description: Conte as vogais em cada palavra.
    exercises:
      - { type: reading, question: "Vogais em 'CASA'? (1/2/3)", correctAnswer: "2" }
      - { type: reading, question: "Vogais em 'BOLA'? (1/2/3)", correctAnswer: "2" }
      - { type: reading, question: "Vogais em 'PATO'? (1/2/3)", correctAnswer: "2" }
      - { type: reading, question: "Vogais em 'BICICLETA'? (3/4/5)", correctAnswer: "4" }
      - { type: reading, question: "Vogais em 'BANANA'? (2/3/4)", correctAnswer: "3" }
      - { type: reading, question: "Vogais em 'PIZZA'? (1/2/3)", correctAnswer: "2" }
      - { type: reading, question: "Vogais em 'CABEÇA'? (2/3/4)", correctAnswer: "3" }
      - { type: reading, question: "Vogais em 'ÁRVORE'? (2/3/4)", correctAnswer: "3" }
      - { type: reading, question: "Vogais em 'SOL'? (1/2/3)", correctAnswer: "1" }
      - { type: reading, question: "Vogais em 'FAMÍLIA'? (2/3/4)", correctAnswer: "4" }
  - pageNumber: 4
    title: Vogais em Sequência
    description: Identifique a ordem das vogais.
    exercises:
      - { type: reading, question: "Ordem do alfabeto: (A-E-I-O-U/E-A-I-O-U/A-I-E-O-U)", correctAnswer: "A-E-I-O-U" }
      - { type: reading, question: "Qual vem depois de A? (B/C/D)", correctAnswer: "B" }
      - { type: reading, question: "Qual vogal vem depois de I? (J/O/P)", correctAnswer: "O" }
      - { type: reading, question: "Qual vogal vem antes de I? (E/H/A)", correctAnswer: "E" }
      - { type: reading, question: "Qual é a última vogal? (O/U/A)", correctAnswer: "U" }
      - { type: reading, question: "Qual é a primeira vogal? (A/E/I)", correctAnswer: "A" }
      - { type: reading, question: "Qual vogal é do meio? (A/I/U)", correctAnswer: "I" }
      - { type: reading, question: "Vem depois de O: (P/U/A)", correctAnswer: "U" }
      - { type: reading, question: "Vem antes de A: (nada/E/I)", correctAnswer: "nada" }
      - { type: reading, question: "Vem antes de E: (A/I/O)", correctAnswer: "A" }
target: 40
