title: Reconhecimento de Vogais
level: 6A
subject: portuguese
example: Identifique e pratique o reconhecimento das vogais.
pages:
  - pageNumber: 1
    title: Vogal A
    description: Reconheça a vogal A.
    exercises:
      - { type: reading, question: "Escolha a letra: (A/E/I)", correctAnswer: A }
  - pageNumber: 2
    title: Vogal E
    description: Reconheça a vogal E.
    exercises:
      - { type: reading, question: "Escolha a letra: (E/O/U)", correctAnswer: E }
  - pageNumber: 3
    title: Vogal I
    description: Reconheça a vogal I.
    exercises:
      - { type: reading, question: "Escolha a letra: (I/A/E)", correctAnswer: I }
  - pageNumber: 4
    title: Vogal O
    description: Reconheça a vogal O.
    exercises:
      - { type: reading, question: "Escolha a letra: (O/U/A)", correctAnswer: O }
  - pageNumber: 5
    title: Vogal U
    description: Reconheça a vogal U.
    exercises:
      - { type: reading, question: "Escolha a letra: (U/I/O)", correctAnswer: U }
  - pageNumber: 6
    title: Revendo A
    description: Pratique novamente a vogal A.
    exercises:
      - { type: reading, question: "Qual é a primeira vogal? (A/B/C)", correctAnswer: A }
  - pageNumber: 7
    title: Revendo E
    description: Pratique novamente a vogal E.
    exercises:
      - { type: reading, question: "Qual vogal vem depois de A? (E/I/O)", correctAnswer: E }
  - pageNumber: 8
    title: Revendo I
    description: Pratique novamente a vogal I.
    exercises:
      - { type: reading, question: "Qual é a vogal no meio? (I/A/U)", correctAnswer: I }
  - pageNumber: 9
    title: Revendo O
    description: Pratique novamente a vogal O.
    exercises:
      - { type: reading, question: "Qual vogal é redonda? (O/I/E)", correctAnswer: O }
  - pageNumber: 10
    title: Revendo U
    description: Pratique novamente a vogal U.
    exercises:
      - { type: reading, question: "Qual é a última vogal? (U/A/E)", correctAnswer: U }
target: 10
