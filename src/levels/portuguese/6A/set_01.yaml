  - pageNumber: 4
    title: Vogais em Sequência
    description: Identifique a ordem das vogais.
    exercises:
      - type: reading
        question: "Ordem do alfabeto: (A-E-I-O-U/E-A-I-O-U/A-I-E-O-U)"
        correctAnswer: A-E-I-O-U
        rationale: "'A-E-I-O-U' pertence à categoria: ordem do alfabeto."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: Qual vem depois de A? (B/C/D)
        correctAnswer: B
        rationale: "Depois de A vem B."
        difficulty: 2
        objectives: [pt.pre_reading]
      - type: reading
        question: Qual vogal vem depois de I? (J/O/P)
        correctAnswer: O
        rationale: "Depois de I vem O."
        difficulty: 2
