title: Consoantes - F, G, H
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Consoantes F, G, H. Atenção — H é mudo em português."
example: "Identifique e pratique mais consoantes. Ex.: Escolha a letra: → F."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letra F
    description: Reconheça a letra F.
    exercises:
      - type: reading
        question: "Escolha a letra: (P/F/T)"
        correctAnswer: F
        rationale: "F: linha vertical com dois traços horizontais à direita (sem barriga como P)."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 2
    title: Letra G
    description: Reconheça a letra G.
    exercises:
      - type: reading
        question: "Escolha a letra: (Q/C/G)"
        correctAnswer: G
        rationale: "G: C com traço horizontal dentro; distingue de Q (rabinho fora) e C (aberto)."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 3
    title: Letra H
    description: Reconheça a letra H.
    exercises:
      - type: reading
        question: "Escolha a letra: (M/N/H)"
        correctAnswer: H
        rationale: "H: duas linhas verticais unidas por um traço no meio (como uma escada)."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 4
    title: Som FA
    description: Reconheça o som FA.
    exercises:
      - type: reading
        question: "Qual som: (TA/PA/FA)"
        correctAnswer: FA
        rationale: "FA = F + A; F tem som surdo ('ff') feito soprando entre dentes e lábio."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 5
    title: Som GA
    description: Reconheça o som GA.
    exercises:
      - type: reading
        question: "Qual som: (GA/JA/CA)"
        correctAnswer: GA
        rationale: "GA = G + A; G antes de A soa /g/ (como em 'gato')."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 6
    title: Som HA
    description: Reconheça o som HA.
    exercises:
      - type: reading
        question: "Qual som: (NA/HA/MA)"
        correctAnswer: HA
        rationale: "HA = H + A; em português H é mudo — HA soa como 'a' sozinho."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 7
    title: F de FOGO
    description: Pratique a letra F.
    exercises:
      - type: reading
        question: "F de: (TOGO/POGO/FOGO)"
        correctAnswer: FOGO
        rationale: "F aparece em FOGO como letra inicial."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 8
    title: G de GATO
    description: Pratique a letra G.
    exercises:
      - type: reading
        question: "G de: (CATO/JATO/GATO)"
        correctAnswer: GATO
        rationale: "G aparece em GATO como letra inicial."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 9
    title: H de HOJE
    description: Pratique a letra H.
    exercises:
      - type: reading
        question: "H de: (MOJE/HOJE/NOJE)"
        correctAnswer: HOJE
        rationale: "H aparece em HOJE como letra inicial."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 10
    title: Revisão FGH
    description: Reconheça as letras F, G, H.
    exercises:
      - type: reading
        question: Quantas letras novas? (4/2/3)
        correctAnswer: 3
        rationale: "Este conjunto apresentou F, G, H — são 3 letras novas."
        difficulty: 2
        objectives: [pt.pre_reading]
target: 10
