title: 🔤 Sílabas Simples - CA CO CU CE CI
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Sílabas com C. Atenção — CA/CO/CU = /k/, CE/CI = /s/."
example: "Pratique sílabas com a letra C. Ex.: Escolha a sílaba: → CA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Sílaba CA
    description: Reconheça CA.
    exercises:
      - type: reading
        question: "Escolha a sílaba: (CA/QUA/GA)"
        correctAnswer: CA
        rationale: "CA — sílaba escrita corretamente entre as opções."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 2
    title: Sílaba CO
    description: Reconheça CO.
    exercises:
      - type: reading
        question: "Escolha a sílaba: (CO/QUO/GO)"
        correctAnswer: CO
        rationale: "CO — sílaba escrita corretamente entre as opções."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 3
    title: Sílaba CU
    description: Reconheça CU.
    exercises:
      - type: reading
        question: "Escolha a sílaba: (GU/CU/QU)"
        correctAnswer: CU
        rationale: "CU — sílaba escrita corretamente entre as opções."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 4
    title: Sílaba CE
    description: Reconheça CE.
    exercises:
      - type: reading
        question: "Escolha a sílaba: (QUE/GE/CE)"
        correctAnswer: CE
        rationale: "CE — sílaba escrita corretamente entre as opções."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 5
    title: Sílaba CI
    description: Reconheça CI.
    exercises:
      - type: reading
        question: "Escolha a sílaba: (CI/GI/QUI)"
        correctAnswer: CI
        rationale: "CI — sílaba escrita corretamente entre as opções."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 6
    title: Palavra CASA
    description: Reconheça a palavra CASA.
    exercises:
      - type: reading
        question: "Qual palavra: (CASA/GASA/QUASA)"
        correctAnswer: CASA
        rationale: "CASA começa com CA (som /k/); é onde moramos."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 7
    title: Palavra COCO
    description: Reconheça a palavra COCO.
    exercises:
      - type: reading
        question: "Qual palavra: (QUOCO/GOGO/COCO)"
        correctAnswer: COCO
        rationale: "COCO começa com CO; é a fruta dura com polpa branca."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 8
    title: Palavra CUBO
    description: Reconheça a palavra CUBO.
    exercises:
      - type: reading
        question: "Qual palavra: (QUBO/GUBO/CUBO)"
        correctAnswer: CUBO
        rationale: "CUBO começa com CU; é a forma geométrica de 6 faces iguais."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 9
    title: Palavra CEDO
    description: Reconheça a palavra CEDO.
    exercises:
      - type: reading
        question: "Qual palavra: (GEDO/QUEDO/CEDO)"
        correctAnswer: CEDO
        rationale: "CEDO começa com CE (som /s/ antes de E); é 'antes do esperado'."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 10
    title: Palavra CINTO
    description: Reconheça a palavra CINTO.
    exercises:
      - type: reading
        question: "Qual palavra: (GINTO/QUINTO/CINTO)"
        correctAnswer: CINTO
        rationale: "CINTO começa com CI (som /s/ antes de I); é a tira que segura calça."
        difficulty: 2
        objectives: [pt.pre_reading]
target: 10
