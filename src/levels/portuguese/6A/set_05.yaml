title: Consoantes - M, N, P
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Consoantes M, N, P. M e N podem nasalizar vogal anterior (também)."
example: "Pratique mais consoantes básicas. Ex.: Escolha a letra: → M."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letra M
    description: Reconheça a letra M.
    exercises:
      - type: reading
        question: "Escolha a letra: (N/W/M)"
        correctAnswer: M
        rationale: "M: dois picos para cima (como duas montanhas); W tem dois picos para baixo."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 2
    title: Letra N
    description: Reconheça a letra N.
    exercises:
      - type: reading
        question: "Escolha a letra: (N/M/H)"
        correctAnswer: N
        rationale: "N: dois paus verticais unidos por diagonal; M tem 3 paus, H tem traço horizontal."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 3
    title: Letra P
    description: Reconheça a letra P.
    exercises:
      - type: reading
        question: "Escolha a letra: (D/P/B)"
        correctAnswer: P
        rationale: "P: observe a linha vertical com uma barriga só em cima; compare com D (barriga embaixo) e B (duas)."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 4
    title: Som MA
    description: Reconheça o som MA.
    exercises:
      - type: reading
        question: "Qual som: (WA/NA/MA)"
        correctAnswer: MA
        rationale: "MA = M + A; M tem som nasal feito com os lábios juntos ('mmm')."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 5
    title: Som NA
    description: Reconheça o som NA.
    exercises:
      - type: reading
        question: "Qual som: (MA/NA/HA)"
        correctAnswer: NA
        rationale: "NA = N + A; N tem som nasal feito com a língua no céu da boca ('nnn')."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 6
    title: Som PA
    description: Reconheça o som PA.
    exercises:
      - type: reading
        question: "Qual som: (PA/DA/BA)"
        correctAnswer: PA
        rationale: "PA = P + A; P tem som surdo ('p') feito soltando os lábios sem vibrar."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 7
    title: M de MESA
    description: Pratique a letra M.
    exercises:
      - type: reading
        question: "M de: (MESA/WESA/NESA)"
        correctAnswer: MESA
        rationale: "M aparece em MESA como letra inicial."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 8
    title: N de NETA
    description: Pratique a letra N.
    exercises:
      - type: reading
        question: "N de: (META/HETA/NETA)"
        correctAnswer: NETA
        rationale: "N aparece em NETA como letra inicial."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 9
    title: P de PATO
    description: Pratique a letra P.
    exercises:
      - type: reading
        question: "P de: (DATO/BATO/PATO)"
        correctAnswer: PATO
        rationale: "P aparece em PATO como letra inicial."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 10
    title: Revisão MNP
    description: Reconheça as letras M, N, P.
    exercises:
      - type: reading
        question: Qual letra tem dois picos? (M/P/N)
        correctAnswer: M
        rationale: "Compare: M tem dois picos (duas montanhas); N tem um só, P tem uma barriga acima."
        difficulty: 2
        objectives: [pt.pre_reading]
target: 10
