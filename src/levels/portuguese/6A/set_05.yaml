        rationale: "P aparece em PATO como letra inicial."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 10
    title: Revisão MNP
    description: Reconheça as letras M, N, P.
    exercises:
      - type: reading
        question: Qual letra tem dois picos? (N/M/P)
        correctAnswer: M
        rationale: "Observe as opções e escolha a que responde \"Qual letra tem dois picos?\": 'M'."
        difficulty: 2
        objectives: [pt.pre_reading]
target: 10
