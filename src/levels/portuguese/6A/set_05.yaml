title: Consoantes - M, N, P
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Consoantes M, N, P. M e N podem nasalizar vogal anterior (também)."
example: "Pratique mais consoantes básicas. Ex.: Escolha a letra: → M."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letra M
    description: Reconheça a letra M.
    exercises:
      - type: reading
        question: "Escolha a letra: (N/W/M)"
        correctAnswer: M
        rationale: "'M' pertence à categoria: escolha a letra."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 2
    title: Letra N
    description: Reconheça a letra N.
    exercises:
      - type: reading
        question: "Escolha a letra: (N/M/H)"
        correctAnswer: N
        rationale: "'N' pertence à categoria: escolha a letra."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 3
    title: Letra P
    description: Reconheça a letra P.
    exercises:
      - type: reading
        question: "Escolha a letra: (D/P/B)"
        correctAnswer: P
        rationale: "'P' pertence à categoria: escolha a letra."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 4
    title: Som MA
    description: Reconheça o som MA.
    exercises:
      - type: reading
        question: "Qual som: (WA/NA/MA)"
        correctAnswer: MA
        rationale: "'MA' pertence à categoria: qual som."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 5
    title: Som NA
    description: Reconheça o som NA.
    exercises:
      - type: reading
        question: "Qual som: (MA/NA/HA)"
        correctAnswer: NA
        rationale: "'NA' pertence à categoria: qual som."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 6
    title: Som PA
    description: Reconheça o som PA.
    exercises:
      - type: reading
        question: "Qual som: (PA/DA/BA)"
        correctAnswer: PA
        rationale: "'PA' pertence à categoria: qual som."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 7
    title: M de MESA
    description: Pratique a letra M.
    exercises:
      - type: reading
        question: "M de: (MESA/WESA/NESA)"
        correctAnswer: MESA
        rationale: "M aparece em MESA como letra inicial."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 8
    title: N de NETA
