title: Consoantes - X, Y, Z
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Consoantes X, Y, Z. X tem múltiplos sons (/ʃ/ em xícara, /ks/ em táxi)."
example: "Complete o alfabeto com as últimas consoantes. Ex.: Escolha a letra: → X."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letra X
    description: Reconheça a letra X.
    exercises:
      - type: reading
        question: "Escolha a letra: (Z/K/X)"
        correctAnswer: X
        rationale: "X: observe duas linhas diagonais cruzadas; compare com Z (ângulos retos) e K (perninha)."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 2
    title: Letra Y
    description: Reconheça a letra Y.
    exercises:
      - type: reading
        question: "Escolha a letra: (I/Y/V)"
        correctAnswer: Y
        rationale: "Y: veja um V com rabinho reto descendo; compare com I (só uma linha) e V (sem rabo)."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 3
    title: Letra Z
    description: Reconheça a letra Z.
    exercises:
      - type: reading
        question: "Escolha a letra: (N/S/Z)"
        correctAnswer: Z
        rationale: "Z: ângulos retos em zigue-zague; S tem curvas suaves e N tem diagonal entre paus."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 4
    title: Som XA
    description: Reconheça o som XA.
    exercises:
      - type: reading
        question: "Qual som: (KA/ZA/XA)"
        correctAnswer: XA
        rationale: "XA = X + A; X aqui tem som /ʃ/ (como 'xa' em 'xale')."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 5
    title: Som YA
    description: Reconheça o som YA.
    exercises:
      - type: reading
        question: "Qual som: (YA/VA/IA)"
        correctAnswer: YA
        rationale: "YA = Y + A; Y aqui soa como 'i' (como em 'yoga')."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 6
    title: Som ZA
    description: Reconheça o som ZA.
    exercises:
      - type: reading
        question: "Qual som: (SA/NA/ZA)"
        correctAnswer: ZA
        rationale: "ZA = Z + A; Z tem som sonoro (vibra, diferente de SA que é surdo)."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 7
    title: X de XALE
    description: Pratique a letra X.
    exercises:
      - type: reading
        question: "X de: (KALE/ZALE/XALE)"
        correctAnswer: XALE
        rationale: "X aparece em XALE como letra inicial."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 8
    title: Y de YOGA
    description: Pratique a letra Y.
    exercises:
      - type: reading
        question: "Y de: (YOGA/IOGA/VOGA)"
        correctAnswer: YOGA
        rationale: "Y aparece em YOGA como letra inicial."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 9
    title: Z de ZEBRA
    description: Pratique a letra Z.
    exercises:
      - type: reading
        question: "Z de: (NEBRA/ZEBRA/SEBRA)"
        correctAnswer: ZEBRA
        rationale: "Z aparece em ZEBRA como letra inicial."
        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 10
    title: Fim do Alfabeto
    description: Complete o alfabeto.
    exercises:
      - type: reading
        question: Última letra do alfabeto? (Z/X/Y)
        correctAnswer: Z
        rationale: "Na ordem A-B-C-...-X-Y-Z, Z é a 26ª e última letra."
        difficulty: 2
        objectives: [pt.pre_reading]
target: 10
