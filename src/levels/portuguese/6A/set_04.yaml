        difficulty: 2
        objectives: [pt.pre_reading]
  - pageNumber: 10
    title: Revisão JKL
    description: Reconheça as letras J, K, L.
    exercises:
      - type: reading
        question: Qual letra vem entre J e L? (M/K/I)
        correctAnswer: K
        rationale: "Observe as opções e escolha a que responde \"Qual letra vem entre J e L?\": 'K'."
        difficulty: 2
        objectives: [pt.pre_reading]
target: 10
