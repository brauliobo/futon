title: Consoantes - J, K, L
level: 6A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Consoantes J, K, L. K só aparece em empréstimos e nomes próprios."
example: "Continue aprendendo consoantes. Ex.: Escolha a letra: → J."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Letra J
    description: Reconheça a letra J.
    exercises:
      - type: reading
        question: "Escolha a letra: (J/I/L)"
        correctAnswer: J
        rationale: "'J' pertence à categoria: escolha a letra."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 2
    title: Letra K
    description: Reconheça a letra K.
    exercises:
      - type: reading
        question: "Escolha a letra: (X/R/K)"
        correctAnswer: K
        rationale: "'K' pertence à categoria: escolha a letra."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 3
    title: Letra L
    description: Reconheça a letra L.
    exercises:
      - type: reading
        question: "Escolha a letra: (L/T/I)"
        correctAnswer: L
        rationale: "'L' pertence à categoria: escolha a letra."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 4
    title: Som JA
    description: Reconheça o som JA.
    exercises:
      - type: reading
        question: "Qual som: (LA/JA/IA)"
        correctAnswer: JA
        rationale: "'JA' pertence à categoria: qual som."
        difficulty: 1
