  - pageNumber: 6
    title: Som LA
    description: Reconheça o som LA.
    exercises:
      - type: reading
        question: "Qual som: (IA/LA/TA)"
        correctAnswer: LA
        rationale: "'LA' pertence à categoria: qual som."
        difficulty: 1
        objectives: [pt.pre_reading]
  - pageNumber: 7
    title: J de JOGO
    description: Pratique a letra J.
    exercises:
      - type: reading
        question: "J de: (JOGO/LOGO/IOGO)"
        correctAnswer: JOGO
        rationale: "J aparece em JOGO como letra inicial."
