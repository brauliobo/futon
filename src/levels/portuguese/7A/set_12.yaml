title: Compreensão de Texto - O Mercado
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - o mercado. Ex.: Maria foi ao mercado para comprar? → frutas."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Ida ao Mercado
    description: Leia a história e responda.
    passage: "Maria foi ao mercado para comprar frutas. Levou R$ 100 na carteira. As bananas custaram R$ 5 o quilo; comprou também ovos. O vendedor foi muito educado. Maria pagou à vista e recebeu o troco. O mercado estava cheio naquele sábado. Ela voltou para casa satisfeita com as compras e pretende voltar na semana que vem."
    exercises:
      - type: reading
        question: Maria foi ao mercado para comprar? (frutas/carnes/verduras)
        correctAnswer: frutas
        rationale: "O texto diz 'Maria foi ao mercado para comprar frutas'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela levou quanto dinheiro? (R$ 100/R$ 50/R$ 150)
        correctAnswer: R$ 100
        rationale: "O texto diz 'Levou R$ 100 na carteira'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: As bananas custaram? (R$ 3/R$ 5/R$ 7)
        correctAnswer: R$ 5
        rationale: "O texto diz 'As bananas custaram R$ 5 o quilo'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela comprou também? (leite/queijo/ovos)
        correctAnswer: ovos
        rationale: "O texto diz 'comprou também ovos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O vendedor foi? (apressado/rude/educado)
        correctAnswer: educado
        rationale: "O texto diz 'O vendedor foi muito educado'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Maria pagou? (cartão/cheque/à vista)
        correctAnswer: à vista
        rationale: "O texto diz 'Maria pagou à vista'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela recebeu? (sacola/desconto/troco)
        correctAnswer: troco
        rationale: "O texto diz 'recebeu o troco'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O mercado estava? (normal/cheio/vazio)
        correctAnswer: cheio
        rationale: "O texto diz 'O mercado estava cheio'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Maria voltou? (insatisfeita/preocupada/satisfeita)
        correctAnswer: satisfeita
        rationale: "O texto diz 'voltou para casa satisfeita'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela pretende voltar? (talvez/sim/não)
        correctAnswer: sim
        rationale: "O texto diz 'pretende voltar na semana que vem' — confirma sim."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
