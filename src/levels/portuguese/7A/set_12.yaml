title: Compreensão de Texto - O Mercado
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - o mercado. Ex.: Maria foi ao mercado para comprar? → frutas."
pages:
  - pageNumber: 1
    title: Ida ao Mercado
    description: Responda sobre a compra no mercado.
    exercises:
      - type: reading
        question: Maria foi ao mercado para comprar? (frutas/carnes/verduras)
        correctAnswer: frutas
        rationale: "A resposta correta é 'frutas'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela levou quanto dinheiro? (R$ 50/R$ 100/R$ 150)
        correctAnswer: R$ 100
        rationale: "A resposta correta é 'R$ 100'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: As bananas custaram? (R$ 3/R$ 5/R$ 7)
        correctAnswer: R$ 5
        rationale: "A resposta correta é 'R$ 5'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela comprou também? (leite/ovos/queijo)
        correctAnswer: ovos
        rationale: "A resposta correta é 'ovos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O vendedor foi? (educado/rude/apressado)
        correctAnswer: educado
        rationale: "A resposta correta é 'educado'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Maria pagou? (à vista/cartão/cheque)
        correctAnswer: à vista
        rationale: "A resposta correta é 'à vista'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela recebeu? (desconto/troco/sacola)
        correctAnswer: troco
        rationale: "A resposta correta é 'troco'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O mercado estava? (vazio/cheio/normal)
        correctAnswer: cheio
        rationale: "A resposta correta é 'cheio'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Maria voltou? (satisfeita/insatisfeita/preocupada)
        correctAnswer: satisfeita
        rationale: "A resposta correta é 'satisfeita'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela pretende voltar? (sim/não/talvez)
        correctAnswer: sim
        rationale: "A resposta correta é 'sim'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
