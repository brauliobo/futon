title: 📚 Compreensão de Texto - Parque
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - parque. Ex.: O protagonista é? → menina."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Texto 2
    description: "História: Em um dia quente, a menina foi ao parque. Ela levou um lanche. Brincou com seus amigos e jogaram futebol. O parque tinha árvores e flores. A menina se sentiu feliz. Voltou para casa tarde e quer voltar outro dia."
    exercises:
      - type: reading
        question: O protagonista é? (menino/cachorro/menina)
        correctAnswer: menina
        rationale: "O texto: 'a menina foi ao parque'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O local foi? (escola/parque/cinema)
        correctAnswer: parque
        rationale: "O texto: 'foi ao parque'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela levou? (livro/lanche/bola)
        correctAnswer: lanche
        rationale: "O texto: 'Ela levou um lanche'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O tempo estava? (chuvoso/quente/frio)
        correctAnswer: quente
        rationale: "O texto: 'Em um dia quente'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela brincou com? (amigos/irmãos/sozinha)
        correctAnswer: amigos
        rationale: "O texto: 'Brincou com seus amigos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Eles jogaram? (futebol/vôlei/basquete)
        correctAnswer: futebol
        rationale: "O texto: 'jogaram futebol'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A menina se sentiu? (feliz/triste/cansada)
        correctAnswer: feliz
        rationale: "O texto: 'A menina se sentiu feliz'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O parque tinha? (árvores/ambos/flores)
        correctAnswer: ambos
        rationale: "O texto diz 'árvores e flores' — ambos estavam presentes."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela voltou para casa? (tarde/cedo/noite)
        correctAnswer: tarde
        rationale: "O texto: 'Voltou para casa tarde'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela quer voltar? (sim/talvez/não)
        correctAnswer: sim
        rationale: "O texto: 'quer voltar outro dia'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
