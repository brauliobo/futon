title: Compreensão de Texto - Parque
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - parque."
pages:
  - pageNumber: 1
    title: Texto 2
    description: Responda às perguntas.
    exercises:
      - type: reading
        question: O protagonista é? (menino/menina/cachorro)
        correctAnswer: menina
        rationale: "A resposta correta é 'menina'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O local foi? (parque/cinema/escola)
        correctAnswer: parque
        rationale: "A resposta correta é 'parque'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela levou? (lanche/bola/livro)
        correctAnswer: lanche
        rationale: "A resposta correta é 'lanche'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O tempo estava? (quente/frio/chuvoso)
        correctAnswer: quente
        rationale: "A resposta correta é 'quente'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela brincou com? (amigos/irmãos/sozinha)
        correctAnswer: amigos
        rationale: "A resposta correta é 'amigos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Eles jogaram? (futebol/vôlei/basquete)
        correctAnswer: futebol
        rationale: "A resposta correta é 'futebol'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A menina se sentiu? (cansada/feliz/triste)
        correctAnswer: feliz
        rationale: "A resposta correta é 'feliz'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O parque tinha? (árvores/flores/ambos)
        correctAnswer: ambos
        rationale: "A resposta correta é 'ambos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela voltou para casa? (cedo/tarde/noite)
        correctAnswer: tarde
        rationale: "A resposta correta é 'tarde'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela quer voltar? (sim/não/talvez)
        correctAnswer: sim
        rationale: "A resposta correta é 'sim'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
