title: Compreensão de Texto - A Escola
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - a escola. Ex.: O estudante chegou? → cedo."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Na Escola
    description: Leia a história e responda.
    passage: "Pedro chegou cedo à escola. A primeira aula foi de matemática, e o professor estava alegre. Os alunos fizeram exercícios juntos. O recreio durou 30 minutos — na cantina vendiam tanto salgados quanto doces. Depois, a aula de educação física foi na quadra. Pedro voltou para casa de ônibus. Em casa, fez a lição toda. Foi um dia normal, mas produtivo."
    exercises:
      - type: reading
        question: O estudante chegou? (tarde/na hora/cedo)
        correctAnswer: cedo
        rationale: "O texto diz 'Pedro chegou cedo à escola'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A primeira aula foi de? (matemática/história/português)
        correctAnswer: matemática
        rationale: "O texto diz 'A primeira aula foi de matemática'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O professor estava? (cansado/bravo/alegre)
        correctAnswer: alegre
        rationale: "O texto diz 'o professor estava alegre'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Os alunos fizeram? (apresentação/exercícios/jogos)
        correctAnswer: exercícios
        rationale: "O texto diz 'Os alunos fizeram exercícios juntos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O recreio durou? (1 hora/15 minutos/30 minutos)
        correctAnswer: 30 minutos
        rationale: "O texto diz 'O recreio durou 30 minutos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Na cantina vendiam? (salgados/ambos/doces)
        correctAnswer: ambos
        rationale: "O texto diz 'vendiam tanto salgados quanto doces' — ambos."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A aula de educação física foi? (na quadra/no pátio/na sala)
        correctAnswer: na quadra
        rationale: "O texto diz 'a aula de educação física foi na quadra'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O estudante voltou para casa? (andando/de carro/de ônibus)
        correctAnswer: de ônibus
        rationale: "O texto diz 'Pedro voltou para casa de ônibus'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ele fez a lição? (não/parcialmente/sim)
        correctAnswer: sim
        rationale: "O texto diz 'fez a lição toda'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O dia foi? (difícil/especial/normal)
        correctAnswer: normal
        rationale: "O texto diz 'Foi um dia normal, mas produtivo'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
