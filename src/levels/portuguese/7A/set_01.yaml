title: Gramática - Classes de Palavras
level: 7A
subject: portuguese
difficulty: 1
objectives: [pt.pre_reading]
authorNotes: Conjunto de portuguese/7A.
repeatAll: 2
example: Identifique classes de palavras básicas.
pages:
  - pageNumber: 1
    title: Substantivos, Verbos e Adjetivos
    description: Escolha a classe correta de cada palavra.
    exercises:
      - { type: grammar, question: "'casa' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'correr' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'bonito' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'mesa' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'pular' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'alto' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'cachorro' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'comer' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'feliz' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'livro' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
  - pageNumber: 2
    title: Advérbios, Preposições e Conjunções
    description: Escolha a classe correta.
    exercises:
      - { type: grammar, question: "'rapidamente' é (advérbio/preposição/conjunção)", correctAnswer: advérbio }
      - { type: grammar, question: "'de' é (preposição/pronome/conjunção)", correctAnswer: preposição }
      - { type: grammar, question: "'e' é (conjunção/interjeição/pronome)", correctAnswer: conjunção }
      - { type: grammar, question: "'devagar' é (advérbio/preposição/substantivo)", correctAnswer: advérbio }
      - { type: grammar, question: "'para' é (preposição/verbo/advérbio)", correctAnswer: preposição }
      - { type: grammar, question: "'mas' é (conjunção/interjeição/pronome)", correctAnswer: conjunção }
      - { type: grammar, question: "'muito' é (advérbio/adjetivo/numeral)", correctAnswer: advérbio }
      - { type: grammar, question: "'com' é (preposição/pronome/conjunção)", correctAnswer: preposição }
      - { type: grammar, question: "'ou' é (conjunção/advérbio/preposição)", correctAnswer: conjunção }
      - { type: grammar, question: "'aqui' é (advérbio/adjetivo/substantivo)", correctAnswer: advérbio }
  - pageNumber: 3
    title: Pronomes, Artigos e Numerais
    description: Escolha a classe correta.
    exercises:
      - { type: grammar, question: "'nós' é (artigo/pronome/numeral)", correctAnswer: pronome }
      - { type: grammar, question: "'o' é (artigo/advérbio/adjetivo)", correctAnswer: artigo }
      - { type: grammar, question: "'dois' é (numeral/interjeição/preposição)", correctAnswer: numeral }
      - { type: grammar, question: "'eu' é (pronome/artigo/numeral)", correctAnswer: pronome }
      - { type: grammar, question: "'a' é (artigo/advérbio/conjunção)", correctAnswer: artigo }
      - { type: grammar, question: "'três' é (numeral/adjetivo/substantivo)", correctAnswer: numeral }
      - { type: grammar, question: "'ele' é (pronome/artigo/conjunção)", correctAnswer: pronome }
      - { type: grammar, question: "'uns' é (artigo/pronome/numeral)", correctAnswer: artigo }
      - { type: grammar, question: "'cinco' é (numeral/adjetivo/verbo)", correctAnswer: numeral }
      - { type: grammar, question: "'elas' é (pronome/artigo/substantivo)", correctAnswer: pronome }
  - pageNumber: 4
    title: Interjeições e Revisão
    description: Identifique a classe das palavras.
    exercises:
      - { type: grammar, question: "'oba!' é (interjeição/adjetivo/verbo)", correctAnswer: interjeição }
      - { type: grammar, question: "'ai!' é (interjeição/substantivo/conjunção)", correctAnswer: interjeição }
      - { type: grammar, question: "'olá!' é (interjeição/pronome/advérbio)", correctAnswer: interjeição }
      - { type: grammar, question: "'nossa!' é (interjeição/substantivo/adjetivo)", correctAnswer: interjeição }
      - { type: grammar, question: "'árvore' é (substantivo/verbo/preposição)", correctAnswer: substantivo }
      - { type: grammar, question: "'dormir' é (verbo/substantivo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'pequeno' é (adjetivo/substantivo/advérbio)", correctAnswer: adjetivo }
      - { type: grammar, question: "'sempre' é (advérbio/preposição/conjunção)", correctAnswer: advérbio }
      - { type: grammar, question: "'porque' é (conjunção/advérbio/artigo)", correctAnswer: conjunção }
      - { type: grammar, question: "'em' é (preposição/artigo/pronome)", correctAnswer: preposição }
target: 40
