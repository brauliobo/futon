title: Palavras Homônimas
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Homônimos — mesma forma, significado distinto (são/são, cela/sela). Contexto resolve."
example: "Pratique palavras homônimas. Ex.: Ele tem _____ anos. → cem."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Palavras que Soam Igual
    description: Escolha a palavra correta.
    exercises:
      - type: grammar
        question: Ele tem _____ anos. (cem/sem/com)
        correctAnswer: cem
        rationale: "A letra que falta forma 'cem'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Vou _____ você. (cem/com/sem)
        correctAnswer: com
        rationale: "Observe as opções e escolha a que responde \"Vou _____ você.\": 'com'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Estou _____ dinheiro. (cem/com/sem)
        correctAnswer: sem
        rationale: "Observe as opções e escolha a que responde \"Estou _____ dinheiro.\": 'sem'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Vou _____ ao médico. (yr/hir/ir)
        correctAnswer: ir
        rationale: "Observe as opções e escolha a que responde \"Vou _____ ao médico.\": 'ir'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Precisa _____ isso. (ovir/huvir/ouvir)
        correctAnswer: ouvir
        rationale: "A letra que falta forma 'ouvir'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Ele _____ bem. (ver/vê/vi)
        correctAnswer: vê
        rationale: "Ele exige a forma 'vê' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Vou _____ o filme. (vi/vê/ver)
        correctAnswer: ver
        rationale: "Observe as opções e escolha a que responde \"Vou _____ o filme.\": 'ver'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Ela tem _____ cabelos. (belos/bela/belo)
        correctAnswer: belos
        rationale: "A letra que falta forma 'belos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: A _____ é azul. (cor/core/corrida)
        correctAnswer: cor
        rationale: "A letra que falta forma 'cor'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Sinto _____ no peito. (tor/dor/ardor)
        correctAnswer: dor
        rationale: "A letra que falta forma 'dor'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
