title: Compreensão de Texto - O Hospital
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - o hospital."
pages:
  - pageNumber: 1
    title: Visita ao Hospital
    description: Responda sobre a visita médica.
    exercises:
      - type: reading
        question: Pedro foi ao hospital porque? (dor de cabeça/febre/tosse)
        correctAnswer: febre
        rationale: "A resposta correta é 'febre'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ele esperou por quanto tempo? (30 minutos/1 hora/2 horas)
        correctAnswer: 1 hora
        rationale: "A resposta correta é '1 hora'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O médico era? (jovem/idoso/de meia-idade)
        correctAnswer: de meia-idade
        rationale: "A resposta correta é 'de meia-idade'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O diagnóstico foi? (gripe/resfriado/alergia)
        correctAnswer: gripe
        rationale: "A resposta correta é 'gripe'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ele recebeu? (injeção/remédio/ambos)
        correctAnswer: remédio
        rationale: "A resposta correta é 'remédio'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A enfermeira foi? (atenciosa/rude/apressada)
        correctAnswer: atenciosa
        rationale: "A resposta correta é 'atenciosa'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Pedro deve voltar em? (1 semana/2 semanas/1 mês)
        correctAnswer: 1 semana
        rationale: "A resposta correta é '1 semana'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O hospital estava? (limpo/sujo/organizado)
        correctAnswer: limpo
        rationale: "A resposta correta é 'limpo'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Pedro saiu? (preocupado/aliviado/confuso)
        correctAnswer: aliviado
        rationale: "A resposta correta é 'aliviado'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O atendimento foi? (bom/ruim/regular)
        correctAnswer: bom
        rationale: "A resposta correta é 'bom'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
