title: Compreensão de Texto - O Hospital
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - o hospital. Ex.: Pedro foi ao hospital porque? → febre."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Visita ao Hospital
    description: Responda sobre a visita médica.
    exercises:
      - type: reading
        question: Pedro foi ao hospital porque? (febre/dor de cabeça/tosse)
        correctAnswer: febre
        rationale: "Observe as opções e escolha a que responde \"Pedro foi ao hospital porque?\": 'febre'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ele esperou por quanto tempo? (1 hora/30 minutos/2 horas)
        correctAnswer: 1 hora
        rationale: "Observe as opções e escolha a que responde \"Ele esperou por quanto tempo?\": '1 hora'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O médico era? (jovem/idoso/de meia-idade)
        correctAnswer: de meia-idade
        rationale: "Observe as opções e escolha a que responde \"O médico era?\": 'de meia-idade'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O diagnóstico foi? (gripe/resfriado/alergia)
        correctAnswer: gripe
        rationale: "Observe as opções e escolha a que responde \"O diagnóstico foi?\": 'gripe'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ele recebeu? (remédio/injeção/ambos)
        correctAnswer: remédio
        rationale: "Observe as opções e escolha a que responde \"Ele recebeu?\": 'remédio'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A enfermeira foi? (atenciosa/apressada/rude)
        correctAnswer: atenciosa
