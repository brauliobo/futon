title: 📚 Compreensão de Texto - O Hospital
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - o hospital. Ex.: Pedro foi ao hospital porque? → febre."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Visita ao Hospital
    description: Leia a história e responda.
    passage: "Pedro foi ao hospital porque estava com febre. Ele esperou por 1 hora na recepção. O médico era de meia-idade e muito experiente. O diagnóstico foi gripe, e Pedro recebeu apenas remédio (sem injeção). A enfermeira foi atenciosa durante todo o atendimento. Pedro deve voltar em 1 semana para uma revisão. O hospital estava limpo e organizado. Ele saiu aliviado — o atendimento foi bom."
    exercises:
      - type: reading
        question: Pedro foi ao hospital porque? (dor de cabeça/febre/tosse)
        correctAnswer: febre
        rationale: "O texto diz 'Pedro foi ao hospital porque estava com febre'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ele esperou por quanto tempo? (1 hora/2 horas/30 minutos)
        correctAnswer: 1 hora
        rationale: "O texto diz 'esperou por 1 hora na recepção'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O médico era? (idoso/jovem/de meia-idade)
        correctAnswer: de meia-idade
        rationale: "O texto diz 'O médico era de meia-idade'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O diagnóstico foi? (gripe/alergia/resfriado)
        correctAnswer: gripe
        rationale: "O texto diz 'O diagnóstico foi gripe'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ele recebeu? (remédio/ambos/injeção)
        correctAnswer: remédio
        rationale: "O texto diz 'recebeu apenas remédio (sem injeção)'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A enfermeira foi? (atenciosa/apressada/rude)
        correctAnswer: atenciosa
        rationale: "O texto diz 'A enfermeira foi atenciosa'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Pedro deve voltar em? (2 semanas/1 mês/1 semana)
        correctAnswer: 1 semana
        rationale: "O texto diz 'deve voltar em 1 semana para uma revisão'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O hospital estava? (sujo/organizado/limpo)
        correctAnswer: limpo
        rationale: "O texto diz 'O hospital estava limpo e organizado'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Pedro saiu? (preocupado/confuso/aliviado)
        correctAnswer: aliviado
        rationale: "O texto diz 'Ele saiu aliviado'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O atendimento foi? (bom/regular/ruim)
        correctAnswer: bom
        rationale: "O texto diz 'o atendimento foi bom'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
