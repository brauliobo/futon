        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Pedro deve voltar em? (1 mês/1 semana/2 semanas)
        correctAnswer: 1 semana
        rationale: "Observe as opções e escolha a que responde \"Pedro deve voltar em?\": '1 semana'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O hospital estava? (sujo/organizado/limpo)
        correctAnswer: limpo
        rationale: "Observe as opções e escolha a que responde \"O hospital estava?\": 'limpo'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Pedro saiu? (confuso/aliviado/preocupado)
        correctAnswer: aliviado
        rationale: "Observe as opções e escolha a que responde \"Pedro saiu?\": 'aliviado'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O atendimento foi? (bom/ruim/regular)
        correctAnswer: bom
        rationale: "Observe as opções e escolha a que responde \"O atendimento foi?\": 'bom'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
