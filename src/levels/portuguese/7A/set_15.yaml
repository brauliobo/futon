title: Compreensão de Texto - O Hospital
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
pages:
  - pageNumber: 1
    title: Visita ao Hospital
    description: Responda sobre a visita médica.
    exercises:
      - type: reading
        question: Pedro foi ao hospital porque? (dor de cabeça/febre/tosse)
        correctAnswer: febre
        rationale: "Resposta: febre — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ele esperou por quanto tempo? (30 minutos/1 hora/2 horas)
        correctAnswer: 1 hora
        rationale: "Resposta: 1 hora — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O médico era? (jovem/idoso/de meia-idade)
        correctAnswer: de meia-idade
        rationale: "Resposta: de meia-idade — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O diagnóstico foi? (gripe/resfriado/alergia)
        correctAnswer: gripe
        rationale: "Resposta: gripe — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ele recebeu? (injeção/remédio/ambos)
        correctAnswer: remédio
        rationale: "Resposta: remédio — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A enfermeira foi? (atenciosa/rude/apressada)
        correctAnswer: atenciosa
        rationale: "Resposta: atenciosa — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Pedro deve voltar em? (1 semana/2 semanas/1 mês)
        correctAnswer: 1 semana
        rationale: "Resposta: 1 semana — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O hospital estava? (limpo/sujo/organizado)
        correctAnswer: limpo
        rationale: "Resposta: limpo — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Pedro saiu? (preocupado/aliviado/confuso)
        correctAnswer: aliviado
        rationale: "Resposta: aliviado — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O atendimento foi? (bom/ruim/regular)
        correctAnswer: bom
        rationale: "Resposta: bom — consulte a informação dada."
        difficulty: 1
        objectives: [pt.pre_reading]
