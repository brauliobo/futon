title: Compreensão de Texto - O Parque
level: 7A
subject: portuguese
pages:
  - pageNumber: 1
    title: Passeio no Parque
    description: Responda sobre o passeio no parque.
    exercises:
      - type: reading
        question: A família foi ao parque no? (sábado/domingo/feriado)
        correctAnswer: domingo
      - type: reading
        question: Levaram? (bicicletas/patins/skate)
        correctAnswer: bicicletas
      - type: reading
        question: As crianças brincaram no? (playground/lago/campo)
        correctAnswer: playground
      - type: reading
        question: Os pais? (descansaram/correram/leram)
        correctAnswer: descansaram
      - type: reading
        question: Viram? (patos/peixes/tartarugas)
        correctAnswer: patos
      - type: reading
        question: Fizeram? (piquenique/churrasco/lanche)
        correctAnswer: piquenique
      - type: reading
        question: O tempo estava? (nublado/ensolarado/chuvoso)
        correctAnswer: ensolarado
      - type: reading
        question: Ficaram até? (meio-dia/tarde/noite)
        correctAnswer: tarde
      - type: reading
        question: Todos se sentiram? (cansados/felizes/entediados)
        correctAnswer: felizes
      - type: reading
        question: Querem voltar? (sim/não/talvez)
        correctAnswer: sim
target: 10
