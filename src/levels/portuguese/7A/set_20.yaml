title: Compreensão de Texto - O Parque
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - o parque. Ex.: A família foi ao parque no? → domingo."
pages:
  - pageNumber: 1
    title: Passeio no Parque
    description: Responda sobre o passeio no parque.
    exercises:
      - type: reading
        question: A família foi ao parque no? (sábado/domingo/feriado)
        correctAnswer: domingo
        rationale: "A resposta correta é 'domingo'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Levaram? (bicicletas/patins/skate)
        correctAnswer: bicicletas
        rationale: "A resposta correta é 'bicicletas'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: As crianças brincaram no? (playground/lago/campo)
        correctAnswer: playground
        rationale: "A resposta correta é 'playground'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Os pais? (descansaram/correram/leram)
        correctAnswer: descansaram
        rationale: "A resposta correta é 'descansaram'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Viram? (patos/peixes/tartarugas)
        correctAnswer: patos
        rationale: "A resposta correta é 'patos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Fizeram? (piquenique/churrasco/lanche)
        correctAnswer: piquenique
        rationale: "A resposta correta é 'piquenique'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O tempo estava? (nublado/ensolarado/chuvoso)
        correctAnswer: ensolarado
        rationale: "A resposta correta é 'ensolarado'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ficaram até? (meio-dia/tarde/noite)
        correctAnswer: tarde
        rationale: "A resposta correta é 'tarde'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Todos se sentiram? (cansados/felizes/entediados)
        correctAnswer: felizes
        rationale: "A resposta correta é 'felizes'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Querem voltar? (sim/não/talvez)
        correctAnswer: sim
        rationale: "A resposta correta é 'sim'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
