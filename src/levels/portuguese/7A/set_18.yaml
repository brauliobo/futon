title: Compreensão de Texto - A Biblioteca
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - a biblioteca."
pages:
  - pageNumber: 1
    title: Visita à Biblioteca
    description: Responda sobre a visita à biblioteca.
    exercises:
      - type: reading
        question: Ana foi à biblioteca para? (estudar/ler/pesquisar)
        correctAnswer: pesquisar
        rationale: "A resposta correta é 'pesquisar'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela procurava livros sobre? (história/geografia/ciências)
        correctAnswer: história
        rationale: "A resposta correta é 'história'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A bibliotecária se chamava? (Maria/Clara/Rosa)
        correctAnswer: Clara
        rationale: "A resposta correta é 'Clara'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ana encontrou quantos livros? (3/5/7)
        correctAnswer: 5
        rationale: "A resposta correta é '5'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela pode levar emprestado? (1 livro/3 livros/5 livros)
        correctAnswer: 3 livros
        rationale: "A resposta correta é '3 livros'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O prazo de devolução é? (1 semana/2 semanas/1 mês)
        correctAnswer: 2 semanas
        rationale: "A resposta correta é '2 semanas'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A biblioteca tinha? (computadores/internet/ambos)
        correctAnswer: ambos
        rationale: "A resposta correta é 'ambos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ana fez? (anotações/cópias/fotos)
        correctAnswer: anotações
        rationale: "A resposta correta é 'anotações'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O ambiente era? (silencioso/barulhento/agitado)
        correctAnswer: silencioso
        rationale: "A resposta correta é 'silencioso'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ana pretende voltar? (sim/não/talvez)
        correctAnswer: sim
        rationale: "A resposta correta é 'sim'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
