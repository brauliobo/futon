        question: Ana foi à biblioteca para? (ler/pesquisar/estudar)
        correctAnswer: pesquisar
        rationale: "Observe as opções e escolha a que responde \"Ana foi à biblioteca para?\": 'pesquisar'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Ela procurava livros sobre? (geografia/ciências/história)
