title: Compreensão de Texto - A Biblioteca
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - a biblioteca. Ex.: Ana foi à biblioteca para? → pesquisar."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Visita à Biblioteca
    description: Responda sobre a visita à biblioteca.
    exercises:
