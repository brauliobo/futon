title: Compreensão de Texto - A Família
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - a família."
pages:
  - pageNumber: 1
    title: Reunião em Família
    description: Responda sobre o texto da família.
    exercises:
      - type: reading
        question: A família se reuniu para? (jantar/almoço/lanche)
        correctAnswer: jantar
        rationale: "A resposta correta é 'jantar'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Quantas pessoas estavam presentes? (5/8/10)
        correctAnswer: 8
        rationale: "A resposta correta é '8'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A avó preparou? (bolo/torta/biscoitos)
        correctAnswer: bolo
        rationale: "A resposta correta é 'bolo'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: As crianças brincaram de? (pega-pega/esconde-esconde/amarelinha)
        correctAnswer: esconde-esconde
        rationale: "A resposta correta é 'esconde-esconde'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O tio tocou? (violão/piano/flauta)
        correctAnswer: violão
        rationale: "A resposta correta é 'violão'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Todos cantaram? (sim/não/apenas alguns)
        correctAnswer: sim
        rationale: "A resposta correta é 'sim'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A festa terminou? (cedo/tarde/madrugada)
        correctAnswer: tarde
        rationale: "A resposta correta é 'tarde'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A comida estava? (boa/ruim/normal)
        correctAnswer: boa
        rationale: "A resposta correta é 'boa'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Tiraram? (fotos/vídeos/ambos)
        correctAnswer: fotos
        rationale: "A resposta correta é 'fotos'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Todos se divertiram? (sim/não/mais ou menos)
        correctAnswer: sim
        rationale: "A resposta correta é 'sim'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
