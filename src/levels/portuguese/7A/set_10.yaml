title: Compreensão de Texto - A Família
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Pratique compreensão de texto - a família. Ex.: A família se reuniu para? → jantar."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
