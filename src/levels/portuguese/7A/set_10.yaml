title: Compreensão de Texto - A Família
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: Conjunto de portuguese/7A.
pages:
  - pageNumber: 1
    title: Reunião em Família
    description: Responda sobre o texto da família.
    exercises:
      - type: reading
        question: A família se reuniu para? (jantar/almoço/lanche)
        correctAnswer: jantar
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Quantas pessoas estavam presentes? (5/8/10)
        correctAnswer: 8
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: A avó preparou? (bolo/torta/biscoitos)
        correctAnswer: bolo
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: As crianças brincaram de? (pega-pega/esconde-esconde/amarelinha)
        correctAnswer: esconde-esconde
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: O tio tocou? (violão/piano/flauta)
        correctAnswer: violão
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Todos cantaram? (sim/não/apenas alguns)
        correctAnswer: sim
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: A festa terminou? (cedo/tarde/madrugada)
        correctAnswer: tarde
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: A comida estava? (boa/ruim/normal)
        correctAnswer: boa
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Tiraram? (fotos/vídeos/ambos)
        correctAnswer: fotos
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Todos se divertiram? (sim/não/mais ou menos)
        correctAnswer: sim
        rationale: Reveja o trecho relevante do texto.
target: 10
