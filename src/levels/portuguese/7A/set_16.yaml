title: Tempos Verbais - Passado
level: 7A
subject: portuguese
pages:
  - pageNumber: 1
    title: Pretérito Perfeito
    description: Complete com o verbo no passado.
    exercises:
      - { type: grammar, question: "Eu _____ ontem. (estudar - estudei/estudava/estudara)", correctAnswer: estudei }
      - { type: grammar, question: "Ela _____ o livro. (ler - leu/lia/lera)", correctAnswer: leu }
      - { type: grammar, question: "Nós _____ cedo. (chegar - chegamos/chegávamos/chegáramos)", correctAnswer: chegamos }
      - { type: grammar, question: "Tu _____ bem. (dormir - dormiste/dormias/dormiras)", correctAnswer: dormiste }
      - { type: grammar, question: "Eles _____ futebol. (jogar - jogaram/jogavam/jogaram)", correctAnswer: jogaram }
      - { type: grammar, question: "Eu _____ muito. (trabalhar - trabalhei/trabalhava/trabalhara)", correctAnswer: trabalhei }
      - { type: grammar, question: "Ela _____ a música. (ouvir - ouviu/ouvia/ouvira)", correctAnswer: ouviu }
      - { type: grammar, question: "Nós _____ a lição. (fazer - fizemos/fazíamos/fizéramos)", correctAnswer: fizemos }
      - { type: grammar, question: "Vocês _____ tarde. (sair - saíram/saíam/saíram)", correctAnswer: saíram }
      - { type: grammar, question: "Ele _____ português. (aprender - aprendeu/aprendia/aprendera)", correctAnswer: aprendeu }
target: 10
