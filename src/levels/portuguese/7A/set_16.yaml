title: Tempos Verbais - Passado
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Pretérito perfeito. Terminações −ei, −ou, −amos, −aram."
pages:
  - pageNumber: 1
    title: Pretérito Perfeito
    description: Complete com o verbo no passado.
    exercises:
      - type: grammar
        question: Eu _____ ontem. (estudar - estudei/estudava/estudara)
        correctAnswer: estudei
        rationale: "Eu exige a forma 'estudei' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Ela _____ o livro. (ler - leu/lia/lera)
        correctAnswer: leu
        rationale: "Ela exige a forma 'leu' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Nós _____ cedo. (chegar - chegamos/chegávamos/chegáramos)
        correctAnswer: chegamos
        rationale: "Nós exige a forma 'chegamos' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Tu _____ bem. (dormir - dormiste/dormias/dormiras)
        correctAnswer: dormiste
        rationale: "Tu exige a forma 'dormiste' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Eles _____ futebol. (jogar - jogaram/jogavam/jogaria)
        correctAnswer: jogaram
        rationale: "Eles exige a forma 'jogaram' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Eu _____ muito. (trabalhar - trabalhei/trabalhava/trabalhara)
        correctAnswer: trabalhei
        rationale: "Eu exige a forma 'trabalhei' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Ela _____ a música. (ouvir - ouviu/ouvia/ouvira)
        correctAnswer: ouviu
        rationale: "Ela exige a forma 'ouviu' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Nós _____ a lição. (fazer - fizemos/fazíamos/fizéramos)
        correctAnswer: fizemos
        rationale: "Nós exige a forma 'fizemos' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Vocês _____ tarde. (sair - saíram/saíam/saíram)
        correctAnswer: saíram
        rationale: Aplique a regra gramatical estudada.
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Ele _____ português. (aprender - aprendeu/aprendia/aprendera)
        correctAnswer: aprendeu
        rationale: "Ele exige a forma 'aprendeu' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
