title: Verbos - Conjugação Simples
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Conjugação verbal simples. Foco nas três conjugações regulares."
example: "Pratique verbos - conjugação simples. Ex.: Eu _____ português → falo."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Presente do Indicativo
    description: Escolha a conjugação correta.
    exercises:
      - type: grammar
        question: Eu _____ português (falar/falei/falo)
        correctAnswer: falo
        rationale: "Eu exige a forma 'falo' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Tu _____ bem (corre/correr/corres)
        correctAnswer: corres
        rationale: "Tu exige a forma 'corres' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Ele _____ livros (ler/leu/lê)
        correctAnswer: lê
        rationale: "Ele exige a forma 'lê' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Nós _____ na escola (estudar/estudamos/estudam)
        correctAnswer: estudamos
        rationale: "Nós exige a forma 'estudamos' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Vocês _____ música (ouvir/ouve/ouvem)
        correctAnswer: ouvem
        rationale: "A letra que falta forma 'ouvem'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Eles _____ futebol (jogar/joga/jogam)
        correctAnswer: jogam
        rationale: "Eles exige a forma 'jogam' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Eu _____ água (bebo/beber/bebeu)
