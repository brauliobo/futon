        rationale: "Eu exige a forma 'bebo' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Ela _____ cedo (dorme/dormem/dormir)
        correctAnswer: dorme
        rationale: "Ela exige a forma 'dorme' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Nós _____ televisão (vê/ver/vemos)
        correctAnswer: vemos
        rationale: "Nós exige a forma 'vemos' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Tu _____ muito (trabalha/trabalhas/trabalhar)
        correctAnswer: trabalhas
        rationale: "Tu exige a forma 'trabalhas' — concordância entre sujeito e verbo."
        difficulty: 1
        objectives: [pt.pre_reading]
