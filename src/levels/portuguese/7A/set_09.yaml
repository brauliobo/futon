title: Sinônimos e Antônimos
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Sinônimos e antônimos. Expande vocabulário."
example: "Pratique sinônimos e antônimos. Ex.: Sinônimo de 'grande': → enorme."
pages:
  - pageNumber: 1
    title: Palavras Relacionadas
    description: Escolha a palavra que tem o mesmo ou oposto significado.
    exercises:
      - type: grammar
        question: "Sinônimo de 'grande': (pequeno/enorme/médio)"
        correctAnswer: enorme
        rationale: "'enorme' tem sentido próximo de 'grande'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: "Antônimo de 'alto': (baixo/comprido/largo)"
        correctAnswer: baixo
        rationale: "'baixo' é o oposto de 'alto'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: "Sinônimo de 'bonito': (feio/belo/comum)"
        correctAnswer: belo
        rationale: "'belo' tem sentido próximo de 'bonito'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: "Antônimo de 'claro': (escuro/brilhante/limpo)"
        correctAnswer: escuro
        rationale: "'escuro' é o oposto de 'claro'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: "Sinônimo de 'rápido': (lento/veloz/normal)"
        correctAnswer: veloz
        rationale: "'veloz' tem sentido próximo de 'rápido'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: "Antônimo de 'quente': (morno/frio/tepido)"
        correctAnswer: frio
        rationale: "'frio' é o oposto de 'quente'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: "Sinônimo de 'feliz': (triste/alegre/nervoso)"
        correctAnswer: alegre
        rationale: "'alegre' tem sentido próximo de 'feliz'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: "Antônimo de 'fácil': (simples/difícil/rápido)"
        correctAnswer: difícil
        rationale: "'difícil' é o oposto de 'fácil'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: "Sinônimo de 'começar': (terminar/iniciar/parar)"
        correctAnswer: iniciar
        rationale: "'iniciar' tem sentido próximo de 'começar'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: "Antônimo de 'rico': (pobre/caro/valioso)"
        correctAnswer: pobre
        rationale: "'pobre' é o oposto de 'rico'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
