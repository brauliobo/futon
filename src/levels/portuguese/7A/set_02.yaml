title: Compreensão de Texto - Viagem de Avião
level: 7A
subject: portuguese
difficulty: 1
objectives: [pt.pre_reading]
authorNotes: Conjunto de portuguese/7A.
example: Leia atentamente e escolha a alternativa correta.
repeatAll: 2
pages:
  - pageNumber: 1
    title: Pequeno Texto 1
    description: Responda às perguntas.
    exercises:
      - { type: reading, question: "O texto fala sobre uma viagem de? (carro/avião/navio)", correctAnswer: avião }
      - { type: reading, question: "O destino foi? (praia/campo/cidade)", correctAnswer: praia }
      - { type: reading, question: "Quem viajou? (família/amigos/sozinha)", correctAnswer: família }
      - { type: reading, question: "Quanto tempo durou? (um dia/uma semana/um mês)", correctAnswer: uma semana }
      - { type: reading, question: "O clima estava? (chuvoso/ensolarado/nublado)", correctAnswer: ensolarado }
      - { type: reading, question: "Nadaram no? (rio/mar/piscina)", correctAnswer: mar }
      - { type: reading, question: "Comeram? (frutos do mar/massa/sopa)", correctAnswer: frutos do mar }
      - { type: reading, question: "Voltaram de? (ônibus/avião/trem)", correctAnswer: avião }
      - { type: reading, question: "A viagem foi? (cansativa/divertida/assustadora)", correctAnswer: divertida }
      - { type: reading, question: "Querem voltar? (sim/não/talvez)", correctAnswer: sim }
target: 20
