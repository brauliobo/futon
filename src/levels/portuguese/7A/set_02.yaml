title: Compreensão de Texto - Viagem de Avião
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Leia atentamente e escolha a alternativa correta. Ex.: O texto fala sobre uma viagem de? → avião."
repeatAll: 2
pages:
  - pageNumber: 1
    title: Pequeno Texto 1
    description: Responda às perguntas.
    exercises:
      - type: reading
        question: O texto fala sobre uma viagem de? (carro/avião/navio)
        correctAnswer: avião
        rationale: "A resposta correta é 'avião'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O destino foi? (praia/campo/cidade)
        correctAnswer: praia
        rationale: "A resposta correta é 'praia'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Quem viajou? (família/amigos/sozinha)
        correctAnswer: família
        rationale: "A resposta correta é 'família'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Quanto tempo durou? (um dia/uma semana/um mês)
        correctAnswer: uma semana
        rationale: "A resposta correta é 'uma semana'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O clima estava? (chuvoso/ensolarado/nublado)
        correctAnswer: ensolarado
        rationale: "A resposta correta é 'ensolarado'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Nadaram no? (rio/mar/piscina)
        correctAnswer: mar
        rationale: "A resposta correta é 'mar'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Comeram? (frutos do mar/massa/sopa)
        correctAnswer: frutos do mar
        rationale: "A resposta correta é 'frutos do mar'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Voltaram de? (ônibus/avião/trem)
        correctAnswer: avião
        rationale: "A resposta correta é 'avião'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A viagem foi? (cansativa/divertida/assustadora)
        correctAnswer: divertida
        rationale: "A resposta correta é 'divertida'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Querem voltar? (sim/não/talvez)
        correctAnswer: sim
        rationale: "A resposta correta é 'sim'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
