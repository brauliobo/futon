title: Compreensão de Texto - Viagem de Avião
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Leia atentamente e escolha a alternativa correta. Ex.: O texto fala sobre uma viagem de? → avião."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Pequeno Texto 1
    description: Responda às perguntas.
    exercises:
      - type: reading
        question: O texto fala sobre uma viagem de? (avião/carro/navio)
        correctAnswer: avião
        rationale: "Observe as opções e escolha a que responde \"O texto fala sobre uma viagem de?\": 'avião'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O destino foi? (cidade/campo/praia)
        correctAnswer: praia
        rationale: "Observe as opções e escolha a que responde \"O destino foi?\": 'praia'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Quem viajou? (sozinha/amigos/família)
        correctAnswer: família
        rationale: "Observe as opções e escolha a que responde \"Quem viajou?\": 'família'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Quanto tempo durou? (uma semana/um dia/um mês)
        correctAnswer: uma semana
        rationale: "Observe as opções e escolha a que responde \"Quanto tempo durou?\": 'uma semana'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: O clima estava? (nublado/chuvoso/ensolarado)
        correctAnswer: ensolarado
        rationale: "Observe as opções e escolha a que responde \"O clima estava?\": 'ensolarado'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Nadaram no? (rio/mar/piscina)
        correctAnswer: mar
        rationale: "Observe as opções e escolha a que responde \"Nadaram no?\": 'mar'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Comeram? (sopa/frutos do mar/massa)
        correctAnswer: frutos do mar
        rationale: "Observe as opções e escolha a que responde \"Comeram?\": 'frutos do mar'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Voltaram de? (trem/avião/ônibus)
        correctAnswer: avião
        rationale: "Observe as opções e escolha a que responde \"Voltaram de?\": 'avião'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: A viagem foi? (divertida/cansativa/assustadora)
        correctAnswer: divertida
        rationale: "Observe as opções e escolha a que responde \"A viagem foi?\": 'divertida'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: reading
        question: Querem voltar? (não/talvez/sim)
        correctAnswer: sim
        rationale: "Observe as opções e escolha a que responde \"Querem voltar?\": 'sim'."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
