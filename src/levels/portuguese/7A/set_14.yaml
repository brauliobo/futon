title: Preposições
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Preposições (a, de, em, para…). Conectam termos da frase."
example: "Pratique preposições. Ex.: Vou ___ escola. → a."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Usando Preposições
    description: Complete com a preposição correta.
    exercises:
      - type: grammar
        question: Vou ___ escola. (em/a/de)
        correctAnswer: a
        rationale: "Observe as opções e escolha a que responde \"Vou ___ escola.\": 'a'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Vim ___ casa. (a/em/de)
        correctAnswer: de
        rationale: "Observe as opções e escolha a que responde \"Vim ___ casa.\": 'de'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Estou ___ sala. (de/a/em)
        correctAnswer: em
        rationale: "Observe as opções e escolha a que responde \"Estou ___ sala.\": 'em'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Gosto ___ música. (em/a/de)
        correctAnswer: de
        rationale: "A preposição 'de' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Penso ___ você. (de/em/a)
        correctAnswer: em
        rationale: "A preposição 'em' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Vou ___ praia. (em/a/de)
        correctAnswer: a
        rationale: "Observe as opções e escolha a que responde \"Vou ___ praia.\": 'a'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Venho ___ trabalho. (em/a/de)
        correctAnswer: de
        rationale: "A preposição 'de' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Moro ___ São Paulo. (de/a/em)
        correctAnswer: em
        rationale: "A preposição 'em' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Assisto ___ TV. (em/de/a)
        correctAnswer: a
        rationale: "A preposição 'a' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Preciso ___ ajuda. (a/em/de)
        correctAnswer: de
        rationale: "A preposição 'de' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
