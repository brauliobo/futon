title: 🔗 Preposições
level: 7A
subject: portuguese
difficulty: 1
objectives:
  - pt.pre_reading
authorNotes: "Preposições (a, de, em, para…). Conectam termos da frase."
example: "Pratique preposições. Ex.: Vou ___ escola. → a."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Usando Preposições
    description: Complete com a preposição correta.
    exercises:
      - type: grammar
        question: Vou ___ escola. (de/a/em)
        correctAnswer: a
        rationale: "'Ir a' indica destino (movimento rumo a); 'de' seria origem e 'em' localização."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Vim ___ casa. (em/de/a)
        correctAnswer: de
        rationale: "'Vir de' indica origem (de onde veio); 'a' seria destino e 'em' localização."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Estou ___ sala. (em/a/de)
        correctAnswer: em
        rationale: "'Estar em' indica localização (onde); 'a' seria destino e 'de' origem."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Gosto ___ música. (de/a/em)
        correctAnswer: de
        rationale: "A preposição 'de' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Penso ___ você. (de/a/em)
        correctAnswer: em
        rationale: "A preposição 'em' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Vou ___ praia. (em/de/a)
        correctAnswer: a
        rationale: "'Ir a' indica destino (movimento rumo a um lugar) — mesma regência de 'vou a escola'."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Venho ___ trabalho. (em/a/de)
        correctAnswer: de
        rationale: "A preposição 'de' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Moro ___ São Paulo. (de/a/em)
        correctAnswer: em
        rationale: "A preposição 'em' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Assisto ___ TV. (de/a/em)
        correctAnswer: a
        rationale: "A preposição 'a' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
      - type: grammar
        question: Preciso ___ ajuda. (de/a/em)
        correctAnswer: de
        rationale: "A preposição 'de' é exigida pela regência."
        difficulty: 1
        objectives: [pt.pre_reading]
target: 10
