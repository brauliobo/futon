title: Compreensão de Texto - O Jardim
level: A
subject: portuguese
difficulty: 2
objectives: [pt.sentence_building]
authorNotes: Conjunto de portuguese/A.
example: Leia sobre plantas e jardins.
pages:
  - pageNumber: 1
    title: O Jardim da Casa
    description: Responda sobre o jardim.
    passage: "No fundo da casa há um jardim muito bonito. Lá crescem rosas vermelhas perfumadas. A mãe cuida do jardim com muito carinho e rega as plantas toda manhã. Ela também planta tomates e tem uma laranjeira no canto. Na primavera, as flores nascem e as abelhas vêm visitar. O jardim fica lindo durante essa estação."
    exercises:
      - { type: reading, question: "Onde fica o jardim? (frente/fundo/lado) da casa", correctAnswer: fundo }
      - { type: reading, question: "Que flores há no jardim? (rosas/tulipas/margaridas)", correctAnswer: rosas }
      - { type: reading, question: "Que cor são as flores? (brancas/vermelhas/amarelas)", correctAnswer: vermelhas }
      - { type: reading, question: "Quem cuida do jardim? (pai/mãe/jardineiro)", correctAnswer: mãe }
      - { type: reading, question: "Quando rega as plantas? (manhã/tarde/noite)", correctAnswer: manhã }
      - { type: reading, question: "Que legume planta? (tomate/alface/cenoura)", correctAnswer: tomate }
      - { type: reading, question: "Que árvore há no jardim? (macieira/bananeira/laranjeira)", correctAnswer: laranjeira }
      - { type: reading, question: "Que inseto visita as flores? (formiga/abelha/mosca)", correctAnswer: abelha }
      - { type: reading, question: "Em que estação as flores nascem? (inverno/primavera/outono)", correctAnswer: primavera }
      - { type: reading, question: "Como fica o jardim? (feio/bonito/seco)", correctAnswer: bonito }
target: 10
