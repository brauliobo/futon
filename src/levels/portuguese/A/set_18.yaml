title: Compreensão de Texto - O Jardim
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Leia sobre plantas e jardins. Ex.: Onde fica o jardim? (frente/fundo/lado) da casa → fundo."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: O Jardim da Casa
    description: Responda sobre o jardim.
    passage: No fundo da casa há um jardim muito bonito. Lá crescem rosas vermelhas perfumadas. A mãe cuida do jardim com muito carinho e rega as plantas toda manhã. Ela também planta tomates e tem uma laranjeira no canto. Na primavera, as flores nascem e as abelhas vêm visitar. O jardim fica lindo durante essa estação.
    exercises:
      - type: reading
        question: Onde fica o jardim? (frente/fundo/lado) da casa
        correctAnswer: fundo
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que flores há no jardim? (rosas/tulipas/margaridas)
        correctAnswer: rosas
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que cor são as flores? (brancas/vermelhas/amarelas)
        correctAnswer: vermelhas
        rationale: "A cor mencionada aparece explicitamente no trecho."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Quem cuida do jardim? (pai/mãe/jardineiro)
        correctAnswer: mãe
        rationale: "O sujeito responde 'quem pratica a ação'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Quando rega as plantas? (noite/tarde/manhã)
        correctAnswer: manhã
        rationale: "O tempo responde 'quando' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que legume planta? (cenoura/tomate/alface)
        correctAnswer: tomate
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que árvore há no jardim? (laranjeira/bananeira/macieira)
        correctAnswer: laranjeira
        rationale: "Releia o trecho onde o tema é citado para confirmar."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que inseto visita as flores? (abelha/mosca/formiga)
        correctAnswer: abelha
        rationale: "Localize a palavra-chave da pergunta no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Em que estação as flores nascem? (primavera/outono/inverno)
        correctAnswer: primavera
        rationale: "A resposta aparece de forma direta no parágrafo correspondente."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Como fica o jardim? (bonito/seco/feio)
        correctAnswer: bonito
        rationale: "O modo responde 'como' a ação aconteceu."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
