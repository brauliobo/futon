title: Compreensão e Gramática - Revisão Geral
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
example: "Misture diferentes tipos de exercícios. Ex.: Em uma festa, as crianças comem? → bolo."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Revisão Final
    description: Responda questões variadas.
    passage: Era dia de festa! Na sala da casa havia um bolo lindo no centro da mesa. As meninas alegres enfeitavam o ambiente com balões coloridos. Quando os convidados chegaram, todos sorriram felizes. A aniversariante ficou muito feliz com a surpresa. Juntos cantaram parabéns e comeram o bolo gostoso.
    exercises:
      - type: reading
        question: Em uma festa, as crianças comem? (bolo/sopa/salada)
        correctAnswer: bolo
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'festa' é uma palavra (feminina/masculina)"
        correctAnswer: feminina
        rationale: "Siga a ordem dos acontecimentos no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Onde normalmente fazemos festa? (sala/banheiro/cozinha)
        correctAnswer: sala
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Na frase 'Eu canto', o verbo está no (futuro/passado/presente)
        correctAnswer: presente
        rationale: "Tempo verbal situa a ação no tempo (presente, passado ou futuro)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que som fazemos quando estamos felizes? (choro/grito/riso)
        correctAnswer: riso
        rationale: "O tempo responde 'quando' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'alegres' está no (plural/singular)"
        correctAnswer: plural
        rationale: "No plural, geralmente acrescenta-se -s à palavra."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ meninas brincam. (A/Os/O/As)
        correctAnswer: As
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Quando é seu aniversário você fica? (feliz/bravo/triste)
        correctAnswer: feliz
        rationale: "O tempo responde 'quando' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'rapidamente' é um (substantivo/advérbio/verbo)"
        correctAnswer: advérbio
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vou ___ festa. (para/na/da)
        correctAnswer: para
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
