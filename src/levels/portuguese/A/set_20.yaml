title: Compreensão e Gramática - Revisão Geral
level: A
subject: portuguese
difficulty: 2
objectives: [pt.sentence_building]
authorNotes: Conjunto de portuguese/A.
example: Misture diferentes tipos de exercícios.
pages:
  - pageNumber: 1
    title: Revisão Final
    description: Responda questões variadas.
    passage: "Era dia de festa! Na sala da casa havia um bolo lindo no centro da mesa. As meninas alegres enfeitavam o ambiente com balões coloridos. Quando os convidados chegaram, todos sorriram felizes. A aniversariante ficou muito feliz com a surpresa. Juntos cantaram parabéns e comeram o bolo gostoso."
    exercises:
      - { type: reading, question: "Em uma festa, as crianças comem? (bolo/sopa/salada)", correctAnswer: bolo }
      - { type: grammar, question: "'festa' é uma palavra (masculina/feminina)", correctAnswer: feminina }
      - { type: reading, question: "Onde normalmente fazemos festa? (banheiro/sala/cozinha)", correctAnswer: sala }
      - { type: grammar, question: "Na frase 'Eu canto', o verbo está no (passado/presente/futuro)", correctAnswer: presente }
      - { type: reading, question: "Que som fazemos quando estamos felizes? (choro/riso/grito)", correctAnswer: riso }
      - { type: grammar, question: "'alegres' está no (singular/plural)", correctAnswer: plural }
      - { type: grammar, question: "___ meninas brincam. (O/A/As/Os)", correctAnswer: As }
      - { type: reading, question: "Quando é seu aniversário você fica? (triste/feliz/bravo)", correctAnswer: feliz }
      - { type: grammar, question: "'rapidamente' é um (substantivo/verbo/advérbio)", correctAnswer: advérbio }
      - { type: grammar, question: "Vou ___ festa. (na/da/para)", correctAnswer: para }
target: 10
