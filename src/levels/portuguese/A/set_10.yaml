title: Compreensão de Texto - Família
level: A
subject: portuguese
example: Leia sobre a família e responda as questões.
pages:
  - pageNumber: 1
    title: A Família de João
    description: Responda sobre a família.
    exercises:
      - type: reading
        question: Quantos irmãos João tem? (um/dois/três)
        correctAnswer: dois
      - type: reading
        question: Como se chama sua irmã? (Ana/Maria/Clara)
        correctAnswer: Ana
      - type: reading
        question: Qual a profissão do pai? (médico/professor/engenheiro)
        correctAnswer: professor
      - type: reading
        question: O que a mãe gosta de fazer? (cozinhar/costurar/ler)
        correctAnswer: cozinhar
      - type: reading
        question: Onde moram? (apartamento/casa/sítio)
        correctAnswer: casa
      - type: reading
        question: Que animal têm? (cachorro/gato/pássaro)
        correctAnswer: cachorro
      - type: reading
        question: Como se chama o cachorro? (Rex/Bolt/Max)
        correctAnswer: Rex
      - type: reading
        question: Aos domingos vão à? (praia/igreja/praça)
        correctAnswer: igreja
      - type: reading
        question: Qual esporte João pratica? (futebol/basquete/tênis)
        correctAnswer: futebol
      - type: reading
        question: A família é? (pequena/grande/média)
        correctAnswer: média
target: 10
