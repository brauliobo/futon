title: Compreensão de Texto - Família
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Leia sobre a família e responda as questões. Ex.: Quantos irmãos João tem? → dois."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: A Família de João
    description: Responda sobre a família.
    passage: João mora numa casa com sua família média. Ele tem dois irmãos e uma irmã chamada Ana. O pai é professor e a mãe adora cozinhar. Eles têm um cachorro chamado Rex que brinca com todos. Aos domingos, toda a família vai à igreja. João gosta muito de praticar futebol com os amigos.
    exercises:
      - type: reading
        question: Quantos irmãos João tem? (dois/três/um)
        correctAnswer: dois
        rationale: "A quantidade responde 'quanto' ou 'quantos'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Como se chama sua irmã? (Maria/Ana/Clara)
        correctAnswer: Ana
        rationale: "O modo responde 'como' a ação aconteceu."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Qual a profissão do pai? (professor/engenheiro/médico)
        correctAnswer: professor
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: O que a mãe gosta de fazer? (costurar/ler/cozinhar)
        correctAnswer: cozinhar
        rationale: "Siga a ordem dos acontecimentos no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Onde moram? (apartamento/casa/sítio)
        correctAnswer: casa
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que animal têm? (gato/cachorro/pássaro)
        correctAnswer: cachorro
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Como se chama o cachorro? (Rex/Max/Bolt)
        correctAnswer: Rex
        rationale: "O modo responde 'como' a ação aconteceu."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Aos domingos vão à? (praça/praia/igreja)
        correctAnswer: igreja
        rationale: "Releia o trecho onde o tema é citado para confirmar."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Qual esporte João pratica? (basquete/futebol/tênis)
        correctAnswer: futebol
        rationale: "O esporte ou atividade é citado diretamente no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: A família é? (grande/pequena/média)
        correctAnswer: média
        rationale: "Localize a palavra-chave da pergunta no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
