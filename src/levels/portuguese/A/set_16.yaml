title: Compreensão de Texto - A Cozinha
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Leia sobre atividades na cozinha.
pages:
  - pageNumber: 1
    title: Na Cozinha da Vovó
    description: Responda sobre a cozinha.
    passage: A vovó está na cozinha preparando um bolo delicioso. O ingrediente principal é a farinha. Ela mistura tudo com cuidado e coloca no forno. O bolo demora 30 minutos para assar. Um cheiro gostoso de bolo se espalha pela casa. A neta ajuda a vovó na cozinha. Quando o bolo fica pronto, as duas comem juntas e ficam muito felizes.
    exercises:
      - type: reading
        question: O que a vovó está fazendo? (cozinhando/limpando/descansando)
        correctAnswer: cozinhando
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Que comida ela prepara? (bolo/sopa/salada)
        correctAnswer: bolo
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Que ingrediente principal usa? (farinha/leite/ovos)
        correctAnswer: farinha
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Onde coloca o bolo? (forno/geladeira/mesa)
        correctAnswer: forno
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Quanto tempo leva para assar? (10 minutos/30 minutos/1 hora)
        correctAnswer: 30 minutos
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Que cheiro se espalha? (flores/bolo/perfume)
        correctAnswer: bolo
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Quem ajuda a vovó? (vovô/neta/vizinha)
        correctAnswer: neta
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Como fica o bolo no final? (queimado/gostoso/cru)
        correctAnswer: gostoso
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: O que fazem depois? (comem/guardam/vendem)
        correctAnswer: comem
        rationale: Reveja o trecho relevante do texto.
      - type: reading
        question: Como se sentem? (felizes/tristes/cansadas)
        correctAnswer: felizes
        rationale: Reveja o trecho relevante do texto.
target: 10
