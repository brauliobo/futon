title: Gramática - Verbos no Presente
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Verbos no presente. Conjugação regular das três conjugações (−ar, −er, −ir)."
example: Identifique verbos conjugados no presente.
pages:
  - pageNumber: 1
    title: Verbos de Ação
    description: Escolha a conjugação correta no presente.
    exercises:
      - type: grammar
        question: Eu ___ na escola. (estudo/estudas/estuda)
        correctAnswer: estudo
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ela ___ muito bem. (canto/cantas/canta)
        correctAnswer: canta
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós ___ futebol. (jogo/jogas/jogamos)
        correctAnswer: jogamos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vocês ___ livros. (leio/leem/lemos)
        correctAnswer: leem
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ele ___ rápido. (corro/corres/corre)
        correctAnswer: corre
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eu ___ água. (bebo/bebes/bebe)
        correctAnswer: bebo
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Tu ___ bem. (escrevo/escreves/escreve)
        correctAnswer: escreves
        rationale: "Com 'tu' o verbo vai na 2ª pessoa do singular (-s)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eles ___ tarde. (durmo/dormem/dormimos)
        correctAnswer: dormem
        rationale: "Com 'eles/elas' o verbo vai na 3ª pessoa do plural."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós ___ juntos. (almoço/almoças/almoçamos)
        correctAnswer: almoçamos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Você ___ televisão. (assisto/assiste/assistimos)
        correctAnswer: assiste
        rationale: "Com 'você' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
