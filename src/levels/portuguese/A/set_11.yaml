title: Gramática - Verbos no Presente
level: A
subject: portuguese
example: Identifique verbos conjugados no presente.
pages:
  - pageNumber: 1
    title: Verbos de Ação
    description: Escolha a conjugação correta no presente.
    exercises:
      - { type: grammar, question: "Eu ___ na escola. (estudo/estudas/estuda)", correctAnswer: estudo }
      - { type: grammar, question: "Ela ___ muito bem. (canto/cantas/canta)", correctAnswer: canta }
      - { type: grammar, question: "Nós ___ futebol. (jogo/jogas/jogamos)", correctAnswer: jogamos }
      - { type: grammar, question: "Vocês ___ livros. (leio/leem/lemos)", correctAnswer: leem }
      - { type: grammar, question: "Ele ___ rápido. (corro/corres/corre)", correctAnswer: corre }
      - { type: grammar, question: "Eu ___ água. (bebo/bebes/bebe)", correctAnswer: bebo }
      - { type: grammar, question: "Tu ___ bem. (escrevo/escreves/escreve)", correctAnswer: escreves }
      - { type: grammar, question: "Eles ___ tarde. (durmo/dormem/dormimos)", correctAnswer: dormem }
      - { type: grammar, question: "Nós ___ juntos. (almoço/almoças/almoçamos)", correctAnswer: almoçamos }
      - { type: grammar, question: "Você ___ televisão. (assisto/assiste/assistimos)", correctAnswer: assiste }
target: 10
