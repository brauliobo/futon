title: Gramática - Verbos no Presente
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Verbos no presente. Conjugação regular das três conjugações (−ar, −er, −ir)."
example: "Identifique verbos conjugados no presente. Ex.: Eu ___ na escola. → estudo."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Verbos de Ação
    description: Escolha a conjugação correta no presente.
    exercises:
      - type: grammar
        question: Eu ___ na escola. (estuda/estudo/estudas)
        correctAnswer: estudo
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ela ___ muito bem. (canta/cantas/canto)
        correctAnswer: canta
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós ___ futebol. (jogamos/jogas/jogo)
        correctAnswer: jogamos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vocês ___ livros. (lemos/leem/leio)
        correctAnswer: leem
        rationale: "O verbo concorda com o sujeito em pessoa e número."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ele ___ rápido. (corre/corro/corres)
        correctAnswer: corre
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eu ___ água. (bebe/bebo/bebes)
        correctAnswer: bebo
        rationale: "Com 'eu' o verbo vai na 1ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Tu ___ bem. (escreve/escrevo/escreves)
        correctAnswer: escreves
        rationale: "Com 'tu' o verbo vai na 2ª pessoa do singular (-s)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Eles ___ tarde. (durmo/dormem/dormimos)
        correctAnswer: dormem
        rationale: "Com 'eles/elas' o verbo vai na 3ª pessoa do plural."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Nós ___ juntos. (almoço/almoças/almoçamos)
        correctAnswer: almoçamos
        rationale: "Com 'nós' o verbo vai na 1ª pessoa do plural (-mos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Você ___ televisão. (assiste/assistimos/assisto)
        correctAnswer: assiste
        rationale: "Com 'você' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
