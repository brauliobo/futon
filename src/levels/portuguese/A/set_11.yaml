title: Gramática - Verbos no Presente
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique verbos conjugados no presente.
pages:
  - pageNumber: 1
    title: Verbos de Ação
    description: Escolha a conjugação correta no presente.
    exercises:
      - type: grammar
        question: Eu ___ na escola. (estudo/estudas/estuda)
        correctAnswer: estudo
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Ela ___ muito bem. (canto/cantas/canta)
        correctAnswer: canta
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Nós ___ futebol. (jogo/jogas/jogamos)
        correctAnswer: jogamos
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Vocês ___ livros. (leio/leem/lemos)
        correctAnswer: leem
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Ele ___ rápido. (corro/corres/corre)
        correctAnswer: corre
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Eu ___ água. (bebo/bebes/bebe)
        correctAnswer: bebo
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Tu ___ bem. (escrevo/escreves/escreve)
        correctAnswer: escreves
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Eles ___ tarde. (durmo/dormem/dormimos)
        correctAnswer: dormem
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Nós ___ juntos. (almoço/almoças/almoçamos)
        correctAnswer: almoçamos
        rationale: Aplique a regra gramatical estudada.
      - type: grammar
        question: Você ___ televisão. (assisto/assiste/assistimos)
        correctAnswer: assiste
        rationale: Aplique a regra gramatical estudada.
target: 10
