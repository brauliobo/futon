title: Gramática - Singular e Plural
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique se as palavras estão no singular ou plural.
pages:
  - pageNumber: 1
    title: Singular ou Plural
    description: Escolha se a palavra está no singular ou plural.
    exercises:
      - type: grammar
        question: "'livros' está no (singular/plural)"
        correctAnswer: plural
        rationale: "Elimine alternativas que contradizem o texto."
      - type: grammar
        question: "'mesa' está no (singular/plural)"
        correctAnswer: singular
        rationale: "Elimine alternativas que contradizem o texto."
      - type: grammar
        question: "'crianças' está no (singular/plural)"
        correctAnswer: plural
        rationale: "Letras maiúsculas iniciam frases e nomes próprios."
      - type: grammar
        question: "'gato' está no (singular/plural)"
        correctAnswer: singular
        rationale: "A resposta correta repete ou retoma termo do texto."
      - type: grammar
        question: "'flores' está no (singular/plural)"
        correctAnswer: plural
        rationale: "Preste atenção em números e quantidades mencionados."
      - type: grammar
        question: "'casa' está no (singular/plural)"
        correctAnswer: singular
        rationale: "Conte sílabas em voz alta para separar corretamente."
      - type: grammar
        question: "'carros' está no (singular/plural)"
        correctAnswer: plural
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: grammar
        question: "'árvore' está no (singular/plural)"
        correctAnswer: singular
        rationale: "Releia a frase em que o personagem é mencionado."
      - type: grammar
        question: "'animais' está no (singular/plural)"
        correctAnswer: plural
        rationale: "A resposta aparece logo após a conjunção da frase."
      - type: grammar
        question: "'menino' está no (singular/plural)"
        correctAnswer: singular
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
target: 10
