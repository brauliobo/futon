title: ✏️ Gramática - Singular e Plural
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Singular vs plural. Regras: +s, +es, −ão → −ões/−ães/−ãos."
example: "Identifique se as palavras estão no singular ou plural. Ex.: 'casa' está no → singular."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Singular ou Plural
    description: Escolha se a palavra está no singular ou plural.
    exercises:
      - type: grammar
        question: "'livros' está no (plural/singular)"
        correctAnswer: plural
        rationale: "No plural, geralmente acrescenta-se -s à palavra."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'mesa' está no (singular/plural)"
        correctAnswer: singular
        rationale: "No plural, geralmente acrescenta-se -s à palavra."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'crianças' está no (singular/plural)"
        correctAnswer: plural
        rationale: "Palavras em vogal → acrescente -s (casa → casas)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'gato' está no (plural/singular)"
        correctAnswer: singular
        rationale: "Palavras em -ão → -ões/-ãos/-ães (pão → pães)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'flores' está no (plural/singular)"
        correctAnswer: plural
        rationale: "Palavras em -l → troque -l por -is (papel → papéis)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'casa' está no (singular/plural)"
        correctAnswer: singular
        rationale: "Palavras em -r/-z → acrescente -es (flor → flores)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'carros' está no (singular/plural)"
        correctAnswer: plural
        rationale: "Palavras em -m → troque -m por -ns (homem → homens)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'árvore' está no (plural/singular)"
        correctAnswer: singular
        rationale: "Palavras em -s (oxítonas) → acrescente -es (mês → meses)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'animais' está no (singular/plural)"
        correctAnswer: plural
        rationale: "Plural é a forma que indica mais de um ser ou objeto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'menino' está no (singular/plural)"
        correctAnswer: singular
        rationale: "Singular é a forma que indica um único ser ou objeto."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
