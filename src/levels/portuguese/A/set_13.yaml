title: Gramática - Artigos
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique artigos definidos e indefinidos.
pages:
  - pageNumber: 1
    title: Artigos Corretos
    description: Escolha o artigo adequado.
    exercises:
      - type: grammar
        question: ___ menino brinca. (O/A/Um/Uma)
        correctAnswer: O
        rationale: "Preste atenção em números e quantidades mencionados."
      - type: grammar
        question: ___ menina estuda. (O/A/Um/Uma)
        correctAnswer: A
        rationale: "Confira o tempo (quando) indicado por 'ontem' ou 'hoje'."
      - type: grammar
        question: ___ casa é grande. (O/A/Um/Uma)
        correctAnswer: A
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: grammar
        question: ___ carro é azul. (O/A/Um/Uma)
        correctAnswer: O
        rationale: "Ponto final indica fim de frase declarativa."
      - type: grammar
        question: Vi ___ gato na rua. (o/a/um/uma)
        correctAnswer: um
        rationale: "Releia palavra por palavra — cada detalhe conta."
      - type: grammar
        question: Comprei ___ flor bonita. (o/a/um/uma)
        correctAnswer: uma
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: grammar
        question: ___ livros estão na mesa. (O/A/Os/As)
        correctAnswer: Os
        rationale: "Associe a pergunta ao trecho que traz o mesmo vocabulário."
      - type: grammar
        question: ___ flores são coloridas. (O/A/Os/As)
        correctAnswer: As
        rationale: "Verifique sinônimos que a pergunta pode ter usado."
      - type: grammar
        question: Preciso de ___ lápis. (o/a/um/uma)
        correctAnswer: um
        rationale: "Verifique sinônimos que a pergunta pode ter usado."
      - type: grammar
        question: Ela tem ___ boneca nova. (o/a/um/uma)
        correctAnswer: uma
        rationale: "Ponto final indica fim de frase declarativa."
target: 10
