      - { type: grammar, question: ""Vi ___ gato na rua. (o/a/um/uma)"", correctAnswer: um }
      - { type: grammar, question: ""Comprei ___ flor bonita. (o/a/um/uma)"", correctAnswer: uma }
      - { type: grammar, question: ""___ livros estão na mesa. (O/A/Os/As)"", correctAnswer: Os }
      - { type: grammar, question: ""___ flores são coloridas. (O/A/Os/As)"", correctAnswer: As }
      - { type: grammar, question: ""Preciso de ___ lápis. (o/a/um/uma)"", correctAnswer: um }
      - { type: grammar, question: ""Ela tem ___ boneca nova. (o/a/um/uma)"", correctAnswer: uma }
