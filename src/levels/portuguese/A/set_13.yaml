title: Gramática - Artigos
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Artigos definidos (o, a) vs indefinidos (um, uma). Concordância com o substantivo."
example: Identifique artigos definidos e indefinidos.
pages:
  - pageNumber: 1
    title: Artigos Corretos
    description: Escolha o artigo adequado.
    exercises:
      - type: grammar
        question: ___ menino brinca. (O/A/Um/Uma)
        correctAnswer: O
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ menina estuda. (O/A/Um/Uma)
        correctAnswer: A
        rationale: "O artigo concorda com o substantivo em gênero e número."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ casa é grande. (O/A/Um/Uma)
        correctAnswer: A
        rationale: "O artigo concorda com o substantivo em gênero e número."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ carro é azul. (O/A/Um/Uma)
        correctAnswer: O
        rationale: "O artigo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vi ___ gato na rua. (o/a/um/uma)
        correctAnswer: um
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Comprei ___ flor bonita. (o/a/um/uma)
        correctAnswer: uma
        rationale: "Artigos definidos (o, a, os, as) especificam ser conhecido."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ livros estão na mesa. (O/A/Os/As)
        correctAnswer: Os
        rationale: "Masculino singular: o/um. Feminino singular: a/uma."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ flores são coloridas. (O/A/Os/As)
        correctAnswer: As
        rationale: "Masculino plural: os/uns. Feminino plural: as/umas."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Preciso de ___ lápis. (o/a/um/uma)
        correctAnswer: um
        rationale: "Artigos indefinidos (um, uma, uns, umas) generalizam."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Ela tem ___ boneca nova. (o/a/um/uma)
        correctAnswer: uma
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
