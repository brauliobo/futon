title: Gramática - Artigos
level: A
subject: portuguese
example: Identifique artigos definidos e indefinidos.
pages:
  - pageNumber: 1
    title: Artigos Corretos
    description: Escolha o artigo adequado.
    exercises:
      - { type: grammar, question: ""___ menino brinca. (O/A/Um/Uma)"", correctAnswer: O }
      - { type: grammar, question: ""___ menina estuda. (O/A/Um/Uma)"", correctAnswer: A }
      - { type: grammar, question: ""___ casa é grande. (O/A/Um/Uma)"", correctAnswer: A }
