title: Compreensão de Texto - Animais
level: A
subject: portuguese
difficulty: 2
objectives: [pt.sentence_building]
authorNotes: Conjunto de portuguese/A.
example: Leia sobre animais e responda as questões.
pages:
  - pageNumber: 1
    title: Os Animais da Fazenda
    description: Responda sobre os animais.
    passage: "Na fazenda vivem muitos animais. A vaca dá leite fresquinho toda manhã. O galo acorda todos com seu cocoricó. A galinha põe ovos no galinheiro. O cachorro late para proteger a fazenda. O peixe nada na água do açude. Os pássaros fazem seus ninhos nas árvores. A zebra tem listras pretas e brancas. O elefante é o maior animal da selva. O gato mia pedindo carinho."
    exercises:
      - { type: reading, question: "Qual animal dá leite? (vaca/galinha/porco)", correctAnswer: vaca }
      - { type: reading, question: "Que som faz o galo? (muu/cocoricó/au-au)", correctAnswer: cocoricó }
      - { type: reading, question: "Qual animal põe ovos? (cavalo/galinha/ovelha)", correctAnswer: galinha }
      - { type: reading, question: "Onde vive o peixe? (terra/água/ar)", correctAnswer: água }
      - { type: reading, question: "Qual animal late? (gato/cachorro/pássaro)", correctAnswer: cachorro }
      - { type: reading, question: "Que animal tem listras? (zebra/leão/elefante)", correctAnswer: zebra }
      - { type: reading, question: "Qual é o maior animal? (formiga/elefante/rato)", correctAnswer: elefante }
      - { type: reading, question: "Que animal voa? (peixe/pássaro/cobra)", correctAnswer: pássaro }
      - { type: reading, question: "Qual animal mia? (gato/cachorro/cavalo)", correctAnswer: gato }
      - { type: reading, question: "Onde dorme o pássaro? (toca/ninho/casa)", correctAnswer: ninho }
target: 10
