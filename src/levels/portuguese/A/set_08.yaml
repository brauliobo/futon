title: Compreensão de Texto - Animais
level: A
subject: portuguese
example: Leia sobre animais e responda as questões.
pages:
  - pageNumber: 1
    title: Os Animais da Fazenda
    description: Responda sobre os animais.
    exercises:
      - type: reading
        question: Qual animal dá leite? (vaca/galinha/porco)
        correctAnswer: vaca
      - type: reading
        question: Que som faz o galo? (muu/cocoricó/au-au)
        correctAnswer: cocoricó
      - type: reading
        question: Qual animal põe ovos? (cavalo/galinha/ovelha)
        correctAnswer: galinha
      - type: reading
        question: Onde vive o peixe? (terra/água/ar)
        correctAnswer: água
      - type: reading
        question: Qual animal late? (gato/cachorro/pássaro)
        correctAnswer: cachorro
      - type: reading
        question: Que animal tem listras? (zebra/leão/elefante)
        correctAnswer: zebra
      - type: reading
        question: Qual é o maior animal? (formiga/elefante/rato)
        correctAnswer: elefante
      - type: reading
        question: Que animal voa? (peixe/pássaro/cobra)
        correctAnswer: pássaro
      - type: reading
        question: Qual animal mia? (gato/cachorro/cavalo)
        correctAnswer: gato
      - type: reading
        question: Onde dorme o pássaro? (toca/ninho/casa)
        correctAnswer: ninho
target: 10
