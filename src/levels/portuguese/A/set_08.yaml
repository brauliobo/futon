title: Compreensão de Texto - Animais
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Leia sobre animais e responda as questões. Ex.: Que animal tem listras? → zebra."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Os Animais da Fazenda
    description: Responda sobre os animais.
    passage: Na fazenda vivem muitos animais. A vaca dá leite fresquinho toda manhã. O galo acorda todos com seu cocoricó. A galinha põe ovos no galinheiro. O cachorro late para proteger a fazenda. O peixe nada na água do açude. Os pássaros fazem seus ninhos nas árvores. A zebra tem listras pretas e brancas. O elefante é o maior animal da selva. O gato mia pedindo carinho.
    exercises:
      - type: reading
        question: Qual animal dá leite? (porco/galinha/vaca)
        correctAnswer: vaca
        rationale: "A característica do animal está descrita no texto — releia com atenção."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que som faz o galo? (muu/au-au/cocoricó)
        correctAnswer: cocoricó
        rationale: "A característica do animal está descrita no texto — releia com atenção."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Qual animal põe ovos? (cavalo/galinha/ovelha)
        correctAnswer: galinha
        rationale: "Releia o trecho onde o tema é citado para confirmar."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Onde vive o peixe? (terra/água/ar)
        correctAnswer: água
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Qual animal late? (gato/cachorro/pássaro)
        correctAnswer: cachorro
        rationale: "O texto diz 'O cachorro late para proteger a fazenda'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que animal tem listras? (elefante/leão/zebra)
        correctAnswer: zebra
        rationale: "Localize a palavra-chave da pergunta no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Qual é o maior animal? (elefante/rato/formiga)
        correctAnswer: elefante
        rationale: "O texto diz 'O elefante é o maior animal da selva'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que animal voa? (pássaro/cobra/peixe)
        correctAnswer: pássaro
        rationale: "A resposta aparece de forma direta no parágrafo correspondente."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Qual animal mia? (cachorro/gato/cavalo)
        correctAnswer: gato
        rationale: "Procure o trecho que responde 'quem', 'o quê', 'onde' ou 'quando'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Onde dorme o pássaro? (toca/casa/ninho)
        correctAnswer: ninho
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
