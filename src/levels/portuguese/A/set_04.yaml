title: Gramática - Classes de Palavras (Parte 2)
level: A
subject: portuguese
example: Continue identificando classes de palavras.
pages:
  - pageNumber: 1
    title: Mais Classes de Palavras
    description: Escolha a classe correta de cada palavra.
    exercises:
      - { type: grammar, question: "'feliz' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'andar' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'amizade' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'devagar' é (advérbio/preposição/substantivo)", correctAnswer: advérbio }
      - { type: grammar, question: "'com' é (preposição/conjunção/advérbio)", correctAnswer: preposição }
      - { type: grammar, question: "'mas' é (conjunção/preposição/pronome)", correctAnswer: conjunção }
      - { type: grammar, question: "'ela' é (artigo/pronome/numeral)", correctAnswer: pronome }
      - { type: grammar, question: "'uma' é (artigo/pronome/numeral)", correctAnswer: artigo }
      - { type: grammar, question: "'três' é (numeral/artigo/substantivo)", correctAnswer: numeral }
      - { type: grammar, question: "'ai!' é (interjeição/substantivo/verbo)", correctAnswer: interjeição }
target: 10
