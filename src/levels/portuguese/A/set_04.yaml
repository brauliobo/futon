title: Gramática - Classes de Palavras (Parte 2)
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique advérbios, preposições, conjunções, pronomes e artigos.
pages:
  - pageNumber: 1
    title: Advérbios (como, onde, quando)
    description: Advérbios modificam verbos.
    exercises:
      - type: grammar
        question: "'rapidamente' é (advérbio/preposição/conjunção)"
        correctAnswer: advérbio
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: grammar
        question: "'devagar' é (advérbio/verbo/substantivo)"
        correctAnswer: advérbio
        rationale: "Releia a frase em que o personagem é mencionado."
      - type: grammar
        question: "'hoje' é (advérbio/pronome/artigo)"
        correctAnswer: advérbio
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: "'aqui' é (advérbio/preposição/conjunção)"
        correctAnswer: advérbio
        rationale: "Confira o último parágrafo — traz a conclusão."
      - type: grammar
        question: "'bem' é (advérbio/substantivo/adjetivo)"
        correctAnswer: advérbio
        rationale: "Elimine alternativas que contradizem o texto."
      - type: grammar
        question: "'sempre' é (advérbio/conjunção/numeral)"
        correctAnswer: advérbio
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: grammar
        question: "'muito' é (advérbio/artigo/pronome)"
        correctAnswer: advérbio
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: "'agora' é (advérbio/verbo/interjeição)"
        correctAnswer: advérbio
        rationale: "Leia com atenção; a resposta está explícita no trecho."
      - type: grammar
        question: "'longe' é (advérbio/adjetivo/conjunção)"
        correctAnswer: advérbio
        rationale: "Leia com atenção; a resposta está explícita no trecho."
      - type: grammar
        question: "'ontem' é (advérbio/substantivo/verbo)"
        correctAnswer: advérbio
        rationale: "Leia com atenção; a resposta está explícita no trecho."
  - pageNumber: 2
    title: Preposições e Conjunções
    description: Liga palavras e frases.
    exercises:
      - type: grammar
        question: "'de' é (preposição/pronome/conjunção)"
        correctAnswer: preposição
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: grammar
        question: "'para' é (preposição/verbo/advérbio)"
        correctAnswer: preposição
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: grammar
        question: "'com' é (preposição/artigo/conjunção)"
        correctAnswer: preposição
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: "'em' é (preposição/pronome/adjetivo)"
        correctAnswer: preposição
        rationale: "Confira o último parágrafo — traz a conclusão."
      - type: grammar
        question: "'sobre' é (preposição/substantivo/advérbio)"
        correctAnswer: preposição
        rationale: "Verifique sinônimos que a pergunta pode ter usado."
      - type: grammar
        question: "'e' é (conjunção/interjeição/pronome)"
        correctAnswer: conjunção
        rationale: "O objeto responde 'o quê' recebeu a ação."
      - type: grammar
        question: "'mas' é (conjunção/preposição/adjetivo)"
        correctAnswer: conjunção
        rationale: "Conte sílabas em voz alta para separar corretamente."
      - type: grammar
        question: "'ou' é (conjunção/advérbio/verbo)"
        correctAnswer: conjunção
        rationale: "Verifique sinônimos que a pergunta pode ter usado."
      - type: grammar
        question: "'porque' é (conjunção/advérbio/preposição)"
        correctAnswer: conjunção
        rationale: "Observe o verbo de ação para entender o que aconteceu."
      - type: grammar
        question: "'se' é (conjunção/pronome/artigo)"
        correctAnswer: conjunção
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
  - pageNumber: 3
    title: Pronomes, Artigos e Numerais
    description: Palavras que substituem ou acompanham substantivos.
    exercises:
      - type: grammar
        question: "'nós' é (pronome/artigo/numeral)"
        correctAnswer: pronome
        rationale: "Volte ao texto e localize a palavra-chave da pergunta."
      - type: grammar
        question: "'ele' é (pronome/artigo/verbo)"
        correctAnswer: pronome
        rationale: "Letras maiúsculas iniciam frases e nomes próprios."
      - type: grammar
        question: "'meu' é (pronome/preposição/adjetivo)"
        correctAnswer: pronome
        rationale: "Verifique sinônimos que a pergunta pode ter usado."
      - type: grammar
        question: "'este' é (pronome/conjunção/artigo)"
        correctAnswer: pronome
        rationale: "A resposta aparece logo após a conjunção da frase."
      - type: grammar
        question: "'o' é (artigo/advérbio/adjetivo)"
        correctAnswer: artigo
        rationale: "O sujeito da frase responde 'quem pratica a ação'."
      - type: grammar
        question: "'a' é (artigo/preposição/conjunção)"
        correctAnswer: artigo
        rationale: "Preste atenção em números e quantidades mencionados."
      - type: grammar
        question: "'um' é (artigo/pronome/conjunção)"
        correctAnswer: artigo
        rationale: "Elimine alternativas que contradizem o texto."
      - type: grammar
        question: "'dois' é (numeral/interjeição/preposição)"
        correctAnswer: numeral
        rationale: "A resposta aparece logo após a conjunção da frase."
      - type: grammar
        question: "'cinco' é (numeral/substantivo/advérbio)"
        correctAnswer: numeral
        rationale: "Palavras repetidas costumam sinalizar o tema central."
      - type: grammar
        question: "'oba!' é (interjeição/adjetivo/verbo)"
        correctAnswer: interjeição
        rationale: "O sujeito da frase responde 'quem pratica a ação'."
target: 30
