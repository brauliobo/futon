title: Gramática - Classes de Palavras (Parte 2)
level: A
subject: portuguese
difficulty: 2
objectives: [pt.sentence_building]
authorNotes: Conjunto de portuguese/A.
example: "Identifique advérbios, preposições, conjunções, pronomes e artigos."
pages:
  - pageNumber: 1
    title: Advérbios (como, onde, quando)
    description: Advérbios modificam verbos.
    exercises:
      - { type: grammar, question: "'rapidamente' é (advérbio/preposição/conjunção)", correctAnswer: advérbio }
      - { type: grammar, question: "'devagar' é (advérbio/verbo/substantivo)", correctAnswer: advérbio }
      - { type: grammar, question: "'hoje' é (advérbio/pronome/artigo)", correctAnswer: advérbio }
      - { type: grammar, question: "'aqui' é (advérbio/preposição/conjunção)", correctAnswer: advérbio }
      - { type: grammar, question: "'bem' é (advérbio/substantivo/adjetivo)", correctAnswer: advérbio }
      - { type: grammar, question: "'sempre' é (advérbio/conjunção/numeral)", correctAnswer: advérbio }
      - { type: grammar, question: "'muito' é (advérbio/artigo/pronome)", correctAnswer: advérbio }
      - { type: grammar, question: "'agora' é (advérbio/verbo/interjeição)", correctAnswer: advérbio }
      - { type: grammar, question: "'longe' é (advérbio/adjetivo/conjunção)", correctAnswer: advérbio }
      - { type: grammar, question: "'ontem' é (advérbio/substantivo/verbo)", correctAnswer: advérbio }
  - pageNumber: 2
    title: Preposições e Conjunções
    description: Liga palavras e frases.
    exercises:
      - { type: grammar, question: "'de' é (preposição/pronome/conjunção)", correctAnswer: preposição }
      - { type: grammar, question: "'para' é (preposição/verbo/advérbio)", correctAnswer: preposição }
      - { type: grammar, question: "'com' é (preposição/artigo/conjunção)", correctAnswer: preposição }
      - { type: grammar, question: "'em' é (preposição/pronome/adjetivo)", correctAnswer: preposição }
      - { type: grammar, question: "'sobre' é (preposição/substantivo/advérbio)", correctAnswer: preposição }
      - { type: grammar, question: "'e' é (conjunção/interjeição/pronome)", correctAnswer: conjunção }
      - { type: grammar, question: "'mas' é (conjunção/preposição/adjetivo)", correctAnswer: conjunção }
      - { type: grammar, question: "'ou' é (conjunção/advérbio/verbo)", correctAnswer: conjunção }
      - { type: grammar, question: "'porque' é (conjunção/advérbio/preposição)", correctAnswer: conjunção }
      - { type: grammar, question: "'se' é (conjunção/pronome/artigo)", correctAnswer: conjunção }
  - pageNumber: 3
    title: Pronomes, Artigos e Numerais
    description: Palavras que substituem ou acompanham substantivos.
    exercises:
      - { type: grammar, question: "'nós' é (pronome/artigo/numeral)", correctAnswer: pronome }
      - { type: grammar, question: "'ele' é (pronome/artigo/verbo)", correctAnswer: pronome }
      - { type: grammar, question: "'meu' é (pronome/preposição/adjetivo)", correctAnswer: pronome }
      - { type: grammar, question: "'este' é (pronome/conjunção/artigo)", correctAnswer: pronome }
      - { type: grammar, question: "'o' é (artigo/advérbio/adjetivo)", correctAnswer: artigo }
      - { type: grammar, question: "'a' é (artigo/preposição/conjunção)", correctAnswer: artigo }
      - { type: grammar, question: "'um' é (artigo/pronome/conjunção)", correctAnswer: artigo }
      - { type: grammar, question: "'dois' é (numeral/interjeição/preposição)", correctAnswer: numeral }
      - { type: grammar, question: "'cinco' é (numeral/substantivo/advérbio)", correctAnswer: numeral }
      - { type: grammar, question: "'oba!' é (interjeição/adjetivo/verbo)", correctAnswer: interjeição }
target: 30
