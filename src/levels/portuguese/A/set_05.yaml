title: Compreensão e Gramática - Revisão
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Revisão integrada compreensão + gramática."
example: "Misture leitura e gramática básica. Ex.: O protagonista é? → menina."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Texto e Gramática
    description: Responda às perguntas variadas.
    passage: Uma menina foi ao parque numa tarde de sol. Ela levou o seu lanche numa mochila colorida. Lá chegando, correu pelo gramado e brincou bastante. A menina ficou muito feliz com o passeio.
    exercises:
      - type: reading
        question: O protagonista é? (menino/cachorro/menina)
        correctAnswer: menina
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: O local foi? (parque/escola/cinema)
        correctAnswer: parque
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Ela levou? (livro/bola/lanche)
        correctAnswer: lanche
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'menina' é (adjetivo/verbo/substantivo)"
        correctAnswer: substantivo
        rationale: "Substantivo nomeia seres, coisas, lugares ou ideias."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'correu' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Verbo exprime ação, estado ou fenômeno."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'alegre' é (adjetivo/verbo/substantivo)"
        correctAnswer: adjetivo
        rationale: "Adjetivo caracteriza ou qualifica o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'para' é (conjunção/advérbio/preposição)"
        correctAnswer: preposição
        rationale: "Preposição liga palavras estabelecendo relação entre elas."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Como ela se sentiu? (cansada/feliz/triste)
        correctAnswer: feliz
        rationale: "O modo responde 'como' a ação aconteceu."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: O que fez no parque? (dormiu/brincou/estudou)
        correctAnswer: brincou
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'quando' é (conjunção/preposição/advérbio)"
        correctAnswer: advérbio
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
