title: Compreensão e Gramática - Revisão
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Misture leitura e gramática básica.
pages:
  - pageNumber: 1
    title: Texto e Gramática
    description: Responda às perguntas variadas.
    passage: Uma menina foi ao parque numa tarde de sol. Ela levou o seu lanche numa mochila colorida. Lá chegando, correu pelo gramado e brincou bastante. A menina ficou muito feliz com o passeio.
    exercises:
      - type: reading
        question: O protagonista é? (menino/menina/cachorro)
        correctAnswer: menina
        rationale: "Releia a frase em que o personagem é mencionado."
      - type: reading
        question: O local foi? (parque/cinema/escola)
        correctAnswer: parque
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: reading
        question: Ela levou? (lanche/bola/livro)
        correctAnswer: lanche
        rationale: "A resposta correta repete ou retoma termo do texto."
      - type: grammar
        question: "'menina' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Conte sílabas em voz alta para separar corretamente."
      - type: grammar
        question: "'correu' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Conte sílabas em voz alta para separar corretamente."
      - type: grammar
        question: "'alegre' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Leia com atenção; a resposta está explícita no trecho."
      - type: grammar
        question: "'para' é (preposição/conjunção/advérbio)"
        correctAnswer: preposição
        rationale: "Procure pistas no início do parágrafo — ideia principal."
      - type: reading
        question: Como ela se sentiu? (triste/feliz/cansada)
        correctAnswer: feliz
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: reading
        question: O que fez no parque? (brincou/estudou/dormiu)
        correctAnswer: brincou
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: "'quando' é (advérbio/conjunção/preposição)"
        correctAnswer: advérbio
        rationale: "Confira o tempo (quando) indicado por 'ontem' ou 'hoje'."
target: 10
