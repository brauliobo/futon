title: 📚 Compreensão de Texto - Viagem (Parte 2)
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Leia atentamente e escolha a alternativa correta. Ex.: O voo de volta foi? → tranquilo."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Mais Perguntas sobre a Viagem
    description: Continue respondendo sobre a viagem.
    passage: A família adorou a viagem à praia. Todos os dias eles nadavam no mar, que era o que mais gostavam. Ficaram sete dias num hotel confortável e agradável. Na volta, o voo foi tranquilo e chegaram em casa felizes. Trouxeram lembranças para os amigos e tiraram muitas fotos. Recomendariam o lugar a todos e já planejam viajar novamente.
    exercises:
      - type: reading
        question: O que fizeram na praia? (caminharam/nadaram/descansaram)
        correctAnswer: nadaram
        rationale: "O texto diz 'Todos os dias eles nadavam no mar'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Como foi o hotel? (simples/luxuoso/confortável)
        correctAnswer: confortável
        rationale: "O modo responde 'como' a ação aconteceu."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Quantos dias ficaram? (sete/dez/cinco)
        correctAnswer: sete
        rationale: "A quantidade responde 'quanto' ou 'quantos'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: O que mais gostaram? (comida/hotel/mar)
        correctAnswer: mar
        rationale: "O texto diz 'nadavam no mar, que era o que mais gostavam'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Trouxeram lembranças? (sim/algumas/não)
        correctAnswer: sim
        rationale: "Releia o trecho onde o tema é citado para confirmar."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: O voo de volta foi? (cancelado/turbulento/tranquilo)
        correctAnswer: tranquilo
        rationale: "Localize a palavra-chave da pergunta no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Chegaram em casa? (cansados/tristes/felizes)
        correctAnswer: felizes
        rationale: "A resposta aparece de forma direta no parágrafo correspondente."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Guardarão as fotos? (talvez/não/sim)
        correctAnswer: sim
        rationale: "Procure o trecho que responde 'quem', 'o quê', 'onde' ou 'quando'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Recomendariam o local? (não/talvez/sim)
        correctAnswer: sim
        rationale: "Use pistas contextuais próximas à informação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Pretendem viajar novamente? (talvez/sim/não)
        correctAnswer: sim
        rationale: "A informação pedida foi mencionada explicitamente — basta localizá-la."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
