title: Compreensão de Texto - Viagem (Parte 2)
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Leia atentamente e escolha a alternativa correta.
pages:
  - pageNumber: 1
    title: Mais Perguntas sobre a Viagem
    description: Continue respondendo sobre a viagem.
    passage: A família adorou a viagem à praia. Todos os dias eles nadavam no mar, que era o que mais gostavam. Ficaram sete dias num hotel confortável e agradável. Na volta, o voo foi tranquilo e chegaram em casa felizes. Trouxeram lembranças para os amigos e tiraram muitas fotos. Recomendariam o lugar a todos e já planejam viajar novamente.
    exercises:
      - type: reading
        question: O que fizeram na praia? (caminharam/nadaram/descansaram)
        correctAnswer: nadaram
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: reading
        question: Como foi o hotel? (simples/confortável/luxuoso)
        correctAnswer: confortável
        rationale: "O modo responde 'como' a ação aconteceu."
      - type: reading
        question: Quantos dias ficaram? (cinco/sete/dez)
        correctAnswer: sete
        rationale: "A quantidade responde 'quanto' ou 'quantos'."
      - type: reading
        question: O que mais gostaram? (comida/mar/hotel)
        correctAnswer: mar
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: reading
        question: Trouxeram lembranças? (sim/não/algumas)
        correctAnswer: sim
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: reading
        question: O voo de volta foi? (tranquilo/turbulento/cancelado)
        correctAnswer: tranquilo
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: reading
        question: Chegaram em casa? (cansados/felizes/tristes)
        correctAnswer: felizes
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: reading
        question: Guardarão as fotos? (sim/não/talvez)
        correctAnswer: sim
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: reading
        question: Recomendariam o local? (sim/não/talvez)
        correctAnswer: sim
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: reading
        question: Pretendem viajar novamente? (sim/não/talvez)
        correctAnswer: sim
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
target: 10
