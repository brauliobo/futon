title: Gramática - Preposições
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique preposições em frases simples.
pages:
  - pageNumber: 1
    title: Palavras de Ligação
    description: Escolha a preposição correta.
    exercises:
      - type: grammar
        question: O livro está ___ mesa. (na/da/para)
        correctAnswer: na
        rationale: "Elimine alternativas que contradizem o texto."
      - type: grammar
        question: Vou ___ escola. (na/da/para)
        correctAnswer: para
        rationale: "Ponto final indica fim de frase declarativa."
      - type: grammar
        question: Venho ___ casa. (na/da/para)
        correctAnswer: da
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: grammar
        question: O gato subiu ___ árvore. (na/da/para)
        correctAnswer: na
        rationale: "Siga a ordem dos acontecimentos no texto."
      - type: grammar
        question: Caminho ___ parque. (pelo/do/no)
        correctAnswer: pelo
        rationale: "Ponto final indica fim de frase declarativa."
      - type: grammar
        question: Saio ___ trabalho. (pelo/do/no)
        correctAnswer: do
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: Fico ___ parque. (pelo/do/no)
        correctAnswer: no
        rationale: "Releia palavra por palavra — cada detalhe conta."
      - type: grammar
        question: Passo ___ ponte. (pela/da/na)
        correctAnswer: pela
        rationale: "Conte sílabas em voz alta para separar corretamente."
      - type: grammar
        question: Moro ___ cidade. (pela/da/na)
        correctAnswer: na
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: Venho ___ praia. (pela/da/na)
        correctAnswer: da
        rationale: "Leia com atenção; a resposta está explícita no trecho."
target: 10
