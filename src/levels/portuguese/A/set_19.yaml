title: Gramática - Preposições
level: A
subject: portuguese
example: Identifique preposições em frases simples.
pages:
  - pageNumber: 1
    title: Palavras de Ligação
    description: Escolha a preposição correta.
    exercises:
      - { type: grammar, question: ""O livro está ___ mesa. (na/da/para)"", correctAnswer: na }
      - { type: grammar, question: ""Vou ___ escola. (na/da/para)"", correctAnswer: para }
      - { type: grammar, question: ""Venho ___ casa. (na/da/para)"", correctAnswer: da }
      - { type: grammar, question: ""O gato subiu ___ árvore. (na/da/para)"", correctAnswer: na }
      - { type: grammar, question: ""Caminho ___ parque. (pelo/do/no)"", correctAnswer: pelo }
      - { type: grammar, question: ""Saio ___ trabalho. (pelo/do/no)"", correctAnswer: do }
      - { type: grammar, question: ""Fico ___ parque. (pelo/do/no)"", correctAnswer: no }
      - { type: grammar, question: ""Passo ___ ponte. (pela/da/na)"", correctAnswer: pela }
      - { type: grammar, question: ""Moro ___ cidade. (pela/da/na)"", correctAnswer: na }
      - { type: grammar, question: ""Venho ___ praia. (pela/da/na)"", correctAnswer: da }
target: 10
