title: Gramática - Preposições
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Preposições (a, de, em, para…). Conectam termos da frase."
example: "Identifique preposições em frases simples. Ex.: O livro está ___ mesa. → na."
pages:
  - pageNumber: 1
    title: Palavras de Ligação
    description: Escolha a preposição correta.
    exercises:
      - type: grammar
        question: O livro está ___ mesa. (na/da/para)
        correctAnswer: na
        rationale: "A forma correta é 'na'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Vou ___ escola. (na/da/para)
        correctAnswer: para
        rationale: "O verbo concorda com o sujeito: 'para'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Venho ___ casa. (na/da/para)
        correctAnswer: da
        rationale: "Preposições essenciais: a, ante, após, até, com, contra, de, desde, em, entre, para, por, sem, sob, sobre."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O gato subiu ___ árvore. (na/da/para)
        correctAnswer: na
        rationale: "Siga a ordem dos acontecimentos no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Caminho ___ parque. (pelo/do/no)
        correctAnswer: pelo
        rationale: "Preposição liga palavras estabelecendo relação de sentido."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Saio ___ trabalho. (pelo/do/no)
        correctAnswer: do
        rationale: "'De' indica origem, posse ou matéria (casa de madeira)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Fico ___ parque. (pelo/do/no)
        correctAnswer: no
        rationale: "'Em' indica lugar ou tempo (em casa, em 2025)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Passo ___ ponte. (pela/da/na)
        correctAnswer: pela
        rationale: "'Para' indica destino ou finalidade (ir para casa)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Moro ___ cidade. (pela/da/na)
        correctAnswer: na
        rationale: "'Com' indica companhia ou instrumento (com você, com lápis)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: Venho ___ praia. (pela/da/na)
        correctAnswer: da
        rationale: "'Por' indica causa, meio ou passagem (passar por ali)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
