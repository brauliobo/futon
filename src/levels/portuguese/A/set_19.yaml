title: Gramática - Preposições
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique preposições em frases simples.
pages:
  - pageNumber: 1
    title: Palavras de Ligação
    description: Escolha a preposição correta.
    exercises:
      - type: grammar
        question: O livro está ___ mesa. (na/da/para)
        correctAnswer: na
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Vou ___ escola. (na/da/para)
        correctAnswer: para
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Venho ___ casa. (na/da/para)
        correctAnswer: da
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: O gato subiu ___ árvore. (na/da/para)
        correctAnswer: na
        rationale: "Siga a ordem dos acontecimentos no texto."
      - type: grammar
        question: Caminho ___ parque. (pelo/do/no)
        correctAnswer: pelo
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Saio ___ trabalho. (pelo/do/no)
        correctAnswer: do
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Fico ___ parque. (pelo/do/no)
        correctAnswer: no
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Passo ___ ponte. (pela/da/na)
        correctAnswer: pela
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Moro ___ cidade. (pela/da/na)
        correctAnswer: na
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
      - type: grammar
        question: Venho ___ praia. (pela/da/na)
        correctAnswer: da
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
target: 10
