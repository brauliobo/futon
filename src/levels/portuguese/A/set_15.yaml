title: Gramática - Adjetivos
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique características e qualidades.
pages:
  - pageNumber: 1
    title: Qualidades e Características
    description: Escolha o adjetivo correto.
    exercises:
      - type: grammar
        question: O elefante é ___. (grande/pequeno/médio)
        correctAnswer: grande
        rationale: "Releia palavra por palavra — cada detalhe conta."
      - type: grammar
        question: O rato é ___. (grande/pequeno/médio)
        correctAnswer: pequeno
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: grammar
        question: O gelo está ___. (quente/frio/morno)
        correctAnswer: frio
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: grammar
        question: O fogo está ___. (quente/frio/morno)
        correctAnswer: quente
        rationale: "Letras maiúsculas iniciam frases e nomes próprios."
      - type: grammar
        question: O açúcar é ___. (doce/salgado/azedo)
        correctAnswer: doce
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: O limão é ___. (doce/salgado/azedo)
        correctAnswer: azedo
        rationale: "Observe o verbo de ação para entender o que aconteceu."
      - type: grammar
        question: A pedra é ___. (macia/dura/líquida)
        correctAnswer: dura
        rationale: "O objeto responde 'o quê' recebeu a ação."
      - type: grammar
        question: O algodão é ___. (macio/duro/líquido)
        correctAnswer: macio
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: grammar
        question: A tartaruga é ___. (rápida/lenta/média)
        correctAnswer: lenta
        rationale: "Procure pistas no início do parágrafo — ideia principal."
      - type: grammar
        question: O coelho é ___. (lento/rápido/médio)
        correctAnswer: rápido
        rationale: "Releia palavra por palavra — cada detalhe conta."
target: 10
