title: Gramática - Adjetivos
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Adjetivos — concordância em gênero e número com o substantivo."
example: "Identifique características e qualidades. Ex.: O elefante é ___. → grande."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Qualidades e Características
    description: Escolha o adjetivo correto.
    exercises:
      - type: grammar
        question: O elefante é ___. (médio/grande/pequeno)
        correctAnswer: grande
        rationale: "Observe as opções e escolha a que responde \"O elefante é ___.\": 'grande'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O rato é ___. (pequeno/grande/médio)
        correctAnswer: pequeno
        rationale: "Observe as opções e escolha a que responde \"O rato é ___.\": 'pequeno'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O gelo está ___. (quente/frio/morno)
        correctAnswer: frio
        rationale: "Adjetivo qualifica ou caracteriza o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O fogo está ___. (morno/frio/quente)
        correctAnswer: quente
        rationale: "Adjetivo concorda em gênero e número com o substantivo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O açúcar é ___. (doce/salgado/azedo)
        correctAnswer: doce
        rationale: "Adjetivos pátrios indicam origem (brasileiro, paulista)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O limão é ___. (azedo/doce/salgado)
        correctAnswer: azedo
        rationale: "Locução adjetiva é expressão com valor de adjetivo (de ouro = áureo)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: A pedra é ___. (dura/macia/líquida)
        correctAnswer: dura
        rationale: "Grau comparativo: mais/menos ... (do) que."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O algodão é ___. (duro/macio/líquido)
        correctAnswer: macio
        rationale: "Grau superlativo absoluto: muito + adjetivo, ou sufixo -íssimo."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: A tartaruga é ___. (média/lenta/rápida)
        correctAnswer: lenta
        rationale: "Adjetivo posposto costuma destacar característica objetiva."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: O coelho é ___. (rápido/médio/lento)
        correctAnswer: rápido
        rationale: "Adjetivo anteposto pode ter valor subjetivo/afetivo."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
