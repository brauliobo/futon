title: Gramática - Adjetivos
level: A
subject: portuguese
example: Identifique características e qualidades.
pages:
  - pageNumber: 1
    title: Qualidades e Características
    description: Escolha o adjetivo correto.
    exercises:
      - type: grammar
        question: "O elefante é ___. (grande/pequeno/médio)"
        correctAnswer: grande
      - type: grammar
        question: "O rato é ___. (grande/pequeno/médio)"
        correctAnswer: pequeno
      - type: grammar
        question: "O gelo está ___. (quente/frio/morno)"
        correctAnswer: frio
      - type: grammar
        question: "O fogo está ___. (quente/frio/morno)"
        correctAnswer: quente
      - type: grammar
        question: "O açúcar é ___. (doce/salgado/azedo)"
        correctAnswer: doce
      - type: grammar
        question: "O limão é ___. (doce/salgado/azedo)"
        correctAnswer: azedo
      - type: grammar
        question: "A pedra é ___. (macia/dura/líquida)"
        correctAnswer: dura
      - type: grammar
        question: "O algodão é ___. (macio/duro/líquido)"
        correctAnswer: macio
      - type: grammar
        question: "A tartaruga é ___. (rápida/lenta/média)"
        correctAnswer: lenta
      - type: grammar
        question: "O coelho é ___. (lento/rápido/médio)"
        correctAnswer: rápido
target: 10
