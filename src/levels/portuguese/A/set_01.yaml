title: Compreensão de Texto - Viagem (Parte 1)
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Leia atentamente e escolha a alternativa correta.
pages:
  - pageNumber: 1
    title: Texto sobre Viagem
    description: Responda às perguntas sobre a viagem de avião.
    passage: Uma família viajou de avião para a praia. Eles ficaram por uma semana num hotel confortável. O clima estava ensolarado todos os dias. Nadaram no mar, brincaram na areia e comeram frutos do mar deliciosos. No último dia, voltaram para casa de avião. A viagem foi muito divertida e todos querem voltar em breve.
    exercises:
      - type: reading
        question: O texto fala sobre uma viagem de? (carro/avião/navio)
        correctAnswer: avião
        rationale: "Observe o verbo de ação para entender o que aconteceu."
      - type: reading
        question: O destino foi? (praia/campo/cidade)
        correctAnswer: praia
        rationale: "Confira o tempo (quando) indicado por 'ontem' ou 'hoje'."
      - type: reading
        question: Quem viajou? (família/amigos/sozinha)
        correctAnswer: família
        rationale: "O sujeito da frase responde 'quem pratica a ação'."
      - type: reading
        question: Quanto tempo durou? (um dia/uma semana/um mês)
        correctAnswer: uma semana
        rationale: "Confira o tempo (quando) indicado por 'ontem' ou 'hoje'."
      - type: reading
        question: O clima estava? (chuvoso/ensolarado/nublado)
        correctAnswer: ensolarado
        rationale: "Leia com atenção; a resposta está explícita no trecho."
      - type: reading
        question: Nadaram no? (rio/mar/piscina)
        correctAnswer: mar
        rationale: "Releia a frase em que o personagem é mencionado."
      - type: reading
        question: Comeram? (frutos do mar/massa/sopa)
        correctAnswer: frutos do mar
        rationale: "Elimine alternativas que contradizem o texto."
      - type: reading
        question: Voltaram de? (ônibus/avião/trem)
        correctAnswer: avião
        rationale: "Procure pistas no início do parágrafo — ideia principal."
      - type: reading
        question: A viagem foi? (cansativa/divertida/assustadora)
        correctAnswer: divertida
        rationale: "Releia palavra por palavra — cada detalhe conta."
      - type: reading
        question: Querem voltar? (sim/não/talvez)
        correctAnswer: sim
        rationale: "Preste atenção em números e quantidades mencionados."
target: 10
