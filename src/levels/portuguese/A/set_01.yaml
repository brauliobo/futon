title: 📚 Compreensão de Texto - Viagem (Parte 1)
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Leia atentamente e escolha a alternativa correta. Ex.: Nadaram no? → mar."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Texto sobre Viagem
    description: Responda às perguntas sobre a viagem de avião.
    passage: Uma família viajou de avião para a praia. Eles ficaram por uma semana num hotel confortável. O clima estava ensolarado todos os dias. Nadaram no mar, brincaram na areia e comeram frutos do mar deliciosos. No último dia, voltaram para casa de avião. A viagem foi muito divertida e todos querem voltar em breve.
    exercises:
      - type: reading
        question: O texto fala sobre uma viagem de? (avião/carro/navio)
        correctAnswer: avião
        rationale: "O texto diz 'viajou de avião para a praia'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: O destino foi? (cidade/campo/praia)
        correctAnswer: praia
        rationale: "O texto diz 'para a praia' — o destino da viagem."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Quem viajou? (sozinha/amigos/família)
        correctAnswer: família
        rationale: "O sujeito responde 'quem pratica a ação'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Quanto tempo durou? (uma semana/um dia/um mês)
        correctAnswer: uma semana
        rationale: "A quantidade responde 'quanto' ou 'quantos'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: O clima estava? (nublado/chuvoso/ensolarado)
        correctAnswer: ensolarado
        rationale: "Releia o trecho onde o tema é citado para confirmar."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Nadaram no? (rio/mar/piscina)
        correctAnswer: mar
        rationale: "Localize a palavra-chave da pergunta no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Comeram? (sopa/frutos do mar/massa)
        correctAnswer: frutos do mar
        rationale: "A resposta aparece de forma direta no parágrafo correspondente."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Voltaram de? (trem/avião/ônibus)
        correctAnswer: avião
        rationale: "Procure o trecho que responde 'quem', 'o quê', 'onde' ou 'quando'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: A viagem foi? (divertida/cansativa/assustadora)
        correctAnswer: divertida
        rationale: "Use pistas contextuais próximas à informação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Querem voltar? (não/talvez/sim)
        correctAnswer: sim
        rationale: "A informação pedida foi mencionada explicitamente — basta localizá-la."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
