  - pageNumber: 4
    title: Revisão de Classes
    description: Identifique classes variadas de palavras.
    exercises:
      - type: grammar
        question: "'rapidamente' é (advérbio/preposição/conjunção)"
        correctAnswer: advérbio
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
      - type: grammar
        question: "'de' é (preposição/pronome/conjunção)"
        correctAnswer: preposição
        rationale: "Preposição liga palavras estabelecendo relação entre elas."
      - type: grammar
        question: "'e' é (conjunção/interjeição/pronome)"
        correctAnswer: conjunção
        rationale: "Conjunção liga orações ou termos de mesma função."
      - type: grammar
        question: "'nós' é (artigo/pronome/numeral)"
        correctAnswer: pronome
        rationale: "Pronome substitui ou acompanha o substantivo."
      - type: grammar
        question: "'o' é (artigo/advérbio/adjetivo)"
        correctAnswer: artigo
        rationale: "Artigo determina o substantivo em gênero e número."
      - type: grammar
        question: "'dois' é (numeral/interjeição/preposição)"
        correctAnswer: numeral
        rationale: "Numeral indica quantidade ou ordem."
      - type: grammar
        question: "'oba!' é (interjeição/adjetivo/verbo)"
        correctAnswer: interjeição
        rationale: "Interjeição expressa emoção ou reação súbita."
      - type: grammar
        question: "'sempre' é (advérbio/substantivo/verbo)"
        correctAnswer: advérbio
        rationale: "Advérbio modifica verbo, adjetivo ou outro advérbio."
      - type: grammar
        question: "'ele' é (pronome/artigo/conjunção)"
        correctAnswer: pronome
        rationale: "Pronome substitui ou acompanha o substantivo."
      - type: grammar
        question: "'mas' é (conjunção/adjetivo/preposição)"
        correctAnswer: conjunção
        rationale: "Conjunção liga orações ou termos de mesma função."
target: 40
