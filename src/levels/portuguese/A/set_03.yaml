title: Gramática - Classes de Palavras (Parte 1)
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Classes gramaticais — substantivo, verbo, adjetivo, pronome, artigo. Identifique função na frase."
example: "Identifique classes de palavras — substantivos, verbos, adjetivos e mais. Ex.: 'casa' é → substantivo."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Substantivos (nomes)
    description: Identifique os substantivos — palavras que dão nome.
    exercises:
      - type: grammar
        question: "'casa' é (substantivo/adjetivo/verbo)"
        correctAnswer: substantivo
        rationale: "Substantivo nomeia seres, coisas, lugares ou ideias."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'cadeira' é (verbo/substantivo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Substantivo nomeia seres, coisas, lugares ou ideias."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'livro' é (substantivo/adjetivo/verbo)"
        correctAnswer: substantivo
        rationale: "Artigo antecede o substantivo e define gênero/número (o, a, um, uma)."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'menino' é (substantivo/adjetivo/verbo)"
        correctAnswer: substantivo
        rationale: "Adjetivo qualifica o substantivo (bonito, grande, azul)."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'amor' é (adjetivo/substantivo/verbo)"
        correctAnswer: substantivo
        rationale: "Pronome substitui ou acompanha o substantivo (eu, ele, meu)."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'árvore' é (adjetivo/substantivo/verbo)"
        correctAnswer: substantivo
        rationale: "Numeral indica quantidade ou ordem (dois, segundo)."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'sol' é (verbo/substantivo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Substantivo próprio nomeia ser específico (Maria, Brasil)."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'professor' é (verbo/adjetivo/substantivo)"
        correctAnswer: substantivo
        rationale: "Substantivo comum nomeia classe geral (cidade, cachorro)."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'bola' é (adjetivo/verbo/substantivo)"
        correctAnswer: substantivo
        rationale: "Substantivo nomeia seres, coisas, lugares ou ideias."
        difficulty: 1
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'cidade' é (verbo/substantivo/adjetivo)"
