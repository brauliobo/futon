title: Gramática - Classes de Palavras (Parte 1)
level: A
subject: portuguese
difficulty: 2
objectives: [pt.sentence_building]
authorNotes: Conjunto de portuguese/A.
example: "Identifique classes de palavras — substantivos, verbos, adjetivos e mais."
pages:
  - pageNumber: 1
    title: Substantivos (nomes)
    description: Identifique os substantivos — palavras que dão nome.
    exercises:
      - { type: grammar, question: "'casa' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'cadeira' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'livro' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'menino' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'amor' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'árvore' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'sol' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'professor' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'bola' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
      - { type: grammar, question: "'cidade' é (substantivo/verbo/adjetivo)", correctAnswer: substantivo }
  - pageNumber: 2
    title: Verbos (ações)
    description: Identifique verbos — palavras de ação ou estado.
    exercises:
      - { type: grammar, question: "'correr' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'comer' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'dormir' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'ler' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'cantar' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'brincar' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'escrever' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'pensar' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'voar' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
      - { type: grammar, question: "'nadar' é (substantivo/verbo/adjetivo)", correctAnswer: verbo }
  - pageNumber: 3
    title: Adjetivos (qualidades)
    description: Identifique adjetivos — palavras que descrevem.
    exercises:
      - { type: grammar, question: "'bonito' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'grande' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'feliz' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'verde' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'pequeno' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'doce' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'rápido' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'azul' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'alto' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
      - { type: grammar, question: "'cansado' é (substantivo/verbo/adjetivo)", correctAnswer: adjetivo }
  - pageNumber: 4
    title: Revisão de Classes
    description: Identifique classes variadas de palavras.
    exercises:
      - { type: grammar, question: "'rapidamente' é (advérbio/preposição/conjunção)", correctAnswer: advérbio }
      - { type: grammar, question: "'de' é (preposição/pronome/conjunção)", correctAnswer: preposição }
      - { type: grammar, question: "'e' é (conjunção/interjeição/pronome)", correctAnswer: conjunção }
      - { type: grammar, question: "'nós' é (artigo/pronome/numeral)", correctAnswer: pronome }
      - { type: grammar, question: "'o' é (artigo/advérbio/adjetivo)", correctAnswer: artigo }
      - { type: grammar, question: "'dois' é (numeral/interjeição/preposição)", correctAnswer: numeral }
      - { type: grammar, question: "'oba!' é (interjeição/adjetivo/verbo)", correctAnswer: interjeição }
      - { type: grammar, question: "'sempre' é (advérbio/substantivo/verbo)", correctAnswer: advérbio }
      - { type: grammar, question: "'ele' é (pronome/artigo/conjunção)", correctAnswer: pronome }
      - { type: grammar, question: "'mas' é (conjunção/adjetivo/preposição)", correctAnswer: conjunção }
target: 40
