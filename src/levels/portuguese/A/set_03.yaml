        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'oba!' é (interjeição/verbo/adjetivo)"
        correctAnswer: interjeição
        rationale: "Interjeição expressa emoção ou reação súbita."
        difficulty: 3
        objectives: [pt.sentence_building]
      - type: grammar
