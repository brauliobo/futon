title: Gramática - Classes de Palavras (Parte 1)
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique classes de palavras — substantivos, verbos, adjetivos e mais.
pages:
  - pageNumber: 1
    title: Substantivos (nomes)
    description: Identifique os substantivos — palavras que dão nome.
    exercises:
      - type: grammar
        question: "'casa' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Palavras repetidas costumam sinalizar o tema central."
      - type: grammar
        question: "'cadeira' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: grammar
        question: "'livro' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: grammar
        question: "'menino' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "A resposta correta repete ou retoma termo do texto."
      - type: grammar
        question: "'amor' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: grammar
        question: "'árvore' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Verifique sinônimos que a pergunta pode ter usado."
      - type: grammar
        question: "'sol' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Leia com atenção; a resposta está explícita no trecho."
      - type: grammar
        question: "'professor' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: grammar
        question: "'bola' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Leia com atenção; a resposta está explícita no trecho."
      - type: grammar
        question: "'cidade' é (substantivo/verbo/adjetivo)"
        correctAnswer: substantivo
        rationale: "Ponto final indica fim de frase declarativa."
  - pageNumber: 2
    title: Verbos (ações)
    description: Identifique verbos — palavras de ação ou estado.
    exercises:
      - type: grammar
        question: "'correr' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Procure pistas no início do parágrafo — ideia principal."
      - type: grammar
        question: "'comer' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Palavras repetidas costumam sinalizar o tema central."
      - type: grammar
        question: "'dormir' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: "'ler' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: grammar
        question: "'cantar' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Associe a pergunta ao trecho que traz o mesmo vocabulário."
      - type: grammar
        question: "'brincar' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: grammar
        question: "'escrever' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: grammar
        question: "'pensar' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Confira o último parágrafo — traz a conclusão."
      - type: grammar
        question: "'voar' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Leia com atenção; a resposta está explícita no trecho."
      - type: grammar
        question: "'nadar' é (substantivo/verbo/adjetivo)"
        correctAnswer: verbo
        rationale: "Verifique sinônimos que a pergunta pode ter usado."
  - pageNumber: 3
    title: Adjetivos (qualidades)
    description: Identifique adjetivos — palavras que descrevem.
    exercises:
      - type: grammar
        question: "'bonito' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Observe o verbo de ação para entender o que aconteceu."
      - type: grammar
        question: "'grande' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: grammar
        question: "'feliz' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Confira o tempo (quando) indicado por 'ontem' ou 'hoje'."
      - type: grammar
        question: "'verde' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Ponto final indica fim de frase declarativa."
      - type: grammar
        question: "'pequeno' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Verifique sinônimos que a pergunta pode ter usado."
      - type: grammar
        question: "'doce' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "A resposta aparece logo após a conjunção da frase."
      - type: grammar
        question: "'rápido' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Observe o verbo de ação para entender o que aconteceu."
      - type: grammar
        question: "'azul' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Releia a frase em que o personagem é mencionado."
      - type: grammar
        question: "'alto' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: grammar
        question: "'cansado' é (substantivo/verbo/adjetivo)"
        correctAnswer: adjetivo
        rationale: "Conte sílabas em voz alta para separar corretamente."
  - pageNumber: 4
    title: Revisão de Classes
    description: Identifique classes variadas de palavras.
    exercises:
      - type: grammar
        question: "'rapidamente' é (advérbio/preposição/conjunção)"
        correctAnswer: advérbio
        rationale: "Releia a frase em que o personagem é mencionado."
      - type: grammar
        question: "'de' é (preposição/pronome/conjunção)"
        correctAnswer: preposição
        rationale: "O sujeito da frase responde 'quem pratica a ação'."
      - type: grammar
        question: "'e' é (conjunção/interjeição/pronome)"
        correctAnswer: conjunção
        rationale: "Confira o último parágrafo — traz a conclusão."
      - type: grammar
        question: "'nós' é (artigo/pronome/numeral)"
        correctAnswer: pronome
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: "'o' é (artigo/advérbio/adjetivo)"
        correctAnswer: artigo
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: "'dois' é (numeral/interjeição/preposição)"
        correctAnswer: numeral
        rationale: "Palavras repetidas costumam sinalizar o tema central."
      - type: grammar
        question: "'oba!' é (interjeição/adjetivo/verbo)"
        correctAnswer: interjeição
        rationale: "O objeto responde 'o quê' recebeu a ação."
      - type: grammar
        question: "'sempre' é (advérbio/substantivo/verbo)"
        correctAnswer: advérbio
        rationale: "A resposta aparece logo após a conjunção da frase."
      - type: grammar
        question: "'ele' é (pronome/artigo/conjunção)"
        correctAnswer: pronome
        rationale: "Ponto final indica fim de frase declarativa."
      - type: grammar
        question: "'mas' é (conjunção/adjetivo/preposição)"
        correctAnswer: conjunção
        rationale: "A resposta correta repete ou retoma termo do texto."
target: 40
