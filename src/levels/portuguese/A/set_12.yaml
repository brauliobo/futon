title: Compreensão de Texto - O Parque
level: A
subject: portuguese
example: Leia sobre um passeio no parque.
pages:
  - pageNumber: 1
    title: Um Dia no Parque
    description: Responda sobre o passeio.
    passage: "No domingo, Pedro foi ao parque com sua família. Levaram sanduíches para comer na grama. Jogaram futebol e depois sentaram num banco para descansar. No lago, viram um pato nadando. O dia estava ensolarado e agradável. Voltaram para casa tarde, mas todos estavam alegres. Pedro quer voltar ao parque em breve."
    exercises:
      - { type: reading, question: "Que dia Pedro foi ao parque? (sábado/domingo/segunda)", correctAnswer: domingo }
      - { type: reading, question: "Com quem ele foi? (amigos/família/sozinho)", correctAnswer: família }
      - { type: reading, question: "O que levaram para comer? (sanduíche/pizza/frutas)", correctAnswer: sanduíche }
      - { type: reading, question: "Que brincadeira fizeram? (pique-esconde/futebol/pipa)", correctAnswer: futebol }
      - { type: reading, question: "Onde sentaram para descansar? (banco/grama/pedra)", correctAnswer: banco }
      - { type: reading, question: "Que animal viram no lago? (pato/peixe/tartaruga)", correctAnswer: pato }
      - { type: reading, question: "Como estava o tempo? (chuvoso/ensolarado/nublado)", correctAnswer: ensolarado }
      - { type: reading, question: "A que horas voltaram? (tarde/noite/meio-dia)", correctAnswer: tarde }
      - { type: reading, question: "Como se sentiram? (cansados/alegres/tristes)", correctAnswer: alegres }
      - { type: reading, question: "Querem voltar? (sim/não/talvez)", correctAnswer: sim }
target: 10
