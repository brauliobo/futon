title: Compreensão de Texto - O Parque
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Leia sobre um passeio no parque.
pages:
  - pageNumber: 1
    title: Um Dia no Parque
    description: Responda sobre o passeio.
    passage: No domingo, Pedro foi ao parque com sua família. Levaram sanduíches para comer na grama. Jogaram futebol e depois sentaram num banco para descansar. No lago, viram um pato nadando. O dia estava ensolarado e agradável. Voltaram para casa tarde, mas todos estavam alegres. Pedro quer voltar ao parque em breve.
    exercises:
      - type: reading
        question: Que dia Pedro foi ao parque? (sábado/domingo/segunda)
        correctAnswer: domingo
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: reading
        question: Com quem ele foi? (amigos/família/sozinho)
        correctAnswer: família
        rationale: "O sujeito da frase responde 'quem pratica a ação'."
      - type: reading
        question: O que levaram para comer? (sanduíche/pizza/frutas)
        correctAnswer: sanduíche
        rationale: "Conte sílabas em voz alta para separar corretamente."
      - type: reading
        question: Que brincadeira fizeram? (pique-esconde/futebol/pipa)
        correctAnswer: futebol
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: reading
        question: Onde sentaram para descansar? (banco/grama/pedra)
        correctAnswer: banco
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: reading
        question: Que animal viram no lago? (pato/peixe/tartaruga)
        correctAnswer: pato
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: reading
        question: Como estava o tempo? (chuvoso/ensolarado/nublado)
        correctAnswer: ensolarado
        rationale: "Confira o tempo (quando) indicado por 'ontem' ou 'hoje'."
      - type: reading
        question: A que horas voltaram? (tarde/noite/meio-dia)
        correctAnswer: tarde
        rationale: "Procure pistas no início do parágrafo — ideia principal."
      - type: reading
        question: Como se sentiram? (cansados/alegres/tristes)
        correctAnswer: alegres
        rationale: "Elimine alternativas que contradizem o texto."
      - type: reading
        question: Querem voltar? (sim/não/talvez)
        correctAnswer: sim
        rationale: "O sujeito da frase responde 'quem pratica a ação'."
target: 10
