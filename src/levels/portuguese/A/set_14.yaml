title: Compreensão de Texto - As Cores
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Leia sobre cores e objetos coloridos. Ex.: De que cor é o sol? → amarelo."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Mundo Colorido
    description: Responda sobre as cores.
    passage: O mundo é cheio de cores! O sol brilha amarelo no céu azul. A grama é verde e a neve é branca. O sangue é vermelho e a noite é preta. Quando misturamos azul e amarelo, obtemos verde. Misturando vermelho e azul, obtemos roxo. As rosas clássicas são vermelhas e a cor branca representa a paz.
    exercises:
      - type: reading
        question: De que cor é o sol? (amarelo/azul/verde)
        correctAnswer: amarelo
        rationale: "A cor mencionada aparece explicitamente no trecho."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: De que cor é o céu? (amarelo/azul/verde)
        correctAnswer: azul
        rationale: "A cor mencionada aparece explicitamente no trecho."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: De que cor é a grama? (amarelo/azul/verde)
        correctAnswer: verde
        rationale: "Releia o trecho onde o tema é citado para confirmar."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: De que cor é a neve? (branca/preta/vermelha)
        correctAnswer: branca
        rationale: "Localize a palavra-chave da pergunta no texto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: De que cor é o sangue? (branco/preto/vermelho)
        correctAnswer: vermelho
        rationale: "A resposta aparece de forma direta no parágrafo correspondente."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: De que cor é a noite? (branca/preta/amarela)
        correctAnswer: preta
        rationale: "Procure o trecho que responde 'quem', 'o quê', 'onde' ou 'quando'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que cor mistura azul e amarelo? (roxo/verde/laranja)
        correctAnswer: verde
        rationale: "Use pistas contextuais próximas à informação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que cor mistura vermelho e azul? (verde/roxo/rosa)
        correctAnswer: roxo
        rationale: "A informação pedida foi mencionada explicitamente — basta localizá-la."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: De que cor são as rosas clássicas? (azul/vermelha/preta)
        correctAnswer: vermelha
        rationale: "Volte ao texto e sublinhe a frase que contém a resposta."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que cor representa a paz? (vermelho/branco/preto)
        correctAnswer: branco
        rationale: "Compare as alternativas com o que o texto afirma."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
