title: Compreensão de Texto - Na Escola
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Compreensão de texto curto. Localize resposta no texto antes de inferir."
example: "Leia atentamente e escolha a alternativa correta. Ex.: Que brincadeira prefere? → pular corda."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: História da Escola
    description: Responda sobre o dia na escola.
    passage: Maria estuda na segunda série. Ela vai para a escola a pé todos os dias. A matéria favorita dela é português. Na sala, ela senta ao lado da Ana, sua melhor amiga. No recreio, come um sanduíche e depois brinca de pular corda. Maria tem um gato em casa e sua cor favorita é rosa. Ela gosta muito de estudar.
    exercises:
      - type: reading
        question: Onde Maria estuda? (escola/casa/biblioteca)
        correctAnswer: escola
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Em que série ela está? (terceira/segunda/primeira)
        correctAnswer: segunda
        rationale: "Com 'ele/ela' o verbo vai na 3ª pessoa do singular."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Qual matéria prefere? (matemática/português/ciências)
        correctAnswer: português
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Com quem senta na sala? (Ana/João/Pedro)
        correctAnswer: Ana
        rationale: "O sujeito responde 'quem pratica a ação'."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: O que come no recreio? (biscoito/fruta/sanduíche)
        correctAnswer: sanduíche
        rationale: "O alimento está mencionado no texto — localize o trecho."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que brincadeira prefere? (pular corda/esconde-esconde/bola)
        correctAnswer: pular corda
        rationale: "O lugar responde 'onde' ocorreu a ação."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Como vai para escola? (a pé/carro/ônibus)
        correctAnswer: a pé
        rationale: "Pergunta pede ponto de interrogação (?)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Qual é sua cor favorita? (azul/verde/rosa)
        correctAnswer: rosa
        rationale: "A cor mencionada aparece explicitamente no trecho."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Que animal tem em casa? (pássaro/cachorro/gato)
        correctAnswer: gato
        rationale: "A resposta está explícita no texto — localize o trecho mencionado."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: reading
        question: Gosta de estudar? (não/às vezes/sim)
        correctAnswer: sim
        rationale: "Volte ao texto e localize a palavra-chave da pergunta."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
