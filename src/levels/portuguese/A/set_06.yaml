title: Compreensão de Texto - Na Escola
level: A
subject: portuguese
difficulty: 2
objectives: [pt.sentence_building]
authorNotes: Conjunto de portuguese/A.
example: Leia atentamente e escolha a alternativa correta.
pages:
  - pageNumber: 1
    title: História da Escola
    description: Responda sobre o dia na escola.
    passage: "Maria estuda na segunda série. Ela vai para a escola a pé todos os dias. A matéria favorita dela é português. Na sala, ela senta ao lado da Ana, sua melhor amiga. No recreio, come um sanduíche e depois brinca de pular corda. Maria tem um gato em casa e sua cor favorita é rosa. Ela gosta muito de estudar."
    exercises:
      - { type: reading, question: "Onde Maria estuda? (escola/casa/biblioteca)", correctAnswer: escola }
      - { type: reading, question: "Em que série ela está? (primeira/segunda/terceira)", correctAnswer: segunda }
      - { type: reading, question: "Qual matéria prefere? (matemática/português/ciências)", correctAnswer: português }
      - { type: reading, question: "Com quem senta na sala? (Ana/João/Pedro)", correctAnswer: Ana }
      - { type: reading, question: "O que come no recreio? (sanduíche/fruta/biscoito)", correctAnswer: sanduíche }
      - { type: reading, question: "Que brincadeira prefere? (pular corda/bola/esconde-esconde)", correctAnswer: pular corda }
      - { type: reading, question: "Como vai para escola? (a pé/ônibus/carro)", correctAnswer: a pé }
      - { type: reading, question: "Qual é sua cor favorita? (azul/rosa/verde)", correctAnswer: rosa }
      - { type: reading, question: "Que animal tem em casa? (gato/cachorro/pássaro)", correctAnswer: gato }
      - { type: reading, question: "Gosta de estudar? (sim/não/às vezes)", correctAnswer: sim }
target: 10
