title: Gramática - Masculino e Feminino
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Masculino vs feminino. Regra geral: −o/−a, mas muitas exceções."
example: "Identifique o gênero das palavras. Ex.: 'menino' é → masculino."
pages:
  - pageNumber: 1
    title: Gênero das Palavras
    description: Escolha se a palavra é masculina ou feminina.
    exercises:
      - type: grammar
        question: "'menino' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Feminino muitas vezes termina em -a; masculino em -o."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'menina' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Feminino muitas vezes termina em -a; masculino em -o."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'casa' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Feminino normalmente termina em -a; masculino em -o (menino/menina)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'carro' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Alguns substantivos mudam completamente (homem/mulher)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'flor' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Substantivos em -ão fazem feminino em -ã, -oa ou -ona (irmão/irmã)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'livro' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Seres vivos geralmente têm par masculino/feminino distinto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'escola' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Objetos inanimados têm gênero fixo (a mesa, o livro)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'gato' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Feminino em -esa/-essa (príncipe/princesa; conde/condessa)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'mesa' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Feminino em -isa (poeta/poetisa; sacerdote/sacerdotisa)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: "'sol' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Substantivos comuns de dois gêneros (o/a estudante)."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
