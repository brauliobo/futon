title: Gramática - Masculino e Feminino
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique o gênero das palavras.
pages:
  - pageNumber: 1
    title: Gênero das Palavras
    description: Escolha se a palavra é masculina ou feminina.
    exercises:
      - type: grammar
        question: "'menino' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: grammar
        question: "'menina' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Preste atenção em números e quantidades mencionados."
      - type: grammar
        question: "'casa' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "O objeto responde 'o quê' recebeu a ação."
      - type: grammar
        question: "'carro' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "A resposta correta repete ou retoma termo do texto."
      - type: grammar
        question: "'flor' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: grammar
        question: "'livro' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Identifique o substantivo que responde 'o quê' ou 'quem'."
      - type: grammar
        question: "'escola' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "O sujeito da frase responde 'quem pratica a ação'."
      - type: grammar
        question: "'gato' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Preste atenção em números e quantidades mencionados."
      - type: grammar
        question: "'mesa' é (masculino/feminino)"
        correctAnswer: feminino
        rationale: "Releia a frase em que o personagem é mencionado."
      - type: grammar
        question: "'sol' é (masculino/feminino)"
        correctAnswer: masculino
        rationale: "Observe o verbo de ação para entender o que aconteceu."
target: 10
