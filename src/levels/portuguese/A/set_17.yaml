title: Gramática - Pronomes Pessoais
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: Conjunto de portuguese/A.
example: Identifique pronomes pessoais corretos.
pages:
  - pageNumber: 1
    title: Quem Faz a Ação
    description: Escolha o pronome correto.
    exercises:
      - type: grammar
        question: ___ sou estudante. (Eu/Tu/Ela)
        correctAnswer: Eu
        rationale: "Atente ao lugar descrito — é o cenário da história."
      - type: grammar
        question: ___ és meu amigo. (Eu/Tu/Ele)
        correctAnswer: Tu
        rationale: "Elimine alternativas que contradizem o texto."
      - type: grammar
        question: ___ é professora. (Eu/Tu/Ela)
        correctAnswer: Ela
        rationale: "A resposta aparece logo após a conjunção da frase."
      - type: grammar
        question: ___ jogamos bola. (Eu/Tu/Nós)
        correctAnswer: Nós
        rationale: "A resposta correta repete ou retoma termo do texto."
      - type: grammar
        question: ___ estudam juntos. (Eu/Eles/Nós)
        correctAnswer: Eles
        rationale: "Observe adjetivos que descrevem a cena ou o personagem."
      - type: grammar
        question: ___ gosta de ler. (Eu/Você/Eles)
        correctAnswer: Você
        rationale: "Verifique sinônimos que a pergunta pode ter usado."
      - type: grammar
        question: ___ somos irmãos. (Tu/Nós/Vocês)
        correctAnswer: Nós
        rationale: "Identifique o artigo (o/a/os/as) que combina com o substantivo."
      - type: grammar
        question: ___ brincam no parque. (Eu/Ela/Elas)
        correctAnswer: Elas
        rationale: "Associe a pergunta ao trecho que traz o mesmo vocabulário."
      - type: grammar
        question: ___ comes frutas. (Eu/Tu/Nós)
        correctAnswer: Tu
        rationale: "Letras maiúsculas iniciam frases e nomes próprios."
      - type: grammar
        question: ___ trabalha muito. (Tu/Ele/Vocês)
        correctAnswer: Ele
        rationale: "O objeto responde 'o quê' recebeu a ação."
target: 10
