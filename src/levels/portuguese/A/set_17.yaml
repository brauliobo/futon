title: Gramática - Pronomes Pessoais
level: A
subject: portuguese
example: Identifique pronomes pessoais corretos.
pages:
  - pageNumber: 1
    title: Quem Faz a Ação
    description: Escolha o pronome correto.
    exercises:
      - { type: grammar, question: "___ sou estudante. (Eu/Tu/Ela)", correctAnswer: Eu }
      - { type: grammar, question: "___ és meu amigo. (Eu/Tu/Ele)", correctAnswer: Tu }
      - { type: grammar, question: "___ é professora. (Eu/Tu/Ela)", correctAnswer: Ela }
      - { type: grammar, question: "___ jogamos bola. (Eu/Tu/Nós)", correctAnswer: Nós }
      - { type: grammar, question: "___ estudam juntos. (Eu/Eles/Nós)", correctAnswer: Eles }
      - { type: grammar, question: "___ gosta de ler. (Eu/Você/Eles)", correctAnswer: Você }
      - { type: grammar, question: "___ somos irmãos. (Tu/Nós/Vocês)", correctAnswer: Nós }
      - { type: grammar, question: "___ brincam no parque. (Eu/Ela/Elas)", correctAnswer: Elas }
      - { type: grammar, question: "___ comes frutas. (Eu/Tu/Nós)", correctAnswer: Tu }
      - { type: grammar, question: "___ trabalha muito. (Tu/Ele/Vocês)", correctAnswer: Ele }
target: 10
