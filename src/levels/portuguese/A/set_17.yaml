title: Gramática - Pronomes Pessoais
level: A
subject: portuguese
difficulty: 2
objectives:
  - pt.sentence_building
authorNotes: "Pronomes pessoais (eu, tu, ele…). Concordância com o verbo."
example: "Identifique pronomes pessoais corretos. Ex.: ___ sou estudante. → Eu."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Quem Faz a Ação
    description: Escolha o pronome correto.
    exercises:
      - type: grammar
        question: ___ sou estudante. (Eu/Tu/Ela)
        correctAnswer: Eu
        rationale: "Pronome 'eu' (1ª pessoa do singular) concorda com o verbo na mesma pessoa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ és meu amigo. (Eu/Tu/Ele)
        correctAnswer: Tu
        rationale: "Pronome 'tu' (2ª pessoa do singular) concorda com o verbo na mesma pessoa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ é professora. (Eu/Tu/Ela)
        correctAnswer: Ela
        rationale: "Pronome 'ela' (3ª pessoa do singular) concorda com o verbo na mesma pessoa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ jogamos bola. (Eu/Tu/Nós)
        correctAnswer: Nós
        rationale: "Pronome 'nós' (1ª pessoa do plural) concorda com o verbo na mesma pessoa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ estudam juntos. (Eu/Eles/Nós)
        correctAnswer: Eles
        rationale: "Pronomes oblíquos funcionam como complemento (me, te, o, a, nos, vos)."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ gosta de ler. (Eu/Você/Eles)
        correctAnswer: Você
        rationale: "Pronomes oblíquos átonos: me, te, se, nos, vos, o, a, lhe."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ somos irmãos. (Tu/Nós/Vocês)
        correctAnswer: Nós
        rationale: "Pronomes oblíquos tônicos: mim, ti, si, conosco, convosco."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ brincam no parque. (Eu/Ela/Elas)
        correctAnswer: Elas
        rationale: "'Lhe' é objeto indireto; 'o/a' é objeto direto."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ comes frutas. (Eu/Tu/Nós)
        correctAnswer: Tu
        rationale: "Pronome 'tu' (2ª pessoa do singular) concorda com o verbo na mesma pessoa."
        difficulty: 2
        objectives: [pt.sentence_building]
      - type: grammar
        question: ___ trabalha muito. (Tu/Ele/Vocês)
        correctAnswer: Ele
        rationale: "'Nós' representa a 1ª pessoa do plural."
        difficulty: 2
        objectives: [pt.sentence_building]
target: 10
