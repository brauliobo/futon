title: 📖 Literatura - Poesia e Versificação
level: F
subject: portuguese
difficulty: 3
objectives: [EF07LP02, EF08LP02]
authorNotes: Elementos da poesia — verso, estrofe, rima, ritmo, eu lírico; análise de poemas curtos.
example: "Verso = linha; estrofe = grupo de versos. Ex.: 'amor/calor' → rimam (terminam igual) = rima perfeita."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Verso e Estrofe
    description: Unidades básicas do poema.
    exercises:
      - type: paragraph
        question: "Como se chama cada linha de um poema? (metro/estrofe/verso/rima)"
        correctAnswer: verso
        difficulty: 1
        rationale: Verso é cada linha do poema; estrofe é o conjunto de versos.
        objectives: [EF07LP02]
  - pageNumber: 2
    title: Estrofes por Número de Versos
    description: Dístico (2), terceto (3), quarteto (4), quintilha (5).
    exercises:
      - type: paragraph
        question: "Estrofe com 4 versos chama-se: (terceto/quintilha/quarteto/dístico)"
        correctAnswer: quarteto
        difficulty: 1
        rationale: Quarteto = 4 versos; terceto = 3; dístico = 2; quintilha = 5.
        objectives: [EF07LP02]
  - pageNumber: 3
    title: Rima
    description: Semelhança sonora entre finais de versos.
    exercises:
      - type: paragraph
        question: "Qual par de palavras rima? (amor/flor/calor — chama/fama — vida/linda — pele/neve)"
        correctAnswer: chama/fama
        difficulty: 2
        rationale: Chama e fama terminam com o mesmo som -ama — rima perfeita.
        objectives: [EF07LP02]
  - pageNumber: 4
    title: Rima Alternada e Emparelhada
    description: ABAB = alternada; AABB = emparelhada.
    exercises:
      - type: paragraph
        question: "No esquema AABB as rimas são: (alternadas/emparelhadas/interpoladas/livres)"
        correctAnswer: emparelhadas
        difficulty: 2
        rationale: AABB = versos 1-2 rimam entre si, versos 3-4 rimam entre si — rimas emparelhadas.
        objectives: [EF08LP02]
  - pageNumber: 5
    title: Verso Livre
    description: Sem rima ou métrica fixas.
    exercises:
      - type: paragraph
        question: "Verso que não segue rima ou métrica regular é chamado de: (verso rimado/verso livre/quarteto/soneto)"
        correctAnswer: verso livre
        difficulty: 1
        rationale: Verso livre dispensa rima e metro — liberdade formal característica da poesia moderna.
        objectives: [EF07LP02]
  - pageNumber: 6
    title: Eu Lírico
    description: Voz que fala no poema — não é o autor.
    exercises:
      - type: paragraph
        question: "O 'eu lírico' em um poema é: (o autor do poema/a voz que fala no poema/o leitor/o personagem principal)"
        correctAnswer: a voz que fala no poema
        difficulty: 2
        rationale: Eu lírico é a persona poética — a voz narrativa do poema, não necessariamente o autor.
        objectives: [EF08LP02]
  - pageNumber: 7
    title: Ritmo e Sonoridade
    description: |
      Leia e responda:
      "Minha terra tem palmeiras / Onde canta o Sabiá / As aves que aqui gorjeiam / Não gorjeiam como lá." (Gonçalves Dias)
    exercises:
      - type: paragraph
        question: "O esquema de rimas neste quarteto é: (AABB/ABAB/ABBA/AABA)"
        correctAnswer: ABAB
        difficulty: 2
        rationale: Palmeiras(A)/Sabiá(B)/gorjeiam(A)/lá(B) — versos alternados rimam entre si = ABAB.
        objectives: [EF08LP02]
  - pageNumber: 8
    title: Tema do Poema
    description: Assunto central tratado no poema.
    exercises:
      - type: paragraph
        question: "No poema de Gonçalves Dias, o tema central é: (aves do Brasil/saudade da terra natal/palmeiras tropicais/canto do sabiá)"
        correctAnswer: saudade da terra natal
        difficulty: 2
        rationale: O poema expressa nostalgia e amor pela pátria — tema da saudade da terra natal.
        objectives: [EF08LP02]
  - pageNumber: 9
    title: Linguagem Conotativa
    description: Poesia usa sentido figurado.
    exercises:
      - type: paragraph
        question: "Em 'As aves não gorjeiam como lá', a comparação implica: (as aves do Brasil cantam melhor/o poeta prefere o canto das aves de sua terra/as aves são maiores/os pássaros voam mais alto)"
        correctAnswer: o poeta prefere o canto das aves de sua terra
        difficulty: 3
        rationale: A comparação expressa afeição pela terra natal — mesmo o canto das aves lá é único para o poeta.
        objectives: [EF08LP02]
  - pageNumber: 10
    title: Soneto
    description: Forma fixa com 14 versos (dois quartetos e dois tercetos).
    exercises:
      - type: paragraph
        question: "O soneto tem quantos versos no total? (10/12/14/16)"
        correctAnswer: 14
        difficulty: 1
        rationale: Soneto = 2 quartetos (8 versos) + 2 tercetos (6 versos) = 14 versos.
        objectives: [EF08LP02]
target: 10
