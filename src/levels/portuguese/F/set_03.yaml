title: Pretérito Perfeito do Indicativo
level: F
subject: portuguese
difficulty: 3
objectives: [EF07LP06, EF08LP05]
authorNotes: Ação concluída no passado. Regulares e irregulares (ser/ir, fazer, ver, dizer, trazer, ter).
example: "Eu cantei, tu cantaste, ele cantou."
pages:
  - pageNumber: 1
    title: Regulares em -ar
    description: Cantei, cantaste, cantou, cantamos, cantastes, cantaram.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito — Eu ___ (cantar). (cantei/cantava/cantarei/canto)"
        correctAnswer: cantei
        difficulty: 1
        rationale: "1ª pessoa singular do pretérito perfeito: -ei."
        objectives: [EF07LP06]
  - pageNumber: 2
    title: Regulares em -er
    description: Corri, correste, correu, corremos, correstes, correram.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito — Ele ___ (correr). (correu/corria/correrá/corre)"
        correctAnswer: correu
        difficulty: 2
        rationale: "3ª pessoa singular do pretérito perfeito da 2ª conjugação: correu."
        objectives: [EF07LP06]
  - pageNumber: 3
    title: Regulares em -ir
    description: Parti, partiste, partiu, partimos, partistes, partiram.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito — Eles ___ (partir). (partiram/partiu/partem/partiriam)"
        correctAnswer: partiram
        difficulty: 2
        rationale: "3ª pessoa plural do pretérito perfeito da 3ª conjugação: partiram."
        objectives: [EF07LP06]
  - pageNumber: 4
    title: Ser e Ir (Homônimos)
    description: Fui, foste, foi, fomos, fostes, foram — idêntico para ser e ir.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito — Eu ___ (ser). (fui/era/serei/sou)"
        correctAnswer: fui
        difficulty: 2
        rationale: "Pretérito perfeito de ser e ir: fui (contexto distingue)."
        objectives: [EF08LP05]
  - pageNumber: 5
    title: Verbo Ter
    description: Tive, tiveste, teve, tivemos, tivestes, tiveram.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito — Nós ___ (ter). (tivemos/temos/tínhamos/teremos)"
        correctAnswer: tivemos
        difficulty: 2
        rationale: "1ª pessoa plural do pretérito perfeito de ter: tivemos."
        objectives: [EF08LP05]
  - pageNumber: 6
    title: Verbo Fazer
    description: Fiz, fizeste, fez, fizemos, fizestes, fizeram.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito — Ela ___ (fazer). (fez/faz/fazia/fará)"
        correctAnswer: fez
        difficulty: 2
        rationale: "3ª pessoa singular do pretérito perfeito: fez."
        objectives: [EF08LP05]
  - pageNumber: 7
    title: Verbo Ver
    description: Vi, viste, viu, vimos, vistes, viram.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito — Eu ___ (ver). (vi/vejo/via/verei)"
        correctAnswer: vi
        difficulty: 2
        rationale: "1ª pessoa singular do pretérito perfeito de ver: vi."
        objectives: [EF08LP05]
  - pageNumber: 8
    title: Verbo Dizer
    description: Disse, disseste, disse, dissemos, dissestes, disseram.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito — Ele ___ (dizer). (disse/diz/dirá/dizia)"
        correctAnswer: disse
        difficulty: 3
        rationale: "3ª pessoa singular do pretérito perfeito de dizer: disse."
        objectives: [EF08LP05]
  - pageNumber: 9
    title: Verbo Trazer
    description: Trouxe, trouxeste, trouxe, trouxemos, trouxestes, trouxeram.
    exercises:
      - type: paragraph
        question: "Pretérito perfeito — Nós ___ (trazer). (trouxemos/trazemos/traríamos/traremos)"
        correctAnswer: trouxemos
        difficulty: 4
        rationale: "Pretérito perfeito irregular de trazer: trouxemos."
        objectives: [EF08LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Diferencie perfeito de imperfeito em contexto.
    exercises:
      - type: paragraph
        question: "Ação concluída ontem: 'Ontem eu ___ cedo.' (sai/saía/sairei/sairia)"
        correctAnswer: sai
        difficulty: 3
        rationale: Pretérito perfeito marca ação pontual concluída.
        objectives: [EF08LP05]
target: 10
