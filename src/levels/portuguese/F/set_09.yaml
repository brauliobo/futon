title: ✏️ Infinitivo e Gerúndio
level: F
subject: portuguese
difficulty: 3
objectives: [EF07LP06, EF08LP05]
authorNotes: Infinitivo pessoal e impessoal; gerúndio e seu uso em locuções verbais e orações reduzidas.
example: "Infinitivo impessoal não varia; pessoal concorda com o sujeito. Ex.: 'Para eles saírem' — infinitivo pessoal."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Infinitivo Impessoal
    description: Forma básica do verbo, sem indicar pessoa.
    exercises:
      - type: paragraph
        question: "Qual é a forma infinitiva de 'corremos'? (correr/correndo/corrido/corríamos)"
        correctAnswer: correr
        difficulty: 1
        rationale: Infinitivo impessoal é a forma não conjugada do verbo — correr.
        objectives: [EF07LP06]
  - pageNumber: 2
    title: Infinitivo Pessoal
    description: Infinitivo conjugado — varia com a pessoa.
    exercises:
      - type: paragraph
        question: "Infinitivo pessoal de 'falar', 2ª pessoa singular: (falar/falares/falando/falado)"
        correctAnswer: falares
        difficulty: 2
        rationale: Infinitivo pessoal 2ª pessoa singular adiciona -es — para tu falares.
        objectives: [EF07LP06]
  - pageNumber: 3
    title: Quando Usar Infinitivo Pessoal
    description: Sujeito do infinitivo diferente do sujeito da principal.
    exercises:
      - type: paragraph
        question: "Qual frase usa infinitivo pessoal obrigatório? (Quero falar/Para nós entendermos/Ele gosta de correr/Vou comprar pão)"
        correctAnswer: Para nós entendermos
        difficulty: 3
        rationale: 'Para' + infinitivo com sujeito expresso (nós) exige infinitivo pessoal — entendermos.
        objectives: [EF08LP05]
  - pageNumber: 4
    title: Gerúndio - Forma
    description: Formado por -ando (1ª), -endo (2ª), -indo (3ª).
    exercises:
      - type: paragraph
        question: "Gerúndio de 'partir': (partia/partindo/partido/parte)"
        correctAnswer: partindo
        difficulty: 1
        rationale: Gerúndio da 3ª conjugação: raiz + -indo — partindo.
        objectives: [EF07LP06]
  - pageNumber: 5
    title: Gerúndio - Locução Verbal
    description: Auxiliar + gerúndio = ação em curso.
    exercises:
      - type: paragraph
        question: "Em 'Estou estudando', o gerúndio indica: (ação concluída/ação em progresso/ação futura/ação hipotética)"
        correctAnswer: ação em progresso
        difficulty: 2
        rationale: Estar + gerúndio = ação que está acontecendo agora — aspecto progressivo.
        objectives: [EF07LP06]
  - pageNumber: 6
    title: Oração Reduzida de Gerúndio
    description: Substitui oração subordinada adverbial.
    exercises:
      - type: paragraph
        question: "Em 'Saindo de casa, encontrei um amigo', o gerúndio indica: (tempo/modo/causa/concessão)"
        correctAnswer: tempo
        difficulty: 3
        rationale: Oração reduzida de gerúndio no início indica simultaneidade ou tempo — 'ao sair de casa'.
        objectives: [EF08LP05]
  - pageNumber: 7
    title: Particípio vs Gerúndio
    description: Distinguir pelo sufixo.
    exercises:
      - type: paragraph
        question: "Qual é o gerúndio de 'beber'? (bebido/bebendo/bebia/bebe)"
        correctAnswer: bebendo
        difficulty: 1
        rationale: Gerúndio 2ª conjugação = -endo; bebido é particípio; bebia é imperfeito.
        objectives: [EF07LP06]
  - pageNumber: 8
    title: Infinitivo em Perífrases
    description: Ir + infinitivo = futuro próximo.
    exercises:
      - type: paragraph
        question: "Em 'Vou viajar amanhã', 'viajar' é: (gerúndio/infinitivo/particípio/imperativo)"
        correctAnswer: infinitivo
        difficulty: 2
        rationale: Ir + infinitivo forma locução verbal de futuro próximo — viajar está no infinitivo.
        objectives: [EF07LP06]
  - pageNumber: 9
    title: Gerúndio vs Particípio
    description: Distinguir usos nas locuções verbais.
    exercises:
      - type: paragraph
        question: "Em 'Ele tinha falado comigo', a forma nominal é: (falando/falar/falado/fala)"
        correctAnswer: falado
        difficulty: 2
        rationale: Ter + particípio = tempos compostos; falado é o particípio de falar.
        objectives: [EF08LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identificar formas nominais do verbo.
    exercises:
      - type: paragraph
        question: "Quais são as três formas nominais do verbo? (infinitivo, gerúndio, particípio/infinitivo, indicativo, subjuntivo/gerúndio, imperativo, indicativo/presente, passado, futuro)"
        correctAnswer: infinitivo, gerúndio, particípio
        difficulty: 2
        rationale: As formas nominais (não conjugadas) do verbo são: infinitivo, gerúndio e particípio.
        objectives: [EF07LP06]
target: 10
