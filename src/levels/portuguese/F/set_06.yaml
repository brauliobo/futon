title: Modo Subjuntivo
level: F
subject: portuguese
difficulty: 4
objectives: [EF08LP05, EF09LP06]
authorNotes: Presente (que eu cante), pretérito imperfeito (se eu cantasse), futuro (quando eu cantar). Usos em dúvida, desejo, hipótese.
example: "Espero que ele venha. Ex.: Subjuntivo presente — Que ele ___ (cantar). → cante."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Presente do Subjuntivo
    description: Desinências regulares — que eu cante, que eu corra, que eu parta.
    exercises:
      - type: paragraph
        question: "Subjuntivo presente — Que ele ___ (cantar). (cantou/cantaria/canta/cante)"
        correctAnswer: cante
        difficulty: 2
        rationale: 1ª conjugação usa -e no subjuntivo.
        objectives: [EF08LP05]
  - pageNumber: 2
    title: Subjuntivo após Conjunções
    description: Usado após 'que', 'para que', 'a fim de que'.
    exercises:
      - type: paragraph
        question: "'Espero que você ___ (vir).' (veio/virá/venha/vem)"
        correctAnswer: venha
        difficulty: 3
        rationale: Verbos de desejo pedem subjuntivo.
        objectives: [EF08LP05]
  - pageNumber: 3
    title: Pretérito Imperfeito do Subjuntivo
    description: Se eu cantasse, corresse, partisse.
    exercises:
      - type: paragraph
        question: "'Se eu ___ (ter) tempo, iria' (ter). (tivesse/tenho/tive/teria)"
        correctAnswer: tivesse
        difficulty: 3
        rationale: Hipótese no passado → imperfeito do subjuntivo.
        objectives: [EF09LP06]
  - pageNumber: 4
    title: Futuro do Subjuntivo
    description: Quando eu cantar, corrermos, partirem.
    exercises:
      - type: paragraph
        question: "'Quando eu ___ (poder), te visito' (poder). (pude/posso/poderia/puder)"
        correctAnswer: puder
        difficulty: 4
        rationale: Condição futura → futuro do subjuntivo.
        objectives: [EF09LP06]
  - pageNumber: 5
    title: Verbos Irregulares no Subjuntivo
    description: Ser → seja; ter → tenha; haver → haja; ir → vá.
    exercises:
      - type: paragraph
        question: "Subjuntivo presente — Que ele ___ (ser). (é/foi/seja/era)"
        correctAnswer: seja
        difficulty: 3
        rationale: Forma irregular do presente do subjuntivo de ser.
        objectives: [EF08LP05]
  - pageNumber: 6
    title: Subjuntivo com Dúvida
    description: "'Talvez' e 'é possível que' pedem subjuntivo."
    exercises:
      - type: paragraph
        question: "'Talvez ele ___ (chegar) amanhã.' (chegue/chegou/chegará/chega)"
        correctAnswer: chegue
        difficulty: 3
        rationale: Dúvida pede presente do subjuntivo.
        objectives: [EF08LP05]
  - pageNumber: 7
    title: Subjuntivo com Desejo
    description: "'Oxalá', 'Queria que' pedem subjuntivo."
    exercises:
      - type: paragraph
        question: "'Queria que você ___ (vir).' (veio/virá/viesse/vem)"
        correctAnswer: viesse
        difficulty: 4
        rationale: Desejo no presente/passado → imperfeito do subjuntivo.
        objectives: [EF09LP06]
  - pageNumber: 8
    title: Subjuntivo com Hipótese
    description: "'Se' + imperfeito do subjuntivo."
    exercises:
      - type: paragraph
        question: "'Se eu ___ (saber), teria avisado.' (soubesse/saberia/soube/sabia)"
        correctAnswer: soubesse
        difficulty: 4
        rationale: "Imperfeito do subjuntivo irregular de saber: soubesse."
        objectives: [EF09LP06]
  - pageNumber: 9
    title: Subjuntivo vs Indicativo
    description: Frase de certeza usa indicativo; de dúvida, subjuntivo.
    exercises:
      - type: paragraph
        question: "Qual frase está no subjuntivo? (Ele veio/Ele virá/Ele vem amanhã/Espero que ele venha)"
        correctAnswer: Espero que ele venha
        difficulty: 3
        rationale: "'Que ele venha' — subjuntivo; os demais, indicativo."
        objectives: [EF09LP06]
  - pageNumber: 10
    title: Revisão Integrada
    description: Complete com o subjuntivo adequado.
    exercises:
      - type: paragraph
        question: "'Assim que eu ___ (terminar), te aviso.' (terminarei/terminar/termino/terminei)"
        correctAnswer: terminar
        difficulty: 4
        rationale: Condição futura → futuro do subjuntivo.
        objectives: [EF09LP06]
target: 10
