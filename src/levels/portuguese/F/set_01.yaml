title: Presente do Indicativo - Regulares
level: F
subject: portuguese
difficulty: 2
objectives: [EF07LP06, EF08LP05]
authorNotes: Conjugações regulares em -ar, -er, -ir. Foco nas desinências número-pessoais.
example: "Eu canto, tu cantas, ele canta, nós cantamos, vós cantais, eles cantam."
pages:
  - pageNumber: 1
    title: Primeira Conjugação — Cantar
    description: Desinências -o, -as, -a, -amos, -ais, -am.
    exercises:
      - type: paragraph
        question: "Presente — Ele ___ (cantar). (canta/cantas/cantamos/cantam)"
        correctAnswer: canta
        difficulty: 1
        rationale: "3ª pessoa do singular: -a."
        objectives: [EF07LP06]
  - pageNumber: 2
    title: Segunda Conjugação — Correr
    description: Desinências -o, -es, -e, -emos, -eis, -em.
    exercises:
      - type: paragraph
        question: "Presente — Nós ___ (correr). (corremos/corre/correm/correi)"
        correctAnswer: corremos
        difficulty: 2
        rationale: "1ª pessoa do plural de correr: corremos."
        objectives: [EF07LP06]
  - pageNumber: 3
    title: Terceira Conjugação — Partir
    description: Desinências -o, -es, -e, -imos, -is, -em.
    exercises:
      - type: paragraph
        question: "Presente — Eles ___ (partir). (partem/parte/parto/partimos)"
        correctAnswer: partem
        difficulty: 2
        rationale: "3ª pessoa do plural de partir: partem."
        objectives: [EF07LP06]
  - pageNumber: 4
    title: Desinência de 2ª Pessoa
    description: Tu cantas, tu corres, tu partes.
    exercises:
      - type: paragraph
        question: "Presente — Tu ___ (cantar). (cantas/canta/cantamos/cantai)"
        correctAnswer: cantas
        difficulty: 2
        rationale: Tu + -as na 1ª conjugação.
        objectives: [EF07LP06]
  - pageNumber: 5
    title: Desinência de 1ª Pessoa Plural
    description: -amos, -emos, -imos para nós.
    exercises:
      - type: paragraph
        question: "Presente — Nós ___ (partir). (partimos/parte/partem/parti)"
        correctAnswer: partimos
        difficulty: 2
        rationale: "3ª conjugação, 1ª pessoa plural: partimos."
        objectives: [EF07LP06]
  - pageNumber: 6
    title: 3ª Pessoa Plural
    description: -am, -em, -em para eles.
    exercises:
      - type: paragraph
        question: "Presente — Eles ___ (correr). (correm/corre/correi/correm-se)"
        correctAnswer: correm
        difficulty: 2
        rationale: "3ª pessoa plural da 2ª conjugação: correm."
        objectives: [EF07LP06]
  - pageNumber: 7
    title: Vós no Presente
    description: Vós cantais, correis, partis.
    exercises:
      - type: paragraph
        question: "Presente — Vós ___ (correr). (correis/correm/corre/corremos)"
        correctAnswer: correis
        difficulty: 3
        rationale: Vós + -eis na 2ª conjugação.
        objectives: [EF08LP05]
  - pageNumber: 8
    title: 1ª Pessoa Singular
    description: Termina em -o em todas as conjugações regulares.
    exercises:
      - type: paragraph
        question: "Presente — Eu ___ (cantar). (canto/canta/cantarei/cantaria)"
        correctAnswer: canto
        difficulty: 1
        rationale: Eu + -o.
        objectives: [EF07LP06]
  - pageNumber: 9
    title: Diferença entre Conjugações
    description: Atenção à vogal temática (-a-, -e-, -i-).
    exercises:
      - type: paragraph
        question: "Qual é 3ª conjugação? (Eu parto/Eu corro/Eu canto/Eu vendo)"
        correctAnswer: Eu parto
        difficulty: 3
        rationale: Infinitivo em -ir.
        objectives: [EF08LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Conjugue em contexto.
    exercises:
      - type: paragraph
        question: "Complete — 'Nós ___ (dormir) cedo todos os dias'. (dormimos/dormem/dormiu/dormirá)"
        correctAnswer: dormimos
        difficulty: 2
        rationale: Presente do indicativo, 1ª pessoa plural de dormir.
        objectives: [EF08LP05]
target: 10
