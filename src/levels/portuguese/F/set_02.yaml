title: Presente do Indicativo - Irregulares
level: F
subject: portuguese
difficulty: 3
objectives: [EF07LP06, EF08LP05]
authorNotes: Verbos irregulares de alta frequência — ser, estar, ter, haver, ir, vir, pôr, fazer, saber, poder.
example: "Eu sou, tu és, ele é. Ex.: Presente — Nós ___ (ser). → somos."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Verbo Ser
    description: Sou, és, é, somos, sois, são.
    exercises:
      - type: paragraph
        question: "Presente — Nós ___ (ser). (é/sois/somos/são)"
        correctAnswer: somos
        difficulty: 1
        rationale: "1ª pessoa plural de ser: somos."
        objectives: [EF07LP06]
  - pageNumber: 2
    title: Verbo Estar
    description: Estou, estás, está, estamos, estais, estão.
    exercises:
      - type: paragraph
        question: "Presente — Eles ___ (estar). (estão/estiveram/estamos/está)"
        correctAnswer: estão
        difficulty: 1
        rationale: "3ª pessoa plural de estar: estão."
        objectives: [EF07LP06]
  - pageNumber: 3
    title: Verbo Ter
    description: Tenho, tens, tem, temos, tendes, têm.
    exercises:
      - type: paragraph
        question: "Presente — Ele ___ (ter). (têm/temos/tem/tens)"
        correctAnswer: tem
        difficulty: 2
        rationale: "3ª pessoa singular de ter: tem (sem acento circunflexo)."
        objectives: [EF08LP05]
  - pageNumber: 4
    title: Tem vs Têm
    description: "'Tem' no singular, 'têm' no plural."
    exercises:
      - type: paragraph
        question: "Presente — Eles ___ (ter) razão. (têem/tens/têm/tem)"
        correctAnswer: têm
        difficulty: 3
        rationale: "3ª pessoa plural de ter usa acento diferencial: têm."
        objectives: [EF08LP05]
  - pageNumber: 5
    title: Verbo Ir
    description: Vou, vais, vai, vamos, ides, vão.
    exercises:
      - type: paragraph
        question: "Presente — Eu ___ (ir). (vou/vai/vamos/fui)"
        correctAnswer: vou
        difficulty: 1
        rationale: "1ª pessoa singular de ir: vou."
        objectives: [EF07LP06]
  - pageNumber: 6
    title: Verbo Vir
    description: Venho, vens, vem, vimos, vindes, vêm.
    exercises:
      - type: paragraph
        question: "Presente — Nós ___ (vir). (vimos/viemos/vamos/víamos)"
        correctAnswer: vimos
        difficulty: 3
        rationale: 1ª pessoa plural de vir no presente é 'vimos' (igual ao pretérito perfeito — contexto desfaz ambiguidade).
        objectives: [EF08LP05]
  - pageNumber: 7
    title: Verbo Pôr
    description: Ponho, pões, põe, pomos, pondes, põem.
    exercises:
      - type: paragraph
        question: "Presente — Eu ___ (pôr). (põe/põem/pus/ponho)"
        correctAnswer: ponho
        difficulty: 2
        rationale: "1ª pessoa singular de pôr: ponho."
        objectives: [EF08LP05]
  - pageNumber: 8
    title: Verbo Fazer
    description: Faço, fazes, faz, fazemos, fazeis, fazem.
    exercises:
      - type: paragraph
        question: "Presente — Ela ___ (fazer). (faço/fazemos/fazes/faz)"
        correctAnswer: faz
        difficulty: 1
        rationale: "3ª pessoa singular de fazer: faz."
        objectives: [EF07LP06]
  - pageNumber: 9
    title: Verbo Saber
    description: Sei, sabes, sabe, sabemos, sabeis, sabem.
    exercises:
      - type: paragraph
        question: "Presente — Eu ___ (saber). (sabes/sabe/sei/sabemos)"
        correctAnswer: sei
        difficulty: 2
        rationale: "1ª pessoa singular de saber é irregular: sei."
        objectives: [EF08LP05]
  - pageNumber: 10
    title: Verbo Poder & Revisão
    description: Posso, podes, pode, podemos, podeis, podem.
    exercises:
      - type: paragraph
        question: "Presente — Nós ___ (poder). (pode/podem/podemos/podia)"
        correctAnswer: podemos
        difficulty: 2
        rationale: "1ª pessoa plural de poder: podemos."
        objectives: [EF08LP05]
target: 10
