title: 🔬 Orações Subordinadas Substantivas
level: F
subject: portuguese
difficulty: 4
objectives: [EF08LP06, EF09LP05]
authorNotes: Orações que exercem função de substantivo (sujeito, OD, OI, predicativo, aposto) na oração principal.
example: "OSS objetiva direta: 'Sei que você veio.' Introduzida por 'que'; exerce função de OD. Ex.: 'É importante que você estude.' → OSS subjetiva: 'que você estude' é o sujeito de 'é importante'."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: O que são OSS?
    description: Orações que funcionam como substantivos dentro da principal.
    exercises:
      - type: paragraph
        question: "Em 'Sei que você veio', a oração 'que você veio' exerce função de: (sujeito/OD/OI/predicativo)"
        correctAnswer: OD
        difficulty: 2
        rationale: "'Sei o quê?' → que você veio; responde ao OD do verbo saber — OSS objetiva direta."
        objectives: [EF08LP06]
  - pageNumber: 2
    title: OSS Subjetiva
    description: Exerce função de sujeito da oração principal.
    exercises:
      - type: paragraph
        question: "Em 'É importante que você estude', a OSS é: (é importante/que você estude/você estude/estude)"
        correctAnswer: que você estude
        difficulty: 2
        rationale: "'Que você estude' é o sujeito de 'é importante' — OSS subjetiva."
        objectives: [EF08LP06]
  - pageNumber: 3
    title: OSS Objetiva Direta
    description: Exerce função de OD.
    exercises:
      - type: paragraph
        question: "Qual frase tem OSS objetiva direta? (Gosto de que venhas/Sei que chegou/Preciso que vás/Duvido que fale)"
        correctAnswer: Sei que chegou
        difficulty: 2
        rationale: "'Sei o quê?' → que chegou — OD sem preposição; as outras têm preposição."
        objectives: [EF09LP05]
  - pageNumber: 4
    title: OSS Objetiva Indireta
    description: Exerce função de OI, com preposição.
    exercises:
      - type: paragraph
        question: "Em 'Gosto de que você cante', a oração 'de que você cante' é: (OSS subjetiva/OSS OD/OSS OI/OSS predicativa)"
        correctAnswer: OSS OI
        difficulty: 3
        rationale: "'Gosto de quê?' → de que você cante; OI com preposição 'de'."
        objectives: [EF09LP05]
  - pageNumber: 5
    title: OSS Predicativa
    description: Exerce função de predicativo do sujeito.
    exercises:
      - type: paragraph
        question: "Em 'O problema é que não temos tempo', a OSS é: (o problema/é/que não temos tempo/tempo)"
        correctAnswer: que não temos tempo
        difficulty: 3
        rationale: "'O problema é o quê?' → que não temos tempo — predicativo do sujeito; OSS predicativa."
        objectives: [EF09LP05]
  - pageNumber: 6
    title: OSS Apositiva
    description: Exerce função de aposto.
    exercises:
      - type: paragraph
        question: "Em 'Tenho um desejo: que todos sejam felizes', a parte após os dois-pontos é: (sujeito/OD/aposto/predicativo)"
        correctAnswer: aposto
        difficulty: 3
        rationale: A oração após ':' explica/detalha 'um desejo' — OSS apositiva.
        objectives: [EF09LP05]
  - pageNumber: 7
    title: Conjunção Integrante
    description: "'Que' e 'se' introduzem OSS."
    exercises:
      - type: paragraph
        question: "Em 'Perguntei se ela viria', 'se' introduz: (OSS subjetiva/OSS OI/OSS OD/OSS predicativa)"
        correctAnswer: OSS OD
        difficulty: 3
        rationale: "'Perguntei o quê?' → se ela viria — 'se' conjunção integrante introduz OSS objetiva direta."
        objectives: [EF09LP05]
  - pageNumber: 8
    title: Reduzida de Infinitivo
    description: OSS pode ter verbo no infinitivo (sem conjunção).
    exercises:
      - type: paragraph
        question: "Em 'Quero comprar livros', a oração 'comprar livros' é: (OSS subjetiva/OSS OD reduzida/OSA causal/OSAdv temporal)"
        correctAnswer: OSS OD reduzida
        difficulty: 3
        rationale: "'Quero o quê?' → comprar livros — OSS OD reduzida de infinitivo, sem 'que'."
        objectives: [EF08LP06]
  - pageNumber: 9
    title: Verbo da Principal
    description: Tipo do verbo da principal determina a OSS.
    exercises:
      - type: paragraph
        question: "Qual verbo exige OSS objetiva direta? (depender/necessitar/ver/gostar)"
        correctAnswer: ver
        difficulty: 2
        rationale: Ver + que = OD direto (vi que chegou); os outros pedem preposição.
        objectives: [EF09LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Classificar OSS em contexto.
    exercises:
      - type: paragraph
        question: "Em 'É certo que ele virá', a OSS exerce função de: (OD/OI/sujeito/aposto)"
        correctAnswer: sujeito
        difficulty: 3
        rationale: "'É certo o quê?' → que ele virá — sujeito de 'é certo'; OSS subjetiva."
        objectives: [EF09LP05]
target: 10
