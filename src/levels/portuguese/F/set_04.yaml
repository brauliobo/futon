title: ✏️ Pretérito Imperfeito do Indicativo
level: F
subject: portuguese
difficulty: 3
objectives: [EF07LP06, EF08LP05]
authorNotes: Ação habitual, contínua ou em curso no passado. Ser, ter, pôr, vir têm formas irregulares.
example: "Eu cantava todo dia. Ex.: Imperfeito — Eles ___ (vir). → vinham."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Regulares em -ar
    description: Cantava, cantavas, cantava, cantávamos, cantáveis, cantavam.
    exercises:
      - type: paragraph
        question: "Imperfeito — Eu ___ (cantar). (cantava/cantei/cantarei/canto)"
        correctAnswer: cantava
        difficulty: 1
        rationale: Desinência -ava- marca o imperfeito da 1ª conjugação.
        objectives: [EF07LP06]
  - pageNumber: 2
    title: Regulares em -er e -ir
    description: Corria, partia — com -ia-.
    exercises:
      - type: paragraph
        question: "Imperfeito — Ele ___ (correr). (corria/corre/correria/correu)"
        correctAnswer: corria
        difficulty: 2
        rationale: 2ª e 3ª conjugações usam -ia- no imperfeito.
        objectives: [EF07LP06]
  - pageNumber: 3
    title: Verbo Ser
    description: Era, eras, era, éramos, éreis, eram.
    exercises:
      - type: paragraph
        question: "Imperfeito — Nós ___ (ser). (fomos/somos/seremos/éramos)"
        correctAnswer: éramos
        difficulty: 2
        rationale: Imperfeito irregular de ser, 1ª pessoa plural.
        objectives: [EF08LP05]
  - pageNumber: 4
    title: Verbo Ter
    description: Tinha, tinhas, tinha, tínhamos, tínheis, tinham.
    exercises:
      - type: paragraph
        question: "Imperfeito — Eu ___ (ter). (tenho/tive/tinha/terei)"
        correctAnswer: tinha
        difficulty: 2
        rationale: "Imperfeito irregular de ter: tinha."
        objectives: [EF08LP05]
  - pageNumber: 5
    title: Verbo Pôr
    description: Punha, punhas, punha, púnhamos, púnheis, punham.
    exercises:
      - type: paragraph
        question: "Imperfeito — Ela ___ (pôr). (punha/pôs/põe/pusera)"
        correctAnswer: punha
        difficulty: 3
        rationale: "Imperfeito irregular de pôr: punha."
        objectives: [EF08LP05]
  - pageNumber: 6
    title: Verbo Vir
    description: Vinha, vinhas, vinha, vínhamos, vínheis, vinham.
    exercises:
      - type: paragraph
        question: "Imperfeito — Eles ___ (vir). (vieram/vêm/virão/vinham)"
        correctAnswer: vinham
        difficulty: 3
        rationale: "Imperfeito irregular de vir: vinham."
        objectives: [EF08LP05]
  - pageNumber: 7
    title: Ação Habitual
    description: O imperfeito exprime repetição.
    exercises:
      - type: paragraph
        question: "'Todo domingo nós ___ à praia' (ir). (íamos/vamos/iremos/fomos)"
        correctAnswer: íamos
        difficulty: 2
        rationale: "Imperfeito de ir: íamos; situa hábito no passado."
        objectives: [EF08LP05]
  - pageNumber: 8
    title: Ação Interrompida
    description: Imperfeito + perfeito constrói narrativa.
    exercises:
      - type: paragraph
        question: "'Eu ___ quando o telefone tocou' (ler). (lerei/li/lia/leio)"
        correctAnswer: lia
        difficulty: 3
        rationale: Imperfeito marca a ação em curso; perfeito marca a interrupção.
        objectives: [EF08LP05]
  - pageNumber: 9
    title: Imperfeito de Polidez
    description: Pedidos polidos usam imperfeito.
    exercises:
      - type: paragraph
        question: "Qual forma usa o imperfeito de polidez? (Quero um café/Queria um café/Quis um café/Quererei um café)"
        correctAnswer: Queria um café
        difficulty: 3
        rationale: Imperfeito torna o pedido mais polido.
        objectives: [EF08LP05]
  - pageNumber: 10
    title: Revisão Integrada
    description: Diferencie imperfeito de perfeito em contexto.
    exercises:
      - type: paragraph
        question: "'Ontem quando cheguei, ela ___ com o cachorro' (brincar). (brincou/brincava/brincará/brinca)"
        correctAnswer: brincava
        difficulty: 3
        rationale: Imperfeito para ação contínua no momento de chegada.
        objectives: [EF08LP05]
target: 10
