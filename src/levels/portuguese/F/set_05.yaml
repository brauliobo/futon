title: Futuro do Presente e Futuro do Pretérito
level: F
subject: portuguese
difficulty: 4
objectives: [EF08LP05, EF09LP06]
authorNotes: Futuro do presente (farei, faria) e futuro do pretérito / condicional (faria).
example: "Eu cantarei amanhã / Eu cantaria se pudesse. Ex.: Qual forma usa o condicional de polidez? → Gostaria de um café."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 50
pages:
  - pageNumber: 1
    title: Futuro do Presente — Regulares
    description: -arei, -erei, -irei + desinências.
    exercises:
      - type: paragraph
        question: "Futuro presente — Eu ___ (cantar). (canto/cantaria/cantarei/cantei)"
        correctAnswer: cantarei
        difficulty: 2
        rationale: "1ª pessoa singular do futuro do presente: cantarei."
        objectives: [EF08LP05]
  - pageNumber: 2
    title: Futuro do Pretérito — Regulares
    description: -aria, -eria, -iria + desinências.
    exercises:
      - type: paragraph
        question: "Futuro pretérito — Eu ___ (cantar). (cantarei/cantei/cantava/cantaria)"
        correctAnswer: cantaria
        difficulty: 2
        rationale: Futuro do pretérito = condicional, exprime hipótese / polidez.
        objectives: [EF08LP05]
  - pageNumber: 3
    title: Verbos Irregulares — Fazer
    description: Farei, farás, fará / faria, farias, faria.
    exercises:
      - type: paragraph
        question: "Futuro presente — Ele ___ (fazer). (fazia/faz/faria/fará)"
        correctAnswer: fará
        difficulty: 3
        rationale: "Fazer é irregular: radical 'far-'."
        objectives: [EF08LP05]
  - pageNumber: 4
    title: Verbos Irregulares — Trazer
    description: Trarei, trarás, trará / traria.
    exercises:
      - type: paragraph
        question: "Futuro presente — Nós ___ (trazer) o presente. (trazemos/traremos/trouxemos/traríamos)"
        correctAnswer: traremos
        difficulty: 4
        rationale: Radical irregular 'trar-' em trazer.
        objectives: [EF08LP05]
  - pageNumber: 5
    title: Verbos Irregulares — Dizer
    description: Direi, dirás, dirá / diria.
    exercises:
      - type: paragraph
        question: "Futuro presente — Eu ___ (dizer) a verdade. (disse/direi/digo/diria)"
        correctAnswer: direi
        difficulty: 3
        rationale: Dizer tem radical irregular 'dir-' no futuro.
        objectives: [EF08LP05]
  - pageNumber: 6
    title: Condicional de Polidez
    description: Pedidos formais no futuro do pretérito.
    exercises:
      - type: paragraph
        question: "Qual forma usa o condicional de polidez? (Gostaria de um café/Quererei/Quis um café/Quero um café)"
        correctAnswer: Gostaria de um café
        difficulty: 2
        rationale: Futuro do pretérito + 'gostaria' suaviza pedidos.
        objectives: [EF09LP06]
  - pageNumber: 7
    title: Hipótese
    description: Futuro do pretérito expressa consequência de condição hipotética.
    exercises:
      - type: paragraph
        question: "'Se eu tivesse tempo, ___' (ir). (fui/irei/iria/vou)"
        correctAnswer: iria
        difficulty: 3
        rationale: Hipótese pede futuro do pretérito.
        objectives: [EF09LP06]
  - pageNumber: 8
    title: Futuro do Presente em Narrativa
    description: Predição ou promessa.
    exercises:
      - type: paragraph
        question: "Promessa — 'Eu ___ te ajudar.' (irei/fui/iria/vou)"
        correctAnswer: irei
        difficulty: 2
        rationale: Futuro do presente marca compromisso futuro.
        objectives: [EF08LP05]
  - pageNumber: 9
    title: Ir + Infinitivo
    description: Forma perifrástica alternativa ao futuro sintético.
    exercises:
      - type: paragraph
        question: "'Amanhã eu ___ à praia.' Forma perifrástica: (vou/iria/fui/irei)"
        correctAnswer: vou
        difficulty: 3
        rationale: "'Vou' + infinitivo é perifrástico, muito usado no português falado."
        objectives: [EF09LP06]
  - pageNumber: 10
    title: Revisão Integrada
    description: Diferencie futuro do presente e do pretérito.
    exercises:
      - type: paragraph
        question: "'Se eu pudesse, ___ com você' (viajar). (viajaria/viajava/viajei/viajarei)"
        correctAnswer: viajaria
        difficulty: 3
        rationale: Hipótese com 'se pudesse' → futuro do pretérito.
        objectives: [EF09LP06]
target: 10
