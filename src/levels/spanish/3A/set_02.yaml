title: La Naturaleza
level: 3A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Vocabulario del entorno natural: elementos, accidentes geográficos, plantas. Pensar primero en el lugar donde se encuentra cada elemento."
example: "Gran masa de agua salada → mar. Elevación muy alta de tierra → montaña."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Agua y Tierra
    description: Identifica el elemento natural.
    exercises:
      - type: vocab
        question: "Gran masa de agua salada (lago/mar/río)"
        correctAnswer: mar
        rationale: "El mar es una gran extensión de agua salada."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Corriente de agua dulce (lago/río/mar)"
        correctAnswer: río
        rationale: "El río es una corriente de agua dulce que fluye hacia el mar."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Agua dulce rodeada de tierra (mar/lago/océano)"
        correctAnswer: lago
        rationale: "El lago es un cuerpo de agua dulce estancada rodeado de tierra."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Elevación muy alta de tierra (colina/montaña/valle)"
        correctAnswer: montaña
        rationale: "La montaña es una gran elevación del terreno."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Elevación baja del terreno (montaña/colina/valle)"
        correctAnswer: colina
        rationale: "La colina es una elevación menor que la montaña."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Zona baja entre montañas (cima/valle/desierto)"
        correctAnswer: valle
        rationale: "El valle es el terreno llano entre montañas."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Zona de arena con poca agua (bosque/desierto/selva)"
        correctAnswer: desierto
        rationale: "El desierto es seco, con arena y poca vegetación."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Zona con muchos árboles (desierto/bosque/playa)"
        correctAnswer: bosque
        rationale: "El bosque es una extensión con muchos árboles."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Bosque tropical muy denso (desierto/selva/llanura)"
        correctAnswer: selva
        rationale: "La selva es un bosque tropical denso y húmedo."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Tierra junto al mar con arena (montaña/playa/valle)"
        correctAnswer: playa
        rationale: "La playa es la zona de arena junto al mar."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Cielo y Vegetación
    description: Identifica el elemento natural descrito.
    exercises:
      - type: vocab
        question: "Nuestro planeta (Tierra/Marte/Luna)"
        correctAnswer: Tierra
        rationale: "Vivimos en el planeta Tierra."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Luz y calor durante el día (Luna/Sol/estrella)"
        correctAnswer: Sol
        rationale: "El Sol ilumina y calienta la Tierra."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Satélite de la Tierra que vemos de noche (Sol/estrella/Luna)"
        correctAnswer: Luna
        rationale: "La Luna es el satélite natural que orbita la Tierra."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Puntos brillantes del cielo nocturno (Sol/estrellas/nubes)"
        correctAnswer: estrellas
        rationale: "Las estrellas brillan en el cielo durante la noche."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Acumulaciones blancas en el cielo (nubes/estrellas/luz)"
        correctAnswer: nubes
        rationale: "Las nubes son masas blancas de vapor de agua en el cielo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Planta alta con tronco y ramas (flor/árbol/hierba)"
        correctAnswer: árbol
        rationale: "El árbol es una planta alta con tronco y ramas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Parte colorida y perfumada de la planta (hoja/flor/tronco)"
        correctAnswer: flor
        rationale: "La flor es la parte atractiva que contiene el aroma."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Parte plana verde del árbol (flor/hoja/fruto)"
        correctAnswer: hoja
        rationale: "Las hojas son planas y verdes; producen alimento para el árbol."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Vegetación verde baja del suelo (árbol/hierba/flor)"
        correctAnswer: hierba
        rationale: "La hierba cubre el suelo con plantas bajas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Parte subterránea de la planta (hoja/raíz/tronco)"
        correctAnswer: raíz
        rationale: "La raíz es la parte subterránea de la planta: absorbe agua y nutrientes del suelo."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
