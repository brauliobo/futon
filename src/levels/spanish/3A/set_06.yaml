title: ✏️ Palabras Compuestas
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Palabras formadas por la unión de dos palabras más simples. Primero identifica los componentes; luego reconoce el significado conjunto."
example: "saca + corchos → sacacorchos (objeto para extraer corchos)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Forma la Palabra Compuesta
    description: Une las dos palabras para formar una compuesta.
    exercises:
      - type: vocab
        question: "saca + corchos = (sacacorcho/sacacorchos/sacocorchos)"
        correctAnswer: sacacorchos
        rationale: "Une saca + corchos → 'sacacorchos' (herramienta para extraer el corcho)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "para + aguas = (paraguas/parauguas/peraguas)"
        correctAnswer: paraguas
        rationale: "Une para + aguas → 'paraguas' (objeto que 'para' el agua de la lluvia)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "para + brisas = (parabrisa/parabrisas/parebrisas)"
        correctAnswer: parabrisas
        rationale: "Une para + brisas → 'parabrisas' (cristal delantero del coche)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "rompe + cabezas = (rompecabeza/rompecabezas/rumpecabezas)"
        correctAnswer: rompecabezas
        rationale: "Une rompe + cabezas → 'rompecabezas' (juego mental)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "lava + platos = (lavaplato/lavaplatos/lavuplatos)"
        correctAnswer: lavaplatos
        rationale: "Une lava + platos → 'lavaplatos' (electrodoméstico)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "abre + latas = (abrelata/abrelatas/abrelates)"
        correctAnswer: abrelatas
        rationale: "Une abre + latas → 'abrelatas' (herramienta de cocina)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "guarda + bosques = (guardabosque/guardabosques/guardebosques)"
        correctAnswer: guardabosques
        rationale: "Une guarda + bosques → 'guardabosques' (persona que cuida bosques)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "sube + baja = (subebaja/subibaja/sobebaja)"
        correctAnswer: subibaja
        rationale: "El columpio 'subibaja' (las vocales cambian: i-i-a)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "saca + puntas = (sacapunta/sacapuntas/sacapunto)"
        correctAnswer: sacapuntas
        rationale: "Une saca + puntas → 'sacapuntas' (instrumento para afilar lápices)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "quita + manchas = (quitamanchas/quitemanchas/quitomanchas)"
        correctAnswer: quitamanchas
        rationale: "Une quita + manchas → 'quitamanchas' (producto de limpieza)."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Descompón la Palabra
    description: Identifica los dos componentes de la palabra compuesta.
    exercises:
      - type: vocab
        question: "'paraguas' se forma de (para + aguas/pera + aguas/puro + aguas)"
        correctAnswer: para + aguas
        rationale: "'Paraguas' = para (detener) + aguas (lluvia)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "'sacapuntas' se forma de (saca + puntas/saco + puntas/sacos + puntas)"
        correctAnswer: saca + puntas
        rationale: "'Sacapuntas' = saca + puntas."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "'lavaplatos' se forma de (lava + platos/lavo + platos/leva + platos)"
        correctAnswer: lava + platos
        rationale: "'Lavaplatos' = lava + platos."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "'cumpleaños' se forma de (cumple + años/cumple + año/cumpl + años)"
        correctAnswer: cumple + años
        rationale: "'Cumpleaños' = cumple + años (el día que se cumplen los años)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "'espantapájaros' se forma de (espanta + pájaros/espantar + pájaros/espanta + pájaro)"
        correctAnswer: espanta + pájaros
        rationale: "'Espantapájaros' = espanta + pájaros (muñeco que espanta aves)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "'pelirrojo' se forma de (pelo + rojo/peli + rojo/pelin + rojo)"
        correctAnswer: pelo + rojo
        rationale: "'Pelirrojo' = pelo + rojo (persona con pelo rojo; la 'o' final de 'pelo' cambia a 'i')."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "'altavoz' se forma de (alta + voz/alto + voz/altas + voces)"
        correctAnswer: alta + voz
        rationale: "'Altavoz' = alta + voz (dispositivo que emite voz alta)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "'ciempiés' se forma de (cien + pies/ciento + pies/cientos + pies)"
        correctAnswer: cien + pies
        rationale: "'Ciempiés' = cien + pies (insecto con muchos pies)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "'bocacalle' se forma de (boca + calle/bocas + calles/boca + calles)"
        correctAnswer: boca + calle
        rationale: "'Bocacalle' = boca + calle (entrada a una calle)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "'correcaminos' se forma de (corre + caminos/correr + caminos/corres + caminos)"
        correctAnswer: corre + caminos
        rationale: "'Correcaminos' = corre + caminos (ave que corre por caminos)."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
