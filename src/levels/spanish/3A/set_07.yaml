title: Sinónimos - Palabras de Igual Significado
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Palabras distintas con el mismo significado. Pensar primero en el significado antes de elegir el sinónimo."
example: "Sinónimo de 'bonito' → hermoso. Sinónimo de 'rápido' → veloz."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Adjetivos Sinónimos
    description: Elige el sinónimo del adjetivo dado.
    exercises:
      - type: vocab
        question: "Sinónimo de 'bonito' (feo/hermoso/triste)"
        correctAnswer: hermoso
        rationale: "'Hermoso' y 'bonito' expresan belleza."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'rápido' (lento/veloz/alto)"
        correctAnswer: veloz
        rationale: "'Veloz' indica alta velocidad, igual que 'rápido'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'grande' (pequeño/enorme/bajo)"
        correctAnswer: enorme
        rationale: "'Enorme' intensifica 'grande'; ambos indican tamaño mayor."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'triste' (alegre/melancólico/contento)"
        correctAnswer: melancólico
        rationale: "'Melancólico' indica un tipo profundo de tristeza."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'contento' (enfadado/feliz/cansado)"
        correctAnswer: feliz
        rationale: "'Feliz' comparte el sentido de alegría con 'contento'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'difícil' (fácil/complicado/sencillo)"
        correctAnswer: complicado
        rationale: "'Complicado' y 'difícil' indican dificultad."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'fácil' (difícil/sencillo/complicado)"
        correctAnswer: sencillo
        rationale: "'Sencillo' y 'fácil' expresan falta de dificultad."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'sucio' (limpio/mugriento/brillante)"
        correctAnswer: mugriento
        rationale: "'Mugriento' intensifica 'sucio'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'limpio' (sucio/aseado/roto)"
        correctAnswer: aseado
        rationale: "'Aseado' y 'limpio' describen ausencia de suciedad."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'frío' (helado/caliente/tibio)"
        correctAnswer: helado
        rationale: "'Helado' intensifica 'frío'."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Sustantivos y Verbos Sinónimos
    description: Elige el sinónimo.
    exercises:
      - type: vocab
        question: "Sinónimo de 'casa' (coche/hogar/libro)"
        correctAnswer: hogar
        rationale: "'Hogar' y 'casa' designan la vivienda."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'empezar' (terminar/iniciar/parar)"
        correctAnswer: iniciar
        rationale: "'Iniciar' y 'empezar' significan dar comienzo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'mirar' (oír/observar/tocar)"
        correctAnswer: observar
        rationale: "'Observar' y 'mirar' usan la vista."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'hablar' (gritar/conversar/callar)"
        correctAnswer: conversar
        rationale: "'Conversar' y 'hablar' implican intercambio verbal."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'andar' (correr/caminar/saltar)"
        correctAnswer: caminar
        rationale: "'Caminar' y 'andar' son sinónimos del movimiento a pie."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'regalo' (precio/presente/deseo)"
        correctAnswer: presente
        rationale: "'Presente' también significa regalo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'profesor' (alumno/maestro/director)"
        correctAnswer: maestro
        rationale: "'Maestro' y 'profesor' se usan para quien enseña."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'automóvil' (avión/coche/barco)"
        correctAnswer: coche
        rationale: "'Coche' y 'automóvil' nombran el mismo vehículo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'dormir' (correr/descansar/gritar)"
        correctAnswer: descansar
        rationale: "'Descansar' y 'dormir' se asocian al reposo del cuerpo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sinónimo de 'reír' (llorar/sonreír/gritar)"
        correctAnswer: sonreír
        rationale: "'Sonreír' y 'reír' expresan alegría con el rostro."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
