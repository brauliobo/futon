title: Revisión General 3A
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Repaso integral de 3A: palabras compuestas, sinónimos, demostrativos, negación, tiempo, ser/estar, conjugación. Pensar primero en qué pide la pregunta."
example: "Repasa lo aprendido. Ej.: Sinónimo de 'bonito' → hermoso."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Vocabulario y Compuestos
    description: Preguntas mezcladas.
    exercises:
      - type: vocab
        question: "Sinónimo de 'rápido' (lento/veloz/alto)"
        correctAnswer: veloz
        rationale: "'Veloz' y 'rápido' indican alta velocidad."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "saca + puntas = (sacapunta/sacapuntas/sacopunto)"
        correctAnswer: sacapuntas
        rationale: "Une saca + puntas → 'sacapuntas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Cae agua del cielo → (llueve/nieva/tuena)"
        correctAnswer: llueve
        rationale: "Cae agua del cielo = 'llueve'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Parte alta de tierra elevada (valle/montaña/desierto)"
        correctAnswer: montaña
        rationale: "La montaña es una elevación alta."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Lugar de clases (aula/patio/baño)"
        correctAnswer: aula
        rationale: "El aula es donde se imparten las clases."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "30 se escribe (veinte/treinta/cuarenta)"
        correctAnswer: treinta
        rationale: "30 = treinta."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Deporte con raqueta y pelota (fútbol/tenis/boxeo)"
        correctAnswer: tenis
        rationale: "El tenis usa raqueta."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Saltar con cuerda (escondite/comba/rayuela)"
        correctAnswer: comba
        rationale: "La comba es cuerda para saltar."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "'paraguas' se forma de (pero + aguas/para + aguas/paran + aguas)"
        correctAnswer: para + aguas
        rationale: "'Paraguas' = para + aguas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Cría de la oveja (potro/cordero/ternero)"
        correctAnswer: cordero
        rationale: "La cría de la oveja es el cordero."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Gramática y Lengua
    description: Preguntas mezcladas de gramática.
    exercises:
      - type: grammar
        question: "'Yo ___ agua' (bebo/bebe/beben)"
        correctAnswer: bebo
        rationale: "'Yo' + -er → -o: bebo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ en el parque' (juegan/juega/jugamos)"
        correctAnswer: jugamos
        rationale: "Nosotros -ar → -amos: jugamos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ pan' (come/comen/comemos)"
        correctAnswer: comen
        rationale: "Ellos -er → -en: comen."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No veo ___ interesante' (nada/nadie/nunca)"
        correctAnswer: nada
        rationale: "Niega la cosa → 'nada'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Montaña lejana (este/ese/aquel) (monte masculino)"
        correctAnswer: aquel
        rationale: "Muy lejano, masculino singular → 'aquel'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ manzana roja' (un/una)"
        correctAnswer: una
        rationale: "'Manzana' femenino singular → una."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ libros interesantes' (unos/unas)"
        correctAnswer: unos
        rationale: "'Libros' masculino plural → unos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ana ___ española' (es/está)"
        correctAnswer: es
        rationale: "Nacionalidad → SER."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Pedro ___ en casa' (es/está)"
        correctAnswer: está
        rationale: "Ubicación → ESTAR."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El café ___ caliente' (es/está)"
        correctAnswer: está
        rationale: "Estado temporal → ESTAR."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
