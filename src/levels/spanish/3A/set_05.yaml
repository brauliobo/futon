title: 📝 Frases Simples - Completar
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Completar frases con la palabra correcta según contexto. Pensar primero en el significado general."
example: "'El gato ___ leche' → bebe."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Acción Correcta
    description: Elige el verbo adecuado.
    exercises:
      - type: grammar
        question: "'El pájaro ___ en el cielo' (nada/vuela/corre)"
        correctAnswer: vuela
        rationale: "Los pájaros se desplazan por el aire: vuelan."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El pez ___ en el agua' (vuela/nada/corre)"
        correctAnswer: nada
        rationale: "Los peces se mueven en el agua: nadan."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El niño ___ la pelota' (bebe/lanza/come)"
        correctAnswer: lanza
        rationale: "A una pelota se le lanza."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El perro ___ pan' (bebe/come/lee)"
        correctAnswer: come
        rationale: "El pan es sólido: se come."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La vaca ___ hierba' (bebe/come/vuela)"
        correctAnswer: come
        rationale: "La hierba es sólida: la vaca la come."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El gato ___ leche' (nada/bebe/corre)"
        correctAnswer: bebe
        rationale: "La leche es líquida: se bebe."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El ratón ___ queso' (come/bebe/vuela)"
        correctAnswer: come
        rationale: "El queso es sólido: se come."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La abeja ___ miel' (come/produce/corre)"
        correctAnswer: produce
        rationale: "Las abejas producen miel a partir del néctar."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ un libro' (como/bebo/leo)"
        correctAnswer: leo
        rationale: "A un libro se le lee."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ un dibujo' (bebes/dibujas/vuelas)"
        correctAnswer: dibujas
        rationale: "Un dibujo se hace dibujando."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Sustantivo Correcto
    description: Elige el sustantivo adecuado.
    exercises:
      - type: grammar
        question: "'Abro la ___ para entrar' (silla/puerta/mesa)"
        correctAnswer: puerta
        rationale: "La puerta se abre para entrar o salir."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Miro por la ___ al jardín' (pared/ventana/techo)"
        correctAnswer: ventana
        rationale: "A través de la ventana se ve al exterior."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Escribo con un ___' (libro/lápiz/cuaderno)"
        correctAnswer: lápiz
        rationale: "Con el lápiz se escribe sobre el papel."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me pongo los ___ en los pies' (guantes/zapatos/gorros)"
        correctAnswer: zapatos
        rationale: "Los zapatos van en los pies."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Duermo en mi ___' (cama/mesa/silla)"
        correctAnswer: cama
        rationale: "La cama permite dormir: 'duermo en mi cama' cada noche."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El agua sale por el ___' (pared/grifo/libro)"
        correctAnswer: grifo
        rationale: "Del grifo sale el agua."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Pongo las llaves en mi ___' (bolsillo/plato/cuaderno)"
        correctAnswer: bolsillo
        rationale: "Las llaves se llevan en el bolsillo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El ___ brilla mucho al mediodía' (luna/sol/estrella)"
        correctAnswer: sol
        rationale: "El sol brilla con máxima intensidad al mediodía."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me seco con una ___ tras la ducha' (toalla/libro/mesa)"
        correctAnswer: toalla
        rationale: "Tras la ducha se usa la toalla para secarse."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Uso ___ para cortar el papel' (regla/tijeras/lápiz)"
        correctAnswer: tijeras
        rationale: "Las tijeras cortan papel."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
