title: Verbos - Nosotros y Ellos
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Presente en 1ª persona plural (nosotros: -amos, -emos, -imos) y 3ª plural (ellos: -an, -en). Pensar primero en el sujeto y la conjugación."
example: "Nosotros cant___ (-amos). Ellos com___ (-en)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Nosotros (-amos/-emos/-imos)
    description: Completa con la forma correcta.
    exercises:
      - type: grammar
        question: "'Nosotros ___ en el parque' (juegan/jugamos/juega)"
        correctAnswer: jugamos
        rationale: "Nosotros + verbo -ar → -amos: jugamos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ música' (escuchan/escucha/escuchamos)"
        correctAnswer: escuchamos
        rationale: "Nosotros -ar → -amos: escuchamos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ pan' (come/comemos/comen)"
        correctAnswer: comemos
        rationale: "Nosotros -er → -emos: comemos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ una carta' (escriben/escribe/escribimos)"
        correctAnswer: escribimos
        rationale: "Nosotros -ir → -imos: escribimos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ agua' (beben/bebe/bebemos)"
        correctAnswer: bebemos
        rationale: "Nosotros -er → -emos: bebemos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ en Madrid' (viven/vive/vivimos)"
        correctAnswer: vivimos
        rationale: "Nosotros -ir → -imos: vivimos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ la tarea' (estudia/estudian/estudiamos)"
        correctAnswer: estudiamos
        rationale: "Nosotros -ar → -amos: estudiamos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ un libro' (leemos/lee/leen)"
        correctAnswer: leemos
        rationale: "Nosotros -er → -emos: leemos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ rápido' (correr/corren/corremos)"
        correctAnswer: corremos
        rationale: "Nosotros -er → -emos: corremos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ al cine' (vamos/van/va)"
        correctAnswer: vamos
        rationale: "'Nosotros' con el verbo 'ir' → 'vamos'."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Ellos/Ellas (-an/-en)
    description: Completa con la forma correcta.
    exercises:
