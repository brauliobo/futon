title: 📝 Frases Negativas - No, Nunca, Nada, Nadie
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Negación en español: no (negación simple), nunca (tiempo), nada (cosa), nadie (persona), ningún/ninguna (cero de algo). Pensar primero a qué se refiere la negación."
example: "'___ como carne' → no. '___ viene' (persona) → nadie."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: No y Nunca
    description: Elige la negación correcta.
    exercises:
      - type: grammar
        question: "'Yo ___ como carne' (no/nunca/nada)"
        correctAnswer: no
        rationale: "Para negar un verbo se usa 'no' antes del verbo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ana ___ llega tarde' (no/nunca/nadie)"
        correctAnswer: nunca
        rationale: "'Nunca' niega el tiempo (en ningún momento)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ voy al cine' (siempre voy al cine → niega el verbo) (no/nadie/nada)"
        correctAnswer: no
        rationale: "'No' es negación simple del verbo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ miente' (nunca miente) (no/nunca/nada)"
        correctAnswer: nunca
        rationale: "'Nunca' significa en ningún momento."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ trabajan los domingos' (no/nunca/nadie)"
        correctAnswer: no
        rationale: "Negación simple del verbo con 'no'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ estudias los fines de semana' (no/nunca/nada)"
        correctAnswer: no
        rationale: "Negación simple → 'no'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ he visto un tigre real' (no/nunca/nada)"
        correctAnswer: nunca
        rationale: "'Nunca' niega que haya ocurrido jamás."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi hermana ___ habla en clase' (no/nunca/nadie)"
        correctAnswer: nunca
        rationale: "'Nunca' indica que no lo hace en ningún momento."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Pedro ___ le dice mentiras a mamá' (no/nunca/nada)"
        correctAnswer: nunca
        rationale: "'Nunca' niega el tiempo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ vas al parque el lunes' (no/nadie/nunca)"
        correctAnswer: no
        rationale: "Negación simple del verbo en un día concreto → 'no'."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Nada, Nadie, Ningún
    description: Elige la negación correcta.
    exercises:
      - type: grammar
        question: "'No veo ___' (objeto/cosa) (nada/nadie/nunca)"
        correctAnswer: nada
        rationale: "'Nada' niega la cosa vista."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No hay ___ en la sala' (persona) (nada/nadie/nunca)"
        correctAnswer: nadie
        rationale: "'Nadie' niega la persona."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No tengo ___ amigo aquí' (ningún/nada/nunca)"
        correctAnswer: ningún
        rationale: "'Ningún' niega la cantidad de un sustantivo masculino."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No tengo ___ idea' (ningún/ninguna/nada)"
        correctAnswer: ninguna
        rationale: "'Ninguna' niega la cantidad de un sustantivo femenino."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'En la cocina no queda ___' (nada/nadie/nunca)"
        correctAnswer: nada
        rationale: "No queda 'nada' (cosa)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No vino ___ a mi fiesta' (nada/nadie/nunca)"
        correctAnswer: nadie
        rationale: "'Nadie' niega la persona que vino."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Quieres comer algo?' — 'No quiero ___' (nada/nadie/nunca)"
        correctAnswer: nada
        rationale: "Para negar la cosa → 'nada'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No conozco a ___ en esta ciudad' (nada/nadie/nunca)"
        correctAnswer: nadie
        rationale: "'Nadie' niega la persona conocida."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No oigo ___ raro' (nada/nadie/nunca)"
        correctAnswer: nada
        rationale: "'Nada' niega la cosa oída."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No he recibido ___ carta' (ningún/ninguna/nada)"
        correctAnswer: ninguna
        rationale: "'Ninguna' niega cantidad de sustantivo femenino 'carta'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
