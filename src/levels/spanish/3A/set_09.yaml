title: Descripciones - Colores y Texturas
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Descripciones usando color y textura. Pensar primero en la cualidad característica del objeto."
example: "La lana es ___ → suave. El hielo es ___ → duro y frío."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Colores por Objeto
    description: Elige el color correcto de cada objeto.
    exercises:
      - type: grammar
        question: "'El carbón es ___' (blanco/negro/rojo)"
        correctAnswer: negro
        rationale: "El carbón tiene color negro característico."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La leche es ___' (verde/blanca/marrón)"
        correctAnswer: blanca
        rationale: "La leche tiene color blanco natural."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los pepinos son ___' (rojos/verdes/azules)"
        correctAnswer: verdes
        rationale: "Los pepinos tienen piel verde."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El fuego es ___' (azul/naranja/negro)"
        correctAnswer: naranja
        rationale: "Las llamas del fuego son naranjas o rojas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El agua limpia es ___' (negra/transparente/amarilla)"
        correctAnswer: transparente
        rationale: "El agua pura es transparente, sin color."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La sangre es ___' (verde/roja/azul)"
        correctAnswer: roja
        rationale: "La sangre humana es de color rojo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El cielo sin nubes es ___' (verde/azul/rojo)"
        correctAnswer: azul
        rationale: "El cielo despejado es azul."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La arena de la playa suele ser ___' (negra/amarilla/verde)"
        correctAnswer: amarilla
        rationale: "La arena suele tener tono dorado o amarillo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El oso polar es ___' (negro/blanco/marrón)"
        correctAnswer: blanco
        rationale: "El oso polar tiene pelaje blanco para camuflarse en la nieve."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La piel del elefante es ___' (rosa/gris/verde)"
        correctAnswer: gris
        rationale: "El elefante tiene piel gris."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Texturas y Sensaciones
    description: Elige la textura o sensación adecuada.
    exercises:
      - type: grammar
        question: "'La lana es ___' (áspera/suave/dura)"
        correctAnswer: suave
        rationale: "La lana al tacto se siente suave."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Una piedra es ___' (blanda/dura/suave)"
        correctAnswer: dura
        rationale: "La piedra es dura al tacto; resiste la presión."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La almohada es ___' (rígida/blanda/punzante)"
        correctAnswer: blanda
        rationale: "La almohada es blanda para apoyar la cabeza."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Una espina es ___' (suave/punzante/redonda)"
        correctAnswer: punzante
        rationale: "Una espina tiene punta aguda: es punzante."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El papel de lija es ___' (suave/áspero/liso)"
        correctAnswer: áspero
        rationale: "El papel de lija tiene superficie rugosa: es áspero."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El cristal es ___' (áspero/liso/blando)"
        correctAnswer: liso
        rationale: "El cristal tiene superficie lisa sin irregularidades."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El hielo se siente ___' (caliente/tibio/frío)"
        correctAnswer: frío
        rationale: "El hielo está a muy baja temperatura: es frío al tocar."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El pelo del gato es ___' (áspero/suave/duro)"
        correctAnswer: suave
        rationale: "El pelo del gato es suave al tacto."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Una piña por fuera es ___' (blanda/punzante/lisa)"
        correctAnswer: punzante
        rationale: "La cáscara de la piña tiene puntas punzantes."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Una esponja es ___' (dura/blanda/fría)"
        correctAnswer: blanda
        rationale: "La esponja es blanda y absorbente."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
