title: 📝 Lectura Simple - En el Circo
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Lectura narrativa con vocabulario visual del circo. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿A dónde fueron? → circo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: El Cuento
    description: "Historia: El sábado fuimos al circo con mis primos. La carpa era roja y amarilla. Había un payaso con una nariz grande que nos hizo reír mucho. Luego salió un tigre obediente con su domador. Una trapecista volaba por el aire con mucha gracia. Al final, un mago sacó una paloma de un sombrero. Comimos palomitas y bebimos limonada."
    exercises:
      - type: reading
        question: "¿Qué día fueron? (viernes/sábado/domingo)"
        correctAnswer: sábado
        rationale: "El texto: 'El sábado fuimos al circo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con quién fueron? (amigos/hermanos/primos)"
        correctAnswer: primos
        rationale: "El texto: 'con mis primos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué colores era la carpa? (azul y blanca/roja y amarilla/verde y negra)"
        correctAnswer: roja y amarilla
        rationale: "El texto: 'carpa era roja y amarilla'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tenía el payaso? (sombrero/nariz grande/paraguas)"
        correctAnswer: nariz grande
        rationale: "El texto: 'payaso con una nariz grande'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo era el tigre? (agresivo/obediente/cobarde)"
        correctAnswer: obediente
        rationale: "El texto: 'un tigre obediente'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién estaba con el tigre? (payaso/mago/domador)"
        correctAnswer: domador
        rationale: "El texto: 'con su domador'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hacía la trapecista? (bailaba/volaba/gritaba)"
        correctAnswer: volaba
        rationale: "El texto: 'volaba por el aire'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué sacó el mago del sombrero? (conejo/paloma/pañuelo)"
        correctAnswer: paloma
        rationale: "El texto: 'sacó una paloma de un sombrero'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué comieron? (chocolate/palomitas/caramelos)"
        correctAnswer: palomitas
        rationale: "El texto: 'Comimos palomitas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué bebieron? (agua/zumo/limonada)"
        correctAnswer: limonada
        rationale: "El texto: 'bebimos limonada'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
