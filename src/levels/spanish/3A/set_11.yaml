title: 📝 Demostrativos - Este, Ese, Aquel
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Demostrativos por distancia: este/esta (cerca del hablante), ese/esa (distancia media), aquel/aquella (lejos). Pensar primero en la distancia al hablante."
example: "Libro cerca de mí → este libro. Libro lejos → aquel libro."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Distancia al Hablante
    description: Elige el demostrativo adecuado.
    exercises:
      - type: grammar
        question: "Libro que tengo en la mano (este/ese/aquel)"
        correctAnswer: este
        rationale: "Lo que está en mi mano está cerca de mí → este."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Silla a un par de metros (esta/esa/aquella)"
        correctAnswer: esa
        rationale: "A distancia media → 'esa'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Montaña en el horizonte (esta/esa/aquella)"
        correctAnswer: aquella
        rationale: "Algo muy lejano → 'aquella'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Taza en la mesa cerca de ti pero no mía (esta/esa/aquella)"
        correctAnswer: esa
        rationale: "Lo cercano al interlocutor pero no al hablante → 'esa'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Cuaderno que estoy tocando (este/ese/aquel)"
        correctAnswer: este
        rationale: "Al tocarlo está cerca de mí → 'este'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Edificio lejano que señalo desde la ventana (este/ese/aquel)"
        correctAnswer: aquel
        rationale: "Algo a gran distancia del hablante → 'aquel'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Manzana que sostengo en la mano (esta/esa/aquella)"
        correctAnswer: esta
        rationale: "En mi mano → 'esta'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Árbol que vemos al fondo del parque (este/ese/aquel)"
        correctAnswer: aquel
        rationale: "Algo al fondo, lejos, → 'aquel'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Pelota rodando cerca de tus pies (esta/esa/aquella)"
        correctAnswer: esa
        rationale: "Cerca del interlocutor → 'esa'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Lápiz que tengo sobre mi escritorio (este/ese/aquel)"
        correctAnswer: este
        rationale: "En mi mesa → 'este'."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Plurales y Género
    description: Elige el demostrativo en plural o en el género correcto.
    exercises:
      - type: grammar
        question: "Libros sobre mi mesa (estos/esos/aquellos)"
        correctAnswer: estos
        rationale: "Cerca de mí, masculino plural → 'estos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Casas en la otra calle (estas/esas/aquellas)"
        correctAnswer: esas
        rationale: "A distancia media, femenino plural → 'esas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Estrellas lejanas en el cielo (estas/esas/aquellas)"
        correctAnswer: aquellas
        rationale: "Muy lejos, femenino plural → 'aquellas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Tres niños que corren junto a mí (estos/esos/aquellos)"
        correctAnswer: estos
        rationale: "Junto a mí, masculino plural → 'estos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Flores en el prado al fondo (estas/esas/aquellas)"
        correctAnswer: aquellas
        rationale: "Lejanas, femenino plural → 'aquellas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Coches aparcados cerca de ti (estos/esos/aquellos)"
        correctAnswer: esos
        rationale: "Cerca del interlocutor, masculino plural → 'esos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Camisas en el armario de mi habitación (estas/esas/aquellas)"
        correctAnswer: estas
        rationale: "Cerca de mí, femenino plural → 'estas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Edificios del centro histórico lejano (estos/esos/aquellos)"
        correctAnswer: aquellos
        rationale: "Lejanos, masculino plural → 'aquellos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Zapatos que tienes puestos (estos/esos/aquellos)"
        correctAnswer: esos
        rationale: "Los del interlocutor → 'esos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Rosas del jardín de la vecina (estas/esas/aquellas)"
        correctAnswer: esas
        rationale: "No en mi jardín pero tampoco muy lejos → 'esas'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
