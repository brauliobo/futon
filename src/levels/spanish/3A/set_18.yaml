title: Ser y Estar - Uso Básico
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "SER: identidad, profesión, nacionalidad, cualidad permanente. ESTAR: ubicación, estado temporal, sentimiento momentáneo. Pensar primero si lo descrito es permanente (ser) o temporal (estar)."
example: "'Ana ___ alta' (cualidad permanente) → es. 'Ana ___ contenta hoy' (estado) → está."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Ser para Identidad y Cualidad
    description: Elige 'ser' o 'estar' según el contexto.
    exercises:
      - type: grammar
        question: "'Yo ___ estudiante' (soy/estoy)"
        correctAnswer: soy
        rationale: "Profesión → SER: 'soy estudiante'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ española' (es/está)"
        correctAnswer: es
        rationale: "Nacionalidad → SER: 'es española'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Pedro ___ alto' (cualidad permanente) (es/está)"
        correctAnswer: es
        rationale: "Característica permanente → SER."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ hermanos' (somos/estamos)"
        correctAnswer: somos
        rationale: "Relación familiar → SER: 'somos hermanos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ médico' (profesión) (eres/estás)"
        correctAnswer: eres
        rationale: "Profesión → SER: 'eres médico'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El cielo ___ azul' (generalmente) (es/está)"
        correctAnswer: es
        rationale: "Cualidad general → SER."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Hoy ___ lunes' (es/está)"
        correctAnswer: es
        rationale: "Día → SER: 'es lunes'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ profesores' (son/están)"
        correctAnswer: son
        rationale: "Profesión → SER."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ tú de Madrid?' (eres/estás)"
        correctAnswer: eres
        rationale: "Origen → SER: '¿eres de Madrid?'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi hermano ___ inteligente' (cualidad duradera) (es/está)"
        correctAnswer: es
        rationale: "Rasgo permanente → SER."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Estar para Estado y Ubicación
    description: Elige 'ser' o 'estar'.
    exercises:
      - type: grammar
        question: "'Ana ___ en casa' (es/está)"
        correctAnswer: está
        rationale: "Ubicación → ESTAR: 'está en casa'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ contento hoy' (soy/estoy)"
        correctAnswer: estoy
        rationale: "Estado temporal de ánimo → ESTAR."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El café ___ caliente' (es/está)"
        correctAnswer: está
        rationale: "Estado temporal (pronto se enfriará) → ESTAR."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Madrid ___ en España' (es/está)"
        correctAnswer: está
        rationale: "Ubicación geográfica → ESTAR."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los niños ___ cansados' (son/están)"
        correctAnswer: están
        rationale: "Estado temporal → ESTAR."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi coche ___ en el garaje' (es/está)"
        correctAnswer: está
        rationale: "Ubicación → ESTAR."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La puerta ___ abierta' (es/está)"
        correctAnswer: está
        rationale: "Estado temporal (puede cerrarse) → ESTAR."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estoy enfermo hoy' — '___' (es/estoy)"
        correctAnswer: estoy
        rationale: "Enfermedad temporal → ESTAR."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ triste' (eres/estás)"
        correctAnswer: estás
        rationale: "Estado de ánimo temporal → ESTAR."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ aquí' (somos/estamos)"
        correctAnswer: estamos
        rationale: "Ubicación → ESTAR."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
