title: 🌟 El Tiempo Atmosférico
level: 3A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Vocabulario del tiempo meteorológico. Pensar primero en el fenómeno que se describe."
example: "Cae agua del cielo → llueve. Sale el sol y no hay nubes → despejado."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Fenómenos del Cielo
    description: Identifica el fenómeno atmosférico.
    exercises:
      - type: spanish_vocab
        question: "Cae agua del cielo (hacer sol/nevar/llover)"
        correctAnswer: llover
        rationale: "Cuando cae agua del cielo decimos 'llueve'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Cae agua congelada blanca (granizo/lluvia/nieve)"
        correctAnswer: nieve
        rationale: "La nieve es agua congelada que cae en copos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Caen pequeñas bolas de hielo (nieve/granizo/niebla)"
        correctAnswer: granizo
        rationale: "El granizo cae en forma de bolas duras de hielo."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Luz intensa en la tormenta (rayo/lluvia/nube)"
        correctAnswer: rayo
        rationale: "El rayo es el destello eléctrico en la tormenta."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Ruido fuerte después del rayo (lluvia/trueno/viento)"
        correctAnswer: trueno
        rationale: "El trueno es el estruendo que sigue al rayo."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Nube baja que reduce la visibilidad (lluvia/niebla/rayo)"
        correctAnswer: niebla
        rationale: "La niebla es una nube al nivel del suelo."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Aire en movimiento (nieve/viento/niebla)"
        correctAnswer: viento
        rationale: "El viento es el aire que se mueve."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Viento muy fuerte que gira (brisa/huracán/niebla)"
        correctAnswer: huracán
        rationale: "El huracán es un viento giratorio muy potente."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Arco de colores tras la lluvia (rayo/arcoíris/nube)"
        correctAnswer: arcoíris
        rationale: "El arcoíris aparece cuando el sol atraviesa las gotas de lluvia."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Cielo sin nubes (despejado/nublado/lluvioso)"
        correctAnswer: despejado
        rationale: "Sin nubes se dice 'cielo despejado'."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Sensaciones Térmicas
    description: Elige la palabra adecuada al clima.
    exercises:
      - type: spanish_vocab
        question: "Hace ___ en el desierto a mediodía (frío/calor/viento)"
        correctAnswer: calor
        rationale: "Regla climática: el desierto tiene mucho calor a mediodía — sol vertical y poca humedad disipan rápido."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Hace ___ en la Antártida (fresco/frío/calor)"
        correctAnswer: frío
        rationale: "La Antártida está extremadamente fría."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "En primavera el clima es ___ (templado/gélido/ardiente)"
        correctAnswer: templado
        rationale: "Define: primavera = estación de temperaturas templadas, intermedias entre invierno y verano."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "En verano hace ___ (frío/calor/fresco)"
        correctAnswer: calor
        rationale: "En verano hace calor porque es la estación más calurosa del año."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "En invierno hace ___ (calor/frío/templado)"
        correctAnswer: frío
        rationale: "En invierno hace frío porque es la estación más fría del año."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Aire ligero que acaricia la cara (brisa/huracán/tempestad)"
        correctAnswer: brisa
        rationale: "La brisa es un viento suave y ligero que acaricia sin fuerza."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Gotas pequeñas de lluvia muy fina (llovizna/huracán/tormenta)"
        correctAnswer: llovizna
        rationale: "La llovizna es lluvia muy fina y ligera."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Lluvia con rayos y truenos (llovizna/tormenta/niebla)"
        correctAnswer: tormenta
        rationale: "La tormenta incluye lluvia intensa con rayos y truenos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Ausencia prolongada de lluvia (inundación/sequía/niebla)"
        correctAnswer: sequía
        rationale: "La sequía es un período largo sin lluvias."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Muchos días de lluvia que desbordan ríos (sequía/inundación/niebla)"
        correctAnswer: inundación
        rationale: "La inundación ocurre cuando el agua desborda su cauce."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
