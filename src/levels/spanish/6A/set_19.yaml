title: ✏️ Palabras Simples - La Ropa
level: 6A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Vocabulario de prendas de vestir. Pensar primero en qué parte del cuerpo cubre."
example: "Se pone en los pies → zapatos."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Ropa de Diario
    description: Identifica la prenda por la parte del cuerpo que cubre.
    exercises:
      - type: spanish_vocab
        question: "Se pone en los pies (gorro/camisa/zapatos)"
        correctAnswer: zapatos
        rationale: "Los zapatos cubren y protegen los pies."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se pone en la cabeza (zapatos/gorro/camisa)"
        correctAnswer: gorro
        rationale: "El gorro abriga la cabeza."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se lleva en las piernas (camisa/pantalón/gorro)"
        correctAnswer: pantalón
        rationale: "El pantalón cubre ambas piernas."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Cubre el torso y los brazos (pantalón/camisa/gorro)"
        correctAnswer: camisa
        rationale: "La camisa cubre el torso y tiene mangas para los brazos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Prenda corta para arriba (camiseta/pantalón/zapato)"
        correctAnswer: camiseta
        rationale: "La camiseta es similar a la camisa pero más informal y sin botones."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Prenda que cubre las piernas con una pieza (camiseta/falda/calcetines)"
        correctAnswer: falda
        rationale: "La falda es una prenda que cubre la parte inferior del cuerpo."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se ponen en los pies debajo del zapato (zapatos/gorro/calcetines)"
        correctAnswer: calcetines
        rationale: "Los calcetines van sobre los pies, bajo los zapatos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Abriga en invierno encima de la camisa (falda/abrigo/calcetines)"
        correctAnswer: abrigo
        rationale: "El abrigo es una prenda gruesa que se pone encima para el frío."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se pone en las manos para calentarlas (bufanda/guantes/gorro)"
        correctAnswer: guantes
        rationale: "Los guantes cubren y calientan las manos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se enrolla al cuello (guantes/bufanda/gorro)"
        correctAnswer: bufanda
        rationale: "La bufanda se enrolla alrededor del cuello para abrigarlo."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Ocasiones y Complementos
    description: Identifica la prenda o complemento descrito.
    exercises:
      - type: spanish_vocab
        question: "Prenda de una pieza para mujer (vestido/traje/pantalón)"
        correctAnswer: vestido
        rationale: "El vestido es una prenda femenina de una sola pieza."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Conjunto elegante para hombre (vestido/traje/camiseta)"
        correctAnswer: traje
        rationale: "El traje es un conjunto de chaqueta y pantalón elegante."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se lleva en los ojos contra el sol (bufanda/gafas/gorro)"
        correctAnswer: gafas
        rationale: "Las gafas de sol protegen los ojos de la luz brillante."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Calzado para lluvia (zapato/bota/sandalia)"
        correctAnswer: bota
        rationale: "Las botas son calzado alto y resistente al agua y a la lluvia."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Calzado abierto para verano (bota/sandalia/zapato)"
        correctAnswer: sandalia
        rationale: "La sandalia es abierta y fresca, ideal para el verano."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se pone sobre la ropa en invierno con capucha (cazadora/traje/camisa)"
        correctAnswer: cazadora
        rationale: "La cazadora es un abrigo corto con cremallera y, a veces, capucha."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Ropa para nadar (bañador/abrigo/traje)"
        correctAnswer: bañador
        rationale: "El bañador se lleva para nadar en piscinas y playas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se lleva en la muñeca para saber la hora (pulsera/reloj/collar)"
        correctAnswer: reloj
        rationale: "El reloj se coloca en la muñeca y marca la hora."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Complemento circular en el cuello (pulsera/collar/anillo)"
        correctAnswer: collar
        rationale: "El collar es una cadena o hilo con adornos alrededor del cuello."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Complemento que se pone en el dedo (collar/pulsera/anillo)"
        correctAnswer: anillo
        rationale: "El anillo se coloca alrededor del dedo."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
