title: ✏️ Palabras Simples - Objetos de Casa
level: 6A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Vocabulario de objetos domésticos. Pensar primero en la función del objeto antes de elegir."
example: "Sirve para sentarse → silla."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Sala y Comedor
    description: Identifica el objeto por su función.
    exercises:
      - type: spanish_vocab
        question: "Sirve para sentarse (silla/mesa/cama)"
        correctAnswer: silla
        rationale: "Compara función: silla → sentarse, mesa → apoyar objetos. Mobiliario doméstico básico."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Sirve para comer encima (silla/mesa/cama)"
        correctAnswer: mesa
        rationale: "Define: mesa = mueble con superficie horizontal para comer, escribir o trabajar."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Sirve para dormir (silla/mesa/cama)"
        correctAnswer: cama
        rationale: "La cama se usa para dormir; las sillas no."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Sirve para ver imágenes (radio/televisión/libro)"
        correctAnswer: televisión
        rationale: "La televisión muestra imágenes; la radio solo sonidos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Sirve para iluminar (lámpara/cortina/alfombra)"
        correctAnswer: lámpara
        rationale: "La lámpara da luz; las cortinas la tapan."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Cubre el suelo (lámpara/cortina/alfombra)"
        correctAnswer: alfombra
        rationale: "La alfombra se coloca sobre el suelo."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Tapa la ventana (cortina/alfombra/lámpara)"
        correctAnswer: cortina
        rationale: "La cortina cuelga sobre la ventana para cubrirla."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Tiene libros ordenados (cama/estantería/lámpara)"
        correctAnswer: estantería
        rationale: "La estantería tiene baldas donde se colocan libros."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Mueble blando para varias personas (silla/sofá/mesa)"
        correctAnswer: sofá
        rationale: "El sofá es amplio y acolchado para sentarse varias personas."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Marca la hora (radio/reloj/cortina)"
        correctAnswer: reloj
        rationale: "El reloj muestra la hora; la radio da sonido."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Cocina y Baño
    description: Identifica el objeto por su función.
    exercises:
      - type: spanish_vocab
        question: "Enfría comida (nevera/horno/lavadora)"
        correctAnswer: nevera
        rationale: "La nevera mantiene la comida fría; el horno la calienta."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Cocina al calor fuerte (nevera/horno/microondas)"
        correctAnswer: horno
        rationale: "Define: horno = electrodoméstico que calienta y cocina alimentos por aire caliente."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Lava la ropa (nevera/lavadora/horno)"
        correctAnswer: lavadora
        rationale: "Define: lavadora = electrodoméstico que lava la ropa usando agua y detergente."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se usa para beber agua (plato/vaso/cuchillo)"
        correctAnswer: vaso
        rationale: "El vaso es el recipiente para beber líquidos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se usa para cortar (cuchara/cuchillo/tenedor)"
        correctAnswer: cuchillo
        rationale: "Define: cuchillo = utensilio de cocina con filo afilado para cortar alimentos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se usa para tomar sopa (tenedor/cuchara/cuchillo)"
        correctAnswer: cuchara
        rationale: "La cuchara recoge líquidos como sopas; el tenedor pincha sólidos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Tiene púas para pinchar comida (cuchara/tenedor/cuchillo)"
        correctAnswer: tenedor
        rationale: "Define: tenedor = utensilio con púas (3-4) para pinchar y llevar comida a la boca."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Recipiente plano para servir (plato/vaso/cuchara)"
        correctAnswer: plato
        rationale: "El plato es plano y sirve para presentar la comida."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se usa para lavarse las manos (ducha/lavabo/bañera)"
        correctAnswer: lavabo
        rationale: "El lavabo es pequeño y está a la altura de las manos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se usa para secarse después del baño (cepillo/toalla/jabón)"
        correctAnswer: toalla
        rationale: "Define: toalla = pieza de tejido absorbente que seca el agua del cuerpo tras el baño."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
