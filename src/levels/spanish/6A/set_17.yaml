title: ✏️ Palabras Simples - El Cuerpo
level: 6A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Partes del cuerpo humano. Pensar primero en la ubicación o función de la parte."
example: "Parte del cuerpo para ver → ojos."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: La Cabeza
    description: Identifica la parte de la cabeza por su función.
    exercises:
      - type: spanish_vocab
        question: "Parte para ver (boca/oídos/ojos)"
        correctAnswer: ojos
        rationale: "Los ojos captan la luz y permiten ver."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Parte para oír (nariz/ojos/oídos)"
        correctAnswer: oídos
        rationale: "Los oídos reciben los sonidos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Parte para oler (ojos/nariz/boca)"
        correctAnswer: nariz
        rationale: "La nariz percibe los olores."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Parte para comer y hablar (oídos/nariz/boca)"
        correctAnswer: boca
        rationale: "Define: boca = órgano que sirve para comer y para articular palabras al hablar."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Piezas blancas dentro de la boca (lengua/dientes/labios)"
        correctAnswer: dientes
        rationale: "Los dientes son piezas blancas que sirven para masticar."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Músculo móvil dentro de la boca (dientes/lengua/labios)"
        correctAnswer: lengua
        rationale: "La lengua se mueve y permite saborear y hablar."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Bordes blandos de la boca (dientes/lengua/labios)"
        correctAnswer: labios
        rationale: "Los labios cierran la boca y forman su borde."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Crece sobre la cabeza (uña/pelo/oreja)"
        correctAnswer: pelo
        rationale: "Define: pelo = filamento queratinoso que crece en el cuero cabelludo y otras partes del cuerpo."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Parte externa donde se pone el pendiente (nariz/oreja/labio)"
        correctAnswer: oreja
        rationale: "La oreja es la parte externa del oído."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Parte de la cara debajo de la boca (frente/mejilla/barbilla)"
        correctAnswer: barbilla
        rationale: "La barbilla está debajo de la boca, al final de la cara."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: El Tronco y Extremidades
    description: Identifica la parte del cuerpo por su función.
    exercises:
      - type: spanish_vocab
        question: "Se usa para caminar (brazo/pierna/mano)"
        correctAnswer: pierna
        rationale: "Las piernas sostienen el cuerpo y permiten caminar."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Se usa para agarrar objetos (pie/mano/pierna)"
        correctAnswer: mano
        rationale: "Define: mano = parte final del brazo que, con sus cinco dedos, agarra y manipula objetos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Une la mano al tronco (pierna/brazo/pie)"
        correctAnswer: brazo
        rationale: "El brazo conecta el tronco con la mano."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Apoyo al final de la pierna (mano/pie/brazo)"
        correctAnswer: pie
        rationale: "Define: pie = extremidad inferior al final de la pierna que sostiene el peso del cuerpo al estar de pie."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Órgano que bombea sangre (pulmón/corazón/hígado)"
        correctAnswer: corazón
        rationale: "El corazón impulsa la sangre por el cuerpo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Órgano para respirar (pulmones/corazón/estómago)"
        correctAnswer: pulmones
        rationale: "Los pulmones toman aire con el oxígeno."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Órgano que digiere la comida (corazón/estómago/pulmón)"
        correctAnswer: estómago
        rationale: "El estómago recibe los alimentos y los digiere."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Parte blanda del final del dedo (uña/piel/hueso)"
        correctAnswer: uña
        rationale: "Define: uña = lámina córnea dura que protege la punta de los dedos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Une la cabeza al tronco (espalda/cuello/pierna)"
        correctAnswer: cuello
        rationale: "El cuello conecta la cabeza con el tronco."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Parte posterior del tronco (pecho/espalda/pie)"
        correctAnswer: espalda
        rationale: "La espalda es la parte de atrás del tronco."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
