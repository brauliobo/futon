title: Revisión General 6A
level: 6A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Repaso integral de 6A: vocales, sílabas simples, vocabulario básico y números. Pensar primero en qué tipo de pregunta es antes de responder."
example: "Repasa lo aprendido. Ej.: Primera sílaba de 'sala' → SA."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Vocales y Sílabas
    description: Preguntas mezcladas de reconocimiento de vocales y sílabas.
    exercises:
      - type: reading
        question: "¿Cuál es vocal? (K/U/S)"
        correctAnswer: U
        rationale: "Las vocales son A E I O U; U es vocal, K y S son consonantes."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'barco' (BO/BA/BE)"
        correctAnswer: BA
        rationale: "Divide 'barco' en BAR-CO; empieza por BA."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'cena' (CA/CE/CI)"
        correctAnswer: CE
        rationale: "Divide 'cena' en CE-NA; la primera sílaba es CE."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'dado' (DE/DA/DI)"
        correctAnswer: DA
        rationale: "Divide 'dado' en DA-DO; la primera sílaba es DA."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'foto' (FA/FE/FO)"
        correctAnswer: FO
        rationale: "Divide 'foto' en FO-TO; la primera sílaba es FO."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'lupa' (LE/LA/LU)"
        correctAnswer: LU
        rationale: "Divide 'lupa' en LU-PA; la primera sílaba es LU."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'miel' (MO/MA/MI)"
        correctAnswer: MI
        rationale: "Divide 'miel' en MIEL; empieza por MI."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'pato' (PE/PA/PO)"
        correctAnswer: PA
        rationale: "Divide 'pato' en PA-TO; la primera sílaba es PA."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'sopa' (SE/SA/SO)"
        correctAnswer: SO
        rationale: "Divide 'sopa' en SO-PA; la primera sílaba es SO."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'taza' (TE/TA/TO)"
        correctAnswer: TA
        rationale: "Divide 'taza' en TA-ZA; la primera sílaba es TA."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Vocabulario y Números
    description: Preguntas mezcladas de vocabulario básico y números.
    exercises:
      - type: vocab
        question: "Animal que maúlla (perro/gato/pez)"
        correctAnswer: gato
        rationale: "El gato maúlla; el perro ladra y el pez no hace sonido."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Color de la hierba (rojo/verde/azul)"
        correctAnswer: verde
        rationale: "La hierba fresca es verde."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Madre de mi madre (tía/abuela/prima)"
        correctAnswer: abuela
        rationale: "Primero piensa en la generación anterior: la madre de tu madre es tu abuela."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Fruta amarilla alargada (manzana/plátano/uva)"
        correctAnswer: plátano
        rationale: "El plátano es amarillo y alargado."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Parte del cuerpo para ver (oído/ojo/nariz)"
        correctAnswer: ojo
        rationale: "El ojo es el órgano de la vista."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Acción de moverse en el agua (correr/nadar/saltar)"
        correctAnswer: nadar
        rationale: "Nadar es desplazarse en el agua usando brazos y piernas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Se pone en los pies (zapato/gorro/pantalón)"
        correctAnswer: zapato
        rationale: "El zapato cubre y protege los pies."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Mueble para dormir (silla/mesa/cama)"
        correctAnswer: cama
        rationale: "La cama se usa para dormir."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Cuántos dedos tiene una mano (cuatro/cinco/seis)"
        correctAnswer: cinco
        rationale: "Una mano tiene cinco dedos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Número entre 'seis' y 'ocho' (cinco/siete/nueve)"
        correctAnswer: siete
        rationale: "Entre 6 y 8 está el 7 = siete."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
