title: Números en Palabras - Del Uno al Diez
level: 6A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Reconocimiento de los números del 1 al 10 escritos con letra. Primero cuenta con los dedos; luego busca la palabra."
example: "El número 1 se escribe → uno. El 5 se escribe → cinco."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Del 1 al 5
    description: Elige la palabra correcta para cada número.
    exercises:
      - type: vocab
        question: "1 se escribe (una/dos/uno)"
        correctAnswer: uno
        rationale: "El número 1 como cardinal masculino se escribe 'uno'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "2 se escribe (dos/tres/cuatro)"
        correctAnswer: dos
        rationale: "El número 2 se escribe 'dos'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "3 se escribe (dos/tres/seis)"
        correctAnswer: tres
        rationale: "El número 3 se escribe 'tres'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "4 se escribe (cinco/cuatro/cuarto)"
        correctAnswer: cuatro
        rationale: "El número cardinal 4 se escribe 'cuatro' (no 'cuarto', que es ordinal)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "5 se escribe (cuatro/cinco/seis)"
        correctAnswer: cinco
        rationale: "El número 5 se escribe 'cinco'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Número después de 'uno' (tres/cinco/dos)"
        correctAnswer: dos
        rationale: "En la secuencia 1, 2, 3… después de 'uno' viene 'dos'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Número antes de 'cuatro' (tres/cinco/dos)"
        correctAnswer: tres
        rationale: "En la secuencia 1, 2, 3, 4… antes de 'cuatro' viene 'tres'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Cuántos dedos tiene una mano (tres/cinco/cuatro)"
        correctAnswer: cinco
        rationale: "Una mano tiene cinco dedos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Número después de 'tres' (cinco/dos/cuatro)"
        correctAnswer: cuatro
        rationale: "Después de 'tres' viene 'cuatro' en la secuencia."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Número que sigue a 'dos' (cuatro/tres/uno)"
        correctAnswer: tres
        rationale: "Después de 'dos' viene 'tres'."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Del 6 al 10
    description: Elige la palabra correcta para cada número.
    exercises:
      - type: vocab
        question: "6 se escribe (cinco/seis/siete)"
        correctAnswer: seis
        rationale: "El número 6 se escribe 'seis'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "7 se escribe (seis/siete/ocho)"
        correctAnswer: siete
        rationale: "El número 7 se escribe 'siete'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "8 se escribe (siete/ocho/nueve)"
        correctAnswer: ocho
        rationale: "El número 8 se escribe 'ocho'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "9 se escribe (ocho/nueve/diez)"
        correctAnswer: nueve
        rationale: "El número 9 se escribe 'nueve'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "10 se escribe (nueve/diez/once)"
        correctAnswer: diez
        rationale: "El número 10 se escribe 'diez'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Cuántos dedos tienen dos manos (cinco/ocho/diez)"
        correctAnswer: diez
        rationale: "Dos manos tienen cinco + cinco = diez dedos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Número antes de 'diez' (ocho/nueve/siete)"
        correctAnswer: nueve
        rationale: "Antes de 'diez' en la secuencia viene 'nueve'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Número entre 'seis' y 'ocho' (siete/cinco/nueve)"
        correctAnswer: siete
        rationale: "Entre 6 y 8 está el 7 = 'siete'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Mitad de 'diez' (tres/cinco/cuatro)"
        correctAnswer: cinco
        rationale: "La mitad de 10 es 5 = 'cinco'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Doble de 'cuatro' (seis/ocho/diez)"
        correctAnswer: ocho
        rationale: "El doble de 4 es 8 = 'ocho'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
