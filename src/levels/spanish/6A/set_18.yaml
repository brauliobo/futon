title: ✏️ Palabras de Acción - Verbos Comunes
level: 6A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Verbos comunes como palabras de acción. Pensar primero en la acción que se realiza."
example: "Acción de mover los pies avanzando → caminar."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Acciones del Cuerpo
    description: Identifica la acción descrita.
    exercises:
      - type: spanish_vocab
        question: "Mover los pies para avanzar (saltar/correr/caminar)"
        correctAnswer: caminar
        rationale: "Caminar es el movimiento tranquilo de avance con los pies."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Moverse rápidamente con los pies (saltar/caminar/correr)"
        correctAnswer: correr
        rationale: "Correr es moverse rápidamente; caminar es más lento."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Impulsarse en el aire (caminar/correr/saltar)"
        correctAnswer: saltar
        rationale: "Saltar es impulsarse con los pies hacia arriba."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Moverse en el agua (saltar/correr/nadar)"
        correctAnswer: nadar
        rationale: "Nadar es desplazarse usando brazos y piernas en el agua."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Dormir (correr/comer/dormir)"
        correctAnswer: dormir
        rationale: "Dormir es descansar con los ojos cerrados."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Masticar y tragar alimentos (beber/comer/dormir)"
        correctAnswer: comer
        rationale: "Comer es masticar y tragar los alimentos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Tomar líquidos (comer/beber/saltar)"
        correctAnswer: beber
        rationale: "Beber es tomar líquidos; comer es para sólidos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Usar los ojos para percibir (oír/ver/oler)"
        correctAnswer: ver
        rationale: "Ver es el sentido que usa los ojos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Usar los oídos para percibir sonidos (ver/oír/oler)"
        correctAnswer: oír
        rationale: "Oír es el sentido que usa los oídos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Expresar alegría con sonidos (llorar/reír/gritar)"
        correctAnswer: reír
        rationale: "Reír es la expresión sonora de alegría."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Acciones Cotidianas
    description: Identifica la acción descrita.
    exercises:
      - type: spanish_vocab
        question: "Escribir con lápiz (dibujar/escribir/leer)"
        correctAnswer: escribir
        rationale: "Escribir es poner letras o palabras sobre papel."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Entender un texto con los ojos (escribir/leer/dibujar)"
        correctAnswer: leer
        rationale: "Leer es interpretar letras escritas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Hacer líneas y figuras (leer/escribir/dibujar)"
        correctAnswer: dibujar
        rationale: "Dibujar es hacer trazos para formar imágenes."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Emitir palabras con la boca (escuchar/hablar/comer)"
        correctAnswer: hablar
        rationale: "Hablar es emitir palabras con voz."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Atender lo que alguien dice (hablar/escuchar/ver)"
        correctAnswer: escuchar
        rationale: "Escuchar es prestar atención a lo que se oye."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Entonar con la voz (hablar/cantar/gritar)"
        correctAnswer: cantar
        rationale: "Cantar es emitir sonidos musicales con la voz."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Mover el cuerpo al ritmo (cantar/bailar/saltar)"
        correctAnswer: bailar
        rationale: "Bailar es mover el cuerpo siguiendo la música."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Divertirse con juguetes o juegos (trabajar/jugar/estudiar)"
        correctAnswer: jugar
        rationale: "Jugar es realizar actividades por diversión."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Aprender en un libro o clase (jugar/estudiar/dormir)"
        correctAnswer: estudiar
        rationale: "Estudiar es dedicarse a aprender."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Hacer tareas para ganar dinero (estudiar/jugar/trabajar)"
        correctAnswer: trabajar
        rationale: "Trabajar es realizar tareas normalmente por un salario."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
