title: 🔤 Sílabas Simples - TA TE TI TO TU
level: 6A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Sílabas con T + vocales. Primero identifica la vocal, luego únela a la T."
example: "Combina T + vocal. Ej.: T + A → TA ('taco' empieza por TA)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Las Cinco Sílabas con T
    description: Une la T con cada vocal.
    exercises:
      - type: reading
        question: "T + A = (TA/TE/TO)"
        correctAnswer: TA
        rationale: "Primero identifica la vocal A, luego únela a la T → TA."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "T + E = (TE/TI/TU)"
        correctAnswer: TE
        rationale: "Primero identifica la vocal E, luego únela a la T → TE."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "T + I = (TA/TI/TO)"
        correctAnswer: TI
        rationale: "Primero identifica la vocal I, luego únela a la T → TI."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "T + O = (TU/TO/TE)"
        correctAnswer: TO
        rationale: "Primero identifica la vocal O, luego únela a la T → TO."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "T + U = (TI/TU/TA)"
        correctAnswer: TU
        rationale: "Primero identifica la vocal U, luego únela a la T → TU."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'taza' (TE/TA/TI)"
        correctAnswer: TA
        rationale: "Divide 'taza' en TA-ZA; la primera sílaba es TA."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'teja' (TE/TA/TI)"
        correctAnswer: TE
        rationale: "Divide 'teja' en TE-JA; la primera sílaba es TE."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'tigre' (TI/TA/TU)"
        correctAnswer: TI
        rationale: "Divide 'tigre' en TI-GRE; la primera sílaba es TI."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'topo' (TE/TI/TO)"
        correctAnswer: TO
        rationale: "Divide 'topo' en TO-PO; la primera sílaba es TO."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'tulipán' (TA/TE/TU)"
        correctAnswer: TU
        rationale: "Divide 'tulipán' en TU-LI-PÁN; la primera sílaba es TU."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Sílabas con T dentro de la Palabra
