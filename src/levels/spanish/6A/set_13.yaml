title: 🔤 Sílabas Simples - PA PE PI PO PU
level: 6A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Sílabas con P + vocales. Primero identifica la vocal, luego únela a la P."
example: "Combina P + vocal. Ej.: P + A → PA ('papá' empieza por PA)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Las Cinco Sílabas con P
    description: Une la P con cada vocal.
    exercises:
      - type: reading
        question: "P + A = (PA/PE/PO)"
        correctAnswer: PA
        rationale: "Primero identifica la vocal A, luego únela a la P → PA."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "P + E = (PE/PI/PU)"
        correctAnswer: PE
        rationale: "Primero identifica la vocal E, luego únela a la P → PE."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "P + I = (PA/PI/PO)"
        correctAnswer: PI
        rationale: "Primero identifica la vocal I, luego únela a la P → PI."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "P + O = (PU/PO/PE)"
        correctAnswer: PO
        rationale: "Primero identifica la vocal O, luego únela a la P → PO."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "P + U = (PI/PU/PA)"
        correctAnswer: PU
        rationale: "Primero identifica la vocal U, luego únela a la P → PU."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'papá' (PE/PA/PI)"
        correctAnswer: PA
        rationale: "Divide 'papá' en PA-PÁ; la primera sílaba es PA."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'pelo' (PE/PA/PI)"
        correctAnswer: PE
        rationale: "Divide 'pelo' en PE-LO; la primera sílaba es PE."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'pino' (PI/PA/PU)"
        correctAnswer: PI
        rationale: "Divide 'pino' en PI-NO; la primera sílaba es PI."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'pollo' (PE/PI/PO)"
        correctAnswer: PO
        rationale: "Divide 'pollo' en PO-LLO; la primera sílaba es PO."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Primera sílaba de 'puerta' (PA/PE/PU)"
        correctAnswer: PU
        rationale: "Divide 'puerta' en PUER-TA; empieza por PU."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Sílabas con P dentro de la Palabra
    description: Encuentra la sílaba que contiene la P.
    exercises:
      - type: reading
        question: "Sílaba con P en 'copa' (CO/PA/OP)"
        correctAnswer: PA
        rationale: "Divide 'copa' en CO-PA; la sílaba con P es PA."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Sílaba con P en 'tapete' (TA/PE/TE)"
        correctAnswer: PE
        rationale: "Divide 'tapete' en TA-PE-TE; la sílaba con P es PE."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Sílaba con P en 'lupita' (LU/PI/TA)"
        correctAnswer: PI
        rationale: "Divide 'lupita' en LU-PI-TA; la sílaba con P es PI."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Sílaba con P en 'sapo' (SA/PO/AP)"
        correctAnswer: PO
        rationale: "Divide 'sapo' en SA-PO; la sílaba con P es PO."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Sílaba con P en 'capucha' (CA/PU/CHA)"
        correctAnswer: PU
        rationale: "Divide 'capucha' en CA-PU-CHA; la sílaba con P es PU."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Sílaba con P en 'araña' (A/RA/ÑA)"
        correctAnswer: A
        rationale: "'Araña' no contiene P en ninguna sílaba; la sílaba inicial es A."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Sílaba con P en 'ropa' (RO/PA/OP)"
        correctAnswer: PA
        rationale: "Divide 'ropa' en RO-PA; la sílaba con P es PA."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Sílaba con P en 'zapato' (ZA/PA/TO)"
        correctAnswer: PA
        rationale: "Divide 'zapato' en ZA-PA-TO; la sílaba con P es PA."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Sílaba con P en 'puño' (PU/ÑO/UÑ)"
        correctAnswer: PU
        rationale: "Divide 'puño' en PU-ÑO; la sílaba con P es PU."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Sílaba con P en 'pipa' (PI/PA/IP)"
        correctAnswer: PI
        rationale: "Divide 'pipa' en PI-PA; la primera sílaba con P es PI."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
