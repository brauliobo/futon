title: ✏️ Palabras Simples - La Comida
level: 6A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Vocabulario de alimentos básicos. Pensar primero en la categoría (fruta, verdura, bebida, carne) antes de elegir."
example: "Bebida blanca de la vaca → leche."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Frutas y Verduras
    description: Identifica el alimento por su descripción.
    exercises:
      - type: vocab
        question: "Fruta roja redonda (pera/manzana/uva)"
        correctAnswer: manzana
        rationale: "Primero piensa en color y forma: la manzana es roja y redonda."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Fruta amarilla alargada (manzana/pera/plátano)"
        correctAnswer: plátano
        rationale: "El plátano es una fruta amarilla y alargada, fácil de pelar."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Fruta cítrica anaranjada (pera/naranja/uva)"
        correctAnswer: naranja
        rationale: "La naranja es cítrica y de color naranja."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Fruta pequeña en racimo (plátano/manzana/uva)"
        correctAnswer: uva
        rationale: "Las uvas crecen en racimos y son pequeñas."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Verdura naranja larga (lechuga/zanahoria/tomate)"
        correctAnswer: zanahoria
        rationale: "La zanahoria es larga y de color naranja."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Verdura verde de hojas (tomate/lechuga/patata)"
        correctAnswer: lechuga
        rationale: "La lechuga tiene hojas verdes."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Verdura roja para ensalada (lechuga/tomate/cebolla)"
        correctAnswer: tomate
        rationale: "El tomate es rojo y común en ensaladas."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Tubérculo redondo que se fríe (lechuga/patata/tomate)"
        correctAnswer: patata
        rationale: "La patata es un tubérculo; común frita."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Verdura que hace llorar al cortarla (lechuga/tomate/cebolla)"
        correctAnswer: cebolla
        rationale: "La cebolla libera un gas que hace llorar al cortarla."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Fruta del verano con cáscara verde y dentro rojo (sandía/manzana/pera)"
        correctAnswer: sandía
        rationale: "La sandía es verde por fuera y roja por dentro, típica del verano."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Bebidas y Otros Alimentos
    description: Identifica el alimento o bebida descrito.
    exercises:
      - type: vocab
        question: "Bebida blanca de la vaca (café/leche/agua)"
        correctAnswer: leche
        rationale: "La leche es blanca y se obtiene de la vaca."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Líquido transparente que bebemos (leche/agua/café)"
        correctAnswer: agua
        rationale: "El agua es transparente y esencial para la vida."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Bebida oscura caliente de granos (té/café/agua)"
        correctAnswer: café
        rationale: "El café es oscuro, caliente y se prepara con granos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Bebida caliente de hojas (café/té/leche)"
        correctAnswer: té
        rationale: "El té se prepara con hojas en agua caliente."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alimento blanco de harina que acompaña comidas (arroz/pan/queso)"
        correctAnswer: pan
        rationale: "El pan se hace de harina y acompaña muchas comidas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Derivado sólido de la leche (pan/arroz/queso)"
        correctAnswer: queso
        rationale: "El queso se elabora a partir de la leche."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Grano blanco pequeño que se cuece (pan/arroz/queso)"
        correctAnswer: arroz
        rationale: "El arroz es un grano blanco que se cocina en agua."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Dulce redondo con crema o chocolate (pan/pastel/arroz)"
        correctAnswer: pastel
        rationale: "El pastel es un dulce típico de cumpleaños."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Ovalado que pone la gallina (huevo/pan/queso)"
        correctAnswer: huevo
        rationale: "El huevo es ovalado y lo pone la gallina."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Dorado de abejas para endulzar (miel/azúcar/sal)"
        correctAnswer: miel
        rationale: "La miel es dorada y la producen las abejas."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
