title: 🔗 Gramática - Conectores Textuales
level: B
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Conectores organizan el discurso: adición (y, además, también, encima), adversativos (pero, sin embargo, aunque, no obstante), causales (porque, ya que, puesto que), consecutivos (por tanto, así que, por eso), temporales (cuando, antes de, después de, mientras), de contraste (en cambio, por otro lado), conclusivos (en resumen, en conclusión, finalmente)."
example: "adición → y/además/también; adversativo → pero/sin embargo/aunque; causal → porque/ya que/puesto que; consecutivo → por tanto/así que/en consecuencia; concesivo → aunque/a pesar de; temporal → cuando/después de/mientras."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Tipo de Conector
    description: Elige el conector que mejor completa la oración.
    exercises:
      - type: grammar
        question: "'Me gusta el chocolate, ___ no como mucho.' (adición/adversativo) (y/pero/porque)"
        correctAnswer: pero
        rationale: "Contraste/adversativo → pero."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No vine ___ estaba enfermo.' (causal) (pero/porque/sin embargo)"
        correctAnswer: porque
        rationale: "Causa → porque."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estudié mucho; ___ aprobé el examen.' (consecutivo) (por tanto/aunque/ya que)"
        correctAnswer: por tanto
        rationale: "Consecuencia → por tanto."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tengo hambre ___ sed.' (adición) (pero/y/porque)"
        correctAnswer: y
        rationale: "Adición simple → y."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ llegué a casa, me puse a estudiar.' (temporal) (Aunque/Cuando/Pero)"
        correctAnswer: Cuando
        rationale: "Temporal → cuando."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Habla mucho; ___, no dice nada útil.' (adversativo) (además/sin embargo/porque)"
        correctAnswer: sin embargo
        rationale: "Adversativo formal → sin embargo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ estudiar, descansaré.' (temporal: antes) (Antes de/Después de/Mientras)"
        correctAnswer: Antes de
        rationale: "Anterioridad temporal → antes de."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Le gusta el fútbol ___ el baloncesto.' (adición) (pero/ni/y)"
        correctAnswer: y
        rationale: "Suma de gustos → y."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ el tiempo libre, prefiero leer.' (contrastivo) (En cambio/Porque/Así que)"
        correctAnswer: En cambio
        rationale: "Contraste o alternativa → en cambio."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___, me despido hasta la próxima.' (conclusivo) (Porque/Finalmente/Sin embargo)"
        correctAnswer: Finalmente
        rationale: "Cierre/conclusión → finalmente."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Identificar la Función
    description: Identifica qué función tiene el conector en negrita.
    exercises:
      - type: grammar
        question: "'Llueve; **por eso** me quedo en casa.' (temporal/consecutivo/adversativo)"
        correctAnswer: consecutivo
        rationale: "'Por eso' introduce la consecuencia → consecutivo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me gusta el campo; **en cambio**, mi hermana prefiere la ciudad.' (causal/contrastivo/conclusivo)"
        correctAnswer: contrastivo
        rationale: "'En cambio' marca contraste entre dos elementos."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'**Aunque** llueva, saldré.' (adversativo/causal/temporal)"
        correctAnswer: adversativo
        rationale: "'Aunque' concede una condición pero mantiene la afirmación → adversativo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'**Ya que** tienes tiempo, ayúdame.' (temporal/causal/consecutivo)"
        correctAnswer: causal
        rationale: "'Ya que' introduce la causa → causal."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'**Además**, tiene mucha experiencia.' (adición/adversativo/temporal)"
        correctAnswer: adición
        rationale: "'Además' suma información → adición."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige el conector correcto: 'Trabajó mucho ___ no consiguió el trabajo.' (pero/porque/por tanto)"
        correctAnswer: pero
        rationale: "Contraste (trabajo ≠ resultado) → pero."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige la oración bien conectada: (Estudió mucho porque aprobó./Estudió mucho así que aprobó./Estudió mucho mientras aprobó.)"
        correctAnswer: Estudió mucho así que aprobó.
        rationale: "Causa (estudió) → consecuencia (aprobó) = así que."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'**En conclusión**, el proyecto fue un éxito.' (adición/causal/conclusivo)"
        correctAnswer: conclusivo
        rationale: "'En conclusión' cierra el argumento → conclusivo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'**Mientras** ella cocinaba, él ponía la mesa.' (adversativo/temporal/causal)"
        correctAnswer: temporal
        rationale: "'Mientras' indica simultaneidad temporal."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Conector incorrecto: 'Llegué tarde **porque** salí a tiempo.' (correcto/incorrecto: la causa contradice el efecto)"
        correctAnswer: "incorrecto: la causa contradice el efecto"
        rationale: "Si salí a tiempo, no es la causa de llegar tarde; habría que usar 'aunque'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
