title: ✏️ Gramática - Puntuación y Acentuación
level: B
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Signos de puntuación: punto (.), coma (,), punto y coma (;), dos puntos (:), puntos suspensivos (...), signos ¿?¡!. Tilde diacrítica: él/el, tú/tu, mí/mi, sí/si, té/te, más/mas, sé/se, dé/de. Palabras esdrújulas llevan siempre tilde. Palabras graves sin tilde si terminan en vocal, -n, -s."
example: "Esdrújula → siempre tilde: árbol NO, cámara SÍ. Diacrítica: él (pron.) / el (art.). Coma en vocativos: Juan, ven."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Signos de Puntuación
    description: Elige el signo de puntuación correcto.
    exercises:
      - type: grammar
        question: "'Juan___ ven aquí.' (vocativo) (,/./;)"
        correctAnswer: ","
        rationale: "Vocativo separado por coma: Juan, ven aquí."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Compré pan___ leche y huevos.' (enumeración) (,/:/;)"
        correctAnswer: ","
        rationale: "Coma en enumeraciones: pan, leche y huevos."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Lo que dijo fue esto___ llegad a tiempo.' (dos puntos para introducir) (,/:/;)"
        correctAnswer: ":"
        rationale: "Los dos puntos introducen una cita o explicación; señalan la relación."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Había mucha gente___ sin embargo, todo fue bien.' (;/,/.)"
        correctAnswer: ";"
        rationale: "Punto y coma antes de conectores adversativos en oraciones largas."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué signo termina una afirmación? (./?/!)"
        correctAnswer: "."
        rationale: "El punto (.) termina una oración declarativa."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No sé si venir o quedarme___' (duda o pausa expresiva) (./,/...)"
        correctAnswer: "..."
        rationale: "Puntos suspensivos expresan duda, pausa o frase inacabada."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se usa la coma antes de 'pero'? (nunca/siempre en oración compuesta/solo si hay sujeto diferente)"
        correctAnswer: siempre en oración compuesta
        rationale: "Ante 'pero' coordinante siempre se escribe coma en oración compuesta."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vino___ saludó y se fue.' (sin pausa/con coma/con punto y coma)"
        correctAnswer: ","
        rationale: "Coma entre oraciones coordinadas breves con el mismo sujeto: vino, saludó y se fue."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La respuesta es sencilla___ no lo sé.' (:/,/;)"
        correctAnswer: ":"
        rationale: "Los dos puntos señalan la explicación o aclaración que sigue."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ayer fui al cine___ hoy me quedo en casa.' (separar dos ideas relacionadas) (;/,/.)"
        correctAnswer: ";"
        rationale: "Punto y coma separa proposiciones relacionadas pero independientes."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Tilde Diacrítica y Reglas de Acento
    description: Elige la forma correctamente acentuada.
    exercises:
      - type: grammar
        question: "'___ libro es mío' (artículo determinado) (Él/El)"
        correctAnswer: El
        rationale: "'El' sin tilde = artículo. 'Él' con tilde = pronombre personal."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ eres muy amable' (pronombre sujeto) (Tu/Tú)"
        correctAnswer: Tú
        rationale: "'Tú' con tilde = pronombre. 'Tu' sin tilde = posesivo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No ___ si vendré' (conjunción condicional) (si/sí)"
        correctAnswer: si
        rationale: "'Si' sin tilde = conjunción condicional. 'Sí' con tilde = afirmación o pronombre."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quiero ___ de menta' (infusión) (te/té)"
        correctAnswer: té
        rationale: "'Té' con tilde = la infusión. 'Te' sin tilde = pronombre."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Lleva tilde 'árbol'? (sí, es esdrújula/sí, es llana terminada en consonante/no lleva tilde)"
        correctAnswer: sí, es llana terminada en consonante
        rationale: "'Árbol' es llana terminada en -l (consonante ≠ n,s) → sí lleva tilde."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Lleva tilde 'mesa'? (sí, es esdrújula/no, es llana en vocal/sí, es aguda)"
        correctAnswer: no, es llana en vocal
        rationale: "'Mesa' es llana terminada en vocal → no lleva tilde."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Lleva tilde 'camión'? (no, termina en -n/sí, es aguda terminada en -n/no, es llana)"
        correctAnswer: sí, es aguda terminada en -n
        rationale: "Aguda terminada en -n → sí lleva tilde: camión."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Lleva tilde 'teléfono'? (no/sí, es esdrújula/sí, es aguda)"
        correctAnswer: sí, es esdrújula
        rationale: "Las esdrújulas siempre llevan tilde: teléfono."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ muy bien' (pronombre dativo) (Se/Sé)"
        correctAnswer: Sé
        rationale: "'Sé' con tilde = forma de 'saber' (yo sé) o de 'ser' (sé amable)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ más que tú en eso' (comparativo) (Mas/Más)"
        correctAnswer: Más
        rationale: "'Más' con tilde = cantidad/comparación. 'Mas' sin tilde = 'pero' (literario)."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
