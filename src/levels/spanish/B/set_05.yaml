title: 📚 Lectura - El Periódico Escolar
level: B
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Texto periodístico/narrativo. Vocabulario de comunicación y medios. Identificar quién, qué, cuándo, dónde, por qué y cómo en un texto informativo."
example: "texto periodístico → estructura: titular → lead (quién/qué/cuándo/dónde/cómo/por qué) → cuerpo (detalles) → cierre → lee el titular para anticipar el tema → el lead tiene las respuestas más importantes."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El colegio Padre Claret lanzó en octubre su propio periódico escolar, llamado 'La Gaceta del Claret'. El equipo de redacción lo forman doce alumnos de quinto y sexto de primaria, coordinados por la profesora de lengua, doña Amparo. El periódico sale el primer viernes de cada mes y se distribuye gratuitamente por todas las clases. En el primer número hubo reportajes sobre el campeonato de atletismo, una entrevista al nuevo director y un artículo sobre el reciclaje. Los alumnos también añadieron una sección de humor con chistes y adivinanzas. El objetivo, según doña Amparo, es mejorar la expresión escrita y fomentar el trabajo en equipo. Ya hay una lista de espera para unirse al equipo el próximo curso."
    exercises:
      - type: reading
        question: "¿Cómo se llama el periódico escolar? (El Diario Escolar/La Gaceta del Padre/La Gaceta del Claret)"
        correctAnswer: La Gaceta del Claret
        rationale: "El texto: ''La Gaceta del Claret''."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo se lanzó el periódico? (en septiembre/en octubre/en noviembre)"
        correctAnswer: en octubre
        rationale: "El texto: 'lanzó en octubre'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos alumnos forman el equipo? (diez/doce/quince)"
        correctAnswer: doce
        rationale: "El texto: 'lo forman doce alumnos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién coordina el equipo? (el director/un padre/la profesora doña Amparo)"
        correctAnswer: la profesora doña Amparo
        rationale: "El texto: 'coordinados por la profesora de lengua, doña Amparo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo sale el periódico? (el primer lunes/el primer viernes/todos los martes)"
        correctAnswer: el primer viernes
        rationale: "El texto: 'sale el primer viernes de cada mes'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto cuesta el periódico? (cincuenta céntimos/un euro/es gratuito)"
        correctAnswer: es gratuito
        rationale: "El texto: 'se distribuye gratuitamente'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Sobre qué trató el reportaje deportivo? (natación/baloncesto/atletismo)"
        correctAnswer: atletismo
        rationale: "El texto: 'reportajes sobre el campeonato de atletismo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A quién entrevistaron? (a doña Amparo/al nuevo director/a un deportista)"
        correctAnswer: al nuevo director
        rationale: "El texto: 'una entrevista al nuevo director'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué sección de humor incluyen? (tiras cómicas/chistes y adivinanzas/caricaturas)"
        correctAnswer: chistes y adivinanzas
        rationale: "El texto: 'chistes y adivinanzas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es el objetivo principal del periódico? (informar a los padres/mejorar la expresión escrita y el trabajo en equipo/ganar dinero)"
        correctAnswer: mejorar la expresión escrita y el trabajo en equipo
        rationale: "El texto: 'mejorar la expresión escrita y fomentar el trabajo en equipo'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
