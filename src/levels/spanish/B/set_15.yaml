title: Lectura - Una Carta de Amistad
level: B
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Texto epistolar. Vocabulario de relaciones personales y vida cotidiana. Identificar intención comunicativa, destinatario y datos explícitos."
example: "Lee la carta completa antes de responder. Identifica quién escribe, a quién y cuál es el propósito."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Querida Sofía: Te escribo desde Sevilla, donde llevo ya tres semanas viviendo con mis tíos mientras mis padres trabajan en el extranjero. Al principio me sentía muy sola, pero ahora ya tengo un grupo de amigas nuevas en el instituto. Se llaman Rocío, Blanca y Marta. Los fines de semana vamos juntas al parque de María Luisa o paseamos por el río Guadalquivir. El miércoles pasado fui por primera vez a una clase de flamenco y me encantó, aunque me cuesta mucho mover los brazos al ritmo correcto. La profesora dice que con práctica lo conseguiré. Echo mucho de menos nuestros paseos por Madrid y las tardes en tu casa. ¿Cuándo podrás venir a visitarme? Hay muchísimo que ver aquí. Un abrazo enorme, Laura."
    exercises:
      - type: reading
        question: "¿Desde dónde escribe Laura? (Madrid/Barcelona/Sevilla)"
        correctAnswer: Sevilla
        rationale: "El texto: 'Te escribo desde Sevilla'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con quién vive Laura en Sevilla? (con sus padres/con sus tíos/sola)"
        correctAnswer: con sus tíos
        rationale: "El texto: 'viviendo con mis tíos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto tiempo lleva en Sevilla? (una semana/dos semanas/tres semanas)"
        correctAnswer: tres semanas
        rationale: "El texto: 'llevo ya tres semanas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llaman las nuevas amigas? (Rosa, Blanca y Marta/Rocío, Blanca y Marta/Rocío, Lucía y Marta)"
        correctAnswer: Rocío, Blanca y Marta
        rationale: "El texto: 'Se llaman Rocío, Blanca y Marta'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Adónde van los fines de semana? (al centro comercial/al parque de María Luisa o al río/a la playa)"
        correctAnswer: al parque de María Luisa o al río
        rationale: "El texto: 'al parque de María Luisa o paseamos por el río Guadalquivir'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué clase nueva empezó Laura? (yoga/flamenco/natación)"
        correctAnswer: flamenco
        rationale: "El texto: 'fui por primera vez a una clase de flamenco'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué le cuesta trabajo a Laura en el flamenco? (el ritmo de los pies/mover los brazos al ritmo/recordar los pasos)"
        correctAnswer: mover los brazos al ritmo
        rationale: "El texto: 'me cuesta mucho mover los brazos al ritmo correcto'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué echa de menos Laura? (el flamenco/los paseos por Madrid y las tardes en casa de Sofía/la comida sevillana)"
        correctAnswer: los paseos por Madrid y las tardes en casa de Sofía
        rationale: "El texto: 'Echo mucho de menos nuestros paseos por Madrid y las tardes en tu casa'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A quién está dirigida la carta? (a Rocío/a Marta/a Sofía)"
        correctAnswer: a Sofía
        rationale: "El texto comienza: 'Querida Sofía'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué le pregunta Laura a Sofía al final? (si le gusta Sevilla/cuándo puede venir a visitarla/si sigue en Madrid)"
        correctAnswer: cuándo puede venir a visitarla
        rationale: "El texto: '¿Cuándo podrás venir a visitarme?'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
