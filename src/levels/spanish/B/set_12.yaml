title: Lectura - El Campamento de Verano
level: B
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Texto narrativo en primera persona. Vocabulario de actividades al aire libre y convivencia. Identificar secuencias, emociones e inferencias."
example: "Lee el texto completo. Presta atención a la secuencia de eventos y a los sentimientos del narrador."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El verano pasado mis padres me apuntaron a un campamento en la sierra de Guadarrama durante dos semanas. Al principio estaba nervioso porque no conocía a nadie, pero el primer día me hice amigo de Carlos, un chico de Salamanca muy divertido. Dormíamos en cabañas de madera de ocho personas y nos levantábamos todos los días a las siete y media. Las actividades eran muy variadas: escalada, senderismo, kayak y talleres de fotografía. El día que más disfruté fue cuando escalamos una pared de quince metros. Sentí mucho miedo al principio, pero cuando llegué arriba me sentí muy orgulloso. La comida era sana pero bastante aburrida: ensaladas, legumbres y fruta. El último día hicimos una hoguera y cantamos hasta la medianoche. Volvería sin dudarlo."
    exercises:
      - type: reading
        question: "¿Dónde fue el campamento? (sierra de Gredos/sierra de Guadarrama/sierra Nevada)"
        correctAnswer: sierra de Guadarrama
        rationale: "El texto: 'campamento en la sierra de Guadarrama'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto duró el campamento? (una semana/dos semanas/tres semanas)"
        correctAnswer: dos semanas
        rationale: "El texto: 'durante dos semanas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llamaba el nuevo amigo? (Miguel/Carlos/Javier)"
        correctAnswer: Carlos
        rationale: "El texto: 'me hice amigo de Carlos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De dónde era Carlos? (Madrid/Valencia/Salamanca)"
        correctAnswer: Salamanca
        rationale: "El texto: 'un chico de Salamanca'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas personas dormían en cada cabaña? (cuatro/seis/ocho)"
        correctAnswer: ocho
        rationale: "El texto: 'cabañas de madera de ocho personas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A qué hora se levantaban? (a las siete/a las siete y media/a las ocho)"
        correctAnswer: a las siete y media
        rationale: "El texto: 'nos levantábamos todos los días a las siete y media'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué actividad disfrutó más el narrador? (el kayak/el senderismo/la escalada)"
        correctAnswer: la escalada
        rationale: "El texto: 'El día que más disfruté fue cuando escalamos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos metros medía la pared de escalada? (diez/quince/veinte)"
        correctAnswer: quince
        rationale: "El texto: 'una pared de quince metros'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo era la comida? (deliciosa/variada/sana pero aburrida)"
        correctAnswer: sana pero aburrida
        rationale: "El texto: 'La comida era sana pero bastante aburrida'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hicieron el último día? (vieron una película/hicieron una hoguera y cantaron/jugaron al fútbol)"
        correctAnswer: hicieron una hoguera y cantaron
        rationale: "El texto: 'hicimos una hoguera y cantamos hasta la medianoche'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
