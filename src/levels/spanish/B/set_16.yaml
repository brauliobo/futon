title: 📝 Gramática - La Oración Compuesta
level: B
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Oración simple: un solo verbo conjugado. Oración compuesta: dos o más verbos conjugados. Tipos: coordinada (yuxtapuesta, copulativa y/e, adversativa pero/sin embargo, disyuntiva o/u), subordinada (sustantiva: que + cláusula; adjetiva/relativa: que/quien/donde; adverbial: cuando, porque, si, aunque, para que)."
example: "1 verbo → simple: El niño llora. y → coordinada copulativa: El niño llora y la niña ríe. que + cláusula → sustantiva: Sé que llegarás tarde. porque → adverbial causal: Faltó porque estaba enfermo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Oración Simple y Compuesta
    description: Clasifica o completa la oración.
    exercises:
      - type: grammar
        question: "'El perro ladra.' ¿Simple o compuesta? (compuesta/simple/subordinada)"
        correctAnswer: simple
        rationale: "Un solo verbo conjugado → oración simple."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llegué tarde porque perdí el autobús.' ¿Simple o compuesta? (simple/compuesta yuxtapuesta/compuesta subordinada)"
        correctAnswer: compuesta subordinada
        rationale: "Dos verbos + nexo 'porque' → oración subordinada causal."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me gusta el café, pero no bebo mucho.' Tipo de coordinación: (copulativa/disyuntiva/adversativa)"
        correctAnswer: adversativa
        rationale: "'Pero' une dos oraciones en contraste → coordinada adversativa."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estudia mucho **y** aprende rápido.' Tipo: (adversativa/copulativa/disyuntiva)"
        correctAnswer: copulativa
        rationale: "'Y' une sumando ideas → coordinada copulativa."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Vienes **o** te quedas?' Tipo: (copulativa/adversativa/disyuntiva)"
        correctAnswer: disyuntiva
        rationale: "'O' presenta alternativas → coordinada disyuntiva."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Sé **que** aprobará el examen.' Tipo de subordinada: (adverbial/adjetiva/sustantiva)"
        correctAnswer: sustantiva
        rationale: "La cláusula 'que aprobará' funciona como objeto del verbo → subordinada sustantiva."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El libro **que** me prestaste es genial.' Tipo de subordinada: (sustantiva/adjetiva/adverbial)"
        correctAnswer: adjetiva
        rationale: "'Que me prestaste' modifica a 'el libro' → subordinada adjetiva/relativa."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'**Cuando** llegues, llámame.' Tipo de subordinada: (sustantiva/adjetiva/adverbial temporal)"
        correctAnswer: adverbial temporal
        rationale: "'Cuando' introduce una subordinada adverbial de tiempo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Fui al médico **porque** me dolía la cabeza.' Tipo: (adverbial causal/adverbial final/adjetiva)"
        correctAnswer: adverbial causal
        rationale: "'Porque' introduce causa → subordinada adverbial causal."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántos verbos conjugados tiene una oración simple? (ninguno/uno/dos o más)"
        correctAnswer: uno
        rationale: "La oración simple tiene un único verbo conjugado."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Nexos y Construcción
    description: Elige el nexo correcto o identifica la estructura.
    exercises:
      - type: grammar
        question: "'Estudia mucho ___ quiere aprobar.' (nexo final) (porque/para que/cuando)"
        correctAnswer: para que
        rationale: "'Para que' introduce finalidad → subordinada adverbial final."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ llueva, nos quedaremos en casa.' (nexo condicional) (Aunque/Cuando/Si)"
        correctAnswer: Si
        rationale: "'Si' introduce condición → subordinada condicional."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Saldremos ___ haga frío.' (nexo concesivo) (si/para que/aunque)"
        correctAnswer: aunque
        rationale: "'Aunque' concede una condición → subordinada concesiva."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La chica ___ vive al lado es muy simpática.' (pronombre relativo) (que/quien/donde)"
        correctAnswer: que
        rationale: "'Que' es el relativo más frecuente en subordinadas adjetivas."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La ciudad ___ nací es pequeña.' (relativo de lugar) (que/quien/donde)"
        correctAnswer: donde
        rationale: "'Donde' introduce una subordinada relativa de lugar."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la yuxtaposición? (unión con y/unión con pero/dos oraciones sin nexo separadas por coma o punto y coma)"
        correctAnswer: dos oraciones sin nexo separadas por coma o punto y coma
        rationale: "La yuxtaposición une oraciones sin nexo explícito: Llegué; me senté."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige la oración compuesta coordinada: (El gato duerme./El gato duerme y el perro juega./Porque llueve.)"
        correctAnswer: El gato duerme y el perro juega.
        rationale: "Dos oraciones simples unidas por 'y' → coordinada copulativa."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Espero ___ vengas a la fiesta.' (que/donde/quien)"
        correctAnswer: que
        rationale: "Subordinada sustantiva de objeto → nexo 'que'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el nexo de las subordinadas causales? (para que/porque/aunque)"
        correctAnswer: porque
        rationale: "'Porque' (y sus equivalentes: ya que, puesto que) introduce causa."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Clasifica: 'Habla tan rápido que no le entiendo.' (coordinada/subordinada consecutiva/simple)"
        correctAnswer: subordinada consecutiva
        rationale: "'Tan... que' introduce consecuencia → subordinada consecutiva."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
