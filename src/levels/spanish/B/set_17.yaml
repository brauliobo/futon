pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Alexander Graham Bell nació en Edimburgo, Escocia, el 3 de marzo de 1847. Desde pequeño mostró una gran curiosidad por el sonido, ya que su madre era sorda y su padre era profesor de dicción. Estudió en la Universidad de Londres y más tarde emigró a Canadá con su familia. En 1871 se instaló en Boston, donde comenzó a trabajar como profesor de sordos. Mientras investigaba cómo transmitir voz por cable, desarrolló el teléfono. El 10 de marzo de 1876 realizó la primera llamada de la historia: dijo a su ayudante Watson: 'Señor Watson, venga aquí, lo necesito'. Bell fundó la compañía Bell Telephone Company ese mismo año. Falleció en 1922 en su casa de verano en Nova Scotia, Canadá, a los 75 años."
    exercises:
      - type: reading
        question: "¿Dónde nació Bell? (Londres/Edimburgo/Boston)"
        correctAnswer: Edimburgo
        rationale: "El texto: 'nació en Edimburgo, Escocia'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué año nació? (1847/1871/1876)"
        correctAnswer: 1847
        rationale: "El texto: 'el 3 de marzo de 1847'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué le interesaba el sonido desde pequeño? (por hobby/su madre era sorda y su padre era profesor de dicción/estudiaba música)"
        correctAnswer: su madre era sorda y su padre era profesor de dicción
        rationale: "El texto: 'su madre era sorda y su padre era profesor de dicción'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué ciudad trabajó como profesor de sordos? (Londres/Edimburgo/Boston)"
        correctAnswer: Boston
        rationale: "El texto: 'En 1871 se instaló en Boston, donde comenzó a trabajar como profesor de sordos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo realizó Bell la primera llamada telefónica? (3 de marzo de 1847/10 de marzo de 1876/en 1922)"
        correctAnswer: 10 de marzo de 1876
        rationale: "El texto: 'El 10 de marzo de 1876 realizó la primera llamada'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué dijo Bell en la primera llamada? ('Hola, ¿me escuchas?'/'Señor Watson, venga aquí, lo necesito'/'Este es el teléfono')"
        correctAnswer: Señor Watson, venga aquí, lo necesito
        rationale: "El texto cita textualmente esas palabras."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A quién le habló Bell en esa primera llamada? (a su padre/a Watson/a su madre)"
        correctAnswer: a Watson
        rationale: "El texto: 'dijo a su ayudante Watson'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué fundó Bell en 1876? (la Universidad de Boston/la Bell Telephone Company/un hospital para sordos)"
        correctAnswer: la Bell Telephone Company
