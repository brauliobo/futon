        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde falleció Bell? (Boston/Edimburgo/Nova Scotia, Canadá)"
        correctAnswer: Nova Scotia, Canadá
        rationale: "El texto: 'en su casa de verano en Nova Scotia, Canadá'."
        difficulty: 2
        objectives: [es.pre_reading]
