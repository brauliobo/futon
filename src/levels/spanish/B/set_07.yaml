  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La biblioteca del barrio de San Isidro abrió sus puertas hace tres años con un objetivo claro: acercar la cultura a todos los vecinos. Tiene tres plantas. En la primera hay una sala de lectura con doscientos asientos y una zona infantil con cuentos y juegos educativos. La segunda planta alberga la hemeroteca, con periódicos y revistas de todo el país. En la tercera se celebran talleres de escritura creativa los sábados por la mañana y clubs de lectura los miércoles por la tarde. La directora, doña Carmen Ruiz, organiza además una feria del libro cada mes de abril. El carné de biblioteca es gratuito y permite llevarse hasta cuatro libros en préstamo durante tres semanas. Más de dos mil vecinos ya están inscritos."
    exercises:
      - type: reading
        question: "¿Dónde está la biblioteca? (barrio de San Isidro/barrio de San Pedro/centro de la ciudad)"
        correctAnswer: barrio de San Isidro
        rationale: "El texto: 'La biblioteca del barrio de San Isidro'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas plantas tiene? (dos/tres/cuatro)"
        correctAnswer: tres
        rationale: "El texto: 'Tiene tres plantas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos asientos tiene la sala de lectura? (cien/doscientos/trescientos)"
        correctAnswer: doscientos
        rationale: "El texto: 'doscientos asientos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hay en la zona infantil? (ordenadores/cuentos y juegos educativos/libros de texto)"
        correctAnswer: cuentos y juegos educativos
        rationale: "El texto: 'zona infantil con cuentos y juegos educativos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué contiene la segunda planta? (sala de lectura/hemeroteca/talleres)"
        correctAnswer: hemeroteca
        rationale: "El texto: 'La segunda planta alberga la hemeroteca'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo se celebran los talleres de escritura? (miércoles/sábados por la mañana/viernes por la tarde)"
        correctAnswer: sábados por la mañana
        rationale: "El texto: 'talleres de escritura creativa los sábados por la mañana'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama la directora? (doña Ana García/doña Carmen Ruiz/doña Amparo López)"
        correctAnswer: doña Carmen Ruiz
        rationale: "El texto: 'La directora, doña Carmen Ruiz'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto cuesta el carné de biblioteca? (cinco euros/diez euros/es gratuito)"
        correctAnswer: es gratuito
        rationale: "El texto: 'El carné de biblioteca es gratuito'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos libros se pueden llevar en préstamo? (dos/cuatro/seis)"
        correctAnswer: cuatro
        rationale: "El texto: 'llevarse hasta cuatro libros en préstamo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos vecinos están inscritos? (mil/más de dos mil/tres mil)"
        correctAnswer: más de dos mil
