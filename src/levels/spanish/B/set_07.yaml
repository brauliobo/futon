title: 📚 Lectura - La Biblioteca del Barrio
level: B
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Texto informativo/descriptivo. Vocabulario de espacios culturales y servicios comunitarios. Inferir información implícita y secuenciar eventos."
example: "Lee el texto → identifica personajes (quién) → lugar (dónde está la biblioteca) → tiempo (cuándo) → datos clave (horarios/actividades/normas). Las respuestas están en el texto."
repeatAll: 2
