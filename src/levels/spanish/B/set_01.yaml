title: 📝 Construcción de Oraciones - Orden de Palabras
level: B
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Orden básico en español: Sujeto-Verbo-Objeto (SVO), pero flexible. El objeto puede ir al inicio (Eso lo sé yo). El adjetivo va después del sustantivo (especificativo) o antes (expresivo/valorativo). Adverbios cerca del elemento que modifican. Distinguir orden marcado vs no marcado."
example: "SVO no marcado → Los niños juegan. Orden marcado → En el parque juegan los niños. adjetivo: libro nuevo (especificativo) → el nuevo libro (expresivo)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Orden Correcto
    description: Elige la oración con el orden más natural.
    exercises:
      - type: grammar
        question: "Oración correcta: (Come el niño pizza./El niño come pizza./Pizza el niño come.)"
        correctAnswer: El niño come pizza.
        rationale: "Orden SVO no marcado: el niño (S) + come (V) + pizza (O)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Dónde va normalmente el adjetivo calificativo? (antes del sustantivo/después del sustantivo/al final de la oración)"
        correctAnswer: después del sustantivo
        rationale: "El adjetivo especificativo va tras el sustantivo: casa grande."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración bien ordenada: (Ayer llegó ella tarde./Ella ayer tarde llegó./Tarde ella ayer llegó.)"
        correctAnswer: Ayer llegó ella tarde.
        rationale: "Adverbio de tiempo al inicio, luego verbo-sujeto-complemento."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la oración con énfasis en el objeto? (María compró el libro./El libro lo compró María./Compró el libro María.)"
        correctAnswer: El libro lo compró María.
        rationale: "Objeto al inicio + pronombre de retoma → énfasis en 'el libro'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Ubica el adverbio: 'Habla ___ bien español.' (bastante) (bastante bien/bien bastante/habla bastante)"
        correctAnswer: bastante bien
        rationale: "El adverbio de grado precede al adverbio modificado: bastante bien."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración correcta con adjetivo valorativo: (Una gran oportunidad./Una oportunidad gran./Una grande oportunidad.)"
        correctAnswer: Una gran oportunidad.
        rationale: "Adjetivo expresivo/valorativo antes del sustantivo: gran (apócope)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Ordena: (nueva/casa/compré/una/ayer) → (Ayer compré una casa nueva./Ayer nueva compré una casa./Compré ayer casa una nueva.)"
        correctAnswer: Ayer compré una casa nueva.
        rationale: "Adv. tiempo + V + Det + Sust + Adj: Ayer compré una casa nueva."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Es incorrecta? '¿Qué come el niño?' (sí, incorrecta/no, es correcta interrogativa/solo en estilo escrito)"
        correctAnswer: no, es correcta interrogativa
        rationale: "En interrogativas, el verbo puede preceder al sujeto: ¿qué come el niño?"
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración con orden más neutro: (Rápidamente corrió Pedro./Pedro corrió rápidamente./Corrió Pedro rápidamente.)"
        correctAnswer: Pedro corrió rápidamente.
        rationale: "SV + adv. modo al final: establece el orden neutro y no marcado del español."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Dónde va 'nunca' con un verbo?: (Nunca como/Como nunca/Nunca como — ambas posibles)"
        correctAnswer: Nunca como — ambas posibles
        rationale: "'Nunca' puede ir antes o después del verbo; antes del verbo es más común."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Reordenar y Transformar
    description: Elige la versión correctamente ordenada.
    exercises:
      - type: grammar
        question: "Reordena: 'siempre/estudia/ella/mucho' (Siempre estudia ella mucho./Ella siempre estudia mucho./Mucho estudia ella siempre.)"
        correctAnswer: Ella siempre estudia mucho.
        rationale: "Sujeto + adv. frecuencia + verbo + adv. cantidad: ella siempre estudia mucho."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es orden SVO? (Come el perro un hueso./El perro come un hueso./Un hueso el perro come.)"
        correctAnswer: El perro come un hueso.
        rationale: "Sujeto (el perro) + Verbo (come) + Objeto (un hueso) = SVO."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Orden para énfasis en sujeto: (María lo dijo./Lo dijo María./María dijo.)"
        correctAnswer: Lo dijo María.
        rationale: "Sujeto pospuesto resalta quién hizo la acción."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es más natural? (Ayer fui yo al cine./Ayer al cine fui yo./Yo al cine ayer fui.)"
        correctAnswer: Ayer fui yo al cine.
        rationale: "Adv. tiempo + V + S + lugar: establece el orden más natural en español."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Dónde va el objeto pronominal? (Él vio la lo./Lo vio él./Él lo vio.)"
        correctAnswer: Él lo vio.
        rationale: "Pronombre átono va antes del verbo conjugado: él lo vio."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál tiene adjetivo especificativo correcto? (Una roja manzana./Una manzana roja./Roja manzana una.)"
        correctAnswer: Una manzana roja.
        rationale: "Adjetivo especificativo (color) va después: manzana roja."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Orden de negación: 'No lo sé' vs 'Lo no sé': (No lo sé/Lo no sé/ambas)"
        correctAnswer: No lo sé
        rationale: "'No' precede al pronombre átono: no lo sé."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la oración exclamativa bien ordenada? (¡Qué bonita es la casa!/¡Es bonita qué la casa!/¡La casa es qué bonita!)"
        correctAnswer: ¡Qué bonita es la casa!
        rationale: "Exclamativa: qué + adj + verbo + sujeto."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál coloca el adverbio bien? (Ella habla bien./Habla ella bien bien./Bien bien habla ella.)"
        correctAnswer: Ella habla bien.
        rationale: "Adverbio de modo al final del predicado: ella habla bien."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la interrogativa correcta? (¿Qué quieres tú?/¿Tú qué quieres?/¿Quieres tú qué?)"
        correctAnswer: ¿Qué quieres tú?
        rationale: "Interrogativa directa: palabra interrogativa + verbo + sujeto."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
