title: Revisión General - Nivel B
level: B
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Revisión de todos los contenidos del nivel B: orden de palabras, sinónimos/antónimos, conectores, puntuación y acentuación, tiempos del pasado, clases de palabras, complementos verbales, modo/voz, formación de palabras, oración compuesta, concordancia y coherencia."
example: "ayer → indefinido: comí. des- + hacer → deshacer. Juan, ven. (vocativo + coma). comprar ↔ vender (antónimos)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Repaso de Gramática y Vocabulario
    description: Elige la respuesta correcta en cada ejercicio de revisión.
    exercises:
      - type: grammar
        question: "Sinónimo de 'comenzar': (terminar/iniciar/pausar)"
        correctAnswer: iniciar
        rationale: "'Iniciar' es sinónimo de 'comenzar'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Antónimo de 'generoso': (amable/pobre/tacaño)"
        correctAnswer: tacaño
        rationale: "'Tacaño' es el opuesto de 'generoso'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ayer ___ al parque.' (indefinido: ir) (iba/fui/voy)"
        correctAnswer: fui
        rationale: "'Ayer' + acción puntual → indefinido: fui."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'De niño ___ mucho.' (imperfecto: estudiar) (estudié/estudiaba/he estudiado)"
        correctAnswer: estudiaba
        rationale: "'De niño' + hábito → imperfecto: estudiaba."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No sé si venir o quedarme___' (puntos suspensivos/punto/coma) (..././, )"
        correctAnswer: ...
        rationale: "Puntos suspensivos expresan duda o frase inacabada."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ libro es interesante.' (artículo, sin tilde) (Él/El/Le)"
        correctAnswer: El
        rationale: "'El' sin tilde = artículo determinado."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Prefijo 're-' en 'reescribir' significa: (contrario/antes/repetición)"
        correctAnswer: repetición
        rationale: "'Re-' indica hacer de nuevo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Conectivo adversativo: (además/porque/sin embargo)"
        correctAnswer: sin embargo
        rationale: "'Sin embargo' contrasta dos ideas → adversativo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vive **en París**.' ¿Tipo de complemento? (CD/CI/CC de lugar)"
        correctAnswer: CC de lugar
        rationale: "¿Dónde? En París → CC de lugar."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El libro **que** me regalaste es genial.' Tipo de subordinada: (sustantiva/adjetiva/adverbial)"
        correctAnswer: adjetiva
        rationale: "'Que me regalaste' modifica al sustantivo 'el libro' → subordinada adjetiva."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Repaso de Estructura y Función
    description: Continúa el repaso del nivel B.
    exercises:
      - type: grammar
        question: "'**Rápidamente**' ¿Clase de palabra? (adjetivo/adverbio/sustantivo)"
        correctAnswer: adverbio
        rationale: "'-Mente' forma adverbios de modo → adverbio."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quiero que **vengas**.' ¿Modo de 'vengas'? (indicativo/imperativo/subjuntivo)"
        correctAnswer: subjuntivo
        rationale: "'Quiero que' + verbo de deseo → subjuntivo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La carta **fue escrita** por Ana.' ¿Voz? (activa/reflexiva/pasiva)"
        correctAnswer: pasiva
        rationale: "Ser + participio + por + agente → voz pasiva."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué concuerdan en género y número? (verbo y adverbio/sustantivo y adjetivo/pronombre y verbo)"
        correctAnswer: sustantivo y adjetivo
        rationale: "La concordancia nominal: sustantivo + adjetivo deben tener mismo género y número."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Forma correcta: (Los niño juega./Los niños juegan./Los niños juega.)"
        correctAnswer: Los niños juegan.
        rationale: "Concordancia plural: Los niños (sujeto pl.) + juegan (verbo pl.)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llegó tarde ___ había mucho tráfico.' (causal) (pero/porque/sin embargo)"
        correctAnswer: porque
        rationale: "'Porque' introduce la causa → conector causal."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Sufijo '-ción' en 'atención' forma: (un adverbio/un adjetivo/un sustantivo de acción)"
        correctAnswer: un sustantivo de acción
        rationale: "'-Ción' forma sustantivos que expresan acción o resultado."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Juan___ ven aquí.' (vocativo) ¿Qué signo va en el hueco? (./,/;)"
        correctAnswer: ","
        rationale: "El vocativo se separa siempre con coma: Juan, ven aquí."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función del CI? (recibir la acción directamente/indicar lugar/ser el receptor de la acción)"
        correctAnswer: ser el receptor de la acción
        rationale: "El CI indica a quién o para quién se realiza la acción."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración compuesta coordinada disyuntiva: (Estudia mucho porque quiere aprobar./¿Vienes o te quedas?/El sol brilla y hace calor.)"
        correctAnswer: ¿Vienes o te quedas?
        rationale: "'O' presenta alternativas excluyentes → coordinada disyuntiva."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
