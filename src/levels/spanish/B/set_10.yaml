title: Lectura - El Mercado de Navidad
level: B
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Texto descriptivo-narrativo. Vocabulario festivo y comercial. Extraer información explícita e implícita sobre un evento cultural."
example: "Lee el texto completo y localiza los datos antes de elegir la respuesta."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Cada año, durante la primera semana de diciembre, la plaza Mayor de Vilanova se transforma en un colorido mercado de Navidad. Más de cuarenta puestos ofrecen productos artesanales: figuras de belén, velas aromáticas, cestas de mimbre y dulces típicos como el turrón y el mazapán. El mercado abre todos los días de diez de la mañana a nueve de la noche. La entrada es libre. Este año, por primera vez, hay un taller de elaboración de figuras de arcilla para niños de entre cinco y doce años. Las sesiones duran cuarenta y cinco minutos y hay que inscribirse en el puesto de información. También actúa cada tarde el coro infantil del colegio San José. El año pasado visitaron el mercado más de diez mil personas."
    exercises:
      - type: reading
        question: "¿Cuándo se celebra el mercado? (última semana de noviembre/primera semana de diciembre/todo diciembre)"
        correctAnswer: primera semana de diciembre
        rationale: "El texto: 'durante la primera semana de diciembre'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde tiene lugar el mercado? (calle Mayor/plaza Mayor de Vilanova/parque central)"
        correctAnswer: plaza Mayor de Vilanova
        rationale: "El texto: 'la plaza Mayor de Vilanova'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos puestos hay? (más de veinte/más de cuarenta/más de sesenta)"
        correctAnswer: más de cuarenta
        rationale: "El texto: 'Más de cuarenta puestos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A qué hora cierra el mercado? (a las ocho/a las nueve/a las diez)"
        correctAnswer: a las nueve
        rationale: "El texto: 'a nueve de la noche'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto cuesta la entrada? (dos euros/un euro/es libre)"
        correctAnswer: es libre
        rationale: "El texto: 'La entrada es libre'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué novedad hay este año? (un taller de cocina/un taller de figuras de arcilla/un mercado de libros)"
        correctAnswer: un taller de figuras de arcilla
        rationale: "El texto: 'taller de elaboración de figuras de arcilla'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Para qué edades es el taller? (de tres a ocho años/de cinco a doce años/de ocho a catorce años)"
        correctAnswer: de cinco a doce años
        rationale: "El texto: 'niños de entre cinco y doce años'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto dura cada sesión del taller? (treinta minutos/cuarenta y cinco minutos/una hora)"
        correctAnswer: cuarenta y cinco minutos
        rationale: "El texto: 'Las sesiones duran cuarenta y cinco minutos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién actúa cada tarde? (una banda de música/el coro infantil del colegio San José/un grupo de danza)"
        correctAnswer: el coro infantil del colegio San José
        rationale: "El texto: 'actúa cada tarde el coro infantil del colegio San José'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas personas visitaron el mercado el año pasado? (más de cinco mil/más de diez mil/más de veinte mil)"
        correctAnswer: más de diez mil
        rationale: "El texto: 'más de diez mil personas'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
