title: Gramática - Clases de Palabras
level: B
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Sustantivo (nombre de persona, animal, cosa, lugar, idea), verbo (acción o estado), adjetivo (califica al sustantivo), adverbio (modifica verbo, adjetivo u otro adverbio), determinante (artículo, demostrativo, posesivo), pronombre (sustituye al sustantivo), preposición (enlaza), conjunción (une oraciones)."
example: "niño → sustantivo. corre → verbo. rápido (adj). rápidamente → adverbio. el/este/mi → determinante."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Identificar la Clase
    description: Indica a qué clase pertenece la palabra en negrita.
    exercises:
      - type: grammar
        question: "**Mesa**: (verbo/sustantivo/adjetivo)"
        correctAnswer: sustantivo
        rationale: "'Mesa' nombra un objeto → sustantivo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "**Correr**: (sustantivo/adverbio/verbo)"
        correctAnswer: verbo
        rationale: "'Correr' expresa acción → verbo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "**Azul**: (adverbio/adjetivo/sustantivo)"
        correctAnswer: adjetivo
        rationale: "'Azul' califica al sustantivo → adjetivo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "**Bien**: (adjetivo/adverbio/conjunción)"
        correctAnswer: adverbio
        rationale: "'Bien' modifica un verbo o adjetivo → adverbio."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "**El** (delante de sustantivo): (pronombre/preposición/determinante)"
        correctAnswer: determinante
        rationale: "'El' artículo determina al sustantivo → determinante."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella **canta** muy bien.' ¿Clase de 'canta'? (sustantivo/verbo/adverbio)"
        correctAnswer: verbo
        rationale: "'Canta' expresa la acción del sujeto → verbo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "**Aquí**: (adjetivo/adverbio/preposición)"
        correctAnswer: adverbio
        rationale: "'Aquí' indica lugar → adverbio de lugar."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "**Y** (une dos oraciones): (adverbio/preposición/conjunción)"
        correctAnswer: conjunción
        rationale: "'Y' une elementos o proposiciones → conjunción."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vivo **en** Madrid.' ¿Clase de 'en'? (adverbio/preposición/conjunción)"
        correctAnswer: preposición
        rationale: "'En' enlaza el verbo con el complemento → preposición."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'**Él** llegó tarde.' ¿Clase de 'él'? (determinante/pronombre/adjetivo)"
        correctAnswer: pronombre
        rationale: "'Él' sustituye al nombre del sujeto → pronombre personal."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Función en la Oración
    description: Clasifica la palabra subrayada en la oración.
    exercises:
      - type: grammar
        question: "'El perro **grande** ladra.' ¿Clase? (adverbio/adjetivo/sustantivo)"
        correctAnswer: adjetivo
        rationale: "'Grande' califica a 'perro' → adjetivo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Habla muy **despacio**.' ¿Clase de 'despacio'? (adjetivo/sustantivo/adverbio)"
        correctAnswer: adverbio
        rationale: "'Despacio' modifica el verbo 'habla' → adverbio de modo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'**Mi** libro está aquí.' ¿Clase de 'mi'? (pronombre/determinante/conjunción)"
        correctAnswer: determinante
        rationale: "'Mi' posesivo determina a 'libro' → determinante."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La niña **lloró**.' ¿Función del verbo? (núcleo del sujeto/núcleo del predicado/complemento)"
        correctAnswer: núcleo del predicado
        rationale: "El verbo es siempre el núcleo del predicado."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué clase es 'libertad'? (adjetivo/verbo/sustantivo abstracto)"
        correctAnswer: sustantivo abstracto
        rationale: "'Libertad' nombra una idea abstracta → sustantivo abstracto."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Salió **pero** volvió pronto.' ¿Clase de 'pero'? (preposición/adverbio/conjunción)"
        correctAnswer: conjunción
        rationale: "'Pero' une dos oraciones coordinadas → conjunción adversativa."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre adjetivo y adverbio? (el adjetivo modifica verbos/el adverbio califica sustantivos/el adjetivo califica sustantivos, el adverbio modifica verbos)"
        correctAnswer: el adjetivo califica sustantivos, el adverbio modifica verbos
        rationale: "Adjetivo → sustantivo; adverbio → verbo, adjetivo u otro adverbio."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'**Este** coche es nuevo.' ¿Clase de 'este'? (pronombre/determinante demostrativo/adverbio)"
        correctAnswer: determinante demostrativo
        rationale: "'Este' señala a 'coche' → determinante demostrativo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige el adverbio: (casa/bonito/rápidamente/y)"
        correctAnswer: rápidamente
        rationale: "Los adverbios en -mente modifican verbos o adjetivos."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige el sustantivo: (correr/verde/ciudad/aunque)"
        correctAnswer: ciudad
        rationale: "'Ciudad' nombra un lugar → sustantivo."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
