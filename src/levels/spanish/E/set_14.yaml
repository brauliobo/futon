title: Gramática - Figuras Retóricas Avanzadas
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Figuras de pensamiento: ironía, paradoja, antítesis, hipérbole, eufemismo, lítotes. Figuras de dicción: aliteración, paronomasia, retruécano, zeugma. Figuras de construcción avanzadas: quiasmo, políptoton, epíteto, apóstrofe, prosopopeya. Diferencia entre comparación, metáfora, alegoría y símbolo. Función estética vs. argumentativa."
example: "ironía → 'Qué bonito está el tiempo' (cuando llueve). paradoja → 'Vivo sin vivir en mí'. antítesis → amor/odio enfrentados. quiasmo → 'Cuando quiero llorar, no lloro; y a veces lloro sin querer'. zeugma → 'Tomó el sombrero y la puerta'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Figuras de Pensamiento y Dicción
    description: Identifica la figura retórica.
    exercises:
      - type: grammar
        question: "'Vivo sin vivir en mí, / y tan alta vida espero / que muero porque no muero.' (Santa Teresa) ¿Figura? (metáfora/paradoja/hipérbole)"
        correctAnswer: paradoja
        rationale: "La paradoja une ideas aparentemente contradictorias que expresan una verdad más profunda."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la ironía? (decir lo contrario de lo que se piensa con intención crítica o humorística/una comparación elaborada/una repetición fonética)"
        correctAnswer: decir lo contrario de lo que se piensa con intención crítica o humorística
        rationale: "La ironía invierte el sentido literal para expresar crítica, humor o distancia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Cuando quiero llorar, no lloro; / y a veces lloro sin querer.' (Rubén Darío) ¿Figura? (anáfora/quiasmo/epíteto)"
        correctAnswer: quiasmo
        rationale: "El quiasmo invierte el orden de los elementos en dos miembros paralelos: A-B / B-A."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tomó el sombrero y la puerta.' ¿Figura? (zeugma/paronomasia/apóstrofe)"
        correctAnswer: zeugma
        rationale: "El zeugma aplica un verbo a dos complementos con distinto valor semántico: tomó el sombrero (físico) y la puerta (marcharse)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la lítotes? (exageración/afirmar algo negando su contrario/dar vida a objetos inanimados)"
        correctAnswer: afirmar algo negando su contrario
        rationale: "Lítotes: 'no es feo' (= es guapo); 'no está mal' (= está bien) → atenuación por negación del opuesto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El dulce lamentar de dos pastores.' ¿Figura de 'dulce' aplicado a 'lamentar'? (sinestesia/epíteto/hipérbaton)"
        correctAnswer: sinestesia
        rationale: "Aplicar un adjetivo de un sentido (gusto: dulce) a una percepción de otro (oído: lamentar) → sinestesia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¡Oh, soledad, qué bella eres!' ¿Figura? (hipérbole/apóstrofe/antítesis)"
        correctAnswer: apóstrofe
        rationale: "El apóstrofe indica la interpelación a un ser ausente, abstracto o inanimado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la paronomasia? (repetición de una estructura sintáctica/uso de palabras de sonido similar pero distinto significado/inversión del orden lógico)"
        correctAnswer: uso de palabras de sonido similar pero distinto significado
        rationale: "Paronomasia: 'un necio necio, necio de remate' o 'bello vello' → juego fónico con parónimos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Las perlas de tu boca' en lugar de 'tus dientes'. ¿Figura? (metonimia/metáfora in absentia/alegoría)"
        correctAnswer: metáfora in absentia
        rationale: "Metáfora in absentia: solo aparece el término imaginario (perlas) sin el real (dientes)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El polvo enamorado' (Quevedo) → polvo que sigue amando tras la muerte. ¿Figura? (prosopopeya/hipérbaton/oxímoron)"
        correctAnswer: prosopopeya
        rationale: "La prosopopeya (personificación) atribuye cualidades humanas (enamorado) a seres inanimados (polvo)."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Alegoría, Símbolo y Funciones
    description: Distingue figuras avanzadas y sus funciones.
    exercises:
      - type: grammar
        question: "¿Qué diferencia hay entre metáfora y alegoría? (son sinónimas/la alegoría es una metáfora extendida a todo un texto/la metáfora usa 'como')"
        correctAnswer: la alegoría es una metáfora extendida a todo un texto
        rationale: "La alegoría desarrolla una comparación en profundidad a lo largo de toda la obra o sección."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué función tiene el eufemismo? (intensificar/suavizar o atenuar una realidad desagradable/comparar dos elementos)"
        correctAnswer: suavizar o atenuar una realidad desagradable
        rationale: "El eufemismo sustituye una expresión negativa por otra más suave: 'pasar a mejor vida' por 'morir'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el políptoton? (repetición fonética/usar la misma palabra en distintas formas morfológicas/una figura de pensamiento)"
        correctAnswer: usar la misma palabra en distintas formas morfológicas
        rationale: "Políptoton: 'sueño soñar' o 'vive viviendo' → misma raíz en distintas funciones gramaticales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Verde que te quiero verde.' (Lorca) ¿Figuras? (políptoton/anáfora + repetición con énfasis lírico/aliteración)"
        correctAnswer: anáfora + repetición con énfasis lírico
        rationale: "La repetición de 'verde' al inicio y al final crea una estructura anafórica y de énfasis simbólico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo tiene función argumentativa una figura retórica? (nunca, solo tiene función estética/cuando refuerza o ilustra una tesis, como en la analogía o el ejemplo/siempre que aparece en un texto)"
        correctAnswer: cuando refuerza o ilustra una tesis, como en la analogía o el ejemplo
        rationale: "En el texto argumentativo, figuras como la comparación, la hipérbole o la ironía pueden reforzar la argumentación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el retruécano? (una figura fonética/inversión de los términos de una frase en la siguiente para cambiar el sentido/un tipo de metáfora)"
        correctAnswer: inversión de los términos de una frase en la siguiente para cambiar el sentido
        rationale: "Retruécano: 'No hay que comer para vivir, sino vivir para comer' → inversión con cambio semántico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el símbolo literario? (una comparación directa/un elemento concreto que representa una idea abstracta de forma convencional o contextual/una figura de dicción)"
        correctAnswer: un elemento concreto que representa una idea abstracta de forma convencional o contextual
        rationale: "El símbolo (paloma = paz; cruz = fe; noche = muerte) opera en el nivel del imaginario cultural o del texto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nuestras vidas son los ríos / que van a dar en la mar / que es el morir.' (Manrique) ¿Figura dominante? (hipérbole/alegoría/antítesis)"
        correctAnswer: alegoría
        rationale: "El río que desemboca en el mar = la vida que termina en la muerte → alegoría sostenida."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Un no sé qué que quedan balbuciendo.' (San Juan de la Cruz) ¿Figura fonética? (paronomasia/aliteración/hipérbaton)"
        correctAnswer: aliteración
        rationale: "Repetición del fonema /k/ (que, quedan) → aliteración, figura fonética."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿En qué se diferencia la antítesis del oxímoron? (son sinónimos/la antítesis enfrenta dos ideas en proposiciones; el oxímoron las une en una sola expresión/el oxímoron es más largo)"
        correctAnswer: la antítesis enfrenta dos ideas en proposiciones; el oxímoron las une en una sola expresión
        rationale: "Antítesis: 'amor y odio' en frases distintas. Oxímoron: 'silencio ensordecedor' → contradicción en la misma expresión."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
