title: 📖 Gramática - Literatura del Siglo de Oro
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Siglo de Oro (XVI-XVII): Renacimiento y Barroco. Lírica: Garcilaso (petrarquismo), Fray Luis de León (ascetismo), San Juan de la Cruz (mística), Góngora (culteranismo/gongorismo), Quevedo (conceptismo). Teatro: Lope de Vega (comedia nueva: 3 actos, mezcla cómico/trágico, honor), Calderón de la Barca (La vida es sueño). Prosa: Cervantes (Quijote), Quevedo (El Buscón), Mateo Alemán (Guzmán de Alfarache). Características del Barroco: desengaño, vanitas, contraste, oscuridad conceptual o formal."
example: "culteranismo → Góngora: metáforas oscuras, latinismos. conceptismo → Quevedo: agudeza, doble sentido. comedia nueva → Lope: 3 actos, honor, mezcla géneros. mística → San Juan: unión del alma con Dios."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Autores y Corrientes
    description: Asocia autores, obras y corrientes del Siglo de Oro.
    exercises:
      - type: grammar
        question: "¿A qué corriente pertenece Góngora? (conceptismo/culteranismo/petrarquismo)"
        correctAnswer: culteranismo
        rationale: "Góngora es el máximo representante del culteranismo: metáforas oscuras y latinismos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿A qué corriente pertenece Quevedo? (culteranismo/petrarquismo/conceptismo)"
        correctAnswer: conceptismo
        rationale: "Quevedo representa el conceptismo: agudeza, juego de conceptos y doble sentido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Quién escribió 'La vida es sueño'? (Lope de Vega/Calderón de la Barca/Tirso de Molina)"
        correctAnswer: Calderón de la Barca
        rationale: "'La vida es sueño' es la obra más famosa de Calderón de la Barca."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Quién codificó la comedia nueva? (Calderón/Tirso de Molina/Lope de Vega)"
        correctAnswer: Lope de Vega
        rationale: "Lope de Vega estableció las normas de la comedia nueva en su 'Arte nuevo de hacer comedias'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántos actos tiene la comedia nueva de Lope? (dos/tres/cinco)"
        correctAnswer: tres
        rationale: "La comedia nueva se divide en tres actos (jornadas)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "La poesía mística de San Juan de la Cruz trata sobre: (el amor humano/la crítica social/la unión del alma con Dios)"
        correctAnswer: la unión del alma con Dios
        rationale: "La mística española (San Juan, Santa Teresa) describe el camino del alma hacia la unión con Dios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué género representan el Lazarillo de Tormes y el Guzmán de Alfarache? (novela pastoril/novela picaresca/novela de caballerías)"
        correctAnswer: novela picaresca
        rationale: "El pícaro es el protagonista de estas novelas realistas y críticas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el tema central del Barroco? (el amor idealizado/el desengaño y la vanidad del mundo/la gloria de la guerra)"
        correctAnswer: el desengaño y la vanidad del mundo
        rationale: "El Barroco tiene como temas centrales el desengaño (vanitas), la fugacidad y el contraste."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Quién introdujo el soneto petrarquista en castellano? (Quevedo/Góngora/Garcilaso de la Vega)"
        correctAnswer: Garcilaso de la Vega
        rationale: "Garcilaso introdujo el soneto y la lira de influencia italiana en la poesía castellana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el culteranismo? (uso de conceptos ingeniosos/estilo oscuro con latinismos y metáforas elaboradas/poesía ascética)"
        correctAnswer: estilo oscuro con latinismos y metáforas elaboradas
        rationale: "El culteranismo (gongorismo) se caracteriza por la oscuridad formal, los latinismos y las metáforas muy elaboradas."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis de Textos del Siglo de Oro
    description: Analiza fragmentos y recursos literarios.
    exercises:
      - type: grammar
        question: "'Ándeme yo caliente / y ríase la gente.' (Góngora). ¿Tono? (solemne/irónico y desenfadado/místico)"
        correctAnswer: irónico y desenfadado
        rationale: "Góngora también escribió poesía burlesca y desenfadada, no solo culterana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El honor es el tema central de la comedia nueva. ¿Quién puede restaurarlo? (solo el rey/el propio ofendido/cualquier persona)"
        correctAnswer: el propio ofendido
        rationale: "En la comedia del Siglo de Oro, el personaje ofendido es quien debe vengar y restaurar su honor."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La vida es sueño' reflexiona sobre: (el amor y la naturaleza/la libertad, el libre albedrío y la ilusión de la realidad/la picaresca social)"
        correctAnswer: la libertad, el libre albedrío y la ilusión de la realidad
        rationale: "'¿Qué es la vida? Un frenesí... / que toda la vida es sueño' → libre albedrío y la realidad como ilusión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué caracteriza el conceptismo? (metáforas formalmente oscuras/agudeza de pensamiento y juego de conceptos/descripción de la naturaleza)"
        correctAnswer: agudeza de pensamiento y juego de conceptos
        rationale: "El conceptismo se basa en la ingeniosidad conceptual: doble sentido, paradojas, antítesis."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿En qué siglos se desarrolla el Siglo de Oro? (XIV y XV/XVI y XVII/XVII y XVIII)"
        correctAnswer: XVI y XVII
        rationale: "El Siglo de Oro abarca los siglos XVI (Renacimiento) y XVII (Barroco)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la vanitas en el Barroco? (un tipo de metáfora/la reflexión sobre la futilidad y brevedad de la vida/un género teatral)"
        correctAnswer: la reflexión sobre la futilidad y brevedad de la vida
        rationale: "Vanitas (vanidad): 'todo es vanidad', nada es permanente → tema barroco central."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Fray Luis de León representa: (el culteranismo/el petrarquismo renacentista y el ascetismo/la mística pura)"
        correctAnswer: el petrarquismo renacentista y el ascetismo
        rationale: "Fray Luis combina el ideal renacentista clásico con la aspiración religiosa ascética."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el gracioso en la comedia nueva? (el antagonista/el personaje cómico que acompaña al galán/el personaje principal)"
        correctAnswer: el personaje cómico que acompaña al galán
        rationale: "El gracioso es el criado cómico y sensato que contrasta con el idealismo del señor."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El petrarquismo se caracteriza por: (la crítica social/el amor idealizado a una dama inalcanzable y el uso del soneto/la poesía mística)"
        correctAnswer: el amor idealizado a una dama inalcanzable y el uso del soneto
        rationale: "Petrarca y sus seguidores idealizan a la amada y sufren por un amor imposible en forma de soneto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué obra de Quevedo es una novela picaresca? (El Buscón/Los sueños/El criticón)"
        correctAnswer: El Buscón
        rationale: "'Historia de la vida del Buscón' de Quevedo es una novela picaresca con crítica social burlesca."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
