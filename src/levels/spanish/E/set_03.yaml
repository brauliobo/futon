title: Gramática - Subordinadas Sustantivas y Adjetivas
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Subordinadas sustantivas: funcionan como sujeto, CD, CI o atributo. Introductor: que + indicativo/subjuntivo. Sustantivas de sujeto: 'Que llegues tarde me molesta'. Sustantivas de CD: 'Quiero que vengas'. Relativas especificativas (sin pausa) vs. explicativas (entre comas). Relativas con preposición: 'el libro del que hablé'. Relativas con cuyo (posesivo, concuerda con el sustantivo que sigue)."
example: "sust. sujeto → Que apruebes me alegra. sust. CD → Espero que vengas. relativa espec. → el libro que compré (restringe). relativa expl. → Ana, que vive aquí, llegó tarde. cuyo → el autor cuya novela ganó el premio."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Subordinadas Sustantivas
    description: Identifica la función de la subordinada sustantiva.
    exercises:
      - type: grammar
        question: "'Que llegues tarde me preocupa.' ¿Función de la subordinada? (sujeto/CD/atributo)"
        correctAnswer: sujeto
        rationale: "La proposición 'que llegues tarde' es el sujeto del verbo 'preocupa'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quiero que estudies más.' ¿Función de 'que estudies más'? (sujeto/CD/CI)"
        correctAnswer: CD
        rationale: "¿Qué quiero? Que estudies más → complemento directo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El problema es que no hay tiempo.' ¿Función de 'que no hay tiempo'? (sujeto/CD/atributo)"
        correctAnswer: atributo
        rationale: "Verbo copulativo ser + proposición sustantiva → atributo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo lleva subjuntivo la sustantiva de CD? (cuando el verbo principal expresa certeza/cuando expresa deseo, emoción o duda/siempre)"
        correctAnswer: cuando expresa deseo, emoción o duda
        rationale: "Verbos de deseo (querer), emoción (alegrarse) y duda (dudar) rigen subjuntivo en la sustantiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Sé que tienes razón.' ¿Modo del verbo en la subordinada? (subjuntivo/indicativo/imperativo)"
        correctAnswer: indicativo
        rationale: "'Saber' expresa certeza → indicativo: 'tienes'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me alegra que hayas aprobado.' ¿Modo? (indicativo/subjuntivo/condicional)"
        correctAnswer: subjuntivo
        rationale: "'Alegrarse' es verbo de emoción → subjuntivo: 'hayas aprobado'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo puede sustituirse la sustantiva sujeto 'Que vengas es importante'? (Es importante venir/Venir es importante/ambas son correctas)"
        correctAnswer: ambas son correctas
        rationale: "La sustantiva sujeto puede sustituirse por un infinitivo cuando el sujeto es genérico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Le recomendé que descansara.' ¿Función de la subordinada? (CD/CI/sujeto)"
        correctAnswer: CD
        rationale: "¿Qué recomendé? Que descansara → CD (aunque hay CI 'le')."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué nexo introduce una sustantiva interrogativa indirecta? (que/si/aunque)"
        correctAnswer: si
        rationale: "'No sé si vendrá' → 'si' introduce la pregunta indirecta total (sí/no)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El hecho de que no avisara me sorprendió.' ¿Función? (CD/sujeto/aposición)"
        correctAnswer: sujeto
        rationale: "'El hecho de que no avisara' es el sujeto del verbo 'sorprendió'."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Subordinadas Adjetivas (Relativas)
    description: Identifica el tipo y función de la relativa.
    exercises:
      - type: grammar
        question: "'El libro que compré es bueno.' ¿Tipo de relativa? (explicativa/especificativa/apositiva)"
        correctAnswer: especificativa
        rationale: "Sin pausa, restringe el referente → especificativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ana, que estudia medicina, llegó tarde.' ¿Tipo de relativa? (especificativa/explicativa/sustantiva)"
        correctAnswer: explicativa
        rationale: "Entre comas, añade información sin restringir → explicativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El autor cuya novela ganó el premio es catalán.' ¿Qué expresa 'cuya'? (relación temporal/posesión: la novela del autor/contraste)"
        correctAnswer: posesión: la novela del autor
        rationale: "'Cuyo/a' es relativo posesivo: concuerda con 'novela' (femenino) y refiere al autor."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ese es el tema del que hablamos.' ¿Por qué lleva preposición? (por estilo/el verbo 'hablar' exige 'de' → relativa con preposición/es incorrecto)"
        correctAnswer: el verbo 'hablar' exige 'de' → relativa con preposición
        rationale: "Hablar de algo: la preposición del verbo se mantiene en la relativa: 'del que hablamos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el antecedente en 'La ciudad en la que nací es pequeña'? (la que/la ciudad/nací)"
        correctAnswer: la ciudad
        rationale: "El pronombre relativo 'la que' se refiere a su antecedente 'la ciudad'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quien estudia, aprueba.' ¿Tipo de relativa? (con antecedente expreso/relativa libre/sustantiva)"
        correctAnswer: relativa libre
        rationale: "'Quien' sin antecedente expreso funciona como relativa libre (= 'el que estudia')."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia semántica hay entre 'Los alumnos que estudian aprueban' y 'Los alumnos, que estudian, aprueban'? (ninguna/la primera restringe a los que estudian; la segunda afirma que todos estudian/la segunda es incorrecta)"
        correctAnswer: la primera restringe a los que estudian; la segunda afirma que todos estudian
        rationale: "Especificativa = solo los que estudian. Explicativa = todos estudian (y por eso aprueban)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede 'cuyo' sustituirse por 'que su'? (sí, son equivalentes/no, 'que su' es incorrecto en español normativo/solo en registro coloquial)"
        correctAnswer: no, 'que su' es incorrecto en español normativo
        rationale: "La construcción 'que su' es vulgarismo; la norma exige 'cuyo/a' para la posesión relativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Completa: 'No conozco a nadie ___ pueda ayudarte.' (que/quien/el cual)"
        correctAnswer: que
        rationale: "Con antecedente indefinido ('nadie'), se usa 'que' + subjuntivo en la relativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué modo usa la relativa con antecedente indefinido o inexistente? (indicativo/subjuntivo/condicional)"
        correctAnswer: subjuntivo
        rationale: "'Busco a alguien que sepa inglés' (subjuntivo: persona no identificada). 'Busco a alguien que sabe inglés' (indicativo: persona concreta)."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
