title: Lectura - La Globalización y sus Efectos
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Texto argumentativo sobre la globalización. Comprensión de argumentos, contraargumentos y la postura del autor."
example: "Lee con atención a la estructura argumentativa: tesis, argumentos a favor y contraargumentos del texto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La globalización es uno de los fenómenos más debatidos de las últimas décadas. Sus defensores argumentan que ha permitido reducir la pobreza extrema en países emergentes como China e India, ha facilitado el intercambio cultural y tecnológico, y ha generado un crecimiento económico sin precedentes. Sin embargo, sus críticos señalan que los beneficios no se han distribuido equitativamente: mientras las grandes corporaciones multinacionales han multiplicado sus beneficios, las clases medias de los países desarrollados han visto estancarse sus salarios, y los trabajadores de los países en desarrollo trabajan en condiciones precarias. Además, la globalización ha sido señalada como responsable de la homogeneización cultural: la difusión masiva de productos y contenidos anglosajones amenaza con desplazar lenguas, tradiciones y cosmovisiones locales. Otro efecto negativo es la aceleración del cambio climático, ya que la expansión de las cadenas de suministro globales aumenta las emisiones de CO₂. Frente a estas críticas, los economistas más favorables a la globalización responden que el problema no es la globalización en sí, sino la falta de marcos regulatorios internacionales que distribuyan sus frutos de forma justa. En conclusión, la globalización es una realidad irreversible cuya gestión determina si sus efectos son positivos o negativos."
    exercises:
      - type: reading
        question: "¿Cuál es la tesis final del texto? (la globalización es negativa/la globalización es positiva/la globalización es irreversible y sus efectos dependen de cómo se gestione)"
        correctAnswer: la globalización es irreversible y sus efectos dependen de cómo se gestione
        rationale: "El texto: 'la globalización es una realidad irreversible cuya gestión determina si sus efectos son positivos o negativos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué países menciona el texto como ejemplos de reducción de la pobreza? (Brasil y México/China e India/Nigeria y Sudáfrica)"
        correctAnswer: China e India
        rationale: "El texto: 'reducir la pobreza extrema en países emergentes como China e India'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué critican los opositores sobre la distribución de los beneficios? (que solo beneficia a los consumidores/que las ganancias no se reparten equitativamente/que reduce el comercio)"
        correctAnswer: que las ganancias no se reparten equitativamente
        rationale: "El texto: 'los beneficios no se han distribuido equitativamente'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué consecuencia cultural señala el texto? (enriquecimiento de las culturas locales/homogeneización cultural y amenaza a tradiciones locales/desaparición de internet)"
        correctAnswer: homogeneización cultural y amenaza a tradiciones locales
        rationale: "El texto: 'la homogeneización cultural: la difusión masiva de productos y contenidos anglosajones amenaza con desplazar lenguas, tradiciones y cosmovisiones locales'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo relaciona el texto la globalización con el cambio climático? (no los relaciona/la expansión de las cadenas de suministro globales aumenta las emisiones de CO₂/la globalización reduce las emisiones)"
        correctAnswer: la expansión de las cadenas de suministro globales aumenta las emisiones de CO₂
        rationale: "El texto: 'la expansión de las cadenas de suministro globales aumenta las emisiones de CO₂'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué responden los economistas favorables a la globalización ante las críticas? (que los críticos están equivocados/que el problema es la falta de marcos regulatorios internacionales/que hay que frenar la globalización)"
        correctAnswer: que el problema es la falta de marcos regulatorios internacionales
        rationale: "El texto: 'el problema no es la globalización en sí, sino la falta de marcos regulatorios internacionales'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué le ha ocurrido a los salarios de las clases medias de los países desarrollados? (han crecido/se han estancado/han caído drásticamente)"
        correctAnswer: se han estancado
        rationale: "El texto: 'las clases medias de los países desarrollados han visto estancarse sus salarios'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tipo de texto es este? (expositivo puro/argumentativo/narrativo)"
        correctAnswer: argumentativo
        rationale: "El texto presenta una tesis, argumentos, contraargumentos y conclusión → texto argumentativo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué función tiene el párrafo que empieza 'Frente a estas críticas...'? (presentar la tesis/introducir contraargumentos a las críticas/resumir el texto)"
        correctAnswer: introducir contraargumentos a las críticas
        rationale: "'Frente a estas críticas' introduce la respuesta de los defensores a los argumentos negativos → contraargumentación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué adjetivo usa el texto para calificar las condiciones laborales en países en desarrollo? (excelentes/precarias/regulares)"
        correctAnswer: precarias
        rationale: "El texto: 'los trabajadores de los países en desarrollo trabajan en condiciones precarias'."
        difficulty: 5
        objectives: [es.pre_reading]
target: 10
