title: ✏️ Gramática - El Subjuntivo en Oraciones Adverbiales
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Subjuntivo en adverbiales: temporales con 'cuando/hasta que/en cuanto/antes de que' + subjuntivo cuando el evento es futuro o hipotético. Concesivas: aunque + subjuntivo (concesión hipotética) vs. indicativo (concesión real). Condicionales: si + imperfecto de subj. (hipótesis irreal presente), si + pluscuamperfecto de subj. (hipótesis irreal pasada). Finales: para que + subjuntivo (siempre). Consecutivas: tan... que + indicativo."
example: "temporal futuro → cuando llegues, llámame (subj.). concesiva hipot. → aunque llueva, saldré. condicional irreal → si tuviera dinero, viajaría. final → te lo explico para que entiendas."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Temporales, Concesivas y Finales
    description: Elige el modo verbal correcto.
    exercises:
      - type: grammar
        question: "'Llámame cuando ___ en casa.' (llegues/llegas/llegarás)"
        correctAnswer: llegues
        rationale: "Temporal con referencia futura → subjuntivo: 'cuando llegues'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me llamó cuando ___ en casa.' (llegó/llegue/llegara)"
        correctAnswer: llegó
        rationale: "Temporal con referencia pasada real → indicativo: 'cuando llegó'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Te esperaré hasta que ___.' (vuelves/vuelvas/volverás)"
        correctAnswer: vuelvas
        rationale: "'Hasta que' con evento futuro → subjuntivo: 'vuelvas'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Aunque ___ razón, no lo admitiré.' (tengas/tienes/tendrás) — hablante no sabe si tiene razón"
        correctAnswer: tengas
        rationale: "Concesiva hipotética (hecho no verificado) → aunque + subjuntivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Aunque ___ razón, no lo admito.' — hablante sabe que tiene razón"
        correctAnswer: tienes
        rationale: "Concesiva de hecho real → aunque + indicativo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Lo hago para que lo ___.' (entiendes/entiendas/entenderás)"
        correctAnswer: entiendas
        rationale: "Las finales con 'para que' siempre exigen subjuntivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'En cuanto ___ los resultados, te aviso.' (salgan/salen/saldrán)"
        correctAnswer: salgan
        rationale: "'En cuanto' con futuro → subjuntivo: 'salgan'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Antes de que ___, hay que revisar todo.' (empiecen/empezarán/empiezan)"
        correctAnswer: empiecen
        rationale: "'Antes de que' siempre rige subjuntivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'cuando + subjuntivo' en el futuro? (por estilo/el subjuntivo indica que el evento aún no ha ocurrido/es una excepción gramatical)"
        correctAnswer: el subjuntivo indica que el evento aún no ha ocurrido
        rationale: "El subjuntivo marca hipoteticidad o no-realización del evento temporal futuro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Habla tan deprisa que no la entiendo.' ¿Modo en la consecutiva? (subjuntivo/indicativo/condicional)"
        correctAnswer: indicativo
        rationale: "Las consecutivas con 'tan... que' expresan consecuencia real → indicativo."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Condicionales y Concesivas Avanzadas
    description: Practica las condicionales irreales y estructuras avanzadas.
    exercises:
      - type: grammar
        question: "'Si ___ dinero, viajaría.' (tuviera/tengo/tendría)"
        correctAnswer: tuviera
        rationale: "Condicional irreal presente: si + imperfecto subjuntivo → condicional simple."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Si ___ estudiado, habrías aprobado.' (hubieras/hayas/habías)"
        correctAnswer: hubieras
        rationale: "Condicional irreal pasado: si + pluscuamperfecto de subjuntivo → cond. compuesto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Si tienes tiempo, ven.' ¿Tipo de condicional? (real posible/irreal presente/irreal pasado)"
        correctAnswer: real posible
        rationale: "Si + indicativo presente → condición real posible."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Estructura de la condicional irreal presente: (si + presente indicativo + condicional/si + imperfecto subj. + condicional simple/si + subjuntivo presente + futuro)"
        correctAnswer: si + imperfecto subj. + condicional simple
        rationale: "Si tuviera tiempo, iría → estructura canónica de la irreal presente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Estructura de la condicional irreal pasada: (si + imperfecto subj. + cond. simple/si + pluscuamperfecto subj. + cond. compuesto/si + pres. subj. + futuro)"
        correctAnswer: si + pluscuamperfecto subj. + cond. compuesto
        rationale: "Si hubiera sabido, no habría venido → estructura canónica de la irreal pasada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Por más que ___, no lo lograré.' (intento/intente/intentaría)"
        correctAnswer: intente
        rationale: "'Por más que' es concesiva → subjuntivo: 'intente'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'A menos que ___ a tiempo, perderemos el tren.' (lleguemos/llegamos/llegaríamos)"
        correctAnswer: lleguemos
        rationale: "'A menos que' siempre rige subjuntivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Con tal de que ___ de acuerdo, lo acepto.' (estéis/estáis/estaréis)"
        correctAnswer: estéis
        rationale: "'Con tal de que' rige subjuntivo → 'estéis'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Siempre que ___ posible, vengo a visitarte.' (sea/es/será)"
        correctAnswer: sea
        rationale: "'Siempre que' con valor condicional → subjuntivo: 'sea'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede usarse 'si' + subjuntivo presente? (sí, es correcto/no, es agramatical/solo en algunas regiones)"
        correctAnswer: no, es agramatical
        rationale: "Con 'si' condicional nunca se usa subjuntivo presente ni futuro: solo indicativo o imperfecto/pluscuamp. de subj."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
