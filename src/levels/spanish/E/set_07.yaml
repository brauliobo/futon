title: 📚 Lectura - La Constitución Española de 1978
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo cívico-histórico. Comprensión de conceptos constitucionales básicos: soberanía, derechos fundamentales, estado social y democrático de derecho."
example: "Constitución española (1978) → transición democrática → estructura: Título I (derechos fundamentales) + Título II (Corona) + Título III (Cortes) + Título IV (Gobierno) + Título VIII (organización territorial) → derechos: vida/libertad/igualdad/participación → Estado social y democrático de derecho → monarquía parlamentaria."
repeatAll: 2
