  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La Constitución española de 1978 es la ley fundamental del Estado español, aprobada en referéndum el 6 de diciembre de ese año, día que hoy se celebra como Día de la Constitución. Fue el resultado de un proceso de consenso conocido como la Transición democrática, que puso fin al régimen franquista tras la muerte del dictador Francisco Franco en 1975. La Constitución define a España como un Estado social y democrático de derecho, cuya forma política es la monarquía parlamentaria. La soberanía reside en el pueblo español, del que emanan todos los poderes del Estado. El texto reconoce un amplio catálogo de derechos fundamentales, entre ellos la libertad de expresión, el derecho a la educación, la igualdad ante la ley y la libertad religiosa. España se organiza territorialmente en municipios, provincias y comunidades autónomas. El Título VIII, que regula la organización territorial, fue uno de los más debatidos, ya que respondía a la necesidad de encauzar las aspiraciones de autogobierno de regiones históricas como Cataluña, el País Vasco y Galicia. La Constitución ha sido reformada en dos ocasiones: en 1992, para adaptar el derecho de sufragio activo a los ciudadanos europeos, y en 2011, para incluir el principio de estabilidad presupuestaria."
    exercises:
      - type: reading
        question: "¿Cuándo fue aprobada en referéndum la Constitución española? (6 de diciembre de 1978/23 de febrero de 1981/20 de noviembre de 1975)"
        correctAnswer: 6 de diciembre de 1978
        rationale: "El texto: 'aprobada en referéndum el 6 de diciembre de ese año'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué nombre recibe el proceso que puso fin al franquismo? (la Segunda República/la Restauración/la Transición democrática)"
        correctAnswer: la Transición democrática
        rationale: "El texto: 'proceso de consenso conocido como la Transición democrática'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo define la Constitución la forma política de España? (república federal/monarquía parlamentaria/dictadura constitucional)"
        correctAnswer: monarquía parlamentaria
        rationale: "El texto: 'cuya forma política es la monarquía parlamentaria'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde reside la soberanía según la Constitución? (en el rey/en el gobierno/en el pueblo español)"
        correctAnswer: en el pueblo español
        rationale: "El texto: 'La soberanía reside en el pueblo español, del que emanan todos los poderes del Estado'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuáles son las tres unidades territoriales en que se organiza España? (regiones, provincias y estados/municipios, provincias y comunidades autónomas/barrios, ciudades y naciones)"
        correctAnswer: municipios, provincias y comunidades autónomas
        rationale: "El texto: 'España se organiza territorialmente en municipios, provincias y comunidades autónomas'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué regula el Título VIII? (los derechos fundamentales/la organización territorial/el poder judicial)"
        correctAnswer: la organización territorial
        rationale: "El texto: 'El Título VIII, que regula la organización territorial'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué fue el Título VIII uno de los más debatidos? (por la separación de poderes/por las aspiraciones de autogobierno de regiones históricas/por los derechos económicos)"
        correctAnswer: por las aspiraciones de autogobierno de regiones históricas
        rationale: "El texto: 'respondía a la necesidad de encauzar las aspiraciones de autogobierno de regiones históricas como Cataluña, el País Vasco y Galicia'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas veces ha sido reformada la Constitución? (ninguna/una/dos)"
        correctAnswer: dos
        rationale: "El texto: 'La Constitución ha sido reformada en dos ocasiones: en 1992 y en 2011'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué introdujo la reforma de 2011? (el derecho de voto europeo/el principio de estabilidad presupuestaria/la abolición de la pena de muerte)"
        correctAnswer: el principio de estabilidad presupuestaria
        rationale: "El texto: 'en 2011, para incluir el principio de estabilidad presupuestaria'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tipo de Estado define la Constitución? (Estado liberal de mercado/Estado social y democrático de derecho/Estado teocrático)"
        correctAnswer: Estado social y democrático de derecho
        rationale: "El texto: 'define a España como un Estado social y democrático de derecho'."
        difficulty: 5
        objectives: [es.pre_reading]
