title: 🌟 Gramática - Léxico - Etimología y Familia de Palabras
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Etimología: origen de las palabras (latín, griego, árabe, germanismos, galicismos, anglicismos). Familia léxica: palabras que comparten raíz. Derivación: prefijos (in-, des-, re-, pre-, sub-, inter-, micro-, macro-) y sufijos (-ción, -dad, -mente, -ero, -ista, -ismo, -ura). Composición: combinación de dos bases léxicas (parabrisas, sacacorchos). Cultismos vs. patrimoniales: doble étimo (siglo/secular; delgado/delicado latín DELICATUS)."
example: "familia léxica de 'libro' → librero, librería, libreto, libelo. prefijo 'inter' → internacional, intercambio. sufijo '-ismo' → liberalismo, romanticismo. cultismo → frágil (FRAGILEM). patrimonial → frágil → fragil (con evolución fonética)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Derivación y Composición
    description: Identifica la formación de palabras.
    exercises:
      - type: grammar
        question: "¿Cuál es la raíz común de 'librería, librero, libreto'? (libr-/libre/libar)"
        correctAnswer: libr-
        rationale: "La raíz léxica es 'libr-' (del latín LIBER: libro); los sufijos añaden distintos significados."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Deshacer' se forma con: (prefijo des- + base/sufijo -hacer/composición)"
        correctAnswer: prefijo des- + base
        rationale: "'Des-' es prefijo de negación o inversión + 'hacer' → derivación prefijal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué significa el prefijo 'inter-' en 'internacional'? (dentro de/entre/debajo de)"
        correctAnswer: entre
        rationale: "'Inter-' (latín inter = entre): internacional = entre naciones."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Limpiaparabrisas' es una palabra: (derivada/compuesta/parasintética)"
        correctAnswer: compuesta
        rationale: "Limpia + para + brisas → composición de varias bases léxicas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El sufijo '-ura' en 'blancura' indica: (acción/cualidad abstracta/agente)"
        correctAnswer: cualidad abstracta
        rationale: "'-ura' forma sustantivos abstractos de cualidad: blancura, amargura, dulzura."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el cultismo correspondiente al patrimonial 'lleno'? (lleno/pleno/plenario)"
        correctAnswer: pleno
        rationale: "'Pleno' (cultismo del latín PLENUM) y 'lleno' (patrimonial con evolución PL→ll) son dobletes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Protagonista, tema, crisis' son palabras de origen: (árabe/latín/griego)"
        correctAnswer: griego
        rationale: "Muchos tecnicismos y cultismos científicos y literarios provienen del griego."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de formación es 'submarino'? (composición/derivación prefijal/parasíntesis)"
        correctAnswer: derivación prefijal
        rationale: "'Sub-' (debajo de) + 'marino' → derivación mediante prefijo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El sufijo '-ismo' en 'romanticismo' indica: (profesión/movimiento o doctrina/cualidad)"
        correctAnswer: movimiento o doctrina
        rationale: "'-ismo' forma sustantivos que designan movimientos, doctrinas o sistemas: romanticismo, liberalismo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántos morfemas tiene 'infelizmente'? (dos/tres/cuatro)"
        correctAnswer: tres
        rationale: "in- (prefijo) + feliz (raíz) + -mente (sufijo) → tres morfemas derivativos."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Etimología y Arabismos
    description: Identifica el origen de las palabras.
    exercises:
      - type: grammar
        question: "'Almohada, alcalde, azúcar' son arabismos. ¿Qué pista morfológica lo indica? (terminan en -a/empiezan con al-/son palabras cortas)"
        correctAnswer: empiezan con al-
        rationale: "'Al-' es el artículo árabe incorporado al sustantivo al pasar al español: alcázar, almacén, almohadón."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Jardín, danza, guerra' son germanismos. ¿Por qué? (vinieron del árabe/los visigodos introdujeron estas voces en el latín hispánico/son de origen griego)"
        correctAnswer: los visigodos introdujeron estas voces en el latín hispánico
        rationale: "Los pueblos germánicos (visigodos, francos) dejaron un sustrato léxico en el español medieval."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Menú, filete, hotel' son préstamos del: (inglés/italiano/francés)"
        correctAnswer: francés
        rationale: "Los galicismos (préstamos del francés) son frecuentes en gastronomía, moda y cultura: menú, filete, hotel."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Software, marketing, internet' son: (latinismos/anglicismos/italianismos)"
        correctAnswer: anglicismos
        rationale: "Los anglicismos son préstamos del inglés, frecuentes en tecnología y negocios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el doblete patrimonial de 'frágil' (del latín FRAGILEM)? (frágil/fácil/fraje)"
        correctAnswer: frágil
        rationale: "En este caso 'frágil' es ya el cultismo; no hay doblete patrimonial vivo en español moderno para FRAGILEM. La respuesta correcta contextualiza que es cultismo sin cambio fonético."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué proceso ocurre en 'autobús → bus'? (derivación/acortamiento/composición)"
        correctAnswer: acortamiento
        rationale: "El acortamiento (apócope) reduce una palabra a su forma abreviada habitual en el uso."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Telepatía, teléfono, televisión' comparten el prefijo de origen griego: (tele-/teli-/telo-)"
        correctAnswer: tele-
        rationale: "'Tele-' (griego: a distancia) es elemento compositivo culto de origen griego."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un préstamo lingüístico? (una palabra inventada/una palabra tomada de otra lengua/una palabra arcaica)"
        correctAnswer: una palabra tomada de otra lengua
        rationale: "Los préstamos adoptan una palabra tomada de otra lengua, con o sin adaptación ortofónica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Hacer' y 'factura' son dobletes del latín FACERE. ¿Qué diferencia los distingue? (hacer es patrimonial (con evolución); factura es cultismo (sin apenas cambio)/son sinónimos/factura es préstamo del árabe)"
        correctAnswer: hacer es patrimonial (con evolución); factura es cultismo (sin apenas cambio)
        rationale: "Los patrimoniales evolucionan fonéticamente (F→h, A→e); los cultismos conservan la forma latina."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El prefijo 'macro-' significa: (pequeño/grande/fuera de)"
        correctAnswer: grande
        rationale: "'Macro-' (griego: grande): macroeconómica, macrocosmos. Opuesto a 'micro-' (pequeño)."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
