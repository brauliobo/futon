title: 🔬 Gramática - Sintaxis de la Oración Compuesta Avanzada
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Subordinadas adverbiales avanzadas: causales (porque/ya que/puesto que/dado que), consecutivas (tan... que / tanto... que / así que), concesivas (aunque/a pesar de que/por más que), finales (para que/a fin de que), condicionales (si/a condición de que/siempre que). Distinción causa real/causa subjetiva. Posición de la causal: antepuesta (ya que) vs. pospuesta (porque). Correlaciones verbales en subordinadas."
example: "causal real → No fui porque llovía. causal subjetiva → Debe saber, puesto que estudió. consecutiva → Estudió tanto que aprobó. concesiva → Aunque llueva, saldré. final → Te lo explico para que entiendas."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Causales, Consecutivas y Concesivas
    description: Identifica el tipo de subordinada adverbial.
    exercises:
      - type: grammar
        question: "'No salí porque hacía frío.' ¿Tipo de subordinada? (causal/concesiva/consecutiva)"
        correctAnswer: causal
        rationale: "'Porque' introduce la causa de la acción → subordinada causal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estudió tanto que sacó matrícula.' ¿Tipo? (causal/final/consecutiva)"
        correctAnswer: consecutiva
        rationale: "'Tanto que' introduce la consecuencia de una intensidad → consecutiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'A pesar de que llovía, salió a correr.' ¿Tipo? (causal/concesiva/final)"
        correctAnswer: concesiva
        rationale: "'A pesar de que' introduce un obstáculo no suficiente para impedir la acción → concesiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre 'porque' y 'ya que'? (son sinónimos perfectos/porque puede ir antepuesto o pospuesto; ya que se prefiere antepuesto/ya que es más coloquial)"
        correctAnswer: porque puede ir antepuesto o pospuesto; ya que se prefiere antepuesto
        rationale: "'Ya que' y 'puesto que' suelen ir en posición inicial o intermedia; 'porque' es neutro en cuanto a posición."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Por más que lo intente, no lo logrará.' ¿Tipo? (causal/concesiva/condicional)"
        correctAnswer: concesiva
        rationale: "'Por más que' introduce una concesiva de intensidad → subjuntivo + valor concesivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Lo hace así a fin de que todos entiendan.' ¿Tipo? (final/causal/concesiva)"
        correctAnswer: final
        rationale: "'A fin de que' es conector final sinónimo de 'para que' → subordinada final."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Dado que no hay tiempo, aplazamos la reunión.' ¿Tipo? (consecutiva/causal/concesiva)"
        correctAnswer: causal
        rationale: "'Dado que' introduce la causa → causal antepuesta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Habla tan deprisa que nadie la entiende.' ¿Estructura? (tan + adj./adv. + que/tanto + sust. + que/tal + sust. + que)"
        correctAnswer: tan + adj./adv. + que
        rationale: "Consecutiva de intensidad: tan + adverbio (deprisa) + que → consecuencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Siempre que estudies, aprobarás.' ¿Tipo? (concesiva/condicional/causal)"
        correctAnswer: condicional
        rationale: "'Siempre que' con valor condicional → si estudias, aprobarás."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué modo rige la subordinada final con 'para que'? (indicativo/subjuntivo/condicional)"
        correctAnswer: subjuntivo
        rationale: "Las finales expresan propósito irreal (todavía no ocurrido) → subjuntivo obligatorio."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Correlaciones Verbales y Análisis
    description: Elige la forma verbal correcta en la subordinada.
    exercises:
      - type: grammar
        question: "Completa: 'Se lo expliqué para que lo ___.' (entendiera/entienda/entendería)"
        correctAnswer: entendiera
        rationale: "Verbo principal en pasado → final en imperfecto de subjuntivo: 'entendiera'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Completa: 'Se lo explico para que lo ___.' (entendiera/entienda/entendería)"
        correctAnswer: entienda
        rationale: "Verbo principal en presente → final en presente de subjuntivo: 'entienda'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede la causal ir en subjuntivo? (nunca/sí, cuando se niega: 'no porque quiera sino porque debo'/solo en textos literarios)"
        correctAnswer: "sí, cuando se niega: 'no porque quiera sino porque debo'"
        rationale: "La causal negada ('no porque + subj.') va en subjuntivo para negar la causa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Comió tanto que se puso malo.' ¿Función de 'que se puso malo'? (causal/consecutiva/concesiva)"
        correctAnswer: consecutiva
        rationale: "'Tanto... que' expresa la consecuencia de la acción intensa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué conector introduce una causa subjetiva (deducción del hablante)? (porque/puesto que/ya que)"
        correctAnswer: puesto que
        rationale: "'Puesto que' introduce una causa conocida o evidente para el hablante → causa explicativa/subjetiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Completa: 'Aunque ___ difícil, lo intentaremos.' — dificultad no confirmada (sea/es/sería)"
        correctAnswer: sea
        rationale: "Concesiva hipotética (dificultad no verificada) → aunque + subjuntivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Completa: 'Aunque ___ difícil, lo intentaremos.' — hablante constata el hecho como real (sea/es/sería)"
        correctAnswer: es
        rationale: "Concesiva de hecho real (confirmado) → aunque + indicativo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa 'a condición de que'? (causa/concesión/condición restrictiva)"
        correctAnswer: condición restrictiva
        rationale: "'A condición de que' establece la única condición bajo la que se cumple lo dicho → condicional restrictiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tan pronto como llegues, avísame.' ¿Tipo? (causal/temporal/concesiva)"
        correctAnswer: temporal
        rationale: "'Tan pronto como' equivale a 'en cuanto' → temporal con valor de inmediatez."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Pueden las subordinadas adverbiales ir antes o después de la principal? (solo después/solo antes/en ambas posiciones según énfasis y tipo)"
        correctAnswer: en ambas posiciones según énfasis y tipo
        rationale: "La posición de la subordinada adverbial varía según el tipo y el énfasis deseado."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
