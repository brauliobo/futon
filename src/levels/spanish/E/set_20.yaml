title: 📝 Revisión General - Nivel E
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Revisión de todos los contenidos del nivel E: Siglo de Oro, subordinadas sustantivas/adjetivas/adverbiales, subjuntivo avanzado, cohesión y coherencia, morfología verbal avanzada, comentario de texto, figuras retóricas avanzadas, argumentación avanzada, etimología, léxico."
example: "paradoja → 'Vivo sin vivir en mí' (contradicción aparente). cuyo → relativo posesivo (concuerda con lo poseído). si + subj. imperfecto → condicional irreal. deber de + inf. → deducción. participio absoluto → 'Terminada la reunión, se fue'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Repaso de Gramática y Literatura
    description: Elige la respuesta correcta.
    exercises:
      - type: grammar
        question: "¿A qué corriente pertenece Góngora? (petrarquismo/culteranismo/conceptismo)"
        correctAnswer: culteranismo
        rationale: "Góngora es el máximo representante del culteranismo: metáforas oscuras y latinismos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El autor cuya novela ganó el premio...' ¿Con qué concuerda 'cuya'? (con el autor/con la novela/con el premio)"
        correctAnswer: con la novela
        rationale: "'Cuyo/a' concuerda en género y número con el sustantivo que le sigue (novela, femenino)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Si ___ dinero, viajaría.' (tendría/tuviera/tengo)"
        correctAnswer: tuviera
        rationale: "Condicional irreal presente: si + imperfecto de subjuntivo → condicional simple."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Debo de haber llegado tarde.' ¿Qué expresa? (obligación/deducción/certeza)"
        correctAnswer: deducción
        rationale: "Deber de + infinitivo compuesto = deducción sobre el pasado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llegó cansado.' ¿Función de 'cansado'? (atributo/complemento predicativo del sujeto/adverbio)"
        correctAnswer: complemento predicativo del sujeto
        rationale: "'Cansado' describe al sujeto en el momento de la acción → complemento predicativo del sujeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vivo sin vivir en mí.' ¿Figura? (hipérbole/paradoja/metáfora)"
        correctAnswer: paradoja
        rationale: "Contradicción aparente que encierra una verdad más profunda → paradoja."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué aporta 'este fenómeno' para retomar 'el cambio climático'? (deixis espacial/anáfora textual/catáfora)"
        correctAnswer: anáfora textual
        rationale: "'Este fenómeno' retoma por sustitución léxica algo ya mencionado → anáfora textual."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El prefijo 'micro-' significa: (grande/pequeño/entre)"
        correctAnswer: pequeño
        rationale: "'Micro-' (griego: pequeño): microscopio, microchip, microbio."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Habiendo terminado el trabajo, salió.' ¿Función del gerundio compuesto? (modo/causa simultánea/anterioridad temporal)"
        correctAnswer: anterioridad temporal
        rationale: "El gerundio compuesto (habiendo + participio) expresa anterioridad respecto al verbo principal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué analiza el nivel pragmático del comentario de texto? (los tiempos verbales/la intención comunicativa y el contexto/la ortografía)"
        correctAnswer: la intención comunicativa y el contexto
        rationale: "El nivel pragmático estudia la relación del texto con su contexto y la intención del emisor."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Repaso de Análisis y Comprensión
    description: Continúa el repaso del nivel E.
    exercises:
      - type: grammar
        question: "¿Qué es la lítotes? (exageración/afirmar negando el contrario/dar vida a lo inanimado)"
        correctAnswer: afirmar negando el contrario
        rationale: "Lítotes: 'no está mal' = está bien → atenuación por negación del opuesto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Almohada, alcalde, azúcar' son arabismos. ¿Qué pista da 'al-'? (son cultos/es el artículo árabe incorporado/son germanismos)"
        correctAnswer: es el artículo árabe incorporado
        rationale: "'Al-' es el artículo árabe que pasó al español junto al sustantivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Completa la final: 'Te lo expliqué para que lo ___.' (entiendas/entendiera/entendería)"
        correctAnswer: entendiera
        rationale: "Verbo principal en pasado → final en imperfecto de subjuntivo: 'entendiera'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No solo estudió sino que también trabajó.' ¿Tipo de correlación? (adversativa/copulativa con énfasis/disyuntiva)"
        correctAnswer: copulativa con énfasis
        rationale: "'No solo... sino también' es correlación copulativa enfática que suma dos hechos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué movimiento buscó liberar el inconsciente? (el cubismo/el surrealismo/el futurismo)"
        correctAnswer: el surrealismo
        rationale: "El surrealismo (Breton, 1924) buscaba liberar el inconsciente mediante escritura automática e imágenes oníricas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Terminada la reunión, todos se marcharon.' ¿Qué es 'Terminada la reunión'? (gerundio compuesto/participio absoluto/subordinada adverbial con nexo)"
        correctAnswer: participio absoluto
        rationale: "Participio + sustantivo sin nexo explícito → participio absoluto con valor temporal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la Generación del 27? (escritores del 98/grupo de poetas que combinó tradición lírica y vanguardia/novelistas realistas)"
        correctAnswer: grupo de poetas que combinó tradición lírica y vanguardia
        rationale: "La Generación del 27 (Lorca, Alberti, Guillén…) fusionó la tradición española con las vanguardias europeas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de argumento es 'Según datos de la OMS, fumar mata a 8 millones al año'? (por analogía/estadístico con autoridad/de consecuencia)"
        correctAnswer: estadístico con autoridad
        rationale: "Combina datos numéricos (estadístico) con la cita de una fuente experta (autoridad)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Por más que lo intente, no lo logrará.' ¿Modo verbal? (indicativo/subjuntivo/condicional)"
        correctAnswer: subjuntivo
        rationale: "'Por más que' rige subjuntivo → concesiva hipotética."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa 'Aunque tienes razón, no lo admito'? (concesión hipotética/concesión de hecho real/condición)"
        correctAnswer: concesión de hecho real
        rationale: "Aunque + indicativo = concesiva de hecho real (el hablante acepta que tiene razón)."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
