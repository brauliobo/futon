    title: El Texto
    description: "Texto: El término 'inteligencia emocional' fue popularizado por el psicólogo Daniel Goleman en 1995, aunque el concepto fue acuñado antes por los investigadores Peter Salovey y John Mayer. Goleman define la inteligencia emocional como la capacidad de reconocer, entender y gestionar las propias emociones, así como de reconocer y responder adecuadamente a las emociones de los demás. Según sus investigaciones, la inteligencia emocional predice el éxito laboral y personal mejor que el cociente intelectual (CI) en muchos contextos. Los componentes principales de la inteligencia emocional son la autoconciencia (conocer las propias emociones), la autorregulación (gestionar los impulsos), la motivación interna, la empatía y las habilidades sociales. Estudios longitudinales han demostrado que los niños con mayor autocontrol emocional obtienen mejores resultados académicos y tienen menos problemas conductuales en la adolescencia. Sin embargo, la comunidad científica debate la validez del constructo: algunos investigadores argumentan que la inteligencia emocional no es sino una combinación de rasgos de personalidad ya conocidos, y que su medición es difícil y poco fiable. A pesar de estas críticas, el modelo de Goleman ha tenido una enorme influencia en el ámbito educativo y empresarial."
