title: 📝 Gramática - El Comentario de Texto
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "El comentario de texto: estructura y fases. 1) Localización y contexto (autor, época, género, subgénero). 2) Tema e ideas principales (estructura interna: planteamiento, nudo, desenlace o tesis-argumentos-conclusión). 3) Análisis de la forma: nivel léxico (campos semánticos, recursos), nivel morfosintáctico (modo verbal, tipos de oraciones, pasiva/activa), nivel pragmático (intención, registro, receptor). 4) Valoración personal argumentada. Comentario literario vs. comentario de texto periodístico o expositivo."
example: "localización → texto expositivo s. XXI, divulgación científica, receptor no especializado. tema → el cambio climático. estructura → intro (def.) + desarrollo (causas/efectos) + conclusión. recursos → nominalización, pasiva impersonal, léxico técnico."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Fases del Comentario de Texto
    description: Identifica las partes del comentario.
    exercises:
      - type: grammar
        question: "¿Qué información incluye la localización de un texto? (el resumen del texto/solo el título/autor, época, género, contexto de producción)"
        correctAnswer: autor, época, género, contexto de producción
        rationale: "La localización sitúa el texto en su contexto histórico, autorial y genérico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el tema del asunto de un texto? (el asunto es más abstracto/son sinónimos/el tema es la idea central en forma abstracta; el asunto es el contenido concreto)"
        correctAnswer: el tema es la idea central en forma abstracta; el asunto es el contenido concreto
        rationale: "Asunto: 'un científico descubre una vacuna'. Tema: 'el avance de la ciencia al servicio de la humanidad'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué analiza el nivel morfosintáctico en el comentario? (la intención del autor/el léxico y su connotación/los tiempos verbales, tipos de oración y construcciones sintácticas)"
        correctAnswer: los tiempos verbales, tipos de oración y construcciones sintácticas
        rationale: "El nivel morfosintáctico clasifica los tiempos verbales, tipos de oración y construcciones sintácticas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué analiza el nivel léxico-semántico? (el número de palabras/solo los errores ortográficos/los campos semánticos, connotaciones, recursos léxicos y registro)"
        correctAnswer: los campos semánticos, connotaciones, recursos léxicos y registro
        rationale: "El nivel léxico clasifica los campos semánticos, connotaciones, recursos léxicos y registro: tecnicismos, figuras."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué indica el uso predominante de tiempos en presente de indicativo en un texto expositivo? (incertidumbre/subjetividad/objetividad y atemporalidad de la información)"
        correctAnswer: objetividad y atemporalidad de la información
        rationale: "El presente gnómico o atemporal en textos expositivos da sensación de universalidad y objetividad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué revela el uso de la pasiva impersonal ('se ha demostrado que') en un texto? (énfasis en el sujeto/subjetividad del autor/ocultación del agente para dar objetividad)"
        correctAnswer: ocultación del agente para dar objetividad
        rationale: "La pasiva impersonal elimina el agente → el texto gana distancia y apariencia de objetividad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la estructura externa de un texto? (las ideas principales/la división en párrafos, estrofas o capítulos/el léxico utilizado)"
        correctAnswer: la división en párrafos, estrofas o capítulos
        rationale: "La estructura externa es la organización formal visible: párrafos, estrofas, etc."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la estructura interna? (la ortografía/la organización lógica de las ideas: planteamiento, nudo, desenlace o tesis, argumentos, conclusión/la extensión del texto)"
        correctAnswer: "la organización lógica de las ideas: planteamiento, nudo, desenlace o tesis, argumentos, conclusión"
        rationale: "La estructura interna analiza cómo se organizan las ideas y qué función tiene cada parte."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "En la valoración personal del comentario, ¿qué debe hacer el alumno? (copiar las ideas del autor/emitir un juicio argumentado sobre el fondo y la forma del texto/describir su experiencia personal)"
        correctAnswer: emitir un juicio argumentado sobre el fondo y la forma del texto
        rationale: "La valoración personal exige tomar postura y justificarla con argumentos, no solo opinar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el comentario literario del comentario de texto periodístico? (no hay diferencia/el literario analiza recursos estilísticos y en el contexto de la obra; el periodístico se centra en la intención comunicativa e información/el periodístico es siempre más largo)"
        correctAnswer: el literario analiza recursos estilísticos y en el contexto de la obra; el periodístico se centra en la intención comunicativa e información
        rationale: "El comentario literario añade el análisis de figuras retóricas, métrica y contexto de la obra; el periodístico enfatiza el género y la intención informativa."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Aplicación al Comentario
    description: Practica el análisis de un texto.
    exercises:
      - type: grammar
        question: "Un texto con léxico técnico especializado, pasiva impersonal y tercera persona pertenece a: (registro coloquial/registro formal-científico/registro literario)"
        correctAnswer: registro formal-científico
        rationale: "El léxico especializado, la impersonalidad y la tercera persona son marcas del registro formal científico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué aporta detectar el campo semántico dominante en un texto? (conocer la ortografía/identificar el tema y la perspectiva temática del texto/detectar errores gramaticales)"
        correctAnswer: identificar el tema y la perspectiva temática del texto
        rationale: "El campo semántico dominante revela de qué trata el texto y qué enfoque adopta (bélico, científico, afectivo…)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Un texto periodístico de opinión con primera persona, argumentos y tesis explícita es: (expositivo/argumentativo-editorial/narrativo)"
        correctAnswer: argumentativo-editorial
        rationale: "El editorial combina la función argumentativa (tesis + argumentos) con la primera persona del autor."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Para qué sirve identificar el receptor implícito de un texto? (para saber si el texto es literario/para entender el registro, el léxico elegido y la intención comunicativa/para detectar el narrador)"
        correctAnswer: para entender el registro, el léxico elegido y la intención comunicativa
        rationale: "El receptor determina el nivel de complejidad, el léxico y la intención del emisor."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "En un texto expositivo-divulgativo, ¿qué función lingüística predomina? (expresiva/referencial/apelativa)"
        correctAnswer: referencial
        rationale: "La función referencial (transmitir información sobre la realidad) domina en los textos expositivos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué analiza el nivel pragmático del comentario? (la sintaxis/la intención comunicativa, el contexto y la adecuación del texto a su situación/la ortografía)"
        correctAnswer: la intención comunicativa, el contexto y la adecuación del texto a su situación
        rationale: "El nivel pragmático estudia la relación del texto con su contexto de producción e interpretación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se usa el subjuntivo en el comentario académico? (siempre/al expresar opinión: 'cabe señalar que el autor use...'/solo en textos literarios)"
        correctAnswer: "al expresar opinión: 'cabe señalar que el autor use...'"
        rationale: "En el comentario académico, las subordinadas de opinión o valoración pueden regir subjuntivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la función poética del lenguaje? (transmitir información/cuidar la forma del mensaje en sí misma/dar órdenes)"
        correctAnswer: cuidar la forma del mensaje en sí misma
        rationale: "La función poética (Jakobson) se centra en el mensaje mismo: cómo se dice, no solo qué se dice."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué debe evitarse en el comentario de texto académico? (citar el texto/parafrasear/transcribir largos fragmentos sin analizarlos)"
        correctAnswer: transcribir largos fragmentos sin analizarlos
        rationale: "El comentario exige análisis e interpretación, no transcripción; la cita debe ser breve y servir al análisis."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El tono irónico de un texto periodístico se detecta por: (el léxico técnico/la contradicción entre el significado literal y el contexto o intención/los verbos en futuro)"
        correctAnswer: la contradicción entre el significado literal y el contexto o intención
        rationale: "La ironía invierte el sentido; se detecta cuando el significado literal contradice el contexto o la intención del emisor."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
