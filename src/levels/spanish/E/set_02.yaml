title: Lectura - Don Quijote de la Mancha
level: E
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Fragmento del Quijote para comprensión literaria avanzada. Análisis de narrador, ironía, intertextualidad y propósito satírico."
example: "Cervantes → narrador irónico/distanciado → Don Quijote: idealismo (libros de caballerías) vs. Sancho: realismo/sentido común → estructura: narradores múltiples (Cide Hamete Benengeli) → metaficción → temas: realidad/ilusión, locura/cordura, señor/sirviente → recursos: parodia/ironía/dialogismo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo de los de lanza en astillero, adarga antigua, rocín flaco y galgo corredor. Una olla de algo más vaca que carnero, salpicón las más noches, duelos y quebrantos los sábados, lantejas los viernes, algún palomino de añadidura los domingos, consumían las tres partes de su hacienda. El resto della concluían sayo de velarte, calzas de velludo para las fiestas, con sus pantuflos de lo mesmo, y los días de entresemana se honraba con su vellorí de lo más fino. Tenía en su casa una ama que pasaba de los cuarenta y una sobrina que no llegaba a los veinte, y un mozo de campo y plaza que así ensillaba el rocín como tomaba la podadera. Frisaba la edad de nuestro hidalgo con los cincuenta años; era de complexión recia, seco de carnes, enjuto de rostro, gran madrugador y amigo de la caza. Quieren decir que tenía el sobrenombre de Quijada, o Quesada, que en esto hay alguna diferencia en los autores que deste caso escriben."
    exercises:
      - type: reading
        question: "¿Por qué el narrador dice 'de cuyo nombre no quiero acordarme'? (porque olvidó el nombre/como recurso irónico que distancia al narrador del relato/porque el lugar no existe)"
        correctAnswer: como recurso irónico que distancia al narrador del relato
        rationale: "Es un guiño irónico de Cervantes: el narrador finge no querer o poder recordar, distanciándose del relato."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué información da la dieta del hidalgo sobre su condición social? (es rico y come bien/es de baja nobleza con recursos escasos/es un campesino pobre)"
        correctAnswer: es de baja nobleza con recursos escasos
        rationale: "La olla pobre, el salpicón y las lentejas muestran que el hidalgo es de nobleza menor con hacienda modesta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué significa 'rocín flaco'? (un perro delgado/un caballo desgarbado y en mal estado/un criado viejo)"
        correctAnswer: un caballo desgarbado y en mal estado
        rationale: "Rocín = caballo de mala raza o en mal estado; su flaqueza subraya la humildad del hidalgo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo describe el narrador la edad del hidalgo? (con exactitud/con imprecisión deliberada: 'frisaba con los cincuenta'/solo dice que era viejo)"
        correctAnswer: con imprecisión deliberada: 'frisaba con los cincuenta'
        rationale: "'Frisaba' (rozaba) los cincuenta indica aproximación — recurso que refuerza la vaguedad narrativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué afición tenía el hidalgo además de las armas? (la lectura/la caza/la música)"
        correctAnswer: la caza
        rationale: "El texto: 'gran madrugador y amigo de la caza'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué recurso usa Cervantes al enumerar la dieta semanal? (anáfora/enumeración detallada con ironía costumbrista/metáfora)"
        correctAnswer: enumeración detallada con ironía costumbrista
        rationale: "La lista de comidas pobres sirve para retratar con ironía la escasa condición del hidalgo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué hay duda sobre el sobrenombre del hidalgo? (por censura/el narrador señala que los autores difieren/el protagonista lo cambió)"
        correctAnswer: el narrador señala que los autores difieren
        rationale: "Cervantes finge apoyarse en 'autores' divergentes, recurso metaficcional que parodia las novelas de caballerías."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué función tiene la descripción minuciosa del vestuario del hidalgo? (presentar su riqueza/mostrar su precaria economía con detalle costumbrista/describir la moda de la época)"
        correctAnswer: mostrar su precaria economía con detalle costumbrista
        rationale: "El contraste entre el traje de fiesta y el de entresemana revela una economía doméstica muy ajustada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tipo de narrador usa Cervantes en este fragmento? (narrador protagonista/narrador omnisciente en tercera persona con ironía/narrador testigo)"
        correctAnswer: narrador omnisciente en tercera persona con ironía
        rationale: "El narrador sabe todo sobre el hidalgo pero adopta una distancia irónica, fingiendo dudar de datos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es el propósito principal del Quijote según la crítica literaria? (narrar aventuras heroicas/parodiar las novelas de caballerías y reflexionar sobre la realidad y la ficción/describir la España medieval)"
        correctAnswer: parodiar las novelas de caballerías y reflexionar sobre la realidad y la ficción
        rationale: "Cervantes parodia los excesos de las novelas caballerescas mientras explora la frontera entre ilusión y realidad."
        difficulty: 5
        objectives: [es.pre_reading]
target: 10
