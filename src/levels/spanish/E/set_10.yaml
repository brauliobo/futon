pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El realismo mágico es una corriente literaria surgida en Latinoamérica durante el siglo XX que integra elementos fantásticos o mágicos en un contexto realista, presentándolos como parte natural de la realidad cotidiana. A diferencia de la literatura fantástica, el narrador y los personajes no expresan asombro ante los hechos sobrenaturales, que son aceptados con total normalidad. El término fue acuñado por el crítico alemán Franz Roh en 1925 para referirse a la pintura posvanguardista, y fue adoptado posteriormente para la literatura hispanoamericana. Su máximo representante es el colombiano Gabriel García Márquez, cuya novela 'Cien años de soledad' (1967) se convirtió en la obra emblemática del movimiento y del llamado Boom latinoamericano, grupo de escritores que renovaron la narrativa en español durante los años sesenta y setenta. Otros autores del Boom son el mexicano Carlos Fuentes, el argentino Julio Cortázar y el peruano Mario Vargas Llosa. El realismo mágico tiene raíces en las tradiciones orales indígenas y africanas de América Latina, así como en el surrealismo europeo. Sus características más importantes son la fusión de lo real y lo fantástico, el tiempo circular o fragmentado, los espacios míticos y la crítica sociopolítica velada."
