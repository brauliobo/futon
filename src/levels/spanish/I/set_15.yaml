    title: El Texto
    description: "Texto: El Siglo de Oro español (aproximadamente 1492-1681) fue el período de mayor esplendor de la literatura española, coincidiendo con el apogeo del Imperio español. Surgieron dos corrientes literarias opuestas: el culteranismo (o gongorismo), asociado a Luis de Góngora, que buscaba la belleza formal mediante el uso de latinismos, hipérbatos extremos y metáforas oscuras; y el conceptismo, representado por Francisco de Quevedo, que priorizaba la agudeza de ingenio, los juegos de palabras y la condensación de ideas complejas en frases breves. Miguel de Cervantes publicó la primera parte del Don Quijote de la Mancha en 1605, considerada la primera novela moderna: satiriza las novelas de caballería mediante la ironía y el humor, pero también reflexiona sobre la naturaleza de la realidad, la locura y el idealismo. El teatro del Siglo de Oro alcanzó su máxima expresión con Lope de Vega, quien formuló el Arte nuevo de hacer comedias (1609): rompió con las unidades aristotélicas, mezcló tragedia y comedia, incorporó el honor como tema central y escribió más de 400 obras. Calderón de la Barca llevó el teatro barroco a su cumbre filosófica con La vida es sueño, que explora el libre albedrío, la apariencia vs. la realidad, y el desengaño barroco. La novela picaresca —iniciada con el Lazarillo de Tormes (anónimo, 1554) y continuada con el Guzmán de Alfarache de Mateo Alemán— retrató la sociedad española desde la perspectiva de un antihéroe de baja extracción que sobrevive por el engaño y la astucia. Santa Teresa de Jesús y San Juan de la Cruz desarrollaron la mística española: la experiencia directa de Dios a través de la contemplación."
