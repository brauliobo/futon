title: 🔬 Gramática - Semiótica y Teoría de la Comunicación
level: I
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Semiótica: Peirce (signo, objeto, interpretante; ícono, índice, símbolo), Saussure (significante/significado, arbitrariedad, linealidad, valor, sistema). Teoría de la comunicación (Shannon-Weaver): canal, código, mensaje, ruido, redundancia. Semiótica de la cultura (Lotman). Sincronía vs. diacronía. Semiótica visual y multimodal. Intertextualidad (Kristeva). Semiosis ilimitada."
example: "ícono → fotografía, onomatopeya: relación de semejanza con el objeto. índice → humo/fuego, síntoma/enfermedad: relación causal o de contigüidad. símbolo → bandera, palabra: relación convencional. Shannon → canal (teléfono), código (español), ruido (estática), redundancia (repetir para asegurar). Lotman → la cultura como texto semiótico. semiosis ilimitada (Peirce) → cada interpretante se convierte en nuevo signo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Semiótica - Signo y Comunicación
    description: Identifica los conceptos semióticos fundamentales.
    exercises:
      - type: grammar
        question: "¿Cuál es la diferencia entre el ícono, el índice y el símbolo en la semiótica de Peirce? (tipos de palabras/ícono: relación de semejanza (foto); índice: relación causal o de contigüidad (humo→fuego); símbolo: relación convencional y arbitraria (palabras)/tipos de idiomas)"
        correctAnswer: "ícono: relación de semejanza (foto); índice: relación causal o de contigüidad (humo→fuego); símbolo: relación convencional y arbitraria (palabras)"
        rationale: "Tricotomía de Peirce: ícono (semejanza), índice (conexión real), símbolo (convención) → el signo lingüístico es primariamente simbólico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el interpretante en la semiótica de Peirce? (el receptor del mensaje/el efecto que el signo produce en la mente del receptor: el concepto o la sensación que el signo evoca, que a su vez puede convertirse en nuevo signo (semiosis ilimitada)/el objeto referido)"
        correctAnswer: "el efecto que el signo produce en la mente del receptor: el concepto o la sensación que el signo evoca, que a su vez puede convertirse en nuevo signo (semiosis ilimitada)"
        rationale: "Interpretante: no es el intérprete (persona), sino el efecto semiótico → cada interpretante genera un nuevo signo: semiosis ilimitada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la sincronía de la diacronía en lingüística (Saussure)? (la fonética vs. la fonología/el dialecto vs. el idioma/sincronía: estudio del sistema lingüístico en un momento dado; diacronía: estudio de la evolución histórica de la lengua)"
        correctAnswer: "sincronía: estudio del sistema lingüístico en un momento dado; diacronía: estudio de la evolución histórica de la lengua"
        rationale: "Saussure: la lingüística sincrónica estudia el estado del sistema (hoy); la diacrónica estudia los cambios a lo largo del tiempo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el ruido en la teoría de la comunicación de Shannon-Weaver? (la retroalimentación del receptor/un error del hablante/cualquier perturbación del canal que distorsiona la señal y dificulta la recepción correcta del mensaje)"
        correctAnswer: cualquier perturbación del canal que distorsiona la señal y dificulta la recepción correcta del mensaje
        rationale: "Ruido (noise): interferencia física, semántica o psicológica que reduce la fidelidad de la comunicación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la redundancia en la teoría de la comunicación? (el ruido del canal/repetición innecesaria/información adicional predecible que reduce la incertidumbre y compensa el ruido: la concordancia gramatical es redundante pero reduce la ambigüedad)"
        correctAnswer: "información adicional predecible que reduce la incertidumbre y compensa el ruido: la concordancia gramatical es redundante pero reduce la ambigüedad"
        rationale: "Redundancia: 'los niños juegan' → la pluralidad se marca dos veces (det + verbo) → redundancia que facilita la comprensión en condiciones de ruido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el valor del signo lingüístico para Saussure? (la frecuencia de uso/el significado del diccionario/la propiedad que cada signo tiene de ser diferente de todos los demás signos del sistema: el valor de 'rojo' depende de cómo el sistema divide el espectro cromático)"
        correctAnswer: "la propiedad que cada signo tiene de ser diferente de todos los demás signos del sistema: el valor de 'rojo' depende de cómo el sistema divide el espectro cromático"
        rationale: "Valor (Saussure): los signos son definidos negativamente → 'mouton' francés ≠ 'sheep/mutton' inglés (una palabra vs. dos) → sistema diferente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué propone Lotman con el concepto de 'semiosfera'? (que la semiótica se aplica solo al lenguaje/que existe un espacio semiótico global (la cultura) en que todos los textos y sistemas de signos están interconectados y se generan mutuamente/que el signo es universal)"
        correctAnswer: que existe un espacio semiótico global (la cultura) en que todos los textos y sistemas de signos están interconectados y se generan mutuamente
        rationale: "Lotman: la semiosfera → la cultura es un gran texto, un espacio semiótico donde todos los sistemas (arte, mito, ciencia) se comunican."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la intertextualidad según Kristeva? (la coherencia interna de un texto/la propiedad de todo texto de ser un mosaico de citas y absorciones de otros textos previos: todo texto existe en relación con los textos que lo preceden/la claridad del texto)"
        correctAnswer: "la propiedad de todo texto de ser un mosaico de citas y absorciones de otros textos previos: todo texto existe en relación con los textos que lo preceden"
        rationale: "Kristeva (1969), desarrollando a Bajtín: todo texto es un intertexto → absorbe, transforma y responde a textos anteriores."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre el código y el canal en la comunicación? (son sinónimos/canal: medio físico de transmisión (ondas sonoras, cable, papel); código: sistema de signos compartido (el español, el morse, el código Braille)/el canal es el mensaje)"
        correctAnswer: "canal: medio físico de transmisión (ondas sonoras, cable, papel); código: sistema de signos compartido (el español, el morse, el código Braille)"
        rationale: "Shannon: canal = medio; código = sistema de representación. Un mensaje puede enviarse por distintos canales con el mismo código."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la semiótica multimodal? (solo la semiótica visual/el estudio de los sistemas de signos que combinan múltiples modos semióticos: lenguaje verbal, imagen, gesto, sonido, diseño → los textos modernos son siempre multimodales/la semiótica de las banderas)"
        correctAnswer: "el estudio de los sistemas de signos que combinan múltiples modos semióticos: lenguaje verbal, imagen, gesto, sonido, diseño → los textos modernos son siempre multimodales"
        rationale: "Semiótica multimodal (Kress y van Leeuwen): páginas web, publicidades, películas → ningún texto es monomodal en la comunicación contemporánea."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Aplicación Semiótica
    description: Aplica los conceptos semióticos al análisis de textos y fenómenos culturales.
    exercises:
      - type: grammar
        question: "¿Qué tipo de signo peirceano es un termómetro que muestra fiebre? (ícono/índice: el termómetro tiene una relación causal con la temperatura corporal → indica la fiebre, no la representa/símbolo)"
        correctAnswer: "índice: el termómetro tiene una relación causal con la temperatura corporal → indica la fiebre, no la representa"
        rationale: "Índice: humo-fuego, síntoma-enfermedad, termómetro-temperatura → conexión física o causal entre signo y objeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia al signo lingüístico del ícono para Saussure? (la longitud/el signo lingüístico es arbitrario (la relación significante-significado es convencional); el ícono tiene una relación de semejanza motivada con su objeto/el signo lingüístico es siempre un índice)"
        correctAnswer: el signo lingüístico es arbitrario (la relación significante-significado es convencional); el ícono tiene una relación de semejanza motivada con su objeto
        rationale: "Saussure: arbitrariedad del signo → no hay razón natural para que /perro/ designe al animal. El ícono (foto) sí tiene semejanza motivada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo analiza la semiótica una bandera nacional? (como índice/como símbolo: la relación entre la bandera y la nación es convencional, establecida por acuerdo social e histórico, no por semejanza ni causalidad/como ícono de la geografía del país)"
        correctAnswer: "como símbolo: la relación entre la bandera y la nación es convencional, establecida por acuerdo social e histórico, no por semejanza ni causalidad"
        rationale: "Bandera = símbolo (Peirce): la convención colectiva la hace funcionar como signo → sin conocimiento de la convención, es solo un trapo de colores."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la onomatopeya ('miau', 'crash') es un caso especial en el sistema de la arbitrariedad lingüística? (porque no es un signo/porque es parcialmente icónica: imita el sonido del referente, cuestionando la arbitrariedad absoluta de Saussure (aunque varía entre lenguas)/porque no existe en todas las lenguas)"
        correctAnswer: "porque es parcialmente icónica: imita el sonido del referente, cuestionando la arbitrariedad absoluta de Saussure (aunque varía entre lenguas)"
        rationale: "Onomatopeya: 'gato → miau (ES), meow (EN), miau (DE), nyan (JA)' → la variación entre lenguas muestra que incluso lo icónico está convencionalmente mediado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el aporte del concepto de 'retroalimentación' (feedback) en la teoría de la comunicación? (aumenta el ruido/permite al emisor saber si el mensaje fue recibido e interpretado correctamente y ajustar la comunicación → la comunicación es circular, no lineal/es equivalente al canal)"
        correctAnswer: permite al emisor saber si el mensaje fue recibido e interpretado correctamente y ajustar la comunicación → la comunicación es circular, no lineal
        rationale: "Retroalimentación: Shannon tenía un modelo lineal; la cibernética (Wiener) añadió el feedback → la comunicación efectiva es circular."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el código elaborado vs. código restringido (Bernstein)? (dos tipos de alfabeto/en sociolingüística: código elaborado = explícito, independiente del contexto (clases medias-altas); código restringido = implícito, dependiente del contexto compartido (clases trabajadoras)/dos tipos de canal)"
        correctAnswer: "en sociolingüística: código elaborado = explícito, independiente del contexto (clases medias-altas); código restringido = implícito, dependiente del contexto compartido (clases trabajadoras)"
        rationale: "Bernstein (1960s): los códigos sociolingüísticos condicionan el acceso a la educación formal → polémica sobre determinismo lingüístico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la denotación y la connotación en semiótica barthesiana? (sinónimos/denotación: nivel literal del signo; connotación: nivel ideológico y cultural que Barthes llama 'mito': la foto de un soldado colonial saludando la bandera francesa connota 'el Imperio es glorioso'/tipos de símbolo)"
        correctAnswer: "denotación: nivel literal del signo; connotación: nivel ideológico y cultural que Barthes llama 'mito': la foto de un soldado colonial saludando la bandera francesa connota 'el Imperio es glorioso'"
        rationale: "Barthes: 'Mitologías' → el mito es una metalengua que naturaliza ideologías como hechos evidentes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre la semiótica de Saussure y la de Peirce? (son idénticas/Saussure: díada significante/significado, lingüística centrada; Peirce: tríada signo-objeto-interpretante, semiótica universal que incluye todos los sistemas de signos/Peirce es más restrictivo)"
        correctAnswer: "Saussure: díada significante/significado, lingüística centrada; Peirce: tríada signo-objeto-interpretante, semiótica universal que incluye todos los sistemas de signos"
        rationale: "Saussure: lingüística = modelo. Peirce: la semiótica es la ciencia de todos los signos → el lenguaje es un caso especial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la entropía en la teoría de la información de Shannon? (el ruido/la medida de la incertidumbre o impredecibilidad de un mensaje: alta entropía = mensaje muy impredecible = mucha información; baja entropía = muy predecible = poca información nueva/la frecuencia del mensaje)"
        correctAnswer: "la medida de la incertidumbre o impredecibilidad de un mensaje: alta entropía = mensaje muy impredecible = mucha información; baja entropía = muy predecible = poca información nueva"
        rationale: "Entropía: 'La reunión es a las 9' (baja entropía: predecible). Un mensaje aleatorio tiene alta entropía (es impredecible) → contiene más información."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué implica el carácter lineal del significante según Saussure? (que el signo ocupa espacio/que los signos lingüísticos se despliegan en el tiempo de forma secuencial y no pueden superponerse: no podemos decir dos palabras al mismo tiempo/que las lenguas son siempre escritas)"
        correctAnswer: "que los signos lingüísticos se despliegan en el tiempo de forma secuencial y no pueden superponerse: no podemos decir dos palabras al mismo tiempo"
        rationale: "Linearidad del significante: los fonemas y morfemas se suceden en el tiempo → la cadena hablada es unidimensional y temporal."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
