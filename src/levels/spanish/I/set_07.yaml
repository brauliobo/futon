authorNotes: "Texto expositivo sobre filosofía de la mente: el problema mente-cuerpo, el dualismo cartesiano, el fisicalismo, el funcionalismo, el problema difícil de la conciencia, el qualia, el argumento del cuarto chino de Searle, y las teorías de la identidad."
example: "dualismo Descartes (mente/cuerpo) → problema interacción causal → fisicalismo: identidad de tipos (cerebro = mente) → funcionalismo Putnam: múltiple realización → eliminativismo Churchland → cuarto chino Searle → problema difícil Chalmers: qualia inexplicables por neurociencia → panpsiquismo como alternativa."
