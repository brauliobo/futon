        correctAnswer: "la mente como sustancia pensante y el cuerpo como sustancia extensa: dos sustancias radicalmente distintas"
        rationale: "El texto: 'la mente es una sustancia pensante (res cogitans) y el cuerpo, una sustancia extensa (res extensa)'."
        difficulty: 5
