pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La filosofía de la mente aborda la naturaleza de los estados mentales, la conciencia y la relación entre mente y cuerpo. El dualismo cartesiano (Descartes, siglo XVII) postula que la mente y el cuerpo son sustancias radicalmente distintas: la mente es una sustancia pensante (res cogitans) y el cuerpo, una sustancia extensa (res extensa). El problema mente-cuerpo pregunta cómo interactúan estas dos sustancias. El fisicalismo o materialismo sostiene que los estados mentales son estados físicos del cerebro: la teoría de la identidad (Place, Smart) identifica cada estado mental con un estado cerebral específico. El funcionalismo (Putnam) argumenta que los estados mentales se definen por su función causal, no por su sustrato físico: lo mismo que corre un software puede ejecutarse en distintos hardware. El 'problema difícil de la conciencia' (Chalmers) distingue entre los problemas 'fáciles' (explicar los mecanismos cognitivos) y el problema difícil: por qué hay experiencia subjetiva, qualia, 'algo que es ser' algo (Nagel: '¿qué es ser un murciélago?'). El argumento del cuarto chino de Searle critica la IA fuerte: una persona que sigue reglas para manipular símbolos chinos sin entenderlos produce respuestas correctas pero sin comprensión genuina → la sintaxis no es suficiente para la semántica. El epifenomenalismo sostiene que los estados mentales son subproductos causalmente ineficaces de procesos cerebrales. El emergentismo propone que la conciencia emerge de la complejidad del sistema nervioso sin ser reducible a él."
