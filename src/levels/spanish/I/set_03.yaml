title: Gramática - Análisis Sintáctico Formal - Teoría X-barra
level: I
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Teoría X-barra: estructura sintagmática universal (X'' → Spec X'; X' → X Comp). Categorías: N, V, A, P, I/T, C. Sintagmas: SN, SV, SA, SP, SI/ST, SC. Especificador, núcleo, complemento. Complementizadores. ST (sintagma temporal) y SC (sintagma complementizador). Posición del sujeto: Spec de ST. Movimiento del verbo. Adjunción. Proyección máxima y mínima. Relación de c-mando. Ligamiento (binding theory): principios A, B, C."
example: "X-barra → toda proyección: X'' (SX) → Spec + X'; X' → X + complemento. SN 'los libros de historia' → Det + N' → N + SP. ST → Spec(sujeto) + T' → T + SV. movimiento V→T → el verbo español sube a T para recibir rasgos de tiempo y concordancia. c-mando → X c-manda a Y si el primer nodo que domina a X también domina a Y. principio A → los anafóricos (se, sí mismo) deben estar ligados localmente. principio B → los pronombres no pueden estar ligados localmente."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Teoría X-barra y Estructura Sintagmática
    description: Identifica los componentes de la teoría X-barra y la estructura sintagmática.
    exercises:
      - type: grammar
        question: "¿Cuál es la estructura básica de cualquier proyección en la teoría X-barra? (X + Y + Z/X'' (proyección máxima) → Especificador + X'; X' (proyección intermedia) → X (núcleo) + Complemento/Especificador + Núcleo + Complemento en orden fijo)"
        correctAnswer: X'' (proyección máxima) → Especificador + X'; X' (proyección intermedia) → X (núcleo) + Complemento
        rationale: "X-barra: estructura binaria universal → el especificador es hermano de X'; el complemento es hermano de X (núcleo)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función del especificador en la teoría X-barra? (el núcleo léxico/posición estructural más externa del sintagma, hermano de la proyección intermedia X': en el SN es el determinante; en el ST es el sujeto/el complemento del núcleo)"
        correctAnswer: "posición estructural más externa del sintagma, hermano de la proyección intermedia X': en el SN es el determinante; en el ST es el sujeto"
        rationale: "Especificador: posición que se define estructuralmente, no categorialmente → Det en SN, sujeto en ST, QP en SC interrogativo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué categoría funcional encabeza el sintagma temporal (ST) en la gramática generativa? (N (nombre)/T (Tiempo/Inflexión): T aloja los rasgos de tiempo y concordancia y tiene como especificador el sujeto de la oración/V (verbo))"
        correctAnswer: "T (Tiempo/Inflexión): T aloja los rasgos de tiempo y concordancia y tiene como especificador el sujeto de la oración"
        rationale: "ST (TP): la oración principal proyecta un ST → el sujeto ocupa Spec-ST y el verbo sube a T para obtener rasgos de tiempo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el verbo español se mueve a la posición T (Tiempo) en la estructura sintáctica? (por razones semánticas/para verificar sus rasgos de tiempo y concordancia: el español es una lengua con movimiento V→T visible por la posición del verbo ante los adverbios/es fijo en V)"
        correctAnswer: "para verificar sus rasgos de tiempo y concordancia: el español es una lengua con movimiento V→T visible por la posición del verbo ante los adverbios"
        rationale: "Movimiento V→T: 'Juan come siempre rápido' (verbo antes del adverbio) vs. inglés 'John always eats quickly' → evidencia del movimiento del V al T."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el c-mando en la sintaxis formal? (la concordancia/relación estructural: X c-manda a Y si el primer nodo ramificante que domina a X también domina a Y; fundamental para el ligamiento y el alcance/el movimiento del verbo)"
        correctAnswer: "relación estructural: X c-manda a Y si el primer nodo ramificante que domina a X también domina a Y; fundamental para el ligamiento y el alcance"
        rationale: "C-mando: definición de Reinhart → determina las relaciones de ligamiento, el alcance cuantificacional y la referencia pronominal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el Principio A de la teoría del ligamiento? (los pronombres no deben estar ligados localmente/los anafóricos (reflexivos: 'se', 'sí mismo', 'nos') deben estar ligados dentro de su dominio local: 'Juan se ve' (correcto)/los nombres referenciales nunca son ligados)"
        correctAnswer: "los anafóricos (reflexivos: 'se', 'sí mismo', 'nos') deben estar ligados dentro de su dominio local: 'Juan se ve' (correcto)"
        rationale: "Principio A: anáfora debe estar ligada localmente → 'Juan₁ se₁ ve' (OK: 'se' ligado por 'Juan' en la misma oración)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el Principio B de la teoría del ligamiento? (los anafóricos deben estar ligados/los pronombres (él, ella, le, lo) NO deben estar ligados localmente: 'Juan₁ lo₁ ve' es agramatical; 'lo' debe referir a alguien fuera de la oración/los nombres son siempre libres)"
        correctAnswer: "los pronombres (él, ella, le, lo) NO deben estar ligados localmente: 'Juan₁ lo₁ ve' es agramatical; 'lo' debe referir a alguien fuera de la oración"
        rationale: "Principio B: el pronombre debe ser libre (no ligado) en su dominio local → 'Juan₁ lo₂ ve' (OK: 'lo' refiere a otra persona)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la proyección máxima en X-barra? (el núcleo léxico/la proyección completa del sintagma (X'') que no puede proyectarse más; equivale a SN, SV, SP, SA.../la proyección mínima o núcleo)"
        correctAnswer: la proyección completa del sintagma (X'') que no puede proyectarse más; equivale a SN, SV, SP, SA...
        rationale: "Proyección máxima: SN, SV, SP, ST, SC → techo de la proyección. X⁰ = núcleo mínimo, X' = intermedia, X'' = máxima."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función del complementizador (C) en la teoría X-barra? (un determinante especial/categoría funcional que encabeza el SC (sintagma complementizador) y aloja elementos como 'que', 'si', 'porque' en las oraciones subordinadas/un tipo de verbo auxiliar)"
        correctAnswer: categoría funcional que encabeza el SC (sintagma complementizador) y aloja elementos como 'que', 'si', 'porque' en las oraciones subordinadas
        rationale: "SC: 'Creo [que Juan viene]' → el SC tiene 'que' como núcleo C y el ST subordinado como complemento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la adjunción en la teoría sintáctica? (la posición del complemento/la operación que añade un adjunto (modificador) al margen de una proyección X' o X'' sin ser complemento ni especificador: los adverbios y los SPs adjuntos/el movimiento del sujeto)"
        correctAnswer: "la operación que añade un adjunto (modificador) al margen de una proyección X' o X'' sin ser complemento ni especificador: los adverbios y los SPs adjuntos"
        rationale: "Adjunción: 'Juan come [RP en el parque] [RP por las tardes]' → los adjuntos se añaden sin ser argumentos del verbo."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Aplicación del Análisis Formal
    description: Aplica los conceptos de la sintaxis formal al análisis de oraciones.
    exercises:
      - type: grammar
        question: "¿Qué posición ocupa el sujeto en la estructura X-barra de la oración simple? (Spec-SV/Spec-ST: el sujeto es el especificador del Sintagma Temporal (ST), el nodo que domina la oración/Comp-ST)"
        correctAnswer: "Spec-ST: el sujeto es el especificador del Sintagma Temporal (ST), el nodo que domina la oración"
        rationale: "Spec-ST: la posición del sujeto → [ST Juan [T' come [SV ___]]]. El verbo ha subido de V a T."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'Juan₁ se₁ quiere a sí mismo₁' no viola el Principio A? (porque es poético/porque 'sí mismo' es un anafórico que está ligado localmente por 'Juan' dentro del mismo dominio oracional/porque 'sí mismo' es un pronombre)"
        correctAnswer: porque 'sí mismo' es un anafórico que está ligado localmente por 'Juan' dentro del mismo dominio oracional
        rationale: "Principio A cumplido: 'sí mismo' (anafórico) ligado por 'Juan' (c-manda a 'sí mismo' en la misma oración)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se analiza 'el libro de historia' en X-barra? (Det + N + Adj/SN: [SN el [N' libro [SP de historia]]] → 'el' = Spec-SN, 'libro' = N⁰ (núcleo), 'de historia' = complemento del N en la posición de N'/un SP libre)"
        correctAnswer: "SN: [SN el [N' libro [SP de historia]]] → 'el' = Spec-SN, 'libro' = N⁰ (núcleo), 'de historia' = complemento del N en la posición de N'"
        rationale: "X-barra del SN: Det = Spec; N⁰ = núcleo; SP complemento = hermano de N en la posición de N' → estructura binaria estricta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la posición de las interrogativas Q (quién, qué) en la estructura del SC? (Spec-SN/Spec-SC: el sintagma Q se mueve a la posición de Especificador del SC para verificar los rasgos Q del complementizador/núcleo del ST)"
        correctAnswer: "Spec-SC: el sintagma Q se mueve a la posición de Especificador del SC para verificar los rasgos Q del complementizador"
        rationale: "Movimiento Q (Wh-movement): '¿[SC Qué [C' C [ST Juan compró ___]]]?' → 'qué' se mueve de la posición del objeto a Spec-SC."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué predice el Principio C de la teoría del ligamiento? (que los pronombres son libres/que los nombres referenciales (R-expresiones) nunca pueden estar ligados: 'Él₁ cree que Juan₁ es inteligente' es agramatical (el pronombre liga al nombre)/que los anafóricos se ligan localmente)"
        correctAnswer: "que los nombres referenciales (R-expresiones) nunca pueden estar ligados: 'Él₁ cree que Juan₁ es inteligente' es agramatical (el pronombre liga al nombre)"
        rationale: "Principio C: las R-expresiones (nombres propios, descripciones definidas) deben estar libres en todo dominio → el pronombre no puede coindizar al nombre propio que c-manda."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el programa minimalista de Chomsky simplifica la X-barra? (la elimina completamente/reduce las proyecciones a una operación básica: Merge (ensamble) que combina dos elementos sin la estructura de tres niveles; las etiquetas emergen de los rasgos léxicos/no hay simplificación)"
        correctAnswer: "reduce las proyecciones a una operación básica: Merge (ensamble) que combina dos elementos sin la estructura de tres niveles; las etiquetas emergen de los rasgos léxicos"
        rationale: "Minimalismo: Merge reemplaza las reglas X-barra → la estructura surge de las propiedades léxicas de los elementos combinados."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre el complemento y el adjunto en X-barra? (son lo mismo/el complemento es un argumento seleccionado por el núcleo (subcategorización); el adjunto es optativo y no seleccionado: modifica sin ser parte del esquema argumental/el adjunto va siempre antes)"
        correctAnswer: "el complemento es un argumento seleccionado por el núcleo (subcategorización); el adjunto es optativo y no seleccionado: modifica sin ser parte del esquema argumental"
        rationale: "Complemento: 'poner [en la mesa]' (PP obligatorio). Adjunto: 'poner [en la mesa] [con cuidado]' → 'con cuidado' es adjunto opcional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la c-mando asimétrico y cómo se relaciona con las relaciones de alcance cuantificacional? (un tipo de adjunción/el alcance de los cuantificadores sigue el c-mando: el cuantificador que c-manda al otro tiene alcance amplio: 'Alguien ama a todos' → 'alguien' > 'todos'/no hay relación)"
        correctAnswer: "el alcance de los cuantificadores sigue el c-mando: el cuantificador que c-manda al otro tiene alcance amplio: 'Alguien ama a todos' → 'alguien' > 'todos'"
        rationale: "Alcance cuantificacional: la interpretación preferida sigue el orden lineal/estructural → el cuantificador más alto c-manda al otro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los rasgos ininterpretables en el programa minimalista? (rasgos semánticos/rasgos formales (caso, concordancia) que deben ser verificados y eliminados antes de la interfaz fonológica (PF) para evitar la mala formación/rasgos de la memoria de trabajo)"
        correctAnswer: rasgos formales (caso, concordancia) que deben ser verificados y eliminados antes de la interfaz fonológica (PF) para evitar la mala formación
        rationale: "Minimalismo: rasgos ininterpretables (como el caso nominativo del sujeto) deben verificarse para que la derivación converja."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la aportación del concepto de 'estructura profunda' vs. 'estructura de superficie' a la lingüística cognitiva? (que el lenguaje es completamente arbitrario/que el significado se representa en la estructura profunda mientras la estructura de superficie puede divergir: activa y pasiva = misma EP/que no hay diferencia entre semántica y sintaxis)"
        correctAnswer: "que el significado se representa en la estructura profunda mientras la estructura de superficie puede divergir: activa y pasiva = misma EP"
        rationale: "Chomsky (1965): la EP (estructura profunda) → interfaz semántica; la ES (estructura de superficie) → interfaz fonológica. Las transformaciones los conectan."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
