authorNotes: "Texto expositivo sobre bioética: origen del término, los principios de Beauchamp y Childress, los debates sobre el inicio y fin de la vida, la edición genómica (CRISPR), la inteligencia artificial médica, el consentimiento informado y los comités de ética."
example: "Beauchamp/Childress: autonomía/beneficencia/no maleficencia/justicia → dilemas: CRISPR (edición germinal) → IA diagnóstica (sesgo/responsabilidad) → eutanasia activa vs. pasiva → consentimiento informado digital → comités de bioética → regulación: Informe Belmont/Código de Núremberg como modelos."
