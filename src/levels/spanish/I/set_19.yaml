        correctAnswer: Van Rensselaer Potter en 1970: una 'ciencia de la supervivencia' que integrara la biología y los valores humanos
        rationale: "El texto: 'el bioeticista Van Rensselaer Potter acuñó el término en 1970 para referirse a una ciencia de la supervivencia'."
