pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La bioética emergió en los años 1970 como disciplina que examina los dilemas morales suscitados por los avances biomédicos. El bioeticista Van Rensselaer Potter acuñó el término en 1970 para referirse a una 'ciencia de la supervivencia' que integrara la biología y los valores humanos. Los principios de Beauchamp y Childress —autonomía, beneficencia, no maleficencia y justicia— se convirtieron en el marco estándar de la ética médica. El principio de autonomía establece el derecho del paciente a tomar decisiones informadas sobre su propio cuerpo: el consentimiento informado es su expresión legal y ética. El debate sobre el inicio de la vida humana abarca posiciones que van del momento de la fecundación (posición religiosa y algunos filósofos) al desarrollo de la corteza cerebral capaz de sentir dolor o el nacimiento. El debate sobre el final de la vida incluye la eutanasia (activa o pasiva), el suicidio asistido y los cuidados paliativos. La edición genómica mediante CRISPR-Cas9 plantea dilemas sin precedente: mientras la terapia génica somática (solo afecta al individuo) genera menos controversia, la edición germinal (modifica el genoma heredable) fue prohibida internacionalmente tras el caso del científico chino He Jiankui (2018). La inteligencia artificial en medicina plantea cuestiones de responsabilidad (¿quién responde por un diagnóstico erróneo de la IA?), sesgo algorítmico (los sistemas entrenados en datos mayoritariamente blancos diagnostican peor enfermedades en otras etnias) y privacidad de los datos de salud. Los comités de ética asistencial y de investigación son los órganos de deliberación institucional."
