pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La sociología estudia las estructuras, procesos e instituciones que organizan la vida social. La estratificación social —la distribución desigual de recursos, poder y prestigio— es universal aunque varía en sus formas: castas (heredadas y rígidas), estamentos (sociedades feudales) y clases (capitalistas, basadas en la posición económica). Karl Marx definió las clases por la relación con los medios de producción: burguesía (propietaria) vs. proletariado (vendedora de su fuerza de trabajo). Max Weber amplió el análisis añadiendo el estatus (prestigio social) y el partido (poder político) como dimensiones independientes de la clase económica. Pierre Bourdieu introdujo los conceptos de capital económico, social (redes de relaciones), cultural (conocimiento, títulos) y simbólico (reconocimiento legítimo): la reproducción de las desigualdades opera a través de estos capitales y del habitus (disposiciones incorporadas). El funcionalismo (Durkheim, Parsons) ve las instituciones como mecanismos de integración social: la familia, la escuela, el Estado cumplen funciones necesarias para la cohesión. La teoría del conflicto (Marx, Collins) enfatiza que las instituciones perpetúan las desigualdades de clase, género o raza. El interaccionismo simbólico (Mead, Goffman) se centra en los significados que los actores construyen en la interacción cotidiana: la presentación del yo, el estigma, los roles. La globalización ha intensificado la desigualdad entre países y dentro de ellos, generando debates sobre la ciudadanía global y la justicia distributiva."
