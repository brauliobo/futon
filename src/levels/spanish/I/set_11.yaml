        correctAnswer: "por la relación con los medios de producción: burguesía propietaria vs. proletariado que vende su fuerza de trabajo"
        rationale: "El texto: 'Marx definió las clases por la relación con los medios de producción: burguesía (propietaria) vs. proletariado'."
        difficulty: 5
