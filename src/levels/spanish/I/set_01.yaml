title: 📚 Gramática - Lingüística Tipológica y Universales del Lenguaje
level: I
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Lingüística tipológica: clasificación morfológica (aislante, aglutinante, flexiva/fusionante, incorporante/polisinética). Clasificación por orden de constituyentes (Greenberg): SOV, SVO, VSO, etc. Universales lingüísticos: absolutos e implicacionales. Parámetros tipológicos: pro-drop, orden de palabras, marcado de caso, ergatividad/acusatividad, volción/aspecto, sistemas tonal vs. entonativo. Relativización. Marcado en la cúspide vs. en el dependiente."
example: "aislante → chino mandarín: morfemas invariables, sin flexión. aglutinante → turco, swahili: morfemas distintos por función, límites claros. fusionante → latín, ruso: morfemas que codifican varias funciones a la vez (caso+número+género). polisinético → náhuatl: la oración entera codificada en el verbo. SOV → japonés, turco. SVO → español, inglés, francés. VSO → árabe clásico, galés. ergativo → vasco: el sujeto de intransitivo = el objeto de transitivo en el mismo caso (absolutivo)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Tipología Morfológica y Sintáctica
    description: Identifica los tipos morfológicos y los parámetros tipológicos.
    exercises:
      - type: grammar
        question: "¿Cuál es la característica de una lengua aglutinante? (morfemas que codifican varias funciones a la vez/cada función gramatical está codificada por un morfema separado con límites claros: turco, swahili/ausencia de morfología flexiva)"
        correctAnswer: cada función gramatical está codificada por un morfema separado con límites claros: turco, swahili
        rationale: "Aglutinante: un morfema = una función. Turco 'evlerimden' = ev-ler-im-den = casa-PL-1SG-ABL → cuatro morfemas distintos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué caracteriza a una lengua flexiva o fusionante? (morfemas separados e invariables/morfemas que codifican simultáneamente varias categorías (caso+número+género): el latín 'rosae' = caso genitivo + número singular + género femenino en un solo morfema/sin morfología)"
        correctAnswer: morfemas que codifican simultáneamente varias categorías (caso+número+género): el latín 'rosae' = caso genitivo + número singular + género femenino en un solo morfema
        rationale: "Fusionante: un morfema = varias funciones → difícil segmentar. El español es parcialmente fusionante (desinencias verbales)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el tipo morfológico de una lengua como el chino mandarín? (aglutinante/aislante: las palabras no tienen morfología flexiva; la gramática se expresa por el orden y partículas/flexivo)"
        correctAnswer: aislante: las palabras no tienen morfología flexiva; la gramática se expresa por el orden y partículas
        rationale: "Aislante (analítica): chino, vietnamita → cada morfema es una sílaba/palabra independiente, sin flexión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el orden de constituyentes más común entre las lenguas del mundo? (SVO/SOV: más de la mitad de las lenguas son SOV (japonés, turco, hindi)/VSO)"
        correctAnswer: SOV: más de la mitad de las lenguas son SOV (japonés, turco, hindi)
        rationale: "Tipología de Greenberg: SOV es el tipo más frecuente (≈45% lenguas), seguido de SVO (≈42%), luego VSO y otros minoritarios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la ergatividad? (una lengua con muchas vocales/sistema de marcado de caso en que el sujeto de intransitivo y el objeto de transitivo reciben el mismo caso (absolutivo), distinto del sujeto de transitivo (ergativo)/un tipo de aspecto verbal)"
        correctAnswer: sistema de marcado de caso en que el sujeto de intransitivo y el objeto de transitivo reciben el mismo caso (absolutivo), distinto del sujeto de transitivo (ergativo)
        rationale: "Ergativo-absolutivo: vasco, tibetano → el paciente del transitivo se marca igual que el argumento único del intransitivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los universales lingüísticos implicacionales (Greenberg)? (rasgos presentes en todas las lenguas sin excepción/correlaciones del tipo 'si una lengua tiene X entonces también tiene Y': si una lengua tiene orden VSO, probablemente es prepositiva/los morfemas gramaticales universales)"
        correctAnswer: correlaciones del tipo 'si una lengua tiene X entonces también tiene Y': si una lengua tiene orden VSO, probablemente es prepositiva
        rationale: "Universales implicacionales: no son absolutos sino estadísticos → revelan correlaciones entre rasgos tipológicos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una lengua polisintética o incorporante? (una lengua con muchos sinónimos/lengua en que el verbo incorpora el objeto y otros argumentos formando una sola palabra que equivale a una oración completa: náhuatl, lenguas inuit/una lengua aislante)"
        correctAnswer: lengua en que el verbo incorpora el objeto y otros argumentos formando una sola palabra que equivale a una oración completa: náhuatl, lenguas inuit
        rationale: "Polisintética: náhuatl 'nimitztlazohtla' = ni-mitz-tlazohtla = yo-te-amo → toda la oración en una palabra."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la correlación tipológica entre el orden SOV y el uso de posposiciones? (no hay correlación/las lenguas SOV tienden a usar posposiciones (no preposiciones), ya que el núcleo va al final: japonés, turco/las lenguas SOV siempre tienen caso)"
        correctAnswer: las lenguas SOV tienden a usar posposiciones (no preposiciones), ya que el núcleo va al final: japonés, turco
        rationale: "Universal implicacional: SOV + núcleo final → posposiciones ('toki ni' = en el tiempo, lit. 'tiempo en'). SVO + núcleo inicial → preposiciones."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se clasifica el español según el parámetro de marcado de caso? (tiene caso completo/es parcialmente acusativo: marca el objeto directo humano/animado con 'a' (diferencial object marking), pero sin morfología de caso en los sustantivos/es ergativo)"
        correctAnswer: es parcialmente acusativo: marca el objeto directo humano/animado con 'a' (diferencial object marking), pero sin morfología de caso en los sustantivos
        rationale: "Español: no tiene declinación nominal (a diferencia del latín) pero tiene marcado diferencial de objeto (MDO): 'veo a Juan' vs. 'veo una casa'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las lenguas tonales en tipología? (lenguas con muchas consonantes/lenguas en que el tono léxico (alto, bajo, ascendente) distingue palabras: chino mandarín 'ma' tiene 4 significados según el tono/lenguas con acento libre)"
        correctAnswer: lenguas en que el tono léxico (alto, bajo, ascendente) distingue palabras: chino mandarín 'ma' tiene 4 significados según el tono
        rationale: "Lengua tonal: el tono es fonémico → chino 'mā' (madre), 'má' (cáñamo), 'mǎ' (caballo), 'mà' (regañar) = 4 tonemas diferentes."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Universales y Tipología Comparada
    description: Aplica la tipología lingüística al análisis de lenguas y universales.
    exercises:
      - type: grammar
        question: "¿Qué es el marcado en el núcleo vs. marcado en el dependiente? (tipos de morfología verbal/en el marcado en el núcleo, la relación gramatical se marca en el núcleo del sintagma; en el marcado en el dependiente, en el elemento que depende/tipos de entonación)"
        correctAnswer: en el marcado en el núcleo, la relación gramatical se marca en el núcleo del sintagma; en el marcado en el dependiente, en el elemento que depende
        rationale: "Marcado en el núcleo: español 'como' marca la persona/número del sujeto en el verbo. Marcado en el dependiente: el adjetivo marca el género del sustantivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el rasgo universal que comparten todas las lenguas humanas conocidas? (ser tonales/todas tienen vocales y consonantes + distinción entre elementos nominales y predicativos + recursividad/tener al menos 5 casos gramaticales)"
        correctAnswer: todas tienen vocales y consonantes + distinción entre elementos nominales y predicativos + recursividad
        rationale: "Universales absolutos: todas las lenguas tienen vocales, tienen alguna distinción sustantivo/verbo, y tienen recursividad (Chomsky)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el marcado diferencial de objeto (MDO) en español? (la voz pasiva/la preposición 'a' que aparece ante el objeto directo cuando es humano o animado específico: 'veo a Juan' pero 'veo una película'/la concordancia de género)"
        correctAnswer: la preposición 'a' que aparece ante el objeto directo cuando es humano o animado específico: 'veo a Juan' pero 'veo una película'
        rationale: "MDO: el español marca el objeto humano/animado con 'a' para distinguirlo del sujeto (en lengua SVO sin morfología de caso)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué predice la jerarquía de animacidad para el MDO? (que los objetos de todos los seres vivos se marcan igual/que cuanto más alto en la jerarquía (humano > animado > inanimado), más probable es que el objeto reciba marcado especial/que los objetos inanimados siempre se marcan)"
        correctAnswer: que cuanto más alto en la jerarquía (humano > animado > inanimado), más probable es que el objeto reciba marcado especial
        rationale: "Jerarquía de animacidad: 1.ª persona > 2.ª > 3.ª > nombre propio > humano > animado > inanimado → el MDO aparece primero con humanos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se clasifica el vasco (euskera) tipológicamente en relación a sus vecinos románicos? (es una lengua románica/es una lengua aislada genéticamente (sin parentesco demostrado) y tipológicamente ergativa-absolutiva, frente al acusativo del español/es una lengua indoeuropea)"
        correctAnswer: es una lengua aislada genéticamente (sin parentesco demostrado) y tipológicamente ergativa-absolutiva, frente al acusativo del español
        rationale: "El vasco es un aislado lingüístico → no pertenece a ninguna familia conocida + sistema ergativo-absolutivo único en Europa occidental."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la relativización y qué lenguas tienen problemas con ella? (un tipo de morfología/el proceso de formar oraciones de relativo; la jerarquía de accesibilidad (Keenan-Comrie) predice que las lenguas forman relativas de sujeto más fácilmente que de oblicuo/un tipo de negación)"
        correctAnswer: el proceso de formar oraciones de relativo; la jerarquía de accesibilidad (Keenan-Comrie) predice que las lenguas forman relativas de sujeto más fácilmente que de oblicuo
        rationale: "Jerarquía: sujeto > objeto directo > objeto indirecto > oblicuo > genitivo → cuanto más abajo, más difícil (y menos frecuente) la relativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el latín podía tener orden de palabras relativamente libre? (porque los romanos eran más creativos/porque la morfología de caso (nominativo, acusativo, dativo...) marcaba la función sintáctica, haciendo el orden redundante/porque era una lengua aislante)"
        correctAnswer: porque la morfología de caso (nominativo, acusativo, dativo...) marcaba la función sintáctica, haciendo el orden redundante
        rationale: "Lengua flexiva con caso: la desinencia marca la función → el orden expresa información (énfasis, tema/rema), no función gramatical."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el universal de Greenberg número 1 sobre el orden sujeto-objeto? (el sujeto siempre precede al objeto en todas las lenguas/en todas las lenguas, el sujeto precede al objeto con más frecuencia que el orden inverso: SO > OS estadísticamente/el objeto siempre va al final)"
        correctAnswer: en todas las lenguas, el sujeto precede al objeto con más frecuencia que el orden inverso: SO > OS estadísticamente
        rationale: "Universal de Greenberg 1: la preferencia SO sobre OS es universal → en todas las lenguas (incluso VSO, VOS) el S tiende a preceder al O."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la dispersión tipológica (Nichols)? (una lengua con muchos dialectos/la distribución geográfica de los tipos morfológicos: las lenguas de América del Norte tienden a ser polisintéticas; las del sudeste asiático, aislantes/la variación interna de una lengua)"
        correctAnswer: la distribución geográfica de los tipos morfológicos: las lenguas de América del Norte tienden a ser polisintéticas; las del sudeste asiático, aislantes
        rationale: "Nichols: los tipos morfológicos se agrupan geográficamente → zona circumpadífica (polisintéticas); Eurasia oriental (aislantes); Europa (flexivas)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué implica la distinción aspectual perfectivo/imperfectivo en las lenguas eslavas? (que tienen caso/que el aspecto gramatical (completo vs. en curso/habitual) está lexicalizado en el sistema verbal: cada verbo tiene una forma perfectiva y una imperfectiva/que usan el tiempo presente para el futuro)"
        correctAnswer: que el aspecto gramatical (completo vs. en curso/habitual) está lexicalizado en el sistema verbal: cada verbo tiene una forma perfectiva y una imperfectiva
        rationale: "Lenguas eslavas (ruso, polaco): el aspecto es la categoría gramatical central → 'pisát' (imperfectivo: escribir habitualmente) vs. 'napisát' (perfectivo: escribir y terminar)."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
