title: Gramática - Tipología Textual y Géneros Discursivos
level: I
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Tipología textual (Werlich, Adam): narración, descripción, exposición, argumentación, instrucción. Géneros discursivos (Bajtín): géneros primarios y secundarios. Secuencias textuales. Superestructura (van Dijk). Coherencia y cohesión. Progresión temática (tema/rema, progresión lineal, de tema constante, de temas derivados). Macroestructura. Registro (campo, tenor, modo). Metafunción (Halliday). Polifonía (Ducrot)."
example: "narración → secuencia temporal + transformación: el clímax cambia el estado inicial → 'El viajero llegó, vio y partió distinto'. exposición → tematización → rematización: 'El texto expositivo [tema] / desarrolla un saber objetivo [rema]'. argumentación → tesis → argumentos → conclusión: 'La lectura crítica es esencial [tesis] → porque desarrolla el pensamiento [arg] → por ello se debe practicar [conclusión]'. progresión lineal → el rema de una oración se convierte en tema de la siguiente. superestructura narrativa → situación inicial / complicación / resolución / evaluación."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Tipología Textual y Géneros
    description: Identifica los tipos textuales y las estructuras del discurso.
    exercises:
      - type: grammar
        question: "¿Cuáles son los cinco tipos textuales básicos según Werlich? (prosa, verso, diálogo, monólogo, épica/narración, descripción, exposición, argumentación e instrucción: cada uno con una estructura cognitiva y lingüística característica/cuento, novela, poema, ensayo, carta)"
        correctAnswer: "narración, descripción, exposición, argumentación e instrucción: cada uno con una estructura cognitiva y lingüística característica"
        rationale: "Werlich (1975): tipos textuales = estructuras cognitivas del productor → la narración ancla en el tiempo; la descripción, en el espacio; la exposición, en la conceptualización."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia los géneros primarios de los secundarios en Bajtín? (la longitud/géneros primarios: espontáneos, de la vida cotidiana (conversación, carta informal); géneros secundarios: elaborados, culturales (novela, ensayo) → los secundarios absorben y transforman los primarios/el soporte físico)"
        correctAnswer: "géneros primarios: espontáneos, de la vida cotidiana (conversación, carta informal); géneros secundarios: elaborados, culturales (novela, ensayo) → los secundarios absorben y transforman los primarios"
        rationale: "Bajtín: los géneros secundarios (novela) incorporan géneros primarios (carta, diálogo) transformándolos → la novela epistolar como ejemplo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la superestructura textual en van Dijk? (el estilo del texto/el esquema formal que organiza las categorías del texto: la superestructura narrativa (situación/complicación/resolución) o argumentativa (tesis/argumentos/conclusión)/la coherencia semántica)"
        correctAnswer: "el esquema formal que organiza las categorías del texto: la superestructura narrativa (situación/complicación/resolución) o argumentativa (tesis/argumentos/conclusión)"
        rationale: "Superestructura: la forma del texto, independiente del contenido → la misma superestructura argumentativa puede albergar macroestructuras distintas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la progresión temática lineal? (el tema permanece igual/el rema de una oración se convierte en tema de la siguiente: crea una cadena de información nueva que avanza paso a paso/temas derivados de un hipertema)"
        correctAnswer: "el rema de una oración se convierte en tema de la siguiente: crea una cadena de información nueva que avanza paso a paso"
        rationale: "Progresión lineal: 'Los alumnos estudian [R: estudian]. El estudio [T] desarrolla el pensamiento [R]' → R₁ = T₂."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el registro según Halliday? (el nivel de formalidad/la variedad lingüística determinada por tres variables: campo (qué se hace/tema), tenor (relación entre participantes) y modo (canal y organización del discurso)/el género textual)"
        correctAnswer: "la variedad lingüística determinada por tres variables: campo (qué se hace/tema), tenor (relación entre participantes) y modo (canal y organización del discurso)"
        rationale: "Halliday: campo/tenor/modo → determinan las elecciones léxico-gramaticales → el registro médico tiene campo especializado, tenor asimétrico, modo escrito formal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la metafunción textual en la lingüística sistémica funcional de Halliday? (la función narrativa/la función del lenguaje de organizar el mensaje: la información se divide en tema (lo conocido) y rema (lo nuevo) según la posición en la cláusula/la función poética)"
        correctAnswer: "la función del lenguaje de organizar el mensaje: la información se divide en tema (lo conocido) y rema (lo nuevo) según la posición en la cláusula"
        rationale: "Metafunción textual: junto a la ideacional y la interpersonal → las tres metafunciones operan simultáneamente en cada cláusula."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la polifonía discursiva según Ducrot? (el uso de varios idiomas/la presencia de múltiples voces o enunciadores en un mismo enunciado: 'Según los expertos, la medida es necesaria' introduce una voz que el locutor cita sin identificarse plenamente con ella/la narración en primera persona)"
        correctAnswer: "la presencia de múltiples voces o enunciadores en un mismo enunciado: 'Según los expertos, la medida es necesaria' introduce una voz que el locutor cita sin identificarse plenamente con ella"
        rationale: "Ducrot: polifonía → el locutor ≠ el enunciador → el discurso indirecto, las citas y las concesiones ('aunque X, Y') son recursos polifónicos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la macroestructura textual? (la organización de párrafos/la representación semántica global del texto: el resumen o tema principal que abstrae el contenido de las macroproposiciones/la introducción y la conclusión)"
        correctAnswer: "la representación semántica global del texto: el resumen o tema principal que abstrae el contenido de las macroproposiciones"
        rationale: "Macroestructura (van Dijk): las macrorreglas (supresión, generalización, construcción) reducen la microestructura a la macroestructura."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue la cohesión de la coherencia textual? (son sinónimos/cohesión: mecanismos lingüísticos explícitos que conectan oraciones (pronombres, conectores, elipsis); coherencia: propiedad semántica global de que el texto tenga sentido unitario/la cohesión es oral y la coherencia escrita)"
        correctAnswer: "cohesión: mecanismos lingüísticos explícitos que conectan oraciones (pronombres, conectores, elipsis); coherencia: propiedad semántica global de que el texto tenga sentido unitario"
        rationale: "Halliday y Hasan: cohesión = textura (surface); coherencia = sentido (profundo) → un texto puede ser cohesivo sin ser coherente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la característica principal del tipo textual instruccional? (usa el pasado/organiza la acción en pasos secuenciales orientados a un resultado: imperativo, infinitivo o futuro; presupone un agente que debe ejecutar las instrucciones/narra eventos pasados)"
        correctAnswer: "organiza la acción en pasos secuenciales orientados a un resultado: imperativo, infinitivo o futuro; presupone un agente que debe ejecutar las instrucciones"
        rationale: "Texto instruccional: recetas, manuales, reglamentos → verbos directivos, numeración, orientación al receptor como agente ejecutor."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: "Aplicación: Análisis Textual"
    description: Aplica los conceptos de tipología textual al análisis de textos.
    exercises:
      - type: grammar
        question: "¿Por qué el texto periodístico informativo es un género secundario en el sentido de Bajtín? (porque es muy largo/porque reelabora géneros primarios (testimonio, conversación, declaración) en una estructura cultural compleja con convenciones propias (pirámide invertida, titular, lead)/porque usa lenguaje culto)"
        correctAnswer: porque reelabora géneros primarios (testimonio, conversación, declaración) en una estructura cultural compleja con convenciones propias (pirámide invertida, titular, lead)
        rationale: "Géneros secundarios: el artículo periodístico incorpora citas directas (género primario) dentro de una estructura convencional compleja."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "En 'Los científicos han demostrado que X. X produce Y. Y implica Z', ¿qué tipo de progresión temática se usa? (de tema constante/lineal: el rema de cada oración se convierte en tema de la siguiente: R₁(X)→T₂, R₂(Y)→T₃/de temas derivados)"
        correctAnswer: "lineal: el rema de cada oración se convierte en tema de la siguiente: R₁(X)→T₂, R₂(Y)→T₃"
        rationale: "Progresión lineal: característica de textos expositivos y explicativos → construye una cadena de conocimiento nuevo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relaciona el tenor con el registro en un informe médico? (no se relacionan/el tenor asimétrico (médico-paciente o médico-institución) determina elecciones de formalidad, terminología especializada y modalidad deóntica en el texto/el tenor solo afecta al modo)"
        correctAnswer: el tenor asimétrico (médico-paciente o médico-institución) determina elecciones de formalidad, terminología especializada y modalidad deóntica en el texto
        rationale: "Tenor: la relación de poder y familiaridad entre participantes → el informe médico usa 'se recomienda' (tenor institucional) vs. 'tienes que' (tenor informal)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué secuencia textual predomina en un texto como 'Instrucciones para subir una escalera' de Cortázar? (argumentativa/instruccional parodiada: la secuencia instruccional (pasos, imperativo, numeración) se usa con contenido absurdo → el contraste crea el efecto humorístico/narrativa)"
        correctAnswer: "instruccional parodiada: la secuencia instruccional (pasos, imperativo, numeración) se usa con contenido absurdo → el contraste crea el efecto humorístico"
        rationale: "Cortázar subvierte la superestructura instruccional → la parodia requiere que el lector reconozca el género que se imita."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué mecanismo de cohesión usa 'el primero... el segundo... el último'? (conectores temporales/anáfora asociativa: establecen referencias a elementos de un conjunto mencionado anteriormente, organizando la progresión temática/elipsis)"
        correctAnswer: "anáfora asociativa: establecen referencias a elementos de un conjunto mencionado anteriormente, organizando la progresión temática"
        rationale: "Anáfora asociativa: 'tres factores... el primero, el segundo, el tercero' → cohesión a través de la estructura enumerativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el ensayo académico combina múltiples tipos textuales? (por error/porque incluye secuencias expositivas (definiciones), argumentativas (tesis+evidencias), descriptivas (contexto) e incluso narrativas (ejemplos) → los tipos textuales se mezclan en géneros complejos/porque es un género oral)"
        correctAnswer: porque incluye secuencias expositivas (definiciones), argumentativas (tesis+evidencias), descriptivas (contexto) e incluso narrativas (ejemplos) → los tipos textuales se mezclan en géneros complejos
        rationale: "Adam: los textos reales combinan secuencias → el tipo textual dominante define el género, pero coexisten con secuencias secundarias."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la elipsis como mecanismo de cohesión? (un error gramatical/la omisión de un elemento recuperable del contexto previo: 'Pedro llegó tarde y [Pedro] se disculpó' → elimina la repetición manteniendo la referencia/un tipo de anáfora)"
        correctAnswer: "la omisión de un elemento recuperable del contexto previo: 'Pedro llegó tarde y [Pedro] se disculpó' → elimina la repetición manteniendo la referencia"
        rationale: "Elipsis: mecanismo de economía cohesiva → el elemento omitido es interpretable por el contexto; su abuso puede generar ambigüedad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo opera la modalidad en el texto argumentativo para expresar el compromiso del enunciador? (no opera/los verbos modales y los adverbios epistémicos (claramente, es posible que, se afirma) gradúan el compromiso del enunciador con la verdad de lo enunciado/solo en textos narrativos)"
        correctAnswer: los verbos modales y los adverbios epistémicos (claramente, es posible que, se afirma) gradúan el compromiso del enunciador con la verdad de lo enunciado
        rationale: "Modalidad epistémica en argumentación: 'está demostrado que' (alto compromiso) vs. 'podría ser que' (bajo compromiso) → el hedging académico reduce el compromiso."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la descripción objetiva de la subjetiva en tipología textual? (la longitud/descripción objetiva: rasgos verificables, léxico denotativo, perspectiva impersonal; descripción subjetiva: evaluación, léxico connotativo, perspectiva del observador/el soporte)"
        correctAnswer: "descripción objetiva: rasgos verificables, léxico denotativo, perspectiva impersonal; descripción subjetiva: evaluación, léxico connotativo, perspectiva del observador"
        rationale: "Descripción técnica (objetiva): especificaciones; descripción literaria (subjetiva): atmósfera → los mismos referentes, tratamiento opuesto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la isotopía en el análisis textual? (un tipo de rima/la recurrencia de rasgos semánticos a lo largo del texto que crea coherencia temática: en un texto sobre el mar, campos léxicos de agua, navegación, profundidad crean isotopía/un tipo de cohesión gramatical)"
        correctAnswer: "la recurrencia de rasgos semánticos a lo largo del texto que crea coherencia temática: en un texto sobre el mar, campos léxicos de agua, navegación, profundidad crean isotopía"
        rationale: "Isotopía (Greimas): la coherencia semántica emerge de la redundancia de semas → permite la lectura coherente aunque no haya correferencia explícita."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
