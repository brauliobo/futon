title: 📝 Revisión General - Nivel I
level: I
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Revisión integral del Nivel I: tipología lingüística, física cuántica, sintaxis X-barra, semiótica, crisis financiera, ACD, filosofía de la mente, tipología textual, neurociencia, pragmática formal, sociología, fonología, historia latinoamericana, morfología derivativa, Siglo de Oro, semántica formal, globalización, dialectología, bioética."
example: "gramática → identifica la estructura pedida (X-barra/semántica/pragmática) → aplica el concepto teórico; lectura → localiza el argumento o dato en el texto → identifica postura/evidencia/conclusión → distingue hechos de inferencias."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Revisión I - Marco Teórico Lingüístico
    description: Repasa los grandes marcos teóricos lingüísticos del nivel I.
    exercises:
      - type: grammar
        question: "¿Qué distingue la morfología aglutinante de la fusionante? (el número de palabras/aglutinante: cada morfema expresa un significado gramatical único y los morfemas son claramente separables (turco, swahili); fusionante: un morfema expresa varios significados gramaticales amalgamados (latín, español: '-ó' = 3ª persona + singular + pretérito + indicativo)/el orden de palabras)"
        correctAnswer: "aglutinante: cada morfema expresa un significado gramatical único y los morfemas son claramente separables (turco, swahili); fusionante: un morfema expresa varios significados gramaticales amalgamados (latín, español: '-ó' = 3ª persona + singular + pretérito + indicativo)"
        rationale: "Tipología morfológica: las lenguas se sitúan en un continuum aislante-aglutinante-fusionante → el español es predominantemente fusionante con rasgos aglutinantes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la posición del sujeto en la estructura X-barra de la oración? (complemento del verbo/posición de objeto/Spec-ST: el especificador del sintagma temporal es la posición canónica del sujeto → desde allí c-manda al objeto y verifica los rasgos de concordancia en T)"
        correctAnswer: "Spec-ST: el especificador del sintagma temporal es la posición canónica del sujeto → desde allí c-manda al objeto y verifica los rasgos de concordancia en T"
        rationale: "X-barra: sujeto = Spec-ST; el verbo sube de V a T → [ST sujeto [T' T+V [SV ___ objeto]]]."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue un ícono de un símbolo en semiótica peirceana? (el tamaño/el ícono se basa en la semejanza con su objeto (fotografía, mapa); el símbolo se basa en una convención arbitraria (palabras, banderas) → la mayoría de los signos lingüísticos son símbolos/el índice y el símbolo son idénticos)"
        correctAnswer: el ícono se basa en la semejanza con su objeto (fotografía, mapa); el símbolo se basa en una convención arbitraria (palabras, banderas) → la mayoría de los signos lingüísticos son símbolos
        rationale: "Peirce: ícono (semejanza), índice (causalidad), símbolo (convención) → Saussure: el signo lingüístico es arbitrario = simbólico en términos peirceanos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué estrategia discursiva usa 'Se han producido víctimas en la operación'? (argumento de autoridad/nominalización que oculta la agencia: 'víctimas' (nominalización) y 'se han producido' (pasiva refleja) eliminan el agente responsable → estrategia del ACD/un eufemismo estético)"
        correctAnswer: "nominalización que oculta la agencia: 'víctimas' (nominalización) y 'se han producido' (pasiva refleja) eliminan el agente responsable → estrategia del ACD"
        rationale: "ACD: la nominalización y la pasiva refleja son recursos sistemáticos para ocultar a los responsables → 'Se han producido víctimas' vs. 'El ejército mató a manifestantes'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre los actos ilocucionarios directivos y los expresivos? (no hay diferencia/directivos: buscan que el oyente realice una acción (ordenar, pedir, rogar); expresivos: manifiestan el estado psicológico del hablante (agradecer, disculparse, felicitar) → no buscan cambiar la conducta sino reconocer un estado/los directivos son más formales)"
        correctAnswer: "directivos: buscan que el oyente realice una acción (ordenar, pedir, rogar); expresivos: manifiestan el estado psicológico del hablante (agradecer, disculparse, felicitar) → no buscan cambiar la conducta sino reconocer un estado"
        rationale: "Taxonomía de Searle: cada tipo de acto ilocucionario tiene condiciones de felicidad y dirección de ajuste distintas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la progresión temática con temas derivados? (el tema cambia en cada oración/todos los temas del texto derivan de un hipertema inicial: un párrafo sobre 'la economía' puede desarrollar temas derivados (inflación, empleo, PIB) que todos nacen del hipertema/la progresión lineal)"
        correctAnswer: "todos los temas del texto derivan de un hipertema inicial: un párrafo sobre 'la economía' puede desarrollar temas derivados (inflación, empleo, PIB) que todos nacen del hipertema"
        rationale: "Progresión de temas derivados (Adam): el hipertema se expande en subtemas → característico de textos descriptivos y expositivos organizados jerárquicamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el principio de Hebb es fundamental para la educación? (porque explica la memoria a largo plazo exclusivamente/porque explica que la práctica repetida refuerza los circuitos neurales (neuroplasticidad): el aprendizaje sostenido crea conexiones sinápticas más fuertes → base neurocientífica del método Kumon y de la práctica deliberada/solo se aplica a la memoria motora)"
        correctAnswer: "porque explica que la práctica repetida refuerza los circuitos neurales (neuroplasticidad): el aprendizaje sostenido crea conexiones sinápticas más fuertes → base neurocientífica del método Kumon y de la práctica deliberada"
        rationale: "Hebb: 'cells that fire together wire together' → la repetición espaciada y la práctica deliberada tienen base neural documentada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue los designadores rígidos de las descripciones definidas en semántica? (la longitud/los designadores rígidos (nombres propios) designan el mismo individuo en todos los mundos posibles; las descripciones definidas pueden designar distintos individuos en mundos distintos: 'el presidente de México' varía según el mundo/'Juárez' no/los designadores son más formales)"
        correctAnswer: "los designadores rígidos (nombres propios) designan el mismo individuo en todos los mundos posibles; las descripciones definidas pueden designar distintos individuos en mundos distintos: 'el presidente de México' varía según el mundo/'Juárez' no"
        rationale: "Kripke: los nombres propios son designadores rígidos → fundamento de la teoría de la referencia directa y de la semántica modal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué fenómeno explica que 'burro' tenga distinto significado en España ('asno') y en México ('tonto/estúpido')? (el contacto con el inglés/la derivación morfológica/la variación semántica dialectal: una misma forma léxica adquiere significados distintos en distintas variedades del español; proceso de divergencia semántica)"
        correctAnswer: "la variación semántica dialectal: una misma forma léxica adquiere significados distintos en distintas variedades del español; proceso de divergencia semántica"
        rationale: "Variación semántica: 'coger' (neutro en España, vulgar en México y Argentina), 'bicho' (insecto en España, persona astuta en el Cono Sur) → documentado en diccionarios de americanismos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué principio bioético se viola cuando un médico no informa a un paciente sobre los riesgos de una intervención? (no maleficencia/autonomía: el paciente no puede ejercer su derecho a decidir informadamente → se incumple el requisito del consentimiento informado/justicia)"
        correctAnswer: "autonomía: el paciente no puede ejercer su derecho a decidir informadamente → se incumple el requisito del consentimiento informado"
        rationale: "Autonomía y consentimiento informado: la información es condición necesaria para el consentimiento válido → su omisión viola el principio de autonomía."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Revisión I - Textos y Aplicación
    description: Integra los conocimientos del nivel I en el análisis de textos y fenómenos.
    exercises:
      - type: grammar
        question: "¿Cómo se aplican la macroestructura y la superestructura al análisis de un artículo científico? (no se aplican/superestructura: la estructura formal del artículo científico (IMRD: Introducción, Métodos, Resultados, Discusión); macroestructura: el contenido semántico global (la tesis y los resultados principales) → las dos dimensiones son independientes/son el mismo concepto)"
        correctAnswer: "superestructura: la estructura formal del artículo científico (IMRD: Introducción, Métodos, Resultados, Discusión); macroestructura: el contenido semántico global (la tesis y los resultados principales) → las dos dimensiones son independientes"
        rationale: "Van Dijk: superestructura = forma; macroestructura = contenido → el mismo artículo científico (IMRD) puede tener macroestructuras muy distintas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de argumento usa 'Los científicos han demostrado que el azúcar es adictiva'? (ad hominem/argumento de autoridad: apela a la credibilidad de los científicos para legitimar la conclusión; en el ACD, esta estrategia se llama legitimación por autorización/argumento de analogía)"
        correctAnswer: "argumento de autoridad: apela a la credibilidad de los científicos para legitimar la conclusión; en el ACD, esta estrategia se llama legitimación por autorización"
        rationale: "Legitimación por autorización (van Leeuwen): apelación a la autoridad de expertos o instituciones → puede ser legítima o una falacia si los 'expertos' no lo son."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'Ella ya comió, pero él no' no viola el principio A del ligamiento? (sí lo viola/porque 'ella' y 'él' son pronombres, no anafóricos → el Principio B (pronombres libres en su dominio local) se satisface: cada pronombre refiere a un individuo distinto fuera de la oración simple/porque es una oración compuesta)"
        correctAnswer: "porque 'ella' y 'él' son pronombres, no anafóricos → el Principio B (pronombres libres en su dominio local) se satisface: cada pronombre refiere a un individuo distinto fuera de la oración simple"
        rationale: "Ligamiento: el Principio A afecta a anafóricos (reflexivos); el Principio B a pronombres → los pronombres deben tener referencia externa al dominio local."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo explicaría la fonología óptima la diferencia entre 'apartamento' (español) y 'apartment' (inglés) como adaptación del mismo préstamo? (por diferente gramática/por jerarquías de restricciones distintas: el español prohíbe la coda consonántica /nt/ final → inserción de vocal epentética; el inglés la permite → las mismas restricciones universales se jerarquizan distinto/por error de traducción)"
        correctAnswer: "por jerarquías de restricciones distintas: el español prohíbe la coda consonántica /nt/ final → inserción de vocal epentética; el inglés la permite → las mismas restricciones universales se jerarquizan distinto"
        rationale: "OT: la fonotáctica diferente entre lenguas emerge de jerarquías distintas de las mismas restricciones universales (NOCODA, FAITH) → explica la variación tipológica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el sesgo en los datos de entrenamiento de la IA es un problema bioético y no solo técnico? (no es bioético/porque el sesgo en diagnósticos médicos causa daño real a grupos subrepresentados → viola el principio de justicia (igual atención para todos): es un problema de equidad con consecuencias clínicas/porque la IA no se usa en medicina)"
        correctAnswer: "porque el sesgo en diagnósticos médicos causa daño real a grupos subrepresentados → viola el principio de justicia (igual atención para todos): es un problema de equidad con consecuencias clínicas"
        rationale: "Justicia bioética: el sesgo algorítmico no es neutral → reproducir desigualdades en la atención médica es una violación del principio de justicia de Beauchamp y Childress."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relaciona el capital cultural de Bourdieu con el acceso al español estándar? (no se relacionan/el capital cultural educativo determina el acceso al español estándar (escrito, formal): quienes tienen más capital cultural dominan más variedades y registros → la norma culta favorece a quienes ya la conocen/el capital cultural es solo económico)"
        correctAnswer: "el capital cultural educativo determina el acceso al español estándar (escrito, formal): quienes tienen más capital cultural dominan más variedades y registros → la norma culta favorece a quienes ya la conocen"
        rationale: "Bourdieu + lingüística: el capital lingüístico es una forma de capital cultural → el sistema educativo privilegia la variedad estándar y penaliza las no estándar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la implicatura 'Algunos estudiantes aprobaron' implica 'No todos aprobaron'? (por la gramática/por la máxima de cantidad: si el hablante dice 'algunos' cuando podría decir 'todos', el oyente infiere que 'todos' no es verdadero → implicatura escalar: la escala <todos, la mayoría, muchos, algunos>/por una presuposición)"
        correctAnswer: "por la máxima de cantidad: si el hablante dice 'algunos' cuando podría decir 'todos', el oyente infiere que 'todos' no es verdadero → implicatura escalar: la escala <todos, la mayoría, muchos, algunos>"
        rationale: "Implicatura escalar (Horn): el uso de un término de la escala implica la falsedad de los términos superiores → 'algunos' implica 'no todos' por la máxima de cantidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué revela la crisis de Lehman Brothers sobre el framing discursivo en los medios? (que los bancos quiebran/que el mismo evento puede enmarcarse como 'el colapso del capitalismo', 'el fracaso de la regulación' o 'la codicia de unos pocos': el frame activa distintas valoraciones y propuestas de solución/que el lenguaje es neutro)"
        correctAnswer: "que el mismo evento puede enmarcarse como 'el colapso del capitalismo', 'el fracaso de la regulación' o 'la codicia de unos pocos': el frame activa distintas valoraciones y propuestas de solución"
        rationale: "Framing (ACD): el evento financiero es el mismo, pero el marco interpretativo determina qué causas se atribuyen y qué soluciones se proponen."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la contribución de la Teoría X-barra al programa minimalista de Chomsky? (la eliminó completamente/asentó las bases que el minimalismo simplificó: X-barra describía la estructura con tres niveles (X⁰/X'/X''); el minimalismo los reduce a la operación de Merge binario → el aporte de X-barra fue establecer la universalidad de la estructura sintagmática/la X-barra es el minimalismo)"
        correctAnswer: "asentó las bases que el minimalismo simplificó: X-barra describía la estructura con tres niveles (X⁰/X'/X''); el minimalismo los reduce a la operación de Merge binario → el aporte de X-barra fue establecer la universalidad de la estructura sintagmática"
        rationale: "Evolución de la teoría sintáctica: X-barra (1970s) → Principios y Parámetros (1980s) → Programa Minimalista (1990s-hoy) → simplificación progresiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la Revolución Cubana y la Doctrina Monroe son ejemplos de cómo el discurso político construye marcos ideológicos? (son eventos históricos sin discurso/los mismos hechos se enmarcan como 'liberación nacional' (perspectiva cubana) o 'amenaza comunista' (perspectiva estadounidense): el léxico y el frame determinan la interpretación política → ACD aplicado a la historia/son eventos neutrales)"
        correctAnswer: "los mismos hechos se enmarcan como 'liberación nacional' (perspectiva cubana) o 'amenaza comunista' (perspectiva estadounidense): el léxico y el frame determinan la interpretación política → ACD aplicado a la historia"
        rationale: "ACD histórico: los eventos de la Guerra Fría en América Latina ejemplifican cómo el discurso político construye interpretaciones opuestas del mismo referente histórico."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
