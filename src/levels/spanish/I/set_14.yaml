title: Gramática - Morfología Derivativa Avanzada
level: I
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Morfología derivativa: prefijación, sufijación, parasíntesis, conversión. Morfemas derivativos cultos (greco-latinos). Productividad morfológica. Sufijos nominalizadores (-ción, -miento, -aje, -ura, -ez, -dad). Sufijos adjetivales (-ble, -oso, -al, -ivo, -ico). Prefijos de negación (in-, des-, a-). Prefijos de intensidad (re-, archi-, super-). Interfijos. Restricciones de selección de base. Reglas de truncamiento. Morfología apreciativa (diminutivos, aumentativos, despectivos). Parasíntesis: a+N+ar, en+N+ar."
example: "nominalización deverbativa → sufijo -ción selecciona bases verbales: 'producir → producción'; sufijo -miento: 'agotar → agotamiento'. restricción de base → -ble solo se adjunta a bases verbales transitivas: 'comible/amable' (OK) vs. '*dormible' (agramatical). parasíntesis → a-+N+ar: 'aterrizar' (tierra + a- + -izar): no existe *'aterrizar' sin prefijo ni sin sufijo. interfijo → 'café-c-ito' (no *cafito): /k/ es interfijo sin significado que repara la estructura fónica. productividad → -ción es muy productivo; -dumbre es improductivo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Derivación y Morfología Productiva
    description: Identifica los procesos y restricciones de la morfología derivativa.
    exercises:
      - type: grammar
        question: "¿Qué diferencia la prefijación de la sufijación en morfología derivativa? (no hay diferencia/la prefijación añade morfemas al inicio de la base y generalmente no cambia la categoría gramatical; la sufijación añade morfemas al final y suele cambiar la categoría: 'producir → producción' (V→N)/la prefijación cambia el significado más)"
        correctAnswer: "la prefijación añade morfemas al inicio de la base y generalmente no cambia la categoría gramatical; la sufijación añade morfemas al final y suele cambiar la categoría: 'producir → producción' (V→N)"
        rationale: "Prefijación: 'des-hacer' (V→V); sufijación: 'hacer → hecho-r' (V→N) → los sufijos son los principales mecanismos de cambio de categoría."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la parasíntesis en morfología española? (la combinación de dos prefijos/la formación simultánea de prefijo + base + sufijo, donde ninguna de las etapas intermedias existe: 'aterrizar' = a- + tierra + -izar → no existe *aterrizar ni *tierrizar/la combinación de dos sufijos)"
        correctAnswer: "la formación simultánea de prefijo + base + sufijo, donde ninguna de las etapas intermedias existe: 'aterrizar' = a- + tierra + -izar → no existe *aterrizar ni *tierrizar"
        rationale: "Parasíntesis: a+N+ar (anochecer, aterrizar) o en+N+ar (engordar, enfriar) → la derivación es una sola operación morfológica indivisible."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué restricción de selección de base tiene el sufijo -ble? (se adjunta a cualquier palabra/se adjunta exclusivamente a bases verbales transitivas: 'comible', 'amable' (OK) vs. '*dormible', '*lluvible' (agramaticales)/se adjunta solo a adjetivos)"
        correctAnswer: "se adjunta exclusivamente a bases verbales transitivas: 'comible', 'amable' (OK) vs. '*dormible', '*lluvible' (agramaticales)"
        rationale: "Restricción de -ble: base verbal transitiva → el derivado significa 'que puede ser X-ado' → los verbos intransitivos y los que no admiten objeto directo lo bloquean."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un interfijo en morfología? (un prefijo especial/un morfema vacío de significado que se inserta entre la base y el sufijo por razones fonotácticas o eufónicas: 'café → cafecito' (no *cafito): la /c/ es un interfijo de reparación/un tipo de sufijo)"
        correctAnswer: "un morfema vacío de significado que se inserta entre la base y el sufijo por razones fonotácticas o eufónicas: 'café → cafecito' (no *cafito): la /c/ es un interfijo de reparación"
        rationale: "Interfijos: morfemas fónicamente motivados sin función semántica → 'pan-ec-illo', 'flor-ec-er' → la estructura fónica de la base determina el interfijo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia los sufijos nominalizadores -ción y -miento? (son idénticos/ambos nominalizan verbos, pero -ción suele aplicarse a bases latinas (-ar, -er, -ir): 'actuación'; -miento aparece en bases patrimoniales y expresa el proceso o resultado: 'agotamiento'/solo -ción es productivo)"
        correctAnswer: "ambos nominalizan verbos, pero -ción suele aplicarse a bases latinas (-ar, -er, -ir): 'actuación'; -miento aparece en bases patrimoniales y expresa el proceso o resultado: 'agotamiento'"
        rationale: "-ción vs. -miento: ambos productivos pero con preferencias distribucionales → algunos verbos admiten los dos con matices distintos: 'conocimiento/cognición'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la productividad morfológica? (el número de palabras en el diccionario/la capacidad de una regla o afijo de generar nuevas palabras de forma regular y sistemática en sincronía: -ción es muy productivo; -dumbre (certidumbre, muchedumbre) es improductivo/la antigüedad del afijo)"
        correctAnswer: "la capacidad de una regla o afijo de generar nuevas palabras de forma regular y sistemática en sincronía: -ción es muy productivo; -dumbre (certidumbre, muchedumbre) es improductivo"
        rationale: "Productividad: un afijo productivo puede adjuntarse a palabras nuevas de su clase → -idad genera adjetivos → sustantivos indefinidamente en español."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia semántica entre los prefijos de negación in- y des-? (son sinónimos/in- niega una propiedad o estado (inaceptable = no aceptable); des- indica privación o reversión de una acción (deshacer = hacer al revés; descontentar = quitar el contento)/in- es más productivo)"
        correctAnswer: in- niega una propiedad o estado (inaceptable = no aceptable); des- indica privación o reversión de una acción (deshacer = hacer al revés; descontentar = quitar el contento)
        rationale: "in-: base adjetival → niega la propiedad. des-: base verbal o nominal → invierte o priva → 'infeliz' (no feliz) vs. 'deshacer' (invertir hacer)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los morfemas cultos (greco-latinos) en la morfología del español? (palabras extranjeras/morfemas de origen griego o latino que se combinan productivamente para formar términos científicos y técnicos: bio- (vida), -logía (estudio), geo- (tierra), -grafía (escritura)/sufijos medievales)"
        correctAnswer: "morfemas de origen griego o latino que se combinan productivamente para formar términos científicos y técnicos: bio- (vida), -logía (estudio), geo- (tierra), -grafía (escritura)"
        rationale: "Morfemas cultos: base del vocabulario científico internacional → 'biología', 'geografía', 'antropología' → combinables productivamente en neología científica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa la morfología apreciativa diminutiva en español más allá del tamaño? (solo el tamaño pequeño/afecto, atenuación, ironía o incluso disfemismo según el contexto: 'un momentito' (cortesía), 'pobrecillo' (compasión), 'listillo' (ironía despectiva)/solo existe en el lenguaje infantil)"
        correctAnswer: "afecto, atenuación, ironía o incluso disfemismo según el contexto: 'un momentito' (cortesía), 'pobrecillo' (compasión), 'listillo' (ironía despectiva)"
        rationale: "Diminutivo pragmático: el significado dimensional es solo uno de sus valores → el contexto activa la lectura afectiva, atenuadora o irónica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el truncamiento en morfología? (la eliminación de un prefijo/la formación de palabras por reducción de la base: 'bicicleta → bici', 'fotografía → foto', 'televisión → tele' → proceso informal pero altamente productivo en el español coloquial/un tipo de composición)"
        correctAnswer: "la formación de palabras por reducción de la base: 'bicicleta → bici', 'fotografía → foto', 'televisión → tele' → proceso informal pero altamente productivo en el español coloquial"
        rationale: "Truncamiento: la palabra reducida conserva la primera parte de la base → muy productivo en registros informales y jergas → 'profe', 'cole', 'peli'."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis Morfológico Aplicado
    description: Aplica los conceptos morfológicos al análisis de palabras reales.
    exercises:
      - type: grammar
        question: "¿Cuál es el análisis morfológico de 'imperdonable'? (prefijo + raíz/im- (negación: variante de in- ante /p, b/) + perdonar (V) + -able (adj, 'que puede ser X-ado') → triple estructura: prefijo + verbo + sufijo/im- + perdón + able)"
        correctAnswer: "im- (negación: variante de in- ante /p, b/) + perdonar (V) + -able (adj, 'que puede ser X-ado') → triple estructura: prefijo + verbo + sufijo"
        rationale: "Imperdonable: la variante im- es alomorfo de in- condicionado fonológicamente ante /p, b/ → [in] + [b] → asimilación labial → [im]."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué proceso morfológico genera 'enriquecer' a partir de 'rico'? (prefijación simple/parasíntesis: en- + rico + -ecer → la base adjetiva (rico) no puede combinarse solo con en- (*enrico) ni solo con -ecer (*riquecer) → la derivación es simultánea/sufijación)"
        correctAnswer: "parasíntesis: en- + rico + -ecer → la base adjetiva (rico) no puede combinarse solo con en- (*enrico) ni solo con -ecer (*riquecer) → la derivación es simultánea"
        rationale: "Parasíntesis con -ecer: en+A+ecer → enriquecer, envejecer, enloquecer → el proceso crea verbos causativos a partir de adjetivos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'amabilidad' tiene tres morfemas derivativos? (porque es un anglicismo/amar (V) + -able (adj) + -idad (N) → cadena derivativa: V→Adj→N; cada sufijo cambia la categoría → proceso de derivación en cascada/porque es una palabra compuesta)"
        correctAnswer: "amar (V) + -able (adj) + -idad (N) → cadena derivativa: V→Adj→N; cada sufijo cambia la categoría → proceso de derivación en cascada"
        rationale: "Derivación en cascada: V → [amar + -able] = amable (Adj) → [amable + -idad] = amabilidad (N) → el español permite cadenas derivativas largas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué fenómeno explica las parejas 'negro/negrura' y 'blanco/blancura'? (que son sinónimos/que el sufijo -ura nominaliza adjetivos de color y cualidad formando sustantivos que expresan la propiedad abstracta: 'negrura' = la cualidad de ser negro; productivo con adjetivos de cualidad física/que son irregulares)"
        correctAnswer: "que el sufijo -ura nominaliza adjetivos de color y cualidad formando sustantivos que expresan la propiedad abstracta: 'negrura' = la cualidad de ser negro; productivo con adjetivos de cualidad física"
        rationale: "-ura: nominaliza adjetivos → blancura, dulzura, amargura, gordura → expresa la propiedad abstracta o su manifestación concreta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'requetefuerte' usa el prefijo intensificador re- dos veces? (por error gramatical/porque el prefijo re- puede iterarse para expresar superlación coloquial: re-quete- es una forma lexicalizada de intensificación extrema en el español coloquial/porque es un anglicismo)"
        correctAnswer: "porque el prefijo re- puede iterarse para expresar superlación coloquial: re-quete- es una forma lexicalizada de intensificación extrema en el español coloquial"
        rationale: "Prefijos intensificadores: re- (refeo), requete- (requetebueno), archi- (archienemigo), super- (superbien) → gradiente coloquial de intensidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia morfológica entre 'periodismo' y 'periodista'? (ninguna/ambos derivan de 'periódico' pero con sufijos distintos: -ismo nominaliza la actividad o ideología; -ista nominaliza al agente que la practica → patrón productivo: 'socialismo/socialista', 'ciclismo/ciclista'/solo cambia la terminación)"
        correctAnswer: "ambos derivan de 'periódico' pero con sufijos distintos: -ismo nominaliza la actividad o ideología; -ista nominaliza al agente que la practica → patrón productivo: 'socialismo/socialista', 'ciclismo/ciclista'"
        rationale: "-ismo/-ista: pares morfológicos productivos → la misma base con sufijos distintos genera el sistema (actividad) y el agente (practicante)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué proceso morfológico genera palabras como 'ayuntamiento', 'comportamiento', 'pensamiento'? (composición/nominalización deverbativa con el sufijo -miento, que selecciona bases verbales y expresa el proceso o resultado de la acción: ayuntar→ayuntamiento, comportar→comportamiento/prefijación)"
        correctAnswer: "nominalización deverbativa con el sufijo -miento, que selecciona bases verbales y expresa el proceso o resultado de la acción: ayuntar→ayuntamiento, comportar→comportamiento"
        rationale: "-miento: sufijo nominalizador deverbativo → hereda la estructura argumental del verbo → 'el comportamiento de los estudiantes' (agente implícito)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué restricción tiene el sufijo -ez para la formación de sustantivos abstractos? (no tiene restricciones/selecciona bases adjetivas simples (generalmente monosílabas o bisílabas): 'estrecho→estrechez', 'pálido→palidez', 'sencillo→sencillez' → improductivo con adjetivos largos o cultos/selecciona verbos)"
        correctAnswer: "selecciona bases adjetivas simples (generalmente monosílabas o bisílabas): 'estrecho→estrechez', 'pálido→palidez', 'sencillo→sencillez' → improductivo con adjetivos largos o cultos"
        rationale: "-ez: nominaliza adjetivos de cualidad → el paradigma es cerrado (lista fija) → no productivo en neología: 'complicadez' sería agramatical, se usa -dad en su lugar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la homonimia morfológica de sufijos? (un error de análisis/que un mismo sufijo tiene valores distintos: -ero forma gentilicios (madrileño → madri-leño), agentes (cartero), instrumentos (lavadero) y lugares (lavadero) → el contexto determina la lectura/que dos sufijos suenan igual)"
        correctAnswer: "que un mismo sufijo tiene valores distintos: -ero forma gentilicios (madrileño → madri-leño), agentes (cartero), instrumentos (lavadero) y lugares (lavadero) → el contexto determina la lectura"
        rationale: "Polisemia sufijal: -ero es uno de los sufijos más polisémicos del español → la interpretación depende de la base y del contexto semántico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué morfema comparte 'fotosíntesis', 'fotografía' y 'fotocopia'? (foto como sufijo/el morfema culto griego foto- (φῶς, luz): en cada compuesto contribuye el sema 'luz' → las tres palabras involucran la luz en su proceso o producción/foto como apócope)"
        correctAnswer: "el morfema culto griego foto- (φῶς, luz): en cada compuesto contribuye el sema 'luz' → las tres palabras involucran la luz en su proceso o producción"
        rationale: "Morfemas cultos grecolatinos: foto- (luz), bio- (vida), geo- (tierra) → constituyen la base de la terminología científica internacional."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
