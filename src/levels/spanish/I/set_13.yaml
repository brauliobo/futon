pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El siglo XX latinoamericano estuvo marcado por revoluciones, dictaduras y la búsqueda de la autonomía frente a la hegemonía estadounidense. La Revolución Mexicana (1910-1920) fue la primera gran revolución social del siglo: derrocó la dictadura de Porfirio Díaz y produjo la Constitución de 1917, que incorporó derechos sociales y laborales pioneros. La Revolución Cubana (1959) bajo Fidel Castro estableció el primer Estado socialista del hemisferio occidental e intensificó la tensión de la Guerra Fría en la región: la Crisis de los Misiles (1962) llevó al mundo al borde de la guerra nuclear. La Doctrina Monroe ('América para los americanos') fue invocada por EE.UU. para justificar intervenciones en Guatemala (1954), República Dominicana (1965) y Chile (1973), donde el golpe militar de Pinochet derrocó al presidente socialista Salvador Allende. El populismo latinoamericano tuvo exponentes como Juan Domingo Perón en Argentina (peronismo) y Getúlio Vargas en Brasil, quienes construyeron alianzas entre el Estado, los trabajadores y las élites industriales. Las décadas de 1960-1980 vieron proliferar dictaduras militares en Argentina, Brasil, Chile, Uruguay y Paraguay, muchas vinculadas a la Operación Cóndor, una red de coordinación represiva con apoyo de la CIA. La Teología de la Liberación (Gustavo Gutiérrez) ofreció una respuesta religiosa a la injusticia social. Los años 1980-1990 trajeron la democratización y los programas de ajuste estructural del FMI, que generaron crisis sociales. El 'giro a la izquierda' de los años 2000 (Chávez, Lula, Morales, Correa) representó una nueva ola de gobiernos progresistas."
