pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La crisis financiera global de 2008 fue la mayor desde la Gran Depresión de 1929. Sus orígenes se encuentran en el mercado inmobiliario estadounidense, donde la expansión de las hipotecas subprime (préstamos de alto riesgo a personas con escasa solvencia) fue acompañada por la titulización: los bancos empaquetaban estas hipotecas en instrumentos financieros complejos (CDO: Collateralized Debt Obligations) y los vendían a inversores de todo el mundo, dispersando el riesgo pero también opacando su magnitud real. Cuando los precios inmobiliarios cayeron y los prestatarios comenzaron a incumplir sus pagos, el valor de estos instrumentos se desplomó. La quiebra de Lehman Brothers en septiembre de 2008 desencadenó un pánico global. Los gobiernos respondieron con rescates bancarios (bailouts), programas de estímulo fiscal y políticas de tipos de interés cero o negativos (quantitative easing). El Fondo Monetario Internacional (FMI) y el Banco Mundial coordinaron la respuesta internacional. Las consecuencias incluyeron recesiones globales, desempleo masivo, austeridad presupuestaria en Europa y el surgimiento de movimientos de protesta (los Indignados en España, Occupy Wall Street en EE.UU.). La crisis reveló las debilidades de la autorregulación financiera y dio lugar a reformas regulatorias como la ley Dodd-Frank en EE.UU. y las nuevas normas de Basilea III para la solvencia bancaria."
    exercises:
