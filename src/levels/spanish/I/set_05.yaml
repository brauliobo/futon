authorNotes: "Texto expositivo sobre la crisis financiera de 2008: causas, mecanismos, consecuencias y reformas del sistema financiero internacional."
example: "hipotecas subprime → titulización (CDO/MBS) → burbuja inmobiliaria EE.UU. → quiebra Lehman Brothers (2008) → contagio global → rescates bancarios → austeridad/expansión fiscal → QE bancos centrales → desempleo masivo → regulación Dodd-Frank/Basilea III → debate: austeridad (FMI) vs. estímulo (Keynesianismo)."
