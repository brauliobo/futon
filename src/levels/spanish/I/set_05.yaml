        correctAnswer: las hipotecas subprime y la titulización de instrumentos financieros complejos en EE.UU.
        rationale: "El texto: 'Sus orígenes se encuentran en el mercado inmobiliario estadounidense... hipotecas subprime... titulización... CDO'."
        difficulty: 5
        objectives: [es.pre_reading]
