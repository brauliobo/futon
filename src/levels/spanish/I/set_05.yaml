        correctAnswer: instrumentos financieros complejos que empaquetaban hipotecas subprime y se vendían a inversores internacionales
        rationale: "El texto: 'los bancos empaquetaban estas hipotecas en instrumentos financieros complejos (CDO) y los vendían a inversores de todo el mundo'."
