authorNotes: "Texto expositivo sobre mecánica cuántica: principio de incertidumbre, dualidad onda-partícula, superposición, entrelazamiento cuántico, interpretaciones de la mecánica cuántica e implicaciones filosóficas."
example: "física cuántica → dualidad onda-partícula → principio de incertidumbre Heisenberg → superposición (gato de Schrödinger) → entrelazamiento → colapso de la función de onda → interpretación de Copenhague vs. muchos mundos (Everett) → implicación: la realidad es probabilística, no determinista."
