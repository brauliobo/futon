pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La mecánica cuántica, formulada en los años 1920 por Heisenberg, Schrödinger, Bohr y Dirac entre otros, describe el comportamiento de la materia y la energía a escala subatómica. A diferencia de la física clásica, que predice trayectorias deterministas, la mecánica cuántica es probabilística: solo puede predecir la probabilidad de los resultados de las mediciones. El principio de incertidumbre de Heisenberg establece que es imposible conocer simultáneamente con precisión arbitraria la posición y el momento de una partícula: cuanto más precisamente se mide una, más imprecisa se vuelve la otra. La dualidad onda-partícula implica que los objetos cuánticos (fotones, electrones) se comportan como ondas o como partículas según cómo se los observe (experimento de la doble rendija). El principio de superposición establece que un sistema cuántico puede existir en múltiples estados simultáneamente hasta que es observado (medido); la observación colapsa la función de onda a un estado definido. El entrelazamiento cuántico (Einstein lo llamó 'acción fantasmal a distancia') conecta dos partículas de modo que el estado de una determina instantáneamente el estado de la otra, independientemente de la distancia. Las interpretaciones son múltiples: Copenhague (Bohr): la función de onda no describe la realidad sino lo que podemos saber; muchos mundos (Everett): cada medición produce una bifurcación del universo; realismo de variables ocultas (Bohm). Las aplicaciones incluyen los ordenadores cuánticos, la criptografía cuántica y los láser."
