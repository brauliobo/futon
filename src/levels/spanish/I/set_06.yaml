title: Gramática - Análisis Crítico del Discurso (ACD)
level: I
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Análisis Crítico del Discurso (ACD): Fairclough, van Dijk, Wodak. El discurso como práctica social. Poder, ideología e identidad en el discurso. Estrategias discursivas de legitimación/deslegitimación. Nominalización y pasivización para ocultar la agencia. Representación de los actores sociales (van Leeuwen). Discurso racista, sexista, político. Análisis de noticias. Intertextualidad. Recontextualización. Marco (framing). Metáforas conceptuales con función ideológica."
example: "nominalización que oculta agencia → 'Se produjeron detenciones' (en vez de 'La policía detuvo a manifestantes'). pasivización → 'Los manifestantes fueron dispersados'. metáfora ideológica → 'Los inmigrantes invaden el país' (metáfora bélica). framing → 'conflicto de trabajo' vs. 'huelga': mismo evento, marcos distintos. representación de actores → categorización, funcionalización, exclusión. legitimación → apelación a la autoridad, a la ley, a lo natural."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Análisis Crítico del Discurso - Conceptos
    description: Identifica los conceptos y estrategias del ACD.
    exercises:
      - type: grammar
        question: "¿Qué es el Análisis Crítico del Discurso (ACD)? (el análisis gramatical de textos/enfoque que estudia cómo el lenguaje reproduce, ejerce y legitima el poder, la ideología y las desigualdades sociales/el análisis literario)"
        correctAnswer: enfoque que estudia cómo el lenguaje reproduce, ejerce y legitima el poder, la ideología y las desigualdades sociales
        rationale: "ACD (Fairclough, van Dijk, Wodak): el lenguaje no es neutral → los textos reproducen relaciones de poder y construyen identidades sociales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo usa la nominalización el discurso para ocultar la agencia? ('Se produjeron detenciones' oculta quién detuvo a quién/convirtiendo acciones en entidades nominales ('detenciones') se elimina el agente y el paciente → la responsabilidad desaparece/usando verbos en activo)"
        correctAnswer: convirtiendo acciones en entidades nominales ('detenciones') se elimina el agente y el paciente → la responsabilidad desaparece
        rationale: "ACD: nominalización = estrategia de opacidad agencial → 'Se produjeron detenciones' vs. 'La policía detuvo a 200 manifestantes'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'framing' o encuadre en el análisis del discurso? (el diseño de la página/la perspectiva desde la que se presenta un evento, que activa determinados esquemas cognitivos y valoraciones: 'conflicto laboral' vs. 'huelga' vs. 'paro patronal'/la estructura retórica)"
        correctAnswer: "la perspectiva desde la que se presenta un evento, que activa determinados esquemas cognitivos y valoraciones: 'conflicto laboral' vs. 'huelga' vs. 'paro patronal'"
        rationale: "Framing (Goffman, Lakoff): las palabras que se eligen para nombrar un evento activan marcos cognitivos que orientan la interpretación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué función ideológica tienen las metáforas conceptuales en el discurso político? (ninguna/organizan la comprensión de fenómenos sociales según esquemas de dominio: 'los inmigrantes invaden' (metáfora bélica) construye una amenaza; 'los inmigrantes enriquecen' (metáfora económica) construye un aporte/solo tienen función estética)"
        correctAnswer: "organizan la comprensión de fenómenos sociales según esquemas de dominio: 'los inmigrantes invaden' (metáfora bélica) construye una amenaza; 'los inmigrantes enriquecen' (metáfora económica) construye un aporte"
        rationale: "Lakoff y Johnson + ACD: las metáforas no son neutras → 'la economía como guerra' o 'la economía como juego' generan políticas distintas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la representación de actores sociales en el discurso (van Leeuwen)? (la descripción física/el análisis de cómo el texto incluye, excluye, categoriza y evalúa a los participantes sociales: personalización vs. impersonalización, activación vs. pasivización/la narración)"
        correctAnswer: "el análisis de cómo el texto incluye, excluye, categoriza y evalúa a los participantes sociales: personalización vs. impersonalización, activación vs. pasivización"
        rationale: "Van Leeuwen: la representación no es neutral → 'personas sin techo' (personalizado) vs. 'el problema de la indigencia' (impersonalizado e impasivizado)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la legitimación discursiva? (un tipo de cita académica/estrategia por la que el discurso justifica prácticas, decisiones o ideologías apelando a la autoridad, la ley, la moral o la naturaleza: 'es lo que manda la ley', 'es lo natural', 'los expertos dicen'/un tipo de conectivo)"
        correctAnswer: "estrategia por la que el discurso justifica prácticas, decisiones o ideologías apelando a la autoridad, la ley, la moral o la naturaleza: 'es lo que manda la ley', 'es lo natural', 'los expertos dicen'"
        rationale: "Legitimación (van Leeuwen): tipos → autorización (autoridad), racionalización (razón/funcionalidad), evaluación moral, naturalización."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la recontextualización en el ACD? (la corrección del texto/el proceso por el que prácticas o discursos de un ámbito se trasladan a otro contexto con transformaciones: un informe médico recontextualizado en un artículo periodístico cambia su orientación/un tipo de cita)"
        correctAnswer: "el proceso por el que prácticas o discursos de un ámbito se trasladan a otro contexto con transformaciones: un informe médico recontextualizado en un artículo periodístico cambia su orientación"
        rationale: "Recontextualización (Bernstein, Fairclough): la misma información cambia de significado al pasar de su contexto original a otro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la tesis central de van Dijk sobre el racismo en el discurso? (que el racismo desapareció/que el racismo de élite se reproduce principalmente a través del discurso institucional y mediático, no solo a través de actitudes individuales/que el lenguaje no afecta a las actitudes)"
        correctAnswer: que el racismo de élite se reproduce principalmente a través del discurso institucional y mediático, no solo a través de actitudes individuales
        rationale: "Van Dijk: 'Ideología y discurso' → el racismo se reproduce en las noticias, los textos educativos, el discurso político → poder simbólico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué revelan las elecciones léxicas en el discurso político? (nada relevante/que el léxico no es neutral: 'terrorista'/'guerrillero'/'combatiente por la libertad' describen la misma persona desde perspectivas ideológicas distintas/solo el registro del hablante)"
        correctAnswer: "que el léxico no es neutral: 'terrorista'/'guerrillero'/'combatiente por la libertad' describen la misma persona desde perspectivas ideológicas distintas"
        rationale: "ACD: la selección léxica refleja posicionamiento ideológico → el análisis del léxico revela la perspectiva del productor del texto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la intertextualidad manifiesta en el ACD? (citar textos clásicos/la presencia visible de otros textos dentro de un texto (citas directas, referencias explícitas) que configuran sus significados/la coherencia temática)"
        correctAnswer: la presencia visible de otros textos dentro de un texto (citas directas, referencias explícitas) que configuran sus significados
        rationale: "Intertextualidad manifiesta (Fairclough): las voces de otros textos aparecen explícitamente → qué textos se citan y cómo revela ideología."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Aplicación del ACD a Textos Reales
    description: Aplica el Análisis Crítico del Discurso a fragmentos textuales.
    exercises:
      - type: grammar
        question: "En 'La seguridad de los ciudadanos exige medidas duras', ¿qué estrategia discursiva se usa? (argumento de analogía/legitimación por racionalización: 'la seguridad' (valor positivo) justifica 'medidas duras' (potencialmente represivas)/un argumento de autoridad)"
        correctAnswer: "legitimación por racionalización: 'la seguridad' (valor positivo) justifica 'medidas duras' (potencialmente represivas)"
        rationale: "Legitimación por racionalización: el foco en el objetivo positivo ('seguridad') legitima los medios que de otro modo se cuestionarían."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el ACD considera que la objetividad periodística es un ideal ideológico? (porque los periodistas mienten/porque la selección de fuentes, el ángulo, el encuadre y el léxico siempre implican posicionamiento → la 'objetividad' puede ocultar la perspectiva del productor/porque la objetividad es imposible técnicamente)"
        correctAnswer: porque la selección de fuentes, el ángulo, el encuadre y el léxico siempre implican posicionamiento → la 'objetividad' puede ocultar la perspectiva del productor
        rationale: "ACD: la pretensión de objetividad es en sí misma un recurso ideológico → el análisis crítico la deconstruye."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los inmigrantes llegan en masa.' ¿Qué estrategia discursiva opera? (eufemismo/la metáfora cuantitativa ('en masa') implica pérdida de control e impersonaliza a los individuos → estrategia de deshumanización/un argumento de autoridad)"
        correctAnswer: la metáfora cuantitativa ('en masa') implica pérdida de control e impersonaliza a los individuos → estrategia de deshumanización
        rationale: "ACD: 'llegar en masa' trata a personas como una sustancia incontrolable → activa el marco de la amenaza y la invasión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el ACD del análisis lingüístico convencional? (no hay diferencia/el ACD no se limita a describir el lenguaje, sino que analiza sus relaciones con el poder social y tiene un compromiso ético con el cambio → es crítico y político/el ACD es solo cuantitativo)"
        correctAnswer: el ACD no se limita a describir el lenguaje, sino que analiza sus relaciones con el poder social y tiene un compromiso ético con el cambio → es crítico y político
        rationale: "ACD: el analista no es neutral → su trabajo es exponer las relaciones de poder y contribuir a la emancipación de los grupos marginados."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el discurso hegemónico en el ACD? (el discurso académico/el discurso de los grupos dominantes que se presenta como natural, evidente y universal, naturalizando relaciones de poder y silenciando alternativas/el discurso científico)"
        correctAnswer: el discurso de los grupos dominantes que se presenta como natural, evidente y universal, naturalizando relaciones de poder y silenciando alternativas
        rationale: "Hegemonía (Gramsci → Fairclough): el poder se ejerce también discursivamente → el consentimiento se manufactura haciendo lo dominante parecer 'sentido común'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo revela la ACD el sesgo de género en los textos? (analizando solo la morfología/analizando las representaciones de las mujeres y los hombres: asimetría léxica ('soltero'/'solterona'), pasivización de las mujeres, invisibilidad como sujetos activos/solo en la literatura)"
        correctAnswer: "analizando las representaciones de las mujeres y los hombres: asimetría léxica ('soltero'/'solterona'), pasivización de las mujeres, invisibilidad como sujetos activos"
        rationale: "Análisis de género (Wodak, Mills): el discurso construye las identidades de género → asimetrías léxicas y representacionales revelan la ideología patriarcal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la orden discursiva (order of discourse) para Fairclough? (el orden de los párrafos/el conjunto de convenciones discursivas disponibles en un campo social (salud, educación, política): cada campo tiene sus géneros, estilos y discursos legitimados/la jerarquía gramatical)"
        correctAnswer: "el conjunto de convenciones discursivas disponibles en un campo social (salud, educación, política): cada campo tiene sus géneros, estilos y discursos legitimados"
        rationale: "Orden discursiva: cada institución genera convenciones sobre cómo hablar/escribir → salirse del orden es un acto de resistencia discursiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la crítica que recibe el ACD como metodología? (que es demasiado superficial/que puede ser circular: el analista selecciona ejemplos que confirman su hipótesis ideológica y su posicionamiento puede contaminar el análisis/que no analiza el lenguaje real)"
        correctAnswer: "que puede ser circular: el analista selecciona ejemplos que confirman su hipótesis ideológica y su posicionamiento puede contaminar el análisis"
        rationale: "Crítica al ACD: riesgo de cherry-picking (selección interesada) → la réplica del ACD es que toda investigación lingüística tiene un posicionamiento implícito."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la agencia en el discurso y cómo se puede ocultar? (el autor del texto/la capacidad de actuar de un participante: se oculta mediante la pasiva ('fue detenido'), la nominalización ('se produjeron detenciones') o la omisión del agente ('la situación empeoró')/el registro formal)"
        correctAnswer: "la capacidad de actuar de un participante: se oculta mediante la pasiva ('fue detenido'), la nominalización ('se produjeron detenciones') o la omisión del agente ('la situación empeoró')"
        rationale: "ACD: la agencia discursiva → quién hace qué a quién. Ocultarla protege a los responsables y naturaliza los procesos como inevitables."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan el discurso, la práctica social y la estructura social en el modelo de Fairclough? (no se relacionan/el texto es una práctica discursiva que reproduce o transforma las prácticas sociales, que a su vez están determinadas por estructuras sociales (clase, género, etnia)/el texto solo refleja la realidad)"
        correctAnswer: el texto es una práctica discursiva que reproduce o transforma las prácticas sociales, que a su vez están determinadas por estructuras sociales (clase, género, etnia)
        rationale: "Modelo tridimensional de Fairclough: texto ↔ práctica discursiva ↔ práctica social → el lenguaje tiene agencia social, no es solo un espejo."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
