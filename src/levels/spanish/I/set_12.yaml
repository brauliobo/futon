title: 🔬 Gramática - Fonología Generativa y Prosodía
level: I
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Fonología generativa: reglas fonológicas, rasgos distintivos (Chomsky y Halle). Fonología no lineal: autosegmental, métrica, léxica. Sílaba: onset, núcleo, coda; peso silábico. Acento en español: patrones léxicos y regla de acentuación. Entonación: curvas melódicas, tonemas, grupos entonacionales. Alternancia vocálica. Procesos fonológicos: asimilación, elisión, epéntesis, metátesis. Fonotáctica del español."
example: "rasgo distintivo → [±sonoro], [±nasal], [±continuo]: '/p/ vs. /b/' → [−sonoro] vs. [+sonoro] → par mínimo. acento en español → regla: si la palabra termina en vocal, /n/ o /s/ → el acento cae en la penúltima sílaba (llana); si termina en consonante distinta → en la última (aguda); la tilde marca las excepciones. sílaba → 'trans-por-te': coda compleja en primera sílaba (ns). asimilación nasal → 'un barco' → [um_barko]: la nasal asimila el punto de articulación de /b/ → bilabial."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Fonología Generativa y Estructura Prosódica
    description: Identifica los conceptos de la fonología generativa y la organización prosódica.
    exercises:
      - type: grammar
        question: "¿Qué son los rasgos distintivos en fonología? (los sonidos del idioma/propiedades binarias ([±sonoro], [±nasal]) que distinguen fonemas: /p/ es [−sonoro] y /b/ es [+sonoro] → un solo rasgo diferencia ambos fonemas/las letras del alfabeto)"
        correctAnswer: "propiedades binarias ([±sonoro], [±nasal]) que distinguen fonemas: /p/ es [−sonoro] y /b/ es [+sonoro] → un solo rasgo diferencia ambos fonemas"
        rationale: "Rasgos distintivos (Chomsky y Halle, SPE 1968): los fonemas son haces de rasgos → las reglas fonológicas operan sobre rasgos, no sobre símbolos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la estructura interna de la sílaba en fonología? (vocal + consonantes/onset (ataque) + rima; la rima se divide en núcleo (vocal) + coda: 'sol' → onset /s/, núcleo /o/, coda /l/; el peso silábico depende de la rima/consonante + vocal + consonante)"
        correctAnswer: "onset (ataque) + rima; la rima se divide en núcleo (vocal) + coda: 'sol' → onset /s/, núcleo /o/, coda /l/; el peso silábico depende de la rima"
        rationale: "Sílaba: estructura jerarquizada → el onset no afecta al peso; la rima sí → las sílabas pesadas (con coda o vocal larga) atraen el acento en muchas lenguas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la regla de acentuación por defecto del español para palabras llanas? (acento en la última sílaba/si la palabra termina en vocal, /n/ o /s/, el acento recae en la penúltima sílaba sin necesidad de tilde: 'casa', 'comen', 'casas'/acento siempre en la antepenúltima)"
        correctAnswer: "si la palabra termina en vocal, /n/ o /s/, el acento recae en la penúltima sílaba sin necesidad de tilde: 'casa', 'comen', 'casas'"
        rationale: "Regla del español: penúltima si termina en vocal/n/s (llana) → última si termina en otra consonante (aguda) → la tilde marca las excepciones a la regla."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la asimilación nasal en español? (un error de pronunciación/proceso fonológico por el que la nasal adopta el punto de articulación de la consonante siguiente: 'un barco' → [um barko] (bilabial ante bilabial)/la nasalización de vocales)"
        correctAnswer: "proceso fonológico por el que la nasal adopta el punto de articulación de la consonante siguiente: 'un barco' → [um barko] (bilabial ante bilabial)"
        rationale: "Asimilación: la nasal /n/ es arquifonema en posición de coda → su realización depende de la consonante siguiente → proceso sistemático, no error."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué estudia la fonología autosegmental? (solo las vocales/las representaciones fonológicas como múltiples niveles (tiers) independientes que se alinean: el tono en lenguas tonales puede separarse de los segmentos → permite explicar procesos como la nasalización a distancia/la sintaxis)"
        correctAnswer: "las representaciones fonológicas como múltiples niveles (tiers) independientes que se alinean: el tono en lenguas tonales puede separarse de los segmentos → permite explicar procesos como la nasalización a distancia"
        rationale: "Fonología autosegmental: el tono, el rasgo nasal, el punto de articulación son tiers independientes → la asociación entre tiers explica los procesos a distancia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la epéntesis vocálica en español? (la pérdida de una vocal/la inserción de una vocal para reparar grupos consonánticos no permitidos por la fonotáctica: 'street' → 'estreet' al adaptarse al español (el español no permite /st/ inicial)/la alternancia vocálica)"
        correctAnswer: "la inserción de una vocal para reparar grupos consonánticos no permitidos por la fonotáctica: 'street' → 'estreet' al adaptarse al español (el español no permite /st/ inicial)"
        rationale: "Epéntesis: proceso de reparación fonotáctica → el español añade /e/ ante /sC/ inicial → todos los préstamos con /st-/ inicial reciben la /e/ epentética."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el tonema en el análisis de la entonación española? (un error de pronunciación/un tipo de tono musical/el movimiento tonal final del grupo entonacional: tonema descendente → declarativo o imperativo; tonema ascendente → interrogativa total; suspendido → continuación)"
        correctAnswer: "el movimiento tonal final del grupo entonacional: tonema descendente → declarativo o imperativo; tonema ascendente → interrogativa total; suspendido → continuación"
        rationale: "Tonema: la entonación española usa el movimiento final del grupo tonal para señalar el tipo de modalidad oracional → relevante para la didáctica de E/LE."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la fonotáctica? (la fonética acústica/el conjunto de restricciones sobre las combinaciones de sonidos permitidas en una lengua: el español permite /bl/ inicial pero no /bn/; permite /str/ en interior de palabra pero no al inicio/el inventario fonémico)"
        correctAnswer: "el conjunto de restricciones sobre las combinaciones de sonidos permitidas en una lengua: el español permite /bl/ inicial pero no /bn/; permite /str/ en interior de palabra pero no al inicio"
        rationale: "Fonotáctica: las restricciones varían entre lenguas → explica las adaptaciones de préstamos y los errores de los aprendices de L2."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la alternancia vocálica en morfología fonológica? (la vocal tónica cambia de clase/el proceso por el que la vocal del radical cambia sistemáticamente al alternar sílaba tónica/átona: 'poder' → 'puedo/podemos' (o→ue en tónica); 'pedir' → 'pido/pedimos' (e→i)/un cambio histórico)"
        correctAnswer: "el proceso por el que la vocal del radical cambia sistemáticamente al alternar sílaba tónica/átona: 'poder' → 'puedo/podemos' (o→ue en tónica); 'pedir' → 'pido/pedimos' (e→i)"
        rationale: "Alternancia vocálica: herencia de la diptongación medieval (o→ue, e→ie) condicionada por el acento → los verbos irregulares del español siguen este patrón."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un par mínimo y qué demuestra en fonología? (dos palabras con significados iguales/dos palabras que difieren solo en un segmento en la misma posición: 'paso/baso' → demuestra que /p/ y /b/ son fonemas distintos en español/dos palabras con igual pronunciación)"
        correctAnswer: "dos palabras que difieren solo en un segmento en la misma posición: 'paso/baso' → demuestra que /p/ y /b/ son fonemas distintos en español"
        rationale: "Par mínimo: criterio diagnóstico del estatus fonémico → si el cambio de un sonido produce cambio de significado → son fonemas distintos."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Aplicación Fonológica
    description: Aplica los conceptos fonológicos al análisis de fenómenos del español.
    exercises:
      - type: grammar
        question: "¿Por qué 'perro' y 'pero' son un par mínimo en español? (porque son sinónimos/porque difieren solo en la cantidad de vibraciones de /r/ vs. /ɾ/ → demuestra que la vibrante múltiple y la simple son fonemas distintos en español/porque tienen distinto número de sílabas)"
        correctAnswer: porque difieren solo en la cantidad de vibraciones de /r/ vs. /ɾ/ → demuestra que la vibrante múltiple y la simple son fonemas distintos en español
        rationale: "Par mínimo con vibrantes: el español es tipológicamente inusual en distinguir /r/ (múltiple) y /ɾ/ (simple) como fonemas diferentes → muchas lenguas tienen solo una."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'sílabas esdrújulas' llevan siempre tilde? (porque son palabras largas/por convención estética/porque violan la regla de acentuación por defecto del español: el acento en la antepenúltima nunca es el esperado por las reglas → siempre requiere marca gráfica)"
        correctAnswer: "porque violan la regla de acentuación por defecto del español: el acento en la antepenúltima nunca es el esperado por las reglas → siempre requiere marca gráfica"
        rationale: "Esdrújulas: las reglas del español predicen llana o aguda → cualquier acento en antepenúltima es excepción → tilde obligatoria."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué proceso fonológico ocurre en 'desde' → [dezðe] en habla rápida? (elisión/sonorización de /s/ ante /d/: la /s/ se vuelve [z] por asimilación al rasgo [+sonoro] de la /d/ siguiente → proceso de asimilación regresiva/metátesis)"
        correctAnswer: "sonorización de /s/ ante /d/: la /s/ se vuelve [z] por asimilación al rasgo [+sonoro] de la /d/ siguiente → proceso de asimilación regresiva"
        rationale: "Asimilación regresiva: la consonante precedente asimila rasgos de la siguiente → sistemático en español en grupos /sC[+sonoro]/."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la sinalefa y por qué es relevante en la métrica española? (un error de pronunciación/la fusión de la vocal final de una palabra con la vocal inicial de la siguiente en una sola sílaba: 'mi_amor' → una sílaba → permite que los versos cumplan el cómputo silábico/un tipo de rima)"
        correctAnswer: "la fusión de la vocal final de una palabra con la vocal inicial de la siguiente en una sola sílaba: 'mi_amor' → una sílaba → permite que los versos cumplan el cómputo silábico"
        rationale: "Sinalefa: proceso prosódico fundamental en español → el cómputo métrico del endecasílabo y del octosílabo requiere conocer las reglas de sinalefa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el español no distingue fonémicamente el acento de cantidad (larga/breve)? (porque es reciente/porque el latín sí tenía cantidad vocálica, pero en la evolución al español se perdió; lo que quedó fue el acento tónico (intensidad) como rasgo suprasegmental distintivo/porque las vocales son todas iguales)"
        correctAnswer: porque el latín sí tenía cantidad vocálica, pero en la evolución al español se perdió; lo que quedó fue el acento tónico (intensidad) como rasgo suprasegmental distintivo
        rationale: "Diacronía: el latín distinguía vocales largas/breves → el español perdió esta distinción y conservó solo el acento de intensidad → la vocal tónica puede ser breve o larga."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué explica la fonología de la optimalidad (OT) sobre los procesos fonológicos? (que los sonidos son aleatorios/que las formas superficiales son el resultado de la jerarquía de restricciones universales violables: la forma óptima viola las restricciones menos importantes/que las reglas son absolutas)"
        correctAnswer: "que las formas superficiales son el resultado de la jerarquía de restricciones universales violables: la forma óptima viola las restricciones menos importantes"
        rationale: "Teoría de la optimalidad (Prince y Smolensky): las restricciones son universales pero su jerarquía varía entre lenguas → explica la variación tipológica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la /d/ intervocálica española se aproxima a [ð] en habla estándar? (por influencia del inglés/por lenición: las oclusivas sonoras entre vocales se debilitan a aproximantes → proceso sistemático en español estándar; en habla rápida puede elidirse completamente/por error)"
        correctAnswer: "por lenición: las oclusivas sonoras entre vocales se debilitan a aproximantes → proceso sistemático en español estándar; en habla rápida puede elidirse completamente"
        rationale: "Lenición: /b, d, g/ → [β, ð, ɣ] entre vocales → proceso categórico en español → la /d/ final puede elidirse: 'comido' → [ko.ˈmio]."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el acento primario del secundario en palabras compuestas? (solo las palabras largas tienen secundario/el primario recae en el núcleo semántico principal; el secundario aparece en el primer elemento de compuestos: 'lavaplatos' → [ˈlaβa.ˈplatos]: dos acentos/solo hay acento primario)"
        correctAnswer: "el primario recae en el núcleo semántico principal; el secundario aparece en el primer elemento de compuestos: 'lavaplatos' → [ˈlaβa.ˈplatos]: dos acentos"
        rationale: "Acento secundario: en compuestos y palabras derivadas largas → la fonología métrica predice la distribución de acentos primarios y secundarios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el yeísmo y cómo afecta al sistema fonológico del español? (un acento regional/la fusión de /ʎ/ (elle) y /ʝ/ (ye) en un solo fonema → el español yeísta ha perdido la distinción; genera homofonías: 'pollo/poyo' suenan igual/un error ortográfico)"
        correctAnswer: "la fusión de /ʎ/ (elle) y /ʝ/ (ye) en un solo fonema → el español yeísta ha perdido la distinción; genera homofonías: 'pollo/poyo' suenan igual"
        rationale: "Yeísmo: cambio en progreso → ya mayoritario en el mundo hispanohablante; el español de España centro-norte mantiene la distinción pero cede terreno."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre un alófono y un fonema? (son sinónimos/el fonema es la unidad abstracta que distingue significados (/p/ vs. /b/); el alófono es una realización fonética concreta, complementaria o libre, que no distingue significados ([p] vs. [ph] en español son alófonos de /p/)/el alófono es un error)"
        correctAnswer: el fonema es la unidad abstracta que distingue significados (/p/ vs. /b/); el alófono es una realización fonética concreta, complementaria o libre, que no distingue significados ([p] vs. [ph] en español son alófonos de /p/)
        rationale: "Fonema/alófono: nivel fonológico (abstracto) vs. nivel fonético (concreto) → los alófonos de un fonema están en distribución complementaria o en variación libre."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
