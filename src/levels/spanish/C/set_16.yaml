title: Gramática - Verbos de Cambio
level: C
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Verbos de cambio expresan transformaciones. Ponerse + adj. (cambio físico/emocional repentino): ponerse rojo, triste, enfermo. Quedarse + adj. (resultado de un cambio): quedarse ciego, dormido, sin trabajo. Volverse + adj. (cambio de carácter duradero): volverse agresivo, loco. Hacerse + adj./sust. (cambio voluntario o gradual): hacerse médico, rico, mayor. Llegar a ser + sust./adj. (cambio por esfuerzo): llegar a ser director. Convertirse en + sust. (transformación total): convertirse en un héroe."
example: "emoción repentina → ponerse: se puso nervioso. resultado permanente → quedarse: se quedó sordo. carácter → volverse: se volvió introvertido. profesión voluntaria → hacerse: se hizo abogado."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Elegir el Verbo de Cambio
    description: Elige el verbo de cambio correcto.
    exercises:
      - type: grammar
        question: "'Al ver la nota, ___ pálido.' (cambio físico repentino) (se quedó/se puso/se hizo)"
        correctAnswer: se puso
        rationale: "Cambio físico/emocional súbito → ponerse: se puso pálido."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tras el accidente, ___ cojo.' (resultado permanente) (se puso/se quedó/se volvió)"
        correctAnswer: se quedó
        rationale: "Resultado físico permanente → quedarse: se quedó cojo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Desde que perdió el trabajo, ___ muy pesimista.' (cambio de carácter duradero) (se puso/se quedó/se volvió)"
        correctAnswer: se volvió
        rationale: "Cambio de carácter o actitud duradera → volverse: se volvió pesimista."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estudió mucho y ___ médico.' (cambio voluntario de profesión) (se quedó/se hizo/se puso)"
        correctAnswer: se hizo
        rationale: "Cambio voluntario de rol o profesión → hacerse: se hizo médico."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ en el mejor atleta del país.' (transformación total) (Se convirtió/Se quedó/Se puso)"
        correctAnswer: Se convirtió
        rationale: "Transformación completa en algo diferente → convertirse en."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tras años de esfuerzo, ___ ser directora general.' (logro por esfuerzo) (llegó a/se quedó en/se puso a)"
        correctAnswer: llegó a
        rationale: "Cambio alcanzado mediante esfuerzo → llegar a ser."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Al escuchar la noticia, ___ sin palabras.' (resultado emocional) (se hizo/se quedó/se volvió)"
        correctAnswer: se quedó
        rationale: "Resultado de impacto emocional → quedarse: se quedó sin palabras."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La caterpila ___ en mariposa.' (transformación total de naturaleza) (se puso/se volvió/se convirtió)"
        correctAnswer: se convirtió
        rationale: "Transformación de naturaleza completa → convertirse en."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ rojo de vergüenza.' (cambio de color repentino) (Se quedó/Se volvió/Se puso)"
        correctAnswer: Se puso
        rationale: "Cambio físico repentino → ponerse: se puso rojo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Con los años, ___ más sabio.' (cambio gradual de cualidad) (se puso/se fue haciendo/se quedó)"
        correctAnswer: se fue haciendo
        rationale: "Cambio gradual progresivo → irse + gerundio / hacerse: se fue haciendo más sabio."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Contraste y Uso Correcto
    description: Elige la opción correcta o identifica el matiz.
    exercises:
      - type: grammar
        question: "¿Cuál expresa cambio emocional repentino? (Se hizo triste./Se puso triste./Se quedó triste.)"
        correctAnswer: Se puso triste.
        rationale: "'Ponerse' indica cambio emocional repentino; 'quedarse' enfatiza el estado resultante."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál expresa resultado permanente? (Se puso sordo./Se quedó sordo./Se volvió sordo.)"
        correctAnswer: Se quedó sordo.
        rationale: "'Quedarse' indica el resultado permanente de un cambio."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Se hizo rico' vs 'Se volvió avaro': ¿qué diferencia hay? (hacerse = carácter, volverse = logro/hacerse = logro voluntario, volverse = cambio de carácter/son iguales)"
        correctAnswer: hacerse = logro voluntario, volverse = cambio de carácter
        rationale: "Hacerse: cambio voluntario (riqueza). Volverse: cambio de carácter (avaricia)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Aquella experiencia ___ en una persona más fuerte.' (se lo convirtió/lo convirtió/se convirtió)"
        correctAnswer: lo convirtió
        rationale: "'Convertir a alguien en algo' (transitivo): aquella experiencia lo convirtió en..."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué matiz añade 'llegar a ser' frente a 'hacerse'? (menos esfuerzo/más esfuerzo y logro progresivo/son equivalentes siempre)"
        correctAnswer: más esfuerzo y logro progresivo
        rationale: "'Llegar a ser' enfatiza el camino de esfuerzo hasta alcanzar el estado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ nerviosa antes de hablar en público.' (cambio emocional previo) (Se quedó/Se puso/Se volvió)"
        correctAnswer: Se puso
        rationale: "Estado emocional que aparece en un momento → ponerse."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Después del susto, ___ muy callada.' (reacción duradera) (se puso/se volvió/se quedó)"
        correctAnswer: se quedó
        rationale: "'Quedarse' expresa el estado resultante que persiste tras el susto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige la correcta: ('Se hizo enfermo.'/'Se puso enfermo.'/'Se volvió enfermo.')"
        correctAnswer: Se puso enfermo.
        rationale: "Enfermedad como cambio físico repentino → ponerse enfermo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Con el tiempo, el agua ___ en hielo.' (proceso natural de transformación) (se puso/se convirtió/se volvió)"
        correctAnswer: se convirtió
        rationale: "Transformación de naturaleza → convertirse en: el agua se convirtió en hielo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ millonaria gracias a su trabajo.' (cambio por esfuerzo propio) (Se quedó/Llegó a ser/Se puso)"
        correctAnswer: Llegó a ser
        rationale: "'Llegar a ser' + estado alcanzado por esfuerzo → llegó a ser millonaria."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
