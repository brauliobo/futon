title: 📚 Lectura - La Inteligencia Artificial
level: C
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Texto argumentativo-expositivo sobre tecnología. Vocabulario técnico y social contemporáneo. Identificar argumentos, contraargumentos y la postura del autor."
example: "IA débil (tareas concretas) → aprendizaje automático → redes neuronales → beneficios: medicina/traducción/automatización → riesgos: desempleo/sesgos/vigilancia → tesis del texto → argumentos a favor y en contra → conclusión sobre regulación."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La inteligencia artificial (IA) está transformando nuestra sociedad a una velocidad sin precedentes. Desde los asistentes de voz de los teléfonos hasta los sistemas de diagnóstico médico, la IA está presente en múltiples aspectos de la vida cotidiana. Sus defensores destacan que puede resolver problemas complejos más rápido que los humanos, reducir errores en cirugías y mejorar la eficiencia industrial. Sin embargo, los críticos advierten de riesgos importantes: la automatización podría eliminar millones de empleos, los algoritmos pueden perpetuar sesgos discriminatorios y el control de datos personales plantea graves problemas de privacidad. En el ámbito educativo, algunos profesores temen que los estudiantes utilicen la IA para hacer sus tareas sin aprender. Otros, en cambio, la consideran una herramienta valiosa si se usa con criterio. El debate sigue abierto y la clave, según muchos expertos, está en regular su desarrollo para maximizar sus beneficios y minimizar sus riesgos."
    exercises:
      - type: reading
        question: "¿Qué defienden los partidarios de la IA? (que controla los datos personales/que elimina empleos/que resuelve problemas, reduce errores y mejora la eficiencia)"
        correctAnswer: que resuelve problemas, reduce errores y mejora la eficiencia
        rationale: "El texto: 'puede resolver problemas complejos... reducir errores en cirugías y mejorar la eficiencia'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué riesgo mencionan los críticos sobre el empleo? (los trabajos serán más fáciles/más trabajos bien pagados/la automatización podría eliminar millones de empleos)"
        correctAnswer: la automatización podría eliminar millones de empleos
        rationale: "El texto: 'la automatización podría eliminar millones de empleos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué problema plantean los algoritmos según los críticos? (no funcionan bien en medicina/son muy lentos/pueden perpetuar sesgos discriminatorios)"
        correctAnswer: pueden perpetuar sesgos discriminatorios
        rationale: "El texto: 'los algoritmos pueden perpetuar sesgos discriminatorios'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tema de privacidad se menciona? (el robo de contraseñas/el espionaje gubernamental/el control de datos personales)"
        correctAnswer: el control de datos personales
        rationale: "El texto: 'el control de datos personales plantea graves problemas de privacidad'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué temen algunos profesores? (que los alumnos no tengan ordenador/que usen la IA para hacer tareas sin aprender/que la IA sea cara)"
        correctAnswer: que usen la IA para hacer tareas sin aprender
        rationale: "El texto: 'temen que los estudiantes utilicen la IA para hacer sus tareas sin aprender'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué opinan los profesores que ven la IA de forma positiva en educación? (que debe prohibirse/que es valiosa si se usa con criterio/que sustituirá a los profesores)"
        correctAnswer: que es valiosa si se usa con criterio
        rationale: "El texto: 'la consideran una herramienta valiosa si se usa con criterio'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué proponen los expertos como solución? (prohibir la IA/regular su desarrollo para maximizar beneficios y minimizar riesgos/no hacer nada)"
        correctAnswer: regular su desarrollo para maximizar beneficios y minimizar riesgos
        rationale: "El texto: 'regular su desarrollo para maximizar sus beneficios y minimizar sus riesgos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué ámbitos menciona el texto la IA? (solo en medicina/asistentes de voz, diagnóstico médico, industria y educación/solo en educación)"
        correctAnswer: asistentes de voz, diagnóstico médico, industria y educación
        rationale: "El texto menciona teléfonos, diagnóstico médico, industria y educación."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo describe el texto el ritmo de transformación de la IA? (lento pero seguro/a velocidad sin precedentes/gradual y controlado)"
        correctAnswer: a velocidad sin precedentes
        rationale: "El texto: 'está transformando nuestra sociedad a una velocidad sin precedentes'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Está resuelto el debate sobre la IA según el texto? (sí, los expertos ya tienen solución/no, el debate sigue abierto/sí, se ha regulado)"
        correctAnswer: no, el debate sigue abierto
        rationale: "El texto: 'El debate sigue abierto'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 10
