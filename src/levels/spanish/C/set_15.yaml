title: Lectura - La Revolución Industrial
level: C
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Texto histórico-expositivo. Vocabulario histórico, económico y social. Identificar causas, consecuencias y periodización de un proceso histórico complejo."
example: "Revolución Industrial (Gran Bretaña, 1760-1840) → causas: carbón/hierro/máquina de vapor → innovaciones: telar mecánico/ferrocarril → consecuencias: urbanización/burguesía/proletariado → expansión a Europa/EE.UU. (s. XIX) → 2ª RI: electricidad/petróleo/acero (1870-1914)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La Revolución Industrial fue un proceso de transformación económica, tecnológica y social que comenzó en Gran Bretaña alrededor de 1760 y se extendió por Europa y América a lo largo del siglo XIX. Se caracterizó por la sustitución del trabajo manual por el trabajo de las máquinas, el uso masivo del carbón como fuente de energía y la aparición de la fábrica como nuevo centro de producción. La invención de la máquina de vapor por James Watt en 1769 fue un hito fundamental: permitió mecanizar la producción textil y el transporte ferroviario. Las consecuencias sociales fueron profundas: surgió la clase obrera, las ciudades crecieron enormemente y las condiciones laborales eran muy duras, con jornadas de más de doce horas y trabajo infantil. Estas condiciones llevaron al surgimiento del movimiento obrero y de los primeros sindicatos. La Segunda Revolución Industrial, a partir de 1870, se caracterizó por el uso de la electricidad y del petróleo como nuevas fuentes de energía."
    exercises:
      - type: reading
        question: "¿Dónde comenzó la Revolución Industrial? (Francia/Alemania/Gran Bretaña)"
        correctAnswer: Gran Bretaña
        rationale: "El texto: 'comenzó en Gran Bretaña'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo comenzó aproximadamente? (1660/1760/1860)"
        correctAnswer: 1760
        rationale: "El texto: 'alrededor de 1760'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué sustituyó el trabajo manual? (el trabajo animal/el trabajo de las máquinas/el trabajo extranjero)"
        correctAnswer: el trabajo de las máquinas
        rationale: "El texto: 'la sustitución del trabajo manual por el trabajo de las máquinas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué fuente de energía se usó masivamente? (el petróleo/la electricidad/el carbón)"
        correctAnswer: el carbón
        rationale: "El texto: 'el uso masivo del carbón como fuente de energía'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién inventó la máquina de vapor y en qué año? (Thomas Edison, 1879/James Watt, 1769/Robert Stevenson, 1825)"
        correctAnswer: James Watt, 1769
        rationale: "El texto: 'La invención de la máquina de vapor por James Watt en 1769'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué nuevo espacio de producción apareció? (el taller/la fábrica/el almacén)"
        correctAnswer: la fábrica
        rationale: "El texto: 'la aparición de la fábrica como nuevo centro de producción'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué clase social surgió con la Revolución Industrial? (la burguesía/el campesinado/la clase obrera)"
        correctAnswer: la clase obrera
        rationale: "El texto: 'surgió la clase obrera'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas horas duraban las jornadas laborales? (más de ocho horas/más de doce horas/más de catorce horas)"
        correctAnswer: más de doce horas
        rationale: "El texto: 'jornadas de más de doce horas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué provocaron las malas condiciones laborales? (guerras/el surgimiento del movimiento obrero y los primeros sindicatos/revoluciones políticas)"
        correctAnswer: el surgimiento del movimiento obrero y los primeros sindicatos
