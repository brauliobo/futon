authorNotes: "Texto expositivo-histórico. Vocabulario de historia y alimentación. Identificar causas, consecuencias, fechas y datos precisos en un texto informativo complejo."
example: "chocolate → origen: México/cacao maya y azteca → llegada a Europa (s. XVI) → primero bebida amarga → azúcar añadido en España → extensión por Europa (s. XVII) → industrialización (s. XIX): Cadbury/Nestlé → hoy: 7 millones de toneladas/año."
