pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El chocolate tiene su origen en Mesoamérica, donde los mayas y aztecas cultivaban el cacao hace más de tres mil años. Lo llamaban 'xocolatl' y lo consumían como bebida amarga mezclada con especias. Los aztecas consideraban el cacao tan valioso que lo usaban como moneda. Hernán Cortés llegó a México en 1519 y llevó el cacao a España, donde se comenzó a mezclar con azúcar y canela para suavizar su amargor. Durante el siglo XVII el chocolate se extendió por toda Europa, pero durante mucho tiempo solo lo consumía la nobleza, ya que era muy caro. En 1828 el holandés Coenraad van Houten inventó el proceso para separar la manteca de cacao del polvo, lo que permitió crear el chocolate sólido. En 1847 la empresa inglesa Fry & Sons fabricó la primera tableta de chocolate. Hoy, el principal productor mundial de cacao es Costa de Marfil."
