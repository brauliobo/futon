title: 📚 Lectura - El Origen de los Volcanes
level: C
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo científico. Vocabulario geológico. Identificar procesos, causas y consecuencias de fenómenos naturales en un texto de divulgación."
example: "Identifica los procesos descritos (causa → efecto) y localiza los términos técnicos explicados en el texto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Un volcán es una abertura en la corteza terrestre a través de la cual emerge material fundido del interior de la Tierra, conocido como magma. Cuando este material llega a la superficie, recibe el nombre de lava. La temperatura de la lava puede superar los mil grados centígrados. Los volcanes se forman principalmente en los bordes de las placas tectónicas, donde estas se separan o colisionan. También pueden formarse en los llamados 'puntos calientes', zonas del manto terrestre con actividad volcánica anómala, como ocurre en Hawái. Los volcanes se clasifican según su actividad: activos (erupcionan con regularidad), dormidos (no han erupcionado recientemente pero pueden hacerlo) y extintos (ya no entrarán en erupción). Una erupción volcánica puede ser muy destructiva: destruye cultivos, viviendas e infraestructuras. Sin embargo, a largo plazo, la lava enfriada forma suelos muy fértiles y nuevas tierras. La erupción del Vesubio en el año 79 d. C. sepultó la ciudad romana de Pompeya bajo cenizas y lodo."
    exercises:
      - type: reading
        question: "¿Cómo se llama el material fundido dentro de la Tierra? (lava/magma/ceniza)"
        correctAnswer: magma
        rationale: "El texto: 'material fundido del interior de la Tierra, conocido como magma'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama ese material cuando llega a la superficie? (magma/lava/mineral)"
        correctAnswer: lava
        rationale: "El texto: 'Cuando este material llega a la superficie, recibe el nombre de lava'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A qué temperatura puede llegar la lava? (más de 500°C/más de 1000°C/más de 2000°C)"
        correctAnswer: más de 1000°C
        rationale: "El texto: 'La temperatura de la lava puede superar los mil grados centígrados'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde se forman principalmente los volcanes? (en el centro de las placas/en los bordes de las placas tectónicas/en el fondo del mar)"
        correctAnswer: en los bordes de las placas tectónicas
        rationale: "El texto: 'se forman principalmente en los bordes de las placas tectónicas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué son los 'puntos calientes'? (zonas frías del manto/zonas del manto con actividad volcánica anómala/bordes de placas tectónicas)"
        correctAnswer: zonas del manto con actividad volcánica anómala
        rationale: "El texto: 'zonas del manto terrestre con actividad volcánica anómala'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama un volcán que no ha erupcionado recientemente pero podría hacerlo? (extinto/activo/dormido)"
        correctAnswer: dormido
        rationale: "El texto: 'dormidos (no han erupcionado recientemente pero pueden hacerlo)'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué beneficio ofrecen los volcanes a largo plazo? (agua dulce/suelos muy fértiles y nuevas tierras/minerales preciosos)"
        correctAnswer: suelos muy fértiles y nuevas tierras
        rationale: "El texto: 'la lava enfriada forma suelos muy fértiles y nuevas tierras'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué ciudad sepultó la erupción del Vesubio? (Roma/Herculano/Pompeya)"
        correctAnswer: Pompeya
        rationale: "El texto: 'sepultó la ciudad romana de Pompeya'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué año erupcionó el Vesubio sepultando Pompeya? (79 a. C./79 d. C./790 d. C.)"
        correctAnswer: 79 d. C.
        rationale: "El texto: 'La erupción del Vesubio en el año 79 d. C.'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde hay un ejemplo de volcán en punto caliente según el texto? (Islandia/Japón/Hawái)"
        correctAnswer: Hawái
        rationale: "El texto: 'como ocurre en Hawái'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 10
