title: 📚 Lectura - El Agua en el Planeta
level: C
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo científico. Vocabulario medioambiental. Distinguir datos, causas y consecuencias en un texto sobre recursos naturales."
example: "agua en la Tierra → 97,5% salada → 2,5% dulce → 69% en glaciares → solo 0,3% accesible → ciclo hidrológico: evaporación→precipitación→escorrentía → escasez: 2.000 millones sin acceso seguro → causas: contaminación/sobreexplotación/cambio climático."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El agua cubre aproximadamente el 71 por ciento de la superficie de la Tierra. Sin embargo, el 97,5 por ciento de ese agua es salada y solo el 2,5 por ciento es dulce. De ese porcentaje, casi el 70 por ciento está atrapado en glaciares y casquetes polares. Esto significa que menos del 1 por ciento del agua del planeta es accesible para el consumo humano. Cada año, la demanda mundial de agua aumenta debido al crecimiento de la población y al desarrollo industrial y agrícola. La agricultura consume el 70 por ciento del agua dulce disponible, seguida por la industria con un 20 por ciento y el uso doméstico con solo un 10 por ciento. En regiones como África subsahariana y el sur de Asia, millones de personas no tienen acceso a agua potable, lo que provoca enfermedades y muertes evitables. Los expertos advierten que el cambio climático agravará la escasez de agua en las próximas décadas."
    exercises:
      - type: reading
        question: "¿Qué porcentaje de la Tierra está cubierto por agua? (91%/51%/71%)"
        correctAnswer: 71%
        rationale: "El texto: 'El agua cubre aproximadamente el 71 por ciento'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué porcentaje del agua terrestre es salada? (2,5%/71%/97,5%)"
        correctAnswer: 97,5%
        rationale: "El texto: 'el 97,5 por ciento de ese agua es salada'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde está atrapado casi el 70% del agua dulce? (en los ríos/en glaciares y casquetes polares/en el subsuelo)"
        correctAnswer: en glaciares y casquetes polares
        rationale: "El texto: 'casi el 70 por ciento está atrapado en glaciares y casquetes polares'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué porcentaje del agua planetaria es accesible para los humanos? (10%/2,5%/menos del 1%)"
        correctAnswer: menos del 1%
        rationale: "El texto: 'menos del 1 por ciento del agua del planeta es accesible'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué causa el aumento anual de la demanda de agua? (el turismo/el crecimiento de la población y el desarrollo industrial y agrícola/la contaminación)"
        correctAnswer: el crecimiento de la población y el desarrollo industrial y agrícola
        rationale: "El texto: 'debido al crecimiento de la población y al desarrollo industrial y agrícola'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué sector consume más agua dulce disponible? (la industria/el uso doméstico/la agricultura)"
        correctAnswer: la agricultura
        rationale: "El texto: 'La agricultura consume el 70 por ciento del agua dulce disponible'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué porcentaje usa la industria? (10%/20%/70%)"
        correctAnswer: 20%
        rationale: "El texto: 'la industria con un 20 por ciento'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué consecuencia tiene la falta de agua potable en algunas regiones? (sequías agrícolas/enfermedades y muertes evitables/hambruna)"
        correctAnswer: enfermedades y muertes evitables
        rationale: "El texto: 'lo que provoca enfermedades y muertes evitables'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué regiones se mencionan con problemas de acceso al agua? (América Latina y Europa del Este/África subsahariana y el sur de Asia/Oriente Medio y Australia)"
        correctAnswer: África subsahariana y el sur de Asia
        rationale: "El texto: 'En regiones como África subsahariana y el sur de Asia'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué agravará la escasez de agua en el futuro? (el turismo de masas/el cambio climático/el uso doméstico)"
        correctAnswer: el cambio climático
        rationale: "El texto: 'el cambio climático agravará la escasez de agua'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 10
