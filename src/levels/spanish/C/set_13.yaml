title: Gramática - Léxico - Campos Semánticos y Polisemia
level: C
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Campo semántico: conjunto de palabras relacionadas por su significado (ej. campo 'cocina': olla, hervir, receta, condimento). Campo léxico: palabras derivadas de la misma raíz (ej. raíz pan: panadero, panadería, panecillo). Polisemia: una palabra con varios significados (banco: mueble / entidad financiera / banco de peces). Homonimia: palabras distintas que suenan igual (vino: pasado de venir / bebida). Hipónimo/Hiperónimo: rosa es hipónimo de flor; flor es hiperónimo de rosa."
example: "campo semántico 'transporte': coche, autobús, tren, avión. polisemia: cabo = extremo / militar / accidente geográfico. hiperónimo: animal → hipónimos: perro, gato, caballo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Campos Semánticos y Léxicos
    description: Clasifica o identifica el campo semántico correspondiente.
    exercises:
      - type: grammar
        question: "¿A qué campo semántico pertenecen: cuchillo, tenedor, plato, servilleta? (deporte/mobiliario/vajilla y cubertería)"
        correctAnswer: vajilla y cubertería
        rationale: "Todos los objetos están relacionados con la mesa y el servicio de comida."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿A qué campo semántico pertenecen: fiebre, jarabe, receta, quirófano? (educación/medicina/deporte)"
        correctAnswer: medicina
        rationale: "Todos los términos pertenecen al ámbito médico-sanitario."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué palabra NO pertenece al campo semántico del mar? (ola/tiburón/montaña/alga)"
        correctAnswer: montaña
        rationale: "'Montaña' pertenece al campo del relieve terrestre, no al del mar."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Campo léxico de 'libro': (leer, librería, libresco, librero / leer, escribir, hablar, ver / mesa, silla, libro, bolígrafo)"
        correctAnswer: leer, librería, libresco, librero
        rationale: "Todas comparten la raíz 'libr-' → campo léxico de 'libro'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el hiperónimo de: rosa, margarita, tulipán, clavel? (planta/flor/vegetal)"
        correctAnswer: flor
        rationale: "Rosa, margarita, tulipán y clavel son tipos de flores → hiperónimo: flor."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es hipónimo de 'vehículo'? (transporte/coche/movilidad)"
        correctAnswer: coche
        rationale: "'Coche' es un tipo específico de vehículo → hipónimo de 'vehículo'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el hiperónimo de: salmón, atún, merluza, bacalao? (animal/pescado/marisco)"
        correctAnswer: pescado
        rationale: "Salmón, atún, merluza y bacalao son tipos de pescado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿A qué campo semántico pertenecen: mástil, vela, timón, quilla, proa? (aviación/arquitectura/náutica)"
        correctAnswer: náutica
        rationale: "Mástil, vela, timón, quilla y proa son partes de un barco → náutica."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre campo semántico y campo léxico? (son lo mismo/el semántico agrupa por significado relacionado, el léxico por raíz común/el léxico es más amplio)"
        correctAnswer: el semántico agrupa por significado relacionado, el léxico por raíz común
        rationale: "Campo semántico = tema/significado afín. Campo léxico = misma raíz morfológica."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Añade un hipónimo al hiperónimo 'instrumento musical': (cantar/guitarra/melodía)"
        correctAnswer: guitarra
        rationale: "'Guitarra' es un tipo específico de instrumento musical → hipónimo."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Polisemia y Homonimia
    description: Identifica el significado correcto según el contexto.
    exercises:
      - type: grammar
        question: "'Fui al **banco** a sacar dinero.' ¿Significado? (mueble para sentarse/entidad financiera/banco de peces)"
        correctAnswer: entidad financiera
        rationale: "El contexto ('sacar dinero') indica que 'banco' = entidad financiera."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me senté en el **banco** del parque.' ¿Significado? (entidad financiera/mueble para sentarse/conjunto de peces)"
        correctAnswer: mueble para sentarse
        rationale: "El contexto ('del parque') indica que 'banco' = asiento."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El **cabo** Finisterre está en Galicia.' ¿Significado? (rango militar/extremo de un territorio que adentra en el mar/extremo de una cuerda)"
        correctAnswer: extremo de un territorio que adentra en el mar
        rationale: "En geografía, 'cabo' = saliente de tierra que penetra en el mar."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la polisemia? (dos palabras que suenan igual/una palabra con varios significados relacionados/dos palabras con significado opuesto)"
        correctAnswer: una palabra con varios significados relacionados
        rationale: "Polisemia: una sola entrada léxica con múltiples significados relacionados histórica o metafóricamente."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la homonimia? (una palabra con varios significados/dos palabras con igual forma pero distinto origen y significado/sinónimos perfectos)"
        correctAnswer: dos palabras con igual forma pero distinto origen y significado
        rationale: "Homonimia: coincidencia formal entre palabras de distinto origen: vino (bebida) ≠ vino (llegó)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El **vino** estaba bueno.' ¿Significado de 'vino'? (pasado de venir/bebida fermentada de uva/ninguno de los dos)"
        correctAnswer: bebida fermentada de uva
        rationale: "El contexto ('estaba bueno') indica 'vino' = bebida."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La **hoja** del árbol cayó.' ¿Significado? (hoja de papel/parte plana de una planta/cuchilla)"
        correctAnswer: parte plana de una planta
        rationale: "El contexto ('del árbol') determina 'hoja' = parte de la planta."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál de estos es ejemplo de polisemia? (vino/mesa/pluma — pluma: de ave / bolígrafo / estilo literario)"
        correctAnswer: pluma — pluma: de ave / bolígrafo / estilo literario
        rationale: "'Pluma' tiene varios significados relacionados → polisemia."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un hiperónimo? (palabra más específica/palabra de significado más general que incluye a otras/sinónimo formal)"
        correctAnswer: palabra de significado más general que incluye a otras
        rationale: "El hiperónimo incluye semánticamente a sus hipónimos: animal > perro."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Da el hiperónimo de: alegría, tristeza, miedo, sorpresa. (carácter/emoción/actitud)"
        correctAnswer: emoción
        rationale: "Alegría, tristeza, miedo y sorpresa son tipos de emociones → hiperónimo: emoción."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
