title: Gramática - Oraciones Relativas
level: C
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Relativas especificativas (sin comas): restringen el antecedente ('el libro que leí'). Relativas explicativas (con comas): añaden información ('Juan, que es mi amigo, llegó'). Pronombres: que (más frecuente), quien/quienes (personas, tras preposición), el cual/la cual/los cuales (formal, tras preposición), donde (lugar), cuyo/cuya (posesión, concuerda con el sustantivo siguiente). Antecedente + preposición: la ciudad en la que/donde nací; el amigo con quien hablo."
example: "especificativa: el libro que compré (cuál libro). explicativa: mi hermana, que estudia medicina, llegó tarde. cuyo: el escritor cuya novela ganó el premio."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Pronombres Relativos
    description: Elige el pronombre relativo correcto.
    exercises:
      - type: grammar
        question: "'El libro ___ leí era interesante.' (que/quien/cuyo)"
        correctAnswer: que
        rationale: "'Que' es el relativo neutro más frecuente para cosas."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La persona ___ llamó dejó un mensaje.' (que/cuya/donde)"
        correctAnswer: que
        rationale: "'Que' introduce la relativa especificativa de persona."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El autor ___ novela ganó el premio vino a la firma.' (que/cuyo/quien)"
        correctAnswer: cuyo
        rationale: "'Cuyo' expresa posesión y concuerda con 'novela' (femenino)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La ciudad ___ nací ya no existe.' (que/donde/cuya)"
        correctAnswer: donde
        rationale: "'Donde' sustituye a 'en la que' para lugares."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El director, ___ conozco desde hace años, renunció.' (que/cuyo/quien)"
        correctAnswer: quien
        rationale: "'Quien' para personas en relativas explicativas con coma."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El problema ___ te hablé está resuelto.' (que/del que/cuyo)"
        correctAnswer: del que
        rationale: "hablar de → del que: el problema del que te hablé."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los alumnos ___ notas son mejores ganarán la beca.' (que/cuyas/donde)"
        correctAnswer: cuyas
        rationale: "'Cuyas notas' → cuyo concuerda con el sustantivo siguiente (notas, femenino plural)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La empresa ___ trabajé cerró.' (en que/en donde/en la que)"
        correctAnswer: en la que
        rationale: "trabajar en → en la que: la empresa en la que trabajé."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los amigos con ___ salgo son muy divertidos.' (que/quienes/cuales)"
        correctAnswer: quienes
        rationale: "Preposición + persona → con quienes."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El motivo ___ llegué tarde fue el tráfico.' (por el que/del que/en el que)"
        correctAnswer: por el que
        rationale: "llegar tarde por → el motivo por el que."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Especificativas vs Explicativas
    description: Clasifica o transforma oraciones relativas.
    exercises:
      - type: grammar
        question: "'Los alumnos que estudiaron aprobaron.' ¿Tipo de relativa? (especificativa/explicativa/mixta)"
        correctAnswer: especificativa
        rationale: "Sin comas, restringe: solo los que estudiaron aprobaron → especificativa."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi hermana, que vive en París, habla francés.' ¿Tipo? (especificativa/explicativa/adjetiva simple)"
        correctAnswer: explicativa
        rationale: "Entre comas, añade información sobre mi hermana (ya identificada) → explicativa."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre especificativa y explicativa? (la especificativa añade información extra/la explicativa restringe el antecedente/la especificativa restringe, la explicativa añade información)"
        correctAnswer: la especificativa restringe, la explicativa añade información
        rationale: "Especificativa: limita el referente. Explicativa: informa sobre un referente ya identificado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El candidato ___ apoyé ganó las elecciones.' (relativa especificativa: ¿qué pronombre?) (que/quien/donde)"
        correctAnswer: que
        rationale: "'Que' introduce la relativa especificativa de persona cuando no hay preposición."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Con qué se expresa posesión en una relativa? (que/donde/cuyo/cuya)"
        correctAnswer: cuyo/cuya
        rationale: "'Cuyo/cuya' indica posesión y concuerda con el sustantivo que le sigue."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Eso es lo ___ más me gusta.' (que/cual/quien)"
        correctAnswer: que
        rationale: "Lo + que = relativo neutro para ideas o cosas abstractas."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Formal: 'la razón por la cual vine' equivale a: (la razón por que vine/la razón por la que vine/la razón para la que vine)"
        correctAnswer: la razón por la que vine
        rationale: "'Por la cual' y 'por la que' son equivalentes; la segunda es más habitual."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Juan, ___ es médico, atendió al herido.' ¿Pronombre? (que/quien/cuyo)"
        correctAnswer: quien
        rationale: "Relativa explicativa de persona → quien."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige la relativa correcta: (El niño que llora está triste./El niño, que llora, está triste — ambas son correctas con diferente significado.)"
        correctAnswer: El niño, que llora, está triste — ambas son correctas con diferente significado.
        rationale: "Sin comas = especificativa (solo el que llora); con comas = explicativa (el niño, además, llora)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La película ___ te hablé ganó el Óscar.' ¿Qué relativo falta? (de la que/que/cuya)"
        correctAnswer: de la que
        rationale: "hablar de → de la que: la película de la que te hablé."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
