title: Lectura - El Sueño de Ada
level: C
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Texto narrativo literario. Vocabulario de emociones, sueños y determinación. Inferir motivaciones del personaje, identificar recursos expresivos y analizar la estructura narrativa."
example: "narrador → perspectiva (1ª/3ª persona) → personaje: Ada → emociones (miedo/esperanza/alivio) → conflicto → desarrollo → desenlace. Lee preguntándote: '¿qué siente Ada?' y '¿cómo se resuelve el problema?'"
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Ada tenía dieciséis años cuando le dijeron que las chicas no servían para las matemáticas. Lo dijo el señor Fuentes, su profesor de álgebra, justo antes de entregarle el examen con un cuatro tachado en rojo. Ada no lloró. Dobló el papel con cuidado, lo guardó en la mochila y esa noche, en lugar de cenar, llenó tres hojas de operaciones hasta que encontró el error. Era un signo menos donde debía ir un más. Desde ese día decidió que cada examen sería una conversación entre ella y los números, una conversación en la que el señor Fuentes no tenía cabida. Tres años después, Ada ganó la Olimpiada Nacional de Matemáticas. En el escenario, cuando recogió el trofeo, pensó en aquel cuatro rojo. No con rabia, sino con gratitud. Porque ese cuatro la había enseñado algo que ningún diez hubiera podido: que los errores son el principio de todo lo verdadero."
    exercises:
      - type: reading
        question: "¿Qué dijo el señor Fuentes? (que Ada era la mejor/que las chicas no servían para las matemáticas/que Ada debía estudiar más)"
        correctAnswer: que las chicas no servían para las matemáticas
        rationale: "El texto: 'le dijeron que las chicas no servían para las matemáticas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué nota recibió Ada en el examen? (un dos/un cuatro/un cinco)"
        correctAnswer: un cuatro
        rationale: "El texto: 'un cuatro tachado en rojo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo reaccionó Ada al recibir el examen? (lloró/se enfadó con el profesor/no lloró y se puso a corregir el error)"
        correctAnswer: no lloró y se puso a corregir el error
        rationale: "El texto: 'Ada no lloró... llenó tres hojas de operaciones hasta que encontró el error'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál era el error en el examen? (una suma donde debía ir una resta/un signo menos donde debía ir un más/una cifra incorrecta)"
        correctAnswer: un signo menos donde debía ir un más
        rationale: "El texto: 'Era un signo menos donde debía ir un más'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué decidió Ada desde ese día? (abandonar las matemáticas/que cada examen sería una conversación entre ella y los números/hablar con el director)"
        correctAnswer: que cada examen sería una conversación entre ella y los números
        rationale: "El texto: 'cada examen sería una conversación entre ella y los números'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto tiempo después ganó Ada la Olimpiada? (un año/dos años/tres años)"
        correctAnswer: tres años
        rationale: "El texto: 'Tres años después, Ada ganó la Olimpiada Nacional de Matemáticas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué pensó Ada al recoger el trofeo? (en su familia/en el señor Fuentes/en aquel cuatro rojo)"
        correctAnswer: en aquel cuatro rojo
        rationale: "El texto: 'pensó en aquel cuatro rojo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con qué sentimiento recordó Ada el cuatro? (con rabia/con indiferencia/con gratitud)"
        correctAnswer: con gratitud
        rationale: "El texto: 'No con rabia, sino con gratitud'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué enseñanza saca Ada del cuatro? (que los profesores siempre tienen razón/que los errores son el principio de lo verdadero/que es mejor no arriesgarse)"
        correctAnswer: que los errores son el principio de lo verdadero
        rationale: "El texto: 'los errores son el principio de todo lo verdadero'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué significa 'el señor Fuentes no tenía cabida' en ese contexto? (que el profesor se había ido/que Ada ya no le necesitaba como árbitro de su relación con las matemáticas/que le había expulsado de clase)"
        correctAnswer: que Ada ya no le necesitaba como árbitro de su relación con las matemáticas
        rationale: "'No tener cabida' = no tener lugar. Ada excluye al profesor de su diálogo privado con las matemáticas."
        difficulty: 3
        objectives: [es.pre_reading]
target: 10
