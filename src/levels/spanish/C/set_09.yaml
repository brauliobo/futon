title: Gramática - Los Tiempos Compuestos
level: C
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Tiempos compuestos: haber (conjugado) + participio (invariable). Participios irregulares: hacer→hecho, decir→dicho, escribir→escrito, ver→visto, volver→vuelto, poner→puesto, romper→roto, abrir→abierto, morir→muerto, cubrir→cubierto. Pretérito perfecto (he comido), pluscuamperfecto (había comido), futuro perfecto (habré comido), condicional perfecto (habría comido), subj. perfecto (haya comido), subj. pluscuamperfecto (hubiera comido)."
example: "haber + participio: he comido, había llegado, habrá terminado. hacer → hecho: he hecho. decir → dicho: había dicho. volver → vuelto: ha vuelto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Participios y Formación
    description: Elige la forma compuesta correcta.
    exercises:
      - type: grammar
        question: "'Esta semana ___ mucho.' (perfecto de llover) (llovía/ha llovido/llueve)"
        correctAnswer: ha llovido
        rationale: "Pretérito perfecto: haber (3ª sg.) + part. → ha llovido."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Participio de 'hacer': (hacido/hecho/hazado)"
        correctAnswer: hecho
        rationale: "hacer → participio irregular: hecho."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Cuando llegué, ella ya se ___.' (pluscuamperfecto de ir) (fue/había ido/ha ido)"
        correctAnswer: había ido
        rationale: "Pluscuamperfecto: había + participio → había ido."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Participio de 'escribir': (escribido/escrito/escribiado)"
        correctAnswer: escrito
        rationale: "escribir → participio irregular: escrito."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Para mañana ya ___ el informe.' (futuro perfecto de entregar) (entregaré/habré entregado/he entregado)"
        correctAnswer: habré entregado
        rationale: "Futuro perfecto: habré + participio → habré entregado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Participio de 'volver': (volvido/vuelta/vuelto)"
        correctAnswer: vuelto
        rationale: "volver → participio irregular: vuelto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Si hubiera ___ antes, no habrías esperado.' (participio de llegar) (llegado/llegido/llego)"
        correctAnswer: llegado
        rationale: "llegar → participio regular -ar: llegado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Participio de 'decir': (decido/dicho/dicido)"
        correctAnswer: dicho
        rationale: "decir → participio irregular: dicho."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No creo que ___ la verdad.' (subj. perfecto de decir) (diga/haya dicho/dijera)"
        correctAnswer: haya dicho
        rationale: "Subjuntivo perfecto: haya + participio → haya dicho."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Participio de 'poner': (ponido/puesto/ponado)"
        correctAnswer: puesto
        rationale: "poner → participio irregular: puesto."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Uso de los Tiempos Compuestos
    description: Elige el tiempo compuesto adecuado según el contexto.
    exercises:
      - type: grammar
        question: "'Cuando llegamos, los niños ya ___ dormidos.' (pluscuamperfecto de quedarse) (se quedan/se habían quedado/se quedaron)"
        correctAnswer: se habían quedado
        rationale: "Acción anterior a otra pasada → pluscuamperfecto: se habían quedado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ alguna vez en Nueva York?' (perfecto de estar) (Estuviste/Has estado/Habías estado)"
        correctAnswer: Has estado
        rationale: "Experiencia vital sin tiempo definido → pretérito perfecto: Has estado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Si hubiera sabido, ___ antes.' (cond. perf. de venir) (vendría/habría venido/habré venido)"
        correctAnswer: habría venido
        rationale: "Condicional compuesto: habría + participio → habría venido."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa el pluscuamperfecto? (acción futura/acción anterior a otra pasada/acción habitual pasada)"
        correctAnswer: acción anterior a otra pasada
        rationale: "El pluscuamperfecto indica que algo ocurrió antes que otro hecho del pasado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Para el viernes ___ el proyecto.' (futuro perfecto de terminar) (terminé/habrás terminado/has terminado)"
        correctAnswer: habrás terminado
        rationale: "Futuro perfecto: acción completada antes de un momento futuro → habrás terminado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Participio de 'ver': (veído/visto/vido)"
        correctAnswer: visto
        rationale: "ver → participio irregular: visto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me alegra que ___ tan bien.' (subj. perfecto de salir) (salga/haya salido/saliera)"
        correctAnswer: haya salido
        rationale: "Emoción + perfecto de subjuntivo: me alegra que haya salido."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No ___ que hacerlo así.' (cond. perf. de tener) (tendrías/habrías tenido/hubieras tenido)"
        correctAnswer: habrías tenido
        rationale: "Reproche o hipótesis pasada → condicional compuesto: habrías tenido."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Participio de 'abrir': (abrido/abierto/abrando)"
        correctAnswer: abierto
        rationale: "abrir → participio irregular: abierto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tiempo usa 'ya' con una acción completada en el presente? (indefinido/pretérito perfecto/pluscuamperfecto)"
        correctAnswer: pretérito perfecto
        rationale: "'Ya' indica acción completada con relevancia presente → pretérito perfecto: ya he comido."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
