title: 📝 Gramática - Estilo Indirecto
level: C
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Estilo directo: reproduces las palabras exactas ('Tengo hambre', dijo Ana). Estilo indirecto: parafraseas (Ana dijo que tenía hambre). Cambios en el estilo indirecto: tiempo verbal (presente → imperfecto, indefinido → pluscuamperfecto, futuro → condicional, imperativo → que + subj. imp.), pronombres (yo → él/ella), demostrativos (este → ese/aquel), adverbios de tiempo (hoy → ese día, mañana → al día siguiente, ayer → el día anterior), adverbios de lugar (aquí → allí)."
example: "directo: 'Vendré mañana' → indirecto: dijo que vendría al día siguiente. 'Ven aquí' → me dijo que fuera allí."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Transformación al Estilo Indirecto
    description: Transforma la oración de estilo directo a indirecto.
    exercises:
      - type: grammar
        question: "Directo: 'Tengo sed', dijo Ana. → Indirecto: Ana dijo que ___ sed. (tuvo/tiene/tenía)"
        correctAnswer: tenía
        rationale: "Presente → imperfecto en estilo indirecto: tiene → tenía."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: 'Llegaré tarde', dijo. → Indirecto: dijo que ___ tarde. (llegará/llegaría/llegara)"
        correctAnswer: llegaría
        rationale: "Futuro → condicional en estilo indirecto: llegará → llegaría."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: 'Estudié mucho', confesó. → Indirecto: confesó que ___ mucho. (estudia/estudió/había estudiado)"
        correctAnswer: había estudiado
        rationale: "Indefinido → pluscuamperfecto en estilo indirecto: estudié → había estudiado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: '¡Ven aquí!', me dijo. → Indirecto: me dijo que ___ allí. (vengo/venga/viniera)"
        correctAnswer: viniera
        rationale: "Imperativo → que + imperfecto de subjuntivo: ven → que viniera."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: 'Hoy estoy cansada'. → Indirecto: dijo que ___ día estaba cansada. (hoy/ese/este)"
        correctAnswer: ese
        rationale: "'Hoy' en estilo directo → 'ese día' en indirecto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: 'Mañana iré al cine'. → Indirecto: dijo que ___ iría al cine. (mañana/al día siguiente/ese día)"
        correctAnswer: al día siguiente
        rationale: "'Mañana' en estilo directo → 'al día siguiente' en indirecto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: 'Quiero este libro'. → Indirecto: dijo que quería ___ libro. (este/ese/aquel)"
        correctAnswer: ese
        rationale: "Demostrativo de 1ª persona (este) → 2ª/3ª (ese/aquel) en indirecto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: '¿Cuándo llegaste?', me preguntó. → Indirecto: me preguntó ___ había llegado. (si/cuándo/que)"
        correctAnswer: cuándo
        rationale: "Pregunta parcial → mantiene la palabra interrogativa: cuándo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: '¿Tienes hambre?', me preguntó. → Indirecto: me preguntó ___ tenía hambre. (cuándo/que/si)"
        correctAnswer: si
        rationale: "Pregunta total (sí/no) → si en estilo indirecto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: 'Ayer salí pronto'. → Indirecto: dijo que ___ había salido pronto. (ayer/el día anterior/al día siguiente)"
        correctAnswer: el día anterior
        rationale: "'Ayer' → 'el día anterior' en estilo indirecto."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Verbos Introductores y Análisis
    description: Elige el verbo introductor o completa el estilo indirecto.
    exercises:
      - type: grammar
        question: "¿Qué verbo introductor se usa para órdenes? (decir que/preguntar si/pedir/ordenar que)"
        correctAnswer: pedir/ordenar que
        rationale: "Las órdenes se introducen con pedir, ordenar, mandar + que + subj."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué verbo introductor se usa para preguntas de sí/no? (decir/preguntar si/preguntar cuándo)"
        correctAnswer: preguntar si
        rationale: "Preguntas totales → preguntar + si."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me aseguró que ___ pronto.' (futuro en indirecto de volver) (volvería/volverá/vuelva)"
        correctAnswer: volvería
        rationale: "Aseguró (pasado) + futuro → condicional: volvería."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Le aconsejé que ___ más.' (imp. subj. de descansar) (descanse/descansara/descansaría)"
        correctAnswer: descansara
        rationale: "Aconsejar (pasado) + que → imp. subj.: descansara."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué cambia al pasar de directo a indirecto? (solo el tiempo verbal/el tiempo verbal, pronombres, adverbios y demostrativos/solo los pronombres)"
        correctAnswer: el tiempo verbal, pronombres, adverbios y demostrativos
        rationale: "El paso a estilo indirecto afecta tiempos, pronombres, adverbios y demostrativos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: 'No lo haré'. → Indirecto: dijo que no lo ___ (condicional de hacer) (haría/hará/haga)"
        correctAnswer: haría
        rationale: "Futuro → condicional: haré → haría."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Prometió que ___ a tiempo.' (condicional de llegar) (llegará/llegaría/llegue)"
        correctAnswer: llegaría
        rationale: "Prometió (pasado) + futuro → condicional: llegaría."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Le dijo que no ___ tanto.' (imp. subj. de gritar, negativo) (grite/gritara/gritaría)"
        correctAnswer: gritara
        rationale: "Decir (pasado) + imperativo negativo → imp. subj.: no gritara."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Directo: 'Aquí hace calor'. → Indirecto: dijo que ___ hacía calor. (aquí/allí/ahí)"
        correctAnswer: allí
        rationale: "'Aquí' del hablante original → 'allí' en estilo indirecto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo no cambia el tiempo verbal en indirecto? (nunca/cuando el verbo introductor está en presente/cuando el verbo es irregular)"
        correctAnswer: cuando el verbo introductor está en presente
        rationale: "Si el verbo introductor está en presente, el tiempo del verbo reportado puede no cambiar."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
