title: Gramática - Morfosintaxis Avanzada del Español
level: J
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Morfosintaxis avanzada: concordancia ad sensum, estructuras ecuativas y pseudoecuativas, las copulativas ser/estar con predicados complejos, el sujeto nulo y el sujeto expletivo, construcciones absolutas (participio, gerundio), la pasiva perifrástica vs. la pasiva refleja, las perífrasis verbales (clasificación semántica), los relativos libres y la subordinación adverbial compleja."
example: "concordancia ad sensum → 'La mayoría de los estudiantes llegaron tarde' (concordancia con el referente real, no con el núcleo) vs. 'La mayoría llegó tarde' (concordancia gramatical). pasiva perifrástica → 'La ley fue aprobada (por el congreso)': ser + participio, agente opcional. pasiva refleja → 'Se aprobó la ley': se + verbo activo, sin agente expreso. construcción absoluta de participio → 'Aprobada la ley, el gobierno actuó' = 'Una vez aprobada la ley...': el participio concuerda con su sujeto implícito. perífrasis aspectual → 'estar + gerundio' (progresiva): 'Estoy leyendo' → el proceso está en curso en un momento de referencia."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Morfosintaxis - Construcciones Complejas
    description: Identifica y analiza las construcciones morfosintácticas avanzadas del español.
    exercises:
      - type: grammar
        question: "¿Qué es la concordancia ad sensum? (la concordancia de género/la concordancia del verbo con el referente semántico real en lugar del núcleo gramatical del sujeto: 'La mayoría de los estudiantes llegaron' (concuerda con 'estudiantes') vs. 'La mayoría llegó' (concuerda con 'mayoría')/la concordancia de número)"
        correctAnswer: la concordancia del verbo con el referente semántico real en lugar del núcleo gramatical del sujeto: 'La mayoría de los estudiantes llegaron' (concuerda con 'estudiantes') vs. 'La mayoría llegó' (concuerda con 'mayoría')
        rationale: "Concordancia ad sensum: fenómeno gramaticalmente variable → en construcciones colectivas, la concordancia con el complemento es frecuente y aceptada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre la pasiva perifrástica y la pasiva refleja en español? (son idénticas/perifrástica: 'ser + participio' (concordado) con agente opcional: 'La ley fue aprobada por el congreso'; refleja: 'se + verbo activo' sin agente: 'Se aprobó la ley' → la refleja evita sistematicamente el agente/la refleja siempre lleva agente)"
        correctAnswer: perifrástica: 'ser + participio' (concordado) con agente opcional: 'La ley fue aprobada por el congreso'; refleja: 'se + verbo activo' sin agente: 'Se aprobó la ley' → la refleja evita sistematicamente el agente
        rationale: "Pasiva en español: la perifrástica es más formal y compatible con agente; la refleja es más coloquial e impide la expresión del agente → el ACD analiza ambas como estrategias de ocultamiento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una construcción absoluta de participio? (una oración de relativo/una cláusula con participio que tiene su propio sujeto implícito y expresa una circunstancia temporal, causal o condicional: 'Terminada la reunión, todos se fueron' = 'Cuando terminó la reunión, todos se fueron'/una frase preposicional)"
        correctAnswer: una cláusula con participio que tiene su propio sujeto implícito y expresa una circunstancia temporal, causal o condicional: 'Terminada la reunión, todos se fueron' = 'Cuando terminó la reunión, todos se fueron'
        rationale: "Absoluta de participio: construcción de registro culto y formal → el participio concuerda con el sujeto de la cláusula absoluta ('reunión' → 'terminada')."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia semántica entre perífrasis aspectuales y modales? (no hay diferencia/aspectuales: expresan la fase o el desarrollo de la acción (estar+gerundio: progresivo; llevar+gerundio: persistencia; acabar de+infinitivo: reciente); modales: expresan la actitud del hablante hacia la acción (deber+infinitivo: obligación; poder+infinitivo: posibilidad)/las modales son más largas)"
        correctAnswer: aspectuales: expresan la fase o el desarrollo de la acción (estar+gerundio: progresivo; llevar+gerundio: persistencia; acabar de+infinitivo: reciente); modales: expresan la actitud del hablante hacia la acción (deber+infinitivo: obligación; poder+infinitivo: posibilidad)
        rationale: "Perífrasis verbales: el auxiliar aporta información aspectual o modal; el verboide, el contenido léxico → la distinción aspectual/modal es semántica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre 'Ser inteligente es bueno' (copulativa) y 'Lo que importa es ser inteligente' (pseudoecuativa)? (son idénticas/copulativa: une sujeto y predicado nominal; pseudoecuativa (ecuativa o escindida): la cópula une dos expresiones referenciales que se identifican → pueden invertirse: 'Ser inteligente es lo que importa'/la pseudoecuativa no usa 'ser')"
        correctAnswer: copulativa: une sujeto y predicado nominal; pseudoecuativa (ecuativa o escindida): la cópula une dos expresiones referenciales que se identifican → pueden invertirse: 'Ser inteligente es lo que importa'
        rationale: "Ecuativas: las dos posiciones son referenciales (pueden conmutarse) → las copulativas atributivas no son conmutables: 'Juan es alto' ≠ 'alto es Juan' (como predicación)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia 'ser' de 'estar' en los predicados complejos del español? (ser es pasado y estar es presente/ser expresa propiedades clasificatorias, definitorias o esenciales del referente; estar expresa estados o resultados de un proceso, a menudo temporales: 'es aburrido' (característica) vs. 'está aburrido' (estado momentáneo)/no hay diferencia sistemática)"
        correctAnswer: ser expresa propiedades clasificatorias, definitorias o esenciales del referente; estar expresa estados o resultados de un proceso, a menudo temporales: 'es aburrido' (característica) vs. 'está aburrido' (estado momentáneo)
        rationale: "Ser/estar: la distinción no es simplemente permanente/temporal → es clasificatorio/resultativo → 'está muerto' (resultado); 'es mortal' (propiedad) → algunos adjetivos cambian de significado según la cópula."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el sujeto nulo en español y por qué es posible? (que el sujeto es implícito solo en el imperativo/el español es una lengua de sujeto nulo: omite el pronombre sujeto porque la desinencia verbal expresa la persona y número de forma no ambigua: 'Llegué tarde' = 'Yo llegué tarde'/el sujeto siempre se expresa)"
        correctAnswer: el español es una lengua de sujeto nulo: omite el pronombre sujeto porque la desinencia verbal expresa la persona y número de forma no ambigua: 'Llegué tarde' = 'Yo llegué tarde'
        rationale: "Parámetro del sujeto nulo: el español (y el italiano, el portugués) difieren del inglés y el francés → en español, el pronombre sujeto expreso añade contraste, énfasis o desambiguación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresan las oraciones consecutivas con 'tan...que' y 'tanto...que'? (causa/consecuencia: 'Estudió tanto que aprobó' → el resultado o consecuencia se deriva de la intensidad o cantidad expresada en la prótasis; 'tan' modifica adjetivos/adverbios; 'tanto' modifica verbos o sustantivos/condición)"
        correctAnswer: consecuencia: 'Estudió tanto que aprobó' → el resultado o consecuencia se deriva de la intensidad o cantidad expresada en la prótasis; 'tan' modifica adjetivos/adverbios; 'tanto' modifica verbos o sustantivos
        rationale: "Oraciones consecutivas: intensificación → consecuencia → 'Hace tanto calor que no puedo dormir' → la consecutiva no expresa causa sino el resultado de la intensidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué construcción usa el relativo libre 'quien' en 'Quien madruga, Dios le ayuda'? (oración de relativo especificativa/relativo libre sin antecedente expreso: 'quien' equivale a 'la persona que' → la cláusula con 'quien' funciona como sujeto de la oración principal/cláusula adverbial)"
        correctAnswer: relativo libre sin antecedente expreso: 'quien' equivale a 'la persona que' → la cláusula con 'quien' funciona como sujeto de la oración principal
        rationale: "Relativo libre: no hay antecedente nominal → el pronombre relativo incorpora el núcleo nominal ('quien' = 'aquel que/la persona que') → registro proverbial y formal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia aspectual entre 'Juan leyó el libro' y 'Juan estuvo leyendo el libro'? (solo de tiempo/télico vs. atélico: 'leyó' expresa la acción como un todo completo con límite final (télico); 'estuvo leyendo' presenta el proceso en su desarrollo sin implicar necesariamente su conclusión (atélico progresivo)/formal vs. informal)"
        correctAnswer: télico vs. atélico: 'leyó' expresa la acción como un todo completo con límite final (télico); 'estuvo leyendo' presenta el proceso en su desarrollo sin implicar necesariamente su conclusión (atélico progresivo)
        rationale: "Aspecto léxico y gramatical: la perífrasis 'estar + gerundio' aporta aspecto imperfectivo progresivo → neutraliza la telichidad del verbo base."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis Morfosintáctico Avanzado
    description: Aplica el análisis morfosintáctico a oraciones complejas del español.
    exercises:
      - type: grammar
        question: "¿Por qué 'Habiendo estudiado mucho, aprobó el examen' es una construcción absoluta de gerundio? (porque usa gerundio/porque tiene un gerundio con sujeto correferente con el de la oración principal que expresa anterioridad o causa: 'habiendo estudiado mucho' = 'dado que había estudiado mucho'/porque es una cláusula causal explícita)"
        correctAnswer: porque tiene un gerundio con sujeto correferente con el de la oración principal que expresa anterioridad o causa: 'habiendo estudiado mucho' = 'dado que había estudiado mucho'
        rationale: "Construcción absoluta de gerundio: el gerundio compuesto (habiendo + participio) expresa anterioridad → equivale a una subordinada causal-temporal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia 'Aunque llueva, iré' de 'Aunque llueve, iré'? (solo el tiempo verbal/la modalidad: 'aunque + subjuntivo' → concesiva hipotética (no sé si lloverá, pero iré de todas formas); 'aunque + indicativo' → concesiva factiva (sé que llueve, pero iré igualmente)/una es más formal)"
        correctAnswer: la modalidad: 'aunque + subjuntivo' → concesiva hipotética (no sé si lloverá, pero iré de todas formas); 'aunque + indicativo' → concesiva factiva (sé que llueve, pero iré igualmente)
        rationale: "Aunque + ind/subj: el modo indica el estatus epistémico del hablante respecto a la cláusula concesiva → contraste ind (factual) vs. subj (hipotético)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función de 'lo' en 'Lo difícil es empezar'? (artículo masculino/artículo neutro que sustantiva el adjetivo 'difícil' → 'lo difícil' = 'la parte difícil / la dificultad' → el artículo neutro crea sintagmas nominales abstractos a partir de adjetivos/un pronombre)"
        correctAnswer: artículo neutro que sustantiva el adjetivo 'difícil' → 'lo difícil' = 'la parte difícil / la dificultad' → el artículo neutro crea sintagmas nominales abstractos a partir de adjetivos
        rationale: "Artículo neutro 'lo': el español tiene tres géneros del artículo (el/la/lo) → 'lo' sustantiva adjetivos y crea expresiones nominales abstractas: 'lo bueno', 'lo importante'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'Se construyeron tres edificios' admite interpretación pasiva pero 'Se construyeron los tres edificios' no? (no hay diferencia/con SN indefinido: el verbo concuerda en número con el SN → pasiva refleja (los edificios son el sujeto paciente); con SN definido: puede ser ambiguo o forzar lectura impersonal → 'se' impersonal + objeto directo/solo diferencia de tiempo)"
        correctAnswer: con SN indefinido: el verbo concuerda en número con el SN → pasiva refleja (los edificios son el sujeto paciente); con SN definido: puede ser ambiguo o forzar lectura impersonal → 'se' impersonal + objeto directo
        rationale: "Pasiva refleja vs. se impersonal: los SN definidos bloquean la lectura pasiva en el español estándar → 'Se construyeron los edificios' es marginal como pasiva refleja."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distinción temporal expresa 'ir a + infinitivo' vs. 'futuro simple'? (ninguna/ir a + infinitivo: futuro próximo con evidencia presente o planeado (prospectivo): 'Va a llover' (hay nubes); futuro simple: predicción neutral o más distante: 'Lloverá mañana' → en el español coloquial, ir a + inf. está desplazando al futuro simple/es solo dialectal)"
        correctAnswer: ir a + infinitivo: futuro próximo con evidencia presente o planeado (prospectivo): 'Va a llover' (hay nubes); futuro simple: predicción neutral o más distante: 'Lloverá mañana' → en el español coloquial, ir a + inf. está desplazando al futuro simple
        rationale: "Perífrasis prospectiva: en el español hablado, 'ir a + inf.' ha extendido su uso a expensas del futuro simple → cambio en curso documentado sociolingüísticamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'El libro que compré ayer se me perdió' contiene tres cláusulas? (no las contiene/oración principal ('se me perdió'), cláusula de relativo ('que compré ayer' = especificativa del SN 'el libro') y estructura reflexiva/dativa ('se me') que expresa involuntariedad → análisis multinivel de la subordinación/solo tiene una cláusula)"
        correctAnswer: oración principal ('se me perdió'), cláusula de relativo ('que compré ayer' = especificativa del SN 'el libro') y estructura reflexiva/dativa ('se me') que expresa involuntariedad → análisis multinivel de la subordinación
        rationale: "Análisis oracional: la cláusula de relativo está subordinada al SN del sujeto principal; el clítico 'se me' es dativo ético que añade valor de involuntariedad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué característica distingue el gerundio de anterioridad del gerundio de simultaneidad? (la longitud/anterioridad: 'Habiendo llegado, llamó' (primero llegó, luego llamó) → gerundio compuesto; simultaneidad: 'Llegando, llamó' (los dos actos al mismo tiempo) → gerundio simple/no hay distinción)"
        correctAnswer: anterioridad: 'Habiendo llegado, llamó' (primero llegó, luego llamó) → gerundio compuesto; simultaneidad: 'Llegando, llamó' (los dos actos al mismo tiempo) → gerundio simple
        rationale: "Gerundio compuesto vs. simple: el gerundio compuesto (habiendo + participio) aporta aspecto perfectivo y anterioridad; el simple, simultaneidad o anterioridad inmediata."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia 'deber + infinitivo' de 'deber de + infinitivo'? (son equivalentes en español estándar/deber + infinitivo: obligación deóntica ('Debes estudiar'); deber de + infinitivo: probabilidad epistémica ('Debe de ser tarde') → aunque la distinción se erosiona en el uso coloquial, la norma académica la mantiene/deber de es más formal)"
        correctAnswer: deber + infinitivo: obligación deóntica ('Debes estudiar'); deber de + infinitivo: probabilidad epistémica ('Debe de ser tarde') → aunque la distinción se erosiona en el uso coloquial, la norma académica la mantiene
        rationale: "Deber/deber de: distinción normativa que la RAE mantiene → en la práctica muchos hablantes usan 'deber' para ambos valores → la alternancia es variable sociolingüística."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa la perífrasis 'acabar de + infinitivo'? (acción futura/aspecto perfectivo reciente: la acción se acaba de completar en el momento de referencia: 'Acabo de llegar' = llegué hace muy poco tiempo → valor de 'recencia' aspectual/acción repetida)"
        correctAnswer: aspecto perfectivo reciente: la acción se acaba de completar en el momento de referencia: 'Acabo de llegar' = llegué hace muy poco tiempo → valor de 'recencia' aspectual
        rationale: "'Acabar de + inf.': perífrasis aspectual de recencia → en presente: evento reciente; en imperfecto: 'acababa de llegar' = evento reciente respecto al pasado de referencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'Fue Juan quien rompió el jarrón' es una estructura escindida (cleft)? (porque usa el pasado/porque escinde (separa) una oración simple en dos cláusulas para focalizar un constituyente: la estructura 'ser + X + que + cláusula' pone el foco informativo sobre Juan, contrastándolo con otros posibles agentes/porque usa 'quien')"
        correctAnswer: porque escinde (separa) una oración simple en dos cláusulas para focalizar un constituyente: la estructura 'ser + X + que + cláusula' pone el foco informativo sobre Juan, contrastándolo con otros posibles agentes
        rationale: "Estructura escindida (cleft): 'Juan rompió el jarrón' → 'Fue Juan quien...' → la escisión aporta foco contrastivo → equivale a la entonación enfática del español hablado."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
