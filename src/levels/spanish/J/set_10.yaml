    title: El Texto
    description: "Texto: La antropología cultural estudia la diversidad de las culturas humanas. El etnocentrismo —juzgar otras culturas desde los valores de la propia— fue el sesgo que la antropología moderna buscó superar. Franz Boas, padre del relativismo cultural, argumentó que cada cultura debe entenderse en sus propios términos, sin jerarquías evolutivas: el historicismo particularista rechazó los esquemas evolucionistas unilineales del siglo XIX (Morgan, Tylor). Bronisław Malinowski inauguró el método etnográfico de observación participante en las Islas Trobriand: convivir durante años con la comunidad estudiada para comprender la cultura 'desde dentro'. Claude Lévi-Strauss aplicó el estructuralismo al análisis de los mitos y las estructuras de parentesco: detrás de la diversidad cultural superficial existen estructuras mentales universales binarias (crudo/cocido, naturaleza/cultura, yo/otro). Clifford Geertz propuso la 'descripción densa' (thick description): el análisis interpretativo de los símbolos culturales como textos que el antropólogo debe leer → la cultura es una red de significados que los seres humanos construyen. El relativismo cultural plantea el dilema: ¿pueden los valores de los derechos humanos universales coexistir con el respeto a prácticas culturales concretas que los violan (mutilación genital, matrimonio infantil)? Los universales culturales (tabú del incesto, rituales funerarios, mito, música) son transculturales aunque varíen en contenido. El método etnográfico ha sido criticado por la 'crisis de representación': ¿puede el antropólogo, generalmente occidental, representar fielmente la voz del 'otro'?"
    exercises:
