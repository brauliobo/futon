authorNotes: "Texto expositivo sobre antropología cultural: el relativismo cultural, el etnocentrismo, las corrientes principales (Boas, Malinowski, Lévi-Strauss, Geertz), el método etnográfico, los debates sobre universales culturales, el tabú, el ritual, el mito y el símbolo."
