        correctAnswer: "el sesgo de juzgar otras culturas desde los valores de la propia: distorsiona la comprensión de la diversidad cultural y reproduce jerarquías coloniales"
        rationale: "El texto: 'El etnocentrismo —juzgar otras culturas desde los valores de la propia— fue el sesgo que la antropología moderna buscó superar'."
