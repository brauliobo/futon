title: 📝 Gramática - Estilística y Análisis del Estilo Literario
level: J
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada sobre estilística: la distinción entre lengua y estilo, las figuras de dicción (aliteración, paronomasia, calambur), las figuras de construcción (hipérbaton, quiasmo, zeugma, anadiplosis, epanadiplosis), las figuras semánticas (sinestesia, catachresis, símbolo), la isotopía, la cohesión estilística, el ritmo en prosa y poesía, el estilo indirecto libre."
example: "La sinestesia une percepciones de sentidos diferentes → 'voces de colores' / 'silencio atronador' → un adjetivo visual modifica un sustantivo auditivo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Figuras de Dicción y Construcción
    exercises:
      - type: grammar
        question: "¿Qué figura retórica aparece en 'Con dados de jade jugaba el jaguar'? (metáfora/aliteración: repetición del sonido /x/ (j) a lo largo del verso → efecto fónico expresivo/hipérbaton)"
        correctAnswer: "aliteración: repetición del sonido /x/ (j) a lo largo del verso → efecto fónico expresivo"
        rationale: "La aliteración produce efectos musicales o expresivos al repetir sonidos consonánticos en posiciones próximas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el hipérbaton en la estilística española? (la repetición de palabras/la eliminación de palabras/la alteración del orden sintáctico canónico de la oración → 'De este polvo, esta gloria fue' → el objeto aparece antes del verbo y el sujeto)"
        correctAnswer: la alteración del orden sintáctico canónico de la oración → 'De este polvo, esta gloria fue' → el objeto aparece antes del verbo y el sujeto
        rationale: "El hipérbaton invierte el orden normal SVO para crear énfasis, musicalidad o efecto poético; muy frecuente en el culteranismo de Góngora."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué figura de construcción es 'Vine, vi, vencí' (Julio César)? (epífora/anáfora/asíndeton con tricolon: omisión de conjunciones entre tres elementos paralelos → ritmo acelerado y contundente)"
        correctAnswer: "asíndeton con tricolon: omisión de conjunciones entre tres elementos paralelos → ritmo acelerado y contundente"
        rationale: "El asíndeton suprime conjunciones para dar dinamismo; combinado con el tricolon (tres elementos) produce el efecto aforístico de la frase."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el quiasmo y cuál es su efecto? (la enumeración de elementos/la repetición de la misma palabra/la estructura cruzada AB-BA → 'Cuando tenía hambre, no había pan; cuando había pan, no tenía hambre' → crea simetría invertida con valor paradójico o irónico)"
        correctAnswer: la estructura cruzada AB-BA → 'Cuando tenía hambre, no había pan; cuando había pan, no tenía hambre' → crea simetría invertida con valor paradójico o irónico
        rationale: "El quiasmo (del griego χ, 'chi') dispone los elementos en orden invertido en la segunda parte, produciendo un efecto de espejo semántico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el zeugma y cómo funciona? (la repetición de conjunciones/una metáfora extendida/la construcción en que un único verbo o modificador rige a varios sustantivos con sentidos diferentes → 'Perdió el partido y la cabeza' → 'perder' significa literalmente para 'partido' y figuradamente para 'cabeza')"
        correctAnswer: la construcción en que un único verbo o modificador rige a varios sustantivos con sentidos diferentes → 'Perdió el partido y la cabeza' → 'perder' significa literalmente para 'partido' y figuradamente para 'cabeza'
        rationale: "El zeugma (o silepsis) aplica un elemento sintáctico con distintos sentidos a los coordinados; puede ser cómico o irónico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la anadiplosis como figura retórica? (la inversión del orden/la omisión del sujeto/la repetición al comienzo de un miembro del final del anterior → 'Nace el alba; el alba trae esperanza; la esperanza sostiene la vida' → encadenamiento progresivo)"
        correctAnswer: la repetición al comienzo de un miembro del final del anterior → 'Nace el alba; el alba trae esperanza; la esperanza sostiene la vida' → encadenamiento progresivo
        rationale: "La anadiplosis crea una cadena en que cada eslabón retoma la última palabra del anterior; si se extiende a toda una serie, se llama concatenación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue la paronomasia del calambur? (son idénticos/la paronomasia juega con palabras de sonido similar pero diferente significado → 'Un necio habla necio'; el calambur redistribuye los límites silábicos → 'Oro no es, plata no es / el que no lo adivinara / bien tonto es' (plátano es)/la paronomasia es fonética y el calambur es gráfico)"
        correctAnswer: la paronomasia juega con palabras de sonido similar pero diferente significado → 'Un necio habla necio'; el calambur redistribuye los límites silábicos → 'Oro no es, plata no es / el que no lo adivinara / bien tonto es' (plátano es)
        rationale: "Ambas son figuras fónicas: la paronomasia explota parecidos léxicos; el calambur crea nuevas palabras al reagrupar sílabas de unidades distintas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la epanadiplosis como figura de construcción? (la supresión del verbo/la figura en que el mismo elemento abre y cierra el período → 'Verde que te quiero verde' (García Lorca) → la repetición del elemento inicial al final crea un efecto de marco y énfasis circular/la omisión de conjunciones)"
        correctAnswer: la figura en que el mismo elemento abre y cierra el período → 'Verde que te quiero verde' (García Lorca) → la repetición del elemento inicial al final crea un efecto de marco y énfasis circular
        rationale: "La epanadiplosis (o complexio) es una figura de posición que enmarca el enunciado con la misma palabra o sintagma al inicio y al final."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la polisíndeton y cuál es su efecto estilístico opuesto al asíndeton? (la eliminación de conjunciones/la multiplicación de conjunciones → 'Y reía y cantaba y saltaba y corría' → ralentiza el ritmo, acumula sensaciones, crea efectos de abundancia o agobio opuestos al dinamismo del asíndeton/la inversión del orden)"
        correctAnswer: la multiplicación de conjunciones → 'Y reía y cantaba y saltaba y corría' → ralentiza el ritmo, acumula sensaciones, crea efectos de abundancia o agobio opuestos al dinamismo del asíndeton
        rationale: "Polisíndeton y asíndeton son figuras de omisión-adición opuestas: la primera multiplica coordinantes, la segunda los suprime."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el estilo indirecto libre y cómo se distingue del estilo directo e indirecto? (una cita textual entre comillas/una forma híbrida en que la voz del narrador y la del personaje se funden sin marcadores explícitos → 'Se marchó. ¿Por qué siempre la dejaban sola?' → sin 'dijo que' ni comillas, la pregunta es interior del personaje/un sinónimo del monólogo interior)"
        correctAnswer: una forma híbrida en que la voz del narrador y la del personaje se funden sin marcadores explícitos → 'Se marchó. ¿Por qué siempre la dejaban sola?' → sin 'dijo que' ni comillas, la pregunta es interior del personaje
        rationale: "El estilo indirecto libre (free indirect discourse) es propio de la novela moderna desde Flaubert; en español fue maestro Clarín en La Regenta."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Figuras Semánticas y Cohesión Estilística
    exercises:
      - type: grammar
        question: "¿Qué es la sinestesia como figura semántica? (la comparación entre dos objetos/la transferencia de una percepción sensorial a otra modalidad → 'voces de colores', 'silencio atronador' → un adjetivo visual modifica un sustantivo auditivo o viceversa/la repetición de sonidos)"
        correctAnswer: la transferencia de una percepción sensorial a otra modalidad → 'voces de colores', 'silencio atronador' → un adjetivo visual modifica un sustantivo auditivo o viceversa
        rationale: "La sinestesia (del griego 'percepción simultánea') mezcla dominios sensoriales; fue muy cultivada por los poetas simbolistas y modernistas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue la catacresis de la metáfora ordinaria? (son idénticas/la catacresis es una metáfora lexicalizada que ha perdido su carácter figurado → 'las patas de la mesa', 'la boca del río' → el origen metafórico ya no se percibe como tal/la catacresis es más poética)"
        correctAnswer: la catacresis es una metáfora lexicalizada que ha perdido su carácter figurado → 'las patas de la mesa', 'la boca del río' → el origen metafórico ya no se percibe como tal
        rationale: "La catacresis (o metáfora muerta) es una extensión semántica necesaria que cubre un hueco léxico; la metáfora fresca, en cambio, se percibe como desviación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la isotopía en el análisis estilístico? (la repetición de sonidos/la recurrencia de un mismo campo semántico o conjunto de semas a lo largo de un texto → en un poema sobre el mar, 'olas', 'sal', 'horizonte', 'naufragio' son isotopía acuática → crea coherencia temática/un tipo de rima)"
        correctAnswer: la recurrencia de un mismo campo semántico o conjunto de semas a lo largo de un texto → en un poema sobre el mar, 'olas', 'sal', 'horizonte', 'naufragio' son isotopía acuática → crea coherencia temática
        rationale: "El concepto de isotopía fue introducido por Greimas; es fundamental para el análisis semiótico de la cohesión textual y la interpretación simbólica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el símbolo literario y cómo se diferencia de la alegoría? (son lo mismo/el símbolo tiene un significado connotativo plural y no del todo codificado → 'la rosa' puede evocar amor, belleza, fugacidad o misterio; la alegoría tiene una equivalencia fija y codificada → 'la muerte es el segador'/el símbolo es siempre visual)"
        correctAnswer: el símbolo tiene un significado connotativo plural y no del todo codificado → 'la rosa' puede evocar amor, belleza, fugacidad o misterio; la alegoría tiene una equivalencia fija y codificada → 'la muerte es el segador'
        rationale: "La diferencia clave: el símbolo es abierto y sugestivo; la alegoría es un código cerrado donde A siempre significa B."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el ritmo en la prosa literaria, distinto del metro poético? (solo existe en poesía/la organización de los acentos, pausas y longitud de los períodos que crea cadencia sin necesidad de cómputo silábico → la prosa rítmica de Valle-Inclán o Borges usa bimembración, cláusulas con acento final, paralelismos/el ritmo en prosa es un error)"
        correctAnswer: la organización de los acentos, pausas y longitud de los períodos que crea cadencia sin necesidad de cómputo silábico → la prosa rítmica de Valle-Inclán o Borges usa bimembración, cláusulas con acento final, paralelismos
        rationale: "La prosa rítmica (cursus, en la retórica latina) organiza los finales de cláusula según patrones acentuales; en español hay tradición desde Alfonso X."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la cohesión estilística en un texto literario? (la corrección gramatical/el conjunto de procedimientos que crean unidad de tono, registro y estilo → la recurrencia léxica, la isotopía semántica, el mantenimiento de la persona gramatical y el tiempo verbal contribuyen a que el texto 'suene' coherente como totalidad/la ausencia de figuras retóricas)"
        correctAnswer: el conjunto de procedimientos que crean unidad de tono, registro y estilo → la recurrencia léxica, la isotopía semántica, el mantenimiento de la persona gramatical y el tiempo verbal contribuyen a que el texto 'suene' coherente como totalidad
        rationale: "La cohesión estilística es el componente del estilo que unifica el texto: un cambio brusco de registro o isotopía rompe la coherencia estilística."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la hipálage y cuál es su efecto? (la exageración/la transferencia de un epíteto desde el sustantivo al que lógicamente pertenece a otro contiguo → 'el labrador siembra los cansados surcos' (los surcos no están cansados, lo está el labrador) → produce condensación expresiva/la comparación entre iguales)"
        correctAnswer: la transferencia de un epíteto desde el sustantivo al que lógicamente pertenece a otro contiguo → 'el labrador siembra los cansados surcos' (los surcos no están cansados, lo está el labrador) → produce condensación expresiva
        rationale: "La hipálage desplaza el calificativo de su portador lógico a otro elemento de la oración; crea un efecto de sinestesia lógica o desplazamiento semántico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el oxímoron y en qué difiere de la paradoja? (son sinónimos/el oxímoron une dos términos contradictorios en una expresión condensada → 'oscura claridad', 'hielo abrasador' (Quevedo); la paradoja es una afirmación aparentemente absurda que encierra una verdad profunda → 'Muero porque no muero' (Santa Teresa)/el oxímoron es más largo)"
        correctAnswer: el oxímoron une dos términos contradictorios en una expresión condensada → 'oscura claridad', 'hielo abrasador' (Quevedo); la paradoja es una afirmación aparentemente absurda que encierra una verdad profunda → 'Muero porque no muero' (Santa Teresa)
        rationale: "Oxímoron y paradoja explotan la contradicción: el oxímoron lo hace en el nivel léxico-sintagmático; la paradoja en el nivel proposicional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la écfrasis en la literatura? (una figura de repetición/la descripción literaria detallada de una obra de arte visual → la descripción del escudo de Aquiles en la Ilíada es el modelo canónico; en literatura española, las écfrasis de Gracián y Calderón describen pinturas y emblemas → el texto verbaliza lo visual/una forma de resumen)"
        correctAnswer: la descripción literaria detallada de una obra de arte visual → la descripción del escudo de Aquiles en la Ilíada es el modelo canónico; en literatura española, las écfrasis de Gracián y Calderón describen pinturas y emblemas → el texto verbaliza lo visual
        rationale: "La écfrasis (del griego 'descripción') es un género retórico antiguo que en la literatura moderna se extiende a cualquier descripción vívida de un objeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se distingue estilísticamente el acumulatio de la simple enumeración? (son idénticos/el acumulatio acumula términos con propósito de amplificación retórica y efecto de abundancia o agobio → 'Todo eran gritos, llantos, carreras, confusión, humo, ruido, terror y muerte' → la intensidad crece hacia el final; la enumeración es neutra y no necesariamente amplificadora/el acumulatio es más corto)"
        correctAnswer: el acumulatio acumula términos con propósito de amplificación retórica y efecto de abundancia o agobio → 'Todo eran gritos, llantos, carreras, confusión, humo, ruido, terror y muerte' → la intensidad crece hacia el final; la enumeración es neutra y no necesariamente amplificadora
        rationale: "El acumulatio (o congeries) distingue la amplificación retórica de la mera enumeración: la intensidad crece hacia un clímax; la enumeración descriptiva es neutra."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
