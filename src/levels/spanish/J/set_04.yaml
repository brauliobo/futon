pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La física moderna del siglo XX transformó radicalmente nuestra comprensión del universo. La relatividad especial (Einstein, 1905) estableció que la velocidad de la luz es constante en todos los sistemas de referencia inerciales, que la masa y la energía son equivalentes (E=mc²) y que el tiempo y el espacio son relativos al observador. La relatividad general (1915) describió la gravedad como curvatura del espacio-tiempo causada por la masa: los objetos de gran masa deforman el tejido del espacio-tiempo, y los demás objetos siguen geodésicas (caminos más cortos) en ese espacio curvo. En 1929, Edwin Hubble observó que las galaxias se alejan entre sí con una velocidad proporcional a su distancia, demostrando que el universo se expande. Retrocediendo esta expansión, se llega al Big Bang, el estado inicial de alta densidad y temperatura del que emergió el universo hace aproximadamente 13.800 millones de años. La radiación cósmica de microondas (CMB), detectada en 1965, es el 'eco' del Big Bang: la luz más antigua del universo. La composición del universo presenta un enigma: solo el 5% es materia visible (barionica); el 27% es materia oscura (detectada por sus efectos gravitacionales pero no emitiendo ni absorbiendo luz) y el 68% es energía oscura (que impulsa la expansión acelerada del universo). Los agujeros negros —regiones donde la gravedad es tan intensa que ni la luz puede escapar— pueden formarse por el colapso de estrellas masivas; el horizonte de eventos es el punto de no retorno. En 2019, el Telescopio de Horizonte de Eventos capturó la primera imagen de un agujero negro (en la galaxia M87)."
