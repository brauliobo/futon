authorNotes: "Texto expositivo sobre física moderna y cosmología: relatividad especial y general (Einstein), la constante cosmológica, la expansión del universo (Hubble), la materia y la energía oscura, los agujeros negros, la radiación de fondo de microondas y el horizonte del Big Bang."
example: "relatividad especial (Einstein 1905): E=mc² → relatividad general (1915): gravedad = curvatura espacio-tiempo → Big Bang: expansión → CMB como evidencia → materia oscura: curvas de rotación galácticas → energía oscura: expansión acelerada → agujeros negros: singularidades predichas por relatividad general."
