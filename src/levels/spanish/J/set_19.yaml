        question: "¿Por qué el sesgo algorítmico es especialmente problemático en sistemas de IA de alto riesgo? (porque ralentiza los algoritmos/porque decisiones de contratación, crédito, justicia penal o medicina basadas en IA sesgada pueden perpetuar discriminaciones sistémicas con consecuencias graves sobre grupos vulnerables/porque aumenta los costes de computación)"
        correctAnswer: porque decisiones de contratación, crédito, justicia penal o medicina basadas en IA sesgada pueden perpetuar discriminaciones sistémicas con consecuencias graves sobre grupos vulnerables
        rationale: "El sesgo algorítmico en sistemas de alto riesgo amplifica las desigualdades: los errores no son aleatorios sino sistemáticamente desfavorables para ciertos grupos."
