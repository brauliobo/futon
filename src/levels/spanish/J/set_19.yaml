        correctAnswer: problemas de derechos de autor (entrenamiento con obras protegidas), desinformación mediante deepfakes y cuestionamiento de la autenticidad de contenidos digitales
        rationale: "El texto: 'La IA generativa plantea problemas de derechos de autor, desinformación (deepfakes) y autenticidad'."
