authorNotes: "Texto expositivo sobre IA y sociedad: IA débil vs. fuerte, el test de Turing, el problema de alineación (Bostrom), el riesgo existencial, el dilema del tranvía aplicado a la IA, el sesgo algorítmico, la IA generativa, los modelos de lenguaje (LLMs), el debate sobre conciencia en sistemas artificiales y las propuestas regulatorias (Acto de IA de la UE)."
example: "Lee con atención a los conceptos técnicos de la IA, los argumentos filosóficos sobre la conciencia y los marcos regulatorios propuestos."
