pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La inteligencia artificial (IA) es el campo de la informática que desarrolla sistemas capaces de realizar tareas que típicamente requieren inteligencia humana. La distinción entre IA débil (narrow AI: sistemas especializados en una tarea) e IA fuerte (AGI: inteligencia artificial general comparable a la humana) es fundamental. Alan Turing propuso en 1950 el test de Turing: si una máquina mantiene una conversación indistinguible de la humana, puede considerarse 'inteligente'. Los grandes modelos de lenguaje (LLMs) como GPT pasan el test en muchos contextos, pero no poseen comprensión genuina según el argumento del cuarto chino de Searle: manipulan símbolos sin entender semántica. Nick Bostrom articula el problema de alineación: una IA superinteligente podría optimizar objetivos que no coinciden con los valores humanos (el 'problema del genio maligno'). El sesgo algorítmico ocurre cuando los sistemas de IA reproducen o amplifican discriminaciones presentes en los datos de entrenamiento: los sistemas de reconocimiento facial tienen tasas de error más altas en personas negras. La IA generativa (imágenes, texto, audio) plantea problemas de derechos de autor, desinformación (deepfakes) y autenticidad. El Acto de IA de la UE (2024) introduce un enfoque basado en riesgos: IA de riesgo inaceptable (prohibida), alto riesgo (regulada), riesgo limitado y riesgo mínimo. El debate filosófico sobre si los sistemas de IA pueden tener conciencia, dolor o derechos morales permanece abierto: los funcionalistas sostienen que si el sistema funciona como un ser consciente, lo es; los naturalistas biológicos (Searle) lo niegan."
    exercises:
      - type: reading
        question: "¿Qué distingue la IA débil (narrow AI) de la IA fuerte (AGI)? (la velocidad de procesamiento/la IA débil está especializada en una tarea concreta; la AGI sería una inteligencia general comparable en amplitud y flexibilidad a la inteligencia humana/el coste computacional)"
        correctAnswer: la IA débil está especializada en una tarea concreta; la AGI sería una inteligencia general comparable en amplitud y flexibilidad a la inteligencia humana
        rationale: "El texto: 'IA débil (narrow AI: sistemas especializados en una tarea) e IA fuerte (AGI: inteligencia artificial general comparable a la humana)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué postula el argumento del cuarto chino de Searle sobre los LLMs? (que los LLMs son conscientes/que manipular símbolos según reglas sintácticas no implica comprensión semántica genuina: un sistema puede responder correctamente sin entender el significado/que el test de Turing prueba la conciencia)"
        correctAnswer: que manipular símbolos según reglas sintácticas no implica comprensión semántica genuina: un sistema puede responder correctamente sin entender el significado
        rationale: "El texto: 'no poseen comprensión genuina según el argumento del cuarto chino de Searle: manipulan símbolos sin entender semántica'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué consiste el problema de alineación según Bostrom? (que la IA es demasiado lenta/que una IA superinteligente podría optimizar objetivos que no coinciden con los valores humanos, con consecuencias catastróficas para la humanidad/que la IA no puede aprender)"
        correctAnswer: que una IA superinteligente podría optimizar objetivos que no coinciden con los valores humanos, con consecuencias catastróficas para la humanidad
        rationale: "El texto: 'Bostrom articula el problema de alineación: una IA superinteligente podría optimizar objetivos que no coinciden con los valores humanos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es el enfoque del Acto de IA de la UE (2024) para regular la inteligencia artificial? (prohibir toda IA/un enfoque basado en riesgos que clasifica la IA en cuatro niveles: riesgo inaceptable (prohibida), alto riesgo (regulada), riesgo limitado y riesgo mínimo/regular solo los deepfakes)"
        correctAnswer: un enfoque basado en riesgos que clasifica la IA en cuatro niveles: riesgo inaceptable (prohibida), alto riesgo (regulada), riesgo limitado y riesgo mínimo
        rationale: "El texto: 'El Acto de IA de la UE introduce un enfoque basado en riesgos: IA de riesgo inaceptable (prohibida), alto riesgo (regulada), riesgo limitado y riesgo mínimo'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué problema concreto de sesgo algorítmico menciona el texto? (que la IA no entiende el humor/que los sistemas de reconocimiento facial tienen tasas de error más altas en personas negras, reproduciendo discriminaciones raciales presentes en los datos de entrenamiento/que la IA favorece a los jóvenes)"
        correctAnswer: que los sistemas de reconocimiento facial tienen tasas de error más altas en personas negras, reproduciendo discriminaciones raciales presentes en los datos de entrenamiento
        rationale: "El texto: 'los sistemas de reconocimiento facial tienen tasas de error más altas en personas negras' como ejemplo de sesgo algorítmico."
