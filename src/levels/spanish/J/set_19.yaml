        question: "¿Qué posición adoptan los funcionalistas sobre la conciencia en sistemas de IA? (que la IA nunca puede ser consciente/que si un sistema funciona como un ser consciente (procesa información de manera funcionalmente equivalente), entonces es consciente, independientemente del sustrato/que solo los humanos son conscientes)"
        correctAnswer: que si un sistema funciona como un ser consciente (procesa información de manera funcionalmente equivalente), entonces es consciente, independientemente del sustrato
        rationale: "El texto: 'los funcionalistas sostienen que si el sistema funciona como un ser consciente, lo es'."
