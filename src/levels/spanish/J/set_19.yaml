      - type: reading
        question: "¿Qué propuso Alan Turing en 1950 y cuál es su limitación para evaluar la IA actual? (una máquina para calcular/el test de Turing: si una máquina mantiene una conversación indistinguible de la humana, puede considerarse inteligente; su limitación es que los LLMs lo pasan en muchos contextos sin tener comprensión genuina según Searle/un sistema de clasificación de riesgos)"
        correctAnswer: el test de Turing: si una máquina mantiene una conversación indistinguible de la humana, puede considerarse inteligente; su limitación es que los LLMs lo pasan en muchos contextos sin tener comprensión genuina según Searle
        rationale: "El texto combina el test de Turing con el argumento del cuarto chino para mostrar la tensión entre comportamiento externo y comprensión interna."
        difficulty: 5
