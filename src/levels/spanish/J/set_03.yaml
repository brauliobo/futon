title: 📝 Gramática - Teoría Literaria Contemporánea
level: J
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Teoría literaria: New Criticism (close reading, ironía, ambigüedad, tensión). Estructuralismo (Jakobson, función poética, Greimas, actantes). Narratología (Genette: narrador, focalización, tiempo, analepsis/prolepsis, ritmo, voz). Deconstrucción (Derrida: différance, logocentrismo, trace). Crítica feminista (Showalter, Butler: performatividad del género). Poscolonialismo (Said: orientalismo, Bhabha: hibridez, Spivak: subalternidad). Ecocrítica. Teoría de la recepción (Jauss, Iser: lector implícito, horizonte de expectativas)."
example: "focalización → narratología de Genette: focalización cero (narrador omnisciente sabe más que el personaje); focalización interna (narrador = personaje, sabe lo mismo); focalización externa (narrador sabe menos que el personaje). deconstrucción → 'todo texto contiene su propia subversión': el significado es siempre diferido (différance). horizonte de expectativas → el lector llega al texto con expectativas genéricas e históricas → la obra innovadora quiebra el horizonte → produce extrañeza estética. orientalismo → Said: Occidente construye el 'Oriente' como objeto de estudio y dominio → el discurso colonial produce conocimiento que legitima la dominación."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Teoría Literaria - Corrientes Principales
    description: Identifica los conceptos centrales de las corrientes teóricas literarias.
    exercises:
      - type: grammar
        question: "¿Qué es la focalización cero en narratología (Genette)? (el lector no sabe nada/no hay narrador/el narrador omnisciente sabe más que cualquier personaje: conoce pensamientos, pasado y futuro de todos → perspectiva típica de la novela realista del siglo XIX)"
        correctAnswer: "el narrador omnisciente sabe más que cualquier personaje: conoce pensamientos, pasado y futuro de todos → perspectiva típica de la novela realista del siglo XIX"
        rationale: "Genette: focalización cero (omnisciencia) / interna (perspectiva del personaje) / externa (menos información que el personaje) → la focalización puede cambiar a lo largo de la obra."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la différance en la deconstrucción de Derrida? (un error tipográfico/neologismo que combina 'différer' (diferir en tiempo) y 'différer' (diferir de): el significado nunca es presente y pleno → siempre está diferido y marcado por la diferencia de otros signos/un tipo de ambigüedad)"
        correctAnswer: "neologismo que combina 'différer' (diferir en tiempo) y 'différer' (diferir de): el significado nunca es presente y pleno → siempre está diferido y marcado por la diferencia de otros signos"
        rationale: "Derrida: la différance critica el logocentrismo (ilusión de la presencia plena del significado) → el significado es siempre una huella (trace) de otros signos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el horizonte de expectativas en la estética de la recepción (Jauss)? (el final esperado/el público previsto por el autor/el conjunto de expectativas literarias, genéricas e históricas que el lector trae al texto: la obra innovadora quiebra el horizonte → produce extrañeza y amplía la experiencia estética)"
        correctAnswer: "el conjunto de expectativas literarias, genéricas e históricas que el lector trae al texto: la obra innovadora quiebra el horizonte → produce extrañeza y amplía la experiencia estética"
        rationale: "Jauss: la obra se recibe en relación con el horizonte de expectativas → la distancia estética mide la innovación → obras que confirman el horizonte son 'culinaristas' (entretenimiento)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el orientalismo según Edward Said? (el turismo cultural/el estudio académico de oriente/la construcción discursiva del 'Oriente' por Occidente: un sistema de representaciones que produce y reproduce el 'Oriente' como objeto de estudio, exotismo y dominio → el conocimiento colonial legitima la dominación)"
        correctAnswer: "la construcción discursiva del 'Oriente' por Occidente: un sistema de representaciones que produce y reproduce el 'Oriente' como objeto de estudio, exotismo y dominio → el conocimiento colonial legitima la dominación"
        rationale: "Said (Orientalism, 1978): el orientalismo no describe una realidad → la construye → fundamento del pensamiento poscolonial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la analepsis en narratología? (el adelanto de eventos futuros/el relato de eventos pasados respecto al momento presente de la narración (flashback): el texto vuelve atrás para dar información sobre lo ocurrido antes → puede ser externa (anterior a la historia) o interna/la descripción del pasado del autor)"
        correctAnswer: "el relato de eventos pasados respecto al momento presente de la narración (flashback): el texto vuelve atrás para dar información sobre lo ocurrido antes → puede ser externa (anterior a la historia) o interna"
        rationale: "Genette: analepsis (hacia atrás) vs. prolepsis (hacia adelante) → el orden del discurso narrativo puede divergir del orden de la historia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué propone la performatividad del género de Judith Butler? (que el género es una elección libre/que el género es biológico/que el género no es una identidad esencial sino una actuación repetida: los actos, gestos y comportamientos producen el efecto de un género interior que en realidad no precede a su performance)"
        correctAnswer: "que el género no es una identidad esencial sino una actuación repetida: los actos, gestos y comportamientos producen el efecto de un género interior que en realidad no precede a su performance"
        rationale: "Butler (Gender Trouble, 1990): la performatividad no es una elección voluntaria sino una repetición de normas culturales que constituyen la identidad de género."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la hibridez cultural en el pensamiento poscolonial de Homi Bhabha? (la mezcla biológica/el espacio 'tercer': el sujeto colonial, entre la cultura dominante y la propia, produce una identidad híbrida que subvierte la pureza de ambas culturas → ni completamente colonizador ni colonizado/la asimilación cultural)"
        correctAnswer: "el espacio 'tercer': el sujeto colonial, entre la cultura dominante y la propia, produce una identidad híbrida que subvierte la pureza de ambas culturas → ni completamente colonizador ni colonizado"
        rationale: "Bhabha: la hibridez no es síntesis sino ambivalencia → el 'tercer espacio' es un lugar de enunciación que desestabiliza la autoridad colonial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el close reading del New Criticism? (leer lentamente/el análisis riguroso del texto en sí mismo, sin referencia al autor ni al contexto histórico: atiende a la ironía, la ambigüedad, la tensión y la paradoja como portadoras del significado poético/la lectura en voz alta)"
        correctAnswer: "el análisis riguroso del texto en sí mismo, sin referencia al autor ni al contexto histórico: atiende a la ironía, la ambigüedad, la tensión y la paradoja como portadoras del significado poético"
        rationale: "New Criticism (Brooks, Wimsatt): la intención del autor es una falacia (intentional fallacy) → el poema es un artefacto autónomo cuyo significado emerge de su estructura interna."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la subalternidad en el pensamiento de Gayatri Spivak? (pobreza extrema/la condición del sujeto colonial que carece de voz en el discurso hegemónico: 'Can the subaltern speak?' → argumenta que el sujeto subalterno no puede hablar sin ser traducido/apropiado por las estructuras de poder dominantes/la clase trabajadora occidental)"
        correctAnswer: "la condición del sujeto colonial que carece de voz en el discurso hegemónico: 'Can the subaltern speak?' → argumenta que el sujeto subalterno no puede hablar sin ser traducido/apropiado por las estructuras de poder dominantes"
        rationale: "Spivak: la subalterno pierde su voz al ser representada por el intelectual occidental → crítica a la capacidad de los estudios poscoloniales de dar voz al 'otro'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los actantes en el modelo narrativo de Greimas? (los personajes de la novela/los roles funcionales en la estructura profunda del relato: sujeto (busca), objeto (buscado), donante, ayudante, oponente, destinatario → cualquier personaje puede ocupar varios actantes/los narradores de la historia)"
        correctAnswer: "los roles funcionales en la estructura profunda del relato: sujeto (busca), objeto (buscado), donante, ayudante, oponente, destinatario → cualquier personaje puede ocupar varios actantes"
        rationale: "Greimas: el modelo actancial reduce la diversidad de personajes a seis roles estructurales → basado en la morfología del cuento de Propp."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Aplicación de la Teoría Literaria
    description: Aplica las herramientas de la teoría literaria al análisis de textos.
    exercises:
      - type: grammar
        question: "¿Cómo analiza el feminismo literario la representación de la mujer en la literatura canónica? (positivamente/como objeto de la mirada masculina (male gaze) y no como sujeto: las mujeres en la literatura canónica son definidas por su relación con el hombre → la crítica feminista propone una revisión del canon y el rescate de escritoras silenciadas/como complemento del hombre)"
        correctAnswer: "como objeto de la mirada masculina (male gaze) y no como sujeto: las mujeres en la literatura canónica son definidas por su relación con el hombre → la crítica feminista propone una revisión del canon y el rescate de escritoras silenciadas"
        rationale: "Showalter (gynocriticism): análisis de la escritura de mujeres como tradición propia → además de la crítica de la representación androcéntrica en textos de hombres."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo aplica Genette la distinción histoire/récit/narration al análisis narrativo? (no hay distinción/histoire: los eventos tal como ocurrieron en el mundo de la ficción; récit: el texto narrativo tal como está escrito; narration: el acto de narrar → permite analizar las distorsiones entre el orden y la duración de los eventos y su representación/son sinónimos)"
        correctAnswer: "histoire: los eventos tal como ocurrieron en el mundo de la ficción; récit: el texto narrativo tal como está escrito; narration: el acto de narrar → permite analizar las distorsiones entre el orden y la duración de los eventos y su representación"
        rationale: "Genette: la distinción histoire/récit/narration es el fundamento de la narratología moderna → permite describir la analepsis, prolepsis, elipsis y pausa narrativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué un poema en el que 'el mar' puede significar a la vez 'la muerte' y 'la libertad' ilustra la ambigüedad del New Criticism? (porque es largo/porque la ambigüedad es productiva: el significado no se reduce a una lectura → la tensión entre lecturas enriquece el poema → el New Criticism valora esta indeterminación como rasgo de la gran literatura/porque viola las reglas gramaticales)"
        correctAnswer: "porque la ambigüedad es productiva: el significado no se reduce a una lectura → la tensión entre lecturas enriquece el poema → el New Criticism valora esta indeterminación como rasgo de la gran literatura"
        rationale: "New Criticism: Empson, 'Seven Types of Ambiguity' → la ambigüedad no es defecto sino virtud poética → el texto literario se distingue por la densidad semántica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo aplica la ecocrítica la teoría literaria al texto? (analizando la biología de los autores/estudiando la representación de la naturaleza en los textos: cómo el lenguaje literario construye el medioambiente, reproduce ideologías ecológicas o puede fomentar una conciencia ambiental/solo en poesía)"
        correctAnswer: "estudiando la representación de la naturaleza en los textos: cómo el lenguaje literario construye el medioambiente, reproduce ideologías ecológicas o puede fomentar una conciencia ambiental"
        rationale: "Ecocrítica: surge en los años 1990 → el análisis del locus amoenus vs. el paisaje industrializado o la naturaleza como recurso revela ideologías medioambientales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el lector implícito en la teoría de la recepción de Wolfgang Iser? (el lector real del libro/la figura del lector construida por el texto mismo: el texto llena los 'blancos' que el lector debe completar activamente → la lectura es una colaboración entre el texto y el lector/el autor del texto)"
        correctAnswer: "la figura del lector construida por el texto mismo: el texto llama los 'blancos' que el lector debe completar activamente → la lectura es una colaboración entre el texto y el lector"
        rationale: "Iser: el texto tiene 'blancos' (Leerstellen) que el lector llena con su imaginación → la lectura es un proceso activo de construcción de sentido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo analiza el poscolonialismo el canon literario occidental? (lo considera universal y objetivo/como una construcción que excluye sistemáticamente las literaturas no europeas y reproduce el imaginario colonial: la literatura 'universal' es mayoritariamente europea/anglosajona/como una valoración puramente estética)"
        correctAnswer: "como una construcción que excluye sistemáticamente las literaturas no europeas y reproduce el imaginario colonial: la literatura 'universal' es mayoritariamente europea/anglosajona"
        rationale: "Said/Spivak: el canon literario refleja relaciones de poder → la inclusión de literaturas poscoloniales en los programas académicos es un gesto político."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la velocidad narrativa (ritmo) en Genette? (el número de páginas/la relación entre el tiempo de la historia y el espacio del relato: escena (tiempo = espacio), sumario (meses en una página), elipsis (tiempo omitido), pausa (descripción detiene la acción)/el número de capítulos)"
        correctAnswer: "la relación entre el tiempo de la historia y el espacio del relato: escena (tiempo = espacio), sumario (meses en una página), elipsis (tiempo omitido), pausa (descripción detiene la acción)"
        rationale: "Ritmo narrativo: el análisis del ritmo revela las prioridades narrativas → las escenas detallan lo dramáticamente relevante; los sumarios comprimen lo rutinario."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la función poética del lenguaje en Jakobson? (la función informativa/el predominio de la forma del mensaje sobre su contenido: la atención se dirige hacia el signo mismo → en poesía, la selección y combinación de fonemas y palabras crea una densidad estética que diferencia el lenguaje poético del cotidiano/la función emotiva)"
        correctAnswer: "el predominio de la forma del mensaje sobre su contenido: la atención se dirige hacia el signo mismo → en poesía, la selección y combinación de fonemas y palabras crea una densidad estética que diferencia el lenguaje poético del cotidiano"
        rationale: "Jakobson: seis funciones del lenguaje → la función poética predomina en literatura, pero coexiste con otras → 'el mensaje por el mensaje mismo'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la deconstrucción cuestiona las oposiciones binarias en el análisis literario? (porque son irrelevantes/porque toda oposición (presencia/ausencia, naturaleza/cultura, hombre/mujer) privilegia el primer término → la deconstrucción invierte y luego desestabiliza la jerarquía, mostrando que los términos se definen mutuamente y se contaminan/porque son anticuadas)"
        correctAnswer: porque toda oposición (presencia/ausencia, naturaleza/cultura, hombre/mujer) privilegia el primer término → la deconstrucción invierte y luego desestabiliza la jerarquía, mostrando que los términos se definen mutuamente y se contaminan
        rationale: "Derrida: el logocentrismo opera mediante oposiciones jerárquicas → la deconstrucción no invierte simplemente sino que muestra la inestabilidad de toda oposición."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre autor implícito y narrador según la teoría narrativa? (son el mismo/autor implícito: la imagen del autor que el texto proyecta (sus valores y visión del mundo), inferida por el lector; narrador: la voz que cuenta la historia dentro del relato → en una novela irónica, el narrador puede ser poco fiable/el autor implícito es el real)"
        correctAnswer: "autor implícito: la imagen del autor que el texto proyecta (sus valores y visión del mundo), inferida por el lector; narrador: la voz que cuenta la historia dentro del relato → en una novela irónica, el narrador puede ser poco fiable"
        rationale: "Booth (The Rhetoric of Fiction): autor implícito ≠ narrador ≠ autor real → el narrador no fiable (unreliable narrator) crea ironía dramática cuando el lector sabe más que el narrador."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
