title: 🔬 Gramática - Neurolingüística y Patologías del Lenguaje
level: J
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Neurolingüística: áreas de Broca y Wernicke, fascículo arqueado, lateralización hemisférica, modelos de procesamiento lingüístico (TRACE, Cohort, Logogen). Afasias: Broca (no fluida, agrametismo), Wernicke (fluida, parafasias), anómica, de conducción, global. Dislexia: tipos (fonológica, superficial, profunda). Disfasia/trastorno específico del lenguaje (TEL). Mutismo selectivo. Trastornos de la comunicación en el autismo (TEA). Evaluación del lenguaje. Intervención logopédica."
example: "afasia de Broca → lesión área de Broca (F3 izquierdo): lenguaje telegráfico, agramatismo ('Juan... ir... tienda'), comprensión relativamente preservada. afasia de Wernicke → lesión área de Wernicke (T1 izquierdo): habla fluida pero con parafasias ('kaso' en lugar de 'caso'), comprensión gravemente afectada. dislexia fonológica → dificultad para decodificar palabras nuevas o pseudopalabras usando las reglas de correspondencia grafema-fonema; dislexia superficial → dificultad con palabras irregulares, conserva la ruta fonológica. lateralización → 95% de los diestros tienen lenguaje en el hemisferio izquierdo; en zurdos hay mayor variabilidad."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Neurolingüística - Bases Neurales del Lenguaje
    description: Identifica las bases neurales del lenguaje y los principales trastornos lingüísticos.
    exercises:
      - type: grammar
        question: "¿Cuál es la diferencia entre la afasia de Broca y la de Wernicke? (Broca afecta la escritura y Wernicke el habla/Broca: lesión frontal izquierda → habla telegráfica y agrametismo, comprensión relativamente preservada; Wernicke: lesión temporal izquierda → habla fluida con parafasias, comprensión gravemente afectada/Broca afecta solo el vocabulario)"
        correctAnswer: "Broca: lesión frontal izquierda → habla telegráfica y agrametismo, comprensión relativamente preservada; Wernicke: lesión temporal izquierda → habla fluida con parafasias, comprensión gravemente afectada"
        rationale: "Afasias: la disociación Broca/Wernicke es fundamental → Broca afecta la producción (morfosintaxis); Wernicke, la comprensión y la selección léxica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el agramatismo en la afasia de Broca? (ausencia de vocabulario/la dificultad para producir morfología gramatical: omisión de afijos, artículos, preposiciones y auxiliares → habla telegráfica: 'Juan... ir... tienda' en lugar de 'Juan fue a la tienda'/la dificultad para comprender)"
        correctAnswer: "la dificultad para producir morfología gramatical: omisión de afijos, artículos, preposiciones y auxiliares → habla telegráfica: 'Juan... ir... tienda' en lugar de 'Juan fue a la tienda'"
        rationale: "Agramatismo: selectivamente afecta la morfología funcional → el léxico de contenido se preserva mejor → evidencia de la disociación entre léxico y gramática en el cerebro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una parafasia en los trastornos del lenguaje? (una palabra rebuscada/una sustitución de una palabra o fonema por otro: parafasia semántica ('mesa' en lugar de 'silla'); parafasia fonológica ('kaso' en lugar de 'caso'); parafasia neologística (palabra inventada) → frecuentes en la afasia de Wernicke/una pronunciación dialectal)"
        correctAnswer: "una sustitución de una palabra o fonema por otro: parafasia semántica ('mesa' en lugar de 'silla'); parafasia fonológica ('kaso' en lugar de 'caso'); parafasia neologística (palabra inventada) → frecuentes en la afasia de Wernicke"
        rationale: "Parafasias: síntoma central de la afasia de Wernicke → revelan la organización del lexicón mental: los errores semánticos indican que la organización semántica está preservada pero el acceso está perturbado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la lateralización hemisférica del lenguaje? (que el lenguaje usa ambos hemisferios por igual/que en la mayoría de las personas (95% de los diestros) el lenguaje está lateralizado en el hemisferio izquierdo: el hemisferio derecho contribuye a la prosodia y el humor → en zurdos hay mayor variabilidad bilateral/que el hemisferio derecho controla el lenguaje)"
        correctAnswer: "que en la mayoría de las personas (95% de los diestros) el lenguaje está lateralizado en el hemisferio izquierdo: el hemisferio derecho contribuye a la prosodia y el humor → en zurdos hay mayor variabilidad bilateral"
        rationale: "Lateralización: demostrada por lesiones, test de Wada (amobarbital) y neuroimagen → el hemisferio izquierdo domina el análisis lingüístico; el derecho, la pragmática y la emoción."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre la dislexia fonológica y la superficial? (una es congénita y la otra adquirida/fonológica: dificultad para decodificar palabras nuevas o pseudopalabras por afección de la ruta fonológica; superficial: dificultad con palabras irregulares, conserva la ruta fonológica/no hay diferencia)"
        correctAnswer: "fonológica: dificultad para decodificar palabras nuevas o pseudopalabras por afección de la ruta fonológica; superficial: dificultad con palabras irregulares, conserva la ruta fonológica"
        rationale: "Dislexia: el modelo de doble ruta (Coltheart) distingue la ruta fonológica (reglas grafema-fonema) de la ruta léxica directa → cada tipo de dislexia afecta a una ruta distinta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el fascículo arqueado y qué función tiene? (un músculo del cuello/un haz de fibras que conecta las áreas de Broca y Wernicke: su lesión causa la afasia de conducción → el paciente comprende bien y habla fluidamente, pero no puede repetir palabras/un área cortical del lenguaje)"
        correctAnswer: "un haz de fibras que conecta las áreas de Broca y Wernicke: su lesión causa la afasia de conducción → el paciente comprende bien y habla fluidamente, pero no puede repetir palabras"
        rationale: "Fascículo arqueado: la lesión selectiva de la conexión entre Broca y Wernicke → afasia de conducción: la repetición es el proceso más afectado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué caracteriza el trastorno específico del lenguaje (TEL)? (bajo rendimiento escolar general/dificultades específicas en la adquisición del lenguaje sin explicación auditiva, cognitiva, neurológica o social: especialmente morfosintaxis y procesamiento fonológico → sin daño cerebral adquirido/dificultad con la lectura únicamente)"
        correctAnswer: "dificultades específicas en la adquisición del lenguaje sin explicación auditiva, cognitiva, neurológica o social: especialmente morfosintaxis y procesamiento fonológico → sin daño cerebral adquirido"
        rationale: "TEL: diagnóstico por exclusión → el niño tiene inteligencia normal, audición normal, sin daño neurológico → pero el lenguaje se desarrolla lenta y atípicamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la anomia y en qué afasias es más prominente? (un trastorno gramatical/la dificultad para encontrar y producir palabras: prominente en la afasia anómica (la más leve) y en la afasia de Wernicke → el paciente sabe lo que quiere decir pero no accede a la forma fonológica/una dificultad de comprensión)"
        correctAnswer: "la dificultad para encontrar y producir palabras: prominente en la afasia anómica (la más leve) y en la afasia de Wernicke → el paciente sabe lo que quiere decir pero no accede a la forma fonológica"
        rationale: "Anomia: síntoma presente en grados variables en todas las afasias → la afasia anómica se caracteriza por este síntoma casi exclusivamente → fenómeno de 'la punta de la lengua' amplificado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué evidencia aportan los estudios de escisión cerebral (split brain) al estudio del lenguaje? (que el lenguaje es bilateral/que el hemisferio izquierdo puede hablar mientras el derecho no (en la mayoría): si se presenta una imagen al campo visual derecho (hemisferio izquierdo), el paciente puede nombrarlo; si se presenta al campo izquierdo (hemisferio derecho), no puede/que los dos hemisferios son iguales)"
        correctAnswer: "que el hemisferio izquierdo puede hablar mientras el derecho no (en la mayoría): si se presenta una imagen al campo visual derecho (hemisferio izquierdo), el paciente puede nombrarlo; si se presenta al campo izquierdo (hemisferio derecho), no puede"
        rationale: "Pacientes split-brain (Sperry, Gazzaniga): al seccionar el cuerpo calloso, los dos hemisferios actúan independientemente → el derecho tiene comprensión pero no producción en la mayoría."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el mutismo selectivo del trastorno del lenguaje? (son equivalentes/el mutismo selectivo es un trastorno de ansiedad: el niño tiene capacidad lingüística normal pero no habla en contextos específicos (escuela) aunque hable en casa → no es un déficit lingüístico sino social-emocional/el mutismo selectivo afecta a adultos)"
        correctAnswer: "el mutismo selectivo es un trastorno de ansiedad: el niño tiene capacidad lingüística normal pero no habla en contextos específicos (escuela) aunque hable en casa → no es un déficit lingüístico sino social-emocional"
        rationale: "Mutismo selectivo: diagnóstico diferencial clave → el logopeda debe descartar el mutismo selectivo cuando el niño habla en algunos contextos pero no en otros."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: "Aplicación: Diagnóstico y Evaluación del Lenguaje"
    description: Aplica los conocimientos de neurolingüística al análisis de casos clínicos.
    exercises:
      - type: grammar
        question: "¿Por qué el paciente con afasia de Broca dice 'quiero... agua' y no 'Quiero un vaso de agua'? (por pereza/porque el agramatismo afecta selectivamente la morfología gramatical (artículos, preposiciones, desinencias) y conserva el léxico de contenido: las palabras funcionales ('un', 'de') se omiten/porque el paciente no tiene sed)"
        correctAnswer: "porque el agramatismo afecta selectivamente la morfología gramatical (artículos, preposiciones, desinencias) y conserva el léxico de contenido: las palabras funcionales ('un', 'de') se omiten"
        rationale: "Agramatismo en la práctica: el habla telegráfica revela la disociación entre clase abierta (conservada) y clase cerrada (afectada) → fundamento del análisis neurolingüístico de la gramática."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué un paciente con dislexia fonológica puede leer 'casa' pero no 'flanso' (pseudopalabra)? (porque 'flanso' no existe/porque la ruta fonológica (que convierte grafemas en fonemas) está afectada: 'flanso' no tiene representación léxica directa y requiere la ruta fonológica; 'casa' tiene representación léxica y puede leerse por la ruta directa/porque 'flanso' es difícil)"
        correctAnswer: "porque la ruta fonológica (que convierte grafemas en fonemas) está afectada: 'flanso' no tiene representación léxica directa y requiere la ruta fonológica; 'casa' tiene representación léxica y puede leerse por la ruta directa"
        rationale: "Doble ruta: la disociación pseudopalabras vs. palabras conocidas es el criterio diagnóstico de la dislexia fonológica → el test de pseudopalabras es clave en la evaluación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué las personas con afasia de Wernicke no se dan cuenta de sus errores? (porque son inconscientes/porque la lesión afecta también al sistema de monitoreo del habla: el feedback que normalmente permite detectar y corregir los errores está comprometido junto con la comprensión/porque no les importa)"
        correctAnswer: "porque la lesión afecta también al sistema de monitoreo del habla: el feedback que normalmente permite detectar y corregir los errores está comprometido junto con la comprensión"
        rationale: "Anosognosia en afasia de Wernicke: la falta de conciencia del déficit complica la rehabilitación → el monitoreo del habla requiere comprensión lingüística preservada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué aporta la neuroimagen funcional (fMRI) a la neurolingüística? (que localiza lesiones/que permite ver qué áreas cerebrales se activan durante tareas lingüísticas en tiempo real: comparar el procesamiento en hablantes con distintos niveles de bilingüismo, distintos tipos de trastorno o distintas lenguas/que mide la inteligencia)"
        correctAnswer: "que permite ver qué áreas cerebrales se activan durante tareas lingüísticas en tiempo real: comparar el procesamiento en hablantes con distintos niveles de bilingüismo, distintos tipos de trastorno o distintas lenguas"
        rationale: "fMRI en neurolingüística: superó la dependencia de las lesiones → permite estudiar poblaciones normales y comparar condiciones experimentales → base del campo actual."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la prosodia es relevante para el diagnóstico diferencial de afasias? (no es relevante/en la afasia de Broca, la prosodia también se afecta (habla lenta, monótona); en la de Wernicke, puede estar preservada → la evaluación de la prosodia permite distinguir los tipos de afasia y planificar la intervención/la prosodia no afecta al lenguaje)"
        correctAnswer: en la afasia de Broca, la prosodia también se afecta (habla lenta, monótona); en la de Wernicke, puede estar preservada → la evaluación de la prosodia permite distinguir los tipos de afasia y planificar la intervención
        rationale: "Prosodia en afasias: el hemisferio izquierdo controla la prosodia lingüística (énfasis contrastivo); el derecho, la prosodia emocional → la afasia de Broca afecta la prosodia lingüística."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la disfasia evolutiva (TEL) de un simple retraso del lenguaje? (ninguna/retraso: el desarrollo sigue el patrón normal pero más lento → se resuelve espontáneamente; TEL: el patrón de adquisición es atípico, con dificultades específicas en morfosintaxis que persisten y no se resuelven espontáneamente/la disfasia afecta solo a adultos)"
        correctAnswer: "retraso: el desarrollo sigue el patrón normal pero más lento → se resuelve espontáneamente; TEL: el patrón de adquisición es atípico, con dificultades específicas en morfosintaxis que persisten y no se resuelven espontáneamente"
        rationale: "Diagnóstico diferencial: el retraso simple se 'normaliza' solo; el TEL requiere intervención logopédica → la distinción es crucial para el pronóstico y el tratamiento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los modelos de procesamiento léxico en tiempo real (Cohort, TRACE)? (tipos de terapia logopédica/modelos computacionales que explican cómo el oyente activa y selecciona palabras durante la comprensión: el modelo Cohort activa candidatos que comienzan igual que la señal auditiva y los elimina hasta quedar uno; TRACE modela competencia entre segmentos, palabras y características/gramáticas formales)"
        correctAnswer: "modelos computacionales que explican cómo el oyente activa y selecciona palabras durante la comprensión: el modelo Cohort activa candidatos que comienzan igual que la señal auditiva y los elimina hasta quedar uno; TRACE modela competencia entre segmentos, palabras y características"
        rationale: "Modelos de acceso léxico: Cohort (Marslen-Wilson) → activación secuencial de candidatos; TRACE (McClelland) → procesamiento en cascada con competencia entre niveles → predicciones testables con psicolingüística experimental."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué revela la afasia cruzada sobre la lateralización del lenguaje? (que todos los diestros tienen lenguaje en el izquierdo/que algunos diestros tienen el lenguaje lateralizado en el hemisferio derecho → una lesión derecha les produce afasia: confirma que la lateralización es variable aunque el izquierdo sea dominante en la mayoría/que la afasia solo ocurre en zurdos)"
        correctAnswer: "que algunos diestros tienen el lenguaje lateralizado en el hemisferio derecho → una lesión derecha les produce afasia: confirma que la lateralización es variable aunque el izquierdo sea dominante en la mayoría"
        rationale: "Afasia cruzada: contraejemplo de la regla de lateralización izquierda → prevalencia aprox. 1% en diestros → evidencia de variabilidad en la lateralización."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el bilingüismo es relevante para la neurolingüística? (porque los bilingües son más inteligentes/porque el estudio de afasias en bilingües revela si ambas lenguas comparten los mismos sustratos neurales o tienen representaciones distintas → el patrón de recuperación diferencial de las dos lenguas aporta datos sobre la organización cerebral del bilingüismo/porque aprenden más rápido)"
        correctAnswer: porque el estudio de afasias en bilingües revela si ambas lenguas comparten los mismos sustratos neurales o tienen representaciones distintas → el patrón de recuperación diferencial de las dos lenguas aporta datos sobre la organización cerebral del bilingüismo
        rationale: "Bilingüismo y afasia: los patrones de disociación (L1 mejor que L2, o a la inversa, o independiente) → revelan la organización neural → Ribot vs. Pitres: debate sobre qué lengua se recupera primero."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué función terapéutica tiene la terapia de entonación melódica (MIT) en la afasia de Broca? (mejorar la comprensión/usar el canto para acceder al habla a través del hemisferio derecho (que controla la música): algunos pacientes con severa afasia de Broca pueden 'cantar' frases que no pueden hablar/mejorar la escritura)"
        correctAnswer: "usar el canto para acceder al habla a través del hemisferio derecho (que controla la música): algunos pacientes con severa afasia de Broca pueden 'cantar' frases que no pueden hablar"
        rationale: "MIT: Sparks y Helm → la melodía activa el hemisferio derecho → la prosodia musical puede 'sustituir' la función del izquierdo dañado → técnica validada empíricamente."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
