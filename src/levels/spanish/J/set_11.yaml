        correctAnswer: el sistema económico en que el conocimiento, la información y la innovación son los principales factores de producción, sustituyendo al capital físico y el trabajo manual
        rationale: "El texto: 'La economía del conocimiento designa el sistema económico en que el conocimiento, la información y la innovación son los principales factores de producción'."
        difficulty: 5
