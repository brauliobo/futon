authorNotes: "Texto expositivo sobre economía del conocimiento: la transición al capitalismo cognitivo, la propiedad intelectual, la economía de plataformas (Uber, Airbnb), el trabajo precario en la gig economy, la vigilancia digital (capitalismo de la vigilancia de Zuboff), los datos como recurso económico y los debates sobre regulación digital."
example: "economía del conocimiento → bienes digitales: coste marginal cero/no rival → plataformas: efectos de red → capitalismo de vigilancia (Zuboff): datos como materia prima → economía gig: flexibilidad vs. precariedad → debate propiedad intelectual: copyright vs. commons → brecha digital → fiscalidad de plataformas globales."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 48
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La economía del conocimiento designa el sistema económico en que el conocimiento, la información y la innovación son los principales factores de producción, sustituyendo al capital físico y al trabajo manual como motores de la riqueza. Las tecnologías de la información y la comunicación (TIC) han creado nuevas formas de producción y consumo. La economía de plataformas (platform economy) articula mercados de dos lados: Uber conecta conductores y pasajeros; Airbnb, anfitriones y huéspedes → la plataforma extrae valor de las transacciones sin poseer los activos. La gig economy o economía de encargos externaliza el riesgo al trabajador: los 'colaboradores independientes' carecen de contrato fijo, seguridad social y derechos laborales convencionales. Shoshana Zuboff acuñó el concepto de 'capitalismo de la vigilancia': las grandes plataformas digitales (Google, Meta) recopilan datos de comportamiento humano para predecir y modificar conductas con fines comerciales y políticos, convirtiendo la experiencia humana en materia prima. Los datos se han convertido en el 'petróleo del siglo XXI': el Reglamento General de Protección de Datos (RGPD) de la UE (2018) intentó regular su uso. La propiedad intelectual —patentes, derechos de autor, marcas— es la forma de capital que domina la economía del conocimiento: el debate sobre el período de protección y el acceso abierto (open access) es central. Las criptomonedas y la tecnología blockchain proponen descentralizar las transacciones y eliminar los intermediarios. La inteligencia artificial amenaza con automatizar no solo el trabajo manual sino también el cognitivo: el debate sobre el desempleo tecnológico y la renta básica universal se intensifica."
