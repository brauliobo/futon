authorNotes: "Texto expositivo sobre biología molecular: estructura del ADN, replicación, transcripción, traducción, el código genético, epigenética, el Proyecto Genoma Humano, la tecnología CRISPR-Cas9 y las aplicaciones en medicina y biotecnología."
