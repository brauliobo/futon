        correctAnswer: que cada hebra del ADN original sirve de molde para una nueva hebra complementaria → cada célula hija recibe una hebra original y una nueva
        rationale: "El texto: 'La replicación del ADN es semiconservadora: cada hebra sirve de molde para una nueva hebra complementaria'."
