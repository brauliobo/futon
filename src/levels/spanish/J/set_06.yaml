    title: El Texto
    description: "Texto: La biología molecular estudia los mecanismos moleculares de la vida. El ADN (ácido desoxirribonucleico) es una doble hélice de dos cadenas complementarias de nucleótidos, formadas por una base nitrogenada (adenina, timina, guanina, citosina), un azúcar (desoxirribosa) y un fosfato. La secuencia de bases codifica la información genética. La replicación del ADN es semiconservadora: cada hebra sirve de molde para una nueva hebra complementaria. La transcripción convierte ADN en ARN mensajero (ARNm); la traducción convierte el ARNm en proteínas en los ribosomas, usando tripletes de bases (codones) para codificar aminoácidos: el código genético es (casi) universal. La epigenética estudia las modificaciones heredables de la expresión génica que no implican cambios en la secuencia del ADN: la metilación del ADN y las modificaciones de histonas regulan qué genes se expresan en cada tipo celular. El Proyecto Genoma Humano (1990-2003) secuenció los aproximadamente 3.000 millones de pares de bases del genoma humano, identificando unos 20.000-25.000 genes. La tecnología CRISPR-Cas9 (Doudna y Charpentier, Premio Nobel 2020) permite editar el genoma con precisión: Cas9 es una 'tijera molecular' guiada por un ARN hacia la secuencia deseada donde corta y modifica el ADN. Las aplicaciones incluyen la terapia génica de enfermedades hereditarias (anemia falciforme, talasemia), la creación de organismos modificados genéticamente y la posibilidad (polémica) de la edición germinal humana. La secuenciación de nueva generación (NGS) ha reducido el coste de secuenciar un genoma de miles de millones de dólares a menos de mil."
