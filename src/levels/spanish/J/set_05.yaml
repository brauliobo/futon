title: 🔬 Gramática - Lingüística del Texto y Análisis del Discurso Avanzado
level: J
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Lingüística del texto: coherencia local y global, cohesión (referencia, elipsis, sustitución, conjunción, cohesión léxica). Análisis conversacional: turnos, pares adyacentes, reparación, secuencias preferidas/no preferidas. Análisis del discurso institucional. Géneros del discurso académico. Escritura académica avanzada: argumentación, hedging, modalización, evidencialidad. Metadiscurso: marcos, atenuadores, énfasis. Citación y polifonía en el discurso científico."
example: "cohesión léxica → reitera (repetición exacta), sinonimia ('estudiante'/'alumno'), hiponimia ('animal'/'perro'), colocación ('investigación'+'diseño'+'resultados') → la red léxica crea coherencia temática. par adyacente → pregunta/respuesta, saludo/saludo, oferta/aceptación o rechazo: la segunda parte es condicionalmente relevante. metadiscurso → marcos: 'En este artículo se argumenta que...'; atenuadores: 'parece que, sugiere, podría'; énfasis: 'claramente, sin duda' → el metadiscurso organiza la relación autor-lector. evidencialidad → 'según X', 'los datos muestran', 'se ha demostrado que' → marca la fuente del conocimiento afirmado."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Lingüística del Texto - Coherencia y Cohesión Avanzada
    description: Identifica los mecanismos de cohesión textual y los principios del análisis conversacional.
    exercises:
      - type: grammar
        question: "¿Cuáles son los cinco tipos de cohesión según Halliday y Hasan? (rima, ritmo, metro, acento, entonación/referencia (pronombres, demostrativos), sustitución, elipsis, conjunción (conectores) y cohesión léxica (repetición, sinonimia, hiponimia, colocación)/sustantivo, verbo, adjetivo, adverbio, preposición)"
        correctAnswer: referencia (pronombres, demostrativos), sustitución, elipsis, conjunción (conectores) y cohesión léxica (repetición, sinonimia, hiponimia, colocación)
        rationale: "Halliday y Hasan (1976): los cinco mecanismos de cohesión crean textura → sin cohesión, las oraciones son independientes; con cohesión, forman texto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un par adyacente en el análisis conversacional? (dos oraciones seguidas/una secuencia de dos turnos producida por hablantes distintos donde el primer turno condiciona el segundo: pregunta/respuesta, saludo/saludo, oferta/aceptación o rechazo → la ausencia de la segunda parte es significativa/dos frases cortas)"
        correctAnswer: "una secuencia de dos turnos producida por hablantes distintos donde el primer turno condiciona el segundo: pregunta/respuesta, saludo/saludo, oferta/aceptación o rechazo → la ausencia de la segunda parte es significativa"
        rationale: "Pares adyacentes (Schegloff, Sacks): la segunda parte es 'condicionalmente relevante' → su ausencia se nota y tiene implicaciones comunicativas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el hedging en la escritura académica? (la autocita/plagio/el uso de atenuadores lingüísticos para expresar grados de certeza y proteger las afirmaciones: 'parece que', 'sugiere', 'podría indicar' → el escritor académico evita afirmaciones absolutas no respaldadas por evidencia)"
        correctAnswer: "el uso de atenuadores lingüísticos para expresar grados de certeza y proteger las afirmaciones: 'parece que', 'sugiere', 'podría indicar' → el escritor académico evita afirmaciones absolutas no respaldadas por evidencia"
        rationale: "Hedging (Hyland): el discurso académico es epistémicamente modesto → los atenuadores reflejan la naturaleza tentativa del conocimiento científico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la evidencialidad en el discurso académico? (la objetividad del texto/la claridad del texto/la marcación lingüística de la fuente del conocimiento afirmado: 'según X', 'los datos muestran', 'se ha demostrado que' → el discurso académico es fundamentalmente citacional y evidencial)"
        correctAnswer: "la marcación lingüística de la fuente del conocimiento afirmado: 'según X', 'los datos muestran', 'se ha demostrado que' → el discurso académico es fundamentalmente citacional y evidencial"
        rationale: "Evidencialidad: en lenguas como el quechua o el turco es gramaticalmente obligatoria; en español académico se expresa léxicamente → fundamental en la escritura de investigación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la reparación iniciada por el hablante de la iniciada por el oyente en conversación? (no hay diferencia/el hablante puede autocorregirse ('Fui... fue el martes'); el oyente puede señalar un problema ('¿Dijiste martes?') que el hablante luego repara → el análisis conversacional estudia la organización secuencial de las reparaciones/la reparación no existe)"
        correctAnswer: el hablante puede autocorregirse ('Fui... fue el martes'); el oyente puede señalar un problema ('¿Dijiste martes?') que el hablante luego repara → el análisis conversacional estudia la organización secuencial de las reparaciones
        rationale: "Reparación (AC): preferencia por la autorreparación → el hablante prefiere corregirse a sí mismo antes de que lo corrijan → organización que revela normas de la interacción."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el metadiscurso en la lingüística del texto? (el discurso sobre la metalingüística/el lenguaje que el autor usa para organizar el texto y la relación con el lector: marcos ('En primer lugar', 'Para concluir'), atenuadores ('parece'), énfasis ('claramente'), actitudinales ('lamentablemente')/los errores del autor)"
        correctAnswer: "el lenguaje que el autor usa para organizar el texto y la relación con el lector: marcos ('En primer lugar', 'Para concluir'), atenuadores ('parece'), énfasis ('claramente'), actitudinales ('lamentablemente')"
        rationale: "Metadiscurso (Hyland): divide en textual (organiza el texto) e interpersonal (posiciona al autor respecto al lector y al contenido) → fundamental en géneros académicos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la coherencia global de un texto? (la gramática correcta/la unidad semántica del texto como un todo: que todas las partes contribuyen a un tema o argumento central → difiere de la coherencia local (que oraciones adyacentes se relacionen lógicamente)/la puntuación correcta)"
        correctAnswer: "la unidad semántica del texto como un todo: que todas las partes contribuyen a un tema o argumento central → difiere de la coherencia local (que oraciones adyacentes se relacionen lógicamente)"
        rationale: "Coherencia global: la macroestructura del texto (van Dijk) → un texto puede tener coherencia local pero carecer de coherencia global si los párrafos no se integran en un argumento mayor."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el discurso institucional y qué lo caracteriza? (el discurso de las instituciones educativas/el discurso producido en contextos institucionales (médico, judicial, académico, burocrático) con asimetría de roles, restricciones de género y objetivos institucionales específicos → difiere del discurso cotidiano en su rigidez y la distribución del poder/el discurso formal en general)"
        correctAnswer: el discurso producido en contextos institucionales (médico, judicial, académico, burocrático) con asimetría de roles, restricciones de género y objetivos institucionales específicos → difiere del discurso cotidiano en su rigidez y la distribución del poder
        rationale: "Drew y Heritage: el discurso institucional se caracteriza por orientación a metas institucionales, restricciones del turn-taking y relaciones asimétricas de conocimiento y poder."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la cita directa de la indirecta en el discurso académico? (la directa es siempre más larga/ninguna/directa: reproduce las palabras exactas del autor entre comillas; indirecta: parafrasea las ideas del autor integrándolas en el discurso del citante → la cita directa mantiene la voz original; la indirecta permite mayor integración argumentativa)"
        correctAnswer: "directa: reproduce las palabras exactas del autor entre comillas; indirecta: parafrasea las ideas del autor integrándolas en el discurso del citante → la cita directa mantiene la voz original; la indirecta permite mayor integración argumentativa"
        rationale: "Citación polifónica: el discurso académico orquesta múltiples voces → la elección entre cita directa e indirecta es retórica: las directas aportan autoridad; las indirectas, integración."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la colocación como mecanismo de cohesión léxica? (la repetición de palabras/la tendencia de ciertas palabras a coocurrir regularmente: 'investigación' + 'diseño/metodología/resultados/conclusiones' → las redes de colocaciones crean coherencia temática sin necesidad de repetición directa/la sinonimia)"
        correctAnswer: "la tendencia de ciertas palabras a coocurrir regularmente: 'investigación' + 'diseño/metodología/resultados/conclusiones' → las redes de colocaciones crean coherencia temática sin necesidad de repetición directa"
        rationale: "Colocación (Halliday): la cohesión léxica no requiere sinonimia → las palabras que pertenecen al mismo campo semántico crean coherencia por asociación."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: "Aplicación: Análisis del Discurso Académico"
    description: Aplica los conceptos al análisis de textos académicos y conversacionales.
    exercises:
      - type: grammar
        question: "¿Qué función cumple 'Sin embargo' al inicio de un párrafo en un texto argumentativo? (es un error/conector adversativo que señala una relación de contraste o concesión entre el argumento anterior y el que sigue → organiza la estructura argumentativa del texto y guía al lector en la progresión del razonamiento/es redundante)"
        correctAnswer: conector adversativo que señala una relación de contraste o concesión entre el argumento anterior y el que sigue → organiza la estructura argumentativa del texto y guía al lector en la progresión del razonamiento
        rationale: "Conectores adversativos: 'sin embargo', 'no obstante', 'pero' → señalan contraste; su elección tiene matices retóricos → 'no obstante' es más formal que 'pero'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'Los resultados sugieren que...' es preferible a 'Los resultados demuestran que...' en muchos contextos académicos? (por estilo/porque 'sugieren' usa hedging apropiado para resultados empíricos que tienen limitaciones metodológicas; 'demuestran' implica certeza absoluta → el hedging protege las afirmaciones y es más honesto epistemológicamente/porque es más corto)"
        correctAnswer: porque 'sugieren' usa hedging apropiado para resultados empíricos que tienen limitaciones metodológicas; 'demuestran' implica certeza absoluta → el hedging protege las afirmaciones y es más honesto epistemológicamente
        rationale: "Hedging epistémico: la elección entre 'sugiere/indica/apunta' vs. 'demuestra/prueba' refleja el grado de confianza del autor → los revisores académicos valoran la precisión epistémica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de cohesión usa 'el fenómeno → este fenómeno → dicho fenómeno' en un texto? (elipsis/referencia anafórica: el pronombre demostrativo ('este') y el adjetivo anafórico ('dicho') retoman el referente previo → evitan la repetición manteniendo el hilo referencial/sinonimia)"
        correctAnswer: "referencia anafórica: el pronombre demostrativo ('este') y el adjetivo anafórico ('dicho') retoman el referente previo → evitan la repetición manteniendo el hilo referencial"
        rationale: "Referencia: mecanismo de cohesión por excelencia → los demostrativos y adjetivos anafóricos ('mencionado', 'citado', 'referido') son recursos propios del registro académico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo analiza el análisis conversacional el silencio en la interacción? (como ausencia de comunicación/como un elemento comunicativo significativo: el silencio en el lugar esperado de una respuesta puede indicar rechazo, búsqueda de palabras o negativa a colaborar → su duración y posición son significativas/como un error del hablante)"
        correctAnswer: "como un elemento comunicativo significativo: el silencio en el lugar esperado de una respuesta puede indicar rechazo, búsqueda de palabras o negativa a colaborar → su duración y posición son significativas"
        rationale: "AC: el silencio en el espacio de transición relevante (TRP) → las pausas largas en lugar de segunda parte del par adyacente son significativas e inducen reformulación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el discurso médico entre el paciente y el médico? (el nivel educativo/el médico controla los turnos (hace las preguntas), define el marco institucional y posee el conocimiento técnico; el paciente tiene acceso asimétrico al conocimiento → el discurso médico es un ejemplo paradigmático del discurso institucional asimétrico/son iguales)"
        correctAnswer: el médico controla los turnos (hace las preguntas), define el marco institucional y posee el conocimiento técnico; el paciente tiene acceso asimétrico al conocimiento → el discurso médico es un ejemplo paradigmático del discurso institucional asimétrico
        rationale: "Mishler: el discurso médico se organiza en torno a la 'voz de la medicina' (técnica, objetiva) vs. la 'voz del mundo de vida' del paciente → la asimetría puede dificultar la comunicación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la secuencia preferida y no preferida en el análisis conversacional? (la secuencia gramaticalmente correcta/la segunda parte del par adyacente puede ser preferida (esperada, breve: 'Sí, claro') o no preferida (no esperada, elaborada con disculpas y justificaciones: 'Verás, me encantaría pero...') → la no preferida es típicamente más larga y compleja/las oraciones cortas vs. largas)"
        correctAnswer: "la segunda parte del par adyacente puede ser preferida (esperada, breve: 'Sí, claro') o no preferida (no esperada, elaborada con disculpas y justificaciones: 'Verás, me encantaría pero...') → la no preferida es típicamente más larga y compleja"
        rationale: "Preferencia: no es psicológica sino estructural → la respuesta no preferida (rechazo, desacuerdo) requiere trabajo interaccional mayor para proteger las imágenes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la elipsis puede crear ambigüedad en el texto escrito? (nunca crea ambigüedad/porque el elemento elidido debe ser recuperable del contexto previo: si el antecedente es ambiguo o distante, la elipsis puede dificultar la comprensión → el texto escrito no puede beneficiarse del contexto gestual y prosódico oral/la elipsis es siempre clara)"
        correctAnswer: "porque el elemento elidido debe ser recuperable del contexto previo: si el antecedente es ambiguo o distante, la elipsis puede dificultar la comprensión → el texto escrito no puede beneficiarse del contexto gestual y prosódico oral"
        rationale: "Elipsis en texto escrito: la distancia entre el antecedente y la posición elidida aumenta el riesgo de ambigüedad → el escritor académico debe usarla con cuidado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué función retórica cumplen los marcos ('En este artículo', 'El objetivo de esta sección es') en un texto académico? (son relleno/organizan la macroprogresión del texto y orientan al lector sobre la estructura y los objetivos → el metadiscurso de marco mejora la comprensión y la navegación del texto/son errores de estilo)"
        correctAnswer: organizan la macroprogresión del texto y orientan al lector sobre la estructura y los objetivos → el metadiscurso de marco mejora la comprensión y la navegación del texto
        rationale: "Marcos (Hyland): el metadiscurso de marco es característico de los géneros académicos más explícitos (artículo científico, tesis) → da al lector un mapa de la estructura del texto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo funciona la intertextualidad implícita en el discurso académico? (citando siempre explícitamente/al usar términos técnicos o marcos conceptuales sin citar: usar 'habitus' sin citar a Bourdieu presupone que el lector conoce el marco → crea comunidad discursiva de quienes comparten el conocimiento/no existe en el discurso académico)"
        correctAnswer: "al usar términos técnicos o marcos conceptuales sin citar: usar 'habitus' sin citar a Bourdieu presupone que el lector conoce el marco → crea comunidad discursiva de quienes comparten el conocimiento"
        rationale: "Intertextualidad implícita: define la comunidad discursiva → el conocimiento tácito compartido es lo que marca la pertenencia al campo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el análisis del discurso legal es relevante para la lingüística forense? (porque el derecho usa gramática especial/porque el lenguaje de los documentos legales (contratos, sentencias, testimonios) puede producir ambigüedades con consecuencias jurídicas reales → el análisis lingüístico puede usarse como evidencia pericial/el derecho no usa lenguaje natural)"
        correctAnswer: porque el lenguaje de los documentos legales (contratos, sentencias, testimonios) puede producir ambigüedades con consecuencias jurídicas reales → el análisis lingüístico puede usarse como evidencia pericial
        rationale: "Lingüística forense: los lingüistas actúan como peritos en casos de plagio, amenazas, difamación y contratos ambiguos → la ambigüedad léxica o sintáctica puede tener efectos legales."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
