    title: El Texto
    description: "Texto: El cambio climático antropogénico es el fenómeno de alteración del sistema climático terrestre causado principalmente por las emisiones humanas de gases de efecto invernadero (GEI). El efecto invernadero natural mantiene la temperatura media de la Tierra en aproximadamente 15°C; la intensificación antrópica de este efecto —principalmente por CO₂, metano (CH₄) y óxido nitroso (N₂O)— está elevando las temperaturas globales. El IPCC (Panel Intergubernamental sobre Cambio Climático), creado en 1988, sintetiza la investigación científica: su Sexto Informe de Evaluación (AR6, 2021-2022) confirma que el calentamiento desde la era preindustrial es inequívocamente de origen humano y ya supera 1,1°C. Los puntos de inflexión (tipping points) son umbrales críticos del sistema climático: el deshielo del permafrost siberiano libera metano, acelerando el calentamiento (retroalimentación positiva); el colapso de la corriente termohalina (AMOC) alteraría radicalmente el clima europeo. El Protocolo de Kioto (1997) introdujo compromisos de reducción de emisiones solo para países desarrollados; el Acuerdo de París (2015) extendió la responsabilidad a todos los países con el objetivo de limitar el calentamiento a 1,5°C-2°C. La justicia climática subraya que los países más vulnerables al cambio climático han contribuido menos históricamente a las emisiones. Las soluciones incluyen la transición energética (renovables, hidrógeno verde), la captura y almacenamiento de carbono (CCS), la adaptación (diques, cultivos resistentes) y la geoingeniería (controvertida)."
