authorNotes: "Texto expositivo sobre el cambio climático: el efecto invernadero, el Panel Intergubernamental sobre Cambio Climático (IPCC), los gases de efecto invernadero, los puntos de inflexión, los acuerdos internacionales (Kioto, París), la justicia climática y las soluciones tecnológicas."
