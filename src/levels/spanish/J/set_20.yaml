title: Revisión General - Nivel J
level: J
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Revisión integradora del nivel J: lingüística computacional y PLN, filosofía política, teoría literaria contemporánea, física moderna, lingüística del texto, biología molecular, retórica avanzada, arte del siglo XX, morfosintaxis avanzada, antropología, economía digital, neurolingüística, historia de la escritura, adquisición del lenguaje, filosofía del lenguaje, semántica cognitiva, cambio climático, estilística, inteligencia artificial."
example: "Relaciona los conceptos de distintos campos del nivel J → conecta lingüística computacional con filosofía del lenguaje (Searle y los LLMs) o semántica cognitiva con estilística (metáforas conceptuales en el análisis literario)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Revisión - Parte I
    exercises:
      - type: grammar
        question: "¿Qué es la tokenización en PLN y qué problema plantea para lenguas como el chino? (la traducción automática/la segmentación del texto continuo en unidades mínimas (tokens) → para el español, los espacios delimitan palabras; para el chino, no hay espacios → el tokenizador debe decidir los límites de los caracteres, lo que introduce errores/la eliminación de palabras vacías)"
        correctAnswer: la segmentación del texto continuo en unidades mínimas (tokens) → para el español, los espacios delimitan palabras; para el chino, no hay espacios → el tokenizador debe decidir los límites de los caracteres, lo que introduce errores
        rationale: "La tokenización es el primer paso en PLN; en lenguas sin espacios entre palabras, es un problema no trivial que afecta a toda la cadena de procesamiento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre el contrato social de Hobbes y el de Rousseau? (son idénticos/Hobbes: el Estado surge para frenar la guerra de todos contra todos del estado de naturaleza → soberanía absoluta; Rousseau: el estado de naturaleza es bueno, la sociedad corrompe → contrato basado en la voluntad general, no en el miedo/ambos defienden la democracia directa)"
        correctAnswer: "Hobbes: el Estado surge para frenar la guerra de todos contra todos del estado de naturaleza → soberanía absoluta; Rousseau: el estado de naturaleza es bueno, la sociedad corrompe → contrato basado en la voluntad general, no en el miedo"
        rationale: "Hobbes y Rousseau parten de visiones opuestas de la naturaleza humana; esa diferencia determina el tipo de Estado que cada uno defiende."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue la deconstrucción de Derrida del análisis estructuralista? (que Derrida es más antiguo/el estructuralismo busca estructuras estables de significado; la deconstrucción muestra que los textos contienen contradicciones internas que desestabilizan su significado → no hay un centro fijo, solo diferencias relacionales (différance)/que son métodos idénticos)"
        correctAnswer: el estructuralismo busca estructuras estables de significado; la deconstrucción muestra que los textos contienen contradicciones internas que desestabilizan su significado → no hay un centro fijo, solo diferencias relacionales (différance)
        rationale: "Derrida ('différance') subvierte el estructuralismo de Saussure al mostrar que el significado siempre se aplaza y difiere."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la energía oscura y qué porcentaje del universo representa? (la energía de los agujeros negros, 10%/la energía que causa la expansión acelerada del universo → representa aproximadamente el 68% del contenido energético total; la materia oscura es el 27% y la materia ordinaria solo el 5%/el calor residual del Big Bang, 40%)"
        correctAnswer: la energía que causa la expansión acelerada del universo → representa aproximadamente el 68% del contenido energético total; la materia oscura es el 27% y la materia ordinaria solo el 5%
        rationale: "La energía oscura representa el 68% del universo; con la materia oscura (27%), el 95% es invisible; solo el 5% es materia ordinaria."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el hedging en el análisis del discurso y en qué géneros es más frecuente? (la repetición de ideas/el uso de expresiones atenuadoras ('podría', 'en cierta medida', 'aparentemente') para mitigar la fuerza de una afirmación → más frecuente en el discurso académico-científico donde el escritor evita comprometerse con certezas absolutas/la exageración retórica)"
        correctAnswer: el uso de expresiones atenuadoras ('podría', 'en cierta medida', 'aparentemente') para mitigar la fuerza de una afirmación → más frecuente en el discurso académico-científico donde el escritor evita comprometerse con certezas absolutas
        rationale: "El hedging es una estrategia pragmática de mitigación epistémica; Hyland estudió su distribución en artículos científicos de distintas disciplinas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la epigenética y cómo modifica la visión clásica de la herencia? (el estudio de las mutaciones/el estudio de cambios en la expresión génica que no alteran la secuencia de ADN → factores ambientales (dieta, estrés) pueden activar o silenciar genes, y algunos cambios son heredables → el ambiente interactúa con el genoma/un sinónimo de genómica)"
        correctAnswer: el estudio de cambios en la expresión génica que no alteran la secuencia de ADN → factores ambientales (dieta, estrés) pueden activar o silenciar genes, y algunos cambios son heredables → el ambiente interactúa con el genoma
        rationale: "La epigenética (Waddington) amplía el dogma central de la biología molecular al mostrar que la expresión génica es regulable sin cambiar el código genético."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la pragma-dialéctica y cuál es su objetivo? (una rama de la gramática/un modelo de análisis y evaluación de argumentaciones desarrollado por van Eemeren y Grootendorst → busca identificar qué movimientos argumentativos son válidos o falaces en un diálogo orientado a resolver una diferencia de opinión/un sistema retórico clásico)"
        correctAnswer: un modelo de análisis y evaluación de argumentaciones desarrollado por van Eemeren y Grootendorst → busca identificar qué movimientos argumentativos son válidos o falaces en un diálogo orientado a resolver una diferencia de opinión
        rationale: "La pragma-dialéctica combina la pragmática del lenguaje con la dialéctica crítica para evaluar argumentaciones reales; es la escuela de Ámsterdam."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué quiso decir Walter Benjamin con la pérdida del 'aura' en la obra de arte reproducible? (que las reproducciones son más baratas/que la reproducción técnica (fotografía, cine) elimina el aquí y ahora de la obra original, su presencia única e irrepetible → la reproductibilidad democrátiza el arte pero destruye su autenticidad ritual/que el arte moderno es inferior)"
        correctAnswer: que la reproducción técnica (fotografía, cine) elimina el aquí y ahora de la obra original, su presencia única e irrepetible → la reproductibilidad democrátiza el arte pero destruye su autenticidad ritual
        rationale: "Benjamin ('La obra de arte en la época de su reproductibilidad técnica', 1935): el aura se pierde cuando la obra puede ser duplicada infinitamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la construcción absoluta en morfosintaxis española y cuál es su función? (una oración principal sin verbo/una cláusula no flexionada con su propio sujeto que complementa la oración principal → 'Terminada la guerra, los soldados volvieron a casa' → el participio 'terminada' concuerda con 'guerra', no con el sujeto principal/una oración pasiva reflexiva)"
        correctAnswer: una cláusula no flexionada con su propio sujeto que complementa la oración principal → 'Terminada la guerra, los soldados volvieron a casa' → el participio 'terminada' concuerda con 'guerra', no con el sujeto principal
        rationale: "Las construcciones absolutas (de participio, gerundio o infinitivo) son predicaciones secundarias con sujeto propio, de valor temporal, causal o condicional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el relativismo cultural en la antropología y cuál es su límite ético? (que todas las culturas son iguales en tecnología/el principio metodológico de que las prácticas culturales deben entenderse en su propio contexto → su límite: llevado al extremo justifica prácticas que violan derechos humanos universales (mutilación genital, esclavitud)/que no existe diferencia entre culturas)"
        correctAnswer: "el principio metodológico de que las prácticas culturales deben entenderse en su propio contexto → su límite: llevado al extremo justifica prácticas que violan derechos humanos universales (mutilación genital, esclavitud)"
        rationale: "El relativismo cultural es heurísticamente valioso para evitar el etnocentrismo, pero tiene un límite ético cuando las prácticas vulneran derechos fundamentales."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Revisión - Parte II
    exercises:
      - type: grammar
        question: "¿Qué es el capitalismo de vigilancia según Zuboff y cómo funciona? (el capitalismo industrial/el modelo económico en que las plataformas digitales extraen datos de comportamiento humano como materia prima para predecir y modificar conductas → el 'producto' no es el usuario sino la predicción de su comportamiento que se vende a anunciantes/el comercio electrónico tradicional)"
        correctAnswer: el modelo económico en que las plataformas digitales extraen datos de comportamiento humano como materia prima para predecir y modificar conductas → el 'producto' no es el usuario sino la predicción de su comportamiento que se vende a anunciantes
        rationale: "Zuboff ('La era del capitalismo de la vigilancia', 2019) acuña el concepto para describir la economía de los datos de comportamiento de Google, Facebook, etc."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la afasia de Broca y en qué difiere de la de Wernicke? (enfermedades del oído/afasia de Broca: daño en el lóbulo frontal izquierdo → producción trabajosa pero comprensión conservada; afasia de Wernicke: daño en el lóbulo temporal izquierdo → fluencia normal pero comprensión severamente afectada y parafasias/afasias del hemisferio derecho)"
        correctAnswer: "afasia de Broca: daño en el lóbulo frontal izquierdo → producción trabajosa pero comprensión conservada; afasia de Wernicke: daño en el lóbulo temporal izquierdo → fluencia normal pero comprensión severamente afectada y parafasias"
        rationale: "La disociación Broca/Wernicke es el doble disociación clásica de la neurolingüística: producción vs. comprensión del lenguaje."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre un abjad y un abugida en tipología de escritura? (son lo mismo/el abjad representa solo consonantes sin indicar vocales (árabe, fenicio); el abugida representa consonantes con una vocal inherente modificable por diacríticos (devanagari) → en el abjad las vocales son opcionales; en el abugida están presentes pero modificadas/son tipos de logogramas)"
        correctAnswer: el abjad representa solo consonantes sin indicar vocales (árabe, fenicio); el abugida representa consonantes con una vocal inherente modificable por diacríticos (devanagari) → en el abjad las vocales son opcionales; en el abugida están presentes pero modificadas
        rationale: "La tipología de Sampson distingue cinco tipos de escritura: logográfico, silábico, abjad, abugida y alfabético."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre la hipótesis del período crítico y la hipótesis del input comprensible de Krashen? (son la misma teoría/período crítico (Lenneberg): existe una ventana biológica óptima para la adquisición nativa; hipótesis del input comprensible (Krashen): la adquisición ocurre cuando el input es ligeramente superior al nivel actual (i+1), independientemente de la edad/ambas son teorías conductistas)"
        correctAnswer: "período crítico (Lenneberg): existe una ventana biológica óptima para la adquisición nativa; hipótesis del input comprensible (Krashen): la adquisición ocurre cuando el input es ligeramente superior al nivel actual (i+1), independientemente de la edad"
        rationale: "El período crítico es biológico-maduracional; la hipótesis de Krashen es pedagógica-interaccional; operan a diferentes niveles explicativos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la distinción sentido/referencia de Frege y por qué es importante para la semántica? (que el sentido y la referencia son lo mismo/que la referencia es el objeto al que apunta una expresión y el sentido es el modo de presentación → 'Lucero matutino' y 'Lucero vespertino' tienen la misma referencia (Venus) pero distinto sentido → explica cómo las identidades pueden ser informativas/una distinción gramatical)"
        correctAnswer: que la referencia es el objeto al que apunta una expresión y el sentido es el modo de presentación → 'Lucero matutino' y 'Lucero vespertino' tienen la misma referencia (Venus) pero distinto sentido → explica cómo las identidades pueden ser informativas
        rationale: "La distinción Sinn/Bedeutung de Frege es el punto de partida de la semántica formal moderna; resuelve el puzzle de las identidades informativas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo aplica la teoría de la metáfora conceptual de Lakoff al análisis del discurso político? (no tiene aplicación política/si la metáfora 'el debate político es una guerra' estructura el discurso → 'atacar posiciones', 'defender argumentos', 'derrotar al oponente' → los políticos hablan de competidores como enemigos y de las ideas como armas, lo que legitima la conflictividad/las metáforas son solo literarias)"
        correctAnswer: si la metáfora 'el debate político es una guerra' estructura el discurso → 'atacar posiciones', 'defender argumentos', 'derrotar al oponente' → los políticos hablan de competidores como enemigos y de las ideas como armas, lo que legitima la conflictividad
        rationale: "Lakoff ('No pienses en un elefante', 2004) analizó las metáforas políticas: el marco conceptual estructura la percepción de la realidad política."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el quiasmo y cuál es su función estilística en la prosa argumentativa? (una metáfora/la estructura cruzada AB-BA que crea simetría invertida → 'No preguntes qué puede hacer tu país por ti, sino qué puedes hacer tú por tu país' (Kennedy) → el quiasmo en prosa argumentativa enfatiza un contraste y es fácilmente memorable/una figura de repetición simple)"
        correctAnswer: la estructura cruzada AB-BA que crea simetría invertida → 'No preguntes qué puede hacer tu país por ti, sino qué puedes hacer tú por tu país' (Kennedy) → el quiasmo en prosa argumentativa enfatiza un contraste y es fácilmente memorable
        rationale: "El quiasmo combina simetría formal con asimetría semántica: los elementos se repiten en orden inverso pero con distinta función pragmática."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre los puntos de inflexión climáticos y los objetivos del Acuerdo de París? (son lo mismo/los puntos de inflexión son umbrales físicos del sistema climático que, una vez superados, desencadenan cambios irreversibles; los objetivos de París son metas políticas (1,5-2°C) establecidas para evitar alcanzar precisamente esos puntos de inflexión/no tienen relación)"
        correctAnswer: los puntos de inflexión son umbrales físicos del sistema climático que, una vez superados, desencadenan cambios irreversibles; los objetivos de París son metas políticas (1,5-2°C) establecidas para evitar alcanzar precisamente esos puntos de inflexión
        rationale: "La relación es instrumental: el Acuerdo de París intenta mantener el calentamiento por debajo de los umbrales que activarían los tipping points."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo conectan el argumento del cuarto chino de Searle y el problema de alineación de Bostrom respecto a la IA? (no tienen relación/el cuarto chino muestra que los sistemas actuales no comprenden genuinamente; el problema de alineación es relevante si surge una AGI con comprensión real → si la IA nunca comprende (Searle), la alineación es técnica; si puede comprender (funcionalismo), la alineación también es ética/ambos son optimistas sobre la IA)"
        correctAnswer: el cuarto chino muestra que los sistemas actuales no comprenden genuinamente; el problema de alineación es relevante si surge una AGI con comprensión real → si la IA nunca comprende (Searle), la alineación es técnica; si puede comprender (funcionalismo), la alineación también es ética
        rationale: "La conexión es filosófica: la naturaleza de la comprensión en IA determina el alcance moral del problema de alineación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan la isotopía semántica y las metáforas conceptuales de Lakoff en el análisis de un texto? (no tienen relación/la isotopía de Greimas describe la coherencia semántica de un texto (redes de semas recurrentes); las metáforas conceptuales de Lakoff explican por qué ciertas isotopías son tan frecuentes (guerra, viaje, edificio) → la isotopía guerrera en un texto argumentativo refleja la metáfora conceptual 'el argumento es una guerra'/son términos sinónimos)"
        correctAnswer: la isotopía de Greimas describe la coherencia semántica de un texto (redes de semas recurrentes); las metáforas conceptuales de Lakoff explican por qué ciertas isotopías son tan frecuentes (guerra, viaje, edificio) → la isotopía guerrera en un texto argumentativo refleja la metáfora conceptual 'el argumento es una guerra'
        rationale: "La combinación semiótica-cognitiva permite un análisis más profundo: la isotopía describe el patrón textual; la metáfora conceptual explica su motivación cognitiva."
        difficulty: 5
        objectives: [es.pre_reading]
