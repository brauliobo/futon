authorNotes: "Texto expositivo sobre arte y estética en el siglo XX: las vanguardias (cubismo, dadaísmo, surrealismo), el expresionismo abstracto, el arte conceptual, la estética de Adorno y Benjamin, el ready-made de Duchamp, la industria cultural y el arte en la era de la reproducción técnica."
example: "Lee con atención a los movimientos artísticos, sus manifiestos teóricos y los debates filosóficos sobre qué constituye una obra de arte."
