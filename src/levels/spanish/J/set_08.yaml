        correctAnswer: qué hace que algo sea arte: al exhibir un urinario como obra de arte, Duchamp desafió los criterios institucionales y estéticos que definen el arte
        rationale: "El texto: 'Marcel Duchamp exhibió un urinario como obra de arte ('Fuente', 1917), cuestionando qué hace que algo sea arte'."
        difficulty: 5
