pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El siglo XX fue escenario de una radical redefinición del arte. Las vanguardias históricas (1905-1940) rompieron con la tradición representacional. El cubismo (Picasso, Braque) fragmentó la perspectiva única, mostrando múltiples puntos de vista simultáneamente. El dadaísmo (Tzara, Duchamp) atacó el concepto mismo de arte con provocaciones nihilistas: Marcel Duchamp exhibió un urinario como obra de arte ('Fuente', 1917), cuestionando qué hace que algo sea arte. El surrealismo (Breton, Dalí, Miró) exploró el inconsciente, el sueño y el automatismo psíquico como fuentes de creatividad, influido por Freud. Walter Benjamin, en 'La obra de arte en la era de la reproducción técnica' (1935), analizó cómo la reproducción mecánica destruye el 'aura' de la obra original: la unicidad y autenticidad que le confería su lugar en la tradición ritual. La Escuela de Frankfurt, con Theodor Adorno, criticó la 'industria cultural': la producción masiva estandarizada de cultura que convierte la experiencia estética en mercancía y anestesia la capacidad crítica del espectador. El expresionismo abstracto estadounidense (Pollock, Rothko) potenció la expresión gestual y emocional por encima de la representación. El arte conceptual (Kosuth, LeWitt) de los años 1960 propuso que la idea o concepto es la obra, no el objeto físico: 'Una y tres sillas' de Kosuth pone junto una silla real, una fotografía y la definición del diccionario, cuestionando la relación entre objeto, imagen y concepto. El arte contemporáneo incluye el arte de apropiación, el arte relacional (Bourriaud), el arte de instalación y el net art."
