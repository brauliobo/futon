title: Gramática - Semántica Cognitiva y Lingüística Cognitiva
level: J
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Lingüística cognitiva: la metáfora conceptual (Lakoff y Johnson), la metonimia conceptual, los esquemas de imagen (container, path, force), la gramática cognitiva (Langacker), la categorización prototípica (Rosch), los marcos semánticos (Fillmore, FrameNet), la teoría de los espacios mentales (Fauconnier), el blending conceptual (Fauconnier y Turner), la semántica de prototipos y los efectos de tipicidad."
example: "metáfora conceptual → EL TIEMPO ES DINERO: 'gastar tiempo', 'ahorrar tiempo', 'perder tiempo', 'invertir tiempo' → la metáfora no es estilística sino que estructura el pensamiento. container schema → el cuerpo como contenedor: 'entró en pánico', 'salió corriendo', 'está fuera de sí'. metonimia → LA PARTE POR EL TODO: 'necesitamos más manos' (= trabajadores). prototipo → 'pájaro': el gorrión es más prototípico que el pingüino → los miembros de una categoría tienen distintos grados de representatividad. blending → 'un cirujano es un carnicero': se integran dos espacios (cirugía + carnicería) para crear un espacio combinado con propiedades emergentes."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Lingüística Cognitiva - Conceptos Fundamentales
    description: Identifica los conceptos de la lingüística cognitiva y la semántica conceptual.
    exercises:
      - type: grammar
        question: "¿Qué son las metáforas conceptuales en la teoría de Lakoff y Johnson? (figuras retóricas/estructuras cognitivas fundamentales que organizan el pensamiento: EL TIEMPO ES DINERO ('gastar tiempo', 'ahorrar tiempo', 'invertir tiempo') → las metáforas conceptuales no son estilísticas sino que estructuran cómo pensamos/adornos del lenguaje literario)"
        correctAnswer: "estructuras cognitivas fundamentales que organizan el pensamiento: EL TIEMPO ES DINERO ('gastar tiempo', 'ahorrar tiempo', 'invertir tiempo') → las metáforas conceptuales no son estilísticas sino que estructuran cómo pensamos"
        rationale: "Lakoff y Johnson (Metaphors We Live By, 1980): las metáforas conceptuales son ubicuas en el lenguaje cotidiano → revelan cómo conceptualizamos dominios abstractos a través de dominios concretos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un esquema de imagen (image schema) en lingüística cognitiva? (un imagen mental/una estructura cognitiva abstracta que emerge de la experiencia corporal recurrente: CONTAINER (dentro/fuera), PATH (origen-trayecto-destino), FORCE (empujar, resistir) → subyacen a las metáforas conceptuales/un diagrama sintáctico)"
        correctAnswer: "una estructura cognitiva abstracta que emerge de la experiencia corporal recurrente: CONTAINER (dentro/fuera), PATH (origen-trayecto-destino), FORCE (empujar, resistir) → subyacen a las metáforas conceptuales"
        rationale: "Esquemas de imagen (Johnson, Lakoff): el cuerpo es la base del pensamiento abstracto → la mente es embodied (corporizada) → los esquemas se proyectan metafóricamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la categorización prototípica de Rosch? (categorizar por definición/los miembros de una categoría tienen distintos grados de representatividad (tipicidad): el gorrión es el 'mejor ejemplo' de pájaro; el pingüino, uno marginal → las categorías tienen estructura radial, no límites claros/categorizar por frecuencia)"
        correctAnswer: "los miembros de una categoría tienen distintos grados de representatividad (tipicidad): el gorrión es el 'mejor ejemplo' de pájaro; el pingüino, uno marginal → las categorías tienen estructura radial, no límites claros"
        rationale: "Rosch (1975): los efectos de prototipicidad → los tiempos de reacción y los juicios de tipicidad muestran que las categorías no tienen límites claros → desafía la semántica de condiciones necesarias y suficientes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un marco semántico (frame) en el sentido de Fillmore? (un argumento retórico/una estructura de conocimiento enciclopédico que activan las palabras: 'vender' activa el marco TRANSACCIÓN COMERCIAL con sus participantes (vendedor, comprador, mercancía, precio) → el significado es relativo al frame/el mismo que un esquema de imagen)"
        correctAnswer: "una estructura de conocimiento enciclopédico que activan las palabras: 'vender' activa el marco TRANSACCIÓN COMERCIAL con sus participantes (vendedor, comprador, mercancía, precio) → el significado es relativo al frame"
        rationale: "FrameNet (Fillmore): los marcos son la base del significado léxico → comprender 'comprar' requiere conocer el marco TRANSACCIÓN COMERCIAL con sus roles temáticos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la metonimia conceptual y en qué difiere de la metáfora? (son sinónimos/metáfora: mapeo entre dos dominios distintos (EL TIEMPO ES DINERO); metonimia: una entidad representa a otra dentro del mismo dominio: LA PARTE POR EL TODO ('necesitamos más manos'), EL AUTOR POR LA OBRA ('leer a Cervantes')/la metonimia es siempre literal)"
        correctAnswer: "metáfora: mapeo entre dos dominios distintos (EL TIEMPO ES DINERO); metonimia: una entidad representa a otra dentro del mismo dominio: LA PARTE POR EL TODO ('necesitamos más manos'), EL AUTOR POR LA OBRA ('leer a Cervantes')"
        rationale: "Metonimia conceptual: la contigüidad dentro del dominio la distingue de la metáfora (similitud entre dominios) → 'El Kremlin anunció' (lugar por institución) es metonimia conceptual."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el blending (integración conceptual) de Fauconnier y Turner? (un tipo de traducción/la operación cognitiva de integrar elementos de varios espacios mentales en un 'espacio combinado' con propiedades emergentes: 'un cirujano es un carnicero' integra [cirugía] + [carnicería] → la crueldad emerge del blend/una metáfora simple)"
        correctAnswer: "la operación cognitiva de integrar elementos de varios espacios mentales en un 'espacio combinado' con propiedades emergentes: 'un cirujano es un carnicero' integra [cirugía] + [carnicería] → la crueldad emerge del blend"
        rationale: "Blending (Fauconnier y Turner, 2002): el espacio combinado tiene propiedades que no están en ninguno de los inputs → creatividad cognitiva, humor, ironía, metáfora novedosa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué propone la gramática cognitiva de Langacker sobre la gramática? (que la gramática es modular/que la gramática no es un módulo separado sino que las estructuras gramaticales son unidades simbólicas (forma + significado) que forman un continuo con el léxico → no hay diferencia cualitativa entre gramática y léxico/que la gramática es innata)"
        correctAnswer: que la gramática no es un módulo separado sino que las estructuras gramaticales son unidades simbólicas (forma + significado) que forman un continuo con el léxico → no hay diferencia cualitativa entre gramática y léxico
        rationale: "Langacker: gramática cognitiva → todas las unidades lingüísticas son simbólicas → contrasta con el modularismo chomskiano donde la gramática y el léxico son módulos distintos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los espacios mentales de Fauconnier? (los idiomas mentales/espacios cognitivos parciales que se construyen durante el discurso para organizar la referencia: 'En la película, el detective encuentra al asesino' → el espacio 'película' es distinto del espacio 'realidad'/fragmentos de conocimiento almacenado)"
        correctAnswer: "espacios cognitivos parciales que se construyen durante el discurso para organizar la referencia: 'En la película, el detective encuentra al asesino' → el espacio 'película' es distinto del espacio 'realidad'"
        rationale: "Espacios mentales: estructuran la interpretación del discurso → los operadores de espacio ('en la película', 'según Pedro', 'en el pasado') instauran nuevos espacios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo explica la lingüística cognitiva la polisemia de las preposiciones? (como un error del sistema/como una red radial de sentidos relacionados: la preposición 'en' tiene un sentido prototípico (CONTAINER: 'está en la caja') y sentidos extendidos metafónica o metonímicamente ('está en problemas', 'en tres días')/como homonimia)"
        correctAnswer: "como una red radial de sentidos relacionados: la preposición 'en' tiene un sentido prototípico (CONTAINER: 'está en la caja') y sentidos extendidos metafónica o metonímicamente ('está en problemas', 'en tres días')"
        rationale: "Polisemia cognitiva: los sentidos se organizan en redes radiales → el sentido prototípico es el más concreto/espacial; los extendidos son proyecciones metafóricas o metonímicas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué implica la tesis de la cognición corporizada (embodied cognition) para la lingüística? (que el cuerpo no importa/que el lenguaje y el significado están anclados en la experiencia sensoriomotriz del cuerpo: 'entender' (comprender) = 'tener en las manos'; 'agarrar' = 'comprender' → las metáforas revelan el origen corporal del pensamiento abstracto/que el lenguaje es puramente mental)"
        correctAnswer: "que el lenguaje y el significado están anclados en la experiencia sensoriomotriz del cuerpo: 'entender' (comprender) = 'tener en las manos'; 'agarrar' = 'comprender' → las metáforas revelan el origen corporal del pensamiento abstracto"
        rationale: "Embodied cognition: Lakoff/Johnson/Varela → el significado no es abstracto sino que emerge de la interacción del cuerpo con el mundo → desafía las semánticas formales abstractas."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Aplicación de la Lingüística Cognitiva
    description: Aplica los conceptos cognitivos al análisis del lenguaje.
    exercises:
      - type: grammar
        question: "¿Qué metáfora conceptual subyace a 'La economía se recuperó', 'cayó en recesión', 'está en números rojos'? (ninguna/LA ECONOMÍA ES UN CUERPO/SER VIVO: los estados económicos se conceptualizan como estados de salud o enfermedad del cuerpo → 'recuperarse', 'caer', 'enfermar' revelan el marco cognitivo biomédico de la economía/EL DINERO ES AGUA)"
        correctAnswer: "LA ECONOMÍA ES UN CUERPO/SER VIVO: los estados económicos se conceptualizan como estados de salud o enfermedad del cuerpo → 'recuperarse', 'caer', 'enfermar' revelan el marco cognitivo biomédico de la economía"
        rationale: "Metáfora conceptual en el discurso económico: 'recuperación', 'contracción', 'enfermedad económica' → el dominio fuente (cuerpo/salud) estructura el dominio meta (economía)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'Este profesor es un roble' es un blend conceptual? (es solo una metáfora/porque combina dos espacios (ser humano/roble) creando un espacio integrado donde emergen propiedades de ambos: la fortaleza y la solidez del roble se integran con las cualidades del profesor → el resultado tiene propiedades que ninguno de los dos aporta solo/es una comparación)"
        correctAnswer: "porque combina dos espacios (ser humano/roble) creando un espacio integrado donde emergen propiedades de ambos: la fortaleza y la solidez del roble se integran con las cualidades del profesor → el resultado tiene propiedades que ninguno de los dos aporta solo"
        rationale: "Blending: la metáfora novedosa es un blend → las propiedades emergentes (robustez, incorruptibilidad, permanencia) no están explícitamente en ninguno de los espacios de entrada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo analiza la lingüística cognitiva las construcciones de movimiento ficticio ('La autopista atraviesa el desierto')? (como errores/como proyección del esquema PATH sobre una entidad estática: la carretera no se mueve, pero la conceptualizamos como si trazara un camino a través del espacio → movimiento fictivo (Talmy)/como metáforas simples)"
        correctAnswer: "como proyección del esquema PATH sobre una entidad estática: la carretera no se mueve, pero la conceptualizamos como si trazara un camino a través del espacio → movimiento fictivo (Talmy)"
        rationale: "Movimiento fictivo (Talmy): la mente proyecta dinamismo sobre entidades estáticas → 'La cadena montañosa corre de norte a sur' → el PATH schema se aplica a la percepción espacial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué efectos de prototipicidad se observan con 'ave'? (que todas las aves son iguales/que el gorrión se nombra más rápido que el pingüino como ejemplar de 'ave'; la isla es prototípica para 'mueble'; los pingüinos y murciélagos son 'aves/mamíferos' marginales → los tiempos de reacción y los juicios muestran gradación/que todos los conceptos son borrosos)"
        correctAnswer: que el gorrión se nombra más rápido que el pingüino como ejemplar de 'ave'; la isla es prototípica para 'mueble'; los pingüinos y murciélagos son 'aves/mamíferos' marginales → los tiempos de reacción y los juicios muestran gradación
        rationale: "Efectos de prototipicidad: medidos experimentalmente (Rosch) → las categorías naturales tienen estructura interna gradiente, no límites nítidos → desafía la semántica de condiciones necesarias y suficientes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo activa la palabra 'herencia' distintos marcos semánticos según el contexto? (no activa marcos/en el marco FAMILIA: herencia = legado de bienes; en el marco BIOLOGÍA: herencia = transmisión genética; en el marco CULTURA: herencia = patrimonio cultural → la palabra es polisémica porque activa distintos frames/cada palabra tiene un solo significado)"
        correctAnswer: "en el marco FAMILIA: herencia = legado de bienes; en el marco BIOLOGÍA: herencia = transmisión genética; en el marco CULTURA: herencia = patrimonio cultural → la palabra es polisémica porque activa distintos frames"
        rationale: "Polisemia y frames: la palabra 'herencia' es un nodo que activa distintos frames según el contexto → el significado emerge de la interacción entre la palabra y el frame activado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la metonimia 'leer a Kafka' es más eficiente comunicativamente que 'leer la obra de Kafka'? (porque es más corta/porque activa el mismo frame mediante una relación de contigüidad dentro del dominio literario (AUTOR por OBRA) → la metonimia es cognitivamente económica: usa un elemento para acceder al todo del frame/por razones estilísticas)"
        correctAnswer: "porque activa el mismo frame mediante una relación de contigüidad dentro del dominio literario (AUTOR por OBRA) → la metonimia es cognitivamente económica: usa un elemento para acceder al todo del frame"
        rationale: "Metonimia como acceso cognitivo: el elemento metonímico es un punto de acceso (cognitive reference point) al frame completo → es la función cognitiva principal de la metonimia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la metáfora convencional de la metáfora novedosa en lingüística cognitiva? (la longitud/convencional: automatizada, no se percibe como metáfora ('el pie de la montaña', 'perder el tiempo'); novedosa: activa conscientemente dos dominios y produce un efecto estético o cognitivo especial/solo las novedosas tienen base conceptual)"
        correctAnswer: "convencional: automatizada, no se percibe como metáfora ('el pie de la montaña', 'perder el tiempo'); novedosa: activa conscientemente dos dominios y produce un efecto estético o cognitivo especial"
        rationale: "Metáforas dormidas vs. activas: las convencionales se lexicalizan → las novedosas (poéticas) crean blends o reactivan el potencial cognitivo de la metáfora convencional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué implica que las categorías tengan 'parecidos de familia' (Wittgenstein) para la semántica cognitiva? (que las familias son importantes/que los miembros de una categoría pueden compartir distintas propiedades entre sí sin que haya una propiedad común a todos: JUEGO tiene subcategorías (juegos de cartas, deportes, juegos de mesa) que no comparten todas las propiedades/que las categorías son innatas)"
        correctAnswer: "que los miembros de una categoría pueden compartir distintas propiedades entre sí sin que haya una propiedad común a todos: JUEGO tiene subcategorías (juegos de cartas, deportes, juegos de mesa) que no comparten todas las propiedades"
        rationale: "Parecidos de familia (Wittgenstein) → Rosch: las categorías naturales son prototipos, no definiciones → el significado no se reduce a condiciones necesarias y suficientes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo explica el constructivismo cognitivo la competencia gramatical? (que la gramática es modular e innata/que la gramática emerge de patrones estadísticos en el uso: las 'construcciones' (Goldberg) son pares forma-significado que el hablante aprende del input → la gramática es un inventario de construcciones, no de reglas abstractas/que la gramática no existe)"
        correctAnswer: "que la gramática emerge de patrones estadísticos en el uso: las 'construcciones' (Goldberg) son pares forma-significado que el hablante aprende del input → la gramática es un inventario de construcciones, no de reglas abstractas"
        rationale: "Gramática de construcciones (Goldberg): toda la gramática es constructiva → incluyendo los patrones más abstractos (la construcción ditransitiva: 'Juan le dio un libro a María') → alternativa al generativismo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el concepto de 'dominio fuente' y 'dominio meta' es fundamental en la teoría de la metáfora conceptual? (es solo terminología/el dominio fuente (concreto, familiar: el cuerpo, el espacio, las fuerzas físicas) estructura el dominio meta (abstracto: el tiempo, las emociones, las ideas) → sin el dominio fuente, el dominio meta no es conceptualizable/los dominios son intercambiables)"
        correctAnswer: "el dominio fuente (concreto, familiar: el cuerpo, el espacio, las fuerzas físicas) estructura el dominio meta (abstracto: el tiempo, las emociones, las ideas) → sin el dominio fuente, el dominio meta no es conceptualizable"
        rationale: "Dominio fuente → dominio meta: la proyección es asimétrica → solo el concreto estructura el abstracto, no a la inversa → 'el tiempo es espacio' funciona; 'el espacio es tiempo' no."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
