title: Gramática - El Español en el Mundo
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "El español: segunda lengua materna del mundo (~500M hablantes nativos), cuarta en total. Distribución geográfica: 21 países. Contacto de lenguas: bilingüismo, diglosia, código mixto (espanglish). Lenguas en contacto con el español: catalán, gallego, vasco, guaraní, quechua, náhuatl, mapudungun, etc. Variedades en contacto: influencias mutuas. Español como lengua extranjera: Instituto Cervantes. Política lingüística: Constitución española (artículo 3), cooficialidad. Expansión del español en EE.UU. Lengua vehicular e internacional."
example: "cooficialidad → catalán, gallego y vasco son cooficiales en sus territorios. espanglish → código mixto en comunidades hispanas de EE.UU. guaraní cooficial con español en Paraguay. artículo 3 CE → castellano: lengua oficial del Estado. Instituto Cervantes → enseñanza del español en el mundo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Distribución y Política Lingüística
    description: Identifica los datos y conceptos del español global.
    exercises:
      - type: grammar
        question: "¿Cuántos países tienen el español como lengua oficial? (13/21/30)"
        correctAnswer: 21
        rationale: "El español es lengua oficial en 21 países de América, Europa (España), África (Guinea Ecuatorial) y Oceanía (Filipinas no)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la posición del español en número de hablantes nativos? (primera/segunda/tercera)"
        correctAnswer: segunda
        rationale: "El español es la segunda lengua del mundo por número de hablantes nativos, tras el chino mandarín."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué artículo de la Constitución española regula el uso del castellano y las otras lenguas? (artículo 1/artículo 3/artículo 27)"
        correctAnswer: artículo 3
        rationale: "El artículo 3 de la CE establece que el castellano es la lengua oficial del Estado y que las demás lenguas españolas son cooficiales en sus respectivas Comunidades."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son las lenguas cooficiales en España junto al castellano? (francés, italiano y portugués/catalán/valenciano, gallego y vasco/solo el catalán)"
        correctAnswer: catalán/valenciano, gallego y vasco
        rationale: "Las lenguas cooficiales reconocidas son el catalán (y el valenciano), el gallego y el euskera (vasco)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el único país donde el guaraní es cooficial con el español? (Bolivia/México/Paraguay)"
        correctAnswer: Paraguay
        rationale: "En Paraguay el guaraní y el español son cooficiales, siendo el guaraní la lengua más hablada en el hogar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el espanglish? (un dialecto latinoamericano/código mixto que combina español e inglés en comunidades hispanas de EE.UU./una variedad del español caribeño)"
        correctAnswer: código mixto que combina español e inglés en comunidades hispanas de EE.UU.
        rationale: "El espanglish (o spanglish) es el resultado del contacto intenso entre español e inglés en EE.UU.: code-switching y préstamos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué institución promueve la enseñanza del español en el mundo? (la RAE/el Instituto Cervantes/el Ministerio de Educación español)"
        correctAnswer: el Instituto Cervantes
        rationale: "El Instituto Cervantes (fundado en 1991) es la institución pública española que promueve el español y la cultura hispánica en el mundo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el bilingüismo social? (hablar dos idiomas perfectamente/situación en que una comunidad usa dos lenguas con distintas funciones sociales/la traducción simultánea)"
        correctAnswer: situación en que una comunidad usa dos lenguas con distintas funciones sociales
        rationale: "El bilingüismo social describe comunidades donde dos lenguas coexisten con distintas funciones y prestigios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué influencia ha dejado el quechua en el español andino? (ninguna/palabras como 'cancha', 'papa', 'coca' y fenómenos fonéticos/solo préstamos gastronómicos)"
        correctAnswer: palabras como 'cancha', 'papa', 'coca' y fenómenos fonéticos
        rationale: "El contacto con el quechua en el español andino (Perú, Bolivia, Ecuador) ha producido americanismos léxicos y rasgos fonéticos específicos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántos hablantes de español se estima que hay en EE.UU.? (5 millones/60 millones/más de 50 millones)"
        correctAnswer: más de 50 millones
        rationale: "EE.UU. tiene más de 50 millones de hablantes de español, lo que lo convierte en el segundo país del mundo por número de hispanohablantes."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Contacto de Lenguas y Variedades
    description: Practica los conceptos del contacto lingüístico.
    exercises:
      - type: grammar
        question: "¿Qué es un préstamo léxico? (un calco/una palabra tomada de otra lengua que se integra al sistema receptor/un neologismo interno)"
        correctAnswer: una palabra tomada de otra lengua que se integra al sistema receptor
        rationale: "Préstamo: 'fútbol' (del inglés 'football'), 'garaje' (del francés 'garage') → integrados al español."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un calco lingüístico? (un préstamo fonético/traducir morfema a morfema una expresión de otra lengua: 'rascacielos' del inglés 'skyscraper'/un arabismo)"
        correctAnswer: traducir morfema a morfema una expresión de otra lengua: 'rascacielos' del inglés 'skyscraper'
        rationale: "Calco: se traduce la estructura de la lengua origen: 'baloncesto' de 'basketball', 'luna de miel' de 'honeymoon'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el cambio de código (code-switching)? (error gramatical/alternancia entre dos lenguas en un mismo discurso/dialecto marginal)"
        correctAnswer: alternancia entre dos lenguas en un mismo discurso
        rationale: "El code-switching es el uso alternante de dos lenguas por hablantes bilingües, según el interlocutor o tema."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la lengua con más hablantes totales del mundo? (español/inglés/chino mandarín)"
        correctAnswer: chino mandarín
        rationale: "El chino mandarín tiene el mayor número de hablantes nativos; el inglés tiene más hablantes totales (incluidos los no nativos)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una lengua vehicular? (una lengua que se hereda/una lengua que sirve de comunicación entre grupos con distintas lenguas maternas/una lengua extinta)"
        correctAnswer: una lengua que sirve de comunicación entre grupos con distintas lenguas maternas
        rationale: "El español es lengua vehicular en América Latina: permite la comunicación entre hablantes de quechua, maya, guaraní, etc."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la interferencia lingüística? (un calco/la influencia de la lengua materna sobre la segunda lengua aprendida, causando errores/un tipo de préstamo)"
        correctAnswer: la influencia de la lengua materna sobre la segunda lengua aprendida, causando errores
        rationale: "La interferencia ocurre cuando estructuras de L1 se transfieren a L2 produciendo desviaciones de la norma."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el náhuatl? (una variante del español/lengua indígena de México que dio palabras como 'tomate', 'aguacate', 'chocolate'/una lengua africana)"
        correctAnswer: lengua indígena de México que dio palabras como 'tomate', 'aguacate', 'chocolate'
        rationale: "El náhuatl (lengua azteca) ha dado muchos nahuatlismos al español: tomate, aguacate, chocolate, cacao, chile."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la principal diferencia fonética entre el español americano y el peninsular estándar? (el voseo/el seseo (ausencia de distinción s/z/c) generalizado en América/la aspiración de la h)"
        correctAnswer: el seseo (ausencia de distinción s/z/c) generalizado en América
        rationale: "El seseo es el rasgo fonológico más sistemático del español americano: no distingue entre /s/ y /θ/."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una lengua de herencia? (una lengua clásica/la lengua que aprenden quienes la oyeron en casa pero crecieron en un entorno de otra lengua dominante/una lengua muerta)"
        correctAnswer: la lengua que aprenden quienes la oyeron en casa pero crecieron en un entorno de otra lengua dominante
        rationale: "Los hispanohablantes de segunda generación en EE.UU. suelen tener el español como lengua de herencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la política lingüística? (la gramática oficial/el conjunto de decisiones de un Estado sobre el estatus, uso y enseñanza de las lenguas en su territorio/la fonética normativa)"
        correctAnswer: el conjunto de decisiones de un Estado sobre el estatus, uso y enseñanza de las lenguas en su territorio
        rationale: "La política lingüística determina qué lenguas son oficiales, cómo se enseñan y qué derechos tienen sus hablantes."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
