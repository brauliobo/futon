title: 🔬 Gramática - Pragmática Avanzada - Deixis e Implicatura
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Pragmática avanzada: deixis (personal, espacial, temporal, discursiva). Implicaturas conversacionales (Grice): convencionales vs. conversacionales; generalizadas vs. particularizadas. Violación de máximas → implicaturas. Presuposición vs. aseveración. Actos de habla directos e indirectos (Austin/Searle). Cortesía lingüística (Leech, Brown y Levinson): imagen positiva y negativa, estrategias de cortesía. Principio de relevancia (Sperber y Wilson)."
example: "deixis personal → 'yo/tú/él' cambia de referente según quién habla. deixis espacial → 'aquí/ahí/allí' relativo al hablante. implicatura → 'Juan es puntual a veces' implica que no siempre lo es. presuposición → '¿Has dejado de fumar?' presupone que fumabas. cortesía negativa → 'No te molestará si...'. cortesía positiva → 'Qué buena idea la tuya'. acto indirecto → '¿Tienes hora?' = pedir la hora."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Deixis, Implicatura y Presuposición
    description: Identifica los fenómenos pragmáticos en los enunciados.
    exercises:
      - type: grammar
        question: "¿Qué tipo de deixis hay en 'Ven aquí'? (personal/espacial/temporal)"
        correctAnswer: espacial
        rationale: "'Aquí' indica el espacio desde el punto de vista del hablante → deixis espacial (o locativa)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ahora no puedo hablar.' ¿Tipo de deixis? (personal/temporal/discursiva)"
        correctAnswer: temporal
        rationale: "'Ahora' solo puede interpretarse en relación al momento del habla → deixis temporal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una implicatura conversacional? (lo que dice literalmente el hablante/lo que el hablante comunica sin decirlo explícitamente, derivado del contexto y las máximas conversacionales/una presuposición)"
        correctAnswer: lo que el hablante comunica sin decirlo explícitamente, derivado del contexto y las máximas conversacionales
        rationale: "Implicatura (Grice): significado implícito derivado del principio de cooperación. 'Algo es algo' implica 'no mucho'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Has dejado de fumar?' ¿Qué presupone? (que el oyente no ha fumado nunca/que el oyente fumaba antes/que el hablante quiere saber la fecha)"
        correctAnswer: que el oyente fumaba antes
        rationale: "Presuposición: información presupuesta como verdadera al formular la pregunta → 'dejar de X' presupone 'hacías X'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre presuposición y aseveración? (son sinónimas/la aseveración es lo que se afirma; la presuposición es lo que se da por supuesto al emitir el enunciado/la presuposición es más fuerte)"
        correctAnswer: la aseveración es lo que se afirma; la presuposición es lo que se da por supuesto al emitir el enunciado
        rationale: "Aseveración: 'Juan ya no viene' → la presuposición es que Juan venía antes; la aseveración es que ya no viene."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué máxima de Grice viola 'Juan es Juan'? (cantidad: no aporta información nueva/sin embargo comunica que Juan es como es: violación irónica que genera implicatura/cualidad)"
        correctAnswer: "cantidad: no aporta información nueva"
        rationale: "'Juan es Juan' viola la máxima de cantidad (no añade info) pero implica 'tiene el carácter que todos le conocemos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las estrategias de cortesía negativa? (insultos velados/estrategias que preservan la imagen negativa (autonomía, no imposición) del oyente: 'Si no te molesta.../Quizás podrías.../No quisiera interrumpir pero...'/expresiones afectivas)"
        correctAnswer: "estrategias que preservan la imagen negativa (autonomía, no imposición) del oyente: 'Si no te molesta.../Quizás podrías.../No quisiera interrumpir pero...'"
        rationale: "Cortesía negativa (Brown/Levinson): minimiza la amenaza a la autonomía del oyente → formas evasivas, condicionales, diminutivos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de deixis es 'como dije antes'? (temporal/espacial/discursiva o anafórica: referencia a un fragmento anterior del discurso)"
        correctAnswer: "discursiva o anafórica: referencia a un fragmento anterior del discurso"
        rationale: "Deixis discursiva: el deíctico apunta a una parte del propio texto → 'como dije antes', 'lo que sigue', 'en el capítulo anterior'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué propone el principio de relevancia (Sperber y Wilson)? (que debemos hablar poco/que la comunicación se rige por la búsqueda del mayor efecto cognitivo con el menor esfuerzo de procesamiento/que la cortesía es lo más importante)"
        correctAnswer: que la comunicación se rige por la búsqueda del mayor efecto cognitivo con el menor esfuerzo de procesamiento
        rationale: "El principio de relevancia: los enunciados comunican la presunción de su propia relevancia óptima → efecto/esfuerzo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la imagen positiva de una persona según Brown y Levinson? (su reputación económica/la necesidad de ser apreciado, aprobado y reconocido por los demás/su imagen física)"
        correctAnswer: la necesidad de ser apreciado, aprobado y reconocido por los demás
        rationale: "Imagen positiva (face positiva): querer gustar, ser valorado → amenazada por críticas, desacuerdos, rechazos."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Actos de Habla y Análisis Pragmático
    description: Aplica los conceptos pragmáticos al análisis de enunciados.
    exercises:
      - type: grammar
        question: "¿Cuál es la fuerza ilocutiva de '¿Podrías bajar la música?'? (pregunta sobre capacidad/petición indirecta/orden directa)"
        correctAnswer: petición indirecta
        rationale: "Acto de habla indirecto: forma interrogativa (¿podrías?) pero fuerza ilocutiva de ruego/petición."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué presupone 'El rey de Francia es calvo'? (que Francia existe/que hay un rey de Francia actualmente/que el hablante conoce al rey)"
        correctAnswer: que hay un rey de Francia actualmente
        rationale: "Presuposición de existencia: usar 'el rey de Francia' presupone que existe tal entidad. Russell señaló que esta presuposición es falsa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué implicatura genera 'Algunos estudiantes aprobaron'? (que todos aprobaron/que no todos aprobaron (implicatura escalar: algunos → no todos)/que nadie aprobó)"
        correctAnswer: "que no todos aprobaron (implicatura escalar: algunos → no todos)"
        rationale: "Implicatura escalar: si hubieran aprobado todos, el hablante habría dicho 'todos' → decir 'algunos' implica 'no todos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la deixis personal de segunda persona en '¿Cómo te llamas?'? (se refiere siempre al mismo individuo/es deíctica: el referente de 'te' cambia según quién sea el interlocutor/es anafórica)"
        correctAnswer: "es deíctica: el referente de 'te' cambia según quién sea el interlocutor"
        rationale: "La deixis personal es indexical: 'yo/tú' no tienen referente fijo, dependen del rol comunicativo en cada acto de habla."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué hace un acto de habla performativo? (describe una realidad/al pronunciarse, crea o modifica la realidad: 'Os declaro marido y mujer'/expresa una emoción)"
        correctAnswer: "al pronunciarse, crea o modifica la realidad: 'Os declaro marido y mujer'"
        rationale: "Performativos (Austin): el enunciado no describe sino que hace: 'prometo', 'declaro', 'apuesto', 'bautizo'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'Hace frío aquí' puede ser una petición de cerrar la ventana? (error gramatical/acto de habla indirecto: la forma asertiva comunica una petición según el contexto/es una pregunta retórica)"
        correctAnswer: "acto de habla indirecto: la forma asertiva comunica una petición según el contexto"
        rationale: "Los actos indirectos usan una forma ilocutiva (aseveración) para realizar otra (petición) → el oyente infiere la fuerza real."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se cancelan las implicaturas conversacionales? (nunca/pueden cancelarse añadiendo contexto: 'Algunos vinieron, de hecho todos vinieron' cancela la implicatura/son como presupuestos, no cancelables)"
        correctAnswer: "pueden cancelarse añadiendo contexto: 'Algunos vinieron, de hecho todos vinieron' cancela la implicatura"
        rationale: "La cancelabilidad distingue implicaturas de presuposiciones: las implicaturas se pueden cancelar; las presuposiciones son más resistentes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la imagen negativa o face negativa de una persona? (su mala reputación/la necesidad de no ser molestado, tener autonomía y territorio personal/la imagen social positiva)"
        correctAnswer: la necesidad de no ser molestado, tener autonomía y territorio personal
        rationale: "Face negativa (Brown/Levinson): el deseo de libertad de acción → amenazada por órdenes, peticiones, imposiciones."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de acto de habla es una promesa? (locutivo/ilocutivo comprometiente: el hablante se compromete a hacer algo/perlocutivo)"
        correctAnswer: "ilocutivo comprometiente: el hablante se compromete a hacer algo"
        rationale: "Promesa = acto ilocutivo comprometiente (comissive en Searle): el hablante se obliga a un curso de acción futuro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la condición de sinceridad de una promesa? (que el oyente quiera que se haga/que el hablante tenga intención real de cumplirla/que sea posible realizarla)"
        correctAnswer: que el hablante tenga intención real de cumplirla
        rationale: "Las condiciones de felicidad de Austin/Searle para la promesa incluyen la sinceridad: el hablante debe pretender cumplirla."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
