pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La neurociencia del aprendizaje estudia cómo el cerebro adquiere, procesa y consolida información. La neuroplasticidad es la capacidad del cerebro para reorganizarse formando nuevas conexiones sinápticas en respuesta a la experiencia. Donald Hebb formuló en 1949 el principio que lleva su nombre: 'las neuronas que se disparan juntas, se conectan juntas', base de la memoria asociativa. La memoria humana opera en varios sistemas: la memoria de trabajo (o memoria operativa) tiene una capacidad limitada de aproximadamente 7±2 elementos (George Miller, 1956) y es el 'escritorio' del pensamiento consciente. La consolidación transforma la memoria a corto plazo en memoria a largo plazo durante el sueño, especialmente en la fase REM y en la fase de ondas lentas (sueño profundo). El hipocampo es clave en la formación de memorias declarativas (episódicas y semánticas), mientras que el cerebelo y los ganglios basales participan en la memoria procedimental. La atención selectiva actúa como filtro: solo la información a la que prestamos atención entra en la memoria de trabajo. Las emociones modulan el aprendizaje: la amígdala refuerza la consolidación de memorias emocionalmente significativas. La práctica espaciada (distribuir el estudio en el tiempo) y la recuperación activa (testing effect) son las estrategias de aprendizaje con mayor respaldo empírico."
