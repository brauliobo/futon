authorNotes: "Texto expositivo sobre neurociencia cognitiva aplicada al aprendizaje: plasticidad, memoria, atención, sueño."
example: "neuroplasticidad → sinapsis (Hebb: 'neuronas que se activan juntas se conectan juntas') → memoria: MCP (7±2 ítems) → LTP → MLP (declarativa/procedimental) → consolidación durante sueño NREM → condiciones óptimas: espaciado/interleaving/retrieval practice/sueño/ejercicio."
