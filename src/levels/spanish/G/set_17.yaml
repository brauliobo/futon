pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Los sistemas políticos se clasifican según quién ostenta el poder y cómo se ejerce. La democracia (del griego demos = pueblo, kratos = poder) puede ser directa, cuando los ciudadanos participan directamente en las decisiones (como en la Atenas clásica o en los referendos modernos), o representativa, cuando eligen a representantes para que decidan en su nombre. La teoría de la separación de poderes, formulada por Montesquieu en 'El espíritu de las leyes' (1748), establece que el poder legislativo (crea las leyes), el ejecutivo (las aplica) y el judicial (las interpreta y vela por su cumplimiento) deben estar separados para evitar el abuso de poder. El estado de derecho implica que todos los ciudadanos e instituciones, incluido el propio Estado, están sometidos a la ley. La Constitución es la norma suprema del ordenamiento jurídico. Los sistemas autoritarios concentran el poder en un líder o grupo sin mecanismos efectivos de control ciudadano. El totalitarismo va más allá: controla todos los ámbitos de la vida privada y pública. La alternancia en el poder y el sufragio universal son condiciones necesarias pero no suficientes de la democracia: también son esenciales la independencia judicial, la libertad de prensa y el respeto a los derechos fundamentales."
