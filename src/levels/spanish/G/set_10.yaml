pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La filosofía del lenguaje estudia la relación entre las palabras, el pensamiento y la realidad. Gottlob Frege distinguió entre 'sentido' (Sinn) y 'referencia' (Bedeutung): 'el lucero de la mañana' y 'el lucero de la tarde' tienen distinto sentido pero la misma referencia (Venus). Bertrand Russell analizó las 'descripciones definidas' y el problema de las proposiciones sobre entidades inexistentes ('el actual rey de Francia es calvo'). Ludwig Wittgenstein, en su etapa tardía (Investigaciones filosóficas), rechazó la imagen del lenguaje como espejo de la realidad y propuso el concepto de 'juegos de lenguaje': el significado no es una entidad mental sino el uso que los hablantes hacen de las palabras en contextos específicos. John L. Austin distinguió los actos de habla en locutivos (el acto de decir algo), ilocutivos (la función que realiza: prometer, ordenar, advertir) y perlocutivos (el efecto producido en el oyente). John Searle desarrolló la teoría de los actos de habla indirectos: 'podrías cerrar la ventana' es una petición, no una pregunta sobre capacidad. Paul Grice formuló el principio de cooperación con sus máximas (cantidad, cualidad, relación y manera) para explicar cómo los hablantes infieren más de lo que se dice literalmente."
    exercises:
      - type: reading
        question: "¿Qué distinguió Frege entre 'sentido' y 'referencia'? (que son sinónimos/que sentido es el modo de presentación y referencia el objeto designado/que referencia es el significado subjetivo)"
        correctAnswer: que sentido es el modo de presentación y referencia el objeto designado
        rationale: "El texto: 'el lucero de la mañana y el lucero de la tarde tienen distinto sentido pero la misma referencia (Venus)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué propuso Wittgenstein con los 'juegos de lenguaje'? (que el lenguaje es lógica pura/que el significado es el uso de las palabras en contextos específicos/que el lenguaje refleja la realidad)"
        correctAnswer: que el significado es el uso de las palabras en contextos específicos
        rationale: "El texto: 'el significado no es una entidad mental sino el uso que los hablantes hacen de las palabras en contextos específicos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es un acto ilocutivo según Austin? (el acto de pronunciar palabras/la función que realiza el acto de habla: prometer, ordenar, advertir/el efecto producido en el oyente)"
        correctAnswer: "la función que realiza el acto de habla: prometer, ordenar, advertir"
        rationale: "El texto: 'ilocutivos (la función que realiza: prometer, ordenar, advertir)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué analizó Russell con las 'descripciones definidas'? (los nombres propios/el problema de proposiciones sobre entidades inexistentes/la gramática transformacional)"
        correctAnswer: el problema de proposiciones sobre entidades inexistentes
        rationale: "El texto: 'Russell analizó las descripciones definidas y el problema de las proposiciones sobre entidades inexistentes'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "Según Searle, '¿podrías cerrar la ventana?' es: (una pregunta sobre capacidad/un acto de habla indirecto: una petición/una orden directa)"
        correctAnswer: "un acto de habla indirecto: una petición"
        rationale: "El texto: 'Searle desarrolló la teoría de los actos de habla indirectos: podrías cerrar la ventana es una petición, no una pregunta sobre capacidad'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
