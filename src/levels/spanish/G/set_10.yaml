        correctAnswer: "cuatro: cantidad, cualidad, relación y manera"
        rationale: "El texto: 'sus máximas (cantidad, cualidad, relación y manera)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué obra desarrolló Wittgenstein el concepto de juegos de lenguaje? (Tractatus Logico-Philosophicus/Investigaciones filosóficas/El ser y la nada)"
        correctAnswer: Investigaciones filosóficas
