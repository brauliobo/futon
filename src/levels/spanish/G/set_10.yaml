authorNotes: "Texto expositivo sobre filosofía del lenguaje: de Frege a Wittgenstein, Austin y Searle."
example: "Frege: sentido (modo de presentación) ≠ referencia (objeto) → Wittgenstein tardío: significado = uso (juegos de lenguaje) → Austin/Searle: actos de habla ilocutivos/perlocutivos → Grice: principio de cooperación (cantidad/calidad/relación/modo) → implicatura conversacional."
repeatAll: 2
