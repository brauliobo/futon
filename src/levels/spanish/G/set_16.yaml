title: Gramática - Literatura del Siglo XX - Vanguardias y Generación del 27
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Vanguardias europeas y españolas: futurismo, dadaísmo, surrealismo, ultraísmo, creacionismo. Generación del 27: características, autores, revistas. Ramón Gómez de la Serna y la greguería. Federico García Lorca: obra poética y teatral. Rafael Alberti, Jorge Guillén, Pedro Salinas. La imagen vanguardista y la metáfora pura."
example: "surrealismo → escritura automática, inconsciente, imágenes irracionales. ultraísmo → metáforas puras, eliminación de la anécdota. greguería → metáfora + humor = greguería (Ramón). Generación del 27 → síntesis tradición/vanguardia; Lorca, Alberti, Guillén, Salinas, Cernuda, Aleixandre. imagen vanguardista → 'el jinete se acercaba tocando el tambor del llano' (Lorca). metáfora pura → imagen que no necesita el término real."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Vanguardias y Generación del 27
    description: Identifica las características de las vanguardias y la Generación del 27.
    exercises:
      - type: grammar
        question: "¿Cuál fue la principal aportación del surrealismo a la literatura? (el verso libre/la escritura automática y la exploración del inconsciente y las imágenes irracionales/la métrica clásica)"
        correctAnswer: la escritura automática y la exploración del inconsciente y las imágenes irracionales
        rationale: "El surrealismo (Breton, 1924) propuso la escritura automática para acceder al inconsciente y liberar la imaginación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una greguería según Ramón Gómez de la Serna? (un poema largo/metáfora + humor: síntesis brillante y sorprendente de una observación del mundo/un tipo de soneto)"
        correctAnswer: "metáfora + humor: síntesis brillante y sorprendente de una observación del mundo"
        rationale: "Greguería = humorismo + metáfora → Ramón: 'El arcoíris es la corbata del cielo.' Forma española de vanguardia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué caracterizó al ultraísmo español? (la búsqueda del inconsciente/la imagen pura, la eliminación de la anécdota y del ornamento/la vuelta a la métrica clásica)"
        correctAnswer: la imagen pura, la eliminación de la anécdota y del ornamento
        rationale: "Ultraísmo: reacción al modernismo → poesía de imágenes puras sin argumento ni sentimentalismo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué une a los poetas de la Generación del 27? (ser todos de Madrid/la síntesis entre tradición (Góngora, romancero) y vanguardia; homenaje a Góngora en 1927/escribir solo teatro)"
        correctAnswer: la síntesis entre tradición (Góngora, romancero) y vanguardia; homenaje a Góngora en 1927
        rationale: "El nombre '27' viene del tricentenario de Góngora (1927). El grupo sintetizó clasicismo y vanguardia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son las obras más conocidas de Federico García Lorca? (Campos de Castilla y Soledades/Romancero gitano y La casa de Bernarda Alba/Platero y yo y Niebla)"
        correctAnswer: Romancero gitano y La casa de Bernarda Alba
        rationale: "Lorca: Romancero gitano (1928, poesía) y teatro: Bodas de sangre, Yerma, La casa de Bernarda Alba."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la metáfora pura o imagen vanguardista? (una metáfora con término real y figurado explícitos/imagen que omite el término real: 'jinete de cristal' para la luna/una metáfora degradada)"
        correctAnswer: "imagen que omite el término real: 'jinete de cristal' para la luna"
        rationale: "La metáfora pura prescinde del tenor (término real) y solo presenta el vehículo → el lector infiere la comparación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el movimiento vanguardista fundado por Marinetti? (dadaísmo/futurismo: exaltación de la velocidad, la máquina y el dinamismo moderno/surrealismo)"
        correctAnswer: "futurismo: exaltación de la velocidad, la máquina y el dinamismo moderno"
        rationale: "Futurismo (Marinetti, 1909): primer manifiesto vanguardista → glorifica la tecnología, la velocidad y la modernidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué aportó el creacionismo de Huidobro? (el poema como imitación de la realidad/el poeta como creador de nuevas realidades con el lenguaje: 'hacer un poema como la naturaleza hace un árbol'/el prosaísmo poético)"
        correctAnswer: "el poeta como creador de nuevas realidades con el lenguaje: 'hacer un poema como la naturaleza hace un árbol'"
        rationale: "Creacionismo (Huidobro): el poema no refleja la realidad, la crea → influencia en Gerardo Diego."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué poeta del 27 obtuvo el Premio Nobel de Literatura? (Federico García Lorca/Vicente Aleixandre/Rafael Alberti)"
        correctAnswer: Vicente Aleixandre
        rationale: "Vicente Aleixandre recibió el Nobel en 1977 → única vez que un miembro de la Generación del 27 recibió este premio."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el dadaísmo es considerado la vanguardia más radical? (por su complejidad formal/por su nihilismo antiartístico: negaba todo valor al arte y a la racionalidad/por su uso del soneto)"
        correctAnswer: "por su nihilismo antiartístico: negaba todo valor al arte y a la racionalidad"
        rationale: "Dadaísmo (Tzara, 1916): reacción al absurdo de la I Guerra Mundial → negación de la razón y del arte mismo."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis Literario - Vanguardias y 27
    description: Practica el análisis de los movimientos vanguardistas.
    exercises:
      - type: grammar
        question: "¿Qué distingue la poesía de la Generación del 27 de las vanguardias europeas puras? (que usa más rima/que sintetiza vanguardia y tradición española: Góngora, romancero, Bécquer/que rechaza las imágenes)"
        correctAnswer: "que sintetiza vanguardia y tradición española: Góngora, romancero, Bécquer"
        rationale: "La singularidad del 27: no rompe con la tradición sino que la integra con las técnicas vanguardistas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿En qué obra Jorge Guillén concentró su poesía de exaltación de la realidad? (Sobre los ángeles/Cántico/Romancero gitano)"
        correctAnswer: Cántico
        rationale: "Jorge Guillén: 'Cántico' → poesía pura, intelectual, celebración del mundo real. Extremo opuesto al surrealismo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué recurso usa Lorca en 'verde que te quiero verde'? (hipérbaton/repetición y paralelismo con valor mágico-ritual/prosopopeya)"
        correctAnswer: repetición y paralelismo con valor mágico-ritual
        rationale: "El primer verso del 'Romance sonámbulo': epifora y paralelismo → efecto hipnótico, herencia del romancero."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué aportó Rafael Alberti en 'Marinero en tierra'? (drama existencial/nostalgia del mar andaluz con formas populares y vanguardistas/poesía mística)"
        correctAnswer: nostalgia del mar andaluz con formas populares y vanguardistas
        rationale: "Alberti: 'Marinero en tierra' (1925, Premio Nacional de Literatura) → neopopularismo + vanguardia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el tema central de la poesía amorosa de Pedro Salinas? (la política/el amor como búsqueda de la realidad esencial del ser amado a través del lenguaje/la naturaleza)"
        correctAnswer: el amor como búsqueda de la realidad esencial del ser amado a través del lenguaje
        rationale: "Pedro Salinas ('La voz a ti debida'): el amor como proceso cognoscitivo y lingüístico → la persona amada como realidad última."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué fenómeno histórico disgregó a la Generación del 27? (la muerte de Góngora/la Guerra Civil española (1936): Lorca asesinado, muchos en el exilio/el modernismo tardío)"
        correctAnswer: "la Guerra Civil española (1936): Lorca asesinado, muchos en el exilio"
        rationale: "La Guerra Civil destruyó el grupo: Lorca fusilado en 1936; Alberti, Salinas, Guillén, Cernuda marcharon al exilio."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la obra teatral que mejor representa el conflicto entre el instinto y la norma social en Lorca? (El público/La casa de Bernarda Alba/Divinas palabras)"
        correctAnswer: La casa de Bernarda Alba
        rationale: "'La casa de Bernarda Alba': tiranía de la madre/sociedad sobre las hijas → represión del deseo femenino en la España rural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'duende' para Lorca? (un ser mitológico/la fuerza irracional, oscura y telúrica que da autenticidad al arte andaluz/una técnica retórica)"
        correctAnswer: la fuerza irracional, oscura y telúrica que da autenticidad al arte andaluz
        rationale: "'Teoría y juego del duende' (Lorca, 1933): el duende es la fuerza oscura que distingue el arte verdadero del técnico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál fue la revista literaria más emblemática de la Generación del 27? (Alfar/Revista de Occidente/La Gaceta Literaria)"
        correctAnswer: Revista de Occidente
        rationale: "La 'Revista de Occidente' (fundada por Ortega y Gasset, 1923) y 'Litoral' fueron los principales focos de difusión del 27."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué obra de Luis Cernuda expresa su conflicto entre deseo y realidad? (Poeta en Nueva York/La realidad y el deseo/Campos de Castilla)"
        correctAnswer: La realidad y el deseo
        rationale: "Cernuda: 'La realidad y el deseo' (título de su obra completa) → tensión irresoluble entre lo que se anhela y lo que existe."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
