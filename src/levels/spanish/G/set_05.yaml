pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El existencialismo es una corriente filosófica que surge principalmente en el siglo XX, aunque tiene antecedentes en Søren Kierkegaard y Friedrich Nietzsche. Su premisa central es que 'la existencia precede a la esencia': los seres humanos no nacen con una naturaleza determinada, sino que se definen a través de sus elecciones y actos. Los principales exponentes son Jean-Paul Sartre, quien en 'El ser y la nada' (1943) desarrolló el concepto de 'mala fe' (la huida de la libertad y la responsabilidad), Simone de Beauvoir, que aplicó el existencialismo a la condición de la mujer en 'El segundo sexo', y Albert Camus, que aunque rechazó la etiqueta de existencialista, exploró el absurdo en obras como 'El extranjero' y 'El mito de Sísifo'. La influencia del existencialismo en la literatura fue inmensa: produjo una narrativa comprometida con la libertad individual y la responsabilidad social. En España, la posguerra generó una literatura de existencialismo implícito: Cela, Delibes y Martín Santos reflejan la angustia y el sin sentido de la existencia humana sin adoptar el marco filosófico francés explícitamente. La idea sartriana de que 'el infierno son los otros' resume la tensión entre el yo y la mirada ajena que impregna toda esta literatura."
    exercises:
