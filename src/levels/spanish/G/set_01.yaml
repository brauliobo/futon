title: 🎓 Gramática - Lingüística General - La Naturaleza del Signo
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Nivel G: lingüística teórica. Saussure: signo lingüístico (significante/significado), arbitrariedad, linealidad, convencionalidad. Lengua vs. habla (langue/parole). Sincronía vs. diacronía. Valor lingüístico: el signo vale por sus diferencias con los demás. Peirce: icono/índice/símbolo. Funciones del lenguaje (Jakobson): referencial, expresiva, apelativa, fática, metalingüística, poética. Binomio forma/función. Lingüística estructural vs. generativa (Chomsky: competencia/actuación)."
example: "significante → imagen acústica /árbol/. significado → concepto de árbol. arbitrariedad → no hay relación natural entre significante y significado. lengua → sistema abstracto. habla → uso individual. competencia → saber lingüístico interno. actuación → uso real."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: El Signo Lingüístico y Saussure
    description: Identifica los conceptos de la lingüística saussureana.
    exercises:
      - type: grammar
        question: "¿Cuáles son los dos componentes del signo lingüístico según Saussure? (forma y contenido/significante (imagen acústica) y significado (concepto)/palabra y referente)"
        correctAnswer: significante (imagen acústica) y significado (concepto)
        rationale: "Saussure definió el signo como la unión del significante (imagen acústica) y el significado (concepto mental)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la arbitrariedad del signo? (que el signo es aleatorio/que no hay relación natural ni motivada entre el significante y el significado/que el significado cambia siempre)"
        correctAnswer: que no hay relación natural ni motivada entre el significante y el significado
        rationale: "La arbitrariedad saussureana: 'árbol' no se parece a ningún árbol; la asociación es convencional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia 'lengua' de 'habla' en Saussure? (son sinónimos/la lengua es el sistema social abstracto; el habla es el uso individual y concreto/la lengua es solo escrita)"
        correctAnswer: la lengua es el sistema social abstracto; el habla es el uso individual y concreto
        rationale: "Langue (sistema compartido por la comunidad) vs. parole (realización individual en cada acto de habla)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el enfoque sincrónico? (estudio de la lengua a lo largo del tiempo/estudio de la lengua en un momento dado sin considerar su evolución/estudio de las lenguas extranjeras)"
        correctAnswer: estudio de la lengua en un momento dado sin considerar su evolución
        rationale: "Sincronía = estado de la lengua en un punto del tiempo. Diacronía = evolución histórica de la lengua."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Según Peirce, ¿qué es un ícono? (signo que tiene relación convencional con el referente/signo que se parece a su referente (fotografía, mapa)/signo que indica la presencia del referente por contigüidad)"
        correctAnswer: signo que se parece a su referente (fotografía, mapa)
        rationale: "El ícono (Peirce) mantiene una semejanza con el objeto: una fotografía, un diagrama, una onomatopeya."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un índice en la semiótica de Peirce? (signo convencional/signo que indica la presencia del referente por contigüidad causal (humo→fuego)/signo icónico)"
        correctAnswer: signo que indica la presencia del referente por contigüidad causal (humo→fuego)
        rationale: "El índice apunta al referente por relación causal: el humo es índice del fuego; la fiebre, índice de enfermedad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué función del lenguaje predomina en 'Te llamo para ver cómo estás'? (referencial/fática/apelativa)"
        correctAnswer: fática
        rationale: "La función fática (Jakobson) mantiene el canal de comunicación abierto; no transmite información nueva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué función predomina en '¡Cierra la puerta!'? (expresiva/apelativa/poética)"
        correctAnswer: apelativa
        rationale: "La función apelativa (conativa) se orienta al receptor con el fin de influir en su conducta: órdenes, ruegos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue la competencia de la actuación en Chomsky? (son sinónimos/competencia = conocimiento lingüístico interiorizado; actuación = uso real en contexto/competencia es solo fonética)"
        correctAnswer: competencia = conocimiento lingüístico interiorizado; actuación = uso real en contexto
        rationale: "Chomsky reinterpretó la distinción saussureana: competence (interno) vs. performance (externo, uso real)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el valor lingüístico en Saussure? (el precio de la lengua/el hecho de que el signo vale por sus diferencias con los demás signos del sistema/el número de hablantes)"
        correctAnswer: el hecho de que el signo vale por sus diferencias con los demás signos del sistema
        rationale: "El valor: 'mouton' en francés vale diferente a 'sheep/mutton' en inglés → el valor es relacional y diferencial."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Funciones del Lenguaje y Lingüística
    description: Practica las funciones y conceptos lingüísticos.
    exercises:
      - type: grammar
        question: "¿Qué función lingüística predomina en un texto poético? (fática/poética/referencial)"
        correctAnswer: poética
        rationale: "La función poética (Jakobson) se centra en la forma del mensaje en sí: cómo se dice importa tanto como qué se dice."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Esto se llama metáfora.' ¿Función? (apelativa/metalingüística/expresiva)"
        correctAnswer: metalingüística
        rationale: "La función metalingüística usa la lengua para hablar de la propia lengua."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el signo simbólico en Peirce? (icónico/convencional: relación arbitraria entre signo y referente/indicial)"
        correctAnswer: "convencional: relación arbitraria entre signo y referente"
        rationale: "El símbolo peirceano tiene relación puramente convencional con el referente: 'paloma' = paz (no hay parecido)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la lingüística estructural? (estudio histórico de las lenguas/corriente que estudia la lengua como sistema de diferencias y relaciones sin considerar la evolución/estudio del uso lingüístico)"
        correctAnswer: corriente que estudia la lengua como sistema de diferencias y relaciones sin considerar la evolución
        rationale: "La lingüística estructural (Saussure, escuela de Praga) trata la lengua como sistema sincrónico de oposiciones."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué propuso Chomsky con la gramática generativa? (que el lenguaje se aprende solo por imitación/que existe una gramática universal innata que permite generar oraciones infinitas a partir de reglas/que el lenguaje es solo social)"
        correctAnswer: que existe una gramática universal innata que permite generar oraciones infinitas a partir de reglas
        rationale: "Chomsky: la gramática generativa describe la competencia innata del hablante para generar y comprender oraciones."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función expresiva del lenguaje? (informar sobre la realidad/expresar el estado interior del emisor/mantener el contacto)"
        correctAnswer: expresar el estado interior del emisor
        rationale: "La función expresiva (emotiva) se centra en el emisor: sus emociones, actitudes y estados de ánimo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El cielo está nublado.' ¿Función predominante? (apelativa/fática/referencial)"
        correctAnswer: referencial
        rationale: "La función referencial informa sobre la realidad externa → 'el cielo está nublado' transmite información."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la onomatopeya desde el punto de vista semiótico? (símbolo/ícono fonético/índice)"
        correctAnswer: ícono fonético
        rationale: "La onomatopeya (miau, pum, ssss) imita el sonido del referente → es un signo icónico de tipo fonético."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la linealidad del signo en Saussure? (que el signo ocupa espacio en el papel/que los significantes se despliegan en el tiempo uno tras otro, no simultáneamente/que la lengua es finita)"
        correctAnswer: que los significantes se despliegan en el tiempo uno tras otro, no simultáneamente
        rationale: "La linealidad: el habla es secuencial en el tiempo; a diferencia de las imágenes, los signos no son simultáneos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la conmutación en lingüística estructural? (sustitución de un elemento por otro para verificar si cambia el significado/una figura retórica/un tipo de cambio fonético)"
        correctAnswer: sustitución de un elemento por otro para verificar si cambia el significado
        rationale: "La conmutación (prueba de conmutación) verifica si dos elementos son funcionalmente distintos: /p/→/b/: pato/bato → son fonemas distintos."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
