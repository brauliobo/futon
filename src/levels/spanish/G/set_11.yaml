title: 🔬 Gramática - Sintaxis Avanzada - Cláusulas de Relativo
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Oraciones de relativo: especificativas vs. explicativas (incidentales). Relativos: que, quien/quienes, el/la/los/las que, el/la cual/los/las cuales, cuyo/a (concordancia nominal), donde, cuando, como. Antecedente expreso vs. omitido (relativas libres). Restricciones: cuyo no puede ir precedido de artículo (*el cuyo); que sin preposición breve, pero con preposición larga se prefiere el cual. Relativas sustantivadas: 'el que estudia'."
example: "especificativa → 'El alumno que estudia aprueba' (restringe). explicativa → 'Mi hermano, que vive en París, es médico' (añade). cuyo → 'El autor cuya novela ganó el premio...' (concuerda con 'novela'). relativa libre → 'Quien estudia, aprueba'. donde → 'La ciudad donde nací tiene dos ríos'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Oraciones de Relativo - Tipos y Relativos
    description: Identifica el tipo de relativa y el relativo correcto.
    exercises:
      - type: grammar
        question: "'El libro que te presté es de Borges.' ¿Tipo de relativa? (explicativa/especificativa/relativa libre)"
        correctAnswer: especificativa
        rationale: "La relativa especificativa restringe el antecedente ('el libro') sin comas. Sin ella, la oración pierde referente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi madre, que es profesora, vive en Sevilla.' ¿Tipo de relativa? (especificativa/explicativa/libre)"
        correctAnswer: explicativa
        rationale: "La relativa explicativa (entre comas) añade información sobre el antecedente sin restringirlo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función de 'cuyo' en 'El escritor cuya novela ganó el premio...'? (pronombre relativo/determinante relativo posesivo que concuerda con el sustantivo que acompaña/adverbio relativo)"
        correctAnswer: determinante relativo posesivo que concuerda con el sustantivo que acompaña
        rationale: "'Cuyo' es determinante relativo posesivo y concuerda con 'novela' (femenino singular), no con el antecedente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Es correcto 'El autor el cuyo libro...'? (sí/no, 'cuyo' no admite artículo: 'el autor cuyo libro'/solo en registro coloquial)"
        correctAnswer: "no, 'cuyo' no admite artículo: 'el autor cuyo libro'"
        rationale: "Cuyo no puede ir precedido de artículo: *el cuyo es agramatical. Correcto: 'cuyo libro'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quien estudia, aprueba.' ¿Tipo de relativa? (especificativa con antecedente/relativa libre sin antecedente expreso/explicativa)"
        correctAnswer: relativa libre sin antecedente expreso
        rationale: "La relativa libre tiene el relativo 'quien' sin antecedente explícito → funciona como sujeto de la principal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Con preposición larga, ¿qué relativo es preferible? ('La ciudad en que nací' vs. 'La ciudad en la cual nací'): (ambas correctas, pero 'en la cual' es más formal y preferida/solo 'en que'/solo 'en la cual')"
        correctAnswer: ambas correctas, pero 'en la cual' es más formal y preferida
        rationale: "Con preposiciones largas (ante, bajo, contra, etc.) se prefiere 'el cual' sobre 'que' en el registro culto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué relativo expresa lugar? (cuando/donde/como)"
        correctAnswer: donde
        rationale: "'Donde' es el relativo adverbial de lugar: 'la ciudad donde nació', 'el lugar adonde fue'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una relativa sustantivada? (una relativa con cuyo/construcción 'el/la que + verbo' que funciona como sustantivo: 'el que estudia'/una relativa explicativa)"
        correctAnswer: "construcción 'el/la que + verbo' que funciona como sustantivo: 'el que estudia'"
        rationale: "'El que estudia' = nominalization: el artículo + relativo forman un grupo nominal equivalente a 'quien estudia'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se usa 'quien' (no 'que') como relativo? (siempre/cuando el antecedente es una persona y la relativa va con preposición o es explicativa/nunca se puede usar)"
        correctAnswer: cuando el antecedente es una persona y la relativa va con preposición o es explicativa
        rationale: "'Quien/quienes' refiere exclusivamente a personas: 'El amigo de quien hablo', 'Mi vecina, quien es médica'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "En 'Como él lo hace todo, nadie se queja.', ¿qué función tiene 'como'? (conjunción causal/relativo adverbial de modo/conector adversativo)"
        correctAnswer: relativo adverbial de modo
        rationale: "'Como' como relativo adverbial introduce una relativa de modo: 'la manera como lo hace' → 'como él lo hace'."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis y Corrección de Relativas
    description: Analiza y corrige oraciones con relativos.
    exercises:
      - type: grammar
        question: "¿Cuál es la diferencia de significado entre 'Los alumnos que suspendieron repitieron' y 'Los alumnos, que suspendieron, repitieron'? (ninguna/la primera implica que solo algunos suspendieron; la segunda que todos suspendieron/la segunda es incorrecta)"
        correctAnswer: la primera implica que solo algunos suspendieron; la segunda que todos suspendieron
        rationale: "Especificativa: solo los que suspendieron repitieron. Explicativa: todos los alumnos (que por cierto suspendieron) repitieron."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Es correcto 'la chica que su padre es médico'? (sí/no, se debe usar 'cuyo': 'la chica cuyo padre es médico'/solo en registro informal)"
        correctAnswer: "no, se debe usar 'cuyo': 'la chica cuyo padre es médico'"
        rationale: "El posesivo en relativas exige 'cuyo': *'la chica que su padre' es un calco del coloquial, incorrecto en la norma culta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el antecedente de 'que' en 'el hecho de que llueva'? (el hecho/llueva/no es relativa, es subordinada sustantiva con 'que' conjunción)"
        correctAnswer: no es relativa, es subordinada sustantiva con 'que' conjunción
        rationale: "'El hecho de que llueva' → 'que' es conjunción completiva, no relativo: introduce una subordinada sustantiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede una relativa especificativa modificar a un nombre propio? (sí, siempre/no, los nombres propios son únicos y no admiten restricción: se usa la explicativa/solo con nombres de persona)"
        correctAnswer: "no, los nombres propios son únicos y no admiten restricción: se usa la explicativa"
        rationale: "Los nombres propios identifican un referente único: no se puede restringir → siempre explicativa: 'Madrid, que es la capital, ...'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El lugar adonde vamos es secreto.' ¿Por qué 'adonde' y no 'donde'? (son sinónimos/se usa 'adonde' cuando hay movimiento hacia un lugar; 'donde' para posición estática/es error)"
        correctAnswer: se usa 'adonde' cuando hay movimiento hacia un lugar; 'donde' para posición estática
        rationale: "'Adonde' expresa dirección (vamos hacia); 'donde' expresa ubicación (estamos en): 'la ciudad donde vivo' vs. 'la ciudad adonde voy'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué relativo concuerda en género y número con su antecedente (además de cuyo)? (que/el cual, la cual, los cuales, las cuales/quien)"
        correctAnswer: el cual, la cual, los cuales, las cuales
        rationale: "'El/la/los/las cual(es)' concuerda en género y número con el antecedente → permite evitar ambigüedad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Es correcto 'el motivo por que llegó tarde'? (sí, es preferible/no, con la preposición 'por' se debe usar 'el que' o 'el cual': 'el motivo por el que'/'por el cual'/depende del registro)"
        correctAnswer: "no, con la preposición 'por' se debe usar 'el que' o 'el cual': 'el motivo por el que'/'por el cual'"
        rationale: "'Por que' (sin artículo) es arcaico; en la norma actual: 'por el que' o 'por el cual' → 'el motivo por el que llegó tarde'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El año en que nació era de crisis.' ¿Se puede decir también 'El año cuando nació'? (sí, 'cuando' y 'en que' son equivalentes en relativas temporales/no, 'cuando' es incorrecto/solo en registro coloquial)"
        correctAnswer: sí, 'cuando' y 'en que' son equivalentes en relativas temporales
        rationale: "'Cuando' = relativo temporal = 'en que': 'el año cuando nació' = 'el año en que nació' → ambas correctas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede eliminarse la relativa especificativa sin cambiar la referencia del antecedente? (sí, es información adicional/no, la relativa especificativa es esencial para identificar el referente/depende del contexto)"
        correctAnswer: no, la relativa especificativa es esencial para identificar el referente
        rationale: "La relativa especificativa delimita el referente → su eliminación cambia o destruye la referencia de la oración."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función sintáctica de la relativa en 'Me gustó el libro que compraste'? (sujeto/complemento del nombre (modificador del SN 'el libro')/complemento directo)"
        correctAnswer: complemento del nombre (modificador del SN 'el libro')
        rationale: "La relativa especificativa modifica al nombre 'libro' dentro del sintagma nominal → complemento del nombre."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
