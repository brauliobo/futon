  - pageNumber: 1
    title: El Texto
    description: "Texto: El Barroco español (siglo XVII) surge en un contexto de crisis política, económica y espiritual que contrasta con la fe en el hombre renacentista. El desengaño, la fugacidad del tiempo (tempus fugit) y el tema de las apariencias (theatrum mundi: el mundo como teatro) impregnan toda la producción artística. En literatura coexisten dos grandes corrientes: el culteranismo (o gongorismo), propugnado por Luis de Góngora, que busca la belleza formal a través de latinismos, hipérbatos extremos y metáforas oscuras ('las soledades'); y el conceptismo, practicado por Francisco de Quevedo y Baltasar Gracián, que se basa en la agudeza conceptual, el ingenio y la condensación de ideas en paradojas y antítesis. En teatro, Lope de Vega creó la 'comedia nueva': mezcla de lo trágico y lo cómico, tres actos, ruptura de las unidades aristotélicas, verso polimétrico y personajes arquetípicos (el galán, la dama, el gracioso, el padre). Calderón de la Barca llevó el drama filosófico a su cima con 'La vida es sueño' (¿es real lo que vivimos o soñamos?) y los dramas de honor. En prosa, Quevedo destaca con 'El Buscón' (novela picaresca) y 'Los Sueños' (sátira moral), mientras que Gracián en 'El Criticón' elabora una alegoría filosófica del recorrido vital humano."
