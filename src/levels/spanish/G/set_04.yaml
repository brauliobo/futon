title: Gramática - Morfología - Categorías Gramaticales Avanzadas
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Morfología avanzada: morfemas libres/ligados, raíces/afijos. Derivación, composición, parasíntesis (derivación + composición simultáneas: 'en-loqu-ecer'). Morfología flexiva: género (epiceno, ambiguo, común), número (singularia tantum: la sed, el caos; pluralia tantum: tijeras, afueras). Morfología verbal: paradigma completo (indicativo/subjuntivo/imperativo × presente/pasado/futuro × simple/compuesto). Aspecto verbal: perfectivo (indica acción completada) vs. imperfectivo (acción en curso). Modo: indicativo/subjuntivo/imperativo. Verbos pronominales, reflexivos, recíprocos."
example: "parasíntesis → en+loco+ecer = enloquecer (pref+raíz+suf simultáneos). epiceno → la víctima (masc o fem con el mismo género). singularia tantum → la sed (no existe *las sedes=pl de sed). perfectivo → comió (acción completa). imperfectivo → comía (acción en curso)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Morfología Derivativa y Composición
    description: Identifica los procesos de formación de palabras.
    exercises:
      - type: grammar
        question: "¿Qué es la parasíntesis? (solo derivación/solo composición/proceso que combina prefijación y sufijación simultáneas sobre una base: en-loco-ecer)"
        correctAnswer: proceso que combina prefijación y sufijación simultáneas sobre una base: en-loco-ecer
        rationale: "La parasíntesis añade simultáneamente prefijo y sufijo a una base: *enlocar (sin sufijo) y *loquecer (sin prefijo) no existen."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántos morfemas tiene 'inaplicable'? (dos/tres/cuatro)"
        correctAnswer: cuatro
        rationale: "in- (prefijo) + aplic- (raíz) + -able (sufijo derivativo) + -∅ (morfema de género/número cero) → al menos 3 derivativos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un morfema ligado? (una palabra independiente/un morfema que no puede aparecer solo y necesita unirse a una base: -ción, in-, -mente/un sufijo aumentativo)"
        correctAnswer: un morfema que no puede aparecer solo y necesita unirse a una base: -ción, in-, -mente
        rationale: "Morfemas ligados: afijos (prefijos, sufijos, infijos) que no tienen independencia léxica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los sustantivos 'pluralia tantum'? (sustantivos que solo existen en singular/sustantivos que solo se usan en plural: tijeras, gafas, afueras/sustantivos de género ambiguo)"
        correctAnswer: sustantivos que solo se usan en plural: tijeras, gafas, afueras
        rationale: "Pluralia tantum: existen solo en plural; el singular *tijera (en el sentido de las tijeras) es incorrecto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un sustantivo epiceno? (de género ambiguo/de un solo género gramatical que nombra tanto machos como hembras: 'el mosquito', 'la víctima'/que solo tiene plural)"
        correctAnswer: de un solo género gramatical que nombra tanto machos como hembras: 'el mosquito', 'la víctima'
        rationale: "Los epicenos tienen género fijo: 'la víctima' (hombre o mujer), 'el mosquito' → el sexo se especifica con 'macho/hembra'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el aspecto perfectivo? (acción que se está realizando/acción que se presenta como completada: 'comió', 'llegaron'/acción habitual)"
        correctAnswer: acción que se presenta como completada: 'comió', 'llegaron'
        rationale: "El aspecto perfectivo presenta la acción como un todo acabado: indefinido, pluscuamperfecto → perfectivos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué aspecto tiene el imperfecto de indicativo? (perfectivo/imperfectivo: acción en desarrollo, habitual o sin límites definidos/neutro)"
        correctAnswer: imperfectivo: acción en desarrollo, habitual o sin límites definidos
        rationale: "El imperfecto es el tiempo imperfectivo por excelencia: 'comía' = acción en curso o habitual, sin límite claro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los verbos pronominales? (verbos que siempre van con pronombre reflexivo y no pueden usarse sin él: arrepentirse, quejarse/verbos que pueden ser reflexivos o no/verbos irregulares)"
        correctAnswer: verbos que siempre van con pronombre reflexivo y no pueden usarse sin él: arrepentirse, quejarse
        rationale: "Los verbos pronominales (arrepentirse, atreverse, quejarse) exigen el pronombre; *arrepiento (sin se) es agramatical."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia los verbos reflexivos de los recíprocos? (son sinónimos/en los reflexivos el sujeto actúa sobre sí mismo; en los recíprocos dos sujetos actúan mutuamente/los recíprocos son siempre plurales)"
        correctAnswer: en los reflexivos el sujeto actúa sobre sí mismo; en los recíprocos dos sujetos actúan mutuamente
        rationale: "Reflexivo: 'se peina' (a sí misma). Recíproco: 'se besan' (el uno al otro) → implica reciprocidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la morfología flexiva? (la que crea nuevas palabras/la que marca las categorías gramaticales (género, número, persona, tiempo) sin cambiar la clase de palabra/la derivación)"
        correctAnswer: la que marca las categorías gramaticales (género, número, persona, tiempo) sin cambiar la clase de palabra
        rationale: "La flexión añade morfemas gramaticales: 'niño/niña/niños/niñas' → flexión de género y número."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Categorías Verbales Avanzadas
    description: Practica las categorías morfológicas del verbo.
    exercises:
      - type: grammar
        question: "¿Cuántos tiempos simples tiene el modo indicativo en español? (cuatro/seis/ocho)"
        correctAnswer: seis
        rationale: "Indicativo simple: presente, pretérito imperfecto, pretérito indefinido, futuro simple, condicional simple + pluscuamperfecto... En total son 6 simples: presente, imperfecto, indefinido, futuro, condicional + preterito perfecto compuesto como simple común."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el aspecto verbal? (el tiempo cronológico/la perspectiva desde la que se presenta la acción: completada (perfectiva) o en curso (imperfectiva)/el modo del verbo)"
        correctAnswer: la perspectiva desde la que se presenta la acción: completada (perfectiva) o en curso (imperfectiva)
        rationale: "El aspecto es independiente del tiempo: 'comía' (imperfectivo, pasado) vs. 'comió' (perfectivo, pasado)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué morfema de género tienen los sustantivos del tipo 'el lápiz/la crisis'? (morfema -o/-a/morfema cero (∅): el género no aparece marcado en la forma/morfema -e)"
        correctAnswer: morfema cero (∅): el género no aparece marcado en la forma
        rationale: "Sustantivos de morfema cero: 'el lápiz', 'el análisis', 'la tesis' → el género se determina por el artículo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los sustantivos de género común? (epicenos/los que tienen la misma forma para los dos géneros: el/la estudiante, el/la testigo/los que carecen de plural)"
        correctAnswer: los que tienen la misma forma para los dos géneros: el/la estudiante, el/la testigo
        rationale: "Género común: la forma es única; el género lo marca el artículo o el adjetivo: el estudiante/la estudiante."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál de estos tiempos es compuesto? (el pretérito imperfecto/el pretérito pluscuamperfecto/el condicional simple)"
        correctAnswer: el pretérito pluscuamperfecto
        rationale: "El pluscuamperfecto (había comido) = auxiliar haber en imperfecto + participio → tiempo compuesto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la voz media en español? (la voz pasiva/construcciones con 'se' donde el sujeto es a la vez agente y paciente: 'se levantó'/la impersonal pura)"
        correctAnswer: construcciones con 'se' donde el sujeto es a la vez agente y paciente: 'se levantó'
        rationale: "La voz media (con 'se' reflexivo o pronominal) presenta al sujeto como afectado por la acción que él mismo realiza."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo lleva tilde 'solo' según la norma académica actual? (siempre/cuando puede confundirse con el adjetivo 'solo'/nunca, la tilde diacrítica en 'solo' se suprimió)"
        correctAnswer: nunca, la tilde diacrítica en 'solo' se suprimió
        rationale: "La RAE eliminó la tilde diacrítica de 'solo' (adverbio) en la Ortografía de 2010; ya no se tilda."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la derivación regresiva? (añadir un prefijo/formar una nueva palabra eliminando un sufijo o añadiendo una vocal átona: trabajo → trabajar/combinar dos bases léxicas)"
        correctAnswer: formar una nueva palabra eliminando un sufijo o añadiendo una vocal átona: trabajo → trabajar
        rationale: "Derivación regresiva o deverbal: 'poda' de 'podar', 'cobro' de 'cobrar', 'desmayo' de 'desmayar'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El plural de 'crisis' es: (crises/crisis (invariable)/crisises)"
        correctAnswer: crisis (invariable)
        rationale: "Las palabras esdrújulas o llanas terminadas en -s son invariables en plural: la/las crisis, el/los análisis."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la amalgama o fusión morfológica? (derivación/cuando un solo morfema codifica simultáneamente dos o más categorías: la -o en 'canto' = 1ª pers.+sg+presente+ind./composición)"
        correctAnswer: cuando un solo morfema codifica simultáneamente dos o más categorías: la -o en 'canto' = 1ª pers.+sg+presente+ind.
        rationale: "En español la desinencia verbal funde persona, número, tiempo y modo en un único morfema."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
