title: 🔬 Gramática - Fonología y Fonética del Español
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Fonética (sonidos como fenómenos físicos) vs. fonología (fonemas como unidades funcionales). Fonemas del español: 24 fonemas (5 vocales + 19 consonantes). Rasgos distintivos: modo de articulación (oclusivo, fricativo, africado, nasal, líquido), punto de articulación (bilabial, labiodental, dental, alveolar, palatal, velar), sonoridad (sordo/sonoro). Alófonos: variantes de un fonema según contexto (b/β; d/ð; g/γ). Sílaba: núcleo (vocal), onset (inicio), coda (final). Acento: monosílabos, esdrújulas, llanas, agudas. Entonación: patrones declarativo, interrogativo, exclamativo."
example: "fonema /b/ → alófonos [b] (oclusivo, inicio) y [β] (fricativo, entre vocales). fonema /d/ → [d] y [ð]. pares mínimos → /palo/-/balo/. sílaba → on-set+núcleo+coda: 'tres'=t-r-e-s. aguda → café. llana → casa. esdrújula → música."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Fonemas y Alófonos
    description: Identifica los conceptos de fonética y fonología.
    exercises:
      - type: grammar
        question: "¿Qué diferencia la fonética de la fonología? (la fonética es solo escrita/son sinónimas/la fonética estudia los sonidos como fenómenos físicos; la fonología estudia los fonemas como unidades funcionales)"
        correctAnswer: la fonética estudia los sonidos como fenómenos físicos; la fonología estudia los fonemas como unidades funcionales
        rationale: "Fonética: descripción articulatoria y acústica de los sonidos. Fonología: función distintiva de los sonemas en el sistema."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un fonema? (una letra del alfabeto/un sonido concreto/una unidad fonológica abstracta y funcional que distingue significados)"
        correctAnswer: una unidad fonológica abstracta y funcional que distingue significados
        rationale: "El fonema es la unidad mínima del sistema fonológico: /p/ y /b/ son fonemas distintos porque 'pala'≠'bala'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los pares mínimos? (palabras de la misma familia/palabras sinónimas/dos palabras que difieren en un solo fonema, lo que prueba la función distintiva de ese fonema)"
        correctAnswer: dos palabras que difieren en un solo fonema, lo que prueba la función distintiva de ese fonema
        rationale: "Pares mínimos: 'pala/bala', 'cama/cana', 'sopa/copa' → un fonema diferente, significado diferente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántos fonemas vocálicos tiene el español estándar? (tres/cinco/siete)"
        correctAnswer: cinco
        rationale: "El español tiene cinco fonemas vocálicos: /a/, /e/, /i/, /o/, /u/ → sistema vocálico muy simétrico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los alófonos? (fonemas distintos/variantes de un mismo fonema que aparecen en contextos diferentes/errores de pronunciación)"
        correctAnswer: variantes de un mismo fonema que aparecen en contextos diferentes
        rationale: "El fonema /b/ tiene dos alófonos: [b] oclusivo (inicio de palabra) y [β] fricativo (entre vocales)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se pronuncia la /d/ entre vocales en español estándar? (oclusiva [d]/fricativa o aproximante [ð]/desaparece)"
        correctAnswer: fricativa o aproximante [ð]
        rationale: "La /d/ en posición intervocálica tiene el alófono fricativo [ð]: 'cada', 'nada', 'todo' → [ˈkaða], [ˈnaða]."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el modo de articulación? (el lugar donde se produce el sonido/la manera en que se produce el sonido: oclusivo, fricativo, nasal, etc./la sonoridad del sonido)"
        correctAnswer: "la manera en que se produce el sonido: oclusivo, fricativo, nasal, etc."
        rationale: "El modo de articulación describe cómo fluye el aire: oclusión total (p,b,t), fricción (f,s,j), etc."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Dónde se articula el fonema /m/? (alveolar/bilabial/velar)"
        correctAnswer: bilabial
        rationale: "/m/ se produce con ambos labios → bilabial. Es nasal, sonoro, bilabial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el punto de articulación de /s/? (bilabial/alveolar/palatal)"
        correctAnswer: alveolar
        rationale: "/s/ es fricativa alveolar sorda: el ápice de la lengua se aproxima a los alvéolos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la sílaba en fonología? (una letra/la unidad rítmica que agrupa fonemas en torno a un núcleo vocálico/un tipo de morfema)"
        correctAnswer: la unidad rítmica que agrupa fonemas en torno a un núcleo vocálico
        rationale: "La sílaba tiene estructura: onset (consonantes iniciales) + núcleo (vocal) + coda (consonantes finales)."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Acento, Entonación y Transcripción
    description: Practica el análisis fonológico.
    exercises:
      - type: grammar
        question: "¿Cuándo es aguda una palabra? (cuando el acento cae en la penúltima sílaba/cuando el acento cae en la última sílaba/cuando tiene tilde siempre)"
        correctAnswer: cuando el acento cae en la última sílaba
        rationale: "Palabras agudas (oxítonas): el acento recae en la última sílaba: café, reloj, camión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo es esdrújula una palabra? (acento en la última/acento en la penúltima/acento en la antepenúltima sílaba)"
        correctAnswer: acento en la antepenúltima sílaba
        rationale: "Esdrújulas (proparoxítonas): acento en la antepenúltima → siempre llevan tilde: música, pájaro, tráfico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo NO lleva tilde una palabra llana? (cuando termina en vocal, -n o -s/cuando termina en consonante distinta de -n o -s/siempre lleva tilde)"
        correctAnswer: cuando termina en vocal, -n o -s
        rationale: "Regla ortográfica: las llanas (penúltima sílaba) NO llevan tilde si terminan en vocal, -n o -s (que es lo más frecuente)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un diptongo? (dos vocales en sílabas diferentes/combinación de una vocal abierta y una cerrada (o dos cerradas) en la misma sílaba/dos consonantes juntas)"
        correctAnswer: combinación de una vocal abierta y una cerrada (o dos cerradas) en la misma sílaba
        rationale: "Diptongo: ai, ei, oi, au, eu, ia, ie, io, ua, ue, uo, ui, iu → vocal abierta + cerrada o dos cerradas en una sílaba."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un hiato? (un diptongo invertido/dos vocales en sílabas distintas que no forman diptongo/una pausa entre frases)"
        correctAnswer: dos vocales en sílabas distintas que no forman diptongo
        rationale: "Hiato: 'fe-o', 'pa-ís', 'ma-íz' → las vocales se separan en sílabas distintas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué entonación tiene una oración interrogativa total en español? (descendente/ascendente al final/plana)"
        correctAnswer: ascendente al final
        rationale: "Las preguntas totales (¿Vienes?) tienen entonación ascendente al final en español estándar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la africada? (un fonema vocálico/un sonido que combina oclusión + fricción: /tʃ/ en 'mucho'/un sonido nasal)"
        correctAnswer: "un sonido que combina oclusión + fricción: /tʃ/ en 'mucho'"
        rationale: "La africada /tʃ/ (como en 'ch') empieza con una oclusión y termina con fricción → modo africado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia los fonemas sordos de los sonoros? (el punto de articulación/la presencia o ausencia de vibración de las cuerdas vocales/el modo de articulación)"
        correctAnswer: la presencia o ausencia de vibración de las cuerdas vocales
        rationale: "Sonoro = vibran las cuerdas vocales (/b/,/d/,/g/). Sordo = no vibran (/p/,/t/,/k/)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántas sílabas tiene 'ciudad'? (dos: ciu-dad/tres: ci-u-dad/una)"
        correctAnswer: "dos: ciu-dad"
        rationale: "Diptongo -iu- → ciu = una sílaba. 'Ciudad' = ciu-dad → 2 sílabas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El fonema /x/ (como en 'jamón') se articula en: (posición alveolar/posición velar/posición bilabial)"
        correctAnswer: posición velar
        rationale: "/x/ es fricativa velar sorda: se produce con el dorso de la lengua contra el velo del paladar."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
