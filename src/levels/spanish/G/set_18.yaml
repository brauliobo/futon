title: 🔬 Gramática - Morfología Histórica - Evolución del Latín al Español
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Lingüística histórica: latín vulgar vs. clásico. Cambios fonéticos: sonorización de oclusivas sordas intervocálicas, síncopa, diptongación de vocales breves en sílaba libre, palatalización, metátesis, apócope. Casos latinos y su evolución: pérdida de la declinación → orden SVO + preposiciones. Latinismos cultos vs. palabras patrimoniales (doblets). Arabismos. Romanización."
example: "sonorización → VITA > vida; LUPU > lobo. diptongación → PETRA > piedra; NOVEM > nueve. palatalización → NOCTE > noche; LACTE > leche. síncopa → OCULU > ojo (síncopa + palatal). doblete → CÁTEDRA (culto) / cadera (patrimonial). arabismo → aceite, almohada, cifra, ojalá."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Cambios Fonéticos del Latín al Español
    description: Identifica los cambios fonéticos en la evolución del latín al español.
    exercises:
      - type: grammar
        question: "¿Qué cambio fonético explica VITA > 'vida'? (diptongación/sonorización de oclusiva sorda intervocálica: /t/ → /d/ entre vocales/palatalización)"
        correctAnswer: "sonorización de oclusiva sorda intervocálica: /t/ → /d/ entre vocales"
        rationale: "La sonorización intervocálica es sistemática: VITA>vida, LUPU>lobo, RIPA>riba. /p/, /t/, /k/ > /b/, /d/, /g/ entre vocales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué cambio explica PETRA > 'piedra'? (síncopa/diptongación de /ɛ/ breve tónica en sílaba libre: /e/ > /je//palatalización)"
        correctAnswer: "diptongación de /ɛ/ breve tónica en sílaba libre: /e/ > /je/"
        rationale: "La vocal breve tónica diptonga en sílaba libre: PETRA>piedra, TERRA>tierra, CAELU>cielo, MELE>miel."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué proceso explica LACTE > 'leche' y NOCTE > 'noche'? (sonorización/palatalización del grupo consonántico CT: /kt/ > /tʃ//síncopa)"
        correctAnswer: "palatalización del grupo consonántico CT: /kt/ > /tʃ/"
        rationale: "El grupo latino -CT- se palataliza en español: LACTE>leche, NOCTE>noche, FACTU>hecho, OCTO>ocho."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un doblete léxico? (palabra prestada del árabe/par de palabras procedentes del mismo étimo latino: una patrimonial (herencia oral) y otra culta (préstamo escrito): 'cadera/cátedra'/dos sinónimos perfectos)"
        correctAnswer: "par de palabras procedentes del mismo étimo latino: una patrimonial (herencia oral) y otra culta (préstamo escrito): 'cadera/cátedra'"
        rationale: "Doblete: CÁTHEDRA > cadera (evolución oral) / cátedra (latinismo culto). INTEGRU > entero / íntegro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué lengua aportó al español palabras como 'aceite', 'almohada' y 'cifra'? (el árabe/el francés/el quechua)"
        correctAnswer: el árabe
        rationale: "Los arabismos entran con la conquista árabe de la Península (711-1492): aceite, almohada, cifra, ojalá, alcalde, algebra."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el español usa preposiciones donde el latín usaba casos? (porque el español copió el francés/porque al perderse las desinencias casuales del latín vulgar, las preposiciones asumieron las funciones de los casos/por influencia árabe)"
        correctAnswer: porque al perderse las desinencias casuales del latín vulgar, las preposiciones asumieron las funciones de los casos
        rationale: "El latín tenía 6 casos morfológicos. Al erosionarse las desinencias → el orden SVO + preposiciones (de, a, por, para) sustituyen a los casos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el latín clásico del latín vulgar? (son idénticos/el latín clásico era la variedad literaria y normativa; el latín vulgar era la lengua hablada que evolucionó hacia las lenguas romances/el vulgar era más antiguo)"
        correctAnswer: el latín clásico era la variedad literaria y normativa; el latín vulgar era la lengua hablada que evolucionó hacia las lenguas romances
        rationale: "Las lenguas romances (español, portugués, francés, italiano, rumano) descienden del latín vulgar, no del clásico literario."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué cambio explica OCULU > 'ojo'? (solo diptongación/síncopa (pérdida de vocal interna: OCULU>OCLU) + palatalización del grupo CL: /kl/ > /x//metátesis)"
        correctAnswer: "síncopa (pérdida de vocal interna: OCULU>OCLU) + palatalización del grupo CL: /kl/ > /x/"
        rationale: "OCULU → síncopa → *OCLO → palatalización → ojo. Proceso combinado frecuente en español."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué proceso convirtió FILIUS en 'hijo'? (sonorización/palatalización de FL-/PL-/CL- iniciales: FILIUS > hijo por palatalización de F+I/diptongación)"
        correctAnswer: "palatalización de FL-/PL-/CL- iniciales: FILIUS > hijo por palatalización de F+I"
        rationale: "F- ante I/E en latín vulgar hispánico → /h/ aspirada: FILIU>hijo, FEMINA>hembra, FABULARE>hablar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los romances (glosas emilianenses, siglo X)? (poemas épicos/los primeros testimonios escritos del español medieval/cartas árabes)"
        correctAnswer: los primeros testimonios escritos del español medieval
        rationale: "Las Glosas Emilianenses (monasterio de San Millán, ~950) son anotaciones en romance y vasco al margen de textos latinos → primeros testimonios escritos del español."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis Histórico-Lingüístico
    description: Aplica los conocimientos de lingüística histórica.
    exercises:
      - type: grammar
        question: "¿Cuál es la evolución esperable de LUPU según la sonorización? (lupo/lobo: LUPU > lobo por sonorización /p/>/b/ intervocálica/lupe)"
        correctAnswer: "lobo: LUPU > lobo por sonorización /p/>/b/ intervocálica"
        rationale: "LUPU: /p/ entre vocales se sonoriza → /b/: LUPU > lobo. Proceso sistemático: RIPA>riba, SAPU>sebo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué rasgo fonológico diferencia la diptongación española de la italiana? (el español no diptongas/el español diptonga solo en sílaba libre (TERRA>tierra); el italiano también en trabada (lat. PETRA>ital. pietra, esp. piedra, ambas sílaba libre)/son iguales)"
        correctAnswer: el español diptonga solo en sílaba libre (TERRA>tierra); el italiano también en trabada (lat. PETRA>ital. pietra, esp. piedra, ambas sílaba libre)
        rationale: "La diptongación en español es condicionada: solo en sílaba libre (sin consonante final de sílaba). FĔRRU>hierro (libre), pero TERRA>tierra."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el doblete de INTEGRU? (íntimo/entero-íntegro: entero (patrimonial) / íntegro (latinismo culto)/integrado solo)"
        correctAnswer: "entero-íntegro: entero (patrimonial) / íntegro (latinismo culto)"
        rationale: "INTEGRU > entero (evolución oral con síncopa) / íntegro (cultismo reintroducido). Par mínimo semántico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué proceso explica que CAELU diera 'cielo'? (solo sonorización/diptongación de /ae/ > /e/ + palatalización: CAELU > cielo/metátesis)"
        correctAnswer: "diptongación de /ae/ > /e/ + palatalización: CAELU > cielo"
        rationale: "El diptongo latino AE se monoptonga en /e/; luego la /e/ breve tónica en sílaba libre diptonga: CAELU > cielo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se considera que termina el período de formación del español y empieza el medieval consolidado? (siglo VII/siglo XIII, con Alfonso X el Sabio que fija la norma escrita/siglo XV con Nebrija)"
        correctAnswer: siglo XIII, con Alfonso X el Sabio que fija la norma escrita
        rationale: "Alfonso X (s. XIII) usó el castellano para la ciencia y el derecho → fijación de la norma escrita del español medieval."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la metátesis? (pérdida de vocal/transposición de sonidos dentro de una palabra: PARABOLA > palabra (metátesis de /r/ y /l/)/adición de vocal)"
        correctAnswer: "transposición de sonidos dentro de una palabra: PARABOLA > palabra (metátesis de /r/ y /l/)"
        rationale: "Metátesis: cambio de posición de fonemas: PARABOLA>palabra, MIRACULU>milagro, PERICULU>peligro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué se dice que el español es una lengua romance? (porque es muy romántica/porque desciende del latín vulgar hablado en el Imperio Romano/porque viene del griego)"
        correctAnswer: porque desciende del latín vulgar hablado en el Imperio Romano
        rationale: "Lengua romance = lengua derivada del latín vulgar. El término viene de 'romanice loqui': hablar a la manera romana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué aportó el árabe al vocabulario científico del español medieval? (vocabulario marino/términos de álgebra, astronomía y medicina: álgebra, algoritmo, alquimia, alcohol, cénit/términos culinarios exclusivamente)"
        correctAnswer: "términos de álgebra, astronomía y medicina: álgebra, algoritmo, alquimia, alcohol, cénit"
        rationale: "Los árabes conservaron y transmitieron la ciencia griega: álgebra (al-jabr), algoritmo (del nombre al-Juarismi), alcohol, cénit."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la apócope? (adición de vocal al final/pérdida de vocal o sílaba final: BONU>bueno/bon (apocopado ante sustantivo en español medieval)/cambio de acento)"
        correctAnswer: "pérdida de vocal o sílaba final: BONU>bueno/bon (apocopado ante sustantivo en español medieval)"
        rationale: "Apócope: 'buen libro' (no *bueno libro), 'gran ciudad' (no *grande ciudad), 'primer capítulo' → proceso histórico de reducción final."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál fue la primera gramática del español? (la de Quevedo/la Gramática castellana de Antonio de Nebrija (1492)/la de Lope de Vega)"
        correctAnswer: la Gramática castellana de Antonio de Nebrija (1492)
        rationale: "Nebrija (1492, mismo año del Descubrimiento): primera gramática de una lengua romance europea → 'la lengua, compañera del imperio'."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
