pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El Renacimiento fue un movimiento cultural, artístico e intelectual que se desarrolló en Europa entre los siglos XIV y XVII, con Italia como epicentro. Supuso el redescubrimiento de la cultura clásica griega y romana, el desarrollo del humanismo (que situaba al ser humano en el centro del pensamiento frente al teocentrismo medieval) y una revolución en las artes, la ciencia y la filosofía. En pintura, el uso de la perspectiva lineal (desarrollada por Brunelleschi y codificada por Alberti) transformó la representación del espacio tridimensional. Leonardo da Vinci personifica el ideal renacentista del 'hombre universal' o 'uomo universale': pintor, escultor, arquitecto, ingeniero, músico y científico. En España, el Renacimiento llegó con retraso y adoptó características propias: la influencia italiana (Boscán, Garcilaso) convivió con la tradición castellana. El erasmismo (el pensamiento humanista de Erasmo de Rotterdam) influyó en intelectuales como Juan de Valdés y en la obra de Cervantes. El humanismo renacentista defendió la dignidad del ser humano, la razón y la educación clásica como base del saber, anticipando el pensamiento ilustrado del siglo XVIII. Dos inventos clave transformaron la difusión del conocimiento: la imprenta de Gutenberg (1450) y la brújula, que facilitó las grandes exploraciones marítimas."
