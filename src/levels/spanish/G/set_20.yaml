title: Revisión General - Nivel G
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Repaso integral del nivel G: lingüística general (signo, fonología, morfología, sintaxis avanzada, semántica, pragmática, discurso, historia de la lengua, español en el mundo) y lectura comprensiva de textos expositivos filosóficos, históricos y culturales."
example: "signo lingüístico → significante + significado (Saussure). pasiva refleja → se venden pisos (concordancia). relativa especificativa → restringe el antecedente. polisemia → varios sentidos, misma etimología. implicatura → lo comunicado sin decirlo. diptongación → PETRA > piedra. culteranismo → Góngora: belleza formal. macroestructura → contenido semántico global. préstamo → palabra tomada de otra lengua."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Lingüística y Gramática Avanzada
    description: Repasa los conceptos de lingüística y gramática del nivel G.
    exercises:
      - type: grammar
        question: "¿Qué es la arbitrariedad del signo lingüístico? (que el signo cambia siempre/que la relación entre significante y significado es convencional, no motivada naturalmente/que el signo es icónico)"
        correctAnswer: que la relación entre significante y significado es convencional, no motivada naturalmente
        rationale: "Arbitrariedad (Saussure): /pérro/ no tiene ningún vínculo natural con el animal → convención social."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el error en 'Se alquila pisos'? (el uso de se/la falta de concordancia: pasiva refleja exige 'se alquilan pisos' (plural)/no hay error)"
        correctAnswer: la falta de concordancia: pasiva refleja exige 'se alquilan pisos' (plural)
        rationale: "Pasiva refleja: el verbo concuerda con el sujeto paciente ('pisos', plural) → 'se alquilan pisos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi hermano, que vive en París, es médico.' ¿Tipo de relativa? (especificativa/explicativa/libre)"
        correctAnswer: explicativa
        rationale: "La relativa explicativa (entre comas) añade información sobre un antecedente ya identificado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia polisemia de homonimia? (nada/polisemia: varios sentidos de una misma palabra (misma etimología); homonimia: palabras diferentes con la misma forma (distinta etimología)/solo el contexto)"
        correctAnswer: polisemia: varios sentidos de una misma palabra (misma etimología); homonimia: palabras diferentes con la misma forma (distinta etimología)
        rationale: "'Banco' (financiero/asiento) = polisemia. 'Haya' (árbol) / 'haya' (verbo) = homonimia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué cambio fonético produjo VITA > 'vida'? (palatalización/sonorización de oclusiva sorda intervocálica: /t/ > /d//diptongación)"
        correctAnswer: sonorización de oclusiva sorda intervocálica: /t/ > /d/
        rationale: "Sonorización sistemática en español: VITA>vida, LUPU>lobo, RIPA>riba."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una implicatura escalar? (un presupuesto/inferencia de que si se usa un término débil de una escala ('algunos') es porque el más fuerte ('todos') no se aplica/un arabismo)"
        correctAnswer: inferencia de que si se usa un término débil de una escala ('algunos') es porque el más fuerte ('todos') no se aplica
        rationale: "Implicatura escalar: 'algunos' → implica 'no todos'; 'posible' → implica 'no seguro'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué corriente barroca representó Góngora? (conceptismo/culteranismo: búsqueda de la belleza formal con latinismos y metáforas oscuras/ultraísmo)"
        correctAnswer: culteranismo: búsqueda de la belleza formal con latinismos y metáforas oscuras
        rationale: "Culteranismo = gongorismo: forma compleja, oscura, rica en recursos retóricos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la macroestructura textual? (la puntuación/el contenido semántico global del texto: el tema o tesis central/el nivel de la oración)"
        correctAnswer: el contenido semántico global del texto: el tema o tesis central
        rationale: "Macroestructura (Van Dijk): representación semántica global → 'el texto trata de...'"
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántos países tienen el español como lengua oficial? (13/21/35)"
        correctAnswer: 21
        rationale: "El español es lengua oficial en 21 países de América, Europa (España) y África (Guinea Ecuatorial)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la 'mano invisible' de Adam Smith? (la intervención estatal/la tendencia espontánea de los mercados libres hacia el equilibrio y el bienestar colectivo/el banco central)"
        correctAnswer: la tendencia espontánea de los mercados libres hacia el equilibrio y el bienestar colectivo
        rationale: "Smith: el interés individual, guiado por la mano invisible, produce bienestar colectivo sin necesidad de intervención."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Cultura, Historia y Literatura
    description: Repasa los conocimientos culturales y literarios del nivel G.
    exercises:
      - type: grammar
        question: "¿Qué es el 'uomo universale' del Renacimiento? (un tipo de soneto/el ideal del hombre con dominio de múltiples disciplinas: ciencia, arte, filosofía/el humanista medieval)"
        correctAnswer: el ideal del hombre con dominio de múltiples disciplinas: ciencia, arte, filosofía
        rationale: "Leonardo da Vinci encarna el 'uomo universale' renacentista: polímata ideal del humanismo italiano."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la premisa central del existencialismo? (la esencia precede a la existencia/la existencia precede a la esencia: nos definimos por nuestros actos/el ser humano nace determinado)"
        correctAnswer: la existencia precede a la esencia: nos definimos por nuestros actos
        rationale: "Sartre: no hay naturaleza humana previa → somos lo que hacemos con nuestra libertad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué artículo de la Constitución española regula el uso del castellano? (artículo 1/artículo 3/artículo 14)"
        correctAnswer: artículo 3
        rationale: "Artículo 3 CE: el castellano es lengua oficial del Estado; las demás lenguas españolas son cooficiales en sus CCAA."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué exploró Albert Camus en sus obras? (el amor romántico/el absurdo de la existencia: El extranjero, El mito de Sísifo/la filosofía medieval)"
        correctAnswer: el absurdo de la existencia: El extranjero, El mito de Sísifo
        rationale: "Camus: el absurdo surge de la tensión entre la búsqueda humana de sentido y el silencio del mundo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la neuroplasticidad? (la velocidad de los reflejos/la capacidad del cerebro para reorganizarse formando nuevas conexiones sinápticas/la memoria a largo plazo)"
        correctAnswer: la capacidad del cerebro para reorganizarse formando nuevas conexiones sinápticas
        rationale: "Neuroplasticidad: base biológica del aprendizaje y la memoria → el cerebro se modifica con la experiencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue la comedia nueva de Lope del teatro clásico? (uso de 5 actos/mezcla de géneros, 3 actos, ruptura de las unidades aristotélicas/uso exclusivo del endecasílabo)"
        correctAnswer: mezcla de géneros, 3 actos, ruptura de las unidades aristotélicas
        rationale: "Lope rompe con las unidades de tiempo, lugar y acción; mezcla trágico y cómico; usa verso polimétrico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Quién formuló el principio de cooperación con sus cuatro máximas? (Austin/Grice/Saussure)"
        correctAnswer: Grice
        rationale: "Paul Grice (1975): principio de cooperación con las máximas de cantidad, cualidad, relación y manera."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un doblete léxico? (dos sinónimos perfectos/par de palabras del mismo étimo latino: una patrimonial y una culta → entero/íntegro/dos arabismos)"
        correctAnswer: par de palabras del mismo étimo latino: una patrimonial y una culta → entero/íntegro
        rationale: "Doblete: INTEGRU > entero (patrimonial, evolución oral) + íntegro (cultismo, reintroducido de la forma latina)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la estrategia de aprendizaje con mayor respaldo científico según la neurociencia? (leer y releer/práctica espaciada y recuperación activa (testing effect)/memorización masiva)"
        correctAnswer: práctica espaciada y recuperación activa (testing effect)
        rationale: "La ciencia cognitiva confirma: distribuir el estudio en el tiempo + recuperar activamente → máxima retención a largo plazo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿En qué año publicó Nebrija la primera gramática del español? (1476/1492/1516)"
        correctAnswer: 1492
        rationale: "Antonio de Nebrija: 'Gramática de la lengua castellana' (1492) → primer año del Descubrimiento de América."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
