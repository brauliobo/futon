title: Gramática - Semántica Léxica Avanzada
level: G
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Semántica léxica avanzada: polisemia vs. homonimia (criterio etimológico vs. sincrónico). Campos semánticos y campos léxicos. Relaciones paradigmáticas: sinonimia (completa vs. parcial), antonimia (gradable/complementaria/recíproca), hiponimia-hiperonimia. Relaciones sintagmáticas: colocaciones, restricciones léxicas. Denotación vs. connotación. Cambio semántico: metáfora, metonimia, especialización, generalización, amelioración, peyoración. Isotopía: recurrencia semántica que da coherencia al texto."
example: "polisemia → 'banco' (asiento / entidad financiera, misma etimología). homonimia → 'haya' (árbol) / 'haya' (verbo haber, distinta etimología). sinonimia completa → muy rara: 'sinónimos perfectos'. antonimia gradable → caliente/frío (escala). hiponimia → 'rosa' es hipónimo de 'flor'. colocación → cometer (error/delito), no *hacer un error delito. isotopía → campo semántico del mar en un poema."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Relaciones Semánticas y Cambio Léxico
    description: Identifica las relaciones semánticas entre palabras.
    exercises:
      - type: grammar
        question: "¿Qué diferencia polisemia de homonimia? (son sinónimos/polisemia: varios significados de una misma palabra (misma etimología); homonimia: palabras distintas con igual forma (distinta etimología)/solo el contexto)"
        correctAnswer: polisemia: varios significados de una misma palabra (misma etimología); homonimia: palabras distintas con igual forma (distinta etimología)
        rationale: "'Banco' (financiero/asiento) = polisemia (mismo origen). 'Haya' árbol vs. verbo = homonimia (distinto origen)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la hiponimia? (relación de antonimia/relación en que un término (hipónimo) está incluido semánticamente en otro (hiperónimo): 'rosa' es hipónimo de 'flor'/la polisemia extrema)"
        correctAnswer: relación en que un término (hipónimo) está incluido semánticamente en otro (hiperónimo): 'rosa' es hipónimo de 'flor'
        rationale: "Hiponimia: inclusión semántica → 'rosa' ⊂ 'flor'; 'flor' es el hiperónimo; 'rosa', 'tulipán', 'clavel' son co-hipónimos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de antonimia presentan 'vivo/muerto'? (gradable/complementaria (no hay término medio)/recíproca)"
        correctAnswer: complementaria (no hay término medio)
        rationale: "La antonimia complementaria: negar uno implica afirmar el otro. No existe estado intermedio entre vivo y muerto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de antonimia presentan 'comprar/vender'? (gradable/complementaria/recíproca: la existencia de uno implica la del otro)"
        correctAnswer: recíproca: la existencia de uno implica la del otro
        rationale: "Antonimia recíproca: si alguien compra, alguien vende → la relación implica dos participantes complementarios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una colocación léxica? (un sinónimo/combinación habitual de palabras condicionada por el uso: 'cometer un error' (no *hacer un error)/un neologismo)"
        correctAnswer: combinación habitual de palabras condicionada por el uso: 'cometer un error' (no *hacer un error)
        rationale: "Colocaciones: el verbo está léxicamente restringido: 'cometer un crimen' / 'tomar una decisión' / 'prestar atención'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la denotación? (el significado emotivo o cultural/el significado objetivo y referencial de una palabra/el campo semántico)"
        correctAnswer: el significado objetivo y referencial de una palabra
        rationale: "Denotación = significado léxico básico, compartido por todos los hablantes. Connotación = valor subjetivo o cultural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "La palabra 'villa' pasó de designar 'granja' a 'ciudad pequeña'. ¿Qué cambio semántico es? (peyoración/especialización/generalización o ampliación semántica)"
        correctAnswer: generalización o ampliación semántica
        rationale: "Generalización: el significado se amplía → 'villa' (granja → asentamiento → ciudad). Especialización sería el proceso inverso."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la isotopía textual? (un error de coherencia/la recurrencia de rasgos semánticos comunes que da coherencia semántica al texto/la polisemia contextual)"
        correctAnswer: la recurrencia de rasgos semánticos comunes que da coherencia semántica al texto
        rationale: "Isotopía (Greimas): red de rasgos semánticos recurrentes → un poema del mar con 'ola', 'espuma', 'vela', 'puerto' crea isotopía náutica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre metonimia y metáfora como cambios semánticos? (son lo mismo/metáfora: por semejanza ('pata' de mesa); metonimia: por contigüidad ('beber un vaso', por el contenido)/metáfora es más literaria)"
        correctAnswer: metáfora: por semejanza ('pata' de mesa); metonimia: por contigüidad ('beber un vaso', por el contenido)
        rationale: "Metáfora: traslado por semejanza de rasgos. Metonimia: traslado por relación real (contenedor/contenido, causa/efecto, parte/todo)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Existe realmente la sinonimia completa o perfecta? (sí, hay muchos pares/es muy rara o inexistente: siempre hay diferencias de registro, matiz o uso regional/solo en lenguaje técnico)"
        correctAnswer: es muy rara o inexistente: siempre hay diferencias de registro, matiz o uso regional
        rationale: "La sinonimia completa (total equivalencia en todos los contextos) es excepcional → 'coche/auto/carro' son sinónimos pero varían regionalmente."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis Semántico Aplicado
    description: Aplica los conceptos de semántica léxica al análisis textual.
    exercises:
      - type: grammar
        question: "'Necesito una mano.' ¿Qué fenómeno semántico ilustra? (polisemia/metonimia (parte por el todo) o metáfora lexicalizada/sinonimia)"
        correctAnswer: metonimia (parte por el todo) o metáfora lexicalizada
        rationale: "'Mano' = 'ayuda' → metonimia (parte por el todo) ya lexicalizada: el lenguaje ordinario está lleno de metonimias."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el hiperónimo de 'piano', 'violín' y 'guitarra'? (arte/instrumento musical/sonido)"
        correctAnswer: instrumento musical
        rationale: "'Piano', 'violín', 'guitarra' son hipónimos de 'instrumento musical' → relación de inclusión semántica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué rasgo distingue 'flaco' de 'delgado' si son sinónimos? (el registro/la connotación: 'flaco' puede tener connotación peyorativa; 'delgado' es neutro o positivo/la etimología)"
        correctAnswer: la connotación: 'flaco' puede tener connotación peyorativa; 'delgado' es neutro o positivo
        rationale: "Los sinónimos parciales se distinguen por connotación, registro o distribución contextual."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de antonimia muestran 'alto/bajo'? (complementaria/gradable: existe escala entre ambos extremos/recíproca)"
        correctAnswer: gradable: existe escala entre ambos extremos
        rationale: "Antonimia gradable: admite grados intermedios ('bastante alto', 'un poco bajo') y el término neutro es 'de altura media'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "La palabra 'maleta' en 'persona pesada'. ¿Qué fenómeno es? (préstamo/metáfora lexicalizada: se usa por semejanza de propiedades (carga)/homonimia)"
        correctAnswer: metáfora lexicalizada: se usa por semejanza de propiedades (carga)
        rationale: "Metáfora lexicalizada: el sentido figurado se ha fijado en la lengua; ya no se siente como imagen poética."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el campo léxico de una palabra? (sinónimos/conjunto de palabras que comparten rasgos semánticos y pertenecen a la misma categoría gramatical/la familia morfológica)"
        correctAnswer: conjunto de palabras que comparten rasgos semánticos y pertenecen a la misma categoría gramatical
        rationale: "Campo léxico: 'mar', 'océano', 'lago', 'río', 'estanque' → palabras del campo de 'masa de agua'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "La palabra 'vil' pasó de 'común/plebeyo' a 'despreciable'. ¿Qué cambio semántico es? (amelioración/peyoración: el significado adquirió valor negativo/generalización)"
        correctAnswer: peyoración: el significado adquirió valor negativo
        rationale: "Peyoración: el significado original neutro o positivo se vuelve negativo con el tiempo. 'Vil' (lat. vilis = barato) → despreciable."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se produce una restricción léxica? (en cualquier combinación/cuando solo ciertos verbos pueden combinarse con ciertos sustantivos: 'tomar/adoptar una decisión', no *'coger una decisión'/en el habla coloquial)"
        correctAnswer: cuando solo ciertos verbos pueden combinarse con ciertos sustantivos: 'tomar/adoptar una decisión', no *'coger una decisión'
        rationale: "Las restricciones léxicas o colocaciones son idiomáticas: el hablante nativo sabe que 'tomar una decisión' sí, '*coger una decisión' no."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre campo semántico y familia léxica? (son lo mismo/campo semántico: palabras relacionadas por el significado (pueden ser de distinta raíz); familia léxica: palabras de la misma raíz morfológica/la familia léxica incluye préstamos)"
        correctAnswer: campo semántico: palabras relacionadas por el significado (pueden ser de distinta raíz); familia léxica: palabras de la misma raíz morfológica
        rationale: "Campo semántico 'vivienda': casa, hogar, choza, palacio (raíces distintas). Familia léxica de 'casa': casero, casita, caserío (misma raíz)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué ilustra la frase 'El Ministerio ha tomado cartas en el asunto'? (un calco/una locución verbal (fraseologismo): unidad pluriverbial con significado no composicional/una colocación libre)"
        correctAnswer: una locución verbal (fraseologismo): unidad pluriverbial con significado no composicional
        rationale: "Las locuciones son unidades fraseológicas fijas: su significado no se deduce de las partes ('tomar cartas' no es coger naipes)."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
