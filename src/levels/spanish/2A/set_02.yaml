title: ✏️ Puntuación Avanzada - Dos Puntos y Raya
level: 2A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Dos puntos (:) anuncian lista o explicación. Raya (—) marca diálogo o inciso. Pensar primero en qué función cumple el signo."
example: "Listas y explicaciones → dos puntos (:). Inicio de diálogo → raya (—)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Dos Puntos
    description: Elige la puntuación correcta.
    exercises:
      - type: spelling
        question: "¿Qué signo abre una lista? (;/:/—)"
        correctAnswer: ":"
        rationale: "Los dos puntos (:) anuncian una lista."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (Compré tres cosas pan leche y huevos/Compré tres cosas: pan, leche y huevos/Compré tres cosas; pan leche y huevos)"
        correctAnswer: "Compré tres cosas: pan, leche y huevos"
        rationale: "Los dos puntos anuncian la lista; las comas separan sus elementos."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Después de 'Querido Juan' en una carta va (punto/dos puntos/coma)"
        correctAnswer: dos puntos
        rationale: "Tras un saludo de carta se usan dos puntos: 'Querido Juan:'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (Ana dijo, 'hola'/Ana dijo: 'hola'/Ana dijo 'hola')"
        correctAnswer: "Ana dijo: 'hola'"
        rationale: "Los dos puntos introducen una cita textual."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (Me gustan, tres colores: rojo, azul y verde/Me gustan tres colores: rojo, azul y verde/Me gustan tres colores rojo azul y verde)"
        correctAnswer: "Me gustan tres colores: rojo, azul y verde"
        rationale: "Los dos puntos anuncian los elementos."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (Resumen del día, llegué comí y dormí/Resumen del día: llegué, comí y dormí/Resumen del día; llegué comí y dormí)"
        correctAnswer: "Resumen del día: llegué, comí y dormí"
        rationale: "Los dos puntos introducen la explicación."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Después de 'Por ejemplo' para introducir ejemplos va (coma/dos puntos/punto)"
        correctAnswer: dos puntos
        rationale: "Tras 'Por ejemplo' los dos puntos introducen los casos."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (Hay dos tipos, niños y adultos/Hay dos tipos: niños y adultos/Hay dos tipos; niños y adultos)"
        correctAnswer: "Hay dos tipos: niños y adultos"
        rationale: "Los dos puntos anuncian la clasificación."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (El resultado es: claro/El resultado, es claro/El resultado es claro)"
        correctAnswer: "El resultado es claro"
        rationale: "Aquí no hace falta signo especial; 'es' no requiere dos puntos."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (Ten en cuenta: nunca corras con tijeras/Ten en cuenta, nunca corras con tijeras/Ten en cuenta; nunca corras con tijeras)"
        correctAnswer: "Ten en cuenta: nunca corras con tijeras"
        rationale: "Los dos puntos introducen la advertencia."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Raya de Diálogo
    description: Elige la puntuación correcta del diálogo.
    exercises:
      - type: spelling
        question: "¿Qué signo abre un diálogo en español? (—/:/;)"
        correctAnswer: —
        rationale: "La raya (—) introduce la intervención de un personaje."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (—Hola —dijo Marta/\"Hola\" dijo Marta/Hola dijo Marta)"
        correctAnswer: —Hola —dijo Marta
        rationale: "La raya inicia el diálogo y separa la acotación del narrador."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (—¿Cómo te llamas? —preguntó/¿Cómo te llamas? preguntó/¿Cómo te llamas, preguntó)"
        correctAnswer: —¿Cómo te llamas? —preguntó
        rationale: "Raya al inicio y raya antes del verbo de habla."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (—Buenos días —saludó Juan sonriendo/Buenos días saludó Juan sonriendo/\"Buenos días\" saludó Juan sonriendo)"
        correctAnswer: —Buenos días —saludó Juan sonriendo
        rationale: "La raya abre y cierra la acotación del narrador."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Para encerrar un inciso (como paréntesis) se usan (comas/rayas/puntos)"
        correctAnswer: rayas
        rationale: "Dos rayas encierran un inciso sin parar la frase."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (Mi abuelo —que tiene 80 años— camina rápido/Mi abuelo (que tiene 80 años camina rápido/Mi abuelo, que tiene 80 años - camina rápido)"
        correctAnswer: "Mi abuelo —que tiene 80 años— camina rápido"
        rationale: "Las dos rayas delimitan el inciso."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "En un diálogo, la raya va (con espacio después/pegada a la letra/con coma detrás)"
        correctAnswer: pegada a la letra
        rationale: "La raya va pegada a la primera letra de la frase del personaje."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (—Vamos —ordenó el capitán/Vamos ordenó el capitán/Vamos, ordenó el capitán)"
        correctAnswer: —Vamos —ordenó el capitán
        rationale: "La raya marca el diálogo y separa del verbo de habla."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cuándo se vuelve a usar la raya dentro del mismo diálogo? (nunca/tras la acotación si el personaje sigue/cada punto)"
        correctAnswer: tras la acotación si el personaje sigue
        rationale: "Si el personaje continúa hablando tras la acotación, se cierra con otra raya."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "Frase correcta (—Adiós —dijo—. Hasta mañana/—Adiós, dijo. Hasta mañana/Adiós dijo Hasta mañana)"
        correctAnswer: —Adiós —dijo—. Hasta mañana
        rationale: "Tras la acotación se cierra con raya y se puntúa la continuación."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
