title: Verbos Reflexivos - Lavarse, Peinarse
level: 2A
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Verbos reflexivos: la acción recae sobre quien la hace. Pronombres: me (yo), te (tú), se (él/ella), nos (nosotros), os (vosotros), se (ellos). Pensar primero en el sujeto."
example: "Yo me lavo. Tú te peinas. Ella se viste."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Pronombre Reflexivo
    description: Elige el pronombre reflexivo correcto.
    exercises:
      - type: grammar
        question: "'Yo ___ lavo las manos' (me/te/se)"
        correctAnswer: me
        rationale: "Con 'yo' el pronombre reflexivo es 'me'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ peinas' (me/te/se)"
        correctAnswer: te
        rationale: "Con 'tú' el pronombre reflexivo es 'te'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ viste' (me/te/se)"
        correctAnswer: se
        rationale: "Con 'ella' el pronombre reflexivo es 'se'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ duchamos' (nos/os/se)"
        correctAnswer: nos
        rationale: "Con 'nosotros' el pronombre reflexivo es 'nos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vosotros ___ acostáis' (os/nos/se)"
        correctAnswer: os
        rationale: "Con 'vosotros' el pronombre reflexivo es 'os'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ divierten' (me/os/se)"
        correctAnswer: se
        rationale: "Con 'ellos' el pronombre reflexivo es 'se'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ llamo Juan' (me/te/se)"
        correctAnswer: me
        rationale: "'Llamarse' es reflexivo; con yo: 'me llamo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Cómo ___ llamas?' (me/te/se)"
        correctAnswer: te
        rationale: "Con 'tú': 'te llamas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi hermano ___ afeita' (me/te/se)"
        correctAnswer: se
        rationale: "Con 'él' (mi hermano): 'se afeita'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Pedro y yo ___ vestimos deprisa' (os/nos/se)"
        correctAnswer: nos
        rationale: "Con 'nosotros': 'nos vestimos'."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Verbo Reflexivo Completo
    description: Elige la forma verbal reflexiva correcta.
    exercises:
      - type: grammar
        question: "'Yo ___ los dientes' (me lavar/lavarme/me lavo)"
        correctAnswer: me lavo
        rationale: "'Yo' + pronombre + verbo: me lavo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ temprano' (se levanta/levanta/levántase)"
        correctAnswer: se levanta
        rationale: "'Ella' + pronombre 'se' + verbo: se levanta."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ con agua fría' (nos duchamos/duchamos/ducharnos)"
        correctAnswer: nos duchamos
        rationale: "'Nosotros' + 'nos' + verbo: nos duchamos."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los niños ___ con sus juguetes' (divierten/se divierten/divertirse)"
        correctAnswer: se divierten
        rationale: "'Los niños' (ellos) + 'se' + verbo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ rápidamente' (duermes/te duermes/dormirte)"
        correctAnswer: te duermes
        rationale: "'Tú' + 'te' + verbo: te duermes."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi madre ___ por las mañanas' (maquilla/se maquilla/maquillarse)"
        correctAnswer: se maquilla
        rationale: "'Ella' + 'se' + verbo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vosotros ___ antes de cenar' (laváis/os laváis/lavaros)"
        correctAnswer: os laváis
        rationale: "'Vosotros' + 'os' + verbo: os laváis."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ en la cama' (acuesto/me acuesto/acostarme)"
        correctAnswer: me acuesto
        rationale: "'Yo' + 'me' + verbo: me acuesto."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ sus nombres' (dicen/se dicen/les dicen)"
        correctAnswer: dicen
        rationale: "'Decir' no es reflexivo aquí: 'ellos dicen sus nombres'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotras ___ temprano al cine' (vamos/nos vamos/irnos)"
        correctAnswer: nos vamos
        rationale: "'Irse' es reflexivo: 'nos vamos temprano'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
