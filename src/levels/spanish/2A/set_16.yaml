title: Lectura Simple - Una Visita al Museo
level: 2A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Lectura narrativa descriptiva con vocabulario cultural. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿A dónde fuimos? → museo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El miércoles fuimos al museo con la escuela. La entrada era gratis para los niños. Vimos esqueletos de dinosaurios enormes en la primera sala. En la segunda sala había cuadros antiguos de pintores famosos. Una guía nos explicó la historia de una momia egipcia de hace cuatro mil años. Al salir compramos postales en la tienda del museo. La profesora dijo que volveríamos otro día."
    exercises:
      - type: reading
        question: "¿Qué día fueron? (lunes/miércoles/viernes)"
        correctAnswer: miércoles
        rationale: "El texto: 'El miércoles fuimos al museo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con quién fueron? (familia/escuela/vecinos)"
        correctAnswer: escuela
        rationale: "El texto: 'con la escuela'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto costó la entrada? (cinco euros/gratis/dos euros)"
        correctAnswer: gratis
        rationale: "El texto: 'La entrada era gratis'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué vieron en la primera sala? (cuadros/dinosaurios/momias)"
        correctAnswer: dinosaurios
        rationale: "El texto: 'esqueletos de dinosaurios enormes en la primera sala'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué había en la segunda sala? (momias/cuadros/dinosaurios)"
        correctAnswer: cuadros
        rationale: "El texto: 'la segunda sala había cuadros'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién les explicó la historia? (profesora/guía/director)"
        correctAnswer: guía
        rationale: "El texto: 'Una guía nos explicó'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De dónde era la momia? (China/Egipto/Grecia)"
        correctAnswer: Egipto
        rationale: "El texto: 'una momia egipcia'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos años tenía la momia? (mil/cuatro mil/diez mil)"
        correctAnswer: cuatro mil
        rationale: "El texto: 'hace cuatro mil años'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué compraron al salir? (libros/postales/comida)"
        correctAnswer: postales
        rationale: "El texto: 'compramos postales'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué dijo la profesora? (no volverían/volverían otro día/debían estudiar)"
        correctAnswer: volverían otro día
        rationale: "El texto: 'que volveríamos otro día'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
