title: 📝 Superlativos - El Más, -Ísimo
level: 2A
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Superlativos: relativo ('el/la más ... de') y absoluto (-ísimo/-ísima, muy ...). Pensar primero si comparamos con un grupo o si es una cualidad al máximo."
example: "La ballena azul es ___ del planeta → la más grande. Muy alto → altísimo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Superlativo Relativo
    description: Usa 'el/la más... de'.
    exercises:
      - type: grammar
        question: "'La ballena azul es ___ del planeta' (mayor/la más grande/más grande)"
        correctAnswer: la más grande
        rationale: "Superlativo relativo: 'la más grande de' + referencia."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mercurio es ___ del sistema solar' (pequeño/el más pequeño/más pequeño)"
        correctAnswer: el más pequeño
        rationale: "Superlativo relativo: 'el más pequeño de'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El Everest es ___ del mundo' (alto/el más alto/más alto)"
        correctAnswer: el más alto
        rationale: "Superlativo relativo: 'el más alto del mundo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La Antártida es ___ de la Tierra' (fría/la más fría/más fría)"
        correctAnswer: la más fría
        rationale: "Superlativo relativo: 'la más fría de la Tierra'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi hermana es ___ de la familia' (listo/la más lista/más lista)"
        correctAnswer: la más lista
        rationale: "Superlativo relativo femenino: 'la más lista de'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Este es ___ restaurante ___ ciudad' (el mejor de la/más bueno de/más mejor de)"
        correctAnswer: el mejor de la
        rationale: "'Mejor' es ya comparativo; para superlativo se usa 'el mejor de'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Juan tiene ___ nota ___ clase' (mejor/la mejor/el mejor)"
        correctAnswer: la mejor
        rationale: "'La mejor nota' porque 'nota' es femenino."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Pedro es ___ hermano' (ordinal por edad, el de más años) (mayor/el mayor/más mayor)"
        correctAnswer: el mayor
        rationale: "'El mayor' es el superlativo relativo de edad."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Esta es ___ clase ___ colegio' (más grande de/la más grande del/grande)"
        correctAnswer: la más grande del
        rationale: "'La más grande del colegio'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ese actor es ___ famoso ___ país' (el más/más/la más)"
        correctAnswer: el más
        rationale: "Masculino singular → 'el más famoso'."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Superlativo Absoluto -Ísimo
    description: Forma el superlativo absoluto.
    exercises:
      - type: grammar
        question: "Superlativo absoluto de 'alto' (más alto/altísimo/altote)"
        correctAnswer: altísimo
        rationale: "-ísimo indica el grado máximo sin comparar: altísimo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'rápido' (rapidísimo/más rápido/rápidote)"
        correctAnswer: rapidísimo
        rationale: "'Rápido' → 'rapidísimo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'fácil' (facilísimo/más fácil/facilote)"
        correctAnswer: facilísimo
        rationale: "'Fácil' → 'facilísimo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'pequeño' (pequeñito/pequeñísimo/muy pequeño)"
        correctAnswer: pequeñísimo
        rationale: "-ísimo intensifica al máximo: 'pequeñísimo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'grande' (grandísimo/muy grande/más grande)"
        correctAnswer: grandísimo
        rationale: "'Grande' → 'grandísimo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'bueno' (buenísimo/óptimo/más bueno)"
        correctAnswer: buenísimo
        rationale: "'Bueno' → 'buenísimo' (forma más usual)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'malo' (malísimo/peor/pésimo)"
        correctAnswer: malísimo
        rationale: "'Malo' → 'malísimo'. ('Pésimo' también sirve como superlativo culto.)"
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'feliz' (felicísimo/felizísimo/más feliz)"
        correctAnswer: felicísimo
        rationale: "'Feliz' → 'felicísimo': z → c antes de -ísimo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'caro' (carísimo/más caro/carote)"
        correctAnswer: carísimo
        rationale: "'Caro' → 'carísimo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'rico' (riquísimo/más rico/ricote)"
        correctAnswer: riquísimo
        rationale: "'Rico' → 'riquísimo': c → qu antes de -ísimo."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
