title: 📝 Revisión General 2A
level: 2A
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Repaso integral de 2A: ortografía (gue/gui), puntuación, pronombres, imperativo, diminutivos, aumentativos, reflexivos, comparativos, superlativos, futuro, gerundio, hay/tener, complemento directo."
example: "Repasa lo aprendido. Ej.: Imperativo de 'venir' → ven."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Léxico y Ortografía
    description: Preguntas mezcladas.
    exercises:
      - type: spelling
        question: "¿Cómo se escribe 'instrumento musical'? (guitarra/gitarra/guitara)"
        correctAnswer: guitarra
        rationale: "Necesita U muda entre G e I."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Qué signo abre una lista? (;/:/—)"
        correctAnswer: ":"
        rationale: "Los dos puntos anuncian una lista."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Diminutivo de 'perro' (perrito/perrón/perrote)"
        correctAnswer: perrito
        rationale: "'Perro' → perrito."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Aumentativo de 'golpe' (golpote/golpazo/golpecito)"
        correctAnswer: golpazo
        rationale: "'Golpe' + -azo → golpazo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Diminutivo de 'flor' (florote/florecita/florón)"
        correctAnswer: florecita
        rationale: "'Flor' → florecita."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'rápido' (rapidísimo/más rápido/rapidote)"
        correctAnswer: rapidísimo
        rationale: "'Rápido' → 'rapidísimo' con -ísimo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Comparativo de 'malo' (más malo/peor/menor)"
        correctAnswer: peor
        rationale: "'Malo' tiene comparativo irregular 'peor'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La ballena azul es ___ del planeta' (grande/la más grande/más grande)"
        correctAnswer: la más grande
        rationale: "Superlativo relativo: 'la más grande de'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Conector que indica causa (y/pero/porque)"
        correctAnswer: porque
        rationale: "'Porque' introduce la causa."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: vocab
        question: "Adverbio de lugar cercano (aquí/lejos/allí)"
        correctAnswer: aquí
        rationale: "'Aquí' indica el lugar del hablante."
        difficulty: 3
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Gramática Verbal y Pronombres
    description: Preguntas mezcladas de gramática verbal.
    exercises:
      - type: grammar
        question: "Imperativo de 'comer' (tú) (como/come/comió)"
        correctAnswer: come
        rationale: "Imperativo tú -er → -e."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Futuro de 'cantar' yo (canto/canté/cantaré)"
        correctAnswer: cantaré
        rationale: "Futuro 1ª: infinitivo + -é."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Gerundio de 'vivir' (vivido/viviendo/vivir)"
        correctAnswer: viviendo
        rationale: "-ir → -iendo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Pronombre reflexivo con 'nosotros' (me/te/nos)"
        correctAnswer: nos
        rationale: "Con 'nosotros' → 'nos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'En la calle ___ mucho ruido' (hay/tengo/tiene)"
        correctAnswer: hay
        rationale: "Existencia → 'hay'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ ocho años' (hay/tengo/es)"
        correctAnswer: tengo
        rationale: "Edad → 'tener': 'tengo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Pronombre de 'el libro' (complemento directo) (lo/la/los)"
        correctAnswer: lo
        rationale: "'El libro' masc. sg. → lo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Pronombre de 'las flores' (complemento directo) (los/las/le)"
        correctAnswer: las
        rationale: "'Las flores' fem. pl. → las."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Pronombre personal del hablante (yo/tú/él)"
        correctAnswer: yo
        rationale: "'Yo' se refiere al hablante."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ aquí' (están/estamos/es)"
        correctAnswer: están
        rationale: "Con 'ellos' el verbo 'estar' es 'están'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
