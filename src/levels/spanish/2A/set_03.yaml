title: Lectura Simple - Los Planetas
level: 2A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Lectura informativa sobre el sistema solar. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿Cuántos planetas hay? → ocho."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El sistema solar tiene ocho planetas que giran alrededor del Sol. Mercurio es el más cercano al Sol y también el más pequeño. La Tierra es el único planeta con vida conocida. Marte se llama 'el planeta rojo' por su color oxidado. Júpiter es el más grande de todos y tiene una mancha roja gigante. Saturno tiene anillos de hielo y polvo. Urano y Neptuno son planetas fríos y azules."
    exercises:
      - type: reading
        question: "¿Cuántos planetas hay? (siete/ocho/nueve)"
        correctAnswer: ocho
        rationale: "El texto: 'tiene ocho planetas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Alrededor de qué giran? (Luna/Sol/estrellas)"
        correctAnswer: Sol
        rationale: "El texto: 'giran alrededor del Sol'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Planeta más cercano al Sol (Venus/Mercurio/Tierra)"
        correctAnswer: Mercurio
        rationale: "El texto: 'Mercurio es el más cercano al Sol'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Planeta más pequeño (Marte/Mercurio/Neptuno)"
        correctAnswer: Mercurio
        rationale: "El texto: 'Mercurio es el más cercano... y también el más pequeño'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Planeta con vida conocida (Marte/Tierra/Júpiter)"
        correctAnswer: Tierra
        rationale: "El texto: 'La Tierra es el único planeta con vida conocida'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "'El planeta rojo' se llama (Júpiter/Marte/Urano)"
        correctAnswer: Marte
        rationale: "El texto: 'Marte se llama el planeta rojo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Planeta más grande (Tierra/Saturno/Júpiter)"
        correctAnswer: Júpiter
        rationale: "El texto: 'Júpiter es el más grande'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tiene Júpiter? (anillos/mancha roja/lunas)"
        correctAnswer: mancha roja
        rationale: "El texto: 'tiene una mancha roja gigante'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Planeta con anillos de hielo (Saturno/Marte/Tierra)"
        correctAnswer: Saturno
        rationale: "El texto: 'Saturno tiene anillos de hielo y polvo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color son Urano y Neptuno? (rojos/verdes/azules)"
        correctAnswer: azules
        rationale: "El texto: 'Urano y Neptuno son... azules'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
