title: Conectores - Y, Pero, Porque, Aunque
level: 2A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Conectores básicos: Y (adición), PERO (contraste), PORQUE (causa), AUNQUE (concesión). Pensar primero en la relación entre las dos partes."
example: "Añadir → y. Contrastar → pero. Explicar razón → porque."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Adición y Contraste
    description: Elige el conector adecuado.
    exercises:
      - type: grammar
        question: "'Yo como pan ___ queso' (y/pero/porque)"
        correctAnswer: y
        rationale: "'Y' añade otra cosa que también se come."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quiero ir ___ está lloviendo' (y/pero/porque)"
        correctAnswer: pero
        rationale: "'Pero' introduce una dificultad contraria al deseo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estudio mucho ___ quiero aprobar' (y/pero/porque)"
        correctAnswer: porque
        rationale: "'Porque' introduce la causa o razón."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me gusta el café ___ me da energía' (y/pero/porque)"
        correctAnswer: porque
        rationale: "'Porque' explica la razón del gusto."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Canto ___ bailo al mismo tiempo' (y/pero/aunque)"
        correctAnswer: y
        rationale: "'Y' une dos acciones simultáneas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella es pequeña ___ muy fuerte' (y/pero/porque)"
        correctAnswer: pero
        rationale: "'Pero' contrasta 'pequeña' con 'fuerte'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Fui al médico ___ me dolía la cabeza' (y/pero/porque)"
        correctAnswer: porque
        rationale: "'Porque' da la causa de haber ido."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tengo sed ___ tengo hambre' (y/pero/porque)"
        correctAnswer: y
        rationale: "'Y' añade una segunda necesidad."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El coche es rápido ___ gasta mucha gasolina' (y/pero/porque)"
        correctAnswer: pero
        rationale: "'Pero' contrasta la ventaja con la desventaja."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me gusta el verano ___ hace calor' (y/pero/porque)"
        correctAnswer: porque
        rationale: "'Porque' explica el motivo del gusto."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Concesión y Uso Compuesto
    description: Elige el conector adecuado.
    exercises:
      - type: grammar
        question: "'Voy a salir ___ está lloviendo' (y/porque/aunque)"
        correctAnswer: aunque
        rationale: "'Aunque' introduce un obstáculo que no impide la acción."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ estoy cansado, terminaré el trabajo' (Y/Aunque/Porque)"
        correctAnswer: Aunque
        rationale: "'Aunque' expresa una concesión al principio de la frase."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tengo frío ___ llevo abrigo' (y/porque/aunque)"
        correctAnswer: aunque
        rationale: "'Aunque' concede un hecho contrario al esperado."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella estudia música ___ piano' (y/aunque/porque)"
        correctAnswer: y
        rationale: "'Y' añade el instrumento específico."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ana no vino ___ estaba enferma' (y/pero/porque)"
        correctAnswer: porque
        rationale: "'Porque' da la razón de la ausencia."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Este libro es caro ___ vale la pena' (y/pero/porque)"
        correctAnswer: pero
        rationale: "'Pero' contrasta el precio con el valor."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llueve ___ hay sol' (y/porque/aunque)"
        correctAnswer: aunque
        rationale: "'Aunque' concede un hecho inesperado junto a otro."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llego tarde ___ perdí el autobús' (y/pero/porque)"
        correctAnswer: porque
        rationale: "'Porque' explica la razón del retraso."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quiero aprender español ___ italiano' (y/pero/porque)"
        correctAnswer: y
        rationale: "'Y' añade un segundo idioma."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Juan es simpático ___ un poco tímido' (y/pero/aunque)"
        correctAnswer: pero
        rationale: "'Pero' introduce una matización al rasgo simpático."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
