title: Adverbios de Lugar y Tiempo
level: 2A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Adverbios de lugar (aquí, allí, arriba, abajo, dentro, fuera, cerca, lejos) y de tiempo (hoy, ayer, mañana, siempre, nunca, ahora, luego). Pensar primero en si describe el lugar o el tiempo."
example: "Lugar cercano al hablante → aquí. Momento actual → ahora."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Adverbios de Lugar
    description: Elige el adverbio de lugar correcto.
    exercises:
      - type: grammar
        question: "'La pelota está ___' (donde está el hablante) (allí/aquí/lejos)"
        correctAnswer: aquí
        rationale: "'Aquí' indica el lugar del hablante."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El coche está ___' (lejos del hablante) (aquí/allí/dentro)"
        correctAnswer: allí
        rationale: "'Allí' indica un lugar alejado del hablante."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El libro está ___ del cajón' (fuera/dentro/arriba)"
        correctAnswer: dentro
        rationale: "'Dentro' indica posición interior."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El perro está ___ de la casa' (en el jardín) (dentro/fuera/arriba)"
        correctAnswer: fuera
        rationale: "'Fuera' indica posición exterior."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El gato está ___ del árbol' (subido en él) (abajo/arriba/cerca)"
        correctAnswer: arriba
        rationale: "'Arriba' indica posición superior."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El ratón está ___ de la mesa' (en el suelo) (arriba/abajo/dentro)"
        correctAnswer: abajo
        rationale: "'Abajo' indica posición inferior."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi amigo vive ___' (muy distante) (cerca/lejos/aquí)"
        correctAnswer: lejos
        rationale: "'Lejos' indica distancia grande."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La tienda está ___' (a poca distancia) (cerca/lejos/allí)"
        correctAnswer: cerca
        rationale: "'Cerca' indica distancia pequeña."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mira ___' (detrás de ti) (delante/atrás/arriba)"
        correctAnswer: atrás
        rationale: "'Atrás' indica la parte posterior."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El profesor está ___' (enfrente) (detrás/delante/abajo)"
        correctAnswer: delante
        rationale: "'Delante' indica la parte anterior o enfrente."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Adverbios de Tiempo
    description: Elige el adverbio de tiempo correcto.
    exercises:
      - type: grammar
        question: "'___ llueve mucho' (en este momento) (ayer/hoy/mañana)"
        correctAnswer: hoy
        rationale: "'Hoy' se refiere al día presente."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ fui al cine' (el día anterior) (hoy/ayer/mañana)"
        correctAnswer: ayer
        rationale: "'Ayer' es el día anterior al actual."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ veré a Juan' (día siguiente) (ayer/hoy/mañana)"
        correctAnswer: mañana
        rationale: "'Mañana' es el día posterior al actual."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ana ___ llega tarde' (en todos los casos) (nunca/siempre/ahora)"
        correctAnswer: siempre
        rationale: "'Siempre' indica totalidad del tiempo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ miento' (en ningún momento) (siempre/a veces/nunca)"
        correctAnswer: nunca
        rationale: "'Nunca' indica negación del tiempo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ estoy ocupado' (en este momento) (luego/ahora/después)"
        correctAnswer: ahora
        rationale: "'Ahora' indica el momento presente inmediato."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vuelvo ___ de comer' (posterior) (antes/luego/ayer)"
        correctAnswer: luego
        rationale: "'Luego' indica un momento posterior."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ había dinosaurios' (tiempo lejano del pasado) (antiguamente/ahora/luego)"
        correctAnswer: antiguamente
        rationale: "'Antiguamente' se refiere a un pasado lejano."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Trabajamos ___' (desde hace ocho horas) (ahora/todavía/nunca)"
        correctAnswer: todavía
        rationale: "'Todavía' indica continuación en el tiempo."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llego ___' (en seguida) (pronto/después/nunca)"
        correctAnswer: pronto
        rationale: "'Pronto' indica proximidad inmediata en el tiempo."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
