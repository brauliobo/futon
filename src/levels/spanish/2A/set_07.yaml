title: Lectura Simple - El Océano
level: 2A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Lectura informativa sobre el océano. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿Cuánta parte de la Tierra cubren los océanos? → tres cuartos."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Los océanos cubren tres cuartos de la Tierra. En ellos vive una enorme variedad de criaturas. Los peces respiran agua por sus branquias. Los delfines son mamíferos muy inteligentes que necesitan salir a tomar aire. La ballena azul es el animal más grande del planeta. En las profundidades, donde no llega la luz, viven peces con luces propias. Los corales parecen plantas pero son colonias de animales pequeños."
    exercises:
      - type: reading
        question: "¿Qué parte de la Tierra cubren los océanos? (la mitad/tres cuartos/todo)"
        correctAnswer: tres cuartos
        rationale: "El texto: 'cubren tres cuartos de la Tierra'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hay en los océanos? (pocos animales/una enorme variedad/solo peces)"
        correctAnswer: una enorme variedad
        rationale: "El texto: 'vive una enorme variedad de criaturas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con qué respiran los peces? (nariz/pulmones/branquias)"
        correctAnswer: branquias
        rationale: "El texto: 'respiran agua por sus branquias'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué son los delfines? (peces/mamíferos/reptiles)"
        correctAnswer: mamíferos
        rationale: "El texto: 'Los delfines son mamíferos'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo respiran los delfines? (por branquias/salen a tomar aire/bajo el agua)"
        correctAnswer: salen a tomar aire
        rationale: "El texto: 'necesitan salir a tomar aire'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Animal más grande del planeta (tiburón/ballena azul/orca)"
        correctAnswer: ballena azul
        rationale: "El texto: 'La ballena azul es el animal más grande'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "En las profundidades no llega (el agua/la luz/el frío)"
        correctAnswer: la luz
        rationale: "El texto: 'donde no llega la luz'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Peces de las profundidades tienen (dientes largos/luces propias/colores brillantes)"
        correctAnswer: luces propias
        rationale: "El texto: 'peces con luces propias'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Los corales parecen (rocas/plantas/peces)"
        correctAnswer: plantas
        rationale: "El texto: 'Los corales parecen plantas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Los corales son (rocas/animales/plantas)"
        correctAnswer: animales
        rationale: "El texto: 'son colonias de animales pequeños'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
