title: Tiempos Verbales - Pretérito Perfecto Simple
level: 7A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Pretérito perfecto simple (pasado puntual) regular: -ar → -é/-aste/-ó; -er/-ir → -í/-iste/-ió. Pensar primero en la persona y la terminación del verbo."
example: "Elige la forma del pasado. Ej.: 'Ayer yo (cantar) ___' → canté."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Verbos en -ar en Pasado
    description: "Terminaciones: yo -é, tú -aste, él/ella -ó."
    exercises:
      - type: grammar
        question: "'Ayer yo ___ una canción' (cantar) (canté/cantaste/cantó)"
        correctAnswer: canté
        rationale: "Primera persona pretérito -ar → -é."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ bien la clase' (estudiar) (estudié/estudiaste/estudió)"
        correctAnswer: estudiaste
        rationale: "Segunda persona pretérito -ar → -aste."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ la casa' (limpiar) (limpié/limpiaste/limpió)"
        correctAnswer: limpió
        rationale: "Tercera persona pretérito -ar → -ó."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ mucho ayer' (trabajar) (trabajé/trabajaste/trabajó)"
        correctAnswer: trabajé
        rationale: "Primera persona pretérito -ar → -é."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ la puerta' (cerrar) (cerré/cerraste/cerró)"
        correctAnswer: cerraste
        rationale: "Segunda persona pretérito -ar → -aste."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ la guitarra' (tocar) (toqué/tocaste/tocó)"
        correctAnswer: tocó
        rationale: "Tercera persona pretérito -ar → -ó."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ una carta' (mandar) (mandé/mandaste/mandó)"
        correctAnswer: mandé
        rationale: "Primera persona pretérito -ar → -é."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ al parque' (caminar) (caminé/caminaste/caminó)"
        correctAnswer: caminó
        rationale: "Tercera persona pretérito -ar → -ó."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ la lección' (explicar) (expliqué/explicaste/explicó)"
        correctAnswer: explicaste
        rationale: "Segunda persona pretérito -ar → -aste."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ café con leche' (tomar) (tomé/tomaste/tomó)"
        correctAnswer: tomé
        rationale: "Primera persona pretérito -ar → -é."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Verbos en -er y -ir en Pasado
    description: "Terminaciones: yo -í, tú -iste, él/ella -ió."
    exercises:
      - type: grammar
        question: "'Yo ___ pan' (comer) (comí/comiste/comió)"
        correctAnswer: comí
        rationale: "Primera persona pretérito -er → -í."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ un libro' (leer) (leí/leíste/leyó)"
        correctAnswer: leíste
        rationale: "Segunda persona pretérito -er → -iste (con tilde por hiato)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ agua' (beber) (bebí/bebiste/bebió)"
        correctAnswer: bebió
