title: 🔗 Preposiciones Básicas
level: 7A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Preposiciones frecuentes: a, de, en, con, por, para, sobre, entre. Pensar primero en la relación de lugar, tiempo, instrumento o finalidad."
example: "Elige la preposición correcta. Ej.: 'Voy ___ casa' → a."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Lugar y Tiempo
    description: "Elige la preposición correcta."
    exercises:
      - type: grammar
        question: "'El libro está ___ la mesa' (en/a/de)"
        correctAnswer: en
        rationale: "'En' indica ubicación sobre una superficie."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Voy ___ la escuela' (de/en/a)"
        correctAnswer: a
        rationale: "'A' indica dirección o destino."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vengo ___ Madrid' (a/en/de)"
        correctAnswer: de
        rationale: "'De' indica origen o procedencia."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Comemos ___ las dos' (a/de/en)"
        correctAnswer: a
        rationale: "'A' acompaña la hora exacta."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La fiesta es ___ sábado' (a/en/el)"
        correctAnswer: el
        rationale: "Los días de la semana van con artículo: 'el sábado'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El gato está ___ la caja' (de/en/por)"
        correctAnswer: en
        rationale: "'En' indica ubicación dentro de algo."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Voy ___ pie' (a/de/en)"
        correctAnswer: a
        rationale: "'A pie' es locución fija de modo."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La casa ___ María es grande' (a/de/en)"
        correctAnswer: de
        rationale: "'De' indica posesión o pertenencia."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estudio ___ la noche' (por/de/a)"
        correctAnswer: por
        rationale: "'Por la noche' es expresión fija de tiempo habitual."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llegué ___ las ocho' (en/a/de)"
        correctAnswer: a
        rationale: "'A' acompaña la hora exacta."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Instrumento, Compañía y Finalidad
    description: "Elige la preposición correcta."
    exercises:
      - type: grammar
        question: "'Corto el papel ___ tijeras' (en/con/de)"
        correctAnswer: con
        rationale: "'Con' introduce el instrumento."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Voy ___ mi hermano' (con/de/a)"
        correctAnswer: con
        rationale: "'Con' indica compañía."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estudio ___ aprender' (por/para/con)"
        correctAnswer: para
        rationale: "'Para' introduce finalidad o propósito."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Compré este regalo ___ ti' (de/por/para)"
        correctAnswer: para
        rationale: "'Para' indica destinatario del regalo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Paseamos ___ el parque' (a/en/por)"
        correctAnswer: por
        rationale: "'Por' indica recorrido a través de un lugar."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La pelota está ___ las sillas' (entre/en/con)"
        correctAnswer: entre
        rationale: "'Entre' indica posición en medio de dos elementos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El cuaderno está ___ el escritorio' (con/sobre/de)"
        correctAnswer: sobre
        rationale: "'Sobre' indica posición encima de algo (el cuaderno encima del escritorio)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Viajo ___ tren' (a/en/de)"
        correctAnswer: en
        rationale: "'En' introduce el medio de transporte."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Escribo ___ lápiz' (con/en/por)"
        correctAnswer: con
        rationale: "'Con' introduce el instrumento de escritura."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Fui a la tienda ___ pan' (con/por/en)"
        correctAnswer: por
        rationale: "'Ir por algo' indica propósito de obtenerlo."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
