title: ✏️ Acentuación - Reglas Básicas
level: 7A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Tilde en agudas (terminan en n, s o vocal), llanas (no terminan en n, s o vocal) y todas las esdrújulas. La 'tilde' en español es el signo (´) sobre la vocal tónica."
example: "Identifica dónde va la tilde. Ej.: 'cancion' → canción (aguda terminada en n)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Palabras Agudas
    description: "Llevan tilde cuando terminan en vocal, 'n' o 's'."
    exercises:
      - type: spelling
        question: "¿Cómo se escribe correctamente? (cancion/canción/cançión)"
        correctAnswer: canción
        rationale: "Aguda terminada en 'n' → lleva tilde en la última sílaba."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (cafe/café/cafê)"
        correctAnswer: café
        rationale: "Aguda terminada en vocal → lleva tilde en la última sílaba."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (jamas/jamás/jamàs)"
