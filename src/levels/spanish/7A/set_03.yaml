        difficulty: 1
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (sofa/sofá/sôfa)"
        correctAnswer: sofá
        rationale: "Aguda terminada en vocal → lleva tilde en la última sílaba."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (ademas/además/adèmas)"
