        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (examen/exámen/examén)"
        correctAnswer: examen
        rationale: "Llana terminada en 'n' → no lleva tilde."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (telefono/teléfono/telefóno)"
        correctAnswer: teléfono
        rationale: "Esdrújula → siempre lleva tilde en la antepenúltima sílaba."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (azucar/azúcar/azucár)"
        correctAnswer: azúcar
        rationale: "Llana terminada en 'r' → lleva tilde en la penúltima sílaba."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
