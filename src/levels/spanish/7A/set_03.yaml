  - pageNumber: 2
    title: Palabras Llanas y Esdrújulas
    description: "Llanas: tilde cuando NO terminan en vocal, 'n' o 's'. Esdrújulas: siempre llevan tilde."
    exercises:
      - type: spelling
        question: "¿Cómo se escribe correctamente? (arbol/árbol/árból)"
        correctAnswer: árbol
        rationale: "Llana terminada en 'l' → lleva tilde en la penúltima sílaba."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (lapiz/lápiz/lapíz)"
        correctAnswer: lápiz
        rationale: "Llana terminada en 'z' → lleva tilde en la penúltima sílaba."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (mesa/mésa/mêsa)"
        correctAnswer: mesa
        rationale: "Llana terminada en vocal → no lleva tilde."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (pajaro/pájaro/pajáro)"
        correctAnswer: pájaro
        rationale: "Esdrújula → siempre lleva tilde (tercera sílaba contando desde el final)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (medico/médico/medíco)"
        correctAnswer: médico
        rationale: "Esdrújula → siempre lleva tilde en la antepenúltima sílaba."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (facil/fácil/facíl)"
        correctAnswer: fácil
        rationale: "Llana terminada en 'l' → lleva tilde en la penúltima sílaba."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (musica/música/musíca)"
        correctAnswer: música
