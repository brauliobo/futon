        difficulty: 1
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (corazon/corazón/corazôn)"
        correctAnswer: corazón
        rationale: "Aguda terminada en 'n' → lleva tilde en la última sílaba."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe correctamente? (papel/papél/pápel)"
        correctAnswer: papel
