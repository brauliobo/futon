title: Comprensión de Texto - La Escuela
level: 7A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Comprensión de texto corto. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente y elige la alternativa correcta. Ej.: Lucas va a la? → escuela."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Pequeño Texto
    description: "Historia: Lucas va a la escuela todos los días por la mañana. Su asignatura favorita es matemáticas. En el recreo juega al fútbol con sus amigos. La maestra se llama Elena y es muy paciente. Al salir, Lucas regresa a casa en autobús. Le gustaría ser maestro cuando crezca."
    exercises:
      - type: reading
        question: "¿A dónde va Lucas? (oficina/escuela/tienda)"
        correctAnswer: escuela
        rationale: "El texto: 'Lucas va a la escuela'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo va? (tarde/noche/mañana)"
        correctAnswer: mañana
        rationale: "El texto: 'por la mañana'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es su asignatura favorita? (lengua/matemáticas/historia)"
        correctAnswer: matemáticas
        rationale: "El texto: 'asignatura favorita es matemáticas'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A qué juega en el recreo? (baloncesto/fútbol/tenis)"
        correctAnswer: fútbol
        rationale: "El texto: 'juega al fútbol'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con quién juega? (solo/hermanos/amigos)"
        correctAnswer: amigos
        rationale: "El texto: 'con sus amigos'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama la maestra? (Ana/María/Elena)"
        correctAnswer: Elena
        rationale: "El texto: 'La maestra se llama Elena'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo es la maestra? (estricta/paciente/divertida)"
        correctAnswer: paciente
        rationale: "El texto: 'es muy paciente'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo regresa a casa? (a pie/bicicleta/autobús)"
        correctAnswer: autobús
        rationale: "El texto: 'regresa a casa en autobús'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué quiere ser de mayor? (médico/bombero/maestro)"
        correctAnswer: maestro
        rationale: "El texto: 'gustaría ser maestro'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con qué frecuencia va a la escuela? (a veces/los días/los sábados)"
        correctAnswer: los días
        rationale: "El texto: 'todos los días'."
        difficulty: 1
        objectives: [es.pre_reading]
target: 10
