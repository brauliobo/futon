title: 📚 Comprensión de Texto - El Parque
level: 7A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Comprensión de texto corto. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente y elige la alternativa correcta. Ej.: Pedro fue al? → parque."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Pequeño Texto
    description: "Historia: Pedro fue al parque con su perro. El parque tenía árboles grandes y un lago. Pedro lanzó una pelota y el perro la trajo de vuelta. Luego comieron un helado. El sol brillaba mucho y hacía calor. Volvieron a casa contentos al atardecer."
    exercises:
      - type: reading
        question: "¿A dónde fue Pedro? (playa/parque/escuela)"
        correctAnswer: parque
        rationale: "El texto: 'Pedro fue al parque'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con quién fue Pedro? (gato/perro/amigo)"
        correctAnswer: perro
        rationale: "El texto: 'con su perro'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tenía el parque? (flores/árboles/juegos)"
        correctAnswer: árboles
        rationale: "El texto: 'tenía árboles grandes y un lago'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué lanzó Pedro? (palo/pelota/juguete)"
        correctAnswer: pelota
        rationale: "El texto: 'Pedro lanzó una pelota'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién trajo la pelota? (Pedro/niño/perro)"
        correctAnswer: perro
        rationale: "El texto: 'el perro la trajo de vuelta'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué comieron? (fruta/helado/bocadillo)"
        correctAnswer: helado
        rationale: "El texto: 'comieron un helado'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo estaba el clima? (frío/lluvioso/caluroso)"
        correctAnswer: caluroso
        rationale: "El texto: 'el sol brillaba mucho y hacía calor'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué había en el parque además de árboles? (fuente/lago/puente)"
        correctAnswer: lago
        rationale: "El texto: 'árboles grandes y un lago'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo volvieron a casa? (mañana/mediodía/atardecer)"
        correctAnswer: atardecer
        rationale: "El texto: 'Volvieron a casa contentos al atardecer'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo volvieron a casa? (tristes/cansados/contentos)"
        correctAnswer: contentos
        rationale: "El texto: 'Volvieron a casa contentos'."
        difficulty: 1
        objectives: [es.pre_reading]
target: 10
