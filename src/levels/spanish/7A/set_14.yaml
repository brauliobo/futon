title: Adjetivos - Concordancia de Género y Número
level: 7A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "El adjetivo concuerda con el sustantivo en género (masculino/femenino) y número (singular/plural). Adjetivos en -o cambian a -a en femenino; los terminados en consonante o -e suelen ser invariables en género."
example: "Elige la forma correcta. Ej.: 'una casa ___' (grande/grando) → grande (invariable). 'niño ___' (alto/alta) → alto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Género (masculino/femenino)
    description: "Elige la forma que concuerda con el sustantivo."
    exercises:
      - type: grammar
        question: "'un niño ___' (alta/alto/altos)"
        correctAnswer: alto
        rationale: "'Niño' masculino singular → adjetivo en -o."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'una niña ___' (alta/alto/altos)"
        correctAnswer: alta
        rationale: "'Niña' femenino singular → adjetivo en -a."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'un coche ___' (roja/rojo/rojos)"
        correctAnswer: rojo
        rationale: "'Coche' masculino singular → adjetivo en -o."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'una flor ___' (blanco/blanca/blancos)"
        correctAnswer: blanca
        rationale: "'Flor' femenino singular → adjetivo en -a."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'una casa ___' (grande/granda/grando)"
        correctAnswer: grande
        rationale: "Adjetivos terminados en -e son invariables en género."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'un gato ___' (negra/negro/negras)"
        correctAnswer: negro
        rationale: "'Gato' masculino singular → adjetivo en -o."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'una mesa ___' (limpio/limpia/limpios)"
        correctAnswer: limpia
        rationale: "'Mesa' femenino singular → adjetivo en -a."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'un libro ___' (interesante/interesanta/interesanto)"
        correctAnswer: interesante
        rationale: "Adjetivos en -e invariables en género."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'una camisa ___' (azul/azula/azulo)"
        correctAnswer: azul
        rationale: "Adjetivos terminados en consonante suelen ser invariables en género."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'un profesor ___' (buena/bueno/buenos)"
        correctAnswer: bueno
        rationale: "'Profesor' masculino singular → adjetivo en -o."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Número (singular/plural)
    description: "Elige la forma en plural o singular correspondiente."
    exercises:
      - type: grammar
        question: "'los niños ___' (alto/altos/altas)"
        correctAnswer: altos
        rationale: "Masculino plural → adjetivo en -os."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'las niñas ___' (alta/altos/altas)"
        correctAnswer: altas
        rationale: "Femenino plural → adjetivo en -as."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'casas ___' (blanco/blancas/blancos)"
        correctAnswer: blancas
        rationale: "'Casas' femenino plural → adjetivo en -as."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'coches ___' (roja/rojos/rojas)"
        correctAnswer: rojos
        rationale: "'Coches' masculino plural → adjetivo en -os."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'libros ___' (interesante/interesantes/interesantos)"
        correctAnswer: interesantes
        rationale: "Adjetivos en -e añaden -s en plural: interesante → interesantes."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'flores ___' (azul/azules/azulas)"
        correctAnswer: azules
        rationale: "Adjetivos en consonante forman plural añadiendo -es."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'profesores ___' (buenos/buenas/bueno)"
        correctAnswer: buenos
        rationale: "'Profesores' masculino plural → adjetivo en -os."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'mesas ___' (limpio/limpias/limpios)"
        correctAnswer: limpias
        rationale: "'Mesas' femenino plural → adjetivo en -as."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'camisas ___' (azul/azules/azulas)"
        correctAnswer: azules
        rationale: "Plural de adjetivos en consonante: -es."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'árboles ___' (grande/grandes/grandas)"
        correctAnswer: grandes
        rationale: "Plural de adjetivos en -e: -es."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
