title: Comprensión de Texto - El Mercado
level: 7A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Comprensión de texto corto. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente y elige la alternativa correcta. Ej.: María fue al? → mercado."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Pequeño Texto
    description: "Historia: María fue al mercado con su madre el sábado. Compraron manzanas rojas, pan fresco y queso. El pan costaba dos euros. María ayudó a cargar las bolsas. En el camino a casa, se cruzaron con una vecina. Al llegar, guardaron todo en la cocina."
    exercises:
      - type: reading
        question: "¿A dónde fue María? (panadería/mercado/farmacia)"
        correctAnswer: mercado
        rationale: "El texto: 'María fue al mercado'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con quién fue al mercado? (padre/abuela/madre)"
        correctAnswer: madre
        rationale: "El texto: 'con su madre'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué día fueron? (viernes/sábado/domingo)"
        correctAnswer: sábado
        rationale: "El texto: 'el sábado'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué fruta compraron? (peras/naranjas/manzanas)"
        correctAnswer: manzanas
        rationale: "El texto: 'Compraron manzanas rojas'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color eran las manzanas? (verdes/amarillas/rojas)"
        correctAnswer: rojas
        rationale: "El texto: 'manzanas rojas'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo estaba el pan? (duro/fresco/seco)"
        correctAnswer: fresco
        rationale: "El texto: 'pan fresco'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto costó el pan? (un euro/dos euros/tres euros)"
        correctAnswer: dos euros
        rationale: "El texto: 'El pan costaba dos euros'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué ayudó a cargar María? (cestas/bolsas/cajas)"
        correctAnswer: bolsas
        rationale: "El texto: 'María ayudó a cargar las bolsas'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con quién se cruzaron en el camino? (amiga/vecina/prima)"
        correctAnswer: vecina
        rationale: "El texto: 'se cruzaron con una vecina'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde guardaron la comida al llegar? (despensa/nevera/cocina)"
        correctAnswer: cocina
        rationale: "El texto: 'guardaron todo en la cocina'."
        difficulty: 1
        objectives: [es.pre_reading]
target: 10
