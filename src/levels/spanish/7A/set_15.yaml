title: 📚 Comprensión de Texto - La Familia
level: 7A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Comprensión de texto corto. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente y elige la alternativa correcta. Ej.: La familia de Carlos vive en? → Madrid."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: Pequeño Texto
    description: "Historia: La familia de Carlos vive en Madrid. Son cinco: papá, mamá, Carlos, su hermana Sofía y la abuela. El padre es médico y la madre profesora. Carlos tiene diez años y Sofía siete. Los domingos comen juntos en casa de la abuela. Su comida favorita es la paella."
    exercises:
      - type: reading
        question: "¿Dónde vive la familia? (Madrid/Barcelona/Sevilla)"
        correctAnswer: Madrid
        rationale: "El texto: 'vive en Madrid'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos son? (cuatro/cinco/seis)"
        correctAnswer: cinco
        rationale: "El texto: 'Son cinco'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién es médico? (madre/padre/abuela)"
        correctAnswer: padre
        rationale: "El texto: 'El padre es médico'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién es profesora? (hermana/abuela/madre)"
        correctAnswer: madre
        rationale: "El texto: 'la madre profesora'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama la hermana? (Ana/Lucía/Sofía)"
        correctAnswer: Sofía
        rationale: "El texto: 'su hermana Sofía'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos años tiene Carlos? (ocho/diez/doce)"
        correctAnswer: diez
        rationale: "El texto: 'Carlos tiene diez años'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos años tiene Sofía? (cinco/seis/siete)"
        correctAnswer: siete
        rationale: "El texto: 'Sofía siete'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué día comen juntos? (sábados/domingos/viernes)"
        correctAnswer: domingos
        rationale: "El texto: 'Los domingos comen juntos'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En casa de quién comen? (tío/abuela/prima)"
        correctAnswer: abuela
        rationale: "El texto: 'en casa de la abuela'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es su comida favorita? (tortilla/gazpacho/paella)"
        correctAnswer: paella
        rationale: "El texto: 'Su comida favorita es la paella'."
        difficulty: 1
        objectives: [es.pre_reading]
target: 10
