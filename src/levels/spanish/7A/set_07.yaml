authorNotes: "Plural regular: +s tras vocal átona, +es tras consonante o vocal tónica. Cambio z→c antes de -es. Pensar primero en la terminación del singular."
example: "Escribe el plural. Ej.: 'casa' → casas. 'pez' → peces."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
