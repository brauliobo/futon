authorNotes: "Texto expositivo histórico-económico sobre la Revolución Industrial, sus fases, consecuencias sociales y el surgimiento del capitalismo industrial."
example: "1ª RI (1760-1840, GB): carbón/vapor/textil → urbanización → proletariado → 2ª RI (1870-1914): electricidad/acero/petróleo/química → capitalismo monopolista → respuesta obrera: ludismo→sindicatos→marxismo (Das Kapital 1867)→Primera Internacional→socialismo/anarquismo."
