pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La Revolución Industrial (1760-1840) transformó radicalmente las estructuras económicas, sociales y tecnológicas de la humanidad, comenzando en Gran Bretaña. La primera fase (1760-1840) se caracterizó por la mecanización de la industria textil, el desarrollo de la máquina de vapor (James Watt, 1769) y la construcción de ferrocarriles. La segunda fase o Segunda Revolución Industrial (1870-1914) introdujo la electricidad, el petróleo, la química industrial y la producción en cadena. La urbanización masiva creó nuevas condiciones sociales: el proletariado industrial vivía en condiciones precarias de trabajo (jornadas de 14-16 horas, trabajo infantil, insalubridad). En respuesta surgieron los primeros sindicatos (Trade Unions en Gran Bretaña, 1824) y movimientos obreros que dieron origen al socialismo científico (Marx y Engels, 'El Manifiesto Comunista', 1848) y al anarquismo (Bakunin, Kropotkin). El capitalismo industrial se organizó en torno a tres elementos: el capital (medios de producción en manos privadas), el trabajo asalariado y el mercado libre. La doctrina económica dominante era el laissez-faire (no interferencia estatal en la economía), que justificaba la acumulación de capital y el libre comercio. La industrialización transformó también la estructura familiar: la familia nuclear asalariada sustituyó a la unidad productiva campesina."
