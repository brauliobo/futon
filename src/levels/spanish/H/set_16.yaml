title: 📝 Gramática - Neología y Lexicología Aplicada
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Neología: necesidad denominativa vs. expresiva. Procedimientos de formación de neologismos: derivación, composición, acronimia, siglas, préstamos (extranjerismos, calcos), truncaciones, palabras-maleta (blending). Neología semántica: extensión de significado. Neología de urgencia en lengua periodística. Locuciones y fraseología. Dictionaries of neologisms. Restricciones normativas de la RAE vs. uso real."
example: "acronimia → OVNI, SIDA, radar (radio detection and ranging). sigla → ONU, UE, PIB. blending → brunch (breakfast+lunch), infotainment. calco → ratón (de mouse), nube (de cloud). préstamo adaptado → internet, escáner, pádel. neología semántica → 'ventana' (ventana del ordenador). truncación → profe (profesor), bici (bicicleta). neologismo expresivo → 'empoderado', 'posverdad'. derivación → tuitear, googlear."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Formación de Neologismos
    description: Identifica los procedimientos de formación de neologismos en español.
    exercises:
      - type: grammar
        question: "¿Qué diferencia una sigla de un acrónimo? (son lo mismo/sigla: se pronuncian deletreando las letras (ONU, UE); acrónimo: se pronuncian como una palabra (OVNI, SIDA, radar)/la sigla es más reciente)"
        correctAnswer: "sigla: se pronuncian deletreando las letras (ONU, UE); acrónimo: se pronuncian como una palabra (OVNI, SIDA, radar)"
        rationale: "ONU se dice /o-n-u/ (sigla); OVNI se dice /óbni/ (acrónimo). La diferencia es la pronunciación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un blending o palabra-maleta? (un compuesto culto/fusión de partes de dos palabras para crear una nueva: 'brunch' (breakfast + lunch), 'infotainment' (information + entertainment)/un préstamo directo)"
        correctAnswer: "fusión de partes de dos palabras para crear una nueva: 'brunch' (breakfast + lunch), 'infotainment' (information + entertainment)"
        rationale: "Blending: mezcla de fragmentos → español: 'cantautor' (cantante + autor), 'telenovela' (televisión + novela)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un calco lingüístico en la neología? (un préstamo con adaptación fonética/traducción de la estructura de la palabra extranjera morfema a morfema: 'ratón' (de mouse), 'nube' (de cloud)/una sigla)"
        correctAnswer: "traducción de la estructura de la palabra extranjera morfema a morfema: 'ratón' (de mouse), 'nube' (de cloud)"
        rationale: "Calco semántico: se traduce el significado en lugar de tomar prestada la forma → 'luna de miel' (honeymoon), 'rascacielos' (skyscraper)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre neología denominativa y neología expresiva? (nada/denominativa: crea una palabra para un concepto nuevo ('selfi', 'tuit'); expresiva: crea una palabra nueva por razones estilísticas ('chachi', 'guay')/denominativa es solo científica)"
        correctAnswer: "denominativa: crea una palabra para un concepto nuevo ('selfi', 'tuit'); expresiva: crea una palabra nueva por razones estilísticas ('chachi', 'guay')"
        rationale: "Neología denominativa: motivada por necesidad. Neología expresiva: motivada por creatividad o efecto pragmático."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la neología semántica? (creación de palabras nuevas/extensión del significado de una palabra existente para cubrir un concepto nuevo: 'ventana' (del SO), 'navegar' (en internet)/la adopción de préstamos)"
        correctAnswer: "extensión del significado de una palabra existente para cubrir un concepto nuevo: 'ventana' (del SO), 'navegar' (en internet)"
        rationale: "Neología semántica: 'ratón' (dispositivo) ≠ 'ratón' (animal) → la misma forma, nuevo significado por metáfora o metonimia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se denominan palabras como 'profe' (profesor) o 'bici' (bicicleta)? (préstamos/compuestos/truncaciones o apócopes: reducción de una palabra a su inicio o un fragmento)"
        correctAnswer: "truncaciones o apócopes: reducción de una palabra a su inicio o un fragmento"
        rationale: "Truncación: 'profe', 'bici', 'tele', 'foto', 'moto' → acortamiento con valor coloquial y afectivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la postura de la RAE ante los extranjerismos? (rechazarlos siempre/aceptarlos todos inmediatamente/preferir los calcos y las palabras patrimoniales pero acepta los extranjerismos cuando están asentados en el uso: recomienda 'selfi' en lugar de 'selfie')"
        correctAnswer: "preferir los calcos y las palabras patrimoniales pero acepta los extranjerismos cuando están asentados en el uso: recomienda 'selfi' en lugar de 'selfie'"
        rationale: "RAE: principio de adaptación → 'selfi', 'tuit', 'bloguero' (adaptados) preferiibles a las formas anglófonas originales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un xenismo o préstamo no adaptado? (un arabismo medieval/un préstamo con adaptación ortográfica/extranjerismo que mantiene su forma original y se escribe en cursiva: 'ballet', 'software', 'football')"
        correctAnswer: "extranjerismo que mantiene su forma original y se escribe en cursiva: 'ballet', 'software', 'football'"
        rationale: "Xenismo: el préstamo mantiene su forma extranjera → se marca ortográficamente (cursiva o comillas) en textos formales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se forman los verbos neológicos del inglés en español? (sin cambio: to tuit = tuit/mediante el sufijo verbal -ar/-ear: 'tuitear', 'googlear', 'chatear'/son invariables)"
        correctAnswer: "mediante el sufijo verbal -ar/-ear: 'tuitear', 'googlear', 'chatear'"
        rationale: "Los anglicismos verbales en español se integran con -ar/-ear: 'tuitear', 'bloguear', 'hackear' → integración morfológica al sistema español."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una locución idiomática o modismo? (una colocación libre/expresión pluriverbal fija con significado no composicional que no se puede deducir del significado de sus partes: 'meter la pata', 'tomar el pelo'/un compuesto nominal)"
        correctAnswer: "expresión pluriverbal fija con significado no composicional que no se puede deducir del significado de sus partes: 'meter la pata', 'tomar el pelo'"
        rationale: "Modismo: la semántica es opaca → 'tomar el pelo' no tiene nada que ver con el pelo. Fraseologismo con fijación formal."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Neología y Uso Real
    description: Aplica los conceptos de neología al español actual.
    exercises:
      - type: grammar
        question: "¿Qué es la posverdad como neologismo? (un sinónimo de mentira/término que describe la situación en que las emociones y creencias personales influyen más en la opinión pública que los hechos objetivos/un término filosófico antiguo)"
        correctAnswer: término que describe la situación en que las emociones y creencias personales influyen más en la opinión pública que los hechos objetivos
        rationale: "Posverdad (post-truth): neologismo seleccionado como palabra del año 2016 por el Oxford → neología denominativa de urgencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se adapta 'podcast' en español según la RAE? (como 'podcast' invariable/la RAE recomienda 'pódcast' (con tilde por ser llana terminada en consonante no N/S) y su plural 'pódcasts'/como 'podcaste')"
        correctAnswer: la RAE recomienda 'pódcast' (con tilde por ser llana terminada en consonante no N/S) y su plural 'pódcasts'
        rationale: "Adaptación ortográfica: la RAE aplica las reglas de acentuación del español a los extranjerismos asimilados → 'pódcast'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de neologismo es 'empoderamiento'? (préstamo/calco del inglés 'empowerment': neología por calco semántico-morfológico/truncación)"
        correctAnswer: "calco del inglés 'empowerment': neología por calco semántico-morfológico"
        rationale: "'Empoderamiento': calco de 'empowerment' → el poder se convierte en el lexema base: em-poder-amiento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre un compuesto ortográfico y uno sintagmático? (ninguna/compuesto ortográfico: una sola palabra gráfica ('lavaplatos'); sintagmático: varias palabras con espacio pero con sentido unitario ('coche bomba')/el compuesto ortográfico es siempre más nuevo)"
        correctAnswer: "compuesto ortográfico: una sola palabra gráfica ('lavaplatos'); sintagmático: varias palabras con espacio pero con sentido unitario ('coche bomba')"
        rationale: "Compuesto: 'sacacorchos' (gráfico: una palabra). Compuesto sintagmático: 'Estado miembro', 'coche bomba', 'lingua franca'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la neología de urgencia es especialmente activa en el lenguaje periodístico? (porque los periodistas cometen más errores/porque los medios necesitan denominar rápidamente realidades nuevas (crisis, tecnología, política) sin esperar la sanción normativa/porque el periodismo es oral)"
        correctAnswer: porque los medios necesitan denominar rápidamente realidades nuevas (crisis, tecnología, política) sin esperar la sanción normativa
        rationale: "Neología de urgencia: los periodistas acuñan términos que luego pueden o no consolidarse → 'covidiot', 'confinamiento', 'antimascarilla'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una locución prepositiva? (una preposición simple/grupo nominal o adverbial que funciona como preposición: 'a través de', 'en cuanto a', 'con respecto a'/un verbo compuesto)"
        correctAnswer: "grupo nominal o adverbial que funciona como preposición: 'a través de', 'en cuanto a', 'con respecto a'"
        rationale: "Locución prepositiva: unidad fraseológica con función de preposición → introduce un complemento en el mismo modo que una preposición simple."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el sufijo '-ismo' en neología política? (solo indica doctrinas filosóficas/es un sufijo muy productivo que crea sustantivos de doctrina, movimiento o actitud: 'feminismo', 'nacionalismo', 'populismo', 'machismo'/solo crea adjetivos)"
        correctAnswer: "es un sufijo muy productivo que crea sustantivos de doctrina, movimiento o actitud: 'feminismo', 'nacionalismo', 'populismo', 'machismo'"
        rationale: "'-ismo' = uno de los sufijos más productivos en neología política y cultural → señala sistemas de creencias o tendencias."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se escribe 'e-mail' vs. 'email' en español actual? (siempre con guión/la RAE recomienda 'email' (o 'correo electrónico') como formas ya asimiladas, sin guión/siempre con guión si es anglicismo)"
        correctAnswer: la RAE recomienda 'email' (o 'correo electrónico') como formas ya asimiladas, sin guión
        rationale: "'Email' ya se considera asimilado → no requiere cursiva ni guión. La RAE también recomienda el calco 'correo electrónico' o 'mensaje electrónico'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la parasíntesis en formación de palabras? (unión de dos palabras/procedimiento que combina simultáneamente prefijación y sufijación, no por pasos: 'aterrizar' (a+tierra+izar, no existe *aterrizar de 'tierra' ni de *aterrizar)/un tipo de composición)"
        correctAnswer: "procedimiento que combina simultáneamente prefijación y sufijación, no por pasos: 'aterrizar' (a+tierra+izar, no existe *aterrizar de 'tierra' ni de *aterrizar)"
        rationale: "Parasíntesis: el parasintético no se puede analizar como derivado de una sola base: 'empapelar', 'acalorar', 'ensuciar' → prefijo + base + sufijo simultáneos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se llama el fenómeno de que una sigla se analice como un nombre común y se derive?: UE → europeísta, ONG → ongero/a (coloquial). (retroderivación/lexicalización y derivación de siglas: la sigla pierde su carácter de abreviatura y se convierte en base léxica/conversión categorial)"
        correctAnswer: "lexicalización y derivación de siglas: la sigla pierde su carácter de abreviatura y se convierte en base léxica"
        rationale: "Lexicalización de siglas: SIDA → sidoso, ongero, eurófobo → las siglas se tratan como sustantivos ordinarios y reciben afijos."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
