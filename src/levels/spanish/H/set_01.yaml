title: 🎓 Gramática - Teoría Lingüística - Chomsky y la Gramática Generativa
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática generativa transformacional (Chomsky): estructura profunda y superficial, reglas de reescritura, transformaciones. Gramática universal, innatismo, adquisición del lenguaje (LAD, período crítico). Competencia vs. actuación. Crítica al conductismo de Skinner. Minimalismo. Lingüística cognitiva (Lakoff, Langacker) como contrapunto."
example: "competencia → conocimiento gramatical subyacente del hablante nativo. actuación → uso real del lenguaje (puede contener errores). estructura profunda → 'Juan persiguió a Pedro' / 'Pedro fue perseguido por Juan' (misma EP). estructura superficial → la forma fonológica del enunciado. LAD → dispositivo de adquisición del lenguaje (innato). período crítico → ventana óptima de adquisición de L1 (antes de la pubertad)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Gramática Generativa - Conceptos Fundamentales
    description: Identifica los conceptos clave de la teoría generativa.
    exercises:
      - type: grammar
        question: "¿Qué distingue la competencia lingüística de la actuación? (competencia es el habla y actuación la lengua/nada/competencia: conocimiento gramatical subyacente del hablante; actuación: uso real del lenguaje, que puede contener errores)"
        correctAnswer: "competencia: conocimiento gramatical subyacente del hablante; actuación: uso real del lenguaje, que puede contener errores"
        rationale: "Chomsky retoma la distinción langue/parole de Saussure: competencia (conocimiento ideal) ≠ actuación (uso concreto con lapsus, correcciones)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la estructura profunda en la gramática generativa? (el vocabulario/la pronunciación del enunciado/la representación semántica y lógica abstracta que subyace a distintas estructuras superficiales)"
        correctAnswer: la representación semántica y lógica abstracta que subyace a distintas estructuras superficiales
        rationale: "EP: dos oraciones activa/pasiva comparten la misma estructura profunda (misma relación semántica entre participantes)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el LAD (Language Acquisition Device)? (un manual de gramática/un método de enseñanza/el dispositivo innato de adquisición del lenguaje que permite a los niños aprender su lengua materna)"
        correctAnswer: el dispositivo innato de adquisición del lenguaje que permite a los niños aprender su lengua materna
        rationale: "LAD (Chomsky): mecanismo innato que explica la rapidez y universalidad de la adquisición de L1 en niños."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el argumento de la 'pobreza del estímulo'? (que los adultos hablan mal/que los niños no escuchan suficiente lenguaje/que el input lingüístico que reciben los niños es insuficiente para explicar su conocimiento gramatical → debe haber conocimiento innato)"
        correctAnswer: que el input lingüístico que reciben los niños es insuficiente para explicar su conocimiento gramatical → debe haber conocimiento innato
        rationale: "Pobreza del estímulo: los niños usan estructuras que nunca han oído → el conocimiento gramatical no puede ser solo aprendido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la gramática universal? (la gramática del latín/la gramática de la RAE/el conjunto de principios y parámetros innatos compartidos por todas las lenguas humanas)"
        correctAnswer: el conjunto de principios y parámetros innatos compartidos por todas las lenguas humanas
        rationale: "Gramática Universal (GU): las lenguas varían en parámetros (orden de palabras, pro-drop) pero comparten principios universales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la crítica de Chomsky a Skinner y el conductismo lingüístico? (que el conductismo era demasiado mentalista/que el lenguaje no puede explicarse como conducta aprendida por estímulo-respuesta: la creatividad lingüística lo demuestra/que Skinner era demasiado nativista)"
        correctAnswer: "que el lenguaje no puede explicarse como conducta aprendida por estímulo-respuesta: la creatividad lingüística lo demuestra"
        rationale: "Chomsky (1959): reseña destructiva del 'Verbal Behavior' de Skinner → el lenguaje es creativo: producimos oraciones nunca oídas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el período crítico en la adquisición del lenguaje? (la edad adulta/la ventana temporal (antes de la pubertad) en que la adquisición de L1 es óptima y natural/el momento de aprender a leer)"
        correctAnswer: la ventana temporal (antes de la pubertad) en que la adquisición de L1 es óptima y natural
        rationale: "Período crítico (Lenneberg): hay una ventana biológica para la adquisición nativa; pasada la pubertad, el acceso pleno a la GU decrece."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los parámetros en la teoría de Principios y Parámetros? (opciones binarias que varían entre lenguas: pro-drop (español sí / inglés no), orden básico de palabras (SVO/SOV)/reglas fijas iguales en todas las lenguas/los verbos irregulares)"
        correctAnswer: "opciones binarias que varían entre lenguas: pro-drop (español sí / inglés no), orden básico de palabras (SVO/SOV)"
        rationale: "Parámetros: switches que las lenguas fijan en la adquisición → pro-drop: español permite 'Llevo = yo llevo'; inglés no: 'I go' obligatorio."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué propone la lingüística cognitiva (Lakoff, Langacker) frente al generativismo? (que la gramática es innata/que el lenguaje no es un módulo autónomo sino que emerge de estructuras cognitivas generales: conceptualización, experiencia corporal/que el lenguaje es puramente formal)"
        correctAnswer: "que el lenguaje no es un módulo autónomo sino que emerge de estructuras cognitivas generales: conceptualización, experiencia corporal"
        rationale: "Lingüística cognitiva: el lenguaje es motivado (no arbitrario en su totalidad) y refleja la experiencia corporal y conceptual."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la recursividad en el lenguaje? (la repetición de palabras/la capacidad de incrustar estructuras dentro de estructuras → 'La gata que persiguió al ratón que comió el queso que...'/la métrica)"
        correctAnswer: la capacidad de incrustar estructuras dentro de estructuras → 'La gata que persiguió al ratón que comió el queso que...'
        rationale: "Recursividad: propiedad clave para Chomsky → permite generar infinitas oraciones con medios finitos."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis Generativo Aplicado
    description: Aplica los conceptos de la gramática generativa.
    exercises:
      - type: grammar
        question: "¿Comparten 'El gato persiguió al ratón' y 'El ratón fue perseguido por el gato' la misma estructura profunda? (no, son distintas/sí: misma relación semántica entre agente y paciente/solo parcialmente)"
        correctAnswer: "sí: misma relación semántica entre agente y paciente"
        rationale: "Activa/pasiva → misma EP (relación semántica idéntica) pero distinta estructura superficial (forma fonológica)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'Colorless green ideas sleep furiously' (Chomsky) es famosa? (es un poema/es gramaticalmente correcta pero semánticamente absurda → prueba que la gramática y el significado son niveles independientes/es un error tipográfico)"
        correctAnswer: es gramaticalmente correcta pero semánticamente absurda → prueba que la gramática y el significado son niveles independientes
        rationale: "La frase de Chomsky muestra que la gramaticalidad es independiente de la semántica: puede haber forma sin contenido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el parámetro pro-drop y qué lenguas lo ejemplifican? (el orden de palabras/la posibilidad de omitir el sujeto pronominal: el español lo permite (hablas = tú hablas); el inglés no (you speak, obligatorio)/la concordancia de género)"
        correctAnswer: "la posibilidad de omitir el sujeto pronominal: el español lo permite (hablas = tú hablas); el inglés no (you speak, obligatorio)"
        rationale: "Pro-drop: parámetro que permite la elisión del sujeto pronominal en lenguas con morfología verbal rica: español, italiano, japonés."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué evidencia apoya el innatismo lingüístico de Chomsky? (que los niños aprenden vocabulario por imitación/que niños aprenden L1 a la misma velocidad en culturas distintas, corrigen la hipercorrección espontáneamente y producen oraciones no oídas/que los adultos enseñan gramática explícitamente)"
        correctAnswer: que niños aprenden L1 a la misma velocidad en culturas distintas, corrigen la hipercorrección espontáneamente y producen oraciones no oídas
        rationale: "Innatismo: universalidad del desarrollo lingüístico + creatividad sintáctica + error de hipercorrección espontáneamente corregido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una transformación en la gramática generativa? (un cambio de significado/una operación formal que convierte la estructura profunda en estructura superficial: pasivización, interrogación, topicalización/un préstamo léxico)"
        correctAnswer: "una operación formal que convierte la estructura profunda en estructura superficial: pasivización, interrogación, topicalización"
        rationale: "Transformaciones: reglas que reorganizan la estructura: pasiva → mueve el objeto a posición de sujeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el minimalismo en lingüística generativa? (la lingüística del habla coloquial/el programa de Chomsky que busca reducir la gramática a operaciones mínimas (Merge) y principios de economía/la lingüística de corpus)"
        correctAnswer: el programa de Chomsky que busca reducir la gramática a operaciones mínimas (Merge) y principios de economía
        rationale: "Programa Minimista (1990s): simplifica la arquitectura gramatical → la operación básica es Merge (ensamble de dos elementos)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo explica la teoría generativa la adquisición de L1 sin enseñanza explícita? (por imitación y refuerzo/el niño activa los parámetros de su lengua a partir del input, gracias al LAD y la GU innata/por maduración cognitiva general)"
        correctAnswer: el niño activa los parámetros de su lengua a partir del input, gracias al LAD y la GU innata
        rationale: "GU + input → el niño fija los parámetros de su lengua (pro-drop, orden...) sin instrucción explícita."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué demuestra el caso de Genie (niña privada de lenguaje hasta la adolescencia)? (que el lenguaje se aprende a cualquier edad/que pasado el período crítico, la adquisición de L1 queda gravemente limitada/que el LAD no existe)"
        correctAnswer: que pasado el período crítico, la adquisición de L1 queda gravemente limitada
        rationale: "Genie: privada de input lingüístico hasta los 13 años → adquirió vocabulario pero no gramática plena → evidencia del período crítico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la hipercorrección lingüística de los niños? (copiar el error de un adulto/producir formas incorrectas por aplicar una regla gramatical a casos excepcionales: 'yo sabo', 'ponido' → prueba de adquisición de reglas, no imitación/un signo de dislexia)"
        correctAnswer: "producir formas incorrectas por aplicar una regla gramatical a casos excepcionales: 'yo sabo', 'ponido' → prueba de adquisición de reglas, no imitación"
        rationale: "Hipercorrección (overgeneralization): el niño construye la regla activamente → 'yo sabo' prueba que domina la terminación -o, no que imita."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la aportación central de la lingüística cognitiva de Lakoff? (que la gramática es innata/que el pensamiento humano es fundamentalmente metafórico y el lenguaje lo refleja: 'el tiempo es dinero', 'las ideas son objetos'/que el lenguaje es arbitrario)"
        correctAnswer: "que el pensamiento humano es fundamentalmente metafórico y el lenguaje lo refleja: 'el tiempo es dinero', 'las ideas son objetos'"
        rationale: "Lakoff y Johnson ('Metaphors We Live By', 1980): las metáforas conceptuales estructuran nuestra comprensión de la realidad."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
