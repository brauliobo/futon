title: 🔬 Gramática - Análisis del Discurso - Argumentación Avanzada
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Argumentación avanzada: estructura del argumento (Toulmin: datos, garantía, respaldo, calificación, refutación, conclusión). Tipos de argumentos: de autoridad, de ejemplo, de analogía, de causa-efecto, ad hominem, argumento de la pendiente resbaladiza, hombre de paja, argumento del hombre en general. Falacias lógicas. Conectores argumentativos: concesivos, contraargumentativos, causales, consecutivos. Polifonía enunciativa: voces en el texto. Modalización."
example: "argumento de autoridad → 'Según la OMS, el tabaco causa cáncer'. argumento de analogía → 'Como en Finlandia, en España también debería aplicarse esta política'. ad hominem → atacar al oponente, no al argumento. hombre de paja → distorsionar el argumento contrario para atacarlo más fácilmente. pendiente resbaladiza → 'Si legalizamos X, pronto también legalizaremos Y y Z'. conector concesivo → 'aunque', 'si bien', 'a pesar de que'. modalización → 'quizás', 'parece que', 'es evidente que'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Argumentación y Falacias
    description: Identifica tipos de argumentos y falacias lógicas.
    exercises:
      - type: grammar
        question: "¿Qué es el argumento de autoridad? (un argumento ad hominem/una falacia/argumento que apoya la tesis citando a una fuente reconocida como experta: 'Según la OMS...')"
        correctAnswer: "argumento que apoya la tesis citando a una fuente reconocida como experta: 'Según la OMS...'"
        rationale: "Argumento de autoridad: la credibilidad de la fuente refuerza la tesis. Es válido si la fuente es genuinamente experta y no está sesgada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la falacia ad hominem? (una analogía débil/criticar el argumento con datos/atacar a la persona que defiende una postura en lugar de refutar su argumento)"
        correctAnswer: atacar a la persona que defiende una postura en lugar de refutar su argumento
        rationale: "Ad hominem: 'No podemos creerle porque es un político corrupto' → se ataca al emisor, no al contenido del argumento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la falacia del 'hombre de paja'? (presentar argumentos de autoridad falsos/atacar a una persona/distorsionar o exagerar la postura del oponente para atacar más fácilmente la versión distorsionada)"
        correctAnswer: distorsionar o exagerar la postura del oponente para atacar más fácilmente la versión distorsionada
        rationale: "Hombre de paja: 'Propones reducir el gasto militar → ¡quieres dejar el país indefenso!' → la postura original no decía eso."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la falacia de la pendiente resbaladiza? (un argumento de ejemplo/una analogía/argumentar que una acción inevitablemente llevará a consecuencias extremas sin demostrar el vínculo causal)"
        correctAnswer: argumentar que una acción inevitablemente llevará a consecuencias extremas sin demostrar el vínculo causal
        rationale: "Pendiente resbaladiza: 'Si permitimos el matrimonio gay, luego permitirán casarse con animales' → salto sin justificación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función de los conectores concesivos como 'aunque' y 'a pesar de que'? (introducir la conclusión/introducir la tesis/introducir una objeción que el hablante reconoce pero que no invalida su argumento principal)"
        correctAnswer: introducir una objeción que el hablante reconoce pero que no invalida su argumento principal
        rationale: "Concesivo: 'Aunque el método es costoso, sus resultados son superiores' → la concesión refuerza el argumento principal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la modalización en el discurso? (la puntuación/la entonación/los recursos lingüísticos que expresan el grado de compromiso del hablante con lo dicho: 'quizás', 'es evidente que', 'creo que')"
        correctAnswer: "los recursos lingüísticos que expresan el grado de compromiso del hablante con lo dicho: 'quizás', 'es evidente que', 'creo que'"
        rationale: "Modalización: el hablante señala su postura epistémica (certeza/duda) o afectiva → 'parece que' vs. 'es indudable que'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el argumento de analogía? (comparar datos estadísticos/argumentar que lo que es válido en un caso similar también lo es en el caso analizado: 'Como funcionó en Finlandia, funcionará aquí'/citar a una autoridad)"
        correctAnswer: "argumentar que lo que es válido en un caso similar también lo es en el caso analizado: 'Como funcionó en Finlandia, funcionará aquí'"
        rationale: "Analogía: la fuerza del argumento depende del grado de similitud real entre los casos comparados."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la polifonía enunciativa en el análisis del discurso? (usar muchos sinónimos/la presencia de múltiples voces o perspectivas en un texto, aunque sea de un solo autor: citas, discurso indirecto, ironía/el uso de varios registros)"
        correctAnswer: "la presencia de múltiples voces o perspectivas en un texto, aunque sea de un solo autor: citas, discurso indirecto, ironía"
        rationale: "Polifonía (Bajtín, Ducrot): todo enunciado dialoga con enunciados previos → las voces del texto construyen su sentido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la garantía en el modelo de Toulmin? (el dato empírico/el principio general o regla que conecta los datos con la conclusión/la fuente de autoridad)"
        correctAnswer: el principio general o regla que conecta los datos con la conclusión
        rationale: "Toulmin: datos → (garantía) → conclusión. La garantía es la premisa mayor implícita: 'Todo ciudadano debe pagar impuestos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué función tiene el conector 'por consiguiente'? (contraargumentar/introducir la consecuencia lógica de lo argumentado anteriormente/expresar concesión)"
        correctAnswer: introducir la consecuencia lógica de lo argumentado anteriormente
        rationale: "Conector consecutivo: 'por consiguiente', 'por tanto', 'en consecuencia' → el segmento que sigue se infiere del anterior."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis Argumentativo Aplicado
    description: Aplica los conceptos de argumentación al análisis textual.
    exercises:
      - type: grammar
        question: "¿Qué tipo de argumento es 'El 80% de los estudiantes que estudian más de 3 horas diarias aprueban, por lo que deberías estudiar más'? (de autoridad/de ejemplo con datos estadísticos/de analogía)"
        correctAnswer: de ejemplo con datos estadísticos
        rationale: "Argumento por el ejemplo (o evidencial): datos estadísticos como evidencia empírica para apoyar una conclusión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No deberías hacerle caso: no terminó la carrera.' ¿Qué falacia es? (pendiente resbaladiza/ad hominem: ataca la credibilidad de la persona, no el contenido de su argumento/hombre de paja)"
        correctAnswer: "ad hominem: ataca la credibilidad de la persona, no el contenido de su argumento"
        rationale: "Ad hominem circunstancial: se descalifica al hablante por sus circunstancias personales → no refuta el argumento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre contraargumentación y refutación? (son sinónimas/contraargumentación: se reconoce la validez parcial del argumento contrario antes de rebatirlo; refutación: se niega frontalmente su validez/refutación es menos formal)"
        correctAnswer: "contraargumentación: se reconoce la validez parcial del argumento contrario antes de rebatirlo; refutación: se niega frontalmente su validez"
        rationale: "Contraargumentación concesiva: 'Es cierto que X, sin embargo Y' → más persuasivo que la negación directa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la falacia del apelo a la naturaleza? (argumentar que algo es bueno porque es antiguo/argumentar que algo es bueno o correcto porque es 'natural': 'la energía solar es mejor porque es natural'/una pendiente resbaladiza)"
        correctAnswer: "argumentar que algo es bueno o correcto porque es 'natural': 'la energía solar es mejor porque es natural'"
        rationale: "Apelo a la naturaleza: 'lo natural = bueno' es una falacia → el arsénico es natural y tóxico; la penicilina es sintética y salvavidas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué connota el uso de 'aparentemente' en 'El gobierno aparentemente ha reducido el paro'? (certeza/duda o distanciamiento: el hablante no garantiza la veracidad de la afirmación/acuerdo total)"
        correctAnswer: "duda o distanciamiento: el hablante no garantiza la veracidad de la afirmación"
        rationale: "Modalización epistémica de duda: 'aparentemente', 'al parecer', 'supuestamente' → el hablante se protege de responsabilizarse."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la estructura básica de un texto argumentativo formal? (introducción/desarrollo/conclusión/tesis → argumentos → refutación de objeciones → conclusión/planteamiento → nudo → desenlace)"
        correctAnswer: tesis → argumentos → refutación de objeciones → conclusión
        rationale: "Texto argumentativo: tesis (postura), cuerpo argumentativo (pruebas), anticipación de objeciones + refutación, conclusión (reafirmación)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los topoi argumentativos? (recursos retóricos de adorno/lugares comunes o esquemas argumentativos compartidos culturalmente que se usan como garantías implícitas/los conectores discursivos)"
        correctAnswer: lugares comunes o esquemas argumentativos compartidos culturalmente que se usan como garantías implícitas
        rationale: "Topoi (Aristóteles): 'más vale prevenir que curar' (topos de la precaución) → garantía implícita en la argumentación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue al argumento de causa-efecto de una correlación estadística? (nada/el argumento causal establece un nexo necesario; la correlación solo indica que dos variables covarían sin implicar causalidad/la estadística es siempre causal)"
        correctAnswer: el argumento causal establece un nexo necesario; la correlación solo indica que dos variables covarían sin implicar causalidad
        rationale: "Falacia post hoc: 'A ocurre antes de B → A causa B'. La correlación no implica causalidad → error frecuente en argumentación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función retórica de anticipar objeciones en un texto argumentativo? (alargar el texto/neutralizar las posibles refutaciones del lector antes de que las formule, reforzando la credibilidad del argumentador/confundir al lector)"
        correctAnswer: neutralizar las posibles refutaciones del lector antes de que las formule, reforzando la credibilidad del argumentador
        rationale: "Prolepsis: anticipar y responder a las objeciones demuestra rigor intelectual y aumenta la persuasión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué conector introduce la refutación en 'Los datos apoyan la propuesta; no obstante, hay que considerar los costes'? (causal/adversativo-contraargumentativo: 'no obstante' introduce una objeción/consecutivo)"
        correctAnswer: "adversativo-contraargumentativo: 'no obstante' introduce una objeción"
        rationale: "'No obstante', 'sin embargo', 'ahora bien' → conectores adversativos que introducen la contraargumentación o refutación."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
