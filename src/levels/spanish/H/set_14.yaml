title: 🔬 Gramática - Psicolingüística y Adquisición de Lenguas
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Psicolingüística: procesamiento del lenguaje, comprensión y producción. Modelos de procesamiento (modular vs. interactivo). Adquisición de L1: etapas, hipótesis nativista vs. conexionista. Adquisición de L2: interlengua (Selinker), fossilization, hipótesis del input comprensible (Krashen), filtro afectivo, hipótesis del monitor, orden de adquisición. Bilingüismo: simultáneo, secuencial, coordinado, compuesto. Afasia (Broca, Wernicke)."
example: "interlengua → sistema lingüístico del aprendiz de L2: entre L1 y la L2 meta. fosilización → cuando la interlengua deja de progresar. input comprensible (Krashen) → i+1: input un poco más avanzado que el nivel actual. filtro afectivo → ansiedad o baja motivación bloquean la adquisición. afasia de Broca → producción perturbada, comprensión preservada. afasia de Wernicke → producción fluida pero incoherente, comprensión perturbada. bilingüismo simultáneo → L1 y L2 adquiridas antes de los 3 años."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Adquisición de L2 e Interlengua
    description: Identifica los conceptos clave de la adquisición de lenguas.
    exercises:
      - type: grammar
        question: "¿Qué es la interlengua según Selinker? (el bilingüismo perfecto/una mezcla de dos idiomas/el sistema lingüístico propio del aprendiz de L2: ni L1 ni L2 meta, con sus propias reglas y errores sistemáticos)"
        correctAnswer: "el sistema lingüístico propio del aprendiz de L2: ni L1 ni L2 meta, con sus propias reglas y errores sistemáticos"
        rationale: "Interlengua (Selinker, 1972): el aprendiz desarrolla un sistema autónomo y dinámico → no es L1 ni L2, tiene su gramática propia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la fosilización en la adquisición de L2? (la adquisición perfecta de L2/un avance rápido/el fenómeno por el que ciertos rasgos de la interlengua dejan de progresar y se estabilizan permanentemente, aunque sean incorrectos)"
        correctAnswer: el fenómeno por el que ciertos rasgos de la interlengua dejan de progresar y se estabilizan permanentemente, aunque sean incorrectos
        rationale: "Fosilización: el hablante usa sistemáticamente una forma incorrecta que ya no corrige, incluso con instrucción explícita."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué propone la hipótesis del input comprensible de Krashen? (que hay que memorizar reglas/que la adquisición ocurre cuando el aprendiz recibe input un poco más avanzado que su nivel actual (i+1)/que el output es lo más importante)"
        correctAnswer: que la adquisición ocurre cuando el aprendiz recibe input un poco más avanzado que su nivel actual (i+1)
        rationale: "Krashen: i+1 → el input debe ser comprensible pero con nuevos elementos. Si es demasiado fácil o difícil, no hay adquisición."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el filtro afectivo de Krashen? (un tipo de feedback correctivo/el conjunto de factores emocionales (ansiedad, motivación, autoconfianza) que pueden bloquear o facilitar la adquisición de L2/una etapa del desarrollo lingüístico)"
        correctAnswer: el conjunto de factores emocionales (ansiedad, motivación, autoconfianza) que pueden bloquear o facilitar la adquisición de L2
        rationale: "Filtro afectivo: alta ansiedad → filtro alto → el input no penetra. Baja ansiedad + alta motivación → filtro bajo → mejor adquisición."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la afasia de Broca de la de Wernicke? (la afasia de Broca afecta solo a la escritura/nada/Broca: producción perturbada, habla telegráfica, comprensión preservada; Wernicke: producción fluida pero incoherente, comprensión gravemente perturbada)"
        correctAnswer: "Broca: producción perturbada, habla telegráfica, comprensión preservada; Wernicke: producción fluida pero incoherente, comprensión gravemente perturbada"
        rationale: "Área de Broca (lóbulo frontal): producción. Área de Wernicke (lóbulo temporal): comprensión. Las afasias revelan la organización neurológica del lenguaje."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el bilingüismo simultáneo? (aprender L2 en la escuela primaria/aprender dos lenguas en la universidad/adquirir dos lenguas como L1 antes de los 3 años, en el hogar o en el entorno familiar)"
        correctAnswer: adquirir dos lenguas como L1 antes de los 3 años, en el hogar o en el entorno familiar
        rationale: "Bilingüismo simultáneo: dos L1 adquiridas en paralelo desde el nacimiento → una persona con dos lenguas maternas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre adquisición y aprendizaje según Krashen? (son sinónimos/adquisición: proceso inconsciente (como en L1); aprendizaje: proceso consciente y formal (estudio de reglas)/adquisición es más rápida)"
        correctAnswer: "adquisición: proceso inconsciente (como en L1); aprendizaje: proceso consciente y formal (estudio de reglas)"
        rationale: "Krashen distingue dos sistemas: adquisición (subconsciente, natural) y aprendizaje (consciente, escolar). Solo la adquisición produce fluidez real."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el monitor en la hipótesis del monitor de Krashen? (el profesor/el sistema de aprendizaje consciente que actúa como editor de la producción: solo funciona si hay tiempo y si el hablante conoce la regla/la memoria de trabajo)"
        correctAnswer: "el sistema de aprendizaje consciente que actúa como editor de la producción: solo funciona si hay tiempo y si el hablante conoce la regla"
        rationale: "Monitor: el conocimiento explícito de reglas puede corregir la producción, pero no genera fluidez espontánea."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los errores de transferencia en la interlengua? (errores aleatorios/errores causados por la influencia de la L1 sobre la L2: un hispanohablante que dice 'I am agree' (calco de 'estoy de acuerdo')/errores de simplificación)"
        correctAnswer: "errores causados por la influencia de la L1 sobre la L2: un hispanohablante que dice 'I am agree' (calco de 'estoy de acuerdo')"
        rationale: "Transferencia negativa o interferencia: la estructura de L1 se proyecta sobre L2 produciendo formas no existentes en la L2."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre el bilingüismo coordinado y el compuesto? (nada/coordinado: dos sistemas de significado separados (una palabra-un concepto por lengua); compuesto: una representación semántica compartida con dos formas fonológicas/son etapas de adquisición)"
        correctAnswer: "coordinado: dos sistemas de significado separados (una palabra-un concepto por lengua); compuesto: una representación semántica compartida con dos formas fonológicas"
        rationale: "Bilingüismo coordinado: el bilingüe tiene dos representaciones conceptuales separadas. Compuesto: las dos palabras comparten el mismo concepto."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Procesamiento del Lenguaje y Bilingüismo
    description: Profundiza en el procesamiento psicolingüístico y el bilingüismo.
    exercises:
      - type: grammar
        question: "¿Qué es el modelo modular de procesamiento del lenguaje? (el lenguaje es una red holística/la idea de que el lenguaje se procesa en módulos especializados e independientes (léxico, sintaxis, semántica) que operan en serie/el modelo conexionista)"
        correctAnswer: la idea de que el lenguaje se procesa en módulos especializados e independientes (léxico, sintaxis, semántica) que operan en serie
        rationale: "Modularismo (Fodor): módulos encapsulados → la sintaxis no usa información semántica mientras procesa. Contraste con los modelos interactivos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el efecto de frecuencia léxica? (que las palabras largas tardan más en procesarse/que las palabras de alta frecuencia se reconocen y producen más rápido que las de baja frecuencia/que el léxico no afecta al procesamiento)"
        correctAnswer: que las palabras de alta frecuencia se reconocen y producen más rápido que las de baja frecuencia
        rationale: "Efecto de frecuencia: 'casa' se activa más rápido que 'porcelana' → la frecuencia de uso refuerza las conexiones neuronales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'code-switching' en el bilingüismo? (un error de confusión/la alternancia entre dos lenguas dentro de un mismo discurso o enunciado, realizada por bilingües de forma sistemática y no como error/la interferencia lingüística)"
        correctAnswer: la alternancia entre dos lenguas dentro de un mismo discurso o enunciado, realizada por bilingües de forma sistemática y no como error
        rationale: "Code-switching (cambio de código): práctica bilingüe normal → no es señal de competencia incompleta sino de competencia pragmática específica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la etapa del 'balbuceo' en la adquisición de L1? (6-12 meses aproximadamente/la etapa en que el bebé produce sílabas repetidas (bababa, mamama) con estructura CV que anticipa el habla/la etapa de las primeras palabras)"
        correctAnswer: la etapa en que el bebé produce sílabas repetidas (bababa, mamama) con estructura CV que anticipa el habla
        rationale: "Balbuceo canónico (6-8 meses): el bebé reduce la complejidad articulatoria → estructura CV repetida universal en todos los niños."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué predice la hipótesis del orden de adquisición de Krashen? (que el orden varía mucho entre hablantes/que hay un orden natural y universal de adquisición de morfemas gramaticales en L2, independientemente de la L1/que L1 determina el orden)"
        correctAnswer: que hay un orden natural y universal de adquisición de morfemas gramaticales en L2, independientemente de la L1
        rationale: "Estudios de Dulay y Burt (1974): el orden de adquisición de morfemas en inglés como L2 es similar para hablantes de distintas L1."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre error e imprecisión en la adquisición de L2? (son lo mismo/error: producción sistemática de una forma no estándar refleja competencia de interlengua; imprecisión: fallo puntual de actuación (no de competencia)/el error es solo fonológico)"
        correctAnswer: "error: producción sistemática de una forma no estándar refleja competencia de interlengua; imprecisión: fallo puntual de actuación (no de competencia)"
        rationale: "Análisis de errores: el error sistemático es valioso → revela la gramática de la interlengua; el lapsus no."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el análisis de errores en L2? (corrección de ejercicios/metodología que estudia los errores del aprendiz para inferir las reglas de su interlengua y sus estrategias de aprendizaje/la comparación entre L1 y L2)"
        correctAnswer: metodología que estudia los errores del aprendiz para inferir las reglas de su interlengua y sus estrategias de aprendizaje
        rationale: "Análisis de errores (Corder, 1967): los errores no son fracasos sino datos → revelan la gramática de la interlengua."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el periodo silencioso en la adquisición de L2? (la fosilización/la etapa inicial en que algunos aprendices no producen en L2 pero comprenden y procesan activamente el input/una técnica de enseñanza)"
        correctAnswer: la etapa inicial en que algunos aprendices no producen en L2 pero comprenden y procesan activamente el input
        rationale: "Período silencioso: el aprendiz escucha y procesa antes de hablar. Respetarlo puede favorecer la adquisición natural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el debate central entre nativismo e interaccionismo en la adquisición de L1? (si se aprende primero el vocabulario o la gramática/si la capacidad lingüística es innata y modular (Chomsky) o emerge de la interacción social y las capacidades cognitivas generales (Bruner, Tomasello)/si el input tiene importancia)"
        correctAnswer: si la capacidad lingüística es innata y modular (Chomsky) o emerge de la interacción social y las capacidades cognitivas generales (Bruner, Tomasello)
        rationale: "Nativismo vs. interaccionismo: ¿el lenguaje tiene un sustrato innato específico (GU) o emerge de capacidades cognitivas y sociales generales?"
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la depresión lingüística (language attrition)? (la fosilización/la pérdida gradual de una lengua (L1 o L2) en hablantes que dejan de usarla, especialmente en contextos de inmigración/el olvido de vocabulario técnico)"
        correctAnswer: la pérdida gradual de una lengua (L1 o L2) en hablantes que dejan de usarla, especialmente en contextos de inmigración
        rationale: "Atrición lingüística: inmigrantes de segunda generación o hablantes que no usan la L1 → la lengua se erosiona en uso y precisión."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
