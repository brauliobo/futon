title: 🔬 Gramática - Retórica Clásica y Figuras del Pensamiento
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Retórica clásica (Aristóteles, Cicerón, Quintiliano): cinco partes (inventio, dispositio, elocutio, memoria, actio). Tres géneros oratorios: deliberativo, judicial, epidíctico. Figuras del pensamiento: ironía, hipérbole, prosopopeya, etopeya, apóstrofe, exclamación retórica, pregunta retórica, preterición, reticencia, eufemismo, antítesis, paradoja, oxímoron, quiasmo. Figuras de dicción: anáfora, epífora, polisíndeton, asíndeton, enumeración, gradación/clímax."
example: "ironía → 'Sí, claro, llegaste muy puntual' (a las 3 horas de retraso). hipérbole → 'Lloré un océano de lágrimas'. paradoja → 'Muero porque no muero' (Santa Teresa). oxímoron → 'obscura claridad'. quiasmo → 'En España el flamenco, en Argentina el tango' / 'El tango en Argentina, en España el flamenco'. anáfora → 'Vine, vi, vencí'. asíndeton → 'Vine, vi, vencí' (sin conjunciones). polisíndeton → 'y vino y vio y venció'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Retórica Clásica y Figuras del Pensamiento
    description: Identifica las figuras retóricas y las partes de la retórica clásica.
    exercises:
      - type: grammar
        question: "¿Cuáles son las cinco partes de la retórica clásica? (tesis, antítesis, síntesis, refutación, epílogo/introducción, desarrollo, argumento, conclusión, epílogo/inventio, dispositio, elocutio, memoria, actio)"
        correctAnswer: inventio, dispositio, elocutio, memoria, actio
        rationale: "Retórica clásica: inventio (hallar argumentos), dispositio (organizarlos), elocutio (expresarlos), memoria (memorizarlos), actio (pronunciarlos)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Muero porque no muero' (Santa Teresa). ¿Figura retórica? (oxímoron/hipérbole/paradoja: enunciado que parece contradictorio pero encierra una verdad profunda)"
        correctAnswer: "paradoja: enunciado que parece contradictorio pero encierra una verdad profunda"
        rationale: "Paradoja: 'vivo sin vivir en mí / y tan alta vida espero / que muero porque no muero' → tensión mística irresoluble."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Obscura claridad' (Góngora). ¿Figura? (sinestesia/metáfora/oxímoron: unión de dos palabras de significado opuesto en una misma expresión)"
        correctAnswer: "oxímoron: unión de dos palabras de significado opuesto en una misma expresión"
        rationale: "Oxímoron: 'obscura claridad', 'silencio ensordecedor', 'amarga dulzura' → contraste en dos palabras adyacentes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Sí, claro, eres muy trabajador' (dicho a alguien que no hace nada). ¿Figura? (litotes/hipérbole/ironía: se dice lo contrario de lo que se piensa con intención crítica o humorística)"
        correctAnswer: "ironía: se dice lo contrario de lo que se piensa con intención crítica o humorística"
        rationale: "Ironía: el enunciado literal contradice la intención comunicativa → el contexto y la entonación revelan el significado real."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la preterición? (un sinónimo de elipsis/decir lo que no se va a decir/'afirmar que no se va a tratar algo para luego tratarlo: No mencionaré el escándalo de tu comportamiento...')"
        correctAnswer: "'afirmar que no se va a tratar algo para luego tratarlo: No mencionaré el escándalo de tu comportamiento...'"
        rationale: "Preterición (o paralipsis): 'No voy a hablar de sus mentiras...' → al decirlo, las menciona. Recurso de oratoria persuasiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre anáfora y epífora? (son lo mismo con distinto nombre/nada/anáfora: repetición al principio de varios versos o frases; epífora: repetición al final)"
        correctAnswer: "anáfora: repetición al principio de varios versos o frases; epífora: repetición al final"
        rationale: "Anáfora: 'verde que te quiero verde / verde viento / verdes ramas'. Epífora: 'por ti me río, por ti lloro, por ti'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el asíndeton? (uso excesivo de conjunciones/omisión de conjunciones para crear agilidad y acumulación: 'Llegué, vi, vencí'/uso de preposiciones en lugar de conjunciones)"
        correctAnswer: "omisión de conjunciones para crear agilidad y acumulación: 'Llegué, vi, vencí'"
        rationale: "Asíndeton: supresión de nexos → ritmo ágil y enérgico. Contrario: polisíndeton (acumulación de conjunciones)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el género deliberativo en la retórica? (el de los discursos fúnebres/el de los discursos parlamentarios y políticos que deliberan sobre el futuro (aconseja o desaconseja una acción)/el de los alegatos judiciales)"
        correctAnswer: el de los discursos parlamentarios y políticos que deliberan sobre el futuro (aconseja o desaconseja una acción)
        rationale: "Género deliberativo: el discurso que busca persuadir sobre acciones futuras → discursos políticos, arengas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la gradación o clímax? (un defecto del texto/figura que organiza palabras o ideas en orden ascendente (clímax) o descendente (anticlímax) de intensidad/la estructura del poema)"
        correctAnswer: figura que organiza palabras o ideas en orden ascendente (clímax) o descendente (anticlímax) de intensidad
        rationale: "Clímax: 'Un gemido, un llanto, un alarido' → escala ascendente. Anticlímax: efecto sorpresivo de descenso."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el quiasmo? (una anáfora doble/figura que invierte el orden de los elementos en dos estructuras paralelas: 'En España el amor; el odio, en Francia' = AB / BA/una paradoja)"
        correctAnswer: "figura que invierte el orden de los elementos en dos estructuras paralelas: 'En España el amor; el odio, en Francia' = AB / BA"
        rationale: "Quiasmo (en forma de X, χ): A-B / B-A → 'El amor en España; en Francia, el odio'. Paralelo cruzado."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis Retórico Aplicado
    description: Aplica el análisis retórico a fragmentos literarios y discursivos.
    exercises:
      - type: grammar
        question: "'Lloré un río de lágrimas.' ¿Figura? (metáfora/hipérbole: exageración que intensifica una emoción o hecho más allá de la realidad/comparación)"
        correctAnswer: "hipérbole: exageración que intensifica una emoción o hecho más allá de la realidad"
        rationale: "Hipérbole: 'te lo he dicho mil veces', 'me muero de hambre', 'es más lento que una tortuga' → exageración expresiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¡Oh, muerte, ven a mí!' ¿Figura? (prosopopeya/apóstrofe: interpelación directa a un ser ausente, muerto, abstracto o inanime/ironía)"
        correctAnswer: "apóstrofe: interpelación directa a un ser ausente, muerto, abstracto o inanime"
        rationale: "Apóstrofe: dirigirse a alguien que no puede responder o está ausente → 'Oh Roma, en tu grandeza...'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la litotes? (hipérbole inversa/figura de atenuación que afirma algo negando lo contrario: 'No es mala idea' = es buena idea/un eufemismo)"
        correctAnswer: "figura de atenuación que afirma algo negando lo contrario: 'No es mala idea' = es buena idea"
        rationale: "Litotes: 'no le falta inteligencia' (es inteligente), 'no es el más honesto' (es deshonesto) → afirmación indirecta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre etopeya y prosopografía? (son lo mismo/etopeya: descripción del carácter moral de una persona; prosopografía: descripción física/la etopeya describe animales)"
        correctAnswer: "etopeya: descripción del carácter moral de una persona; prosopografía: descripción física"
        rationale: "Retrato = etopeya (carácter) + prosopografía (aspecto físico). La descripción completa de una persona."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué genera el polisíndeton? (agilidad/lentitud, énfasis y solemnidad por la acumulación de conjunciones: 'y fue y habló y venció y triunfó'/ambigüedad)"
        correctAnswer: "lentitud, énfasis y solemnidad por la acumulación de conjunciones: 'y fue y habló y venció y triunfó'"
        rationale: "Polisíndeton: repetición de conjunciones → efecto de acumulación solemne o de interminable sucesión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿A qué género retórico pertenece un discurso fúnebre o panegírico? (deliberativo/epidíctico: discurso de alabanza o vituperio, sin propósito deliberativo ni judicial/judicial)"
        correctAnswer: "epidíctico: discurso de alabanza o vituperio, sin propósito deliberativo ni judicial"
        rationale: "Género epidíctico (o demostrativo): discurso de elogio (panegírico) o censura → funeral, discurso de entrega de premios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El silencio lloraba en la habitación.' ¿Figura? (sinestesia/prosopopeya o personificación: se atribuye cualidades humanas a seres inanimados o abstractos/metonimia)"
        correctAnswer: "prosopopeya o personificación: se atribuye cualidades humanas a seres inanimados o abstractos"
        rationale: "Prosopopeya: 'el viento susurraba', 'la muerte acecha', 'el mar rugía' → seres inanimados o abstractos con cualidades humanas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la reticencia? (la ironía encubierta/interrupción voluntaria del discurso, dejando la frase sin terminar para que el receptor complete el sentido: 'Si me lo llega a decir, yo...'/una pregunta retórica)"
        correctAnswer: "interrupción voluntaria del discurso, dejando la frase sin terminar para que el receptor complete el sentido: 'Si me lo llega a decir, yo...'"
        rationale: "Reticencia (aposiopesis): 'Más vale que no vuelvas a...'; se suspende la amenaza → el lector imagina lo omitido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función retórica del eufemismo? (exagerar lo negativo/suavizar o sustituir una expresión considerada tabú, ofensiva o dolorosa: 'pasó a mejor vida' por 'murió'/crear ironía)"
        correctAnswer: "suavizar o sustituir una expresión considerada tabú, ofensiva o dolorosa: 'pasó a mejor vida' por 'murió'"
        rationale: "Eufemismo: atenúa la crudeza léxica → 'persona en situación de calle' (sin hogar), 'ajuste de plantilla' (despido)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la dispositio en la retórica clásica? (hallar los argumentos/la organización y distribución del discurso: exordio, narratio, confirmatio, refutatio, peroratio/la pronunciación del discurso)"
        correctAnswer: "la organización y distribución del discurso: exordio, narratio, confirmatio, refutatio, peroratio"
        rationale: "Dispositio: cómo se estructura el discurso → exordio (captatio benevolentiae), narración, argumentación, refutación, cierre."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
