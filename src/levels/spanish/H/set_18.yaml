title: 📝 Gramática - El Texto Académico y Científico
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Texto académico y científico: características formales (objetividad, impersonalidad, precisión, tecnicismo, densidad informativa). Estructura IMRD (Introducción-Metodología-Resultados-Discusión). Cita académica: estilos APA, MLA, Chicago, Vancouver. Intertextualidad académica: cita directa, indirecta, paráfrasis, nota a pie. Nominalizaciones. Perífrasis de probabilidad epistémica. El discurso indirecto libre. Hedging (atenuación de afirmaciones): 'parece sugerir', 'los datos apuntan a', 'podría indicar'. Voz pasiva refleja e impersonal en el discurso científico."
example: "nominalización → 'El análisis de los resultados revela...' (en lugar de 'Analizamos los resultados y vemos...'). hedging → 'Los datos parecen sugerir' (no 'Los datos demuestran'). estructura IMRD → Introducción (estado de la cuestión + objetivos), Metodología, Resultados, Discusión+Conclusiones. cita APA → (Autor, año, página). pasiva refleja → 'Se analizaron 50 muestras'. impersonal → 'Se procedió a...'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Características del Texto Académico
    description: Identifica las características y recursos del discurso académico y científico.
    exercises:
      - type: grammar
        question: "¿Por qué se usa la voz pasiva refleja e impersonal en el discurso científico? (por tradición sin razón/para que suene más difícil/para expresar impersonalidad y objetividad: no importa quién realizó la acción sino el proceso: 'Se analizaron 50 muestras')"
        correctAnswer: "para expresar impersonalidad y objetividad: no importa quién realizó la acción sino el proceso: 'Se analizaron 50 muestras'"
        rationale: "El discurso científico prefiere la impersonalidad → el investigador se borra del texto para crear efecto de objetividad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la nominalización en el discurso académico? (un tipo de cita/usar muchos nombres propios/transformar procesos verbales en sustantivos: 'la elaboración del informe' en vez de 'elaboramos el informe')"
        correctAnswer: "transformar procesos verbales en sustantivos: 'la elaboración del informe' en vez de 'elaboramos el informe'"
        rationale: "Nominalización: densifica el texto, lo hace más abstracto y formal → característica central del estilo académico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el hedging en el discurso científico? (citar fuentes de autoridad/exagerar los resultados/usar expresiones que atenúan la certeza de las afirmaciones: 'parece sugerir', 'los datos apuntan a', 'podría indicar')"
        correctAnswer: "usar expresiones que atenúan la certeza de las afirmaciones: 'parece sugerir', 'los datos apuntan a', 'podría indicar'"
        rationale: "Hedging: los científicos no afirman con certeza absoluta → 'los resultados parecen indicar' es más honesto que 'los resultados demuestran'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son las secciones del esquema IMRD? (Introducción, Metodología, Resultados, Discusión/Ideas, Marcas, Relaciones, Datos/Inicio, Marco, Redacción, Documentación)"
        correctAnswer: Introducción, Metodología, Resultados, Discusión
        rationale: "IMRD: estructura estándar del artículo científico en ciencias empíricas → universalmente reconocida en publicaciones académicas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función de la Introducción en un artículo IMRD? (describir la metodología/presentar los resultados/revisar el estado de la cuestión, identificar el vacío en la investigación y formular los objetivos del estudio)"
        correctAnswer: revisar el estado de la cuestión, identificar el vacío en la investigación y formular los objetivos del estudio
        rationale: "Introducción: establece el marco, cita trabajos previos, identifica el gap y anuncia los objetivos del estudio."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la cita directa de la indirecta o paráfrasis? (la paráfrasis no requiere citar/nada/cita directa: reproducción literal entre comillas con referencia exacta; paráfrasis: reformulación del contenido con las propias palabras + referencia)"
        correctAnswer: "cita directa: reproducción literal entre comillas con referencia exacta; paráfrasis: reformulación del contenido con las propias palabras + referencia"
        rationale: "Cita directa: 'las palabras exactas del autor' (Autor, año, p. 45). Paráfrasis: el contenido con tus palabras, pero siempre con referencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el formato de cita en texto en el estilo APA? (Nombre Apellido (año)/Apellido, año, número de página entre paréntesis: (García, 2020, p. 35)/número de referencia bibliográfica entre corchetes)"
        correctAnswer: "Apellido, año, número de página entre paréntesis: (García, 2020, p. 35)"
        rationale: "APA (American Psychological Association): cita autor-fecha en el texto + lista de referencias al final ordenada alfabéticamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el estado de la cuestión o revisión de literatura? (el resumen del texto/el apartado de la introducción que sintetiza las investigaciones previas relevantes y muestra el posicionamiento del autor en el debate académico/la metodología)"
        correctAnswer: el apartado de la introducción que sintetiza las investigaciones previas relevantes y muestra el posicionamiento del autor en el debate académico
        rationale: "Estado de la cuestión (State of the Art): los trabajos previos que fundamentan y justifican la investigación → muestra por qué el estudio es necesario."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la característica léxica central del discurso científico? (el lenguaje coloquial/el uso de tecnicismos monosémicos: términos con un único significado preciso en el campo disciplinar/la metáfora)"
        correctAnswer: "el uso de tecnicismos monosémicos: términos con un único significado preciso en el campo disciplinar"
        rationale: "Tecnicismo: 'mitocondria', 'fonema', 'hipotenusa' → cada campo crea léxico específico, inequívoco y estable."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el plagio académico? (citar demasiado/presentar como propia la obra intelectual de otro sin atribución, ya sea por copia literal, paráfrasis no citada o apropiación de ideas/usar fuentes secundarias)"
        correctAnswer: presentar como propia la obra intelectual de otro sin atribución, ya sea por copia literal, paráfrasis no citada o apropiación de ideas
        rationale: "Plagio: falta ética grave en la academia → el uso de ideas o texto de otros requiere siempre referencia, incluso en paráfrasis."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Discurso Académico Avanzado
    description: Aplica los conceptos del discurso académico al análisis y producción de textos.
    exercises:
      - type: grammar
        question: "¿Cuál es la diferencia entre la sección de Resultados y la Discusión en un artículo IMRD? (son lo mismo/Resultados: presenta los datos objetivos; Discusión: interpreta los datos, los contrasta con hipótesis previas y extrae conclusiones/Discusión describe la metodología)"
        correctAnswer: "Resultados: presenta los datos objetivos; Discusión: interpreta los datos, los contrasta con hipótesis previas y extrae conclusiones"
        rationale: "Resultados: lo que observé. Discusión: qué significa, qué implica y cómo se compara con lo que sabíamos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la intertextualidad académica? (la originalidad del texto/la red de referencias a otros textos que fundamentan el discurso académico: todo texto científico dialoga con los textos previos de su campo/la longitud del texto)"
        correctAnswer: "la red de referencias a otros textos que fundamentan el discurso académico: todo texto científico dialoga con los textos previos de su campo"
        rationale: "Intertextualidad académica: la credibilidad de un argumento científico se basa en parte en su relación con la literatura existente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la densidad informativa es alta en el discurso académico? (porque los académicos escriben mal/porque las nominalizaciones, la condensación y la presuposición de conocimiento especializado eliminan la redundancia/porque los textos son largos)"
        correctAnswer: porque las nominalizaciones, la condensación y la presuposición de conocimiento especializado eliminan la redundancia
        rationale: "El discurso académico asume un lector especializado → no explica lo básico → máxima información por unidad léxica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué función tiene el conector 'no obstante' en el discurso académico? (causal/adversativo-concesivo: introduce una limitación o contraargumento que el autor reconoce sin que invalide su tesis/consecutivo)"
        correctAnswer: "adversativo-concesivo: introduce una limitación o contraargumento que el autor reconoce sin que invalide su tesis"
        rationale: "'No obstante', 'sin embargo', 'ahora bien' → conectores adversativos de alta frecuencia en el discurso académico formal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los 'hedges' o marcadores de atenuación epistémica? (conectores lógicos/recursos lingüísticos que expresan incertidumbre o distancia respecto a lo afirmado: 'parece', 'cabe suponer', 'es posible que', 'podría interpretarse como'/adjetivos calificativos)"
        correctAnswer: "recursos lingüísticos que expresan incertidumbre o distancia respecto a lo afirmado: 'parece', 'cabe suponer', 'es posible que', 'podría interpretarse como'"
        rationale: "Hedges: marcan el compromiso epistémico del autor → el científico raramente afirma con certeza absoluta para ser responsable."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo es más adecuado usar el estilo Vancouver que el APA? (en humanidades/en ciencias biomédicas y de la salud: cita con número de referencia en el texto (superíndice o corchete) y lista numerada por orden de aparición/en ciencias sociales)"
        correctAnswer: "en ciencias biomédicas y de la salud: cita con número de referencia en el texto (superíndice o corchete) y lista numerada por orden de aparición"
        rationale: "Vancouver: estilo numérico usado en medicina y salud. APA: ciencias sociales. MLA: humanidades. Chicago: historia y humanidades."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el abstract o resumen de un artículo científico? (la introducción/un resumen estructurado (objetivo, método, resultados, conclusiones) de 150-250 palabras que permite decidir si leer el artículo completo/las conclusiones)"
        correctAnswer: un resumen estructurado (objetivo, método, resultados, conclusiones) de 150-250 palabras que permite decidir si leer el artículo completo
        rationale: "Abstract: herramienta de visibilidad académica → debe ser auto-contenido (legible sin el artículo) e informativo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la objetividad en el discurso científico y cómo se consigue lingüísticamente? (evitar adjetivos/evitar marcas de subjetividad del emisor usando impersonales, pasivas, nominalizaciones y hedging para que las afirmaciones parezcan neutras y verificables/escribir en primera persona)"
        correctAnswer: evitar marcas de subjetividad del emisor usando impersonales, pasivas, nominalizaciones y hedging para que las afirmaciones parezcan neutras y verificables
        rationale: "Objetividad discursiva: no es ausencia de perspectiva, sino construcción textual que la borra → convención del género científico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función de las palabras clave (keywords) en un artículo científico? (decorativa/facilitar la indexación en bases de datos y la recuperación del artículo en búsquedas bibliográficas/indicar el nivel de dificultad)"
        correctAnswer: facilitar la indexación en bases de datos y la recuperación del artículo en búsquedas bibliográficas
        rationale: "Keywords: términos seleccionados por el autor para que los motores de búsqueda (Scopus, Web of Science) indexen el artículo correctamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue el artículo de investigación del artículo de revisión (review article)? (nada/artículo de investigación: presenta resultados originales; artículo de revisión: sintetiza y evalúa críticamente la investigación existente sobre un tema/el artículo de revisión es más corto)"
        correctAnswer: "artículo de investigación: presenta resultados originales; artículo de revisión: sintetiza y evalúa críticamente la investigación existente sobre un tema"
        rationale: "Review article: no produce datos nuevos, sino que evalúa y sintetiza la literatura → útil para conocer el estado del campo."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
