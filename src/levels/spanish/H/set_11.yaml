title: Gramática - Modalidad y Modo Verbal Avanzado
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Modalidad lingüística: epistémica (certeza/posibilidad/necesidad), deóntica (obligación/permiso/prohibición), dinámica. Modo indicativo vs. subjuntivo avanzado: alternancia modal en subordinadas (verbos de percepción: indicativo/subjuntivo según la perspectiva), subordinadas sustantivas, adverbiales modales, relativas. Condicional de cortesía y evidencialidad. Perífrasis modales: deber de/deber + inf., poder + inf., tener que + inf., haber de + inf. Futuro de probabilidad. Condicional epistémico."
example: "modalidad epistémica → 'Debe de estar en casa' (probabilidad). deóntica → 'Debes llegar a tiempo' (obligación). dinámica → 'Puede levantar 100 kg' (capacidad). subjuntivo de duda → 'No creo que venga'. indicativo de certeza → 'Creo que viene'. futuro de probabilidad → 'Tendrá unos 30 años'. condicional epistémico → 'Serían las 3 cuando llamó'. perífrasis de obligación → 'Hay que estudiar'. evidencial → 'Al parecer, ha dimitido'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Modalidad y Alternancia Modal
    description: Identifica el tipo de modalidad y el modo verbal correcto.
    exercises:
      - type: grammar
        question: "¿Qué tipo de modalidad expresa 'Debe de haber llegado ya'? (deóntica/epistémica de probabilidad: 'deber de + inf.' expresa suposición, no obligación/dinámica)"
        correctAnswer: "epistémica de probabilidad: 'deber de + inf.' expresa suposición, no obligación"
        rationale: "'Deber de + inf.' = probabilidad epistémica. 'Deber + inf.' (sin 'de') = obligación deóntica. Distinción normativa en el español estándar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué modo va en 'Creo que [venir] mañana'? (subjuntivo: 'venga'/indicativo: 'viene', porque 'creer' en forma afirmativa introduce certeza/depende del contexto)"
        correctAnswer: "indicativo: 'viene', porque 'creer' en forma afirmativa introduce certeza"
        rationale: "'Creo que viene' (indicativo: certeza). 'No creo que venga' (subjuntivo: duda). La polaridad del verbo principal determina el modo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué significa 'Serían las 3 cuando llamó'? (que son las 3/condicional epistémico: el hablante hace una estimación aproximada del pasado/que la llamada fue puntual a las 3)"
        correctAnswer: "condicional epistémico: el hablante hace una estimación aproximada del pasado"
        rationale: "Condicional de probabilidad en el pasado: 'serían las 3' = aproximadamente las 3. Equivale al futuro de probabilidad en el presente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se usa el subjuntivo en una oración de relativo? (siempre/cuando el antecedente es desconocido, inexistente o inespecífico: 'Busco a alguien que [hable] ruso' (no sé si existe) vs. 'Conozco a alguien que habla ruso' (existe, indicativo)/con cualquier relativo)"
        correctAnswer: "cuando el antecedente es desconocido, inexistente o inespecífico: 'Busco a alguien que [hable] ruso' (no sé si existe) vs. 'Conozco a alguien que habla ruso' (existe, indicativo)"
        rationale: "Subjuntivo en relativas: antecedente no específico/no existente → 'busco [x] que hable'; indicativo si el referente es conocido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia 'cuando llegues' de 'cuando llegas'? (nada/subjuntivo en adverbiales de tiempo futuras: 'cuando llegues' (evento futuro incierto); indicativo en habituales: 'cuando llegas siempre...'/el subjuntivo es más formal)"
        correctAnswer: "subjuntivo en adverbiales de tiempo futuras: 'cuando llegues' (evento futuro incierto); indicativo en habituales: 'cuando llegas siempre...'"
        rationale: "'Cuando + subjuntivo': acción futura o no realizada → 'cuando llegues, llámame'. 'Cuando + ind.': hábito o pasado → 'cuando llegaba, se lavaba'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa 'Tendrá unos 40 años'? (certeza sobre la edad/futuro de probabilidad o conjetura en el presente: estimación aproximada sin certeza/mandato)"
        correctAnswer: "futuro de probabilidad o conjetura en el presente: estimación aproximada sin certeza"
        rationale: "Futuro epistémico: 'tendrá' = 'supongo que tiene'. Parafraseable por 'debe de tener' o 'probablemente tiene'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué modo se usa tras 'aunque' en 'Aunque [llover], iré'? (siempre indicativo/subjuntivo si se refiere a un evento hipotético o futuro ('aunque llueva'); indicativo si el hecho es real ('aunque llueve, iré igual')/siempre subjuntivo)"
        correctAnswer: subjuntivo si se refiere a un evento hipotético o futuro ('aunque llueva'); indicativo si el hecho es real ('aunque llueve, iré igual')
        rationale: "Aunque + indicativo: concesiva real. Aunque + subjuntivo: concesiva hipotética (no sabemos si va a llover)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la evidencialidad en el lenguaje? (la modalidad deóntica/la marcación lingüística de la fuente de la información: si el hablante sabe algo por experiencia directa, por referencia ('al parecer') o por inferencia ('debe de')/la entonación)"
        correctAnswer: "la marcación lingüística de la fuente de la información: si el hablante sabe algo por experiencia directa, por referencia ('al parecer') o por inferencia ('debe de')"
        rationale: "Evidencialidad: algunas lenguas tienen morfemas gramaticales para indicar la fuente del conocimiento; el español lo expresa léxicamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué modalidad expresa 'Puedes entrar ahora'? (epistémica/deóntica de permiso: el hablante autoriza al oyente a realizar la acción/dinámica de capacidad)"
        correctAnswer: "deóntica de permiso: el hablante autoriza al oyente a realizar la acción"
        rationale: "'Poder' deóntico = permiso ('te permito que entres'). Diferente de 'poder' dinámico = capacidad ('es capaz de entrar')."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre 'es posible que venga' y 'es posible que viene'? (ninguna/solo la primera es correcta: tras 'es posible que' el subjuntivo es obligatorio porque introduce posibilidad no factual/la segunda es más culta)"
        correctAnswer: "solo la primera es correcta: tras 'es posible que' el subjuntivo es obligatorio porque introduce posibilidad no factual"
        rationale: "Expresiones de posibilidad/probabilidad + 'que' rigen subjuntivo: 'es posible', 'quizás', 'tal vez', 'ojalá' → siempre subjuntivo."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Perífrasis Modales y Análisis Avanzado
    description: Analiza las perífrasis modales y la alternancia indicativo/subjuntivo.
    exercises:
      - type: grammar
        question: "¿Cuál es la diferencia entre 'hay que + inf.' y 'tener que + inf.'? (nada/hay que: impersonal, no hay sujeto (obligación genérica); tener que: sujeto expreso, obligación personal/hay que es más formal)"
        correctAnswer: "hay que: impersonal, no hay sujeto (obligación genérica); tener que: sujeto expreso, obligación personal"
        rationale: "'Hay que estudiar' (todos debemos). 'Tengo que estudiar' (yo en concreto). Diferencia de sujeto y alcance de la obligación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué modo selecciona 'esperar' según el significado? (siempre subjuntivo/esperar = 'desear': subjuntivo ('espero que venga'); esperar = 'suponer/creer': indicativo ('espero que viene hoy')/siempre indicativo)"
        correctAnswer: "esperar = 'desear': subjuntivo ('espero que venga'); esperar = 'suponer/creer': indicativo ('espero que viene hoy')"
        rationale: "Verbos modales: el significado determina el modo → esperar (deseo) → subj.; esperar (creer/suponer) → ind."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa la perífrasis 'haber de + inf.'? (probabilidad/obligación con matiz de destino o mandato literario/normativo: 'Has de saber que...'/capacidad)"
        correctAnswer: "obligación con matiz de destino o mandato literario/normativo: 'Has de saber que...'"
        rationale: "'Haber de + inf.': obligación o mandato de tono formal o literario → 'Has de respetar las normas', 'Ha de llegar algún día'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el modo correcto en 'Dondequiera que [ir], te seguiré'? (indicativo/subjuntivo: las conjunciones de relativo libre con -quiera siempre rigen subjuntivo/imperativo)"
        correctAnswer: "subjuntivo: las conjunciones de relativo libre con -quiera siempre rigen subjuntivo"
        rationale: "Relativas libres con -quiera (dondequiera, cuandoquiera, quienquiera, comoquiera) → siempre subjuntivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede 'quizás' ir con indicativo? (nunca/sí: quizás + indicativo implica mayor certeza; quizás + subjuntivo implica mayor duda: ambas son correctas/solo en registro coloquial)"
        correctAnswer: "sí: quizás + indicativo implica mayor certeza; quizás + subjuntivo implica mayor duda: ambas son correctas"
        rationale: "Quizás/tal vez: admiten indicativo (mayor probabilidad) o subjuntivo (mayor duda) → 'Quizás viene' vs. 'Quizás venga'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué modo rige 'como si'? (indicativo/siempre subjuntivo imperfecto o pluscuamperfecto: 'Actúa como si fuera el jefe'/futuro de subjuntivo)"
        correctAnswer: "siempre subjuntivo imperfecto o pluscuamperfecto: 'Actúa como si fuera el jefe'"
        rationale: "'Como si' + subjuntivo (SIEMPRE): introduce una comparación hipotética irreal → 'como si hubiera comido ya'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia 'antes de que + subjuntivo' de 'antes de + infinitivo'? (nada/cuando los sujetos son distintos se usa 'que + subjuntivo'; cuando son el mismo se usa el infinitivo/el infinitivo es siempre más formal)"
        correctAnswer: cuando los sujetos son distintos se usa 'que + subjuntivo'; cuando son el mismo se usa el infinitivo
        rationale: "'Antes de que llegues' (sujetos distintos: yo/tú). 'Antes de llegar' (mismo sujeto: yo). Regla general del español."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de modalidad expresa 'Puede que llueva mañana'? (deóntica de permiso/epistémica de posibilidad: el hablante no sabe si lloverá, solo lo considera posible/dinámica)"
        correctAnswer: "epistémica de posibilidad: el hablante no sabe si lloverá, solo lo considera posible"
        rationale: "'Puede que + subjuntivo' = modalidad epistémica de posibilidad → incertidumbre sobre la ocurrencia del evento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'Ojalá que venga' usa subjuntivo pero no 'Sé que viene'? (por el origen árabe de ojalá/ojalá expresa deseo (no factual → subjuntivo); saber en afirmativo expresa certeza factual (indicativo)/por razones históricas sin correlato actual)"
        correctAnswer: ojalá expresa deseo (no factual → subjuntivo); saber en afirmativo expresa certeza factual (indicativo)
        rationale: "El modo refleja la actitud del hablante hacia el evento: certeza → ind.; duda/deseo/mandato/posibilidad → subj."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el subjuntivo pasado en 'Ojalá hubiera venido'? (pluscuamperfecto de indicativo/pluscuamperfecto de subjuntivo: expresa deseo irreal sobre el pasado (no vino y lo lamento)/imperfecto de subjuntivo)"
        correctAnswer: "pluscuamperfecto de subjuntivo: expresa deseo irreal sobre el pasado (no vino y lo lamento)"
        rationale: "Ojalá + pluscuamperfecto subj.: el deseo o hipótesis es irreal en el pasado → contrafactual: 'ojalá hubiera estudiad más'."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
