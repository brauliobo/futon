pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El cambio climático se refiere a las alteraciones a largo plazo de la temperatura y los patrones climáticos globales. Aunque históricamente el clima ha variado de forma natural (ciclos de Milankovitch, actividad solar, erupciones volcánicas), desde el siglo XIX las actividades humanas, especialmente la quema de combustibles fósiles (carbón, petróleo, gas natural), se han convertido en el motor principal del cambio observado. El efecto invernadero es el proceso por el que ciertos gases atmosféricos (CO₂, metano, vapor de agua, óxido nitroso) absorben y reemiten la radiación infrarroja terrestre, manteniendo la temperatura del planeta. Sin él, la temperatura media sería de -18°C en lugar de los +15°C actuales. El exceso de CO₂ antropogénico intensifica este efecto. El Panel Intergubernamental sobre Cambio Climático (IPCC) ha concluido que el calentamiento global es 'inequívoco' y que desde 1950 los cambios observados no tienen precedente en milenios. Las consecuencias incluyen: deshielo de glaciares y casquetes polares, aumento del nivel del mar, eventos meteorológicos extremos más frecuentes e intensos, acidificación de los océanos (absorción de CO₂) y desplazamiento de especies. Las estrategias de respuesta se dividen en mitigación (reducir las emisiones: energías renovables, eficiencia energética, captura de carbono) y adaptación (ajustarse a los impactos ya inevitables: diques, variedades agrícolas resistentes)."
    exercises:
