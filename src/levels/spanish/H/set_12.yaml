        correctAnswer: que el calentamiento global es 'inequívoco' y los cambios no tienen precedente en milenios
        rationale: "El texto: 'el IPCC ha concluido que el calentamiento global es inequívoco y que desde 1950 los cambios no tienen precedente en milenios'."
