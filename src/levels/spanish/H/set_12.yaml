        correctAnswer: las actividades humanas, especialmente la quema de combustibles fósiles
        rationale: "El texto: 'las actividades humanas, especialmente la quema de combustibles fósiles, se han convertido en el motor principal del cambio observado'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
