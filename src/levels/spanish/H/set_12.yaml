authorNotes: "Texto expositivo científico sobre el cambio climático: causas, mecanismos, evidencias, consecuencias y posibles respuestas."
example: "sol → radiación → superficie → calor → GEI (CO₂/CH₄/N₂O) → efecto invernadero amplificado → IPCC: +1,1°C desde 1850 → impactos: hielo/nivel mar/eventos extremos/migraciones → mitigación: renovables/electrificación/reforestación → adaptación: diques/cultivos resistentes."
