title: Gramática - Historia de la Literatura Española - Siglos XIX y XX
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Literatura española s. XIX-XX: Romanticismo (Larra, Espronceda, Bécquer, Zorrilla), Realismo y Naturalismo (Galdós, Clarín, Pardo Bazán), Generación del 98 (Unamuno, Baroja, Azorín, Machado, Valle-Inclán), Novecentismo/Generación del 14 (Ortega y Gasset, Miró, Pérez de Ayala), posguerra (tremendismo, existencialismo, realismo social), novela experimental de los 60 (Martín Santos, Benet)."
example: "Romanticismo → evasión, rebeldía, paisaje como proyección del yo. Bécquer → Rimas y Leyendas. Realismo → verosimilitud, denuncia social, documentación. Galdós → Episodios Nacionales, Fortunata y Jacinta. Generación del 98 → crisis del 98, regeneracionismo, preocupación existencial. Unamuno → Niebla (metaficción), 'nivola'. Tremendismo → Cela, La familia de Pascual Duarte. realismo social → Aldecoa, Fernández Santos."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Romanticismo, Realismo y Generación del 98
    description: Identifica los movimientos literarios españoles del siglo XIX y principios del XX.
    exercises:
      - type: grammar
        question: "¿Qué caracteriza la poesía de Gustavo Adolfo Bécquer frente al Romanticismo exaltado de Espronceda? (que es más épica/que es íntima, contenida y simbólica: anticipa el simbolismo y la poesía del siglo XX/que es más narrativa)"
        correctAnswer: "que es íntima, contenida y simbólica: anticipa el simbolismo y la poesía del siglo XX"
        rationale: "Bécquer: Romanticismo tardío íntimo → Rimas: brevedad, sugerencia, musicalidad → influencia en Modernismo y Generación del 27."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el Realismo del Naturalismo en la literatura española? (son lo mismo/el Naturalismo (influencia de Zola) incorpora el determinismo biológico y social: los personajes están determinados por la herencia y el medio/el Realismo es más crítico)"
        correctAnswer: "el Naturalismo (influencia de Zola) incorpora el determinismo biológico y social: los personajes están determinados por la herencia y el medio"
        rationale: "Naturalismo: Emilia Pardo Bazán ('Los pazos de Ulloa') introduce el determinismo científico en la novela española."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la obra cumbre del Realismo español de Galdós? (Misericordia/Fortunata y Jacinta: fresco social del Madrid del siglo XIX con dos protagonistas femeninas/La Regenta)"
        correctAnswer: "Fortunata y Jacinta: fresco social del Madrid del siglo XIX con dos protagonistas femeninas"
        rationale: "Fortunata y Jacinta (1886-87): la novela más ambiciosa de Galdós → dos mujeres y la sociedad madrileña del XIX."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la novela más importante de Leopoldo Alas 'Clarín'? (Pepita Jiménez/La Regenta: análisis psicológico de Ana Ozores en la ciudad de Vetusta (Oviedo), crítica de la hipocresía provincial/La familia de Pascual Duarte)"
        correctAnswer: "La Regenta: análisis psicológico de Ana Ozores en la ciudad de Vetusta (Oviedo), crítica de la hipocresía provincial"
        rationale: "'La Regenta' (1884-85): obra cumbre del Naturalismo español → análisis psicológico, crítica anticlerical, protagonista femenina."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál fue el acontecimiento histórico que dio nombre y marcó a la Generación del 98? (la I Guerra Mundial/la pérdida de las últimas colonias españolas (Cuba, Puerto Rico y Filipinas) en 1898/la Restauración borbónica)"
        correctAnswer: la pérdida de las últimas colonias españolas (Cuba, Puerto Rico y Filipinas) en 1898
        rationale: "El 'Desastre del 98': crisis política y moral que generó el regeneracionismo y la reflexión sobre el 'ser de España'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una 'nivola' según Unamuno? (una novela histórica/el término que Unamuno acuñó para sus novelas de ideas: diálogo filosófico, mínima descripción, conflicto existencial, como en 'Niebla'/una novela picaresca moderna)"
        correctAnswer: "el término que Unamuno acuñó para sus novelas de ideas: diálogo filosófico, mínima descripción, conflicto existencial, como en 'Niebla'"
        rationale: "Unamuno: 'Niebla' (1914) → el protagonista Augusto Pérez se rebela contra su creador. Metaficción avant la lettre."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el tremendismo en la novela española de posguerra? (el realismo social de los 60/corriente que presenta una visión cruda, violenta y descarnada de la realidad: Cela, 'La familia de Pascual Duarte' (1942)/la novela experimental)"
        correctAnswer: "corriente que presenta una visión cruda, violenta y descarnada de la realidad: Cela, 'La familia de Pascual Duarte' (1942)"
        rationale: "Tremendismo: protagonistas marginales, violencia, desesperanza → primera novela española importante de posguerra."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué propuso Ortega y Gasset en 'La deshumanización del arte' (1925)? (el realismo fotográfico/que el arte moderno debía alejarse de lo humano, lo sentimental y lo anecdótico, buscando la pura forma estética/el naturalismo extremo)"
        correctAnswer: que el arte moderno debía alejarse de lo humano, lo sentimental y lo anecdótico, buscando la pura forma estética
        rationale: "Ortega: la vanguardia es 'deshumanizada' → rechaza la emoción y la anécdota; privilegia el juego formal y la metáfora."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la innovación formal de 'Tiempo de silencio' (1962) de Luis Martín Santos? (el uso del narrador omnisciente/el monólogo interior, el estilo indirecto libre barroco y la parodia del discurso oficial franquista/el narrador testigo en primera persona)"
        correctAnswer: el monólogo interior, el estilo indirecto libre barroco y la parodia del discurso oficial franquista
        rationale: "'Tiempo de silencio': renovación de la novela española → técnicas del nouveau roman, Joyce y Faulkner, crítica velada del franquismo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué caracteriza el estilo de Azorín dentro de la Generación del 98? (grandilocuencia y acción/prosa impresionista, frases breves, análisis del paisaje castellano como símbolo del alma española/teatro poético)"
        correctAnswer: prosa impresionista, frases breves, análisis del paisaje castellano como símbolo del alma española
        rationale: "Azorín: prosa miniaturista, captación del instante → el paisaje de Castilla como espejo del espíritu de España."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Novela y Teatro - Siglo XX
    description: Profundiza en la literatura española del siglo XX.
    exercises:
      - type: grammar
        question: "¿Cuál es el movimiento teatral creado por Valle-Inclán? (el teatro costumbrista/el esperpento: deformación grotesca de la realidad para criticar la sociedad española, como en 'Luces de bohemia'/el teatro realista)"
        correctAnswer: "el esperpento: deformación grotesca de la realidad para criticar la sociedad española, como en 'Luces de bohemia'"
        rationale: "Esperpento: Valle-Inclán deforma la realidad como en un espejo cóncavo → Max Estrella en 'Luces de bohemia' describe el esperpento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el realismo social en la novela española de los años 50? (tremendismo/novela que retrata la realidad social del franquismo con técnica objetivista (el narrador no interviene): 'El Jarama' de Sánchez Ferlosio/novela existencialista)"
        correctAnswer: "novela que retrata la realidad social del franquismo con técnica objetivista (el narrador no interviene): 'El Jarama' de Sánchez Ferlosio"
        rationale: "Realismo social (objetivismo): la novela como testimonio social → narrador ausente, diálogo transcrito, denuncia implícita."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue la lírica de Antonio Machado de la de Juan Ramón Jiménez? (son idénticas/Machado: poesía filosófica y existencial, paisaje castellano, temporalidad; JRJ: poesía pura, búsqueda de la belleza esencial/Machado usa el soneto clásico exclusivamente)"
        correctAnswer: "Machado: poesía filosófica y existencial, paisaje castellano, temporalidad; JRJ: poesía pura, búsqueda de la belleza esencial"
        rationale: "Machadismo: 'Campos de Castilla', tiempo, soledad. JRJ: 'Eternidades', 'Espacio' → pureza estética, sucesivas etapas hacia la 'obra desnuda'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál fue el gran proyecto narrativo de Galdós sobre la historia española? (La Regenta/Los Episodios Nacionales: 46 novelas que reconstruyen la historia de España desde Trafalgar hasta la Restauración/El escándalo)"
        correctAnswer: "Los Episodios Nacionales: 46 novelas que reconstruyen la historia de España desde Trafalgar hasta la Restauración"
        rationale: "Episodios Nacionales: la novela histórica como fresco de la historia de España → mezcla ficción y hechos reales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la postura de Unamuno en el conflicto entre fe y razón? (acepta la razón plenamente/vive en tensión irresoluble entre la fe que desea y la razón que la niega: 'el sentimiento trágico de la vida'/rechaza la fe completamente)"
        correctAnswer: "vive en tensión irresoluble entre la fe que desea y la razón que la niega: 'el sentimiento trágico de la vida'"
        rationale: "Unamuno: 'Del sentimiento trágico de la vida' → la tensión entre querer creer y no poder hacerlo racionalmente es la condición humana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué representa el personaje de Pascual Duarte (Cela)? (el héroe romántico/el antihéroe tremendo: hombre violento del campo extremeño que narra sus crímenes sin arrepentimiento real/el intelectual regeneracionista)"
        correctAnswer: "el antihéroe tremendo: hombre violento del campo extremeño que narra sus crímenes sin arrepentimiento real"
        rationale: "Pascual Duarte: tremendismo → violencia, fatalismo, mundo rural miserable → inauguró la novela española de posguerra."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿En qué se diferencia la novela generacional de Baroja de la de Galdós? (no hay diferencia/Baroja: estructura abierta, narrador subjetivo, personaje inadaptado ('pícaro moderno'), estilo directo y ágil frente a la construcción cerrada y documentada de Galdós/Baroja es más realista)"
        correctAnswer: "Baroja: estructura abierta, narrador subjetivo, personaje inadaptado ('pícaro moderno'), estilo directo y ágil frente a la construcción cerrada y documentada de Galdós"
        rationale: "Baroja: 'El árbol de la ciencia', 'La busca' → trilogías, protagonista inadaptado, técnica impresionista vs. edificio narrativo galdosiano."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'objetivismo' o 'behaviorismo' narrativo en la novela española de los 50? (el narrador omnisciente que lo sabe todo/técnica en que el narrador solo registra lo observable: diálogos y acciones, sin entrar en la psicología de los personajes/el realismo mágico)"
        correctAnswer: "técnica en que el narrador solo registra lo observable: diálogos y acciones, sin entrar en la psicología de los personajes"
        rationale: "Behaviorismo: influencia del nouveau roman francés → narrador cámara (registra lo externo sin comentar): 'El Jarama' (Sánchez Ferlosio)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué papel jugó el exilio en la literatura española del siglo XX? (fue irrelevante/produjo una literatura de la memoria y el desarraigo: Alberti, León Felipe, María Zambrano, Sender escribieron desde el exilio/solo afectó a poetas)"
        correctAnswer: "produjo una literatura de la memoria y el desarraigo: Alberti, León Felipe, María Zambrano, Sender escribieron desde el exilio"
        rationale: "El exilio republicano (1939): una generación entera de intelectuales en México, Argentina y Francia → literatura del destierro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la primera novela española que aplica el flujo de conciencia (stream of consciousness)? (La Regenta/Tiempo de silencio (1962) de Martín Santos/Fortunata y Jacinta)"
        correctAnswer: Tiempo de silencio (1962) de Martín Santos
        rationale: "'Tiempo de silencio': primera novela española en usar el monólogo interior y el flujo de conciencia al modo de Joyce → renovación formal decisiva."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
