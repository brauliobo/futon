authorNotes: "Texto expositivo sobre ética filosófica: utilitarismo, deontología kantiana, ética de la virtud, contractualismo y ética aplicada."
example: "dilema moral → utilitarismo (Mill/Bentham): maximiza bienestar total → deontología (Kant): actúa solo según máximas universalizables → virtud (Aristóteles): ¿qué haría una persona virtuosa? → aplicado: dilema del tranvía → utilitarismo: desvía; deontología: no uses como medio; virtud: coraje/prudencia."
