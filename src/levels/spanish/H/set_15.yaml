pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La ética filosófica estudia qué es correcto hacer y cómo debemos vivir. Las tres grandes tradiciones son: el utilitarismo, la deontología y la ética de la virtud. El utilitarismo, fundado por Jeremy Bentham y desarrollado por John Stuart Mill, sostiene que la acción correcta es la que produce el mayor bien para el mayor número: el criterio es el resultado. Peter Singer extendió el principio al bienestar animal. La ética deontológica de Immanuel Kant se basa en el deber: una acción es correcta si sigue una máxima que pudiera convertirse en ley universal (imperativo categórico). El resultado no importa: mentir siempre está mal, incluso para salvar una vida. La ética de la virtud, heredera de Aristóteles, se centra en el carácter del agente: la pregunta no es '¿qué debo hacer?' sino '¿qué tipo de persona debo ser?'. La virtud es un hábito adquirido que permite la eudaimonía (florecimiento humano). El contractualismo (Rawls) fundamenta la justicia en principios que personas racionales elegirían desde detrás de un 'velo de ignorancia', sin saber su posición social. La ética aplicada lleva estos principios a dilemas concretos: la eutanasia, el aborto, la guerra justa, la bioética, los derechos de los animales. El dilema del tranvía (trolley problem) ilustra el conflicto entre el utilitarismo (desviar el tranvía: salvar a 5 a costa de 1) y la deontología (nunca usar a una persona como medio)."
    exercises:
