        correctAnswer: la máxima que puede convertirse en ley universal: actúa solo según aquella máxima por la que puedas querer que se convierta en ley universal
        rationale: "El texto: 'una acción es correcta si sigue una máxima que pudiera convertirse en ley universal (imperativo categórico)'."
        difficulty: 5
