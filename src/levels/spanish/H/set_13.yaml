title: 📖 Gramática - Literatura Hispanoamericana del Siglo XX
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Literatura hispanoamericana s. XX: Vanguardia latinoamericana (Huidobro, Vallejo, Neruda), realismo social (Rulfo, Arguedas), realismo mágico (García Márquez, Carpentier, Asturias), el Boom latinoamericano (Cortázar, Vargas Llosa, Fuentes, García Márquez), literatura fantástica (Borges), nueva narrativa (Isabel Allende, Laura Esquivel). Características del realismo mágico. El papel de la mitología indígena y africana."
example: "realismo mágico → 'Cien años de soledad': lo maravilloso presentado como natural dentro de un contexto realista. Borges → laberintos, infinito, metaficción: 'El jardín de senderos que se bifurcan'. Boom → innovación formal: tiempo no lineal, perspectivas múltiples, metaficción. Neruda → poesía comprometida y sensorial: Veinte poemas de amor. Vallejo → vanguardia trágica y social: Trilce. Rulfo → voces de los muertos, espacio mítico: Pedro Páramo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Vanguardia y Realismo Mágico
    description: Identifica los movimientos de la literatura hispanoamericana del siglo XX.
    exercises:
      - type: grammar
        question: "¿Qué caracteriza el realismo mágico como movimiento literario? (que todo es irreal/la integración de elementos sobrenaturales o maravillosos en un contexto realista, presentados sin asombro ni explicación/solo se usa en la poesía)"
        correctAnswer: la integración de elementos sobrenaturales o maravillosos en un contexto realista, presentados sin asombro ni explicación
        rationale: "Realismo mágico: lo extraordinario convive con lo cotidiano → Macondo (García Márquez), el realismo lo real-maravilloso de Carpentier."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son las cuatro figuras centrales del Boom latinoamericano? (Neruda, Vallejo, Lorca, Alberti/García Márquez, Cortázar, Vargas Llosa y Carlos Fuentes/Borges, Rulfo, Carpentier, Asturias)"
        correctAnswer: García Márquez, Cortázar, Vargas Llosa y Carlos Fuentes
        rationale: "El Boom (años 60-70): García Márquez (Colombia), Cortázar (Argentina), Vargas Llosa (Perú), Fuentes (México) → éxito mundial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la técnica narrativa característica de Borges? (realismo social/metaficción, laberintos conceptuales, el infinito y la identidad: 'El jardín de senderos que se bifurcan', 'Ficciones'/escritura automática surrealista)"
        correctAnswer: "metaficción, laberintos conceptuales, el infinito y la identidad: 'El jardín de senderos que se bifurcan', 'Ficciones'"
        rationale: "Borges: los relatos son juegos filosóficos → el texto reflexiona sobre sí mismo, sobre la ficción y el conocimiento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué innovación narrativa introduce 'Pedro Páramo' de Juan Rulfo? (el narrador omnisciente clásico/los narradores muertos que hablan desde el pasado, la desintegración del tiempo lineal y el espacio mítico de Comala/el realismo fotográfico)"
        correctAnswer: los narradores muertos que hablan desde el pasado, la desintegración del tiempo lineal y el espacio mítico de Comala
        rationale: "'Pedro Páramo' (1955): los muertos hablan, el tiempo se fragmenta → influyó decisivamente en el Boom."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la contribución de Pablo Neruda a la poesía hispanoamericana? (la poesía hermética/la síntesis de poesía sensorial, amorosa y comprometida: de 'Veinte poemas de amor' al 'Canto general'/la poesía conceptista)"
        correctAnswer: "la síntesis de poesía sensorial, amorosa y comprometida: de 'Veinte poemas de amor' al 'Canto general'"
        rationale: "Neruda: tres etapas → amor/sensualidad (Veinte poemas), hermetismo vanguardista (Residencia en la tierra), poesía épica/política (Canto general)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia 'Cien años de soledad' (García Márquez) de una novela realista convencional? (usa un narrador omnisciente/integra lo sobrenatural como natural (realismo mágico) y narra el ciclo mítico de una familia/es más breve)"
        correctAnswer: integra lo sobrenatural como natural (realismo mágico) y narra el ciclo mítico de una familia
        rationale: "'Cien años de soledad' (1967): fundación de Macondo, ascensión de Remedios la Bella → lo fantástico presentado sin sorpresa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'real maravilloso' de Alejo Carpentier? (el surrealismo europeo aplicado a América/la tesis de que lo maravilloso es la esencia de la realidad americana: su historia, sus mitos y su mezcla de culturas son naturalmente prodigiosos/un tipo de realismo fotográfico)"
        correctAnswer: "la tesis de que lo maravilloso es la esencia de la realidad americana: su historia, sus mitos y su mezcla de culturas son naturalmente prodigiosos"
        rationale: "Carpentier distingue lo real-maravilloso americano del surrealismo europeo: América es maravillosa por sí misma, no por artificio estético."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la técnica de los 'vasos comunicantes' en la narrativa de Vargas Llosa? (la intertextualidad/la yuxtaposición de historias distintas que se entrelazan y se iluminan mutuamente dentro de la misma novela/la narración en segunda persona)"
        correctAnswer: la yuxtaposición de historias distintas que se entrelazan y se iluminan mutuamente dentro de la misma novela
        rationale: "Vargas Llosa: vasos comunicantes → distintas tramas o tiempos se presentan alternados sin separación gráfica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué representa Macondo en la obra de García Márquez? (una ciudad real de Colombia/el espacio mítico fundacional que condensa la historia de América Latina: nacimiento, apogeo y destrucción/una metrópolis latinoamericana)"
        correctAnswer: "el espacio mítico fundacional que condensa la historia de América Latina: nacimiento, apogeo y destrucción"
        rationale: "Macondo: topos literario que encarna la fundación, el esplendor y la tragedia de América Latina como comunidad imaginaria."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué elementos caracterizan la poesía de César Vallejo en 'Trilce'? (la métrica clásica y el léxico modernista/la innovación radical del lenguaje: neologismos, sintaxis rota, angustia existencial y social/el esteticismo parnasiano)"
        correctAnswer: "la innovación radical del lenguaje: neologismos, sintaxis rota, angustia existencial y social"
        rationale: "'Trilce' (1922): Vallejo rompe la sintaxis, inventa palabras → vanguardia más radical y auténtica de la poesía hispanoamericana."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: El Boom y la Nueva Narrativa
    description: Profundiza en la narrativa hispanoamericana de la segunda mitad del siglo XX.
    exercises:
      - type: grammar
        question: "¿Qué innovación formal introduce 'Rayuela' (1963) de Julio Cortázar? (la narración lineal clásica/la posibilidad de leer los capítulos en distintos órdenes: el lector elige su recorrido/el uso del narrador en tercera persona)"
        correctAnswer: "la posibilidad de leer los capítulos en distintos órdenes: el lector elige su recorrido"
        rationale: "'Rayuela': novela lúdica y experimental → dos lecturas posibles según el tablero de instrucciones. El lector co-crea la novela."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el tema central de la literatura de José María Arguedas? (la vida urbana/el conflicto entre la cultura quechua andina y la cultura occidental: bilingüismo, identidad y opresión en el Perú/la mitología azteca)"
        correctAnswer: "el conflicto entre la cultura quechua andina y la cultura occidental: bilingüismo, identidad y opresión en el Perú"
        rationale: "Arguedas: escritor bilingüe quechua-español → 'Los ríos profundos': el conflicto cultural como drama personal y colectivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la 'novela total' que persiguió el Boom? (una novela muy larga/una obra que pretende abarcar la totalidad de la realidad: histórica, mítica, social, psicológica, experimental/una novela con múltiples géneros)"
        correctAnswer: "una obra que pretende abarcar la totalidad de la realidad: histórica, mítica, social, psicológica, experimental"
        rationale: "El Boom busca la 'novela total' (término de Vargas Llosa): 'Conversación en La Catedral', 'Terra Nostra', 'El otoño del patriarca'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué caracteriza el cuento fantástico de Borges frente al realismo mágico? (son lo mismo/Borges: fantástico filosófico (el cuento es un experimento mental); realismo mágico: integración de lo sobrenatural en la realidad cotidiana/Borges usa más personajes indígenas)"
        correctAnswer: "Borges: fantástico filosófico (el cuento es un experimento mental); realismo mágico: integración de lo sobrenatural en la realidad cotidiana"
        rationale: "Borges: lo fantástico como juego de ideas (el doble, el laberinto, el infinito). García Márquez: lo maravilloso como realidad americana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el aporte de Isabel Allende a la narrativa hispanoamericana? (la poesía neorural/combinar el realismo mágico con la saga familiar y la perspectiva femenina: 'La casa de los espíritus'/la novela experimental masculina)"
        correctAnswer: "combinar el realismo mágico con la saga familiar y la perspectiva femenina: 'La casa de los espíritus'"
        rationale: "Allende: 'La casa de los espíritus' (1982) → saga familiar chilena, voces femeninas, historia política, herencia macondiana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se considera que comienza el Boom latinoamericano? (1930/alrededor de 1960, con la publicación de 'La ciudad y los perros' (Vargas Llosa) y el contexto de la Revolución Cubana/1945)"
        correctAnswer: alrededor de 1960, con la publicación de 'La ciudad y los perros' (Vargas Llosa) y el contexto de la Revolución Cubana
        rationale: "El Boom: 1960s → La ciudad y los perros (1963), Rayuela (1963), Cien años de soledad (1967) → contexto de la Revolución Cubana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué Nobel de Literatura latinoamericanos se mencionan o pueden inferirse del texto? (ninguno/García Márquez (1982), Neruda (1971), Vargas Llosa (2010), Octavio Paz (1990) y Gabriela Mistral (1945)/solo García Márquez)"
        correctAnswer: García Márquez (1982), Neruda (1971), Vargas Llosa (2010), Octavio Paz (1990) y Gabriela Mistral (1945)
        rationale: "Hispanoamérica cuenta con múltiples Nobel de Literatura → el Boom internacionalizó la literatura latinoamericana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál fue el papel de la editorial Seix Barral y la Revolución Cubana en el Boom? (impidieron la difusión del Boom/Seix Barral publicó y distribuyó en Europa a los autores del Boom; la Revolución Cubana creó un clima de interés político e intelectual en América Latina/no tuvieron ningún papel)"
        correctAnswer: Seix Barral publicó y distribuyó en Europa a los autores del Boom; la Revolución Cubana creó un clima de interés político e intelectual en América Latina
        rationale: "El Boom fue también un fenómeno editorial: Seix Barral (Premio Biblioteca Breve) + Casa de las Américas → visibilidad internacional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de texto es 'El informe de Brodie' (Borges)? (novela de realismo mágico/conjunto de cuentos con narrador ficticio que documenta una tribu imaginaria: parodia del relato etnográfico/poesía en prosa)"
        correctAnswer: "conjunto de cuentos con narrador ficticio que documenta una tribu imaginaria: parodia del relato etnográfico"
        rationale: "'El informe de Brodie': Borges parodia el género del informe científico/etnográfico → metaficción que problematiza la veracidad del texto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué posición ocupa 'Cien años de soledad' en el canon de la literatura hispanoamericana? (obra menor/considerada la novela más importante de la literatura hispanoamericana y una de las cumbres del siglo XX a nivel mundial/solo es relevante en Colombia)"
        correctAnswer: considerada la novela más importante de la literatura hispanoamericana y una de las cumbres del siglo XX a nivel mundial
        rationale: "'Cien años de soledad' (García Márquez, 1967): Premio Nobel (1982), traducida a más de 40 lenguas → obra cumbre del Boom y del siglo XX."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
