pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La teoría de la evolución, formulada por Charles Darwin en 'El origen de las especies' (1859), propone que las especies cambian a lo largo del tiempo mediante la selección natural: los individuos con variaciones favorables para el entorno sobreviven y se reproducen más, transmitiendo sus características a la descendencia. Gregor Mendel, contemporáneo de Darwin, descubrió las leyes de la herencia genética (1865): la ley de la segregación (cada progenitor aporta un alelo de cada gen) y la ley de la distribución independiente. James Watson y Francis Crick describieron en 1953 la estructura de doble hélice del ADN, que contiene la información genética en secuencias de bases nitrogenadas (adenina, timina, guanina, citosina). La síntesis evolutiva moderna (o neodarwinismo) une la selección natural darwiniana con la genética mendeliana: las mutaciones aleatorias son la fuente de variación sobre la que actúa la selección natural. La epigenética estudia los cambios en la expresión génica que no implican cambios en la secuencia de ADN: factores ambientales pueden activar o silenciar genes. El genoma humano contiene aproximadamente 3.000 millones de pares de bases y unos 20.000-25.000 genes. El Proyecto Genoma Humano, completado en 2003, cartografió toda la secuencia del ADN humano."
    exercises:
