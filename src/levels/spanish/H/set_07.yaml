        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es el mecanismo central de la evolución según Darwin? (la mutación aleatoria/la selección natural: los individuos con variaciones favorables sobreviven y se reproducen más/la herencia genética)"
        correctAnswer: la selección natural: los individuos con variaciones favorables sobreviven y se reproducen más
        rationale: "El texto: 'la selección natural: los individuos con variaciones favorables para el entorno sobreviven y se reproducen más'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué estructura del ADN describieron Watson y Crick en 1953? (la cadena simple/la doble hélice/la triple hélice)"
        correctAnswer: la doble hélice
        rationale: "El texto: 'Watson y Crick describieron en 1953 la estructura de doble hélice del ADN'."
        difficulty: 5
