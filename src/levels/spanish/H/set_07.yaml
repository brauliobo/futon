authorNotes: "Texto expositivo sobre biología: teoría de la evolución (Darwin), genética mendeliana, ADN, síntesis evolutiva moderna, epigenética."
example: "Darwin: selección natural → variación heredable → Mendel: leyes de herencia → genes/alelos → mutación + recombinación → deriva genética → teoría sintética moderna (neodarwinismo): genética de poblaciones + selección natural + especiación → ADN: doble hélice Watson/Crick (1953) → genoma humano."
