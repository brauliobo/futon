        correctAnswer: la selección natural darwiniana con la genética mendeliana
        rationale: "El texto: 'La síntesis evolutiva moderna une la selección natural darwiniana con la genética mendeliana'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué estudia la epigenética? (los cambios en la secuencia del ADN/los cambios en la expresión génica sin cambios en la secuencia de ADN, producidos por factores ambientales/la estructura del cromosoma)"
        correctAnswer: los cambios en la expresión génica sin cambios en la secuencia de ADN, producidos por factores ambientales
        rationale: "El texto: 'La epigenética estudia los cambios en la expresión génica que no implican cambios en la secuencia de ADN'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo se completó el Proyecto Genoma Humano? (1993/2003/2013)"
