title: 🔬 Gramática - Sociolingüística Avanzada
level: H
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Sociolingüística avanzada: variación sociolingüística (Labov), variable sociolingüística, variantes. Estratificación social del lenguaje: clase social, sexo/género, edad, etnia. Cambio lingüístico: difusión léxica, variación y cambio, actitudes lingüísticas. Diglosia (Ferguson, Fishman). Lengua estándar e ideología lingüística. Planificación lingüística. Comunidad de habla. Redes sociales y lenguaje. Marcadores, indicadores y estereotipos (Labov)."
example: "variable sociolingüística → /s/ final de sílaba en Sevilla: variantes [s], [h], Ø según el hablante y el contexto. diglosia (Ferguson) → A (variedad alta: árabe clásico) y B (variedad baja: árabe dialectal) con funciones sociales distintas. marcador (Labov) → variante con variación estilística y social consciente. indicador → variante con variación social pero sin conciencia. estereotipo → variante con conciencia y evaluación social marcada. red social densa → presión hacia la variedad vernácula."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Variación Sociolingüística y Cambio Lingüístico
    description: Identifica los conceptos de la sociolingüística variacionista.
    exercises:
      - type: grammar
        question: "¿Qué es una variable sociolingüística? (un vocablo técnico/una unidad lingüística que presenta variantes según factores sociales o contextuales: /s/ final puede realizarse [s], [h] o Ø según el dialecto y el hablante/un sinónimo de dialecto)"
        correctAnswer: "una unidad lingüística que presenta variantes según factores sociales o contextuales: /s/ final puede realizarse [s], [h] o Ø según el dialecto y el hablante"
        rationale: "Variable sociolingüística (Labov): la forma lingüística covaria con factores extralingüísticos → estudio cuantitativo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la diglosia según Ferguson (1959)? (bilingüismo con dos lenguas/situación en que dos variedades de la misma lengua (A = alta/formal, B = baja/coloquial) tienen funciones sociales complementarias/uso de dos idiomas por el mismo hablante)"
        correctAnswer: situación en que dos variedades de la misma lengua (A = alta/formal, B = baja/coloquial) tienen funciones sociales complementarias
        rationale: "Ferguson: diglosia entre árabe clásico (A: religión, educación) y árabe dialectal (B: hogar, conversación)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre un marcador, un indicador y un estereotipo sociolingüístico (Labov)? (son tipos de dialecto/son sinónimos/indicador: variación social sin conciencia; marcador: variación social y estilística con conciencia; estereotipo: variante socialmente estigmatizada y comentada)"
        correctAnswer: "indicador: variación social sin conciencia; marcador: variación social y estilística con conciencia; estereotipo: variante socialmente estigmatizada y comentada"
        rationale: "Labov: gradación de conciencia → indicador (inconsciente) < marcador (semiconsciente) < estereotipo (plenamente comentado: '-r' en Boston)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué relación existe entre las redes sociales densas y la variedad vernácula? (las redes densas eliminan el vernáculo/las redes sociales densas y múltiples (relaciones múltiples entre los mismos individuos) refuerzan la variedad vernácula local/las redes densas promueven el estándar)"
        correctAnswer: las redes sociales densas y múltiples (relaciones múltiples entre los mismos individuos) refuerzan la variedad vernácula local
        rationale: "Milroy: redes densas → presión hacia la norma local vernácula. Redes laxas → más variación y cambio hacia el estándar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el prestigio encubierto (covert prestige) en sociolingüística? (el prestigio académico/el prestigio del estándar/el prestigio que tiene una variedad no estándar en ciertos grupos: hablar como los de tu barrio puede ser un signo de identidad y lealtad grupal)"
        correctAnswer: "el prestigio que tiene una variedad no estándar en ciertos grupos: hablar como los de tu barrio puede ser un signo de identidad y lealtad grupal"
        rationale: "Prestigio encubierto: una variedad estigmatizada por la norma puede ser valorada positivamente por sus hablantes → identidad y solidaridad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué estudia la planificación lingüística? (la lingüística histórica/el conjunto de decisiones políticas y técnicas sobre el estatus (qué lengua es oficial) y el corpus (la forma de la lengua) adoptadas por instituciones/la gramática normativa)"
        correctAnswer: el conjunto de decisiones políticas y técnicas sobre el estatus (qué lengua es oficial) y el corpus (la forma de la lengua) adoptadas por instituciones
        rationale: "Planificación de estatus: qué lenguas son oficiales. Planificación de corpus: ortografía, gramática normativa, neologismos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la acomodación comunicativa (Giles)? (el aprendizaje de L2/el ajuste del habla de un hablante hacia (convergencia) o en contra (divergencia) de la variedad de su interlocutor/la nivelación dialectal)"
        correctAnswer: el ajuste del habla de un hablante hacia (convergencia) o en contra (divergencia) de la variedad de su interlocutor
        rationale: "Teoría de la acomodación (Giles): convergencia → simpatía y aprobación. Divergencia → mantenimiento de identidad grupal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la hipótesis de la difusión léxica en el cambio lingüístico? (que el cambio lingüístico es aleatorio/que el cambio fonético afecta a todos los elementos a la vez/que el cambio fonético se difunde palabra a palabra, de forma gradual, no de golpe en todo el léxico)"
        correctAnswer: que el cambio fonético se difunde palabra a palabra, de forma gradual, no de golpe en todo el léxico
        rationale: "Difusión léxica (Wang): el cambio no es neogramático (simultáneo en todas las palabras con ese fonema) sino gradual, léxico a léxico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo afecta el género/sexo a la variación lingüística según Labov? (los hombres usan siempre el estándar/no afecta/las mujeres tienden a usar más formas de prestigio en contextos formales y son agentes de cambio lingüístico desde arriba y desde abajo)"
        correctAnswer: las mujeres tienden a usar más formas de prestigio en contextos formales y son agentes de cambio lingüístico desde arriba y desde abajo
        rationale: "Labov: las mujeres lideran cambios desde arriba (hacia el estándar) y desde abajo (cambios vernáculos) → rol central en la difusión del cambio."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una comunidad de habla en sociolingüística? (un grupo que habla la misma lengua/grupo de personas que comparte normas de uso lingüístico, actitudes y evaluaciones sobre las variedades de su comunidad/los hablantes de un país)"
        correctAnswer: grupo de personas que comparte normas de uso lingüístico, actitudes y evaluaciones sobre las variedades de su comunidad
        rationale: "Comunidad de habla (Labov, Gumperz): lo que une a sus miembros no es hablar igual sino compartir las mismas normas evaluativas."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Cambio Lingüístico e Ideología
    description: Profundiza en los factores sociales del cambio y la ideología lingüística.
    exercises:
      - type: grammar
        question: "¿Qué es la hipercorrección sociolingüística? (hablar sin errores/el uso de una forma lingüística de prestigio de manera excesiva o en contextos inadecuados por parte de grupos que aspiran a ascender socialmente/un tipo de préstamo)"
        correctAnswer: el uso de una forma lingüística de prestigio de manera excesiva o en contextos inadecuados por parte de grupos que aspiran a ascender socialmente
        rationale: "Hipercorrección (Labov): la clase media baja supera a la clase alta en el uso de formas de prestigio en situaciones formales → inseguridad lingüística."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la nivelación dialectal? (el estudio de los dialectos/proceso por el que rasgos dialectales marcados se eliminan al producirse el contacto entre hablantes de distintas variedades: urbanización, movilidad/la creación de nuevos dialectos)"
        correctAnswer: "proceso por el que rasgos dialectales marcados se eliminan al producirse el contacto entre hablantes de distintas variedades: urbanización, movilidad"
        rationale: "Nivelación: en ciudades de contacto dialectal, las formas más marcadas de cada dialecto tienden a desaparecer."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la ideología lingüística? (la gramática oficial/el conjunto de creencias, actitudes y valores sobre el lenguaje y sus variedades que legitiman o deslegitiman ciertos usos y grupos sociales/la política lingüística del Estado)"
        correctAnswer: el conjunto de creencias, actitudes y valores sobre el lenguaje y sus variedades que legitiman o deslegitiman ciertos usos y grupos sociales
        rationale: "Ideología lingüística: la idea de que hay formas 'correctas' e 'incorrectas' es ideológica → naturaliza desigualdades sociales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'ceceo' en el español andaluz? (pronunciar /s/ por /θ/en todo el vocabulario andaluz/pronunciar /θ/ (como en 'zapato') en lugar de /s/ en variedades del sur de Andalucía/una forma de yeísmo)"
        correctAnswer: pronunciar /θ/ (como en 'zapato') en lugar de /s/ en variedades del sur de Andalucía
        rationale: "Ceceo: /s/ → /θ/ → 'zeñora', 'zol'. Diferente del seseo (θ → s) y de la distinción estándar. Estigmatizado en la norma culta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la relación entre cambio lingüístico y edad en los estudios de panel? (la lengua no cambia con la edad/comparar el habla del mismo individuo en distintos momentos permite distinguir cambio en tiempo real vs. cambio evolutivo individual/solo los jóvenes cambian la lengua)"
        correctAnswer: comparar el habla del mismo individuo en distintos momentos permite distinguir cambio en tiempo real vs. cambio evolutivo individual
        rationale: "Estudios de panel vs. estudios de tiempo aparente: el panel sigue a los mismos individuos; el tiempo aparente compara generaciones."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué amplió Fishman del concepto de diglosia de Ferguson? (lo limitó a una lengua/Fishman extendió la diglosia a situaciones bilingües: dos lenguas distintas (no solo variedades) con distribución funcional alta/baja en una comunidad/eliminó el concepto)"
        correctAnswer: "Fishman extendió la diglosia a situaciones bilingües: dos lenguas distintas (no solo variedades) con distribución funcional alta/baja en una comunidad"
        rationale: "Fishman: diglosia + bilingüismo → catalán y castellano en Cataluña: dos lenguas con funciones altas/bajas según el dominio."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las actitudes lingüísticas? (las reglas fonológicas/las evaluaciones conscientes o inconscientes que los hablantes hacen de las variedades de su lengua → pueden reforzar o inhibir el uso de ciertas formas/los accidentes gramaticales)"
        correctAnswer: las evaluaciones conscientes o inconscientes que los hablantes hacen de las variedades de su lengua → pueden reforzar o inhibir el uso de ciertas formas
        rationale: "Actitudes: un hablante puede valorar una variedad como 'culta', 'simpática' o 'basta' → condicionan el cambio y la planificación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la etnografía de la comunicación (Hymes)? (la fonética descriptiva/el estudio del habla en su contexto cultural y situacional: las comunidades tienen reglas sobre cuándo hablar, cómo y con quién/la gramática comparada)"
        correctAnswer: "el estudio del habla en su contexto cultural y situacional: las comunidades tienen reglas sobre cuándo hablar, cómo y con quién"
        rationale: "Hymes: 'competencia comunicativa' (no solo gramatical): saber qué decir, a quién, cuándo y cómo → dimensión etnográfica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué fenómeno describe el 'cambio desde arriba'? (cambio impulsado por hablantes con bajo estatus/cambio hacia formas de prestigio impulsado por hablantes con mayor conciencia sociolingüística, generalmente clases medias/cambio rural)"
        correctAnswer: cambio hacia formas de prestigio impulsado por hablantes con mayor conciencia sociolingüística, generalmente clases medias
        rationale: "Cambio desde arriba (Labov): se adoptan formas del estándar o del prestigio → conciencia lingüística alta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el aporte metodológico central de Labov a la lingüística? (la gramática generativa/demostrar que la variación lingüística es sistemática y socialmente condicionada, no aleatoria: metodología cuantitativa/la lingüística contrastiva)"
        correctAnswer: "demostrar que la variación lingüística es sistemática y socialmente condicionada, no aleatoria: metodología cuantitativa"
        rationale: "Labov: la variación no es 'ruido' sino datos → estudio de la /r/ en Nueva York (1966) → fundó la sociolingüística variacionista."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
