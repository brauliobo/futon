title: Lectura - La Arquitectura de Gaudí
level: D
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo-descriptivo sobre arte y arquitectura. Vocabulario artístico y técnico. Analizar las características de un movimiento artístico, las innovaciones técnicas y el legado de un artista."
example: "Identifica las innovaciones técnicas, las fuentes de inspiración y el impacto cultural del artista."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Antoni Gaudí i Cornet nació en Reus, Cataluña, en 1852 y se convirtió en el máximo representante del modernismo catalán, aunque su obra trasciende cualquier etiqueta estilística. Sus edificios se distinguen por formas orgánicas inspiradas en la naturaleza: columnas que imitan troncos de árbol, ventanas con formas vegetales y techos ondulados que recuerdan las olas del mar. Gaudí fue pionero en el uso de la geometría hiperbólica y las estructuras catenarias, arcos cuya forma optimiza la distribución de las cargas sin necesidad de contrafuertes. Su obra cumbre, la Sagrada Família de Barcelona, comenzó a construirse en 1882 y aún no está terminada. Gaudí dedicó los últimos años de su vida exclusivamente a este proyecto y donó todos sus ahorros a la construcción. Murió en 1926 atropellado por un tranvía; al principio no fue identificado porque vestía con ropa humilde. Sus obras en Barcelona fueron declaradas Patrimonio de la Humanidad por la UNESCO en 1984. Su influencia se extiende hoy a la arquitectura contemporánea de todo el mundo."
    exercises:
      - type: reading
        question: "¿Dónde nació Gaudí? (Barcelona/Valencia/Reus)"
        correctAnswer: Reus
        rationale: "El texto: 'nació en Reus, Cataluña'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué se inspira principalmente la arquitectura de Gaudí? (de la geometría clásica/de la naturaleza/del arte árabe)"
        correctAnswer: de la naturaleza
        rationale: "El texto: 'formas orgánicas inspiradas en la naturaleza'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué son las estructuras catenarias? (columnas de piedra/arcos cuya forma optimiza la distribución de cargas sin contrafuertes/ventanas con formas vegetales)"
        correctAnswer: arcos cuya forma optimiza la distribución de cargas sin contrafuertes
        rationale: "El texto: 'arcos cuya forma optimiza la distribución de las cargas sin necesidad de contrafuertes'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo comenzó a construirse la Sagrada Família? (1852/1882/1926)"
        correctAnswer: 1882
        rationale: "El texto: 'comenzó a construirse en 1882'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hizo Gaudí con sus ahorros? (los invirtió en su empresa/los donó a la construcción de la Sagrada Família/los legó a su familia)"
        correctAnswer: los donó a la construcción de la Sagrada Família
        rationale: "El texto: 'donó todos sus ahorros a la construcción'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo murió Gaudí? (de enfermedad/atropellado por un tranvía/en un accidente de obra)"
        correctAnswer: atropellado por un tranvía
        rationale: "El texto: 'Murió en 1926 atropellado por un tranvía'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué no fue identificado de inmediato? (no llevaba documentación/vestía con ropa humilde/estaba lejos de Barcelona)"
        correctAnswer: vestía con ropa humilde
        rationale: "El texto: 'no fue identificado porque vestía con ropa humilde'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué año la UNESCO declaró sus obras Patrimonio de la Humanidad? (1882/1984/2002)"
        correctAnswer: 1984
        rationale: "El texto: 'declaradas Patrimonio de la Humanidad por la UNESCO en 1984'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Está terminada la Sagrada Família? (sí, en 1926/no, aún no está terminada/sí, en 1984)"
        correctAnswer: no, aún no está terminada
        rationale: "El texto: 'aún no está terminada'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué movimiento artístico representa Gaudí principalmente? (el barroco catalán/el modernismo catalán/el expresionismo)"
        correctAnswer: el modernismo catalán
        rationale: "El texto: 'el máximo representante del modernismo catalán'."
        difficulty: 4
        objectives: [es.pre_reading]
