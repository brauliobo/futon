pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El cerebro adolescente está en una fase de remodelación intensa que no concluye hasta los veinticinco años aproximadamente. Durante la adolescencia, la corteza prefrontal, responsable del control de impulsos, la toma de decisiones y la planificación a largo plazo, aún no está completamente desarrollada. En cambio, el sistema límbico, relacionado con las emociones y las recompensas, ya es completamente activo. Esta asimetría explica por qué los adolescentes tienden a buscar sensaciones nuevas, actuar impulsivamente y dar más importancia a las recompensas inmediatas que a las consecuencias futuras. Los neurocientíficos han descubierto que el sueño es fundamental en este período: durante el sueño profundo se consolidan los aprendizajes del día y se depura el cerebro de toxinas. Sin embargo, los adolescentes tienen un ritmo circadiano desplazado, lo que hace que su hora natural de dormir sea más tarde. Obligarles a levantarse muy temprano para ir al colegio puede interferir en este proceso. Algunos países nórdicos han experimentado con horarios escolares más tardíos y han observado mejoras en el rendimiento académico y el bienestar emocional."
    exercises:
      - type: reading
        question: "¿Cuándo termina de desarrollarse el cerebro según el texto? (a los dieciocho años/a los veinticinco años/a los treinta años)"
        correctAnswer: a los veinticinco años
        rationale: "El texto: 'no concluye hasta los veinticinco años aproximadamente'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué zona cerebral controla los impulsos y la planificación? (el sistema límbico/la corteza prefrontal/el hipocampo)"
        correctAnswer: la corteza prefrontal
        rationale: "El texto: 'la corteza prefrontal, responsable del control de impulsos, la toma de decisiones y la planificación'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué función tiene el sistema límbico? (control de impulsos/emociones y recompensas/planificación a largo plazo)"
        correctAnswer: emociones y recompensas
        rationale: "El texto: 'el sistema límbico, relacionado con las emociones y las recompensas'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué explica la asimetría entre corteza prefrontal y sistema límbico? (la inteligencia superior/la tendencia a buscar sensaciones y actuar impulsivamente/la memoria a largo plazo)"
        correctAnswer: la tendencia a buscar sensaciones y actuar impulsivamente
        rationale: "El texto: 'explica por qué los adolescentes tienden a buscar sensaciones nuevas, actuar impulsivamente'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué ocurre durante el sueño profundo? (se desarrolla la corteza prefrontal/se consolidan los aprendizajes y se depura el cerebro/aumenta el sistema límbico)"
        correctAnswer: se consolidan los aprendizajes y se depura el cerebro
        rationale: "El texto: 'se consolidan los aprendizajes del día y se depura el cerebro de toxinas'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es el ritmo circadiano desplazado? (dormir menos horas/tener la hora natural de dormir más tarde que los adultos/despertarse muy temprano)"
        correctAnswer: tener la hora natural de dormir más tarde que los adultos
        rationale: "El texto: 'los adolescentes tienen un ritmo circadiano desplazado, lo que hace que su hora natural de dormir sea más tarde'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué puede interferir en el proceso del sueño adolescente? (el ejercicio físico/obligarles a levantarse muy temprano para el colegio/el uso de tecnología)"
        correctAnswer: obligarles a levantarse muy temprano para el colegio
        rationale: "El texto: 'Obligarles a levantarse muy temprano para ir al colegio puede interferir en este proceso'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué han observado los países nórdicos con horarios más tardíos? (mayor absentismo/mejoras en rendimiento académico y bienestar emocional/ningún cambio)"
        correctAnswer: mejoras en rendimiento académico y bienestar emocional
