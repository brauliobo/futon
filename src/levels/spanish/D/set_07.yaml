authorNotes: "Texto expositivo de divulgación científica. Vocabulario neurológico y psicológico. Identificar causas científicas de comportamientos, implicaciones prácticas y matices del razonamiento."
example: "cerebro adolescente → córtex prefrontal incompleto (mielinización hasta 25 años) → mayor actividad amígdala → consecuencias: toma de riesgos/impulsividad/búsqueda de novedades → plasticidad elevada → implicaciones prácticas: importancia del sueño/apoyo de iguales/aprendizaje."
