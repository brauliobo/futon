title: 📝 Gramática - Modalidad y Matices del Verbo
level: D
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Modalidad epistémica (grado de certeza): certeza (sé que), probabilidad (creo que/quizás + subj., futuro de prob.: serán las tres), posibilidad (puede que + subj.), duda (dudo que + subj.). Modalidad deóntica (obligación/permiso): obligación (tener que, deber, hay que), permiso (poder), prohibición (no poder, estar prohibido). Matices de poder: capacidad (puedo nadar), posibilidad (puede que llueva), permiso (puedes salir). Matices de querer: volición (quiero salir), cortesía (quisiera un café), deseo irreal (querría viajar)."
example: "certeza → sé que es así. probabilidad → debe de ser tarde / serán las diez. posibilidad → puede que llueva / quizás llueva. obligación → tienes que hacerlo. capacidad → puedo nadar. cortesía → quisiera un café."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Modalidad Epistémica
    description: Identifica el grado de certeza expresado.
    exercises:
      - type: grammar
        question: "'Serán las tres.' ¿Qué expresa el futuro? (mandato/probabilidad/certeza)"
        correctAnswer: probabilidad
        rationale: "Futuro de probabilidad en el presente: serán las tres = deben de ser las tres."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quizás llueva mañana.' ¿Qué expresa? (certeza/posibilidad con duda/obligación)"
        correctAnswer: posibilidad con duda
        rationale: "'Quizás' + subjuntivo indica posibilidad incierta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Puede que tengas razón.' ¿Qué expresa? (certeza/posibilidad/prohibición)"
        correctAnswer: posibilidad
        rationale: "'Puede que' + subjuntivo expresa posibilidad sin compromiso."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Debe de haber salido ya.' ¿Qué expresa? (obligación/deducción lógica/permiso)"
        correctAnswer: deducción lógica
        rationale: "'Deber de' + infinitivo compuesto = deducción sobre el pasado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Sé que lo has hecho tú.' ¿Qué expresa? (duda/posibilidad/certeza)"
        correctAnswer: certeza
        rationale: "'Saber' + indicativo = certeza plena."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Habrá salido antes.' ¿Qué expresa el futuro perfecto? (obligación pasada/probabilidad sobre el pasado/acción cierta futura)"
        correctAnswer: probabilidad sobre el pasado
        rationale: "Futuro perfecto de probabilidad: habrá salido = supongo que ya salió."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Dudo que haya dicho eso.' ¿Qué modalidad expresa? (certeza/probabilidad/duda-posibilidad)"
        correctAnswer: duda-posibilidad
        rationale: "'Dudar que' + subjuntivo expresa que el hablante no lo da por cierto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo va 'quizás' con subjuntivo? (siempre/cuando expresa mayor incertidumbre/nunca)"
        correctAnswer: cuando expresa mayor incertidumbre
        rationale: "Quizás + subj. = mayor duda; quizás + ind. = mayor probabilidad (registro variado)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'A lo mejor viene.' ¿Qué modo lleva 'a lo mejor'? (subjuntivo/indicativo/condicional)"
        correctAnswer: indicativo
        rationale: "'A lo mejor' siempre lleva indicativo, aunque expresa incertidumbre."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Seguramente estará en casa.' ¿Qué expresa? (prohibición/probabilidad alta/certeza absoluta)"
        correctAnswer: probabilidad alta
        rationale: "'Seguramente' + futuro = probabilidad elevada, no certeza absoluta."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Modalidad Deóntica y Matices
    description: Identifica la modalidad o elige la forma correcta.
    exercises:
      - type: grammar
        question: "'Hay que respetar las normas.' ¿Modalidad? (permiso/obligación impersonal/prohibición)"
        correctAnswer: obligación impersonal
        rationale: "'Hay que' expresa obligación general sin sujeto específico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No puedes aparcar aquí.' ¿Modalidad? (capacidad negada/prohibición/permiso)"
        correctAnswer: prohibición
        rationale: "No poder = prohibición en este contexto (norma externa)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Puedes salir a las seis.' ¿Modalidad? (capacidad/posibilidad epistémica/permiso)"
        correctAnswer: permiso
        rationale: "Poder = permiso concedido por alguien con autoridad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No sé nadar.' ¿Qué expresa 'no saber'? (prohibición/incapacidad/duda)"
        correctAnswer: incapacidad
        rationale: "'No saber + inf.' = no tener la habilidad → incapacidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quisiera un café, por favor.' ¿Qué matiz añade el imperfecto de subjuntivo? (pasado/mayor cortesía/condición)"
        correctAnswer: mayor cortesía
        rationale: "'Quisiera' es la forma de cortesía de 'quiero': atenúa la petición."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Querría viajar por el mundo.' ¿Qué expresa el condicional? (petición cortés/deseo hipotético o poco probable/obligación)"
        correctAnswer: deseo hipotético o poco probable
        rationale: "Condicional de 'querer' expresa deseo con baja probabilidad de realización."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre 'poder' de capacidad y 'poder' de permiso? (ninguna/capacidad = habilidad propia; permiso = autorización externa/solo el contexto lo indica siempre)"
        correctAnswer: capacidad = habilidad propia; permiso = autorización externa
        rationale: "Puedo nadar (habilidad) ≠ puedes salir (te lo permito)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Deberías hablar con ella.' ¿Qué expresa el condicional de deber? (certeza/consejo o recomendación/prohibición)"
        correctAnswer: consejo o recomendación
        rationale: "Deber en condicional atenúa la obligación y la convierte en consejo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál expresa probabilidad sobre el pasado? (Debe hacerlo./Debería haberlo hecho./Debe de haberlo hecho.)"
        correctAnswer: Debe de haberlo hecho.
        rationale: "Deber de + infinitivo compuesto = deducción sobre el pasado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Se prohíbe fumar.' ¿Modalidad? (obligación/capacidad/prohibición impersonal)"
        correctAnswer: prohibición impersonal
        rationale: "'Se prohíbe' = construcción impersonal de prohibición."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
