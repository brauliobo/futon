title: 📝 Gramática - La Pasiva Refleja y las Construcciones Impersonales
level: D
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Pasiva perifrástica: ser + participio concordado + por + agente (El informe fue redactado por Ana). Pasiva refleja: se + verbo en 3ª persona (Se venden pisos / Se vendió la casa). Impersonales de se: se + verbo en 3ª sg. (Se vive bien aquí). Impersonales con 'uno' (uno no sabe qué decir), con 'ellos/la gente' (dicen que...), con infinitivo (Es difícil saberlo), con 2ª sg. coloquial (Si estudias, apruebas). Diferencia pasiva refleja vs. impersonal de se: pasiva refleja concuerda con el sujeto (se venden casas), impersonal no (se vive bien)."
example: "pasiva perifrástica → el libro fue escrito por Ana. pasiva refleja → se venden pisos (pisos = sujeto, concuerda). impersonal → se vive bien aquí (no hay sujeto gramatical). impersonal uno → uno nunca sabe."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Pasiva Perifrástica y Refleja
    description: Identifica el tipo de construcción o transforma.
    exercises:
      - type: grammar
        question: "'El proyecto fue aprobado por la junta.' ¿Tipo? (pasiva refleja/pasiva perifrástica/impersonal)"
        correctAnswer: pasiva perifrástica
        rationale: "Ser + participio + por + agente → pasiva perifrástica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Se alquilan habitaciones.' ¿Tipo? (pasiva refleja/impersonal de se/pasiva perifrástica)"
        correctAnswer: pasiva refleja
        rationale: "Se + verbo concuerda con 'habitaciones' (plural) → pasiva refleja."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Se vive muy bien en esta ciudad.' ¿Tipo? (pasiva refleja/impersonal de se/pasiva perifrástica)"
        correctAnswer: impersonal de se
        rationale: "'Se vive' no tiene sujeto gramatical → impersonal de se."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Transforma a pasiva perifrástica: 'El director firmó el contrato.' → (El contrato fue firmado por el director./El contrato se firmó./El director fue firmado.)"
        correctAnswer: El contrato fue firmado por el director.
        rationale: "Sujeto paciente (contrato) + fue + participio concordado + por + agente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Se habla español aquí.' ¿Tipo? (pasiva refleja/impersonal de se/activa)"
        correctAnswer: pasiva refleja
        rationale: "'Español' es el objeto/sujeto gramatical → se habla español = el español es hablado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Se come muy bien en este restaurante.' ¿Tipo? (pasiva refleja/impersonal de se/activa impersonal)"
        correctAnswer: impersonal de se
        rationale: "No hay objeto/sujeto al que hacer concordar → impersonal de se."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo distinguir pasiva refleja de impersonal de se? (por el tiempo verbal/la pasiva refleja concuerda con el sujeto gramatical; la impersonal no/por el contexto únicamente)"
        correctAnswer: la pasiva refleja concuerda con el sujeto gramatical; la impersonal no
        rationale: "Se vende/se venden (concuerda con el objeto-sujeto) vs. se vive bien (no concuerda)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Forma correcta de pasiva refleja: ('Se vende pisos.'/'Se venden pisos.'/'Se vende los pisos.')"
        correctAnswer: Se venden pisos.
        rationale: "Pasiva refleja: se + verbo concuerda en número con 'pisos' (plural)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La ley fue modificada.' ¿Puede añadirse un agente? (no, nunca/sí: fue modificada por el parlamento/solo en registro coloquial)"
        correctAnswer: "sí: fue modificada por el parlamento"
        rationale: "La pasiva perifrástica puede incluir o no el complemento agente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ mucho ruido en esta calle.' (impersonal de se con hacer) (Se hace/Se hacen/Hace)"
        correctAnswer: Se hace
        rationale: "Impersonal de se + verbo en 3ª sg.: se hace mucho ruido."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Construcciones Impersonales
    description: Elige la construcción impersonal correcta.
    exercises:
      - type: grammar
        question: "'___ que el proyecto fue un éxito.' (impersonal con 'dicen') (Dicen/Se dice/Ambas son correctas)"
        correctAnswer: Ambas son correctas
        rationale: "Tanto 'dicen que' (3ª pl. impersonal) como 'se dice que' son impersonales válidas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ no sabe qué decir en estos casos.' (impersonal con 'uno') (Se/Uno/La gente)"
        correctAnswer: Uno
        rationale: "'Uno + verbo en 3ª sg.' es una construcción impersonal de registro formal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ difícil tomar esa decisión.' (impersonal con ser) (Es/Se es/Hay)"
        correctAnswer: Es
        rationale: "Es + adjetivo + infinitivo = construcción impersonal con ser."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Si estudias, apruebas.' ¿Qué tipo de impersonal es? (de se/con uno/con 2ª persona singular de valor general)"
        correctAnswer: con 2ª persona singular de valor general
        rationale: "La 2ª sg. (tú genérico) equivale a 'si uno estudia, aprueba' en registro coloquial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Hay que ser paciente.' ¿Cuántos sujetos tiene esta oración? (uno/ninguno, es impersonal/dos)"
        correctAnswer: ninguno, es impersonal
        rationale: "'Hay que' es una perífrasis impersonal sin sujeto gramatical."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Se necesitan voluntarios.' ¿Qué función tiene 'voluntarios'? (complemento directo/sujeto gramatical de la pasiva refleja/complemento indirecto)"
        correctAnswer: sujeto gramatical de la pasiva refleja
        rationale: "En la pasiva refleja el objeto semántico pasa a ser sujeto gramatical."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué se prefiere la pasiva refleja a la perifrástica en español? (por norma académica/es más natural y frecuente en el habla/solo en textos escritos)"
        correctAnswer: es más natural y frecuente en el habla
        rationale: "La pasiva refleja es la construcción pasiva más usada en español; la perifrástica es más formal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ mucho sobre este tema últimamente.' (impersonal de se con escribir) (Se escribe/Se escriben/Escriben)"
        correctAnswer: Se escribe
        rationale: "Impersonal de se + 3ª sg.: se escribe mucho."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Forma incorrecta de pasiva refleja con persona: ('Se contrató a los trabajadores.'/'Se contrataron los trabajadores.'/'Ambas pueden ser correctas según el contexto.')"
        correctAnswer: Ambas pueden ser correctas según el contexto.
        rationale: "Con personas: 'se contrató a' (impersonal) y 'se contrataron' (pasiva refleja) coexisten, aunque la primera evita la ambigüedad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ por teléfono y por correo.' (se atiende, impersonal de se) (Se atiende/Se atienden/Atienden)"
        correctAnswer: Se atiende
        rationale: "Impersonal de se sin sujeto gramatical → 3ª sg.: se atiende."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
