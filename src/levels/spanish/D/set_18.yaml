title: Gramática - El Texto Expositivo y el Resumen
level: D
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo: estructura objetiva, presenta información sin posicionarse. Partes: introducción (plantea el tema), desarrollo (explica con ejemplos, datos, comparaciones) y conclusión (síntesis). Técnicas expositivas: definición, clasificación, descripción, enumeración, comparación, ejemplificación, causa-efecto. Resumen: texto breve que recoge las ideas principales respetando la objetividad. Diferencia resumen vs. comentario (el comentario valora). Paráfrasis: reformular con otras palabras. Cohesión: uso de sinónimos, pronombres y conectores para no repetir."
example: "definición → 'la fotosíntesis es el proceso por el que...'. clasificación → 'los volcanes se dividen en...'. resumen → recoge las ideas principales sin valorar ni añadir. paráfrasis → reformular: 'el texto afirma que' + idea."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Estructura y Técnicas Expositivas
    description: Identifica la técnica o parte del texto expositivo.
    exercises:
      - type: grammar
        question: "¿Cuál es la característica principal de un texto expositivo? (expresa la opinión del autor/presenta información de forma objetiva/argumenta una postura)"
        correctAnswer: presenta información de forma objetiva
        rationale: "El texto expositivo informa sin posicionarse, a diferencia del argumentativo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los mamíferos se dividen en placentarios, marsupiales y monotremas.' ¿Técnica? (definición/clasificación/comparación)"
        correctAnswer: clasificación
        rationale: "Organizar un conjunto en categorías → técnica de clasificación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La fotosíntesis es el proceso por el que las plantas convierten la luz solar en energía.' ¿Técnica? (comparación/clasificación/definición)"
        correctAnswer: definición
        rationale: "Explicar qué es algo → técnica de definición."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Al igual que los humanos aprenden idiomas, los loros imitan sonidos complejos.' ¿Técnica? (causa-efecto/comparación/enumeración)"
        correctAnswer: comparación
        rationale: "Relacionar dos elementos para ilustrar una idea → técnica de comparación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Por ejemplo, en 2022 las inundaciones afectaron a más de un millón de personas.' ¿Técnica? (definición/ejemplificación/clasificación)"
        correctAnswer: ejemplificación
        rationale: "Ilustrar con un caso concreto → técnica de ejemplificación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué parte del texto expositivo plantea el tema? (desarrollo/conclusión/introducción)"
        correctAnswer: introducción
        rationale: "La introducción presenta el tema del que va a tratar el texto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La contaminación provoca enfermedades respiratorias.' ¿Técnica? (ejemplificación/comparación/causa-efecto)"
        correctAnswer: causa-efecto
        rationale: "Relacionar una causa con su consecuencia → técnica causa-efecto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál de estas frases pertenece a la conclusión de un expositivo? ('En primer lugar, la economía circular propone...'/'El objetivo de este texto es explicar...'/'En definitiva, la economía circular ofrece beneficios múltiples.')"
        correctAnswer: En definitiva, la economía circular ofrece beneficios múltiples.
        rationale: "'En definitiva' introduce la síntesis final → conclusión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué registro debe tener un texto expositivo formal? (coloquial y cercano/impersonal, objetivo y preciso/emotivo y subjetivo)"
        correctAnswer: impersonal, objetivo y preciso
        rationale: "El expositivo formal usa se impersonal, vocabulario técnico y evita la subjetividad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'En primer lugar... En segundo lugar... Por último...' ¿Qué indica esta estructura? (argumentación/enumeración organizada del desarrollo/conclusión)"
        correctAnswer: enumeración organizada del desarrollo
        rationale: "Los ordenadores discursivos (en primer lugar, etc.) estructuran la enumeración organizada del desarrollo."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Resumen y Paráfrasis
    description: Selecciona la opción correcta sobre técnicas de resumen.
    exercises:
      - type: grammar
        question: "¿Qué debe incluir un buen resumen? (las ideas principales del texto original/la opinión del lector/las ideas secundarias y los ejemplos)"
        correctAnswer: las ideas principales del texto original
        rationale: "El resumen recoge las ideas esenciales, omitiendo ejemplos y detalles secundarios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el resumen del comentario? (el resumen es más largo/el comentario valora e interpreta; el resumen solo recoge contenido/el resumen usa la primera persona)"
        correctAnswer: el comentario valora e interpreta; el resumen solo recoge contenido
        rationale: "Resumir: reproducir las ideas del autor. Comentar: añadir la opinión propia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la paráfrasis? (copiar un texto/reformular las ideas del texto con otras palabras/hacer un resumen muy corto)"
        correctAnswer: reformular las ideas del texto con otras palabras
        rationale: "Parafrasear = expresar con vocabulario diferente el mismo contenido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué recurso de cohesión evita repetir el sustantivo 'la contaminación'? (un adverbio/un pronombre o sinónimo/un conector adversativo)"
        correctAnswer: un pronombre o sinónimo
        rationale: "Para evitar repeticiones se usan pronombres ('ella', 'este fenómeno') o sinónimos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Paráfrasis correcta de 'La deforestación agrava el cambio climático': ('Hay problemas medioambientales.'/'La tala de bosques intensifica el calentamiento global.'/'El cambio climático es grave.')"
        correctAnswer: La tala de bosques intensifica el calentamiento global.
        rationale: "Mismo contenido con vocabulario diferente → paráfrasis correcta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuánto debe medir un resumen respecto al original? (igual/entre un 25 y un 30% del original/el doble)"
        correctAnswer: entre un 25 y un 30% del original
        rationale: "Convencionalmente, el resumen académico ocupa entre un cuarto y un tercio del texto original."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede el resumen añadir información no presente en el original? (sí, si es relevante/no, el resumen solo reproduce lo del texto/sí, en la conclusión)"
        correctAnswer: no, el resumen solo reproduce lo del texto
        rationale: "El resumen es fiel al original: no añade ni valora información externa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué connectors organizan el desarrollo de un texto expositivo? (por tanto, sin embargo/en primer lugar, a continuación, por último/ojalá, quizás)"
        correctAnswer: en primer lugar, a continuación, por último
        rationale: "Los ordenadores del discurso (en primer lugar, etc.) estructuran el desarrollo expositivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué persona gramatical usa el texto expositivo formal? (primera persona singular/primera persona plural/impersonal/tercera persona)"
        correctAnswer: impersonal/tercera persona
        rationale: "El expositivo evita el 'yo': usa se impersonal o tercera persona para dar objetividad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige el resumen correcto de 'El texto describe las causas y consecuencias del cambio climático y propone soluciones': ('El autor critica al gobierno.'/'El texto explica el cambio climático: sus causas, efectos y posibles soluciones.'/'El cambio climático es muy grave.')"
        correctAnswer: "El texto explica el cambio climático: sus causas, efectos y posibles soluciones."
        rationale: "Recoge las ideas principales (causas, efectos, soluciones) sin valorar → buen resumen."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
