title: Lectura - La Mente y la Meditación
level: D
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo de divulgación psicológica. Vocabulario de psicología y neurociencia. Evaluar afirmaciones basadas en evidencia científica y distinguir causas de correlaciones."
example: "En este tipo de texto, distingue entre resultados científicos comprobados y afirmaciones que requieren más investigación."
