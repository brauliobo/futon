pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La meditación, practicada desde hace miles de años en tradiciones orientales, ha captado en las últimas décadas la atención de la neurociencia occidental. Estudios realizados con resonancia magnética funcional han demostrado que la práctica regular de la meditación produce cambios estructurales en el cerebro: aumenta el grosor de la corteza prefrontal, asociada al autocontrol, y reduce el tamaño de la amígdala, relacionada con las respuestas de miedo y estrés. La técnica más estudiada es el mindfulness o atención plena, que consiste en prestar atención consciente al momento presente sin juzgar. Ensayos clínicos controlados han mostrado que el mindfulness reduce los síntomas de ansiedad y depresión con una eficacia comparable a ciertos antidepresivos en casos leves o moderados. Sin embargo, los investigadores advierten que no todos los estudios son de alta calidad metodológica y que los efectos varían considerablemente entre individuos. Además, algunas personas con antecedentes de trauma pueden experimentar efectos adversos. La meditación no es una panacea, pero integrada en un enfoque de salud mental más amplio puede ser una herramienta valiosa."
    exercises:
      - type: reading
        question: "¿Qué técnica de neuroimagen se menciona en el texto? (tomografía computarizada/resonancia magnética funcional/electroencefalograma)"
        correctAnswer: resonancia magnética funcional
        rationale: "El texto: 'Estudios realizados con resonancia magnética funcional'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué cambio produce la meditación en la corteza prefrontal? (la reduce/aumenta su grosor/no la modifica)"
        correctAnswer: aumenta su grosor
        rationale: "El texto: 'aumenta el grosor de la corteza prefrontal'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué función tiene la amígdala? (el autocontrol/la planificación/las respuestas de miedo y estrés)"
        correctAnswer: las respuestas de miedo y estrés
        rationale: "El texto: 'la amígdala, relacionada con las respuestas de miedo y estrés'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué consiste el mindfulness? (vaciar la mente de pensamientos/prestar atención consciente al momento presente sin juzgar/relajar los músculos progresivamente)"
        correctAnswer: prestar atención consciente al momento presente sin juzgar
        rationale: "El texto: 'prestar atención consciente al momento presente sin juzgar'."
