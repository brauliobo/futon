pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El Renacimiento fue un movimiento cultural y artístico que surgió en Italia en el siglo XIV y se extendió por Europa durante los siglos XV y XVI. En España llegó con cierto retraso y adquirió características propias: convivió con los valores religiosos medievales y recibió la influencia del humanismo erasmista. El humanismo renacentista situaba al ser humano en el centro del universo, frente al teocentrismo medieval, y reivindicaba el estudio de los clásicos grecolatinos. En literatura, los géneros más cultivados fueron el soneto petrarquista, la novela pastoril y el diálogo erasmista. Garcilaso de la Vega introdujo el soneto y la lira en la poesía castellana y es considerado el primer gran poeta del Renacimiento español. En prosa destacan el Lazarillo de Tormes (1554), primera novela picaresca, y los Diálogos de Juan de Valdés. En pintura, el Greco, aunque de origen cretense, desarrolló en Toledo un estilo personal que fusionaba el manierismo italiano con la espiritualidad hispana. La imprenta de Gutenberg, difundida en España desde 1472, fue fundamental para la propagación de las ideas renacentistas."
