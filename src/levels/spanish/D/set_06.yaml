title: Gramática - El Gerundio y el Infinitivo
level: D
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gerundio: forma -ando/-iendo. Usos: acción simultánea/en curso (está leyendo), modo (entró corriendo), condición (estudiando, aprobarás), causa (siendo tarde, nos fuimos). Gerundio incorrecto: no califica sustantivos (*una caja conteniendo → que contiene), no indica acción posterior (*llegó a casa, tomando una ducha → y tomó). Infinitivo: forma -ar/-er/-ir. Usos: sujeto de oración (fumar daña), objeto (quiero estudiar), tras preposición (antes de salir), perifrástico (voy a correr). Infinitivo compuesto: haber + participio (haber comido = acción anterior al verbo principal)."
example: "simultánea → estaba leyendo cuando llegaste. modo → entró corriendo. incorrecto → *foto mostrando → foto que muestra. infinitivo sujeto → vivir sano es difícil. haber + part. → después de haber comido."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Usos del Gerundio
    description: Identifica el uso o error del gerundio.
    exercises:
      - type: grammar
        question: "'Llegó ___ por la puerta trasera.' (modo) (corriendo/correr/haber corrido)"
        correctAnswer: corriendo
        rationale: "Gerundio de modo: indica cómo se realizó la acción → corriendo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ mucho, aprenderás la lección.' (condición) (Estudiar/Estudiando/Al estudiar)"
        correctAnswer: Estudiando
        rationale: "Gerundio de condición al inicio = si estudias → estudiando, aprenderás."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el uso incorrecto del gerundio? ('Estaba durmiendo cuando sonó el teléfono.'/'Vi una nota explicando el problema.'/'Me fui corriendo.')"
        correctAnswer: Vi una nota explicando el problema.
        rationale: "El gerundio no califica sustantivos: *nota explicando → nota que explica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ tan tarde, decidimos no salir.' (causa) (Siendo/Al ser/Si somos)"
        correctAnswer: Siendo
        rationale: "Gerundio de causa: siendo tarde = como era tarde → causa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Forma incorrecta: ('Entró en la sala cantando.'/'Salió corriendo.'/'Compré un libro conteniendo recetas.')"
        correctAnswer: Compré un libro conteniendo recetas.
        rationale: "El gerundio no puede modificar un sustantivo: *libro conteniendo → libro que contiene."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Siguió ___ a pesar del cansancio.' (continuación) (trabajar/trabajando/haber trabajado)"
        correctAnswer: trabajando
        rationale: "Seguir + gerundio expresa continuación: siguió trabajando."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿En qué uso puede el gerundio indicar una acción anterior a la del verbo principal? (modo/causa cuando se combina con 'habiendo'/condición)"
        correctAnswer: causa cuando se combina con 'habiendo'
        rationale: "Gerundio compuesto 'habiendo + part.' indica anterioridad: habiendo terminado, salió."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ terminado el trabajo, salió a dar un paseo.' (anterioridad) (Habiendo/Siendo/Estando)"
        correctAnswer: Habiendo
        rationale: "Gerundio compuesto de anterioridad: habiendo terminado = una vez que terminó."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Forma con gerundio que expresa acción en progreso: ('Duerme.'/'Está durmiendo.'/'Dormirá.')"
        correctAnswer: Está durmiendo.
        rationale: "Estar + gerundio expresa acción en desarrollo en ese momento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede el gerundio ir como sujeto? (sí, siempre/no, esa función la tiene el infinitivo/sí, en posición final)"
        correctAnswer: no, esa función la tiene el infinitivo
        rationale: "El infinitivo actúa como sustantivo (sujeto): fumar daña. El gerundio no tiene esa función en español."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Usos del Infinitivo
    description: Elige la forma correcta o identifica el uso del infinitivo.
    exercises:
      - type: grammar
        question: "'___ a diario es muy saludable.' (sujeto de oración) (Correr/Corriendo/Habrás corrido)"
        correctAnswer: Correr
        rationale: "Infinitivo como sujeto de la oración: correr (= el deporte de correr) es saludable."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Antes de ___, cierra la puerta.' (tras preposición) (salgas/salir/saliendo)"
        correctAnswer: salir
        rationale: "Tras preposición → infinitivo: antes de salir."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ comido, se fue a dormir.' (infinitivo compuesto de anterioridad) (Después de haber/Después de/Al haber)"
        correctAnswer: Después de haber
        rationale: "Infinitivo compuesto (haber + participio) tras preposición indica anterioridad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa el infinitivo compuesto 'haber llegado'? (acción futura/acción anterior al verbo principal/acción habitual)"
        correctAnswer: acción anterior al verbo principal
        rationale: "Haber + participio = acción acabada antes que la del verbo principal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ es de sabios.' (refrán con infinitivo sujeto) (Errar/Errando/Habiendo errado)"
        correctAnswer: Errar
        rationale: "Infinitivo como sujeto: errar (= equivocarse) es de sabios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No sé ___ hacer en este caso.' (complemento de verbo de ignorancia) (qué/qué hacer/cómo)"
        correctAnswer: qué hacer
        rationale: "Infinitivo introducido por interrogativo indirecto: sé qué hacer."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Al ___ la noticia, se echó a llorar.' (temporal simultáneo) (oír/oído/oyendo)"
        correctAnswer: oír
        rationale: "Al + infinitivo expresa simultaneidad: al oír = cuando oyó."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Lamento ___ llegado tarde.' (infinitivo compuesto con sujeto correferente) (llegar/haber llegado/llegando)"
        correctAnswer: haber llegado
        rationale: "Mismo sujeto + acción anterior → infinitivo compuesto: lamento haber llegado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia principal entre gerundio e infinitivo como no personales? (no hay diferencia/infinitivo = sustantivo verbal, gerundio = adverbio verbal/gerundio = sustantivo, infinitivo = adverbio)"
        correctAnswer: infinitivo = sustantivo verbal, gerundio = adverbio verbal
        rationale: "El infinitivo funciona como sustantivo (sujeto, objeto); el gerundio como adverbio (modo, causa, condición)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige la correcta: ('Prohibido fumar.'/'Prohibido fumando.'/'Prohibido haber fumado.')"
        correctAnswer: Prohibido fumar.
        rationale: "Tras participio-adjetivo (prohibido) → infinitivo: prohibido fumar."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
