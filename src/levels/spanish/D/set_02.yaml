        correctAnswer: porque introduce narrador crítico, psicología compleja y reflexión sobre la ficción
        rationale: "El texto: 'narrador que cuestiona sus propias fuentes, personajes con psicología compleja... reflexión sobre la naturaleza de la ficción'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué género literario parodia el Quijote? (las comedias del Siglo de Oro/la poesía épica/los libros de caballerías)"
        correctAnswer: los libros de caballerías
        rationale: "El texto: 'La obra parodia los libros de caballerías'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tensión central explora la novela? (bien y mal/el ideal y la realidad/la fe y la razón)"
