        correctAnswer: el hombre concreto y práctico
        rationale: "El texto: 'Sancho Panza... representa al hombre concreto y práctico'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué encarna don Quijote? (la prudencia/el idealismo llevado al extremo/la cobardía)"
        correctAnswer: el idealismo llevado al extremo
        rationale: "El texto: 'don Quijote encarna el idealismo llevado al extremo'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo fue traducida la novela a otros idiomas europeos? (después de la muerte de Cervantes/en vida de Cervantes/en el siglo XVIII)"
        correctAnswer: en vida de Cervantes
