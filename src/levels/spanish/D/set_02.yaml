authorNotes: "Texto literario-expositivo sobre el Quijote. Vocabulario literario y crítico. Comprender la importancia histórica de una obra, sus innovaciones formales y su influencia."
example: "El Quijote (1605/1615) → primera novela moderna → metaficción/ironía/perspectivismo → rompe con libros de caballerías → influencia: Dickens/Flaubert/Kafka → innovaciones: narrador poco fiable, multiplicidad de voces, autoconsciencia narrativa."
repeatAll: 2
