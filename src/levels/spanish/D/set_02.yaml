  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El ingenioso hidalgo don Quijote de la Mancha, publicado en dos partes en 1605 y 1615, es considerado por muchos críticos la primera novela moderna. Su autor, Miguel de Cervantes, transformó la narrativa europea al introducir recursos que hoy consideramos esenciales: un narrador que cuestiona sus propias fuentes, personajes con psicología compleja que evolucionan a lo largo del relato, y una reflexión explícita sobre la naturaleza de la ficción. La obra parodia los libros de caballerías, tan de moda en el siglo XVI, pero va mucho más allá: explora la tensión entre el ideal y la realidad, entre la locura y la cordura, entre la ilusión y el desengaño. El personaje de Sancho Panza, el escudero de don Quijote, representa al hombre concreto y práctico, mientras que don Quijote encarna el idealismo llevado al extremo. La novela fue traducida a todos los idiomas europeos en vida de Cervantes y sigue siendo estudiada en universidades de todo el mundo. En 2002, una encuesta entre escritores y académicos de cien países la eligió como el mejor libro de la historia."
    exercises:
      - type: reading
