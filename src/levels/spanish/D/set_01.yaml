title: 📚 Gramática - El Texto Argumentativo
level: D
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Texto argumentativo: estructura tesis + argumentos + conclusión. Tesis: postura del autor sobre el tema. Argumentos: razones que apoyan la tesis (de autoridad, de ejemplo, de causa-efecto, por analogía, estadísticos). Contraargumentos: objeciones que el autor rebate. Falacias comunes: ad hominem (ataca a la persona), apelación a la emoción, hombre de paja (distorsiona la postura contraria), falsa dicotomía. Registro: formal, impersonal, uso de conectores discursivos."
example: "tesis → 'el reciclaje es necesario'. argumento de causa-efecto → 'porque reduce los residuos en un 40%'. contraargumento rebatido → 'aunque tiene un coste, a largo plazo ahorra recursos'. conclusión → 'por tanto, debemos reciclar'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Estructura Argumentativa
    description: Identifica los elementos del texto argumentativo.
    exercises:
      - type: grammar
        question: "¿Qué es la tesis de un texto argumentativo? (la conclusión final/la postura o idea central que el autor defiende/el resumen del texto)"
        correctAnswer: la postura o idea central que el autor defiende
        rationale: "La tesis es la idea central que el autor defiende a lo largo del texto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Argumento de autoridad: ('Según estudios de la OMS, el tabaco causa cáncer.'/'Mucha gente fuma, luego no puede ser tan malo.'/'Si dejas de fumar, serás más feliz.')"
        correctAnswer: Según estudios de la OMS, el tabaco causa cáncer.
        rationale: "Citar una fuente experta (OMS) para apoyar la tesis → argumento de autoridad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un contraargumento? (un argumento que apoya la tesis/una objeción a la tesis que el autor reconoce y rebate/la conclusión del texto)"
        correctAnswer: una objeción a la tesis que el autor reconoce y rebate
        rationale: "El contraargumento presenta la postura contraria para luego rebatirla."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Falacia ad hominem: ('Este argumento es incorrecto porque...'/'No le hagas caso, es un ignorante.'/'Datos muestran que el 60% apoya la medida.')"
        correctAnswer: No le hagas caso, es un ignorante.
        rationale: "Ad hominem ataca a la persona en lugar de refutar el argumento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la falsa dicotomía? (atacar al oponente/presentar solo dos opciones cuando existen más/usar estadísticas falsas)"
        correctAnswer: presentar solo dos opciones cuando existen más
        rationale: "La falsa dicotomía reduce artificialmente las opciones: 'O estás con nosotros o contra nosotros'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Argumento de ejemplo: ('La reutilización reduce residuos.'/'París, Ámsterdam y Copenhague ya usan energía 100% renovable.'/'Es necesario actuar ya.')"
        correctAnswer: París, Ámsterdam y Copenhague ya usan energía 100% renovable.
        rationale: "Casos concretos que ilustran la tesis → argumento por ejemplo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué función tiene la conclusión en un texto argumentativo? (introducir el tema/presentar la tesis/cerrar el razonamiento y reforzar la tesis)"
        correctAnswer: cerrar el razonamiento y reforzar la tesis
        rationale: "La conclusión sintetiza los argumentos y cierra el texto reafirmando la postura."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Falacia del hombre de paja: ('Tu propuesta tiene fallos porque...'/'Dices que quieres reducir impuestos, luego quieres que los pobres mueran.'/'Los datos avalan esta política.')"
        correctAnswer: Dices que quieres reducir impuestos, luego quieres que los pobres mueran.
        rationale: "El hombre de paja distorsiona la postura contraria para atacarla más fácilmente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué caracteriza el registro de un texto argumentativo formal? (uso de coloquialismos/lenguaje impersonal, técnico y conectores discursivos/oraciones cortas y simples)"
        correctAnswer: lenguaje impersonal, técnico y conectores discursivos
        rationale: "El texto argumentativo formal usa se impersonal, tecnicismos y conectores como 'por tanto', 'sin embargo'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Argumento estadístico: ('Creo que deberíamos reciclar más.'/'El 78% de los españoles recicla papel, según el INE.'/'Reciclar es una buena costumbre.')"
        correctAnswer: El 78% de los españoles recicla papel, según el INE.
        rationale: "Dato numérico con fuente verificable → argumento estadístico."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis y Producción
    description: Analiza fragmentos argumentativos y sus estrategias.
    exercises:
      - type: grammar
        question: "'Aunque el coche eléctrico es caro, a largo plazo ahorra en combustible.' ¿Qué estrategia usa? (tesis/argumento concesivo que rebate objeción/conclusión)"
        correctAnswer: argumento concesivo que rebate objeción
        rationale: "'Aunque' concede la objeción (caro) y la rebate con el beneficio a largo plazo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué conector introduce la conclusión en un texto argumentativo? (aunque/sin embargo/en conclusión)"
        correctAnswer: en conclusión
        rationale: "'En conclusión' cierra el razonamiento y señala el párrafo de cierre."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Orden clásico de un texto argumentativo: (argumentos → tesis → conclusión/introducción + tesis → argumentos → conclusión/conclusión → tesis → argumentos)"
        correctAnswer: introducción + tesis → argumentos → conclusión
        rationale: "La estructura clásica: introducción con tesis, desarrollo con argumentos, conclusión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Todo el mundo lo hace, luego debe estar bien.' ¿Qué tipo de argumento o falacia es? (argumento de autoridad/falacia ad populum (apelación a la mayoría)/argumento estadístico)"
        correctAnswer: falacia ad populum (apelación a la mayoría)
        rationale: "Apelar a que 'todo el mundo lo hace' es la falacia ad populum."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué hace más sólido un argumento? (ser emotivo/estar apoyado por datos, fuentes y lógica coherente/ser muy largo)"
        correctAnswer: estar apoyado por datos, fuentes y lógica coherente
        rationale: "La solidez argumentativa depende de la evidencia, la fuente y la coherencia lógica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La deforestación provoca la extinción de especies y el aumento del CO₂.' ¿Tipo de argumento? (de analogía/de causa-efecto/de autoridad)"
        correctAnswer: de causa-efecto
        rationale: "Relaciona una acción (deforestación) con sus consecuencias → causa-efecto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué conector introduce un contraargumento que se va a rebatir? (por tanto/sin embargo/aunque si bien)"
        correctAnswer: aunque si bien
        rationale: "'Si bien' o 'aunque' introducen la concesión antes de rebatirla."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El lenguaje impersonal en textos argumentativos usa: (yo creo que/se considera que/pienso que)"
        correctAnswer: se considera que
        rationale: "El impersonal 'se + verbo' distancia al autor y da objetividad al argumento."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Al igual que las vacunas erradicaron la viruela, la educación puede erradicar la ignorancia.' ¿Tipo? (de autoridad/de analogía/estadístico)"
        correctAnswer: de analogía
        rationale: "Compara dos situaciones paralelas para apoyar la tesis → argumento por analogía."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál NO es parte de un texto argumentativo bien estructurado? (tesis/inventario de productos/argumentos)"
        correctAnswer: inventario de productos
        rationale: "Un texto argumentativo tiene tesis, argumentos y conclusión; no un inventario."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
