title: Gramática - Nivel Léxico-Semántico Avanzado
level: D
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Registro lingüístico: formal/culto (se requiere, no obstante), estándar (hace falta, sin embargo), coloquial (hay que, pero), vulgar. Tecnicismos y cultismos. Eufemismos (suavizar: 'persona de avanzada edad' = viejo). Disfemismos (expresión más dura). Tabú léxico. Fraseología: locuciones (estar en las nubes = distraído), modismos (no hay mal que por bien no venga), refranes (a quien madruga, Dios le ayuda), colocaciones (tomar una decisión ≠ *hacer una decisión). Relaciones léxicas: paronimia (actitud/aptitud), antonimia graduable/complementaria."
example: "registro formal → 'se procedió a la firma'. colocación → 'cometer un error' (no *hacer un error). locución → 'meter la pata' = equivocarse. eufemismo → 'pasar a mejor vida' = morir. parónimo → actitud ≠ aptitud."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Registro y Fraseología
    description: Identifica el registro o la figura léxica.
    exercises:
      - type: grammar
        question: "¿Cuál pertenece al registro formal? (Hay que hacer algo./Se requiere una actuación inmediata./Tienen que hacer algo ya.)"
        correctAnswer: Se requiere una actuación inmediata.
        rationale: "'Se requiere' + sustantivo abstracto → registro formal/culto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Meter la pata' es: (un tecnicismo/una locución verbal/un refrán)"
        correctAnswer: una locución verbal
        rationale: "'Meter la pata' = equivocarse → locución verbal (significado no deducible de sus partes)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'A quien madruga, Dios le ayuda.' ¿Tipo de unidad fraseológica? (locución/modismo/refrán)"
        correctAnswer: refrán
        rationale: "Enunciado tradicional con valor proverbial → refrán."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Persona de avanzada edad' en lugar de 'viejo/a': ¿figura léxica? (disfemismo/tabú léxico/eufemismo)"
        correctAnswer: eufemismo
        rationale: "Sustitución de un término directo por uno más suave → eufemismo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Colocación correcta: ('cometer un error'/'hacer un error'/'tomar un error')"
        correctAnswer: cometer un error
        rationale: "'Cometer un error' es la colocación léxica fija en español."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es una colocación léxica? (una metáfora/una combinación habitual y preferida de palabras/un sinónimo)"
        correctAnswer: una combinación habitual y preferida de palabras
        rationale: "Las colocaciones son combinaciones que los hablantes nativos prefieren: dar un paseo (no *hacer un paseo)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre locución y refrán? (no hay diferencia/el refrán es un enunciado completo con valor moral; la locución es una unidad que funciona como palabra/la locución es más antigua)"
        correctAnswer: el refrán es un enunciado completo con valor moral; la locución es una unidad que funciona como palabra
        rationale: "Refrán: texto completo (A buen entendedor...). Locución: unidad léxica (estar en las nubes)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el registro adecuado para una instancia oficial? (coloquial/vulgar/formal/culto)"
        correctAnswer: formal/culto
        rationale: "Los documentos oficiales exigen registro formal con léxico preciso y frases impersonales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ponerse las pilas' es: (un tecnicismo/una locución coloquial/un refrán)"
        correctAnswer: una locución coloquial
        rationale: "'Ponerse las pilas' = espabilarse → locución verbal de registro coloquial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Colocación correcta: ('dar una conferencia'/*'hacer una conferencia'/'ambas son posibles')"
        correctAnswer: dar una conferencia
        rationale: "'Dar una conferencia' es la colocación normativa en español culto."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Paronimia y Relaciones Léxicas Avanzadas
    description: Distingue entre palabras que se confunden fácilmente.
    exercises:
      - type: grammar
        question: "'Tiene buena ___ para los idiomas.' (capacidad o habilidad) (actitud/aptitud/aptización)"
        correctAnswer: aptitud
        rationale: "'Aptitud' = capacidad o habilidad; 'actitud' = disposición anímica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Su ___ ante el trabajo es muy positiva.' (disposición) (aptitud/actitud/actividad)"
        correctAnswer: actitud
        rationale: "'Actitud' = disposición o manera de enfrentarse a algo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El ___ de la empresa es muy bueno.' (imagen percibida) (imagen/prestigio/prest)"
        correctAnswer: prestigio
        rationale: "'Prestigio' = reputación o renombre alcanzado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los parónimos? (sinónimos perfectos/palabras con forma similar pero significado distinto/palabras de origen griego)"
        correctAnswer: palabras con forma similar pero significado distinto
        rationale: "Parónimos: forma parecida, significado diferente. Ej.: aptitud/actitud, infringir/infligir."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Parónimo de 'adaptar': (adoptar/adopción/adaptación)"
        correctAnswer: adoptar
        rationale: "'Adaptar' (ajustar) y 'adoptar' (asumir o acoger) son parónimos frecuentes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El juez ___ una multa.' (imponer un castigo) (infligió/infringió/inflijó)"
        correctAnswer: infligió
        rationale: "'Infligir' = imponer (un castigo). 'Infringir' = incumplir (una norma)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ la ley está penado.' (incumplir) (Infligir/Infringir/Infrinjir)"
        correctAnswer: Infringir
        rationale: "'Infringir' = incumplir una norma o ley."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Eufemismo de 'despedir a un empleado': (dejar de pagar/prescindir de sus servicios/echarle)"
        correctAnswer: prescindir de sus servicios
        rationale: "'Prescindir de los servicios' suaviza el término 'despedir' → eufemismo laboral."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el registro de 'yantar'? (coloquial moderno/arcaísmo culto/tecnicismo)"
        correctAnswer: arcaísmo culto
        rationale: "'Yantar' = comer → arcaísmo usado hoy en contextos poéticos o irónicos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Colocación correcta con 'decisión': ('hacer una decisión'/'tomar una decisión'/'coger una decisión')"
        correctAnswer: tomar una decisión
        rationale: "'Tomar una decisión' es la colocación normativa; *hacer/coger son incorrectas."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
