title: Lectura - La Migración de las Aves
level: D
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo científico de divulgación. Vocabulario ornitológico y ecológico. Identificar causas, mecanismos, amenazas y datos precisos de un fenómeno natural complejo."
example: "Localiza mecanismos (cómo), causas (por qué) y consecuencias antes de responder."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Cada año, más de cinco mil millones de aves migran a través del planeta para escapar del frío invernal y encontrar alimento. La golondrina común, por ejemplo, vuela desde Europa hasta el sur de África, cubriendo más de diez mil kilómetros en cada viaje. Las aves utilizan varios sistemas de orientación: el campo magnético terrestre, las estrellas, el sol y los puntos de referencia geográficos. Estudios recientes han demostrado que ciertas especies poseen células especializadas en el ojo que detectan el campo magnético, actuando como una brújula biológica. La migración es un fenómeno arriesgado: hasta un 50 por ciento de los migrantes mueren durante el viaje por agotamiento, depredadores, tormentas y colisiones con estructuras humanas como torres de telecomunicaciones y edificios acristalados. El cambio climático está alterando los ciclos migratorios: los inviernos más cálidos hacen que algunas especies ya no necesiten migrar, mientras que otras llegan a sus destinos de cría cuando el alimento aún no está disponible. Esta desincronización se denomina mismatch ecológico."
    exercises:
      - type: reading
        question: "¿Cuántas aves migran cada año aproximadamente? (mil millones/más de cinco mil millones/cincuenta millones)"
        correctAnswer: más de cinco mil millones
        rationale: "El texto: 'más de cinco mil millones de aves migran'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Adónde migra la golondrina común desde Europa? (al norte de África/al sur de África/a América del Sur)"
        correctAnswer: al sur de África
        rationale: "El texto: 'vuela desde Europa hasta el sur de África'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos kilómetros cubre la golondrina en cada viaje? (cinco mil/más de diez mil/veinte mil)"
        correctAnswer: más de diez mil
        rationale: "El texto: 'cubriendo más de diez mil kilómetros en cada viaje'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué sistemas de orientación usan las aves? (solo el sol/campo magnético, estrellas, sol y puntos geográficos/solo puntos geográficos)"
        correctAnswer: campo magnético, estrellas, sol y puntos geográficos
        rationale: "El texto: 'el campo magnético terrestre, las estrellas, el sol y los puntos de referencia geográficos'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde se encuentran las células que detectan el campo magnético? (en el cerebro/en el ojo/en las alas)"
        correctAnswer: en el ojo
        rationale: "El texto: 'ciertas especies poseen células especializadas en el ojo que detectan el campo magnético'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué porcentaje de aves migrantes puede morir durante el viaje? (hasta un 10%/hasta un 30%/hasta un 50%)"
        correctAnswer: hasta un 50%
        rationale: "El texto: 'hasta un 50 por ciento de los migrantes mueren durante el viaje'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué estructuras humanas causan colisiones mencionadas en el texto? (tendidos eléctricos y carreteras/torres de telecomunicaciones y edificios acristalados/presas y molinos)"
        correctAnswer: torres de telecomunicaciones y edificios acristalados
        rationale: "El texto: 'colisiones con estructuras humanas como torres de telecomunicaciones y edificios acristalados'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué efecto tiene el cambio climático en algunas especies que ya no necesitan migrar? (migran más lejos/se quedan en sus zonas de origen/se extinguen)"
        correctAnswer: se quedan en sus zonas de origen
        rationale: "El texto: 'los inviernos más cálidos hacen que algunas especies ya no necesiten migrar'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es el 'mismatch ecológico'? (la ruta de migración/la desincronización entre la llegada de las aves y la disponibilidad de alimento/la pérdida de orientación)"
        correctAnswer: la desincronización entre la llegada de las aves y la disponibilidad de alimento
        rationale: "El texto: 'Esta desincronización se denomina mismatch ecológico'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con qué compara el texto la capacidad de detectar el campo magnético? (con un radar/con una brújula biológica/con un GPS)"
        correctAnswer: con una brújula biológica
        rationale: "El texto: 'actuando como una brújula biológica'."
        difficulty: 4
        objectives: [es.pre_reading]
target: 10
