title: ✏️ Gramática - Perífrasis Verbales
level: D
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Perífrasis verbales: verbo auxiliar (conjugado) + nexo (a/de/que/∅) + verbo en forma no personal (infinitivo, gerundio o participio). De infinitivo: ir a + inf (futuro/intención), tener que + inf (obligación), deber + inf (obligación/probabilidad), deber de + inf (probabilidad/deducción), acabar de + inf (acción reciente), volver a + inf (repetición), empezar a + inf (inicio), dejar de + inf (cese), ponerse a + inf (inicio súbito), llegar a + inf (logro). De gerundio: estar + ger (en curso), seguir + ger (continuación), llevar + tiempo + ger (duración). De participio: llevar + part, tener + part, dejar + part (resultado)."
example: "intención/futuro → voy a estudiar. obligación → tengo que estudiar. deducción → debe de ser tarde. repetición → volvió a llamar. cese → dejó de fumar. duración → llevo dos horas estudiando."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Tipo e Interpretación
    description: Identifica el significado de la perífrasis.
    exercises:
      - type: grammar
        question: "'Voy a llamarte esta tarde.' ¿Qué expresa? (obligación/intención o futuro próximo/repetición)"
        correctAnswer: intención o futuro próximo
        rationale: "Ir a + inf. expresa intención o futuro inmediato."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Debes estudiar más.' ¿Qué expresa? (acción reciente/obligación o recomendación/probabilidad)"
        correctAnswer: obligación o recomendación
        rationale: "Deber + inf. (sin 'de') expresa obligación o consejo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Debe de ser tarde.' ¿Qué expresa? (obligación/intención/deducción o probabilidad)"
        correctAnswer: deducción o probabilidad
        rationale: "Deber de + inf. expresa deducción o probabilidad → debe de ser las tres."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Acabo de llegar.' ¿Qué expresa? (acción futura/acción inmediatamente pasada/acción habitual)"
        correctAnswer: acción inmediatamente pasada
        rationale: "Acabar de + inf. indica acción recién concluida."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Volvió a llamar.' ¿Qué expresa? (inicio/cese/repetición)"
        correctAnswer: repetición
        rationale: "Volver a + inf. indica que la acción se repite."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Dejó de fumar hace un año.' ¿Qué expresa? (inicio/repetición/cese o interrupción)"
        correctAnswer: cese o interrupción
        rationale: "Dejar de + inf. indica que la acción cesa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Lleva tres horas estudiando.' ¿Qué expresa? (acción futura/duración de acción en curso/acción reciente)"
        correctAnswer: duración de acción en curso
        rationale: "Llevar + tiempo + gerundio indica duración de una acción que continúa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Sigue lloviendo.' ¿Qué expresa? (inicio/cese/continuación)"
        correctAnswer: continuación
        rationale: "Seguir + gerundio indica que la acción continúa sin interrupción."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Se puso a llorar.' ¿Qué expresa? (cese/inicio súbito/duración)"
        correctAnswer: inicio súbito
        rationale: "Ponerse a + inf. indica inicio brusco o inesperado de la acción."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llegó a ser directora.' ¿Qué expresa? (cese/acción reciente/logro tras esfuerzo)"
        correctAnswer: logro tras esfuerzo
        rationale: "Llegar a + inf. expresa el logro de algo tras un proceso."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Elección y Contraste
    description: Elige la perífrasis correcta según el contexto.
    exercises:
      - type: grammar
        question: "'___ descansar; llevas muchas horas trabajando.' (obligación o consejo) (Acabas de/Debes/Sigues)"
        correctAnswer: Debes
        rationale: "Consejo o recomendación → deber + inf.: debes descansar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ llamar al médico esta tarde.' (intención futura) (Voy a/Acabo de/Dejo de)"
        correctAnswer: Voy a
        rationale: "Intención de acción futura → ir a + inf.: voy a llamar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál expresa que algo ha empezado hace poco? (Volvió a llegar./Acababa de llegar./Sigue llegando.)"
        correctAnswer: Acababa de llegar.
        rationale: "Acabar de + inf. en imperfecto = había llegado muy poco antes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál expresa que algo se interrumpió? (Empezó a hablar./Dejó de hablar./Siguió hablando.)"
        correctAnswer: Dejó de hablar.
        rationale: "Dejar de + inf. = cese de la acción."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre 'deber + inf.' y 'deber de + inf.'? (son equivalentes/deber = obligación; deber de = probabilidad/deducción/solo de registro)"
        correctAnswer: deber = obligación; deber de = probabilidad/deducción
        rationale: "Debes ir (obligación) ≠ debes de estar cansado (probabilidad)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ cuatro horas esperando.' (duración en curso) (Llevo/Voy a/Acabo de)"
        correctAnswer: Llevo
        rationale: "Llevar + tiempo + gerundio indica duración de la espera hasta ahora."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ a estudiar nada más llegar.' (inicio inmediato) (Volví/Me puse/Acabé)"
        correctAnswer: Me puse
        rationale: "Ponerse a + inf. = empezar de golpe: me puse a estudiar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Identifica la perífrasis en: 'Tenemos que salir ya.' (tener que + inf. = obligación/tener + part. = resultado/estar + ger. = en curso)"
        correctAnswer: tener que + inf. = obligación
        rationale: "Tener que + inf. expresa obligación: tenemos que salir."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ trabajando en este proyecto desde enero.' (duración pasada) (Llevo/Acabo de/Empiezo a)"
        correctAnswer: Llevo
        rationale: "Llevar + gerundio desde = duración de acción en curso desde un punto del pasado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué perífrasis expresa repetición de una acción? (empezar a/volver a/dejar de)"
        correctAnswer: volver a
        rationale: "Volver a + inf. indica que la acción ocurre de nuevo."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
