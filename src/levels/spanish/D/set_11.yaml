title: 🔬 Gramática - Sintaxis Avanzada - El Sujeto
level: D
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "El sujeto: siempre concuerda con el verbo en persona y número. Sujeto léxico vs. sujeto desinencial (expresado por desinencia verbal). Sujeto omitido (pro-drop): en español puede omitirse porque la desinencia lo indica (Como ≠ inglés I eat). Sujeto no explícito obligatorio (impersonal): llover, amanecer, haber existencial. Sujeto tácito e inductor de concordancia en compuestos. Casos especiales: sustantivos colectivos (la gente quiere ≠ *la gente quieren), oraciones con infinitivo sujeto, sujeto pospuesto (énfasis: llegaron los invitados)."
example: "pro-drop → 'Comemos a las dos' (el sujeto nosotros está implícito). colectivo → 'la gente quiere' (sing.). pospuesto → 'llegaron los niños' (sujeto tras verbo, énfasis). impersonal → 'llueve' (no hay sujeto)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Identificar y Analizar el Sujeto
    description: Identifica el sujeto o elige la forma correcta.
    exercises:
      - type: grammar
        question: "'Llegaron los invitados.' ¿Cuál es el sujeto? (llegaron/los invitados/ninguno)"
        correctAnswer: los invitados
        rationale: "El sujeto pospuesto (énfasis) es 'los invitados', que concuerda con el verbo plural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llueve.' ¿Tiene sujeto esta oración? (sí: 'el tiempo'/no, es impersonal/sí: 'se')"
        correctAnswer: no, es impersonal
        rationale: "Verbos meteorológicos como llover son impersonales: no tienen sujeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La gente ___ muy nerviosa.' (colectivo singular) (están/estamos/está)"
        correctAnswer: está
        rationale: "'La gente' es un sustantivo colectivo → concuerda en singular: está."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Cantar bajo la lluvia ___ muy romántico.' (infinitivo sujeto) (son/es/son muy)"
        correctAnswer: es
        rationale: "Infinitivo sujeto → verbo en 3ª sg.: cantar... es romántico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Hay muchos problemas.' ¿Tiene sujeto 'hay'? (sí: muchos problemas/no, 'hay' es impersonal/sí: implícito)"
        correctAnswer: no, 'hay' es impersonal
        rationale: "'Haber' existencial es impersonal: 'muchos problemas' es el objeto directo, no el sujeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Comemos a las dos.' ¿Está el sujeto expreso? (sí: nosotros/no, está implícito en la desinencia -emos/sí: las dos)"
        correctAnswer: no, está implícito en la desinencia -emos
        rationale: "En español, el sujeto pronominal puede omitirse (pro-drop): -emos = nosotros."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué puede omitirse el sujeto pronominal en español? (porque es innecesario/porque la desinencia verbal expresa persona y número/porque el español es más informal)"
        correctAnswer: porque la desinencia verbal expresa persona y número
        rationale: "El español es una lengua de sujeto nulo: la desinencia identifica al sujeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La mitad de los estudiantes ___ aprobado.' (concordancia con núcleo o sintagma) (ha/han/ambas son posibles según el énfasis)"
        correctAnswer: ambas son posibles según el énfasis
        rationale: "'La mitad de' puede concordar con el núcleo sg. (ha) o con el complemento pl. (han) según el énfasis."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El equipo ___ ganado el campeonato.' (colectivo) (han/ha/habéis)"
        correctAnswer: ha
        rationale: "'El equipo' es colectivo singular → ha ganado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el sujeto en 'Se me cayó el vaso'? (se/me/el vaso)"
        correctAnswer: el vaso
        rationale: "'El vaso' es el sujeto (concuerda con 'cayó' sg.); 'me' es CI; 'se' es marca de involuntariedad."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Concordancia y Estructuras Especiales
    description: Elige la forma correcta de concordancia.
    exercises:
      - type: grammar
        question: "'Juan y María ___ muy puntuales.' (sujeto compuesto) (es/son/somos)"
        correctAnswer: son
        rationale: "Sujeto compuesto (Juan + María) = plural → son."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ni él ni ella ___ dicho nada.' (coordinación negativa) (ha/han/habéis)"
        correctAnswer: han
        rationale: "'Ni... ni...' con dos sujetos → plural: han dicho."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tanto el director como los empleados ___ de acuerdo.' (sujeto compuesto) (está/estamos/están)"
        correctAnswer: están
        rationale: "'Tanto... como...' con dos sujetos → plural: están."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Hace frío.' ¿Tiene sujeto? (sí: frío/no, es impersonal/sí: hace)"
        correctAnswer: no, es impersonal
        rationale: "'Hacer' en expresiones meteorológicas es impersonal: no tiene sujeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ muchas personas esperando.' (haber existencial, impersonal) (Hay/Han/Están)"
        correctAnswer: Hay
        rationale: "'Haber' existencial es impersonal y siempre va en 3ª sg.: hay."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'O tú o ella ___ mentido.' (sujeto disyuntivo, concordancia con el más próximo) (has/ha/habéis)"
        correctAnswer: ha
        rationale: "Con 'o... o...' el verbo concuerda con el sujeto más próximo: ella → ha."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La mayoría de los alumnos ___ superado el examen.' (concordancia con el complemento plural) (ha/han/habéis)"
        correctAnswer: han
        rationale: "Con 'la mayoría de + plural' es habitual la concordancia en plural: han."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "En 'Vino Ana', ¿el sujeto es tópico o foco? (tópico, posición normal/foco, posición marcada de énfasis/no hay sujeto)"
        correctAnswer: foco, posición marcada de énfasis
        rationale: "El sujeto pospuesto al verbo se interpreta como foco informativo: es Ana quien vino."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El público ___ aplaudiendo durante cinco minutos.' (colectivo) (estuvo/estuvieron/estuvisteis)"
        correctAnswer: estuvo
        rationale: "'El público' colectivo sg. → estuvo aplaudiendo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el sujeto desinencial? (un sujeto con mucho contenido semántico/el sujeto expresado por la desinencia verbal sin pronombre explícito/el sujeto en posición pospuesta)"
        correctAnswer: el sujeto expresado por la desinencia verbal sin pronombre explícito
        rationale: "En 'comemos', la desinencia -emos expresa el sujeto nosotros → sujeto desinencial."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
