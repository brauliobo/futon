title: ✏️ Gramática - Subjuntivo en Oraciones Sustantivas
level: D
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Oraciones sustantivas de objeto: verbos de lengua/pensamiento con negación/duda → subjuntivo (no creo que sea); verbos de volición → subjuntivo (quiero que vengas); verbos de emoción → subjuntivo (me alegra que hayas venido); verbos de percepción + realidad → indicativo (veo que llegas), negados o dubitados → subjuntivo (no veo que llegues). Verbos de comunicación afirmativos → indicativo (dice que viene); negados → subjuntivo (no dice que venga)."
example: "certeza → ind.: sé que viene. duda → subj.: dudo que venga. emoción → subj.: me alegra que venga. volición → subj.: quiero que venga. decir afirm. → ind.: dice que llega. decir neg. → subj.: no dice que llegue."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Indicativo vs Subjuntivo en Sustantivas
    description: Elige el modo correcto.
    exercises:
      - type: grammar
        question: "'Sé que ___ razón.' (certeza) (tuvieras/tengas/tienes)"
        correctAnswer: tienes
        rationale: "Saber = certeza → indicativo: tienes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Dudo que ___ razón.' (duda) (tuvieras/tienes/tengas)"
        correctAnswer: tengas
        rationale: "Dudar = duda → subjuntivo: tengas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me alegra que ___ bien.' (emoción, resultado presente) (estarás/estás/estés)"
        correctAnswer: estés
        rationale: "Emoción → subjuntivo: estés."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quiero que ___ la puerta.' (volición) (cierras/cierres/cerrarás)"
        correctAnswer: cierres
        rationale: "Querer = volición → subjuntivo: cierres."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Dice que ___ mañana.' (comunicación afirmativa) (venga/vendrá/viene)"
        correctAnswer: viene
        rationale: "Decir afirmativo = transmite información → indicativo: viene."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No dice que ___ mañana.' (comunicación negada) (viene/vendrá/venga)"
        correctAnswer: venga
        rationale: "Decir negado → se cuestiona la información → subjuntivo: venga."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Es evidente que ___ la solución correcta.' (evidencia = certeza) (sea/es/fuera)"
        correctAnswer: es
        rationale: "Ser evidente = certeza → indicativo: es."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No es verdad que ___ mentido.' (negación de certeza) (ha/haya/había)"
        correctAnswer: haya
        rationale: "Negar la verdad = cuestionar → subjuntivo perfecto: haya mentido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me sorprende que no ___ nada.' (emoción) (dices/digas/dijiste)"
        correctAnswer: digas
        rationale: "Sorprender = emoción → subjuntivo: digas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Parece que ___ a llover.' (apariencia como certeza) (vaya/va/fuera)"
        correctAnswer: va
        rationale: "Parecer afirmativo = certeza aparente → indicativo: va."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Concordancia Temporal en Sustantivas
    description: Elige el tiempo de subjuntivo correcto.
    exercises:
      - type: grammar
        question: "'Quiero que ___ hoy.' (pres. subj. de venir) (venga/viniera/haya venido)"
        correctAnswer: venga
        rationale: "Verbo principal presente + acción presente/futura → presente subj.: venga."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quería que ___ ayer.' (imp. subj. de venir) (venga/viniera/haya venido)"
        correctAnswer: viniera
        rationale: "Verbo principal pasado + acción simultánea/posterior → imp. subj.: viniera."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me alegra que ___ ayer.' (subj. perfecto de venir) (vengas/hayas venido/vinieras)"
        correctAnswer: hayas venido
        rationale: "Verbo principal presente + acción anterior → subj. perfecto: hayas venido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Me alegró que ___ el día anterior.' (pluscuamperfecto subj.) (hayas venido/hubieras venido/vinieras)"
        correctAnswer: hubieras venido
        rationale: "Verbo principal pasado + acción aún anterior → pluscuamperfecto subj.: hubieras venido."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No creo que ___ en ese momento.' (imp. subj. de estar) (esté/estuviera/haya estado)"
        correctAnswer: estuviera
        rationale: "No creer (pasado o condicional) + acción simultánea → imp. subj.: estuviera."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo usan indicativo los verbos de percepción? (cuando están negados/cuando expresan realidad/cuando expresan duda)"
        correctAnswer: cuando expresan realidad
        rationale: "Ver/notar/sentir + realidad → indicativo. Negados o dubitativos → subjuntivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Espero que todo ___ bien.' (presente subj. de ir) (va/vaya/fuera)"
        correctAnswer: vaya
        rationale: "Esperar = volición-emoción → subjuntivo: vaya."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Temía que ___ demasiado tarde.' (imp. subj. de ser) (sea/fuera/haya sido)"
        correctAnswer: fuera
        rationale: "Temer (pasado) + acción simultánea → imp. subj.: fuera."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Es necesario que haya cambio de sujeto para usar subjuntivo en sustantiva? (siempre/no siempre; hay verbos impersonales sin sujeto explícito que también lo exigen/sí, siempre)"
        correctAnswer: no siempre; hay verbos impersonales sin sujeto explícito que también lo exigen
        rationale: "'Es necesario que llegues' no implica cambio de sujeto personal; el impersonal exige subj. igualmente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige la correcta: ('Creo que tiene razón.'/'Creo que tenga razón.'/'Creo que tuviera razón.')"
        correctAnswer: Creo que tiene razón.
        rationale: "Creer afirmativo = certeza → indicativo: tiene razón."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
