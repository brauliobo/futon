title: 📝 Gramática - Historia de la Lengua Española
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Origen del español: latín vulgar hablado en Hispania. Sustrato prerromano (vasco, celtíbero, ibérico), adstrato germánico (visigodos), adstrato árabe (8 siglos). Etapas: latín hispánico → romance hispánico (siglos IX-X: glosas emilianenses/silenses) → castellano medieval (Cantar de Mío Cid s. XII, Alfonso X el Sabio s. XIII) → Siglo de Oro (Nebrija: primera gramática 1492) → español moderno. Evolución fonética: F inicial latina → h aspirada → h muda; PL-,CL-,FL- → ll. Cambios morfosintácticos: pérdida de declinaciones latinas, aparición del artículo."
example: "latín FILIUM → hijo (F→h, LI→j). latín PLUVIA → lluvia (PL→ll). glosas emilianenses s. X → primeros textos en romance. Nebrija 1492 → primera gramática del español. árabe → alcázar, azúcar, al-."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Origen y Etapas del Español
    description: Identifica las etapas y cambios de la historia del español.
    exercises:
      - type: grammar
        question: "¿De qué lengua desciende el español? (el griego clásico/el latín vulgar hablado en Hispania/el árabe)"
        correctAnswer: el latín vulgar hablado en Hispania
        rationale: "El español, como todas las lenguas romances, desciende del latín vulgar (hablado), no del latín clásico literario."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las Glosas Emilianenses? (el primer diccionario español/anotaciones en romance del siglo X que son los primeros textos escritos en español/una obra literaria medieval)"
        correctAnswer: anotaciones en romance del siglo X que son los primeros textos escritos en español
        rationale: "Las Glosas Emilianenses (Monasterio de San Millán, s. X) son las primeras manifestaciones escritas del romance hispánico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Quién escribió la primera gramática del español y en qué año? (Alfonso X, 1260/Antonio de Nebrija, 1492/Miguel de Cervantes, 1605)"
        correctAnswer: Antonio de Nebrija, 1492
        rationale: "Antonio de Nebrija publicó la 'Gramática de la lengua castellana' en 1492, la primera de una lengua romance."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el sustrato prerromano más relevante del español? (el árabe/el latín/el vasco e ibérico)"
        correctAnswer: el vasco e ibérico
        rationale: "El sustrato prerromano incluye el vasco (que sobrevivió) y el ibérico, celtíbero y otros que dejaron huella léxica y fonética."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué cambio fonético sufrió la F- inicial latina? (se mantuvo igual/evolucionó a h aspirada y luego a h muda en castellano/se perdió totalmente en todos los dialectos)"
        correctAnswer: evolucionó a h aspirada y luego a h muda en castellano
        rationale: "Evolución: FILIUM→hijo, FABULARE→hablar; la F- latina > h- castellana (hoy muda en la norma estándar)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué cambio fonético sufrió el grupo latino PL- inicial? (PL→pl (se mantuvo)/PL→ll en castellano/PL→bl)"
        correctAnswer: PL→ll en castellano
        rationale: "PL-, CL-, FL- iniciales latinas > ll en castellano: PLUVIA→lluvia, CLAVE→llave, FLAMMA→llama."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la principal obra literaria del español medieval del siglo XII? (Lazarillo de Tormes/Cantar de Mío Cid/La Celestina)"
        correctAnswer: Cantar de Mío Cid
        rationale: "El Cantar de Mío Cid (c. 1200) es el texto literario medieval más importante del castellano medieval."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál fue la contribución de Alfonso X el Sabio al castellano? (creó el primer alfabeto/fijó el castellano como lengua de cultura y administración en el siglo XIII/escribió el Quijote)"
        correctAnswer: fijó el castellano como lengua de cultura y administración en el siglo XIII
        rationale: "Alfonso X promovió el castellano como lengua de la prosa culta, la ciencia y la administración reales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántos siglos duró la influencia árabe en la Península Ibérica? (dos/ocho/cuatro)"
        correctAnswer: ocho
        rationale: "La presencia árabe en Hispania duró aproximadamente ocho siglos (711-1492), dejando unas 4.000 palabras en español."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué perdió el español respecto al latín en su morfosintaxis? (los artículos/el sistema de declinaciones/los tiempos verbales)"
        correctAnswer: el sistema de declinaciones
        rationale: "El latín tenía seis casos (nominativo, acusativo…); el español los perdió y los sustituyó por preposiciones."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Cambios Lingüísticos y Etapas
    description: Practica la evolución histórica del español.
    exercises:
      - type: grammar
        question: "¿Qué palabra latina dio origen a 'hablar'? (LABORARE/FABULARE/CAPILLARE)"
        correctAnswer: FABULARE
        rationale: "FABULARE (hablar, contar) > fablar > hablar (F-→h-, B→b/v)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El cambio OCULUM → ojo implica: (cambios fonéticos patrimoniales con -j-/el latín se mantuvo/influencia árabe)"
        correctAnswer: cambios fonéticos patrimoniales con -j-
        rationale: "OCULUM > *oclo > *ollo > ojo: múltiples cambios fonéticos propios de la evolución patrimonial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se considera que el español moderno está consolidado? (siglo X/siglo XV-XVI con la imprenta y el Siglo de Oro/siglo XVIII con la RAE)"
        correctAnswer: siglo XV-XVI con la imprenta y el Siglo de Oro
        rationale: "La imprenta (1450) y el Siglo de Oro fijaron la norma culta del español; la RAE (1713) la codificó institucionalmente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un germanismo en español? (un préstamo del árabe/una palabra de origen germánico (visigodo, franco)/una palabra griega)"
        correctAnswer: una palabra de origen germánico (visigodo, franco)
        rationale: "Los visigodos dejaron germanismos: guerra, guardar, robar, ganar, blanco, rico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el arabismo más frecuente en el léxico doméstico español? (libro/azúcar/tiempo)"
        correctAnswer: azúcar
        rationale: "'Azúcar' (árabe: al-sukkar) es arabismo; 'libro' es del latín LIBRUM; 'tiempo' del latín TEMPUS."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el español y el portugués son lenguas hermanas? (porque son idénticas/porque ambas descienden del latín vulgar y comparten evolución en la Península/porque el portugués viene del español)"
        correctAnswer: porque ambas descienden del latín vulgar y comparten evolución en la Península
        rationale: "Español y portugués son lenguas romances ibéricas que comparten origen latino y evolucionaron en la misma Península."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué nombre recibía el español en la Edad Media? (ibérico/castellano/hispánico)"
        correctAnswer: castellano
        rationale: "El español se llamó 'castellano' por surgir en el reino de Castilla; hoy ambos nombres son equivalentes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se fundó la Real Academia Española? (1492/1713/1850)"
        correctAnswer: 1713
        rationale: "La RAE fue fundada en 1713 bajo Felipe V para fijar, limpiar y dar esplendor a la lengua española."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué aportó la conquista de América al español? (eliminó los arabismos/incorporó americanismos: palabras de lenguas indígenas como 'tomate', 'chocolate', 'cacao'/solo expandió el número de hablantes)"
        correctAnswer: "incorporó americanismos: palabras de lenguas indígenas como 'tomate', 'chocolate', 'cacao'"
        rationale: "El contacto con las lenguas amerindias (náhuatl, quechua, taíno…) enriqueció el vocabulario español."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la lengua estándar? (la más hablada/la variedad de prestigio usada en la escritura formal, la educación y los medios de comunicación/la más antigua)"
        correctAnswer: la variedad de prestigio usada en la escritura formal, la educación y los medios de comunicación
        rationale: "La lengua estándar es la variedad de prestigio usada en la escritura formal, la educación y los medios de comunicación."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
