title: 📝 Gramática - Métrica y Versificación
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Métrica española: cómputo silábico (con licencias: sinalefa, hiato, diéresis, sinéresis), tipos de palabras al final del verso (aguda +1, llana, esdrújula -1). Versos más comunes: octosílabo (romance), endecasílabo (soneto, lira), heptasílabo, alejandrino (14 sílabas, 7+7). Rima: consonante (todos los sonidos desde la última vocal tónica) vs. asonante (solo vocales). Estrofas: cuarteto (ABBA), serventesio (ABAB), redondilla (abba), cuarteta (abab), soneto (2 cuartetos + 2 tercetos), lira (7a-11B-7a-7b-11B), romance (octosílabos, rima asonante en pares)."
example: "endecasílabo → 'un-no-sé-qué-que-que-dan-bal-bu-cien-do' (11 sílabas). sinalefa → 'de_el alma'. rima consonante → amor/dolor. rima asonante → alma/canta (a-a). romance → octosílabos, rima asonante en versos pares."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Cómputo Silábico y Rima
    description: Practica el análisis métrico.
    exercises:
      - type: grammar
        question: "¿Qué es la sinalefa? (separar dos vocales en distinto verso/unir en una sola sílaba la vocal final de una palabra con la inicial de la siguiente/añadir una sílaba al final de verso agudo)"
        correctAnswer: unir en una sola sílaba la vocal final de una palabra con la inicial de la siguiente
        rationale: "La sinalefa es la principal licencia métrica: 'de_alma' = 2 sílabas, no 3."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué ajuste se hace al contar sílabas de un verso que termina en palabra aguda? (restar una/no se modifica/sumar una)"
        correctAnswer: sumar una
        rationale: "Verso con fin agudo: se suma 1 sílaba a la cuenta (compensación métrica tradicional)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué ajuste se hace con verso que termina en palabra esdrújula? (sumar una/restar una/no se modifica)"
        correctAnswer: restar una
        rationale: "Verso con fin esdrújulo: se resta 1 sílaba (el acento recae dos sílabas antes de la última)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántas sílabas tiene un endecasílabo? (ocho/once/catorce)"
        correctAnswer: once
        rationale: "El endecasílabo tiene 11 sílabas; es el verso más importante de la poesía culta española (soneto, lira)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántas sílabas tiene un verso alejandrino? (doce/catorce/dieciséis)"
        correctAnswer: catorce
        rationale: "El alejandrino tiene 14 sílabas, divididas en dos hemistiquios de 7 (7+7), usado en la poesía modernista."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Amor/dolor': ¿tipo de rima? (asonante/consonante/libre)"
        correctAnswer: consonante
        rationale: "Amor (o-r) / dolor (o-r): coinciden todos los sonidos desde la vocal tónica → rima consonante."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Alma/canta': ¿tipo de rima? (consonante/asonante/sin rima)"
        correctAnswer: asonante
        rationale: "Alma (a-a) / canta (a-a): solo coinciden las vocales → rima asonante."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de verso usa el romance castellano? (endecasílabos con rima consonante/octosílabos con rima asonante en versos pares/alejandrinos con rima libre)"
        correctAnswer: octosílabos con rima asonante en versos pares
        rationale: "El romance es la forma métrica popular española por excelencia: octosílabos, rima asonante en pares (impares sueltos)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el hiato en métrica? (unir vocales/disolver la sinalefa natural manteniendo separadas las sílabas de dos palabras contiguas/eliminar una sílaba)"
        correctAnswer: disolver la sinalefa natural manteniendo separadas las sílabas de dos palabras contiguas
        rationale: "El hiato métrico es el recurso opuesto a la sinalefa: se cuentan por separado vocales que normalmente se fundirían."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántas sílabas tiene el heptasílabo? (siete/ocho/seis)"
        correctAnswer: siete
        rationale: "El heptasílabo tiene 7 sílabas; alterna con el endecasílabo en estrofas como la lira."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Estrofas y Análisis Métrico
    description: Identifica las estrofas y su estructura.
    exercises:
      - type: grammar
        question: "¿Qué es un soneto? (ocho endecasílabos de rima libre/dos cuartetos y dos tercetos de endecasílabos/cuatro redondillas de octosílabos)"
        correctAnswer: dos cuartetos y dos tercetos de endecasílabos
        rationale: "El soneto establece 14 versos endecasílabos: 2 cuartetos (ABBA ABBA) + 2 tercetos (CDC DCD o similares)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Esquema ABBA: ¿nombre de la estrofa? (serventesio/cuarteto/redondilla)"
        correctAnswer: cuarteto
        rationale: "El cuarteto es una estrofa de cuatro versos endecasílabos con rima ABBA."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Esquema ABAB (versos endecasílabos): ¿nombre? (cuarteto/serventesio/redondilla)"
        correctAnswer: serventesio
        rationale: "El serventesio es como el cuarteto pero con rima cruzada ABAB (endecasílabos)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Esquema abba (octosílabos): ¿nombre? (cuarteto/redondilla/serventesio)"
        correctAnswer: redondilla
        rationale: "La redondilla es la estrofa popular de cuatro octosílabos con rima abba (minúsculas = versos de arte menor)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "La lira tiene esquema: (7a-11B-7a-7b-11B/11A-11B-11A-11B/8a-8b-8a-8b)"
        correctAnswer: 7a-11B-7a-7b-11B
        rationale: "La lira establece el esquema 7a-11B-7a-7b-11B: alterna heptasílabos y endecasílabos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la diéresis en métrica? (unir dos vocales de un diptongo para añadir sílaba/disolver un diptongo contando sus vocales como sílabas separadas/una figura retórica)"
        correctAnswer: disolver un diptongo contando sus vocales como sílabas separadas
        rationale: "La diéresis separa un diptongo: 'suave' normalmente 2 sílabas → con diéresis 3: su-a-ve."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la sinéresis? (ampliar sílabas/unir en una sola sílaba dos vocales que no forman diptongo/separar consonantes)"
        correctAnswer: unir en una sola sílaba dos vocales que no forman diptongo
        rationale: "La sinéresis es lo contrario de la diéresis: 'real' (re-al = 2) > sinéresis: 1 sílaba = real."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el verso libre del verso blanco? (el verso libre no tiene rima ni métrica regular; el verso blanco tiene métrica regular sin rima/son sinónimos/el verso blanco no existe)"
        correctAnswer: el verso libre no tiene rima ni métrica regular; el verso blanco tiene métrica regular sin rima
        rationale: "Verso blanco: métrica fija, sin rima. Verso libre: sin métrica ni rima fijas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Verde que te quiero verde / verde viento verde ramas' (Lorca). ¿Tipo de verso? (endecasílabo/octosílabo/alejandrino)"
        correctAnswer: octosílabo
        rationale: "Ver-de-que-te-quie-ro-ver-de = 8 sílabas → octosílabo (con sinalefa: quie-ro-ver)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se llama la pausa interna obligatoria del alejandrino? (cesura/sinalefa/anacrusis)"
        correctAnswer: cesura
        rationale: "El alejandrino tiene cesura obligatoria en la séptima sílaba: divide el verso en dos hemistiquios de 7."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
