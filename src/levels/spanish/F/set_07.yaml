  - pageNumber: 1
    title: El Texto
    description: "Texto: El Impresionismo surgió en Francia a finales del siglo XIX como revolución contra la pintura académica oficial, que exigía temas históricos, mitológicos o religiosos tratados con acabado perfecto. Los pintores impresionistas, entre los que destacan Claude Monet, Pierre-Auguste Renoir, Edgar Degas y Camille Pissarro, prefirieron capturar el efecto de la luz natural sobre los objetos en un momento concreto, pintando al aire libre (en plein air) con pinceladas sueltas y colores puros. El nombre del movimiento proviene de una crítica irónica a la obra 'Impresión, sol naciente' de Monet (1872). Los impresionistas rechazaron el Salón oficial de París y organizaron sus propias exposiciones, la primera en 1874. El Posimpresionismo, representado por artistas como Paul Cézanne, Vincent van Gogh y Paul Gauguin, tomó como punto de partida el Impresionismo pero fue más allá: Cézanne exploró la geometría subyacente de la naturaleza (sentando las bases del Cubismo), Van Gogh expresó la emoción con colores intensos y pinceladas dinámicas (precursor del Expresionismo), y Gauguin buscó lo primitivo en las culturas de Oceanía. Así, el Impresionismo fue el punto de partida de toda la modernidad artística del siglo XX."
