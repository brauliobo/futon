title: 🔬 Gramática - Pragmática y Actos de Habla
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Pragmática: estudio del lenguaje en contexto. Actos de habla (Austin/Searle): locutivo (qué se dice), ilocutivo (qué se hace al decirlo: afirmar, prometer, ordenar, pedir), perlocutivo (efecto en el oyente). Actos directos vs. indirectos ('¿puedes abrir la ventana?' = orden indirecta). Principio de cooperación de Grice: máximas de cantidad, calidad, relevancia y modo. Implicaturas conversacionales. Deixis (personal, temporal, espacial). Cortesía verbal: actos amenazantes a la imagen (FTA) y estrategias de atenuación."
example: "ilocutivo → prometer al decir 'te lo juro'. acto indirecto → '¿tienes hora?' = pide la hora. implicatura → 'algo es algo' implica: no es mucho. máxima de relevancia → la respuesta debe ser pertinente al tema."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Actos de Habla y Principio de Cooperación
    description: Identifica el tipo de acto de habla.
    exercises:
      - type: grammar
        question: "¿Qué es el acto locutivo? (el efecto en el oyente/el hecho de emitir un enunciado con sentido/la intención del hablante)"
        correctAnswer: el hecho de emitir un enunciado con sentido
        rationale: "El acto locutivo es el acto de decir algo con forma y significado lingüístico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué acto ilocutivo realiza 'Te prometo que vendré'? (afirmar/ordenar/prometer)"
        correctAnswer: prometer
        rationale: "El verbo realizativo 'prometo' convierte el enunciado en una promesa → acto ilocutivo de promesa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Puedes bajar el volumen?' ¿Tipo de acto de habla? (pregunta sobre capacidad/acto indirecto de petición/afirmación)"
        correctAnswer: acto indirecto de petición
        rationale: "La forma interrogativa enmascara una petición directa → acto de habla indirecto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la implicatura conversacional? (un error gramatical/el significado implícito que el oyente infiere más allá del significado literal/una figura retórica)"
        correctAnswer: el significado implícito que el oyente infiere más allá del significado literal
        rationale: "La implicatura es lo que se comunica sin decirse explícitamente, deducido del contexto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál de las máximas de Grice se viola en 'La reunión fue larga, calurosa y empezó a las cinco'? (cantidad/calidad/modo)"
        correctAnswer: modo
        rationale: "La máxima de modo exige claridad y orden; mezclar evaluación y dato rompe la estructura esperada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa la máxima de calidad? (hablar brevemente/no decir lo que se cree falso ni aquello de lo que no se tiene evidencia/ser relevante)"
        correctAnswer: no decir lo que se cree falso ni aquello de lo que no se tiene evidencia
        rationale: "La máxima de calidad obliga a la sinceridad y a respaldar lo que se afirma."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Si alguien pregunta '¿Sabe cocinar María?' y la respuesta es 'Trabaja de cocinera', ¿qué implica? (que no sabe/que sí sabe cocinar (implicatura por relevancia)/que es ama de casa)"
        correctAnswer: que sí sabe cocinar (implicatura por relevancia)
        rationale: "La respuesta es relevante: si trabaja de cocinera, se infiere que sabe → implicatura conversacional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un FTA (Face Threatening Act)? (un cumplido/un acto que amenaza la imagen pública del interlocutor/una pregunta retórica)"
        correctAnswer: un acto que amenaza la imagen pública del interlocutor
        rationale: "Los FTA (órdenes directas, críticas, interrupciones) amenazan la imagen positiva o negativa del oyente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la estrategia de cortesía negativa más común en español? (tutear/el uso del condicional o subjuntivo para atenuar ('¿Podría decirme…?')/hablar en voz alta)"
        correctAnswer: el uso del condicional o subjuntivo para atenuar ('¿Podría decirme…?')
        rationale: "El condicional y el subjuntivo son recursos de atenuación que reducen la imposición → cortesía negativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el acto perlocutivo? (emitir el enunciado/la intención comunicativa/el efecto real producido en el oyente)"
        correctAnswer: el efecto real producido en el oyente
        rationale: "El acto perlocutivo es el efecto real producido en el oyente: convencer, asustar, alegrar…"
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Deixis, Cortesía e Implicaturas
    description: Aplica los conceptos pragmáticos.
    exercises:
      - type: grammar
        question: "¿Qué tipo de deixis es 'mañana' en 'Mañana te explico'? (espacial/personal/temporal)"
        correctAnswer: temporal
        rationale: "'Mañana' señala un momento relativo al tiempo del hablante → deixis temporal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué 'este' tiene deixis espacial? (porque es demostrativo de distancia media/porque señala lo que está cerca del hablante/porque es artículo)"
        correctAnswer: porque señala lo que está cerca del hablante
        rationale: "'Este/esta/esto' señalan proximidad al hablante → deixis espacial de primer grado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Podría usted cerrar la puerta?' ¿Qué estrategia de cortesía usa? (cortesía positiva/cortesía negativa: atenuación con condicional + usted/ausencia de cortesía)"
        correctAnswer: "cortesía negativa: atenuación con condicional + usted"
        rationale: "El condicional reduce la imposición de la orden y 'usted' marca respeto → cortesía negativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se viola la máxima de cantidad? (al decir algo falso/al dar demasiada o muy poca información/al ser irrelevante)"
        correctAnswer: al dar demasiada o muy poca información
        rationale: "La máxima de cantidad exige dar la información necesaria: ni más ni menos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia un acto directo de un indirecto? (la lengua usada/en el acto directo la forma coincide con la función; en el indirecto hay discrepancia/la cortesía)"
        correctAnswer: en el acto directo la forma coincide con la función; en el indirecto hay discrepancia
        rationale: "Orden directa: '¡Cierra la puerta!' Orden indirecta: '¿Puedes cerrar la puerta?' → misma función, distinta forma."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Es algo' como respuesta a '¿Ganaste mucho?' implica: (que ganó mucho/que no ganó mucho (implicatura escalar)/que no sabe cuánto ganó)"
        correctAnswer: que no ganó mucho (implicatura escalar)
        rationale: "La implicatura escalar: decir 'algo' implica que no se puede decir 'mucho' → ganó poco."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la función de los verbos realizativos (performativos)? (describir acciones/ejecutar la acción al ser pronunciados/expresar sentimientos)"
        correctAnswer: ejecutar la acción al ser pronunciados
        rationale: "Los verbos realizativos ('prometo', 'juro', 'declaro') realizan la acción al enunciarse."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "Un hablante que da información irrelevante viola: (la máxima de calidad/la máxima de relevancia/la máxima de modo)"
        correctAnswer: la máxima de relevancia
        rationale: "La máxima de relevancia (relación) exige que lo que se dice sea pertinente a la conversación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la deixis personal? (señalar al espacio/el sistema de pronombres que ancla el discurso a los participantes/la referencia temporal)"
        correctAnswer: el sistema de pronombres que ancla el discurso a los participantes
        rationale: "Deixis personal: yo (hablante), tú (oyente), él/ella (tercero ausente) → anclan el discurso."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Bueno, es que... no sé si puedo.' ¿Qué estrategia pragmática usan los titubeos y atenuadores? (cortesía positiva/atenuación/énfasis)"
        correctAnswer: atenuación
        rationale: "Los titubeos, marcadores de duda y atenuadores son recursos para mitigar la fuerza del acto de habla."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
