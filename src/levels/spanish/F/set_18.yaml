title: Gramática - La Novela Española Contemporánea
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Novela española del siglo XX: Generación del 98 (novela existencial: Baroja, Unamuno). Generación del 27 y novela de vanguardia. Novela de posguerra: tremendismo (Camilo José Cela: La familia de Pascual Duarte, La Colmena), realismo social (Alfonso Grosso, Juan Goytisolo). Generación de los 50: realismo crítico (Rafael Sánchez Ferlosio: El Jarama). Los años 70: experimentación (Luis Martín Santos: Tiempo de silencio). Novela democrática y actual: novela histórica, negra, de género. Premio Cervantes y Nobel."
example: "tremendismo → violencia y miseria existencial (Cela). realismo social → denuncia social objetivista. experimentación → monólogo interior y ruptura temporal (Martín Santos). novela histórica actual → reconstrucción del pasado desde el presente. Cela Nobel 1989."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Corrientes de la Novela Española
    description: Identifica corrientes, autores y obras.
    exercises:
      - type: grammar
        question: "¿Qué es el tremendismo en la novela española? (optimismo costumbrista/corriente que muestra la violencia, la miseria y la marginalidad existencial/el esteticismo modernista)"
        correctAnswer: corriente que muestra la violencia, la miseria y la marginalidad existencial
        rationale: "El tremendismo (Cela, 'La familia de Pascual Duarte', 1942) presenta una visión brutal y descarnada de la realidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Quién escribió 'La familia de Pascual Duarte'? (Francisco Umbral/Camilo José Cela/Juan Marsé)"
        correctAnswer: Camilo José Cela
        rationale: "'La familia de Pascual Duarte' (1942) de Camilo José Cela es la novela fundacional del tremendismo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo recibió Camilo José Cela el Premio Nobel? (1956/1977/1989)"
        correctAnswer: 1989
        rationale: "Camilo José Cela recibió el Premio Nobel de Literatura en 1989."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué técnica narrativa innovó Luis Martín Santos en 'Tiempo de silencio'? (el realismo costumbrista/el monólogo interior y la ruptura temporal/la narración oral)"
        correctAnswer: el monólogo interior y la ruptura temporal
        rationale: "'Tiempo de silencio' (1962) rompe con el realismo social con el monólogo interior y el lenguaje barroco experimental."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué caracteriza el realismo social de los años 50 en la novela española? (descripción subjetiva/denuncia objetivista de la realidad social, sin psicologismo/experimentación formal)"
        correctAnswer: denuncia objetivista de la realidad social, sin psicologismo
        rationale: "El realismo social (Sánchez Ferlosio, Juan Goytisolo) adopta un punto de vista objetivo-documental para denunciar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué novela de Sánchez Ferlosio es la obra maestra del realismo social español de los 50? (La Colmena/El Jarama/Nada)"
        correctAnswer: El Jarama
        rationale: "'El Jarama' (1956) de Rafael Sánchez Ferlosio, con su técnica objetivista y el tiempo real, ganó el Premio Nadal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la novela histórica contemporánea? (una novela medieval/novela que reconstruye el pasado histórico desde la perspectiva y sensibilidad del presente/una novela de aventuras)"
        correctAnswer: novela que reconstruye el pasado histórico desde la perspectiva y sensibilidad del presente
        rationale: "La novela histórica actual (Pérez-Reverte, Almudena Grandes) reconstruye el pasado con rigor histórico y mirada contemporánea."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La Colmena' de Cela presenta: (un protagonista único/cientos de personajes en el Madrid de la posguerra sin protagonista central/una novela de aventuras)"
        correctAnswer: cientos de personajes en el Madrid de la posguerra sin protagonista central
        rationale: "'La Colmena' (1951) es una novela coral: más de 300 personajes en el Madrid de 1942 sin protagonista único."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué novela de Unamuno explora la angustia existencial y el deseo de inmortalidad? (Niebla/San Manuel Bueno, mártir/ambas son correctas)"
        correctAnswer: ambas son correctas
        rationale: "'Niebla' (nivola) y 'San Manuel Bueno, mártir' son las dos obras más importantes de Unamuno sobre la fe y la existencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el Premio Cervantes? (el equivalente al Nobel para autores hispanohablantes/un premio solo para novelistas españoles/un premio de poesía)"
        correctAnswer: el equivalente al Nobel para autores hispanohablantes
        rationale: "El Premio Cervantes es el más prestigioso de las letras en español; se concede a toda la trayectoria de un autor."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis de la Novela
    description: Practica el análisis narratológico de la novela.
    exercises:
      - type: grammar
        question: "¿Qué es la estructura abierta en la novela? (la novela no tiene final/la novela no resuelve todos los conflictos, quedando abierta a la interpretación/la novela tiene varios narradores)"
        correctAnswer: la novela no resuelve todos los conflictos, quedando abierta a la interpretación
        rationale: "La estructura abierta (muy frecuente en la novela moderna) deja al lector la resolución final de los conflictos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la novela de aprendizaje o 'Bildungsroman'? (novela de aventuras/novela que narra el desarrollo psicológico y moral del protagonista desde la infancia/novela histórica)"
        correctAnswer: novela que narra el desarrollo psicológico y moral del protagonista desde la infancia
        rationale: "El Bildungsroman (Goethe, Dickens) sigue el crecimiento interior del protagonista de la ignorancia a la madurez."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la metaliteratura o metaficción? (literatura de ciencia ficción/obra literaria que reflexiona sobre su propia naturaleza como ficción/un subgénero de terror)"
        correctAnswer: obra literaria que reflexiona sobre su propia naturaleza como ficción
        rationale: "La metaficción (Cervantes, el Quijote; Unamuno, Niebla) cuestiona los límites entre realidad y ficción dentro de la obra."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué técnica narrativa es el 'stream of consciousness'? (diálogos teatrales/representación del pensamiento sin filtro lógico ni convenciones narrativas/narración en tercera persona)"
        correctAnswer: representación del pensamiento sin filtro lógico ni convenciones narrativas
        rationale: "La corriente de conciencia (Joyce, Woolf, Martín Santos) reproduce el flujo mental espontáneo del personaje."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué Unamuno llamó 'nivola' a sus novelas? (porque son muy largas/para distanciarse del concepto tradicional de novela y subrayar su carácter experimental/por sus temas filosóficos)"
        correctAnswer: para distanciarse del concepto tradicional de novela y subrayar su carácter experimental
        rationale: "Unamuno inventó el término 'nivola' para sus novelas filosóficas que rompen con el realismo decimonónico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el narrador no fiable? (un narrador que miente conscientemente/un narrador cuyo punto de vista está sesgado o es incompleto, creando ironía dramática/el narrador omnisciente)"
        correctAnswer: un narrador cuyo punto de vista está sesgado o es incompleto, creando ironía dramática
        rationale: "El narrador no fiable (unreliable narrator) da información incompleta o distorsionada → el lector debe desconfiar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la novela de la nouvelle? (la novela es siempre realista/la nouvelle es más breve que la novela y más extensa que el cuento, con trama más concentrada/son sinónimos)"
        correctAnswer: la nouvelle es más breve que la novela y más extensa que el cuento, con trama más concentrada
        rationale: "La nouvelle (novella) es un subgénero intermedio: mayor que el cuento, menor que la novela, con intensidad narrativa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el perspectivismo en la novela? (un solo punto de vista/la presentación de la realidad desde múltiples puntos de vista que no se anulan/el estilo directo libre)"
        correctAnswer: la presentación de la realidad desde múltiples puntos de vista que no se anulan
        rationale: "El perspectivismo (Ortega: 'La deshumanización del arte'; Cervantes) muestra que la realidad es multifacética."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "La autoficción es: (la autobiografía clásica/una forma narrativa donde el autor usa su propia vida como material pero con libertad ficcional/la novela histórica)"
        correctAnswer: una forma narrativa donde el autor usa su propia vida como material pero con libertad ficcional
        rationale: "La autoficción (Javier Cercas, Javier Marías) mezcla autobiografía y ficción de forma deliberadamente ambigua."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el espacio simbólico en la novela? (el lugar físico de los hechos/el espacio cargado de significados que va más allá del mero escenario/la descripción arquitectónica)"
        correctAnswer: el espacio cargado de significados que va más allá del mero escenario
        rationale: "El espacio simbólico (el laberinto en Borges, Macondo en García Márquez) tiene función semántica propia."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
