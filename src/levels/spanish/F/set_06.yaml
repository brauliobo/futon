title: 📝 Gramática - Variedades del Español - Dialectología
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Variedades geográficas del español: peninsular (castellano, andaluz, canario), hispanoamericano (caribeño, rioplatense, andino, mexicano). Variedades históricas: arcaísmos y neologismos. Variedades sociales: registros (formal/coloquial/vulgar), jergas, argot. Fenómenos dialectales: seseo (s por z/c), ceceo, yeísmo (ll=y), voseo (vos+verbos propios), tuteo, ustedeo. Norma panhispánica de la RAE/ASALE."
example: "seseo → 'caza'='casa' (sin distinción s/z). yeísmo → 'll' y 'y' pronunciadas igual. voseo → vos sabés (en lugar de tú sabes). rioplatense → uso del vos + tuteo ausente. norma → la RAE acepta variantes dialectales legítimas."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Fenómenos Dialectales
    description: Identifica las variedades y sus rasgos.
    exercises:
      - type: grammar
        question: "¿Qué es el seseo? (pronunciar 'll' como 'y'/pronunciar 'c' (ante e,i) y 'z' como 's'/pronunciar la 's' aspirada)"
        correctAnswer: pronunciar 'c' (ante e,i) y 'z' como 's'
        rationale: "El seseo fusiona la pronunciación de z/c+e,i y s en un único fonema /s/; es la norma en Hispanoamérica y sur de España."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿En qué se diferencia el seseo del ceceo? (no se diferencian/el seseo pronuncia todo como 's'; el ceceo pronuncia todo como 'z' (o 'θ')/el ceceo es el estándar peninsular)"
        correctAnswer: el seseo pronuncia todo como 's'; el ceceo pronuncia todo como 'z' (o 'θ')
        rationale: "Seseo: caza=casa=/s/. Ceceo: andaluz extremo que generaliza /θ/ para 's' y 'z/c'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el yeísmo? (aspiración de la s final/distinción entre ll y y/fusión de 'll' y 'y' en un único fonema)"
        correctAnswer: fusión de 'll' y 'y' en un único fonema
        rationale: "El yeísmo es la pronunciación igual de 'll' y 'y': 'valla'='vaya'. Es general en Hispanoamérica y muy extendido en España."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el voseo? (uso de 'usted' formal/uso de 'vosotros'/uso de 'vos' en lugar de 'tú' con formas verbales propias)"
        correctAnswer: uso de 'vos' en lugar de 'tú' con formas verbales propias
        rationale: "El voseo (Argentina, Uruguay, parte de Centroamérica) usa 'vos sabés' en lugar de 'tú sabes'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál de estas variedades caracteriza al español rioplatense? (ustedeo exclusivo/tuteo/voseo)"
        correctAnswer: voseo
        rationale: "El español rioplatense (Argentina, Uruguay) se caracteriza por el voseo como forma de tratamiento de confianza."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el ustedeo? (sinónimo de voseo/uso de usted en situaciones formales solo/uso de 'usted' tanto para trato formal como informal)"
        correctAnswer: uso de 'usted' tanto para trato formal como informal
        rationale: "En Colombia y algunas zonas de Centroamérica, 'usted' se usa también con amigos y familiares → ustedeo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué fenómeno fonético es la aspiración de la -s final en andaluz y canario? (seseo/la s final se debilita y se pronuncia como una aspiración [h] o desaparece/voseo)"
        correctAnswer: la s final se debilita y se pronuncia como una aspiración [h] o desaparece
        rationale: "La aspiración o pérdida de la -s final indica que la s final se debilita: rasgo del español meridional (andaluz, canario, caribeño)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué organismo establece la norma panhispánica del español? (solo la RAE/la RAE junto con las academias de los 22 países hispanohablantes (ASALE)/el gobierno de España)"
        correctAnswer: la RAE junto con las academias de los 22 países hispanohablantes (ASALE)
        rationale: "La norma panhispánica es el resultado del trabajo conjunto de la RAE y las academias de cada país hispanohablante."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un arcaísmo? (una palabra extranjera/una palabra que ha caído en desuso o es propia de etapas anteriores de la lengua/un neologismo técnico)"
        correctAnswer: una palabra que ha caído en desuso o es propia de etapas anteriores de la lengua
        rationale: "Los arcaísmos son palabras o formas que la lengua estándar ya no usa: 'vuesa merced', 'fenecer', 'ansí'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre dialecto y registro? (son sinónimos/el dialecto es variedad geográfica; el registro es variedad según situación comunicativa/el registro es solo escrito)"
        correctAnswer: el dialecto es variedad geográfica; el registro es variedad según situación comunicativa
        rationale: "Dialecto: variación según origen del hablante. Registro: variación según contexto (formal/coloquial)."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Variedades Sociales y Norma
    description: Practica las variedades sociales del español.
    exercises:
      - type: grammar
        question: "¿Qué es la jerga? (el español estándar/vocabulario específico de un grupo social o profesional/un dialecto geográfico)"
        correctAnswer: vocabulario específico de un grupo social o profesional
        rationale: "La jerga es el vocabulario específico de un grupo social o profesional: médica, juvenil, carcelaria."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el argot? (variedad regional/vocabulario de grupos marginales o informales con función de cohesión grupal/la norma académica)"
        correctAnswer: vocabulario de grupos marginales o informales con función de cohesión grupal
        rationale: "El argot (germanía, jerga juvenil) funciona como código de pertenencia grupal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la variedad de prestigio en México y gran parte de Hispanoamérica? (el castellano peninsular/el español estándar del centro de México/el español caribeño)"
        correctAnswer: el español estándar del centro de México
        rationale: "El español del altiplano mexicano (Ciudad de México y alrededores) es la variedad de mayor prestigio en México."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un neologismo? (una palabra antigua/una palabra de nueva creación o incorporación reciente al idioma/un préstamo rechazado)"
        correctAnswer: una palabra de nueva creación o incorporación reciente al idioma
        rationale: "Los neologismos responden a nuevas realidades: 'selfie', 'tuitear', 'emojis' son neologismos recientes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue el registro vulgar del coloquial? (el vulgar incumple normas gramaticales o sociales; el coloquial es informal pero correcto/son idénticos/el coloquial es más informal)"
        correctAnswer: el vulgar incumple normas gramaticales o sociales; el coloquial es informal pero correcto
        rationale: "El coloquial es legítimo pero informal; el vulgar contiene incorrecciones socialmente reprobadas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el español es una lengua pluricéntrica? (porque tiene un solo centro normativo/porque tiene múltiples centros de norma en distintos países/porque solo se habla en España)"
        correctAnswer: porque tiene múltiples centros de norma en distintos países
        rationale: "El español es pluricéntrico: no hay un único modelo normativo; cada país tiene su propia norma culta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El español caribeño (Cuba, Puerto Rico, República Dominicana) se caracteriza por: (el voseo/la aspiración o pérdida de la s y la r final de sílaba/el ceceo)"
        correctAnswer: la aspiración o pérdida de la s y la r final de sílaba
        rationale: "El español caribeño presenta debilitamiento de consonantes en posición implosiva: 'las casas' → ['lah 'kasah]."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Es el seseo un error? (sí, es incorrecto/no, es una variante dialectal legítima aceptada por la norma panhispánica/solo es correcto en América)"
        correctAnswer: no, es una variante dialectal legítima aceptada por la norma panhispánica
        rationale: "La RAE y la ASALE reconocen el seseo como norma legítima de los hispanohablantes de América y del sur de España."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la diglosia? (hablar dos lenguas/situación en que una comunidad usa dos variedades con funciones distintas (alta/baja)/sinónimo de bilingüismo)"
        correctAnswer: situación en que una comunidad usa dos variedades con funciones distintas (alta/baja)
        rationale: "Diglosia (Ferguson): una variedad alta (formal/prestigiosa) y una baja (informal/doméstica) conviven."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué forma verbal usa el voseo rioplatense para el presente de 'tener'? (tenéis/tenés/tienes)"
        correctAnswer: tenés
        rationale: "Voseo rioplatense: vos tenés, vos sabés, vos sos → desinencias propias distintas al tuteo."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
