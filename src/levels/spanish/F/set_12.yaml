pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La mecánica cuántica, desarrollada durante la primera mitad del siglo XX, describe el comportamiento de la materia y la energía a escala subatómica y desafía radicalmente nuestra intuición sobre la realidad. Uno de sus principios fundamentales es el principio de incertidumbre de Heisenberg, que afirma que no es posible conocer con precisión simultánea la posición y el momento (velocidad por masa) de una partícula: cuanto más precisamente se mide uno, menos precisamente se puede conocer el otro. Otro fenómeno central es la superposición cuántica: una partícula puede existir en múltiples estados simultáneamente hasta que es observada, momento en que colapsa en uno solo. Este principio se ilustra con el famoso experimento mental del gato de Schrödinger. El entrelazamiento cuántico describe cómo dos partículas pueden correlacionarse de forma instantánea independientemente de la distancia, fenómeno que Einstein llamó 'acción fantasmal a distancia' y que tiene aplicaciones en la criptografía y los ordenadores cuánticos. La física cuántica es la base de tecnologías cotidianas como el láser, los semiconductores y la resonancia magnética, aunque su interpretación filosófica sigue siendo objeto de debate entre los físicos."
