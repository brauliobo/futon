title: 📝 Gramática - El Texto Literario - Narración y Punto de Vista
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Narrador: omnisciente (sabe todo, 3ª persona), protagonista (1ª persona, limitado), testigo (3ª persona, observador externo), segunda persona (tú). Focalización: cero (omnisciente), interna (sigue la conciencia del personaje), externa (observador sin acceso al interior). Monólogo interior y corriente de conciencia. Tiempo narrativo: orden (analepsis/flashback, prolepsis/anticipación), duración (escena, resumen, elipsis, pausa descriptiva), frecuencia (singulativa, iterativa, repetitiva). Espacio diegético y extradiegético. Intertextualidad."
example: "omnisciente → 'Sabía lo que todos pensaban'. focaliz. interna → 'Pensé que quizás vendría'. analepsis → flashback al pasado. prolepsis → anticipa el futuro. elipsis narrativa → 'Pasaron diez años'. iterativa → 'cada mañana hacía lo mismo'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Tipos de Narrador y Focalización
    description: Identifica el tipo de narrador y la focalización.
    exercises:
      - type: grammar
        question: "Narrador que conoce los pensamientos de todos los personajes y los hechos del pasado y futuro: (testigo/protagonista/omnisciente)"
        correctAnswer: omnisciente
        rationale: "El narrador omnisciente accede a la interioridad de todos los personajes y controla el tiempo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo no sabía lo que me esperaba.' ¿Tipo de narrador? (omnisciente/testigo/protagonista)"
        correctAnswer: protagonista
        rationale: "Primera persona que narra su propia historia → narrador protagonista."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la focalización interna? (el narrador solo describe lo exterior/el narrador sabe más que los personajes/el relato sigue la perspectiva y conciencia de un personaje)"
        correctAnswer: el relato sigue la perspectiva y conciencia de un personaje
        rationale: "Focalización interna: el lector accede solo a lo que el personaje focal percibe o piensa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la focalización externa? (narrador omnisciente/el narrador conoce el interior/el narrador observa desde fuera sin acceso al interior de los personajes)"
        correctAnswer: el narrador observa desde fuera sin acceso al interior de los personajes
        rationale: "Focalización externa: el narrador-cámara describe solo lo observable externamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el monólogo interior? (un resumen del argumento/un diálogo entre personajes/la representación directa del flujo de pensamiento de un personaje)"
        correctAnswer: la representación directa del flujo de pensamiento de un personaje
        rationale: "El monólogo interior (y su forma extrema, la corriente de conciencia) reproduce el pensamiento en tiempo real."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué efecto tiene el narrador en segunda persona ('tú haces...')? (mayor omnisciencia/distancia objetiva/implicación del lector o desdoblamiento del yo narrante)"
        correctAnswer: implicación del lector o desdoblamiento del yo narrante
        rationale: "La segunda persona interpela al lector o refleja una voz interior que habla al propio narrador."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la analepsis? (descripción del espacio/anticipación de hechos futuros/retrospección o salto al pasado)"
        correctAnswer: retrospección o salto al pasado
        rationale: "La analepsis (flashback) interrumpe el hilo cronológico para narrar hechos anteriores."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la prolepsis? (resumen rápido/anticipación de hechos que ocurrirán después/pausa descriptiva)"
        correctAnswer: anticipación de hechos que ocurrirán después
        rationale: "La prolepsis (flash-forward) anticipa en el relato hechos posteriores en la historia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el narrador testigo del protagonista? (ninguna/el testigo narra en 3ª o 1ª pero no es el protagonista; el protagonista narra su propia historia/el testigo es omnisciente)"
        correctAnswer: el testigo narra en 3ª o 1ª pero no es el protagonista; el protagonista narra su propia historia
        rationale: "El narrador testigo observa desde fuera la historia de otro personaje principal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la intertextualidad? (el uso de metáforas/la referencia explícita o implícita de un texto a otro texto previo/el uso de léxico arcaico)"
        correctAnswer: la referencia explícita o implícita de un texto a otro texto previo
        rationale: "La intertextualidad es la relación que un texto establece con otros textos (citas, alusiones, parodias)."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Tiempo y Espacio Narrativos
    description: Practica las categorías temporales del relato.
    exercises:
      - type: grammar
        question: "¿Qué es la elipsis narrativa? (descripción detallada/supresión de un período de tiempo en el relato/repetición de un hecho)"
        correctAnswer: supresión de un período de tiempo en el relato
        rationale: "La elipsis omite un fragmento temporal: 'Pasaron cinco años...' → salta en el tiempo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la escena narrativa? (resumen acelerado/presentación de la acción en tiempo real, con diálogos/descripción del entorno)"
        correctAnswer: presentación de la acción en tiempo real, con diálogos
        rationale: "La escena iguala el tiempo del relato al tiempo de la historia: lo contado dura lo mismo que se tarda en leerlo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la frecuencia iterativa? (contar una vez algo que ocurrió una vez/contar una vez algo que ocurrió muchas veces/contar muchas veces algo que ocurrió una vez)"
        correctAnswer: contar una vez algo que ocurrió muchas veces
        rationale: "Iterativa: 'Cada domingo iba a misa' → se narra una sola vez lo que era habitual."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la pausa descriptiva? (aceleración del relato/el tiempo del relato se detiene mientras se describe un espacio o personaje/supresión temporal)"
        correctAnswer: el tiempo del relato se detiene mientras se describe un espacio o personaje
        rationale: "La pausa descriptiva interrumpe la acción para describir; el tiempo de la historia se congela."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el espacio diegético? (el espacio real del autor/el espacio dentro del mundo narrado de la ficción/el espacio del lector)"
        correctAnswer: el espacio dentro del mundo narrado de la ficción
        rationale: "El espacio diegético es el espacio dentro del mundo narrado de la ficción: donde viven los personajes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el resumen narrativo? (escena con diálogos/narración acelerada que condensa un largo período en pocas frases/descripción detallada)"
        correctAnswer: narración acelerada que condensa un largo período en pocas frases
        rationale: "El resumen comprime el tiempo: 'Durante los siguientes años trabajó duramente' resume mucho en poco."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué indica 'focalización cero'? (el narrador sabe menos que el personaje/el narrador omnisciente no tiene límite de conocimiento/focalización solo en el espacio)"
        correctAnswer: el narrador omnisciente no tiene límite de conocimiento
        rationale: "Focalización cero = omnisciencia total: el narrador sabe más que cualquier personaje."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "La corriente de conciencia ('stream of consciousness') se caracteriza por: (diálogos muy formales/reproducción fragmentada y asociativa del pensamiento sin lógica lineal/descripción del entorno físico)"
        correctAnswer: reproducción fragmentada y asociativa del pensamiento sin lógica lineal
        rationale: "La corriente de conciencia (Woolf, Joyce) rompe la lógica lineal reproduciendo el pensamiento espontáneo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo coinciden el tiempo del relato y el de la historia? (siempre/en la escena/en la elipsis)"
        correctAnswer: en la escena
        rationale: "La escena es la técnica donde el tiempo narrado = tiempo real de los hechos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la singulativa en frecuencia narrativa? (contar repetidamente/contar una vez algo que pasó una vez/contar iterativamente)"
        correctAnswer: contar una vez algo que pasó una vez
        rationale: "La frecuencia singulativa es la más habitual: contar una vez algo que pasó una vez."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
