title: Gramática - La Lírica Española Contemporánea
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Poesía española del siglo XX: Modernismo (Rubén Darío, Juan Ramón Jiménez: perfección formal, musicalidad, simbolismo). Generación del 27 (Lorca, Alberti, Guillén, Salinas, Cernuda, Aleixandre: fusión vanguardia+tradición). Poesía de posguerra: poesía arraigada (Panero, Rosales) y poesía social (Blas de Otero, Gabriel Celaya). Generación de los 50 (Claudio Rodríguez, Gil de Biedma). Novísimos (años 70: poesía de la experiencia, culturalismo, poesía visual). Poesía actual: diversidad de tendencias. Premio Nobel de Poesía: Juan Ramón Jiménez (1956), Vicente Aleixandre (1977)."
example: "modernismo → musicalidad y simbolismo (Darío). generación del 27 → Lorca: duende, neopopularismo. poesía social → 'misa laica' Blas de Otero. novísimos → pop culture + culturalismo (Pere Gimferrer). Nobel → JRJ (1956), Aleixandre (1977)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Movimientos de la Lírica Española
    description: Identifica movimientos, autores y características.
    exercises:
      - type: grammar
        question: "¿Quién fue el introductor del Modernismo en la poesía en español? (Juan Ramón Jiménez/Rubén Darío/Antonio Machado)"
        correctAnswer: Rubén Darío
        rationale: "El nicaragüense Rubén Darío es el creador y principal representante del Modernismo en lengua española."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué características tiene la poesía modernista? (sencillez y compromiso social/musicalidad, refinamiento estético, simbolismo y cosmopolitismo/verso libre sin métrica)"
        correctAnswer: musicalidad, refinamiento estético, simbolismo y cosmopolitismo
        rationale: "El Modernismo busca la belleza formal, la musicalidad del verso y el exotismo; se opone al prosaísmo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué fusionó la Generación del 27? (el Barroco con el Naturalismo/la tradición lírica española con las vanguardias europeas/el Romanticismo con el Realismo)"
        correctAnswer: la tradición lírica española con las vanguardias europeas
        rationale: "La Generación del 27 combinó el romancero, Góngora y la lírica popular con el surrealismo y el ultraísmo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se concedió el Premio Nobel a Juan Ramón Jiménez? (1927/1956/1977)"
        correctAnswer: 1956
        rationale: "Juan Ramón Jiménez recibió el Premio Nobel de Literatura en 1956."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué distingue la poesía social de posguerra? (el refinamiento formal/el compromiso con la realidad social y la denuncia de la injusticia/el esteticismo puro)"
        correctAnswer: el compromiso con la realidad social y la denuncia de la injusticia
        rationale: "La poesía social (Blas de Otero, Gabriel Celaya) usa la poesía como instrumento de transformación social."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'duende' lorciano? (una figura mitológica/la fuerza oscura y telúrica de la inspiración poética/un tipo de estrofa)"
        correctAnswer: la fuerza oscura y telúrica de la inspiración poética
        rationale: "García Lorca teorizó el 'duende' como la energía oscura y auténtica que da vida al arte flamenco y a la poesía."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué caracterizó a los Novísimos (años 70)? (la poesía patriótica/el culturalismo, la cultura pop y el rechazo de la poesía social anterior/el regreso al Modernismo)"
        correctAnswer: el culturalismo, la cultura pop y el rechazo de la poesía social anterior
        rationale: "Los Novísimos (Castellet, 1970) introdujeron el culturalismo, referencias a cine y cultura pop, y ruptura con la poesía social."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué Premio Nobel recibió Vicente Aleixandre y en qué año? (Nobel de Literatura, 1977/Nobel de Literatura, 1956/Premio Cervantes, 1977)"
        correctAnswer: Nobel de Literatura, 1977
        rationale: "Vicente Aleixandre recibió el Premio Nobel de Literatura en 1977."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿A qué generación pertenece Jaime Gil de Biedma? (Generación del 27/Generación de los 50/Novísimos)"
        correctAnswer: Generación de los 50
        rationale: "Jaime Gil de Biedma es uno de los poetas más representativos de la Generación de los 50 (poesía de la experiencia)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tipo de poesía cultivó Juan Ramón Jiménez en su última etapa? (poesía social/poesía pura y desnuda, esencialista/poesía épica nacional)"
        correctAnswer: poesía pura y desnuda, esencialista
        rationale: "JRJ evolucionó hacia una 'poesía desnuda' o 'poesía pura': despojada de ornamentos, esencial y espiritual."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Análisis Poético
    description: Practica el análisis de textos poéticos.
    exercises:
      - type: grammar
        question: "'Verde que te quiero verde' (Lorca). ¿Qué función tiene la repetición? (ripio/anáfora y políptoton con función incantadora y simbólica/error métrico)"
        correctAnswer: anáfora y políptoton con función incantadora y simbólica
        rationale: "La repetición de 'verde' crea un efecto incantatorio y establece el color como símbolo poético central."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el neopopularismo en la Generación del 27? (poesía culta alejada del pueblo/vuelta a las formas y temas de la lírica popular: romances, villancicos/poesía filosófica abstracta)"
        correctAnswer: vuelta a las formas y temas de la lírica popular: romances, villancicos
        rationale: "El neopopularismo (Lorca, Alberti) recupera las formas populares medievales con sensibilidad vanguardista."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la poesía de la experiencia? (poesía basada en visiones/tendencia que parte de la experiencia cotidiana y el yo lírico como persona real/poesía mística)"
        correctAnswer: tendencia que parte de la experiencia cotidiana y el yo lírico como persona real
        rationale: "La poesía de la experiencia (Gil de Biedma, Luis García Montero) usa el poema como relato íntimo y vivencial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el símbolo en la poesía de Lorca? (solo decorativo/un elemento que en su obra condensa múltiples significados emocionales y culturales (luna=muerte, agua=vida)/una figura gramatical)"
        correctAnswer: un elemento que en su obra condensa múltiples significados emocionales y culturales (luna=muerte, agua=vida)
        rationale: "El simbolismo lorciano: luna (muerte), agua (vida/fecundidad), verde (deseo/muerte), gitano (marginado poético)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "El Modernismo reaccionó contra: (el Romanticismo/el prosaísmo y el utilitarismo burgués del siglo XIX/el Barroco)"
        correctAnswer: el prosaísmo y el utilitarismo burgués del siglo XIX
        rationale: "El Modernismo reivindica el arte por el arte frente al materialismo y el prosaísmo del siglo XIX."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la poesía arraigada de posguerra? (poesía social/poesía de línea clásica y religiosa que acepta el orden establecido/poesía vanguardista)"
        correctAnswer: poesía de línea clásica y religiosa que acepta el orden establecido
        rationale: "La poesía arraigada (Rosales, Panero) cultiva el soneto y la oda clásica desde una visión religiosa y armónica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Blas de Otero, ángel fieramente humano' pertenece a: (el Modernismo/la poesía social de posguerra/los Novísimos)"
        correctAnswer: la poesía social de posguerra
        rationale: "Blas de Otero es uno de los máximos representantes de la poesía social española de los años 40-50."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el yo lírico? (el autor real del poema/la voz poética que habla en el poema, que puede o no coincidir con el autor/el narrador de la novela)"
        correctAnswer: la voz poética que habla en el poema, que puede o no coincidir con el autor
        rationale: "El yo lírico es la instancia enunciativa del poema; distinguirlo del autor real es fundamental en análisis literario."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la forma estrófica más usada en el Modernismo? (el romance/el soneto y el alejandrino/la lira)"
        correctAnswer: el soneto y el alejandrino
        rationale: "El Modernismo recuperó el soneto y dio especial importancia al alejandrino (14 sílabas) de influencia francesa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la sinestesia en poesía? (repetición fónica/transferencia de sensaciones entre sentidos distintos ('el silencio de oro')/una figura de construcción)"
        correctAnswer: transferencia de sensaciones entre sentidos distintos ('el silencio de oro')
        rationale: "La sinestesia mezcla percepciones de distintos sentidos: 'el silencio dorado', 'el canto de un color'."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
