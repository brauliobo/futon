        correctAnswer: su fotografía de rayos X fue crucial para descubrir la estructura del ADN
        rationale: "El texto: 'Rosalind Franklin (cuya fotografía de rayos X fue crucial para descubrir la estructura del ADN)'."
        difficulty: 5
