title: 📚 Lectura - Mujeres en la Ciencia
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo de historia de la ciencia y género. Comprensión de argumentos sobre las barreras históricas y los logros de mujeres científicas."
example: "mujeres en la ciencia → barreras históricas: exclusión universidades/academias + efecto Matilda (trabajo atribuido a hombres) → casos: Curie/Rosalind Franklin (ADN)/Lise Meitner (fisión) → progreso: incremento graduación PhD (>50%) → brecha persistente: cátedras/premios Nobel → causas: sesgo implícito/estereotipos STEM."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: A lo largo de la historia, las mujeres que han dedicado su vida a la ciencia han tenido que superar barreras institucionales, sociales y culturales enormes. Durante siglos, se les negó el acceso a las universidades y a las academias científicas. Pese a ello, figuras como Marie Curie (física y química, dos premios Nobel), Lise Meitner (física nuclear que contribuyó al descubrimiento de la fisión nuclear pero fue excluida del Nobel de 1944), Rosalind Franklin (cuya fotografía de rayos X fue crucial para descubrir la estructura del ADN sin que recibiera reconocimiento oficial) o Hedy Lamarr (inventora de un sistema de comunicaciones por espectro ensanchado) dejaron huellas fundamentales en la ciencia. El fenómeno conocido como 'efecto Matilda' describe la tendencia sistemática a ignorar o atribuir a hombres los méritos de mujeres científicas. En la actualidad, aunque la presencia de mujeres en carreras STEM (ciencia, tecnología, ingeniería y matemáticas) ha aumentado, persisten brechas salariales y de representación en los niveles más altos de la investigación. Estudios demuestran que las solicitudes de financiación firmadas por mujeres reciben en promedio menos apoyo que las firmadas por hombres con merecimientos equivalentes. La diversidad de género en los equipos de investigación, sin embargo, se ha correlacionado con mayor creatividad e innovación."
    exercises:
      - type: reading
