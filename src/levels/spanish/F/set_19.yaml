title: 📚 Lectura - La Inteligencia Artificial y la Sociedad
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Texto argumentativo sobre la IA. Comprensión de argumentos a favor y en contra, y de la postura matizada del autor."
example: "IA débil (tareas específicas) vs. IA fuerte (inteligencia general) → beneficios: automatización/diagnóstico médico/traducción → riesgos: desempleo/sesgos algorítmicos/vigilancia → dilema ético: transparencia/responsabilidad → regulación (UE AI Act) vs. innovación libre."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La inteligencia artificial (IA) está transformando la sociedad a un ritmo sin precedentes, generando debates sobre sus beneficios y sus riesgos. Sus defensores señalan que la IA puede revolucionar la medicina al analizar millones de datos clínicos para diagnosticar enfermedades con mayor precisión que los médicos humanos, optimizar el consumo energético para combatir el cambio climático y aumentar la productividad en sectores como la manufactura y la logística. Sin embargo, los críticos advierten de riesgos significativos: la automatización puede destruir empleos a mayor velocidad de la que la economía crea otros nuevos; los sistemas de IA pueden reproducir y amplificar los sesgos de los datos con los que son entrenados, perpetuando desigualdades raciales, de género o económicas; y el desarrollo de la IA sin marcos éticos y regulatorios adecuados puede conducir a abusos de privacidad y, en escenarios más extremos, a la pérdida de control humano sobre sistemas críticos. Un tercer grupo de analistas propone una vía intermedia: en lugar de frenar el desarrollo de la IA o aceptarlo sin condiciones, se debe invertir en educación y reconversión laboral, establecer marcos regulatorios internacionales y garantizar que los beneficios se distribuyan equitativamente. La IA no es buena ni mala en sí misma: su impacto dependerá de las decisiones políticas, económicas y éticas que tomemos colectivamente."
    exercises:
      - type: reading
        question: "¿Cuál es la tesis del texto sobre la IA? (la IA es siempre beneficiosa/la IA es peligrosa/la IA no es buena ni mala en sí misma, depende de cómo se gestione)"
        correctAnswer: la IA no es buena ni mala en sí misma, depende de cómo se gestione
        rationale: "El texto: 'La IA no es buena ni mala en sí misma: su impacto dependerá de las decisiones que tomemos colectivamente'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué ejemplo médico da el texto sobre la IA? (inventar medicamentos/analizar datos clínicos para diagnosticar con mayor precisión que los médicos/realizar operaciones quirúrgicas)"
        correctAnswer: analizar datos clínicos para diagnosticar con mayor precisión que los médicos
        rationale: "El texto: 'analizar millones de datos clínicos para diagnosticar enfermedades con mayor precisión que los médicos humanos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué riesgo laboral menciona el texto? (que los trabajadores no quieran usar IA/que la automatización destruya empleos más rápido de lo que se crean nuevos/que la IA suba los salarios)"
        correctAnswer: que la automatización destruya empleos más rápido de lo que se crean nuevos
        rationale: "El texto: 'la automatización puede destruir empleos a mayor velocidad de la que la economía crea otros nuevos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo pueden los sistemas de IA perpetuar desigualdades? (siendo demasiado lentos/reproduciendo y amplificando los sesgos de los datos de entrenamiento/cobrando demasiado)"
        correctAnswer: reproduciendo y amplificando los sesgos de los datos de entrenamiento
        rationale: "El texto: 'los sistemas de IA pueden reproducir y amplificar los sesgos de los datos con los que son entrenados'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuáles son los tres tipos de sesgos que menciona el texto? (de edad, región y cultura/raciales, de género y económicos/lingüísticos, visuales y auditivos)"
        correctAnswer: raciales, de género y económicos
        rationale: "El texto: 'perpetuando desigualdades raciales, de género o económicas'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué propone el tercer grupo de analistas? (frenar la IA totalmente/aceptar la IA sin condiciones/invertir en educación, marcos regulatorios y distribución equitativa de beneficios)"
        correctAnswer: invertir en educación, marcos regulatorios y distribución equitativa de beneficios
        rationale: "El texto: 'invertir en educación y reconversión laboral, establecer marcos regulatorios internacionales y garantizar que los beneficios se distribuyan equitativamente'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué riesgo extremo menciona el texto en relación con la regulación? (la IA tendrá emociones/la pérdida de control humano sobre sistemas críticos/la IA generará inflación)"
        correctAnswer: la pérdida de control humano sobre sistemas críticos
        rationale: "El texto: 'en escenarios más extremos, a la pérdida de control humano sobre sistemas críticos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué estructura argumentativa usa el texto? (solo argumento a favor/solo argumento en contra/tesis-antítesis-síntesis con tres grupos de opinión)"
        correctAnswer: tesis-antítesis-síntesis con tres grupos de opinión
        rationale: "El texto presenta defensores, críticos y una postura intermedia → estructura dialéctica de tres partes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué sectores dice el texto que la IA aumenta la productividad? (solo en medicina/manufactura y logística/finanzas y derecho)"
        correctAnswer: manufactura y logística
        rationale: "El texto: 'aumentar la productividad en sectores como la manufactura y la logística'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué depende el impacto real de la IA según la conclusión? (de la velocidad de los procesadores/de las decisiones políticas, económicas y éticas colectivas/del número de usuarios)"
        correctAnswer: de las decisiones políticas, económicas y éticas colectivas
        rationale: "El texto: 'su impacto dependerá de las decisiones políticas, económicas y éticas que tomemos colectivamente'."
        difficulty: 5
        objectives: [es.pre_reading]
