title: 📚 Lectura - El Cambio Climático y la Biodiversidad
level: F
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo científico. Comprensión de relaciones causa-efecto, datos numéricos y vocabulario científico avanzado."
example: "IPBES 2019: ~1 millón de especies en riesgo → 5 causas: destrucción de hábitat/sobreexplotación/contaminación/especies invasoras/cambio climático → cambio climático: multiplicador de amenazas (acidificación oceánica, desplazamiento de rangos) → sexta extinción masiva (primera causada por una sola especie) → soluciones: corredores biológicos/reducción CO₂/restauración de ecosistemas."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La biodiversidad, entendida como la variedad de formas de vida en la Tierra, está siendo amenazada a un ritmo sin precedentes en la historia geológica reciente. Según el informe de la Plataforma Intergubernamental sobre Biodiversidad y Servicios de los Ecosistemas (IPBES) de 2019, alrededor de un millón de especies animales y vegetales se encuentran en riesgo de extinción, muchas de ellas en las próximas décadas. Las causas principales son la destrucción y fragmentación del hábitat, la sobreexplotación de especies, la contaminación, las especies invasoras y el cambio climático. Este último actúa como multiplicador de amenazas: el aumento de la temperatura media global ya ha causado el desplazamiento de rangos de distribución de muchas especies, la acidificación de los océanos afecta a los corales y la alteración del régimen de lluvias modifica los ecosistemas terrestres. Los científicos advierten que estamos ante la sexta extinción masiva de la historia de la Tierra, la primera causada por una sola especie. Sin embargo, existen soluciones: la creación de corredores biológicos, la reducción de emisiones de CO₂, la agricultura sostenible y la restauración de ecosistemas degradados son estrategias que han demostrado eficacia. El éxito dependerá de la voluntad política y de la cooperación internacional."
    exercises:
      - type: reading
        question: "¿Cuántas especies están en riesgo de extinción según el informe IPBES de 2019? (un millón/diez millones/cien mil)"
        correctAnswer: un millón
        rationale: "El texto: 'alrededor de un millón de especies animales y vegetales se encuentran en riesgo de extinción'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas causas principales de pérdida de biodiversidad menciona el texto? (tres/cinco/siete)"
        correctAnswer: cinco
        rationale: "El texto enumera: destrucción del hábitat, sobreexplotación, contaminación, especies invasoras y cambio climático → cinco causas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué papel tiene el cambio climático según el texto? (es la única causa/actúa como multiplicador de amenazas/es irrelevante para la biodiversidad)"
        correctAnswer: actúa como multiplicador de amenazas
        rationale: "El texto: 'El cambio climático actúa como multiplicador de amenazas'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué efecto tiene la acidificación de los océanos? (favorece los corales/afecta negativamente a los corales/no tiene efecto en los ecosistemas marinos)"
        correctAnswer: afecta negativamente a los corales
        rationale: "El texto: 'la acidificación de los océanos afecta a los corales'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué extinción es la actual según los científicos? (la quinta/la sexta/la primera)"
        correctAnswer: la sexta
        rationale: "El texto: 'estamos ante la sexta extinción masiva de la historia de la Tierra'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hace especial a esta extinción respecto a las anteriores? (su velocidad/es la primera causada por una sola especie/es la más antigua)"
        correctAnswer: es la primera causada por una sola especie
        rationale: "El texto: 'la primera causada por una sola especie' → la especie humana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál de estas NO es una solución mencionada en el texto? (corredores biológicos/ingeniería genética/agricultura sostenible)"
        correctAnswer: ingeniería genética
        rationale: "El texto menciona corredores biológicos, reducción de CO₂, agricultura sostenible y restauración; no la ingeniería genética."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué dependerá el éxito de las soluciones? (solo de la tecnología/de la voluntad política y la cooperación internacional/de las ONG)"
        correctAnswer: de la voluntad política y la cooperación internacional
        rationale: "El texto: 'El éxito dependerá de la voluntad política y de la cooperación internacional'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué significa 'corredor biológico'? (un laboratorio/una zona conectada de hábitat que permite el desplazamiento de especies/un parque urbano)"
        correctAnswer: una zona conectada de hábitat que permite el desplazamiento de especies
        rationale: "Los corredores biológicos conectan fragmentos de hábitat para que las especies puedan moverse y sobrevivir."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué organismo publicó el informe citado en el texto? (WWF/IPBES/IPCC)"
        correctAnswer: IPBES
        rationale: "El texto: 'informe de la Plataforma Intergubernamental sobre Biodiversidad y Servicios de los Ecosistemas (IPBES)'."
        difficulty: 5
        objectives: [es.pre_reading]
