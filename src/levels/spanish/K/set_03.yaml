title: Gramática - Tipología Lingüística y Universales del Lenguaje
level: K
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada sobre tipología lingüística: la clasificación morfológica (analíticas, sintéticas, aglutinantes, polisintéticas, incorporantes), los universales lingüísticos de Greenberg, el parámetro de orden de constituyentes (SOV/SVO/VSO), la alineación (nominativo-acusativo vs. ergativo-absolutivo), el parámetro pro-drop, las lenguas de tema prominente (topic-prominent) vs. de sujeto prominente, y la jerarquía de animacidad."
example: "Las lenguas SOV como el japonés colocan el verbo al final → 'Tarō-ga hon-o yonda' (Tarō-NOM libro-ACU leyó) → el orden tipológico correlaciona con otros rasgos: posposiciones en vez de preposiciones, adjetivos antes del sustantivo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Morfología Tipológica y Orden de Constituyentes
    exercises:
      - type: grammar
        question: "¿Qué caracteriza a las lenguas aglutinantes frente a las flexivas? (que usan más palabras/las lenguas aglutinantes añaden morfemas con un significado cada uno de forma modular → turco: 'evlerimdeyim' (ev-ler-im-de-yim: casa-PLURAL-mi-en-estoy) → cada morfema es separable y tiene función clara; las flexivas fusionan varios significados en un morfema único → latín 'amabam' (amaba: tiempo, modo, aspecto, persona todo en -abam)/que las aglutinantes tienen más vocales)"
        correctAnswer: "las lenguas aglutinantes añaden morfemas con un significado cada uno de forma modular → turco: 'evlerimdeyim' (ev-ler-im-de-yim: casa-PLURAL-mi-en-estoy) → cada morfema es separable y tiene función clara; las flexivas fusionan varios significados en un morfema único → latín 'amabam' (amaba: tiempo, modo, aspecto, persona todo en -abam)"
        rationale: "La distinción aglutinante/flexivo se basa en la fusionalidad morfológica; el turco es el ejemplo prototípico de lengua aglutinante."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las lenguas polisintéticas y cuál es un ejemplo? (las que tienen muchos sinónimos/las que incorporan múltiples argumentos y modificadores dentro de una sola palabra compleja → en inuktitut (esquimal): una palabra equivale a una oración española completa; el verbo puede incluir el sujeto, el objeto, el tiempo y el modo en una sola forma/las que tienen muchos dialectos)"
        correctAnswer: "las que incorporan múltiples argumentos y modificadores dentro de una sola palabra compleja → en inuktitut (esquimal): una palabra equivale a una oración española completa; el verbo puede incluir el sujeto, el objeto, el tiempo y el modo en una sola forma"
        rationale: "Las lenguas polisintéticas (Sapir) representan el extremo de la síntesis morfológica; las lenguas analíticas como el chino mandarín representan el extremo opuesto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el orden de constituyentes más frecuente entre las lenguas del mundo según Greenberg? (SVO, luego VSO/SOV es el más frecuente (45% de lenguas), seguido de SVO (42%); los órdenes con verbo al inicio (VSO, VOS) son menos frecuentes; el español es básicamente SVO con variación pragmática posible/VSO y luego SVO)"
        correctAnswer: SOV es el más frecuente (45% de lenguas), seguido de SVO (42%); los órdenes con verbo al inicio (VSO, VOS) son menos frecuentes; el español es básicamente SVO con variación pragmática posible
        rationale: "Los universales de Greenberg (1963) mostraron que el orden SOV es el más frecuente; el árabe clásico y el hebreo son VSO; el japonés, turco y persa son SOV."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el parámetro pro-drop y cómo se manifiesta en el español? (la tendencia a usar pronombres/el parámetro que permite omitir el pronombre sujeto cuando está codificado en la morfología verbal → el español es pro-drop: 'Hablo' (sin 'yo') es gramatical porque -o codifica 1ª persona singular; el inglés no es pro-drop: '*Speak' es agramatical/la posición del pronombre de objeto)"
        correctAnswer: "el parámetro que permite omitir el pronombre sujeto cuando está codificado en la morfología verbal → el español es pro-drop: 'Hablo' (sin 'yo') es gramatical porque -o codifica 1ª persona singular; el inglés no es pro-drop: '*Speak' es agramatical"
        rationale: "El parámetro pro-drop (Chomsky, Principios y Parámetros) correlaciona con riqueza morfológica verbal: las lenguas con paradigmas verbales ricos permiten omitir el sujeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la alineación ergativo-absolutiva y en qué difiere de la nominativo-acusativa? (son idénticas/en la alineación nominativo-acusativa (español), el sujeto de transitivo y el de intransitivo reciben el mismo caso (nominativo); en la ergativo-absolutiva (vasco, quechua), el sujeto de transitivo recibe caso ergativo y el de intransitivo el absolutivo (que también marca el objeto de transitivo)/es solo una diferencia de vocabulario)"
        correctAnswer: en la alineación nominativo-acusativa (español), el sujeto de transitivo y el de intransitivo reciben el mismo caso (nominativo); en la ergativo-absolutiva (vasco, quechua), el sujeto de transitivo recibe caso ergativo y el de intransitivo el absolutivo (que también marca el objeto de transitivo)
        rationale: "La ergatividad reorganiza la gramática alrededor del contraste transitivo/intransitivo en lugar del contraste sujeto/objeto; el vasco es el ejemplo clásico en Europa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los universales lingüísticos de Greenberg y en qué se basan? (las reglas del español/generalizaciones estadísticas o absolutas sobre propiedades que comparten todas o casi todas las lenguas → Universal 1: 'En las declaraciones, el elemento nominal sujeto precede al objeto'; Universal 2: 'En lenguas con preposición, el genitivo casi siempre sigue al sustantivo' → se basan en muestras tipológicas amplias/reglas de gramática universal de Chomsky)"
        correctAnswer: "generalizaciones estadísticas o absolutas sobre propiedades que comparten todas o casi todas las lenguas → Universal 1: 'En las declaraciones, el elemento nominal sujeto precede al objeto'; Universal 2: 'En lenguas con preposición, el genitivo casi siempre sigue al sustantivo' → se basan en muestras tipológicas amplias"
        rationale: "Los 45 universales de Greenberg (1963) fueron el punto de partida de la tipología funcional moderna; distinguen universales absolutos de tendencias estadísticas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las lenguas de tema prominente (topic-prominent) y qué ejemplo menciona? (lenguas que siempre ponen el sujeto primero/lenguas en que la estructura oracional se organiza alrededor del tema (topic, la información dada) en lugar del sujeto gramatical → el chino mandarín y el japonés son topic-prominent: 'Ese libro, ya lo leí' es más natural que en español, que es sujeto-prominente/lenguas con mucho vocabulario)"
        correctAnswer: "lenguas en que la estructura oracional se organiza alrededor del tema (topic, la información dada) en lugar del sujeto gramatical → el chino mandarín y el japonés son topic-prominent: 'Ese libro, ya lo leí' es más natural que en español, que es sujeto-prominente"
        rationale: "La distinción topic-prominent vs. subject-prominent (Li y Thompson, 1976) muestra que el 'sujeto' no es una categoría universal; en algunas lenguas el tema es la categoría central."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la jerarquía de animacidad y cómo afecta a la gramática? (un ranking de frecuencia léxica/la escala que ordena los referentes de más a menos animados: personas propias > personas > animales > objetos inanimados → muchas lenguas dan trato gramatical preferente a los referentes más animados: el 'a' personal del español marca objetos directos humanos/la clasificación de los sustantivos por género)"
        correctAnswer: "la escala que ordena los referentes de más a menos animados: personas propias > personas > animales > objetos inanimados → muchas lenguas dan trato gramatical preferente a los referentes más animados: el 'a' personal del español marca objetos directos humanos"
        rationale: "La jerarquía de animacidad tiene efectos en el marcado diferencial de objeto, la concordancia verbal, la voz y la relativización; es un universal tipológico implicacional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las lenguas analíticas y qué ejemplo es el más puro? (las lenguas con mucha gramática/las lenguas que expresan relaciones gramaticales principalmente mediante el orden de palabras y palabras de función independientes, sin morfología flexiva → el chino mandarín es el ejemplo más analítico: no tiene flexión verbal ni nominal, el tiempo y el aspecto se expresan con partículas separadas/el latín clásico)"
        correctAnswer: "las lenguas que expresan relaciones gramaticales principalmente mediante el orden de palabras y palabras de función independientes, sin morfología flexiva → el chino mandarín es el ejemplo más analítico: no tiene flexión verbal ni nominal, el tiempo y el aspecto se expresan con partículas separadas"
        rationale: "La escala analítico-sintético mide el índice de morfemas por palabra; el inglés moderno es más analítico que el inglés antiguo, reflejo de una tendencia de cambio tipológico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué correlaciones tipológicas observó Greenberg entre el orden SOV y otros rasgos gramaticales? (que las lenguas SOV tienen pocas palabras/que las lenguas SOV tienden a tener posposiciones (no preposiciones), adjetivos antes del sustantivo, sufijos (no prefijos) y oraciones de relativo antes del núcleo → el japonés ejemplifica todas estas correlaciones/que las lenguas SOV son más simples)"
        correctAnswer: que las lenguas SOV tienden a tener posposiciones (no preposiciones), adjetivos antes del sustantivo, sufijos (no prefijos) y oraciones de relativo antes del núcleo → el japonés ejemplifica todas estas correlaciones
        rationale: "Las correlaciones de Greenberg reflejan una armonía tipológica: los elementos dependientes tienden a preceder o seguir sistemáticamente a sus núcleos en toda la gramática."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Universales Implicacionales y Parámetros
    exercises:
      - type: grammar
        question: "¿Qué es un universal implicacional en tipología lingüística? (una característica de todas las lenguas/un universal de la forma 'Si una lengua tiene X, entonces tiene Y' → Greenberg: 'Si una lengua tiene orden VSO, entonces tiene preposiciones' → no toda lengua tiene VSO, pero todas las que sí tienen VSO tienen también preposiciones/un rasgo frecuente pero no universal)"
        correctAnswer: "un universal de la forma 'Si una lengua tiene X, entonces tiene Y' → Greenberg: 'Si una lengua tiene orden VSO, entonces tiene preposiciones' → no toda lengua tiene VSO, pero todas las que sí tienen VSO tienen también preposiciones"
        rationale: "Los universales implicacionales son más comunes que los absolutos; estructuran el espacio tipológico posible y permiten hacer predicciones sobre lenguas no estudiadas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo trata el español el marcado diferencial de objeto (MDO) en comparación con otras lenguas? (no hay diferencia/el español marca con 'a' los objetos directos de referencia humana o muy animada → 'Vi a María' vs. 'Vi la película' → el MDO es sensible a la animacidad y la especificidad; otras lenguas (rumano, hebreo) tienen sistemas paralelos/el español no distingue animacidad en objetos)"
        correctAnswer: el español marca con 'a' los objetos directos de referencia humana o muy animada → 'Vi a María' vs. 'Vi la película' → el MDO es sensible a la animacidad y la especificidad; otras lenguas (rumano, hebreo) tienen sistemas paralelos
        rationale: "El marcado diferencial de objeto (Bossong, 1985) es un fenómeno tipológico extendido; en español la 'a personal' codifica prominencia referencial del objeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la voz pasiva tipológicamente y qué alternativas existen en las lenguas del mundo? (solo la pasiva perifrástica/la voz pasiva promueve el objeto a sujeto; no todas las lenguas tienen pasiva morfológica: el chino usa la topicalización, el español usa la pasiva refleja ('se vende'), muchas lenguas activas-estativas asignan los roles de forma distinta/la voz pasiva es universal)"
        correctAnswer: "la voz pasiva promueve el objeto a sujeto; no todas las lenguas tienen pasiva morfológica: el chino usa la topicalización, el español usa la pasiva refleja ('se vende'), muchas lenguas activas-estativas asignan los roles de forma distinta"
        rationale: "La voz es un dominio de gran variación tipológica; el español tiene tres estrategias de pasivización: perifrástica, refleja y se impersonal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la incorporación nominal y en qué tipo de lenguas aparece? (la creación de nombres compuestos/la fusión del sustantivo objeto con el verbo en una sola palabra verbal → en mohawk (lengua iroquesa): 'ka-nakt-a-hninu-' (yo-cama-LIGADURA-comprar-ASPECTO: 'estoy comprando una cama') → propio de lenguas polisintéticas con gran síntesis/solo en lenguas europeas)"
        correctAnswer: "la fusión del sustantivo objeto con el verbo en una sola palabra verbal → en mohawk (lengua iroquesa): 'ka-nakt-a-hninu-' (yo-cama-LIGADURA-comprar-ASPECTO: 'estoy comprando una cama') → propio de lenguas polisintéticas con gran síntesis"
        rationale: "La incorporación nominal (Baker, 1988) es un mecanismo de síntesis: el objeto se incorpora al verbo y el resultado funciona como predicado intransitivo complejo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia tipológica hay entre el tiempo gramatical (tense) y el aspecto? (son sinónimos/el tiempo localiza el evento en el eje temporal (antes/ahora/después); el aspecto describe la estructura interna del evento (perfectivo: evento completo; imperfectivo: en curso o habitual) → el español gramaticaliza ambos; otras lenguas (chino) gramaticalizan solo el aspecto/el aspecto es más moderno que el tiempo)"
        correctAnswer: "el tiempo localiza el evento en el eje temporal (antes/ahora/después); el aspecto describe la estructura interna del evento (perfectivo: evento completo; imperfectivo: en curso o habitual) → el español gramaticaliza ambos; otras lenguas (chino) gramaticalizan solo el aspecto"
        rationale: "La distinción tiempo/aspecto es tipológicamente central; el contraste pretérito indefinido/imperfecto del español codifica principalmente aspecto, no solo tiempo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la jerarquía de accesibilidad de Keenan y Comrie para la relativización? (una escala de dificultad gramatical/la escala que predice qué posiciones gramaticales pueden relativizarse: sujeto > objeto directo > objeto indirecto > oblicuo > poseedor → una lengua que relativiza objetos oblicuos también relativiza sujetos y objetos directos, pero no necesariamente al revés/un sistema de casos)"
        correctAnswer: "la escala que predice qué posiciones gramaticales pueden relativizarse: sujeto > objeto directo > objeto indirecto > oblicuo > poseedor → una lengua que relativiza objetos oblicuos también relativiza sujetos y objetos directos, pero no necesariamente al revés"
        rationale: "La jerarquía de accesibilidad (1977) es uno de los universales implicacionales más robustos; predice dónde aparecen las 'lagunas' en los sistemas de relativización."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el fenómeno de la evidencialidad y en qué lenguas es obligatoria? (la categoría gramatical de causa/la categoría gramatical que codifica la fuente de información del hablante → en quechua y turco es obligatoria: el hablante debe marcar si la información es de primera mano, de segunda mano o inferida → en español se expresa léxicamente ('supuestamente', 'dicen que') pero no como morfema obligatorio/solo existe en lenguas europeas)"
        correctAnswer: "la categoría gramatical que codifica la fuente de información del hablante → en quechua y turco es obligatoria: el hablante debe marcar si la información es de primera mano, de segunda mano o inferida → en español se expresa léxicamente ('supuestamente', 'dicen que') pero no como morfema obligatorio"
        rationale: "La evidencialidad (Aikhenvald, 2004) es una categoría gramatical desconocida en las lenguas europeas pero frecuente en las américanas y el turco; cambia qué información debe explicitarse."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo clasifica la tipología morfológica el español frente al latín? (el español es más sintético/el latín es predominantemente flexivo-sintético (morfemas que fusionan varios valores); el español es más analítico que el latín al haber perdido la declinación casual y compensarla con preposiciones y orden de palabras → el español está en una posición intermedia en la escala analítico-sintético/el español es idéntico al latín morfológicamente)"
        correctAnswer: el latín es predominantemente flexivo-sintético (morfemas que fusionan varios valores); el español es más analítico que el latín al haber perdido la declinación casual y compensarla con preposiciones y orden de palabras → el español está en una posición intermedia en la escala analítico-sintético
        rationale: "La evolución del latín al español ilustra una tendencia tipológica universal: las lenguas tienden a moverse del polo sintético hacia el analítico con el tiempo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los clasificadores nominales y en qué lenguas se usan? (los artículos/morfemas que acompañan a los sustantivos y los clasifican según categorías semánticas (animado/inanimado, forma, material, tamaño) → en chino mandarín son obligatorios al cuantificar: 'sān běn shū' (tres CL-libro libro, tres libros) con 'běn' para objetos de forma plana/marcadores de caso)"
        correctAnswer: "morfemas que acompañan a los sustantivos y los clasifican según categorías semánticas (animado/inanimado, forma, material, tamaño) → en chino mandarín son obligatorios al cuantificar: 'sān běn shū' (tres CL-libro libro, tres libros) con 'běn' para objetos de forma plana"
        rationale: "Los clasificadores nominales son un sistema tipológico alternativo al género gramatical; las lenguas del sureste asiático los han desarrollado elaboradamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo relaciona la tipología el índice de síntesis morfológica con la estabilidad del orden de palabras? (no tienen relación/las lenguas con morfología flexiva rica pueden permitirse orden de palabras más libre (el latín tiene 6 órdenes frecuentes) porque los casos indican las relaciones; las lenguas analíticas (chino, inglés) necesitan un orden más fijo para expresar las mismas relaciones/las lenguas sintéticas tienen orden fijo)"
        correctAnswer: las lenguas con morfología flexiva rica pueden permitirse orden de palabras más libre (el latín tiene 6 órdenes frecuentes) porque los casos indican las relaciones; las lenguas analíticas (chino, inglés) necesitan un orden más fijo para expresar las mismas relaciones
        rationale: "La correlación morfología-orden establece que las lenguas flexivas permiten orden libre porque la morfología indica las relaciones; las analíticas necesitan orden fijo."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
