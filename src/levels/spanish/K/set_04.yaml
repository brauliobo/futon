        question: "¿Cómo explica la neurociencia por qué el estudio masivo (cramming) es menos eficaz que el espaciado? (porque el estudio masivo cansa más/porque el estudio masivo activa la LTP en sesiones muy próximas sin dar tiempo a la consolidación; el aprendizaje espaciado obliga al cerebro a reactivar la traza mnémica en declive, lo que fortalece más la red sináptica/porque el estudio masivo es más eficiente a corto plazo)"
        correctAnswer: porque el estudio masivo activa la LTP en sesiones muy próximas sin dar tiempo a la consolidación; el aprendizaje espaciado obliga al cerebro a reactivar la traza mnémica en declive, lo que fortalece más la red sináptica
        rationale: "El efecto del espaciado tiene base neurobiológica: la reactivación de memorias parcialmente olvidadas produce mayor potenciación sináptica que la repetición inmediata."
