authorNotes: "Texto expositivo sobre neurociencia del aprendizaje: la plasticidad cerebral (Hebbian learning, LTP), la memoria declarativa y procedural, el hipocampo y la amígdala, el aprendizaje espacial (células de lugar de O'Keefe y Moser), la mielinización, el efecto del sueño en la consolidación, la dopamina y la motivación, el aprendizaje por refuerzo, y las implicaciones para la educación (espaciado, recuperación, interleaving)."
example: "aprendizaje → LTP: Hebb (neuronas que disparan juntas) → consolidación: codificación (hipocampo) → sueño NREM: transferencia a neocorteza → recuperación; estrategias con respaldo: práctica espaciada/interleaving/efecto testing → neuroplasticidad adulta → implicaciones: no masificación, recuperación activa, sueño imprescindible."
