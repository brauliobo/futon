    title: El Texto
    description: "Texto: La neurociencia del aprendizaje investiga los mecanismos cerebrales que subyacen a la adquisición, consolidación y recuperación de la información. La plasticidad cerebral es la capacidad del cerebro de modificar su estructura y función en respuesta a la experiencia. El principio de Hebb (1949) postula que 'las neuronas que se activan juntas, se conectan juntas' (fire together, wire together): la activación simultánea repetida fortalece las sinapsis mediante la potenciación a largo plazo (LTP, Long-Term Potentiation), el mecanismo celular de la memoria. El hipocampo es crítico para la memoria declarativa episódica (hechos y eventos autobiográficos); los pacientes con hipocampo dañado (caso H.M.) no pueden formar nuevas memorias declarativas pero mantienen el aprendizaje procedural. John O'Keefe, May-Britt Moser y Edvard Moser descubrieron las células de lugar (place cells) en el hipocampo y las células de cuadrícula (grid cells) en el córtex entorrinal: forman el sistema de posicionamiento GPS del cerebro → Premio Nobel de Fisiología 2014. La mielinización (formación de vainas de mielina alrededor de los axones) acelera la transmisión nerviosa y es fundamental para la adquisición de habilidades complejas: continúa hasta los 25 años en la corteza prefrontal. El sueño juega un papel esencial en la consolidación de la memoria: durante el sueño REM se procesan las memorias emocionales y durante el sueño profundo (ondas lentas) se transfieren memorias del hipocampo a la corteza. La dopamina media el aprendizaje por refuerzo: señala la predicción de recompensas (error de predicción de recompensa, Schultz) y modula la motivación para aprender. Las técnicas pedagógicas más respaldadas por la neurociencia son: el aprendizaje espaciado (spaced practice), la recuperación activa (retrieval practice) y el interleaving (mezcla de materias)."
