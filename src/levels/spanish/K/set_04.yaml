        correctAnswer: "que las neuronas que se activan juntas fortalecen su conexión → implementado por la potenciación a largo plazo (LTP): la activación simultánea repetida aumenta la eficiencia sináptica"
        rationale: "El texto: 'El principio de Hebb postula que las neuronas que se activan juntas se conectan juntas: la activación simultánea repetida fortalece las sinapsis mediante la LTP'."
