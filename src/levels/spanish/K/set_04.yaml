        question: "¿Qué diferencia la memoria declarativa de la memoria procedural neurobiológicamente? (son idénticas en el cerebro/la memoria declarativa (hechos y episodios) depende del hipocampo y puede verbalizarse; la memoria procedural (habilidades motoras y hábitos) depende del cerebelo y los ganglios basales y no requiere conciencia ni puede articularse fácilmente/la memoria declarativa es más antigua evolutivamente)"
        correctAnswer: la memoria declarativa (hechos y episodios) depende del hipocampo y puede verbalizarse; la memoria procedural (habilidades motoras y hábitos) depende del cerebelo y los ganglios basales y no requiere conciencia ni puede articularse fácilmente
        rationale: "La disociación declarativo/procedural distingue el hipocampo (hechos verbalizables) del cerebelo y ganglios basales (habilidades automáticas); el caso H.M. demostró su independencia."
