title: 📝 Gramática - Teoría de la Traducción y Traductología
level: K
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada sobre traducción: la equivalencia dinámica vs. formal (Nida), la intraducibilidad, los procedimientos técnicos de traducción (Vinay y Darbelnet: préstamo, calco, traducción literal, transposición, modulación, equivalencia, adaptación), el giro cultural en la traductología (Toury, Venuti: extranjerización vs. domesticación), la localización, la traducción automática (DeepL, GPT), la interpretación simultánea y consecutiva, y los estudios de traducción como disciplina académica."
example: "La equivalencia dinámica de Nida: la traducción debe producir en el lector meta el mismo efecto que el original producía en el lector fuente → 'No pongáis vuestras perlas ante los cerdos' (Biblia) → traducción dinámica: adaptarlo a la realidad cultural del receptor."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Equivalencia, Intraducibilidad y Procedimientos
    exercises:
      - type: grammar
        question: "¿Qué distingue la equivalencia formal de la equivalencia dinámica en la traducción? (que la formal usa el mismo número de palabras/la equivalencia formal (Nida) traduce preservando la forma lingüística del original → cada palabra por su equivalente más cercano; la equivalencia dinámica busca producir en el lector meta el mismo efecto que el original en el lector fuente → puede requerir cambios formales radicales/que son dos sinónimos del mismo concepto)"
        correctAnswer: la equivalencia formal traduce preservando la forma lingüística del original → cada palabra por su equivalente más cercano; la equivalencia dinámica busca producir en el lector meta el mismo efecto que el original en el lector fuente → puede requerir cambios formales radicales
        rationale: "La distinción formal/dinámica de Nida ('Toward a Science of Translating', 1964) marcó la traductología; la equivalencia dinámica fue desarrollada para la traducción bíblica y la comunicación intercultural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los préstamos y calcos como procedimientos técnicos de traducción y cuál es la diferencia? (son lo mismo/el préstamo incorpora directamente el término de la lengua fuente → 'internet', 'software', 'marketing'; el calco traduce literalmente cada morfema → 'rascacielos' (skyscraper: rasca/sky + cielos/scraper) → el calco adapta la forma, el préstamo la importa/el préstamo es siempre de lenguas vecinas)"
        correctAnswer: "el préstamo incorpora directamente el término de la lengua fuente → 'internet', 'software', 'marketing'; el calco traduce literalmente cada morfema → 'rascacielos' (skyscraper: rasca/sky + cielos/scraper) → el calco adapta la forma, el préstamo la importa"
        rationale: "La tipología de procedimientos de Vinay y Darbelnet ('Stylistique comparée du français et de l'anglais', 1958) es la clasificación clásica; el calco es frecuente en términos tecnológicos y deportivos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la transposición como procedimiento traductológico? (la inversión del orden de las palabras/el cambio de categoría gramatical sin cambiar el significado → 'upon his return' (inglés: preposición + sustantivo) → 'cuando volvió' (español: conjunción + verbo) → la misma idea expresada con una categoría gramatical diferente pero equivalente/la traducción de dialectos)"
        correctAnswer: "el cambio de categoría gramatical sin cambiar el significado → 'upon his return' (inglés: preposición + sustantivo) → 'cuando volvió' (español: conjunción + verbo) → la misma idea expresada con una categoría gramatical diferente pero equivalente"
        rationale: "La transposición (Vinay y Darbelnet) es una de las técnicas obligadas en la traducción entre español e inglés; no es opcional sino que refleja las diferencias estructurales de las lenguas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la modulación en traducción y cuándo se aplica? (el cambio de volumen en el texto/el cambio de punto de vista o perspectiva semántica manteniendo el mismo significado → 'Shallow water' (inglés: poca profundidad) → 'poco fondo' (español: cambio de perspectiva) → se aplica cuando la traducción literal produce un enunciado extraño o agramatical en la lengua meta/la adaptación de metáforas)"
        correctAnswer: "el cambio de punto de vista o perspectiva semántica manteniendo el mismo significado → 'Shallow water' (inglés: poca profundidad) → 'poco fondo' (español: cambio de perspectiva) → se aplica cuando la traducción literal produce un enunciado extraño o agramatical en la lengua meta"
        rationale: "La modulación cambia el ángulo desde el que se contempla la realidad sin cambiar la información transmitida; refleja que las lenguas conceptualizan de forma distinta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la domesticación y la extranjerización en la traductología de Venuti? (dos tipos de equivalencia formal/dos tipos de traducciones domésticas/domesticación: la traducción adapta el texto a las convenciones culturales del lector meta → fluido, invisible, sin marcas culturales ajenas; extranjerización: la traducción preserva la extrañeza del original → visible, resistente, extraña al lector → Venuti defiende la extranjerización para resistir la homogeneización cultural)"
        correctAnswer: "domesticación: la traducción adapta el texto a las convenciones culturales del lector meta → fluido, invisible, sin marcas culturales ajenas; extranjerización: la traducción preserva la extrañeza del original → visible, resistente, extraña al lector → Venuti defiende la extranjerización para resistir la homogeneización cultural"
        rationale: "La distinción de Venuti ('The Translator's Invisibility', 1995) tiene un componente ético-político: la extranjerización es resistencia a la dominación cultural de las lenguas hegemónicas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la intraducibilidad y cuáles son sus tipos? (que todas las lenguas son iguales/la imposibilidad de encontrar un equivalente exacto en la lengua meta → intraducibilidad lingüística: diferencias estructurales (ausencia de tiempo verbal equivalente, distinción genérica); intraducibilidad cultural: referentes culturales sin equivalente (el concepto japonés 'ma' o el alemán 'Schadenfreude') → toda traducción implica pérdida/que no se puede traducir nada)"
        correctAnswer: "la imposibilidad de encontrar un equivalente exacto en la lengua meta → intraducibilidad lingüística: diferencias estructurales (ausencia de tiempo verbal equivalente, distinción genérica); intraducibilidad cultural: referentes culturales sin equivalente (el concepto japonés 'ma' o el alemán 'Schadenfreude') → toda traducción implica pérdida"
        rationale: "La intraducibilidad revela la imposibilidad de equivalencia exacta entre lenguas; el traductor usa estrategias compensatorias (nota, paráfrasis, préstamo) ante la pérdida inevitable."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la norma traductora en la traductología descriptiva de Toury? (una regla prescriptiva de traducción/el conjunto de restricciones que guían las elecciones de un traductor en un contexto histórico-cultural dado → las normas son socialmente determinadas y varían entre tradiciones culturales → Toury analiza qué traducciones se hacen realmente (descriptivo) en lugar de prescribir cómo se deben hacer/las reglas de corrección gramatical para traductores)"
        correctAnswer: el conjunto de restricciones que guían las elecciones de un traductor en un contexto histórico-cultural dado → las normas son socialmente determinadas y varían entre tradiciones culturales → Toury analiza qué traducciones se hacen realmente (descriptivo) en lugar de prescribir cómo se deben hacer
        rationale: "Los Descriptive Translation Studies de Toury ('Descriptive Translation Studies and Beyond', 1995) cambiaron el paradigma: de prescriptivo a descriptivo; el concepto de norma es central en este enfoque."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la localización y en qué difiere de la traducción? (la traducción al lenguaje local/el proceso de adaptar un producto (software, sitio web, videojuego) a un mercado local: incluye la traducción pero también la adaptación de formato de fechas, monedas, medidas, referencias culturales, iconografía y aspectos técnicos → la localización es más amplia y técnica que la traducción textual/un tipo de traducción automática)"
        correctAnswer: "el proceso de adaptar un producto (software, sitio web, videojuego) a un mercado local: incluye la traducción pero también la adaptación de formato de fechas, monedas, medidas, referencias culturales, iconografía y aspectos técnicos → la localización es más amplia y técnica que la traducción textual"
        rationale: "La localización (L10n) es la industria de la traducción más importante en términos económicos; requiere perfiles técnicos además de lingüísticos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son las limitaciones actuales de la traducción automática neural (DeepL, GPT) frente a la traducción humana? (la TA es más lenta que la humana/no tiene limitaciones relevantes/la TA neural es excelente en textos predecibles y literales pero tiene dificultades con la ironía, el humor, los juegos de palabras, los registros especializados y los textos literarios → carece de conocimiento del mundo, conciencia cultural y capacidad de tomar decisiones éticas sobre estrategias de traducción)"
        correctAnswer: la TA neural es excelente en textos predecibles y literales pero tiene dificultades con la ironía, el humor, los juegos de palabras, los registros especializados y los textos literarios → carece de conocimiento del mundo, conciencia cultural y capacidad de tomar decisiones éticas sobre estrategias de traducción
        rationale: "La traducción automática neural (Transformer, 2017) ha transformado la industria; la revisión por humanos (MTPE: Machine Translation Post-Editing) es el nuevo modelo de trabajo del sector."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia la interpretación simultánea de la consecutiva y cuándo se usa cada una? (solo difieren en la cabina/simultánea: el intérprete traduce al mismo tiempo que el orador habla (desfase de 2-4 segundos) desde una cabina → se usa en conferencias internacionales; consecutiva: el orador hace pausas y el intérprete toma notas y reproduce el segmento → se usa en negociaciones bilaterales, visitas oficiales, tribunales/la simultánea es más precisa siempre)"
        correctAnswer: "simultánea: el intérprete traduce al mismo tiempo que el orador habla (desfase de 2-4 segundos) desde una cabina → se usa en conferencias internacionales; consecutiva: el orador hace pausas y el intérprete toma notas y reproduce el segmento → se usa en negociaciones bilaterales, visitas oficiales, tribunales"
        rationale: "Las dos modalidades de interpretación requieren habilidades diferentes; la simultánea demanda una carga cognitiva extrema (doble tarea: escuchar y hablar a la vez)."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Giro Cultural y Ética de la Traducción
    exercises:
      - type: grammar
        question: "¿Qué es el giro cultural en la traductología (cultural turn) y cuándo ocurrió? (el estudio de las traducciones de textos históricos/el cambio de enfoque en los años 80-90 que situó la traducción en su contexto cultural, histórico e ideológico → se pasó de la lingüística comparada a los estudios culturales → Bassnett, Lefevere, Toury: la traducción no es solo transferencia lingüística sino reescritura cultural/un nuevo método de aprender idiomas)"
        correctAnswer: "el cambio de enfoque en los años 80-90 que situó la traducción en su contexto cultural, histórico e ideológico → se pasó de la lingüística comparada a los estudios culturales → Bassnett, Lefevere, Toury: la traducción no es solo transferencia lingüística sino reescritura cultural"
        rationale: "El 'cultural turn' en la traductología amplió el objeto de estudio: la pregunta ya no es solo '¿cómo traducir?' sino '¿por qué se traduce esto, para quién y con qué efectos ideológicos?'"
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el mecenazgo (patronage) en la traductología de Lefevere y cómo condiciona las traducciones? (la financiación individual de las traducciones/el conjunto de personas e instituciones (editoriales, Estados, Iglesias) que controlan la difusión de la literatura a través de la traducción → el mecenas selecciona qué se traduce, cómo y cuándo → las traducciones reflejan los valores e intereses del mecenas/el apoyo de los traductores a sus autores)"
        correctAnswer: el conjunto de personas e instituciones (editoriales, Estados, Iglesias) que controlan la difusión de la literatura a través de la traducción → el mecenas selecciona qué se traduce, cómo y cuándo → las traducciones reflejan los valores e intereses del mecenas
        rationale: "El concepto de mecenazgo de Lefevere ('Translation, Rewriting and the Manipulation of Literary Fame', 1992) muestra el poder que tienen los actores no-lingüísticos sobre el canon literario internacional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la equivalencia funcional en la traducción jurídica y cuándo entra en conflicto con la fidelidad formal? (cuando el texto es muy largo/la equivalencia funcional busca que el texto traducido tenga el mismo efecto jurídico en el sistema meta; la fidelidad formal reproduce la forma del original → conflicto: un contrato con 'consideration' (común law) no tiene equivalente funcional exacto en el derecho civil → el traductor debe elegir entre precisión formal e inteligibilidad funcional/son lo mismo en derecho)"
        correctAnswer: "la equivalencia funcional busca que el texto traducido tenga el mismo efecto jurídico en el sistema meta; la fidelidad formal reproduce la forma del original → conflicto: un contrato con 'consideration' (common law) no tiene equivalente funcional exacto en el derecho civil → el traductor debe elegir entre precisión formal e inteligibilidad funcional"
        rationale: "La equivalencia funcional en la traducción jurídica es una exigencia del sistema legal: el texto traducido debe ser válido en el ordenamiento de destino, no solo inteligible."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo aplica la traductología feminista la crítica de género a la traducción? (que las mujeres no deben traducir textos de hombres/que las traductoras feministas (Lotbinière-Harwood, von Flotow) reconocen y manipulan intencionalmente el género en la traducción → en lenguas con género gramatical, el masculino genérico puede neutralizarse → la invisibilización de las mujeres en el lenguaje puede denunciarse en la traducción/que la traducción no tiene dimensiones políticas)"
        correctAnswer: que las traductoras feministas reconocen y manipulan intencionalmente el género en la traducción → en lenguas con género gramatical, el masculino genérico puede neutralizarse → la invisibilización de las mujeres en el lenguaje puede denunciarse en la traducción
        rationale: "La traductología feminista (años 80-90) fue una de las primeras en politizar explícitamente la traducción; la nota de traductora que explica sus elecciones es una estrategia típica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los universales de la traducción y cuáles son los más estudiados? (las reglas de la ONU para traductores/tendencias sistemáticas observadas en textos traducidos independientemente de las lenguas implicadas → explicitación (los textos traducidos son más explícitos que los originales), normalización (se acercan a los patrones típicos de la lengua meta), simplificación (se reduce la complejidad léxica y sintáctica)/propiedades que tienen todos los traductores)"
        correctAnswer: tendencias sistemáticas observadas en textos traducidos independientemente de las lenguas implicadas → explicitación (los textos traducidos son más explícitos que los originales), normalización (se acercan a los patrones típicos de la lengua meta), simplificación (se reduce la complejidad léxica y sintáctica)
        rationale: "Los universales de la traducción (Baker, 1993; Laviosa) son objeto de debate: ¿son propiedades universales del proceso o artefactos metodológicos? La lingüística de corpus los ha estudiado extensamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la adaptación como procedimiento traductor y en qué difiere de la equivalencia cultural? (la adaptación es una traducción libre sin restricciones/la adaptación sustituye una realidad cultural intraducible por otra equivalente en la cultura meta → 'cricket' (deporte inglés) → 'béisbol' en un texto americano; la equivalencia cultural busca un referente funcionalmente equivalente → 'bread and butter' → 'pan de cada día' → la adaptación es más radical/la adaptación cambia el significado completamente)"
        correctAnswer: la adaptación sustituye una realidad cultural intraducible por otra equivalente en la cultura meta → 'cricket' (deporte inglés) → 'béisbol' en un texto americano; la equivalencia cultural busca un referente funcionalmente equivalente → 'bread and butter' → 'pan de cada día' → la adaptación es más radical
        rationale: "La distinción entre equivalencia y adaptación es de grado: la equivalencia busca el referente más próximo; la adaptación reemplaza completamente el referente cultural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo afecta la revisión humana (MTPE) de la traducción automática al perfil profesional del traductor? (que los traductores son redundantes/que el traductor se convierte en editor y revisor de la salida de la máquina: necesita velocidad para identificar errores, criterio para decidir cuándo aceptar o rechazar propuestas y habilidades de control de calidad → el perfil se vuelve más técnico y la productividad aumenta/que el MTPE elimina la necesidad de formación traductológica)"
        correctAnswer: "que el traductor se convierte en editor y revisor de la salida de la máquina: necesita velocidad para identificar errores, criterio para decidir cuándo aceptar o rechazar propuestas y habilidades de control de calidad → el perfil se vuelve más técnico y la productividad aumenta"
        rationale: "El MTPE ha transformado las condiciones laborales del sector: la productividad aumenta pero los precios por palabra bajan; el debate sobre calidad y condiciones de trabajo es intenso en la industria."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la traducción literaria es especialmente compleja frente a la técnica o jurídica? (porque los textos literarios son más largos/porque la traducción literaria debe preservar no solo el contenido sino el estilo, la voz, el ritmo, los juegos de palabras y las referencias culturales → el traductor literario es un co-autor que toma decisiones estéticas → la invisibilidad del traductor (Venuti) es especialmente cuestionable en literatura/porque la literatura no tiene terminología técnica)"
        correctAnswer: porque la traducción literaria debe preservar no solo el contenido sino el estilo, la voz, el ritmo, los juegos de palabras y las referencias culturales → el traductor literario es un co-autor que toma decisiones estéticas → la invisibilidad del traductor (Venuti) es especialmente cuestionable en literatura
        rationale: "La visibilidad del traductor literario es central en la traductología contemporánea; el trabajo creativo del traductor raramente recibe el reconocimiento que merece en la industria editorial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los estudios de traducción (Translation Studies) como disciplina académica y qué enfoques integra? (la práctica profesional de la traducción/la disciplina académica autónoma fundada por Holmes (1972) que integra enfoques lingüísticos (análisis contrastivo, equivalencia), culturales (giro cultural), cognitivos (procesos mentales del traductor), sociológicos (el campo de la traducción, el papel del traductor) y de corpus (análisis cuantitativo de traducciones)/un curso de traducción avanzado)"
        correctAnswer: la disciplina académica autónoma fundada por Holmes (1972) que integra enfoques lingüísticos (análisis contrastivo, equivalencia), culturales (giro cultural), cognitivos (procesos mentales del traductor), sociológicos (el campo de la traducción, el papel del traductor) y de corpus (análisis cuantitativo de traducciones)
        rationale: "El artículo de Holmes 'The Name and Nature of Translation Studies' (1972) fundó la disciplina; el mapa de Holmes-Toury organiza los enfoques teóricos, descriptivos y aplicados."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se aborda la ética de la traducción en la traductología contemporánea? (que el traductor no tiene responsabilidades éticas/desde la ética de la diferencia (Berman: respetar la letra del original) y la ética del cuidado (el traductor cuida al lector y al autor) → preguntas éticas: ¿puede el traductor censurar contenido ofensivo? ¿Debe explicitar las notas o mantener la fluidez? ¿Quién posee el texto traducido?/la traducción es siempre neutral éticamente)"
        correctAnswer: "desde la ética de la diferencia (Berman: respetar la letra del original) y la ética del cuidado (el traductor cuida al lector y al autor) → preguntas éticas: ¿puede el traductor censurar contenido ofensivo? ¿Debe explicitar las notas o mantener la fluidez? ¿Quién posee el texto traducido?"
        rationale: "La ética de la traducción es un campo emergente; el traductor toma decisiones con consecuencias ideológicas y culturales que las perspectivas prescriptivas tradicionales ignoraban."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
