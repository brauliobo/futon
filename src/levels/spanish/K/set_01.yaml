title: 🧬 Gramática - Lingüística Histórica y Cambio Lingüístico
level: K
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada sobre lingüística histórica: la reconstrucción comparada (método comparativo), el protoindoeuropeo, la gramática histórica del español (latín vulgar → español), los cambios fonológicos (Ley de Grimm, sonorización de oclusivas sordas intervocálicas, diptongación), los cambios morfológicos y sintácticos, la analogía, el cambio semántico (amelioración, peyoración, generalización, restricción), y el concepto de familia lingüística."
example: "La sonorización de oclusivas sordas intervocálicas: VITA > vida, LUPU > lobo → /p t k/ entre vocales → /b d g/ en latín vulgar hispánico."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Cambio Fonológico e Historia del Español
    exercises:
      - type: grammar
        question: "¿Qué es el método comparativo en lingüística histórica y qué permite reconstruir? (la comparación de diccionarios/el método que compara cognados (palabras de origen común) en lenguas emparentadas para reconstruir formas no atestiguadas de la lengua ancestral → permite reconstruir el protoindoeuropeo (PIE) mediante correspondencias sistemáticas/el análisis de préstamos léxicos)"
        correctAnswer: el método que compara cognados (palabras de origen común) en lenguas emparentadas para reconstruir formas no atestiguadas de la lengua ancestral → permite reconstruir el protoindoeuropeo (PIE) mediante correspondencias sistemáticas
        rationale: "El método comparativo (Jones, Rask, Grimm, Bopp) identifica correspondencias regulares entre lenguas; la regularidad es la clave: el cambio fonológico es sistemático."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué establece la Ley de Grimm sobre el cambio consonántico en las lenguas germánicas? (que el inglés y el latín son idénticos/que las oclusivas del PIE sufrieron un desplazamiento sistemático al pasar al germánico → PIE *p > germ. f (PATER > father); *t > þ (TRES > three); *k > h (CANIS > hound) → explica las diferencias entre latín/español y lenguas germánicas/que el latín es más antiguo que el germánico)"
        correctAnswer: que las oclusivas del PIE sufrieron un desplazamiento sistemático al pasar al germánico → PIE *p > germ. f (PATER > father); *t > þ (TRES > three); *k > h (CANIS > hound) → explica las diferencias entre latín/español y lenguas germánicas
        rationale: "La Ley de Grimm (1822) fue el primer descubrimiento de un cambio fonológico regular masivo; demostró que los cambios son sistémáticos, no aleatorios."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la sonorización de oclusivas sordas intervocálicas en la historia del español? (un fenómeno del castellano moderno/el cambio por el cual /p t k/ latinos entre vocales → /b d ɡ/ en latín vulgar hispánico → VITA > vida, LUPU > lobo, PACARE > pagar → uno de los cambios fonológicos más importantes del latín al español/la pérdida de la -s final)"
        correctAnswer: el cambio por el cual /p t k/ latinos entre vocales → /b d ɡ/ en latín vulgar hispánico → VITA > vida, LUPU > lobo, PACARE > pagar → uno de los cambios fonológicos más importantes del latín al español
        rationale: "La sonorización intervocálica es característica del romance occidental (español, portugués, catalán); el italiano la conserva parcialmente y el francés la lleva aún más lejos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la diptongación de las vocales breves tónicas latinas en español? (la pérdida del acento tónico/la pérdida de vocales/el cambio por el cual la Ĕ y Ŏ breves tónicas latinas diptongaron → PĔTRA > piedra, NŎVEM > nueve; pero las vocales largas no diptongaron → PĒNA > pena, BŌNUM > bueno)"
        correctAnswer: el cambio por el cual la Ĕ y Ŏ breves tónicas latinas diptongaron → PĔTRA > piedra, NŎVEM > nueve; pero las vocales largas no diptongaron → PĒNA > pena, BŌNUM > bueno
        rationale: "La diptongación es un fenómeno castellano (no general del romance) que afectó solo a las vocales breves medias en sílaba tónica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la analogía como mecanismo de cambio morfológico? (la imitación de palabras extranjeras/la extensión de un patrón morfológico productivo a formas irregulares por presión del paradigma → DICĔ > 'dize' → 'dice' (analógico con el resto del paradigma); verbos fuertes → formas débiles (anduve analógico de tuve)/la creación de nuevas palabras por composición)"
        correctAnswer: la extensión de un patrón morfológico productivo a formas irregulares por presión del paradigma → DICĔ > 'dize' → 'dice' (analógico con el resto del paradigma); verbos fuertes → formas débiles (anduve analógico de tuve)
        rationale: "La analogía regulariza el sistema morfológico; opera en tensión con el cambio fonético regular (el neogramático): los cambios fonéticos crean irregularidades que la analogía elimina."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son las cuatro familias lingüísticas de la Península Ibérica antes de la expansión del español? (árabe, latín, griego, celta/latín (con sus derivados romance), vasco (lengua aislada), árabe (influencia de Al-Ándalus) y las lenguas prerromanas (ibérico, celta)/solo el latín y el vasco)"
        correctAnswer: latín (con sus derivados romance), vasco (lengua aislada), árabe (influencia de Al-Ándalus) y las lenguas prerromanas (ibérico, celta)
        rationale: "La Península Ibérica fue un espacio de contacto lingüístico durante siglos; el árabe aportó miles de préstamos al español (aceite, alcalde, azúcar, cifra)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la amelioración semántica con un ejemplo del español? (la pérdida del significado de una palabra/el proceso por el cual una palabra adquiere un valor más positivo con el tiempo → 'ministro' (latín: servidor, criado) → alto cargo público → de significado inferior a superior/la adición de un prefijo negativo)"
        correctAnswer: "el proceso por el cual una palabra adquiere un valor más positivo con el tiempo → 'ministro' (latín: servidor, criado) → alto cargo público → de significado inferior a superior"
        rationale: "La amelioración (mejora semántica) es opuesta a la peyoración; 'caballero' (el que va a caballo, sin connotación noble) → persona de alta clase social es otro ejemplo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la peyoración semántica con un ejemplo? (la generalización del significado/el proceso por el cual una palabra adquiere un valor más negativo con el tiempo → 'villano' (habitante de una villa, sin connotación negativa) → persona ruin y malvada → de significado neutro a negativo/la restricción del significado a un campo técnico)"
        correctAnswer: el proceso por el cual una palabra adquiere un valor más negativo con el tiempo → 'villano' (habitante de una villa, sin connotación negativa) → persona ruin y malvada → de significado neutro a negativo
        rationale: "La peyoración refleja actitudes sociales: 'siervo', 'moro', 'judío' en ciertos contextos históricos sufrieron peyoración por factores socioculturales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la simplificación del sistema casual latino en el paso al español? (la creación de nuevos casos/la pérdida de los seis casos del latín clásico (nominativo, acusativo, genitivo, dativo, ablativo, vocativo) → el español retiene solo vestigios en pronombres (yo/me/mí) y compensa la pérdida de casos con el orden SVO fijo y el uso de preposiciones/la conservación de todos los casos)"
        correctAnswer: la pérdida de los seis casos del latín clásico (nominativo, acusativo, genitivo, dativo, ablativo, vocativo) → el español retiene solo vestigios en pronombres (yo/me/mí) y compensa la pérdida de casos con el orden SVO fijo y el uso de preposiciones
        rationale: "El latín vulgar redujo progresivamente los casos hasta dos (nominativo/acusativo); el castellano medieval perdió también esa distinción, fijando el orden sintáctico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el latín vulgar y por qué es el origen del español y no el latín clásico? (el latín eclesiástico de la Iglesia/el latín hablado por el pueblo romano (clases no cultas, soldados, comerciantes) que difería significativamente del latín literario clásico → era más analítico, perdía casos, usaba el artículo, simplificaba la fonología → fue la lengua de la colonización romana, no el latín clásico/el latín tardío de los siglos IV-V d.C.)"
        correctAnswer: el latín hablado por el pueblo romano (clases no cultas, soldados, comerciantes) que difería significativamente del latín literario clásico → era más analítico, perdía casos, usaba el artículo, simplificaba la fonología → fue la lengua de la colonización romana, no el latín clásico
        rationale: "El latín vulgar representa el habla coloquial del pueblo romano, no el latín literario; fue el vehículo de transmisión real y el origen de todas las lenguas romances."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Cambio Sintáctico, Semántico y Familias Lingüísticas
    exercises:
      - type: grammar
        question: "¿Cómo surgió el artículo determinado español 'el/la' desde el latín? (del pronombre demostrativo HUNC/HANC/el artículo determinado 'el/la' deriva del demostrativo latino ILLE/ILLA (aquel, aquella) que fue gramaticalizándose como determinante → ILLE LUPUS > el lobo → pérdida del énfasis demostrativo y reducción fonética/del pronombre relativo QUI/QUAE)"
        correctAnswer: el artículo determinado 'el/la' deriva del demostrativo latino ILLE/ILLA (aquel, aquella) que fue gramaticalizándose como determinante → ILLE LUPUS > el lobo → pérdida del énfasis demostrativo y reducción fonética
        rationale: "La gramaticalización de ILLE > el/la es un ejemplo clásico de bleaching semántico: la palabra pierde su fuerza deíctica original y adquiere función puramente gramatical."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la gramaticalización como proceso de cambio lingüístico? (la creación de nueva gramática por legislación/el proceso por el cual una forma léxica adquiere gradualmente función gramatical con pérdida de contenido semántico → HABEO (tener) + infinitivo → futuro romance ('hablar he' > hablaré) → HABEO se gramaticaliza como morfema de futuro/la simplificación del vocabulario)"
        correctAnswer: el proceso por el cual una forma léxica adquiere gradualmente función gramatical con pérdida de contenido semántico → HABEO (tener) + infinitivo → futuro romance ('hablar he' > hablaré) → HABEO se gramaticaliza como morfema de futuro
        rationale: "La gramaticalización (Meillet, 1912) es uno de los principales mecanismos de cambio morfosintáctico; el futuro románico es uno de los ejemplos más citados."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la restricción semántica con un ejemplo y su opuesto, la generalización? (la adición de prefijos/restricción: una palabra de significado amplio acota su significado → 'veneno' (latín: VENENUM, cualquier filtro mágico, amor o veneno) → solo sustancia tóxica; generalización: lo opuesto → 'cosa' (causa, proceso judicial) → cualquier objeto/dos tipos de metáfora)"
        correctAnswer: "restricción: una palabra de significado amplio acota su significado → 'veneno' (latín: VENENUM, cualquier filtro mágico, amor o veneno) → solo sustancia tóxica; generalización: lo opuesto → 'cosa' (causa, proceso judicial) → cualquier objeto"
        rationale: "Restricción y generalización son procesos semánticos inversos; ambos reflejan cómo el uso social va estabilizando o ampliando los referentes de las palabras."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el origen del sistema de futuros perifrásticos del español ('voy a hablar', 'tengo que hablar')? (son inventos modernos sin origen histórico/son construcciones perifrásticas que se han gramaticalizado parcialmente → VADO (ir) + infinitivo > 'voy a + infinitivo' expresa futuro próximo; HABEO + AD + infinitivo > 'tengo que + infinitivo' expresa obligación con matiz de futuro → la gramaticalización está en curso/son préstamos del francés)"
        correctAnswer: son construcciones perifrásticas que se han gramaticalizado parcialmente → VADO (ir) + infinitivo > 'voy a + infinitivo' expresa futuro próximo; HABEO + AD + infinitivo > 'tengo que + infinitivo' expresa obligación con matiz de futuro → la gramaticalización está en curso
        rationale: "El español está experimentando un ciclo de gramaticalización: el futuro sintético '-ré' cede ante 'voy a + inf.' en el habla coloquial, como ocurrió con el futuro latino."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las lenguas aisladas (language isolates) y cuál es el ejemplo más conocido en Europa? (lenguas con pocas palabras/lenguas sin parentesco demostrado con ninguna otra familia lingüística → el vasco (euskera) es el aislado europeo más conocido: preexiste a las lenguas indoeuropeas en la Península y no tiene origen conocido/lenguas con un solo hablante)"
        correctAnswer: "lenguas sin parentesco demostrado con ninguna otra familia lingüística → el vasco (euskera) es el aislado europeo más conocido: preexiste a las lenguas indoeuropeas en la Península y no tiene origen conocido"
        rationale: "El vasco es un enigma lingüístico; su origen preindoeuropeo y su morfología ergativa-absolutiva lo hacen tipológicamente único en el contexto europeo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo explica la neogramatística el concepto de 'ley fonética sin excepción'? (que todos los cambios fonéticos son irregulares/que los cambios fonéticos afectan a todas las palabras que cumplen las condiciones fonológicas del cambio, sin excepciones → las aparentes excepciones se explican por préstamos tardíos, analogía o condicionamiento fonético especial/que solo hay cambios esporádicos)"
        correctAnswer: que los cambios fonéticos afectan a todas las palabras que cumplen las condiciones fonológicas del cambio, sin excepciones → las aparentes excepciones se explican por préstamos tardíos, analogía o condicionamiento fonético especial
        rationale: "Los neogramáticos (Brugmann, Osthoff, 1878) postularon la regularidad absoluta del cambio fonético, lo que transformó la lingüística en una ciencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la metátesis y cuál es un ejemplo del español? (la supresión de un fonema/la transposición de fonemas dentro de una palabra → PARABOLA > palabra (metátesis de /r/: parábola > pálabra → /r/ adelantó); PRAEDICARE > predicar (grupo consonántico simplificado)/la adición de una vocal protética)"
        correctAnswer: "la transposición de fonemas dentro de una palabra → PARABOLA > palabra (metátesis de /r/: parábola > pálabra → /r/ adelantó); PRAEDICARE > predicar (grupo consonántico simplificado)"
        rationale: "La metátesis es un cambio fonético frecuente; en español medieval afectó también a /l-r/: 'peligro' del latín PERICULUM (con metátesis de /r/ y /l/)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el cambio de la f- inicial latina a h- aspirada (y luego muda) en español? (un préstamo del árabe/el cambio por el cual F- latina inicial ante vocal o diptongo pasa a h- en castellano → FILIU > hijo, FABULARE > hablar, FACERE > hacer → es un cambio castellano que no ocurrió en catalán, portugués ni francés/un cambio reciente del siglo XIX)"
        correctAnswer: el cambio por el cual F- latina inicial ante vocal o diptongo pasa a h- en castellano → FILIU > hijo, FABULARE > hablar, FACERE > hacer → es un cambio castellano que no ocurrió en catalán, portugués ni francés
        rationale: "El cambio F- > h- es exclusivo del castellano y uno de sus rasgos más llamativos; la h- fue aspirada en el castellano medieval y luego enmudecida."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se reconstruye el protoindoeuropeo (PIE) y qué lenguas incluye esta familia? (por documentos escritos del PIE/mediante el método comparativo aplicado a las lenguas históricas más antiguas (sánscrito, griego, latín, hitita) → el PIE no está atestiguado pero se reconstruye con asterisco (*); incluye indoiranio, griego, itálico, germánico, eslavo, báltico, celta, armenio, albanés, tocario, anatólico/PIE solo incluye latín y griego)"
        correctAnswer: mediante el método comparativo aplicado a las lenguas históricas más antiguas (sánscrito, griego, latín, hitita) → el PIE no está atestiguado pero se reconstruye con asterisco (*); incluye indoiranio, griego, itálico, germánico, eslavo, báltico, celta, armenio, albanés, tocario, anatólico
        rationale: "El PIE se reconstruye mediante el método comparativo; el hitita permitió refinar el modelo; incluye indoiranio, griego, itálico, germánico, eslavo y más familias."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la apócope y cuál es un ejemplo en la historia del español? (la adición de una sílaba al inicio/la pérdida de uno o varios sonidos al final de una palabra → BONE > buen (apócope ante sustantivo masculino singular); SANCTE IACOBU > Santiago → fenómeno frecuente en la evolución del latín al español/la inserción de una vocal eufónica)"
        correctAnswer: la pérdida de uno o varios sonidos al final de una palabra → BONE > buen (apócope ante sustantivo masculino singular); SANCTE IACOBU > Santiago → fenómeno frecuente en la evolución del latín al español
        rationale: "La apócope es opuesta a la apéntesis o paragoge; en el castellano medieval hubo una tendencia fuerte a la apócope que luego se retrajo parcialmente."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
