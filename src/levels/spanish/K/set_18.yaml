pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El Renacimiento (siglos XIV-XVI) fue el período de renovación cultural en Europa que miró a la Antigüedad clásica como modelo e impulsó el humanismo: el ser humano como medida de todas las cosas. Pico della Mirandola ('Discurso sobre la dignidad del hombre', 1486) articuló el ideal humanista: la libertad humana para determinarse a sí misma. Erasmo de Rotterdam representó el humanismo cristiano: la crítica a la corrupción de la Iglesia y la vuelta a las fuentes (ad fontes). La imprenta de Gutenberg (1440s) revolucionó la difusión del conocimiento: los libros se multiplicaron → la Reforma Protestante (Lutero, 1517) aprovechó la imprenta para propagar sus ideas. Nicolás Copérnico ('De revolutionibus', 1543) propuso el heliocentrismo: la Tierra gira alrededor del Sol, no al revés → contradecía la física aristotélica y la visión bíblica. Galileo Galilei usó el telescopio (1609) para observar los satélites de Júpiter y las fases de Venus → pruebas empíricas del heliocentrismo → fue condenado por la Inquisición (1633). Johannes Kepler formuló las tres leyes del movimiento planetario: las órbitas son elipses, no círculos perfectos. Isaac Newton ('Principia Mathematica', 1687) unificó la física terrestre y celeste con la ley de gravitación universal → la misma ley explica la caída de la manzana y el movimiento de los planetas. El método científico moderno: Francis Bacon (inducción: de los datos a la teoría), René Descartes (deducción: de principios claros a consecuencias) → dos modelos epistemológicos complementarios. La conquista de América (1492) amplió el horizonte del mundo conocido y cuestionó la autoridad de los textos clásicos: había fauna, flora y culturas que Aristóteles no mencionaba."
    exercises:
      - type: reading
        question: "¿Cuál es el ideal humanista del Renacimiento según Pico della Mirandola? (la subordinación del ser humano a Dios/la dignidad y libertad humana para determinarse a sí misma → el ser humano no tiene una naturaleza fija sino que puede cultivarse a sí mismo → el humanismo puso al ser humano en el centro de la reflexión cultural/la vuelta al aristotelismo medieval)"
        correctAnswer: la dignidad y libertad humana para determinarse a sí misma → el ser humano no tiene una naturaleza fija sino que puede cultivarse a sí mismo → el humanismo puso al ser humano en el centro de la reflexión cultural
        rationale: "El texto: 'Pico della Mirandola articuló el ideal humanista: la libertad humana para determinarse a sí misma'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué papel tuvo la imprenta de Gutenberg en la Reforma Protestante y la difusión del conocimiento? (ninguno relevante/al multiplicar la producción de libros a bajo coste, permitió que las ideas de Lutero se difundieran masivamente y alcanzaran toda Europa antes de que la Iglesia pudiera controlarlas → el saber dejó de estar monopolizado por la Iglesia y las universidades/solo imprimió Biblias latinas)"
        correctAnswer: al multiplicar la producción de libros a bajo coste, permitió que las ideas de Lutero se difundieran masivamente y alcanzaran toda Europa antes de que la Iglesia pudiera controlarlas → el saber dejó de estar monopolizado por la Iglesia y las universidades
        rationale: "El texto: 'La imprenta de Gutenberg revolucionó la difusión del conocimiento → la Reforma Protestante aprovechó la imprenta para propagar sus ideas'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué pruebas empíricas aportó Galileo a favor del heliocentrismo? (cálculos matemáticos/las observaciones con el telescopio (1609): los satélites de Júpiter (demostrando que no todo orbita la Tierra), las fases de Venus (solo explicables si Venus orbita el Sol) y las manchas solares → pruebas observacionales directas del modelo heliocéntrico/la lectura de los textos de Copérnico)"
        correctAnswer: las observaciones con el telescopio (1609): los satélites de Júpiter (demostrando que no todo orbita la Tierra), las fases de Venus (solo explicables si Venus orbita el Sol) y las manchas solares → pruebas observacionales directas del modelo heliocéntrico
        rationale: "El texto: 'Galileo usó el telescopio (1609) para observar los satélites de Júpiter y las fases de Venus → pruebas empíricas del heliocentrismo'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la importancia de la síntesis newtoniana para la historia de la ciencia? (que Newton descubrió la manzana/que unificó la física terrestre y celeste con la ley de gravitación universal → la misma ley matemática explica la caída de los cuerpos en la Tierra y el movimiento de los planetas → demostró que el universo sigue leyes matemáticas universales/que Newton refutó a Galileo)"
        correctAnswer: que unificó la física terrestre y celeste con la ley de gravitación universal → la misma ley matemática explica la caída de los cuerpos en la Tierra y el movimiento de los planetas → demostró que el universo sigue leyes matemáticas universales
        rationale: "El texto: 'Newton unificó la física terrestre y celeste con la ley de gravitación universal → la misma ley explica la caída de la manzana y el movimiento de los planetas'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la diferencia entre el método inductivo de Bacon y el deductivo de Descartes? (que uno es más antiguo/Bacon: el conocimiento se construye partiendo de la observación de muchos casos particulares para llegar a generalizaciones (inducción); Descartes: el conocimiento se deduce de principios claros y evidentes (deducción) → dos tradiciones del método científico: empirismo británico vs. racionalismo continental/que Bacon es más fiable que Descartes)"
        correctAnswer: Bacon: el conocimiento se construye partiendo de la observación de muchos casos particulares para llegar a generalizaciones (inducción); Descartes: el conocimiento se deduce de principios claros y evidentes (deducción) → dos tradiciones del método científico: empirismo británico vs. racionalismo continental
        rationale: "El texto: 'El método científico moderno: Francis Bacon (inducción: de los datos a la teoría), René Descartes (deducción: de principios claros a consecuencias) → dos modelos epistemológicos complementarios'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué la conquista de América cuestionó la autoridad de los textos clásicos como Aristóteles? (porque América era más avanzada que Europa/porque había fauna, flora, culturas y geografías que los autores clásicos no conocían ni mencionaban → la experiencia empírica desafiaba la autoridad de los textos escritos: no todo el conocimiento estaba ya en los libros/porque Aristóteles criticó el imperialismo)"
        correctAnswer: porque había fauna, flora, culturas y geografías que los autores clásicos no conocían ni mencionaban → la experiencia empírica desafiaba la autoridad de los textos escritos: no todo el conocimiento estaba ya en los libros
        rationale: "El texto: 'La conquista de América cuestionó la autoridad de los textos clásicos: había fauna, flora y culturas que Aristóteles no mencionaba'."
        difficulty: 5
