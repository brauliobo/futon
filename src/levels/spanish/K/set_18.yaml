        question: "¿Cómo refutaron las leyes de Kepler la física aristotélica de las esferas perfectas? (que Kepler demostró que la Tierra está en el centro/que las órbitas son elipses, no círculos perfectos como exigía la física aristotélica → los cuerpos celestes no siguen los movimientos circulares uniformes que Aristóteles consideraba perfectos → la naturaleza es matemáticamente describible pero no geométricamente simple/que Kepler confirmó la física aristotélica)"
        correctAnswer: que las órbitas son elipses, no círculos perfectos como exigía la física aristotélica → los cuerpos celestes no siguen los movimientos circulares uniformes que Aristóteles consideraba perfectos → la naturaleza es matemáticamente describible pero no geométricamente simple
        rationale: "El texto: 'Kepler formuló las tres leyes del movimiento planetario: las órbitas son elipses, no círculos perfectos'."
