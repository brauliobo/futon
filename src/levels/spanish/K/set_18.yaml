        question: "¿Cómo se relacionan el Renacimiento y la Revolución Científica con el concepto de modernidad? (no tienen relación/el Renacimiento rompió con la visión medieval de un universo estático ordenado por Dios; la Revolución Científica estableció la razón y la experiencia como fuentes del conocimiento → juntos fundaron la modernidad: el ser humano autónomo, capaz de conocer y transformar el mundo/la modernidad es exclusivamente del siglo XX)"
        correctAnswer: el Renacimiento rompió con la visión medieval de un universo estático ordenado por Dios; la Revolución Científica estableció la razón y la experiencia como fuentes del conocimiento → juntos fundaron la modernidad: el ser humano autónomo, capaz de conocer y transformar el mundo
        rationale: "La articulación Renacimiento-Revolución Científica-Modernidad es el marco estándar de la historia intelectual occidental; ambos movimientos desplazaron la autoridad del texto antiguo y religioso por la experiencia y la razón."
