        question: "¿Por qué fue condenado Galileo por la Inquisición y qué simboliza su caso? (porque Galileo era protestante/porque sus observaciones apoyaban el heliocentrismo de Copérnico, que contradecía la interpretación literal de las Escrituras y la física aristotélica → el caso Galileo simboliza el conflicto entre el conocimiento empírico y la autoridad religiosa (aunque la historia real es más compleja)/porque negó la existencia de Dios)"
        correctAnswer: porque sus observaciones apoyaban el heliocentrismo de Copérnico, que contradecía la interpretación literal de las Escrituras y la física aristotélica → el caso Galileo simboliza el conflicto entre el conocimiento empírico y la autoridad religiosa (aunque la historia real es más compleja)
        rationale: "El texto: 'Galileo fue condenado por la Inquisición (1633)' — el caso Galileo se ha convertido en un símbolo del conflicto entre ciencia y religión, aunque los historiadores de la ciencia señalan que la realidad fue más matizada."
