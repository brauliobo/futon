        question: "¿Qué representa Erasmo de Rotterdam en el contexto del humanismo renacentista? (el humanismo pagano/el humanismo cristiano: la crítica a la corrupción y al dogmatismo de la Iglesia desde dentro del cristianismo → 'volver a las fuentes' (ad fontes): leer directamente los textos bíblicos y patrísticos en griego y latín/el humanismo ateo del siglo XVI)"
        correctAnswer: el humanismo cristiano: la crítica a la corrupción y al dogmatismo de la Iglesia desde dentro del cristianismo → 'volver a las fuentes' (ad fontes): leer directamente los textos bíblicos y patrísticos en griego y latín
        rationale: "El texto: 'Erasmo de Rotterdam representó el humanismo cristiano: la crítica a la corrupción de la Iglesia y la vuelta a las fuentes (ad fontes)'."
