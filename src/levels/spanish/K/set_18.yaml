authorNotes: "Texto expositivo sobre el Renacimiento y la Revolución Científica: el humanismo (Erasmo, Pico della Mirandola), el heliocentrismo de Copérnico, Galileo y la caída del aristotelismo, Kepler y las leyes del movimiento planetario, Newton y la síntesis mecánica, el método científico (Bacon: inducción; Descartes: deducción), la imprenta de Gutenberg y la difusión del conocimiento, la Reforma Protestante y sus efectos culturales, y el impacto de la conquista de América en la visión del mundo europeo."
example: "geocentrismo Ptolomeo → Copérnico: heliocentrismo (1543) → Tycho Brahe: observaciones precisas → Kepler: leyes elípticas → Galileo: telescopio/mecánica/conflicto Iglesia → Newton: gravitación universal/síntesis → revolución científica: método experimental + matemáticas → factores: imprenta/patronazgo/Reforma protestante."
