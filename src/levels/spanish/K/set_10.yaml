    title: El Texto
    description: "Texto: La literatura latinoamericana del siglo XX es una de las más ricas y originales de la literatura mundial. El modernismo, con Rubén Darío (Nicaragua, 1867-1916) como figura máxima, renovó la lengua literaria hispánica con su 'Azul...' (1888) y 'Prosas profanas' (1896): musicalidad, exotismo, esteticismo y simbolismo francés. Las vanguardias de los años 20: el ultraísmo (influido por el futurismo) en España y Argentina; el creacionismo de Vicente Huidobro (Chile); el estridentismo mexicano. Jorge Luis Borges (Argentina, 1899-1986) creó una literatura fantástica y metafísica única: los laberintos, los espejos, el tiempo circular y la biblioteca infinita son sus motivos centrales ('Ficciones', 1944; 'El Aleph', 1949). El boom latinoamericano (años 60-70) irrumpió en el panorama mundial: Gabriel García Márquez ('Cien años de soledad', 1967) sintetizó el realismo mágico → la realidad y lo maravilloso coexisten sin asombro; Mario Vargas Llosa ('La ciudad y los perros', 1963) exploró la sociedad peruana con técnicas narrativas experimentales; Julio Cortázar ('Rayuela', 1963) propuso una novela que podía leerse en varios órdenes; Carlos Fuentes ('La muerte de Artemio Cruz', 1962) recreó la historia de México. Pablo Neruda (Chile, Nóbel 1971) fue el gran poeta de la lengua española del siglo: 'Veinte poemas de amor y una canción desesperada' (1924) y 'Canto general' (1950). César Vallejo (Perú) introdujo en 'Trilce' (1922) un lenguaje poético radicalmente nuevo, fragmentado y doloroso. La literatura de testimonio ('Me llamo Rigoberta Menchú', 1983) dio voz a los oprimidos. Isabel Allende ('La casa de los espíritus', 1982) y Elena Poniatowska ('La noche de Tlatelolco', 1971) representan el posboom y la escritura femenina."
