        correctAnswer: "la coexistencia de la realidad y lo maravilloso sin que los personajes se asombren: los muertos conviven con los vivos, los prodigios ocurren con naturalidad → el realismo mágico latinoamericano presenta lo mágico como parte de la cotidianidad"
        rationale: "El texto: 'García Márquez sintetizó el realismo mágico → la realidad y lo maravilloso coexisten sin asombro'."
        difficulty: 5
