        question: "¿Cuáles son las principales características del modernismo de Rubén Darío? (el realismo y la denuncia social/la renovación de la lengua literaria con musicalidad, exotismo, esteticismo, influencia del simbolismo francés y búsqueda de la belleza formal → 'Azul...' (1888) marca el inicio del modernismo hispánico/el uso del lenguaje coloquial)"
        correctAnswer: la renovación de la lengua literaria con musicalidad, exotismo, esteticismo, influencia del simbolismo francés y búsqueda de la belleza formal → 'Azul...' (1888) marca el inicio del modernismo hispánico
        rationale: "El texto: 'el modernismo, con Darío, renovó la lengua literaria hispánica con musicalidad, exotismo, esteticismo y simbolismo francés'."
        difficulty: 5
