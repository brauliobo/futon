        question: "¿Cuáles son los motivos literarios centrales de Borges? (el amor, la muerte y la naturaleza/los laberintos, los espejos, el tiempo circular y la biblioteca infinita → son motivos metafísicos que exploran los límites del conocimiento, la identidad y la realidad en obras como 'Ficciones' (1944) y 'El Aleph' (1949)/el exotismo y la musicalidad)"
        correctAnswer: los laberintos, los espejos, el tiempo circular y la biblioteca infinita → son motivos metafísicos que exploran los límites del conocimiento, la identidad y la realidad en obras como 'Ficciones' (1944) y 'El Aleph' (1949)
        rationale: "El texto: 'Borges creó una literatura fantástica y metafísica única: los laberintos, los espejos, el tiempo circular y la biblioteca infinita son sus motivos centrales'."
