authorNotes: "Texto expositivo sobre literatura latinoamericana del siglo XX: el modernismo de Rubén Darío, las vanguardias (ultraísmo, creacionismo, estridentismo), el boom latinoamericano (García Márquez, Vargas Llosa, Cortázar, Fuentes, Donoso), el realismo mágico, la literatura fantástica de Borges, la poesía de Neruda y Vallejo, el testimonio (Rigoberta Menchú), el posboom y las escritoras (Isabel Allende, Elena Poniatowska)."
