pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La psicología social estudia cómo el contexto social influye en los pensamientos, emociones y comportamientos individuales. El experimento de Milgram (1961-1963) demostró que el 65% de los participantes administraban descargas eléctricas letales a una persona cuando lo ordenaba una figura de autoridad: la obediencia a la autoridad es situacional, no una característica de personalidad de los perpetradores. El experimento de la prisión de Stanford (Zimbardo, 1971) asignó roles de guardia y prisionero a estudiantes normales: los guardias desarrollaron comportamientos autoritarios en días → el poder del rol supera la predisposición individual. Este experimento tiene importantes réplicas fallidas y críticas metodológicas. La disonancia cognitiva (Festinger, 1957) ocurre cuando un individuo tiene creencias o comportamientos inconsistentes: la tensión resultante motiva la racionalización para reducir la incoherencia → 'fumé, pero fue solo por esta vez'. El efecto del observador (bystander effect, Latané y Darley, 1968): la presencia de otros testigos reduce la probabilidad de que un individuo ayude en una emergencia → difusión de la responsabilidad. El error fundamental de atribución (Ross, 1977): tendencia a sobrestimar causas disposicionales (personalidad) y subestimar causas situacionales al explicar el comportamiento ajeno → 'es que es mala persona' en lugar de 'estaba bajo presión'. El pensamiento grupal (groupthink, Janis, 1972): la cohesión grupal inhibe el pensamiento crítico y produce decisiones defectuosas → el caso de la Bahía de Cochinos como ejemplo. La influencia social normativa (conformarse para ser aceptado) e informativa (conformarse porque se cree que otros tienen razón) explican la conformidad documentada por Asch."
    exercises:
      - type: reading
        question: "¿Qué demostró el experimento de Milgram sobre la obediencia? (que los sádicos obedecen más/que el 65% de las personas comunes administran descargas letales cuando una figura de autoridad lo ordena → la obediencia destructiva es situacional, no una característica de personalidad excepcional/que los estudiantes son más obedientes)"
        correctAnswer: que el 65% de las personas comunes administran descargas letales cuando una figura de autoridad lo ordena → la obediencia destructiva es situacional, no una característica de personalidad excepcional
        rationale: "El texto: 'Milgram demostró que el 65% administraban descargas eléctricas letales cuando lo ordenaba una figura de autoridad: la obediencia es situacional'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es el error fundamental de atribución? (el error de olvidar nombres/la tendencia a sobrestimar causas disposicionales (personalidad) y subestimar causas situacionales al explicar el comportamiento ajeno → juzgamos que la persona 'es así' en lugar de considerar las circunstancias que la rodean/el error de obediencia)"
        correctAnswer: la tendencia a sobrestimar causas disposicionales (personalidad) y subestimar causas situacionales al explicar el comportamiento ajeno → juzgamos que la persona 'es así' en lugar de considerar las circunstancias que la rodean
        rationale: "El texto: 'El error fundamental de atribución (Ross, 1977): tendencia a sobrestimar causas disposicionales y subestimar causas situacionales al explicar el comportamiento ajeno'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es la disonancia cognitiva según Festinger? (el conflicto entre dos personas/la tensión psicológica que surge cuando un individuo tiene creencias o comportamientos inconsistentes entre sí → la persona busca racionalizar para reducir la incoherencia/la diferencia de opiniones en un grupo)"
        correctAnswer: la tensión psicológica que surge cuando un individuo tiene creencias o comportamientos inconsistentes entre sí → la persona busca racionalizar para reducir la incoherencia
        rationale: "El texto: 'La disonancia cognitiva (Festinger, 1957) ocurre cuando un individuo tiene creencias o comportamientos inconsistentes: la tensión resultante motiva la racionalización'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es el efecto del observador (bystander effect) y qué mecanismo lo explica? (que los observadores siempre ayudan/el fenómeno por el cual la presencia de otros testigos reduce la probabilidad de intervención individual en una emergencia → la difusión de la responsabilidad: cada observador asume que otro actuará/que la gente actúa más rápido en grupo)"
        correctAnswer: "el fenómeno por el cual la presencia de otros testigos reduce la probabilidad de intervención individual en una emergencia → la difusión de la responsabilidad: cada observador asume que otro actuará"
        rationale: "El texto: 'El efecto del observador (Latané y Darley, 1968): la presencia de otros testigos reduce la probabilidad de que un individuo ayude → difusión de la responsabilidad'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué conclusión se extrae del experimento de la prisión de Stanford? (que los estudiantes son crueles por naturaleza/que el rol social puede transformar el comportamiento rápidamente: personas normales adoptaron comportamientos autoritarios o sumisos según el rol asignado → el poder de la situación supera la predisposición individual/que los guardias siempre son violentos)"
        correctAnswer: "que el rol social puede transformar el comportamiento rápidamente: personas normales adoptaron comportamientos autoritarios o sumisos según el rol asignado → el poder de la situación supera la predisposición individual"
        rationale: "El texto: 'los guardias desarrollaron comportamientos autoritarios en días → el poder del rol supera la predisposición individual'. El texto también señala réplicas fallidas y críticas metodológicas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la diferencia entre influencia social normativa e informativa? (son lo mismo/normativa: se conforma para ser aceptado socialmente (presión del grupo); informativa: se conforma porque se cree que los demás tienen más información o razón → la conformidad de Asch combina ambas/normativa es más racional)"
        correctAnswer: "normativa: se conforma para ser aceptado socialmente (presión del grupo); informativa: se conforma porque se cree que los demás tienen más información o razón → la conformidad de Asch combina ambas"
        rationale: "El texto: 'La influencia social normativa (conformarse para ser aceptado) e informativa (conformarse porque se cree que otros tienen razón) explican la conformidad documentada por Asch'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es el pensamiento grupal (groupthink) y qué ejemplo histórico cita el texto? (la creatividad de los grupos/la inhibición del pensamiento crítico causada por la cohesión grupal → los miembros evitan disentir para no romper la armonía → produce decisiones defectuosas → el caso de la Bahía de Cochinos/la colaboración empresarial)"
        correctAnswer: la inhibición del pensamiento crítico causada por la cohesión grupal → los miembros evitan disentir para no romper la armonía → produce decisiones defectuosas → el caso de la Bahía de Cochinos
        rationale: "El texto: 'El pensamiento grupal (groupthink, Janis, 1972): la cohesión grupal inhibe el pensamiento crítico y produce decisiones defectuosas → el caso de la Bahía de Cochinos como ejemplo'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué crítica metodológica señala el texto sobre el experimento de Zimbardo? (que fue demasiado corto/que tiene importantes réplicas fallidas y críticas metodológicas → Zimbardo intervino activamente como superintendente, lo que contamina los resultados; además, las réplicas no obtuvieron los mismos resultados/que los participantes no eran estudiantes)"
        correctAnswer: que tiene importantes réplicas fallidas y críticas metodológicas → Zimbardo intervino activamente como superintendente, lo que contamina los resultados; además, las réplicas no obtuvieron los mismos resultados
        rationale: "El texto señala 'importantes réplicas fallidas y críticas metodológicas'; esto es crucial porque el experimento de Stanford se usa frecuentemente para generalizar sobre la naturaleza humana."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué la psicología social considera que el comportamiento es situacional más que disposicional? (porque las personas no tienen personalidad/porque los experimentos (Milgram, Zimbardo) demuestran que factores del entorno (rol, autoridad, presión de grupo) predicen el comportamiento mejor que los rasgos de personalidad individual en muchos contextos/porque la personalidad no existe)"
        correctAnswer: porque los experimentos (Milgram, Zimbardo) demuestran que factores del entorno (rol, autoridad, presión de grupo) predicen el comportamiento mejor que los rasgos de personalidad individual en muchos contextos
        rationale: "La psicología social ('situacionismo') se opone al 'disposicionismo' de la psicología de rasgos; la controversia persona-situación es central en la disciplina."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué relación hay entre el efecto del observador y el error de atribución en la vida cotidiana? (no hay relación/el error de atribución hace que juzguemos a los testigos de una emergencia como 'indiferentes' o 'malos', cuando en realidad la difusión de la responsabilidad (efecto del observador) es una fuerza situacional que reduce la acción individual → culpamos la personalidad cuando la causa es situacional/ambos promueven la acción)"
        correctAnswer: el error de atribución hace que juzguemos a los testigos de una emergencia como 'indiferentes' o 'malos', cuando en realidad la difusión de la responsabilidad (efecto del observador) es una fuerza situacional que reduce la acción individual → culpamos la personalidad cuando la causa es situacional
        rationale: "La conexión entre estos dos conceptos es una de las aplicaciones más importantes de la psicología social: entender el situacionismo previene juicios morales incorrectos."
        difficulty: 5
