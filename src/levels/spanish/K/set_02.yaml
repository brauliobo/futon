authorNotes: "Texto expositivo sobre psicología social: el experimento de Milgram (obediencia a la autoridad), el experimento de la prisión de Stanford (Zimbardo), el pensamiento grupal (Janis), la disonancia cognitiva (Festinger), el efecto del observador (Latané y Darley), la teoría de la atribución (Heider, Ross/error fundamental), la influencia social normativa e informativa, el altruismo y el comportamiento prosocial."
example: "conformidad → Asch: presión social → obediencia → Milgram: autoridad (65% máximo voltaje) → difusión de responsabilidad → Zimbardo: efecto Lucifer/roles situacionales → efecto espectador → críticas éticas: consentimiento/daño psicológico → replicabilidad → implicaciones: cómo los contextos modelan la conducta."
