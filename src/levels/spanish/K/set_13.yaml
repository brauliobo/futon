title: Gramática - Filosofía del Lenguaje Avanzada y Metafísica del Significado
level: K
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada sobre filosofía del lenguaje: la teoría causal de la referencia (Kripke, Putnam), los designadores rígidos, los mundos posibles en semántica modal, la teoría de los tipos de Frege, la teoría pictórica del Tractatus (Wittgenstein temprano), la pragmática del no-dicho (Sperber y Wilson: relevancia), la teoría de los actos de habla indirectos (Searle), la referencia genérica y la referencia vacía (Hamlet, Pegaso), y el problema de la identidad personal en relación al lenguaje."
example: "Los designadores rígidos de Kripke: 'Aristóteles' designa al mismo individuo en todos los mundos posibles donde existe → los nombres propios son designadores rígidos; las descripciones definidas no lo son → 'el maestro de Alejandro' podría referirse a alguien distinto en un mundo posible."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Referencia, Nombres Propios y Mundos Posibles
    exercises:
      - type: grammar
        question: "¿Qué es la teoría causal de la referencia de Kripke y en qué difiere de la descripcionista de Frege/Russell? (son idénticas/la teoría causal: los nombres propios refieren mediante una cadena causal de uso que arranca del bautismo original → 'Aristóteles' refiere a la persona bautizada con ese nombre, no a la descripción 'el maestro de Alejandro'; la descripcionista: el significado de un nombre es la descripción que lo fija → Kripke la critica: si Aristóteles no hubiera enseñado a Alejandro, el nombre no querría decir nada/son variantes de la misma teoría)"
        correctAnswer: la teoría causal: los nombres propios refieren mediante una cadena causal de uso que arranca del bautismo original → 'Aristóteles' refiere a la persona bautizada con ese nombre, no a la descripción 'el maestro de Alejandro'; la descripcionista: el significado de un nombre es la descripción que lo fija → Kripke la critica
        rationale: "En 'El nombrar y la necesidad' (1980), Kripke argumenta que los nombres propios son designadores rígidos cuya referencia no se fija por descripciones sino por el historial causal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un designador rígido y cómo se distingue de un designador flácido? (un nombre muy preciso/un designador rígido designa al mismo objeto en todos los mundos posibles donde ese objeto existe → 'Agua' es rígido: designa H₂O en todos los mundos; 'El líquido que bebemos' es flácido: podría ser otro líquido en un mundo posible/los designadores rígidos son siempre nombres propios de personas)"
        correctAnswer: un designador rígido designa al mismo objeto en todos los mundos posibles donde ese objeto existe → 'Agua' es rígido: designa H₂O en todos los mundos; 'El líquido que bebemos' es flácido: podría ser otro líquido en un mundo posible
        rationale: "La distinción rígido/flácido de Kripke tiene consecuencias para la necesidad y la aprioridad: los enunciados de identidad entre designadores rígidos son necesariamente verdaderos si son verdaderos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el externalismo semántico de Putnam y qué implica para el concepto de significado? (que el significado está solo en el cerebro/que el significado de términos de clase natural (agua, oro, tigre) no está completamente en la mente del hablante sino que depende del entorno real → 'El significado no está en la cabeza' (Putnam): dos personas en tierra gemela con H₂O y XYZ tienen estados mentales idénticos pero significados distintos/que el significado varía con la cultura)"
        correctAnswer: que el significado de términos de clase natural (agua, oro, tigre) no está completamente en la mente del hablante sino que depende del entorno real → 'El significado no está en la cabeza' (Putnam): dos personas en tierra gemela con H₂O y XYZ tienen estados mentales idénticos pero significados distintos
        rationale: "El experimento mental de la 'Tierra Gemela' de Putnam ('El significado de significado', 1975) es uno de los más influyentes de la filosofía analítica del siglo XX."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo funcionan los mundos posibles en la semántica modal? (como mundos físicos reales alternativos/como dispositivos semánticos para interpretar los enunciados modales ('necesariamente', 'posiblemente') → 'Posiblemente llueve' es verdadero si hay al menos un mundo posible donde llueve; 'Necesariamente, el triángulo tiene tres lados' es verdadero si en todos los mundos posibles es verdadero/los mundos posibles son solo metáforas literarias)"
        correctAnswer: como dispositivos semánticos para interpretar los enunciados modales ('necesariamente', 'posiblemente') → 'Posiblemente llueve' es verdadero si hay al menos un mundo posible donde llueve; 'Necesariamente, el triángulo tiene tres lados' es verdadero si en todos los mundos posibles es verdadero
        rationale: "Los mundos posibles (Kripke, Lewis) son el marco estándar de la semántica modal; la cuestión de si son abstractos (Kripke) o concretos pero no accesibles (Lewis) es el debate central."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la referencia vacía y cómo se analiza filosóficamente el problema de 'Hamlet'? (la referencia a personas sin nombre/el problema de expresiones que parecen referir pero no tienen referente real → 'Hamlet era melancólico' → ¿a qué o a quién refiere 'Hamlet'? → teorías: Hamlet es un objeto de ficción abstracto (Meinong: los objetos no existentes subsisten); la referencia es al texto, no a una entidad (Frege: el sentido sin referencia)/la referencia a conceptos abstractos)"
        correctAnswer: el problema de expresiones que parecen referir pero no tienen referente real → 'Hamlet era melancólico' → ¿a qué o a quién refiere 'Hamlet'? → teorías: Hamlet es un objeto de ficción abstracto (Meinong: los objetos no existentes subsisten); la referencia es al texto, no a una entidad
        rationale: "La referencia vacía (Russell, Frege, Meinong) es uno de los problemas clásicos de la ontología del lenguaje; 'La montaña de oro no existe' → ¿de qué hablamos cuando negamos la existencia de algo?"
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la referencia genérica y cómo difiere de la referencia específica? (que la referencia genérica es más precisa/la referencia genérica se aplica a la clase o especie en general, no a individuos → 'El tigre está en peligro de extinción' (el tigre como especie); 'Un tigre entró en el pueblo' (un individuo específico) → los enunciados genéricos no son simplemente universales: 'Los tigres tienen rayas' es verdadero aunque un albino no las tenga/que la referencia genérica usa artículo indefinido siempre)"
        correctAnswer: la referencia genérica se aplica a la clase o especie en general, no a individuos → 'El tigre está en peligro de extinción' (el tigre como especie); 'Un tigre entró en el pueblo' (un individuo específico) → los enunciados genéricos no son simplemente universales: 'Los tigres tienen rayas' es verdadero aunque un albino no las tenga
        rationale: "La referencia genérica es un problema filosófico y lingüístico: los genéricos tienen una lógica sui generis, diferente a los enunciados universales y existenciales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué establece la teoría de la relevancia de Sperber y Wilson sobre la comunicación? (que los hablantes siempre son completamente explícitos/que la comunicación humana no transmite todo el significado explícitamente: el hablante produce estímulos y el oyente los interpreta buscando la interpretación más relevante (máximo efecto cognitivo con mínimo esfuerzo de procesamiento) → la relevancia, no la literalidad, guía la interpretación/que las metáforas siempre son explícitas)"
        correctAnswer: que la comunicación humana no transmite todo el significado explícitamente: el hablante produce estímulos y el oyente los interpreta buscando la interpretación más relevante (máximo efecto cognitivo con mínimo esfuerzo de procesamiento) → la relevancia, no la literalidad, guía la interpretación
        rationale: "La teoría de la relevancia de Sperber y Wilson ('Relevance', 1986) reformula la pragmática de Grice: no hay máximas específicas, solo el principio cognitivo de búsqueda de relevancia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los actos de habla indirectos según Searle y por qué los usamos? (actos de habla con subtítulos/actos en que el significado del enunciado no coincide con el del acto realizado → '¿Puedes pasar la sal?' es literalmente una pregunta sobre capacidad pero pragmáticamente una petición → los usamos por cortesía (mitigar las imposiciones) y para gestionar la imagen social de los interlocutores/actos de habla que no se comprenden)"
        correctAnswer: actos en que el significado del enunciado no coincide con el del acto realizado → '¿Puedes pasar la sal?' es literalmente una pregunta sobre capacidad pero pragmáticamente una petición → los usamos por cortesía (mitigar las imposiciones) y para gestionar la imagen social de los interlocutores
        rationale: "Los actos de habla indirectos (Searle, 1975) son ubicuos en la comunicación cotidiana; su interpretación requiere inferencia pragmática basada en el contexto y las máximas conversacionales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la teoría pictórica del significado en el Tractatus de Wittgenstein y cuál es su limitación? (que el lenguaje pinta cuadros físicos/que las proposiciones son figuras (Bilder) de los hechos del mundo → la proposición 'La manzana está sobre la mesa' tiene la misma forma lógica que el hecho que representa → la limitación: no puede explicar enunciados éticos, estéticos, religiosos, ni las preguntas que van más allá de los hechos/que las imágenes son proposiciones)"
        correctAnswer: que las proposiciones son figuras (Bilder) de los hechos del mundo → la proposición 'La manzana está sobre la mesa' tiene la misma forma lógica que el hecho que representa → la limitación: no puede explicar enunciados éticos, estéticos, religiosos, ni las preguntas que van más allá de los hechos
        rationale: "La teoría pictórica del Tractatus dio lugar al positivismo lógico del Círculo de Viena; el propio Wittgenstein la abandonó en las Investigaciones Filosóficas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relaciona el problema de la identidad personal con el lenguaje según la filosofía analítica? (no tienen relación/el lenguaje que usamos para hablar sobre la identidad personal ('yo', 'el mismo', 'continúa siendo') presupone criterios de identidad → el argumento de la continuidad psicológica (Locke: soy el mismo porque recuerdo mis acciones pasadas) vs. la continuidad corporal → el lenguaje ordinario puede ser metafísicamente comprometedor sin que lo notemos/la identidad personal es solo gramatical)"
        correctAnswer: el lenguaje que usamos para hablar sobre la identidad personal ('yo', 'el mismo', 'continúa siendo') presupone criterios de identidad → el argumento de la continuidad psicológica (Locke: soy el mismo porque recuerdo mis acciones pasadas) vs. la continuidad corporal → el lenguaje ordinario puede ser metafísicamente comprometedor sin que lo notemos
        rationale: "La filosofía analítica del lenguaje ordinario (Strawson, Austin) muestra que las preguntas metafísicas sobre la identidad están implícitas en el uso cotidiano del lenguaje."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Semántica Modal y Pragmática Avanzada
    exercises:
      - type: grammar
        question: "¿Cómo resuelve Kripke la paradoja de que 'Hesperus es Phosphorus' sea verdadero pero informativo, si ambos son el mismo astro (Venus)? (que los nombres no refieren/con los designadores rígidos: 'Hesperus' y 'Phosphorus' son rígidos (refieren a Venus en todos los mundos) → su identidad es necesaria (si es verdadera, lo es en todos los mundos), pero epistémicamente contingente: descubrirlo fue un hallazgo empírico → hay verdades necesarias pero a posteriori/que la identidad es imposible entre nombres propios)"
        correctAnswer: con los designadores rígidos: 'Hesperus' y 'Phosphorus' son rígidos (refieren a Venus en todos los mundos) → su identidad es necesaria (si es verdadera, lo es en todos los mundos), pero epistémicamente contingente: descubrirlo fue un hallazgo empírico → hay verdades necesarias pero a posteriori
        rationale: "Kripke colapsa la distinción Kant/Frege entre necesario/contingente y a priori/a posteriori; las identidades entre designadores rígidos son necesarias y a posteriori."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la presuposición semántica y cómo difiere de la implicatura convencional? (son sinónimas/la presuposición: condición que debe ser verdadera para que el enunciado tenga valor de verdad → 'El rey de Francia es calvo' presupone que hay un rey de Francia; si no lo hay, el enunciado no es ni verdadero ni falso; la implicatura convencional: significado adicional ligado a ciertos elementos léxicos → 'Aunque ganó, no fue fácil' implica que ganar y dificultad son contrastivos/la presuposición es implicatura no cancelable)"
        correctAnswer: la presuposición: condición que debe ser verdadera para que el enunciado tenga valor de verdad → 'El rey de Francia es calvo' presupone que hay un rey de Francia; si no lo hay, el enunciado no es ni verdadero ni falso; la implicatura convencional: significado adicional ligado a ciertos elementos léxicos → 'Aunque ganó, no fue fácil'
        rationale: "La distinción presuposición/implicatura convencional (Grice, Karttunen) es fundamental en semántica formal; la presuposición crea 'valor de verdad indefinido', no falsedad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la composicionalidad del significado y por qué es un principio central de la semántica formal? (que el significado se aprende palabra a palabra/el principio de Frege de que el significado de una expresión compleja es función del significado de sus partes y de la forma en que se combinan → nos permite entender oraciones que nunca antes hemos oído/que el significado solo depende del contexto)"
        correctAnswer: el principio de Frege de que el significado de una expresión compleja es función del significado de sus partes y de la forma en que se combinan → nos permite entender oraciones que nunca antes hemos oído
        rationale: "La composicionalidad (Principio de Frege) es la razón por la que podemos entender infinitas oraciones nuevas: la semántica formal (Montague) implementa este principio formalmente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la paradoja de la falsedad (Liar Paradox) y cómo afecta a la semántica? (un problema gramatical/la paradoja del enunciado autorreferencial 'Esta oración es falsa' → si es verdadera, es falsa; si es falsa, es verdadera → muestra que el lenguaje natural es inconsistente si permite la autorreferencia y los predicados semánticos → Tarski propuso la jerarquía de metalenguas para evitar la paradoja/un problema de traducción)"
        correctAnswer: la paradoja del enunciado autorreferencial 'Esta oración es falsa' → si es verdadera, es falsa; si es falsa, es verdadera → muestra que el lenguaje natural es inconsistente si permite la autorreferencia y los predicados semánticos → Tarski propuso la jerarquía de metalenguas para evitar la paradoja
        rationale: "La paradoja del mentiroso (Epiménides) tiene consecuencias profundas: Tarski demostró que ningún lenguaje puede contener su propio predicado de verdad sin caer en inconsistencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la implicatura escalar y cuál es un ejemplo en el discurso cotidiano? (un tipo de metáfora/una inferencia pragmática derivada de la posición de un término en una escala de fuerza → 'Aprobé algunos exámenes' implica (aunque no dice) que no aprobé todos: el uso de 'algunos' escalar implica 'no todos' por la máxima de cantidad de Grice → 'Es un buen estudiante' puede implicar 'pero no excelente'/la implicatura escalar es solo matemática)"
        correctAnswer: una inferencia pragmática derivada de la posición de un término en una escala de fuerza → 'Aprobé algunos exámenes' implica (aunque no dice) que no aprobé todos: el uso de 'algunos' escalar implica 'no todos' por la máxima de cantidad de Grice → 'Es un buen estudiante' puede implicar 'pero no excelente'
        rationale: "Las implicaturas escalares (Horn, Levinson) son un fenómeno de la semántica-pragmática interfaz; son cancelables ('Aprobé algunos, de hecho todos') y difieren de las presuposiciones."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo funciona la semántica de los condicionales contrafácticos en filosofía? (igual que los condicionales indicativos/los condicionales contrafácticos ('Si Napoleón hubiera ganado en Waterloo, Europa sería diferente') no pueden evaluarse en el mundo real (la condición es falsa) → se evalúan en los mundos posibles más cercanos al real donde el antecedente es verdadero → la semántica de Stalnaker-Lewis usa la 'similitud' entre mundos/los contrafácticos son siempre falsos)"
        correctAnswer: los condicionales contrafácticos ('Si Napoleón hubiera ganado en Waterloo, Europa sería diferente') no pueden evaluarse en el mundo real (la condición es falsa) → se evalúan en los mundos posibles más cercanos al real donde el antecedente es verdadero → la semántica de Stalnaker-Lewis usa la 'similitud' entre mundos
        rationale: "Los contrafácticos son centrales en la causalidad, la inferencia práctica y la filosofía de la historia; la semántica de mundos posibles proporciona su tratamiento formal estándar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la indeterminación de la traducción radical de Quine y qué implica para el significado? (que la traducción siempre es perfecta/la tesis de que para cualquier sistema de traducción entre lenguas, existe otro sistema incompatible pero igualmente compatible con todo el comportamiento observado → no hay un hecho objetivo sobre qué significa una expresión → el significado como entidad independiente es un 'dogma' que Quine cuestiona/que la traducción es determinada por el diccionario)"
        correctAnswer: la tesis de que para cualquier sistema de traducción entre lenguas, existe otro sistema incompatible pero igualmente compatible con todo el comportamiento observado → no hay un hecho objetivo sobre qué significa una expresión → el significado como entidad independiente es un 'dogma' que Quine cuestiona
        rationale: "La indeterminación de la traducción ('Palabra y objeto', 1960) es uno de los argumentos más radicales de la filosofía del lenguaje; cuestionó la noción misma de significado como objeto teórico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan la teoría causal de Kripke y el externalismo de Putnam con el debate mentalismo/conductismo en lingüística? (no tienen relación/ambos refuerzan el externalismo: el significado no está solo en la mente (contra el mentalismo) ni solo en la conducta (contra el conductismo) sino que depende de cadenas causales en el mundo → complementan la crítica de Chomsky al conductismo pero desde la semántica, no desde la sintaxis/ambos son mentalistas)"
        correctAnswer: ambos refuerzan el externalismo: el significado no está solo en la mente (contra el mentalismo) ni solo en la conducta (contra el conductismo) sino que depende de cadenas causales en el mundo → complementan la crítica de Chomsky al conductismo pero desde la semántica, no desde la sintaxis
        rationale: "La triangulación Kripke-Putnam-Chomsky muestra que el debate sobre el significado cruza la filosofía del lenguaje y la lingüística teórica; el externalismo semántico es compatible con el innatismo gramatical."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la semántica de situaciones (situation semantics) de Barwise y Perry y cómo amplía la semántica estándar? (un tipo de semántica histórica/una semántica que incorpora las situaciones concretas de habla como parte del contenido semántico → el enunciado 'Llueve' no tiene condiciones de verdad absolutas sino situadas: es verdadero en una situación geográfico-temporal concreta → permite tratar la indexicalidad y el contexto de forma sistemática/la semántica de las situaciones de emergencia)"
        correctAnswer: una semántica que incorpora las situaciones concretas de habla como parte del contenido semántico → el enunciado 'Llueve' no tiene condiciones de verdad absolutas sino situadas: es verdadero en una situación geográfico-temporal concreta → permite tratar la indexicalidad y el contexto de forma sistemática
        rationale: "La semántica de situaciones (Barwise y Perry, 1983) fue una respuesta a las limitaciones de la semántica de mundos posibles para tratar expresiones indexicales y dependientes del contexto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué consecuencias tiene la composicionalidad para la adquisición del lenguaje? (ninguna/que los niños no necesitan aprender de memoria cada oración posible: aprenden las palabras y las reglas de combinación y desde ahí pueden construir y entender oraciones nuevas → la composicionalidad explica la creatividad (Chomsky: productividad y sistematicidad) del lenguaje humano/que la composicionalidad facilita la memorización)"
        correctAnswer: que los niños no necesitan aprender de memoria cada oración posible: aprenden las palabras y las reglas de combinación y desde ahí pueden construir y entender oraciones nuevas → la composicionalidad explica la creatividad (Chomsky: productividad y sistematicidad) del lenguaje humano
        rationale: "La composicionalidad y la productividad son dos caras de la misma moneda; Chomsky las usó como argumento contra el conductismo: el lenguaje no puede aprenderse por simple imitación."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
