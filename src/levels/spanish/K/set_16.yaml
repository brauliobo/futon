authorNotes: "Texto expositivo sobre física cuántica: el experimento de la doble rendija, la superposición cuántica, el principio de incertidumbre de Heisenberg, el colapso de la función de onda, las interpretaciones de la mecánica cuántica (Copenhague: Bohr/Heisenberg; muchos mundos: Everett; variables ocultas: de Broglie/Bohm; relacional: Rovelli), el entrelazamiento cuántico (EPR, Bell), la computación cuántica y las implicaciones filosóficas para el determinismo y la realidad."
example: "mecánica cuántica: función de onda (Schrödinger) → medición → colapso → probabilidades → interpretación Copenhague (Bohr): realidad indeterminada hasta medición → muchos mundos (Everett): todos los resultados ocurren → variables ocultas (Bohm) → paradoja EPR/entrelazamiento (Einstein: 'acción fantasmal') → implicaciones: no hay realidad objetiva sin observación."
