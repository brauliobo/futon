pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La mecánica cuántica es la teoría física más precisa y verificada de la historia, pero su interpretación filosófica sigue siendo profundamente debatida. El experimento de la doble rendija muestra el comportamiento ondulatorio de los electrones: cuando no se observa cuál rendija atraviesa el electrón, se produce un patrón de interferencia; cuando se mide, el patrón desaparece → la observación altera el sistema. La superposición cuántica: antes de la medición, un sistema cuántico existe en todos sus estados posibles simultáneamente → el gato de Schrödinger ilustra la paradoja a escala macroscópica: el gato está 'vivo y muerto a la vez' antes de abrir la caja. El principio de incertidumbre de Heisenberg: no se puede conocer simultáneamente con precisión arbitraria la posición y el momento de una partícula → hay una limitación fundamental en el conocimiento, no una limitación tecnológica. La interpretación de Copenhague (Bohr, Heisenberg): la función de onda colapsa al medir → la realidad cuántica no existe de forma definida antes de la medición; la física solo describe las probabilidades de observación. La interpretación de los muchos mundos (Everett, 1957): en lugar de colapsar, la función de onda se ramifica → cada posibilidad se realiza en un universo diferente → no hay colapso, hay proliferación de mundos. El entrelazamiento cuántico (EPR, Einstein, Podolsky, Rosen): dos partículas entrelazadas mantienen correlaciones instantáneas independientemente de la distancia → Einstein lo llamó 'acción fantasmal a distancia'; el teorema de Bell (1964) demostró que estas correlaciones no pueden explicarse con variables ocultas locales. La computación cuántica usa la superposición y el entrelazamiento para procesar información exponencialmente más rápido que los computadores clásicos en ciertos problemas."
    exercises:
      - type: reading
        question: "¿Qué demuestra el experimento de la doble rendija sobre la naturaleza de los electrones? (que los electrones son partículas sólidas/que los electrones se comportan como ondas cuando no son observados (producen interferencia) y como partículas cuando son medidos → la observación altera fundamentalmente el sistema cuántico/que los electrones siempre siguen trayectorias definidas)"
        correctAnswer: que los electrones se comportan como ondas cuando no son observados (producen interferencia) y como partículas cuando son medidos → la observación altera fundamentalmente el sistema cuántico
        rationale: "El texto: 'cuando no se observa cuál rendija atraviesa el electrón, se produce un patrón de interferencia; cuando se mide, el patrón desaparece → la observación altera el sistema'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué ilustra el gato de Schrödinger y cuál es la paradoja que señala? (que los gatos cuánticos son distintos de los normales/la paradoja de extender la superposición cuántica a escala macroscópica: si aplicamos la mecánica cuántica al gato en la caja, debe estar 'vivo y muerto a la vez' antes de la observación → la paradoja señala la tensión entre la mecánica cuántica y nuestra experiencia de objetos macroscópicos con estados definidos/que los gatos tienen propiedades cuánticas específicas)"
        correctAnswer: la paradoja de extender la superposición cuántica a escala macroscópica: si aplicamos la mecánica cuántica al gato en la caja, debe estar 'vivo y muerto a la vez' antes de la observación → la paradoja señala la tensión entre la mecánica cuántica y nuestra experiencia de objetos macroscópicos con estados definidos
        rationale: "El texto: 'el gato de Schrödinger ilustra la paradoja a escala macroscópica: el gato está vivo y muerto a la vez antes de abrir la caja'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué establece el principio de incertidumbre de Heisenberg y por qué es filosóficamente importante? (que los instrumentos de medición son imperfectos/que no se puede conocer simultáneamente con precisión arbitraria la posición y el momento de una partícula → es una limitación fundamental de la naturaleza, no tecnológica → cuestiona el determinismo clásico: no se pueden predecir exactamente las trayectorias futuras/que las mediciones siempre tienen errores)"
        correctAnswer: que no se puede conocer simultáneamente con precisión arbitraria la posición y el momento de una partícula → es una limitación fundamental de la naturaleza, no tecnológica → cuestiona el determinismo clásico: no se pueden predecir exactamente las trayectorias futuras
        rationale: "El texto: 'El principio de incertidumbre de Heisenberg: no se puede conocer simultáneamente con precisión arbitraria la posición y el momento de una partícula → hay una limitación fundamental en el conocimiento, no una limitación tecnológica'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la diferencia entre la interpretación de Copenhague y la de los muchos mundos? (que una es más antigua/Copenhague: la función de onda colapsa al medir → solo existe una realidad, la observada; muchos mundos (Everett): no hay colapso, la función de onda se ramifica → cada posibilidad se realiza en un universo diferente → el número de mundos crece con cada evento cuántico/que la de Copenhague acepta la superposición)"
        correctAnswer: Copenhague: la función de onda colapsa al medir → solo existe una realidad, la observada; muchos mundos (Everett): no hay colapso, la función de onda se ramifica → cada posibilidad se realiza en un universo diferente → el número de mundos crece con cada evento cuántico
        rationale: "El texto: 'La interpretación de Copenhague: la función de onda colapsa al medir; la interpretación de los muchos mundos: en lugar de colapsar, la función de onda se ramifica → cada posibilidad se realiza en un universo diferente'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es el entrelazamiento cuántico y por qué lo llamó Einstein 'acción fantasmal a distancia'? (el enlace de dos electrones en el mismo átomo/el fenómeno por el cual dos partículas entrelazadas mantienen correlaciones instantáneas independientemente de la distancia → Einstein lo rechazó porque parecía implicar comunicación instantánea, violando la relatividad especial/que los cuantos se mueven más rápido que la luz)"
        correctAnswer: el fenómeno por el cual dos partículas entrelazadas mantienen correlaciones instantáneas independientemente de la distancia → Einstein lo rechazó porque parecía implicar comunicación instantánea, violando la relatividad especial
        rationale: "El texto: 'El entrelazamiento cuántico: dos partículas entrelazadas mantienen correlaciones instantáneas independientemente de la distancia → Einstein lo llamó acción fantasmal a distancia'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué demostró el teorema de Bell (1964) sobre las variables ocultas? (que las variables ocultas existen/que las correlaciones cuánticas del entrelazamiento no pueden explicarse con variables ocultas locales (información oculta que predeterminaría los resultados) → los experimentos posteriores (Aspect, 1982) confirmaron que la naturaleza viola las desigualdades de Bell, refutando las variables ocultas locales/que el entrelazamiento es una ilusión)"
        correctAnswer: que las correlaciones cuánticas del entrelazamiento no pueden explicarse con variables ocultas locales (información oculta que predeterminaría los resultados) → los experimentos posteriores (Aspect, 1982) confirmaron que la naturaleza viola las desigualdades de Bell, refutando las variables ocultas locales
        rationale: "El texto: 'el teorema de Bell (1964) demostró que estas correlaciones no pueden explicarse con variables ocultas locales'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué la computación cuántica puede ser exponencialmente más rápida que la computación clásica para ciertos problemas? (porque los procesadores cuánticos son más grandes/porque usa la superposición (un qubit puede ser 0 y 1 simultáneamente) y el entrelazamiento para explorar múltiples soluciones en paralelo → para ciertos problemas (factorización de números grandes, búsqueda en bases de datos) el speedup es exponencial respecto a los mejores algoritmos clásicos/porque funciona a temperaturas más altas)"
        correctAnswer: porque usa la superposición (un qubit puede ser 0 y 1 simultáneamente) y el entrelazamiento para explorar múltiples soluciones en paralelo → para ciertos problemas (factorización de números grandes, búsqueda en bases de datos) el speedup es exponencial respecto a los mejores algoritmos clásicos
        rationale: "El texto: 'La computación cuántica usa la superposición y el entrelazamiento para procesar información exponencialmente más rápido que los computadores clásicos en ciertos problemas'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué la interpretación de Copenhague implica que la luna no existe cuando nadie la mira? (porque los físicos de Copenhague eran subjetivistas/porque si la realidad cuántica no tiene valores definidos antes de la medición, y aplicamos esto consistentemente, los objetos macroscópicos solo tendrían estados definidos cuando son observados → Einstein criticó esta implicación: preguntó si realmente creemos que la luna no existe cuando no miramos/porque la luna está hecha de quarks)"
        correctAnswer: porque si la realidad cuántica no tiene valores definidos antes de la medición, y aplicamos esto consistentemente, los objetos macroscópicos solo tendrían estados definidos cuando son observados → Einstein criticó esta implicación: preguntó si realmente creemos que la luna no existe cuando no miramos
        rationale: "La famosa pregunta de Einstein a Pais ('¿Realmente crees que la luna no existe cuando no la miras?') captura la tensión filosófica central de la interpretación de Copenhague."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuáles son las implicaciones del principio de incertidumbre para el determinismo filosófico? (que el determinismo es correcto/que el determinismo laplaciano (dado el estado completo del universo, todo el futuro es predecible) es falso a nivel cuántico → la incertidumbre es intrínseca, no un defecto del conocimiento → el universo cuántico es fundamentalmente indeterminista/que el determinismo se fortalece con la mecánica cuántica)"
        correctAnswer: que el determinismo laplaciano (dado el estado completo del universo, todo el futuro es predecible) es falso a nivel cuántico → la incertidumbre es intrínseca, no un defecto del conocimiento → el universo cuántico es fundamentalmente indeterminista
        rationale: "La mecánica cuántica refutó el determinismo clásico de Laplace; la única interpretación determinista sobreviviente son las variables ocultas de Bohm, que son no-locales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué el debate sobre las interpretaciones de la mecánica cuántica sigue sin resolverse después de un siglo? (porque los físicos no saben hacer los cálculos/porque las distintas interpretaciones producen las mismas predicciones experimentales → no hay experimento posible que distinga entre Copenhague, muchos mundos y variables ocultas → la elección entre ellas es filosófica, no empírica, dependiendo de los compromisos ontológicos del físico/porque la tecnología de medición es insuficiente)"
        correctAnswer: porque las distintas interpretaciones producen las mismas predicciones experimentales → no hay experimento posible que distinga entre Copenhague, muchos mundos y variables ocultas → la elección entre ellas es filosófica, no empírica, dependiendo de los compromisos ontológicos del físico
        rationale: "La equivalencia empírica de las interpretaciones cuánticas es el motivo por el que el debate es filosófico, no científico en sentido estricto; la falsabilidad de Popper no puede aplicarse aquí."
        difficulty: 5
        objectives: [es.pre_reading]
