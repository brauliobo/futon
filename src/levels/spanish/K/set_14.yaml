pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La historia del pensamiento económico traza la evolución de las teorías que explican la producción, distribución y consumo de la riqueza. El mercantilismo (siglos XVI-XVII) sostenía que la riqueza nacional consistía en la acumulación de metales preciosos → favorecer las exportaciones y limitar las importaciones. Los fisiócratas (Quesnay, siglo XVIII) afirmaron que solo la agricultura crea riqueza real: el Tableau économique de Quesnay modelizó los flujos de la economía por primera vez. Adam Smith ('La Riqueza de las Naciones', 1776) fundó la economía moderna: la división del trabajo aumenta la productividad → el mercado libre, guiado por la 'mano invisible', asigna los recursos eficientemente → el individualismo egoísta produce el bien colectivo. David Ricardo demostró que el comercio libre beneficia a todos los países mediante la ventaja comparativa: incluso el país menos eficiente en todo puede beneficiarse especializándose en lo que produce relativamente mejor. Thomas Malthus advirtió que la población crece geométricamente mientras los alimentos crecen aritméticamente → el equilibrio se alcanza por hambre, guerra o epidemia. Karl Marx analizó el capitalismo: la plusvalía (el trabajo no pagado que el capitalista extrae del obrero), los ciclos de acumulación, la contradicción entre fuerzas productivas y relaciones de producción → predicó la revolución como inevitable. La revolución marginalista (Jevons, Menger, Walras, 1870s): el valor no depende del trabajo incorporado sino de la utilidad marginal → sustituyó el valor-trabajo ricardiano. Alfred Marshall sistematizó el análisis de oferta y demanda. John Maynard Keynes ('Teoría general', 1936) argumentó que la demanda agregada determina el empleo → en las recesiones, el Estado debe intervenir con gasto público; el multiplicador keynesiano amplifica el efecto del gasto público. Milton Friedman y la Escuela de Chicago: el monetarismo → la inflación es siempre un fenómeno monetario; los mercados son eficientes si no se interfiere."
    exercises:
      - type: reading
        question: "¿Cuál es el argumento central de Adam Smith sobre la 'mano invisible' del mercado? (que los monopolios son beneficiosos/que los gobiernos deben controlar los precios/que el mercado libre, guiado por el interés propio de cada individuo, produce el bien colectivo sin coordinación deliberada → cada uno buscando su propio beneficio maximiza inadvertidamente el bienestar social)"
        correctAnswer: que el mercado libre, guiado por el interés propio de cada individuo, produce el bien colectivo sin coordinación deliberada → cada uno buscando su propio beneficio maximiza inadvertidamente el bienestar social
        rationale: "El texto: 'el mercado libre, guiado por la mano invisible, asigna los recursos eficientemente → el individualismo egoísta produce el bien colectivo'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es la ventaja comparativa de David Ricardo y por qué justifica el libre comercio? (la ventaja de los países exportadores de materias primas/la capacidad de producir más barato en términos absolutos/que incluso el país menos eficiente en todo puede beneficiarse del comercio especializándose en lo que produce relativamente mejor → el libre comercio aumenta la producción total aunque un país sea más eficiente en todo)"
        correctAnswer: que incluso el país menos eficiente en todo puede beneficiarse del comercio especializándose en lo que produce relativamente mejor → el libre comercio aumenta la producción total aunque un país sea más eficiente en todo
        rationale: "El texto: 'Ricardo demostró que el comercio libre beneficia a todos mediante la ventaja comparativa: incluso el país menos eficiente en todo puede beneficiarse especializándose en lo que produce relativamente mejor'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la teoría de la plusvalía de Marx y qué consecuencias predice para el capitalismo? (que los capitalistas trabajan más/que el trabajador produce más valor del que recibe como salario → la diferencia (plusvalía) es apropiada por el capitalista → la contradicción entre fuerzas productivas y relaciones de producción lleva inevitablemente a la crisis y la revolución/que el capitalismo es eterno y estable)"
        correctAnswer: que el trabajador produce más valor del que recibe como salario → la diferencia (plusvalía) es apropiada por el capitalista → la contradicción entre fuerzas productivas y relaciones de producción lleva inevitablemente a la crisis y la revolución
        rationale: "El texto: 'Marx: la plusvalía (el trabajo no pagado que el capitalista extrae del obrero) → predicó la revolución como inevitable'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué supuso la revolución marginalista de los años 1870 en la teoría del valor económico? (la vuelta al mercantilismo/la sustitución del valor-trabajo (el valor depende del trabajo incorporado, Ricardo-Marx) por la teoría de la utilidad marginal (el valor depende de cuánto valora el consumidor la última unidad adicional) → el valor es subjetivo y relativo, no objetivo/que los precios los fija el Estado)"
        correctAnswer: la sustitución del valor-trabajo (el valor depende del trabajo incorporado, Ricardo-Marx) por la teoría de la utilidad marginal (el valor depende de cuánto valora el consumidor la última unidad adicional) → el valor es subjetivo y relativo, no objetivo
        rationale: "El texto: 'La revolución marginalista: el valor no depende del trabajo incorporado sino de la utilidad marginal → sustituyó el valor-trabajo ricardiano'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la aportación principal de Keynes y cuándo es relevante su teoría? (que los mercados siempre se autorregulan/que la demanda agregada determina el empleo y que en las recesiones, cuando la inversión privada cae, el Estado debe compensar con gasto público → el multiplicador keynesiano amplifica el efecto de este gasto/que la política monetaria es el único instrumento válido)"
        correctAnswer: que la demanda agregada determina el empleo y que en las recesiones, cuando la inversión privada cae, el Estado debe compensar con gasto público → el multiplicador keynesiano amplifica el efecto de este gasto
        rationale: "El texto: 'Keynes argumentó que la demanda agregada determina el empleo → en las recesiones, el Estado debe intervenir con gasto público; el multiplicador keynesiano amplifica el efecto del gasto público'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la crítica de Friedman y la Escuela de Chicago al keynesianismo? (que Keynes no entendía la macroeconomía/que la política fiscal es ineficiente porque el sector privado anticipa el aumento del gasto público y reduce su propio gasto (efecto expulsión) → la inflación es siempre un fenómeno monetario y el banco central debe controlar la oferta monetaria en lugar de usar el gasto público/que el Estado siempre es más eficiente que el mercado)"
        correctAnswer: que la política fiscal es ineficiente porque el sector privado anticipa el aumento del gasto público y reduce su propio gasto (efecto expulsión) → la inflación es siempre un fenómeno monetario y el banco central debe controlar la oferta monetaria en lugar de usar el gasto público
        rationale: "El texto: 'Friedman y la Escuela de Chicago: el monetarismo → la inflación es siempre un fenómeno monetario; los mercados son eficientes si no se interfiere'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la advertencia de Malthus sobre la relación entre población y recursos? (que la tecnología siempre resuelve los problemas de escasez/que la población crece geométricamente mientras los alimentos crecen aritméticamente → sin frenos preventivos (abstinencia, matrimonio tardío) o positivos (hambre, guerra, epidemia), el equilibrio se alcanza por catástrofe/que la superpoblación es siempre positiva para la economía)"
        correctAnswer: que la población crece geométricamente mientras los alimentos crecen aritméticamente → sin frenos preventivos (abstinencia, matrimonio tardío) o positivos (hambre, guerra, epidemia), el equilibrio se alcanza por catástrofe
        rationale: "El texto: 'Malthus advirtió que la población crece geométricamente mientras los alimentos crecen aritméticamente → el equilibrio se alcanza por hambre, guerra o epidemia'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué aportaron los fisiócratas y qué los distingue de los mercantilistas? (ambos coincidían en que el comercio crea riqueza/los fisiócratas: solo la agricultura crea riqueza real → la industria y el comercio son 'estériles'; los mercantilistas: la riqueza está en los metales preciosos y el superávit comercial → Quesnay modelizó los flujos económicos en el Tableau économique antes de Smith/no hay diferencia entre ellos)"
        correctAnswer: "los fisiócratas: solo la agricultura crea riqueza real → la industria y el comercio son 'estériles'; los mercantilistas: la riqueza está en los metales preciosos y el superávit comercial → Quesnay modelizó los flujos económicos en el Tableau économique antes de Smith"
        rationale: "El texto: 'Los fisiócratas afirmaron que solo la agricultura crea riqueza real: el Tableau économique de Quesnay modelizó los flujos de la economía por primera vez'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la diferencia entre la ventaja absoluta de Smith y la ventaja comparativa de Ricardo en el comercio internacional? (son idénticas/Smith: un país tiene ventaja absoluta si produce algo más eficientemente (con menos recursos) que otro; Ricardo: la especialización debe seguir la ventaja comparativa, no la absoluta → incluso si un país es menos eficiente en todo, debe especializarse en lo que es relativamente más eficiente/la ventaja comparativa es solo sobre los países pequeños)"
        correctAnswer: "Smith: un país tiene ventaja absoluta si produce algo más eficientemente (con menos recursos) que otro; Ricardo: la especialización debe seguir la ventaja comparativa, no la absoluta → incluso si un país es menos eficiente en todo, debe especializarse en lo que es relativamente más eficiente"
        rationale: "La ventaja comparativa de Ricardo generalizó la defensa del libre comercio: incluso sin ventaja absoluta en nada, el comercio es mutuamente beneficioso — es una de las ideas más contraintuitivas de la economía."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo analiza Piketty la desigualdad en el capitalismo contemporáneo y qué mide con su fórmula r > g? (que la desigualdad siempre disminuye con el tiempo/que cuando la tasa de rendimiento del capital (r) supera la tasa de crecimiento de la economía (g), la concentración de la riqueza aumenta automáticamente → el capitalismo tiende a la desigualdad creciente a largo plazo salvo perturbaciones externas (guerras, políticas redistributivas)/que el capitalismo es igualitario por naturaleza)"
        correctAnswer: que cuando la tasa de rendimiento del capital (r) supera la tasa de crecimiento de la economía (g), la concentración de la riqueza aumenta automáticamente → el capitalismo tiende a la desigualdad creciente a largo plazo salvo perturbaciones externas (guerras, políticas redistributivas)
        rationale: "El texto menciona 'los debates contemporáneos (Piketty)' — la fórmula r > g de 'El capital en el siglo XXI' (2013) generó el debate más amplio sobre desigualdad en décadas."
        difficulty: 5
        objectives: [es.pre_reading]
