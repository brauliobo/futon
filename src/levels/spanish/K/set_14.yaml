authorNotes: "Texto expositivo sobre historia del pensamiento económico: los mercantilistas, la fisiocracia (Quesnay), Adam Smith (La Riqueza de las Naciones, la mano invisible, el valor-trabajo), David Ricardo (ventaja comparativa), Malthus (población), Marx (plusvalía, ciclos), el marginalismo (Jevons, Menger, Walras), Marshall (oferta y demanda), Keynes (demanda agregada, multiplicador, expectativas), la Escuela de Chicago (Friedman, monetarismo), la economía neoclásica y los debates contemporáneos (Piketty, macroeconomía post-keynesiana)."
example: "clásicos (Smith/Ricardo) → marxismo: explotación/plusvalía → marginalismo (Jevons/Marshall): utilidad marginal → Keynes (1936): demanda efectiva/multiplicador → síntesis neoclásica → monetarismo Friedman: regla monetaria → supply-side Reagan/Thatcher → crisis 2008 → neokeynesianos: estímulo fiscal/QE → debate actualidad: MMT/secular stagnation."
