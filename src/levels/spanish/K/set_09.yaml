title: 🔬 Gramática - Análisis del Discurso Crítico y Poder
level: K
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada sobre análisis del discurso crítico (ADC): los fundamentos teóricos (Foucault, Althusser), el modelo tridimensional de Fairclough (texto, práctica discursiva, práctica social), el análisis crítico del discurso de van Dijk (representación de grupos, ideología en el discurso), la lexicalización ideológica, las nominalizaciones y la voz pasiva como estrategias de ocultamiento, el discurso del poder en los medios, la interdiscursividad y la intertextualidad crítica."
example: "La nominalización borra la agencia: 'Se produjo un aumento del desempleo' vs. 'El gobierno aumentó el desempleo' → la nominalización ('el aumento') convierte el proceso en objeto y oculta al responsable."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Fundamentos del Análisis Crítico del Discurso
    exercises:
      - type: grammar
        question: "¿Qué es el análisis del discurso crítico (ADC) y cuál es su objetivo político? (el análisis gramatical del texto/el análisis que examina cómo el lenguaje produce, reproduce y legitima las relaciones de poder y la desigualdad social → el ADC no es neutro: toma partido por los grupos marginalizados y trabaja para revelar las ideologías ocultas en el discurso/el análisis de la gramática para fines políticos)"
        correctAnswer: "el análisis que examina cómo el lenguaje produce, reproduce y legitima las relaciones de poder y la desigualdad social → el ADC no es neutro: toma partido por los grupos marginalizados y trabaja para revelar las ideologías ocultas en el discurso"
        rationale: "El ADC (van Dijk, Fairclough, Wodak) tiene un compromiso explícito con el cambio social; a diferencia del análisis del discurso descriptivo, el crítico evalúa y denuncia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el modelo tridimensional de Fairclough para el análisis crítico? (tres tipos de oraciones/el modelo que analiza el discurso en tres planos simultáneos: (1) el texto (análisis lingüístico), (2) la práctica discursiva (producción, distribución y consumo del texto) y (3) la práctica social (el contexto institucional e ideológico) → los tres planos deben analizarse juntos/tres tipos de argumentos)"
        correctAnswer: "el modelo que analiza el discurso en tres planos simultáneos: (1) el texto (análisis lingüístico), (2) la práctica discursiva (producción, distribución y consumo del texto) y (3) la práctica social (el contexto institucional e ideológico) → los tres planos deben analizarse juntos"
        rationale: "El modelo tridimensional de Fairclough ('Language and Power', 1989) integra el análisis lingüístico con la teoría social; es la herramienta más influyente del ADC."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo funciona la nominalización como estrategia de ocultamiento del poder? (nominalizar es crear sustantivos nuevos/la nominalización convierte procesos verbales en sustantivos → 'El gobierno decidió el recorte' → 'Se produjo una decisión de recorte' → el proceso se cosifica, el agente desaparece y la acción parece inevitable o natural, no el resultado de una decisión humana/la nominalización siempre es explícita)"
        correctAnswer: la nominalización convierte procesos verbales en sustantivos → 'El gobierno decidió el recorte' → 'Se produjo una decisión de recorte' → el proceso se cosifica, el agente desaparece y la acción parece inevitable o natural, no el resultado de una decisión humana
        rationale: "La nominalización produce el ocultamiento del agente al convertir verbos en sustantivos; es herramienta central del ADC del discurso político y burocrático."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo puede la voz pasiva funcionar como estrategia de ideología en el discurso político? (la pasiva nunca es ideológica/la pasiva sin agente borra la responsabilidad: 'Los manifestantes fueron detenidos' (sin decir quién los detuvo) vs. 'La policía detuvo a los manifestantes' → la omisión del agente puede proteger a los responsables o naturalizar la acción como si no tuviera autor/la pasiva es siempre más formal)"
        correctAnswer: "la pasiva sin agente borra la responsabilidad: 'Los manifestantes fueron detenidos' (sin decir quién los detuvo) vs. 'La policía detuvo a los manifestantes' → la omisión del agente puede proteger a los responsables o naturalizar la acción como si no tuviera autor"
        rationale: "La voz pasiva agenteless es una estrategia retórica frecuente en el discurso institucional y político; su análisis crítico revela quién tiene el poder de nombrar o silenciar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la lexicalización ideológica en el ADC? (la elección del vocabulario más preciso/la selección de palabras que conllevan posiciones ideológicas → llamar 'terrorista' o 'combatiente de la libertad' a la misma persona; 'migrante irregular' o 'persona sin papeles' → cada término activa un marco conceptual diferente con implicaciones sobre cómo se percibe y trata el referente/la creación de neologismos)"
        correctAnswer: la selección de palabras que conllevan posiciones ideológicas → llamar 'terrorista' o 'combatiente de la libertad' a la misma persona; 'migrante irregular' o 'persona sin papeles' → cada término activa un marco conceptual diferente con implicaciones sobre cómo se percibe y trata el referente
        rationale: "La lexicalización es donde la ideología se hace más visible; el ADC de van Dijk analiza sistemáticamente cómo los grupos dominantes lexicalizan la realidad a su favor."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los aparatos ideológicos del Estado según Althusser y cómo se relacionan con el discurso? (los ministerios del gobierno/instituciones como la escuela, los medios, la Iglesia y la familia que reproducen la ideología dominante sin coerción → el discurso escolar, mediático y familiar está cargado ideológicamente aunque aparezca como neutro → Althusser distingue aparatos represivos (policía, ejército) de ideológicos/los organismos reguladores del lenguaje)"
        correctAnswer: instituciones como la escuela, los medios, la Iglesia y la familia que reproducen la ideología dominante sin coerción → el discurso escolar, mediático y familiar está cargado ideológicamente aunque aparezca como neutro → Althusser distingue aparatos represivos (policía, ejército) de ideológicos
        rationale: "Althusser ('Ideología y aparatos ideológicos del Estado', 1970) es una referencia teórica del ADC; la idea de que el discurso aparentemente neutro reproduce la ideología es central."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo describe Foucault la relación entre discurso y poder? (el discurso solo refleja el poder/el discurso no solo refleja sino que produce el poder: las prácticas discursivas definen lo que es 'verdad', 'locura', 'delincuencia' → quien controla el discurso controla qué puede decirse y pensarse → el poder circula por el discurso, no emana de un centro/el discurso neutraliza el poder)"
        correctAnswer: "el discurso no solo refleja sino que produce el poder: las prácticas discursivas definen lo que es 'verdad', 'locura', 'delincuencia' → quien controla el discurso controla qué puede decirse y pensarse → el poder circula por el discurso, no emana de un centro"
        rationale: "El análisis foucaultiano del discurso-poder ('La arqueología del saber', 'Vigilar y castigar') es la base teórica del ADC; Foucault muestra que el conocimiento y el poder son inseparables."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la interdiscursividad en el análisis de Fairclough? (la coherencia interna de un discurso/la mezcla de diferentes tipos discursivos (géneros, discursos, estilos) dentro de un solo texto → la 'marketización' del discurso universitario mezcla el discurso académico con el discurso comercial ('cliente', 'producto', 'marca') → revela cómo los cambios sociales se inscriben en el lenguaje/la relación entre dos idiomas)"
        correctAnswer: la mezcla de diferentes tipos discursivos (géneros, discursos, estilos) dentro de un solo texto → la 'marketización' del discurso universitario mezcla el discurso académico con el discurso comercial ('cliente', 'producto', 'marca') → revela cómo los cambios sociales se inscriben en el lenguaje
        rationale: "La interdiscursividad de Fairclough es el ADC de la hibridación discursiva; los cambios en cómo se habla de educación o sanidad reflejan transformaciones ideológicas profundas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el cuadrado ideológico de van Dijk y cómo funciona en el discurso político? (un diagrama de partidos políticos/la estrategia discursiva que enfatiza los aspectos positivos del endogrupo y negativos del exogrupo, y minimiza los aspectos negativos del endogrupo y positivos del exogrupo → 'Nosotros defendemos la familia; ellos destruyen los valores' → polarización discursiva al servicio de la ideología/el análisis de las metáforas políticas)"
        correctAnswer: la estrategia discursiva que enfatiza los aspectos positivos del endogrupo y negativos del exogrupo, y minimiza los aspectos negativos del endogrupo y positivos del exogrupo → 'Nosotros defendemos la familia; ellos destruyen los valores' → polarización discursiva al servicio de la ideología
        rationale: "El cuadrado ideológico de van Dijk ('Ideology', 1998) es una herramienta de análisis del discurso político; la polarización nos/ellos es la operación ideológica más frecuente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo pueden los medios de comunicación construir la 'otredad' (otherness) a través del discurso? (siendo neutrales/mediante lexicalización negativa ('invasión' de migrantes en lugar de 'llegada'), prominencia de temas negativos en las noticias sobre grupos minoritarios, silenciamiento de voces de los propios afectados y uso de metáforas de amenaza → el discurso mediático produce representaciones que legitiman o cuestionan las políticas de exclusión/los medios son siempre objetivos)"
        correctAnswer: mediante lexicalización negativa ('invasión' de migrantes en lugar de 'llegada'), prominencia de temas negativos en las noticias sobre grupos minoritarios, silenciamiento de voces de los propios afectados y uso de metáforas de amenaza → el discurso mediático produce representaciones que legitiman o cuestionan las políticas de exclusión
        rationale: "El análisis del ADC sobre los medios de comunicación muestra que la representación discursiva de las minorías y los migrantes tiene efectos sociales y políticos reales."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Estrategias Discursivas y Análisis Aplicado
    exercises:
      - type: grammar
        question: "¿Qué es la eufemización como estrategia de ideología en el discurso? (el uso de palabras positivas/la sustitución de términos negativos o conflictivos por expresiones más suaves que minimizan la gravedad de lo descrito → 'daños colaterales' por 'víctimas civiles'; 'ajuste estructural' por 'recorte de servicios públicos' → el eufemismo naturaliza y suaviza la violencia o la desigualdad/el uso de metáforas positivas)"
        correctAnswer: la sustitución de términos negativos o conflictivos por expresiones más suaves que minimizan la gravedad de lo descrito → 'daños colaterales' por 'víctimas civiles'; 'ajuste estructural' por 'recorte de servicios públicos' → el eufemismo naturaliza y suaviza la violencia o la desigualdad
        rationale: "El eufemismo es una de las estrategias discursivas más analizadas por el ADC; Orwell ('Politics and the English Language', 1946) ya describió cómo el lenguaje político hace que la violencia parezca respetable."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se analiza críticamente un titular de periódico desde el ADC? (solo por su extensión/analizando la selección léxica (qué se llama cómo), la estructura sintáctica (activo/pasivo, presencia/ausencia de agente), la topicalización (qué aparece primero), las presupuesiciones e implicaturas, y la perspectiva (cuya voz se cita y cuya se silencia) → un mismo evento puede titularse de formas radicalmente distintas/solo por la ortografía)"
        correctAnswer: analizando la selección léxica (qué se llama cómo), la estructura sintáctica (activo/pasivo, presencia/ausencia de agente), la topicalización (qué aparece primero), las presupuesiciones e implicaturas, y la perspectiva (cuya voz se cita y cuya se silencia) → un mismo evento puede titularse de formas radicalmente distintas
        rationale: "El análisis crítico de titulares es una de las aplicaciones más accesibles del ADC; el contraste entre distintos medios sobre el mismo evento revela las ideologías en juego."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la presupuición ideológica en el discurso político? (una pregunta directa/una proposición que se da por sentada en el enunciado sin ser afirmada explícitamente → '¿Cuándo vas a dejar de robar dinero público?' presupone que el interlocutor roba; '¿Por qué los inmigrantes se aprovechan del sistema?' presupone que se aprovechan → las presuposiciones introducen contenido ideológico sin debate posible/un tipo de argumento silogístico)"
        correctAnswer: una proposición que se da por sentada en el enunciado sin ser afirmada explícitamente → '¿Cuándo vas a dejar de robar dinero público?' presupone que el interlocutor roba; '¿Por qué los inmigrantes se aprovechan del sistema?' presupone que se aprovechan → las presuposiciones introducen contenido ideológico sin debate posible
        rationale: "Las presuposiciones son especialmente efectivas ideológicamente porque no se pueden rebatir directamente sin parecer que uno acepta el marco; Schaffner las analiza en el discurso político."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo puede el orden de la información en un texto (topicalización) revelar jerarquías ideológicas? (el orden no importa ideológicamente/la información al inicio de un enunciado u oración (la posición de tema) recibe mayor prominencia cognitiva → 'Los manifestantes atacaron a la policía' (los manifestantes en posición temática) vs. 'La policía fue atacada por los manifestantes' → la primera versión activa el marco de los manifestantes como agentes violentos/el orden es solo estilístico)"
        correctAnswer: la información al inicio de un enunciado u oración (la posición de tema) recibe mayor prominencia cognitiva → 'Los manifestantes atacaron a la policía' (los manifestantes en posición temática) vs. 'La policía fue atacada por los manifestantes' → la primera versión activa el marco de los manifestantes como agentes violentos
        rationale: "La topicalización (estructura tema-rema) no es ideológicamente neutra; el ADC analiza sistemáticamente qué entidades o procesos se colocan en posición de tema."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el enmarquelamiento (framing) en la comunicación política y cómo funciona? (el formato de un discurso/la selección de ciertos aspectos de la realidad y su presentación de forma que promueve una interpretación particular → Lakoff: 'alivio fiscal' enmarca los impuestos como una carga de la que hay que liberar a la gente; 'inversión fiscal' los enmarca como beneficio colectivo → el marco determina qué soluciones parecen razonables/el tiempo que dura un discurso político)"
        correctAnswer: "la selección de ciertos aspectos de la realidad y su presentación de forma que promueve una interpretación particular → Lakoff: 'alivio fiscal' enmarca los impuestos como una carga de la que hay que liberar a la gente; 'inversión fiscal' los enmarca como beneficio colectivo → el marco determina qué soluciones parecen razonables"
        rationale: "El framing (Goffman, Lakoff) es una de las herramientas más estudiadas del ADC contemporáneo; tiene aplicaciones directas en la comunicación política y la elaboración de políticas públicas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la hegemonía según Gramsci y cómo se ejerce a través del discurso? (el dominio militar/el liderazgo cultural e ideológico que se ejerce con el consentimiento de los dominados → las clases dirigentes mantienen su poder no solo por la fuerza sino porque sus visiones del mundo son aceptadas como 'sentido común' → el discurso mediático, educativo y cultural naturaliza el orden social/la hegemonía es siempre represiva)"
        correctAnswer: el liderazgo cultural e ideológico que se ejerce con el consentimiento de los dominados → las clases dirigentes mantienen su poder no solo por la fuerza sino porque sus visiones del mundo son aceptadas como 'sentido común' → el discurso mediático, educativo y cultural naturaliza el orden social
        rationale: "El concepto de hegemonía de Gramsci es central para el ADC de Fairclough y Laclau/Mouffe; explica por qué los grupos subordinados a veces reproducen activamente su propia subordinación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué el ADC tiene una dimensión ética y no solo descriptiva? (porque analiza textos literarios/porque considera que el análisis lingüístico tiene consecuencias políticas: desvelar cómo el lenguaje legitima la opresión puede contribuir a cambiarla → el analista crítico del discurso tiene una responsabilidad social además de académica/porque es una disciplina más reciente)"
        correctAnswer: "porque considera que el análisis lingüístico tiene consecuencias políticas: desvelar cómo el lenguaje legitima la opresión puede contribuir a cambiarla → el analista crítico del discurso tiene una responsabilidad social además de académica"
        rationale: "El compromiso emancipatorio del ADC lo distingue de los enfoques descriptivos; la crítica es a la vez un método y un objetivo: producir conocimiento que sirva para el cambio."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo analiza el ADC el discurso sobre la crisis económica en los medios? (solo analiza el vocabulario/analizando metáforas ('la tormenta económica', 'el virus de la deuda'), nominalizaciones ('la caída', 'el ajuste'), quién habla y quién es silenciado, qué alternativas se presentan como posibles y cuáles se excluyen del debate → el discurso mediático construye la crisis como 'inevitable' o como resultado de decisiones políticas/no hay diferencia entre medios)"
        correctAnswer: analizando metáforas ('la tormenta económica', 'el virus de la deuda'), nominalizaciones ('la caída', 'el ajuste'), quién habla y quién es silenciado, qué alternativas se presentan como posibles y cuáles se excluyen del debate → el discurso mediático construye la crisis como 'inevitable' o como resultado de decisiones políticas
        rationale: "El análisis del discurso de la crisis económica es uno de los corpus más estudiados en el ADC contemporáneo; Fairclough y otros han analizado el discurso de la austeridad en Europa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el ADC del análisis del discurso no crítico? (el ADC usa más estadísticas/el análisis del discurso describe cómo funciona el discurso; el ADC analiza el discurso con el objetivo de entender y revelar las relaciones de poder y la desigualdad que reproduce → el ADC tiene un compromiso político explícito con el cambio social que el análisis descriptivo no tiene/el ADC solo estudia el habla oral)"
        correctAnswer: el análisis del discurso describe cómo funciona el discurso; el ADC analiza el discurso con el objetivo de entender y revelar las relaciones de poder y la desigualdad que reproduce → el ADC tiene un compromiso político explícito con el cambio social que el análisis descriptivo no tiene
        rationale: "La distinción descriptivo/crítico es fundamental para entender la posición epistemológica del ADC; Widdowson ha criticado que el compromiso político del ADC pueda sesgár el análisis."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se manifiesta la modalidad epistémica en el discurso del poder? (como un tiempo verbal especial/la modalidad expresa el grado de compromiso del hablante con la verdad del enunciado → los políticos usan la modalidad para distanciarse de afirmaciones comprometedoras: 'podría ser' (baja certeza), 'es evidente que' (alta certeza) → la distribución de la modalidad revela qué se presenta como hechos seguros y qué como especulación/la modalidad es solo formal)"
        correctAnswer: "la modalidad expresa el grado de compromiso del hablante con la verdad del enunciado → los políticos usan la modalidad para distanciarse de afirmaciones comprometedoras: 'podría ser' (baja certeza), 'es evidente que' (alta certeza) → la distribución de la modalidad revela qué se presenta como hechos seguros y qué como especulación"
        rationale: "El análisis de la modalidad epistémica (Halliday) es una herramienta del ADC para revelar el posicionamiento del hablante; la certeza o incertidumbre expresadas no son inocentes."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
