title: 🔬 Gramática - Semiótica y Teoría del Signo
level: K
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada sobre semiótica: el signo de Saussure (significante/significado, arbitrariedad, valor diferencial), la tríada de Peirce (ícono, índice, símbolo), la semiótica de la cultura (Lotman/esfera semiótica), los sistemas modelizantes (primarios: lengua; secundarios: arte, mito), la connotación y denotación (Barthes), el mito como sistema semiológico, la semiótica narrativa de Greimas (actantes), la intertextualidad."
example: "El signo lingüístico de Saussure: significante (imagen acústica 'árbol') + significado (concepto) → su relación es arbitraria (no motivada por semejanza) y su valor es diferencial (árbol ≠ arbusto ≠ planta)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Signo Lingüístico y Tricotomía de Peirce
    exercises:
      - type: grammar
        question: "¿Cuáles son los dos componentes del signo lingüístico de Saussure y qué propiedad define su relación? (forma y contenido; la relación es motivada/significante (imagen acústica) y significado (concepto mental) → su relación es arbitraria: no hay razón intrínseca para que el sonido 'árbol' designe el concepto que designa → lo demuestra el hecho de que cada lengua usa signos distintos para el mismo concepto/sonido y sentido; la relación es icónica)"
        correctAnswer: "significante (imagen acústica) y significado (concepto mental) → su relación es arbitraria: no hay razón intrínseca para que el sonido 'árbol' designe el concepto que designa → lo demuestra el hecho de que cada lengua usa signos distintos para el mismo concepto"
        rationale: "La arbitrariedad del signo es el primer principio del Curso de lingüística general de Saussure (1916); las onomatopeyas son excepciones parciales, pero incluso ellas varían entre lenguas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el valor diferencial del signo lingüístico según Saussure? (el precio del signo/la propiedad por la cual el signo no tiene un valor absoluto sino relacional → 'mouton' en francés vale para 'carnero' y 'carne de cordero'; 'sheep/mutton' en inglés diferencia los dos → el valor de cada signo depende de qué otros signos existen en la misma lengua/la frecuencia de uso del signo)"
        correctAnswer: la propiedad por la cual el signo no tiene un valor absoluto sino relacional → 'mouton' en francés vale para 'carnero' y 'carne de cordero'; 'sheep/mutton' en inglés diferencia los dos → el valor de cada signo depende de qué otros signos existen en la misma lengua
        rationale: "El valor diferencial implica que el sistema de la lengua es una red de diferencias sin términos positivos; el cambio en un elemento afecta al sistema entero."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre ícono, índice y símbolo en la tricotomía de Peirce? (son tres tipos de palabras/ícono: la relación signo-objeto es de semejanza (fotografía, mapa); índice: la relación es de contigüidad o causalidad (humo → fuego, síntoma → enfermedad); símbolo: la relación es arbitraria y convencional (la palabra 'perro')/ícono es escrito, índice es oral y símbolo es gestual)"
        correctAnswer: "ícono: la relación signo-objeto es de semejanza (fotografía, mapa); índice: la relación es de contigüidad o causalidad (humo → fuego, síntoma → enfermedad); símbolo: la relación es arbitraria y convencional (la palabra 'perro')"
        rationale: "La tricotomía de Peirce es más general que la distinción de Saussure: incluye todos los sistemas de signos, no solo el lenguaje; el símbolo de Peirce equivale al signo de Saussure."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la semiosfera según Lotman y cómo funciona? (la biosfera aplicada a los signos/el espacio semiótico total en que existen y funcionan los signos → es heterogéneo (centro y periferia), tiene una frontera con el exterior no-semiótico, y es la condición para que exista comunicación: nada puede ser signo fuera de la semiosfera/el vocabulario de una lengua)"
        correctAnswer: "el espacio semiótico total en que existen y funcionan los signos → es heterogéneo (centro y periferia), tiene una frontera con el exterior no-semiótico, y es la condición para que exista comunicación: nada puede ser signo fuera de la semiosfera"
        rationale: "La semiosfera de Lotman (Escuela de Tartu) modeliza la cultura como un espacio semiótico con estructura interna; la periferia es el lugar del cambio cultural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los sistemas modelizantes primarios y secundarios? (la gramática y el diccionario/la lengua natural es el sistema modelizante primario (modela la realidad); los sistemas secundarios (arte, mito, religión, ideología) utilizan la lengua como sustrato y construyen sobre ella modelos más complejos del mundo → Lotman y la escuela de Tartu/las dos formas del signo de Saussure)"
        correctAnswer: la lengua natural es el sistema modelizante primario (modela la realidad); los sistemas secundarios (arte, mito, religión, ideología) utilizan la lengua como sustrato y construyen sobre ella modelos más complejos del mundo → Lotman y la escuela de Tartu
        rationale: "El concepto de sistemas modelizantes integra la lingüística con la semiótica de la cultura; el arte es un sistema secundario que usa el material del primario para construir mundos alternativos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo distingue Barthes la denotación de la connotación? (son sinónimos/la denotación es el primer significado, literal o primario (una rosa = la flor); la connotación es el segundo significado, cultural o ideológico (una rosa = el amor romántico) → Barthes construye sobre esto su análisis del mito como sistema semiológico de segundo grado/la denotación es oral y la connotación es escrita)"
        correctAnswer: la denotación es el primer significado, literal o primario (una rosa = la flor); la connotación es el segundo significado, cultural o ideológico (una rosa = el amor romántico) → Barthes construye sobre esto su análisis del mito como sistema semiológico de segundo grado
        rationale: "En 'Mitologías' (1957), Barthes analiza cómo los sistemas connotativos naturalizan la ideología burguesa: lo cultural aparece como lo natural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo funciona el mito como sistema semiológico según Barthes? (como un relato tradicional/el mito toma un signo completo (significante+significado) del primer nivel y lo convierte en el significante de un nuevo sistema: el signo primero pierde historia y se naturaliza → el ejemplo de la foto del soldado negro saludando a la bandera francesa: significa 'el Imperio Francés no discrimina'/como una metáfora extendida)"
        correctAnswer: "el mito toma un signo completo (significante+significado) del primer nivel y lo convierte en el significante de un nuevo sistema: el signo primero pierde historia y se naturaliza → el ejemplo de la foto del soldado negro saludando a la bandera francesa: significa 'el Imperio Francés no discrimina'"
        rationale: "El análisis del mito de Barthes es un análisis semiótico de la ideología: los mitos naturalizan lo histórico-cultural presentándolo como eterno y universal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el modelo actancial de Greimas en la semiótica narrativa? (los personajes de un cuento/el modelo que reduce toda narrativa a seis actantes: sujeto/objeto (el eje del deseo), destinador/destinatario (el eje de la comunicación), ayudante/oponente (el eje del poder) → todo relato puede analizarse con estas seis funciones estructurales/los seis tiempos de un relato)"
        correctAnswer: "el modelo que reduce toda narrativa a seis actantes: sujeto/objeto (el eje del deseo), destinador/destinatario (el eje de la comunicación), ayudante/oponente (el eje del poder) → todo relato puede analizarse con estas seis funciones estructurales"
        rationale: "El modelo actancial de Greimas (1966) es una versión formalizada de los 31 morfemas narrativos de Propp; los actantes son roles funcionales, no personajes concretos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la intertextualidad y a quién se debe el concepto? (la relación entre autor y lector/la propiedad de todo texto de estar construido sobre otros textos → Kristeva (1967), a partir de Bajtín: todo texto es una absorción y transformación de textos anteriores; Genette sistematizó las relaciones transtextuales (cita, alusión, parodia, hipertextualidad)/la relación entre ilustraciones y texto)"
        correctAnswer: "la propiedad de todo texto de estar construido sobre otros textos → Kristeva (1967), a partir de Bajtín: todo texto es una absorción y transformación de textos anteriores; Genette sistematizó las relaciones transtextuales (cita, alusión, parodia, hipertextualidad)"
        rationale: "La intertextualidad cuestiona la idea de un texto 'original': todo texto dialoga con el pasado; el concepto es central en la teoría literaria y la semiótica posmoderna."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relaciona el concepto de arbitrariedad de Saussure con el de símbolo de Peirce? (son opuestos sin relación/ambos se refieren al mismo tipo de signo: el signo cuya relación con el objeto es convencional, no motivada → el 'símbolo' de Peirce es equivalente al 'signo' de Saussure; lo opuesto al símbolo de Peirce son el ícono (motivado por semejanza) y el índice (motivado por contigüidad)/el símbolo de Peirce es motivado)"
        correctAnswer: "ambos se refieren al mismo tipo de signo: el signo cuya relación con el objeto es convencional, no motivada → el 'símbolo' de Peirce es equivalente al 'signo' de Saussure; lo opuesto al símbolo de Peirce son el ícono (motivado por semejanza) y el índice (motivado por contigüidad)"
        rationale: "La convergencia Saussure-Peirce en el concepto de arbitrariedad/convencionalidad es un punto de partida para integrar las dos tradiciones semióticas europeo-americana."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Semiótica de la Imagen y la Cultura
    exercises:
      - type: grammar
        question: "¿Qué es la retórica de la imagen según Barthes y cómo se aplica a la publicidad? (la gramática visual/el análisis de los tres mensajes de una imagen publicitaria: el mensaje lingüístico (texto), el mensaje icónico codificado (connotación) y el mensaje icónico no codificado (denotación pura) → los anuncios combinan todos para anclaje y relevo/la sintaxis de las imágenes)"
        correctAnswer: "el análisis de los tres mensajes de una imagen publicitaria: el mensaje lingüístico (texto), el mensaje icónico codificado (connotación) y el mensaje icónico no codificado (denotación pura) → los anuncios combinan todos para anclaje y relevo"
        rationale: "En 'Retórica de la imagen' (1964), Barthes analiza un anuncio de pasta Panzani; el 'anclaje' del texto limita el mensaje icónico; el 'relevo' lo completa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la función de anclaje y la función de relevo del texto en una imagen? (las dos formas de leyenda/los pies de foto decorativos/anclaje: el texto fija el significado de la imagen, reduciendo su polisemia → un pie de foto que dice 'manifestantes' orienta la lectura; relevo: el texto y la imagen se complementan, cada uno añade información que el otro no tiene → los cómics usan el relevo)"
        correctAnswer: "anclaje: el texto fija el significado de la imagen, reduciendo su polisemia → un pie de foto que dice 'manifestantes' orienta la lectura; relevo: el texto y la imagen se complementan, cada uno añade información que el otro no tiene → los cómics usan el relevo"
        rationale: "El anclaje es la función más común del texto en los medios de comunicación: selecciona uno de los posibles significados de la imagen polisémica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo distingue la semiótica entre el código y el mensaje? (el código es siempre binario/son sinónimos/el código es el sistema de reglas compartido por emisor y receptor que hace posible la codificación y decodificación del mensaje; el mensaje es la instancia particular producida según ese código → la lengua es el código; un enunciado es el mensaje)"
        correctAnswer: el código es el sistema de reglas compartido por emisor y receptor que hace posible la codificación y decodificación del mensaje; el mensaje es la instancia particular producida según ese código → la lengua es el código; un enunciado es el mensaje
        rationale: "La distinción código/mensaje es paralela a la distinción lengua/habla de Saussure; en la teoría de la comunicación de Jakobson, el código es uno de los seis factores del acto comunicativo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la función poética del lenguaje según Jakobson? (la función de comunicar belleza/la función centrada en el mensaje mismo: el mensaje llama la atención sobre su propia forma → 'I like Ike': aliteración + rima → el principio de equivalencia (paradigmático) proyectado sobre el eje sintagmático/la función expresiva del hablante)"
        correctAnswer: "la función centrada en el mensaje mismo: el mensaje llama la atención sobre su propia forma → 'I like Ike': aliteración + rima → el principio de equivalencia (paradigmático) proyectado sobre el eje sintagmático"
        rationale: "Las seis funciones de Jakobson (referencial, emotiva, conativa, fática, metalingüística, poética) corresponden a los seis factores del acto comunicativo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el signo indicial y cómo se usa en medicina semiótica? (un signo convencional médico/el signo cuya relación con el objeto es de contigüidad o causalidad → en medicina, el síntoma es un índice: la fiebre es índice de infección, la palidez es índice de anemia → el médico 'lee' los índices del cuerpo como signos de la enfermedad/un símbolo visual)"
        correctAnswer: "el signo cuya relación con el objeto es de contigüidad o causalidad → en medicina, el síntoma es un índice: la fiebre es índice de infección, la palidez es índice de anemia → el médico 'lee' los índices del cuerpo como signos de la enfermedad"
        rationale: "La medicina clínica como semiótica es una de las aplicaciones más antiguas de la teoría del signo; Eco, en 'Tratado de semiótica general', desarrolla la relación síntoma-índice."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el cuadrado semiótico de Greimas y para qué sirve? (un diagrama de personajes/la estructura lógica que organiza las oposiciones semánticas fundamentales → tesis/antítesis (contradicción), complementarios (contrariedad) → permite mapear los valores de un texto: si el bien es S1 y el mal es S2, el no-mal y el no-bien son los términos intermedios/un tipo de análisis gramatical)"
        correctAnswer: "la estructura lógica que organiza las oposiciones semánticas fundamentales → tesis/antítesis (contradicción), complementarios (contrariedad) → permite mapear los valores de un texto: si el bien es S1 y el mal es S2, el no-mal y el no-bien son los términos intermedios"
        rationale: "El cuadrado semiótico es la herramienta central de la semiótica narrativa de Greimas; formaliza el sistema de valores sobre el que se construye la narración."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se puede aplicar la distinción ícono/índice/símbolo al análisis de emojis? (los emojis son solo decoración/los emojis funcionan como íconos (😀 se parece a una cara sonriente), como índices (🔥 indica algo 'hot' o trending, por contigüidad cultural) o como símbolos (el corazón rojo ❤️ por convención significa amor) → un mismo emoji puede funcionar en varios modos simultáneamente/los emojis son siempre simbólicos)"
        correctAnswer: los emojis funcionan como íconos (😀 se parece a una cara sonriente), como índices (🔥 indica algo 'hot' o trending, por contigüidad cultural) o como símbolos (el corazón rojo ❤️ por convención significa amor) → un mismo emoji puede funcionar en varios modos simultáneamente
        rationale: "Los emojis son un caso de estudio moderno de la tricotomía de Peirce; muestran que los signos reales combinan frecuentemente más de una forma de iconicidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la metonimia semiótica y en qué difiere de la metáfora semiótica? (son idénticas/la metáfora semiótica sustituye un signo por otro basándose en la semejanza (paradigmática); la metonimia sustituye un signo por otro basándose en la contigüidad (sintagmática) → 'el Kremlin decidió' (el edificio por la institución) usa la metonimia; 'el caudillo es un lobo' usa la metáfora/la metonimia es más literaria)"
        correctAnswer: la metáfora semiótica sustituye un signo por otro basándose en la semejanza (paradigmática); la metonimia sustituye un signo por otro basándose en la contigüidad (sintagmática) → 'el Kremlin decidió' (el edificio por la institución) usa la metonimia; 'el caudillo es un lobo' usa la metáfora
        rationale: "Jakobson relacionó metáfora/metonimia con el eje paradigmático/sintagmático y con la afasia de selección/combinación; Lacan aplicó esta distinción al inconsciente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la función metalingüística del lenguaje y cuándo se activa? (la función de comunicar emociones/la función que usa el lenguaje para hablar sobre el lenguaje mismo → '¿Qué significa «efímero»?' activa la función metalingüística → los diccionarios, gramáticas y toda actividad de definición o corrección lingüística son metalingüísticos/la función de llamar la atención del receptor)"
        correctAnswer: la función que usa el lenguaje para hablar sobre el lenguaje mismo → '¿Qué significa «efímero»?' activa la función metalingüística → los diccionarios, gramáticas y toda actividad de definición o corrección lingüística son metalingüísticos
        rationale: "La función metalingüística (Jakobson) corresponde al polo del código en el esquema comunicativo; la lingüística misma es un uso metalingüístico de la lengua."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo aplicaría Barthes su análisis del mito a la publicidad contemporánea de los teléfonos inteligentes? (no hay aplicación posible/los anuncios de smartphones naturalizan la ideología de la innovación y el progreso: el signo 'nuevo iPhone' connota modernidad, éxito y pertenencia social → lo que es un producto de consumo se presenta como necesidad natural e identidad personal → el mito borra la historia y la decisión comercial/la publicidad es solo información)"
        correctAnswer: "los anuncios de smartphones naturalizan la ideología de la innovación y el progreso: el signo 'nuevo iPhone' connota modernidad, éxito y pertenencia social → lo que es un producto de consumo se presenta como necesidad natural e identidad personal → el mito borra la historia y la decisión comercial"
        rationale: "La aplicación del análisis barthesiano del mito a la publicidad tecnológica muestra la vigencia del método: los mitos contemporáneos operan igual que los analizados por Barthes en los años 50."
        difficulty: 5
        objectives: [es.pre_reading]
