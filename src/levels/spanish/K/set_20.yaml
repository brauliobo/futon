    title: Revisión - Parte II
    exercises:
      - type: grammar
        question: "¿Qué tienen en común la lingüística forense y la narratología en el análisis de los testimonios? (no tienen relación/ambas analizan la coherencia narrativa: la lingüística forense evalúa si los testimonios tienen la estructura de los relatos verídicos (detalles perceptivos, marcadores temporales, reparaciones); la narratología estudia cómo los relatos construyen verosimilitud → las mismas herramientas de análisis del relato sirven para evaluar la credibilidad/son disciplinas completamente distintas)"
        correctAnswer: ambas analizan la coherencia narrativa: la lingüística forense evalúa si los testimonios tienen la estructura de los relatos verídicos (detalles perceptivos, marcadores temporales, reparaciones); la narratología estudia cómo los relatos construyen verosimilitud → las mismas herramientas de análisis del relato sirven para evaluar la credibilidad
        rationale: "La aplicación de la narratología a la evaluación de testimonios forenses es un campo emergente; la verosimilitud narrativa y la credibilidad forense comparten criterios de coherencia estructural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo conecta el humanismo del Renacimiento con el individualismo de la psicología social contemporánea? (no hay continuidad histórica/el humanismo renacentista afirmó la autonomía y la libertad de determinación del ser humano; la psicología social de Milgram y Zimbardo demostró que esta autonomía está radicalmente limitada por el contexto social → la visión humanista del individuo autónomo se enfrenta al situacionismo de la psicología social/el humanismo es solo una corriente literaria)"
        correctAnswer: el humanismo renacentista afirmó la autonomía y la libertad de determinación del ser humano; la psicología social de Milgram y Zimbardo demostró que esta autonomía está radicalmente limitada por el contexto social → la visión humanista del individuo autónomo se enfrenta al situacionismo de la psicología social
        rationale: "La tensión humanismo/situacionismo es una de las grandes tensiones de la cultura occidental; la autonomía renacentista y la heteronomía situacional son polos de un debate que continúa."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo aplica la semiótica de Barthes el análisis del mito al boom latinoamericano? (Barthes no analizó la literatura latinoamericana/el boom naturalizó ciertos mitos latinoamericanos: el realismo mágico como 'la forma de ser latinoamericano' → se presenta como expresión natural de América Latina cuando es una elección estética e ideológica de un grupo de escritores en un momento histórico → Barthes llamaría a esto 'historia naturalizada como naturaleza'/el boom rechazó el análisis semiótico)"
        correctAnswer: el boom naturalizó ciertos mitos latinoamericanos: el realismo mágico como 'la forma de ser latinoamericano' → se presenta como expresión natural de América Latina cuando es una elección estética e ideológica de un grupo de escritores en un momento histórico → Barthes llamaría a esto 'historia naturalizada como naturaleza'
        rationale: "La crítica poscolonial del boom latinoamericano aplica el análisis barthesiano del mito: el realismo mágico se naturalizó como 'esencia' latinoamericana pero es una construcción histórica con condiciones de producción específicas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tienen en común el programa de investigación progresivo de Lakatos y el concepto de revolución científica de Kuhn con la historia del pensamiento económico? (no se relacionan/ambos explican por qué las teorías económicas no se abandonan ante la primera anomalía (Duhem-Quine): el keynesianismo y el monetarismo tienen 'núcleos duros' protegidos → los paradigmas económicos (neoclásico, keynesiano) cambian por acumulación de anomalías, no por una sola refutación/la economía no tiene paradigmas científicos)"
        correctAnswer: ambos explican por qué las teorías económicas no se abandonan ante la primera anomalía (Duhem-Quine): el keynesianismo y el monetarismo tienen 'núcleos duros' protegidos → los paradigmas económicos (neoclásico, keynesiano) cambian por acumulación de anomalías, no por una sola refutación
        rationale: "La historia de la economía como historia de paradigmas (la revolución marginalista, la revolución keynesiana) ilustra perfectamente los modelos de Kuhn y Lakatos; la economía tiene 'núcleos duros' ideológicos además de teóricos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo conectan los designadores rígidos de Kripke con la lingüística forense en la identificación de autoría? (no tienen relación/si los nombres propios son designadores rígidos (refieren al mismo individuo en todos los mundos posibles), la identificación de autoría en lingüística forense debe demostrar que el autor del texto es el mismo individuo que el acusado → la cadena causal de Kripke (bautismo → uso) es análoga a la cadena de evidencias forenses que une el texto con el autor real/los nombres propios no se usan en lingüística forense)"
        correctAnswer: si los nombres propios son designadores rígidos (refieren al mismo individuo en todos los mundos posibles), la identificación de autoría en lingüística forense debe demostrar que el autor del texto es el mismo individuo que el acusado → la cadena causal de Kripke (bautismo → uso) es análoga a la cadena de evidencias forenses que une el texto con el autor real
        rationale: "La conexión Kripke/forense es filosóficamente interesante: la identificación de personas en el lenguaje (Kripke) y en el derecho (lingüística forense) comparten el problema de establecer la identidad del referente a través de cadenas de evidencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan la distancia de poder (Hofstede) y el análisis del discurso crítico en el contexto organizacional? (no se relacionan/culturas de alta PDI tienen discursos organizacionales más jerárquicos y menos cuestionadores → el ADC analiza cómo el discurso reproduce la jerarquía: los subordinados usan formas más deferentes, los superiores tienen derechos discursivos diferentes (pueden interrumpir, no responder) → la comunicación intercultural y el ADC convergen en el estudio del poder en el discurso/el ADC es solo para el discurso político)"
        correctAnswer: culturas de alta PDI tienen discursos organizacionales más jerárquicos y menos cuestionadores → el ADC analiza cómo el discurso reproduce la jerarquía: los subordinados usan formas más deferentes, los superiores tienen derechos discursivos diferentes (pueden interrumpir, no responder) → la comunicación intercultural y el ADC convergen en el estudio del poder en el discurso
        rationale: "La intersección Hofstede/ADC en el estudio del poder en organizaciones es un campo activo; las dimensiones culturales explican las variaciones interculturales de los patrones de poder discursivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo conectan la heteroglosia de Bajtín (poética) y la evidencialidad tipológica (tipología lingüística) en el análisis del discurso? (no tienen relación/la heteroglosia bajtiniana describe cómo el texto novelístico incorpora múltiples voces y registros; la evidencialidad gramatical codifica la fuente de información del hablante → en lenguas con evidencialidad obligatoria, la novela debe especificar gramaticalmente si el narrador sabe algo de primera mano o de otro → la forma de la novela está condicionada por la gramática de la lengua/Bajtín no conocía la tipología lingüística)"
        correctAnswer: la heteroglosia bajtiniana describe cómo el texto novelístico incorpora múltiples voces y registros; la evidencialidad gramatical codifica la fuente de información del hablante → en lenguas con evidencialidad obligatoria, la novela debe especificar gramaticalmente si el narrador sabe algo de primera mano o de otro → la forma de la novela está condicionada por la gramática de la lengua
        rationale: "La conexión Bajtín/evidencialidad es un tema de investigación emergente: las culturas con evidencialidad obligatoria (quechua) producen narrativas con una epistemología explícita diferente a la de las culturas sin esta categoría."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tienen en común el principio idiomático de Sinclair (lingüística de corpus) y las metáforas conceptuales de Lakoff (lingüística cognitiva) en la visión del léxico? (son opuestos/ambos cuestionan la idea de que el léxico sea una lista de palabras independientes con significado composicional → Sinclair: las palabras arrastran sus colocaciones habituales (unidades fraseológicas); Lakoff: las palabras están organizadas por estructuras conceptuales (metáforas, esquemas de imagen) → el léxico es más que la suma de sus palabras/son teorías completamente independientes)"
        correctAnswer: ambos cuestionan la idea de que el léxico sea una lista de palabras independientes con significado composicional → Sinclair: las palabras arrastran sus colocaciones habituales (unidades fraseológicas); Lakoff: las palabras están organizadas por estructuras conceptuales (metáforas, esquemas de imagen) → el léxico es más que la suma de sus palabras
        rationale: "La lingüística de corpus y la lingüística cognitiva tienen un punto de convergencia en la fraseología y las metáforas conceptuales; Stefanowitsch y Gries desarrollaron el análisis de corpus de las metáforas cognitivas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan la aversión a la pérdida (economía conductual) con la hegemonía de Gramsci (análisis del discurso crítico)? (son teorías del siglo XX sin relación/la aversión a la pérdida explica por qué los grupos subordinados pueden preferir el statu quo aunque sea desventajoso → lo conocido se valora más que la ganancia incierta del cambio; la hegemonía de Gramsci explica por qué los subordinados consientan su propia dominación → ambas teorías explican la inercia social desde ángulos distintos/la economía conductual rechaza el análisis político)"
        correctAnswer: la aversión a la pérdida explica por qué los grupos subordinados pueden preferir el statu quo aunque sea desventajoso → lo conocido se valora más que la ganancia incierta del cambio; la hegemonía de Gramsci explica por qué los subordinados consientan su propia dominación → ambas teorías explican la inercia social desde ángulos distintos
        rationale: "La aversión a la pérdida y la hegemonía son mecanismos complementarios que explican la estabilidad de los sistemas de dominación; la economía conductual aporta la dimensión cognitiva y la teoría crítica aporta la dimensión estructural."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo conecta el concepto de traducción con la interpretación de Copenhague de la mecánica cuántica en la filosofía del lenguaje? (son campos sin conexión/la interpretación de Copenhague sostiene que la realidad cuántica no tiene valores definidos antes de la medición → la 'traducción' de la superposición cuántica al lenguaje clásico es imposible sin pérdida (como la intraducibilidad cultural) → el lenguaje clásico es siempre una aproximación de una realidad que excede su capacidad de representación, como la traducción es aproximación del original/son analogías sin valor real)"
        correctAnswer: la interpretación de Copenhague sostiene que la realidad cuántica no tiene valores definidos antes de la medición → la 'traducción' de la superposición cuántica al lenguaje clásico es imposible sin pérdida (como la intraducibilidad cultural) → el lenguaje clásico es siempre una aproximación de una realidad que excede su capacidad de representación, como la traducción es aproximación del original
        rationale: "La analogía cuántica-traductológica es filosóficamente fecunda: en ambos casos, la representación lingüística o matemática clásica no captura completamente una realidad que es más rica que los sistemas que usamos para describirla."
        difficulty: 5
        objectives: [es.pre_reading]
