authorNotes: "Revisión integradora del nivel K: lingüística histórica, psicología social, tipología lingüística, neurociencia del aprendizaje, semiótica, epistemología, comunicación intercultural, derecho internacional, análisis del discurso crítico, literatura latinoamericana, lingüística forense, economía conductual, filosofía del lenguaje avanzada, historia del pensamiento económico, traductología, física cuántica, lingüística de corpus, Renacimiento y Revolución Científica, poética y géneros literarios."
example: "Relaciona los conceptos del nivel K → conecta la lingüística de corpus con la traductología (corpus paralelos para la equivalencia), la economía conductual con el análisis del discurso crítico (framing y nudges), o la semiótica con la poética (signo, símbolo, metáfora)."
