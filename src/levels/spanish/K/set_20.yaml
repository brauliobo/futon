    title: Revisión - Parte I
    exercises:
      - type: grammar
        question: "¿Cómo conectan la ley de Grimm (lingüística histórica) y la tipología lingüística en el análisis del germanismo? (no tienen relación/la ley de Grimm describe el cambio fonológico sistemático del PIE al germánico → las lenguas germánicas resultantes tienen características tipológicas diferentes de las romances (más analíticas, con orden SVO fijo) → el cambio histórico produce la diversidad tipológica que la tipología compara sincróniamente/la ley de Grimm es solo fonológica sin consecuencias tipológicas)"
        correctAnswer: la ley de Grimm describe el cambio fonológico sistemático del PIE al germánico → las lenguas germánicas resultantes tienen características tipológicas diferentes de las romances (más analíticas, con orden SVO fijo) → el cambio histórico produce la diversidad tipológica que la tipología compara sincróniamente
        rationale: "La lingüística histórica y la tipología son complementarias: la primera describe el cambio diacrónico, la segunda compara el estado sincrónico; la diversidad tipológica actual refleja la divergencia histórica de las familias lingüísticas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relaciona el efecto del observador (psicología social) con el experimento de la doble rendija (física cuántica)? (no tienen relación/en ambos, la observación altera el fenómeno observado → en física cuántica, el electrón cambia de comportamiento ondulatorio a corpuscular al ser medido; en psicología social, la presencia de testigos altera el comportamiento del individuo → la observación no es neutra en ningún dominio/solo es metáfora sin conexión real)"
        correctAnswer: en ambos, la observación altera el fenómeno observado → en física cuántica, el electrón cambia de comportamiento ondulatorio a corpuscular al ser medido; en psicología social, la presencia de testigos altera el comportamiento del individuo → la observación no es neutra en ningún dominio
        rationale: "La analogía observador-observado en física cuántica y psicología social es conceptualmente rica aunque las causas son distintas; refleja el problema epistemológico general de la objetividad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo aplica el análisis del discurso crítico la teoría de los sesgos cognitivos de la economía conductual? (ADC y economía conductual no se relacionan/el ADC estudia cómo el discurso político explota los sesgos cognitivos → el framing (encuadre) es exactamente el mismo fenómeno en política que en economía conductual: presentar el mismo contenido de forma que active los sesgos favorables → 'alivio fiscal' (encuadre conservador) vs. 'inversión en servicios' (encuadre progresista)/los sesgos son solo económicos)"
        correctAnswer: el ADC estudia cómo el discurso político explota los sesgos cognitivos → el framing (encuadre) es exactamente el mismo fenómeno en política que en economía conductual: presentar el mismo contenido de forma que active los sesgos favorables → 'alivio fiscal' (encuadre conservador) vs. 'inversión en servicios' (encuadre progresista)
        rationale: "El framing es el punto de convergencia entre la economía conductual (Kahneman/Tversky) y el ADC (Lakoff/Fairclough); en ambas disciplinas, el encuadre tiene consecuencias reales sobre las decisiones."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué relación hay entre la plasticidad cerebral (neurociencia) y el principio de Hebb con el aprendizaje por repetición espaciada? (son fenómenos sin relación/el principio de Hebb postula que la activación simultánea repetida fortalece las sinapsis (LTP); el aprendizaje espaciado aprovecha este mecanismo al reactivar las redes sinápticas en declive → la plasticidad cerebral es la base biológica de por qué el espaciado funciona mejor que la repetición inmediata/la neurociencia no tiene aplicación pedagógica directa)"
        correctAnswer: el principio de Hebb postula que la activación simultánea repetida fortalece las sinapsis (LTP); el aprendizaje espaciado aprovecha este mecanismo al reactivar las redes sinápticas en declive → la plasticidad cerebral es la base biológica de por qué el espaciado funciona mejor que la repetición inmediata
        rationale: "La cadena Hebb → LTP → plasticidad → aprendizaje espaciado es la base neurocientífica de la pedagogía Kumon: la repetición espaciada no es solo empírica sino biológicamente fundamentada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo conectan la semiótica de Peirce y la traductología en el análisis de la traducción de íconos culturales? (la semiótica no tiene aplicación traductológica/los íconos (semejanza) son relativamente fáciles de traducir; los símbolos (arbitrarios/convencionales) presentan el mayor reto de intraducibilidad porque su significado depende del código cultural → un emoji puede ser ícono en una cultura y símbolo (código convencional diferente) en otra/la semiótica solo se aplica a textos visuales)"
        correctAnswer: los íconos (semejanza) son relativamente fáciles de traducir; los símbolos (arbitrarios/convencionales) presentan el mayor reto de intraducibilidad porque su significado depende del código cultural → un emoji puede ser ícono en una cultura y símbolo (código convencional diferente) en otra
        rationale: "La aplicación de la tricotomía de Peirce a la traductología revela por qué los elementos culturalmente codificados (símbolos) son los más difíciles de traducir; la intraducibilidad cultural es mayor para los signos simbólicos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan la falsabilidad de Popper y el principio de incertidumbre de Heisenberg en la epistemología de la física cuántica? (son contradictorios sin relación/el principio de Heisenberg limita la precisión de las mediciones → plantea el problema de si la mecánica cuántica es falsable en el sentido de Popper; la tesis Duhem-Quine sugiere que ninguna hipótesis cuántica puede falsarse aisladamente → el debate interpretativo (Copenhague vs. muchos mundos) ilustra que las interpretaciones equivalentes emocionalmente no son falsables entre sí/la física cuántica confirma el falsacionismo)"
        correctAnswer: el principio de Heisenberg limita la precisión de las mediciones → plantea el problema de si la mecánica cuántica es falsable en el sentido de Popper; la tesis Duhem-Quine sugiere que ninguna hipótesis cuántica puede falsarse aisladamente → el debate interpretativo ilustra que las interpretaciones equivalentes empíricamente no son falsables entre sí
        rationale: "La física cuántica es el caso de prueba más difícil del falsacionismo; el hecho de que las interpretaciones sean empíricamente equivalentes pero filosóficamente distintas muestra los límites del criterio de demarcación popperiano."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué relación hay entre los nudges de la economía conductual y el análisis del discurso crítico del poder? (los nudges son siempre benignos/los nudges son arquitecturas de elección diseñadas por alguien para otros → el ADC señala que los nudges pueden reproducir relaciones de poder: quien diseña el nudge tiene poder sobre quien es 'empujado' → la arquitectura de la elección no es neutra: puede usarse para el bien colectivo o para intereses corporativos/el ADC rechaza completamente los nudges)"
        correctAnswer: los nudges son arquitecturas de elección diseñadas por alguien para otros → el ADC señala que los nudges pueden reproducir relaciones de poder: quien diseña el nudge tiene poder sobre quien es 'empujado' → la arquitectura de la elección no es neutra: puede usarse para el bien colectivo o para intereses corporativos
        rationale: "La conexión nudging/poder es una de las críticas más interesantes al paternalismo libertario; el ADC aporta la dimensión de quién tiene el poder de diseñar los entornos de elección y a quién beneficia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo conecta el giro copernical con el giro cultural de la traductología? (no tienen relación/el heliocentrismo de Copérnico descentró la Tierra del universo → metafóricamente, el 'giro cultural' en traductología descentró el texto original como punto fijo: la traducción no gira en torno al original sino que es una práctica cultural con sus propias condiciones de producción y recepción/ambos son revoluciones del siglo XVI)"
        correctAnswer: el heliocentrismo de Copérnico descentró la Tierra del universo → metafóricamente, el 'giro cultural' en traductología descentró el texto original como punto fijo: la traducción no gira en torno al original sino que es una práctica cultural con sus propias condiciones de producción y recepción
        rationale: "La metáfora del giro copernicano se aplica a varios giros epistemológicos en humanidades; en traductología, el descentramiento del original es análogo al descentramiento de la Tierra."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo aplica la lingüística de corpus el concepto de prosodia semántica al análisis del discurso crítico? (la prosodia semántica no tiene aplicación crítica/el corpus revela las connotaciones negativas que ciertas palabras arrastran a través de sus colocaciones típicas → el ADC puede usar el corpus para demostrar que ciertas expresiones llevan cargas valorativas ocultas: 'régimen' coloca con términos negativos → usar 'régimen' para describir un gobierno activa una prosodia negativa/la prosodia semántica es solo estética)"
        correctAnswer: el corpus revela las connotaciones negativas que ciertas palabras arrastran a través de sus colocaciones típicas → el ADC puede usar el corpus para demostrar que ciertas expresiones llevan cargas valorativas ocultas: 'régimen' coloca con términos negativos → usar 'régimen' para describir un gobierno activa una prosodia negativa
        rationale: "La lingüística de corpus y el ADC se complementan: el corpus proporciona evidencia empírica cuantitativa de los patrones discursivos que el ADC interpreta críticamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo conectan la ventaja comparativa de Ricardo (historia del pensamiento económico) con la R2P (derecho internacional) en la teoría de las relaciones internacionales? (son principios opuestos sin conexión/la ventaja comparativa justifica el libre comercio internacional → los países se especializan e intercambian; la R2P justifica la intervención internacional cuando un Estado no protege a su población → ambos cuestionan la soberanía westfaliana absoluta: el libre comercio limita la autarquía económica; la R2P limita la soberanía política/no hay relación porque son disciplinas distintas)"
        correctAnswer: la ventaja comparativa justifica el libre comercio internacional → los países se especializan e intercambian; la R2P justifica la intervención internacional cuando un Estado no protege a su población → ambos cuestionan la soberanía westfaliana absoluta: el libre comercio limita la autarquía económica; la R2P limita la soberanía política
        rationale: "La soberanía westfaliana está limitada tanto por el derecho internacional (R2P) como por la interdependencia económica (libre comercio); la globalización erosiona la soberanía desde ambas dimensiones."
        difficulty: 5
        objectives: [es.pre_reading]
