title: Gramática - Lingüística Forense y Lenguaje Jurídico
level: K
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada sobre lingüística forense y lenguaje jurídico: la identificación de autoría (estilometría, análisis de rasgos idiolectales), el análisis del discurso en el tribunal (interrogatorio, testimonio, lenguaje del jurado), el lenguaje oscuro del derecho (legalese), la simplificación del lenguaje jurídico (plain language movement), los actos de habla performativos en el derecho (sentencias, contratos, votos), la traducción jurídica y los falsos amigos legales, el análisis de amenazas y el discurso de odio."
example: "El performativo jurídico: cuando un juez dice 'Lo condeno a cinco años de prisión' → el enunciado no describe un hecho sino que lo crea → el acto de habla performativo tiene fuerza ilocutiva institucional específica."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Lingüística Forense: Identificación y Tribunal
    exercises:
      - type: grammar
        question: "¿Qué es la estilometría y cómo se aplica a la identificación de autoría? (el estudio de los estilos literarios/el análisis estadístico de los rasgos lingüísticos de un texto (longitud de palabras, frecuencia de función de palabras, estructuras sintácticas preferidas) para atribuirlo a un autor → se usa para detectar plagio, resolver disputas de autoría (Shakespeare, las cartas de Jack el Destripador) y en casos forenses/el análisis de la caligrafía)"
        correctAnswer: el análisis estadístico de los rasgos lingüísticos de un texto (longitud de palabras, frecuencia de función de palabras, estructuras sintácticas preferidas) para atribuirlo a un autor → se usa para detectar plagio, resolver disputas de autoría (Shakespeare, las cartas de Jack el Destripador) y en casos forenses
        rationale: "La estilometría moderna usa análisis de componentes principales y redes neuronales; los marcadores estilísticos más robustos son las palabras función (pronombres, preposiciones, conjunciones)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el idiolecto y por qué es relevante para la lingüística forense? (el dialecto de una ciudad/el conjunto de rasgos lingüísticos individuales que caracterizan el habla de una persona específica: elecciones léxicas, sintácticas, ortográficas y de puntuación → el idiolecto es la 'huella dactilar' lingüística → la lingüística forense puede atribuir textos anónimos o pseudónimos a autores específicos/el sociolecto de una profesión)"
        correctAnswer: el conjunto de rasgos lingüísticos individuales que caracterizan el habla de una persona específica: elecciones léxicas, sintácticas, ortográficas y de puntuación → el idiolecto es la 'huella dactilar' lingüística → la lingüística forense puede atribuir textos anónimos o pseudónimos a autores específicos
        rationale: "El idiolecto es la base de la identificación de autoría; su existencia y estabilidad es un supuesto de la lingüística forense, aunque los individuos también varían su estilo según el contexto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el lenguaje oscuro del derecho (legalese) y qué características tiene? (el lenguaje de los jueces en el tribunal/el lenguaje técnico y complejo del texto jurídico tradicional → frases extremadamente largas, subordinadas múltiples, uso de arcaísmos latines y franceses ('habeas corpus', 'mens rea'), nominalización excesiva, voz pasiva dominante → es difícil de entender para los no especialistas/el lenguaje de los testigos)"
        correctAnswer: el lenguaje técnico y complejo del texto jurídico tradicional → frases extremadamente largas, subordinadas múltiples, uso de arcaísmos latines y franceses ('habeas corpus', 'mens rea'), nominalización excesiva, voz pasiva dominante → es difícil de entender para los no especialistas
        rationale: "El legalese tiene función de exclusión: la complejidad lingüística requiere intermediarios profesionales (abogados) y puede privar a los ciudadanos de acceso real a la justicia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el movimiento por el lenguaje claro (plain language) en el ámbito jurídico? (la simplificación del latín/el movimiento que aboga por reescribir los textos legales en un lenguaje comprensible para el ciudadano sin sacrificar precisión → activo en EE.UU. (Plain Writing Act 2010), Reino Unido y varios países hispanohablantes → la claridad aumenta el acceso a la justicia/la traducción literal de términos jurídicos)"
        correctAnswer: el movimiento que aboga por reescribir los textos legales en un lenguaje comprensible para el ciudadano sin sacrificar precisión → activo en EE.UU. (Plain Writing Act 2010), Reino Unido y varios países hispanohablantes → la claridad aumenta el acceso a la justicia
        rationale: "El plain language movement tiene base en el principio democrático de que los ciudadanos deben poder entender las leyes que los gobiernan; la RAE ha promovido esfuerzos similares en España."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo funcionan los performativos jurídicos como actos de habla? (los jueces solo describen los hechos/los enunciados jurídicos performativos no describen una realidad sino que la crean → 'Os declaro marido y mujer', 'Lo condeno a cinco años', 'Os absuelvo' → su fuerza ilocutiva viene de la autoridad institucional del hablante, no del lenguaje en sí/los performativos son siempre preguntas)"
        correctAnswer: los enunciados jurídicos performativos no describen una realidad sino que la crean → 'Os declaro marido y mujer', 'Lo condeno a cinco años', 'Os absuelvo' → su fuerza ilocutiva viene de la autoridad institucional del hablante, no del lenguaje en sí
        rationale: "Austin ('Cómo hacer cosas con palabras') identificó los performativos en el lenguaje ordinario; el derecho es el dominio donde los performativos tienen el mayor peso institucional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué técnicas de análisis lingüístico se usan para evaluar la credibilidad de un testimonio? (el análisis del vocabulario pasivo/el análisis del lenguaje de los testigos: la presencia de detalles perceptivos sensoriales, el uso de marcadores de tiempo y lugar, las reparaciones (correcciones) espontáneas y la coherencia narrativa → los testimonios fabricados tienden a ser más genéricos y menos ricos en detalles sensoriales/el análisis de la velocidad del habla únicamente)"
        correctAnswer: el análisis del lenguaje de los testigos: la presencia de detalles perceptivos sensoriales, el uso de marcadores de tiempo y lugar, las reparaciones (correcciones) espontáneas y la coherencia narrativa → los testimonios fabricados tienden a ser más genéricos y menos ricos en detalles sensoriales
        rationale: "El Statement Validity Assessment (SVA) y el CBCA (Criteria-Based Content Analysis) son herramientas de la psicología forense que usan indicadores lingüísticos para evaluar la credibilidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los falsos amigos jurídicos en la traducción legal y por qué son peligrosos? (los errores de ortografía en contratos/términos que tienen formas similares en dos lenguas pero significados legales distintos → 'condena' en español es una sentencia penal; 'condena' en inglés (condone) significa perdonar → errores en contratos internacionales pueden tener consecuencias legales graves/términos que no existen en otras lenguas)"
        correctAnswer: términos que tienen formas similares en dos lenguas pero significados legales distintos → 'condena' en español es una sentencia penal; 'condone' en inglés significa perdonar → errores en contratos internacionales pueden tener consecuencias legales graves
        rationale: "Los falsos amigos jurídicos son especialmente peligrosos porque los sistemas jurídicos (common law vs. derecho civil) tienen conceptos sin equivalencia exacta que no pueden traducirse literalmente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo analiza el lingüista forense una amenaza para determinar si es 'real' (directs threat) o expresiva? (midiendo la longitud del mensaje/analizando indicadores de intención real: la especificidad del objetivo, el lugar y el método; la capacidad y oportunidad del autor; los patrones de escalada → la lingüística forense trabaja con la policía y los fiscales para evaluar el riesgo de amenazas en redes sociales/solo por el vocabulario agresivo)"
        correctAnswer: analizando indicadores de intención real: la especificidad del objetivo, el lugar y el método; la capacidad y oportunidad del autor; los patrones de escalada → la lingüística forense trabaja con la policía y los fiscales para evaluar el riesgo de amenazas en redes sociales
        rationale: "El análisis de amenazas (threat assessment) es una de las aplicaciones más demandadas de la lingüística forense en la era de las redes sociales; los lingüistas contribuyen al perfil del autor."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo afecta la reformulación de las preguntas del interrogatorio a los testimonios? (no afecta/las preguntas sugestivas (leading questions) pueden distorsionar el recuerdo: Loftus demostró que usar 'chocó' vs. 'rozó' cambia la estimación de velocidad del testigo → el interrogatorio jurídico es un acto de habla con enorme poder sobre la memoria/el interrogatorio es siempre objetivo)"
        correctAnswer: las preguntas sugestivas (leading questions) pueden distorsionar el recuerdo: Loftus demostró que usar 'chocó' vs. 'rozó' cambia la estimación de velocidad del testigo → el interrogatorio jurídico es un acto de habla con enorme poder sobre la memoria
        rationale: "Elizabeth Loftus (1974) mostró experimentalmente que el lenguaje de las preguntas influye en los recuerdos de los testigos; esto tiene consecuencias para las normas de interrogatorio en muchos sistemas judiciales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el discurso de odio (hate speech) y cuál es el desafío lingüístico para su regulación legal? (solo los insultos directos/el discurso que incita a la hostilidad, discriminación o violencia contra grupos por características protegidas (raza, religión, género, orientación sexual) → el desafío es la línea entre libertad de expresión y odio: el discurso indirecto, la ironía y la metáfora pueden transmitir odio sin términos explícitos → la lingüística forense ayuda a delimitar los casos/todo lenguaje negativo sobre grupos)"
        correctAnswer: el discurso que incita a la hostilidad, discriminación o violencia contra grupos por características protegidas (raza, religión, género, orientación sexual) → el desafío es la línea entre libertad de expresión y odio: el discurso indirecto, la ironía y la metáfora pueden transmitir odio sin términos explícitos → la lingüística forense ayuda a delimitar los casos
        rationale: "La regulación del discurso de odio requiere análisis lingüístico pragmático: el significado literal puede ser inofensivo mientras el sentido pragmático en contexto es incitador."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Lenguaje Jurídico y Traducción Legal
    exercises:
      - type: grammar
        question: "¿Qué es la intertextualidad jurídica y por qué es tan importante en los textos legales? (la creatividad jurídica/la propiedad de los textos legales de referirse constantemente a otros textos del sistema jurídico (leyes, sentencias, doctrina) → un contrato no puede entenderse sin las leyes que lo enmarcan; una sentencia interpreta una ley en el contexto de sentencias anteriores (precedente)/la originalidad de los textos jurídicos)"
        correctAnswer: la propiedad de los textos legales de referirse constantemente a otros textos del sistema jurídico (leyes, sentencias, doctrina) → un contrato no puede entenderse sin las leyes que lo enmarcan; una sentencia interpreta una ley en el contexto de sentencias anteriores (precedente)
        rationale: "El derecho es el dominio donde la intertextualidad es más explícita y estructural; todo acto jurídico se asienta sobre una cadena de textos previos que le dan validez."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia el sistema del common law del derecho civil en cuanto al uso del lenguaje jurídico? (el common law usa más latín/en el common law (Reino Unido, EE.UU.), el precedente judicial es fuente principal de derecho → las sentencias son textos extensos y argumentativos que crean derecho; en el derecho civil (España, Francia, Latinoamérica), el código escrito es la fuente principal → las sentencias aplican el código con menor creación de derecho nuevo/son idénticos)"
        correctAnswer: en el common law (Reino Unido, EE.UU.), el precedente judicial es fuente principal de derecho → las sentencias son textos extensos y argumentativos que crean derecho; en el derecho civil (España, Francia, Latinoamérica), el código escrito es la fuente principal → las sentencias aplican el código con menor creación de derecho nuevo
        rationale: "La distinción common law/derecho civil es crucial para la traducción jurídica: los conceptos de uno no tienen equivalencia exacta en el otro, lo que crea problemas de equivalencia funcional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la presupuición en el interrogatorio jurídico y por qué los abogados la usan? (una pregunta directa al testigo/las preguntas que asumen como dadas proposiciones no establecidas → '¿Con qué frecuencia consume usted drogas?' presupone que el testigo consume → las preguntas sugestivas con presuposición intentan introducir en el jurado una idea sin afirmarla directamente/la reformulación del testimonio)"
        correctAnswer: las preguntas que asumen como dadas proposiciones no establecidas → '¿Con qué frecuencia consume usted drogas?' presupone que el testigo consume → las preguntas sugestivas con presuposición intentan introducir en el jurado una idea sin afirmarla directamente
        rationale: "El uso de presuposiciones en el interrogatorio es una estrategia retórica estudiada; muchos sistemas judiciales prohíben las 'leading questions' durante el examen directo por este motivo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué herramientas computacionales usa la lingüística forense moderna para el análisis de textos? (solo diccionarios/la estilometría computacional (software como JGAAP o Stylo en R), el análisis de n-gramas, la identificación de autoría mediante redes neuronales, y el análisis de grandes corpus de comunicaciones digitales → el volumen de texto en casos modernos (emails, mensajes) hace necesaria la automatización/el análisis manual es suficiente)"
        correctAnswer: la estilometría computacional (software como JGAAP o Stylo en R), el análisis de n-gramas, la identificación de autoría mediante redes neuronales, y el análisis de grandes corpus de comunicaciones digitales → el volumen de texto en casos modernos (emails, mensajes) hace necesaria la automatización
        rationale: "La lingüística forense computacional es un campo emergente; el análisis de la autoría en correos electrónicos y mensajes de texto requiere herramientas de PNL y aprendizaje automático."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el problema de la equivalencia funcional en la traducción jurídica? (que no hay palabras técnicas/que los sistemas jurídicos tienen conceptos sin correspondiente exacto en otros sistemas → 'jury' (jurado anglosajón) no equivale exactamente al 'jurado' español; 'trust' (common law) no tiene equivalente en el derecho civil español → la traducción jurídica debe equilibrar la fidelidad al texto y la funcionalidad en el sistema de destino/que el vocabulario jurídico es muy técnico)"
        correctAnswer: que los sistemas jurídicos tienen conceptos sin correspondiente exacto en otros sistemas → 'jury' (jurado anglosajón) no equivale exactamente al 'jurado' español; 'trust' (common law) no tiene equivalente en el derecho civil español → la traducción jurídica debe equilibrar la fidelidad al texto y la funcionalidad en el sistema de destino
        rationale: "La equivalencia funcional (Nida) es el principio clave de la traducción jurídica; el traductor debe elegir entre la fidelidad formal y la comprensibilidad funcional en el sistema de destino."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo evalúa el análisis forense la autenticidad de una firma (firma electrónica o manuscrita)? (solo visualmente/combinando el análisis lingüístico (estilo del texto acompañante) con el análisis pericial caligráfico o los metadatos digitales → la lingüística forense examina si el estilo del texto firmado es coherente con el idiolecto del firmante o si hay rasgos de un autor distinto/midiendo la longitud de la firma)"
        correctAnswer: combinando el análisis lingüístico (estilo del texto acompañante) con el análisis pericial caligráfico o los metadatos digitales → la lingüística forense examina si el estilo del texto firmado es coherente con el idiolecto del firmante o si hay rasgos de un autor distinto
        rationale: "La autenticación de documentos es una de las aplicaciones clásicas de la lingüística forense; combina la estilometría con la grafología y la informática forense."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el código penal como texto y qué características lingüísticas lo definen? (un relato de crímenes famosos/un texto normativo que define conductas prohibidas y las penas correspondientes → sus características lingüísticas: la precisión (el uso de términos técnicos con definición exacta), la generalidad (regula clases de casos, no casos individuales), la impersonalidad (se dirige a todos) y la coercitividad (sus actos de habla son directivos con fuerza obligatoria)/un texto descriptivo de delitos)"
        correctAnswer: un texto normativo que define conductas prohibidas y las penas correspondientes → sus características lingüísticas: la precisión (el uso de términos técnicos con definición exacta), la generalidad (regula clases de casos, no casos individuales), la impersonalidad (se dirige a todos) y la coercitividad (sus actos de habla son directivos con fuerza obligatoria)
        rationale: "El análisis lingüístico de los textos normativos (leyes, reglamentos) es un campo propio; la precisión legal está en tensión con la accesibilidad del lenguaje claro."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué la ambigüedad lingüística es especialmente problemática en los textos jurídicos? (porque los jueces no entienden las palabras/porque la ambigüedad léxica o sintáctica en una ley puede dar lugar a interpretaciones radicalmente distintas → 'En caso de accidente grave o muerte, llame al número de emergencias' → ¿la 'o' es disyuntiva (solo si hay muerte, no solo si hay heridos graves) o inclusiva? → la lingüística jurídica analiza estas ambigüedades sistemáticamente/la ambigüedad es deseada en el derecho)"
        correctAnswer: porque la ambigüedad léxica o sintáctica en una ley puede dar lugar a interpretaciones radicalmente distintas → 'En caso de accidente grave o muerte, llame al número de emergencias' → ¿la 'o' es disyuntiva (solo si hay muerte, no solo si hay heridos graves) o inclusiva? → la lingüística jurídica analiza estas ambigüedades sistemáticamente
        rationale: "La interpretación legal es fundamentalmente lingüística; los tribunales constitucionales resuelven ambigüedades lingüísticas con efectos jurídicos enormes."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el análisis de colocaciones en el lenguaje jurídico y qué revela sobre el discurso legal? (un tipo de análisis gramatical/el estudio de qué palabras co-ocurren con términos jurídicos con más frecuencia de lo esperado → el análisis de corpus jurídicos revela: 'víctima' coocurre frecuentemente con 'inocente', 'acusado' con 'presunto' → la distribución colocacional revela los marcos cognitivos que el sistema jurídico construye para los participantes del proceso/la traducción de colocaciones)"
        correctAnswer: el estudio de qué palabras co-ocurren con términos jurídicos con más frecuencia de lo esperado → el análisis de corpus jurídicos revela: 'víctima' coocurre frecuentemente con 'inocente', 'acusado' con 'presunto' → la distribución colocacional revela los marcos cognitivos que el sistema jurídico construye para los participantes del proceso
        rationale: "El análisis de corpus del lenguaje jurídico (Coulthard, Johnson) usa herramientas de lingüística de corpus para describir sistemáticamente las propiedades del discurso legal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el papel del lingüista forense como perito en un juicio y qué limitaciones tiene su testimonio? (que puede determinar la culpabilidad/el lingüista puede aportar evidencia probabilística sobre la autoría, la autenticidad o el significado de textos → no puede afirmar con certeza absoluta que X escribió Y; presenta las similitudes y diferencias y evalúa su probabilidad → la decisión final es del juez o el jurado, no del perito lingüístico/que puede traducir cualquier texto con plena exactitud)"
        correctAnswer: el lingüista puede aportar evidencia probabilística sobre la autoría, la autenticidad o el significado de textos → no puede afirmar con certeza absoluta que X escribió Y; presenta las similitudes y diferencias y evalúa su probabilidad → la decisión final es del juez o el jurado, no del perito lingüístico
        rationale: "Las limitaciones del testimonio del perito lingüístico son importantes: la lingüística forense trabaja con probabilidades, no certezas absolutas; la jurisprudencia regula la admisibilidad de la evidencia lingüística."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
