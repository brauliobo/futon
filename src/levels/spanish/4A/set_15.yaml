title: Sentimientos y Emociones
level: 4A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Vocabulario de emociones básicas. Pensar primero en la situación que provoca la emoción."
example: "Cuando alguien ríe está → contento. Cuando llora está → triste."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Emociones Básicas
    description: Identifica la emoción según la situación.
    exercises:
      - type: vocab
        question: "Alguien ríe porque recibe un regalo (triste/contento/enfadado)"
        correctAnswer: contento
        rationale: "Un regalo inesperado causa alegría: está contento."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien llora porque perdió algo (contento/triste/sorprendido)"
        correctAnswer: triste
        rationale: "La pérdida causa tristeza."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien grita porque le rompieron un juguete (sorprendido/enfadado/contento)"
        correctAnswer: enfadado
        rationale: "La frustración con otros causa enfado."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien abre los ojos mucho al ver algo inesperado (enfadado/sorprendido/cansado)"
        correctAnswer: sorprendido
        rationale: "Lo inesperado provoca sorpresa."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien bosteza tras un día largo (contento/cansado/enfadado)"
        correctAnswer: cansado
        rationale: "Bostezar es señal de cansancio."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien tiembla al ver una serpiente (contento/asustado/cansado)"
        correctAnswer: asustado
        rationale: "Tener miedo es estar asustado."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien sonríe al ver a un amigo (enfadado/contento/cansado)"
        correctAnswer: contento
        rationale: "La sonrisa expresa alegría."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Sentimiento por esperar un regalo (enfadado/emocionado/cansado)"
        correctAnswer: emocionado
        rationale: "Anticipar algo bueno produce emoción."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien tiene ganas de comer (hambriento/sed/sorprendido)"
        correctAnswer: hambriento
        rationale: "Tener hambre significa estar hambriento."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien siente temor en la oscuridad (asustado/contento/cansado)"
        correctAnswer: asustado
        rationale: "La oscuridad puede causar miedo; está asustado."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Matices de las Emociones
    description: Identifica la emoción adecuada.
    exercises:
      - type: vocab
        question: "Alguien recuerda algo vergonzoso (avergonzado/contento/sorprendido)"
        correctAnswer: avergonzado
        rationale: "El recuerdo vergonzoso causa la sensación de estar avergonzado."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien pierde la paciencia esperando (enfadado/impaciente/feliz)"
        correctAnswer: impaciente
        rationale: "La espera larga provoca impaciencia."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien se siente solo sin amigos (triste/feliz/emocionado)"
        correctAnswer: triste
        rationale: "La soledad suele asociarse a tristeza."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien que ganó un premio está... (cansado/orgulloso/triste)"
        correctAnswer: orgulloso
        rationale: "Ganar un premio produce orgullo por el logro."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien agradecido por ayuda recibida está... (enfadado/agradecido/asustado)"
        correctAnswer: agradecido
        rationale: "Reconocer la ayuda se expresa con 'agradecido'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien que se siente muy bien, sin preocupaciones (preocupado/tranquilo/enfadado)"
        correctAnswer: tranquilo
        rationale: "Sin preocupaciones, la persona está tranquila."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien con dudas sobre un examen (tranquilo/preocupado/contento)"
        correctAnswer: preocupado
        rationale: "La incertidumbre causa preocupación."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien que extraña a un amigo lejano (indiferente/nostálgico/enfadado)"
        correctAnswer: nostálgico
        rationale: "Extrañar algo o alguien del pasado produce nostalgia."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien con muchos proyectos emocionantes (aburrido/entusiasmado/cansado)"
        correctAnswer: entusiasmado
        rationale: "Los proyectos ilusionantes producen entusiasmo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Alguien sin nada que hacer, poco interesado (entusiasmado/aburrido/contento)"
        correctAnswer: aburrido
        rationale: "La falta de estímulo produce aburrimiento."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
