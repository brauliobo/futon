title: 🔤 El Abecedario Completo
level: 4A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Reconocimiento del abecedario español completo (27 letras con la Ñ). Primero canta el abecedario mentalmente; luego responde."
example: "¿Cuántas letras tiene el abecedario español? → 27."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Posición de las Letras
    description: Identifica la posición de cada letra.
    exercises:
      - type: reading
        question: "Primera letra del abecedario (A/B/Z)"
        correctAnswer: A
        rationale: "La A es la primera letra del abecedario."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Última letra del abecedario (X/Y/Z)"
        correctAnswer: Z
        rationale: "La Z es la última letra del abecedario."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas letras tiene el abecedario español? (26/27/28)"
        correctAnswer: 27
        rationale: "El abecedario español tiene 27 letras (incluye la Ñ)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra exclusiva del español (Ñ/Ç/Œ)"
        correctAnswer: Ñ
        rationale: "La Ñ es una letra propia del español; no existe en inglés."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra antes de Z (W/X/Y)"
        correctAnswer: Y
        rationale: "Antes de Z viene Y en la secuencia X-Y-Z."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra en la mitad del abecedario (L/M/N)"
        correctAnswer: N
        rationale: "El abecedario tiene 27 letras; la 14ª (en medio) es la N."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra que sigue a la Ñ (M/N/O)"
        correctAnswer: O
        rationale: "Después de Ñ viene O."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra antes de la Ñ (M/N/O)"
        correctAnswer: N
        rationale: "Antes de Ñ viene N."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Tercera letra del abecedario (A/B/C)"
        correctAnswer: C
        rationale: "A (1ª), B (2ª), C (3ª)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Quinta letra del abecedario (D/E/F)"
        correctAnswer: E
        rationale: "A, B, C, D, E → E es la quinta."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Ordenación de Palabras
    description: Elige la palabra que va antes alfabéticamente.
    exercises:
      - type: reading
        question: "¿Cuál va antes? (árbol/casa)"
        correctAnswer: árbol
        rationale: "Primero compara la primera letra: A va antes que C."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál va antes? (pera/manzana)"
        correctAnswer: manzana
        rationale: "Compara primeras letras: M va antes que P."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál va antes? (sol/luna)"
        correctAnswer: luna
        rationale: "Compara: L va antes que S."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál va antes? (gato/perro)"
        correctAnswer: gato
        rationale: "Compara: G va antes que P."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál va antes? (silla/mesa)"
        correctAnswer: mesa
        rationale: "Compara: M va antes que S."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál va antes? (casa/cama)"
        correctAnswer: cama
        rationale: "Si las primeras letras son iguales (c), compara las segundas: 'a' vs 'a'. Pasa a la tercera: 'm' va antes que 's'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál va antes? (flor/fruta)"
        correctAnswer: flor
        rationale: "Primera letra igual (f). Segunda: 'l' va antes que 'r'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál va antes? (libro/lobo)"
        correctAnswer: libro
        rationale: "Primera letra igual (l). Segunda: 'i' va antes que 'o'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál va antes? (cielo/cena)"
        correctAnswer: cena
        rationale: "Primera letra igual (c). Segunda: 'e' va antes que 'i'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál va antes? (niño/niña)"
        correctAnswer: niña
        rationale: "Primeras tres letras iguales (n-i-ñ). Cuarta: 'a' va antes que 'o'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
