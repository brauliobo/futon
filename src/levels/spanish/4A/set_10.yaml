title: 📝 Posesivos - Mi, Tu, Su
level: 4A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Posesivos átonos: mi (de yo), tu (de tú), su (de él/ella/usted). Pensar primero de quién es lo que se menciona."
example: "Lo que pertenece a 'yo' → mi. Lo que pertenece a 'ella' → su."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Mi / Tu / Su Singular
    description: Elige el posesivo correcto.
    exercises:
      - type: grammar
        question: "'Este es ___ libro' (yo) (mi/tu/su)"
        correctAnswer: mi
        rationale: "'Mi' indica que pertenece a yo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Es este ___ coche?' (tú) (mi/tu/su)"
        correctAnswer: tu
        rationale: "'Tu' indica que pertenece a tú."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ana perdió ___ cartera' (ella) (mi/tu/su)"
        correctAnswer: su
        rationale: "'Su' indica que pertenece a ella."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Pedro ama a ___ madre' (él) (mi/tu/su)"
        correctAnswer: su
        rationale: "'Su' indica que pertenece a él."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ hermano es alto' (yo hablo de mi hermano) (mi/tu/su)"
        correctAnswer: mi
        rationale: "Si hablo yo de algo mío uso 'mi'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Dónde está ___ mochila?' (preguntando a tú) (mi/tu/su)"
        correctAnswer: tu
        rationale: "Dirigido a 'tú' → posesivo 'tu'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Julia y ___ perro' (de Julia) (mi/tu/su)"
        correctAnswer: su
        rationale: "De tercera persona → 'su'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Voy con ___ padre' (yo) (mi/tu/su)"
        correctAnswer: mi
        rationale: "'Mi' para lo que pertenece a yo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Habla con ___ profesora' (tú) (mi/tu/su)"
        correctAnswer: tu
        rationale: "Dirigido a tú → 'tu'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Carlos tiene ___ bicicleta nueva' (él) (mi/tu/su)"
        correctAnswer: su
        rationale: "De tercera persona → 'su'."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Posesivos en Plural
    description: Elige el posesivo en plural.
    exercises:
      - type: grammar
        question: "'Estos son ___ libros' (yo) (mis/tus/sus)"
        correctAnswer: mis
        rationale: "Con plural, 'mi' se convierte en 'mis'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Son ___ zapatos?' (tú) (mis/tus/sus)"
        correctAnswer: tus
        rationale: "Con plural, 'tu' se convierte en 'tus'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Marta cuida a ___ hijos' (ella) (mis/tus/sus)"
        correctAnswer: sus
        rationale: "Con plural, 'su' se convierte en 'sus'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vienen ___ amigos' (yo) (mis/tus/sus)"
        correctAnswer: mis
        rationale: "'Mis' es el plural de 'mi'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Perdiste ___ llaves' (tú) (mis/tus/sus)"
        correctAnswer: tus
        rationale: "'Tus' es el plural de 'tu'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos limpian ___ zapatos' (ellos) (mis/tus/sus)"
        correctAnswer: sus
        rationale: "Para 3ª persona plural también se usa 'sus'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo compro ___ camisetas' (yo) (mis/tus/sus)"
        correctAnswer: mis
        rationale: "'Mis' porque son camisetas que compro para mí."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Tomaste ___ vitaminas?' (tú) (mis/tus/sus)"
        correctAnswer: tus
        rationale: "Dirigido a tú con plural → 'tus'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los niños guardan ___ juguetes' (ellos) (mis/tus/sus)"
        correctAnswer: sus
        rationale: "3ª persona plural → 'sus'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ama a ___ padres' (ella) (mis/tus/sus)"
        correctAnswer: sus
        rationale: "3ª persona singular con plural → 'sus'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
