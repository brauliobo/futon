title: 🔢 Números - Escritura en Palabras (11-20)
level: 4A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Números del 11 al 20 escritos con letra. Los números 11-15 son palabras irregulares; 16-19 siguen la pauta 'dieci+unidad'. Pensar primero en la centena (diez+) antes de la unidad."
example: "11 se escribe → once. 16 se escribe → dieciséis."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Del 11 al 15
    description: Palabras irregulares.
    exercises:
      - type: spanish_vocab
        question: "11 se escribe (doce/diez/once)"
        correctAnswer: once
        rationale: "11 = once (irregular)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "12 se escribe (trece/once/doce)"
        correctAnswer: doce
        rationale: "12 = doce (irregular)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "13 se escribe (catorce/doce/trece)"
        correctAnswer: trece
        rationale: "13 = trece (irregular)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "14 se escribe (quince/trece/catorce)"
        correctAnswer: catorce
        rationale: "14 = catorce (irregular)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "15 se escribe (dieciséis/catorce/quince)"
        correctAnswer: quince
        rationale: "15 = quince (irregular)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Número después de 'diez' (nueve/once/doce)"
        correctAnswer: once
        rationale: "Después de 10 viene 11 = once."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Número antes de 'trece' (once/doce/catorce)"
        correctAnswer: doce
        rationale: "Antes de 13 viene 12 = doce."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Número entre 'trece' y 'quince' (doce/catorce/dieciséis)"
        correctAnswer: catorce
        rationale: "Entre 13 y 15 está 14 = catorce."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Mitad de 'treinta' (diez/quince/veinte)"
        correctAnswer: quince
        rationale: "La mitad de 30 es 15 = quince."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Docena = (10/11/12)"
        correctAnswer: 12
        rationale: "Una docena incluye 12 unidades: permite contar objetos en grupos de doce."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Del 16 al 20
    description: Palabras compuestas.
    exercises:
      - type: spanish_vocab
        question: "16 se escribe (quince/dieciséis/diecisiete)"
        correctAnswer: dieciséis
        rationale: "16 = dieciséis (dieci+seis)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "17 se escribe (dieciséis/diecisiete/dieciocho)"
        correctAnswer: diecisiete
        rationale: "17 = diecisiete (dieci+siete)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "18 se escribe (diecisiete/dieciocho/diecinueve)"
        correctAnswer: dieciocho
        rationale: "18 = dieciocho (dieci+ocho)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "19 se escribe (dieciocho/diecinueve/veinte)"
        correctAnswer: diecinueve
        rationale: "19 = diecinueve (dieci+nueve)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "20 se escribe (diecinueve/veinte/veintiuno)"
        correctAnswer: veinte
        rationale: "20 = veinte (nuevo grupo)."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Número después de 'quince' (catorce/dieciséis/diecisiete)"
        correctAnswer: dieciséis
        rationale: "Después de 15 viene 16 = dieciséis."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Número antes de 'veinte' (dieciocho/diecinueve/veintiuno)"
        correctAnswer: diecinueve
        rationale: "Antes de 20 viene 19 = diecinueve."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Doble de 'diez' (quince/veinte/veintidós)"
        correctAnswer: veinte
        rationale: "El doble de 10 es 20 = veinte."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Suma 10 + 6 en palabras (quince/dieciséis/diecisiete)"
        correctAnswer: dieciséis
        rationale: "10 + 6 = 16 = dieciséis."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Suma 10 + 9 en palabras (diecinueve/dieciocho/veinte)"
        correctAnswer: diecinueve
        rationale: "10 + 9 = 19 = diecinueve."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
