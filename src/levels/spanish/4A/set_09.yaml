title: 📝 Lectura Simple - Un Día en la Playa
level: 4A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Lectura narrativa de mayor extensión con varios personajes y eventos. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿A dónde fue la familia? → playa."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: El Cuento
    description: "Historia: En verano, la familia de Laura fue a la playa. Llevaron sombrilla, toallas y un cubo de plástico. Laura y su hermano Pepe hicieron un castillo de arena. Papá nadó en el mar con su bañador azul. Mamá leyó una novela bajo la sombrilla. Comieron bocadillos de queso y bebieron agua fría. Al atardecer, volvieron a casa cansados pero felices."
    exercises:
      - type: reading
        question: "¿Cuándo fueron a la playa? (primavera/verano/invierno)"
        correctAnswer: verano
        rationale: "El texto: 'En verano, la familia de Laura fue a la playa'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama la niña? (Lucía/Laura/Lola)"
        correctAnswer: Laura
        rationale: "El texto: 'la familia de Laura'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama el hermano? (Pedro/Pepe/Pablo)"
        correctAnswer: Pepe
        rationale: "El texto: 'su hermano Pepe'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué llevaron? (mantas y pan/sombrilla, toallas y cubo/silla y televisión)"
        correctAnswer: sombrilla, toallas y cubo
        rationale: "El texto: 'Llevaron sombrilla, toallas y un cubo de plástico'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hicieron Laura y Pepe? (pescaron/hicieron un castillo/jugaron al fútbol)"
        correctAnswer: hicieron un castillo
        rationale: "El texto: 'hicieron un castillo de arena'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué material es el cubo? (metal/plástico/madera)"
        correctAnswer: plástico
        rationale: "El texto: 'un cubo de plástico'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color era el bañador de papá? (rojo/verde/azul)"
        correctAnswer: azul
        rationale: "El texto: 'su bañador azul'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hizo mamá? (nadó/leyó/cocinó)"
        correctAnswer: leyó
        rationale: "El texto: 'Mamá leyó una novela'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué comieron? (pizza/bocadillos de queso/ensalada)"
        correctAnswer: bocadillos de queso
        rationale: "El texto: 'Comieron bocadillos de queso'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo volvieron a casa? (tristes/cansados pero felices/enfadados)"
        correctAnswer: cansados pero felices
        rationale: "El texto: 'volvieron a casa cansados pero felices'."
        difficulty: 1
        objectives: [es.pre_reading]
target: 10
