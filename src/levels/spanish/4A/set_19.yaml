title: 📝 Palabras Interrogativas - Qué, Quién, Dónde
level: 4A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Palabras para hacer preguntas: qué (cosa), quién (persona), dónde (lugar), cuándo (tiempo), cómo (manera), por qué (causa). Pensar primero qué tipo de información pido."
example: "Pregunto por un lugar → dónde. Pregunto por una persona → quién."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Elige la Palabra
    description: Elige la palabra interrogativa correcta.
    exercises:
      - type: grammar
        question: "'¿___ es tu nombre?' (qué/cómo/dónde)"
        correctAnswer: cómo
        rationale: "Preguntar por la manera de llamarse: '¿cómo te llamas?' o '¿cómo es tu nombre?'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ vives?' (cuándo/dónde/qué)"
        correctAnswer: dónde
        rationale: "Pregunto por el lugar de residencia → dónde."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ es ese niño?' (qué/cuándo/quién)"
        correctAnswer: quién
        rationale: "Pregunto por la identidad de una persona → quién."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ haces?' (qué/quién/cuándo)"
        correctAnswer: qué
        rationale: "Pregunto por la acción o cosa → qué."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ comes?' (dónde/cuándo/cómo)"
        correctAnswer: cuándo
        rationale: "Pregunto por el momento → cuándo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ está el libro?' (quién/dónde/qué)"
        correctAnswer: dónde
        rationale: "Pregunto por la ubicación → dónde."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ llora?' (buscando al que llora) (dónde/quién/qué)"
        correctAnswer: quién
        rationale: "Pregunto por la persona que realiza la acción → quién."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ es esto?' (señalando un objeto) (qué/cuándo/cómo)"
        correctAnswer: qué
        rationale: "Pregunto por el objeto → qué."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ estás?' (cómo/dónde/qué)"
        correctAnswer: cómo
        rationale: "Pregunto por el estado → cómo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ viene Juan?' (cuándo/por qué/quién)"
        correctAnswer: cuándo
        rationale: "Pregunto por el momento en que viene → cuándo."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Preguntas y Respuestas
    description: Elige la pregunta que corresponde a cada respuesta.
    exercises:
      - type: grammar
        question: "Respuesta 'En Madrid' ¿Qué pregunta? (dónde vives/cuándo vives/quién vive)"
        correctAnswer: dónde vives
        rationale: "'En Madrid' indica lugar; la pregunta es 'dónde vives'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Respuesta 'Un libro' ¿Qué pregunta? (dónde lees/qué lees/quién lee)"
        correctAnswer: qué lees
        rationale: "'Un libro' es la cosa leída; pregunta 'qué lees'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Respuesta 'Mi hermano' ¿Qué pregunta? (quién es ese/dónde es ese/qué es ese)"
        correctAnswer: quién es ese
        rationale: "'Mi hermano' identifica una persona; pregunta 'quién'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Respuesta 'Mañana' ¿Qué pregunta? (dónde vienes/quién viene/cuándo vienes)"
        correctAnswer: cuándo vienes
        rationale: "'Mañana' indica tiempo; pregunta 'cuándo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Respuesta 'Porque tengo hambre' ¿Qué pregunta? (cuándo comes/por qué comes/dónde comes)"
        correctAnswer: por qué comes
        rationale: "'Porque...' indica causa; pregunta 'por qué'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Respuesta 'Caminando' ¿Qué pregunta? (cuándo vas/cómo vas/dónde vas)"
        correctAnswer: cómo vas
        rationale: "'Caminando' indica manera; pregunta 'cómo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Respuesta 'En la cocina' ¿Qué pregunta? (quién está ahí/qué está ahí/dónde está)"
        correctAnswer: dónde está
        rationale: "'En la cocina' indica lugar; pregunta 'dónde'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Respuesta 'Agua' ¿Qué pregunta? (quién bebes/qué bebes/cuándo bebes)"
        correctAnswer: qué bebes
        rationale: "'Agua' es la cosa bebida; pregunta 'qué'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Respuesta 'A las ocho' ¿Qué pregunta? (dónde llegas/cuándo llegas/quién llega)"
        correctAnswer: cuándo llegas
        rationale: "'A las ocho' indica hora; pregunta 'cuándo'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: grammar
        question: "Respuesta 'Laura' ¿Qué pregunta? (qué te llamas/cómo te llamas/dónde te llamas)"
        correctAnswer: cómo te llamas
        rationale: "'Laura' es el nombre; se pregunta 'cómo te llamas'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
