title: 📝 Medios de Transporte
level: 4A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Vocabulario de medios de transporte terrestre, marítimo y aéreo. Pensar primero en el lugar por donde se mueve."
example: "Se desplaza por el aire → avión. Se desplaza por el agua → barco."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Terrestre
    description: Identifica el transporte terrestre.
    exercises:
      - type: spanish_vocab
        question: "Tiene cuatro ruedas y motor (avión/barco/coche)"
        correctAnswer: coche
        rationale: "El coche es un vehículo terrestre con cuatro ruedas y motor."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Tiene dos ruedas y se pedalea (coche/moto/bicicleta)"
        correctAnswer: bicicleta
        rationale: "La bicicleta tiene dos ruedas y es impulsada por pedales."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Dos ruedas pero con motor (bicicleta/moto/coche)"
        correctAnswer: moto
        rationale: "Define: moto (motocicleta) = vehículo de motor con dos ruedas para una o dos personas."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Transporte público con muchos pasajeros y ruedas (bicicleta/autobús/moto)"
        correctAnswer: autobús
        rationale: "El autobús transporta muchas personas por la ciudad."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Circula por raíles (tren/coche/moto)"
        correctAnswer: tren
        rationale: "El tren va sobre vías (raíles)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Circula por raíles en la ciudad (metro/avión/barco)"
        correctAnswer: metro
        rationale: "El metro va bajo tierra o elevado en la ciudad sobre raíles."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Tira de una carga pesada con tren (vagón/furgoneta/locomotora)"
        correctAnswer: locomotora
        rationale: "La locomotora es la máquina que tira de los vagones del tren."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Lleva pasajeros y lo llamas por teléfono (taxi/avión/barco)"
        correctAnswer: taxi
        rationale: "El taxi lleva pasajeros; es un coche de alquiler con conductor."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Lleva muchas mercancías por carretera (coche/camión/bicicleta)"
        correctAnswer: camión
        rationale: "El camión transporta grandes cargas por carretera."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Tirado por caballos en el pasado (coche/carruaje/moto)"
        correctAnswer: carruaje
        rationale: "Define: carruaje = vehículo histórico de tracción animal, tirado por caballos, anterior al automóvil."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Marítimo y Aéreo
    description: Identifica el transporte por agua o aire.
    exercises:
      - type: spanish_vocab
        question: "Se desplaza por el agua (avión/barco/coche)"
        correctAnswer: barco
        rationale: "Define: barco = vehículo de transporte que navega por agua, sea de remo, vela o motor."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Barco pequeño a remo (lancha/bote/barco grande)"
        correctAnswer: bote
        rationale: "El bote es una embarcación pequeña a remo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Barco con velas que usa el viento (lancha/velero/crucero)"
        correctAnswer: velero
        rationale: "Define: velero = barco que navega impulsado por el viento captado en sus velas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Navega bajo el agua (velero/submarino/crucero)"
        correctAnswer: submarino
        rationale: "El submarino se desplaza bajo la superficie del agua."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Vuela con alas y motor (coche/avión/tren)"
        correctAnswer: avión
        rationale: "El avión es el principal transporte aéreo con alas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Vuela con hélices que giran (avión/helicóptero/cohete)"
        correctAnswer: helicóptero
        rationale: "Define: helicóptero = aeronave que vuela mediante hélices rotatorias (rotor) sobre la cabina."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Va al espacio (avión/cohete/helicóptero)"
        correctAnswer: cohete
        rationale: "El cohete se usa para viajes espaciales."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Globo que vuela con aire caliente (globo/avión/submarino)"
        correctAnswer: globo
        rationale: "El globo aerostático se eleva con aire caliente."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Lugar donde despegan aviones (puerto/aeropuerto/estación)"
        correctAnswer: aeropuerto
        rationale: "Regla: los aviones operan en aeropuertos — despegue (subir al aire) y aterrizaje (bajar al suelo)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Lugar donde atracan los barcos (estación/puerto/aeropuerto)"
        correctAnswer: puerto
        rationale: "Regla: los barcos atracan (se detienen) en puertos — instalaciones marítimas equipadas para carga y embarque."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
