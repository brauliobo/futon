title: Revisión General 4A
level: 4A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Repaso integral de 4A: abecedario, dígrafos, días, meses, estaciones, hora, posesivos, profesiones, emociones e interrogativas. Pensar primero en qué tipo de pregunta es."
example: "Repasa lo aprendido. Ej.: Día después de 'martes' → miércoles."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Fonética, Calendario y Hora
    description: Repaso mezclado del área lingüística y temporal.
    exercises:
      - type: reading
        question: "Letra exclusiva del español (Ç/Ñ/Œ)"
        correctAnswer: Ñ
        rationale: "La Ñ distingue el español de otras lenguas: es su letra exclusiva."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe? (perro/pero = animal)"
        correctAnswer: perro
        rationale: "Animal = 'perro' con RR por sonido fuerte entre vocales."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spelling
        question: "¿Cómo se escribe? (lluvia/luvia)"
        correctAnswer: lluvia
        rationale: "Con dígrafo LL."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Día después de 'martes' (lunes/miércoles/jueves)"
        correctAnswer: miércoles
        rationale: "Tras martes viene miércoles."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Mes después de 'mayo' (abril/junio/julio)"
        correctAnswer: junio
        rationale: "Tras mayo viene junio."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Estación del frío (verano/invierno/primavera)"
        correctAnswer: invierno
        rationale: "El invierno es la estación más fría."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "3:00 se dice (son las tres/es las tres/son la tres)"
        correctAnswer: son las tres
        rationale: "De 2 a 12: plural."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "1:30 se dice (son la una y media/es la una y media/son las una media)"
        correctAnswer: es la una y media
        rationale: "La una usa singular con 'y media'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "16 se escribe (dieciséis/dieciseis/diez seis)"
        correctAnswer: dieciséis
        rationale: "'Dieciséis' con tilde en la e final."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Primer mes del año (enero/marzo/diciembre)"
        correctAnswer: enero
        rationale: "El año empieza en enero."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Gramática y Vocabulario Temático
    description: Repaso mezclado de gramática y vocabulario.
    exercises:
      - type: grammar
        question: "'Este es ___ libro' (yo) (mi/tu/su)"
        correctAnswer: mi
        rationale: "'Mi' para lo que me pertenece."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos tienen ___ juguetes' (ellos) (mis/tus/sus)"
        correctAnswer: sus
        rationale: "3ª persona plural → 'sus'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ está mi mochila?' (qué/dónde/quién)"
        correctAnswer: dónde
        rationale: "Pregunto por ubicación → dónde."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Cuida enfermos (maestro/médico/pintor)"
        correctAnswer: médico
        rationale: "El médico atiende enfermos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Habitación para dormir (cocina/salón/dormitorio)"
        correctAnswer: dormitorio
        rationale: "El dormitorio es donde se duerme."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Transporte que vuela (avión/barco/coche)"
        correctAnswer: avión
        rationale: "El avión vuela por el aire."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Cría de la vaca (potro/ternero/cordero)"
        correctAnswer: ternero
        rationale: "El ternero es la cría de la vaca."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Saludo al acostarse (buenos días/buenas noches/hola)"
        correctAnswer: buenas noches
        rationale: '"Buenas noches" indica el saludo nocturno: se usa al acostarse.'
        difficulty: 2
        objectives: [es.pre_reading]
      - type: vocab
        question: "Emoción al recibir un regalo (triste/contento/enfadado)"
        correctAnswer: contento
        rationale: "Un regalo produce alegría."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Verbo para ir hacia arriba (bajar/subir/entrar)"
        correctAnswer: subir
        rationale: "'Subir' es movimiento hacia arriba."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
