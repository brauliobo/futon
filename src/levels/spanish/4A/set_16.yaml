title: 📝 Lectura Simple - Un Día en el Campo
level: 4A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Lectura narrativa con vocabulario rural. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿A dónde fueron? → campo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 28
pages:
  - pageNumber: 1
    title: El Cuento
    description: "Historia: El domingo, la familia de Andrés fue al campo. Llegaron en coche por un camino estrecho. Vieron muchas vacas pastando en el prado y un caballo blanco. El abuelo tiene una casa con un huerto. Cogieron tomates y lechugas. Después comieron bajo una higuera. Volvieron a la ciudad al anochecer con cestas llenas de verduras."
    exercises:
      - type: reading
        question: "¿Qué día fueron? (sábado/domingo/lunes)"
        correctAnswer: domingo
        rationale: "El texto: 'El domingo, la familia...'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama el niño? (Antonio/Andrés/Álvaro)"
        correctAnswer: Andrés
        rationale: "El texto: 'la familia de Andrés'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A dónde fueron? (playa/campo/montaña)"
        correctAnswer: campo
        rationale: "El texto: 'fue al campo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo llegaron? (tren/coche/bicicleta)"
        correctAnswer: coche
        rationale: "El texto: 'Llegaron en coche'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué animales vieron primero? (ovejas/vacas/cerdos)"
        correctAnswer: vacas
        rationale: "El texto: 'Vieron muchas vacas pastando'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color era el caballo? (negro/marrón/blanco)"
        correctAnswer: blanco
        rationale: "El texto: 'un caballo blanco'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién tiene una casa en el campo? (padre/tío/abuelo)"
        correctAnswer: abuelo
        rationale: "El texto: 'El abuelo tiene una casa'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué verduras cogieron? (peras y uvas/tomates y lechugas/patatas)"
        correctAnswer: tomates y lechugas
        rationale: "El texto: 'Cogieron tomates y lechugas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Bajo qué árbol comieron? (manzano/olivo/higuera)"
        correctAnswer: higuera
        rationale: "El texto: 'comieron bajo una higuera'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo volvieron? (mediodía/tarde/anochecer)"
        correctAnswer: anochecer
        rationale: "El texto: 'Volvieron a la ciudad al anochecer'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
