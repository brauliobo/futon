title: 📝 Partes de la Casa
level: 4A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Habitaciones y espacios de una casa. Pensar primero en la actividad que se hace en cada habitación."
example: "Habitación para cocinar → cocina. Habitación para dormir → dormitorio."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Habitaciones Principales
    description: Identifica la habitación por su función.
    exercises:
      - type: spanish_vocab
        question: "Habitación para cocinar (baño/cocina/salón)"
        correctAnswer: cocina
        rationale: "En la cocina se preparan los alimentos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Habitación para dormir (dormitorio/cocina/baño)"
        correctAnswer: dormitorio
        rationale: "El dormitorio es el lugar donde se duerme."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Habitación para ducharse (dormitorio/baño/salón)"
        correctAnswer: baño
        rationale: "El baño es la habitación para ducharse; contiene ducha, lavabo e inodoro."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Habitación para ver la tele (cocina/baño/salón)"
        correctAnswer: salón
        rationale: "El salón suele tener el sofá y la televisión."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Habitación para comer en familia (comedor/baño/dormitorio)"
        correctAnswer: comedor
        rationale: "El comedor es la habitación con mesa grande para las comidas."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Entrada principal de la casa (baño/puerta/ventana)"
        correctAnswer: puerta
        rationale: "La puerta es la entrada; la ventana deja pasar la luz."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Abertura para que entre luz (puerta/ventana/techo)"
        correctAnswer: ventana
        rationale: "La ventana deja pasar la luz y el aire."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Parte superior interior de una habitación (suelo/techo/pared)"
        correctAnswer: techo
        rationale: "El techo es la parte superior de una habitación; arriba techo, abajo suelo, a los lados paredes."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Parte de abajo donde pisamos (techo/suelo/pared)"
        correctAnswer: suelo
        rationale: "El suelo es la superficie sobre la que caminamos."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Laterales verticales de una habitación (techo/pared/suelo)"
        correctAnswer: pared
        rationale: "Las paredes separan las habitaciones verticalmente."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Otros Espacios
    description: Identifica el espacio exterior o auxiliar.
    exercises:
      - type: spanish_vocab
        question: "Espacio exterior con plantas (jardín/cocina/baño)"
        correctAnswer: jardín
        rationale: "El jardín es un espacio exterior con plantas y flores."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Lugar para guardar el coche (dormitorio/garaje/salón)"
        correctAnswer: garaje
        rationale: "El garaje es donde se aparca y guarda el coche."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Subir para llegar al piso de arriba (ventana/escaleras/puerta)"
        correctAnswer: escaleras
        rationale: "Las escaleras conectan pisos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Espacio abierto al aire, con suelo propio (escalera/balcón/techo)"
        correctAnswer: balcón
        rationale: "El balcón es una pequeña terraza exterior."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Cuarto para guardar cosas (despensa/cocina/salón)"
        correctAnswer: despensa
        rationale: "La despensa almacena alimentos y utensilios."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Entrada inmediata al abrir la puerta (cocina/vestíbulo/baño)"
        correctAnswer: vestíbulo
        rationale: "El vestíbulo es el espacio inicial justo tras la puerta de entrada."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Techo exterior de la casa (tejado/suelo/pared)"
        correctAnswer: tejado
        rationale: "El tejado es la cubierta exterior superior de la casa."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Pasillo entre habitaciones (salón/corredor/jardín)"
        correctAnswer: corredor
        rationale: "El corredor (o pasillo) conecta las habitaciones."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Subterráneo de la casa (ático/sótano/balcón)"
        correctAnswer: sótano
        rationale: "El sótano es el espacio subterráneo bajo la planta baja de la casa."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Habitación bajo el tejado (sótano/ático/vestíbulo)"
        correctAnswer: ático
        rationale: "El ático es la habitación más alta, justo bajo el tejado."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
