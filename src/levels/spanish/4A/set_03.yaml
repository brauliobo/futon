    title: Secuencia de los Días
    description: Elige el día que corresponde.
    exercises:
      - type: spanish_vocab
        question: "Día después de 'lunes' (martes/miércoles/jueves)"
        correctAnswer: martes
        rationale: "Regla del calendario: en la secuencia semanal lunes → martes → miércoles, tras lunes viene martes."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Día después de 'martes' (lunes/miércoles/jueves)"
        correctAnswer: miércoles
        rationale: "Tras martes viene miércoles."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Día después de 'miércoles' (martes/jueves/viernes)"
