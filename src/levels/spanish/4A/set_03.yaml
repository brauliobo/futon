title: 📅 Los Días de la Semana
level: 4A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Los siete días de la semana en orden: lunes, martes, miércoles, jueves, viernes, sábado, domingo. Pensar primero en la secuencia."
example: "Día después de 'lunes' → martes. Primer día de la semana laboral → lunes."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
