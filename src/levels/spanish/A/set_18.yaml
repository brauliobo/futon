title: Gramática - Sujeto y Predicado
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Oración = sujeto + predicado. Sujeto: de quién se habla (sustantivo, pronombre, grupo nominal); puede estar implícito. Predicado: lo que se dice del sujeto; siempre lleva verbo. Núcleo del sujeto (NS) = sustantivo o pronombre. Núcleo del predicado (NP) = verbo. Predicado nominal (PN): ser/estar + atributo. Predicado verbal (PV): verbo de acción."
example: "Los niños [sujeto] juegan en el parque [predicado]. NS = niños. NP = juegan."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Identificar Sujeto y Predicado
    description: Identifica el sujeto o el predicado.
    exercises:
      - type: grammar
        question: "'Los pájaros cantan en el árbol.' ¿Cuál es el sujeto? (cantan en el árbol/los pájaros/en el árbol)"
        correctAnswer: los pájaros
        rationale: "El sujeto es de quién se habla: los pájaros."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'María estudia mucho.' ¿Cuál es el predicado? (María/estudia mucho/María estudia)"
        correctAnswer: estudia mucho
        rationale: "El predicado es lo que se dice del sujeto: estudia mucho."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El perro de mi vecino ladra por las noches.' Núcleo del sujeto (NS): (vecino/perro/noches)"
        correctAnswer: perro
        rationale: "NS = sustantivo principal del sujeto: perro."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Corre muy rápido.' ¿Cuál es el sujeto? (corre/muy rápido/sujeto omitido)"
        correctAnswer: sujeto omitido
        rationale: "El verbo 'corre' = 3ª sing.; sujeto tácito (él/ella)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La casa blanca es muy bonita.' NS: (casa/blanca/bonita)"
        correctAnswer: casa
        rationale: "Núcleo del sujeto = sustantivo principal: casa."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mis amigos y yo llegamos tarde.' ¿Cuál es el núcleo del predicado (NP)? (amigos/yo/llegamos)"
        correctAnswer: llegamos
        rationale: "NP = verbo: llegamos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El sol brilla.' ¿Cuál es el predicado? (el sol/brilla/el sol brilla)"
        correctAnswer: brilla
        rationale: "Predicado = lo que se dice del sujeto: brilla."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Las flores del jardín huelen muy bien.' ¿Cuál es el sujeto? (las flores del jardín/huelen muy bien/del jardín)"
        correctAnswer: las flores del jardín
        rationale: "Sujeto = grupo nominal completo: las flores del jardín."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los alumnos de tercero aprobaron el examen.' NS: (alumnos/tercero/examen)"
        correctAnswer: alumnos
        rationale: "NS = sustantivo principal del grupo nominal sujeto: alumnos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Duermes bien?' Sujeto: (duermes/bien/sujeto implícito tú)"
        correctAnswer: sujeto implícito tú
        rationale: "La desinencia '-es' indica tú; el sujeto está omitido."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Predicado Nominal y Verbal
    description: Identifica el tipo de predicado.
    exercises:
      - type: grammar
        question: "'La casa es grande.' ¿Tipo de predicado? (verbal/nominal)"
        correctAnswer: nominal
        rationale: "Ser + atributo (grande) → predicado nominal."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los niños corren en el patio.' ¿Tipo de predicado? (verbal/nominal)"
        correctAnswer: verbal
        rationale: "Verbo de acción (corren) sin ser/estar atributivo → predicado verbal."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella está cansada.' ¿Tipo de predicado? (verbal/nominal)"
        correctAnswer: nominal
        rationale: "Estar + atributo (cansada) → predicado nominal."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi padre trabaja en un banco.' ¿Tipo de predicado? (verbal/nominal)"
        correctAnswer: verbal
        rationale: "Verbo de acción (trabaja) → predicado verbal."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué lleva siempre el predicado? (un sustantivo/un verbo/un adjetivo)"
        correctAnswer: un verbo
        rationale: "El predicado siempre tiene un verbo como núcleo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede faltar el sujeto en español? (no, siempre es obligatorio/sí, puede ser implícito/solo en preguntas)"
        correctAnswer: sí, puede ser implícito
        rationale: "El español es pro-drop: el sujeto puede estar omitido (sujeto tácito)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "En 'Llueve mucho hoy', ¿cuál es el sujeto? (lluvia/el tiempo/no tiene sujeto)"
        correctAnswer: no tiene sujeto
        rationale: "Los verbos meteorológicos (llover, nevar) son impersonales: no tienen sujeto."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El médico recetó antibióticos.' ¿Cuál es el predicado completo? (el médico/recetó antibióticos/antibióticos)"
        correctAnswer: recetó antibióticos
        rationale: "Predicado = todo excepto el sujeto: recetó antibióticos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el atributo en 'La película es aburrida'? (la película/es/aburrida)"
        correctAnswer: aburrida
        rationale: "El atributo del predicado nominal: aburrida (adjetivo que se predica del sujeto)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración con sujeto explícito: (Canto bien./Yo canto bien./Canté ayer.)"
        correctAnswer: Yo canto bien.
        rationale: "'Yo' es el pronombre sujeto explícito."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
