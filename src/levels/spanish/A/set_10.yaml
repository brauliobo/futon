title: ✏️ Gramática - Verbos en Presente de Indicativo
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Presente de indicativo: acción actual, habitual o verdad general. -AR: -o/-as/-a/-amos/-áis/-an. -ER: -o/-es/-e/-emos/-éis/-en. -IR: -o/-es/-e/-imos/-ís/-en. Irregulares frecuentes: ser, estar, tener, ir, hacer, decir, venir, salir, poder, querer."
example: "hablar → hablo/hablas/habla. comer → como/comes/come. vivir → vivo/vives/vive. ir → voy/vas/va."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Verbos Regulares
    description: Elige la forma correcta del presente de indicativo.
    exercises:
      - type: grammar
        question: "'Yo ___ en Madrid' (vivir) (vivo/vives/vive)"
        correctAnswer: vivo
        rationale: "Presente 1ª sing. de 'vivir': vivo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ mucho' (estudiar) (estudia/estudias/estudian)"
        correctAnswer: estudias
        rationale: "Presente 2ª sing. de 'estudiar': estudias."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ un libro' (leer) (leo/lee/lees)"
        correctAnswer: lee
        rationale: "Presente 3ª sing. de 'leer': lee."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ español' (hablar) (hablo/hablan/hablamos)"
        correctAnswer: hablamos
        rationale: "Presente 1ª pl. de 'hablar': hablamos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vosotros ___ demasiado' (comer) (coméis/comemos/comen)"
        correctAnswer: coméis
        rationale: "Presente 2ª pl. de 'comer': coméis."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ cada mañana' (correr) (corren/corremos/corro)"
        correctAnswer: corren
        rationale: "Presente 3ª pl. de 'correr': corren."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ café por las mañanas' (beber) (bebe/bebes/bebo)"
        correctAnswer: bebo
        rationale: "Presente 1ª sing. de 'beber': bebo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Tú ___ bien?' (escribir) (escribo/escribes/escribe)"
        correctAnswer: escribes
        rationale: "Presente 2ª sing. de 'escribir': escribes."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los pájaros ___ por la mañana' (cantar) (canta/cantan/cantamos)"
        correctAnswer: cantan
        rationale: "Presente 3ª pl. de 'cantar': cantan."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ a las ocho' (cenar) (cenan/cenamos/cenáis)"
        correctAnswer: cenamos
        rationale: "Presente 1ª pl. de 'cenar': cenamos."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Verbos Irregulares Frecuentes
    description: Elige la forma irregular correcta del presente.
    exercises:
      - type: grammar
        question: "'Yo ___ al colegio' (ir) (voy/vamos/vas)"
        correctAnswer: voy
        rationale: "Presente irreg. 1ª sing. de 'ir': voy."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ en casa' (estar) (está/es/estoy)"
        correctAnswer: está
        rationale: "Presente 3ª sing. de 'estar': está."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Tú ___ hermanos?' (tener) (tienes/tiene/tenéis)"
        correctAnswer: tienes
        rationale: "Presente 2ª sing. de 'tener': tienes."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ mucho ejercicio' (hacer) (hacemos/hago/hacéis)"
        correctAnswer: hacemos
        rationale: "Presente 1ª pl. de 'hacer': hacemos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Qué ___ tú siempre?' (decir) (dices/dice/decís)"
        correctAnswer: dices
        rationale: "Presente 2ª sing. de 'decir': dices."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ a las nueve' (salir) (salgo/salen/salís)"
        correctAnswer: salen
        rationale: "Presente 3ª pl. de 'salir': salen."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ a tu casa mañana' (venir) (vienes/vengo/viene)"
        correctAnswer: vengo
        rationale: "Presente 1ª sing. de 'venir': vengo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Vosotros ___ nadar?' (poder) (podéis/pueden/podemos)"
        correctAnswer: podéis
        rationale: "Presente 2ª pl. de 'poder': podéis."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ ser escritora' (querer) (quiero/quiere/quieres)"
        correctAnswer: quiere
        rationale: "Presente 3ª sing. de 'querer': quiere."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ profesor de español' (ser) (soy/es/eres)"
        correctAnswer: soy
        rationale: "Presente 1ª sing. de 'ser': soy."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
