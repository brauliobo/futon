title: Revisión General A
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Repaso integrado de todos los contenidos del nivel A: tipos de oraciones, singular/plural, género, artículos, verbos en presente, adjetivos, pronombres, preposiciones, sujeto/predicado, comprensión lectora."
example: "gramática → identifica el concepto pedido (sujeto/predicado/adjetivo) → aplica la regla; lectura → lee el texto → localiza la respuesta en el orden del texto → responde con lo que dice el texto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Repaso Gramatical
    description: Elige la opción correcta en cada caso.
    exercises:
      - type: grammar
        question: "'¡Qué día tan bonito!' ¿Tipo de oración? (declarativa/exclamativa/interrogativa)"
        correctAnswer: exclamativa
        rationale: "Lleva ¡! y expresa emoción → exclamativa."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Plural de 'luz': (luzs/luces/luzes)"
        correctAnswer: luces
        rationale: "-z → -ces: luces."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Artículo correcto: '___ agua' (la/el/un)"
        correctAnswer: el
        rationale: "Femenino de -a tónica → el: el agua."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Femenino de 'rey': (reya/reina/reine)"
        correctAnswer: reina
        rationale: "Rey → reina (irregular)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ en el centro' (vivir) (vive/vivo/vives)"
        correctAnswer: vivo
        rationale: "Presente 1ª sing.: vivo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Una ciudad ___' (hermoso/hermosa/hermosas)"
        correctAnswer: hermosa
        rationale: "Ciudad (fem. sing.) → hermosa."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ vimos en el teatro' (a ellos) (Los/Les/Le)"
        correctAnswer: Los
        rationale: "CD masc. pl. → los."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Fui al cine' → 'a + el' → (a el/al/del)"
        correctAnswer: al
        rationale: "Contracción a + el = al."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los pájaros cantan.' NS: (cantan/pájaros/los)"
        correctAnswer: pájaros
        rationale: "Núcleo del sujeto = sustantivo principal: pájaros."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La casa es grande.' Tipo de predicado: (verbal/nominal)"
        correctAnswer: nominal
        rationale: "Ser + atributo → predicado nominal."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Repaso de Comprensión
    description: Preguntas integradas de gramática y comprensión.
    exercises:
      - type: grammar
        question: "¿Qué preposición indica finalidad? (por/para/con)"
        correctAnswer: para
        rationale: "'Para' indica fin/objetivo: estudio para aprender."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Plural correcto de 'joven': (jovenes/jóvenes/jovens)"
        correctAnswer: jóvenes
        rationale: "Joven → jóvenes (acento diacrítico en plural esdrújulo)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué artículo indica que ya conocemos el sustantivo? (un/una/el)"
        correctAnswer: el
        rationale: "Determinado (el/la/los/las) → referente conocido."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo de 'bueno': (el más bueno/buenísimo/muy buen)"
        correctAnswer: buenísimo
        rationale: "Superlativo absoluto irregular: buenísimo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ muy inteligente' (ser) (es/está/era)"
        correctAnswer: es
        rationale: "Característica permanente → ser: es muy inteligente."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué verbos forman predicado nominal? (verbos de acción/ser y estar atributivos/verbos reflexivos)"
        correctAnswer: ser y estar atributivos
        rationale: "Predicado nominal = ser/estar + atributo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ven aquí ahora mismo.' Tipo de oración: (declarativa/interrogativa/imperativa)"
        correctAnswer: imperativa
        rationale: "Orden → imperativa."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo usamos artículo indeterminado? (segunda mención/referente conocido/primera mención o referente desconocido)"
        correctAnswer: primera mención o referente desconocido
        rationale: "Indeterminado (un/una) → nueva o no específica."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los niños son felices.' Concuerda con: (feliz/felices/felizes)"
        correctAnswer: felices
        rationale: "Niños (masc. pl.) + feliz → plural: felices."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Puede ser implícito el sujeto en español? (no/sí, por la desinencia verbal/solo en imperativo)"
        correctAnswer: sí, por la desinencia verbal
        rationale: "La desinencia del verbo indica la persona → sujeto tácito posible."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
