title: 📚 Lectura - La Cocina
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Texto instructivo/descriptivo sobre la cocina. Vocabulario culinario y de utensilios. Identificar pasos, materiales y secuencias. Inferir propósito de acciones."
example: "Lee el texto → identifica qué hay en la cocina → qué hace cada persona → sigue el orden: primero/después/luego/por último. Las respuestas están en el texto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Esta tarde, mamá me enseñó a hacer una ensalada. Primero lavamos las verduras bajo el grifo: lechuga, tomates cherry y pepino. Después yo corté el pepino en rodajas finas con un cuchillo pequeño mientras mamá troceaba los tomates. Pusimos todo en un bol grande de cristal. Mamá añadió aceitunas negras y queso en dados pequeños. Para el aliño, mezclamos aceite de oliva, vinagre y una pizca de sal en un frasco con tapa y lo agitamos bien. Por último, vertimos el aliño sobre la ensalada y la removimos con dos cucharas grandes. Mamá dijo que la cocina es divertida si aprendes con calma. Yo estoy de acuerdo: ¡me encantó!"
    exercises:
      - type: reading
        question: "¿Qué aprendió a hacer el narrador? (un pastel/una sopa/una ensalada)"
        correctAnswer: una ensalada
        rationale: "El texto: 'enseñó a hacer una ensalada'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué verdura NO se menciona? (pepino/lechuga/espinacas)"
        correctAnswer: espinacas
        rationale: "El texto menciona lechuga, tomates cherry y pepino, no espinacas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con qué cortó el narrador el pepino? (con un pelador/con un cuchillo pequeño/con unas tijeras)"
        correctAnswer: con un cuchillo pequeño
        rationale: "El texto: 'corté el pepino en rodajas finas con un cuchillo pequeño'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué tipo de bol pusieron todo? (de plástico/de cristal/de madera)"
        correctAnswer: de cristal
        rationale: "El texto: 'en un bol grande de cristal'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tipo de aceitunas añadió mamá? (verdes/rellenas/negras)"
        correctAnswer: negras
        rationale: "El texto: 'aceitunas negras'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué lleva el aliño? (solo aceite/aceite, vinagre y sal/aceite y limón)"
        correctAnswer: aceite, vinagre y sal
        rationale: "El texto: 'aceite de oliva, vinagre y una pizca de sal'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo prepararon el aliño? (batiéndolo con tenedor/en un frasco agitándolo/en un cazo calentándolo)"
        correctAnswer: en un frasco agitándolo
        rationale: "El texto: 'en un frasco con tapa y lo agitamos bien'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con qué removieron la ensalada? (con las manos/con una cuchara grande/con dos cucharas grandes)"
        correctAnswer: con dos cucharas grandes
        rationale: "El texto: 'la removimos con dos cucharas grandes'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué dijo mamá sobre la cocina? (que es difícil/que es divertida si aprendes con calma/que hay que practicar mucho)"
        correctAnswer: que es divertida si aprendes con calma
        rationale: "El texto: 'la cocina es divertida si aprendes con calma'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se sintió el narrador? (aburrido/le encantó/no le gustó)"
        correctAnswer: le encantó
        rationale: "El texto: '¡me encantó!'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
