title: 📚 Lectura - La Familia
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Texto descriptivo familiar con léxico de parentesco. Identificar relaciones familiares, rasgos y datos personales. Inferir información implícita sencilla."
example: "Lee el texto → identifica cada familiar (quién es quién) → qué hace cada uno → cómo se relacionan. Las respuestas están en el texto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La familia Roca tiene cinco miembros. El padre, Ernesto, es mecánico y trabaja en un taller del barrio. La madre, Carmen, da clases de inglés en una academia. Tienen tres hijos: Adrián, el mayor, tiene quince años y le apasiona la música; Pilar, la del medio, tiene once años y practica natación; y el pequeño, Rafa, acaba de cumplir seis años y empieza la primaria este otoño. Los abuelos paternos viven en el mismo edificio, en el piso de arriba. La abuela Josefina cuida a Rafa por las tardes mientras sus padres trabajan. Los fines de semana, toda la familia se reúne para comer juntos."
    exercises:
      - type: reading
        question: "¿Cuántos miembros tiene la familia Roca? (tres/cuatro/cinco)"
        correctAnswer: cinco
        rationale: "El texto: 'tiene cinco miembros'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A qué se dedica el padre? (es médico/es profesor/es mecánico)"
        correctAnswer: es mecánico
        rationale: "El texto: 'Ernesto, es mecánico'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde trabaja la madre? (en un colegio/en una academia/en casa)"
        correctAnswer: en una academia
        rationale: "El texto: 'da clases de inglés en una academia'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué le apasiona a Adrián? (el deporte/la música/los videojuegos)"
        correctAnswer: la música
        rationale: "El texto: 'le apasiona la música'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué deporte practica Pilar? (fútbol/tenis/natación)"
        correctAnswer: natación
        rationale: "El texto: 'practica natación'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos años tiene Rafa? (cuatro/cinco/seis)"
        correctAnswer: seis
        rationale: "El texto: 'acaba de cumplir seis años'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde viven los abuelos paternos? (en otro barrio/en el piso de arriba/en casa de los Roca)"
        correctAnswer: en el piso de arriba
        rationale: "El texto: 'en el mismo edificio, en el piso de arriba'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién cuida a Rafa por las tardes? (la madre/la abuela Josefina/Adrián)"
        correctAnswer: la abuela Josefina
        rationale: "El texto: 'La abuela Josefina cuida a Rafa por las tardes'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo se reúne toda la familia? (cada día/los fines de semana/los miércoles)"
        correctAnswer: los fines de semana
        rationale: "El texto: 'Los fines de semana, toda la familia se reúne'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo empieza Rafa la primaria? (en enero/este otoño/el año que viene)"
        correctAnswer: este otoño
        rationale: "El texto: 'empieza la primaria este otoño'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
