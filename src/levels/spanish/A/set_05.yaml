title: 📚 Lectura - En la Escuela
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Texto narrativo escolar. Léxico del entorno educativo. Identificar personajes, acciones y relaciones causales sencillas."
example: "Lee el texto → identifica quién está en la escuela → qué hacen → dónde están. Las respuestas están en el texto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Diego tiene diez años y va a cuarto de primaria en el colegio San Marcos. Su clase favorita es matemáticas porque le gustan los números y los problemas. Su profesora, la señorita Valeria, escribe los ejercicios en la pizarra con tiza de colores. Todos los viernes, los alumnos hacen un dictado para practicar la ortografía. El lunes pasado, Diego olvidó su libro de lengua en casa y tuvo que compartir el de su amigo Nico. Durante el recreo, Diego y sus compañeros juegan al baloncesto en el patio. El colegio termina a las dos y media, y Diego come en el comedor del colegio los días que su madre trabaja."
    exercises:
      - type: reading
        question: "¿Cuántos años tiene Diego? (ocho/diez/doce)"
        correctAnswer: diez
        rationale: "El texto: 'Diego tiene diez años'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es su clase favorita? (lengua/ciencias/matemáticas)"
        correctAnswer: matemáticas
        rationale: "El texto: 'Su clase favorita es matemáticas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo escribe los ejercicios la profesora? (con rotulador/con tiza de colores/en papel)"
        correctAnswer: con tiza de colores
        rationale: "El texto: 'escribe los ejercicios en la pizarra con tiza de colores'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo hacen el dictado? (todos los lunes/todos los viernes/todos los miércoles)"
        correctAnswer: todos los viernes
        rationale: "El texto: 'Todos los viernes, los alumnos hacen un dictado'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué olvidó Diego el lunes pasado? (su estuche/su libro de lengua/su mochila)"
        correctAnswer: su libro de lengua
        rationale: "El texto: 'Diego olvidó su libro de lengua en casa'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De quién usó el libro Diego? (de la profesora/de Nico/de otro compañero)"
        correctAnswer: de Nico
        rationale: "El texto: 'compartir el de su amigo Nico'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde juegan durante el recreo? (en el gimnasio/en el patio/en la calle)"
        correctAnswer: en el patio
        rationale: "El texto: 'juegan al baloncesto en el patio'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A qué hora termina el colegio? (a las dos/a las dos y media/a las tres)"
        correctAnswer: a las dos y media
        rationale: "El texto: 'termina a las dos y media'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo come Diego en el comedor? (siempre/cuando su madre trabaja/los viernes)"
        correctAnswer: cuando su madre trabaja
        rationale: "El texto: 'los días que su madre trabaja'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué practican con el dictado? (los números/la ortografía/la lectura)"
        correctAnswer: la ortografía
        rationale: "El texto: 'para practicar la ortografía'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
