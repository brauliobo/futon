title: Gramática - Preposiciones Básicas
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Preposiciones básicas y sus usos más frecuentes. A (dirección, hora), EN (lugar, tiempo, medio), DE (origen, posesión, material), CON (compañía), PARA (fin, destinatario), POR (causa, agente, precio, duración), ENTRE (posición intermedia), DESDE/HASTA (origen/destino temporal o espacial), ANTE (frente a, delante de)."
example: "a → dirección/hora: voy a casa, a las ocho. en → lugar: estoy en casa. de → origen: soy de aquí. para → fin: lo hago para ti. por → causa: por amor."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Elige la Preposición
    description: Selecciona la preposición correcta.
    exercises:
      - type: grammar
        question: "'Llego ___ las ocho' (a/en/de)"
        correctAnswer: a
        rationale: "La preposición 'a' indica la hora de llegada: 'llego a las ocho' señala el momento."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vivo ___ el centro de la ciudad' (a/en/de)"
        correctAnswer: en
        rationale: "'En' indica ubicación: vivo en el centro."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Esta cartera es ___ cuero' (a/en/de)"
        correctAnswer: de
        rationale: "'De' indica material: de cuero."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Fui al cine ___ mis amigos' (con/para/por)"
        correctAnswer: con
        rationale: "'Con' indica compañía: fui con mis amigos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Lo compré ___ diez euros' (con/por/para)"
        correctAnswer: por
        rationale: "'Por' indica precio/intercambio: por diez euros."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Trabajo ___ ganar dinero' (por/para/con)"
        correctAnswer: para
        rationale: "'Para' indica finalidad: para ganar dinero."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El libro está ___ la mesa y la silla' (entre/sobre/bajo)"
        correctAnswer: entre
        rationale: "'Entre' indica posición intermedia."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Trabajé aquí ___ dos años' (por/para/desde)"
        correctAnswer: por
        rationale: "'Por' indica duración: trabajé por dos años."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Viajo ___ Madrid ___ Barcelona' (origen/destino) (desde/hasta)"
        correctAnswer: desde / hasta
        rationale: "'Desde' = origen. 'Hasta' = destino: desde Madrid hasta Barcelona."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Se puso nervioso ___ el examen' (ante/entre/sobre)"
        correctAnswer: ante
        rationale: "'Ante' = frente a, delante de: se puso nervioso ante el examen."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Preposiciones en Contexto
    description: Elige la preposición correcta en cada oración.
    exercises:
      - type: grammar
        question: "'El regalo es ___ ti' (por/para/con)"
        correctAnswer: para
        rationale: "'Para' indica destinatario: para ti."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Habla ___ la televisión' (por/para/desde)"
        correctAnswer: por
        rationale: "'Por' indica medio de comunicación: habla por la televisión."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Viene ___ Francia' (a/en/de)"
        correctAnswer: de
        rationale: "'De' indica origen/procedencia."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La reunión es ___ lunes' (en/el/al)"
        correctAnswer: el
        rationale: "Días de la semana con artículo: la reunión es el lunes."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Viajamos ___ avión' (con/en/por)"
        correctAnswer: en
        rationale: "'En' + medio de transporte: en avión."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El cuadro está pintado ___ Picasso' (de/por/con)"
        correctAnswer: por
        rationale: "'Por' indica el agente de una pasiva: pintado por Picasso."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Está aquí ___ ayer' (desde/hasta/para)"
        correctAnswer: desde
        rationale: "'Desde' indica el inicio de un período: desde ayer."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Habla ___ su jefe todos los días' (a/con/de)"
        correctAnswer: con
        rationale: "'Con' indica interacción/compañía: habla con su jefe."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nació ___ 1995' (en/a/de)"
        correctAnswer: en
        rationale: "'En' + año: nació en 1995."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Lo hago ___ amor, no ___ dinero' (por/para)"
        correctAnswer: por / por
        rationale: "'Por' indica motivación/causa en ambos casos."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
