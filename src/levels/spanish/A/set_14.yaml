title: Gramática - Pronombres Personales
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Pronombres personales: sujeto (yo/tú/él/ella/usted/nosotros-as/vosotros-as/ellos-as/ustedes), CD (me/te/lo-la/nos/os/los-las), CI (me/te/le/nos/os/les→se). El español omite el pronombre sujeto (es pro-drop) excepto para énfasis o contraste. Distinguir 'le' CI de 'lo/la' CD."
example: "sujeto → yo/tú/él. CD: lo veo (a él) → lo. CI: le doy un libro (a él) → le. CD+CI: se lo doy (le+lo → se+lo)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Pronombres Sujeto
    description: Elige el pronombre sujeto correcto.
    exercises:
      - type: grammar
        question: "'___ soy estudiante' (Yo/Me/Mi)"
        correctAnswer: Yo
        rationale: "Pronombre sujeto 1ª sing.: yo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ eres de aquí?' (Tú/Te/Ti)"
        correctAnswer: Tú
        rationale: "Pronombre sujeto 2ª sing.: tú (con tilde)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ trabaja en el hospital' (Él/Le/Lo)"
        correctAnswer: Él
        rationale: "Pronombre sujeto 3ª sing. masc.: él (con tilde)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ vivimos en el centro' (Nosotras/Nos/Nuestras)"
        correctAnswer: Nosotras
        rationale: "Pronombre sujeto 1ª pl. fem.: nosotras."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ sois muy amables' (Vosotros/Os/Vuestros)"
        correctAnswer: Vosotros
        rationale: "Pronombre sujeto 2ª pl. masc.: vosotros."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ llegaron tarde' (Ellos/Les/Los)"
        correctAnswer: Ellos
        rationale: "Pronombre sujeto 3ª pl. masc.: ellos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "En español, ¿es obligatorio usar el pronombre sujeto? (sí siempre/no, el verbo lo indica/solo en preguntas)"
        correctAnswer: no, el verbo lo indica
        rationale: "Español es pro-drop: 'Hablo' = 'Yo hablo'; el sujeto se omite normalmente."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ hablan inglés muy bien' (pronombre para 'ellas') (Ellas/Les/Las)"
        correctAnswer: Ellas
        rationale: "Sujeto 3ª pl. fem.: ellas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ es muy simpática, no como él.' (para contraste: ella) (Ella/La/Le)"
        correctAnswer: Ella
        rationale: "Sujeto para contraste → pronombre explícito: ella."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuándo se usa el pronombre sujeto en español? (siempre/para énfasis o contraste/solo en presente)"
        correctAnswer: para énfasis o contraste
        rationale: "Uso del pronombre sujeto explícito: énfasis, contraste o ambigüedad."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Pronombres de Objeto
    description: Elige el pronombre de complemento correcto.
    exercises:
      - type: grammar
        question: "'___ llaman todos los días' (a mí) (Me/Mi/Yo)"
        correctAnswer: Me
        rationale: "CD/CI de 1ª sing.: me."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ has visto en el cine?' (a él) (Lo/Le/Él)"
        correctAnswer: Lo
        rationale: "CD masculino sing. → lo: ¿lo has visto?"
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ escribo una carta a mi madre' (Le/La/Lo)"
        correctAnswer: Le
        rationale: "CI singular (a mi madre) → le."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ayer ___ vi en el parque' (a ella) (la/le/ella)"
        correctAnswer: la
        rationale: "CD femenino sing. → la: la vi."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ diste el regalo a los niños?' (Les/Los/Le)"
        correctAnswer: Les
        rationale: "CI plural → les: ¿les diste el regalo?"
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ veo todos los días' (a mis amigos) (Los/Les/Nos)"
        correctAnswer: Los
        rationale: "CD masc. pl. → los: los veo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ escribe cartas a sus padres' (le/les/se)"
        correctAnswer: les
        rationale: "CI plural (a sus padres) → les."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el CD? '¿La compraste?' (la = a ella/la = la cosa/la = a ella o la cosa)"
        correctAnswer: la = la cosa
        rationale: "CD femenino: 'la' sustituye al objeto directo femenino."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Orden correcto con CI+CD: '(Le) lo doy → (Se) lo doy' ¿Cuándo cambia le→se? (siempre/cuando va antes de lo/la/solo en plural)"
        correctAnswer: cuando va antes de lo/la
        rationale: "Le/les + lo/la/los/las → se: 'Se lo doy a él'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ has llamado hoy?' (a tu madre) (La/Le/Lo)"
        correctAnswer: La
        rationale: "CD de persona femenina → la: ¿la has llamado?"
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
