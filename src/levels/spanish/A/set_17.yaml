title: Lectura - El Tiempo y las Estaciones
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Texto expositivo sobre el clima y las estaciones del año. Vocabulario meteorológico. Identificar características, secuencias temporales y relaciones causa-efecto."
example: "Lee el texto → identifica cada estación (primavera/verano/otoño/invierno) → sus características (temperatura/plantas/actividades) → las estaciones siguen el orden del año."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El año tiene cuatro estaciones: primavera, verano, otoño e invierno. En primavera el tiempo es suave y lluvioso. Las plantas brotan y los campos se llenan de flores. En verano hace mucho calor: el sol brilla con fuerza y los días son muy largos. Es la época de las vacaciones y las playas se llenan de gente. En otoño el tiempo cambia: las temperaturas bajan, las hojas de los árboles se vuelven rojas y amarillas y caen al suelo. Es la estación de las lluvias y de la vendimia. En invierno hace frío y en las montañas nieva. Los días son cortos y las noches, largas. Muchos animales hibernan durante estos meses. En España, el clima varía mucho según la región: en el norte es húmedo y lluvioso, mientras que en el sur es más seco y cálido."
    exercises:
      - type: reading
        question: "¿Cuántas estaciones tiene el año? (dos/tres/cuatro)"
        correctAnswer: cuatro
        rationale: "El texto: 'El año tiene cuatro estaciones'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo es el tiempo en primavera? (seco y caluroso/suave y lluvioso/frío y nevado)"
        correctAnswer: suave y lluvioso
        rationale: "El texto: 'En primavera el tiempo es suave y lluvioso'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo son los días más largos del año? (primavera/verano/invierno)"
        correctAnswer: verano
        rationale: "El texto: 'los días son muy largos' en verano."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué colores se vuelven las hojas en otoño? (verdes y azules/rojas y amarillas/marrones y negras)"
        correctAnswer: rojas y amarillas
        rationale: "El texto: 'las hojas...se vuelven rojas y amarillas'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es la vendimia? (una fiesta de verano/la recogida de uvas/una tormenta)"
        correctAnswer: la recogida de uvas
        rationale: "La vendimia es la recolección de la uva; el texto la sitúa en otoño."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hacen muchos animales en invierno? (emigran/hibernan/se reproducen)"
        correctAnswer: hibernan
        rationale: "El texto: 'Muchos animales hibernan durante estos meses'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo es el clima en el norte de España? (seco y cálido/húmedo y lluvioso/frío y soleado)"
        correctAnswer: húmedo y lluvioso
        rationale: "El texto: 'en el norte es húmedo y lluvioso'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo se llenan las playas de gente? (en primavera/en verano/en otoño)"
        correctAnswer: en verano
        rationale: "El texto: 'las playas se llenan de gente' en verano."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué estación nieva en las montañas? (otoño/primavera/invierno)"
        correctAnswer: invierno
        rationale: "El texto: 'En invierno...en las montañas nieva'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo es el clima en el sur de España? (húmedo y frío/seco y cálido/lluvioso y templado)"
        correctAnswer: seco y cálido
        rationale: "El texto: 'en el sur es más seco y cálido'."
        difficulty: 2
        objectives: [es.pre_reading]
target: 10
