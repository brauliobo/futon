title: Gramática - Adjetivos Calificativos
level: A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Adjetivos calificativos: expresan cualidades del sustantivo. Concordancia en género y número. Posición: antes (valor expresivo/determinativo: una gran persona) o después (valor especificativo: una persona grande). Grados: positivo, comparativo (más/menos/tan...como), superlativo (el más / -ísimo)."
example: "adjetivo especificativo → después del nombre: 'casa grande'; adjetivo expresivo → antes del nombre: 'gran casa'; comparativo → más + adj + que: 'más alto que'; superlativo relativo → el/la más + adj: 'el más alto'; superlativo absoluto → adj + ísimo: 'altísimo'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Concordancia del Adjetivo
    description: Elige el adjetivo que concuerda correctamente.
    exercises:
      - type: grammar
        question: "'Una casa ___' (grande/grandes/gran)"
        correctAnswer: grande
        rationale: "Casa (fem. sing.) + grande (masc./fem. sing.): una casa grande."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Unos niños ___' (feliz/felices/felizes)"
        correctAnswer: felices
        rationale: "Niños (masc. pl.) + feliz → plural: felices."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Una ciudad ___' (hermoso/hermosas/hermosa)"
        correctAnswer: hermosa
        rationale: "Ciudad (fem. sing.) → hermosa."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los días ___' (soleado/soleadas/soleados)"
        correctAnswer: soleados
        rationale: "Días (masc. pl.) → soleados."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Un problema ___' (difícil/difíciles/dificil)"
        correctAnswer: difícil
        rationale: "Problema (masc. sing.) + difícil (invariable en género): difícil."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Unas flores ___' (rojo/rojas/rojos)"
        correctAnswer: rojas
        rationale: "Flores (fem. pl.) → rojas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ persona' (gran/grande/grandes)"
        correctAnswer: gran
        rationale: "Antes del sustantivo singular, 'grande' se apacopoa a 'gran'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Una idea ___' (original/originales/originala)"
        correctAnswer: original
        rationale: "Idea (fem. sing.) + original (invariable en género): original."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los coches ___' (rápido/rápidas/rápidos)"
        correctAnswer: rápidos
        rationale: "Coches (masc. pl.) → rápidos."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La canción más ___' (popular/populares/populara)"
        correctAnswer: popular
        rationale: "Canción (fem. sing.) + popular (invariable en género): popular."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Grados del Adjetivo
    description: Elige la forma de grado correcto.
    exercises:
      - type: grammar
        question: "'Pedro es ___ alto ___ Juan' (comparativo) (más/que)"
        correctAnswer: más / que
        rationale: "Comparativo de superioridad: más + adj + que."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ana es ___ inteligente ___ su hermano' (igual) (tan/como)"
        correctAnswer: tan / como
        rationale: "Comparativo de igualdad: tan + adj + como."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Esta montaña es la ___ alta de España' (más/menos/tan)"
        correctAnswer: más
        rationale: "Superlativo relativo: la más alta."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'bueno': (el más bueno/buenísimo/muy buen)"
        correctAnswer: buenísimo
        rationale: "Superlativo absoluto irregular: buenísimo."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo absoluto de 'grande': (grandísimo/el más grande/muy gran)"
        correctAnswer: grandísimo
        rationale: "Superlativo absoluto: grandísimo (o muy grande)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Este examen es ___ difícil que el anterior' (comparativo inferioridad) (menos/más/tan)"
        correctAnswer: menos
        rationale: "Comparativo de inferioridad: menos + adj + que."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Dónde va el adjetivo especificativo? (antes del sustantivo/después del sustantivo/cualquier posición)"
        correctAnswer: después del sustantivo
        rationale: "El adjetivo especificativo distingue → va después: perro pequeño."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Es ___ hombre' (adjetivo expresivo: tiene significado valorativo) (un buen/un bueno/un bien)"
        correctAnswer: un buen
        rationale: "Antes del sustantivo masc. sing.: 'buen' (apócope de 'bueno')."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Superlativo de 'malo': (malísimo/el más malo/peor/malísimo o pésimo)"
        correctAnswer: malísimo o pésimo
        rationale: "Malo: superlativo → malísimo (regular) o pésimo (irregular)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración con comparativo correcto: (Es tan grande que su hermano./Es tan grande como su hermano./Es más grande que su hermano.)"
        correctAnswer: Es más grande que su hermano.
        rationale: "Comparativo de superioridad: más + adj + que."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
