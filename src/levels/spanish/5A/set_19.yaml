title: Lectura Simple - La Fiesta de Cumpleaños
level: 5A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Lectura narrativa con secuencia de eventos. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿Qué celebran? → cumpleaños."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Cuento
    description: "Historia: Hoy es el cumpleaños de Mario. Cumple seis años. Viene sus primos y sus amigos de la escuela. La mesa tiene globos rojos y un pastel de chocolate. Mario sopla las velas y todos cantan. Después juegan en el jardín hasta que se hace de noche."
    exercises:
      - type: reading
        question: "¿Qué celebran? (boda/Navidad/cumpleaños)"
        correctAnswer: cumpleaños
        rationale: "El texto: 'Hoy es el cumpleaños de Mario'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién cumple años? (Pablo/Mario/Pedro)"
        correctAnswer: Mario
        rationale: "El texto: 'cumpleaños de Mario'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos años cumple? (cinco/seis/siete)"
        correctAnswer: seis
        rationale: "El texto: 'Cumple seis años'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quiénes vienen? (tíos y primos/primos y amigos/vecinos)"
        correctAnswer: primos y amigos
        rationale: "El texto: 'sus primos y sus amigos de la escuela'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color son los globos? (azules/verdes/rojos)"
        correctAnswer: rojos
        rationale: "El texto: 'globos rojos'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué es el pastel? (vainilla/fresa/chocolate)"
        correctAnswer: chocolate
        rationale: "El texto: 'un pastel de chocolate'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué sopla Mario? (globos/velas/silbatos)"
        correctAnswer: velas
        rationale: "El texto: 'Mario sopla las velas'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hacen todos? (bailan/cantan/lloran)"
        correctAnswer: cantan
        rationale: "El texto: 'todos cantan'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde juegan? (salón/jardín/calle)"
        correctAnswer: jardín
        rationale: "El texto: 'juegan en el jardín'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Hasta cuándo juegan? (mediodía/merienda/noche)"
        correctAnswer: noche
        rationale: "El texto: 'hasta que se hace de noche'."
        difficulty: 1
        objectives: [es.pre_reading]
target: 10
