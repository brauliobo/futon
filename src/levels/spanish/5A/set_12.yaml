title: Separación de Sílabas - Tres Sílabas
level: 5A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "División silábica de palabras trisílabas. Primero pronuncia en voz alta; cada golpe de voz es una sílaba."
example: "'escuela' se divide en → es-cue-la (tres sílabas)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: División en Tres Partes
    description: Divide correctamente cada palabra trisílaba.
    exercises:
      - type: reading
        question: "División de 'mañana' (ma-ña-na/mañ-ana/m-añ-ana)"
        correctAnswer: ma-ña-na
        rationale: "Pronuncia MA-ÑA-NA; cada sílaba tiene una vocal."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'cabeza' (ca-be-za/cab-e-za/c-abe-za)"
        correctAnswer: ca-be-za
        rationale: "Pronuncia CA-BE-ZA; tres sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'tomate' (to-ma-te/tom-ate/t-omate)"
        correctAnswer: to-ma-te
        rationale: "Pronuncia TO-MA-TE; tres sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'camino' (ca-mi-no/cam-ino/c-amino)"
        correctAnswer: ca-mi-no
        rationale: "Pronuncia CA-MI-NO; tres sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'paloma' (pa-lo-ma/pal-oma/p-aloma)"
        correctAnswer: pa-lo-ma
        rationale: "Pronuncia PA-LO-MA; tres sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'pelota' (pe-lo-ta/pel-ota/pe-lot-a)"
        correctAnswer: pe-lo-ta
        rationale: "Pronuncia PE-LO-TA; tres sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'vestido' (ves-ti-do/vest-ido/v-esti-do)"
        correctAnswer: ves-ti-do
        rationale: "Pronuncia VES-TI-DO; tres sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'amigo' (a-mi-go/am-igo/a-mig-o)"
        correctAnswer: a-mi-go
        rationale: "Pronuncia A-MI-GO; tres sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'cereza' (ce-re-za/cer-eza/ce-rez-a)"
        correctAnswer: ce-re-za
        rationale: "Pronuncia CE-RE-ZA; tres sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'maleta' (ma-le-ta/mal-eta/m-aleta)"
        correctAnswer: ma-le-ta
        rationale: "Pronuncia MA-LE-TA; tres sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Cuenta las Sílabas
    description: Cuenta las sílabas de cada palabra.
    exercises:
      - type: reading
        question: "¿Cuántas sílabas tiene 'mañana'? (2/3/4)"
        correctAnswer: 3
        rationale: "'Mañana' revela 3 sílabas: MA-ÑA-NA, tres golpes de voz."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'cabeza'? (2/3/4)"
        correctAnswer: 3
        rationale: "CA-BE-ZA: tres sílabas."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'escuela'? (2/3/4)"
        correctAnswer: 3
        rationale: "ES-CUE-LA: tres sílabas; CUE es un diptongo que forma una sola sílaba."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'maestra'? (2/3/4)"
        correctAnswer: 3
        rationale: "MA-ES-TRA: tres sílabas."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'pelota'? (2/3/4)"
        correctAnswer: 3
        rationale: "PE-LO-TA: tres sílabas."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'bicicleta'? (3/4/5)"
        correctAnswer: 4
        rationale: "BI-CI-CLE-TA: cuatro sílabas."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'mariposa'? (3/4/5)"
        correctAnswer: 4
        rationale: "MA-RI-PO-SA: cuatro sílabas."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'teléfono'? (3/4/5)"
        correctAnswer: 4
        rationale: "TE-LÉ-FO-NO: cuatro sílabas."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'coche'? (1/2/3)"
        correctAnswer: 2
        rationale: "CO-CHE: dos sílabas; el dígrafo CH cuenta como una consonante."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'fantástico'? (3/4/5)"
        correctAnswer: 4
        rationale: "FAN-TÁS-TI-CO: cuatro sílabas."
        difficulty: 3
        objectives: [es.pre_reading]
target: 20
