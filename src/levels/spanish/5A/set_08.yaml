title: 📝 Frases Simples - Él / Ella
level: 5A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Construcción de frases con 'él' o 'ella' y verbos en tercera persona. Pensar primero en quién realiza la acción."
example: "Él ___ la pelota (juego/juega) → Él juega la pelota."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Verbos con 'Él' y 'Ella'
    description: Completa la frase con el verbo en tercera persona.
    exercises:
      - type: grammar
        question: "'Él ___ la pelota' (juego/juegas/juega)"
        correctAnswer: juega
        rationale: "Con 'él/ella' el verbo termina en -a (verbos -ar): él juega."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ la canción' (canto/canta/cantas)"
        correctAnswer: canta
        rationale: "Con 'ella' el verbo termina en -a: ella canta."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ en casa' (estoy/está/estás)"
        correctAnswer: está
        rationale: "Con 'él' el verbo 'estar' es 'está'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ la lección' (estudio/estudias/estudia)"
        correctAnswer: estudia
        rationale: "Con 'ella' el verbo termina en -a: ella estudia."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ un gato' (tengo/tiene/tienes)"
        correctAnswer: tiene
        rationale: "Con 'él' el verbo 'tener' es 'tiene'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ a la escuela' (voy/va/vas)"
        correctAnswer: va
        rationale: "Con 'ella' el verbo 'ir' es 'va'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ una manzana' (como/comes/come)"
        correctAnswer: come
        rationale: "Con 'él' el verbo termina en -e (verbos -er): él come."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ agua' (bebo/bebes/bebe)"
        correctAnswer: bebe
        rationale: "Con 'ella' el verbo termina en -e: ella bebe."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ a Ana' (veo/ve/ves)"
        correctAnswer: ve
        rationale: "Con 'él' el verbo 'ver' es 've'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ feliz' (soy/es/eres)"
        correctAnswer: es
        rationale: "Con 'ella' el verbo 'ser' es 'es'."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Frases Cortas con 'Él' y 'Ella'
    description: Elige la frase correcta.
    exercises:
      - type: grammar
        question: "Frase correcta (Él juego/Él juegas/Él juega)"
        correctAnswer: Él juega
        rationale: "Con 'él' el verbo termina en -a: él juega."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Frase correcta (Ella es niña/Ella soy niña/Ella eres niña)"
        correctAnswer: Ella es niña
        rationale: "Con 'ella' el verbo 'ser' es 'es'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Frase correcta (Él lee un libro/Él leo un libro/Él lees un libro)"
        correctAnswer: Él lee un libro
        rationale: "Con 'él' el verbo termina en -e: él lee."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Frase correcta (Ella corre rápido/Ella corro rápido/Ella corres rápido)"
        correctAnswer: Ella corre rápido
        rationale: "Con 'ella' el verbo termina en -e: ella corre."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Frase correcta (Él escribo/Él escribe/Él escribes)"
        correctAnswer: Él escribe
        rationale: "Con 'él' el verbo termina en -e: él escribe."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Frase correcta (Ella va a casa/Ella voy a casa/Ella vas a casa)"
        correctAnswer: Ella va a casa
        rationale: "Con 'ella' el verbo 'ir' es 'va'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Frase correcta (Él tiene hambre/Él tengo hambre/Él tienes hambre)"
        correctAnswer: Él tiene hambre
        rationale: "Con 'él' el verbo 'tener' es 'tiene'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Frase correcta (Ella duermo/Ella duerme/Ella duermes)"
        correctAnswer: Ella duerme
        rationale: "Con 'ella' el verbo termina en -e: ella duerme."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Frase correcta (Él salta/Él saltas/Él salto)"
        correctAnswer: Él salta
        rationale: "Con 'él' el verbo termina en -a: él salta."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: grammar
        question: "Frase correcta (Ella cantas/Ella canto/Ella canta)"
        correctAnswer: Ella canta
        rationale: "Con 'ella' el verbo termina en -a: ella canta."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
