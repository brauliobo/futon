title: Lectura Simple - El Perro Toby
level: 5A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Lectura narrativa corta con rutinas diarias. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿Cómo se llama el perro? → Toby."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Cuento
    description: "Historia: Toby es un perro marrón. Vive con Marco en una casa al lado del parque. Por la mañana salen a pasear. Toby corre detrás de la pelota verde. Después del paseo, Toby come su comida y bebe agua. Por la tarde duerme la siesta en su cesto."
    exercises:
      - type: reading
        question: "¿Cómo se llama el perro? (Toby/Duque/Rocky)"
        correctAnswer: Toby
        rationale: "El texto: 'Toby es un perro marrón'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color es Toby? (negro/marrón/blanco)"
        correctAnswer: marrón
        rationale: "El texto: 'un perro marrón'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con quién vive? (Marco/Juan/Pedro)"
        correctAnswer: Marco
        rationale: "El texto: 'Vive con Marco'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde está la casa? (en el campo/al lado del parque/en la playa)"
        correctAnswer: al lado del parque
        rationale: "El texto: 'en una casa al lado del parque'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo pasean? (mañana/tarde/noche)"
        correctAnswer: mañana
        rationale: "El texto: 'Por la mañana salen a pasear'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Detrás de qué corre Toby? (palo/pelota/gato)"
        correctAnswer: pelota
        rationale: "El texto: 'corre detrás de la pelota'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color es la pelota? (roja/azul/verde)"
        correctAnswer: verde
        rationale: "El texto: 'pelota verde'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hace después del paseo? (juega/come/corre)"
        correctAnswer: come
        rationale: "El texto: 'Toby come su comida'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué bebe? (leche/zumo/agua)"
        correctAnswer: agua
        rationale: "El texto: 'bebe agua'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde duerme la siesta? (cama/sofá/cesto)"
        correctAnswer: cesto
        rationale: "El texto: 'duerme la siesta en su cesto'."
        difficulty: 1
        objectives: [es.pre_reading]
target: 10
