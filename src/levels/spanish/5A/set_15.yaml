title: 📝 Lectura Simple - Día de Lluvia
level: 5A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Lectura narrativa con secuencia temporal. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿Qué tiempo hace? → llueve."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Cuento
    description: "Historia: Hoy llueve mucho. Sara se pone un impermeable amarillo y botas de goma. Sale con su paraguas azul. En la calle salta sobre los charcos y se ríe. Cuando vuelve a casa, su madre le prepara un chocolate caliente. Sara se seca el pelo con una toalla y se pone el pijama."
    exercises:
      - type: reading
        question: "¿Qué tiempo hace? (nieva/llueve/hace sol)"
        correctAnswer: llueve
        rationale: "El texto: 'Hoy llueve mucho'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama la niña? (Ana/Sara/Lucía)"
        correctAnswer: Sara
        rationale: "El texto: 'Sara se pone un impermeable'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color es el impermeable? (rojo/azul/amarillo)"
        correctAnswer: amarillo
        rationale: "El texto: 'impermeable amarillo'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué se pone en los pies? (zapatos/botas/sandalias)"
        correctAnswer: botas
        rationale: "El texto: 'botas de goma'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color es el paraguas? (azul/rojo/verde)"
        correctAnswer: azul
        rationale: "El texto: 'paraguas azul'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Sobre qué salta? (piedras/charcos/hojas)"
        correctAnswer: charcos
        rationale: "El texto: 'salta sobre los charcos'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se siente Sara en la calle? (triste/asustada/contenta)"
        correctAnswer: contenta
        rationale: "El texto: 'se ríe' → está contenta."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué le prepara la madre? (té/chocolate/zumo)"
        correctAnswer: chocolate
        rationale: "El texto: 'un chocolate caliente'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con qué se seca el pelo? (pañuelo/toalla/secador)"
        correctAnswer: toalla
        rationale: "El texto: 'se seca el pelo con una toalla'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué se pone al final? (bata/vestido/pijama)"
        correctAnswer: pijama
        rationale: "El texto: 'se pone el pijama'."
        difficulty: 1
        objectives: [es.pre_reading]
target: 10
