title: 🔤 Formación de Sílabas - CA CE CI CO CU
level: 5A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Refuerzo de las sílabas con C: CA CO CU (sonido fuerte /k/) y CE CI (sonido suave /θ/ o /s/). Primero identifica la vocal que sigue; luego forma la palabra."
example: "C + A/O/U → sonido /k/: CA/CO/CU → CA + SA → casa; C + E/I → sonido /θ/ o /s/: CE/CI → CE + NA → cena; CI + NE → cine."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Une Dos Sílabas
    description: Forma la palabra uniendo las sílabas dadas.
    exercises:
      - type: reading
        question: "CA + SA = (cosa/casa/cesa)"
        correctAnswer: casa
        rationale: "Une CA y SA → 'casa'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "CO + CHE = (cache/coche/cuche)"
        correctAnswer: coche
        rationale: "Une CO y CHE → 'coche'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "CU + NA = (cana/cena/cuna)"
        correctAnswer: cuna
        rationale: "Une CU y NA → 'cuna' (cama del bebé)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "CE + NA = (cana/cina/cena)"
        correctAnswer: cena
        rationale: "Une CE y NA → 'cena'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "CI + MA = (cama/cima/coma)"
        correctAnswer: cima
        rationale: "Une CI y MA → 'cima' (punto más alto)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "CO + LA = (cola/cela/cula)"
        correctAnswer: cola
        rationale: "Une CO y LA → 'cola'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "CA + RA = (cura/cera/cara)"
        correctAnswer: cara
        rationale: "Une CA y RA → 'cara' (rostro)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "CE + RO = (caro/cero/curo)"
        correctAnswer: cero
        rationale: "Une CE y RO → 'cero' (número)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "CU + RA = (cara/cera/cura)"
        correctAnswer: cura
        rationale: "Une CU y RA → 'cura' (remedio)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "CO + MA = (cama/coma/cuma)"
        correctAnswer: coma
        rationale: "Une CO y MA → 'coma' (signo ortográfico)."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Completa la Palabra
    description: Elige la sílaba que completa la palabra.
    exercises:
      - type: reading
        question: "___sa (casa): (CI/CA/CU)"
        correctAnswer: CA
        rationale: "CA + SA = 'casa'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "pe___ (pecas): (CA/CO/CU)"
        correctAnswer: CA
        rationale: "PE + CAS = 'pecas' (manchas pequeñas)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "___co (coco): (CO/CE/CI)"
        correctAnswer: CO
        rationale: "CO + CO = 'coco'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "pi___ (pico): (CA/CE/CO)"
        correctAnswer: CO
        rationale: "PI + CO = 'pico'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "___bo (cubo): (CA/CE/CU)"
        correctAnswer: CU
        rationale: "CU + BO = 'cubo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "do___ (doce): (CO/CE/CI)"
        correctAnswer: CE
        rationale: "DO + CE = 'doce' (número 12)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "___ra (cera): (CO/CE/CI)"
        correctAnswer: CE
        rationale: "CE + RA = 'cera'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "re___ (recibo): (CI/CE/CA)"
        correctAnswer: CI
        rationale: "RE + CI + BO = 'recibo'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "___ma (cima): (CA/CE/CI)"
        correctAnswer: CI
        rationale: "CI + MA = 'cima'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "to___ (toca): (CO/CA/CE)"
        correctAnswer: CA
        rationale: "TO + CA = 'toca' (del verbo tocar)."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
