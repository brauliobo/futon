title: 🎵 Palabras que Riman
level: 5A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Palabras que riman terminan con el mismo sonido. Pensar primero en el final de la palabra."
example: "Palabra que rima con 'sol' → col (terminan en -ol)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Terminaciones Iguales
    description: Elige la palabra que rima.
    exercises:
      - type: spanish_vocab
        question: "Rima con 'sol' (col/pan/mar)"
        correctAnswer: col
        rationale: "'Sol' y 'col' terminan en -ol y comparten el mismo sonido final."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Rima con 'pan' (sol/can/mar)"
        correctAnswer: can
        rationale: "'Pan' y 'can' terminan en -an."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Rima con 'mar' (casa/dar/sol)"
        correctAnswer: dar
        rationale: "'Mar' y 'dar' terminan en -ar."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Rima con 'casa' (mesa/pasa/libro)"
        correctAnswer: pasa
        rationale: "'Casa' y 'pasa' terminan en -asa."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Rima con 'gato' (pato/casa/silla)"
        correctAnswer: pato
        rationale: "'Gato' y 'pato' terminan en -ato."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Rima con 'ratón' (león/casa/mesa)"
        correctAnswer: león
        rationale: "'Ratón' y 'león' terminan en -ón."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Rima con 'flor' (mar/color/sol)"
        correctAnswer: color
        rationale: "'Flor' y 'color' terminan en -or."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Rima con 'paz' (cruz/luz/palabra)"
        correctAnswer: luz
        rationale: "'Paz' y 'luz' terminan en sonido /s/ o /θ/; riman por la última letra z."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Rima con 'uno' (dos/ruido/mundo)"
        correctAnswer: mundo
        rationale: "Primero escucha el final: 'uno' y 'mundo' comparten la sílaba -undo en oído."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "Rima con 'pera' (casa/cera/silla)"
        correctAnswer: cera
        rationale: "'Pera' y 'cera' terminan en -era."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Elige la Palabra que No Rima
    description: Encuentra la palabra que NO rima con las otras.
    exercises:
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (col/gol/sol/pan)"
        correctAnswer: pan
        rationale: "Col, gol, sol terminan en -ol; pan termina en -an."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (mano/rana/hermano/enano)"
        correctAnswer: rana
        rationale: "Mano, hermano, enano terminan en -ano; rana termina en -ana."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (gato/pato/rato/perro)"
        correctAnswer: perro
        rationale: "Gato, pato, rato terminan en -ato; perro termina en -erro."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (casa/pasa/masa/mesa)"
        correctAnswer: mesa
        rationale: "Casa, pasa, masa terminan en -asa; mesa termina en -esa."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (flor/color/amor/pan)"
        correctAnswer: pan
        rationale: "Flor, color, amor terminan en -or; pan termina en -an."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (ratón/león/jamón/mano)"
        correctAnswer: mano
        rationale: "Ratón, león, jamón terminan en -ón; mano termina en -ano."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (pino/vino/fino/pato)"
        correctAnswer: pato
        rationale: "Pino, vino, fino terminan en -ino; pato termina en -ato."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (rosa/cosa/losa/río)"
        correctAnswer: río
        rationale: "Rosa, cosa, losa terminan en -osa; río termina en -ío."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (cielo/suelo/pelo/flor)"
        correctAnswer: flor
        rationale: "Cielo, suelo, pelo terminan en -elo; flor termina en -or."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: spanish_vocab
        question: "¿Cuál NO rima con las otras? (luna/cuna/una/sol)"
        correctAnswer: sol
        rationale: "Luna, cuna, una terminan en -una; sol termina en -ol."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
