title: 📝 Lectura Simple - La Muñeca Ana
level: 5A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Lectura narrativa corta con detalles concretos. Localiza la respuesta en el texto antes de inferir."
example: "Lee atentamente. Ej.: ¿Cómo se llama la muñeca? → Ana."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: El Cuento
    description: "Historia: Lucía tiene una muñeca llamada Ana. Ana tiene el pelo rubio y los ojos azules. Lleva un vestido rojo y zapatos blancos. Lucía juega con Ana todos los días en su habitación. Por la noche, pone a Ana en su cama, al lado de la almohada."
    exercises:
      - type: reading
        question: "¿Cómo se llama la niña? (Ana/Sofía/Lucía)"
        correctAnswer: Lucía
        rationale: "El texto: 'Lucía tiene una muñeca'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se llama la muñeca? (Lucía/Ana/Marta)"
        correctAnswer: Ana
        rationale: "El texto: 'muñeca llamada Ana'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color es el pelo? (negro/castaño/rubio)"
        correctAnswer: rubio
        rationale: "El texto: 'Ana tiene el pelo rubio'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color son los ojos? (verdes/marrones/azules)"
        correctAnswer: azules
        rationale: "El texto: 'los ojos azules'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color es el vestido? (amarillo/rojo/verde)"
        correctAnswer: rojo
        rationale: "El texto: 'Lleva un vestido rojo'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿De qué color son los zapatos? (negros/blancos/rojos)"
        correctAnswer: blancos
        rationale: "El texto: 'zapatos blancos'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con qué frecuencia juega Lucía? (a veces/los domingos/todos los días)"
        correctAnswer: todos los días
        rationale: "El texto: 'juega con Ana todos los días'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde juega Lucía? (jardín/habitación/cocina)"
        correctAnswer: habitación
        rationale: "El texto: 'en su habitación'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo pone a Ana en la cama? (mañana/tarde/noche)"
        correctAnswer: noche
        rationale: "El texto: 'Por la noche, pone a Ana en su cama'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde pone a Ana? (al lado de la almohada/en la mesa/en el suelo)"
        correctAnswer: al lado de la almohada
        rationale: "El texto: 'al lado de la almohada'."
        difficulty: 1
        objectives: [es.pre_reading]
target: 10
