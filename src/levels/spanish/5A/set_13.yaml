title: 🔤 Orden Alfabético - N a Z
level: 5A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Segunda mitad del abecedario: N Ñ O P Q R S T U V W X Y Z. Pensar primero en cantar el abecedario mentalmente."
example: "Letra que sigue a N → Ñ. Letra antes de Q → P."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Letra Siguiente
    description: Elige la letra que va después.
    exercises:
      - type: reading
        question: "Letra después de N (O/M/Ñ)"
        correctAnswer: Ñ
        rationale: "Después de N viene Ñ en el abecedario español."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra después de Ñ (P/N/O)"
        correctAnswer: O
        rationale: "Después de Ñ viene O."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra después de O (N/P/Q)"
        correctAnswer: P
        rationale: "Después de O viene P."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra después de P (O/Q/R)"
        correctAnswer: Q
        rationale: "Después de P viene Q."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra después de Q (P/R/S)"
        correctAnswer: R
        rationale: "Después de Q viene R."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra después de R (Q/S/T)"
        correctAnswer: S
        rationale: "Después de R viene S."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra después de S (R/T/U)"
        correctAnswer: T
        rationale: "Después de S viene T."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra después de U (T/V/W)"
        correctAnswer: V
        rationale: "Después de U viene V."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra después de X (W/Y/Z)"
        correctAnswer: Y
        rationale: "Después de X viene Y."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra después de Y (X/Z/…)"
        correctAnswer: Z
        rationale: "Después de Y viene Z, la última letra del abecedario."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Letra Anterior o Intermedia
    description: Elige la letra que va antes o en medio.
    exercises:
      - type: reading
        question: "Letra antes de O (M/N/Ñ)"
        correctAnswer: Ñ
        rationale: "Antes de O viene Ñ en el abecedario español."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra antes de Q (O/P/R)"
        correctAnswer: P
        rationale: "Antes de Q viene P."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra antes de S (Q/R/T)"
        correctAnswer: R
        rationale: "Antes de S viene R."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra antes de V (T/U/W)"
        correctAnswer: U
        rationale: "Antes de V viene U."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra antes de Z (X/Y/W)"
        correctAnswer: Y
        rationale: "Antes de Z viene Y."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra entre N y O (Ñ/M/P)"
        correctAnswer: Ñ
        rationale: "En el abecedario español, Ñ está entre N y O."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra entre P y R (Q/O/S)"
        correctAnswer: Q
        rationale: "Entre P y R está Q en la secuencia P-Q-R."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra entre T y V (U/S/W)"
        correctAnswer: U
        rationale: "Entre T y V está U en la secuencia T-U-V."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra entre W y Y (X/Z/V)"
        correctAnswer: X
        rationale: "Entre W y Y está X en la secuencia W-X-Y."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "Letra final del abecedario (Y/Z/X)"
        correctAnswer: Z
        rationale: "La Z es la última letra del abecedario español."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
