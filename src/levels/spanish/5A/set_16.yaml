title: 📝 Palabras Opuestas - Contrarios
level: 5A
subject: spanish
difficulty: 2
objectives:
  - es.pre_reading
authorNotes: "Pares de palabras opuestas (antónimos básicos). Pensar primero en el sentido de la palabra y su contrario."
example: "Contrario de 'grande' → pequeño. Contrario de 'día' → noche."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
