title: Formación de Sílabas - BA BE BI BO BU
level: 5A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "Refuerzo de sílabas BA BE BI BO BU combinándolas con otras para formar palabras. Primero identifica las dos sílabas; luego únelas."
example: "B + vocal → sílaba: BA/BE/BI/BO/BU; unir sílabas → BA + TA → bata; BO + CA → boca; BA + ÑO → baño; BU + ZÓN → buzón."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Une Dos Sílabas
    description: Forma la palabra uniendo las dos sílabas dadas.
    exercises:
      - type: reading
        question: "BA + TA = (bate/bata/bota)"
        correctAnswer: bata
        rationale: "Une BA y TA para formar 'bata' (prenda)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "BO + CA = (beca/boca/bica)"
        correctAnswer: boca
        rationale: "Une BO y CA → 'boca'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "BE + SO = (bozo/baso/beso)"
        correctAnswer: beso
        rationale: "Une BE y SO → 'beso'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "BO + TE = (bate/bote/beto)"
        correctAnswer: bote
        rationale: "Une BO y TE → 'bote'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "BU + RRO = (burra/barro/burro)"
        correctAnswer: burro
        rationale: "Une BU y RRO → 'burro'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "BA + LA = (bola/bula/bala)"
        correctAnswer: bala
        rationale: "Une BA y LA → 'bala'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "BI + BI = (bibi/bobo/beba)"
        correctAnswer: bibi
        rationale: "Une BI y BI → 'bibi' (apelativo de bebida infantil)."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "BA + ÑO = (buño/baño/beño)"
        correctAnswer: baño
        rationale: "Une BA y ÑO → 'baño'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "BE + BÉ = (bobé/bebe/bebé)"
        correctAnswer: bebé
        rationale: "Une BE y BÉ → 'bebé'."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "BO + LA = (bala/bula/bola)"
        correctAnswer: bola
        rationale: "Une BO y LA → 'bola'."
        difficulty: 1
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Completa la Palabra
    description: Elige la sílaba que completa la palabra.
    exercises:
      - type: reading
        question: "___ta (bolsa): falta sílaba (BA/BE/BO)"
        correctAnswer: BO
        rationale: "Primero piensa: BO + TA = 'bota' (calzado)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "bi___ (bici): falta sílaba (CI/CO/CA)"
        correctAnswer: CI
        rationale: "BI + CI = 'bici'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "ta___ (taba): falta sílaba (BA/BE/BO)"
        correctAnswer: BA
        rationale: "TA + BA = 'taba' (hueso del juego)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "___rro (forma 'burro'): (BA/BU/BO)"
        correctAnswer: BU
        rationale: "BU + RRO = 'burro'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "la___ (labio): (BA/BIO/BU)"
        correctAnswer: BIO
        rationale: "LA + BIO = 'labio'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "tu___ (tubo): (BA/BE/BO)"
        correctAnswer: BO
        rationale: "TU + BO = 'tubo' (cilindro)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "___tón (botón): (BA/BE/BO)"
        correctAnswer: BO
        rationale: "BO + TÓN = 'botón'."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "___jo (bajo): (BE/BA/BU)"
        correctAnswer: BA
        rationale: "BA + JO = 'bajo' (estatura corta)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "sa___ (sabe): (BE/BA/BI)"
        correctAnswer: BE
        rationale: "SA + BE = 'sabe' (del verbo saber)."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "ca___ (cabe): (BE/BA/BO)"
        correctAnswer: BE
        rationale: "CA + BE = 'cabe' (del verbo caber)."
        difficulty: 2
        objectives: [es.pre_reading]
target: 20
