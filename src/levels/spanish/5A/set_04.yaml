    title: Cuenta las Sílabas
    description: Determina el número de sílabas.
    exercises:
      - type: reading
        question: "¿Cuántas sílabas tiene 'pan'? (1/2/3)"
        correctAnswer: 1
        rationale: "'Pan' se pronuncia en un solo golpe de voz: monosílaba."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'casa'? (1/2/3)"
