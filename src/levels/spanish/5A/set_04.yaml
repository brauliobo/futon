        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'mesa'? (1/2/3)"
        correctAnswer: 2
        rationale: "ME-SA: dos sílabas."
        difficulty: 2
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas sílabas tiene 'pez'? (1/2/3)"
        correctAnswer: 1
