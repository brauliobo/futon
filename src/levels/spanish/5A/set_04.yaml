title: 🔤 Separación de Sílabas - Dos Sílabas
level: 5A
subject: spanish
difficulty: 1
objectives:
  - es.pre_reading
authorNotes: "División silábica de palabras bisílabas. Primero pronuncia la palabra en voz alta; cada golpe de voz es una sílaba."
example: "'casa' se divide en → ca-sa (dos sílabas)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: División en Dos Partes
    description: Divide correctamente cada palabra bisílaba.
    exercises:
      - type: reading
        question: "División de 'casa' (c-asa/ca-sa/cas-a)"
        correctAnswer: ca-sa
        rationale: "Primero pronuncia: CA-SA; la vocal y la consonante siguiente empiezan una nueva sílaba."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'mesa' (me-sa/mes-a/m-esa)"
        correctAnswer: me-sa
        rationale: "Pronuncia ME-SA; se divide entre las dos sílabas."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'gato' (ga-to/gat-o/g-ato)"
        correctAnswer: ga-to
        rationale: "Pronuncia GA-TO; la consonante t va con la vocal que sigue."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'sol' (so-l/sol/s-ol)"
        correctAnswer: sol
        rationale: "'Sol' es monosílaba; tiene una sola sílaba."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'pato' (pa-to/pat-o/p-ato)"
        correctAnswer: pa-to
        rationale: "Pronuncia PA-TO; dos golpes de voz."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'libro' (li-bro/lib-ro/l-ibro)"
        correctAnswer: li-bro
        rationale: "Pronuncia LI-BRO; el grupo 'br' no se separa."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'pelo' (pe-lo/pel-o/p-elo)"
        correctAnswer: pe-lo
        rationale: "Pronuncia PE-LO; dos sílabas iguales."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'mano' (ma-no/man-o/m-ano)"
        correctAnswer: ma-no
        rationale: "Pronuncia MA-NO; la n va con la o."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'taza' (ta-za/taz-a/t-aza)"
        correctAnswer: ta-za
        rationale: "Pronuncia TA-ZA; dos sílabas."
        difficulty: 1
        objectives: [es.pre_reading]
      - type: reading
        question: "División de 'loro' (lo-ro/lor-o/l-oro)"
        correctAnswer: lo-ro
        rationale: "Pronuncia LO-RO; dos sílabas."
        difficulty: 1
        objectives: [es.pre_reading]
