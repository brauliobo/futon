title: Condicional Simple - Hablaría, Comería
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Condicional simple: infinitivo + -ía/-ías/-ía/-íamos/-íais/-ían (todos los verbos regulares). Expresa hipótesis, deseo cortés, acción futura en el pasado. Irregulares: los mismos del futuro (tendr-, vendr-, pondr-, saldr-, querr-, poder→podr-, saber→sabr-, hacer→har-, decir→dir-)."
example: "hablar → hablaría. comer → comería. tener (irreg.) → tendría. hacer (irreg.) → haría. decir (irreg.) → diría."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Condicional Regular
    description: Elige la forma correcta del condicional simple.
    exercises:
      - type: grammar
        question: "'Si tuviera tiempo, yo ___ más' (estudiar) (estudiaría/estudiaré/estudiaba)"
        correctAnswer: estudiaría
        rationale: "Condicional de 'estudiar': estudiaría."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Tú ___ conmigo a la fiesta?' (venir) (vendrías/vendrás/venías)"
        correctAnswer: vendrías
        rationale: "Condicional irreg. de 'venir': vendrías."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ de viaje si pudiera' (ir) (iría/irá/iba)"
        correctAnswer: iría
        rationale: "Condicional de 'ir': iría."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ pizza todos los días' (comer) (comeríamos/comeríais/comeremos)"
        correctAnswer: comeríamos
        rationale: "Condicional 1ª pl. de 'comer': comeríamos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vosotros ___ más rápido con práctica' (correr) (correríais/corréis/corriríais)"
        correctAnswer: correríais
        rationale: "Condicional 2ª pl. de 'correr': correríais."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ en silencio toda la noche' (hablar) (hablarían/hablarán/hablaban)"
        correctAnswer: hablarían
        rationale: "Condicional 3ª pl. de 'hablar': hablarían."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ ese trabajo si me lo ofrecieran' (aceptar) (aceptaría/aceptaré/aceptaba)"
        correctAnswer: aceptaría
        rationale: "Condicional 1ª sing. de 'aceptar': aceptaría."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Me ___ un favor?' (hacer/tú) (harías/harás/hacías)"
        correctAnswer: harías
        rationale: "Condicional irreg. de 'hacer': harías."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El médico dijo que yo ___ descansar' (deber) (debería/deberé/debía)"
        correctAnswer: debería
        rationale: "Condicional de 'deber': debería (futuro en el pasado)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Tú ___ vivir en el campo?' (preferir) (preferirías/preferirás/preferías)"
        correctAnswer: preferirías
        rationale: "Condicional 2ª sing. de 'preferir': preferirías."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Condicional Irregular y Usos
    description: Elige la forma o el uso correcto del condicional.
    exercises:
      - type: grammar
        question: "Condicional irregular de 'tener' (yo): (tendría/tenaría/tendré)"
        correctAnswer: tendría
        rationale: "Irreg.: ten- → tendr- → tendría."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Condicional irregular de 'poder' (ellos): (podrían/poderían/podrán)"
        correctAnswer: podrían
        rationale: "Irreg.: pod- → podr- → podrían."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Condicional irregular de 'saber' (nosotros): (sabríamos/saberíamos/sabremos)"
        correctAnswer: sabríamos
        rationale: "Irreg.: sab- → sabr- → sabríamos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Condicional irregular de 'decir' (tú): (dirías/decirías/dirás)"
        correctAnswer: dirías
        rationale: "Irreg.: dec- → dir- → dirías."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Condicional irregular de 'salir' (yo): (saldría/salería/saldré)"
        correctAnswer: saldría
        rationale: "Irreg.: sal- → saldr- → saldría."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa 'Me ___ una taza de té'? (apetecería/apetecerá/apeteció)"
        correctAnswer: apetecería
        rationale: "Petición cortés → condicional: me apetecería."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ tan amable de abrir la ventana?' (Sería/Será/Fue)"
        correctAnswer: Sería
        rationale: "Cortesía → condicional: ¿Sería tan amable...?"
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración hipotética correcta: (Si llovería, me quedaré en casa./Si lloviera, me quedaría en casa./Si llueve, me quedaría en casa.)"
        correctAnswer: Si lloviera, me quedaría en casa.
        rationale: "Hipótesis: si + imperfecto subjuntivo + condicional."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella dijo que ___ temprano' (volver) (volvería/volverá/volvía)"
        correctAnswer: volvería
        rationale: "Futuro en el pasado (estilo indirecto) → condicional: volvería."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Con más dinero, ___ una casa más grande' (comprar/nosotros) (compraríamos/compraremos/comprábamos)"
        correctAnswer: compraríamos
        rationale: "Hipótesis → condicional: compraríamos."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
