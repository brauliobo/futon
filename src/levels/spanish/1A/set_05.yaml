title: 📖 Lectura Narrativa - Un Día en el Campo
level: 1A
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Lectura narrativa con tiempos mixtos (indefinido + imperfecto). Distinguir información explícita de inferencias. Leer en orden antes de responder."
example: "Localiza la respuesta en el texto. Ej.: ¿Dónde estaban? → en el campo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El domingo pasado mi familia y yo fuimos al campo. Hacía mucho sol y había una brisa agradable. Llevamos una manta, comida y una pelota. Mientras mi padre preparaba la barbacoa, mi hermana y yo jugábamos cerca del río. El agua estaba fría pero nos mojamos los pies. A mediodía comimos juntos bajo un árbol enorme. Por la tarde recogimos flores silvestres y mi madre las puso en un jarrón cuando llegamos a casa. Fue un día perfecto."
    exercises:
      - type: reading
        question: "¿Cuándo fue la excursión? (el sábado/el domingo/el lunes)"
        correctAnswer: el domingo
        rationale: "El texto: 'El domingo pasado'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo era el tiempo? (nublado/soleado/lluvioso)"
        correctAnswer: soleado
        rationale: "El texto: 'Hacía mucho sol y había una brisa agradable'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué no llevaron? (manta/pelota/paraguas)"
        correctAnswer: paraguas
        rationale: "El texto solo menciona 'una manta, comida y una pelota'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué hacía el padre? (jugaba/preparaba la barbacoa/dormía)"
        correctAnswer: preparaba la barbacoa
        rationale: "El texto: 'mi padre preparaba la barbacoa'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo estaba el agua del río? (caliente/fría/templada)"
        correctAnswer: fría
        rationale: "El texto: 'El agua estaba fría'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde comieron al mediodía? (en casa/junto al río/bajo un árbol)"
        correctAnswer: bajo un árbol
        rationale: "El texto: 'comimos juntos bajo un árbol enorme'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué recogieron por la tarde? (setas/flores silvestres/fruta)"
        correctAnswer: flores silvestres
        rationale: "El texto: 'recogimos flores silvestres'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quién puso las flores en el jarrón? (la hermana/el padre/la madre)"
        correctAnswer: la madre
        rationale: "El texto: 'mi madre las puso en un jarrón'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo puso las flores en el jarrón? (en el campo/al llegar a casa/a mediodía)"
        correctAnswer: al llegar a casa
        rationale: "El texto: 'cuando llegamos a casa'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo describe el narrador el día? (aburrido/cansado/perfecto)"
        correctAnswer: perfecto
        rationale: "El texto: 'Fue un día perfecto'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 10
