title: Revisión General 1A
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Repaso integrado de todos los contenidos del nivel 1A: pretérito indefinido, imperfecto, contraste, condicional, subjuntivo, ser/estar, complementos, posesivos, preposiciones, negación, perífrasis."
example: "Aplica todos los recursos aprendidos. Identifica primero qué tipo de ejercicio es antes de responder."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Repaso Gramatical
    description: Elige la opción correcta en cada caso.
    exercises:
      - type: grammar
        question: "'Ayer yo ___ al cine' (ir) (iba/fui/iré)"
        correctAnswer: fui
        rationale: "Indefinido: acción puntual pasada → fui."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'De niño siempre ___ en bicicleta' (ir) (fui/iba/iré)"
        correctAnswer: iba
        rationale: "Imperfecto: hábito pasado → iba."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Si tuviera dinero, ___ un coche nuevo' (comprar) (compraré/comprara/compraría)"
        correctAnswer: compraría
        rationale: "Hipótesis con condicional: compraría."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Quiero que tú ___ más despacio' (hablar) (hablas/hables/hablarás)"
        correctAnswer: hables
        rationale: "Querer que → subjuntivo: hables."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi hermano ___ médico' (es/está)"
        correctAnswer: es
        rationale: "Profesión permanente → ser."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La sopa ___ lista' (sentido: preparada) (es/está)"
        correctAnswer: está
        rationale: "'Estar listo' = preparado (resultado)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ doy un regalo a mi hermana' (pronombre CI) (Le/Les/Me)"
        correctAnswer: Le
        rationale: "CI singular → le."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No tengo ___ problema' (algún/ningún/nunca)"
        correctAnswer: ningún
        rationale: "No + ningún + sustantivo masc. → ningún problema."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vamos a ___ mañana temprano' (salir) (salemos/salimos/salir)"
        correctAnswer: salir
        rationale: "Ir a + infinitivo: vamos a salir."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella acaba ___ llegar' (a/de/con)"
        correctAnswer: de
        rationale: "Perífrasis acabar de + infinitivo."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Repaso Integrado
    description: Completa con la opción correcta.
    exercises:
      - type: grammar
        question: "'___ hermanos sois?' (Cuántos/Cuántas/Cuál)"
        correctAnswer: Cuántos
        rationale: "'Hermanos' masc. pl. → cuántos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ casa tiene garaje' (Nuestro/Nuestra/Nuestros)"
        correctAnswer: Nuestra
        rationale: "Nuestra + casa (fem. sing.) → nuestra."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El tren ___ con retraso ayer' (llegó/llegaba/llegará)"
        correctAnswer: llegó
        rationale: "Acción puntual pasada → indefinido: llegó."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El libro es ___ mi amigo' (por/para/con) - (se lo regalo)"
        correctAnswer: para
        rationale: "'Para' indica destinatario del regalo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ no viniste?' Respuesta: '___ estaba cansado.' (Por qué / Porque)"
        correctAnswer: Por qué / Porque
        rationale: "Pregunta: por qué (dos palabras). Respuesta: porque (una palabra)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ hablar más claro' (tienes que/acabas de/estás)"
        correctAnswer: tienes que
        rationale: "Obligación → tener que: tienes que hablar más claro."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Cuánto ___ el billete?' (costar) (cuesta/coste/costa)"
        correctAnswer: cuesta
        rationale: "o→ue en 3ª sing.: cuesta."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Tipo de tiempo para descripción en el pasado: (indefinido/imperfecto/condicional)"
        correctAnswer: imperfecto
        rationale: "Descripción en el pasado → imperfecto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ojalá ___ buen tiempo' (hace/haga/hará)"
        correctAnswer: haga
        rationale: "Ojalá + subjuntivo: haga buen tiempo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué expresa 'acabar de + infinitivo'? (futuro próximo/obligación/pasado reciente)"
        correctAnswer: pasado reciente
        rationale: "Acabar de = hace muy poco (acabo de llegar = acabo de llegar)."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
