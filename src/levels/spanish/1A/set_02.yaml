title: Pretérito Indefinido Irregular - Fui, Hice, Tuve
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Irregulares frecuentes: ser/ir → fui/fuiste/fue; hacer → hice/hiciste/hizo; tener → tuve/tuviste/tuvo; poder → pude; poner → puse; venir → vine; decir → dije; querer → quise."
example: "ir/ser: fui, fuiste, fue, fuimos, fuisteis, fueron. hacer: hice, hiciste, hizo."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Ser, Ir y Hacer
    description: Elige la forma irregular correcta.
    exercises:
      - type: grammar
        question: "'Ayer yo ___ al cine' (ir) (iba/fui/iré)"
        correctAnswer: fui
        rationale: "Indefinido irreg. de 'ir': fui."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ muy amable ayer' (ser) (eras/fuiste/serás)"
        correctAnswer: fuiste
        rationale: "Indefinido irreg. de 'ser': fuiste (igual que 'ir')."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ los deberes rápido' (hacer) (hacía/hizo/hará)"
        correctAnswer: hizo
        rationale: "Indefinido 3ª sing. de 'hacer': hizo (c→z ante o)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ de vacaciones en julio' (ir) (íbamos/fuimos/iremos)"
        correctAnswer: fuimos
        rationale: "Indefinido 1ª pl. de 'ir': fuimos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vosotros ___ los primeros' (ser) (erais/fuisteis/seréis)"
        correctAnswer: fuisteis
        rationale: "Indefinido 2ª pl. de 'ser': fuisteis."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ una gran fiesta' (hacer) (hacían/hicieron/harán)"
        correctAnswer: hicieron
        rationale: "Indefinido 3ª pl. de 'hacer': hicieron."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ lo mejor que pude' (hacer) (hacía/hice/haré)"
        correctAnswer: hice
        rationale: "Indefinido 1ª sing. de 'hacer': hice."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ presidenta del club' (ser) (era/fue/sería)"
        correctAnswer: fue
        rationale: "Indefinido 3ª sing. de 'ser': fue."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Adónde ___ tú ayer?' (ir) (ibas/fuiste/irás)"
        correctAnswer: fuiste
        rationale: "Indefinido 2ª sing. de 'ir': fuiste."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los estudiantes ___ una excursión' (hacer) (hacían/hicieron/harán)"
        correctAnswer: hicieron
        rationale: "Indefinido 3ª pl. de 'hacer': hicieron."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Tener, Poder, Venir, Decir
    description: Elige la forma irregular correcta.
    exercises:
      - type: grammar
        question: "'Yo ___ mucho trabajo ayer' (tener) (tenía/tuve/tendré)"
        correctAnswer: tuve
        rationale: "Indefinido irreg. de 'tener': tuve."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú no ___ venir a la reunión' (poder) (podías/pudiste/podrás)"
        correctAnswer: pudiste
        rationale: "Indefinido irreg. de 'poder': pudiste."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ a visitarme el domingo' (venir) (venía/vino/vendrá)"
        correctAnswer: vino
        rationale: "Indefinido irreg. de 'venir': vino."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ la verdad' (decir) (decíamos/dijimos/diremos)"
        correctAnswer: dijimos
        rationale: "Indefinido irreg. de 'decir': dijimos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vosotros ___ los libros encima de la mesa' (poner) (poníais/pusisteis/pondréis)"
        correctAnswer: pusisteis
        rationale: "Indefinido irreg. de 'poner': pusisteis."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ que salir corriendo' (tener) (tenían/tuvieron/tendrán)"
        correctAnswer: tuvieron
        rationale: "Indefinido irreg. de 'tener': tuvieron."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ la noticia por la radio' (saber) (sabía/supe/sabré)"
        correctAnswer: supe
        rationale: "Indefinido irreg. de 'saber': supe."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ muy mal lo que dijiste' (querer) (querías/quisiste/querrás)"
        correctAnswer: quisiste
        rationale: "Indefinido irreg. de 'querer': quisiste."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El tren ___ con retraso' (venir) (venía/vino/vendrá)"
        correctAnswer: vino
        rationale: "Indefinido 3ª sing. de 'venir': vino."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellas ___ todo lo necesario para la fiesta' (traer) (traían/trajeron/traerán)"
        correctAnswer: trajeron
        rationale: "Indefinido irreg. de 'traer': trajeron."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
