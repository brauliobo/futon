title: Lectura Argumentativa - Las Redes Sociales
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Texto argumentativo con léxico más elevado. Identificar la tesis, los argumentos a favor y en contra, y la conclusión. Vocabulario formal. Inferir significados por contexto."
example: "texto argumentativo → tesis (postura principal) → argumentos a favor → contra-argumentos → conclusión. En el texto: tesis 'uso consciente' → argumentos (conectar/difundir) vs. críticas (ansiedad/falsedades) → conclusión: educar a los usuarios."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 35
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: Las redes sociales forman parte de la vida cotidiana de millones de personas en todo el mundo. Sus defensores argumentan que permiten mantener el contacto con amigos y familiares lejanos, difundir información de forma rápida y acceder a comunidades con intereses similares. Sin embargo, los críticos señalan que fomentan la comparación social y la envidia, reducen la atención y favorecen la difusión de noticias falsas. Estudios recientes indican que el uso excesivo de redes sociales está relacionado con mayores niveles de ansiedad y soledad, especialmente en adolescentes. Pese a ello, prohibirlas no parece una solución realista ni eficaz. La clave reside en educar a los usuarios para que hagan un uso consciente y equilibrado de estas plataformas."
    exercises:
      - type: reading
        question: "¿Cuál es la tesis del texto? (las redes son peligrosas/hay que prohibirlas/deben usarse de forma consciente)"
        correctAnswer: deben usarse de forma consciente
        rationale: "La conclusión: 'educar...para que hagan un uso consciente y equilibrado'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué ventaja citan los defensores? (acceso a noticias/mantener contacto con lejanos/ganar dinero)"
        correctAnswer: mantener contacto con lejanos
        rationale: "El texto: 'mantener el contacto con amigos y familiares lejanos'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "Según los críticos, ¿qué fomentan las redes? (la creatividad/la comparación social/el aprendizaje)"
        correctAnswer: la comparación social
        rationale: "El texto: 'fomentan la comparación social y la envidia'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué propagan negativamente las redes, según el texto? (datos personales/noticias falsas/anuncios)"
        correctAnswer: noticias falsas
        rationale: "El texto: 'favorecen la difusión de noticias falsas'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Con qué se relaciona el uso excesivo? (bienestar/ansiedad y soledad/creatividad)"
        correctAnswer: ansiedad y soledad
        rationale: "El texto: 'mayores niveles de ansiedad y soledad'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿A quiénes afecta especialmente? (mayores/adultos/adolescentes)"
        correctAnswer: adolescentes
        rationale: "El texto: 'especialmente en adolescentes'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué postura tiene el texto sobre prohibirlas? (favorable/neutral/contraria)"
        correctAnswer: contraria
        rationale: "El texto: 'prohibirlas no parece una solución realista ni eficaz'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué significa 'difundir' en este contexto? (esconder/destruir/propagar y extender)"
        correctAnswer: propagar y extender
        rationale: "'Difundir información' = propagar, hacer que se conozca ampliamente."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la solución propuesta? (más control/educación del usuario/menos tecnología)"
        correctAnswer: educación del usuario
        rationale: "El texto: 'La clave reside en educar a los usuarios'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tipo de texto es este? (narrativo/descriptivo/argumentativo)"
        correctAnswer: argumentativo
        rationale: "Presenta argumentos a favor y en contra y concluye con una postura."
        difficulty: 4
        objectives: [es.pre_reading]
target: 10
