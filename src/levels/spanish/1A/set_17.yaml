title: Preposiciones - A, En, De, Con, Sin, Para, Por
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Usos clave: A (dirección, hora, CI, personal). EN (lugar/posición, medio de transporte, período). DE (origen, posesión, material, partitivo). CON (compañía, instrumento). SIN (ausencia). PARA (finalidad, destinatario, opinión). POR (causa, duración, intercambio, agente pasiva)."
example: "Voy a Madrid. Estoy en casa. Soy de España. Lo hago con cuidado. Sin ti. Para ti. Por ti."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: A, En, De
    description: Elige la preposición correcta.
    exercises:
      - type: grammar
        question: "'Voy ___ la tienda' (a/en/de)"
        correctAnswer: a
        rationale: "'A' indica dirección/movimiento hacia un lugar."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estoy ___ casa ahora mismo' (a/en/de)"
        correctAnswer: en
        rationale: "'En' indica posición/ubicación: estoy en casa."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Soy ___ Argentina' (a/en/de)"
        correctAnswer: de
        rationale: "'De' indica origen: soy de Argentina."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La reunión es ___ las tres' (a/en/de)"
        correctAnswer: a
        rationale: "'A' + hora: la reunión es a las tres."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El libro ___ matemáticas está encima de la mesa' (a/en/de)"
        correctAnswer: de
        rationale: "'De' indica posesión/categoría: libro de matemáticas."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Viajamos ___ tren' (a/en/de)"
        correctAnswer: en
        rationale: "'En' + medio de transporte: viajamos en tren."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llamo ___ mi madre cada día' (a/en/de)"
        correctAnswer: a
        rationale: "'A' personal (complemento directo de persona)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La mesa es ___ madera' (a/en/de)"
        correctAnswer: de
        rationale: "'De' indica material: mesa de madera."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nació ___ enero' (a/en/de)"
        correctAnswer: en
        rationale: "'En' + mes/año/estación: nació en enero."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ dónde eres?' (A/En/De)"
        correctAnswer: De
        rationale: "'¿De dónde?' pregunta el origen."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Con, Sin, Para, Por
    description: Elige la preposición correcta.
    exercises:
      - type: grammar
        question: "'Prefiero el café ___ leche' (con/sin/para)"
        correctAnswer: con
        rationale: "'Con' indica compañía/contenido: café con leche."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No puedo vivir ___ música' (con/sin/para)"
        correctAnswer: sin
        rationale: "'Sin' indica ausencia: no puedo vivir sin música."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Este regalo es ___ ti' (con/sin/para)"
        correctAnswer: para
        rationale: "'Para' indica destinatario: este regalo es para ti."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Lo hice ___ amor' (con/sin/por)"
        correctAnswer: por
        rationale: "'Por' indica causa/motivación: lo hice por amor."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Estudio ___ ser médico' (con/para/por)"
        correctAnswer: para
        rationale: "'Para' indica finalidad/objetivo: estudio para ser médico."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El paquete fue enviado ___ correo' (con/por/para)"
        correctAnswer: por
        rationale: "'Por' indica medio de envío: enviado por correo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Trabajé allí ___ dos años' (por/para/con)"
        correctAnswer: por
        rationale: "'Por' indica duración: trabajé por dos años."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Te cambio este libro ___ el tuyo' (con/por/para)"
        correctAnswer: por
        rationale: "'Por' indica intercambio: cambio esto por eso."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vino ___ su hermano' (con/para/por)"
        correctAnswer: con
        rationale: "'Con' indica compañía: vino con su hermano."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ mí, es la mejor ciudad del mundo' (Con/Sin/Para)"
        correctAnswer: Para
        rationale: "'Para' introduce opinión personal: para mí (en mi opinión)."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
