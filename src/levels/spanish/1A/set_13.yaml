title: Lectura Descriptiva - La Ciudad
level: 1A
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Texto descriptivo urbano con vocabulario de ciudad. Identificar datos, inferir significados por contexto, reconocer relaciones causales."
example: "Lee con atención. Las preguntas siguen el orden del texto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La ciudad de Vallefrío tiene doscientos mil habitantes y está situada entre montañas. Su centro histórico, declarado Patrimonio de la Humanidad en 1998, conserva calles empedradas y edificios del siglo XVIII. La plaza mayor es el corazón de la ciudad: allí se celebran mercados los jueves y conciertos en verano. El río Clar atraviesa la ciudad de norte a sur y ofrece un paseo arbolado muy popular entre los ciudadanos. El transporte público incluye autobús, tranvía y dos líneas de metro. Muchos jóvenes prefieren moverse en bicicleta gracias a la extensa red de carriles bici construida en 2015. Vallefrío recibe cada año más de un millón de turistas, atraídos principalmente por su gastronomía y su arquitectura."
    exercises:
      - type: reading
        question: "¿Cuántos habitantes tiene Vallefrío? (veinte mil/doscientos mil/dos millones)"
        correctAnswer: doscientos mil
        rationale: "El texto: 'doscientos mil habitantes'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde está situada la ciudad? (junto al mar/entre montañas/en una llanura)"
        correctAnswer: entre montañas
        rationale: "El texto: 'está situada entre montañas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué año el centro histórico fue declarado Patrimonio? (1988/1998/2008)"
        correctAnswer: 1998
        rationale: "El texto: 'declarado Patrimonio de la Humanidad en 1998'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo hay mercado en la plaza mayor? (los lunes/los jueves/los sábados)"
        correctAnswer: los jueves
        rationale: "El texto: 'mercados los jueves'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué dirección atraviesa el río la ciudad? (este a oeste/norte a sur/sur a norte)"
        correctAnswer: norte a sur
        rationale: "El texto: 'de norte a sur'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué medios de transporte público hay? (solo bus/bus y metro/bus, tranvía y metro)"
        correctAnswer: bus, tranvía y metro
        rationale: "El texto: 'autobús, tranvía y dos líneas de metro'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo se construyó la red de carriles bici? (2005/2010/2015)"
        correctAnswer: 2015
        rationale: "El texto: 'construida en 2015'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Quiénes prefieren la bicicleta? (los turistas/los mayores/los jóvenes)"
        correctAnswer: los jóvenes
        rationale: "El texto: 'Muchos jóvenes prefieren moverse en bicicleta'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos turistas recibe al año? (cien mil/medio millón/más de un millón)"
        correctAnswer: más de un millón
        rationale: "El texto: 'más de un millón de turistas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué vienen principalmente los turistas? (por el clima/por la gastronomía y arquitectura/por los conciertos)"
        correctAnswer: por la gastronomía y arquitectura
        rationale: "El texto: 'atraídos principalmente por su gastronomía y su arquitectura'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 10
