title: Lectura Narrativa - Una Receta de Cocina
level: 1A
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Texto instructivo/narrativo con léxico culinario. Identificar pasos, cantidades, tiempos. Distinguir detalles explícitos de inferencias."
example: "Lee el texto → localiza los números y cantidades → sigue el orden de los pasos → identifica ingredientes y acciones. Las respuestas están en el texto."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La tortilla española es uno de los platos más tradicionales de España. Para hacerla necesitas seis huevos, cuatro patatas medianas, una cebolla, aceite de oliva y sal. Primero pela las patatas y la cebolla y córtalas en láminas finas. Después fríelas en abundante aceite caliente durante unos quince minutos a fuego lento. Bate los huevos en un bol grande y añade las patatas escurridas. Echa sal al gusto. Calienta dos cucharadas de aceite en una sartén antiadherente y vierte la mezcla. Cuando los bordes estén cuajados, dale la vuelta con un plato. Cocina dos minutos más y sirve caliente o a temperatura ambiente. La tortilla es perfecta tanto para el desayuno como para la cena."
    exercises:
      - type: reading
        question: "¿Cuántos huevos necesitas? (cuatro/seis/ocho)"
        correctAnswer: seis
        rationale: "El texto: 'seis huevos'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántas patatas se necesitan? (dos/tres/cuatro)"
        correctAnswer: cuatro
        rationale: "El texto: 'cuatro patatas medianas'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tipo de aceite se usa? (de girasol/de oliva/de maíz)"
        correctAnswer: de oliva
        rationale: "El texto: 'aceite de oliva'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuánto tiempo se fríen las patatas? (cinco minutos/quince minutos/media hora)"
        correctAnswer: quince minutos
        rationale: "El texto: 'unos quince minutos a fuego lento'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Dónde se baten los huevos? (en la sartén/en un bol grande/en un vaso)"
        correctAnswer: en un bol grande
        rationale: "El texto: 'Bate los huevos en un bol grande'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué tipo de sartén se usa para cuajar la mezcla? (de hierro/antiadherente/de barro)"
        correctAnswer: antiadherente
        rationale: "El texto: 'sartén antiadherente'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuándo se da la vuelta a la tortilla? (cuando está dorada/cuando los bordes estén cuajados/después de diez minutos)"
        correctAnswer: cuando los bordes estén cuajados
        rationale: "El texto: 'Cuando los bordes estén cuajados, dale la vuelta'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuántos minutos más se cocina tras dar la vuelta? (uno/dos/cinco)"
        correctAnswer: dos
        rationale: "El texto: 'Cocina dos minutos más'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se sirve la tortilla? (solo caliente/solo fría/caliente o a temperatura ambiente)"
        correctAnswer: caliente o a temperatura ambiente
        rationale: "El texto: 'sirve caliente o a temperatura ambiente'."
        difficulty: 3
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Para qué comidas es perfecta la tortilla? (solo desayuno/solo cena/desayuno y cena)"
        correctAnswer: desayuno y cena
        rationale: "El texto: 'tanto para el desayuno como para la cena'."
        difficulty: 3
        objectives: [es.pre_reading]
target: 10
