title: Indefinido vs Imperfecto - Acción Puntual o Habitual
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Indefinido: acción concreta y terminada (ayer, una vez, el lunes). Imperfecto: hábito, descripción, acción en curso en el pasado (siempre, antes, mientras, de niño). Pensar en el tipo de acción, no solo en los marcadores."
example: "Ayer comí pizza (indefinido — acción puntual). Siempre comía pizza (imperfecto — hábito)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Marcadores de Tiempo
    description: Elige indefinido o imperfecto según el contexto.
    exercises:
      - type: grammar
        question: "'Ayer ___ con mi jefe' (hablar) (hablaba/hablé)"
        correctAnswer: hablé
        rationale: "'Ayer' + acción puntual → indefinido: hablé."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'De niño, siempre ___ en el parque' (jugar) (jugué/jugaba)"
        correctAnswer: jugaba
        rationale: "'De niño, siempre' → hábito pasado → imperfecto: jugaba."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El lunes pasado ella ___ tarde' (llegar) (llegó/llegaba)"
        correctAnswer: llegó
        rationale: "'El lunes pasado' → acción puntual → indefinido: llegó."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Antes nosotros ___ mucho' (estudiar) (estudiamos/estudiábamos)"
        correctAnswer: estudiábamos
        rationale: "'Antes' → hábito → imperfecto: estudiábamos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Una vez ___ perdido en la ciudad' (estar) (estuve/estaba)"
        correctAnswer: estuve
        rationale: "'Una vez' → acción puntual → indefinido: estuve."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mientras llovía, yo ___ un libro' (leer) (leí/leía)"
        correctAnswer: leía
        rationale: "'Mientras' → acción en curso paralela → imperfecto: leía."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El año pasado ___ a Paris' (ir) (iba/fui)"
        correctAnswer: fui
        rationale: "'El año pasado' → acción concreta → indefinido: fui."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Cuando era niño, ___ mucho chocolate' (comer) (comí/comía)"
        correctAnswer: comía
        rationale: "'Cuando era niño' describe estado + hábito → imperfecto: comía."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Esa mañana me ___ a las seis' (despertar) (despertaba/desperté)"
        correctAnswer: desperté
        rationale: "'Esa mañana' + hecho concreto → indefinido: desperté."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Todos los días él ___ al trabajo en bici' (ir) (fue/iba)"
        correctAnswer: iba
        rationale: "'Todos los días' → hábito → imperfecto: iba."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Acción e Interrupción
    description: Elige la combinación correcta de tiempos verbales.
    exercises:
      - type: grammar
        question: "'Mientras ___ (dormir, yo), sonó el teléfono' (dormía/dormí)"
        correctAnswer: dormía
        rationale: "Acción en curso interrumpida → imperfecto: dormía."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Cuando ___ (llegar, ella), nosotros ya estábamos' (llegó/llegaba)"
        correctAnswer: llegó
        rationale: "Llegada como punto concreto → indefinido: llegó."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Antes mis abuelos ___ en el campo' (vivieron/vivían)"
        correctAnswer: vivían
        rationale: "'Antes' → situación pasada habitual → imperfecto: vivían."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'De repente ___ un ruido horrible' (escuché/escuchaba)"
        correctAnswer: escuché
        rationale: "'De repente' → acción puntual → indefinido: escuché."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Cuando entré, él ___ la tele' (vio/veía)"
        correctAnswer: veía
        rationale: "Acción en curso cuando ocurrió otra → imperfecto: veía."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Aquella tarde decidí que ___ a cambiar de trabajo' (iba/fui)"
        correctAnswer: iba
        rationale: "Imperfecto para plan o intención pasada: iba (a cambiar)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige la oración con la secuencia correcta: (Comía cuando llegaste./Comí cuando llegaste./Comiste cuando llegabas.)"
        correctAnswer: Comía cuando llegaste.
        rationale: "Acción continua (comía) interrumpida por acción puntual (llegaste) → correcto."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La película ___ muy aburrida' (fue/era)"
        correctAnswer: era
        rationale: "Descripción de estado → imperfecto: era."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'De pronto, el niño ___ a llorar' (empezaba/empezó)"
        correctAnswer: empezó
        rationale: "Acción súbita puntual → indefinido: empezó."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración correcta con imperfecto e indefinido: (Llovía cuando salí./Llovió cuando salía./Llueve cuando salía.)"
        correctAnswer: Llovía cuando salí.
        rationale: "Lluvia continua (imperfecto) + salida puntual (indefinido) → llovía cuando salí."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
