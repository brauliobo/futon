title: 📝 Complemento Indirecto - Le, Les
level: 1A
subject: spanish
difficulty: 3
objectives:
  - es.pre_reading
authorNotes: "Complemento indirecto (CI): a quién/para quién se realiza la acción. Pronombres átonos: me, te, le, nos, os, les. 'Le/les' → a él/ella/usted/ellos/ellas/ustedes. Anteponerlos al verbo conjugado."
example: "Le doy el libro a María. → le = CI (a María). Les escribo a mis amigos. → les = CI (a mis amigos)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Le y Les
    description: Elige el pronombre de complemento indirecto correcto.
    exercises:
      - type: grammar
        question: "'___ doy un regalo a mi madre' (Le/Les/Me)"
        correctAnswer: Le
        rationale: "CI singular (a mi madre) → le."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ escribo una carta a mis abuelos' (Le/Les/Te)"
        correctAnswer: Les
        rationale: "CI plural (a mis abuelos) → les."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ dices la verdad a tu amigo?' (Le/Les/Se)"
        correctAnswer: Le
        rationale: "CI singular (a tu amigo) → le."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ mando un correo a los clientes' (Le/Les/Nos)"
        correctAnswer: Les
        rationale: "CI plural (a los clientes) → les."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El médico ___ receta medicamentos' (le/les/se) - (al paciente)"
        correctAnswer: le
        rationale: "CI singular (al paciente) → le."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El profesor ___ explica la lección' (le/les/se) - (a los alumnos)"
        correctAnswer: les
        rationale: "CI plural (a los alumnos) → les."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ pido un favor a usted' (Le/Les/Me)"
        correctAnswer: Le
        rationale: "CI singular de cortesía (a usted) → le."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ preguntamos la hora a los turistas' (Le/Les/Os)"
        correctAnswer: Les
        rationale: "CI plural (a los turistas) → les."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La abuela ___ hace calcetines a los nietos' (le/les/os)"
        correctAnswer: les
        rationale: "CI plural (a los nietos) → les."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ cuento un cuento a mi hija' (Le/Les/Te)"
        correctAnswer: Le
        rationale: "CI singular (a mi hija) → le."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Pronombres con Énfasis
    description: Elige la oración con complemento indirecto correcto.
    exercises:
      - type: grammar
        question: "Oración correcta: (Le doy a ella el libro./Les doy a ella el libro./Le doy el libro a ellos.)"
        correctAnswer: Le doy a ella el libro.
        rationale: "'a ella' → CI singular → le doy."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración correcta: (Les envío a ellos el paquete./Le envío a ellos el paquete./Les envío a él el paquete.)"
        correctAnswer: Les envío a ellos el paquete.
        rationale: "'a ellos' → CI plural → les envío."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿___ das el bolígrafo a mí?' (Me/Le/Te)"
        correctAnswer: Me
        rationale: "CI de primera persona (a mí) → me."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ traes el café a nosotros' (me/nos/les)"
        correctAnswer: nos
        rationale: "CI de primera persona plural (a nosotros) → nos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ presta dinero a vosotros' (les/os/nos)"
        correctAnswer: os
        rationale: "CI de segunda persona plural (a vosotros) → os."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ mandamos flores a ti' (Le/Te/Me)"
        correctAnswer: Te
        rationale: "CI segunda persona singular (a ti) → te."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el CI? 'El niño le da flores a su madre' (el niño/flores/a su madre)"
        correctAnswer: a su madre
        rationale: "El CI responde '¿a quién?': a su madre."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el pronombre CI correcto? 'Escribo una carta ___ a mis padres' (le/les/me)"
        correctAnswer: les
        rationale: "'a mis padres' = plural → les."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración con CI y CD correcta: (Le lo doy./Se lo doy./Lo le doy.)"
        correctAnswer: Se lo doy.
        rationale: "Cuando CI (le/les) va antes de CD (lo/la/los/las), le/les → se."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿A quién ___ dices eso?' (le/les/me) - (a tu hermano)"
        correctAnswer: le
        rationale: "CI singular (a tu hermano) → le."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
