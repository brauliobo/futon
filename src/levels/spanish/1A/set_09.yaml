title: Ser vs Estar - Diferencias Clave
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "SER: identidad, origen, material, profesión, características permanentes, hora/fecha, pasiva ser+part. ESTAR: estado temporal, ubicación, resultado de acción, estar+gerundio. Algunos adjetivos cambian de significado con ser vs estar (aburrido, listo, malo, bueno, rico, seguro)."
example: "ser → profesión/característica/origen: 'es médico', 'es bonito', 'es de Madrid'; estar → estado temporal/ubicación: 'está enferma', 'está en la mesa'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Usos Básicos
    description: Elige 'ser' o 'estar' en la forma correcta.
    exercises:
      - type: grammar
        question: "'Mi hermano ___ médico' (es/está)"
        correctAnswer: es
        rationale: "Profesión permanente → ser: es médico."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Hoy María ___ enferma' (es/está)"
        correctAnswer: está
        rationale: "Estado temporal → estar: está enferma."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La reunión ___ en la sala 3' (es/está)"
        correctAnswer: es
        rationale: "Eventos tienen lugar → ser: la reunión es en la sala 3."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El libro ___ encima de la mesa' (es/está)"
        correctAnswer: está
        rationale: "Ubicación de objeto → estar: está encima de la mesa."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ de Madrid' (es/está)"
        correctAnswer: es
        rationale: "Origen → ser: es de Madrid."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los niños ___ jugando en el parque' (son/están)"
        correctAnswer: están
        rationale: "Acción en curso → estar + gerundio: están jugando."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La mesa ___ de madera' (es/está)"
        correctAnswer: es
        rationale: "Material → ser: es de madera."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Dónde ___ el banco más cercano?' (es/está)"
        correctAnswer: está
        rationale: "Ubicación → estar: está a dos calles."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Hoy ___ lunes' (es/está)"
        correctAnswer: es
        rationale: "Día de la semana → ser: es lunes."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La puerta ___ abierta' (es/está)"
        correctAnswer: está
        rationale: "Resultado de acción → estar: está abierta."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Adjetivos que Cambian de Significado
    description: Elige ser o estar según el significado.
    exercises:
      - type: grammar
        question: "'El niño ___ aburrido' (sentido: tiene aburrimiento) (es/está)"
        correctAnswer: está
        rationale: "'Estar aburrido' = sentir aburrimiento (estado)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Esta clase ___ aburrida' (sentido: la clase en sí es así) (es/está)"
        correctAnswer: es
        rationale: "'Ser aburrido' = característica intrínseca (es aburrida por naturaleza)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ lista' (sentido: es inteligente) (es/está)"
        correctAnswer: es
        rationale: "'Ser listo' = inteligente (característica)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'La cena ___ lista' (sentido: preparada) (es/está)"
        correctAnswer: está
        rationale: "'Estar listo' = preparado (estado resultante)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ese hombre ___ malo' (sentido: mala persona) (es/está)"
        correctAnswer: es
        rationale: "'Ser malo' = mala persona por naturaleza."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El niño ___ malo' (sentido: enfermo) (es/está)"
        correctAnswer: está
        rationale: "'Estar malo' = estar enfermo (estado temporal)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Este pastel ___ rico' (sentido: tiene buen sabor) (es/está)"
        correctAnswer: está
        rationale: "'Estar rico' = tener buen sabor (estado percibido)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ese hombre ___ rico' (sentido: tiene mucho dinero) (es/está)"
        correctAnswer: es
        rationale: "'Ser rico' = tener riqueza (característica)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige la oración correcta: (Soy cansado./Estoy cansado./Soy cansada de trabajo.)"
        correctAnswer: Estoy cansado.
        rationale: "Cansancio = estado temporal → estar: estoy cansado."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es correcta? (Madrid es en España./Madrid está en España./Madrid ser en España.)"
        correctAnswer: Madrid está en España.
        rationale: "Ubicación geográfica de lugar → estar: Madrid está en España."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
