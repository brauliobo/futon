title: 📝 Negación - No, Nunca, Jamás, Nadie, Nada, Ningún
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Negación simple: 'no' antes del verbo. Negación con indefinidos negativos: nunca/jamás, nadie, nada, ningún/ninguna. Con 'no' + indefinido: doble negación obligatoria (No viene nadie). Sin 'no': el indefinido va antes del verbo (Nadie viene)."
example: "No como nada. / Nada como. → ambos correctos. No viene nunca. / Nunca viene. → ambos correctos."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Negación Simple y Doble
    description: Elige la forma negativa correcta.
    exercises:
      - type: grammar
        question: "Oración correcta: (No viene nadie./No viene alguien./No viene ninguno nadie.)"
        correctAnswer: No viene nadie.
        rationale: "Doble negación: no + nadie → correcto en español."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Equivalente de 'No como nada': (Nada como./Nunca como./Nadie come.)"
        correctAnswer: Nada como.
        rationale: "Indefinido negativo al inicio → sin 'no': nada como."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No lo he visto ___' (para indicar nunca) (siempre/nunca/algo)"
        correctAnswer: nunca
        rationale: "No + nunca = doble negación correcta."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ sabe la respuesta' (para decir que nadie sabe) (Alguien/Nadie/Ninguna)"
        correctAnswer: Nadie
        rationale: "Nadie al inicio = negación sin 'no'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No quiero ___' (nada/algo/todo)"
        correctAnswer: nada
        rationale: "No + nada → doble negación: no quiero nada."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ he estado en Japón' (para nunca jamás) (Siempre/Jamás/Nunca)"
        correctAnswer: Jamás
        rationale: "'Jamás' = nunca de manera enfática; puede ir al inicio sin 'no'."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración correcta: (No tengo ningún problema./No tengo ninguno problema./No tengo algún problema.)"
        correctAnswer: No tengo ningún problema.
        rationale: "No + ningún + sustantivo masculino singular."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No ___ en casa' (hay nadie/hay alguien/está nadie)"
        correctAnswer: hay nadie
        rationale: "No hay nadie → doble negación correcta."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Has comido ___?' Respuesta negativa: (Sí, algo./No, nada./No, ningún.)"
        correctAnswer: No, nada.
        rationale: "Respuesta negativa: no + nada."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre 'no' y 'jamás'? (no = énfasis / jamás = simple/no = simple negación / jamás = nunca en ningún momento/son iguales)"
        correctAnswer: no = simple negación / jamás = nunca en ningún momento
        rationale: "'Jamás' tiene matiz de negación absoluta y enfática."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Ningún, Ninguna y Posición
    description: Elige la negación correcta según el contexto.
    exercises:
      - type: grammar
        question: "'No tengo ___ amigo aquí' (ningún/ninguno/ninguna)"
        correctAnswer: ningún
        rationale: "Ningún + sustantivo masculino: ningún amigo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No me queda ___ idea' (ningún/ninguna/ninguno)"
        correctAnswer: ninguna
        rationale: "Ninguna + sustantivo femenino: ninguna idea."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Hay ___ problema?' Respuesta: 'No, ___ problema.' (algún/ningún)"
        correctAnswer: ningún
        rationale: "Respuesta negativa usa ningún: no, ningún problema."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración correcta: (Nadie no dijo nada./Nadie dijo nada./No dijo nadie no.)"
        correctAnswer: Nadie dijo nada.
        rationale: "Con 'nadie' al inicio, 'no' no es necesario. 'Nada' sí puede seguir."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Tienes algo que decir?' → Respuesta negativa: (Sí, tengo algo./No, no tengo nada./No, tengo algo.)"
        correctAnswer: No, no tengo nada.
        rationale: "Negación de 'algo' → nada: no tengo nada."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Equivalente de 'No lo hago nunca': (Nunca lo hago./Siempre lo hago./Lo hago siempre.)"
        correctAnswer: Nunca lo hago.
        rationale: "Nunca al inicio = equivalente sin doble negación."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'___ de mis amigos vino a la fiesta' (para indicar que ninguno) (Alguno/Ninguno/Alguien)"
        correctAnswer: Ninguno
        rationale: "Ninguno al inicio (sin sustantivo): ninguno de mis amigos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuántas negaciones son correctas aquí? 'No he visto a nadie nunca': (una/dos/tres)"
        correctAnswer: tres
        rationale: "No + nadie + nunca → triple negación válida en español."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración con negación correcta: (Nunca como no./Nunca como nada./No como nada nunca.)"
        correctAnswer: Nunca como nada.
        rationale: "Nunca al inicio + nada → correcto. La tercera también es válida."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'No lo ___ hacer de ___ manera' (puedo/ninguna) (puedo/ninguna/pude/alguna)"
        correctAnswer: puedo/ninguna
        rationale: "No puedo hacerlo de ninguna manera → doble negación."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
