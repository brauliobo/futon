title: ✏️ Perífrasis Verbales - Ir a + Inf, Estar + Gerundio, Tener que + Inf
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Perífrasis: verbo auxiliar + nexo + infinitivo/gerundio. Ir a + inf → futuro próximo. Estar + gerundio → acción en curso. Tener que + inf → obligación. Acabar de + inf → acción inmediatamente pasada. Dejar de + inf → cese de acción."
example: "futuro próximo → ir a + infinitivo: 'voy a estudiar'; acción en curso → estar + gerundio: 'estoy estudiando'; obligación → tener que + infinitivo: 'tengo que estudiar'; acción reciente → acabar de + infinitivo: 'acabo de estudiar'."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Ir a + Infinitivo y Estar + Gerundio
    description: Elige la perífrasis verbal correcta.
    exercises:
      - type: grammar
        question: "'Esta noche ___ en casa' (quedarse/futuro próximo/yo) (acabo de quedar/me voy a quedar/me estoy quedando)"
        correctAnswer: me voy a quedar
        rationale: "Futuro próximo → ir a + infinitivo: me voy a quedar."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Qué ___ hacer tú este verano?' (ir a) (estás/vas a/irás)"
        correctAnswer: vas a
        rationale: "Ir a + inf para futuro: ¿qué vas a hacer?"
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Silencio, el bebé ___ (dormir)' (acaba de dormir/está durmiendo/va a dormir)"
        correctAnswer: está durmiendo
        rationale: "Acción en curso → estar + gerundio: está durmiendo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ el proyecto mañana' (presentar) (acabamos de presentar/vamos a presentar/estamos presentando)"
        correctAnswer: vamos a presentar
        rationale: "Acción futura próxima → ir a: vamos a presentar."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Qué ___ ella en este momento?' (hacer) (está haciendo/va a hacer/tiene que hacer)"
        correctAnswer: está haciendo
        rationale: "'En este momento' → estar + gerundio: está haciendo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ mudarse a otra ciudad' (van a/están/acaban de)"
        correctAnswer: van a
        rationale: "Plan futuro → ir a: van a mudarse."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ mi tesis doctoral' (escribir) (estoy escribiendo/voy a escribir/acabo de escribir)"
        correctAnswer: estoy escribiendo
        rationale: "Proceso en curso → estar + gerundio: estoy escribiendo."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¿Vas a venir a la fiesta?' Respuesta afirmativa: (Sí, voy a ir./Sí, estoy yendo./Sí, acabo de ir.)"
        correctAnswer: Sí, voy a ir.
        rationale: "Afirmación de plan → ir a: sí, voy a ir."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Llueve. ¿Qué ___ hacer?' (tú) (vas a/estás/acabas de)"
        correctAnswer: vas a
        rationale: "¿Qué vas a hacer? → plan o decisión futura."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los obreros ___ el edificio' (construir) (están construyendo/van a construir/acaban de construir)"
        correctAnswer: están construyendo
        rationale: "Trabajo en curso → estar + gerundio: están construyendo."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Tener que, Acabar de, Dejar de
    description: Elige la perífrasis correcta según el significado.
    exercises:
      - type: grammar
        question: "'Yo ___ estudiar más' (obligación) (tengo que/voy a/estoy)"
        correctAnswer: tengo que
        rationale: "Obligación → tener que + inf: tengo que estudiar."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ llegar: está en la puerta' (acaba de/va a/tiene que)"
        correctAnswer: acaba de
        rationale: "Acción inmediatamente pasada → acabar de + inf: acaba de llegar."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ fumar el año pasado' (dejó de/acabó de/tuvo que)"
        correctAnswer: dejó de
        rationale: "Cese de hábito → dejar de + inf: dejó de fumar."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ reservar antes de ir' (tener que) (tenemos que/vamos a/acabamos de)"
        correctAnswer: tenemos que
        rationale: "Obligación → tener que: tenemos que reservar."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'¡Me han contado que ___ nacer tu bebé!' (acaba de/va a/tiene que)"
        correctAnswer: acaba de
        rationale: "Evento muy reciente → acabar de: acaba de nacer."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ ser más puntual' (obligación moral) (tienes que/acabas de/estás)"
        correctAnswer: tienes que
        rationale: "Obligación moral → tener que: tienes que ser puntual."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál expresa acción inmediatamente pasada? (ir a + inf/estar + gerundio/acabar de + inf)"
        correctAnswer: acabar de + inf
        rationale: "Acabar de + infinitivo = hace muy poco (pasado reciente)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál expresa obligación? (ir a + inf/tener que + inf/acabar de + inf)"
        correctAnswer: tener que + inf
        rationale: "Tener que + infinitivo = obligación."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ hablar tanto en clase' (deben dejar de/están dejando/van a dejar)"
        correctAnswer: deben dejar de
        rationale: "Cese de acción con obligación → deber + dejar de (o simplemente dejar de)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Oración correcta con perífrasis: (Estoy de comer./Acabo comer de./Acabo de comer.)"
        correctAnswer: Acabo de comer.
        rationale: "Perífrasis correcta: acabar de + infinitivo."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
