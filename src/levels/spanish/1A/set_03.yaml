title: Pretérito Imperfecto - Hablaba, Comía, Vivía
level: 1A
subject: spanish
difficulty: 4
objectives:
  - es.pre_reading
authorNotes: "Imperfecto: acción habitual o continua en el pasado. -AR → -aba/-abas/-aba/-ábamos/-abais/-aban. -ER/-IR → -ía/-ías/-ía/-íamos/-íais/-ían. Solo 3 irregulares: ser/ir/ver."
example: "hablar: hablaba. comer: comía. vivir: vivía. ser: era. ir: iba. ver: veía."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Imperfecto Regular
    description: Elige la forma del pretérito imperfecto.
    exercises:
      - type: grammar
        question: "'De niño yo ___ mucho' (jugar) (jugué/jugaba/jugaré)"
        correctAnswer: jugaba
        rationale: "Imperfecto habitual 1ª sing. de 'jugar': jugaba."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú siempre ___ tarde' (llegar) (llegaste/llegabas/llegarás)"
        correctAnswer: llegabas
        rationale: "Imperfecto 2ª sing. de 'llegar': llegabas."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mi abuela ___ pasteles cada domingo' (hacer) (hizo/hacía/hará)"
        correctAnswer: hacía
        rationale: "Imperfecto habitual 3ª sing. de 'hacer': hacía."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ en aquel parque' (correr) (corrimos/corríamos/correremos)"
        correctAnswer: corríamos
        rationale: "Imperfecto habitual 1ª pl. de 'correr': corríamos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vosotros ___ todos los días' (estudiar) (estudiasteis/estudiabais/estudiaréis)"
        correctAnswer: estudiabais
        rationale: "Imperfecto 2ª pl. de 'estudiar': estudiabais."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los pájaros ___ cada mañana' (cantar) (cantaron/cantaban/cantarán)"
        correctAnswer: cantaban
        rationale: "Imperfecto habitual 3ª pl. de 'cantar': cantaban."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Yo ___ en esa calle' (vivir) (viví/vivía/viviré)"
        correctAnswer: vivía
        rationale: "Imperfecto continuo 1ª sing. de 'vivir': vivía."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ella ___ mucho cuando era joven' (leer) (leyó/leía/leerá)"
        correctAnswer: leía
        rationale: "Imperfecto habitual 3ª sing. de 'leer': leía."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú ___ siempre la verdad' (decir) (dijiste/decías/dirás)"
        correctAnswer: decías
        rationale: "Imperfecto habitual 2ª sing. de 'decir': decías."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Los alumnos ___ con atención' (escuchar) (escucharon/escuchaban/escucharán)"
        correctAnswer: escuchaban
        rationale: "Imperfecto habitual 3ª pl. de 'escuchar': escuchaban."
        difficulty: 4
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Irregulares - Ser, Ir, Ver
    description: Elige la forma correcta del imperfecto.
    exercises:
      - type: grammar
        question: "'Antes yo ___ muy tímido' (ser) (fui/era/seré)"
        correctAnswer: era
        rationale: "Imperfecto irreg. de 'ser': era."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Tú siempre ___ al parque los domingos' (ir) (fuiste/ibas/irás)"
        correctAnswer: ibas
        rationale: "Imperfecto irreg. de 'ir': ibas."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Él ___ mucho la televisión de pequeño' (ver) (vio/veía/verá)"
        correctAnswer: veía
        rationale: "Imperfecto irreg. de 'ver': veía."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Nosotros ___ muy buenos amigos' (ser) (fuimos/éramos/seremos)"
        correctAnswer: éramos
        rationale: "Imperfecto 1ª pl. de 'ser': éramos."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Vosotros ___ al mercado cada semana' (ir) (fuisteis/ibais/iréis)"
        correctAnswer: ibais
        rationale: "Imperfecto 2ª pl. de 'ir': ibais."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Ellos ___ las noticias cada noche' (ver) (vieron/veían/verán)"
        correctAnswer: veían
        rationale: "Imperfecto 3ª pl. de 'ver': veían."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Cuando ___ pequeña, me gustaba bailar' (ser) (fui/era/seré)"
        correctAnswer: era
        rationale: "Imperfecto 1ª sing. de 'ser': era (condición pasada continuada)."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'Mientras yo estudiaba, tú ___ a jugar' (ir) (fuiste/ibas/irás)"
        correctAnswer: ibas
        rationale: "Imperfecto paralelo 2ª sing. de 'ir': ibas."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "'El pueblo ___ pequeño pero bonito' (ser) (fue/era/será)"
        correctAnswer: era
        rationale: "Imperfecto descriptivo 3ª sing. de 'ser': era."
        difficulty: 4
        objectives: [es.pre_reading]
      - type: grammar
        question: "Elige la oración con imperfecto correcto: (Ayer comí pizza./Siempre comía pizza./Comeré pizza mañana.)"
        correctAnswer: Siempre comía pizza.
        rationale: "'Siempre' indica hábito → imperfecto 'comía'."
        difficulty: 4
        objectives: [es.pre_reading]
target: 20
