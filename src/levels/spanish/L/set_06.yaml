authorNotes: "Texto sobre filosofía de la mente: dualismo cartesiano y el problema mente-cuerpo, fisicalismo (identidad tipos/instancias, funcionalismo Putnam, eliminativismo Churchland), el argumento del cuarto chino (Searle) vs. funcionalismo, el problema difícil de la conciencia (Chalmers: qualia, zombis filosóficos, brecha explicativa de Levine), panpsiquismo (Goff), teoría de la información integrada (Tononi Φ), predictive processing (Clark/Friston), enactivismo (Varela/Maturana/autopoiesis), epifenomenalismo."
example: "problema fácil: explicar funciones cognitivas (atención/memoria/control) → puede resolverse mediante neurociencia; problema difícil (Chalmers): ¿por qué hay experiencia subjetiva (qualia)? → zombis filosóficos como experimento mental → panpsiquismo (Goff): conciencia como propiedad fundamental → TII (Tononi): Φ como medida de conciencia."
