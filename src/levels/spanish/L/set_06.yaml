pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: El problema mente-cuerpo es uno de los enigmas más persistentes de la filosofía: ¿cómo se relacionan los estados mentales con los estados físicos del cerebro? René Descartes propuso el dualismo de sustancias: la mente (res cogitans) y el cuerpo (res extensa) son sustancias radicalmente distintas → el problema de la interacción causal: ¿cómo puede algo no físico causar movimiento físico? El fisicalismo moderno argumenta que la mente es idéntica al cerebro. Formas del fisicalismo: (1) Teoría de la identidad de tipos (Place, Smart): los estados mentales son idénticos a tipos de estados neurales → crítica: el dolor puede realizarse en diferentes sustratos (realizabilidad múltiple). (2) Funcionalismo (Putnam): los estados mentales se definen por sus roles funcionales (relaciones causales con entradas, salidas y otros estados), no por su sustrato físico → el cerebro es hardware; la mente es el software. (3) Eliminativismo (Paul y Patricia Churchland): la psicología folk (creencias, deseos) será reemplazada por la neurociencia → los conceptos mentales son teóricamente erróneos. John Searle propuso el argumento del cuarto chino contra el funcionalismo: una persona que manipula símbolos siguiendo reglas sintácticas puede superar el test de Turing sin comprender el chino → la sintaxis no es suficiente para la semántica; los ordenadores no entienden. David Chalmers distinguió los problemas fáciles de la conciencia (explicar la percepción, la atención, la memoria, el comportamiento) del problema difícil: ¿por qué hay experiencia subjetiva en absoluto? ¿Por qué el procesamiento de información tiene una cualidad fenomenal (qualia)? Los zombis filosóficos (idénticos físicamente a un humano pero sin experiencia subjetiva) son conceptualmente posibles → brecha explicativa (Levine): ninguna explicación funcional o física cierra la brecha entre procesos físicos y la experiencia subjetiva. El panpsiquismo (Philip Goff): la conciencia es una propiedad fundamental del universo, presente en grados en toda la materia. La teoría de la información integrada (Tononi): Φ (phi) mide la cantidad de información integrada de un sistema; la conciencia = información integrada. El enactivismo (Varela, Maturana): la conciencia no está en el cerebro sino en la interacción activa del organismo con su entorno (autopoiesis: autoproducción del ser vivo)."
    exercises:
      - type: reading
        question: "¿Cuál es el problema de la interacción causal en el dualismo cartesiano? (que Descartes no era filósofo/si la mente (res cogitans) y el cuerpo (res extensa) son sustancias radicalmente distintas, ¿cómo puede la mente no física causar movimientos físicos y cómo pueden los estados físicos del cerebro causar estados mentales? → el dualismo de sustancias no puede explicar la causalidad bidireccional mente-cuerpo/que Descartes lo resolvió con la glándula pineal)"
        correctAnswer: si la mente (res cogitans) y el cuerpo (res extensa) son sustancias radicalmente distintas, ¿cómo puede la mente no física causar movimientos físicos? → el dualismo de sustancias no puede explicar la causalidad bidireccional mente-cuerpo sin introducir misterio
        rationale: "El texto: 'el problema de la interacción causal: ¿cómo puede algo no físico causar movimiento físico?' — este problema motivó el abandono del dualismo de sustancias en la filosofía moderna."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué la realizabilidad múltiple es una objeción al fisicalismo de identidad de tipos? (que no es una objeción relevante/si el dolor puede realizarse en cerebros humanos, en pulpos (sistema nervioso distribuido) y posiblemente en robots con materiales distintos, entonces el dolor no puede ser idéntico a un tipo específico de estado neural → el funcionalismo (Putnam) responde que el dolor se define por su rol funcional, no por su sustrato/que la identidad de tipos es correcta y la realizabilidad múltiple no existe)"
        correctAnswer: si el dolor puede realizarse en sustratos físicos muy distintos (cerebros humanos, pulpos, robots), el dolor no puede ser idéntico a un tipo específico de estado neural → el funcionalismo responde que el dolor se define por su rol funcional, no por su sustrato
        rationale: "El texto: 'el dolor puede realizarse en diferentes sustratos (realizabilidad múltiple)' → crítica central a la teoría de identidad de tipos que motivó el funcionalismo de Putnam."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es el argumento del cuarto chino de Searle y qué pretende demostrar? (que los chinos son inteligentes/que una persona que manipula símbolos siguiendo reglas sintácticas puede superar el test de Turing sin entender el significado → la sintaxis no es suficiente para la semántica: los ordenadores manipulan símbolos sin comprender → la IA fuerte (la computación puede ser mente) es imposible/que los ordenadores son más inteligentes que los humanos)"
        correctAnswer: "una persona que manipula símbolos según reglas sintácticas puede superar el test de Turing sin entender el significado → la sintaxis (computación) no es suficiente para la semántica (comprensión) → la IA fuerte es imposible: los ordenadores no entienden, solo calculan"
        rationale: "El texto: 'Searle: una persona que manipula símbolos puede superar el test de Turing sin comprender el chino → la sintaxis no es suficiente para la semántica'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué consiste el problema difícil de la conciencia de Chalmers y por qué los problemas fáciles no lo resuelven? (que Chalmers dijo que la conciencia es fácil de explicar/los problemas fáciles son explicar las funciones cognitivas (percepción, atención, memoria, reportabilidad) → la neurociencia los puede abordar; el problema difícil: ¿por qué estos procesos físicos tienen una cualidad fenomenal (qualia)? ¿Por qué hay 'algo que es como' ser tú? → ninguna explicación funcional/física cierra la brecha explicativa/que Chalmers defendió el funcionalismo)"
        correctAnswer: "los problemas fáciles son explicar funciones cognitivas (percepción, memoria, atención); el problema difícil: ¿por qué el procesamiento de información tiene una cualidad subjetiva (qualia)? → ninguna explicación funcional o física cierra la brecha explicativa entre procesos físicos y experiencia subjetiva"
        rationale: "El texto: 'Chalmers distinguió los problemas fáciles del problema difícil: ¿por qué hay experiencia subjetiva? ¿por qué el procesamiento tiene una cualidad fenomenal (qualia)?'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué son los zombis filosóficos y qué argumento filosófico apoyan? (muertos vivientes/seres conceptualmente posibles que son física y funcionalmente idénticos a los humanos pero carecen completamente de experiencia subjetiva (qualia) → si son concebibles, entonces la conciencia no se reduce a lo físico/funcional → el dualismo de propiedades o el panpsiquismo son más plausibles que el fisicalismo puro/que los zombis filosóficos no tienen relevancia filosófica)"
        correctAnswer: seres física y funcionalmente idénticos a los humanos pero sin experiencia subjetiva → si son concebibles, la conciencia no se reduce a lo físico/funcional → apoyan el dualismo de propiedades (Chalmers) y cuestionan el fisicalismo reduccionista
        rationale: "El texto: 'los zombis filosóficos (idénticos físicamente pero sin experiencia subjetiva) son conceptualmente posibles → brecha explicativa (Levine)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué propone el panpsiquismo de Goff como solución al problema difícil? (que la conciencia es solo una ilusión/que la conciencia es una propiedad fundamental del universo, presente en alguna forma en toda la materia → las formas simples de conciencia se combinan en la conciencia compleja humana (combinación de conciencias) → evita la brecha explicativa del fisicalismo pero enfrenta el 'problema de combinación'/que Goff niega que la conciencia sea real)"
        correctAnswer: que la conciencia es una propiedad fundamental del universo presente en toda la materia → las formas simples de conciencia se combinan en la conciencia humana compleja → evita la brecha explicativa del fisicalismo pero enfrenta el 'problema de combinación' (cómo se combinan las microconciencias)
        rationale: "El texto: 'el panpsiquismo (Philip Goff): la conciencia es una propiedad fundamental del universo, presente en grados en toda la materia'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo explica la Teoría de la Información Integrada (TII) de Tononi la conciencia? (que la conciencia depende del tamaño del cerebro/que la conciencia equivale a la cantidad de información integrada en un sistema (Φ, phi): un sistema tiene conciencia si tiene más información como un todo que la suma de sus partes → predice que algunos sistemas artificiales (alta Φ) podrían ser conscientes y que algunos biológicos (cerebelo: baja Φ) serían menos conscientes/que Tononi rechaza la conciencia animal)"
        correctAnswer: "la conciencia equivale a la cantidad de información integrada (Φ): un sistema es consciente si tiene más información como todo que la suma de sus partes → predice que sistemas con alta Φ (incluidos artificiales) podrían ser conscientes y que sistemas de baja Φ (cerebelo) serían menos conscientes"
        rationale: "El texto: 'la teoría de la información integrada (Tononi): Φ (phi) mide la cantidad de información integrada de un sistema; la conciencia = información integrada'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué distingue al enactivismo de Varela y Maturana del funcionalismo clásico sobre la conciencia? (que son lo mismo/el funcionalismo ve la mente como procesamiento de información interno (software en hardware cerebral); el enactivismo argumenta que la cognición y la conciencia emergen de la interacción activa del organismo con su entorno (embodied mind) → el concepto de autopoiesis: los seres vivos se producen y mantienen a sí mismos → la conciencia no está 'en el cerebro' sino en la dinámica organismo-entorno/que el enactivismo rechaza toda teoría de la conciencia)"
        correctAnswer: "el funcionalismo ve la mente como procesamiento interno; el enactivismo argumenta que la cognición emerge de la interacción activa del organismo con su entorno (embodied mind) → autopoiesis (Maturana): el organismo se produce a sí mismo; la conciencia no está 'en el cerebro' sino en la dinámica organismo-entorno"
        rationale: "El texto: 'el enactivismo (Varela, Maturana): la conciencia está en la interacción activa del organismo con su entorno (autopoiesis: autoproducción del ser vivo)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué implica el eliminativismo de los Churchland para los conceptos de la psicología folk como 'creencia' y 'deseo'? (que los refuerza/que los conceptos de la psicología folk (creencia, deseo, intención) son parte de una teoría científicamente errónea que será completamente reemplazada por la neurociencia → igual que 'flogisto' o 'éter' fueron eliminados de la ciencia, los estados mentales folk serán eliminados cuando la neurociencia madure/que la psicología folk es más rigurosa que la neurociencia)"
        correctAnswer: que la psicología folk (creencia, deseo, intención) es una teoría científicamente errónea que será completamente reemplazada por la neurociencia → igual que 'flogisto' o 'éter' fueron eliminados, los estados mentales folk serán eliminados cuando la neurociencia madure
        rationale: "El texto: 'eliminativismo (Paul y Patricia Churchland): la psicología folk será reemplazada por la neurociencia → los conceptos mentales son teóricamente erróneos'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué la brecha explicativa de Levine representa un desafío permanente para el fisicalismo, aunque se explique completamente la neurociencia del dolor? (que ya no es un problema/aunque describamos completamente los mecanismos neurales del dolor (C-fibras, nociceptores, corteza somatosensorial), queda sin explicar por qué esa actividad neural se siente como algo → por qué hay una cualidad subjetiva del dolor en vez de procesamiento 'en la oscuridad' → esto no es un problema empírico sino conceptual/que la neurociencia resolverá la brecha)"
        correctAnswer: "aunque se explique completamente la neurociencia del dolor (qué neuronas se activan y cómo), queda sin explicar por qué esa actividad neural se siente como algo → la brecha explicativa es conceptual, no empírica: no hay cadena lógica que derive la experiencia subjetiva de los procesos físicos"
        rationale: "Levine (1983) acuñó 'brecha explicativa' (explanatory gap): aunque el fisicalismo pueda ser verdadero, siempre parece quedar sin explicar por qué los procesos físicos producen experiencia subjetiva."
        difficulty: 5
        objectives: [es.pre_reading]
