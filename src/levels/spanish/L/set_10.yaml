authorNotes: "Texto sobre teoría literaria contemporánea y estudios culturales: New Criticism (cerrar lectura, ambigüedad, paradoja, ironía — Wimsatt/Beardsley: falacia intencional y afectiva), estructuralismo literario (Propp/morfología, Barthes/S/Z, Genette/narratología), recepción (Jauss: estética de la recepción, horizonte de expectativas; Iser: lector implícito), poscolonialismo (Said/orientalismo, Spivak/subalterna, Bhabha/hibrididad y mímicry), estudios culturales (Birmingham, Hall/codificación-decodificación, hegemonía Gramsci aplicada), ecocrítica, estudios de género (Butler performatividad), teoría queer (Sedgwick)."
example: "significado literario → New Criticism: en el texto (falacia intencional/afectiva) → Barthes: muerte del autor → recepción (Jauss/Iser): en el lector → Said: orientalismo como discurso colonial → Spivak: ¿puede hablar el subalterno? → Bhabha: hibrididad/mímica → Hall: codificación-decodificación dominante/negociada/oposicional."
