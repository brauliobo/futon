pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La teoría literaria del siglo XX fragmentó el lugar del significado. El New Criticism angloamericano (Brooks, Warren, Wimsatt, Beardsley) propuso la lectura cercana (close reading): el poema como objeto autónomo, rico en paradoja, ironía y ambigüedad; la falacia intencional: la intención del autor no determina el significado; la falacia afectiva: el efecto emocional en el lector tampoco. El estructuralismo literario transpuso la lingüística de Saussure: Vladimir Propp analizó la morfología del cuento popular ruso en 31 funciones; Roland Barthes en S/Z diseccionó el cuento de Balzac en cinco códigos (hermenéutico, proairético, sémico, simbólico, cultural/referencial); Gérard Genette sistematizó la narratología (tiempo, modo, voz, frecuencia). La Escuela de Constanza (Jauss, Iser) desplazó el foco al lector: la estética de la recepción (Jauss) propone que el significado se produce en el encuentro entre el texto y el horizonte de expectativas del lector → la historia literaria es historia de la recepción; el lector implícito (Iser): el texto contiene vacíos que el lector rellena activamente. El poscolonialismo cuestionó el canon occidental: Edward Said en Orientalismo (1978) demostró que las representaciones occidentales de 'Oriente' son construcciones de poder; Gayatri Spivak preguntó '¿Puede hablar el subalterno?' (1988): los grupos subalternizados (mujeres, colonizados) no pueden hablar en los marcos del discurso hegemónico; Homi Bhabha introdujo los conceptos de hibrididad (la identidad colonial no es pura sino mezclada), mímica (el colonizado imita al colonizador de forma perturbadora) y el tercer espacio (lugar de negociación cultural). Los estudios culturales (Birmingham, Stuart Hall): Hall propuso el modelo codificación/decodificación: el productor codifica el mensaje según una posición dominante; el receptor puede decodificarlo en posición dominante, negociada u oposicional → la audiencia es activa. La teoría queer (Sedgwick, Warner) problematizó la heteronormatividad: los textos literarios están atravesados por deseos que el discurso dominante reprime o invisibiliza."
    exercises:
      - type: reading
        question: "¿Qué son la falacia intencional y la falacia afectiva en el New Criticism y qué implican para la interpretación? (que son errores gramaticales/falacia intencional (Wimsatt/Beardsley): el significado del texto no depende de la intención del autor (que puede ser desconocida o irrelevante); falacia afectiva: el significado no depende del efecto emocional en el lector → el texto literario es un objeto autónomo cuyo significado emerge de su estructura interna (paradoja, ironía, ambigüedad)/que el autor siempre determina el significado)"
        correctAnswer: "falacia intencional: el significado del texto no depende de la intención del autor; falacia afectiva: no depende del efecto emocional en el lector → el texto literario es un objeto autónomo cuyo significado emerge de su estructura interna (paradoja, ironía, ambigüedad)"
        rationale: "El texto: 'Wimsatt/Beardsley: falacia intencional: la intención del autor no determina el significado; falacia afectiva: el efecto emocional en el lector tampoco'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué son las 31 funciones de Propp y cómo contribuyeron al estructuralismo narrativo? (que Propp fue un formalista soviético sin influencia/son las unidades mínimas de la trama del cuento maravilloso ruso: acciones tipificadas de los personajes (alejamiento del héroe, prohibición, transgresión, fechoría, búsqueda, ayudante, proeza, regreso, castigo del villano, matrimonio...) → siempre en el mismo orden aunque no todas se presenten → demostró que los cuentos tienen una estructura morfológica subyacente universal/que Propp analizó la novela realista)"
        correctAnswer: "son las unidades mínimas de la trama del cuento maravilloso ruso: acciones tipificadas que siempre aparecen en el mismo orden (aunque no todas) → demostraron que los cuentos tienen una estructura morfológica subyacente, base del análisis estructural del relato (Greimas, Barthes, narratología)"
        rationale: "El texto: 'Vladimir Propp analizó la morfología del cuento popular ruso en 31 funciones'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué propone la estética de la recepción de Jauss y qué es el horizonte de expectativas? (que el texto tiene un significado fijo independent del lector/el significado literario se produce en el encuentro entre el texto y el horizonte de expectativas del lector (el conjunto de normas, convenciones y experiencias literarias del público en un momento histórico concreto) → los textos innovadores quiebran el horizonte; la historia literaria es la historia de los cambios en la recepción/que Jauss rechazó toda teoría de la recepción)"
        correctAnswer: el significado se produce en el encuentro entre el texto y el horizonte de expectativas del lector (normas, convenciones y experiencias literarias del público en un momento histórico) → los textos innovadores quiebran el horizonte; la historia literaria es historia de cambios en la recepción
        rationale: "El texto: 'la estética de la recepción (Jauss) propone que el significado se produce en el encuentro entre el texto y el horizonte de expectativas del lector → la historia literaria es historia de la recepción'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué argumenta Said en Orientalismo sobre las representaciones occidentales de 'Oriente'? (que las representaciones occidentales son objetivas/que 'Oriente' es una construcción discursiva del poder occidental: los académicos, escritores y viajeros europeos proyectaron una imagen de 'Oriente' como exótico, pasivo, irracional y atemporal → que legitima la dominación colonial; el orientalismo no describe sino que produce su objeto → el discurso colonial es indisociable de las relaciones de poder/que Said defendió la representación occidental de Oriente)"
        correctAnswer: "'Oriente' es una construcción discursiva del poder occidental: la academia y literatura europeas proyectaron una imagen exótica, pasiva e irracional que legitima la dominación colonial → el orientalismo produce su objeto; el discurso colonial es indisociable del poder"
        rationale: "El texto: 'Said en Orientalismo demostró que las representaciones occidentales de Oriente son construcciones de poder'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué significa la pregunta de Spivak '¿Puede hablar el subalterno?' y qué responde? (que los subalternos siempre pueden hablar/que los grupos subalternizados (mujeres colonizadas, clases subalternas) no pueden 'hablar' en los marcos del discurso hegemónico porque no tienen acceso a los medios de representación ni son escuchados en sus propios términos → incluso cuando hablan, son traducidos a los marcos del colonizador → no se trata de silencio sino de que el sistema de comunicación los invisibiliza/que el subalterno siempre tiene voz en el marco hegemónico)"
        correctAnswer: los grupos subalternizados no pueden 'hablar' en los marcos del discurso hegemónico porque no tienen acceso a los medios de representación y cuando hablan son traducidos a los marcos del colonizador → no es silencio físico sino invisibilización sistémica del sistema de comunicación hegemónico
        rationale: "El texto: 'Spivak preguntó ¿Puede hablar el subalterno?: los grupos subalternizados no pueden hablar en los marcos del discurso hegemónico'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué conceptos aporta Bhabha para analizar la identidad en el contexto colonial y qué es el tercer espacio? (que Bhabha rechazó la hibrididad/hibrididad: la identidad colonial no es pura ni fija sino mezclada, producto del contacto entre colonizador y colonizado; mímica: el colonizado imita al colonizador de forma perturbadoramente casi igual pero no del todo ('almost the same, but not quite') → revela la inestabilidad de la autoridad colonial; tercer espacio: lugar de negociación cultural donde emerge la hibrididad y se cuestionan las identidades fijas/que la identidad colonial es binaria y estable)"
        correctAnswer: "hibrididad: la identidad colonial es mezclada e inestable; mímica: el colonizado imita al colonizador perturbadoramente ('almost the same, but not quite') → revela la inestabilidad de la autoridad colonial; tercer espacio: lugar de negociación cultural donde emerge la hibrididad y se cuestionan identidades fijas"
        rationale: "El texto: 'Bhabha introdujo hibrididad (identidad colonial mezclada), mímica (el colonizado imita de forma perturbadora) y el tercer espacio (lugar de negociación cultural)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es el modelo de codificación/decodificación de Stuart Hall y cómo implica una audiencia activa? (que las audiencias reciben pasivamente los mensajes mediáticos/el productor codifica el mensaje según una posición ideológica (dominante-hegemónica); el receptor puede decodificarlo en tres posiciones: dominante (acepta el mensaje tal como fue codificado), negociada (acepta partes y negocia otras) u oposicional (rechaza el significado dominante y lo relee desde una posición contraria) → las audiencias no son pasivas sino activas y polisémicas/que las audiencias solo adoptan la posición dominante)"
        correctAnswer: el productor codifica el mensaje ideológicamente; el receptor puede decodificarlo en posición dominante (acepta el mensaje tal como fue codificado), negociada (acepta y negocia) u oposicional (rechaza el significado dominante) → las audiencias son activas y polisémicas
        rationale: "El texto: 'Hall propuso el modelo codificación/decodificación: el receptor puede decodificarlo en posición dominante, negociada u oposicional → la audiencia es activa'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué aporta la teoría queer de Sedgwick a la lectura de textos literarios? (que la teoría queer es solo política/la teoría queer problematiza la heteronormatividad en los textos: los textos literarios están atravesados por deseos no normativos que el discurso dominante reprime o invisibiliza → la lectura queer desconstruye las oposiciones binarias (hetero/homo, normal/desviado) y muestra cómo el deseo queer está presente pero codificado o suprimido en los textos canónicos/que la teoría queer rechaza la literatura)"
        correctAnswer: "la teoría queer problematiza la heteronormatividad en los textos: los textos literarios están atravesados por deseos no normativos que el discurso dominante reprime → la lectura queer desconstruye las oposiciones binarias (hetero/homo, normal/desviado) y muestra el deseo queer codificado o suprimido en los textos canónicos"
        rationale: "El texto: 'la teoría queer (Sedgwick, Warner) problematizó la heteronormatividad: los textos literarios están atravesados por deseos que el discurso dominante reprime o invisibiliza'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo describe Roland Barthes los cinco códigos del relato en S/Z y cuál es su función en el análisis textual? (que los cinco códigos son géneros literarios/código hermenéutico (enigma/misterio), proairético (acciones y su desenlace), sémico (connotaciones de los personajes), simbólico (estructura antitética) y cultural/referencial (saberes enciclopédicos convocados por el texto) → el análisis de cada lexía del texto de Balzac muestra cómo el texto es una red de múltiples códigos, no un significado único/que Barthes usó solo un código en S/Z)"
        correctAnswer: código hermenéutico (enigma), proairético (acciones y desenlaces), sémico (connotaciones de personajes), simbólico (estructura antitética) y cultural/referencial (saberes enciclopédicos) → el análisis de S/Z muestra el texto como una red de múltiples códigos, no un significado único y cerrado
        rationale: "El texto: 'Barthes en S/Z diseccionó el cuento de Balzac en cinco códigos (hermenéutico, proairético, sémico, simbólico, cultural/referencial)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo dialogan la ecocrítica y el poscolonialismo en el análisis de la literatura latinoamericana contemporánea? (que no dialogan/el ecocriticismo poscolonial (Nixon: violencia lenta) señala que la degradación ambiental afecta desproporcionadamente a las comunidades colonizadas → la literatura latinoamericana contemporánea (novela de la selva, narconarrativa ecológica, nueva novela histórica) articula la explotación de la naturaleza con las formas de dominación colonial y postcolonial → el cuerpo del territorio es también el cuerpo colonizado/que la ecocrítica rechaza el poscolonialismo)"
        correctAnswer: "el ecocriticismo poscolonial (Nixon: violencia lenta) señala que la degradación ambiental afecta desproporcionalmente a las comunidades colonizadas → la literatura latinoamericana contemporánea articula la explotación de la naturaleza con las formas de dominación colonial: el cuerpo del territorio es también el cuerpo colonizado"
        rationale: "El diálogo ecocrítica/poscolonialismo es un desarrollo reciente (ecocriticismo poscolonial/decolonial): el concepto de 'violencia lenta' de Nixon (2011) y su aplicación a la literatura latinoamericana donde los paisajes son también espacios de dominación."
        difficulty: 5
        objectives: [es.pre_reading]
