title: Gramática - Psicolingüística Experimental y Procesamiento del Lenguaje
level: L
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Psicolingüística experimental avanzada: modelos de producción del habla (Levelt: conceptualización → formulación → articulación → monitoreo); lexicalización y acceso léxico (Levelt/Roelofs/WEAVER++); modelos de comprensión: garden-path model (Frazier: minimal attachment, late closure), constraint-based/probabilistic models (MacDonald, Trueswell), dual-path model (Pickering/Branigan); corrección y reanálisis; priming sintáctico; psicolingüística de las lenguas de herencia; modelos de producción bilingüe (BILING de de Bot); efectos de frecuencia, vecindad léxica, imaginabilidad."
example: "El modelo garden-path → minimal attachment → la primera lectura asigna la estructura sintáctica mínima → el reanálisis ocurre cuando la oración viola las predicciones del analizador sintáctico."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Producción y Comprensión del Habla
    exercises:
      - type: grammar
        question: "¿Cuáles son los tres estadios principales del modelo de producción del habla de Levelt y qué proceso ocurre en cada uno? (que la producción es un proceso único/conceptualización: el hablante construye la intención comunicativa y el mensaje preverbal; formulación: codificación gramatical (selección léxica, construcción de la estructura sintáctica) y codificación fonológica; articulación: producción del habla motora → más monitoreo: el hablante evalúa su propio output/que Levelt propuso solo dos estadios)"
        correctAnswer: "conceptualización (construye el mensaje preverbal), formulación (codificación gramatical: selección léxica + estructura sintáctica; codificación fonológica) y articulación (producción motora del habla) → más un monitor que evalúa el output"
        rationale: "Levelt (1989): el modelo de producción del habla es un proceso en tres estadios seriales con retroalimentación; el estadio de formulación tiene dos subcomponentes: el gramatical (lemma, selección léxica, estructura sintáctica) y el fonológico (forma de la palabra)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las pausas de relleno ('eeh', 'mmm', 'esto') y los errores del habla desde la perspectiva del modelo de Levelt? (que son solo muletillas sin valor teórico/las pausas de relleno indican que el proceso de formulación está en curso pero el hablante aún no tiene lista la forma fonológica → evidencia del monitoreo; los errores del habla (tip-of-the-tongue: acceso al lemma pero no al lexema; spoonerisms: transposición de segmentos) revelan la arquitectura del sistema: los errores son sistemáticos, no aleatorios → evidencia del modelo de producción/que los errores son solo falta de concentración)"
        correctAnswer: las pausas de relleno indican que la formulación está en curso sin forma fonológica lista → evidencia del monitoreo; los errores del habla (tip-of-the-tongue, spoonerisms) son sistemáticos y revelan la arquitectura del sistema de producción (separación lemma/lexema)
        rationale: "Los errores del habla (Fromkin 1973; Levelt 1989): son evidencia crucial para la psicología del lenguaje porque sus patrones sistemáticos revelan la organización del sistema de producción (acceso léxico, codificación fonológica, articulación)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es el modelo garden-path y qué evidencia experimental lo apoya? (que el analizador sintáctico espera toda la información/el analizador sintáctico construye la estructura sintáctica en tiempo real usando los principios de minimal attachment (adjunta el nuevo nodo a la estructura mínima posible) y late closure (cierra el sintagma lo más tarde posible) → cuando una oración viola estas predicciones, se produce un efecto garden-path: reanálisis costoso, detectable con tiempos de lectura, ERPs (N400/P600) y eye-tracking/que el modelo garden-path es obsoleto)"
        correctAnswer: el analizador construye la estructura sintáctica con minimal attachment (estructura mínima) y late closure (cierra tarde el sintagma) → cuando la oración viola estas predicciones, se produce reanálisis costoso, detectable con tiempos de lectura, ERPs (N400/P600) y eye-tracking
        rationale: "Frazier (1987): el modelo garden-path propone que el analizador es encapsulado e induce en error (garden path) con oraciones de adjunción ambigua; el coste del reanálisis es el efecto experimental central."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son los modelos de restricciones (constraint-based) y cómo se diferencian del modelo garden-path? (que son modelos sin probabilidades/los modelos probabilísticos (MacDonald, Trueswell): el analizador activa en paralelo todas las interpretaciones posibles, ponderadas por su probabilidad según el contexto léxico, discursivo y de frecuencia → no hay un análisis único preferido → cuando el analizador no resuelve correctamente, es porque las restricciones contrastaron de forma imprevista, no porque el analizador sea serialmente engañado/que los modelos de restricciones son idénticos al garden-path)"
        correctAnswer: los modelos probabilísticos activan en paralelo todas las interpretaciones ponderadas por probabilidad (léxico, discurso, frecuencia) → no hay un análisis único preferido serialmente; las dificultades de procesamiento emergen de la competencia entre interpretaciones, no de un reanálisis serial
        rationale: "MacDonald/Trueswell/Seidenberg (1994): los modelos de restricciones múltiples (constraint-based) permiten la activación paralela de interpretaciones; contrastan con el garden-path model de Frazier que es serial y encapsulado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el priming sintáctico y qué nos dice sobre la representación del conocimiento sintáctico? (que es solo repetición/el priming sintáctico (Bock 1986): tras producir o procesar una oración con una estructura sintáctica determinada (p. ej., pasiva o doble objeto), el hablante tiende a reutilizar esa misma estructura en la siguiente producción → evidencia de que las representaciones sintácticas abstractas se activan y almacenan temporalmente de forma independiente del léxico/que el priming sintáctico no existe en español)"
        correctAnswer: "el priming sintáctico (Bock 1986): tras producir/procesar una estructura sintáctica, el hablante tiende a reutilizarla en la siguiente producción → evidencia de que las representaciones sintácticas abstractas se activan y almacenan temporalmente de forma independiente del léxico"
        rationale: "El priming sintáctico (structural priming) es uno de los fenómenos más replicados en psicolingüística; tiene implicaciones para la arquitectura del sistema de producción: las representaciones sintácticas son abstractas y se activan independientemente del léxico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el efecto de vecindad léxica y cómo afecta al reconocimiento de palabras? (que todas las palabras se reconocen igualmente rápido/las palabras con muchos 'vecinos léxicos' (palabras que difieren en un solo fonema: 'cat' y las palabras que se le parecen) se reconocen más lentamente porque la activación de muchos competidores retrasa la selección del ganador → el modelo de activación interactiva (McClelland/Elman) y el TRACE predicen este efecto/que la vecindad léxica solo aplica a palabras largas)"
        correctAnswer: las palabras con muchos vecinos léxicos (que difieren en un solo fonema) se reconocen más lentamente porque la activación de muchos competidores retrasa la selección del ganador → predicho por el modelo de activación interactiva (McClelland/Elman) y el modelo TRACE
        rationale: "El efecto de vecindad léxica (Luce/Pisoni 1998): cuantos más vecinos tiene una palabra, más difícil es su reconocimiento porque los vecinos compiten por la activación en el lexicón mental."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el fenómeno tip-of-the-tongue (ToT) y qué revela sobre la arquitectura del lexicón mental? (que es solo un olvido temporal/el ToT (Brown/McNeill 1966): el hablante tiene acceso al lemma (información sintáctica y semántica de la palabra) pero no al lexema (su forma fonológica) → puede recordar la inicial, el número de sílabas, el acento → revela la disociación entre el nivel gramatical (lemma) y el fonológico (lexema) en la arquitectura del lexicón/que el ToT demuestra que el léxico es una lista simple)"
        correctAnswer: en el ToT el hablante tiene el lemma (información sintáctica y semántica) pero no el lexema (forma fonológica) → puede recordar información parcial (inicial, número de sílabas) → revela la disociación entre el nivel gramatical (lemma) y el fonológico (lexema) en el lexicón mental
        rationale: "El ToT (Brown/McNeill 1966; Levelt 1989): la disociación entre acceso al lemma y acceso al lexema es evidencia directa de la arquitectura en dos niveles del lexicón mental propuesta por Levelt."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo explican los modelos de procesamiento bilingüe la interferencia entre L1 y L2 en la producción del habla? (que los bilingües cambian de lengua sin interferencia/los modelos de producción bilingüe (de Bot: BILING): tanto L1 como L2 están activados simultáneamente → la interferencia ocurre cuando los lemas de una lengua compiten con los de la otra; el control inhibitorio (Green 1998) suprime la lengua no seleccionada, pero esta supresión es costosa → los bilingües dominantes en L1 que hablan L2 deben suprimir más L1, lo que genera mayor interferencia/que los bilingües no tienen interferencia léxica)"
        correctAnswer: en la producción bilingüe tanto L1 como L2 están activados simultáneamente → el control inhibitorio (Green 1998) suprime la lengua no seleccionada; la supresión es costosa → los bilingües que hablan L2 deben suprimir más la L1 dominante, generando mayor interferencia
        rationale: "De Bot (1992): el modelo BILING adapta el modelo de Levelt a la producción bilingüe; Green (1998): el modelo de control inhibitorio explica los cambios de lengua y la interferencia mediante la supresión del lexicón no seleccionado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los ERPs (potenciales relacionados con eventos) y qué han aportado a la psicolingüística? (que son solo medidas de tiempo de reacción/los ERPs miden la actividad eléctrica del cerebro con alta resolución temporal → en psicolingüística: el N400 (componente negativo ~400ms) responde a la incongruencia semántica ('Comió el papel…'); el P600 (componente positivo ~600ms) responde a violaciones sintácticas y al reanálisis → permiten medir el procesamiento en tiempo real sin requerir respuesta consciente/que los ERPs solo miden atención general)"
        correctAnswer: "los ERPs miden actividad cerebral con alta resolución temporal → N400: incongruencia semántica (~400ms); P600: violaciones sintácticas y reanálisis (~600ms) → permiten medir el procesamiento lingüístico en tiempo real sin requerir respuesta consciente"
        rationale: "Los ERPs son la metodología neuroimagen más usada en psicolingüística (Kutas/Hillyard 1980: N400; Hagoort/Brown/Groothusen 1993: P600): la disociación N400/P600 permite separar procesamiento semántico de sintáctico en tiempo real."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué evidencia aportan las lenguas de herencia para la teoría de la adquisición y el mantenimiento del lenguaje? (que las lenguas de herencia demuestran que la L1 es permanente/los hablantes de herencia (adquirieron la L1 en el hogar inmigrante pero se educaron en L2) muestran attrition (desgaste) selectivo en la L1 → las áreas más vulnerables son las de mayor complejidad morfológica y sintáctica (subjuntivo, clíticos, género) → revelan que el conocimiento gramatical abstracto es susceptible de erosión si no se mantiene con input suficiente/que las lenguas de herencia son idénticas a las L2)"
        correctAnswer: los hablantes de herencia muestran attrition selectivo en L1 → las áreas más vulnerables son morfología y sintaxis compleja (subjuntivo, clíticos, género) → revelan que el conocimiento gramatical abstracto es susceptible de erosión sin input suficiente
        rationale: "Los estudios de lenguas de herencia (Montrul 2008; Benmamoun et al. 2013): los hablantes de herencia no son simplemente aprendices de L2 ni hablantes nativos completos, sino un tipo específico de bilingüismo con perfiles de erosión y competencia gramatical particulares."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Adquisición y Neuropsicología del Lenguaje
    exercises:
      - type: grammar
        question: "¿Qué es el periodo crítico para la adquisición del lenguaje y qué evidencia lo apoya o cuestiona? (que el periodo crítico es un mito/Lenneberg (1967): existe un período crítico (hasta la pubertad) para la adquisición nativa del lenguaje → casos de privación lingüística extrema (Genie: adquirió vocabulario pero no gramática) apoya la hipótesis; los estudios de ASL tardío (Mayberry/Lock): los sordos que aprendieron ASL después de los 7 años nunca alcanzan la competencia nativa en gramática → el periodo crítico es más robusto para la fonología y la morfosintaxis que para el léxico/que no hay ningún período crítico en la adquisición)"
        correctAnswer: "Lenneberg (1967): el período crítico existe hasta la pubertad → caso Genie (privación extrema: vocabulario sin gramática) y ASL tardío (Mayberry): los tardíos no alcanzan competencia nativa en morfosintaxis → el período crítico es más robusto para fonología y morfosintaxis que para el léxico"
        rationale: "La hipótesis del período crítico (Lenneberg 1967) establece que la adquisición nativa requiere input en una ventana sensible; la evidencia (privación, L2 tardía) apoya sensibilidades reducidas para fonología y morfosintaxis después de la pubertad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las áreas de Broca y Wernicke y cómo se ha revisado el modelo clásico de neuropsicología del lenguaje? (que son las únicas áreas del lenguaje/el modelo clásico (Broca: producción, hemisferio izquierdo; Wernicke: comprensión auditiva) ha sido revisado por la neuroimagen (fMRI, PET, DTI): el lenguaje implica redes distribuidas → el fascículo arqueado conecta Broca y Wernicke en la ruta dorsal (sintaxis compleja); la ruta ventral (Spt-STG) conecta áreas auditivas y motoras para la integración sensoriomotora → el lenguaje no está localizado en dos puntos sino en una red de regiones/que el modelo clásico es correcto y sin revisión)"
        correctAnswer: "el modelo clásico (Broca=producción, Wernicke=comprensión) ha sido revisado: el lenguaje implica redes distribuidas → ruta dorsal (fascículo arqueado: sintaxis compleja) y ruta ventral (integración sensoriomotora STG-Spt) → el lenguaje es una red de regiones, no dos centros aislados"
        rationale: "La neuroimagen (Hickok/Poeppel 2000; Hagoort 2005): el modelo dual-stream propone una ruta dorsal para la integración sintáctica compleja y una ruta ventral para el procesamiento semántico léxico; el modelo clásico de Broca/Wernicke es simplista."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre la afasia de Broca y la de Wernicke en términos lingüísticos? (que producen los mismos errores/afasia de Broca (lesión en el área de Broca, F3 izquierda): habla telegráfica, dificultad para producir morfemas gramaticales y construcciones sintácticas complejas, pero comprensión relativamente preservada; afasia de Wernicke (lesión en el área de Wernicke, T1-T2 izquierda posterior): producción fluida pero con parafasias semánticas y verbales, comprensión muy deteriorada/que las dos afasias solo difieren en la gravedad)"
        correctAnswer: "afasia de Broca: habla telegráfica, dificultad con morfemas gramaticales y sintaxis compleja, comprensión relativamente preservada; afasia de Wernicke: producción fluida con parafasias semánticas y verbales, comprensión muy deteriorada"
        rationale: "La disociación clásica afasia de Broca/Wernicke es la base de la neuropsicología del lenguaje; aunque el modelo se ha revisado con la neuroimagen, la disociación producción fluida/no fluida y comprensión relativamente preservada/deteriorada sigue siendo clínicamente útil."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué predicciones hace el modelo WEAVER++ de Levelt y Roelofs sobre el acceso léxico en producción? (que el acceso léxico es aleatorio/el modelo WEAVER++ (Word Encoding by Activation and VERification): el acceso léxico tiene dos etapas: (1) activación del lemma (semántica/sintaxis) y (2) activación del lexema (forma fonológica) → la selección del lema ocurre por competencia: el lema más activado supera un umbral → la codificación fonológica es serial desde la sílaba inicial → predice efectos de frecuencia, efectos de competidores semánticos, errores de sustitución semántica/que el modelo WEAVER++ es solo computacional)"
        correctAnswer: "el WEAVER++ propone dos etapas: (1) activación y selección del lemma (semántica/sintaxis por competencia con umbral) y (2) activación del lexema (forma fonológica) → predice efectos de frecuencia, competidores semánticos, errores de sustitución semántica, y la asimetría tip-of-the-tongue"
        rationale: "El modelo WEAVER++ (Roelofs 1997; Levelt/Roelofs/Meyer 1999) es el modelo computacional más desarrollado del acceso léxico en producción; sus predicciones han sido ampliamente contrastadas con experimentos de nombrado de imágenes y tareas de interferencia semántica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los movimientos oculares (eye-tracking) en la lectura y qué revelan sobre el procesamiento lingüístico? (que los movimientos oculares son aleatorios durante la lectura/los movimientos oculares durante la lectura no son continuos sino una serie de sacádicos (saltos) y fijaciones; las palabras de alta frecuencia y altamente predecibles reciben fijaciones más cortas; las regresiones (movimientos hacia atrás) indican reanálisis sintáctico o dificultad de comprensión → la técnica del 'visual world paradigm' (Tanenhaus et al.): los ojos se mueven a los referentes visualmente accesibles mientras se procesa el lenguaje/que los movimientos oculares no están relacionados con el procesamiento lingüístico)"
        correctAnswer: los movimientos oculares en lectura son sacádicos + fijaciones; las palabras de alta frecuencia tienen fijaciones más cortas; las regresiones indican reanálisis; el visual world paradigm (Tanenhaus et al.) vincula los movimientos oculares con la integración del lenguaje y el mundo visual en tiempo real
        rationale: "Las técnicas de eye-tracking (Rayner 1998; Tanenhaus et al. 1995) son una de las metodologías más informativas en psicolingüística: miden el procesamiento lingüístico en tiempo real con alta sensibilidad temporal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el efecto de imaginabilidad en el reconocimiento de palabras y qué implica para el sistema semántico? (que la imaginabilidad no afecta al procesamiento léxico/las palabras de alta imaginabilidad (aquellas que evocan imágenes concretas: 'perro', 'silla') se reconocen más rápido que las de baja imaginabilidad (conceptos abstractos: 'justicia', 'idea') → evidencia de que el procesamiento semántico implica representaciones multimodales (simulaciones perceptivomotoras) → compatibles con la teoría de la semántica embodied (Barsalou)/que las palabras abstractas se reconocen más rápido)"
        correctAnswer: las palabras de alta imaginabilidad (concretas) se reconocen más rápido que las abstractas → evidencia de que el procesamiento semántico implica representaciones multimodales (simulaciones perceptivomotoras) compatibles con la semántica embodied (Barsalou)
        rationale: "El efecto de imaginabilidad (Paivio 1971; Schwanenflugel 1991): las palabras concretas de alta imaginabilidad tienen ventaja de procesamiento; se explica con la teoría del doble código (Paivio) o con la semántica encarnada (embodied semantics) de Barsalou."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué predicciones hace el modelo de dual-path (Pickering/Branigan) para el priming sintáctico y cuál es la evidencia? (que el priming sintáctico no puede modelarse/el modelo dual-path propone que el sistema de producción sintáctica tiene dos componentes: el gramatical (reglas de combinación) y el léxico (relaciones lemma-sintaxis, combinational nodes) → el priming sintáctico sin solapamiento léxico ('structural priming') activa los nodos combinacionales abstractos → el priming léxico+sintáctico (boost effect: coincidencia del verbo principal) es más fuerte → separa la repetición de estructura de la repetición léxica/que el priming sintáctico es solo repetición léxica)"
        correctAnswer: el modelo dual-path separa nodos gramaticales abstractos de nodos combinacionales léxicos → el priming sintáctico sin solapamiento léxico activa los nodos abstractos; el boost effect (coincidencia del verbo) produce priming más fuerte porque activa también el nodo léxico
        rationale: "Pickering/Branigan (1998): el dual-path model explica el priming sintáctico abstracto (sin solapamiento léxico) y el boost effect (priming más fuerte cuando el verbo coincide); separación entre la representación sintáctica abstracta y los nodos combinacionales léxicos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre el procesamiento de las lenguas nativas y las lenguas de señas en términos neuropsicológicos? (que las lenguas de señas se procesan en el hemisferio derecho/las lenguas de señas (ASL, LSE) activan redes análogas al lenguaje oral en el hemisferio izquierdo (área de Broca, Wernicke) → los sordos con lesiones en el hemisferio izquierdo muestran afasias del lenguaje signado análogas a las orales → la organización cerebral del lenguaje es independiente de la modalidad (oral vs. gestual)/que las lenguas de señas no tienen organización cerebral específica)"
        correctAnswer: las lenguas de señas activan redes análogas al lenguaje oral en el hemisferio izquierdo (áreas de Broca y Wernicke) → los sordos con lesiones en H izquierdo muestran afasias del lenguaje signado análogas a las orales → la organización cerebral del lenguaje es independiente de la modalidad oral/gestual
        rationale: "La neuropsicología del lenguaje signado (Poizner/Klima/Bellugi 1987): las afasias del ASL tienen perfiles similares a las del lenguaje oral con lesiones en las mismas áreas → demuestra que la lateralización del lenguaje al hemisferio izquierdo es independiente de la modalidad sensoriomotora."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'late closure' (cierre tardío) en el modelo garden-path y cómo explica la dificultad de procesamiento en 'El ladrón robó la joya que la condesa había perdido ayer'? (que 'ayer' no genera dificultad/el principio late closure (cierre tardío): el analizador adjunta el nuevo material al sintagma o cláusula que está siendo procesado actualmente → 'ayer' se adjunta preferentemente a la cláusula relativa ('había perdido ayer') en vez de a la cláusula principal ('robó ayer') → si el contexto hace preferible la adjunción a la cláusula principal, se produce un garden-path y reanálisis/que el late closure no aplica a la adjunción de adverbios)"
        correctAnswer: "late closure: el analizador adjunta el nuevo material al sintagma actualmente procesado → 'ayer' se adjunta preferentemente a la cláusula relativa ('había perdido ayer') por late closure; si el contexto hace preferible la adjunción a la cláusula principal, se produce reanálisis"
        rationale: "El late closure de Frazier explica la ambigüedad de adjunción de adverbios y cláusulas relativas (high vs. low attachment): el analizador prefiere la adjunción baja (late closure = adjunción al constituyente más reciente)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué evidencia neuropsicológica apoya la disociación entre el sistema de memoria semántica y el sistema de procesamiento sintáctico en línea? (que los dos sistemas son idénticos/los pacientes con agramatismo (lesión Broca): el léxico semántico puede estar preservado mientras la capacidad de procesar estructuras sintácticas complejas está deteriorada; los pacientes con anomia semántica (demencia semántica): el sistema léxico semántico se deteriora progresivamente pero la sintaxis puede estar preservada → la doble disociación es evidencia de sistemas separados/que el agramatismo no es un fenómeno neurológico real)"
        correctAnswer: "la doble disociación: pacientes con agramatismo (lesión de Broca) pueden preservar el léxico semántico con deterioro sintáctico; pacientes con demencia semántica preservan la sintaxis con deterioro del léxico semántico → evidencia de sistemas neurológicamente disociables"
        rationale: "La doble disociación entre el procesamiento semántico léxico y el procesamiento sintáctico (Caramazza/Berndt; Warrington/Shallice) es la evidencia neuropsicológica más sólida de la arquitectura modular del lenguaje."
        difficulty: 5
        objectives: [es.pre_reading]
