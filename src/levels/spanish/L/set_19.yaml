        question: "¿Cómo afecta el inglés como lingua franca académica (EAF) a los estándares de la escritura académica en español? (que el EAF no afecta al español académico/el EAF domina las publicaciones científicas internacionales → los académicos hispanohablantes deben publicar en inglés para tener impacto global → esto genera: (1) el impacto en el estilo: el español académico se angliciza (calcos sintácticos, nominalización excesiva); (2) diglosia académica: el inglés como lengua de las publicaciones de mayor impacto; (3) pérdida de capital simbólico del español en la ciencia; (4) doble escritura: los investigadores escriben en inglés para la comunidad internacional y en español para la local/que el inglés y el español académico son completamente equivalentes en impacto)"
        correctAnswer: "el EAF domina las publicaciones científicas internacionales → genera: anglicización del español académico (calcos, nominalización excesiva), diglosia académica (inglés como lengua de mayor impacto), pérdida de capital simbólico del español en la ciencia, y doble escritura para audiencias distintas"
        rationale: "Ammon/Canagarajah: el EAF genera diglosia académica (inglés con mayor capital simbólico); las políticas de acceso abierto y las universidades latinoamericanas intentan contrarrestar la anglicización del español académico."
