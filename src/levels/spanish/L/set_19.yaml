title: ✏️ Gramática - Escritura Académica Avanzada y Análisis de Géneros Discursivos
level: L
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Escritura académica avanzada: géneros discursivos académicos (Swales: CARS model, artículo de investigación; tesis doctoral; reseña académica; comunicación de congreso); las movidas retóricas (moves) en el artículo científico (introducción: crear un nicho, ocupar el nicho; discusión: comparación con la literatura, limitaciones, implicaciones); la construcción de la autoridad académica (citación, modalización, hedging, boosting); la escritura en inglés como lingua franca (EAF) vs. el español académico; el plagio y la integridad académica; la retórica contrastiva (Kaplan); la metadiscursividad (Hyland); revisión y corrección del texto académico."
example: "El modelo CARS de Swales → movida 1 (establecer un territorio): reclamar centralidad, generalizar el tema, revisar la literatura → movida 2 (establecer un nicho): contrastiva, indicativa, continuativa → movida 3 (ocupar el nicho): anunciar el propósito del estudio."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Géneros y Movidas Retóricas
    exercises:
      - type: grammar
        question: "¿Cuáles son las tres movidas retóricas (moves) del modelo CARS de Swales para la introducción de un artículo científico? (que la introducción solo presenta el tema/movida 1 (establecer un territorio): reclamar la centralidad del área, generalizar el tema, revisar la literatura; movida 2 (establecer un nicho): identificar un hueco, contradecir la literatura, plantear una pregunta; movida 3 (ocupar el nicho): anunciar el propósito, describir la metodología, anticipar los hallazgos → cada movida realiza una función retórica en la legitimación del artículo/que las movidas CARS son solo para el inglés)"
        correctAnswer: "movida 1 (establecer un territorio): reclamar centralidad, revisar la literatura; movida 2 (establecer un nicho): identificar un hueco en la literatura o contradecirla; movida 3 (ocupar el nicho): anunciar el propósito del estudio, describir la metodología y anticipar hallazgos"
        rationale: "Swales (1990, 2004): el modelo CARS (Create A Research Space) describe la organización retórica de la introducción del artículo científico en inglés; su aplicabilidad al español académico ha sido estudiada por Mur-Dueñas y otros."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'hedging' en la escritura académica y qué función retórica cumple? (que el hedging es un error estilístico/el hedging (modalización epistémica: 'parece que', 'podría sugerir', 'es posible que', 'los datos indican que') es la atenuación de las afirmaciones del autor → cumple la función retórica de proteger la imagen del investigador ante posible falsación; señalar la diferencia entre evidencia y interpretación; invitar al lector a la evaluación crítica → es una marca de cortesía académica hacia la comunidad científica/que el hedging elimina la claridad del texto académico)"
        correctAnswer: "el hedging (modalización epistémica: 'parece que', 'podría sugerir', 'es posible que') atenúa las afirmaciones del autor → protege la imagen del investigador ante posible falsación; señala la diferencia entre evidencia e interpretación; es una marca de cortesía hacia la comunidad científica"
        rationale: "Hyland (1998): el hedging en la escritura académica es una estrategia retórica fundamental; la escritura académica sin hedging es percibida como arrogante o dogmática; con exceso de hedging, como insegura o no comprometida."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre el hedging y el boosting en la metadiscursividad de Hyland? (que el boosting y el hedging son equivalentes/hedging: atenúa la certeza del autor ('parece que', 'podría ser', 'hay indicios de') → protege la imagen académica; boosting: refuerza la certeza del autor ('claramente', 'demuestra que', 'sin duda', 'es evidente que') → aumenta el impacto retórico y el compromiso con la afirmación → el texto académico combina ambos estratégicamente/que el boosting no existe en el español académico)"
        correctAnswer: "hedging: atenúa la certeza del autor ('parece que', 'podría ser') → protege la imagen; boosting: refuerza la certeza ('claramente', 'demuestra que', 'es evidente que') → aumenta el impacto retórico y el compromiso con la afirmación → el texto académico combina ambos estratégicamente"
        rationale: "Hyland (2005): el metadiscurso académico incluye marcadores interaccionales (hedges, boosters, attitude markers) que regulan la relación entre el autor, el texto y el lector; el uso inadecuado de uno u otro es un indicador de competencia (o incompetencia) discursiva."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la retórica contrastiva de Kaplan y qué críticas ha recibido? (que la retórica contrastiva demuestra que el español es inferior al inglés/Kaplan (1966): la organización del texto académico refleja patrones de pensamiento culturales distintos → el inglés tiene organización lineal directa; el árabe tiene organización en espiral; el español y otras lenguas románicas incluyen digresiones que el lector anglosajón considera irrelevantes → críticas: el modelo es etnocéntrico (asume el inglés como norma), sobresimlifica la variación intralingüística, y los patrones son más específicos de géneros y registros que de lenguas/que la retórica contrastiva ha sido completamente abandonada)"
        correctAnswer: "Kaplan (1966): la organización del texto refleja patrones culturales → inglés: lineal; árabe: espiral; español/románicas: incluyen digresiones → críticas: etnocentrismo (asume el inglés como norma), simplificación de la variación intralingüística, los patrones son más específicos de géneros que de lenguas"
        rationale: "La retórica contrastiva (Kaplan 1966) fue muy influyente en la enseñanza de escritura en L2; fue criticada por Connor y otros por su esencialismo cultural y etnocentrismo, aunque revitalizada con enfoques más matizados (escritura intercultural)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son las movidas retóricas de la sección de discusión en un artículo científico según Swales/Hopkins y cómo se ordenan? (que la discusión solo presenta los resultados/las movidas retóricas de la discusión: (1) declarar el resultado principal; (2) comparar con la literatura (confirmar, desconfirmar, explicar discrepancias); (3) explicar resultados inesperados; (4) plantear las limitaciones del estudio; (5) implicaciones teóricas y/o prácticas; (6) recomendaciones para futuras investigaciones → el orden puede variar pero las movidas son recurrentes en el artículo científico/que la discusión no tiene movidas retóricas específicas)"
        correctAnswer: "movidas de la discusión: (1) declarar el resultado principal; (2) comparar con la literatura (confirmar, desconfirmar, explicar discrepancias); (3) explicar resultados inesperados; (4) plantear limitaciones; (5) implicaciones teóricas/prácticas; (6) recomendaciones para futuras investigaciones"
        rationale: "Hopkins/Dudley-Evans (1988)/Swales (2004): las movidas retóricas de la discusión del artículo científico son recurrentes cross-lingüísticamente aunque su orden y frecuencia varían entre disciplinas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre la cita directa, la paráfrasis y la síntesis en el texto académico y qué función cumple cada una? (que todas las citas son equivalentes/cita directa: reproducción textual entrecomillada → se usa cuando la formulación exacta es importante (definición del autor, formulación icónica); paráfrasis: reformulación de la idea del autor con palabras propias → se usa para integrar la idea en el propio argumento; síntesis: integración de varias fuentes para construir el propio punto de vista → la más sofisticada → el plagio ocurre cuando no se atribuye la fuente en ninguna de las tres/que la paráfrasis es siempre plagio)"
        correctAnswer: "cita directa: reproducción textual entrecomillada → cuando la formulación exacta es importante; paráfrasis: reformulación con palabras propias → para integrar la idea en el propio argumento; síntesis: integración de varias fuentes → la más sofisticada → el plagio ocurre cuando no se atribuye la fuente"
        rationale: "La distinción cita/paráfrasis/síntesis distingue tres formas de incorporar fuentes: cita (reproducción textual), paráfrasis (reformulación) y síntesis (integración de varias); el plagio es usar cualquiera sin atribución."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los marcadores de evidencialidad en el texto académico y cómo se diferencian de los marcadores epistémicos? (que son lo mismo/marcadores de evidencialidad: indican la fuente de la información ('según X', 'X afirma que', 'los datos muestran que') → dicen de DÓNDE viene el conocimiento; marcadores epistémicos: indican el grado de certeza del hablante sobre la información ('es probable que', 'parece que', 'sin duda') → dicen qué TAN seguro está el hablante → un texto puede combinar ambos/que la evidencialidad no existe en español)"
        correctAnswer: "marcadores de evidencialidad: indican la fuente de la información ('según X', 'X afirma que') → de DÓNDE viene el conocimiento; marcadores epistémicos: indican el grado de certeza del hablante ('es probable que', 'parece que') → qué TAN seguro está → el texto académico combina ambos estratégicamente"
        rationale: "La distinción evidencialidad/epistemicidad es relevante en la escritura académica: la evidencialidad atribuye la fuente (citación, datos, observación); la epistemicidad expresa la actitud del autor hacia la proposición (hedging, boosting)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencias hay entre el estilo académico del español y el del inglés en la organización de la información? (que son idénticos/el español académico tiende a: mayor uso de oraciones subordinadas complejas; mayor presencia del autor en primera persona del plural ('consideramos que'); mayor tolerancia para las digresiones y la discusión filosófica contextual; el inglés académico anglosajón tiende a: organización lineal y directa ('tell them what you'll tell them, tell them, tell them what you told them'); economía en la extensión oracional; menor tolerancia para las digresiones/que el español académico evita la primera persona)"
        correctAnswer: "el español académico tiende a: oraciones subordinadas complejas, mayor presencia autoral en primera persona del plural, mayor tolerancia para digresiones contextuales filosóficas; el inglés académico anglosajón tiende a: organización lineal directa, economía oracional, menor tolerancia para digresiones"
        rationale: "La retórica contrastiva distingue el español académico (subordinadas complejas, tolerancia para digresiones filosóficas) del inglés anglosajón (organización lineal directa, economía oracional)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el género 'reseña académica' y cuáles son sus movidas retóricas características? (que la reseña es solo un resumen/la reseña académica: descripción y evaluación crítica de un trabajo publicado → movidas retóricas: (1) presentación bibliográfica y del autor; (2) descripción del contenido (estructura, argumentos principales); (3) evaluación crítica (valoración de los puntos fuertes y débiles); (4) indicación de la audiencia recomendada → la reseña no es un resumen sino un texto evaluativo que posiciona al reseñador en relación con el campo/que la reseña no tiene movidas retóricas propias)"
        correctAnswer: "la reseña académica es descripción + evaluación crítica → movidas: (1) presentación bibliográfica; (2) descripción del contenido (estructura, argumentos); (3) evaluación crítica (puntos fuertes y débiles); (4) indicación de la audiencia recomendada → no es un resumen sino un texto evaluativo que posiciona al reseñador en el campo"
        rationale: "El género 'reseña académica' (Hyland 2004; Motta-Roth 1998): sus movidas retóricas son recurrentes cross-lingüísticamente aunque el peso de la evaluación vs. la descripción varía entre disciplinas y tradiciones culturales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son los principios de la revisión del texto académico y qué niveles de edición existen? (que la revisión es solo corrección ortográfica/revisión en tres niveles: (1) macroestuctura (estructura global del texto, movidas retóricas, coherencia argumentativa, organización por secciones); (2) mesoestructura (párrafos: coherencia, progresión temática, frases temáticas, conectores); (3) microestructura (oración: corrección gramatical, puntuación, léxico adecuado, ortografía) → la revisión debe comenzar por el nivel más alto (macroestructura) y terminar por el más bajo/que solo existe la corrección de errores gramaticales)"
        correctAnswer: "revisión en tres niveles: (1) macroestructura (estructura global, movidas retóricas, coherencia argumentativa); (2) mesoestructura (párrafos: coherencia, progresión temática, conectores); (3) microestructura (oración: gramática, puntuación, léxico, ortografía) → comenzar siempre por el nivel más alto"
        rationale: "Los tres niveles de revisión del texto académico (Cassany 1993; Swales/Feak 2004): la revisión bottom-up (de errores) es la menos eficaz; la revisión top-down (macroestructura primero) es la más eficaz y la que caracteriza a los escritores académicos expertos."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Argumentación y Coherencia Textual
    exercises:
      - type: grammar
        question: "¿Qué es la progresión temática y cuáles son los tres tipos principales en el texto académico? (que el tema siempre cambia en cada oración/la progresión temática es la forma en que la información nueva (rema) se convierte en punto de partida (tema) en la oración siguiente; tipos: (1) progresión lineal: el rema de una oración se convierte en tema de la siguiente; (2) progresión con tema constante: el mismo tema se repite en oraciones sucesivas; (3) progresión de tema derivado: los temas se derivan de un hipertema → los textos académicos combinan los tres tipos/que la progresión temática es solo para la poesía)"
        correctAnswer: "tres tipos: (1) progresión lineal: el rema de una oración se convierte en tema de la siguiente; (2) tema constante: el mismo tema se repite; (3) tema derivado: los temas se derivan de un hipertema → los textos académicos combinan los tres tipos para crear coherencia y flujo informativo"
        rationale: "La progresión temática (Daneš 1974; Fries 1994): es el mecanismo de la cohesión textual que articula la estructura informativa (tema/rema/información dada/información nueva) con la organización del párrafo y el texto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la coherencia textual y cómo se distingue de la cohesión? (que son términos intercambiables/cohesión: los mecanismos lingüísticos superficiales que ligan las oraciones entre sí (pronombres anafóricos, conectores, elipsis, sustitución léxica → son los lazos de la superficie textual); coherencia: la unidad semántica profunda del texto, la consistencia temática y argumental que permite interpretarlo como un todo con sentido → un texto puede ser cohesivo pero incoherente; puede ser coherente sin marcadores de cohesión explícitos/que la coherencia solo depende de los conectores)"
        correctAnswer: "cohesión: mecanismos lingüísticos superficiales que ligan las oraciones (anáforas, conectores, elipsis, sustitución léxica); coherencia: unidad semántica profunda, consistencia temática y argumental → un texto puede ser cohesivo pero incoherente; puede ser coherente sin marcadores de cohesión explícitos"
        rationale: "La distinción cohesión/coherencia (Halliday/Hasan 1976; van Dijk 1977): la cohesión es la red de relaciones lingüísticas explícitas en la superficie textual; la coherencia es la unidad semántica-pragmática profunda que emerge de la interpretación global del texto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los conectores discursivos y cuáles son los principales tipos en el español académico? (que todos los conectores son equivalentes/los conectores discursivos articulan las relaciones semánticas entre segmentos del texto → tipos: aditivos ('además', 'asimismo', 'igualmente'); adversativos ('sin embargo', 'no obstante', 'ahora bien', 'con todo'); causales ('por tanto', 'en consecuencia', 'así pues'); condicionales ('en caso de que', 'a condición de que'); explicativos ('es decir', 'a saber', 'esto es') → el uso adecuado de los conectores es un indicador de la calidad de la escritura académica/que los conectores no son relevantes para la coherencia textual)"
        correctAnswer: "tipos de conectores discursivos: aditivos ('además', 'asimismo'); adversativos ('sin embargo', 'no obstante', 'ahora bien'); causales-consecutivos ('por tanto', 'en consecuencia'); condicionales; explicativos ('es decir', 'a saber') → el uso adecuado es un indicador de la calidad de la escritura académica"
        rationale: "Martín Zorraquino/Portolés 1999: los conectores tienen función procedimental (articulan relaciones semánticas); la RAE/ASALE los describe como marcadores del discurso → el uso inadecuado es un indicador frecuente de escritura académica inexperta."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la intertextualidad en el texto académico y cómo funciona como mecanismo de construcción de la autoridad? (que la intertextualidad es solo el plagio/la intertextualidad académica: el texto académico es un diálogo con los textos previos del campo → la citación crea una red de autoridad que legitima el propio argumento: el autor cita a los más citados, se posiciona respecto a las controversias, y establece su contribución como una adición al conocimiento acumulado → la citación es la práctica intertextual más visible del texto académico/que la intertextualidad es solo una estrategia literaria)"
        correctAnswer: "la intertextualidad académica: el texto académico dialoga con los textos previos del campo → la citación crea una red de autoridad que legitima el argumento; el autor se posiciona respecto a las controversias y establece su contribución como adición al conocimiento acumulado"
        rationale: "Bazerman (1988)/Swales (1990): la citación en el texto académico es una práctica intertextual que construye la autoridad del autor posicionándolo en la red de referencias del campo; la citación no es ornamental sino retóricamente esencial."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué características debe tener un párrafo académico bien construido y qué es la 'oración temática'? (que el párrafo es solo una unidad ortográfica/un párrafo académico bien construido tiene: (1) oración temática (topic sentence): la oración que contiene la idea principal del párrafo, generalmente al inicio; (2) desarrollo: las oraciones que desarrollan, ejemplifican o evidencian la oración temática; (3) oración de cierre (optional): que resume o crea un puente con el siguiente párrafo → la unidad y coherencia del párrafo se miden por la relación entre cada oración y la oración temática/que el párrafo solo necesita ser de longitud adecuada)"
        correctAnswer: "el párrafo académico tiene: (1) oración temática (topic sentence): la idea principal, generalmente al inicio; (2) desarrollo: oraciones que desarrollan, ejemplifican o evidencian la oración temática; (3) oración de cierre (opcional): resume o crea puente → la coherencia del párrafo se mide por la relación de cada oración con la temática"
        rationale: "La teoría del párrafo académico (Rodgers 1966; Halliday 1985): la oración temática (topic sentence) es el componente retórico más importante del párrafo; su posición (inicial, final, implícita) varía culturalmente y por género."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el argumento de tipo Toulmin y cuáles son sus componentes en el texto académico? (que el argumento de Toulmin es solo para el debate oral/Toulmin (1958): el argumento tiene: Claim (tesis que se defiende), Data (datos/evidencia que apoya la tesis), Warrant (la justificación que conecta datos y tesis), Backing (el respaldo teórico del warrant), Qualifier (el grado de certeza: 'en la mayoría de los casos', 'probablemente') y Rebuttal (las condiciones bajo las cuales la tesis no aplica) → el modelo de Toulmin describe la microestructura argumentativa de los textos académicos/que el modelo de Toulmin es solo para las ciencias)"
        correctAnswer: "Toulmin (1958): Claim (tesis), Data (evidencia que la apoya), Warrant (la justificación que conecta datos y tesis), Backing (respaldo teórico del warrant), Qualifier (grado de certeza) y Rebuttal (condiciones bajo las cuales la tesis no aplica) → describe la microestructura argumentativa de los textos académicos"
        rationale: "El modelo de Toulmin (1958) es uno de los marcos más usados en la enseñanza de la argumentación académica; describe los componentes pragmáticos y epistémicos del argumento como unidad retórica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'español académico estándar' y cuáles son sus principales características léxico-gramaticales? (que el español académico es igual al español coloquial formal/el español académico tiene: (1) nominalización de procesos ('la realización del análisis' en vez de 'analizar'); (2) uso de la voz pasiva perifrástica e impersonal ('se ha demostrado que'); (3) léxico técnico y especializado; (4) uso de construcciones absolutas y participios; (5) ausencia de marcadores coloquiales; (6) uso moderado del subjuntivo en contextos de modalización → el español académico es una variedad de alta formalidad/que el español académico no tiene características léxico-gramaticales específicas)"
        correctAnswer: "el español académico tiene: nominalización de procesos ('la realización del análisis'); voz pasiva impersonal ('se ha demostrado'); léxico técnico especializado; construcciones absolutas; ausencia de marcadores coloquiales; uso moderado del subjuntivo para modalización"
        rationale: "El español académico (García Negroni 2010; Cassany 1993): se caracteriza por la nominalización, la impersonalización (borramiento del agente) y el léxico técnico; estas características son específicas del registro académico y se adquieren con la socialización académica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son las diferencias entre el resumen (abstract), el sumario ejecutivo y el estado de la cuestión como géneros académicos? (que son lo mismo con distinto nombre/abstract: resumen del artículo (objetivo, metodología, resultados, conclusiones) → condensado (150-300 palabras) → para que el lector decida si leer el artículo; sumario ejecutivo: resumen orientado a la toma de decisiones por no especialistas → incluye recomendaciones; estado de la cuestión (literature review): síntesis crítica de la investigación existente en un campo para identificar huecos y fundamentar una nueva investigación → texto completo, no condensado/que los tres géneros son intercambiables)"
        correctAnswer: "abstract: resumen condensado del artículo (objetivo, metodología, resultados) → para que el lector decida si leer; sumario ejecutivo: orientado a la toma de decisiones por no especialistas, incluye recomendaciones; estado de la cuestión: síntesis crítica de la investigación existente para identificar huecos y fundamentar una nueva investigación"
        rationale: "Los géneros académicos condensados (abstract, sumario, estado de la cuestión) tienen funciones retóricas distintas dentro de la comunidad académica y en la comunicación con no especialistas; sus diferencias reflejan diferentes audiencias y propósitos comunicativos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las 'familias de géneros' (genre sets, genre colonies) y por qué son importantes para la enseñanza de la escritura académica? (que los géneros académicos son todos independientes/las familias de géneros (genre sets: Devitt; genre colonies: Bhatia): los géneros se organizan en constelaciones relacionadas por propósito, audiencia y contexto → los géneros académicos de la investigación forman un conjunto (artículo, abstract, reseña, ponencia, tesis, informe) que comparte prácticas retóricas y convenciones de la comunidad disciplinar → el conocimiento de las relaciones entre géneros facilita la adquisición de nuevos géneros/que los géneros académicos son todos equivalentes)"
        correctAnswer: las familias de géneros organizan los géneros en constelaciones relacionadas por propósito, audiencia y contexto → los géneros académicos (artículo, abstract, reseña, ponencia, tesis, informe) comparten prácticas retóricas de la comunidad disciplinar → el conocimiento de las relaciones entre géneros facilita la adquisición de nuevos géneros
        rationale: "Las familias de géneros (Devitt 1991; Bhatia 2004): los géneros no son unidades aisladas sino que se organizan en constelaciones relacionadas; la enseñanza de géneros académicos debe abordar las relaciones entre géneros, no solo géneros individuales."
