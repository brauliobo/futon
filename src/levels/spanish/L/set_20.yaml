title: 📝 Revisión General - Nivel L
level: L
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Revisión integradora de todos los 19 temas del nivel L: lingüística teórica avanzada (set 01), filosofía posmoderna/giro lingüístico (02), sintaxis avanzada/cartografía (03), bioética (04), semántica formal (05), filosofía de la mente (06), pragmática avanzada/relevancia (07), sociología del conocimiento (08), morfología teórica (09), teoría literaria/estudios culturales (10), fonología avanzada/OT (11), antropología política (12), psicolingüística experimental (13), historia global/imperios (14), adquisición del lenguaje/bilingüismo (15), filosofía política contemporánea (16), variación lingüística/sociolingüística (17), neurociencia cognitiva (18), escritura académica (19). La revisión cruza explícitamente los temas para exigir síntesis transdisciplinar."
example: "La revisión del nivel L integra los 19 temas mediante conexiones transdisciplinares → exige el nivel más alto de síntesis académica en español."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Integración y Síntesis - Parte I
    exercises:
      - type: grammar
        question: "¿Cómo se relacionan el Principio de Relevancia de Sperber/Wilson (set 07) y el modelo predictive processing de Friston/Clark (set 18) en su explicación del procesamiento del lenguaje? (que no tienen relación/ambos proponen que el procesamiento cognitivo minimiza el esfuerzo → en la TR: el oyente busca los efectos cognitivos máximos con el mínimo esfuerzo de procesamiento; en el PP: el cerebro minimiza el error de predicción actualizando el modelo generativo → la TR describe la función pragmática del procesamiento; el PP describe el mecanismo neural que la implementa → son complementarios a distintos niveles de descripción/que la TR y el PP se contradicen)"
        correctAnswer: ambos proponen la minimización del esfuerzo cognitivo → la TR describe la función pragmática (efectos cognitivos máximos con mínimo esfuerzo de procesamiento); el PP describe el mecanismo neural (minimizar el error de predicción) → son complementarios a distintos niveles de descripción del mismo proceso
        rationale: "La conexión TR/PP es un área de investigación activa (Sperber/Mazzarello; Friston et al.): la relevancia óptima de la TR puede reformularse en términos del PP como la selección del input que minimiza la energía libre (free energy) manteniendo el modelo generativo actualizado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tiene en común el argumento de la pobreza del estímulo de Chomsky (set 15) con el argumento de Sperber/Wilson de que la relevancia óptima es universal (set 07)? (que son argumentos contradictorios/ambos postulan una predisposición innata para el procesamiento del lenguaje: Chomsky → el innatismo gramatical (conocimiento lingüístico innato en el DAL); Sperber/Wilson → el principio de relevancia (la cognición humana busca maximizar la relevancia: es una tendencia de diseño del sistema cognitivo, no cultural) → ambos argumentan que ciertos aspectos del procesamiento del lenguaje no pueden explicarse solo por el aprendizaje desde el input/que la pobreza del estímulo prueba que el lenguaje no es innato)"
        correctAnswer: "ambos postulan una predisposición innata para el lenguaje → Chomsky: el conocimiento gramatical no puede derivarse del input (pobreza del estímulo → DAL); Sperber/Wilson: la relevancia óptima es una propiedad universal del sistema cognitivo, no cultural → ambos argumentan que el input no es suficiente para explicar el procesamiento lingüístico humano"
        rationale: "La conexión innatismo gramatical (Chomsky)/principio de relevancia (Sperber/Wilson): ambos son argumentos nativistas sobre el lenguaje, aunque a distintos niveles (gramática vs. pragmática); la TR es compatible con el generativismo pero también con el usage-based model de Tomasello."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan la violencia simbólica de Bourdieu (set 08) y el concepto de doxa con el análisis del discurso crítico de Fairclough (set K/09)? (que son teorías incompatibles/la violencia simbólica de Bourdieu: la dominación ejercida con la complicidad tácita del dominado gracias a la doxa (lo que se da por sentado) → el ADC de Fairclough: el poder se ejerce a través del discurso de forma que las relaciones de dominación se naturalizan → ambos analizan cómo la dominación se vuelve invisible al naturalizarse en las prácticas cotidianas (discursivas o no)/que Bourdieu rechazó el análisis del discurso)"
        correctAnswer: "la violencia simbólica (Bourdieu) y el ADC (Fairclough) analizan cómo la dominación se naturaliza en las prácticas cotidianas → la doxa (Bourdieu) es la naturalización de lo social en el cuerpo y el habitus; el ADC analiza cómo la naturalización se realiza discursivamente → son complementarios: el ADC es el análisis lingüístico de los mecanismos que producen la doxa"
        rationale: "La conexión Bourdieu/ADC es explícita en autores como Thompson (1984) y Fairclough (2003): la violencia simbólica requiere mecanismos discursivos para producirse; el ADC es el análisis de esos mecanismos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se conectan la teoría de la Morfología Distribuida (set 09) con el Programa Minimalista (set 01) en su visión de la arquitectura del lenguaje? (que son teorías independientes sin conexión/la MD es la morfología del PM: ambas comparten los supuestos de que no hay léxico preespecificado (las raíces se insertan en la sintaxis), que los morfemas son nodos terminales sintácticos (la morfología es la realización PF de la sintaxis), y que la computación es Merge → la MD implementa el PM a nivel morfológico: lo que el PM llama 'operación Merge' y 'rasgos formales', la MD lo implementa con nodos terminales, ítems de vocabulario e inserción tardía/que la MD rechaza el Programa Minimalista)"
        correctAnswer: "la MD implementa el PM a nivel morfológico → ambas comparten: no hay léxico preespecificado (raíces directamente en la sintaxis), los morfemas son nodos terminales sintácticos (morfología = realización PF de la sintaxis), la computación es Merge → la MD es la teoría morfológica del PM"
        rationale: "La MD (Halle/Marantz 1993) se desarrolló explícitamente dentro del marco generativista minimalista; es la morfología nativa del PM: la inserción tardía, los nodos terminales sintácticos y el principio del subconjunto implementan directamente los supuestos del PM."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué conexión existe entre la necropolítica de Mbembe (set 12) y la biopolítica de Foucault en el análisis de las formas contemporáneas de violencia? (que son teorías sobre la paz/ambas analizan cómo el poder soberano gestiona los cuerpos y la vida → la biopolítica (Foucault): 'hacer vivir y dejar morir'; la necropolítica (Mbembe): 'dejar morir e incluso hacer morir' → la necropolítica es la extensión poscolonial de la biopolítica: Mbembe argumenta que la biopolítica de Foucault no puede explicar adecuadamente la violencia colonial y la distribución racial de la muerte/que Mbembe y Foucault están de acuerdo en todo)"
        correctAnswer: "la biopolítica (Foucault) gestiona la vida ('hacer vivir y dejar morir'); la necropolítica (Mbembe) gestiona la muerte ('dejar morir, hacer morir') → la necropolítica es la extensión poscolonial de la biopolítica: Foucault no puede explicar adecuadamente la violencia colonial y la distribución racial de la muerte"
        rationale: "Mbembe (2003): la necropolítica es una crítica poscolonial de la biopolítica de Foucault; la biopolítica asume un Estado soberano moderno europeo, mientras la necropolítica describe las zonas coloniales y poscoloniales donde el soberano ejerce el poder de matar directamente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan la hipótesis del marcador somático de Damasio (set 18) con la teoría de la racionalidad limitada de Kahneman (Sistema 1/Sistema 2, referenciado en set K/12) en la toma de decisiones? (que son teorías contradictorias/Damasio: las emociones (marcadores somáticos) guían la toma de decisiones → sin ellos, la decisión es imposible aunque el razonamiento lógico esté intacto; Kahneman/Sistema 1: el pensamiento rápido, intuitivo y emocional → heurísticas y sesgos; Sistema 2: el pensamiento lento y deliberativo → ambas teorías argumentan que las decisiones cotidianas son guiadas principalmente por procesos rápidos e intuitivos (emocionales), no por el razonamiento deliberativo/que Damasio y Kahneman rechazaron el rol de las emociones en las decisiones)"
        correctAnswer: "Damasio: las emociones (marcadores somáticos) son necesarias para tomar decisiones → sin ellas, la decisión es imposible; Kahneman Sistema 1: el pensamiento rápido e intuitivo (emocional) guía la mayoría de las decisiones cotidianas → ambas teorías argumentan que las decisiones son principalmente emocionales/intuitivas, no deliberativas"
        rationale: "La conexión Damasio/Kahneman es fundamental en la psicología y neurociencia de la toma de decisiones: los marcadores somáticos de Damasio son el correlato neurológico del Sistema 1 de Kahneman; ambos argumentan contra el modelo del agente racional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo dialogan el constructivismo social de Berger/Luckmann (set 08) y la teoría del género performativo de Butler (set 02) en relación con la identidad social? (que son incompatibles/Berger/Luckmann: la realidad social se construye mediante externalización, objetivación e internalización → las instituciones y las identidades son construcciones sociales que se reifican; Butler: el género no es una esencia sino que se produce en la repetición de actos performativos → la iterabilidad abre la posibilidad de resignificación subversiva → ambas teorías comparten el constructivismo radical: las identidades sociales no son naturales sino construidas; Butler añade la posibilidad de subversión mediante la resignificación/que Butler rechazó el constructivismo)"
        correctAnswer: "Berger/Luckmann: la realidad social se construye por externalización/objetivación/internalización → las identidades son construcciones reificadas; Butler: el género se produce en la repetición performativa (no es una esencia) → ambas son constructivistas radicales; Butler añade la posibilidad de subversión mediante la resignificación de las normas"
        rationale: "El diálogo entre el constructivismo social de Berger/Luckmann y el constructivismo performativo de Butler es explícito en los Gender Studies; Butler parte del constructivismo social pero lo radicaliza al añadir la dimensión performativa y la posibilidad de subversión."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la conexión entre la 'gran divergencia' de Pomeranz (set 14) y el sistema-mundo de Wallerstein (set 14) y la segunda esclavitud de Tomich en la explicación del capitalismo moderno? (que son teorías sobre la historia medieval/Pomeranz: la industrialización europea fue contingente (carbón + recursos americanos); Wallerstein: el capitalismo se organizó desde el siglo XVI en zonas de centro y periferia mediante intercambio desigual; Tomich: la segunda esclavitud en Cuba/Brasil/EE.UU. fue la respuesta del capitalismo a la creciente demanda de materias primas del centro industrial → las tres teorías se complementan: el sistema-mundo explica la estructura; la gran divergencia explica los mecanismos del centro; la segunda esclavitud explica la expansión de la periferia/que son teorías incompatibles)"
        correctAnswer: "las tres teorías se complementan → Wallerstein: estructura centro-periferia desde el siglo XVI; Pomeranz: la industrialización del centro fue contingente (carbón + recursos americanos); Tomich: la segunda esclavitud fue la expansión de la periferia para abastecer al centro industrial → juntas explican la estructura, los mecanismos y la dinámica del capitalismo atlántico"
        rationale: "La integración Pomeranz/Wallerstein/Tomich es propia de la historia global contemporánea (Beckert: 'Empire of Cotton'): el capitalismo industrial se construyó sobre la esclavitud atlántica, el carbón y el intercambio desigual de forma simultánea y relacionada."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tienen en común el modelo garden-path de Frazier (set 13) y la Teoría de la Optimidad (set 11) en su perspectiva sobre el procesamiento de la complejidad? (que son teorías de campos completamente distintos/ambas postulan que el sistema elige la representación/candidato óptimo bajo restricciones → el garden-path: el analizador sintáctico elige la estructura sintáctica mínima (minimal attachment) como la de menor coste computacional, y la paga cuando hay que reanalizarla; la OT: el candidato óptimo es el que viola las restricciones más bajas en la jerarquía → en ambas, el sistema procesa minimizando el coste bajo restricciones ordenadas/que el garden-path y la OT son incompatibles con toda comparación)"
        correctAnswer: "ambas postulan que el sistema elige la representación óptima bajo restricciones → garden-path: el analizador elige la estructura de menor coste computacional (minimal attachment), pagando el coste cuando hay reanálisis; OT: el candidato óptimo viola las restricciones más bajas → en ambas, el sistema minimiza el coste bajo restricciones jerarquizadas"
        rationale: "La conexión garden-path/OT es menos obvia pero conceptualmente fértil: ambos son marcos que modelan la selección del 'mejor candidato' bajo restricciones ordenadas; la diferencia es que el garden-path es serial y la OT es paralela."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan la hipótesis de la interdependencia lingüística de Cummins (BICS/CALP, set 15) y el concepto de capital lingüístico de Bourdieu (set 17) en la comprensión del bilingüismo y la desigualdad educativa? (que no tienen relación/Cummins: las habilidades académicas de alto nivel (CALP) se transfieren entre lenguas → fortalecer la L1 fortalece también la L2; Bourdieu: el capital lingüístico (acceso a las variedades de prestigio) se convierte en capital económico en el mercado → la conexión: los estudiantes inmigrantes que no desarrollan CALP en su L1 tienen menos capital lingüístico académico en L2 → la educación bilingüe que fortalece la L1 aumenta el capital lingüístico total/que Cummins y Bourdieu son incompatibles)"
        correctAnswer: "Cummins: CALP se transfiere entre lenguas → fortalecer la L1 fortalece la L2; Bourdieu: el capital lingüístico (acceso a variedades de prestigio) se convierte en capital económico → la conexión: los estudiantes inmigrantes que no desarrollan CALP en L1 tienen menos capital lingüístico académico en L2; la educación bilingüe que fortalece la L1 aumenta el capital lingüístico total"
        rationale: "La conexión Cummins/Bourdieu es explícita en la sociolingüística de la educación (Pennycook 1994; Canagarajah 1999): la CALP de Cummins es el capital lingüístico académico de Bourdieu; la falta de desarrollo de la CALP en la L1 reduce la transferencia al capital lingüístico académico en la L2."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Integración y Síntesis - Parte II
    exercises:
      - type: grammar
        question: "¿Qué conexión existe entre la cartografía sintáctica de Rizzi (set 03) y la interfaz prosodia-pragmática en la realización del foco en español (set 07/11)? (que no hay conexión entre la sintaxis y la pragmática/Rizzi: el foco contrastivo se mueve a FocusP en la periferia izquierda de la oración; la entonación (set 11): el foco informativo se realiza con el acento de pitch nuclear (Sp-ToBI: L+H*) en el constituyente focal; la pragmática (set 07): el foco es la información nueva que el comunicador presenta como relevante → la interfaz sintaxis-entonación-pragmática: la proyección sintáctica FocusP tiene realización prosódica en el acento nuclear y función pragmática de organización informativa/que la sintaxis y la pragmática son módulos completamente separados)"
        correctAnswer: "la proyección FocusP (Rizzi) es el mecanismo sintáctico que ubica el foco; la entonación (Sp-ToBI: L+H* o H+L* en el constituyente focal) es su realización prosódica; la pragmática (relevancia) es su función → la interfaz sintaxis-entonación-pragmática: FocusP tiene realización en el acento nuclear y función de organización informativa"
        rationale: "La interfaz sintaxis-prosodia-pragmática es uno de los temas más activos de la lingüística contemporánea; en español, la proyección FocusP de Rizzi, el sistema Sp-ToBI de Prieto y la teoría de la relevancia se conectan para explicar la realización y función del foco."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo dialogan la estética de la recepción de Jauss (set 10) y la teoría de la relevancia de Sperber/Wilson (set 07) en la comprensión del encuentro texto-lector? (que son teorías incompatibles/Jauss: el significado literario se produce en el encuentro entre el texto y el horizonte de expectativas del lector → los textos innovadores quiebran el horizonte; la TR: el proceso de interpretación busca la relevancia óptima dentro del contexto cognitivo del oyente/lector (supuestos contextuales, horizonte de expectativas) → ambas teorías comparten la idea de que el significado no está en el texto sino en el encuentro entre el texto y los supuestos contextuales del receptor/que la TR y la recepción literary no se pueden comparar)"
        correctAnswer: "Jauss: el significado emerge en el encuentro texto-horizonte de expectativas; la TR: el significado se construye inferido del enunciado en el contexto cognitivo del receptor → ambas teorías comparten que el significado no está en el texto sino en el encuentro; la TR formaliza cognitivamente lo que la estética de la recepción describe hermenéuticamente"
        rationale: "La conexión estética de la recepción/TR no es explícita en la literatura pero es conceptualmente clara: el 'horizonte de expectativas' de Jauss es una versión humanística del 'contexto cognitivo' (supuestos contextuales compartidos) de la TR."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se articulan el consentimiento informado en bioética (set 04) y el concepto de autonomía en la filosofía política de Rawls (set 16) en la definición del sujeto con derechos? (que son conceptos sin relación/la autonomía rawlsiana (primer principio de justicia: el derecho a igual libertad, incluida la libertad de tomar decisiones sobre la propia vida) es el fundamento filosófico del consentimiento informado en bioética → el consentimiento informado es la aplicación médica del principio rawlsiano de autonomía: el paciente como sujeto capaz de determinar sus propias opciones → el paternalismo médico viola el primer principio de Rawls tanto como viola el consentimiento informado/que la bioética y la filosofía política son incompatibles)"
        correctAnswer: "la autonomía rawlsiana (primer principio de justicia: derecho a igual libertad) es el fundamento filosófico del consentimiento informado en bioética → el consentimiento informado es la aplicación médica de la autonomía: el paciente como sujeto capaz de determinar sus opciones; el paternalismo médico viola el primer principio de Rawls"
        rationale: "La conexión Rawls/bioética es explícita en la filosofía médica (Beauchamp/Childress): el principio de autonomía de los Cuatro Principios de la Bioética tiene su fundamento en el liberalismo político rawlsiano y en la tradición kantiana del respeto por las personas como fines en sí mismos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan el principio de simetría del Programa Fuerte de Bloor (set 08) y el falsacionismo de Popper (referenciado en set K/06) en sus visiones de la ciencia? (que son incompatibles/Popper: el conocimiento científico se define por ser falsable → las teorías se mantienen hasta que son refutadas; el éxito y el fracaso científicos tienen explicaciones epistémicas asimétricas (el éxito se mantiene hasta refutarse; el fracaso se descarta); Bloor: el principio de simetría exige explicar el éxito y el fracaso con los mismos tipos de factores sociales → critica la asimetría popperiana: el error tiene causa social pero el éxito es autoevidente → ambos son anti-inductivistas pero difieren radicalmente sobre la simetría explicativa/que Bloor y Popper son completamente de acuerdo)"
        correctAnswer: "Popper: el éxito científico se mantiene hasta ser refutado (asimetría: el error se explica, el éxito se asume); Bloor: el principio de simetría critica esa asimetría → tanto el éxito como el fracaso deben explicarse sociológicamente → ambos son anti-inductivistas pero Bloor rechaza la asimetría epistémica de Popper"
        rationale: "La crítica del Programa Fuerte (Bloor 1976) a Popper se centra en la asimetría epistémica: Popper solo requiere explicación social para el error, mientras el Programa Fuerte exige la misma explicación sociológica para el éxito y el fracaso."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo dialogan la semántica formal de Montague (set 05) y la teoría de la relevancia (set 07) sobre el problema de la subindeterminación del significado lingüístico? (que son incompatibles/Montague: el significado lingüístico está completamente determinado por la semántica composicional → las condiciones de verdad se calculan algorítmicamente; la TR: el significado codificado lingüísticamente está radicalmente subindeterminado → el enunciado solo proporciona una forma lógica esquemática que el oyente enriquece pragmáticamente para llegar a la explicatura → la TR critica implícitamente que la semántica formal sobreestima la contribución del código lingüístico al significado comunicado/que Montague y Sperber/Wilson están de acuerdo)"
        correctAnswer: "Montague: el significado está completamente determinado por la semántica composicional → condiciones de verdad calculadas algorítmicamente; la TR: el significado codificado está radicalmente subindeterminado → solo proporciona una forma lógica esquemática que el oyente enriquece pragmáticamente → la TR critica que la semántica formal sobreestima la contribución del código lingüístico"
        rationale: "La tensión semántica formal/TR establece el debate sobre la interfaz semántica-pragmática: los relevantistas (Carston 2002) argumentan que la semántica formal subestima el enriquecimiento pragmático necesario en la comunicación real."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué tienen en común el modelo CARS de Swales para la introducción académica (set 19) y las movidas retóricas del potlatch de Mauss (set 12) como estrategias de legitimación social? (que no tienen nada en común/el potlatch de Mauss: el jefe da o destruye bienes para establecer su posición social y autoridad → la generosidad como estrategia de legitimación; el CARS de Swales: el investigador cita la literatura existente (dar reconocimiento), establece un nicho (mostrar la necesidad de su contribución) y anuncia su objetivo (ocupar el nicho) → en ambos casos, el actor social legitima su posición mediante una estrategia retórica de dar reconocimiento al campo previo y afirmar su propia contribución/que el potlatch y el CARS son completamente distintos)"
        correctAnswer: "en ambos casos, el actor social legitima su posición mediante la estrategia de reconocer/dar al campo previo y afirmar su propia contribución → el potlatch: generosidad estratégica como legitimación social; el CARS: citación de la literatura y establecimiento del nicho como legitimación académica → el don y la citación son estructuralmente análogos como mecanismos de legitimación"
        rationale: "La analogía entre el don de Mauss y la citación académica (Bourdieu: el capital simbólico académico se acumula mediante la citación) es una conexión transdisciplinar entre la antropología social y la sociología de la ciencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se relacionan el concepto de 'habitus' de Bourdieu (set 08) y el concepto de 'interlengua' de Selinker (set 15) en la comprensión de la adquisición de segundas lenguas por hablantes adultos? (que no hay relación/el habitus de Bourdieu: el sistema de disposiciones incorporadas en el cuerpo a través de la socialización → genera prácticas espontáneas coherentes con la trayectoria social; la interlengua de Selinker: el sistema lingüístico del aprendiz de L2 → generado por la transferencia de la L1 (el 'habitus lingüístico' de la L1), las estrategias de aprendizaje y la fosilización → el habitus lingüístico de la L1 es lo que genera la transferencia y, potencialmente, la fosilización/que el habitus y la interlengua son incompatibles)"
        correctAnswer: "el habitus lingüístico de la L1 (Bourdieu) es el sistema de disposiciones incorporadas sobre la gramática y el uso de la L1 → en la adquisición de L2 (Selinker), este habitus genera la transferencia y, potencialmente, la fosilización: las estructuras de la L1 que se resisten a ser reemplazadas son aquellas más profundamente incorporadas en el habitus"
        rationale: "La conexión habitus/interlengua (Pavlenko/Lantolf 2000; Dewaele 2005): el habitus lingüístico de Bourdieu explica por qué la transferencia y la fosilización son más fuertes en las estructuras que han sido más profundamente incorporadas a través de la socialización en la L1."
        difficulty: 5
