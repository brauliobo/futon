        question: "¿Cómo dialogan la filosofía posmoderna de Derrida (set 02) y el análisis del discurso crítico (ADC) de Fairclough (set K/09) en la relación entre lenguaje, poder y verdad? (que son incompatibles/Derrida: el significado nunca está presente sino siempre diferido (différance) → no hay un significado fijo ni un texto con significado único → la deconstrucción muestra cómo los textos socavan su propia coherencia; el ADC: el lenguaje reproduce y naturaliza las relaciones de poder → la ideología se manifiesta en el discurso → ambos cuestionan la transparencia del lenguaje y muestran que los textos tienen efectos de poder más allá de lo que dicen explícitamente/que Derrida y Fairclough están de acuerdo en todo)"
        correctAnswer: "Derrida: el significado está siempre diferido → los textos socavan su propia coherencia (deconstrucción); Fairclough: el lenguaje reproduce las relaciones de poder → la ideología se manifiesta en el discurso → ambos cuestionan la transparencia del lenguaje y muestran que los textos tienen efectos de poder más allá de su significado explícito"
        rationale: "La relación Derrida/ADC es compleja: el ADC de Fairclough incorpora el post-estructuralismo foucaultiano pero generalmente no el derridiano; sin embargo, ambos comparten el cuestionamiento de la transparencia lingüística y la evidencia de que el lenguaje siempre hace más de lo que dice."
