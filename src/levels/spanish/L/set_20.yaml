      - type: grammar
        question: "¿Qué conexión existe entre la 'sociedad contra el Estado' de Clastres (set 12) y el concepto de 'armas de los débiles' de James Scott (set 12) en el análisis de las estrategias de resistencia contra el poder? (que Clastres y Scott son contradictorios/Clastres: las sociedades amazónicas tienen mecanismos activos para impedir la acumulación del poder político → la distribución de la riqueza, el jefe sin poder, las ceremonias de derroche son 'armas' anti-Estado; Scott: los grupos dominados usan formas cotidianas de resistencia (sabotaje, disimulo, robo) → la infrapolitics → ambos analizan estrategias de resistencia que no confrontan directamente al poder sino que socavan sus mecanismos de acumulación y control/que son teorías sobre la cooperación social)"
        correctAnswer: "tanto Clastres como Scott analizan estrategias de resistencia que no confrontan directamente al poder sino que socavan sus mecanismos de acumulación → Clastres: los mecanismos anti-Estado de las sociedades amazónicas; Scott: la infrapolitics de los grupos dominados → la resistencia no siempre es confrontación directa sino también sabotaje de la acumulación"
        rationale: "La conexión Clastres/Scott es explícita en la antropología política contemporánea: ambos analizan formas de resistencia al poder que funcionan 'por debajo del radar' de la confrontación directa; la 'sociedad contra el Estado' de Clastres es un caso extremo de infrapolitics institucionalizada."
