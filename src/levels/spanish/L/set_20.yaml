        question: "¿Cómo se integran los conceptos de capacidades de Nussbaum (set 16), la justicia distributiva de Rawls (set 16) y la segunda esclavitud de Tomich (set 14) en una perspectiva de justicia global histórica? (que son teorías sobre distintas épocas sin integración/Rawls: las desigualdades solo son justificables si benefician a los menos aventajados; Nussbaum: la justicia exige que todos puedan desarrollar capacidades básicas de funcionamiento; Tomich: la segunda esclavitud fue la expansión masiva de la explotación que alimentó la acumulación del centro → desde estas perspectivas, el capitalismo atlántico del siglo XIX violó sistemáticamente tanto el principio de diferencia rawlsiano como el umbral de capacidades de Nussbaum: la esclavitud negó tanto los derechos como las capacidades de las personas esclavizadas/que las teorías normativas no pueden aplicarse históricamente)"
        correctAnswer: el capitalismo atlántico (Tomich) violó sistemáticamente tanto el principio de diferencia rawlsiano (la acumulación no benefició a los menos aventajados sino que se basó en su explotación extrema) como el umbral de capacidades de Nussbaum (la esclavitud negó absolutamente el desarrollo de las capacidades básicas) → la justicia global histórica exige reconocer y reparar estas violaciones
        rationale: "La aplicación de teorías normativas (Rawls, Nussbaum) al análisis histórico establece que el colonialismo y la esclavitud violaron el principio de diferencia rawlsiano y el umbral de capacidades de Nussbaum."
