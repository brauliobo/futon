title: 🎓 Gramática - Lingüística Teórica Avanzada y Gramática Universal
level: L
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada de nivel L sobre lingüística teórica: la gramática generativa transformacional de Chomsky (estructura profunda/superficial, movimiento sintáctico, la hipótesis de la innatez, GU), la Teoría de la Rección y el Ligamiento (GB), el Programa Minimalista, la interfaz léxico-sintaxis (construcciones de resultado, alternancia causativa), la teoría de la optimidad (OT) y la lingüística basada en construcciones (Goldberg)."
example: "El Programa Minimalista de Chomsky: merge (ensamble) es la operación básica → une dos elementos para crear una estructura → la gramática se reduce a las operaciones mínimas necesarias para conectar sonido y significado (interfaces SMF/LF)."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Gramática Generativa y Programa Minimalista
    exercises:
      - type: grammar
        question: "¿Cuál es la diferencia entre la estructura profunda y la estructura superficial en la gramática transformacional de Chomsky? (son idénticas/la estructura profunda (D-structure) es la representación abstracta de las relaciones gramaticales básicas; la estructura superficial (S-structure) es el resultado de las transformaciones aplicadas → 'Juan fue besado por María' tiene D-structure con Juan como objeto y María como sujeto; la pasivización lo transforma/son conceptos del estructuralismo de Saussure)"
        correctAnswer: la estructura profunda (D-structure) es la representación abstracta de las relaciones gramaticales básicas; la estructura superficial (S-structure) es el resultado de las transformaciones aplicadas → 'Juan fue besado por María' tiene D-structure con Juan como objeto y María como sujeto; la pasivización lo transforma
        rationale: "La distinción estructura profunda/superficial fue central en la Gramática Transformacional Generativa (Chomsky, 'Aspectos de la teoría de la sintaxis', 1965); en el Programa Minimalista fue abandonada en favor de una sola representación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la hipótesis de la innatez y cómo responde al problema de la pobreza del estímulo? (que los humanos aprenden el lenguaje por imitación/que los humanos nacen con una Gramática Universal (GU) innata que delimita el espacio de las gramáticas posibles → la pobreza del estímulo: los niños adquieren el lenguaje correctamente con datos imperfectos y limitados → solo la innatez puede explicar esta capacidad/que todas las lenguas tienen el mismo vocabulario)"
        correctAnswer: "que los humanos nacen con una Gramática Universal (GU) innata que delimita el espacio de las gramáticas posibles → la pobreza del estímulo: los niños adquieren el lenguaje correctamente con datos imperfectos y limitados → solo la innatez puede explicar esta capacidad"
        rationale: "El argumento de la pobreza del estímulo (ALD) es el principal argumento empírico de Chomsky para la innatez; los niños aprenden reglas que nunca les enseñaron explícitamente y evitan errores que sus datos no desfavorecen."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la operación Merge en el Programa Minimalista y por qué es la operación central? (una operación de movimiento de palabras/la fusión de dos idiomas/la operación que toma dos objetos sintácticos y los combina para formar uno nuevo → es la operación básica de la computación lingüística: toda la sintaxis se reduce a Merge recursivo → la recursividad de Merge explica la productividad infinita del lenguaje)"
        correctAnswer: "la operación que toma dos objetos sintácticos y los combina para formar uno nuevo → es la operación básica de la computación lingüística: toda la sintaxis se reduce a Merge recursivo → la recursividad de Merge explica la productividad infinita del lenguaje"
        rationale: "En el Programa Minimalista ('The Minimalist Program', 1995), Chomsky reduce la gramática a Merge (ensamble) más las interfaces LF (forma lógica) y PF (forma fonológica); la elegancia teórica es un criterio explícito."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los principios y los parámetros en la teoría de la Rección y el Ligamiento (GB)? (reglas específicas de cada lengua/los principios son propiedades universales de todas las lenguas (el ligamiento, la teoría theta, la teoría de casos); los parámetros son opciones binarias que varían entre lenguas → el parámetro pro-drop: [+pro-drop] (español) vs. [-pro-drop] (inglés) → la variación lingüística se reduce a la variación paramétrica/los principios son solo semánticos)"
        correctAnswer: "los principios son propiedades universales de todas las lenguas (el ligamiento, la teoría theta, la teoría de casos); los parámetros son opciones binarias que varían entre lenguas → el parámetro pro-drop: [+pro-drop] (español) vs. [-pro-drop] (inglés) → la variación lingüística se reduce a la variación paramétrica"
        rationale: "El modelo Principios y Parámetros (Chomsky y Lasnik, 1977) intentó unificar la gramática universal con la variación lingüística; es el precursor del Programa Minimalista."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el ligamiento (binding) y cuáles son sus principios A, B y C? (la relación entre sujeto y verbo/Principio A: los anafóricos (se, sí mismo) deben estar ligados en su dominio local; Principio B: los pronombres (él, ella) no pueden estar ligados localmente → '*Juan se quiere él' viola el Principio B; Principio C: las expresiones referenciales (nombres propios) no pueden estar ligadas en ningún dominio/los principios del orden de palabras)"
        correctAnswer: "Principio A: los anafóricos (se, sí mismo) deben estar ligados en su dominio local; Principio B: los pronombres (él, ella) no pueden estar ligados localmente → '*Juan se quiere él' viola el Principio B; Principio C: las expresiones referenciales (nombres propios) no pueden estar ligadas en ningún dominio"
        rationale: "La teoría del ligamiento (Chomsky, 'Lectures on Government and Binding', 1981) explica las relaciones de correferencia y anáfora en la sintaxis; es uno de los módulos del modelo GB."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la alternancia causativa en la sintaxis del léxico y cuál es su análisis generativo? (el uso del verbo 'causar'/el par 'Juan rompió el vaso' / 'El vaso se rompió': la versión transitiva tiene a Juan como causante externo; la intransitiva lo elimina → en la teoría generativa, la alternancia se analiza mediante la proyección de vP (little v): la versión causativa proyecta v externo; la anticausativa lo suprime/son dos verbos distintos sin relación)"
        correctAnswer: "el par 'Juan rompió el vaso' / 'El vaso se rompió': la versión transitiva tiene a Juan como causante externo; la intransitiva lo elimina → en la teoría generativa, la alternancia se analiza mediante la proyección de vP (little v): la versión causativa proyecta v externo; la anticausativa lo suprime"
        rationale: "La alternancia causativa/incoativa es un fenómeno cross-lingüístico estudiado por Levin y Rappaport-Hovav; su análisis en términos de estructura eventiva y vP ha enriquecido la interfaz léxico-sintaxis."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la gramática de construcciones de Goldberg y en qué se opone a la gramática generativa? (un tipo de sintaxis árbol/la gramática que postula que las construcciones (pares forma-significado) son las unidades primitivas de la gramática → no hay reglas abstractas separadas del léxico: la construcción causativa de movimiento ('She sneezed the napkin off the table') es una unidad gramatical, no derivable de la semántica del verbo/es una variante de la GB de Chomsky)"
        correctAnswer: "la gramática que postula que las construcciones (pares forma-significado) son las unidades primitivas de la gramática → no hay reglas abstractas separadas del léxico: la construcción causativa de movimiento ('She sneezed the napkin off the table') es una unidad gramatical, no derivable de la semántica del verbo"
        rationale: "La gramática de construcciones de Goldberg ('Constructions', 1995) es el mayor desafío a la gramática generativa desde el uso: los significados de las construcciones no se derivan composicionalmente sino que son una propiedad de la construcción misma."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la teoría de la optimidad (OT) y a qué nivel lingüístico se aplica más frecuentemente? (una teoría de la semántica óptima/una teoría en que la gramática evalúa candidatos de output según un ranking de restricciones universales violables → el candidato óptimo es el que viola las restricciones menos importantes; se aplica principalmente a la fonología (McCarthy y Prince, 1993) pero también a la sintaxis y la morfología/una teoría de la traducción óptima)"
        correctAnswer: una teoría en que la gramática evalúa candidatos de output según un ranking de restricciones universales violables → el candidato óptimo es el que viola las restricciones menos importantes; se aplica principalmente a la fonología (McCarthy y Prince, 1993) pero también a la sintaxis y la morfología
        rationale: "La Teoría de la Optimidad reformuló radicalmente la fonología: en lugar de reglas ordenadas, un conjunto de restricciones universales con ranking variable explica la variación cross-lingüística."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la interfaz semántico-pragmática y qué fenómenos se estudian en ella? (la interfaz entre texto y lector/la relación entre diccionario y pragmática/el nivel en que la semántica composicional del enunciado interactúa con la información contextual y las máximas conversacionales → las implicaturas escalares, la referencia deíctica, la corrección de presuposiciones y la acomodación de la referencia son fenómenos de la interfaz)"
        correctAnswer: el nivel en que la semántica composicional del enunciado interactúa con la información contextual y las máximas conversacionales → las implicaturas escalares, la referencia deíctica, la corrección de presuposiciones y la acomodación de la referencia son fenómenos de la interfaz
        rationale: "La interfaz semántica-pragmática es uno de los campos más activos de la lingüística teórica contemporánea; fenómenos como la negación, las implicaturas y la referencia requieren información tanto del nivel semántico como del pragmático."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo explica la hipótesis lexicalista fuerte la relación entre morfología y sintaxis? (que la morfología depende de la sintaxis/que las palabras son las unidades de la sintaxis y la morfología no puede ser 'vista' por las reglas sintácticas → la morfología construye palabras internamente antes de que la sintaxis las tome como átomos → opuesta a la hipótesis distribucionalista (Halle y Marantz) que deriva la morfología en la sintaxis/que la morfología y la sintaxis son idénticas)"
        correctAnswer: que las palabras son las unidades de la sintaxis y la morfología no puede ser 'vista' por las reglas sintácticas → la morfología construye palabras internamente antes de que la sintaxis las tome como átomos → opuesta a la hipótesis distribucionalista (Halle y Marantz) que deriva la morfología en la sintaxis
        rationale: "El debate lexicalismo/distribucionalismo es central en la morfología teórica; la Morfología Distribuida (Halle y Marantz, 1993) argumenta que no hay léxico separado de la sintaxis."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Interfaces y Teorías Lingüísticas Comparadas
    exercises:
      - type: grammar
        question: "¿Qué es la Forma Lógica (LF) en la gramática generativa y qué fenómenos se representan en ella? (el significado de la oración/la representación sintáctica que sirve de input a los sistemas semánticos → en LF se representan el alcance de los cuantificadores ('Todos los estudiantes aprobaron un examen': ¿todos un examen diferente o el mismo?), la resolución de la anáfora y las relaciones de alcance/la gramática normativa en su nivel más abstracto)"
        correctAnswer: "la representación sintáctica que sirve de input a los sistemas semánticos → en LF se representan el alcance de los cuantificadores ('Todos los estudiantes aprobaron un examen': ¿todos un examen diferente o el mismo?), la resolución de la anáfora y las relaciones de alcance"
        rationale: "LF (Logical Form) es la interfaz entre la sintaxis y la semántica en el Programa Minimalista; fenómenos como la ambigüedad de alcance y el movimiento de cuantificadores se analizan en LF."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las construcciones resultativas y cómo desafían la composicionalidad? (oraciones con resultado/construcciones como 'John hammered the metal flat' (John martilló el metal hasta dejarlo plano) → el adjetivo 'flat' no es argumento del verbo 'hammer' → el significado de la construcción no se deriva de la semántica del verbo → Goldberg usa esto para argumentar que la construcción misma aporta el significado/son oraciones pasivas con resultado)"
        correctAnswer: construcciones como 'John hammered the metal flat' (John martilló el metal hasta dejarlo plano) → el adjetivo 'flat' no es argumento del verbo 'hammer' → el significado de la construcción no se deriva de la semántica del verbo → Goldberg usa esto para argumentar que la construcción misma aporta el significado
        rationale: "Las construcciones resultativas son el argumento empírico central de Goldberg contra la composicionalidad estricta; muestran que el significado puede provenir de la construcción, no solo del verbo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el Principio de Proyección Extendido (EPP) y qué explica en la sintaxis del español? (la proyección de adjetivos en el sintagma nominal/el principio que obliga a que toda oración tenga una posición de sujeto explícita → en inglés, el EPP se satisface con sujetos expletivos ('it rains'); en español, el EPP puede satisfacerse con pro (sujeto nulo) gracias al parámetro pro-drop → explica la diferencia entre 'Llueve' (español) y 'It rains' (inglés)/el principio de posición de los complementos)"
        correctAnswer: el principio que obliga a que toda oración tenga una posición de sujeto explícita → en inglés, el EPP se satisface con sujetos expletivos ('it rains'); en español, el EPP puede satisfacerse con pro (sujeto nulo) gracias al parámetro pro-drop → explica la diferencia entre 'Llueve' (español) y 'It rains' (inglés)
        rationale: "El EPP es un principio universal en GB; su implementación varía paramétricamente, lo que explica las diferencias entre lenguas pro-drop y no-pro-drop."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las restricciones FAITHFULNESS y MARKEDNESS en la Teoría de la Optimidad fonológica? (dos tipos de fonemas/las restricciones FAITHFULNESS exigen que el output sea fiel al input → no cambiar los segmentos; las restricciones MARKEDNESS prohíben estructuras marcadas en el output → no tener clusters consonánticos complejos → el ranking de estas restricciones explica los distintos sistemas fonológicos de las lenguas/dos módulos gramaticales independientes)"
        correctAnswer: las restricciones FAITHFULNESS exigen que el output sea fiel al input → no cambiar los segmentos; las restricciones MARKEDNESS prohíben estructuras marcadas en el output → no tener clusters consonánticos complejos → el ranking de estas restricciones explica los distintos sistemas fonológicos de las lenguas
        rationale: "El ranking MARKEDNESS >> FAITHFULNESS produce output sin clusters (el japonés inserta vocales); FAITHFULNESS >> MARKEDNESS produce output fiel al input aunque sea marcado (el inglés mantiene clusters)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el movimiento sintáctico (syntactic movement) y por qué es necesario en la gramática generativa? (el movimiento físico de las palabras en el habla/la operación que mueve un constituyente de su posición base a una posición más alta en el árbol sintáctico → en las preguntas, el sintagma wh- se mueve al inicio → 'What did John eat?' → 'What' se mueve desde la posición de objeto/el movimiento de acento en la oración)"
        correctAnswer: la operación que mueve un constituyente de su posición base a una posición más alta en el árbol sintáctico → en las preguntas, el sintagma wh- se mueve al inicio → 'What did John eat?' → 'What' se mueve desde la posición de objeto
        rationale: "El movimiento sintáctico (transformación en GTG, Move α en GB) es uno de los fenómenos más estudiados de la sintaxis teórica; explica la relación entre la posición superficial y la interpretación semántica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo trata la gramática de construcciones las construcciones ditransitivas como la alternancia dativa? (como transformaciones/las dos construcciones ('John gave Mary a book' / 'John gave a book to Mary') no son transformaciones la una de la otra sino que son construcciones independientes con significados ligeramente diferentes → la primera (dativa con doble objeto) indica transferencia exitosa; la segunda (dativa preposicional) no necesariamente/son construcciones idénticas semánticamente)"
        correctAnswer: las dos construcciones ('John gave Mary a book' / 'John gave a book to Mary') no son transformaciones la una de la otra sino que son construcciones independientes con significados ligeramente diferentes → la primera (dativa con doble objeto) indica transferencia exitosa; la segunda (dativa preposicional) no necesariamente
        rationale: "La alternancia dativa es el segundo caso empírico central de Goldberg; demuestra que las dos construcciones no son transformaciones sinónimas sino que tienen significados distintos ligados a su forma."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la teoría theta y cómo asigna roles temáticos? (la teoría de los casos gramaticales/la teoría que establece que los verbos seleccionan roles temáticos (agente, paciente, tema, beneficiario) que deben ser satisfechos por los argumentos → 'El niño comió la manzana': el verbo 'comer' asigna agente a 'el niño' y paciente a 'la manzana' → el Criterio Theta: cada argumento recibe exactamente un rol y cada rol se asigna a exactamente un argumento/el sistema de tiempos verbales)"
        correctAnswer: "la teoría que establece que los verbos seleccionan roles temáticos (agente, paciente, tema, beneficiario) que deben ser satisfechos por los argumentos → 'El niño comió la manzana': el verbo 'comer' asigna agente a 'el niño' y paciente a 'la manzana' → el Criterio Theta: cada argumento recibe exactamente un rol y cada rol se asigna a exactamente un argumento"
        rationale: "La teoría theta (teoría de los roles temáticos) es el módulo del GB que conecta la semántica léxica con la sintaxis; el Criterio Theta es un filtro que excluye oraciones sin roles correctamente asignados."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre el chomskianismo y el funcionalismo en la lingüística teórica? (son sinónimos/el generativismo (Chomsky): la gramática es un módulo cognitivo autónomo, innato y separado del uso → la sintaxis tiene autonomía respecto a la semántica y la pragmática; el funcionalismo (Givón, Hopper, Croft): la gramática surge del uso comunicativo → las estructuras gramaticales son motivadas por la función comunicativa, no son arbitrarias/solo difieren en la metodología)"
        correctAnswer: "el generativismo (Chomsky): la gramática es un módulo cognitivo autónomo, innato y separado del uso → la sintaxis tiene autonomía respecto a la semántica y la pragmática; el funcionalismo (Givón, Hopper, Croft): la gramática surge del uso comunicativo → las estructuras gramaticales son motivadas por la función comunicativa, no son arbitrarias"
        rationale: "El debate generativismo/funcionalismo distingue la gramática como módulo autónomo e innato (Chomsky) de la gramática derivada del uso comunicativo (Givón, Croft); son paradigmas inconmensurables."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el lenguaje-I (internal) frente al lenguaje-E (external) en la distinción de Chomsky? (el lenguaje interior vs. el exterior/lenguaje-I: el sistema cognitivo interno del hablante individual → la competencia gramatical en la mente; lenguaje-E: el lenguaje como conjunto de enunciados o como fenómeno social → Chomsky argumenta que la lingüística debe estudiar el lenguaje-I, no el lenguaje-E/el lenguaje escrito vs. el oral)"
        correctAnswer: "lenguaje-I: el sistema cognitivo interno del hablante individual → la competencia gramatical en la mente; lenguaje-E: el lenguaje como conjunto de enunciados o como fenómeno social → Chomsky argumenta que la lingüística debe estudiar el lenguaje-I, no el lenguaje-E"
        rationale: "La distinción I-language/E-language (Chomsky, 'Knowledge of Language', 1986) redefine el objeto de estudio de la lingüística; los corpusistas y sociolingüistas estudian el lenguaje-E que Chomsky considera irrelevante para la teoría lingüística."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo explica la Morfología Distribuida (DM) la irregularidad morfológica? (que la irregularidad es solo fonológica/mediante los alomorfos de vocabulario: las raíces y los morfemas abstractos se insertan en la estructura sintáctica, y los alomorfos se seleccionan por contexto fonológico o léxico → 'go/went' en inglés: la raíz √GO toma el alomorfo 'went' en el contexto del pasado → la irregularidad es la interacción de reglas regulares/la irregularidad es un primitivo sin explicación)"
        correctAnswer: "mediante los alomorfos de vocabulario: las raíces y los morfemas abstractos se insertan en la estructura sintáctica, y los alomorfos se seleccionan por contexto fonológico o léxico → 'go/went' en inglés: la raíz √GO toma el alomorfo 'went' en el contexto del pasado → la irregularidad es la interacción de reglas regulares"
        rationale: "La Morfología Distribuida (Halle y Marantz, 1993) unifica la morfología con la sintaxis: no hay léxico separado, todo se deriva en la computación sintáctica."
        difficulty: 5
        objectives: [es.pre_reading]
