title: Gramática - Sintaxis Avanzada y Cartografía Sintáctica
level: L
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Gramática avanzada de sintaxis: cartografía sintáctica (Rizzi), periferia izquierda (Force, Topic, Focus, Fin), especificadores múltiples, jerarquía funcional del SV (vP, AspP, VoiceP), inversión libre en español, pro-drop paramétrico, cliticización y movimiento-A', dislocación a la izquierda clítica CLLD vs. tematización, foco informativo vs. contrastivo, extraposición y periferia derecha, núcleos funcionales y micro-variación."
example: "La cartografía sintáctica de Rizzi descompone C en ForceP→TopicP→FocusP→FinP → cada rasgo pragmático tiene su propia proyección funcional en la periferia izquierda."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Periferia Izquierda y Cartografía
    exercises:
      - type: grammar
        question: "Según la cartografía sintáctica de Rizzi, ¿qué proyecciones funcionales descomponen el nodo C (Complementante)? (una sola proyección CP/ForceP → TopicP → FocusP → FinP: cada rasgo pragmático-informativo tiene su propia proyección funcional/SVO simplemente/solo TP y VP)"
        correctAnswer: "ForceP → TopicP → FocusP → FinP: cada rasgo pragmático-informativo tiene su propia proyección funcional"
        rationale: "La cartografía de Rizzi (1997) descompone CP en al menos Force (tipo oracional), Topic (tópico-comentario), Focus (foco informativo/contrastivo) y Fin (finitud/subordinación)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "En español, 'A Juan, lo vi ayer' es un ejemplo de CLLD. ¿Qué caracteriza la dislocación a la izquierda clítica (CLLD) frente a la tematización (Topicalization)? (son idénticas/CLLD: retiene un clítico de reanudación (lo), mueve el tópico a TopP, es compatible con tópicos de discurso ligados; Topicalization: sin clítico de reanudación, en FocusP, expresa foco contrastivo → la presencia/ausencia del clítico diagnostica la proyección de destino/que ambas van a FocusP)"
        correctAnswer: "CLLD: retiene un clítico de reanudación (lo), mueve el tópico a TopP, es compatible con tópicos de discurso ligados; Topicalization: sin clítico de reanudación, en FocusP, expresa foco contrastivo → la presencia/ausencia del clítico diagnostica la proyección de destino"
        rationale: "Cinque/Rizzi: CLLD (A Juan, lo vi) retiene clítico y va a TopP; topicalización con foco contrastivo (A JUAN vi, no a Pedro) va a FocusP sin clítico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la inversión libre en español y qué proyección funcional la distingue del inglés? (que el inglés también la permite/el español permite VS y SV libremente; en preguntas wh-, el sujeto puede aparecer posverbal (¿Qué dijo Juan?) porque el español pro-drop satisface EPP con pro en Spec-TP → el inglés requiere inversión auxiliar por la fortaleza del rasgo-V en C/que el español es SOV)"
        correctAnswer: el español permite VS y SV libremente; en preguntas wh-, el sujeto puede aparecer posverbal (¿Qué dijo Juan?) porque el español pro-drop satisface EPP con pro en Spec-TP → el inglés requiere inversión auxiliar por la fortaleza del rasgo-V en C
        rationale: "La inversión libre en español se analiza vía T con rasgos débiles de EPP: pro en Spec-TP satisface el rasgo, dejando el sujeto léxico en una posición baja (Spec-vP o in situ)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "En la arquitectura vP-shell (capa del SV), ¿qué papeles semánticos se asignan en cada capa? (todos en V/v introduce el argumento externo (agente) y los rasgos causativos/volitivos; V asigna el tema/paciente en Spec-VP o como complemento de V → Voice P puede dominar vP para codificar voz pasiva separando el argumento externo de la causatividad/que vP no existe en español)"
        correctAnswer: v introduce el argumento externo (agente) y los rasgos causativos/volitivos; V asigna el tema/paciente en Spec-VP o como complemento de V → VoiceP puede dominar vP para codificar voz pasiva separando el argumento externo de la causatividad
        rationale: "En la arquitectura vP de Chomsky (1995)/Kratzer: v (light verb) ensambla el agente y causa; V ensambla el tema; Voice puede separar la voz del argumento externo para análisis de pasivas y anticausativas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la micro-variación sintáctica y por qué es relevante para la teoría de Principios y Parámetros? (que todas las lenguas son iguales/que lenguas aparentemente similares difieren en valores de parámetros finos → los núcleos funcionales tienen rasgos que varían entre lenguas y dialectos (p. ej., fuerza de EPP, presencia de pro, orden de clíticos) → la micro-variación muestra que la variación lingüística es modular y localizada en rasgos de núcleos funcionales/que los parámetros son globales a toda la gramática)"
        correctAnswer: que lenguas aparentemente similares difieren en valores de parámetros finos → los núcleos funcionales tienen rasgos que varían entre lenguas y dialectos (p. ej., fuerza de EPP, presencia de pro, orden de clíticos) → la micro-variación muestra que la variación lingüística es modular y localizada en rasgos de núcleos funcionales
        rationale: "La micro-variación dialectal (Kayne, Rizzi, Cinque) reveló que los parámetros se ubican en rasgos de núcleos funcionales específicos, no en reglas globales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre foco informativo y foco contrastivo en términos de su posición en la cartografía? (son lo mismo/foco informativo: foco de dominio estrecho ('¿Qué compraste?' — 'Compré UN LIBRO'), puede aparecer in situ; foco contrastivo ('No compré UN LIBRO sino UNA REVISTA') se mueve a FocusP en la periferia izquierda y activa contraste con una alternativa explícita → proyecciones distintas en la jerarquía de Rizzi/que ambos van a SpecTP)"
        correctAnswer: "foco informativo: foco de dominio estrecho, puede aparecer in situ; foco contrastivo ('No A, sino B') se mueve a FocusP en la periferia izquierda y activa contraste con una alternativa explícita → proyecciones distintas en la jerarquía de Rizzi"
        rationale: "Rizzi (1997): FocusP en la periferia izquierda aloja el foco contrastivo que se mueve; el foco informativo puede quedarse in situ sin movimiento a la periferia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué proyección funcional se activa en las preguntas indirectas ('No sé si Juan vendrá') y cómo se analiza? (TP/FinP codifica la finitud del verbo subordinado y el rasgo [±finito]; Force marca el tipo oracional (declarativa, interrogativa, exclamativa) → en preguntas indirectas, Force lleva [+Interrogativo] que actrae el qu- en movimiento/que todas van a TopicP)"
        correctAnswer: FinP codifica la finitud del verbo subordinado y el rasgo [±finito]; Force marca el tipo oracional (declarativa, interrogativa, exclamativa) → en preguntas indirectas, Force lleva [+Interrogativo] que atrae el qu- en movimiento
        rationale: "La distinción Force/Fin (Rizzi 1997) explica por qué en preguntas indirectas y en oraciones subordinadas finitas vs. no finitas aparecen diferentes complementantes (que vs. Ø)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué evidencia aporta la secuencia de clíticos en español ('me lo dio') para el análisis cartográfico? (nada/el orden invariable de los clíticos (DAT > ACUS > REFL > me/te/nos/os > se > le/les > lo/la/los/las) refleja una jerarquía de proyecciones funcionales de la capa clítica → los clíticos se ensamblan en núcleos funcionales distintos con jerarquía fija/que los clíticos son sufijos verbales libres)"
        correctAnswer: el orden invariable de los clíticos (DAT > ACUS > REFL > me/te/nos/os > se > le/les > lo/la/los/las) refleja una jerarquía de proyecciones funcionales de la capa clítica → los clíticos se ensamblan en núcleos funcionales distintos con jerarquía fija
        rationale: "Cinque (1999) y Kayne: el orden rígido de clíticos en las lenguas romances se analiza como reflejo de una jerarquía funcional universal de núcleos clíticos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la periferia derecha y qué tipos de elementos se dislocan a ella? (no existe/la periferia derecha aloja tópicos 'de cola' (right-dislocation: 'Lo vi ayer, a Juan') y focos de 'énfasis tarde' → en español y en italiano se documentan proyecciones TopP y FocP periféricas derechas que son el espejo de la periferia izquierda, relevantes para la entonación y el orden de palabras pragmático/que la periferia derecha es solo entonación)"
        correctAnswer: "la periferia derecha aloja tópicos 'de cola' (right-dislocation: 'Lo vi ayer, a Juan') y focos de énfasis tarde → en español e italiano se documentan proyecciones TopP y FocP periféricas derechas que son el espejo de la periferia izquierda, relevantes para la entonación y el orden de palabras pragmático"
        rationale: "Benincà/Poletto (2004) y Zubizarreta: la periferia derecha es la imagen especular de la izquierda y cumple funciones pragmáticas similares, especialmente en lenguas de orden libre como el español."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué implica la hipótesis de los especificadores múltiples para la teoría del movimiento? (que solo hay un especificador por proyección/que una misma proyección funcional puede albergar más de un especificador (p. ej., múltiples tópicos: 'A Pedro, este libro, se lo regalé') → el movimiento iterado a proyecciones TopP distintas o a especificadores múltiples de una misma TopP genera construcciones con varios tópicos apilados/que solo hay especificadores en TP)"
        correctAnswer: "que una misma proyección funcional puede albergar más de un especificador (p. ej., múltiples tópicos: 'A Pedro, este libro, se lo regalé') → el movimiento iterado a proyecciones TopP distintas o a especificadores múltiples de una misma TopP genera construcciones con varios tópicos apilados"
        rationale: "Rizzi (1997): los múltiples tópicos apilados en la periferia izquierda se analizan con proyecciones TopP iteradas o con especificadores múltiples dentro de una TopP."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Movimiento, Rasgos y Parámetros
    exercises:
      - type: grammar
        question: "¿Cómo explica la teoría del movimiento-A' (movimiento a posición de operador) la formación de preguntas qu- en español? (con reglas de transformación ad hoc/el sintagma qu- se mueve a Spec-FocusP o Spec-ForceP en la periferia izquierda para valorar un rasgo [+wh] en Force → deja una huella (copia) en la posición de origen → la interpretación de la variable se computa en LF/que el qu- no se mueve en español)"
        correctAnswer: el sintagma qu- se mueve a Spec-FocusP o Spec-ForceP en la periferia izquierda para valorar un rasgo [+wh] en Force → deja una copia en la posición de origen → la interpretación de la variable se computa en LF
        rationale: "En el Programa Minimalista, el movimiento qu- valoriza rasgos en C/Force; en las llamadas lenguas wh-in situ (chino, japonés), el movimiento ocurre en LF (Forma Lógica) en vez de en la sintaxis visible."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el Caso abstracto y qué proyecciones funcionales lo asignan en español? (solo el caso morfológico/el Caso abstracto es un rasgo formal no pronunciado que los SN deben valorar para ser visibles en LF → T/Infl asigna Nominativo al Spec-TP (sujeto); v/V asigna Acusativo al complemento; P asigna Oblicuo → el Filtro de Caso: todo SN léxico debe tener Caso bajo pena de ilegitimidad/que el Caso es solo morfológico en latín)"
        correctAnswer: "el Caso abstracto es un rasgo formal no pronunciado que los SN deben valorar para ser visibles en LF → T/Infl asigna Nominativo al Spec-TP (sujeto); v/V asigna Acusativo al complemento; P asigna Oblicuo → el Filtro de Caso: todo SN léxico debe tener Caso"
        rationale: "La teoría del Caso abstracto (Chomsky 1981): el Caso es un rasgo formal que el movimiento y las sondas valoraron; su ausencia provoca agramaticalidad."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Por qué en español es posible 'Llegaron los estudiantes' pero no '*Arrived the students' en inglés? (por la gramática normativa/porque el español tiene pro-drop: T tiene rasgos phi fuertes que pueden concordar con el sujeto posverbal léxico o con pro nulo; el inglés requiere un sujeto léxico en Spec-TP para satisfacer EPP mediante un DP fonológicamente realizado/porque el inglés no tiene inversión)"
        correctAnswer: "porque el español tiene pro-drop: T tiene rasgos phi fuertes que pueden concordar con el sujeto posverbal léxico o con pro nulo; el inglés requiere un DP fonológicamente realizado en Spec-TP para satisfacer EPP"
        rationale: "El parámetro pro-drop correlaciona con morfología de concordancia rica: T puede satisfacer EPP con pro nulo o con SV invertido en español; en inglés, EPP exige un DP overt."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la 'condición de isla' y cómo limita el movimiento sintáctico? (que no se puede mover nada/las islas sintácticas son dominios desde los cuales el movimiento está bloqueado: oraciones relativas, adjuntos, coordinaciones, preguntas encajadas → '*¿A quién crees [que la policía sospecha [de quién]]?' (isla de pregunta encajada) → la condición de isla es universal (Ross 1967) y se deriva de restricciones sobre fases (Chomsky 2001)/que las islas solo afectan al inglés)"
        correctAnswer: "las islas sintácticas son dominios desde los cuales el movimiento está bloqueado: oraciones relativas, adjuntos, coordinaciones, preguntas encajadas → la condición de isla es universal y se deriva de restricciones sobre fases"
        rationale: "Ross (1967) identificó las islas; en el Programa Minimalista se derivan de la impermeabilidad de las fases (CP, vP): el movimiento no puede sacar material del interior de una fase ya transferida a la interfaz."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "En la arquitectura de fases, ¿qué son las fases y por qué se proponen? (divisiones arbitrarias/las fases (CP y vP*) son dominios sintácticos que se transfieren a las interfaces (FF y LF) de forma cíclica → cada vez que se completa una fase, su complemento se vuelve inaccesible para operaciones sintácticas posteriores → el procesamiento cíclico reduce la carga computacional del sistema/que las fases son solo para el léxico)"
        correctAnswer: las fases (CP y vP*) son dominios que se transfieren cíclicamente a las interfaces (FF y LF) → una vez completada la fase, su complemento queda inaccesible para operaciones posteriores → el procesamiento cíclico reduce la carga computacional
        rationale: "Chomsky (2001): la teoría de las fases implementa la Condición de Inclusividad y reduce el ciclo estricto a unidades computacionales discretas (CP y vP transitivo)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre movimiento por rasgos (Attract) y ensamblado externo (Merge) en el Programa Minimalista? (son lo mismo/Merge (ensamblado externo): combina dos objetos sintácticos independientes del léxico para formar un nuevo objeto {α, β}; Move/Attract (ensamblado interno): reensambla un elemento ya presente en la estructura en una posición más alta para valorar un rasgo → el movimiento es Merge interno/que no hay movimiento en el PM)"
        correctAnswer: "Merge (ensamblado externo): combina dos objetos léxicos independientes → {α, β}; Move/Attract (ensamblado interno): reensambla un elemento ya presente en la estructura en una posición superior para valorar un rasgo → el movimiento es Merge interno"
        rationale: "En el PM (Chomsky 1995, 2000): Move se reduce a Merge interno, unificando las dos operaciones bajo una sola: Merge. El rasgo no valorado en la sonda activa el Attract."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la 'relativización' y qué jerarquía de accesibilidad de Keenan-Comrie predice? (que todas las posiciones se relativizan igual/la jerarquía Sujeto > Objeto directo > Objeto indirecto > Oblicuo > Genitivo > Objeto de comparación predice que si una lengua puede relativizar una posición, también puede relativizar todas las más altas → el español puede relativizar todas; lenguas con relativas menos accesibles muestran que la jerarquía es implicacional/que la jerarquía es solo para el inglés)"
        correctAnswer: la jerarquía S > OD > OI > Oblicuo > Genitivo > Obj. comparación predice que si una lengua puede relativizar una posición, también puede relativizar todas las más altas → el español puede relativizar todas; la jerarquía es implicacional y tipológicamente robusta
        rationale: "Keenan/Comrie (1977): la jerarquía de accesibilidad es uno de los universales implicacionales más robustos; se aplica tanto a la relativización como a la formación de preguntas wh-."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la 'concordancia de tiempos' (sequence of tense) y cómo funciona en español? (que todos los verbos llevan el mismo tiempo/en oraciones subordinadas, el tiempo del verbo subordinado se interpreta en relación con el tiempo de la oración principal: 'Dijo que vendría' (futuro del pasado → simultaneidad/posterioridad al pasado) vs. 'Dijo que viene' (presente histórico, autonomía temporal) → el español permite relativa independencia temporal en estilo indirecto libre/que no existe en español)"
        correctAnswer: "en oraciones subordinadas el tiempo del verbo subordinado se interpreta en relación al tiempo de la oración principal: 'Dijo que vendría' (posterioridad al pasado); el español permite mayor independencia temporal que el inglés en estilo indirecto libre"
        rationale: "La concordancia de tiempos es parcialmente obligatoria en inglés (backshift) pero más flexible en español, lo que genera diferencias en el estilo indirecto libre y las citas indirectas."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué evidencia ofrece la posición del adverbio en español para la estructura interna del SV? (que los adverbios son adjuntos libres/Cinque (1999): la jerarquía de adverbios es universal y su posición relativa al verbo y los auxiliares diagnostica la estructura jerárquica del SV → 'Juan ya siempre comió rápidamente allí' refleja AspP > VozP > vP > VP con cada adverbio adjuntado a su proyección funcional correspondiente/que todos los adverbios se adjuntan a VP)"
        correctAnswer: "Cinque (1999): la jerarquía de adverbios es universal y su posición relativa al verbo y los auxiliares diagnostica la estructura jerárquica del SV → cada adverbio se adjunta a la proyección funcional de cuyo núcleo es especificador semántico"
        rationale: "La jerarquía de adverbios de Cinque es uno de los argumentos más fuertes a favor de la cartografía del SV: el orden relativo de los adverbios es rígido entre lenguas porque refleja una jerarquía funcional universal."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se distinguen las construcciones de 'objeto nulo' del español ('¿Lo viste? — Sí, vi___') de las lenguas de objeto nulo 'verdadero' como el chino? (no hay diferencia/en español, el objeto nulo es pronominal (pro-objeto) y está licenciado por rasgos de concordancia en el verbo transitivo y el contexto discursivo; en chino (lengua topic-prominent), el objeto nulo puede ser un tópico discursivo sin restricciones de concordancia → distintos mecanismos de licenciamiento/que el español no tiene objetos nulos)"
        correctAnswer: en español, el objeto nulo es pro pronominal licenciado por concordancia verbal y contexto discursivo; en chino es un tópico discursivo sin restricciones de concordancia → distintos mecanismos de licenciamiento reflejan parámetros distintos
        rationale: "El contraste español/chino en objetos nulos ilustra dos parámetros distintos: el parámetro pro-drop de objetos (morfología de concordancia) vs. el parámetro topic-prominent (licenciamiento discursivo)."
        difficulty: 5
        objectives: [es.pre_reading]
target: 20
