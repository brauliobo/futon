title: 📝 Gramática - Adquisición del Lenguaje y Bilingüismo Avanzado
level: L
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Adquisición del lenguaje avanzada: el debate innatismo/empirismo (Chomsky vs. Tomasello); el dispositivo de adquisición del lenguaje (DAL); la pobreza del estímulo y los argumentos a favor del innatismo; la teoría de los principios y parámetros en la adquisición; análisis de los errores de adquisición (estadios, sobregeneralización, U-shaped learning); bilingüismo simultáneo vs. secuencial; code-switching como competencia lingüística; el modelo de umbral de Cummins (interdependencia lingüística, BICS/CALP); attrition; herramienta de análisis: MLU (longitud media del enunciado), LARSP; adquisición del español como L2 en adultos: fosilización, interlengua (Selinker)."
example: "La sobregeneralización ('rompí → *rompió → rompió') → aprendizaje en forma de U → el niño primero aprende la forma correcta, la sobregeneraliza y finalmente vuelve a la forma correcta."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Adquisición del Lenguaje
    exercises:
      - type: grammar
        question: "¿Cuál es el argumento de la 'pobreza del estímulo' a favor del innatismo lingüístico de Chomsky? (que los niños aprenden el lenguaje por imitación/el input que recibe el niño es degradado (errores, frases incompletas, disfluencias) y limitado en cantidad → sin embargo, el niño adquiere el lenguaje completo, incluyendo propiedades que nunca ha oído explícitamente (como las restricciones de islas) → el conocimiento lingüístico supera lo que el input puede proporcionar → se necesita innatismo: el Dispositivo de Adquisición del Lenguaje (DAL) con conocimiento lingüístico innato/que la pobreza del estímulo prueba que el lenguaje es cultural)"
        correctAnswer: el input es degradado y limitado → el niño adquiere conocimiento lingüístico que supera lo que el input puede proporcionar (p. ej., restricciones de islas nunca oídas) → el conocimiento lingüístico innato en el Dispositivo de Adquisición del Lenguaje (DAL) explica la brecha input/competencia
        rationale: "El argumento de la pobreza del estímulo (Chomsky): si el input lingüístico no contiene ejemplos de las restricciones gramaticales que los niños conocen, ese conocimiento debe ser innato; es el argumento central del generativismo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la crítica de Tomasello al innatismo lingüístico y qué propone en su lugar? (que Tomasello es un innatista/Tomasello critica la pobreza del estímulo: el input es más rico de lo que Chomsky asume (infant-directed speech, frecuencias estadísticas); los niños aprenden el lenguaje mediante mecanismos cognitivos generales: la atención conjunta, la imitación y el reconocimiento de patrones estadísticos → el lenguaje se adquiere por aprendizaje probabilístico, no por activación de conocimiento innato → el usage-based model vs. el UG/que Tomasello defiende el innatismo de Chomsky)"
        correctAnswer: Tomasello critica que el input es más rico de lo que Chomsky asume; los niños usan mecanismos cognitivos generales (atención conjunta, imitación, reconocimiento de patrones estadísticos) → el lenguaje se adquiere por aprendizaje probabilístico (usage-based model), no activando conocimiento gramatical innato
        rationale: "La controversia Chomsky/Tomasello: el usage-based model (Tomasello 2003) propone que el lenguaje emerge de mecanismos cognitivos generales de aprendizaje y de la riqueza estadística del input, no de un UG innato."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el aprendizaje en forma de U (U-shaped learning) y cuándo ocurre en la adquisición del lenguaje? (que el aprendizaje siempre es lineal y progresivo/el niño pasa por tres fases: (1) producción correcta de formas irregulares (aprendidas como ítems: 'fue'); (2) sobregeneralización: el niño aprende la regla regular y la aplica a los irregulares ('fui → *fuió'); (3) recuperación de la forma correcta ('fue') → la curva en U demuestra que el niño construye activamente reglas morfológicas/que el aprendizaje en U demuestra que los niños no crean reglas)"
        correctAnswer: "tres fases: (1) producción correcta de irregulares (como ítems: 'fue'); (2) sobregeneralización de la regla regular a los irregulares ('*fuió'); (3) recuperación de la forma correcta → la curva en U demuestra que el niño construye activamente reglas morfológicas generativas"
        rationale: "El aprendizaje en forma de U (Bowerman 1982; Marcus et al. 1992): los niños primero producen correctamente las formas irregulares porque las han memorizado como ítems; luego al aprender la regla morfológica la sobregeneralizan; finalmente aprenden la restricción léxica del irregular."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre el bilingüismo simultáneo y el secuencial y cuáles son las implicaciones para la adquisición? (que el bilingüismo siempre produce confusión/bilingüismo simultáneo: el niño adquiere dos lenguas desde el nacimiento → cada lengua sigue su propio calendario de adquisición con transferencia mínima (hipótesis de los sistemas separados); bilingüismo secuencial: la L2 se adquiere después de que la L1 está establecida → la L1 puede interferir con la L2 (transfer); el bilingüismo simultáneo antes de los 3 años produce hablantes más equilibrados/que el bilingüismo simultáneo es dañino para ambas lenguas)"
        correctAnswer: "bilingüismo simultáneo (desde el nacimiento): dos lenguas con calendarios separados, transferencia mínima (sistemas separados); bilingüismo secuencial (L2 después de L1 establecida): la L1 puede interferir con la L2 (transfer) → el simultáneo temprano produce hablantes más equilibrados"
        rationale: "La hipótesis de los sistemas separados en bilingüismo simultáneo (Genesee 1989; Meisel 2011): los niños simultáneamente bilingües desarrollan dos sistemas gramaticales separados desde el principio, no un sistema único que se diferencia gradualmente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el code-switching y por qué debe considerarse una competencia lingüística y no un déficit? (que el code-switching demuestra que el bilingüe no domina ninguna de las dos lenguas/el code-switching (alternancia de código): el bilingüe competente alterna entre dos lenguas dentro de una misma conversación o enunciado siguiendo restricciones gramaticales sistemáticas (la restricción de equivalencia de Poplack: el cambio ocurre en puntos donde las dos lenguas tienen estructuras superficialmente equivalentes) → requiere dominio de ambas gramáticas simultáneamente/que el code-switching es solo un préstamo léxico)"
        correctAnswer: "el code-switching sigue restricciones gramaticales sistemáticas (restricción de equivalencia de Poplack: el cambio ocurre en puntos de estructura superficialmente equivalente) → requiere dominio de ambas gramáticas simultáneamente → es una competencia lingüística sofisticada, no un déficit"
        rationale: "El code-switching como competencia (Poplack 1980; Myers-Scotton 1993): la alternancia de código sigue reglas gramaticales estrictas que demuestran el dominio dual de ambas gramáticas; el llamado 'espanglish' es una variedad con su propia gramática, no un déficit."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la distinción BICS/CALP de Cummins y por qué es importante para la educación bilingüe? (que todos los bilingües tienen el mismo nivel en ambas lenguas/BICS (Basic Interpersonal Communicative Skills): habilidades comunicativas conversacionales de superficie (2-3 años para adquirirse); CALP (Cognitive Academic Language Proficiency): habilidades lingüístico-cognitivas académicas (5-7 años) → los niños inmigrantes pueden parecer fluentes en BICS pero necesitar apoyo en CALP → implicación educativa: no evaluar la competencia académica basándose en las habilidades conversacionales/que BICS y CALP se adquieren al mismo tiempo)"
        correctAnswer: "BICS (habilidades comunicativas conversacionales: 2-3 años para adquirirse); CALP (habilidades lingüístico-cognitivas académicas: 5-7 años) → los niños inmigrantes pueden ser fluentes en BICS pero necesitar apoyo en CALP; no evaluar la competencia académica basándose en las habilidades conversacionales"
        rationale: "Cummins (1979, 1981): la distinción BICS/CALP es fundamental para la educación bilingüe; confundir la fluidez conversacional con la competencia académica lleva a retirar el apoyo lingüístico prematuramente."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la interlengua de Selinker y cuál es el fenómeno de fosilización? (que los aprendices de L2 solo cometen errores aleatorios/la interlengua (Selinker 1972): el sistema lingüístico del aprendiz de L2 es un sistema independiente (ni L1 ni L2) con sus propias reglas → es dinámico y se acerca gradualmente a la L2 destino; la fosilización: el proceso de adquisición se detiene antes de alcanzar la gramática nativa → ciertas estructuras fosilizadas persisten indefinidamente aunque el aprendiz reciba más input/que la interlengua es idéntica a la L1 del aprendiz)"
        correctAnswer: "la interlengua (Selinker 1972): el sistema lingüístico del aprendiz de L2 es independiente (ni L1 ni L2) con sus propias reglas dinámicas → fosilización: el proceso se detiene antes de alcanzar la gramática nativa; ciertas estructuras fosilizadas persisten aunque haya más input"
        rationale: "La interlengua (Selinker 1972) fue una contribución fundamental a la lingüística aplicada: propuso que el aprendizaje de L2 no es simplemente transferencia de L1 sino la construcción de un sistema gramatical propio y dinámico."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la hipótesis de la interdependencia lingüística de Cummins y cuáles son sus implicaciones para el bilingüismo aditivo? (que las lenguas del bilingüe son completamente independientes/la hipótesis de la interdependencia: las habilidades académicas de alto nivel (CALP) se transfieren entre lenguas → fortalecer la L1 fortalece también la L2; el bilingüismo aditivo (añadir L2 sin restar L1) lleva al umbral más alto (bicognitivo); el bilingüismo sustractivo (reemplazar L1 por L2) puede disminuir el rendimiento académico → la educación en L1 es clave para el bilingüismo aditivo/que las habilidades lingüísticas no se transfieren entre lenguas)"
        correctAnswer: las habilidades académicas de alto nivel (CALP) se transfieren entre lenguas → fortalecer la L1 fortalece también la L2; el bilingüismo aditivo (añadir L2 sin restar L1) produce bicognitivismo; el bilingüismo sustractivo (L1 reemplazada) puede disminuir el rendimiento académico
        rationale: "La hipótesis de la interdependencia lingüística (Cummins 1981): hay una competencia subyacente común (CUP) que permite la transferencia de habilidades académicas entre lenguas; el iceberg del bilingüismo: la superficie es diferente pero la base cognitiva es común."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el MLU (longitud media del enunciado) y cómo se usa para medir el desarrollo gramatical en la adquisición del español? (que el MLU mide el vocabulario/el MLU (Mean Length of Utterance): la longitud media de los enunciados del niño en morfemas → aumenta a medida que el niño adquiere morfemas funcionales (concordancia, artículos, clíticos, morfología verbal) → en español, la adquisición de la flexión verbal y de los clíticos objeto hace que el MLU en morfemas aumente más rápido que en inglés en los mismos estadios/que el MLU no se usa en español)"
        correctAnswer: el MLU (longitud media del enunciado en morfemas) aumenta a medida que el niño adquiere morfemas funcionales (concordancia, artículos, clíticos, morfología verbal) → en español, la adquisición de la flexión verbal y los clíticos hace que el MLU aumente más rápido que en inglés en los mismos estadios
        rationale: "El MLU (Brown 1973): el estadio de adquisición se mide con el MLU en morfemas; en español, la morfología verbal rica y los clíticos hacen que el MLU en morfemas sea mayor para el mismo nivel de complejidad sintáctica que en inglés."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué predice la hipótesis del input comprensible de Krashen (i+1) para la enseñanza de lenguas y cuáles son sus críticas? (que el input difícil es siempre mejor/Krashen: la adquisición (subconsciente) y el aprendizaje (consciente) son sistemas separados → la adquisición requiere input comprensible un paso por encima del nivel actual (i+1); la hipótesis del filtro afectivo: la ansiedad bloquea la adquisición → críticas: i+1 no es operacionalizable; la distinción adquisición/aprendizaje es falsable pero difícil de probar; el output comprehensible (Swain) también es necesario para la adquisición/que el input comprensible no es relevante para la adquisición)"
        correctAnswer: "Krashen: la adquisición requiere input comprensible i+1 (un nivel por encima del actual); la hipótesis del filtro afectivo → críticas: i+1 no es operacionalizable; la distinción adquisición/aprendizaje es difícil de probar; Swain: el output comprensible también es necesario"
        rationale: "La hipótesis del input comprensible (Krashen 1982): la teoría más influyente en la enseñanza de lenguas; ha sido criticada por ser vaga (¿cómo medir i+1?) y por ignorar el papel del output, la interacción y la instrucción explícita de la gramática (Long: la hipótesis de la interacción)."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Bilingüismo y Adquisición de L2 en Español
    exercises:
      - type: grammar
        question: "¿Qué predice el parámetro pro-drop sobre la adquisición de los sujetos nulos en español por hablantes nativos de inglés? (que los hablantes de inglés aprenden los sujetos nulos sin dificultad/los hablantes de inglés tienen el parámetro pro-drop en [−pro-drop] → transfieren la necesidad de un sujeto léxico al español → tienden a producir sujetos pronominales explícitos donde el español los omitiría ('yo tengo hambre' en vez de 'tengo hambre') → este es el efecto de transferencia más documentado del inglés al español como L2/que el inglés y el español tienen el mismo parámetro pro-drop)"
        correctAnswer: los hablantes de inglés tienen el parámetro [−pro-drop] → transfieren la necesidad de sujeto léxico al español → producen sujetos pronominales explícitos donde el español los omitiría ('*yo tengo hambre') → efecto de transferencia más documentado del inglés al español como L2
        rationale: "El parámetro pro-drop produce la transferencia del parámetro [−pro-drop] del inglés al español: los hablantes producen sujetos explícitos donde el español los omitiría, el efecto de L1 más documentado."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'attrition' (erosión) de la L1 y cuáles son las estructuras más vulnerables en el español de los emigrantes? (que la L1 no se puede erosionar después de la adquisición completa/el attrition es la erosión del sistema lingüístico nativo bajo la presión de la L2 dominante → las estructuras más vulnerables en el español de los emigrantes en EE.UU. son: la morfología del subjuntivo, la colocación de los clíticos, el género en los sustantivos de herencia, el léxico de alta frecuencia → las estructuras más automatizadas son las más resistentes/que el attrition afecta igual a todas las estructuras lingüísticas)"
        correctAnswer: "el attrition es la erosión de la L1 bajo la presión de la L2 dominante → en el español de los emigrantes en EE.UU., las estructuras más vulnerables son: morfología del subjuntivo, colocación de clíticos, género en sustantivos; las más automatizadas son las más resistentes"
        rationale: "El attrition de la L1 (Köpke 2007; Montrul 2004): las estructuras con mayor complejidad morfosintáctica y menor frecuencia son las primeras en erosionarse; la automaticidad y el input mantenido son factores protectores."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre la transferencia positiva y la negativa en la adquisición de L2 del español? (que toda transferencia es negativa/transferencia positiva: cuando las estructuras de L1 y L2 coinciden, la L1 facilita la adquisición → los hablantes de portugués aprenden el español más rápido porque tienen muchas estructuras comunes; transferencia negativa (interferencia): cuando las estructuras difieren → los hablantes de inglés transfieren la ausencia de sujeto nulo → errores sistemáticos en la interlengua/que la transferencia positiva no existe)"
        correctAnswer: "transferencia positiva: las estructuras comunes L1-L2 facilitan la adquisición (hablantes de portugués en español: rápida adquisición por proximidad estructural); transferencia negativa: las diferencias estructurales producen interferencia → los hablantes de inglés transfieren la ausencia de sujeto nulo al español"
        rationale: "El análisis contrastivo (Lado 1957) predice que las dificultades en la adquisición de L2 están donde L1 y L2 difieren (transferencia negativa); la tipología lingüística permite predecir qué estructuras serán difíciles de aprender para hablantes de cada L1."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la hipótesis de la notación (noticing hypothesis) de Schmidt y por qué es relevante para la enseñanza de la gramática? (que la gramática se adquiere sin atención consciente/Schmidt (1990): el aprendiz de L2 solo puede adquirir (internalizar) las formas que ha percibido conscientemente (noticing) en el input → la instrucción gramatical explícita aumenta el noticing → hace al aprendiz más sensible a las formas en el input incidental → enlaza la instrucción explícita con la adquisición implícita/que la atención consciente perjudica la adquisición)"
        correctAnswer: "Schmidt (1990): el aprendiz solo puede adquirir las formas que ha percibido conscientemente (noticing) en el input → la instrucción gramatical explícita aumenta el noticing, haciéndolo más sensible a las formas en el input incidental → enlaza la instrucción explícita con la adquisición implícita"
        rationale: "La hipótesis del noticing (Schmidt 1990) es uno de los puentes entre la lingüística cognitiva y la enseñanza de lenguas: sin atención consciente a la forma, el input no se convierte en intake; esto justifica la instrucción gramatical explícita en el aula de L2."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el 'output comprensible' de Swain y por qué complementa la hipótesis del input de Krashen? (que el output no es necesario para la adquisición/Swain (1985): la producción del lenguaje (output) fuerza al aprendiz a procesar el lenguaje de forma diferente que la comprensión → la hipótesis del output: producir lenguaje requiere selección léxica precisa, morfología correcta y sintaxis completa → el aprendiz nota sus propios vacíos (gaps) de competencia cuando intenta producir → el output es una fuente de aprendizaje que el input solo no puede proporcionar/que Swain y Krashen son completamente incompatibles)"
        correctAnswer: "Swain (1985): producir lenguaje (output) requiere procesamiento diferente a la comprensión → fuerza la selección léxica precisa y la morfología correcta → el aprendiz nota sus vacíos (gaps) de competencia cuando intenta producir; complementa el input de Krashen: ni input ni output solos son suficientes"
        rationale: "La hipótesis del output (Swain 1985) complementa la hipótesis del input (Krashen): la comprensión permite ambigüedad semántica; la producción fuerza la precisión morfosintáctica → el output es una oportunidad de aprendizaje distinta del input."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo influye el género en el español en la adquisición del artículo y el acuerdo adjetival para hablantes de lenguas sin género? (que los hablantes de lenguas sin género aprenden el género fácilmente/el género es uno de los aspectos más difíciles del español para hablantes de inglés, chino o japonés (sin género gramatical): deben aprender el género de cada sustantivo individualmente (no es predecible por la semántica: 'el problema' es masculino) → los errores de acuerdo de género son frecuentes y persistentes (fosilización) → la regla de terminación (-o masc., -a fem.) solo aplica a un subconjunto de los sustantivos/que el género en español es completamente predecible)"
        correctAnswer: el género es difícil para hablantes de lenguas sin género gramatical → debe aprenderse individualmente por sustantivo; la regla de terminación (-o/-a) solo aplica a un subconjunto; los errores de acuerdo de género son frecuentes y tienden a fosilizarse en aprendices avanzados
        rationale: "El género gramatical del español (Montrul et al. 2008): es uno de los aspectos más difíciles y tardíos de la adquisición del español como L2; la transparencia morfológica (-o/-a) facilita algunos sustantivos pero no los irregulares (la mano, el día, el problema)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la hipótesis de la interfaz (Interface Hypothesis) de Sorace y cómo explica las dificultades de los bilingüe en la interfaz sintaxis-discurso? (que los bilingües tienen dificultades en toda la gramática/Sorace: los bilingüe tienen dificultades específicas en las propiedades de la interfaz sintaxis-discurso (no en las propiedades sintácticas internas) → la distribución del sujeto nulo en español (la posición del sujeto expreso/nulo está condicionada por la estructura informativa del discurso) es persistentemente difícil para los bilingüe y los hablantes de herencia aunque la morfología verbal sea correcta/que los bilingüe no tienen dificultades en las interfaces)"
        correctAnswer: "Sorace: los bilingües tienen dificultades específicas en las propiedades de la interfaz sintaxis-discurso (no en la sintaxis interna) → la distribución del sujeto nulo en español (condicionada por la estructura informativa del discurso) es persistentemente difícil para los bilingües aunque la morfología verbal sea correcta"
        rationale: "La Hipótesis de la Interfaz (Sorace/Filiaci 2006): las propiedades que involucran la interfaz entre la gramática interna y el procesamiento del discurso son más vulnerables en el bilingüismo porque requieren integración de información de dos sistemas distintos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuáles son los estadios de adquisición de las categorías funcionales en el español como L1 y qué predice la hipótesis de la estructura plena (Full Structure) vs. la hipótesis mínima (Minimal Trees)? (que las categorías funcionales se adquieren todas al mismo tiempo/Platzack/Radford (Minimal Trees): los niños pequeños tienen solo proyecciones léxicas (VP, NP) sin proyecciones funcionales (TP, CP) → errores de omisión de morfología funcional; Wexler/Hyams (Full Structure): los niños tienen la estructura plena desde el principio pero tienen problemas con los rasgos opcionales de T → el español como evidencia: la morfología verbal rica sugiere que TP se adquiere pronto pero el subjuntivo y los clíticos objeto se adquieren más tarde/que las categorías funcionales no tienen estadios de adquisición)"
        correctAnswer: "Minimal Trees: los niños comienzan con solo proyecciones léxicas, sin funcionales → errores de omisión de morfología funcional; Full Structure: los niños tienen la estructura plena pero con problemas en rasgos opcionales de T → el español tiene morfología verbal rica que apoya una adquisición temprana de TP pero el subjuntivo y los clíticos se adquieren más tarde"
        rationale: "El debate Minimal Trees/Full Structure es central en la adquisición del lenguaje desde la perspectiva generativista; el español ofrece evidencia única por su morfología verbal rica y la adquisición tardía del subjuntivo y los clíticos de objeto."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo puede la enseñanza basada en la instrucción de procesamiento (Processing Instruction) de VanPatten mejorar la adquisición de la morfología española? (que la instrucción gramatical no tiene efectos duraderos/VanPatten (1996): los aprendices de L2 tienen limitaciones de procesamiento → Processing Instruction (PI): en vez de explicar la regla gramatical y pedir producción, se manipula el input para forzar al aprendiz a atender a la morfología que tiende a ignorar → p. ej., para la morfología del sujeto nulo: actividades que hacen imposible interpretar la frase sin atender a la desinencia verbal/que la PI es equivalente a la instrucción tradicional)"
        correctAnswer: "VanPatten (1996): los aprendices tienden a ignorar morfología gramatical si el significado es deducible del contexto → Processing Instruction: se manipula el input para forzar la atención a la morfología específica → más eficaz que la instrucción tradicional (explicación + producción)"
        rationale: "La Processing Instruction (VanPatten 1996): es la aplicación pedagógica del modelo de input del procesamiento; el PI supera a la instrucción tradicional en las medidas de comprensión gramatical y es más transferible a situaciones de comunicación real."
        difficulty: 5
