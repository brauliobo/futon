pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La sociología del conocimiento estudia cómo los factores sociales condicionan el contenido del conocimiento humano. Karl Mannheim distinguió ideología (representaciones que encubren intereses de los grupos dominantes) de utopía (representaciones orientadas al cambio social que trascienden el orden vigente) en Ideología y Utopía (1929). Frente al relativismo (todo conocimiento es relativo sin posibilidad de juicio), Mannheim propuso el relacionismo: el conocimiento está situado socialmente pero puede evaluarse comparando perspectivas → la intelligentsia 'socialmente flotante' como candidata a síntesis. Peter Berger y Thomas Luckmann en La construcción social de la realidad (1966) describieron cómo la realidad social se construye en tres pasos: externalización (el ser humano proyecta actividades en el mundo externo), objetivación (esas actividades se convierten en objetos sociales que parecen naturales), internalización (el individuo asimila el mundo social ya construido como si fuera real) → la dialéctica de la construcción social: la sociedad es producto humano que vuelve a producir al ser humano. Las instituciones se legitiman mediante cuerpos de conocimiento (universos simbólicos) que justifican el orden institucional. Pierre Bourdieu propuso que el espacio social se estructura en campos (ámbitos con sus propias reglas y capitales): el habitus (sistema de disposiciones incorporadas producto de la historia social) genera prácticas coherentes sin conciencia; el capital puede ser económico, cultural (objetivado/institucionalizado/incorporado), social o simbólico; la violencia simbólica: dominación ejercida con la complicidad tácita del dominado gracias a la doxa (lo que se da por sentado sin cuestionamiento). Randall Collins en Cadenas de rituales de interacción analizó la microsociología del encuentro cara a cara: los rituales de interacción generan energía emocional y solidaridad grupal → el capital emocional se acumula y motiva la participación en nuevos rituales. David Bloor y el Programa Fuerte en sociología del conocimiento científico: el principio de simetría exige explicar el conocimiento verdadero y el falso con los mismos factores sociales → crítica al modelo whig que solo explica el error social y el éxito epistémicamente. Bruno Latour y Steve Woolgar en La vida en el laboratorio (1979) documentaron cómo los hechos científicos se 'construyen' en el laboratorio mediante inscripciones, retórica y negociación social."
    exercises:
      - type: reading
        question: "¿Qué diferencia establece Mannheim entre ideología y utopía, y por qué propone el 'relacionismo' en vez del relativismo? (que son lo mismo/ideología: representaciones que legitiman el orden existente ocultando los intereses de los grupos dominantes; utopía: representaciones orientadas al cambio que trascienden el orden vigente → el relacionismo (no relativismo) reconoce que todo conocimiento está situado socialmente pero que las perspectivas pueden compararse y evaluarse → la intelligentsia socialmente flotante puede sintetizar perspectivas/que Mannheim rechazó toda evaluación del conocimiento)"
        correctAnswer: ideología: representaciones que legitiman el orden existente; utopía: representaciones orientadas al cambio que trascienden el orden → el relacionismo reconoce la situacionalidad social del conocimiento pero permite la evaluación comparativa de perspectivas, a diferencia del relativismo puro
        rationale: "El texto: 'Mannheim distinguió ideología (encubre intereses dominantes) de utopía (orienta al cambio) → frente al relativismo, propuso el relacionismo: el conocimiento está situado pero puede evaluarse comparando perspectivas'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuáles son los tres momentos de la construcción social de la realidad según Berger y Luckmann y cómo forman una dialéctica? (que son solo dos momentos/externalización: el ser humano proyecta sus actividades en el mundo externo → objetivación: esas actividades se convierten en objetos sociales independientes que parecen naturales → internalización: el individuo asimila el mundo social ya construido como si fuera la realidad dada → la dialéctica: la sociedad es producto humano que vuelve a producir al ser humano/que la construcción social es solo un proceso individual)"
        correctAnswer: externalización (el ser humano proyecta actividades en el mundo) → objetivación (esas actividades se reifican como objetos sociales independientes) → internalización (el individuo asimila el mundo social como realidad dada) → dialéctica: la sociedad es producto humano que vuelve a producir al ser humano
        rationale: "El texto: 'Berger y Luckmann: externalización → objetivación → internalización → la dialéctica de la construcción social: la sociedad es producto humano que vuelve a producir al ser humano'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es el habitus de Bourdieu y cómo genera prácticas sociales sin conciencia reflexiva? (que el habitus es lo que se enseña en la escuela/el habitus es el sistema de disposiciones cognitivas, valorativas y prácticas que el individuo incorpora a través de la socialización en un campo → genera prácticas coherentes con la posición social del agente sin necesidad de cálculo consciente → es al mismo tiempo producto de la historia social y productor de prácticas → el agente actúa 'como pez en el agua' en su campo/que el habitus es solo una teoría de la conciencia)"
        correctAnswer: el habitus es el sistema de disposiciones incorporadas a través de la socialización → genera prácticas coherentes con la posición social del agente sin cálculo consciente → es producto de la historia social y productor de prácticas ('el pez en el agua')
        rationale: "El texto: 'el habitus (sistema de disposiciones incorporadas producto de la historia social) genera prácticas coherentes sin conciencia'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es la violencia simbólica en Bourdieu y cuál es su característica más paradójica? (que es violencia física encubierta/la dominación ejercida con la complicidad tácita del dominado: el dominado no solo acepta la dominación sino que contribuye activamente a ella al haber interiorizado las categorías de percepción del dominante → la doxa (lo que se da por sentado sin cuestionamiento) es el mecanismo → su característica más paradójica es que no requiere coerción física/que la violencia simbólica solo la ejerce el Estado)"
        correctAnswer: la dominación ejercida con la complicidad tácita del dominado: el dominado ha interiorizado las categorías de percepción del dominante y contribuye activamente a su propia dominación → la doxa (lo que se da por sentado) es el mecanismo; lo más paradójico es que no requiere coerción física
        rationale: "El texto: 'la violencia simbólica: dominación ejercida con la complicidad tácita del dominado gracias a la doxa (lo que se da por sentado sin cuestionamiento)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué establece el principio de simetría del Programa Fuerte de Bloor y qué crítica implica? (que el conocimiento verdadero no necesita explicación/que el sociólogo debe explicar el conocimiento científico verdadero y el falso con los mismos tipos de factores sociales → crítica al modelo whig de la ciencia: que solo explica el error socialmente (el éxito es epistemológicamente evidente y no necesita explicación social) → el Programa Fuerte hace la explicación social simétrica entre éxito y fracaso científico/que el Programa Fuerte niega la objetividad científica)"
        correctAnswer: el principio de simetría exige explicar el conocimiento verdadero y el falso con los mismos factores sociales → crítica al modelo whig que solo explica el error social y considera el éxito científico como autoevidente → la explicación sociológica debe ser simétrica entre conocimiento científico exitoso y fracasado
        rationale: "El texto: 'Bloor y el Programa Fuerte: el principio de simetría exige explicar el conocimiento verdadero y el falso con los mismos factores sociales → crítica al modelo whig'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo documentaron Latour y Woolgar la 'construcción' de los hechos científicos en el laboratorio? (que los hechos científicos son objetivos y no se construyen/mediante observación etnográfica del laboratorio del Instituto Salk (Guillemin y Schally), documentaron que los 'hechos' emergen de prácticas de inscripción (textos, gráficos, máquinas), retórica científica y negociación social → el hecho se 'solidifica' cuando las controversias se cierran y las modalidades del enunciado cambian de 'los autores afirman que...' a 'es un hecho que...'/que Latour y Woolgar estudiaron los laboratorios a distancia)"
        correctAnswer: mediante etnografía del laboratorio (Instituto Salk), documentaron que los 'hechos' emergen de prácticas de inscripción (textos, gráficos, máquinas), retórica y negociación social → el hecho se 'solidifica' cuando las controversias se cierran y los enunciados pierden sus modalidades de atribución
        rationale: "El texto: 'Latour y Woolgar en La vida en el laboratorio documentaron cómo los hechos científicos se construyen en el laboratorio mediante inscripciones, retórica y negociación social'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo generan los rituales de interacción de Collins capital emocional y solidaridad grupal? (que los rituales de interacción son solo ceremonias religiosas/Collins: los rituales de interacción cara a cara (foco de atención compartido, barrera con los de fuera, ritmo sincronizado) generan efervescencia colectiva → capital emocional (energía positiva que el participante lleva al siguiente encuentro) y solidaridad grupal → los rituales de interacción cotidianos (conversaciones, reuniones) son la microsociología de la macrosolidaridad durkheimiana/que Collins rechazó el concepto de ritual)"
        correctAnswer: los rituales de interacción (foco compartido, sincronía, barrera grupal) generan efervescencia colectiva → capital emocional: energía positiva que el participante lleva al siguiente encuentro → solidaridad grupal: los rituales cotidianos son la microsociología de la macrosolidaridad durkheimiana
        rationale: "El texto: 'Collins: los rituales de interacción generan energía emocional y solidaridad grupal → el capital emocional se acumula y motiva la participación en nuevos rituales'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuáles son las normas CUDOS de Merton para la ciencia y qué función social cumplen? (que son normas jurídicas/Comunalismo (el conocimiento es un bien común), Universalismo (los enunciados científicos se evalúan por criterios impersonales), Desinterés (el científico actúa por el bien del conocimiento, no por interés personal) y Escepticismo organizado (todo conocimiento es provisional y revisable) → son el ethos de la ciencia que garantiza su objetividad institucional/que Merton rechazó toda normatividad en la ciencia)"
        correctAnswer: CUDOS: Comunalismo (conocimiento como bien común), Universalismo (criterios impersonales de evaluación), Desinterés (motivación epistémica, no personal) y Escepticismo organizado (todo conocimiento es provisional y revisable) → el ethos de la ciencia que garantiza su objetividad institucional
        rationale: "Las normas CUDOS de Merton (1942) describen el ethos normativo de la comunidad científica; el Programa Fuerte de Bloor las criticó por ser demasiado normativas e ignorar la realidad sociológica de la ciencia."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo conceptualiza Bourdieu el capital cultural y cuáles son sus tres formas? (que el capital cultural es solo el dinero para la cultura/capital cultural incorporado: habilidades, disposiciones y conocimientos adquiridos en la socialización (habitus); objetivado: bienes culturales (libros, obras de arte); institucionalizado: títulos y credenciales educativas reconocidas → el capital cultural se convierte en capital simbólico cuando es reconocido como legítimo dentro de un campo/que el capital cultural solo es económico)"
        correctAnswer: capital cultural incorporado: disposiciones y conocimientos adquiridos en la socialización; objetivado: bienes culturales (libros, arte); institucionalizado: títulos educativos → cuando es reconocido como legítimo en un campo se convierte en capital simbólico
        rationale: "El texto: 'el capital puede ser económico, cultural (objetivado/institucionalizado/incorporado), social o simbólico' → las tres formas del capital cultural son centrales en la sociología de la educación de Bourdieu."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la tensión entre el constructivismo social y el realismo científico respecto al conocimiento científico? (que no hay tensión/el constructivismo social (Latour, Woolgar, Bloor) argumenta que los hechos científicos son producto de prácticas sociales contingentes; el realismo científico (Bhaskar, Boyd) argumenta que la ciencia accede a estructuras reales del mundo independientes de los observadores → la tensión: ¿cómo puede la ciencia ser socialmente construida y a la vez exitosa en predecir y manipular el mundo natural?/que el constructivismo y el realismo son compatibles sin tensión)"
        correctAnswer: el constructivismo social (Latour/Bloor) argumenta que los hechos científicos emergen de prácticas sociales contingentes; el realismo científico argumenta que la ciencia accede a estructuras reales independientes de los observadores → la tensión: ¿cómo puede ser socialmente construida y a la vez exitosa en predecir el mundo natural?
        rationale: "La tensión constructivismo/realismo científico fue el eje de las 'Guerras de la Ciencia' de los años 1990 (Sokal, Latour); las respuestas van desde el realismo pragmatista de Hacking hasta el realismo crítico de Bhaskar."
        difficulty: 5
        objectives: [es.pre_reading]
