authorNotes: "Texto sobre sociología del conocimiento: Mannheim (ideología/utopía, perspectivismo, relativismo vs. relacionismo), Berger/Luckmann (construcción social de la realidad: externalización, objetivación, internalización; institucionalización, legitimación, socialización primaria/secundaria), Bourdieu (habitus, campo, capital simbólico/cultural/social, violencia simbólica, doxa), Collins (rituales de interacción, cadenas de rituales, capital emocional), Bloor/principio de simetría en la sociología del conocimiento científico, Latour/Woolgar laboratorio, Merton normas CUDOS, constructivismo vs. realismo científico."
example: "Mannheim: ideología (legitima el statu quo) vs. utopía (lo transforma) → Berger/Luckmann: realidad socialmente construida (externalización→objetivación→internalización) → Bourdieu: habitus + campo + capital cultural → violencia simbólica → Bloor: Programa Fuerte: explicar tanto el conocimiento verdadero como el falso con las mismas causas sociales."
