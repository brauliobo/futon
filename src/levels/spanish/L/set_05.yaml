title: 🔬 Gramática - Semántica Formal y Lógica del Lenguaje Natural
level: L
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Semántica formal avanzada: modelo teórico de Montague (semántica intensional, mundos posibles, cuantificadores de tipo <e,t>), cuantificadores generalizados (Barwise/Cooper), ámbito del cuantificador y ambigüedad de ámbito, presuposición vs. aserción (filtros de presuposición en oración compuesta), implicatura convencional vs. conversacional (Grice), condicionales indicativos vs. subjuntivos (Stalnaker-Lewis), la paradoja de la implicación material, semántica de eventos (Davidson, neo-davidsonianos), telicidad y aspecto (Vendler: estados/actividades/realizaciones/logros), el aspecto en español (pretérito perfecto simple vs. imperfecto)."
example: "Los cuantificadores generalizados tratan 'todo hombre corre' como relación entre conjuntos → [[todo]] = λP.λQ.P⊆Q → el modelo de tipos Montague unifica nominal y oracional."
repeatAll: 2
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Cuantificadores, Ámbito y Presuposición
    exercises:
      - type: grammar
        question: "¿Cómo analiza Montague los cuantificadores en la semántica formal y qué tipo semántico tienen? (como palabras léxicas sin estructura/como cuantificadores generalizados de tipo <<e,t>,t>: 'todo' → λP.λQ.P⊆Q; 'algún' → λP.λQ.P∩Q≠∅ → la oración 'Todo hombre corre' se analiza como la relación de inclusión entre el conjunto de hombres y el conjunto de corredores/que los cuantificadores son de tipo <e,t>)"
        correctAnswer: "como cuantificadores generalizados de tipo <<e,t>,t>: 'todo' → λP.λQ.P⊆Q; 'algún' → λP.λQ.P∩Q≠∅ → la oración 'Todo hombre corre' se analiza como la relación de inclusión entre el conjunto de hombres y el conjunto de corredores"
        rationale: "Barwise/Cooper (1981): los cuantificadores son relaciones entre conjuntos (tipo <<e,t>,t>); el modelo de Montague formaliza esto en cálculo lambda con tipos."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la ambigüedad de ámbito y cuándo aparece en español? (que el ámbito es siempre claro/cuando una oración contiene dos cuantificadores, pueden interpretarse con distintos ámbitos: 'Un estudiante leyó todos los libros' → lectura de ámbito ancho de 'un estudiante' (hay uno específico que leyó todos) vs. ámbito ancho de 'todos los libros' (para cada libro, un posiblemente distinto estudiante lo leyó) → la ambigüedad se resuelve en LF mediante QR (Quantifier Raising)/que en español no hay ambigüedad de ámbito)"
        correctAnswer: "cuando una oración contiene dos cuantificadores, pueden interpretarse con distintos ámbitos: 'Un estudiante leyó todos los libros' tiene lectura colectiva (un estudiante específico) o distributiva (para cada libro, posiblemente un estudiante diferente) → se resuelve en LF mediante QR"
        rationale: "La ambigüedad de ámbito es uno de los fenómenos centrales de la semántica formal; en el PM se analiza con Quantifier Raising (QR) en LF que reordena los cuantificadores."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la diferencia entre presuposición y aserción, y qué son los 'filtros de presuposición'? (que son lo mismo/la aserción es el contenido que se afirma; la presuposición es el contenido que se da por sentado ('El rey de Francia es calvo' presupone que hay un rey de Francia) → los filtros de presuposición (Karttunen): en una oración compuesta, algunas estructuras (condicionales, disyunciones) filtran la proyección de las presuposiciones de las partes/que la presuposición es siempre verdadera)"
        correctAnswer: "la aserción es lo que se afirma; la presuposición es lo que se da por sentado ('El rey de Francia es calvo' presupone que hay un rey de Francia) → los filtros de presuposición (Karttunen): estructuras condicionales/disyuntivas pueden bloquear la proyección de presuposiciones"
        rationale: "Karttunen (1973): la proyección de presuposiciones en oraciones compuestas está regulada por 'enchufes' (plugs), 'agujeros' (holes) y 'filtros' (filters) según el operador oracional."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la clasificación de Vendler (1967) de los predicados verbales según su aspecto léxico (Aktionsart) y qué relevancia tiene para el español? (que todos los verbos tienen la misma estructura temporal/estados (saber, amar): no delimitados, sin agente; actividades (correr, hablar): dinámicos, no delimitados; realizaciones (escribir un libro): dinámicos, delimitados, con culminación; logros (encontrar, llegar): puntuales, delimitados → la distinción determina los usos del pretérito imperfecto (estados/actividades) vs. indefinido (realizaciones/logros) en español/que la clasificación solo aplica al inglés)"
        correctAnswer: "estados (saber): no delimitados; actividades (correr): dinámicos, no delimitados; realizaciones (escribir un libro): dinámicos, delimitados, con culminación; logros (encontrar): puntuales → determina los usos del pretérito imperfecto (estados/actividades) vs. indefinido (realizaciones/logros) en español"
        rationale: "La distinción de Vendler (1967) es fundamental para el análisis del aspecto verbal en español: el pretérito imperfecto es compatible con estados y actividades (durativas no delimitadas), mientras el indefinido codifica realizaciones y logros (eventos delimitados)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son las implicaturas conversacionales de Grice y en qué se diferencian de las convencionales? (que son lo mismo/implicaturas conversacionales: se derivan de las máximas de cooperación (cantidad, calidad, relación, modo) → cancelables y calculables (si alguien dice 'sé algo de eso' implica no saber todo, pero es cancelable); implicaturas convencionales: ligadas al significado convencional de palabras como 'pero', 'incluso' → no cancelables ('María es pobre pero honrada' implica contraste convencionalmente)/que todas las implicaturas son presuposiciones)"
        correctAnswer: "implicaturas conversacionales: derivadas de las máximas de cooperación → cancelables y calculables; implicaturas convencionales: ligadas al significado léxico de palabras como 'pero' o 'incluso' → no cancelables"
        rationale: "Grice (1975): las implicaturas conversacionales son inferenciales y cancelables ('no lo sé todo, pero lo sé'); las convencionales (Potts 2005) son parte del contenido léxico de ciertas palabras y no se cancelan."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo analiza Davidson la semántica de los eventos y qué ventajas ofrece? (que los eventos no existen semánticamente/Davidson (1967): los verbos de acción tienen un argumento de evento implícito (e) → 'Juan corrió rápidamente' = ∃e[Correr(e,Juan) ∧ Rápido(e)] → permite tratar los adverbios como predicados del evento, analizar la inferencia (de 'corrió rápidamente' se infiere 'corrió') y unificar las relaciones causales/que los eventos se expresan solo con adverbios)"
        correctAnswer: "Davidson (1967): los verbos de acción tienen un argumento de evento implícito (e) → 'Juan corrió rápidamente' = ∃e[Correr(e,Juan) ∧ Rápido(e)] → los adverbios son predicados del evento, y se unifica la inferencia causal y el análisis de la acción"
        rationale: "La semántica davidsoniana de eventos es fundamental en semántica formal: permite el análisis composicional de adverbios y la teoría neo-davidsoniana (Parsons) que añade argumentos de papel temático."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué son los condicionales subjuntivos (contrafácticos) y cómo los analiza la semántica de mundos posibles (Stalnaker-Lewis)? (que son solo hipótesis imposibles/los condicionales contrafácticos ('Si Pedro hubiera estudiado, habría aprobado') hablan de mundos posibles en los que el antecedente es verdadero → Lewis: la verdad del condicional depende de si el consecuente es verdadero en el mundo posible más cercano al actual en que el antecedente es verdadero/que los condicionales subjuntivos son siempre falsos)"
        correctAnswer: "los condicionales contrafácticos ('Si Pedro hubiera estudiado, habría aprobado') hablan de mundos posibles → Lewis: el condicional es verdadero si el consecuente es verdadero en el mundo posible más cercano al actual en que el antecedente es verdadero"
        rationale: "Stalnaker/Lewis (1968-1973): la semántica de condicionales contrafácticos usa la noción de 'mundo posible más cercano' (closest possible world); la similitud entre mundos define la cercanía."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cuál es la paradoja de la implicación material y por qué es un problema para la semántica formal? (que no es un problema real/la implicación material (p→q) es verdadera cuando p es falso, independientemente de q → 'Si la luna es de queso, 2+2=5' es verdadero → esto parece contraintuitivo con los condicionales naturales; en lenguaje natural, los condicionales llevan implicatura de relevancia entre antecedente y consecuente que la lógica formal no captura/que la implicación material es igual que el condicional natural)"
        correctAnswer: la implicación material (p→q) es verdadera cuando p es falso → 'Si la luna es de queso, 2+2=5' es verdadera formalmente, pero contraintuitiva → los condicionales naturales llevan implicatura de relevancia que la lógica formal no captura
        rationale: "La paradoja de la implicación material motivó el desarrollo de la lógica de relevancia y la semántica de mundos posibles para condicionales naturales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿En qué consiste la telicidad y qué diferencia hay entre 'Juan corrió' y 'Juan corrió hasta la meta' en términos aspectuales? (que son semánticamente idénticos/'Juan corrió' es atélico (actividad sin punto de culminación natural); 'Juan corrió hasta la meta' es télico (realización con punto final) → la frase PP 'hasta la meta' añade un límite y cambia el Aktionsart de actividad a realización → la telicidad interactúa con el contraste imperfecto/indefinido en español/que la telicidad solo se mide en inglés)"
        correctAnswer: "'Juan corrió' es atélico (actividad sin punto de culminación); 'Juan corrió hasta la meta' es télico (realización con punto final) → el PP 'hasta la meta' añade un límite y cambia el Aktionsart → la telicidad interactúa con el contraste imperfecto/indefinido en español"
        rationale: "La telicidad es composicional: el verbo de actividad se vuelve télico cuando un sintagma de medida o límite (hasta, en + tiempo, etc.) añade una culminación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia semántica y aspectual hay entre 'Juan estudiaba' y 'Juan estudió' en español desde la perspectiva formal? (que son intercambiables/'Juan estudiaba' (imperfecto): aspecto imperfectivo → el evento se presenta como no delimitado, en curso, habitual o continuo desde una perspectiva interna; 'Juan estudió' (indefinido): aspecto perfectivo → el evento se presenta como delimitado, completado, visto desde fuera → la oposición perfectivo/imperfectivo es aspectual (no temporal)/que la diferencia es solo de tiempo)"
        correctAnswer: "'Juan estudiaba' (imperfecto): aspecto imperfectivo → evento no delimitado, en curso, habitual o continuo (perspectiva interna); 'Juan estudió' (indefinido): aspecto perfectivo → evento delimitado, completado (perspectiva externa) → la oposición es aspectual, no temporal"
        rationale: "La distinción pretérito imperfecto vs. indefinido en español es el paradigma más estudiado de la oposición aspectual imperfectivo/perfectivo en las lenguas romances."
        difficulty: 5
        objectives: [es.pre_reading]
  - pageNumber: 2
    title: Semántica Intensional y Composicionalidad
    exercises:
      - type: grammar
        question: "¿Qué es la semántica intensional y por qué la necesitamos además de la semántica extensional? (que la extensión es suficiente/la extensión de 'estrella de la tarde' y 'estrella de la mañana' es la misma (Venus), pero sus intensiones son distintas → en contextos intensionales ('Juan cree que la estrella de la tarde es Venus') la sustitución de co-referenciales no preserva la verdad → necesitamos intensiones (funciones de mundos posibles a extensiones) para verbos de actitud proposicional/que la intensión no existe)"
        correctAnswer: la extensión de 'estrella de la tarde' y 'estrella de la mañana' es la misma (Venus), pero sus intensiones son distintas → en contextos de actitud proposicional ('Juan cree que...') la sustitución falla → la intensión es una función de mundos posibles a extensiones
        rationale: "Frege distinguió Sinn (sentido/intensión) de Bedeutung (referencia/extensión); Montague formalizó esto: las intensiones son funciones de mundos posibles × tiempos a extensiones."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es el principio de composicionalidad de Frege y qué implicaciones tiene para la semántica formal? (que las palabras determinan el significado de la oración directamente/el significado de una expresión compleja es función del significado de sus partes y de la forma en que se combinan (sintaxis) → permite computar el significado de oraciones nuevas nunca antes oídas combinando las semánticas de sus partes: base de la semántica formal (Montague, Heim/Kratzer)/que el contexto determina completamente el significado)"
        correctAnswer: "el significado de una expresión compleja es función del significado de sus partes y de cómo se combinan sintácticamente → permite computar el significado de nuevas oraciones combinando las semánticas de sus partes: base de la semántica formal de Montague/Heim-Kratzer"
        rationale: "El principio de composicionalidad (Frege) es el fundamento de toda la semántica formal: explica la productividad semántica (entendemos oraciones nuevas) y define la interfaz sintaxis-semántica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es un 'cuantificador generoso' (upward entailing) vs. un 'cuantificador decreciente' (downward entailing) y por qué importa para el licenciamiento de los términos de polaridad negativa (TPN)? (que no importa/cuantificador creciente (todo, cada): de 'todo hombre corre' se infiere 'todo hombre corre en el parque'; cuantificador decreciente (ningún, ni): de 'ningún hombre corre en el parque' se infiere 'ningún hombre corre' → los TPN (nadie, jamás, en absoluto) están licenciados en entornos decrecientes/que los TPN se licencian en entornos crecientes)"
        correctAnswer: "creciente (todo): de 'todo hombre corre' → 'todo hombre corre rápido' es inferencia válida; decreciente (ningún): de 'ningún hombre corre rápido' → 'ningún hombre corre' es inferencia válida → los TPN se licencian en entornos decrecientes"
        rationale: "La teoría de los Negative Polarity Items (Ladusaw 1979): los TPN (en mi vida, ni un solo, jamás) requieren entornos decrecientes (monotone decreasing) para estar licenciados."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la distinción de/referencia y denotación en los sintagmas nominales definidos e indefinidos? (que es idéntica/los sintagmas definidos ('el libro') presuponen unicidad y familiaridad: refieren a un individuo identificable en el contexto; los indefinidos ('un libro') introducen un nuevo referente en el discurso (nuevo en la Representación del Discurso - DRT) → la Teoría de la Representación del Discurso (Kamp): el indefinido crea un marcador de discurso que puede ser anafóricamente retomado/que los indefinidos siempre son genéricos)"
        correctAnswer: los definidos ('el libro') presuponen unicidad y familiaridad → refieren a individuo identificable; los indefinidos ('un libro') introducen un nuevo referente en el discurso (DRT) → crean un marcador de discurso que puede ser anafóricamente retomado
        rationale: "La Teoría de la Representación del Discurso (Kamp 1981): los indefinidos crean referentes de discurso (DRs) en la caja del DRS; los definidos acceden a DRs ya introducidos (anáfora)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo se analiza formalmente la negación y cuáles son sus interacciones con el ámbito del cuantificador? (que la negación es solo una palabra/la negación es un operador que invierte el valor de verdad: ¬p → su ámbito respecto a los cuantificadores genera ambigüedades: 'No todos vinieron' puede ser ¬∀x[Vinieron(x)] (no todos) o ∀x[¬Vinieron(x)] (ninguno) → la doble negación en español ('No vino nadie') no es contradicción sino refuerzo de la negación única/que la negación no interactúa con los cuantificadores)"
        correctAnswer: "la negación es un operador ¬ que interactúa con los cuantificadores según el ámbito: 'No todos vinieron' = ¬∀x[Vinieron(x)] vs. ∀x[¬Vinieron(x)] → la doble negación española ('No vino nadie') es un recurso de concordancia negativa (negative concord), no una doble negación lógica"
        rationale: "La concordancia negativa (negative concord) del español (n-words como nadie, nunca, ninguno como refuerzos de la negación, no como términos de polaridad independientes) contrasta con el inglés donde la doble negación lógica sería una afirmación."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la anáfora donkey y por qué desafía la semántica cuantificacional estándar? (que es un tipo de burro/las oraciones 'Si alguien tiene un burro, lo cuida' presentan un problema: 'un burro' tiene ámbito restringido al antecedente del condicional pero el pronombre 'lo' (anáfora de burro) lo retoma desde la consecuente → la semántica estándar no puede manejar la correferencia porque el cuantificador existencial ya cerró su ámbito → DRT (Kamp) y semántica dinámica (Groenendijk/Stokhof) resuelven esto/que la anáfora de burro es solo metáfora)"
        correctAnswer: las oraciones 'Si alguien tiene un burro, lo cuida' presentan anáfora cruzando el ámbito del cuantificador existencial → la semántica estándar no puede manejarlo; DRT (Kamp) y semántica dinámica resuelven esto tratando el significado oracional como actualizador de estado de información
        rationale: "La anáfora donkey (Geach 1962) fue el fenómeno que motivó la Teoría de la Representación del Discurso (Kamp 1981) y la semántica dinámica (Heim 1983, Groenendijk/Stokhof 1991)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué diferencia hay entre los cuantificadores flotantes y los cuantificadores ligados en la gramática del español? (que son lo mismo/cuantificadores flotantes: 'Los estudiantes leyeron todos el libro' (todos separado del SN) se analiza como adverbio de evento o como QR desde Spec-DP; cuantificadores ligados: una variable pronominal está ligada por un cuantificador → 'Cada estudiante pensó que él aprobaría' (lectura ligada: cada uno pensó que él mismo aprobaría)/que los cuantificadores flotantes no existen en español)"
        correctAnswer: "cuantificadores flotantes ('Los estudiantes leyeron todos el libro'): todos separado del SN, analizable como adverbio de evento o huella de movimiento; cuantificadores ligados: una variable pronominal está cuantitativamente ligada por un cuantificador que la c-comanda"
        rationale: "Los cuantificadores flotantes (Sportiche 1988) se analizan como rastros del movimiento del SN sujeto; la ligación de variables (Reinhart 1983) requiere c-mando del cuantificador sobre la variable."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la 'genericidad' y cómo se interpreta 'Los leones son peligrosos' vs. 'Unos leones son peligrosos'? (que ambas son idénticas/'Los leones son peligrosos' es genérica: cuantifica sobre el prototipo de la especie (operador GEN), no sobre individuos particulares → puede ser verdadera aunque no todos los leones sean peligrosos; 'Unos leones son peligrosos' es existencial → se refiere a leones particulares/que 'los leones' es un universal)/que la distinción no es semántica)"
        correctAnswer: "'Los leones son peligrosos' es genérica: cuantifica sobre el prototipo de la especie con operador GEN, no individuos particulares → puede ser verdadera aunque algunos leones no lo sean; 'Unos leones son peligrosos' es existencial y se refiere a individuos particulares"
        rationale: "Las oraciones genéricas (kind-referring) con SN definido plural vs. los cuantificadores existenciales son centrales en la semántica de los genéricos (Carlson 1977, Krifka et al. 1995)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Cómo interactúan el aspecto y la telicidad con el cuantificador 'en + tiempo' en español? (sin interacción/'En una hora' (en + tiempo) es un modificador de delimitación que requiere un predicado télico: 'Juan escribió la carta en una hora' (télico, compatible); '*Juan corrió en una hora' (agramatical con interpretación de completar el correr; solo aceptable si hay una meta implícita) → el test del 'en + tiempo' diagnostica la telicidad de un predicado/que 'en + tiempo' es solo una expresión temporal)"
        correctAnswer: "'En + tiempo' (en una hora) requiere un predicado télico: 'Juan escribió la carta en una hora' (compatible, télico); '*Juan corrió en una hora' (inaceptable con interpretación atélica) → el test del 'en + tiempo' diagnostica la telicidad del predicado"
        rationale: "El test del 'en + tiempo' vs. 'durante + tiempo' es el diagnóstico canónico de la telicidad en español: 'en' selecciona predicados télicos (realizaciones/logros); 'durante' selecciona atélicos (estados/actividades)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: grammar
        question: "¿Qué es la 'semántica dinámica' y por qué supera las limitaciones de la semántica veritativo-funcional estándar para el análisis del discurso? (que es lo mismo que la semántica veritativo-funcional/la semántica dinámica (Heim 1983, Groenendijk/Stokhof 1991): el significado de una oración no es solo sus condiciones de verdad sino su potencial para actualizar el estado de información del interlocutor → permite analizar la anáfora inter-oracional, la presuposición y la estructura del discurso como actualizaciones dinámicas del contexto/que la semántica dinámica no existe)"
        correctAnswer: "la semántica dinámica (Heim/Groenendijk-Stokhof): el significado oracional es una función de contextos de entrada a contextos de salida → permite analizar la anáfora inter-oracional y la presuposición como actualizaciones del estado de información del interlocutor, superando las condiciones de verdad estáticas"
        rationale: "La semántica dinámica (File Change Semantics de Heim 1983, Dynamic Predicate Logic de Groenendijk/Stokhof 1991) surgió para resolver la anáfora donkey y la anáfora discursiva."
        difficulty: 5
        objectives: [es.pre_reading]
