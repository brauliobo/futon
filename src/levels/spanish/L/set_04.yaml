authorNotes: "Texto sobre bioética: principios de Beauchamp/Childress (autonomía, beneficencia, no maleficencia, justicia), consentimiento informado, capacidad de decisión, directivas anticipadas, problema del paternalismo, dilema del tranvía/trolley aplicado a la medicina, triage y recursos escasos (COVID-19), CRISPR y edición genética germinal (caso He Jiankui 2018), eutanasia activa vs. pasiva (Holanda, Bélgica, España 2021), experimentación en seres humanos (Nuremberg, Tuskegee), justicia distributiva y acceso a la salud."
example: "Lee prestando atención a cómo los cuatro principios de la bioética se aplican a los casos clínicos y a los dilemas emergentes de la biotecnología."
