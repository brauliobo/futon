pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La bioética nació en los años 1970 como respuesta a los abusos de la medicina experimental (experimentos nazis → Código de Núremberg 1947; experimento Tuskegee 1932-1972 en afroamericanos con sífilis no tratada → Informe Belmont 1979). Tom Beauchamp y James Childress sistematizaron los cuatro principios de la bioética: (1) Autonomía: el paciente tiene derecho a decidir sobre su propio cuerpo → consentimiento informado: libre, competente, informado, sin coacción; (2) Beneficencia: actuar en beneficio del paciente; (3) No maleficencia (primum non nocere); (4) Justicia: distribución equitativa de recursos y cargas. El paternalismo médico viola la autonomía: el médico decide 'por el bien del paciente' sin respetar su voluntad → conflicto beneficencia vs. autonomía. Las directivas anticipadas (testamento vital) permiten al paciente expresar sus deseos para cuando pierda la capacidad de decisión → desafío: ¿puede el yo futuro incapacitado ser vinculado por el yo presente? La eutanasia activa (administración de sustancia letal) vs. pasiva (retirada del tratamiento) sigue siendo un debate ético: Holanda y Bélgica la legalizaron; España aprobó la Ley de Eutanasia en 2021. El triage en situaciones de recursos escasos (pandemia COVID-19) planteó criterios de prioridad: ¿edad, pronóstico, turno de llegada, lotería? → el dilema del tranvía aplicado a la medicina: ¿es lícito sacrificar a uno para salvar a cinco? La edición genética germinal con CRISPR-Cas9: el caso He Jiankui (2018, China) produjo bebés con resistencia al VIH modificando la línea germinal → violó la distinción terapéutico/mejora y la prohibición de modificaciones hereditarias → condena internacional. La justicia distributiva: ¿tiene toda persona acceso igualitario a los recursos médicos? Rawls (velo de ignorancia) vs. Nozick (derechos individuales sobre la distribución) tienen implicaciones opuestas para la cobertura sanitaria universal."
    exercises:
      - type: reading
        question: "¿Cuáles son los cuatro principios del principialismo de Beauchamp y Childress y qué conflictos pueden surgir entre ellos? (progreso, ciencia, cura y bienestar/autonomía (derecho del paciente a decidir), beneficencia (actuar en su beneficio), no maleficencia (no dañar), justicia (distribución equitativa) → el conflicto paradigmático es autonomía vs. beneficencia: el paternalismo médico decide sin respetar la voluntad del paciente/que los principios no generan conflictos)"
        correctAnswer: autonomía (derecho del paciente a decidir), beneficencia (actuar en su beneficio), no maleficencia (no dañar), justicia (distribución equitativa) → el conflicto paradigmático es autonomía vs. beneficencia: el paternalismo médico decide sin respetar la voluntad del paciente
        rationale: "El texto: 'Beauchamp y Childress sistematizaron los cuatro principios: autonomía, beneficencia, no maleficencia, justicia'; 'el paternalismo médico viola la autonomía → conflicto beneficencia vs. autonomía'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué el experimento Tuskegee es un caso paradigmático de violación ética en la investigación médica? (porque no tenía financiación/porque durante 40 años (1932-1972) investigadores del gobierno de EE. UU. observaron la progresión natural de la sífilis en hombres afroamericanos sin informarles del diagnóstico ni tratarlos con penicilina (disponible desde 1947) → violó autonomía, consentimiento informado, no maleficencia y justicia racial → llevó al Informe Belmont/porque los participantes eran voluntarios informados)"
        correctAnswer: porque durante 40 años investigadores del gobierno de EE. UU. observaron la progresión natural de la sífilis en hombres afroamericanos sin informarles del diagnóstico ni tratarlos con penicilina (disponible desde 1947) → violó autonomía, consentimiento informado, no maleficencia y justicia racial → llevó al Informe Belmont
        rationale: "El texto: 'experimento Tuskegee 1932-1972 en afroamericanos con sífilis no tratada → Informe Belmont 1979'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué problema filosófico plantean las directivas anticipadas respecto a la identidad personal? (que son siempre vinculantes/el dilema de la identidad diacrónica: si la persona con demencia avanzada tiene una identidad psicológica diferente a la de quien firmó la directiva, ¿puede el yo presente vincular al yo futuro diferente? → Parfit (identidad personal como continuidad psicológica) sugiere que puede ser injusto cumplir instrucciones del yo anterior sobre un yo que ya ha cambiado/que no hay ningún problema filosófico)"
        correctAnswer: el dilema de la identidad diacrónica: si la persona con demencia avanzada es psicológicamente diferente a quien firmó la directiva, ¿puede el yo presente vincular al yo futuro diferente? → Parfit sugiere que puede ser injusto cumplir instrucciones del yo anterior sobre un yo que ya ha cambiado
        rationale: "El texto: 'desafío: ¿puede el yo futuro incapacitado ser vinculado por el yo presente?' — este dilema conecta con la teoría de la identidad personal de Parfit."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué dilemas éticos planteó la pandemia de COVID-19 respecto al triage de recursos sanitarios escasos? (ninguno/cuando las UCI estuvieron saturadas, los comités éticos tuvieron que definir criterios de priorización (pronóstico de supervivencia, edad, comorbilidades, antigüedad de ingreso) → surgió el dilema del tranvía médico: ¿es éticamente lícito retirar un respirador a un paciente de menor pronóstico para dárselo a uno con mayor esperanza de vida?/que no hubo dilemas porque había suficientes recursos)"
        correctAnswer: cuando las UCI estuvieron saturadas, los comités éticos tuvieron que definir criterios de priorización → surgió el dilema del tranvía médico: ¿es éticamente lícito retirar un respirador a un paciente de menor pronóstico para dárselo a uno con mayor esperanza de vida?
        rationale: "El texto: 'el triage en situaciones de recursos escasos (pandemia COVID-19) planteó criterios de prioridad → el dilema del tranvía aplicado a la medicina'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Por qué generó condena internacional el experimento de He Jiankui con CRISPR en 2018? (porque usó CRISPR en adultos/porque modificó la línea germinal de embriones humanos (cambios hereditarios para siempre), sin consenso científico sobre seguridad, sin consentimiento institucional adecuado y buscando mejora más que terapia → violó la distinción terapéutico/mejora y la prohibición internacional de modificaciones germinales hereditarias/porque CRISPR no funciona)"
        correctAnswer: porque modificó la línea germinal de embriones humanos (cambios hereditarios permanentes), sin consenso científico sobre seguridad, sin consentimiento institucional adecuado y buscando mejora más que terapia → violó la distinción terapéutico/mejora y la prohibición de modificaciones germinales hereditarias
        rationale: "El texto: 'el caso He Jiankui violó la distinción terapéutico/mejora y la prohibición de modificaciones hereditarias → condena internacional'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la diferencia ética entre eutanasia activa y pasiva y qué países la han legalizado? (que la diferencia es solo legal/eutanasia activa: el médico administra directamente una sustancia para provocar la muerte (Holanda, Bélgica, España 2021); eutanasia pasiva: retirada de tratamientos de soporte vital → moralmente más aceptada; la distinción ha sido cuestionada (Rachels 1975): si el resultado es el mismo, la diferencia entre acción y omisión es moralmente irrelevante/que ningún país la ha legalizado)"
        correctAnswer: eutanasia activa: el médico administra directamente una sustancia para provocar la muerte (Holanda, Bélgica, España 2021); eutanasia pasiva: retirada de tratamientos → la distinción acción/omisión ha sido cuestionada (Rachels 1975): si el resultado es el mismo, la diferencia es moralmente irrelevante
        rationale: "El texto: 'eutanasia activa vs. pasiva; Holanda y Bélgica la legalizaron; España aprobó la Ley de Eutanasia en 2021'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo aplicarían Rawls y Nozick sus teorías de justicia al acceso universal a la salud? (que ambos llegarían a la misma conclusión/Rawls (velo de ignorancia): si no supiésemos nuestra condición de salud de antemano, elegiríamos un sistema que garantizara cobertura básica universal → apoya la sanidad pública universal; Nozick (libertarismo): los individuos tienen derechos de propiedad que no pueden ser redistribuidos coercitivamente → cuestiona la redistribución fiscal para pagar la sanidad pública/que Rawls rechaza la sanidad pública)"
        correctAnswer: Rawls (velo de ignorancia): elegiríamos cobertura básica universal al no saber nuestra condición de salud futura → apoya la sanidad pública; Nozick (libertarismo): la redistribución coercitiva viola los derechos de propiedad → cuestiona la fiscalidad obligatoria para sanidad pública
        rationale: "El texto: 'Rawls (velo de ignorancia) vs. Nozick (derechos individuales sobre la distribución) tienen implicaciones opuestas para la cobertura sanitaria universal'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿En qué se diferencia el consentimiento informado de la mera firma de un formulario? (en nada/el consentimiento informado es un proceso (no solo un documento): requiere que el paciente tenga capacidad de decisión (competencia), reciba información comprensible y suficiente sobre diagnóstico y alternativas, tome la decisión libremente (sin coacción) y pueda revocarla en cualquier momento → el formulario es solo el registro del proceso, no el proceso mismo/que el formulario es suficiente)"
        correctAnswer: el consentimiento informado es un proceso que requiere: capacidad de decisión, información comprensible sobre diagnóstico y alternativas, libertad de decisión sin coacción y posibilidad de revocación → el formulario es solo el registro del proceso, no el proceso mismo
        rationale: "El texto: 'consentimiento informado: libre, competente, informado, sin coacción'; el formulario es el registro, pero la bioética exige un proceso genuino de deliberación compartida."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se relaciona el principio de no maleficencia con el uso de placebo en ensayos clínicos? (que el uso de placebo siempre viola la no maleficencia/el uso de placebo viola la no maleficencia si existe un tratamiento efectivo disponible (es ético solo si no hay tratamiento estándar) → la Declaración de Helsinki exige que los participantes del grupo control reciban el mejor tratamiento disponible, no solo placebo/que el placebo siempre cumple la no maleficencia)"
        correctAnswer: el uso de placebo es ético solo si no existe tratamiento estándar efectivo → la Declaración de Helsinki exige que el grupo control reciba el mejor tratamiento disponible, no solo placebo, para respetar el principio de no maleficencia
        rationale: "La tensión entre el diseño controlado de ensayos clínicos y la no maleficencia llevó a la Declaración de Helsinki (AMM) a establecer que el control con placebo es ético solo cuando no hay tratamiento estándar."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué legado dejó el Código de Núremberg (1947) para la investigación biomédica contemporánea? (que autorizó la experimentación en prisioneros/estableció que el consentimiento voluntario del sujeto humano es absolutamente esencial → el primer documento internacional en exigir consentimiento voluntario e informado → fundamento de toda ética de la investigación posterior (Declaración de Helsinki, Informe Belmont, Convenio de Oviedo)/que el Código de Núremberg no tuvo influencia posterior)"
        correctAnswer: estableció que el consentimiento voluntario del sujeto humano es absolutamente esencial → primer documento internacional en exigir consentimiento voluntario e informado → fundamento de toda ética de la investigación posterior (Declaración de Helsinki, Informe Belmont, Convenio de Oviedo)
        rationale: "El texto: 'experimentos nazis → Código de Núremberg 1947'; el principio de consentimiento voluntario es el legado central del Código en respuesta a los experimentos nazis en prisioneros de guerra."
        difficulty: 5
        objectives: [es.pre_reading]
