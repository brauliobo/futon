pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La historia global (o historia del mundo) estudia los procesos históricos a escala planetaria, más allá de los Estados-nación. Kenneth Pomeranz en La gran divergencia (2000) planteó la pregunta más debatida de la historiografía económica contemporánea: ¿por qué Europa Occidental se industrializó primero y no China, que en el siglo XVIII tenía niveles de vida y productividad comparables? Su respuesta: dos factores contingentes: (1) la ubicación del carbón en Inglaterra (cerca de las ciudades industriales) y (2) el acceso a los recursos de las Américas (plata, algodón, azúcar) que liberaron a Europa de las restricciones land-intensive. Immanuel Wallerstein propuso el sistema-mundo capitalista (1974): la economía capitalista se organizó desde el siglo XVI en zonas de centro (Europa Occidental, después EE.UU.: manufacturas, capital, tecnología), periferia (América Latina, África, Asia: materias primas, mano de obra barata) y semiperiferia (posiciones intermedias que permiten la estabilidad del sistema) → las relaciones de intercambio desigual reproducen la jerarquía centro-periferia. El colonialismo español en América (siglo XVI-XIX): la encomienda (el encomendero recibía tributo e indios en trabajo); la mita minera (trabajo forzado en las minas de Potosí); las reducciones (concentración de la población indígena en pueblos para el control fiscal y la evangelización). La esclavitud atlántica: el Middle Passage transportó entre 10 y 12 millones de africanos a América → las economías de plantación del azúcar, tabaco y algodón se basaron en el trabajo forzado → Eric Williams: la esclavitud atlántica fue esencial para la acumulación primitiva que financió la Revolución Industrial en Gran Bretaña (tesis debatida). Dale Tomich propuñó la segunda esclavitud (siglo XIX): cuando la esclavitud declinaba en el Caribe británico y en EE.UU. (tras 1808), se intensificó en Cuba, Brasil y los estados algodoneros del sur de EE.UU. La descolonización (1945-1975): los imperios europeos en Asia y África se desintegraron bajo la presión de los movimientos de independencia y la Guerra Fría (EE.UU./URSS apoyaron la descolonización por razones distintas) → en 1960 la ONU declaró la Declaración sobre la Concesión de la Independencia a los Países y Pueblos Coloniales. El neocolonialismo (Nkrumah, 1965): la independencia política formal encubre la dependencia económica de las antiguas colonias de las metrópolis a través del comercio, la deuda externa y las inversiones."
    exercises:
      - type: reading
        question: "¿Cuál es la 'gran divergencia' de Pomeranz y qué dos factores contingentes la explican? (que Europa fue más inteligente que China/la pregunta: ¿por qué Europa Occidental se industrializó primero cuando en el siglo XVIII China tenía niveles de vida comparables? → dos factores contingentes: (1) la ubicación del carbón en Inglaterra cerca de las ciudades industriales y (2) el acceso a los recursos americanos (plata, algodón, azúcar) que liberaron a Europa de las restricciones land-intensive/que la gran divergencia se debió a la superioridad cultural europea)"
        correctAnswer: la gran divergencia: ¿por qué Europa se industrializó primero cuando China tenía niveles de vida comparables en el siglo XVIII? → dos factores contingentes: (1) ubicación del carbón en Inglaterra cerca de las ciudades industriales y (2) acceso a los recursos americanos que liberaron a Europa de restricciones land-intensive
        rationale: "El texto: 'Pomeranz: ¿por qué Europa Occidental se industrializó primero? → dos factores contingentes: la ubicación del carbón y el acceso a los recursos de las Américas que liberaron a Europa de las restricciones land-intensive'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo explica el sistema-mundo de Wallerstein la reproducción de la desigualdad global? (que la desigualdad es natural/la economía capitalista desde el siglo XVI se organizó en centro (manufacturas, capital, tecnología), periferia (materias primas, mano de obra barata) y semiperiferia (posiciones intermedias estabilizadoras) → el intercambio desigual: el centro obtiene productos de alto valor añadido mientras la periferia proporciona materias primas y trabajo barato → las relaciones de intercambio desigual reproducen la jerarquía/que Wallerstein rechazó el análisis económico)"
        correctAnswer: la economía capitalista se organizó en centro (manufacturas, capital, tecnología), periferia (materias primas, mano de obra barata) y semiperiferia (posiciones intermedias) → el intercambio desigual reproduce la jerarquía: el centro obtiene alto valor añadido; la periferia proporciona materias primas y trabajo barato
        rationale: "El texto: 'Wallerstein: el sistema-mundo capitalista: zonas de centro, periferia y semiperiferia → las relaciones de intercambio desigual reproducen la jerarquía centro-periferia'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuáles fueron los principales mecanismos de explotación del colonialismo español en América? (que el colonialismo español fue beneficioso para los indígenas/la encomienda: el encomendero recibía tributo e indios en trabajo a cambio de evangelizarlos; la mita minera: trabajo forzado rotatorio en las minas de Potosí → produjo una mortalidad masiva; las reducciones: concentración de la población indígena dispersa en pueblos para facilitar el control fiscal y la evangelización/que el colonialismo español no tuvo efectos sobre la población indígena)"
        correctAnswer: la encomienda: tributo e indios en trabajo a cambio de evangelización; la mita minera: trabajo forzado en Potosí → mortalidad masiva; las reducciones: concentración de la población indígena en pueblos para el control fiscal y la evangelización
        rationale: "El texto: 'el colonialismo español: la encomienda (tributo e indios en trabajo), la mita minera (trabajo forzado en las minas de Potosí), las reducciones (concentración de la población indígena para el control fiscal y la evangelización)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la tesis de Eric Williams sobre la relación entre la esclavitud atlántica y la Revolución Industrial? (que la esclavitud no tuvo relación con la industrialización/que la esclavitud atlántica fue esencial para la acumulación primitiva de capital que financió la Revolución Industrial en Gran Bretaña → los beneficios del comercio triangular (telas→África, esclavos→América, azúcar/tabaco/algodón→Europa) generaron el capital que se invirtió en las industrias textil y metalúrgica → la tesis es debatida: la cuantificación de la contribución exacta es difícil/que Eric Williams defendió la esclavitud)"
        correctAnswer: la esclavitud atlántica fue esencial para la acumulación primitiva que financió la Revolución Industrial → los beneficios del comercio triangular generaron el capital invertido en industrias textil y metalúrgica → la tesis es debatida: la cuantificación de la contribución exacta es difícil
        rationale: "El texto: 'Eric Williams: la esclavitud atlántica fue esencial para la acumulación primitiva que financió la Revolución Industrial en Gran Bretaña (tesis debatida)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es la 'segunda esclavitud' de Dale Tomich y cómo contradice la narrativa de la abolición progresiva? (que la esclavitud declinó uniformemente en el siglo XIX/cuando la esclavitud declinaba en el Caribe británico (abolición 1833) y en EE.UU. (tras la prohibición del comercio de esclavos en 1808), se intensificó en Cuba, Brasil y los estados algodoneros del sur de EE.UU. → la segunda esclavitud no fue supervivencia residual sino una expansión masiva ligada al mercado mundial del algodón y el azúcar/que la esclavitud terminó uniformemente con la abolición)"
        correctAnswer: mientras la esclavitud declinaba en el Caribe británico y EE.UU. (tras 1808-1833), se intensificó en Cuba, Brasil y los estados algodoneros del sur → la segunda esclavitud fue una expansión masiva, no un residuo, ligada al mercado mundial del algodón y el azúcar
        rationale: "El texto: 'Tomich propuso la segunda esclavitud (siglo XIX): cuando la esclavitud declinaba en el Caribe británico y en EE.UU., se intensificó en Cuba, Brasil y los estados algodoneros del sur de EE.UU.'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué factores explican la descolonización de Asia y África entre 1945 y 1975? (que los imperios se disolvieron voluntariamente/la presión de los movimientos de independencia nacionales (Gandhi, Nehru, Nkrumah, Ho Chi Minh); el debilitamiento de las metrópolis europeas tras la Segunda Guerra Mundial; la Guerra Fría: EE.UU. y la URSS apoyaron la descolonización (por razones distintas) lo que presionó a Gran Bretaña y Francia; la ONU y el derecho internacional (Carta de las Naciones Unidas, artículo 1: autodeterminación de los pueblos)/que la descolonización no tuvo factores externos a los países colonizados)"
        correctAnswer: los movimientos de independencia nacionales + el debilitamiento de las metrópolis tras la Segunda Guerra Mundial + la Guerra Fría (EE.UU./URSS presionaron la descolonización) + el derecho internacional (ONU: autodeterminación de los pueblos)
        rationale: "El texto: 'la descolonización (1945-1975): los imperios europeos en Asia y África se desintegraron bajo la presión de los movimientos de independencia y la Guerra Fría'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es el neocolonialismo según Nkrumah y cómo funciona en la práctica? (que el neocolonialismo es solo propaganda antioccidental/Nkrumah (1965): la independencia política formal de las excolonias no implicó la independencia económica → la dependencia persiste a través del comercio desigual (las excolonias siguen exportando materias primas e importando manufactura), la deuda externa (condicionada por el FMI y el Banco Mundial), las inversiones multinacionales y los acuerdos de cooperación que reproducen la dominación colonial/que el neocolonialismo es un fenómeno del pasado)"
        correctAnswer: Nkrumah (1965): la independencia política formal encubre la dependencia económica que persiste a través del comercio desigual, la deuda externa condicionada (FMI, BM), las inversiones multinacionales y los acuerdos de cooperación → la dominación colonial persiste sin soberanía formal
        rationale: "El texto: 'el neocolonialismo (Nkrumah, 1965): la independencia política formal encubre la dependencia económica de las antiguas colonias de las metrópolis a través del comercio, la deuda externa y las inversiones'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo contribuye la historia global a superar el eurocentrismo de la historiografía tradicional? (que la historia global es solo historia de los imperios europeos/la historia global (Bayly, McNeill) estudia las conexiones, circulaciones y comparaciones entre civilizaciones, más allá del Estado-nación y más allá del relato de la modernidad como logro exclusivamente europeo → revela que muchas 'innovaciones europeas' tuvieron precursores o paralelos en Asia, África y América; que el capitalismo moderno se construyó sobre la expropiación global/que la historia global confirma el eurocentrismo)"
        correctAnswer: la historia global estudia conexiones y comparaciones entre civilizaciones más allá del Estado-nación → revela que muchas 'innovaciones europeas' tuvieron precursores en Asia o América; que el capitalismo moderno se construyó sobre la expropiación global → supera el relato de la modernidad como logro exclusivamente europeo
        rationale: "La historia global (Bayly 2004; McNeill 2003; Pomeranz 2000) desafía el eurocentrismo al mostrar que la industrialización y el capitalismo son fenómenos relacionales que involucraron a todo el mundo, no solo el genio europeo."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se relacionan el Middle Passage y las economías de plantación con la modernidad atlántica? (que el Middle Passage no tiene relación con la modernidad/el Middle Passage (10-12 millones de africanos esclavizados) fue el componente humano de la modernidad atlántica: sin el trabajo forzado de los esclavos, las economías de plantación (azúcar, tabaco, algodón) no habrían generado los excedentes que capitalizaron la industrialización europea → el Atlántico como espacio de modernidad, desplazamiento y violencia fundacional/que el comercio atlántico fue independiente de las economías de plantación)"
        correctAnswer: el Middle Passage (10-12 millones de africanos esclavizados) fue el componente humano de la modernidad atlántica: sin el trabajo esclavo, las economías de plantación no habrían generado los excedentes que capitalizaron la industrialización → el Atlántico es el espacio de modernidad y violencia fundacional
        rationale: "El texto: 'el Middle Passage transportó entre 10 y 12 millones de africanos a América → las economías de plantación del azúcar, tabaco y algodón se basaron en el trabajo forzado → Eric Williams: la esclavitud atlántica fue esencial para la acumulación primitiva que financió la Revolución Industrial'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué limitaciones tiene el modelo sistema-mundo de Wallerstein como marco explicativo de la historia global? (que no tiene limitaciones/el sistema-mundo es criticado por: (1) eurocentrismo cronológico: sitúa el origen del capitalismo en Europa en el siglo XVI sin considerar los sistemas-mundo previos (Ibn Khaldun, Abu-Lughod); (2) determinismo estructural: los agentes históricos tienen poco margen de acción → dificulta explicar la movilidad de la semiperiferia; (3) no explica adecuadamente la segunda esclavitud, la Gran Divergencia o la divergencia entre China e India en el siglo XX/que el sistema-mundo es completamente satisfactorio como modelo)"
        correctAnswer: el sistema-mundo es criticado por: eurocentrismo cronológico (ignora sistemas-mundo previos al capitalismo europeo); determinismo estructural (los agentes tienen poco margen); no explica bien la movilidad de la semiperiferia ni fenómenos como la segunda esclavitud o la Gran Divergencia
        rationale: "Las críticas al sistema-mundo de Wallerstein incluyen el trabajo de André Gunder Frank (ReOrient) que señala el eurocentrismo cronológico, y la crítica de los historiadores de la agencia (Bayly, Pomeranz) que muestran que los actores locales tienen más margen del que permite el determinismo estructural."
        difficulty: 5
        objectives: [es.pre_reading]
