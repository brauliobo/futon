title: Lectura - La Historia Global y los Imperios Modernos
level: L
subject: spanish
difficulty: 5
objectives:
  - es.pre_reading
authorNotes: "Texto sobre historia global e imperios: la historia global (Bayly, Pomeranz, McNeill/McNeill); 'la gran divergencia' (Pomeranz): por qué Europa y China tomaron caminos tan distintos a partir de 1800; el sistema-mundo (Wallerstein): centro, periferia, semiperiria; el colonialismo español en América (encomienda, mita, reducciones, mercantilismo, Casa de Contratación); la esclavitud atlántica (Middle Passage, economías de plantación, Código Negro); la segunda esclavitud (Dale Tomich); el imperialismo formal e informal del siglo XIX; las guerras mundiales como fenómeno global; la descolonización de Asia y África; el neocolonialismo y las dependencias postcoloniales."
example: "Lee prestando atención a cómo cada perspectiva historiográfica (historia global, sistema-mundo, dependencia) explica la asimetría económica entre los continentes a partir de la expansión europea."
repeatAll: 2
