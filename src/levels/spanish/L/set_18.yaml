pages:
  - pageNumber: 1
    title: El Texto
    description: "Texto: La neurociencia cognitiva estudia los fundamentos neurales de las funciones mentales. La modularidad de la mente (Fodor, 1983): el cerebro está organizado en módulos encapsulados (sistemas de entrada: visión, lenguaje, etc.) y un sistema central no modular → los módulos son rápidos, automáticos y no accesibles a la cognición central. El paradigma del procesamiento distribuido y paralelo (PDP: Rumelhart/McClelland, 1986): las representaciones mentales son patrones de activación distribuidos sobre redes de unidades simples interconectadas → el aprendizaje es el ajuste de los pesos de las conexiones (Regla delta, backpropagation). El predictive processing (PP: Helmholtz → Friston/Clark): el cerebro es una máquina de predicción que genera constantemente hipótesis (modelo generativo) sobre las causas de los inputs sensoriales → cuando la predicción y el input divergen, se genera un error de predicción que actualiza el modelo generativo → la percepción es inferencia activa: el cerebro construye la percepción a partir de las predicciones, no solo de los inputs. La conciencia de acceso (Ned Block) vs. la conciencia fenoménica: la neurociencia puede explicar la primera (disponibilidad de la información para el procesamiento global) pero enfrenta el problema difícil de Chalmers con la segunda. Dehaene propuso la teoría del espacio de trabajo global (GWT): la conciencia emerge cuando la información se transmite de forma global ('broadcast') por toda la corteza mediante un espacio de trabajo neuronal de amplias interconexiones → la conciencia es información 'en el broadcasting'. Antonio Damasio (El error de Descartes, 1994): las emociones son necesarias para la toma de decisiones racionales → la hipótesis del marcador somático: las decisiones están guiadas por señales somáticas (emocionales) que marcan las opciones → el caso Phineas Gage: daño en la corteza prefrontal ventromedial → incapacidad para tomar decisiones aunque el razonamiento lógico estuviera intacto. La dopamina y el sistema de recompensa (Schultz): la dopamina no codifica el placer sino el error de predicción de la recompensa: se libera cuando ocurre algo mejor de lo esperado (señal de aprendizaje)."
    exercises:
      - type: reading
        question: "¿Qué diferencia hay entre la modularidad de Fodor y el procesamiento distribuido y paralelo (PDP) de Rumelhart/McClelland? (que son teorías equivalentes/Fodor: el cerebro tiene módulos encapsulados (visión, lenguaje) que son rápidos, automáticos y no accesibles a la cognición central; PDP: las representaciones son patrones de activación distribuidos sobre redes de unidades interconectadas → el conocimiento no está en unidades locales sino distribuido en los pesos de las conexiones → el aprendizaje es el ajuste de los pesos mediante backpropagation/que la modularidad de Fodor acepta las redes distribuidas)"
        correctAnswer: Fodor: módulos encapsulados para las entradas sensoriales (visión, lenguaje) → rápidos, automáticos, no accesibles a la cognición central; PDP: representaciones como patrones de activación distribuidos en redes → el conocimiento está en los pesos de las conexiones; el aprendizaje es backpropagation
        rationale: "El texto: 'la modularidad de Fodor: el cerebro está organizado en módulos encapsulados; el PDP: las representaciones son patrones de activación distribuidos sobre redes de unidades simples → el aprendizaje es el ajuste de los pesos de las conexiones'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es el paradigma del predictive processing y cómo reformula el papel del cerebro? (que el cerebro es un receptor pasivo de información sensorial/el cerebro es una máquina de predicción que genera constantemente hipótesis sobre las causas de los inputs sensoriales → cuando la predicción y el input divergen, se genera un error de predicción que actualiza el modelo generativo → la percepción es inferencia activa: el cerebro construye la percepción principalmente desde arriba (predicciones), no solo desde los inputs sensoriales (bottom-up)/que el predictive processing solo aplica a la visión)"
        correctAnswer: el cerebro genera constantemente hipótesis (modelo generativo) sobre las causas de los inputs sensoriales → cuando predicción e input divergen, se genera un error de predicción que actualiza el modelo generativo → la percepción es inferencia activa: el cerebro construye la percepción principalmente desde las predicciones top-down
        rationale: "El texto: 'el predictive processing: el cerebro es una máquina de predicción que genera hipótesis → cuando la predicción y el input divergen, se genera un error de predicción que actualiza el modelo generativo → la percepción es inferencia activa'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es la hipótesis del marcador somático de Damasio y qué aprendemos del caso de Phineas Gage? (que las emociones perjudican la toma de decisiones/las emociones son necesarias para la toma de decisiones racionales: la hipótesis del marcador somático → las decisiones están guiadas por señales somáticas (emocionales) que marcan las opciones con valor positivo o negativo basado en experiencias pasadas → el caso Phineas Gage: daño en la corteza prefrontal ventromedial → incapacidad para tomar decisiones aunque el razonamiento lógico estuviera intacto/que Phineas Gage fue un caso de pérdida de memoria)"
        correctAnswer: las emociones son necesarias para las decisiones racionales → la hipótesis del marcador somático: las decisiones están guiadas por señales somáticas (emocionales) que marcan las opciones basadas en experiencias pasadas → caso Phineas Gage: daño en corteza prefrontal ventromedial → incapacidad decisoria con razonamiento lógico intacto
        rationale: "El texto: 'Damasio: las emociones son necesarias para la toma de decisiones racionales → hipótesis del marcador somático → el caso Phineas Gage: daño en la corteza prefrontal ventromedial → incapacidad para tomar decisiones aunque el razonamiento lógico estuviera intacto'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es la teoría del espacio de trabajo global de Dehaene y cuál es su relación con la conciencia? (que la conciencia es un producto del cerebelo/la conciencia emerge cuando la información se transmite de forma global ('broadcast') por toda la corteza mediante el espacio de trabajo neuronal (una red de neuronas de largo alcance altamente interconectadas) → solo la información que entra en el broadcasting global se vuelve consciente; la información procesada localmente (en módulos) no es consciente → la conciencia es información accesible globalmente/que la conciencia no tiene correlatos neurológicos)"
        correctAnswer: la conciencia emerge cuando la información se transmite de forma global ('broadcast') por toda la corteza mediante el espacio de trabajo neuronal (red de largo alcance altamente interconectada) → solo la información en el broadcasting global se vuelve consciente; el procesamiento local (modular) no es consciente
        rationale: "El texto: 'Dehaene: la conciencia emerge cuando la información se transmite de forma global por toda la corteza mediante un espacio de trabajo neuronal de amplias interconexiones → la conciencia es información en el broadcasting'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué función cumple la dopamina en el sistema de recompensa y por qué es una señal de aprendizaje? (que la dopamina codifica el placer y la felicidad/Schultz: la dopamina no codifica el placer sino el error de predicción de la recompensa: se libera cuando ocurre algo mejor de lo esperado (recompensa mayor de lo predicho) → si la recompensa es igual a lo predicho, no hay liberación adicional de dopamina → si la recompensa es menor de lo esperado, la dopamina disminuye por debajo del nivel base → esto hace de la dopamina una señal de aprendizaje, no de placer/que la dopamina codifica el dolor)"
        correctAnswer: la dopamina no codifica el placer sino el error de predicción de la recompensa → se libera cuando ocurre algo mejor de lo esperado; si la recompensa es igual a lo predicho, no hay liberación adicional; si es menor, la dopamina disminuye → es una señal de aprendizaje (actualiza las predicciones de recompensa)
        rationale: "El texto: 'Schultz: la dopamina no codifica el placer sino el error de predicción de la recompensa: se libera cuando ocurre algo mejor de lo esperado (señal de aprendizaje)'."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo contribuye el sueño a la consolidación de la memoria desde la perspectiva de la neurociencia? (que el sueño no tiene función cognitiva/durante el sueño NREM (ondas lentas): la memoria declarativa (episódica, semántica) se consolida mediante la reactivación de patrones de activación del hipocampo y su transferencia a la corteza neocortical (modelo hipocampal-neocortical de consolidación); durante el sueño REM: las conexiones entre el hipocampo y la amígdala se activan → consolidación de memorias emocionales y creación de asociaciones nuevas → la privación de sueño deteriora la consolidación/que el sueño es incompatible con la consolidación de la memoria)"
        correctAnswer: sueño NREM (ondas lentas): consolidación de la memoria declarativa mediante reactivación de patrones del hipocampo y transferencia a la neocorteza; sueño REM: consolidación de memorias emocionales y creación de nuevas asociaciones → la privación de sueño deteriora la consolidación
        rationale: "El texto: 'el sueño REM vs. ondas lentas' en los sets de K; aquí se desarrolla el modelo hipocampal-neocortical de consolidación (McClelland/McNaughton/O'Reilly 1995): el hipocampo reaplica rápidamente durante el sueño de ondas lentas los patrones de activación del día para transferirlos lentamente a la neocorteza."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué implica la neuroplasticidad para la recuperación después de una lesión cerebral y para el aprendizaje adulto? (que el cerebro adulto no puede modificarse/la neuroplasticidad (capacidad del cerebro para reorganizarse) tiene dos implicaciones: (1) recuperación después de lesiones cerebrales: áreas vecinas pueden asumir las funciones de las dañadas (especialmente en el cerebro joven); (2) aprendizaje adulto: el cerebro adulto puede cambiar estructuralmente con la práctica (mielinización incrementada, sinapsis nuevas, neurogénesis en el hipocampo) → pero la neuroplasticidad tiene límites: más restringida en adultos, especialmente en la corteza primaria/que la neuroplasticidad solo ocurre en la infancia)"
        correctAnswer: la neuroplasticidad permite: (1) recuperación de lesiones cerebrales mediante reorganización (áreas vecinas asumen funciones dañadas, especialmente en cerebro joven); (2) aprendizaje adulto: el cerebro adulto puede cambiar estructuralmente con la práctica → pero la neuroplasticidad tiene límites, más restringida en adultos y corteza primaria
        rationale: "El texto: 'neuroplasticidad hasta 25 años (mielinización)' en los sets anteriores; la neuroplasticidad (Ramachandran, Doidge) es la base tanto de la recuperación post-lesión como de la educación continua; el hipocampo puede generar nuevas neuronas en adultos (neurogénesis adulta)."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Qué es el aprendizaje hebbiano y cómo se implementa en las redes neurales artificiales? (que el aprendizaje hebbiano no está relacionado con las redes artificiales/la regla de Hebb ('Las neuronas que se activan juntas se conectan juntas'): cuando dos neuronas se activan simultáneamente, la fuerza de la conexión sináptica entre ellas aumenta → la LTP (potenciación a largo plazo) es el correlato biológico; en las redes neurales artificiales: el aprendizaje hebbiano se formaliza como la regla delta (ajuste del peso proporcional al error de predicción y al gradiente) y el backpropagation/que el aprendizaje hebbiano no tiene implementación artificial)"
        correctAnswer: la regla de Hebb ('neuronas que se activan juntas se conectan juntas'): la activación simultánea aumenta la fuerza sináptica → la LTP es el correlato biológico; en redes neurales artificiales: se formaliza como la regla delta (ajuste del peso proporcional al error) y el backpropagation
        rationale: "El texto: 'el principio de Hebb: la LTP (potenciación a largo plazo) es el mecanismo de la memoria a largo plazo' (sets anteriores); la regla hebbiana es la base tanto de la plasticidad sináptica biológica como del aprendizaje en redes neurales artificiales."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cuál es la diferencia entre la conciencia de acceso y la conciencia fenoménica de Ned Block y por qué es relevante para la neurociencia? (que son lo mismo/conciencia de acceso: la disponibilidad de la información para el procesamiento cognitivo global (reportabilidad, control del comportamiento) → la neurociencia puede estudiarla con los correlatos neurales del broadcasting global; conciencia fenoménica: el aspecto subjetivo de la experiencia ('qualia', el rojo como rojo para mí) → el problema difícil de Chalmers: ningún estudio neural puede explicar por qué hay algo que es 'ser como ser yo'/que la neurociencia puede explicar la conciencia fenoménica directamente)"
        correctAnswer: conciencia de acceso: disponibilidad de la información para el procesamiento global (reportabilidad, control de comportamiento) → la neurociencia puede estudiarla con el broadcasting global (Dehaene); conciencia fenoménica: el aspecto subjetivo de la experiencia (qualia) → el problema difícil: ningún estudio neural explica por qué hay algo que es 'ser como ser yo'
        rationale: "Block (1995): la distinción acceso/fenoménica es crucial para la neurociencia de la conciencia; la neurociencia puede abordar la conciencia de acceso (correlatos neurales del espacio de trabajo global) pero enfrenta el problema difícil de Chalmers con la conciencia fenoménica."
        difficulty: 5
        objectives: [es.pre_reading]
      - type: reading
        question: "¿Cómo se relacionan el modelo generativo y la inferencia activa en el predictive processing con la percepción de ilusiones perceptivas? (que las ilusiones perceptivas son errores del sistema visual/en el PP, las ilusiones perceptivas ocurren cuando el modelo generativo del cerebro prima las predicciones sobre el input sensorial → el cerebro 've' lo que predice más que lo que recibe → en la ilusión de Müller-Lyer, el cerebro aplica predicciones sobre perspectiva (líneas iguales pero con diferentes contextos de profundidad) → las ilusiones son evidencia de que la percepción es una constructividad guiada por el modelo generativo/que las ilusiones perceptivas demuestran que el predictive processing es falso)"
        correctAnswer: en el PP, las ilusiones perceptivas ocurren cuando el modelo generativo prima las predicciones sobre el input sensorial → el cerebro 've' lo que predice más que lo que recibe; en Müller-Lyer, el cerebro aplica predicciones de perspectiva a líneas iguales → las ilusiones son evidencia de que la percepción es construcción guiada por el modelo generativo
        rationale: "El predictive processing (Clark 2016; Friston 2010) explica las ilusiones perceptivas como casos donde el modelo generativo se resiste a la actualización incluso ante evidencia contraria; esto apoya la idea de que la percepción es principalmente una función del modelo generativo (top-down), no del input (bottom-up)."
        difficulty: 5
        objectives: [es.pre_reading]
