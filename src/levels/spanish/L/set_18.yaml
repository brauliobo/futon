authorNotes: "Texto sobre neurociencia cognitiva avanzada: la arquitectura modular del cerebro (Fodor) vs. el procesamiento distribuido y paralelo (PDP: Rumelhart/McClelland); las redes neurales artificiales y biológicas; la teoría predictive processing (Clark/Friston): el cerebro como máquina de predicción (error de predicción, modelo generativo, inferencia activa); la conciencia desde la neurociencia (teoría del workspace global, Dehaene; teoría de la información integrada, Tononi); las emociones y la toma de decisiones (Damasio: hipótesis del marcador somático, caso Phineas Gage); neuroplasticidad; dopamina y el sistema de recompensa; Hebbian learning; el sueño y la consolidación de la memoria."
example: "modularidad Fodor (módulos encapsulados) vs. PDP (patrones distribuidos/backpropagation) → predictive processing: cerebro genera hipótesis (modelo generativo) → error de predicción → actualiza modelo → percepción = inferencia activa → ilusiones: evidencia del PP → Dehaene: conciencia = broadcasting global → Damasio: marcador somático → dopamina: señal de aprendizaje (no placer)."
