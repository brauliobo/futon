    title: Na forma modificadora (＋な＋substantivo)
    description: Escolha a forma correta.
    exercises:
      - { type: japanese_vocab, question: "Flor bonita: (きれいな花/きれい花/きれいの花/きれいい花)", correctAnswer: "きれいな花", rationale: "\"Flor bonita:\" em japonês escreve-se きれいな花.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Quarto tranquilo: (静かな部屋/静か部屋/静かの部屋/静かい部屋)", correctAnswer: "静かな部屋", rationale: "\"Quarto tranquilo:\" em japonês escreve-se 静かな部屋.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Pessoa gentil: (親切な人/親切人/親切の人/親切い人)", correctAnswer: "親切な人", rationale: "\"Pessoa gentil:\" em japonês escreve-se 親切な人.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Cantor famoso: (有名な歌手/有名歌手/有名の歌手/有名い歌手)", correctAnswer: "有名な歌手", rationale: "\"Cantor famoso:\" em japonês escreve-se 有名な歌手.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Loja conveniente: (便利な店/便利店/便利の店/便利い店)", correctAnswer: "便利な店", rationale: "\"Loja conveniente:\" em japonês escreve-se 便利な店.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Pergunta simples: (簡単な質問/簡単質問/簡単の質問/簡単い質問)", correctAnswer: "簡単な質問", rationale: "\"Pergunta simples:\" em japonês escreve-se 簡単な質問.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Amigo querido: (大切な友だち/大切友だち/大切の友だち/大切い友だち)", correctAnswer: "大切な友だち", rationale: "\"Amigo querido:\" em japonês escreve-se 大切な友だち.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Pessoa enérgica: (元気な人/元気人/元気の人/元気い人)", correctAnswer: "元気な人", rationale: "\"Pessoa enérgica:\" em japonês escreve-se 元気な人.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Comida preferida: (好きな食べ物/好き食べ物/好きい食べ物/好きだ食べ物)", correctAnswer: "好きな食べ物", rationale: "\"Comida preferida:\" em japonês escreve-se 好きな食べ物.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Coisa odiada: (嫌いなこと/嫌いこと/嫌いのこと/嫌いいこと)", correctAnswer: "嫌いなこと", rationale: "\"Coisa odiada:\" em japonês escreve-se 嫌いなこと.", difficulty: 4, objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases com adjetivos-な
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "この花はきれいです。 (Esta flor é bonita./Esta flor é feia./Aquela flor é bonita./Tenho uma flor.)", correctAnswer: "Esta flor é bonita.", rationale: "O kanji この花はきれいです。 significa \"Esta flor é bonita.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "図書館は静かです。 (A biblioteca é silenciosa./A biblioteca é barulhenta./A escola é silenciosa./Estou na biblioteca.)", correctAnswer: "A biblioteca é silenciosa.", rationale: "O kanji 図書館は静かです。 significa \"A biblioteca é silenciosa.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "彼は親切な人です。 (Ele é uma pessoa gentil./Ele é rude./Ela é gentil./Meus pais são gentis.)", correctAnswer: "Ele é uma pessoa gentil.", rationale: "O kanji 彼は親切な人です。 significa \"Ele é uma pessoa gentil.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語が好きです。 (Gosto de japonês./Odeio japonês./Aprendo japonês./Não sei japonês.)", correctAnswer: "Gosto de japonês.", rationale: "O kanji 日本語が好きです。 significa \"Gosto de japonês.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "お元気ですか。 (Como você está?/Onde você está?/Quem é você?/Que horas são?)", correctAnswer: "Como você está?", rationale: "O kanji お元気ですか。 significa \"Como você está?\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "このレストランは有名です。 (Este restaurante é famoso./Este restaurante é novo./Este restaurante é caro./Este restaurante é barato.)", correctAnswer: "Este restaurante é famoso.", rationale: "O kanji このレストランは有名です。 significa \"Este restaurante é famoso.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "スマホは便利です。 (Smartphone é conveniente./Smartphone é caro./Smartphone é inútil./Preciso de smartphone.)", correctAnswer: "Smartphone é conveniente.", rationale: "O kanji スマホは便利です。 significa \"Smartphone é conveniente.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "テストは簡単でした。 (A prova foi simples./A prova foi difícil./A prova foi longa./A prova foi ontem.)", correctAnswer: "A prova foi simples.", rationale: "O kanji テストは簡単でした。 significa \"A prova foi simples.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "家族は大切です。 (A família é importante./A família é grande./A família é pequena./A família está bem.)", correctAnswer: "A família é importante.", rationale: "O kanji 家族は大切です。 significa \"A família é importante.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "魚が嫌いです。 (Odeio peixe./Gosto de peixe./Tenho peixe./Como peixe.)", correctAnswer: "Odeio peixe.", rationale: "O kanji 魚が嫌いです。 significa \"Odeio peixe.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
target: 30
