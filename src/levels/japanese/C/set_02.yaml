    exercises:
      - { type: japanese_vocab, question: "きれい (bonito/feio/sujo/limpo — refere-se a) (bonito ou limpo/só feio/só sujo/só alto)", correctAnswer: "bonito ou limpo", rationale: "A frase \"きれい (bonito/feio/sujo/limpo — refere-se a)\" traduz-se como \"bonito ou limpo\". Identifique partículas e palavras-chave.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "静か (tranquilo/barulhento/alto/baixo)", correctAnswer: "tranquilo", rationale: "O kanji 静か significa \"tranquilo\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "元気 (enérgico/cansado/doente/triste)", correctAnswer: "enérgico", rationale: "O kanji 元気 significa \"enérgico\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "親切 (gentil/rude/frio/quente)", correctAnswer: "gentil", rationale: "O kanji 親切 significa \"gentil\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "有名 (famoso/desconhecido/conhecido/novo)", correctAnswer: "famoso", rationale: "O kanji 有名 significa \"famoso\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "便利 (conveniente/inconveniente/difícil/fácil)", correctAnswer: "conveniente", rationale: "O kanji 便利 significa \"conveniente\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "簡単 (simples/complicado/difícil/longo)", correctAnswer: "simples", rationale: "O kanji 簡単 significa \"simples\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大切 (importante/sem importância/pequeno/grande)", correctAnswer: "importante", rationale: "O kanji 大切 significa \"importante\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "好き (gostar/odiar/indiferente/querer)", correctAnswer: "gostar", rationale: "O kanji 好き significa \"gostar\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "嫌い (odiar/gostar/indiferente/querer)", correctAnswer: "odiar", rationale: "O kanji 嫌い significa \"odiar\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
