      - { type: japanese_vocab, question: "りんごを三つください。 (Três maçãs, por favor./Duas maçãs./Quatro maçãs./Uma maçã.)", correctAnswer: "Três maçãs, por favor.", rationale: "O kanji りんごを三つください。 significa \"Três maçãs, por favor.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
