title: Contadores — 一つ 二人 三時 四枚 五本
level: 'C'
subject: japanese
authorNotes: "Contadores — 一つ 二人 三時 四枚 五本. Foque no conceito central do conjunto e nos erros comuns."
example: "Japonês usa contadores: 二人 (2 pessoas), 三本 (3 objetos finos), 四枚 (4 folhas)"
pages:
  - pageNumber: 1
    title: Contadores básicos
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "一つ (1 coisa/1 pessoa/1 hora/1 folha)", correctAnswer: "1 coisa" }
      - { type: japanese_vocab, question: "二つ (2 coisas/2 pessoas/2 horas/2 folhas)", correctAnswer: "2 coisas" }
      - { type: japanese_vocab, question: "三つ (3 coisas/3 pessoas/3 horas/3 folhas)", correctAnswer: "3 coisas" }
      - { type: japanese_vocab, question: "一人 (1 pessoa/1 coisa/1 hora/1 folha)", correctAnswer: "1 pessoa" }
      - { type: japanese_vocab, question: "二人 (2 pessoas/2 coisas/2 horas/2 folhas)", correctAnswer: "2 pessoas" }
      - { type: japanese_vocab, question: "三人 (3 pessoas/3 coisas/3 horas/3 folhas)", correctAnswer: "3 pessoas" }
      - { type: japanese_vocab, question: "一時 (1 hora/1 pessoa/1 coisa/1 folha)", correctAnswer: "1 hora" }
      - { type: japanese_vocab, question: "二時 (2 horas/2 pessoas/2 coisas/2 folhas)", correctAnswer: "2 horas" }
      - { type: japanese_vocab, question: "十時 (10 horas/10 pessoas/10 coisas/10 folhas)", correctAnswer: "10 horas" }
      - { type: japanese_vocab, question: "何人 (quantas pessoas/quantos/que horas/quantas folhas)", correctAnswer: "quantas pessoas" }
  - pageNumber: 2
    title: Contadores específicos
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "一本 (1 objeto fino — caneta/1 coisa/1 folha/1 pessoa)", correctAnswer: "1 objeto fino — caneta" }
      - { type: japanese_vocab, question: "二本 (2 objetos finos/2 coisas/2 folhas/2 pessoas)", correctAnswer: "2 objetos finos" }
      - { type: japanese_vocab, question: "一枚 (1 folha — plano/1 objeto fino/1 pessoa/1 coisa)", correctAnswer: "1 folha — plano" }
      - { type: japanese_vocab, question: "二枚 (2 folhas/2 objetos finos/2 pessoas/2 coisas)", correctAnswer: "2 folhas" }
      - { type: japanese_vocab, question: "一匹 (1 animal pequeno/1 objeto fino/1 folha/1 pessoa)", correctAnswer: "1 animal pequeno" }
      - { type: japanese_vocab, question: "二匹 (2 animais pequenos/2 folhas/2 pessoas/2 coisas)", correctAnswer: "2 animais pequenos" }
      - { type: japanese_vocab, question: "一台 (1 máquina/1 coisa/1 folha/1 pessoa)", correctAnswer: "1 máquina" }
      - { type: japanese_vocab, question: "一回 (1 vez/1 coisa/1 folha/1 pessoa)", correctAnswer: "1 vez" }
      - { type: japanese_vocab, question: "一つ目 (primeiro/segundo/terceiro/último)", correctAnswer: "primeiro" }
      - { type: japanese_vocab, question: "いくつ (quantas coisas/quantas pessoas/quantos objetos finos/quantas vezes)", correctAnswer: "quantas coisas" }
  - pageNumber: 3
    title: Frases com contadores
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "りんごを三つください。 (Três maçãs, por favor./Duas maçãs./Quatro maçãs./Uma maçã.)", correctAnswer: "Três maçãs, por favor." }
      - { type: japanese_vocab, question: "学生が五人います。 (Tem cinco estudantes./Tem cinco professores./Tem cinco coisas./Tem cinco folhas.)", correctAnswer: "Tem cinco estudantes." }
      - { type: japanese_vocab, question: "今何時ですか。 (Que horas são?/Quantos estudantes?/Onde é?/O que é?)", correctAnswer: "Que horas são?" }
      - { type: japanese_vocab, question: "七時三十分です。 (São 7h30./São 7h13./São 7h03./São 17h30.)", correctAnswer: "São 7h30." }
      - { type: japanese_vocab, question: "ペンを二本買いました。 (Comprei duas canetas./Comprei duas folhas./Comprei duas maçãs./Comprei duas pessoas.)", correctAnswer: "Comprei duas canetas." }
      - { type: japanese_vocab, question: "切符を一枚ください。 (Uma passagem, por favor./Uma caneta, por favor./Uma pessoa, por favor./Uma hora, por favor.)", correctAnswer: "Uma passagem, por favor." }
      - { type: japanese_vocab, question: "犬が三匹います。 (Tem três cachorros./Tem três pessoas./Tem três canetas./Tem três horas.)", correctAnswer: "Tem três cachorros." }
      - { type: japanese_vocab, question: "家族は四人です。 (Minha família tem quatro pessoas./Minha família tem quatro animais./Minha família tem quatro casas./Minha família tem quatro horas.)", correctAnswer: "Minha família tem quatro pessoas." }
      - { type: japanese_vocab, question: "何人いますか。 (Quantas pessoas tem?/Quantas coisas tem?/Que horas são?/Quantos animais tem?)", correctAnswer: "Quantas pessoas tem?" }
      - { type: japanese_vocab, question: "本を一冊読みました。 (Li um livro./Li dois livros./Comprei um livro./Escrevi um livro.)", correctAnswer: "Li um livro." }
