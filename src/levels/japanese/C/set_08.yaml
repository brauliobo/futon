      - { type: japanese_vocab, question: "切符を一枚ください。 (Uma passagem, por favor./Uma caneta, por favor./Uma pessoa, por favor./Uma hora, por favor.)", correctAnswer: "Uma passagem, por favor.", rationale: "O kanji 切符を一枚ください。 significa \"Uma passagem, por favor.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "犬が三匹います。 (Tem três cachorros./Tem três pessoas./Tem três canetas./Tem três horas.)", correctAnswer: "Tem três cachorros.", rationale: "O kanji 犬が三匹います。 significa \"Tem três cachorros.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "家族は四人です。 (Minha família tem quatro pessoas./Minha família tem quatro animais./Minha família tem quatro casas./Minha família tem quatro horas.)", correctAnswer: "Minha família tem quatro pessoas.", rationale: "O kanji 家族は四人です。 significa \"Minha família tem quatro pessoas.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "何人いますか。 (Quantas pessoas tem?/Quantas coisas tem?/Que horas são?/Quantos animais tem?)", correctAnswer: "Quantas pessoas tem?", rationale: "O kanji 何人いますか。 significa \"Quantas pessoas tem?\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "本を一冊読みました。 (Li um livro./Li dois livros./Comprei um livro./Escrevi um livro.)", correctAnswer: "Li um livro.", rationale: "O kanji 本を一冊読みました。 significa \"Li um livro.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
