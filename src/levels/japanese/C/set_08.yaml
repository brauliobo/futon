      - { type: japanese_vocab, question: "今何時ですか。 (Que horas são?/Quantos estudantes?/Onde é?/O que é?)", correctAnswer: "Que horas são?", rationale: "O kanji 今何時ですか。 significa \"Que horas são?\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "七時三十分です。 (São 7h30./São 7h13./São 7h03./São 17h30.)", correctAnswer: "São 7h30.", rationale: "O kanji 七時三十分です。 significa \"São 7h30.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
