title: 💬 Permissão — ～てもいいですか？
level: 'C'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～てもいいですか？ pede permissão: Posso fazer ~? Resposta: はい、～てもいいです / いいえ、～てはいけません."
example: "Para pedir permissão, use forma て + もいいですか？ Ex.: 入ってもいいですか？ → Posso entrar?"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Pedidos de permissão
    description: Escolha a tradução correta para cada pedido de permissão.
    exercises:
      - { type: japanese_vocab, question: "入ってもいいですか？ (Posso entrar?/Você pode entrar./Pode entrar!/Não pode entrar.)", correctAnswer: "Posso entrar?", rationale: "入って (forma て de 入る) + もいいですか = posso entrar?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "写真を撮ってもいいですか？ (Posso tirar uma foto?/Você pode tirar uma foto./Tire uma foto!/Não tire uma foto.)", correctAnswer: "Posso tirar uma foto?", rationale: "撮って (forma て de 撮る) + もいいですか = posso tirar foto?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "窓を開けてもいいですか？ (Posso abrir a janela?/Você pode abrir./Abra a janela!/Não abra.)", correctAnswer: "Posso abrir a janela?", rationale: "開けて (forma て de 開ける) + もいいですか = posso abrir?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "座ってもいいですか？ (Posso sentar?/Você pode sentar./Sente!/Não sente.)", correctAnswer: "Posso sentar?", rationale: "座って (forma て de 座る) + もいいですか = posso sentar?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これを食べてもいいですか？ (Posso comer isso?/Você pode comer./Come isso!/Não come isso.)", correctAnswer: "Posso comer isso?", rationale: "食べて (forma て de 食べる) + もいいですか = posso comer isso?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電話してもいいですか？ (Posso telefonar?/Você pode telefonar./Telefone!/Não telefone.)", correctAnswer: "Posso telefonar?", rationale: "電話して (forma て de 電話する) + もいいですか = posso telefonar?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "帰ってもいいですか？ (Posso ir embora?/Você pode ir embora./Vá embora!/Não vá embora.)", correctAnswer: "Posso ir embora?", rationale: "帰って (forma て de 帰る) + もいいですか = posso ir embora?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ここで待ってもいいですか？ (Posso esperar aqui?/Você pode esperar./Espere aqui!/Não espere aqui.)", correctAnswer: "Posso esperar aqui?", rationale: "待って (forma て de 待つ) + もいいですか = posso esperar aqui?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ドアを閉めてもいいですか？ (Posso fechar a porta?/Você pode fechar./Feche a porta!/Não feche.)", correctAnswer: "Posso fechar a porta?", rationale: "閉めて (forma て de 閉める) + もいいですか = posso fechar a porta?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "トイレに行ってもいいですか？ (Posso ir ao banheiro?/Você pode ir./Vá ao banheiro!/Não vá.)", correctAnswer: "Posso ir ao banheiro?", rationale: "行って (forma て de 行く) + もいいですか = posso ir ao banheiro?", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Respostas e diálogos com permissão
    description: Escolha a resposta ou a parte correta do diálogo.
    exercises:
      - { type: japanese_vocab, question: "A: 入ってもいいですか？ B: はい、___ (入ってもいいです。/入ってはいけません。/入ります。/入りません。)", correctAnswer: "入ってもいいです。", rationale: "Permissão concedida: はい、入ってもいいです = sim, pode entrar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 窓を開けてもいいですか？ B: いいえ、___ (開けてはいけません。/開けてもいいです。/開けます。/開けましたか？)", correctAnswer: "開けてはいけません。", rationale: "Permissão negada: いいえ、開けてはいけません = não, não pode abrir.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 写真を撮ってもいいですか？ B: すみません、___ (撮ってはいけません。/撮ってもいいです。/撮ります。/撮りましたか？)", correctAnswer: "撮ってはいけません。", rationale: "Proibição educada: すみません、撮ってはいけません = desculpe, não pode tirar foto.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: ここで食べてもいいですか？ B: はい、もちろん___ (食べてもいいです。/食べてはいけません。/食べません。/食べましたか？)", correctAnswer: "食べてもいいです。", rationale: "もちろん = claro. Permissão concedida: 食べてもいいです.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生、トイレに___もいいですか？ (行って/行き/行った/行く)", correctAnswer: "行って", rationale: "行って + もいいですか = posso ir ao banheiro? Forma て necessária.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これを___もいいですか？ (使って/使い/使った/使う)", correctAnswer: "使って", rationale: "使う → 使って + もいいですか = posso usar isso?", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ここに___もいいですか？ (座って/座り/座った/座る)", correctAnswer: "座って", rationale: "座る → 座って + もいいですか = posso sentar aqui?", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ドアを___もいいですか？ (開けて/開け/開けた/開ける)", correctAnswer: "開けて", rationale: "開ける → 開けて + もいいですか = posso abrir a porta?", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 帰ってもいいですか？ B: はい、___ (帰ってもいいです。/帰ってはいけません。/帰ります。/帰りましたか？)", correctAnswer: "帰ってもいいです。", rationale: "Permissão para ir embora: はい、帰ってもいいです.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 音楽を聞いてもいいですか？ B: いいえ、___ (聞いてはいけません。/聞いてもいいです。/聞きます。/聞きましたか？)", correctAnswer: "聞いてはいけません。", rationale: "Proibição: いいえ、聞いてはいけません = não, não pode ouvir música.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
