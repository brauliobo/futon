      - { type: japanese_vocab, question: "安かった (vai ser barato/não é barato/é barato/foi barato)", correctAnswer: "foi barato", rationale: "O kanji 安かった significa \"foi barato\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "よかった (foi bom — que bom!/vai ser bom/é bom/não é bom)", correctAnswer: "foi bom — que bom!", rationale: "よかった (hiragana) significa \"foi bom — que bom!\" em português.", difficulty: 4, objectives: [japanese.vocab] }
