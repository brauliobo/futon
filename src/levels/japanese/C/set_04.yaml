title: Passado dos adjetivos-い — ～かった
level: 'C'
subject: japanese
difficulty: 4
authorNotes: "Passado dos adjetivos-い — ～かった. Foque no conceito central do conjunto e nos erros comuns."
example: "大きい → 大きかった (era grande). 小さかった (era pequeno)"
pages:
  - pageNumber: 1
    title: Adjetivos-い no passado
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "大きかった (era grande/é grande/vai ser grande/não é grande)", correctAnswer: "era grande", rationale: "O kanji 大きかった significa \"era grande\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "小さかった (era pequeno/é pequeno/vai ser pequeno/não é pequeno)", correctAnswer: "era pequeno", rationale: "O kanji 小さかった significa \"era pequeno\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "楽しかった (foi divertido/é divertido/vai ser divertido/não é divertido)", correctAnswer: "foi divertido", rationale: "O kanji 楽しかった significa \"foi divertido\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "おいしかった (foi gostoso/é gostoso/vai ser gostoso/não é gostoso)", correctAnswer: "foi gostoso" }
      - { type: japanese_vocab, question: "暑かった (fez calor/está quente/vai esquentar/não está quente)", correctAnswer: "fez calor", rationale: "O kanji 暑かった significa \"fez calor\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "寒かった (fez frio/está frio/vai esfriar/não está frio)", correctAnswer: "fez frio", rationale: "O kanji 寒かった significa \"fez frio\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "忙しかった (estava ocupado/estou ocupado/vou estar ocupado/não estou ocupado)", correctAnswer: "estava ocupado", rationale: "O kanji 忙しかった significa \"estava ocupado\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "難しかった (foi difícil/é difícil/vai ser difícil/não é difícil)", correctAnswer: "foi difícil", rationale: "O kanji 難しかった significa \"foi difícil\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "安かった (foi barato/é barato/vai ser barato/não é barato)", correctAnswer: "foi barato", rationale: "O kanji 安かった significa \"foi barato\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "よかった (foi bom — que bom!/é bom/vai ser bom/não é bom)", correctAnswer: "foi bom — que bom!" }
  - pageNumber: 2
    title: Negativo passado ～くなかった
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "大きくなかった (não era grande/era grande/é grande/não é grande)", correctAnswer: "não era grande", rationale: "O kanji 大きくなかった significa \"não era grande\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "楽しくなかった (não foi divertido/foi divertido/é divertido/não é divertido)", correctAnswer: "não foi divertido", rationale: "O kanji 楽しくなかった significa \"não foi divertido\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "おいしくなかった (não foi gostoso/foi gostoso/é gostoso/não é gostoso)", correctAnswer: "não foi gostoso" }
      - { type: japanese_vocab, question: "寒くなかった (não fez frio/fez frio/está frio/não está frio)", correctAnswer: "não fez frio", rationale: "O kanji 寒くなかった significa \"não fez frio\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "難しくなかった (não foi difícil/foi difícil/é difícil/não é difícil)", correctAnswer: "não foi difícil", rationale: "O kanji 難しくなかった significa \"não foi difícil\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "高くなかった (não foi caro/foi caro/é caro/não é caro)", correctAnswer: "não foi caro", rationale: "O kanji 高くなかった significa \"não foi caro\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "忙しくなかった (não estava ocupado/estava ocupado/estou ocupado/não estou ocupado)", correctAnswer: "não estava ocupado", rationale: "O kanji 忙しくなかった significa \"não estava ocupado\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "よくなかった (não foi bom/foi bom/é bom/não é bom)", correctAnswer: "não foi bom" }
      - { type: japanese_vocab, question: "速くなかった (não foi rápido/foi rápido/é rápido/não é rápido)", correctAnswer: "não foi rápido", rationale: "O kanji 速くなかった significa \"não foi rápido\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "新しくなかった (não era novo/era novo/é novo/não é novo)", correctAnswer: "não era novo", rationale: "O kanji 新しくなかった significa \"não era novo\". Observe o desenho como pista visual." }
  - pageNumber: 3
    title: Frases com adjetivos no passado
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "昨日は暑かったです。 (Ontem fez calor./Hoje faz calor./Ontem fez frio./Amanhã fará calor.)", correctAnswer: "Ontem fez calor.", rationale: "O kanji 昨日は暑かったです。 significa \"Ontem fez calor.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "映画は面白かった。 (O filme foi interessante./O filme é interessante./O filme será interessante./O filme foi chato.)", correctAnswer: "O filme foi interessante.", rationale: "O kanji 映画は面白かった。 significa \"O filme foi interessante.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "料理はおいしかったです。 (A comida foi gostosa./A comida é gostosa./A comida será gostosa./A comida foi ruim.)", correctAnswer: "A comida foi gostosa.", rationale: "O kanji 料理はおいしかったです。 significa \"A comida foi gostosa.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "テストは難しくなかった。 (A prova não foi difícil./A prova foi difícil./A prova é difícil./A prova será difícil.)", correctAnswer: "A prova não foi difícil.", rationale: "O kanji テストは難しくなかった。 significa \"A prova não foi difícil.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "先週は忙しかった。 (Semana passada estava ocupado./Esta semana estou ocupado./Semana que vem estarei ocupado./Não estou ocupado.)", correctAnswer: "Semana passada estava ocupado.", rationale: "O kanji 先週は忙しかった。 significa \"Semana passada estava ocupado.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "旅行は楽しかったです。 (A viagem foi divertida./A viagem é divertida./A viagem será divertida./A viagem foi cansativa.)", correctAnswer: "A viagem foi divertida.", rationale: "O kanji 旅行は楽しかったです。 significa \"A viagem foi divertida.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "その本は古かった。 (Esse livro era velho./Esse livro é velho./Esse livro é novo./Esse livro era novo.)", correctAnswer: "Esse livro era velho.", rationale: "O kanji その本は古かった。 significa \"Esse livro era velho.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "昨日は寒くなかったです。 (Ontem não fez frio./Ontem fez frio./Hoje não faz frio./Amanhã não fará frio.)", correctAnswer: "Ontem não fez frio.", rationale: "O kanji 昨日は寒くなかったです。 significa \"Ontem não fez frio.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "夏休みはよかった。 (As férias de verão foram boas./As férias de verão são boas./As férias de verão serão boas./As férias foram ruins.)", correctAnswer: "As férias de verão foram boas.", rationale: "O kanji 夏休みはよかった。 significa \"As férias de verão foram boas.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "ホテルの部屋は広かった。 (O quarto do hotel era amplo./O quarto do hotel é amplo./O quarto era estreito./O quarto é estreito.)", correctAnswer: "O quarto do hotel era amplo.", rationale: "O kanji ホテルの部屋は広かった。 significa \"O quarto do hotel era amplo.\". Observe o desenho como pista visual." }
target: 30
