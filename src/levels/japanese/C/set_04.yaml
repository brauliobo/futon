      - { type: japanese_vocab, question: "大きかった (era grande/vai ser grande/não é grande/é grande)", correctAnswer: "era grande", rationale: "O kanji 大きかった significa \"era grande\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
