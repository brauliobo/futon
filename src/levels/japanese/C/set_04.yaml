  - pageNumber: 3
    title: Frases com adjetivos no passado
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "昨日は暑かったです。 (Amanhã fará calor./Ontem fez calor./Hoje faz calor./Ontem fez frio.)", correctAnswer: "Ontem fez calor.", rationale: "O kanji 昨日は暑かったです。 significa \"Ontem fez calor.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "映画は面白かった。 (O filme será interessante./O filme foi chato./O filme é interessante./O filme foi interessante.)", correctAnswer: "O filme foi interessante.", rationale: "O kanji 映画は面白かった。 significa \"O filme foi interessante.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "料理はおいしかったです。 (A comida é gostosa./A comida foi gostosa./A comida foi ruim./A comida será gostosa.)", correctAnswer: "A comida foi gostosa.", rationale: "O kanji 料理はおいしかったです。 significa \"A comida foi gostosa.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "テストは難しくなかった。 (A prova foi difícil./A prova não foi difícil./A prova será difícil./A prova é difícil.)", correctAnswer: "A prova não foi difícil.", rationale: "O kanji テストは難しくなかった。 significa \"A prova não foi difícil.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "先週は忙しかった。 (Semana passada estava ocupado./Não estou ocupado./Semana que vem estarei ocupado./Esta semana estou ocupado.)", correctAnswer: "Semana passada estava ocupado.", rationale: "O kanji 先週は忙しかった。 significa \"Semana passada estava ocupado.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "旅行は楽しかったです。 (A viagem foi divertida./A viagem é divertida./A viagem será divertida./A viagem foi cansativa.)", correctAnswer: "A viagem foi divertida.", rationale: "O kanji 旅行は楽しかったです。 significa \"A viagem foi divertida.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "その本は古かった。 (Esse livro é novo./Esse livro é velho./Esse livro era velho./Esse livro era novo.)", correctAnswer: "Esse livro era velho.", rationale: "O kanji その本は古かった。 significa \"Esse livro era velho.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "昨日は寒くなかったです。 (Ontem fez frio./Ontem não fez frio./Amanhã não fará frio./Hoje não faz frio.)", correctAnswer: "Ontem não fez frio.", rationale: "O kanji 昨日は寒くなかったです。 significa \"Ontem não fez frio.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "夏休みはよかった。 (As férias de verão foram boas./As férias de verão serão boas./As férias de verão são boas./As férias foram ruins.)", correctAnswer: "As férias de verão foram boas.", rationale: "O kanji 夏休みはよかった。 significa \"As férias de verão foram boas.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ホテルの部屋は広かった。 (O quarto do hotel é amplo./O quarto é estreito./O quarto do hotel era amplo./O quarto era estreito.)", correctAnswer: "O quarto do hotel era amplo.", rationale: "O kanji ホテルの部屋は広かった。 significa \"O quarto do hotel era amplo.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
