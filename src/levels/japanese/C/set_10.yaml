title: 📝 Avaliação final C — JLPT N5 completo
level: 'C'
subject: japanese
objectives: [japanese.vocab]
difficulty: 5
authorNotes: "Avaliação final C — JLPT N5 completo. Foque no conceito central do conjunto e nos erros comuns."
example: "Parabéns! Você atingiu o nível JLPT N5 — ~240 kanji, ~800 palavras, frases completas. Ex.: 私は昨日友だちと映画を見ました。 → Vi um filme com amigo ontem.."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Leitura — texto curto
    description: Leia a frase e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "私は昨日友だちと映画を見ました。 (Vi um filme com amigo ontem./Gosto de filmes com amigos./Meu amigo viu um filme./Vou ver um filme com amigo.)", correctAnswer: "Vi um filme com amigo ontem.", rationale: "O kanji 私は昨日友だちと映画を見ました。 significa \"Vi um filme com amigo ontem.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "来週日本へ旅行に行きます。 (Semana que vem vou viajar para o Japão./Não viajo./Viajo todo mês./Semana passada fui.)", correctAnswer: "Semana que vem vou viajar para o Japão.", rationale: "O kanji 来週日本へ旅行に行きます。 significa \"Semana que vem vou viajar para o Japão.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "毎朝六時に起きて、コーヒーを飲みます。 (Bebo café./Acordo às 6h e como./Toda manhã acordo às 6h e bebo café./Acordo às 7h.)", correctAnswer: "Toda manhã acordo às 6h e bebo café.", rationale: "O kanji 毎朝六時に起きて、コーヒーを飲みます。 significa \"Toda manhã acordo às 6h e bebo café.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語の勉強は楽しいです。 (Japonês é difícil./Gosto de japonês./Estudar japonês é chato./Estudar japonês é divertido.)", correctAnswer: "Estudar japonês é divertido.", rationale: "O kanji 日本語の勉強は楽しいです。 significa \"Estudar japonês é divertido.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私の家族は五人で、犬が一匹います。 (5 pessoas e 1 gato./5 cachorros./Minha família tem 5 pessoas e 1 cachorro./5 pessoas só.)", correctAnswer: "Minha família tem 5 pessoas e 1 cachorro.", rationale: "O kanji 私の家族は五人で、犬が一匹います。 significa \"Minha família tem 5 pessoas e 1 cachorro.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "昨日は雨でしたが、今日は晴れです。 (Ontem fez sol./Está chovendo há dois dias./Hoje chove./Ontem choveu, mas hoje está ensolarado.)", correctAnswer: "Ontem choveu, mas hoje está ensolarado.", rationale: "O kanji 昨日は雨でしたが、今日は晴れです。 significa \"Ontem choveu, mas hoje está ensolarado.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "土曜日の朝、公園で走ります。 (Domingo./Estudo sábado./Sábado de manhã, corro no parque./Trabalho sábado.)", correctAnswer: "Sábado de manhã, corro no parque.", rationale: "O kanji 土曜日の朝、公園で走ります。 significa \"Sábado de manhã, corro no parque.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "東京は大きくて、人が多いです。 (Tóquio é pequena./Tóquio é tranquila./Tóquio tem poucas pessoas./Tóquio é grande e tem muitas pessoas.)", correctAnswer: "Tóquio é grande e tem muitas pessoas.", rationale: "O kanji 東京は大きくて、人が多いです。 significa \"Tóquio é grande e tem muitas pessoas.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本の食べ物はおいしいです。 (Comida japonesa é ruim./Comida brasileira é gostosa./Gosto de comida japonesa./Comida japonesa é gostosa.)", correctAnswer: "Comida japonesa é gostosa.", rationale: "O kanji 日本の食べ物はおいしいです。 significa \"Comida japonesa é gostosa.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "すみません、駅はどこですか。 (Desculpa, onde fica a estação?/Desculpa, onde está a loja?/Onde mora?/Quem é você?)", correctAnswer: "Desculpa, onde fica a estação?", rationale: "O kanji すみません、駅はどこですか。 significa \"Desculpa, onde fica a estação?\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Gramática — tempos verbais
    description: Escolha a forma correta.
    exercises:
      - { type: japanese_vocab, difficulty: 5, question: "Ontem ___ (comer) sushi: 昨日すしを___ (食べました/食べます/食べる/食べません)", correctAnswer: "食べました", objectives: [japanese.vocab], rationale: "Forma japonesa: \"食べました\". Observe partículas (は/を/が) e a terminação です/ます." }
      - { type: japanese_vocab, difficulty: 5, question: "Amanhã ___ (ir) à escola: 明日学校に___ (行って/行かない/行きました/行きます)", correctAnswer: "行きます", objectives: [japanese.vocab], rationale: "Forma japonesa: \"行きます\". Observe partículas (は/を/が) e a terminação です/ます." }
      - { type: japanese_vocab, difficulty: 5, question: "Agora ___ (estudar) japonês: 今日本語を___ (勉強します/勉強しない/勉強して/勉強しました)", correctAnswer: "勉強します", objectives: [japanese.vocab], rationale: "Forma japonesa: \"勉強します\". Observe partículas (は/を/が) e a terminação です/ます." }
      - { type: japanese_vocab, question: "Não ___ (beber) café: コーヒーを___ (飲みません/飲んで/飲みました/飲みます)", correctAnswer: "飲みません", rationale: "\"Não ___ (beber) café: コーヒーを___\" em japonês escreve-se 飲みません.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, difficulty: 5, question: "Ontem ___ (estar) frio: 昨日は___ (寒くないです/寒くなかったです/寒かったです/寒いです)", correctAnswer: "寒かったです", objectives: [japanese.vocab], rationale: "Forma japonesa: \"寒かったです\". Observe partículas (は/を/が) e a terminação です/ます." }
      - { type: japanese_vocab, question: "A prova ___ (foi) difícil: テストは___ (難しくないです/難しくなかったです/難しいです/難しかったです)", correctAnswer: "難しかったです", rationale: "\"A prova ___ (foi) difícil: テストは___\" em japonês escreve-se 難しかったです.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Não ___ (era) bonito: ___ (きれいでした/きれいじゃないです/きれいじゃなかったです/きれいです)", correctAnswer: "きれいじゃなかったです", rationale: "\"Não ___ (era) bonito: ___\" em japonês escreve-se きれいじゃなかったです.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Era ___ (estudante): 学生___ (じゃない/です/でした/じゃなかった)", correctAnswer: "でした", rationale: "Era ___ (estudante): 学生___ lê-se でした. Pratique associar o traço ao som.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Amigo gentil: 親切___友だち (に/な/い/を)", correctAnswer: "な", rationale: "Amigo gentil: 親切___友だち lê-se な. Pratique associar o traço ao som.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Livro vermelho: 赤___本 (い/に/を/な)", correctAnswer: "い", rationale: "Livro vermelho: 赤___本 lê-se い. Pratique associar o traço ao som.", difficulty: 5, objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Diálogos e expressões
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "「いただきます」 — dito antes de (chegar/comer/dormir/sair)", correctAnswer: "comer", rationale: "A frase \"「いただきます」 — dito antes de\" traduz-se como \"comer\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「ごちそうさま」 — dito depois de (comer/dormir/sair/chegar)", correctAnswer: "comer", rationale: "A frase \"「ごちそうさま」 — dito depois de\" traduz-se como \"comer\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「ただいま」 — dito ao (sair de casa/dormir/acordar/chegar em casa)", correctAnswer: "chegar em casa", rationale: "A frase \"「ただいま」 — dito ao\" traduz-se como \"chegar em casa\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「おかえり」 — dito a quem (acabou de chegar em casa/vai sair/acabou de comer/acordou)", correctAnswer: "acabou de chegar em casa", rationale: "A frase \"「おかえり」 — dito a quem\" traduz-se como \"acabou de chegar em casa\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「いってきます」 — dito ao (chegar em casa/acordar/dormir/sair de casa)", correctAnswer: "sair de casa", rationale: "A frase \"「いってきます」 — dito ao\" traduz-se como \"sair de casa\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「いってらっしゃい」 — dito a quem (vai sair/vai dormir/acabou de chegar/vai comer)", correctAnswer: "vai sair", rationale: "A frase \"「いってらっしゃい」 — dito a quem\" traduz-se como \"vai sair\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「はじめまして」 — dito no (primeiro encontro/final da conversa/telefone/último encontro)", correctAnswer: "primeiro encontro", rationale: "A frase \"「はじめまして」 — dito no\" traduz-se como \"primeiro encontro\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「よろしくおねがいします」 — pedido de (boa colaboração/informação/ajuda financeira/comida)", correctAnswer: "boa colaboração", rationale: "A frase \"「よろしくおねがいします」 — pedido de\" traduz-se como \"boa colaboração\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「おつかれさま」 — dito a quem acabou de (comer/estudar/trabalhar/dormir)", correctAnswer: "trabalhar", rationale: "A frase \"「おつかれさま」 — dito a quem acabou de\" traduz-se como \"trabalhar\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「がんばって」 — (boa sorte/tchau/desculpa/obrigado)", correctAnswer: "boa sorte", rationale: "A frase \"「がんばって」 —\" traduz-se como \"boa sorte\". Identifique partículas e palavras-chave.", difficulty: 5, objectives: [japanese.vocab] }
target: 30
