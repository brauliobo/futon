title: Lugares e ações 駅 店 学校 家 病院
level: 'C'
subject: japanese
objectives: [japanese.vocab]
difficulty: 5
authorNotes: "Lugares e ações 駅 店 学校 家 病院. Foque no conceito central do conjunto e nos erros comuns."
example: "駅 = estação, 店 = loja, 学校 = escola"
pages:
  - pageNumber: 1
    title: Kanji de lugares
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "駅 (estação/loja/escola/banco)", correctAnswer: "estação", rationale: "O kanji 駅 significa \"estação\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "店 (loja/estação/escola/banco)", correctAnswer: "loja", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "学校 (escola/estação/loja/banco)", correctAnswer: "escola", rationale: "O kanji 学校 significa \"escola\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "家 (casa/escola/estação/loja)", correctAnswer: "casa", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "病院 (hospital/banco/escola/loja)", correctAnswer: "hospital", rationale: "O kanji 病院 significa \"hospital\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "銀行 (banco/hospital/escola/loja)", correctAnswer: "banco", rationale: "O kanji 銀行 significa \"banco\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "図書館 (biblioteca/escola/livraria/cinema)", correctAnswer: "biblioteca", rationale: "O kanji 図書館 significa \"biblioteca\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "公園 (parque/praça/jardim/quintal)", correctAnswer: "parque", rationale: "O kanji 公園 significa \"parque\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "会社 (empresa/escola/loja/hospital)", correctAnswer: "empresa", rationale: "O kanji 会社 significa \"empresa\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "空港 (aeroporto/estação/porto/parada)", correctAnswer: "aeroporto", rationale: "O kanji 空港 significa \"aeroporto\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Leituras
    description: Escolha a leitura.
    exercises:
      - { type: japanese_vocab, question: "駅 (えき/みせ/がっこう/いえ)", correctAnswer: "えき", rationale: "駅 lê-se えき. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "店 (みせ/えき/がっこう/いえ)", correctAnswer: "みせ", rationale: "店 lê-se みせ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "学校 (がっこう/えき/みせ/いえ)", correctAnswer: "がっこう", rationale: "学校 lê-se がっこう. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "家 (いえ/がっこう/えき/みせ)", correctAnswer: "いえ", rationale: "家 lê-se いえ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "病院 (びょういん/ぎんこう/えき/がっこう)", correctAnswer: "びょういん", rationale: "病院 lê-se びょういん. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "銀行 (ぎんこう/びょういん/えき/がっこう)", correctAnswer: "ぎんこう", rationale: "銀行 lê-se ぎんこう. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "図書館 (としょかん/びょういん/えき/がっこう)", correctAnswer: "としょかん", rationale: "図書館 lê-se としょかん. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "公園 (こうえん/びょういん/えき/がっこう)", correctAnswer: "こうえん", rationale: "公園 lê-se こうえん. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "会社 (かいしゃ/えき/みせ/いえ)", correctAnswer: "かいしゃ", rationale: "会社 lê-se かいしゃ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "空港 (くうこう/えき/みなと/こうえん)", correctAnswer: "くうこう", rationale: "空港 lê-se くうこう. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases de lugares
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "駅の前で会いましょう。 (Vamos nos encontrar em frente à estação./Vamos à estação./Saímos da estação./Cheguei na estação.)", correctAnswer: "Vamos nos encontrar em frente à estação.", rationale: "O kanji 駅の前で会いましょう。 significa \"Vamos nos encontrar em frente à estação.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この店は新しいです。 (Esta loja é nova./Esta loja é velha./Aquela loja é nova./A loja está fechada.)", correctAnswer: "Esta loja é nova.", rationale: "O kanji この店は新しいです。 significa \"Esta loja é nova.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "学校へ行きます。 (Vou à escola./Venho da escola./Estou na escola./Saio da escola.)", correctAnswer: "Vou à escola.", rationale: "O kanji 学校へ行きます。 significa \"Vou à escola.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "家で勉強する。 (Estudo em casa./Vou à escola./Trabalho em casa./Descanso em casa.)", correctAnswer: "Estudo em casa.", rationale: "O kanji 家で勉強する。 significa \"Estudo em casa.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "病院に行きました。 (Fui ao hospital./Vou ao hospital./Estou no hospital./Saí do hospital.)", correctAnswer: "Fui ao hospital.", rationale: "O kanji 病院に行きました。 significa \"Fui ao hospital.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "銀行でお金を下ろす。 (Sacar dinheiro no banco./Depositar dinheiro./Pagar no banco./Trocar dinheiro.)", correctAnswer: "Sacar dinheiro no banco.", rationale: "O kanji 銀行でお金を下ろす。 significa \"Sacar dinheiro no banco.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "図書館は静かです。 (A biblioteca é silenciosa./A biblioteca é barulhenta./A escola é silenciosa./Estou na biblioteca.)", correctAnswer: "A biblioteca é silenciosa.", rationale: "O kanji 図書館は静かです。 significa \"A biblioteca é silenciosa.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "公園で子どもが遊ぶ。 (As crianças brincam no parque./As crianças vão ao parque./As crianças saem do parque./Não tem crianças.)", correctAnswer: "As crianças brincam no parque.", rationale: "O kanji 公園で子どもが遊ぶ。 significa \"As crianças brincam no parque.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "父は会社で働く。 (Meu pai trabalha na empresa./Meu pai vai à empresa./Meu pai tem uma empresa./Meu pai saiu da empresa.)", correctAnswer: "Meu pai trabalha na empresa.", rationale: "O kanji 父は会社で働く。 significa \"Meu pai trabalha na empresa.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "空港まで電車で行く。 (Vou ao aeroporto de trem./Vou de trem ao aeroporto e volto./O aeroporto é longe./Peguei o trem no aeroporto.)", correctAnswer: "Vou ao aeroporto de trem.", rationale: "O kanji 空港まで電車で行く。 significa \"Vou ao aeroporto de trem.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
target: 30
