title: Lugares e ações 駅 店 学校 家 病院
level: 'C'
subject: japanese
authorNotes: "Lugares e ações 駅 店 学校 家 病院. Foque no conceito central do conjunto e nos erros comuns."
example: "駅 = estação, 店 = loja, 学校 = escola"
pages:
  - pageNumber: 1
    title: Kanji de lugares
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "駅 (estação/loja/escola/banco)", correctAnswer: "estação" }
      - { type: japanese_vocab, question: "店 (loja/estação/escola/banco)", correctAnswer: "loja" }
      - { type: japanese_vocab, question: "学校 (escola/estação/loja/banco)", correctAnswer: "escola" }
      - { type: japanese_vocab, question: "家 (casa/escola/estação/loja)", correctAnswer: "casa" }
      - { type: japanese_vocab, question: "病院 (hospital/banco/escola/loja)", correctAnswer: "hospital" }
      - { type: japanese_vocab, question: "銀行 (banco/hospital/escola/loja)", correctAnswer: "banco" }
      - { type: japanese_vocab, question: "図書館 (biblioteca/escola/livraria/cinema)", correctAnswer: "biblioteca" }
      - { type: japanese_vocab, question: "公園 (parque/praça/jardim/quintal)", correctAnswer: "parque" }
      - { type: japanese_vocab, question: "会社 (empresa/escola/loja/hospital)", correctAnswer: "empresa" }
      - { type: japanese_vocab, question: "空港 (aeroporto/estação/porto/parada)", correctAnswer: "aeroporto" }
  - pageNumber: 2
    title: Leituras
    description: Escolha a leitura.
    exercises:
      - { type: japanese_vocab, question: "駅 (えき/みせ/がっこう/いえ)", correctAnswer: "えき" }
      - { type: japanese_vocab, question: "店 (みせ/えき/がっこう/いえ)", correctAnswer: "みせ" }
      - { type: japanese_vocab, question: "学校 (がっこう/えき/みせ/いえ)", correctAnswer: "がっこう" }
      - { type: japanese_vocab, question: "家 (いえ/がっこう/えき/みせ)", correctAnswer: "いえ" }
      - { type: japanese_vocab, question: "病院 (びょういん/ぎんこう/えき/がっこう)", correctAnswer: "びょういん" }
      - { type: japanese_vocab, question: "銀行 (ぎんこう/びょういん/えき/がっこう)", correctAnswer: "ぎんこう" }
      - { type: japanese_vocab, question: "図書館 (としょかん/びょういん/えき/がっこう)", correctAnswer: "としょかん" }
      - { type: japanese_vocab, question: "公園 (こうえん/びょういん/えき/がっこう)", correctAnswer: "こうえん" }
      - { type: japanese_vocab, question: "会社 (かいしゃ/えき/みせ/いえ)", correctAnswer: "かいしゃ" }
      - { type: japanese_vocab, question: "空港 (くうこう/えき/みなと/こうえん)", correctAnswer: "くうこう" }
  - pageNumber: 3
    title: Frases de lugares
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "駅の前で会いましょう。 (Vamos nos encontrar em frente à estação./Vamos à estação./Saímos da estação./Cheguei na estação.)", correctAnswer: "Vamos nos encontrar em frente à estação." }
      - { type: japanese_vocab, question: "この店は新しいです。 (Esta loja é nova./Esta loja é velha./Aquela loja é nova./A loja está fechada.)", correctAnswer: "Esta loja é nova." }
      - { type: japanese_vocab, question: "学校へ行きます。 (Vou à escola./Venho da escola./Estou na escola./Saio da escola.)", correctAnswer: "Vou à escola." }
      - { type: japanese_vocab, question: "家で勉強する。 (Estudo em casa./Vou à escola./Trabalho em casa./Descanso em casa.)", correctAnswer: "Estudo em casa." }
      - { type: japanese_vocab, question: "病院に行きました。 (Fui ao hospital./Vou ao hospital./Estou no hospital./Saí do hospital.)", correctAnswer: "Fui ao hospital." }
      - { type: japanese_vocab, question: "銀行でお金を下ろす。 (Sacar dinheiro no banco./Depositar dinheiro./Pagar no banco./Trocar dinheiro.)", correctAnswer: "Sacar dinheiro no banco." }
      - { type: japanese_vocab, question: "図書館は静かです。 (A biblioteca é silenciosa./A biblioteca é barulhenta./A escola é silenciosa./Estou na biblioteca.)", correctAnswer: "A biblioteca é silenciosa." }
      - { type: japanese_vocab, question: "公園で子どもが遊ぶ。 (As crianças brincam no parque./As crianças vão ao parque./As crianças saem do parque./Não tem crianças.)", correctAnswer: "As crianças brincam no parque." }
      - { type: japanese_vocab, question: "父は会社で働く。 (Meu pai trabalha na empresa./Meu pai vai à empresa./Meu pai tem uma empresa./Meu pai saiu da empresa.)", correctAnswer: "Meu pai trabalha na empresa." }
      - { type: japanese_vocab, question: "空港まで電車で行く。 (Vou ao aeroporto de trem./Vou de trem ao aeroporto e volto./O aeroporto é longe./Peguei o trem no aeroporto.)", correctAnswer: "Vou ao aeroporto de trem." }
target: 30
