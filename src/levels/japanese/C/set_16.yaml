title: 📝 Não precisa — ～なくてもいいです
level: 'C'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～なくてもいいです = não precisa / não é necessário fazer. Contraste com ～なければなりません."
example: "Para dizer que não é necessário fazer algo, use negativo-て + もいいです. Ex.: 来なくてもいいです → Não precisa vir."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Não é necessário — ～なくてもいいです
    description: Escolha a tradução correta para cada expressão de permissão de não fazer.
    exercises:
      - { type: japanese_vocab, question: "来なくてもいいです。 (Não precisa vir./Você deve vir./Pode vir./Não pode vir.)", correctAnswer: "Não precisa vir.", rationale: "来なくて (neg-て de 来る) + もいいです = não precisa vir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べなくてもいいです。 (Não precisa comer./Você deve comer./Pode comer./Não pode comer.)", correctAnswer: "Não precisa comer.", rationale: "食べなくて (neg-て de 食べる) + もいいです = não precisa comer.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "勉強しなくてもいいです。 (Não precisa estudar./Você deve estudar./Pode estudar./Não pode estudar.)", correctAnswer: "Não precisa estudar.", rationale: "勉強しなくて (neg-て de する) + もいいです = não precisa estudar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "急がなくてもいいです。 (Não precisa ter pressa./Você deve se apressar./Pode ter pressa./Não pode ir rápido.)", correctAnswer: "Não precisa ter pressa.", rationale: "急がなくて (neg-て de 急ぐ) + もいいです = não precisa se apressar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "持ってこなくてもいいです。 (Não precisa trazer./Você deve trazer./Pode trazer./Não pode trazer.)", correctAnswer: "Não precisa trazer.", rationale: "持ってこなくて + もいいです = não precisa trazer (持ってくる neg.).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "早く起きなくてもいいです。 (Não precisa acordar cedo./Você deve acordar cedo./Pode acordar cedo./Não pode acordar.)", correctAnswer: "Não precisa acordar cedo.", rationale: "起きなくて + もいいです = não precisa acordar (cedo).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書かなくてもいいです。 (Não precisa escrever./Você deve escrever./Pode escrever./Não pode escrever.)", correctAnswer: "Não precisa escrever.", rationale: "書かなくて (neg-て de 書く) + もいいです = não precisa escrever.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "払わなくてもいいです。 (Não precisa pagar./Você deve pagar./Pode pagar./Não pode pagar.)", correctAnswer: "Não precisa pagar.", rationale: "払わなくて (neg-て de 払う) + もいいです = não precisa pagar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "話さなくてもいいです。 (Não precisa falar./Você deve falar./Pode falar./Não pode falar.)", correctAnswer: "Não precisa falar.", rationale: "話さなくて (neg-て de 話す) + もいいです = não precisa falar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "待たなくてもいいです。 (Não precisa esperar./Você deve esperar./Pode esperar./Não pode esperar.)", correctAnswer: "Não precisa esperar.", rationale: "待たなくて (neg-て de 待つ) + もいいです = não precisa esperar.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Contraste obrigação vs dispensa
    description: Escolha a forma correta segundo o contexto.
    exercises:
      - { type: japanese_vocab, question: "今日は宿題___くてもいいです。 (しな/して/した/する)", correctAnswer: "しな", rationale: "しなくてもいいです = não precisa fazer a lição. しな + くてもいいです.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明日は早く来___くてもいいです。 (な/る/て/た)", correctAnswer: "な", rationale: "来なくてもいいです: 来 + なくてもいいです = não precisa vir cedo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "全部食べ___くてもいいです。 (な/る/て/た)", correctAnswer: "な", rationale: "食べなくてもいいです: 食べ + なくてもいいです = não precisa comer tudo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "急が___くてもいいです。 (な/ない/に/て)", correctAnswer: "な", rationale: "急がなくてもいいです: 急が + なくてもいいです = não precisa se apressar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "傘を持ってこ___くてもいいです。 (な/る/て/た)", correctAnswer: "な", rationale: "持ってこなくてもいいです: こ + なくてもいいです = não precisa trazer guarda-chuva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "今日は掃除し___くてもいいです。 (な/る/て/た)", correctAnswer: "な", rationale: "掃除しなくてもいいです = não precisa limpar hoje.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 明日、来なければなりませんか？B: いいえ、___ (来なくてもいいです。/来てください。/来ません。/来ますか？)", correctAnswer: "来なくてもいいです。", rationale: "Resposta: não precisa vir = 来なくてもいいです. Contraste com なければなりません.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 勉強しなければなりませんか？ B: いいえ、___ (勉強しなくてもいいです。/勉強してください。/勉強します。/勉強しましたか？)", correctAnswer: "勉強しなくてもいいです。", rationale: "Não precisa estudar: 勉強しなくてもいいです.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 全部読まなければなりませんか？ B: いいえ、___ (読まなくてもいいです。/読んでください。/読みます。/読みましたか？)", correctAnswer: "読まなくてもいいです。", rationale: "Não precisa ler tudo: 読まなくてもいいです.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: お金を払わなければなりませんか？ B: いいえ、___ (払わなくてもいいです。/払ってください。/払います。/払いましたか？)", correctAnswer: "払わなくてもいいです。", rationale: "Não precisa pagar: 払わなくてもいいです.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
