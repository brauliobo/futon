title: Adjetivos-い — grande, pequeno, novo, velho
level: 'C'
subject: japanese
objectives: [japanese.vocab]
difficulty: 4
authorNotes: "Adjetivos-い — grande, pequeno, novo, velho. Foque no conceito central do conjunto e nos erros comuns."
example: "Adjetivos que terminam em い funcionam sem です: 大きい犬. Ex.: 大きい → grande."
pages:
  - pageNumber: 1
    title: Adjetivos-い básicos
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "大きい (grande/pequeno/alto/baixo)", correctAnswer: "grande", rationale: "O kanji 大きい significa \"grande\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "小さい (pequeno/grande/alto/baixo)", correctAnswer: "pequeno", rationale: "O kanji 小さい significa \"pequeno\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "新しい (novo/velho/bonito/feio)", correctAnswer: "novo", objectives: [japanese.vocab], rationale: "O kanji 新しい significa \"novo\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "古い (velho/novo/bonito/feio)", correctAnswer: "velho", rationale: "O kanji 古い significa \"velho\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "高い (alto/caro/baixo/barato)", correctAnswer: "alto", objectives: [japanese.vocab], rationale: "O kanji 高い significa \"alto\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "安い (barato/caro/bonito/feio)", correctAnswer: "barato", rationale: "O kanji 安い significa \"barato\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "長い (longo/curto/largo/estreito)", correctAnswer: "longo", rationale: "O kanji 長い significa \"longo\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "短い (curto/longo/largo/estreito)", correctAnswer: "curto", rationale: "O kanji 短い significa \"curto\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "広い (amplo/estreito/largo/curto)", correctAnswer: "amplo", rationale: "O kanji 広い significa \"amplo\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "狭い (estreito/amplo/largo/curto)", correctAnswer: "estreito", rationale: "O kanji 狭い significa \"estreito\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Mais adjetivos-い
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "暑い (quente no tempo/frio/morno/gelado)", correctAnswer: "quente no tempo", rationale: "O kanji 暑い significa \"quente no tempo\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "寒い (frio no tempo/quente/morno/gelado)", correctAnswer: "frio no tempo", rationale: "O kanji 寒い significa \"frio no tempo\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "忙しい (ocupado/livre/cansado/descansado)", correctAnswer: "ocupado", rationale: "O kanji 忙しい significa \"ocupado\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "楽しい (divertido/chato/triste/feliz)", correctAnswer: "divertido", rationale: "O kanji 楽しい significa \"divertido\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おいしい (gostoso/ruim/azedo/amargo)", correctAnswer: "gostoso", rationale: "おいしい (hiragana) significa \"gostoso\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "難しい (difícil/fácil/simples/complicado)", correctAnswer: "difícil", rationale: "O kanji 難しい significa \"difícil\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "易しい (fácil/difícil/simples/complicado)", correctAnswer: "fácil", rationale: "O kanji 易しい significa \"fácil\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "速い (rápido/lento/devagar/estacionado)", correctAnswer: "rápido", rationale: "O kanji 速い significa \"rápido\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "遅い (lento/rápido/pontual/atrasado)", correctAnswer: "lento", rationale: "O kanji 遅い significa \"lento\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いい (bom/ruim/ótimo/péssimo)", correctAnswer: "bom", rationale: "いい lê-se \"bom\" (romaji).", objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases com adjetivos-い
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "この犬は大きいです。 (Este cachorro é grande./Este cachorro é pequeno./Aquele cachorro é grande./Meu cachorro é grande.)", correctAnswer: "Este cachorro é grande.", rationale: "O kanji この犬は大きいです。 significa \"Este cachorro é grande.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "新しい本を買いました。 (Comprei um livro novo./Li um livro novo./Vou comprar um livro./Perdi um livro.)", correctAnswer: "Comprei um livro novo.", rationale: "O kanji 新しい本を買いました。 significa \"Comprei um livro novo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この料理はおいしいです。 (Esta comida é gostosa./Esta comida é ruim./Aquela comida é gostosa./Esse prato é quente.)", correctAnswer: "Esta comida é gostosa.", rationale: "O kanji この料理はおいしいです。 significa \"Esta comida é gostosa.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は忙しいです。 (Hoje estou ocupado./Hoje estou livre./Ontem estava ocupado./Amanhã estarei ocupado.)", correctAnswer: "Hoje estou ocupado.", rationale: "O kanji 今日は忙しいです。 significa \"Hoje estou ocupado.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語は難しいですが、楽しいです。 (O japonês é difícil, mas divertido./O japonês é fácil e chato./O japonês é só difícil./O japonês é simples.)", correctAnswer: "O japonês é difícil, mas divertido.", rationale: "O kanji 日本語は難しいですが、楽しいです。 significa \"O japonês é difícil, mas divertido.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は寒いですね。 (Está frio hoje, né?/Está quente hoje./Ontem estava frio./Amanhã vai esfriar.)", correctAnswer: "Está frio hoje, né?", rationale: "O kanji 今日は寒いですね。 significa \"Está frio hoje, né?\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この車は速いです。 (Este carro é rápido./Este carro é lento./Aquele carro é rápido./Meu carro é lento.)", correctAnswer: "Este carro é rápido.", rationale: "O kanji この車は速いです。 significa \"Este carro é rápido.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本の食べ物は安いです。 (Comida japonesa é barata./Comida japonesa é cara./Comida brasileira é barata./Toda comida é cara.)", correctAnswer: "Comida japonesa é barata.", rationale: "O kanji 日本の食べ物は安いです。 significa \"Comida japonesa é barata.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "夏は暑くて、冬は寒い。 (Verão é quente e inverno é frio./Verão é frio e inverno é quente./Sempre faz frio./Sempre faz calor.)", correctAnswer: "Verão é quente e inverno é frio.", rationale: "O kanji 夏は暑くて、冬は寒い。 significa \"Verão é quente e inverno é frio.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "このペンは古いです。 (Esta caneta é velha./Esta caneta é nova./Aquela caneta é velha./Minha caneta é velha.)", correctAnswer: "Esta caneta é velha.", rationale: "O kanji このペンは古いです。 significa \"Esta caneta é velha.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
target: 30
