title: 📝 Passado dos verbos — ～ました
level: 'C'
subject: japanese
objectives: [japanese.vocab]
difficulty: 4
authorNotes: "Passado dos verbos — ～ました. Foque no conceito central do conjunto e nos erros comuns."
example: "食べます → 食べました (comi). Passado polido = ました."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Reconhecer passado ～ました
    description: Leia e escolha o tempo verbal.
    exercises:
      - { type: japanese_vocab, difficulty: 4, question: "食べました (como/gosto de comer/vou comer/comi)", correctAnswer: "comi", objectives: [japanese.vocab], rationale: "O kanji 食べました significa \"comi\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, difficulty: 4, question: "飲みました (bebi/vou beber/bebo/gosto)", correctAnswer: "bebi", objectives: [japanese.vocab], rationale: "O kanji 飲みました significa \"bebi\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, difficulty: 4, question: "見ました (vou ver/vejo/vi/quero ver)", correctAnswer: "vi", objectives: [japanese.vocab], rationale: "O kanji 見ました significa \"vi\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, difficulty: 4, question: "聞きました (vou ouvir/quero ouvir/ouvi/ouço)", correctAnswer: "ouvi", objectives: [japanese.vocab], rationale: "O kanji 聞きました significa \"ouvi\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, difficulty: 4, question: "行きました (fui/vou/volto/venho)", correctAnswer: "fui", objectives: [japanese.vocab], rationale: "O kanji 行きました significa \"fui\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, difficulty: 4, question: "来ました (vim/chego/parto/venho)", correctAnswer: "vim", objectives: [japanese.vocab], rationale: "O kanji 来ました significa \"vim\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "帰りました (volto/vou/voltei/venho)", correctAnswer: "voltei", rationale: "O kanji 帰りました significa \"voltei\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "買いました (comprei/compro/vou comprar/vendi)", correctAnswer: "comprei", rationale: "O kanji 買いました significa \"comprei\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "勉強しました (vou estudar/estudo/estudei/ensinei)", correctAnswer: "estudei", rationale: "O kanji 勉強しました significa \"estudei\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "会いました (conheci/encontrei/encontro/vou encontrar)", correctAnswer: "encontrei", rationale: "O kanji 会いました significa \"encontrei\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Passado negativo ～ませんでした
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "食べませんでした (não comi/não como/vou comer/comi)", correctAnswer: "não comi", rationale: "O kanji 食べませんでした significa \"não comi\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "行きませんでした (não vou/fui/não fui/vou)", correctAnswer: "não fui", rationale: "O kanji 行きませんでした significa \"não fui\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "見ませんでした (não vejo/vi/não vi/vou ver)", correctAnswer: "não vi", rationale: "O kanji 見ませんでした significa \"não vi\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "来ませんでした (virei/vim/não venho/não vim)", correctAnswer: "não vim", rationale: "O kanji 来ませんでした significa \"não vim\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "会いませんでした (não encontrei/encontrarei/encontrei/não encontro)", correctAnswer: "não encontrei", rationale: "O kanji 会いませんでした significa \"não encontrei\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "買いませんでした (comprei/não comprei/não compro/comprarei)", correctAnswer: "não comprei", rationale: "O kanji 買いませんでした significa \"não comprei\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "分かりませんでした (entendo/vou entender/entendi/não entendi)", correctAnswer: "não entendi", rationale: "O kanji 分かりませんでした significa \"não entendi\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "勉強しませんでした (estudei/vou estudar/não estudei/estudo)", correctAnswer: "não estudei", rationale: "O kanji 勉強しませんでした significa \"não estudei\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "話しませんでした (não falei/falo/falei/vou falar)", correctAnswer: "não falei", rationale: "O kanji 話しませんでした significa \"não falei\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "聞きませんでした (ouvi/ouço/vou ouvir/não ouvi)", correctAnswer: "não ouvi", rationale: "O kanji 聞きませんでした significa \"não ouvi\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases no passado
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "昨日映画を見ました。 (Vejo filmes./Vou ver um filme amanhã./Vi um filme ontem./Não vi o filme.)", correctAnswer: "Vi um filme ontem.", rationale: "O kanji 昨日映画を見ました。 significa \"Vi um filme ontem.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "先週日本へ行きました。 (Estou no Japão./Já fui ao Japão./Fui ao Japão semana passada./Vou ao Japão semana que vem.)", correctAnswer: "Fui ao Japão semana passada.", rationale: "O kanji 先週日本へ行きました。 significa \"Fui ao Japão semana passada.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "朝ごはんを食べませんでした。 (Comi café da manhã./Vou comer./Fiz café./Não comi café da manhã.)", correctAnswer: "Não comi café da manhã.", rationale: "O kanji 朝ごはんを食べませんでした。 significa \"Não comi café da manhã.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "去年日本語を勉強しました。 (Estudei japonês ano passado./Estudo japonês./Vou estudar./Não estudei.)", correctAnswer: "Estudei japonês ano passado.", rationale: "O kanji 去年日本語を勉強しました。 significa \"Estudei japonês ano passado.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "友だちに会いました。 (Encontrei meu amigo./Vou encontrar meu amigo./Meu amigo veio./Liguei para meu amigo.)", correctAnswer: "Encontrei meu amigo.", rationale: "O kanji 友だちに会いました。 significa \"Encontrei meu amigo.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "コーヒーを三杯飲みました。 (Bebo três cafés./Vou beber três cafés./Comprei três cafés./Bebi três cafés.)", correctAnswer: "Bebi três cafés.", rationale: "O kanji コーヒーを三杯飲みました。 significa \"Bebi três cafés.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "そのニュースは知りませんでした。 (Não sabia dessa notícia./Vou saber./Não sei./Sabia dessa notícia.)", correctAnswer: "Não sabia dessa notícia.", rationale: "O kanji そのニュースは知りませんでした。 significa \"Não sabia dessa notícia.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "電車で来ました。 (Vou de trem./Vim a pé./Vim de trem./Volto de trem.)", correctAnswer: "Vim de trem.", rationale: "O kanji 電車で来ました。 significa \"Vim de trem.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "昨日は雨でした。 (Amanhã vai chover./Hoje chove./Ontem choveu./Não vai chover.)", correctAnswer: "Ontem choveu.", rationale: "O kanji 昨日は雨でした。 significa \"Ontem choveu.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "何を食べましたか。 (O que você comeu?/O que você come?/O que vai comer?/Quem come?)", correctAnswer: "O que você comeu?", rationale: "O kanji 何を食べましたか。 significa \"O que você comeu?\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
target: 30
