title: Passado dos verbos — ～ました
level: 'C'
subject: japanese
objectives: [japanese.vocab]
difficulty: 4
authorNotes: "Passado dos verbos — ～ました. Foque no conceito central do conjunto e nos erros comuns."
example: "食べます → 食べました (comi). Passado polido = ました"
pages:
  - pageNumber: 1
    title: Reconhecer passado ～ました
    description: Leia e escolha o tempo verbal.
    exercises:
      - { type: japanese_vocab, question: "食べました (comi/como/vou comer/gosto de comer)", correctAnswer: "comi", objectives: [japanese.vocab], rationale: "O kanji 食べました significa \"comi\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "飲みました (bebi/bebo/vou beber/gosto)", correctAnswer: "bebi", objectives: [japanese.vocab], rationale: "O kanji 飲みました significa \"bebi\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "見ました (vi/vejo/vou ver/quero ver)", correctAnswer: "vi", objectives: [japanese.vocab], rationale: "O kanji 見ました significa \"vi\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "聞きました (ouvi/ouço/vou ouvir/quero ouvir)", correctAnswer: "ouvi", objectives: [japanese.vocab], rationale: "O kanji 聞きました significa \"ouvi\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "行きました (fui/vou/volto/venho)", correctAnswer: "fui", objectives: [japanese.vocab], rationale: "O kanji 行きました significa \"fui\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "来ました (vim/venho/chego/parto)", correctAnswer: "vim", objectives: [japanese.vocab], rationale: "O kanji 来ました significa \"vim\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "帰りました (voltei/volto/venho/vou)", correctAnswer: "voltei", rationale: "O kanji 帰りました significa \"voltei\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "買いました (comprei/compro/vou comprar/vendi)", correctAnswer: "comprei", rationale: "O kanji 買いました significa \"comprei\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "勉強しました (estudei/estudo/vou estudar/ensinei)", correctAnswer: "estudei", rationale: "O kanji 勉強しました significa \"estudei\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "会いました (encontrei/encontro/vou encontrar/conheci)", correctAnswer: "encontrei", rationale: "O kanji 会いました significa \"encontrei\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Passado negativo ～ませんでした
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "食べませんでした (não comi/não como/vou comer/comi)", correctAnswer: "não comi", rationale: "O kanji 食べませんでした significa \"não comi\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "行きませんでした (não fui/não vou/vou/fui)", correctAnswer: "não fui", rationale: "O kanji 行きませんでした significa \"não fui\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "見ませんでした (não vi/não vejo/vou ver/vi)", correctAnswer: "não vi", rationale: "O kanji 見ませんでした significa \"não vi\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "来ませんでした (não vim/não venho/virei/vim)", correctAnswer: "não vim", rationale: "O kanji 来ませんでした significa \"não vim\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "会いませんでした (não encontrei/não encontro/encontrarei/encontrei)", correctAnswer: "não encontrei", rationale: "O kanji 会いませんでした significa \"não encontrei\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "買いませんでした (não comprei/não compro/comprarei/comprei)", correctAnswer: "não comprei", rationale: "O kanji 買いませんでした significa \"não comprei\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "分かりませんでした (não entendi/entendi/entendo/vou entender)", correctAnswer: "não entendi", rationale: "O kanji 分かりませんでした significa \"não entendi\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "勉強しませんでした (não estudei/estudei/estudo/vou estudar)", correctAnswer: "não estudei", rationale: "O kanji 勉強しませんでした significa \"não estudei\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "話しませんでした (não falei/falei/falo/vou falar)", correctAnswer: "não falei", rationale: "O kanji 話しませんでした significa \"não falei\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "聞きませんでした (não ouvi/ouvi/ouço/vou ouvir)", correctAnswer: "não ouvi", rationale: "O kanji 聞きませんでした significa \"não ouvi\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases no passado
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "昨日映画を見ました。 (Vi um filme ontem./Vou ver um filme amanhã./Vejo filmes./Não vi o filme.)", correctAnswer: "Vi um filme ontem.", rationale: "O kanji 昨日映画を見ました。 significa \"Vi um filme ontem.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "先週日本へ行きました。 (Fui ao Japão semana passada./Vou ao Japão semana que vem./Estou no Japão./Já fui ao Japão.)", correctAnswer: "Fui ao Japão semana passada.", rationale: "O kanji 先週日本へ行きました。 significa \"Fui ao Japão semana passada.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "朝ごはんを食べませんでした。 (Não comi café da manhã./Comi café da manhã./Vou comer./Fiz café.)", correctAnswer: "Não comi café da manhã.", rationale: "O kanji 朝ごはんを食べませんでした。 significa \"Não comi café da manhã.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "去年日本語を勉強しました。 (Estudei japonês ano passado./Estudo japonês./Vou estudar./Não estudei.)", correctAnswer: "Estudei japonês ano passado.", rationale: "O kanji 去年日本語を勉強しました。 significa \"Estudei japonês ano passado.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "友だちに会いました。 (Encontrei meu amigo./Vou encontrar meu amigo./Meu amigo veio./Liguei para meu amigo.)", correctAnswer: "Encontrei meu amigo.", rationale: "O kanji 友だちに会いました。 significa \"Encontrei meu amigo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "コーヒーを三杯飲みました。 (Bebi três cafés./Bebo três cafés./Vou beber três cafés./Comprei três cafés.)", correctAnswer: "Bebi três cafés.", rationale: "O kanji コーヒーを三杯飲みました。 significa \"Bebi três cafés.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "そのニュースは知りませんでした。 (Não sabia dessa notícia./Sabia dessa notícia./Não sei./Vou saber.)", correctAnswer: "Não sabia dessa notícia.", rationale: "O kanji そのニュースは知りませんでした。 significa \"Não sabia dessa notícia.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "電車で来ました。 (Vim de trem./Vim a pé./Vou de trem./Volto de trem.)", correctAnswer: "Vim de trem.", rationale: "O kanji 電車で来ました。 significa \"Vim de trem.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "昨日は雨でした。 (Ontem choveu./Hoje chove./Amanhã vai chover./Não vai chover.)", correctAnswer: "Ontem choveu.", rationale: "O kanji 昨日は雨でした。 significa \"Ontem choveu.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "何を食べましたか。 (O que você comeu?/O que você come?/O que vai comer?/Quem come?)", correctAnswer: "O que você comeu?", rationale: "O kanji 何を食べましたか。 significa \"O que você comeu?\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
target: 30
