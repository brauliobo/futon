title: 💬 Perguntas no passado — ～ましたか？
level: 'C'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "Perguntas no passado polido: verbo + ましたか？ Resposta: はい、～ました / いいえ、～ませんでした."
example: "Para perguntar no passado, adicione か ao final. Ex.: 食べましたか？ → Você comeu?"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Perguntas simples no passado
    description: Escolha a tradução correta para cada pergunta no passado.
    exercises:
      - { type: japanese_vocab, question: "食べましたか？ (Você comeu?/Você come?/Você vai comer?/Você comia?)", correctAnswer: "Você comeu?", rationale: "食べました → comeu, か → partícula interrogativa. Entonação ascendente.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "昨日、学校に行きましたか？ (Você foi à escola ontem?/Vai à escola amanhã?/Foi à escola hoje?/Estava na escola?)", correctAnswer: "Você foi à escola ontem?", rationale: "昨日 → ontem, 学校に行きましたか → foi à escola?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "テレビを見ましたか？ (Você viu TV?/Você assiste TV?/Você vai ver TV?/Você comprou TV?)", correctAnswer: "Você viu TV?", rationale: "テレビを見ましたか → viu TV? を → objeto direto.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "宿題をしましたか？ (Você fez a lição de casa?/Você faz a lição?/Vai fazer a lição?/Terminou a lição?)", correctAnswer: "Você fez a lição de casa?", rationale: "宿題 → lição de casa, しましたか → fez?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "はい、食べました。 (Sim, comi./Não, não comi./Sim, comerei./Sim, como.)", correctAnswer: "Sim, comi.", rationale: "はい → sim, 食べました → comi. Resposta afirmativa no passado.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "いいえ、行きませんでした。 (Sim, fui./Não, não fui./Não, não vou./Sim, irei.)", correctAnswer: "Não, não fui.", rationale: "いいえ → não, 行きませんでした → não fui. Resposta negativa no passado.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "コーヒーを飲みましたか？ (Você bebeu café?/Você bebe café?/Você vai beber café?/Você comprou café?)", correctAnswer: "Você bebeu café?", rationale: "コーヒーを飲みましたか → bebeu café? を → objeto.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語を勉強しましたか？ (Você estudou japonês?/Você estuda japonês?/Vai estudar japonês?/Você gosta de japonês?)", correctAnswer: "Você estudou japonês?", rationale: "日本語を勉強しましたか → estudou japonês? Verbo composto する.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友だちに会いましたか？ (Você encontrou um amigo?/Você vai encontrar um amigo?/Você tem amigos?/Você ligou para um amigo?)", correctAnswer: "Você encontrou um amigo?", rationale: "友だちに会う → encontrar amigo, ましたか → pergunta passado.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "映画はおもしろかったですか？ (O filme foi interessante?/O filme é interessante?/O filme vai ser bom?/O livro foi interessante?)", correctAnswer: "O filme foi interessante?", rationale: "おもしろかったですか → foi interessante? Adjetivo-い no passado.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Diálogos e respostas
    description: Escolha a resposta correta ou a pergunta que corresponde ao contexto.
    exercises:
      - { type: japanese_vocab, question: "A: 昨日、何をしましたか？ B: ___ (映画を見ました。/見ます。/映画でした。/見ましたか？)", correctAnswer: "映画を見ました。", rationale: "Resposta a 何をしましたか deve ser verbo passado afirmativo: 映画を見ました.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 朝ごはんを食べましたか？ B: いいえ、___ (食べませんでした。/食べません。/食べます。/食べました。)", correctAnswer: "食べませんでした。", rationale: "いいえ の後は否定過去: 食べませんでした.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 週末、どこへ行きましたか？ B: ___ (公園に行きました。/公園です。/行きますか？/公園に行きません。)", correctAnswer: "公園に行きました。", rationale: "どこへ行きましたか → onde foi? Resposta: 公園に行きました → fui ao parque.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 試験は難しかったですか？ B: ___ (はい、難しかったです。/はい、難しいです。/いいえ、難しいです。/はい、難しくないです。)", correctAnswer: "はい、難しかったです。", rationale: "Adjetivo passado na resposta: 難しかったです → foi difícil.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 昨日、何時に起きましたか？ B: ___ (七時に起きました。/七時に起きます。/七時に起きませんでした。/起きましたか？)", correctAnswer: "七時に起きました。", rationale: "何時に起きましたか → a que horas acordou? 七時に起きました → acordei às 7h.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 夕食を食べましたか？ B: はい、___ (食べました。/食べません。/食べましたか？/食べます。)", correctAnswer: "食べました。", rationale: "はい + verbo passado afirmativo: 食べました.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 昨日、雨が降りましたか？ B: いいえ、___ (降りませんでした。/降りました。/降ります。/降りましたか？)", correctAnswer: "降りませんでした。", rationale: "いいえ + negativo passado: 降りませんでした → não choveu.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 日本語の授業はどうでしたか？ B: ___ (とても楽しかったです。/楽しいです。/楽しいでした。/楽しくありませんか？)", correctAnswer: "とても楽しかったです。", rationale: "どうでしたか → como foi? Resposta com adjetivo passado: 楽しかったです.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 本を読みましたか？ B: はい、___ (読みました。/読みません。/読みます。/読みましたか？)", correctAnswer: "読みました。", rationale: "本を読む → ler livro. はい + 読みました → sim, li.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "A: 彼女は来ましたか？ B: いいえ、___ (来ませんでした。/来ました。/来ます。/来ましたか？)", correctAnswer: "来ませんでした。", rationale: "いいえ + 来ませんでした → não, ela não veio.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
