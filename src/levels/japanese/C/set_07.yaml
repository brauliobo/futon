title: Verbos de movimento 行く 来る 帰る 入る 出る
level: 'C'
subject: japanese
authorNotes: "Verbos de movimento 行く 来る 帰る 入る 出る. Foque no conceito central do conjunto e nos erros comuns."
example: "行く (ir), 来る (vir), 帰る (voltar para casa). Ex.: 行く → ir."
pages:
  - pageNumber: 1
    title: Verbos básicos de movimento
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "行く (ir/vir/voltar/entrar)", correctAnswer: "ir" }
      - { type: japanese_vocab, question: "来る (vir/ir/voltar/entrar)", correctAnswer: "vir" }
      - { type: japanese_vocab, question: "帰る (voltar para casa/ir/vir/entrar)", correctAnswer: "voltar para casa" }
      - { type: japanese_vocab, question: "入る (entrar/sair/ir/vir)", correctAnswer: "entrar" }
      - { type: japanese_vocab, question: "出る (sair/entrar/ir/vir)", correctAnswer: "sair" }
      - { type: japanese_vocab, question: "走る (correr/andar/parar/voar)", correctAnswer: "correr" }
      - { type: japanese_vocab, question: "歩く (andar/correr/parar/voar)", correctAnswer: "andar" }
      - { type: japanese_vocab, question: "止まる (parar/correr/andar/voar)", correctAnswer: "parar" }
      - { type: japanese_vocab, question: "乗る (subir/descer/andar/correr)", correctAnswer: "subir" }
      - { type: japanese_vocab, question: "降りる (descer/subir/andar/correr)", correctAnswer: "descer" }
  - pageNumber: 2
    title: Verbos de movimento no passado
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "行きました (fui/vou/estou indo/vou ir)", correctAnswer: "fui" }
      - { type: japanese_vocab, question: "来ました (vim/venho/estou vindo/vou vir)", correctAnswer: "vim" }
      - { type: japanese_vocab, question: "帰りました (voltei/volto/estou voltando/vou voltar)", correctAnswer: "voltei" }
      - { type: japanese_vocab, question: "入りました (entrei/entro/estou entrando/vou entrar)", correctAnswer: "entrei" }
      - { type: japanese_vocab, question: "出ました (saí/saio/estou saindo/vou sair)", correctAnswer: "saí" }
      - { type: japanese_vocab, question: "走りました (corri/corro/estou correndo/vou correr)", correctAnswer: "corri" }
      - { type: japanese_vocab, question: "歩きました (andei/ando/estou andando/vou andar)", correctAnswer: "andei" }
      - { type: japanese_vocab, question: "止まりました (parei/paro/estou parando/vou parar)", correctAnswer: "parei" }
      - { type: japanese_vocab, question: "乗りました (subi/subo/estou subindo/vou subir)", correctAnswer: "subi" }
      - { type: japanese_vocab, question: "降りました (desci/desço/estou descendo/vou descer)", correctAnswer: "desci" }
  - pageNumber: 3
    title: Frases de movimento
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "毎日学校へ行きます。 (Vou à escola todo dia./Vou à escola às vezes./Nunca vou à escola./Vou à escola amanhã.)", correctAnswer: "Vou à escola todo dia." }
      - { type: japanese_vocab, question: "昨日家に帰りました。 (Voltei para casa ontem./Vou para casa hoje./Vou voltar amanhã./Saí de casa ontem.)", correctAnswer: "Voltei para casa ontem." }
      - { type: japanese_vocab, question: "友だちが来ました。 (Meu amigo veio./Meu amigo vai vir./Meu amigo vem sempre./Meu amigo não vem.)", correctAnswer: "Meu amigo veio." }
      - { type: japanese_vocab, question: "部屋に入ってください。 (Entre no quarto, por favor./Saia do quarto, por favor./Fique no quarto, por favor./Feche o quarto.)", correctAnswer: "Entre no quarto, por favor." }
      - { type: japanese_vocab, question: "電車に乗ります。 (Pego o trem./Desço do trem./Vejo o trem./Vou de trem.)", correctAnswer: "Pego o trem." }
      - { type: japanese_vocab, question: "バスを降りました。 (Desci do ônibus./Subi no ônibus./Vou de ônibus./Perdi o ônibus.)", correctAnswer: "Desci do ônibus." }
      - { type: japanese_vocab, question: "公園を歩きました。 (Caminhei pelo parque./Corri pelo parque./Dormi no parque./Fui ao parque.)", correctAnswer: "Caminhei pelo parque." }
      - { type: japanese_vocab, question: "車が止まった。 (O carro parou./O carro andou./O carro acelerou./O carro quebrou.)", correctAnswer: "O carro parou." }
      - { type: japanese_vocab, question: "学校から出ました。 (Saí da escola./Entrei na escola./Cheguei na escola./Fui à escola.)", correctAnswer: "Saí da escola." }
      - { type: japanese_vocab, question: "犬と一緒に走ります。 (Corro com o cachorro./Ando com o cachorro./Brinco com o cachorro./Durmo com o cachorro.)", correctAnswer: "Corro com o cachorro." }
target: 30
