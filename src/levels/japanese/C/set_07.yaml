title: Verbos de movimento 行く 来る 帰る 入る 出る
level: 'C'
subject: japanese
difficulty: 5
authorNotes: "Verbos de movimento 行く 来る 帰る 入る 出る. Foque no conceito central do conjunto e nos erros comuns."
example: "行く (ir), 来る (vir), 帰る (voltar para casa). Ex.: 行く → ir."
pages:
  - pageNumber: 1
    title: Verbos básicos de movimento
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "行く (ir/vir/voltar/entrar)", correctAnswer: "ir" }
      - { type: japanese_vocab, question: "来る (vir/ir/voltar/entrar)", correctAnswer: "vir" }
      - { type: japanese_vocab, question: "帰る (voltar para casa/ir/vir/entrar)", correctAnswer: "voltar para casa", rationale: "O kanji 帰る significa \"voltar para casa\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "入る (entrar/sair/ir/vir)", correctAnswer: "entrar", rationale: "O kanji 入る significa \"entrar\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "出る (sair/entrar/ir/vir)", correctAnswer: "sair" }
      - { type: japanese_vocab, question: "走る (correr/andar/parar/voar)", correctAnswer: "correr", rationale: "O kanji 走る significa \"correr\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "歩く (andar/correr/parar/voar)", correctAnswer: "andar", rationale: "O kanji 歩く significa \"andar\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "止まる (parar/correr/andar/voar)", correctAnswer: "parar", rationale: "O kanji 止まる significa \"parar\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "乗る (subir/descer/andar/correr)", correctAnswer: "subir", rationale: "O kanji 乗る significa \"subir\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "降りる (descer/subir/andar/correr)", correctAnswer: "descer", rationale: "O kanji 降りる significa \"descer\". Observe o desenho como pista visual." }
  - pageNumber: 2
    title: Verbos de movimento no passado
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "行きました (fui/vou/estou indo/vou ir)", correctAnswer: "fui" }
      - { type: japanese_vocab, question: "来ました (vim/venho/estou vindo/vou vir)", correctAnswer: "vim" }
      - { type: japanese_vocab, question: "帰りました (voltei/volto/estou voltando/vou voltar)", correctAnswer: "voltei", rationale: "O kanji 帰りました significa \"voltei\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "入りました (entrei/entro/estou entrando/vou entrar)", correctAnswer: "entrei", rationale: "O kanji 入りました significa \"entrei\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "出ました (saí/saio/estou saindo/vou sair)", correctAnswer: "saí", rationale: "O kanji 出ました significa \"saí\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "走りました (corri/corro/estou correndo/vou correr)", correctAnswer: "corri", rationale: "O kanji 走りました significa \"corri\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "歩きました (andei/ando/estou andando/vou andar)", correctAnswer: "andei", rationale: "O kanji 歩きました significa \"andei\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "止まりました (parei/paro/estou parando/vou parar)", correctAnswer: "parei", rationale: "O kanji 止まりました significa \"parei\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "乗りました (subi/subo/estou subindo/vou subir)", correctAnswer: "subi" }
      - { type: japanese_vocab, question: "降りました (desci/desço/estou descendo/vou descer)", correctAnswer: "desci", rationale: "O kanji 降りました significa \"desci\". Observe o desenho como pista visual." }
  - pageNumber: 3
    title: Frases de movimento
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "毎日学校へ行きます。 (Vou à escola todo dia./Vou à escola às vezes./Nunca vou à escola./Vou à escola amanhã.)", correctAnswer: "Vou à escola todo dia.", rationale: "O kanji 毎日学校へ行きます。 significa \"Vou à escola todo dia.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "昨日家に帰りました。 (Voltei para casa ontem./Vou para casa hoje./Vou voltar amanhã./Saí de casa ontem.)", correctAnswer: "Voltei para casa ontem.", rationale: "O kanji 昨日家に帰りました。 significa \"Voltei para casa ontem.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "友だちが来ました。 (Meu amigo veio./Meu amigo vai vir./Meu amigo vem sempre./Meu amigo não vem.)", correctAnswer: "Meu amigo veio.", rationale: "O kanji 友だちが来ました。 significa \"Meu amigo veio.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "部屋に入ってください。 (Entre no quarto, por favor./Saia do quarto, por favor./Fique no quarto, por favor./Feche o quarto.)", correctAnswer: "Entre no quarto, por favor.", rationale: "O kanji 部屋に入ってください。 significa \"Entre no quarto, por favor.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "電車に乗ります。 (Pego o trem./Desço do trem./Vejo o trem./Vou de trem.)", correctAnswer: "Pego o trem.", rationale: "O kanji 電車に乗ります。 significa \"Pego o trem.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "バスを降りました。 (Desci do ônibus./Subi no ônibus./Vou de ônibus./Perdi o ônibus.)", correctAnswer: "Desci do ônibus.", rationale: "O kanji バスを降りました。 significa \"Desci do ônibus.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "公園を歩きました。 (Caminhei pelo parque./Corri pelo parque./Dormi no parque./Fui ao parque.)", correctAnswer: "Caminhei pelo parque.", rationale: "O kanji 公園を歩きました。 significa \"Caminhei pelo parque.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "車が止まった。 (O carro parou./O carro andou./O carro acelerou./O carro quebrou.)", correctAnswer: "O carro parou.", rationale: "O kanji 車が止まった。 significa \"O carro parou.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "学校から出ました。 (Saí da escola./Entrei na escola./Cheguei na escola./Fui à escola.)", correctAnswer: "Saí da escola.", rationale: "O kanji 学校から出ました。 significa \"Saí da escola.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "犬と一緒に走ります。 (Corro com o cachorro./Ando com o cachorro./Brinco com o cachorro./Durmo com o cachorro.)", correctAnswer: "Corro com o cachorro.", rationale: "O kanji 犬と一緒に走ります。 significa \"Corro com o cachorro.\". Observe o desenho como pista visual." }
target: 30
