title: Palavras de pergunta — revisão completa
level: 'C'
subject: japanese
example: "何 (o que), だれ (quem), どこ (onde), いつ (quando), なぜ (por quê), どう (como)"
pages:
  - pageNumber: 1
    title: Palavras de pergunta
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "何 (o que/quem/onde/quando)", correctAnswer: "o que" }
      - { type: japanese_vocab, question: "だれ (quem/o que/onde/quando)", correctAnswer: "quem" }
      - { type: japanese_vocab, question: "どこ (onde/quando/como/quanto)", correctAnswer: "onde" }
      - { type: japanese_vocab, question: "いつ (quando/como/quanto/por quê)", correctAnswer: "quando" }
      - { type: japanese_vocab, question: "なぜ (por quê/como/quanto/onde)", correctAnswer: "por quê" }
      - { type: japanese_vocab, question: "どう (como/quanto/onde/quando)", correctAnswer: "como" }
      - { type: japanese_vocab, question: "いくら (quanto custa/quantos/como/onde)", correctAnswer: "quanto custa" }
      - { type: japanese_vocab, question: "いくつ (quantos/quanto custa/como/onde)", correctAnswer: "quantos" }
      - { type: japanese_vocab, question: "どの (qual livro/qual de dois/onde/quando)", correctAnswer: "qual livro" }
      - { type: japanese_vocab, question: "どちら (qual de dois/onde/quando/como)", correctAnswer: "qual de dois" }
  - pageNumber: 2
    title: Formar perguntas
    description: Escolha a palavra de pergunta correta.
    exercises:
      - { type: japanese_vocab, question: "'Que lugar é este?': ここは___ですか。 (どこ/なに/だれ/いつ)", correctAnswer: "どこ" }
      - { type: japanese_vocab, question: "'Quem é você?': あなたは___ですか。 (だれ/どこ/なに/いつ)", correctAnswer: "だれ" }
      - { type: japanese_vocab, question: "'O que é isso?': それは___ですか。 (なに/だれ/どこ/いつ)", correctAnswer: "なに" }
      - { type: japanese_vocab, question: "'Quando volta?': ___帰りますか。 (いつ/どこ/だれ/なに)", correctAnswer: "いつ" }
      - { type: japanese_vocab, question: "'Por quê?': ___ですか。 (なぜ/どう/どこ/いつ)", correctAnswer: "なぜ" }
      - { type: japanese_vocab, question: "'Como está?': ___ですか。 (どう/なぜ/どこ/いつ)", correctAnswer: "どう" }
      - { type: japanese_vocab, question: "'Quanto custa?': ___ですか。 (いくら/いくつ/どれ/どの)", correctAnswer: "いくら" }
      - { type: japanese_vocab, question: "'Quantos?': ___ありますか。 (いくつ/いくら/どれ/どの)", correctAnswer: "いくつ" }
      - { type: japanese_vocab, question: "'Qual livro?' ___本ですか。 (どの/どれ/どちら/どう)", correctAnswer: "どの" }
      - { type: japanese_vocab, question: "'Qual de dois?' ___が好きですか。 (どちら/どの/どれ/どう)", correctAnswer: "どちら" }
  - pageNumber: 3
    title: Mini-diálogos com perguntas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "「お名前は何ですか」「田中です」 (Meu nome é Tanaka./Meu nome é Sato./Onde você mora?/Quem é você?)", correctAnswer: "Meu nome é Tanaka." }
      - { type: japanese_vocab, question: "「どこから来ましたか」「ブラジルから来ました」 (Vim do Brasil./Vou ao Brasil./Moro no Brasil./Saí do Brasil.)", correctAnswer: "Vim do Brasil." }
      - { type: japanese_vocab, question: "「何時に会いますか」「三時に会いましょう」 (Vamos nos encontrar às 3h./Nos encontramos às 2h./Hoje às 3h./Amanhã às 3h.)", correctAnswer: "Vamos nos encontrar às 3h." }
      - { type: japanese_vocab, question: "「これはいくらですか」「千円です」 (Custa 1000 ienes./Custa 100 ienes./Custa 10 mil ienes./É de graça.)", correctAnswer: "Custa 1000 ienes." }
      - { type: japanese_vocab, question: "「どうしましたか」「頭が痛いです」 (A cabeça está doendo./Estou bem./Fui ao médico./Cheguei atrasado.)", correctAnswer: "A cabeça está doendo." }
      - { type: japanese_vocab, question: "「どちらが好きですか」「紅茶が好きです」 (Gosto de chá preto./Gosto de café./Gosto de ambos./Não gosto.)", correctAnswer: "Gosto de chá preto." }
      - { type: japanese_vocab, question: "「何人家族ですか」「四人家族です」 (Somos quatro na família./Somos três./Somos cinco./Estou sozinho.)", correctAnswer: "Somos quatro na família." }
      - { type: japanese_vocab, question: "「どの電車で行きますか」「赤い電車で行きます」 (Vou no trem vermelho./Vou no trem azul./Vou de ônibus./Vou a pé.)", correctAnswer: "Vou no trem vermelho." }
      - { type: japanese_vocab, question: "「いつ日本に行きますか」「来月行きます」 (Vou no próximo mês./Fui mês passado./Estou no Japão./Nunca vou.)", correctAnswer: "Vou no próximo mês." }
      - { type: japanese_vocab, question: "「どうして泣いているんですか」「悲しいからです」 (Porque estou triste./Porque estou feliz./Não estou chorando./Estou bem.)", correctAnswer: "Porque estou triste." }
