title: 📝 Palavras de pergunta — revisão completa
level: 'C'
subject: japanese
objectives: [japanese.vocab]
difficulty: 5
authorNotes: "Palavras de pergunta — revisão completa. Foque no conceito central do conjunto e nos erros comuns."
example: "何 (o que), だれ (quem), どこ (onde), いつ (quando), なぜ (por quê), どう (como). Ex.: 何 → o que."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Palavras de pergunta
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "何 (onde/quando/o que/quem)", correctAnswer: "o que", rationale: "O kanji 何 significa \"o que\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "だれ (o que/quando/quem/onde)", correctAnswer: "quem", rationale: "だれ lê-se \"quem\" (romaji).", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どこ (quanto/onde/quando/como)", correctAnswer: "onde", rationale: "どこ lê-se \"onde\" (romaji).", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いつ (como/quando/por quê/quanto)", correctAnswer: "quando", rationale: "いつ (hiragana) significa \"quando\" em português.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "なぜ (como/quanto/onde/por quê)", correctAnswer: "por quê", rationale: "なぜ (hiragana) significa \"por quê\" em português.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どう (onde/quanto/como/quando)", correctAnswer: "como", rationale: "どう lê-se \"como\" (romaji).", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いくら (quantos/onde/como/quanto custa)", correctAnswer: "quanto custa", rationale: "いくら (hiragana) significa \"quanto custa\" em português.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いくつ (quantos/como/onde/quanto custa)", correctAnswer: "quantos", rationale: "いくつ (hiragana) significa \"quantos\" em português.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どの (qual livro/onde/qual de dois/quando)", correctAnswer: "qual livro", rationale: "どの (hiragana) significa \"qual livro\" em português.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どちら (qual de dois/quando/onde/como)", correctAnswer: "qual de dois", rationale: "どちら (hiragana) significa \"qual de dois\" em português.", difficulty: 5, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Formar perguntas
    description: Escolha a palavra de pergunta correta.
    exercises:
      - { type: japanese_vocab, question: "'Que lugar é este?': ここは___ですか。 (なに/どこ/いつ/だれ)", correctAnswer: "どこ", rationale: "\"'Que lugar é este?': ここは___ですか。\" em japonês escreve-se どこ.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "'Quem é você?': あなたは___ですか。 (どこ/なに/いつ/だれ)", correctAnswer: "だれ", rationale: "\"'Quem é você?': あなたは___ですか。\" em japonês escreve-se だれ.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "'O que é isso?': それは___ですか。 (だれ/いつ/なに/どこ)", correctAnswer: "なに", rationale: "\"'O que é isso?': それは___ですか。\" em japonês escreve-se なに.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "'Quando volta?': ___帰りますか。 (どこ/なに/いつ/だれ)", correctAnswer: "いつ", rationale: "'Quando volta?': ___帰りますか。 lê-se いつ. Pratique associar o traço ao som.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "'Por quê?': ___ですか。 (どこ/いつ/どう/なぜ)", correctAnswer: "なぜ", rationale: "\"'Por quê?': ___ですか。\" em japonês escreve-se なぜ.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "'Como está?': ___ですか。 (どこ/いつ/なぜ/どう)", correctAnswer: "どう", rationale: "\"'Como está?': ___ですか。\" em japonês escreve-se どう.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "'Quanto custa?': ___ですか。 (いくら/どれ/いくつ/どの)", correctAnswer: "いくら", rationale: "\"'Quanto custa?': ___ですか。\" em japonês escreve-se いくら.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "'Quantos?': ___ありますか。 (いくつ/どれ/いくら/どの)", correctAnswer: "いくつ", rationale: "\"'Quantos?': ___ありますか。\" em japonês escreve-se いくつ.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "'Qual livro?' ___本ですか。 (どれ/どう/どの/どちら)", correctAnswer: "どの", rationale: "'Qual livro?' ___本ですか。 lê-se どの. Pratique associar o traço ao som.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "'Qual de dois?' ___が好きですか。 (どの/どれ/どう/どちら)", correctAnswer: "どちら", rationale: "'Qual de dois?' ___が好きですか。 lê-se どちら. Pratique associar o traço ao som.", difficulty: 5, objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Mini-diálogos com perguntas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "「お名前は何ですか」「田中です」 (Meu nome é Tanaka./Meu nome é Sato./Onde você mora?/Quem é você?)", correctAnswer: "Meu nome é Tanaka.", rationale: "O kanji 「お名前は何ですか」「田中です」 significa \"Meu nome é Tanaka.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「どこから来ましたか」「ブラジルから来ました」 (Vim do Brasil./Moro no Brasil./Vou ao Brasil./Saí do Brasil.)", correctAnswer: "Vim do Brasil.", rationale: "O kanji 「どこから来ましたか」「ブラジルから来ました」 significa \"Vim do Brasil.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「何時に会いますか」「三時に会いましょう」 (Nos encontramos às 2h./Amanhã às 3h./Vamos nos encontrar às 3h./Hoje às 3h.)", correctAnswer: "Vamos nos encontrar às 3h.", rationale: "O kanji 「何時に会いますか」「三時に会いましょう」 significa \"Vamos nos encontrar às 3h.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「これはいくらですか」「千円です」 (Custa 10 mil ienes./É de graça./Custa 100 ienes./Custa 1000 ienes.)", correctAnswer: "Custa 1000 ienes.", rationale: "O kanji 「これはいくらですか」「千円です」 significa \"Custa 1000 ienes.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「どうしましたか」「頭が痛いです」 (Fui ao médico./Estou bem./A cabeça está doendo./Cheguei atrasado.)", correctAnswer: "A cabeça está doendo.", rationale: "O kanji 「どうしましたか」「頭が痛いです」 significa \"A cabeça está doendo.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「どちらが好きですか」「紅茶が好きです」 (Gosto de chá preto./Gosto de ambos./Não gosto./Gosto de café.)", correctAnswer: "Gosto de chá preto.", rationale: "O kanji 「どちらが好きですか」「紅茶が好きです」 significa \"Gosto de chá preto.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「何人家族ですか」「四人家族です」 (Somos quatro na família./Somos cinco./Somos três./Estou sozinho.)", correctAnswer: "Somos quatro na família.", rationale: "O kanji 「何人家族ですか」「四人家族です」 significa \"Somos quatro na família.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「どの電車で行きますか」「赤い電車で行きます」 (Vou no trem azul./Vou de ônibus./Vou a pé./Vou no trem vermelho.)", correctAnswer: "Vou no trem vermelho.", rationale: "O kanji 「どの電車で行きますか」「赤い電車で行きます」 significa \"Vou no trem vermelho.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「いつ日本に行きますか」「来月行きます」 (Estou no Japão./Nunca vou./Fui mês passado./Vou no próximo mês.)", correctAnswer: "Vou no próximo mês.", rationale: "O kanji 「いつ日本に行きますか」「来月行きます」 significa \"Vou no próximo mês.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「どうして泣いているんですか」「悲しいからです」 (Não estou chorando./Porque estou feliz./Porque estou triste./Estou bem.)", correctAnswer: "Porque estou triste.", rationale: "O kanji 「どうして泣いているんですか」「悲しいからです」 significa \"Porque estou triste.\". Observe o desenho como pista visual.", difficulty: 5, objectives: [japanese.vocab] }
target: 30
