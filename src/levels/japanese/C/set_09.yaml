title: Palavras de pergunta — revisão completa
level: 'C'
subject: japanese
difficulty: 5
authorNotes: "Palavras de pergunta — revisão completa. Foque no conceito central do conjunto e nos erros comuns."
example: "何 (o que), だれ (quem), どこ (onde), いつ (quando), なぜ (por quê), どう (como). Ex.: 何 → o que."
pages:
  - pageNumber: 1
    title: Palavras de pergunta
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "何 (o que/quem/onde/quando)", correctAnswer: "o que", rationale: "O kanji 何 significa \"o que\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "だれ (quem/o que/onde/quando)", correctAnswer: "quem", rationale: "だれ lê-se \"quem\" (romaji)." }
      - { type: japanese_vocab, question: "どこ (onde/quando/como/quanto)", correctAnswer: "onde", rationale: "どこ lê-se \"onde\" (romaji)." }
      - { type: japanese_vocab, question: "いつ (quando/como/quanto/por quê)", correctAnswer: "quando", rationale: "いつ (hiragana) significa \"quando\" em português." }
      - { type: japanese_vocab, question: "なぜ (por quê/como/quanto/onde)", correctAnswer: "por quê", rationale: "なぜ (hiragana) significa \"por quê\" em português." }
      - { type: japanese_vocab, question: "どう (como/quanto/onde/quando)", correctAnswer: "como", rationale: "どう lê-se \"como\" (romaji)." }
      - { type: japanese_vocab, question: "いくら (quanto custa/quantos/como/onde)", correctAnswer: "quanto custa", rationale: "いくら (hiragana) significa \"quanto custa\" em português." }
      - { type: japanese_vocab, question: "いくつ (quantos/quanto custa/como/onde)", correctAnswer: "quantos", rationale: "いくつ (hiragana) significa \"quantos\" em português." }
      - { type: japanese_vocab, question: "どの (qual livro/qual de dois/onde/quando)", correctAnswer: "qual livro", rationale: "どの (hiragana) significa \"qual livro\" em português." }
      - { type: japanese_vocab, question: "どちら (qual de dois/onde/quando/como)", correctAnswer: "qual de dois", rationale: "どちら (hiragana) significa \"qual de dois\" em português." }
  - pageNumber: 2
    title: Formar perguntas
    description: Escolha a palavra de pergunta correta.
    exercises:
      - { type: japanese_vocab, question: "'Que lugar é este?': ここは___ですか。 (どこ/なに/だれ/いつ)", correctAnswer: "どこ", rationale: "\"'Que lugar é este?': ここは___ですか。\" em japonês escreve-se どこ." }
      - { type: japanese_vocab, question: "'Quem é você?': あなたは___ですか。 (だれ/どこ/なに/いつ)", correctAnswer: "だれ", rationale: "\"'Quem é você?': あなたは___ですか。\" em japonês escreve-se だれ." }
      - { type: japanese_vocab, question: "'O que é isso?': それは___ですか。 (なに/だれ/どこ/いつ)", correctAnswer: "なに", rationale: "\"'O que é isso?': それは___ですか。\" em japonês escreve-se なに." }
      - { type: japanese_vocab, question: "'Quando volta?': ___帰りますか。 (いつ/どこ/だれ/なに)", correctAnswer: "いつ", rationale: "'Quando volta?': ___帰りますか。 lê-se いつ. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "'Por quê?': ___ですか。 (なぜ/どう/どこ/いつ)", correctAnswer: "なぜ", rationale: "\"'Por quê?': ___ですか。\" em japonês escreve-se なぜ." }
      - { type: japanese_vocab, question: "'Como está?': ___ですか。 (どう/なぜ/どこ/いつ)", correctAnswer: "どう", rationale: "\"'Como está?': ___ですか。\" em japonês escreve-se どう." }
      - { type: japanese_vocab, question: "'Quanto custa?': ___ですか。 (いくら/いくつ/どれ/どの)", correctAnswer: "いくら", rationale: "\"'Quanto custa?': ___ですか。\" em japonês escreve-se いくら." }
      - { type: japanese_vocab, question: "'Quantos?': ___ありますか。 (いくつ/いくら/どれ/どの)", correctAnswer: "いくつ", rationale: "\"'Quantos?': ___ありますか。\" em japonês escreve-se いくつ." }
      - { type: japanese_vocab, question: "'Qual livro?' ___本ですか。 (どの/どれ/どちら/どう)", correctAnswer: "どの", rationale: "'Qual livro?' ___本ですか。 lê-se どの. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "'Qual de dois?' ___が好きですか。 (どちら/どの/どれ/どう)", correctAnswer: "どちら", rationale: "'Qual de dois?' ___が好きですか。 lê-se どちら. Pratique associar o traço ao som." }
  - pageNumber: 3
    title: Mini-diálogos com perguntas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "「お名前は何ですか」「田中です」 (Meu nome é Tanaka./Meu nome é Sato./Onde você mora?/Quem é você?)", correctAnswer: "Meu nome é Tanaka.", rationale: "O kanji 「お名前は何ですか」「田中です」 significa \"Meu nome é Tanaka.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「どこから来ましたか」「ブラジルから来ました」 (Vim do Brasil./Vou ao Brasil./Moro no Brasil./Saí do Brasil.)", correctAnswer: "Vim do Brasil.", rationale: "O kanji 「どこから来ましたか」「ブラジルから来ました」 significa \"Vim do Brasil.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「何時に会いますか」「三時に会いましょう」 (Vamos nos encontrar às 3h./Nos encontramos às 2h./Hoje às 3h./Amanhã às 3h.)", correctAnswer: "Vamos nos encontrar às 3h.", rationale: "O kanji 「何時に会いますか」「三時に会いましょう」 significa \"Vamos nos encontrar às 3h.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「これはいくらですか」「千円です」 (Custa 1000 ienes./Custa 100 ienes./Custa 10 mil ienes./É de graça.)", correctAnswer: "Custa 1000 ienes.", rationale: "O kanji 「これはいくらですか」「千円です」 significa \"Custa 1000 ienes.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「どうしましたか」「頭が痛いです」 (A cabeça está doendo./Estou bem./Fui ao médico./Cheguei atrasado.)", correctAnswer: "A cabeça está doendo.", rationale: "O kanji 「どうしましたか」「頭が痛いです」 significa \"A cabeça está doendo.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「どちらが好きですか」「紅茶が好きです」 (Gosto de chá preto./Gosto de café./Gosto de ambos./Não gosto.)", correctAnswer: "Gosto de chá preto.", rationale: "O kanji 「どちらが好きですか」「紅茶が好きです」 significa \"Gosto de chá preto.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「何人家族ですか」「四人家族です」 (Somos quatro na família./Somos três./Somos cinco./Estou sozinho.)", correctAnswer: "Somos quatro na família.", rationale: "O kanji 「何人家族ですか」「四人家族です」 significa \"Somos quatro na família.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「どの電車で行きますか」「赤い電車で行きます」 (Vou no trem vermelho./Vou no trem azul./Vou de ônibus./Vou a pé.)", correctAnswer: "Vou no trem vermelho.", rationale: "O kanji 「どの電車で行きますか」「赤い電車で行きます」 significa \"Vou no trem vermelho.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「いつ日本に行きますか」「来月行きます」 (Vou no próximo mês./Fui mês passado./Estou no Japão./Nunca vou.)", correctAnswer: "Vou no próximo mês.", rationale: "O kanji 「いつ日本に行きますか」「来月行きます」 significa \"Vou no próximo mês.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「どうして泣いているんですか」「悲しいからです」 (Porque estou triste./Porque estou feliz./Não estou chorando./Estou bem.)", correctAnswer: "Porque estou triste.", rationale: "O kanji 「どうして泣いているんですか」「悲しいからです」 significa \"Porque estou triste.\". Observe o desenho como pista visual." }
target: 30
