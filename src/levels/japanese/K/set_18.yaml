title: 📝 ～に越したことはない (o melhor é / nada melhor que)
level: 'K'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "に越したことはない expressa que algo é o ideal, embora não seja obrigatório: 'o melhor seria / nada melhor que'. Tom de conselho ideal, não de obrigação. Diferente de べきだ."
example: "早いに越したことはない。 Ex.: ～に越したことはない → 'o melhor é / nada melhor que (ideal, não obrigação)'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～に越したことはない
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "安全に越したことはない。 (A segurança é desnecessária./O melhor é a segurança / nada melhor que a segurança./A segurança é obrigatória./A segurança é prejudicial.)", correctAnswer: "O melhor é a segurança / nada melhor que a segurança.", rationale: "に越したことはない → 'o melhor seria / nada melhor que'. 安全に越したことはない → nada supera a segurança.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に越したことはない implica que (é impossível/é obrigatório/é o ideal embora não seja absolutamente necessário/é proibido)", correctAnswer: "é o ideal embora não seja absolutamente necessário", rationale: "に越したことはない → é o melhor / ideal. Não é obrigação como べきだ. É conselho sobre o que é mais desejável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "準備は早いに越したことはない。 (A preparação atrasada é melhor./O mais cedo a preparação, melhor / nada melhor que preparar cedo./A preparação é desnecessária./Preparar cedo não tem vantagem.)", correctAnswer: "O mais cedo a preparação, melhor / nada melhor que preparar cedo.", rationale: "早いに越したことはない → nada melhor que ser cedo. Conselho sobre o ideal de antecipar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に越したことはない vs べきだ (に越したことはない = ideal/desejável; べきだ = obrigatório/são idênticos/べきだ = ideal; に越したことはない = obrigatório/ambos são proibições)", correctAnswer: "に越したことはない = ideal/desejável; べきだ = obrigatório", rationale: "に越したことはない → o melhor / ideal. べきだ → moral obrigatório. に越したことはない é mais suave.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お金は多いに越したことはない。 (A quantidade de dinheiro não importa./Ter pouco dinheiro é melhor./Nada melhor que ter mais dinheiro./Ter muito dinheiro é prejudicial.)", correctAnswer: "Nada melhor que ter mais dinheiro.", rationale: "多いに越したことはない → nada melhor que ter bastante. Reconhece que mais é sempre melhor (no ideal).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に越したことはない pode seguir (apenas substantivos/apenas adjetivos-い/adjetivos-い e adjetivos-な na forma の, verbos e nominais/apenas verbos)", correctAnswer: "adjetivos-い e adjetivos-な na forma の, verbos e nominais", rationale: "Adj-い: 早いに越したことはない. Adj-な: 安全なに越したことはない. V辞書形: 知るに越したことはない.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "知っているに越したことはない。 (Saber é obrigatório./É melhor não saber./Nada melhor que saber./Saber é prejudicial.)", correctAnswer: "Nada melhor que saber.", rationale: "知っているに越したことはない → nada melhor que saber. Valor do conhecimento como ideal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に越したことはない é frequente em (críticas severas/ameaças/conselhos práticos/proibições legais)", correctAnswer: "conselhos práticos", rationale: "に越したことはない é o padrão ideal para conselhos práticos: 'o melhor seria X, embora não seja obrigatório'.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "問題は少ないに越したことはない。 (Quanto mais problemas, melhor./Nada melhor que ter menos problemas./Problemas são necessários./A quantidade de problemas não importa.)", correctAnswer: "Nada melhor que ter menos problemas.", rationale: "少ないに越したことはない → nada melhor que ser pouco. O ideal é minimizar problemas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "越す (こす) significa literalmente (atrasar/ultrapassar/ficar/desaparecer)", correctAnswer: "ultrapassar", rationale: "越す → ultrapassar/exceder. に越したことはない → não há nada que ultrapasse → nada supera → o melhor.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases práticas com ～に越したことはない
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "旅行前に保険に入っておくに越したことはない。 (Não há necessidade de seguro antes de viajar./Nada melhor que contratar seguro antes de viajar./O seguro de viagem é obrigatório./O seguro prejudica a viagem.)", correctAnswer: "Nada melhor que contratar seguro antes de viajar.", rationale: "保険に入っておくに越したことはない → nada melhor que ter seguro. Conselho prático prudente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康は良いに越したことはないが、維持するのは難しい。 (Saúde ruim é preferível./Nada melhor que boa saúde, mas mantê-la é difícil./Ter saúde é obrigatório./A saúde não tem valor.)", correctAnswer: "Nada melhor que boa saúde, mas mantê-la é difícil.", rationale: "健康は良いに越したことはない → nada melhor que boa saúde. が indica a ressalva da dificuldade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に越したことはない vs ほうがいい (に越したことはない é mais absoluto: 'nada supera'; ほうがいい = 'é melhor' numa comparação/são completamente idênticos/ほうがいい é mais absoluto/に越したことはない é mais coloquial)", correctAnswer: "に越したことはない é mais absoluto: 'nada supera'; ほうがいい = 'é melhor' numa comparação", rationale: "に越したことはない afirma superioridade absoluta. ほうがいい é comparativo relativo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書類はコピーを取っておくに越したことはない。 (Não há necessidade de copiar documentos./Nada melhor que tirar cópias dos documentos./Copiar documentos é obrigatório./Copiar documentos é inútil.)", correctAnswer: "Nada melhor que tirar cópias dos documentos.", rationale: "コピーを取っておくに越したことはない → nada melhor que guardar cópias. Precaução prática.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "信頼できる友人がいるに越したことはない。 (Não há necessidade de amigos confiáveis./Nada melhor que ter amigos confiáveis./Amigos confiáveis são obrigatórios./Amigos confiáveis são prejudiciais.)", correctAnswer: "Nada melhor que ter amigos confiáveis.", rationale: "信頼できる友人がいるに越したことはない → nada melhor que ter amigos de confiança.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に越したことはない expressa que o falante (impõe obrigação/aconselha sobre o ideal sem obrigar/proíbe/questiona)", correctAnswer: "aconselha sobre o ideal sem obrigar", rationale: "に越したことはない é um conselho sobre o que seria mais desejável, sem forçar obrigação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "危機管理は万全に越したことはない。 (Gestão de crises ruim é preferível./Nada melhor que gestão de crises perfeita./Gestão de crises perfeita é obrigatória./A gestão de crises não importa.)", correctAnswer: "Nada melhor que gestão de crises perfeita.", rationale: "万全に越したことはない → nada melhor que ser completo/perfeito. 万全 → perfeição/completude.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "語学は若いうちに学ぶに越したことはない。 (É melhor aprender idiomas tarde./Nada melhor que aprender idiomas quando jovem./Aprender idiomas jovem é obrigatório./Aprender idiomas jovem é inútil.)", correctAnswer: "Nada melhor que aprender idiomas quando jovem.", rationale: "若いうちに学ぶに越したことはない → nada melhor que aprender jovem. Conselho sobre timing ideal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "確認は何度もするに越したことはない。 (Confirmar poucas vezes é melhor./Nada melhor que confirmar várias vezes./Confirmar muitas vezes é obrigatório./Confirmar é inútil.)", correctAnswer: "Nada melhor que confirmar várias vezes.", rationale: "何度もするに越したことはない → nada melhor que fazer várias vezes. Precaução como ideal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "困ったときに頼れる人がいるに越したことはない。 (Não há necessidade de alguém em quem confiar./Nada melhor que ter alguém em quem confiar em momentos difíceis./Depender de outros é prejudicial./A independência é sempre melhor.)", correctAnswer: "Nada melhor que ter alguém em quem confiar em momentos difíceis.", rationale: "頼れる人がいるに越したことはない → nada melhor que ter apoio. Valor das relações humanas.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
