title: 📝 ～というものだ (é isso que se chama de)
level: 'K'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "というものだ afirma que algo é o que verdadeiramente se chama de X: 'é isso que se chama de / isso é o que realmente é'. Usado para definições enfáticas, críticas ou elogios sobre a natureza de algo."
example: "困った時に助け合う、それが友情というものだ。 Ex.: ～というものだ → 'é isso que se chama de / é justamente o que é'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～というものだ
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "それが本当の勇気というものだ。 (Isso é uma forma de covardia./Isso pode ser coragem./Isso é o que se chama de verdadeira coragem./Isso não é coragem de forma alguma.)", correctAnswer: "Isso é o que se chama de verdadeira coragem.", rationale: "というものだ → 'é isso que se chama de / é justamente'. Define enfaticamente a natureza de algo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものだ é usado para (indicar tempo/descrever ações rotineiras/fazer definições enfáticas sobre a natureza de algo/indicar possibilidade)", correctAnswer: "fazer definições enfáticas sobre a natureza de algo", rationale: "というものだ define, classifica ou avalia enfaticamente a natureza ou essência de algo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お互いを尊重する、それが良い関係というものだ。 (Um bom relacionamento não requer respeito./Bom relacionamento talvez seja respeito mútuo./Isso é o que se chama de um bom relacionamento./Respeito mútuo não define um bom relacionamento.)", correctAnswer: "Isso é o que se chama de um bom relacionamento.", rationale: "良い関係というものだ → é isso que se chama de um bom relacionamento. Definição enfática.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものだ pode expressar (crítica sobre comportamento inadequado/apenas elogios/apenas definições neutras/apenas fatos científicos)", correctAnswer: "crítica sobre comportamento inadequado", rationale: "というものだ pode criticar: それは非常識というものだ → isso é o que se chama de falta de senso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "失敗を恐れない、それが挑戦というものだ。 (Desafio não tem a ver com medo de fracasso./Talvez desafio seja não temer o fracasso./Isso é o que se chama de desafio./Não temer o fracasso não é desafio.)", correctAnswer: "Isso é o que se chama de desafio.", rationale: "挑戦というものだ → é isso que se chama de desafio. Define a essência do desafio de forma enfática.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "プライバシーを守らないのは失礼というものだ。 (Talvez não proteger a privacidade seja falta de educação./Isso é o que se chama de falta de educação — não proteger a privacidade./Proteger a privacidade é falta de educação./A privacidade não tem relação com educação.)", correctAnswer: "Isso é o que se chama de falta de educação — não proteger a privacidade.", rationale: "失礼というものだ → é o que se chama de falta de educação. Crítica enfática ao comportamento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものだ vs というものではない (というものだ afirma que é; というものではない nega que seja/são completamente opostos em estrutura/というものではない afirma; というものだ nega/são idênticos)", correctAnswer: "というものだ afirma que é; というものではない nega que seja", rationale: "というものだ → 'é isso que é'. というものではない → 'não é bem assim / não é necessariamente assim'.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "他人を思いやる気持ち、それが人間としての品格というものだ。 (Talvez dignidade humana seja empatia./A empatia pelos outros é o que se chama de dignidade como ser humano./Empatia não tem relação com dignidade./Dignidade humana não exige empatia.)", correctAnswer: "A empatia pelos outros é o que se chama de dignidade como ser humano.", rationale: "品格というものだ → é o que se chama de dignidade. Define a essência da dignidade humana.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものだ pode ser precedido por (apenas substantivos/apenas verbos na forma plana/substantivos, adjetivos e verbos na forma plana/apenas adjetivos-い)", correctAnswer: "substantivos, adjetivos e verbos na forma plana", rationale: "N というものだ、Adj というものだ、V というものだ — todas as formas são possíveis.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友人が困った時に助けるのが、本当の友情というものだ。 (Talvez amizade verdadeira seja ajudar amigos./Ajudar amigos quando precisam é o que se chama de verdadeira amizade./A amizade verdadeira não requer ajuda./Ajudar não define amizade.)", correctAnswer: "Ajudar amigos quando precisam é o que se chama de verdadeira amizade.", rationale: "本当の友情というものだ → é o que se chama de verdadeira amizade. Definição da essência.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases formais com ～というものだ
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "知っていて教えないのは不親切というものだ。 (Talvez seja indelicado saber e não ensinar./Saber e não ensinar é o que se chama de indelicadeza./Ensinar sem saber é indelicado./A indelicadeza não tem relação com ensinar.)", correctAnswer: "Saber e não ensinar é o que se chama de indelicadeza.", rationale: "不親切というものだ → é o que se chama de indelicadeza. Crítica ao comportamento de não compartilhar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "規則を守ることが社会生活の基本というものだ。 (Talvez seguir regras seja básico na vida social./Seguir regras é o que se chama de a base da vida em sociedade./Seguir regras não é necessário./A base da vida social não inclui regras.)", correctAnswer: "Seguir regras é o que se chama de a base da vida em sociedade.", rationale: "社会生活の基本というものだ → é o que se chama de a base da vida em sociedade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものだ vs というものではない: qual usar para 'saúde não é garantida só por comer bem'? (というものだ/というものではない/どちらでもいい/両方使えない)", correctAnswer: "というものではない", rationale: "食べれば健康になるというものではない → não é que comer seja suficiente para a saúde. Nega generalização.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "全力を尽くして初めて達成感を味わえる。それが本当の成功というものだ。 (Talvez sucesso verdadeiro seja dar o máximo./Dar o máximo e só então sentir realização — isso é o que se chama de verdadeiro sucesso./O sucesso verdadeiro não requer esforço./A realização não define o sucesso.)", correctAnswer: "Dar o máximo e só então sentir realização — isso é o que se chama de verdadeiro sucesso.", rationale: "本当の成功というものだ → é o que se chama de verdadeiro sucesso. Definição que enfatiza processo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "相手の立場を考えて行動する、それが大人というものだ。 (Talvez adulto seja considerar a posição do outro./Agir considerando a posição do outro é o que se chama de ser adulto./Adultos não precisam considerar o outro./Considerar o outro não define maturidade.)", correctAnswer: "Agir considerando a posição do outro é o que se chama de ser adulto.", rationale: "大人というものだ → é o que se chama de ser adulto. Define a maturidade de forma enfática.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "証拠もなく人を責めるのは不当というものだ。 (Talvez seja injusto acusar sem provas./Acusar alguém sem provas é o que se chama de injustiça./Acusar sem provas é aceitável./A injustiça não tem relação com provas.)", correctAnswer: "Acusar alguém sem provas é o que se chama de injustiça.", rationale: "不当というものだ → é o que se chama de injustiça. Crítica enfática a uma prática injusta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経験から学ぶことが教育の本質というものだ。 (Talvez aprender com a experiência seja essencial./Aprender com a experiência é o que se chama de a essência da educação./A essência da educação não inclui experiência./Experiência e educação não têm relação.)", correctAnswer: "Aprender com a experiência é o que se chama de a essência da educação.", rationale: "教育の本質というものだ → é a essência da educação. Define o cerne da educação de forma enfática.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものだ tem tom de (neutro/enfático, com convicção/dúvida/possibilidade)", correctAnswer: "enfático, com convicção", rationale: "というものだ expressa convicção sobre a definição ou natureza de algo. Tom firme e assertivo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "他人に嘘をつくのは恥ずかしいというものだ。 (Talvez mentir seja vergonhoso./Mentir para os outros é o que se chama de vergonha./Mentir não é vergonhoso./Vergonha não tem relação com mentira.)", correctAnswer: "Mentir para os outros é o que se chama de vergonha.", rationale: "恥ずかしいというものだ → é o que se chama de vergonhoso. Julgamento moral com convicção.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものだ expressa que o falante (tem dúvida/tem convicção sobre a natureza/está reportando algo ouvido/está fazendo uma pergunta)", correctAnswer: "tem convicção sobre a natureza", rationale: "というものだ marca o ponto de vista firme do falante sobre o que algo é ou representa.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
