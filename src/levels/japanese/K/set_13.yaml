title: 📝 ～に際して avançado (contextos formais)
level: 'K'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Uso avançado de に際して: análise de contextos formais complexos, polidos (際しまして) e combinações com て形 ou 上で. Foco em textos empresariais, jurídicos e diplomáticos."
example: "この度の合併に際しまして一言ご挨拶申し上げます。 Ex.: ～に際して avançado → uso formal, polido e contextualizado."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Usos avançados de ～に際して
    description: Escolha o significado ou uso correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "この度の就任に際しまして (por ocasião da posse — forma muito polida/apesar da posse/antes da posse/depois da posse)", correctAnswer: "por ocasião da posse — forma muito polida", rationale: "に際しまして é a forma polida de に際して. Usada em discursos e comunicados formais de alto nível.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際して (formal) aparece frequentemente em (conversas entre amigos/abertura de cerimônias, documentos jurídicos e discursos/instrução de receitas/mensagens de texto)", correctAnswer: "abertura de cerimônias, documentos jurídicos e discursos", rationale: "に際して é padrão em contextos de alta formalidade: discursos de posse, documentos legais, cerimônias.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "契約を締結するに際し、双方の権利と義務を確認した。 (Depois de assinar, confirmaram direitos e deveres./Por ocasião de assinar o contrato, confirmaram os direitos e deveres de ambas as partes./Antes mesmo de planejar, confirmaram./A confirmação foi independente do contrato.)", correctAnswer: "Por ocasião de assinar o contrato, confirmaram os direitos e deveres de ambas as partes.", rationale: "契約を締結するに際し = por ocasião de assinar o contrato (formal). に際し = forma conjuntiva formal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際し vs に際して vs に際しまして (に際し = mais formal/escrito; に際して = padrão formal; に際しまして = muito polido/に際しまして é o menos formal/todos têm o mesmo nível de formalidade/に際し é o mais coloquial)", correctAnswer: "に際し = mais formal/escrito; に際して = padrão formal; に際しまして = muito polido", rationale: "に際し é usado em textos escritos formais. に際して é o padrão. に際しまして é para discursos muito cerimoniais.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この度の弊社の創立50周年に際しまして、格別のご支援を賜り厚く御礼申し上げます。 (Obrigado por pouco apoio nesta data de 50 anos da empresa./Por ocasião do 50º aniversário de nossa empresa, expressamos profundo agradecimento pelo generoso apoio./Lamentamos o apoio recebido./O 50º aniversário não é motivo de agradecimento.)", correctAnswer: "Por ocasião do 50º aniversário de nossa empresa, expressamos profundo agradecimento pelo generoso apoio.", rationale: "に際しまして + 御礼申し上げます = fórmula de agradecimento cerimonial muito formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "海外展開に際し留意すべき事項 (itens a ignorar na expansão para o exterior/itens a observar por ocasião da expansão para o exterior/itens antes de pensar na expansão/itens que não têm relação com a expansão)", correctAnswer: "itens a observar por ocasião da expansão para o exterior", rationale: "海外展開に際し = por ocasião da expansão para o exterior. Forma concisa usada em documentos técnicos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国際会議の開催に際しまして、各国代表の皆様を歓迎申し上げます。 (Por ocasião da realização da conferência internacional, damos as boas-vindas aos representantes de todos os países./Não damos boas-vindas aos representantes./A conferência não é importante./A recepção é antes da conferência.)", correctAnswer: "Por ocasião da realização da conferência internacional, damos as boas-vindas aos representantes de todos os países.", rationale: "国際会議の開催に際しまして = por ocasião da conferência internacional. Discurso de abertura cerimonial.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際して pode ser combinado com の上で? (に際しての上で = nunca usado/に際しての上で = usado normalmente/に際しての上で = alternativa comum/に際して já implica の上で)", correctAnswer: "に際して já implica の上で", rationale: "に際して já implica que a ação é realizada na ocasião. A combinação に際しての上で não é necessária.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "弔問に際しては礼儀を守ること。 (Na visita de condolências, não precisa ser educado./Por ocasião da visita de condolências, deve-se manter a etiqueta./A etiqueta não importa nas condolências./Após a visita de condolências, seja educado.)", correctAnswer: "Por ocasião da visita de condolências, deve-se manter a etiqueta.", rationale: "弔問に際しては = por ocasião da visita de condolências. Instrução de etiqueta formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際して é mais adequado do que の時 quando (é uma situação cotidiana/é um evento especial, formal ou único/é uma ação repetitiva/é uma ação casual)", correctAnswer: "é um evento especial, formal ou único", rationale: "に際して é reservado para eventos que têm peso especial: cerimônias, assinaturas, posses, lançamentos.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Leitura avançada de documentos com ～に際して
    description: Escolha a tradução correta do texto formal.
    exercises:
      - { type: japanese_vocab, question: "弊社の社屋移転に際しまして、皆様にはご不便をおかけいたしましたことをお詫び申し上げます。 (Por ocasião da mudança de sede, pedimos desculpas pela inconveniência causada a todos./Mudamos de sede e pedimos que venham visitar./Não há inconveniência na mudança./A mudança foi sem problemas.)", correctAnswer: "Por ocasião da mudança de sede, pedimos desculpas pela inconveniência causada a todos.", rationale: "に際しまして + お詫び申し上げます = fórmula de pedido de desculpas formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "入学試験の実施に際し、各受験生は本人確認書類を持参すること。 (Após o exame de admissão, trazer documentos de identidade./Por ocasião da realização do exame de admissão, cada candidato deve trazer documentos de identificação./Documentos não são necessários./Os documentos são opcionais.)", correctAnswer: "Por ocasião da realização do exame de admissão, cada candidato deve trazer documentos de identificação.", rationale: "試験の実施に際し = por ocasião da realização do exame (formal). Instrução oficial.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "な際しまして に際して: qual ocorre em discursos de abertura de solenidades? (の時/に際しまして/ところで/によって)", correctAnswer: "に際しまして", rationale: "に際しまして é a fórmula padrão para abertura de solenidades: 'por esta ocasião especial, gostaria de dizer...'", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "平和条約の署名に際し、両国首脳が握手を交わした。 (Depois da assinatura, os líderes apertaram as mãos./Por ocasião da assinatura do tratado de paz, os líderes dos dois países trocaram um aperto de mãos./Os líderes não se encontraram./A assinatura foi independente do encontro.)", correctAnswer: "Por ocasião da assinatura do tratado de paz, os líderes dos dois países trocaram um aperto de mãos.", rationale: "条約の署名に際し = por ocasião da assinatura do tratado. Cena diplomática formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "本プロジェクト開始に際し、関係各位へ本通知をお送りします。 (Depois do início do projeto, enviamos esta notificação./Por ocasião do início deste projeto, enviamos esta notificação a todos os envolvidos./Esta notificação é independente do projeto./A notificação é antes mesmo de planejá-lo.)", correctAnswer: "Por ocasião do início deste projeto, enviamos esta notificação a todos os envolvidos.", rationale: "プロジェクト開始に際し = por ocasião do início do projeto. Comunicado formal de início.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際して é apropriado para (perguntas informais/informações formais e situações de protocolo/narrativas ficcionais/textos humorísticos)", correctAnswer: "informações formais e situações de protocolo", rationale: "に際して é essencialmente uma expressão de protocolo formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "御就任に際しまして、心よりお祝い申し上げます。 (Por ocasião da sua posse, expressamos nossas sinceras congratulações./Lamentamos a sua posse./A posse não é motivo de celebração./As congratulações são antes da posse.)", correctAnswer: "Por ocasião da sua posse, expressamos nossas sinceras congratulações.", rationale: "御就任に際しまして + お祝い申し上げます = fórmula de parabéns formal por posse.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "在留資格の申請に際し、必要書類を全て揃えること。 (Após o pedido de status de residência, reunir todos os documentos./Por ocasião do pedido de status de residência, reunir todos os documentos necessários./Os documentos são desnecessários./O pedido não exige documentos.)", correctAnswer: "Por ocasião do pedido de status de residência, reunir todos os documentos necessários.", rationale: "在留資格の申請に際し = por ocasião do pedido de visto de residência. Instrução burocrática formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この度の定年退職に際しまして、長年のご尽力に深謝いたします。 (Por ocasião da aposentadoria, agradecemos profundamente o longo esforço dedicado./Lamentamos a aposentadoria./A aposentadoria não merece reconhecimento./O agradecimento é antes da aposentadoria.)", correctAnswer: "Por ocasião da aposentadoria, agradecemos profundamente o longo esforço dedicado.", rationale: "定年退職に際しまして + 深謝いたします = fórmula de homenagem formal de aposentadoria.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "創業に際しては多くの困難があった。 (Por ocasião da fundação da empresa, havia muitas dificuldades./Não havia dificuldades na fundação./A fundação foi fácil./As dificuldades vieram depois da fundação.)", correctAnswer: "Por ocasião da fundação da empresa, havia muitas dificuldades.", rationale: "創業に際しては = por ocasião da fundação. Reflexão sobre dificuldades enfrentadas no início.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
