title: 📝 ～というものではない (não é bem assim)
level: 'K'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "というものではない nega uma generalização: 'não é que X seja sempre Y / não é necessariamente assim'. Variantes: というものでもない (forma levemente mais suave)."
example: "お金があれば幸せになれるというものではない。 Ex.: ～というものではない → 'não é que / não é necessariamente verdade que'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～というものではない
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "努力すれば必ず成功するというものではない。 (Sucesso é impossível./Esforço garante sucesso./Não é que se você se esforçar vá necessariamente ter sucesso./O esforço é inútil.)", correctAnswer: "Não é que se você se esforçar vá necessariamente ter sucesso.", rationale: "というものではない → 'não é necessariamente assim / não é que seja sempre assim'. Nega generalização.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものではない serve para (indicar causa/confirmar uma regra/negar uma generalização/indicar possibilidade)", correctAnswer: "negar uma generalização", rationale: "というものではない nega que uma regra ou generalização seja sempre verdadeira.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "高ければ品質が良いというものではない。 (O preço não tem relação com a qualidade./Caro sempre significa boa qualidade./Não é que caro signifique necessariamente boa qualidade./Barato é sempre melhor.)", correctAnswer: "Não é que caro signifique necessariamente boa qualidade.", rationale: "高ければ品質が良いというものではない → preço alto não é garantia de qualidade. Nega generalização.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "知識があれば解決できるというものではない。 (Solução é impossível./Conhecimento garante solução./Não é que ter conhecimento garanta a solução./Conhecimento é inútil.)", correctAnswer: "Não é que ter conhecimento garanta a solução.", rationale: "知識があれば解決できるというものではない → conhecimento não resolve tudo automaticamente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものではない vs というものだ (というものではない nega; というものだ afirma/são idênticos em uso/というものだ nega; というものではない afirma/nenhuma diferença)", correctAnswer: "というものではない nega; というものだ afirma", rationale: "というものだ → 'é isso que é' (afirma). というものではない → 'não é necessariamente isso' (nega).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "長生きすればそれだけ幸せだというものではない。 (Felicidade não tem relação com longevidade./Viver mais anos é sempre mais felicidade./Não é que viver mais anos seja necessariamente mais felicidade./Viver pouco é melhor.)", correctAnswer: "Não é que viver mais anos seja necessariamente mais felicidade.", rationale: "というものではない nega a correlação automática entre longevidade e felicidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものでもない (variante mais suave) vs というものではない (a variante mais suave implica negação total/a variante mais suave implica negação mais leve; ambas negam/são completamente iguais/a variante mais forte é というものでもない)", correctAnswer: "a variante mais suave implica negação mais leve; ambas negam", rationale: "というものでもない é levemente mais suave e menos assertivo que というものではない.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "言えばわかってもらえるというものではない。 (Se falar, vai ser entendido./Não é que se falar vá necessariamente ser entendido./Falar nunca resolve nada./Comunicação é impossível.)", correctAnswer: "Não é que se falar vá necessariamente ser entendido.", rationale: "というものではない nega a ideia de que comunicação automática resolve tudo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものではない frequentemente aparece em (frases iniciadas com 〜ばいい/frases que negam suposições ou expectativas populares/frases de instrução/frases interrogativas)", correctAnswer: "frases que negam suposições ou expectativas populares", rationale: "というものではない é usado para desafiar noções comuns, preconceitos ou generalizações simplistas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "反省すれば許されるというものではない。 (Arrepender-se garante perdão./Não é que se arrepender signifique necessariamente ser perdoado./Arrependimento é inútil./Perdão é impossível.)", correctAnswer: "Não é que se arrepender signifique necessariamente ser perdoado.", rationale: "というものではない nega que o arrependimento garanta automaticamente o perdão.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases formais com ～というものではない
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "規模が大きければ優れているというものではない。 (Maior tamanho sempre significa superioridade./Não é que maior tamanho signifique necessariamente superioridade./Tamanho não tem relação com qualidade./Maior é sempre pior.)", correctAnswer: "Não é que maior tamanho signifique necessariamente superioridade.", rationale: "規模が大きければ優れているというものではない → tamanho não é sinônimo automático de qualidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "学歴があれば仕事ができるというものではない。 (Diploma garante competência no trabalho./Não é que ter diploma garanta competência no trabalho./Diploma é completamente inútil./Diploma e trabalho são independentes.)", correctAnswer: "Não é que ter diploma garanta competência no trabalho.", rationale: "というものではない nega que diploma seja automaticamente sinônimo de competência profissional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものではない pode negar (apenas afirmações positivas/qualquer generalização ou pressuposto/apenas afirmações negativas/apenas fatos científicos)", correctAnswer: "qualquer generalização ou pressuposto", rationale: "というものではない pode negar qualquer tipo de generalização, seja ela positiva, negativa ou comum.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "謝れば全て解決するというものではない。 (Pedir desculpas resolve tudo./Não é que pedir desculpas resolva necessariamente tudo./Desculpas são inúteis./Conflitos não têm solução.)", correctAnswer: "Não é que pedir desculpas resolva necessariamente tudo.", rationale: "というものではない nega a ideia de que desculpas automaticamente resolvem todos os problemas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先進国だからといって全てが優れているというものではない。 (País desenvolvido é sempre superior em tudo./Não é que ser país desenvolvido signifique ser superior em tudo./Países desenvolvidos não têm qualidades./Desenvolvimento nacional é sempre negativo.)", correctAnswer: "Não é que ser país desenvolvido signifique ser superior em tudo.", rationale: "というものではない nega a generalização de que países desenvolvidos são superiores em todos os aspectos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "薬を飲めば治るというものではない。 (Tomar remédio sempre cura./Não é que tomar remédio garanta a cura./Remédio é sempre ineficaz./Medicação e cura não têm relação.)", correctAnswer: "Não é que tomar remédio garanta a cura.", rationale: "というものではない nega que medicação seja automaticamente suficiente para curar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というものではない é mais formal ou informal que のではない? (mais formal/mais informal/igualmente formal/というものではない não existe)", correctAnswer: "mais formal", rationale: "というものではない tem registro mais formal do que のではない. Adequado para textos escritos e argumentações.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "民主主義があれば全て上手くいくというものではない。 (Democracia resolve todos os problemas./Não é que democracia resolva necessariamente todos os problemas./Democracia não tem valor./Política não funciona.)", correctAnswer: "Não é que democracia resolva necessariamente todos os problemas.", rationale: "というものではない nega que democracia seja solução mágica para todos os problemas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "情報が多ければ賢くなれるというものではない。 (Mais informação sempre torna mais inteligente./Não é que ter mais informação torne necessariamente mais inteligente./Informação é inútil./Inteligência não tem relação com informação.)", correctAnswer: "Não é que ter mais informação torne necessariamente mais inteligente.", rationale: "というものではない nega que quantidade de informação seja automaticamente sinônimo de sabedoria.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お金を出せば問題が解決するというものではない。 (Dinheiro sempre resolve problemas./Não é que gastar dinheiro resolva necessariamente problemas./Dinheiro é completamente inútil./Problemas não têm solução.)", correctAnswer: "Não é que gastar dinheiro resolva necessariamente problemas.", rationale: "というものではない nega que dinheiro seja solução automática para todos os problemas.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
