title: 📝 ～ないことはない (não é impossível)
level: 'K'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ないことはない é uma dupla negação que expressa possibilidade moderada: 'não é que seja impossível / não é que não se possa'. Tom de hesitação ou concessão. Diferente de できる (afirmação direta)."
example: "できないことはないが、難しい。 Ex.: ～ないことはない → 'não é impossível / não é que não se possa (embora com dificuldade)'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～ないことはない
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "できないことはない。 (É completamente impossível./Não é impossível (embora difícil)./É fácil e direto./Não consigo de forma alguma.)", correctAnswer: "Não é impossível (embora difícil).", rationale: "ないことはない → dupla negação. できないことはない → não é que seja impossível. Tom moderado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことはない expressa (probabilidade alta/impossibilidade/possibilidade moderada, com hesitação/certeza absoluta)", correctAnswer: "possibilidade moderada, com hesitação", rationale: "ないことはない é uma afirmação indireita que admite possibilidade, mas com reservas ou dificuldade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行けないことはないが、時間が少ない。 (Não consigo ir e o tempo é pouco./Não é que não possa ir, mas o tempo é pouco./Consigo ir facilmente./Vou com certeza.", correctAnswer: "Não é que não possa ir, mas o tempo é pouco.", rationale: "行けないことはない → não é impossível ir. Mas... indica a ressalva que acompanha a possibilidade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことはない vs できる (できる é mais hesitante/ないことはない é mais direto e confiante que できる/ないことはない é mais hesitante e moderado que できる/são completamente idênticos)", correctAnswer: "ないことはない é mais hesitante e moderado que できる", rationale: "できる → afirmação direta de capacidade. ないことはない → não é impossível, mas implica dificuldade ou reserva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "理解できないことはないが、難しい説明だ。 (A explicação é simples./É impossível de entender e a explicação é difícil./Não é que seja impossível de entender, mas é uma explicação difícil./Entendo facilmente.)", correctAnswer: "Não é que seja impossível de entender, mas é uma explicação difícil.", rationale: "理解できないことはない → não é impossível entender. Admite possibilidade com ressalva da dificuldade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことはない geralmente é seguido de (uma afirmação de facilidade/uma ressalva (が、けど)/uma negação/uma pergunta)", correctAnswer: "uma ressalva (が、けど)", rationale: "ないことはない normalmente é seguido de が ou けど com uma condição ou dificuldade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べられないことはないが、好みではない。 (Não como de jeito nenhum./Não consigo comer e não gosto./Não é que não possa comer, mas não é da minha preferência./Como com facilidade e adoro.)", correctAnswer: "Não é que não possa comer, mas não é da minha preferência.", rationale: "食べられないことはない → não é impossível comer. Mas indica a ressalva de não ser preferência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことはない indica que o falante (não tem opinião/recusa completamente/aceita com reservas ou dificuldade/aceita com entusiasmo)", correctAnswer: "aceita com reservas ou dificuldade", rationale: "ないことはない é uma aceitação hesitante — possível, mas não ideal ou fácil.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "答えられないことはないが、確信が持てない。 (Não consigo responder e não tenho certeza./Não é que não possa responder, mas não tenho certeza./Respondo com plena certeza./Não respondo de jeito nenhum.)", correctAnswer: "Não é que não possa responder, mas não tenho certeza.", rationale: "答えられないことはない → não é impossível responder. Mas a falta de certeza é a ressalva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことはない pode ser mais enfático com (こそ/は (duplo は)/も/の)", correctAnswer: "は (duplo は)", rationale: "ないことはない já usa は para ênfase na dupla negação. O は é o marcador de contraste/ênfase.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～ないことはない em contexto
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "締め切りまでに終わらせられないことはないが、かなり急がなければならない。 (É impossível terminar até o prazo./Não é que seja impossível terminar até o prazo, mas vou ter que me apressar bastante./Termino facilmente antes do prazo./O prazo não é um problema.)", correctAnswer: "Não é que seja impossível terminar até o prazo, mas vou ter que me apressar bastante.", rationale: "終わらせられないことはない → não é impossível terminar. A necessidade de se apressar é a ressalva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その条件で契約できないことはないが、再考が必要だ。 (É impossível assinar o contrato nessas condições./Não é que seja impossível assinar nessas condições, mas é necessário reconsiderar./Assinamos facilmente nessas condições./As condições são perfeitas.)", correctAnswer: "Não é que seja impossível assinar nessas condições, mas é necessário reconsiderar.", rationale: "契約できないことはない → não é impossível assinar. A necessidade de reconsiderar é a ressalva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことはない vs ないとは言えない (são completamente idênticos/ないことはない admite possibilidade hesitante; ないとは言えない = não se pode negar/ないとは言えない é mais comum na fala/ないことはない é mais coloquial)", correctAnswer: "ないことはない admite possibilidade hesitante; ないとは言えない = não se pode negar", rationale: "ないことはない → não é impossível (possibilidade hesitante). ないとは言えない → não se pode dizer que não é (dúvida mais forte).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語で書けないことはないが、英語の方が得意だ。 (É impossível escrever em japonês./Não é impossível escrever em japonês, mas inglês é melhor para mim./Escrevo japonês com facilidade./Prefiro japonês ao inglês.)", correctAnswer: "Não é impossível escrever em japonês, mas inglês é melhor para mim.", rationale: "書けないことはない → não é impossível escrever. Mas a comparação com inglês é a ressalva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "予算内で収まらないことはないが、節約が必要だ。 (É impossível ficar dentro do orçamento./Não é impossível ficar dentro do orçamento, mas é necessário economizar./Fico dentro do orçamento facilmente./O orçamento não é um problema.)", correctAnswer: "Não é impossível ficar dentro do orçamento, mas é necessário economizar.", rationale: "収まらないことはない → não é impossível ficar dentro. A necessidade de economizar é a ressalva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その方法で解決できないことはないが、効率が悪い。 (É impossível resolver com esse método./Não é impossível resolver com esse método, mas é ineficiente./Esse método é o mais eficiente./A eficiência não importa.)", correctAnswer: "Não é impossível resolver com esse método, mas é ineficiente.", rationale: "解決できないことはない → não é impossível resolver. A ineficiência é a ressalva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことはない é adequado quando (se quer recusar diretamente/se quer admitir possibilidade mas com reservas/se quer afirmar com entusiasmo/se quer negar completamente)", correctAnswer: "se quer admitir possibilidade mas com reservas", rationale: "ないことはない é a estrutura ideal para admitir possibilidade sem comprometimento total.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "無理ではないが = (é impossível/é difícil mas não impossível/é fácil/é possível completamente)", correctAnswer: "é difícil mas não impossível", rationale: "無理ではない → não é impossível/sem razão. Equivale a ないことはない em expressividade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "一人でやれないことはないが、助けがあれば早い。 (É impossível fazer sozinho./Não é impossível fazer sozinho, mas com ajuda é mais rápido./Faço sozinho sem problema./A ajuda é desnecessária.)", correctAnswer: "Não é impossível fazer sozinho, mas com ajuda é mais rápido.", rationale: "やれないことはない → não é impossível fazer sozinho. Admite possibilidade, ressalvando que ajuda melhora.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の提案を受け入れられないことはないが、リスクがある。 (É impossível aceitar a proposta./Não é impossível aceitar a proposta, mas há riscos./Aceitamos a proposta sem problema./A proposta é perfeita.)", correctAnswer: "Não é impossível aceitar a proposta, mas há riscos.", rationale: "受け入れられないことはない → não é impossível aceitar. Os riscos são a ressalva que acompanha a possibilidade.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
