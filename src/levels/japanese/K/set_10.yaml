title: 📝 ～てやまない (não para / continua intensamente)
level: 'K'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～てやまない expressa sentimento forte e contínuo que não cessa: 'não para de / continua a X imensamente'. Usado com sentimentos como 愛する、願う、期待する. Registro formal e literário."
example: "平和を願ってやまない。 Ex.: ～てやまない → 'continua a / não cessa de (sentimento intenso e persistente)'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～てやまない
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "彼の成功を願ってやまない。 (Espero que ele tenha sucesso por pouco tempo./Desejo o sucesso dele intensamente e sem parar./Não me importo com o sucesso dele./O desejo pelo sucesso dele cessou.)", correctAnswer: "Desejo o sucesso dele intensamente e sem parar.", rationale: "てやまない → 'não para de / continua intensamente'. 願ってやまない → não cessa de desejar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "てやまない indica que o sentimento é (temporário e fraco/intenso e contínuo/esporádico/passageiro)", correctAnswer: "intenso e contínuo", rationale: "てやまない combina a ação contínua (て形) com やまない (não parar), expressando intensidade persistente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "愛してやまない人 (pessoa que se ama pouco/pessoa que se ama imensamente e sem parar/pessoa que não se ama/pessoa que às vezes se ama)", correctAnswer: "pessoa que se ama imensamente e sem parar", rationale: "愛してやまない → ama sem parar / ama imensamente. Intensidade e continuidade do amor.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "やむ significa literalmente (crescer/parar/acelerar/continuar)", correctAnswer: "parar", rationale: "やむ → parar/cessar. やまない → não para. てやまない → V て + やまない → continua sem parar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "てやまない é tipicamente usado com (verbos de movimento/verbos de sentimento como 愛する、願う、期待する/verbos de ação física/verbos negativos)", correctAnswer: "verbos de sentimento como 愛する、願う、期待する", rationale: "てやまない é usado com: 愛す、願う、尊敬する、期待する、崇拝する — sentimentos profundos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "尊敬してやまない先生 (professor que se respeita pouco/professor que se respeita profundamente e sem parar/professor que não se respeita/professor que às vezes se respeita)", correctAnswer: "professor que se respeita profundamente e sem parar", rationale: "尊敬してやまない → respeita imensamente e sem cessar. Respeito profundo e contínuo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "てやまない é comum em (conversas casuais entre amigos/discursos formais, textos literários e jornalísticos/mensagens de texto/receitas culinárias)", correctAnswer: "discursos formais, textos literários e jornalísticos", rationale: "てやまない é um padrão literário e formal. Raro em conversas cotidianas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社会の発展を期待してやまない。 (Espero pouco o desenvolvimento social./Não paro de esperar o desenvolvimento da sociedade./Não tenho esperança no desenvolvimento social./O desenvolvimento social não me interessa.)", correctAnswer: "Não paro de esperar o desenvolvimento da sociedade.", rationale: "期待してやまない → não para de esperar / continua a esperar intensamente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "てやまない vs てならない (てやまない = sentimento que não cessa/continua; てならない = sentimento involuntário que não se pode controlar/são idênticos/てならない = sentimento que não cessa/てやまない = involuntário)", correctAnswer: "てやまない = sentimento que não cessa/continua; てならない = sentimento involuntário que não se pode controlar", rationale: "てやまない ≒ 'continua sem parar'. てならない ≒ 'não aguento/não consigo evitar'. Nuances distintas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "故郷を愛してやまない人々 (pessoas que amam pouco a terra natal/pessoas que amam imensamente e sem parar a terra natal/pessoas que não amam a terra natal/pessoas que às vezes amam a terra natal)", correctAnswer: "pessoas que amam imensamente e sem parar a terra natal", rationale: "愛してやまない → ama intensamente e sem cessar. Apego profundo à terra natal.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases literárias com ～てやまない
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "彼女は家族を愛してやまなかった。 (Ela amava pouco a família./Ela amava a família imensamente e sem parar./Ela não amava a família./O amor dela pela família era esporádico.)", correctAnswer: "Ela amava a família imensamente e sem parar.", rationale: "愛してやまなかった → amava imensamente e sem cessar. Passado de intensidade emocional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "世界の平和を願ってやまない全ての人に贈る。 (Dedico a todas as pessoas que desejam pouco a paz mundial./Dedico a todas as pessoas que desejam incansavelmente a paz mundial./Dedico a quem não se preocupa com a paz./Dedico a quem já desistiu da paz.)", correctAnswer: "Dedico a todas as pessoas que desejam incansavelmente a paz mundial.", rationale: "平和を願ってやまない → deseja incansavelmente a paz. Dedicatória com tom elevado e formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "てやまない pode ser substituído por (ずにはいられない/続けてやまない/何よりも/まず)", correctAnswer: "続けてやまない", rationale: "続けてやまない → continua sem parar. Semelhante a てやまない em expressão de continuidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この地に生きた人々を尊敬してやまない。 (Respeito pouco as pessoas que viveram nesta terra./Não paro de respeitar as pessoas que viveram nesta terra./Não respeito as pessoas desta terra./O respeito por essas pessoas cessou.)", correctAnswer: "Não paro de respeitar as pessoas que viveram nesta terra.", rationale: "尊敬してやまない → não para de respeitar. Respeito profundo e contínuo pelas pessoas do lugar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "テクノロジーの可能性を信じてやまない研究者 (pesquisador que acredita pouco nas possibilidades da tecnologia/pesquisador que acredita incansavelmente nas possibilidades da tecnologia/pesquisador que desacredita na tecnologia/pesquisador indiferente à tecnologia)", correctAnswer: "pesquisador que acredita incansavelmente nas possibilidades da tecnologia", rationale: "信じてやまない → acredita sem parar / com convicção. Pesquisador apaixonado e comprometido.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "てやまない intensifica (quantitativamente/emocionalmente e qualitativamente/temporalmente/fisicamente)", correctAnswer: "emocionalmente e qualitativamente", rationale: "てやまない não indica quantidade, mas profundidade e persistência emocional do sentimento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供たちの未来を願ってやまない親たち。 (Pais que desejam pouco o futuro dos filhos./Pais que desejam incansavelmente o futuro dos filhos./Pais indiferentes ao futuro dos filhos./Pais que já desistiram do futuro dos filhos.)", correctAnswer: "Pais que desejam incansavelmente o futuro dos filhos.", rationale: "願ってやまない → deseja incansavelmente. Amor e esperança parental que nunca cessam.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "人類が発展することを望んでやまない。 (Desejo pouco que a humanidade se desenvolva./Não paro de desejar que a humanidade se desenvolva./Não tenho esperança no desenvolvimento humano./O desenvolvimento humano não me interessa.)", correctAnswer: "Não paro de desejar que a humanidade se desenvolva.", rationale: "望んでやまない → não para de desejar. Esperança contínua e profunda no desenvolvimento humano.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "てやまない é tipicamente (crítico/elogioso ou apaixonado/neutro/irônico)", correctAnswer: "elogioso ou apaixonado", rationale: "てやまない expressa sentimentos positivos profundos: amor, respeito, esperança, crença. Não tem conotação negativa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この傑作を生み出した作家を崇拝してやまない。 (Admiro pouco o escritor que criou esta obra-prima./Não paro de admirar o escritor que criou esta obra-prima./Não admiro o escritor./A admiração pelo escritor já passou.)", correctAnswer: "Não paro de admirar o escritor que criou esta obra-prima.", rationale: "崇拝してやまない → não para de reverenciar. Tom elevado de admiração profunda e constante.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
