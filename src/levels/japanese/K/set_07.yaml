title: 📝 ～ないことには (se não fizer)
level: 'K'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ないことには indica que Y não pode ocorrer se X não for feito: 'se não fizer X, Y não é possível'. Estrutura: V ない形+ことには / N でないことには. Condição negativa necessária."
example: "試してみないことにはわからない。 Ex.: ～ないことには → 'se não fizer / sem fazer, não é possível'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～ないことには
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "やってみないことにはわからない。 (Mesmo fazendo, não vai saber./Se não tentar, não vai saber./Sabe sem precisar tentar./Tente mas não vai entender.)", correctAnswer: "Se não tentar, não vai saber.", rationale: "ないことには = 'se não fizer'. やってみないことには = se não tentar. A tentativa é condição necessária.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことには indica que a ação é (opcional/condição necessária para o resultado/desnecessária/contraproducente)", correctAnswer: "condição necessária para o resultado", rationale: "ないことには = 'a menos que X, Y não pode ocorrer'. X é condição necessária para Y.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "実際に会ってみないことには、信用できない。 (Mesmo depois de se encontrar, não vai confiar./Se não se encontrar pessoalmente, não vai conseguir confiar./Confio sem precisar me encontrar./O encontro não influencia a confiança.)", correctAnswer: "Se não se encontrar pessoalmente, não vai conseguir confiar.", rationale: "会ってみないことには = se não se encontrar. O encontro é condição necessária para a confiança.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "本人に聞かないことには、事情がわからない。 (Mesmo perguntando, não vai entender./Se não perguntar à própria pessoa, não vai entender a situação./Entende sem perguntar./Perguntar não ajuda.", correctAnswer: "Se não perguntar à própria pessoa, não vai entender a situação.", rationale: "本人に聞かないことには = se não perguntar à pessoa em questão. Condição necessária para entender.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことには geralmente é seguido de (afirmação positiva/negativa ou expressão de impossibilidade/afirmação de possibilidade/expressão de certeza)", correctAnswer: "negativa ou expressão de impossibilidade", rationale: "ないことには é seguido de: わからない、できない、無理だ — resultado negativo sem a condição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "努力しないことには、夢は実現しない。 (Mesmo sem esforço, o sonho se realizará./Se não se esforçar, o sonho não se realizará./O esforço não influencia a realização./O sonho se realiza independentemente do esforço.)", correctAnswer: "Se não se esforçar, o sonho não se realizará.", rationale: "努力しないことには = se não se esforçar. O esforço é condição necessária para a realização.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことには vs なければ (ないことには é mais formal e literário; なければ é mais comum/なければ é mais formal/são completamente idênticos/ないことには é mais coloquial)", correctAnswer: "ないことには é mais formal e literário; なければ é mais comum", rationale: "なければ = condição simples. ないことには é mais enfático e formal, comum em textos escritos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "実際に食べてみないことには、味は判断できない。 (Mesmo sem comer, pode-se julgar o sabor./Se não provar, não se pode julgar o sabor./Pode-se julgar sem comer./Comer não é necessário para julgar.)", correctAnswer: "Se não provar, não se pode julgar o sabor.", rationale: "食べてみないことには = se não provar. A prova é condição necessária para julgamento de sabor.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "承認されないことには、プロジェクトを進められない。 (Mesmo sem aprovação, o projeto pode avançar./Se não houver aprovação, não se pode avançar no projeto./A aprovação é desnecessária./O projeto avança independentemente da aprovação.)", correctAnswer: "Se não houver aprovação, não se pode avançar no projeto.", rationale: "承認されないことには = se não for aprovado. A aprovação é condição necessária para prosseguir.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "でないことには é usado com (verbos/substantivos e adjetivos-な/adjetivos-い/apenas partículas)", correctAnswer: "substantivos e adjetivos-な", rationale: "N/Adjな でないことには: 本物でないことには = se não for autêntico. Forma com substantivo/adj-な.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases formais com ～ないことには
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "問題を正確に把握しないことには、解決策は見つからない。 (Mesmo sem entender o problema, pode-se encontrar solução./Se não entender o problema com precisão, não se encontrará solução./Entender o problema é desnecessário./A solução é impossível de qualquer forma.)", correctAnswer: "Se não entender o problema com precisão, não se encontrará solução.", rationale: "問題を正確に把握しないことには = se não compreender o problema com precisão. Condição necessária.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "専門家に相談しないことには、正しい判断ができない。 (Mesmo sem consultar especialista, se pode julgar corretamente./Se não consultar um especialista, não se pode tomar decisão correta./Especialistas são desnecessários./A decisão correta não existe.)", correctAnswer: "Se não consultar um especialista, não se pode tomar decisão correta.", rationale: "専門家に相談しないことには = se não consultar especialista. A consulta é condição para decisão correta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことには と なければ, qual é mais adequado para texto acadêmico? (なければ/ないことには/ambos são iguais em registro/nenhum dos dois é adequado)", correctAnswer: "ないことには", rationale: "ないことには tem registro mais formal e é preferido em textos acadêmicos e formais escritos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "現地に行ってみないことには、実情は理解できない。 (Mesmo sem ir ao local, pode-se entender a realidade./Se não for ao local, não se pode entender a realidade./Ir ao local é desnecessário./A realidade local é incompreensível.)", correctAnswer: "Se não for ao local, não se pode entender a realidade.", rationale: "現地に行ってみないことには = se não for ao local. A visita é condição necessária para entender.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "全員の同意がないことには、決定できない。 (Mesmo sem consenso, é possível decidir./Se não houver consenso de todos, não se pode decidir./O consenso é desnecessário./A decisão é impossível mesmo com consenso.)", correctAnswer: "Se não houver consenso de todos, não se pode decidir.", rationale: "全員の同意がないことには = se não houver consenso de todos. O consenso é condição necessária.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "データを収集しないことには、分析は始められない。 (Mesmo sem coletar dados, a análise pode começar./Se não coletar dados, a análise não pode começar./Dados são desnecessários para análise./A análise pode prosseguir sem dados.)", correctAnswer: "Se não coletar dados, a análise não pode começar.", rationale: "データを収集しないことには = se não coletar dados. A coleta é condição necessária para a análise.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ないことには o resultado final é sempre (possível/negativo ou impossível/incerto/positivo)", correctAnswer: "negativo ou impossível", rationale: "ないことには sempre é seguido de resultado negativo: わからない、できない、無理だ etc.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女が承諾しないことには、話を進めることはできない。 (Mesmo sem a concordância dela, a conversa pode avançar./Se ela não concordar, não é possível avançar na conversa./A concordância dela é desnecessária./A conversa avança independentemente dela.)", correctAnswer: "Se ela não concordar, não é possível avançar na conversa.", rationale: "彼女が承諾しないことには = se ela não concordar. A concordância é condição necessária.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "法的根拠がないことには、措置を取ることができない。 (Mesmo sem fundamento legal, pode-se tomar medidas./Se não houver fundamento legal, não se pode tomar medidas./Fundamento legal é desnecessário./As medidas são possíveis sem fundamento.)", correctAnswer: "Se não houver fundamento legal, não se pode tomar medidas.", rationale: "法的根拠がないことには = se não houver fundamento legal. A base legal é condição necessária.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試験に合格しないことには、資格は取得できない。 (Mesmo sem passar no exame, pode-se obter a qualificação./Se não passar no exame, não se pode obter a qualificação./O exame é desnecessário./A qualificação é independente do exame.)", correctAnswer: "Se não passar no exame, não se pode obter a qualificação.", rationale: "試験に合格しないことには = se não passar no exame. A aprovação é condição necessária para a qualificação.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
