title: 📝 ～を踏まえた上で (tendo considerado / com base em)
level: 'K'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "を踏まえた上で reforça を踏まえて: indica que a ação é realizada DEPOIS de ter levado em consideração X. 上で adiciona a ideia de processo completo antes da ação. Mais formal."
example: "議論を踏まえた上で最終決定を下す。 Ex.: ～を踏まえた上で → 'tendo levado em conta / após considerar'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～を踏まえた上で
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "議論の内容を踏まえた上で (sem considerar o conteúdo do debate/após ter considerado o conteúdo do debate/antes de considerar o debate/apesar do debate)", correctAnswer: "após ter considerado o conteúdo do debate", rationale: "を踏まえた上で = 'após ter levado em conta'. Ação realizada depois do processo de consideração.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "を踏まえた上で vs を踏まえて (を踏まえた上で enfatiza que o processo foi completado antes de agir; を踏まえて é mais direto/são completamente idênticos/を踏まえて é mais formal/を踏まえた上で é mais coloquial)", correctAnswer: "を踏まえた上で enfatiza que o processo foi completado antes de agir; を踏まえて é mais direto", rationale: "上で adiciona a ideia de conclusão do processo. を踏まえた上で = 'tendo concluído a consideração de X'.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "調査結果を踏まえた上で対策を立てる。 (Criar medidas sem considerar os resultados./Criar medidas após ter considerado os resultados da pesquisa./Criar medidas antes da pesquisa./Os resultados não influenciam as medidas.)", correctAnswer: "Criar medidas após ter considerado os resultados da pesquisa.", rationale: "調査結果を踏まえた上で = após ter considerado os resultados. Ação informada após processo completo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "リスクを踏まえた上で投資する。 (Investir sem considerar os riscos./Investir após ter considerado os riscos./Investir antes de analisar os riscos./Os riscos não influenciam o investimento.)", correctAnswer: "Investir após ter considerado os riscos.", rationale: "リスクを踏まえた上で = após ter considerado os riscos. Decisão de investimento informada e ponderada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "現状を踏まえた上での判断 (julgamento que ignora a situação atual/julgamento feito após ter considerado a situação atual/julgamento antes de analisar/julgamento sem base)", correctAnswer: "julgamento feito após ter considerado a situação atual", rationale: "を踏まえた上での判断 = julgamento após consideração. の transforma a estrutura em modificador nominal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "全ての可能性を踏まえた上で結論を出した。 (Tiraram conclusões sem considerar as possibilidades./Tiraram conclusões após ter considerado todas as possibilidades./Tiraram conclusões antes de analisar./As possibilidades não influenciaram a conclusão.)", correctAnswer: "Tiraram conclusões após ter considerado todas as possibilidades.", rationale: "全ての可能性を踏まえた上で = após ter considerado todas as possibilidades. Processo completo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "を踏まえた上で é adequado quando (a decisão é impulsiva/a decisão é baseada em análise cuidadosa/a decisão é aleatória/a decisão não tem fundamento)", correctAnswer: "a decisão é baseada em análise cuidadosa", rationale: "を踏まえた上で é a estrutura ideal para decisões bem fundamentadas após consideração.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "専門家の意見を踏まえた上で設計を変更した。 (Alteraram o projeto sem a opinião dos especialistas./Alteraram o projeto após ter considerado a opinião dos especialistas./Alteraram o projeto antes de ouvir os especialistas./A opinião dos especialistas não influenciou o projeto.)", correctAnswer: "Alteraram o projeto após ter considerado a opinião dos especialistas.", rationale: "専門家の意見を踏まえた上で = após ter considerado a opinião dos especialistas. Decisão fundamentada.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "上で em を踏まえた上で indica (lugar/processo concluído antes de agir/tempo/causa)", correctAnswer: "processo concluído antes de agir", rationale: "上で (うえで) após た形 = 'após fazer'. Indica que o processo foi completado como base para ação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ユーザーのフィードバックを踏まえた上で改善を加えた。 (Adicionaram melhorias sem considerar o feedback./Adicionaram melhorias após ter considerado o feedback dos usuários./Adicionaram melhorias antes do feedback./O feedback não influenciou as melhorias.)", correctAnswer: "Adicionaram melhorias após ter considerado o feedback dos usuários.", rationale: "フィードバックを踏まえた上で = após ter considerado o feedback. Melhoria orientada por análise.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases formais com ～を踏まえた上で
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "市場調査の結果を踏まえた上で、事業計画を策定した。 (Elaboraram o plano sem a pesquisa de mercado./Elaboraram o plano após ter considerado os resultados da pesquisa de mercado./Elaboraram o plano antes da pesquisa./A pesquisa não influenciou o plano.)", correctAnswer: "Elaboraram o plano após ter considerado os resultados da pesquisa de mercado.", rationale: "市場調査の結果を踏まえた上で = após ter considerado os resultados de mercado. Planejamento fundamentado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "過去の失敗を踏まえた上で新戦略を構築した。 (Construíram nova estratégia sem analisar falhas passadas./Construíram nova estratégia após ter considerado os erros passados./Construíram sem considerar o passado./Os erros passados não influenciaram a estratégia.)", correctAnswer: "Construíram nova estratégia após ter considerado os erros passados.", rationale: "過去の失敗を踏まえた上で = após ter considerado as falhas passadas. Aprendizado aplicado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "を踏まえた上で vs を踏まえて: qual é mais adequado para relatórios formais? (を踏まえて/を踏まえた上で/ambos são igualmente formais/nenhum é adequado)", correctAnswer: "を踏まえた上で", rationale: "を踏まえた上で é mais elaborado e adequado para documentos formais e relatórios técnicos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "法的な観点を踏まえた上で契約書を作成した。 (Criaram o contrato sem perspectiva legal./Criaram o contrato após ter considerado a perspectiva legal./Criaram antes da análise legal./A perspectiva legal não influenciou o contrato.)", correctAnswer: "Criaram o contrato após ter considerado a perspectiva legal.", rationale: "法的な観点を踏まえた上で = após ter considerado a perspectiva legal. Documento criado com base jurídica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "様々なデータを踏まえた上での提言 (recomendação que ignora dados/recomendação feita após ter considerado vários dados/recomendação antes dos dados/recomendação sem fundamento)", correctAnswer: "recomendação feita após ter considerado vários dados", rationale: "を踏まえた上での提言 = recomendação após consideração de dados. Forma nominal (の + 提言).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "多角的な分析を踏まえた上で政策を立案した。 (Formularam a política sem análise/Formularam a política após considerar análise multidimensional./Formularam antes da análise./A análise não influenciou a política.)", correctAnswer: "Formularam a política após considerar análise multidimensional.", rationale: "多角的な分析を踏まえた上で = após ter considerado análise multidimensional. Processo rigoroso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "長期的なビジョンを踏まえた上で投資を決定した。 (Decidiram o investimento sem visão de longo prazo./Decidiram o investimento após ter considerado a visão de longo prazo./Decidiram sem planejamento./A visão de longo prazo não influenciou a decisão.)", correctAnswer: "Decidiram o investimento após ter considerado a visão de longo prazo.", rationale: "長期的なビジョンを踏まえた上で = após ter considerado a visão de longo prazo. Decisão estratégica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "を踏まえた上で implica que a ação é (impulsiva/bem-fundamentada e após processo completo/aleatória/baseada em sentimentos)", correctAnswer: "bem-fundamentada e após processo completo", rationale: "を踏まえた上で indica que a ação é realizada apenas após o processo completo de consideração.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社員の声を踏まえた上で制度改革を推進した。 (Promoveram a reforma sem ouvir os funcionários./Promoveram a reforma após ter considerado as vozes dos funcionários./Promoveram antes de ouvir os funcionários./As vozes dos funcionários não influenciaram a reforma.)", correctAnswer: "Promoveram a reforma após ter considerado as vozes dos funcionários.", rationale: "社員の声を踏まえた上で = após ter considerado as vozes dos funcionários. Reforma inclusiva e informada.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "現状の課題を踏まえた上で今後の方針を示した。 (Indicaram a política futura sem analisar desafios atuais./Indicaram a política futura após ter considerado os desafios atuais./Indicaram antes da análise./Os desafios não influenciaram a política futura.)", correctAnswer: "Indicaram a política futura após ter considerado os desafios atuais.", rationale: "現状の課題を踏まえた上で = após ter considerado os desafios atuais. Planejamento baseado em diagnóstico.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
