title: "📝 ～に当たり (formal: na ocasião de)"
level: 'K'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "に当たり é a forma formal/escrita de にあたって. Usada em documentos oficiais, discursos cerimoniais e comunicados formais. Praticamente intercambiável com に際して em contextos formais."
example: "審査に当たり公正を期します。 Ex.: ～に当たり → 'na ocasião de / ao realizar (formal)'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Uso formal de ～に当たり
    description: Escolha o significado ou uso correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "採用に当たり公平な審査を実施する。 (Triagem ocorre depois da contratação./Depois de contratar, realizar triagem justa./Na ocasião de contratar, realizar triagem justa./A triagem justa é desnecessária.)", correctAnswer: "Na ocasião de contratar, realizar triagem justa.", rationale: "に当たり → 'na ocasião de / ao' (formal). 採用に当たり → na ocasião de contratar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たり vs にあたって (に当たり é mais formal e escrito; にあたって é o padrão falado/にあたって é mais formal/são idênticos em registro/に当たり é mais coloquial)", correctAnswer: "に当たり é mais formal e escrito; にあたって é o padrão falado", rationale: "に当たり é a forma conjuntiva formal. にあたって é a forma て usada em discursos e fala mais comum.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "選挙に当たり有権者への訴えを行った。 (O apelo não tem relação com as eleições./Depois da eleição, fez apelo aos eleitores./Na ocasião das eleições, fez um apelo aos eleitores./O apelo foi antes de planejar as eleições.)", correctAnswer: "Na ocasião das eleições, fez um apelo aos eleitores.", rationale: "選挙に当たり → na ocasião das eleições. に当たり indica ação formal realizada naquela ocasião.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たり é predominantemente usado em (mensagens pessoais/conversas do dia a dia/documentos jurídicos, relatórios oficiais e discursos formais/textos literários de ficção)", correctAnswer: "documentos jurídicos, relatórios oficiais e discursos formais", rationale: "に当たり é padrão de linguagem oficial e burocrática. Muito comum em documentos públicos e formais.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "本規程の改定に当たり、関係部署の承認を要する。 (Depois de revisar esta regulamentação, é necessária aprovação./Na ocasião de revisar esta regulamentação, é necessária a aprovação dos departamentos envolvidos./A revisão não requer aprovação./A aprovação é desnecessária.)", correctAnswer: "Na ocasião de revisar esta regulamentação, é necessária a aprovação dos departamentos envolvidos.", rationale: "本規程の改定に当たり → na ocasião de revisar esta regulamentação. Linguagem de documento interno.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たり pode seguir (apenas substantivos/substantivos e verbos na forma de dicionário/apenas verbos no passado/apenas adjetivos)", correctAnswer: "substantivos e verbos na forma de dicionário", rationale: "N+に当たり: 試験に当たり. V辞書形+に当たり: 決定するに当たり. Ambas as formas são corretas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "授賞式に当たり、受賞者が壇上でスピーチを行った。 (Depois da cerimônia de premiação, o vencedor discursou./Na ocasião da cerimônia de premiação, o vencedor fez um discurso no palco./O discurso foi antes da cerimônia./O vencedor não discursou.)", correctAnswer: "Na ocasião da cerimônia de premiação, o vencedor fez um discurso no palco.", rationale: "授賞式に当たり → na ocasião da cerimônia de premiação. Ação formal realizada no evento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たり vs に先立って (に当たり = na ocasião de (simultâneo); に先立って = antes de (preparatório)/são idênticos/に先立って = na ocasião de; に当たり = antes de/に当たり é mais antigo)", correctAnswer: "に当たり = na ocasião de (simultâneo); に先立って = antes de (preparatório)", rationale: "に当たり indica ação no momento do evento. に先立って indica ação ANTES do evento como preparação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "業務を引き継ぐに当たり、詳細なマニュアルを作成した。 (Depois de transferir as responsabilidades, criaram o manual./Na ocasião de transferir as responsabilidades, criaram um manual detalhado./O manual foi criado antes de planejar a transferência./O manual é desnecessário.)", correctAnswer: "Na ocasião de transferir as responsabilidades, criaram um manual detalhado.", rationale: "業務を引き継ぐに当たり → na ocasião de transferir responsabilidades. Ação realizada no momento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たり pode ser negado? (Sim, に当たらない é comum/Não, に当たり é sempre afirmativo/に当たらない existe mas tem outro sentido/に当たり e に当たらない são idênticos)", correctAnswer: "に当たらない existe mas tem outro sentido", rationale: "に当たらない → 'não é o caso de / não constitui'. Ex: 謝罪に当たらない → não constitui pedido de desculpas.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Documentos formais com ～に当たり
    description: Escolha a tradução correta do texto formal.
    exercises:
      - { type: japanese_vocab, question: "本試験の実施に当たり、試験監督は公正な環境を確保すること。 (Depois do exame, garantir ambiente justo./Na ocasião da realização do exame, os monitores devem garantir um ambiente justo./O ambiente justo é desnecessário./Os monitores não têm responsabilidade.)", correctAnswer: "Na ocasião da realização do exame, os monitores devem garantir um ambiente justo.", rationale: "試験の実施に当たり → na ocasião da realização do exame. Instrução oficial para monitores.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "法案の審議に当たり、各委員に事前資料を配布した。 (Depois da deliberação da proposta, distribuíram materiais./Na ocasião da deliberação da proposta de lei, distribuíram materiais prévios a cada membro./Os materiais são desnecessários./Os materiais foram distribuídos muito depois.)", correctAnswer: "Na ocasião da deliberação da proposta de lei, distribuíram materiais prévios a cada membro.", rationale: "法案の審議に当たり → na ocasião da deliberação da proposta. Preparação para reunião formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たり, に際して e にあたって em grau de formalidade: (に当たり > に際して > にあたって/に際して ≥ に当たり > にあたって/にあたって > に際して > に当たり/são todos iguais)", correctAnswer: "に際して ≥ に当たり > にあたって", rationale: "に際して e に当たり são formais/escritos. にあたって é padrão formal. に当たり é levemente mais burocrático.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "組織改革を進めるに当たり、全員の協力が不可欠だ。 (Depois de avançar na reforma, a cooperação de todos é indispensável./Na ocasião de avançar na reforma organizacional, a cooperação de todos é indispensável./A cooperação é desnecessária./A reforma é possível sem cooperação.)", correctAnswer: "Na ocasião de avançar na reforma organizacional, a cooperação de todos é indispensável.", rationale: "組織改革を進めるに当たり → na ocasião de avançar na reforma. Condição necessária declarada formalmente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "個人情報の取り扱いに当たっては適切な管理を行うこと。 (Depois de manusear dados pessoais, realizar gerenciamento adequado./Na ocasião de manusear dados pessoais, deve-se realizar gerenciamento adequado./O gerenciamento é desnecessário./Dados pessoais não requerem cuidado.)", correctAnswer: "Na ocasião de manusear dados pessoais, deve-se realizar gerenciamento adequado.", rationale: "個人情報の取り扱いに当たっては → na ocasião de manusear dados pessoais. にあたっては enfatiza obrigação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新システムの導入に当たり、十分なテストを行うべきだ。 (Depois de introduzir o novo sistema, testes devem ser feitos./Na ocasião de introduzir o novo sistema, testes suficientes devem ser realizados./Testes são desnecessários./O sistema funciona sem testes.)", correctAnswer: "Na ocasião de introduzir o novo sistema, testes suficientes devem ser realizados.", rationale: "新システムの導入に当たり → na ocasião de introduzir o novo sistema. Boa prática técnica declarada.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たり em documentos formais geralmente é seguido de (obrigações ou procedimentos necessários/desculpas/histórias pessoais/piadas)", correctAnswer: "obrigações ou procedimentos necessários", rationale: "に当たり em contexto formal introduz o que deve ser feito, garantido ou observado naquela ocasião.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "投票に当たり、身分証明書を携帯すること。 (Depois de votar, carregar documento de identidade./Na ocasião de votar, carregar documento de identidade./Documentos são desnecessários para votar./O documento é opcional.)", correctAnswer: "Na ocasião de votar, carregar documento de identidade.", rationale: "投票に当たり → na ocasião de votar. Instrução oficial sobre procedimento de votação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "本事業の開始に当たり、関係機関の許可を得た。 (Depois de iniciar o negócio, obtiveram autorização./Na ocasião de iniciar este empreendimento, obtiveram a autorização dos órgãos competentes./A autorização é desnecessária./O empreendimento dispensou licenças.)", correctAnswer: "Na ocasião de iniciar este empreendimento, obtiveram a autorização dos órgãos competentes.", rationale: "本事業の開始に当たり → na ocasião de iniciar este empreendimento. Procedimento obrigatório.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "医療行為を行うに当たり、患者の同意を得ることが法的に義務付けられている。 (Depois de realizar procedimento médico, é obrigatório obter consentimento./Na ocasião de realizar procedimento médico, é legalmente obrigatório obter o consentimento do paciente./O consentimento do paciente é opcional./A lei não exige consentimento.", correctAnswer: "Na ocasião de realizar procedimento médico, é legalmente obrigatório obter o consentimento do paciente.", rationale: "医療行為を行うに当たり → na ocasião de realizar procedimento médico. Obrigação legal.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
