  - pageNumber: 3
    title: Frases simples com pessoas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "私は日本人です。 (Sou estudante./Sou professor./Sou japonês./Sou brasileiro.)", correctAnswer: "Sou japonês.", rationale: "O kanji 私は日本人です。 significa \"Sou japonês.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あの人は先生です。 (Aquela pessoa é médico./Aquela pessoa é amiga./Aquela pessoa é estudante./Aquela pessoa é professor.)", correctAnswer: "Aquela pessoa é professor.", rationale: "O kanji あの人は先生です。 significa \"Aquela pessoa é professor.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "女の子がいます。 (Tem um menino./Tem uma menina./Tem uma mulher./Tem um homem.)", correctAnswer: "Tem uma menina.", rationale: "O kanji 女の子がいます。 significa \"Tem uma menina.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "男の人です。 (É um homem./É uma criança./É um bebê./É uma mulher.)", correctAnswer: "É um homem.", rationale: "O kanji 男の人です。 significa \"É um homem.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私の友だち。 (O amigo dele./Seu amigo./Meu amigo./A amiga dela.)", correctAnswer: "Meu amigo.", rationale: "O kanji 私の友だち。 significa \"Meu amigo.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "子どもが三人います。 (Tem quatro crianças./Tem duas crianças./Tem três crianças./Tem cinco crianças.)", correctAnswer: "Tem três crianças.", rationale: "O kanji 子どもが三人います。 significa \"Tem três crianças.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あなたは学生ですか。 (Você é estudante?/Você é professor?/Você é médico?/Você é japonês?)", correctAnswer: "Você é estudante?", rationale: "O kanji あなたは学生ですか。 significa \"Você é estudante?\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大人二人と子ども一人。 (Um adulto e duas crianças./Três crianças./Três adultos./Dois adultos e uma criança.)", correctAnswer: "Dois adultos e uma criança.", rationale: "O kanji 大人二人と子ども一人。 significa \"Dois adultos e uma criança.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私は男です。 (Sou homem./Sou adulto./Sou criança./Sou mulher.)", correctAnswer: "Sou homem.", rationale: "O kanji 私は男です。 significa \"Sou homem.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あの女の人は日本人です。 (Aquela mulher é japonesa./Aquela menina é japonesa./Aquele homem é japonês./Aquele menino é japonês.)", correctAnswer: "Aquela mulher é japonesa.", rationale: "O kanji あの女の人は日本人です。 significa \"Aquela mulher é japonesa.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
