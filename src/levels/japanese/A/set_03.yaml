title: Kanji — Pessoas 人 子 男 女 私
level: 'A'
subject: japanese
example: "人 = pessoa (ひと / じん)"
pages:
  - pageNumber: 1
    title: Kanji de pessoa
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "人 (pessoa/criança/homem/mulher)", correctAnswer: "pessoa" }
      - { type: japanese_vocab, question: "子 (criança/pessoa/homem/mulher)", correctAnswer: "criança" }
      - { type: japanese_vocab, question: "男 (homem/mulher/criança/pessoa)", correctAnswer: "homem" }
      - { type: japanese_vocab, question: "女 (mulher/homem/criança/pessoa)", correctAnswer: "mulher" }
      - { type: japanese_vocab, question: "私 (eu/você/ele/ela)", correctAnswer: "eu" }
      - { type: japanese_vocab, question: "男の子 (menino/menina/bebê/adulto)", correctAnswer: "menino" }
      - { type: japanese_vocab, question: "女の子 (menina/menino/bebê/adulto)", correctAnswer: "menina" }
      - { type: japanese_vocab, question: "大人 (adulto/criança/idoso/bebê)", correctAnswer: "adulto" }
      - { type: japanese_vocab, question: "子ども (criança/adulto/idoso/bebê)", correctAnswer: "criança" }
      - { type: japanese_vocab, question: "人々 (pessoas/povo/nação/mundo)", correctAnswer: "pessoas" }
  - pageNumber: 2
    title: Leituras on/kun
    description: Escolha a leitura correta.
    exercises:
      - { type: japanese_vocab, question: "人 (ひと/じん/にん/jin)", correctAnswer: "ひと" }
      - { type: japanese_vocab, question: "日本人 (にほんじん/にほんひと/にほんにん/jinにほん)", correctAnswer: "にほんじん" }
      - { type: japanese_vocab, question: "子 (こ/し/じ/き)", correctAnswer: "こ" }
      - { type: japanese_vocab, question: "男 (おとこ/おんな/ひと/こ)", correctAnswer: "おとこ" }
      - { type: japanese_vocab, question: "女 (おんな/おとこ/ひと/こ)", correctAnswer: "おんな" }
      - { type: japanese_vocab, question: "私 (わたし/あなた/かれ/かのじょ)", correctAnswer: "わたし" }
      - { type: japanese_vocab, question: "男の子 (おとこのこ/おんなのこ/おとなのこ/おとこの)", correctAnswer: "おとこのこ" }
      - { type: japanese_vocab, question: "女の人 (おんなのひと/おとこのひと/おんなのこ/おとこのこ)", correctAnswer: "おんなのひと" }
      - { type: japanese_vocab, question: "大人 (おとな/こども/おとおな/おとなの)", correctAnswer: "おとな" }
      - { type: japanese_vocab, question: "友だち (ともだち/ゆうだち/ゆうじん/とも)", correctAnswer: "ともだち" }
  - pageNumber: 3
    title: Frases simples com pessoas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "私は日本人です。 (Sou japonês./Sou brasileiro./Sou estudante./Sou professor.)", correctAnswer: "Sou japonês." }
      - { type: japanese_vocab, question: "あの人は先生です。 (Aquela pessoa é professor./Aquela pessoa é estudante./Aquela pessoa é médico./Aquela pessoa é amiga.)", correctAnswer: "Aquela pessoa é professor." }
      - { type: japanese_vocab, question: "女の子がいます。 (Tem uma menina./Tem um menino./Tem um homem./Tem uma mulher.)", correctAnswer: "Tem uma menina." }
      - { type: japanese_vocab, question: "男の人です。 (É um homem./É uma mulher./É uma criança./É um bebê.)", correctAnswer: "É um homem." }
      - { type: japanese_vocab, question: "私の友だち。 (Meu amigo./Seu amigo./O amigo dele./A amiga dela.)", correctAnswer: "Meu amigo." }
      - { type: japanese_vocab, question: "子どもが三人います。 (Tem três crianças./Tem duas crianças./Tem quatro crianças./Tem cinco crianças.)", correctAnswer: "Tem três crianças." }
      - { type: japanese_vocab, question: "あなたは学生ですか。 (Você é estudante?/Você é professor?/Você é médico?/Você é japonês?)", correctAnswer: "Você é estudante?" }
      - { type: japanese_vocab, question: "大人二人と子ども一人。 (Dois adultos e uma criança./Um adulto e duas crianças./Três adultos./Três crianças.)", correctAnswer: "Dois adultos e uma criança." }
      - { type: japanese_vocab, question: "私は男です。 (Sou homem./Sou mulher./Sou criança./Sou adulto.)", correctAnswer: "Sou homem." }
      - { type: japanese_vocab, question: "あの女の人は日本人です。 (Aquela mulher é japonesa./Aquele homem é japonês./Aquela menina é japonesa./Aquele menino é japonês.)", correctAnswer: "Aquela mulher é japonesa." }
