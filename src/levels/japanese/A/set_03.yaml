      - { type: japanese_vocab, question: "子ども (idoso/bebê/criança/adulto)", correctAnswer: "criança", rationale: "O kanji 子ども significa \"criança\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "人々 (nação/mundo/pessoas/povo)", correctAnswer: "pessoas", rationale: "O kanji 人々 significa \"pessoas\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
