pages:
  - pageNumber: 1
    title: Kanji de pessoa
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "人 (pessoa/criança/homem/mulher)", correctAnswer: "pessoa", rationale: "O kanji 人 significa \"pessoa\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "子 (criança/pessoa/homem/mulher)", correctAnswer: "criança", rationale: "O kanji 子 significa \"criança\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "男 (homem/mulher/criança/pessoa)", correctAnswer: "homem", rationale: "O kanji 男 significa \"homem\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "女 (mulher/homem/criança/pessoa)", correctAnswer: "mulher", rationale: "O kanji 女 significa \"mulher\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私 (eu/você/ele/ela)", correctAnswer: "eu", objectives: [japanese.vocab], rationale: "O kanji 私 significa \"eu\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "男の子 (menino/menina/bebê/adulto)", correctAnswer: "menino", rationale: "O kanji 男の子 significa \"menino\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "女の子 (menina/menino/bebê/adulto)", correctAnswer: "menina", rationale: "O kanji 女の子 significa \"menina\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大人 (adulto/criança/idoso/bebê)", correctAnswer: "adulto", rationale: "O kanji 大人 significa \"adulto\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "子ども (criança/adulto/idoso/bebê)", correctAnswer: "criança", rationale: "O kanji 子ども significa \"criança\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "人々 (pessoas/povo/nação/mundo)", correctAnswer: "pessoas", rationale: "O kanji 人々 significa \"pessoas\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Leituras on/kun
    description: Escolha a leitura correta.
    exercises:
      - { type: japanese_vocab, question: "人 (ひと/じん/にん/jin)", correctAnswer: "ひと", rationale: "人 lê-se ひと. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本人 (にほんじん/にほんひと/にほんにん/jinにほん)", correctAnswer: "にほんじん", rationale: "日本人 lê-se にほんじん. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "子 (こ/し/じ/き)", correctAnswer: "こ", rationale: "子 lê-se こ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "男 (おとこ/おんな/ひと/こ)", correctAnswer: "おとこ", rationale: "男 lê-se おとこ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "女 (おんな/おとこ/ひと/こ)", correctAnswer: "おんな", rationale: "女 lê-se おんな. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私 (わたし/あなた/かれ/かのじょ)", correctAnswer: "わたし", rationale: "私 lê-se わたし. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "男の子 (おとこのこ/おんなのこ/おとなのこ/おとこの)", correctAnswer: "おとこのこ", rationale: "男の子 lê-se おとこのこ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "女の人 (おんなのひと/おとこのひと/おんなのこ/おとこのこ)", correctAnswer: "おんなのひと", rationale: "女の人 lê-se おんなのひと. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大人 (おとな/こども/おとおな/おとなの)", correctAnswer: "おとな", rationale: "大人 lê-se おとな. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "友だち (ともだち/ゆうだち/ゆうじん/とも)", correctAnswer: "ともだち", rationale: "友だち lê-se ともだち. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases simples com pessoas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "私は日本人です。 (Sou japonês./Sou brasileiro./Sou estudante./Sou professor.)", correctAnswer: "Sou japonês.", rationale: "O kanji 私は日本人です。 significa \"Sou japonês.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あの人は先生です。 (Aquela pessoa é professor./Aquela pessoa é estudante./Aquela pessoa é médico./Aquela pessoa é amiga.)", correctAnswer: "Aquela pessoa é professor.", rationale: "O kanji あの人は先生です。 significa \"Aquela pessoa é professor.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "女の子がいます。 (Tem uma menina./Tem um menino./Tem um homem./Tem uma mulher.)", correctAnswer: "Tem uma menina.", rationale: "O kanji 女の子がいます。 significa \"Tem uma menina.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "男の人です。 (É um homem./É uma mulher./É uma criança./É um bebê.)", correctAnswer: "É um homem.", rationale: "O kanji 男の人です。 significa \"É um homem.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私の友だち。 (Meu amigo./Seu amigo./O amigo dele./A amiga dela.)", correctAnswer: "Meu amigo.", rationale: "O kanji 私の友だち。 significa \"Meu amigo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "子どもが三人います。 (Tem três crianças./Tem duas crianças./Tem quatro crianças./Tem cinco crianças.)", correctAnswer: "Tem três crianças.", rationale: "O kanji 子どもが三人います。 significa \"Tem três crianças.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あなたは学生ですか。 (Você é estudante?/Você é professor?/Você é médico?/Você é japonês?)", correctAnswer: "Você é estudante?", rationale: "O kanji あなたは学生ですか。 significa \"Você é estudante?\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大人二人と子ども一人。 (Dois adultos e uma criança./Um adulto e duas crianças./Três adultos./Três crianças.)", correctAnswer: "Dois adultos e uma criança.", rationale: "O kanji 大人二人と子ども一人。 significa \"Dois adultos e uma criança.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私は男です。 (Sou homem./Sou mulher./Sou criança./Sou adulto.)", correctAnswer: "Sou homem.", rationale: "O kanji 私は男です。 significa \"Sou homem.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あの女の人は日本人です。 (Aquela mulher é japonesa./Aquele homem é japonês./Aquela menina é japonesa./Aquele menino é japonês.)", correctAnswer: "Aquela mulher é japonesa.", rationale: "O kanji あの女の人は日本人です。 significa \"Aquela mulher é japonesa.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
target: 30
