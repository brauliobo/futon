title: Kanji — Tempo 年 月 日 時 今 何
level: 'A'
subject: japanese
example: "年 = ano, 時 = hora, 今 = agora"
pages:
  - pageNumber: 1
    title: Kanji de tempo
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "年 (ano/mês/dia/hora)", correctAnswer: "ano" }
      - { type: japanese_vocab, question: "月 (mês/ano/dia/hora)", correctAnswer: "mês" }
      - { type: japanese_vocab, question: "日 (dia/mês/ano/hora)", correctAnswer: "dia" }
      - { type: japanese_vocab, question: "時 (hora/minuto/dia/mês)", correctAnswer: "hora" }
      - { type: japanese_vocab, question: "分 (minuto/hora/segundo/dia)", correctAnswer: "minuto" }
      - { type: japanese_vocab, question: "今 (agora/antes/depois/sempre)", correctAnswer: "agora" }
      - { type: japanese_vocab, question: "何 (o que/quem/onde/quando)", correctAnswer: "o que" }
      - { type: japanese_vocab, question: "前 (antes/depois/dentro/fora)", correctAnswer: "antes" }
      - { type: japanese_vocab, question: "後 (depois/antes/dentro/fora)", correctAnswer: "depois" }
      - { type: japanese_vocab, question: "半 (meio/todo/parte/nada)", correctAnswer: "meio" }
  - pageNumber: 2
    title: Expressões de tempo
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "今日 (hoje/amanhã/ontem/depois)", correctAnswer: "hoje" }
      - { type: japanese_vocab, question: "明日 (amanhã/hoje/ontem/depois)", correctAnswer: "amanhã" }
      - { type: japanese_vocab, question: "昨日 (ontem/hoje/amanhã/depois)", correctAnswer: "ontem" }
      - { type: japanese_vocab, question: "今年 (este ano/ano passado/próximo ano/dois anos atrás)", correctAnswer: "este ano" }
      - { type: japanese_vocab, question: "来年 (próximo ano/este ano/ano passado/dois anos atrás)", correctAnswer: "próximo ano" }
      - { type: japanese_vocab, question: "去年 (ano passado/este ano/próximo ano/dois anos atrás)", correctAnswer: "ano passado" }
      - { type: japanese_vocab, question: "毎日 (todo dia/toda semana/todo mês/todo ano)", correctAnswer: "todo dia" }
      - { type: japanese_vocab, question: "一時 (1 hora/2 horas/3 horas/4 horas)", correctAnswer: "1 hora" }
      - { type: japanese_vocab, question: "三時半 (3h30/3h/3h15/3h45)", correctAnswer: "3h30" }
      - { type: japanese_vocab, question: "午前 (manhã/tarde/noite/meio-dia)", correctAnswer: "manhã" }
  - pageNumber: 3
    title: Frases de tempo
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "今何時ですか。 (Que horas são agora?/Que dia é hoje?/Qual seu nome?/Como você está?)", correctAnswer: "Que horas são agora?" }
      - { type: japanese_vocab, question: "今日は何曜日ですか。 (Que dia da semana é hoje?/Que horas são?/Qual o dia?/Qual o mês?)", correctAnswer: "Que dia da semana é hoje?" }
      - { type: japanese_vocab, question: "明日の朝。 (Amanhã de manhã./Hoje de manhã./Ontem de manhã./Amanhã à tarde.)", correctAnswer: "Amanhã de manhã." }
      - { type: japanese_vocab, question: "昨日の夜。 (Ontem à noite./Hoje à noite./Amanhã à noite./Toda noite.)", correctAnswer: "Ontem à noite." }
      - { type: japanese_vocab, question: "三時に会いましょう。 (Vamos nos encontrar às 3h./Vamos nos encontrar hoje./Não podemos nos encontrar./Encontrei ontem.)", correctAnswer: "Vamos nos encontrar às 3h." }
      - { type: japanese_vocab, question: "毎日日本語を勉強する。 (Estudo japonês todo dia./Estudo japonês de vez em quando./Nunca estudei japonês./Vou estudar japonês.)", correctAnswer: "Estudo japonês todo dia." }
      - { type: japanese_vocab, question: "来年日本へ行く。 (Vou ao Japão ano que vem./Fui ao Japão ano passado./Estou no Japão./Moro no Japão.)", correctAnswer: "Vou ao Japão ano que vem." }
      - { type: japanese_vocab, question: "今は午後二時です。 (Agora são 14h./Agora são 2h./Agora são 12h./Agora são 22h.)", correctAnswer: "Agora são 14h." }
      - { type: japanese_vocab, question: "何時に起きますか。 (A que horas você acorda?/A que horas você dorme?/Onde você mora?/Quem é você?)", correctAnswer: "A que horas você acorda?" }
      - { type: japanese_vocab, question: "一年前。 (Um ano atrás./Um ano depois./Um mês atrás./Um dia atrás.)", correctAnswer: "Um ano atrás." }
