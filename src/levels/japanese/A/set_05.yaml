title: Kanji — Tempo 年 月 日 時 今 何
level: 'A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Kanji — Tempo 年 月 日 時 今 何. Foque no conceito central do conjunto e nos erros comuns."
example: "年 = ano, 時 = hora, 今 = agora"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 12
pages:
  - pageNumber: 1
    title: Kanji de tempo
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "年 (ano/mês/dia/hora)", correctAnswer: "ano", objectives: [japanese.vocab], rationale: "O kanji 年 significa \"ano\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "月 (mês/ano/dia/hora)", correctAnswer: "mês", rationale: "O kanji 月 significa \"mês\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日 (dia/mês/ano/hora)", correctAnswer: "dia", objectives: [japanese.vocab], rationale: "O kanji 日 significa \"dia\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "時 (hora/minuto/dia/mês)", correctAnswer: "hora", objectives: [japanese.vocab], rationale: "O kanji 時 significa \"hora\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "分 (minuto/hora/segundo/dia)", correctAnswer: "minuto", rationale: "O kanji 分 significa \"minuto\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今 (agora/antes/depois/sempre)", correctAnswer: "agora", rationale: "O kanji 今 significa \"agora\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "何 (o que/quem/onde/quando)", correctAnswer: "o que", rationale: "O kanji 何 significa \"o que\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "前 (antes/depois/dentro/fora)", correctAnswer: "antes", rationale: "O kanji 前 significa \"antes\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "後 (depois/antes/dentro/fora)", correctAnswer: "depois", rationale: "O kanji 後 significa \"depois\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "半 (meio/todo/parte/nada)", correctAnswer: "meio", objectives: [japanese.vocab], rationale: "O kanji 半 significa \"meio\". Observe o desenho como pista visual." }
  - pageNumber: 2
    title: Expressões de tempo
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "今日 (hoje/amanhã/ontem/depois)", correctAnswer: "hoje", objectives: [japanese.vocab], rationale: "O kanji 今日 significa \"hoje\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "明日 (amanhã/hoje/ontem/depois)", correctAnswer: "amanhã", rationale: "O kanji 明日 significa \"amanhã\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "昨日 (ontem/hoje/amanhã/depois)", correctAnswer: "ontem", rationale: "O kanji 昨日 significa \"ontem\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今年 (este ano/ano passado/próximo ano/dois anos atrás)", correctAnswer: "este ano", rationale: "O kanji 今年 significa \"este ano\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "来年 (próximo ano/este ano/ano passado/dois anos atrás)", correctAnswer: "próximo ano", rationale: "O kanji 来年 significa \"próximo ano\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "去年 (ano passado/este ano/próximo ano/dois anos atrás)", correctAnswer: "ano passado", rationale: "O kanji 去年 significa \"ano passado\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "毎日 (todo dia/toda semana/todo mês/todo ano)", correctAnswer: "todo dia", rationale: "O kanji 毎日 significa \"todo dia\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "一時 (1 hora/2 horas/3 horas/4 horas)", correctAnswer: "1 hora", rationale: "O kanji 一時 significa \"1 hora\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "三時半 (3h30/3h/3h15/3h45)", correctAnswer: "3h30", rationale: "O kanji 三時半 significa \"3h30\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "午前 (manhã/tarde/noite/meio-dia)", correctAnswer: "manhã", rationale: "O kanji 午前 significa \"manhã\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases de tempo
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "今何時ですか。 (Que horas são agora?/Que dia é hoje?/Qual seu nome?/Como você está?)", correctAnswer: "Que horas são agora?", rationale: "O kanji 今何時ですか。 significa \"Que horas são agora?\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は何曜日ですか。 (Que dia da semana é hoje?/Que horas são?/Qual o dia?/Qual o mês?)", correctAnswer: "Que dia da semana é hoje?", rationale: "O kanji 今日は何曜日ですか。 significa \"Que dia da semana é hoje?\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "明日の朝。 (Amanhã de manhã./Hoje de manhã./Ontem de manhã./Amanhã à tarde.)", correctAnswer: "Amanhã de manhã.", rationale: "O kanji 明日の朝。 significa \"Amanhã de manhã.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "昨日の夜。 (Ontem à noite./Hoje à noite./Amanhã à noite./Toda noite.)", correctAnswer: "Ontem à noite.", rationale: "O kanji 昨日の夜。 significa \"Ontem à noite.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "三時に会いましょう。 (Vamos nos encontrar às 3h./Vamos nos encontrar hoje./Não podemos nos encontrar./Encontrei ontem.)", correctAnswer: "Vamos nos encontrar às 3h.", rationale: "O kanji 三時に会いましょう。 significa \"Vamos nos encontrar às 3h.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "毎日日本語を勉強する。 (Estudo japonês todo dia./Estudo japonês de vez em quando./Nunca estudei japonês./Vou estudar japonês.)", correctAnswer: "Estudo japonês todo dia.", rationale: "O kanji 毎日日本語を勉強する。 significa \"Estudo japonês todo dia.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "来年日本へ行く。 (Vou ao Japão ano que vem./Fui ao Japão ano passado./Estou no Japão./Moro no Japão.)", correctAnswer: "Vou ao Japão ano que vem.", rationale: "O kanji 来年日本へ行く。 significa \"Vou ao Japão ano que vem.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今は午後二時です。 (Agora são 14h./Agora são 2h./Agora são 12h./Agora são 22h.)", correctAnswer: "Agora são 14h.", rationale: "O kanji 今は午後二時です。 significa \"Agora são 14h.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "何時に起きますか。 (A que horas você acorda?/A que horas você dorme?/Onde você mora?/Quem é você?)", correctAnswer: "A que horas você acorda?", rationale: "O kanji 何時に起きますか。 significa \"A que horas você acorda?\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "一年前。 (Um ano atrás./Um ano depois./Um mês atrás./Um dia atrás.)", correctAnswer: "Um ano atrás.", rationale: "O kanji 一年前。 significa \"Um ano atrás.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
target: 30
