title: 🔢 Kanji — 食飲見聞書読 (verbos de ação)
level: 'A'
subject: japanese
objectives: [japanese.kanji]
difficulty: 3
authorNotes: "Verbos de ação em kanji: comer, beber, ver, ouvir, escrever, ler. Base para formar frases N5."
example: "食 = comer (た・べる), 飲 = beber (の・む). Ex.: 食べる → comer, 見る → ver."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Leitura dos kanji de ação
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "食 (escrever/comer/beber/ver)", correctAnswer: "comer", rationale: "食 (た/しょく) → comer. Radical boca + comida.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "飲 (ler/ouvir/beber/escrever)", correctAnswer: "beber", rationale: "飲 (の/いん) → beber. Radical comida + pessoa.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "見 (ouvir/escrever/ler/ver)", correctAnswer: "ver", rationale: "見 (み/けん) → ver. Radical olho + pessoa.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "聞 (ver/ler/ouvir/escrever)", correctAnswer: "ouvir", rationale: "聞 (き/ぶん) → ouvir/perguntar. Radical ouvido + portão.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "書 (beber/escrever/comer/ver)", correctAnswer: "escrever", rationale: "書 (か/しょ) → escrever. Radical pincel + sol.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "読 (ouvir/comer/beber/ler)", correctAnswer: "ler", rationale: "読 (よ/どく) → ler. Radical palavras + vender.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "食べる (ler/beber/ver/comer)", correctAnswer: "comer", rationale: "食べる (たべる) → comer. Forma de dicionário do verbo.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "飲む (escrever/beber/ouvir/ler)", correctAnswer: "beber", rationale: "飲む (のむ) → beber. Forma de dicionário do verbo.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "書く (comer/ver/escrever/ouvir)", correctAnswer: "escrever", rationale: "書く (かく) → escrever. Forma de dicionário do verbo.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "読む (beber/ler/comer/escrever)", correctAnswer: "ler", rationale: "読む (よむ) → ler. Forma de dicionário do verbo.", difficulty: 3, objectives: [japanese.kanji] }
  - pageNumber: 2
    title: Verbos em frases
    description: Leia a frase e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "ごはんを食べます。 (Leio um livro./Escrevo algo./Como arroz./Bebo suco.)", correctAnswer: "Como arroz.", rationale: "ごはん → arroz/refeição, 食べます → comer (forma polida).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "水を飲みます。 (Bebo água./Como peixe./Leio o jornal./Ouço música.)", correctAnswer: "Bebo água.", rationale: "水 → água, 飲みます → beber (forma polida).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "映画を見ます。 (Ouço rádio./Escrevo carta./Vejo filme./Leio mangá.)", correctAnswer: "Vejo filme.", rationale: "映画 → filme, 見ます → ver (forma polida).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "音楽を聞きます。 (Vejo televisão./Escrevo e-mail./Ouço música./Como bolo.)", correctAnswer: "Ouço música.", rationale: "音楽 → música, 聞きます → ouvir (forma polida).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "手紙を書きます。 (Leio livro./Bebo chá./Ouço canção./Escrevo carta.)", correctAnswer: "Escrevo carta.", rationale: "手紙 → carta, 書きます → escrever (forma polida).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "本を読みます。 (Bebo café./Como pizza./Escrevo nome./Leio livro.)", correctAnswer: "Leio livro.", rationale: "本 → livro, 読みます → ler (forma polida).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "何を食べますか。 (O que vai beber?/O que vai escrever?/O que vai comer?/O que vai ouvir?)", correctAnswer: "O que vai comer?", rationale: "何 → o quê, 食べますか → vai comer? (pergunta polida).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "毎日本を読みます。 (Ouço rádio todo dia./Escrevo todo dia./Leio livro todo dia./Vejo televisão todo dia.)", correctAnswer: "Leio livro todo dia.", rationale: "毎日 → todo dia, 本 → livro, 読みます → ler.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "友だちと映画を見ます。 (Vejo filme sozinho./Vejo filme com amigos./Ouço música com amigos./Leio mangá com amigos.)", correctAnswer: "Vejo filme com amigos.", rationale: "友だちと → com amigos, 映画を見ます → ver filme.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "毎朝新聞を読みます。 (Ouço notícias todo dia./Leio jornal toda manhã./Escrevo todo dia./Vejo notícias à noite.)", correctAnswer: "Leio jornal toda manhã.", rationale: "毎朝 → toda manhã, 新聞 → jornal, 読みます → ler.", difficulty: 4, objectives: [japanese.kanji] }
target: 20
