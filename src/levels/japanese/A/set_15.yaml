title: 📝 Frases com に + 行く/来る/帰る (direção)
level: 'A'
subject: japanese
objectives: [japanese.grammar]
difficulty: 3
authorNotes: "Partícula に indicando destino com verbos de movimento: 行く (ir), 来る (vir), 帰る (voltar)."
example: "に + verbo de movimento = direção. Ex.: 学校に行きます → Vou à escola."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Verbos de movimento com に
    description: Escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "学校に行きます。 (Saio da escola./Estou na escola./Vou à escola./Volto para a escola.)", correctAnswer: "Vou à escola.", rationale: "学校に = à escola (destino), 行きます = ir (forma polida).", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "うちに帰ります。 (Saio de casa./Estou em casa./Vou para casa./Chego à casa.)", correctAnswer: "Vou para casa.", rationale: "うちに = para casa (destino), 帰ります = voltar/retornar.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本に来ます。 (Saio do Japão./Estou no Japão./Venho ao Japão./Vou ao Japão.)", correctAnswer: "Venho ao Japão.", rationale: "日本に = ao Japão (destino), 来ます = vir (forma polida).", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "公園に行きます。 (Volto do parque./Venho do parque./Vou ao parque./Estou no parque.)", correctAnswer: "Vou ao parque.", rationale: "公園に = ao parque (destino), 行きます = ir.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "家に帰りません。 (Voltarei para casa./Vim para casa./Não volto para casa./Saí de casa.)", correctAnswer: "Não volto para casa.", rationale: "家に = para casa, 帰りません = não voltar (forma negativa polida).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どこに行きますか。 (De onde você vem?/Onde você está?/Para onde você vai?/Por onde você vai?)", correctAnswer: "Para onde você vai?", rationale: "どこに = para onde (destino), 行きますか = vai ir? (pergunta).", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友だちが来ます。 (Visito um amigo./Meu amigo sai./Espero um amigo./Um amigo vem.)", correctAnswer: "Um amigo vem.", rationale: "友だちが = amigo (sujeito), 来ます = vir.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "病院に行きます。 (Vou ao banco./Vou ao hospital./Volto do hospital./Venho do hospital.)", correctAnswer: "Vou ao hospital.", rationale: "病院に = ao hospital (destino), 行きます = ir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "何時に帰りますか。 (A que horas chega?/A que horas sai?/A que horas vai?/A que horas volta?)", correctAnswer: "A que horas volta?", rationale: "何時に = a que horas, 帰りますか = vai voltar? (pergunta).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明日また来ます。 (Vim ontem./Não venho mais./Venho amanhã de novo./Vou amanhã.)", correctAnswer: "Venho amanhã de novo.", rationale: "明日 = amanhã, また = de novo, 来ます = vir.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases mais longas com direção
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "毎日学校に行きます。 (Estudo todo dia./Vou à escola todo dia./Volto para casa todo dia./Venho do parque todo dia.)", correctAnswer: "Vou à escola todo dia.", rationale: "毎日 = todo dia, 学校に = à escola, 行きます = ir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友だちと映画館に行きます。 (Vou ao cinema com amigos./Vou ao cinema sozinho./Venho do cinema com amigos./Volto para casa com amigos.)", correctAnswer: "Vou ao cinema com amigos.", rationale: "友だちと = com amigos, 映画館に = ao cinema, 行きます = ir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "母が私のうちに来ます。 (Visito minha mãe./Minha mãe vem à minha casa./Saio da casa da minha mãe./Minha mãe vai para casa.)", correctAnswer: "Minha mãe vem à minha casa.", rationale: "母が = minha mãe (sujeito), 私のうちに = à minha casa, 来ます = vir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "六時に家に帰ります。 (Saio de casa às seis./Chego às seis./Volto para casa às seis./Venho de casa às seis.)", correctAnswer: "Volto para casa às seis.", rationale: "六時に = às seis horas, 家に = para casa, 帰ります = voltar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来年日本に行きたいです。 (Fui ao Japão no ano passado./Quero ir ao Japão no ano que vem./Vou ao Japão agora./Não quero ir ao Japão.)", correctAnswer: "Quero ir ao Japão no ano que vem.", rationale: "来年 = ano que vem, 日本に = ao Japão, 行きたいです = quero ir.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どこに帰りますか。 (Para onde você vai?/De onde você vem?/Onde você mora?/Para onde você volta?)", correctAnswer: "Para onde você volta?", rationale: "どこに = para onde, 帰りますか = vai voltar? (pergunta).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生が教室に来ました。 (O professor saiu da sala./O professor foi à sala./O professor veio à sala./O aluno entrou na sala.)", correctAnswer: "O professor veio à sala.", rationale: "先生が = professor (sujeito), 教室に = à sala de aula, 来ました = veio (passado).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "週末は山に行きます。 (Fico em casa no fim de semana./Vou à montanha no fim de semana./Volto para a montanha./Venho da montanha no fim de semana.)", correctAnswer: "Vou à montanha no fim de semana.", rationale: "週末は = no fim de semana, 山に = à montanha, 行きます = ir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "バスで学校に行きます。 (Vou à escola a pé./Volto da escola de ônibus./Vou à escola de ônibus./Venho à escola de trem.)", correctAnswer: "Vou à escola de ônibus.", rationale: "バスで = de ônibus, 学校に = à escola, 行きます = ir.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "今日は家に帰りません。 (Voltei para casa hoje./Hoje não volto para casa./Hoje estou em casa./Saio de casa hoje.)", correctAnswer: "Hoje não volto para casa.", rationale: "今日は = hoje, 家に = para casa, 帰りません = não voltar (negativo).", difficulty: 4, objectives: [japanese.grammar] }
target: 20
