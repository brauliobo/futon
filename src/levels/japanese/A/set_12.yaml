title: Revisão A — 80 kanji + sentenças básicas
level: 'A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Revisão A — 80 kanji + sentenças básicas. Foque no conceito central do conjunto e nos erros comuns."
example: "Você domina: números, pessoas, tempo, natureza, posição, tamanho, demonstrativos, perguntas. Ex.: 三人 → 3 pessoas."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 12
pages:
  - pageNumber: 1
    title: Kanji misto
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "三人 (3 pessoas/3 livros/3 dias/3 carros)", correctAnswer: "3 pessoas", rationale: "O kanji 三人 significa \"3 pessoas\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本 (Japão/Tailândia/Coreia/China)", correctAnswer: "Japão", rationale: "O kanji 日本 significa \"Japão\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今年 (próximo ano/mês/ano passado/este ano)", correctAnswer: "este ano", rationale: "O kanji 今年 significa \"este ano\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "水曜日 (quarta/sexta/quinta/terça)", correctAnswer: "quarta", rationale: "O kanji 水曜日 significa \"quarta\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山の上 (topo da montanha/ao lado da montanha/dentro da montanha/pé da montanha)", correctAnswer: "topo da montanha", rationale: "O kanji 山の上 significa \"topo da montanha\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大きい (alto/baixo/pequeno/grande)", correctAnswer: "grande", rationale: "O kanji 大きい significa \"grande\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, difficulty: 3, question: "新しい (novo/feio/bonito/velho)", correctAnswer: "novo", objectives: [japanese.vocab], rationale: "O kanji 新しい significa \"novo\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "女の子 (mulher/homem/menina/menino)", correctAnswer: "menina", rationale: "O kanji 女の子 significa \"menina\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, difficulty: 3, question: "今日 (hoje/semana/ontem/amanhã)", correctAnswer: "hoje", objectives: [japanese.vocab], rationale: "O kanji 今日 significa \"hoje\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "右 (direita/frente/esquerda/atrás)", correctAnswer: "direita", rationale: "O kanji 右 significa \"direita\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Frases completas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "私は日本人じゃないです。 (Ele é japonês./Não sou japonês./Sou japonês./Ela não é japonesa.)", correctAnswer: "Não sou japonês.", rationale: "O kanji 私は日本人じゃないです。 significa \"Não sou japonês.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは何ですか。 (O que é isto?/O que é aquilo?/Onde está?/Quem é?)", correctAnswer: "O que é isto?", rationale: "O kanji これは何ですか。 significa \"O que é isto?\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は金曜日です。 (Amanhã é sexta./Ontem foi sexta./Hoje é sábado./Hoje é sexta.)", correctAnswer: "Hoje é sexta.", rationale: "O kanji 今日は金曜日です。 significa \"Hoje é sexta.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "小さい子どもがいます。 (Tem um adulto grande./Tem três crianças./Não tem ninguém./Tem uma criança pequena.)", correctAnswer: "Tem uma criança pequena.", rationale: "O kanji 小さい子どもがいます。 significa \"Tem uma criança pequena.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あの山は高い。 (Aquela montanha é baixa./Aquela montanha é alta./Este lago é fundo./Este prédio é alto.)", correctAnswer: "Aquela montanha é alta.", rationale: "O kanji あの山は高い。 significa \"Aquela montanha é alta.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "駅の前で会う。 (Não nos encontramos./Vamos à estação./Nos encontramos em frente à estação./Nos encontramos atrás da estação.)", correctAnswer: "Nos encontramos em frente à estação.", rationale: "O kanji 駅の前で会う。 significa \"Nos encontramos em frente à estação.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私の友だちは三人います。 (Tenho quatro amigos./Não tenho amigos./Tenho dois amigos./Tenho três amigos.)", correctAnswer: "Tenho três amigos.", rationale: "O kanji 私の友だちは三人います。 significa \"Tenho três amigos.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今何時ですか。 (Que horas são agora?/Que dia é hoje?/Onde é?/O que é isto?)", correctAnswer: "Que horas são agora?", rationale: "O kanji 今何時ですか。 significa \"Que horas são agora?\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "来年日本に行きます。 (Vou ao Japão ano que vem./Fui ao Japão ano passado./Estou no Japão./Voltei do Japão.)", correctAnswer: "Vou ao Japão ano que vem.", rationale: "O kanji 来年日本に行きます。 significa \"Vou ao Japão ano que vem.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "古い本と新しい本。 (Livro velho e livro novo./Só livro novo./Só livro velho./Dois livros velhos.)", correctAnswer: "Livro velho e livro novo.", rationale: "O kanji 古い本と新しい本。 significa \"Livro velho e livro novo.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Avaliação final A
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "私は学生で、ブラジル人です。 (Sou estudante e sou brasileiro./Sou brasileiro e professor./Sou estudante mas não brasileiro./Não sou estudante.)", correctAnswer: "Sou estudante e sou brasileiro.", rationale: "O kanji 私は学生で、ブラジル人です。 significa \"Sou estudante e sou brasileiro.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あの女の人は先生ですか。 (Aquela mulher é professora?/Aquele homem é professor?/Esta mulher é professora?/Essa mulher é aluna?)", correctAnswer: "Aquela mulher é professora?", rationale: "O kanji あの女の人は先生ですか。 significa \"Aquela mulher é professora?\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この本はいくらですか。 (Quanto custa este livro?/Onde está este livro?/Quem tem este livro?/O que é este livro?)", correctAnswer: "Quanto custa este livro?", rationale: "O kanji この本はいくらですか。 significa \"Quanto custa este livro?\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山の中に小さい川。 (Uma grande montanha no rio./Um lago na montanha./Um pequeno rio na montanha./Um rio na cidade.)", correctAnswer: "Um pequeno rio na montanha.", rationale: "O kanji 山の中に小さい川。 significa \"Um pequeno rio na montanha.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "明日は何曜日ですか。 (Que dia é amanhã?/Que dia é hoje?/Que dia foi ontem?/Que horas são?)", correctAnswer: "Que dia é amanhã?", rationale: "O kanji 明日は何曜日ですか。 significa \"Que dia é amanhã?\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あなたの名前は何ですか。 (Qual é o seu nome?/Qual sua idade?/De onde você é?/Que hora é?)", correctAnswer: "Qual é o seu nome?", rationale: "O kanji あなたの名前は何ですか。 significa \"Qual é o seu nome?\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日はいい天気です。 (Hoje o tempo está ruim./Amanhã o tempo será bom./Hoje o tempo está bom./Ontem o tempo estava bom.)", correctAnswer: "Hoje o tempo está bom.", rationale: "O kanji 今日はいい天気です。 significa \"Hoje o tempo está bom.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私は日本語の学生です。 (Sou professor de japonês./Não falo japonês./Falo japonês./Sou estudante de japonês.)", correctAnswer: "Sou estudante de japonês.", rationale: "O kanji 私は日本語の学生です。 significa \"Sou estudante de japonês.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "それは大きい犬です。 (Isso é um cachorro pequeno./Aquilo é um gato./Isso é um cachorro grande./Isto é um cachorro.)", correctAnswer: "Isso é um cachorro grande.", rationale: "O kanji それは大きい犬です。 significa \"Isso é um cachorro grande.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ここは学校じゃないです。 (Este lugar não é escola./Este lugar é escola./Aquele lugar é escola./Qual é a escola?)", correctAnswer: "Este lugar não é escola.", rationale: "O kanji ここは学校じゃないです。 significa \"Este lugar não é escola.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
target: 30
