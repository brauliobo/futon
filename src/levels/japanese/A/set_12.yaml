title: Revisão A — 80 kanji + sentenças básicas
level: 'A'
subject: japanese
authorNotes: "Revisão A — 80 kanji + sentenças básicas. Foque no conceito central do conjunto e nos erros comuns."
example: "Você domina: números, pessoas, tempo, natureza, posição, tamanho, demonstrativos, perguntas. Ex.: 三人 → 3 pessoas."
pages:
  - pageNumber: 1
    title: Kanji misto
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "三人 (3 pessoas/3 dias/3 livros/3 carros)", correctAnswer: "3 pessoas", rationale: "O kanji 三人 significa \"3 pessoas\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "日本 (Japão/China/Coreia/Tailândia)", correctAnswer: "Japão", rationale: "O kanji 日本 significa \"Japão\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "今年 (este ano/ano passado/próximo ano/mês)", correctAnswer: "este ano", rationale: "O kanji 今年 significa \"este ano\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "水曜日 (quarta/terça/quinta/sexta)", correctAnswer: "quarta", rationale: "O kanji 水曜日 significa \"quarta\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "山の上 (topo da montanha/pé da montanha/dentro da montanha/ao lado da montanha)", correctAnswer: "topo da montanha", rationale: "O kanji 山の上 significa \"topo da montanha\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "大きい (grande/pequeno/alto/baixo)", correctAnswer: "grande", rationale: "O kanji 大きい significa \"grande\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "新しい (novo/velho/bonito/feio)", correctAnswer: "novo" }
      - { type: japanese_vocab, question: "女の子 (menina/menino/mulher/homem)", correctAnswer: "menina", rationale: "O kanji 女の子 significa \"menina\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "今日 (hoje/amanhã/ontem/semana)", correctAnswer: "hoje" }
      - { type: japanese_vocab, question: "右 (direita/esquerda/frente/atrás)", correctAnswer: "direita", rationale: "O kanji 右 significa \"direita\". Observe o desenho como pista visual." }
  - pageNumber: 2
    title: Frases completas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "私は日本人じゃないです。 (Não sou japonês./Sou japonês./Ela não é japonesa./Ele é japonês.)", correctAnswer: "Não sou japonês.", rationale: "O kanji 私は日本人じゃないです。 significa \"Não sou japonês.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "これは何ですか。 (O que é isto?/O que é aquilo?/Onde está?/Quem é?)", correctAnswer: "O que é isto?", rationale: "O kanji これは何ですか。 significa \"O que é isto?\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "今日は金曜日です。 (Hoje é sexta./Hoje é sábado./Amanhã é sexta./Ontem foi sexta.)", correctAnswer: "Hoje é sexta.", rationale: "O kanji 今日は金曜日です。 significa \"Hoje é sexta.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "小さい子どもがいます。 (Tem uma criança pequena./Tem um adulto grande./Tem três crianças./Não tem ninguém.)", correctAnswer: "Tem uma criança pequena.", rationale: "O kanji 小さい子どもがいます。 significa \"Tem uma criança pequena.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "あの山は高い。 (Aquela montanha é alta./Aquela montanha é baixa./Este prédio é alto./Este lago é fundo.)", correctAnswer: "Aquela montanha é alta.", rationale: "O kanji あの山は高い。 significa \"Aquela montanha é alta.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "駅の前で会う。 (Nos encontramos em frente à estação./Nos encontramos atrás da estação./Não nos encontramos./Vamos à estação.)", correctAnswer: "Nos encontramos em frente à estação.", rationale: "O kanji 駅の前で会う。 significa \"Nos encontramos em frente à estação.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "私の友だちは三人います。 (Tenho três amigos./Tenho dois amigos./Tenho quatro amigos./Não tenho amigos.)", correctAnswer: "Tenho três amigos.", rationale: "O kanji 私の友だちは三人います。 significa \"Tenho três amigos.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "今何時ですか。 (Que horas são agora?/Que dia é hoje?/Onde é?/O que é isto?)", correctAnswer: "Que horas são agora?", rationale: "O kanji 今何時ですか。 significa \"Que horas são agora?\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "来年日本に行きます。 (Vou ao Japão ano que vem./Fui ao Japão ano passado./Estou no Japão./Voltei do Japão.)", correctAnswer: "Vou ao Japão ano que vem.", rationale: "O kanji 来年日本に行きます。 significa \"Vou ao Japão ano que vem.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "古い本と新しい本。 (Livro velho e livro novo./Só livro novo./Só livro velho./Dois livros velhos.)", correctAnswer: "Livro velho e livro novo.", rationale: "O kanji 古い本と新しい本。 significa \"Livro velho e livro novo.\". Observe o desenho como pista visual." }
  - pageNumber: 3
    title: Avaliação final A
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "私は学生で、ブラジル人です。 (Sou estudante e sou brasileiro./Sou estudante mas não brasileiro./Sou brasileiro e professor./Não sou estudante.)", correctAnswer: "Sou estudante e sou brasileiro.", rationale: "O kanji 私は学生で、ブラジル人です。 significa \"Sou estudante e sou brasileiro.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "あの女の人は先生ですか。 (Aquela mulher é professora?/Aquele homem é professor?/Esta mulher é professora?/Essa mulher é aluna?)", correctAnswer: "Aquela mulher é professora?", rationale: "O kanji あの女の人は先生ですか。 significa \"Aquela mulher é professora?\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "この本はいくらですか。 (Quanto custa este livro?/Onde está este livro?/Quem tem este livro?/O que é este livro?)", correctAnswer: "Quanto custa este livro?", rationale: "O kanji この本はいくらですか。 significa \"Quanto custa este livro?\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "山の中に小さい川。 (Um pequeno rio na montanha./Uma grande montanha no rio./Um rio na cidade./Um lago na montanha.)", correctAnswer: "Um pequeno rio na montanha.", rationale: "O kanji 山の中に小さい川。 significa \"Um pequeno rio na montanha.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "明日は何曜日ですか。 (Que dia é amanhã?/Que dia é hoje?/Que dia foi ontem?/Que horas são?)", correctAnswer: "Que dia é amanhã?", rationale: "O kanji 明日は何曜日ですか。 significa \"Que dia é amanhã?\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "あなたの名前は何ですか。 (Qual é o seu nome?/Qual sua idade?/De onde você é?/Que hora é?)", correctAnswer: "Qual é o seu nome?", rationale: "O kanji あなたの名前は何ですか。 significa \"Qual é o seu nome?\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "今日はいい天気です。 (Hoje o tempo está bom./Hoje o tempo está ruim./Ontem o tempo estava bom./Amanhã o tempo será bom.)", correctAnswer: "Hoje o tempo está bom.", rationale: "O kanji 今日はいい天気です。 significa \"Hoje o tempo está bom.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "私は日本語の学生です。 (Sou estudante de japonês./Sou professor de japonês./Falo japonês./Não falo japonês.)", correctAnswer: "Sou estudante de japonês.", rationale: "O kanji 私は日本語の学生です。 significa \"Sou estudante de japonês.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "それは大きい犬です。 (Isso é um cachorro grande./Isso é um cachorro pequeno./Isto é um cachorro./Aquilo é um gato.)", correctAnswer: "Isso é um cachorro grande.", rationale: "O kanji それは大きい犬です。 significa \"Isso é um cachorro grande.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "ここは学校じゃないです。 (Este lugar não é escola./Este lugar é escola./Aquele lugar é escola./Qual é a escola?)", correctAnswer: "Este lugar não é escola.", rationale: "O kanji ここは学校じゃないです。 significa \"Este lugar não é escola.\". Observe o desenho como pista visual." }
target: 30
