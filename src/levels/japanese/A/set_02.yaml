title: Kanji — Números 六 七 八 九 十 百 千 万
level: 'A'
subject: japanese
difficulty: 2
authorNotes: "Kanji — Números 六 七 八 九 十 百 千 万. Foque no conceito central do conjunto e nos erros comuns."
example: "百 = 100, 千 = 1000, 万 = 10.000 (10 mil)"
pages:
  - pageNumber: 1
    title: Kanji de 6 a 10
    description: Leia e escolha o número.
    exercises:
      - { type: japanese_vocab, question: "六 (6/7/8/9)", correctAnswer: "6", rationale: "O kanji 六 representa o número 6." }
      - { type: japanese_vocab, question: "七 (6/7/8/9)", correctAnswer: "7", rationale: "O kanji 七 representa o número 7." }
      - { type: japanese_vocab, question: "八 (6/7/8/9)", correctAnswer: "8", rationale: "O kanji 八 representa o número 8." }
      - { type: japanese_vocab, question: "九 (6/7/8/9)", correctAnswer: "9", rationale: "O kanji 九 representa o número 9." }
      - { type: japanese_vocab, question: "十 (10/11/12/20)", correctAnswer: "10", rationale: "O kanji 十 representa o número 10." }
      - { type: japanese_vocab, question: "六 (ろく/なな/はち/きゅう)", correctAnswer: "ろく", rationale: "六 lê-se ろく. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "七 (なな/ろく/はち/きゅう)", correctAnswer: "なな", rationale: "七 lê-se なな. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "八 (はち/なな/ろく/きゅう)", correctAnswer: "はち", rationale: "八 lê-se はち. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "九 (きゅう/はち/なな/ろく)", correctAnswer: "きゅう", rationale: "九 lê-se きゅう. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "十 (じゅう/きゅう/はち/なな)", correctAnswer: "じゅう", rationale: "十 lê-se じゅう. Pratique associar o traço ao som." }
  - pageNumber: 2
    title: Dezenas e grandes números
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "十一 (11/12/21/100)", correctAnswer: "11", rationale: "O kanji 十一 representa o número 11." }
      - { type: japanese_vocab, question: "十二 (12/21/22/11)", correctAnswer: "12", rationale: "O kanji 十二 representa o número 12." }
      - { type: japanese_vocab, question: "二十 (20/22/12/200)", correctAnswer: "20", rationale: "O kanji 二十 representa o número 20." }
      - { type: japanese_vocab, question: "三十 (30/33/13/300)", correctAnswer: "30", rationale: "O kanji 三十 representa o número 30." }
      - { type: japanese_vocab, question: "五十 (50/55/15/500)", correctAnswer: "50", rationale: "O kanji 五十 representa o número 50." }
      - { type: japanese_vocab, question: "百 (100/10/1000/10000)", correctAnswer: "100", rationale: "O kanji 百 representa o número 100." }
      - { type: japanese_vocab, question: "千 (1000/100/10/10000)", correctAnswer: "1000", rationale: "O kanji 千 representa o número 1000." }
      - { type: japanese_vocab, question: "万 (10000/1000/100/100000)", correctAnswer: "10000", rationale: "O kanji 万 representa o número 10000." }
      - { type: japanese_vocab, question: "二百 (200/20/2000/250)", correctAnswer: "200", rationale: "O kanji 二百 representa o número 200." }
      - { type: japanese_vocab, question: "三千 (3000/300/30/3300)", correctAnswer: "3000", rationale: "O kanji 三千 representa o número 3000." }
  - pageNumber: 3
    title: Leitura de números
    description: Escolha a leitura correta.
    exercises:
      - { type: japanese_vocab, question: "十一 (じゅういち/じゅうに/にじゅう/じゅう)", correctAnswer: "じゅういち", rationale: "十一 lê-se じゅういち. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "二十 (にじゅう/じゅうに/にじゅういち/じゅう)", correctAnswer: "にじゅう", rationale: "二十 lê-se にじゅう. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "百 (ひゃく/せん/じゅう/まん)", correctAnswer: "ひゃく", rationale: "百 lê-se ひゃく. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "千 (せん/ひゃく/まん/じゅう)", correctAnswer: "せん", rationale: "千 lê-se せん. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "万 (まん/せん/ひゃく/じゅう)", correctAnswer: "まん", rationale: "万 lê-se まん. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "三百 (さんびゃく/さんひゃく/さんぴゃく/さんぴく)", correctAnswer: "さんびゃく", rationale: "三百 lê-se さんびゃく. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "六百 (ろっぴゃく/ろくひゃく/ろっひゃく/ろっぴゅく)", correctAnswer: "ろっぴゃく", rationale: "六百 lê-se ろっぴゃく. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "八百 (はっぴゃく/はちひゃく/はっひゃく/はちぴゃく)", correctAnswer: "はっぴゃく", rationale: "八百 lê-se はっぴゃく. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "三千 (さんぜん/さんせん/さんぢぇん/みっせん)", correctAnswer: "さんぜん", rationale: "三千 lê-se さんぜん. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "八千 (はっせん/はちせん/はっぜん/はちぜん)", correctAnswer: "はっせん", rationale: "八千 lê-se はっせん. Pratique associar o traço ao som." }
target: 30
