      - { type: japanese_vocab, question: "土曜日と日曜日は休み。 (Sábado e domingo são folga./Sexta é folga./Toda semana é folga./Segunda e terça são folga.)", correctAnswer: "Sábado e domingo são folga.", rationale: "O kanji 土曜日と日曜日は休み。 significa \"Sábado e domingo são folga.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本の日。 (Sol do Japão./Dia do Japão./Terra do Japão./Lua do Japão.)", correctAnswer: "Dia do Japão.", rationale: "O kanji 日本の日。 significa \"Dia do Japão.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "水を飲む。 (Ver água./Cortar água./Beber água./Usar água.)", correctAnswer: "Beber água.", rationale: "O kanji 水を飲む。 significa \"Beber água.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "木の下に猫。 (Árvore alta./Folha caindo./Gato debaixo da árvore./Pássaro na árvore.)", correctAnswer: "Gato debaixo da árvore.", rationale: "O kanji 木の下に猫。 significa \"Gato debaixo da árvore.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "火を消す。 (Acender o fogo./Ver o fogo./Fazer fogo./Apagar o fogo.)", correctAnswer: "Apagar o fogo.", rationale: "O kanji 火を消す。 significa \"Apagar o fogo.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "お金がある。 (Não tenho dinheiro./Quero dinheiro./Gasto dinheiro./Tenho dinheiro.)", correctAnswer: "Tenho dinheiro.", rationale: "O kanji お金がある。 significa \"Tenho dinheiro.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
