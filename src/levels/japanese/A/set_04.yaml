      - { type: japanese_vocab, question: "今日は月曜日です。 (Hoje é segunda./Hoje é terça./Amanhã é segunda./Ontem foi segunda.)", correctAnswer: "Hoje é segunda.", rationale: "O kanji 今日は月曜日です。 significa \"Hoje é segunda.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
