title: Kanji — Dias da semana 月 火 水 木 金 土 日
level: 'A'
subject: japanese
authorNotes: "Kanji — Dias da semana 月 火 水 木 金 土 日. Foque no conceito central do conjunto e nos erros comuns."
example: "月 = lua/segunda, 火 = fogo/terça, 水 = água/quarta"
pages:
  - pageNumber: 1
    title: Elementos & dias
    description: Leia e escolha o significado primário.
    exercises:
      - { type: japanese_vocab, question: "月 (lua/sol/terra/água)", correctAnswer: "lua" }
      - { type: japanese_vocab, question: "火 (fogo/água/terra/ar)", correctAnswer: "fogo" }
      - { type: japanese_vocab, question: "水 (água/fogo/terra/ar)", correctAnswer: "água" }
      - { type: japanese_vocab, question: "木 (árvore/pedra/folha/raiz)", correctAnswer: "árvore" }
      - { type: japanese_vocab, question: "金 (ouro/prata/ferro/bronze)", correctAnswer: "ouro" }
      - { type: japanese_vocab, question: "土 (terra/água/fogo/ar)", correctAnswer: "terra" }
      - { type: japanese_vocab, question: "日 (sol/lua/estrela/nuvem)", correctAnswer: "sol" }
      - { type: japanese_vocab, question: "月 (つき/ひ/き/にち)", correctAnswer: "つき" }
      - { type: japanese_vocab, question: "火 (ひ/つき/みず/き)", correctAnswer: "ひ" }
      - { type: japanese_vocab, question: "水 (みず/ひ/つき/き)", correctAnswer: "みず" }
  - pageNumber: 2
    title: Dias da semana
    description: Leia e escolha o dia.
    exercises:
      - { type: japanese_vocab, question: "月曜日 (segunda/terça/quarta/quinta)", correctAnswer: "segunda" }
      - { type: japanese_vocab, question: "火曜日 (terça/segunda/quarta/quinta)", correctAnswer: "terça" }
      - { type: japanese_vocab, question: "水曜日 (quarta/terça/quinta/sexta)", correctAnswer: "quarta" }
      - { type: japanese_vocab, question: "木曜日 (quinta/quarta/sexta/sábado)", correctAnswer: "quinta" }
      - { type: japanese_vocab, question: "金曜日 (sexta/quinta/sábado/domingo)", correctAnswer: "sexta" }
      - { type: japanese_vocab, question: "土曜日 (sábado/sexta/domingo/segunda)", correctAnswer: "sábado" }
      - { type: japanese_vocab, question: "日曜日 (domingo/sábado/segunda/terça)", correctAnswer: "domingo" }
      - { type: japanese_vocab, question: "月曜日 (げつようび/かようび/すいようび/もくようび)", correctAnswer: "げつようび" }
      - { type: japanese_vocab, question: "金曜日 (きんようび/もくようび/どようび/にちようび)", correctAnswer: "きんようび" }
      - { type: japanese_vocab, question: "日曜日 (にちようび/どようび/げつようび/かようび)", correctAnswer: "にちようび" }
  - pageNumber: 3
    title: Frases com dias
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "今日は月曜日です。 (Hoje é segunda./Hoje é terça./Amanhã é segunda./Ontem foi segunda.)", correctAnswer: "Hoje é segunda." }
      - { type: japanese_vocab, question: "明日は火曜日です。 (Amanhã é terça./Hoje é terça./Ontem foi terça./Amanhã é quarta.)", correctAnswer: "Amanhã é terça." }
      - { type: japanese_vocab, question: "日本語は水曜日です。 (Japonês é na quarta./Japonês é na terça./Japonês é hoje./Japonês é segunda.)", correctAnswer: "Japonês é na quarta." }
      - { type: japanese_vocab, question: "金曜日に会います。 (Nos encontramos na sexta./Nos encontramos na quinta./Nos encontramos na terça./Nos encontramos no sábado.)", correctAnswer: "Nos encontramos na sexta." }
      - { type: japanese_vocab, question: "土曜日と日曜日は休み。 (Sábado e domingo são folga./Segunda e terça são folga./Sexta é folga./Toda semana é folga.)", correctAnswer: "Sábado e domingo são folga." }
      - { type: japanese_vocab, question: "日本の日。 (Dia do Japão./Sol do Japão./Lua do Japão./Terra do Japão.)", correctAnswer: "Dia do Japão." }
      - { type: japanese_vocab, question: "水を飲む。 (Beber água./Ver água./Usar água./Cortar água.)", correctAnswer: "Beber água." }
      - { type: japanese_vocab, question: "木の下に猫。 (Gato debaixo da árvore./Pássaro na árvore./Árvore alta./Folha caindo.)", correctAnswer: "Gato debaixo da árvore." }
      - { type: japanese_vocab, question: "火を消す。 (Apagar o fogo./Acender o fogo./Ver o fogo./Fazer fogo.)", correctAnswer: "Apagar o fogo." }
      - { type: japanese_vocab, question: "お金がある。 (Tenho dinheiro./Não tenho dinheiro./Quero dinheiro./Gasto dinheiro.)", correctAnswer: "Tenho dinheiro." }
