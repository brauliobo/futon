      - { type: japanese_vocab, question: "木の下に猫。 (Gato debaixo da árvore./Pássaro na árvore./Árvore alta./Folha caindo.)", correctAnswer: "Gato debaixo da árvore.", rationale: "O kanji 木の下に猫。 significa \"Gato debaixo da árvore.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "火を消す。 (Apagar o fogo./Acender o fogo./Ver o fogo./Fazer fogo.)", correctAnswer: "Apagar o fogo.", rationale: "O kanji 火を消す。 significa \"Apagar o fogo.\". Observe o desenho como pista visual.", difficulty: 2, objectives: [japanese.vocab] }
