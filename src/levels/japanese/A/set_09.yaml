title: Padrão — わたしは 〜 です
level: 'A'
subject: japanese
authorNotes: "Padrão — わたしは 〜 です. Foque no conceito central do conjunto e nos erros comuns."
example: "AはBです = 'A é B' (estrutura básica)"
pages:
  - pageNumber: 1
    title: AはBです — reconhecer estrutura
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "私は学生です。 (Sou estudante./Sou professor./Sou médico./Sou engenheiro.)", correctAnswer: "Sou estudante." }
      - { type: japanese_vocab, question: "私は先生です。 (Sou professor./Sou estudante./Sou aluno./Sou diretor.)", correctAnswer: "Sou professor." }
      - { type: japanese_vocab, question: "私は日本人です。 (Sou japonês./Sou brasileiro./Sou americano./Sou chinês.)", correctAnswer: "Sou japonês." }
      - { type: japanese_vocab, question: "私はブラジル人です。 (Sou brasileiro./Sou japonês./Sou americano./Sou português.)", correctAnswer: "Sou brasileiro." }
      - { type: japanese_vocab, question: "彼は医者です。 (Ele é médico./Ela é médica./Ele é enfermeiro./Ele é paciente.)", correctAnswer: "Ele é médico." }
      - { type: japanese_vocab, question: "彼女は学生です。 (Ela é estudante./Ele é estudante./Ela é professora./Ela é médica.)", correctAnswer: "Ela é estudante." }
      - { type: japanese_vocab, question: "これは本です。 (Isto é um livro./Isto é uma caneta./Isto é uma mesa./Isto é uma cadeira.)", correctAnswer: "Isto é um livro." }
      - { type: japanese_vocab, question: "それはペンです。 (Isso é uma caneta./Isto é uma caneta./Aquilo é uma caneta./Isso é um lápis.)", correctAnswer: "Isso é uma caneta." }
      - { type: japanese_vocab, question: "あれは車です。 (Aquilo é um carro./Isto é um carro./Isso é um carro./Aquilo é uma bicicleta.)", correctAnswer: "Aquilo é um carro." }
      - { type: japanese_vocab, question: "ここは学校です。 (Este lugar é uma escola./Este lugar é uma casa./Este lugar é um parque./Este lugar é um banco.)", correctAnswer: "Este lugar é uma escola." }
  - pageNumber: 2
    title: Negativo com じゃない／ではない
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "私は先生じゃないです。 (Não sou professor./Sou professor./Sou estudante./Sou médico.)", correctAnswer: "Não sou professor." }
      - { type: japanese_vocab, question: "これは本ではないです。 (Isto não é um livro./Isto é um livro./Isto é uma caneta./Aquilo é um livro.)", correctAnswer: "Isto não é um livro." }
      - { type: japanese_vocab, question: "彼はアメリカ人じゃない。 (Ele não é americano./Ele é americano./Ela não é americana./Ele é brasileiro.)", correctAnswer: "Ele não é americano." }
      - { type: japanese_vocab, question: "あれは車じゃないです。 (Aquilo não é um carro./Aquilo é um carro./Isto não é um carro./Aquilo é uma bicicleta.)", correctAnswer: "Aquilo não é um carro." }
      - { type: japanese_vocab, question: "私は学生ではありません。 (Não sou estudante./Sou estudante./Sou professor./Sou médico.)", correctAnswer: "Não sou estudante." }
      - { type: japanese_vocab, question: "今日は月曜日じゃない。 (Hoje não é segunda./Hoje é segunda./Amanhã é segunda./Ontem foi segunda.)", correctAnswer: "Hoje não é segunda." }
      - { type: japanese_vocab, question: "これはペンではない。 (Isto não é uma caneta./Isto é uma caneta./Isso não é uma caneta./Aquilo não é uma caneta.)", correctAnswer: "Isto não é uma caneta." }
      - { type: japanese_vocab, question: "彼女は日本人じゃないです。 (Ela não é japonesa./Ela é japonesa./Ele não é japonês./Ela é brasileira.)", correctAnswer: "Ela não é japonesa." }
      - { type: japanese_vocab, question: "あの人は先生じゃない。 (Aquela pessoa não é professor./Aquela pessoa é professor./Esta pessoa não é professor./Essa pessoa é professor.)", correctAnswer: "Aquela pessoa não é professor." }
      - { type: japanese_vocab, question: "ここは病院じゃない。 (Este lugar não é hospital./Este lugar é hospital./Este é hospital./Aquele é hospital.)", correctAnswer: "Este lugar não é hospital." }
  - pageNumber: 3
    title: Montar a frase
    description: Escolha a frase correta em japonês.
    exercises:
      - { type: japanese_vocab, question: "Eu sou estudante. (私は学生です/学生は私です/私の学生です/私が学生を)", correctAnswer: "私は学生です" }
      - { type: japanese_vocab, question: "Sou brasileiro. (私はブラジル人です/ブラジル人は私です/私のブラジル人です/ブラジル人の私です)", correctAnswer: "私はブラジル人です" }
      - { type: japanese_vocab, question: "Isto é um livro. (これは本です/本はこれです/これの本です/本のこれです)", correctAnswer: "これは本です" }
      - { type: japanese_vocab, question: "Não sou professor. (私は先生じゃないです/私は先生です/先生じゃない私/先生は私)", correctAnswer: "私は先生じゃないです" }
      - { type: japanese_vocab, question: "Ela é japonesa. (彼女は日本人です/彼は日本人です/彼女が日本人/日本人の彼女)", correctAnswer: "彼女は日本人です" }
      - { type: japanese_vocab, question: "Aquilo é um carro. (あれは車です/これは車です/それは車です/車はあれです)", correctAnswer: "あれは車です" }
      - { type: japanese_vocab, question: "Este lugar é uma escola. (ここは学校です/そこは学校です/あそこは学校です/学校はここです)", correctAnswer: "ここは学校です" }
      - { type: japanese_vocab, question: "Não é uma caneta. (ペンじゃないです/ペンです/ペンの/ペンを)", correctAnswer: "ペンじゃないです" }
      - { type: japanese_vocab, question: "Ele é médico. (彼は医者です/彼女は医者です/彼が医者/医者の彼)", correctAnswer: "彼は医者です" }
      - { type: japanese_vocab, question: "Sou professor de japonês. (私は日本語の先生です/私は先生の日本語です/日本語の私は先生/先生は日本語の私)", correctAnswer: "私は日本語の先生です" }
