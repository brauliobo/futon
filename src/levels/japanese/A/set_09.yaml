title: 📝 Padrão — わたしは 〜 です
level: 'A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Padrão — わたしは 〜 です. Foque no conceito central do conjunto e nos erros comuns."
example: "AはBです = 'A é B' (estrutura básica)"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 12
pages:
  - pageNumber: 1
    title: AはBです — reconhecer estrutura
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "私は学生です。 (Sou estudante./Sou médico./Sou engenheiro./Sou professor.)", correctAnswer: "Sou estudante.", rationale: "O kanji 私は学生です。 significa \"Sou estudante.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私は先生です。 (Sou professor./Sou estudante./Sou aluno./Sou diretor.)", correctAnswer: "Sou professor.", rationale: "O kanji 私は先生です。 significa \"Sou professor.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私は日本人です。 (Sou americano./Sou chinês./Sou japonês./Sou brasileiro.)", correctAnswer: "Sou japonês.", rationale: "O kanji 私は日本人です。 significa \"Sou japonês.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私はブラジル人です。 (Sou japonês./Sou português./Sou brasileiro./Sou americano.)", correctAnswer: "Sou brasileiro.", rationale: "O kanji 私はブラジル人です。 significa \"Sou brasileiro.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "彼は医者です。 (Ele é médico./Ele é enfermeiro./Ela é médica./Ele é paciente.)", correctAnswer: "Ele é médico.", rationale: "O kanji 彼は医者です。 significa \"Ele é médico.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "彼女は学生です。 (Ela é estudante./Ela é professora./Ela é médica./Ele é estudante.)", correctAnswer: "Ela é estudante.", rationale: "O kanji 彼女は学生です。 significa \"Ela é estudante.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは本です。 (Isto é uma caneta./Isto é um livro./Isto é uma cadeira./Isto é uma mesa.)", correctAnswer: "Isto é um livro.", rationale: "O kanji これは本です。 significa \"Isto é um livro.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "それはペンです。 (Aquilo é uma caneta./Isso é um lápis./Isso é uma caneta./Isto é uma caneta.)", correctAnswer: "Isso é uma caneta.", rationale: "A frase \"それはペンです。\" traduz-se como \"Isso é uma caneta.\". Identifique partículas e palavras-chave.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あれは車です。 (Aquilo é um carro./Aquilo é uma bicicleta./Isso é um carro./Isto é um carro.)", correctAnswer: "Aquilo é um carro.", rationale: "O kanji あれは車です。 significa \"Aquilo é um carro.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ここは学校です。 (Este lugar é uma casa./Este lugar é uma escola./Este lugar é um banco./Este lugar é um parque.)", correctAnswer: "Este lugar é uma escola.", rationale: "O kanji ここは学校です。 significa \"Este lugar é uma escola.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Negativo com じゃない／ではない
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "私は先生じゃないです。 (Sou estudante./Sou médico./Sou professor./Não sou professor.)", correctAnswer: "Não sou professor.", rationale: "O kanji 私は先生じゃないです。 significa \"Não sou professor.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは本ではないです。 (Isto é um livro./Isto não é um livro./Aquilo é um livro./Isto é uma caneta.)", correctAnswer: "Isto não é um livro.", rationale: "O kanji これは本ではないです。 significa \"Isto não é um livro.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "彼はアメリカ人じゃない。 (Ele é americano./Ela não é americana./Ele é brasileiro./Ele não é americano.)", correctAnswer: "Ele não é americano.", rationale: "O kanji 彼はアメリカ人じゃない。 significa \"Ele não é americano.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あれは車じゃないです。 (Aquilo é uma bicicleta./Aquilo não é um carro./Aquilo é um carro./Isto não é um carro.)", correctAnswer: "Aquilo não é um carro.", rationale: "O kanji あれは車じゃないです。 significa \"Aquilo não é um carro.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私は学生ではありません。 (Não sou estudante./Sou estudante./Sou professor./Sou médico.)", correctAnswer: "Não sou estudante.", rationale: "O kanji 私は学生ではありません。 significa \"Não sou estudante.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は月曜日じゃない。 (Amanhã é segunda./Ontem foi segunda./Hoje é segunda./Hoje não é segunda.)", correctAnswer: "Hoje não é segunda.", rationale: "O kanji 今日は月曜日じゃない。 significa \"Hoje não é segunda.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これはペンではない。 (Isto não é uma caneta./Isso não é uma caneta./Isto é uma caneta./Aquilo não é uma caneta.)", correctAnswer: "Isto não é uma caneta.", rationale: "A frase \"これはペンではない。\" traduz-se como \"Isto não é uma caneta.\". Identifique partículas e palavras-chave.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "彼女は日本人じゃないです。 (Ela é japonesa./Ela não é japonesa./Ela é brasileira./Ele não é japonês.)", correctAnswer: "Ela não é japonesa.", rationale: "O kanji 彼女は日本人じゃないです。 significa \"Ela não é japonesa.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あの人は先生じゃない。 (Esta pessoa não é professor./Aquela pessoa é professor./Aquela pessoa não é professor./Essa pessoa é professor.)", correctAnswer: "Aquela pessoa não é professor.", rationale: "O kanji あの人は先生じゃない。 significa \"Aquela pessoa não é professor.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ここは病院じゃない。 (Este lugar não é hospital./Este é hospital./Este lugar é hospital./Aquele é hospital.)", correctAnswer: "Este lugar não é hospital.", rationale: "O kanji ここは病院じゃない。 significa \"Este lugar não é hospital.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Montar a frase
    description: Escolha a frase correta em japonês.
    exercises:
      - { type: japanese_vocab, question: "Eu sou estudante. (私の学生です/私が学生を/学生は私です/私は学生です)", correctAnswer: "私は学生です", rationale: "\"Eu sou estudante.\" em japonês escreve-se 私は学生です.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Sou brasileiro. (私のブラジル人です/ブラジル人の私です/私はブラジル人です/ブラジル人は私です)", correctAnswer: "私はブラジル人です", rationale: "\"Sou brasileiro.\" em japonês escreve-se 私はブラジル人です.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Isto é um livro. (本はこれです/これの本です/本のこれです/これは本です)", correctAnswer: "これは本です", rationale: "\"Isto é um livro.\" em japonês escreve-se これは本です.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Não sou professor. (私は先生です/先生じゃない私/先生は私/私は先生じゃないです)", correctAnswer: "私は先生じゃないです", rationale: "\"Não sou professor.\" em japonês escreve-se 私は先生じゃないです.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Ela é japonesa. (彼は日本人です/日本人の彼女/彼女は日本人です/彼女が日本人)", correctAnswer: "彼女は日本人です", rationale: "\"Ela é japonesa.\" em japonês escreve-se 彼女は日本人です.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Aquilo é um carro. (あれは車です/車はあれです/それは車です/これは車です)", correctAnswer: "あれは車です", rationale: "\"Aquilo é um carro.\" em japonês escreve-se あれは車です.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Este lugar é uma escola. (あそこは学校です/そこは学校です/ここは学校です/学校はここです)", correctAnswer: "ここは学校です", rationale: "\"Este lugar é uma escola.\" em japonês escreve-se ここは学校です.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Não é uma caneta. (ペンです/ペンを/ペンじゃないです/ペンの)", correctAnswer: "ペンじゃないです", rationale: "\"Não é uma caneta.\" em japonês escreve-se ペンじゃないです (negação じゃないです após o substantivo).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Ele é médico. (彼女は医者です/彼が医者/医者の彼/彼は医者です)", correctAnswer: "彼は医者です", rationale: "\"Ele é médico.\" em japonês escreve-se 彼は医者です.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Sou professor de japonês. (私は先生の日本語です/日本語の私は先生/先生は日本語の私/私は日本語の先生です)", correctAnswer: "私は日本語の先生です", rationale: "\"Sou professor de japonês.\" em japonês escreve-se 私は日本語の先生です.", difficulty: 3, objectives: [japanese.vocab] }
target: 30
