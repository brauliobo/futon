      - { type: japanese_vocab, question: "空 (そら/うみ/やま/かわ)", correctAnswer: "そら", rationale: "空 lê-se そら. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "花 (はな/き/はし/いし)", correctAnswer: "はな", rationale: "花 lê-se はな. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "木 (き/はな/はし/いし)", correctAnswer: "き", rationale: "木 lê-se き. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "雨 (あめ/ゆき/かぜ/くも)", correctAnswer: "あめ", rationale: "雨 lê-se あめ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "雪 (ゆき/あめ/かぜ/くも)", correctAnswer: "ゆき", rationale: "雪 lê-se ゆき. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "風 (かぜ/あめ/ゆき/くも)", correctAnswer: "かぜ", rationale: "風 lê-se かぜ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "富士山 (Monte Fuji/Montanha azul/Montanha vermelha/Montanha negra)", correctAnswer: "Monte Fuji", rationale: "O kanji 富士山 significa \"Monte Fuji\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases de natureza
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "山が高いです。 (A montanha é alta./A montanha é baixa./O rio é fundo./O céu é claro.)", correctAnswer: "A montanha é alta.", rationale: "O kanji 山が高いです。 significa \"A montanha é alta.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "川で泳ぐ。 (Nadar no rio./Nadar no mar./Andar pelo rio./Pescar no rio.)", correctAnswer: "Nadar no rio.", rationale: "O kanji 川で泳ぐ。 significa \"Nadar no rio.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "海が好きです。 (Gosto do mar./Não gosto do mar./Vou ao mar./Vim do mar.)", correctAnswer: "Gosto do mar.", rationale: "O kanji 海が好きです。 significa \"Gosto do mar.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "空が青い。 (O céu está azul./O céu está cinza./O mar está azul./O rio está azul.)", correctAnswer: "O céu está azul.", rationale: "O kanji 空が青い。 significa \"O céu está azul.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "桜の花。 (Flor de cerejeira./Flor de lótus./Folha de árvore./Árvore de cerejeira.)", correctAnswer: "Flor de cerejeira.", rationale: "O kanji 桜の花。 significa \"Flor de cerejeira.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "雨が降る。 (Está chovendo./Está nevando./Está ventando./Está ensolarado.)", correctAnswer: "Está chovendo.", rationale: "O kanji 雨が降る。 significa \"Está chovendo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "雪が降る。 (Está nevando./Está chovendo./Está ventando./Está gelado.)", correctAnswer: "Está nevando.", rationale: "O kanji 雪が降る。 significa \"Está nevando.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "木の下に猫。 (Gato debaixo da árvore./Gato em cima da árvore./Gato no rio./Gato no mar.)", correctAnswer: "Gato debaixo da árvore.", rationale: "O kanji 木の下に猫。 significa \"Gato debaixo da árvore.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "風が強い。 (O vento é forte./O vento é fraco./Está calmo./Está quente.)", correctAnswer: "O vento é forte.", rationale: "O kanji 風が強い。 significa \"O vento é forte.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山に登る。 (Subir a montanha./Descer a montanha./Ver a montanha./Viver na montanha.)", correctAnswer: "Subir a montanha.", rationale: "O kanji 山に登る。 significa \"Subir a montanha.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
target: 30
