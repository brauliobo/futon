      - { type: japanese_vocab, question: "雨 (chuva/neve/vento/sol)", correctAnswer: "chuva", rationale: "O kanji 雨 significa \"chuva\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "雪 (neve/chuva/vento/nuvem)", correctAnswer: "neve", objectives: [japanese.vocab], rationale: "O kanji 雪 significa \"neve\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "風 (vento/chuva/neve/nuvem)", correctAnswer: "vento", rationale: "O kanji 風 significa \"vento\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
