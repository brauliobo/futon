title: これ／それ／あれ／どれ — demonstrativos
level: 'A'
subject: japanese
example: "これ = isto (perto de mim), それ = isso (perto de você), あれ = aquilo (longe)"
pages:
  - pageNumber: 1
    title: Demonstrativos básicos
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "これ (isto/isso/aquilo/qual)", correctAnswer: "isto" }
      - { type: japanese_vocab, question: "それ (isso/isto/aquilo/qual)", correctAnswer: "isso" }
      - { type: japanese_vocab, question: "あれ (aquilo/isto/isso/qual)", correctAnswer: "aquilo" }
      - { type: japanese_vocab, question: "どれ (qual/isto/isso/aquilo)", correctAnswer: "qual" }
      - { type: japanese_vocab, question: "ここ (aqui/aí/ali/onde)", correctAnswer: "aqui" }
      - { type: japanese_vocab, question: "そこ (aí/aqui/ali/onde)", correctAnswer: "aí" }
      - { type: japanese_vocab, question: "あそこ (ali/aqui/aí/onde)", correctAnswer: "ali" }
      - { type: japanese_vocab, question: "どこ (onde/aqui/aí/ali)", correctAnswer: "onde" }
      - { type: japanese_vocab, question: "この本 (este livro/esse livro/aquele livro/qual livro)", correctAnswer: "este livro" }
      - { type: japanese_vocab, question: "あの人 (aquela pessoa/esta pessoa/essa pessoa/qual pessoa)", correctAnswer: "aquela pessoa" }
  - pageNumber: 2
    title: Identificar o uso correto
    description: Escolha conforme a distância.
    exercises:
      - { type: japanese_vocab, question: "Na minha mão: (___)は本です。 (これ/それ/あれ/どれ)", correctAnswer: "これ" }
      - { type: japanese_vocab, question: "Na sua mão: (___)は本です。 (それ/これ/あれ/どれ)", correctAnswer: "それ" }
      - { type: japanese_vocab, question: "Longe de nós dois: (___)は本です。 (あれ/これ/それ/どれ)", correctAnswer: "あれ" }
      - { type: japanese_vocab, question: "Perguntando: (___)ですか。 (どれ/これ/それ/あれ)", correctAnswer: "どれ" }
      - { type: japanese_vocab, question: "Estou aqui: (___)にいます。 (ここ/そこ/あそこ/どこ)", correctAnswer: "ここ" }
      - { type: japanese_vocab, question: "Você está aí: (___)にいます。 (そこ/ここ/あそこ/どこ)", correctAnswer: "そこ" }
      - { type: japanese_vocab, question: "Ele está longe ali: (___)にいます。 (あそこ/ここ/そこ/どこ)", correctAnswer: "あそこ" }
      - { type: japanese_vocab, question: "Onde você está?: (___)にいますか。 (どこ/ここ/そこ/あそこ)", correctAnswer: "どこ" }
      - { type: japanese_vocab, question: "Este livro (perto de mim): (___)本。 (この/その/あの/どの)", correctAnswer: "この" }
      - { type: japanese_vocab, question: "Aquele carro (longe): (___)車。 (あの/この/その/どの)", correctAnswer: "あの" }
  - pageNumber: 3
    title: Frases completas com これ/それ/あれ
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "これは何ですか。 (O que é isto?/O que é isso?/O que é aquilo?/Qual é?)", correctAnswer: "O que é isto?" }
      - { type: japanese_vocab, question: "それは私のペンです。 (Essa é a minha caneta./Esta é a minha caneta./Aquela é minha caneta./De quem é a caneta?)", correctAnswer: "Essa é a minha caneta." }
      - { type: japanese_vocab, question: "あれは富士山です。 (Aquilo é o Monte Fuji./Isto é o Monte Fuji./Aquela é a montanha./Qual é o Monte Fuji?)", correctAnswer: "Aquilo é o Monte Fuji." }
      - { type: japanese_vocab, question: "どれが好きですか。 (Qual você gosta?/Este você gosta?/Gosto disto./Não gosto.)", correctAnswer: "Qual você gosta?" }
      - { type: japanese_vocab, question: "ここはどこですか。 (Que lugar é este?/Onde você está?/Onde é aqui?/Quem é você?)", correctAnswer: "Que lugar é este?" }
      - { type: japanese_vocab, question: "この本は新しい。 (Este livro é novo./Aquele livro é novo./Esse livro é velho./Qual livro é novo?)", correctAnswer: "Este livro é novo." }
      - { type: japanese_vocab, question: "その人は先生です。 (Essa pessoa é professor./Esta pessoa é professor./Aquela pessoa é professor./Qual pessoa é professor?)", correctAnswer: "Essa pessoa é professor." }
      - { type: japanese_vocab, question: "あの店は大きい。 (Aquela loja é grande./Esta loja é grande./Essa loja é pequena./Qual loja é grande?)", correctAnswer: "Aquela loja é grande." }
      - { type: japanese_vocab, question: "どの人が先生ですか。 (Qual pessoa é o professor?/Essa pessoa é professor./Aquela pessoa é professor./Esta pessoa é professor.)", correctAnswer: "Qual pessoa é o professor?" }
      - { type: japanese_vocab, question: "これは私の車です。 (Este é o meu carro./Aquele é o meu carro./Esse é o meu carro./De quem é o carro?)", correctAnswer: "Este é o meu carro." }
