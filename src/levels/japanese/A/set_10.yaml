title: これ／それ／あれ／どれ — demonstrativos
level: 'A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "これ／それ／あれ／どれ — demonstrativos. Foque no conceito central do conjunto e nos erros comuns."
example: "これ = isto (perto de mim), それ = isso (perto de você), あれ = aquilo (longe)"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 12
pages:
  - pageNumber: 1
    title: Demonstrativos básicos
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "これ (isto/isso/aquilo/qual)", correctAnswer: "isto", rationale: "これ lê-se \"isto\" (romaji).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "それ (isso/aquilo/qual/isto)", correctAnswer: "isso", rationale: "それ lê-se \"isso\" (romaji).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あれ (isto/qual/isso/aquilo)", correctAnswer: "aquilo", rationale: "あれ (hiragana) significa \"aquilo\" em português.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どれ (qual/aquilo/isso/isto)", correctAnswer: "qual", rationale: "どれ lê-se \"qual\" (romaji).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ここ (aí/ali/onde/aqui)", correctAnswer: "aqui", rationale: "ここ lê-se \"aqui\" (romaji).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "そこ (aqui/onde/aí/ali)", correctAnswer: "aí", rationale: "そこ (hiragana) significa \"aí\" em português.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あそこ (aqui/ali/onde/aí)", correctAnswer: "ali", rationale: "あそこ lê-se \"ali\" (romaji).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どこ (ali/onde/aqui/aí)", correctAnswer: "onde", rationale: "どこ lê-se \"onde\" (romaji).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この本 (este livro/aquele livro/qual livro/esse livro)", correctAnswer: "este livro", rationale: "O kanji この本 significa \"este livro\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あの人 (esta pessoa/aquela pessoa/qual pessoa/essa pessoa)", correctAnswer: "aquela pessoa", rationale: "O kanji あの人 significa \"aquela pessoa\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Identificar o uso correto
    description: Escolha conforme a distância.
    exercises:
      - { type: japanese_vocab, question: "Na minha mão: (___)は本です。 (それ/これ/どれ/あれ)", correctAnswer: "これ", rationale: "Na minha mão: (___)は本です。 lê-se これ. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Na sua mão: (___)は本です。 (どれ/それ/これ/あれ)", correctAnswer: "それ", rationale: "Na sua mão: (___)は本です。 lê-se それ. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Longe de nós dois: (___)は本です。 (どれ/あれ/これ/それ)", correctAnswer: "あれ", rationale: "Longe de nós dois: (___)は本です。 lê-se あれ. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Perguntando: (___)ですか。 (これ/あれ/どれ/それ)", correctAnswer: "どれ", rationale: "\"Perguntando: (___)ですか。\" em japonês escreve-se どれ.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Estou aqui: (___)にいます。 (そこ/ここ/どこ/あそこ)", correctAnswer: "ここ", rationale: "\"Estou aqui: (___)にいます。\" em japonês escreve-se ここ.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Você está aí: (___)にいます。 (そこ/あそこ/どこ/ここ)", correctAnswer: "そこ", rationale: "\"Você está aí: (___)にいます。\" em japonês escreve-se そこ.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Ele está longe ali: (___)にいます。 (ここ/どこ/そこ/あそこ)", correctAnswer: "あそこ", rationale: "\"Ele está longe ali: (___)にいます。\" em japonês escreve-se あそこ.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Onde você está?: (___)にいますか。 (そこ/ここ/どこ/あそこ)", correctAnswer: "どこ", rationale: "\"Onde você está?: (___)にいますか。\" em japonês escreve-se どこ.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Este livro (perto de mim): (___)本。 (その/どの/この/あの)", correctAnswer: "この", rationale: "Este livro (perto de mim): (___)本。 lê-se この. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Aquele carro (longe): (___)車。 (この/どの/あの/その)", correctAnswer: "あの", rationale: "Aquele carro (longe): (___)車。 lê-se あの. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases completas com これ/それ/あれ
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "これは何ですか。 (O que é isto?/O que é isso?/O que é aquilo?/Qual é?)", correctAnswer: "O que é isto?", rationale: "O kanji これは何ですか。 significa \"O que é isto?\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "それは私のペンです。 (Essa é a minha caneta./Esta é a minha caneta./Aquela é minha caneta./De quem é a caneta?)", correctAnswer: "Essa é a minha caneta.", rationale: "O kanji それは私のペンです。 significa \"Essa é a minha caneta.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あれは富士山です。 (Aquilo é o Monte Fuji./Isto é o Monte Fuji./Aquela é a montanha./Qual é o Monte Fuji?)", correctAnswer: "Aquilo é o Monte Fuji.", rationale: "O kanji あれは富士山です。 significa \"Aquilo é o Monte Fuji.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どれが好きですか。 (Qual você gosta?/Este você gosta?/Gosto disto./Não gosto.)", correctAnswer: "Qual você gosta?", rationale: "O kanji どれが好きですか。 significa \"Qual você gosta?\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ここはどこですか。 (Que lugar é este?/Onde você está?/Onde é aqui?/Quem é você?)", correctAnswer: "Que lugar é este?", rationale: "A frase \"ここはどこですか。\" traduz-se como \"Que lugar é este?\". Identifique partículas e palavras-chave.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この本は新しい。 (Este livro é novo./Aquele livro é novo./Esse livro é velho./Qual livro é novo?)", correctAnswer: "Este livro é novo.", rationale: "O kanji この本は新しい。 significa \"Este livro é novo.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "その人は先生です。 (Essa pessoa é professor./Esta pessoa é professor./Aquela pessoa é professor./Qual pessoa é professor?)", correctAnswer: "Essa pessoa é professor.", rationale: "O kanji その人は先生です。 significa \"Essa pessoa é professor.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あの店は大きい。 (Aquela loja é grande./Esta loja é grande./Essa loja é pequena./Qual loja é grande?)", correctAnswer: "Aquela loja é grande.", rationale: "O kanji あの店は大きい。 significa \"Aquela loja é grande.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どの人が先生ですか。 (Qual pessoa é o professor?/Essa pessoa é professor./Aquela pessoa é professor./Esta pessoa é professor.)", correctAnswer: "Qual pessoa é o professor?", rationale: "O kanji どの人が先生ですか。 significa \"Qual pessoa é o professor?\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは私の車です。 (Este é o meu carro./Aquele é o meu carro./Esse é o meu carro./De quem é o carro?)", correctAnswer: "Este é o meu carro.", rationale: "O kanji これは私の車です。 significa \"Este é o meu carro.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
target: 30
