title: 📝 Frases com で + ação (local de ação)
level: 'A'
subject: japanese
objectives: [japanese.grammar]
difficulty: 3
authorNotes: "Partícula で indicando o local onde uma ação acontece. Diferente de に (destino), で marca o lugar da ação."
example: "で + ação = local onde algo acontece. Ex.: 学校で勉強します → Estudo na escola."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Local de ação com で
    description: Escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "学校で勉強します。 (Vou à escola estudar./Estudo na escola./Saio da escola para estudar./Estudo sobre a escola.)", correctAnswer: "Estudo na escola.", rationale: "学校で = na escola (local de ação), 勉強します = estudar.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "うちで食べます。 (Vou a casa comer./Saio de casa para comer./Como em casa./Como perto de casa.)", correctAnswer: "Como em casa.", rationale: "うちで = em casa (local de ação), 食べます = comer.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "公園で遊びます。 (Vou ao parque brincar./Brinco no parque./Saio do parque./Fico no parque.)", correctAnswer: "Brinco no parque.", rationale: "公園で = no parque (local de ação), 遊びます = brincar/se divertir.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "図書館で本を読みます。 (Vou à biblioteca ler./Leio livros na biblioteca./Pego livros na biblioteca./Estudo na biblioteca.)", correctAnswer: "Leio livros na biblioteca.", rationale: "図書館で = na biblioteca (local), 本を = livros (objeto), 読みます = ler.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "カフェで友だちと話します。 (Encontro amigos no café./Converso com amigos no café./Vou ao café com amigos./Chamo amigos para o café.)", correctAnswer: "Converso com amigos no café.", rationale: "カフェで = no café (local), 友だちと = com amigos, 話します = conversar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どこで食べますか。 (Onde vai comer?/O que vai comer?/Quando vai comer?/Com quem vai comer?)", correctAnswer: "Onde vai comer?", rationale: "どこで = onde (local de ação), 食べますか = vai comer? (pergunta).", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電車で行きます。 (Vou à estação de trem./Vou de trem./Volto de trem./Espero o trem.)", correctAnswer: "Vou de trem.", rationale: "電車で = de trem (meio de transporte com で), 行きます = ir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語で話します。 (Falo sobre japonês./Falo com japoneses./Falo em japonês./Aprendo japonês.)", correctAnswer: "Falo em japonês.", rationale: "日本語で = em japonês (língua/meio), 話します = falar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "レストランで働きます。 (Trabalho no restaurante./Vou ao restaurante trabalhar./Saio do restaurante./Como no restaurante.)", correctAnswer: "Trabalho no restaurante.", rationale: "レストランで = no restaurante (local de ação), 働きます = trabalhar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外で遊ばないでください。 (Por favor brinque lá fora./Por favor não brinque lá fora./Não saia lá fora./Por favor entre.)", correctAnswer: "Por favor não brinque lá fora.", rationale: "外で = lá fora, 遊ばないでください = por favor não brincar.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: で vs に — local de ação vs destino
    description: Escolha a frase com a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "学校に行きます。 (Estudo na escola./Saio da escola./Vou à escola./Fico na escola.)", correctAnswer: "Vou à escola.", rationale: "に = destino do movimento (ir para). Compare com: 学校で = na escola (local onde algo acontece).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "学校で勉強します。 (Vou à escola./Saio da escola para estudar./Estudo na escola./Vou estudar.)", correctAnswer: "Estudo na escola.", rationale: "で = local onde a ação acontece. Compare com: 学校に行きます = vou à escola.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "スーパーで買い物します。 (Vou ao supermercado./Faço compras no supermercado./Saio do supermercado./Trabalho no supermercado.)", correctAnswer: "Faço compras no supermercado.", rationale: "スーパーで = no supermercado (local de ação), 買い物します = fazer compras.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "体育館で運動します。 (Vou ao ginásio./Me exercito no ginásio./Saio do ginásio./Trabalho no ginásio.)", correctAnswer: "Me exercito no ginásio.", rationale: "体育館で = no ginásio (local de ação), 運動します = se exercitar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "海で泳ぎます。 (Vou ao mar./Saio do mar nadando./Nado no mar./Vou nadar no mar.)", correctAnswer: "Nado no mar.", rationale: "海で = no mar (local de ação), 泳ぎます = nadar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "バスでどこに行きますか。 (Com que vai?/Onde vai de ônibus?/Quando vai de ônibus?/Por que vai de ônibus?)", correctAnswer: "Onde vai de ônibus?", rationale: "バスで = de ônibus (meio), どこに = para onde, 行きますか = vai ir?", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会社で何をしますか。 (O que você faz na empresa?/Quando você vai à empresa?/Por que vai à empresa?/Onde fica a empresa?)", correctAnswer: "O que você faz na empresa?", rationale: "会社で = na empresa (local), 何を = o quê (objeto), しますか = faz? (pergunta).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "部屋で音楽を聞きます。 (Ouço música no quarto./Vou ao quarto ouvir música./Coloco música no quarto./Saio ouvindo música.)", correctAnswer: "Ouço música no quarto.", rationale: "部屋で = no quarto (local), 音楽を = música (objeto), 聞きます = ouvir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友だちの家でゲームをします。 (Vou à casa do amigo jogar./Jogo na casa do amigo./Saio jogando da casa do amigo./Chamo amigos para jogar.)", correctAnswer: "Jogo na casa do amigo.", rationale: "友だちの家で = na casa do amigo (local), ゲームをします = jogar game.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電話で話します。 (Falo com o telefone./Uso o telefone./Falo pelo telefone./Compro um telefone.)", correctAnswer: "Falo pelo telefone.", rationale: "電話で = pelo telefone (meio de comunicação), 話します = falar.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
