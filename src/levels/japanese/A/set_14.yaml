title: 🔢 Kanji — 学校先生友 (escola e social)
level: 'A'
subject: japanese
objectives: [japanese.kanji]
difficulty: 3
authorNotes: "Kanji de ambiente escolar e relações sociais: estudar, escola, professor, amigo."
example: "学 = estudar/aprender, 校 = escola, 先生 = professor. Ex.: 学校 → escola, 先生 → sensei."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Kanji da escola
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "学 (amigo/escola/professor/estudar)", correctAnswer: "estudar", rationale: "学 (がく/まな) = estudar/aprender. Base de 学校 (escola) e 学生 (estudante).", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "校 (estudar/amigo/escola/professor)", correctAnswer: "escola", rationale: "校 (こう) = escola. Aparece em 学校 (escola) e 高校 (colegial).", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "先 (escola/estudar/primeiro/amigo)", correctAnswer: "primeiro", rationale: "先 (せん/さき) = primeiro/anterior. Em 先生 = professor (aquele que vai na frente).", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "生 (amigo/estudar/vida/escola)", correctAnswer: "vida", rationale: "生 (せい/い) = vida/nascer. Em 先生 = professor, 学生 = estudante.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "友 (estudar/vida/escola/amigo)", correctAnswer: "amigo", rationale: "友 (とも/ゆう) = amigo. Em 友だち = amigo/amizade.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "学校 (amigos/professores/alunos/escola)", correctAnswer: "escola", rationale: "学校 (がっこう) = escola. Kanji 学 (estudar) + 校 (escola).", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "先生 (estudante/escola/amigo/professor)", correctAnswer: "professor", rationale: "先生 (せんせい) = professor. Literalmente 'aquele que nasceu antes'.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "学生 (professor/escola/estudante/amigo)", correctAnswer: "estudante", rationale: "学生 (がくせい) = estudante. 学 (estudar) + 生 (vida/pessoa).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "友だち (professores/aulas/escola/amigos)", correctAnswer: "amigos", rationale: "友だち (ともだち) = amigo(s). Palavra comum para 'amigo'.", difficulty: 2, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "大学 (escola primária/universidade/escola média/colegial)", correctAnswer: "universidade", rationale: "大学 (だいがく) = universidade. 大 (grande) + 学 (estudar).", difficulty: 3, objectives: [japanese.kanji] }
  - pageNumber: 2
    title: Frases com kanji da escola
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "私は学生です。 (Sou professor./Sou aluno./Sou amigo./Sou médico.)", correctAnswer: "Sou aluno.", rationale: "私は = eu (sou), 学生 = estudante, です = cópula polida.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "田中先生は日本人です。 (A professora Tanaka é japonesa./O professor Tanaka é brasileiro./A aluna Tanaka é japonesa./O amigo Tanaka é japonês.)", correctAnswer: "A professora Tanaka é japonesa.", rationale: "田中先生 = professora Tanaka, 日本人 = japonesa.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "学校は大きいです。 (A escola é bonita./A escola é pequena./A escola é grande./A universidade é nova.)", correctAnswer: "A escola é grande.", rationale: "学校 = escola, 大きい = grande, です = é.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "友だちと学校に行きます。 (Vou à escola sozinho./Vou para casa com amigos./Vou à escola com amigos./Saio da escola com amigos.)", correctAnswer: "Vou à escola com amigos.", rationale: "友だちと = com amigos, 学校に行きます = ir à escola.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "先生に聞きます。 (Pergunto ao aluno./Pergunto ao professor./Pergunto ao amigo./Respondo ao professor.)", correctAnswer: "Pergunto ao professor.", rationale: "先生に = ao professor, 聞きます = perguntar/ouvir.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "大学で日本語を勉強します。 (Estudo japonês na universidade./Ensino japonês na escola./Aprendo inglês na universidade./Falo japonês na escola.)", correctAnswer: "Estudo japonês na universidade.", rationale: "大学で = na universidade, 日本語を = japonês (objeto), 勉強します = estudar.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "友だちは何人いますか。 (Quantos professores há?/Quantos alunos há?/Quantos amigos você tem?/Quantas escolas há?)", correctAnswer: "Quantos amigos você tem?", rationale: "友だち = amigos, 何人 = quantas pessoas, いますか = há/tem?", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "学校の先生は三人います。 (Tenho três amigos./Há três alunos na escola./Há três professores na escola./A escola tem três andares.)", correctAnswer: "Há três professores na escola.", rationale: "学校の先生 = professores da escola, 三人 = três pessoas, います = há.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "毎日学校で勉強します。 (Estudo em casa todo dia./Estudo na escola todo dia./Não estudo todo dia./Leio na escola todo dia.)", correctAnswer: "Estudo na escola todo dia.", rationale: "毎日 = todo dia, 学校で = na escola, 勉強します = estudar.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "私の学校は古いです。 (Minha escola é nova./Minha escola é grande./Minha escola é antiga./Minha escola é pequena.)", correctAnswer: "Minha escola é antiga.", rationale: "私の学校 = minha escola, 古い = antigo/velho, です = é.", difficulty: 4, objectives: [japanese.kanji] }
target: 20
