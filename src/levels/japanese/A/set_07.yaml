pages:
  - pageNumber: 1
    title: Posições básicas
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "上 (embaixo/fora/em cima/dentro)", correctAnswer: "em cima", rationale: "O kanji 上 significa \"em cima\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "下 (embaixo/dentro/em cima/fora)", correctAnswer: "embaixo", rationale: "O kanji 下 significa \"embaixo\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "中 (dentro/em cima/embaixo/fora)", correctAnswer: "dentro", rationale: "O kanji 中 significa \"dentro\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, difficulty: 3, question: "外 (dentro/fora/embaixo/em cima)", correctAnswer: "fora", objectives: [japanese.vocab], rationale: "O kanji 外 significa \"fora\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "右 (direita/frente/esquerda/atrás)", correctAnswer: "direita", rationale: "O kanji 右 significa \"direita\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "左 (atrás/esquerda/direita/frente)", correctAnswer: "esquerda", rationale: "O kanji 左 significa \"esquerda\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "前 (lado/em cima/frente/atrás)", correctAnswer: "frente", rationale: "O kanji 前 significa \"frente\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "後 (frente/lado/em cima/atrás)", correctAnswer: "atrás", rationale: "O kanji 後 significa \"atrás\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "間 (entre/dentro/fora/ao redor)", correctAnswer: "entre", rationale: "O kanji 間 significa \"entre\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "横 (entre/ao lado/frente/atrás)", correctAnswer: "ao lado", rationale: "O kanji 横 significa \"ao lado\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Leituras
    description: Escolha a leitura correta.
    exercises:
      - { type: japanese_vocab, question: "上 (した/そと/うえ/なか)", correctAnswer: "うえ", rationale: "上 lê-se うえ. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "下 (した/なか/うえ/そと)", correctAnswer: "した", rationale: "下 lê-se した. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "中 (なか/うえ/した/そと)", correctAnswer: "なか", rationale: "中 lê-se なか. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "外 (なか/そと/した/うえ)", correctAnswer: "そと", rationale: "外 lê-se そと. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "右 (みぎ/まえ/ひだり/うしろ)", correctAnswer: "みぎ", rationale: "右 lê-se みぎ. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "左 (うしろ/ひだり/みぎ/まえ)", correctAnswer: "ひだり", rationale: "左 lê-se ひだり. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "前 (みぎ/ひだり/まえ/うしろ)", correctAnswer: "まえ", rationale: "前 lê-se まえ. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "後 (まえ/みぎ/ひだり/うしろ)", correctAnswer: "うしろ", rationale: "後 lê-se うしろ. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "間 (あいだ/なか/うえ/した)", correctAnswer: "あいだ", rationale: "間 lê-se あいだ. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "横 (たて/よこ/した/うえ)", correctAnswer: "よこ", rationale: "横 lê-se よこ. Pratique associar o traço ao som.", difficulty: 3, objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases com posições
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "机の上に本がある。 (Tem um livro./Tem um livro em cima da mesa./Tem um livro embaixo da mesa./Tem uma mesa.)", correctAnswer: "Tem um livro em cima da mesa.", rationale: "O kanji 机の上に本がある。 significa \"Tem um livro em cima da mesa.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "椅子の下に猫。 (Gato em cima da cadeira./Gato embaixo da cadeira./Gato ao lado da cadeira./Cadeira no gato.)", correctAnswer: "Gato embaixo da cadeira.", rationale: "O kanji 椅子の下に猫。 significa \"Gato embaixo da cadeira.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "家の中に入る。 (Sair de casa./Ver a casa./Entrar em casa./Ficar em casa.)", correctAnswer: "Entrar em casa.", rationale: "O kanji 家の中に入る。 significa \"Entrar em casa.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "外で遊ぶ。 (Ficar fora./Dormir fora./Brincar fora./Brincar dentro.)", correctAnswer: "Brincar fora.", rationale: "O kanji 外で遊ぶ。 significa \"Brincar fora.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "右に曲がる。 (Virar à direita./Voltar./Ir em frente./Virar à esquerda.)", correctAnswer: "Virar à direita.", rationale: "O kanji 右に曲がる。 significa \"Virar à direita.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "左側に銀行。 (Banco em frente./Banco do lado direito./Banco do lado esquerdo./Banco atrás.)", correctAnswer: "Banco do lado esquerdo.", rationale: "O kanji 左側に銀行。 significa \"Banco do lado esquerdo.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "駅の前で会う。 (Nos encontramos na estação./Nos encontramos sem a estação./Nos encontramos em frente à estação./Nos encontramos atrás da estação.)", correctAnswer: "Nos encontramos em frente à estação.", rationale: "O kanji 駅の前で会う。 significa \"Nos encontramos em frente à estação.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "店の後ろ。 (Ao lado da loja./Dentro da loja./Em frente à loja./Atrás da loja.)", correctAnswer: "Atrás da loja.", rationale: "O kanji 店の後ろ。 significa \"Atrás da loja.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "学校と駅の間。 (Entre a escola e a estação./Em frente à escola./Atrás da escola./Dentro da escola.)", correctAnswer: "Entre a escola e a estação.", rationale: "O kanji 学校と駅の間。 significa \"Entre a escola e a estação.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私の横に友だち。 (Amigo atrás./Amigo ao meu lado./Amigo longe./Amigo em frente.)", correctAnswer: "Amigo ao meu lado.", rationale: "O kanji 私の横に友だち。 significa \"Amigo ao meu lado.\". Observe o desenho como pista visual.", difficulty: 3, objectives: [japanese.vocab] }
target: 30
