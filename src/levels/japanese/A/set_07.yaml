title: Kanji — Posição 上 下 中 外 右 左 前 後
level: 'A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Kanji — Posição 上 下 中 外 右 左 前 後. Foque no conceito central do conjunto e nos erros comuns."
example: "上 = em cima, 下 = embaixo"
pages:
  - pageNumber: 1
    title: Posições básicas
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "上 (em cima/embaixo/dentro/fora)", correctAnswer: "em cima", rationale: "O kanji 上 significa \"em cima\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "下 (embaixo/em cima/dentro/fora)", correctAnswer: "embaixo", rationale: "O kanji 下 significa \"embaixo\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "中 (dentro/fora/em cima/embaixo)", correctAnswer: "dentro", rationale: "O kanji 中 significa \"dentro\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "外 (fora/dentro/em cima/embaixo)", correctAnswer: "fora", objectives: [japanese.vocab], rationale: "O kanji 外 significa \"fora\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "右 (direita/esquerda/frente/atrás)", correctAnswer: "direita", rationale: "O kanji 右 significa \"direita\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "左 (esquerda/direita/frente/atrás)", correctAnswer: "esquerda", rationale: "O kanji 左 significa \"esquerda\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "前 (frente/atrás/lado/em cima)", correctAnswer: "frente", rationale: "O kanji 前 significa \"frente\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "後 (atrás/frente/lado/em cima)", correctAnswer: "atrás", rationale: "O kanji 後 significa \"atrás\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "間 (entre/dentro/fora/ao redor)", correctAnswer: "entre", rationale: "O kanji 間 significa \"entre\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "横 (ao lado/entre/atrás/frente)", correctAnswer: "ao lado", rationale: "O kanji 横 significa \"ao lado\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Leituras
    description: Escolha a leitura correta.
    exercises:
      - { type: japanese_vocab, question: "上 (うえ/した/なか/そと)", correctAnswer: "うえ", rationale: "上 lê-se うえ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "下 (した/うえ/なか/そと)", correctAnswer: "した", rationale: "下 lê-se した. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "中 (なか/そと/うえ/した)", correctAnswer: "なか", rationale: "中 lê-se なか. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "外 (そと/なか/うえ/した)", correctAnswer: "そと", rationale: "外 lê-se そと. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "右 (みぎ/ひだり/まえ/うしろ)", correctAnswer: "みぎ", rationale: "右 lê-se みぎ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "左 (ひだり/みぎ/まえ/うしろ)", correctAnswer: "ひだり", rationale: "左 lê-se ひだり. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "前 (まえ/うしろ/みぎ/ひだり)", correctAnswer: "まえ", rationale: "前 lê-se まえ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "後 (うしろ/まえ/みぎ/ひだり)", correctAnswer: "うしろ", rationale: "後 lê-se うしろ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "間 (あいだ/なか/うえ/した)", correctAnswer: "あいだ", rationale: "間 lê-se あいだ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "横 (よこ/たて/うえ/した)", correctAnswer: "よこ", rationale: "横 lê-se よこ. Pratique associar o traço ao som.", objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases com posições
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "机の上に本がある。 (Tem um livro em cima da mesa./Tem um livro embaixo da mesa./Tem uma mesa./Tem um livro.)", correctAnswer: "Tem um livro em cima da mesa.", rationale: "O kanji 机の上に本がある。 significa \"Tem um livro em cima da mesa.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "椅子の下に猫。 (Gato embaixo da cadeira./Gato em cima da cadeira./Cadeira no gato./Gato ao lado da cadeira.)", correctAnswer: "Gato embaixo da cadeira.", rationale: "O kanji 椅子の下に猫。 significa \"Gato embaixo da cadeira.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "家の中に入る。 (Entrar em casa./Sair de casa./Ficar em casa./Ver a casa.)", correctAnswer: "Entrar em casa.", rationale: "O kanji 家の中に入る。 significa \"Entrar em casa.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "外で遊ぶ。 (Brincar fora./Brincar dentro./Ficar fora./Dormir fora.)", correctAnswer: "Brincar fora.", rationale: "O kanji 外で遊ぶ。 significa \"Brincar fora.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "右に曲がる。 (Virar à direita./Virar à esquerda./Ir em frente./Voltar.)", correctAnswer: "Virar à direita.", rationale: "O kanji 右に曲がる。 significa \"Virar à direita.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "左側に銀行。 (Banco do lado esquerdo./Banco do lado direito./Banco em frente./Banco atrás.)", correctAnswer: "Banco do lado esquerdo.", rationale: "O kanji 左側に銀行。 significa \"Banco do lado esquerdo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "駅の前で会う。 (Nos encontramos em frente à estação./Nos encontramos atrás da estação./Nos encontramos na estação./Nos encontramos sem a estação.)", correctAnswer: "Nos encontramos em frente à estação.", rationale: "O kanji 駅の前で会う。 significa \"Nos encontramos em frente à estação.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "店の後ろ。 (Atrás da loja./Em frente à loja./Ao lado da loja./Dentro da loja.)", correctAnswer: "Atrás da loja.", rationale: "O kanji 店の後ろ。 significa \"Atrás da loja.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "学校と駅の間。 (Entre a escola e a estação./Atrás da escola./Em frente à escola./Dentro da escola.)", correctAnswer: "Entre a escola e a estação.", rationale: "O kanji 学校と駅の間。 significa \"Entre a escola e a estação.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私の横に友だち。 (Amigo ao meu lado./Amigo atrás./Amigo em frente./Amigo longe.)", correctAnswer: "Amigo ao meu lado.", rationale: "O kanji 私の横に友だち。 significa \"Amigo ao meu lado.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
target: 30
