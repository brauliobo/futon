title: Kanji — Posição 上 下 中 外 右 左 前 後
level: 'A'
subject: japanese
authorNotes: "Kanji — Posição 上 下 中 外 右 左 前 後. Foque no conceito central do conjunto e nos erros comuns."
example: "上 = em cima, 下 = embaixo"
pages:
  - pageNumber: 1
    title: Posições básicas
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "上 (em cima/embaixo/dentro/fora)", correctAnswer: "em cima" }
      - { type: japanese_vocab, question: "下 (embaixo/em cima/dentro/fora)", correctAnswer: "embaixo" }
      - { type: japanese_vocab, question: "中 (dentro/fora/em cima/embaixo)", correctAnswer: "dentro" }
      - { type: japanese_vocab, question: "外 (fora/dentro/em cima/embaixo)", correctAnswer: "fora" }
      - { type: japanese_vocab, question: "右 (direita/esquerda/frente/atrás)", correctAnswer: "direita" }
      - { type: japanese_vocab, question: "左 (esquerda/direita/frente/atrás)", correctAnswer: "esquerda" }
      - { type: japanese_vocab, question: "前 (frente/atrás/lado/em cima)", correctAnswer: "frente" }
      - { type: japanese_vocab, question: "後 (atrás/frente/lado/em cima)", correctAnswer: "atrás" }
      - { type: japanese_vocab, question: "間 (entre/dentro/fora/ao redor)", correctAnswer: "entre" }
      - { type: japanese_vocab, question: "横 (ao lado/entre/atrás/frente)", correctAnswer: "ao lado" }
  - pageNumber: 2
    title: Leituras
    description: Escolha a leitura correta.
    exercises:
      - { type: japanese_vocab, question: "上 (うえ/した/なか/そと)", correctAnswer: "うえ" }
      - { type: japanese_vocab, question: "下 (した/うえ/なか/そと)", correctAnswer: "した" }
      - { type: japanese_vocab, question: "中 (なか/そと/うえ/した)", correctAnswer: "なか" }
      - { type: japanese_vocab, question: "外 (そと/なか/うえ/した)", correctAnswer: "そと" }
      - { type: japanese_vocab, question: "右 (みぎ/ひだり/まえ/うしろ)", correctAnswer: "みぎ" }
      - { type: japanese_vocab, question: "左 (ひだり/みぎ/まえ/うしろ)", correctAnswer: "ひだり" }
      - { type: japanese_vocab, question: "前 (まえ/うしろ/みぎ/ひだり)", correctAnswer: "まえ" }
      - { type: japanese_vocab, question: "後 (うしろ/まえ/みぎ/ひだり)", correctAnswer: "うしろ" }
      - { type: japanese_vocab, question: "間 (あいだ/なか/うえ/した)", correctAnswer: "あいだ" }
      - { type: japanese_vocab, question: "横 (よこ/たて/うえ/した)", correctAnswer: "よこ" }
  - pageNumber: 3
    title: Frases com posições
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "机の上に本がある。 (Tem um livro em cima da mesa./Tem um livro embaixo da mesa./Tem uma mesa./Tem um livro.)", correctAnswer: "Tem um livro em cima da mesa." }
      - { type: japanese_vocab, question: "椅子の下に猫。 (Gato embaixo da cadeira./Gato em cima da cadeira./Cadeira no gato./Gato ao lado da cadeira.)", correctAnswer: "Gato embaixo da cadeira." }
      - { type: japanese_vocab, question: "家の中に入る。 (Entrar em casa./Sair de casa./Ficar em casa./Ver a casa.)", correctAnswer: "Entrar em casa." }
      - { type: japanese_vocab, question: "外で遊ぶ。 (Brincar fora./Brincar dentro./Ficar fora./Dormir fora.)", correctAnswer: "Brincar fora." }
      - { type: japanese_vocab, question: "右に曲がる。 (Virar à direita./Virar à esquerda./Ir em frente./Voltar.)", correctAnswer: "Virar à direita." }
      - { type: japanese_vocab, question: "左側に銀行。 (Banco do lado esquerdo./Banco do lado direito./Banco em frente./Banco atrás.)", correctAnswer: "Banco do lado esquerdo." }
      - { type: japanese_vocab, question: "駅の前で会う。 (Nos encontramos em frente à estação./Nos encontramos atrás da estação./Nos encontramos na estação./Nos encontramos sem a estação.)", correctAnswer: "Nos encontramos em frente à estação." }
      - { type: japanese_vocab, question: "店の後ろ。 (Atrás da loja./Em frente à loja./Ao lado da loja./Dentro da loja.)", correctAnswer: "Atrás da loja." }
      - { type: japanese_vocab, question: "学校と駅の間。 (Entre a escola e a estação./Atrás da escola./Em frente à escola./Dentro da escola.)", correctAnswer: "Entre a escola e a estação." }
      - { type: japanese_vocab, question: "私の横に友だち。 (Amigo ao meu lado./Amigo atrás./Amigo em frente./Amigo longe.)", correctAnswer: "Amigo ao meu lado." }
target: 30
