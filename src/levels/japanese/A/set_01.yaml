      - { type: japanese_vocab, question: "二 (2/3/4/1)", correctAnswer: "2", rationale: "O kanji 二 representa o número 2.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "三 (3/4/1/2)", correctAnswer: "3", rationale: "O kanji 三 representa o número 3.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "四 (1/2/3/4)", correctAnswer: "4", rationale: "O kanji 四 representa o número 4.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "五 (6/7/8/5)", correctAnswer: "5", rationale: "O kanji 五 representa o número 5.", difficulty: 2, objectives: [japanese.vocab] }
