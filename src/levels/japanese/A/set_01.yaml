      - { type: japanese_vocab, question: "一つ (ふたつ/よっつ/ひとつ/みっつ)", correctAnswer: "ひとつ", rationale: "一つ lê-se ひとつ. Pratique associar o traço ao som.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "二つ (ひとつ/よっつ/ふたつ/みっつ)", correctAnswer: "ふたつ", rationale: "二つ lê-se ふたつ. Pratique associar o traço ao som.", difficulty: 2, objectives: [japanese.vocab] }
