      - { type: japanese_vocab, question: "五 (ご/よん/ろく/なな)", correctAnswer: "ご" }
      - { type: japanese_vocab, question: "一つ (ひとつ/ふたつ/みっつ/よっつ)", correctAnswer: "ひとつ" }
      - { type: japanese_vocab, question: "二つ (ふたつ/ひとつ/みっつ/よっつ)", correctAnswer: "ふたつ" }
      - { type: japanese_vocab, question: "三つ (みっつ/ふたつ/ひとつ/よっつ)", correctAnswer: "みっつ" }
      - { type: japanese_vocab, question: "四つ (よっつ/みっつ/ふたつ/いつつ)", correctAnswer: "よっつ" }
