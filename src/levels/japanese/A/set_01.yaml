    exercises:
      - { type: japanese_vocab, question: "一 (に/よん/さん/いち)", correctAnswer: "いち", rationale: "一 lê-se いち. Pratique associar o traço ao som.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "二 (いち/さん/よん/に)", correctAnswer: "に", rationale: "二 lê-se に. Pratique associar o traço ao som.", difficulty: 2, objectives: [japanese.vocab] }
