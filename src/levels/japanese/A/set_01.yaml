title: Kanji — Números 一 二 三 四 五
level: 'A'
subject: japanese
difficulty: 2
authorNotes: "Kanji — Números 一 二 三 四 五. Foque no conceito central do conjunto e nos erros comuns."
example: "一 = 1 (いち), 二 = 2 (に), 三 = 3 (さん)"
pages:
  - pageNumber: 1
    title: Kanji de 1 a 5
    description: Leia o kanji e escolha o número.
    exercises:
      - { type: japanese_vocab, question: "一 (1/2/3/4)", correctAnswer: "1", rationale: "O kanji 一 representa o número 1." }
      - { type: japanese_vocab, question: "二 (1/2/3/4)", correctAnswer: "2", rationale: "O kanji 二 representa o número 2." }
      - { type: japanese_vocab, question: "三 (1/2/3/4)", correctAnswer: "3", rationale: "O kanji 三 representa o número 3." }
      - { type: japanese_vocab, question: "四 (1/2/3/4)", correctAnswer: "4", rationale: "O kanji 四 representa o número 4." }
      - { type: japanese_vocab, question: "五 (5/6/7/8)", correctAnswer: "5", rationale: "O kanji 五 representa o número 5." }
      - { type: japanese_vocab, question: "二 (2/3/4/5)", correctAnswer: "2", rationale: "O kanji 二 representa o número 2." }
      - { type: japanese_vocab, question: "四 (4/5/6/7)", correctAnswer: "4", rationale: "O kanji 四 representa o número 4." }
      - { type: japanese_vocab, question: "一 (1/10/100/1000)", correctAnswer: "1", rationale: "O kanji 一 representa o número 1." }
      - { type: japanese_vocab, question: "三 (3/4/5/6)", correctAnswer: "3", rationale: "O kanji 三 representa o número 3." }
      - { type: japanese_vocab, question: "五 (5/4/3/2)", correctAnswer: "5", rationale: "O kanji 五 representa o número 5." }
  - pageNumber: 2
    title: Leitura (on'yomi e kun'yomi)
    description: Leia o kanji e escolha a leitura correta.
    exercises:
      - { type: japanese_vocab, question: "一 (いち/に/さん/よん)", correctAnswer: "いち", rationale: "一 lê-se いち. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "二 (に/いち/さん/よん)", correctAnswer: "に", rationale: "二 lê-se に. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "三 (さん/に/いち/よん)", correctAnswer: "さん", rationale: "三 lê-se さん. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "四 (よん/さん/ご/ろく)", correctAnswer: "よん", rationale: "四 lê-se よん. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "五 (ご/よん/ろく/なな)", correctAnswer: "ご", rationale: "五 lê-se ご. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "一つ (ひとつ/ふたつ/みっつ/よっつ)", correctAnswer: "ひとつ", rationale: "一つ lê-se ひとつ. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "二つ (ふたつ/ひとつ/みっつ/よっつ)", correctAnswer: "ふたつ", rationale: "二つ lê-se ふたつ. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "三つ (みっつ/ふたつ/ひとつ/よっつ)", correctAnswer: "みっつ", rationale: "三つ lê-se みっつ. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "四つ (よっつ/みっつ/ふたつ/いつつ)", correctAnswer: "よっつ", rationale: "四つ lê-se よっつ. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "五つ (いつつ/よっつ/むっつ/ななつ)", correctAnswer: "いつつ", rationale: "五つ lê-se いつつ. Pratique associar o traço ao som." }
  - pageNumber: 3
    title: Do número ao kanji
    description: Veja o número em algarismo e escolha o kanji.
    exercises:
      - { type: japanese_vocab, question: "1 (一/二/三/四)", correctAnswer: "一", rationale: "1 em kanji escreve-se 一. Memorize o traço único." }
      - { type: japanese_vocab, question: "2 (二/一/三/四)", correctAnswer: "二", rationale: "2 em kanji escreve-se 二. Memorize o traço único." }
      - { type: japanese_vocab, question: "3 (三/二/一/四)", correctAnswer: "三", rationale: "3 em kanji escreve-se 三. Memorize o traço único." }
      - { type: japanese_vocab, question: "4 (四/三/二/一)", correctAnswer: "四", rationale: "4 em kanji escreve-se 四. Memorize o traço único." }
      - { type: japanese_vocab, question: "5 (五/四/三/二)", correctAnswer: "五", rationale: "5 em kanji escreve-se 五. Memorize o traço único." }
      - { type: japanese_vocab, question: "1 (三/一/五/二)", correctAnswer: "一", rationale: "1 em kanji escreve-se 一. Memorize o traço único." }
      - { type: japanese_vocab, question: "4 (二/五/四/一)", correctAnswer: "四", rationale: "4 em kanji escreve-se 四. Memorize o traço único." }
      - { type: japanese_vocab, question: "3 (四/五/三/一)", correctAnswer: "三", rationale: "3 em kanji escreve-se 三. Memorize o traço único." }
      - { type: japanese_vocab, question: "2 (一/二/四/五)", correctAnswer: "二", rationale: "2 em kanji escreve-se 二. Memorize o traço único." }
      - { type: japanese_vocab, question: "5 (三/一/二/五)", correctAnswer: "五", rationale: "5 em kanji escreve-se 五. Memorize o traço único." }
target: 30
