      - { type: japanese_vocab, question: "四つ (ふたつ/みっつ/よっつ/いつつ)", correctAnswer: "よっつ", rationale: "四つ lê-se よっつ. Pratique associar o traço ao som.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "五つ (ななつ/いつつ/よっつ/むっつ)", correctAnswer: "いつつ", rationale: "五つ lê-se いつつ. Pratique associar o traço ao som.", difficulty: 2, objectives: [japanese.vocab] }
