title: Kanji — Números 一 二 三 四 五
level: 'A'
subject: japanese
example: "一 = 1 (いち), 二 = 2 (に), 三 = 3 (さん)"
pages:
  - pageNumber: 1
    title: Kanji de 1 a 5
    description: Leia o kanji e escolha o número.
    exercises:
      - { type: japanese_vocab, question: "一 (1/2/3/4)", correctAnswer: "1" }
      - { type: japanese_vocab, question: "二 (1/2/3/4)", correctAnswer: "2" }
      - { type: japanese_vocab, question: "三 (1/2/3/4)", correctAnswer: "3" }
      - { type: japanese_vocab, question: "四 (1/2/3/4)", correctAnswer: "4" }
      - { type: japanese_vocab, question: "五 (5/6/7/8)", correctAnswer: "5" }
      - { type: japanese_vocab, question: "二 (2/3/4/5)", correctAnswer: "2" }
      - { type: japanese_vocab, question: "四 (4/5/6/7)", correctAnswer: "4" }
      - { type: japanese_vocab, question: "一 (1/10/100/1000)", correctAnswer: "1" }
      - { type: japanese_vocab, question: "三 (3/4/5/6)", correctAnswer: "3" }
      - { type: japanese_vocab, question: "五 (5/4/3/2)", correctAnswer: "5" }
