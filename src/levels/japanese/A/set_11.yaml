title: Perguntas com か — partícula interrogativa
level: 'A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Perguntas com か — partícula interrogativa. Foque no conceito central do conjunto e nos erros comuns."
example: "〜ですか = pergunta. か no final transforma a frase em pergunta."
pages:
  - pageNumber: 1
    title: Transformar em pergunta
    description: Escolha a pergunta correta.
    exercises:
      - { type: japanese_vocab, question: "Você é estudante? (あなたは学生ですか/あなたは学生です/学生ですあなた/学生のあなた)", correctAnswer: "あなたは学生ですか", rationale: "\"Você é estudante?\" em japonês escreve-se あなたは学生ですか.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Isto é um livro? (これは本ですか/これは本です/本は/本か)", correctAnswer: "これは本ですか", rationale: "\"Isto é um livro?\" em japonês escreve-se これは本ですか.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Que lugar é este? (ここはどこですか/ここはどこです/どこか/どこです)", correctAnswer: "ここはどこですか", rationale: "\"Que lugar é este?\" em japonês escreve-se ここはどこですか.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "O que é isso? (それは何ですか/それは何です/何ですそれ/何のそれ)", correctAnswer: "それは何ですか", rationale: "\"O que é isso?\" em japonês escreve-se それは何ですか.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Quem é ele? (彼はだれですか/彼はだれです/だれか彼/彼のだれ)", correctAnswer: "彼はだれですか", rationale: "\"Quem é ele?\" em japonês escreve-se 彼はだれですか.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Quando? (いつですか/いつです/いつ/いつを)", correctAnswer: "いつですか", rationale: "\"Quando?\" em japonês escreve-se いつですか.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Por quê? (なぜですか/なぜです/なぜ/なぜを)", correctAnswer: "なぜですか", rationale: "\"Por quê?\" em japonês escreve-se なぜですか.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Como? (どうですか/どうです/どう/どうを)", correctAnswer: "どうですか", rationale: "\"Como?\" em japonês escreve-se どうですか.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Quanto custa? (いくらですか/いくらです/いくら/いくらを)", correctAnswer: "いくらですか", rationale: "\"Quanto custa?\" em japonês escreve-se いくらですか.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Quantos? (いくつですか/いくつです/いくつ/いくつを)", correctAnswer: "いくつですか", rationale: "\"Quantos?\" em japonês escreve-se いくつですか.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Palavras de pergunta
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "何 (o que/quem/onde/quando)", correctAnswer: "o que", rationale: "O kanji 何 significa \"o que\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "だれ (quem/o que/onde/quando)", correctAnswer: "quem", rationale: "だれ lê-se \"quem\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どこ (onde/quando/como/quanto)", correctAnswer: "onde", rationale: "どこ lê-se \"onde\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いつ (quando/como/quanto/por quê)", correctAnswer: "quando", rationale: "いつ (hiragana) significa \"quando\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "なぜ (por quê/como/quanto/onde)", correctAnswer: "por quê", rationale: "なぜ (hiragana) significa \"por quê\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どう (como/quanto/onde/quando)", correctAnswer: "como", rationale: "どう lê-se \"como\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いくら (quanto custa/quantos/como/onde)", correctAnswer: "quanto custa", rationale: "いくら (hiragana) significa \"quanto custa\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いくつ (quantos/quanto custa/como/onde)", correctAnswer: "quantos", rationale: "いくつ (hiragana) significa \"quantos\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どちら (qual de dois/qual de muitos/onde/quem)", correctAnswer: "qual de dois", rationale: "どちら (hiragana) significa \"qual de dois\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どうして (por quê/como/onde/quando)", correctAnswer: "por quê", rationale: "どうして (hiragana) significa \"por quê\" em português.", objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Respondendo perguntas
    description: Escolha a resposta correta.
    exercises:
      - { type: japanese_vocab, question: "「学生ですか」→ Sim. (はい、学生です/いいえ、学生です/はい、学生じゃない/学生ですか)", correctAnswer: "はい、学生です", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「学生ですか」→ Não. (いいえ、学生じゃないです/はい、学生じゃない/学生です/いいえ、学生です)", correctAnswer: "いいえ、学生じゃないです", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「何ですか」→ É um livro. (本です/本か/本に/本を)", correctAnswer: "本です", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「だれですか」→ Sou eu. (私です/私は/私か/私を)", correctAnswer: "私です", rationale: "\"「だれですか」→ Sou eu.\" em japonês escreve-se 私です.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「どこですか」→ É a escola. (学校です/学校か/学校に/学校を)", correctAnswer: "学校です", rationale: "\"「どこですか」→ É a escola.\" em japonês escreve-se 学校です.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「いつですか」→ Amanhã. (明日です/明日か/今日/昨日)", correctAnswer: "明日です", rationale: "\"「いつですか」→ Amanhã.\" em japonês escreve-se 明日です.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「いくらですか」→ 1000 ienes. (千円です/千ドル/百円/万円)", correctAnswer: "千円です", rationale: "\"「いくらですか」→ 1000 ienes.\" em japonês escreve-se 千円です.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「どうですか」→ Está bom. (いいです/よくない/だめ/分からない)", correctAnswer: "いいです", rationale: "\"「どうですか」→ Está bom.\" em japonês escreve-se いいです.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「日本人ですか」→ Sou brasileiro. (いいえ、ブラジル人です/はい、日本人です/いいえ、日本人です/はい、ブラジル人です)", correctAnswer: "いいえ、ブラジル人です", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「いくつですか」→ Três. (三つです/三です/三つか/三を)", correctAnswer: "三つです", rationale: "\"「いくつですか」→ Três.\" em japonês escreve-se 三つです.", objectives: [japanese.vocab] }
target: 30
