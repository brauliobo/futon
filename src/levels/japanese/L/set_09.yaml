title: 📝 ～に則して (em conformidade com / segundo)
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "に則して (にそくして) significa 'agir em conformidade com uma norma, lei ou princípio'. Derivado de 則 (regra/norma). Muito formal. Usado em documentos legais, regulamentos e discursos oficiais. Sinônimo próximo de に基づいて, mas com ênfase em norma/regra."
example: "規則に則して処理する。 Ex.: ～に則して → 'em conformidade com / seguindo a norma de (formal)'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～に則して
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "規則に則して行動する (agir violando as regras/agir em conformidade com as regras/agir antes das regras/agir apesar das regras)", correctAnswer: "agir em conformidade com as regras", rationale: "に則して → 'em conformidade com / seguindo'. 規則に則して → em conformidade com as regras.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "則 (そく) significa (violação/norma/ausência/dúvida)", correctAnswer: "norma", rationale: "則 (そく) → norma/regra/princípio. に則して → tendo como norma. Kanji de regulamento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "法律に則した判断 (julgamento que viola a lei/julgamento em conformidade com a lei/julgamento antes da lei/julgamento apesar da lei)", correctAnswer: "julgamento em conformidade com a lei", rationale: "法律に則した → em conformidade com a lei (forma atributiva: に則した+N). Decisão legal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に則して é mais frequente em (conversas informais/documentos legais, regulamentos e discursos oficiais/mensagens cotidianas/textos infantis)", correctAnswer: "documentos legais, regulamentos e discursos oficiais", rationale: "に則して é essencialmente formal: contratos, documentos jurídicos, declarações oficiais.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に則して vs に基づいて (に則して enfatiza conformidade com norma/regra; に基づいて enfatiza ter X como base/são idênticos/に基づいて é mais específico para normas/に則して é mais coloquial)", correctAnswer: "に則して enfatiza conformidade com norma/regra; に基づいて enfatiza ter X como base", rationale: "に則して → agir segundo uma norma prescrita. に基づいて → basear-se em qualquer coisa (lei, dados, fatos).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "憲法に則して政策を実施する。 (Implementar política violando a constituição./Implementar política em conformidade com a constituição./A constituição não influencia a política./Implementar antes de consultar a constituição.)", correctAnswer: "Implementar política em conformidade com a constituição.", rationale: "憲法に則して → em conformidade com a constituição. に則して → seguindo rigorosamente a norma.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に則して precede N que é (qualquer coisa/uma norma, lei, princípio ou regra/apenas números/apenas nomes próprios)", correctAnswer: "uma norma, lei, princípio ou regra", rationale: "に則して segue: 規則 (regra), 法律 (lei), 憲法 (constituição), 原則 (princípio), 基準 (critério).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "手続きに則して申請する。 (Solicitar violando os procedimentos./Solicitar em conformidade com os procedimentos./Solicitar antes dos procedimentos./Os procedimentos não influenciam a solicitação.)", correctAnswer: "Solicitar em conformidade com os procedimentos.", rationale: "手続きに則して → em conformidade com os procedimentos. Seguir o processo regulamentado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に則した (forma atributiva) em: に則した対応 = (resposta que viola a norma/resposta em conformidade com a norma/resposta antes da norma/resposta apesar da norma)", correctAnswer: "resposta em conformidade com a norma", rationale: "に則した+N → N em conformidade com. 規則に則した対応 → resposta conforme as regras.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "原則に則して判断を下す。 (Tomar decisão violando os princípios./Tomar decisão em conformidade com os princípios./Os princípios não influenciam a decisão./Tomar decisão antes de ter princípios.)", correctAnswer: "Tomar decisão em conformidade com os princípios.", rationale: "原則に則して → em conformidade com os princípios. Decisão guiada por princípios estabelecidos.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases formais com ～に則して
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "国際条約に則して行動することが求められる。 (É exigido agir em violação ao tratado internacional./É exigido agir em conformidade com o tratado internacional./O tratado não influencia a ação./A ação ocorre antes do tratado.)", correctAnswer: "É exigido agir em conformidade com o tratado internacional.", rationale: "国際条約に則して → em conformidade com o tratado internacional. Obrigação de conformidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "就業規則に則して処分を下した。 (A punição foi aplicada violando as regras trabalhistas./A punição foi aplicada em conformidade com as regras trabalhistas./As regras não influenciaram a punição./A punição veio antes das regras.)", correctAnswer: "A punição foi aplicada em conformidade com as regras trabalhistas.", rationale: "就業規則に則して → em conformidade com as regras de trabalho. 処分 → punição/medida disciplinar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に則して vs に従って (に則して é mais formal: norma prescrita; に従って = seguir instrução/regra/pessoa — mais amplo/são idênticos/に従って é mais formal/に則して é mais coloquial)", correctAnswer: "に則して é mais formal: norma prescrita; に従って = seguir instrução/regra/pessoa — mais amplo", rationale: "に則して → conformidade com norma formal/legal. に従って → seguir instrução, ordem, fluxo — uso mais amplo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "規定に則した手続きを踏む。 (Seguir procedimentos que violam as normas./Seguir procedimentos em conformidade com as normas./Os procedimentos não seguem normas./Seguir procedimentos antes das normas.)", correctAnswer: "Seguir procedimentos em conformidade com as normas.", rationale: "規定に則した手続き → procedimentos conformes às normas. 規定 (きてい) → norma/regulamento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "倫理規定に則して研究を進める。 (Conduzir pesquisa violando o código de ética./Conduzir pesquisa em conformidade com o código de ética./A pesquisa não considera o código de ética./A pesquisa é concluída antes do código.)", correctAnswer: "Conduzir pesquisa em conformidade com o código de ética.", rationale: "倫理規定に則して → em conformidade com o código de ética. 倫理規定 → regulamento ético.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に則して é sinônimo mais próximo de (にとって/に基づいて/にもかかわらず/をきっかけに)", correctAnswer: "に基づいて", rationale: "に則して ≒ に基づいて, mas に則して enfatiza conformidade com norma prescrita. に基づいて é mais amplo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "契約条件に則した対応を要求する。 (Exigir resposta que viola as condições do contrato./Exigir resposta em conformidade com as condições do contrato./As condições do contrato não influenciam a resposta./Exigir antes de estabelecer condições.)", correctAnswer: "Exigir resposta em conformidade com as condições do contrato.", rationale: "契約条件に則した対応 → resposta conforme as condições contratuais. Direito à conformidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社内規定に則して出張費を精算する。 (Reembolsar despesas de viagem violando as normas internas./Reembolsar despesas de viagem em conformidade com as normas internas./As normas não influenciam o reembolso./O reembolso ocorre antes das normas.)", correctAnswer: "Reembolsar despesas de viagem em conformidade com as normas internas.", rationale: "社内規定に則して → em conformidade com as normas internas da empresa. 精算 → acerto de contas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "民主的原則に則した選挙を実施する。 (Realizar eleição que viola princípios democráticos./Realizar eleição em conformidade com princípios democráticos./Os princípios não influenciam a eleição./A eleição ocorre antes dos princípios.)", correctAnswer: "Realizar eleição em conformidade com princípios democráticos.", rationale: "民主的原則に則した選挙 → eleição conforme princípios democráticos. に則した → atributivo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に則して é uma expressão (coloquial e simples/muito formal e usada em contextos normativos e legais/de nível N5/usada apenas em conversas cotidianas)", correctAnswer: "muito formal e usada em contextos normativos e legais", rationale: "に則して pertence ao registro formal/jurídico. N2 avançado. Contratos, documentos oficiais, discursos.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
