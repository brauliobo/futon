title: 📝 ～に他ならない vs ～に過ぎない (contraste formal)
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Contraste aprofundado: にほかならない (≡ に他ならない) afirma enfaticamente identidade. にすぎない (≡ に過ぎない) minimiza. Kanji formais e contextos acadêmicos. Nível L."
example: "これは詐欺に他ならない vs ただの噂に過ぎない。 Ex.: に他ならない = enfatiza; に過ぎない = minimiza."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Contraste formal — に他ならない vs に過ぎない
    description: Escolha a expressão correta para o contexto acadêmico.
    exercises:
      - { type: japanese_vocab, question: "科学的証拠のないその主張は、憶測に___。 (基づく/他ならない/過ぎない/よる)", correctAnswer: "過ぎない", rationale: "証拠のない主張は憶測に過ぎない → é apenas especulação. に過ぎない minimiza: não passa de especulação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この成功の根本には、長年の研究の積み重ねが___。 (に先立って/に過ぎない/に他ならない/に反して)", correctAnswer: "に他ならない", rationale: "長年の研究の積み重ねに他ならない → é justamente o acúmulo de pesquisa. に他ならない enfatiza a causa real.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その行為は単なる形式___、実質を伴っていない。 (に伴って/に他ならない/に過ぎず/をきっかけに)", correctAnswer: "に過ぎず", rationale: "形式に過ぎず → sendo apenas formalidade (forma te/conjuntiva). Em seguida vem outra oração.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の怒りは正義感の表れ___。 (をきっかけに/に過ぎない/に他ならない/に反して)", correctAnswer: "に他ならない", rationale: "正義感の表れに他ならない → é justamente manifestação de senso de justiça. Afirmação enfática.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に他ならない em kanji formal se escreve (にほか成らない/にほかならない/に他ならない/に違いない)", correctAnswer: "に他ならない", rationale: "に他ならない é a forma em kanji de にほかならない. 他 (ほか) → outro/outra coisa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その政策は表面的な改善___、根本的な解決には程遠い。 (を踏まえて/に他ならない/に過ぎず/に伴って)", correctAnswer: "に過ぎず", rationale: "表面的な改善に過ぎず → sendo apenas melhoria superficial. Minimização seguida de outra oração.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "差別が続く社会的背景には、構造的不平等が___。 (に過ぎない/に他ならない/に至っては/をきっかけに)", correctAnswer: "に他ならない", rationale: "構造的不平等に他ならない → é justamente a desigualdade estrutural. Causa identificada enfaticamente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に過ぎない em kanji formal se escreve (にすぎない/に過ぎない/に過きない/に超ぎない)", correctAnswer: "に過ぎない", rationale: "に過ぎない é a forma em kanji. 過 (す/こ) → exceder/passar. に過ぎない → não passa de.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女の謙虚さは内なる強さの表現___。 (に過ぎない/に他ならない/に伴って/をきっかけに)", correctAnswer: "に他ならない", rationale: "内なる強さの表現に他ならない → é justamente expressão de força interior. Afirmação de essência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経済的不平等は個人の問題___、社会全体の課題だ。 (に他ならない/に過ぎない/に先立って/を前提に)", correctAnswer: "に過ぎない", rationale: "個人の問題に過ぎない... 社会全体の課題だ → não é apenas problema individual... é desafio de toda a sociedade.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Leitura de textos acadêmicos com に他ならない e に過ぎない
    description: Escolha a tradução correta da frase acadêmica.
    exercises:
      - { type: japanese_vocab, question: "この現象は地球温暖化の帰結に他ならない。 (Este fenômeno pode ser resultado do aquecimento global./Este fenômeno é justamente resultado do aquecimento global./O aquecimento global não está relacionado./Este fenômeno tem outra causa.)", correctAnswer: "Este fenômeno é justamente resultado do aquecimento global.", rationale: "地球温暖化の帰結に他ならない → é exatamente uma consequência do aquecimento global. Afirmação categórica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その解釈は一説に過ぎず、定説ではない。 (Esta interpretação é justamente a teoria estabelecida./Esta interpretação é apenas uma teoria e não é a visão dominante./Esta interpretação é a única correta./Esta interpretação é estabelecida e dominante.)", correctAnswer: "Esta interpretação é apenas uma teoria e não é a visão dominante.", rationale: "一説に過ぎず → sendo apenas uma teoria. Minimização da interpretação apresentada.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国家間の対立の背景には利権争いが他ならない。 (Por trás do conflito entre países pode estar disputa de interesses./Por trás do conflito entre países está justamente a disputa de interesses./Conflitos não têm causa./A disputa de interesses não causa conflitos.)", correctAnswer: "Por trás do conflito entre países está justamente a disputa de interesses.", rationale: "利権争いが他ならない → é justamente a disputa de interesses. Identificação causal enfática.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に他ならない e に過ぎない são antonímicos? (Sim, completamente/Funcionalmente opostos: um afirma enfaticamente, o outro minimiza/São idênticos/Não têm relação)", correctAnswer: "Funcionalmente opostos: um afirma enfaticamente, o outro minimiza", rationale: "に他ならない → 'é exatamente X' (afirma). に過ぎない → 'é apenas X' (minimiza). Opostos funcionais.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の批判は嫉妬心に過ぎないという見方がある。 (Há quem diga que a crítica dele é justamente ciúme./Há quem diga que a crítica dele é apenas ciúme./A crítica dele não tem motivação./A crítica dele é construtiva.)", correctAnswer: "Há quem diga que a crítica dele é apenas ciúme.", rationale: "嫉妬心に過ぎない → é apenas ciúme. Minimiza a crítica como motivação pequena e mesquinha.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "人権侵害はいかなる理由をもってしても正当化できないものに他ならない。 (Violações de direitos humanos talvez possam ser justificadas./Violações de direitos humanos são justamente algo que não pode ser justificado por nenhuma razão./Violações de direitos humanos são apenas questão de opinião./Os direitos humanos podem ser negados.", correctAnswer: "Violações de direitos humanos são justamente algo que não pode ser justificado por nenhuma razão.", rationale: "正当化できないものに他ならない → é justamente algo injustificável. Afirmação jurídica e moral.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その分析は統計的なバイアスの産物に過ぎない。 (Essa análise é justamente produto de viés estatístico./Essa análise é apenas produto de viés estatístico./A análise não tem viés./A análise é impecável.)", correctAnswer: "Essa análise é apenas produto de viés estatístico.", rationale: "統計的なバイアスの産物に過ぎない → é apenas produto de viés estatístico. Crítica metodológica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "イノベーションの本質は既存概念の再構築に他ならない。 (A essência da inovação pode ser a reconstrução de conceitos./A essência da inovação é justamente a reconstrução de conceitos existentes./A inovação não requer reconstrução./Inovação é algo diferente da reconstrução.)", correctAnswer: "A essência da inovação é justamente a reconstrução de conceitos existentes.", rationale: "既存概念の再構築に他ならない → é justamente a reconstrução de conceitos existentes. Definição de inovação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "報告書の結論は担当者の個人的見解に過ぎなかった。 (A conclusão do relatório era justamente opinião pessoal do responsável./A conclusão do relatório era apenas a opinião pessoal do responsável./A conclusão era objetiva e impessoal./A conclusão não tinha responsável.", correctAnswer: "A conclusão do relatório era apenas a opinião pessoal do responsável.", rationale: "個人的見解に過ぎなかった → era apenas opinião pessoal. に過ぎなかった → passado de minimização.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その研究の価値は論文の数に過ぎず、質こそが問われる。 (O valor da pesquisa é justamente o número de artigos./O valor da pesquisa é apenas o número de artigos, mas a qualidade é o que realmente importa./O número de artigos não importa./Qualidade e quantidade são iguais.)", correctAnswer: "O valor da pesquisa é apenas o número de artigos, mas a qualidade é o que realmente importa.", rationale: "論文の数に過ぎず → sendo apenas o número de artigos. こそ contrastivo enfatiza a qualidade.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
