title: 🏆 Revisão final L — N2 mastery
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Revisão final do nível L: todos os padrões N2 avançados. Cobertura: をもって, をもとに, に則して, に即して, ならでは, ものがある, いかんによって, ともなると, とあれば, かたわら, keigo avançado, expressões idiomáticas e escrita formal."
example: "本日をもって Level L の学習が完了します。 Ex.: Revisão L → N2 mastery completo."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Revisão de padrões do nível L
    description: Escolha o significado correto ou o padrão adequado.
    exercises:
      - { type: japanese_vocab, question: "本日をもって退職いたします。 (Hoje começo o trabalho./A partir de hoje, me aposento./Amanhã me aposento./Antes de hoje, me aposentei.)", correctAnswer: "A partir de hoje, me aposento.", rationale: "をもって (uso 2: marco temporal) → a partir de hoje. 退職 → aposentadoria/demissão. Comunicado formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経験をもとに判断する = (julgar ignorando a experiência/julgar com base na experiência/julgar antes de ter experiência/julgar apesar da experiência)", correctAnswer: "julgar com base na experiência", rationale: "をもとに → com base em / usando como fonte. 経験をもとに → com base na experiência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "法律に則して行動する = (agir violando a lei/agir em conformidade com a lei/agir antes de consultar a lei/agir apesar da lei)", correctAnswer: "agir em conformidade com a lei", rationale: "に則して → em conformidade com (norma prescrita). 法律に則して → seguindo a lei. Formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "現状に即した政策 = (política que ignora a realidade/política adaptada à realidade atual/política antes da análise/política apesar da realidade)", correctAnswer: "política adaptada à realidade atual", rationale: "に即した → adaptado a (realidade concreta). 現状に即した → adaptado à situação atual.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本ならではの文化 = (cultura que qualquer país tem/cultura exclusiva e valorizada do Japão/cultura que o Japão não tem/cultura comum)", correctAnswer: "cultura exclusiva e valorizada do Japão", rationale: "ならでは → exclusividade positiva. 日本ならでは → exclusivo do Japão (qualidade valorizada).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の作品には独特の力強さを感じるものがある。 (A obra dele não tem força especial./A obra dele tem algo que transmite força única./A força da obra é objetivamente mensurada./A obra é completamente comum.)", correctAnswer: "A obra dele tem algo que transmite força única.", rationale: "ものがある → há algo de (qualidade subjetiva percebida). Avaliação estética/artística.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "態度のいかんによっては処分もありえる。 (Independentemente da atitude, pode haver punição./Dependendo de como for a atitude, pode haver punição./A atitude garante ausência de punição./A punição é impossível.)", correctAnswer: "Dependendo de como for a atitude, pode haver punição.", rationale: "いかんによっては = dependendo de como for. Condicionamento formal: atitude → consequência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社長ともなると責任が違う。 (A responsabilidade do presidente é igual a qualquer cargo./Quando se trata do presidente, a responsabilidade é diferente./Antes de ser presidente, a responsabilidade era maior./A responsabilidade diminui ao virar presidente.)", correctAnswer: "Quando se trata do presidente, a responsabilidade é diferente.", rationale: "ともなると → quando se trata de / ao nível de. Mudança natural de expectativa ao atingir posição elevada.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "必要とあれば、いつでも対応します。 (Atendo apenas quando não é necessário./Se for necessário, atendo a qualquer momento./Já atendi antes de ser necessário./A necessidade não influencia meu atendimento.)", correctAnswer: "Se for necessário, atendo a qualquer momento.", rationale: "とあれば → se for o caso / se necessário. Disposição especial frente a condição específica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "仕事のかたわら大学院に通う = (Abandonar o trabalho para estudar na pós./Estudar na pós paralelamente ao trabalho./Estudar antes de trabalhar./Trabalhar porque estuda na pós.)", correctAnswer: "Estudar na pós paralelamente ao trabalho.", rationale: "かたわら → paralelamente a. 仕事のかたわら → ao mesmo tempo que trabalha. Dois papéis simultâneos.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Revisão integrada — keigo, leitura e escrita formal
    description: Escolha a resposta correta.
    exercises:
      - { type: japanese_vocab, question: "言う (sonkeigo) = (おっしゃる/申す/なさる/まいる)", correctAnswer: "おっしゃる", rationale: "おっしゃる → sonkeigo de 言う. Eleva o interlocutor. 先生がおっしゃったように → como o professor disse.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "いたす = (sonkeigo de する/kenjōgo de する/teineigo de する/informal de する)", correctAnswer: "kenjōgo de する", rationale: "いたす → kenjōgo de する. Rebaixa o falante. ご連絡いたします → entrarei em contato (modesto).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "拝見する (はいけんする) = (sonkeigo de 見る/kenjōgo de 見る/teineigo de 見る/forma casual)", correctAnswer: "kenjōgo de 見る", rationale: "拝見する → kenjōgo de 見る. 資料を拝見します → verei o material (modesto).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「以上のことから、～と考えられる」— esta frase é usada para (introduzir novo tópico/apresentar conclusão/contradizer/fazer pergunta)", correctAnswer: "apresentar conclusão", rationale: "以上のことから → a partir do exposto. Fórmula de conclusão em redação formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "気が利く = (ser preguiçoso/perceber e agir no momento certo/ser impulsivo/ser tímido)", correctAnswer: "perceber e agir no momento certo", rationale: "気が利く → esperto/atencioso. Pessoa que antecipa o que é necessário e age proativamente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "骨が折れる仕事 = (trabalho fácil/trabalho que demanda grande esforço/trabalho sem prazo/trabalho físico)", correctAnswer: "trabalho que demanda grande esforço", rationale: "骨が折れる → quebrar os ossos (metáfora). Trabalho que exige muito esforço e dedicação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に則して vs をもとに: para um ensaio baseado em dados de pesquisa, usa-se (に則して/をもとに/どちらでもいい/どちらも使えない)", correctAnswer: "をもとに", rationale: "をもとに = usando dados como base/material. に則して = conformidade com norma. Dados → をもとに.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「確かに～。しかしながら～」— esta estrutura em redação representa (enumeração/concessão e refutação/exemplificação/introdução)", correctAnswer: "concessão e refutação", rationale: "確かに → de fato (concessão). しかしながら → no entanto (refutação). Estrutura argumentativa clássica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "蓄積 (ちくせき) significa (desperdício/acumulação/redução/distribuição)", correctAnswer: "acumulação", rationale: "蓄積 (ちくせき) → acumulação. 蓄 → acumular; 積 → empilhar. データの蓄積 → acumulação de dados.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Level L completo: qual o foco principal dos padrões N2 avançados? (vocabulário informal do dia a dia/gramática formal, keigo avançado e expressões de registro elevado/apenas kanji/apenas números)", correctAnswer: "gramática formal, keigo avançado e expressões de registro elevado", rationale: "Level L cobre o ápice do N2: をもって, に則して, に即して, keigo, idiomáticas, redação formal — registro elevado.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
