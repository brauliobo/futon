title: 📝 Keigo avançado — sonkeigo e kenjōgo
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Keigo avançado: sonkeigo (尊敬語 — elevar o outro) e kenjōgo (謙譲語 — rebaixar a si mesmo). Pares irregulares: いる→いらっしゃる/おる; 言う→おっしゃる/申す; 食べる→召し上がる/いただく; する→なさる/いたす; 行く→いらっしゃる/まいる."
example: "先生がおっしゃいました。(Sensei disse.) Ex.: Keigo → sonkeigo eleva o outro; kenjōgo rebaixa o falante."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Sonkeigo e kenjōgo — formas irregulares
    description: Escolha a forma keigo correta.
    exercises:
      - { type: japanese_vocab, question: "言う (sonkeigo) = (おっしゃる/申す/いたす/まいる)", correctAnswer: "おっしゃる", rationale: "言う: sonkeigo = おっしゃる (elevar o outro); kenjōgo = 申す (rebaixar o falante).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "言う (kenjōgo) = (おっしゃる/申す/なさる/いらっしゃる)", correctAnswer: "申す", rationale: "申す (もうす) = kenjōgo de 言う. 私が申しますように = como eu disse (forma modesta).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べる/飲む (sonkeigo) = (いただく/召し上がる/まいる/おる)", correctAnswer: "召し上がる", rationale: "食べる・飲む: sonkeigo = 召し上がる (めしあがる). 先生が召し上がっています = o sensei está comendo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べる/飲む (kenjōgo) = (召し上がる/いただく/おっしゃる/なさる)", correctAnswer: "いただく", rationale: "いただく = kenjōgo de 食べる/もらう. 私がいただきます = eu como (forma modesta).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "する (sonkeigo) = (いたす/なさる/まいる/おる)", correctAnswer: "なさる", rationale: "する: sonkeigo = なさる. 何をなさいますか = o que o senhor fará? (eleva o interlocutor).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "する (kenjōgo) = (なさる/いたす/おっしゃる/いらっしゃる)", correctAnswer: "いたす", rationale: "いたす = kenjōgo de する. ご連絡いたします = entrarei em contato (forma modesta).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行く/来る/いる (sonkeigo) = (まいる/おる/いらっしゃる/もうす)", correctAnswer: "いらっしゃる", rationale: "いらっしゃる = sonkeigo de 行く・来る・いる. 三つすべてをカバーする. 社長がいらっしゃいます.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行く/来る (kenjōgo) = (いらっしゃる/まいる/おっしゃる/なさる)", correctAnswer: "まいる", rationale: "まいる (参る) = kenjōgo de 行く・来る. 明日まいります = amanhã irei (forma modesta).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "いる (kenjōgo) = (いらっしゃる/おる/まいる/いたす)", correctAnswer: "おる", rationale: "おる = kenjōgo de いる. 私はここにおります = eu estou aqui (forma modesta).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もらう (kenjōgo) = (あげる/さしあげる/いただく/くださる)", correctAnswer: "いただく", rationale: "いただく = kenjōgo de もらう. 先生からいただきました = recebi do professor (forma modesta).", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Keigo em frases — sonkeigo vs kenjōgo
    description: Escolha a frase keigo correta ou o uso adequado.
    exercises:
      - { type: japanese_vocab, question: "「先生が___います」の正しい形は (おり/いらっしゃって/まいって/いただいて)", correctAnswer: "いらっしゃって", rationale: "先生 = sujeito elevado → sonkeigo: いらっしゃっています. おります = kenjōgo (para si mesmo).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「私が___します」の正しい形は (おっしゃい/なさい/ご説明いたし/召し上がり)", correctAnswer: "ご説明いたし", rationale: "私が (eu) = kenjōgo: ご説明いたします. いたす = kenjōgo de する. ご+V+いたす = forma modesta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あげる (kenjōgo quando o receptor é superior) = (くれる/さしあげる/いただく/くださる)", correctAnswer: "さしあげる", rationale: "さしあげる = kenjōgo de あげる quando o receptor é de posição superior. お持ちさしあげます = levarei para você (modesto).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "くれる (sonkeigo) = (あげる/さしあげる/くださる/いただく)", correctAnswer: "くださる", rationale: "くださる = sonkeigo de くれる. 先生が本をくださいました = o professor me deu um livro (eleva o professor).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「お客様が___ます」— cliente come algo. Forma correta: (いただき/召し上がり/まいり/おり)", correctAnswer: "召し上がり", rationale: "お客様 (cliente) = sujeito elevado → sonkeigo: 召し上がります. いただく seria para eu mesmo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご存知ですか é (kenjōgo de 知る/sonkeigo de 知る/teineigo de 知る/forma neutra de 知る)", correctAnswer: "sonkeigo de 知る", rationale: "ご存知 (ごぞんじ) = sonkeigo de 知る. ご存知ですか = o senhor sabe? (eleva o interlocutor).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "存じております é (sonkeigo de 知る/kenjōgo de 知る/forma neutra/teineigo)", correctAnswer: "kenjōgo de 知る", rationale: "存じる (ぞんじる) = kenjōgo de 知る/思う. 存じております = eu sei/creio (forma muito modesta).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「資料をご覧ください」— ご覧 é (kenjōgo de 見る/sonkeigo de 見る/teineigo de 見る/forma negativa)", correctAnswer: "sonkeigo de 見る", rationale: "ご覧 (ごらん) = sonkeigo de 見る. ご覧ください = por favor, veja (eleva o interlocutor).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "拝見します (はいけんします) é (sonkeigo de 見る/kenjōgo de 見る/forma neutra/forma interrogativa)", correctAnswer: "kenjōgo de 見る", rationale: "拝見する (はいけんする) = kenjōgo de 見る. 拝見します = eu verei (modesto). Rebaixa o falante.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "おいでになる é (kenjōgo de いる/sonkeigo de いる・行く・来る/forma neutra/teineigo)", correctAnswer: "sonkeigo de いる・行く・来る", rationale: "おいでになる = sonkeigo formal de いる・行く・来る. Variante elevada de いらっしゃる.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
