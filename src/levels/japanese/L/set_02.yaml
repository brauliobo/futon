title: 📝 ～といった (tais como / como por exemplo — formal)
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "といった é a forma passada de という, usada como atributivo para listar exemplos: 'tais como / como X e Y'. Mais formal que など. Comum em textos acadêmicos e jornalísticos."
example: "経済や政治といった分野。 Ex.: ～といった → 'tais como / como por exemplo (formal)'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～といった
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "環境や経済といった問題 (problemas que excluem ambiente e economia/problemas tais como ambiente e economia/somente o problema do ambiente/somente o problema da economia)", correctAnswer: "problemas tais como ambiente e economia", rationale: "といった → 'tais como / como por exemplo'. Indica exemplos de uma categoria mais ampla.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "といった serve para (listar exemplos representativos/negar os exemplos mencionados/indicar exceções/indicar causas)", correctAnswer: "listar exemplos representativos", rationale: "といった introduz exemplos que representam uma categoria maior, similar a などの mas mais formal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "教育や医療といった社会サービス (serviços sociais que excluem educação e saúde/serviços sociais tais como educação e saúde/somente a educação como serviço social/somente a saúde como serviço social)", correctAnswer: "serviços sociais tais como educação e saúde", rationale: "教育や医療といった社会サービス → serviços sociais como educação e saúde. Exemplos representativos.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "といった vs など (といった é mais formal; など é mais comum e versátil/など é mais formal/são completamente idênticos/といった é mais coloquial)", correctAnswer: "といった é mais formal; など é mais comum e versátil", rationale: "といった tem registro mais elevado, preferido em textos acadêmicos e formais. など é mais neutro.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "芸術・音楽・文学といった文化活動 (atividades culturais que excluem arte, música e literatura/atividades culturais tais como arte, música e literatura/somente arte como atividade cultural/atividades culturais sem exemplos)", correctAnswer: "atividades culturais tais como arte, música e literatura", rationale: "芸術・音楽・文学といった → tais como arte, música e literatura. Exemplos da categoria atividades culturais.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "といった pode ser substituído por (というような/など(の)/どちらも可/いずれも)", correctAnswer: "というような", rationale: "といった ≒ というような → 'tais como / do tipo'. Ambos introduzem exemplos. など é mais neutro.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "効率性や持続可能性といった概念が重視される。 (Conceitos como eficiência e sustentabilidade são desvalorizados./Conceitos tais como eficiência e sustentabilidade são valorizados./Apenas eficiência é valorizada./Sustentabilidade não é valorizada.)", correctAnswer: "Conceitos tais como eficiência e sustentabilidade são valorizados.", rationale: "効率性や持続可能性といった → tais como eficiência e sustentabilidade. Exemplos de conceitos valorizados.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "差別や偏見といった問題に向き合う必要がある。 (É necessário ignorar problemas como discriminação e preconceito./É necessário enfrentar problemas tais como discriminação e preconceito./Discriminação e preconceito não são problemas./Apenas a discriminação é um problema.)", correctAnswer: "É necessário enfrentar problemas tais como discriminação e preconceito.", rationale: "差別や偏見といった問題 → problemas tais como discriminação e preconceito. Exemplos de desafios sociais.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "といった normalmente modifica (o que vem antes/o que vem depois/nada na frase/apenas verbos)", correctAnswer: "o que vem depois", rationale: "といった é atributivo: modifica o substantivo seguinte. A→といった+B: A é exemplo de B.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "量子コンピューターやAIといった先端技術 (tecnologias de ponta como computação quântica e IA/tecnologias sem computação quântica e IA/somente computação quântica como tecnologia/somente IA como tecnologia)", correctAnswer: "tecnologias de ponta como computação quântica e IA", rationale: "量子コンピューターやAIといった先端技術 → tecnologias de ponta tais como computação quântica e IA.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases formais com ～といった
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "信頼性や透明性といった価値観が企業に求められている。 (Empresas devem evitar valores como confiabilidade e transparência./Valores tais como confiabilidade e transparência são exigidos das empresas./Somente a confiabilidade é exigida./Valores não têm importância para empresas.)", correctAnswer: "Valores tais como confiabilidade e transparência são exigidos das empresas.", rationale: "信頼性や透明性といった価値観 → valores tais como confiabilidade e transparência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "少子化や労働力不足といった課題に対応する必要がある。 (É necessário ignorar desafios como baixa natalidade e escassez de mão de obra./É necessário responder a desafios tais como baixa natalidade e escassez de mão de obra./Somente a baixa natalidade é um desafio./Os desafios não requerem resposta.)", correctAnswer: "É necessário responder a desafios tais como baixa natalidade e escassez de mão de obra.", rationale: "少子化や労働力不足といった課題 → desafios tais como baixa natalidade e escassez de mão de obra.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "といった é mais comum em (conversas casuais/textos escritos de nível médio-alto/textos infantis/comunicações informais)", correctAnswer: "textos escritos de nível médio-alto", rationale: "といった é preferido em ensaios, artigos, relatórios e textos formais. Pouco usado na fala cotidiana.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "福祉や教育といった分野への投資を増やすべきだ。 (Os investimentos em campos como bem-estar e educação devem diminuir./Os investimentos em campos tais como bem-estar e educação devem aumentar./Somente educação merece investimento./O bem-estar não precisa de investimento.)", correctAnswer: "Os investimentos em campos tais como bem-estar e educação devem aumentar.", rationale: "福祉や教育といった分野 → campos tais como bem-estar e educação. Áreas de política pública.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "再生可能エネルギーや省エネといった取り組みが必要だ。 (Iniciativas tais como energia renovável e economia de energia são necessárias./Somente energia renovável é necessária./Iniciativas de energia são desnecessárias./Energia renovável não é uma iniciativa.", correctAnswer: "Iniciativas tais como energia renovável e economia de energia são necessárias.", rationale: "再生可能エネルギーや省エネといった取り組み → iniciativas tais como energia renovável e economia de energia.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "といった pode introduzir quantos exemplos? (apenas um/dois/até três/qualquer quantidade representativa)", correctAnswer: "qualquer quantidade representativa", rationale: "といった pode introduzir um, dois ou mais exemplos que representam uma categoria mais ampla.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "グローバル化といった時代の変化に適応することが求められる。 (Ignorar mudanças como a globalização é necessário./Adaptar-se a mudanças como a globalização é exigido./A globalização não é uma mudança./Adaptação não é necessária.)", correctAnswer: "Adaptar-se a mudanças como a globalização é exigido.", rationale: "グローバル化といった時代の変化 → mudanças dos tempos como a globalização. Exemplo de tendência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "貧困や格差といった問題の背景には複合的な要因がある。 (Problemas como pobreza e desigualdade não têm causas./Há fatores complexos por trás de problemas como pobreza e desigualdade./Somente a pobreza é um problema./A desigualdade não tem causas complexas.)", correctAnswer: "Há fatores complexos por trás de problemas como pobreza e desigualdade.", rationale: "貧困や格差といった問題 → problemas tais como pobreza e desigualdade. Causas complexas por trás.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "といった é sinônimo exato de とか? (Sim, são idênticos/Não, といった é mais formal; とか é mais coloquial/とか é mais formal/são completamente diferentes em significado)", correctAnswer: "Não, といった é mais formal; とか é mais coloquial", rationale: "とか é muito coloquial: AとかBとか. といった é mais formal e apropriado para escrita. Diferentes registros.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "意識改革や制度改善といった取り組みが不可欠だ。 (Iniciativas como reforma de mentalidade e melhoria de sistemas são desnecessárias./Iniciativas tais como reforma de mentalidade e melhoria de sistemas são indispensáveis./Somente a reforma de mentalidade é necessária./Os sistemas não precisam de melhoria.)", correctAnswer: "Iniciativas tais como reforma de mentalidade e melhoria de sistemas são indispensáveis.", rationale: "意識改革や制度改善といった取り組み → iniciativas tais como reforma de mentalidade e melhoria de sistemas.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
