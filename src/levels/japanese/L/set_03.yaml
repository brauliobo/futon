title: 📝 ～ものがある (há algo de / tem um quê de)
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "ものがある expressa que algo tem uma qualidade ou característica difícil de definir com precisão: 'há algo de / tem um quê de'. Expressa sentimento ou avaliação subjetiva. Formal."
example: "彼の演奏には心を動かすものがある。 Ex.: ～ものがある → 'há algo de / tem uma qualidade que'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～ものがある
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "彼の言葉には説得力があるものがある。 (As palavras dele não têm poder de persuasão./Há algo nas palavras dele que tem poder de persuasão./As palavras dele são completamente sem sentido./A persuasão dele é mediana.)", correctAnswer: "Há algo nas palavras dele que tem poder de persuasão.", rationale: "ものがある → 'há algo de / tem um quê de'. Indica qualidade difícil de definir com precisão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものがある expressa (certeza absoluta/avaliação subjetiva de uma qualidade/negação/dúvida total)", correctAnswer: "avaliação subjetiva de uma qualidade", rationale: "ものがある indica que o falante percebe certa qualidade que tem impacto. Avaliação pessoal e imprecisa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この作品には独特の美しさを感じさせるものがある。 (Esta obra não tem beleza especial./Esta obra tem algo que faz sentir uma beleza única./Esta obra é completamente comum./A beleza desta obra é exatamente definida.)", correctAnswer: "Esta obra tem algo que faz sentir uma beleza única.", rationale: "独特の美しさを感じさせるものがある → há algo que faz sentir uma beleza única. Apreciação estética.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものがある é tipicamente usado para avaliar (objetos físicos com medida/qualidades abstratas e subjetivas/fatos científicos comprovados/informações objetivas)", correctAnswer: "qualidades abstratas e subjetivas", rationale: "ものがある é ideal para descrever qualidades que se sentem mas são difíceis de definir objetivamente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の努力には頭が下がるものがある。 (O esforço dele não merece respeito./O esforço dele tem algo que inspira profundo respeito./O esforço dele é mediano./O esforço dele é definido com precisão.)", correctAnswer: "O esforço dele tem algo que inspira profundo respeito.", rationale: "頭が下がるものがある → há algo que faz dobrar a cabeça (em reverência). Expressão de admiração.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものがある vs ものだ (ものがある = qualidade subjetiva percebida; ものだ = afirmação sobre natureza/são idênticos/ものだ = qualidade subjetiva; ものがある = afirmação/ものがある é mais coloquial)", correctAnswer: "ものがある = qualidade subjetiva percebida; ものだ = afirmação sobre natureza", rationale: "ものがある → 'há algo de' (percepção subjetiva). ものだ → 'é isso que é' (afirmação sobre natureza).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この映画には時代を超えた普遍的なメッセージが感じられるものがある。 (Este filme não tem mensagem universal./Este filme tem algo que transmite uma mensagem universal que transcende o tempo./A mensagem do filme é datada./O filme não tem mensagem.)", correctAnswer: "Este filme tem algo que transmite uma mensagem universal que transcende o tempo.", rationale: "時代を超えた普遍的なメッセージが感じられるものがある → algo de mensagem universal atemporal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものがある precede (o que descreve a qualidade/o que nega a qualidade/um substantivo específico/uma pergunta)", correctAnswer: "o que descreve a qualidade", rationale: "ものがある sempre vem depois da descrição da qualidade percebida. A estrutura: [percepção]ものがある.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この音楽には懐かしさを呼び起こすものがある。 (Esta música não evoca nostalgia./Esta música tem algo que evoca nostalgia./A nostalgia desta música é precisamente definida./Esta música não tem impacto emocional.)", correctAnswer: "Esta música tem algo que evoca nostalgia.", rationale: "懐かしさを呼び起こすものがある → há algo que evoca saudade/nostalgia. Qualidade emotiva percebida.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものがある é frequente em (criticas literárias e artísticas, ensaios/diálogos casuais/instruções técnicas/notícias econômicas)", correctAnswer: "críticas literárias e artísticas, ensaios", rationale: "ものがある é comum em crítica literária, avaliação artística, ensaios filosóficos — registro elevado.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases literárias com ～ものがある
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "この小説の文体には読者を引き込む力があるものがある。 (Este romance não tem poder de atrair leitores./Este romance tem algo que tem o poder de atrair leitores./A força deste romance é precisamente medida./Este romance é completamente comum.)", correctAnswer: "Este romance tem algo que tem o poder de atrair leitores.", rationale: "読者を引き込む力があるものがある → tem algo que atrai leitores. Avaliação da qualidade literária.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の生き方には学ぶべきものがある。 (O modo de vida dele não tem nada a aprender./Há algo no modo de vida dele que vale aprender./O modo de vida dele é precisamente definido./Ninguém se preocupa com o modo de vida dele.)", correctAnswer: "Há algo no modo de vida dele que vale aprender.", rationale: "学ぶべきものがある → há algo que vale aprender. べき + ものがある combina obrigação moral com qualidade percebida.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものがある expressa que o falante (tem certeza absoluta/percebe algo difícil de articular precisamente/nega o que vem antes/faz uma pergunta)", correctAnswer: "percebe algo difícil de articular precisamente", rationale: "ものがある indica percepção subjetiva de algo que existe mas é difícil de definir com exatidão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この絵には人の心を動かす何かがあるものがある。 (Esta pintura não emociona ninguém./Esta pintura tem algo que move o coração das pessoas./A emoção desta pintura é mensurável./Esta pintura é completamente comum.)", correctAnswer: "Esta pintura tem algo que move o coração das pessoas.", rationale: "人の心を動かす何かがあるものがある → há algo que move o coração. Qualidade emotiva profunda.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女の演技には鬼気迫るものがある。 (A atuação dela não tem intensidade./A atuação dela tem algo de arrepiante e intenso./A atuação dela é mediana./A intensidade dela é medida com precisão.)", correctAnswer: "A atuação dela tem algo de arrepiante e intenso.", rationale: "鬼気迫るものがある → há algo de aterrorizante/assombroso. 鬼気迫る → de arrepiar/assustador.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その政策には賛否両論を呼ぶものがある。 (Esta política não gera opiniões diversas./Esta política tem algo que gera opiniões favoráveis e contrárias./A política não tem impacto./Todos concordam com a política.)", correctAnswer: "Esta política tem algo que gera opiniões favoráveis e contrárias.", rationale: "賛否両論を呼ぶものがある → há algo que gera opiniões contrastantes. Política controversa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題には考えさせられるものがある。 (Este problema não faz pensar./Este problema tem algo que nos faz pensar./O problema é simples e não requer reflexão./Pensar sobre o problema é desnecessário.)", correctAnswer: "Este problema tem algo que nos faz pensar.", rationale: "考えさせられるものがある → há algo que faz refletir. Qualidade reflexiva percebida no problema.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものがある vs がある (ものがある expressa qualidade subjetiva difusa; がある expressa existência objetiva/são idênticos/がある expressa qualidade subjetiva/ものがある apenas confirma existência)", correctAnswer: "ものがある expressa qualidade subjetiva difusa; がある expressa existência objetiva", rationale: "本がある → há um livro (objetivo). 読む価値があるものがある → há algo digno de ser lido (qualidade subjetiva).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の主張には一理あるものがある。 (O argumento dele não tem lógica nenhuma./O argumento dele tem algo de lógico/razoável./O argumento dele é completamente correto./O argumento dele é completamente errado.)", correctAnswer: "O argumento dele tem algo de lógico/razoável.", rationale: "一理あるものがある → há algo de razoável. 一理 (いちり) → certa lógica/razão. Reconhecimento parcial.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この詩には言葉にできない感動を生むものがある。 (Este poema não emociona./Este poema tem algo que gera emoção que não se consegue colocar em palavras./A emoção deste poema é precisamente descrita./Este poema é completamente prosaico.)", correctAnswer: "Este poema tem algo que gera emoção que não se consegue colocar em palavras.", rationale: "言葉にできない感動を生むものがある → há algo que gera emoção indescritível. Poder poético subjetivo.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
