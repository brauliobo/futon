title: 📝 ～とあれば (se for o caso de / se necessário)
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "とあれば indica disposição de fazer algo em circunstâncias especiais: 'se for o caso de / se necessário / caso seja assim'. Expressa que o falante fará algo por ser uma condição ou necessidade especial. Formal. Estrutura: N/clause+とあれば."
example: "必要とあれば、すぐに対応します。 Ex.: ～とあれば → 'se for o caso / se assim for necessário'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～とあれば
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "必要とあれば助けます。 (Ajudei antes de ser necessário./Ajudarei mesmo que não seja necessário./Se for necessário, ajudarei./Não ajudarei mesmo que necessário.)", correctAnswer: "Se for necessário, ajudarei.", rationale: "とあれば → 'se for o caso / se assim for'. 必要とあれば → se for necessário. Condição especial.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "とあれば expressa (passado/condição genérica/disposição especial em circunstância excepcional/negação)", correctAnswer: "disposição especial em circunstância excepcional", rationale: "とあれば → 'se tal condição especial se apresentar, então...'. Não é condição genérica — é excepcional.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供のためとあれば、何でもします。 (Por ser pelo bem dos filhos, farei tudo./Não farei nada pelo bem dos filhos./Já fiz tudo pelo bem dos filhos./Farei algo pelo bem dos filhos, mas limitado.)", correctAnswer: "Por ser pelo bem dos filhos, farei tudo.", rationale: "子供のためとあれば → por ser pelo bem dos filhos (condição especial que justifica ação total).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "とあれば vs なら (とあれば é mais formal e indica condição especial que justifica esforço; なら é neutro e genérico/são idênticos/なら é mais formal/とあれば é mais coloquial)", correctAnswer: "とあれば é mais formal e indica condição especial que justifica esforço; なら é neutro e genérico", rationale: "とあれば implica que a condição é especial e motiva o falante. なら → condição neutra qualquer.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "命令とあれば従います。 (Desobedeço mesmo que seja uma ordem./Se for uma ordem, obedeço./Já obedeci à ordem./Obedeço parcialmente se for uma ordem.)", correctAnswer: "Se for uma ordem, obedeço.", rationale: "命令とあれば → se for uma ordem (condição especial que justifica obediência). Formal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "とあれば pode ser precedido de (apenas substantivos/substantivos, frases nominais e orações/apenas verbos/apenas adjetivos)", correctAnswer: "substantivos, frases nominais e orações", rationale: "とあれば: 必要(N)とあれば / 子供のため(フレーズ)とあれば / そうとあれば. Amplo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お役に立てるとあれば、喜んで参ります。 (Se não puder ser útil, irei com prazer./Se puder ser útil, irei com prazer./Já fui porque pude ser útil./Irei com prazer independentemente de ser útil.)", correctAnswer: "Se puder ser útil, irei com prazer.", rationale: "お役に立てるとあれば → se puder ser útil. Condição especial que motiva disposição alegre.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "そうとあれば話は別だ。 (Sendo assim, o assunto não muda./Sendo assim, o assunto é diferente./O assunto foi diferente antes./O assunto não importa.)", correctAnswer: "Sendo assim, o assunto é diferente.", rationale: "そうとあれば話は別 → se for assim, o assunto é diferente. Reavaliação mediante nova informação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "とあれば em tom positivo indica (relutância/disposição e comprometimento diante de condição especial/indiferença/obrigação simples)", correctAnswer: "disposição e comprometimento diante de condição especial", rationale: "とあれば → a condição especial motiva o falante a agir. Tom de comprometimento e esforço.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "プロとしての誇りとあれば妥協はできない。 (Sendo o orgulho de um profissional, não posso comprometer./Mesmo sendo o orgulho de um profissional, posso comprometer./Já comprometei o orgulho profissional./O orgulho profissional não influencia.)", correctAnswer: "Sendo o orgulho de um profissional, não posso comprometer.", rationale: "プロとしての誇りとあれば → sendo o orgulho profissional (em jogo), não há como comprometer.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～とあれば em contexto
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "会社の存続にかかわるとあれば、全力を尽くします。 (Se não tiver relação com a sobrevivência da empresa, darei tudo./Se estiver em jogo a sobrevivência da empresa, darei tudo./Já dei tudo pela sobrevivência da empresa./A sobrevivência da empresa não me motiva.)", correctAnswer: "Se estiver em jogo a sobrevivência da empresa, darei tudo.", rationale: "会社の存続にかかわるとあれば → se estiver em jogo a sobrevivência da empresa. Condição excepcional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご要望とあれば、いつでも対応いたします。 (Se não for uma solicitação, atenderemos a qualquer momento./Se for uma solicitação, atenderemos a qualquer momento./Atendemos antes de receber solicitação./A solicitação não influencia nosso atendimento.)", correctAnswer: "Se for uma solicitação, atenderemos a qualquer momento.", rationale: "ご要望とあれば → se for uma solicitação. Disposição de atender condicionada à solicitação do cliente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "とあれば vs とすれば (とあれば = disposição especial frente a condição real/assumida; とすれば = suposição hipotética/são idênticos/とすれば indica disposição/とあれば é hipotético)", correctAnswer: "とあれば = disposição especial frente a condição real/assumida; とすれば = suposição hipotética", rationale: "とあれば → se essa condição real se apresentar. とすれば → se (hipoteticamente) for assim.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生のご指示とあれば、従わざるを得ません。 (Se for instrução do professor, não tenho escolha senão obedecer./Mesmo sendo instrução do professor, desobedeço./Já obedeci à instrução do professor./A instrução do professor não influencia minha decisão.)", correctAnswer: "Se for instrução do professor, não tenho escolha senão obedecer.", rationale: "先生のご指示とあれば → se for instrução do professor. ざるを得ません → não pode não fazer.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "患者さんのためとあれば、夜通し働きます。 (Se não for pelo bem do paciente, trabalharei a noite toda./Se for pelo bem do paciente, trabalharei a noite toda./Já trabalhei a noite toda pelo paciente./O bem do paciente não influencia meu trabalho.)", correctAnswer: "Se for pelo bem do paciente, trabalharei a noite toda.", rationale: "患者さんのためとあれば → se for pelo bem do paciente. Condição que justifica esforço extremo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "そうとあれば早急に対策を講じる必要がある。 (Mesmo que seja assim, não é necessário agir rapidamente./Se for assim, é necessário tomar medidas imediatas./Já tomei medidas antes de saber da situação./A situação não requer medidas.)", correctAnswer: "Se for assim, é necessário tomar medidas imediatas.", rationale: "そうとあれば → se for assim. Reavaliação da urgência com base em nova informação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "とあれば é especialmente expressivo quando (a condição é trivial/a condição é excepcional e justifica esforço/o falante é indiferente/o contexto é informal)", correctAnswer: "a condição é excepcional e justifica esforço", rationale: "とあれば tem mais expressividade quando a condição é especial: dever profissional, bem-estar alheio, ordem.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "緊急事態とあれば、夜間も対応いたします。 (Em caso de emergência, não atendemos à noite./Em caso de emergência, também atendemos à noite./Atendemos à noite independentemente de emergência./Já atendemos em emergência noturna.)", correctAnswer: "Em caso de emergência, também atendemos à noite.", rationale: "緊急事態とあれば → em caso de emergência. 夜間も → também à noite. Disposição excepcional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国家の安全とあれば、個人の権利を制限することも許される。 (Se não for pela segurança nacional, restringir direitos é permitido./Se for pela segurança nacional, restringir direitos individuais é também permitido./A segurança nacional não justifica restrição de direitos./A restrição ocorre antes de avaliar a segurança.)", correctAnswer: "Se for pela segurança nacional, restringir direitos individuais é também permitido.", rationale: "国家の安全とあれば → se for pela segurança nacional. Condição excepcional que justifica medida extrema.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "とあれば o contexto após é normalmente (recusa/disposição e ação motivada/dúvida/negação da condição)", correctAnswer: "disposição e ação motivada", rationale: "とあれば + [ação motivada/comprometida]. Estrutura: condição especial → disposição de agir.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
