title: 📝 Comparação N1/N2 — padrões difíceis
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Comparação de padrões N2/N1 que causam confusão: に過ぎない vs に他ならない, ずにはいられない vs てたまらない, ものがある vs ものだ, に即して vs に則して, をもとに vs に基づいて. Revisão contrastiva avançada."
example: "彼の行動は裏切りに他ならない vs 彼は初心者に過ぎない。 Ex.: Padrões difíceis → comparação e distinção de uso."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Distinguir padrões similares — N2/N1
    description: Escolha a distinção correta entre os padrões.
    exercises:
      - { type: japanese_vocab, question: "に過ぎない vs に他ならない: a diferença principal é (são idênticos/に過ぎない = apenas/somente (minimização); に他ならない = nada mais que (identificação enfática)/に他ならない minimiza; に過ぎない identifica/ambos são negativos)", correctAnswer: "に過ぎない = apenas/somente (minimização); に他ならない = nada mais que (identificação enfática)", rationale: "に過ぎない = é só X, nada mais. に他ならない = é exatamente X, e não outra coisa. Tons opostos.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ずにはいられない vs てたまらない: a diferença é (são idênticos/ずにはいられない = compulsão de ação; てたまらない = sentimento insuportável/てたまらない = compulsão de ação/ずにはいられない = sentimento físico)", correctAnswer: "ずにはいられない = compulsão de ação; てたまらない = sentimento insuportável", rationale: "ずにはいられない = não consegue não fazer X. てたまらない = sente X de forma insuportável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をもとに vs に基づいて: a diferença é (são idênticos/をもとに = usando X como material criativo; に基づいて = agindo em conformidade com norma/lei/をもとに é conformidade com norma/に基づいて é material criativo)", correctAnswer: "をもとに = usando X como material criativo; に基づいて = agindo em conformidade com norma/lei", rationale: "をもとに = X como fonte/material de criação. に基づいて = fundamentado em X (lei, regra, dados).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に即して vs に則して: a diferença é (são homônimos idênticos/に即して = aderência à realidade concreta; に則して = conformidade com norma prescrita/に則して = realidade; に即して = norma/ambos são equivalentes de に従って)", correctAnswer: "に即して = aderência à realidade concreta; に則して = conformidade com norma prescrita", rationale: "即 = aderir à realidade. 則 = seguir norma. 状況に即して (realidade) vs 法律に則して (norma).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものがある vs ものだ: a diferença é (são idênticos/ものがある = qualidade subjetiva percebida; ものだ = afirmação sobre natureza/costume/são ambos negativos/ものだ = qualidade subjetiva)", correctAnswer: "ものがある = qualidade subjetiva percebida; ものだ = afirmação sobre natureza/costume", rationale: "ものがある = há algo de (percepção). ものだ = é algo que ~ (natureza/costume): 春はそういうものだ.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "からこそ vs だけあって: a diferença é (são idênticos/からこそ = causa exclusiva enfática; だけあって = resultado esperado de qualidade/だけあって é causa exclusiva/からこそ é resultado esperado)", correctAnswer: "からこそ = causa exclusiva enfática; だけあって = resultado esperado de qualidade", rationale: "からこそ = exatamente por isso (causa). だけあって = como é de esperar de X (reputação/qualidade).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "いかんによって vs 次第 (しだい): a diferença é (são idênticos/いかんによって é mais formal e literário; 次第 é mais comum/次第 é mais formal/いかんによって é mais coloquial)", correctAnswer: "いかんによって é mais formal e literário; 次第 é mais comum", rationale: "いかんによって = formal/literário. 次第 = muito mais frequente e natural em contextos cotidianos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "かたわら vs ながら: a diferença é (são idênticos/かたわら = dois papéis contínuos paralelos (formal); ながら = duas ações simultâneas breves/ながら é formal para papéis contínuos/かたわら é para ações físicas breves)", correctAnswer: "かたわら = dois papéis contínuos paralelos (formal); ながら = duas ações simultâneas breves", rationale: "かたわら = papéis de longo prazo. ながら = 歩きながら話す (ações físicas simultâneas breves).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ならでは vs にしか: a diferença é (são idênticos/ならでは = exclusividade positiva valorizada; にしか = limitação neutra/にしか é positivo; ならでは é negativo/ならでは é mais coloquial)", correctAnswer: "ならでは = exclusividade positiva valorizada; にしか = limitação neutra", rationale: "ならでは = algo valioso e único de X. にしか = só X pode ~ (sem valoração): 子供にしかできない.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をもって vs によって: a diferença é (são idênticos/をもって é muito mais formal; によって é versátil e menos formal/によって é mais formal/をもって é mais coloquial)", correctAnswer: "をもって é muito mais formal; によって é versátil e menos formal", rationale: "をもって = formal/cerimonial (instrumento, marco, razão). によって = versátil: causa, meio, agente.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Aplicação de padrões difíceis em contexto
    description: Escolha a frase correta ou o padrão adequado.
    exercises:
      - { type: japanese_vocab, question: "「彼女は天才___、どんな問題も解いてしまう」— melhor opção: (だけに/だけあって/からこそ/ゆえに)", correctAnswer: "だけあって", rationale: "天才だけあって = como é de esperar de uma gênio. Resultado esperado de uma qualidade excepcional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「日本___の文化を大切にしたい」— melhor opção: (だけ/ならでは/にしか/ばかり)", correctAnswer: "ならでは", rationale: "日本ならではの文化 = cultura exclusiva do Japão (valorização positiva). ならでは = exclusividade qualitativa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「苦しかった___今の幸せが輝いて見える」— melhor opção: (からこそ/だけあって/だから/なので)", correctAnswer: "からこそ", rationale: "苦しかったからこそ = exatamente por ter sido difícil. からこそ = causa exclusiva e enfática.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「検査結果___治療方針を決定する」— melhor opção: (をもとに/によって/に基づいて/のかたわら)", correctAnswer: "に基づいて", rationale: "検査結果に基づいて = com base nos resultados do exame. に基づいて = fundamentado em (dado/norma).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「彼の成功は努力の結果___」— melhor opション: (に過ぎない/に他ならない/ものがある/だけあって)", correctAnswer: "に他ならない", rationale: "努力の結果に他ならない = não é nada mais que o resultado do esforço. Identificação enfática positiva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「仕事の___, 大学院にも通っている」— melhor opção: (かたわら/ながら/ついでに/前に)", correctAnswer: "かたわら", rationale: "仕事のかたわら = paralelamente ao trabalho. かたわら = dois papéis contínuos. 大学院 = pós-graduação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「規則___行動することが求められる」— melhor opção: (に即して/をもとに/のかたわら/に先立って)", correctAnswer: "に即して", rationale: "規則に即して = em conformidade/aderindo às regras. に即して = aderência à norma/realidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「彼の音楽には聴衆を魅了する___」— melhor opção: (ものだ/ものがある/ものなら/ものの)", correctAnswer: "ものがある", rationale: "ものがある = há algo de. 聴衆を魅了するものがある = há algo que fascina o público. Qualidade subjetiva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「本日___契約を終了いたします」— melhor opção: (で/をもって/によって/において)", correctAnswer: "をもって", rationale: "本日をもって = a partir de hoje (marco de encerramento formal). をもって = formal para datas de ação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「面接の___次のステップが決まる」— melhor opção: (いかんによって/ならでは/かたわら/をもって)", correctAnswer: "いかんによって", rationale: "面接のいかんによって = dependendo de como for a entrevista. いかんによって = condicionamento formal.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
