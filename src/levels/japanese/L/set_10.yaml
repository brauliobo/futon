title: 📝 ～に即して (de acordo com / adaptado a)
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "に即して (にそくして) significa 'de acordo com a realidade/situação concreta / adaptado a'. Diferente de に則して (conformidade com norma), に即して = aderência à realidade concreta ou situação específica. Ex: 実態に即して = de acordo com a realidade concreta."
example: "現場の実態に即して判断する。 Ex.: ～に即して → 'de acordo com a realidade / adaptado à situação concreta'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～に即して
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "実態に即して判断する (julgar ignorando a realidade/julgar de acordo com a realidade concreta/julgar antes de conhecer a realidade/julgar apesar da realidade)", correctAnswer: "julgar de acordo com a realidade concreta", rationale: "に即して → 'de acordo com / adaptado a'. 実態に即して → de acordo com a realidade concreta.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "即 (そく) em に即して significa (violação/aderência/ausência/dúvida)", correctAnswer: "aderência", rationale: "即 → aderir/aproximar-se. に即して → aderindo a / em conformidade com a realidade ou situação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に即して vs に則して (に即して = aderência à realidade concreta; に則して = conformidade com norma/lei/são idênticos/に則して é aderência à realidade/に即して é conformidade com lei)", correctAnswer: "に即して = aderência à realidade concreta; に則して = conformidade com norma/lei", rationale: "に即して: 実態・現状・状況 (realidade/situação). に則して: 規則・法律・原則 (norma/lei/princípio).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "状況に即した対応 (resposta que ignora a situação/resposta adaptada à situação/resposta antes da situação/resposta apesar da situação)", correctAnswer: "resposta adaptada à situação", rationale: "状況に即した+N → adaptado à situação. に即した → forma atributiva de に即する.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "時代に即したサービスを提供する。 (Oferecer serviço incompatível com os tempos./Oferecer serviço adaptado aos tempos/à era atual./O serviço não considera a época./Oferecer serviço antes de avaliar os tempos.)", correctAnswer: "Oferecer serviço adaptado aos tempos/à era atual.", rationale: "時代に即した → adaptado à época. Serviço que corresponde às necessidades e realidade atual.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に即して é frequente com N como (規則・法律/実態・現状・状況・時代/名前・住所/感情・気持ち)", correctAnswer: "実態・現状・状況・時代", rationale: "に即して combina com realidade e situação concreta: 実態 (realidade), 現状 (situação atual), 時代 (época).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "現状に即した政策を策定する必要がある。 (É necessário formular política que ignora a situação atual./É necessário formular política adaptada à situação atual./A política não deve considerar a situação./A política é formulada antes de avaliar a situação.)", correctAnswer: "É necessário formular política adaptada à situação atual.", rationale: "現状に即した政策 → política adaptada à situação atual. に即した → atributivo de に即する.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に即して vs に応じて (に即して = aderência a realidade concreta; に応じて = em resposta a / variando conforme/são idênticos/に応じて é mais formal/に即して é mais coloquial)", correctAnswer: "に即して = aderência a realidade concreta; に応じて = em resposta a / variando conforme", rationale: "に応じて → variar em resposta a (necessidade, nível). に即して → aderir à realidade concreta existente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "教育は子供の発達段階に即して行われるべきだ。 (A educação deve ignorar o estágio de desenvolvimento./A educação deve ser realizada de acordo com o estágio de desenvolvimento./O desenvolvimento não influencia a educação./A educação precede o desenvolvimento.)", correctAnswer: "A educação deve ser realizada de acordo com o estágio de desenvolvimento.", rationale: "発達段階に即して → de acordo com o estágio de desenvolvimento. Educação adaptada à realidade da criança.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に即して expressa que a ação é (contrária à realidade/adaptada e adequada à realidade/independente da realidade/anterior à realidade)", correctAnswer: "adaptada e adequada à realidade", rationale: "に即して → agir de forma que adere e se adapta à realidade concreta da situação.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～に即して em contexto
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "市場の実情に即した価格設定が必要だ。 (É necessária precificação que ignora a realidade do mercado./É necessária precificação adaptada à realidade do mercado./A realidade do mercado não influencia o preço./O preço é definido antes de analisar o mercado.)", correctAnswer: "É necessária precificação adaptada à realidade do mercado.", rationale: "市場の実情に即した価格設定 → precificação adaptada à realidade do mercado. 実情 → situação real.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "現地の文化に即した対応が求められる。 (É exigida resposta que ignora a cultura local./É exigida resposta adaptada à cultura local./A cultura não influencia a resposta./A resposta precede o conhecimento cultural.)", correctAnswer: "É exigida resposta adaptada à cultura local.", rationale: "現地の文化に即した → adaptado à cultura local. Sensibilidade cultural na abordagem.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に即して indica que a ação é (em conformidade com uma norma prescrita/adequada e adaptada à realidade ou contexto específico/independente do contexto/contrária ao contexto)", correctAnswer: "adequada e adaptada à realidade ou contexto específico", rationale: "に即して → aderência à realidade concreta. Ação que se ajusta ao contexto real, não a normas abstratas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ニーズに即したサービスを開発する。 (Desenvolver serviço que ignora as necessidades./Desenvolver serviço adaptado às necessidades./As necessidades não influenciam o serviço./O serviço é desenvolvido antes de avaliar necessidades.)", correctAnswer: "Desenvolver serviço adaptado às necessidades.", rationale: "ニーズに即した → adaptado às necessidades. ニーズ → needs. Serviço que responde à demanda real.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "実情に即した研修を実施する。 (Realizar treinamento que ignora a realidade./Realizar treinamento adaptado à realidade./A realidade não influencia o treinamento./O treinamento é realizado antes de analisar a realidade.)", correctAnswer: "Realizar treinamento adaptado à realidade.", rationale: "実情に即した研修 → treinamento adaptado à realidade. 実情 → situação real/realidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に即して mais frequentemente aparece em (textos recreativos/relatórios, planos e documentos de gestão/conversas informais/mensagens de texto)", correctAnswer: "relatórios, planos e documentos de gestão", rationale: "に即して é formal: relatórios gerenciais, planos educacionais, documentos de política e gestão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "地域の実態に即した支援策を講じる。 (Tomar medidas de apoio que ignoram a realidade regional./Tomar medidas de apoio adaptadas à realidade regional./A realidade regional não influencia as medidas./As medidas precedem a análise regional.)", correctAnswer: "Tomar medidas de apoio adaptadas à realidade regional.", rationale: "地域の実態に即した支援策 → medidas de suporte adaptadas à realidade regional. 講じる → tomar medidas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に即して vs をもとに (に即して = aderência à realidade presente; をもとに = usando X como base/material de criação/são idênticos/をもとに é aderência à realidade/に即して é material de criação)", correctAnswer: "に即して = aderência à realidade presente; をもとに = usando X como base/material de criação", rationale: "をもとに → X como material de onde algo é criado. に即して → aderir à realidade existente ao agir.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "学習者のレベルに即した教材を選ぶ。 (Escolher material que ignora o nível do aluno./Escolher material adaptado ao nível do aluno./O nível não influencia a escolha do material./O material é escolhido antes de avaliar o nível.)", correctAnswer: "Escolher material adaptado ao nível do aluno.", rationale: "学習者のレベルに即した教材 → material adaptado ao nível do aprendiz. Ensino contextualizado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に即して (にそくして) e に則して (にそくして): como distinguir? (são homônimos e idênticos/に即して = realidade concreta; に則して = norma/regra/são pronunciados diferente/に則して = realidade; に即して = norma)", correctAnswer: "に即して = realidade concreta; に則して = norma/regra", rationale: "Ambos se pronunciam にそくして mas kanji diferem: 即 (aderir) vs 則 (norma). Distinção no kanji e uso.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
