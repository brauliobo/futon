title: 🗣️ Vocabulário N2 — expressões idiomáticas
level: 'L'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Expressões idiomáticas N2 com 気・心・手・目: 気が置けない (pessoa de confiança), 心が折れる (desanimar), 手に余る (além da capacidade), 目をつぶる (fechar os olhos para/ignorar). Essenciais para leitura de textos N2."
example: "気が置けない友人。 Ex.: Expressões idiomáticas → significados figurados com partes do corpo."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Expressões com 気・心・手・目
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "気が置けない友人 (amigo desconfiável/amigo com quem é difícil relaxar/amigo com quem se pode relaxar sem cerimônia/amigo que guarda segredos)", correctAnswer: "amigo com quem se pode relaxar sem cerimônia", rationale: "気が置けない → não precisar ficar na guarda. Pessoa de confiança com quem se está à vontade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "心が折れる (ficar animado/encher de coragem/desanimar/desistir completamente)", correctAnswer: "desanimar", rationale: "心が折れる → o coração se parte. Perder ânimo/motivação diante de dificuldades.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "手に余る仕事 (trabalho com poucas horas/trabalho fácil de fazer/trabalho além da capacidade de lidar/trabalho que sobra)", correctAnswer: "trabalho além da capacidade de lidar", rationale: "手に余る → exceder as mãos / além da capacidade. 手に余る仕事 → trabalho difícil demais para lidar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "目をつぶる (olhar atentamente/abrir os olhos/ignorar/fechar intencionalmente)", correctAnswer: "ignorar", rationale: "目をつぶる → fechar os olhos para algo. Fingir não ver / tolerar / ignorar intencionalmente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "気が利く人 (pessoa desatenta/pessoa inoportuna/pessoa que percebe e age no momento certo/pessoa lenta)", correctAnswer: "pessoa que percebe e age no momento certo", rationale: "気が利く → esperto/atencioso. Pessoa que percebe o que é necessário e age proativamente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "腹を割って話す (conversar superficialmente/conversar guardando segredos/conversar abertamente e com sinceridade/conversar formalmente)", correctAnswer: "conversar abertamente e com sinceridade", rationale: "腹を割る → abrir o ventre (metáfora). Falar com total abertura e sinceridade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "顔が広い人 (pessoa que viaja muito/pessoa com rosto grande/pessoa muito conhecida e com muitos contatos/pessoa introvertida)", correctAnswer: "pessoa muito conhecida e com muitos contatos", rationale: "顔が広い → rosto largo (metáfora). Ter muitos conhecidos, networking amplo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "水に流す (não esquecer/perdoar e esquecer/lembrar para sempre/guardar rancor)", correctAnswer: "perdoar e esquecer", rationale: "水に流す → jogar na água e deixar fluir. Deixar para trás / perdoar / não guardar rancor.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "耳を傾ける (ignorar/ouvir atentamente/fazer barulho/falar muito)", correctAnswer: "ouvir atentamente", rationale: "耳を傾ける → inclinar o ouvido. Ouvir com atenção e interesse.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "足を引っ張る (ajudar/ser obstáculo para alguém/competir/caminhar rápido)", correctAnswer: "ser obstáculo para alguém", rationale: "足を引っ張る → puxar o pé de alguém. Atrapalhar / prejudicar o progresso de outrem.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Expressões idiomáticas N2 em contexto
    description: Escolha o significado correto da expressão na frase.
    exercises:
      - { type: japanese_vocab, question: "彼は口が堅い。 (Ele fala muito./Ele guarda segredos./Ele mente facilmente./Ele fala formalmente.)", correctAnswer: "Ele guarda segredos.", rationale: "口が堅い → boca firme. Pessoa discreta que não revela segredos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "骨が折れる仕事 (trabalho fácil/trabalho muito difícil que demanda esforço/trabalho com muitas pausas/trabalho rápido)", correctAnswer: "trabalho muito difícil que demanda esforço", rationale: "骨が折れる → quebrar os ossos (metáfora). Trabalho que demanda grande esforço.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "一石二鳥 (perder duas vezes/conseguir dois resultados com uma ação/fazer uma coisa de cada vez/desperdiçar esforço)", correctAnswer: "conseguir dois resultados com uma ação", rationale: "一石二鳥 → uma pedra dois pássaros. Matar dois coelhos com uma cajadada. Do inglês 'two birds with one stone'.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "頭が上がらない人 (pessoa com quem se pode ser autoritário/pessoa a quem não se pode desobedecer por obrigação/pessoa ignorada/pessoa inimiga)", correctAnswer: "pessoa a quem não se pode desobedecer por obrigação", rationale: "頭が上がらない → não conseguir levantar a cabeça. Dever grande a alguém; não poder contrariá-lo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "胸を打つ話 (história sem impacto/história que comove profundamente/história confusa/história chata)", correctAnswer: "história que comove profundamente", rationale: "胸を打つ → bater no peito (metáfora). Historia que emociona / toca o coração profundamente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "目から鱗が落ちる (ficar confuso/ter uma revelação esclarecedora/perder a visão/ficar com sono)", correctAnswer: "ter uma revelação esclarecedora", rationale: "目から鱗が落ちる → escamas caem dos olhos. Ter insight / revelação que muda a perspectiva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "棚に上げる (guardar com cuidado/ignorar a própria falha enquanto critica outro/organizar metodicamente/arquivar com cuidado)", correctAnswer: "ignorar a própria falha enquanto critica outro", rationale: "棚に上げる → colocar na prateleira. Deixar de lado o próprio problema para criticar os outros.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "気が散る (concentrar-se/perder a concentração/ficar animado/descansar)", correctAnswer: "perder a concentração", rationale: "気が散る → a atenção se dispersa. Ficar distraído / perder o foco.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "二の足を踏む (avançar rapidamente/hesitar antes de agir/desistir completamente/agir sem pensar)", correctAnswer: "hesitar antes de agir", rationale: "二の足を踏む → pisar no segundo passo (metáfora). Hesitar / vacilar antes de tomar uma atitude.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "折り合いをつける (não ceder nunca/chegar a um acordo mútuo/competir/evitar a situação)", correctAnswer: "chegar a um acordo mútuo", rationale: "折り合いをつける → ajustar os dobros. Chegar a um meio-termo / encontrar um acordo satisfatório.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
