title: 📝 Revisão final D — N4 intro completo
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "Revisão de todos os pontos do nível D: condicionais (ば/たら/と/なら), dar/receber, potencial, passiva, causativa, ようだ/そうだ/らしい, comparação, ながら, あいだ."
example: "食べれば元気になる / 食べたら元気になる / 食べると元気になる. Ex.: Revisão integrada do N4 intro completo."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Revisão — gramática D (parte 1)
    description: Escolha a opção correta.
    exercises:
      - { type: japanese_vocab, question: "安___買います。 [condicional ば] (くなければ/かったら/ければ/なら)", correctAnswer: "ければ", rationale: "安い (barato) + ければ = se for barato. Condicional ～ば de adjetivo-い: substitui -い por -ければ.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "家に帰っ___手を洗います。 [condicional たら] (たら/ば/と/なら)", correctAnswer: "たら", rationale: "帰った + ら = 帰ったら (quando chegar em casa). ～たら para sequência temporal.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "春になる___桜が咲く。 [condicional と] (なら/たら/ば/と)", correctAnswer: "と", rationale: "春になると = quando vira primavera. ～と para resultado natural/automático.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本に行く___富士山に登れ。 [condicional なら] (たら/と/ば/なら)", correctAnswer: "なら", rationale: "日本に行くなら = se for ao Japão (contextual). ～なら para conselho baseado em contexto.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友達に本をあげ___。 (ました/もらいました/くれました/させました)", correctAnswer: "ました", rationale: "友達にあげる = eu dou ao amigo. あげる: eu → outro. Forma passada: あげました.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生が本をくれ___。 (あげました/ました/もらいました/させました)", correctAnswer: "ました", rationale: "先生がくれる = o professor dá a mim. くれる: outro → eu. Forma passada: くれました.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語が話せ___。 (る/た/られる/ます)", correctAnswer: "ます", rationale: "話せます = consigo falar. 話す → 話せる (potencial) → 話せます (polido).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生に叱られ___。 (ました/あげました/もらいました/させました)", correctAnswer: "ました", rationale: "叱られる = ser repreendido. Voz passiva. Forma passada polida: 叱られました.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "母は子供に野菜を食べさせ___。 (ました/られました/もらいました/あげました)", correctAnswer: "ました", rationale: "食べさせる = fazer comer. Causativa. Forma passada polida: 食べさせました.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "雨が降っている___だ。 (そう/みたい/らしい/よう)", correctAnswer: "よう", rationale: "～ているようだ = parece que está fazendo (observação direta). ようだ para evidência visual.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Revisão — gramática D (parte 2)
    description: Escolha a opção correta ou a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "天気予報によると雨が降る___です。 [relato] (ようだ/みたいだ/らしい/そう)", correctAnswer: "そう", rationale: "天気予報によると + 降るそうです = ouvi/segundo o boletim vai chover. そうだ para relato.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "田中さんは来月結婚する___です。 [inferência subjetiva] (ようだ/そう/らしい/みたいだ)", correctAnswer: "らしい", rationale: "結婚するらしいです = parece que vai se casar (relato subjetivo/inferência). らしい para relato.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "犬より猫の方が___。 (pequeno/mais bonito/bonito/grande)", correctAnswer: "mais bonito", rationale: "犬より猫の方が = gatos são mais (do que cães). の方が indica superioridade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "音楽を聞き___勉強する。 (あいだ/ながら/たら/と)", correctAnswer: "ながら", rationale: "聞きながら勉強する = estudar ouvindo música. ～ながら para ações simultâneas.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "寝ている___に電話が来た。 (と/ながら/あいだ/たら)", correctAnswer: "あいだ", rationale: "寝ている間に = enquanto dormia (evento pontual). 間に para evento dentro de período.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もっと練習して___です。 [quero que pratique] (ほしい/あげる/もらう/くれる)", correctAnswer: "ほしい", rationale: "練習してほしい = quero que pratique. ～てほしい para expressar desejo de que outro aja.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電車より歩いた方が___。 (長い/遅い/速い/高い)", correctAnswer: "速い", rationale: "電車より歩いた方が速い = a pé é mais rápido que de trem. Comparação より + の方が.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生が漢字を教えてくれ___。 (あげました/もらいました/ました/させました)", correctAnswer: "ました", rationale: "教えてくれる = o professor faz o favor de me ensinar. Forma passada: 教えてくれました.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "勉強すれば___できる。 (もっと/いつも/きっと/ちょっと)", correctAnswer: "きっと", rationale: "勉強すれば + きっとできる = se estudar, com certeza conseguirá. きっと = com certeza.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この映画は___なくても見られます。 (お金が/本が/車が/時間が)", correctAnswer: "お金が", rationale: "お金がなくても見られます = pode ver mesmo sem dinheiro (streaming grátis). 見られる = potencial.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
