title: 📝 ～ながら — fazendo ao mesmo tempo
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～ながら indica duas ações simultâneas pelo mesmo sujeito. A ação secundária (ながら) é background; a principal vem depois. Ex.: 音楽を聞きながら勉強する."
example: "音楽を聞きながら勉強する。 Ex.: ～ながら → 'fazendo X ao mesmo tempo que Y'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Formação e usos de ～ながら
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "聞きながら (enquanto ouve/depois de ouvir/antes de ouvir/para ouvir)", correctAnswer: "enquanto ouve", rationale: "聞き (forma ます de 聞く) + ながら → enquanto ouve. ながら: ação simultânea.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べながら (depois de comer/enquanto come/antes de comer/para comer)", correctAnswer: "enquanto come", rationale: "食べ (forma ます de 食べる) + ながら → enquanto come.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "歩きながら (para andar/antes de andar/depois de andar/enquanto anda)", correctAnswer: "enquanto anda", rationale: "歩き (forma ます de 歩く) + ながら → enquanto anda.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "音楽を聞きながら勉強する。 (Estudo para depois ouvir música./Antes de ouvir música, estudo./Depois de ouvir música, estudo./Estudo ouvindo música ao mesmo tempo.)", correctAnswer: "Estudo ouvindo música ao mesmo tempo.", rationale: "音楽を聞きながら (enquanto ouve música) + 勉強する (estuda) → estuda enquanto ouve música.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "テレビを見ながら食べる。 (Come antes de ver TV./Come depois de ver TV./Come ao mesmo tempo que assiste TV./Assiste TV para comer melhor.)", correctAnswer: "Come ao mesmo tempo que assiste TV.", rationale: "テレビを見ながら (enquanto vê TV) + 食べる (come). Duas ações simultâneas.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "歩きながら電話する。 (Telefona para poder andar./Telefona e depois anda./Anda ao mesmo tempo que telefona./Telefona antes de andar.)", correctAnswer: "Anda ao mesmo tempo que telefona.", rationale: "歩きながら (enquanto anda) + 電話する (telefonar). ながら: ação de fundo + principal.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "笑いながら話す。 (Fala antes de rir./Fala depois de rir./Fala sorrindo ao mesmo tempo./Ri para falar melhor.)", correctAnswer: "Fala sorrindo ao mesmo tempo.", rationale: "笑いながら (enquanto ri) + 話す (fala). Ação simultânea com ながら.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "働きながら勉強する。 (Estuda antes de trabalhar./Estuda depois de trabalhar./Trabalha e estuda ao mesmo tempo./Estuda para trabalhar depois.)", correctAnswer: "Trabalha e estuda ao mesmo tempo.", rationale: "働きながら (enquanto trabalha) + 勉強する (estuda). Ações paralelas.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "泣きながら話した。 (Falou antes de chorar./Falou depois de chorar./Falou chorando ao mesmo tempo./Chorou para falar melhor.)", correctAnswer: "Falou chorando ao mesmo tempo.", rationale: "泣きながら (enquanto chorava) + 話した (falou). Emoção simultânea.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考えながら書く。 (Escreve antes de pensar./Escreve depois de pensar./Escreve pensando ao mesmo tempo./Pensa para escrever depois.)", correctAnswer: "Escreve pensando ao mesmo tempo.", rationale: "考えながら (enquanto pensa) + 書く (escreve). Processo simultâneo.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～ながら
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "音楽を聞きながら料理しています。 (Cozinha antes de ouvir música./Cozinha depois de ouvir música./Está cozinhando enquanto ouve música./Ouve música para cozinhar melhor.)", correctAnswer: "Está cozinhando enquanto ouve música.", rationale: "音楽を聞きながら (enquanto ouve música) + 料理しています (está cozinhando).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "歩きながら本を読むのは危ない。 (É perigoso ler um livro antes de andar./É perigoso andar depois de ler./Ler um livro enquanto anda é perigoso./É seguro ler andando.)", correctAnswer: "Ler um livro enquanto anda é perigoso.", rationale: "歩きながら本を読む (ler andando) + のは危ない (é perigoso).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "アルバイトをしながら大学に通っています。 (Frequenta a universidade e depois trabalha./Frequenta a universidade antes de trabalhar./Trabalha meio período enquanto frequenta a universidade./Trabalha para frequentar a universidade depois.)", correctAnswer: "Trabalha meio período enquanto frequenta a universidade.", rationale: "アルバイトをしながら (enquanto trabalha meio período) + 大学に通っています (frequenta a universidade).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "申し訳ありませんが、~しながら聞いてもいいですか。 (Posso fazer outra coisa enquanto ouço?/Posso ouvir sem fazer nada?/Preciso parar tudo para ouvir?/Posso sair enquanto você fala?)", correctAnswer: "Posso fazer outra coisa enquanto ouço?", rationale: "～しながら聞いてもいいですか → posso ouvir enquanto faço (outra coisa)? ながら em pergunta de permissão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "泣きながら「ごめんなさい」と言った。 (Disse 'desculpe' e depois chorou./Disse 'desculpe' antes de chorar./Disse 'desculpe' chorando ao mesmo tempo./Chorou para dizer 'desculpe'.)", correctAnswer: "Disse 'desculpe' chorando ao mesmo tempo.", rationale: "泣きながら (enquanto chorava) + 「ごめんなさい」と言った (disse 'desculpe').", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "スマホを見ながら食事するのはマナー違反です。 (Comer olhando o celular é má educação./Comer antes de ver o celular é má educação./Ver o celular depois de comer é má educação./Usar o celular à mesa é recomendado.)", correctAnswer: "Comer olhando o celular é má educação.", rationale: "スマホを見ながら食事する (comer vendo o celular) + マナー違反です (é má educação).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は働きながら日本語を学んでいます。 (Ele aprende japonês antes de trabalhar./Ele aprende japonês depois de trabalhar./Ele aprende japonês enquanto trabalha./Ele trabalha para aprender japonês depois.)", correctAnswer: "Ele aprende japonês enquanto trabalha.", rationale: "働きながら (enquanto trabalha) + 日本語を学んでいます (está aprendendo japonês).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "コーヒーを飲みながら話しましょう。 (Vamos falar antes de tomar café./Vamos falar depois de tomar café./Vamos conversar tomando café ao mesmo tempo./Vamos tomar café para conversar depois.)", correctAnswer: "Vamos conversar tomando café ao mesmo tempo.", rationale: "コーヒーを飲みながら (enquanto toma café) + 話しましょう (vamos conversar).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ラジオを聞きながら運転しています。 (Dirige antes de ouvir rádio./Dirige depois de ouvir rádio./Está dirigindo enquanto ouve rádio./Ouve rádio para dirigir melhor.)", correctAnswer: "Está dirigindo enquanto ouve rádio.", rationale: "ラジオを聞きながら (enquanto ouve rádio) + 運転しています (está dirigindo).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語は難しいながらも楽しい。 (O japonês é difícil e por isso é chato./O japonês é difícil, mas ao mesmo tempo é divertido./O japonês é fácil e divertido./O japonês é difícil e não tem como aprender.)", correctAnswer: "O japonês é difícil, mas ao mesmo tempo é divertido.", rationale: "難しいながらも (apesar de difícil / sendo difícil ao mesmo tempo) + 楽しい. ながらも → embora.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
