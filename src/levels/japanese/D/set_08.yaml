title: 📝 Voz passiva — 食べられた 叱られた
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "A voz passiva indica que o sujeito sofre uma ação. Grupo 1: -u → -areru. Grupo 2: -ru → -rareru. Irregulares: される (ser feito), 来られる (ser afetado por vir)."
example: "先生に叱られた。 Ex.: ～られる/～areru → voz passiva 'foi feito/sofreu ação'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Formação da voz passiva
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "食べられた (foi comido/foi bebido/foi lido/foi escrito)", correctAnswer: "foi comido", rationale: "食べる (comer) → 食べられる (ser comido) → 食べられた (foi comido). Grupo 2.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "叱られた (foi elogiado/foi ignorado/foi repreendido/foi ajudado)", correctAnswer: "foi repreendido", rationale: "叱る (repreender) → 叱られる (ser repreendido) → 叱られた (foi repreendido). Grupo 1.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "される (ser feito/ser visto/ser comido/ser lido)", correctAnswer: "ser feito", rationale: "する (fazer) → される (ser feito). Passiva irregular de する.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "読まれる (ser escrito/ser ouvido/ser falado/ser lido)", correctAnswer: "ser lido", rationale: "読む (ler) → 読まれる (ser lido). Grupo 1: substitui -む por -まれる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "褒められた (foi criticado/foi ignorado/foi elogiado/foi repreendido)", correctAnswer: "foi elogiado", rationale: "褒める (elogiar) → 褒められる (ser elogiado) → 褒められた (foi elogiado).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "盗まれた (foi comprado/foi encontrado/foi roubado/foi emprestado)", correctAnswer: "foi roubado", rationale: "盗む (roubar) → 盗まれる (ser roubado) → 盗まれた (foi roubado).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "押される (ser puxado/ser girado/ser empurrado/ser solto)", correctAnswer: "ser empurrado", rationale: "押す (empurrar) → 押される (ser empurrado). Grupo 1: -す → -される.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "見られた (foi ouvido/foi falado/foi visto/foi escrito)", correctAnswer: "foi visto", rationale: "見る (ver) → 見られる (ser visto) → 見られた (foi visto). Grupo 2.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書かれた (foi lido/foi ouvido/foi falado/foi escrito)", correctAnswer: "foi escrito", rationale: "書く (escrever) → 書かれる (ser escrito) → 書かれた (foi escrito). Grupo 1.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "壊された (foi consertado/foi encontrado/foi destruído/foi guardado)", correctAnswer: "foi destruído", rationale: "壊す (destruir) → 壊される (ser destruído) → 壊された (foi destruído).", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases na voz passiva
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "先生に叱られました。 (Elogiei o professor./O professor me elogiou./O professor me repreendeu./Repreendi o professor.)", correctAnswer: "O professor me repreendeu.", rationale: "先生に (pelo professor) + 叱られました (fui repreendido). に indica o agente na passiva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この本は有名な作家に書かれました。 (Este livro foi lido por um escritor famoso./Este livro foi comprado por um escritor famoso./Este livro foi escrito por um escritor famoso./Este livro foi vendido por um escritor famoso.)", correctAnswer: "Este livro foi escrito por um escritor famoso.", rationale: "この本は (este livro) + 有名な作家に (por um escritor famoso) + 書かれました (foi escrito).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "財布を盗まれました。 (Roubei uma carteira./Comprei uma carteira./Minha carteira foi roubada./Perdi uma carteira.)", correctAnswer: "Minha carteira foi roubada.", rationale: "財布を (a carteira) + 盗まれました (foi roubada). Passiva de dano/sofrimento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "母に褒められました。 (Repreendi minha mãe./Minha mãe me repreendeu./Minha mãe me elogiou./Elogiei minha mãe.)", correctAnswer: "Minha mãe me elogiou.", rationale: "母に (pela mãe) + 褒められました (fui elogiado). Passiva com benefício.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "雨に降られた。 (Fui afetado pelo sol./Fui afetado pela chuva./Fui afetado pelo vento./Fui afetado pela neve.)", correctAnswer: "Fui afetado pela chuva.", rationale: "雨に降られた = fui afetado pela chuva (choveu sobre mim). Passiva de dano.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この写真は田中さんに撮られました。 (Esta foto foi tirada pelo Tanaka./Esta foto foi comprada pelo Tanaka./Esta foto foi vista pelo Tanaka./Esta foto foi vendida pelo Tanaka.)", correctAnswer: "Esta foto foi tirada pelo Tanaka.", rationale: "この写真は (esta foto) + 田中さんに (pelo Tanaka) + 撮られました (foi tirada).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供に泣かれた。 (A criança sorriu para mim./Fiz a criança chorar./A criança chorou e me incomodou./A criança me fez chorar.)", correctAnswer: "A criança chorou e me incomodou.", rationale: "子供に泣かれた = passiva de dano: a criança chorou e isso me afetou/incomodou.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このルールは守られなかった。 (Esta regra foi cumprida./Esta regra foi criada./Esta regra foi quebrada./Esta regra foi explicada.)", correctAnswer: "Esta regra foi quebrada.", rationale: "このルールは (esta regra) + 守られなかった (não foi cumprida/foi quebrada). 守る → 守られる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友達に笑われた。 (Meu amigo me consolou./Meu amigo me ajudou./Meu amigo riu de mim./Meu amigo me ignorou.)", correctAnswer: "Meu amigo riu de mim.", rationale: "友達に (pelo amigo) + 笑われた (fui ridicularizado/o amigo riu de mim). Passiva de dano.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語はアジアで話されています。 (O japonês é falado na Ásia./O japonês é ensinado na Ásia./O japonês é escrito na Ásia./O japonês é lido na Ásia.)", correctAnswer: "O japonês é falado na Ásia.", rationale: "日本語は (o japonês) + アジアで (na Ásia) + 話されています (é falado). Passiva de fato geral.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
