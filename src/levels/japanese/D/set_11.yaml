title: 🔢 Kanji N4 — 駅電車道 (transporte)
level: 'D'
subject: japanese
objectives: [japanese.kanji]
difficulty: 4
authorNotes: "Kanji de transporte N4: 駅 (estação), 電 (eletricidade), 車 (carro/veículo), 道 (caminho/estrada), 乗 (embarcar), 降 (desembarcar), 地 (terra), 鉄 (ferro)."
example: "電車に乗る = embarcar no trem. Ex.: 駅電車道 → kanji de transporte e deslocamento."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Kanji de transporte — leitura
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "駅 (aeroporto/estação/porto/terminal)", correctAnswer: "estação", rationale: "駅 (えき) = estação (de trem/metrô). Ex.: 東京駅 (Estação de Tóquio), 駅まで (até a estação).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "電車 (metrô/ônibus/trem elétrico/trem a vapor)", correctAnswer: "trem elétrico", rationale: "電 (eletricidade) + 車 (veículo) = 電車 (でんしゃ) = trem elétrico.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "道 (trem/carro/caminho/estação)", correctAnswer: "caminho", rationale: "道 (みち) = caminho/estrada/rua. Ex.: この道 (este caminho), 道に迷う (se perder no caminho).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "地下鉄 (trem/ônibus/bonde/metrô)", correctAnswer: "metrô", rationale: "地下 (embaixo da terra) + 鉄 (ferro) = 地下鉄 (ちかてつ) = metrô.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "乗る (desembarcar/embarcar/correr/estacionar)", correctAnswer: "embarcar", rationale: "乗る (のる) = embarcar/pegar (transporte). Ex.: バスに乗る (pegar o ônibus).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "降りる (embarcar/correr/desembarcar/estacionar)", correctAnswer: "desembarcar", rationale: "降りる (おりる) = desembarcar/descer. Ex.: 次の駅で降りる (desembarcar na próxima estação).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "自転車 (moto/bicicleta/carro/caminhão)", correctAnswer: "bicicleta", rationale: "自 (si mesmo) + 転 (girar) + 車 (veículo) = 自転車 (じてんしゃ) = bicicleta.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "道路 (ferrovia/pista aérea/rua/trilho)", correctAnswer: "rua", rationale: "道 (caminho) + 路 (via) = 道路 (どうろ) = rua/estrada/via pública.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "終電 (primeiro trem/trem expresso/último trem/trem lento)", correctAnswer: "último trem", rationale: "終 (fim) + 電 (trem elétrico) = 終電 (しゅうでん) = último trem do dia.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "近道 (caminho longo/atalho/estrada principal/rua sem saída)", correctAnswer: "atalho", rationale: "近 (perto) + 道 (caminho) = 近道 (ちかみち) = atalho.", difficulty: 3, objectives: [japanese.kanji] }
  - pageNumber: 2
    title: Kanji de transporte — frases
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "電車で駅まで行きます。 (Vou de ônibus até a estação./Vou de trem até a estação./Vou a pé até a estação./Vou de carro até a estação.)", correctAnswer: "Vou de trem até a estação.", rationale: "電車で (de trem) + 駅まで (até a estação) + 行きます (vou).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "次の駅で降ります。 (Embarco na próxima estação./Desembarco na estação passada./Desembarco na próxima estação./Passo pela próxima estação.)", correctAnswer: "Desembarco na próxima estação.", rationale: "次の駅で (na próxima estação) + 降ります (desembarco).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "地下鉄に乗って会社へ行きます。 (Vou de ônibus para o trabalho./Vou a pé para o trabalho./Vou de metrô para o trabalho./Vou de trem para o trabalho.)", correctAnswer: "Vou de metrô para o trabalho.", rationale: "地下鉄に乗って (pegando o metrô) + 会社へ行きます (vou para o trabalho).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "この道をまっすぐ行くと駅があります。 (Se virar à direita, há uma estação./Se for em frente por este caminho, há uma estação./Se virar à esquerda, há uma estação./Se voltar, há uma estação.)", correctAnswer: "Se for em frente por este caminho, há uma estação.", rationale: "この道をまっすぐ行くと (se for em frente por este caminho) + 駅があります (há uma estação).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "自転車で学校へ行きます。 (Vou de carro para a escola./Vou de ônibus para a escola./Vou a pé para a escola./Vou de bicicleta para a escola.)", correctAnswer: "Vou de bicicleta para a escola.", rationale: "自転車で (de bicicleta) + 学校へ行きます (vou para a escola).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "終電に乗り遅れた。 (Peguei o primeiro trem./Perdi o último trem./Peguei o último trem./Perdi o primeiro trem.)", correctAnswer: "Perdi o último trem.", rationale: "終電に (o último trem) + 乗り遅れた (perdi/cheguei tarde demais). 乗り遅れる = perder o transporte.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "駅の近くに住んでいます。 (Moro longe da estação./Moro perto do aeroporto./Moro perto da estação./Moro perto da rodoviária.)", correctAnswer: "Moro perto da estação.", rationale: "駅の近くに (perto da estação) + 住んでいます (moro).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "道に迷ってしまいました。 (Cheguei no destino./Me perdi no caminho./Encontrei o caminho./Tomei um atalho.)", correctAnswer: "Me perdi no caminho.", rationale: "道に迷って (se perder no caminho) + しまいました (acabei fazendo). 迷う = se perder.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "電車の中でスマホを使います。 (Uso o celular no aeroporto./Uso o celular no ônibus./Uso o celular dentro do trem./Não uso celular no trem.)", correctAnswer: "Uso o celular dentro do trem.", rationale: "電車の中で (dentro do trem) + スマホを使います (uso o celular).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "近道を通りましょう。 (Vamos pela estrada principal./Vamos pelo caminho longo./Vamos pelo atalho./Vamos pela rua sem saída.)", correctAnswer: "Vamos pelo atalho.", rationale: "近道を (pelo atalho) + 通りましょう (vamos passar/tomar). 近道 = atalho.", difficulty: 4, objectives: [japanese.kanji] }
target: 20
