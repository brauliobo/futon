title: 💬 Formas de dar — てあげる てもらう てくれる
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "Combinando a forma-て com あげる/もらう/くれる, expressa-se quem faz um favor e em qual direção: てあげる (faço favor a outro), てもらう (peço favor), てくれる (outro faz favor a mim)."
example: "手伝ってあげます。 Ex.: てあげる → fazer favor a outro; てもらう → pedir favor; てくれる → outro faz favor a mim."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Significados de てあげる、てもらう、てくれる
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "手伝ってあげる (receber ajuda/pedir ajuda/outro me ajuda/ajudar alguém)", correctAnswer: "ajudar alguém", rationale: "Regra: て形 + あげる → eu faço favor a outro (eu→outro). 手伝って → あげる = ofereço ajuda.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "手伝ってもらう (eu ajudo outro/pedir que me ajudem/outro me ajuda sem pedir/recusar ajuda)", correctAnswer: "pedir que me ajudem", rationale: "Regra: て形 + もらう → eu recebo/peço favor de outro (outro→eu, iniciativa minha). 手伝って → もらう = peço ajuda.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "手伝ってくれる (outro me ajuda/eu ajudo outro/pedir ajuda/recusar ajuda)", correctAnswer: "outro me ajuda", rationale: "Regra: て形 + くれる → outro faz favor a mim espontaneamente (outro→eu). 手伝って → くれる = recebo benefício.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "教えてあげる (outro me ensina/ser ensinado/pedir para ensinar/ensinar alguém)", correctAnswer: "ensinar alguém", rationale: "Regra: て形 + あげる → eu faço favor a outro. 教える(ensinar) → 教えて → あげる = eu ensino para beneficiar outro.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "教えてもらう (ensinar alguém/ser ensinado/outro me ensina sem pedir/recusar ser ensinado)", correctAnswer: "ser ensinado", rationale: "Regra: て形 + もらう → eu solicito/recebo favor. 教えて → もらう = peço para ser ensinado → recebo o benefício.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "教えてくれる (eu ensino/pedir para ensinar/outro me ensina/recusar ensinar)", correctAnswer: "outro me ensina", rationale: "Regra: て形 + くれる → outro age em meu benefício. 教えて → くれる = outro ensina para mim (gratidão implícita).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "買ってあげる (receber de presente/pedir que comprem/comprar para alguém/alguém compra para mim)", correctAnswer: "comprar para alguém", rationale: "Regra: て形 + あげる → eu→outro. 買う(comprar) → 買って → あげる = compro como favor para outra pessoa.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "買ってもらう (comprar para alguém/alguém compra para mim por iniciativa/pedir que comprem para mim/recusar compra)", correctAnswer: "pedir que comprem para mim", rationale: "Regra: て形 + もらう → eu solicito (outro→eu, minha iniciativa). 買って → もらう = peço que comprem para mim.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "買ってくれる (pedir que comprem/eu compro para outro/alguém compra para mim por iniciativa/recusar compra)", correctAnswer: "alguém compra para mim por iniciativa", rationale: "Regra: て形 + くれる → outro→eu espontaneamente. 買って → くれる = outro compra para mim sem eu pedir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "読んでくれる (eu leio para outro/pedir para ler/outro lê para mim/recusar ler)", correctAnswer: "outro lê para mim", rationale: "Regra: て形 + くれる → outro→eu. 読む(ler) → 読んで → くれる = outro faz favor de ler para mim.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com てあげる、てもらう、てくれる
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "荷物を持ってあげました。 (Pedi para carregar a bagagem./Outro me ajudou com a bagagem./Carreguei a bagagem de alguém./Recusei carregar a bagagem.)", correctAnswer: "Carreguei a bagagem de alguém.", rationale: "荷物(bagagem) + 持って → あげました = eu→outro. Sujeito é quem faz o favor.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友達に宿題を手伝ってもらいました。 (Ajudei meu amigo no dever./Meu amigo me ajudou no dever por conta própria./Pedi ao meu amigo para me ajudar no dever./Recusei ajuda do amigo.)", correctAnswer: "Pedi ao meu amigo para me ajudar no dever.", rationale: "友達に + 手伝って → もらいました = eu solicitei o favor. に marca quem dá o favor em もらう.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "田中さんが道を教えてくれました。 (Pedi ao Tanaka a direção./Ensinei a direção ao Tanaka./O Tanaka me ensinou a direção./Recusei a direção do Tanaka.)", correctAnswer: "O Tanaka me ensinou a direção.", rationale: "田中さんが(sujeito) + 教えて → くれました = outro→eu. が marca quem age em meu benefício.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供に絵本を読んであげました。 (A criança leu para mim./Pedi à criança que lesse./Li o livro ilustrado para a criança./A criança leu o livro sozinha.)", correctAnswer: "Li o livro ilustrado para a criança.", rationale: "子供に + 絵本を読んで → あげました = eu→criança. に marca o beneficiário em あげる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "母に料理を作ってもらいました。 (Fiz comida para minha mãe./Pedi à minha mãe que fizesse comida./Minha mãe fez comida para mim sem eu pedir./Recusei comida da minha mãe.)", correctAnswer: "Pedi à minha mãe que fizesse comida.", rationale: "母に + 作って → もらいました = eu solicitei. もらう = eu recebo favor → destaca minha iniciativa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生が漢字を教えてくれました。 (Ensinei kanji ao professor./O professor me pediu para ensinar./O professor me ensinou kanji./Recusei aprender kanji.)", correctAnswer: "O professor me ensinou kanji.", rationale: "先生(professor) + 漢字(kanji) + 教えて → くれました = professor→eu. くれる = outro→eu espontâneo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友達に写真を撮ってあげました。 (O amigo tirou minha foto./Pedi ao amigo para tirar foto./Tirei fotos para o amigo./Recusei tirar foto para o amigo.)", correctAnswer: "Tirei fotos para o amigo.", rationale: "写真(foto) + 撮って → あげました = eu→amigo. Eu sou sujeito + あげる = eu faço o favor.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "駅まで送ってくれましたか。 (Você me pediu para levar à estação?/Você levou alguém à estação?/Alguém te levou à estação?/Você recusou ir à estação?)", correctAnswer: "Alguém te levou à estação?", rationale: "駅(estação) + 送って → くれましたか = outro→eu/você? くれる em pergunta = agradecimento pela ação de outro.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "医者に診てもらいました。 (Examinei o médico./O médico me examinou por conta própria./Fui examinado pelo médico./Recusei ser examinado.)", correctAnswer: "Fui examinado pelo médico.", rationale: "医者(médico) + 診て → もらいました = eu recebi exame. もらう = eu solicito/recebo o favor de outro.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "弟に本を貸してあげました。 (Meu irmão me emprestou um livro./Pedi ao meu irmão um livro./Emprestei um livro ao meu irmão mais novo./Recusei emprestar um livro.)", correctAnswer: "Emprestei um livro ao meu irmão mais novo.", rationale: "弟(irmão mais novo) + 本(livro) + 貸して → あげました = eu→irmão. あげる = eu faço favor a inferior/próximo.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
