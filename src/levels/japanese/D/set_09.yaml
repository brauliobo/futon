title: 📝 Voz causativa — 食べさせる 行かせる
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "A causativa indica que alguém faz/permite que outro faça algo. Grupo 1: -u → -aseru. Grupo 2: -ru → -saseru. Irregulares: させる (fazer/deixar fazer), 来させる."
example: "子供に野菜を食べさせた。 Ex.: ～させる → causativa 'fazer/deixar alguém fazer'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Formação da causativa
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "食べさせる (fazer/deixar comer/fazer/deixar beber/fazer/deixar dormir/fazer/deixar ler)", correctAnswer: "fazer/deixar comer", rationale: "食べる (comer) → 食べさせる (fazer/deixar comer). Grupo 2: -る → -させる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行かせる (fazer/deixar ir/fazer/deixar vir/fazer/deixar ficar/fazer/deixar voltar)", correctAnswer: "fazer/deixar ir", rationale: "行く (ir) → 行かせる (fazer/deixar ir). Grupo 1: -く → -かせる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "させる (fazer/deixar fazer/fazer/deixar ver/fazer/deixar ir/fazer/deixar vir)", correctAnswer: "fazer/deixar fazer", rationale: "する (fazer) → させる (fazer/deixar fazer). Causativa irregular de する.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "飲ませる (fazer/deixar comer/fazer/deixar dormir/fazer/deixar beber/fazer/deixar correr)", correctAnswer: "fazer/deixar beber", rationale: "飲む (beber) → 飲ませる (fazer/deixar beber). Grupo 1: -む → -ませる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "話させる (fazer/deixar escrever/fazer/deixar ler/fazer/deixar falar/fazer/deixar ouvir)", correctAnswer: "fazer/deixar falar", rationale: "話す (falar) → 話させる (fazer/deixar falar). Grupo 1: -す → -させる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来させる (fazer/deixar ir/fazer/deixar voltar/fazer/deixar ficar/fazer/deixar vir)", correctAnswer: "fazer/deixar vir", rationale: "来る (vir) → 来させる (fazer/deixar vir). Causativa irregular de 来る.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "読ませる (fazer/deixar escrever/fazer/deixar falar/fazer/deixar ler/fazer/deixar ouvir)", correctAnswer: "fazer/deixar ler", rationale: "読む (ler) → 読ませる (fazer/deixar ler). Grupo 1: -む → -ませる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "泣かせる (fazer/deixar rir/fazer/deixar chorar/fazer/deixar dormir/fazer/deixar cantar)", correctAnswer: "fazer/deixar chorar", rationale: "泣く (chorar) → 泣かせる (fazer chorar). Grupo 1: -く → -かせる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "起こさせる (fazer/deixar dormir/fazer/deixar descansar/fazer/deixar acordar outro/fazer/deixar correr)", correctAnswer: "fazer/deixar acordar outro", rationale: "起こす (acordar alguém) → 起こさせる. Grupo 1: -す → -させる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書かせる (fazer/deixar escrever/fazer/deixar ler/fazer/deixar falar/fazer/deixar ouvir)", correctAnswer: "fazer/deixar escrever", rationale: "書く (escrever) → 書かせる (fazer/deixar escrever). Grupo 1: -く → -かせる.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com causativa
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "母は子供に野菜を食べさせました。 (A mãe comeu os legumes das crianças./A criança fez a mãe comer legumes./A mãe fez a criança comer legumes./A mãe deixou a criança não comer legumes.)", correctAnswer: "A mãe fez a criança comer legumes.", rationale: "母は (a mãe) + 子供に (à criança) + 野菜を食べさせました (fez comer legumes). に marca quem executa a ação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生は生徒に本を読ませました。 (Os alunos fizeram o professor ler./O professor deixou os alunos ler o livro./Os alunos leram e o professor viu./O professor não deixou os alunos ler.)", correctAnswer: "O professor deixou os alunos ler o livro.", rationale: "先生は (o professor) + 生徒に (aos alunos) + 本を読ませました (fez/deixou ler o livro).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "部長は私を残業させました。 (Eu fiz o chefe fazer hora extra./O chefe me deixou sair cedo./O chefe me fez fazer hora extra./Eu fiz hora extra voluntariamente.)", correctAnswer: "O chefe me fez fazer hora extra.", rationale: "部長は (o chefe) + 私を (a mim) + 残業させました (fez fazer hora extra). を marca quem é forçado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "親は子供を外で遊ばせた。 (A criança não deixou os pais saírem./Os pais fizeram a criança brincar lá fora./Os pais brincaram com a criança./A criança brincou sozinha.)", correctAnswer: "Os pais fizeram a criança brincar lá fora.", rationale: "親は (os pais) + 子供を (à criança) + 外で遊ばせた (fez brincar lá fora).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女を泣かせてしまった。 (Ela me fez chorar./Pedi a ela que não chorasse./Acabei fazendo ela chorar./Ela chorou voluntariamente.)", correctAnswer: "Acabei fazendo ela chorar.", rationale: "彼女を (ela) + 泣かせてしまった (acabei fazendo chorar). ～てしまう = involuntário/lamentável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供に好きな服を着させました。 (A criança não escolheu a roupa./Não deixei a criança escolher a roupa./Deixei a criança usar a roupa que gosta./Comprei roupa para a criança.)", correctAnswer: "Deixei a criança usar a roupa que gosta.", rationale: "子供に (à criança) + 好きな服を (roupa que gosta) + 着させました (deixei usar). Sentido permissivo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社長は社員を出張させた。 (Os funcionários mandaram o presidente em viagem./O presidente mandou os funcionários em viagem./Os funcionários viajaram por conta própria./O presidente viajou sozinho.)", correctAnswer: "O presidente mandou os funcionários em viagem.", rationale: "社長は (o presidente) + 社員を (os funcionários) + 出張させた (mandou em viagem de negócios).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生が私に発表させました。 (Eu fiz o professor apresentar./O professor me deixou apresentar./O professor apresentou por mim./Recusei apresentar.)", correctAnswer: "O professor me deixou apresentar.", rationale: "先生が (o professor) + 私に (a mim) + 発表させました (fez/deixou apresentar).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "薬を飲ませました。 (Fui forçado a tomar o remédio./O remédio foi tomado./Fiz/deixei tomar o remédio./Recusei o remédio.)", correctAnswer: "Fiz/deixei tomar o remédio.", rationale: "薬を (o remédio) + 飲ませました (fiz/deixei tomar). Sujeito implícito faz alguém tomar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もっと練習させてください。 (Por favor, não me deixe praticar mais./Por favor, deixe-me praticar mais./Por favor, faça-me parar de praticar./Por favor, pratique mais.)", correctAnswer: "Por favor, deixe-me praticar mais.", rationale: "もっと練習させてください = por favor, deixe-me praticar mais. Causativa + ください como pedido.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
