title: 💬 Pedido indireto — ～てほしい / ～てもらいたい
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～てほしい = querer que alguém faça algo (pedido/desejo). ～てもらいたい = querer receber o favor de alguém. Ambos expressam desejo de que outro execute a ação."
example: "もっと勉強してほしい。 Ex.: ～てほしい → 'quero que você faça'; ～てもらいたい → pedido mais formal."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Significados de ～てほしい e ～てもらいたい
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "来てほしい (quero que eu venha/quero que você venha/quero vir/quero que você vá)", correctAnswer: "quero que você venha", rationale: "来て (forma-て de 来る) + ほしい → quero que você venha. ほしい após てforma expressa desejo de que outro aja.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "手伝ってほしい (quero te ajudar/quero que me ajudes/quero ser ajudado sem pedir/quero ajudar outra pessoa)", correctAnswer: "quero que me ajudes", rationale: "手伝って (forma-て de 手伝う) + ほしい → quero que você me ajude.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "静かにしてほしい (quero fazer barulho/quero que fique quieto/quero ficar quieto/quero que saia)", correctAnswer: "quero que fique quieto", rationale: "静かにして (forma-て de 静かにする) + ほしい → quero que fique quieto.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "教えてもらいたい (quero ensinar/quero que me ensinem/quero ser ignorado/quero ignorar)", correctAnswer: "quero que me ensinem", rationale: "教えて + もらいたい → quero receber o favor de ser ensinado. Mais formal que ほしい.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もっと練習してほしい (quero praticar mais/quero que pratique mais/quero parar de praticar/quero que pare de praticar)", correctAnswer: "quero que pratique mais", rationale: "もっと練習して (praticar mais) + ほしい → quero que você pratique mais.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "分かってほしい (quero que entenda/quero entender/quero que não entenda/quero confundir)", correctAnswer: "quero que entenda", rationale: "分かって (forma-て de 分かる) + ほしい → quero que entenda/compreenda.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "連絡してもらいたい (quero me contatar/quero que entre em contato comigo/quero ignorar contato/quero contatar outro)", correctAnswer: "quero que entre em contato comigo", rationale: "連絡して + もらいたい → quero receber o favor de ser contatado.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "正直に話してほしい (quero que minta/quero que fale com honestidade/quero falar honestamente/quero escutar honestamente)", correctAnswer: "quero que fale com honestidade", rationale: "正直に話して (falar com honestidade) + ほしい → quero que fale honestamente.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "早く来てほしい (quero que chegue tarde/quero que chegue cedo/quero chegar cedo/quero sair cedo)", correctAnswer: "quero que chegue cedo", rationale: "早く来て (chegar cedo) + ほしい → quero que chegue/venha cedo.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "確認してもらいたい (quero confirmar/quero que confirme para mim/quero cancelar/quero que cancele)", correctAnswer: "quero que confirme para mim", rationale: "確認して + もらいたい → quero receber o favor de ter algo confirmado.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～てほしい e ～てもらいたい
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "もっと勉強してほしいです。 (Quero estudar mais./Quero que você estude mais./Você precisa estudar mais agora./Você estudou mais.)", correctAnswer: "Quero que você estude mais.", rationale: "もっと勉強して (estudar mais) + ほしいです (quero que). Desejo expresso ao interlocutor.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "早く帰ってきてほしい。 (Quero voltar cedo./Você voltou cedo./Quero que você volte cedo./Você precisa sair cedo.)", correctAnswer: "Quero que você volte cedo.", rationale: "早く帰ってきて (voltar cedo) + ほしい → quero que você volte cedo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このことは内緒にしてほしい。 (Quero que isso seja um segredo./Posso contar um segredo?/Quero contar um segredo./Você pode guardar segredo.)", correctAnswer: "Quero que isso seja um segredo.", rationale: "内緒にして (guardar segredo) + ほしい → quero que guarde segredo. 内緒 = segredo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この書類を確認してもらいたいのですが。 (Posso confirmar este documento?/Gostaria que você confirmasse este documento./Você confirmou o documento./Este documento está confirmado.)", correctAnswer: "Gostaria que você confirmasse este documento.", rationale: "この書類を確認して + もらいたいのですが → forma educada de pedir confirmação de documento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もう少し待ってほしいです。 (Quero esperar mais um pouco./Quero que espere mais um pouco./Você já esperou bastante./Preciso sair logo.)", correctAnswer: "Quero que espere mais um pouco.", rationale: "もう少し待って (esperar mais um pouco) + ほしいです → quero que espere.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "正直に答えてほしい。 (Quero que responda honestamente./Eu respondo honestamente./Quero mentir./Você respondeu honestamente.)", correctAnswer: "Quero que responda honestamente.", rationale: "正直に答えて (responder honestamente) + ほしい → quero que responda honestamente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明日までに連絡してもらいたいです。 (Gostaria de receber um contato até amanhã./Vou entrar em contato até amanhã./Você entrou em contato ontem./Não preciso de contato.)", correctAnswer: "Gostaria de receber um contato até amanhã.", rationale: "明日までに (até amanhã) + 連絡して + もらいたいです → gostaria que entrasse em contato.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "部屋を片付けてほしいです。 (Quero que arrume o quarto./Vou arrumar o quarto./Você arrumou o quarto./O quarto precisa ser arrumado.)", correctAnswer: "Quero que arrume o quarto.", rationale: "部屋を片付けて (arrumar o quarto) + ほしいです → quero que arrume.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あなたに分かってほしい。 (Quero que você entenda./Eu entendo você./Você entende tudo./Quero te explicar.)", correctAnswer: "Quero que você entenda.", rationale: "あなたに (você) + 分かってほしい → quero que você entenda. に indica quem deve agir.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "少し静かにしてもらいたいのですが。 (Vou ficar quieto./Você ficou quieto./Gostaria que ficasse um pouco mais quieto./Quero fazer barulho.)", correctAnswer: "Gostaria que ficasse um pouco mais quieto.", rationale: "静かにして + もらいたいのですが → pedido educado de silêncio. のですが suaviza o pedido.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
