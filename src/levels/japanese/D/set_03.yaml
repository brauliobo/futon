title: 📝 Condicional ～と — se/quando sempre
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～と expressa consequências automáticas ou naturais: 'sempre que X, Y acontece'. Muito usado para direções, instruções e fatos físicos."
example: "右に曲がると駅があります。 Ex.: ～と → resultado automático/natural 'se/quando sempre'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Usos do condicional ～と
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "春になると (quando ou sempre que vira primavera/quando ou sempre que vira verão/quando ou sempre que vira outono/quando ou sempre que vira inverno)", correctAnswer: "quando ou sempre que vira primavera", rationale: "春 (primavera) + になると → quando vira primavera. ～と com mudança de estado.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "押すと (quando empurra/quando puxa/quando gira/quando solta)", correctAnswer: "quando empurra", rationale: "押す (empurrar) + と → quando empurra. ～と para resultado automático.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "右に曲がると (quando dobra à esquerda/quando vai em frente/quando dobra à direita/quando volta)", correctAnswer: "quando dobra à direita", rationale: "右 (direita) + に曲がると → quando dobra à direita. Uso típico de ～と em direções.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "水を飲むと (quando bebe água/quando come/quando dorme/quando sai)", correctAnswer: "quando bebe água", rationale: "水を飲む (beber água) + と → quando bebe água. ～と para consequência natural.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このボタンを押すと (quando aperta este botão/quando segura este botão/quando solta este botão/quando gira este botão)", correctAnswer: "quando aperta este botão", rationale: "このボタンを押す (apertar este botão) + と → quando aperta este botão. Uso em instruções.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "寒くなると (quando fica frio/quando fica quente/quando fica nublado/quando fica ensolarado)", correctAnswer: "quando fica frio", rationale: "寒くなる (ficar frio) + と → quando fica frio. ～と com adjetivo-い + なる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電気を消すと (quando apaga a luz/quando acende a luz/quando abre a janela/quando fecha a porta)", correctAnswer: "quando apaga a luz", rationale: "電気を消す (apagar a luz) + と → quando apaga a luz. ～と para resultado físico.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たくさん食べると (quando come muito/quando come pouco/quando bebe muito/quando dorme muito)", correctAnswer: "quando come muito", rationale: "たくさん食べる (comer muito) + と → quando come muito. Causa e efeito natural.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "まっすぐ行くと (se for em frente/se virar à direita/se virar à esquerda/se voltar)", correctAnswer: "se for em frente", rationale: "まっすぐ行く (ir em frente) + と → se for em frente. Uso frequente em direções.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "暗くなると (quando fica escuro/quando fica claro/quando fica frio/quando fica quente)", correctAnswer: "quando fica escuro", rationale: "暗くなる (ficar escuro) + と → quando fica escuro. ～と para mudança natural.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～と
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "右に曲がると駅があります。 (Se virar à esquerda, há uma estação./Se virar à direita, há uma estação./Se for em frente, há uma estação./Se voltar, há uma estação.)", correctAnswer: "Se virar à direita, há uma estação.", rationale: "右に曲がると (se virar à direita) + 駅があります (há uma estação). Uso típico de ～と em direções.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "春になると桜が咲く。 (Quando vira inverno, as cerejeiras florescem./Quando vira primavera, as cerejeiras florescem./Quando vira verão, as cerejeiras florescem./Quando chove, as cerejeiras florescem.)", correctAnswer: "Quando vira primavera, as cerejeiras florescem.", rationale: "春になると (quando vira primavera) + 桜が咲く (as cerejeiras florescem). Fato natural.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たくさん食べると太ります。 (Quando come pouco, engorda./Quando come muito, engorda./Quando dorme muito, engorda./Quando bebe muito, emagrece.)", correctAnswer: "Quando come muito, engorda.", rationale: "たくさん食べると (quando come muito) + 太ります (engorda). Causa e efeito natural.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このボタンを押すと音が出る。 (Quando aperta este botão, sai luz./Quando aperta este botão, sai som./Quando solta este botão, sai som./Quando gira este botão, sai som.)", correctAnswer: "Quando aperta este botão, sai som.", rationale: "このボタンを押すと (quando aperta este botão) + 音が出る (sai som). Instrução com ～と.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電気を消すと暗くなる。 (Quando acende a luz, fica escuro./Quando apaga a luz, fica claro./Quando apaga a luz, fica escuro./Quando fecha a janela, fica escuro.)", correctAnswer: "Quando apaga a luz, fica escuro.", rationale: "電気を消すと (quando apaga a luz) + 暗くなる (fica escuro). Resultado automático.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "水を飲むと気分がよくなる。 (Quando bebe água, o humor piora./Quando come, o humor melhora./Quando bebe água, o humor melhora./Quando dorme, o humor melhora.)", correctAnswer: "Quando bebe água, o humor melhora.", rationale: "水を飲むと (quando bebe água) + 気分がよくなる (o humor melhora).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "寒くなると雪が降る。 (Quando fica quente, neva./Quando fica frio, neva./Quando fica nublado, neva./Quando chove, neva.)", correctAnswer: "Quando fica frio, neva.", rationale: "寒くなると (quando fica frio) + 雪が降る (neva). Fato natural/sazonal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "まっすぐ行くと公園があります。 (Se virar à direita, há um parque./Se for em frente, há um parque./Se voltar, há um parque./Se virar à esquerda, há um parque.)", correctAnswer: "Se for em frente, há um parque.", rationale: "まっすぐ行くと (se for em frente) + 公園があります (há um parque). Direção com ～と.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "暗くなると星が見える。 (Quando fica claro, vê-se estrelas./Quando fica escuro, vê-se estrelas./Quando chove, vê-se estrelas./Quando venta, vê-se estrelas.)", correctAnswer: "Quando fica escuro, vê-se estrelas.", rationale: "暗くなると (quando fica escuro) + 星が見える (vê-se estrelas). Fato natural.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "押すとドアが開く。 (Quando puxa, a porta abre./Quando gira, a porta abre./Quando empurra, a porta abre./Quando solta, a porta abre.)", correctAnswer: "Quando empurra, a porta abre.", rationale: "押すと (quando empurra) + ドアが開く (a porta abre). Resultado automático com ～と.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
