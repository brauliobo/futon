title: 📝 Verbo potencial — 食べられる 話せる 来られる
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "O potencial expressa capacidade ou possibilidade. Grupo 1: troque -u por -eru. Grupo 2: acrescente -られる. Irregulares: できる (poder/conseguir), 来られる (poder vir)."
example: "食べる → 食べられる (poder comer). Ex.: verbo potencial → capacidade 'poder/conseguir fazer'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Formação do potencial
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "食べられる (conseguir comer/conseguir beber/conseguir dormir/conseguir ler)", correctAnswer: "conseguir comer", rationale: "食べる (comer) → 食べられる (conseguir comer). Grupo 2: acrescenta -られる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "話せる (conseguir escrever/conseguir falar/conseguir ler/conseguir ouvir)", correctAnswer: "conseguir falar", rationale: "話す (falar) → 話せる (conseguir falar). Grupo 1: substitui -す por -せる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来られる (conseguir ir/conseguir voltar/conseguir vir/conseguir sair)", correctAnswer: "conseguir vir", rationale: "来る (vir) → 来られる (conseguir vir). Verbo irregular 来る.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "できる (conseguir fazer/conseguir ver/conseguir ir/conseguir falar)", correctAnswer: "conseguir fazer", rationale: "できる → poder/conseguir fazer. Potencial irregular de する.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "飲める (conseguir dormir/conseguir comer/conseguir beber/conseguir correr)", correctAnswer: "conseguir beber", rationale: "飲む (beber) → 飲める (conseguir beber). Grupo 1: substitui -む por -める.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "読める (conseguir escrever/conseguir ler/conseguir falar/conseguir ouvir)", correctAnswer: "conseguir ler", rationale: "読む (ler) → 読める (conseguir ler). Grupo 1: substitui -む por -める.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行ける (conseguir voltar/conseguir vir/conseguir sair/conseguir ir)", correctAnswer: "conseguir ir", rationale: "行く (ir) → 行ける (conseguir ir). Grupo 1: substitui -く por -ける.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書ける (conseguir escrever/conseguir ler/conseguir falar/conseguir ouvir)", correctAnswer: "conseguir escrever", rationale: "書く (escrever) → 書ける (conseguir escrever). Grupo 1: substitui -く por -ける.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "見られる (conseguir ouvir/conseguir ler/conseguir ver/conseguir falar)", correctAnswer: "conseguir ver", rationale: "見る (ver) → 見られる (conseguir ver). Grupo 2: acrescenta -られる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "起きられる (conseguir dormir/conseguir acordar/conseguir correr/conseguir comer)", correctAnswer: "conseguir acordar", rationale: "起きる (acordar) → 起きられる (conseguir acordar). Grupo 2: acrescenta -られる.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com verbo potencial
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "日本語が話せます。 (Consigo escrever japonês./Consigo ler japonês./Consigo falar japonês./Consigo ouvir japonês.)", correctAnswer: "Consigo falar japonês.", rationale: "日本語が (japonês) + 話せます (consigo falar). が marca a habilidade no potencial.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この漢字が読めません。 (Consigo ler este kanji./Não consigo escrever este kanji./Não consigo ler este kanji./Consigo escrever este kanji.)", correctAnswer: "Não consigo ler este kanji.", rationale: "この漢字が (este kanji) + 読めません (não consigo ler). Potencial negativo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明日来られますか。 (Consegue ir amanhã?/Consegue voltar amanhã?/Consegue vir amanhã?/Consegue sair amanhã?)", correctAnswer: "Consegue vir amanhã?", rationale: "明日 (amanhã) + 来られますか (consegue vir?). 来る → 来られる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "辛い食べ物が食べられない。 (Consigo comer comida picante./Não consigo beber comida picante./Não consigo comer comida picante./Gosto de comida picante.)", correctAnswer: "Não consigo comer comida picante.", rationale: "辛い食べ物が (comida picante) + 食べられない (não consigo comer). Potencial negativo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ピアノが弾けます。 (Consigo ouvir piano./Consigo tocar piano./Consigo comprar piano./Não consigo tocar piano.)", correctAnswer: "Consigo tocar piano.", rationale: "ピアノが (piano) + 弾けます (consigo tocar). 弾く → 弾ける.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "早く起きられますか。 (Consegue acordar cedo?/Consegue dormir cedo?/Consegue sair cedo?/Consegue chegar cedo?)", correctAnswer: "Consegue acordar cedo?", rationale: "早く (cedo) + 起きられますか (consegue acordar?). 起きる → 起きられる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この映画が見られます。 (Consigo ouvir este filme./Consigo comprar este filme./Consigo ver este filme./Não consigo ver este filme.)", correctAnswer: "Consigo ver este filme.", rationale: "この映画が (este filme) + 見られます (consigo ver). 見る → 見られる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "泳げますか。 (Consegue correr?/Consegue nadar?/Consegue pular?/Consegue voar?)", correctAnswer: "Consegue nadar?", rationale: "泳げますか = consegue nadar? 泳ぐ → 泳げる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題ができません。 (Consigo resolver este problema./Não consigo resolver este problema./Este problema é fácil./Este problema é interessante.)", correctAnswer: "Não consigo resolver este problema.", rationale: "この問題が (este problema) + できません (não consigo). できる é potencial de する.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "英語が書けます。 (Consigo falar inglês./Consigo ler inglês./Consigo escrever inglês./Não consigo escrever inglês.)", correctAnswer: "Consigo escrever inglês.", rationale: "英語が (inglês) + 書けます (consigo escrever). 書く → 書ける.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
