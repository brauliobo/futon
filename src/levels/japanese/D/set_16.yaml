title: 📝 Comparação avançada — ～より ～の方が ～ほど
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "Comparação em japonês: AよりBの方が (B é mais que A); AほどBでない (B não é tanto quanto A); ～ほど (quanto mais/tanto). Não usa 'mais' como prefixo."
example: "犬より猫の方が好きです。 Ex.: ～より ～の方が → 'B é mais que A'; ～ほど → 'tanto quanto'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Estruturas de comparação
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "犬より猫の方が好きです。 (Prefiro cães a gatos./Prefiro gatos a cães./Gosto igualmente de cães e gatos./Não gosto de animais.)", correctAnswer: "Prefiro gatos a cães.", rationale: "犬より (do que cães) + 猫の方が (gatos) + 好きです = prefiro gatos a cães. より = do que.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電車よりバスの方が安い。 (O trem é mais barato que o ônibus./O ônibus é mais barato que o trem./O trem e o ônibus têm o mesmo preço./O táxi é mais barato que o ônibus.)", correctAnswer: "O ônibus é mais barato que o trem.", rationale: "電車より (do que o trem) + バスの方が (o ônibus) + 安い = o ônibus é mais barato.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語は英語ほど難しくない。 (O japonês é mais difícil que o inglês./O inglês é mais difícil que o japonês./O japonês não é tão difícil quanto o inglês./O japonês e o inglês são igualmente difíceis.)", correctAnswer: "O japonês não é tão difícil quanto o inglês.", rationale: "日本語は (o japonês) + 英語ほど (tanto quanto o inglês) + 難しくない (não é difícil). ～ほど～ない = não tão...quanto.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "AよりBの方が (A é mais que B/B é mais que A/A e B são iguais/nem A nem B)", correctAnswer: "B é mais que A", rationale: "AよりBの方が = B é mais que A. より indica o padrão de comparação (o inferior).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "夏より冬の方が好きです。 (Prefiro o verão ao inverno./Prefiro o inverno ao verão./Gosto de verão e inverno igualmente./Não gosto de nenhuma estação.)", correctAnswer: "Prefiro o inverno ao verão.", rationale: "夏より (do que o verão) + 冬の方が (o inverno) + 好きです = prefiro o inverno.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "思ったほど難しくなかった。 (Foi mais difícil do que pensei./Não foi tão difícil quanto pensei./Foi exatamente o que pensei./Foi impossível como pensei.)", correctAnswer: "Não foi tão difícil quanto pensei.", rationale: "思ったほど (tanto quanto pensei) + 難しくなかった (não foi difícil). Comparação com expectativa.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どちらの方が好きですか。 (Quanto você gosta?/Você gosta de qual?/Por que gosta?/Quando você gosta?)", correctAnswer: "Você gosta de qual?", rationale: "どちら (qual dos dois) + の方が (é mais) + 好きですか = qual você prefere?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "勉強すればするほど上手になる。 (Quanto mais estuda, mais fica ruim./Quanto mais estuda, mais fica bom./Quanto menos estuda, mais fica bom./Estudar não muda nada.)", correctAnswer: "Quanto mais estuda, mais fica bom.", rationale: "すればするほど = quanto mais faz. ～ば～ほど = quanto mais...mais.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "コーヒーよりお茶の方が体にいい。 (O café é melhor para a saúde que o chá./O chá é melhor para a saúde que o café./Café e chá são igualmente saudáveis./Nenhum é saudável.)", correctAnswer: "O chá é melhor para a saúde que o café.", rationale: "コーヒーより (do que o café) + お茶の方が (o chá) + 体にいい = chá é melhor para o corpo.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あの店はここほど高くない。 (Aquela loja é mais cara que aqui./Aqui não é tão caro quanto aquela loja./Aquela loja não é tão cara quanto aqui./Os dois lugares têm o mesmo preço.)", correctAnswer: "Aquela loja não é tão cara quanto aqui.", rationale: "あの店は (aquela loja) + ここほど (tanto quanto aqui) + 高くない (não é cara). ほど～ない.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases de comparação avançada
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "山田さんより田中さんの方が背が高い。 (O Yamada é mais alto que o Tanaka./O Tanaka é mais alto que o Yamada./Os dois têm a mesma altura./O Tanaka é mais baixo que o Yamada.)", correctAnswer: "O Tanaka é mais alto que o Yamada.", rationale: "山田さんより (do que Yamada) + 田中さんの方が (Tanaka) + 背が高い (mais alto).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "聞くより話す方が難しい。 (Ouvir é mais difícil que falar./Falar é mais difícil que ouvir./Os dois são igualmente difíceis./Nenhum é difícil.)", correctAnswer: "Falar é mais difícil que ouvir.", rationale: "聞くより (do que ouvir) + 話す方が (falar) + 難しい = falar é mais difícil.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題は思ったほど簡単じゃなかった。 (Esta questão foi mais fácil do que pensei./Esta questão não foi tão fácil quanto pensei./Esta questão foi exatamente o que pensei./Esta questão foi impossível.)", correctAnswer: "Esta questão não foi tão fácil quanto pensei.", rationale: "思ったほど (tanto quanto pensei) + 簡単じゃなかった (não foi fácil).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "早ければ早いほどいい。 (Quanto mais tarde, melhor./Quanto mais cedo, melhor./Não importa quando./Tarde é melhor que cedo.)", correctAnswer: "Quanto mais cedo, melhor.", rationale: "早ければ早いほど (quanto mais cedo) + いい (melhor). ～ば～ほど = quanto mais...mais.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "東京より大阪の方が食べ物がおいしい。 (A comida de Tóquio é mais deliciosa que a de Osaka./A comida de Osaka é mais deliciosa que a de Tóquio./Tóquio e Osaka têm comidas igualmente deliciosas./A comida de Osaka não é tão boa.)", correctAnswer: "A comida de Osaka é mais deliciosa que a de Tóquio.", rationale: "東京より (do que Tóquio) + 大阪の方が (Osaka) + 食べ物がおいしい (comida é deliciosa).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このホテルはあちらほど高くありません。 (Este hotel é mais caro que aquele./Aquele hotel é mais caro que este./Este hotel não é tão caro quanto aquele./Os dois hotéis têm o mesmo preço.)", correctAnswer: "Este hotel não é tão caro quanto aquele.", rationale: "このホテルは (este hotel) + あちらほど (tanto quanto aquele) + 高くありません (não é caro).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "知れば知るほど面白くなる。 (Quanto mais aprende, mais fica chato./Quanto menos aprende, mais fica interessante./Quanto mais aprende, mais fica interessante./Aprender não muda nada.)", correctAnswer: "Quanto mais aprende, mais fica interessante.", rationale: "知れば知るほど (quanto mais sabe) + 面白くなる (fica mais interessante).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電車より歩いた方が速い。 (De trem é mais rápido que a pé./A pé é mais rápido que de trem./De trem e a pé são igualmente rápidos./De táxi é mais rápido.)", correctAnswer: "A pé é mais rápido que de trem.", rationale: "電車より (do que de trem) + 歩いた方が (ir a pé) + 速い = a pé é mais rápido.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試験より宿題の方がずっと多い。 (A prova tem muito mais que o dever de casa./O dever de casa tem muito mais que a prova./Os dois têm a mesma quantidade./Não há prova nem dever.)", correctAnswer: "O dever de casa tem muito mais que a prova.", rationale: "試験より (do que a prova) + 宿題の方が (o dever) + ずっと多い (tem muito mais). ずっと intensifica.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供の頃ほど元気じゃない。 (Estou tão saudável quanto na infância./Estou mais saudável que na infância./Não estou tão saudável quanto na infância./Estou mais cansado que na infância.)", correctAnswer: "Não estou tão saudável quanto na infância.", rationale: "子供の頃ほど (tanto quanto na infância) + 元気じゃない (não estou saudável). ほど～ない.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
