title: 📝 ～ようだ / ～みたいだ — parece que
level: 'D'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～ようだ e ～みたいだ expressam aparência baseada em evidência direta. ～ようだ é mais formal; ～みたいだ é coloquial. Ambos: 'parece que' (por observação)."
example: "雨が降っているようだ。 Ex.: ～ようだ/～みたいだ → 'parece que' (por evidência observada)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Significados de ～ようだ e ～みたいだ
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "雨が降っているようだ。 (Parece que vai chover./Parece que está chovendo./Tenho certeza que está chovendo./Ouvi dizer que está chovendo.)", correctAnswer: "Parece que está chovendo.", rationale: "～ているようだ → parece que está fazendo (por observação direta). ようだ indica evidência visual.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は疲れているみたいだ。 (Com certeza ela está cansada./Ouvi que ela está cansada./Parece que ela está cansada./Ela certamente não está cansada.)", correctAnswer: "Parece que ela está cansada.", rationale: "～みたいだ → parece que (coloquial). Observação da aparência de outra pessoa.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "具合が悪いようです。 (Tenho certeza que está doente./Parece que está mal./Ouvi que está doente./Certamente não está doente.)", correctAnswer: "Parece que está mal.", rationale: "具合が悪い (estar mal) + ようです (parece que). ようです é forma polida de ようだ.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この料理は辛いみたいだ。 (Tenho certeza que esta comida é picante./Ouvi que esta comida é picante./Parece que esta comida é picante./Esta comida não é picante.", correctAnswer: "Parece que esta comida é picante.", rationale: "辛い (picante) + みたいだ → parece que é picante. みたいだ é coloquial.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼はもう帰ったようだ。 (Parece que ele já foi embora./Tenho certeza que ele foi./Ouvi que ele foi embora./Ele certamente ainda está aqui.)", correctAnswer: "Parece que ele já foi embora.", rationale: "もう帰った (já foi embora) + ようだ → parece que já foi embora. Evidência indireta.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試験は難しかったみたいだ。 (Tenho certeza que a prova foi difícil./Ouvi que a prova foi difícil./Parece que a prova foi difícil./A prova certamente foi fácil.)", correctAnswer: "Parece que a prova foi difícil.", rationale: "難しかった (foi difícil) + みたいだ → parece que foi difícil (coloquial).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供のようだ。 (Parece uma criança./Com certeza é uma criança./Ouvi dizer que é criança./Certamente não é criança.)", correctAnswer: "Parece uma criança.", rationale: "子供 (criança) + のようだ → parece uma criança. の liga substantivos a ようだ.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "夢みたいだ。 (Tenho certeza que é um sonho./Parece um sonho./Ouvi que é um sonho./Certamente não é um sonho.)", correctAnswer: "Parece um sonho.", rationale: "夢 (sonho) + みたいだ → parece um sonho. Expressão coloquial comum.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もうすぐ終わるようです。 (Com certeza vai acabar em breve./Parece que vai acabar em breve./Ouvi que vai acabar./Certamente não vai acabar.)", correctAnswer: "Parece que vai acabar em breve.", rationale: "もうすぐ終わる (acabar em breve) + ようです → parece que vai acabar em breve.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は怒っているみたいです。 (Com certeza ela está com raiva./Parece que ela está com raiva./Ouvi que ela está com raiva./Ela definitivamente está feliz.)", correctAnswer: "Parece que ela está com raiva.", rationale: "怒っている (estar com raiva) + みたいです → parece que está com raiva (polido coloquial).", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Diferenças e uso de ～ようだ e ～みたいだ
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "空が暗くなってきたので、雨が降りそうなようだ。 (O céu está ficando escuro, parece que vai chover./O céu ficou claro, provavelmente não vai chover./Ouvi que vai chover./O céu está claro, então vai chover.)", correctAnswer: "O céu está ficando escuro, parece que vai chover.", rationale: "空が暗くなってきた (o céu ficou escuro) + 雨が降りそうなようだ (parece que vai chover).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は病気みたいで、学校を休んだ。 (Ele foi à escola mesmo doente./Parece que ele está doente e faltou à escola./Ele definitivamente está doente./Ele faltou por outro motivo.)", correctAnswer: "Parece que ele está doente e faltou à escola.", rationale: "病気みたいで (parece que está doente) + 学校を休んだ (faltou à escola). みたいで → forma conectiva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このケーキはおいしいようです。 (Este bolo parece estar delicioso./Tenho certeza que este bolo é delicioso./Ouvi que este bolo é delicioso./Este bolo definitivamente não é delicioso.)", correctAnswer: "Este bolo parece estar delicioso.", rationale: "このケーキは (este bolo) + おいしいようです (parece estar delicioso). ようです → polido.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は泣いているみたいだった。 (Ela estava definitivamente chorando./Parecia que ela estava chorando./Ouvi que ela estava chorando./Ela estava rindo.)", correctAnswer: "Parecia que ela estava chorando.", rationale: "泣いている (estar chorando) + みたいだった (parecia que). Forma passada de みたいだ.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は学生のようです。 (Ele definitivamente é estudante./Parece que ele é estudante./Ouvi que ele é estudante./Ele certamente não é estudante.)", correctAnswer: "Parece que ele é estudante.", rationale: "学生 (estudante) + のようです → parece que é estudante. の conecta substantivo + ようです.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外は寒いようですよ。 (Com certeza está frio lá fora./Parece que está frio lá fora./Ouvi que está frio lá fora./Definitivamente não está frio lá fora.)", correctAnswer: "Parece que está frio lá fora.", rationale: "外は (lá fora) + 寒いようですよ (parece que está frio). よ adiciona ênfase.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "店はもう閉まっているみたい。 (A loja parece estar aberta./Parece que a loja já está fechada./Tenho certeza que a loja está fechada./A loja vai abrir em breve.)", correctAnswer: "Parece que a loja já está fechada.", rationale: "店は (a loja) + もう閉まっているみたい (parece que já está fechada). みたい → coloquial sem だ.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は日本人のようですね。 (Ela definitivamente é japonesa./Ela não parece japonesa./Parece que ela é japonesa, né?/Ouvi dizer que ela é japonesa.)", correctAnswer: "Parece que ela é japonesa, né?", rationale: "日本人のようですね → parece japonesa, né? ね pede concordância.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題は難しいようだ。 (Esta questão definitivamente é difícil./Parece que esta questão é difícil./Ouvi que esta questão é difícil./Esta questão certamente é fácil.)", correctAnswer: "Parece que esta questão é difícil.", rationale: "この問題は (esta questão) + 難しいようだ (parece que é difícil).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "パーティーは楽しかったみたい。 (A festa definitivamente foi divertida./Parece que a festa foi divertida./Ouvi que a festa foi divertida./A festa certamente foi chata.)", correctAnswer: "Parece que a festa foi divertida.", rationale: "パーティーは (a festa) + 楽しかったみたい (parece que foi divertida). みたい após forma た.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
