title: 📝 ～について — sobre / a respeito de
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～について significa 'sobre / a respeito de / acerca de'. Substantivo + について + verbo. Variante: ～についての + substantivo. ～に関して é mais formal com mesmo significado."
example: "日本の文化について話しました。 Ex.: ～について → 'sobre / a respeito de'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: ～について — usos
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "日本の文化について (apesar da cultura japonesa/sobre a cultura japonesa/por causa da cultura japonesa/antes da cultura japonesa)", correctAnswer: "sobre a cultura japonesa", rationale: "日本の文化 (cultura japonesa) + について → sobre a cultura japonesa. Indica tema/assunto.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題について話し合いましょう。 (Vamos criar este problema./Vamos falar sobre este problema./Vamos resolver este problema./Vamos ignorar este problema.)", correctAnswer: "Vamos falar sobre este problema.", rationale: "この問題について (sobre este problema) + 話し合いましょう → vamos discutir/falar sobre.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "環境問題についての本 (um livro apesar dos problemas/um livro sobre problemas ambientais/um livro por causa de problemas ambientais/um livro antes dos problemas)", correctAnswer: "um livro sobre problemas ambientais", rationale: "環境問題についての (sobre problemas ambientais, forma adjetiva) + 本 → livro sobre. についての modifica substantivo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康について考える (pensar apesar da saúde/pensar sobre saúde/pensar por causa de saúde/pensar antes da saúde)", correctAnswer: "pensar sobre saúde", rationale: "健康 (saúde) + について + 考える → pensar sobre saúde. について indica tema de reflexão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この件について説明してください。 (Por favor, crie este assunto./Por favor, explique sobre este assunto./Por favor, resolva este assunto./Por favor, ignore este assunto.)", correctAnswer: "Por favor, explique sobre este assunto.", rationale: "この件について (sobre este assunto) + 説明してください → explique sobre. 件 → assunto/caso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "将来についての計画 (plano sobre o futuro/plano por causa do futuro/plano antes do futuro/plano apesar do futuro)", correctAnswer: "plano sobre o futuro", rationale: "将来についての (sobre o futuro, adjetival) + 計画 → plano sobre o futuro. についての + substantivo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この映画について何か知っていますか。 (Você sabe algo sobre este filme?/Você fez este filme?/Você comprou este filme?/Você ignorou este filme?)", correctAnswer: "Você sabe algo sobre este filme?", rationale: "この映画について (sobre este filme) + 何か知っていますか → você sabe algo sobre?", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "～について vs ～に関して — qual é mais formal? (são iguais/～について/～に関して/depende do contexto)", correctAnswer: "～に関して", rationale: "～に関して é mais formal e é preferido em contextos escritos, documentos oficiais e apresentações.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "留学について親に相談した。 (Falei com meus pais sobre estudar no exterior./Fui estudar no exterior com meus pais./Porque estudei no exterior, falei com meus pais./Antes de estudar, ignoro meus pais.)", correctAnswer: "Falei com meus pais sobre estudar no exterior.", rationale: "留学について (sobre estudar no exterior) + 親に相談した → falei/me consultei com os pais.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この商品についてのご意見をお聞かせください。 (Por favor, compartilhe sua opinião sobre este produto./Por favor, compre este produto./Por favor, devolva este produto./Por favor, ignore este produto.)", correctAnswer: "Por favor, compartilhe sua opinião sobre este produto.", rationale: "この商品についての (sobre este produto) + ご意見をお聞かせください → compartilhe sua opinião.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～について
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "日本の歴史について勉強しています。 (Estou estudando sobre a história do Japão./Estou estudando no Japão./Por causa da história, estou estudando./Antes de estudar, ignorei a história.)", correctAnswer: "Estou estudando sobre a história do Japão.", rationale: "日本の歴史について (sobre a história do Japão) + 勉強しています → estou estudando sobre.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題に関して、もう少し詳しく説明していただけますか。 (Com relação a este problema, poderia explicar com mais detalhes? (formal)/Este problema é difícil. Por favor, resolva./Ignoramos este problema. Por favor./Por causa do problema, explique.)", correctAnswer: "Com relação a este problema, poderia explicar com mais detalhes? (formal)", rationale: "この問題に関して (com relação a este problema, formal) + もう少し詳しく説明していただけますか.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "環境問題について、皆さんの意見を聞きたいと思います。 (Sobre problemas ambientais, gostaria de ouvir a opinião de todos./Os problemas ambientais são sérios./Por causa dos problemas, falaremos./Antes de discutir, resolva os problemas.)", correctAnswer: "Sobre problemas ambientais, gostaria de ouvir a opinião de todos.", rationale: "環境問題について (sobre problemas ambientais) + 皆さんの意見を聞きたいと思います.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この件についてはまだ決定していません。 (Sobre este assunto, ainda não foi decidido./Este assunto já foi decidido./Por causa deste assunto, decidimos./Antes deste assunto, decidimos.)", correctAnswer: "Sobre este assunto, ainda não foi decidido.", rationale: "この件については (sobre este assunto) + まだ決定していません → ainda não foi decidido.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語についての質問があれば、何でも聞いてください。 (Se tiver dúvidas sobre japonês, pergunte qualquer coisa./As dúvidas sobre japonês são proibidas./Por causa do japonês, pergunte./Antes de perguntar, estude japonês.)", correctAnswer: "Se tiver dúvidas sobre japonês, pergunte qualquer coisa.", rationale: "日本語についての質問があれば (se tiver dúvidas sobre japonês) + 何でも聞いてください.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "将来の計画について、もう考えましたか。 (Você já pensou sobre seus planos para o futuro?/Você tem planos para o futuro?/Por causa do futuro, pense./Antes de pensar, planeje.)", correctAnswer: "Você já pensou sobre seus planos para o futuro?", rationale: "将来の計画について (sobre planos para o futuro) + もう考えましたか → você já pensou sobre?", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このプロジェクトに関しては、部長に直接聞いてください。 (Com relação a este projeto, pergunte diretamente ao gerente./Este projeto é do gerente./Por causa do projeto, fale ao gerente./Antes do projeto, pergunte ao gerente.)", correctAnswer: "Com relação a este projeto, pergunte diretamente ao gerente.", rationale: "このプロジェクトに関しては (com relação a este projeto) + 部長に直接聞いてください.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生は日本の文化についての授業をしてくれました。 (O professor deu uma aula sobre a cultura japonesa./O professor foi ao Japão./Por causa da cultura, o professor deu aula./Antes da aula, o professor foi ao Japão.)", correctAnswer: "O professor deu uma aula sobre a cultura japonesa.", rationale: "日本の文化についての (sobre a cultura japonesa) + 授業をしてくれました → deu uma aula sobre.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しい規則について、全員に知らせる必要があります。 (É necessário informar a todos sobre as novas regras./As novas regras são proibidas./Por causa das regras, todos vão embora./Antes das novas regras, todos sabiam.)", correctAnswer: "É necessário informar a todos sobre as novas regras.", rationale: "新しい規則について (sobre as novas regras) + 全員に知らせる必要があります → é necessário informar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康についての情報はインターネットでも調べられます。 (Informações sobre saúde também podem ser pesquisadas na internet./A internet prejudica a saúde./Por causa da internet, estamos saudáveis./Antes da internet, não havia informações sobre saúde.)", correctAnswer: "Informações sobre saúde também podem ser pesquisadas na internet.", rationale: "健康についての情報は (informações sobre saúde) + インターネットでも調べられます → podem ser pesquisadas.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
