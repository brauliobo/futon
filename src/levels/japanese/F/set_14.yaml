title: 💬 Pedidos formais — ～ていただけますか
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Pedidos formais em japonês: ～てください (básico), ～ていただけますか (formal), ～ていただけないでしょうか (muito formal). Gradação de polidez ao pedir favores."
example: "書いていただけますか。 Ex.: ～ていただけますか → pedido formal 'poderia fazer?'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Pedidos formais — formas
    description: Escolha o significado ou a forma mais adequada.
    exercises:
      - { type: japanese_vocab, question: "書いていただけますか。 (Escreva, por favor. (casual)/Poderia escrever? (formal)/É proibido escrever?/Posso escrever?)", correctAnswer: "Poderia escrever? (formal)", rationale: "書いて (forma-て) + いただけますか = poderia escrever? いただく = receber (humilde). Pedido formal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "～ていただけますか vs ～てください — qual é mais formal? (são iguais/～てください/～ていただけますか/depende do verbo)", correctAnswer: "～ていただけますか", rationale: "いただく é forma humilde de もらう. ～ていただけますか é mais respeitoso que ～てください.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もう一度説明していただけますか。 (Explique novamente, por favor. (casual)/Poderia explicar novamente? (formal)/É proibido explicar?/Eu explico novamente.)", correctAnswer: "Poderia explicar novamente? (formal)", rationale: "もう一度 (novamente) + 説明して (explicar) + いただけますか = poderia explicar novamente?", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "こちらに署名していただけますか。 (Assine aqui, por favor. (casual)/Posso assinar aqui?/Poderia assinar aqui? (formal)/Não assine aqui.)", correctAnswer: "Poderia assinar aqui? (formal)", rationale: "こちらに署名して (assinar aqui) + いただけますか = poderia assinar aqui? Pedido respeitoso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "少々お待ちいただけますか。 (Espere um pouco, por favor. (casual)/Poderia esperar um momento? (formal)/É proibido esperar?/Não espere.)", correctAnswer: "Poderia esperar um momento? (formal)", rationale: "少々 (um momento) + お待ちいただけますか = poderia esperar um momento? お待ち: forma honorífica de 待つ.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "～ていただけないでしょうか (forma ainda mais polida de pedido/forma casual de pedido/proibição polida/permissão formal)", correctAnswer: "forma ainda mais polida de pedido", rationale: "～ていただけないでしょうか = versão negativa interrogativa, mais indireta e polida que ～ていただけますか.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "資料を送っていただけないでしょうか。 (Envie os documentos. (casual)/Poderia enviar os documentos? (muito formal)/É proibido enviar documentos?/Recebi os documentos.)", correctAnswer: "Poderia enviar os documentos? (muito formal)", rationale: "資料を送って (enviar documentos) + いただけないでしょうか = pedido muito formal e educado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご確認いただけますか。 (Confirme, por favor. (casual)/Poderia confirmar? (formal)/É proibido confirmar?/Já confirmei.)", correctAnswer: "Poderia confirmar? (formal)", rationale: "ご確認 (confirmação, prefixo honorífico ご) + いただけますか = poderia confirmar? Muito formal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お名前を教えていただけますか。 (Me diga seu nome. (casual)/Poderia me dizer seu nome? (formal)/É proibido dizer o nome?/Posso dizer meu nome?)", correctAnswer: "Poderia me dizer seu nome? (formal)", rationale: "お名前を (nome) + 教えていただけますか = poderia me dizer seu nome? Pedido formal e respeitoso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もう少しゆっくり話していただけますか。 (Fale mais devagar. (casual)/Poderia falar um pouco mais devagar? (formal)/É proibido falar devagar?/Falo devagar.)", correctAnswer: "Poderia falar um pouco mais devagar? (formal)", rationale: "もう少しゆっくり話して (falar mais devagar) + いただけますか = pedido educado e formal.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Pedidos formais em contexto
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "こちらの書類にご記入いただけますか。 (Preencha este documento, por favor. (casual)/Poderia preencher este documento? (formal)/É proibido preencher este documento?/Posso preencher este documento?)", correctAnswer: "Poderia preencher este documento? (formal)", rationale: "こちらの書類にご記入 (preencher este documento) + いただけますか = pedido formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご都合のよい時間を教えていただけないでしょうか。 (Me diga quando tiver tempo livre./Poderia me informar o horário que lhe convém? (muito formal)/É proibido informar horários?/Não sei quando terei tempo.)", correctAnswer: "Poderia me informar o horário que lhe convém? (muito formal)", rationale: "ご都合のよい時間を (horário que convém) + 教えていただけないでしょうか = pedido muito formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会議の日程を変更していただけますか。 (Mude o horário da reunião. (casual)/Poderia alterar o horário da reunião? (formal)/É proibido mudar o horário?/Vou mudar o horário.)", correctAnswer: "Poderia alterar o horário da reunião? (formal)", rationale: "会議の日程を変更して (alterar horário da reunião) + いただけますか = pedido formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "報告書を明日までに提出していただけますか。 (Entregue o relatório até amanhã. (casual)/Poderia entregar o relatório até amanhã? (formal)/É proibido entregar o relatório?/Vou entregar amanhã.)", correctAnswer: "Poderia entregar o relatório até amanhã? (formal)", rationale: "報告書を明日までに提出して (entregar relatório até amanhã) + いただけますか = pedido formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お電話番号をお教えいただけますか。 (Me dê seu número de telefone. (casual)/Poderia me informar seu número de telefone? (muito formal)/É proibido informar telefone?/Posso dar meu número?)", correctAnswer: "Poderia me informar seu número de telefone? (muito formal)", rationale: "お電話番号をお教え (informar número de telefone) + いただけますか = pedido muito formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "こちらにお掛けになっていただけますか。 (Sente-se aqui. (casual)/Poderia sentar-se aqui? (muito formal)/É proibido sentar aqui?/Posso sentar aqui?)", correctAnswer: "Poderia sentar-se aqui? (muito formal)", rationale: "こちらにお掛けになって (sentar aqui, forma honorífica) + いただけますか = pedido muito formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この点についてご説明いただけないでしょうか。 (Explique este ponto. (casual)/Poderia explicar este ponto? (muito formal)/É proibido explicar?/Vou explicar.)", correctAnswer: "Poderia explicar este ponto? (muito formal)", rationale: "この点についてご説明 (explicar este ponto) + いただけないでしょうか = pedido muito formal e indireto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご意見をお聞かせいただけますか。 (Me diga sua opinião. (casual)/Poderia compartilhar sua opinião? (muito formal)/É proibido dar opinião?/Tenho uma opinião.)", correctAnswer: "Poderia compartilhar sua opinião? (muito formal)", rationale: "ご意見をお聞かせ (ouvir sua opinião, forma honorífica) + いただけますか = pedido muito formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "こちらの内容をご確認いただけないでしょうか。 (Confirme este conteúdo. (casual)/Poderia confirmar este conteúdo? (muito formal)/É proibido confirmar?/Já confirmei.)", correctAnswer: "Poderia confirmar este conteúdo? (muito formal)", rationale: "こちらの内容をご確認 (confirmar este conteúdo) + いただけないでしょうか = pedido muito formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "よろしければ、ご連絡いただけますか。 (Entre em contato, por favor./Se for conveniente, poderia entrar em contato? (formal)/É proibido entrar em contato?/Vou entrar em contato.)", correctAnswer: "Se for conveniente, poderia entrar em contato? (formal)", rationale: "よろしければ (se for conveniente) + ご連絡いただけますか = pedido formal com cortesia adicional.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
