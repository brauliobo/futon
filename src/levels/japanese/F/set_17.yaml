title: 📝 ～に対して — em relação a / frente a
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～に対して significa 'em relação a / frente a / para'. Indica direção de ação, atitude ou contraste. Substantivo + に対して. Forma adjetival: ～に対する + substantivo."
example: "先生に対して失礼な態度を取ってはいけない。 Ex.: ～に対して → 'em relação a / frente a / para'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: ～に対して — usos
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "先生に対して失礼な態度 (atitude rude em relação ao professor/atitude rude do professor/atitude porque o professor é rude/atitude antes do professor)", correctAnswer: "atitude rude em relação ao professor", rationale: "Regra: 名詞 + に対して → direção de atitude/ação para X. Formula: [Target]に対して+[態度/行動]. 先生に対して = dirigido ao professor. Armadilha: に対して ≠ から (origem).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供に対して優しくしてください。 (Por favor, seja gentil com as crianças./Por favor, as crianças sejam gentis./Por causa das crianças, seja gentil./Antes das crianças, seja gentil.)", correctAnswer: "Por favor, seja gentil com as crianças.", rationale: "Regra: 名詞 + に対して + 行動 → ação dirigida a X. 子供に対して (target=crianças) + 優しくしてください = seja gentil com elas. に対して marca o destinatário da ação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この提案に対する意見 (opinião sobre/em relação a esta proposta/opinião por causa desta proposta/opinião antes desta proposta/opinião apesar desta proposta)", correctAnswer: "opinião sobre/em relação a esta proposta", rationale: "Regra: に対して (predicado) → に対する (adjetival). Formula: N₁に対するN₂ = N₂ em relação a N₁. 提案に対する意見 = opinião [voltada à] proposta.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の言葉に対して何も言わなかった。 (Não disse nada em resposta às palavras dele./Não ouvi as palavras dele./Porque ele falou, não respondi./Antes de ele falar, não respondi.)", correctAnswer: "Não disse nada em resposta às palavras dele.", rationale: "Regra: 名詞 + に対して + 反応 → reação frente a X. 言葉に対して = frente às palavras; 何も + 言わなかった = nada disse (何も exige negação).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外国人に対して親切にするのは大切だ。 (É importante ser gentil com estrangeiros./Os estrangeiros devem ser gentis./Por causa dos estrangeiros, sejamos gentis./Antes dos estrangeiros chegarem, sejamos gentis.)", correctAnswer: "É importante ser gentil com estrangeiros.", rationale: "Regra: 名詞 + に対して → para/com quem se dirige a ação. 外国人に対して + 親切にする = agir gentilmente para com estrangeiros; のは大切だ = é importante fazer isso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "批判に対してどう反応しましたか。 (Como reagiu frente à crítica?/Por causa da crítica, como reagiu?/A crítica reagiu a você?/Antes da crítica, como reagiu?)", correctAnswer: "Como reagiu frente à crítica?", rationale: "Regra: 名詞 + に対して + どう反応 → como reagiu frente a X? 批判 → crítica (target); どう → de que modo; 反応しましたか → reagiu? (ました→passado).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本では、お年寄りに対して席を譲るのが礼儀です。 (No Japão, é educado ceder o lugar para idosos./No Japão, os idosos cedem lugar./Por causa dos idosos, ceda o lugar./Antes dos idosos sentarem, levante.)", correctAnswer: "No Japão, é educado ceder o lugar para idosos.", rationale: "Regra: 名詞 + に対して → para/em favor de X. お年寄りに対して = para idosos; 席を譲る = ceder lugar; のが礼儀です = é questão de etiqueta (礼儀=礼儀作法).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "問題に対する解決策 (solução para o problema/solução por causa do problema/solução antes do problema/solução apesar do problema)", correctAnswer: "solução para o problema", rationale: "Regra: N₁ + に対するN₂ = N₂ voltado/direcionado a N₁. 問題(problema)に対する+解決策(solução) → solução para o problema. に対する = forma adjetival de に対して.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご意見に対して誠意をもって対応します。 (Responderemos sua opinião com sinceridade./Sua opinião é sincera./Por causa de sua opinião, somos sinceros./Antes de sua opinião, responderemos.)", correctAnswer: "Responderemos sua opinião com sinceridade.", rationale: "Regra: 名詞 + に対して + 対応する → responder em relação a X. ご意見に対して (frente à opinião) + 誠意をもって (com sinceridade/誠意→sinceridade) + 対応します → respondemos.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その決定に対して反対しました。 (Me opus a essa decisão./Concordei com essa decisão./Por causa dessa decisão, mudei de ideia./Antes da decisão, me opus.)", correctAnswer: "Me opus a essa decisão.", rationale: "Regra: 名詞 + に対して + 反対/賛成 → se opor/concordar frente a X. その決定に対して + 反対しました → me opus. Oposto: 賛成しました → concordei.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～に対して
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "上司に対して失礼な言い方をしてしまった。 (Acabei sendo rude com meu chefe./Meu chefe foi rude comigo./Por causa do chefe, fui rude./Antes de o chefe falar, fui rude.)", correctAnswer: "Acabei sendo rude com meu chefe.", rationale: "Regra: 名詞 + に対して + てしまった → acabei fazendo X para/com alguém. 上司(chefe)に対して + 失礼な言い方(modo rude) + をしてしまった = ação indesejada dirigida ao chefe.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女の努力に対して、もっと認めてあげるべきだった。 (Deveria ter reconhecido mais o esforço dela./O esforço dela era desnecessário./Por causa do esforço, ela foi reconhecida./Antes do esforço, a reconheci.)", correctAnswer: "Deveria ter reconhecido mais o esforço dela.", rationale: "Regra: 名詞 + に対して + べきだった → deveria ter agido frente a X. 努力(esforço)に対して + もっと認めてあげる(reconhecer mais) + べきだった = arrependimento passado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社会の変化に対して、柔軟に対応することが大切です。 (É importante responder flexivelmente às mudanças sociais./As mudanças sociais são inevitáveis./Por causa das mudanças, somos flexíveis./As mudanças sociais causam problemas.)", correctAnswer: "É importante responder flexivelmente às mudanças sociais.", rationale: "Regra: 名詞 + に対して + 対応する → responder/adaptar-se a X. 社会の変化(mudanças sociais) に対して + 柔軟に(flexivelmente) + 対応する + ことが大切 → é importante.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お客様のクレームに対する対応が遅かった。 (A resposta aos reclamações dos clientes foi lenta./Os clientes responderam devagar./Por causa das reclamações, respondemos./Antes das reclamações, respondemos.)", correctAnswer: "A resposta às reclamações dos clientes foi lenta.", rationale: "Regra: N₁ + に対するN₂ (adjetival). クレームに対する対応 → resposta [para] às reclamações. 遅かった → foi lenta (passado de 遅い).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "親の意見に対して素直に従うのは難しい時もある。 (Às vezes é difícil obedecer obedientemente à opinião dos pais./Os pais sempre obedecem os filhos./Por causa da opinião, obedecemos./Antes da opinião dos pais, obedecemos.)", correctAnswer: "Às vezes é difícil obedecer obedientemente à opinião dos pais.", rationale: "Regra: 名詞 + に対して + 従う → obedecer frente a X. 親の意見に対して + 素直に従う(obedecer docilmente) + のは難しい(é difícil) + 時もある(às vezes).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題に対する政府の対策は不十分だと思う。 (Acho que as medidas do governo em relação a este problema são insuficientes./O governo resolveu este problema./Por causa do governo, o problema foi resolvido./Antes do governo agir, o problema existia.)", correctAnswer: "Acho que as medidas do governo em relação a este problema são insuficientes.", rationale: "Regra: N₁に対する+N₂ (adjetival). この問題に対する政府の対策 → medidas do governo [frente] a este problema; 不十分だ → insuficiente; と思う → acho que.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼はどんな批判に対してもめげない強さがある。 (Ele tem força para não se abater frente a qualquer crítica./As críticas não existem para ele./Por causa das críticas, ele é forte./Antes das críticas, era forte.)", correctAnswer: "Ele tem força para não se abater frente a qualquer crítica.", rationale: "Regra: どんな + 名詞 + に対しても → frente a qualquer X. どんな批判に対しても(frente a qualquer crítica) + めげない(não se abate) + 強さがある(tem força).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供に対する暴力は絶対に許されない。 (A violência contra crianças é absolutamente inaceitável./As crianças são violentas./Por causa das crianças, há violência./Antes da violência, as crianças eram protegidas.)", correctAnswer: "A violência contra crianças é absolutamente inaceitável.", rationale: "Regra: 名詞 + に対する (adjetival) + 名詞. 子供に対する暴力 → violência [dirigida] contra crianças; 絶対に許されない → absolutamente não permitido (受け身否定).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その提案に対して、全員が賛成したわけではない。 (Nem todos concordaram com essa proposta./Todos concordaram com essa proposta./Por causa da proposta, todos concordaram./Antes da proposta, todos concordavam.)", correctAnswer: "Nem todos concordaram com essa proposta.", rationale: "Regra: 名詞 + に対して + 賛成/反対 → atitude frente a X. 全員が賛成したわけではない = 全員(todos)+賛成した(concordou)+わけではない(não significa que) → negação parcial.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "困っている人に対して、手を差し伸べることが大切だ。 (É importante estender a mão para pessoas em dificuldades./As pessoas em dificuldades ajudam./Por causa das dificuldades, ajudaremos./Antes das dificuldades, ajudei.)", correctAnswer: "É importante estender a mão para pessoas em dificuldades.", rationale: "Regra: 名詞 + に対して → para/em favor de X. 困っている人(pessoas com dificuldade) + に対して + 手を差し伸べる(estender a mão) + ことが大切だ = é importante.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
