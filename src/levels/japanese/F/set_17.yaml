title: 📝 ～に対して — em relação a / frente a
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～に対して significa 'em relação a / frente a / para'. Indica direção de ação, atitude ou contraste. Substantivo + に対して. Forma adjetival: ～に対する + substantivo."
example: "先生に対して失礼な態度を取ってはいけない。 Ex.: ～に対して → 'em relação a / frente a / para'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: ～に対して — usos
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "先生に対して失礼な態度 (atitude rude em relação ao professor/atitude rude do professor/atitude porque o professor é rude/atitude antes do professor)", correctAnswer: "atitude rude em relação ao professor", rationale: "先生に対して (em relação ao professor) + 失礼な態度 = atitude rude frente ao professor.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供に対して優しくしてください。 (Por favor, seja gentil com as crianças./Por favor, as crianças sejam gentis./Por causa das crianças, seja gentil./Antes das crianças, seja gentil.)", correctAnswer: "Por favor, seja gentil com as crianças.", rationale: "子供に対して (em relação às crianças/para com) + 優しくしてください = seja gentil com.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この提案に対する意見 (opinião sobre/em relação a esta proposta/opinião por causa desta proposta/opinião antes desta proposta/opinião apesar desta proposta)", correctAnswer: "opinião sobre/em relação a esta proposta", rationale: "この提案に対する (em relação a esta proposta, adjetival) + 意見 = opinião sobre esta proposta.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の言葉に対して何も言わなかった。 (Não disse nada em resposta às palavras dele./Não ouvi as palavras dele./Porque ele falou, não respondi./Antes de ele falar, não respondi.)", correctAnswer: "Não disse nada em resposta às palavras dele.", rationale: "彼の言葉に対して (em resposta às palavras dele) + 何も言わなかった = não disse nada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外国人に対して親切にするのは大切だ。 (É importante ser gentil com estrangeiros./Os estrangeiros devem ser gentis./Por causa dos estrangeiros, sejamos gentis./Antes dos estrangeiros chegarem, sejamos gentis.)", correctAnswer: "É importante ser gentil com estrangeiros.", rationale: "外国人に対して (em relação a estrangeiros/para com) + 親切にするのは大切だ = é importante ser gentil.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "批判に対してどう反応しましたか。 (Como reagiu frente à crítica?/Por causa da crítica, como reagiu?/A crítica reagiu a você?/Antes da crítica, como reagiu?)", correctAnswer: "Como reagiu frente à crítica?", rationale: "批判に対して (frente à crítica/em relação à crítica) + どう反応しましたか = como reagiu?", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本では、お年寄りに対して席を譲るのが礼儀です。 (No Japão, é educado ceder o lugar para idosos./No Japão, os idosos cedem lugar./Por causa dos idosos, ceda o lugar./Antes dos idosos sentarem, levante.)", correctAnswer: "No Japão, é educado ceder o lugar para idosos.", rationale: "お年寄りに対して (em relação a idosos/para idosos) + 席を譲るのが礼儀です = é educado ceder.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "問題に対する解決策 (solução para o problema/solução por causa do problema/solução antes do problema/solução apesar do problema)", correctAnswer: "solução para o problema", rationale: "問題に対する (para o problema, adjetival) + 解決策 = solução para/em relação ao problema.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご意見に対して誠意をもって対応します。 (Responderemos sua opinião com sinceridade./Sua opinião é sincera./Por causa de sua opinião, somos sinceros./Antes de sua opinião, responderemos.)", correctAnswer: "Responderemos sua opinião com sinceridade.", rationale: "ご意見に対して (em relação à sua opinião) + 誠意をもって対応します = responderemos com sinceridade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その決定に対して反対しました。 (Me opus a essa decisão./Concordei com essa decisão./Por causa dessa decisão, mudei de ideia./Antes da decisão, me opus.)", correctAnswer: "Me opus a essa decisão.", rationale: "その決定に対して (em relação a essa decisão/frente a) + 反対しました = me opus / fiz oposição a.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～に対して
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "上司に対して失礼な言い方をしてしまった。 (Acabei sendo rude com meu chefe./Meu chefe foi rude comigo./Por causa do chefe, fui rude./Antes de o chefe falar, fui rude.)", correctAnswer: "Acabei sendo rude com meu chefe.", rationale: "上司に対して (em relação ao chefe) + 失礼な言い方をしてしまった = acabei sendo rude.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女の努力に対して、もっと認めてあげるべきだった。 (Deveria ter reconhecido mais o esforço dela./O esforço dela era desnecessário./Por causa do esforço, ela foi reconhecida./Antes do esforço, a reconheci.)", correctAnswer: "Deveria ter reconhecido mais o esforço dela.", rationale: "彼女の努力に対して (em relação ao esforço dela) + もっと認めてあげるべきだった = deveria ter reconhecido.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社会の変化に対して、柔軟に対応することが大切です。 (É importante responder flexivelmente às mudanças sociais./As mudanças sociais são inevitáveis./Por causa das mudanças, somos flexíveis./As mudanças sociais causam problemas.)", correctAnswer: "É importante responder flexivelmente às mudanças sociais.", rationale: "社会の変化に対して (frente às mudanças sociais) + 柔軟に対応することが大切です = é importante responder.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お客様のクレームに対する対応が遅かった。 (A resposta aos reclamações dos clientes foi lenta./Os clientes responderam devagar./Por causa das reclamações, respondemos./Antes das reclamações, respondemos.)", correctAnswer: "A resposta às reclamações dos clientes foi lenta.", rationale: "お客様のクレームに対する (em relação às reclamações dos clientes) + 対応が遅かった = resposta foi lenta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "親の意見に対して素直に従うのは難しい時もある。 (Às vezes é difícil obedecer obedientemente à opinião dos pais./Os pais sempre obedecem os filhos./Por causa da opinião, obedecemos./Antes da opinião dos pais, obedecemos.)", correctAnswer: "Às vezes é difícil obedecer obedientemente à opinião dos pais.", rationale: "親の意見に対して (em relação à opinião dos pais) + 素直に従うのは難しい時もある.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題に対する政府の対策は不十分だと思う。 (Acho que as medidas do governo em relação a este problema são insuficientes./O governo resolveu este problema./Por causa do governo, o problema foi resolvido./Antes do governo agir, o problema existia.)", correctAnswer: "Acho que as medidas do governo em relação a este problema são insuficientes.", rationale: "この問題に対する (em relação a este problema) + 政府の対策は不十分だと思う = são insuficientes.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼はどんな批判に対してもめげない強さがある。 (Ele tem força para não se abater frente a qualquer crítica./As críticas não existem para ele./Por causa das críticas, ele é forte./Antes das críticas, era forte.)", correctAnswer: "Ele tem força para não se abater frente a qualquer crítica.", rationale: "どんな批判に対しても (frente a qualquer crítica) + めげない強さがある = tem força para não se abater.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供に対する暴力は絶対に許されない。 (A violência contra crianças é absolutamente inaceitável./As crianças são violentas./Por causa das crianças, há violência./Antes da violência, as crianças eram protegidas.)", correctAnswer: "A violência contra crianças é absolutamente inaceitável.", rationale: "子供に対する (contra/em relação a crianças) + 暴力は絶対に許されない = absolutamente inaceitável.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その提案に対して、全員が賛成したわけではない。 (Nem todos concordaram com essa proposta./Todos concordaram com essa proposta./Por causa da proposta, todos concordaram./Antes da proposta, todos concordavam.)", correctAnswer: "Nem todos concordaram com essa proposta.", rationale: "その提案に対して (em relação a essa proposta) + 全員が賛成したわけではない = nem todos concordaram.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "困っている人に対して、手を差し伸べることが大切だ。 (É importante estender a mão para pessoas em dificuldades./As pessoas em dificuldades ajudam./Por causa das dificuldades, ajudaremos./Antes das dificuldades, ajudei.)", correctAnswer: "É importante estender a mão para pessoas em dificuldades.", rationale: "困っている人に対して (para pessoas em dificuldades) + 手を差し伸べることが大切だ = é importante ajudar.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
