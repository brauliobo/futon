title: 📝 ～に違いない — com certeza é
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～に違いない expressa certeza forte baseada em evidências ou raciocínio: 'com certeza é / deve ser sem dúvida'. Forma plain + に違いない. Mais forte que はずだ e かもしれない."
example: "彼は知っているに違いない (com certeza ele sabe). Ex.: ～に違いない → 'com certeza é / deve ser sem dúvida'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: ～に違いない — usos
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "彼は知っているに違いない。 (Ele talvez saiba./Ele com certeza sabe./Ele não sabe./Acho que ele não sabe.)", correctAnswer: "Ele com certeza sabe.", rationale: "彼は知っている (ele saber) + に違いない = com certeza sabe. Certeza forte baseada em evidências.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは嘘に違いない。 (Talvez seja mentira./Certamente não é mentira./Com certeza é mentira./Pode ser mentira.)", correctAnswer: "Com certeza é mentira.", rationale: "これは嘘 (isto é mentira) + に違いない = com certeza é mentira. Substantivo + に違いない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は怒っているに違いない。 (Ela talvez esteja brava./Com certeza ela está brava./Ela provavelmente não está brava./Ela está brava, provavelmente.)", correctAnswer: "Com certeza ela está brava.", rationale: "彼女は怒っている (ela estar brava) + に違いない = com certeza está brava.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は日本人に違いない。 (Ele talvez seja japonês./Com certeza ele é japonês./Ele provavelmente não é japonês./Ele pode ser japonês.)", correctAnswer: "Com certeza ele é japonês.", rationale: "彼は日本人 (ele ser japonês) + に違いない = com certeza é japonês. Certeza baseada em observação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この映画は面白いに違いない。 (Este filme talvez seja interessante./Com certeza este filme é interessante./Este filme definitivamente não é interessante./Acho que é interessante.", correctAnswer: "Com certeza este filme é interessante.", rationale: "この映画は面白い (este filme é interessante) + に違いない = com certeza é interessante.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は失敗したに違いない。 (Ela talvez tenha falhado./Com certeza ela falhou./Ela definitivamente não falhou./Acho que ela falhou.)", correctAnswer: "Com certeza ela falhou.", rationale: "彼女は失敗した (ela falhou) + に違いない = com certeza falhou. Passado + に違いない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この噂は本当に違いない。 (Este boato talvez seja verdade./Com certeza este boato é verdade./Este boato definitivamente é mentira./Não sei se é verdade.)", correctAnswer: "Com certeza este boato é verdade.", rationale: "この噂は本当 (este boato é verdade) + に違いない = com certeza é verdade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼はもう帰ったに違いない。 (Ele talvez já tenha ido embora./Com certeza ele já foi embora./Ele definitivamente não foi embora./Acho que ele ainda está aqui.)", correctAnswer: "Com certeza ele já foi embora.", rationale: "彼はもう帰った (ele já foi embora) + に違いない = com certeza já foi embora.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あの人はお金持ちに違いない。 (Aquela pessoa talvez seja rica./Com certeza aquela pessoa é rica./Aquela pessoa definitivamente não é rica./Acho que ela é pobre.)", correctAnswer: "Com certeza aquela pessoa é rica.", rationale: "あの人はお金持ち (aquela pessoa é rica) + に違いない = com certeza é rica. Baseado em aparência.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この匂いはカレーに違いない。 (Este cheiro talvez seja curry./Com certeza este cheiro é curry./Este cheiro definitivamente não é curry./Acho que é curry.)", correctAnswer: "Com certeza este cheiro é curry.", rationale: "この匂いはカレー (este cheiro é curry) + に違いない = com certeza é curry. Certeza por sensação.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～に違いない
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "彼がそんなことを言うはずがない。彼は誤解されているに違いない。 (Ele disse aquilo. Ele entendeu certo./Ele não diria isso. Com certeza ele foi mal compreendido./Talvez ele tenha dito. Talvez tenha entendido errado./Ele disse e entendeu bem.)", correctAnswer: "Ele não diria isso. Com certeza ele foi mal compreendido.", rationale: "言うはずがない (não diria) + 誤解されているに違いない = com certeza foi mal compreendido.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "こんなに頑張ったのだから、合格したに違いない。 (Esforcei-me tanto, então talvez tenha passado./Esforcei-me tanto, então com certeza passei./Não me esforcei, então não passei./Esforcei-me mas definitivamente não passei.)", correctAnswer: "Esforcei-me tanto, então com certeza passei.", rationale: "こんなに頑張った (esforcei-me tanto) + のだから + 合格したに違いない = com certeza passei.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電気がついているから、誰かいるに違いない。 (Como a luz está acesa, talvez haja alguém./Como a luz está acesa, com certeza há alguém./A luz está apagada, então ninguém há./A luz está acesa mas não há ninguém.)", correctAnswer: "Como a luz está acesa, com certeza há alguém.", rationale: "電気がついているから (porque a luz está acesa) + 誰かいるに違いない = com certeza há alguém.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あんなに泣いていたから、悲しいことがあったに違いない。 (Como chorou tanto, talvez tenha acontecido algo triste./Como chorou tanto, com certeza aconteceu algo triste./Ela não chorou, então nada aconteceu./Chorou mas estava feliz.)", correctAnswer: "Como chorou tanto, com certeza aconteceu algo triste.", rationale: "あんなに泣いていたから (porque chorou tanto) + 悲しいことがあったに違いない = com certeza aconteceu algo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女の料理は美味しいに違いない。料理学校で習ったそうだから。 (A comida dela talvez seja boa. Ela estudou em escola de culinária./A comida dela com certeza é boa. Ela estudou em escola de culinária./A comida dela é ruim. Ela não estudou./Não sei se a comida é boa.)", correctAnswer: "A comida dela com certeza é boa. Ela estudou em escola de culinária.", rationale: "美味しいに違いない (com certeza é boa) + 料理学校で習ったそうだから (porque estudou em escola).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は何か隠しているに違いない。目を合わせないから。 (Ele talvez esteja escondendo algo. Porque não olha nos olhos./Ele com certeza está escondendo algo. Porque não olha nos olhos./Ele não está escondendo nada. Está olhando./Talvez olhe nos olhos.)", correctAnswer: "Ele com certeza está escondendo algo. Porque não olha nos olhos.", rationale: "何か隠しているに違いない (com certeza está escondendo) + 目を合わせないから (porque não olha nos olhos).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この商品はすぐ売り切れるに違いない。とても人気があるから。 (Este produto talvez esgote logo. É muito popular./Este produto com certeza esgotará logo. É muito popular./Este produto não esgotará. Não é popular./Este produto é popular mas não esgota.)", correctAnswer: "Este produto com certeza esgotará logo. É muito popular.", rationale: "すぐ売り切れるに違いない (com certeza esgotará logo) + とても人気があるから (porque é muito popular).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この道を行けば着くに違いない。地図にはっきり書いてある。 (Se for por este caminho, talvez chegue. O mapa diz./Se for por este caminho, com certeza chegará. O mapa diz claramente./Se for por este caminho, não chegará. O mapa mente./Não sei se chegará.)", correctAnswer: "Se for por este caminho, com certeza chegará. O mapa diz claramente.", rationale: "この道を行けば着くに違いない (com certeza chegará) + 地図にはっきり書いてある (o mapa diz claramente).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あの二人はもう知り合いに違いない。とても仲よさそうだから。 (Aqueles dois talvez já se conheçam. Parecem muito próximos./Aqueles dois com certeza já se conhecem. Parecem muito próximos./Aqueles dois não se conhecem. Não parecem próximos./Não sei se se conhecem.)", correctAnswer: "Aqueles dois com certeza já se conhecem. Parecem muito próximos.", rationale: "知り合いに違いない (com certeza se conhecem) + とても仲よさそうだから (porque parecem muito próximos).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女はもう知っているに違いない。みんなが話していたから。 (Ela talvez já saiba. Todos estavam falando./Ela com certeza já sabe. Todos estavam falando./Ela não sabe. Ninguém falou./Ela soube mas esqueceu.)", correctAnswer: "Ela com certeza já sabe. Todos estavam falando.", rationale: "もう知っているに違いない (com certeza já sabe) + みんなが話していたから (porque todos estavam falando).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
