title: 📝 Keigo intro — ます/です avançado, ございます
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Keigo (linguagem de cortesia) N4: ございます (existe, forma mais formal que あります), いらっしゃいます (estar/ir/vir, honorífico), おります (estar, humilde), 申します (chamar-se, humilde)."
example: "本日はご来場いただきありがとうございます。 Ex.: Keigo básico → ございます/いらっしゃいます/おります/申します."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Keigo — formas básicas
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "ございます (existe/há — forma muito formal de あります/いる informal/する casual/する polido)", correctAnswer: "existe/há — forma muito formal de あります", rationale: "ございます → forma muito polida de あります. Usado em contextos formais, lojas, avisos.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "いらっしゃいます (forma humilde de ir/forma honorífica de estar/ir/vir/forma casual de existir/forma neutra de ir)", correctAnswer: "forma honorífica de estar/ir/vir", rationale: "いらっしゃいます → いる/行く/来る na forma honorífica. Para falar do interlocutor ou superiores.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "おります (forma honorífica de estar/forma humilde de estar/forma neutra de existir/forma casual de ir)", correctAnswer: "forma humilde de estar", rationale: "おります → いる na forma humilde. Para falar de si mesmo em contexto formal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "申します (forma honorífica de dizer/forma casual de falar/forma humilde de dizer/chamar-se/forma neutra de falar)", correctAnswer: "forma humilde de dizer/chamar-se", rationale: "申します → 言います na forma humilde. Ex.: 田中と申します (chamo-me Tanaka).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "田中と申します。 (Me chamo Tanaka. (muito formal)/Me chamo Tanaka. (casual)/Você se chama Tanaka?/O senhor Tanaka está aqui?)", correctAnswer: "Me chamo Tanaka. (muito formal)", rationale: "田中と申します → me chamo Tanaka. 申す → forma humilde de 言う. Apresentação formal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生はいらっしゃいますか。 (O professor existe?/O professor está aqui? (formal)/O professor foi?/O professor vai?)", correctAnswer: "O professor está aqui? (formal)", rationale: "先生は (o professor) + いらっしゃいますか → o professor está? いらっしゃる é honorífico de いる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "私は山田と申します。 (Você se chama Yamada?/Me chamo Yamada. (formal)/O senhor Yamada está?/Yamada disse algo.)", correctAnswer: "Me chamo Yamada. (formal)", rationale: "私は (eu) + 山田と申します → me chamo Yamada. Apresentação formal com forma humilde.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "少々お待ちくださいませ。 (Por favor, não espere./Espere muito, por favor./Por favor, espere um momento. (muito formal)/Espere se quiser.)", correctAnswer: "Por favor, espere um momento. (muito formal)", rationale: "少々 (um momento) + お待ちください + ませ → por favor, espere. ませ → sufixo de polidez extrema.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ありがとうございます (obrigado — neutro/obrigado — muito formal/obrigado — informal/obrigado — casual)", correctAnswer: "obrigado — muito formal", rationale: "ありがとうございます → obrigado (muito formal). ございます torna mais polido que ありがとうです.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どうぞよろしくお願いいたします。 (Muito prazer — muito formal./Muito prazer — casual./Tchau — formal./Desculpe — formal.)", correctAnswer: "Muito prazer — muito formal.", rationale: "どうぞよろしくお願いいたします → muito prazer/peço sua atenção. いたします → forma humilde de します.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Keigo — frases e contextos
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "本日はご来場いただきありがとうございます。 (Obrigado por vir hoje. (muito formal)/Obrigado por vir ontem./Não obrigado por vir./Venha amanhã, por favor.)", correctAnswer: "Obrigado por vir hoje. (muito formal)", rationale: "本日 (hoje, formal) + ご来場いただき (por terem vindo) + ありがとうございます (obrigado). Muito formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "担当者はただいま席を外しております。 (O responsável está na mesa agora./O responsável está fora de momento. (formal)/O responsável foi embora./O responsável não existe.)", correctAnswer: "O responsável está fora de momento. (formal)", rationale: "担当者は (o responsável) + ただいま (no momento) + 席を外しております (está fora da mesa, humilde).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご不明な点がございましたら、お申し付けください。 (Se tiver dúvidas, por favor nos informe. (muito formal)/Se tiver dúvidas, não pergunte./Se não tiver dúvidas, pergunte./Não temos respostas para dúvidas.)", correctAnswer: "Se tiver dúvidas, por favor nos informe. (muito formal)", rationale: "ご不明な点が (pontos obscuros/dúvidas) + ございましたら (se houver, formal) + お申し付けください (informe-nos).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "山田部長はいらっしゃいますか。 (A diretora Yamada está? (formal)/A diretora Yamada foi?/A diretora Yamada virá?/A diretora Yamada não existe.)", correctAnswer: "A diretora Yamada está? (formal)", rationale: "山田部長は (diretora Yamada) + いらっしゃいますか → está? いらっしゃる: honorífico de いる.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "こちらに商品がございます。 (Há produtos aqui. (muito formal)/Há produtos aqui. (casual)/Não há produtos aqui./Os produtos são bons.)", correctAnswer: "Há produtos aqui. (muito formal)", rationale: "こちらに (aqui) + 商品がございます → há produtos aqui. ございます → forma formal de あります.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "私どもは○○会社と申します。 (Nós somos a empresa XX. (humilde)/Você é da empresa XX?/A empresa XX está aqui?/Eu sou da empresa XX. (casual))", correctAnswer: "Nós somos a empresa XX. (humilde)", rationale: "私ども (forma humilde de 私たち) + は○○会社と申します → somos a empresa XX. Apresentação formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ただいま確認しておりますので、少々お待ちくださいませ。 (Estamos verificando agora, então por favor espere um momento./Verificamos ontem, então pode esperar./Não verificamos nada./Por favor, não espere.)", correctAnswer: "Estamos verificando agora, então por favor espere um momento.", rationale: "ただいま確認しております (estamos verificando, humilde) + ので + 少々お待ちくださいませ (espere, formal).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご質問がございましたら、いつでもどうぞ。 (Se tiver perguntas, pode fazer a qualquer hora./Não faça perguntas./As perguntas são proibidas./Faça perguntas amanhã.)", correctAnswer: "Se tiver perguntas, pode fazer a qualquer hora.", rationale: "ご質問がございましたら (se tiver perguntas) + いつでもどうぞ (a qualquer hora, fique à vontade).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "失礼いたします。 (Olá — formal./Com licença/desculpe — muito formal./Obrigado — formal./Tchau — formal.)", correctAnswer: "Com licença/desculpe — muito formal.", rationale: "失礼いたします → com licença/me desculpe. いたします → forma humilde de します. Muito educado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "何かお力になれることがございましたら、おっしゃってください。 (Se puder fazer algo por você, por favor, me diga./Não posso ajudá-lo./Não me peça ajuda./Peça ajuda a outra pessoa.)", correctAnswer: "Se puder fazer algo por você, por favor, me diga.", rationale: "何かお力になれる (se puder ser de ajuda) + ございましたら (se houver) + おっしゃってください (por favor, diga).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
