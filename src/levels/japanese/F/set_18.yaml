title: 📝 ～として — como / na posição de
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～として significa 'como / na posição de / enquanto'. Indica papel, função ou capacidade. Substantivo + として. Forma adjetival: ～としての + substantivo. ～としては = quanto a / no papel de."
example: "医者として働いています。 Ex.: ～として → 'como / na posição de'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: ～として — usos
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "医者として働いています。 (Trabalho como médico./Trabalho no hospital./Porque sou médico, trabalho./Antes de ser médico, trabalhei.)", correctAnswer: "Trabalho como médico.", rationale: "医者として (como médico) + 働いています = trabalho. として indica papel/função.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "代表として参加します。 (Participarei como representante./Participarei com o representante./Porque sou representante, participarei./Antes do representante, participarei.)", correctAnswer: "Participarei como representante.", rationale: "代表として (como representante) + 参加します = participarei. Indica papel oficial.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生としての責任 (responsabilidade como professor/responsabilidade por causa do professor/responsabilidade antes do professor/responsabilidade apesar do professor)", correctAnswer: "responsabilidade como professor", rationale: "先生としての (como professor, adjetival) + 責任 = responsabilidade como professor. としての modifica substantivo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友達として話したい。 (Quero falar como amigo./Quero falar com o amigo./Porque somos amigos, falamos./Antes de ser amigo, falei.)", correctAnswer: "Quero falar como amigo.", rationale: "友達として (como amigo, no papel de amigo) + 話したい = quero falar. Indica relação/papel.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このスパイスはハーブとして使われる。 (Esta especiaria é usada como erva./Esta especiaria é uma erva./Por causa desta erva, usamos./Antes desta erva, usávamos.)", correctAnswer: "Esta especiaria é usada como erva.", rationale: "このスパイスは (esta especiaria) + ハーブとして (como erva) + 使われる = é usada como.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "学生としては頑張っている方だ。 (Como estudante, ele é esforçado./Porque é estudante, é esforçado./O estudante é esforçado./Antes de ser estudante, era esforçado.)", correctAnswer: "Como estudante, ele é esforçado.", rationale: "学生としては (quanto a / como estudante) + 頑張っている方だ = é esforçado. としては = quanto a.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "薬として飲む (tomar como remédio/tomar por causa do remédio/tomar o remédio/antes de tomar o remédio)", correctAnswer: "tomar como remédio", rationale: "薬として (como remédio) + 飲む = tomar como remédio. Indica propósito/função da ação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は通訳として会議に出席した。 (Ela participou da reunião como intérprete./Ela foi à reunião com a intérprete./Porque é intérprete, ela foi à reunião./Antes da reunião, era intérprete.)", correctAnswer: "Ela participou da reunião como intérprete.", rationale: "彼女は通訳として (como intérprete) + 会議に出席した = participou da reunião no papel de.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "プロとして (como profissional/com o profissional/por causa do profissional/antes do profissional)", correctAnswer: "como profissional", rationale: "プロとして = como profissional. として indica que a pessoa age no papel/capacidade de profissional.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語の教科書として使えます。 (Pode ser usado como livro didático de japonês./Este é um livro de japonês./Por causa do japonês, use este livro./Antes de usar, é um livro de japonês.)", correctAnswer: "Pode ser usado como livro didático de japonês.", rationale: "日本語の教科書として (como livro didático de japonês) + 使えます = pode ser usado como.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～として
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "彼は日本のサッカー選手として海外でも知られている。 (Ele é conhecido no exterior como jogador de futebol japonês./Ele joga futebol no exterior./Por causa do futebol, é famoso./Antes de ser famoso, jogou futebol.)", correctAnswer: "Ele é conhecido no exterior como jogador de futebol japonês.", rationale: "日本のサッカー選手として (como jogador de futebol japonês) + 海外でも知られている = é conhecido.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この経験は人間としての成長につながった。 (Esta experiência levou ao crescimento como ser humano./Esta experiência foi muito difícil./Por causa desta experiência, crescemos./Antes desta experiência, crescemos.)", correctAnswer: "Esta experiência levou ao crescimento como ser humano.", rationale: "人間としての (como ser humano, adjetival) + 成長につながった = levou ao crescimento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ボランティアとして地域の活動に参加しています。 (Participo das atividades da comunidade como voluntário./Sou da comunidade e participo./Por causa do voluntariado, participo./Antes do voluntariado, participei.)", correctAnswer: "Participo das atividades da comunidade como voluntário.", rationale: "ボランティアとして (como voluntário) + 地域の活動に参加しています = participo das atividades.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本を代表する食べ物として、寿司は有名です。 (Como alimento representativo do Japão, o sushi é famoso./O sushi é famoso no Japão./Por causa do sushi, o Japão é famoso./O Japão é famoso e o sushi também.)", correctAnswer: "Como alimento representativo do Japão, o sushi é famoso.", rationale: "日本を代表する食べ物として (como alimento representativo do Japão) + 寿司は有名です.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "としては、この成績は悪くない。 (Como resultado, essa nota não é ruim./Esse resultado é muito bom./Por causa do resultado, não é ruim./Antes do resultado, era bom.)", correctAnswer: "Como resultado, essa nota não é ruim.", rationale: "としては (quanto a / como) + この成績は悪くない = como [estudante/expectativa], não é ruim.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外国人として日本で生活することは容易ではない。 (Viver no Japão como estrangeiro não é fácil./Os estrangeiros vivem bem no Japão./Por causa dos estrangeiros, viver no Japão é difícil./Antes de viver no Japão, era estrangeiro.)", correctAnswer: "Viver no Japão como estrangeiro não é fácil.", rationale: "外国人として (como estrangeiro) + 日本で生活することは容易ではない = não é fácil viver.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このデータは参考資料として提供されています。 (Estes dados são fornecidos como material de referência./Estes dados são definitivos./Por causa dos dados, fornecemos material./Antes dos dados, havia material.)", correctAnswer: "Estes dados são fornecidos como material de referência.", rationale: "このデータは (estes dados) + 参考資料として (como material de referência) + 提供されています.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "親としての愛情は言葉では表現できない。 (O amor como pai/mãe não pode ser expresso em palavras./Os pais não amam seus filhos./Por causa do amor, os pais expressam./Antes de ser pai/mãe, não havia amor.)", correctAnswer: "O amor como pai/mãe não pode ser expresso em palavras.", rationale: "親としての (como pai/mãe, adjetival) + 愛情は言葉では表現できない = não pode ser expresso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語の練習として、毎日日記を書いています。 (Como prática de japonês, escrevo diário todos os dias./Gosto de escrever diário em japonês./Por causa do japonês, escrevo diário./Antes de praticar, escrevia diário.)", correctAnswer: "Como prática de japonês, escrevo diário todos os dias.", rationale: "日本語の練習として (como prática de japonês) + 毎日日記を書いています = escrevo diário.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女はこの会社の顔として活躍している。 (Ela está atuando como o rosto desta empresa./Ela é bonita./Por causa da empresa, ela trabalhou./Antes da empresa, ela atuou.)", correctAnswer: "Ela está atuando como o rosto desta empresa.", rationale: "この会社の顔として (como o rosto/representante desta empresa) + 活躍している = está atuando.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
