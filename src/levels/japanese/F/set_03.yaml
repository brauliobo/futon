title: 📝 Forma plain + と言う — citar
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "と言う (to iu) conecta uma citação à sua fonte. A frase citada usa forma plain. と言った = disse que; と言っている = está dizendo que; という = chamado de / que se chama."
example: "明日来ると言った (disse que vem amanhã). Ex.: forma plain + と言う → citação direta/indireta."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: と言う — citação
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "明日来ると言った。 (Disse para que ele viesse amanhã./Disse que não vem amanhã./Disse que vem amanhã./Perguntou se viria amanhã.)", correctAnswer: "Disse que vem amanhã.", rationale: "明日来る (vem amanhã, plain) + と言った (disse) → disse que vem amanhã. Plain + と言う → citação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嫌だと言った。 (Disse que gostou./Disse que não sabe./Disse que não quer./Disse que quer.)", correctAnswer: "Disse que não quer.", rationale: "嫌だ (não quero/detesto, plain) + と言った → disse que não quer. 嫌 → indesejável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "おいしいと言っている。 (Está dizendo que está ruim./Está dizendo que está delicioso./Disse que estava ruim./Disse que estava delicioso.)", correctAnswer: "Está dizendo que está delicioso.", rationale: "おいしい (delicioso, plain) + と言っている → está dizendo que está delicioso. ている → presente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "田中という人 (a pessoa chamada Tanaka/a pessoa que disse Tanaka/a pessoa que perguntou sobre Tanaka/a pessoa que não conhece Tanaka)", correctAnswer: "a pessoa chamada Tanaka", rationale: "田中 (Tanaka) + という + 人 → a pessoa chamada Tanaka. という → chamado de.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来られないと言いました。 (Disse que podia vir./Disse que não podia vir./Perguntou se poderia vir./Disse para não vir.)", correctAnswer: "Disse que não podia vir.", rationale: "来られない (não pode vir, plain negativo) + と言いました → disse que não pode vir.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "難しいと言っていた。 (Estava dizendo que era fácil./Estava dizendo que era difícil./Disse que seria fácil./Disse que seria difícil.)", correctAnswer: "Estava dizendo que era difícil.", rationale: "難しい (difícil, plain) + と言っていた → estava dizendo que era difícil. ていた → passado progressivo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行かないと言った。 (Disse que vai./Disse que não vai./Perguntou se vai./Mandou ir.)", correctAnswer: "Disse que não vai.", rationale: "行かない (não vai, plain negativo) + と言った → disse que não vai.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「ありがとう」と言った。 (Disse 'por favor'./Disse 'desculpe'./Disse 'obrigado'./Disse 'tchau'.)", correctAnswer: "Disse 'obrigado'.", rationale: "「ありがとう」 (obrigado) + と言った → disse 'obrigado'. Citação direta com と言う.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "好きだと言ってほしい。 (Quero que diga que não gosta./Quero que diga que gosta./Preciso dizer que gosto./Devo dizer que gosto.)", correctAnswer: "Quero que diga que gosta.", rationale: "好きだ (gosta, plain) + と言ってほしい → quero que diga que gosta. と言って + ほしい.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「愛している」という言葉 (a palavra 'odeio'/a palavra 'não gosto'/a palavra 'amo'/a palavra 'gosto')", correctAnswer: "a palavra 'amo'", rationale: "「愛している」 (amo) + という + 言葉 (palavra) → a palavra 'amo'. という → chamado de.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com と言う
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "彼女は明日来ないと言っています。 (Ela está dizendo que vem amanhã./Ela está dizendo que não vem amanhã./Ela perguntou se viria amanhã./Ela disse para que viesse amanhã.)", correctAnswer: "Ela está dizendo que não vem amanhã.", rationale: "明日来ない (não vem amanhã) + と言っています → está dizendo que não vem.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生は宿題は必要ないと言いました。 (O professor disse que o dever de casa é necessário./O professor perguntou sobre o dever./O professor disse que o dever de casa não é necessário./O professor mandou fazer o dever.)", correctAnswer: "O professor disse que o dever de casa não é necessário.", rationale: "宿題は必要ない (dever não é necessário) + と言いました → disse que não é necessário.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「山田」という名前の人を探しています。 (Estou procurando uma pessoa de nome 'Tanaka'./Estou procurando uma pessoa de nome 'Yamada'./Não conheço ninguém chamado 'Yamada'./A pessoa chamada 'Yamada' está me procurando.)", correctAnswer: "Estou procurando uma pessoa de nome 'Yamada'.", rationale: "「山田」という名前の人 (uma pessoa com o nome 'Yamada') + を探しています (estou procurando).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は疲れたと言って早く帰りました。 (Ele disse que estava com energia e voltou tarde./Ele disse que estava cansado e voltou cedo./Ele não disse nada e voltou cedo./Ele disse que voltaria cedo.)", correctAnswer: "Ele disse que estava cansado e voltou cedo.", rationale: "疲れた (estava cansado) + と言って (dizendo que) + 早く帰りました (voltou cedo).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "何と言いましたか。 (O que você perguntou?/O que você ouviu?/O que você disse?/O que você entendeu?)", correctAnswer: "O que você disse?", rationale: "何と言いましたか → o que você disse? 何と → o quê? と言う → dizer.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は絶対に行くと言っていた。 (Ela estava dizendo que definitivamente não vai./Ela estava dizendo que definitivamente vai./Ela perguntou se poderia ir./Ela disse para que fosse.)", correctAnswer: "Ela estava dizendo que definitivamente vai.", rationale: "絶対に行く (definitivamente vai) + と言っていた → estava dizendo que definitivamente vai.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「すみません」という言葉の意味は？ (Qual é o significado da palavra 'obrigado'?/Qual é o significado da palavra 'tchau'?/Qual é o significado da palavra 'desculpe'?/Qual é o significado da palavra 'olá'?)", correctAnswer: "Qual é o significado da palavra 'desculpe'?", rationale: "「すみません」という言葉の意味 → o significado da palavra 'sumimasen' (desculpe/com licença).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生に「よくできました」と言ってもらいました。 (O professor me disse 'faça melhor'./O professor me disse 'muito bem feito'./O professor não me disse nada./O professor me perguntou algo.)", correctAnswer: "O professor me disse 'muito bem feito'.", rationale: "「よくできました」(muito bem feito) + と言ってもらいました → o professor me disse (e eu recebi o elogio).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼はもう来ないと言っています。 (Ele está dizendo que vai vir./Ele está dizendo que não virá mais./Ele perguntou se pode vir./Ele disse que viria cedo.)", correctAnswer: "Ele está dizendo que não virá mais.", rationale: "もう来ない (não vem mais) + と言っています → está dizendo que não vem mais.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語で「ありがとう」と言えますか。 (Você sabe dizer 'obrigado' em inglês?/Você sabe dizer 'obrigado' em japonês?/Você sabe dizer 'desculpe' em japonês?/Você sabe escrever 'obrigado' em japonês?)", correctAnswer: "Você sabe dizer 'obrigado' em japonês?", rationale: "日本語で (em japonês) + 「ありがとう」と言えますか (consegue dizer 'obrigado'?).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
