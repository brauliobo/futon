title: 📝 ～はずだ — deveria ser/é esperado que
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～はずだ expressa expectativa lógica baseada em conhecimento ou raciocínio: 'deveria ser / é de se esperar'. Forma plain + はずだ. Negativa: ～はずがない (não pode ser / impossível)."
example: "彼は医者のはずだ (ele deveria ser médico). Ex.: ～はずだ → 'é de se esperar que / deveria ser'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: ～はずだ — usos
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "彼は来るはずだ。 (Ele talvez venha./Ele deveria vir (é esperado que venha)./Ele não vai vir./Ouvi que ele vem.)", correctAnswer: "Ele deveria vir (é esperado que venha).", rationale: "彼は来る (ele vir) + はずだ = é esperado que venha/deveria vir. Baseado em conhecimento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "そんなはずがない。 (É de se esperar isso./Talvez seja assim./Isso não pode ser/é impossível./Isso definitivamente é assim.)", correctAnswer: "Isso não pode ser/é impossível.", rationale: "そんな (tal) + はずがない = isso não pode ser/é impossível. ～はずがない: negação forte.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もう着いているはずです。 (Talvez já tenha chegado./É de se esperar que já tenha chegado./Com certeza ainda não chegou./Ouvi que já chegou.)", correctAnswer: "É de se esperar que já tenha chegado.", rationale: "もう着いている (já chegou) + はずです = é de se esperar que já tenha chegado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "難しくないはずだ。 (Deveria ser difícil./Talvez seja fácil./Deveria não ser difícil./Com certeza é difícil.)", correctAnswer: "Deveria não ser difícil.", rationale: "難しくない (não difícil) + はずだ = deveria não ser difícil / é de se esperar que seja fácil.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女はそのことを知っているはずだ。 (Ela talvez saiba./É de se esperar que ela saiba./Ela definitivamente não sabe./Ouvi que ela sabe.)", correctAnswer: "É de se esperar que ela saiba.", rationale: "彼女はそのことを知っている (ela saber) + はずだ = é de se esperar que saiba.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あそこに電話があるはずです。 (Talvez haja um telefone ali./É de se esperar que haja um telefone ali./Com certeza não há telefone./Ouvi que há telefone.)", correctAnswer: "É de se esperar que haja um telefone ali.", rationale: "あそこに電話がある (haver telefone ali) + はずです = deveria haver um telefone ali.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼はもう帰ったはずだ。 (Talvez ele já foi./Deveria ter ido./Com certeza ainda não foi./Sei que ainda não foi.)", correctAnswer: "Deveria ter ido.", rationale: "彼はもう帰った (ele já foi) + はずだ = deveria ter ido já / é de se esperar que já tenha ido.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "こんな簡単なことができないはずがない。 (Talvez não consiga essa coisa fácil./É impossível não conseguir essa coisa fácil./Com certeza não consigo./Deveria não conseguir.)", correctAnswer: "É impossível não conseguir essa coisa fácil.", rationale: "できないはずがない = é impossível não conseguir. はずがない: negação forte de possibilidade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その映画はもう終わっているはずです。 (Talvez o filme já tenha terminado./É de se esperar que o filme já tenha terminado./Com certeza o filme está passando./O filme definitivamente não terminou.)", correctAnswer: "É de se esperar que o filme já tenha terminado.", rationale: "その映画はもう終わっている (o filme já terminou) + はずです = deveria já ter terminado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "こんなにいい人が嘘をつくはずがない。 (Uma pessoa tão boa talvez minta./É de se esperar que uma pessoa tão boa minta./É impossível uma pessoa tão boa mentir./Uma pessoa tão boa definitivamente mente.)", correctAnswer: "É impossível uma pessoa tão boa mentir.", rationale: "嘘をつく (mentir) + はずがない = é impossível/não pode ser que minta. Baseado em caráter.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～はずだ
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "彼は医者のはずだから、薬について知っているでしょう。 (Talvez ele seja médico e saiba sobre remédios./Como é de se esperar que ele seja médico, deve saber sobre remédios./Ele definitivamente não é médico./Ele não sabe sobre remédios.)", correctAnswer: "Como é de se esperar que ele seja médico, deve saber sobre remédios.", rationale: "医者のはずだから (porque é de se esperar que seja médico) + 薬について知っているでしょう.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "地図では10分のはずなのに、もう30分歩いている。 (Embora devesse ser 10 minutos pelo mapa, já ando há 30 minutos./Caminhei 10 minutos como o mapa indicava./O mapa diz 30 minutos e andei 30 minutos./Não consultei o mapa.)", correctAnswer: "Embora devesse ser 10 minutos pelo mapa, já ando há 30 minutos.", rationale: "10分のはずなのに (embora devesse ser 10 minutos) + もう30分歩いている (já ando há 30 minutos).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女がそんなことを言うはずがない。 (É de se esperar que ela diga isso./Talvez ela diga isso./É impossível que ela diga isso./Ela definitivamente disse isso.)", correctAnswer: "É impossível que ela diga isso.", rationale: "そんなことを言う (dizer tal coisa) + はずがない = é impossível que diga. Baseado em caráter.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電話しておいたから、担当者は知っているはずです。 (Não telefonei, então o responsável não sabe./Telefonei com antecedência, então o responsável deveria saber./Talvez o responsável saiba./O responsável definitivamente não sabe.)", correctAnswer: "Telefonei com antecedência, então o responsável deveria saber.", rationale: "電話しておいたから (porque telefonei com antecedência) + 知っているはずです (deveria saber).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題の答えは一つのはずです。 (A resposta desta questão talvez seja uma./É de se esperar que a resposta desta questão seja uma./Esta questão definitivamente tem muitas respostas./Não há resposta para esta questão.)", correctAnswer: "É de se esperar que a resposta desta questão seja uma.", rationale: "答えは一つのはずです = é de se esperar que haja uma resposta. Expectativa baseada em lógica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もうすぐ着くはずですよ。 (Talvez chegue em breve./Definitivamente não chegará em breve./É de se esperar que chegue em breve./Não sei quando chegará.)", correctAnswer: "É de se esperar que chegue em breve.", rationale: "もうすぐ着く (chegar em breve) + はずですよ = deveria chegar em breve. よ = ênfase/informação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その店はまだ開いているはずです。 (A loja talvez esteja aberta./É de se esperar que a loja ainda esteja aberta./A loja definitivamente está fechada./Não sei o horário da loja.)", correctAnswer: "É de se esperar que a loja ainda esteja aberta.", rationale: "まだ開いている (ainda aberta) + はずです = deveria ainda estar aberta. Baseado em horário.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生が言ったことは正しいはずだ。 (O que o professor disse talvez seja correto./O que o professor disse definitivamente está errado./É de se esperar que o que o professor disse seja correto./Não sei se o professor está certo.)", correctAnswer: "É de se esperar que o que o professor disse seja correto.", rationale: "先生が言ったことは正しい (o que o professor disse está correto) + はずだ = deveria estar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は来週来るはずだったのに、キャンセルした。 (Ela deveria vir na semana que vem e veio./Ela deveria ter vindo na semana passada e veio./Ela deveria vir na semana que vem, mas cancelou./Ela cancelou mas depois veio.)", correctAnswer: "Ela deveria vir na semana que vem, mas cancelou.", rationale: "来るはずだったのに (embora devesse vir) + キャンセルした (cancelou). はずだった = expectativa não cumprida.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "こんなに練習したのだから、うまくできるはずだ。 (Treinei tanto, então talvez consiga./Treinei tanto, então definitivamente não consigo./Treinei tanto, então é de se esperar que consiga./Não treinei, então não consigo.)", correctAnswer: "Treinei tanto, então é de se esperar que consiga.", rationale: "こんなに練習した (treinei tanto) + のだから + うまくできるはずだ = deveria conseguir.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
