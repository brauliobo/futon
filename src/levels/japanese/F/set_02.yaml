title: 📝 ～てはいけない vs ～なくてもいい (avançado)
level: 'F'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Revisão avançada: てはいけない (proibição absoluta), なくてもいい (não precisa/dispensa), てもいい (permissão). Em contextos formais, てはなりません é mais forte que てはいけません."
example: "ここに入ってはいけません (proibido entrar aqui). 急がなくてもいいです (não precisa ter pressa). Ex.: Permissão e proibição em contextos formais."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Permissão e proibição avançadas
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "入ってはいけません。 (Pode entrar./Não precisa entrar./É proibido entrar./Entre se quiser.)", correctAnswer: "É proibido entrar.", rationale: "入って (forma-て de 入る) + はいけません = é proibido entrar. てはいけない = proibição.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "急がなくてもいいです。 (Precisa ter pressa./É proibido ter pressa./Pode ter pressa se quiser./Não precisa ter pressa.)", correctAnswer: "Não precisa ter pressa.", rationale: "急がなくて (sem ter pressa) + もいいです = não precisa ter pressa. なくてもいい = dispensa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ここで写真を撮ってはいけません。 (Pode tirar fotos aqui./Não precisa tirar fotos aqui./É proibido tirar fotos aqui./Tire fotos se quiser.)", correctAnswer: "É proibido tirar fotos aqui.", rationale: "写真を撮って + はいけません = é proibido tirar fotos. てはいけない para proibição.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来なくてもいいです。 (Precisa vir./É obrigatório vir./Não precisa vir./É proibido vir.)", correctAnswer: "Não precisa vir.", rationale: "来なくて (sem vir) + もいいです = não precisa vir. なくてもいい = não é obrigatório.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嘘をついてはなりません。 (Pode mentir./Não precisa mentir./Seria bom não mentir./É absolutamente proibido mentir.)", correctAnswer: "É absolutamente proibido mentir.", rationale: "嘘をついて + はなりません = é absolutamente proibido mentir. てはなりません > てはいけない (mais formal/forte).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "全部食べなくてもいいです。 (Precisa comer tudo./É proibido não comer tudo./Não precisa comer tudo./É obrigatório comer tudo.)", correctAnswer: "Não precisa comer tudo.", rationale: "全部食べなくて (sem comer tudo) + もいいです = não precisa comer tudo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "廊下を走ってはいけません。 (Pode correr no corredor./Não precisa correr no corredor./É proibido correr no corredor./Corra no corredor se quiser.)", correctAnswer: "É proibido correr no corredor.", rationale: "廊下を走って + はいけません = é proibido correr no corredor. Regra escolar/institucional.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "スーツを着なくてもいいです。 (Precisa usar terno./É proibido usar terno./Não precisa usar terno./É obrigatório usar terno.)", correctAnswer: "Não precisa usar terno.", rationale: "スーツを着なくて (sem usar terno) + もいいです = não precisa usar terno.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "他の人の物を無断で使ってはいけません。 (Pode usar as coisas dos outros sem permissão./Não precisa usar as coisas dos outros./É proibido usar as coisas dos outros sem permissão./Use as coisas dos outros se quiser.)", correctAnswer: "É proibido usar as coisas dos outros sem permissão.", rationale: "他の人の物を無断で使って + はいけません = proibido usar sem permissão. 無断で = sem permissão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "心配しなくてもいいですよ。 (Precisa se preocupar./É obrigatório se preocupar./É proibido se preocupar./Não precisa se preocupar.)", correctAnswer: "Não precisa se preocupar.", rationale: "心配しなくて + もいいですよ = não precisa se preocupar. よ adiciona ênfase/conforto.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com permissão e proibição avançadas
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "試験中は辞書を使ってはいけません。 (Pode usar dicionário durante a prova./Não precisa usar dicionário./É proibido usar dicionário durante a prova./Use dicionário se quiser.)", correctAnswer: "É proibido usar dicionário durante a prova.", rationale: "試験中は (durante a prova) + 辞書を使ってはいけません (proibido usar dicionário).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明日は休みだから、早く起きなくてもいいです。 (Amanhã é folga, então precisa acordar cedo./Amanhã é folga, então não precisa acordar cedo./Amanhã é dia de trabalho, então acorde cedo./É proibido dormir tarde amanhã.)", correctAnswer: "Amanhã é folga, então não precisa acordar cedo.", rationale: "明日は休みだから (porque amanhã é folga) + 早く起きなくてもいいです (não precisa acordar cedo).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "公園でタバコを吸ってはいけません。 (Pode fumar no parque./Não precisa fumar no parque./É proibido fumar no parque./Fume no parque se quiser.)", correctAnswer: "É proibido fumar no parque.", rationale: "公園で (no parque) + タバコを吸ってはいけません (proibido fumar).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "全員が参加しなくてもいいです。 (Todos precisam participar./É proibido não participar./Não é necessário que todos participem./Todos são obrigados a participar.)", correctAnswer: "Não é necessário que todos participem.", rationale: "全員が参加しなくて (sem todos participarem) + もいいです = não é necessário.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "人のプライバシーを侵害してはなりません。 (Pode invadir a privacidade alheia./Não precisa respeitar a privacidade./Seria bom respeitar a privacidade./É absolutamente proibido invadir a privacidade alheia.)", correctAnswer: "É absolutamente proibido invadir a privacidade alheia.", rationale: "人のプライバシーを侵害して + はなりません = absolutamente proibido. てはなりません: forte proibição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お金がなくてもここには入ってもいいです。 (Mesmo sem dinheiro, não pode entrar./Precisa de dinheiro para entrar./Mesmo sem dinheiro, pode entrar aqui./É proibido entrar sem dinheiro.)", correctAnswer: "Mesmo sem dinheiro, pode entrar aqui.", rationale: "お金がなくても (mesmo sem dinheiro) + ここには入ってもいいです (pode entrar aqui).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "授業中は携帯を使ってはいけません。 (Pode usar o celular durante a aula./Não precisa usar o celular./É proibido usar o celular durante a aula./Use o celular se quiser.)", correctAnswer: "É proibido usar o celular durante a aula.", rationale: "授業中は (durante a aula) + 携帯を使ってはいけません (proibido usar o celular).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "プレゼントは高くなくてもいいです。 (O presente precisa ser caro./O presente precisa ser barato./O presente não precisa ser caro./O presente deve ser caro.)", correctAnswer: "O presente não precisa ser caro.", rationale: "プレゼントは高くなくて + もいいです = o presente não precisa ser caro.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "絶対に諦めてはいけません。 (Pode desistir quando quiser./Não precisa desistir./Seria bom não desistir./Absolutamente não pode desistir.)", correctAnswer: "Absolutamente não pode desistir.", rationale: "絶対に (absolutamente) + 諦めてはいけません (não pode desistir).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書類は漢字で書かなくてもいいです。 (Os documentos precisam ser escritos em kanji./Os documentos não precisam ser escritos em kanji./É proibido escrever documentos em kanji./Os documentos devem ser escritos em kanji.)", correctAnswer: "Os documentos não precisam ser escritos em kanji.", rationale: "書類は漢字で書かなくて + もいいです = não precisa escrever em kanji.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
