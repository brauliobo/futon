title: 📝 ～ばかり — só faz isso / acabou de
level: 'E'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～ばかり tem três usos: (1) só/apenas (quantidade excessiva: 甘いものばかり食べる); (2) acabou de (forma passada + ばかり: 来たばかり); (3) aproximação (三時間ばかり = cerca de 3 horas)."
example: "来たばかりです (acabou de chegar). 甘いものばかり食べる (só come doce). Ex.: ～ばかり → 'acabou de / só faz isso'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: ～ばかり — usos
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "来たばかりです。 (Já foi embora./Vai chegar em breve./Está prestes a chegar./Acabou de chegar.)", correctAnswer: "Acabou de chegar.", rationale: "来た (chegou, forma passada) + ばかりです = acabou de chegar. Forma passada + ばかり = recência.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "甘いものばかり食べる。 (Não come nada doce./Come doce de vez em quando./Come todo tipo de coisa./Só come coisas doces.)", correctAnswer: "Só come coisas doces.", rationale: "甘いもの (coisa doce) + ばかり + 食べる = só come coisas doces. Exclusividade excessiva.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "買ったばかりです。 (Vai comprar em breve./Está prestes a comprar./Comprou há muito tempo./Acabou de comprar.)", correctAnswer: "Acabou de comprar.", rationale: "買った (comprou) + ばかりです = acabou de comprar. Ação muito recente.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ゲームばかりしている。 (Não joga jogos./Joga jogos de vez em quando./Só fica jogando jogos (excessivo)./Joga jogos entre outras atividades.)", correctAnswer: "Só fica jogando jogos (excessivo).", rationale: "ゲーム (jogos) + ばかり + している = só fica jogando. ばかり para ação excessiva.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "起きたばかりです。 (Vai acordar em breve./Está prestes a acordar./Dormiu há muito./Acabou de acordar.)", correctAnswer: "Acabou de acordar.", rationale: "起きた (acordou) + ばかりです = acabou de acordar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "文句ばかり言う。 (Não reclama nunca./Reclama de vez em quando./Só fica reclamando./Reclamar é bom.)", correctAnswer: "Só fica reclamando.", rationale: "文句 (reclamação) + ばかり + 言う = só fica reclamando. Comportamento excessivo.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "三時間ばかり (exatamente 3 horas/mais de 3 horas/menos de uma hora/cerca de 3 horas)", correctAnswer: "cerca de 3 horas", rationale: "三時間 (3 horas) + ばかり = cerca de 3 horas. ばかり para aproximação numérica.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "卒業したばかりです。 (Vai se formar em breve./Está prestes a se formar./Acabou de se formar./Se formou há muito tempo.)", correctAnswer: "Acabou de se formar.", rationale: "卒業した (se formou) + ばかりです = acabou de se formar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "テレビばかり見ている。 (Não assiste TV./Assiste TV de vez em quando./Só fica assistindo TV./Assiste TV entre outras atividades.)", correctAnswer: "Só fica assistindo TV.", rationale: "テレビ (TV) + ばかり + 見ている = só fica assistindo TV. Hábito excessivo.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "始まったばかりです。 (Vai começar em breve./Acabou de terminar./Está prestes a começar./Acabou de começar.)", correctAnswer: "Acabou de começar.", rationale: "始まった (começou) + ばかりです = acabou de começar.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～ばかり
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "日本に来たばかりで、まだ何も分かりません。 (Já estou no Japão há muito tempo, mas ainda não entendo nada./Acabei de chegar ao Japão e ainda não entendo nada./Vou ao Japão em breve e não entenderei nada./Estou no Japão há anos e já entendo tudo.)", correctAnswer: "Acabei de chegar ao Japão e ainda não entendo nada.", rationale: "日本に来たばかりで (acabei de chegar ao Japão) + まだ何も分かりません (ainda não entendo nada).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼はゲームばかりしていて勉強しません。 (Ele estuda bastante e não joga jogos./Ele joga de vez em quando e estuda./Ele só fica jogando e não estuda./Ele não joga nem estuda.)", correctAnswer: "Ele só fica jogando e não estuda.", rationale: "ゲームばかりしていて (só fica jogando) + 勉強しません (não estuda).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この車を買ったばかりです。 (Vou comprar este carro em breve./Quero comprar este carro./Comprei este carro há muito tempo./Acabei de comprar este carro.)", correctAnswer: "Acabei de comprar este carro.", rationale: "この車を (este carro) + 買ったばかりです (acabei de comprar).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "甘いものばかり食べると太りますよ。 (Se comer de tudo, você engorda./Se comer saudável, você engorda./Se só comer doce, você engorda./Comer doce não engorda.)", correctAnswer: "Se só comer doce, você engorda.", rationale: "甘いものばかり食べると (se só comer doce) + 太りますよ (engorda). と = resultado natural.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "まだ始まったばかりですから、あきらめないでください。 (Já está quase no fim, então desista./Acabou de começar, então não desista./Está no meio, então seja paciente./Terminou, então pode descansar.)", correctAnswer: "Acabou de começar, então não desista.", rationale: "始まったばかりですから (porque acabou de começar) + あきらめないでください (não desista).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "文句ばかり言わないで、自分でやってみてください。 (Reclame bastante e tente fazer você mesmo./Em vez de ficar só reclamando, tente fazer você mesmo./Não tente fazer e continue reclamando./Reclame bastante para que alguém faça.)", correctAnswer: "Em vez de ficar só reclamando, tente fazer você mesmo.", rationale: "文句ばかり言わないで (em vez de só reclamar) + 自分でやってみてください (tente fazer você mesmo).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "結婚したばかりです。 (Vai se casar em breve./Quer se casar./Acabou de se casar./Já está casado há muitos anos.)", correctAnswer: "Acabou de se casar.", rationale: "結婚した (casou) + ばかりです = acabou de se casar. Ação muito recente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "心配ばかりしていても、何も変わりません。 (Se se preocupar um pouco, tudo muda./Se só ficar se preocupando, nada muda./A preocupação resolve problemas./Não se preocupar não muda nada.)", correctAnswer: "Se só ficar se preocupando, nada muda.", rationale: "心配ばかりしていても (mesmo que só fique se preocupando) + 何も変わりません (nada muda).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは新しく出たばかりの映画です。 (Este é um filme que vai ser lançado em breve./Este é um filme antigo./Este é um filme que acabou de ser lançado./Este é um filme clássico.)", correctAnswer: "Este é um filme que acabou de ser lançado.", rationale: "新しく出た (foi recém-lançado) + ばかりの映画 (filme que acabou de ser lançado).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べたばかりなのに、もうお腹が空いた。 (Já faz tempo desde que comi e estou com fome./Acabei de comer e já estou com fome./Não comi nada e estou com fome./Comi há horas e não estou com fome.)", correctAnswer: "Acabei de comer e já estou com fome.", rationale: "食べたばかりなのに (mesmo tendo acabado de comer) + もうお腹が空いた (já estou com fome).", difficulty: 4, objectives: [japanese.grammar] }
target: 20
