title: 📝 ～ところ — está prestes a / acabou de / em processo
level: 'E'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～ところ indica o momento exato de uma ação. Dicionário + ところ = prestes a fazer. ている + ところ = em processo de fazer. た + ところ = acabou de fazer."
example: "今食べるところです (estou prestes a comer). 今食べているところです (estou comendo neste momento). 食べたところです (acabei de comer). Ex.: ～ところ → momento exato da ação."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: ～ところ — três fases
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "食べるところです。 (Estou comendo agora./Acabei de comer./Estou prestes a comer./Comi há pouco.)", correctAnswer: "Estou prestes a comer.", rationale: "食べる (dicionário) + ところです = estou prestes a comer. Dicionário + ところ = iminência.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べているところです。 (Estou prestes a comer./Acabei de comer./Estou comendo neste exato momento./Comi ontem.)", correctAnswer: "Estou comendo neste exato momento.", rationale: "食べている (progressivo) + ところです = estou comendo agora. ている + ところ = em processo.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べたところです。 (Estou prestes a comer./Estou comendo agora./Acabei de comer./Comi há horas.)", correctAnswer: "Acabei de comer.", rationale: "食べた (passado) + ところです = acabei de comer. Forma passada + ところ = recência.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "出かけるところです。 (Acabei de sair./Estou saindo neste momento./Estou prestes a sair./Saí há horas.)", correctAnswer: "Estou prestes a sair.", rationale: "出かける (dicionário) + ところです = estou prestes a sair. Dicionário + ところ.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "勉強しているところです。 (Estou prestes a estudar./Estou estudando neste exato momento./Acabei de estudar./Estudei ontem.)", correctAnswer: "Estou estudando neste exato momento.", rationale: "勉強している (progressivo) + ところです = estou estudando agora.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "帰ったところです。 (Estou prestes a voltar./Estou voltando agora./Acabei de voltar./Voltei ontem.)", correctAnswer: "Acabei de voltar.", rationale: "帰った (voltou) + ところです = acabei de voltar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "起きるところです。 (Acabei de acordar./Estou acordando agora./Estou prestes a acordar./Acordei há horas.)", correctAnswer: "Estou prestes a acordar.", rationale: "起きる (dicionário) + ところです = estou prestes a acordar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会議をしているところです。 (Estou prestes a ter uma reunião./Estou em reunião neste exato momento./Acabei de ter uma reunião./Tive reunião ontem.)", correctAnswer: "Estou em reunião neste exato momento.", rationale: "会議をしている (estando em reunião) + ところです = estou em reunião agora.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "着いたところです。 (Estou prestes a chegar./Estou chegando agora./Acabei de chegar./Cheguei há muito tempo.)", correctAnswer: "Acabei de chegar.", rationale: "着いた (chegou) + ところです = acabei de chegar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電話するところでした。 (Estava prestes a telefonar./Estava telefonando./Acabei de telefonar./Telefonei ontem.)", correctAnswer: "Estava prestes a telefonar.", rationale: "電話する (dicionário) + ところでした = estava prestes a telefonar. Passado de ところです.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～ところ
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "今から出かけるところです。 (Acabei de sair./Estou saindo neste momento./Estou prestes a sair agora./Saí há horas.)", correctAnswer: "Estou prestes a sair agora.", rationale: "今から (agora) + 出かけるところです (estou prestes a sair).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ちょうど昼ご飯を食べているところです。 (Acabei de almoçar./Estou prestes a almoçar./Estou almoçando neste exato momento./Almocei ontem.)", correctAnswer: "Estou almoçando neste exato momento.", rationale: "ちょうど (exatamente/justamente) + 食べているところです (estou comendo neste momento).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "さっき駅に着いたところです。 (Cheguei na estação há horas./Estou prestes a chegar na estação./Estou chegando na estação agora./Acabei de chegar na estação agora mesmo.)", correctAnswer: "Acabei de chegar na estação agora mesmo.", rationale: "さっき (há pouco) + 駅に着いたところです (acabei de chegar na estação).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "今レポートを書いているところです。 (Acabei de escrever o relatório./Estou prestes a escrever o relatório./Estou escrevendo o relatório neste momento./Escrevi o relatório ontem.)", correctAnswer: "Estou escrevendo o relatório neste momento.", rationale: "レポートを書いているところです = estou escrevendo o relatório agora.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ちょうど寝るところでした。 (Estava dormindo quando você ligou./Acabei de dormir quando você ligou./Estava prestes a dormir quando você ligou./Acordei quando você ligou.)", correctAnswer: "Estava prestes a dormir quando você ligou.", rationale: "ちょうど寝るところでした = estava prestes a dormir. Dicionário + ところでした.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "田中さんが来たところです。 (O Tanaka está prestes a chegar./O Tanaka está chegando agora./O Tanaka acabou de chegar./O Tanaka chegou ontem.)", correctAnswer: "O Tanaka acabou de chegar.", rationale: "田中さんが来た (o Tanaka chegou) + ところです = o Tanaka acabou de chegar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "今から発表するところです。 (Acabei de apresentar./Estou apresentando agora./Estou prestes a apresentar./Apresentei ontem.)", correctAnswer: "Estou prestes a apresentar.", rationale: "今から (agora) + 発表するところです (estou prestes a apresentar).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "丁度電話しているところです。 (Estou prestes a telefonar./Acabei de telefonar./Estou telefonando neste exato momento./Telefonei há horas.)", correctAnswer: "Estou telefonando neste exato momento.", rationale: "丁度 (exatamente) + 電話しているところです = estou telefonando agora.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "今宿題が終わったところです。 (Estou prestes a terminar o dever./Estou terminando o dever agora./Acabei de terminar o dever./Terminei o dever ontem.)", correctAnswer: "Acabei de terminar o dever.", rationale: "宿題が終わった (o dever terminou) + ところです = acabei de terminar o dever.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あなたに電話するところでした。 (Acabei de te telefonar./Estava te telefonando./Estava prestes a te telefonar./Te telefonei ontem.)", correctAnswer: "Estava prestes a te telefonar.", rationale: "あなたに電話する (telefonar para você) + ところでした = estava prestes a te telefonar.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
