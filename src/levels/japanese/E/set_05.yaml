title: 📝 Causativo-passivo — ～させられる
level: 'E'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "O causativo-passivo combina causativa + passiva: 'ser forçado a fazer'. Grupo 1: -u → -asareru. Grupo 2: -ru → -saserareru. Expressa sofrimento por ser obrigado a fazer algo."
example: "野菜を食べさせられた。 Ex.: ～させられる → 'ser forçado/obrigado a fazer algo'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Formação do causativo-passivo
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "食べさせられた (foi forçado a comer/comeu voluntariamente/foi forçado a não comer/comeu por obrigação própria)", correctAnswer: "foi forçado a comer", rationale: "食べさせられた = causativa (させ) + passiva (られ) = foi forçado a comer por alguém.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行かされた (foi proibido de ir/foi forçado a ir/foi impedido de ir/foi voluntariamente)", correctAnswer: "foi forçado a ir", rationale: "行かされた = 行かせられた (forma contraída). Foi mandado/forçado a ir.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "飲まされた (foi proibido de beber/recusou beber/foi forçado a beber/bebeu voluntariamente)", correctAnswer: "foi forçado a beber", rationale: "飲まされた = 飲まされる (forma past). Foi forçado a beber. Forma contraída de 飲ませられた.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "働かされた (trabalhou por vontade própria/foi proibido de trabalhar/foi forçado a trabalhar/escolheu trabalhar)", correctAnswer: "foi forçado a trabalhar", rationale: "働かされた = causativo-passivo de 働く (trabalhar). Foi forçado/mandado a trabalhar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "待たされた (esperou voluntariamente/foi forçado a esperar/foi proibido de esperar/foi dispensado de esperar)", correctAnswer: "foi forçado a esperar", rationale: "待たされた = causativo-passivo de 待つ (esperar). Foi forçado/obrigado a esperar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "させられた (fez voluntariamente/foi proibido de fazer/foi forçado a fazer/escolheu fazer)", correctAnswer: "foi forçado a fazer", rationale: "させられた = causativo-passivo de する. Foi forçado a fazer.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "歌わされた (cantou voluntariamente/foi proibido de cantar/foi forçado a cantar/escolheu cantar)", correctAnswer: "foi forçado a cantar", rationale: "歌わされた = causativo-passivo de 歌う (cantar). Foi forçado a cantar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書かされた (escreveu voluntariamente/foi proibido de escrever/foi forçado a escrever/escolheu escrever)", correctAnswer: "foi forçado a escrever", rationale: "書かされた = causativo-passivo de 書く. Foi forçado a escrever.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "読まされた (leu voluntariamente/foi proibido de ler/foi forçado a ler/escolheu ler)", correctAnswer: "foi forçado a ler", rationale: "読まされた = causativo-passivo de 読む. Foi forçado/obrigado a ler.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "走らされた (correu voluntariamente/foi proibido de correr/foi forçado a correr/escolheu correr)", correctAnswer: "foi forçado a correr", rationale: "走らされた = causativo-passivo de 走る. Foi forçado a correr.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com causativo-passivo
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "子供の頃、嫌いな野菜を食べさせられた。 (Na infância, escolhi comer legumes que não gostava./Na infância, fui forçado a comer legumes que não gostava./Na infância, proibiram-me de comer legumes./Na infância, gostava de legumes.)", correctAnswer: "Na infância, fui forçado a comer legumes que não gostava.", rationale: "嫌いな野菜を (legumes que não gosto) + 食べさせられた (fui forçado a comer). Lamento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生に長い文章を読まされました。 (Escolhi ler um texto longo para o professor./O professor me proibiu de ler o texto./Fui forçado pelo professor a ler um texto longo./Li voluntariamente um texto longo.)", correctAnswer: "Fui forçado pelo professor a ler um texto longo.", rationale: "先生に (pelo professor) + 長い文章を読まされました (fui forçado a ler). に = agente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "残業を2時間させられました。 (Escolhi fazer 2 horas extra./Fui proibido de fazer hora extra./Fui forçado a fazer 2 horas extra./Fiz hora extra voluntariamente.)", correctAnswer: "Fui forçado a fazer 2 horas extra.", rationale: "残業を2時間 (2 horas extra) + させられました (fui forçado a fazer). Causativo-passivo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "バスを1時間待たされました。 (Escolhi esperar o ônibus por 1 hora./Fui proibido de esperar o ônibus./Fui forçado a esperar o ônibus por 1 hora./Esperé voluntariamente o ônibus.)", correctAnswer: "Fui forçado a esperar o ônibus por 1 hora.", rationale: "バスを (o ônibus) + 1時間待たされました (fui forçado a esperar por 1 hora).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会社で嫌な仕事をさせられています。 (Escolho fazer trabalho desagradável na empresa./Sou proibido de trabalhar na empresa./Sou forçado a fazer trabalho desagradável na empresa./Faço voluntariamente trabalho desagradável.)", correctAnswer: "Sou forçado a fazer trabalho desagradável na empresa.", rationale: "会社で (na empresa) + 嫌な仕事をさせられています (sou forçado a fazer trabalho desagradável).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供の頃、毎日練習させられました。 (Na infância, escolhi praticar todo dia./Na infância, me proibiram de praticar./Na infância, fui forçado a praticar todo dia./Na infância, gostava de praticar.)", correctAnswer: "Na infância, fui forçado a praticar todo dia.", rationale: "毎日 (todo dia) + 練習させられました (fui forçado a praticar).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "部長に会議で発表させられた。 (Escolhi apresentar na reunião./Fui proibido de apresentar./O chefe me forçou a apresentar na reunião./Apresentei voluntariamente na reunião.)", correctAnswer: "O chefe me forçou a apresentar na reunião.", rationale: "部長に (pelo chefe) + 会議で (na reunião) + 発表させられた (fui forçado a apresentar).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嫌いな歌を歌わされました。 (Escolhi cantar uma música que não gosto./Fui proibido de cantar./Fui forçado a cantar uma música que não gosto./Cantei voluntariamente.)", correctAnswer: "Fui forçado a cantar uma música que não gosto.", rationale: "嫌いな歌を (música que não gosto) + 歌わされました (fui forçado a cantar).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たくさんの宿題をやらされた。 (Escolhi fazer muito dever de casa./Fui proibido de fazer dever./Fui forçado a fazer muito dever de casa./Fiz voluntariamente muito dever.)", correctAnswer: "Fui forçado a fazer muito dever de casa.", rationale: "たくさんの宿題を (muito dever) + やらされた (fui forçado a fazer).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "雨の中を走らされた。 (Escolhi correr na chuva./Fui proibido de correr./Fui forçado a correr na chuva./Corri voluntariamente na chuva.)", correctAnswer: "Fui forçado a correr na chuva.", rationale: "雨の中を (na chuva) + 走らされた (fui forçado a correr). Causativo-passivo com sofrimento.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
