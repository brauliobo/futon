title: 📝 Causativo-passivo — ～させられる
level: 'E'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "O causativo-passivo combina causativa + passiva: 'ser forçado a fazer'. Grupo 1: -u → -asareru. Grupo 2: -ru → -saserareru. Expressa sofrimento por ser obrigado a fazer algo."
example: "野菜を食べさせられた。 Ex.: ～させられる → 'ser forçado/obrigado a fazer algo'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Formação do causativo-passivo
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "食べさせられた (foi forçado a comer/comeu voluntariamente/foi forçado a não comer/comeu por obrigação própria)", correctAnswer: "foi forçado a comer", rationale: "食べる(G2) → causativa: 食べ+させる → passiva: 食べさせ+られる → passado: 食べさせられた = foi forçado a comer.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行かされた (foi proibido de ir/foi forçado a ir/foi impedido de ir/foi voluntariamente)", correctAnswer: "foi forçado a ir", rationale: "行く(G1, -く) → causativa: 行か+せる → passiva contraída: 行か+される → passado: 行かされた. Contração de 行かせられた.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "飲まされた (bebeu voluntariamente/foi proibido de beber/recusou beber/foi forçado a beber)", correctAnswer: "foi forçado a beber", rationale: "飲む(G1, -む) → causativa: 飲ま+せる → passiva contraída: 飲ま+される → passado: 飲まされた. Contração de 飲ませられた.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "働かされた (escolheu trabalhar/trabalhou por vontade própria/foi proibido de trabalhar/foi forçado a trabalhar)", correctAnswer: "foi forçado a trabalhar", rationale: "働く(G1, -く) → causativa: 働か+せる → passiva contraída: 働か+される → passado: 働かされた = foi forçado a trabalhar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "待たされた (esperou voluntariamente/foi forçado a esperar/foi proibido de esperar/foi dispensado de esperar)", correctAnswer: "foi forçado a esperar", rationale: "待つ(G1, -つ) → causativa: 待た+せる → passiva contraída: 待た+される → passado: 待たされた = foi obrigado a esperar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "させられた (escolheu fazer/fez voluntariamente/foi proibido de fazer/foi forçado a fazer)", correctAnswer: "foi forçado a fazer", rationale: "する(irregular) → causativa: させる → passiva: させ+られる → passado: させられた = foi forçado a fazer.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "歌わされた (cantou voluntariamente/foi proibido de cantar/foi forçado a cantar/escolheu cantar)", correctAnswer: "foi forçado a cantar", rationale: "歌う(G1, -う) → causativa: 歌わ+せる → passiva contraída: 歌わ+される → passado: 歌わされた = foi forçado a cantar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書かされた (escreveu voluntariamente/foi proibido de escrever/foi forçado a escrever/escolheu escrever)", correctAnswer: "foi forçado a escrever", rationale: "書く(G1, -く) → causativa: 書か+せる → passiva contraída: 書か+される → passado: 書かされた = foi forçado a escrever.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "読まされた (leu voluntariamente/foi proibido de ler/foi forçado a ler/escolheu ler)", correctAnswer: "foi forçado a ler", rationale: "読む(G1, -む) → causativa: 読ま+せる → passiva contraída: 読ま+される → passado: 読まされた = foi obrigado a ler.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "走らされた (correu voluntariamente/foi proibido de correr/foi forçado a correr/escolheu correr)", correctAnswer: "foi forçado a correr", rationale: "走る(G1, -る) → causativa: 走ら+せる → passiva contraída: 走ら+される → passado: 走らされた = foi forçado a correr.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com causativo-passivo
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "子供の頃、嫌いな野菜を食べさせられた。 (Na infância, escolhi comer legumes que não gostava./Na infância, fui forçado a comer legumes que não gostava./Na infância, proibiram-me de comer legumes./Na infância, gostava de legumes.)", correctAnswer: "Na infância, fui forçado a comer legumes que não gostava.", rationale: "食べる → 食べさせられた(caus.-pass.). 嫌いな野菜(legumes que odeio) + 食べさせられた → forçado a comer; に marks agent when present.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生に長い文章を読まされました。 (Escolhi ler um texto longo para o professor./O professor me proibiu de ler o texto./Fui forçado pelo professor a ler um texto longo./Li voluntariamente um texto longo.)", correctAnswer: "Fui forçado pelo professor a ler um texto longo.", rationale: "先生に(に=agente causador) + 長い文章を(objeto) + 読まされました(読む→読まされる). Agente obrigatório marcado com に.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "残業を2時間させられました。 (Escolhi fazer 2 horas extra./Fui proibido de fazer hora extra./Fui forçado a fazer 2 horas extra./Fiz hora extra voluntariamente.)", correctAnswer: "Fui forçado a fazer 2 horas extra.", rationale: "する → させられる(caus.-pass.). 残業(hora extra) + 2時間 + させられました → fui obrigado a fazer 2h extra.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "バスを1時間待たされました。 (Escolhi esperar o ônibus por 1 hora./Fui proibido de esperar o ônibus./Fui forçado a esperar o ônibus por 1 hora./Esperé voluntariamente o ônibus.)", correctAnswer: "Fui forçado a esperar o ônibus por 1 hora.", rationale: "待つ → 待たされる(caus.-pass.). バス(ônibus) + 1時間(duração) + 待たされました → fui obrigado a esperar 1h.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会社で嫌な仕事をさせられています。 (Escolho fazer trabalho desagradável na empresa./Sou proibido de trabalhar na empresa./Sou forçado a fazer trabalho desagradável na empresa./Faço voluntariamente trabalho desagradável.)", correctAnswer: "Sou forçado a fazer trabalho desagradável na empresa.", rationale: "する → させられる(caus.-pass.) + ている(contínuo). 会社で + 嫌な仕事を + させられています → situação contínua de ser forçado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供の頃、毎日練習させられました。 (Na infância, escolhi praticar todo dia./Na infância, me proibiram de praticar./Na infância, fui forçado a praticar todo dia./Na infância, gostava de praticar.)", correctAnswer: "Na infância, fui forçado a praticar todo dia.", rationale: "練習する → 練習させられる(caus.-pass.). 毎日(frequência) + 練習させられました → fui obrigado a praticar todos os dias.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "部長に会議で発表させられた。 (Escolhi apresentar na reunião./Fui proibido de apresentar./O chefe me forçou a apresentar na reunião./Apresentei voluntariamente na reunião.)", correctAnswer: "O chefe me forçou a apresentar na reunião.", rationale: "発表する → 発表させられる(caus.-pass.). 部長に(agente=chefe) + 会議で(local) + 発表させられた → chefe me forçou a apresentar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嫌いな歌を歌わされました。 (Escolhi cantar uma música que não gosto./Fui proibido de cantar./Fui forçado a cantar uma música que não gosto./Cantei voluntariamente.)", correctAnswer: "Fui forçado a cantar uma música que não gosto.", rationale: "歌う → 歌わされる(caus.-pass. contraída). 嫌いな歌を(objeto=música odiada) + 歌わされました → forçado a cantar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たくさんの宿題をやらされた。 (Escolhi fazer muito dever de casa./Fui proibido de fazer dever./Fui forçado a fazer muito dever de casa./Fiz voluntariamente muito dever.)", correctAnswer: "Fui forçado a fazer muito dever de casa.", rationale: "やる → やらされる(caus.-pass. contraída). たくさんの宿題(volume) + やらされた → forçado a fazer muito dever.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "雨の中を走らされた。 (Escolhi correr na chuva./Fui proibido de correr./Fui forçado a correr na chuva./Corri voluntariamente na chuva.)", correctAnswer: "Fui forçado a correr na chuva.", rationale: "走る → 走らされる(caus.-pass. contraída). 雨の中(condição adversa) + 走らされた → sofrimento por ser forçado a correr na chuva.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
