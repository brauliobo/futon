title: 📝 ～しか～ない — só / apenas
level: 'E'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～しか～ない (somente/apenas) indica exclusividade com ênfase na limitação. Ao contrário de ～だけ, ～しか sempre requer verbo negativo. Expressa insuficiência ou exclusividade negativa."
example: "百円しかない。 Ex.: ～しか～ない → 'só tem/só resta (com limitação lamentável)'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: ～しか～ない — usos
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "百円しかない。 (Tenho cem ienes e sobra./Tenho muitos ienes./Só tenho cem ienes./Tenho pelo menos cem ienes.)", correctAnswer: "Só tenho cem ienes.", rationale: "Regra: X + しか + 動詞ない → somente X (com lamento/limitação). 百円 → しか → ない = exclusão lamenta.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "一つしかない。 (Tenho muitos./Não tenho nenhum./Tenho pelo menos um./Só tenho um.)", correctAnswer: "Só tenho um.", rationale: "Regra: 数量 + しか + ない → escassez lamentada. 一つ → しか → ない = quantidade insuficiente.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語しか話せない。 (Não falo japonês./Falo muitas línguas./Só sei falar japonês./Falo japonês entre outras línguas.)", correctAnswer: "Só sei falar japonês.", rationale: "Regra: 対象 + しか + 動詞ない → apenas isso, nada mais. 日本語 → しか → 話せない = habilidade limitada.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "三人しか来なかった。 (Ninguém veio./Muitas pessoas vieram./Vieram pelo menos três./Só três pessoas vieram.)", correctAnswer: "Só três pessoas vieram.", rationale: "三人(três pessoas) + しか + 来なかった(não vieram) → poucos/lamentável. しか marca insuficiência.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "水しか飲まない。 (Não bebo nada./Bebo muitas coisas./Só bebo água./Bebo água entre outras coisas.)", correctAnswer: "Só bebo água.", rationale: "水(água) + しか + 飲まない → exclusão de tudo menos água. しか = exclusividade (positiva ou limitante).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あなたしかいない。 (Não há ninguém./Há muitas pessoas./Você está aqui entre outros./Só há você.)", correctAnswer: "Só há você.", rationale: "あなた + しか + いない → você é o único. Expressão afetiva: exclusividade enfatizada por しか.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "五分しかない。 (Tenho muito tempo./Tenho pelo menos 5 minutos./Só tenho 5 minutos./Não tenho nenhum tempo.)", correctAnswer: "Só tenho 5 minutos.", rationale: "五分(5 min) + しか + ない → tempo escasso/lamentado. しか + ない reforça a insuficiência.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "一回しか行ったことがない。 (Nunca fui./Fui muitas vezes./Só fui uma vez./Fui pelo menos uma vez.)", correctAnswer: "Só fui uma vez.", rationale: "一回(uma vez) + しか + 行ったことがない → experiência muito limitada. しか lamenta a raridade.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これしかできない。 (Não consigo fazer nada./Consigo fazer muitas coisas./Consigo fazer pelo menos isso./Só consigo fazer isso.)", correctAnswer: "Só consigo fazer isso.", rationale: "これ + しか + できない → capacidade restrita. しか + 可能形ない = apenas esta habilidade disponível.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ひらがなしか書けない。 (Não sei escrever nada./Escrevo muitos alfabetos./Só sei escrever hiragana./Escrevo hiragana entre outros.)", correctAnswer: "Só sei escrever hiragana.", rationale: "ひらがな + しか + 書けない → habilidade escrita limitada. 書ける(conseguir escrever) → ない = negativa de capacidade.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～しか～ない
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "財布に千円しかありません。 (Tenho muito dinheiro na carteira./Tenho pelo menos mil ienes./Não tenho dinheiro./Só tenho mil ienes na carteira.)", correctAnswer: "Só tenho mil ienes na carteira.", rationale: "財布(carteira) + 千円(1000 ienes) + しか + ありません → quantia insuficiente lamentada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このクラスには五人しかいません。 (Há muitos alunos nesta turma./Não há alunos nesta turma./Esta turma tem pelo menos cinco alunos./Só há cinco alunos nesta turma.)", correctAnswer: "Só há cinco alunos nesta turma.", rationale: "このクラス(esta turma) + 五人(5 pessoas) + しか + いません → número lamentavelmente pequeno.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼のことしか考えられない。 (Não consigo pensar nele./Consigo pensar em muitas coisas./Só consigo pensar nele./Penso nele entre outras coisas.)", correctAnswer: "Só consigo pensar nele.", rationale: "彼のこと(sobre ele) + しか + 考えられない(não consigo pensar em outra coisa) → exclusividade amorosa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "答えはこれしかありません。 (Não há resposta./Há muitas respostas./A resposta correta é uma de muitas./Só esta é a resposta.)", correctAnswer: "Só esta é a resposta.", rationale: "答え(resposta) + これ + しか + ありません → uma única possibilidade válida.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "一時間しか寝られなかった。 (Dormi muito./Não dormi nada./Dormi pelo menos uma hora./Só consegui dormir uma hora.)", correctAnswer: "Só consegui dormir uma hora.", rationale: "一時間(1 hora) + しか + 寝られなかった(não consegui dormir) → sono muito insuficiente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この映画はここでしか見られない。 (Este filme pode ser visto em todo lugar./Este filme não pode ser visto aqui./Este filme só pode ser visto aqui./Este filme não está disponível.)", correctAnswer: "Este filme só pode ser visto aqui.", rationale: "ここで(aqui) + しか + 見られない → exclusividade de lugar. しか + 場所 + 動詞ない = só neste local.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語はひらがなしか読めません。 (Leio todo o japonês./Não sei ler japonês./Só sei ler hiragana em japonês./Leio hiragana e kanji.)", correctAnswer: "Só sei ler hiragana em japonês.", rationale: "ひらがな + しか + 読めません → limitação de leitura. 読める(conseguir ler) → negativa = capacidade restrita.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女しか知らない秘密です。 (Ninguém sabe o segredo./Todos sabem o segredo./É um segredo que só ela sabe./Ela não sabe o segredo.)", correctAnswer: "É um segredo que só ela sabe.", rationale: "彼女(ela) + しか + 知らない(não sabe→só ela sabe) + 秘密(segredo) → しか inverte: só ela = todos os outros não.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あと十分しかありません。 (Ainda há muito tempo./Não há tempo nenhum./Ainda há pelo menos 10 minutos./Só restam 10 minutos.)", correctAnswer: "Só restam 10 minutos.", rationale: "あと(ainda/restam) + 十分(10 minutos) + しか + ありません → urgência, tempo escasso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "一つしか選べません。 (Pode selecionar muitas opções./Não pode selecionar nenhuma./Pode selecionar pelo menos uma./Só pode selecionar uma opção.)", correctAnswer: "Só pode selecionar uma opção.", rationale: "一つ(um) + しか + 選べません(não pode escolher mais) → restrição de quantidade na seleção.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
