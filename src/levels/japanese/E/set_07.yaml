title: 🔢 Kanji N4 — 仕事会社社員 (trabalho)
level: 'E'
subject: japanese
objectives: [japanese.kanji]
difficulty: 4
authorNotes: "Kanji de trabalho N4: 仕 (servir), 事 (coisa/assunto), 会 (reunião/encontro), 社 (empresa/sociedade), 員 (membro), 給 (salário), 休 (descanso), 働 (trabalhar)."
example: "会社に勤める = trabalhar numa empresa. Ex.: 仕事会社社員 → kanji do mundo do trabalho."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Kanji de trabalho — leitura
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "仕事 (descanso/hobby/trabalho/viagem)", correctAnswer: "trabalho", rationale: "仕事 (しごと) → trabalho/emprego. Ex.: 仕事をする (trabalhar), 仕事が好きだ (gosto do trabalho).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "会社 (escola/hospital/empresa/governo)", correctAnswer: "empresa", rationale: "会 (reunião) + 社 (sociedade) → 会社 (かいしゃ) = empresa/companhia.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "社員 (cliente/gerente/funcionário/sócio)", correctAnswer: "funcionário", rationale: "社 (empresa) + 員 (membro) → 社員 (しゃいん) = funcionário de empresa.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "働く (descansar/estudar/trabalhar/viajar)", correctAnswer: "trabalhar", rationale: "働く (はたらく) → trabalhar. Ex.: 一生懸命働く (trabalhar com dedicação).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "給料 (bônus/desconto/salário/taxa)", correctAnswer: "salário", rationale: "給 (pagar) + 料 (taxa/valor) → 給料 (きゅうりょう) = salário/remuneração.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "休暇 (hora extra/reunião/turno de trabalho/férias/folga)", correctAnswer: "férias/folga", rationale: "休 (descanso) + 暇 (tempo livre) → 休暇 (きゅうか) = férias/folga.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "部長 (subordinado/colega/chefe de departamento/recepcionista)", correctAnswer: "chefe de departamento", rationale: "部 (departamento/seção) + 長 (líder) → 部長 (ぶちょう) = chefe de departamento.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "残業 (folga/hora extra/férias/intervalo)", correctAnswer: "hora extra", rationale: "残 (sobrar/restar) + 業 (trabalho) → 残業 (ざんぎょう) = hora extra.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "会議 (festa/reunião de trabalho/entrevista/intervalo)", correctAnswer: "reunião de trabalho", rationale: "会 (encontro) + 議 (discussão) → 会議 (かいぎ) = reunião de trabalho.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "退職 (se demitir/ser promovido/ser contratado/ser transferido)", correctAnswer: "se demitir", rationale: "退 (retirar-se) + 職 (cargo/emprego) → 退職 (たいしょく) = se demitir/se aposentar.", difficulty: 3, objectives: [japanese.kanji] }
  - pageNumber: 2
    title: Kanji de trabalho — frases
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "今の会社に五年間勤めています。 (Trabalho nesta empresa há cinco anos./Trabalho nesta empresa há cinco meses./Vou trabalhar nesta empresa por cinco anos./Fiz entrevista nesta empresa há cinco anos.)", correctAnswer: "Trabalho nesta empresa há cinco anos.", rationale: "Regra: 会社に + 期間 + 勤めています → indica tempo de serviço. 今の会社 → empresa atual.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "今月の給料はいくらですか。 (Quanto é o salário do mês passado?/Quanto vai ser o salário no mês que vem?/Quanto é o salário deste mês?/Qual é o horário de trabalho?)", correctAnswer: "Quanto é o salário deste mês?", rationale: "Regra: 今月の + 給料は + いくらですか → pergunta sobre salário. 今月の indica posse/referência temporal.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "社員全員が会議に参加しました。 (Todos os clientes participaram da reunião./Todos os funcionários participaram da reunião./Só o chefe participou da reunião./Nenhum funcionário participou da reunião.)", correctAnswer: "Todos os funcionários participaram da reunião.", rationale: "社員全員が (todos os funcionários) + 会議に参加しました (participaram da reunião).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "残業はしたくないですが、しなければなりません。 (Quero fazer hora extra./Não preciso fazer hora extra./Não quero fazer hora extra, mas preciso./Posso sair cedo hoje.)", correctAnswer: "Não quero fazer hora extra, mas preciso.", rationale: "Regra: したくない + しなければなりません → contraste desejo vs obrigação. indica conflito entre vontade e dever.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "来週から休暇を取ります。 (Vou trabalhar mais a partir da semana que vem./Vou tirar férias a partir da semana que vem./Tirei férias na semana passada./Não terei férias este ano.)", correctAnswer: "Vou tirar férias a partir da semana que vem.", rationale: "来週から (a partir da semana que vem) + 休暇を取ります (vou tirar férias).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "仕事が忙しくて疲れています。 (Estou descansando porque o trabalho é tranquilo./Estou cansado porque o trabalho está corrido./O trabalho está tranquilo hoje./Não tenho trabalho hoje.)", correctAnswer: "Estou cansado porque o trabalho está corrido.", rationale: "Regra: 忙しくて + 疲れています → くて indica causa/consequência. 仕事が忙しくて → porque o trabalho está corrido.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "部長に報告しなければなりません。 (Preciso relatar ao chefe de departamento./Não preciso relatar ao chefe./O chefe precisa me relatar./Vou relatar ao subordinado.)", correctAnswer: "Preciso relatar ao chefe de departamento.", rationale: "部長に (ao chefe) + 報告しなければなりません (preciso relatar). 報告 → relatório/relatar.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "この会社で働きたいです。 (Não quero trabalhar nesta empresa./Quero trabalhar nesta empresa./Já trabalho nesta empresa./Saí desta empresa.)", correctAnswer: "Quero trabalhar nesta empresa.", rationale: "Regra: で indica local de ação. この会社で + 働きたいです → expressa desejo de trabalhar neste local.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "来年退職する予定です。 (Planejo ser promovido no ano que vem./Planejo ser contratado no ano que vem./Planejo me demitir/aposentar no ano que vem./Planejo mudar de departamento no ano que vem.)", correctAnswer: "Planejo me demitir/aposentar no ano que vem.", rationale: "Regra: 来年 + 予定です → indica plano futuro. 退職する予定 → significa que há intenção definida de se aposentar.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "会議は何時から始まりますか。 (A que horas a reunião termina?/A que horas a reunião começa?/Quem participa da reunião?/Onde é a reunião?)", correctAnswer: "A que horas a reunião começa?", rationale: "会議は (a reunião) + 何時から (a partir de que horas) + 始まりますか (começa?).", difficulty: 4, objectives: [japanese.kanji] }
target: 20
