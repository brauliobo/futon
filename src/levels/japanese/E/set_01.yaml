title: 📝 ～てしまう — acabou/infelizmente fez
level: 'E'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～てしまう tem dois sentidos: (1) conclusão/completude de ação; (2) arrependimento/involuntariedade. Forma coloquial: ～ちゃう (negativa: ～ちゃった)."
example: "財布を忘れてしまった。 Ex.: ～てしまう → completou (geralmente com lamento) / fez sem querer."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Usos de ～てしまう
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "食べてしまった (comeu com cuidado/acabou comendo (com lamento)/não comeu/comeu planejado)", correctAnswer: "acabou comendo (com lamento)", rationale: "食べて (forma-て) + しまった → acabou comendo (talvez com arrependimento). しまう → conclusão/lamento.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "忘れてしまった (lembrou/não esqueceu/acabou esquecendo/estava para esquecer)", correctAnswer: "acabou esquecendo", rationale: "忘れて (forma-て de 忘れる) + しまった → acabou esquecendo (com lamento).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "全部食べちゃった (comeu só um pouco/não comeu nada/comeu tudo (coloquial)/ainda vai comer)", correctAnswer: "comeu tudo (coloquial)", rationale: "食べてしまった → 食べちゃった (coloquial). Indica que comeu tudo, talvez excessivamente.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "壊してしまった (consertou/não quebrou/quebrou acidentalmente/estava para quebrar)", correctAnswer: "quebrou acidentalmente", rationale: "壊して (forma-て de 壊す) + しまった → acabou quebrando (involuntário/com lamento).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "宿題が終わってしまった (o dever de casa ainda não acabou/o dever de casa foi cancelado/o dever de casa ficou para depois/o dever de casa terminou de vez)", correctAnswer: "o dever de casa terminou de vez", rationale: "終わって + しまった → terminou completamente. Pode ser positivo (finalização).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "言ってしまった (não disse/disse por acidente/planejava dizer/ainda não disse)", correctAnswer: "disse por acidente", rationale: "言って (forma-て de 言う) + しまった → acabou dizendo (sem querer/com arrependimento).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "死んでしまった (nasceu/não morreu/morreu (finalizou)/estava para morrer)", correctAnswer: "morreu (finalizou)", rationale: "死んで + しまった → morreu definitivamente. しまう para finalização irrevogável.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "泣いてしまった (não chorou/chorou voluntariamente/acabou chorando/estava para chorar)", correctAnswer: "acabou chorando", rationale: "泣いて + しまった → acabou chorando (involuntário/com lamento).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遅刻してしまった (chegou cedo/não chegou/chegou pontualmente/chegou atrasado (com lamento))", correctAnswer: "chegou atrasado (com lamento)", rationale: "遅刻して (forma-て de 遅刻する) + しまった → chegou atrasado, com arrependimento.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "読んでしまってください。 (Não leia, por favor./Leia devagar, por favor./Leia tudo (até o fim), por favor./Leia um pouco, por favor.)", correctAnswer: "Leia tudo (até o fim), por favor.", rationale: "読んでしまってください → leia tudo/até o fim, por favor. しまう como completude positiva.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～てしまう
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "財布を忘れてしまいました。 (Planejei esquecer a carteira./Lembrei da carteira./Acabei esquecendo a carteira./A carteira foi encontrada.)", correctAnswer: "Acabei esquecendo a carteira.", rationale: "財布を (a carteira) + 忘れてしまいました (acabei esquecendo). Arrependimento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ケーキを全部食べてしまった。 (Não comi o bolo./Comi um pouco do bolo./Comi todo o bolo (com lamento)./Planejei comer o bolo todo.)", correctAnswer: "Comi todo o bolo (com lamento).", rationale: "全部 (tudo) + 食べてしまった (acabei comendo). Excessivo/com arrependimento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "携帯を落としてしまいました。 (Encontrei o celular./Comprei o celular./Acabei derrubando o celular./Guardei o celular.)", correctAnswer: "Acabei derrubando o celular.", rationale: "携帯を (o celular) + 落としてしまいました (acabei deixando cair). Acidental.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "秘密を言ってしまった。 (Guardei o segredo./Esqueci o segredo./Decidi contar o segredo./Acabei contando o segredo (sem querer).)", correctAnswer: "Acabei contando o segredo (sem querer).", rationale: "秘密を (o segredo) + 言ってしまった (acabei dizendo). Involuntário/com arrependimento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "宿題を全部やってしまいましょう。 (Vamos não fazer o dever./Vamos fazer um pouco do dever./Vamos terminar todo o dever de casa./Vamos adiar o dever.)", correctAnswer: "Vamos terminar todo o dever de casa.", rationale: "宿題を全部 (todo o dever) + やってしまいましょう (vamos terminar). Uso positivo de しまう.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "うっかり寝てしまいました。 (Dormi de propósito./Planejei dormir./Acabei dormindo sem perceber./Não dormi nada.)", correctAnswer: "Acabei dormindo sem perceber.", rationale: "うっかり (sem perceber/desatentamente) + 寝てしまいました (acabei dormindo). Involuntário.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電車に乗り遅れてしまった。 (Consegui pegar o trem./Planejei perder o trem./Acabei perdendo o trem./Não fui de trem.)", correctAnswer: "Acabei perdendo o trem.", rationale: "電車に乗り遅れて (perder o trem) + しまった → acabei perdendo (com lamento).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この本、読んじゃった。 (Ainda não li este livro./Planejei ler este livro./Já terminei de ler este livro (coloquial)./Não gostei deste livro.)", correctAnswer: "Já terminei de ler este livro (coloquial).", rationale: "読んじゃった → 読んでしまった (coloquial) → já terminei de ler. Completude.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "大切なものを壊してしまいました。 (Consertei algo importante./Comprei algo importante./Acabei quebrando algo importante./Guardei algo importante.)", correctAnswer: "Acabei quebrando algo importante.", rationale: "大切なものを (algo importante) + 壊してしまいました (acabei quebrando). Lamento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "早くやってしまえ。 (Faça devagar./Não faça isso./Faça logo/de uma vez./Faça depois.)", correctAnswer: "Faça logo/de uma vez.", rationale: "早くやってしまえ → faça logo de uma vez. Imperativo de やってしまう → completar rapidamente.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
