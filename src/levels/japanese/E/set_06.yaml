title: 🔢 Kanji N4 — 病院薬医者 (saúde)
level: 'E'
subject: japanese
objectives: [japanese.kanji]
difficulty: 4
authorNotes: "Kanji de saúde N4: 病 (doença), 院 (instituição/hospital), 薬 (remédio), 医 (medicina), 者 (pessoa), 熱 (febre/calor), 痛 (dor), 体 (corpo)."
example: "病院に行く = ir ao hospital. Ex.: 病院薬医者 → kanji do campo da saúde."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Kanji de saúde — leitura
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "病院 (farmácia/clínica dental/hospital/posto de saúde)", correctAnswer: "hospital", rationale: "病 (doença) + 院 (instituição) → 病院 (びょういん) → hospital.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "薬 (comida/remédio/vitamina/suplemento)", correctAnswer: "remédio", rationale: "薬 (くすり) → remédio/medicamento. Ex.: 薬を飲む (tomar remédio).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "医者 (enfermeiro/paciente/médico/farmacêutico)", correctAnswer: "médico", rationale: "医 (medicina) + 者 (pessoa) → 医者 (いしゃ) → médico.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "熱 (frio/calafrio/febre/tosse)", correctAnswer: "febre", rationale: "熱 (ねつ) → febre/calor. Ex.: 熱がある (ter febre), 熱い (quente).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "痛い (coçar/dor/coceira/frio)", correctAnswer: "dor", rationale: "痛い (いたい) → doer/estar com dor. Ex.: 頭が痛い (estou com dor de cabeça).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "体 (coração/mente/corpo/alma)", correctAnswer: "corpo", rationale: "体 (からだ) → corpo. Ex.: 体に気をつけて (cuide do seu corpo/saúde).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "病気 (saúde perfeita/exercício/doença/remédio)", correctAnswer: "doença", rationale: "病 (doença) + 気 (energia/condição) → 病気 (びょうき) → doença/estar doente.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "手術 (consulta médica/internação/tomar remédio/cirurgia)", correctAnswer: "cirurgia", rationale: "手術 (しゅじゅつ) → cirurgia. 手 (mão) + 術 (técnica).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "入院 (receber alta/fazer consulta/se internar no hospital/tomar remédio)", correctAnswer: "se internar no hospital", rationale: "入 (entrar) + 院 (hospital) → 入院 (にゅういん) → se internar.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "退院 (se internar/fazer consulta/receber alta do hospital/tomar remédio)", correctAnswer: "receber alta do hospital", rationale: "退 (retirar) + 院 (hospital) → 退院 (たいいん) → receber alta.", difficulty: 3, objectives: [japanese.kanji] }
  - pageNumber: 2
    title: Kanji de saúde — frases
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "病院に行かなければなりません。 (Não preciso ir ao hospital./Não quero ir ao hospital./Preciso ir ao hospital./Devo sair do hospital.)", correctAnswer: "Preciso ir ao hospital.", rationale: "病院に行かなければなりません → devo ir ao hospital. ～なければなりません → 'precisa/deve'.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "薬を一日三回飲んでください。 (Tome o remédio uma vez por dia./Tome o remédio três vezes por dia./Tome o remédio duas vezes por dia./Tome o remédio antes de dormir.)", correctAnswer: "Tome o remédio três vezes por dia.", rationale: "薬を (o remédio) + 一日三回 (três vezes por dia) + 飲んでください (tome).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "医者に診てもらいました。 (Fui examinado pelo médico./Examinei o médico./O médico ficou de cama./Não fui ao médico.)", correctAnswer: "Fui examinado pelo médico.", rationale: "医者に (pelo médico) + 診てもらいました (fui examinado). てもらう → receber favor.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "熱が38度あります。 (Estou com febre de 36 graus./Estou com temperatura de 38 graus./Não tenho febre./Faz 38 graus lá fora.)", correctAnswer: "Estou com temperatura de 38 graus.", rationale: "熱が (a febre) + 38度あります (está em 38 graus).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "頭が痛くて学校を休みました。 (Fui à escola mesmo com dor de cabeça./Faltei à escola porque estava com dor de cabeça./Minha cabeça doeu depois da escola./Não tive dor de cabeça.)", correctAnswer: "Faltei à escola porque estava com dor de cabeça.", rationale: "頭が痛くて (estando com dor de cabeça) + 学校を休みました (faltei à escola).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "体に気をつけてください。 (Por favor, ignore sua saúde./Por favor, coma bastante./Por favor, cuide da sua saúde./Por favor, trabalhe mais.)", correctAnswer: "Por favor, cuide da sua saúde.", rationale: "体に気をつけて (cuidar do corpo/saúde) + ください (por favor).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "先週から病気で入院しています。 (Saí do hospital desde a semana passada./Estou internado no hospital desde a semana passada./Fiz consulta na semana passada./Tomei remédio desde a semana passada.)", correctAnswer: "Estou internado no hospital desde a semana passada.", rationale: "先週から (desde a semana passada) + 病気で (por doença) + 入院しています (estou internado).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "手術は成功しました。 (A cirurgia falhou./A cirurgia foi cancelada./A cirurgia foi um sucesso./A internação foi um sucesso.)", correctAnswer: "A cirurgia foi um sucesso.", rationale: "手術は (a cirurgia) + 成功しました (foi um sucesso). 成功 → sucesso.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "病気が治ったので退院しました。 (Continuei doente e fui internado./Me curei então recebi alta./Não me curei então recebi alta./Fui internado porque me curei.)", correctAnswer: "Me curei então recebi alta.", rationale: "病気が治った (a doença foi curada) + ので (então/porque) + 退院しました (recebi alta).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "この薬は食後に飲んでください。 (Tome este remédio antes de comer./Tome este remédio sem comer./Tome este remédio após as refeições./Tome este remédio à noite.)", correctAnswer: "Tome este remédio após as refeições.", rationale: "食後 (após as refeições) + に飲んでください (tome, por favor). 食後 → depois de comer.", difficulty: 4, objectives: [japanese.kanji] }
target: 20
