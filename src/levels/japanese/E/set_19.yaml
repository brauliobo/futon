title: 🔢 Kanji N4 — 家族親子友 (família)
level: 'E'
subject: japanese
objectives: [japanese.kanji]
difficulty: 4
authorNotes: "Kanji de família N4: 家 (casa/família), 族 (clã/grupo), 親 (pai/mãe/parente), 子 (filho/criança), 友 (amigo), 兄 (irmão mais velho), 姉 (irmã mais velha), 弟 (irmão mais novo), 妹 (irmã mais nova)."
example: "家族みんな = toda a família. Ex.: 家族親子友 → kanji de relações familiares e pessoais."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Kanji de família — leitura
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "家族 (amigos/colegas/família/vizinhos)", correctAnswer: "família", rationale: "家 (casa) + 族 (grupo) → 家族 (かぞく) → família.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "親 (filho/irmão/pai ou mãe/avô)", correctAnswer: "pai ou mãe", rationale: "親 (おや) → pai ou mãe/progenitor. Ex.: 親に感謝する (ser grato aos pais).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "友達 (colega de trabalho/inimigo/amigo/vizinho)", correctAnswer: "amigo", rationale: "友 (とも/ゆう) → amigo. + 達 (plural) → 友達 (ともだち) → amigos.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "兄 (irmão mais novo/irmã mais velha/irmão mais velho/irmã mais nova)", correctAnswer: "irmão mais velho", rationale: "兄 (あに) → irmão mais velho (próprio). お兄さん → irmão mais velho de outro.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "姉 (irmão mais novo/irmã mais nova/irmão mais velho/irmã mais velha)", correctAnswer: "irmã mais velha", rationale: "姉 (あね) → irmã mais velha (própria). お姉さん → irmã mais velha de outro.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "弟 (irmão mais velho/irmã mais velha/irmão mais novo/irmã mais nova)", correctAnswer: "irmão mais novo", rationale: "弟 (おとうと) → irmão mais novo. Distinto de 兄 (mais velho).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "妹 (irmã mais velha/irmão mais novo/irmão mais velho/irmã mais nova)", correctAnswer: "irmã mais nova", rationale: "妹 (いもうと) → irmã mais nova. Distinto de 姉 (mais velha).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "親友 (inimigo/colega/conhecido/amigo íntimo)", correctAnswer: "amigo íntimo", rationale: "親 (próximo/íntimo) + 友 (amigo) → 親友 (しんゆう) → amigo íntimo/melhor amigo.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "家族全員 (alguns membros da família/metade da família/apenas os pais/toda a família)", correctAnswer: "toda a família", rationale: "家族 (família) + 全員 (todos os membros) → todos os membros da família.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "子供 (bebê/idoso/adulto/criança)", correctAnswer: "criança", rationale: "子 (filho) + 供 (acompanhar) → 子供 (こども) → criança.", difficulty: 3, objectives: [japanese.kanji] }
  - pageNumber: 2
    title: Kanji de família — frases
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "私は家族が五人います。 (Minha família não tem ninguém./Minha família tem cinco membros./Tenho cinco amigos./Tenho cinco irmãos.)", correctAnswer: "Minha família tem cinco membros.", rationale: "私は (eu) + 家族が (família) + 五人います (tem cinco pessoas).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "兄は大学生で、弟は高校生です。 (Meu irmão mais velho é universitário e meu irmão mais novo é do ensino médio./Meu irmão mais velho é do ensino médio e meu irmão mais novo é universitário./Tenho dois irmãos mais novos./Tenho dois irmãos mais velhos.)", correctAnswer: "Meu irmão mais velho é universitário e meu irmão mais novo é do ensino médio.", rationale: "兄は大学生 (irmão mais velho é universitário) + 弟は高校生 (irmão mais novo é do ensino médio).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "親に感謝しています。 (Não sou grato aos pais./Sou grato aos meus filhos./Sou grato aos meus pais./Sou grato aos meus amigos.)", correctAnswer: "Sou grato aos meus pais.", rationale: "親に (aos pais) + 感謝しています (sou grato). 感謝 → gratidão.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "彼女は私の親友です。 (Ela é minha inimiga./Ela é minha colega de trabalho./Ela é minha conhecida./Ela é minha melhor amiga.)", correctAnswer: "Ela é minha melhor amiga.", rationale: "彼女は (ela) + 私の親友です (é minha melhor amiga). 親友 → amigo íntimo.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "姉は結婚していますが、妹はまだ独身です。 (Minha irmã mais velha está solteira e minha irmã mais nova também./Minha irmã mais velha é casada e minha irmã mais nova ainda é solteira./Minhas duas irmãs são casadas./Minhas duas irmãs são solteiras.)", correctAnswer: "Minha irmã mais velha é casada e minha irmã mais nova ainda é solteira.", rationale: "姉は結婚しています (irmã mais velha é casada) + 妹はまだ独身です (irmã mais nova ainda é solteira).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "子供の頃、家族でよく旅行しました。 (Na infância, nunca viajei com a família./Quando adulto, viajava com a família./Na infância, viajava muito com a família./Minha família não gosta de viajar.)", correctAnswer: "Na infância, viajava muito com a família.", rationale: "子供の頃 (na infância) + 家族で (com a família) + よく旅行しました (viajava muito).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "友達と映画を見に行きました。 (Fui ao cinema sozinho./Fui ao cinema com a família./Fui ao cinema com amigos./Fui ao cinema com colegas de trabalho.)", correctAnswer: "Fui ao cinema com amigos.", rationale: "友達と (com amigos) + 映画を見に行きました (fui ver um filme).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "家族全員で写真を撮りました。 (Tirei foto com alguns membros da família./Tirei foto sozinho./Tirei foto com toda a família./Minha família não gosta de fotos.)", correctAnswer: "Tirei foto com toda a família.", rationale: "家族全員で (com toda a família) + 写真を撮りました (tirei fotos).", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "弟の面倒を見てあげました。 (Meu irmão mais velho cuidou de mim./Cuidei do meu irmão mais novo./Meu irmão mais novo cuidou de mim./Não cuidei do meu irmão.)", correctAnswer: "Cuidei do meu irmão mais novo.", rationale: "弟の (do irmão mais novo) + 面倒を見てあげました (cuidei). 面倒を見る → cuidar.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "親の言うことを聞きなさい。 (Não ouça o que seus pais dizem./Ouça o que seus amigos dizem./Ouça o que seus pais dizem./Ignore seus pais.)", correctAnswer: "Ouça o que seus pais dizem.", rationale: "親の言うことを (o que os pais dizem) + 聞きなさい (ouça). なさい → imperativo educado.", difficulty: 4, objectives: [japanese.kanji] }
target: 20
