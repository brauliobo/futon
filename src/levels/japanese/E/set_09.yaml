title: 📝 ～ために — para / por causa de
level: 'E'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～ために tem dois usos: (1) finalidade: 'para fazer X' (verbo no dicionário + ために); (2) causa: 'por causa de X' (verbo passado/substantivo + ために). O contexto distingue os usos."
example: "健康のために運動する (fazer exercício para a saúde). 事故のために遅れた (atrasou por causa do acidente). Ex.: ～ために → finalidade ou causa."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Usos de ～ために
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "健康のために (por causa da saúde/para a saúde/contra a saúde/apesar da saúde)", correctAnswer: "para a saúde", rationale: "健康 (saúde) + のために = para a saúde / pelo bem da saúde. Finalidade.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語を勉強するために (para estudar japonês/porque estudou japonês/apesar de estudar japonês/sem estudar japonês)", correctAnswer: "para estudar japonês", rationale: "勉強する (estudar) + ために = para estudar. Dicionário + ために = finalidade.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "事故のために遅れた (atrasou para o acidente/atrasou apesar do acidente/atrasou por causa do acidente/atrasou sem motivo)", correctAnswer: "atrasou por causa do acidente", rationale: "事故 (acidente) + のために + 遅れた = atrasou por causa do acidente. Causa (substantivo + ために).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "大学に入るために (para entrar na universidade/porque entrou na universidade/apesar de entrar na universidade/sem entrar na universidade)", correctAnswer: "para entrar na universidade", rationale: "大学に入る (entrar na universidade) + ために = para entrar na universidade. Finalidade.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "病気のために欠席した (faltou para a doença/faltou apesar da doença/faltou por causa da doença/faltou sem estar doente)", correctAnswer: "faltou por causa da doença", rationale: "病気 (doença) + のために + 欠席した = faltou por causa da doença. Causa.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "家族のために働く (trabalhar por causa da família/trabalhar apesar da família/trabalhar para a família/trabalhar sem família)", correctAnswer: "trabalhar para a família", rationale: "家族 (família) + のために + 働く = trabalhar para/pelo bem da família. Beneficiário.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試験に受かるために (para passar no exame/porque passou no exame/apesar de passar no exame/sem passar no exame)", correctAnswer: "para passar no exame", rationale: "試験に受かる (passar no exame) + ために = para passar no exame. Finalidade.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "雨のために試合が中止になった (o jogo foi cancelado para a chuva/o jogo foi cancelado apesar da chuva/o jogo foi cancelado por causa da chuva/o jogo foi cancelado sem motivo)", correctAnswer: "o jogo foi cancelado por causa da chuva", rationale: "雨 (chuva) + のために + 試合が中止になった = o jogo foi cancelado por causa da chuva.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お金を貯めるために (para economizar dinheiro/porque economizou dinheiro/apesar de economizar dinheiro/sem economizar dinheiro)", correctAnswer: "para economizar dinheiro", rationale: "お金を貯める (economizar dinheiro) + ために = para economizar dinheiro. Finalidade.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "将来のために (apesar do futuro/por causa do futuro/para o futuro/sem futuro)", correctAnswer: "para o futuro", rationale: "将来 (futuro) + のために = para o futuro / pensando no futuro. Beneficiário/finalidade.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～ために
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "日本語を上手になるために毎日練習しています。 (Pratico todo dia apesar de querer melhorar no japonês./Pratico todo dia por causa do japonês./Pratico todo dia para melhorar no japonês./Não preciso praticar para melhorar.)", correctAnswer: "Pratico todo dia para melhorar no japonês.", rationale: "上手になるために (para melhorar) + 毎日練習しています (pratico todo dia). Finalidade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "台風のために電車が止まりました。 (O trem parou para o tufão./O trem parou apesar do tufão./O trem parou por causa do tufão./O tufão parou por causa do trem.)", correctAnswer: "O trem parou por causa do tufão.", rationale: "台風 (tufão) + のために + 電車が止まりました = parou por causa do tufão. Causa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "大学に入るために一生懸命勉強しました。 (Estudei muito apesar de não querer entrar na universidade./Estudei muito por causa da universidade./Estudei muito para entrar na universidade./Entrei na universidade sem estudar.)", correctAnswer: "Estudei muito para entrar na universidade.", rationale: "大学に入るために (para entrar na universidade) + 一生懸命勉強しました (estudei muito).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "家族のために毎日働いています。 (Trabalho todo dia apesar da família./Trabalho todo dia por causa da família./Trabalho todo dia para a família./Não trabalho para a família.)", correctAnswer: "Trabalho todo dia para a família.", rationale: "家族のために (para a família) + 毎日働いています (trabalho todo dia). Beneficiário.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康のために運動することが大切です。 (Se exercitar por causa da saúde não é importante./Se exercitar para a saúde é importante./Não precisa se exercitar para ser saudável./A saúde não depende de exercício.)", correctAnswer: "Se exercitar para a saúde é importante.", rationale: "健康のために (para a saúde) + 運動することが大切です (é importante se exercitar).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "工事のために道が混んでいます。 (A estrada está engarrafada para a construção./A estrada está engarrafada por causa da construção./A construção foi feita para a estrada./A estrada está livre por causa da construção.)", correctAnswer: "A estrada está engarrafada por causa da construção.", rationale: "工事 (construção/obras) + のために + 道が混んでいます = engarrafamento por causa das obras.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "将来のために今貯金しています。 (Estou economizando por causa do passado./Estou economizando apesar do futuro./Estou economizando para o futuro./Não preciso economizar para o futuro.)", correctAnswer: "Estou economizando para o futuro.", rationale: "将来のために (para o futuro) + 今貯金しています (estou economizando agora).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は病気のために試験を受けられなかった。 (Ele não quis fazer o exame./Ele fez o exame apesar da doença./Ele não pôde fazer o exame por causa da doença./Ele ficou doente por causa do exame.)", correctAnswer: "Ele não pôde fazer o exame por causa da doença.", rationale: "病気のために (por causa da doença) + 試験を受けられなかった (não pôde fazer o exame).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語を話せるようになるために学校に通っています。 (Frequento a escola por causa do japonês./Frequento a escola apesar do japonês./Frequento a escola para conseguir falar japonês./Não preciso de escola para aprender japonês.)", correctAnswer: "Frequento a escola para conseguir falar japonês.", rationale: "話せるようになるために (para conseguir falar) + 学校に通っています (frequento a escola).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "風のために傘が壊れた。 (O guarda-chuva quebrou para o vento./O guarda-chuva quebrou apesar do vento./O guarda-chuva quebrou por causa do vento./O vento quebrou por causa do guarda-chuva.)", correctAnswer: "O guarda-chuva quebrou por causa do vento.", rationale: "風 (vento) + のために + 傘が壊れた = o guarda-chuva quebrou por causa do vento.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
