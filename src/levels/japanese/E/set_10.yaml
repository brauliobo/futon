title: 📝 ～ように — para que / de forma a
level: 'E'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "～ように tem dois usos principais: (1) finalidade com verbos de possibilidade/estado: 'para que/de forma a'; (2) comparação/modo: 'como/da mesma forma que'. Também em orações de intenção e pedidos."
example: "忘れないように書いた (escrevi para não esquecer). Ex.: ～ように → 'de forma a / para que / como'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Usos de ～ように
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "忘れないように (de forma a não esquecer/porque não esqueceu/apesar de não esquecer/da mesma forma que esquecer)", correctAnswer: "de forma a não esquecer", rationale: "忘れない (não esquecer) + ように → de forma a não esquecer. Finalidade com negativa.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語が話せるように (de forma a conseguir falar japonês/porque consegue falar japonês/apesar de conseguir falar japonês/sem falar japonês)", correctAnswer: "de forma a conseguir falar japonês", rationale: "話せる (potencial) + ように → de forma a conseguir falar. Finalidade com potencial.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生が言ったように (da mesma forma que o professor disse/para que o professor diga/porque o professor disse/sem o professor dizer)", correctAnswer: "da mesma forma que o professor disse", rationale: "先生が言った (o professor disse) + ように → da mesma forma que o professor disse. Comparação/modo.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "分かるように説明する (explicar de forma que entenda/explicar porque entende/explicar apesar de não entender/explicar sem ser entendido)", correctAnswer: "explicar de forma que entenda", rationale: "分かる (entender) + ように + 説明する → explicar de forma que entenda.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "合格できるように (de forma a poder passar/porque passou/apesar de passar/sem passar)", correctAnswer: "de forma a poder passar", rationale: "合格できる (poder passar) + ように → de forma a poder passar. Finalidade com potencial.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "皆に聞こえるように (de forma que todos ouçam/porque todos ouviram/apesar de todos ouvirem/sem ninguém ouvir)", correctAnswer: "de forma que todos ouçam", rationale: "皆に聞こえる (todos poderem ouvir) + ように → de forma que todos ouçam.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供でも分かるように (de forma que até crianças entendam/porque crianças entenderam/apesar de crianças entenderem/sem crianças entenderem)", correctAnswer: "de forma que até crianças entendam", rationale: "子供でも分かる (até crianças entenderem) + ように → de forma que até crianças entendam.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "鳥のように飛びたい (quero voar como um pássaro/quero voar para os pássaros/quero voar apesar dos pássaros/não quero voar como pássaro)", correctAnswer: "quero voar como um pássaro", rationale: "鳥のように (como um pássaro) + 飛びたい → quero voar como um pássaro. Comparação.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遅刻しないように (de forma a não se atrasar/porque não se atrasou/apesar de não se atrasar/sem se atrasar de propósito)", correctAnswer: "de forma a não se atrasar", rationale: "遅刻しない (não se atrasar) + ように → de forma a não se atrasar. Finalidade com negativa.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "言われたようにする (fazer como foi mandado/fazer para que seja mandado/fazer apesar de ser mandado/não fazer o que foi mandado)", correctAnswer: "fazer como foi mandado", rationale: "言われた (foi mandado) + ように + する → fazer da forma que foi mandado. Instrução.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases com ～ように
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "忘れないようにメモしました。 (Anotei porque esqueci./Anotei apesar de não esquecer./Anotei de forma a não esquecer./Anotei e esqueci mesmo assim.)", correctAnswer: "Anotei de forma a não esquecer.", rationale: "忘れないように (de forma a não esquecer) + メモしました (anotei).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "皆に聞こえるように大きな声で話してください。 (Fale baixo para que ninguém ouça./Fale alto de forma que todos ouçam./Fale devagar porque todos ouvem./Fale normal pois todos ouvirão.)", correctAnswer: "Fale alto de forma que todos ouçam.", rationale: "皆に聞こえるように (de forma que todos ouçam) + 大きな声で話してください (fale em voz alta).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生に言われたようにやりました。 (Fiz diferente do que o professor disse./Fiz da mesma forma que o professor disse./Fiz o que eu queria, não o que o professor disse./O professor fez o que disse.", correctAnswer: "Fiz da mesma forma que o professor disse.", rationale: "先生に言われた (o professor disse) + ように + やりました (fiz). Modo/instrução.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "合格できるように一生懸命勉強します。 (Estudo muito apesar de não poder passar./Estudo muito de forma a poder passar./Não preciso estudar para passar./Estudo porque já passei.)", correctAnswer: "Estudo muito de forma a poder passar.", rationale: "合格できるように (de forma a poder passar) + 一生懸命勉強します (estudo muito).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供でも分かるように説明してください。 (Explique para que adultos entendam./Explique de forma complexa./Explique de forma que até crianças entendam./Explique porque crianças entenderam.)", correctAnswer: "Explique de forma que até crianças entendam.", rationale: "子供でも分かるように (para que até crianças entendam) + 説明してください.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "風邪を引かないように気をつけてください。 (Tome cuidado apesar de já estar resfriado./Tome cuidado porque está resfriado./Tome cuidado de forma a não pegar resfriado./Tome cuidado que o resfriado passou.)", correctAnswer: "Tome cuidado de forma a não pegar resfriado.", rationale: "風邪を引かないように (para não pegar resfriado) + 気をつけてください (tome cuidado).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "神様にいい年になるようにお祈りしました。 (Rezei ao deus para que fosse um bom ano./Rezei porque foi um bom ano./Rezei apesar de não ser um bom ano./Rezei e o ano ficou ruim.)", correctAnswer: "Rezei ao deus para que fosse um bom ano.", rationale: "いい年になるように (para que fosse um bom ano) + お祈りしました (rezei). Pedido a uma divindade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遅刻しないように早く起きました。 (Acordei cedo porque me atrasei./Acordei cedo apesar de me atrasar./Acordei cedo de forma a não me atrasar./Me atrasei mesmo acordando cedo.)", correctAnswer: "Acordei cedo de forma a não me atrasar.", rationale: "遅刻しないように (para não se atrasar) + 早く起きました (acordei cedo).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は天使のように優しいです。 (Ela é gentil como um anjo./Ela é gentil para os anjos./Ela é gentil porque os anjos são gentis./Ela é gentil apesar de não ser um anjo.)", correctAnswer: "Ela é gentil como um anjo.", rationale: "天使のように (como um anjo) + 優しいです (é gentil). のように → comparação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語が話せるように毎日練習しています。 (Pratico todo dia porque consigo falar japonês./Pratico todo dia apesar de não conseguir./Pratico todo dia de forma a conseguir falar japonês./Não preciso praticar para falar japonês.)", correctAnswer: "Pratico todo dia de forma a conseguir falar japonês.", rationale: "話せるように (de forma a conseguir falar) + 毎日練習しています (pratico todo dia).", difficulty: 4, objectives: [japanese.grammar] }
target: 20
