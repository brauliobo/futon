title: 📝 Nominalizações — こと e の
level: 'E'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "こと e の nominalizam verbos/frases (transformam em substantivo). の é mais emocional/direto; こと é mais formal/abstrato. Usos específicos: こと em 好き/嫌い/得意/苦手; の em が+できる/分かる."
example: "泳ぐことが好きです (gosto de nadar). 雨が降るのが見えた (vi chover). Ex.: こと/の → nominalização de verbos."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: こと e の — nominalizações
    description: Escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "泳ぐことが好きです。 (Gosto de nadar./Não gosto de nadar./Sei nadar./Quero nadar.)", correctAnswer: "Gosto de nadar.", rationale: "泳ぐ (nadar) + こと (nominaliza) + が好きです → gosto de nadar. こと com 好き.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "料理することが得意です。 (Sou bom em comer./Tenho dificuldade em cozinhar./Sou bom em cozinhar./Não gosto de cozinhar.)", correctAnswer: "Sou bom em cozinhar.", rationale: "料理すること (cozinhar nominalizado) + が得意です → sou bom em cozinhar. こと com 得意.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼が来るのが見えた。 (Ouvi ele chegar./Vi ele chegar./Não vi ele chegar./Senti ele chegar.)", correctAnswer: "Vi ele chegar.", rationale: "彼が来る (ele vir) + の (nominaliza) + が見えた (vi) → vi ele chegar. の com verbos de percepção.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語を話すことができます。 (Não consigo falar japonês./Gosto de falar japonês./Consigo falar japonês./Quero falar japonês.)", correctAnswer: "Consigo falar japonês.", rationale: "話すこと (falar nominalizado) + ができます → consigo falar. こと + できる → habilidade.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "歌うのが苦手です。 (Sou bom em cantar./Gosto de cantar./Tenho dificuldade em cantar./Quero cantar.)", correctAnswer: "Tenho dificuldade em cantar.", rationale: "歌うの (cantar nominalizado) + が苦手です → tenho dificuldade em cantar. の ou こと com 苦手.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "問題があることを知っています。 (Sei que não há problema./Não sei que há problema./Sei que há um problema./Quero que haja um problema.)", correctAnswer: "Sei que há um problema.", rationale: "問題がある (há um problema) + こと (nominaliza) + を知っています → sei que há um problema.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "音楽を聞くのが好きです。 (Gosto de tocar música./Não gosto de música./Gosto de ouvir música./Quero aprender música.)", correctAnswer: "Gosto de ouvir música.", rationale: "音楽を聞く (ouvir música) + の (nominaliza) + が好きです → gosto de ouvir música.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "大切なことを忘れた。 (Lembrei de algo importante./Não tinha nada importante./Esqueci algo importante./Comprei algo importante.)", correctAnswer: "Esqueci algo importante.", rationale: "大切なこと (coisa importante) + を忘れた (esqueci). こと como 'coisa/assunto'.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女が泣いているのが分かった。 (Ouvi ela chorando./Vi ela chorando./Senti ela chorando./Percebi que ela estava chorando.)", correctAnswer: "Percebi que ela estava chorando.", rationale: "彼女が泣いている (ela chorando) + の + が分かった → percebi que ela estava chorando. の + 分かる.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "早起きすることにしました。 (Decidi parar de acordar cedo./Decidi acordar cedo./Não consigo acordar cedo./Gosto de acordar cedo.)", correctAnswer: "Decidi acordar cedo.", rationale: "早起きすること (acordar cedo nominalizado) + にしました → decidi acordar cedo. ことにする → decidir.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: こと e の — frases avançadas
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "日本語を勉強することは大切です。 (Estudar japonês não é importante./Estudar japonês é importante./Gosto de estudar japonês./Quero estudar japonês.)", correctAnswer: "Estudar japonês é importante.", rationale: "日本語を勉強すること (estudar japonês) + は大切です (é importante). こと como sujeito.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼が来たことを知りませんでした。 (Sabia que ele veio./Não sabia que ele veio./Vi que ele veio./Ouvi que ele veio.)", correctAnswer: "Não sabia que ele veio.", rationale: "彼が来たこと (o fato de ele ter vindo) + を知りませんでした (não sabia).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "運動するのを忘れた。 (Lembrei de me exercitar./Exercitei-me voluntariamente./Esqueci de me exercitar./Não preciso me exercitar.)", correctAnswer: "Esqueci de me exercitar.", rationale: "運動する (se exercitar) + の (nominaliza) + を忘れた (esqueci). の com 忘れる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は料理が上手なことで有名です。 (Ela é famosa por ser ruim na cozinha./Ela é famosa por ser boa na cozinha./Ela não cozinha./Ela é famosa por outra coisa.)", correctAnswer: "Ela é famosa por ser boa na cozinha.", rationale: "料理が上手なこと (o fato de ser boa na cozinha) + で有名です (é famosa por).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供が笑っているのを見た。 (Ouvi a criança rindo./Senti a criança rindo./Vi a criança rindo./Percebi a criança rindo.)", correctAnswer: "Vi a criança rindo.", rationale: "子供が笑っている (a criança rindo) + の + を見た (vi). の com verbos de percepção visual.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "毎日運動することが健康の秘訣です。 (Se exercitar todo dia não é importante para a saúde./Às vezes se exercitar é o segredo da saúde./Se exercitar todo dia é o segredo da saúde./Comer bem é o segredo da saúde.)", correctAnswer: "Se exercitar todo dia é o segredo da saúde.", rationale: "毎日運動すること (se exercitar todo dia) + が健康の秘訣です (é o segredo da saúde).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼がうそをついていることに気づいた。 (Percebi que ele estava mentindo./Não percebi que ele estava mentindo./Fui informado de que ele mentiu./Esqueci que ele mentiu.)", correctAnswer: "Percebi que ele estava mentindo.", rationale: "うそをついていること (o fato de estar mentindo) + に気づいた (percebi). ことに気づく → perceber.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語を話せるようになることが目標です。 (Minha meta é desistir de falar japonês./Minha meta é conseguir falar japonês./Já consigo falar japonês./Não tenho meta de aprender japonês.)", correctAnswer: "Minha meta é conseguir falar japonês.", rationale: "日本語を話せるようになること (conseguir falar japonês) + が目標です (é minha meta).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電車が出るのが分かった。 (Ouvi o trem partir./Vi/Percebi o trem partindo./Senti o trem partir./Parei o trem de partir.)", correctAnswer: "Vi/Percebi o trem partindo.", rationale: "電車が出る (o trem partir) + の + が分かった (percebi). の com 分かる para percepção.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "無理をしないことが大切です。 (É importante se esforçar ao máximo./É importante descansar bastante./É importante não se forçar demais./É importante trabalhar muito.)", correctAnswer: "É importante não se forçar demais.", rationale: "無理をしないこと (não se forçar) + が大切です (é importante). 無理をする → se forçar demais.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
