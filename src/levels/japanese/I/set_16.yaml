title: 📝 ～というより (mais do que / em vez de dizer)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～というより corrige ou nuança uma afirmação anterior — a segunda descrição é mais precisa que a primeira. Equivalente a 'mais do que X, é Y' ou 'melhor dizendo'. Tom de precisão descritiva."
example: "Correção de descrição. Ex.: 彼は厳しいというより、真剣だ → Mais do que severo, ele é sério."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～というより
    description: Escolha o significado correto das frases com ～というより.
    exercises:
      - { type: japanese_vocab, question: "彼は厳しいというより、真剣だ (ele é muito severo/mais do que severo ele é sério/ele é indiferente/a seriedade dele é um problema)", correctAnswer: "mais do que severo ele é sério", rationale: "というより = a segunda descrição é mais precisa que a primeira.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは難しいというより、複雑だ (é extremamente difícil/mais do que difícil é complexo/é fácil/a complexidade é menor)", correctAnswer: "mais do que difícil é complexo", rationale: "というより = nuança mais precisa: complexo ≠ difícil.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "好きというより、夢中だ (gosta moderadamente/mais do que gostar está obcecado/não gosta/gosto e obsessão são iguais)", correctAnswer: "mais do que gostar está obcecado", rationale: "というより = intensidade maior que o primeiro termo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "疲れたというより、眠い (só está cansado/mais do que cansado está sonolento/não está cansado/o cansaço e o sono são iguais)", correctAnswer: "mais do que cansado está sonolento", rationale: "というより = a sensação de sono é mais precisa que cansaço.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は美しいというより、可愛い (ela é mais bonita do que fofa/mais do que bela é fofa/ela não é bonita/beleza e fofura são iguais)", correctAnswer: "mais do que bela é fofa", rationale: "というより = nuança entre duas qualidades estéticas.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悲しいというより、怒っている (só está triste/mais do que triste está com raiva/não sente nada/as emoções são iguais)", correctAnswer: "mais do que triste está com raiva", rationale: "というより = emoção mais precisa e dominante.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは仕事というより、趣味だ (é só trabalho/mais do que trabalho é hobby/é obrigatório/não é nem trabalho nem hobby)", correctAnswer: "mais do que trabalho é hobby", rationale: "というより = recategoriza a atividade com mais precisão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "恐ろしいというより、おかしい (é aterrorizante/mais do que assustador é estranho/não é assustador/são a mesma coisa)", correctAnswer: "mais do que assustador é estranho", rationale: "というより = requalifica a sensação com mais precisão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は優しいというより、弱い (a bondade é um ponto forte/mais do que gentil ele é fraco/ele é cruel/gentileza e fraqueza são iguais)", correctAnswer: "mais do que gentil ele é fraco", rationale: "というより = interpretação mais crítica do mesmo comportamento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この映画は怖いというより、グロテスクだ (o filme é muito assustador/mais do que assustador o filme é grotesco/o filme é engraçado/são a mesma coisa)", correctAnswer: "mais do que assustador o filme é grotesco", rationale: "というより = distinção mais precisa entre qualidades.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～というより
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "というより é usado para: (adicionar informação/corrigir ou nuançar uma descrição/negar/expressar surpresa)", correctAnswer: "corrigir ou nuançar uma descrição", rationale: "というより = 'melhor dizendo' — a segunda descrição é mais precisa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "難しい___より、複雑だ (と/が/を/に)", correctAnswer: "と", rationale: "難しいというより = mais do que difícil.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というより conecta com: (apenas substantivos/adjetivos, verbos e substantivos/apenas verbos/apenas adjetivos い)", correctAnswer: "adjetivos, verbos e substantivos", rationale: "というより: 難しいというより、仕事というより、美しいというより.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "好き___より、大好きだ (と/が/を/に)", correctAnswer: "と", rationale: "好きというより = mais do que gostar, amo muito.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre というより e のではなく? (mesma coisa/というより = nuança/correção; のではなく = negação e substituição/のではなく = nuança; というより = negação/nenhuma)", correctAnswer: "というより = nuança/correção; のではなく = negação e substituição", rationale: "というより = mais preciso; のではなく = nega e substitui.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悲しい___より、虚しい (と/が/を/に)", correctAnswer: "と", rationale: "悲しいというより = mais do que triste, está vazio.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa というより corretamente? (行くというより来た/厳しいというより真剣だ/静かというより/食べるというより飲む)", correctAnswer: "厳しいというより真剣だ", rationale: "厳しい (い adj.) + というより + 真剣 = nuança mais precisa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは失敗___より、学びの機会だ (と/が/を/に)", correctAnswer: "と", rationale: "失敗というより = mais do que fracasso, é oportunidade de aprender.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というより geralmente indica que o segundo termo é: (igual ao primeiro/mais preciso ou extremo que o primeiro/oposto do primeiro/menos importante)", correctAnswer: "mais preciso ou extremo que o primeiro", rationale: "というより = o segundo termos captura melhor a essência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嬉しい___より、安心した (と/が/を/に)", correctAnswer: "と", rationale: "嬉しいというより = mais do que feliz, sinto alívio.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
