title: 📝 ～というより (mais do que / em vez de dizer)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～というより corrige ou nuança uma afirmação anterior — a segunda descrição é mais precisa que a primeira. Equivalente a 'mais do que X, é Y' ou 'melhor dizendo'. Tom de precisão descritiva."
example: "Correção de descrição. Ex.: 彼は厳しいというより、真剣だ → Mais do que severo, ele é sério."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Reconhecer ～というより
    description: Escolha o significado correto das frases com ～というより.
    exercises:
      - { type: japanese_vocab, question: "彼は厳しいというより、真剣だ (a seriedade dele é um problema/ele é muito severo/mais do que severo ele é sério/ele é indiferente)", correctAnswer: "mais do que severo ele é sério", rationale: "Regra: [X]というより[Y] → Y é descrição mais precisa que X. 厳しい(severo) → というより → 真剣(sério/dedicado) = requalifica o comportamento com mais precisão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは難しいというより、複雑だ (é extremamente difícil/mais do que difícil é complexo/é fácil/a complexidade é menor)", correctAnswer: "mais do que difícil é complexo", rationale: "Regra: 難しい(difícil = subjetivo) → というより → 複雑(complexo = objetivo). というより distingue nuança: 難しい = depende do nível; 複雑 = tem muitas partes.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "好きというより、夢中だ (gosta moderadamente/mais do que gostar está obcecado/não gosta/gosto e obsessão são iguais)", correctAnswer: "mais do que gostar está obcecado", rationale: "Regra: 好き(gostar) → というより → 夢中(obcecado/completamente absorto) → Y intensifica X. 夢中 = 夢(sonho) + 中(dentro) = imerso no sonho = obsessão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "疲れたというより、眠い (só está cansado/mais do que cansado está sonolento/não está cansado/o cansaço e o sono são iguais)", correctAnswer: "mais do que cansado está sonolento", rationale: "Regra: 疲れた(cansaço físico/mental) → というより → 眠い(sonolência específica). Y é mais preciso: não é cansaço geral, é vontade de dormir.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は美しいというより、可愛い (ela é mais bonita do que fofa/mais do que bela é fofa/ela não é bonita/beleza e fofura são iguais)", correctAnswer: "mais do que bela é fofa", rationale: "Regra: 美しい(beleza elegante/formal) → というより → 可愛い(fofura/encanto) = requalifica o tipo de atratividade com mais precisão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悲しいというより、怒っている (só está triste/mais do que triste está com raiva/não sente nada/as emoções são iguais)", correctAnswer: "mais do que triste está com raiva", rationale: "Regra: 悲しい(tristeza) → というより → 怒っている(raiva) = Y substitui X como emoção dominante mais precisa. というより aqui corrige a descrição.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは仕事というより、趣味だ (é só trabalho/mais do que trabalho é hobby/é obrigatório/não é nem trabalho nem hobby)", correctAnswer: "mais do que trabalho é hobby", rationale: "Regra: 仕事(trabalho = obrigação) → というより → 趣味(hobby = prazer) = recategoriza a atividade. Y (趣味) captura melhor a essência do que X (仕事).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "恐ろしいというより、おかしい (é aterrorizante/mais do que assustador é estranho/não é assustador/são a mesma coisa)", correctAnswer: "mais do que assustador é estranho", rationale: "Regra: 恐ろしい(aterrorizante) → というより → おかしい(estranho/absurdo) = Y requalifica a reação emocional com mais precisão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は優しいというより、弱い (a bondade é um ponto forte/mais do que gentil ele é fraco/ele é cruel/gentileza e fraqueza são iguais)", correctAnswer: "mais do que gentil ele é fraco", rationale: "Regra: 優しい(gentil = positivo) → というより → 弱い(fraco = negativo) = Y reinterpreta o mesmo comportamento com julgamento mais crítico.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この映画は怖いというより、グロテスクだ (o filme é muito assustador/mais do que assustador o filme é grotesco/o filme é engraçado/são a mesma coisa)", correctAnswer: "mais do que assustador o filme é grotesco", rationale: "Regra: 怖い(medo) → というより → グロテスク(grotesco/repulsivo) = distinção precisa de tipo: não é medo psicológico, é repulsa visual.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～というより
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "というより é usado para: (adicionar informação/corrigir ou nuançar uma descrição/negar/expressar surpresa)", correctAnswer: "corrigir ou nuançar uma descrição", rationale: "Raiz: という(dizer que) + より(comparativo = mais que) → というより = 'mais do que dizer X' → Y é mais preciso. Função: requalificar, não negar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "難しい___より、複雑だ (と/が/を/に)", correctAnswer: "と", rationale: "Regra: [predicado] + と + いう + より → contraído em というより. 難しい + と + いうより = 'mais do que dizer que é difícil'. と é partícula de citação obrigatória.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というより conecta com: (apenas substantivos/adjetivos, verbos e substantivos/apenas verbos/apenas adjetivos い)", correctAnswer: "adjetivos, verbos e substantivos", rationale: "Regra: い-adj → 難しいというより; な-adj/名詞 → 仕事というより; verbo → 泣くというより. というより aceita qualquer forma predicativa antes de と.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "好き___より、大好きだ (と/が/を/に)", correctAnswer: "と", rationale: "Regra: 好き(な-adj) + と + いうより → 'mais do que dizer que gosto'. と marca a citação/hipótese do primeiro termo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre というより e のではなく? (mesma coisa/というより = nuança/correção; のではなく = negação e substituição/のではなく = nuança; というより = negação/nenhuma)", correctAnswer: "というより = nuança/correção; のではなく = negação e substituição", rationale: "Regra: というより → 'mais preciso que X' (não nega X totalmente). のではなく → 'não é X, é Y' (nega X e substitui). Ex.: 仕事というより趣味 vs 仕事ではなく趣味.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悲しい___より、虚しい (と/が/を/に)", correctAnswer: "と", rationale: "Regra: 悲しい + と + いうより → 'mais do que triste'. 虚しい(vazio/sem sentido) é mais preciso que 悲しい(triste). と é a partícula de citação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa というより corretamente? (行くというより来た/厳しいというより真剣だ/静かというより/食べるというより飲む)", correctAnswer: "厳しいというより真剣だ", rationale: "Regra: 厳しい(い-adj) + というより + 真剣だ(requalificação com だ) → estrutura completa e correta. 静かというより falta な; 行くというより来た não requalifica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは失敗___より、学びの機会だ (と/が/を/に)", correctAnswer: "と", rationale: "Regra: 失敗(名詞) + と + いうより → 'mais do que dizer que é fracasso'. Y recategoriza: 学びの機会(oportunidade de aprendizado) é visão mais precisa/positiva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "というより geralmente indica que o segundo termo é: (igual ao primeiro/mais preciso ou extremo que o primeiro/oposto do primeiro/menos importante)", correctAnswer: "mais preciso ou extremo que o primeiro", rationale: "Regra: Y (segundo) > X (primeiro) em precisão ou intensidade. X → というより → Y(mais preciso). Não é oposição (でも/が), é requalificação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嬉しい___より、安心した (と/が/を/に)", correctAnswer: "と", rationale: "Regra: 嬉しい(alegria) + と + いうより + 安心した(alívio) → alívio é mais preciso que alegria. と marca o primeiro termo como citação a ser requalificada.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
