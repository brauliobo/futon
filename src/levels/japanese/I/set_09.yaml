title: 📝 ～としても (mesmo que / supondo que)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～としても apresenta uma suposição hipotética e indica que mesmo nesse caso, a conclusão não muda. Equivalente a 'mesmo que (supondo que)'. Tom mais hipotético que にしても."
example: "Hipótese com conclusão invariável. Ex.: たとえ失敗したとしても、挑戦する価値がある → Mesmo que fracasse, vale a pena tentar."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～としても
    description: Escolha o significado correto das frases com ～としても.
    exercises:
      - { type: japanese_vocab, question: "たとえ失敗したとしても、挑戦する価値がある (só tente se tiver certeza/mesmo que fracasse supondo isso vale a pena tentar/o fracasso é definitivo/desista antes de tentar)", correctAnswer: "mesmo que fracasse supondo isso vale a pena tentar", rationale: "Regra: たとえ + [hipótese]としても + [conclusão invariável]. 失敗した(hipótese negativa) → としても → 挑戦する価値がある(conclusão que não muda).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "仮にそれが事実だとしても、問題は残る (se for fato o problema desaparece/supondo que seja fato o problema ainda permanece/o fato resolve tudo/não há problema)", correctAnswer: "supondo que seja fato o problema ainda permanece", rationale: "Regra: 仮に + 事実だ(substantivo + だ) + としても → hipótese assumida. 問題は残る = conclusão que persiste mesmo aceitando a hipótese.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お金があったとしても、買わなかった (compraria com dinheiro/mesmo que tivesse dinheiro supondo isso não compraria/não tem dinheiro/comprou)", correctAnswer: "mesmo que tivesse dinheiro supondo isso não compraria", rationale: "Regra: お金があった(hipótese contrária à realidade: não tinha) + としても + 買わなかった(conclusão → mesmo assim não compraria). Condicional irreal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たとえ反対されたとしても、続けるつもりだ (desiste se houver oposição/mesmo que haja oposição tenho intenção de continuar/ninguém se opõe/já desistiu)", correctAnswer: "mesmo que haja oposição tenho intenção de continuar", rationale: "Regra: 反対された(passiva: ser contrariado) + としても + 続けるつもり → determinação mantida apesar da hipótese de oposição.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "無理だとしても、やってみる価値がある (só tente se for possível/mesmo que seja impossível supondo isso vale tentar/é fácil/já tentou)", correctAnswer: "mesmo que seja impossível supondo isso vale tentar", rationale: "Regra: 無理だ(な-adj + だ) + としても → 'supondo que seja impossível'. Conclusão: やってみる価値がある = o esforço tem valor independente do resultado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "仮に知っていたとしても、言わなかっただろう (diria se soubesse/mesmo que soubesse provavelmente não teria falado/não sabia/falou logo)", correctAnswer: "mesmo que soubesse provavelmente não teria falado", rationale: "Regra: 仮に + 知っていた(estado hipotético passado) + としても + 言わなかっただろう(condicional irreal passado). だろう → probabilidade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嫌いだとしても、感謝は伝えるべきだ (se não gostar não precisa agradecer/mesmo que não goste supostamente deve-se expressar gratidão/só agradeça se gostar/gratidão é opcional)", correctAnswer: "mesmo que não goste supostamente deve-se expressar gratidão", rationale: "Regra: 嫌いだ(状態) + としても + 〜べきだ → obrigação que não depende da hipótese. Fórmula: [sentimento/estado]としても + [norma social]べきだ.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たとえ時間がかかったとしても、正確にやるべきだ (rapidez é mais importante/mesmo que leve tempo deve-se fazer com precisão/o tempo não importa/não precisa ser exato)", correctAnswer: "mesmo que leve tempo deve-se fazer com precisão", rationale: "Regra: 時間がかかった(hipótese de demora) + としても + 正確にやるべき → princípio de qualidade sobre velocidade. べきだ = obrigação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "それが冗談だとしても、謝るべきだ (piada justifica tudo/mesmo que seja piada deve-se pedir desculpas/não é necessário pedir desculpas/a piada foi aceitável)", correctAnswer: "mesmo que seja piada deve-se pedir desculpas", rationale: "Regra: 冗談だ(状態) + としても + 謝るべきだ → norma moral que se aplica mesmo na hipótese mais favorável. としても = mesmo no melhor cenário.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たとえ勝てなかったとしても、精一杯やった (não valeu a pena/mesmo que não tenha vencido deu o seu melhor/desistiu fácil/vencer é tudo)", correctAnswer: "mesmo que não tenha vencido deu o seu melhor", rationale: "Regra: 勝てなかった(hipótese de derrota) + としても + 精一杯やった(valor do esforço em si). Conclusão: o processo tem valor independente do resultado.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～としても
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "としても indica: (condição real/hipótese — mesmo que (supondo)/resultado esperado/causa)", correctAnswer: "hipótese — mesmo que (supondo)", rationale: "Regra: と(partícula de citação/hipótese) + して(como) + も(mesmo assim) → としても = 'tomando como X, mesmo assim Y'. Indica hipótese cujo resultado é invariável.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たとえ失敗した___しても、挑戦する (と/が/を/に)", correctAnswer: "と", rationale: "Regra: [verbo/adj/subst] + と + しても → partícula と é obrigatória. 失敗した + と + しても = 'mesmo que tenha falhado'. が/を/に não formam esta estrutura.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre としても e にしても? (mesma coisa/としても é mais hipotético; にしても aceita algo como fato/にしても é mais hipotético; としても aceita como fato/nenhuma)", correctAnswer: "としても é mais hipotético; にしても aceita algo como fato", rationale: "Regra: としても → hipótese irreal ou incerta (たとえ〜). にしても → aceita a premissa como válida e diz 'mesmo assim'. としても = suposição; にしても = concessão factual.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "仮にそれが本当だ___しても (と/が/を/に)", correctAnswer: "と", rationale: "Regra: 本当だ(subst + だ) + と + しても → 'supondo que seja verdade'. と marca a hipótese citada. Fórmula: 仮に + [状態]だとしても.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "としても frequentemente aparece com: (たとえ/もし/なるほど/しかし)", correctAnswer: "たとえ", rationale: "Regra: たとえ〜としても → estrutura clássica de hipótese hiperbólica. たとえ → 'mesmo que (por mais que)'. もし〜たら → condição realista; たとえ〜としても → hipótese extrema.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "難しい___しても、あきらめない (と/が/を/に)", correctAnswer: "と", rationale: "Regra: 難しい(い-adj) + と + しても → 'mesmo que seja difícil'. い-adj conecta diretamente + としても. Conclusão: あきらめない = não desistir.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa としても corretamente? (行くとしても来た/たとえ失敗したとしても続ける/静かなとしても/食べるとして飲む)", correctAnswer: "たとえ失敗したとしても続ける", rationale: "Regra: たとえ + 失敗した(た形) + としても + 続ける(conclusão invariável) → estrutura correta. 食べるとして = 'supondo que coma' (diferente); 静かなとしても falta o verbo de conclusão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お金がなかっ___しても、やろうとした (た/て/る/ない) — complete a forma verbal", correctAnswer: "た", rationale: "Regra: お金がなかった(た形) + としても → 'mesmo que não tivesse dinheiro'. Fórmula: verbo/adj(た形) + としても. て/る/ない não formam としても.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "としても conecta com: (apenas substantivos/substantivos (だ), adjetivos e verbos/apenas verbos/apenas adjetivos)", correctAnswer: "substantivos (だ), adjetivos e verbos", rationale: "Regra: verbo(た/る) + としても; い-adj + としても; な-adj/名詞 + だ + としても. Ex.: 失敗したとしても、難しいとしても、事実だとしても.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たとえ反対される___しても続ける (と/が/を/に)", correctAnswer: "と", rationale: "Regra: 反対される(受け身、辞書形) + と + しても → hipótese de ser contrariado. Verbo em forma não-passada também aceita としても (hipótese futura).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
