title: 📝 ～にしても (mesmo sendo / seja como for)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～にしても aceita uma premissa e indica que o resultado é válido de qualquer forma. Equivalente a 'mesmo sendo' ou 'seja como for'. Também usado para exemplificar casos extremos."
example: "Concessão abrangente. Ex.: 冗談にしても、言っていいことと悪いことがある → Mesmo sendo brincadeira, há coisas que se pode e não se pode dizer."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～にしても
    description: Escolha o significado correto das frases com ～にしても.
    exercises:
      - { type: japanese_vocab, question: "冗談にしても、言っていいことと悪いことがある (piadas são sempre aceitáveis/mesmo sendo brincadeira há coisas que se pode e não se pode dizer/piadas são proibidas/a brincadeira não importa)", correctAnswer: "mesmo sendo brincadeira há coisas que se pode e não se pode dizer", rationale: "にしても = mesmo sendo X + a consideração vale.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遅れるにしても、連絡くらいしてほしい (pode se atrasar sem avisar/mesmo que se atrase deveria pelo menos avisar/o aviso não é necessário/sempre avisa)", correctAnswer: "mesmo que se atrase deveria pelo menos avisar", rationale: "にしても = mesmo que X + expectativa mínima.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "理由があるにしても、暴力は許されない (razões justificam violência/mesmo que haja razão a violência não é tolerada/a violência é normal/as razões absolvem)", correctAnswer: "mesmo que haja razão a violência não é tolerada", rationale: "にしても = mesmo que X + princípio absoluto.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "忙しいにしても、食事は取るべきだ (quando ocupado não se deve comer/mesmo estando ocupado deve-se comer/ocupação dispensa comida/não há tempo para comer)", correctAnswer: "mesmo estando ocupado deve-se comer", rationale: "にしても = mesmo que X + o mínimo necessário.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "賛成するにしても、しないにしても、連絡してください (só avise se concordar/não importa se concorda ou não avise/não precisa avisar/a decisão não importa)", correctAnswer: "não importa se concorda ou não avise", rationale: "にしても〜にしても = seja X ou não X — ambas situações.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供にしても、礼儀は大切だ (crianças não precisam de etiqueta/mesmo sendo criança a etiqueta é importante/adultos não precisam de etiqueta/a etiqueta é opcional)", correctAnswer: "mesmo sendo criança a etiqueta é importante", rationale: "子供にしても = mesmo sendo criança + norma aplicável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "失敗したにしても、諦めないことが大切だ (depois do fracasso desista/mesmo tendo falhado não desistir é importante/o fracasso é permanente/não tente de novo)", correctAnswer: "mesmo tendo falhado não desistir é importante", rationale: "にしても = mesmo que tenha X + princípio.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "それが事実にしても、発言は不適切だ (os fatos justificam tudo/mesmo que seja fato a declaração foi inadequada/fatos nunca são inadequados/não há problema)", correctAnswer: "mesmo que seja fato a declaração foi inadequada", rationale: "にしても = mesmo que X seja verdade + avaliação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行くにしても、行かないにしても、返事してください (só avise se for/responda independente de ir ou não/não precisa responder/a decisão é sua)", correctAnswer: "responda independente de ir ou não", rationale: "行くにしても〜ないにしても = qualquer que seja a decisão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "練習が足りないにしても、もっと頑張れたはずだ (a falta de prática justifica tudo/mesmo com pouca prática poderia ter se esforçado mais/o esforço é desnecessário/está satisfeito)", correctAnswer: "mesmo com pouca prática poderia ter se esforçado mais", rationale: "にしても = mesmo que X + expectativa ou crítica.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～にしても
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "にしても indica: (condição necessária/concessão — mesmo que X + Y vale/resultado inevitável/probabilidade)", correctAnswer: "concessão — mesmo que X + Y vale", rationale: "にしても = mesmo que seja X + a consideração ainda é válida.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "冗談___しても、失礼な言葉はいけない (に/が/を/で)", correctAnswer: "に", rationale: "冗談にしても = mesmo sendo brincadeira.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にしても〜にしても indica: (duas possibilidades onde Y se aplica/apenas uma possibilidade/exclusão/contradição)", correctAnswer: "duas possibilidades onde Y se aplica", rationale: "AにしてもBにしても = seja A seja B — em qualquer caso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "賛成する___しても反対する___しても (に...に/が...が/を...を/で...で)", correctAnswer: "に...に", rationale: "賛成するにしても反対するにしても = seja concordando ou discordando.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa にしても corretamente? (行くにしても来ない/冗談にしても限度がある/静かなにしても/食べるしても飲む)", correctAnswer: "冗談にしても限度がある", rationale: "冗談 (subst.) + にしても + 限度 = estrutura correta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "理由___にしても、遅刻は遅刻だ (が/に/は/を)", correctAnswer: "が", rationale: "理由があるにしても = mesmo que haja razão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にしても conecta com: (apenas substantivos/substantivos, adjetivos e verbos/apenas verbos/apenas adjetivos)", correctAnswer: "substantivos, adjetivos e verbos", rationale: "にしても: 冗談にしても、忙しいにしても、失敗したにしても.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行く___しても行かない___しても、連絡して (に...に/が...が/を...を/で...で)", correctAnswer: "に...に", rationale: "行くにしても行かないにしても = seja indo ou não.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にしても indica que a consideração seguinte: (é válida somente às vezes/é válida independente da condição/não é válida/é opcional)", correctAnswer: "é válida independente da condição", rationale: "にしても = mesmo que X, Y ainda se aplica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "失敗した___しても諦めるな (に/が/を/で)", correctAnswer: "に", rationale: "失敗したにしても = mesmo tendo falhado não desista.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
