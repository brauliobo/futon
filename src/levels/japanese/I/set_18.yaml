title: 📝 ～ながらも (embora / apesar de — simultâneo)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ながらも expressa que duas condições coexistem de forma contraditória. Equivalente a 'embora X, ao mesmo tempo Y'. Indica estado simultâneo mas contrário. Tom literário."
example: "Coexistência contraditória. Ex.: 小さいながらも、勇気がある → Embora seja pequeno, tem coragem."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～ながらも
    description: Escolha o significado correto das frases com ～ながらも.
    exercises:
      - { type: japanese_vocab, question: "小さいながらも、勇気がある (é grande e corajoso/embora seja pequeno tem coragem/não tem coragem/o tamanho importa para a coragem)", correctAnswer: "embora seja pequeno tem coragem", rationale: "ながらも = embora X (estado), Y coexiste contrariamente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "知っていながらも、黙っていた (não sabia/embora soubesse ficou em silêncio/contou tudo que sabia/não tinha informações)", correctAnswer: "embora soubesse ficou em silêncio", rationale: "ながらも = saber e silenciar coexistem contrariamente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "貧しいながらも、幸せだった (era rico/embora fosse pobre era feliz/a pobreza impede a felicidade/eram infelizes)", correctAnswer: "embora fosse pobre era feliz", rationale: "ながらも = pobreza e felicidade coexistem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "不安ながらも、挑戦した (desistiu com medo/embora estivesse ansioso tentou/estava calmo/a ansiedade impediu)", correctAnswer: "embora estivesse ansioso tentou", rationale: "ながらも = ansiedade e ação coexistem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "認めたくないながらも、事実だと思う (aceitou facilmente/embora não queira admitir acredita que é fato/não acredita/nega completamente)", correctAnswer: "embora não queira admitir acredita que é fato", rationale: "ながらも = relutância e aceitação coexistem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "恥ずかしいながらも、舞台に立った (fugiu do palco/embora estivesse com vergonha subiu ao palco/estava confiante/não havia palco)", correctAnswer: "embora estivesse com vergonha subiu ao palco", rationale: "ながらも = vergonha e ação corajosa coexistem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "古いながらも、機能は十分だ (precisa ser trocado/embora seja antigo funciona bem o suficiente/é novo/não funciona)", correctAnswer: "embora seja antigo funciona bem o suficiente", rationale: "ながらも = idade e funcionalidade coexistem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "反対しながらも、参加した (não participou/embora se opusesse acabou participando/era a favor/participou com entusiasmo)", correctAnswer: "embora se opusesse acabou participando", rationale: "ながらも = oposição e participação coexistem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "忙しいながらも、手伝ってくれた (não tinha tempo/embora estivesse ocupado me ajudou/estava sem fazer nada/recusou a ajuda)", correctAnswer: "embora estivesse ocupado me ajudou", rationale: "ながらも = ocupação e ajuda ao próximo coexistem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悲しみながらも、前を向いた (desistiu de avançar/embora estivesse triste olhou para frente/estava alegre/a tristeza impediu)", correctAnswer: "embora estivesse triste olhou para frente", rationale: "ながらも = tristeza e determinação coexistem.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ながらも
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "ながらも indica: (ação sequencial/estados contraditórios que coexistem/causa e efeito/condição e resultado)", correctAnswer: "estados contraditórios que coexistem", rationale: "ながらも = embora X, ao mesmo tempo Y — contradição simultânea.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ながらも conecta com: (apenas substantivos/adjetivos い e な, verbos/apenas verbos/apenas adjetivos)", correctAnswer: "adjetivos い e な, verbos", rationale: "ながらも: 小さいながらも、不安ながらも、知っていながらも.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "小さい___も、頑張る (なが/ら/ながら/なが)", correctAnswer: "ながら", rationale: "小さいながらも = embora seja pequeno.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre ながらも e ものの? (mesma coisa/ながらも enfatiza coexistência simultânea; ものの enfatiza resultado decepcionante/ものの é simultâneo; ながらも é resultado/nenhuma)", correctAnswer: "ながらも enfatiza coexistência simultânea; ものの enfatiza resultado decepcionante", rationale: "ながらも = estados simultâneos; ものの = embora X, resultado Y.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "恥ずかしい___も、話した (なが/ら/ながら/なが)", correctAnswer: "ながら", rationale: "恥ずかしいながらも = embora estivesse com vergonha.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa ながらも corretamente? (行くながらも来た/貧しいながらも幸せだ/静かなながらも/食べながらも飲む)", correctAnswer: "貧しいながらも幸せだ", rationale: "貧しい (い adj.) + ながらも + 幸せ = contradição simultânea.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "不安___も、一歩踏み出した (なが/ら/ながら/なが)", correctAnswer: "ながら", rationale: "不安ながらも = embora estivesse ansioso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ながらも tem tom mais: (coloquial/literário e escrito/interrogativo/infantil)", correctAnswer: "literário e escrito", rationale: "ながらも é mais literário — típico de narrativas e escrita formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "知って___も、言わなかった (いながら/いることながら/いたながら/いるながら)", correctAnswer: "いながら", rationale: "知っていながらも = embora soubesse.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "古い___も、大切に使っている (なが/ら/ながら/なが)", correctAnswer: "ながら", rationale: "古いながらも = embora seja antigo, usa com cuidado.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
