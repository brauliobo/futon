title: 📝 ～ながらも (embora / apesar de — simultâneo)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ながらも expressa que duas condições coexistem de forma contraditória. Equivalente a 'embora X, ao mesmo tempo Y'. Indica estado simultâneo mas contrário. Tom literário."
example: "Coexistência contraditória. Ex.: 小さいながらも、勇気がある → Embora seja pequeno, tem coragem."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～ながらも
    description: Escolha o significado correto das frases com ～ながらも.
    exercises:
      - { type: japanese_vocab, question: "小さいながらも、勇気がある (o tamanho importa para a coragem/é grande e corajoso/embora seja pequeno tem coragem/não tem coragem)", correctAnswer: "embora seja pequeno tem coragem", rationale: "Regra: 形容詞い + ながらも. 小さい(i-adj)+ながらも+勇気がある. Formula: [estado X]ながらも+[resultado contrário Y]. Chave: ながらも → dois estados contraditórios coexistindo simultaneamente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "知っていながらも、黙っていた (não tinha informações/não sabia/embora soubesse ficou em silêncio/contou tudo que sabia)", correctAnswer: "embora soubesse ficou em silêncio", rationale: "Regra: 動詞(ている形) + ながらも. 知っている(ている)+ながらも+黙っていた. Contradição: saber implica falar; silenciar contraria a expectativa. ながらも aceita ている.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "貧しいながらも、幸せだった (era rico/embora fosse pobre era feliz/a pobreza impede a felicidade/eram infelizes)", correctAnswer: "embora fosse pobre era feliz", rationale: "Regra: 形容詞い + ながらも. 貧しい(i-adj)+ながらも+幸せだった. Contradição: pobreza → infelicidade (esperada); resultado: felicidade (contrário). Formula: [estado negativo X]ながらも+[estado positivo Y].", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "不安ながらも、挑戦した (desistiu com medo/embora estivesse ansioso tentou/estava completamente tranquilo/a ansiedade o paralisou)", correctAnswer: "embora estivesse ansioso tentou", rationale: "Regra: 形容詞な + ながらも. 不安(な adj.)+ながらも+挑戦した. Contradição: ansiedade → paralisia; resultado: ação corajosa. Formula: [estado interno X]ながらも+[ação contrária Y].", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "認めたくないながらも、事実だと思う (aceitou facilmente/embora não queira admitir acredita que é fato/prefere ignorar os fatos/nega completamente)", correctAnswer: "embora não queira admitir acredita que é fato", rationale: "Regra: 動詞(たくない形) + ながらも. 認めたくない+ながらも+事実だと思う. Contradição: relutância em admitir ↔ reconhecer internamente como fato. Tensão interna simultânea.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "恥ずかしいながらも、舞台に立った (fugiu do palco antes de começar/embora estivesse com vergonha subiu ao palco/estava confiante e animado/pediu para um substituto assumir)", correctAnswer: "embora estivesse com vergonha subiu ao palco", rationale: "Regra: 形容詞い + ながらも. 恥ずかしい(i-adj)+ながらも+舞台に立った. Contradição: vergonha → esquivar; resultado: subir ao palco (coragem supera vergonha).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "古いながらも、機能は十分だ (precisa ser trocado urgentemente/embora seja antigo funciona bem o suficiente/foi reformado recentemente/é moderno mas frágil)", correctAnswer: "embora seja antigo funciona bem o suficiente", rationale: "Regra: 形容詞い + ながらも. 古い(i-adj)+ながらも+機能は十分だ. Contradição: antigo → disfuncional (esperado); resultado: funcional o suficiente (surpresa positiva).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "反対しながらも、参加した (protestou e se recusou a comparecer/embora se opusesse acabou participando/apoiou com entusiasmo/convenceu os outros a não participar)", correctAnswer: "embora se opusesse acabou participando", rationale: "Regra: 動詞(stem) + ながらも. 反対し(stem de 反対する)+ながらも+参加した. Contradição: opor-se → não comparecer; resultado: participou mesmo assim (coexistência).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "忙しいながらも、手伝ってくれた (não tinha tempo e se recusou/embora estivesse ocupado me ajudou/estava de folga e teve tempo/priorizou o descanso ao invés de ajudar)", correctAnswer: "embora estivesse ocupado me ajudou", rationale: "Regra: 形容詞い + ながらも. 忙しい(i-adj)+ながらも+手伝ってくれた. Contradição: ocupado → sem tempo; resultado: ajudou mesmo assim (generosidade coexiste com ocupação).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悲しみながらも、前を向いた (abandonou tudo por causa da tristeza/embora estivesse triste olhou para frente/estava alegre ao seguir em frente/esperou a tristeza passar antes de agir)", correctAnswer: "embora estivesse triste olhou para frente", rationale: "Regra: 動詞(ながら形) + も. 悲しみ(stem de 悲しむ)+ながらも+前を向いた. Contradição: tristeza → paralisar; resultado: seguir em frente (tristeza e determinação coexistem).", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ながらも
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "ながらも indica: (ação sequencial/estados contraditórios que coexistem/causa e efeito/condição e resultado)", correctAnswer: "estados contraditórios que coexistem", rationale: "Regra: ながらも = embora X, ao mesmo tempo Y — contradição simultânea. Chave: ambos os estados coexistem (≠ sequência). Contraste: てから(sequência), ので(causa→efeito).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ながらも conecta com: (apenas substantivos/adjetivos い e な, verbos/apenas verbos/apenas adjetivos)", correctAnswer: "adjetivos い e な, verbos", rationale: "Regra: ながらも aceita: 形容詞い(小さいながらも), 形容詞な(不安ながらも), 動詞ている(知っていながらも), 動詞stem(反対しながらも). Nota: 名詞+ながらも também é possível.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "小さい___も、頑張る (なが/ら/ながら/がら)", correctAnswer: "ながら", rationale: "Regra: 形容詞い + ながら + も = ながらも. 小さい+ながら+も → 小さいながらも. ながら = partícula de estado simultâneo; も = reforça a contradição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre ながらも e ものの? (mesma coisa/ながらも enfatiza coexistência simultânea; ものの enfatiza resultado decepcionante/ものの é simultâneo; ながらも é resultado/nenhuma)", correctAnswer: "ながらも enfatiza coexistência simultânea; ものの enfatiza resultado decepcionante", rationale: "ながらも → X e Y coexistem (contradição neutra ou admirável). ものの → embora X, o resultado Y é decepcionante/insatisfatório. Cf.: 貧しいながらも幸せ vs 勉強したものの落ちた.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "恥ずかしい___も、話した (なが/ら/ながら/がら)", correctAnswer: "ながら", rationale: "Regra: 形容詞い + ながら + も. 恥ずかしい+ながら+も → 恥ずかしいながらも = embora com vergonha, falou. ながら = estado simultâneo; も = reforça contradição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa ながらも corretamente? (行くながらも来た/貧しいながらも幸せだ/静かなながらも/食べながらも飲む)", correctAnswer: "貧しいながらも幸せだ", rationale: "貧しい(i-adj)+ながらも+幸せだ → contradição simultânea ✓. Armadilha: 行くながらも → 辞書形 ✗ (verbos precisam de stem/て); 静かなながらも → な está a mais (静かながらも).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "不安___も、一歩踏み出した (なが/ら/ながら/がら)", correctAnswer: "ながら", rationale: "Regra: 形容詞な + ながら + も. 不安+ながら+も → 不安ながらも. Nota: 不安 = na-adj, mas usa diretamente + ながらも (sem で, diferente de てたまらない).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ながらも tem tom mais: (coloquial/literário e escrito/interrogativo/infantil)", correctAnswer: "literário e escrito", rationale: "ながらも é mais literário/formal — típico de narrativas, prosa e escrita formal. No cotidiano seria: 〜けど/〜のに. Escala: のに(coloquial) < が(neutro) < ながらも(literário/formal).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "知って___も、言わなかった (いながら/いることながら/いたながら/いるながら)", correctAnswer: "いながら", rationale: "Regra: 動詞ている → いながら + も. 知って+いながら+も = 知っていながらも. いながら = forma ながら de いる. Armadilha: いたながら ✗ (た+ながら = forma errada).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "古い___も、大切に使っている (なが/ら/ながら/がら)", correctAnswer: "ながら", rationale: "Regra: 形容詞い + ながら + も. 古い+ながら+も → 古いながらも = embora seja antigo, usa com cuidado. 大切に使う = usar com cuidado/carinho (大切=precioso + に=adv.).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
