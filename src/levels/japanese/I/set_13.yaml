title: 📝 ～ばかりか (não só... mas também)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ばかりか adiciona outra informação que supera ou complementa a primeira. Equivalente a 'não só X, mas também Y'. Indica que Y vai além do esperado em relação a X."
example: "Adição que supera. Ex.: 彼は英語ばかりか、日本語も話せる → Não só inglês, mas também fala japonês."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～ばかりか
    description: Escolha o significado correto das frases com ～ばかりか.
    exercises:
      - { type: japanese_vocab, question: "彼は英語ばかりか、日本語も話せる (só fala inglês/não só inglês mas também fala japonês/não fala inglês/nenhum idioma)", correctAnswer: "não só inglês mas também fala japonês", rationale: "Regra: X + ばかりか + Y も → não só X, mas também Y (Y supera X). 英語(X)+ばかりか+日本語も(Y). Formula: [X(base)]ばかりか[Y(escalada)も] → Y vai além de X.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食料ばかりか、水も不足している (só falta comida/não só comida, a água também está em falta/sobra comida e água/o abastecimento está normal)", correctAnswer: "não só comida, a água também está em falta", rationale: "Regra: 名詞 + ばかりか + も. 食料(名詞)+ばかりか+水も不足. Escalada: falta de comida já é grave; falta de água é ainda pior. ばかりか amplifica a gravidade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は歌ばかりか、踊りも上手だ (só dança bem/não só no canto, também dança bem/não tem habilidades artísticas/só canta)", correctAnswer: "não só no canto, também dança bem", rationale: "Regra: 名詞 + ばかりか + も. 歌(名詞)+ばかりか+踊りも上手. Formula: [habilidade X]ばかりか[habilidade Y も] → múltiplos talentos. ばかりか → adição que supera.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この店は安いばかりか、サービスもいい (só é barato/não só barato, o serviço também é bom/é caro/o serviço é ruim)", correctAnswer: "não só barato, o serviço também é bom", rationale: "Regra: 形容詞い + ばかりか + も. 安い(i-adj)+ばかりか+サービスもいい. Formula: [vantagem X]ばかりか[vantagem Y も] → escalada de qualidades positivas.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "成績が悪いばかりか、出席率も低い (as notas são boas/não só as notas são ruins, a frequência também é baixa/a frequência é alta/os problemas são só com notas)", correctAnswer: "não só as notas são ruins, a frequência também é baixa", rationale: "Regra: 形容詞い + ばかりか + も. 悪い(i-adj)+ばかりか+出席率も低い. Escalada negativa: problema X → problema Y adicional. Padrão: [problema X]ばかりか[problema Y も].", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語ばかりか、中国語も学んでいる (só aprende japonês/não só japonês, também está aprendendo chinês/não está aprendendo nada/o chinês é difícil)", correctAnswer: "não só japonês, também está aprendendo chinês", rationale: "Regra: 名詞 + ばかりか + も. 日本語(名詞)+ばかりか+中国語も学んでいる. Formula: [idioma X]ばかりか[idioma Y も]. Y é informação que supera/vai além de X.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "料理ができるばかりか、掃除も得意だ (só cozinha/não só cozinha, também é habilidoso na limpeza/não sabe cozinhar/só limpa)", correctAnswer: "não só cozinha, também é habilidoso na limpeza", rationale: "Regra: 動詞句 + ばかりか + も. 料理ができる(動詞句)+ばかりか+掃除も得意. Formula: [habilidade X]ばかりか[habilidade Y も得意] → múltiplas habilidades além de X.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は遅刻するばかりか、仕事もできない (só se atrasa/não só se atrasa mas também não consegue trabalhar/é pontual/trabalha bem)", correctAnswer: "não só se atrasa mas também não consegue trabalhar", rationale: "Regra: 動詞 + ばかりか + も. 遅刻する(動詞)+ばかりか+仕事もできない. Escalada negativa: atraso (problema menor) → incompetência (problema maior). ばかりか amplifica.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "公害で川が汚れるばかりか、魚も死んだ (só a água poluiu/não só o rio foi poluído, os peixes também morreram/os peixes estão vivos/o rio está limpo)", correctAnswer: "não só o rio foi poluído, os peixes também morreram", rationale: "Regra: 動詞 + ばかりか + も. 川が汚れる+ばかりか+魚も死んだ. Escalada de danos: poluição (X) → morte dos peixes (Y, consequência mais grave).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この薬は効くばかりか、副作用もない (o remédio não funciona/não só o remédio funciona, não tem efeitos colaterais/o remédio tem efeitos colaterais/é apenas parcialmente eficaz)", correctAnswer: "não só o remédio funciona, não tem efeitos colaterais", rationale: "Regra: 動詞 + ばかりか + も. 効く+ばかりか+副作用もない. Escalada positiva: funciona (X) + sem efeitos colaterais (Y=vantagem adicional). ばかりか em contexto positivo.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ばかりか
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "ばかりか indica: (adição simples/não só X, mas também Y que supera/contraste/condição)", correctAnswer: "não só X, mas também Y que supera", rationale: "Regra: ばかりか → adição enfática onde Y vai além de X. Formula: [X]ばかりか[Y も/さえ] → não só X, e além disso Y (Y supera ou agrava X). Diferente de だけ (simples).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "英語___か、フランス語も話せる (ばかり/だけ/しか/しか)", correctAnswer: "ばかり", rationale: "Regra: 名詞 + ばかりか. 英語+ばかりか+フランス語も → não só inglês, também francês. Armadilha: だけか → apenas inglês?; しか → só (exige negação); ばかりか → adição que supera.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre ばかりか e だけでなく? (mesma coisa/ばかりか é mais formal e ênfático; だけでなく é mais neutro/だけでなく é mais formal; ばかりか é coloquial/nenhuma)", correctAnswer: "ばかりか é mais formal e ênfático; だけでなく é mais neutro", rationale: "だけでなく → não só X (neutro, cotidiano). ばかりか → não só X e ainda mais (ênfase, escrita formal). Escala de formalidade: だけでなく < ばかりか < のみならず.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "歌が上手な___か、ダンスも得意だ (ばかり/だけ/しか/まで)", correctAnswer: "ばかり", rationale: "Regra: 形容詞な + な + ばかりか. 歌が上手な(な adj.)+ばかりか+ダンスも得意. Atenção: 上手な = na-adj → 上手なばかりか (com な antes de ばかりか).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ばかりか conecta com: (apenas verbos/substantivos, adjetivos e verbos/apenas adjetivos/apenas substantivos)", correctAnswer: "substantivos, adjetivos e verbos", rationale: "Regra: ばかりか aceita: 名詞(英語ばかりか), 形容詞い(安いばかりか), 形容詞な+な(上手なばかりか), 動詞(できるばかりか). Padrão: qualquer predicado + ばかりか.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa ばかりか corretamente? (行くばかりか来た/英語ばかりか日本語も話せる/静かなばかりか/食べるばかりか行く)", correctAnswer: "英語ばかりか日本語も話せる", rationale: "英語(名詞)+ばかりか+日本語も話せる(Y も) ✓. Armadilha: 食べるばかりか行く → falta o も (Y も é essencial); 静かなばかりか → incompleto (falta Y も).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "成績が悪い___か、遅刻も多い (ばかり/だけ/しか/まで)", correctAnswer: "ばかり", rationale: "Regra: 形容詞い + ばかりか. 成績が悪い+ばかりか+遅刻も多い. Escalada: notas ruins + atrasos frequentes. Armadilha: しか → só (exige negação); まで → até (não é adição).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ばかりか é tipicamente seguido de: (mas (contraste)/também Y (adição)/portanto/porque)", correctAnswer: "também Y (adição)", rationale: "Regra: ばかりか → Y も / Y さえも. Formula: [X]ばかりか[Y も/さえも] = adição. Armadilha: が/けど = contraste (diferentes de ばかりか); から = causa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "料理が得意な___か、掃除も上手だ (ばかり/だけ/しか/まで)", correctAnswer: "ばかり", rationale: "Regra: 形容詞な + な + ばかりか. 料理が得意な+ばかりか+掃除も上手. 得意な = na-adj → 得意なばかりか. Armadilha: omitir な → 得意ばかりか ✗.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この本は安い___か、内容も素晴らしい (ばかり/だけ/しか/まで)", correctAnswer: "ばかり", rationale: "Regra: 形容詞い + ばかりか. 安い+ばかりか+内容も素晴らしい. Escalada positiva: barato (X) + conteúdo excelente (Y). Formula: [qualidade X]ばかりか[qualidade Y も].", difficulty: 5, objectives: [japanese.grammar] }
target: 20
