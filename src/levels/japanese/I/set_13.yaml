title: 📝 ～ばかりか (não só... mas também)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ばかりか adiciona outra informação que supera ou complementa a primeira. Equivalente a 'não só X, mas também Y'. Indica que Y vai além do esperado em relação a X."
example: "Adição que supera. Ex.: 彼は英語ばかりか、日本語も話せる → Não só inglês, mas também fala japonês."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～ばかりか
    description: Escolha o significado correto das frases com ～ばかりか.
    exercises:
      - { type: japanese_vocab, question: "彼は英語ばかりか、日本語も話せる (só fala inglês/não só inglês mas também fala japonês/não fala inglês/nenhum idioma)", correctAnswer: "não só inglês mas também fala japonês", rationale: "ばかりか = não só X, mas também Y (vai além).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食料ばかりか、水も不足している (só falta comida/não só comida, a água também está em falta/sobra comida e água/o abastecimento está normal)", correctAnswer: "não só comida, a água também está em falta", rationale: "ばかりか = não só X, Y também — situação ainda mais grave.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は歌ばかりか、踊りも上手だ (só dança bem/não só no canto, também dança bem/não tem habilidades artísticas/só canta)", correctAnswer: "não só no canto, também dança bem", rationale: "ばかりか = múltiplos talentos além do mencionado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この店は安いばかりか、サービスもいい (só é barato/não só barato, o serviço também é bom/é caro/o serviço é ruim)", correctAnswer: "não só barato, o serviço também é bom", rationale: "ばかりか = além da qualidade mencionada, tem mais.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "成績が悪いばかりか、出席率も低い (as notas são boas/não só as notas são ruins, a frequência também é baixa/a frequência é alta/os problemas são só com notas)", correctAnswer: "não só as notas são ruins, a frequência também é baixa", rationale: "ばかりか = além do problema mencionado, há outro.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語ばかりか、中国語も学んでいる (só aprende japonês/não só japonês, também está aprendendo chinês/não está aprendendo nada/o chinês é difícil)", correctAnswer: "não só japonês, também está aprendendo chinês", rationale: "ばかりか = além do idioma mencionado, estuda outro.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "料理ができるばかりか、掃除も得意だ (só cozinha/não só cozinha, também é habilidoso na limpeza/não sabe cozinhar/só limpa)", correctAnswer: "não só cozinha, também é habilidoso na limpeza", rationale: "ばかりか = além da habilidade mencionada, tem outras.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は遅刻するばかりか、仕事もできない (só se atrasa/não só se atrasa mas também não consegue trabalhar/é pontual/trabalha bem)", correctAnswer: "não só se atrasa mas também não consegue trabalhar", rationale: "ばかりか = além do problema, há outro maior.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "公害で川が汚れるばかりか、魚も死んだ (só a água poluiu/não só o rio foi poluído, os peixes também morreram/os peixes estão vivos/o rio está limpo)", correctAnswer: "não só o rio foi poluído, os peixes também morreram", rationale: "ばかりか = efeito além do mencionado — escalada de danos.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この薬は効くばかりか、副作用もない (o remédio não funciona/não só o remédio funciona, não tem efeitos colaterais/o remédio tem efeitos colaterais/é apenas parcialmente eficaz)", correctAnswer: "não só o remédio funciona, não tem efeitos colaterais", rationale: "ばかりか = além de X positivo, Y positivo adicional.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ばかりか
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "ばかりか indica: (adição simples/não só X, mas também Y que supera/contraste/condição)", correctAnswer: "não só X, mas também Y que supera", rationale: "ばかりか = não apenas X — Y também, e vai além.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "英語___か、フランス語も話せる (ばかり/だけ/しか/しか)", correctAnswer: "ばかり", rationale: "英語ばかりか = não só inglês.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre ばかりか e だけでなく? (mesma coisa/ばかりか é mais formal e ênfático; だけでなく é mais neutro/だけでなく é mais formal; ばかりか é coloquial/nenhuma)", correctAnswer: "ばかりか é mais formal e ênfático; だけでなく é mais neutro", rationale: "ばかりか tem mais ênfase — 'não só... e além disso'; だけでなく é mais neutro.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "歌が上手な___か、ダンスも得意だ (ばかり/だけ/しか/まで)", correctAnswer: "ばかり", rationale: "歌が上手なばかりか = não só é boa no canto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ばかりか conecta com: (apenas verbos/substantivos, adjetivos e verbos/apenas adjetivos/apenas substantivos)", correctAnswer: "substantivos, adjetivos e verbos", rationale: "ばかりか: 英語ばかりか、安いばかりか、できるばかりか.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa ばかりか corretamente? (行くばかりか来た/英語ばかりか日本語も話せる/静かなばかりか/食べるばかりか行く)", correctAnswer: "英語ばかりか日本語も話せる", rationale: "英語 (subst.) + ばかりか + 日本語も = estrutura correta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "成績が悪い___か、遅刻も多い (ばかり/だけ/しか/まで)", correctAnswer: "ばかり", rationale: "成績が悪いばかりか = não só as notas são ruins.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ばかりか é tipicamente seguido de: (mas (contraste)/também Y (adição)/portanto/porque)", correctAnswer: "também Y (adição)", rationale: "ばかりか → Y も / Y さえも — adição que vai além.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "料理が得意な___か、掃除も上手だ (ばかり/だけ/しか/まで)", correctAnswer: "ばかり", rationale: "料理が得意なばかりか = não só é boa na cozinha.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この本は安い___か、内容も素晴らしい (ばかり/だけ/しか/まで)", correctAnswer: "ばかり", rationale: "安いばかりか = não só é barato, o conteúdo também é ótimo.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
