title: 📝 ～にしては (para ser / considerando que é)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～にしては indica que o resultado é surpreendente considerando o que X é ou representa. Equivalente a 'para ser X' ou 'considerando que é X'. Tom de surpresa (positiva ou negativa)."
example: "Surpresa em relação ao esperado. Ex.: 初めてにしては、上手だ → Para ser a primeira vez, está bem feito."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Reconhecer ～にしては
    description: Escolha o significado correto das frases com ～にしては.
    exercises:
      - { type: japanese_vocab, question: "初めてにしては、上手だ (está ruim para iniciante/para uma pessoa que já faz há anos/para ser a primeira vez está bem feito/é especialista)", correctAnswer: "para ser a primeira vez está bem feito", rationale: "Regra: 名詞/形容詞/動詞 + にしては → para ser X, Y é surpreendente. 初めて(名詞)+にしては+上手だ. Formula: [基準]+にしては+[意外な結果]. にしては → contra o esperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供にしては、よく知っている (para um adulto/para ser criança sabe bastante/a criança não sabe nada/o adulto é mais sábio)", correctAnswer: "para ser criança sabe bastante", rationale: "Regra: 名詞 + にしては + 意外な結果. 子供(名詞)+にしては+よく知っている. Estrutura: [categoria(子供)]にしては+[resultado acima do esperado]. Surpresa positiva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本人にしては、英語が下手だ (o estrangeiro não fala inglês/para ser japonês o inglês é surpreendentemente ruim/todos os japoneses falam inglês/o inglês é ótimo)", correctAnswer: "para ser japonês o inglês é surpreendentemente ruim", rationale: "Regra: 名詞 + にしては + 意外(negativo). 日本人にしては → padrão esperado → bom; 英語が下手 → resultado abaixo do esperado. にしては aceita surpresa negativa também.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "高いにしては、品質が悪い (o preço é baixo/para ser caro a qualidade é surpreendentemente ruim/o produto é ótimo/o preço é justo)", correctAnswer: "para ser caro a qualidade é surpreendentemente ruim", rationale: "Regra: 形容詞い + にしては. 高い(i-adj)+にしては+品質が悪い. Lógica: caro → espera-se qualidade; resultado: qualidade ruim. Formula: [i-adj]+にしては+[resultado contrário ao esperado].", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "有名にしては、謙虚だ (pessoas famosas são sempre humildes/para ser famoso é surpreendentemente humilde/é desconhecido/a humildade é normal para famosos)", correctAnswer: "para ser famoso é surpreendentemente humilde", rationale: "Regra: 形容詞な + にしては. 有名(な adj.)+にしては+謙虚だ. Padrão com na-adj: 有名にしては, 不便にしては, 丁寧にしては. Surpresa positiva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "10歳にしては、大人っぽい (é velho/para ter 10 anos parece surpreendentemente adulto/é muito infantil/10 anos é normal)", correctAnswer: "para ter 10 anos parece surpreendentemente adulto", rationale: "Regra: 名詞 + にしては. 10歳(名詞)+にしては+大人っぽい. 大人っぽい = 大人(adulto)+っぽい(parece). Lógica: 10 anos → esperado infantil; resultado: maduro (surpresa).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外国人にしては、日本語が上手だ (esperado ser bom/para ser estrangeiro o japonês está surpreendentemente bem/todos os estrangeiros falam japonês/não é estrangeiro)", correctAnswer: "para ser estrangeiro o japonês está surpreendentemente bem", rationale: "Regra: 名詞 + にしては. 外国人(名詞)+にしては+上手だ. Expectativa padrão → japonês limitado para estrangeiro; 上手 → supera a expectativa. Surpresa positiva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "運動しているにしては、太っている (o exercício não ajuda/para estar se exercitando está surpreendentemente acima do peso/não se exercita/está muito magro)", correctAnswer: "para estar se exercitando está surpreendentemente acima do peso", rationale: "Regra: 動詞(ている形) + にしては. 運動している(estado contínuo)+にしては+太っている. にしては aceita ている. Lógica: exercício → espera-se magro; resultado: gordo (surpresa).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新人にしては、落ち着いている (para alguém experiente/para ser novato está surpreendentemente calmo/todos os novatos são calmos/está muito nervoso)", correctAnswer: "para ser novato está surpreendentemente calmo", rationale: "Regra: 名詞 + にしては. 新人(novato)+にしては+落ち着いている(calmo). Lógica: novato → espera nervosismo; resultado: tranquilidade. Surpresa positiva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "安いにしては、おいしい (é caro/para ser barato está surpreendentemente gostoso/não é barato/sabor fraco para o preço)", correctAnswer: "para ser barato está surpreendentemente gostoso", rationale: "Regra: 形容詞い + にしては. 安い(i-adj)+にしては+おいしい. Lógica: barato → espera-se mediano; resultado: delicioso. Surpresa positiva. Cf.: 安いのに、おいしい (ênfase diferente).", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～にしては
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "にしては indica: (resultado esperado/resultado surpreendente em relação ao esperado/resultado certo/resultado necessário)", correctAnswer: "resultado surpreendente em relação ao esperado", rationale: "Regra: にしては → para ser X, Y é surpreendente. Formula: [基準]にしては+[意外な結果]. Chave: にしては sempre implica que o resultado contraria a expectativa ligada ao padrão X.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にしては conecta com: (apenas substantivos/substantivos, adjetivos e verbos/apenas verbos/apenas adjetivos)", correctAnswer: "substantivos, adjetivos e verbos", rationale: "Regra: にしては aceita: 名詞(子供にしては), 形容詞い(高いにしては), 形容詞な(有名にしては), 動詞ている(運動しているにしては). Muito flexível na conexão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "初めて___にしては、よくできた (の/が/を/で)", correctAnswer: "の", rationale: "Regra: 名詞 + の + にしては (quando o nome termina em 形容動詞/명사類). 初めて+の+にしては. Nota: 子供にしては(sem の); 初めてのにしては(com の). O の conecta como modificador nominal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "夏___しては、涼しい (に/が/を/で)", correctAnswer: "に", rationale: "Regra: 名詞 + に + しては. 夏+に+しては → para ser verão. にしては → に(partícula)+しては(condicional de する). Formula: [名詞]+にしては → para ser [nome].", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa にしては corretamente? (行くにしては来た/子供にしては賢い/静かにしては/難しいのにしては)", correctAnswer: "子供にしては賢い", rationale: "子供(名詞)+にしては+賢い(resultado surpreendente) ✓. Armadilha: 行くにしては → 辞書形 ✗ (verbos precisam de ている); 静かにしては → に + しては (静かに → adv., não substantivo).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ベテラン___にしては、ミスが多い (の/が/を/で)", correctAnswer: "の", rationale: "Regra: 名詞 + の + にしては. ベテラン+の+にしては+ミスが多い → surpresa negativa. Cf.: 子供にしては(sem の) vs ベテランのにしては(com の — varia com naturalidade).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "練習している___にしては、上達が遅い (に/が/を/で)", correctAnswer: "に", rationale: "Regra: 動詞ている + に + しては. 練習している+に+しては → para estar praticando. Formula: [動詞ている]+にしては+[resultado abaixo do esperado].", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にしては pode expressar: (apenas admiração/surpresa positiva ou negativa/apenas crítica/apenas elogio)", correctAnswer: "surpresa positiva ou negativa", rationale: "Regra: にしては → resultado inesperado bidirecional. Positivo: 安いにしては+おいしい. Negativo: 高いにしては+品質が悪い. O tom depende do resultado, não da partícula.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "年齢___にしては、元気だ (の/が/を/で)", correctAnswer: "の", rationale: "Regra: 名詞 + の + にしては. 年齢+の+にしては → para a idade que tem. 年齢のにしては+元気だ → ativo acima do esperado para a idade. の conecta 年齢 a にしては.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "長年住んでいる___しては、知らないことが多い (に/が/を/で)", correctAnswer: "に", rationale: "Regra: 動詞ている + に + しては. 長年住んでいる+に+しては → para morar há tanto tempo. Formula: [動詞ている]+にしては+[resultado surpreendentemente abaixo do esperado].", difficulty: 5, objectives: [japanese.grammar] }
target: 20
