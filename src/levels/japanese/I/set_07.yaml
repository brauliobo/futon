title: 📝 ～にしては (para ser / considerando que é)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～にしては indica que o resultado é surpreendente considerando o que X é ou representa. Equivalente a 'para ser X' ou 'considerando que é X'. Tom de surpresa (positiva ou negativa)."
example: "Surpresa em relação ao esperado. Ex.: 初めてにしては、上手だ → Para ser a primeira vez, está bem feito."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～にしては
    description: Escolha o significado correto das frases com ～にしては.
    exercises:
      - { type: japanese_vocab, question: "初めてにしては、上手だ (para uma pessoa que já faz há anos/para ser a primeira vez está bem feito/é especialista/está ruim para iniciante)", correctAnswer: "para ser a primeira vez está bem feito", rationale: "にしては = para ser X + resultado surpreendentemente bom.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供にしては、よく知っている (para um adulto/para ser criança sabe bastante/a criança não sabe nada/o adulto é mais sábio)", correctAnswer: "para ser criança sabe bastante", rationale: "子供にしては = para uma criança + conhecimento surpreendente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本人にしては、英語が下手だ (o estrangeiro não fala inglês/para ser japonês o inglês é surpreendentemente ruim/todos os japoneses falam inglês/o inglês é ótimo)", correctAnswer: "para ser japonês o inglês é surpreendentemente ruim", rationale: "にしては = resultado surpreendente (aqui negativo) para o grupo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "高いにしては、品質が悪い (o preço é baixo/para ser caro a qualidade é surpreendentemente ruim/o produto é ótimo/o preço é justo)", correctAnswer: "para ser caro a qualidade é surpreendentemente ruim", rationale: "高いにしては = considerando o preço alto + qualidade inferior.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "有名にしては、謙虚だ (pessoas famosas são sempre humildes/para ser famoso é surpreendentemente humilde/é desconhecido/a humildade é normal para famosos)", correctAnswer: "para ser famoso é surpreendentemente humilde", rationale: "有名にしては = considerando ser famoso + atitude incomum.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "10歳にしては、大人っぽい (é velho/para ter 10 anos parece surpreendentemente adulto/é muito infantil/10 anos é normal)", correctAnswer: "para ter 10 anos parece surpreendentemente adulto", rationale: "10歳にしては = considerando ter 10 anos + maturidade inesperada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外国人にしては、日本語が上手だ (esperado ser bom/para ser estrangeiro o japonês está surpreendentemente bem/todos os estrangeiros falam japonês/não é estrangeiro)", correctAnswer: "para ser estrangeiro o japonês está surpreendentemente bem", rationale: "外国人にしては = considerando ser estrangeiro + boa habilidade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "運動しているにしては、太っている (o exercício não ajuda/para estar se exercitando está surpreendentemente acima do peso/não se exercita/está muito magro)", correctAnswer: "para estar se exercitando está surpreendentemente acima do peso", rationale: "運動しているにしては = considerando o exercício + peso inesperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新人にしては、落ち着いている (para alguém experiente/para ser novato está surpreendentemente calmo/todos os novatos são calmos/está muito nervoso)", correctAnswer: "para ser novato está surpreendentemente calmo", rationale: "新人にしては = para ser novato + tranquilidade inesperada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "安いにしては、おいしい (é caro/para ser barato está surpreendentemente gostoso/não é barato/sabor fraco para o preço)", correctAnswer: "para ser barato está surpreendentemente gostoso", rationale: "安いにしては = para ser barato + qualidade boa.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～にしては
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "にしては indica: (resultado esperado/resultado surpreendente em relação ao esperado/resultado certo/resultado necessário)", correctAnswer: "resultado surpreendente em relação ao esperado", rationale: "にしては = para ser X + Y inesperado (positivo ou negativo).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にしては conecta com: (apenas substantivos/substantivos, adjetivos e verbos/apenas verbos/apenas adjetivos)", correctAnswer: "substantivos, adjetivos e verbos", rationale: "にしては: 子供にしては、高いにしては、運動しているにしては.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "初めて___にしては、よくできた (の/が/を/で)", correctAnswer: "の", rationale: "初めてのにしては = para ser a primeira vez.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "夏___しては、涼しい (に/が/を/で)", correctAnswer: "に", rationale: "夏にしては = para ser verão está surpreendentemente fresco.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa にしては corretamente? (行くにしては来た/子供にしては賢い/静かにしては/難しいのにしては)", correctAnswer: "子供にしては賢い", rationale: "子供にしては = para ser criança + 賢い = inteligente (surpreendente).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ベテラン___にしては、ミスが多い (の/が/を/で)", correctAnswer: "の", rationale: "ベテランのにしては = para ser veterano, tem muitos erros.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "練習している___にしては、上達が遅い (に/が/を/で)", correctAnswer: "に", rationale: "練習しているにしては = para estar praticando, a evolução é lenta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にしては pode expressar: (apenas admiração/surpresa positiva ou negativa/apenas crítica/apenas elogio)", correctAnswer: "surpresa positiva ou negativa", rationale: "にしては = resultado inesperado — pode ser admiração ou decepção.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "年齢___にしては、元気だ (の/が/を/で)", correctAnswer: "の", rationale: "年齢のにしては = para a idade que tem, está surpreendentemente ativo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "長年住んでいる___しては、知らないことが多い (に/が/を/で)", correctAnswer: "に", rationale: "長年住んでいるにしては = para morar há anos, não sabe muitas coisas.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
