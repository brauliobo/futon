title: 📝 ～どころではない (não é hora de / impossível)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～どころではない indica que algo é impossível ou inadequado dada a situação atual. Equivalente a 'não é hora de X' ou 'está longe de conseguir X'. Mais situacional que どころか."
example: "Impossibilidade situacional. Ex.: 試験で忙しくて、遊んどころではない → Estou tão ocupado com a prova que não é hora de brincar."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～どころではない
    description: Escolha o significado correto das frases com ～どころではない.
    exercises:
      - { type: japanese_vocab, question: "試験で忙しくて、遊ぶどころではない (pode brincar/estou tão ocupado com a prova que não é hora de brincar/a prova foi fácil/tem tempo livre)", correctAnswer: "estou tão ocupado com a prova que não é hora de brincar", rationale: "Regra: [situação difícil] + て + [ação]どころではない → a situação impossibilita a ação. 試験で忙しくて(causa) → 遊ぶどころではない(impossibilidade).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お金がなくて、旅行どころではない (vai viajar/está sem dinheiro então viagem está fora de questão/tem dinheiro para viajar/a viagem foi barata)", correctAnswer: "está sem dinheiro então viagem está fora de questão", rationale: "Regra: お金がなくて(restrição) + 旅行(名詞)どころではない → substantivo + どころではない = 'nem falar em X'. 名詞 conecta diretamente sem partícula.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "熱があって、食べるどころではない (come muito quando com febre/com febre nem pensar em comer/a comida está boa/a febre não afeta o apetite)", correctAnswer: "com febre nem pensar em comer", rationale: "Regra: 熱がある(condição física) + て + 食べる(動詞辞書形)どころではない → estado físico que impossibilita a ação básica de comer.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "忙しくて、休むどころではない (pode descansar depois/está tão ocupado que descansar está fora de questão/descansou ontem/tem tempo livre)", correctAnswer: "está tão ocupado que descansar está fora de questão", rationale: "Regra: 忙しくて(intensidade) + 休む(descansar)どころではない → ocupação extrema torna o descanso impossível. Padrão: [adj くて] + [ação]どころではない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "痛くて、笑うどころではない (ri bastante com dor/com tanta dor rir está fora de questão/não sente dor/a dor passou)", correctAnswer: "com tanta dor rir está fora de questão", rationale: "Regra: 痛くて(dor como impedimento) + 笑うどころではない → dor impossibilita até a ação mais leve (rir). Quanto mais grave o impedimento, mais absurda a ação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "緊急事態で、のんびりどころではない (pode relaxar/em estado de emergência não é hora de relaxar/a emergência passou/está tranquilo)", correctAnswer: "em estado de emergência não é hora de relaxar", rationale: "Regra: 緊急事態(substantivo = emergência) + で(causa) + のんびり(adv)どころではない → urgência torna o relaxamento inadequado socialmente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "泣きたいどころではなかった (tinha vontade de chorar/a situação era tão grave que chorar nem era opção/estava feliz/tinha tempo para chorar)", correctAnswer: "a situação era tão grave que chorar nem era opção", rationale: "Regra: 泣きたい(た い-forma = desejo) + どころではなかった(passado) → a situação era tão extrema que nem o desejo básico de chorar era opção.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "仕事が山積みで、昼食どころではない (almoça normalmente/com trabalho acumulado nem pensar em almoçar/o trabalho está terminado/tem pausa para almoço)", correctAnswer: "com trabalho acumulado nem pensar em almoçar", rationale: "Regra: 仕事が山積み(sobrecarga extrema) + で + 昼食(名詞)どころではない → volume de trabalho impossibilita até a pausa para almoço.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外が嵐で、出かけるどころではない (pode sair na tempestade/com tempestade lá fora sair está fora de questão/o tempo está bom/saiu mesmo com chuva)", correctAnswer: "com tempestade lá fora sair está fora de questão", rationale: "Regra: 嵐(tempestade, condição externa) + で + 出かける(verbo)どころではない → condição climática extrema impossibilita a saída.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "締め切りが明日で、睡眠どころではない (dorme bem/com o prazo amanhã dormir está fora de questão/o prazo é semana que vem/dormiu bastante)", correctAnswer: "com o prazo amanhã dormir está fora de questão", rationale: "Regra: 締め切りが明日(urgência temporal) + で + 睡眠(名詞)どころではない → prazo iminente torna o sono impossível. 睡眠 = substantivo conecta diretamente.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～どころではない
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "どころではない indica: (que algo é recomendado/que algo é impossível ou inadequado dada a situação/que algo é obrigatório/que algo é normal)", correctAnswer: "que algo é impossível ou inadequado dada a situação", rationale: "Raiz: どころ = lugar/ponto de + では(nega) + ない → 'não é o momento/lugar para'. Fórmula: [situação extrema] → [ação]どころではない = a situação não permite.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual é a diferença entre どころか e どころではない? (mesma coisa/どころか = contraste radical; どころではない = impossibilidade situacional/どころではない = contraste; どころか = impossibilidade/nenhuma)", correctAnswer: "どころか = contraste radical; どころではない = impossibilidade situacional", rationale: "Regra: どころか = 'longe de X, pelo contrário Y' (contraste/inversão). どころではない = 'a situação impossibilita X' (situação extrema). Exemplos: 上手どころか下手 vs 試験で遊ぶどころではない.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "忙しくて、旅行___ではない (どころ/もの/はず/こと)", correctAnswer: "どころ", rationale: "Regra: 旅行(名詞) + どころ + ではない. もの/はず/こと têm significados distintos. どころ é o único que forma 'impossibilidade situacional' com ではない.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どころではない conecta com: (apenas substantivos/apenas verbos/substantivos e verbos (る)/apenas adjetivos)", correctAnswer: "substantivos e verbos (る)", rationale: "Regra: 名詞 + どころではない (旅行どころではない); 動詞(辞書形) + どころではない (食べるどころではない). Adjetivos não conectam diretamente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "痛くて笑う___ではない (どころ/もの/はず/こと)", correctAnswer: "どころ", rationale: "Regra: 笑う(動詞辞書形) + どころ + ではない → dor impossibilita rir. はず = expectativa; もの = generalização; こと = fato/nominalização. Só どころ forma impossibilidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa どころではない corretamente? (食べるどころではない忙しい/試験で遊ぶどころではない/静かなどころではない/行くどころでない来る)", correctAnswer: "試験で遊ぶどころではない", rationale: "Regra: 試験で(situação extrema) + 遊ぶ(verbo辞書形)どころではない → causa + impossibilidade. 食べるどころではない忙しい inverte a ordem; 静かな(adj-な) não conecta com どころ.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嵐で出かける___ではない (どころ/もの/はず/こと)", correctAnswer: "どころ", rationale: "Regra: 出かける(verbo辞書形) + どころ + ではない → a tempestade impossibilita sair. どころ marca o 'ponto de impossibilidade' da ação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どころではない é mais provável em contexto de: (felicidade/urgência, dor ou sobrecarga/lazer/rotina)", correctAnswer: "urgência, dor ou sobrecarga", rationale: "Regra: どころではない requer situação extrema como causa. Padrão: 緊急 (urgência) / 病気・痛み (dor) / 仕事山積み (sobrecarga) → impossibilidade total da ação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "熱があって食べる___ではない (どころ/もの/はず/こと)", correctAnswer: "どころ", rationale: "Regra: 食べる(辞書形) + どころ + ではない. 熱がある = causa física. はず indicaria expectativa ('deveria comer'); どころではない = 'nem pensar em comer'.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "仕事で疲れて、遊び___ではない (どころ/もの/はず/こと)", correctAnswer: "どころ", rationale: "Regra: 遊び(名詞形) + どころ + ではない → cansaço extremo impossibilita diversão. 遊び conecta como substantivo. Fórmula: [名詞]どころではない.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
