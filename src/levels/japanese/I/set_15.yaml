title: 💬 Vocabulário N3 — relações humanas e sociedade
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Vocabulário N3 para relações humanas e interações sociais. Essencial para compreensão de textos sobre comportamento, ética e dinâmicas sociais japonesas."
example: "Aprenda vocabulário social N3. Ex.: 絆 → laço/vínculo afetivo."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Vocabulário social — reconhecer
    description: Escolha o significado correto do vocabulário social.
    exercises:
      - { type: japanese_vocab, question: "絆 (きずな) (rivalidade/laço e vínculo afetivo/conflito/distância)", correctAnswer: "laço e vínculo afetivo", rationale: "絆: kanji único de 糸(fio/corda) + 半(metade) → fio que une duas metades = laço afetivo profundo. Diferente de 関係(relação formal).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "摩擦 (まさつ) (harmonia/atrito e tensão/cooperação/acordo)", correctAnswer: "atrito e tensão", rationale: "摩(esfregar) + 擦(raspar) → 摩擦 = friccionar = atrito. Na física: resistência ao movimento; nas relações: tensão/conflito entre pessoas.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "偏見 (へんけん) (compreensão/preconceito/tolerância/respeito)", correctAnswer: "preconceito", rationale: "偏(tendencioso/inclinado) + 見(visão/opinião) → 偏見 = visão inclinada para um lado = preconceito. 偏 = não neutro, parcial.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "連帯 (れんたい) (isolamento/solidariedade e união/rivalidade/conflito)", correctAnswer: "solidariedade e união", rationale: "連(conectar/em série) + 帯(cinto/faixa que une) → 連帯 = estar unidos em faixa = solidariedade coletiva, senso de grupo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "配慮 (はいりょ) (negligência/consideração e cuidado com o outro/indiferença/egoísmo)", correctAnswer: "consideração e cuidado com o outro", rationale: "配(distribuir/alocar) + 慮(ponderar/refletir) → 配慮 = distribuir reflexão = considerar as necessidades do outro. Conceito central de 気遣い japonês.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "妥協 (だきょう) (princípio rígido/compromisso e concessão/conflito/recusa)", correctAnswer: "compromisso e concessão", rationale: "妥(ajustar/acomodar) + 協(cooperar) → 妥協 = ajustar cooperando = fazer concessões mútuas para chegar a acordo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "孤独 (こどく) (companhia/solidão/alegria/celebração)", correctAnswer: "solidão", rationale: "孤(órfão/isolado) + 独(sozinho/único) → 孤独 = isolado e sozinho = solidão. Dois kanji com sentido similar reforçam o isolamento total.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "貢献 (こうけん) (prejuízo/contribuição/atraso/obstáculo)", correctAnswer: "contribuição", rationale: "貢(oferecer tributo/dar) + 献(dedicar/oferecer) → 貢献 = oferecer e dedicar = contribuição positiva para grupo ou sociedade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "誤解 (ごかい) (entendimento/mal-entendido/acordo/clareza)", correctAnswer: "mal-entendido", rationale: "誤(errar/equivocar) + 解(entender/desfazer) → 誤解 = entender de forma errada = mal-entendido. 誤 inverte o sentido positivo de 解.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "協力 (きょうりょく) (competição/cooperação/conflito/rivalidade)", correctAnswer: "cooperação", rationale: "協(cooperar em harmonia) + 力(força/poder) → 協力 = unir forças = cooperação. Diferença: 協力 = somar forças; 競争 = competir.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Vocabulário social — uso em frases
    description: Escolha a palavra correta para completar as frases sociais.
    exercises:
      - { type: japanese_vocab, question: "互いに___して問題を解決した (協力/摩擦/孤独/偏見)", correctAnswer: "協力", rationale: "協(harmonizar) + 力(força) → 協力する = somar forças. 互いに(mutuamente) + 協力 = cooperação bilateral → resolve o problema.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___が深まると人間関係がうまくいく (絆/摩擦/孤独/偏見)", correctAnswer: "絆", rationale: "絆(fio que une) + が深まる(aprofundar) → laços mais fortes → 人間関係がうまくいく = boas relações. 深まる = tornar mais profundo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "文化の違いから___が生まれた (摩擦/協力/絆/貢献)", correctAnswer: "摩擦", rationale: "摩(esfregar) + 擦(raspar) → atrito. 文化の違い(diferença cultural) → 摩擦が生まれた = atrito/tensão surge do contato entre culturas diferentes.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を持って接することが大切だ (配慮/孤独/誤解/妥協)", correctAnswer: "配慮", rationale: "配(distribuir) + 慮(ponderar) → 配慮 = atenção cuidadosa ao outro. 配慮を持って接する = tratar considerando as necessidades/sentimentos da outra pessoa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お互いに___して解決した (妥協/孤独/偏見/摩擦)", correctAnswer: "妥協", rationale: "妥(acomodar) + 協(cooperar) → 妥協する = fazer concessões. お互いに妥協 = ambas as partes cedem algo → resolução de conflito.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を感じて部屋に引きこもった (孤独/協力/絆/貢献)", correctAnswer: "孤独", rationale: "孤(isolado) + 独(sozinho) → 孤独を感じる = sentir solidão. 部屋に引きこもった = se isolou no quarto = comportamento típico de quem sente 孤独.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社会に___した人物を讃える (貢献/摩擦/偏見/孤独)", correctAnswer: "貢献", rationale: "貢(oferecer) + 献(dedicar) → 社会に貢献する = contribuir para a sociedade. 讃える = louvar = reconhecimento de contribuição positiva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を解くために話し合った (誤解/摩擦/絆/孤独)", correctAnswer: "誤解", rationale: "誤(errado) + 解(entender) → 誤解を解く = desfazer(解く) o mau-entendido. 解 aparece nos dois sentidos: 誤解(mal-entendido) e 解く(desfazer).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を持たないように努める (偏見/協力/絆/配慮)", correctAnswer: "偏見", rationale: "偏(inclinado/parcial) + 見(visão) → 偏見を持つ = ter preconceito. 持たないように努める = esforçar-se para não ter → combate ao preconceito.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___の精神で困難を乗り越えた (連帯/孤独/摩擦/偏見)", correctAnswer: "連帯", rationale: "連(conectar) + 帯(cinto que une) → 連帯の精神 = espírito de solidariedade coletiva. 困難を乗り越える = superar dificuldades juntos, não sozinho.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
