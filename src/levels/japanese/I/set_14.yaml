title: 📝 ～のみならず (não apenas... mas também — formal)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～のみならず é a versão formal de だけでなく / ばかりか. Equivalente a 'não apenas X, mas também Y'. Tom literário e acadêmico. Muito usado em textos formais e discursos."
example: "Adição formal. Ex.: この問題は国内のみならず、世界規模の課題だ → Este problema não é apenas nacional, é um desafio mundial."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～のみならず
    description: Escolha o significado correto das frases com ～のみならず.
    exercises:
      - { type: japanese_vocab, question: "この問題は国内のみならず、世界規模の課題だ (é apenas um problema nacional/não é apenas nacional é um desafio mundial/só países desenvolvidos enfrentam/não é um problema)", correctAnswer: "não é apenas nacional é um desafio mundial", rationale: "Regra: X + のみならず + Y も → não só X, mas também Y (formal). 国内(nacional) → のみならず → 世界規模(mundial).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は学術的のみならず、実践的な知識も持つ (só tem conhecimento teórico/não apenas conhecimento acadêmico, também tem conhecimento prático/não tem habilidades práticas/é apenas teórico)", correctAnswer: "não apenas conhecimento acadêmico, também tem conhecimento prático", rationale: "学術的(acadêmico) + のみならず + 実践的(prático) → extensão além do primeiro domínio mencionado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本のみならず、アジア全体が影響を受けた (só o Japão foi afetado/não apenas o Japão, toda a Ásia foi afetada/a Ásia não foi afetada/é um problema local)", correctAnswer: "não apenas o Japão, toda a Ásia foi afetada", rationale: "日本(Japão) + のみならず + アジア全体(toda Ásia) → extensão geográfica de impacto.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "環境問題は現代のみならず、将来世代にも関わる (só afeta a geração atual/não apenas a geração atual, afeta também as futuras gerações/o futuro não está em risco/é um problema passado)", correctAnswer: "não apenas a geração atual, afeta também as futuras gerações", rationale: "現代(geração atual) + のみならず + 将来世代(gerações futuras) → extensão temporal além do presente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経済的のみならず、社会的な支援が必要だ (só suporte econômico é necessário/não apenas econômico, suporte social também é necessário/nenhum suporte é necessário/só social)", correctAnswer: "não apenas econômico, suporte social também é necessário", rationale: "経済的(econômico) + のみならず + 社会的(social) → ampliação de categorias de suporte necessário.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この技術は医療のみならず、工業にも応用できる (só para medicina/não apenas medicina, pode ser aplicada também na indústria/não é aplicável/só para pesquisa)", correctAnswer: "não apenas medicina, pode ser aplicada também na indústria", rationale: "医療(medicina) + のみならず + 工業(indústria) → extensão de campo de aplicação da tecnologia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "若者のみならず、高齢者もSNSを使う (só jovens usam/não apenas jovens, idosos também usam redes sociais/idosos não usam tecnologia/todos não usam)", correctAnswer: "não apenas jovens, idosos também usam redes sociais", rationale: "若者(jovens) + のみならず + 高齢者(idosos) → extensão de grupo além do demograficamente esperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このルールは日本のみならず、世界標準だ (é só um padrão japonês/não é apenas japonês, é um padrão mundial/o mundo usa padrões diferentes/não há padrão)", correctAnswer: "não é apenas japonês, é um padrão mundial", rationale: "日本(Japão) + のみならず + 世界標準(padrão mundial) → relevância além do país de origem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食育のみならず、体育も大切だ (só educação alimentar importa/não apenas educação alimentar, educação física também é importante/a educação física não importa/só esporte)", correctAnswer: "não apenas educação alimentar, educação física também é importante", rationale: "食育(ed.alimentar) + のみならず + 体育(ed.física) → além de X, Y também tem valor.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "言語のみならず、文化の理解が必要だ (só o idioma importa/não apenas o idioma, entender a cultura também é necessário/a cultura não importa/o idioma é suficiente)", correctAnswer: "não apenas o idioma, entender a cultura também é necessário", rationale: "言語(idioma) + のみならず + 文化の理解(compreensão cultural) → além da língua, contexto cultural é indispensável.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～のみならず
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "のみならず indica: (contraste/não apenas X, mas também Y (formal)/condição/causa)", correctAnswer: "não apenas X, mas também Y (formal)", rationale: "Regra: X + のみならず + Y も → adição formal. Diferente de にもかかわらず(concessão) e から(causa).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "のみならず é equivalente a: (にもかかわらず/だけでなく (formal)/のに/ものの)", correctAnswer: "だけでなく (formal)", rationale: "だけでなく(coloquial) → のみならず(formal/literário). Mesmo significado, registro diferente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国内___ならず、海外でも使われる (のみ/だけ/しか/まで)", correctAnswer: "のみ", rationale: "国内(nacional) + のみ + ならず → のみならず = não só nacional; だけ/しか/まで não formam のみならず.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "のみならず conecta com: (apenas verbos/apenas adjetivos/substantivos e adjetivos e verbos/apenas substantivos)", correctAnswer: "substantivos e adjetivos e verbos", rationale: "国内(subst.) + のみならず / 安価な(adj.な) + のみならず / 使える(verb.) + のみならず = todos aceitam.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "若者___ならず、高齢者も (のみ/だけ/しか/まで)", correctAnswer: "のみ", rationale: "若者(jovens) + のみ + ならず → のみならず = não apenas jovens + も estende para idosos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "のみならず é adequado para: (mensagens de texto/textos acadêmicos e discursos formais/conversas informais/instruções simples)", correctAnswer: "textos acadêmicos e discursos formais", rationale: "のみならず → registro literário/formal. Em conversas usa-se だけでなく ou ばかりか.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa のみならず corretamente? (行くのみならず来た/国内のみならず世界規模の問題/静かなのみならず/難しいのみならず)", correctAnswer: "国内のみならず世界規模の問題", rationale: "国内(subst.) + のみならず + 世界規模(ampliação) = estrutura correta com resultado expandido.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経済的___ならず、精神的にも影響がある (のみ/だけ/しか/まで)", correctAnswer: "のみ", rationale: "経済的(econômico) + のみ + ならず → extensão para 精神的(espiritual/mental) com も.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "のみならず é mais enfático que: (にもかかわらず/だけでなく/のに/ものの)", correctAnswer: "だけでなく", rationale: "のみならず > だけでなく em formalidade e ênfase. にもかかわらず é concessão, não adição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "環境問題は現代___ならず、未来にも影響する (のみ/だけ/しか/まで)", correctAnswer: "のみ", rationale: "現代(presente) + のみ + ならず + 未来(futuro) + も → extensão temporal com のみならず.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
