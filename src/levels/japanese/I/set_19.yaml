title: 🔢 Kanji N3 — 生活習慣 (vida cotidiana)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N3 relacionados à vida cotidiana e hábitos: 習 (hábito/aprender), 慣 (acostumar), 生 (vida/nascer), 活 (ativo/viver), 日 (dia/sol), 常 (normal/sempre). Essenciais para textos sobre rotina."
example: "Leia o kanji e identifique o significado. Ex.: 生活 → vida cotidiana."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Kanji da vida cotidiana — leitura
    description: Leia a palavra e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "生活 (せいかつ) (trabalho/vida cotidiana/viagem/saúde)", correctAnswer: "vida cotidiana", rationale: "生(せい=vida/nascer) + 活(かつ=ativo/viver) → 生活 = modo de viver ativamente = vida cotidiana.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "習慣 (しゅうかん) (habilidade/hábito/saúde/trabalho)", correctAnswer: "hábito", rationale: "習(しゅう=aprender/praticar) + 慣(かん=acostumar) → 習慣 = praticar até se acostumar = hábito/costume.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日常 (にちじょう) (especial/cotidiano/feriado/extraordinário)", correctAnswer: "cotidiano", rationale: "日(にち=dia/sol) + 常(じょう=normal/sempre) → 日常 = o que é normal todos os dias = cotidiano.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "活動 (かつどう) (descanso/atividade/sono/inatividade)", correctAnswer: "atividade", rationale: "活(かつ=ativo/viver) + 動(どう=mover) → 活動 = mover-se de forma ativa = atividade/ação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "慣れる (なれる) (aprender/acostumar-se/ensinar/esquecer)", correctAnswer: "acostumar-se", rationale: "慣(なれ=acostumar) + れる(sufixo verbal intransitivo) → 慣れる = tornar-se acostumado (mudança natural de estado).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康管理 (けんこうかんり) (tratamento médico/gestão da saúde/remédio/hospital)", correctAnswer: "gestão da saúde", rationale: "健(けん=saudável) + 康(こう=paz/bem-estar) + 管(かん=gerenciar) + 理(り=lógica/ordenar) → 健康(saúde) + 管理(gestão) = gestão da saúde.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日課 (にっか) (feriado/tarefa diária/dia especial/reunião)", correctAnswer: "tarefa diária", rationale: "日(にっ=dia, leitura contraída) + 課(か=tarefa/encargo) → 日課 = tarefa do dia = rotina diária.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "生涯 (しょうがい) (um dia/toda a vida/uma semana/um mês)", correctAnswer: "toda a vida", rationale: "生(しょう=vida/nascer) + 涯(がい=margem/limite) → 生涯 = do nascimento até o limite = toda a vida.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "通勤 (つうきん) (viagem de férias/deslocamento para o trabalho/passeio/compras)", correctAnswer: "deslocamento para o trabalho", rationale: "通(つう=passar/atravessar) + 勤(きん=trabalhar/servir) → 通勤 = deslocar-se para o trabalho.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "節約 (せつやく) (gasto excessivo/economia e poupança/investimento/desperdício)", correctAnswer: "economia e poupança", rationale: "節(せつ=moderar/nó) + 約(やく=restringir/acordo) → 節約 = moderar e restringir gastos = economizar.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Kanji da vida cotidiana — uso em frases
    description: Escolha o kanji correto para completar as frases.
    exercises:
      - { type: japanese_vocab, question: "___習慣を見直す (生活/活動/日常/健康)", correctAnswer: "生活", rationale: "生(vida) + 活(ativo) → 生活. 生活習慣 = hábitos do modo de vida. 活動(ação) e 日常(cotidiano) não formam esse composto com 習慣.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___の仕事に就いた (活動/通勤/日常/生涯)", correctAnswer: "通勤", rationale: "通(passar) + 勤(trabalhar) → 通勤. 通勤の仕事 = trabalho que exige deslocamento diário. 活動/生涯 não qualificam tipo de trabalho.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "毎朝散歩する___が好きだ (日課/生活/習慣/活動)", correctAnswer: "日課", rationale: "日(dia) + 課(tarefa) → 日課 = tarefa diária específica. 毎朝散歩する日課 = a rotina diária de caminhar toda manhã.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "クラブ___に参加する (活動/習慣/日常/生涯)", correctAnswer: "活動", rationale: "活(ativo) + 動(mover) → 活動 = atividade. クラブ活動 = atividades do clube. 習慣/日常/生涯 não collocam com クラブ.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___のことに感謝する (日常/生涯/通勤/節約)", correctAnswer: "日常", rationale: "日(dia) + 常(normal/sempre) → 日常 = cotidiano. 日常のことに感謝 = agradecer pelas coisas do dia a dia. 生涯=vida toda(escopo longo demais).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を通じて多くを学んだ (生涯/通勤/節約/活動)", correctAnswer: "生涯", rationale: "生(nascer) + 涯(limite/margem) → 生涯 = toda a vida. 生涯を通じて = ao longo de toda a vida. 通勤/節約/活動 têm escopo curto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___に努める (節約/日課/生涯/習慣)", correctAnswer: "節約", rationale: "節(moderar) + 約(restringir) → 節約. 節約に努める = fazer esforço para economizar. 習慣に努める seria gramaticalmente forçado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悪い___を直す (習慣/生活/通勤/活動)", correctAnswer: "習慣", rationale: "習(praticar) + 慣(acostumar) → 習慣 = hábito. 悪い習慣を直す = corrigir maus hábitos. 生活(modo de vida) é mais amplo; 直す específico com 習慣.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___管理を心がける (健康/日常/生涯/節約)", correctAnswer: "健康", rationale: "健(saudável) + 康(bem-estar) → 健康. 健康管理 = gestão da saúde. 日常管理/節約管理 existem mas 心がける (prestar atenção) coloca mais com 健康.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しい環境に___れた (慣/習/生/活)", correctAnswer: "慣", rationale: "慣(なれ=acostumar) + れた(sufixo verbal passado) → 慣れた = se acostumou. 習れた/生れた/活れた não existem como palavras.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
