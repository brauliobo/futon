title: 🔢 Kanji N3 — 生活習慣 (vida cotidiana)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N3 relacionados à vida cotidiana e hábitos: 習 (hábito/aprender), 慣 (acostumar), 生 (vida/nascer), 活 (ativo/viver), 日 (dia/sol), 常 (normal/sempre). Essenciais para textos sobre rotina."
example: "Leia o kanji e identifique o significado. Ex.: 生活 → vida cotidiana."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Kanji da vida cotidiana — leitura
    description: Leia a palavra e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "生活 (せいかつ) (trabalho/vida cotidiana/viagem/saúde)", correctAnswer: "vida cotidiana", rationale: "生活 (せいかつ) = vida cotidiana, modo de vida.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "習慣 (しゅうかん) (habilidade/hábito/saúde/trabalho)", correctAnswer: "hábito", rationale: "習慣 (しゅうかん) = hábito, costume.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日常 (にちじょう) (especial/cotidiano/feriado/extraordinário)", correctAnswer: "cotidiano", rationale: "日常 (にちじょう) = cotidiano, o dia a dia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "活動 (かつどう) (descanso/atividade/sono/inatividade)", correctAnswer: "atividade", rationale: "活動 (かつどう) = atividade, ação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "慣れる (なれる) (aprender/acostumar-se/ensinar/esquecer)", correctAnswer: "acostumar-se", rationale: "慣れる = acostumar-se com algo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康管理 (けんこうかんり) (tratamento médico/gestão da saúde/remédio/hospital)", correctAnswer: "gestão da saúde", rationale: "健康管理 = gestão e cuidado com a saúde.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日課 (にっか) (feriado/tarefa diária/dia especial/reunião)", correctAnswer: "tarefa diária", rationale: "日課 (にっか) = tarefa ou rotina diária.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "生涯 (しょうがい) (um dia/toda a vida/uma semana/um mês)", correctAnswer: "toda a vida", rationale: "生涯 (しょうがい) = toda a vida, ao longo da existência.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "通勤 (つうきん) (viagem de férias/deslocamento para o trabalho/passeio/compras)", correctAnswer: "deslocamento para o trabalho", rationale: "通勤 (つうきん) = ir e voltar do trabalho.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "節約 (せつやく) (gasto excessivo/economia e poupança/investimento/desperdício)", correctAnswer: "economia e poupança", rationale: "節約 (せつやく) = economizar, poupar.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Kanji da vida cotidiana — uso em frases
    description: Escolha o kanji correto para completar as frases.
    exercises:
      - { type: japanese_vocab, question: "___習慣を見直す (生活/活動/日常/健康)", correctAnswer: "生活", rationale: "生活習慣を見直す = revisar os hábitos de vida.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___の仕事に就いた (活動/通勤/日常/生涯)", correctAnswer: "通勤", rationale: "通勤の仕事 = trabalho que exige deslocamento diário.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "毎朝散歩する___が好きだ (日課/生活/習慣/活動)", correctAnswer: "日課", rationale: "毎朝散歩する日課 = a rotina diária de caminhar toda manhã.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "クラブ___に参加する (活動/習慣/日常/生涯)", correctAnswer: "活動", rationale: "クラブ活動に参加する = participar das atividades do clube.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___のことに感謝する (日常/生涯/通勤/節約)", correctAnswer: "日常", rationale: "日常のことに感謝する = agradecer pelas coisas cotidianas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を通じて多くを学んだ (生涯/通勤/節約/活動)", correctAnswer: "生涯", rationale: "生涯を通じて = ao longo da vida toda aprendeu muito.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___に努める (節約/日課/生涯/習慣)", correctAnswer: "節約", rationale: "節約に努める = fazer esforço para economizar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悪い___を直す (習慣/生活/通勤/活動)", correctAnswer: "習慣", rationale: "悪い習慣を直す = corrigir maus hábitos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___管理を心がける (健康/日常/生涯/節約)", correctAnswer: "健康", rationale: "健康管理を心がける = ter atenção ao gerenciamento da saúde.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しい環境に___れた (慣/習/生/活)", correctAnswer: "慣", rationale: "新しい環境に慣れた = se acostumou com o novo ambiente.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
