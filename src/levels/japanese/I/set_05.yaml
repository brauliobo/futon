title: 📝 ～ことから (pelo fato de / com base em)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ことから indica que uma conclusão, nome ou hábito tem origem em um fato específico. Equivalente a 'pelo fato de' ou 'porque'. Frequente para explicar origens de nomes ou expressões."
example: "Origem ou razão. Ex.: 色が赤いことから、「赤信号」と呼ばれる → Pelo fato de ser vermelho, é chamado de 'sinal vermelho'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Reconhecer ～ことから
    description: Escolha o significado correto das frases com ～ことから.
    exercises:
      - { type: japanese_vocab, question: "色が赤いことから、赤信号と呼ばれる (a cor é azul/é chamado por outra razão/pelo fato de ser vermelho é chamado de sinal vermelho/o nome é aleatório)", correctAnswer: "pelo fato de ser vermelho é chamado de sinal vermelho", rationale: "ことから → pelo fato de — origem da denominação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外来語が多いことから、英語の影響が分かる (não há influência/pelo fato de haver muitas palavras estrangeiras entende-se a influência do inglês/o inglês não influenciou/são palavras japonesas)", correctAnswer: "pelo fato de haver muitas palavras estrangeiras entende-se a influência do inglês", rationale: "ことから = a partir do fato → conclusão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "形が富士山に似ていることから、そう呼ばれた (o nome é arbitrário/pelo fato de a forma ser similar ao Monte Fuji passou a ser chamado assim/o nome é antigo/a forma é diferente)", correctAnswer: "pelo fato de a forma ser similar ao Monte Fuji passou a ser chamado assim", rationale: "ことから → razão para o nome.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼が毎日図書館に来ることから、勉強熱心だと分かる (ele não gosta de estudar/pelo fato de vir à biblioteca todo dia entende-se que é dedicado/a biblioteca está fechada/ele não gosta de livros)", correctAnswer: "pelo fato de vir à biblioteca todo dia entende-se que é dedicado", rationale: "ことから → a partir do comportamento, conclui-se.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "成分が似ていることから、同じ植物から作られた可能性がある (não têm relação/pelo fato de os componentes serem similares possivelmente são feitos da mesma planta/as composições são diferentes/não é planta)", correctAnswer: "pelo fato de os componentes serem similares possivelmente são feitos da mesma planta", rationale: "ことから = evidência → possível conclusão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "声が震えていることから、緊張しているのが分かる (não está nervoso/pelo fato de a voz estar tremendo entende-se que está nervoso/está relaxado/a voz é normal)", correctAnswer: "pelo fato de a voz estar tremendo entende-se que está nervoso", rationale: "ことから = sinal observable → conclusão inferida.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本に長く住んでいることから、文化に詳しい (não conhece a cultura/pelo fato de morar há muito no Japão conhece bem a cultura/a cultura não importa/não mora no Japão)", correctAnswer: "pelo fato de morar há muito no Japão conhece bem a cultura", rationale: "ことから = experiência longa → conhecimento cultural.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "記録が残っていることから、歴史的事実であると判断できる (sem evidências/pelo fato de haver registros pode-se concluir que é fato histórico/os registros são falsos/é ficção)", correctAnswer: "pelo fato de haver registros pode-se concluir que é fato histórico", rationale: "ことから = evidência documental → conclusão histórica.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "症状が似ていることから、同じ病気だと考えられる (os sintomas são diferentes/pelo fato de os sintomas serem similares acredita-se ser a mesma doença/não é doença/o diagnóstico é diferente)", correctAnswer: "pelo fato de os sintomas serem similares acredita-se ser a mesma doença", rationale: "ことから = sintomas similares → mesma doença (inferência).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供の頃から絵が好きなことから、画家になった (foi forçado/pelo fato de gostar de desenho desde criança tornou-se artista/não gosta de arte/a carreira foi aleatória)", correctAnswer: "pelo fato de gostar de desenho desde criança tornou-se artista", rationale: "ことから = interesse de infância → escolha profissional.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ことから
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "ことから indica: (resultado inesperado/origem, razão ou base para conclusão/desejo/proibição)", correctAnswer: "origem, razão ou base para conclusão", rationale: "ことから = pelo fato de X → conclusão Y ou origem de Z.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "色が白い___から、「白鳥」と呼ばれる (こと/もの/はず/ため)", correctAnswer: "こと", rationale: "色が白いことから → pelo fato de ser branco, é chamado 'cisne'.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual é diferente: ことから vs わけだ? (mesma coisa/ことから = razão/origem objetiva; わけだ = conclusão lógica/わけだ = razão; ことから = conclusão/nenhuma)", correctAnswer: "ことから = razão/origem objetiva; わけだ = conclusão lógica", rationale: "ことから foca na causa/origem; わけだ foca na conclusão lógica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "動きが活発な___から、健康だと分かる (こと/もの/はず/ため)", correctAnswer: "こと", rationale: "動きが活発なことから → pelo fato de ser ativo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ことから conecta com: (apenas substantivos/adjetivos e verbos/apenas verbos る/apenas adjetivos)", correctAnswer: "adjetivos e verbos", rationale: "ことから: 赤いことから、似ていることから — adjetivos e verbos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "文字が小さい___から、老眼だと思われる (こと/もの/はず/ため)", correctAnswer: "こと", rationale: "文字が小さいことから → pelo fato de as letras serem pequenas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa ことから para explicar origem de nome? (食べることから始まった/色が黄色いことから「黄金」と呼ばれた/行ったことから来た/難しいことから止まった)", correctAnswer: "色が黄色いことから「黄金」と呼ばれた", rationale: "ことから + nome → explicação de denominação (padrão clássico).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "記録がない___から、確認できない (こと/もの/はず/ため)", correctAnswer: "こと", rationale: "記録がないことから → pelo fato de não haver registros.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ことから é frequente em: (conversas informais/textos explicativos e acadêmicos/pedidos/instruções)", correctAnswer: "textos explicativos e acadêmicos", rationale: "ことから é formal e explicativo — comum em textos acadêmicos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "形が丸い___から、「円い地球」と表現される (こと/もの/はず/ため)", correctAnswer: "こと", rationale: "形が丸いことから → pelo fato de a forma ser redonda.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
