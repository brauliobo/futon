title: 📝 ～ものの (embora / apesar de)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ものの expressa concessão: 'embora X, Y'. A segunda parte contradiz ou é inesperada em relação à primeira. Tom de ligeiro lamento ou surpresa. Similar a が/けれども mas mais formal."
example: "Concessão com lamento. Ex.: 日本語を勉強したものの、まだ話せない → Embora tenha estudado japonês, ainda não consigo falar."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～ものの
    description: Escolha o significado correto das frases com ～ものの.
    exercises:
      - { type: japanese_vocab, question: "日本語を勉強したものの、まだ話せない (estudou e já fala/embora tenha estudado ainda não consegue falar/não estudou/desistiu de estudar)", correctAnswer: "embora tenha estudado ainda não consegue falar", rationale: "ものの = embora — resultado contrário ao esperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "買ったものの、まだ使っていない (comprou e já usou/embora tenha comprado ainda não usou/não comprou/vai comprar)", correctAnswer: "embora tenha comprado ainda não usou", rationale: "ものの = embora + resultado não realizado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "頑張ったものの、成績が上がらなかった (como se esforçou as notas subiram/embora tenha se esforçado as notas não subiram/não se esforçou/as notas melhoraram muito)", correctAnswer: "embora tenha se esforçado as notas não subiram", rationale: "ものの = concessão — expectativa não cumprida.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "返事を送ったものの、読んでもらえなかった (a resposta foi lida/embora tenha enviado a resposta não foi lida/não enviou resposta/a resposta chegou tarde)", correctAnswer: "embora tenha enviado a resposta não foi lida", rationale: "ものの = embora + resultado decepcionante.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "準備はしたものの、緊張してうまくいかなかった (se preparou e foi bem/embora tenha se preparado ficou nervoso e não foi bem/não se preparou/está sempre tranquilo)", correctAnswer: "embora tenha se preparado ficou nervoso e não foi bem", rationale: "ものの = apesar de X, Y contrário.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "申し込んだものの、参加できなかった (participou/embora tenha se inscrito não pôde participar/não se inscreveu/a inscrição foi cancelada)", correctAnswer: "embora tenha se inscrito não pôde participar", rationale: "ものの = embora + impossibilidade de concretizar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "理解したものの、賛成はできない (entendeu e concordou/embora entenda não consigo concordar/não entendeu/discordou sem entender)", correctAnswer: "embora entenda não consigo concordar", rationale: "ものの = embora compreenda a posição, não concorda.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行きたいものの、時間がない (foi embora sem tempo/embora queira ir não tem tempo/não quer ir/tem muito tempo)", correctAnswer: "embora queira ir não tem tempo", rationale: "ものの = embora queira + impossibilidade por circunstância.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "謝ったものの、許してもらえなかった (foi perdoado/embora tenha pedido desculpas não foi perdoado/não pediu desculpas/o perdão foi fácil)", correctAnswer: "embora tenha pedido desculpas não foi perdoado", rationale: "ものの = embora + resultado negativo inesperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "富士山に登ったものの、頂上は霧で見えなかった (escalou e viu tudo/embora tenha escalado não conseguiu ver o topo por causa do nevoeiro/não subiu/o clima estava bom)", correctAnswer: "embora tenha escalado não conseguiu ver o topo por causa do nevoeiro", rationale: "ものの = embora + resultado decepcionante.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ものの
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "ものの expressa: (adição/concessão — embora X, resultado contrário/conclusão lógica/condição)", correctAnswer: "concessão — embora X, resultado contrário", rationale: "ものの = embora / apesar de + resultado inesperado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語を勉強した___、まだ難しい (ものの/ものだ/ものではない/ものだから)", correctAnswer: "ものの", rationale: "したものの、まだ難しい = embora tenha estudado ainda é difícil.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものの conecta com: (apenas substantivos/adjetivos い、な e verbos (た)/apenas adjetivos/apenas verbos る)", correctAnswer: "adjetivos い、な e verbos (た)", rationale: "ものの aceita: 高いものの、静かなものの、行ったものの.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行きたい___、時間がない (ものの/ものだ/ものではない/ものだから)", correctAnswer: "ものの", rationale: "行きたいものの、時間がない = embora queira ir não tem tempo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre ものの e が (concessivo)? (mesma coisa/ものの é mais formal/が é mais formal/ものの é mais coloquial)", correctAnswer: "ものの é mais formal", rationale: "ものの é mais literário/formal que が concessivo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "買っ___、まだ使っていない (たものの/てものの/るものの/ないものの)", correctAnswer: "たものの", rationale: "買ったものの = embora tenha comprado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "安い___、品質が悪い (ものの/ものだ/ものではない/ものだから)", correctAnswer: "ものの", rationale: "安いものの = embora seja barato, a qualidade é ruim.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa ものの corretamente? (行くものの来た/勉強したものの成績が悪い/静かなものの/食べるものの行く)", correctAnswer: "勉強したものの成績が悪い", rationale: "勉強したものの (た + ものの) + resultado contrário = correto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "優秀___、努力が足りない (なものの/ものの/いものの/たものの)", correctAnswer: "なものの", rationale: "優秀な + ものの = embora seja excelente, falta esforço.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "努力し___、なかなか上達しない (たものの/てものの/るものの/ないものの)", correctAnswer: "たものの", rationale: "努力したものの = embora tenha se esforçado.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
