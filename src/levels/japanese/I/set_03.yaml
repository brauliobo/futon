title: 📝 ～ものの (embora / apesar de)
level: 'I'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ものの expressa concessão: 'embora X, Y'. A segunda parte contradiz ou é inesperada em relação à primeira. Tom de ligeiro lamento ou surpresa. Similar a が/けれども mas mais formal."
example: "Concessão com lamento. Ex.: 日本語を勉強したものの、まだ話せない → Embora tenha estudado japonês, ainda não consigo falar."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～ものの
    description: Escolha o significado correto das frases com ～ものの.
    exercises:
      - { type: japanese_vocab, question: "日本語を勉強したものの、まだ話せない (estudou e já fala/embora tenha estudado ainda não consegue falar/não estudou/desistiu de estudar)", correctAnswer: "embora tenha estudado ainda não consegue falar", rationale: "Regra: [ação positiva] + たものの + [resultado negativo/inesperado]. 勉強した(esforço) → ものの → まだ話せない(resultado contrário ao esperado).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "買ったものの、まだ使っていない (comprou e já usou/embora tenha comprado ainda não usou/não comprou/vai comprar)", correctAnswer: "embora tenha comprado ainda não usou", rationale: "Regra: 買った(ação concluída) + ものの + まだ使っていない(resultado não realizado). たものの → concessão em que a ação foi feita mas o propósito não foi cumprido.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "頑張ったものの、成績が上がらなかった (como se esforçou as notas subiram/embora tenha se esforçado as notas não subiram/não se esforçou/as notas melhoraram muito)", correctAnswer: "embora tenha se esforçado as notas não subiram", rationale: "Regra: 頑張った(esforço) + ものの + 成績が上がらなかった(expectativa não cumprida). Padrão: esforço → ものの → fracasso → tom de lamento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "返事を送ったものの、読んでもらえなかった (a resposta foi lida/embora tenha enviado a resposta não foi lida/não enviou resposta/a resposta chegou tarde)", correctAnswer: "embora tenha enviado a resposta não foi lida", rationale: "Regra: 送った(ação realizada) + ものの + 読んでもらえなかった(resultado decepcionante). A ação foi concluída mas não produziu o efeito esperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "準備はしたものの、緊張してうまくいかなかった (se preparou e foi bem/embora tenha se preparado ficou nervoso e não foi bem/não se preparou/está sempre tranquilo)", correctAnswer: "embora tenha se preparado ficou nervoso e não foi bem", rationale: "Regra: 準備した(preparação) + ものの + 緊張してうまくいかなかった(fator imprevisto que anula a preparação). ものの introduz o obstáculo inesperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "申し込んだものの、参加できなかった (participou/embora tenha se inscrito não pôde participar/não se inscreveu/a inscrição foi cancelada)", correctAnswer: "embora tenha se inscrito não pôde participar", rationale: "Regra: 申し込んだ(inscrição concluída) + ものの + 参加できなかった(impossibilidade posterior). Ação concluída → ものの → impedimento inesperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "理解したものの、賛成はできない (entendeu e concordou/embora entenda não consigo concordar/não entendeu/discordou sem entender)", correctAnswer: "embora entenda não consigo concordar", rationale: "Regra: 理解した(compreensão intelectual) + ものの + 賛成できない(posição contrária). Entender ≠ concordar — ものの marca essa separação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行きたいものの、時間がない (foi embora sem tempo/embora queira ir não tem tempo/não quer ir/tem muito tempo)", correctAnswer: "embora queira ir não tem tempo", rationale: "Regra: 行きたい(desejo, forma い-adj) + ものの + 時間がない(circunstância que impossibilita). ものの aceita たい-forma: desejo → ものの → obstáculo real.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "謝ったものの、許してもらえなかった (foi perdoado/embora tenha pedido desculpas não foi perdoado/não pediu desculpas/o perdão foi fácil)", correctAnswer: "embora tenha pedido desculpas não foi perdoado", rationale: "Regra: 謝った(ação social esperada) + ものの + 許してもらえなかった(resultado negativo inesperado). Tom de lamento: fez o certo mas não funcionou.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "富士山に登ったものの、頂上は霧で見えなかった (escalou e viu tudo/embora tenha escalado não conseguiu ver o topo por causa do nevoeiro/não subiu/o clima estava bom)", correctAnswer: "embora tenha escalado não conseguiu ver o topo por causa do nevoeiro", rationale: "Regra: 登った(conquista física) + ものの + 霧で見えなかった(resultado decepcionante por fator externo). Esforço real → ものの → frustração.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ものの
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "ものの expressa: (adição/concessão — embora X, resultado contrário/conclusão lógica/condição)", correctAnswer: "concessão — embora X, resultado contrário", rationale: "Regra: ものの = concessão formal. Fórmula: [X]ものの → [Y contrário a X]. Diferente de のに(indignação) e が(neutro): ものの tem tom literário/lamentoso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語を勉強した___、まだ難しい (ものの/ものだ/ものではない/ものだから)", correctAnswer: "ものの", rationale: "Regra: した(た形) + ものの → concessão. ものだ = generalização; ものではない = proibição/negação; ものだから = causa/razão. Só ものの dá o sentido de 'embora'.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ものの conecta com: (apenas substantivos/adjetivos い、な e verbos (た)/apenas adjetivos/apenas verbos る)", correctAnswer: "adjetivos い、な e verbos (た)", rationale: "Regra: い-adj → 高いものの; な-adj → 静かなものの; verbo た → 行ったものの; たい → 行きたいものの. Exige forma predicativa antes de ものの.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行きたい___、時間がない (ものの/ものだ/ものではない/ものだから)", correctAnswer: "ものの", rationale: "Regra: 行きたい(たい-forma = い-adjetivo) + ものの → embora queira. ものだから = 'por isso/porque' (causa); ものの = 'embora' (concessão). Sentidos opostos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre ものの e が (concessivo)? (mesma coisa/ものの é mais formal/が é mais formal/ものの é mais coloquial)", correctAnswer: "ものの é mais formal", rationale: "Regra: が(concessivo) → coloquial/neutro; ものの → literário/formal com tom de lamento. Alternativas formais: ものの > けれども > が. ものの é mais típico de escrita.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "買っ___、まだ使っていない (たものの/てものの/るものの/ないものの)", correctAnswer: "たものの", rationale: "Regra: 買う → 買った(た形) + ものの → 買ったものの. ものの requer forma た antes de verbos (ação concluída). てものの/るものの não são formas padrão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "安い___、品質が悪い (ものの/ものだ/ものではない/ものだから)", correctAnswer: "ものの", rationale: "Regra: 安い(い-adj) + ものの → 'embora seja barato'. Concessão: virtude (barato) → ものの → defeito (qualidade ruim). い-adj conecta diretamente com ものの.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa ものの corretamente? (行くものの来た/勉強したものの成績が悪い/静かなものの/食べるものの行く)", correctAnswer: "勉強したものの成績が悪い", rationale: "Regra: 勉強した(た形) + ものの + 成績が悪い(resultado contrário) → estrutura correta. 行くものの (辞書形) e 食べるものの (辞書形) são incorretos; ものの requer た ou adjetivo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "優秀___、努力が足りない (なものの/ものの/いものの/たものの)", correctAnswer: "なものの", rationale: "Regra: な-adj + な + ものの. 優秀(な-adj) → 優秀な + ものの = 'embora seja excelente'. い-adj não usa な; た-forma é para verbos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "努力し___、なかなか上達しない (たものの/てものの/るものの/ないものの)", correctAnswer: "たものの", rationale: "Regra: 努力する → 努力した(た形) + ものの → 'embora tenha se esforçado'. Fórmula: verbo(た形) + ものの + resultado contrário.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
