title: 📝 ～得る (é possível que / pode ocorrer)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～得る (うる/える) indica que algo é teoricamente possível. 得る = える (ou うる em linguagem mais formal). A negativa 得ない indica impossibilidade absoluta."
example: "Possibilidade teórica. Ex.: そんなことはあり得る → Isso pode acontecer. / あり得ない → impossível."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～得る/得ない
    description: Escolha o significado correto das frases com ～得る/得ない.
    exercises:
      - { type: japanese_vocab, question: "そんなことはあり得る (isso é impossível/isso pode acontecer/isso já aconteceu/isso não existe)", correctAnswer: "isso pode acontecer", rationale: "Regra: 動詞stem + 得る(える) → possibilidade teórica. あり(stem de ある)+得る → pode existir/ocorrer. Formula: [動詞stem]+得る(える/うる) → é teoricamente possível.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "そんなことはあり得ない (isso pode acontecer/isso já aconteceu/isso é absolutamente impossível/isso é provável)", correctAnswer: "isso é absolutamente impossível", rationale: "Regra: 動詞stem + 得ない → impossibilidade absoluta. あり得ない → não pode existir nem teoricamente. Contraste: あり得る(possível) ↔ あり得ない(absolutamente impossível).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼がそれをやり得る (ele certamente não fará/ele é capaz de fazer isso/ele já fez/ele nunca tenta)", correctAnswer: "ele é capaz de fazer isso", rationale: "Regra: 動詞stem + 得る. やり(stem de やる→fazer)+得る → é possível que faça. Formula: [主語]が+[動詞stem]+得る → X é teoricamente capaz de Y.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考え得る最悪の事態 (a melhor situação imaginável/a pior situação que se pode imaginar/uma situação improvável/uma situação atual)", correctAnswer: "a pior situação que se pode imaginar", rationale: "Regra: 動詞stem + 得る (uso adjetival). 考え(stem de 考える)+得る+最悪の事態 → pior cenário imaginável. 考え得る modifica 事態 como adjetivo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "誰にでも起こり得ることだ (só acontece com poucos/pode acontecer com qualquer pessoa/nunca acontece/é impossível)", correctAnswer: "pode acontecer com qualquer pessoa", rationale: "Regra: 動詞stem + 得る. 起こり(stem de 起こる)+得る → pode ocorrer. 誰にでも → para qualquer pessoa (誰+にでも→mesmo para qualquer). Possibilidade universal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "失敗はあり得ない (falha é possível/falha é absolutamente impossível/falha já ocorreu/falha é normal)", correctAnswer: "falha é absolutamente impossível", rationale: "Regra: あり+得ない → impossibilidade absoluta. Nuance: ありえない é mais forte que 不可能 — implica nem teoricamente. Coloquialmente: あり得ない! → inacreditável/absurdo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "科学では何でも起こり得る (a ciência não permite novidades/qualquer coisa pode acontecer na ciência/a ciência é limitada/não há descobertas)", correctAnswer: "qualquer coisa pode acontecer na ciência", rationale: "Regra: 動詞stem + 得る. 起こり得る → pode ocorrer. 何でも → qualquer coisa (何+でも→mesmo o que for). Formula: 何でも+[動詞stem]+得る → tudo pode acontecer.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この状況は回避し得ない (pode evitar/a situação é evitável/a situação pode ser evitada/esta situação não pode ser evitada)", correctAnswer: "esta situação não pode ser evitada", rationale: "Regra: サ変動詞 → し+得ない. 回避する → 回避し+得ない = impossível de evitar. Padrão: [サ変verb stem (し)]+得ない = impossibilidade. Cf.: 解決し得ない, 理解し得ない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "成功はあり得る (o sucesso é impossível/o sucesso é possível/o sucesso é garantido/o sucesso já chegou)", correctAnswer: "o sucesso é possível", rationale: "Regra: あり得る → possibilidade teórica (≠ certeza). 成功がある(o sucesso existe/veio) ≠ 成功はあり得る(o sucesso é teoricamente possível). Tom: abertura para o futuro.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "信じ得ない話だ (uma história crível/uma história inacreditável/uma história verdadeira/uma história simples)", correctAnswer: "uma história inacreditável", rationale: "Regra: 動詞stem + 得ない. 信じ(stem de 信じる)+得ない → impossível de crer. 信じ得ない話 → história impossível de acreditar (得ない modifica 話 adjetivalmente).", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～得る/得ない
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "得る (える) indica: (impossibilidade/possibilidade teórica/certeza/habitualidade)", correctAnswer: "possibilidade teórica", rationale: "Regra: 得る(える) → possibilidade teórica, não certeza. Diferença: あり得る(pode acontecer) vs あるはずだ(deve existir/certeza) vs ある(existe). 得る → abertura hipotética.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "得ない (えない) indica: (possibilidade/impossibilidade absoluta/probabilidade/desejo)", correctAnswer: "impossibilidade absoluta", rationale: "Regra: 得ない(えない) → impossibilidade absoluta (mais forte que 不可能). あり得ない → impossível nem teoricamente. Escala: 難しい < 不可能 < あり得ない (impossibilidade crescente).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あり___ (える/うる) — qual forma é mais formal? (える/うる/ambos iguais/nenhum dos dois)", correctAnswer: "うる", rationale: "Regra: 得る tem duas leituras. える(coloquial/moderno) vs うる(literário/formal/clássico). あり得る(える) → cotidiano; あり得る(うる) → documentos/literatura formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考え___最善策 (得る/得ない/得た/得て)", correctAnswer: "得る", rationale: "Regra: 動詞stem + 得る (uso adjetival antes de nome). 考え得る最善策 → melhor estratégia que pode ser concebida. 考え得る modifica 最善策. Armadilha: 得た → passado; 得て → forma て.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "起こり___ (得る/得ない/得た/得て) リスクを管理する", correctAnswer: "得る", rationale: "Regra: 動詞stem + 得る (adjetival). 起こり得るリスク → riscos que podem ocorrer. 起こり得る modifica リスク. Padrão: [動詞stem]+得る+名詞 → nome que pode ser [verbo]-ado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa 得ない corretamente? (食べ得ない/あり得ない/行く得ない/する得ない)", correctAnswer: "あり得ない", rationale: "Regra: 動詞stem + 得ない. あり(stem de ある)+得ない ✓. Armadilha: 行く → 辞書形 ✗ (precisaria 行き得ない); する → 辞書形 ✗ (precisaria し得ない). stem ≠ 辞書形.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "得る conecta com: (forma ます (stem)/forma て/forma た/forma ない)", correctAnswer: "forma ます (stem)", rationale: "Regra: 動詞stem(→ます形) + 得る. あり得る, 起こり得る, 考え得る. Armadilha: 行くえる ✗ (辞書形); 行ってえる ✗ (て形). Stem → forma sem ます.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "回避___ (し得ない/する得ない/して得ない/した得ない)", correctAnswer: "し得ない", rationale: "Regra: サ変動詞 → し+得ない. 回避する → 回避し+得ない. するのstem=し. Armadilha: する得ない ✗ (する = 辞書形, não stem); して得ない ✗ (て形).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual é a diferença entre かねない e 得る? (mesma coisa/得る = possibilidade geral; かねない = risco específico de algo negativo/かねない = possibilidade geral; 得る = risco/nenhuma)", correctAnswer: "得る = possibilidade geral; かねない = risco específico de algo negativo", rationale: "得る → neutro (pode acontecer, positivo ou negativo). かねない → aviso: 'corre o risco de X negativo'. Ex.: 失敗し得る(pode falhar, neutro) vs 失敗しかねない(corre o risco de falhar, alerta).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "理解___ (し得る/する得る/して得る/した得る)", correctAnswer: "し得る", rationale: "Regra: サ変動詞stem(し)+得る. 理解する → 理解し+得る = pode ser compreendido. Armadilha: する得る ✗ (する = 辞書形); して得る ✗ (て形). Regra geral: する→し antes de 得る.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
