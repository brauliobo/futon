title: 📝 ～に加えて (além de / acrescido de)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～に加えて adiciona informação a algo já mencionado. Equivalente a 'além de X, também Y'. Indica acumulação de fatores. Tom mais formal que それに."
example: "Adição de informação. Ex.: 雨に加えて、風も強かった → Além da chuva, o vento também estava forte."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～に加えて
    description: Escolha o significado correto das frases com ～に加えて.
    exercises:
      - { type: japanese_vocab, question: "雨に加えて、風も強かった (por causa da chuva/além da chuva o vento também estava forte/apenas chuva/sem vento)", correctAnswer: "além da chuva o vento também estava forte", rationale: "に加えて = além de X, também Y — acumulação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経験に加えて、資格も必要だ (só experiência basta/além de experiência, certificação também é necessária/certificação não é necessária/experiência não importa)", correctAnswer: "além de experiência, certificação também é necessária", rationale: "に加えて = além de X, também Y.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "才能に加えて、努力も大切だ (só talento basta/além do talento, esforço também é importante/esforço não é necessário/talento não importa)", correctAnswer: "além do talento, esforço também é importante", rationale: "才能 + に加えて + 努力 = acumulação de qualidades.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "コストに加えて、時間もかかる (só custa dinheiro/além do custo, leva tempo também/não tem custo/é rápido)", correctAnswer: "além do custo, leva tempo também", rationale: "コスト + に加えて + 時間 = dois fatores negativos somados.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "美しさに加えて、機能性も高い (só é bonito/além da beleza, é também muito funcional/não é funcional/não é bonito)", correctAnswer: "além da beleza, é também muito funcional", rationale: "美しさ + に加えて + 機能性 = qualidades acumuladas.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "語学力に加えて、コミュニケーション力も必要だ (só habilidade linguística é necessária/além da habilidade linguística, comunicação também é necessária/comunicação não importa/linguagem é suficiente)", correctAnswer: "além da habilidade linguística, comunicação também é necessária", rationale: "語学力 + に加えて + コミュニケーション力 = habilidades somadas.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "高い授業料に加えて、教材費も払う (só paga mensalidade/além da mensalidade cara, também paga material didático/é gratuito/os materiais são incluídos)", correctAnswer: "além da mensalidade cara, também paga material didático", rationale: "高い授業料 + に加えて + 教材費 = custos somados.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "スキルに加えて、経験も評価される (só habilidade é avaliada/além da habilidade, experiência também é avaliada/experiência não importa/habilidade não é necessária)", correctAnswer: "além da habilidade, experiência também é avaliada", rationale: "スキル + に加えて + 経験 = critérios somados.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遅刻に加えて、忘れ物もした (só se atrasou/além de se atrasar, também esqueceu algo/chegou cedo/lembrou de tudo)", correctAnswer: "além de se atrasar, também esqueceu algo", rationale: "遅刻 + に加えて + 忘れ物 = problemas somados.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "プレゼン能力に加えて、文章力も必要だ (só apresentação importa/além de saber apresentar, escrita também é necessária/escrita não importa/apresentação é suficiente)", correctAnswer: "além de saber apresentar, escrita também é necessária", rationale: "プレゼン能力 + に加えて + 文章力 = competências somadas.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～に加えて
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "に加えて significa: (em vez de/além de/apesar de/em troca de)", correctAnswer: "além de", rationale: "に加えて = em adição a / além de.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語___加えて、中国語も話せる (に/が/を/で)", correctAnswer: "に", rationale: "日本語に加えて、中国語も = além do japonês, também fala chinês.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa に加えて corretamente? (雨に加えて晴れた/才能に加えて努力も大切だ/寒いに加えて暑い/行くに加えて来る)", correctAnswer: "才能に加えて努力も大切だ", rationale: "Substantivo + に加えて + outra qualidade = estrutura correta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "技術___加えて、センスも重要だ (に/が/を/で)", correctAnswer: "に", rationale: "技術に加えて = além da técnica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に加えて conecta com: (apenas verbos/apenas substantivos/substantivos e orações/apenas adjetivos)", correctAnswer: "substantivos e orações", rationale: "に加えて conecta com substantivos ou orações nominalizadas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "家賃___加えて、光熱費も高い (に/が/を/で)", correctAnswer: "に", rationale: "家賃に加えて = além do aluguel, as utilidades também são caras.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に加えて é mais formal que: (そして/それに/または/あるいは)", correctAnswer: "それに", rationale: "それに = coloquial; に加えて = formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外国語の習得___加えて、文化理解も必要だ (に/が/を/で)", correctAnswer: "に", rationale: "外国語の習得に加えて = além de aprender o idioma.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に加えて indica: (contraste/oposição/adição/condição)", correctAnswer: "adição", rationale: "に加えて = acrescenta informação adicional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "仕事___加えて、家事もある (に/が/を/で)", correctAnswer: "に", rationale: "仕事に加えて = além do trabalho, também tem tarefas domésticas.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
