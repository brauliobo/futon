title: 📝 ～をめぐって (em torno de / sobre a questão de)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～をめぐって indica que algo (debate, conflito, negociação) acontece em torno de um tema central. Equivalente a 'em torno de' ou 'sobre a questão de'. Tom formal."
example: "Debate em torno de algo. Ex.: 領土問題をめぐって、両国が対立した → Os dois países se confrontaram em torno da questão territorial."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～をめぐって
    description: Escolha o significado correto das frases com ～をめぐって.
    exercises:
      - { type: japanese_vocab, question: "領土問題をめぐって、両国が対立した (a questão foi resolvida/os países cooperaram/os dois países se confrontaram em torno da questão territorial/não há disputa)", correctAnswer: "os dois países se confrontaram em torno da questão territorial", rationale: "をめぐって → em torno de + conflito sobre o tema.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遺産をめぐって、家族が争った (a família cooperou/a família discutiu em torno da herança/não há herança/a família estava unida)", correctAnswer: "a família discutiu em torno da herança", rationale: "遺産 (herança) + をめぐって + 争った → conflito sobre herança.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しい政策をめぐって、議論が続く (sem debate/continua o debate em torno da nova política/a política foi aceita por todos/não há debate)", correctAnswer: "continua o debate em torno da nova política", rationale: "新しい政策 + をめぐって + 議論 → debate contínuo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "著作権をめぐって、裁判が行われた (sem processo judicial/realizou-se um julgamento em torno dos direitos autorais/os direitos foram ignorados/não houve disputa)", correctAnswer: "realizou-se um julgamento em torno dos direitos autorais", rationale: "著作権 + をめぐって + 裁判 → disputa judicial.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "予算配分をめぐって、意見が分かれた (todos concordaram/as opiniões se dividiram em torno da distribuição do orçamento/não houve discussão/o orçamento foi aceito)", correctAnswer: "as opiniões se dividiram em torno da distribuição do orçamento", rationale: "予算配分 + をめぐって + 意見が分かれた → divisão de opiniões.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "環境問題をめぐって、国際会議が開かれた (sem conferência/realizou-se uma conferência internacional em torno das questões ambientais/não há problema ambiental/os países ignoraram o tema)", correctAnswer: "realizou-se uma conferência internacional em torno das questões ambientais", rationale: "環境問題 + をめぐって + 会議 → reunião sobre o tema.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この決定をめぐって、社内で議論が起きた (todos aceitaram/surgiu debate interno em torno desta decisão/a decisão foi cancelada/não há empresa)", correctAnswer: "surgiu debate interno em torno desta decisão", rationale: "この決定 + をめぐって + 議論が起きた.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "水資源をめぐって、地域間で対立がある (sem conflito/há conflito regional em torno dos recursos hídricos/não há problema de água/as regiões cooperam)", correctAnswer: "há conflito regional em torno dos recursos hídricos", rationale: "水資源 + をめぐって + 対立 → conflito por recursos.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "原子力発電をめぐって、国民が二分した (todos concordam/a população se dividiu em torno da energia nuclear/não há debate/a questão foi resolvida)", correctAnswer: "a população se dividiu em torno da energia nuclear", rationale: "原子力発電 + をめぐって + 二分した → divisão pública.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "教育方針をめぐって、保護者が議論した (sem debate/os pais debateram em torno da política educacional/os pais concordaram/não há escola)", correctAnswer: "os pais debateram em torno da política educacional", rationale: "教育方針 + をめぐって + 議論した.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～をめぐって
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "をめぐって é tipicamente associado a: (acordo e cooperação/debate, conflito ou negociação/ação individual/hábito diário)", correctAnswer: "debate, conflito ou negociação", rationale: "をめぐって → o tema central de um debate, disputa ou negociação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遺産___めぐって争う (を/が/に/で)", correctAnswer: "を", rationale: "遺産をめぐって → em torno da herança.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa をめぐって corretamente? (食べるをめぐって/政策をめぐって議論/静かなをめぐって/行くをめぐって)", correctAnswer: "政策をめぐって議論", rationale: "政策 (substantivo) + をめぐって + debate → estrutura correta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題___めぐる議論が続く (を/が/に/で)", correctAnswer: "を", rationale: "をめぐる (forma adjetival) + 議論 → debate em torno deste problema.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をめぐって conecta com: (verbos/adjetivos/substantivos/orações)", correctAnswer: "substantivos", rationale: "をめぐって: tema (substantivo) + をめぐって + ação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "権利___めぐって対立した (を/が/に/で)", correctAnswer: "を", rationale: "権利をめぐって → em torno dos direitos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をめぐる (forma adjetival) modifica: (verbos/substantivos/adjetivos/advérbios)", correctAnswer: "substantivos", rationale: "をめぐる + 名詞: 問題をめぐる議論 → debate em torno da questão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その計画___めぐり、賛否が分かれた (を/が/に/で)", correctAnswer: "を", rationale: "その計画をめぐり → em torno do plano (forma contraída).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をめぐって é adequado para: (ações cotidianas/questões controversas e debates/hábitos pessoais/preferências)", correctAnswer: "questões controversas e debates", rationale: "をめぐって indica que o tema é centro de controvérsia ou debate.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "条約___めぐる交渉 (を/が/に/で)", correctAnswer: "を", rationale: "条約をめぐる交渉 → negociações em torno do tratado.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
