title: 🔢 Kanji N3 — 結果原因理由 (causa e efeito)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N3 para causa e efeito: 結 (resultado/laço), 果 (fruto/resultado), 原 (origem/campo), 因 (causa), 理 (razão/lógica), 由 (motivo/razão). Essenciais para argumentação."
example: "Leia o kanji e identifique o significado. Ex.: 原因 → causa."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Kanji de causa e efeito — leitura
    description: Leia a palavra e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "原因 (げんいん) (resultado/causa/razão lógica/motivo)", correctAnswer: "causa", rationale: "原因 (げんいん) → causa, o que produz um efeito.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "結果 (けっか) (causa/início/resultado/processo)", correctAnswer: "resultado", rationale: "結果 (けっか) → resultado, consequência.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "理由 (りゆう) (resultado/causa/razão/início)", correctAnswer: "razão", rationale: "理由 (りゆう) → razão, justificativa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "因果 (いんが) (resultado/causa e efeito/razão lógica/processo)", correctAnswer: "causa e efeito", rationale: "因果 (いんが) → relação de causa e efeito, karma.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "結論 (けつろん) (causa/conclusão/razão/início)", correctAnswer: "conclusão", rationale: "結論 (けつろん) → conclusão, resultado de um raciocínio.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "原理 (げんり) (resultado/princípio fundamental/causa/razão)", correctAnswer: "princípio fundamental", rationale: "原理 (げんり) → princípio, fundamento teórico.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "理論 (りろん) (prática/teoria/resultado/causa)", correctAnswer: "teoria", rationale: "理論 (りろん) → teoria, sistema de ideias.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "由来 (ゆらい) (resultado/origem e história/causa/conclusão)", correctAnswer: "origem e história", rationale: "由来 (ゆらい) → origem, história etimológica.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "結末 (けつまつ) (causa/desfecho/início/razão)", correctAnswer: "desfecho", rationale: "結末 (けつまつ) → desfecho, fim de uma história ou situação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "根拠 (こんきょ) (resultado/base e evidência/causa/conclusão)", correctAnswer: "base e evidência", rationale: "根拠 (こんきょ) → base, fundamento, evidência.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Kanji de causa e efeito — uso em frases
    description: Escolha o kanji correto para completar as frases.
    exercises:
      - { type: japanese_vocab, question: "事故の___を調べる (原因/結果/理由/結論)", correctAnswer: "原因", rationale: "事故の原因を調べる → investigar a causa do acidente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "研究の___が出た (結果/原因/理由/由来)", correctAnswer: "結果", rationale: "研究の結果が出た → os resultados da pesquisa saíram.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "欠席の___を教えてください (理由/結果/原理/結末)", correctAnswer: "理由", rationale: "欠席の理由 → razão da ausência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この言葉の___は何ですか (由来/原因/結果/理論)", correctAnswer: "由来", rationale: "この言葉の由来 → a origem desta palavra.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "実験の___を報告する (結果/原因/理由/結末)", correctAnswer: "結果", rationale: "実験の結果を報告する → reportar os resultados do experimento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___に基づいて判断する (根拠/原因/結果/由来)", correctAnswer: "根拠", rationale: "根拠に基づく → baseado em evidências.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "物理の___を学ぶ (原理/原因/結果/理由)", correctAnswer: "原理", rationale: "物理の原理 → princípios físicos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "話の___が気になる (結末/原因/理由/根拠)", correctAnswer: "結末", rationale: "話の結末 → o desfecho da história.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経済___の関係を分析する (因果/結末/由来/原理)", correctAnswer: "因果", rationale: "経済因果の関係 → relação de causa e efeito na economia.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を導き出す (結論/原因/理由/根拠)", correctAnswer: "結論", rationale: "結論を導き出す → chegar a uma conclusão.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
