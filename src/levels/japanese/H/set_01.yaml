title: 📝 ～にもかかわらず (apesar de / mesmo assim)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～にもかかわらず expressa que algo ocorre apesar de uma circunstância contrária. Tom formal. Equivalente a 'apesar de' ou 'mesmo assim'. Contrasta com のに (mais coloquial)."
example: "Concessão formal. Ex.: 雨にもかかわらず、試合が行われた → Apesar da chuva, o jogo foi realizado."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～にもかかわらず
    description: Escolha o significado correto das frases com ～にもかかわらず.
    exercises:
      - { type: japanese_vocab, question: "雨にもかかわらず、試合が行われた (por causa da chuva/apesar da chuva o jogo foi realizado/a chuva parou antes do jogo/o jogo foi cancelado)", correctAnswer: "apesar da chuva o jogo foi realizado", rationale: "Regra: [circunstância adversa] + にもかかわらず → resultado contrário ao esperado. 雨(chuva) → にもかかわらず → 試合(jogo realizado).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "疲れているにもかかわらず、仕事を続けた (por estar cansado parou/apesar de estar cansado continuou trabalhando/estava descansado/trabalhou pouco)", correctAnswer: "apesar de estar cansado continuou trabalhando", rationale: "疲れている(cansado/progressivo) + にもかかわらず → estado adverso + resultado surpreendente = superação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "努力したにもかかわらず、失敗した (como se esforçou, passou/apesar de ter se esforçado, falhou/não se esforçou/a tentativa foi fácil)", correctAnswer: "apesar de ter se esforçado, falhou", rationale: "努力した(esforçou/passado) + にもかかわらず → esforço não gerou resultado esperado; tom de lamento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "反対意見にもかかわらず、計画が進んだ (por causa da oposição o plano parou/apesar da oposição o plano avançou/todos apoiaram o plano/o plano foi cancelado)", correctAnswer: "apesar da oposição o plano avançou", rationale: "反対意見(oposição/subst.) + にもかかわらず → obstáculo social ignorado; 計画(plano) avançou mesmo assim.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お願いしたにもかかわらず、断られた (como pedi, foi aceito/apesar de ter pedido foi recusado/não pediu/o pedido foi aprovado)", correctAnswer: "apesar de ter pedido foi recusado", rationale: "お願いした(pediu/passado) + にもかかわらず → expectativa de aceite frustrada; 断られた = resultado oposto.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "高いにもかかわらず、よく売れている (por ser barato vende bem/apesar de ser caro vende bem/é barato/não vende muito)", correctAnswer: "apesar de ser caro vende bem", rationale: "高い(caro/adj.) + にもかかわらず → preço alto deveria inibir compra; 売れている = resultado contraditório.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "若いにもかかわらず、経験豊富だ (por ser velho tem experiência/apesar de ser jovem tem muita experiência/é inexperiente/está aprendendo)", correctAnswer: "apesar de ser jovem tem muita experiência", rationale: "若い(jovem) + にもかかわらず → juventude geralmente implica pouca experiência; 経験豊富 = exceção notável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "警告にもかかわらず、続けた (por causa do aviso parou/apesar do aviso continuou/foi avisado e obedeceu/não houve aviso)", correctAnswer: "apesar do aviso continuou", rationale: "警告(aviso/subst.) + にもかかわらず → aviso deveria deter; 続けた = ignorou a advertência.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "困難にもかかわらず、成功した (por causa das dificuldades falhou/apesar das dificuldades teve sucesso/não houve dificuldades/desistiu)", correctAnswer: "apesar das dificuldades teve sucesso", rationale: "困難(dificuldades/subst.) + にもかかわらず → obstáculos superados; 成功した = triunfo inesperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "寒いにもかかわらず、外で遊んだ (por estar quente brincou fora/apesar do frio brincou lá fora/estava dentro de casa/o frio era suave)", correctAnswer: "apesar do frio brincou lá fora", rationale: "寒い(frio/adj.) + にもかかわらず → frio deveria manter dentro de casa; 外で遊んだ = resultado contrário.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～にもかかわらず
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "にもかかわらず é equivalente a: (porque/apesar de/desde que/para que)", correctAnswer: "apesar de", rationale: "にもかかわらず = concessão adversativa formal. [X]にもかかわらず[Y] → X deveria impedir Y, mas Y ocorre.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "病気___かかわらず、出席した (にも/でも/には/から)", correctAnswer: "にも", rationale: "病気(doença/subst.) + にも + かかわらず → subst. + にもかかわらず = apesar de [substantivo].", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual é o tom de にもかかわらず? (coloquial/formal/infantil/interrogativo)", correctAnswer: "formal", rationale: "にもかかわらず → registro escrito formal: notícias, relatórios, discursos. Equivalente coloquial: のに.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual é a versão coloquial de にもかかわらず? (のに/だから/ので/たら)", correctAnswer: "のに", rationale: "のに = versão cotidiana; にもかかわらず = versão formal. Ambos expressam concessão adversativa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "頑張った___かかわらず、結果が出なかった (にも/でも/には/から)", correctAnswer: "にも", rationale: "頑張った(verbo passado) + にも + かかわらず → verbo た形 + にもかかわらず = apesar de ter feito.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にもかかわらず conecta com: (apenas substantivos/substantivos, adjetivos e verbos/apenas verbos/apenas verbos forma た)", correctAnswer: "substantivos, adjetivos e verbos", rationale: "Subst.: 雨にも / Adj.: 高いにも / Verbo進: 疲れているにも → にもかかわらず é versátil.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa にもかかわらず corretamente? (雨だから、行った/雨にもかかわらず、行った/雨なのに、行かなかった/雨だから、行かなかった)", correctAnswer: "雨にもかかわらず、行った", rationale: "雨(circunstância) + にもかかわらず + 行った(resultado contrário ao esperado) = estrutura correta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "失敗した___かかわらず、再挑戦した (にも/でも/には/まで)", correctAnswer: "にも", rationale: "失敗した(falhou/passado) + にも + かかわらず → fracasso passado não impediu nova tentativa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にもかかわらず vem depois de: (causa/circunstância adversa/resultado/propósito)", correctAnswer: "circunstância adversa", rationale: "Estrutura: [circunstância adversa] + にもかかわらず + [resultado surpreendente/contrário].", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明らかな証拠___かかわらず、否定した (にも/でも/には/から)", correctAnswer: "にも", rationale: "明らかな証拠(evidência clara/subst.) + にもかかわらず → evidência deveria convencer; 否定した = resultado oposto.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
