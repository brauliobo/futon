title: 📝 ～たとたん (assim que / no momento em que)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～たとたん(に) indica que algo acontece imediatamente após outra ação, muitas vezes de forma inesperada. Equivalente a 'assim que' ou 'no instante em que'. Tom de surpresa."
example: "Imediatamente após. Ex.: 外に出たとたん、雨が降ってきた → Assim que saí, começou a chover."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～たとたん
    description: Escolha o significado correto das frases com ～たとたん.
    exercises:
      - { type: japanese_vocab, question: "外に出たとたん、雨が降ってきた (antes de sair choveu/assim que saí começou a chover/chovia antes/saiu com guarda-chuva)", correctAnswer: "assim que saí começou a chover", rationale: "たとたん → imediatamente após + evento inesperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ドアを開けたとたん、猫が飛び出した (o gato estava dormindo/assim que abri a porta o gato saltou para fora/o gato foi embora antes/a porta estava aberta)", correctAnswer: "assim que abri a porta o gato saltou para fora", rationale: "たとたん → no instante em que + ação imediata inesperada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "座ったとたん、眠ってしまった (ficou acordado/assim que sentou adormeceu/foi dormir antes/estava de pé ao dormir)", correctAnswer: "assim que sentou adormeceu", rationale: "座った + とたん + 眠ってしまった → adormeceu no instante em que sentou.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べ始めたとたん、電話が鳴った (o telefone tocou antes de comer/assim que começou a comer o telefone tocou/não havia telefone/comeu sem interrupção)", correctAnswer: "assim que começou a comer o telefone tocou", rationale: "食べ始めた + とたん + 電話が鳴った → interrupção inesperada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "着いたとたん、疲れが出た (não ficou cansado/assim que chegou a fadiga apareceu/chegou descansado/a viagem foi curta)", correctAnswer: "assim que chegou a fadiga apareceu", rationale: "着いた + とたん + 疲れが出た → cansaço surgiu imediatamente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "立ち上がったとたん、めまいがした (estava sentado quando tonteou/assim que se levantou teve tontura/não sentiu nada/estava bem)", correctAnswer: "assim que se levantou teve tontura", rationale: "立ち上がった + とたん + めまいがした → tontura imediata.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "名前を呼ばれたとたん、緊張した (ficou calmo/estava nervoso antes/assim que ouviu seu nome ser chamado ficou nervoso/não ficou nervoso)", correctAnswer: "assim que ouviu seu nome ser chamado ficou nervoso", rationale: "名前を呼ばれた + とたん + 緊張した → nervosismo imediato.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "映画が終わったとたん、泣き出した (chorou antes do fim/assim que o filme terminou começou a chorar/não chorou/chorou durante o filme)", correctAnswer: "assim que o filme terminou começou a chorar", rationale: "終わった + とたん + 泣き出した → choro imediato após o fim.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ボタンを押したとたん、爆発した (antes de apertar explodiu/assim que pressionou o botão explodiu/não explodiu/apertou devagar)", correctAnswer: "assim que pressionou o botão explodiu", rationale: "ボタンを押した + とたん + 爆発した → consequência imediata.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "結果を見たとたん、喜んだ (estava triste/assim que viu o resultado ficou feliz/não viu o resultado/o resultado foi ruim)", correctAnswer: "assim que viu o resultado ficou feliz", rationale: "結果を見た + とたん + 喜んだ → alegria imediata.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～たとたん
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "たとたん indica: (ação habitual/evento imediato e inesperado após outra ação/condição/decisão)", correctAnswer: "evento imediato e inesperado após outra ação", rationale: "たとたん → imediatamente após — muitas vezes surpreendente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "部屋に入っ___とたん、電気が消えた (た/て/る/ない)", correctAnswer: "た", rationale: "入った + とたん → assim que entrou.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual é a forma verbal antes de とたん? (forma る/forma た/forma て/forma ない)", correctAnswer: "forma た", rationale: "とたん sempre conecta com a forma た (passado) do verbo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "横になっ___とたん、眠った (た/て/る/ない)", correctAnswer: "た", rationale: "横になった + とたん → assim que se deitou.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre たとたん e たら? (mesma coisa/たとたん enfatiza imediatismo e surpresa; たら é mais neutro/たら é mais dramático; たとたん é neutro/nenhuma diferença)", correctAnswer: "たとたん enfatiza imediatismo e surpresa; たら é mais neutro", rationale: "たとたん → tom de surpresa/imediatismo; たら → condicional neutro.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ドアが開い___とたん、驚いた (た/て/る/ない)", correctAnswer: "た", rationale: "開いた + とたん → assim que a porta abriu.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "とたん(に)の 'に' é: (obrigatório/opcional/proibido/formal)", correctAnswer: "opcional", rationale: "とたん e とたんに são ambos corretos, com に sendo opcional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試合が始まっ___とたん、点が入った (た/て/る/ない)", correctAnswer: "た", rationale: "始まった + とたん → assim que o jogo começou, marcaram ponto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa たとたん corretamente? (食べるとたん眠い/着いたとたん雨が降った/行くとたん来た/静かなとたん)", correctAnswer: "着いたとたん雨が降った", rationale: "Forma た + とたん + evento imediato → estrutura correta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "傘をさし___とたん、雨が止んだ (た/て/る/ない)", correctAnswer: "た", rationale: "さした + とたん → assim que abriu o guarda-chuva, a chuva parou (irônico).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
