title: 📝 ～に当たって (ao fazer / na ocasião de)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～に当たって indica o momento de fazer algo importante, quando se toma providências. Ligeiramente menos formal que に際して. Equivalente a 'ao' ou 'quando' em contextos formais."
example: "Preparação para evento. Ex.: 新年を迎えるに当たって、目標を立てた → Ao receber o Ano Novo, estabeleci metas."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～に当たって
    description: Escolha o significado correto das frases com ～に当たって.
    exercises:
      - { type: japanese_vocab, question: "新年を迎えるに当たって、目標を立てた (depois do Ano Novo/ao receber o Ano Novo estabeleceu metas/sem metas/não há Ano Novo)", correctAnswer: "ao receber o Ano Novo estabeleceu metas", rationale: "に当たって = ao / por ocasião de — preparação para evento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "プロジェクトを開始するに当たって、会議を開いた (depois de iniciar/sem reunião/ao iniciar o projeto realizou uma reunião/o projeto foi cancelado)", correctAnswer: "ao iniciar o projeto realizou uma reunião", rationale: "に当たって = ao fazer algo, toma-se providências.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本に留学するに当たって、準備をした (depois de estudar/sem preparação/ao partir para estudar no Japão se preparou/a preparação foi desnecessária)", correctAnswer: "ao partir para estudar no Japão se preparou", rationale: "に当たって = ao fazer + preparação prévia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "建設に当たって、住民説明会を開いた (sem explicação/depois de construir/ao construir realizou reunião com os moradores/os moradores foram ignorados)", correctAnswer: "ao construir realizou reunião com os moradores", rationale: "建設に当たって = ao construir, tomou-se providências.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "就職するに当たって、スキルを身につけた (depois de conseguir emprego/sem preparação/ao se candidatar a emprego adquiriu habilidades/o emprego não exige habilidades)", correctAnswer: "ao se candidatar a emprego adquiriu habilidades", rationale: "に当たって = ao / na preparação para.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試験を受けるに当たって、注意事項を確認した (depois da prova/sem confirmar/ao fazer a prova conferiu as instruções/as instruções não existem)", correctAnswer: "ao fazer a prova conferiu as instruções", rationale: "に当たって = ao fazer algo, verificou previamente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しい職場に入るに当たって、挨拶をした (saiu sem se despedir/depois de entrar/ao entrar no novo local de trabalho se apresentou/ninguém se apresentou)", correctAnswer: "ao entrar no novo local de trabalho se apresentou", rationale: "に当たって = ao / no momento de entrar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "渡航するに当たって、ビザを取得した (depois de viajar/sem visto/ao viajar obteve o visto/visto não é necessário)", correctAnswer: "ao viajar obteve o visto", rationale: "に当たって = ao viajar, tomou providências (visto).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "研究を行うに当たって、倫理審査を受けた (depois de pesquisar/sem revisão/ao realizar a pesquisa passou pela revisão ética/a ética não é necessária)", correctAnswer: "ao realizar a pesquisa passou pela revisão ética", rationale: "に当たって = ao conduzir, tomou-se providências formais.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "投票するに当たって、候補者を調べた (sem pesquisa/depois de votar/ao votar pesquisou os candidatos/votou aleatoriamente)", correctAnswer: "ao votar pesquisou os candidatos", rationale: "に当たって = ao fazer algo, tomou providências de preparação.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～に当たって
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "に当たって indica: (resultado depois/ação durante/preparação ao fazer algo importante/causa)", correctAnswer: "preparação ao fazer algo importante", rationale: "に当たって = ao / na hora de — implica preparação ou atenção.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たって conecta com: (apenas substantivos/apenas verbos/substantivos e verbos na forma る/adjetivos)", correctAnswer: "substantivos e verbos na forma る", rationale: "に当たって: 卒業に当たって (subst.) / 始めるに当たって (verbo る).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "開会___当たって、挨拶をした (に/が/を/で)", correctAnswer: "に", rationale: "開会に当たって = ao inaugurar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "就任する___当たって、抱負を語った (に/が/を/で)", correctAnswer: "に", rationale: "就任するに当たって = ao assumir o cargo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa に当たって corretamente? (食べるに当たって/留学するに当たって準備した/高いに当たって/静かに当たって)", correctAnswer: "留学するに当たって準備した", rationale: "留学する (verbo る) + に当たって = ao partir para estudar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "引退___当たって、記者会見を開いた (に/が/を/で)", correctAnswer: "に", rationale: "引退に当たって = por ocasião da aposentadoria.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たって vs に際して: (に当たって ligeiramente mais formal/に際して ligeiramente mais formal/exatamente iguais/に際して é coloquial)", correctAnswer: "に際して ligeiramente mais formal", rationale: "に際して tem tom mais solene e cerimonioso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "プロジェクトを始める___当たって (に/が/を/で)", correctAnswer: "に", rationale: "プロジェクトを始めるに当たって = ao iniciar o projeto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新学期を迎える___当たって (に/が/を/で)", correctAnswer: "に", rationale: "新学期を迎えるに当たって = ao receber o novo semestre.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に当たって é adequado para: (conversas informais/momentos importantes e formais/ações cotidianas/sentimentos)", correctAnswer: "momentos importantes e formais", rationale: "に当たって = para ocasiões com peso formal ou simbólico.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
