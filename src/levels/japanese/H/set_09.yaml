title: 📝 ～によって (dependendo de / mediante / por)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～によって tem múltiplos usos: 1) agente da voz passiva, 2) causa/meio, 3) variação conforme. É uma das partículas mais polivalentes do japonês N3."
example: "Múltiplos usos. Ex.: 人によって考えが違う → As ideias variam conforme a pessoa."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～によって
    description: Escolha o significado correto das frases com ～によって.
    exercises:
      - { type: japanese_vocab, question: "人によって考えが違う (todo mundo pensa igual/as ideias variam conforme a pessoa/as pessoas não têm opiniões/o pensamento é único)", correctAnswer: "as ideias variam conforme a pessoa", rationale: "によって = dependendo de / varia conforme.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この橋はシーザーによって建てられた (esta ponte vai ser construída/esta ponte foi construída por César/César destruiu a ponte/a ponte é moderna)", correctAnswer: "esta ponte foi construída por César", rationale: "によって = agente da voz passiva (por quem foi feito).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "努力によって、夢を実現した (sem esforço realizou o sonho/realizou o sonho mediante esforço/o sonho foi impossível/o esforço não ajudou)", correctAnswer: "realizou o sonho mediante esforço", rationale: "努力によって = por meio do esforço / graças ao esforço.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "地域によって、文化が異なる (a cultura é igual em todo lugar/a cultura varia conforme a região/não há cultura regional/a região não importa)", correctAnswer: "a cultura varia conforme a região", rationale: "地域 + によって + 異なる = variação regional.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "技術によって、生活が変わった (sem tecnologia a vida mudou/a vida mudou graças à tecnologia/a tecnologia não afeta a vida/a vida não mudou)", correctAnswer: "a vida mudou graças à tecnologia", rationale: "技術 + によって = por meio da / graças à tecnologia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "季節によって、服装が変わる (usamos a mesma roupa sempre/a roupa muda conforme a estação/a estação não importa/não há diferença)", correctAnswer: "a roupa muda conforme a estação", rationale: "季節 + によって + 変わる = variação sazonal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "交渉によって、合意に達した (sem negociação chegaram ao acordo/chegaram a um acordo por meio de negociação/a negociação falhou/não houve acordo)", correctAnswer: "chegaram a um acordo por meio de negociação", rationale: "交渉 + によって + 合意に達した = meio/instrumento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この作品はモーツァルトによって作られた (vai ser composta/foi composta por Mozart/Mozart destruiu/é obra moderna)", correctAnswer: "foi composta por Mozart", rationale: "によって = agente da voz passiva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "解釈によって、意味が変わる (o significado é sempre o mesmo/o significado muda conforme a interpretação/a interpretação não importa/o sentido é fixo)", correctAnswer: "o significado muda conforme a interpretação", rationale: "解釈 + によって + 変わる = variação por interpretação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この発見によって、医学が進んだ (a medicina recuou/a medicina avançou graças a esta descoberta/a descoberta foi inútil/não houve avanço)", correctAnswer: "a medicina avançou graças a esta descoberta", rationale: "この発見 + によって + 進んだ = causa/meio do progresso.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～によって
    description: Identifique o uso correto de によって.
    exercises:
      - { type: japanese_vocab, question: "Quantos usos principais tem によって? (1/2/3/4)", correctAnswer: "3", rationale: "によって: 1) agente passivo, 2) causa/meio, 3) variação conforme.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この法律は国会___決められた (によって/によると/による/にとって)", correctAnswer: "によって", rationale: "国会によって = pelo parlamento (agente passivo).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "場合___対応が異なる (によって/によると/による/にとって)", correctAnswer: "によって", rationale: "場合によって = conforme o caso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "通信技術___世界が繋がった (によって/によると/による/にとって)", correctAnswer: "によって", rationale: "通信技術によって = graças à tecnologia de comunicação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Em 'シェイクスピアによって書かれた', によって indica: (variação/agente da voz passiva/causa de variação/meio de transporte)", correctAnswer: "agente da voz passiva", rationale: "シェイクスピアによって = por Shakespeare — agente da voz passiva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国___によって習慣が違う (に/が/を/の)", correctAnswer: "に", rationale: "国によって = conforme o país.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre によって e によると? (mesma coisa/によって = causa/meio/variação; によると = segundo (fonte de informação)/によると = causa; によって = fonte/nenhuma)", correctAnswer: "によって = causa/meio/variação; によると = segundo (fonte de informação)", rationale: "によると = 'segundo X', indica fonte de informação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "医療の進歩___、寿命が延びた (によって/にとって/による/によると)", correctAnswer: "によって", rationale: "医療の進歩によって = graças ao avanço médico.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "によって pode indicar: (apenas variação/apenas agente passivo/variação, agente e meio/apenas meio)", correctAnswer: "variação, agente e meio", rationale: "によって é polivalente: variação, agente passivo, meio/causa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "人___考え方が違う (によって/によると/にとって/による)", correctAnswer: "によって", rationale: "人によって = conforme a pessoa.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
