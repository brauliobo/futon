title: 📝 ～に関して (quanto a / em relação a)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～に関して indica o tópico sobre o qual se discute ou age. Equivalente a 'quanto a' ou 'em relação a'. Formal. Similar a について mas mais objetivo e acadêmico."
example: "Especificação do tópico. Ex.: この件に関して、詳しく説明します → Quanto a este assunto, explicarei em detalhes."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Reconhecer ～に関して
    description: Escolha o significado correto das frases com ～に関して.
    exercises:
      - { type: japanese_vocab, question: "この件に関して、詳しく説明します (não há explicação/sobre outro assunto/quanto a este assunto explicarei em detalhes/não sei sobre este assunto)", correctAnswer: "quanto a este assunto explicarei em detalhes", rationale: "Regra: 名詞 + に関して → delimita o tópico formalmente. この件(este assunto) → に関して → 詳しく説明します.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "環境問題に関して、意見を述べた (evitou o tema/opinião sobre outro tema/expressou opinião quanto às questões ambientais/não tem opinião)", correctAnswer: "expressou opinião quanto às questões ambientais", rationale: "環境問題(questões ambientais) + に関して → tópico delimitado + 意見を述べた(expressou opinião).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この契約に関する書類を見せてください (os documentos foram destruídos/documentos de outro contrato/por favor mostre os documentos relativos a este contrato/não há documentos)", correctAnswer: "por favor mostre os documentos relativos a este contrato", rationale: "Regra: に関する(forma adjetival) + 名詞 → modifica substantivo. この契約 + に関する + 書類 = documentos sobre o contrato.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "教育政策に関して、研究を行った (pesquisa sobre outro tema/realizou pesquisa sobre política educacional/não há pesquisa/a pesquisa foi cancelada)", correctAnswer: "realizou pesquisa sobre política educacional", rationale: "教育政策(política educacional) + に関して → tópico de pesquisa formal. 研究を行った = realizou pesquisa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この事故に関して、調査が始まった (investigação de outro caso/a investigação do acidente começou/não há investigação/o acidente não ocorreu)", correctAnswer: "a investigação do acidente começou", rationale: "この事故(este acidente) + に関して → tópico da investigação. 調査(investigação) + が始まった = iniciou.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康に関する情報を集めた (coletou informações sobre outro tema/coletou informações sobre saúde/não coletou nada/as informações foram perdidas)", correctAnswer: "coletou informações sobre saúde", rationale: "健康(saúde) + に関する(adj.) + 情報(informações) → に関する modifica o substantivo seguinte.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題に関しては、後で話しましょう (vamos falar sobre outro problema/vamos falar sobre este problema mais tarde/não vamos discutir/o problema já foi resolvido)", correctAnswer: "vamos falar sobre este problema mais tarde", rationale: "この問題 + に関して + は(ênfase/contraste) → は adiciona foco no tópico. 後で話しましょう = adiado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "科学技術に関する最新の研究 (pesquisa antiga sobre outro tema/a mais recente pesquisa sobre ciência e tecnologia/pesquisa histórica/pesquisa sem tema)", correctAnswer: "a mais recente pesquisa sobre ciência e tecnologia", rationale: "科学技術(ciência e tecnologia) + に関する + 最新の研究(pesquisa mais recente) → に関する como adjetivo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "プライバシーに関して、規則を設けた (criou regras para outro tema/criou regras quanto à privacidade/não há regras/as regras foram abolidas)", correctAnswer: "criou regras quanto à privacidade", rationale: "プライバシー(privacidade) + に関して → tópico formal. 規則を設けた(estabeleceu regras).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その発言に関して、謝罪した (pediu desculpas por outro motivo/pediu desculpas quanto ao comentário feito/não se desculpou/não houve comentário)", correctAnswer: "pediu desculpas quanto ao comentário feito", rationale: "その発言(aquele comentário) + に関して → tópico do pedido de desculpa. 謝罪した = pediu desculpa.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～に関して
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "に関して significa: (apesar de/em relação a/por causa de/além de)", correctAnswer: "em relação a", rationale: "Regra: 名詞 + に関して → delimita o tópico. Diferente de から(causa) e にもかかわらず(concessão).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre に関して e について? (mesma coisa/に関して é mais formal e objetivo; について é mais neutro e versátil/に関して é coloquial; について é formal/sem diferença)", correctAnswer: "に関して é mais formal e objetivo; について é mais neutro e versátil", rationale: "に関して → relatórios/discursos formais; について → conversas e textos neutros. Tom diferente, mesmo núcleo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この報告___関して、質問がある (に/が/を/で)", correctAnswer: "に", rationale: "報告(relatório) + に + 関して → に é a partícula fixa de に関して; が/を/で não funcionam aqui.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に関する (forma adjetival) modifica: (verbos/substantivos/adjetivos/advérbios)", correctAnswer: "substantivos", rationale: "に関する + 名詞: 環境に関する問題(problema sobre o ambiente). に関して modifica verbos/frases.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経済___関する分析 (に/が/を/で)", correctAnswer: "に", rationale: "経済(economia) + に + 関する + 分析(análise) → に関する forma adjetival antes de substantivo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa に関して corretamente? (行くに関して/環境に関して話す/静かなに関して/難しいに関して)", correctAnswer: "環境に関して話す", rationale: "環境(subst.) + に関して + 話す → correto. に関して só conecta com substantivos, não com verbos/adjetivos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その件___関してはお答えできません (に/が/を/で)", correctAnswer: "に", rationale: "その件(este assunto) + に + 関して + は → は adiciona contraste/ênfase ao tópico delimitado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に関して conecta com: (apenas verbos/apenas substantivos/adjetivos e verbos/orações na forma て)", correctAnswer: "apenas substantivos", rationale: "名詞 + に関して → estrutura fixa. Verbos e adjetivos não precedem に関して diretamente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "医療___関する最新情報 (に/が/を/で)", correctAnswer: "に", rationale: "医療(medicina) + に + 関する + 最新情報(informações recentes) → forma adjetival modifica o substantivo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に関して é típico de: (conversas familiares/textos formais e discussões acadêmicas/cartas afetivas/instruções simples)", correctAnswer: "textos formais e discussões acadêmicas", rationale: "に関して → registro formal/acadêmico/oficial. Em conversas usa-se について no lugar.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
