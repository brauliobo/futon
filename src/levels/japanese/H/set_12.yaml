title: 📝 ～かねる (não consegue fazer / reluta em)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～かねる indica dificuldade ou relutância em fazer algo — muitas vezes por razões éticas ou práticas. Tom formal de recusa educada. Equivalente a 'não me é possível' ou 'não consigo'."
example: "Recusa educada. Ex.: お答えしかねます → Não me é possível responder (recusa educada)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～かねる
    description: Escolha o significado correto das frases com ～かねる.
    exercises:
      - { type: japanese_vocab, question: "お答えしかねます (responderei em breve/não me é possível responder/já respondi/a resposta está pronta)", correctAnswer: "não me é possível responder", rationale: "かねます = não consigo / não me é possível — recusa educada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その要求には応じかねます (aceitarei o pedido/já atendi o pedido/não me é possível atender ao pedido/o pedido será analisado)", correctAnswer: "não me é possível atender ao pedido", rationale: "応じかねます = não consigo atender — recusa formal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この内容には同意しかねます (concordo completamente/já concordei/não consigo concordar com este conteúdo/a concordância é automática)", correctAnswer: "não consigo concordar com este conteúdo", rationale: "同意しかねます = não me é possível concordar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "個人情報は公開しかねます (publicarei os dados pessoais/os dados foram publicados/não posso publicar dados pessoais/os dados são públicos)", correctAnswer: "não posso publicar dados pessoais", rationale: "公開しかねます = não me é possível divulgar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その申し出はお断りしかねます (aceito a oferta/a oferta será aceita/não me é possível recusar a oferta/recusei a oferta)", correctAnswer: "não me é possível recusar a oferta", rationale: "断りしかねます = não consigo recusar — ou seja, sou obrigado a aceitar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題は解決しかねる (já foi resolvido/o problema se resolve sozinho/não consigo resolver este problema/o problema é simples)", correctAnswer: "não consigo resolver este problema", rationale: "解決しかねる = não é possível resolver — dificuldade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "今すぐにはお伝えしかねます (direi agora/não me é possível informar agora/já informei/a informação foi enviada)", correctAnswer: "não me é possível informar agora", rationale: "お伝えしかねます = não posso comunicar no momento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "そのような行為は見過ごしかねる (posso ignorar/ignorarei/não consigo ignorar tal ação/já ignorei)", correctAnswer: "não consigo ignorar tal ação", rationale: "見過ごしかねる = não me é possível passar por cima disso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご要望には対応しかねます (atenderei o pedido/o pedido já foi atendido/não me é possível atender ao pedido/o pedido será analisado)", correctAnswer: "não me é possível atender ao pedido", rationale: "対応しかねます = não posso satisfazer o pedido (recusa formal).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "責任はとりかねます (assumirei a responsabilidade/a responsabilidade já foi assumida/não posso assumir a responsabilidade/a responsabilidade foi transferida)", correctAnswer: "não posso assumir a responsabilidade", rationale: "とりかねます = não me é possível assumir.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～かねる
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "かねる é tipicamente usado para: (aceitação entusiasta/recusa educada e formal/ordem direta/pedido informal)", correctAnswer: "recusa educada e formal", rationale: "かねる = não consigo — forma educada de recusar ou expressar impossibilidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "かねる conecta com: (forma て/forma ます (stem)/forma た/forma ない)", correctAnswer: "forma ます (stem)", rationale: "動詞stem + かねる: 答えかねる, 応じかねる.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その件にはお答え___ (しかねます/しかねました/されかねます/させかねます)", correctAnswer: "しかねます", rationale: "答えしかねます = não me é possível responder sobre este assunto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre できません e しかねます? (mesma coisa/しかねます é mais educado e indica relutância moral ou prática/できません é mais educado/しかねます é mais direto)", correctAnswer: "しかねます é mais educado e indica relutância moral ou prática", rationale: "しかねます = não consigo (por razão ética ou prática) — mais formal que できません.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご要望にはお応え___ます (しかね/できかね/されかね/させかね)", correctAnswer: "しかね", rationale: "お応えしかねます = não me é possível atender ao pedido.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "詳細はお知らせ___ (しかねます/できかねます/されかねます/してかねます)", correctAnswer: "しかねます", rationale: "お知らせしかねます = não posso informar os detalhes.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "かねる indica: (capacidade física/dificuldade ou relutância moral e prática/hábito/desejo)", correctAnswer: "dificuldade ou relutância moral e prática", rationale: "かねる = não é fisicamente ou eticamente possível para o falante.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この価格には同意___ (しかねます/できかねます/されかねます/なりかねます)", correctAnswer: "しかねます", rationale: "同意しかねます = não posso concordar com este preço.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa かねる corretamente? (行くかねる/食べかねる/答えしかねる/静かかねる)", correctAnswer: "答えしかねる", rationale: "答えしかねる = não consigo responder — stem + しかねる.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "そのような要求には応じ___ (かねます/られます/になります/にします)", correctAnswer: "かねます", rationale: "応じかねます = não me é possível atender a tal pedido.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
