title: 📝 ～かねる (não consegue fazer / reluta em)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～かねる indica dificuldade ou relutância em fazer algo — muitas vezes por razões éticas ou práticas. Tom formal de recusa educada. Equivalente a 'não me é possível' ou 'não consigo'."
example: "Recusa educada. Ex.: お答えしかねます → Não me é possível responder (recusa educada)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Reconhecer ～かねる
    description: Escolha o significado correto das frases com ～かねる.
    exercises:
      - { type: japanese_vocab, question: "お答えしかねます (responderei em breve/não me é possível responder/já respondi/a resposta está pronta)", correctAnswer: "não me é possível responder", rationale: "Regra: 動詞stem + かねます = não consigo (recusa educada). 答え(stem de 答える)+かねます. お〜かねます = forma honorífica. かねる vem de 兼ねる → não consigo conciliar com minhas restrições.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その要求には応じかねます (aceitarei o pedido/já atendi o pedido/não me é possível atender ao pedido/o pedido será analisado)", correctAnswer: "não me é possível atender ao pedido", rationale: "Regra: 動詞stem + かねます. 応じ(stem de 応じる→atender)+かねます. Formula: [動詞stem]+かねます → recusa formal. Mais educado que できません; implica relutância ética/prática.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この内容には同意しかねます (concordo completamente/já concordei/não consigo concordar com este conteúdo/a concordância é automática)", correctAnswer: "não consigo concordar com este conteúdo", rationale: "Regra: サ変動詞 → し+かねます. 同意する → 同意し+かねます. Padrão: [する動詞]→[し]+かねます. 同意 = concordância; に = marca o objeto da atitude.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "個人情報は公開しかねます (publicarei os dados pessoais/os dados foram publicados/não posso publicar dados pessoais/os dados são públicos)", correctAnswer: "não posso publicar dados pessoais", rationale: "Regra: サ変動詞 → し+かねます. 公開する → 公開し+かねます. Motivo ético implícito: 個人情報(dados pessoais) requer proteção → かねる indica relutância moral.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その申し出はお断りしかねます (aceito a oferta/a oferta será aceita/não me é possível recusar a oferta/recusei a oferta)", correctAnswer: "não me é possível recusar a oferta", rationale: "Regra: お + 動詞stem + かねます. お断りしかねます → não consigo recusar → sou obrigado a aceitar. 断る → recusar; 断りかねる → não consegue recusar (sentido oposto ao esperado!).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題は解決しかねる (já foi resolvido/o problema se resolve sozinho/não consigo resolver este problema/o problema é simples)", correctAnswer: "não consigo resolver este problema", rationale: "Regra: サ変動詞 → し+かねる (辞書形/informal). 解決する → 解決し+かねる. かねます(formal) vs かねる(informal/辞書形) — mesmo sentido, registro diferente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "今すぐにはお伝えしかねます (direi agora/não me é possível informar agora/já informei/a informação foi enviada)", correctAnswer: "não me é possível informar agora", rationale: "Regra: お + 動詞stem + かねます. お伝えし+かねます. 今すぐには → agora mesmo (には reforça limitação temporal). Implica possibilidade futura (contraste com できません permanente).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "そのような行為は見過ごしかねる (posso ignorar/ignorarei/não consigo ignorar tal ação/já ignorei)", correctAnswer: "não consigo ignorar tal ação", rationale: "Regra: 動詞stem + かねる. 見過ごし(stem de 見過ごす→ignorar)+かねる. かねる aqui → impossibilidade moral. 見過ごす → deixar passar; 見過ごしかねる → não tenho como deixar passar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご要望には対応しかねます (atenderei o pedido/o pedido já foi atendido/não me é possível atender ao pedido/o pedido será analisado)", correctAnswer: "não me é possível atender ao pedido", rationale: "Regra: サ変動詞 → し+かねます. 対応する → 対応し+かねます. ご要望(pedido respeitoso/polido) + には = em relação a. Cf.: 応じかねます ≈ 対応しかねます (ambos = recusa a pedido).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "責任はとりかねます (assumirei a responsabilidade/a responsabilidade já foi assumida/não posso assumir a responsabilidade/a responsabilidade foi transferida)", correctAnswer: "não posso assumir a responsabilidade", rationale: "Regra: 動詞stem + かねます. とり(stem de とる)+かねます. 責任をとる → expressão fixa (assumir responsabilidade). 責任をとりかねます → não posso assumir.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～かねる
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "かねる é tipicamente usado para: (aceitação entusiasta/recusa educada e formal/ordem direta/pedido informal)", correctAnswer: "recusa educada e formal", rationale: "かねる → não consigo — recusa polida por razão ética/prática. Comparação: できません(não posso→neutro) < かねます(relutância/impossibilidade moral→formal) < お断りします(recusa direta→mais forte).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "かねる conecta com: (forma て/forma ます (stem)/forma た/forma ない)", correctAnswer: "forma ます (stem)", rationale: "Regra: 動詞ます形(stem) + かねる. 答え+かねる, 応じ+かねる, 対応し+かねる. Armadilha: stem ≠ て形 (答えてかねる ✗). Stem → forma antes de ます.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その件にはお答え___ (しかねます/しかねました/されかねます/させかねます)", correctAnswer: "しかねます", rationale: "Regra: お + 動詞stem + かねます. お答えし+かねます → não me é possível responder. Armadilha: しかねました → passado (não adequado para recusa formal presente); されかねます → pode causar (diferente!).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre できません e しかねます? (mesma coisa/しかねます é mais educado e indica relutância moral ou prática/できません é mais educado/しかねます é mais direto)", correctAnswer: "しかねます é mais educado e indica relutância moral ou prática", rationale: "できません → impossibilidade de capacidade (neutro). しかねます → impossibilidade por razão ética/prática (mais formal e polido). Escala: できません < かねます < お断りします.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ご要望にはお応え___ます (しかね/できかね/されかね/させかね)", correctAnswer: "しかね", rationale: "Regra: お + 動詞stem + かね + ます. お応えし+かね+ます. O stem de 応える → 応え; com お → お応え; + し+かね+ます. Armadilha: できかね → impossibilidade de capacidade (registro diferente).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "詳細はお知らせ___ (しかねます/できかねます/されかねます/してかねます)", correctAnswer: "しかねます", rationale: "Regra: お + 動詞stem + かねます. お知らせし+かねます. 知らせ → stem de 知らせる(informar); して → て形 ✗ (してかねます não existe neste padrão).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "かねる indica: (capacidade física/dificuldade ou relutância moral e prática/hábito/desejo)", correctAnswer: "dificuldade ou relutância moral e prática", rationale: "かねる → não consigo por razão ética ou prática (não capacidade física). Ex.: 個人情報は公開しかねます (ética); 今すぐにはお答えしかねます (prática). ≠ 体が弱くてできません (capacidade física).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この価格には同意___ (しかねます/できかねます/されかねます/なりかねます)", correctAnswer: "しかねます", rationale: "Regra: サ変動詞 → し+かねます. 同意する → 同意し+かねます. Armadilha: なりかねます = pode acabar tornando-se (かねない=risco, sentido oposto!).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa かねる corretamente? (行くかねる/食べかねる/答えしかねる/静かかねる)", correctAnswer: "答えしかねる", rationale: "Regra: 動詞stem + かねる. 答え(stem de 答える)+かねる ✓. Armadilha: 行く → 辞書形 ✗ (precisaria 行きかねる); 食べ → stem correto mas 食べかねる existe (pode comer/reluta em comer).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "そのような要求には応じ___ (かねます/られます/になります/にします)", correctAnswer: "かねます", rationale: "Regra: 動詞stem + かねます. 応じ(stem de 応じる)+かねます → não posso atender. Armadilha: 応じられます → consigo atender (られ→potencial); 応じになります → forma honorífica de atender.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
