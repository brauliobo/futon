title: 📝 ～を通じて / ～を通して (através de / por meio de)
level: 'H'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～を通じて e ～を通して têm usos similares: 1) por meio de (canal/intermediário), 2) ao longo de (período). を通じて é mais formal; を通して é mais comum."
example: "Por meio de / ao longo de. Ex.: 経験を通して成長した → Cresceu por meio das experiências."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 24
pages:
  - pageNumber: 1
    title: Reconhecer ～を通じて / ～を通して
    description: Escolha o significado correto das frases com ～を通じて / ～を通して.
    exercises:
      - { type: japanese_vocab, question: "経験を通して成長した (sem experiência cresceu/cresceu por meio das experiências/não cresceu/as experiências foram negativas)", correctAnswer: "cresceu por meio das experiências", rationale: "を通して → por meio de / através das experiências.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "SNSを通じて、情報を発信した (sem internet/divulgou informações por meio das redes sociais/as redes são privadas/a informação não foi enviada)", correctAnswer: "divulgou informações por meio das redes sociais", rationale: "を通じて → por meio de (canal).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友人を通して、仕事を紹介してもらった (conseguiu emprego sozinho/conseguiu emprego por meio de um amigo/o amigo recusou/não conseguiu emprego)", correctAnswer: "conseguiu emprego por meio de um amigo", rationale: "を通して → por meio de / com a intermediação de.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "一年を通じて、温暖な気候が続く (só no verão é quente/ao longo do ano, o clima é quente/o inverno é frio/o clima varia muito)", correctAnswer: "ao longo do ano, o clima é quente", rationale: "を通じて → ao longo de (período inteiro).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外交を通じて、問題を解決した (com força/por meio da diplomacia o problema foi resolvido/sem diplomacia/o problema permanece)", correctAnswer: "por meio da diplomacia o problema foi resolvido", rationale: "外交を通じて → por meio da diplomacia (canal formal).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "教育を通して、社会を変えたい (sem educação/quer mudar a sociedade por meio da educação/a educação não muda nada/já mudou a sociedade)", correctAnswer: "quer mudar a sociedade por meio da educação", rationale: "を通して → por meio de (instrumento/canal).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "年間を通じて、活動が続く (só por um mês/ao longo do ano as atividades continuam/as atividades foram canceladas/só no inverno)", correctAnswer: "ao longo do ano as atividades continuam", rationale: "年間を通じて → ao longo do ano inteiro.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "通訳を通じて、会話した (falou diretamente/sem comunicação/conversaram por meio de um intérprete/o intérprete não veio)", correctAnswer: "conversaram por meio de um intérprete", rationale: "通訳を通じて → por meio de um intérprete (intermediário).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "スポーツを通して、友達ができた (sem esporte/fez amigos por meio do esporte/o esporte não une pessoas/ninguém fez amigos)", correctAnswer: "fez amigos por meio do esporte", rationale: "を通して → por meio de (esporte como canal de socialização).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "生涯を通じて、学び続けた (só estudou na juventude/estudou toda a vida/parou de estudar/o aprendizado é inútil)", correctAnswer: "estudou toda a vida", rationale: "生涯を通じて → ao longo de toda a vida.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～を通じて / ～を通して
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "を通じて/を通して tem quantos usos principais? (1/2/3/4)", correctAnswer: "2", rationale: "1) por meio de (canal/intermediário), 2) ao longo de (período).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual é mais formal: を通じて ou を通して? (を通して/を通じて/ambos iguais/depende do contexto)", correctAnswer: "を通じて", rationale: "を通じて é mais formal; を通して é mais comum no dia a dia.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "インターネット___通じて世界と繋がる (を/が/に/で)", correctAnswer: "を", rationale: "インターネットを通じて → por meio da internet.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "冬___通じて、雪が降り続く (を/が/に/で)", correctAnswer: "を", rationale: "冬を通じて → ao longo do inverno.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa を通して corretamente? (行くを通して/音楽を通して人と繋がる/難しいを通して/静かなを通して)", correctAnswer: "音楽を通して人と繋がる", rationale: "音楽を通して → por meio da música + 繋がる → se conectar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "仲介者___通して交渉した (を/が/に/で)", correctAnswer: "を", rationale: "仲介者を通して → por meio de um intermediário.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "を通じて com período indica: (canal/ao longo de todo o período/instrumento/agente)", correctAnswer: "ao longo de todo o período", rationale: "期間+を通じて → ao longo de [todo o período].", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "旅行___通して視野が広がった (を/が/に/で)", correctAnswer: "を", rationale: "旅行を通して → por meio das viagens, a visão de mundo se ampliou.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "四季___通じて自然を楽しむ (を/が/に/で)", correctAnswer: "を", rationale: "四季を通じて → ao longo das quatro estações.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "代理人___通して契約した (を/が/に/で)", correctAnswer: "を", rationale: "代理人を通して → por meio de um representante.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
