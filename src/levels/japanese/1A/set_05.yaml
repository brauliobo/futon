title: ✍️ Kanji — 一 二 三 四 五 六 七 八 九 十
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Kanji dos números 1 a 10. Base para contar e ler números em japonês."
example: "Os kanji numéricos são essenciais. Ex.: 一 → ichi (1), 十 → juu (10). Aparecem em datas e endereços."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Números kanji — reconhecimento
    description: Leia o kanji numérico e escolha o valor correto.
    exercises:
      - { type: japanese_vocab, question: "一 (dois/três/um/quatro)", correctAnswer: "um", rationale: "一 = いち = 1. Um traço horizontal. O kanji mais simples.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "二 (três/dois/quatro/um)", correctAnswer: "dois", rationale: "二 = に = 2. Dois traços horizontais.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "三 (quatro/dois/três/cinco)", correctAnswer: "três", rationale: "三 = さん = 3. Três traços horizontais.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "四 (cinco/três/seis/quatro)", correctAnswer: "quatro", rationale: "四 = し / よん = 4. Leitura よん é mais comum em contagem.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "五 (quatro/seis/cinco/sete)", correctAnswer: "cinco", rationale: "五 = ご = 5.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "六 (cinco/sete/oito/seis)", correctAnswer: "seis", rationale: "六 = ろく = 6.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "七 (seis/oito/sete/nove)", correctAnswer: "sete", rationale: "七 = しち / なな = 7. なな é mais comum em contagem.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "八 (sete/nove/dez/oito)", correctAnswer: "oito", rationale: "八 = はち = 8. Kanji com forma de ângulo aberto (fortuna no Japão).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "九 (oito/dez/nove/sete)", correctAnswer: "nove", rationale: "九 = く / きゅう = 9.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "十 (oito/nove/onze/dez)", correctAnswer: "dez", rationale: "十 = じゅう = 10. Forma de cruz (+).", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Números kanji em contexto
    description: Leia e escolha o número ou expressão correta.
    exercises:
      - { type: japanese_vocab, question: "三月 (janeiro/fevereiro/março/abril)", correctAnswer: "março", rationale: "三月 = さんがつ = mês 3 = março. 三 = 3 + 月 = mês.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "七月 (junho/julho/agosto/setembro)", correctAnswer: "julho", rationale: "七月 = しちがつ = mês 7 = julho. 七 = 7 + 月 = mês.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "十二月 (outubro/novembro/dezembro/janeiro)", correctAnswer: "dezembro", rationale: "十二月 = じゅうにがつ = mês 12 = dezembro. 十 = 10 + 二 = 2.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "一日 (primeiro dia/segundo dia/terceiro dia/décimo dia)", correctAnswer: "primeiro dia", rationale: "一日 = ついたち / いちにち = primeiro dia do mês. 一 = 1 + 日 = dia.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "五人 (quatro pessoas/cinco pessoas/seis pessoas/sete pessoas)", correctAnswer: "cinco pessoas", rationale: "五人 = ごにん = cinco pessoas. 五 = 5 + 人 = pessoa.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "二十 (doze/vinte/dois/dez)", correctAnswer: "vinte", rationale: "二十 = にじゅう = 2×10 = 20. 二 = 2 + 十 = 10.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "四月一日 (1° de março/1° de abril/1° de maio/4 de janeiro)", correctAnswer: "1° de abril", rationale: "四月 = abril; 一日 = dia 1. 四月一日 = 1° de abril.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "六時 (5h/6h/7h/8h)", correctAnswer: "6h", rationale: "六時 = ろくじ = 6 horas. 六 = 6 + 時 = hora.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "九人の かぞく (família de oito/família de nove/família de dez/família de sete)", correctAnswer: "família de nove", rationale: "九人 = きゅうにん = nove pessoas; かぞく = família.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "十月十日 (10 de setembro/10 de outubro/1 de outubro/10 de novembro)", correctAnswer: "10 de outubro", rationale: "十月 = outubro (mês 10); 十日 = dia 10. 十月十日 = 10 de outubro.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
