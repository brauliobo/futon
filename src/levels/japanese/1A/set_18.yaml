title: 📝 Números e tempo — 何時ですか？
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Perguntar e dizer horas, datas e quantidades. Kanji numéricos aplicados ao tempo."
example: "何時ですか？= Que horas são? 三時です。= São 3 horas. 何月何日？= Qual mês e dia?"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Horas e perguntas de tempo
    description: Leia a pergunta ou resposta e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "何時ですか。 (Que dia é hoje?/Que horas são?/Qual é a data?/Que mês é este?)", correctAnswer: "Que horas são?", rationale: "何時 → なんじ → que horas; ですか → é? Pergunta mais básica sobre tempo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "三時です。 (São 2h./São 3h./São 4h./São 13h.)", correctAnswer: "São 3h.", rationale: "三時 → さんじ → 3 horas; です → é/são.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "七時半です。 (São 7h15./São 6h30./São 7h30./São 8h30.)", correctAnswer: "São 7h30.", rationale: "七時 → 7h; 半 → metade → 30 minutos. 七時半 → 7h30.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "十二時に ご飯を たべます。 (Como às 11h./Como às 12h./Como às 13h./Janto às 12h.)", correctAnswer: "Como às 12h.", rationale: "十二時に → às 12h (meio-dia); ご飯を たべます → como.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "何月ですか。 (Que dia é?/Que horas são?/Que mês é?/Que ano é?)", correctAnswer: "Que mês é?", rationale: "何月 → なんがつ → que mês; ですか → é? Pergunta sobre o mês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "五月です。 (É abril./É junho./É maio./É julho.)", correctAnswer: "É maio.", rationale: "五月 → ごがつ → maio (mês 5). 五 → 5 + 月 → mês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は 何日ですか。 (Que mês é hoje?/Que dia do mês é hoje?/Que dia da semana é hoje?/Que ano é hoje?)", correctAnswer: "Que dia do mês é hoje?", rationale: "今日は → hoje; 何日 → なんにち → qual dia do mês; ですか → é?", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "十五日です。 (É dia 5./É dia 14./É dia 15./É dia 16.)", correctAnswer: "É dia 15.", rationale: "十五日 → じゅうごにち → dia 15. 十 → 10 + 五 → 5 → 15.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "朝 七時に おきます。 (Acordo às 6h da manhã./Acordo às 7h da tarde./Acordo às 7h da manhã./Durmo às 7h da manhã.)", correctAnswer: "Acordo às 7h da manhã.", rationale: "朝 → manhã; 七時に → às 7h; おきます → acordo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "夜 十一時に ねます。 (Durmo às 10h da noite./Durmo às 11h da manhã./Durmo às 11h da noite./Acordo às 11h da noite.)", correctAnswer: "Durmo às 11h da noite.", rationale: "夜 → noite; 十一時に → às 11h; ねます → durmo.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Datas e expressões de tempo
    description: Leia e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "三月三日は ひなまつりです。 (3 de março é o dia das crianças./3 de março é o festival das bonecas./3 de abril é o festival das bonecas./13 de março é o festival das bonecas.)", correctAnswer: "3 de março é o festival das bonecas.", rationale: "三月三日 → 3 de março; ひなまつり → festival das bonecas (Hinamatsuri).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今は 何時ですか。六時です。 (Agora são 5h./Agora são 6h./Agora são 7h./Agora são 16h.)", correctAnswer: "Agora são 6h.", rationale: "今は 何時ですか → Que horas são agora? 六時です → São 6h.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "授業は 九時から 三時までです。 (A aula é das 8h às 3h./A aula é das 9h às 4h./A aula é das 9h às 3h./A aula é das 9h às 2h.)", correctAnswer: "A aula é das 9h às 3h.", rationale: "授業 → aula; 九時から → das 9h; 三時まで → até às 3h.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "誕生日は 八月十日です。 (Meu aniversário é 10 de julho./Meu aniversário é 8 de outubro./Meu aniversário é 10 de agosto./Meu aniversário é 18 de agosto.)", correctAnswer: "Meu aniversário é 10 de agosto.", rationale: "誕生日 → aniversário; 八月 → agosto; 十日 → dia 10.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "電車は 何時に きますか。 (A que horas o trem parte?/A que horas o trem chega?/Que trem você pega?/Onde o trem para?)", correctAnswer: "A que horas o trem chega?", rationale: "電車は → o trem; 何時に → a que horas; きますか → vem/chega?", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "四月一日から 大学が 始まります。 (A universidade começa em 1° de março./A universidade começa em 1° de abril./A escola começa em 1° de abril./A universidade termina em 1° de abril.)", correctAnswer: "A universidade começa em 1° de abril.", rationale: "四月一日から → a partir de 1° de abril; 大学が 始まります → a universidade começa.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "二時間 べんきょうしました。 (Estudei por 1 hora./Estudei por 2 horas./Estudei por 20 minutos./Estudei por 12 horas.)", correctAnswer: "Estudei por 2 horas.", rationale: "二時間 → にじかん → 2 horas; べんきょうしました → estudei.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は 何曜日ですか。 (Que mês é hoje?/Que dia do mês é hoje?/Que dia da semana é hoje?/Que ano é hoje?)", correctAnswer: "Que dia da semana é hoje?", rationale: "今日は → hoje; 何曜日 → なんようび → que dia da semana; ですか → é?", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本では 四月から 新しい 学年が 始まります。 (No Japão o ano letivo começa em janeiro./No Japão o ano letivo começa em abril./No Japão o ano letivo começa em setembro./No Japão o ano letivo termina em abril.)", correctAnswer: "No Japão o ano letivo começa em abril.", rationale: "日本では → no Japão; 四月から → a partir de abril; 新しい 学年が 始まります → o novo ano letivo começa.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "一日は 二十四時間です。 (Um dia tem 12 horas./Um dia tem 24 horas./Uma semana tem 24 horas./Um mês tem 24 dias.)", correctAnswer: "Um dia tem 24 horas.", rationale: "一日 → um dia; 二十四時間 → 24 horas; です → tem/é.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
