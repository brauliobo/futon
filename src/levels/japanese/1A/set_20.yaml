title: 📝 Revisão final 1A — kanji básico + frases N5
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Revisão completa do nível 1A: kanji N5, partículas, verbos ～ます, adjetivos e diálogos."
example: "Você domina kanji N5 básicos e estrutura de frases. Ex.: 山田さんは 毎日 電車で 大学に 行きます。"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Kanji e vocabulário — revisão geral
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "日本語が 上手です。 (Seu japonês é fraco./Seu japonês é muito difícil./Seu japonês é bom./Você odeia japonês.)", correctAnswer: "Seu japonês é bom.", rationale: "日本語 → japonês; 上手です → é hábil/bom. Elogio muito comum.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "七月七日は 七夕です。 (7 de julho é o Natal japonês./7 de julho é o festival Tanabata./7 de junho é o festival Tanabata./17 de julho é o Tanabata.)", correctAnswer: "7 de julho é o festival Tanabata.", rationale: "七月七日 → 7 de julho; 七夕 → たなばた → festival das estrelas Tanabata.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大学の 中に 図書館が あります。 (Tem biblioteca fora da universidade./Tem restaurante dentro da universidade./Tem biblioteca dentro da universidade./Tem livraria dentro da universidade.)", correctAnswer: "Tem biblioteca dentro da universidade.", rationale: "大学の 中 → dentro da universidade; 図書館が → biblioteca; あります → tem.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "手が 大きくて、足も 大きいです。 (Mãos são grandes mas pés são pequenos./Mãos e pés são grandes./Mãos são pequenas e pés também são grandes./Só as mãos são grandes.)", correctAnswer: "Mãos e pés são grandes.", rationale: "手が 大きくて → mãos são grandes e; 足も 大きいです → pés também são grandes.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "電車で 一時間 かかります。 (Leva 2h de ônibus./Leva 1h de trem./Leva 1h de carro./Leva 2h de trem.)", correctAnswer: "Leva 1h de trem.", rationale: "電車で → de trem; 一時間 → 1 hora; かかります → leva.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "木曜日に テストが あります。 (Tem teste na quarta./Tem teste na quinta./Tem prova na sexta./Tem exame na terça.)", correctAnswer: "Tem teste na quinta.", rationale: "木曜日 → quinta-feira; テストが → teste; あります → tem.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山川さんは 中学生です。 (Sr. Yamakawa é universitário./Sr. Yamakawa é professor./Sr. Yamakawa é aluno do ensino fundamental./Sr. Yamakawa é aluno da escola primária.)", correctAnswer: "Sr. Yamakawa é aluno do ensino fundamental.", rationale: "山川さん → sobrenome Yamakawa; 中学生 → aluno do ensino fundamental (escola média).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "五人 家族です。 (Família de 4 pessoas./Família de 5 pessoas./Família de 6 pessoas./Família de 7 pessoas.)", correctAnswer: "Família de 5 pessoas.", rationale: "五人 → 5 pessoas; 家族です → é família / somos família.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "台所で 母が ご飯を つくっています。 (A mãe está comendo na cozinha./A mãe está cozinhando na cozinha./A mãe está lavando na cozinha./A mãe está dormindo na cozinha.)", correctAnswer: "A mãe está cozinhando na cozinha.", rationale: "台所で → na cozinha; 母が → a mãe; ご飯を つくっています → está cozinhando.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本には 山が 多いです。 (No Japão há muitos rios./No Japão há muitas montanhas./No Japão há poucas montanhas./No Japão há muitas florestas.)", correctAnswer: "No Japão há muitas montanhas.", rationale: "日本には → no Japão; 山が → montanhas; 多いです → há muitos.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Frases integradas — nível N5
    description: Leia frases complexas e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "わたしは 毎朝 六時に おきて、電車で 大学に 行きます。 (Todo dia acordo às 7h e vou de ônibus./Todo manhã acordo às 6h e vou de trem./Toda manhã acordo às 6h e vou de carro./Todo dia acordo às 6h e fico em casa.)", correctAnswer: "Todo manhã acordo às 6h e vou de trem.", rationale: "毎朝 → toda manhã; 六時に → às 6h; 電車で → de trem; 大学に 行きます → vou à universidade.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "先生は 月曜日から 金曜日まで 日本語を おしえます。 (O professor ensina inglês de segunda a sexta./O professor ensina japonês de terça a sábado./O professor ensina japonês de segunda a sexta./O aluno estuda japonês de segunda a sexta.)", correctAnswer: "O professor ensina japonês de segunda a sexta.", rationale: "先生は → o professor; 月曜日から 金曜日まで → de segunda a sexta; 日本語を おしえます → ensina japonês.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この 山は 大きくて、きれいですが、登るのは むずかしいです。 (Esta montanha é grande e bonita, mas fácil de escalar./Esta montanha é grande e bonita, mas difícil de escalar./Esta montanha é pequena e bonita e fácil de escalar./Esta floresta é grande e bonita mas difícil de entrar.)", correctAnswer: "Esta montanha é grande e bonita, mas difícil de escalar.", rationale: "山は 大きくて きれい → grande e bonita; 登るのは むずかしい → difícil de escalar.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「何が すきですか。」「日本語と 音楽が すきです。」 (Gosto de inglês e música./Não gosto de japonês nem música./Gosto de japonês e música./Gosto de japonês mas não de música.)", correctAnswer: "Gosto de japonês e música.", rationale: "日本語と → japonês e; 音楽が すきです → gosto de música.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は 水曜日で、明日は 木曜日です。 (Hoje é terça e amanhã é quarta./Hoje é quarta e amanhã é quinta./Hoje é quinta e amanhã é sexta./Hoje é quarta e amanhã é sexta.)", correctAnswer: "Hoje é quarta e amanhã é quinta.", rationale: "今日は 水曜日 → hoje é quarta; 明日は 木曜日 → amanhã é quinta.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "玄関で 靴を ぬいで、中に 入ります。 (Coloco os sapatos na entrada e entro./Tiro os sapatos na entrada e entro./Lavo os sapatos na entrada e entro./Guardo os sapatos na entrada e saio.)", correctAnswer: "Tiro os sapatos na entrada e entro.", rationale: "玄関で → na entrada; 靴を ぬいで → tirando os sapatos; 中に 入ります → entro dentro.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "田中さんは 日本語が 上手で、英語も できます。 (Sr. Tanaka é bom em japonês mas não sabe inglês./Sr. Tanaka é ruim em japonês mas bom em inglês./Sr. Tanaka é bom em japonês e também sabe inglês./Sr. Tanaka sabe apenas inglês.)", correctAnswer: "Sr. Tanaka é bom em japonês e também sabe inglês.", rationale: "日本語が 上手 → bom em japonês; 英語も できます → também sabe inglês.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "朝ご飯を たべませんでした。だから、今 おなかが すいています。 (Tomei café da manhã, então estou satisfeito./Não tomei café da manhã, então estou com fome./Almoçei, então estou satisfeito./Não jantei, então estou com fome.)", correctAnswer: "Não tomei café da manhã, então estou com fome.", rationale: "朝ご飯を たべませんでした → não tomei café da manhã; だから → então; おなかが すいています → estou com fome.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本の 人口は 一億 二千万人 ぐらいです。中国より 少ないです。 (O Japão tem cerca de 120 milhões; mais que a China./O Japão tem cerca de 12 milhões; menos que a China./O Japão tem cerca de 120 milhões; menos que a China./O Japão tem exatamente 120 milhões; igual à China.)", correctAnswer: "O Japão tem cerca de 120 milhões; menos que a China.", rationale: "一億 二千万人 → 120 milhões; ぐらい → cerca de; 中国より 少ない → menos que a China.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語の べんきょうは むずかしいですが、おもしろいです。 (Estudar japonês é fácil e chato./Estudar japonês é difícil mas interessante./Estudar japonês é fácil e interessante./Estudar japonês é difícil e chato.)", correctAnswer: "Estudar japonês é difícil mas interessante.", rationale: "日本語の べんきょうは → estudar japonês; むずかしいですが → é difícil mas; おもしろいです → é interessante.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
