title: 📝 Leitura — kanji em palavras
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Leitura de palavras compostas usando os kanji aprendidos nos sets 01-05. Foco em vocabulário N5."
example: "Kanji se combinam para formar novas palavras. Ex.: 日本 = にほん = Japão (sol + origem)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Palavras compostas com kanji
    description: Leia a palavra com kanji e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "日本 (China/Coreia/Japão/Tailândia)", correctAnswer: "Japão", rationale: "日本 → にほん → Japão. 日 → sol + 本 → origem. 'A origem do sol'.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山川 (campo e rio/montanha e rio/floresta e lago/montanha e mar)", correctAnswer: "montanha e rio", rationale: "山川 → やまかわ → montanha e rio. Também é sobrenome japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "人口 (área/altura/população/riqueza)", correctAnswer: "população", rationale: "人口 → じんこう → população. 人 → pessoa + 口 → boca (boca → pessoa a alimentar).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大人 (criança/adolescente/adulto/idoso)", correctAnswer: "adulto", rationale: "大人 → おとな → adulto. 大 → grande + 人 → pessoa → pessoa grande.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "中学校 (escola primária/escola média/escola de inglês/universidade)", correctAnswer: "escola média", rationale: "中学校 → ちゅうがっこう → escola média (7°-9° ano). 中 → médio + 学校 → escola.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "上下 (acima e abaixo/dentro e fora/grande e pequeno/esquerda e direita)", correctAnswer: "acima e abaixo", rationale: "上下 → うえした / じょうげ → acima e abaixo. 上 → acima + 下 → abaixo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "手足 (olhos e ouvidos/boca e nariz/mãos e pés/braços e pernas)", correctAnswer: "mãos e pés", rationale: "手足 → てあし → mãos e pés. 手 → mão + 足 → pé.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日曜日 (segunda-feira/sábado/sexta-feira/domingo)", correctAnswer: "domingo", rationale: "日曜日 → にちようび → domingo. 日 → sol + 曜日 → dia da semana.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "三日 (segundo dia/terceiro dia/quarto dia/quinto dia)", correctAnswer: "terceiro dia", rationale: "三日 → みっか → terceiro dia do mês. 三 → 3 + 日 → dia.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "小川 (lago pequeno/riacho/rio grande/cachoeira)", correctAnswer: "riacho", rationale: "小川 → おがわ → riacho / córrego. 小 → pequeno + 川 → rio.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Kanji em frases do dia a dia
    description: Leia a frase com kanji e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "大学生です。 (Sou aluno da escola primária./Sou professor universitário./Sou aluno universitário./Sou aluno do ensino médio.)", correctAnswer: "Sou aluno universitário.", rationale: "大学生 → だいがくせい → universitário. 大学 → universidade + 生 → estudante.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山の 上に 雪が ある。 (Tem neve no vale./Tem neve no topo da montanha./Tem neve no rio./Tem neve na floresta.)", correctAnswer: "Tem neve no topo da montanha.", rationale: "山の 上 → topo da montanha; 雪 → neve; ある → tem.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "川の 中に さかなが いる。 (Tem peixe no rio./Tem peixe no lago./Tem peixe no mar./Tem peixe no arrozal.)", correctAnswer: "Tem peixe no rio.", rationale: "川の 中 → dentro do rio; さかな → peixe; いる → tem (ser vivo).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "三人の こどもが います。 (Tem duas crianças./Tem três crianças./Tem quatro crianças./Tem cinco crianças.)", correctAnswer: "Tem três crianças.", rationale: "三人 → さんにん → três pessoas; こども → criança; います → tem.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "目が 大きい。 (Os olhos são pequenos./Os olhos são grandes./A boca é grande./Os ouvidos são grandes.)", correctAnswer: "Os olhos são grandes.", rationale: "目 → olho; 大きい → grande.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "五月五日は こどもの ひです。 (5 de maio é o Dia das Mães./5 de maio é o Dia das Crianças./5 de abril é o Dia das Crianças./15 de maio é o Dia das Crianças.)", correctAnswer: "5 de maio é o Dia das Crianças.", rationale: "五月五日 → 5 de maio; こどもの ひ → Dia das Crianças.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "土の 中に ある。 (Está em cima da terra./Está dentro da terra./Está perto da floresta./Está no topo da montanha.)", correctAnswer: "Está dentro da terra.", rationale: "土の 中 → dentro da terra/solo. 土 → terra + 中 → dentro.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "小さい 手。 (Mão grande./Mão pequena./Pé pequeno./Mão média.)", correctAnswer: "Mão pequena.", rationale: "小さい → pequeno; 手 → mão.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本人の 友だちが います。 (Tenho amigo americano./Tenho amigo japonês./Tenho amigo chinês./Tenho amigo coreano.)", correctAnswer: "Tenho amigo japonês.", rationale: "日本人 → japonês; 友だち → amigo; います → tenho.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "九月十日に うまれました。 (Nasci em 10 de outubro./Nasci em 9 de outubro./Nasci em 10 de setembro./Nasci em 19 de setembro.)", correctAnswer: "Nasci em 10 de setembro.", rationale: "九月 → setembro (mês 9); 十日 → dia 10; うまれました → nasci.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
