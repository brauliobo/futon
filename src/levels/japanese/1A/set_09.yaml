title: 💬 Frases com を e が (objeto e sujeito)
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Partículas を (objeto direto) e が (sujeito enfático, existência, preferência). Distinção essencial."
example: "を marca o objeto do verbo. が marca o sujeito com ênfase. Ex.: 本を よむ。/ 犬が すきです。"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Partícula を — objeto direto
    description: Leia a frase e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "本を よみます。 (Escrevo um livro./Compro um livro./Leio um livro./Vendo um livro.)", correctAnswer: "Leio um livro.", rationale: "本を = livro (objeto); よみます = leio. を marca o objeto do verbo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語を べんきょうします。 (Ensino japonês./Estudo japonês./Falo japonês./Esqueço japonês.)", correctAnswer: "Estudo japonês.", rationale: "日本語を = japonês (objeto); べんきょうします = estudo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ご飯を たべます。 (Cozinho arroz./Como arroz./Compro arroz./Sirvo arroz.)", correctAnswer: "Como arroz.", rationale: "ご飯を = arroz/refeição (objeto); たべます = como.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "音楽を ききます。 (Componho música./Toco música./Ouço música./Canto música.)", correctAnswer: "Ouço música.", rationale: "音楽を = música (objeto); ききます = ouço.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "手紙を かきます。 (Leio uma carta./Recebo uma carta./Escrevo uma carta./Envio uma carta.)", correctAnswer: "Escrevo uma carta.", rationale: "手紙を = carta (objeto); かきます = escrevo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "水を のみます。 (Como água./Compro água./Fervoo água./Bebo água.)", correctAnswer: "Bebo água.", rationale: "水を = água (objeto); のみます = bebo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "映画を みます。 (Ouço um filme./Faço um filme./Assisto um filme./Leio um filme.)", correctAnswer: "Assisto um filme.", rationale: "映画を = filme (objeto); みます = assisto.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語を おしえます。 (Aprendo japonês./Estudo japonês./Falo japonês./Ensino japonês.)", correctAnswer: "Ensino japonês.", rationale: "日本語を = japonês (objeto); おしえます = ensino.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "犬を さんぽさせます。 (Banho o cachorro./Brinco com o cachorro./Passeio com o cachorro./Alimento o cachorro.)", correctAnswer: "Passeio com o cachorro.", rationale: "犬を = cachorro (objeto); さんぽさせます = faço passear.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "コーヒーを のみます。 (Faço café./Compro café./Bebo café./Sirvo café.)", correctAnswer: "Bebo café.", rationale: "コーヒーを = café (objeto); のみます = bebo.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Partícula が — sujeito e preferência
    description: Leia e escolha o significado da frase.
    exercises:
      - { type: japanese_vocab, question: "犬が すきです。 (Odeio cachorros./Tenho cachorro./Gosto de cachorro./Tenho medo de cachorro.)", correctAnswer: "Gosto de cachorro.", rationale: "犬が = cachorro (sujeito); すきです = gosto de. が com すき = preferência.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山が みえます。 (Estou na montanha./Consigo ver a montanha./A montanha é grande./A montanha está aqui.)", correctAnswer: "Consigo ver a montanha.", rationale: "山が = montanha (sujeito); みえます = consigo ver. が com みえる = percepção.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語が わかります。 (Estudo japonês./Falo japonês./Entendo japonês./Ensino japonês.)", correctAnswer: "Entendo japonês.", rationale: "日本語が = japonês (sujeito); わかります = entendo. が com わかる = compreensão.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "雨が ふります。 (O vento sopra./A neve cai./A chuva cai./O sol aparece.)", correctAnswer: "A chuva cai.", rationale: "雨が = chuva (sujeito); ふります = cai. Verbo natural usa が.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "川が きれいです。 (O rio está sujo./O rio está seco./O rio é bonito./O rio é largo.)", correctAnswer: "O rio é bonito.", rationale: "川が = rio (sujeito); きれいです = é bonito.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "音楽が すきでは ありません。 (Gosto de música./Toco música./Não gosto de música./Ouço música.)", correctAnswer: "Não gosto de música.", rationale: "音楽が = música; すきでは ありません = não gosto de.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どの 山が 一番 高いですか。 (Qual rio é mais largo?/Qual montanha é a mais alta?/Qual floresta é a maior?/Qual lago é o mais profundo?)", correctAnswer: "Qual montanha é a mais alta?", rationale: "どの = qual; 山 = montanha; 一番 = o mais; 高い = alto; ですか = pergunta.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "何が すきですか。 (O que você odeia?/O que você quer?/O que você gosta?/O que você tem?)", correctAnswer: "O que você gosta?", rationale: "何が = o quê (sujeito); すきですか = gosta? Pergunta sobre preferência.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語が じょうずですね。 (Seu japonês é horrível./Seu japonês é bom!/Você estuda japonês?/Você gosta de japonês?)", correctAnswer: "Seu japonês é bom!", rationale: "日本語が = japonês; じょうずです = é hábil/bom; ね = né/não é. Elogio comum.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大きい 声が きこえます。 (Consigo ouvir uma voz alta./Consigo ver uma voz alta./Uma voz alta saiu./Uma voz alta entrou.)", correctAnswer: "Consigo ouvir uma voz alta.", rationale: "大きい 声 = voz alta; が = sujeito; きこえます = consigo ouvir.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
