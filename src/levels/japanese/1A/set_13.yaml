title: 💬 Verbos no presente — ～ます e ～ません
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Forma polida dos verbos: ～ます (afirmativo presente/futuro) e ～ません (negativo). Nível N5."
example: "～ます = forma educada afirmativa. ～ません = forma educada negativa. Ex.: たべます → como; たべません → não como."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Verbos em ～ます
    description: Leia o verbo e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "たべます (bebo/como/durmo/estudo)", correctAnswer: "como", rationale: "たべます → forma polida de たべる (comer). Presente / futuro afirmativo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "のみます (como/durmo/bebo/leio)", correctAnswer: "bebo", rationale: "のみます → forma polida de のむ (beber). Presente afirmativo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いきます (venho/fico/vou/volto)", correctAnswer: "vou", rationale: "いきます → forma polida de いく (ir). Presente / futuro afirmativo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きます (vou/fico/volto/venho)", correctAnswer: "venho", rationale: "きます → forma polida de くる (vir). Presente / futuro afirmativo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "よみます (escrevo/leio/falo/ouço)", correctAnswer: "leio", rationale: "よみます → forma polida de よむ (ler). Presente afirmativo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かきます (leio/escrevo/falo/ouço)", correctAnswer: "escrevo", rationale: "かきます → forma polida de かく (escrever). Presente afirmativo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "みます (ouço/falo/assisto/escrevo)", correctAnswer: "assisto", rationale: "みます → forma polida de みる (ver/assistir). Presente afirmativo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ねます (acordo/estudo/durmo/como)", correctAnswer: "durmo", rationale: "ねます → forma polida de ねる (dormir). Presente / futuro afirmativo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おきます (durmo/fico/acordo/vou)", correctAnswer: "acordo", rationale: "おきます → forma polida de おきる (acordar). Presente / futuro afirmativo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "します (faço/fui/vim/fiquei)", correctAnswer: "faço", rationale: "します → forma polida de する (fazer). O verbo mais versátil do japonês.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Verbos em ～ません e frases completas
    description: Leia a frase e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "たべません。 (Como./Comerei./Não como./Comi.)", correctAnswer: "Não como.", rationale: "たべません → negativo de たべます → não como (presente).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "肉を たべません。 (Como carne./Não como carne./Gosto de carne./Compro carne.)", correctAnswer: "Não como carne.", rationale: "肉を → carne (objeto); たべません → não como.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "テレビを みません。 (Assisto TV./Não assisto TV./Ouço TV./Compro TV.)", correctAnswer: "Não assisto TV.", rationale: "テレビを → TV; みません → não assisto.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "まいあさ 六時に おきます。 (Acordo às 7h todo dia./Durmo às 6h todo dia./Acordo às 6h toda manhã./Durmo às 6h toda manhã.)", correctAnswer: "Acordo às 6h toda manhã.", rationale: "まいあさ → toda manhã; 六時に → às 6h; おきます → acordo.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "週末は 学校に いきません。 (Vou à escola no fim de semana./Não vou à escola no fim de semana./Estudo no fim de semana./Trabalho no fim de semana.)", correctAnswer: "Não vou à escola no fim de semana.", rationale: "週末 → fim de semana; 学校に → à escola; いきません → não vou.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語で はなします。 (Não falo em japonês./Falo em inglês./Falo em japonês./Ouço japonês.)", correctAnswer: "Falo em japonês.", rationale: "日本語で → em japonês; はなします → falo.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "毎日 本を よみます。 (Leio livro às vezes./Não leio livro todo dia./Leio livro todo dia./Escrevo livro todo dia.)", correctAnswer: "Leio livro todo dia.", rationale: "毎日 → todo dia; 本を → livro; よみます → leio.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "コーヒーは のみません。 (Bebo café./Não bebo café./Gosto de café./Faço café.)", correctAnswer: "Não bebo café.", rationale: "コーヒーは → café (tópico); のみません → não bebo.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "何時に ねますか。 (A que horas você acorda?/A que horas você come?/A que horas você dorme?/A que horas você sai?)", correctAnswer: "A que horas você dorme?", rationale: "何時に → a que horas; ねますか → dorme? (pergunta).", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "週末に 何を しますか。 (O que você faz hoje?/O que você faz todo dia?/O que você faz no fim de semana?/O que você fez ontem?)", correctAnswer: "O que você faz no fim de semana?", rationale: "週末に → no fim de semana; 何を → o que; しますか → faz? (pergunta).", difficulty: 3, objectives: [japanese.vocab] }
target: 20
