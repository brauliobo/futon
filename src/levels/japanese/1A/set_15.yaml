title: 📝 Leitura — hiragana + kanji misturado
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Leitura de textos mistos com hiragana e kanji N5. Simulação de textos reais para iniciantes."
example: "Textos japoneses reais misturam kanji e hiragana. Ex.: 山田さんは 大学生です。"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Frases mistas hiragana + kanji
    description: Leia a frase e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "山田さんは 大学生です。 (Sr. Yamada é professor./Sr. Yamada é universitário./Sra. Yamada é aluna da escola média./Sr. Yamada é médico.)", correctAnswer: "Sr. Yamada é universitário.", rationale: "山田さん → Sr. Yamada; 大学生 → universitário; です → é.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は 火曜日です。 (Hoje é segunda-feira./Hoje é quarta-feira./Hoje é terça-feira./Hoje é quinta-feira.)", correctAnswer: "Hoje é terça-feira.", rationale: "今日は → hoje; 火曜日 → terça-feira; です → é.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "川の 中に さかなが います。 (Tem peixe no mar./Tem peixe no rio./Tem tartaruga no rio./Tem peixe no lago.)", correctAnswer: "Tem peixe no rio.", rationale: "川の 中 → dentro do rio; さかな → peixe; います → tem.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "三人の 子どもが います。 (Tem duas crianças./Tem três crianças./Tem quatro crianças./Tem um filho.)", correctAnswer: "Tem três crianças.", rationale: "三人 → três pessoas; 子ども → crianças; います → tem.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大きい 山が 見えます。 (Não consigo ver a montanha./Consigo ver uma floresta grande./Consigo ver uma montanha grande./Consigo ver um rio grande.)", correctAnswer: "Consigo ver uma montanha grande.", rationale: "大きい → grande; 山 → montanha; 見えます → consigo ver.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "目が 小さい 人。 (Uma pessoa com olhos grandes./Uma pessoa com boca pequena./Uma pessoa com olhos pequenos./Uma pessoa com pés pequenos.)", correctAnswer: "Uma pessoa com olhos pequenos.", rationale: "目 → olhos; 小さい → pequenos; 人 → pessoa.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "電車で 三十分 かかります。 (Leva 30 minutos de ônibus./Leva 13 minutos de trem./Leva 30 minutos de trem./Leva 3 horas de trem.)", correctAnswer: "Leva 30 minutos de trem.", rationale: "電車で → de trem; 三十分 → 30 minutos; かかります → leva (tempo).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "五月に 日本へ 行きます。 (Vou ao Japão em abril./Vou à China em maio./Vou ao Japão em maio./Fui ao Japão em maio.)", correctAnswer: "Vou ao Japão em maio.", rationale: "五月に → em maio; 日本へ → para o Japão; 行きます → vou.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山の 上から 川が 見えます。 (Do rio consigo ver a montanha./Do fundo do rio consigo ver o céu./Do topo da montanha consigo ver o rio./Da floresta consigo ver o rio.)", correctAnswer: "Do topo da montanha consigo ver o rio.", rationale: "山の 上から → do topo da montanha; 川が → rio; 見えます → consigo ver.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "手と 足を 洗います。 (Lavo os olhos e a boca./Lavo as mãos e os pés./Lavo o rosto e as mãos./Lavo o cabelo e os pés.)", correctAnswer: "Lavo as mãos e os pés.", rationale: "手 → mão; 足 → pé; 洗います → lavo.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Textos curtos com kanji
    description: Leia o texto e escolha o resumo correto.
    exercises:
      - { type: japanese_vocab, question: "わたしは 田中です。大学生です。日本語を べんきょうしています。 (Me chamo Tanaka, sou professor e estudo japonês./Me chamo Tanaka, sou universitário e estudo japonês./Me chamo Tanaka, sou aluno do ensino médio e estudo inglês./Me chamo Yamada, sou universitário e estudo japonês.)", correctAnswer: "Me chamo Tanaka, sou universitário e estudo japonês.", rationale: "田中 → Tanaka; 大学生 → universitário; 日本語を べんきょうしています → estudo japonês.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は 木曜日です。明日は 金曜日です。 (Hoje é quarta e amanhã é quinta./Hoje é quinta e amanhã é sexta./Hoje é sexta e amanhã é sábado./Hoje é terça e amanhã é quarta.)", correctAnswer: "Hoje é quinta e amanhã é sexta.", rationale: "今日は 木曜日 → hoje é quinta; 明日は 金曜日 → amanhã é sexta.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この 川は 大きくて、きれいです。山も 見えます。 (Este rio é grande e feio. Tem montanhas também./Este lago é grande e bonito. Tem montanhas./Este rio é grande e bonito. Tem montanhas também./Este rio é pequeno e bonito. Tem florestas também.)", correctAnswer: "Este rio é grande e bonito. Tem montanhas também.", rationale: "川 → rio; 大きくて → grande e; きれいです → bonito; 山も 見えます → as montanhas também são visíveis.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山田さんは 月曜日から 金曜日まで 大学に 行きます。 (Sr. Yamada vai à escola de segunda a sexta./Sr. Yamada vai à universidade de segunda a sexta./Sr. Yamada vai ao trabalho de segunda a sábado./Sr. Yamada vai à escola de terça a sexta.)", correctAnswer: "Sr. Yamada vai à universidade de segunda a sexta.", rationale: "山田さん → Sr. Yamada; 月曜日から 金曜日まで → de segunda a sexta; 大学に 行きます → vai à universidade.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "子どもは 三人います。上の 子は 十歳です。 (Há quatro filhos. O mais novo tem 10 anos./Há três filhos. O mais novo tem 10 anos./Há três filhos. O mais velho tem 10 anos./Há dois filhos. O mais velho tem 10 anos.)", correctAnswer: "Há três filhos. O mais velho tem 10 anos.", rationale: "三人 → três; 上の 子 → filho mais velho; 十歳 → 10 anos.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "毎日 電車で 一時間 かかります。 (Todo dia leva 1 hora de ônibus./Todo dia leva 2 horas de trem./Todo dia leva 1 hora de trem./Todo dia leva 1 hora a pé.)", correctAnswer: "Todo dia leva 1 hora de trem.", rationale: "毎日 → todo dia; 電車で → de trem; 一時間 → 1 hora; かかります → leva.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本人の 人口は 一億二千万人 ぐらいです。 (A população japonesa é de cerca de 120 milhões./A população japonesa é de cerca de 12 milhões./A população chinesa é de 120 milhões./A população japonesa é exatamente 120 milhões.)", correctAnswer: "A população japonesa é de cerca de 120 milhões.", rationale: "日本人の 人口 → população japonesa; 一億二千万人 → 120 milhões; ぐらい → cerca de.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "今日は 土曜日ですが、大学に 行きます。 (Hoje é sábado e não vou à universidade./Hoje é sábado mas vou à universidade./Hoje é domingo mas vou à escola./Hoje é sexta e vou à universidade.)", correctAnswer: "Hoje é sábado mas vou à universidade.", rationale: "今日は 土曜日 → hoje é sábado; ですが → mas; 大学に 行きます → vou à universidade.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "山の 中に 小さい 川が あります。 (Há um rio grande fora da montanha./Há um lago pequeno dentro da floresta./Há um riacho dentro da montanha./Não há rios nas montanhas.)", correctAnswer: "Há um riacho dentro da montanha.", rationale: "山の 中に → dentro da montanha; 小さい 川 → rio pequeno (riacho); あります → há.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "田中さんは 手が 大きいです。足も 大きいです。 (Sr. Tanaka tem mãos grandes e pés pequenos./Sr. Tanaka tem mãos pequenas e pés grandes./Sr. Tanaka tem mãos grandes e pés grandes também./Sr. Tanaka tem mãos e pés médios.)", correctAnswer: "Sr. Tanaka tem mãos grandes e pés grandes também.", rationale: "手が 大きいです → mãos são grandes; 足も 大きいです → pés também são grandes.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
