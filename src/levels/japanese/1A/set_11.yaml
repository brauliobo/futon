title: 📚 Vocabulário — objetos da casa
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Vocabulário N5 dos cômodos e objetos da casa japonesa. Itens essenciais do cotidiano."
example: "Objetos da casa em japonês. Ex.: 台所 → cozinha, 冷蔵庫 → geladeira, 風呂 → banheiro."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Cômodos da casa
    description: Leia a palavra e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "台所 (sala/cozinha/quarto/banheiro)", correctAnswer: "cozinha", rationale: "台所 → だいどころ → cozinha. 台 → bancada + 所 → lugar.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "寝室 (sala de jantar/escritório/quarto de dormir/sala de estar)", correctAnswer: "quarto de dormir", rationale: "寝室 → しんしつ → quarto de dormir. 寝 → dormir + 室 → cômodo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "お風呂 (lavanderia/banheiro/toilet/despensa)", correctAnswer: "banheiro", rationale: "お風呂 → おふろ → banheiro (com banheira). Tradicional na casa japonesa.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "リビング (cozinha/escritório/sala de estar/garagem)", correctAnswer: "sala de estar", rationale: "リビング vem do inglês 'living room' e significa sala de estar.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "玄関 (janela/porta dos fundos/entrada/varanda)", correctAnswer: "entrada", rationale: "玄関 → げんかん → entrada da casa. Lugar onde se tira os sapatos no Japão.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "窓 (porta/janela/chão/teto)", correctAnswer: "janela", rationale: "窓 → まど → janela.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "冷蔵庫 (fogão/geladeira/micro-ondas/freezer)", correctAnswer: "geladeira", rationale: "冷蔵庫 → れいぞうこ → geladeira. 冷 → frio + 蔵 → guardar + 庫 → depósito.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "テーブル (sofá/cadeira/mesa/estante)", correctAnswer: "mesa", rationale: "テーブル vem do inglês 'table' e significa mesa.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "椅子 (cama/sofá/banquinho/cadeira)", correctAnswer: "cadeira", rationale: "椅子 → いす → cadeira.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ベッド (sofá/cama/hammock/futon)", correctAnswer: "cama", rationale: "ベッド vem do inglês 'bed' e significa cama.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Objetos da casa em frases
    description: Leia a frase e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "台所で ご飯を つくります。 (Faço refeição no quarto./Faço refeição na cozinha./Como no banheiro./Faço refeição na sala.)", correctAnswer: "Faço refeição na cozinha.", rationale: "台所で → na cozinha; ご飯を → refeição (objeto); つくります → faço.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "冷蔵庫の 中に 牛乳が あります。 (Tem leite em cima da geladeira./Tem leite dentro da geladeira./Tem suco dentro da geladeira./Tem leite no fogão.)", correctAnswer: "Tem leite dentro da geladeira.", rationale: "冷蔵庫の 中 → dentro da geladeira; 牛乳 → leite; あります → tem.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "リビングで テレビを みます。 (Assisto TV no quarto./Assisto TV na cozinha./Assisto TV na sala de estar./Assisto TV no banheiro.)", correctAnswer: "Assisto TV na sala de estar.", rationale: "リビングで → na sala de estar; テレビを → TV (objeto); みます → assisto.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "玄関で くつを ぬぎます。 (Tiro os sapatos na entrada./Coloco os sapatos na entrada./Lavo os sapatos na entrada./Guardo os sapatos na varanda.)", correctAnswer: "Tiro os sapatos na entrada.", rationale: "玄関で → na entrada; くつを → sapatos; ぬぎます → tiro.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "寝室で ねます。 (Durmo na sala./Durmo no quarto./Durmo no sofá./Durmo na cozinha.)", correctAnswer: "Durmo no quarto.", rationale: "寝室で → no quarto de dormir; ねます → durmo.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "お風呂に はいります。 (Entro na cozinha./Entro na sala./Entro no banheiro./Entro no quarto.)", correctAnswer: "Entro no banheiro.", rationale: "お風呂に → no banheiro; はいります → entro. お風呂に はいる é a expressão para tomar banho.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "窓を あけます。 (Fecho a janela./Limpo a janela./Abro a janela./Quebro a janela.)", correctAnswer: "Abro a janela.", rationale: "窓を → janela (objeto); あけます → abro.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "テーブルの 上に コップが あります。 (Tem copo embaixo da mesa./Tem copo em cima da mesa./Tem prato ao lado da mesa./Tem copo dentro da mesa.)", correctAnswer: "Tem copo em cima da mesa.", rationale: "テーブルの 上 → em cima da mesa; コップ → copo; あります → tem.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この 家は 大きいです。 (Esta casa é pequena./Esta casa é grande./Este apartamento é grande./Esta sala é grande.)", correctAnswer: "Esta casa é grande.", rationale: "この → esta; 家 → casa; 大きいです → é grande.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ベッドの 下に 何か あります。 (Tem algo em cima da cama./Tem algo embaixo da cama./Tem algo dentro da cama./Tem algo ao lado da cama.)", correctAnswer: "Tem algo embaixo da cama.", rationale: "ベッドの 下 → embaixo da cama; 何か → algo; あります → tem.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
