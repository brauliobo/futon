title: 💬 Diálogo — na loja / no restaurante
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Diálogos funcionais em situações reais: comprar, pedir, agradecer. Vocabulário N5 em contexto."
example: "Situações práticas no Japão. Ex.: いらっしゃいませ。→ Bem-vindo! すみません、これを ください。→ Com licença, quero isto."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Na loja — diálogos e frases
    description: Leia a frase ou diálogo e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "いらっしゃいませ。 (Obrigado por comprar!/Bem-vindo!/Por favor volte!/Até logo!)", correctAnswer: "Bem-vindo!", rationale: "いらっしゃいませ é a saudação dos funcionários para clientes que entram na loja.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これを ください。 (Quanto custa isto?/Não quero isto./Por favor, me dê isto./Este não está bom.)", correctAnswer: "Por favor, me dê isto.", rationale: "これを → isto (obj); ください → por favor dê. Forma básica para pedir algo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いくらですか。 (Quanto custa?/Onde fica?/Quando abre?/Quantos tem?)", correctAnswer: "Quanto custa?", rationale: "いくら → quanto custa; ですか → é? A pergunta de preço mais comum.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "三百円です。 (Custa 300 ienes./Custa 30 ienes./Custa 3000 ienes./Custa 300 reais.)", correctAnswer: "Custa 300 ienes.", rationale: "三百円 → さんびゃくえん → 300 ienes. 三百 → 300 + 円 → iene.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大きい サイズは ありますか。 (Tem tamanho médio?/Tem tamanho pequeno?/Tem tamanho grande?/Tem outra cor?)", correctAnswer: "Tem tamanho grande?", rationale: "大きい → grande; サイズ → tamanho; ありますか → tem? Pergunta sobre disponibilidade.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "カードで はらえますか。 (Posso pagar com cheque?/Posso pagar com moeda?/Posso pagar em dinheiro?/Posso pagar com cartão?)", correctAnswer: "Posso pagar com cartão?", rationale: "カードで → com cartão; はらえますか → posso pagar? Pergunta de forma de pagamento.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ありがとう ございます。 (Com licença./Obrigado(a)./De nada./Por favor.)", correctAnswer: "Obrigado(a).", rationale: "ありがとう ございます → obrigado(a) (forma polida). Expressão de gratidão.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どうぞ。 (Com licença./Obrigado./Aqui está / Por favor, tome./Até logo.)", correctAnswer: "Aqui está / Por favor, tome.", rationale: "どうぞ → aqui está / por favor, serve-se. Usado ao entregar algo ou ceder passagem.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ちょっと まって ください。 (Por favor, venha aqui./Por favor, espere um momento./Por favor, sente-se./Por favor, abra isso.)", correctAnswer: "Por favor, espere um momento.", rationale: "ちょっと → um momento; まって → espere; ください → por favor. Pedido de espera.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "レシートを ください。 (Preciso de desconto./Por favor, me dê o recibo./Não preciso de recibo./Pode guardar o recibo.)", correctAnswer: "Por favor, me dê o recibo.", rationale: "レシート → recibo; ください → por favor dê. Pedir recibo após compra.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: No restaurante — diálogos
    description: Leia o diálogo e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "「何名様ですか。」「二人です。」 (Para quantas pessoas? Para duas pessoas./Quantos pedidos? Dois pedidos./Qual mesa? A mesa dois./Há reserva? Para duas pessoas.)", correctAnswer: "Para quantas pessoas? Para duas pessoas.", rationale: "何名様ですか → para quantas pessoas? 二人です → somos duas pessoas.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "メニューを ください。 (A conta, por favor./Por favor, me dê o cardápio./Por favor, a água./O que você recomenda?)", correctAnswer: "Por favor, me dê o cardápio.", rationale: "メニュー → cardápio; ください → por favor dê.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ラーメンを 二つ ください。 (Por favor, dois ramen./Por favor, um ramen./Por favor, três ramen./Por favor, dois sushis.)", correctAnswer: "Por favor, dois ramen.", rationale: "ラーメンを → ramen (obj); 二つ → dois; ください → por favor. Pedido de comida.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おすすめは 何ですか。 (Qual é o preço?/Qual é o tamanho?/O que você recomenda?/Qual é o horário?)", correctAnswer: "O que você recomenda?", rationale: "おすすめ → recomendação; は → tópico; 何ですか → o que é?", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "お水を ください。 (Por favor, o cardápio./Por favor, a conta./Por favor, a água./Por favor, o sal.)", correctAnswer: "Por favor, a água.", rationale: "お水 → água (forma polida); ください → por favor dê. Pedir água no restaurante.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "お会計を おねがいします。 (Por favor, o cardápio./Por favor, mais água./A conta, por favor./Por favor, o recibo.)", correctAnswer: "A conta, por favor.", rationale: "お会計 → conta; おねがいします → por favor. Pedir a conta no restaurante.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「おいしかったです！」 (Estava gostoso!/Estava ruim!/Estava caro!/Estava frio!)", correctAnswer: "Estava gostoso!", rationale: "おいしかったです → estava gostoso (passado de おいしいです). Elogio à comida.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「少々 お待ちください。」 (Por favor, sente-se./Por favor, espere um momento./Por favor, venha cá./Por favor, saia.)", correctAnswer: "Por favor, espere um momento.", rationale: "少々 → um momentinho; お待ちください → por favor aguarde. Frase polida de espera.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "「辛くないですか。」「大丈夫です。」 (Está muito caro? Está bem./Está muito picante? Está bem./Está muito frio? Está bem./Está muito salgado? Está bem.)", correctAnswer: "Está muito picante? Está bem.", rationale: "辛くないですか → não está muito picante? 大丈夫です → está bem / sem problema.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "また きます。 (Vou embora para sempre./Venho sempre aqui./Vou voltar./Não venho mais.)", correctAnswer: "Vou voltar.", rationale: "また → outra vez / de novo; きます → venho. また きます → vou voltar / virei de novo.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
