title: 📚 Vocabulário — transportes
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Vocabulário N5 de meios de transporte. Essencial para descrever deslocamento no Japão."
example: "Transportes em japonês. Ex.: 電車 → trem elétrico, バス → ônibus, 飛行機 → avião."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Meios de transporte — reconhecimento
    description: Leia a palavra e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "電車 (avião/trem elétrico/ônibus/metrô)", correctAnswer: "trem elétrico", rationale: "電車 = でんしゃ = trem elétrico. 電 = eletricidade + 車 = veículo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "バス (táxi/metrô/ônibus/bonde)", correctAnswer: "ônibus", rationale: "バス vem do inglês 'bus' e significa ônibus.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "飛行機 (helicóptero/avião/foguete/planador)", correctAnswer: "avião", rationale: "飛行機 = ひこうき = avião. 飛 = voar + 行 = ir + 機 = máquina.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "自動車 (bicicleta/moto/carro/caminhão)", correctAnswer: "carro", rationale: "自動車 = じどうしゃ = carro / automóvel. 自動 = automático + 車 = veículo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "自転車 (bicicleta/moto/patinete/skate)", correctAnswer: "bicicleta", rationale: "自転車 = じてんしゃ = bicicleta. 自 = próprio + 転 = girar + 車 = veículo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "タクシー (ônibus/bonde/táxi/metrô)", correctAnswer: "táxi", rationale: "タクシー vem do inglês 'taxi' e significa táxi.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "地下鉄 (trem/bonde/ônibus/metrô)", correctAnswer: "metrô", rationale: "地下鉄 = ちかてつ = metrô. 地下 = subterrâneo + 鉄 = ferrovia.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "船 (avião/barco/submarino/foguete)", correctAnswer: "barco", rationale: "船 = ふね = barco / navio.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "新幹線 (trem comum/bonde/trem-bala/metrô)", correctAnswer: "trem-bala", rationale: "新幹線 = しんかんせん = trem-bala (Shinkansen). 新 = novo + 幹線 = linha principal.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "駅 (aeroporto/porto/estação/parada)", correctAnswer: "estação", rationale: "駅 = えき = estação (de trem/metrô).", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Transportes em frases
    description: Leia a frase e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "電車で 学校に いきます。 (Vou à escola de ônibus./Vou à escola de trem./Vou à escola de carro./Vou à escola a pé.)", correctAnswer: "Vou à escola de trem.", rationale: "電車で = de trem; 学校に = para a escola; いきます = vou.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "飛行機で 日本に いきます。 (Vou ao Japão de barco./Vou ao Japão de trem./Vou ao Japão de avião./Vou ao Japão de carro.)", correctAnswer: "Vou ao Japão de avião.", rationale: "飛行機で = de avião; 日本に = para o Japão; いきます = vou.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "駅まで 自転車で いきます。 (Vou à estação de ônibus./Vou à estação de carro./Vou à estação de bicicleta./Vou à estação a pé.)", correctAnswer: "Vou à estação de bicicleta.", rationale: "駅まで = até a estação; 自転車で = de bicicleta; いきます = vou.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "新幹線は はやいです。 (O trem-bala é lento./O trem-bala é perigoso./O trem-bala é rápido./O trem-bala é caro.)", correctAnswer: "O trem-bala é rápido.", rationale: "新幹線は = o trem-bala; はやいです = é rápido.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "地下鉄と バスを つかいます。 (Uso trem e táxi./Uso metrô e ônibus./Uso carro e ônibus./Uso metrô e táxi.)", correctAnswer: "Uso metrô e ônibus.", rationale: "地下鉄 = metrô; バス = ônibus; つかいます = uso.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "タクシーで ホテルに いきました。 (Fui ao hotel de ônibus./Fui ao hotel de metrô./Fui ao hotel de táxi./Fui ao hotel de trem.)", correctAnswer: "Fui ao hotel de táxi.", rationale: "タクシーで = de táxi; ホテルに = para o hotel; いきました = fui.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "駅の 近くに 住んでいます。 (Moro longe da estação./Moro perto da estação./Trabalho perto da estação./Estudo perto da estação.)", correctAnswer: "Moro perto da estação.", rationale: "駅の 近く = perto da estação; 住んでいます = moro.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "船で 島に いきます。 (Vou à ilha de avião./Vou à ilha de barco./Vou à ilha de trem./Vou à ilha de ônibus.)", correctAnswer: "Vou à ilha de barco.", rationale: "船で = de barco; 島に = para a ilha; いきます = vou.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "自動車を うんてんします。 (Piloto uma moto./Dirijo um carro./Piloto um avião./Dirijo um ônibus.)", correctAnswer: "Dirijo um carro.", rationale: "自動車を = carro (objeto); うんてんします = dirijo.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "東京の 地下鉄は 便利です。 (O metrô de Tóquio é inconveniente./O metrô de Tóquio é lento./O metrô de Tóquio é conveniente./O trem de Tóquio é conveniente.)", correctAnswer: "O metrô de Tóquio é conveniente.", rationale: "東京の 地下鉄 = metrô de Tóquio; 便利です = é conveniente.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
