title: 📚 Vocabulário — objetos da escola
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Vocabulário N5 da escola: objetos do dia a dia do aluno japonês, com kanji simples."
example: "Objetos da escola em japonês. Ex.: 本 → livro, 鉛筆 → lápis, 先生 → professor."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Objetos escolares — reconhecimento
    description: Leia a palavra e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "本 (jornal/caderno/livro/revista)", correctAnswer: "livro", rationale: "本 → ほん → livro. Kanji N5 muito comum.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "鉛筆 (caneta/borracha/lápis/régua)", correctAnswer: "lápis", rationale: "鉛筆 → えんぴつ → lápis. 鉛 → chumbo + 筆 → pincel.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ノート (régua/borracha/caderno/livro)", correctAnswer: "caderno", rationale: "ノート vem do inglês 'notebook' e significa caderno.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "消しゴム (cola/lápis/borracha/apontador)", correctAnswer: "borracha", rationale: "消しゴム → けしごむ → borracha de apagar. 消し → apagar + ゴム → goma.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かばん (régua/mochila/estojo/caderno)", correctAnswer: "mochila", rationale: "かばん → mochila / bolsa. Palavra comum para bolsa escolar.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "先生 (aluno/professor/diretor/secretária)", correctAnswer: "professor", rationale: "先生 → せんせい → professor. 先 → antes + 生 → nascer → 'quem nasceu antes'.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "学生 (professor/estudante/diretor/funcionário)", correctAnswer: "estudante", rationale: "学生 → がくせい → estudante. 学 → estudo + 生 → pessoa.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "教室 (biblioteca/sala de aula/laboratório/ginásio)", correctAnswer: "sala de aula", rationale: "教室 → きょうしつ → sala de aula. 教 → ensinar + 室 → cômodo.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "黒板 (mesa/quadro negro/janela/porta)", correctAnswer: "quadro negro", rationale: "黒板 → こくばん → quadro negro. 黒 → preto + 板 → tábua.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "机 (cadeira/lousa/mesa/estante)", correctAnswer: "mesa", rationale: "机 → つくえ → mesa (de estudo/trabalho).", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Objetos escolares em frases
    description: Leia a frase e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "鉛筆で かきます。 (Escrevo com caneta./Escrevo com lápis./Desenho com pincel./Escrevo com giz.)", correctAnswer: "Escrevo com lápis.", rationale: "鉛筆で → com lápis; かきます → escrevo.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "先生に 本を もらいました。 (Dei um livro ao professor./Comprei um livro para o professor./Ganhei um livro do professor./Emprestei um livro ao professor.)", correctAnswer: "Ganhei um livro do professor.", rationale: "先生に → do professor; 本 → livro; もらいました → recebi/ganhei.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "教室に 机が あります。 (Na sala de aula tem cadeiras./Na sala de aula tem mesas./Na biblioteca tem mesas./No ginásio tem mesas.)", correctAnswer: "Na sala de aula tem mesas.", rationale: "教室に → na sala de aula; 机が → mesa (sujeito); あります → tem.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ノートに かきます。 (Escrevo no livro./Escrevo no caderno./Escrevo no quadro./Leio no caderno.)", correctAnswer: "Escrevo no caderno.", rationale: "ノートに → no caderno; かきます → escrevo.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かばんの 中に 本が あります。 (Tem livro em cima da mochila./Tem livro dentro da mochila./Tem caderno dentro da mochila./Tem lápis dentro da mochila.)", correctAnswer: "Tem livro dentro da mochila.", rationale: "かばんの 中 → dentro da mochila; 本が → livro; あります → tem.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "学生が 教室に います。 (Os professores estão na sala./Os estudantes estão na sala./Os estudantes estão no ginásio./Os funcionários estão na sala.)", correctAnswer: "Os estudantes estão na sala.", rationale: "学生が → estudantes; 教室に → na sala de aula; います → estão.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "消しゴムで けします。 (Apago com borracha./Escrevo com borracha./Corto com borracha./Colo com borracha.)", correctAnswer: "Apago com borracha.", rationale: "消しゴムで → com borracha; けします → apago.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "先生は 黒板に かきます。 (O aluno escreve no caderno./O professor escreve no quadro./O professor lê no livro./O aluno escreve no quadro.)", correctAnswer: "O professor escreve no quadro.", rationale: "先生は → o professor; 黒板に → no quadro; かきます → escreve.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "この 本は 日本語です。 (Este livro é em inglês./Este livro é em japonês./Este caderno é em japonês./Esta revista é em japonês.)", correctAnswer: "Este livro é em japonês.", rationale: "この 本 → este livro; 日本語です → é em japonês.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "大学の 図書館に 本が たくさん あります。 (Na biblioteca da escola há poucos livros./Na biblioteca da universidade há muitos livros./Na livraria há muitos livros./Na biblioteca da escola há muitos cadernos.)", correctAnswer: "Na biblioteca da universidade há muitos livros.", rationale: "大学の 図書館 → biblioteca da universidade; 本が たくさん → muitos livros; あります → há.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
