title: ✍️ Kanji — 日 月 火 水 木 金 土 (dias da semana)
level: '1A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Primeiros kanji: os sete dias da semana. Cada kanji representa um elemento natural."
example: "Os dias da semana em japonês usam kanji de elementos. Ex.: 月曜日 → segunda-feira (dia da Lua)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Kanji dos dias — reconhecimento
    description: Leia o kanji e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "日 (fogo/sol/água/lua)", correctAnswer: "sol", rationale: "日 significa sol / dia. Em 日曜日 (domingo) e にほん (日本 → Japão).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "月 (terra/fogo/lua/vento)", correctAnswer: "lua", rationale: "月 significa lua / mês. Em 月曜日 (segunda-feira) e つき (lua).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "火 (água/fogo/madeira/terra)", correctAnswer: "fogo", rationale: "火 significa fogo. Em 火曜日 (terça-feira) e ひ / か (fogo).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "水 (fogo/terra/metal/água)", correctAnswer: "água", rationale: "水 significa água. Em 水曜日 (quarta-feira) e みず (água).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "木 (pedra/árvore/fogo/vento)", correctAnswer: "árvore", rationale: "木 significa árvore / madeira. Em 木曜日 (quinta-feira) e き (árvore).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "金 (prata/cobre/ouro/ferro)", correctAnswer: "ouro", rationale: "金 significa ouro / metal / dinheiro. Em 金曜日 (sexta-feira) e おかね (dinheiro).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "土 (pedra/vento/terra/água)", correctAnswer: "terra", rationale: "土 significa terra / solo. Em 土曜日 (sábado) e つち (terra).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "月曜日 (domingo/segunda-feira/terça-feira/sábado)", correctAnswer: "segunda-feira", rationale: "月曜日 → dia da Lua → segunda-feira. 月 → lua.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "水曜日 (terça-feira/quinta-feira/quarta-feira/sexta-feira)", correctAnswer: "quarta-feira", rationale: "水曜日 → dia da Água → quarta-feira. 水 → água.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "金曜日 (quarta-feira/quinta-feira/sábado/sexta-feira)", correctAnswer: "sexta-feira", rationale: "金曜日 → dia do Ouro → sexta-feira. 金 → metal/ouro.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Dias da semana completos
    description: Leia e escolha o dia da semana correto.
    exercises:
      - { type: japanese_vocab, question: "日曜日 (segunda-feira/sábado/domingo/sexta-feira)", correctAnswer: "domingo", rationale: "日曜日 → dia do Sol → domingo. 日 → sol.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "火曜日 (segunda-feira/terça-feira/quarta-feira/quinta-feira)", correctAnswer: "terça-feira", rationale: "火曜日 → dia do Fogo → terça-feira. 火 → fogo.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "木曜日 (quarta-feira/terça-feira/quinta-feira/sexta-feira)", correctAnswer: "quinta-feira", rationale: "木曜日 → dia da Árvore → quinta-feira. 木 → árvore.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "土曜日 (domingo/sexta-feira/segunda-feira/sábado)", correctAnswer: "sábado", rationale: "土曜日 → dia da Terra → sábado. 土 → terra.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きょうは 火曜日です。 (Hoje é segunda-feira./Hoje é quarta-feira./Hoje é terça-feira./Hoje é quinta-feira.)", correctAnswer: "Hoje é terça-feira.", rationale: "きょうは → hoje; 火曜日 → terça-feira; です → é.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あしたは 水曜日です。 (Amanhã é terça-feira./Amanhã é quarta-feira./Amanhã é quinta-feira./Amanhã é sexta-feira.)", correctAnswer: "Amanhã é quarta-feira.", rationale: "あしたは → amanhã; 水曜日 → quarta-feira; です → é.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "土曜日と 日曜日は やすみです。 (Sábado e domingo são dias de trabalho./Sexta e sábado são feriados./Sábado e domingo são dias de descanso./Segunda e domingo são feriados.)", correctAnswer: "Sábado e domingo são dias de descanso.", rationale: "土曜日 → sábado; 日曜日 → domingo; やすみ → descanso / folga.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "月曜日から 金曜日まで しごとです。 (Trabalho de segunda a sexta./Trabalho de terça a sábado./Trabalho de domingo a quinta./Trabalho de segunda a sábado.)", correctAnswer: "Trabalho de segunda a sexta.", rationale: "月曜日 → segunda; から → de; 金曜日 → sexta; まで → até; しごと → trabalho.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "木曜日に テニスを します。 (Jogo tênis na quarta./Jogo tênis na quinta./Jogo tênis na sexta./Jogo tênis no sábado.)", correctAnswer: "Jogo tênis na quinta.", rationale: "木曜日 → quinta-feira; に → em (tempo); テニス → tênis; します → faço.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日曜日は かぞくと でかけます。 (No domingo saio com a família./Na sexta saio com a família./No sábado saio sozinho./Na segunda saio com a família.)", correctAnswer: "No domingo saio com a família.", rationale: "日曜日 → domingo; かぞく → família; でかけます → saio.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
