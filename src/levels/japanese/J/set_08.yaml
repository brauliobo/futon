title: 📝 ～に際して / ～にあたって (na ocasião de)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～に際して e ～にあたって indicam que uma ação é realizada numa ocasião especial ou importante. に際して é mais formal/escrito; にあたって é levemente mais coloquial. Ambos são N2."
example: "入学に際してご挨拶申し上げます。 Ex.: ～に際して → 'na ocasião de / por ocasião de'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～に際して / ～にあたって
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "卒業に際して (depois da formatura/durante a formatura/por ocasião da formatura/antes da formatura)", correctAnswer: "por ocasião da formatura", rationale: "に際して → 'por ocasião de / na ocasião de'. Usado para momentos especiais e formais.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新年を迎えるにあたって (no dia a dia do ano novo/por ocasião de receber o ano novo/depois de receber o ano novo/sem relação com o ano novo)", correctAnswer: "por ocasião de receber o ano novo", rationale: "にあたって → 'na ocasião de / por motivo de'. 新年を迎えるにあたって → ao receber o ano novo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際して vs にあたって (に際して é mais coloquial; にあたって é mais formal/に際して é mais formal; にあたって é levemente mais comum na fala/são completamente idênticos em todos os usos/nenhum dos dois é N2)", correctAnswer: "に際して é mais formal; にあたって é levemente mais comum na fala", rationale: "に際して é mais restrito a textos formais e escritos. にあたって também aparece em discursos formais mas com uso levemente mais amplo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "就任に際して挨拶をした。 (Depois de assumir o cargo, fez um discurso./Por ocasião de assumir o cargo, fez um discurso./Antes de assumir o cargo, fez um discurso./Apesar de assumir o cargo, fez um discurso.)", correctAnswer: "Por ocasião de assumir o cargo, fez um discurso.", rationale: "就任に際して → por ocasião da posse/assumir o cargo. Formalidade típica de cargos.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試験を受けるにあたって心構えが必要だ。 (Depois de fazer a prova, atitude mental é necessária./Por ocasião de fazer a prova, preparação mental é necessária./Durante a prova, atitude mental é necessária./Apesar da prova, atitude mental é necessária.)", correctAnswer: "Por ocasião de fazer a prova, preparação mental é necessária.", rationale: "試験を受けるにあたって → por ocasião de / ao fazer a prova. Preparação prévia ao evento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "留学に際して必要な手続き (procedimentos depois do intercâmbio/procedimentos necessários por ocasião do intercâmbio/procedimentos durante o intercâmbio/procedimentos sem relação com o intercâmbio)", correctAnswer: "procedimentos necessários por ocasião do intercâmbio", rationale: "留学に際して → por ocasião do intercâmbio. Procedimentos formais necessários para realizar o intercâmbio.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際して e にあたって normalmente implicam (ações rotineiras/ações numa ocasião especial/ações no passado distante/ações impossíveis)", correctAnswer: "ações numa ocasião especial", rationale: "Ambos destacam que a ação ocorre em um momento especial, importante ou significativo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "改正するにあたって専門家の意見を聞いた。 (Depois de revisar, ouviram especialistas./Por ocasião de revisar, ouviram a opinião de especialistas./Durante a revisão, ouviram especialistas./Apesar da revisão, ouviram especialistas.)", correctAnswer: "Por ocasião de revisar, ouviram a opinião de especialistas.", rationale: "改正するにあたって → ao revisar / por ocasião da revisão. Consulta prévia a especialistas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "結婚に際して両家が顔合わせをした。 (Depois do casamento, as famílias se conheceram./Por ocasião do casamento, as duas famílias se encontraram./Durante o casamento, as famílias se conheceram./Antes do casamento, sem relação com o evento.", correctAnswer: "Por ocasião do casamento, as duas famílias se encontraram.", rationale: "結婚に際して → por ocasião do casamento. Encontro formal das famílias para o casamento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際して pode seguir (apenas substantivos/apenas verbos/substantivos e verbos na forma de dicionário/apenas adjetivos)", correctAnswer: "substantivos e verbos na forma de dicionário", rationale: "に際して segue substantivos (卒業に際して) e verbos na forma de dicionário (行うに際して).", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Uso contrastivo e frases formais
    description: Escolha a tradução correta da frase formal.
    exercises:
      - { type: japanese_vocab, question: "開会に際しまして一言ご挨拶申し上げます。 (Depois da abertura, permita-me dizer algumas palavras./Por ocasião da abertura, permita-me dizer algumas palavras./Durante a abertura, permita-me falar./Apesar da abertura, vou falar.)", correctAnswer: "Por ocasião da abertura, permita-me dizer algumas palavras.", rationale: "に際しまして é a forma polida de に際して. Expressão formal de início de discurso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "海外進出するにあたって市場調査をした。 (Depois de entrar no mercado externo, fizeram pesquisa de mercado./Por ocasião de entrar no mercado externo, realizaram pesquisa de mercado./Durante a expansão, fizeram pesquisa./Apesar da expansão, fizeram pesquisa.)", correctAnswer: "Por ocasião de entrar no mercado externo, realizaram pesquisa de mercado.", rationale: "海外進出するにあたって → ao expandir para o exterior. Pesquisa como preparação para o evento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際して vs の時 (に際して é mais formal e para eventos especiais; の時 é geral/の時 é mais formal/são completamente iguais/に際して é mais coloquial)", correctAnswer: "に際して é mais formal e para eventos especiais; の時 é geral", rationale: "の時 é neutro e pode ser usado em qualquer situação. に際して reserva-se para situações formais e especiais.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "採用するにあたり慎重な審査が必要だ。 (Depois de contratar, revisão cuidadosa é necessária./Por ocasião de contratar, avaliação cuidadosa é necessária./Durante a contratação, revisão é necessária./Apesar da contratação, avaliação é necessária.)", correctAnswer: "Por ocasião de contratar, avaliação cuidadosa é necessária.", rationale: "採用するにあたり → ao contratar (forma formal にあたり). Avaliação rigorosa antes de efetuar a contratação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来日に際して大使館でビザを取得した。 (Depois de vir ao Japão, obteve visto na embaixada./Por ocasião de vir ao Japão, obteve o visto na embaixada./Durante a visita ao Japão, obteve o visto./Apesar de vir ao Japão, obteve o visto.)", correctAnswer: "Por ocasião de vir ao Japão, obteve o visto na embaixada.", rationale: "来日に際して → por ocasião de vir ao Japão. Procedimento necessário antes da viagem.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国際会議の開催にあたって準備委員会が設置された。 (Depois do congresso internacional, um comitê foi criado./Por ocasião de realizar o congresso internacional, um comitê preparatório foi criado./Durante o congresso, o comitê foi criado./Apesar do congresso, o comitê foi criado.)", correctAnswer: "Por ocasião de realizar o congresso internacional, um comitê preparatório foi criado.", rationale: "開催にあたって → por ocasião de realizar. Comitê criado para preparar o evento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "契約締結に際して双方が弁護士を立てた。 (Depois de assinar o contrato, ambos contrataram advogados./Por ocasião de assinar o contrato, ambos os lados contrataram advogados./Durante a assinatura, advogados foram contratados./Apesar do contrato, advogados foram contratados.)", correctAnswer: "Por ocasião de assinar o contrato, ambos os lados contrataram advogados.", rationale: "契約締結に際して → por ocasião de assinar o contrato. Procedimento jurídico formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "入社にあたって事前研修を受けた。 (Depois de entrar na empresa, recebeu treinamento prévio./Por ocasião de entrar na empresa, recebeu treinamento prévio./Durante a entrada na empresa, recebeu treinamento./Apesar de entrar, recebeu treinamento.)", correctAnswer: "Por ocasião de entrar na empresa, recebeu treinamento prévio.", rationale: "入社にあたって → por ocasião de entrar na empresa. Treinamento realizado antes ou no momento da contratação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に際して implica que a ação principal é (rotineira/uma vez e em contexto especial/repetitiva/imaginária)", correctAnswer: "uma vez e em contexto especial", rationale: "に際して ressalta o caráter único e especial do momento, adequado para eventos que ocorrem poucas vezes.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "退職に際して同僚に感謝の言葉を述べた。 (Depois de se aposentar, agradeceu aos colegas./Por ocasião de se aposentar, expressou gratidão aos colegas./Durante a aposentadoria, agradeceu./Antes de se aposentar, sem evento especial.)", correctAnswer: "Por ocasião de se aposentar, expressou gratidão aos colegas.", rationale: "退職に際して → por ocasião da aposentadoria/demissão. Ato formal de gratidão no momento especial.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
