title: 📝 ～にすぎない vs ～に他ならない (contraste)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "にすぎない minimiza: 'é apenas X / não passa de X'. にほかならない enfatiza identidade: 'é justamente X / não é outro que X'. Contraste fundamental N2."
example: "これは意見にすぎない vs これは事実にほかならない。 Ex.: にすぎない = minimiza; にほかならない = enfatiza."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Contraste entre ～にすぎない e ～にほかならない
    description: Escolha a expressão correta para o contexto.
    exercises:
      - { type: japanese_vocab, question: "これは仮説___、証明されていない。 (にほかならない/にすぎない/に反して/に従って)", correctAnswer: "にすぎない", rationale: "仮説にすぎない → é apenas uma hipótese. にすぎない minimiza — não é mais que uma hipótese, não está provado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この悲劇は人間の欲望___。 (にすぎない/にほかならない/をきっかけに/に際して)", correctAnswer: "にほかならない", rationale: "人間の欲望にほかならない → é justamente a ganância humana. Afirmação enfática da causa real.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にすぎない indica (ênfase no valor real/minimização: é apenas isso/negação total/dúvida)", correctAnswer: "minimização: é apenas isso", rationale: "にすぎない → 'não é mais do que / é apenas'. Diminui a importância ou extensão de algo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "にほかならない indica (minimização/dúvida/afirmação enfática de identidade/negação)", correctAnswer: "afirmação enfática de identidade", rationale: "にほかならない → 'é justamente / não é outro que'. Enfatiza que é exatamente isso, sem alternativa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の謝罪は形式___、本心ではない。 (にほかならない/にすぎない/を問わず/に先立って)", correctAnswer: "にすぎない", rationale: "形式にすぎない → é apenas uma formalidade. にすぎない minimiza: o pedido de desculpas não tem sinceridade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "人類の平和への願いは普遍的な価値___。 (にすぎない/にほかならない/に際して/を余儀なくされる)", correctAnswer: "にほかならない", rationale: "普遍的な価値にほかならない → é justamente um valor universal. Afirmação forte sobre a natureza do desejo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "私はただの学生___、専門家ではない。 (にほかならない/にすぎない/に反して/に伴って)", correctAnswer: "にすぎない", rationale: "ただの学生にすぎない → é apenas um estudante. にすぎない + ただ reforça a humildade ou minimização.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この勝利は全員の団結___。 (にすぎない/にほかならない/をはじめとして/に従って)", correctAnswer: "にほかならない", rationale: "全員の団結にほかならない → é justamente a união de todos. Atribui a causa de forma enfática.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "それは偶然___。深い意味はない。 (にほかならない/にすぎない/に至っては/の末に)", correctAnswer: "にすぎない", rationale: "偶然にすぎない → é apenas coincidência. にすぎない descarta qualquer significado maior.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "差別のない社会こそが真の民主主義___。 (にすぎない/にほかならない/を問わず/に際して)", correctAnswer: "にほかならない", rationale: "真の民主主義にほかならない → é justamente a verdadeira democracia. こそ reforça a ênfase.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Distinção em contexto formal
    description: Escolha a tradução que reflete corretamente にすぎない ou にほかならない.
    exercises:
      - { type: japanese_vocab, question: "彼の発言は憶測にすぎない。 (A declaração dele é justamente especulação/A declaração dele é apenas especulação./A declaração dele não é especulação./A declaração é uma prova sólida.)", correctAnswer: "A declaração dele é apenas especulação.", rationale: "憶測にすぎない → é apenas especulação. Minimiza: não tem base factual, é apenas suposição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題の本質は不平等にほかならない。 (A essência deste problema é talvez a desigualdade./A essência deste problema é justamente a desigualdade./A desigualdade não é a essência do problema./A essência do problema é outra coisa.)", correctAnswer: "A essência deste problema é justamente a desigualdade.", rationale: "不平等にほかならない → é exatamente a desigualdade. Identifica a essência de forma categórica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "それは一時的な解決策にすぎない。 (É justamente uma solução temporária./É apenas uma solução temporária./É uma solução permanente./Não é uma solução.", correctAnswer: "É apenas uma solução temporária.", rationale: "一時的な解決策にすぎない → é apenas uma solução temporária. Não resolve o problema fundamental.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "戦争の原因は権力者の野心にほかならない。 (A causa da guerra pode ser a ambição dos poderosos./A causa da guerra é justamente a ambição dos poderosos./Os poderosos não têm relação com a guerra./A guerra não tem causa definida.)", correctAnswer: "A causa da guerra é justamente a ambição dos poderosos.", rationale: "権力者の野心にほかならない → é exatamente a ambição dos poderosos. Julgamento histórico enfático.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は名ばかりの管理職にすぎない。 (Ele é justamente um gerente de nome./Ele é apenas um gerente de nome (sem poder real)./Ele é um gerente muito poderoso./Ele não é gerente.)", correctAnswer: "Ele é apenas um gerente de nome (sem poder real).", rationale: "名ばかりの管理職にすぎない → é apenas um gerente de nome. にすぎない minimiza: título sem substância.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "科学の進歩は人類への贈り物にほかならない。 (O progresso científico pode ser presente para a humanidade./O progresso científico é justamente um presente para a humanidade./O progresso científico é prejudicial./A ciência não traz benefícios.", correctAnswer: "O progresso científico é justamente um presente para a humanidade.", rationale: "人類への贈り物にほかならない → é justamente um presente para a humanidade. Afirmação de valor.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あれは子供だましにすぎない方法だ。 (É um método que é justamente enganação infantil./É apenas um método de enganação infantil./É um método muito sofisticado./É um método confiável.)", correctAnswer: "É apenas um método de enganação infantil.", rationale: "子供だましにすぎない → é apenas enganação de criança (método simplório/ineficaz). にすぎない minimiza.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "知識の習得こそ自由への道にほかならない。 (A aquisição de conhecimento pode ser o caminho para a liberdade./A aquisição de conhecimento é justamente o caminho para a liberdade./O conhecimento não leva à liberdade./A liberdade não requer conhecimento.)", correctAnswer: "A aquisição de conhecimento é justamente o caminho para a liberdade.", rationale: "自由への道にほかならない → é justamente o caminho para a liberdade. こそ + にほかならない → máxima ênfase.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の批判はただの嫉妬にすぎない。 (A crítica dele é justamente ciúme./A crítica dele é apenas ciúme./A crítica dele é construtiva./A crítica não tem motivação.)", correctAnswer: "A crítica dele é apenas ciúme.", rationale: "ただの嫉妬にすぎない → é apenas ciúme. ただ + にすぎない reforça a minimização: motivação pequena e mesquinha.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "両者の違いは表面的なものにすぎない。 (As diferenças entre os dois são justamente superficiais./As diferenças entre os dois são apenas superficiais./As diferenças entre os dois são profundas./As diferenças não existem.)", correctAnswer: "As diferenças entre os dois são apenas superficiais.", rationale: "表面的なものにすぎない → é apenas algo superficial. にすぎない indica que as diferenças não são fundamentais.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
