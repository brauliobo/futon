title: 🔢 Kanji N2 — 経済発展 (economia e desenvolvimento)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N2 de economia e desenvolvimento: 経、済、発、展、投、資、産、業、貿、易. Fundamentais para leitura de textos econômicos e jornalísticos."
example: "経済発展 (けいざいはってん) = desenvolvimento econômico. Ex.: 経済発展 → kanji econômico N2."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Leitura de kanji econômicos
    description: Escolha a leitura ou o significado correto.
    exercises:
      - { type: japanese_vocab, question: "経済 (けいざい/きょうざい/きんざい/けいせい)", correctAnswer: "けいざい", rationale: "経済 (けいざい) = economia. 経 (けい) = administrar/curso; 済 (ざい) = ajudar/resolver.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "投資 (とうし/とうじ/どうし/どうじ)", correctAnswer: "とうし", rationale: "投資 (とうし) = investimento. 投 (とう) = lançar/investir; 資 (し) = recursos/capital.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "産業 (さんぎょう/しんぎょう/さんこう/せいぎょう)", correctAnswer: "さんぎょう", rationale: "産業 (さんぎょう) = indústria. 産 (さん) = produzir; 業 (ぎょう) = atividade/negócio.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "貿易 (ぼうえき/ぼうき/もうえき/ぼうやく)", correctAnswer: "ぼうえき", rationale: "貿易 (ぼうえき) = comércio exterior. 貿 (ぼう) = trocar; 易 (えき) = trocar/fácil.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "発展 (はってん/はっせん/はつてん/はったつ)", correctAnswer: "はってん", rationale: "発展 (はってん) = desenvolvimento/expansão. 発 (はつ/はっ) = disparar/desenvolver; 展 (てん) = estender.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "輸出 (ゆしゅつ/ゆにゅう/ゆそう/しゅつにゅう)", correctAnswer: "ゆしゅつ", rationale: "輸出 (ゆしゅつ) = exportação. 輸 (ゆ) = transportar; 出 (しゅつ) = sair. Oposto: 輸入 (ゆにゅう) = importação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "成長 (せいちょう/せいじょう/なりちょう/なりじょう)", correctAnswer: "せいちょう", rationale: "成長 (せいちょう) = crescimento. 成 (せい) = completar/tornar-se; 長 (ちょう) = crescer/longo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "消費 (しょうひ/しょうひょう/そうひ/しょうふ)", correctAnswer: "しょうひ", rationale: "消費 (しょうひ) = consumo. 消 (しょう) = extinguir/gastar; 費 (ひ) = despesa/gastar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "企業 (きぎょう/きこう/きごう/きぎょ)", correctAnswer: "きぎょう", rationale: "企業 (きぎょう) = empresa. 企 (き) = planejar; 業 (ぎょう) = negócio/atividade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "収益 (しゅうえき/しゅうやく/じゅうえき/しゅうぎ)", correctAnswer: "しゅうえき", rationale: "収益 (しゅうえき) = lucro/rendimento. 収 (しゅう) = arrecadar; 益 (えき) = benefício/lucro.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Vocabulário econômico em contexto
    description: Escolha o significado correto do termo ou frase.
    exercises:
      - { type: japanese_vocab, question: "株式市場 (かぶしきしじょう) significa (mercado imobiliário/mercado de ações/mercado de câmbio/mercado agrícola)", correctAnswer: "mercado de ações", rationale: "株式市場 = mercado de ações. 株式 (かぶしき) = ações; 市場 (しじょう) = mercado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "物価上昇 (ぶっかじょうしょう) significa (queda de preços/aumento de preços/estabilidade de preços/deflação)", correctAnswer: "aumento de preços", rationale: "物価上昇 = inflação/aumento do nível de preços. 物価 = nível de preços; 上昇 = aumento/alta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国内総生産 (こくないそうせいさん) é a sigla em japonês de (PIB/PNB/IPC/CDI)", correctAnswer: "PIB", rationale: "国内総生産 = PIB (Produto Interno Bruto). 国内 = interno; 総 = total; 生産 = produção.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "雇用創出 (こようそうしゅつ) significa (extinção de empregos/geração de empregos/regulamentação de empregos/estatística de empregos)", correctAnswer: "geração de empregos", rationale: "雇用創出 = criação de empregos. 雇用 = emprego; 創出 = criar/gerar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "外国直接投資 (がいこくちょくせつとうし) significa (empréstimo estrangeiro/investimento direto estrangeiro/ajuda humanitária/imposto sobre importação)", correctAnswer: "investimento direto estrangeiro", rationale: "外国直接投資 = IED (Investimento Direto Estrangeiro). 外国 = estrangeiro; 直接 = direto; 投資 = investimento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "財政出動 (ざいせいしゅつどう) significa (corte de gastos públicos/expansão fiscal/privatização/austeridade fiscal)", correctAnswer: "expansão fiscal", rationale: "財政出動 = expansão fiscal / estímulo fiscal. 財政 = finanças públicas; 出動 = mobilizar/agir.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "為替レート (かわせレート) significa (taxa de juros/taxa de câmbio/taxa de inflação/taxa de desemprego)", correctAnswer: "taxa de câmbio", rationale: "為替レート = taxa de câmbio. 為替 (かわせ) = câmbio/remessa; レート = rate (taxa).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "労働生産性 (ろうどうせいさんせい) significa (taxa de emprego/produtividade do trabalho/custo de mão de obra/jornada de trabalho)", correctAnswer: "produtividade do trabalho", rationale: "労働生産性 = produtividade do trabalho. 労働 = trabalho; 生産性 = produtividade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "需要と供給 (じゅようときょうきゅう) significa (exportação e importação/oferta e demanda/lucro e prejuízo/receita e despesa)", correctAnswer: "oferta e demanda", rationale: "需要と供給 = demanda e oferta. 需要 (じゅよう) = demanda; 供給 (きょうきゅう) = oferta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経済制裁 (けいざいせいさい) significa (cooperação econômica/sanção econômica/parceria econômica/ajuda econômica)", correctAnswer: "sanção econômica", rationale: "経済制裁 = sanção econômica. 制裁 (せいさい) = punição/sanção. Medida usada em política internacional.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
