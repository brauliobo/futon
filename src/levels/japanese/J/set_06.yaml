title: 🔢 Kanji N2 — 法律政策 (direito e política)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N2 de direito e política: 法、律、政、策、権、義、務、制、憲、裁. Essenciais para leitura de textos jornalísticos e acadêmicos."
example: "法律 (ほうりつ) = lei. Ex.: 法律政策 → kanji do campo jurídico e político."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Leitura de kanji jurídico-políticos
    description: Escolha a leitura ou o significado correto.
    exercises:
      - { type: japanese_vocab, question: "法律 (ほうりつ/ほうそく/ほうどう/ほうがく)", correctAnswer: "ほうりつ", rationale: "法律 (ほうりつ) = lei. 法 (ほう) = lei/método; 律 (りつ) = regra/lei.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "政策 (せいかく/せいさく/せいてい/せいど)", correctAnswer: "せいさく", rationale: "政策 (せいさく) = política/estratégia governamental. 政 (せい/まつりごと) = governo; 策 (さく) = plano/estratégia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "権利 (けんり/きょうり/けんりょく/けんこう)", correctAnswer: "けんり", rationale: "権利 (けんり) = direito (legal). 権 (けん) = poder/direito; 利 (り) = benefício.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "義務 (きむ/ぎむ/ぎよう/きよう)", correctAnswer: "ぎむ", rationale: "義務 (ぎむ) = obrigação/dever. 義 (ぎ) = dever/justiça; 務 (む) = serviço/obrigação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "憲法 (けんぽう/ほうりつ/けいほう/けいほん)", correctAnswer: "けんぽう", rationale: "憲法 (けんぽう) = constituição. 憲 (けん) = constituição/lei fundamental; 法 (ほう/ぽう) = lei.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "裁判 (さいばん/さいはん/さいてい/さいかん)", correctAnswer: "さいばん", rationale: "裁判 (さいばん) = julgamento/tribunal. 裁 (さい) = julgar; 判 (ばん/はん) = veredicto/julgamento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "制度 (せいど/きそ/せいさく/せいふ)", correctAnswer: "せいど", rationale: "制度 (せいど) = sistema/regime. 制 (せい) = controle/sistema; 度 (ど) = grau/sistema.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "条約 (じょうやく/じょうほう/ようやく/じょうれい)", correctAnswer: "じょうやく", rationale: "条約 (じょうやく) = tratado internacional. 条 (じょう) = artigo/cláusula; 約 (やく) = acordo/promessa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "議会 (ぎかい/ぎいん/かいぎ/ぎじかい)", correctAnswer: "ぎかい", rationale: "議会 (ぎかい) = parlamento/assembleia. 議 (ぎ) = discussão/deliberação; 会 (かい) = reunião.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "判決 (はんけつ/さいばん/はんだん/けつろん)", correctAnswer: "はんけつ", rationale: "判決 (はんけつ) = sentença/veredicto judicial. 判 (はん) = julgamento; 決 (けつ) = decisão.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Vocabulário jurídico-político em contexto
    description: Escolha o significado correto do termo ou frase.
    exercises:
      - { type: japanese_vocab, question: "法の下の平等 (desigualdade perante a lei/igualdade perante a lei/liberdade acima da lei/lei acima da igualdade)", correctAnswer: "igualdade perante a lei", rationale: "法の下の平等 = igualdade perante a lei. 法の下 (もとの) = sob a lei; 平等 (びょうどう) = igualdade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "立法 (りっぽう) significa (executar a lei/criar leis/julgar pela lei/fiscalizar a lei)", correctAnswer: "criar leis", rationale: "立法 (りっぽう) = legislação. 立 (りつ/た) = estabelecer; 法 (ほう) = lei. Poder Legislativo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "司法 (しほう) significa (poder executivo/poder legislativo/poder judiciário/poder constituinte)", correctAnswer: "poder judiciário", rationale: "司法 (しほう) = poder judiciário. 司 (し) = administrar/gerenciar; 法 (ほう) = lei.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "違憲 (いけん) significa (conforme a constituição/contrário à constituição/reforma constitucional/interpretação constitucional)", correctAnswer: "contrário à constituição", rationale: "違憲 (いけん) = inconstitucional. 違 (い) = violar/diferir; 憲 (けん) = constituição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "起訴 (きそ) significa (absolvição/indiciamento/apelação/sentença)", correctAnswer: "indiciamento", rationale: "起訴 (きそ) = indiciamento/acusação formal. 起 (き) = iniciar; 訴 (そ) = acusar/processar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "弁護士 (べんごし) significa (promotor/juiz/advogado/policial)", correctAnswer: "advogado", rationale: "弁護士 (べんごし) = advogado. 弁護 (べんご) = defesa; 士 (し) = profissional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "条例 (じょうれい) significa (tratado internacional/lei/regulamento local/constituição)", correctAnswer: "regulamento local", rationale: "条例 (じょうれい) = regulamento municipal/prefeitural. Norma de nível local no Japão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "批准 (ひじゅん) significa (rejeitar um tratado/ratificar um tratado/assinar um tratado/anular um tratado)", correctAnswer: "ratificar um tratado", rationale: "批准 (ひじゅん) = ratificação de tratado. Aprovação formal de acordo internacional pelo Estado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "内閣 (ないかく) significa (parlamento/partido político/gabinete ministerial/corte suprema)", correctAnswer: "gabinete ministerial", rationale: "内閣 (ないかく) = gabinete/conselho de ministros. Órgão executivo do governo japonês.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "選挙権 (せんきょけん) significa (direito de ser eleito/direito de votar/obrigação de votar/proibição de votar)", correctAnswer: "direito de votar", rationale: "選挙権 (せんきょけん) = direito de voto (sufrágio ativo). 選挙 (せんきょ) = eleição; 権 (けん) = direito.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
