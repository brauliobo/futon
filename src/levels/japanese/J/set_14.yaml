title: 📝 ～に至っては (quando se trata de / chegando ao ponto de)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～に至っては destaca um caso extremo dentro de uma série, geralmente negativo: 'chegando ao ponto de X, que é ainda pior'. Variante: に至るまで (até / chegando a). Não confundir com に至って (quando finalmente)."
example: "ひどい状況で、最悪の場合に至っては解散も考えられる。 Ex.: ～に至っては → 'chegando ao ponto de / quanto a (caso extremo)'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～に至っては
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "最悪の場合に至っては (no melhor dos casos/em casos medianos/chegando ao pior caso/independentemente do caso)", correctAnswer: "chegando ao pior caso", rationale: "に至っては → 'chegando ao ponto de / no caso extremo de'. Destaca o caso mais grave.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に至っては implica que o caso mencionado é (comum/representativo/o mais extremo da série/o melhor)", correctAnswer: "o mais extremo da série", rationale: "に至っては destaca um caso limite que é ainda mais extremo do que o contexto anterior.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "第一部の遅延もひどいが、第三部に至っては開催自体が危うい。 (O atraso da primeira parte é ruim, mas a terceira parte é perfeita./O atraso da primeira é ruim; chegando à terceira parte, a própria realização está em dúvida./A terceira parte está bem apesar do atraso./A terceira parte foi a mais rápida.)", correctAnswer: "O atraso da primeira é ruim; chegando à terceira parte, a própria realização está em dúvida.", rationale: "に至っては destaca que a terceira parte é o caso mais extremo: nem vai acontecer.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に至るまで vs に至っては (に至るまで = até X; に至っては = quando se fala do caso extremo de X/são idênticos/に至っては = até X; に至るまで = caso extremo/nenhuma diferença de uso)", correctAnswer: "に至るまで = até X; に至っては = quando se fala do caso extremo de X", rationale: "に至るまで → alcançando até X (abrangência). に至っては → chegando ao caso extremo de X (destaque negativo).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "普通のミスでも困るのに、に至っては (exprime um caso menos extremo/exprime um caso ainda mais extremo/não indica gradação/exprime um caso anterior)", correctAnswer: "exprime um caso ainda mais extremo", rationale: "に至っては é usado para introduzir um caso ainda pior do que o já mencionado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "多くの部署で問題が発生し、営業部に至っては業務が完全に停止した。 (Em muitos departamentos há problemas, mas o de vendas está perfeito./Em muitos departamentos há problemas; chegando ao departamento de vendas, as operações pararam completamente./Somente o departamento de vendas tinha problemas./O departamento de vendas resolveu todos os problemas.)", correctAnswer: "Em muitos departamentos há problemas; chegando ao departamento de vendas, as operações pararam completamente.", rationale: "営業部に至っては → chegando ao departamento de vendas (caso mais extremo). Situação ainda pior.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に至って (sem は) tem sentido diferente: (igual a に至っては/quando finalmente chegou ao ponto de — realização tardia/caso extremo positivo/antes de chegar ao ponto)", correctAnswer: "quando finalmente chegou ao ponto de — realização tardia", rationale: "に至って (sem は) → 'quando finalmente chegou a'. Ex: ここに至ってようやく理解した → só agora finalmente entendi.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "軽い症状ならともかく、重症に至っては入院が必要だ。 (Sintomas leves são ok, chegando a sintomas graves, há necessidade de hospitalização./Sintomas leves e graves são iguais./Sintomas graves não requerem hospitalização./Sintomas leves requerem hospitalização mais do que os graves.)", correctAnswer: "Sintomas leves são ok, chegando a sintomas graves, há necessidade de hospitalização.", rationale: "重症に至っては → chegando ao caso de sintomas graves. Caso extremo que exige medida mais severa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "予算の超過もさることながら、スケジュールに至っては全く見通しが立たない。 (Há superação do orçamento; no tocante ao cronograma, está completamente incerto./O orçamento e o cronograma estão perfeitos./Só o cronograma está bom, o orçamento não./O cronograma está melhor que o orçamento.)", correctAnswer: "Há superação do orçamento; no tocante ao cronograma, está completamente incerto.", rationale: "スケジュールに至っては → chegando ao cronograma (ainda mais extremo). に至っては destaca o pior aspecto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に至っては tipicamente ocorre em (no início de uma frase/depois de apresentar contexto negativo anterior/apenas em textos positivos/em perguntas)", correctAnswer: "depois de apresentar contexto negativo anterior", rationale: "に至っては funciona em gradação: primeiro se menciona uma situação ruim, depois com に至っては se apresenta o caso ainda pior.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases complexas com ～に至っては
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "他の社員も遅刻が多いが、彼に至っては毎日来ない日もある。 (Outros funcionários também se atrasam muito; chegando a ele, há dias em que nem aparece./Ele é o mais pontual de todos./Outros funcionários não se atrasam, mas ele sim./Ele se atrasa menos do que os outros.)", correctAnswer: "Outros funcionários também se atrasam muito; chegando a ele, há dias em que nem aparece.", rationale: "彼に至っては → chegando ao caso dele (caso mais extremo). Até falta ao trabalho, o que é ainda pior.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に至っては vs についていえば (に至っては destaca caso extremo; についていえば introduz comentário neutro/são idênticos/についていえば destaca caso extremo/に至っては é mais neutro)", correctAnswer: "に至っては destaca caso extremo; についていえば introduz comentário neutro", rationale: "についていえば → 'falando de / no que diz respeito a'. に至っては → 'chegando ao extremo caso de'. Funções distintas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "品質の低下も問題だが、安全性に至っては深刻な欠陥がある。 (A queda de qualidade é problema, mas em termos de segurança há falhas graves./Qualidade e segurança estão perfeitas./Segurança está melhor que qualidade./A queda de qualidade não é problema.)", correctAnswer: "A queda de qualidade é problema, mas em termos de segurança há falhas graves.", rationale: "安全性に至っては → chegando à questão da segurança (caso mais extremo e grave).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "勉強もしないのに、に至っては試験すら受けなかった。 (Não estudou, mas chegando ao extremo, não fez nem a prova./Estudou muito mas não fez a prova./Fez a prova mesmo sem estudar./Estudou pouco mas fez a prova.)", correctAnswer: "Não estudou, mas chegando ao extremo, não fez nem a prova.", rationale: "に至っては introduz um caso ainda mais extremo: além de não estudar, nem fez a prova.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に至っては expressa principalmente (gradação crescente em direção ao extremo/sequência temporal/condição de possibilidade/resultado positivo)", correctAnswer: "gradação crescente em direção ao extremo", rationale: "に至っては é marca de gradação: acumula situações ruins e destaca a mais extrema.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "インフラも老朽化しているが、橋に至っては崩落の危険がある。 (A infraestrutura está deteriorada, mas as pontes estão perfeitas./A infraestrutura está deteriorada; chegando às pontes, há risco de colapso./As pontes estão melhor que a infraestrutura em geral./A infraestrutura não tem problemas.)", correctAnswer: "A infraestrutura está deteriorada; chegando às pontes, há risco de colapso.", rationale: "橋に至っては → chegando às pontes (caso mais grave). O risco de colapso é o extremo da deterioração.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経済状況も厳しいが、雇用に至っては過去最悪の水準に達した。 (A situação econômica é difícil, mas o emprego atingiu o melhor nível histórico./A situação econômica é difícil; chegando ao emprego, atingiu o pior nível histórico./A situação econômica melhorou, mas o emprego piorou./Emprego e economia estão iguais.)", correctAnswer: "A situação econômica é difícil; chegando ao emprego, atingiu o pior nível histórico.", rationale: "雇用に至っては → chegando ao caso do emprego (extremo). 過去最悪 → pior nível histórico.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に至るまで (variante) é usado para (destacar caso extremo/indicar abrangência de X até Y/indicar causa/indicar tempo)", correctAnswer: "indicar abrangência de X até Y", rationale: "に至るまで → até (inclusive) X. Ex: 細部に至るまで確認する → verificar até os detalhes.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "各地で被害が出たが、南部地方に至っては壊滅的な打撃を受けた。 (Há danos em vários lugares, mas a região sul está ilesa./Há danos em vários lugares; chegando à região sul, sofreu danos devastadores./A região sul está melhor que as outras./Os danos foram iguais em todas as regiões.)", correctAnswer: "Há danos em vários lugares; chegando à região sul, sofreu danos devastadores.", rationale: "南部地方に至っては → chegando à região sul (caso mais extremo). Danos devastadores o pior dos casos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "部分的な問題もさることながら、システム全体に至っては再構築が必要だ。 (Há problemas parciais; chegando ao sistema todo, é necessária a reconstrução./Os problemas parciais são os mais graves./O sistema não precisa de reconstrução./Os problemas parciais e o sistema total são iguais.)", correctAnswer: "Há problemas parciais; chegando ao sistema todo, é necessária a reconstrução.", rationale: "システム全体に至っては → chegando ao sistema inteiro (caso mais extremo). Necessidade de refazer tudo.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
