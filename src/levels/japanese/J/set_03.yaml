title: 📝 ～をきっかけに (aproveitando / a partir de)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～をきっかけに indica que um evento serviu como gatilho ou oportunidade para uma mudança ou ação. Variantes: をきっかけとして、をきっかけにして."
example: "留学をきっかけに日本語に興味を持った。 Ex.: ～をきっかけに → 'a partir de / aproveitando como oportunidade'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～をきっかけに
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "この経験をきっかけに (ignorando esta experiência/aproveitando esta experiência como oportunidade/antes desta experiência/independentemente desta experiência)", correctAnswer: "aproveitando esta experiência como oportunidade", rationale: "をきっかけに = 'a partir de / aproveitando como gatilho'. A experiência foi o ponto de virada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "事故をきっかけに安全対策が見直された。 (Apesar do acidente, as medidas de segurança foram revistas./Por causa de relações com o acidente, as medidas foram revistas./A partir do acidente, as medidas de segurança foram revistas./Antes do acidente, as medidas foram revistas.)", correctAnswer: "A partir do acidente, as medidas de segurança foram revistas.", rationale: "事故をきっかけに = a partir do acidente. O acidente foi o gatilho para revisar as medidas.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その映画をきっかけとして (ignorando o filme/aproveitando o filme como ponto de partida/apesar do filme/depois muito tempo do filme)", correctAnswer: "aproveitando o filme como ponto de partida", rationale: "をきっかけとして é variante mais formal de をきっかけに. O filme serviu como gatilho.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "転職をきっかけに生活が変わった。 (Apesar da mudança de emprego, a vida mudou./A mudança de emprego serviu de gatilho para a vida mudar./Antes de mudar de emprego, a vida mudou./A vida mudou sem relação com o emprego.)", correctAnswer: "A mudança de emprego serviu de gatilho para a vida mudar.", rationale: "転職をきっかけに = a partir da mudança de emprego. Foi o evento que desencadeou a mudança de vida.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "きっかけ significa (obstáculo/coincidência/gatilho ou oportunidade/consequência)", correctAnswer: "gatilho ou oportunidade", rationale: "きっかけ (切っ掛け) significa 'gatilho, oportunidade, ponto de partida'. をきっかけに usa esse substantivo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "病気をきっかけに健康に気をつけるようになった。 (Apesar da doença, passei a me cuidar./A doença me fez começar a me preocupar com a saúde./Antes da doença, eu me preocupava com saúde./A doença piorou minha saúde.)", correctAnswer: "A doença me fez começar a me preocupar com a saúde.", rationale: "病気をきっかけに = a partir da doença (como gatilho). Levou à mudança de comportamento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をきっかけに implica (que o evento causou diretamente o resultado/que o evento serviu como oportunidade para uma mudança/que o evento impediu a mudança/que o evento não influenciou nada)", correctAnswer: "que o evento serviu como oportunidade para uma mudança", rationale: "をきっかけに indica causalidade indireta: o evento foi a faísca que desencadeou uma mudança.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "結婚をきっかけにして新しい生活が始まった。 (Apesar do casamento, a nova vida começou./O casamento foi o ponto de partida para uma nova vida./Antes do casamento, a nova vida tinha começado./O casamento não influenciou a nova vida.)", correctAnswer: "O casamento foi o ponto de partida para uma nova vida.", rationale: "をきっかけにして = a partir do casamento (forma reforçada). O casamento foi o gatilho.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このコンサートをきっかけに音楽を始めた。 (Apesar do concerto, comecei a estudar música./A partir deste concerto, comecei a estudar música./Antes deste concerto, já estudava música./Parei de estudar música por causa do concerto.)", correctAnswer: "A partir deste concerto, comecei a estudar música.", rationale: "このコンサートをきっかけに = a partir deste concerto. Foi a faísca que despertou o interesse.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をきっかけに vs をもとに (をきっかけに = gatilho para mudança; をもとに = com base em/ambos significam 'por causa de'/をきっかけに = com base em; をもとに = gatilho/são completamente idênticos)", correctAnswer: "をきっかけに = gatilho para mudança; をもとに = com base em", rationale: "をきっかけに indica o evento que desencadeou algo novo. をもとに indica que algo serve de fundamento ou base.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases complexas com ～をきっかけに
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "震災をきっかけに、多くの人がボランティア活動を始めた。 (Apesar do terremoto, muitos começaram voluntariado./A partir do terremoto, muitas pessoas começaram trabalho voluntário./Antes do terremoto, muitos faziam voluntariado./O terremoto impediu o trabalho voluntário.)", correctAnswer: "A partir do terremoto, muitas pessoas começaram trabalho voluntário.", rationale: "震災をきっかけに = a partir do terremoto. A catástrofe desencadeou o engajamento voluntário.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その本をきっかけとして、彼女の人生観が変わった。 (Apesar do livro, sua visão de vida mudou./A partir daquele livro, sua visão de vida mudou./Antes do livro, sua visão tinha mudado./O livro não influenciou sua visão de vida.)", correctAnswer: "A partir daquele livro, sua visão de vida mudou.", rationale: "その本をきっかけとして = a partir daquele livro (forma formal). Foi o gatilho para a mudança.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "海外赴任をきっかけに語学力が上がった。 (Apesar da transferência ao exterior, as habilidades linguísticas melhoraram./A transferência ao exterior foi o gatilho para melhorar as habilidades linguísticas./Antes da transferência, as habilidades já tinham melhorado./A transferência não influenciou as habilidades.)", correctAnswer: "A transferência ao exterior foi o gatilho para melhorar as habilidades linguísticas.", rationale: "海外赴任をきっかけに = a partir da transferência ao exterior. Serviu de impulsionador para aprender idiomas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をきっかけに geralmente é seguido de (expressão de estado contínuo ou mudança/expressão de negação/expressão de tempo passado fixo/expressão de impossibilidade)", correctAnswer: "expressão de estado contínuo ou mudança", rationale: "をきっかけに geralmente antecede uma mudança de comportamento ou estado: ～ようになった、～始めた etc.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このプロジェクトをきっかけに新しいビジネスが生まれた。 (Apesar do projeto, novos negócios surgiram./A partir deste projeto, novos negócios nasceram./Antes do projeto, os negócios já existiam./O projeto impediu novos negócios.)", correctAnswer: "A partir deste projeto, novos negócios nasceram.", rationale: "このプロジェクトをきっかけに = a partir deste projeto. Foi o ponto de partida para novos negócios.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "祖父の死をきっかけに家族の絆が深まった。 (Apesar da morte do avô, os laços familiares se estreitaram./A morte do avô foi o gatilho para estreitar os laços familiares./Antes da morte do avô, os laços eram fortes./A morte do avô destruiu os laços familiares.)", correctAnswer: "A morte do avô foi o gatilho para estreitar os laços familiares.", rationale: "祖父の死をきっかけに = a partir da morte do avô. A tragédia uniu a família.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この失敗をきっかけにして成長した。 (Apesar desta falha, cresci./Esta falha foi o ponto de partida para meu crescimento./Antes desta falha, eu tinha crescido./A falha me impediu de crescer.)", correctAnswer: "Esta falha foi o ponto de partida para meu crescimento.", rationale: "この失敗をきっかけにして = a partir desta falha. O fracasso se tornou uma oportunidade de desenvolvimento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友人の言葉をきっかけに考え方が変わった。 (Apesar das palavras do amigo, minha forma de pensar mudou./As palavras do amigo serviram de gatilho para mudar minha forma de pensar./Antes das palavras do amigo, eu já tinha mudado./As palavras do amigo não me influenciaram.)", correctAnswer: "As palavras do amigo serviram de gatilho para mudar minha forma de pensar.", rationale: "友人の言葉をきっかけに = a partir das palavras do amigo. O comentário foi o ponto de virada.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "SNSの普及をきっかけとして情報の流れが変わった。 (Apesar da popularização das redes sociais, o fluxo de informações mudou./A popularização das redes sociais foi o gatilho para mudar o fluxo de informações./Antes das redes sociais, a informação já mudava./As redes sociais não influenciaram a informação.)", correctAnswer: "A popularização das redes sociais foi o gatilho para mudar o fluxo de informações.", rationale: "SNSの普及をきっかけとして = a partir da popularização das redes sociais (forma formal).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をきっかけに pode ser negativo ou positivo? (apenas positivo/apenas negativo/pode ser tanto positivo quanto negativo/apenas neutro)", correctAnswer: "pode ser tanto positivo quanto negativo", rationale: "をきっかけに é neutro quanto à valência. O gatilho pode ser algo positivo (casamento) ou negativo (doença, desastre).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
