title: 💬 Vocabulário N2 — política e economia
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Vocabulário N2 essencial de política e economia: termos usados em jornais, notícias e textos acadêmicos. Foco em leitura de noticias japonesas."
example: "景気回復 (けいきかいふく) = recuperação econômica. Ex.: 政治経済語彙 → vocabulário político-econômico N2."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Vocabulário político
    description: Escolha o significado correto do termo político.
    exercises:
      - { type: japanese_vocab, question: "施政方針 (しせいほうしん) significa (orçamento anual/diretrizes governamentais/resultado eleitoral/lei fundamental)", correctAnswer: "diretrizes governamentais", rationale: "施政方針 (しせいほうしん) → diretrizes/princípios de governo. 施政 (governing) + 方針 (diretriz/política).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "与党 (よとう) significa (partido de oposição/partido governante/partido independente/partido regional)", correctAnswer: "partido governante", rationale: "与党 (よとう) → partido no poder/governante. 与 (よ) → dar/conceder; indicando participação no governo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "野党 (やとう) significa (partido governante/partido de oposição/partido central/partido de coalizão)", correctAnswer: "partido de oposição", rationale: "野党 (やとう) → partido de oposição. 野 (の) → campo aberto (fora do poder); oposto de 与党.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "解散総選挙 (かいさんそうせんきょ) significa (eleição regular/eleição após dissolução do parlamento/eleição de governadores/eleição presidencial)", correctAnswer: "eleição após dissolução do parlamento", rationale: "解散総選挙 → eleições gerais após dissolução da Câmara dos Representantes pelo primeiro-ministro.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "閣議決定 (かくぎけってい) significa (votação parlamentar/decisão do gabinete ministerial/sentença judicial/resultado de eleição)", correctAnswer: "decisão do gabinete ministerial", rationale: "閣議決定 → decisão do conselho de ministros. 閣議 → reunião do gabinete; 決定 → decisão.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "審議 (しんぎ) significa (votação final/deliberação e discussão/promulgação de lei/eleição)", correctAnswer: "deliberação e discussão", rationale: "審議 (しんぎ) → deliberação/exame cuidadoso. 審 → examinar; 議 → discutir. Processo antes de votar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "利権 (りけん) significa (direito legal/vantagem política ou econômica/taxa de uso/interesse público)", correctAnswer: "vantagem política ou econômica", rationale: "利権 (りけん) → vantagem/privilégio. Frequentemente usado em contextos de corrupção ou lobbying.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "汚職 (おしょく) significa (reforma política/corrupção/manifesto político/campanha eleitoral)", correctAnswer: "corrupção", rationale: "汚職 (おしょく) → corrupção/abuso de cargo público. 汚 (お/よご) → sujo; 職 (しょく) → cargo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国会審議 (こっかいしんぎ) significa (sessão parlamentar de deliberação/eleição nacional/decisão do gabinete/promulgação constitucional)", correctAnswer: "sessão parlamentar de deliberação", rationale: "国会審議 → deliberação no parlamento nacional. 国会 → Dieta (parlamento japonês); 審議 → deliberação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "連立政権 (れんりつせいけん) significa (governo de partido único/governo de coalizão/governo militar/governo regional)", correctAnswer: "governo de coalizão", rationale: "連立政権 → governo de coalizão. 連立 → coalizão/aliança; 政権 → poder político/governo.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Vocabulário econômico
    description: Escolha o significado correto do termo econômico.
    exercises:
      - { type: japanese_vocab, question: "財政赤字 (ざいせいあかじ) significa (superávit fiscal/déficit fiscal/orçamento equilibrado/reforma fiscal)", correctAnswer: "déficit fiscal", rationale: "財政赤字 → déficit fiscal. 財政 → finanças públicas; 赤字 → déficit (literalmente: letras vermelhas).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "景気後退 (けいきこうたい) significa (recuperação econômica/recessão econômica/crescimento econômico/estagnação econômica)", correctAnswer: "recessão econômica", rationale: "景気後退 → recessão. 景気 → condições econômicas; 後退 → retrocesso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "金融緩和 (きんゆうかんわ) significa (aperto monetário/afrouxamento monetário/reforma financeira/taxa de câmbio)", correctAnswer: "afrouxamento monetário", rationale: "金融緩和 → flexibilização monetária (QE). 金融 → finanças/monetário; 緩和 → afrouxamento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "貿易収支 (ぼうえきしゅうし) significa (taxa de inflação/balança comercial/taxa de câmbio/taxa de juros)", correctAnswer: "balança comercial", rationale: "貿易収支 → balança comercial. 貿易 → comércio exterior; 収支 → receitas e despesas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "格差社会 (かくさしゃかい) significa (sociedade igualitária/sociedade com grandes desigualdades/sociedade industrializada/sociedade pós-moderna)", correctAnswer: "sociedade com grandes desigualdades", rationale: "格差社会 → sociedade de desigualdades. 格差 → diferença/disparidade; 社会 → sociedade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "規制緩和 (きせいかんわ) significa (aumento de regulamentações/redução de regulamentações/regulamentação nova/fiscalização mais intensa)", correctAnswer: "redução de regulamentações", rationale: "規制緩和 → desregulamentação. 規制 → regulamentação; 緩和 → afrouxamento/relaxamento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "円高 (えんだか) significa (queda do iene/alta do iene/estabilidade do iene/desvalorização do iene)", correctAnswer: "alta do iene", rationale: "円高 → valorização do iene. 円 → iene; 高 → alto/valorizado. Oposto: 円安 (desvalorização).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "少子高齢化 (しょうしこうれいか) significa (aumento da natalidade e jovens/declínio da natalidade e envelhecimento/crescimento populacional jovem/emigração da população idosa)", correctAnswer: "declínio da natalidade e envelhecimento", rationale: "少子高齢化 → baixa taxa de natalidade + envelhecimento. 少子 → poucos filhos; 高齢化 → envelhecimento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経済格差 (けいざいかくさ) significa (crescimento econômico/desigualdade econômica/parceria econômica/reforma econômica)", correctAnswer: "desigualdade econômica", rationale: "経済格差 → desigualdade econômica. 経済 → economia; 格差 → disparidade/diferença.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社会保障 (しゃかいほしょう) significa (segurança nacional/seguridade social/seguro de saúde privado/poupança pessoal)", correctAnswer: "seguridade social", rationale: "社会保障 → seguridade social. 社会 → social; 保障 → garantia/segurança. Sistema de proteção social do Estado.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
