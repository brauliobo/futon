title: 📝 ～をはじめとして (a começar por / inclusive)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～をはじめとして apresenta um exemplo representativo de um grupo maior: 'a começar por X, e também...'. Variantes: をはじめ、をはじめとする."
example: "日本をはじめとして、アジア各国が参加した。 Ex.: ～をはじめとして → 'a começar por / inclusive'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～をはじめとして
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "東京をはじめとして (somente Tóquio/a começar por Tóquio/excluindo Tóquio/depois de Tóquio)", correctAnswer: "a começar por Tóquio", rationale: "をはじめとして = 'a começar por', apresentando Tóquio como exemplo principal de um grupo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語をはじめとする言語 (somente o japonês/línguas excluindo o japonês/línguas a começar pelo japonês/línguas após o japonês)", correctAnswer: "línguas a começar pelo japonês", rationale: "をはじめとする é a forma atributiva. Modifica 言語 (línguas).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社長をはじめとして全員が参加した。 (Somente o diretor participou./A começar pelo diretor, todos participaram./Exceto o diretor, todos participaram./Depois do diretor, todos participaram.)", correctAnswer: "A começar pelo diretor, todos participaram.", rationale: "社長をはじめとして = a começar pelo diretor. Indica que o diretor é o representante principal do grupo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "山田先生をはじめとする先生方 (somente o professor Yamada/professores exceto Yamada/professores a começar pelo professor Yamada/professores depois de Yamada)", correctAnswer: "professores a começar pelo professor Yamada", rationale: "をはじめとする modifica 先生方 (professores), com Yamada como exemplo representativo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "アジアをはじめとして世界各国 (apenas a Ásia/países do mundo a começar pela Ásia/países excluindo a Ásia/países depois da Ásia)", correctAnswer: "países do mundo a começar pela Ásia", rationale: "アジアをはじめとして世界各国 = países do mundo, a começar pela Ásia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をはじめとして vs をはじめ (をはじめとして é mais formal/ambos são idênticos/をはじめ é mais formal/não existe をはじめ)", correctAnswer: "をはじめとして é mais formal", rationale: "をはじめ é uma forma abreviada e mais coloquial. をはじめとして e をはじめとする são mais formais e escritos.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題をはじめとして様々な課題がある。 (Há apenas este problema./A começar por este problema, há vários desafios./Este problema excede outros desafios./Este problema surgiu depois dos outros.)", correctAnswer: "A começar por este problema, há vários desafios.", rationale: "この問題をはじめとして = a começar por este problema. Indica que é representativo de vários outros.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語をはじめ、韓国語や中国語も勉強している。 (Estudo apenas japonês./Estudo japonês, coreano e chinês, a começar pelo japonês./Depois do japonês, estudei coreano./Exceto o japonês, estudo coreano e chinês.)", correctAnswer: "Estudo japonês, coreano e chinês, a começar pelo japonês.", rationale: "をはじめ = a começar por (forma abreviada). O japonês é o exemplo principal de um grupo maior.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "首相をはじめとする要人が出席した。 (Somente o primeiro-ministro compareceu./Autoridades importantes, a começar pelo primeiro-ministro, compareceram./Exceto o primeiro-ministro, as autoridades compareceram./Depois do primeiro-ministro, as autoridades saíram.)", correctAnswer: "Autoridades importantes, a começar pelo primeiro-ministro, compareceram.", rationale: "首相をはじめとする要人 = autoridades importantes, a começar pelo primeiro-ministro.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をはじめとして se usa com (somente pessoas/somente lugares/substantivos variados como pessoas, lugares e objetos/somente verbos)", correctAnswer: "substantivos variados como pessoas, lugares e objetos", rationale: "をはじめとして pode ser usado com qualquer substantivo que sirva como exemplo representativo de um grupo.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases formais com ～をはじめとして
    description: Escolha a tradução correta da frase formal.
    exercises:
      - { type: japanese_vocab, question: "本学をはじめとする国内の大学が協定を結んだ。 (Somente nossa universidade assinou o acordo./Universidades nacionais, a começar pela nossa, assinaram o acordo./Exceto nossa universidade, as nacionais assinaram./Depois da nossa universidade, as nacionais assinaram.)", correctAnswer: "Universidades nacionais, a começar pela nossa, assinaram o acordo.", rationale: "本学をはじめとする国内の大学 = universidades nacionais, a começar pela nossa universidade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "部長をはじめとして、チーム全員が努力した。 (Somente o gerente se esforçou./A começar pelo gerente, toda a equipe se esforçou./Exceto o gerente, a equipe se esforçou./O gerente foi o último a se esforçar.)", correctAnswer: "A começar pelo gerente, toda a equipe se esforçou.", rationale: "部長をはじめとして = a começar pelo gerente. Toda a equipe trabalhou duro.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "環境問題をはじめとする社会的課題 (apenas problemas ambientais/desafios sociais a começar pelos problemas ambientais/desafios excluindo problemas ambientais/desafios após os problemas ambientais)", correctAnswer: "desafios sociais a começar pelos problemas ambientais", rationale: "環境問題をはじめとする社会的課題 = desafios sociais, com os problemas ambientais como exemplo principal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "東南アジアをはじめとして、新興市場が成長している。 (Somente o Sudeste Asiático cresce./A começar pelo Sudeste Asiático, mercados emergentes crescem./Exceto o Sudeste Asiático, os mercados crescem./Depois do Sudeste Asiático, os mercados vão crescer.)", correctAnswer: "A começar pelo Sudeste Asiático, mercados emergentes crescem.", rationale: "東南アジアをはじめとして = a começar pelo Sudeste Asiático. Mercados emergentes em expansão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をはじめとして implica que o exemplo dado é (o único caso/um caso representativo de um grupo maior/um caso excepcional/o caso menos importante)", correctAnswer: "um caso representativo de um grupo maior", rationale: "をはじめとして apresenta o primeiro item como representante de um conjunto mais amplo, não como caso único.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "鈴木氏をはじめとする専門家たちが報告書をまとめた。 (Somente Suzuki escreveu o relatório./Especialistas, liderados por Suzuki, elaboraram o relatório./Exceto Suzuki, os especialistas escreveram./Depois de Suzuki, os especialistas escreveram.)", correctAnswer: "Especialistas, liderados por Suzuki, elaboraram o relatório.", rationale: "鈴木氏をはじめとする専門家たち = especialistas, a começar por Suzuki. Ele é o representante do grupo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "プラスチックをはじめとする廃棄物が海を汚染している。 (Somente plástico polui o mar./Resíduos, a começar pelo plástico, poluem o mar./Exceto plástico, os resíduos poluem./Depois do plástico, os resíduos poluirão.)", correctAnswer: "Resíduos, a começar pelo plástico, poluem o mar.", rationale: "プラスチックをはじめとする廃棄物 = resíduos, com plástico como exemplo principal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国語をはじめとして五科目を受験した。 (Fiz exame apenas de japonês./A começar por japonês, fiz exame de cinco matérias./Exceto japonês, fiz cinco matérias./Depois de japonês, fiz os outros exames.)", correctAnswer: "A começar por japonês, fiz exame de cinco matérias.", rationale: "国語をはじめとして五科目 = cinco matérias, a começar por japonês (língua nacional).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "市長をはじめとして来賓が壇上に並んだ。 (Somente o prefeito subiu ao palco./Os convidados, a começar pelo prefeito, se alinharam no palco./Exceto o prefeito, os convidados subiram./Depois do prefeito, os convidados subiram.)", correctAnswer: "Os convidados, a começar pelo prefeito, se alinharam no palco.", rationale: "市長をはじめとして来賓 = convidados, com o prefeito como figura principal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "をはじめとする vs を含む (をはじめとする destaca um exemplo principal; を含む apenas lista itens/ambos são idênticos/を含む destaca o principal; をはじめとする apenas lista/não há diferença de uso)", correctAnswer: "をはじめとする destaca um exemplo principal; を含む apenas lista itens", rationale: "をはじめとする enfatiza o item mais representativo do grupo, enquanto を含む (incluindo) simplesmente lista sem hierarquia.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
