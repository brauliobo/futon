title: 📝 ～次第 (assim que / dependendo de)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～次第 tem dois usos principais: 1) V連用形+次第 = 'assim que' (logo que concluir); 2) N+次第 = 'dependendo de'. Ambos são N2 e comuns em contextos formais."
example: "準備ができ次第出発します。 Ex.: ～次第 → 'assim que / dependendo de'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Uso 1 — V連用形+次第 (assim que)
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "到着次第連絡します。 (Antes de chegar, aviso./Assim que chegar, aviso./Depois de um tempo de chegar, aviso./Independentemente de chegar, aviso.)", correctAnswer: "Assim que chegar, aviso.", rationale: "到着次第 = assim que chegar. 次第 após substantivo de ação indica imediatamente depois.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "確認でき次第お知らせします。 (Antes de confirmar, avisarei./Assim que conseguir confirmar, avisarei./Depois de muito tempo, avisarei./Independentemente de confirmar, avisarei.)", correctAnswer: "Assim que conseguir confirmar, avisarei.", rationale: "確認でき次第 = assim que puder confirmar. でき = forma conjuntiva (連用形) de できる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "次第 (uso 1) implica ação (imediata após concluir/demorada após concluir/antes de concluir/simultânea a concluir)", correctAnswer: "imediata após concluir", rationale: "次第 (uso 1) indica que a ação seguinte ocorre imediatamente após a conclusão da ação anterior.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "資料が揃い次第会議を始めます。 (Antes de reunir o material, a reunião começa./Assim que o material estiver pronto, a reunião começa./Depois de muito tempo, a reunião começa./Independentemente do material, começa.)", correctAnswer: "Assim que o material estiver pronto, a reunião começa.", rationale: "資料が揃い次第 = assim que o material estiver pronto. Reunião depende da preparação dos documentos.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "次第 (uso 1) é frequentemente usado em (conversas casuais/comunicações formais e profissionais/textos literários clássicos/comunicação entre crianças)", correctAnswer: "comunicações formais e profissionais", rationale: "次第 (assim que) é padrão em e-mails profissionais, comunicados e situações formais.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "準備が整い次第出荷いたします。 (Antes de preparar, enviaremos./Assim que a preparação estiver completa, enviaremos./Depois de muito tempo, enviaremos./Independentemente da preparação, enviaremos.)", correctAnswer: "Assim que a preparação estiver completa, enviaremos.", rationale: "準備が整い次第 = assim que a preparação estiver completa. Fórmula de e-mail comercial formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "完成し次第ご報告いたします。 (Antes de concluir, reportarei./Antes de iniciar, reportarei./Assim que concluir, reportarei./Depois de muito tempo, reportarei.)", correctAnswer: "Assim que concluir, reportarei.", rationale: "完成し次第 = assim que concluir. 完成する → 完成し (forma conjuntiva).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "V連用形+次第 vs Vたら (次第 é mais formal; たら é mais comum na fala/たら é mais formal/são completamente iguais/次第 é mais coloquial)", correctAnswer: "次第 é mais formal; たら é mais comum na fala", rationale: "次第 (assim que) é muito formal. 着いたら連絡して é mais natural na conversa; 到着次第連絡いたします é formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "入金確認でき次第、手続きを進めます。 (Antes de confirmar o pagamento, prosseguiremos./Assim que pudermos confirmar o pagamento, prosseguiremos./Independentemente do pagamento, prosseguiremos./Depois de longo tempo, prosseguiremos.)", correctAnswer: "Assim que pudermos confirmar o pagamento, prosseguiremos.", rationale: "入金確認でき次第 = assim que pudermos confirmar o pagamento. Linguagem empresarial formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "決定し次第改めてご連絡いたします。 (Antes de decidir, entraremos em contato./Assim que for decidido, entraremos em contato novamente./Apesar de decidir, não entraremos em contato./Independentemente da decisão, entraremos em contato.)", correctAnswer: "Assim que for decidido, entraremos em contato novamente.", rationale: "決定し次第 = assim que for decidido. Expressão padrão em comunicados empresariais.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Uso 2 — N+次第 (dependendo de)
    description: Escolha o significado correto do uso de N+次第.
    exercises:
      - { type: japanese_vocab, question: "やる気次第で結果が変わる。 (O resultado muda apesar da motivação./O resultado muda dependendo da motivação./O resultado não muda independentemente da motivação./A motivação não influencia o resultado.)", correctAnswer: "O resultado muda dependendo da motivação.", rationale: "やる気次第で = dependendo da motivação. N+次第で indica que o resultado depende de N.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "状況次第では対応が変わる。 (A resposta muda apesar da situação./Dependendo da situação, a resposta pode mudar./A resposta não muda mesmo com a situação./A situação não influencia a resposta.)", correctAnswer: "Dependendo da situação, a resposta pode mudar.", rationale: "状況次第では = dependendo da situação. Indica variabilidade condicional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "N+次第 indica que (N é a condição que determina o resultado/N é sempre positivo/N não influencia nada/N é o resultado)", correctAnswer: "N é a condição que determina o resultado", rationale: "N+次第 = 'dependendo de N'. N é o fator determinante para o que vai acontecer.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あとは君の努力次第だ。 (O resto depende do esforço de outra pessoa./O resto depende do teu esforço./O esforço não importa mais./Não importa mais o que faças.)", correctAnswer: "O resto depende do teu esforço.", rationale: "君の努力次第 = dependendo do teu esforço. Responsabilidade colocada na pessoa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "天候次第で日程が変更になる。 (O cronograma muda apesar do tempo./Dependendo do tempo, o cronograma pode mudar./O tempo não influencia o cronograma./O cronograma é fixo independente do tempo.)", correctAnswer: "Dependendo do tempo, o cronograma pode mudar.", rationale: "天候次第で = dependendo do tempo. O tempo é o fator determinante para o cronograma.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "使い方次第では有益にも有害にもなる。 (Dependendo de como se usa, pode ser útil ou prejudicial./Independentemente de como se usa, é sempre prejudicial./O uso não influencia se é útil ou prejudicial./Sempre é útil independentemente do uso.)", correctAnswer: "Dependendo de como se usa, pode ser útil ou prejudicial.", rationale: "使い方次第では = dependendo do modo de uso. Neutralidade do objeto; o uso que determina.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "次第 (uso 2 — dependendo) difere do uso 1 (assim que) porque (o uso 2 segue verbo; uso 1 segue substantivo/o uso 2 segue substantivo e indica condição; uso 1 segue forma conjuntiva do verbo/são idênticos/o uso 2 é mais antigo)", correctAnswer: "o uso 2 segue substantivo e indica condição; uso 1 segue forma conjuntiva do verbo", rationale: "Uso 1: 連用形+次第 (assim que). Uso 2: N+次第 (dependendo de). Estruturas diferentes.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "返事は相手次第だ。 (A resposta depende de mim./A resposta depende da outra parte./A resposta não depende de ninguém./A resposta já está decidida.)", correctAnswer: "A resposta depende da outra parte.", rationale: "相手次第 = dependendo da outra parte. O resultado está nas mãos do interlocutor.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "値段次第では購入を検討する。 (Independentemente do preço, vai comprar./Dependendo do preço, pode considerar comprar./O preço não influencia a compra./Vai comprar sem olhar o preço.)", correctAnswer: "Dependendo do preço, pode considerar comprar.", rationale: "値段次第では = dependendo do preço. O preço é o fator decisivo para a compra.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "成功するかどうかは本人の頑張り次第だ。 (O sucesso não depende da dedicação da pessoa./Se vai ter sucesso ou não depende da dedicação da própria pessoa./O sucesso é garantido independentemente do esforço./O sucesso depende da sorte, não do esforço.)", correctAnswer: "Se vai ter sucesso ou não depende da dedicação da própria pessoa.", rationale: "本人の頑張り次第 = dependendo da dedicação da própria pessoa. Responsabilidade individual pelo sucesso.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
