title: 📝 ～を問わず (independentemente de / sem distinção)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～を問わず indica que algo se aplica independentemente de uma condição ou distinção. Variantes: を問わない (forma negativa), を問わず。Usado com pares como 年齢、性別、国籍."
example: "年齢を問わず参加できます。 Ex.: ～を問わず → 'independentemente de / sem distinção de'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～を問わず
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "性別を問わず (dependendo do gênero/independentemente do gênero/somente para homens/somente para mulheres)", correctAnswer: "independentemente do gênero", rationale: "を問わず = 'independentemente de / sem distinção de'. 性別を問わず = sem distinção de gênero.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "国籍を問わず応募できます。 (Somente japoneses podem se candidatar./Apenas estrangeiros podem se candidatar./Independentemente da nacionalidade, pode-se candidatar./A candidatura depende da nacionalidade.)", correctAnswer: "Independentemente da nacionalidade, pode-se candidatar.", rationale: "国籍を問わず = independentemente da nacionalidade. Abertura sem distinção de origem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "問わず (とわず) é a forma negativa de (問う = questionar/問う = proibir/問う = selecionar/問う = distinguir)", correctAnswer: "問う = questionar", rationale: "問う (とう) = questionar/interrogar. を問わず = sem questionar = independentemente de.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経験の有無を問わず採用します。 (Contratam somente experientes./Contratam somente inexperientes./Independentemente de ter ou não experiência, contratam./Dependendo da experiência, contratam.)", correctAnswer: "Independentemente de ter ou não experiência, contratam.", rationale: "経験の有無を問わず = independentemente de ter ou não experiência. Abertura para todos.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "昼夜を問わず働いた。 (Trabalhou somente de dia./Trabalhou somente à noite./Trabalhou independentemente do horário, dia e noite./Trabalhou dependendo do horário.)", correctAnswer: "Trabalhou independentemente do horário, dia e noite.", rationale: "昼夜を問わず = sem distinção entre dia e noite = o tempo todo, dia e noite.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "を問わず se usa tipicamente com (pares opostos ou categorias/apenas verbos/apenas adjetivos/somente datas)", correctAnswer: "pares opostos ou categorias", rationale: "を問わず é típico com: 年齢、性別、国籍、昼夜、賛否 (pares ou categorias que abrangem tudo).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "賛否を問わず意見を述べてください。 (Dê sua opinião somente se for a favor./Dê sua opinião somente se for contra./Independentemente de ser a favor ou contra, expresse sua opinião./Expresse sua opinião dependendo da posição.)", correctAnswer: "Independentemente de ser a favor ou contra, expresse sua opinião.", rationale: "賛否を問わず = independentemente de ser a favor ou contra. 賛 = a favor; 否 = contra.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "年齢、性別を問わず楽しめるゲーム (jogo para faixas etárias e gêneros específicos/jogo que todos podem aproveitar independentemente da idade e gênero/jogo somente para jovens/jogo somente para adultos)", correctAnswer: "jogo que todos podem aproveitar independentemente da idade e gênero", rationale: "年齢、性別を問わず = independentemente da idade e do gênero. Alcance universal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "理由を問わず返品できます。 (Pode-se devolver somente com justificativa./Independentemente do motivo, pode-se devolver./Dependendo do motivo, pode-se devolver./Não pode-se devolver.", correctAnswer: "Independentemente do motivo, pode-se devolver.", rationale: "理由を問わず = independentemente do motivo. Política de devolução sem restrições.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "を問わず vs にかかわらず (を問わず = sem questionar; にかかわらず = sem se preocupar com — são praticamente sinônimos/を問わず = dependendo de; にかかわらず = independentemente/を問わず é mais formal; にかかわらず é mais coloquial/são opostos em significado)", correctAnswer: "を問わず = sem questionar; にかかわらず = sem se preocupar com — são praticamente sinônimos", rationale: "を問わず e にかかわらず são quase intercambiáveis. にかかわらず é levemente mais versátil e mais amplo.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases formais com ～を問わず
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "国内外を問わず活躍している企業 (empresa que atua apenas no mercado interno/empresa que atua independentemente de ser mercado interno ou externo/empresa que atua apenas no exterior/empresa que depende do mercado)", correctAnswer: "empresa que atua independentemente de ser mercado interno ou externo", rationale: "国内外を問わず = independentemente de ser interno ou externo. Atuação global sem distinção.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "専門の有無を問わず参加できるセミナー (seminário somente para especialistas/seminário somente para leigos/seminário que aceita participantes independentemente de ser especialista ou não/seminário que depende da especialização)", correctAnswer: "seminário que aceita participantes independentemente de ser especialista ou não", rationale: "専門の有無を問わず = independentemente de ter ou não especialização.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "時間や場所を問わず学習できる環境 (ambiente de aprendizado que depende do horário e local/ambiente de aprendizado independentemente do horário ou local/ambiente somente para horário fixo/ambiente somente presencial)", correctAnswer: "ambiente de aprendizado independentemente do horário ou local", rationale: "時間や場所を問わず = independentemente do horário ou local. Aprendizado flexível e remoto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "本人確認ができれば、過去の信用情報を問わずローンを組める。 (Somente com bom histórico de crédito pode-se fazer empréstimo./Se puder verificar identidade, independentemente do histórico de crédito, pode-se financiar./O histórico de crédito é o único fator./A identificação não é necessária.)", correctAnswer: "Se puder verificar identidade, independentemente do histórico de crédito, pode-se financiar.", rationale: "過去の信用情報を問わず = independentemente do histórico de crédito.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "民族、宗教、文化を問わず適用される国際法 (lei internacional que se aplica a etnias e religiões específicas/lei internacional que se aplica independentemente de etnia, religião ou cultura/lei internacional somente para países desenvolvidos/lei que depende da cultura)", correctAnswer: "lei internacional que se aplica independentemente de etnia, religião ou cultura", rationale: "民族、宗教、文化を問わず = independentemente de etnia, religião ou cultura. Alcance universal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "を問わず pode negar (apenas pares como 賛否/qualquer tipo de distinção ou categoria/apenas distinções de tempo/apenas distinções de lugar)", correctAnswer: "qualquer tipo de distinção ou categoria", rationale: "を問わず pode negar qualquer condição: 年齢、性別、国籍、理由、専門、時間 etc.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社員全員、役職を問わず参加が義務付けられた。 (Somente diretores devem participar./Somente funcionários de baixo escalão devem participar./Independentemente do cargo, todos os funcionários são obrigados a participar./A participação depende do cargo.)", correctAnswer: "Independentemente do cargo, todos os funcionários são obrigados a participar.", rationale: "役職を問わず = independentemente do cargo. Obrigação para todos sem distinção hierárquica.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "障害の有無を問わず働ける社会 (sociedade onde somente pessoas com deficiência trabalham/sociedade onde somente pessoas sem deficiência trabalham/sociedade onde todos podem trabalhar independentemente de ter ou não deficiência/sociedade que separa as pessoas)", correctAnswer: "sociedade onde todos podem trabalham independentemente de ter ou não deficiência", rationale: "障害の有無を問わず = independentemente de ter ou não deficiência. Sociedade inclusiva.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "購入場所を問わず保証が受けられます。 (A garantia depende do local de compra./Independentemente do local de compra, pode-se obter garantia./A garantia é somente na loja oficial./Sem garantia independentemente do local.)", correctAnswer: "Independentemente do local de compra, pode-se obter garantia.", rationale: "購入場所を問わず = independentemente do local de compra. Garantia universal do produto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "を問わず pode ser substituído por (にもかかわらず/にかかわらず/にもとづいて/によって) em muitos contextos", correctAnswer: "にかかわらず", rationale: "にかかわらず (independentemente de) é o sinônimo mais próximo de を問わず. にもかかわらず = apesar de (concessivo).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
