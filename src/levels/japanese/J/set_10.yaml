title: 📝 ～の末に (após / depois de longa)
level: 'J'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～の末に indica o resultado final após um longo processo, esforço ou deliberação. Geralmente usado com processos difíceis ou demorados. Variantes: の末、末に、動詞た形+末に."
example: "長い議論の末に結論が出た。 Ex.: ～の末に → 'após / depois de longo processo de'."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Significado de ～の末に
    description: Escolha o significado correto da expressão.
    exercises:
      - { type: japanese_vocab, question: "長い交渉の末に (antes de longas negociações/durante as longas negociações/após longas negociações/apesar das longas negociações)", correctAnswer: "após longas negociações", rationale: "の末に = 'após / depois de longo processo'. 長い交渉の末に = após longas negociações.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悩んだ末に決断した。 (Antes de refletir, tomei uma decisão./Apesar de refletir, tomei uma decisão./Após muito refletir, tomei uma decisão./Sem refletir, tomei uma decisão.)", correctAnswer: "Após muito refletir, tomei uma decisão.", rationale: "悩んだ末に = após muito se angustiar/refletir. た形+末に indica o processo concluído.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "末に (すえに) implica que o processo foi (rápido e fácil/longo e geralmente difícil/agradável e tranquilo/desnecessário)", correctAnswer: "longo e geralmente difícil", rationale: "の末に é usado especialmente quando o processo envolveu esforço, dificuldade ou deliberação prolongada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試行錯誤の末に成功した。 (Antes de tentar várias vezes, obteve sucesso./Apesar de tentar várias vezes, obteve sucesso./Após tentativa e erro, obteve sucesso./Sem tentar, obteve sucesso.)", correctAnswer: "Após tentativa e erro, obteve sucesso.", rationale: "試行錯誤の末に = após tentativa e erro. Processo de acertos e erros que culminou no sucesso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "激しい議論の末に合意に達した。 (Antes do debate acalorado, chegaram ao acordo./Apesar do debate, chegaram ao acordo./Após debate acalorado, chegaram a um acordo./Sem debate, chegaram ao acordo.)", correctAnswer: "Após debate acalorado, chegaram a um acordo.", rationale: "激しい議論の末に = após debate acalorado. O longo e intenso debate levou ao acordo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考え抜いた末に答えが出た。 (Antes de pensar muito, a resposta surgiu./Depois de muito pensar até o fim, a resposta surgiu./Sem pensar, a resposta surgiu./Apesar de pensar, a resposta não surgiu.)", correctAnswer: "Depois de muito pensar até o fim, a resposta surgiu.", rationale: "考え抜いた末に = após pensar exaustivamente. 抜く indica que fez a ação completamente até o fim.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "の末に pode ser precedido por (apenas substantivos/substantivos e verbos na forma た/apenas adjetivos/apenas verbos na forma て)", correctAnswer: "substantivos e verbos na forma た", rationale: "長い交渉の末に (substantivo) ou 悩んだ末に (verbo た+末に) — ambas as formas são corretas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "長年の研究の末に新薬が開発された。 (Antes de anos de pesquisa, o remédio foi desenvolvido./Apesar de anos de pesquisa, o remédio foi desenvolvido./Após anos de pesquisa, um novo medicamento foi desenvolvido./Sem pesquisa, o remédio foi desenvolvido.)", correctAnswer: "Após anos de pesquisa, um novo medicamento foi desenvolvido.", rationale: "長年の研究の末に = após anos de pesquisa. O longo esforço levou ao desenvolvimento do medicamento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "の末に geralmente é seguido de (um resultado negativo apenas/um resultado positivo apenas/qualquer resultado, positivo ou negativo/sempre pelo fracasso)", correctAnswer: "qualquer resultado, positivo ou negativo", rationale: "の末に pode ser seguido de sucesso (成功) ou fracasso (失敗). O que importa é o processo longo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "何度も相談した末に断念した。 (Antes de consultar várias vezes, desistiu./Após consultar várias vezes, desistiu./Sem consultar ninguém, desistiu./Apesar de consultar, não desistiu.)", correctAnswer: "Após consultar várias vezes, desistiu.", rationale: "何度も相談した末に = após consultar muitas vezes. O processo levou à desistência.", difficulty: 5, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frases complexas com ～の末に
    description: Escolha a tradução correta da frase.
    exercises:
      - { type: japanese_vocab, question: "五年間の研究の末に論文を発表した。 (Antes de cinco anos de pesquisa, publicou a tese./Após cinco anos de pesquisa, publicou a tese./Apesar de cinco anos de pesquisa, não publicou./Sem pesquisa, publicou a tese.)", correctAnswer: "Após cinco anos de pesquisa, publicou a tese.", rationale: "五年間の研究の末に = após cinco anos de pesquisa. Longa jornada acadêmica culminando na publicação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "熟考の末に辞職を決意した。 (Antes de ponderar, decidiu demitir-se./Após ponderar profundamente, decidiu demitir-se./Sem ponderar, decidiu demitir-se./Apesar de ponderar, não decidiu.)", correctAnswer: "Após ponderar profundamente, decidiu demitir-se.", rationale: "熟考の末に = após reflexão profunda. 熟考 (じゅっこう) = ponderação cuidadosa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "の末に vs の後で (の末に destaca o processo difícil; の後で é neutro/の後で destaca o processo difícil; の末に é neutro/são completamente iguais/の末に é mais informal)", correctAnswer: "の末に destaca o processo difícil; の後で é neutro", rationale: "の後で simplesmente indica sequência temporal. の末に destaca que houve um processo longo e árduo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "激しい競争の末に優勝を果たした。 (Antes da competição acirrada, conquistou o título./Após competição acirrada, conquistou o título./Apesar da competição, ganhou./Sem competição, ganhou.)", correctAnswer: "Após competição acirrada, conquistou o título.", rationale: "激しい競争の末に = após competição acirrada. A vitória veio depois de árdua disputa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "長い闘病の末に亡くなった。 (Antes de longa batalha com a doença, faleceu./Após longa batalha com a doença, veio a falecer./Apesar da doença, se recuperou./Sem doença, faleceu.)", correctAnswer: "Após longa batalha com a doença, veio a falecer.", rationale: "長い闘病の末に = após longa batalha contra a doença. Expressão usada em notícias de falecimento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "散々迷った末に留学を諦めた。 (Antes de muito hesitar, desistiu do intercâmbio./Após hesitar muito, desistiu do intercâmbio./Sem hesitar, desistiu do intercâmbio./Apesar de hesitar, decidiu fazer o intercâmbio.)", correctAnswer: "Após hesitar muito, desistiu do intercâmbio.", rationale: "散々迷った末に = após muita indecisão. O longo processo de dúvida levou à desistência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "の末に pode ter resultado positivo E negativo? (Apenas positivo./Apenas negativo, como morte ou fracasso./Sim, pode ser positivo ou negativo./Apenas resultado neutro.)", correctAnswer: "Sim, pode ser positivo ou negativo.", rationale: "の末に é neutro quanto ao resultado: 成功した (sucesso) e 亡くなった (falecimento) são igualmente possíveis.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "幾多の困難の末に夢を実現した。 (Antes de inúmeras dificuldades, realizou o sonho./Apesar de inúmeras dificuldades, não realizou./Após inúmeras dificuldades, realizou o sonho./Sem dificuldades, realizou o sonho.)", correctAnswer: "Após inúmeras dificuldades, realizou o sonho.", rationale: "幾多の困難の末に = após inúmeras dificuldades. Jornada árdua que culminou na realização do sonho.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "交渉が決裂した末に訴訟に発展した。 (Antes de as negociações fracassarem, virou processo./Após as negociações fracassarem, desenvolveu-se em processo judicial./Apesar do fracasso, não virou processo./Sem negociações, virou processo.)", correctAnswer: "Após as negociações fracassarem, desenvolveu-se em processo judicial.", rationale: "交渉が決裂した末に = após as negociações fracassarem. O processo foi o resultado do longo impasse.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "長期にわたる審議の末に法案が可決された。 (Antes de deliberações longas, o projeto foi aprovado./Após deliberações longas, o projeto de lei foi aprovado./Apesar das deliberações, o projeto foi rejeitado./Sem deliberações, o projeto foi aprovado.)", correctAnswer: "Após deliberações longas, o projeto de lei foi aprovado.", rationale: "長期にわたる審議の末に = após deliberações de longo prazo. Processo legislativo extenso.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
