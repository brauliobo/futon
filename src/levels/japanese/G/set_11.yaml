title: 📝 ～ても～ても (mesmo que / por mais que)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ても～ても expressa que mesmo repetindo uma ação, o resultado esperado não ocorre. A mesma partícula ても é repetida para ênfase. Equivalente a 'por mais que faça... ainda assim...'."
example: "Repetição sem resultado. Ex.: 食べても食べてもお腹がすく → Por mais que eu coma, continuo com fome."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～ても～ても
    description: Escolha o significado correto das frases com ～ても～ても.
    exercises:
      - { type: japanese_vocab, question: "食べても食べてもお腹がすく (comi e fiquei satisfeito/por mais que eu coma continuo com fome/não tenho apetite/comi demais)", correctAnswer: "por mais que eu coma continuo com fome", rationale: "食べても食べても → por mais que coma + お腹がすく = continua com fome.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "寝ても寝ても眠い (dormiu bem/por mais que durma continua sonolento/não consegue dormir/dormiu pouco)", correctAnswer: "por mais que durma continua sonolento", rationale: "寝ても寝ても → por mais que durma + 眠い = ainda sonolento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "勉強しても勉強しても成績が上がらない (as notas subiram/por mais que estude as notas não sobem/não precisa estudar/as aulas são fáceis)", correctAnswer: "por mais que estude as notas não sobem", rationale: "勉強しても勉強しても → por mais que estude + 成績が上がらない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "待っても待っても来ない (chegou rapidamente/por mais que espere não vem/não quer esperar/já desistiu)", correctAnswer: "por mais que espere não vem", rationale: "待っても待っても → por mais que espere + 来ない = não aparece.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考えても考えても答えが出ない (achou a resposta/por mais que pense não encontra a resposta/a pergunta é fácil/desistiu de pensar)", correctAnswer: "por mais que pense não encontra a resposta", rationale: "考えても考えても → por mais que pense + 答えが出ない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "練習しても練習しても上手にならない (melhorou rápido/por mais que pratique não melhora/desistiu de praticar/a habilidade é fácil)", correctAnswer: "por mais que pratique não melhora", rationale: "練習しても練習しても → por mais que pratique + 上手にならない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "呼んでも呼んでも返事がない (respondeu prontamente/por mais que chame não há resposta/não precisa chamar/a resposta foi rápida)", correctAnswer: "por mais que chame não há resposta", rationale: "呼んでも呼んでも → por mais que chame + 返事がない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "掃除しても掃除してもきれいにならない (ficou limpo/por mais que limpe não fica limpo/não precisa limpar/está sempre limpo)", correctAnswer: "por mais que limpe não fica limpo", rationale: "掃除しても掃除しても → por mais que limpe + きれいにならない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "聞いても聞いても覚えられない (memorizou tudo/por mais que ouça não consegue memorizar/a música é fácil/desistiu de ouvir)", correctAnswer: "por mais que ouça não consegue memorizar", rationale: "聞いても聞いても → por mais que ouça + 覚えられない.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "走っても走っても着かない (chegou rapidamente/por mais que corra não chega/parou de correr/está perto)", correctAnswer: "por mais que corra não chega", rationale: "走っても走っても → por mais que corra + 着かない = não chega.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ても～ても
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "～ても～ても indica: (ação completada/repetição sem resultado esperado/ação futura/decisão)", correctAnswer: "repetição sem resultado esperado", rationale: "A estrutura essencial: repete ação mas o resultado não ocorre.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "薬を飲んでも___ても熱が下がらない (飲ん/飲む/飲み/飲ま)", correctAnswer: "飲ん", rationale: "飲んでも飲んでも → por mais que tome (o remédio).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Como dizer 'por mais que chore não resolve'? (泣いても泣いてもダメだ/泣いたら解決する/泣けば大丈夫/泣くことにした)", correctAnswer: "泣いても泣いてもダメだ", rationale: "泣いても泣いても → por mais que chore + ダメだ = não resolve.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "洗っても洗っても___が落ちない (汚れ/きれい/洗い/水)", correctAnswer: "汚れ", rationale: "汚れが落ちない → a sujeira não sai.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa ～ても～ても corretamente? (食べても眠い/寝ても寝ても疲れが取れない/行けば来ない/するとできない)", correctAnswer: "寝ても寝ても疲れが取れない", rationale: "Estrutura correta: mesmo verbo repetido com ても.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "探して___探しても見つからない (も/に/が/を)", correctAnswer: "も", rationale: "探しても探しても → por mais que procure (verbo + ても repetido).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "謝っても謝っても___てもらえない (許し/怒り/笑い/泣き)", correctAnswer: "許し", rationale: "謝っても謝っても許してもらえない → por mais que se desculpe não é perdoado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ても～ても requer: (dois verbos diferentes/o mesmo verbo repetido/um verbo e um adjetivo/dois adjetivos)", correctAnswer: "o mesmo verbo repetido", rationale: "A estrutura usa o mesmo verbo na forma て+も duas vezes para ênfase.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "いくら___ても___てもの 'いくら' significa: (quanto/por mais que/assim que/a menos que)", correctAnswer: "por mais que", rationale: "いくら～ても → por mais que... (reforça a concessão).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "言っても言っても___かない (聞/見/書/食べ)", correctAnswer: "聞", rationale: "言っても言っても聞かない → por mais que diga não escuta.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
