title: 🔢 Kanji N3 — 社会政治 (sociedade e política)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N3 do campo social e político: 社 (companhia/sociedade), 会 (reunião/encontro), 政 (governo/política), 治 (governar/curar). Essenciais para leitura de notícias."
example: "Leia o kanji e identifique o significado. Ex.: 社会 → sociedade."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Kanji sociais — leitura
    description: Leia a palavra e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "社会 (しゃかい) (empresa/governo/sociedade/reunião)", correctAnswer: "sociedade", rationale: "Kanji: 社(companhia/grupo) + 会(encontro) → 社会(しゃかい) = o grupo que se encontra = sociedade.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "政治 (せいじ) (sociedade/economia/política/lei)", correctAnswer: "política", rationale: "Kanji: 政(governar) + 治(curar/administrar) → 政治(せいじ) = arte de governar = política.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会議 (かいぎ) (eleição/reunião/empresa/política)", correctAnswer: "reunião", rationale: "Kanji: 会(encontro) + 議(deliberar) → 会議(かいぎ) = encontro para deliberar = reunião/conferência.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "政策 (せいさく) (política pública/lei/reunião/sociedade)", correctAnswer: "política pública", rationale: "Kanji: 政(governar) + 策(plano/medida) → 政策(せいさく) = plano de governo = política pública.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社長 (しゃちょう) (diretor/presidente da empresa/político/senador)", correctAnswer: "presidente da empresa", rationale: "Kanji: 社(empresa) + 長(chefe/líder) → 社長(しゃちょう) = chefe da empresa = presidente/CEO.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "自治 (じち) (autonomia/política/sociedade/eleição)", correctAnswer: "autonomia", rationale: "Kanji: 自(si mesmo) + 治(governar) → 自治(じち) = governar a si mesmo = autogoverno/autonomia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "政府 (せいふ) (empresa/ministério/governo/partido)", correctAnswer: "governo", rationale: "Kanji: 政(governar) + 府(sede/autoridade) → 政府(せいふ) = sede do governo = governo/administração estatal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会社 (かいしゃ) (reunião/empresa/sociedade/partido)", correctAnswer: "empresa", rationale: "Kanji: 会(encontro/associação) + 社(grupo/organização) → 会社(かいしゃ) = organização associada = empresa/companhia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "政党 (せいとう) (governo/lei/partido político/eleição)", correctAnswer: "partido político", rationale: "Kanji: 政(política) + 党(grupo/partido) → 政党(せいとう) = grupo político = partido político.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "統治 (とうち) (governança/sociedade/reunião/política)", correctAnswer: "governança", rationale: "Kanji: 統(unificar/controlar) + 治(administrar) → 統治(とうち) = controlar e administrar = governança.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Kanji sociais — uso em frases
    description: Escolha o kanji ou leitura correta para completar as frases.
    exercises:
      - { type: japanese_vocab, question: "___問題が深刻だ (社会/政治/会議/社長)", correctAnswer: "社会", rationale: "Composto: 社会(しゃかい) + 問題 → 社会問題 = problema social. 社会 = sociedade.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___家になりたい (政治/社会/会社/自治)", correctAnswer: "政治", rationale: "Composto: 政治(せいじ) + 家(専門家) → 政治家 = especialista em política = político.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明日___があります (会議/政策/統治/政党)", correctAnswer: "会議", rationale: "Contexto: 明日(amanhã) + 会議(reunião) + があります. 会議 → reunião/conferência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しい___を発表した (政策/社会/会社/自治)", correctAnswer: "政策", rationale: "Composto: 新しい(novo) + 政策(せいさく) + を発表 → anunciou nova política pública.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___に就職した (会社/政治/社会/統治)", correctAnswer: "会社", rationale: "Estrutura: 会社(empresa) + に就職した → conseguiu emprego em empresa. 会社 = empresa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___体制が変わった (統治/会議/社長/政策)", correctAnswer: "統治", rationale: "Composto: 統治(とうち) + 体制 → 統治体制 = sistema de governança. 統治 = governar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "与野党の___が対立する (政党/政府/社会/会議)", correctAnswer: "政党", rationale: "Composto: 与野党(governo e oposição) + の + 政党(partidos) → partidos do governo e da oposição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___が新法案を提出した (政府/社会/会社/自治)", correctAnswer: "政府", rationale: "Contexto: 政府(governo) + が + 法案を提出 → o governo apresentou projeto de lei.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___が問題解決に取り組む (社会/政治/会議/自治)", correctAnswer: "社会", rationale: "Contexto: 社会(sociedade) + が + 問題解決 → a sociedade enfrenta a resolução do problema.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "地域___体が活躍する (自治/政策/統治/社長)", correctAnswer: "自治", rationale: "Composto: 地域(região) + 自治(じち) + 体 → 地域自治体 = governo/município local.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
