title: 🔢 Kanji N3 — 社会政治 (sociedade e política)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N3 do campo social e político: 社 (companhia/sociedade), 会 (reunião/encontro), 政 (governo/política), 治 (governar/curar). Essenciais para leitura de notícias."
example: "Leia o kanji e identifique o significado. Ex.: 社会 → sociedade."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Kanji sociais — leitura
    description: Leia a palavra e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "社会 (しゃかい) (empresa/governo/sociedade/reunião)", correctAnswer: "sociedade", rationale: "社会 (しゃかい) = sociedade, o conjunto da comunidade humana.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "政治 (せいじ) (sociedade/economia/política/lei)", correctAnswer: "política", rationale: "政治 (せいじ) = política, governo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会議 (かいぎ) (reunião/empresa/política/eleição)", correctAnswer: "reunião", rationale: "会議 (かいぎ) = reunião, conferência.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "政策 (せいさく) (política pública/lei/reunião/sociedade)", correctAnswer: "política pública", rationale: "政策 (せいさく) = política pública, medida governamental.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社長 (しゃちょう) (diretor/presidente da empresa/político/senador)", correctAnswer: "presidente da empresa", rationale: "社長 (しゃちょう) = presidente/CEO de uma empresa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "自治 (じち) (autonomia/política/sociedade/eleição)", correctAnswer: "autonomia", rationale: "自治 (じち) = autogoverno, autonomia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "政府 (せいふ) (empresa/ministério/governo/partido)", correctAnswer: "governo", rationale: "政府 (せいふ) = governo, administração estatal.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会社 (かいしゃ) (reunião/empresa/sociedade/partido)", correctAnswer: "empresa", rationale: "会社 (かいしゃ) = empresa, companhia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "政党 (せいとう) (governo/lei/partido político/eleição)", correctAnswer: "partido político", rationale: "政党 (せいとう) = partido político.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "統治 (とうち) (governança/sociedade/reunião/política)", correctAnswer: "governança", rationale: "統治 (とうち) = governar, administrar um território.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Kanji sociais — uso em frases
    description: Escolha o kanji ou leitura correta para completar as frases.
    exercises:
      - { type: japanese_vocab, question: "___問題が深刻だ (社会/政治/会議/社長)", correctAnswer: "社会", rationale: "社会問題 = problema social.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___家になりたい (政治/社会/会社/自治)", correctAnswer: "政治", rationale: "政治家 (せいじか) = político.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明日___があります (会議/政策/統治/政党)", correctAnswer: "会議", rationale: "明日会議があります = amanhã há uma reunião.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しい___を発表した (政策/社会/会社/自治)", correctAnswer: "政策", rationale: "新しい政策を発表した = anunciou uma nova política pública.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___に就職した (会社/政治/社会/統治)", correctAnswer: "会社", rationale: "会社に就職した = conseguiu emprego em uma empresa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___体制が変わった (統治/会議/社長/政策)", correctAnswer: "統治", rationale: "統治体制 = sistema de governança.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "与野党の___が対立する (政党/政府/社会/会議)", correctAnswer: "政党", rationale: "与野党の政党 = partidos do governo e da oposição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___が新法案を提出した (政府/社会/会社/自治)", correctAnswer: "政府", rationale: "政府が法案を提出した = o governo apresentou um projeto de lei.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___が問題解決に取り組む (社会/政治/会議/自治)", correctAnswer: "社会", rationale: "社会が問題解決に取り組む = a sociedade enfrenta a resolução do problema.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "地域___体が活躍する (自治/政策/統治/社長)", correctAnswer: "自治", rationale: "地域自治体 = governo local/município.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
