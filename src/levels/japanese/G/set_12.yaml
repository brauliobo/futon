title: 📝 ～さえ～ば (desde que / basta que)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～さえ～ば expressa condição mínima suficiente: 'desde que X, Y ocorre'. さえ indica 'até mesmo' ou 'apenas isso é suficiente'. Conecta a condição mínima ao resultado desejado."
example: "Condição mínima. Ex.: お金さえあれば、旅行できる → Desde que tenha dinheiro, posso viajar."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～さえ～ば
    description: Escolha o significado correto das frases com ～さえ～ば.
    exercises:
      - { type: japanese_vocab, question: "お金さえあれば、旅行できる (preciso de muito dinheiro/desde que tenha dinheiro posso viajar/não tenho dinheiro/viajar é caro)", correctAnswer: "desde que tenha dinheiro posso viajar", rationale: "お金さえあれば → desde que haja dinheiro + できる → é possível.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康でさえあれば、何でもできる (a saúde não importa/desde que seja saudável posso fazer qualquer coisa/preciso de mais que saúde/não estou saudável)", correctAnswer: "desde que seja saudável posso fazer qualquer coisa", rationale: "健康で + さえあれば → desde que esteja saudável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あなたさえいれば、大丈夫だ (sem você está tudo bem/desde que você esteja cá está tudo bem/preciso de outras pessoas/você não é necessário)", correctAnswer: "desde que você esteja cá está tudo bem", rationale: "あなたさえいれば → desde que você esteja + 大丈夫 → está tudo bem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この薬を飲みさえすれば、治る (preciso de mais tratamentos/basta tomar este remédio para curar/o remédio não funciona/o médico disse não)", correctAnswer: "basta tomar este remédio para curar", rationale: "飲みさえすれば → basta tomar + 治る → cura.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "練習さえすれば、上手になる (precisa de talento/basta praticar para melhorar/a prática não ajuda/é impossível melhorar)", correctAnswer: "basta praticar para melhorar", rationale: "練習さえすれば → basta praticar + 上手になる → melhora.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女さえ来れば、パーティーが始まる (a festa já começou/desde que ela venha a festa começa/a festa será cancelada/ela não vai vir)", correctAnswer: "desde que ela venha a festa começa", rationale: "彼女さえ来れば → desde que ela venha + パーティーが始まる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "天気さえよければ、出かける (sairei com qualquer tempo/desde que o tempo esteja bom sairei/não gosto de sair/vai chover)", correctAnswer: "desde que o tempo esteja bom sairei", rationale: "天気さえよければ → desde que o tempo esteja bom.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "許可さえ取れば、進められる (precisa de mais aprovações/basta obter a permissão para avançar/a permissão foi negada/não precisa de permissão)", correctAnswer: "basta obter a permissão para avançar", rationale: "許可さえ取れば → basta obter permissão + 進められる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語さえできれば、就職できる (precisa de mais habilidades/basta saber japonês para conseguir emprego/japonês não é útil/o emprego está garantido)", correctAnswer: "basta saber japonês para conseguir emprego", rationale: "日本語さえできれば → desde que saiba japonês + 就職できる.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "時間さえあれば、読みたい (não tenho tempo/desde que tenha tempo quero ler/tenho muito tempo/já li)", correctAnswer: "desde que tenha tempo quero ler", rationale: "時間さえあれば → desde que haja tempo + 読みたい.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～さえ～ば
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "さえ～ば indica: (condição múltipla/condição mínima suficiente/condição impossível/condição passada)", correctAnswer: "condição mínima suficiente", rationale: "さえ～ば → 'apenas isso é suficiente como condição'.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お金さえ___ば、買える (あれ/あり/ある/あっ)", correctAnswer: "あれ", rationale: "ある → あれ (forma ば de ある) = se houver.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Como usar さえすれば com する? (しさえすれば/するさえば/させすれば/すさえれば)", correctAnswer: "しさえすれば", rationale: "動詞+さえすれば: 飲みさえすれば、練習さえすれば — する → しさえすれば.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼___さえいれば安心だ (が/を/に/で)", correctAnswer: "が", rationale: "彼がいる → 彼さえいれば — さえ substitui が na condição.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康___さえあれば (で/が/は/に)", correctAnswer: "で", rationale: "健康 (な adj.) → 健康でさえあれば = desde que esteja saudável.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa さえ～ば corretamente? (行けさえばいい/お金さえあればいい/するさえすればいい/来るさえれば)", correctAnswer: "お金さえあればいい", rationale: "お金さえあればいい → basta ter dinheiro — estrutura correta.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試験___さえ合格すれば (に/が/を/で)", correctAnswer: "に", rationale: "試験に合格する → 試験にさえ合格すれば = desde que passe no exame.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "さえ indica que a condição é: (difícil/mínima e suficiente/múltipla/impossível)", correctAnswer: "mínima e suficiente", rationale: "さえ → 'apenas isso' — realça que aquela é a condição essencial.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "静か___さえあれば集中できる (で/に/が/を)", correctAnswer: "で", rationale: "静か (な adj.) → 静かでさえあれば = desde que seja silencioso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "好き___さえあれば何でもできる (で/に/が/を)", correctAnswer: "で", rationale: "好き (な adj.) → 好きでさえあれば = desde que goste.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
