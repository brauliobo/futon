title: 📝 ～わけだ (é claro que / por isso é que)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～わけだ expressa que algo é a conclusão lógica ou natural de uma situação. Tom de 'então é por isso que' ou 'claro que'. Indica que o falante agora entende a razão."
example: "Conclusão lógica. Ex.: 10年日本に住んでいた。なるほど、日本語が上手なわけだ → Morou no Japão por 10 anos. Claro, é por isso que fala japonês bem."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～わけだ
    description: Escolha o significado correto das frases com ～わけだ.
    exercises:
      - { type: japanese_vocab, question: "日本に10年住んでいた。日本語が上手なわけだ (é estranho que fale bem japonês/claro que fala japonês bem/não fala japonês/o japonês é difícil)", correctAnswer: "claro que fala japonês bem", rationale: "わけだ = conclusão lógica — morou 10 anos no Japão, então é natural falar bem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は医者だ。だから、体のことに詳しいわけだ (é estranho que saiba sobre saúde/claro que sabe sobre saúde/não sabe nada de medicina/ele odeia medicina)", correctAnswer: "claro que sabe sobre saúde", rationale: "医者 (médico) → わけだ = conclusão lógica de que sabe sobre saúde.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "3日も寝ていない。疲れているわけだ (não está cansado/é estranho estar cansado/está cansado por razão lógica/dormiu bem)", correctAnswer: "está cansado por razão lógica", rationale: "3日間寝ていない → わけだ = claro que está cansado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は毎日練習している。上手になるわけだ (ela não melhora/é estranho que melhore/claro que melhora/ela parou de praticar)", correctAnswer: "claro que melhora", rationale: "毎日練習 → わけだ = é natural que melhore.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "朝から何も食べていない。お腹が空くわけだ (não está com fome/é estranho ter fome/claro que está com fome/comeu bastante)", correctAnswer: "claro que está com fome", rationale: "朝から何も食べていない → わけだ = conclusão lógica de ter fome.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は大学で経済学を専攻した。経済に詳しいわけだ (não sabe de economia/é estranho que saiba/claro que é especialista em economia/odeia economia)", correctAnswer: "claro que é especialista em economia", rationale: "経済学専攻 → わけだ = faz sentido ser especialista.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "昨日徹夜した。今日眠いわけだ (dormiu bem/é estranho ter sono/claro que está sonolento hoje/não ficou acordado)", correctAnswer: "claro que está sonolento hoje", rationale: "徹夜 (ficar acordado a noite toda) → わけだ = sonolência lógica.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "20年前に来たのか。道理で詳しいわけだ (não sabe do caminho/é estranho conhecer/claro que conhece bem — veio há 20 anos/chegou recentemente)", correctAnswer: "claro que conhece bem — veio há 20 anos", rationale: "道理で = por isso mesmo + わけだ = confirmação lógica.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供の頃からピアノを習っていた。上手なわけだ (é estranho ser bom/claro que toca bem/não toca piano/começou recentemente)", correctAnswer: "claro que toca bem", rationale: "Aprender piano desde criança → わけだ = é natural ser habilidoso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は社長だ。忙しいわけだ (não é ocupado/é estranho ser ocupado/claro que é ocupado/tem muito tempo livre)", correctAnswer: "claro que é ocupado", rationale: "社長 (presidente da empresa) → わけだ = ser ocupado é a conclusão lógica.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～わけだ
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "わけだ indica: (suposição/conclusão lógica natural/desejo/proibição)", correctAnswer: "conclusão lógica natural", rationale: "わけだ = 'faz sentido que' / conclusão a partir de premissas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "フランス出身だから、フランス語が上手な___ (わけだ/はずだ/ようだ/らしい)", correctAnswer: "わけだ", rationale: "わけだ = claro que fala francês bem — conclusão lógica da origem.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual a diferença entre わけだ e はずだ? (mesma coisa/わけだ = conclusão lógica já confirmada; はずだ = expectativa/わけだ = expectativa; はずだ = conclusão/ambos são suposições)", correctAnswer: "わけだ = conclusão lógica já confirmada; はずだ = expectativa", rationale: "わけだ confirma entendimento; はずだ expressa expectativa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "毎日8時間勉強した。合格した___ (わけだ/わけではない/わけがない/わけがある)", correctAnswer: "わけだ", rationale: "毎日8時間勉強 + 合格 → わけだ = faz sentido ter passado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "なるほど、そういう___ (わけだ/ようだ/らしい/かもしれない)", correctAnswer: "わけだ", rationale: "なるほど (ah entendi) + わけだ = 'então é por isso que' — expressão de compreensão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "道理で高い___ (わけだ/ようだ/らしい/はずだ)", correctAnswer: "わけだ", rationale: "道理で (é por isso que) + わけだ = compreensão da razão.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual responde 'ah, então é por isso que...' em japonês? (なるほど、わけだ/そのはずだ/ようだね/かもしれない)", correctAnswer: "なるほど、わけだ", rationale: "なるほど + わけだ = expressão de compreensão repentina.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "5年間も日本で働いていた。日本語が上手な___ (わけだ/わけではない/わけがない/ようがない)", correctAnswer: "わけだ", rationale: "Trabalhar no Japão por 5 anos → わけだ = claro que fala bem.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "わけだ conecta com: (substantivo+な/verbo forma る/い adj./todos anteriores)", correctAnswer: "todos anteriores", rationale: "わけだ aceita substantivo+な、verbo、い adj. — é versátil.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "そうか、彼女が遅れた___ (わけだ/ようだ/かもしれない/だろう)", correctAnswer: "わけだ", rationale: "そうか (entendo) + わけだ = 'então é por isso que ela se atrasou'.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
