title: 📝 ～に過ぎない (nada mais que / apenas)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～に過ぎない expressa que algo é apenas/somente o que é, sem mais. Tom de minimização ou humildade. Equivalente a 'não passa de' ou 'é apenas'."
example: "Minimização. Ex.: これは私の意見に過ぎない → Isso não passa de minha opinião."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～に過ぎない
    description: Escolha o significado correto das frases com ～に過ぎない.
    exercises:
      - { type: japanese_vocab, question: "これは私の意見に過ぎない (esta é uma opinião importante/isso não passa de minha opinião/minha opinião é certa/todos concordam comigo)", correctAnswer: "isso não passa de minha opinião", rationale: "Regra: 名詞 + に過ぎない → minimização. 意見(opinião) + に過ぎない → não passa de minha opinião.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼は学生に過ぎない (ele é um professor/ele não é mais que um estudante/ele é muito importante/ele tem autoridade)", correctAnswer: "ele não é mais que um estudante", rationale: "Regra: 名詞 + に過ぎない → minimização. 学生(estudante) + に過ぎない → não passa de um estudante.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "それは偶然に過ぎなかった (foi planejado/não passou de coincidência/foi um milagre/era inevitável)", correctAnswer: "não passou de coincidência", rationale: "Regra: 名詞 + に過ぎなかった → minimização no passado. 偶然(coincidência) + に過ぎなかった → foi apenas coincidência.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "私は一般市民に過ぎません (sou uma pessoa famosa/não sou mais que um cidadão comum/tenho muito poder/sou um especialista)", correctAnswer: "não sou mais que um cidadão comum", rationale: "Regra: 名詞 + に過ぎません → minimização/humildade. 一般市民 + に過ぎません → sou apenas um cidadão comum.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは始まりに過ぎない (já está terminado/ainda falta muito/não passou do começo/o fim está próximo)", correctAnswer: "não passou do começo", rationale: "Regra: 名詞 + に過ぎない → minimização. 始まり(começo) + に過ぎない → é apenas o começo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の言葉は冗談に過ぎなかった (ele estava sendo sério/não passou de uma brincadeira/foi uma ameaça/era uma promessa)", correctAnswer: "não passou de uma brincadeira", rationale: "Regra: 名詞 + に過ぎなかった → minimização no passado. 冗談(brincadeira) + に過ぎなかった → foi apenas uma brincadeira.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "私の日本語はまだ初心者レベルに過ぎない (meu japonês é avançado/meu japonês não passa do nível iniciante/sou fluente/já terminei de estudar)", correctAnswer: "meu japonês não passa do nível iniciante", rationale: "Regra: 名詞 + に過ぎない → minimização. 初心者レベル + に過ぎない → ainda estou apenas no nível iniciante.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは推測に過ぎません (é um fato comprovado/não passa de uma suposição/é uma certeza/está confirmado)", correctAnswer: "não passa de uma suposição", rationale: "Regra: 名詞 + に過ぎません → minimização. 推測(suposição) + に過ぎません → é apenas uma especulação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "10人に過ぎない参加者 (mais de 100 participantes/os participantes foram apenas 10/todos participaram/muitos participantes)", correctAnswer: "os participantes foram apenas 10", rationale: "Regra: 数量 + に過ぎない → minimização numérica. 10人 + に過ぎない → eram apenas 10 pessoas.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "それは表面上の問題に過ぎない (é um problema profundo/não passa de um problema superficial/o problema foi resolvido/é um problema grave)", correctAnswer: "não passa de um problema superficial", rationale: "Regra: 名詞句 + に過ぎない → minimização. 表面上の問題 + に過ぎない → é apenas um problema superficial.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～に過ぎない
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "に過ぎない indica: (exageração/minimização/proibição/desejo)", correctAnswer: "minimização", rationale: "Regra: に過ぎない = não é mais que X → minimiza/relativiza o que foi dito.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは私の___に過ぎません (意見/考えた/思って/言って)", correctAnswer: "意見", rationale: "Regra: に過ぎない conecta com 名詞(substantivo). 意見(substantivo) + に過ぎません → forma correta; 考えた/思って são verbos conjugados.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Como dizer 'não passa de um boato' em japonês? (うわさに過ぎない/うわさのはずだ/うわさに限る/うわさのようだ)", correctAnswer: "うわさに過ぎない", rationale: "Regra: 名詞 + に過ぎない → minimização. うわさ(boato) + に過ぎない → não passa de um boato.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "一時的な現象___過ぎない (に/が/を/で)", correctAnswer: "に", rationale: "Regra: 名詞/名詞句 + に + 過ぎない. 現象(fenômeno) + に + 過ぎない = é apenas um fenômeno temporário.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に過ぎない conecta com: (substantivo e verbo forma る/apenas adjetivos/forma て/forma た apenas)", correctAnswer: "substantivo e verbo forma る", rationale: "Regra: に過ぎない → 名詞 + に過ぎない / 動詞(辞書形) + に過ぎない. Ex.: 学生に過ぎない / 寝るに過ぎない.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "これは一時的な解決___過ぎない (に/が/を/で)", correctAnswer: "に", rationale: "Regra: 名詞句 + に + 過ぎない. 解決(solução) + に + 過ぎない = é apenas uma solução temporária.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual usa に過ぎない corretamente? (行くに過ぎない/学生に過ぎない/美しいに過ぎない/高いに過ぎない)", correctAnswer: "学生に過ぎない", rationale: "Regra: に過ぎない aceita 名詞 ou 動詞辞書形, não adjetivos-い diretamente. 学生(substantivo) + に過ぎない → correto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "그 成功は運___過ぎなかった (に/が/を/は)", correctAnswer: "に", rationale: "Regra: 名詞 + に + 過ぎなかった. 運(sorte) + に + 過ぎなかった = não passou de sorte.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "に過ぎない é frequentemente usado para expressar: (orgulho/humildade ou minimização/entusiasmo/certeza)", correctAnswer: "humildade ou minimização", rationale: "Função: に過ぎない → minimiza importância ou expressa humildade. Ex.: 私の意見に過ぎない = é só minha opinião (humildade).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "言い訳___過ぎない (に/が/を/で)", correctAnswer: "に", rationale: "Regra: 名詞 + に + 過ぎない. 言い訳(desculpa) + に + 過ぎない = não passa de uma desculpa.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
