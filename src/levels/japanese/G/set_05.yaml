title: 📝 ～ことになる (ficou decidido / acabou sendo)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ことになる indica que algo foi decidido por circunstâncias externas ou por outros, não pela própria pessoa. Também expressa resultado natural de uma situação."
example: "Indica decisão externa ou resultado natural. Ex.: 来月、東京に転勤することになった → Ficou decidido que vou ser transferido para Tóquio no mês que vem."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～ことになる
    description: Escolha o significado correto das frases com ～ことになる.
    exercises:
      - { type: japanese_vocab, question: "来月、東京に転勤することになった (decidi me transferir/ficou decidido que serei transferido/não vou me transferir/a empresa cancelou minha transferência)", correctAnswer: "ficou decidido que serei transferido", rationale: "ことになった = decisão tomada externamente (pela empresa).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "会議は月曜日に行われることになっている (a reunião foi cancelada/a reunião está programada para segunda-feira/decidi fazer a reunião na segunda/a reunião é todo dia)", correctAnswer: "a reunião está programada para segunda-feira", rationale: "ことになっている = decisão/programa já estabelecido.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "結局、日本に残ることになった (decidi ficar no Japão/fui embora do Japão/ficou decidido que eu ficaria no Japão/nunca estive no Japão)", correctAnswer: "ficou decidido que eu ficaria no Japão", rationale: "結局 (no fim das contas) + ことになった = resultado das circunstâncias.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しいルールができることになった (criamos um novo regramento/foi decidido que um novo regramento seria criado/não há novos regramentos/vou criar novas regras)", correctAnswer: "foi decidido que um novo regramento seria criado", rationale: "ことになった = decisão/resultado externo, não da própria pessoa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女と結婚することになった (decidi me casar/foi decidido que me casarei (circunstância)/não vou me casar/ela recusou)", correctAnswer: "foi decidido que me casarei (circunstância)", rationale: "ことになった com casamento indica que as coisas se encaminharam para isso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このプロジェクトは中止になることになった (o projeto foi iniciado/foi decidido que o projeto seria cancelado/decidi cancelar o projeto/o projeto continua)", correctAnswer: "foi decidido que o projeto seria cancelado", rationale: "ことになった = decisão externa de cancelar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来年から新しい制度が始まることになっている (a nova medida foi cancelada/está previsto que uma nova medida começa no próximo ano/decidi iniciar a nova medida/não há mudanças)", correctAnswer: "está previsto que uma nova medida começa no próximo ano", rationale: "ことになっている = previsão/plano já estabelecido.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その法律は廃止されることになった (a lei foi mantida/foi decidido que a lei seria revogada/decidi revogar a lei/a lei é nova)", correctAnswer: "foi decidido que a lei seria revogada", rationale: "廃止される + ことになった = decisão externa de revogar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "急に海外に行くことになった (decidi ir ao exterior/estava planejando ir/de repente ficou decidido que eu iria ao exterior/nunca fui ao exterior)", correctAnswer: "de repente ficou decidido que eu iria ao exterior", rationale: "急に (de repente) + ことになった = mudança inesperada por circunstâncias.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "このビルは取り壊されることになっている (o prédio será construído/está previsto que o prédio será demolido/decidi demolir o prédio/o prédio está em reforma)", correctAnswer: "está previsto que o prédio será demolido", rationale: "取り壊す (demolir) + ことになっている = previsão estabelecida.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ことになる
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "Qual frase indica que a decisão foi tomada por OUTROS? (私は転勤することにした/転勤することになった/転勤するようにした/転勤するつもりだ)", correctAnswer: "転勤することになった", rationale: "ことになった = decisão externa; ことにした = decisão própria.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来週から残業する___ (ことになった/ことにした/ようになった/ようにした)", correctAnswer: "ことになった", rationale: "ことになった = foi determinado pela empresa que haverá horas extras.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Como dizer 'está programado para começar às 9h'? (9時に始まることになっている/9時に始まることにしている/9時に始まるようにしている/9時に始まるようになっている)", correctAnswer: "9時に始まることになっている", rationale: "ことになっている = plano/programa estabelecido por decisão externa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "事故の影響で電車が遅れる___ (ことになった/ことにした/ようになった/つもりだ)", correctAnswer: "ことになった", rationale: "Acidente é circunstância externa → ことになった.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual NÃO é um uso típico de ことになる? (promoção decidida pela empresa/casamento encaminhado pelas circunstâncias/regra pessoal de não beber/mudança de cidade por trabalho)", correctAnswer: "regra pessoal de não beber", rationale: "Regra pessoal usa ことにする (決断própria); ことになる é para decisões externas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "社長が変わる___ (ことになりました/ことにしました/ようになりました/はずです)", correctAnswer: "ことになりました", rationale: "ことになりました = foi decidido/resultou que o presidente mudaria (forma polida).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ことになっている indica: (decisão pessoal atual/plano/programa já estabelecido/ação habitual/mudança gradual)", correctAnswer: "plano/programa já estabelecido", rationale: "ことになっている = algo que está programado, foi decidido previamente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "卒業後、その会社で働く___ (ことになった/ことにした/ようになった/ようにした)", correctAnswer: "ことになった", rationale: "Após a graduação, foi encaminhado/decidido que trabalharia naquela empresa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ことになる conecta com: (verbo forma る/verbo forma た/adjetivo い/substantivo)", correctAnswer: "verbo forma る", rationale: "ことになる usa a forma do dicionário ou forma negativa do verbo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual par está CORRETO na distinção? (ことにした=externo/ことになった=próprio/ことにした=próprio/ことになった=externo/ambos são próprios/ambos são externos)", correctAnswer: "ことにした=próprio/ことになった=externo", rationale: "する = agente próprio; なる = resultado/agente externo. Esta é a distinção fundamental.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
