title: 💬 Vocabulário N3 — estados e emoções
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Vocabulário N3 para descrever estados psicológicos e emocionais com nuance. Essencial para compreensão de textos literários e conversas maduras."
example: "Aprenda vocabulário emocional N3. Ex.: 焦る → ficar ansioso/apressado."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Vocabulário emocional — reconhecer
    description: Escolha o significado correto do vocabulário emocional.
    exercises:
      - { type: japanese_vocab, question: "焦る (あせる) (relaxar/ficar ansioso e apressado/ficar com fome/ficar cansado)", correctAnswer: "ficar ansioso e apressado", rationale: "焦る = ficar agitado, apressado, ansioso — frequentemente por pressão de tempo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "戸惑う (とまどう) (resolver/ficar confuso e sem saber o que fazer/ficar feliz/descansar)", correctAnswer: "ficar confuso e sem saber o que fazer", rationale: "戸惑う = ficar perplexo, desorientado diante de algo inesperado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "落ち込む (おちこむ) (ficar animado/ficar deprimido e abatido/ficar concentrado/relaxar)", correctAnswer: "ficar deprimido e abatido", rationale: "落ち込む = sentir-se mal, cair no ânimo, ficar abatido.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "怒鳴る (どなる) (sussurrar/gritar com raiva/rir alto/chorar)", correctAnswer: "gritar com raiva", rationale: "怒鳴る = gritar, bradar em tom de raiva.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "照れる (てれる) (ficar envergonhado/tímido/ficar com fome/ficar bravo/ficar com sono)", correctAnswer: "ficar envergonhado/tímido", rationale: "照れる = ficar envergonhado de forma adorável, corar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "憧れる (あこがれる) (odiar/admirar e desejar/ter medo/ficar surpreso)", correctAnswer: "admirar e desejar", rationale: "憧れる = ter admiração e aspiração por algo ou alguém.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "動揺する (どうようする) (ficar calmo/ficar perturbado e agitado/ficar com sono/se concentrar)", correctAnswer: "ficar perturbado e agitado", rationale: "動揺する = ficar abalado, perturbado emocionalmente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "安堵する (あんどする) (ficar preocupado/sentir alívio/ficar com raiva/ficar surpreso)", correctAnswer: "sentir alívio", rationale: "安堵する = sentir alívio após tensão ou preocupação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "後悔する (こうかいする) (se orgulhar/se arrepender/se alegrar/se surpreender)", correctAnswer: "se arrepender", rationale: "後悔する = sentir arrependimento por algo feito ou não feito.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "緊張する (きんちょうする) (relaxar/ficar nervoso e tenso/ficar feliz/ficar com sono)", correctAnswer: "ficar nervoso e tenso", rationale: "緊張する = ficar tenso, nervoso — antes de apresentações, eventos importantes.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Vocabulário emocional — uso em frases
    description: Escolha a palavra correta para completar as frases emocionais.
    exercises:
      - { type: japanese_vocab, question: "試験の前はいつも___ (緊張する/安堵する/落ち込む/照れる)", correctAnswer: "緊張する", rationale: "試験前に緊張する = ficar nervoso antes da prova é natural.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "失敗して___んだ (落ち込んだ/憧れた/照れた/安堵した)", correctAnswer: "落ち込んだ", rationale: "失敗して落ち込む = ficar abatido após falhar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "突然の質問に___ (戸惑った/憧れた/安堵した/後悔した)", correctAnswer: "戸惑った", rationale: "突然の質問 = pergunta repentina → 戸惑う = ficou confuso.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あの歌手に___ている (憧れ/動揺し/落ち込み/後悔し)", correctAnswer: "憧れ", rationale: "あの歌手に憧れている = admira e aspira ser como aquele cantor.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悪いニュースを聞いて___ (動揺した/照れた/安堵した/憧れた)", correctAnswer: "動揺した", rationale: "悪いニュース = notícia ruim → 動揺する = ficou abalado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あの時こうすればよかったと___ (後悔している/憧れている/照れている/焦っている)", correctAnswer: "後悔している", rationale: "こうすればよかった = se tivesse feito assim → 後悔 = arrependimento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生に褒められて___ (照れた/落ち込んだ/動揺した/後悔した)", correctAnswer: "照れた", rationale: "先生に褒められる = ser elogiado pelo professor → 照れる = corar de timidez.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "無事に終わって___ (安堵した/焦った/落ち込んだ/怒鳴った)", correctAnswer: "安堵した", rationale: "無事に終わる = terminar sem problemas → 安堵する = sentiu alívio.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "締め切りが近くて___ (焦っている/安堵している/照れている/憧れている)", correctAnswer: "焦っている", rationale: "締め切りが近い = prazo próximo → 焦る = ficar ansioso e apressado.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供に___ (怒鳴らないでください/安堵しないでください/憧れないでください/照れないでください)", correctAnswer: "怒鳴らないでください", rationale: "子供に怒鳴る = gritar com raiva para a criança — pedido para não fazer.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
