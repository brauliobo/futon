title: 🔢 Kanji N3 — 意味考思 (mente e pensamento)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N3 relacionados à mente e pensamento: 意 (intenção), 味 (sabor/sentido), 考 (pensar), 思 (sentir/pensar). Foco na leitura e significado em contexto."
example: "Leia o kanji e identifique o significado. Ex.: 意味 → significado."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Kanji da mente — leitura
    description: Leia a palavra e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "意味 (いみ) (intenção/significado/sabor/pensamento)", correctAnswer: "significado", rationale: "意(い=mente/intenção) + 味(み=sabor/sentido) → 意味 = o 'sentido' que a mente extrai = significado. Nota: 味 sozinho = sabor de comida; com 意 = sentido abstrato.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考え (かんがえ) (sentimento/memória/pensamento/ideia)", correctAnswer: "pensamento/ideia", rationale: "考(こう/かんが = pensar/examinar) → 考える(verbo) = pensar racionalmente; 考え(substantivo) = resultado do pensar = ideia. Diferença: 思い é emocional; 考え é racional.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "思い (おもい) (sabor/sentimento/intenção/regra)", correctAnswer: "sentimento", rationale: "思(し/おも = sentir/pensar afetivo) → 思う(verbo) = pensar com emoção; 思い(substantivo) = sentimento/emoção. Contraste: 考え(racional) ≠ 思い(emocional/afetivo).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "意見 (いけん) (opinião/intenção/significado/regra)", correctAnswer: "opinião", rationale: "意(い=mente) + 見(けん=ver/ponto de vista) → 意見 = o ponto de vista da mente = opinião. Ex.: 意見を言う = dar opinião; 意見が合わない = opiniões divergem.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "思想 (しそう) (ideia política/sentimento/sabor/regra)", correctAnswer: "ideia política", rationale: "思(し=pensar) + 想(そう=imaginar/conceber) → 思想 = sistema elaborado de ideias = ideologia/filosofia. Escala: 思い(sentimento) < 考え(raciocínio) < 思想(ideologia).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "意図 (いと) (sabor/intenção/memória/consideração)", correctAnswer: "intenção", rationale: "意(い=vontade/mente) + 図(と=plano/esquema) → 意図 = plano da mente = intenção deliberada. Diferença: 意味(significado) vs 意図(propósito). Ex.: 意図的に = intencionalmente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考慮 (こうりょ) (consideração/opinião/sabor/sentimento)", correctAnswer: "consideração", rationale: "考(こう=pensar/examinar) + 慮(りょ=ponderar/prever) → 考慮 = examinar com cuidado = consideração. Fórmula: 考慮に入れる = levar em consideração; 考慮する = considerar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "思考 (しこう) (memória/raciocínio/sentimento/opinião)", correctAnswer: "raciocínio", rationale: "思(し=pensar) + 考(こう=examinar) → 思考 = processo de pensar e examinar = raciocínio. Ex.: 論理的な思考 = raciocínio lógico; 思考力 = capacidade de raciocinar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "意識 (いしき) (consciência/sabor/intenção/sentimento)", correctAnswer: "consciência", rationale: "意(い=mente) + 識(しき=conhecer/distinguir) → 意識 = mente que distingue = consciência. Ex.: 意識する = estar ciente de; 意識を失う = perder a consciência.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考案 (こうあん) (ideia/proposta/sentimento/regra)", correctAnswer: "ideia/proposta", rationale: "考(こう=pensar) + 案(あん=proposta/rascunho) → 考案 = pensar e elaborar uma proposta. Ex.: 新しい方法を考案する = elaborar um novo método; 考案者 = inventor.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Kanji da mente — uso em frases
    description: Escolha o kanji ou leitura correta para completar as frases.
    exercises:
      - { type: japanese_vocab, question: "この言葉の___が分かりません。 (いみ/おもい/かんがえ/いしき)", correctAnswer: "いみ", rationale: "意味(いみ)=significado → 言葉の意味 = significado da palavra. Armadilha: 意識(いしき) também começa com 意 mas = consciência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の___は分かりにくい。 (考え/意識/思想/意味)", correctAnswer: "考え", rationale: "考え(かんがえ)=raciocínio/ideia → 彼の考え = o pensamento racional dele. Armadilha: 思想 seria ideologia (muito formal); 意見 seria opinião expressa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を持って行動する (意図/思い/意識/考案)", correctAnswer: "意図", rationale: "意図(いと)=intenção deliberada → 意図を持って = agindo com propósito. Armadilha: 思い = sentimento espontâneo; 意図 = plano consciente (意=mente + 図=plano).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題について___をください (意見/意味/思想/考案)", correctAnswer: "意見", rationale: "意見(いけん)=opinião → 意見をください = dê sua opinião. 意見を言う/述べる/聞く são colocações fixas. Armadilha: 考え também é ideia mas menos formal.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を失って倒れた (意識/意図/考え/思い)", correctAnswer: "意識", rationale: "意識(いしき)=consciência → 意識を失う = perder a consciência (expressão fixa). 意識が戻る = recuperar a consciência. Armadilha: 意図を失う não é expressão natural.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "深い___で書かれた詩 (思い/意図/考案/意識)", correctAnswer: "思い", rationale: "思い(おもい)=sentimento afetivo → 深い思い = sentimento profundo (emocional). Armadilha: 深い考え = pensamento profundo (intelectual); 思い é mais poético/emocional.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___に入れて決定する (考慮/思想/意味/意識)", correctAnswer: "考慮", rationale: "考慮(こうりょ)=consideração → 考慮に入れる (expressão fixa) = levar em consideração. 考(examinar)+慮(ponderar) → ponderar e examinar antes de decidir.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しい方法を___した (考案/思考/意識/意図)", correctAnswer: "考案", rationale: "考案(こうあん)=elaborar/criar → 方法を考案する = criar/elaborar um método. 考(pensar)+案(proposta) → produz algo novo. Armadilha: 思考する = raciocinar (processo), não criar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "論理的な___が大切だ (思考/思想/意味/意図)", correctAnswer: "思考", rationale: "思考(しこう)=raciocínio → 論理的な思考 = raciocínio lógico. 思(pensar)+考(examinar) → processo mental. Armadilha: 思想 = ideologia (mais amplo); 思考 = processo de raciocinar.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "自由な___を尊重する (思想/意味/意識/考案)", correctAnswer: "思想", rationale: "思想(しそう)=ideologia/filosofia → 自由な思想 = livre pensamento. 思(pensar)+想(conceber) → sistema de ideias. Escala: 思い < 考え < 思想 (mais abstrato/sistemático).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
