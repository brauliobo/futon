title: 🔢 Kanji N3 — 意味考思 (mente e pensamento)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N3 relacionados à mente e pensamento: 意 (intenção), 味 (sabor/sentido), 考 (pensar), 思 (sentir/pensar). Foco na leitura e significado em contexto."
example: "Leia o kanji e identifique o significado. Ex.: 意味 → significado."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Kanji da mente — leitura
    description: Leia a palavra e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "意味 (いみ) (intenção/significado/sabor/pensamento)", correctAnswer: "significado", rationale: "意味 (いみ) = significado, sentido de uma palavra ou ação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考え (かんがえ) (sentimento/memória/pensamento/ideia)", correctAnswer: "pensamento/ideia", rationale: "考え (かんがえ) = ideia, pensamento, opinião.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "思い (おもい) (sabor/sentimento/intenção/regra)", correctAnswer: "sentimento", rationale: "思い (おもい) = sentimento, emoção, pensamento afetivo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "意見 (いけん) (opinião/intenção/significado/regra)", correctAnswer: "opinião", rationale: "意見 (いけん) = opinião, ponto de vista.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "思想 (しそう) (ideia política/sentimento/sabor/regra)", correctAnswer: "ideia política", rationale: "思想 (しそう) = pensamento, ideologia, filosofia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "意図 (いと) (sabor/intenção/memória/consideração)", correctAnswer: "intenção", rationale: "意図 (いと) = intenção, propósito deliberado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考慮 (こうりょ) (consideração/opinião/sabor/sentimento)", correctAnswer: "consideração", rationale: "考慮 (こうりょ) = consideração, levar em conta.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "思考 (しこう) (memória/raciocínio/sentimento/opinião)", correctAnswer: "raciocínio", rationale: "思考 (しこう) = processo de pensar, raciocínio.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "意識 (いしき) (consciência/sabor/intenção/sentimento)", correctAnswer: "consciência", rationale: "意識 (いしき) = consciência, percepção.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "考案 (こうあん) (ideia/proposta/sentimento/regra)", correctAnswer: "ideia/proposta", rationale: "考案 (こうあん) = plano, proposta, ideia elaborada.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Kanji da mente — uso em frases
    description: Escolha o kanji ou leitura correta para completar as frases.
    exercises:
      - { type: japanese_vocab, question: "この言葉の___が分かりません。 (いみ/おもい/かんがえ/いしき)", correctAnswer: "いみ", rationale: "言葉の意味 (いみ) = significado da palavra.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼の___は分かりにくい。 (考え/意識/思想/意味)", correctAnswer: "考え", rationale: "考え (かんがえ) = ideia/pensamento dele é difícil de entender.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を持って行動する (意図/思い/意識/考案)", correctAnswer: "意図", rationale: "意図を持って行動する = agir com intenção.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この問題について___をください (意見/意味/思想/考案)", correctAnswer: "意見", rationale: "意見をください = por favor dê sua opinião.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を失って倒れた (意識/意図/考え/思い)", correctAnswer: "意識", rationale: "意識を失う = perder a consciência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "深い___で書かれた詩 (思い/意図/考案/意識)", correctAnswer: "思い", rationale: "深い思い = sentimento profundo — usado em poesia e literatura.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___に入れて決定する (考慮/思想/意味/意識)", correctAnswer: "考慮", rationale: "考慮に入れる = levar em consideração.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "新しい方法を___した (考案/思考/意識/意図)", correctAnswer: "考案", rationale: "考案する = elaborar, planejar algo novo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "論理的な___が大切だ (思考/思想/意味/意図)", correctAnswer: "思考", rationale: "論理的な思考 = raciocínio lógico.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "自由な___を尊重する (思想/意味/意識/考案)", correctAnswer: "思想", rationale: "自由な思想を尊重する = respeitar o livre pensamento.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
