title: 📝 ～てたまらない (insuportável / não aguentar)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～てたまらない expressa uma sensação ou emoção tão intensa que é quase insuportável. Usa-se com adjetivos い/な na forma て e com verbos. Equivalente a 'não aguento de tão...'."
example: "Emoção insuportável. Ex.: 眠くてたまらない → Estou com um sono insuportável."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～てたまらない
    description: Escolha o significado correto das frases com ～てたまらない.
    exercises:
      - { type: japanese_vocab, question: "眠くてたまらない (estou um pouco sonolento/estou com sono insuportável/não consigo dormir/já dormi bastante)", correctAnswer: "estou com sono insuportável", rationale: "眠い (sonolento) + てたまらない = sono extremo, insuportável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "暑くてたまらない (está um pouco quente/está frio/estou com calor insuportável/o tempo está agradável)", correctAnswer: "estou com calor insuportável", rationale: "暑い + てたまらない = calor extremo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "悲しくてたまらない (estou um pouco triste/estou alegre/estou de uma tristeza insuportável/não sinto nada)", correctAnswer: "estou de uma tristeza insuportável", rationale: "悲しい + てたまらない = tristeza profunda demais para suportar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女に会いたくてたまらない (não quero ver ela/vi ela ontem/estou louco para vê-la/já a vi várias vezes)", correctAnswer: "estou louco para vê-la", rationale: "会いたい (querer encontrar) + てたまらない = saudade insuportável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お腹が空いてたまらない (já comi/estou com fome insuportável/não tenho apetite/comi demais)", correctAnswer: "estou com fome insuportável", rationale: "お腹が空く + てたまらない = fome extrema.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "うれしくてたまらない (estou um pouco feliz/estou radiante de alegria/estou triste/não sinto nada)", correctAnswer: "estou radiante de alegria", rationale: "うれしい + てたまらない = felicidade transbordante.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "心配でたまらない (estou tranquilo/estou com preocupação insuportável/não me importo/a situação está boa)", correctAnswer: "estou com preocupação insuportável", rationale: "心配 (な adj.) + でたまらない = preocupação extrema.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "退屈でたまらない (estou ocupado/estou com um tédio insuportável/estou animado/não tenho tempo)", correctAnswer: "estou com um tédio insuportável", rationale: "退屈 (な adj.) + でたまらない = tédio extremo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "腹が立ってたまらない (estou calmo/estou com uma raiva insuportável/estou feliz/não me irrito)", correctAnswer: "estou com uma raiva insuportável", rationale: "腹が立つ (ficar com raiva) + てたまらない = raiva incontrolável.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "気になってたまらない (não me importa/não consigo parar de pensar nisso/já resolvi/esqueci completamente)", correctAnswer: "não consigo parar de pensar nisso", rationale: "気になる + てたまらない = curiosidade/preocupação impossível de ignorar.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～てたまらない
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "Como conectar adjetivo な com たまらない? (形容詞+てたまらない/形容詞+でたまらない/形容詞+にたまらない/形容詞+がたまらない)", correctAnswer: "形容詞+でたまらない", rationale: "Adjetivos な usam a forma で antes de たまらない.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この音楽が好き___たまらない (でたまらない/てたまらない/くてたまらない/なくてたまらない)", correctAnswer: "でたまらない", rationale: "好き (な adj.) + でたまらない = gosto imensamente desta música.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "寒く___たまらない (てたまらない/でたまらない/にたまらない/がたまらない)", correctAnswer: "てたまらない", rationale: "寒い (い adj.) → 寒くて + たまらない = frio insuportável.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Como dizer 'estou com saudade insuportável do Japão'? (日本が恋しくてたまらない/日本が恋しでたまらない/日本がたまらない/日本に行きたいたまらない)", correctAnswer: "日本が恋しくてたまらない", rationale: "恋しい (い adj.) → 恋しくて + たまらない = saudade insuportável.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "疲れ___たまらない (てたまらない/でたまらない/くてたまらない/ずにたまらない)", correctAnswer: "てたまらない", rationale: "疲れる (verbo) → 疲れて + たまらない = cansaço extremo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子供に早く会い___たまらない (たくてたまらない/たいでたまらない/たいにたまらない/てたまらない)", correctAnswer: "たくてたまらない", rationale: "会いたい → たい forma い-adj. → たくて + たまらない.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たまらない basicamente significa: (possível/insuportável/habitual/necessário)", correctAnswer: "insuportável", rationale: "たまらない = não consigo suportar; expressa intensidade extrema.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "不安___たまらない (でたまらない/てたまらない/くてたまらない/がたまらない)", correctAnswer: "でたまらない", rationale: "不安 (な adj.) + でたまらない = ansiedade insuportável.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase usa たまらない corretamente? (行くたまらない/静かでたまらない/きれいたまらない/難したまらない)", correctAnswer: "静かでたまらない", rationale: "静か (な adj.) + でたまらない = silêncio insuportável (paradoxalmente angustiante).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "怒り___たまらない (てたまらない/でたまらない/くてたまらない/にたまらない)", correctAnswer: "てたまらない", rationale: "怒る (verbo) → 怒って + たまらない = raiva incontrolável.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
