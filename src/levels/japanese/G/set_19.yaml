title: 🔢 Kanji N3 — 経験技術 (experiência e técnica)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "Kanji N3 do campo de experiência e técnica: 経 (passar/administrar), 験 (experiência/teste), 技 (habilidade/técnica), 術 (arte/método). Essenciais para CV e trabalho."
example: "Leia o kanji e identifique o significado. Ex.: 経験 → experiência."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Kanji de experiência e técnica — leitura
    description: Leia a palavra e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "経験 (けいけん) (educação/experiência/talento/habilidade)", correctAnswer: "experiência", rationale: "経験 (けいけん) = experiência, vivência.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "技術 (ぎじゅつ) (arte/tecnologia/técnica/matemática)", correctAnswer: "tecnologia/técnica", rationale: "技術 (ぎじゅつ) = técnica, tecnologia, habilidade técnica.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経営 (けいえい) (experiência/administração de empresa/técnica/habilidade)", correctAnswer: "administração de empresa", rationale: "経営 (けいえい) = gestão empresarial, administração.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "技能 (ぎのう) (educação/habilidade técnica/tecnologia/experiência)", correctAnswer: "habilidade técnica", rationale: "技能 (ぎのう) = habilidade prática, competência técnica.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試験 (しけん) (experiência/exame/técnica/habilidade)", correctAnswer: "exame", rationale: "試験 (しけん) = exame, teste.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経路 (けいろ) (experiência/rota/administração/técnica)", correctAnswer: "rota", rationale: "経路 (けいろ) = rota, caminho, percurso.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "技巧 (ぎこう) (educação/técnica refinada/experiência/habilidade)", correctAnswer: "técnica refinada", rationale: "技巧 (ぎこう) = habilidade artística refinada, técnica apurada.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "実験 (じっけん) (experiência/experimento/exame/habilidade)", correctAnswer: "experimento", rationale: "実験 (じっけん) = experimento científico, experiência prática.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "手術 (しゅじゅつ) (técnica/cirurgia/experiência/exame)", correctAnswer: "cirurgia", rationale: "手術 (しゅじゅつ) = cirurgia, operação.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "経過 (けいか) (administração/passage de tempo/técnica/experiência)", correctAnswer: "passage de tempo", rationale: "経過 (けいか) = decurso de tempo, evolução.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Kanji de experiência e técnica — uso em frases
    description: Escolha o kanji ou leitura correta para completar as frases.
    exercises:
      - { type: japanese_vocab, question: "この仕事には___が必要だ (経験/技巧/試験/経路)", correctAnswer: "経験", rationale: "仕事に経験が必要 = para este trabalho é necessária experiência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "最新の___を導入した (技術/経験/試験/経過)", correctAnswer: "技術", rationale: "最新の技術を導入する = implementar a tecnologia mais recente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来週___があります (試験/経験/技術/経路)", correctAnswer: "試験", rationale: "来週試験があります = há um exame na próxima semana.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___の才能がある (技術/経営/経験/経過)", correctAnswer: "経営", rationale: "経営の才能 = talento para administração empresarial.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "科学___を行った (実験/技術/経路/試験)", correctAnswer: "実験", rationale: "科学実験を行う = realizar um experimento científico.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "職人の___が光る (技巧/経験/実験/経路)", correctAnswer: "技巧", rationale: "職人の技巧が光る = a técnica refinada do artesão brilha.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___を受けて回復した (手術/技術/経験/実験)", correctAnswer: "手術", rationale: "手術を受けて回復した = se recuperou após a cirurgia.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "病気の___を観察する (経過/経路/試験/技術)", correctAnswer: "経過", rationale: "病気の経過を観察する = observar a evolução da doença.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "___訓練を受けた (技能/経験/実験/経路)", correctAnswer: "技能", rationale: "技能訓練 = treinamento de habilidades práticas.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どの___で行けばいいですか (経路/経験/技術/実験)", correctAnswer: "経路", rationale: "どの経路で行けばいいですか = por qual rota devo ir?", difficulty: 5, objectives: [japanese.grammar] }
target: 20
