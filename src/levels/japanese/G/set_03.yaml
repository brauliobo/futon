title: 📝 ～ようにする (fazer esforço para)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～ようにする expressa esforço consciente ou intenção de agir de certa forma. Frequentemente indica hábito que se tenta manter ou mudança que se busca alcançar."
example: "Indica esforço deliberado. Ex.: 毎日野菜を食べるようにしている → Estou fazendo esforço para comer verduras todo dia."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～ようにする
    description: Escolha o significado correto das frases com ～ようにする.
    exercises:
      - { type: japanese_vocab, question: "毎日運動するようにしています (me exercito sempre/estou fazendo esforço para me exercitar todo dia/vou começar a me exercitar/não me exercito)", correctAnswer: "estou fazendo esforço para me exercitar todo dia", rationale: "Regra: 動詞(辞書形) + ようにしている → esforço contínuo. 運動する + ようにしている → ている=contínuo, す=esforço deliberado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遅刻しないようにしてください (por favor seja pontual/pode se atrasar/chegue cedo sempre/não precisa se preocupar)", correctAnswer: "por favor seja pontual", rationale: "Regra: 動詞ない形 + ようにしてください → pedido de esforço para evitar. 遅刻しない(evitar) + ようにしてください → por favor esforce-se para não se atrasar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "早く寝るようにしている (durmo tarde/estou tentando dormir cedo/sempre durmo cedo/vou dormir cedo)", correctAnswer: "estou tentando dormir cedo", rationale: "Regra: 動詞(辞書形) + ようにしている. 早く寝る(dormir cedo) + ようにしている → hábito mantido com esforço consciente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "忘れないようにメモしておく (vou anotar para não esquecer/já anotei tudo/não preciso anotar/esqueço tudo)", correctAnswer: "vou anotar para não esquecer", rationale: "Regra: ない形 + ように + 別の動詞 → agir com o objetivo de evitar. 忘れないように(finalidade) + メモしておく(ação preventiva) → anotar para não esquecer.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "健康のために野菜を食べるようにした (passei a comer verduras por saúde/nunca como verduras/vou comer verduras/não gosto de verduras)", correctAnswer: "passei a comer verduras por saúde", rationale: "ようにした(passado) = decisão tomada de começar. 食べる + ようにした → mudança deliberada de comportamento no passado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "毎朝ニュースを見るようにしている (assisto as notícias todo dia por esforço/não assisto notícias/vou assistir notícias/assistia notícias antes)", correctAnswer: "assisto as notícias todo dia por esforço", rationale: "Regra: 動詞(辞書形) + ようにしている. 毎朝(frequência) + ニュースを見る + ようにしている → hábito mantido conscientemente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "なるべく電車に乗るようにしている (prefiro andar de carro/estou fazendo esforço para usar o metrô sempre que possível/nunca uso metrô/vou pegar o metrô amanhã)", correctAnswer: "estou fazendo esforço para usar o metrô sempre que possível", rationale: "なるべく(o quanto possível) + 電車に乗る + ようにしている → adverbio なるべく reforça o caráter de esforço máximo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "授業に遅刻しないようにしなさい (pode se atrasar/nunca se atrase/faça esforço para não se atrasar/não há aula)", correctAnswer: "faça esforço para não se atrasar", rationale: "Regra: ない形 + ようにしなさい → instrução imperativa de evitar. しなさい = imperativo educado; ようにしなさい ≠ ようにしてはいけない(proibição).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ゴミを出さないようにしている (jogo lixo todo dia/estou fazendo esforço para não produzir lixo/o lixo está cheio/não sei onde jogar o lixo)", correctAnswer: "estou fazendo esforço para não produzir lixo", rationale: "出さない(não jogar) + ようにしている → esforço ativo de redução; ている = continuidade do esforço.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "薬を毎日飲むようにしてください (por favor tome o remédio todo dia/não precisa tomar remédio/o remédio é caro/tome remédio quando quiser)", correctAnswer: "por favor tome o remédio todo dia", rationale: "Regra: 動詞(辞書形) + ようにしてください → solicitação polida de esforço. 飲む + ようにしてください = peça para manter o hábito.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Usar ～ようにする
    description: Complete ou escolha a construção correta.
    exercises:
      - { type: japanese_vocab, question: "Qual é a diferença entre ようになる e ようにする? (mesma coisa/ようになる = mudança natural; ようにする = esforço deliberado/ようにする = mudança natural; ようになる = esforço/ambos indicam decisão)", correctAnswer: "ようになる = mudança natural; ようにする = esforço deliberado", rationale: "ようになる: sujeito passivo, mudança ocorreu naturalmente (泳げるようになった→passei a conseguir nadar). ようにする: sujeito ativo, esforço intencional (泳ぐようにしている→me esforço para nadar).", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "毎日日本語を練習する___ (ようにしている/ようになっている/ことにしている/はずだ)", correctAnswer: "ようにしている", rationale: "練習する(辞書形) + ようにしている → esforço contínuo. ようになっている→mudança já ocorreu; ことにしている→decisão pessoal de regra.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Como dizer 'faça esforço para não falar alto'? (大きい声で話すようにして/大きい声で話さないようにして/大きい声で話してください/大きい声が好きだ)", correctAnswer: "大きい声で話さないようにして", rationale: "Regra: ない形 + ようにして → pedido de evitar. 話さない(ない形) + ようにして → esforce-se para não falar alto.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "体のために、なるべく歩く___ (ようにしています/ようになっています/ことになっています/らしいです)", correctAnswer: "ようにしています", rationale: "歩く(辞書形) + ようにしています → esforço ativo de andar. ようになっています→mudança passiva; ことになっています→regra/acordo externo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase pede esforço para manter silêncio? (静かにするようにしてください/静かにしてしまった/静かになりました/静かのようだ)", correctAnswer: "静かにするようにしてください", rationale: "静かにする(ser quieto) + ようにしてください → pedido de esforço contínuo. しまった→lamento; なりました→já ficou quieto; のようだ→aparência.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遅くまで起きていない___ (ようにしている/ようになっている/ことになった/らしい)", correctAnswer: "ようにしている", rationale: "起きていない(ない形) + ようにしている → esforço para não ficar acordado até tarde. ようになっている=mudança ocorreu; ことになった=decisão/regra externa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ようにしている implica que: (a mudança já aconteceu/o esforço é contínuo no presente/foi decidido por outros/é impossível)", correctAnswer: "o esforço é contínuo no presente", rationale: "Regra: ようにする + ている → esforço em andamento agora. ようになる+ている=mudança já consolidada. A distinção é sujeito ativo vs. passivo.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "なるべく___ようにしている — o que entra no espaço? (verbo na forma る/verbo na forma た/verbo na forma て/substantivo)", correctAnswer: "verbo na forma る", rationale: "Regra: ようにする conecta com 辞書形(る) para afirmativo ou ない形 para negativo. Nunca た形/て形/名詞 diretamente.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語で話す___ (ようにしましょう/ことにしましょう/はずです/らしいです)", correctAnswer: "ようにしましょう", rationale: "話す(辞書形) + ようにしましょう → vamos fazer esforço (convite coletivo). ことにしましょう→vamos decidir como regra; はず/らしい→expectativa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase NÃO usa ようにする corretamente? (食べすぎないようにしている/早く起きるようにした/上手なようにしている/遅刻しないようにしている)", correctAnswer: "上手なようにしている", rationale: "ようにする requer 動詞/ない形. 上手な=na形容詞 → erro; correto: 上手になるようにしている (なる=verbo de mudança).", difficulty: 5, objectives: [japanese.grammar] }
target: 20
