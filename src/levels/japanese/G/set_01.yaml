title: 📝 ～てしまった (lamentavelmente aconteceu)
level: 'G'
subject: japanese
objectives: [japanese.grammar]
difficulty: 5
authorNotes: "～てしまった expressa que algo aconteceu completamente, muitas vezes com arrependimento ou lamento. É muito usado para erros e situações irreversíveis."
example: "Indica conclusão com nuance negativa. Ex.: 財布を忘れてしまった → Acabei esquecendo a carteira (que chato)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 22
pages:
  - pageNumber: 1
    title: Reconhecer ～てしまった
    description: Escolha o significado correto das frases com ～てしまった.
    exercises:
      - { type: japanese_vocab, question: "財布を忘れてしまった (acabei esquecendo a carteira/vou esquecer a carteira/esqueci de propósito/nunca esqueço a carteira)", correctAnswer: "acabei esquecendo a carteira", rationale: "Regra: 動詞て形 + しまった → ação concluída com lamento. 忘れる → 忘れて + しまった → ação indesejada irreversível.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ケーキを全部食べてしまった (não comi o bolo/comi apenas um pouco/acabei comendo o bolo todo/vou comer o bolo)", correctAnswer: "acabei comendo o bolo todo", rationale: "食べる → 食べて + しまった. 全部(tudo) amplifica a completude; しまった adiciona lamento por ter exagerado.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電車に乗り遅れてしまった (peguei o trem/acabei perdendo o trem/vou perder o trem/não preciso do trem)", correctAnswer: "acabei perdendo o trem", rationale: "乗り遅れる(perder transporte) → 乗り遅れて + しまった → conclusão lamentável: perdeu o trem e não pode desfazer.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "秘密を話してしまった (vou contar o segredo/não sei o segredo/acabei contando o segredo/guardo segredos)", correctAnswer: "acabei contando o segredo", rationale: "話す → 話して + しまった → segredo revelado involuntariamente; irreversível = arrependimento. Fórmula: て形 + しまった.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "宿題を全部やってしまった (não fiz a lição/acabei fazendo toda a lição/vou fazer a lição/a lição é difícil)", correctAnswer: "acabei fazendo toda a lição", rationale: "やる → やって + しまった. Aqui tom positivo de alívio: tarefa 100% concluída. しまった = completude (neutro/positivo conforme contexto).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "転んでしまった (levantei/fui correr/acabei caindo/nunca caio)", correctAnswer: "acabei caindo", rationale: "転ぶ → 転んで(て形 irregular -ぶ→んで) + しまった → queda não intencional e concluída com lamento.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "メールを消してしまった (recebi um e-mail/acabei apagando o e-mail/vou enviar e-mail/o e-mail chegou)", correctAnswer: "acabei apagando o e-mail", rationale: "消す → 消して + しまった → ação irreversível: e-mail apagado, não pode recuperar; lamento pela perda.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "レポートを無くしてしまった (encontrei o relatório/vou escrever o relatório/acabei perdendo o relatório/o relatório está pronto)", correctAnswer: "acabei perdendo o relatório", rationale: "無くす → 無くして + しまった → perda irreversível com lamento; しまった reforça o caráter negativo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "遅刻してしまった (cheguei cedo/acabei chegando atrasado/vou chegar na hora/nunca me atraso)", correctAnswer: "acabei chegando atrasado", rationale: "遅刻する → 遅刻して + しまった → atraso consumado com lamento social; fórmula: サ変て形 + しまった.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "約束を破ってしまった (cumpri a promessa/fiz uma promessa/acabei quebrando a promessa/vou fazer uma promessa)", correctAnswer: "acabei quebrando a promessa", rationale: "破る → 破って(て形 -る→って) + しまった → promessa quebrada irreversivelmente; arrependimento expresso.", difficulty: 4, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Aplicar ～てしまった
    description: Escolha a frase que usa ～てしまった corretamente.
    exercises:
      - { type: japanese_vocab, question: "Como dizer 'acabei bebendo todo o suco' com lamento? (ジュースを飲むつもりだ/ジュースを全部飲んでしまった/ジュースを飲まなかった/ジュースを飲みたい)", correctAnswer: "ジュースを全部飲んでしまった", rationale: "飲む → 飲んで(て形) + しまった. 全部(tudo) + しまった → completude com lamento de ter bebido demais.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Como expressar 'lamentavelmente esqueci o nome'? (名前を覚えた/名前を忘れてしまった/名前を教えた/名前が分かる)", correctAnswer: "名前を忘れてしまった", rationale: "忘れる → 忘れて + しまった → esquecimento involuntário e irreversível; nuance: deveria lembrar mas não conseguiu.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "財布を落として___ — complete com a forma correta (いる/しまった/いない/ほしい)", correctAnswer: "しまった", rationale: "落とす → 落として(て形) + しまった → carteira caiu: ação acidental e irreversível. いる=estado contínuo; しまった=conclusão lamentável.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual frase expressa 'já terminei tudo (com alívio)'? (もう全部やってしまった/全部やらなかった/全部やるつもりだ/全部やってほしい)", correctAnswer: "もう全部やってしまった", rationale: "もう(já) + 全部やって + しまった → conclusão total; tom positivo(alívio) quando tarefa concluída com satisfação.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女に本当のことを話して___ (しまった/あげた/くれた/もらった)", correctAnswer: "しまった", rationale: "話す → 話して + しまった → verdade revelada; しまった=conclusão com arrependimento. あげた/くれた=benefício, não se encaixa.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Como dizer 'acabei dormindo na aula'? (授業中に寝てしまった/授業中に寝るつもりだ/授業中に寝なかった/授業が好きだ)", correctAnswer: "授業中に寝てしまった", rationale: "寝る → 寝て + しまった → sono involuntário em aula; しまった marca falta de controle + lamento social.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "大切な写真を消して___ (しまった/みた/おいた/いく)", correctAnswer: "しまった", rationale: "消す → 消して + しまった → foto apagada irreversivelmente. みた=tentativa; おいた=preparação; いく=progressão. Só しまった marca lamento.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "Qual é a nuance de てしまった? (ação futura/ação habitual/ação completa com lamento ou alívio/ação impossível)", correctAnswer: "ação completa com lamento ou alívio", rationale: "Regra: て形 + しまった → ação 100% concluída + carga emocional (lamento se negativa; alívio se positiva). Nunca futuro/habitual.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "パスポートを無くして___ (しまいました/います/あります/おきます)", correctAnswer: "しまいました", rationale: "無くす → 無くして + しまいました(forma polida de しまった) → lamento formal pela perda do passaporte.", difficulty: 5, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "試験に失敗してしまった — que sentimento isso transmite? (orgulho/neutralidade/lamento/alegria)", correctAnswer: "lamento", rationale: "失敗する → 失敗して + しまった. 失敗(fracasso) + しまった → lamento claro; resultado indesejado e irreversível.", difficulty: 5, objectives: [japanese.grammar] }
target: 20
