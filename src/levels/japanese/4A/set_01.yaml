title: Hiragana — あいうえお (vogais)
level: '4A'
subject: japanese
example: "Veja o hiragana e toque no som. Ex.: あ → a"
pages:
  - pageNumber: 1
    title: Reconhecer vogais
    description: Toque no som correto de cada hiragana.
    exercises:
      - { type: kana_reading, question: "あ (a/i/u/e/o)", correctAnswer: a }
      - { type: kana_reading, question: "い (a/i/u/e/o)", correctAnswer: i }
      - { type: kana_reading, question: "う (a/i/u/e/o)", correctAnswer: u }
      - { type: kana_reading, question: "え (a/i/u/e/o)", correctAnswer: e }
      - { type: kana_reading, question: "お (a/i/u/e/o)", correctAnswer: o }
      - { type: kana_reading, question: "お (u/o/i/a/e)", correctAnswer: o }
      - { type: kana_reading, question: "う (i/e/u/a/o)", correctAnswer: u }
      - { type: kana_reading, question: "あ (u/e/i/o/a)", correctAnswer: a }
      - { type: kana_reading, question: "え (o/u/e/a/i)", correctAnswer: e }
      - { type: kana_reading, question: "い (i/e/o/a/u)", correctAnswer: i }
  - pageNumber: 2
    title: Escolher o hiragana
    description: Veja o som e toque no hiragana correto.
    exercises:
      - { type: kana_writing, question: "a (あ/い/う/え/お)", correctAnswer: "あ" }
      - { type: kana_writing, question: "i (あ/い/う/え/お)", correctAnswer: "い" }
      - { type: kana_writing, question: "u (あ/い/う/え/お)", correctAnswer: "う" }
      - { type: kana_writing, question: "e (あ/い/う/え/お)", correctAnswer: "え" }
      - { type: kana_writing, question: "o (あ/い/う/え/お)", correctAnswer: "お" }
      - { type: kana_writing, question: "e (い/お/う/あ/え)", correctAnswer: "え" }
      - { type: kana_writing, question: "o (い/う/お/あ/え)", correctAnswer: "お" }
      - { type: kana_writing, question: "a (い/え/う/あ/お)", correctAnswer: "あ" }
      - { type: kana_writing, question: "i (い/え/お/あ/う)", correctAnswer: "い" }
      - { type: kana_writing, question: "u (う/え/い/あ/お)", correctAnswer: "う" }
