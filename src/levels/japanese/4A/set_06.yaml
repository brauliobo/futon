      - { type: japanese_vocab, question: "はし (ponte/rua/casa/loja)", correctAnswer: "ponte", rationale: "はし (hiragana) significa \"ponte\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ひ (água/terra/ar/fogo)", correctAnswer: "fogo", rationale: "ひ lê-se \"fogo\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ほね (osso/pele/sangue/músculo)", correctAnswer: "osso", rationale: "ほね lê-se \"osso\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ふゆ (inverno/verão/primavera/outono)", correctAnswer: "inverno", rationale: "ふゆ (hiragana) significa \"inverno\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "はこ (caixa/bolsa/mala/cesta)", correctAnswer: "caixa", rationale: "はこ (hiragana) significa \"caixa\" em português.", objectives: [japanese.vocab] }
