    title: Palavras com H
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "はな (flor/nariz/olho/boca)", correctAnswer: "flor", rationale: "はな lê-se \"flor\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ひと (pessoa/criança/adulto/bebê)", correctAnswer: "pessoa", rationale: "ひと (hiragana) significa \"pessoa\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ふね (barco/carro/avião/trem)", correctAnswer: "barco", rationale: "ふね (hiragana) significa \"barco\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "へそ (umbigo/orelha/joelho/cotovelo)", correctAnswer: "umbigo", rationale: "へそ (hiragana) significa \"umbigo\" em português.", objectives: [japanese.vocab] }
