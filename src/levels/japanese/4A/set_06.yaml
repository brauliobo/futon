title: Hiragana — はひふへほ (linha H)
level: '4A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 1
authorNotes: "Hiragana — はひふへほ (linha H). Foque no conceito central do conjunto e nos erros comuns."
example: "ふ lê-se 'fu' (som entre F e H). へ como partícula vira 'e'. Ex.: は → ha."
