  - pageNumber: 2
    title: Palavras com Y/W/N
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "やま (montanha/mar/rio/céu)", correctAnswer: "montanha", rationale: "やま (hiragana) significa \"montanha\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ゆき (neve/chuva/vento/sol)", correctAnswer: "neve", rationale: "ゆき lê-se \"neve\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "よる (noite/dia/manhã/tarde)", correctAnswer: "noite", rationale: "よる (hiragana) significa \"noite\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ほん (livro/caderno/caneta/mesa)", correctAnswer: "livro", rationale: "ほん (hiragana) significa \"livro\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "わに (crocodilo/tigre/leão/urso)", correctAnswer: "crocodilo", rationale: "わに (hiragana) significa \"crocodilo\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おんな (mulher/homem/criança/bebê)", correctAnswer: "mulher", rationale: "おんな (hiragana) significa \"mulher\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "やさい (verdura/fruta/carne/peixe)", correctAnswer: "verdura", rationale: "やさい (hiragana) significa \"verdura\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ゆめ (sonho/memória/ideia/esperança)", correctAnswer: "sonho", rationale: "ゆめ (hiragana) significa \"sonho\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "よこ (lado/frente/atrás/em cima)", correctAnswer: "lado", rationale: "よこ lê-se \"lado\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "わたし (eu/você/ele/ela)", correctAnswer: "eu", rationale: "わたし lê-se \"eu\" (romaji).", objectives: [japanese.vocab] }
