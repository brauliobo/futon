title: Hiragana — やゆよ わをん (linhas Y/W/N)
level: '4A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Hiragana — やゆよ わをん (linhas Y/W/N). Foque no conceito central do conjunto e nos erros comuns."
example: "を é partícula e lê-se 'o'. ん é o único kana sem vogal. Ex.: や → ya."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
