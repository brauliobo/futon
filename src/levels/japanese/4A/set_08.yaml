title: Hiragana — やゆよ わをん (linhas Y/W/N)
level: '4A'
subject: japanese
authorNotes: "Hiragana — やゆよ わをん (linhas Y/W/N). Foque no conceito central do conjunto e nos erros comuns."
example: "を é partícula e lê-se 'o'. ん é o único kana sem vogal."
pages:
  - pageNumber: 1
    title: Reconhecer Y/W/N
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "や (ya/yu/yo/wa/n)", correctAnswer: ya }
      - { type: kana_reading, question: "ゆ (ya/yu/yo/wa/n)", correctAnswer: yu }
      - { type: kana_reading, question: "よ (ya/yu/yo/wa/n)", correctAnswer: yo }
      - { type: kana_reading, question: "わ (ya/yu/yo/wa/n)", correctAnswer: wa }
      - { type: kana_reading, question: "ん (ya/yu/yo/wa/n)", correctAnswer: n }
      - { type: kana_reading, question: "を (o/wa/ya/yo)", correctAnswer: o }
      - { type: kana_reading, question: "や (yo/n/yu/ya/wa)", correctAnswer: ya }
      - { type: kana_reading, question: "ゆ (yu/wa/yo/n/ya)", correctAnswer: yu }
      - { type: kana_reading, question: "よ (yu/wa/n/ya/yo)", correctAnswer: yo }
      - { type: kana_reading, question: "ん (yu/wa/yo/ya/n)", correctAnswer: n }
  - pageNumber: 2
    title: Palavras com Y/W/N
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "やま (montanha/mar/rio/céu)", correctAnswer: "montanha" }
