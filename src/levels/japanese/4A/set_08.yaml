      - { type: japanese_vocab, question: "ほん (livro/caderno/caneta/mesa)", correctAnswer: "livro" }
      - { type: japanese_vocab, question: "わに (crocodilo/tigre/leão/urso)", correctAnswer: "crocodilo" }
      - { type: japanese_vocab, question: "おんな (mulher/homem/criança/bebê)", correctAnswer: "mulher" }
      - { type: japanese_vocab, question: "やさい (verdura/fruta/carne/peixe)", correctAnswer: "verdura" }
