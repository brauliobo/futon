title: 📝 Hiragana — leitura de frases curtas
level: '4A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Leitura de frases curtas em hiragana puro. Consolida a leitura fluente antes da revisão final."
example: "Leia frases completas em hiragana. Ex.: ねこが いる → Tem um gato."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Frases com animais e natureza
    description: Leia a frase em hiragana e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "ねこが いる。 (Tem um cachorro./Tem um peixe./Tem um gato./Tem um pássaro.)", correctAnswer: "Tem um gato.", rationale: "ねこ = gato; いる = existe (animado). \"Tem um gato.\"", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いぬが はしる。 (O gato corre./O cachorro corre./O peixe nada./O pássaro voa.)", correctAnswer: "O cachorro corre.", rationale: "いぬ = cachorro; はしる = correr. \"O cachorro corre.\"", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "とりが とぶ。 (O peixe nada./O gato pula./O pássaro voa./O cachorro corre.)", correctAnswer: "O pássaro voa.", rationale: "とり = pássaro; とぶ = voar. \"O pássaro voa.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "はなが きれい。 (A flor murcha./A flor é feia./A flor cai./A flor é bonita.)", correctAnswer: "A flor é bonita.", rationale: "はな = flor; きれい = bonito/a. \"A flor é bonita.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "やまが たかい。 (A montanha é baixa./O rio é profundo./A montanha é alta./O mar é largo.)", correctAnswer: "A montanha é alta.", rationale: "やま = montanha; たかい = alto/a. \"A montanha é alta.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "みずが つめたい。 (A água está quente./A água está gelada./A água está suja./A água está limpa.)", correctAnswer: "A água está gelada.", rationale: "みず = água; つめたい = gelado/frio (ao toque). \"A água está gelada.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "そらが あおい。 (O céu está nublado./O mar é azul./O céu é azul./O rio é claro.)", correctAnswer: "O céu é azul.", rationale: "そら = céu; あおい = azul. \"O céu é azul.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きが おおきい。 (A árvore é pequena./A pedra é grande./A árvore é grande./A flor é grande.)", correctAnswer: "A árvore é grande.", rationale: "き = árvore; おおきい = grande. \"A árvore é grande.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "さかなが およぐ。 (O peixe voa./O peixe pula./O peixe nada./O peixe come.)", correctAnswer: "O peixe nada.", rationale: "さかな = peixe; およぐ = nadar. \"O peixe nada.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あめが ふる。 (Está nevando./Está ventando./Está chovendo./Está granizando.)", correctAnswer: "Está chovendo.", rationale: "あめ = chuva; ふる = cair. \"Está chovendo.\"", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Frases do cotidiano
    description: Leia a frase e escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "おかあさんが りょうりする。 (A mãe come./A mãe cozinha./A mãe dorme./A mãe estuda.)", correctAnswer: "A mãe cozinha.", rationale: "おかあさん = mãe; りょうりする = cozinhar. \"A mãe cozinha.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おとうさんが しんぶんを よむ。 (O pai escreve o jornal./O pai lê o jornal./O pai compra o jornal./O pai vende o jornal.)", correctAnswer: "O pai lê o jornal.", rationale: "おとうさん = pai; しんぶん = jornal; よむ = ler.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "わたしは がっこうに いく。 (Eu fico na escola./Eu saio da escola./Eu estudo na escola./Eu vou à escola.)", correctAnswer: "Eu vou à escola.", rationale: "わたし = eu; に いく = ir a. \"Eu vou à escola.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ともだちと たべる。 (Como sozinho./Como com o amigo./Estudo com o amigo./Brinco com o amigo.)", correctAnswer: "Como com o amigo.", rationale: "ともだちと = com o amigo; たべる = comer.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ほんを よんで ねる。 (Leio e durmo./Escrevo e durmo./Como e durmo./Brinco e durmo.)", correctAnswer: "Leio e durmo.", rationale: "よんで = lendo (て-form de よむ); ねる = dormir.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おんがくを きく。 (Toco música./Componho música./Ouço música./Canto música.)", correctAnswer: "Ouço música.", rationale: "おんがく = música; きく = ouvir. \"Ouço música.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "テレビを みる。 (Compro televisão./Ouço televisão./Assisto televisão./Vendo televisão.)", correctAnswer: "Assisto televisão.", rationale: "テレビ = televisão; みる = ver/assistir.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "みずを のんで げんき。 (Bebo água e fico doente./Bebo água e fico bem./Como e bebo água./Não bebo água.)", correctAnswer: "Bebo água e fico bem.", rationale: "みずを のんで = bebendo água; げんき = saudável.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "くつを はいて でかける。 (Tiro os sapatos e saio./Calço os sapatos e saio./Compro sapatos e saio./Limpo os sapatos e saio.)", correctAnswer: "Calço os sapatos e saio.", rationale: "くつを はいて = calçando os sapatos; でかける = sair de casa.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "てを あらって たべる。 (Como sem lavar as mãos./Lavo as mãos e como./Lavo as mãos e durmo./Lavo as mãos e saio.)", correctAnswer: "Lavo as mãos e como.", rationale: "てを あらって = lavando as mãos; たべる = comer.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
