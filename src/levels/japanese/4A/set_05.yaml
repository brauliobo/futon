title: Hiragana — なにぬねの (linha N)
level: '4A'
subject: japanese
authorNotes: "Hiragana — なにぬねの (linha N). Foque no conceito central do conjunto e nos erros comuns."
example: "な → na, に → ni, ぬ → nu"
pages:
  - pageNumber: 1
    title: Reconhecer linha N
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "な (na/ni/nu/ne/no)", correctAnswer: na, rationale: "な lê-se \"na\" (romaji)." }
      - { type: kana_reading, question: "に (na/ni/nu/ne/no)", correctAnswer: ni, rationale: "に lê-se \"ni\" (romaji)." }
      - { type: kana_reading, question: "ぬ (na/ni/nu/ne/no)", correctAnswer: nu, rationale: "ぬ lê-se \"nu\" (romaji)." }
      - { type: kana_reading, question: "ね (na/ni/nu/ne/no)", correctAnswer: ne, rationale: "ね lê-se \"ne\" (romaji)." }
      - { type: kana_reading, question: "の (na/ni/nu/ne/no)", correctAnswer: no, rationale: "の lê-se \"no\" (romaji)." }
      - { type: kana_reading, question: "の (nu/ne/no/na/ni)", correctAnswer: no, rationale: "の lê-se \"no\" (romaji)." }
      - { type: kana_reading, question: "に (ni/ne/no/na/nu)", correctAnswer: ni, rationale: "に lê-se \"ni\" (romaji)." }
      - { type: kana_reading, question: "な (ni/ne/no/na/nu)", correctAnswer: na, rationale: "な lê-se \"na\" (romaji)." }
      - { type: kana_reading, question: "ね (ni/nu/ne/na/no)", correctAnswer: ne, rationale: "ね lê-se \"ne\" (romaji)." }
      - { type: kana_reading, question: "ぬ (nu/ne/ni/na/no)", correctAnswer: nu, rationale: "ぬ lê-se \"nu\" (romaji)." }
