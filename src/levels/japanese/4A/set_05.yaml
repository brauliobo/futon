title: Hiragana — なにぬねの (linha N)
level: '4A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 1
authorNotes: "Hiragana — なにぬねの (linha N). Foque no conceito central do conjunto e nos erros comuns."
example: "な → na, に → ni, ぬ → nu"
pages:
  - pageNumber: 1
    title: Reconhecer linha N
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "な (na/ni/nu/ne/no)", correctAnswer: na, rationale: "な lê-se \"na\" (romaji).", objectives: [japanese.vocab] }
      - { type: kana_reading, question: "に (na/ni/nu/ne/no)", correctAnswer: ni, rationale: "に lê-se \"ni\" (romaji).", objectives: [japanese.vocab] }
      - { type: kana_reading, question: "ぬ (na/ni/nu/ne/no)", correctAnswer: nu, rationale: "ぬ lê-se \"nu\" (romaji).", objectives: [japanese.vocab] }
      - { type: kana_reading, question: "ね (na/ni/nu/ne/no)", correctAnswer: ne, rationale: "ね lê-se \"ne\" (romaji).", objectives: [japanese.vocab] }
      - { type: kana_reading, question: "の (na/ni/nu/ne/no)", correctAnswer: no, rationale: "の lê-se \"no\" (romaji).", objectives: [japanese.vocab] }
      - { type: kana_reading, question: "の (nu/ne/no/na/ni)", correctAnswer: no, rationale: "の lê-se \"no\" (romaji).", objectives: [japanese.vocab] }
      - { type: kana_reading, question: "に (ni/ne/no/na/nu)", correctAnswer: ni, rationale: "に lê-se \"ni\" (romaji).", objectives: [japanese.vocab] }
      - { type: kana_reading, question: "な (ni/ne/no/na/nu)", correctAnswer: na, rationale: "な lê-se \"na\" (romaji).", objectives: [japanese.vocab] }
      - { type: kana_reading, question: "ね (ni/nu/ne/na/no)", correctAnswer: ne, rationale: "ね lê-se \"ne\" (romaji).", objectives: [japanese.vocab] }
      - { type: kana_reading, question: "ぬ (nu/ne/ni/na/no)", correctAnswer: nu, rationale: "ぬ lê-se \"nu\" (romaji).", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Palavras com linhas K/S/T/N
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "ねこ (gato/cachorro/pássaro/peixe)", correctAnswer: "gato", rationale: "ねこ lê-se \"gato\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いぬ (cachorro/gato/pássaro/peixe)", correctAnswer: "cachorro", rationale: "いぬ (hiragana) significa \"cachorro\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "さかな (peixe/pássaro/gato/cachorro)", correctAnswer: "peixe", rationale: "さかな (hiragana) significa \"peixe\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "たこ (polvo/lula/peixe/caranguejo)", correctAnswer: "polvo", rationale: "たこ (hiragana) significa \"polvo\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "なつ (verão/inverno/outono/primavera)", correctAnswer: "verão", rationale: "なつ (hiragana) significa \"verão\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あに (irmão mais velho/irmã/pai/mãe)", correctAnswer: "irmão mais velho", rationale: "あに (hiragana) significa \"irmão mais velho\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あね (irmã mais velha/irmão/mãe/pai)", correctAnswer: "irmã mais velha", rationale: "あね (hiragana) significa \"irmã mais velha\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かに (caranguejo/peixe/polvo/camarão)", correctAnswer: "caranguejo", rationale: "かに (hiragana) significa \"caranguejo\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "しか (cervo/vaca/cavalo/ovelha)", correctAnswer: "cervo", rationale: "しか (hiragana) significa \"cervo\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ねこ (peixe/pássaro/rato/gato)", correctAnswer: "gato", rationale: "ねこ lê-se \"gato\" (romaji).", objectives: [japanese.vocab] }
target: 20
