title: Hiragana — さしすせそ (linha S)
level: '4A'
subject: japanese
authorNotes: "Hiragana — さしすせそ (linha S). Foque no conceito central do conjunto e nos erros comuns."
example: "し lê-se 'shi' (não 'si'). す lê-se 'su'."
