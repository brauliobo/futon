    title: Família em japonês
    description: Leia a palavra e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "おとうさん (pai/mãe/irmão/irmã)", correctAnswer: "pai", rationale: "おとうさん lê-se \"pai\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おかあさん (mãe/pai/avó/tia)", correctAnswer: "mãe", rationale: "おかあさん (hiragana) significa \"mãe\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おにいさん (irmão mais velho/irmã mais velha/irmão/irmã)", correctAnswer: "irmão mais velho", rationale: "おにいさん (hiragana) significa \"irmão mais velho\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おねえさん (irmã mais velha/irmão mais velho/mãe/tia)", correctAnswer: "irmã mais velha", rationale: "おねえさん (hiragana) significa \"irmã mais velha\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いもうと (irmã mais nova/irmã mais velha/prima/mãe)", correctAnswer: "irmã mais nova", rationale: "いもうと (hiragana) significa \"irmã mais nova\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おとうと (irmão mais novo/irmão mais velho/primo/pai)", correctAnswer: "irmão mais novo", rationale: "おとうと (hiragana) significa \"irmão mais novo\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おじいさん (avô/pai/tio/amigo)", correctAnswer: "avô", rationale: "おじいさん (hiragana) significa \"avô\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おばあさん (avó/mãe/tia/amiga)", correctAnswer: "avó", rationale: "おばあさん (hiragana) significa \"avó\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "こども (criança/adulto/bebê/idoso)", correctAnswer: "criança", rationale: "こども (hiragana) significa \"criança\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ともだち (amigo/inimigo/colega/professor)", correctAnswer: "amigo", rationale: "ともだち (hiragana) significa \"amigo\" em português.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Do significado à palavra
