      - { type: japanese_vocab, question: "pai (おとうさん/おかあさん/おにいさん/おねえさん)", correctAnswer: "おとうさん", rationale: "O som \"pai\" em hiragana escreve-se おとうさん.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "mãe (おかあさん/おとうさん/おばあさん/おじいさん)", correctAnswer: "おかあさん", rationale: "\"mãe\" em japonês escreve-se おかあさん.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "amigo (ともだち/こども/ひと/おんな)", correctAnswer: "ともだち", rationale: "\"amigo\" em japonês escreve-se ともだち.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "eu (わたし/あなた/かれ/かのじょ)", correctAnswer: "わたし", rationale: "O som \"eu\" em hiragana escreve-se わたし.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "você (あなた/わたし/かれ/かのじょ)", correctAnswer: "あなた", rationale: "\"você\" em japonês escreve-se あなた.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "criança (こども/おとな/あかちゃん/としより)", correctAnswer: "こども", rationale: "\"criança\" em japonês escreve-se こども.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "mulher (おんな/おとこ/こども/おや)", correctAnswer: "おんな", rationale: "\"mulher\" em japonês escreve-se おんな.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "homem (おとこ/おんな/こども/おや)", correctAnswer: "おとこ", rationale: "\"homem\" em japonês escreve-se おとこ.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "pessoa (ひと/いぬ/ねこ/とり)", correctAnswer: "ひと", rationale: "\"pessoa\" em japonês escreve-se ひと.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "irmã mais nova (いもうと/おとうと/おねえさん/おかあさん)", correctAnswer: "いもうと", rationale: "\"irmã mais nova\" em japonês escreve-se いもうと.", objectives: [japanese.vocab] }
