title: Saudações e expressões diárias
level: '4A'
subject: japanese
difficulty: 2
authorNotes: "Saudações e expressões diárias. Foque no conceito central do conjunto e nos erros comuns."
example: "Frases que você vai ouvir todos os dias no Japão. Ex.: おはよう → bom dia."
pages:
  - pageNumber: 1
    title: Saudações
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "おはよう (bom dia/boa tarde/boa noite/tchau)", correctAnswer: "bom dia" }
      - { type: japanese_vocab, question: "こんにちは (bom dia/boa tarde/boa noite/olá)", correctAnswer: "boa tarde" }
      - { type: japanese_vocab, question: "こんばんは (boa noite/bom dia/boa tarde/tchau)", correctAnswer: "boa noite" }
      - { type: japanese_vocab, question: "おやすみ (boa noite para dormir/bom dia/boa tarde/olá)", correctAnswer: "boa noite para dormir" }
      - { type: japanese_vocab, question: "さようなら (tchau/olá/obrigado/desculpa)", correctAnswer: "tchau" }
      - { type: japanese_vocab, question: "ありがとう (obrigado/desculpa/tchau/olá)", correctAnswer: "obrigado" }
      - { type: japanese_vocab, question: "すみません (desculpa/obrigado/tchau/olá)", correctAnswer: "desculpa" }
      - { type: japanese_vocab, question: "はい (sim/não/talvez/obrigado)", correctAnswer: "sim", rationale: "はい lê-se \"sim\" (romaji)." }
      - { type: japanese_vocab, question: "いいえ (não/sim/talvez/obrigado)", correctAnswer: "não" }
      - { type: japanese_vocab, question: "おねがいします (por favor/obrigado/desculpa/tchau)", correctAnswer: "por favor" }
  - pageNumber: 2
    title: Do português ao japonês
    description: Veja a expressão e escolha o hiragana.
    exercises:
      - { type: japanese_vocab, question: "bom dia (おはよう/こんにちは/こんばんは/おやすみ)", correctAnswer: "おはよう", rationale: "\"bom dia\" em japonês escreve-se おはよう." }
      - { type: japanese_vocab, question: "obrigado (ありがとう/すみません/おねがいします/はい)", correctAnswer: "ありがとう", rationale: "\"obrigado\" em japonês escreve-se ありがとう." }
      - { type: japanese_vocab, question: "desculpa (すみません/ありがとう/はい/いいえ)", correctAnswer: "すみません", rationale: "\"desculpa\" em japonês escreve-se すみません." }
      - { type: japanese_vocab, question: "sim (はい/いいえ/いいね/いえ)", correctAnswer: "はい", rationale: "O som \"sim\" em hiragana escreve-se はい." }
      - { type: japanese_vocab, question: "não (いいえ/はい/いえ/いいね)", correctAnswer: "いいえ", rationale: "\"não\" em japonês escreve-se いいえ." }
      - { type: japanese_vocab, question: "tchau (さようなら/おはよう/こんにちは/こんばんは)", correctAnswer: "さようなら", rationale: "\"tchau\" em japonês escreve-se さようなら." }
      - { type: japanese_vocab, question: "boa noite para dormir (おやすみ/こんばんは/さようなら/おはよう)", correctAnswer: "おやすみ", rationale: "\"boa noite para dormir\" em japonês escreve-se おやすみ." }
      - { type: japanese_vocab, question: "boa tarde (こんにちは/おはよう/こんばんは/おやすみ)", correctAnswer: "こんにちは", rationale: "\"boa tarde\" em japonês escreve-se こんにちは." }
      - { type: japanese_vocab, question: "por favor (おねがいします/ありがとう/すみません/はい)", correctAnswer: "おねがいします", rationale: "\"por favor\" em japonês escreve-se おねがいします." }
      - { type: japanese_vocab, question: "boa noite (こんばんは/おはよう/こんにちは/おやすみ)", correctAnswer: "こんばんは", rationale: "\"boa noite\" em japonês escreve-se こんばんは." }
target: 20
