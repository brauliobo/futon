title: Saudações e expressões diárias
level: '4A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Saudações e expressões diárias. Foque no conceito central do conjunto e nos erros comuns."
example: "Frases que você vai ouvir todos os dias no Japão. Ex.: おはよう → bom dia."
passCriteria:
  minAccuracyPercent: 85
