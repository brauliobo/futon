pages:
  - pageNumber: 1
    title: Saudações
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "おはよう (bom dia/boa noite/tchau/boa tarde)", correctAnswer: "bom dia", rationale: "おはよう (hiragana) significa \"bom dia\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "こんにちは (bom dia/boa noite/olá/boa tarde)", correctAnswer: "boa tarde", rationale: "こんにちは (hiragana) significa \"boa tarde\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "こんばんは (boa tarde/tchau/bom dia/boa noite)", correctAnswer: "boa noite", rationale: "こんばんは (hiragana) significa \"boa noite\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おやすみ (bom dia/boa tarde/olá/boa noite para dormir)", correctAnswer: "boa noite para dormir", rationale: "おやすみ (hiragana) significa \"boa noite para dormir\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "さようなら (obrigado/desculpa/olá/tchau)", correctAnswer: "tchau", rationale: "さようなら (hiragana) significa \"tchau\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ありがとう (desculpa/obrigado/olá/tchau)", correctAnswer: "obrigado", rationale: "ありがとう (hiragana) significa \"obrigado\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "すみません (obrigado/tchau/olá/desculpa)", correctAnswer: "desculpa", rationale: "すみません (hiragana) significa \"desculpa\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "はい (sim/talvez/não/obrigado)", correctAnswer: "sim", rationale: "はい lê-se \"sim\" (romaji).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いいえ (talvez/obrigado/sim/não)", correctAnswer: "não", rationale: "いいえ (hiragana) significa \"não\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おねがいします (desculpa/tchau/por favor/obrigado)", correctAnswer: "por favor", rationale: "おねがいします (hiragana) significa \"por favor\" em português.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Do português ao japonês
    description: Veja a expressão e escolha o hiragana.
    exercises:
      - { type: japanese_vocab, question: "bom dia (こんばんは/おやすみ/こんにちは/おはよう)", correctAnswer: "おはよう", rationale: "\"bom dia\" em japonês escreve-se おはよう.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "obrigado (おねがいします/はい/ありがとう/すみません)", correctAnswer: "ありがとう", rationale: "\"obrigado\" em japonês escreve-se ありがとう.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "desculpa (すみません/ありがとう/はい/いいえ)", correctAnswer: "すみません", rationale: "\"desculpa\" em japonês escreve-se すみません.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "sim (いいね/いえ/はい/いいえ)", correctAnswer: "はい", rationale: "O som \"sim\" em hiragana escreve-se はい.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "não (いえ/いいね/はい/いいえ)", correctAnswer: "いいえ", rationale: "\"não\" em japonês escreve-se いいえ.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "tchau (さようなら/こんにちは/おはよう/こんばんは)", correctAnswer: "さようなら", rationale: "\"tchau\" em japonês escreve-se さようなら.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "boa noite para dormir (こんばんは/おやすみ/おはよう/さようなら)", correctAnswer: "おやすみ", rationale: "\"boa noite para dormir\" em japonês escreve-se おやすみ.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "boa tarde (おはよう/おやすみ/こんにちは/こんばんは)", correctAnswer: "こんにちは", rationale: "\"boa tarde\" em japonês escreve-se こんにちは.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "por favor (すみません/ありがとう/おねがいします/はい)", correctAnswer: "おねがいします", rationale: "\"por favor\" em japonês escreve-se おねがいします.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "boa noite (こんにちは/おやすみ/こんばんは/おはよう)", correctAnswer: "こんばんは", rationale: "\"boa noite\" em japonês escreve-se こんばんは.", difficulty: 2, objectives: [japanese.vocab] }
target: 20
