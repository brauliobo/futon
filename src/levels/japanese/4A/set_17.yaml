title: 💬 Frases simples — lugares e movimentos
level: '4A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Frases com に いく (ir a) e partícula に para indicar destino. Introdução natural ao movimento."
example: "Frases de deslocamento. Ex.: がっこうに いく → Vou à escola."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Lugares em hiragana
    description: Leia cada palavra de lugar e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "がっこう (hospital/escola/loja/parque)", correctAnswer: "escola", rationale: "がっこう significa \"escola\" em japonês.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いえ (parque/escola/apartamento/casa)", correctAnswer: "casa", rationale: "いえ significa \"casa\" em japonês.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "みせ (hospital/parque/loja/escola)", correctAnswer: "loja", rationale: "みせ significa \"loja\" em japonês.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "こうえん (cinema/loja/museu/parque)", correctAnswer: "parque", rationale: "こうえん significa \"parque\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "えき (aeroporto/estação de trem/porto/rodoviária)", correctAnswer: "estação de trem", rationale: "えき significa \"estação de trem\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "びょういん (farmácia/clínica/hospital/escola)", correctAnswer: "hospital", rationale: "びょういん significa \"hospital\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "としょかん (museu/teatro/biblioteca/parque)", correctAnswer: "biblioteca", rationale: "としょかん significa \"biblioteca\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "レストラン (mercado/cinema/restaurante/loja)", correctAnswer: "restaurante", rationale: "レストラン (katakana) significa \"restaurante\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "スーパー (farmácia/supermercado/banco/padaria)", correctAnswer: "supermercado", rationale: "スーパー (katakana) significa \"supermercado\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ぎんこう (correio/hotel/banco/loja)", correctAnswer: "banco", rationale: "ぎんこう significa \"banco\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Frases de movimento
    description: Leia a frase e escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "がっこうに いく。 (Venho da escola./Estou na escola./Vou à escola./Saio da escola.)", correctAnswer: "Vou à escola.", rationale: "に indica destino; いく → ir. \"Vou à escola.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いえに かえる。 (Saio de casa./Estou em casa./Volto para casa./Vou a casa.)", correctAnswer: "Volto para casa.", rationale: "かえる → voltar para casa. \"Volto para casa.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "えきに いく。 (Saio da estação./Passo pela estação./Espero na estação./Vou à estação.)", correctAnswer: "Vou à estação.", rationale: "えき → estação; に いく → ir a. \"Vou à estação.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "こうえんで あそぶ。 (Corro pelo parque./Brinco no parque./Estudo no parque./Trabalho no parque.)", correctAnswer: "Brinco no parque.", rationale: "で indica local da ação; あそぶ → brincar. \"Brinco no parque.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "としょかんで よむ。 (Compro livros na biblioteca./Leio na biblioteca./Escrevo na biblioteca./Durmo na biblioteca.)", correctAnswer: "Leio na biblioteca.", rationale: "で → no/na; よむ → ler. \"Leio na biblioteca.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "スーパーで かう。 (Trabalho no supermercado./Como no supermercado./Vendo no supermercado./Compro no supermercado.)", correctAnswer: "Compro no supermercado.", rationale: "で → no; かう → comprar. \"Compro no supermercado.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "びょういんに いく。 (Saio do hospital./Trabalho no hospital./Vou ao hospital./Fico no hospital.)", correctAnswer: "Vou ao hospital.", rationale: "に いく → ir a. \"Vou ao hospital.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ぎんこうは どこ？ (Onde fica o banco?/O banco é grande?/O banco está aberto?/Quando abre o banco?)", correctAnswer: "Onde fica o banco?", rationale: "どこ → onde. \"Onde fica o banco?\"", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "みせに はいる。 (Saio da loja./Paso pela loja./Entro na loja./Chamo a loja.)", correctAnswer: "Entro na loja.", rationale: "はいる → entrar. \"Entro na loja.\"", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "でんしゃで いく。 (Vou a pé./Vou de trem./Vou de carro./Vou de ônibus.)", correctAnswer: "Vou de trem.", rationale: "で indica meio de transporte; でんしゃ → trem. \"Vou de trem.\"", difficulty: 3, objectives: [japanese.vocab] }
target: 20
