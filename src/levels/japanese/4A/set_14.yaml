title: Primeiras frases — revisão final 4A
level: '4A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Primeiras frases — revisão final 4A. Foque no conceito central do conjunto e nos erros comuns."
example: "Parabéns! Você leu os 46 hiragana e ~100 palavras. Ex.: みず → água."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Leitura de palavras misturadas
    description: Leia cada palavra e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "みず (água/leite/suco/chá)", correctAnswer: "água", rationale: "みず (hiragana) significa \"água\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ほん (livro/caneta/mesa/cadeira)", correctAnswer: "livro", rationale: "ほん (hiragana) significa \"livro\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "くるま (carro/barco/avião/trem)", correctAnswer: "carro", rationale: "くるま (hiragana) significa \"carro\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いぬ (cachorro/gato/pássaro/peixe)", correctAnswer: "cachorro", rationale: "いぬ (hiragana) significa \"cachorro\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ねこ (gato/cachorro/pássaro/peixe)", correctAnswer: "gato", rationale: "ねこ lê-se \"gato\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "さかな (peixe/carne/frango/ovo)", correctAnswer: "peixe", rationale: "さかな (hiragana) significa \"peixe\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "やま (montanha/rio/mar/floresta)", correctAnswer: "montanha", rationale: "やま (hiragana) significa \"montanha\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "うみ (mar/rio/lago/montanha)", correctAnswer: "mar", rationale: "うみ lê-se \"mar\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "そら (céu/terra/mar/nuvem)", correctAnswer: "céu", rationale: "そら (hiragana) significa \"céu\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "はな (flor/árvore/folha/pedra)", correctAnswer: "flor", rationale: "はな lê-se \"flor\" (romaji).", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Primeiras frases completas
    description: Leia a frase curta e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "わたしは がくせい。 (Eu sou estudante./Eu sou professor./Ele é estudante./Ela é médica.)", correctAnswer: "Eu sou estudante.", rationale: "A frase \"わたしは がくせい。\" traduz-se como \"Eu sou estudante.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは ほん。 (Isto é um livro./Aquilo é uma mesa./Isto é uma caneta./Aquilo é um livro.)", correctAnswer: "Isto é um livro.", rationale: "A frase \"これは ほん。\" traduz-se como \"Isto é um livro.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いぬが いる。 (Tem um cachorro./Tem um gato./Não tem cachorro./Adeus cachorro.)", correctAnswer: "Tem um cachorro.", rationale: "A frase \"いぬが いる。\" traduz-se como \"Tem um cachorro.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "みずを のむ。 (Bebo água./Como água./Compro água./Vejo água.)", correctAnswer: "Bebo água.", rationale: "A frase \"みずを のむ。\" traduz-se como \"Bebo água.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ほんを よむ。 (Leio um livro./Escrevo um livro./Compro um livro./Vejo um livro.)", correctAnswer: "Leio um livro.", rationale: "A frase \"ほんを よむ。\" traduz-se como \"Leio um livro.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おいしい! (Que gostoso!/Que ruim!/Que quente!/Que frio!)", correctAnswer: "Que gostoso!", rationale: "A frase \"おいしい!\" traduz-se como \"Que gostoso!\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "さむい。 (Está frio./Está quente./Está chovendo./Está nevando.)", correctAnswer: "Está frio.", rationale: "A frase \"さむい。\" traduz-se como \"Está frio.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あめが ふる。 (Está chovendo./Está nevando./Está ventando./Está quente.)", correctAnswer: "Está chovendo.", rationale: "A frase \"あめが ふる。\" traduz-se como \"Está chovendo.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ともだちと あそぶ。 (Brinco com o amigo./Estudo sozinho./Brinco em casa./Como com o amigo.)", correctAnswer: "Brinco com o amigo.", rationale: "A frase \"ともだちと あそぶ。\" traduz-se como \"Brinco com o amigo.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "やまを みる。 (Vejo a montanha./Subo a montanha./Desço a montanha./Gosto da montanha.)", correctAnswer: "Vejo a montanha.", rationale: "A frase \"やまを みる。\" traduz-se como \"Vejo a montanha.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
target: 20
