title: Primeiras frases — revisão final 4A
level: '4A'
subject: japanese
authorNotes: "Primeiras frases — revisão final 4A. Foque no conceito central do conjunto e nos erros comuns."
example: "Parabéns! Você leu os 46 hiragana e ~100 palavras."
pages:
  - pageNumber: 1
    title: Leitura de palavras misturadas
    description: Leia cada palavra e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "みず (água/leite/suco/chá)", correctAnswer: "água" }
      - { type: japanese_vocab, question: "ほん (livro/caneta/mesa/cadeira)", correctAnswer: "livro" }
      - { type: japanese_vocab, question: "くるま (carro/barco/avião/trem)", correctAnswer: "carro" }
      - { type: japanese_vocab, question: "いぬ (cachorro/gato/pássaro/peixe)", correctAnswer: "cachorro" }
      - { type: japanese_vocab, question: "ねこ (gato/cachorro/pássaro/peixe)", correctAnswer: "gato" }
      - { type: japanese_vocab, question: "さかな (peixe/carne/frango/ovo)", correctAnswer: "peixe" }
      - { type: japanese_vocab, question: "やま (montanha/rio/mar/floresta)", correctAnswer: "montanha" }
      - { type: japanese_vocab, question: "うみ (mar/rio/lago/montanha)", correctAnswer: "mar" }
      - { type: japanese_vocab, question: "そら (céu/terra/mar/nuvem)", correctAnswer: "céu" }
      - { type: japanese_vocab, question: "はな (flor/árvore/folha/pedra)", correctAnswer: "flor" }
  - pageNumber: 2
    title: Primeiras frases completas
    description: Leia a frase curta e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "わたしは がくせい。 (Eu sou estudante./Eu sou professor./Ele é estudante./Ela é médica.)", correctAnswer: "Eu sou estudante." }
      - { type: japanese_vocab, question: "これは ほん。 (Isto é um livro./Aquilo é uma mesa./Isto é uma caneta./Aquilo é um livro.)", correctAnswer: "Isto é um livro." }
      - { type: japanese_vocab, question: "いぬが いる。 (Tem um cachorro./Tem um gato./Não tem cachorro./Adeus cachorro.)", correctAnswer: "Tem um cachorro." }
      - { type: japanese_vocab, question: "みずを のむ。 (Bebo água./Como água./Compro água./Vejo água.)", correctAnswer: "Bebo água." }
      - { type: japanese_vocab, question: "ほんを よむ。 (Leio um livro./Escrevo um livro./Compro um livro./Vejo um livro.)", correctAnswer: "Leio um livro." }
      - { type: japanese_vocab, question: "おいしい! (Que gostoso!/Que ruim!/Que quente!/Que frio!)", correctAnswer: "Que gostoso!" }
      - { type: japanese_vocab, question: "さむい。 (Está frio./Está quente./Está chovendo./Está nevando.)", correctAnswer: "Está frio." }
      - { type: japanese_vocab, question: "あめが ふる。 (Está chovendo./Está nevando./Está ventando./Está quente.)", correctAnswer: "Está chovendo." }
      - { type: japanese_vocab, question: "ともだちと あそぶ。 (Brinco com o amigo./Estudo sozinho./Brinco em casa./Como com o amigo.)", correctAnswer: "Brinco com o amigo." }
      - { type: japanese_vocab, question: "やまを みる。 (Vejo a montanha./Subo a montanha./Desço a montanha./Gosto da montanha.)", correctAnswer: "Vejo a montanha." }
