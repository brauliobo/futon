      - { type: japanese_vocab, question: "まめ (feijão/arroz/pão/sopa)", correctAnswer: "feijão", rationale: "まめ (hiragana) significa \"feijão\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "むし (inseto/pássaro/peixe/rato)", correctAnswer: "inseto", rationale: "むし (hiragana) significa \"inseto\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かめ (tartaruga/peixe/polvo/caranguejo)", correctAnswer: "tartaruga", rationale: "かめ (hiragana) significa \"tartaruga\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "もも (pêssego/maçã/laranja/uva)", correctAnswer: "pêssego", rationale: "もも (hiragana) significa \"pêssego\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あめ (chuva/neve/vento/sol)", correctAnswer: "chuva", rationale: "あめ (hiragana) significa \"chuva\" em português.", objectives: [japanese.vocab] }
