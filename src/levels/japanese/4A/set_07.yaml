  - pageNumber: 2
    title: Palavras com M
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "みみ (orelha/olho/nariz/boca)", correctAnswer: "orelha", rationale: "みみ (hiragana) significa \"orelha\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "め (nariz/olho/orelha/boca)", correctAnswer: "olho", rationale: "め lê-se \"olho\" (romaji).", objectives: [japanese.vocab] }
