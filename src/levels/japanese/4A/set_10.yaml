title: Hiragana — Revisão geral dos 46
level: '4A'
subject: japanese
difficulty: 2
authorNotes: "Hiragana — Revisão geral dos 46. Foque no conceito central do conjunto e nos erros comuns."
example: "Agora você conhece todos os 46 hiragana sem diacríticos!. Ex.: あ → a."
pages:
  - pageNumber: 1
    title: Revisão — linhas misturadas
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "あ (a/ka/sa/ta)", correctAnswer: a, rationale: "あ lê-se \"a\" (romaji)." }
      - { type: kana_reading, question: "に (ni/mi/ri/hi)", correctAnswer: ni, rationale: "に lê-se \"ni\" (romaji)." }
      - { type: kana_reading, question: "る (ru/tsu/mu/nu)", correctAnswer: ru, rationale: "る lê-se \"ru\" (romaji)." }
      - { type: kana_reading, question: "ほ (ho/ma/mo/no)", correctAnswer: ho, rationale: "ほ lê-se \"ho\" (romaji)." }
      - { type: kana_reading, question: "せ (se/ke/ne/re)", correctAnswer: se, rationale: "せ lê-se \"se\" (romaji)." }
      - { type: kana_reading, question: "や (ya/ra/sa/ma)", correctAnswer: ya, rationale: "や lê-se \"ya\" (romaji)." }
      - { type: kana_reading, question: "ふ (fu/ha/hi/he)", correctAnswer: fu, rationale: "ふ lê-se \"fu\" (romaji)." }
      - { type: kana_reading, question: "ち (chi/shi/ki/ni)", correctAnswer: chi, rationale: "ち lê-se \"chi\" (romaji)." }
      - { type: kana_reading, question: "め (me/nu/mu/ne)", correctAnswer: me, rationale: "め lê-se \"me\" (romaji)." }
      - { type: kana_reading, question: "を (o/wa/ya/yo)", correctAnswer: o, rationale: "を lê-se \"o\" (romaji)." }
  - pageNumber: 2
    title: Revisão — do som ao hiragana
    description: Veja o som e escolha o hiragana.
    exercises:
      - { type: kana_writing, question: "ka (か/さ/た/な)", correctAnswer: "か", rationale: "O som \"ka\" em hiragana escreve-se か." }
      - { type: kana_writing, question: "shi (し/す/せ/そ)", correctAnswer: "し", rationale: "O som \"shi\" em hiragana escreve-se し." }
      - { type: kana_writing, question: "tsu (つ/ち/て/と)", correctAnswer: "つ", rationale: "O som \"tsu\" em hiragana escreve-se つ." }
      - { type: kana_writing, question: "nu (ぬ/ね/に/の)", correctAnswer: "ぬ", rationale: "O som \"nu\" em hiragana escreve-se ぬ." }
      - { type: kana_writing, question: "he (へ/は/ひ/ほ)", correctAnswer: "へ", rationale: "O som \"he\" em hiragana escreve-se へ." }
      - { type: kana_writing, question: "mo (も/み/む/め)", correctAnswer: "も", rationale: "O som \"mo\" em hiragana escreve-se も." }
      - { type: kana_writing, question: "yu (ゆ/や/よ/わ)", correctAnswer: "ゆ", rationale: "O som \"yu\" em hiragana escreve-se ゆ." }
      - { type: kana_writing, question: "re (れ/り/る/ら)", correctAnswer: "れ", rationale: "O som \"re\" em hiragana escreve-se れ." }
      - { type: kana_writing, question: "n (ん/わ/を/ろ)", correctAnswer: "ん", rationale: "O som \"n\" em hiragana escreve-se ん." }
      - { type: kana_writing, question: "fu (ふ/ひ/は/ほ)", correctAnswer: "ふ", rationale: "O som \"fu\" em hiragana escreve-se ふ." }
target: 20
