title: 💬 Frases simples — sentimentos e estados
level: '4A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Adjetivos de sentimento e estado físico/emocional em hiragana. い-adjetivos simples."
example: "Como você está? Ex.: たのしい → divertido/feliz."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Adjetivos de sentimento
    description: Leia cada adjetivo e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "たのしい (triste/chato/divertido/cansado)", correctAnswer: "divertido", rationale: "たのしい significa \"divertido/feliz\" em japonês.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かなしい (feliz/divertido/triste/animado)", correctAnswer: "triste", rationale: "かなしい significa \"triste\" em japonês.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "うれしい (bravo/triste/assustado/feliz)", correctAnswer: "feliz", rationale: "うれしい significa \"feliz/contente\" em japonês.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "こわい (engraçado/bonito/assustador/triste)", correctAnswer: "assustador", rationale: "こわい significa \"assustador/com medo\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "つかれた (descansado/com fome/com sono/cansado)", correctAnswer: "cansado", rationale: "つかれた significa \"cansado\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おなかがすいた (com sede/cansado/com fome/satisfeito)", correctAnswer: "com fome", rationale: "おなかがすいた significa \"com fome\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "のどがかわいた (com fome/cansado/com sede/com sono)", correctAnswer: "com sede", rationale: "のどがかわいた significa \"com sede\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ねむい (acordado/cansado/alegre/com sono)", correctAnswer: "com sono", rationale: "ねむい significa \"com sono\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いたい (frio/quente/com medo/doendo)", correctAnswer: "doendo", rationale: "いたい significa \"doendo/dói\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "げんき (doente/cansado/triste/bem/saudável)", correctAnswer: "bem/saudável", rationale: "げんき significa \"saudável/bem-disposto\" em japonês.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Frases de estado e sentimento
    description: Leia a frase e escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "たのしい！ (Que chato!/Que divertido!/Que triste!/Que cansativo!)", correctAnswer: "Que divertido!", rationale: "たのしい → divertido. Exclamação de alegria.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "つかれた。 (Estou cansado./Estou feliz./Estou com fome./Estou bem.)", correctAnswer: "Estou cansado.", rationale: "つかれた → cansado. \"Estou cansado.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おなかがすいた。 (Estou satisfeito./Estou com fome./Estou com sede./Estou cansado.)", correctAnswer: "Estou com fome.", rationale: "おなかがすいた → com fome. \"Estou com fome.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "げんきです。 (Estou doente./Estou cansado./Estou bem./Estou triste.)", correctAnswer: "Estou bem.", rationale: "げんきです → forma polida de \"estou bem/saudável\".", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おげんきですか？ (Você está doente?/Como vai você?/Onde está você?/Quem é você?)", correctAnswer: "Como vai você?", rationale: "おげんきですか？ → forma polida de \"como vai você?\".", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あたまが いたい。 (Estou com dor de barriga./Estou com febre./Estou com dor de cabeça./Estou com náusea.)", correctAnswer: "Estou com dor de cabeça.", rationale: "あたま → cabeça; いたい → doendo. \"Dor de cabeça.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "うれしい！ (Que triste!/Que estranho!/Que feliz!/Que assustador!)", correctAnswer: "Que feliz!", rationale: "うれしい → feliz/contente. Exclamação de alegria.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "さむい。 (Está quente./Está chovendo./Está frio./Está nublado.)", correctAnswer: "Está frio.", rationale: "さむい → frio (temperatura). \"Está frio.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あつい。 (Está frio./Está quente./Está ventando./Está nublado.)", correctAnswer: "Está quente.", rationale: "あつい → quente (temperatura). \"Está quente.\"", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "だいじょうぶ？ (Você está com fome?/Você está cansado?/Está tudo bem?/Você está doente?)", correctAnswer: "Está tudo bem?", rationale: "だいじょうぶ？ → \"Está tudo bem?\" Usada para verificar se alguém está ok.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
