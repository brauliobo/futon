title: Hiragana — たちつてと (linha T)
level: '4A'
subject: japanese
difficulty: 1
authorNotes: "Hiragana — たちつてと (linha T). Foque no conceito central do conjunto e nos erros comuns."
example: "ち lê-se 'chi'. つ lê-se 'tsu'."
pages:
  - pageNumber: 1
    title: Reconhecer linha T
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "た (ta/chi/tsu/te/to)", correctAnswer: ta, rationale: "た lê-se \"ta\" (romaji)." }
      - { type: kana_reading, question: "ち (ta/chi/tsu/te/to)", correctAnswer: chi, rationale: "ち lê-se \"chi\" (romaji)." }
      - { type: kana_reading, question: "つ (ta/chi/tsu/te/to)", correctAnswer: tsu, rationale: "つ lê-se \"tsu\" (romaji)." }
      - { type: kana_reading, question: "て (ta/chi/tsu/te/to)", correctAnswer: te, rationale: "て lê-se \"te\" (romaji)." }
      - { type: kana_reading, question: "と (ta/chi/tsu/te/to)", correctAnswer: to, rationale: "と lê-se \"to\" (romaji)." }
      - { type: kana_reading, question: "つ (tsu/te/chi/ta/to)", correctAnswer: tsu, rationale: "つ lê-se \"tsu\" (romaji)." }
      - { type: kana_reading, question: "と (chi/tsu/te/to/ta)", correctAnswer: to, rationale: "と lê-se \"to\" (romaji)." }
      - { type: kana_reading, question: "ち (chi/te/to/ta/tsu)", correctAnswer: chi, rationale: "ち lê-se \"chi\" (romaji)." }
      - { type: kana_reading, question: "た (tsu/te/chi/to/ta)", correctAnswer: ta, rationale: "た lê-se \"ta\" (romaji)." }
      - { type: kana_reading, question: "て (tsu/te/to/ta/chi)", correctAnswer: te, rationale: "て lê-se \"te\" (romaji)." }
  - pageNumber: 2
    title: Primeiras palavras
    description: Leia a palavra e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "て (pé/olho/boca/mão)", correctAnswer: "mão", rationale: "て (hiragana) significa \"mão\" em português." }
      - { type: japanese_vocab, question: "き (árvore/pedra/água/fogo)", correctAnswer: "árvore", rationale: "き (hiragana) significa \"árvore\" em português." }
      - { type: japanese_vocab, question: "いえ (casa/escola/carro/livro)", correctAnswer: "casa", rationale: "いえ lê-se \"casa\" (romaji)." }
      - { type: japanese_vocab, question: "あし (pé/mão/cabeça/braço)", correctAnswer: "pé", rationale: "あし (hiragana) significa \"pé\" em português." }
      - { type: japanese_vocab, question: "かお (rosto/mão/pé/olho)", correctAnswer: "rosto", rationale: "かお (hiragana) significa \"rosto\" em português." }
      - { type: japanese_vocab, question: "くち (boca/olho/orelha/nariz)", correctAnswer: "boca", rationale: "くち lê-se \"boca\" (romaji)." }
      - { type: japanese_vocab, question: "あか (vermelho/azul/verde/amarelo)", correctAnswer: "vermelho", rationale: "あか (hiragana) significa \"vermelho\" em português." }
      - { type: japanese_vocab, question: "うえ (em cima/embaixo/dentro/fora)", correctAnswer: "em cima", rationale: "うえ (hiragana) significa \"em cima\" em português." }
      - { type: japanese_vocab, question: "した (embaixo/em cima/dentro/fora)", correctAnswer: "embaixo", rationale: "した (hiragana) significa \"embaixo\" em português." }
      - { type: japanese_vocab, question: "とけい (relógio/livro/mesa/cadeira)", correctAnswer: "relógio", rationale: "とけい (hiragana) significa \"relógio\" em português." }
target: 20
