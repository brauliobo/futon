title: "📝 Adjetivos な: 元気 好き 嫌い 上手 下手"
level: 'B'
subject: japanese
objectives: [japanese.grammar]
difficulty: 3
authorNotes: "Adjetivos な (na-keiyoushi): energia/saúde, gostar, não gostar, ser bom em, ser ruim em. Precisam de な antes de substantivos."
example: "Adjetivos な + な + substantivo. Ex.: 元気な人 → pessoa saudável. 好きな食べ物 → comida favorita."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Adjetivos な — significado e uso básico
    description: Escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "元気 (com medo/cansado/doente/saudável ou animado)", correctAnswer: "saudável ou animado", rationale: "元気 (げんき) → saudável, animado, bem-disposto. Pergunta comum: 元気ですか? → Como vai?", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "好き (odiar/não gostar/temer/gostar)", correctAnswer: "gostar", rationale: "好き (すき) → gostar. Usa が: 私は寿司が好きです → Gosto de sushi.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嫌い (adorar/gostar/não se importar/não gostar ou odiar)", correctAnswer: "não gostar ou odiar", rationale: "嫌い (きらい) → não gostar, detestar. Par oposto de 好き.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "上手 (ser ruim em/ser indiferente/gostar/ser bom em)", correctAnswer: "ser bom em", rationale: "上手 (じょうず) → ser bom em, habilidoso. 上 (cima) + 手 (mão) → habilidade.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "下手 (ser bom em/ser habilidoso/ter medo/ser ruim em)", correctAnswer: "ser ruim em", rationale: "下手 (へた) → ser ruim em, não ser habilidoso. Par oposto de 上手.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "元気ですか。 (Você está cansado?/Você está doente?/Como vai?/Você está triste?)", correctAnswer: "Como vai?", rationale: "元気ですか → está bem? / como vai? Saudação comum.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "好きな食べ物 (comida ruim/comida odiada/comida estranha/comida favorita)", correctAnswer: "comida favorita", rationale: "好きな → favorito (adjetivo な modifica substantivo com な), 食べ物 → comida.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "上手な先生 (professor ruim/professor novo/professor velho/professor habilidoso)", correctAnswer: "professor habilidoso", rationale: "上手な → habilidoso (adjetivo な), 先生 → professor.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "嫌いな野菜 (legume favorito/legume pequeno/legume novo/legume detestado)", correctAnswer: "legume detestado", rationale: "嫌いな → detestado/que não gosta (adjetivo な), 野菜 → legume/vegetal.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "下手なスポーツ (esporte preferido/esporte detestado/esporte fácil/esporte que joga mal)", correctAnswer: "esporte que joga mal", rationale: "下手な → ruim em (adjetivo な), スポーツ → esporte.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Adjetivos な em frases
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "私は音楽が好きです。 (Sou professor de música./Não gosto de música./Sou músico./Gosto de música.)", correctAnswer: "Gosto de música.", rationale: "私は → eu (tópico), 音楽が → música (sujeito), 好きです → gosto de.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は料理が上手です。 (Ela detesta cozinhar./Ela é ruim na cozinha./Ela é boa na cozinha./Ela quer aprender a cozinhar.)", correctAnswer: "Ela é boa na cozinha.", rationale: "彼女は → ela (tópico), 料理が → cozinha (sujeito), 上手です → é boa em.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "私は数学が嫌いです。 (Sou bom em matemática./Adoro matemática./Não gosto de matemática./Gosto de matemática.)", correctAnswer: "Não gosto de matemática.", rationale: "私は → eu, 数学が → matemática (sujeito), 嫌いです → não gosto de.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "元気じゃないです。 (Estou muito bem./Estou animado./Não estou bem./Estou descansado.)", correctAnswer: "Não estou bem.", rationale: "元気じゃない → não está bem (negativo de adjetivo な: じゃない).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語が上手ですね。 (Seu japonês é ruim./Você gosta de japonês!/Seu japonês é ótimo!/Você não é bom em japonês.)", correctAnswer: "Seu japonês é ótimo!", rationale: "日本語が → japonês, 上手ですね → é bom, não é? (ね → confirmação/elogio).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "何の音楽が好きですか。 (Que tipo de música você toca?/Que tipo de música você detesta?/Que tipo de música você gosta?/Que tipo de música você estuda?)", correctAnswer: "Que tipo de música você gosta?", rationale: "何の音楽が → que tipo de música, 好きですか → gosta? (pergunta).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "スポーツが好きな人です。 (É uma pessoa que detesta esporte./É uma pessoa que joga esporte mal./É uma pessoa que gosta de esporte./É uma pessoa que pratica esporte.)", correctAnswer: "É uma pessoa que gosta de esporte.", rationale: "スポーツが好きな → que gosta de esporte (な antes do substantivo), 人 → pessoa.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "歌が下手でも、好きです。 (Gosto de cantar porque sou bom./Mesmo sendo ruim em cantar, gosto./Sou bom mas não gosto de cantar./Não canto porque sou ruim.)", correctAnswer: "Mesmo sendo ruim em cantar, gosto.", rationale: "歌が下手でも → mesmo sendo ruim em cantar, 好きです → gosto.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "元気な子どもたちが好きです。 (Não gosto de crianças animadas./Gosto de crianças doentes./Gosto de crianças animadas./Prefiro crianças calmas.)", correctAnswer: "Gosto de crianças animadas.", rationale: "元気な子どもたちが → crianças animadas (sujeito), 好きです → gosto de.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼はテニスが上手じゃないです。 (Ele joga tênis bem./Ele gosta de tênis./Ele não joga tênis bem./Ele não gosta de tênis.)", correctAnswer: "Ele não joga tênis bem.", rationale: "彼は → ele, テニスが → tênis, 上手じゃないです → não é bom em (negativo de 上手).", difficulty: 4, objectives: [japanese.grammar] }
target: 20
