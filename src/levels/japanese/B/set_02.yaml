      - { type: japanese_vocab, question: "耳 (orelha/olho/boca/nariz)", correctAnswer: "orelha", rationale: "O kanji 耳 significa \"orelha\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "口 (boca/olho/orelha/nariz)", correctAnswer: "boca", objectives: [japanese.vocab], rationale: "O kanji 口 significa \"boca\". Observe o desenho como pista visual." }
