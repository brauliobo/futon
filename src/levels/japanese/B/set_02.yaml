      - { type: japanese_vocab, question: "鼻 (nariz/boca/orelha/olho)", correctAnswer: "nariz", rationale: "O kanji 鼻 significa \"nariz\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "歯 (dente/língua/lábio/garganta)", correctAnswer: "dente", rationale: "O kanji 歯 significa \"dente\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
