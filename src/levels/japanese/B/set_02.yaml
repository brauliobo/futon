  - pageNumber: 3
    title: Frases com corpo
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "手を洗う。 (Lavar as mãos./Lavar os pés./Lavar o rosto./Lavar o cabelo.)", correctAnswer: "Lavar as mãos.", rationale: "O kanji 手を洗う。 significa \"Lavar as mãos.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "目が痛い。 (O olho está doendo./A boca está doendo./A orelha está doendo./A cabeça está doendo.)", correctAnswer: "O olho está doendo.", rationale: "O kanji 目が痛い。 significa \"O olho está doendo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "頭が痛い。 (A cabeça está doendo./O pé está doendo./A mão está doendo./O estômago está doendo.)", correctAnswer: "A cabeça está doendo.", rationale: "O kanji 頭が痛い。 significa \"A cabeça está doendo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "口を開ける。 (Abrir a boca./Fechar a boca./Abrir o olho./Fechar o olho.)", correctAnswer: "Abrir a boca.", rationale: "O kanji 口を開ける。 significa \"Abrir a boca.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "耳で聞く。 (Ouvir com a orelha./Ver com o olho./Falar com a boca./Cheirar com o nariz.)", correctAnswer: "Ouvir com a orelha.", rationale: "O kanji 耳で聞く。 significa \"Ouvir com a orelha.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "足が速い。 (O pé é rápido — corre rápido/O pé é lento/A mão é rápida/A cabeça é rápida)", correctAnswer: "O pé é rápido — corre rápido", rationale: "O kanji 足が速い。 significa \"O pé é rápido — corre rápido\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "顔を洗う。 (Lavar o rosto./Lavar a mão./Lavar o pé./Lavar o cabelo.)", correctAnswer: "Lavar o rosto.", rationale: "O kanji 顔を洗う。 significa \"Lavar o rosto.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "歯を磨く。 (Escovar os dentes./Escovar o cabelo./Lavar o rosto./Cortar as unhas.)", correctAnswer: "Escovar os dentes.", rationale: "O kanji 歯を磨く。 significa \"Escovar os dentes.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "鼻が大きい。 (O nariz é grande./A boca é grande./A orelha é grande./O olho é grande.)", correctAnswer: "O nariz é grande.", rationale: "O kanji 鼻が大きい。 significa \"O nariz é grande.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "目が大きい。 (Os olhos são grandes./A boca é grande./O nariz é grande./A orelha é grande.)", correctAnswer: "Os olhos são grandes.", rationale: "O kanji 目が大きい。 significa \"Os olhos são grandes.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
