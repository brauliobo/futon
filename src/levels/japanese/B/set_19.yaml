title: 📝 Expressões de frequência — いつも/よく/たまに/ぜんぜん
level: 'B'
subject: japanese
objectives: [japanese.grammar]
difficulty: 3
authorNotes: "Advérbios de frequência: いつも (sempre), よく (frequentemente), たまに (às vezes), あまり (não muito), ぜんぜん (nunca/de jeito nenhum)."
example: "Frequência do mais ao menos: いつも→よく→たまに→あまり→ぜんぜん. Ex.: ぜんぜん食べません → Não como de jeito nenhum."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Advérbios de frequência — significado
    description: Escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "いつも (nunca/às vezes/frequentemente/sempre)", correctAnswer: "sempre", rationale: "いつも = sempre, o tempo todo. Indica ação muito regular.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "よく (sempre/nunca/frequentemente/raramente)", correctAnswer: "frequentemente", rationale: "よく = frequentemente, bastante, com frequência. Menos absoluto que いつも.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たまに (nunca/sempre/frequentemente/às vezes)", correctAnswer: "às vezes", rationale: "たまに = às vezes, de vez em quando, ocasionalmente.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あまり～ない (nunca/sempre/não muito/frequentemente)", correctAnswer: "não muito", rationale: "あまり～ない = não muito, não tanto (precisa de forma negativa). Ex.: あまり食べない = não como muito.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ぜんぜん～ない (às vezes/frequentemente/sempre/nunca)", correctAnswer: "nunca", rationale: "ぜんぜん～ない = nunca, de jeito nenhum (com negativo). Ex.: ぜんぜん分からない = não entendo nada.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "毎日 (toda semana/todo mês/às vezes/todo dia)", correctAnswer: "todo dia", rationale: "毎日 (まいにち) = todo dia. Kanji 毎 = cada + 日 = dia.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "いつも朝ごはんを食べます。 (Às vezes como café da manhã./Frequentemente como café da manhã./Nunca como café da manhã./Sempre como café da manhã.)", correctAnswer: "Sempre como café da manhã.", rationale: "いつも = sempre, 朝ごはんを食べます = comer café da manhã.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ぜんぜん日本語が分かりません。 (Entendo bem japonês./Entendo um pouco de japonês./Às vezes entendo japonês./Não entendo japonês de jeito nenhum.)", correctAnswer: "Não entendo japonês de jeito nenhum.", rationale: "ぜんぜん = de jeito nenhum, 日本語が分かりません = não entendo japonês.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "よく映画を見ます。 (Nunca vejo filme./Raramente vejo filme./Frequentemente vejo filme./Às vezes vejo filme.)", correctAnswer: "Frequentemente vejo filme.", rationale: "よく = frequentemente, 映画を見ます = ver filme.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あまり野菜を食べません。 (Como muitos legumes./Nunca como legumes./Às vezes como legumes./Não como muitos legumes.)", correctAnswer: "Não como muitos legumes.", rationale: "あまり + ません = não muito, 野菜を食べません = não comer legumes.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Frequência em frases e diálogos
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "「よく運動しますか」「いいえ、あまりしません」 (Sim, me exercito muito./Não, me exercito frequentemente./Não, não me exercito muito./Sim, às vezes me exercito.)", correctAnswer: "Não, não me exercito muito.", rationale: "いいえ = não, あまりしません = não faço muito (あまり + negativo).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たまに外食します。 (Nunca como fora./Sempre como fora./Às vezes como fora./Frequentemente como fora.)", correctAnswer: "Às vezes como fora.", rationale: "たまに = às vezes, 外食します = comer fora (外食 = refeição fora de casa).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "いつも何時に起きますか。 (A que horas você acorda às vezes?/Quando você costuma se levantar tarde?/A que horas você sempre acorda?/Por que você acorda cedo?)", correctAnswer: "A que horas você sempre acorda?", rationale: "いつも = sempre, 何時に = a que horas, 起きますか = acorda?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ぜんぜん疲れません。 (Estou sempre cansado./Não fico cansado de jeito nenhum./Às vezes fico cansado./Frequentemente fico cansado.)", correctAnswer: "Não fico cansado de jeito nenhum.", rationale: "ぜんぜん = de jeito nenhum, 疲れません = não fica cansado.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "よく図書館で勉強します。 (Nunca estudo na biblioteca./Às vezes estudo na biblioteca./Estudo frequentemente na biblioteca./Sempre estudo em casa.", correctAnswer: "Estudo frequentemente na biblioteca.", rationale: "よく = frequentemente, 図書館で勉強します = estudar na biblioteca.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あまり甘いものを食べません。 (Não como muito doce./Nunca como doce./Como muito doce./Às vezes como doce.)", correctAnswer: "Não como muito doce.", rationale: "あまり + ません = não muito, 甘いものを食べません = não comer doce.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "毎週末友だちと会います。 (Às vezes encontro amigos./Nunca encontro amigos./Encontro amigos toda semana./Frequentemente encontro amigos.)", correctAnswer: "Encontro amigos toda semana.", rationale: "毎週末 = todo fim de semana (毎 = cada + 週末 = fim de semana), 友だちと会います = encontrar amigos.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "「日本語を勉強していますか」「はい、よく勉強しています」 (Sim, às vezes estudo./Sim, nunca estudo./Sim, estudo frequentemente./Não, não estudo muito.)", correctAnswer: "Sim, estudo frequentemente.", rationale: "はい = sim, よく勉強しています = estudo frequentemente.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "たまにしか日本語を使いません。 (Uso japonês frequentemente./Nunca uso japonês./Uso japonês o tempo todo./Uso japonês apenas às vezes.)", correctAnswer: "Uso japonês apenas às vezes.", rationale: "たまにしか + ません = apenas às vezes (ênfase na raridade), 日本語を使います = usar japonês.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "いつも早く起きているのに、今日は遅くなりました。 (Sempre acordo tarde mas hoje acordei cedo./Sempre acordo cedo mas hoje acordei tarde./Às vezes acordo tarde e hoje também./Nunca acordo cedo.)", correctAnswer: "Sempre acordo cedo mas hoje acordei tarde.", rationale: "いつも早く起きている = sempre acordo cedo, のに = mas/embora (contraste), 今日は遅くなりました = hoje acordei tarde.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
