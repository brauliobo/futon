title: Negativa ～ません + revisão B
level: 'B'
subject: japanese
difficulty: 4
authorNotes: "Negativa ～ません + revisão B. Foque no conceito central do conjunto e nos erros comuns."
example: "食べます → 食べません (não como), 飲みません (não bebo)"
pages:
  - pageNumber: 1
    title: Forma negativa
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "食べません (não comer/comer/vai comer/comeu)", correctAnswer: "não comer", rationale: "O kanji 食べません significa \"não comer\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "飲みません (não beber/beber/vai beber/bebeu)", correctAnswer: "não beber", rationale: "O kanji 飲みません significa \"não beber\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "見ません (não ver/ver/vai ver/viu)", correctAnswer: "não ver", rationale: "O kanji 見ません significa \"não ver\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "聞きません (não ouvir/ouvir/vai ouvir/ouviu)", correctAnswer: "não ouvir", rationale: "O kanji 聞きません significa \"não ouvir\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "行きません (não ir/ir/vai ir/foi)", correctAnswer: "não ir", rationale: "O kanji 行きません significa \"não ir\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "来ません (não vir/vir/vai vir/veio)", correctAnswer: "não vir", rationale: "O kanji 来ません significa \"não vir\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "買いません (não comprar/comprar/vai comprar/comprou)", correctAnswer: "não comprar", rationale: "O kanji 買いません significa \"não comprar\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "分かりません (não entender/entender/vai entender/entendeu)", correctAnswer: "não entender", rationale: "O kanji 分かりません significa \"não entender\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "知りません (não saber/saber/vai saber/soube)", correctAnswer: "não saber", rationale: "O kanji 知りません significa \"não saber\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "会いません (não encontrar/encontrar/vai encontrar/encontrou)", correctAnswer: "não encontrar", rationale: "O kanji 会いません significa \"não encontrar\". Observe o desenho como pista visual." }
  - pageNumber: 2
    title: Frases negativas
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "肉を食べません。 (Não como carne./Como carne./Gosto de carne./Odeio carne.)", correctAnswer: "Não como carne.", rationale: "O kanji 肉を食べません。 significa \"Não como carne.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "コーヒーを飲みません。 (Não bebo café./Bebo café./Gosto de café./Odeio café.)", correctAnswer: "Não bebo café.", rationale: "O kanji コーヒーを飲みません。 significa \"Não bebo café.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "日本語が分かりません。 (Não entendo japonês./Entendo japonês./Falo japonês./Aprendo japonês.)", correctAnswer: "Não entendo japonês.", rationale: "O kanji 日本語が分かりません。 significa \"Não entendo japonês.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "山田さんを知りません。 (Não conheço o Sr. Yamada./Conheço o Sr. Yamada./Vou conhecer./Vi o Sr. Yamada.)", correctAnswer: "Não conheço o Sr. Yamada.", rationale: "O kanji 山田さんを知りません。 significa \"Não conheço o Sr. Yamada.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "明日は学校に行きません。 (Amanhã não vou à escola./Amanhã vou à escola./Hoje não vou./Fui à escola ontem.)", correctAnswer: "Amanhã não vou à escola.", rationale: "O kanji 明日は学校に行きません。 significa \"Amanhã não vou à escola.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "映画を見ません。 (Não vejo filme./Vejo filme./Gosto de filme./Fiz um filme.)", correctAnswer: "Não vejo filme.", rationale: "O kanji 映画を見ません。 significa \"Não vejo filme.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "電車で行きません。 (Não vou de trem./Vou de trem./Volto de trem./Vou a pé.)", correctAnswer: "Não vou de trem.", rationale: "O kanji 電車で行きません。 significa \"Não vou de trem.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "たばこを吸いません。 (Não fumo./Fumo./Gosto de fumo./Odeio fumo.)", correctAnswer: "Não fumo.", rationale: "O kanji たばこを吸いません。 significa \"Não fumo.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "今日は勉強しません。 (Hoje não estudo./Hoje estudo./Ontem não estudei./Amanhã não estudo.)", correctAnswer: "Hoje não estudo.", rationale: "O kanji 今日は勉強しません。 significa \"Hoje não estudo.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "週末は働きません。 (Não trabalho no fim de semana./Trabalho no fim de semana./Estudo no fim de semana./Não descanso.)", correctAnswer: "Não trabalho no fim de semana.", rationale: "O kanji 週末は働きません。 significa \"Não trabalho no fim de semana.\". Observe o desenho como pista visual." }
  - pageNumber: 3
    title: Revisão B — mini-diálogos
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "「何を食べますか」「パンを食べます」 (Como pão./Comi pão./Não como pão./O que vai comer?)", correctAnswer: "Como pão.", rationale: "O kanji 「何を食べますか」「パンを食べます」 significa \"Como pão.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「どこへ行きますか」「学校へ行きます」 (Vou à escola./Venho da escola./Estou na escola./Saio da escola.)", correctAnswer: "Vou à escola.", rationale: "O kanji 「どこへ行きますか」「学校へ行きます」 significa \"Vou à escola.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「日本人ですか」「いいえ、ブラジル人です」 (Não, sou brasileiro./Sim, sou japonês./Não, não sou ninguém./Sim, sou brasileiro.)", correctAnswer: "Não, sou brasileiro.", rationale: "O kanji 「日本人ですか」「いいえ、ブラジル人です」 significa \"Não, sou brasileiro.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「お父さんは先生ですか」「はい、先生です」 (Sim, é professor./Não, não é professor./Ele é médico./Ela é professora.)", correctAnswer: "Sim, é professor.", rationale: "O kanji 「お父さんは先生ですか」「はい、先生です」 significa \"Sim, é professor.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「犬が好きですか」「いいえ、猫が好きです」 (Não, gosto de gato./Sim, gosto de cachorro./Não gosto de nada./Gosto de ambos.)", correctAnswer: "Não, gosto de gato.", rationale: "O kanji 「犬が好きですか」「いいえ、猫が好きです」 significa \"Não, gosto de gato.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「肉を食べますか」「いいえ、食べません」 (Não, não como./Sim, como./Às vezes./Gosto muito.)", correctAnswer: "Não, não como.", rationale: "O kanji 「肉を食べますか」「いいえ、食べません」 significa \"Não, não como.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「いつ会いますか」「土曜日に会います」 (Nos encontramos no sábado./Nos encontramos hoje./Não nos encontramos./Já nos encontramos.)", correctAnswer: "Nos encontramos no sábado.", rationale: "O kanji 「いつ会いますか」「土曜日に会います」 significa \"Nos encontramos no sábado.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「どこで勉強しますか」「図書館で勉強します」 (Estudo na biblioteca./Estudo em casa./Não estudo./Estudo na escola.)", correctAnswer: "Estudo na biblioteca.", rationale: "O kanji 「どこで勉強しますか」「図書館で勉強します」 significa \"Estudo na biblioteca.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「何で行きますか」「バスで行きます」 (Vou de ônibus./Vou a pé./Vou de carro./Vou de trem.)", correctAnswer: "Vou de ônibus.", rationale: "O kanji 「何で行きますか」「バスで行きます」 significa \"Vou de ônibus.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "「日本語が分かりますか」「少し分かります」 (Entendo um pouco./Não entendo nada./Entendo tudo./Não sei.)", correctAnswer: "Entendo um pouco.", rationale: "O kanji 「日本語が分かりますか」「少し分かります」 significa \"Entendo um pouco.\". Observe o desenho como pista visual." }
target: 30
