title: Kanji — Família 父 母 兄 姉 弟 妹
level: 'B'
subject: japanese
authorNotes: "Kanji — Família 父 母 兄 姉 弟 妹. Foque no conceito central do conjunto e nos erros comuns."
example: "父 = meu pai (ちち), お父さん = pai (de alguém) (おとうさん)"
pages:
  - pageNumber: 1
    title: Família
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "父 (pai/mãe/irmão/irmã)", correctAnswer: "pai" }
      - { type: japanese_vocab, question: "母 (mãe/pai/irmão/irmã)", correctAnswer: "mãe", rationale: "O kanji 母 significa \"mãe\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "兄 (irmão mais velho/irmão mais novo/irmã mais velha/irmã mais nova)", correctAnswer: "irmão mais velho", rationale: "O kanji 兄 significa \"irmão mais velho\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "姉 (irmã mais velha/irmão mais velho/irmã mais nova/irmão mais novo)", correctAnswer: "irmã mais velha", rationale: "O kanji 姉 significa \"irmã mais velha\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "弟 (irmão mais novo/irmão mais velho/irmã mais nova/irmã mais velha)", correctAnswer: "irmão mais novo", rationale: "O kanji 弟 significa \"irmão mais novo\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "妹 (irmã mais nova/irmã mais velha/irmão mais novo/irmão mais velho)", correctAnswer: "irmã mais nova", rationale: "O kanji 妹 significa \"irmã mais nova\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "家族 (família/amigo/vizinho/colega)", correctAnswer: "família", rationale: "O kanji 家族 significa \"família\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "両親 (pais/filhos/avós/tios)", correctAnswer: "pais" }
      - { type: japanese_vocab, question: "兄弟 (irmãos/irmãs/pais/filhos)", correctAnswer: "irmãos", rationale: "O kanji 兄弟 significa \"irmãos\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "姉妹 (irmãs/irmãos/pais/filhos)", correctAnswer: "irmãs", rationale: "O kanji 姉妹 significa \"irmãs\". Observe o desenho como pista visual." }
  - pageNumber: 2
    title: Leituras humilde vs formal
    description: Escolha a leitura.
    exercises:
      - { type: japanese_vocab, question: "父 (ちち/はは/あに/あね)", correctAnswer: "ちち", rationale: "父 lê-se ちち. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "母 (はは/ちち/あに/あね)", correctAnswer: "はは", rationale: "母 lê-se はは. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "兄 (あに/あね/おとうと/いもうと)", correctAnswer: "あに", rationale: "兄 lê-se あに. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "姉 (あね/あに/おとうと/いもうと)", correctAnswer: "あね", rationale: "姉 lê-se あね. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "弟 (おとうと/いもうと/あに/あね)", correctAnswer: "おとうと", rationale: "弟 lê-se おとうと. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "妹 (いもうと/おとうと/あに/あね)", correctAnswer: "いもうと", rationale: "妹 lê-se いもうと. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "お父さん (おとうさん/おかあさん/おにいさん/おねえさん)", correctAnswer: "おとうさん", rationale: "お父さん lê-se おとうさん. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "お母さん (おかあさん/おとうさん/おにいさん/おねえさん)", correctAnswer: "おかあさん", rationale: "お母さん lê-se おかあさん. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "お兄さん (おにいさん/おねえさん/おとうさん/おかあさん)", correctAnswer: "おにいさん", rationale: "お兄さん lê-se おにいさん. Pratique associar o traço ao som." }
      - { type: japanese_vocab, question: "お姉さん (おねえさん/おにいさん/おとうさん/おかあさん)", correctAnswer: "おねえさん", rationale: "お姉さん lê-se おねえさん. Pratique associar o traço ao som." }
  - pageNumber: 3
    title: Frases de família
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "私の父は先生です。 (Meu pai é professor./Minha mãe é professora./Meu irmão é professor./Meu pai é médico.)", correctAnswer: "Meu pai é professor.", rationale: "O kanji 私の父は先生です。 significa \"Meu pai é professor.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "母は医者です。 (Minha mãe é médica./Meu pai é médico./Minha mãe é professora./Meu irmão é médico.)", correctAnswer: "Minha mãe é médica.", rationale: "O kanji 母は医者です。 significa \"Minha mãe é médica.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "兄は大学生です。 (Meu irmão mais velho é universitário./Minha irmã mais velha é universitária./Meu irmão mais novo é universitário./Meu pai é universitário.)", correctAnswer: "Meu irmão mais velho é universitário.", rationale: "O kanji 兄は大学生です。 significa \"Meu irmão mais velho é universitário.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "妹は小学生です。 (Minha irmã mais nova é fundamental I./Meu irmão mais novo é fundamental I./Minha irmã mais velha é fundamental I./Meu irmão mais velho é fundamental I.)", correctAnswer: "Minha irmã mais nova é fundamental I.", rationale: "O kanji 妹は小学生です。 significa \"Minha irmã mais nova é fundamental I.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "家族は五人です。 (Minha família tem cinco pessoas./Minha família tem três pessoas./Minha família tem quatro pessoas./Minha família tem seis pessoas.)", correctAnswer: "Minha família tem cinco pessoas.", rationale: "O kanji 家族は五人です。 significa \"Minha família tem cinco pessoas.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "兄弟がいますか。 (Você tem irmãos?/Você tem pais?/Você tem filhos?/Você tem família?)", correctAnswer: "Você tem irmãos?", rationale: "O kanji 兄弟がいますか。 significa \"Você tem irmãos?\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "両親は日本人です。 (Meus pais são japoneses./Meu pai é japonês./Minha mãe é japonesa./Minha família é japonesa.)", correctAnswer: "Meus pais são japoneses.", rationale: "O kanji 両親は日本人です。 significa \"Meus pais são japoneses.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "お父さんはお元気ですか。 (Como está seu pai?/Como está sua mãe?/Seu pai é bem?/Seu pai gosta?)", correctAnswer: "Como está seu pai?", rationale: "O kanji お父さんはお元気ですか。 significa \"Como está seu pai?\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "私は姉が二人います。 (Tenho duas irmãs mais velhas./Tenho dois irmãos mais velhos./Tenho duas irmãs mais novas./Tenho dois irmãos mais novos.)", correctAnswer: "Tenho duas irmãs mais velhas.", rationale: "O kanji 私は姉が二人います。 significa \"Tenho duas irmãs mais velhas.\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "弟はスポーツが好きです。 (Meu irmão mais novo gosta de esportes./Minha irmã mais nova gosta de esportes./Meu irmão mais velho gosta de esportes./Meu pai gosta de esportes.)", correctAnswer: "Meu irmão mais novo gosta de esportes.", rationale: "O kanji 弟はスポーツが好きです。 significa \"Meu irmão mais novo gosta de esportes.\". Observe o desenho como pista visual." }
target: 30
