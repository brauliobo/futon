title: Partícula で (local da ação / meio)
level: 'B'
subject: japanese
example: "で = local onde a ação acontece OU meio usado: 電車で = de trem."
pages:
  - pageNumber: 1
    title: Identificar で
    description: Escolha a partícula correta.
    exercises:
      - { type: japanese_vocab, question: "Estudar na biblioteca: 図書館__勉強する (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Comer no restaurante: レストラン__食べる (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Ir de trem: 電車__行く (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Escrever com caneta: ペン__書く (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Falar em japonês: 日本語__話す (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Jogar no parque: 公園__遊ぶ (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Comprar no supermercado: スーパー__買う (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Qual não precisa de で? (andando/trem/carro/avião)", correctAnswer: "andando" }
      - { type: japanese_vocab, question: "Ir de bicicleta: 自転車__行く (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Trabalhar na empresa: 会社__働く (で/に/を/は)", correctAnswer: "で" }
  - pageNumber: 2
    title: Frases com で
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "図書館で勉強する。 (Estudar na biblioteca./Ir à biblioteca./Sair da biblioteca./Comprar biblioteca.)", correctAnswer: "Estudar na biblioteca." }
      - { type: japanese_vocab, question: "レストランで食事をする。 (Fazer refeição no restaurante./Ir ao restaurante./Sair do restaurante./Cozinhar em casa.)", correctAnswer: "Fazer refeição no restaurante." }
      - { type: japanese_vocab, question: "電車で東京に行く。 (Ir a Tóquio de trem./Ir a Tóquio de ônibus./Ir a Tóquio de avião./Ir a Tóquio a pé.)", correctAnswer: "Ir a Tóquio de trem." }
      - { type: japanese_vocab, question: "日本語で話す。 (Falar em japonês./Falar inglês./Aprender japonês./Escrever em japonês.)", correctAnswer: "Falar em japonês." }
      - { type: japanese_vocab, question: "鉛筆で書く。 (Escrever com lápis./Escrever com caneta./Apagar com lápis./Desenhar com lápis.)", correctAnswer: "Escrever com lápis." }
      - { type: japanese_vocab, question: "家族で旅行する。 (Viajar com a família./Viajar sozinho./Visitar a família./Não viajar.)", correctAnswer: "Viajar com a família." }
      - { type: japanese_vocab, question: "学校で友だちに会う。 (Encontrar amigos na escola./Encontrar amigos fora da escola./Ir à escola./Sair da escola.)", correctAnswer: "Encontrar amigos na escola." }
      - { type: japanese_vocab, question: "車で行きます。 (Vou de carro./Vou a pé./Vou de ônibus./Vou de bicicleta.)", correctAnswer: "Vou de carro." }
      - { type: japanese_vocab, question: "公園で遊ぶ。 (Brincar no parque./Ir ao parque./Ver o parque./Sair do parque.)", correctAnswer: "Brincar no parque." }
      - { type: japanese_vocab, question: "カフェでコーヒーを飲む。 (Tomar café na cafeteria./Comprar café./Fazer café./Vender café.)", correctAnswer: "Tomar café na cafeteria." }
  - pageNumber: 3
    title: に vs で (ambos aparecem em frases)
    description: Escolha a partícula correta para cada posição.
    exercises:
      - { type: japanese_vocab, question: "Vou à escola (direção): 学校__行く (に/で/を/は)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Estudo na escola (local da ação): 学校__勉強する (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Vou ao parque: 公園__行く (に/で/を/は)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Brinco no parque: 公園__遊ぶ (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Tem gato na caixa: 箱__猫がいる (に/で/を/は)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Compro na loja: 店__買う (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Às 3h: 三時__ (に/で/を/は)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Com a mão: 手__ (で/に/を/は)", correctAnswer: "で" }
      - { type: japanese_vocab, question: "Em Tóquio (existe): 東京__住む (に/で/を/は)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Em Tóquio (evento ocorre): 東京__会議がある (で/に/を/は)", correctAnswer: "で" }
