      - { type: japanese_vocab, question: "Às 3h: 三時__ (に/で/を/は)", correctAnswer: "に", rationale: "Às 3h: 三時__ lê-se に. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Com a mão: 手__ (で/に/を/は)", correctAnswer: "で", rationale: "Com a mão: 手__ lê-se で. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
