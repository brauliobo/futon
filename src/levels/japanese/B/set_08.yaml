      - { type: japanese_vocab, question: "Ir de trem: 電車__行く (で/に/を/は)", correctAnswer: "で", rationale: "Ir de trem: 電車__行く lê-se で. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Escrever com caneta: ペン__書く (で/に/を/は)", correctAnswer: "で", rationale: "Escrever com caneta: ペン__書く lê-se で. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Falar em japonês: 日本語__話す (で/に/を/は)", correctAnswer: "で", rationale: "Falar em japonês: 日本語__話す lê-se で. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Jogar no parque: 公園__遊ぶ (で/に/を/は)", correctAnswer: "で", rationale: "Jogar no parque: 公園__遊ぶ lê-se で. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Comprar no supermercado: スーパー__買う (で/に/を/は)", correctAnswer: "で", rationale: "Comprar no supermercado: スーパー__買う lê-se で. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Qual não precisa de で? (andando/trem/carro/avião)", correctAnswer: "andando", rationale: "A frase \"Qual não precisa de で?\" traduz-se como \"andando\". Identifique partículas e palavras-chave.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Ir de bicicleta: 自転車__行く (で/に/を/は)", correctAnswer: "で", rationale: "Ir de bicicleta: 自転車__行く lê-se で. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Trabalhar na empresa: 会社__働く (で/に/を/は)", correctAnswer: "で", rationale: "Trabalhar na empresa: 会社__働く lê-se で. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Frases com で
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "図書館で勉強する。 (Estudar na biblioteca./Ir à biblioteca./Sair da biblioteca./Comprar biblioteca.)", correctAnswer: "Estudar na biblioteca.", rationale: "O kanji 図書館で勉強する。 significa \"Estudar na biblioteca.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "レストランで食事をする。 (Fazer refeição no restaurante./Ir ao restaurante./Sair do restaurante./Cozinhar em casa.)", correctAnswer: "Fazer refeição no restaurante.", rationale: "O kanji レストランで食事をする。 significa \"Fazer refeição no restaurante.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "電車で東京に行く。 (Ir a Tóquio de trem./Ir a Tóquio de ônibus./Ir a Tóquio de avião./Ir a Tóquio a pé.)", correctAnswer: "Ir a Tóquio de trem.", rationale: "O kanji 電車で東京に行く。 significa \"Ir a Tóquio de trem.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "日本語で話す。 (Falar em japonês./Falar inglês./Aprender japonês./Escrever em japonês.)", correctAnswer: "Falar em japonês.", rationale: "O kanji 日本語で話す。 significa \"Falar em japonês.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "鉛筆で書く。 (Escrever com lápis./Escrever com caneta./Apagar com lápis./Desenhar com lápis.)", correctAnswer: "Escrever com lápis.", rationale: "O kanji 鉛筆で書く。 significa \"Escrever com lápis.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "家族で旅行する。 (Viajar com a família./Viajar sozinho./Visitar a família./Não viajar.)", correctAnswer: "Viajar com a família.", rationale: "O kanji 家族で旅行する。 significa \"Viajar com a família.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "学校で友だちに会う。 (Encontrar amigos na escola./Encontrar amigos fora da escola./Ir à escola./Sair da escola.)", correctAnswer: "Encontrar amigos na escola.", rationale: "O kanji 学校で友だちに会う。 significa \"Encontrar amigos na escola.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "車で行きます。 (Vou de carro./Vou a pé./Vou de ônibus./Vou de bicicleta.)", correctAnswer: "Vou de carro.", rationale: "O kanji 車で行きます。 significa \"Vou de carro.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "公園で遊ぶ。 (Brincar no parque./Ir ao parque./Ver o parque./Sair do parque.)", correctAnswer: "Brincar no parque.", rationale: "O kanji 公園で遊ぶ。 significa \"Brincar no parque.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "カフェでコーヒーを飲む。 (Tomar café na cafeteria./Comprar café./Fazer café./Vender café.)", correctAnswer: "Tomar café na cafeteria.", rationale: "O kanji カフェでコーヒーを飲む。 significa \"Tomar café na cafeteria.\". Observe o desenho como pista visual.", difficulty: 4, objectives: [japanese.vocab] }
