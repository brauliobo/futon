title: Partícula で (local da ação / meio)
level: 'B'
subject: japanese
objectives: [japanese.vocab]
difficulty: 4
authorNotes: "Partícula で (local da ação / meio). Foque no conceito central do conjunto e nos erros comuns."
example: "で = local onde a ação acontece OU meio usado: 電車で = de trem."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Identificar で
    description: Escolha a partícula correta.
    exercises:
      - { type: japanese_vocab, question: "Estudar na biblioteca: 図書館__勉強する (で/に/を/は)", correctAnswer: "で", rationale: "Estudar na biblioteca: 図書館__勉強する lê-se で. Pratique associar o traço ao som.", difficulty: 4, objectives: [japanese.vocab] }
