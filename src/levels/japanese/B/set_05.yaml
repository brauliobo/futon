title: Partícula は (tópico) e が (sujeito)
level: 'B'
subject: japanese
authorNotes: "Partícula は (tópico) e が (sujeito). Foque no conceito central do conjunto e nos erros comuns."
example: "は marca o tópico. が marca o sujeito novo ou específico. Ex.: Eu___sou estudante: 私__学生です → は."
pages:
  - pageNumber: 1
    title: Identificar は vs が
    description: Escolha a partícula correta para a frase.
    exercises:
      - { type: japanese_vocab, question: "Eu___sou estudante: 私__学生です (は/が/を/に)", correctAnswer: "は" }
      - { type: japanese_vocab, question: "Tem um gato: 猫__います (が/は/を/に)", correctAnswer: "が" }
      - { type: japanese_vocab, question: "Este livro é novo: この本__新しい (は/が/を/に)", correctAnswer: "は" }
      - { type: japanese_vocab, question: "Tem um cachorro ali: あそこに犬__います (が/は/を/に)", correctAnswer: "が" }
      - { type: japanese_vocab, question: "Hoje é sexta: 今日__金曜日です (は/が/を/に)", correctAnswer: "は" }
      - { type: japanese_vocab, question: "Quem é o professor?: だれ__先生ですか (が/は/を/に)", correctAnswer: "が" }
      - { type: japanese_vocab, question: "Sou brasileiro: 私__ブラジル人です (は/が/を/に)", correctAnswer: "は" }
      - { type: japanese_vocab, question: "O que é isto?: これ__何ですか (は/が/を/に)", correctAnswer: "は" }
      - { type: japanese_vocab, question: "Eu é que gosto: 私__好きです (が/は/を/に)", correctAnswer: "が" }
      - { type: japanese_vocab, question: "Meu nome é Taro: 私の名前__太郎です (は/が/を/に)", correctAnswer: "は" }
  - pageNumber: 2
    title: Frases completas com は
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "彼は日本人です。 (Ele é japonês./Ele não é japonês./Ela é japonesa./Ela não é japonesa.)", correctAnswer: "Ele é japonês." }
      - { type: japanese_vocab, question: "この本は面白いです。 (Este livro é interessante./Este livro é chato./Aquele livro é interessante./Esse livro é interessante.)", correctAnswer: "Este livro é interessante." }
      - { type: japanese_vocab, question: "私の犬は小さいです。 (Meu cachorro é pequeno./Meu cachorro é grande./Meu gato é pequeno./Seu cachorro é pequeno.)", correctAnswer: "Meu cachorro é pequeno." }
      - { type: japanese_vocab, question: "日本は面白い国です。 (O Japão é um país interessante./O Japão é um país grande./O Brasil é interessante./A China é interessante.)", correctAnswer: "O Japão é um país interessante." }
      - { type: japanese_vocab, question: "母は料理が上手です。 (Minha mãe é boa de cozinhar./Meu pai é bom de cozinhar./Minha mãe cozinha mal./Eu cozinho bem.)", correctAnswer: "Minha mãe é boa de cozinhar." }
      - { type: japanese_vocab, question: "今日は寒いです。 (Hoje está frio./Hoje está quente./Ontem estava frio./Amanhã estará frio.)", correctAnswer: "Hoje está frio." }
      - { type: japanese_vocab, question: "私の名前はマリアです。 (Meu nome é Maria./Seu nome é Maria./Ela se chama Maria./Eu conheço a Maria.)", correctAnswer: "Meu nome é Maria." }
      - { type: japanese_vocab, question: "東京は大きい町です。 (Tóquio é uma cidade grande./Tóquio é uma cidade pequena./Kyoto é uma cidade grande./Osaka é grande.)", correctAnswer: "Tóquio é uma cidade grande." }
      - { type: japanese_vocab, question: "山田さんは先生です。 (O Sr. Yamada é professor./A Sra. Yamada é professora./Eu sou professor./Ele é Yamada.)", correctAnswer: "O Sr. Yamada é professor." }
      - { type: japanese_vocab, question: "彼女はきれいです。 (Ela é bonita./Ele é bonito./Ela é feia./Ela é alta.)", correctAnswer: "Ela é bonita." }
  - pageNumber: 3
    title: Frases com が
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "テーブルの上に本があります。 (Tem um livro em cima da mesa./Tem uma mesa em cima do livro./Não tem livro./O livro está embaixo da mesa.)", correctAnswer: "Tem um livro em cima da mesa." }
      - { type: japanese_vocab, question: "犬が好きです。 (Gosto de cachorros./Odeio cachorros./Tenho cachorro./Vi cachorro.)", correctAnswer: "Gosto de cachorros." }
      - { type: japanese_vocab, question: "日本語が分かります。 (Entendo japonês./Não entendo japonês./Falo japonês./Aprendo japonês.)", correctAnswer: "Entendo japonês." }
      - { type: japanese_vocab, question: "だれが来ましたか。 (Quem veio?/Ele veio./Ela veio./Ninguém veio.)", correctAnswer: "Quem veio?" }
      - { type: japanese_vocab, question: "何が好きですか。 (Do que você gosta?/Quem você gosta?/Onde você gosta?/Quando você gosta?)", correctAnswer: "Do que você gosta?" }
      - { type: japanese_vocab, question: "りんごがあります。 (Tem maçã./Não tem maçã./Gosto de maçã./Comprei maçã.)", correctAnswer: "Tem maçã." }
      - { type: japanese_vocab, question: "今日は頭が痛い。 (Hoje a cabeça está doendo./Hoje estou feliz./Ontem doía a cabeça./Sempre dói a cabeça.)", correctAnswer: "Hoje a cabeça está doendo." }
      - { type: japanese_vocab, question: "私は犬が嫌いです。 (Eu odeio cachorros./Eu gosto de cachorros./Ele odeia cachorros./Ela odeia cachorros.)", correctAnswer: "Eu odeio cachorros." }
      - { type: japanese_vocab, question: "どれが一番好きですか。 (Qual você mais gosta?/Este é o melhor./Todos são bons./Nenhum serve.)", correctAnswer: "Qual você mais gosta?" }
      - { type: japanese_vocab, question: "時間がありません。 (Não tenho tempo./Tenho tempo./Tenho muito tempo./Sempre tenho tempo.)", correctAnswer: "Não tenho tempo." }
target: 30
