title: 📝 Conectando frases — ～て, ～から (porque)
level: 'B'
subject: japanese
objectives: [japanese.grammar]
difficulty: 4
authorNotes: "Conectivos de frase: て (sequência/razão com adjetivo), から (porque/portanto). Essenciais para produção oral e escrita N5."
example: "て = e então / porque (adjetivos), から = porque / portanto. Ex.: 忙しいから、行きません → Porque estou ocupado, não vou."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Conectivo から (porque)
    description: Escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "忙しいから、行きません。 (Não vou mas estou ocupado./Estou ocupado por isso não vou./Vou porque estou ocupado./Estou ocupado e por isso estou indo.)", correctAnswer: "Estou ocupado por isso não vou.", rationale: "忙しい = ocupado, から = portanto/por isso, 行きません = não vou. Causa→consequência.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お腹が空いたから、食べます。 (Comi portanto estou com fome./Estou com fome por isso como./Não como porque estou com fome./Como apesar de não estar com fome.)", correctAnswer: "Estou com fome por isso como.", rationale: "お腹が空いた → fiquei com fome, から → portanto, 食べます → como.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "雨だから、出かけません。 (Saio mesmo com chuva./Saio porque está chovendo./Não saio porque está chovendo./Está chovendo mas vou sair.)", correctAnswer: "Não saio porque está chovendo.", rationale: "雨だ → é chuva, から → porque, 出かけません → não saio.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "なぜ遅いですか。 (Quando vai atrasar?/Por que está atrasado?/Quem está atrasado?/Onde está atrasado?)", correctAnswer: "Por que está atrasado?", rationale: "なぜ → por que (razão), 遅い → atrasado/lento, ですか → é?", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "眠いから、寝ます。 (Dormi então estou com sono./Vou dormir apesar do sono./Não durmo mesmo com sono./Estou com sono por isso vou dormir.)", correctAnswer: "Estou com sono por isso vou dormir.", rationale: "眠い → com sono, から → portanto, 寝ます → dormir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語が好きだから、勉強します。 (Não estudo japonês./Estudo japonês porque gosto./Gosto de japonês mas não estudo./Estudo japonês sem gostar.)", correctAnswer: "Estudo japonês porque gosto.", rationale: "日本語が好きだ → gosto de japonês, から → porque, 勉強します → estudo.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どうして来ませんでしたか。 (Quando não veio?/Por que não veio?/Onde você foi?/Quem não veio?)", correctAnswer: "Por que não veio?", rationale: "どうして → por que, 来ませんでしたか → não veio? (passado negativo).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "体が弱いから、運動します。 (Não me exercito porque sou fraco./Me exercito porque sou forte./Porque meu corpo é fraco, me exercito./Me exercito apesar de ser forte.)", correctAnswer: "Porque meu corpo é fraco, me exercito.", rationale: "体が弱い → corpo fraco, から → porque, 運動します → me exercito.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明日試験があるから、今夜勉強します。 (Vou estudar amanhã porque não há prova./Estudo hoje à noite porque há prova amanhã./Há prova mas não vou estudar./Estudo apesar de não haver prova.)", correctAnswer: "Estudo hoje à noite porque há prova amanhã.", rationale: "明日試験がある → amanhã há prova, から → porque, 今夜勉強します → estudo hoje à noite.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "寒いから、コートを着ます。 (Tiro o casaco porque está frio./Vista o casaco porque está frio./Está frio mas não visto casaco./Não está frio portanto visto casaco.)", correctAnswer: "Vista o casaco porque está frio.", rationale: "寒い → frio, から → porque, コートを着ます → visto casaco.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Conectivos て e から em contexto
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "この映画は面白くて、長いです。 (Este filme é chato e longo./Este filme é interessante mas curto./Este filme é interessante e longo./Este filme é longo por isso é interessante.)", correctAnswer: "Este filme é interessante e longo.", rationale: "面白くて = interessante e (adjetivo い→くて), 長い = longo.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この部屋は静かで、きれいです。 (Este quarto é barulhento e bonito./Este quarto é silencioso mas feio./Este quarto é silencioso e bonito./Este quarto é bonito por isso é silencioso.)", correctAnswer: "Este quarto é silencioso e bonito.", rationale: "静かで = silencioso e (adjetivo な→で), きれい = bonito.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "暑いから、窓を開けてください。 (Feche a janela porque está frio./Abra a janela porque está quente./Está quente mas não abra./Abra porque está fresco.)", correctAnswer: "Abra a janela porque está quente.", rationale: "暑い → quente, から → porque, 窓を開けてください → por favor abra a janela.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "学校が遠いから、バスで行きます。 (Vou a pé porque a escola é perto./Vou de ônibus porque a escola é longe./A escola é longe mas vou a pé./A escola é perto por isso vou de ônibus.)", correctAnswer: "Vou de ônibus porque a escola é longe.", rationale: "学校が遠い → a escola é longe, から → porque, バスで行きます → vou de ônibus.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この料理は辛くて、おいしいです。 (Esta comida é picante mas sem sabor./Esta comida é picante e deliciosa./Esta comida é deliciosa por isso é picante./Esta comida é doce e deliciosa.)", correctAnswer: "Esta comida é picante e deliciosa.", rationale: "辛くて = picante e (く→くて), おいしい = delicioso.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "体が疲れたから、早く寝ました。 (Dormi cedo apesar de não estar cansado./Porque estava cansado, dormi cedo./Dormi cedo portanto fiquei cansado./Não dormi porque estava cansado.)", correctAnswer: "Porque estava cansado, dormi cedo.", rationale: "体が疲れた → corpo ficou cansado, から → porque, 早く寝ました → dormi cedo.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "その店は安くて、おいしいです。 (Aquela loja é cara e boa./Aquela loja é barata mas ruim./Aquela loja é barata e boa./Aquela loja é cara por isso é boa.)", correctAnswer: "Aquela loja é barata e boa.", rationale: "安くて = barato e (い→くて), おいしい = gostoso/bom.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "雪が降っているから、外に出ません。 (Está nevando por isso saio./Saio apesar da neve./Não saio porque está nevando./Está nevando mas saio.)", correctAnswer: "Não saio porque está nevando.", rationale: "雪が降っている → está nevando, から → porque, 外に出ません → não saio.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "彼女は親切で、頭がいいです。 (Ela é antipática mas inteligente./Ela é simpática e inteligente./Ela é inteligente por isso é simpática./Ela é simpática mas não é inteligente.)", correctAnswer: "Ela é simpática e inteligente.", rationale: "親切で = simpática e (adjetivo な→で), 頭がいい = inteligente.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "お金がないから、買えません。 (Compro apesar de não ter dinheiro./Tenho dinheiro portanto compro./Não posso comprar porque não tenho dinheiro./Não compro apesar de ter dinheiro.)", correctAnswer: "Não posso comprar porque não tenho dinheiro.", rationale: "お金がない → não tem dinheiro, から → porque, 買えません → não posso comprar.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
