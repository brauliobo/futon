title: Partícula に (tempo/direção/lugar)
level: 'B'
subject: japanese
example: "に marca tempo específico, direção e local onde algo existe."
pages:
  - pageNumber: 1
    title: Identificar に
    description: Escolha a partícula correta.
    exercises:
      - { type: japanese_vocab, question: "Vou à escola: 学校__行く (に/を/は/が)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Às 7h: 七時__起きる (に/を/は/が)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Nós segunda: 月曜日__会う (に/を/は/が)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Na mesa tem livro: テーブル__本がある (に/を/は/が)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Dar para amigo: 友だち__あげる (に/を/は/が)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Ir ao Japão: 日本__行く (に/を/は/が)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Voltar para casa: 家__帰る (に/を/は/が)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Entrar na sala: 部屋__入る (に/を/は/が)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Encontrar amigo: 友だち__会う (に/を/は/が)", correctAnswer: "に" }
      - { type: japanese_vocab, question: "Em 2026: 二千二十六年__ (に/を/は/が)", correctAnswer: "に" }
  - pageNumber: 2
    title: Frases com に
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "学校に行きます。 (Vou à escola./Venho da escola./Estou na escola./Saio da escola.)", correctAnswer: "Vou à escola." }
      - { type: japanese_vocab, question: "七時に起きます。 (Acordo às 7h./Durmo às 7h./Jantar às 7h./Trabalho às 7h.)", correctAnswer: "Acordo às 7h." }
      - { type: japanese_vocab, question: "日本に行きたいです。 (Quero ir ao Japão./Fui ao Japão./Estou no Japão./Voltei do Japão.)", correctAnswer: "Quero ir ao Japão." }
      - { type: japanese_vocab, question: "母に手紙を書く。 (Escrever carta para a mãe./Escrever carta com a mãe./Escrever carta da mãe./Escrever da mãe.)", correctAnswer: "Escrever carta para a mãe." }
      - { type: japanese_vocab, question: "駅の前に会いましょう。 (Vamos nos encontrar em frente à estação./Vamos ir para a estação./Vamos sair da estação./Vamos atrás da estação.)", correctAnswer: "Vamos nos encontrar em frente à estação." }
      - { type: japanese_vocab, question: "部屋に猫がいる。 (Tem um gato no quarto./Tem um quarto com gato./Não tem gato./O gato é pequeno.)", correctAnswer: "Tem um gato no quarto." }
      - { type: japanese_vocab, question: "図書館に本がある。 (Tem livros na biblioteca./Tem uma biblioteca./Não tem livros./O livro está na mesa.)", correctAnswer: "Tem livros na biblioteca." }
      - { type: japanese_vocab, question: "友だちにプレゼントをあげる。 (Dar presente para o amigo./Receber presente do amigo./Comprar presente./Fazer presente.)", correctAnswer: "Dar presente para o amigo." }
      - { type: japanese_vocab, question: "日曜日に映画を見ます。 (Vejo filme no domingo./Vejo filme no sábado./Não vejo filme./Fiz filme domingo.)", correctAnswer: "Vejo filme no domingo." }
      - { type: japanese_vocab, question: "来年に結婚します。 (Vou casar ano que vem./Casei ano passado./Estou casado./Não quero casar.)", correctAnswer: "Vou casar ano que vem." }
  - pageNumber: 3
    title: に vs へ (direção)
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "日本へ行く≈日本に行く — ambos significam: (Vou ao Japão./Venho do Japão./Estou no Japão./Volto do Japão.)", correctAnswer: "Vou ao Japão." }
      - { type: japanese_vocab, question: "家へ帰る。 (Volto para casa./Saio de casa./Construo casa./Compro casa.)", correctAnswer: "Volto para casa." }
      - { type: japanese_vocab, question: "東京へ行きました。 (Fui a Tóquio./Vou a Tóquio./Moro em Tóquio./Voltei de Tóquio.)", correctAnswer: "Fui a Tóquio." }
      - { type: japanese_vocab, question: "駅に着きました。 (Cheguei na estação./Saí da estação./Passei pela estação./Vi a estação.)", correctAnswer: "Cheguei na estação." }
      - { type: japanese_vocab, question: "公園に行こう。 (Vamos ao parque./Fui ao parque./Estou no parque./Saímos do parque.)", correctAnswer: "Vamos ao parque." }
      - { type: japanese_vocab, question: "九時に会う。 (Nos encontramos às 9h./Encontro ninguém às 9h./Às 9 acordo./Às 9 durmo.)", correctAnswer: "Nos encontramos às 9h." }
      - { type: japanese_vocab, question: "壁に絵がある。 (Tem um quadro na parede./O quadro caiu./A parede é branca./Não tem quadro.)", correctAnswer: "Tem um quadro na parede." }
      - { type: japanese_vocab, question: "彼に電話する。 (Ligar para ele./Receber ligação dele./Falar dele./Ir com ele.)", correctAnswer: "Ligar para ele." }
      - { type: japanese_vocab, question: "図書館で勉強する。 (Estudar NA biblioteca — local da ação/Ir à biblioteca/Ser da biblioteca/Sair da biblioteca)", correctAnswer: "Estudar NA biblioteca — local da ação" }
      - { type: japanese_vocab, question: "私に教えてください。 (Me ensine, por favor./Ensine ele, por favor./Não me ensine./Eu ensino.)", correctAnswer: "Me ensine, por favor." }
