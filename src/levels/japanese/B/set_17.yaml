title: 🔢 Kanji — 食飲見書話来行 (verbos em kanji)
level: 'B'
subject: japanese
objectives: [japanese.kanji]
difficulty: 4
authorNotes: "Verbos de ação em kanji com múltiplas leituras: on'yomi e kun'yomi. Foco no reconhecimento em diferentes contextos."
example: "行 = ir (い・く / こう). Ex.: 行きます → vou, 旅行 → viagem. Kanji com duas leituras comuns."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Leituras dos kanji de verbos
    description: Escolha o significado ou leitura correta.
    exercises:
      - { type: japanese_vocab, question: "食べます (いきます/のみます/たべます/みます)", correctAnswer: "たべます", rationale: "食べます (たべます) → comer. 食 tem leitura た (kun) e しょく (on).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "飲みます (たべます/のみます/みます/きます)", correctAnswer: "のみます", rationale: "飲みます (のみます) → beber. 飲 tem leitura の (kun) e いん (on).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "見ます (いいます/みます/きます/よみます)", correctAnswer: "みます", rationale: "見ます (みます) → ver. 見 tem leitura み (kun) e けん (on).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "書きます (かきます/よみます/はなします/ききます)", correctAnswer: "かきます", rationale: "書きます (かきます) → escrever. 書 tem leitura か (kun) e しょ (on).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "話します (みます/はなします/たべます/かきます)", correctAnswer: "はなします", rationale: "話します (はなします) → falar. 話 tem leitura はな (kun) e わ (on).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "来ます (いきます/のみます/きます/みます)", correctAnswer: "きます", rationale: "来ます (きます) → vir. 来 tem leitura き (kun) e らい (on). Verbo irregular.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "行きます (みます/たべます/きます/いきます)", correctAnswer: "いきます", rationale: "行きます (いきます) → ir. 行 tem leitura い (kun) e こう (on).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "食事 (café/jantar/refeição/bebida)", correctAnswer: "refeição", rationale: "食事 (しょくじ) → refeição. Leitura on'yomi: しょく+じ.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "旅行 (festa/trabalho/viagem/escola)", correctAnswer: "viagem", rationale: "旅行 (りょこう) → viagem. 旅 (viagem) + 行 (ir) → ir em viagem.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "会話 (encontro/conversa/reunião/aula)", correctAnswer: "conversa", rationale: "会話 (かいわ) → conversa, diálogo. 会 (encontrar) + 話 (falar) → conversação.", difficulty: 4, objectives: [japanese.kanji] }
  - pageNumber: 2
    title: Kanji verbais em frases
    description: Leia a frase e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "友だちと食事をします。 (Saio com amigos./Faço compras com amigos./Faço refeição com amigos./Bebo com amigos.)", correctAnswer: "Faço refeição com amigos.", rationale: "友だちと → com amigos, 食事をします → fazer refeição.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "来年旅行に行きたいです。 (Quero trabalhar no ano que vem./Quero estudar no exterior no ano que vem./Quero viajar no ano que vem./Viajei no ano passado.)", correctAnswer: "Quero viajar no ano que vem.", rationale: "来年 → ano que vem, 旅行に行きたい → quero ir em viagem.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "日本語で会話の練習をします。 (Pratico escrita em japonês./Pratico leitura em japonês./Pratico conversação em japonês./Pratico audição em japonês.)", correctAnswer: "Pratico conversação em japonês.", rationale: "日本語で → em japonês, 会話の練習 → prática de conversação, をします → faço.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "毎日日記を書きます。 (Leio diário todo dia./Escrevo diário todo dia./Envio e-mail todo dia./Ouço rádio todo dia.)", correctAnswer: "Escrevo diário todo dia.", rationale: "毎日 → todo dia, 日記を → diário (objeto), 書きます → escrever.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "電話で話しました。 (Escrevi pelo telefone./Ouvi pelo telefone./Falei pelo telefone./Li pelo telefone.)", correctAnswer: "Falei pelo telefone.", rationale: "電話で → pelo telefone, 話しました → falei (passado).", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "来週友だちが来ます。 (Na próxima semana vou visitar um amigo./Na próxima semana um amigo vem./Na semana passada um amigo veio./Na próxima semana um amigo vai.)", correctAnswer: "Na próxima semana um amigo vem.", rationale: "来週 → próxima semana, 友だちが → amigo (sujeito), 来ます → vir.", difficulty: 3, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "見たことがない映画を見ます。 (Vejo um filme que já vi./Não vejo filmes novos./Vejo um filme que nunca vi./Gosto de filmes antigos.)", correctAnswer: "Vejo um filme que nunca vi.", rationale: "見たことがない → que nunca vi, 映画を見ます → ver filme.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "食べ物の話をします。 (Escrevo sobre comida./Leio sobre comida./Falo sobre comida./Como e depois falo.)", correctAnswer: "Falo sobre comida.", rationale: "食べ物の → de comida (possessivo), 話をします → conversar/falar sobre.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "行き方を教えてください。 (Por favor me ensine como usar./Por favor me ensine como ir./Por favor me diga onde fica./Por favor me diga quando ir.)", correctAnswer: "Por favor me ensine como ir.", rationale: "行き方 → maneira de ir (行く + 方), を教えてください → por favor me ensine.", difficulty: 4, objectives: [japanese.kanji] }
      - { type: japanese_vocab, question: "外国語で書いた本を読みます。 (Leio livros escritos em idioma estrangeiro./Escrevo livros em idioma estrangeiro./Traduzo livros para outro idioma./Ouço livros em idioma estrangeiro.)", correctAnswer: "Leio livros escritos em idioma estrangeiro.", rationale: "外国語で書いた → escrito em idioma estrangeiro, 本を読みます → ler livro.", difficulty: 4, objectives: [japanese.kanji] }
target: 20
