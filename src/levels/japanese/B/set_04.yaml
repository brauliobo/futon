authorNotes: "Kanji — Cores 白 黒 赤 青 黄 緑. Foque no conceito central do conjunto e nos erros comuns."
example: "白 = branco (しろ), 黒 = preto (くろ)"
pages:
  - pageNumber: 1
    title: Kanji de cores
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "白 (branco/preto/vermelho/azul)", correctAnswer: "branco", rationale: "O kanji 白 significa \"branco\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "黒 (preto/branco/vermelho/azul)", correctAnswer: "preto", rationale: "O kanji 黒 significa \"preto\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "赤 (vermelho/azul/amarelo/verde)", correctAnswer: "vermelho", rationale: "O kanji 赤 significa \"vermelho\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "青 (azul/vermelho/amarelo/verde)", correctAnswer: "azul", objectives: [japanese.vocab], rationale: "O kanji 青 significa \"azul\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "黄 (amarelo/verde/azul/vermelho)", correctAnswer: "amarelo", rationale: "O kanji 黄 significa \"amarelo\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "緑 (verde/amarelo/azul/vermelho)", correctAnswer: "verde", rationale: "O kanji 緑 significa \"verde\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "色 (cor/pintura/forma/tamanho)", correctAnswer: "cor", objectives: [japanese.vocab], rationale: "O kanji 色 significa \"cor\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "茶色 (marrom/rosa/roxo/cinza)", correctAnswer: "marrom", rationale: "O kanji 茶色 significa \"marrom\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "紫 (roxo/rosa/cinza/laranja)", correctAnswer: "roxo", objectives: [japanese.vocab], rationale: "O kanji 紫 significa \"roxo\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "灰色 (cinza/marrom/roxo/rosa)", correctAnswer: "cinza", rationale: "O kanji 灰色 significa \"cinza\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Adjetivos-i de cor (terminados em い)
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "白い (branca — adj/pintar de branco/fazer branco/cor do livro)", correctAnswer: "branca — adj", rationale: "O kanji 白い significa \"branca — adj\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "黒い (preta — adj/pintar de preto/fazer preto/cor do livro)", correctAnswer: "preta — adj", rationale: "O kanji 黒い significa \"preta — adj\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "赤い (vermelho/azul/amarelo/verde)", correctAnswer: "vermelho", rationale: "O kanji 赤い significa \"vermelho\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "青い (azul/vermelho/amarelo/verde)", correctAnswer: "azul", objectives: [japanese.vocab], rationale: "O kanji 青い significa \"azul\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "黄色い (amarelo/verde/azul/vermelho)", correctAnswer: "amarelo", rationale: "O kanji 黄色い significa \"amarelo\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "緑の (cor verde/vermelho/azul/amarelo)", correctAnswer: "cor verde", rationale: "O kanji 緑の significa \"cor verde\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "白い花 (flor branca/flor preta/flor vermelha/flor azul)", correctAnswer: "flor branca", rationale: "O kanji 白い花 significa \"flor branca\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "赤い花 (flor vermelha/flor azul/flor amarela/flor branca)", correctAnswer: "flor vermelha", rationale: "O kanji 赤い花 significa \"flor vermelha\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "青い空 (céu azul/céu vermelho/céu cinza/céu preto)", correctAnswer: "céu azul", rationale: "O kanji 青い空 significa \"céu azul\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "黒い猫 (gato preto/gato branco/gato cinza/gato marrom)", correctAnswer: "gato preto", rationale: "O kanji 黒い猫 significa \"gato preto\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 3
    title: Frases com cores
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "この花は赤いです。 (Esta flor é vermelha./Esta flor é branca./Aquela flor é vermelha./Aquela flor é amarela.)", correctAnswer: "Esta flor é vermelha.", rationale: "O kanji この花は赤いです。 significa \"Esta flor é vermelha.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "空が青い。 (O céu está azul./O céu está cinza./O mar está azul./O rio está azul.)", correctAnswer: "O céu está azul.", rationale: "O kanji 空が青い。 significa \"O céu está azul.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "黒い服を着る。 (Vestir roupa preta./Comprar roupa preta./Lavar roupa preta./Tirar roupa preta.)", correctAnswer: "Vestir roupa preta.", rationale: "O kanji 黒い服を着る。 significa \"Vestir roupa preta.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "黄色い車。 (Carro amarelo./Carro azul./Carro vermelho./Carro branco.)", correctAnswer: "Carro amarelo.", rationale: "O kanji 黄色い車。 significa \"Carro amarelo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "緑の葉。 (Folha verde./Folha amarela./Folha marrom./Folha vermelha.)", correctAnswer: "Folha verde.", rationale: "O kanji 緑の葉。 significa \"Folha verde.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "何色が好きですか。 (Qual cor você gosta?/Qual comida você gosta?/Qual estação você gosta?/Qual esporte você gosta?)", correctAnswer: "Qual cor você gosta?", rationale: "O kanji 何色が好きですか。 significa \"Qual cor você gosta?\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "私の靴は白いです。 (Meu sapato é branco./Meu sapato é preto./Meu sapato é novo./Meu sapato é velho.)", correctAnswer: "Meu sapato é branco.", rationale: "O kanji 私の靴は白いです。 significa \"Meu sapato é branco.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "茶色の犬。 (Cachorro marrom./Cachorro preto./Cachorro branco./Cachorro cinza.)", correctAnswer: "Cachorro marrom.", rationale: "O kanji 茶色の犬。 significa \"Cachorro marrom.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "紫の花が好きです。 (Gosto de flor roxa./Gosto de flor vermelha./Gosto de flor branca./Gosto de flor amarela.)", correctAnswer: "Gosto de flor roxa.", rationale: "O kanji 紫の花が好きです。 significa \"Gosto de flor roxa.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "黒い犬と白い猫。 (Cachorro preto e gato branco./Cachorro branco e gato preto./Dois cachorros pretos./Dois gatos brancos.)", correctAnswer: "Cachorro preto e gato branco.", rationale: "O kanji 黒い犬と白い猫。 significa \"Cachorro preto e gato branco.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
target: 30
