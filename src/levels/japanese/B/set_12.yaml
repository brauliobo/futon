title: 💬 Pedidos com ～てください (por favor faça)
level: 'B'
subject: japanese
objectives: [japanese.grammar]
difficulty: 3
authorNotes: "Forma てください para fazer pedidos educados: て-form + ください. Essencial para comunicação N5."
example: "て-form + ください = por favor faça. Ex.: 食べてください → Por favor coma. 来てください → Por favor venha."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Pedidos ～てください
    description: Escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "食べてください。 (Não coma./Por favor coma./Você comeu./Vai comer?)", correctAnswer: "Por favor coma.", rationale: "食べて → て-form de 食べる, ください → por favor. Pedido polido.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "聞いてください。 (Não ouça./Por favor ouça./Você ouviu./Vai ouvir?)", correctAnswer: "Por favor ouça.", rationale: "聞いて → て-form de 聞く, ください → por favor.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "見てください。 (Não veja./Por favor veja./Você viu./Vai ver?)", correctAnswer: "Por favor veja.", rationale: "見て → て-form de 見る, ください → por favor.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来てください。 (Não venha./Por favor venha./Você veio./Vai vir?)", correctAnswer: "Por favor venha.", rationale: "来て → て-form de 来る (irregular), ください → por favor.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書いてください。 (Não escreva./Por favor escreva./Você escreveu./Vai escrever?)", correctAnswer: "Por favor escreva.", rationale: "書いて → て-form de 書く, ください → por favor.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "待ってください。 (Não espere./Por favor espere./Você esperou./Vai esperar?)", correctAnswer: "Por favor espere.", rationale: "待って = て-form de 待つ (esperar). つ→って.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "話してください。 (Não fale./Por favor fale./Você falou./Vai falar?)", correctAnswer: "Por favor fale.", rationale: "話して → て-form de 話す, ください → por favor.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "読んでください。 (Não leia./Por favor leia./Você leu./Vai ler?)", correctAnswer: "Por favor leia.", rationale: "読んで → て-form de 読む, ください → por favor.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "座ってください。 (Fique em pé./Por favor sente-se./Você sentou./Vai sentar?)", correctAnswer: "Por favor sente-se.", rationale: "座って → て-form de 座る (sentar). る verbo: 座って.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "静かにしてください。 (Por favor faça barulho./Por favor faça silêncio./Você fez silêncio./Vai fazer barulho?)", correctAnswer: "Por favor faça silêncio.", rationale: "静かに → silenciosamente, してください → por favor faça (して → て-form de する).", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Pedidos em contexto
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "名前を書いてください。 (Por favor leia o nome./Por favor ouça o nome./Por favor escreva o nome./O nome está escrito.)", correctAnswer: "Por favor escreva o nome.", rationale: "名前を → nome (objeto), 書いてください → por favor escreva.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ここに座ってください。 (Por favor levante daqui./Por favor não sente aqui./Por favor sente aqui./Sente onde quiser.)", correctAnswer: "Por favor sente aqui.", rationale: "ここに → aqui (local), 座ってください → por favor sente.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ゆっくり話してください。 (Por favor fale mais rápido./Por favor fale devagar./Por favor não fale./Por favor fale mais alto.)", correctAnswer: "Por favor fale devagar.", rationale: "ゆっくり → devagar, 話してください → por favor fale.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もう一度言ってください。 (Por favor não repita./Por favor diga uma vez só./Por favor diga mais uma vez./Por favor fale mais alto.)", correctAnswer: "Por favor diga mais uma vez.", rationale: "もう一度 → mais uma vez, 言って → て-form de 言う (dizer), ください → por favor.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "ドアを開けてください。 (Por favor feche a porta./Por favor abra a porta./A porta está aberta./Por favor não abra.)", correctAnswer: "Por favor abra a porta.", rationale: "ドアを → a porta (objeto), 開けて → て-form de 開ける (abrir), ください → por favor.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "電話をかけてください。 (Por favor espere pelo telefone./Por favor desligue./Por favor atenda./Por favor ligue.)", correctAnswer: "Por favor ligue.", rationale: "電話をかけて → fazer uma ligação (電話をかける), ください → por favor.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語で話してください。 (Por favor fale em português./Por favor não fale em japonês./Por favor fale em japonês./Por favor aprenda japonês.)", correctAnswer: "Por favor fale em japonês.", rationale: "日本語で → em japonês (meio), 話してください → por favor fale.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "明日また来てください。 (Por favor não venha amanhã./Por favor venha amanhã de novo./Você veio ontem./Por favor vá amanhã.)", correctAnswer: "Por favor venha amanhã de novo.", rationale: "明日 → amanhã, また → de novo, 来てください → por favor venha.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "この漢字を読んでください。 (Por favor escreva este kanji./Por favor leia este kanji./Por favor copie este kanji./Por favor memorize este kanji.)", correctAnswer: "Por favor leia este kanji.", rationale: "この漢字を → este kanji (objeto), 読んでください → por favor leia.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "先生に聞いてください。 (Por favor pergunte ao professor./Por favor escute o professor./Por favor responda ao professor./Por favor procure o professor.)", correctAnswer: "Por favor pergunte ao professor.", rationale: "先生に → ao professor, 聞いてください → por favor pergunte/ouça.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
