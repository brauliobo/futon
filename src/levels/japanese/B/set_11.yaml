title: 📝 Forma て (te-form) — 食べて 飲んで 見て
level: 'B'
subject: japanese
objectives: [japanese.grammar]
difficulty: 3
authorNotes: "Forma て (te-form) dos verbos: conecta ações sequenciais e é base para muitas construções N5."
example: "Verbos い→って, び→んで, み→んで, り→って, に→んで, き→いて, ぎ→いで, して. Ex.: 食べる → 食べて, 飲む → 飲んで."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Forma て — identificação
    description: Escolha a forma て correta ou seu significado.
    exercises:
      - { type: japanese_vocab, question: "食べて (comendo/bebendo/ouvindo/vendo)", correctAnswer: "comendo", rationale: "食べて → forma て de 食べる (comer). Verbos る: remove る, adiciona て.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "飲んで (bebendo/vendo/comendo/escrevendo)", correctAnswer: "bebendo", rationale: "飲んで = forma て de 飲む (beber). む→んで.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "見て (lendo/ouvindo/vendo/comendo)", correctAnswer: "vendo", rationale: "見て → forma て de 見る (ver). Verbo る: remove る, adiciona て.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "聞いて (ouvindo/escrevendo/lendo/bebendo)", correctAnswer: "ouvindo", rationale: "聞いて = forma て de 聞く (ouvir). く→いて.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "書いて (lendo/vendo/comendo/escrevendo)", correctAnswer: "escrevendo", rationale: "書いて = forma て de 書く (escrever). く→いて.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "読んで (bebendo/ouvindo/lendo/comendo)", correctAnswer: "lendo", rationale: "読んで = forma て de 読む (ler). む→んで.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "行って (vindo/voltando/ficando/indo)", correctAnswer: "indo", rationale: "行って = forma て de 行く (ir). Irregular: く→って (não いて).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "来て (ficando/indo/voltando/vindo)", correctAnswer: "vindo", rationale: "来て = forma て de 来る (vir). Irregular: き→て.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "して (fazendo/vindo/indo/sendo)", correctAnswer: "fazendo", rationale: "して = forma て de する (fazer). Irregular: し→して.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "話して (ouvindo/falando/escutando/lendo)", correctAnswer: "falando", rationale: "話して = forma て de 話す (falar). す→して.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: Forma て em frases (sequência de ações)
    description: Escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "ごはんを食べて、学校に行きます。 (Vou à escola antes de comer./Vou à escola sem comer./Depois de comer, vou à escola./Enquanto como, penso na escola.)", correctAnswer: "Depois de comer, vou à escola.", rationale: "食べて → depois de comer (て → sequência), 学校に行きます → vou à escola.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "音楽を聞いて、勉強します。 (Estudo e depois ouço música./Estudo sem ouvir música./Ouço música e depois estudo./Ouço música enquanto estudo.)", correctAnswer: "Ouço música e depois estudo.", rationale: "音楽を聞いて → ouço música e então, 勉強します → estudo.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "手を洗って、ごはんを食べます。 (Como e depois lavo as mãos./Lavo as mãos e depois como./Lavo as mãos enquanto como./Como sem lavar as mãos.)", correctAnswer: "Lavo as mãos e depois como.", rationale: "手を洗って → lavo as mãos e então (手 → mão, 洗って → lavar て-form), ごはんを食べます → como.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友だちに電話して、会います。 (Encontro um amigo sem ligar./Ligo para um amigo depois de encontrá-lo./Ligo para um amigo e depois o encontro./Ligo para um amigo enquanto o encontro.)", correctAnswer: "Ligo para um amigo e depois o encontro.", rationale: "電話して → ligo e então (電話する → ligar, して → て-form), 会います → encontrar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "本を読んで、ねます。 (Leio depois de dormir./Durmo enquanto leio./Leio e depois durmo./Não durmo depois de ler.)", correctAnswer: "Leio e depois durmo.", rationale: "本を読んで → leio livro e então, ねます → dormir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "コーヒーを飲んで、仕事をします。 (Trabalho antes de tomar café./Tomo café e depois trabalho./Trabalho sem tomar café./Trabalho enquanto tomo café.)", correctAnswer: "Tomo café e depois trabalho.", rationale: "コーヒーを飲んで → tomo café e então, 仕事をします → trabalho.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "映画を見て、どうでしたか。 (O que achou antes do filme?/O que achou do filme?/Vai ver o filme?/Gostou do filme?)", correctAnswer: "O que achou do filme?", rationale: "映画を見て → depois de ver o filme, どうでした → como foi?", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "シャワーを浴びて、ねます。 (Durmo antes de tomar banho./Durmo sem tomar banho./Tomo banho e depois durmo./Tomo banho enquanto durmo.)", correctAnswer: "Tomo banho e depois durmo.", rationale: "シャワーを浴びて → tomo banho e então (シャワー → chuveiro), ねます → dormir.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "大学を出て、働きます。 (Trabalho antes de ir para a universidade./Saio da universidade e começo a trabalhar./Estudo na universidade e trabalho./Não trabalho depois da universidade.)", correctAnswer: "Saio da universidade e começo a trabalhar.", rationale: "大学を出て → sair da universidade e então (出て → sair て-form), 働きます → trabalhar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本に行って、日本語を話したいです。 (Quero aprender japonês antes de ir ao Japão./Quero ir ao Japão para falar japonês./Fui ao Japão e falei japonês./Não quero falar japonês no Japão.)", correctAnswer: "Quero ir ao Japão para falar japonês.", rationale: "日本に行って → ir ao Japão e então, 日本語を話したいです → quero falar japonês.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
