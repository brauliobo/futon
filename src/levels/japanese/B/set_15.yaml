title: 💬 Querer fazer — ～たいです
level: 'B'
subject: japanese
objectives: [japanese.grammar]
difficulty: 3
authorNotes: "Forma ～たいです expressa desejo de fazer algo (quero fazer). Formada com o radical do verbo + たいです."
example: "radical verbal + たいです = quero fazer. Ex.: 食べたいです → Quero comer. 行きたいです → Quero ir."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: ～たいです — desejo de ação
    description: Escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "食べたいです。 (Não quero comer./Comi./Quero comer./Vou comer.)", correctAnswer: "Quero comer.", rationale: "食べ (radical de 食べる) + たいです → quero comer. Expressão de desejo.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本に行きたいです。 (Fui ao Japão./Não quero ir ao Japão./Vou ao Japão./Quero ir ao Japão.)", correctAnswer: "Quero ir ao Japão.", rationale: "日本に → ao Japão, 行き (radical de 行く) + たいです → quero ir.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "何を食べたいですか。 (O que você comeu?/O que vai comer?/O que quer comer?/O que está comendo?)", correctAnswer: "O que quer comer?", rationale: "何を → o quê (objeto), 食べたいですか → quer comer? (pergunta).", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "水が飲みたいです。 (Bebi água./Vou beber água./Não quero água./Quero beber água.)", correctAnswer: "Quero beber água.", rationale: "水が → água (sujeito/objeto), 飲み (radical de 飲む) + たいです → quero beber.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本語が話せたいです。 (Quero poder falar japonês./Falo japonês./Não falo japonês./Estou aprendendo japonês.)", correctAnswer: "Quero poder falar japonês.", rationale: "日本語が → japonês, 話せたい → quero poder falar (話せる → poder falar + たい).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "友だちに会いたいです。 (Encontrei um amigo./Não quero encontrar ninguém./Quero encontrar um amigo./Vou encontrar um amigo.)", correctAnswer: "Quero encontrar um amigo.", rationale: "友だちに → com um amigo, 会い (radical de 会う) + たいです → quero encontrar.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "映画を見たいです。 (Vi um filme./Não quero ver filme./Vou ver um filme./Quero ver um filme.)", correctAnswer: "Quero ver um filme.", rationale: "映画を → filme (objeto), 見 (radical de 見る) + たいです → quero ver.", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "食べたくないです。 (Comi muito./Quero comer./Vou comer./Não quero comer.)", correctAnswer: "Não quero comer.", rationale: "食べたくない = não quero comer (negativo: たい→たくない).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "どこに行きたいですか。 (Onde você foi?/Para onde vai?/Para onde quer ir?/Onde está?)", correctAnswer: "Para onde quer ir?", rationale: "どこに → para onde, 行きたいですか → quer ir? (pergunta de desejo).", difficulty: 2, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もっと日本語を勉強したいです。 (Já estudei suficiente./Não quero mais estudar japonês./Quero estudar mais japonês./Estudo japonês de vez em quando.)", correctAnswer: "Quero estudar mais japonês.", rationale: "もっと → mais, 日本語を → japonês, 勉強したいです → quero estudar.", difficulty: 3, objectives: [japanese.grammar] }
  - pageNumber: 2
    title: ～たいです em contexto
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "将来、医者になりたいです。 (Fui médico no passado./No futuro, quero me tornar médico./Não quero ser médico./Já sou médico.)", correctAnswer: "No futuro, quero me tornar médico.", rationale: "将来 → no futuro, 医者に → médico (destino), なりたいです → quero me tornar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "今すぐ家に帰りたいです。 (Voltei para casa agora./Não quero voltar para casa./Quero voltar para casa agora./Vou voltar para casa agora.)", correctAnswer: "Quero voltar para casa agora.", rationale: "今すぐ → agora mesmo, 家に → para casa, 帰りたいです → quero voltar.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "日本料理を食べたいですか。 (Você comeu comida japonesa?/Você quer comer comida japonesa?/Você gosta de comida japonesa?/Você vai comer comida japonesa?)", correctAnswer: "Você quer comer comida japonesa?", rationale: "日本料理を → comida japonesa (objeto), 食べたいですか → quer comer? (pergunta).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もっとゆっくり話してほしいです。 (Quero falar mais devagar./Quero que você fale mais devagar./Fale mais devagar por favor./Você fala muito devagar.)", correctAnswer: "Quero que você fale mais devagar.", rationale: "もっとゆっくり → mais devagar, 話して → falar (て-form), ほしいです → quero que. (てほしい → querer que alguém faça)", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "甘いものが食べたいです。 (Não quero comer doce./Quero comer algo doce./Comi algo doce./Vou comer algo doce.)", correctAnswer: "Quero comer algo doce.", rationale: "甘いものが → algo doce (sujeito), 食べたいです → quero comer.", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "大学で何を勉強したいですか。 (O que você estudou na universidade?/O que você vai estudar?/O que quer estudar na universidade?/O que você estuda?)", correctAnswer: "O que quer estudar na universidade?", rationale: "大学で → na universidade, 何を → o quê, 勉強したいですか → quer estudar?", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "もう食べたくないです。 (Quero comer mais./Já comi./Não quero mais comer./Vou comer depois.)", correctAnswer: "Não quero mais comer.", rationale: "もう → já/mais, 食べたくないです → não quero comer (negativo de たい).", difficulty: 3, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "夏に海で泳ぎたいです。 (Nado no mar no verão./Quero nadar no mar no verão./Fui nadar no mar no verão./Não gosto de nadar no mar.)", correctAnswer: "Quero nadar no mar no verão.", rationale: "夏に → no verão, 海で → no mar, 泳ぎたいです → quero nadar.", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "あなたに会いたかったです。 (Quero te encontrar./Encontrei você./Não quero te encontrar./Queria te encontrar.)", correctAnswer: "Queria te encontrar.", rationale: "あなたに → com você, 会いたかったです → queria encontrar (passado de たい: たかった).", difficulty: 4, objectives: [japanese.grammar] }
      - { type: japanese_vocab, question: "子どものとき、パイロットになりたかったです。 (Quando criança, queria ser piloto./Serei piloto quando crescer./Sou piloto desde criança./Nunca quis ser piloto.)", correctAnswer: "Quando criança, queria ser piloto.", rationale: "子どものとき → quando criança, パイロットに → piloto (destino), なりたかったです → queria se tornar.", difficulty: 4, objectives: [japanese.grammar] }
target: 20
