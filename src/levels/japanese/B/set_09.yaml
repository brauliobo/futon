title: Verbos na forma ～ます (polida)
level: 'B'
subject: japanese
objectives: [japanese.vocab]
difficulty: 4
authorNotes: "Verbos na forma ～ます (polida). Foque no conceito central do conjunto e nos erros comuns."
example: "たべる → 食べます (comer), のむ → 飲みます (beber)"
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Reconhecer verbos ～ます
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "食べます (comer/beber/dormir/ver)", correctAnswer: "comer", rationale: "O kanji 食べます significa \"comer\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "飲みます (beber/comer/dormir/escrever)", correctAnswer: "beber", rationale: "O kanji 飲みます significa \"beber\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "見ます (ver/ouvir/falar/ler)", correctAnswer: "ver", objectives: [japanese.vocab], rationale: "O kanji 見ます significa \"ver\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "聞きます (ouvir/ver/falar/escrever)", correctAnswer: "ouvir", rationale: "O kanji 聞きます significa \"ouvir\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "話します (falar/ouvir/ler/escrever)", correctAnswer: "falar", rationale: "O kanji 話します significa \"falar\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "読みます (ler/escrever/falar/ouvir)", correctAnswer: "ler", objectives: [japanese.vocab], rationale: "O kanji 読みます significa \"ler\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "書きます (escrever/ler/falar/desenhar)", correctAnswer: "escrever", rationale: "O kanji 書きます significa \"escrever\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "行きます (ir/vir/voltar/ficar)", correctAnswer: "ir", objectives: [japanese.vocab], rationale: "O kanji 行きます significa \"ir\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "来ます (vir/ir/voltar/ficar)", correctAnswer: "vir", objectives: [japanese.vocab], rationale: "O kanji 来ます significa \"vir\". Observe o desenho como pista visual." }
      - { type: japanese_vocab, question: "帰ります (voltar/ir/vir/ficar)", correctAnswer: "voltar", rationale: "O kanji 帰ります significa \"voltar\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Mais verbos ～ます
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "寝ます (dormir/acordar/sentar/comer)", correctAnswer: "dormir", rationale: "O kanji 寝ます significa \"dormir\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "起きます (acordar/dormir/sentar/comer)", correctAnswer: "acordar", rationale: "O kanji 起きます significa \"acordar\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "買います (comprar/vender/trocar/dar)", correctAnswer: "comprar", rationale: "O kanji 買います significa \"comprar\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "売ります (vender/comprar/trocar/dar)", correctAnswer: "vender", rationale: "O kanji 売ります significa \"vender\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "作ります (fazer/comer/ver/comprar)", correctAnswer: "fazer", rationale: "O kanji 作ります significa \"fazer\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "勉強します (estudar/brincar/trabalhar/descansar)", correctAnswer: "estudar", rationale: "O kanji 勉強します significa \"estudar\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "遊びます (brincar/trabalhar/estudar/correr)", correctAnswer: "brincar", rationale: "O kanji 遊びます significa \"brincar\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "働きます (trabalhar/brincar/estudar/descansar)", correctAnswer: "trabalhar", rationale: "O kanji 働きます significa \"trabalhar\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "会います (encontrar pessoa/ver/procurar/chamar)", correctAnswer: "encontrar pessoa", rationale: "O kanji 会います significa \"encontrar pessoa\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "使います (usar/ter/ver/comprar)", correctAnswer: "usar", objectives: [japanese.vocab], rationale: "O kanji 使います significa \"usar\". Observe o desenho como pista visual." }
  - pageNumber: 3
    title: Frases completas com ～ます
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "毎日日本語を勉強します。 (Estudo japonês todo dia./Estudo japonês às vezes./Nunca estudo./Vou estudar.)", correctAnswer: "Estudo japonês todo dia.", rationale: "O kanji 毎日日本語を勉強します。 significa \"Estudo japonês todo dia.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "朝ごはんを食べます。 (Como café da manhã./Faço café da manhã./Compro café da manhã./Não como café.)", correctAnswer: "Como café da manhã.", rationale: "O kanji 朝ごはんを食べます。 significa \"Como café da manhã.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "友だちに会います。 (Encontro o amigo./Visitarei o amigo./Liguei para o amigo./Escrevi para o amigo.)", correctAnswer: "Encontro o amigo.", rationale: "O kanji 友だちに会います。 significa \"Encontro o amigo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "バスで学校へ行きます。 (Vou para a escola de ônibus./Vou para a escola a pé./Vou para casa de ônibus./Venho da escola.)", correctAnswer: "Vou para a escola de ônibus.", rationale: "O kanji バスで学校へ行きます。 significa \"Vou para a escola de ônibus.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "十時に寝ます。 (Durmo às 10h./Acordo às 10h./Jantar às 10h./Saio às 10h.)", correctAnswer: "Durmo às 10h.", rationale: "O kanji 十時に寝ます。 significa \"Durmo às 10h.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "六時に起きます。 (Acordo às 6h./Durmo às 6h./Saio às 6h./Chego às 6h.)", correctAnswer: "Acordo às 6h.", rationale: "O kanji 六時に起きます。 significa \"Acordo às 6h.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "新しい本を買います。 (Compro um livro novo./Vendo um livro velho./Leio um livro novo./Escrevo um livro.)", correctAnswer: "Compro um livro novo.", rationale: "O kanji 新しい本を買います。 significa \"Compro um livro novo.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "家で晩ごはんを食べます。 (Janto em casa./Almoço em casa./Janto fora./Faço jantar.)", correctAnswer: "Janto em casa.", rationale: "O kanji 家で晩ごはんを食べます。 significa \"Janto em casa.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "テレビを見ます。 (Vejo TV./Ligo TV./Compro TV./Desligo TV.)", correctAnswer: "Vejo TV.", rationale: "O kanji テレビを見ます。 significa \"Vejo TV.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "音楽を聞きながら勉強します。 (Estudo ouvindo música./Só estudo./Só ouço música./Canto música.)", correctAnswer: "Estudo ouvindo música.", rationale: "O kanji 音楽を聞きながら勉強します。 significa \"Estudo ouvindo música.\". Observe o desenho como pista visual.", objectives: [japanese.vocab] }
target: 30
