  - pageNumber: 2
    title: Do número ao hiragana
    description: Veja o número e escolha como se lê.
    exercises:
      - { type: japanese_vocab, question: "1 (いち/に/さん/よん)", correctAnswer: "いち", objectives: [japanese.vocab], rationale: "O número 1 lê-se \"いち\"." }
