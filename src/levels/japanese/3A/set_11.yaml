title: Verbos essenciais em hiragana
level: '3A'
subject: japanese
difficulty: 2
authorNotes: "Verbos essenciais em hiragana. Foque no conceito central do conjunto e nos erros comuns."
example: "Forma de dicionário: たべる (comer), のむ (beber). Ex.: たべる → comer."
pages:
  - pageNumber: 1
    title: Verbos do cotidiano
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "たべる (comer/beber/dormir/brincar)", correctAnswer: "comer" }
      - { type: japanese_vocab, question: "のむ (beber/comer/dormir/escrever)", correctAnswer: "beber" }
      - { type: japanese_vocab, question: "みる (ver/ouvir/falar/ler)", correctAnswer: "ver", rationale: "みる lê-se \"ver\" (romaji)." }
      - { type: japanese_vocab, question: "きく (ouvir/ver/falar/escrever)", correctAnswer: "ouvir" }
      - { type: japanese_vocab, question: "はなす (falar/ouvir/ler/escrever)", correctAnswer: "falar" }
      - { type: japanese_vocab, question: "よむ (ler/escrever/falar/ouvir)", correctAnswer: "ler", rationale: "よむ lê-se \"ler\" (romaji)." }
      - { type: japanese_vocab, question: "かく (escrever/ler/falar/desenhar)", correctAnswer: "escrever" }
      - { type: japanese_vocab, question: "いく (ir/vir/voltar/ficar)", correctAnswer: "ir", rationale: "いく lê-se \"ir\" (romaji)." }
      - { type: japanese_vocab, question: "くる (vir/ir/voltar/ficar)", correctAnswer: "vir", rationale: "くる lê-se \"vir\" (romaji)." }
      - { type: japanese_vocab, question: "かえる (voltar/ir/vir/ficar)", correctAnswer: "voltar" }
  - pageNumber: 2
    title: Mais verbos
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "ねる (dormir/acordar/levantar/descansar)", correctAnswer: "dormir" }
      - { type: japanese_vocab, question: "おきる (acordar/dormir/sentar/deitar)", correctAnswer: "acordar" }
      - { type: japanese_vocab, question: "あそぶ (brincar/trabalhar/estudar/correr)", correctAnswer: "brincar" }
      - { type: japanese_vocab, question: "べんきょうする (estudar/brincar/trabalhar/descansar)", correctAnswer: "estudar" }
      - { type: japanese_vocab, question: "かう (comprar/vender/trocar/dar)", correctAnswer: "comprar" }
      - { type: japanese_vocab, question: "うる (vender/comprar/trocar/dar)", correctAnswer: "vender" }
      - { type: japanese_vocab, question: "あう (encontrar pessoa/ver/procurar/chamar)", correctAnswer: "encontrar pessoa" }
      - { type: japanese_vocab, question: "まつ (esperar/correr/andar/parar)", correctAnswer: "esperar" }
      - { type: japanese_vocab, question: "する (fazer/ser/estar/ter)", correctAnswer: "fazer" }
      - { type: japanese_vocab, question: "わかる (entender/pensar/lembrar/esquecer)", correctAnswer: "entender" }
target: 20
