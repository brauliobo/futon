title: Hiragana voiced — だ で ど (D) + ば び ぶ べ ぼ (B)
level: '3A'
subject: japanese
authorNotes: "Hiragana voiced — だ で ど (D) + ば び ぶ べ ぼ (B). Foque no conceito central do conjunto e nos erros comuns."
example: "ぢ e づ são raros — use じ e ず na maioria das palavras."
pages:
  - pageNumber: 1
    title: Linhas D e B
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "だ (da/de/do/ba/bi)", correctAnswer: da }
      - { type: kana_reading, question: "で (da/de/do/ba/bi)", correctAnswer: de }
      - { type: kana_reading, question: "ど (da/de/do/ba/bi)", correctAnswer: do }
      - { type: kana_reading, question: "ば (ba/bi/bu/be/bo)", correctAnswer: ba }
      - { type: kana_reading, question: "び (ba/bi/bu/be/bo)", correctAnswer: bi }
      - { type: kana_reading, question: "ぶ (ba/bi/bu/be/bo)", correctAnswer: bu }
      - { type: kana_reading, question: "べ (ba/bi/bu/be/bo)", correctAnswer: be }
      - { type: kana_reading, question: "ぼ (ba/bi/bu/be/bo)", correctAnswer: bo }
      - { type: kana_reading, question: "た (ta/da/te/de)", correctAnswer: ta }
      - { type: kana_reading, question: "だ (te/ta/da/de)", correctAnswer: da }
  - pageNumber: 2
    title: Palavras com D e B
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "でんしゃ (trem/carro/ônibus/avião)", correctAnswer: "trem" }
      - { type: japanese_vocab, question: "どこ (onde/quem/o que/quando)", correctAnswer: "onde" }
      - { type: japanese_vocab, question: "だれ (quem/onde/o que/por quê)", correctAnswer: "quem" }
      - { type: japanese_vocab, question: "たべもの (comida/bebida/roupa/livro)", correctAnswer: "comida" }
      - { type: japanese_vocab, question: "のみもの (bebida/comida/roupa/livro)", correctAnswer: "bebida" }
      - { type: japanese_vocab, question: "かばん (bolsa/sapato/chapéu/relógio)", correctAnswer: "bolsa" }
      - { type: japanese_vocab, question: "たべる (comer/beber/dormir/ver)", correctAnswer: "comer" }
      - { type: japanese_vocab, question: "あそぶ (brincar/estudar/trabalhar/dormir)", correctAnswer: "brincar" }
      - { type: japanese_vocab, question: "ぼうし (chapéu/sapato/camisa/calça)", correctAnswer: "chapéu" }
      - { type: japanese_vocab, question: "たまご (ovo/queijo/pão/frango)", correctAnswer: "ovo" }
target: 20
