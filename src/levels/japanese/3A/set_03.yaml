      - { type: kana_reading, question: "ば (ba/bi/bu/be/bo)", correctAnswer: ba, rationale: "ば lê-se \"ba\" (romaji)." }
      - { type: kana_reading, question: "び (ba/bi/bu/be/bo)", correctAnswer: bi, rationale: "び lê-se \"bi\" (romaji)." }
      - { type: kana_reading, question: "ぶ (ba/bi/bu/be/bo)", correctAnswer: bu, rationale: "ぶ lê-se \"bu\" (romaji)." }
      - { type: kana_reading, question: "べ (ba/bi/bu/be/bo)", correctAnswer: be, rationale: "べ lê-se \"be\" (romaji)." }
