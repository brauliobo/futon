      - { type: kana_reading, question: "げ (ga/gi/gu/ge/go)", correctAnswer: ge, rationale: "げ lê-se \"ge\" (romaji)." }
      - { type: kana_reading, question: "ご (ga/gi/gu/ge/go)", correctAnswer: go, rationale: "ご lê-se \"go\" (romaji)." }
      - { type: kana_reading, question: "か (ka/ga/ki/gi)", correctAnswer: ka, rationale: "か lê-se \"ka\" (romaji)." }
      - { type: kana_reading, question: "が (ga/ka/ki/gi)", correctAnswer: ga, rationale: "が lê-se \"ga\" (romaji)." }
