title: Hiragana voiced — が ぎ ぐ げ ご (G)
level: '3A'
subject: japanese
difficulty: 1
authorNotes: "Hiragana voiced — が ぎ ぐ げ ご (G). Foque no conceito central do conjunto e nos erros comuns."
example: "O símbolo ゛ (dakuten) muda か → が (ka → ga)"
pages:
