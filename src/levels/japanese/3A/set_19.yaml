title: 💬 Sentenças com は です (Sou / É)
level: '3A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Estrutura fundamental わたしは〜です e これは〜です. Negativa ではありません e pergunta ですか。"
example: "Estrutura: [tema] は [predicado] です。Ex.: わたしは がくせいです → Eu sou estudante."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Afirmativas com は です
    description: Leia a frase e escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "わたしは がくせいです。 (Eu sou professor./Ele é estudante./Eu sou estudante./Eu estudo.)", correctAnswer: "Eu sou estudante.", rationale: "わたし = eu; は = partícula tema; がくせい = estudante; です = é/sou.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "わたしは にほんじんです。 (Eu sou americano./Eu sou japonês./Ele é japonês./Ela é chinesa.)", correctAnswer: "Eu sou japonês.", rationale: "にほんじん = pessoa japonesa; です = sou. \"Eu sou japonês.\"", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは ほんです。 (Aquilo é um livro./Isto é uma caneta./Isto é um livro./Isso é um jornal.)", correctAnswer: "Isto é um livro.", rationale: "これ = isto; ほん = livro; です = é.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あのひとは せんせいです。 (Este homem é aluno./Aquela pessoa é professora./Esse homem é médico./Aquela pessoa estuda.)", correctAnswer: "Aquela pessoa é professora.", rationale: "あのひと = aquela pessoa; せんせい = professor/a.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きょうは もくようびです。 (Hoje é quarta./Hoje é sexta./Hoje é quinta./Amanhã é quinta.)", correctAnswer: "Hoje é quinta.", rationale: "きょう = hoje; もくようび = quinta-feira.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは わたしのです。 (Aquilo é seu./Isso é de ninguém./Isto é meu./Isso é meu.)", correctAnswer: "Isto é meu.", rationale: "これ = isto; わたしの = meu/minha; です = é.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かれは いしゃです。 (Ela é enfermeira./Ele é médico./Ela é médica./Ele é estudante.)", correctAnswer: "Ele é médico.", rationale: "かれ = ele; いしゃ = médico/a.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "わたしのなまえは さくらです。 (Meu sobrenome é Sakura./Meu nome é Sakura./Meu apelido é Sakura./Ela se chama Sakura.)", correctAnswer: "Meu nome é Sakura.", rationale: "わたしのなまえ = meu nome; さくら = Sakura.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは にほんごのほんです。 (Isto é um livro de inglês./Aquilo é um caderno de japonês./Isto é um livro de japonês./Isso é um dicionário.)", correctAnswer: "Isto é um livro de japonês.", rationale: "にほんご = japonês (língua); の = de (possessivo); ほん = livro.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "にほんごは むずかしいです。 (O japonês é fácil./O japonês é difícil./O japonês é bonito./O japonês é simples.)", correctAnswer: "O japonês é difícil.", rationale: "にほんご = japonês; むずかしい = difícil.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Negativa e pergunta com です
    description: Leia a frase e escolha a tradução correta.
    exercises:
      - { type: japanese_vocab, question: "わたしは せんせいでは ありません。 (Eu sou professor./Eu não sou professor./Eu estudo muito./Eu não estudo.)", correctAnswer: "Eu não sou professor.", rationale: "ではありません = negativa formal de です. \"Eu não sou professor.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは えんぴつでは ありません。 (Isto é um lápis./Isto não é um lápis./Aquilo é uma caneta./Isso é um lápis?)", correctAnswer: "Isto não é um lápis.", rationale: "ではありません = negativa. \"Isto não é um lápis.\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あなたは がくせいですか？ (Você é professor?/Você é estudante?/Você é médico?/Ele é estudante?)", correctAnswer: "Você é estudante?", rationale: "あなた = você; がくせい = estudante; ですか？ = é? (pergunta).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "はい、そうです。 (Não, não é./Talvez sim./Sim, é isso./Não tenho certeza.)", correctAnswer: "Sim, é isso.", rationale: "はい = sim; そうです = é isso/correto. Confirmação.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いいえ、ちがいます。 (Sim, é isso./Não sei./Não, está errado./Talvez.)", correctAnswer: "Não, está errado.", rationale: "いいえ = não; ちがいます = está errado/diferente. Negação.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは なんですか？ (Onde está isso?/Como é isso?/Por que é isso?/O que é isso?)", correctAnswer: "O que é isso?", rationale: "これ = isto; なん = o que; ですか？ = é? \"O que é isso?\"", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あなたは ブラジルじんですか？ (Você é japonês?/Você é americano?/Você é brasileiro?/Você é chinês?)", correctAnswer: "Você é brasileiro?", rationale: "ブラジルじん = pessoa brasileira; ですか？ = pergunta.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "はい、そうです。わたしはブラジルじんです。 (Não, sou japonês./Sim, sou brasileiro./Sim, sou americano./Não, sou chinês.)", correctAnswer: "Sim, sou brasileiro.", rationale: "はい = sim; わたしは ブラジルじん = eu sou brasileiro.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは たかいですか？ (Isto está longe?/Isto é caro?/Isto é bonito?/Isto é grande?)", correctAnswer: "Isto é caro?", rationale: "たかい = alto/caro; ですか？ = é? \"Isto é caro?\"", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いいえ、たかくありません。 (Sim, é caro./Não, não é alto./Não, não é caro./Talvez seja caro.)", correctAnswer: "Não, não é caro.", rationale: "たかくありません = negativa de たかい (forma adjetival). \"Não é caro.\"", difficulty: 3, objectives: [japanese.vocab] }
target: 20
