title: 📝 Sokuon っ — consoantes dobradas
level: '3A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Sokuon っ — consoantes dobradas. Foque no conceito central do conjunto e nos erros comuns."
example: "O pequeno っ dobra a próxima consoante: がっこう = 'ga-k-kou'"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Reconhecer palavras com っ
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "がっこう (casa/loja/escola/banco)", correctAnswer: "escola", rationale: "がっこう (hiragana) significa \"escola\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きって (carta/postal/selo/envelope)", correctAnswer: "selo", rationale: "きって lê-se \"selo\" (romaji).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きっぷ (cartão/dinheiro/passagem/bilhete)", correctAnswer: "passagem", rationale: "きっぷ (hiragana) significa \"passagem\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ざっし (livro/caderno/jornal/revista)", correctAnswer: "revista", rationale: "ざっし (hiragana) significa \"revista\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "にっき (diário/livro/agenda/calendário)", correctAnswer: "diário", rationale: "にっき (hiragana) significa \"diário\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ちょっと (um pouco/pouco/muito/nada)", correctAnswer: "um pouco", rationale: "ちょっと (hiragana) significa \"um pouco\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いっぱい (pouco/cheio/vazio/meio)", correctAnswer: "cheio", rationale: "いっぱい (hiragana) significa \"cheio\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "まっすぐ (curvo/oblíquo/torto/reto)", correctAnswer: "reto", rationale: "まっすぐ lê-se \"reto\" (romaji).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "しっぽ (rabo/cabeça/perna/asa)", correctAnswer: "rabo", rationale: "しっぽ lê-se \"rabo\" (romaji).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "みっつ (dois/cinco/três/quatro)", correctAnswer: "três", rationale: "みっつ (hiragana) significa \"três\" em português.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Contar っ vs sem っ
    description: Escolha a palavra com som dobrado correto.
    exercises:
      - { type: japanese_vocab, question: "selo (きって/きっと/きと/きて)", correctAnswer: "きって", rationale: "O som \"selo\" em hiragana escreve-se きって.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "escola (がっこ/がこ/がっこう/がこう)", correctAnswer: "がっこう", rationale: "\"escola\" em japonês escreve-se がっこう.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "revista (ざち/ざっし/ざし/ざっち)", correctAnswer: "ざっし", rationale: "\"revista\" em japonês escreve-se ざっし.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "um pouco (ちょと/ちょっと/ちゃっと/ちょった)", correctAnswer: "ちょっと", rationale: "\"um pouco\" em japonês escreve-se ちょっと.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "diário (にく/にっき/にき/にっく)", correctAnswer: "にっき", rationale: "\"diário\" em japonês escreve-se にっき.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "três (みっつ/みっち/みち/みつ)", correctAnswer: "みっつ", rationale: "\"três\" em japonês escreve-se みっつ.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "reto (まさぐ/まっすぐ/まづく/まっさぐ)", correctAnswer: "まっすぐ", rationale: "O som \"reto\" em hiragana escreve-se まっすぐ.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "passagem (きっぷ/きっふ/きぷ/きふ)", correctAnswer: "きっぷ", rationale: "\"passagem\" em japonês escreve-se きっぷ.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "cheio (いぱい/いっぱい/いはい/いっぱん)", correctAnswer: "いっぱい", rationale: "\"cheio\" em japonês escreve-se いっぱい.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "rabo (しぽ/しぼ/しっぽう/しっぽ)", correctAnswer: "しっぽ", rationale: "O som \"rabo\" em hiragana escreve-se しっぽ.", difficulty: 2, objectives: [japanese.vocab] }
target: 20
