title: Sokuon っ — consoantes dobradas
level: '3A'
subject: japanese
authorNotes: "Sokuon っ — consoantes dobradas. Foque no conceito central do conjunto e nos erros comuns."
example: "O pequeno っ dobra a próxima consoante: がっこう = 'ga-k-kou'"
pages:
  - pageNumber: 1
    title: Reconhecer palavras com っ
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "がっこう (escola/casa/banco/loja)", correctAnswer: "escola" }
      - { type: japanese_vocab, question: "きって (selo/carta/envelope/postal)", correctAnswer: "selo", rationale: "きって lê-se \"selo\" (romaji)." }
      - { type: japanese_vocab, question: "きっぷ (passagem/dinheiro/cartão/bilhete)", correctAnswer: "passagem" }
      - { type: japanese_vocab, question: "ざっし (revista/livro/caderno/jornal)", correctAnswer: "revista" }
      - { type: japanese_vocab, question: "にっき (diário/livro/agenda/calendário)", correctAnswer: "diário" }
      - { type: japanese_vocab, question: "ちょっと (um pouco/muito/pouco/nada)", correctAnswer: "um pouco" }
      - { type: japanese_vocab, question: "いっぱい (cheio/vazio/meio/pouco)", correctAnswer: "cheio" }
      - { type: japanese_vocab, question: "まっすぐ (reto/curvo/torto/oblíquo)", correctAnswer: "reto", rationale: "まっすぐ lê-se \"reto\" (romaji)." }
      - { type: japanese_vocab, question: "しっぽ (rabo/cabeça/perna/asa)", correctAnswer: "rabo", rationale: "しっぽ lê-se \"rabo\" (romaji)." }
      - { type: japanese_vocab, question: "みっつ (três/dois/quatro/cinco)", correctAnswer: "três" }
  - pageNumber: 2
    title: Contar っ vs sem っ
    description: Escolha a palavra com som dobrado correto.
    exercises:
      - { type: japanese_vocab, question: "selo (きって/きて/きっと/きと)", correctAnswer: "きって", rationale: "O som \"selo\" em hiragana escreve-se きって." }
      - { type: japanese_vocab, question: "escola (がっこう/がこう/がっこ/がこ)", correctAnswer: "がっこう", rationale: "\"escola\" em japonês escreve-se がっこう." }
      - { type: japanese_vocab, question: "revista (ざっし/ざし/ざっち/ざち)", correctAnswer: "ざっし", rationale: "\"revista\" em japonês escreve-se ざっし." }
      - { type: japanese_vocab, question: "um pouco (ちょっと/ちょと/ちょった/ちゃっと)", correctAnswer: "ちょっと", rationale: "\"um pouco\" em japonês escreve-se ちょっと." }
      - { type: japanese_vocab, question: "diário (にっき/にき/にっく/にく)", correctAnswer: "にっき", rationale: "\"diário\" em japonês escreve-se にっき." }
      - { type: japanese_vocab, question: "três (みっつ/みつ/みち/みっち)", correctAnswer: "みっつ", rationale: "\"três\" em japonês escreve-se みっつ." }
      - { type: japanese_vocab, question: "reto (まっすぐ/まさぐ/まっさぐ/まづく)", correctAnswer: "まっすぐ", rationale: "O som \"reto\" em hiragana escreve-se まっすぐ." }
      - { type: japanese_vocab, question: "passagem (きっぷ/きぷ/きっふ/きふ)", correctAnswer: "きっぷ", rationale: "\"passagem\" em japonês escreve-se きっぷ." }
      - { type: japanese_vocab, question: "cheio (いっぱい/いぱい/いっぱん/いはい)", correctAnswer: "いっぱい", rationale: "\"cheio\" em japonês escreve-se いっぱい." }
      - { type: japanese_vocab, question: "rabo (しっぽ/しぽ/しっぽう/しぼ)", correctAnswer: "しっぽ", rationale: "O som \"rabo\" em hiragana escreve-se しっぽ." }
target: 20
