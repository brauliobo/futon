title: Sokuon っ — consoantes dobradas
level: '3A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Sokuon っ — consoantes dobradas. Foque no conceito central do conjunto e nos erros comuns."
example: "O pequeno っ dobra a próxima consoante: がっこう = 'ga-k-kou'"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Reconhecer palavras com っ
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "がっこう (escola/casa/banco/loja)", correctAnswer: "escola", rationale: "がっこう (hiragana) significa \"escola\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きって (selo/carta/envelope/postal)", correctAnswer: "selo", rationale: "きって lê-se \"selo\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きっぷ (passagem/dinheiro/cartão/bilhete)", correctAnswer: "passagem", rationale: "きっぷ (hiragana) significa \"passagem\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ざっし (revista/livro/caderno/jornal)", correctAnswer: "revista", rationale: "ざっし (hiragana) significa \"revista\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "にっき (diário/livro/agenda/calendário)", correctAnswer: "diário", rationale: "にっき (hiragana) significa \"diário\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ちょっと (um pouco/muito/pouco/nada)", correctAnswer: "um pouco", rationale: "ちょっと (hiragana) significa \"um pouco\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いっぱい (cheio/vazio/meio/pouco)", correctAnswer: "cheio", rationale: "いっぱい (hiragana) significa \"cheio\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "まっすぐ (reto/curvo/torto/oblíquo)", correctAnswer: "reto", rationale: "まっすぐ lê-se \"reto\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "しっぽ (rabo/cabeça/perna/asa)", correctAnswer: "rabo", rationale: "しっぽ lê-se \"rabo\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "みっつ (três/dois/quatro/cinco)", correctAnswer: "três", rationale: "みっつ (hiragana) significa \"três\" em português.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Contar っ vs sem っ
    description: Escolha a palavra com som dobrado correto.
    exercises:
      - { type: japanese_vocab, question: "selo (きって/きて/きっと/きと)", correctAnswer: "きって", rationale: "O som \"selo\" em hiragana escreve-se きって.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "escola (がっこう/がこう/がっこ/がこ)", correctAnswer: "がっこう", rationale: "\"escola\" em japonês escreve-se がっこう.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "revista (ざっし/ざし/ざっち/ざち)", correctAnswer: "ざっし", rationale: "\"revista\" em japonês escreve-se ざっし.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "um pouco (ちょっと/ちょと/ちょった/ちゃっと)", correctAnswer: "ちょっと", rationale: "\"um pouco\" em japonês escreve-se ちょっと.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "diário (にっき/にき/にっく/にく)", correctAnswer: "にっき", rationale: "\"diário\" em japonês escreve-se にっき.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "três (みっつ/みつ/みち/みっち)", correctAnswer: "みっつ", rationale: "\"três\" em japonês escreve-se みっつ.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "reto (まっすぐ/まさぐ/まっさぐ/まづく)", correctAnswer: "まっすぐ", rationale: "O som \"reto\" em hiragana escreve-se まっすぐ.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "passagem (きっぷ/きぷ/きっふ/きふ)", correctAnswer: "きっぷ", rationale: "\"passagem\" em japonês escreve-se きっぷ.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "cheio (いっぱい/いぱい/いっぱん/いはい)", correctAnswer: "いっぱい", rationale: "\"cheio\" em japonês escreve-se いっぱい.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "rabo (しっぽ/しぽ/しっぽう/しぼ)", correctAnswer: "しっぽ", rationale: "O som \"rabo\" em hiragana escreve-se しっぽ.", objectives: [japanese.vocab] }
target: 20
