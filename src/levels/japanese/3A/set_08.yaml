title: Vogais longas — おとうさん vs おとさん
level: '3A'
subject: japanese
authorNotes: "Vogais longas — おとうさん vs おとさん. Foque no conceito central do conjunto e nos erros comuns."
example: "Vogal longa: おう soa como 'ô'. えい soa como 'ê'."
pages:
  - pageNumber: 1
    title: Reconhecer vogais longas
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "おとうさん (pai/mãe/irmão/tio)", correctAnswer: "pai" }
      - { type: japanese_vocab, question: "おかあさん (mãe/pai/avó/tia)", correctAnswer: "mãe" }
      - { type: japanese_vocab, question: "せんせい (professor/estudante/médico/engenheiro)", correctAnswer: "professor" }
      - { type: japanese_vocab, question: "がくせい (estudante/professor/médico/engenheiro)", correctAnswer: "estudante" }
      - { type: japanese_vocab, question: "とうきょう (Tóquio/Kyoto/Osaka/Nagoya)", correctAnswer: "Tóquio" }
      - { type: japanese_vocab, question: "こうえん (parque/praça/jardim/quintal)", correctAnswer: "parque" }
      - { type: japanese_vocab, question: "くうこう (aeroporto/estação/porto/parada)", correctAnswer: "aeroporto" }
      - { type: japanese_vocab, question: "ゆうびんきょく (correio/banco/loja/escola)", correctAnswer: "correio" }
      - { type: japanese_vocab, question: "いもうと (irmã mais nova/irmã mais velha/mãe/tia)", correctAnswer: "irmã mais nova" }
      - { type: japanese_vocab, question: "ありがとう (obrigado/desculpa/tchau/olá)", correctAnswer: "obrigado" }
  - pageNumber: 2
    title: Curta vs longa
    description: Escolha a versão com a vogal correta.
    exercises:
      - { type: japanese_vocab, question: "professor (せんせい/せんせ/せんせえ/せえんせ)", correctAnswer: "せんせい" }
      - { type: japanese_vocab, question: "Tóquio (とうきょう/ときょ/とうきょ/ときょう)", correctAnswer: "とうきょう" }
      - { type: japanese_vocab, question: "mãe (おかあさん/おかさん/おかーさん/おかあん)", correctAnswer: "おかあさん" }
      - { type: japanese_vocab, question: "pai (おとうさん/おとさん/おとさーん/おとおさん)", correctAnswer: "おとうさん" }
      - { type: japanese_vocab, question: "irmã mais nova (いもうと/いもと/いうもと/いもおと)", correctAnswer: "いもうと" }
      - { type: japanese_vocab, question: "obrigado (ありがとう/ありがと/ありがとお/ありがとーう)", correctAnswer: "ありがとう" }
      - { type: japanese_vocab, question: "parque (こうえん/こえん/こーえん/こおえん)", correctAnswer: "こうえん" }
      - { type: japanese_vocab, question: "aeroporto (くうこう/くこう/くうこ/くこ)", correctAnswer: "くうこう" }
      - { type: japanese_vocab, question: "estudante (がくせい/がくせ/がくせえ/がっくせい)", correctAnswer: "がくせい" }
      - { type: japanese_vocab, question: "correio (ゆうびんきょく/ゆびんきょく/ゆうびんきょ/ゆびんきょ)", correctAnswer: "ゆうびんきょく" }
