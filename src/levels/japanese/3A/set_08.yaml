title: Vogais longas — おとうさん vs おとさん
level: '3A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Vogais longas — おとうさん vs おとさん. Foque no conceito central do conjunto e nos erros comuns."
example: "Vogal longa: おう soa como 'ô'. えい soa como 'ê'. Ex.: おとうさん → pai."
pages:
  - pageNumber: 1
    title: Reconhecer vogais longas
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "おとうさん (pai/mãe/irmão/tio)", correctAnswer: "pai", rationale: "おとうさん lê-se \"pai\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おかあさん (mãe/pai/avó/tia)", correctAnswer: "mãe", rationale: "おかあさん (hiragana) significa \"mãe\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "せんせい (professor/estudante/médico/engenheiro)", correctAnswer: "professor", rationale: "せんせい (hiragana) significa \"professor\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "がくせい (estudante/professor/médico/engenheiro)", correctAnswer: "estudante", rationale: "がくせい (hiragana) significa \"estudante\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "とうきょう (Tóquio/Kyoto/Osaka/Nagoya)", correctAnswer: "Tóquio", rationale: "とうきょう (hiragana) significa \"Tóquio\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "こうえん (parque/praça/jardim/quintal)", correctAnswer: "parque", rationale: "こうえん (hiragana) significa \"parque\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "くうこう (aeroporto/estação/porto/parada)", correctAnswer: "aeroporto", rationale: "くうこう (hiragana) significa \"aeroporto\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ゆうびんきょく (correio/banco/loja/escola)", correctAnswer: "correio", rationale: "ゆうびんきょく (hiragana) significa \"correio\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "いもうと (irmã mais nova/irmã mais velha/mãe/tia)", correctAnswer: "irmã mais nova", rationale: "いもうと (hiragana) significa \"irmã mais nova\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ありがとう (obrigado/desculpa/tchau/olá)", correctAnswer: "obrigado", rationale: "ありがとう (hiragana) significa \"obrigado\" em português.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Curta vs longa
    description: Escolha a versão com a vogal correta.
    exercises:
      - { type: japanese_vocab, question: "professor (せんせい/せんせ/せんせえ/せえんせ)", correctAnswer: "せんせい", rationale: "\"professor\" em japonês escreve-se せんせい.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "Tóquio (とうきょう/ときょ/とうきょ/ときょう)", correctAnswer: "とうきょう", rationale: "\"Tóquio\" em japonês escreve-se とうきょう.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "mãe (おかあさん/おかさん/おかーさん/おかあん)", correctAnswer: "おかあさん", rationale: "\"mãe\" em japonês escreve-se おかあさん.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "pai (おとうさん/おとさん/おとさーん/おとおさん)", correctAnswer: "おとうさん", rationale: "O som \"pai\" em hiragana escreve-se おとうさん.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "irmã mais nova (いもうと/いもと/いうもと/いもおと)", correctAnswer: "いもうと", rationale: "\"irmã mais nova\" em japonês escreve-se いもうと.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "obrigado (ありがとう/ありがと/ありがとお/ありがとーう)", correctAnswer: "ありがとう", rationale: "\"obrigado\" em japonês escreve-se ありがとう.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "parque (こうえん/こえん/こーえん/こおえん)", correctAnswer: "こうえん", rationale: "\"parque\" em japonês escreve-se こうえん.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "aeroporto (くうこう/くこう/くうこ/くこ)", correctAnswer: "くうこう", rationale: "\"aeroporto\" em japonês escreve-se くうこう.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "estudante (がくせい/がくせ/がくせえ/がっくせい)", correctAnswer: "がくせい", rationale: "\"estudante\" em japonês escreve-se がくせい.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "correio (ゆうびんきょく/ゆびんきょく/ゆうびんきょ/ゆびんきょ)", correctAnswer: "ゆうびんきょく", rationale: "\"correio\" em japonês escreve-se ゆうびんきょく.", objectives: [japanese.vocab] }
