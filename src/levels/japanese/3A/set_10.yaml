    title: Dias em hiragana
    description: Leia e escolha o dia.
    exercises:
      - { type: japanese_vocab, question: "げつようび (quarta/terça/segunda/quinta)", correctAnswer: "segunda", rationale: "げつようび (hiragana) significa \"segunda\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かようび (quinta/terça/segunda/quarta)", correctAnswer: "terça", rationale: "かようび (hiragana) significa \"terça\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "すいようび (terça/quinta/sexta/quarta)", correctAnswer: "quarta", rationale: "すいようび (hiragana) significa \"quarta\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "もくようび (quarta/quinta/sábado/sexta)", correctAnswer: "quinta", rationale: "もくようび (hiragana) significa \"quinta\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きんようび (sexta/sábado/domingo/quinta)", correctAnswer: "sexta", rationale: "きんようび (hiragana) significa \"sexta\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どようび (sexta/segunda/domingo/sábado)", correctAnswer: "sábado", rationale: "どようび (hiragana) significa \"sábado\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "にちようび (segunda/terça/domingo/sábado)", correctAnswer: "domingo", rationale: "にちようび (hiragana) significa \"domingo\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きょう (amanhã/hoje/depois/ontem)", correctAnswer: "hoje", rationale: "きょう lê-se \"hoje\" (romaji).", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あした (hoje/depois/ontem/amanhã)", correctAnswer: "amanhã", rationale: "あした (hiragana) significa \"amanhã\" em português.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きのう (ontem/amanhã/depois/hoje)", correctAnswer: "ontem", rationale: "きのう (hiragana) significa \"ontem\" em português.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
