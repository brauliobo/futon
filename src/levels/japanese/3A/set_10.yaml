pages:
  - pageNumber: 1
    title: Dias em hiragana
    description: Leia e escolha o dia.
    exercises:
      - { type: japanese_vocab, question: "げつようび (segunda/terça/quarta/quinta)", correctAnswer: "segunda", rationale: "げつようび (hiragana) significa \"segunda\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かようび (terça/segunda/quarta/quinta)", correctAnswer: "terça", rationale: "かようび (hiragana) significa \"terça\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "すいようび (quarta/terça/quinta/sexta)", correctAnswer: "quarta", rationale: "すいようび (hiragana) significa \"quarta\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "もくようび (quinta/quarta/sexta/sábado)", correctAnswer: "quinta", rationale: "もくようび (hiragana) significa \"quinta\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きんようび (sexta/quinta/sábado/domingo)", correctAnswer: "sexta", rationale: "きんようび (hiragana) significa \"sexta\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "どようび (sábado/sexta/domingo/segunda)", correctAnswer: "sábado", rationale: "どようび (hiragana) significa \"sábado\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "にちようび (domingo/sábado/segunda/terça)", correctAnswer: "domingo", rationale: "にちようび (hiragana) significa \"domingo\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きょう (hoje/amanhã/ontem/depois)", correctAnswer: "hoje", rationale: "きょう lê-se \"hoje\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あした (amanhã/hoje/ontem/depois)", correctAnswer: "amanhã", rationale: "あした (hiragana) significa \"amanhã\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きのう (ontem/hoje/amanhã/depois)", correctAnswer: "ontem", rationale: "きのう (hiragana) significa \"ontem\" em português.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Do dia ao hiragana
    description: Escolha o hiragana correto.
    exercises:
      - { type: japanese_vocab, question: "segunda (げつようび/かようび/すいようび/もくようび)", correctAnswer: "げつようび", rationale: "\"segunda\" em japonês escreve-se げつようび.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "terça (かようび/げつようび/すいようび/もくようび)", correctAnswer: "かようび", rationale: "\"terça\" em japonês escreve-se かようび.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "quarta (すいようび/げつようび/かようび/もくようび)", correctAnswer: "すいようび", rationale: "\"quarta\" em japonês escreve-se すいようび.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "quinta (もくようび/きんようび/どようび/にちようび)", correctAnswer: "もくようび", rationale: "\"quinta\" em japonês escreve-se もくようび.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "sexta (きんようび/もくようび/どようび/にちようび)", correctAnswer: "きんようび", rationale: "\"sexta\" em japonês escreve-se きんようび.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "sábado (どようび/きんようび/にちようび/げつようび)", correctAnswer: "どようび", rationale: "\"sábado\" em japonês escreve-se どようび.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "domingo (にちようび/どようび/げつようび/かようび)", correctAnswer: "にちようび", rationale: "\"domingo\" em japonês escreve-se にちようび.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "hoje (きょう/あした/きのう/あさって)", correctAnswer: "きょう", rationale: "O som \"hoje\" em hiragana escreve-se きょう.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "amanhã (あした/きょう/きのう/あさって)", correctAnswer: "あした", rationale: "\"amanhã\" em japonês escreve-se あした.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ontem (きのう/きょう/あした/あさって)", correctAnswer: "きのう", rationale: "\"ontem\" em japonês escreve-se きのう.", objectives: [japanese.vocab] }
target: 20
