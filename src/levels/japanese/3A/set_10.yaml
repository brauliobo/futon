title: Dias da semana
level: '3A'
subject: japanese
difficulty: 2
authorNotes: "Dias da semana. Foque no conceito central do conjunto e nos erros comuns."
example: "Cada dia vem de um elemento: 月 (lua/segunda), 火 (fogo/terça)... Ex.: げつようび → segunda."
pages:
  - pageNumber: 1
    title: Dias em hiragana
    description: Leia e escolha o dia.
    exercises:
      - { type: japanese_vocab, question: "げつようび (segunda/terça/quarta/quinta)", correctAnswer: "segunda" }
      - { type: japanese_vocab, question: "かようび (terça/segunda/quarta/quinta)", correctAnswer: "terça" }
      - { type: japanese_vocab, question: "すいようび (quarta/terça/quinta/sexta)", correctAnswer: "quarta" }
      - { type: japanese_vocab, question: "もくようび (quinta/quarta/sexta/sábado)", correctAnswer: "quinta" }
      - { type: japanese_vocab, question: "きんようび (sexta/quinta/sábado/domingo)", correctAnswer: "sexta" }
      - { type: japanese_vocab, question: "どようび (sábado/sexta/domingo/segunda)", correctAnswer: "sábado" }
      - { type: japanese_vocab, question: "にちようび (domingo/sábado/segunda/terça)", correctAnswer: "domingo" }
      - { type: japanese_vocab, question: "きょう (hoje/amanhã/ontem/depois)", correctAnswer: "hoje", rationale: "きょう lê-se \"hoje\" (romaji)." }
      - { type: japanese_vocab, question: "あした (amanhã/hoje/ontem/depois)", correctAnswer: "amanhã" }
      - { type: japanese_vocab, question: "きのう (ontem/hoje/amanhã/depois)", correctAnswer: "ontem" }
  - pageNumber: 2
    title: Do dia ao hiragana
    description: Escolha o hiragana correto.
    exercises:
      - { type: japanese_vocab, question: "segunda (げつようび/かようび/すいようび/もくようび)", correctAnswer: "げつようび", rationale: "\"segunda\" em japonês escreve-se げつようび." }
      - { type: japanese_vocab, question: "terça (かようび/げつようび/すいようび/もくようび)", correctAnswer: "かようび", rationale: "\"terça\" em japonês escreve-se かようび." }
      - { type: japanese_vocab, question: "quarta (すいようび/げつようび/かようび/もくようび)", correctAnswer: "すいようび", rationale: "\"quarta\" em japonês escreve-se すいようび." }
      - { type: japanese_vocab, question: "quinta (もくようび/きんようび/どようび/にちようび)", correctAnswer: "もくようび", rationale: "\"quinta\" em japonês escreve-se もくようび." }
      - { type: japanese_vocab, question: "sexta (きんようび/もくようび/どようび/にちようび)", correctAnswer: "きんようび", rationale: "\"sexta\" em japonês escreve-se きんようび." }
      - { type: japanese_vocab, question: "sábado (どようび/きんようび/にちようび/げつようび)", correctAnswer: "どようび", rationale: "\"sábado\" em japonês escreve-se どようび." }
      - { type: japanese_vocab, question: "domingo (にちようび/どようび/げつようび/かようび)", correctAnswer: "にちようび", rationale: "\"domingo\" em japonês escreve-se にちようび." }
      - { type: japanese_vocab, question: "hoje (きょう/あした/きのう/あさって)", correctAnswer: "きょう", rationale: "O som \"hoje\" em hiragana escreve-se きょう." }
      - { type: japanese_vocab, question: "amanhã (あした/きょう/きのう/あさって)", correctAnswer: "あした", rationale: "\"amanhã\" em japonês escreve-se あした." }
      - { type: japanese_vocab, question: "ontem (きのう/きょう/あした/あさって)", correctAnswer: "きのう", rationale: "\"ontem\" em japonês escreve-se きのう." }
target: 20
