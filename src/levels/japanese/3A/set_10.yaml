    description: Escolha o hiragana correto.
    exercises:
      - { type: japanese_vocab, question: "segunda (げつようび/かようび/すいようび/もくようび)", correctAnswer: "げつようび", rationale: "\"segunda\" em japonês escreve-se げつようび.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "terça (すいようび/もくようび/かようび/げつようび)", correctAnswer: "かようび", rationale: "\"terça\" em japonês escreve-se かようび.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "quarta (げつようび/かようび/もくようび/すいようび)", correctAnswer: "すいようび", rationale: "\"quarta\" em japonês escreve-se すいようび.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "quinta (きんようび/どようび/にちようび/もくようび)", correctAnswer: "もくようび", rationale: "\"quinta\" em japonês escreve-se もくようび.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "sexta (きんようび/にちようび/どようび/もくようび)", correctAnswer: "きんようび", rationale: "\"sexta\" em japonês escreve-se きんようび.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "sábado (げつようび/どようび/きんようび/にちようび)", correctAnswer: "どようび", rationale: "\"sábado\" em japonês escreve-se どようび.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "domingo (げつようび/どようび/にちようび/かようび)", correctAnswer: "にちようび", rationale: "\"domingo\" em japonês escreve-se にちようび.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "hoje (あした/きょう/あさって/きのう)", correctAnswer: "きょう", rationale: "O som \"hoje\" em hiragana escreve-se きょう.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "amanhã (きょう/あした/あさって/きのう)", correctAnswer: "あした", rationale: "\"amanhã\" em japonês escreve-se あした.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ontem (あした/きょう/きのう/あさって)", correctAnswer: "きのう", rationale: "\"ontem\" em japonês escreve-se きのう.", difficulty: 2, objectives: [japanese.vocab] }
