title: Hiragana — revisão final 3A
level: '3A'
subject: japanese
authorNotes: "Hiragana — revisão final 3A. Foque no conceito central do conjunto e nos erros comuns."
example: "Você domina 46 + voiced + combinados + ~300 palavras!. Ex.: がくせい → estudante."
pages:
  - pageNumber: 1
    title: Leitura mista
    description: Leia cada palavra e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "がくせい (estudante/professor/médico/engenheiro)", correctAnswer: "estudante" }
      - { type: japanese_vocab, question: "じしょ (dicionário/livro/revista/jornal)", correctAnswer: "dicionário" }
      - { type: japanese_vocab, question: "でんしゃ (trem/carro/ônibus/bicicleta)", correctAnswer: "trem", rationale: "でんしゃ lê-se \"trem\" (romaji)." }
      - { type: japanese_vocab, question: "きっぷ (passagem/dinheiro/cartão/chave)", correctAnswer: "passagem" }
      - { type: japanese_vocab, question: "しゃしん (foto/mapa/quadro/cartão)", correctAnswer: "foto", rationale: "しゃしん lê-se \"foto\" (romaji)." }
      - { type: japanese_vocab, question: "びょういん (hospital/escola/banco/loja)", correctAnswer: "hospital" }
      - { type: japanese_vocab, question: "ぎゅうにゅう (leite/água/suco/chá)", correctAnswer: "leite" }
      - { type: japanese_vocab, question: "おちゃ (chá/café/suco/leite)", correctAnswer: "chá" }
      - { type: japanese_vocab, question: "きょう (hoje/amanhã/ontem/depois)", correctAnswer: "hoje", rationale: "きょう lê-se \"hoje\" (romaji)." }
      - { type: japanese_vocab, question: "ともだち (amigo/colega/parente/vizinho)", correctAnswer: "amigo" }
  - pageNumber: 2
    title: Frases curtas completas
    description: Leia a frase e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "わたしは がくせいです。 (Eu sou estudante./Ele é estudante./Eu sou professor./Eu estudo.)", correctAnswer: "Eu sou estudante." }
      - { type: japanese_vocab, question: "これは ほんです。 (Isto é um livro./Aquilo é uma caneta./Isto é uma mesa./Aquilo é um livro.)", correctAnswer: "Isto é um livro." }
      - { type: japanese_vocab, question: "おちゃを のみます。 (Bebo chá./Como chá./Vejo chá./Faço chá.)", correctAnswer: "Bebo chá." }
      - { type: japanese_vocab, question: "ほんを よみます。 (Leio um livro./Escrevo um livro./Compro um livro./Vejo um livro.)", correctAnswer: "Leio um livro." }
      - { type: japanese_vocab, question: "がっこうに いきます。 (Vou à escola./Venho da escola./Estou na escola./Saio da escola.)", correctAnswer: "Vou à escola." }
      - { type: japanese_vocab, question: "ともだちと あそびます。 (Brinco com o amigo./Estudo com o amigo./Como com o amigo./Ando com o amigo.)", correctAnswer: "Brinco com o amigo." }
      - { type: japanese_vocab, question: "きょうは げつようびです。 (Hoje é segunda./Hoje é terça./Amanhã é segunda./Ontem foi segunda.)", correctAnswer: "Hoje é segunda." }
      - { type: japanese_vocab, question: "おはようございます! (Bom dia!/Boa tarde!/Boa noite!/Obrigado!)", correctAnswer: "Bom dia!" }
      - { type: japanese_vocab, question: "ありがとうございます。 (Muito obrigado./Desculpa./Por favor./Tchau.)", correctAnswer: "Muito obrigado." }
      - { type: japanese_vocab, question: "にほんごを べんきょうします。 (Estudo japonês./Falo japonês./Leio japonês./Escrevo japonês.)", correctAnswer: "Estudo japonês." }
target: 20
