title: Hiragana — revisão final 3A
level: '3A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Hiragana — revisão final 3A. Foque no conceito central do conjunto e nos erros comuns."
example: "Você domina 46 + voiced + combinados + ~300 palavras!. Ex.: がくせい → estudante."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Leitura mista
    description: Leia cada palavra e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "がくせい (estudante/professor/médico/engenheiro)", correctAnswer: "estudante", rationale: "がくせい (hiragana) significa \"estudante\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "じしょ (dicionário/livro/revista/jornal)", correctAnswer: "dicionário", rationale: "じしょ (hiragana) significa \"dicionário\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "でんしゃ (trem/carro/ônibus/bicicleta)", correctAnswer: "trem", rationale: "でんしゃ lê-se \"trem\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きっぷ (passagem/dinheiro/cartão/chave)", correctAnswer: "passagem", rationale: "きっぷ (hiragana) significa \"passagem\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "しゃしん (foto/mapa/quadro/cartão)", correctAnswer: "foto", rationale: "しゃしん lê-se \"foto\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "びょういん (hospital/escola/banco/loja)", correctAnswer: "hospital", rationale: "びょういん (hiragana) significa \"hospital\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ぎゅうにゅう (leite/água/suco/chá)", correctAnswer: "leite", rationale: "ぎゅうにゅう (hiragana) significa \"leite\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おちゃ (chá/café/suco/leite)", correctAnswer: "chá", rationale: "おちゃ (hiragana) significa \"chá\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きょう (hoje/amanhã/ontem/depois)", correctAnswer: "hoje", rationale: "きょう lê-se \"hoje\" (romaji).", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ともだち (amigo/colega/parente/vizinho)", correctAnswer: "amigo", rationale: "ともだち (hiragana) significa \"amigo\" em português.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Frases curtas completas
    description: Leia a frase e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "わたしは がくせいです。 (Eu sou estudante./Ele é estudante./Eu sou professor./Eu estudo.)", correctAnswer: "Eu sou estudante.", rationale: "A frase \"わたしは がくせいです。\" traduz-se como \"Eu sou estudante.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは ほんです。 (Isto é um livro./Aquilo é uma caneta./Isto é uma mesa./Aquilo é um livro.)", correctAnswer: "Isto é um livro.", rationale: "A frase \"これは ほんです。\" traduz-se como \"Isto é um livro.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おちゃを のみます。 (Bebo chá./Como chá./Vejo chá./Faço chá.)", correctAnswer: "Bebo chá.", rationale: "A frase \"おちゃを のみます。\" traduz-se como \"Bebo chá.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ほんを よみます。 (Leio um livro./Escrevo um livro./Compro um livro./Vejo um livro.)", correctAnswer: "Leio um livro.", rationale: "A frase \"ほんを よみます。\" traduz-se como \"Leio um livro.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "がっこうに いきます。 (Vou à escola./Venho da escola./Estou na escola./Saio da escola.)", correctAnswer: "Vou à escola.", rationale: "A frase \"がっこうに いきます。\" traduz-se como \"Vou à escola.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ともだちと あそびます。 (Brinco com o amigo./Estudo com o amigo./Como com o amigo./Ando com o amigo.)", correctAnswer: "Brinco com o amigo.", rationale: "A frase \"ともだちと あそびます。\" traduz-se como \"Brinco com o amigo.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "きょうは げつようびです。 (Hoje é segunda./Hoje é terça./Amanhã é segunda./Ontem foi segunda.)", correctAnswer: "Hoje é segunda.", rationale: "A frase \"きょうは げつようびです。\" traduz-se como \"Hoje é segunda.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "おはようございます! (Bom dia!/Boa tarde!/Boa noite!/Obrigado!)", correctAnswer: "Bom dia!", rationale: "A frase \"おはようございます!\" traduz-se como \"Bom dia!\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ありがとうございます。 (Muito obrigado./Desculpa./Por favor./Tchau.)", correctAnswer: "Muito obrigado.", rationale: "A frase \"ありがとうございます。\" traduz-se como \"Muito obrigado.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "にほんごを べんきょうします。 (Estudo japonês./Falo japonês./Leio japonês./Escrevo japonês.)", correctAnswer: "Estudo japonês.", rationale: "A frase \"にほんごを べんきょうします。\" traduz-se como \"Estudo japonês.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
target: 20
