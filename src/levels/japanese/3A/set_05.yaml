title: Hiragana combinado — きゃ しゃ ちゃ (yōon com Y)
level: '3A'
subject: japanese
example: "き + pequeno ゃ = きゃ 'kya' (uma sílaba só)"
pages:
  - pageNumber: 1
    title: Reconhecer combinados
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "きゃ (kya/kyu/kyo/sha/shu)", correctAnswer: kya }
      - { type: kana_reading, question: "きゅ (kya/kyu/kyo/sha/shu)", correctAnswer: kyu }
      - { type: kana_reading, question: "きょ (kya/kyu/kyo/sha/shu)", correctAnswer: kyo }
      - { type: kana_reading, question: "しゃ (sha/shu/sho/cha/chu)", correctAnswer: sha }
      - { type: kana_reading, question: "しゅ (sha/shu/sho/cha/chu)", correctAnswer: shu }
      - { type: kana_reading, question: "しょ (sha/shu/sho/cha/chu)", correctAnswer: sho }
      - { type: kana_reading, question: "ちゃ (cha/chu/cho/kya/sha)", correctAnswer: cha }
      - { type: kana_reading, question: "ちゅ (cha/chu/cho/kya/sha)", correctAnswer: chu }
      - { type: kana_reading, question: "ちょ (cha/chu/cho/kya/sha)", correctAnswer: cho }
      - { type: kana_reading, question: "じゃ (ja/ju/jo/cha/sha)", correctAnswer: ja }
  - pageNumber: 2
    title: Palavras com combinados
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "おちゃ (chá/café/suco/leite)", correctAnswer: "chá" }
