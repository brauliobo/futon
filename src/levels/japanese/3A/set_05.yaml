      - { type: japanese_vocab, question: "ひゃく (cem/mil/dez/um milhão)", correctAnswer: "cem" }
      - { type: japanese_vocab, question: "きゃく (cliente/vendedor/amigo/vizinho)", correctAnswer: "cliente" }
      - { type: japanese_vocab, question: "しゅくだい (dever de casa/lição/prova/aula)", correctAnswer: "dever de casa" }
      - { type: japanese_vocab, question: "じゅう (dez/cem/mil/vinte)", correctAnswer: "dez" }
