title: Hiragana combinado — にゃ ひゃ みゃ りゃ + voiced
level: '3A'
subject: japanese
authorNotes: "Hiragana combinado — にゃ ひゃ みゃ りゃ + voiced. Foque no conceito central do conjunto e nos erros comuns."
example: "びゃ = 'bya', ぴゃ = 'pya', ぎゃ = 'gya'"
pages:
  - pageNumber: 1
    title: Combinados adicionais
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "にゃ (nya/nyu/nyo/mya/myu)", correctAnswer: nya, rationale: "にゃ lê-se \"nya\" (romaji)." }
      - { type: kana_reading, question: "ひゃ (hya/hyu/hyo/bya/byu)", correctAnswer: hya, rationale: "ひゃ lê-se \"hya\" (romaji)." }
      - { type: kana_reading, question: "みゃ (mya/myu/myo/rya/ryu)", correctAnswer: mya, rationale: "みゃ lê-se \"mya\" (romaji)." }
      - { type: kana_reading, question: "りゃ (rya/ryu/ryo/kya/sha)", correctAnswer: rya, rationale: "りゃ lê-se \"rya\" (romaji)." }
      - { type: kana_reading, question: "ぎゃ (gya/gyu/gyo/kya/kyu)", correctAnswer: gya, rationale: "ぎゃ lê-se \"gya\" (romaji)." }
      - { type: kana_reading, question: "ぎゅ (gya/gyu/gyo/kya/kyu)", correctAnswer: gyu, rationale: "ぎゅ lê-se \"gyu\" (romaji)." }
      - { type: kana_reading, question: "ぎょ (gya/gyu/gyo/kya/kyu)", correctAnswer: gyo, rationale: "ぎょ lê-se \"gyo\" (romaji)." }
      - { type: kana_reading, question: "びゃ (bya/byu/byo/pya/pyo)", correctAnswer: bya, rationale: "びゃ lê-se \"bya\" (romaji)." }
      - { type: kana_reading, question: "ぴゅ (pya/pyu/pyo/bya/byo)", correctAnswer: pyu, rationale: "ぴゅ lê-se \"pyu\" (romaji)." }
      - { type: kana_reading, question: "じょ (jo/ja/ju/cho)", correctAnswer: jo, rationale: "じょ lê-se \"jo\" (romaji)." }
  - pageNumber: 2
    title: Palavras com combinados
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "にゅうがく (entrar na escola/formatura/férias/prova)", correctAnswer: "entrar na escola" }
      - { type: japanese_vocab, question: "さんびゃく (trezentos/trinta/três mil/três)", correctAnswer: "trezentos" }
      - { type: japanese_vocab, question: "りょうり (culinária/receita/ingrediente/prato)", correctAnswer: "culinária" }
      - { type: japanese_vocab, question: "ぎゅうにゅう (leite/suco/água/chá)", correctAnswer: "leite" }
      - { type: japanese_vocab, question: "ひゃっか (enciclopédia/dicionário/revista/jornal)", correctAnswer: "enciclopédia" }
      - { type: japanese_vocab, question: "びょういん (hospital/escola/banco/correio)", correctAnswer: "hospital" }
      - { type: japanese_vocab, question: "りゅうがく (intercâmbio/viagem/trabalho/mudança)", correctAnswer: "intercâmbio" }
      - { type: japanese_vocab, question: "じゅぎょう (aula/dever/prova/nota)", correctAnswer: "aula", rationale: "じゅぎょう lê-se \"aula\" (romaji)." }
      - { type: japanese_vocab, question: "しゃしん (foto/quadro/estátua/desenho)", correctAnswer: "foto", rationale: "しゃしん lê-se \"foto\" (romaji)." }
      - { type: japanese_vocab, question: "じゃ (então/mas/porém/também)", correctAnswer: "então" }
target: 20
