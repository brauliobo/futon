title: Katakana — アイウエオ (vogais)
level: '2A'
subject: japanese
authorNotes: "Katakana — アイウエオ (vogais). Foque no conceito central do conjunto e nos erros comuns."
example: "Katakana é usado para palavras estrangeiras. ア = 'a'"
pages:
  - pageNumber: 1
    title: Reconhecer vogais katakana
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "ア (a/i/u/e/o)", correctAnswer: a }
      - { type: kana_reading, question: "イ (a/i/u/e/o)", correctAnswer: i }
      - { type: kana_reading, question: "ウ (a/i/u/e/o)", correctAnswer: u }
      - { type: kana_reading, question: "エ (a/i/u/e/o)", correctAnswer: e }
      - { type: kana_reading, question: "オ (a/i/u/e/o)", correctAnswer: o }
      - { type: kana_reading, question: "オ (o/u/e/a/i)", correctAnswer: o }
      - { type: kana_reading, question: "イ (u/e/i/o/a)", correctAnswer: i }
      - { type: kana_reading, question: "エ (i/e/u/a/o)", correctAnswer: e }
      - { type: kana_reading, question: "ア (i/u/o/a/e)", correctAnswer: a }
      - { type: kana_reading, question: "ウ (i/e/o/a/u)", correctAnswer: u }
  - pageNumber: 2
    title: Hiragana vs Katakana
    description: Escolha o katakana correspondente ao hiragana.
    exercises:
      - { type: kana_writing, question: "あ (ア/イ/ウ/エ)", correctAnswer: "ア" }
      - { type: kana_writing, question: "い (イ/ア/オ/エ)", correctAnswer: "イ" }
      - { type: kana_writing, question: "う (ウ/ア/オ/イ)", correctAnswer: "ウ" }
      - { type: kana_writing, question: "え (エ/ア/オ/イ)", correctAnswer: "エ" }
      - { type: kana_writing, question: "お (オ/ア/ウ/エ)", correctAnswer: "オ" }
      - { type: kana_writing, question: "o (オ/エ/ウ/ア)", correctAnswer: "オ" }
      - { type: kana_writing, question: "a (ア/オ/ウ/エ)", correctAnswer: "ア" }
      - { type: kana_writing, question: "e (エ/イ/ア/オ)", correctAnswer: "エ" }
      - { type: kana_writing, question: "i (イ/ア/ウ/エ)", correctAnswer: "イ" }
      - { type: kana_writing, question: "u (ウ/エ/ア/オ)", correctAnswer: "ウ" }
target: 20
