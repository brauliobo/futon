title: Katakana — アイウエオ (vogais)
level: '2A'
subject: japanese
difficulty: 1
authorNotes: "Katakana — アイウエオ (vogais). Foque no conceito central do conjunto e nos erros comuns."
example: "Katakana é usado para palavras estrangeiras. ア = 'a'"
pages:
  - pageNumber: 1
    title: Reconhecer vogais katakana
    description: Toque no som correto.
    exercises:
      - { type: kana_reading, question: "ア (a/i/u/e/o)", correctAnswer: a, rationale: "ア lê-se \"a\" (romaji)." }
      - { type: kana_reading, question: "イ (a/i/u/e/o)", correctAnswer: i, rationale: "イ lê-se \"i\" (romaji)." }
      - { type: kana_reading, question: "ウ (a/i/u/e/o)", correctAnswer: u, rationale: "ウ lê-se \"u\" (romaji)." }
      - { type: kana_reading, question: "エ (a/i/u/e/o)", correctAnswer: e, rationale: "エ lê-se \"e\" (romaji)." }
      - { type: kana_reading, question: "オ (a/i/u/e/o)", correctAnswer: o, rationale: "オ lê-se \"o\" (romaji)." }
      - { type: kana_reading, question: "オ (o/u/e/a/i)", correctAnswer: o, rationale: "オ lê-se \"o\" (romaji)." }
      - { type: kana_reading, question: "イ (u/e/i/o/a)", correctAnswer: i, rationale: "イ lê-se \"i\" (romaji)." }
      - { type: kana_reading, question: "エ (i/e/u/a/o)", correctAnswer: e, rationale: "エ lê-se \"e\" (romaji)." }
      - { type: kana_reading, question: "ア (i/u/o/a/e)", correctAnswer: a, rationale: "ア lê-se \"a\" (romaji)." }
      - { type: kana_reading, question: "ウ (i/e/o/a/u)", correctAnswer: u, rationale: "ウ lê-se \"u\" (romaji)." }
  - pageNumber: 2
    title: Hiragana vs Katakana
    description: Escolha o katakana correspondente ao hiragana.
    exercises:
      - { type: kana_writing, question: "あ (ア/イ/ウ/エ)", correctAnswer: "ア", rationale: "あ (hiragana) corresponde a ア em katakana — mesmo som, escrita diferente." }
      - { type: kana_writing, question: "い (イ/ア/オ/エ)", correctAnswer: "イ", rationale: "い (hiragana) corresponde a イ em katakana — mesmo som, escrita diferente." }
      - { type: kana_writing, question: "う (ウ/ア/オ/イ)", correctAnswer: "ウ", rationale: "う (hiragana) corresponde a ウ em katakana — mesmo som, escrita diferente." }
      - { type: kana_writing, question: "え (エ/ア/オ/イ)", correctAnswer: "エ", rationale: "え (hiragana) corresponde a エ em katakana — mesmo som, escrita diferente." }
      - { type: kana_writing, question: "お (オ/ア/ウ/エ)", correctAnswer: "オ", rationale: "お (hiragana) corresponde a オ em katakana — mesmo som, escrita diferente." }
      - { type: kana_writing, question: "o (オ/エ/ウ/ア)", correctAnswer: "オ", rationale: "O som \"o\" em katakana escreve-se オ." }
      - { type: kana_writing, question: "a (ア/オ/ウ/エ)", correctAnswer: "ア", rationale: "O som \"a\" em katakana escreve-se ア." }
      - { type: kana_writing, question: "e (エ/イ/ア/オ)", correctAnswer: "エ", rationale: "O som \"e\" em katakana escreve-se エ." }
      - { type: kana_writing, question: "i (イ/ア/ウ/エ)", correctAnswer: "イ", rationale: "O som \"i\" em katakana escreve-se イ." }
      - { type: kana_writing, question: "u (ウ/エ/ア/オ)", correctAnswer: "ウ", rationale: "O som \"u\" em katakana escreve-se ウ." }
target: 20
