      - { type: japanese_vocab, question: "タクシー (táxi/ônibus/trem/carro)", correctAnswer: "táxi" }
      - { type: japanese_vocab, question: "バイク (moto/bicicleta/carro/trem)", correctAnswer: "moto" }
      - { type: japanese_vocab, question: "ゲーム (jogo/música/filme/livro)", correctAnswer: "jogo" }
