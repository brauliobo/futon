title: Estrangeirismos — lugares no dia a dia
level: '2A'
subject: japanese
authorNotes: "Estrangeirismos — lugares no dia a dia. Foque no conceito central do conjunto e nos erros comuns."
example: "ホテル = hotel, レストラン = restaurante"
pages:
  - pageNumber: 1
    title: Lugares
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "ホテル (hotel/restaurante/hospital/escola)", correctAnswer: "hotel" }
      - { type: japanese_vocab, question: "レストラン (restaurante/lanchonete/cafeteria/bar)", correctAnswer: "restaurante" }
      - { type: japanese_vocab, question: "カフェ (café — o lugar/restaurante/bar/lanchonete)", correctAnswer: "café — o lugar" }
      - { type: japanese_vocab, question: "デパート (loja de departamento/mercado/padaria/farmácia)", correctAnswer: "loja de departamento" }
      - { type: japanese_vocab, question: "スーパー (supermercado/loja/mercado/padaria)", correctAnswer: "supermercado" }
      - { type: japanese_vocab, question: "コンビニ (loja de conveniência/supermercado/loja/mercado)", correctAnswer: "loja de conveniência" }
      - { type: japanese_vocab, question: "ビル (prédio/casa/apartamento/escola)", correctAnswer: "prédio" }
      - { type: japanese_vocab, question: "アパート (apartamento/casa/prédio/quarto)", correctAnswer: "apartamento" }
      - { type: japanese_vocab, question: "トイレ (banheiro/cozinha/sala/quarto)", correctAnswer: "banheiro" }
      - { type: japanese_vocab, question: "プール (piscina/praia/rio/lago)", correctAnswer: "piscina" }
