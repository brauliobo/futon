title: Estrangeirismos — comida & bebida
level: '2A'
subject: japanese
authorNotes: "Estrangeirismos — comida & bebida. Foque no conceito central do conjunto e nos erros comuns."
example: "Palavras emprestadas viram katakana: coffee → コーヒー"
pages:
  - pageNumber: 1
    title: Comidas estrangeiras
    description: Leia o katakana e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "コーヒー (café/chá/suco/água)", correctAnswer: "café" }
      - { type: japanese_vocab, question: "ジュース (suco/refrigerante/café/leite)", correctAnswer: "suco", rationale: "ジュース lê-se \"suco\" (romaji)." }
      - { type: japanese_vocab, question: "コーラ (refrigerante/suco/café/chá)", correctAnswer: "refrigerante" }
      - { type: japanese_vocab, question: "ビール (cerveja/vinho/refrigerante/água)", correctAnswer: "cerveja" }
      - { type: japanese_vocab, question: "ワイン (vinho/cerveja/suco/refrigerante)", correctAnswer: "vinho" }
      - { type: japanese_vocab, question: "パン (pão/arroz/macarrão/sopa)", correctAnswer: "pão" }
      - { type: japanese_vocab, question: "パスタ (macarrão/pão/arroz/pizza)", correctAnswer: "macarrão" }
      - { type: japanese_vocab, question: "ピザ (pizza/macarrão/pão/hambúrguer)", correctAnswer: "pizza" }
      - { type: japanese_vocab, question: "ハンバーガー (hambúrguer/pizza/macarrão/sanduíche)", correctAnswer: "hambúrguer" }
      - { type: japanese_vocab, question: "ケーキ (bolo/torta/biscoito/doce)", correctAnswer: "bolo", rationale: "ケーキ lê-se \"bolo\" (romaji)." }
  - pageNumber: 2
    title: Mais comidas
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "アイスクリーム (sorvete/bolo/doce/geleia)", correctAnswer: "sorvete" }
      - { type: japanese_vocab, question: "チョコレート (chocolate/bala/doce/biscoito)", correctAnswer: "chocolate" }
      - { type: japanese_vocab, question: "サラダ (salada/sopa/prato/sobremesa)", correctAnswer: "salada" }
      - { type: japanese_vocab, question: "スープ (sopa/salada/prato/sobremesa)", correctAnswer: "sopa", rationale: "スープ lê-se \"sopa\" (romaji)." }
      - { type: japanese_vocab, question: "チーズ (queijo/manteiga/leite/iogurte)", correctAnswer: "queijo" }
      - { type: japanese_vocab, question: "バター (manteiga/queijo/margarina/óleo)", correctAnswer: "manteiga" }
      - { type: japanese_vocab, question: "ヨーグルト (iogurte/leite/queijo/manteiga)", correctAnswer: "iogurte" }
      - { type: japanese_vocab, question: "ミルク (leite/iogurte/queijo/manteiga)", correctAnswer: "leite" }
      - { type: japanese_vocab, question: "オレンジジュース (suco de laranja/suco de maçã/suco de uva/água)", correctAnswer: "suco de laranja" }
      - { type: japanese_vocab, question: "ポテト (batata/cenoura/tomate/cebola)", correctAnswer: "batata" }
target: 20
