title: Katakana — タ行 + ナ行 + ハ行
level: '2A'
subject: japanese
authorNotes: "Katakana — タ行 + ナ行 + ハ行. Foque no conceito central do conjunto e nos erros comuns."
example: "タ→ta, ナ→na, ハ→ha"
