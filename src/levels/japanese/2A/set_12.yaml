title: Revisão final 2A — domínio de kana
level: '2A'
subject: japanese
authorNotes: "Revisão final 2A — domínio de kana. Foque no conceito central do conjunto e nos erros comuns."
example: "Parabéns! Você lê hiragana + katakana (~92 sílabas + ~400 palavras)."
pages:
  - pageNumber: 1
    title: Leitura avançada
    description: Leia e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "デパートで かいもの。 (Comprar na loja./Trabalhar na loja./Ver a loja./Fechar a loja.)", correctAnswer: "Comprar na loja." }
      - { type: japanese_vocab, question: "スーパーで やさいを かう。 (Comprar verdura no supermercado./Vender verdura./Plantar verdura./Cortar verdura.)", correctAnswer: "Comprar verdura no supermercado." }
      - { type: japanese_vocab, question: "タクシーで くうこうへ。 (De táxi ao aeroporto./De ônibus ao aeroporto./A pé ao aeroporto./De trem ao aeroporto.)", correctAnswer: "De táxi ao aeroporto." }
      - { type: japanese_vocab, question: "インターネットで しらべる。 (Pesquisar na internet./Ligar a internet./Desligar a internet./Pagar a internet.)", correctAnswer: "Pesquisar na internet." }
      - { type: japanese_vocab, question: "ビールと ピザ。 (Cerveja e pizza./Cerveja e massa./Vinho e pizza./Vinho e massa.)", correctAnswer: "Cerveja e pizza." }
      - { type: japanese_vocab, question: "アイスクリームを たべたい。 (Quero comer sorvete./Comprei sorvete./Vendi sorvete./Fiz sorvete.)", correctAnswer: "Quero comer sorvete." }
      - { type: japanese_vocab, question: "ブラジルから きました。 (Vim do Brasil./Vou para o Brasil./Moro no Brasil./Nasci no Brasil.)", correctAnswer: "Vim do Brasil." }
      - { type: japanese_vocab, question: "コンビニで おにぎり。 (Bolinho de arroz na conveniência./Em casa./No restaurante./Na escola.)", correctAnswer: "Bolinho de arroz na conveniência." }
      - { type: japanese_vocab, question: "ゲームが だいすき。 (Amo jogos./Odeio jogos./Vendo jogos./Compro jogos.)", correctAnswer: "Amo jogos." }
      - { type: japanese_vocab, question: "ホテルの へや。 (Quarto do hotel./Banheiro do hotel./Entrada do hotel./Saída do hotel.)", correctAnswer: "Quarto do hotel." }
  - pageNumber: 2
    title: Frases do cotidiano
    description: Leia e escolha.
    exercises:
      - { type: japanese_vocab, question: "すみません、コーヒー おねがいします。 (Por favor, um café./Eu faço café./Café é caro./Não quero café.)", correctAnswer: "Por favor, um café." }
      - { type: japanese_vocab, question: "すみません、トイレは どこですか。 (Onde fica o banheiro?/Onde fica a cozinha?/Onde fica a sala?/Onde fica a porta?)", correctAnswer: "Onde fica o banheiro?" }
      - { type: japanese_vocab, question: "この レストランは おいしい。 (Este restaurante é gostoso./Este restaurante é caro./Este restaurante é grande./Este restaurante é pequeno.)", correctAnswer: "Este restaurante é gostoso." }
      - { type: japanese_vocab, question: "パスタと サラダを おねがいします。 (Massa e salada, por favor./Sopa e salada./Massa e sopa./Pão e salada.)", correctAnswer: "Massa e salada, por favor." }
      - { type: japanese_vocab, question: "テレビを みながら たべる。 (Comer enquanto vê TV./Ver TV e depois comer./Só comer./Só ver TV.)", correctAnswer: "Comer enquanto vê TV." }
      - { type: japanese_vocab, question: "バスは じゅうじに きます。 (O ônibus chega às 10h./O ônibus saiu./Não tem ônibus./O ônibus está atrasado.)", correctAnswer: "O ônibus chega às 10h." }
      - { type: japanese_vocab, question: "スマホで メールを おくる。 (Enviar email pelo celular./Ligar pelo celular./Escrever no celular./Ver o celular.)", correctAnswer: "Enviar email pelo celular." }
      - { type: japanese_vocab, question: "ケーキを つくりたい。 (Quero fazer bolo./Comprei bolo./Comi bolo./Vi bolo.)", correctAnswer: "Quero fazer bolo." }
      - { type: japanese_vocab, question: "にほんの アニメが すき。 (Gosto de anime japonês./Odeio anime./Fiz anime./Vendi anime.)", correctAnswer: "Gosto de anime japonês." }
      - { type: japanese_vocab, question: "カードで はらう。 (Pagar com cartão./Pagar em dinheiro./Não pagar./Dar cartão.)", correctAnswer: "Pagar com cartão." }
