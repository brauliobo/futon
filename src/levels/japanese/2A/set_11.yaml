title: Leitura — hiragana + katakana
level: '2A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 2
authorNotes: "Leitura — hiragana + katakana. Foque no conceito central do conjunto e nos erros comuns."
example: "Frases reais misturam hiragana, katakana e às vezes kanji. Ex.: コーヒーを のみます。 → Bebo café.."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Ler frases misturadas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "コーヒーを のみます。 (Bebo café./Compro café./Faço café./Vejo café.)", correctAnswer: "Bebo café.", rationale: "A frase \"コーヒーを のみます。\" traduz-se como \"Bebo café.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "テレビを みます。 (Assisto TV./Compro TV./Conserto TV./Faço TV.)", correctAnswer: "Assisto TV.", rationale: "A frase \"テレビを みます。\" traduz-se como \"Assisto TV.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "バスで いきます。 (Vou de ônibus./Vou de trem./Vou de táxi./Vou a pé.)", correctAnswer: "Vou de ônibus.", rationale: "A frase \"バスで いきます。\" traduz-se como \"Vou de ônibus.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "レストランで たべます。 (Como no restaurante./Cozinho no restaurante./Trabalho no restaurante./Moro no restaurante.)", correctAnswer: "Como no restaurante.", rationale: "A frase \"レストランで たべます。\" traduz-se como \"Como no restaurante.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "パンと ジュース。 (Pão e suco./Pão e leite./Arroz e suco./Arroz e leite.)", correctAnswer: "Pão e suco.", rationale: "A frase \"パンと ジュース。\" traduz-se como \"Pão e suco.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "アメリカに いきたい。 (Quero ir aos EUA./Fui aos EUA./Vou aos EUA./Não quero ir aos EUA.)", correctAnswer: "Quero ir aos EUA.", rationale: "A frase \"アメリカに いきたい。\" traduz-se como \"Quero ir aos EUA.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ホテルに とまります。 (Me hospedo no hotel./Saio do hotel./Gosto do hotel./Construo hotel.)", correctAnswer: "Me hospedo no hotel.", rationale: "A frase \"ホテルに とまります。\" traduz-se como \"Me hospedo no hotel.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "パソコンを つかう。 (Usar o PC./Comprar o PC./Ver o PC./Desligar o PC.)", correctAnswer: "Usar o PC.", rationale: "A frase \"パソコンを つかう。\" traduz-se como \"Usar o PC.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "スポーツが すき。 (Gosto de esportes./Não gosto de esportes./Pratico esportes./Vejo esportes.)", correctAnswer: "Gosto de esportes.", rationale: "A frase \"スポーツが すき。\" traduz-se como \"Gosto de esportes.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "カフェで あう。 (Encontrar no café./Comer no café./Trabalhar no café./Morar no café.)", correctAnswer: "Encontrar no café.", rationale: "A frase \"カフェで あう。\" traduz-se como \"Encontrar no café.\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Identificar hiragana vs katakana
    description: A palavra é hiragana, katakana ou mista?
    exercises:
      - { type: japanese_vocab, question: "コーヒー (katakana/hiragana/mista/kanji)", correctAnswer: "katakana", rationale: "コーヒー (katakana) significa \"katakana\". Katakana é usado para palavras estrangeiras.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ともだち (hiragana/katakana/mista/kanji)", correctAnswer: "hiragana", rationale: "ともだち (hiragana) significa \"hiragana\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "パンを たべる (mista/katakana/hiragana/kanji)", correctAnswer: "mista", rationale: "A frase \"パンを たべる\" traduz-se como \"mista\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ブラジル (katakana/hiragana/mista/kanji)", correctAnswer: "katakana", rationale: "ブラジル (katakana) significa \"katakana\". Katakana é usado para palavras estrangeiras.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "がくせい (hiragana/katakana/mista/kanji)", correctAnswer: "hiragana", rationale: "がくせい (hiragana) significa \"hiragana\" em português.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "テレビが ある (mista/katakana/hiragana/kanji)", correctAnswer: "mista", rationale: "A frase \"テレビが ある\" traduz-se como \"mista\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "アイスクリーム (katakana/hiragana/mista/kanji)", correctAnswer: "katakana", rationale: "アイスクリーム (katakana) significa \"katakana\". Katakana é usado para palavras estrangeiras.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あめが ふる (hiragana/katakana/mista/kanji)", correctAnswer: "hiragana", rationale: "A frase \"あめが ふる\" traduz-se como \"hiragana\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "バスに のる (mista/katakana/hiragana/kanji)", correctAnswer: "mista", rationale: "A frase \"バスに のる\" traduz-se como \"mista\". Identifique partículas e palavras-chave.", objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ドイツ (katakana/hiragana/mista/kanji)", correctAnswer: "katakana", rationale: "ドイツ (katakana) significa \"katakana\". Katakana é usado para palavras estrangeiras.", objectives: [japanese.vocab] }
target: 20
