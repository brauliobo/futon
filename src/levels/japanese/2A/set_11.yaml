title: Leitura — hiragana + katakana
level: '2A'
subject: japanese
authorNotes: "Leitura — hiragana + katakana. Foque no conceito central do conjunto e nos erros comuns."
example: "Frases reais misturam hiragana, katakana e às vezes kanji."
pages:
  - pageNumber: 1
    title: Ler frases misturadas
    description: Leia e escolha a tradução.
    exercises:
      - { type: japanese_vocab, question: "コーヒーを のみます。 (Bebo café./Compro café./Faço café./Vejo café.)", correctAnswer: "Bebo café." }
      - { type: japanese_vocab, question: "テレビを みます。 (Assisto TV./Compro TV./Conserto TV./Faço TV.)", correctAnswer: "Assisto TV." }
      - { type: japanese_vocab, question: "バスで いきます。 (Vou de ônibus./Vou de trem./Vou de táxi./Vou a pé.)", correctAnswer: "Vou de ônibus." }
      - { type: japanese_vocab, question: "レストランで たべます。 (Como no restaurante./Cozinho no restaurante./Trabalho no restaurante./Moro no restaurante.)", correctAnswer: "Como no restaurante." }
      - { type: japanese_vocab, question: "パンと ジュース。 (Pão e suco./Pão e leite./Arroz e suco./Arroz e leite.)", correctAnswer: "Pão e suco." }
      - { type: japanese_vocab, question: "アメリカに いきたい。 (Quero ir aos EUA./Fui aos EUA./Vou aos EUA./Não quero ir aos EUA.)", correctAnswer: "Quero ir aos EUA." }
      - { type: japanese_vocab, question: "ホテルに とまります。 (Me hospedo no hotel./Saio do hotel./Gosto do hotel./Construo hotel.)", correctAnswer: "Me hospedo no hotel." }
      - { type: japanese_vocab, question: "パソコンを つかう。 (Usar o PC./Comprar o PC./Ver o PC./Desligar o PC.)", correctAnswer: "Usar o PC." }
      - { type: japanese_vocab, question: "スポーツが すき。 (Gosto de esportes./Não gosto de esportes./Pratico esportes./Vejo esportes.)", correctAnswer: "Gosto de esportes." }
      - { type: japanese_vocab, question: "カフェで あう。 (Encontrar no café./Comer no café./Trabalhar no café./Morar no café.)", correctAnswer: "Encontrar no café." }
  - pageNumber: 2
    title: Identificar hiragana vs katakana
    description: A palavra é hiragana, katakana ou mista?
    exercises:
      - { type: japanese_vocab, question: "コーヒー (katakana/hiragana/mista/kanji)", correctAnswer: "katakana" }
      - { type: japanese_vocab, question: "ともだち (hiragana/katakana/mista/kanji)", correctAnswer: "hiragana" }
      - { type: japanese_vocab, question: "パンを たべる (mista/katakana/hiragana/kanji)", correctAnswer: "mista" }
      - { type: japanese_vocab, question: "ブラジル (katakana/hiragana/mista/kanji)", correctAnswer: "katakana" }
      - { type: japanese_vocab, question: "がくせい (hiragana/katakana/mista/kanji)", correctAnswer: "hiragana" }
      - { type: japanese_vocab, question: "テレビが ある (mista/katakana/hiragana/kanji)", correctAnswer: "mista" }
      - { type: japanese_vocab, question: "アイスクリーム (katakana/hiragana/mista/kanji)", correctAnswer: "katakana" }
      - { type: japanese_vocab, question: "あめが ふる (hiragana/katakana/mista/kanji)", correctAnswer: "hiragana" }
      - { type: japanese_vocab, question: "バスに のる (mista/katakana/hiragana/kanji)", correctAnswer: "mista" }
      - { type: japanese_vocab, question: "ドイツ (katakana/hiragana/mista/kanji)", correctAnswer: "katakana" }
