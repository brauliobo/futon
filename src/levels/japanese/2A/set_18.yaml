title: 💬 Frases com ～です e ～ではありません
level: '2A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 3
authorNotes: "Padrão です (afirmativo) e ではありません (negativo). Primeiro contato com estrutura de frase japonesa."
example: "です = é / sou. ではありません = não é / não sou. Ex.: これは ほんです。→ Isto é um livro."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Frases afirmativas com です
    description: Leia a frase e escolha o significado correto.
    exercises:
      - { type: japanese_vocab, question: "これは ほんです。 (Isto é um livro./Isto é uma caneta./Isto é um caderno./Isto é uma borracha.)", correctAnswer: "Isto é um livro.", rationale: "これは → isto; ほん → livro; です → é. A frase significa 'Isto é um livro.'", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "わたしは がくせいです。 (Eu sou professor./Eu sou aluno./Eu sou médico./Eu sou cozinheiro.)", correctAnswer: "Eu sou aluno.", rationale: "わたしは → eu; がくせい → aluno; です → sou. A frase significa 'Eu sou aluno.'", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは コーヒーです。 (Isto é chá./Isto é leite./Isto é café./Isto é suco.)", correctAnswer: "Isto é café.", rationale: "これは → isto; コーヒー → café; です → é. A frase significa 'Isto é café.'", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あれは バスです。 (Aquilo é carro./Aquilo é trem./Aquilo é táxi./Aquilo é ônibus.)", correctAnswer: "Aquilo é ônibus.", rationale: "あれは → aquilo; バス → ônibus; です → é. A frase significa 'Aquilo é ônibus.'", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かれは せんせいです。 (Ele é aluno./Ele é médico./Ele é professor./Ele é engenheiro.)", correctAnswer: "Ele é professor.", rationale: "かれは → ele; せんせい → professor; です → é. A frase significa 'Ele é professor.'", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ここは トイレです。 (Aqui é a cozinha./Aqui é o banheiro./Aqui é a sala./Aqui é o quarto.)", correctAnswer: "Aqui é o banheiro.", rationale: "ここは → aqui; トイレ → banheiro; です → é. A frase significa 'Aqui é o banheiro.'", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは にほんごです。 (Isto é inglês./Isto é chinês./Isto é japonês./Isto é coreano.)", correctAnswer: "Isto é japonês.", rationale: "これは → isto; にほんご → japonês (língua); です → é.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "わたしは ブラジルじんです。 (Eu sou japonês./Eu sou americano./Eu sou brasileiro./Eu sou chinês.)", correctAnswer: "Eu sou brasileiro.", rationale: "わたしは → eu; ブラジルじん → brasileiro; です → sou.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは スマホです。 (Isto é computador./Isto é tablet./Isto é celular./Isto é câmera.)", correctAnswer: "Isto é celular.", rationale: "これは → isto; スマホ → celular; です → é.", difficulty: 2, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あのひとは かんごしです。 (Aquela pessoa é professora./Aquela pessoa é médica./Aquela pessoa é enfermeira./Aquela pessoa é dentista.)", correctAnswer: "Aquela pessoa é enfermeira.", rationale: "あのひとは → aquela pessoa; かんごし → enfermeiro(a); です → é.", difficulty: 2, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Frases negativas com ではありません
    description: Leia a frase negativa e escolha o significado.
    exercises:
      - { type: japanese_vocab, question: "これは ほんでは ありません。 (Isto é um livro./Isto não é um livro./Isto é um caderno./Isto não é um caderno.)", correctAnswer: "Isto não é um livro.", rationale: "ではありません → não é. A frase significa 'Isto não é um livro.'", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "わたしは せんせいでは ありません。 (Eu sou professor./Eu não sou professor./Eu sou médico./Eu não sou médico.)", correctAnswer: "Eu não sou professor.", rationale: "わたしは → eu; せんせい → professor; ではありません → não sou.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは コーラでは ありません。 (Isto é refrigerante./Isto é suco./Isto não é refrigerante./Isto não é suco.)", correctAnswer: "Isto não é refrigerante.", rationale: "コーラ → refrigerante (cola); ではありません → não é.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あれは タクシーでは ありません。 (Aquilo é táxi./Aquilo não é táxi./Aquilo é ônibus./Aquilo não é ônibus.)", correctAnswer: "Aquilo não é táxi.", rationale: "あれは → aquilo; タクシー → táxi; ではありません → não é.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "かれは がくせいでは ありません。 (Ele é aluno./Ele não é aluno./Ele é professor./Ele não é professor.)", correctAnswer: "Ele não é aluno.", rationale: "かれは → ele; がくせい → aluno; ではありません → não é.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは にほんごでは ありません。 (Isto é japonês./Isto não é japonês./Isto é chinês./Isto não é chinês.)", correctAnswer: "Isto não é japonês.", rationale: "にほんご → japonês (língua); ではありません → não é.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "ここは レストランでは ありません。 (Aqui é restaurante./Aqui não é restaurante./Aqui é café./Aqui não é café.)", correctAnswer: "Aqui não é restaurante.", rationale: "ここは → aqui; レストラン → restaurante; ではありません → não é.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "わたしは にほんじんでは ありません。 (Eu sou japonês./Eu não sou japonês./Eu sou coreano./Eu não sou coreano.)", correctAnswer: "Eu não sou japonês.", rationale: "わたしは → eu; にほんじん → japonês (pessoa); ではありません → não sou.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "あのひとは いしゃでは ありません。 (Aquela pessoa é médica./Aquela pessoa não é médica./Aquela pessoa é enfermeira./Aquela pessoa não é enfermeira.)", correctAnswer: "Aquela pessoa não é médica.", rationale: "あのひとは → aquela pessoa; いしゃ → médico; ではありません → não é.", difficulty: 3, objectives: [japanese.vocab] }
      - { type: japanese_vocab, question: "これは スマホでは ありません。 (Isto é celular./Isto não é celular./Isto é tablet./Isto não é tablet.)", correctAnswer: "Isto não é celular.", rationale: "スマホ → celular; ではありません → não é.", difficulty: 3, objectives: [japanese.vocab] }
target: 20
