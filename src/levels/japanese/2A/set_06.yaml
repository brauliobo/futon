title: Revisão katakana — 46 sílabas
level: '2A'
subject: japanese
objectives: [japanese.vocab]
difficulty: 1
authorNotes: "Revisão katakana — 46 sílabas. Foque no conceito central do conjunto e nos erros comuns."
example: "ー é o traço de vogal longa: コーヒー = 'kōhī'"
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Do som ao katakana
    description: Veja o som e escolha o katakana.
    exercises:
      - { type: kana_writing, question: "ka (ケ/カ/キ/ク)", correctAnswer: "カ", rationale: "O som \"ka\" em katakana escreve-se カ.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "su (セ/ス/サ/ソ)", correctAnswer: "ス", rationale: "O som \"su\" em katakana escreve-se ス.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "chi (タ/チ/ツ/テ)", correctAnswer: "チ", rationale: "O som \"chi\" em katakana escreve-se チ.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "ne (ネ/ヌ/ノ/ナ)", correctAnswer: "ネ", rationale: "O som \"ne\" em katakana escreve-se ネ.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "fu (フ/ハ/ヒ/ホ)", correctAnswer: "フ", rationale: "O som \"fu\" em katakana escreve-se フ.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "mu (マ/ミ/メ/ム)", correctAnswer: "ム", rationale: "O som \"mu\" em katakana escreve-se ム.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "yo (ヤ/ワ/ヨ/ユ)", correctAnswer: "ヨ", rationale: "O som \"yo\" em katakana escreve-se ヨ.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "ri (リ/レ/ル/ラ)", correctAnswer: "リ", rationale: "O som \"ri\" em katakana escreve-se リ.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "n (ツ/ン/ソ/シ)", correctAnswer: "ン", rationale: "O som \"n\" em katakana escreve-se ン.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "wa (ヲ/ン/ワ/ヤ)", correctAnswer: "ワ", rationale: "O som \"wa\" em katakana escreve-se ワ.", difficulty: 1, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Hiragana ↔ Katakana
    description: Escolha o katakana correspondente ao hiragana.
    exercises:
      - { type: kana_writing, question: "か (カ/ク/キ/ケ)", correctAnswer: "カ", rationale: "か (hiragana) corresponde a カ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "し (ツ/ソ/シ/ン)", correctAnswer: "シ", rationale: "し (hiragana) corresponde a シ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "て (タ/テ/ツ/ト)", correctAnswer: "テ", rationale: "て (hiragana) corresponde a テ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "は (ハ/ヒ/フ/ホ)", correctAnswer: "ハ", rationale: "は (hiragana) corresponde a ハ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "め (ミ/ム/メ/マ)", correctAnswer: "メ", rationale: "め (hiragana) corresponde a メ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "る (ル/リ/ラ/レ)", correctAnswer: "ル", rationale: "る (hiragana) corresponde a ル em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "よ (ヤ/ワ/ユ/ヨ)", correctAnswer: "ヨ", rationale: "よ (hiragana) corresponde a ヨ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "ぶ (ベ/ブ/バ/ビ)", correctAnswer: "ブ", rationale: "ぶ (hiragana) corresponde a ブ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "じ (ザ/ゼ/ズ/ジ)", correctAnswer: "ジ", rationale: "じ (hiragana) corresponde a ジ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "ぽ (ピ/プ/ポ/パ)", correctAnswer: "ポ", rationale: "ぽ (hiragana) corresponde a ポ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
