title: Revisão katakana — 46 sílabas
level: '2A'
subject: japanese
authorNotes: "Revisão katakana — 46 sílabas. Foque no conceito central do conjunto e nos erros comuns."
example: "ー é o traço de vogal longa: コーヒー = 'kōhī'"
pages:
  - pageNumber: 1
    title: Do som ao katakana
    description: Veja o som e escolha o katakana.
    exercises:
      - { type: kana_writing, question: "ka (カ/キ/ク/ケ)", correctAnswer: "カ" }
      - { type: kana_writing, question: "su (ス/セ/ソ/サ)", correctAnswer: "ス" }
      - { type: kana_writing, question: "chi (チ/ツ/テ/タ)", correctAnswer: "チ" }
      - { type: kana_writing, question: "ne (ネ/ナ/ヌ/ノ)", correctAnswer: "ネ" }
      - { type: kana_writing, question: "fu (フ/ホ/ハ/ヒ)", correctAnswer: "フ" }
      - { type: kana_writing, question: "mu (ム/マ/ミ/メ)", correctAnswer: "ム" }
      - { type: kana_writing, question: "yo (ヨ/ヤ/ユ/ワ)", correctAnswer: "ヨ" }
      - { type: kana_writing, question: "ri (リ/ラ/ル/レ)", correctAnswer: "リ" }
      - { type: kana_writing, question: "n (ン/ソ/シ/ツ)", correctAnswer: "ン" }
      - { type: kana_writing, question: "wa (ワ/ヲ/ヤ/ン)", correctAnswer: "ワ" }
  - pageNumber: 2
    title: Hiragana ↔ Katakana
    description: Escolha o katakana correspondente ao hiragana.
    exercises:
      - { type: kana_writing, question: "か (カ/キ/ク/ケ)", correctAnswer: "カ" }
      - { type: kana_writing, question: "し (シ/ソ/ツ/ン)", correctAnswer: "シ" }
      - { type: kana_writing, question: "て (テ/タ/ト/ツ)", correctAnswer: "テ" }
      - { type: kana_writing, question: "は (ハ/ヒ/フ/ホ)", correctAnswer: "ハ" }
      - { type: kana_writing, question: "め (メ/マ/ミ/ム)", correctAnswer: "メ" }
      - { type: kana_writing, question: "る (ル/ラ/リ/レ)", correctAnswer: "ル" }
      - { type: kana_writing, question: "よ (ヨ/ヤ/ユ/ワ)", correctAnswer: "ヨ" }
      - { type: kana_writing, question: "ぶ (ブ/バ/ビ/ベ)", correctAnswer: "ブ" }
      - { type: kana_writing, question: "じ (ジ/ズ/ザ/ゼ)", correctAnswer: "ジ" }
      - { type: kana_writing, question: "ぽ (ポ/パ/ピ/プ)", correctAnswer: "ポ" }
target: 20
