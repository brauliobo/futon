      - { type: kana_writing, question: "n (ン/ソ/シ/ツ)", correctAnswer: "ン", rationale: "O som \"n\" em katakana escreve-se ン.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "wa (ワ/ヲ/ヤ/ン)", correctAnswer: "ワ", rationale: "O som \"wa\" em katakana escreve-se ワ.", difficulty: 1, objectives: [japanese.vocab] }
  - pageNumber: 2
    title: Hiragana ↔ Katakana
    description: Escolha o katakana correspondente ao hiragana.
    exercises:
      - { type: kana_writing, question: "か (カ/キ/ク/ケ)", correctAnswer: "カ", rationale: "か (hiragana) corresponde a カ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "し (シ/ソ/ツ/ン)", correctAnswer: "シ", rationale: "し (hiragana) corresponde a シ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
