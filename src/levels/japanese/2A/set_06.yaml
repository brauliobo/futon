      - { type: kana_writing, question: "る (ル/ラ/リ/レ)", correctAnswer: "ル", rationale: "る (hiragana) corresponde a ル em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "よ (ヨ/ヤ/ユ/ワ)", correctAnswer: "ヨ", rationale: "よ (hiragana) corresponde a ヨ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "ぶ (ブ/バ/ビ/ベ)", correctAnswer: "ブ", rationale: "ぶ (hiragana) corresponde a ブ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
      - { type: kana_writing, question: "じ (ジ/ズ/ザ/ゼ)", correctAnswer: "ジ", rationale: "じ (hiragana) corresponde a ジ em katakana — mesmo som, escrita diferente.", difficulty: 1, objectives: [japanese.vocab] }
