title: Frações com Denominadores Diferentes
level: E
example: "Transforme e some: 1/2 + 1/4 = 2/4 + 1/4 = 3/4"
subject: math
difficulty: 3
objectives:
  - math.fractions.add_sub
authorNotes: Conjunto de math/E.
pages:
  - pageNumber: 1
    title: Frações Equivalentes (1/2)
    description: Reconheça frações que valem 1/2.
    exercises:
      - type: fraction
        question: 1/2 = ?/4
        correctAnswer: 2
        rationale: "Opere frações pela regra do denominador comum."
      - type: fraction
        question: 1/2 = ?/6
        correctAnswer: 3
        rationale: "Opere frações pela regra do denominador comum."
      - type: fraction
        question: 1/2 = ?/8
        correctAnswer: 4
        rationale: "Opere frações pela regra do denominador comum."
      - type: fraction
        question: 1/2 = ?/10
        correctAnswer: 5
        rationale: "Lembre: 2/4 = 1/2 após simplificar."
      - type: fraction
        question: 2/4 = ?/2
        correctAnswer: 1
        rationale: "Fração imprópria pode virar número misto depois."
      - type: fraction
        question: 3/6 = ?/2
        correctAnswer: 1
        rationale: "Confira: numerador final corresponde à operação pedida?"
      - type: fraction
        question: 4/8 = ?/2
        correctAnswer: 1
        rationale: "Soma de frações com mesmo denominador é direta."
      - type: fraction
        question: 1/3 = ?/6
        correctAnswer: 2
        rationale: "Subtração: diferença entre numeradores sobre o denominador comum."
      - type: fraction
        question: 1/3 = ?/9
        correctAnswer: 3
        rationale: "Resultado pode ainda ser simplificado por fator comum."
      - type: fraction
        question: 2/3 = ?/6
        correctAnswer: 4
        rationale: "Evite errar denominador — ele NÃO muda aqui."
  - pageNumber: 2
    title: Somando Denominadores Diferentes (simples)
    description: Transforme e some.
    exercises:
      - type: fraction_add
        question: 1/2 + 1/4 =
        correctAnswer: 3/4
        rationale: "Some numeradores com denominadores iguais."
      - type: fraction_add
        question: 1/2 + 1/6 =
        correctAnswer: 4/6
        rationale: "Some numeradores com denominadores iguais."
      - type: fraction_add
        question: 1/2 + 2/4 =
        correctAnswer: 4/4
        rationale: "Some numeradores com denominadores iguais."
      - type: fraction_add
        question: 1/4 + 1/2 =
        correctAnswer: 3/4
        rationale: "Resultado pode ainda ser simplificado por fator comum."
      - type: fraction_add
        question: 1/3 + 1/6 =
        correctAnswer: 3/6
        rationale: "Evite errar denominador — ele NÃO muda aqui."
      - type: fraction_add
        question: 2/3 + 1/6 =
        correctAnswer: 5/6
        rationale: "Releia: o denominador comum permanece intocado."
      - type: fraction_add
        question: 1/2 + 3/6 =
        correctAnswer: 6/6
        rationale: "Denominadores iguais: some numeradores, mantenha denominador."
      - type: fraction_add
        question: 1/4 + 3/8 =
        correctAnswer: 5/8
        rationale: "Denominadores iguais: subtraia numeradores, mantenha denominador."
      - type: fraction_add
        question: 2/4 + 1/8 =
        correctAnswer: 5/8
        rationale: "Verifique se pode simplificar (MDC entre numerador e denominador)."
      - type: fraction_add
        question: 1/3 + 2/6 =
        correctAnswer: 4/6
        rationale: "Se o numerador >= denominador, é fração imprópria — reduza se pedido."
  - pageNumber: 3
    title: Subtraindo Denominadores Diferentes
    description: Transforme e subtraia.
    exercises:
      - type: fraction_sub
        question: 1/2 - 1/4 =
        correctAnswer: 1/4
        rationale: "Subtraia numeradores com denominadores iguais."
      - type: fraction_sub
        question: 3/4 - 1/2 =
        correctAnswer: 1/4
        rationale: "Subtraia numeradores com denominadores iguais."
      - type: fraction_sub
        question: 1/2 - 1/6 =
        correctAnswer: 2/6
        rationale: "Subtraia numeradores com denominadores iguais."
      - type: fraction_sub
        question: 5/6 - 1/2 =
        correctAnswer: 2/6
        rationale: "Lembre: 2/4 = 1/2 após simplificar."
      - type: fraction_sub
        question: 2/3 - 1/6 =
        correctAnswer: 3/6
        rationale: "Fração imprópria pode virar número misto depois."
      - type: fraction_sub
        question: 5/6 - 1/3 =
        correctAnswer: 3/6
        rationale: "Confira: numerador final corresponde à operação pedida?"
      - type: fraction_sub
        question: 3/4 - 1/8 =
        correctAnswer: 5/8
        rationale: "Soma de frações com mesmo denominador é direta."
      - type: fraction_sub
        question: 5/8 - 1/4 =
        correctAnswer: 3/8
        rationale: "Subtração: diferença entre numeradores sobre o denominador comum."
      - type: fraction_sub
        question: 2/3 - 2/6 =
        correctAnswer: 2/6
        rationale: "Resultado pode ainda ser simplificado por fator comum."
      - type: fraction_sub
        question: 3/6 - 1/3 =
        correctAnswer: 1/6
        rationale: "Evite errar denominador — ele NÃO muda aqui."
target: 30
