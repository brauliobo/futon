title: Frações com Denominadores Diferentes
level: E
example: "Transforme e some: 1/2 + 1/4 = 2/4 + 1/4 = 3/4"
subject: math
pages:
  - pageNumber: 1
    title: Frações Equivalentes (1/2)
    description: Reconheça frações que valem 1/2.
    exercises:
      - { type: fraction, question: "1/2 = ?/4", correctAnswer: 2 }
      - { type: fraction, question: "1/2 = ?/6", correctAnswer: 3 }
      - { type: fraction, question: "1/2 = ?/8", correctAnswer: 4 }
      - { type: fraction, question: "1/2 = ?/10", correctAnswer: 5 }
      - { type: fraction, question: "2/4 = ?/2", correctAnswer: 1 }
      - { type: fraction, question: "3/6 = ?/2", correctAnswer: 1 }
      - { type: fraction, question: "4/8 = ?/2", correctAnswer: 1 }
      - { type: fraction, question: "1/3 = ?/6", correctAnswer: 2 }
      - { type: fraction, question: "1/3 = ?/9", correctAnswer: 3 }
      - { type: fraction, question: "2/3 = ?/6", correctAnswer: 4 }
  - pageNumber: 2
    title: Somando Denominadores Diferentes (simples)
    description: Transforme e some.
    exercises:
      - { type: fraction_add, question: "1/2 + 1/4 =", correctAnswer: "3/4" }
      - { type: fraction_add, question: "1/2 + 1/6 =", correctAnswer: "4/6" }
      - { type: fraction_add, question: "1/2 + 2/4 =", correctAnswer: "4/4" }
      - { type: fraction_add, question: "1/4 + 1/2 =", correctAnswer: "3/4" }
      - { type: fraction_add, question: "1/3 + 1/6 =", correctAnswer: "3/6" }
      - { type: fraction_add, question: "2/3 + 1/6 =", correctAnswer: "5/6" }
      - { type: fraction_add, question: "1/2 + 3/6 =", correctAnswer: "6/6" }
      - { type: fraction_add, question: "1/4 + 3/8 =", correctAnswer: "5/8" }
      - { type: fraction_add, question: "2/4 + 1/8 =", correctAnswer: "5/8" }
      - { type: fraction_add, question: "1/3 + 2/6 =", correctAnswer: "4/6" }
  - pageNumber: 3
    title: Subtraindo Denominadores Diferentes
    description: Transforme e subtraia.
    exercises:
      - { type: fraction_sub, question: "1/2 - 1/4 =", correctAnswer: "1/4" }
      - { type: fraction_sub, question: "3/4 - 1/2 =", correctAnswer: "1/4" }
      - { type: fraction_sub, question: "1/2 - 1/6 =", correctAnswer: "2/6" }
      - { type: fraction_sub, question: "5/6 - 1/2 =", correctAnswer: "2/6" }
      - { type: fraction_sub, question: "2/3 - 1/6 =", correctAnswer: "3/6" }
      - { type: fraction_sub, question: "5/6 - 1/3 =", correctAnswer: "3/6" }
      - { type: fraction_sub, question: "3/4 - 1/8 =", correctAnswer: "5/8" }
      - { type: fraction_sub, question: "5/8 - 1/4 =", correctAnswer: "3/8" }
      - { type: fraction_sub, question: "2/3 - 2/6 =", correctAnswer: "2/6" }
      - { type: fraction_sub, question: "3/6 - 1/3 =", correctAnswer: "1/6" }
target: 30
