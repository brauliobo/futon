        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_sub
        question: 2/4 - 2/4 =
        correctAnswer: 0/4
        rationale: "Resultado pode ainda ser simplificado por fator comum."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_sub
        question: 1/4 - 1/4 =
        correctAnswer: 0/4
        rationale: "Evite errar denominador — ele NÃO muda aqui."
        difficulty: 2
        objectives: [math.fractions.add_sub]
