title: Frações Subtração — Mesmo Denominador
level: E
example: "Subtraia frações mantendo o denominador. Ex.: 3/4 - 1/4 = 2/4"
subject: math
difficulty: 3
objectives:
  - math.fractions.add_sub
authorNotes: Conjunto de math/E.
