title: Frações Adição — Mesmo Denominador
level: E
example: "Adicione frações com denominadores iguais. Ex.: 1/4 + 2/4 = 3/4"
subject: math
difficulty: 3
objectives:
  - math.fractions.add_sub
authorNotes: Conjunto de math/E.
pages:
  - pageNumber: 1
    title: Denominador 4
    description: Some as frações mantendo o denominador.
    exercises:
      - type: fraction_add
        question: 1/4 + 1/4 =
        correctAnswer: 2/4
        rationale: "Some numeradores com denominadores iguais."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 1/4 + 2/4 =
        correctAnswer: 3/4
        rationale: "Some numeradores com denominadores iguais."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 2/4 + 1/4 =
        correctAnswer: 3/4
        rationale: "Some numeradores com denominadores iguais."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 3/4 + 1/4 =
        correctAnswer: 4/4
        rationale: "Resultado pode ainda ser simplificado por fator comum."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 2/4 + 2/4 =
        correctAnswer: 4/4
        rationale: "Evite errar denominador — ele NÃO muda aqui."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 1/4 + 3/4 =
        correctAnswer: 4/4
        rationale: "Releia: o denominador comum permanece intocado."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 2/4 + 3/4 =
        correctAnswer: 5/4
        rationale: "Denominadores iguais: some numeradores, mantenha denominador."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 3/4 + 2/4 =
        correctAnswer: 5/4
        rationale: "Denominadores iguais: subtraia numeradores, mantenha denominador."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 3/4 + 3/4 =
        correctAnswer: 6/4
        rationale: "Verifique se pode simplificar (MDC entre numerador e denominador)."
        difficulty: 2
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 4/4 + 1/4 =
        correctAnswer: 5/4
        rationale: "Se o numerador >= denominador, é fração imprópria — reduza se pedido."
        difficulty: 2
        objectives: [math.fractions.add_sub]
  - pageNumber: 2
    title: Denominador 5
    description: Some mantendo o denominador.
    exercises:
      - type: fraction_add
        question: 1/5 + 1/5 =
        correctAnswer: 2/5
        rationale: "Ex.: 3/5 + 1/5 = 4/5 — só soma de numeradores."
        difficulty: 3
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 1/5 + 2/5 =
        correctAnswer: 3/5
        rationale: "Mantenha o denominador; a soma muda só o numerador."
        difficulty: 3
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 2/5 + 2/5 =
        correctAnswer: 4/5
        rationale: "Lembre: 2/4 = 1/2 após simplificar."
        difficulty: 3
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 2/5 + 3/5 =
        correctAnswer: 5/5
        rationale: "Fração imprópria pode virar número misto depois."
        difficulty: 3
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 3/5 + 2/5 =
        correctAnswer: 5/5
        rationale: "Confira: numerador final corresponde à operação pedida?"
        difficulty: 3
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 1/5 + 4/5 =
        correctAnswer: 5/5
        rationale: "Soma de frações com mesmo denominador é direta."
        difficulty: 3
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 3/5 + 3/5 =
        correctAnswer: 6/5
        rationale: "Subtração: diferença entre numeradores sobre o denominador comum."
        difficulty: 3
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 4/5 + 2/5 =
        correctAnswer: 6/5
        rationale: "Resultado pode ainda ser simplificado por fator comum."
        difficulty: 3
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 3/5 + 4/5 =
        correctAnswer: 7/5
        rationale: "Evite errar denominador — ele NÃO muda aqui."
        difficulty: 3
        objectives: [math.fractions.add_sub]
      - type: fraction_add
        question: 4/5 + 4/5 =
        correctAnswer: 8/5
        rationale: "Releia: o denominador comum permanece intocado."
        difficulty: 3
        objectives: [math.fractions.add_sub]
