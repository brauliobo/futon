title: Quadráticas • Expoentes • Radicais — Conjunto 17
level: I
example: "Resolva equações quadráticas e simplifique expressões com expoentes.
  Ex.: x² = 16, x = ±4"
subject: math
difficulty: 4
objectives:
  - math.quadratics_exponents
authorNotes: Quadráticas, expoentes e radicais. Identifique forma antes de
  escolher método (fatoração, Bhaskara).
inputType: text
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Quadráticas • Expoentes • Radicais — Conjunto 17 — prática 1
    description: Resolva equações quadráticas e simplifique expressões com expoentes
      e radicais.
    exercises:
      - type: quadratic
        question: 2x² + 8x + 0 = 0
        correctAnswer: x = 0 ou x = -4
        rationale: "Bhaskara: Δ = 8² − 4·2·0 = 64. x = (−8 ± √64)/(2·2)."
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: quadratic
        question: (x - 8)(x - -3) = 0
        correctAnswer: x = 8 ou x = -3
        rationale: (x−8)(x−-3)=0 → x = 8 ou x = -3 (raízes diretas).
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: quadratic
        question: 5x² + 10x + 0 = 0
        correctAnswer: x = 0 ou x = -2
        rationale: "Bhaskara: Δ = 10² − 4·5·0 = 100. x = (−10 ± √100)/(2·5)."
        difficulty: 3
        objectives:
