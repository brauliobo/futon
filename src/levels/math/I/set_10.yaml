pages:
  - pageNumber: 1
    title: Quadráticas • Expoentes • Radicais — Conjunto 10 – Página 1
    description: Resolva equações quadráticas variadas.
    exercises:
      - type: quadratic
        question: (x - 3)(x - -8) = 0
        correctAnswer: x = 3 ou x = -8
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: (x - 6)(x - -9) = 0
        correctAnswer: x = 6 ou x = -9
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: (x - 0)(x - -9) = 0
        correctAnswer: x = 0 ou x = -9
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: 1x² + -9x + -10 = 0
        correctAnswer: x = 10 ou x = -1
        rationale: "Estude o sinal: acima/abaixo de zero conforme a raiz."
      - type: quadratic
        question: (x - -1)(x - 0) = 0
        correctAnswer: x = -1 ou x = 0
        rationale: "Represente a solução em notação de intervalo."
      - type: quadratic
        question: 3x² + -9x + 0 = 0
        correctAnswer: x = 3 ou x = 0
        rationale: "Inequação-produto: analise sinal de cada fator."
      - type: quadratic
        question: x² = 49
        correctAnswer: x = ±7
        rationale: "Se a > 0, função cresce; se a < 0, decresce."
      - type: quadratic
        question: x² = 81
        correctAnswer: x = ±9
        rationale: "Solução de ax + b > 0 depende do sinal de a."
      - type: quadratic
        question: (x - -8)(x - -7) = 0
        correctAnswer: x = -8 ou x = -7
        rationale: "Verifique a solução testando um valor do intervalo."
      - type: quadratic
        question: (x - -2)(x - -6) = 0
        correctAnswer: x = -2 ou x = -6
        rationale: "União/interseção de intervalos conforme o conectivo lógico."
