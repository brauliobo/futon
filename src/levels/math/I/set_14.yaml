title: Quadráticas • Expoentes • Radicais — Conjunto 14
level: I
example: "Resolva equações quadráticas e simplifique expressões com expoentes.
  Ex.: x² = 16, x = ±4"
subject: math
difficulty: 4
objectives:
  - math.quadratics_exponents
authorNotes: Quadráticas, expoentes e radicais. Identifique forma antes de
  escolher método (fatoração, Bhaskara).
inputType: text
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Quadráticas • Expoentes • Radicais — Conjunto 14 — prática 1
    description: Resolva equações quadráticas e simplifique expressões com expoentes
      e radicais.
    exercises:
      - type: quadratic
        question: x² = 4 (raiz positiva)
        correctAnswer: x = 2
        rationale: "x² = 4 → x = ±√4 = ±2; raiz positiva = 2."
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: radical
        question: √9
        correctAnswer: 3
        rationale: √9 = 3 pois 3² = 9.
        difficulty: 3
        objectives:
          - math.quadratics_exponents
