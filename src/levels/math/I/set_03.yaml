pages:
  - pageNumber: 1
    title: Quadráticas • Expoentes • Radicais — Conjunto 3 – Página 1
    description: Resolva equações quadráticas simples.
    exercises:
      - type: quadratic
        question: (x - -9)(x - 1) = 0
        correctAnswer: x = -9 ou x = 1
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 3
        objectives: [math.quadratics_exponents]
      - type: quadratic
        question: (x - -5)(x - -6) = 0
        correctAnswer: x = -5 ou x = -6
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 3
        objectives: [math.quadratics_exponents]
      - type: quadratic
        question: (x - -7)(x - 1) = 0
        correctAnswer: x = -7 ou x = 1
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 3
        objectives: [math.quadratics_exponents]
      - type: quadratic
        question: (x - -6)(x - 3) = 0
        correctAnswer: x = -6 ou x = 3
        rationale: "Estude o sinal: acima/abaixo de zero conforme a raiz."
        difficulty: 3
        objectives: [math.quadratics_exponents]
      - type: quadratic
        question: (x - -3)(x - 9) = 0
        correctAnswer: x = -3 ou x = 9
        rationale: "Represente a solução em notação de intervalo."
        difficulty: 3
        objectives: [math.quadratics_exponents]
      - type: quadratic
        question: (x - -2)(x - -1) = 0
        correctAnswer: x = -2 ou x = -1
        rationale: "Inequação-produto: analise sinal de cada fator."
        difficulty: 3
        objectives: [math.quadratics_exponents]
      - type: quadratic
        question: (x - -10)(x - -5) = 0
        correctAnswer: x = -10 ou x = -5
        rationale: "Se a > 0, função cresce; se a < 0, decresce."
        difficulty: 3
        objectives: [math.quadratics_exponents]
      - type: quadratic
        question: (x - 0)(x - -5) = 0
        correctAnswer: x = 0 ou x = -5
        rationale: "Solução de ax + b > 0 depende do sinal de a."
        difficulty: 3
        objectives: [math.quadratics_exponents]
      - type: quadratic
        question: (x - 1)(x - -2) = 0
        correctAnswer: x = 1 ou x = -2
        rationale: "Verifique a solução testando um valor do intervalo."
        difficulty: 3
        objectives: [math.quadratics_exponents]
      - type: quadratic
