title: Quadráticas • Expoentes • Radicais — Conjunto 18
level: I
example: "Resolva equações quadráticas e simplifique expressões com expoentes.
  Ex.: x² = 16, x = ±4"
subject: math
difficulty: 4
objectives:
  - math.quadratics_exponents
authorNotes: Quadráticas, expoentes e radicais. Identifique forma antes de
  escolher método (fatoração, Bhaskara).
inputType: text
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 15
pages:
  - pageNumber: 1
    title: Quadráticas • Expoentes • Radicais — Conjunto 18 — prática 1
    description: Resolva equações quadráticas e simplifique expressões com expoentes
      e radicais.
    exercises:
      - type: quadratic
        question: 1x² + 9x + 8 = 0
        correctAnswer: x = -1 ou x = -8
        rationale: "Bhaskara: Δ = 9² − 4·1·8 = 49. x = (−9 ± √49)/(2·1)."
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: quadratic
        question: 1x² + -3x + 2 = 0
        correctAnswer: x = 2 ou x = 1
        rationale: "Bhaskara: Δ = -3² − 4·1·2 = 1. x = (−-3 ± √1)/(2·1)."
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: quadratic
        question: (x - -5)(x - -2) = 0
        correctAnswer: x = -5 ou x = -2
        rationale: (x−-5)(x−-2)=0 → x = -5 ou x = -2 (raízes diretas).
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: exponent
        question: x^3 = 1000
        correctAnswer: 10
        rationale: Raiz cúbica — qual número elevado ao cubo dá k?
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: quadratic
        question: (x - 4)(x - 5) = 0
        correctAnswer: x = 4 ou x = 5
        rationale: (x−4)(x−5)=0 → x = 4 ou x = 5 (raízes diretas).
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: quadratic
        question: (x - -4)(x - 5) = 0
        correctAnswer: x = -4 ou x = 5
        rationale: (x−-4)(x−5)=0 → x = -4 ou x = 5 (raízes diretas).
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: quadratic
        question: 1x² + 3x + -4 = 0
        correctAnswer: x = 1 ou x = -4
        rationale: "Bhaskara: Δ = 3² − 4·1·-4 = 25. x = (−3 ± √25)/(2·1)."
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: quadratic
        question: x² = 1 (raiz negativa)
        correctAnswer: x = -1
        rationale: "x² = 1 → x = ±√1 = ±1; raiz negativa = -1."
        difficulty: 3
        objectives:
          - math.quadratics_exponents
      - type: quadratic
        question: (x - -8)(x - 8) = 0
        correctAnswer: x = -8 ou x = 8
        rationale: (x−-8)(x−8)=0 → x = -8 ou x = 8 (raízes diretas).
        difficulty: 3
        objectives:
