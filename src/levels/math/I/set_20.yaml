title: Quadráticas • Expoentes • Radicais — Conjunto 20
level: I
example: "Resolva equações quadráticas e simplifique expressões com expoentes. Ex.: x² = 16, x = ±4"
subject: math
difficulty: 4
objectives:
  - math.quadratics_exponents
authorNotes: Conjunto de math/I.
inputType: number
pages:
  - pageNumber: 1
    title: Quadráticas • Expoentes • Radicais — Conjunto 20 – Página 1
    description: Resolva equações quadráticas e simplifique expressões com expoentes e radicais.
    exercises:
      - type: quadratic
        question: (x - -7)(x - -3) = 0
        correctAnswer: x = -7 ou x = -3
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: x² = 121
        correctAnswer: x = 11
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: (x - 5)(x - -3) = 0
        correctAnswer: x = 5 ou x = -3
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: (x - 5)(x - -5) = 0
        correctAnswer: x = 5 ou x = -5
        rationale: "Estude o sinal: acima/abaixo de zero conforme a raiz."
      - type: quadratic
        question: 3x² + 3x + 0 = 0
        correctAnswer: x = 0 ou x = -1
        rationale: "Represente a solução em notação de intervalo."
      - type: quadratic
        question: (x - -6)(x - -4) = 0
        correctAnswer: x = -6 ou x = -4
        rationale: "Inequação-produto: analise sinal de cada fator."
      - type: quadratic
        question: (x - -4)(x - -7) = 0
        correctAnswer: x = -4 ou x = -7
        rationale: "Se a > 0, função cresce; se a < 0, decresce."
      - type: quadratic
        question: (x - -3)(x - -7) = 0
        correctAnswer: x = -3 ou x = -7
        rationale: "Solução de ax + b > 0 depende do sinal de a."
      - type: quadratic
        question: 1x² + 6x + 8 = 0
        correctAnswer: x = -2 ou x = -4
        rationale: "Verifique a solução testando um valor do intervalo."
      - type: quadratic
        question: (x - -5)(x - -9) = 0
        correctAnswer: x = -5 ou x = -9
        rationale: "União/interseção de intervalos conforme o conectivo lógico."
