pages:
  - pageNumber: 1
    title: Quadráticas • Expoentes • Radicais — Conjunto 6 – Página 1
    description: Resolva equações quadráticas.
    exercises:
      - type: quadratic
        question: 1x² + 7x + 6 = 0
        correctAnswer: x = -1 ou x = -6
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: 4x² + -4x + -8 = 0
        correctAnswer: x = 2 ou x = -1
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: 1x² + 4x + 0 = 0
        correctAnswer: x = 0 ou x = -4
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: 1x² + -2x + 1 = 0
        correctAnswer: x = 1
        rationale: "Estude o sinal: acima/abaixo de zero conforme a raiz."
      - type: quadratic
        question: 1x² + 6x + 9 = 0
        correctAnswer: x = -3
        rationale: "Represente a solução em notação de intervalo."
      - type: quadratic
        question: 5x² + -10x + 0 = 0
        correctAnswer: x = 2 ou x = 0
        rationale: "Inequação-produto: analise sinal de cada fator."
      - type: quadratic
        question: 1x² + -2x + -8 = 0
        correctAnswer: x = 4 ou x = -2
        rationale: "Se a > 0, função cresce; se a < 0, decresce."
      - type: quadratic
        question: 4x² + 4x + -8 = 0
        correctAnswer: x = 1 ou x = -2
        rationale: "Solução de ax + b > 0 depende do sinal de a."
      - type: quadratic
        question: 2x² + 2x + 0 = 0
        correctAnswer: x = 0 ou x = -1
        rationale: "Verifique a solução testando um valor do intervalo."
      - type: quadratic
        question: 2x² + -8x + 6 = 0
        correctAnswer: x = 3 ou x = 1
        rationale: "União/interseção de intervalos conforme o conectivo lógico."
