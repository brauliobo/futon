title: Problemas com Desenhos
level: 5A
subject: math
difficulty: 1
objectives:
  - math.numeracy
authorNotes: "Problemas com apoio visual. Conte elementos e associe à operação correspondente."
inputType: number
example: "Resolva problemas simples usando desenhos. Ex.: João tem 5 ★. Maria deu mais 3 ★. Quantas ★ J… → 8."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 8
