    title: Problemas com Desenhos – Página 1
    description: Use os desenhos para resolver os problemas.
    exercises:
      - type: word_problem
        question: João tem 5 ★. Maria deu mais 3 ★. Quantas ★ João tem agora?
        correctAnswer: 8
        rationale: "Ele tinha 5 e ganhou 3: some 5 + 3 = 8."
        difficulty: 1
        objectives: [math.numeracy]
      - type: word_problem
        question: Ana tinha 10 ●. Perdeu 4 ●. Quantas ● Ana tem agora?
        correctAnswer: 6
        rationale: "Começou com 10 e perdeu 4: subtraia 10 - 4 = 6."
        difficulty: 1
        objectives: [math.numeracy]
      - type: word_problem
        question: Pedro viu 7 ▲. Sua irmã viu mais 6 ▲. Quantas ▲ viram juntos?
        correctAnswer: 13
        rationale: "7 + 6 = 13."
        difficulty: 1
        objectives: [math.numeracy]
      - type: word_problem
        question: Clara tinha 15 ♥. Deu 8 ♥ para sua amiga. Quantas ♥ ficaram?
        correctAnswer: 7
        rationale: "Começou com 15 e perdeu 8: subtraia 15 - 8 = 7."
