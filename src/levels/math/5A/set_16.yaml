        difficulty: 1
        objectives: [math.numeracy]
      - type: word_problem
        question: Carla tinha 18 ★. Deu 9 ★. Quantas ★ ficaram com ela?
        correctAnswer: 9
        rationale: "Releia o enunciado; marque números e palavras-chave."
