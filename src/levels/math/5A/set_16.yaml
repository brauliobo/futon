title: Problemas com Desenhos
level: 5A
subject: math
difficulty: 1
objectives:
  - math.numeracy
authorNotes: Problemas com apoio visual. Conte elementos e associe à operação
  correspondente.
inputType: number
example: "Resolva problemas simples usando desenhos. Ex.: João tem 5 ★. Maria
  deu mais 3 ★. Quantas ★ J… → 8."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 7
pages:
  - pageNumber: 1
    title: Problemas com Desenhos – Página 1
    description: Use os desenhos para resolver os problemas.
    exercises:
      - type: word_problem
        question: João tem 5 ★. Maria deu mais 3 ★. Quantas ★ João tem agora?
        correctAnswer: 8
        rationale: 5 + 3 = 8 (some os dois grupos).
        difficulty: 1
        objectives:
          - math.numeracy
      - type: word_problem
        question: Ana tinha 10 ●. Perdeu 4 ●. Quantas ● Ana tem agora?
        correctAnswer: 6
        rationale: 10 − 4 = 6 (começou com 10, tirou 4).
        difficulty: 1
        objectives:
          - math.numeracy
      - type: word_problem
        question: Pedro viu 7 ▲. Sua irmã viu mais 6 ▲. Quantas ▲ viram juntos?
        correctAnswer: 13
        rationale: 7 + 6 = 13 (some os dois grupos).
        difficulty: 1
        objectives:
          - math.numeracy
      - type: word_problem
        question: Clara tinha 15 ♥. Deu 8 ♥ para sua amiga. Quantas ♥ ficaram?
