title: Aplicações de Limites — Conjunto 16
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: "Aplicações de limites. Base para continuidade e derivada."
inputType: number
pages:
  - pageNumber: 1
    title: Aplicações de Limites — Conjunto 16 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→∞) (1 + 1/x)^x = ?
        correctAnswer: e
        rationale: "Substitua o valor — a função é contínua no ponto."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (1 - cos(x))/x = ?
        correctAnswer: "0"
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) sen(x)/x = ?
        correctAnswer: "1"
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (e^x - 1)/x = ?
        correctAnswer: "1"
        rationale: "Substitua o valor — a função é contínua no ponto."
        difficulty: 4
        objectives: [math.differential_calculus]
