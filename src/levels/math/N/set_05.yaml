title: Regra do Quociente — Conjunto 5
level: N
example: "Derivada de quocientes. Ex.: d/dx (x/sin x) = (sin x - x cos x)/sin²x"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Regra do Quociente — Conjunto 5 – Página 1
    description: Use a regra do quociente para derivar.
    exercises:
      - &a1
        type: reading
        question: d/dx (x²/x³) =
        correctAnswer: -1/x²
      - &a2
        type: reading
        question: d/dx (sin x/x) =
        correctAnswer: (x cos x - sin x)/x²
      - &a3
        type: reading
        question: d/dx (e^x/x²) =
        correctAnswer: (x² e^x - 2x e^x)/x⁴
      - &a4
        type: reading
        question: d/dx (x/(x² + 1)) =
        correctAnswer: (1 - x²)/(x² + 1)²
      - &a5
        type: reading
        question: d/dx (ln x/x) =
        correctAnswer: (1 - ln x)/x²
      - &a6
        type: reading
        question: d/dx (x²/(x² - 1)) =
        correctAnswer: -2x/(x² - 1)²
      - &a7
        type: reading
        question: d/dx (cos x/sin x) =
        correctAnswer: -csc²x
      - &a8
        type: reading
        question: d/dx ((x + 1)/(x - 1)) =
        correctAnswer: -2/(x - 1)²
      - &a9
        type: reading
        question: d/dx (x³/e^x) =
        correctAnswer: (3x² - x³)/e^x
      - &a10
        type: reading
        question: d/dx (tan x/x) =
        correctAnswer: (x sec²x - tan x)/x²
