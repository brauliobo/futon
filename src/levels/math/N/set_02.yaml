title: Derivadas Básicas — Conjunto 2
level: N
example: "Derivadas de funções básicas. Ex.: d/dx (x³) = 3x²"
subject: math
pages:
  - pageNumber: 1
    title: Derivadas Básicas – Página 1
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (x⁵) =
        correctAnswer: "5x⁴"
  - pageNumber: 2
    title: Derivadas Básicas – Página 2
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (3x²) =
        correctAnswer: "6x"
  - pageNumber: 3
    title: Derivadas Básicas – Página 3
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (x⁻¹) =
        correctAnswer: "-x⁻²"
  - pageNumber: 4
    title: Derivadas Básicas – Página 4
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (√x) =
        correctAnswer: "1/(2√x)"
  - pageNumber: 5
    title: Derivadas Básicas – Página 5
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (sin x) =
        correctAnswer: "cos x"
  - pageNumber: 6
    title: Derivadas Básicas – Página 6
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (cos x) =
        correctAnswer: "-sin x"
  - pageNumber: 7
    title: Derivadas Básicas – Página 7
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (e^x) =
        correctAnswer: "e^x"
  - pageNumber: 8
    title: Derivadas Básicas – Página 8
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (ln x) =
        correctAnswer: "1/x"
  - pageNumber: 9
    title: Derivadas Básicas – Página 9
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (tan x) =
        correctAnswer: "sec²x"
  - pageNumber: 10
    title: Derivadas Básicas – Página 10
    description: Calcule a derivada das funções.
    exercises:
      - type: reading
        question: d/dx (x⁷) =
        correctAnswer: "7x⁶"
target: 10
