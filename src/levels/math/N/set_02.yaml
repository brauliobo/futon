    title: Derivadas Básicas — Conjunto 2 – Página 1
    description: Calcule a derivada das funções.
    exercises:
      - &a1
        type: reading
        question: d/dx (x⁵) =
        correctAnswer: 5x⁴
      - &a2
        type: reading
        question: d/dx (3x²) =
        correctAnswer: 6x
      - &a3
        type: reading
        question: d/dx (x⁻¹) =
        correctAnswer: -x⁻²
      - &a4
        type: reading
        question: d/dx (√x) =
        correctAnswer: 1/(2√x)
      - &a5
        type: reading
        question: d/dx (sin x) =
        correctAnswer: cos x
      - &a6
        type: reading
        question: d/dx (cos x) =
        correctAnswer: -sin x
      - &a7
        type: reading
        question: d/dx (e^x) =
        correctAnswer: e^x
      - &a8
        type: reading
        question: d/dx (ln x) =
        correctAnswer: 1/x
      - &a9
        type: reading
        question: d/dx (tan x) =
        correctAnswer: sec²x
      - &a10
        type: reading
        question: d/dx (x⁷) =
        correctAnswer: 7x⁶
