title: Regra da Cadeia — Conjunto 3
level: N
example: "Derivadas compostas. Ex.: d/dx (sin(x²)) = 2x cos(x²)"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Regra da Cadeia — Conjunto 3 – Página 1
    description: Use a regra da cadeia para derivar.
    exercises:
      - &a1
        type: reading
        question: d/dx (sin(2x)) =
        correctAnswer: 2cos(2x)
      - &a2
        type: reading
        question: d/dx (e^(3x)) =
        correctAnswer: 3e^(3x)
      - &a3
        type: reading
        question: d/dx ((x² + 1)³) =
        correctAnswer: 6x(x² + 1)²
      - &a4
        type: reading
        question: d/dx (ln(x²)) =
        correctAnswer: 2/x
      - &a5
        type: reading
        question: d/dx (cos(5x)) =
        correctAnswer: -5sin(5x)
      - &a6
        type: reading
        question: d/dx (√(x² + 4)) =
        correctAnswer: x/√(x² + 4)
      - &a7
        type: reading
        question: d/dx ((2x - 1)⁴) =
        correctAnswer: 8(2x - 1)³
      - &a8
        type: reading
        question: d/dx (tan(x²)) =
        correctAnswer: 2x sec²(x²)
      - &a9
        type: reading
        question: d/dx (e^(sin x)) =
        correctAnswer: cos x · e^(sin x)
      - &a10
        type: reading
        question: d/dx (ln(cos x)) =
        correctAnswer: -tan x
