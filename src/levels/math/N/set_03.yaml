title: Regra da Cadeia — Conjunto 3
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: Conjunto de math/N.
inputType: number
pages:
  - pageNumber: 1
    title: Regra da Cadeia — Conjunto 3 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→5) (-6x + -4) = ?
        correctAnswer: "-34"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→5) (-7x + 6) = ?
        correctAnswer: "-29"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→-3) (-1x + -3) = ?
        correctAnswer: "0"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→4) (7x + 10) = ?
        correctAnswer: "38"
        rationale: "Limite por substituição direta quando f é contínua no ponto."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→1) (-6x + 5) = ?
        correctAnswer: "-1"
        rationale: "Forma 0/0: fatore e cancele o fator comum."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→-5) (3x + -4) = ?
        correctAnswer: "-19"
        rationale: "L'Hôpital: 0/0 ou ∞/∞ → derive numerador e denominador."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→4) (-2x + -3) = ?
        correctAnswer: "-11"
        rationale: "Derivada de x^n: n·x^(n-1)."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (0x + -4) = ?
        correctAnswer: "-4"
        rationale: "Derivada da soma = soma das derivadas."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→-5) (4x + -10) = ?
        correctAnswer: "-30"
        rationale: "Regra do produto: (fg)' = f'g + fg'."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→-4) (-4x + 10) = ?
        correctAnswer: "26"
        rationale: "Regra do quociente: (f/g)' = (f'g - fg')/g²."
        difficulty: 4
        objectives: [math.differential_calculus]
