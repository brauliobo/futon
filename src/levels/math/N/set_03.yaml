title: Regra da Cadeia — Conjunto 3
level: N
example: "Derivadas compostas. Ex.: d/dx (sin(x²)) = 2x cos(x²)"
subject: math
pages:
  - pageNumber: 1
    title: Regra da Cadeia – Página 1
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx (sin(2x)) =
        correctAnswer: "2cos(2x)"
  - pageNumber: 2
    title: Regra da Cadeia – Página 2
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx (e^(3x)) =
        correctAnswer: "3e^(3x)"
  - pageNumber: 3
    title: Regra da Cadeia – Página 3
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx ((x² + 1)³) =
        correctAnswer: "6x(x² + 1)²"
  - pageNumber: 4
    title: Regra da Cadeia – Página 4
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx (ln(x²)) =
        correctAnswer: "2/x"
  - pageNumber: 5
    title: Regra da Cadeia – Página 5
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx (cos(5x)) =
        correctAnswer: "-5sin(5x)"
  - pageNumber: 6
    title: Regra da Cadeia – Página 6
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx (√(x² + 4)) =
        correctAnswer: "x/√(x² + 4)"
  - pageNumber: 7
    title: Regra da Cadeia – Página 7
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx ((2x - 1)⁴) =
        correctAnswer: "8(2x - 1)³"
  - pageNumber: 8
    title: Regra da Cadeia – Página 8
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx (tan(x²)) =
        correctAnswer: "2x sec²(x²)"
  - pageNumber: 9
    title: Regra da Cadeia – Página 9
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx (e^(sin x)) =
        correctAnswer: "cos x · e^(sin x)"
  - pageNumber: 10
    title: Regra da Cadeia – Página 10
    description: Use a regra da cadeia para derivar.
    exercises:
      - type: reading
        question: d/dx (ln(cos x)) =
        correctAnswer: "-tan x"
target: 10
