title: Limites Gerais — Conjunto 20
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: Conjunto de math/N.
inputType: number
pages:
  - pageNumber: 1
    title: Limites Gerais — Conjunto 20 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→∞) (1 + 1/x)^x = ?
        correctAnswer: e
        rationale: "Isole x usando operações inversas dos dois lados."
      - type: quadratic
        question: lim(x→3) (x² - 64)/(x - -8) = ?
        correctAnswer: "-5"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: linear_equation
        question: lim(x→-3) (-4x + -6) = ?
        correctAnswer: "6"
        rationale: "Isole x usando operações inversas dos dois lados."
      - type: quadratic
        question: lim(x→-4) (x² - 1)/(x - -1) = ?
        correctAnswer: "-5"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: linear_equation
        question: lim(x→1) (-1x + 1) = ?
        correctAnswer: "0"
        rationale: "Isole x usando operações inversas dos dois lados."
      - type: linear_equation
        question: lim(x→5) (2x + -4) = ?
        correctAnswer: "6"
        rationale: "Limite por substituição direta quando f é contínua no ponto."
      - type: quadratic
        question: lim(x→∞) (2x² + -1x + 5)/x² = ?
        correctAnswer: "2"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: linear_equation
        question: lim(x→3) (-9x + -10) = ?
        correctAnswer: "-37"
        rationale: "Forma 0/0: fatore e cancele o fator comum."
      - type: quadratic
        question: lim(x→∞) (1x² + -6x + 5)/x² = ?
        correctAnswer: "1"
        rationale: "Ex.: lim(x→2) x² = 4 — substituição direta."
      - type: quadratic
        question: lim(x→∞) (1x² + 4x + 0)/x² = ?
        correctAnswer: "1"
        rationale: "Se denominador → 0 e numerador ≠ 0: limite infinito."
