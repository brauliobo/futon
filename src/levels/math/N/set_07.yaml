title: Derivadas Exponenciais e Logarítmicas — Conjunto 7
level: N
example: "Funções exponenciais e logarítmicas. Ex.: d/dx (a^x) = a^x ln a"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Derivadas Exponenciais e Logarítmicas — Conjunto 7 – Página 1
    description: Calcule as derivadas das funções exponenciais e logarítmicas.
    exercises:
      - &a1
        type: reading
        question: d/dx (2^x) =
        correctAnswer: 2^x ln 2
      - &a2
        type: reading
        question: d/dx (3^x) =
        correctAnswer: 3^x ln 3
      - &a3
        type: reading
        question: d/dx (log₂ x) =
        correctAnswer: 1/(x ln 2)
      - &a4
        type: reading
        question: d/dx (log₁₀ x) =
        correctAnswer: 1/(x ln 10)
      - &a5
        type: reading
        question: d/dx (x^x) =
        correctAnswer: x^x (ln x + 1)
      - &a6
        type: reading
        question: d/dx (e^(x²)) =
        correctAnswer: 2x e^(x²)
      - &a7
        type: reading
        question: d/dx (ln(x²+1)) =
        correctAnswer: 2x/(x²+1)
      - &a8
        type: reading
        question: d/dx ((ln x)²) =
        correctAnswer: 2 ln x / x
      - &a9
        type: reading
        question: d/dx (e^(sin x)) =
        correctAnswer: cos x · e^(sin x)
      - &a10
        type: reading
        question: d/dx (5^(2x)) =
        correctAnswer: 2 · 5^(2x) ln 5
