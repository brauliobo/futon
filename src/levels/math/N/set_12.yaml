title: Regra de L'Hôpital — Conjunto 12
level: N
example: "Formas indeterminadas. Ex.: lim(x→0) (sin x)/x = 1 usando L'Hôpital"
subject: math
pages:
  - pageNumber: 1
    title: Regra de L'Hôpital — Conjunto 12 – Página 1
    description: Use a regra de L'Hôpital para calcular os limites.
    exercises:
      - &a1
        type: reading
        question: lim(x→0) (e^x - 1)/x =
        correctAnswer: "1"
      - &a2
        type: reading
        question: lim(x→0) (ln(1+x))/x =
        correctAnswer: "1"
      - &a3
        type: reading
        question: lim(x→∞) x/e^x =
        correctAnswer: "0"
      - &a4
        type: reading
        question: lim(x→∞) (ln x)/x =
        correctAnswer: "0"
      - &a5
        type: reading
        question: lim(x→1) (x² - 1)/(x - 1) =
        correctAnswer: "2"
      - &a6
        type: reading
        question: lim(x→0) (tan x)/x =
        correctAnswer: "1"
      - &a7
        type: reading
        question: lim(x→∞) x²/e^x =
        correctAnswer: "0"
      - &a8
        type: reading
        question: lim(x→0) (1 - cos x)/x² =
        correctAnswer: 1/2
      - &a9
        type: reading
        question: lim(x→π/2) (π - 2x)/cos x =
        correctAnswer: "2"
      - &a10
        type: reading
        question: lim(x→0⁺) x ln x =
        correctAnswer: "0"
