title: Revisão de Limites — Conjunto 14
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: Revisão geral de limites. Identifique a técnica pela forma indeterminada.
inputType: number
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Revisão de Limites — Conjunto 14 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→0) sen(x)/x = ?
        correctAnswer: "1"
        rationale: Substituição direta em x = 0 dá 1.
        difficulty: 4
        objectives:
          - math.differential_calculus
      - type: linear_equation
        question: lim(x→0) (1 - cos(x))/x = ?
        correctAnswer: "0"
        rationale: Substituição direta em x = 0 dá 0.
        difficulty: 4
        objectives:
          - math.differential_calculus
      - type: linear_equation
        question: lim(x→∞) (1 + 1/x)^x = ?
        correctAnswer: e
        rationale: "x→∞: divida pela maior potência de x; termos com x⁻ⁿ → 0."
        difficulty: 4
        objectives:
          - math.differential_calculus
      - type: linear_equation
        question: lim(x→0) (e^x - 1)/x = ?
        correctAnswer: "1"
        rationale: Substituição direta em x = 0 dá 1.
        difficulty: 4
        objectives:
          - math.differential_calculus
