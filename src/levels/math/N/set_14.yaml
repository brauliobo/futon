title: Revisão de Limites — Conjunto 14
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: Conjunto de math/N.
inputType: number
pages:
  - pageNumber: 1
    title: Revisão de Limites — Conjunto 14 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→0) sen(x)/x = ?
        correctAnswer: "1"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (1 - cos(x))/x = ?
        correctAnswer: "0"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→∞) (1 + 1/x)^x = ?
        correctAnswer: e
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (e^x - 1)/x = ?
        correctAnswer: "1"
        rationale: "Limite por substituição direta quando f é contínua no ponto."
        difficulty: 4
        objectives: [math.differential_calculus]
  - pageNumber: 2
    title: Revisão de Limites — Conjunto 14 – Página 2
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→∞) (1 + 1/x)^x = ?
        correctAnswer: e
        rationale: "Forma 0/0: fatore e cancele o fator comum."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) sen(x)/x = ?
        correctAnswer: "1"
        rationale: "L'Hôpital: 0/0 ou ∞/∞ → derive numerador e denominador."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (1 - cos(x))/x = ?
        correctAnswer: "0"
        rationale: "Derivada de x^n: n·x^(n-1)."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (e^x - 1)/x = ?
        correctAnswer: "1"
        rationale: "Derivada da soma = soma das derivadas."
        difficulty: 4
        objectives: [math.differential_calculus]
  - pageNumber: 3
    title: Revisão de Limites — Conjunto 14 – Página 3
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→0) (e^x - 1)/x = ?
        correctAnswer: "1"
        rationale: "Regra do produto: (fg)' = f'g + fg'."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→∞) (1 + 1/x)^x = ?
        correctAnswer: e
        rationale: "Regra do quociente: (f/g)' = (f'g - fg')/g²."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) sen(x)/x = ?
        correctAnswer: "1"
        rationale: "Regra da cadeia: (f∘g)'(x) = f'(g(x))·g'(x)."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (1 - cos(x))/x = ?
        correctAnswer: "0"
        rationale: "Derivada é inclinação da reta tangente."
        difficulty: 4
        objectives: [math.differential_calculus]
  - pageNumber: 4
    title: Revisão de Limites — Conjunto 14 – Página 4
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→0) (e^x - 1)/x = ?
        correctAnswer: "1"
        rationale: "Limites laterais devem coincidir para existir o limite."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→∞) (1 + 1/x)^x = ?
        correctAnswer: e
        rationale: "lim(x→0) sen x / x = 1 (limite fundamental)."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) sen(x)/x = ?
        correctAnswer: "1"
        rationale: "Ex.: lim(x→2) x² = 4 — substituição direta."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (1 - cos(x))/x = ?
        correctAnswer: "0"
        rationale: "Se denominador → 0 e numerador ≠ 0: limite infinito."
        difficulty: 4
        objectives: [math.differential_calculus]
