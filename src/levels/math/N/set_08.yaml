title: Derivação Implícita — Conjunto 8
level: N
example: "Derivação implícita. Ex.: Para x² + y² = 25, dy/dx = -x/y"
subject: math
pages:
  - pageNumber: 1
    title: Derivação Implícita – Página 1
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: x² + y² = 16, dy/dx =
        correctAnswer: "-x/y"
  - pageNumber: 2
    title: Derivação Implícita – Página 2
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: x² - y² = 9, dy/dx =
        correctAnswer: "x/y"
  - pageNumber: 3
    title: Derivação Implícita – Página 3
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: xy = 12, dy/dx =
        correctAnswer: "-y/x"
  - pageNumber: 4
    title: Derivação Implícita – Página 4
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: x³ + y³ = 8, dy/dx =
        correctAnswer: "-x²/y²"
  - pageNumber: 5
    title: Derivação Implícita – Página 5
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: x² + xy + y² = 7, dy/dx =
        correctAnswer: "-(2x+y)/(x+2y)"
  - pageNumber: 6
    title: Derivação Implícita – Página 6
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: sin(xy) = x, dy/dx =
        correctAnswer: "(1-y cos(xy))/(x cos(xy))"
