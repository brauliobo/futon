    title: Derivação Implícita – Página 7
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: e^(xy) = x + y, dy/dx =
        correctAnswer: "(1-y e^(xy))/(x e^(xy)-1)"
  - pageNumber: 8
    title: Derivação Implícita – Página 8
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: x²y + xy² = 6, dy/dx =
        correctAnswer: "-y(2x+y)/(x(x+2y))"
  - pageNumber: 9
    title: Derivação Implícita – Página 9
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: ln(xy) = x - y, dy/dx =
        correctAnswer: "(xy-y)/(x+xy)"
  - pageNumber: 10
    title: Derivação Implícita – Página 10
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - type: reading
        question: x³ - 3xy² + y³ = 1, dy/dx =
        correctAnswer: "(x²-y²)/(y²-2xy)"
