title: Derivação Implícita — Conjunto 8
level: N
example: "Derivação implícita. Ex.: Para x² + y² = 25, dy/dx = -x/y"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Derivação Implícita — Conjunto 8 – Página 1
    description: Use derivação implícita para encontrar dy/dx.
    exercises:
      - &a1
        type: reading
        question: x² + y² = 16, dy/dx =
        correctAnswer: -x/y
      - &a2
        type: reading
        question: x² - y² = 9, dy/dx =
        correctAnswer: x/y
      - &a3
        type: reading
        question: xy = 12, dy/dx =
        correctAnswer: -y/x
      - &a4
        type: reading
        question: x³ + y³ = 8, dy/dx =
        correctAnswer: -x²/y²
      - &a5
        type: reading
        question: x² + xy + y² = 7, dy/dx =
        correctAnswer: -(2x+y)/(x+2y)
      - &a6
        type: reading
        question: sin(xy) = x, dy/dx =
        correctAnswer: (1-y cos(xy))/(x cos(xy))
      - &a7
        type: reading
        question: e^(xy) = x + y, dy/dx =
        correctAnswer: (1-y e^(xy))/(x e^(xy)-1)
      - &a8
        type: reading
        question: x²y + xy² = 6, dy/dx =
        correctAnswer: -y(2x+y)/(x(x+2y))
      - &a9
        type: reading
        question: ln(xy) = x - y, dy/dx =
        correctAnswer: (xy-y)/(x+xy)
      - &a10
        type: reading
        question: x³ - 3xy² + y³ = 1, dy/dx =
        correctAnswer: (x²-y²)/(y²-2xy)
