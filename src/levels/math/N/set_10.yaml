title: Taxa de Variação — Conjunto 10
level: N
example: "Taxas de variação relacionadas. Ex.: Se V = 4πr³/3, então dV/dt = 4πr²(dr/dt)"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Taxa de Variação — Conjunto 10 – Página 1
    description: Encontre a taxa de variação.
    exercises:
      - &a1
        type: reading
        question: A = πr², dA/dt quando dr/dt = 3 e r = 5
        correctAnswer: 30π
      - &a2
        type: reading
        question: V = s³, dV/dt quando ds/dt = 2 e s = 4
        correctAnswer: "96"
      - &a3
        type: reading
        question: A = l·w, dA/dt quando dl/dt = 1, dw/dt = 2, l = 5, w = 3
        correctAnswer: "13"
      - &a4
        type: reading
        question: C = 2πr, dC/dt quando dr/dt = 4
        correctAnswer: 8π
      - &a5
        type: reading
        question: V = (4/3)πr³, dV/dt quando dr/dt = 2 e r = 3
        correctAnswer: 72π
      - &a6
        type: reading
        question: y = x², dy/dt quando dx/dt = 5 e x = 2
        correctAnswer: "20"
      - &a7
        type: reading
        question: x² + y² = 25, dy/dt quando dx/dt = 3, x = 3, y = 4
        correctAnswer: -9/4
      - &a8
        type: reading
        question: V = lwh, dV/dt quando l = 2, w = 3, h = 4, dl/dt = 1, dw/dt = 0, dh/dt = 2
        correctAnswer: "24"
      - &a9
        type: reading
        question: A = ½bh, dA/dt quando b = 6, h = 8, db/dt = 2, dh/dt = 1
        correctAnswer: "11"
      - &a10
        type: reading
        question: y = sin x, dy/dt quando dx/dt = π/2 e x = π/3
        correctAnswer: π/4
