title: Limites Multivariáveis — Conjunto 18
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: "Limites em várias variáveis. Teste caminhos diferentes — se diferem, o limite não existe."
inputType: number
pages:
  - pageNumber: 1
    title: Limites Multivariáveis — Conjunto 18 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→1) (2x + -9) = ?
        correctAnswer: "-7"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (2x² + 0x + 0)/x² = ?
        correctAnswer: "2"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→-4) (x² - 49)/(x - -7) = ?
        correctAnswer: "-11"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→5) (-6x + -1) = ?
        correctAnswer: "-31"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) sen(x)/x = ?
        correctAnswer: "1"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→-1) (2x + 10) = ?
        correctAnswer: "8"
        rationale: "Limite por substituição direta quando f é contínua no ponto."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→5) (9x + 4) = ?
        correctAnswer: "49"
        rationale: "Forma 0/0: fatore e cancele o fator comum."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (1x² + -7x + 2)/x² = ?
        correctAnswer: "1"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (1 - cos(x))/x = ?
        correctAnswer: "0"
        rationale: "L'Hôpital: 0/0 ou ∞/∞ → derive numerador e denominador."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→1) (x² - 1)/(x - -1) = ?
        correctAnswer: "0"
        rationale: "Ex.: lim(x→2) x² = 4 — substituição direta."
        difficulty: 4
        objectives: [math.differential_calculus]
  - pageNumber: 2
