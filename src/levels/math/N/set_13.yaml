title: Concavidade e Inflexão — Conjunto 13
level: N
example: "Análise de curvas. Ex.: f(x) = x³ tem ponto de inflexão em x = 0"
subject: math
pages:
  - pageNumber: 1
    title: Concavidade e Inflexão – Página 1
    description: Determine a concavidade das funções.
    exercises:
      - type: reading
        question: f(x) = x² é côncava para
        correctAnswer: "cima"
  - pageNumber: 2
    title: Concavidade e Inflexão – Página 2
    description: Determine a concavidade das funções.
    exercises:
      - type: reading
        question: f(x) = -x² é côncava para
        correctAnswer: "baixo"
  - pageNumber: 3
    title: Concavidade e Inflexão – Página 3
    description: Encontre os pontos de inflexão.
    exercises:
      - type: reading
        question: f(x) = x³ - 3x², ponto de inflexão em x =
        correctAnswer: "1"
  - pageNumber: 4
    title: Concavidade e Inflexão – Página 4
    description: Encontre os pontos de inflexão.
    exercises:
      - type: reading
        question: f(x) = x⁴ - 6x², pontos de inflexão em x =
        correctAnswer: "-1, 1"
  - pageNumber: 5
    title: Concavidade e Inflexão – Página 5
    description: Analise usando a segunda derivada.
    exercises:
      - type: reading
        question: f(x) = e^x, f''(x) > 0, logo é côncava para
        correctAnswer: "cima"
  - pageNumber: 6
    title: Concavidade e Inflexão – Página 6
    description: Analise usando a segunda derivada.
    exercises:
      - type: reading
        question: f(x) = ln x, para x > 1, f''(x) < 0, logo é côncava para
        correctAnswer: "baixo"
  - pageNumber: 7
    title: Concavidade e Inflexão – Página 7
    description: Determine intervalos de concavidade.
    exercises:
      - type: reading
        question: f(x) = x³ - 6x² + 9x, côncava para cima em
        correctAnswer: "(2, ∞)"
  - pageNumber: 8
    title: Concavidade e Inflexão – Página 8
    description: Determine intervalos de concavidade.
    exercises:
      - type: reading
        question: f(x) = x³ - 6x² + 9x, côncava para baixo em
        correctAnswer: "(-∞, 2)"
  - pageNumber: 9
    title: Concavidade e Inflexão – Página 9
    description: Encontre pontos de inflexão usando f''(x) = 0.
    exercises:
      - type: reading
        question: f(x) = x⁴ - 2x², f''(x) = 0 em x =
        correctAnswer: "0, ±√(2/3)"
  - pageNumber: 10
    title: Concavidade e Inflexão – Página 10
    description: Analise comportamento da curva.
    exercises:
      - type: reading
        question: f(x) = sin x em [0, π], ponto de inflexão em x =
        correctAnswer: "π/2"
target: 10
