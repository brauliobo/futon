        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (1x² + -2x + 3)/x² = ?
        correctAnswer: "1"
        rationale: "Derivada é inclinação da reta tangente."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (5x² + -1x + -5)/x² = ?
        correctAnswer: "5"
        rationale: "Limites laterais devem coincidir para existir o limite."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→∞) (3x + -2)/x = ?
        correctAnswer: "3"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (4x² + -6x + 4)/x² = ?
        correctAnswer: "4"
        rationale: "lim(x→0) sen x / x = 1 (limite fundamental)."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (4x² + -1x + 2)/x² = ?
        correctAnswer: "4"
        rationale: "Ex.: lim(x→2) x² = 4 — substituição direta."
        difficulty: 4
        objectives: [math.differential_calculus]
