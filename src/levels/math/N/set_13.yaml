title: Limites Exponenciais — Conjunto 13
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: Conjunto de math/N.
inputType: number
pages:
  - pageNumber: 1
    title: Limites Exponenciais — Conjunto 13 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: quadratic
        question: lim(x→∞) (5x² + 6x + -5)/x² = ?
        correctAnswer: "5"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (6x² + -7x + -1)/x² = ?
        correctAnswer: "6"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (5x² + 3x + -2)/x² = ?
        correctAnswer: "5"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (5x² + 2x + 3)/x² = ?
        correctAnswer: "5"
        rationale: "Ex.: lim(x→2) x² = 4 — substituição direta."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→∞) (4x + 3)/x = ?
        correctAnswer: "4"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (6x² + 3x + 2)/x² = ?
        correctAnswer: "6"
        rationale: "Se denominador → 0 e numerador ≠ 0: limite infinito."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (6x² + 8x + -3)/x² = ?
        correctAnswer: "6"
        rationale: "Limite por substituição direta quando f é contínua no ponto."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (7x² + 2x + 1)/x² = ?
        correctAnswer: "7"
        rationale: "Forma 0/0: fatore e cancele o fator comum."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (6x² + -8x + -3)/x² = ?
        correctAnswer: "6"
        rationale: "L'Hôpital: 0/0 ou ∞/∞ → derive numerador e denominador."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (8x² + 7x + -1)/x² = ?
        correctAnswer: "8"
        rationale: "Derivada de x^n: n·x^(n-1)."
        difficulty: 4
        objectives: [math.differential_calculus]
  - pageNumber: 2
    title: Limites Exponenciais — Conjunto 13 – Página 2
    description: Calcule o limite das funções.
    exercises:
      - type: quadratic
