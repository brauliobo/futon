        correctAnswer: "8"
        rationale: "Regra do produto: (fg)' = f'g + fg'."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→∞) (4x² + -4x + 0)/x² = ?
        correctAnswer: "4"
