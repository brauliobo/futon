title: Regra do Produto — Conjunto 4
level: N
example: "Derivada de produtos. Ex.: d/dx (x sin x) = sin x + x cos x"
subject: math
pages:
  - pageNumber: 1
    title: Regra do Produto – Página 1
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (x² sin x) =
        correctAnswer: "2x sin x + x² cos x"
  - pageNumber: 2
    title: Regra do Produto – Página 2
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (x e^x) =
        correctAnswer: "e^x + x e^x"
  - pageNumber: 3
    title: Regra do Produto – Página 3
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (x³ ln x) =
        correctAnswer: "3x² ln x + x²"
  - pageNumber: 4
    title: Regra do Produto – Página 4
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (x cos x) =
        correctAnswer: "cos x - x sin x"
  - pageNumber: 5
    title: Regra do Produto – Página 5
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (x² e^(2x)) =
        correctAnswer: "2x e^(2x) + 2x² e^(2x)"
  - pageNumber: 6
    title: Regra do Produto – Página 6
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (sin x cos x) =
        correctAnswer: "cos²x - sin²x"
  - pageNumber: 7
    title: Regra do Produto – Página 7
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (x⁴ sin x) =
        correctAnswer: "4x³ sin x + x⁴ cos x"
  - pageNumber: 8
    title: Regra do Produto – Página 8
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (e^x ln x) =
        correctAnswer: "e^x ln x + e^x/x"
  - pageNumber: 9
    title: Regra do Produto – Página 9
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (x tan x) =
        correctAnswer: "tan x + x sec²x"
  - pageNumber: 10
    title: Regra do Produto – Página 10
    description: Use a regra do produto para derivar.
    exercises:
      - type: reading
        question: d/dx (x√x) =
        correctAnswer: "3x/(2√x)"
target: 10
