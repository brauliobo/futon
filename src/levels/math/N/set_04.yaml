title: Derivadas de Ordem Superior — Conjunto 4
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: Conjunto de math/N.
inputType: number
pages:
  - pageNumber: 1
    title: Derivadas de Ordem Superior — Conjunto 4 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→-2) (4x + 2) = ?
        correctAnswer: "-6"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→0) (-3x + -6) = ?
        correctAnswer: "-6"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→3) (4x + 5) = ?
        correctAnswer: "17"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→2) (3x + 5) = ?
        correctAnswer: "11"
        rationale: "Limite por substituição direta quando f é contínua no ponto."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→-2) (-6x + -2) = ?
        correctAnswer: "10"
        rationale: "Forma 0/0: fatore e cancele o fator comum."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→-5) (0x + -3) = ?
        correctAnswer: "-3"
        rationale: "L'Hôpital: 0/0 ou ∞/∞ → derive numerador e denominador."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→1) (-9x + 1) = ?
        correctAnswer: "-8"
        rationale: "Derivada de x^n: n·x^(n-1)."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→4) (1x + -1) = ?
        correctAnswer: "3"
        rationale: "Derivada da soma = soma das derivadas."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→-2) (10x + 7) = ?
        correctAnswer: "-13"
        rationale: "Regra do produto: (fg)' = f'g + fg'."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: linear_equation
        question: lim(x→-2) (2x + 4) = ?
        correctAnswer: "0"
        rationale: "Regra do quociente: (f/g)' = (f'g - fg')/g²."
        difficulty: 4
        objectives: [math.differential_calculus]
