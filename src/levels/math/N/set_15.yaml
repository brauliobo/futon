    title: Diferencial e Aproximação Linear – Página 1
    description: Calcule o diferencial das funções.
    exercises:
      - type: reading
        question: y = x³, dy =
        correctAnswer: "3x²dx"
  - pageNumber: 2
    title: Diferencial e Aproximação Linear – Página 2
    description: Calcule o diferencial das funções.
    exercises:
      - type: reading
        question: y = sin x, dy =
        correctAnswer: "cos x dx"
