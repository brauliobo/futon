title: Limites Avançados — Conjunto 15
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4."
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: Limites avançados. Combine fatoração, conjugado e L'Hôpital.
inputType: number
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Limites Avançados — Conjunto 15 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: linear_equation
        question: lim(x→0) (1 - cos(x))/x = ?
        correctAnswer: "0"
        rationale: "Forma 0/0 — use L'Hôpital ou sen(x)/x: lim = 0 (x→0)."
        difficulty: 4
        objectives:
          - math.differential_calculus
      - type: linear_equation
        question: lim(x→∞) (1 + 1/x)^x = ?
        correctAnswer: e
        rationale: "x→∞: divida pela maior potência de x; termos com x⁻ⁿ → 0."
        difficulty: 4
        objectives:
          - math.differential_calculus
      - type: linear_equation
        question: lim(x→0) (e^x - 1)/x = ?
        correctAnswer: "1"
        rationale: "Forma 0/0 — limite fundamental: lim (e^x − 1)/x = 1 (x→0)."
        difficulty: 4
        objectives:
          - math.differential_calculus
      - type: linear_equation
        question: lim(x→0) sen(x)/x = ?
        correctAnswer: "1"
        rationale: "Forma 0/0 — limite fundamental: lim sen(x)/x = 1 (x→0)."
        difficulty: 4
        objectives:
          - math.differential_calculus
