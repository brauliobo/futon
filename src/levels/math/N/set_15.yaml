title: Diferencial e Aproximação Linear — Conjunto 15
level: N
example: "Diferencial e aproximações. Ex.: df = f'(x)dx, √(4.01) ≈ 2 + 0.01/4 = 2.0025"
subject: math
pages:
  - pageNumber: 1
    title: Diferencial e Aproximação Linear — Conjunto 15 – Página 1
    description: Calcule o diferencial das funções.
    exercises:
      - &a1
        type: reading
        question: y = x³, dy =
        correctAnswer: 3x²dx
      - &a2
        type: reading
        question: y = sin x, dy =
        correctAnswer: cos x dx
      - &a3
        type: reading
        question: √(9.1) ≈ (usando f(x) = √x, a = 9)
        correctAnswer: "3.017"
      - &a4
        type: reading
        question: ln(1.05) ≈ (usando f(x) = ln x, a = 1)
        correctAnswer: "0.05"
      - &a5
        type: reading
        question: sin(31°) ≈ (usando f(x) = sin x, a = 30°)
        correctAnswer: "0.515"
      - &a6
        type: reading
        question: Se x = 4 ± 0.1, erro em y = x² é aproximadamente
        correctAnswer: "0.8"
      - &a7
        type: reading
        question: Se r = 5 ± 0.05, erro em A = πr² é aproximadamente
        correctAnswer: 0.5π
      - &a8
        type: reading
        question: (1.02)⁵ ≈ (usando f(x) = x⁵, a = 1)
        correctAnswer: "1.1"
      - &a9
        type: reading
        question: cos(89°) ≈ (usando f(x) = cos x, a = 90°)
        correctAnswer: π/180
      - &a10
        type: reading
        question: ³√(26.9) ≈ (usando f(x) = ³√x, a = 27)
        correctAnswer: "2.967"
