title: Derivadas Trigonométricas — Conjunto 6
level: N
example: "Derivadas de funções trigonométricas. Ex.: d/dx (csc x) = -csc x cot x"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Derivadas Trigonométricas — Conjunto 6 – Página 1
    description: Calcule as derivadas das funções trigonométricas.
    exercises:
      - &a1
        type: reading
        question: d/dx (sec x) =
        correctAnswer: sec x tan x
      - &a2
        type: reading
        question: d/dx (csc x) =
        correctAnswer: -csc x cot x
      - &a3
        type: reading
        question: d/dx (cot x) =
        correctAnswer: -csc²x
      - &a4
        type: reading
        question: d/dx (arcsin x) =
        correctAnswer: 1/√(1-x²)
      - &a5
        type: reading
        question: d/dx (arccos x) =
        correctAnswer: -1/√(1-x²)
      - &a6
        type: reading
        question: d/dx (arctan x) =
        correctAnswer: 1/(1+x²)
      - &a7
        type: reading
        question: d/dx (sin²x) =
        correctAnswer: sin(2x)
      - &a8
        type: reading
        question: d/dx (cos²x) =
        correctAnswer: -sin(2x)
      - &a9
        type: reading
        question: d/dx (tan²x) =
        correctAnswer: 2 tan x sec²x
      - &a10
        type: reading
        question: d/dx (sin(cos x)) =
        correctAnswer: -sin x cos(cos x)
