title: Limites e Continuidade — Conjunto 1
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Limites e Continuidade — Conjunto 1 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - &a1
        type: reading
        question: lim(x→2) (x + 3) =
        correctAnswer: "5"
      - &a2
        type: reading
        question: lim(x→0) (sin x)/x =
        correctAnswer: "1"
      - &a3
        type: reading
        question: lim(x→1) (x² - 1)/(x - 1) =
        correctAnswer: "2"
      - &a4
        type: reading
        question: lim(x→∞) (2x + 1)/(x - 3) =
        correctAnswer: "2"
      - &a5
        type: reading
        question: lim(x→3) (x² - 9)/(x - 3) =
        correctAnswer: "6"
      - &a6
        type: reading
        question: lim(x→0) (1 - cos x)/x² =
        correctAnswer: 1/2
      - &a7
        type: reading
        question: lim(x→2) (x³ - 8)/(x - 2) =
        correctAnswer: "12"
      - &a8
        type: reading
        question: lim(x→∞) (3x² + 2x)/(x² - 1) =
        correctAnswer: "3"
      - &a9
        type: reading
        question: lim(x→4) (√x - 2)/(x - 4) =
        correctAnswer: 1/4
      - &a10
        type: reading
        question: lim(x→0) (e^x - 1)/x =
        correctAnswer: "1"
