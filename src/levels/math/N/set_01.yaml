title: Limites — Substituição Direta
level: N
example: "Calcule o limite substituindo. Ex.: lim(x→2) (x² + 1) = 5"
subject: math
pages:
  - pageNumber: 1
    title: Limites Polinomiais
    description: Avalie substituindo o valor de x.
    exercises:
      - { type: calculus, question: "lim(x→2) x² =", correctAnswer: 4 }
      - { type: calculus, question: "lim(x→3) x² =", correctAnswer: 9 }
      - { type: calculus, question: "lim(x→2) (x² + 1) =", correctAnswer: 5 }
      - { type: calculus, question: "lim(x→1) (x² + 2x) =", correctAnswer: 3 }
      - { type: calculus, question: "lim(x→4) (x² - x) =", correctAnswer: 12 }
      - { type: calculus, question: "lim(x→0) (x² + 3x + 2) =", correctAnswer: 2 }
      - { type: calculus, question: "lim(x→-1) x² =", correctAnswer: 1 }
      - { type: calculus, question: "lim(x→2) x³ =", correctAnswer: 8 }
      - { type: calculus, question: "lim(x→3) (x² - 4) =", correctAnswer: 5 }
      - { type: calculus, question: "lim(x→5) (x - 3) =", correctAnswer: 2 }
  - pageNumber: 2
    title: Limites Racionais (sem indeterminação)
    description: Avalie substituindo diretamente.
    exercises:
      - { type: calculus, question: "lim(x→2) (x+1)/(x-1) =", correctAnswer: 3 }
      - { type: calculus, question: "lim(x→1) (x²+1)/x =", correctAnswer: 2 }
      - { type: calculus, question: "lim(x→1) (x+3)/(x+1) =", correctAnswer: 2 }
      - { type: calculus, question: "lim(x→0) (x+2)/(x+1) =", correctAnswer: 2 }
      - { type: calculus, question: "lim(x→3) (x²-1)/(x+1) =", correctAnswer: 2 }
      - { type: calculus, question: "lim(x→5) (x²-1)/(x-1) =", correctAnswer: 6 }
      - { type: calculus, question: "lim(x→0) (x²+4x)/x =", correctAnswer: 4 }
      - { type: calculus, question: "lim(x→2) (x²+x)/x =", correctAnswer: 3 }
      - { type: calculus, question: "lim(x→4) (x+2) =", correctAnswer: 6 }
      - { type: calculus, question: "lim(x→-2) (x²+4) =", correctAnswer: 8 }
  - pageNumber: 3
    title: Indeterminação 0/0 — Fatoração
    description: Fatore para eliminar a indeterminação.
    exercises:
      - { type: calculus, question: "lim(x→1) (x²-1)/(x-1) =", correctAnswer: 2 }
      - { type: calculus, question: "lim(x→2) (x²-4)/(x-2) =", correctAnswer: 4 }
      - { type: calculus, question: "lim(x→3) (x²-9)/(x-3) =", correctAnswer: 6 }
      - { type: calculus, question: "lim(x→-1) (x²-1)/(x+1) =", correctAnswer: -2 }
      - { type: calculus, question: "lim(x→0) x²/x =", correctAnswer: 0 }
      - { type: calculus, question: "lim(x→2) (x²-x-2)/(x-2) =", correctAnswer: 3 }
      - { type: calculus, question: "lim(x→1) (x³-1)/(x-1) =", correctAnswer: 3 }
      - { type: calculus, question: "lim(x→4) (x²-16)/(x-4) =", correctAnswer: 8 }
      - { type: calculus, question: "lim(x→-2) (x²-4)/(x+2) =", correctAnswer: -4 }
      - { type: calculus, question: "lim(x→5) (x²-25)/(x-5) =", correctAnswer: 10 }
target: 30
