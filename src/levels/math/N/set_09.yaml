title: Continuidade — Conjunto 9
level: N
example: "Conceitos básicos de limites. Ex.: lim(x→2) (x² - 4)/(x - 2) = 4"
subject: math
difficulty: 5
objectives:
  - math.differential_calculus
authorNotes: Conjunto de math/N.
inputType: number
pages:
  - pageNumber: 1
    title: Continuidade — Conjunto 9 – Página 1
    description: Calcule o limite das funções.
    exercises:
      - type: quadratic
        question: lim(x→1) (x² - 36)/(x - 6) = ?
        correctAnswer: "7"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→-4) (x² - 4)/(x - 2) = ?
        correctAnswer: "-2"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→-1) (x² - 81)/(x - -9) = ?
        correctAnswer: "-10"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→4) (x² - 100)/(x - -10) = ?
        correctAnswer: "-6"
        rationale: "Ex.: lim(x→2) x² = 4 — substituição direta."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→2) (x² - 100)/(x - -10) = ?
        correctAnswer: "-8"
        rationale: "Se denominador → 0 e numerador ≠ 0: limite infinito."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→0) (-1x^2 + -4x + -1) = ?
        correctAnswer: "-1"
        rationale: "Limite por substituição direta quando f é contínua no ponto."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→1) (x² - 25)/(x - 5) = ?
        correctAnswer: "6"
        rationale: "Forma 0/0: fatore e cancele o fator comum."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→3) (x² - 49)/(x - 7) = ?
        correctAnswer: "10"
        rationale: "L'Hôpital: 0/0 ou ∞/∞ → derive numerador e denominador."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→1) (x² - 16)/(x - 4) = ?
        correctAnswer: "5"
        rationale: "Derivada de x^n: n·x^(n-1)."
        difficulty: 4
        objectives: [math.differential_calculus]
      - type: quadratic
        question: lim(x→1) (x² - 64)/(x - -8) = ?
        correctAnswer: "-7"
        rationale: "Derivada da soma = soma das derivadas."
        difficulty: 4
        objectives: [math.differential_calculus]
