        rationale: retângulo tem 4 lados — conte ao redor da figura.
        difficulty: 1
        objectives:
          - math.addition.basic
      - type: geometry
        question: Quantos lados tem um pentágono?
        correctAnswer: 5
        rationale: pentágono tem 5 lados — conte ao redor da figura.
        difficulty: 1
        objectives:
          - math.addition.basic
      - type: geometry
        question: Quantos lados tem um hexágono?
        correctAnswer: 6
        rationale: hexágono tem 6 lados — conte ao redor da figura.
        difficulty: 1
        objectives:
          - math.addition.basic
      - type: geometry
        question: Quantos cantos tem um triângulo?
