title: Revisão Geral + Formas Geométricas
level: 4A
example: "Resolva perguntas e reconheça formas. Ex.: Quantos lados tem um triângulo? 3"
subject: math
difficulty: 1
objectives:
  - math.addition.basic
authorNotes: "Revisão geral do nível. Mistura os tópicos principais para consolidar fluência."
passCriteria:
  minAccuracyPercent: 90
  maxAvgSecondsPerExercise: 6
pages:
  - pageNumber: 1
    title: Formas Geométricas — Lados e Cantos
    description: Conte lados e cantos das formas.
    exercises:
      - type: geometry
        question: Quantos lados tem um triângulo?
        correctAnswer: 3
        rationale: "Responda conforme a pergunta."
        difficulty: 1
        objectives: [math.addition.basic]
      - type: geometry
        question: Quantos lados tem um quadrado?
        correctAnswer: 4
        rationale: "Analise os dados e aplique a operação pedida."
        difficulty: 1
        objectives: [math.addition.basic]
      - type: geometry
        question: Quantos lados tem um retângulo?
        correctAnswer: 4
        rationale: "Responda conforme a pergunta."
        difficulty: 1
        objectives: [math.addition.basic]
      - type: geometry
        question: Quantos lados tem um pentágono?
        correctAnswer: 5
        rationale: "Leia com atenção e escolha a operação adequada."
        difficulty: 1
        objectives: [math.addition.basic]
      - type: geometry
        question: Quantos lados tem um hexágono?
        correctAnswer: 6
        rationale: "Analise os dados e aplique a operação pedida."
        difficulty: 1
        objectives: [math.addition.basic]
      - type: geometry
        question: Quantos cantos tem um triângulo?
        correctAnswer: 3
