        objectives: [math.addition.basic]
      - type: geometry
        question: Quantos cantos tem um quadrado?
        correctAnswer: 4
        rationale: "Analise os dados e aplique a operação pedida."
        difficulty: 1
        objectives: [math.addition.basic]
      - type: geometry
        question: Quantos lados tem um círculo?
        correctAnswer: 0
        rationale: "Se tiver 'a mais/juntos' → soma; 'perdeu/sobrou' → subtração."
        difficulty: 1
        objectives: [math.addition.basic]
      - type: geometry
        question: Quantos cantos tem um círculo?
        correctAnswer: 0
        rationale: "Verifique: o resultado responde à pergunta?"
        difficulty: 1
        objectives: [math.addition.basic]
      - type: geometry
        question: Quantos lados tem um octógono?
        correctAnswer: 8
        rationale: "Releia o enunciado; marque números e palavras-chave."
        difficulty: 1
        objectives: [math.addition.basic]
