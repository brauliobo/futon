  - pageNumber: 9
    title: Poder do Teste — prática 1
    description: "Poder = P(rejeitar H₀ | H₁ verdadeira) = 1 - β."
    exercises:
      - type: mental_math
        question: β = P(erro tipo II); poder = 1 - β; se β=0.2 → poder = ?
        correctAnswer: 0.8
        rationale: Poder = 1 - 0.2 = 0.8.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: Aumentar n → poder do teste (aumenta/diminui)?
        correctAnswer: aumenta
        rationale: n maior → SE menor → mais fácil detectar diferença real.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: Efeito maior → poder (aumenta/diminui)?
        correctAnswer: aumenta
        rationale: Diferença real maior é mais fácil de detectar.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: Poder ideal ≥ (0.5/0.8/0.95)?
        correctAnswer: 0.8
        rationale: Convenciona-se poder ≥ 0.80 como adequado.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: β=0.1 → poder = ?
        correctAnswer: 0.9
        rationale: Poder = 1 - β = 1 - 0.1 = 0.9.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
