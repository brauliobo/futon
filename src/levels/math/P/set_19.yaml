  - pageNumber: 7
    title: Estatística de Teste z — prática 1
    description: "z = (x̄ - μ₀) / (σ/√n)."
    exercises:
      - type: mental_math
        question: x̄=52, μ₀=50, σ=10, n=100 → z = (52-50)/(10/10) = ?
        correctAnswer: 2
        rationale: z = 2/1 = 2.
        difficulty: 4
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: z=2.0, α=0.05 bilateral → valor crítico z crítico = ? (1.64/1.96/2.58)
        correctAnswer: 1.96
        rationale: Bilateral α=0.05 → z crítico = 1.96.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: z=2.0 > z_crit=1.96 → decisão? (rejeitar/não rejeitar H₀)
        correctAnswer: rejeitar
        rationale: z calculado na região de rejeição → rejeitar H₀.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: x̄=50, μ₀=50 → z = ?
        correctAnswer: 0
        rationale: z = (50-50)/(qualquer SE) = 0; sem evidência contra H₀.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: |z| grande indica resultado (improvável/provável) se H₀ for verdadeira?
        correctAnswer: improvável
        rationale: |z| grande → p pequeno → evidência contra H₀.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
