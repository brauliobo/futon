  - pageNumber: 3
    title: Nível de Significância α — prática 1
    description: α = probabilidade de erro tipo I.
    exercises:
      - type: mental_math
        question: α=0.05 significa 5% de chance de (rejeitar H₀ sendo/aceitar H₁ sendo)?
        correctAnswer: rejeitar H₀ sendo
        rationale: α = P(rejeitar H₀ | H₀ verdadeira) = erro tipo I.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: Erro tipo I = rejeitar H₀ sendo ela (verdadeira/falsa)?
        correctAnswer: verdadeira
        rationale: Falso positivo → rejeitar H₀ quando deveria aceitar.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: Erro tipo II = não rejeitar H₀ sendo ela (verdadeira/falsa)?
        correctAnswer: falsa
        rationale: Falso negativo → não detectar efeito real.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: α mais baixo → erro tipo I (aumenta/diminui)?
        correctAnswer: diminui
        rationale: Diminuir α reduz erro tipo I mas aumenta erro tipo II.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: α típico em ciências sociais = ? (0.01/0.05/0.10)
        correctAnswer: 0.05
        rationale: α=0.05 (5%) é o padrão mais comum em ciências sociais.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
