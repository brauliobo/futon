  - pageNumber: 5
    title: P-valor — prática 1
    description: P-valor = P(resultado tão extremo | H₀ verdadeira).
    exercises:
      - type: mental_math
        question: p=0.03, α=0.05 → decisão? (rejeitar/não rejeitar H₀)
        correctAnswer: rejeitar
        rationale: p < α → rejeita H₀.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: p=0.10, α=0.05 → decisão? (rejeitar/não rejeitar H₀)
        correctAnswer: não rejeitar
        rationale: p > α → não rejeita H₀.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: p=0.001, α=0.01 → decisão?
        correctAnswer: rejeitar
        rationale: 0.001 < 0.01 → rejeita H₀ com alta significância.
        difficulty: 3
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: p=0.05, α=0.05 → decisão? (rejeitar/não rejeitar — borderline)
        correctAnswer: não rejeitar
        rationale: p = α; convencionalmente não se rejeita no limite exato.
        difficulty: 4
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: p menor → evidência (mais/menos) forte contra H₀?
        correctAnswer: mais
        rationale: p muito pequeno → resultado improvável se H₀ fosse verdadeira.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
