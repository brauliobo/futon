title: Teste de Hipóteses — Básico
level: P
subject: math
authorNotes: Teste de Hipóteses — Básico. Foque no conceito central do conjunto e nos erros comuns.
inputType: text
difficulty: 5
objectives:
  - stats.hypothesis_testing
example: "H₀ vs H₁; p-valor < α → rejeitar H₀. Ex.: p=0.03 < α=0.05 → rejeita H₀."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Hipóteses H₀ e H₁ — prática 1
    description: Formule H₀ (nula) e H₁ (alternativa).
    exercises:
      - type: mental_math
        question: H₀ representa a hipótese (nula/alternativa)?
        correctAnswer: nula
        rationale: H₀ é a hipótese nula — status quo a ser testado.
        difficulty: 1
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: H₁ representa a hipótese (nula/alternativa)?
        correctAnswer: alternativa
        rationale: H₁ é a hipótese alternativa — o que queremos mostrar.
        difficulty: 1
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: "Teste bilateral: H₁: μ ≠ μ₀ é (bilateral/unilateral)?"
        correctAnswer: bilateral
        rationale: Sinal ≠ indica teste em ambos os lados da distribuição.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: "Teste unilateral direito: H₁: μ > μ₀ é (bilateral/unilateral)?"
        correctAnswer: unilateral
        rationale: Sinal > indica teste apenas no lado direito.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
      - type: mental_math
        question: Rejeitamos H₀ quando p-valor (< ou >) α?
        correctAnswer: <
        rationale: p-valor < α → evidência suficiente para rejeitar H₀.
        difficulty: 2
        objectives:
          - stats.hypothesis_testing
