        correctAnswer: 1.25
        rationale: "Desvio padrão = √variância."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Valores 3 (f=2) e 7 (f=2) — média = ?
        correctAnswer: 5
        rationale: "Combinação C(n,k) = n!/(k!(n-k)!) — ordem não importa."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Valores 5 (f=4) — média = ?
        correctAnswer: 5
        rationale: "Arranjo A(n,k) = n!/(n-k)! — ordem importa."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: "Média ponderada com pesos iguais é: (média simples)"
        correctAnswer: sim
        rationale: "Permutação de n distintos: n!."
        difficulty: 3
        objectives: [stats, prob]
  - pageNumber: 3
    title: Probabilidade Básica
    description: Aplicação direta.
    exercises:
      - type: mental_math
        question: Dado — P(face par) = ?
        correctAnswer: 1/2
        rationale: "Princípio multiplicativo: m·n opções combinadas."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Dado — P(maior que 3) = ?
        correctAnswer: 1/2
        rationale: "P(A) = casos favoráveis / casos totais (equiprováveis)."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Moeda lançada 3 vezes — P(3 caras) = ?
        correctAnswer: 1/8
        rationale: "P(A ∪ B) = P(A) + P(B) - P(A ∩ B)."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Baralho (52) — P(carta vermelha) = ?
        correctAnswer: 1/2
        rationale: "Eventos independentes: P(A ∩ B) = P(A) · P(B)."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Baralho — P(figura — valete/dama/rei) = 12/52 = ?
        correctAnswer: 3/13
        rationale: "P(A|B) = P(A ∩ B)/P(B) (probabilidade condicional)."
        difficulty: 3
        objectives: [stats, prob]
