title: Probabilidade & Estatística - Revisão Integrada
level: P
subject: math
authorNotes: "Probabilidade & Estatística - Revisão Integrada. Foque no conceito central do conjunto e nos erros comuns."
inputType: number
difficulty: 4
objectives:
  - stats
  - prob
example: Combina tendência central, dispersão, probabilidade.
pages:
  - pageNumber: 1
    title: Medidas Mistas
    description: Calcule múltiplas medidas.
    exercises:
      - type: mental_math
        question: "{2,4,6,8,10} — média = ?"
        correctAnswer: 6
        rationale: "Média aritmética = soma dos valores dividida pela quantidade."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Mesma lista — mediana = ?
        correctAnswer: 6
        rationale: "Mediana: valor central dos dados ordenados (ou média dos dois centrais)."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Mesma lista — amplitude = ?
        correctAnswer: 8
        rationale: "Amplitude = máximo − mínimo."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Mesma lista — moda? (amodal/2/6/10)
        correctAnswer: amodal
        rationale: "Moda: valor mais frequente; pode ser bimodal ou amodal."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Mesma lista — variância populacional (aprox) = ?
        correctAnswer: 8
        rationale: "Variância populacional: σ² = Σ(xᵢ−μ)² / n."
        difficulty: 3
        objectives: [stats, prob]
  - pageNumber: 2
    title: Dados Agrupados
    description: Trabalhe com frequências.
    exercises:
      - type: mental_math
        question: Valores 10 (f=2) e 20 (f=3) — média = ?
        correctAnswer: 16
        rationale: "Média ponderada = Σ(xᵢ·wᵢ) / Σwᵢ."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Valores 1 (f=3) e 2 (f=1) — média = ?
        correctAnswer: 1.25
        rationale: "Média ponderada = Σ(xᵢ·wᵢ) / Σwᵢ."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Valores 3 (f=2) e 7 (f=2) — média = ?
        correctAnswer: 5
        rationale: "Média ponderada = Σ(xᵢ·wᵢ) / Σwᵢ."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Valores 5 (f=4) — média = ?
        correctAnswer: 5
        rationale: "Média ponderada = Σ(xᵢ·wᵢ) / Σwᵢ."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: "Média ponderada com pesos iguais é: (média simples)"
        correctAnswer: sim
        rationale: "Média ponderada = Σ(xᵢ·wᵢ) / Σwᵢ."
        difficulty: 3
        objectives: [stats, prob]
  - pageNumber: 3
    title: Probabilidade Básica
    description: Aplicação direta.
    exercises:
      - type: mental_math
        question: Dado — P(face par) = ?
        correctAnswer: 1/2
        rationale: "P em um dado: (favoráveis em {1..6}) / 6."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Dado — P(maior que 3) = ?
        correctAnswer: 1/2
        rationale: "P em um dado: (favoráveis em {1..6}) / 6."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Moeda lançada 3 vezes — P(3 caras) = ?
        correctAnswer: 1/8
        rationale: "Eventos independentes: P(A∩B) = P(A)·P(B)."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Baralho (52) — P(carta vermelha) = ?
        correctAnswer: 1/2
        rationale: "Baralho padrão tem 52 cartas (13 valores × 4 naipes)."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Baralho — P(figura — valete/dama/rei) = 12/52 = ?
        correctAnswer: 3/13
        rationale: "Baralho padrão tem 52 cartas (13 valores × 4 naipes)."
        difficulty: 3
        objectives: [stats, prob]
  - pageNumber: 4
    title: Combinatória Aplicada
    description: Permutações e combinações.
    exercises:
      - type: mental_math
        question: "Fila de 5 pessoas: permutações?"
        correctAnswer: 120
        rationale: "Escolha com ordem (arranjo) ou sem ordem (combinação) conforme o contexto."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Escolher 2 de 6 alunos sem ordem?
        correctAnswer: 15
        rationale: "Ordem importa → arranjo A(n,k); não importa → combinação C(n,k)."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: 3 dígitos distintos entre 1-5?
        correctAnswer: 60
        rationale: "Escolha com ordem (arranjo) ou sem ordem (combinação) conforme o contexto."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Anagramas de SOL = ?
        correctAnswer: 6
        rationale: "Anagramas com letras repetidas: n! / (n₁!·n₂!·…)."
        difficulty: 3
        objectives: [stats, prob]
      - type: mental_math
        question: Anagramas de MAMA = ?
        correctAnswer: 6
        rationale: "Anagramas com letras repetidas: n! / (n₁!·n₂!·…)."
        difficulty: 3
        objectives: [stats, prob]
  - pageNumber: 5
    title: Complementar e União
    description: Misture os eventos.
    exercises:
      - type: mental_math
        question: P(A)=0.3 → P(Ā) = ?
        correctAnswer: 0.7
        rationale: "Complementar: P(Ā) = 1 − P(A); P(A) + P(Ā) = 1."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: P(A)=0.4, P(B)=0.5 exclusivos → P(A∪B) = ?
        correctAnswer: 0.9
        rationale: "Eventos mutuamente exclusivos: P(A∩B) = 0; P(A∪B) = P(A) + P(B)."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: P(A)=0.3, P(B)=0.5, P(A∩B)=0.1 → P(A∪B) = ?
        correctAnswer: 0.7
        rationale: "União: P(A∪B) = P(A) + P(B) − P(A∩B)."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: "Se P(A∩B)=0, eventos são: (mutuamente exclusivos/independentes)"
        correctAnswer: mutuamente exclusivos
        rationale: "Eventos mutuamente exclusivos: P(A∩B) = 0; P(A∪B) = P(A) + P(B)."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: P(A) + P(Ā) = ?
        correctAnswer: 1
        rationale: "Complementar: P(Ā) = 1 − P(A); P(A) + P(Ā) = 1."
        difficulty: 4
        objectives: [stats, prob]
  - pageNumber: 6
    title: Normal e Z-score
    description: Cálculos padronizados.
    exercises:
      - type: mental_math
        question: μ=50, σ=10 — z(60) = ?
        correctAnswer: 1
        rationale: "Padronização: z = (x − μ) / σ."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: μ=100, σ=20 — z(80) = ?
        correctAnswer: -1
        rationale: "Padronização: z = (x − μ) / σ."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: "% dentro de ±2σ ≈ ?%"
        correctAnswer: 95
        rationale: "Regra empírica: 95% dos dados ficam dentro de ±2σ."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: "% acima de média+2σ ≈ ?%"
        correctAnswer: 2.5
        rationale: "Média aritmética = soma dos valores dividida pela quantidade."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: Normal padrão — P(z>0) = ?
        correctAnswer: 0.5
        rationale: "Por simetria da normal padrão, P(z>0) = P(z<0) = 0,5."
        difficulty: 4
        objectives: [stats, prob]
  - pageNumber: 7
    title: Box Plot e Quartis
    description: Localize medidas.
    exercises:
      - type: mental_math
        question: Em {1,2,3,4,5,6,7,8}, Q1 = ?
        correctAnswer: 2.5
        rationale: "Q1: mediana da metade inferior dos dados ordenados."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: Mesma lista, Q3 = ?
        correctAnswer: 6.5
        rationale: "Q3: mediana da metade superior dos dados ordenados."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: IIQ = Q3 - Q1 = ?
        correctAnswer: 4
        rationale: "IIQ = Q3 − Q1; cercas em Q1−1,5·IIQ e Q3+1,5·IIQ."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: Mediana da mesma lista = ?
        correctAnswer: 4.5
        rationale: "Mediana: valor central dos dados ordenados (ou média dos dois centrais)."
        difficulty: 4
        objectives: [stats, prob]
      - type: mental_math
        question: Cerca superior = Q3 + 1.5·IIQ = ?
        correctAnswer: 12.5
        rationale: "IIQ = Q3 − Q1; cercas em Q1−1,5·IIQ e Q3+1,5·IIQ."
        difficulty: 4
        objectives: [stats, prob]
  - pageNumber: 8
    title: Outliers
    description: Detecção.
    exercises:
      - type: mental_math
        question: "Em {1,2,3,4,50}, o outlier é: ?"
        correctAnswer: 50
        rationale: "Outlier afeta a média; mediana é robusta a valores extremos."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: "Outlier afeta mais: (média/mediana)"
        correctAnswer: média
        rationale: "Outlier afeta a média; mediana é robusta a valores extremos."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: "Em z-score, |z|>3 é considerado: (outlier/normal)"
        correctAnswer: outlier
        rationale: "Outlier afeta a média; mediana é robusta a valores extremos."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: Mediana é robusta a outliers (V/F)?
        correctAnswer: V
        rationale: "Outlier afeta a média; mediana é robusta a valores extremos."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: Desvio padrão é sensível a outliers (V/F)?
        correctAnswer: V
        rationale: "Use a fórmula estatística padrão — aplique passo a passo."
        difficulty: 5
        objectives: [stats, prob]
  - pageNumber: 9
    title: Inferência Intuitiva
    description: Amostra e população.
    exercises:
      - type: mental_math
        question: "Parâmetro se refere a: (população/amostra)"
        correctAnswer: população
        rationale: "Parâmetro descreve a população (μ, σ); estatística descreve a amostra (x̄, s)."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: "Estatística se refere a: (população/amostra)"
        correctAnswer: amostra
        rationale: "Estatística descreve a amostra; parâmetro descreve a população."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: Amostra maior = estimativa (mais precisa/menos precisa)
        correctAnswer: mais precisa
        rationale: "Amostra maior → erro padrão menor → estimativa mais precisa."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: Erro padrão = σ/√n (V/F)?
        correctAnswer: V
        rationale: "Erro padrão da média: σₓ̄ = σ / √n."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: Intervalo de confiança 95% para média = média ± ?·erro padrão
        correctAnswer: 1.96
        rationale: "Erro padrão da média: σₓ̄ = σ / √n."
        difficulty: 5
        objectives: [stats, prob]
  - pageNumber: 10
    title: Revisão Final
    description: Problemas integrados.
    exercises:
      - type: mental_math
        question: "{5,10,15,20,25} — média = ?"
        correctAnswer: 15
        rationale: "Média aritmética = soma dos valores dividida pela quantidade."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: "{5,10,15,20,25} — σ populacional (aprox) = ?"
        correctAnswer: 7.07
        rationale: "Desvio padrão: σ = √variância; mede dispersão na mesma unidade dos dados."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: "{1,2,3,4} — mediana = ?"
        correctAnswer: 2.5
        rationale: "Mediana: valor central dos dados ordenados (ou média dos dois centrais)."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: Dado — P(1 ou 2) = ?
        correctAnswer: 1/3
        rationale: "União em dado: conte favoráveis em {1..6} subtraindo a interseção."
        difficulty: 5
        objectives: [stats, prob]
      - type: mental_math
        question: 2 moedas — P(pelo menos uma coroa) = ?
        correctAnswer: 3/4
        rationale: "Eventos independentes: P(A∩B) = P(A)·P(B)."
        difficulty: 5
        objectives: [stats, prob]
target: 50
