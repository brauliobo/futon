  - pageNumber: 7
    title: Propriedades da Variância — prática 1
    description: "Var(aX+b) = a²·Var(X)."
    exercises:
      - type: mental_math
        question: Var(X)=4 → Var(2X) = ?
        correctAnswer: 16
        rationale: Var(aX) = a²·Var(X) = 4×4 = 16.
        difficulty: 3
        objectives:
          - stats.variance
      - type: mental_math
        question: Var(X)=9 → Var(X+3) = ?
        correctAnswer: 9
        rationale: Somar constante não muda a variância.
        difficulty: 2
        objectives:
          - stats.variance
      - type: mental_math
        question: Var(X)=4 → Var(3X-2) = ?
        correctAnswer: 36
        rationale: Var(3X-2) = 9×4 = 36.
        difficulty: 3
        objectives:
          - stats.variance
      - type: mental_math
        question: Var(X)=4 → σ(2X) = ?
        correctAnswer: 4
        rationale: σ(2X) = 2×σ(X) = 2×2 = 4.
        difficulty: 3
        objectives:
          - stats.variance
      - type: mental_math
        question: X e Y independentes, Var(X)=3, Var(Y)=5 → Var(X+Y) = ?
        correctAnswer: 8
        rationale: Independentes → Var(X+Y) = Var(X)+Var(Y) = 8.
        difficulty: 3
        objectives:
          - stats.variance
