  - pageNumber: 3
    title: Variância Amostral — prática 1
    description: "s² = Σ(xᵢ-x̄)² / (n-1) — denominador menor para não subestimar."
    exercises:
      - type: mental_math
        question: "{2,4,6} — x̄=4; s² = [(4+0+4)]/(3-1) = ?"
        correctAnswer: 4
        rationale: 8/2 = 4.
        difficulty: 3
        objectives:
          - stats.variance
      - type: mental_math
        question: "{1,3} — x̄=2; s² = [(1+1)]/(2-1) = ?"
        correctAnswer: 2
        rationale: 2/1 = 2.
        difficulty: 3
        objectives:
          - stats.variance
      - type: mental_math
        question: "{0,2,4} — x̄=2; s² = [(4+0+4)]/2 = ?"
