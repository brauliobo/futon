        difficulty: 3
        objectives:
          - stats.variance
      - type: mental_math
        question: "{3,5,7,9} — x̄=6; s² = [(9+1+1+9)]/3 = ?"
        correctAnswer: 6.667
        rationale: 20/3 ≈ 6.667.
        difficulty: 4
        objectives:
          - stats.variance
      - type: mental_math
        question: Por que dividir por n-1 em vez de n na amostra? (para / evitar)
        correctAnswer: evitar
        rationale: Divide por n-1 para evitar subestimação da variância da população.
        difficulty: 3
        objectives:
          - stats.variance
