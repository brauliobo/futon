title: Variância e Desvio Padrão Amostral
level: P
subject: math
authorNotes: Variância e Desvio Padrão Amostral. Foque no conceito central do conjunto e nos erros comuns.
inputType: number
difficulty: 4
objectives:
  - stats.variance
example: "s² = Σ(xᵢ-x̄)² / (n-1). Ex.: {2,4,6} → x̄=4; (2-4)² + (4-4)² + (6-4)² = 4+0+4 = 8; s²=8/2=4; s=2."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Variância Populacional — prática 1
    description: "σ² = Σ(xᵢ-μ)² / n."
    exercises:
      - type: mental_math
        question: "{2,4,6} — μ=4; σ² = [(2-4)²+(4-4)²+(6-4)²]/3 = ?"
        correctAnswer: 2.667
        rationale: (4+0+4)/3 = 8/3 ≈ 2.667.
        difficulty: 3
        objectives:
          - stats.variance
      - type: mental_math
        question: "{1,1,1} — σ² = ?"
        correctAnswer: 0
        rationale: Todos iguais → desvios = 0 → σ² = 0.
        difficulty: 1
        objectives:
          - stats.variance
      - type: mental_math
        question: "{0,10} — μ=5; σ² = [(0-5)²+(10-5)²]/2 = ?"
        correctAnswer: 25
        rationale: (25+25)/2 = 25.
        difficulty: 3
        objectives:
          - stats.variance
      - type: mental_math
        question: "{2,2,8,8} — μ=5; σ² = [(9+9+9+9)]/4 = ?"
        correctAnswer: 9
        rationale: Cada desvio = ±3; (9+9+9+9)/4 = 36/4 = 9.
        difficulty: 3
        objectives:
          - stats.variance
      - type: mental_math
        question: "{5,5,5,5,5} — σ² = ?"
        correctAnswer: 0
        rationale: Sem variação → σ² = 0.
        difficulty: 1
        objectives:
          - stats.variance
