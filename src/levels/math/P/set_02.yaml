        difficulty: 1
        objectives:
          - stats.dispersion
      - type: mental_math
        question: Desvio de 2 em relação a 4 = ?
        correctAnswer: -2
        rationale: Desvio = valor − média = 2 − 4 = -2.
        difficulty: 1
        objectives:
          - stats.dispersion
      - type: mental_math
        question: Desvio de 6 em relação a 4 = ?
        correctAnswer: 2
