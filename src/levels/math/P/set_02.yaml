title: Medidas de Dispersão
level: P
subject: math
authorNotes: "Medidas de Dispersão. Foque no conceito central do conjunto e nos erros comuns."
inputType: number
difficulty: 2
objectives:
  - stats.dispersion
example: "Variância, desvio padrão, amplitude. Ex.: Amplitude de {2,5,9} = ? → 7."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Amplitude
    description: Máximo - mínimo.
    exercises:
      - type: mental_math
        question: Amplitude de {2,5,9} = ?
        correctAnswer: 7
        rationale: "Amplitude = máx − mín = 9 − 2 = 7."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Amplitude de {10,20,30,40,50} = ?
        correctAnswer: 40
        rationale: "Amplitude = máx − mín = 50 − 10 = 40."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Amplitude de {7,7,7} = ?
        correctAnswer: 0
        rationale: "Amplitude = máx − mín = 7 − 7 = 0."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Amplitude de {1,100} = ?
        correctAnswer: 99
        rationale: "Amplitude = máx − mín = 100 − 1 = 99."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Amplitude de {-3, 5} = ?
        correctAnswer: 8
        rationale: "Amplitude = máx − mín = 5 − -3 = 8."
        difficulty: 1
        objectives: [stats.dispersion]
  - pageNumber: 2
    title: Desvios em Relação à Média
    description: d_i = x_i - média.
    exercises:
      - type: mental_math
        question: Média de {2,4,6} = ?
        correctAnswer: 4
        rationale: "Média = soma(2+4+6) / 3 = 12/3 = 4."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Desvio de 2 em relação a 4 = ?
        correctAnswer: -2
        rationale: "Desvio = valor − média = 2 − 4 = -2."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Desvio de 6 em relação a 4 = ?
        correctAnswer: 2
        rationale: "Desvio = valor − média = 6 − 4 = 2."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Soma dos desvios de {2,4,6} em relação à média = ?
        correctAnswer: 0
        rationale: "Soma dos desvios em relação à média é sempre 0 (positivos e negativos se cancelam)."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: "Soma dos desvios em relação à média é sempre: (zero/positiva/negativa)"
        correctAnswer: zero
        rationale: "Desvio dᵢ = xᵢ − média; soma dos desvios em relação à média = 0."
        difficulty: 1
        objectives: [stats.dispersion]
  - pageNumber: 3
    title: Variância Populacional
    description: Média dos quadrados dos desvios.
    exercises:
      - type: mental_math
        question: Quadrado do desvio -2 = ?
        correctAnswer: 4
        rationale: "Quadrado do desvio: (xᵢ − média)²; base do cálculo da variância."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Quadrado do desvio 2 = ?
        correctAnswer: 4
        rationale: "Quadrado do desvio: (xᵢ − média)²; base do cálculo da variância."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Soma dos quadrados dos desvios de {2,4,6} = ?
        correctAnswer: 8
        rationale: "Quadrado do desvio: (xᵢ − média)²; base do cálculo da variância."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Variância de {2,4,6} (divisão por n) = ?
        correctAnswer: 2.67
        rationale: "Use a fórmula estatística padrão — aplique passo a passo."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Variância de {5,5,5,5} = ?
        correctAnswer: 0
        rationale: "Use a fórmula estatística padrão — aplique passo a passo."
        difficulty: 1
        objectives: [stats.dispersion]
  - pageNumber: 4
    title: Desvio Padrão
    description: Raiz quadrada da variância.
    exercises:
      - type: mental_math
        question: Desvio padrão de {5,5,5,5} = ?
        correctAnswer: 0
        rationale: "Use a fórmula estatística padrão — aplique passo a passo."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Desvio padrão de {2,4,6,8,10} (aprox) = ?
        correctAnswer: 2.83
        rationale: "Use a fórmula estatística padrão — aplique passo a passo."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Se variância = 9, desvio padrão = ?
        correctAnswer: 3
        rationale: "Variância: média dos quadrados dos desvios em relação à média."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Se variância = 16, desvio padrão = ?
        correctAnswer: 4
        rationale: "Variância: média dos quadrados dos desvios em relação à média."
        difficulty: 1
        objectives: [stats.dispersion]
      - type: mental_math
        question: Desvio padrão sempre é (positivo/negativo/nulo)
        correctAnswer: positivo
        rationale: "Use a fórmula estatística padrão — aplique passo a passo."
        difficulty: 1
        objectives: [stats.dispersion]
  - pageNumber: 5
    title: Comparação de Conjuntos
    description: Dispersão mede variabilidade.
    exercises:
      - type: mental_math
        question: "{5,5,5,5} vs {1,2,3,4,5}: maior dispersão?"
        correctAnswer: segundo conjunto
        rationale: "Conjuntos de mesma média podem ter dispersões diferentes (variância distinta)."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: Mesma média, mas dispersões diferentes é possível? (sim/não)
        correctAnswer: sim
        rationale: "Conjuntos de mesma média podem ter dispersões diferentes (variância distinta)."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: "Desvio padrão menor significa dados: (mais próximos da média/mais espalhados)"
        correctAnswer: mais próximos da média
        rationale: "Use a fórmula estatística padrão — aplique passo a passo."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: Amplitude de {10,11,12} = ?
        correctAnswer: 2
        rationale: "Amplitude = máx − mín = 12 − 10 = 2."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: Amplitude de {1,10,20} = ?
        correctAnswer: 19
        rationale: "Amplitude = máx − mín = 20 − 1 = 19."
        difficulty: 2
        objectives: [stats.dispersion]
  - pageNumber: 6
    title: Coeficiente de Variação
    description: CV = desvio padrão / média.
    exercises:
      - type: mental_math
        question: Se σ=4 e média=10, CV = ?
        correctAnswer: 0.4
        rationale: "Coeficiente de variação: CV = σ / média (adimensional)."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: CV em porcentagem para σ=4 e média=10 = ?%
        correctAnswer: 40
        rationale: "Frequência relativa em %: (f/n)·100."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: "CV=0 significa: (dados iguais/média zero)"
        correctAnswer: dados iguais
        rationale: "Coeficiente de variação: CV = σ / média (adimensional)."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: "CV alto indica: (alta variabilidade/baixa variabilidade)"
        correctAnswer: alta variabilidade
        rationale: "Coeficiente de variação: CV = σ / média (adimensional)."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: Se σ=5 e média=25, CV = ?
        correctAnswer: 0.2
        rationale: "Coeficiente de variação: CV = σ / média (adimensional)."
        difficulty: 2
        objectives: [stats.dispersion]
  - pageNumber: 7
    title: Quartis
    description: Q1, Q2 (mediana), Q3.
    exercises:
      - type: mental_math
        question: Em {1,2,3,4,5,6,7,8}, mediana = ?
        correctAnswer: 4.5
        rationale: "Mediana: valor central dos dados ordenados (ou média dos dois centrais)."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: Em {1,2,3,4,5,6,7,8}, Q1 = ?
        correctAnswer: 2.5
        rationale: "Q1: mediana da metade inferior dos dados ordenados."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: Em {1,2,3,4,5,6,7,8}, Q3 = ?
        correctAnswer: 6.5
        rationale: "Q3: mediana da metade superior dos dados ordenados."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: Intervalo interquartil (IIQ) = Q3 - Q1
        correctAnswer: 4
        rationale: "IIQ = Q3 − Q1; cercas em Q1−1,5·IIQ e Q3+1,5·IIQ."
        difficulty: 2
        objectives: [stats.dispersion]
      - type: mental_math
        question: IIQ robusto a outliers? (sim/não)
        correctAnswer: sim
        rationale: "IIQ = Q3 − Q1; cercas em Q1−1,5·IIQ e Q3+1,5·IIQ."
        difficulty: 2
        objectives: [stats.dispersion]
  - pageNumber: 8
    title: Box Plot
    description: Representa quartis e outliers.
    exercises:
      - type: mental_math
        question: "Em box plot, a caixa representa: (Q1 a Q3/Min a Max/Q1 a Q2)"
        correctAnswer: Q1 a Q3
        rationale: "Q1: mediana da metade inferior dos dados ordenados."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: "Linha no meio da caixa representa: (mediana/média/moda)"
        correctAnswer: mediana
        rationale: "Box plot: caixa Q1–Q3, linha na mediana, cercas em Q±1,5·IIQ."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: "Pontos fora das 'cercas' são: (outliers/medianas/quartis)"
        correctAnswer: outliers
        rationale: "Box plot: caixa Q1–Q3, linha na mediana, cercas em Q±1,5·IIQ."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: Cercas superior = Q3 + 1.5·IIQ (V/F)?
        correctAnswer: V
        rationale: "IIQ = Q3 − Q1; cercas em Q1−1,5·IIQ e Q3+1,5·IIQ."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: "Box plot simétrico sugere: (distribuição simétrica/assimétrica)"
        correctAnswer: distribuição simétrica
        rationale: "Box plot: caixa Q1–Q3, linha na mediana, cercas em Q±1,5·IIQ."
        difficulty: 3
        objectives: [stats.dispersion]
  - pageNumber: 9
    title: Amostral vs Populacional
    description: Amostral divide por n-1.
    exercises:
      - type: mental_math
        question: "Variância populacional divide por: (n/n-1/n+1)"
        correctAnswer: n
        rationale: "Variância populacional divide por n; amostral por n−1 (correção de Bessel)."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: "Variância amostral divide por: (n/n-1/n+1)"
        correctAnswer: n-1
        rationale: "Variância populacional divide por n; amostral por n−1 (correção de Bessel)."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: Para {2,4,6} — variância populacional = ?
        correctAnswer: 2.67
        rationale: "Variância populacional: σ² = Σ(xᵢ−μ)² / n."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: Para {2,4,6} — variância amostral = ?
        correctAnswer: 4
        rationale: "Variância amostral: s² = Σ(xᵢ−x̄)² / (n−1)."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: Desvio padrão amostral de {2,4,6} (aprox) = ?
        correctAnswer: 2
        rationale: "Use a fórmula estatística padrão — aplique passo a passo."
        difficulty: 3
        objectives: [stats.dispersion]
  - pageNumber: 10
    title: Revisão Integrada
    description: Dispersão aplicada.
    exercises:
      - type: mental_math
        question: "{10,10,10,10} tem desvio padrão = ?"
        correctAnswer: 0
        rationale: "Desvio padrão: σ = √variância; mede dispersão na mesma unidade dos dados."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: "{0,10,20} amplitude = ?"
        correctAnswer: 20
        rationale: "Amplitude = máximo − mínimo."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: "{0,10,20} média = ?"
        correctAnswer: 10
        rationale: "Média aritmética = soma dos valores dividida pela quantidade."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: "{0,10,20} variância populacional = ?"
        correctAnswer: 66.67
        rationale: "Variância populacional: σ² = Σ(xᵢ−μ)² / n."
        difficulty: 3
        objectives: [stats.dispersion]
      - type: mental_math
        question: "{0,10,20} desvio padrão (aprox) = ?"
        correctAnswer: 8.16
        rationale: "Desvio padrão: σ = √variância; mede dispersão na mesma unidade dos dados."
        difficulty: 3
        objectives: [stats.dispersion]
target: 50
