      - type: mental_math
        question: Soma dos desvios de {2,4,6} em relação à média = ?
        correctAnswer: 0
        rationale: Soma dos desvios em relação à média é sempre 0 (positivos e negativos
          se cancelam).
        difficulty: 1
        objectives:
          - stats.dispersion
      - type: mental_math
        question: "Soma dos desvios em relação à média é sempre:
