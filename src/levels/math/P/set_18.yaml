title: Análise de Dados — Gráficos
level: P
subject: math
authorNotes: Análise de Dados — Gráficos. Foque no conceito central do conjunto e nos erros comuns.
inputType: text
difficulty: 3
objectives:
  - stats.data_analysis
example: "Histograma → distribuição de frequências. Boxplot → quartis e outliers. Ex.: mediana = Q2."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Tipos de Gráficos — prática 1
    description: Identifique o gráfico adequado para cada situação.
    exercises:
      - type: mental_math
        question: "Frequência de idades contínuas — melhor gráfico? (linha/histograma/pizza)"
        correctAnswer: histograma
        rationale: Histograma é ideal para distribuição de variáveis contínuas.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Proporção de votos por partido — melhor gráfico? (histograma/pizza/barras)
        correctAnswer: pizza
        rationale: Gráfico de pizza mostra partes de um todo.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: "Evolução de temperatura ao longo do tempo — melhor gráfico? (pizza/linha/histograma)"
        correctAnswer: linha
        rationale: Gráfico de linha é ideal para séries temporais.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Comparar vendas de 5 produtos — melhor gráfico? (barras/linha/pizza)
        correctAnswer: barras
        rationale: Gráfico de barras compara categorias discretas.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Relação entre altura e peso de 100 pessoas — melhor gráfico? (dispersão/barras/pizza)
        correctAnswer: dispersão
        rationale: Diagrama de dispersão mostra relação entre duas variáveis quantitativas.
        difficulty: 2
        objectives:
          - stats.data_analysis
