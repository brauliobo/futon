  - pageNumber: 7
    title: Percentis e Quartis — prática 1
    description: "Percentil P_k: k% dos dados estão abaixo."
    exercises:
      - type: mental_math
        question: Q1 corresponde ao percentil = ?
        correctAnswer: 25
        rationale: Q1 = 25º percentil.
        difficulty: 1
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Q3 corresponde ao percentil = ?
        correctAnswer: 75
        rationale: Q3 = 75º percentil.
        difficulty: 1
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Mediana corresponde ao percentil = ?
        correctAnswer: 50
        rationale: Mediana = Q2 = 50º percentil.
        difficulty: 1
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: "{1,2,3,4,5,6,7,8} — Q1 (posição 2) = ?"
        correctAnswer: 2
        rationale: Q1 = valor na posição (n+1)/4 ≈ posição 2 = 2.
        difficulty: 3
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: "{1,2,3,4,5,6,7,8} — Q3 (posição 6) = ?"
        correctAnswer: 6
        rationale: Q3 = valor na posição 3(n+1)/4 ≈ posição 6 = 6.
        difficulty: 3
        objectives:
          - stats.data_analysis
