  - pageNumber: 5
    title: Boxplot — prática 1
    description: "Q1, Q2 (mediana), Q3, IQR = Q3-Q1."
    exercises:
      - type: mental_math
        question: Boxplot — Q2 é a (mediana/moda/média)?
        correctAnswer: mediana
        rationale: Q2 = 50º percentil = mediana.
        difficulty: 1
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Q1=10, Q3=20 → IQR = ?
        correctAnswer: 10
        rationale: IQR = Q3-Q1 = 20-10 = 10.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Outlier inferior = Q1 - 1.5×IQR; Q1=10, IQR=10 → limite = ?
        correctAnswer: -5
        rationale: 10 - 15 = -5.
        difficulty: 3
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Outlier superior = Q3 + 1.5×IQR; Q3=20, IQR=10 → limite = ?
        correctAnswer: 35
        rationale: 20 + 15 = 35.
        difficulty: 3
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Caixa do boxplot contém (50/25/75)% dos dados?
        correctAnswer: 50
        rationale: A caixa vai de Q1 a Q3 = 50% central dos dados.
        difficulty: 2
        objectives:
          - stats.data_analysis
