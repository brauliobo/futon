  - pageNumber: 9
    title: Distorções em Gráficos — prática 1
    description: Identifique armadilhas visuais comuns.
    exercises:
      - type: mental_math
        question: Eixo y começando em 90 ao invés de 0 — tende a (exagerar/diminuir) diferenças?
        correctAnswer: exagerar
        rationale: Eixo truncado amplifica visualmente as variações.
        difficulty: 3
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Gráfico de pizza com fatias 3D — facilita ou (dificulta) comparação?
        correctAnswer: dificulta
        rationale: Perspectiva 3D distorce as proporções reais.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Escala logarítmica no eixo y — crescimento exponencial parece (linear/exponencial)?
        correctAnswer: linear
        rationale: Escala log transforma crescimento exponencial em reta.
        difficulty: 3
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Correlação entre variáveis implica (causalidade/associação)?
        correctAnswer: associação
        rationale: Correlação ≠ causalidade; pode haver variável de confusão.
        difficulty: 3
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Amostra de conveniência pode gerar (viés/representatividade)?
        correctAnswer: viés
        rationale: Amostra não aleatória pode não representar a população.
        difficulty: 2
        objectives:
          - stats.data_analysis
