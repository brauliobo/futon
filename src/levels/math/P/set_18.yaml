  - pageNumber: 3
    title: Leitura de Histograma — prática 1
    description: Interprete classes e frequências.
    exercises:
      - type: mental_math
        question: Histograma com barras iguais → distribuição é (uniforme/normal/assimétrica)?
        correctAnswer: uniforme
        rationale: Barras de mesma altura indicam distribuição uniforme.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Histograma com barra central alta e simétricas → distribuição é (normal/uniforme)?
        correctAnswer: normal
        rationale: Formato de sino = distribuição normal.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Histograma com cauda à direita → distribuição assimétrica à (direita/esquerda)?
        correctAnswer: direita
        rationale: Cauda direita = assimetria positiva.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Classe [10,20) com f=5 e [20,30) com f=15 — qual classe tem mais dados?
        correctAnswer: 20
        rationale: Classe [20,30) tem f=15 > 5; o limite inferior dela é 20.
        difficulty: 2
        objectives:
          - stats.data_analysis
      - type: mental_math
        question: Total n de histograma com classes f={4,6,10,5} = ?
        correctAnswer: 25
        rationale: n = 4+6+10+5 = 25.
        difficulty: 1
        objectives:
          - stats.data_analysis
