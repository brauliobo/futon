title: Distribuição Normal
level: P
subject: math
authorNotes: Distribuição Normal. Foque no conceito central do conjunto e nos erros comuns.
inputType: text
difficulty: 3
objectives:
  - stats.normal_distribution
example: "Regra 68-95-99.7 para a normal. Ex.: QI normalizado tem μ=100 e σ=15. QI=115 tem z = ? → 1."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: Curva Normal — prática 1
    description: Simétrica em torno da média, formato de sino.
    exercises:
      - type: mental_math
        question: "Formato da curva normal: (uniforme/triangular/sino)"
        correctAnswer: sino
        rationale: Curva normal tem formato de sino, simétrica em torno da média.
        difficulty: 2
        objectives:
          - stats.normal_distribution
      - type: mental_math
        question: "Pico da curva normal é em: (ambas/mediana/média)"
        correctAnswer: ambas
        rationale: Pico da normal ocorre na média (que coincide com mediana e moda).
        difficulty: 2
        objectives:
          - stats.normal_distribution
      - type: mental_math
        question: Curva normal é simétrica? (sim/não)
        correctAnswer: sim
        rationale: Curva normal é simétrica em torno da média.
        difficulty: 2
        objectives:
          - stats.normal_distribution
      - type: mental_math
        question: Área total sob a curva normal = ?
        correctAnswer: 1
        rationale: Área total sob a curva normal = 1 (toda a probabilidade).
        difficulty: 2
        objectives:
          - stats.normal_distribution
      - type: mental_math
        question: Na normal, média = mediana = moda? (não/sim)
        correctAnswer: sim
        rationale: Na distribuição normal, média = mediana = moda.
        difficulty: 2
        objectives:
          - stats.normal_distribution
