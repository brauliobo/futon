  - pageNumber: 9
    title: Problemas Contextualizados — prática 1
    description: Aplique condicional em contextos reais.
    exercises:
      - type: mental_math
        question: Diagnóstico médico. P(doença)=0.01, P(teste+|doença)=0.99, P(teste+|saudável)=0.05. De 10 000 pessoas, ~quantas têm teste positivo e estão doentes?
        correctAnswer: 99
        rationale: 10000×0.01×0.99 = 99 verdadeiros positivos.
        difficulty: 4
        objectives:
          - prob.conditional
      - type: mental_math
        question: Mesma situação — quantas têm teste positivo e são saudáveis?
        correctAnswer: 495
        rationale: 10000×0.99×0.05 = 495 falsos positivos.
        difficulty: 4
        objectives:
          - prob.conditional
      - type: mental_math
        question: P(doença|teste+) ≈ 99/(99+495) ≈ ? (arredonde para 2 casas)
        correctAnswer: 0.17
        rationale: 99/594 ≈ 0.17; mesmo com teste preciso, prevalência baixa reduz VPP.
        difficulty: 5
        objectives:
          - prob.conditional
      - type: mental_math
        question: P(A∩B)=0.15, P(B)=0.3 → P(A|B) = ?
        correctAnswer: 0.5
        rationale: P(A|B) = 0.15/0.3 = 0.5.
        difficulty: 3
        objectives:
          - prob.conditional
      - type: mental_math
        question: P(A|B)=0.7, P(B)=0.4 → P(A∩B) = ?
        correctAnswer: 0.28
        rationale: P(A∩B) = P(A|B)·P(B) = 0.7×0.4 = 0.28.
        difficulty: 3
        objectives:
          - prob.conditional
