          - prob.basic
      - type: mental_math
        question: P(evento impossível) = ?
        correctAnswer: 0
        rationale: "Evento impossível: P = 0."
        difficulty: 1
        objectives:
          - prob.basic
      - type: mental_math
        question: P(A)=0.3 e P(B)=0.6 — P(A ou B mutuamente exclusivo) = ?
        correctAnswer: 0.9
        rationale: "Eventos mutuamente exclusivos: P(A∩B) = 0; P(A∪B) = P(A) + P(B)."
        difficulty: 1
        objectives:
          - prob.basic
