        correctAnswer: 0
        rationale: "Probabilidade: 0 ≤ P(A) ≤ 1."
        difficulty: 1
        objectives:
          - prob.basic
      - type: mental_math
        question: Maior valor possível de P(A) = ?
        correctAnswer: 1
        rationale: "Probabilidade: 0 ≤ P(A) ≤ 1."
        difficulty: 1
        objectives:
          - prob.basic
      - type: mental_math
        question: P(evento certo) = ?
        correctAnswer: 1
