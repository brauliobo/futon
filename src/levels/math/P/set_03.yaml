        difficulty: 1
        objectives:
          - prob.basic
      - type: mental_math
        question: Se P(A)+P(Ā) = ?, sempre
        correctAnswer: 1
        rationale: "Complementar: P(Ā) = 1 − P(A); P(A) + P(Ā) = 1."
        difficulty: 1
        objectives:
