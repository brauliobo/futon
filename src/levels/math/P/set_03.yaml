pages:
  - pageNumber: 1
    title: Espaço Amostral — prática 1
    description: Conjunto de resultados possíveis.
    exercises:
      - type: mental_math
        question: Lançando um dado, quantos resultados há?
        correctAnswer: 6
        rationale: "Espaço amostral do dado: {1,2,3,4,5,6} — 6 resultados equiprováveis."
        difficulty: 1
        objectives:
          - prob.basic
      - type: mental_math
        question: Lançando uma moeda, quantos resultados há?
        correctAnswer: 2
        rationale: "Espaço amostral da moeda: {cara, coroa} — 2 resultados."
        difficulty: 1
        objectives:
          - prob.basic
      - type: mental_math
        question: Tirando uma carta de baralho (52), espaço amostral = ?
        correctAnswer: 52
        rationale: Baralho padrão tem 52 cartas (13 valores × 4 naipes).
        difficulty: 1
        objectives:
          - prob.basic
      - type: mental_math
        question: Dois dados — quantos resultados possíveis?
        correctAnswer: 36
        rationale: "Espaço amostral do dado: {1,2,3,4,5,6} — 6 resultados equiprováveis."
        difficulty: 1
        objectives:
          - prob.basic
      - type: mental_math
        question: 3 moedas — quantos resultados?
        correctAnswer: 8
        rationale: "Cada moeda/dado é independente: 2ⁿ (moedas) ou 6ⁿ (dados) resultados."
        difficulty: 1
        objectives:
          - prob.basic
