  - pageNumber: 3
    title: Erro Padrão da Média — prática 1
    description: "SE = σ/√n ou s/√n."
    exercises:
      - type: mental_math
        question: σ=10, n=100 → SE = σ/√n = ?
        correctAnswer: 1
        rationale: SE = 10/√100 = 10/10 = 1.
        difficulty: 3
        objectives:
          - stats.inference
      - type: mental_math
        question: σ=6, n=9 → SE = ?
        correctAnswer: 2
        rationale: SE = 6/√9 = 6/3 = 2.
        difficulty: 3
        objectives:
          - stats.inference
      - type: mental_math
        question: σ=4, n=4 → SE = ?
        correctAnswer: 2
        rationale: SE = 4/2 = 2.
        difficulty: 2
        objectives:
          - stats.inference
      - type: mental_math
        question: σ=5, n=25 → SE = ?
        correctAnswer: 1
        rationale: SE = 5/5 = 1.
        difficulty: 3
        objectives:
          - stats.inference
      - type: mental_math
        question: Quadruplicar n → SE muda por fator = ?
        correctAnswer: 0.5
        rationale: SE ∝ 1/√n; √4=2 → SE/2, fator = 0.5.
        difficulty: 4
        objectives:
          - stats.inference
