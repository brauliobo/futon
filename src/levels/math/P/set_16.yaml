  - pageNumber: 7
    title: Tamanho de Amostra — prática 1
    description: "n = (z·σ/ME)²."
    exercises:
      - type: mental_math
        question: σ=10, ME=2, z=2 → n = (2×10/2)² = ?
        correctAnswer: 100
        rationale: n = (20/2)² = 10² = 100.
        difficulty: 4
        objectives:
          - stats.inference
      - type: mental_math
        question: σ=5, ME=1, z=2 → n = ?
        correctAnswer: 100
        rationale: n = (2×5/1)² = 10² = 100.
        difficulty: 4
        objectives:
          - stats.inference
      - type: mental_math
        question: σ=20, ME=4, z=2 → n = ?
        correctAnswer: 100
        rationale: n = (2×20/4)² = 10² = 100.
        difficulty: 4
        objectives:
          - stats.inference
      - type: mental_math
        question: Dobrar ME → n muda por fator = ?
        correctAnswer: 0.25
        rationale: n ∝ 1/ME²; dobrar ME → n × 1/4 = 0.25.
        difficulty: 5
        objectives:
          - stats.inference
      - type: mental_math
        question: σ=10, ME=5, z=2 → n = ?
        correctAnswer: 16
        rationale: n = (2×10/5)² = 4² = 16.
        difficulty: 4
        objectives:
          - stats.inference
