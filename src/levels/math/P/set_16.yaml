title: Inferência Estatística — Básico
level: P
subject: math
authorNotes: Inferência Estatística — Básico. Foque no conceito central do conjunto e nos erros comuns.
inputType: number
difficulty: 4
objectives:
  - stats.inference
example: "IC 95%: x̄ ± 1.96·σ/√n. Ex.: x̄=50, σ=10, n=100 → 50 ± 1.96 → [48.04, 51.96]."
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 20
pages:
  - pageNumber: 1
    title: População vs Amostra — prática 1
    description: Parâmetro (μ,σ) vs estatística (x̄,s).
    exercises:
      - type: mental_math
        question: Símbolo do parâmetro média populacional = ? (μ/x̄)
        correctAnswer: μ
        rationale: μ é parâmetro de população; x̄ é estatística da amostra.
        difficulty: 1
        objectives:
          - stats.inference
      - type: mental_math
        question: Símbolo do estimador média amostral = ? (μ/x̄)
        correctAnswer: x̄
        rationale: x̄ estima μ; s estima σ.
        difficulty: 1
        objectives:
          - stats.inference
      - type: mental_math
        question: Símbolo do desvio padrão amostral = ? (σ/s)
        correctAnswer: s
        rationale: s é calculado da amostra com divisor n-1.
        difficulty: 1
        objectives:
          - stats.inference
      - type: mental_math
        question: n=1000 (grande) → s estimativa de σ é (boa/ruim)?
        correctAnswer: boa
        rationale: Amostras grandes produzem estimativas mais precisas.
        difficulty: 2
        objectives:
          - stats.inference
      - type: mental_math
        question: Censo vs amostragem — censo mede (parte/todo)?
        correctAnswer: todo
        rationale: Censo mede toda a população; amostragem usa subconjunto.
        difficulty: 1
        objectives:
          - stats.inference
