  - pageNumber: 5
    title: Intervalo de Confiança 95% — prática 1
    description: "IC 95%: x̄ ± 1.96·SE."
    exercises:
      - type: mental_math
        question: x̄=50, SE=1 → limite superior do IC 95% = x̄ + 1.96 ≈ ?
        correctAnswer: 51.96
        rationale: 50 + 1.96×1 = 51.96.
        difficulty: 3
        objectives:
          - stats.inference
      - type: mental_math
        question: x̄=50, SE=1 → limite inferior do IC 95% = ?
        correctAnswer: 48.04
        rationale: 50 - 1.96 = 48.04.
        difficulty: 3
        objectives:
          - stats.inference
      - type: mental_math
        question: Margem de erro do IC 95% com SE=2 ≈ ?
        correctAnswer: 3.92
        rationale: ME = 1.96×SE = 1.96×2 = 3.92.
        difficulty: 3
        objectives:
          - stats.inference
      - type: mental_math
        question: x̄=100, σ=10, n=100 → SE = 1; IC 95% inferior ≈ ?
        correctAnswer: 98.04
        rationale: 100 - 1.96×1 = 98.04.
        difficulty: 4
        objectives:
          - stats.inference
      - type: mental_math
        question: Para IC 99% usa-se z ≈ ? (1.96/2.58/3.0)
        correctAnswer: 2.58
        rationale: z₀.₀₀₅ = 2.576 ≈ 2.58 para IC 99%.
        difficulty: 3
        objectives:
          - stats.inference
