  - pageNumber: 9
    title: Interpretação do IC — prática 1
    description: Significado do nível de confiança.
    exercises:
      - type: mental_math
        question: IC 95% — em 100 amostras, ~quantas contêm μ?
        correctAnswer: 95
        rationale: Nível 95% → ~95 de 100 intervalos capturam o verdadeiro parâmetro.
        difficulty: 3
        objectives:
          - stats.inference
      - type: mental_math
        question: IC 90% — em 100 amostras, ~quantas contêm μ?
        correctAnswer: 90
        rationale: Nível 90% → ~90 de 100.
        difficulty: 2
        objectives:
          - stats.inference
      - type: mental_math
        question: IC mais largo → (mais/menos) confiança?
        correctAnswer: mais
        rationale: Ampliar intervalo aumenta a confiança de capturar μ.
        difficulty: 2
        objectives:
          - stats.inference
      - type: mental_math
        question: x̄=20, ME=3 → IC = [17, ?]
        correctAnswer: 23
        rationale: 20+3 = 23.
        difficulty: 2
        objectives:
          - stats.inference
      - type: mental_math
        question: IC=[14, 26] → x̄ (ponto central) = ?
        correctAnswer: 20
        rationale: x̄ = (14+26)/2 = 20.
        difficulty: 2
        objectives:
          - stats.inference
