title: Medidas de Tendência Central
level: P
subject: math
inputType: number
difficulty: 2
objectives: [stats.central_tendency]
example: "Média, mediana e moda de {1,2,2,3,4}"
pages:
  - pageNumber: 1
    title: Média Aritmética
    description: Soma dividida pela quantidade.
    exercises:
      - { type: mental_math, question: "Média de 2, 4, 6 = ?", correctAnswer: 4 }
      - { type: mental_math, question: "Média de 10, 20, 30, 40 = ?", correctAnswer: 25 }
      - { type: mental_math, question: "Média de 5 e 15 = ?", correctAnswer: 10 }
      - { type: mental_math, question: "Média de 100, 200, 300 = ?", correctAnswer: 200 }
      - { type: mental_math, question: "Média de 3, 3, 3, 3 = ?", correctAnswer: 3 }
  - pageNumber: 2
    title: Média com Decimais
    description: Mesma ideia, atenção à divisão.
    exercises:
      - { type: mental_math, question: "Média de 1.5 e 2.5 = ?", correctAnswer: 2 }
      - { type: mental_math, question: "Média de 0.5, 1.5, 2.5 = ?", correctAnswer: 1.5 }
      - { type: mental_math, question: "Média de 1, 2, 3, 4, 5 = ?", correctAnswer: 3 }
      - { type: mental_math, question: "Média de 7, 8 = ?", correctAnswer: 7.5 }
      - { type: mental_math, question: "Média de 10, 15 = ?", correctAnswer: 12.5 }
  - pageNumber: 3
    title: Mediana (ímpar)
    description: Valor do meio ordenado.
    exercises:
      - { type: mental_math, question: "Mediana de {1,3,5} = ?", correctAnswer: 3 }
      - { type: mental_math, question: "Mediana de {2,4,6,8,10} = ?", correctAnswer: 6 }
      - { type: mental_math, question: "Mediana de {1,1,1} = ?", correctAnswer: 1 }
      - { type: mental_math, question: "Mediana de {10, 20, 30} = ?", correctAnswer: 20 }
      - { type: mental_math, question: "Mediana de {7} = ?", correctAnswer: 7 }
  - pageNumber: 4
    title: Mediana (par)
    description: Média dos dois valores centrais.
    exercises:
      - { type: mental_math, question: "Mediana de {1,2,3,4} = ?", correctAnswer: 2.5 }
      - { type: mental_math, question: "Mediana de {2,4,6,8} = ?", correctAnswer: 5 }
      - { type: mental_math, question: "Mediana de {10,20} = ?", correctAnswer: 15 }
      - { type: mental_math, question: "Mediana de {1,1,2,2} = ?", correctAnswer: 1.5 }
      - { type: mental_math, question: "Mediana de {3,3,3,3} = ?", correctAnswer: 3 }
  - pageNumber: 5
    title: Moda
    description: Valor mais frequente.
    exercises:
      - { type: mental_math, question: "Moda de {1,2,2,3} = ?", correctAnswer: 2 }
      - { type: mental_math, question: "Moda de {4,4,5,6,6,6} = ?", correctAnswer: 6 }
      - { type: mental_math, question: "Moda de {1,1,2,2} (bimodal, cite o menor) = ?", correctAnswer: 1 }
      - { type: mental_math, question: "Moda de {5,5,5,5} = ?", correctAnswer: 5 }
      - { type: mental_math, question: "Moda de {1,2,3,4,5} (amodal)? (amodal/1/5/3)", correctAnswer: amodal }
  - pageNumber: 6
    title: Comparações
    description: Quando média ≠ mediana.
    exercises:
      - { type: mental_math, question: "{1,2,3,4,100} — média = ?", correctAnswer: 22 }
      - { type: mental_math, question: "{1,2,3,4,100} — mediana = ?", correctAnswer: 3 }
      - { type: mental_math, question: "{10,20,30,40,50} — média = mediana? (sim/não)", correctAnswer: sim }
      - { type: mental_math, question: "Valor discrepante (outlier) afeta mais a: (média/mediana/moda)", correctAnswer: média }
      - { type: mental_math, question: "Robustez a outliers: (mediana/média)", correctAnswer: mediana }
  - pageNumber: 7
    title: Média Ponderada
    description: Pesos diferentes para cada valor.
    exercises:
      - { type: mental_math, question: "Notas 8 (peso 2) e 6 (peso 1): média = ?", correctAnswer: 7.33 }
      - { type: mental_math, question: "Notas 10 (peso 3) e 5 (peso 2): média = ?", correctAnswer: 8 }
      - { type: mental_math, question: "Notas 7 e 9 com pesos iguais: média = ?", correctAnswer: 8 }
      - { type: mental_math, question: "Notas 6 (peso 1), 8 (peso 1), 10 (peso 2): média = ?", correctAnswer: 8.5 }
      - { type: mental_math, question: "Média ponderada de 0 (p1) e 10 (p3): ?", correctAnswer: 7.5 }
  - pageNumber: 8
    title: Aplicações
    description: Tempo, notas, dados do cotidiano.
    exercises:
      - { type: mental_math, question: "4 provas 7,8,9,10 — média = ?", correctAnswer: 8.5 }
      - { type: mental_math, question: "Alturas 160, 165, 170, 175 — média = ?", correctAnswer: 167.5 }
      - { type: mental_math, question: "Preços 10, 20, 30 — mediana = ?", correctAnswer: 20 }
      - { type: mental_math, question: "Tempo (minutos) 5,6,5,7 — média = ?", correctAnswer: 5.75 }
      - { type: mental_math, question: "Tempo (minutos) 5,6,5,7 — moda = ?", correctAnswer: 5 }
  - pageNumber: 9
    title: Discrepantes
    description: Identificar dados que distorcem a média.
    exercises:
      - { type: mental_math, question: "{1,2,3,4,50} — outlier = ?", correctAnswer: 50 }
      - { type: mental_math, question: "Média sem o outlier ({1,2,3,4}) = ?", correctAnswer: 2.5 }
      - { type: mental_math, question: "Mediana do conjunto com outlier ({1,2,3,4,50}) = ?", correctAnswer: 3 }
      - { type: mental_math, question: "Outlier afeta mais a média? (sim/não)", correctAnswer: sim }
      - { type: mental_math, question: "Ao remover outlier, média tende a: (aproximar da mediana/divergir mais/ficar igual)", correctAnswer: aproximar da mediana }
  - pageNumber: 10
    title: Revisão Integrada
    description: Calcule a medida adequada.
    exercises:
      - { type: mental_math, question: "{5,10,15,20,25} — média = ?", correctAnswer: 15 }
      - { type: mental_math, question: "Mesma lista — mediana = ?", correctAnswer: 15 }
      - { type: mental_math, question: "Mesma lista — moda? (amodal/5/15/25)", correctAnswer: amodal }
      - { type: mental_math, question: "{2,2,3,4,5,6,7} — moda = ?", correctAnswer: 2 }
      - { type: mental_math, question: "{2,2,3,4,5,6,7} — mediana = ?", correctAnswer: 4 }
target: 50
