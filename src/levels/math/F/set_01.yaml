title: Decimais - Introdução
level: F
example: "Aprenda decimais. Ex.: 0.5 = 5 décimos = metade"
subject: math
difficulty: 3
objectives:
  - math.fractions_decimals
authorNotes: "Introdução a decimais. Ligue à notação de valor posicional (décimos, centésimos)."
inputType: number
pages:
  - pageNumber: 1
    title: Conversão Fração ↔ Decimal
    description: Relacione fração com decimal.
    exercises:
      - type: decimal
        question: 1/2 em decimal (um número)
        correctAnswer: 0.5
        rationale: "Alinhe as casas decimais antes de operar."
        difficulty: 2
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 1/4 em decimal
        correctAnswer: 0.25
        rationale: "Alinhe as casas decimais antes de operar."
        difficulty: 2
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 3/4 em decimal
        correctAnswer: 0.75
        rationale: "Alinhe as casas decimais antes de operar."
        difficulty: 2
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 1/10 em decimal
        correctAnswer: 0.1
        rationale: "Em decimais, conte casas para manter precisão."
        difficulty: 2
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 5/10 em decimal
        correctAnswer: 0.5
        rationale: "Ex.: 1/3 + 1/6 = 2/6 + 1/6 = 3/6 = 1/2."
        difficulty: 2
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 1/5 em decimal
        correctAnswer: 0.2
        rationale: "Cuidado com sinais ao subtrair frações distintas."
        difficulty: 2
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 2/5 em decimal
        correctAnswer: 0.4
        rationale: "Fração imprópria pode aparecer — converta se necessário."
        difficulty: 2
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 3/5 em decimal
        correctAnswer: 0.6
        rationale: "Reduza sempre ao final para a forma irredutível."
        difficulty: 2
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 4/5 em decimal
        correctAnswer: 0.8
        rationale: "Decimal periódico? Expresse como fração equivalente."
        difficulty: 2
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 1/1 em decimal
        correctAnswer: 1
        rationale: "Denominadores diferentes: ache o MMC antes de somar."
        difficulty: 2
        objectives: [math.fractions_decimals]
  - pageNumber: 2
    title: Soma de Decimais
    description: Some números decimais.
    exercises:
      - type: decimal
        question: 0.1 + 0.2 =
        correctAnswer: 0.3
        rationale: "Reescreva cada fração com o denominador comum (MMC)."
        difficulty: 3
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 0.3 + 0.4 =
        correctAnswer: 0.7
        rationale: "Após achar MMC, multiplique numeradores pelos fatores corretos."
        difficulty: 3
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 0.5 + 0.5 =
        correctAnswer: 1
        rationale: "Decimal: alinhe a vírgula antes de somar ou subtrair."
        difficulty: 3
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 0.25 + 0.25 =
        correctAnswer: 0.5
        rationale: "Conversão fração↔decimal: divida numerador por denominador."
        difficulty: 3
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 0.1 + 0.9 =
        correctAnswer: 1
        rationale: "Simplifique o resultado final (MDC numerador/denominador)."
        difficulty: 3
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 0.2 + 0.3 =
        correctAnswer: 0.5
        rationale: "Verifique se o MMC usado é o menor possível."
        difficulty: 3
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 1.5 + 0.5 =
        correctAnswer: 2
        rationale: "Em decimais, conte casas para manter precisão."
        difficulty: 3
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 2.1 + 0.9 =
        correctAnswer: 3
        rationale: "Ex.: 1/3 + 1/6 = 2/6 + 1/6 = 3/6 = 1/2."
        difficulty: 3
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 0.75 + 0.25 =
        correctAnswer: 1
        rationale: "Cuidado com sinais ao subtrair frações distintas."
        difficulty: 3
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 1.2 + 0.8 =
        correctAnswer: 2
        rationale: "Fração imprópria pode aparecer — converta se necessário."
        difficulty: 3
        objectives: [math.fractions_decimals]
  - pageNumber: 3
    title: Subtração de Decimais
    description: Subtraia decimais.
    exercises:
      - type: decimal
        question: 1 - 0.5 =
        correctAnswer: 0.5
        rationale: "Reduza sempre ao final para a forma irredutível."
        difficulty: 4
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 1 - 0.25 =
        correctAnswer: 0.75
        rationale: "Decimal periódico? Expresse como fração equivalente."
        difficulty: 4
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 0.7 - 0.2 =
        correctAnswer: 0.5
        rationale: "Denominadores diferentes: ache o MMC antes de somar."
        difficulty: 4
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 0.9 - 0.4 =
        correctAnswer: 0.5
        rationale: "Reescreva cada fração com o denominador comum (MMC)."
        difficulty: 4
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 1 - 0.1 =
        correctAnswer: 0.9
        rationale: "Após achar MMC, multiplique numeradores pelos fatores corretos."
        difficulty: 4
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 2 - 0.5 =
        correctAnswer: 1.5
        rationale: "Decimal: alinhe a vírgula antes de somar ou subtrair."
        difficulty: 4
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 1.5 - 0.5 =
        correctAnswer: 1
        rationale: "Conversão fração↔decimal: divida numerador por denominador."
        difficulty: 4
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 0.8 - 0.3 =
        correctAnswer: 0.5
        rationale: "Simplifique o resultado final (MDC numerador/denominador)."
        difficulty: 4
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 3 - 1.5 =
        correctAnswer: 1.5
        rationale: "Verifique se o MMC usado é o menor possível."
        difficulty: 4
        objectives: [math.fractions_decimals]
      - type: decimal
        question: 2.5 - 1 =
        correctAnswer: 1.5
        rationale: "Em decimais, conte casas para manter precisão."
        difficulty: 4
        objectives: [math.fractions_decimals]
target: 30
