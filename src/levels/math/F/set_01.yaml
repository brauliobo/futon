title: Decimais - Introdução
level: F
example: "Aprenda decimais. Ex.: 0.5 = 5 décimos = metade"
subject: math
difficulty: 3
objectives:
  - math.fractions_decimals
authorNotes: Introdução a decimais. Ligue à notação de valor posicional
  (décimos, centésimos). Blocos monotônicos — conversão, soma, subtração —
  para evitar regressão de dificuldade entre páginas.
inputType: number
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 12
pages:
  - pageNumber: 1
    title: Conversão Fração ↔ Decimal — prática 1
    description: Relacione fração com decimal.
    exercises:
