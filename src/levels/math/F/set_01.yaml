      - {type: decimal, question: "3/4 em decimal",             correctAnswer: 0.75, rationale: "3/4 = 0.75 (quartos: 0.25, 0.5, 0.75, 1.0).",         difficulty: 2, objectives: [math.fractions_decimals]}
