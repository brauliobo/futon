title: Álgebra Avançada — Conjunto 14
level: J
example: "Derivadas básicas. Ex.: d/dx(x²) = 2x"
subject: math
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 14 – Página 1
    description: Regras básicas de derivação.
    exercises:
      - &a1
        type: algebra
        question: "Derivada de x³:"
        correctAnswer: 3x²
      - &a2
        type: algebra
        question: "Derivada de 5x:"
        correctAnswer: 5
      - &a3
        type: algebra
        question: "Derivada de x² + 3x:"
        correctAnswer: 2x + 3
      - &a4
        type: algebra
        question: "Derivada de sen(x):"
        correctAnswer: cos(x)
      - &a5
        type: algebra
        question: "Derivada de cos(x):"
        correctAnswer: -sen(x)
      - &a6
        type: algebra
        question: "Derivada de eˣ:"
        correctAnswer: eˣ
      - &a7
        type: algebra
        question: "Derivada de ln(x):"
        correctAnswer: 1/x
      - &a8
        type: algebra
        question: "Derivada de x⁴ - 2x²:"
        correctAnswer: 4x³ - 4x
      - &a9
        type: algebra
        question: "Derivada de √x:"
        correctAnswer: 1/(2√x)
      - &a10
        type: algebra
        question: "Derivada de 1/x:"
        correctAnswer: -1/x²
