title: Álgebra Avançada — Conjunto 10
level: J
example: "Expressões algébricas avançadas. Ex.: (x + 2)² = x² + 4x + 4"
subject: math
difficulty: 4
objectives:
  - math.advanced_algebra
authorNotes: Conjunto de math/J.
inputType: number
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 10 – Página 1
    description: Simplificação de expressões algébricas.
    exercises:
      - type: algebra
        question: (x + 3)(x - 3)
        correctAnswer: x² - 9
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: (x + 7)(x - 7)
        correctAnswer: x² - 49
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: (x + 5)(x - 5)
        correctAnswer: x² - 25
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: (x + 1)(x - 1)
        correctAnswer: x² - 1
        rationale: "Vértice: x = -b/(2a), y = -Δ/(4a)."
      - type: algebra
        question: (x + 2)(x - 2)
        correctAnswer: x² - 4
        rationale: "Soma das raízes: -b/a; produto: c/a."
  - pageNumber: 2
    title: Álgebra Avançada — Conjunto 10 – Página 2
    description: Simplificação de expressões algébricas.
    exercises:
      - type: algebra
        question: (x + 6)(x - 6)
        correctAnswer: x² - 36
        rationale: "Se a > 0, parábola côncava para cima; a < 0, para baixo."
      - type: algebra
        question: (x + 9)(x - 9)
        correctAnswer: x² - 81
        rationale: "Complete o quadrado para forma canônica a(x - h)² + k."
      - type: algebra
        question: (x + 3)(x - 3)
        correctAnswer: x² - 9
        rationale: "Raízes reais ⇔ gráfico cruza o eixo x."
      - type: algebra
        question: (x + 5)(x - 5)
        correctAnswer: x² - 25
        rationale: "Função quadrática tem simetria em x = -b/(2a)."
      - type: algebra
        question: (x + 4)(x - 4)
        correctAnswer: x² - 16
        rationale: "Valor extremo ocorre no vértice — máx ou mín conforme sinal de a."
  - pageNumber: 3
    title: Álgebra Avançada — Conjunto 10 – Página 3
    description: Simplificação de expressões algébricas.
    exercises:
      - type: algebra
        question: (x + 6)(x - 6)
        correctAnswer: x² - 36
        rationale: "Fatore: ax² + bx + c = a(x - r₁)(x - r₂)."
      - type: algebra
        question: (x + 8)(x - 8)
        correctAnswer: x² - 64
        rationale: "Ex.: x² - 5x + 6 = 0 → (x-2)(x-3) → x = 2 ou 3."
      - type: algebra
        question: (x + 10)(x - 10)
        correctAnswer: x² - 100
        rationale: "Fórmula de Bhaskara: x = (-b ± √Δ)/(2a)."
      - type: algebra
        question: (x + 1)(x - 1)
        correctAnswer: x² - 1
        rationale: "Discriminante Δ = b² - 4ac determina o número de raízes."
      - type: algebra
        question: (x + 2)(x - 2)
        correctAnswer: x² - 4
        rationale: "Δ > 0: duas raízes reais distintas; Δ = 0: uma; Δ < 0: nenhuma real."
      - type: algebra
        question: (x + 9)(x - 9)
        correctAnswer: x² - 81
        rationale: "Vértice: x = -b/(2a), y = -Δ/(4a)."
