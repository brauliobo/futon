  - pageNumber: 8
    title: Álgebra Avançada – Página 8
    description: Polinômios e suas operações.
    exercises:
      - type: algebra
        question: "Fatorize: x³ - x ="
        correctAnswer: x(x - 1)(x + 1)
  - pageNumber: 9
    title: Álgebra Avançada – Página 9
    description: Polinômios e suas operações.
    exercises:
      - type: algebra
        question: "Raízes de x² - 5x + 6 = 0:"
        correctAnswer: x = 2, x = 3
  - pageNumber: 10
    title: Álgebra Avançada – Página 10
    description: Polinômios e suas operações.
    exercises:
