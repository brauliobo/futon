pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 9 – Página 1
    description: Simplificação de expressões algébricas.
    exercises:
      - type: algebra
        question: (x + 4)(x + 7)
        correctAnswer: x² + 11x + 28
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: (x + 10)(x + 1)
        correctAnswer: x² + 11x + 10
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: (x + 1)(x + 10)
        correctAnswer: x² + 11x + 10
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: (x + -4)(x + -1)
        correctAnswer: x² - 5x + 4
        rationale: "Vértice: x = -b/(2a), y = -Δ/(4a)."
      - type: algebra
        question: (x + -4)(x + 0)
        correctAnswer: x² - 4x + 0
        rationale: "Soma das raízes: -b/a; produto: c/a."
      - type: algebra
        question: (x + 6)(x + -9)
        correctAnswer: x² - 3x + -54
        rationale: "Se a > 0, parábola côncava para cima; a < 0, para baixo."
      - type: algebra
        question: (x + 7)(x + -7)
        correctAnswer: x² + 0x + -49
        rationale: "Complete o quadrado para forma canônica a(x - h)² + k."
      - type: algebra
        question: (x + -10)(x + -10)
        correctAnswer: x² - 20x + 100
        rationale: "Raízes reais ⇔ gráfico cruza o eixo x."
      - type: algebra
        question: (x + -6)(x + 6)
        correctAnswer: x² + 0x + -36
        rationale: "Função quadrática tem simetria em x = -b/(2a)."
      - type: algebra
        question: (x + 0)(x + -7)
        correctAnswer: x² - 7x + 0
        rationale: "Valor extremo ocorre no vértice — máx ou mín conforme sinal de a."
