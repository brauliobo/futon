title: Álgebra Avançada — Conjunto 9
level: J
example: "Polinômios. Ex.: P(x) = x³ - 2x² + x - 1"
subject: math
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 9 – Página 1
    description: Polinômios e suas operações.
    exercises:
      - &a1
        type: algebra
        question: "Grau do polinômio x⁵ - 3x² + 1:"
        correctAnswer: 5
      - &a2
        type: algebra
        question: "P(x) = x² + 2x. Calcule P(3):"
        correctAnswer: 15
      - &a3
        type: algebra
        question: "Soma: (x² + 2x) + (x² - x) ="
        correctAnswer: 2x² + x
      - &a4
        type: algebra
        question: "Produto: x(x² + 2) ="
        correctAnswer: x³ + 2x
      - &a5
        type: algebra
        question: "Divisão: (x³ - x) ÷ x ="
        correctAnswer: x² - 1
      - &a6
        type: algebra
        question: "Resto da divisão (x² + 1) ÷ (x - 1):"
        correctAnswer: 2
      - &a7
        type: algebra
        question: "Coeficiente de x² em (x + 2)³:"
        correctAnswer: 12
      - &a8
        type: algebra
        question: "Fatorize: x³ - x ="
        correctAnswer: x(x - 1)(x + 1)
      - &a9
        type: algebra
        question: "Raízes de x² - 5x + 6 = 0:"
        correctAnswer: x = 2, x = 3
      - &a10
        type: algebra
        question: "Derivada de x³ + 2x:"
        correctAnswer: 3x² + 2
