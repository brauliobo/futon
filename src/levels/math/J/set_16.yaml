    title: Álgebra Avançada — Conjunto 16 – Página 1
    description: Simplificação de expressões algébricas.
    exercises:
      - type: algebra
        question: (x + 0)(x + 0)
        correctAnswer: x² + 0x + 0
        rationale: "Isole a incógnita usando operações inversas."
      - type: factoring
        question: 4x² - 6x + 2
        correctAnswer: (4x + -2)(1x + -1)
        rationale: "Identifique o fator comum ou use fórmula de produto notável."
