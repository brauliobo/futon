      - type: algebra
        question: 4x + 2x
        correctAnswer: 6x
        rationale: "Isole a incógnita usando operações inversas."
      - type: factoring
        question: 4x² + 12x + -16
        correctAnswer: (4x + -4)(1x + 4)
        rationale: "Fórmula de Bhaskara: x = (-b ± √Δ)/(2a)."
