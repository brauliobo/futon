title: Álgebra Avançada — Conjunto 16
level: J
example: "Equações diferenciais. Ex.: dy/dx = y, solução: y = Ce^x"
subject: math
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 16 – Página 1
    description: Equações diferenciais elementares.
    exercises:
      - &a1
        type: algebra
        question: "Resolva: dy/dx = 2x"
        correctAnswer: y = x² + C
      - &a2
        type: algebra
        question: "Resolva: dy/dx = y"
        correctAnswer: y = Ce^x
      - &a3
        type: algebra
        question: "Resolva: dy/dx = 0"
        correctAnswer: y = C
      - &a4
        type: algebra
        question: "Resolva: d²y/dx² = 0"
        correctAnswer: y = Cx + D
      - &a5
        type: algebra
        question: "Ordem da ED: d³y/dx³ + y = 0"
        correctAnswer: 3
      - &a6
        type: algebra
        question: "Grau da ED: (dy/dx)² + y = 0"
        correctAnswer: 2
      - &a7
        type: algebra
        question: "Resolva: dy/dx = x + 1"
        correctAnswer: y = x²/2 + x + C
      - &a8
        type: algebra
        question: "Verifique se y = x² é solução de: xy' = 2y"
        correctAnswer: Sim
      - &a9
        type: algebra
        question: "Resolva: dy/dx = sen(x)"
        correctAnswer: y = -cos(x) + C
      - &a10
        type: algebra
        question: "Condição inicial: y(0) = 1 para y = Ce^x, C = ?"
        correctAnswer: C = 1
