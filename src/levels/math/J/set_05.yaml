        type: algebra
        question: "Calcule: (4 - 2i) - (1 + i) ="
        correctAnswer: 3 - 3i
      - &a4
        type: algebra
        question: "Calcule: i² ="
        correctAnswer: -1
      - &a5
        type: algebra
        question: "Calcule: 2i · 3i ="
        correctAnswer: -6
