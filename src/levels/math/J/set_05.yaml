        type: algebra
        question: Qual é a parte real de 5 + 7i?
        correctAnswer: 5
      - &a7
        type: algebra
        question: Qual é a parte imaginária de 3 - 4i?
        correctAnswer: -4
      - &a8
        type: algebra
        question: "Calcule: |3 + 4i| ="
        correctAnswer: 5
      - &a9
        type: algebra
        question: Conjugado de (2 - 3i) =
        correctAnswer: 2 + 3i
      - &a10
        type: algebra
        question: "Calcule: i³ ="
        correctAnswer: -i
