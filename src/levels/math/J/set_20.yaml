  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 20 – Página 1
    description: Revisão e aplicação de conceitos.
    exercises:
      - &a1
        type: algebra
        question: "Resolva o sistema: x+y=3, x-y=1"
        correctAnswer: x=2, y=1
      - &a2
        type: algebra
        question: "Fatorize completamente: x⁴ - 16"
        correctAnswer: (x²-4)(x²+4) = (x-2)(x+2)(x²+4)
      - &a3
        type: algebra
        question: "Simplifique: (x²-1)/(x+1)"
        correctAnswer: x-1
      - &a4
        type: algebra
        question: "Calcule: log₂(8) + log₂(4)"
        correctAnswer: 5
      - &a5
        type: algebra
        question: "Derivada de f(x) = x³ - 3x²:"
        correctAnswer: f'(x) = 3x² - 6x
      - &a6
        type: algebra
        question: ∫(2x + 1)dx =
        correctAnswer: x² + x + C
      - &a7
        type: algebra
        question: "Resolva: |2x - 3| = 5"
        correctAnswer: x = 4 ou x = -1
      - &a8
        type: algebra
        question: "Distância entre (1,2) e (4,6):"
        correctAnswer: 5
      - &a9
        type: algebra
        question: "Equação da parábola com vértice (0,0) e foco (0,1):"
        correctAnswer: x² = 4y
      - &a10
        type: algebra
        question: lim(x→∞) (3x²+1)/(x²+x) =
        correctAnswer: 3
