        type: algebra
        question: "Combinação linear: 2(1,0) + 3(0,1) ="
        correctAnswer: (2,3)
      - &a8
        type: algebra
        question: "Os vetores (1,2) e (2,4) são:"
        correctAnswer: Dependentes
      - &a9
        type: algebra
        question: "Projeção de (3,4) sobre (1,0):"
        correctAnswer: (3,0)
      - &a10
        type: algebra
        question: "Posto da matriz [1 2; 2 4]:"
        correctAnswer: 1
