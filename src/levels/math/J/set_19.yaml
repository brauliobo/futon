title: Álgebra Avançada — Conjunto 19
level: J
example: "Transformações lineares. Ex.: T(x,y) = (2x, y+x)"
subject: math
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 19 – Página 1
    description: Transformações lineares e matrizes.
    exercises:
      - &a1
        type: algebra
        question: T(x,y) = (2x, 3y). T(1,1) =
        correctAnswer: (2,3)
      - &a2
        type: algebra
        question: "Matriz da rotação por 90° no plano:"
        correctAnswer: "[0 -1; 1 0]"
      - &a3
        type: algebra
        question: "Núcleo da transformação T(x,y) = (0,0):"
        correctAnswer:
          (0: null
          0): null
      - &a4
        type: algebra
        question: "Imagem da matriz identidade 2×2:"
        correctAnswer: R²
      - &a5
        type: algebra
        question: "Autovalor da matriz [3 0; 0 5] (menor):"
        correctAnswer: λ = 3
      - &a6
        type: algebra
        question: "Autovetor de [2 0; 0 2] para λ=2:"
        correctAnswer: Qualquer v≠0
      - &a7
        type: algebra
        question: "Diagonalização: matriz diagonal similar a A tem:"
        correctAnswer: Autovalores na diagonal
      - &a8
        type: algebra
        question: "Reflexão sobre o eixo x: (x,y) → ?"
        correctAnswer: (x,-y)
      - &a9
        type: algebra
        question: "Escalonamento por 2: (x,y) → ?"
        correctAnswer: (2x,2y)
      - &a10
        type: algebra
        question: "Cisalhamento: [1 k; 0 1](x,y) ="
        correctAnswer: (x+ky, y)
