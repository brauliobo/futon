title: Álgebra Avançada — Conjunto 6
level: J
example: "Inequações. Ex.: 2x + 3 > 7, então x > 2"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 6 – Página 1
    description: Inequações lineares e quadráticas.
    exercises:
      - &a1
        type: algebra
        question: "Resolva: x + 3 > 7"
        correctAnswer: x > 4
      - &a2
        type: algebra
        question: "Resolva: 2x - 5 ≤ 3"
        correctAnswer: x ≤ 4
      - &a3
        type: algebra
        question: "Resolva: -x + 2 > 5"
        correctAnswer: x < -3
      - &a4
        type: algebra
        question: "Resolva: |x| < 3"
        correctAnswer: -3 < x < 3
      - &a5
        type: algebra
        question: "Resolva: x² > 9"
        correctAnswer: x < -3 ou x > 3
      - &a6
        type: algebra
        question: "Resolva: 3x + 1 ≥ 10"
        correctAnswer: x ≥ 3
      - &a7
        type: algebra
        question: "Resolva: x² - 4 ≤ 0"
        correctAnswer: -2 ≤ x ≤ 2
      - &a8
        type: algebra
        question: "Resolva: |2x - 1| ≥ 3"
        correctAnswer: x ≤ -1 ou x ≥ 2
      - &a9
        type: algebra
        question: "Resolva: 5 - 2x < 1"
        correctAnswer: x > 2
      - &a10
        type: algebra
        question: "Para que valores de x: x(x-1) > 0?"
        correctAnswer: x < 0 ou x > 1
