title: Álgebra Avançada — Conjunto 6
level: J
example: "Inequações. Ex.: 2x + 3 > 7, então x > 2"
subject: math
pages:
  - pageNumber: 1
    title: Álgebra Avançada – Página 1
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Resolva: x + 3 > 7"
        correctAnswer: "x > 4"
  - pageNumber: 2
    title: Álgebra Avançada – Página 2
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Resolva: 2x - 5 ≤ 3"
        correctAnswer: "x ≤ 4"
  - pageNumber: 3
    title: Álgebra Avançada – Página 3
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Resolva: -x + 2 > 5"
        correctAnswer: "x < -3"
  - pageNumber: 4
    title: Álgebra Avançada – Página 4
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Resolva: |x| < 3"
        correctAnswer: "-3 < x < 3"
  - pageNumber: 5
    title: Álgebra Avançada – Página 5
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Resolva: x² > 9"
        correctAnswer: "x < -3 ou x > 3"
  - pageNumber: 6
    title: Álgebra Avançada – Página 6
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Resolva: 3x + 1 ≥ 10"
        correctAnswer: "x ≥ 3"
  - pageNumber: 7
    title: Álgebra Avançada – Página 7
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Resolva: x² - 4 ≤ 0"
        correctAnswer: "-2 ≤ x ≤ 2"
  - pageNumber: 8
    title: Álgebra Avançada – Página 8
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Resolva: |2x - 1| ≥ 3"
        correctAnswer: "x ≤ -1 ou x ≥ 2"
  - pageNumber: 9
    title: Álgebra Avançada – Página 9
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Resolva: 5 - 2x < 1"
        correctAnswer: "x > 2"
  - pageNumber: 10
    title: Álgebra Avançada – Página 10
    description: Inequações lineares e quadráticas.
    exercises:
      - type: algebra
        question: "Para que valores de x: x(x-1) > 0?"
        correctAnswer: "x < 0 ou x > 1"
target: 10
