title: Álgebra Avançada — Conjunto 11
level: J
example: "Coordenadas e geometria analítica. Ex.: distância entre (0,0) e (3,4) = 5"
subject: math
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 11 – Página 1
    description: Geometria analítica e coordenadas.
    exercises:
      - &a1
        type: algebra
        question: "Distância entre (0,0) e (3,4):"
        correctAnswer: 5
      - &a2
        type: algebra
        question: "Ponto médio entre (2,3) e (4,7):"
        correctAnswer: (3,5)
      - &a3
        type: algebra
        question: "Coeficiente angular da reta y = 2x + 1:"
        correctAnswer: 2
      - &a4
        type: algebra
        question: "Equação da reta que passa por (0,0) e (1,2):"
        correctAnswer: y = 2x
      - &a5
        type: algebra
        question: "Interseção da reta y = x com y = -x:"
        correctAnswer: (0,0)
      - &a6
        type: algebra
        question: "Centro da circunferência (x-2)² + (y-3)² = 25:"
        correctAnswer: (2,3)
      - &a7
        type: algebra
        question: "Raio da circunferência x² + y² = 9:"
        correctAnswer: 3
      - &a8
        type: algebra
        question: "Vértice da parábola y = x² - 4x + 3:"
        correctAnswer: (2,-1)
      - &a9
        type: algebra
        question: "Área do triângulo de vértices (0,0), (3,0), (0,4):"
        correctAnswer: 6
      - &a10
        type: algebra
        question: "Distância da origem à reta x + y = 2:"
        correctAnswer: √2
