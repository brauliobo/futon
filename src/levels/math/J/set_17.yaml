title: Álgebra Avançada — Conjunto 17
level: J
example: "Séries e sequências. Ex.: Σ(1/2^n) = 1 (convergente)"
subject: math
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 17 – Página 1
    description: Séries infinitas e convergência.
    exercises:
      - &a1
        type: algebra
        question: "Soma da série geométrica: 1 + 1/2 + 1/4 + ..."
        correctAnswer: 2
      - &a2
        type: algebra
        question: "Razão da série: 1, 3, 9, 27, ..."
        correctAnswer: r = 3
      - &a3
        type: algebra
        question: A série Σ(1/n) converge?
        correctAnswer: Não
      - &a4
        type: algebra
        question: A série Σ(1/n²) converge?
        correctAnswer: Sim
      - &a5
        type: algebra
        question: "Série de Taylor para e^x em x=0 (3 termos):"
        correctAnswer: 1 + x + x²/2
      - &a6
        type: algebra
        question: "n-ésimo termo da sequência: 2, 4, 6, 8, ..."
        correctAnswer: 2n
      - &a7
        type: algebra
        question: "Limite da sequência: aₙ = 1/n"
        correctAnswer: 0
      - &a8
        type: algebra
        question: "Série geométrica |r| < 1 é:"
        correctAnswer: Convergente
      - &a9
        type: algebra
        question: "Teste da razão: se L < 1, a série:"
        correctAnswer: Converge
      - &a10
        type: algebra
        question: "Raio de convergência de Σ(xⁿ):"
        correctAnswer: R = 1
