title: Álgebra Avançada — Conjunto 4
level: J
example: "Expressões racionais. Ex.: (x+1)/(x-1) simplificada"
subject: math
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 4 – Página 1
    description: Expressões racionais e frações algébricas.
    exercises:
      - &a1
        type: algebra
        question: "Simplifique: x²/x ="
        correctAnswer: x
      - &a2
        type: algebra
        question: "Simplifique: (x² - 4)/(x - 2) ="
        correctAnswer: x + 2
      - &a3
        type: algebra
        question: "Calcule: 1/x + 1/x ="
        correctAnswer: 2/x
      - &a4
        type: algebra
        question: "Simplifique: (6x³)/(3x²) ="
        correctAnswer: 2x
      - &a5
        type: algebra
        question: "Resolva: x/3 = 4"
        correctAnswer: x = 12
      - &a6
        type: algebra
        question: "Simplifique: (x + 3)/(x + 3) ="
        correctAnswer: 1
      - &a7
        type: algebra
        question: "Calcule: x/2 + x/4 ="
        correctAnswer: 3x/4
      - &a8
        type: algebra
        question: "Simplifique: (x² + 2x + 1)/(x + 1) ="
        correctAnswer: x + 1
      - &a9
        type: algebra
        question: "Para que valor de x é indefinida: 1/(x - 5)?"
        correctAnswer: x = 5
      - &a10
        type: algebra
        question: "Resolva: (x - 1)/2 = 3"
        correctAnswer: x = 7
