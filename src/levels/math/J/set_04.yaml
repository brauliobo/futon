title: Álgebra Avançada — Conjunto 4
level: J
example: "Expressões algébricas avançadas. Ex.: (x + 2)² = x² + 4x + 4"
subject: math
difficulty: 4
objectives:
  - math.advanced_algebra
authorNotes: Conjunto de math/J.
inputType: number
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 4 – Página 1
    description: Simplificação de expressões algébricas.
    exercises:
      - type: algebra
        question: (x + 10)²
        correctAnswer: x² + 20x + 100
        rationale: "Isole a incógnita usando operações inversas."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + 0)²
        correctAnswer: x² + 0x + 0
        rationale: "Isole a incógnita usando operações inversas."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + -7)²
        correctAnswer: x² - 14x + 49
        rationale: "Isole a incógnita usando operações inversas."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + -2)²
        correctAnswer: x² - 4x + 4
        rationale: "Vértice: x = -b/(2a), y = -Δ/(4a)."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + -6)²
        correctAnswer: x² - 12x + 36
        rationale: "Soma das raízes: -b/a; produto: c/a."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + -5)²
        correctAnswer: x² - 10x + 25
        rationale: "Se a > 0, parábola côncava para cima; a < 0, para baixo."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + -3)²
        correctAnswer: x² - 6x + 9
        rationale: "Complete o quadrado para forma canônica a(x - h)² + k."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + 1)²
        correctAnswer: x² + 2x + 1
        rationale: "Raízes reais ⇔ gráfico cruza o eixo x."
        difficulty: 3
        objectives: [math.advanced_algebra]
  - pageNumber: 2
    title: Álgebra Avançada — Conjunto 4 – Página 2
    description: Simplificação de expressões algébricas.
    exercises:
      - type: algebra
        question: (x + -10)²
        correctAnswer: x² - 20x + 100
        rationale: "Função quadrática tem simetria em x = -b/(2a)."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + 4)²
        correctAnswer: x² + 8x + 16
        rationale: "Valor extremo ocorre no vértice — máx ou mín conforme sinal de a."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + -3)²
        correctAnswer: x² - 6x + 9
        rationale: "Fatore: ax² + bx + c = a(x - r₁)(x - r₂)."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + 2)²
        correctAnswer: x² + 4x + 4
        rationale: "Ex.: x² - 5x + 6 = 0 → (x-2)(x-3) → x = 2 ou 3."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + -4)²
        correctAnswer: x² - 8x + 16
        rationale: "Fórmula de Bhaskara: x = (-b ± √Δ)/(2a)."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + 1)²
        correctAnswer: x² + 2x + 1
        rationale: "Discriminante Δ = b² - 4ac determina o número de raízes."
        difficulty: 3
        objectives: [math.advanced_algebra]
      - type: algebra
        question: (x + 5)²
        correctAnswer: x² + 10x + 25
        rationale: "Δ > 0: duas raízes reais distintas; Δ = 0: uma; Δ < 0: nenhuma real."
        difficulty: 3
        objectives: [math.advanced_algebra]
