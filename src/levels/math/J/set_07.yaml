title: Álgebra Avançada — Conjunto 7
level: J
example: "Progressões aritméticas. Ex.: 2, 5, 8, 11, ... (r=3)"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Álgebra Avançada — Conjunto 7 – Página 1
    description: Progressões aritméticas e geométricas.
    exercises:
      - &a1
        type: algebra
        question: Na PA (2, 5, 8, ...), qual é a razão?
        correctAnswer: r = 3
      - &a2
        type: algebra
        question: Na PA (3, 7, 11, ...), qual o 5º termo?
        correctAnswer: a₅ = 19
      - &a3
        type: algebra
        question: Na PG (2, 6, 18, ...), qual é a razão?
        correctAnswer: q = 3
      - &a4
        type: algebra
        question: "Soma dos 4 primeiros termos da PA (1, 3, 5, 7):"
        correctAnswer: S₄ = 16
      - &a5
        type: algebra
        question: Na PG (1, 2, 4, 8), qual o 6º termo?
        correctAnswer: a₆ = 32
      - &a6
        type: algebra
        question: "PA de 1º termo 5 e razão 3. Termo geral:"
        correctAnswer: aₙ = 5 + 3(n-1)
      - &a7
        type: algebra
        question: Na PA (..., 10, 15, 20, ...), qual o termo anterior a 10?
        correctAnswer: 5
      - &a8
        type: algebra
        question: "Soma infinita da PG (1, 1/2, 1/4, ...):"
        correctAnswer: S∞ = 2
      - &a9
        type: algebra
        question: "Média aritmética de 6 e 14:"
        correctAnswer: 10
      - &a10
        type: algebra
        question: "Média geométrica de 4 e 9:"
        correctAnswer: 6
