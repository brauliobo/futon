      - type: geometry
        question: -1·(5,7) = ?
        correctAnswer: (-5, -7)
        rationale: "Multiplicar por −1 é o oposto: (−5, −7)."
        difficulty: 2
        objectives:
          - linalg.vectors
      - type: geometry
        question: (1/2)·(4,6) = ?
        correctAnswer: (2, 3)
        rationale: "Multiplique cada componente por 1/2: (0.5·4, 0.5·6) = (2, 3)."
        difficulty: 2
        objectives:
