        question: "||(3,4)|| = ?"
        correctAnswer: 5
        rationale: "||v|| = √(3² + 4²) = √(9+16) = √25 = 5."
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: "||(6,8)|| = ?"
        correctAnswer: 10
        rationale: "||v|| = √(36+64) = √100 = 10 (escala 2× de (3,4))."
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: "||(1,0)|| = ?"
        correctAnswer: 1
        rationale: "||v|| = √(1² + 0²) = 1. Vetor unitário no eixo x."
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: "||(0,0)|| = ?"
        correctAnswer: 0
        rationale: "||v|| = √(0+0) = 0. Só o vetor nulo tem norma 0."
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: "||(5,12)|| = ?"
        correctAnswer: 13
        rationale: "||v|| = √(25+144) = √169 = 13 (terna 5-12-13)."
        difficulty: 3
        objectives:
          - linalg.vectors
