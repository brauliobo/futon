      - type: geometry
        question: (a,b)·(a,b) = a² + b² = ?
        correctAnswer: "||v||²"
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = ||u||·||v||·cos θ."
        difficulty: 3
        objectives: [linalg.vectors]
  - pageNumber: 7
    title: Vetores Perpendiculares
    description: u⊥v ⇔ u·v = 0.
    exercises:
      - type: geometry
        question: (1,0) e (0,1) são perpendiculares? (sim/não)
        correctAnswer: sim
        rationale: "Vetores perpendiculares ⇔ u·v = 0 (cos θ = 0)."
        difficulty: 3
        objectives: [linalg.vectors]
      - type: geometry
        question: (3,4) e (-4,3) são perpendiculares? (sim/não)
        correctAnswer: sim
        rationale: "Vetores perpendiculares ⇔ u·v = 0 (cos θ = 0)."
        difficulty: 3
        objectives: [linalg.vectors]
      - type: geometry
        question: (1,2) e (2,1) são perpendiculares? (sim/não)
        correctAnswer: não
        rationale: "Vetores perpendiculares ⇔ u·v = 0 (cos θ = 0)."
        difficulty: 3
        objectives: [linalg.vectors]
      - type: geometry
        question: Produto escalar de perpendiculares = ?
        correctAnswer: 0
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = ||u||·||v||·cos θ."
        difficulty: 3
        objectives: [linalg.vectors]
      - type: geometry
        question: "Vetor perpendicular a (a,b) no plano pode ser: (-b,a) ou ?"
        correctAnswer: (b
        -a):
        rationale: "Vetores perpendiculares ⇔ u·v = 0 (cos θ = 0)."
        difficulty: 3
        objectives: [linalg.vectors]
