  - pageNumber: 15
    title: Ângulo entre Vetores — prática 1
    description: cos(θ) = u·v / (||u||·||v||).
    exercises:
      - type: geometry
        question: cos(θ) entre (1,0) e (1,0) = ?
        correctAnswer: 1
        rationale: "Mesmo vetor: θ = 0°, cos 0° = 1."
        difficulty: 4
        objectives:
          - linalg.vectors
      - type: geometry
        question: cos(θ) entre (1,0) e (0,1) = ?
        correctAnswer: 0
        rationale: "Vetores perpendiculares: θ = 90°, cos 90° = 0."
        difficulty: 4
        objectives:
          - linalg.vectors
      - type: geometry
        question: cos(θ) entre (1,0) e (-1,0) = ?
        correctAnswer: -1
        rationale: "Vetores opostos: θ = 180°, cos 180° = −1."
        difficulty: 4
        objectives:
          - linalg.vectors
      - type: geometry
        question: Ângulo entre (1,1) e (1,0)? = 45° (V/F)
        correctAnswer: V
        rationale: cos θ = (1·1+1·0)/(√2·1) = 1/√2 → θ = 45°. Verdadeiro.
        difficulty: 4
        objectives:
          - linalg.vectors
      - type: geometry
        question: "Quando cos(θ)=0, vetores são: (perpendiculares/paralelos)"
        correctAnswer: perpendiculares
        rationale: cos θ = 0 ↔ θ = 90° ↔ perpendiculares.
        difficulty: 4
        objectives:
          - linalg.vectors
