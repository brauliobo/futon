title: Vetores no Plano
level: Q
subject: math
authorNotes: "Vetores no Plano. Foque no conceito central do conjunto e nos erros comuns."
inputType: number
difficulty: 3
objectives:
  - linalg.vectors
example: v = (3, 4); ||v|| = 5
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Representação
    description: Vetores como pares (x, y).
    exercises:
      - type: geometry
        question: Vetor de (0,0) a (3,4) = ?
        correctAnswer: (3
        4):
        rationale: "Vetor de A a B: B − A (componente a componente); oposto: −v."
        difficulty: 2
        objectives: [linalg.vectors]
      - type: geometry
        question: Vetor oposto a (3,4) = ?
        correctAnswer: (-3
        -4):
        rationale: "Vetor de A a B: B − A (componente a componente); oposto: −v."
        difficulty: 2
        objectives: [linalg.vectors]
      - type: geometry
        question: Vetor nulo = ?
        correctAnswer: (0
        0):
        rationale: "Vetor de A a B: B − A (componente a componente); oposto: −v."
        difficulty: 2
        objectives: [linalg.vectors]
      - type: geometry
        question: Vetor de (1,1) a (4,5) = (?, 4)
        correctAnswer: 3
        rationale: "Vetor de A a B: B − A (componente a componente); oposto: −v."
        difficulty: 2
        objectives: [linalg.vectors]
      - type: geometry
        question: Mesma questão anterior — componente y = ?
        correctAnswer: 4
        rationale: "Soma de vetores: componente a componente."
        difficulty: 2
        objectives: [linalg.vectors]
