    description: Norma — raiz de (x² + y²).
    exercises:
      - type: geometry
        question: "||(3,4)|| = ?"
        correctAnswer: 5
        rationale: "Norma (módulo): ||v|| = √(x² + y²)."
        difficulty: 3
        objectives: [linalg.vectors]
      - type: geometry
        question: "||(6,8)|| = ?"
        correctAnswer: 10
        rationale: "Norma (módulo): ||v|| = √(x² + y²)."
        difficulty: 3
        objectives: [linalg.vectors]
