        difficulty: 2
        objectives: [linalg.vectors]
      - type: geometry
        question: (5,0) + (-5,0) = ?
        correctAnswer: (0
        0):
        rationale: "Soma de vetores: componente a componente."
        difficulty: 2
        objectives: [linalg.vectors]
      - type: geometry
        question: (2,3) + (4,-1) = (6, ?)
        correctAnswer: 2
        rationale: "Soma de vetores: componente a componente."
        difficulty: 2
        objectives: [linalg.vectors]
