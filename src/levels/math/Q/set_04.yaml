title: Vetores no Plano
level: Q
subject: math
authorNotes: Vetores no Plano. Foque no conceito central do conjunto e nos erros comuns.
inputType: text
difficulty: 3
objectives:
  - linalg.vectors
example: v = (3, 4); ||v|| = 5
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Representação — prática 1
    description: Vetores como pares (x, y).
    exercises:
      - type: geometry
        question: Vetor de (0,0) a (3,4) = ?
        correctAnswer: (3, 4)
        rationale: B − A = (3,4) − (0,0) = (3, 4).
        difficulty: 2
        objectives:
          - linalg.vectors
      - type: geometry
        question: Vetor oposto a (3,4) = ?
        correctAnswer: (-3, -4)
        rationale: "Oposto: troca sinal componente a componente. −(3,4) = (−3, −4)."
        difficulty: 2
        objectives:
          - linalg.vectors
      - type: geometry
        question: Vetor nulo = ?
        correctAnswer: (0, 0)
        rationale: Vetor nulo é (0, 0) — elemento neutro da soma.
        difficulty: 2
        objectives:
          - linalg.vectors
      - type: geometry
        question: Vetor de (1,1) a (4,5) = (?, 4)
        correctAnswer: 3
        rationale: B − A = (4−1, 5−1) = (3, 4). Componente x = 3.
        difficulty: 2
        objectives:
          - linalg.vectors
      - type: geometry
        question: Mesma questão anterior — componente y = ?
        correctAnswer: 4
        rationale: Componente y do vetor (3, 4) = 4.
        difficulty: 2
        objectives:
          - linalg.vectors
