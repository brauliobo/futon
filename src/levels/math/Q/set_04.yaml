    exercises:
      - type: geometry
        question: (1,2)·(3,4) = 3 + 8 = ?
        correctAnswer: 11
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = ||u||·||v||·cos θ."
        difficulty: 3
        objectives: [linalg.vectors]
      - type: geometry
        question: (1,0)·(0,1) = ?
        correctAnswer: 0
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = ||u||·||v||·cos θ."
