  - pageNumber: 11
    title: Produto Escalar — prática 1
    description: u·v = x1·x2 + y1·y2.
    exercises:
      - type: geometry
        question: (1,2)·(3,4) = 3 + 8 = ?
        correctAnswer: 11
        rationale: u·v = 1·3 + 2·4 = 3 + 8 = 11.
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: (1,0)·(0,1) = ?
        correctAnswer: 0
        rationale: u·v = 1·0 + 0·1 = 0. Vetores perpendiculares.
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: (2,3)·(4,5) = 8 + 15 = ?
        correctAnswer: 23
        rationale: u·v = 2·4 + 3·5 = 8 + 15 = 23.
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: (5,0)·(0,5) = ?
        correctAnswer: 0
        rationale: u·v = 5·0 + 0·5 = 0. Eixos x e y são perpendiculares.
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: (a,b)·(a,b) = a² + b² = ?
        correctAnswer: "||v||²"
        rationale: v·v = a² + b² = ||v||². Produto escalar por si mesmo = norma ao
          quadrado.
        difficulty: 3
        objectives:
          - linalg.vectors
