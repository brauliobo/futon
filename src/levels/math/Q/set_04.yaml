  - pageNumber: 17
    title: Vetor Unitário — prática 1
    description: û = v / ||v||.
    exercises:
      - type: geometry
        question: Unitário de (3,4) = ?
        correctAnswer: (3/5, 4/5)
        rationale: "||(3,4)|| = 5, então v/||v|| = (3/5, 4/5)."
        difficulty: 4
        objectives:
          - linalg.vectors
      - type: geometry
        question: Unitário de (1,0) = ?
        correctAnswer: (1, 0)
        rationale: "Calcule ||(1,0)|| = 1. Como a norma já é 1, v é seu próprio
          unitário: (1, 0)."
        difficulty: 4
        objectives:
          - linalg.vectors
      - type: geometry
        question: Unitário de (0,5) = ?
        correctAnswer: (0, 1)
        rationale: "||(0,5)|| = 5, então v/||v|| = (0/5, 5/5) = (0, 1)."
        difficulty: 4
        objectives:
          - linalg.vectors
      - type: geometry
        question: Norma de qualquer unitário = ?
        correctAnswer: 1
        rationale: "Use a definição: vetor unitário é aquele cuja norma vale 1, então
          ||u|| = 1."
        difficulty: 4
        objectives:
