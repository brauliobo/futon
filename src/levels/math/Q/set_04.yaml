  - pageNumber: 13
    title: Vetores Perpendiculares — prática 1
    description: u⊥v ⇔ u·v = 0.
    exercises:
      - type: geometry
        question: (1,0) e (0,1) são perpendiculares? (não/sim)
        correctAnswer: sim
        rationale: Produto escalar 1·0 + 0·1 = 0 → perpendiculares.
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: (3,4) e (-4,3) são perpendiculares? (não/sim)
        correctAnswer: sim
        rationale: Produto escalar 3·(−4) + 4·3 = −12 + 12 = 0 → perpendiculares.
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: (1,2) e (2,1) são perpendiculares? (não/sim)
        correctAnswer: não
        rationale: Produto escalar 1·2 + 2·1 = 4 ≠ 0 → não perpendiculares.
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: Produto escalar de perpendiculares = ?
        correctAnswer: 0
        rationale: Vetores perpendiculares têm produto escalar zero, logo u·v = 0.
        difficulty: 3
        objectives:
          - linalg.vectors
      - type: geometry
        question: "Vetor perpendicular a (a,b) no plano pode ser: (-b,a) ou ?"
        correctAnswer: (b, -a)
        rationale: "Trocar componentes e negar um dos sinais: a outra escolha é (b, −a)."
        difficulty: 3
        objectives:
          - linalg.vectors
