  - pageNumber: 15
    title: Ângulos do Triângulo — prática 1
    description: Soma dos ângulos = 180°.
    exercises:
      - type: geometry
        question: Em triângulo com ângulos 60° e 70°, terceiro = ?
        correctAnswer: 50°
        rationale: "Soma interna = 180°: 180 − 60 − 70 = 50°."
        difficulty: 4
        objectives:
          - geometry.triangles
      - type: geometry
        question: Triângulo isósceles com ângulo da base 40°, ângulo do vértice = ?
        correctAnswer: 100°
        rationale: "Base com 40° em cada: vértice = 180 − 40 − 40 = 100°."
        difficulty: 4
        objectives:
          - geometry.triangles
      - type: geometry
        question: Triângulo equilátero tem ângulos = ?
        correctAnswer: 60°
        rationale: "Equilátero: 180°/3 = 60° por ângulo."
        difficulty: 4
        objectives:
          - geometry.triangles
      - type: geometry
        question: Triângulo retângulo com um ângulo 30° — outros ângulos?
        correctAnswer: 60 e 90
        rationale: Ângulo reto = 90°; terceiro = 180 − 90 − 30 = 60°. Logo 60° e 90°.
        difficulty: 4
        objectives:
          - geometry.triangles
      - type: geometry
        question: Soma dos ângulos de qualquer triângulo em graus = ?
        correctAnswer: 180°
        rationale: "Qualquer triângulo: soma interna = 180° (decorre da paralela ao lado
          pelo vértice oposto)."
        difficulty: 4
        objectives:
          - geometry.triangles
