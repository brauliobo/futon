  - pageNumber: 5
    title: Triângulos Especiais 30-60-90 — prática 1
    description: Lados na razão 1 — √3 — 2.
    exercises:
      - type: geometry
        question: Em 30-60-90, lado oposto a 30° = x; oposto a 60° = ?
        correctAnswer: x√3
        rationale: No 30-60-90, lado oposto a 60° = x·√3.
        difficulty: 2
        objectives:
          - geometry.triangles
      - type: geometry
        question: Em 30-60-90 com x=1, hipotenusa = ?
        correctAnswer: 2
        rationale: Hipotenusa = 2·(oposto a 30°) = 2·1 = 2.
        difficulty: 2
        objectives:
          - geometry.triangles
      - type: geometry
        question: Em 30-60-90 com x=2, lado de 60° = ?
        correctAnswer: 2√3
        rationale: Oposto a 60° = x·√3 = 2√3.
        difficulty: 2
        objectives:
          - geometry.triangles
      - type: geometry
        question: Em 30-60-90 com x=3, hipotenusa = ?
        correctAnswer: 6
        rationale: Hipotenusa = 2·x = 2·3 = 6.
        difficulty: 2
        objectives:
          - geometry.triangles
      - type: geometry
        question: sen(30°) = ?
        correctAnswer: 1/2
        rationale: sen(30°) = (oposto a 30°)/hipotenusa = 1/2.
        difficulty: 2
        objectives:
          - geometry.triangles
