    title: Revisão Integrada — prática 1
    description: Problemas variados.
    exercises:
      - type: geometry
        question: Triângulo com catetos 9 e 12 — hipotenusa = ?
        correctAnswer: 15
        rationale: 9² + 12² = 81 + 144 = 225. √225 = 15 (escala 3× da 3-4-5).
        difficulty: 4
        objectives:
          - geometry.triangles
      - type: geometry
        question: Em 30-60-90, se x=4, hipotenusa = ?
        correctAnswer: 8
        rationale: Hipotenusa = 2x = 2·4 = 8.
        difficulty: 4
        objectives:
          - geometry.triangles
      - type: geometry
        question: Em 45-45-90, cateto 5, hipotenusa = ?
        correctAnswer: 5√2
        rationale: "45-45-90: hipotenusa = cateto·√2 = 5√2."
        difficulty: 4
        objectives:
          - geometry.triangles
      - type: geometry
        question: Triângulo com ângulos 40° e 60°, terceiro = ?
        correctAnswer: 80°
        rationale: "Soma interna = 180°: 180 − 40 − 60 = 80°."
        difficulty: 4
        objectives:
          - geometry.triangles
      - type: geometry
        question: "Lei dos cossenos — se a=3, b=4, C=60°: c² = ?"
        correctAnswer: 13
        rationale: cos 60° = 0.5. c² = 9+16−2·3·4·0.5 = 25 − 12 = 13.
        difficulty: 4
        objectives:
          - geometry.triangles
