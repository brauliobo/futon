  - pageNumber: 13
    title: Congruência vs Semelhança — prática 1
    description: Congruentes — mesma forma e tamanho. Semelhantes — mesma forma.
    exercises:
      - type: geometry
        question: "Triângulos com lados 3,4,5 e 6,8,10 são: (congruentes/semelhantes)"
        correctAnswer: semelhantes
        rationale: "Lados proporcionais (razão 2), ângulos iguais, mas dimensões
          diferentes: semelhantes."
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: "Em semelhança, a razão entre os lados correspondentes é:
          (variável/constante)"
        correctAnswer: constante
        rationale: Em semelhança a razão k é constante para todos os pares de lados
          correspondentes.
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: Se dois triângulos são congruentes, são também semelhantes? (não/sim)
        correctAnswer: sim
        rationale: "Congruência é semelhança com k = 1: sim, todo congruente é
          semelhante."
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: Se dois triângulos são semelhantes, são sempre congruentes? (não/sim)
        correctAnswer: não
        rationale: "Só quando k = 1. Com k ≠ 1 as dimensões diferem: não."
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: Razão das áreas é razão dos lados ao quadrado (V/F)?
        correctAnswer: V
        rationale: "Áreas escalonam com k² (ex.: k=2 → área 4×). Verdadeiro."
        difficulty: 3
        objectives:
          - geometry.triangles
