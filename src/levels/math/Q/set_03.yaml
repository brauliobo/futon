  - pageNumber: 9
    title: Lei dos Cossenos — prática 1
    description: c² = a² + b² - 2ab·cos(C).
    exercises:
      - type: geometry
        question: "Com a=3, b=4, C=90°: c = ?"
        correctAnswer: 5
        rationale: cos 90° = 0 zera o termo −2ab·cos C. c² = 9+16 = 25, c = 5 (Pitágoras).
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: "Com a=5, b=5, C=60°: c = ?"
        correctAnswer: 5
        rationale: cos 60° = 1/2. c² = 25+25−2·25·0.5 = 25, c = 5.
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: "Se C=90°, a lei dos cossenos vira: (Pitágoras/Lei dos senos)"
        correctAnswer: Pitágoras
        rationale: "cos 90° = 0 zera o termo cruzado, reduzindo à forma a²+b²=c²:
          Pitágoras."
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: "Com a=8, b=6, C=60°: c² = 64+36-48 = ?"
        correctAnswer: 52
        rationale: cos 60° = 0.5. c² = 64+36−2·8·6·0.5 = 100−48 = 52.
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: c² acima implica c ≈ ?
        correctAnswer: 7.21
        rationale: "c² = 52 → c = √52 = √(4·13) = 2√13 ≈ 7.21."
        difficulty: 3
        objectives:
          - geometry.triangles
