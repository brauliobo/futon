  - pageNumber: 11
    title: Lei dos Senos — prática 1
    description: a/sen(A) = b/sen(B) = c/sen(C).
    exercises:
      - type: geometry
        question: Se a=5 e sen(A)=0.5, 2R = 10 (V/F)?
        correctAnswer: V
        rationale: 2R = a/sen A = 5/0.5 = 10. Verdadeiro.
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: Se a/sen(A)=10, b=? quando sen(B)=0.4
        correctAnswer: 4
        rationale: b = 2R·sen B = 10·0.4 = 4.
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: Se a=8, A=30°, B=60°, b = ?
        correctAnswer: 8√3
        rationale: b = a·sen B/sen A = 8·(√3/2)/(1/2) = 8√3.
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: Todos os lados sobre seno dos ângulos opostos são (diferentes/iguais)
        correctAnswer: iguais
        rationale: a/sen A = b/sen B = c/sen C — todos iguais a 2R (razão constante).
        difficulty: 3
        objectives:
          - geometry.triangles
      - type: geometry
        question: A razão a/sen(A) é o diâmetro da circunferência circunscrita (V/F)?
        correctAnswer: V
        rationale: "Lei dos senos: a/sen A = 2R, onde R é o raio da circunferência
          circunscrita."
        difficulty: 3
        objectives:
          - geometry.triangles
