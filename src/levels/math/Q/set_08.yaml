        difficulty: 3
        objectives:
          - geometry.circle
      - type: geometry
        question: "Ângulo inscrito de 35° — arco correspondente = ?°"
        correctAnswer: 70
        rationale: "Arco = 2·ângulo inscrito = 2·35 = 70°."
        difficulty: 3
        objectives:
          - geometry.circle
      - type: geometry
        question: "Ângulo inscrito sobre diâmetro = ?°"
        correctAnswer: 90
        rationale: "Teorema de Tales: ângulo inscrito sobre diâmetro é sempre 90°."
        difficulty: 3
        objectives:
          - geometry.circle
      - type: geometry
        question: "Dois arcos opostos de 120° e 240° — ângulo entre cordas = ?°"
        correctAnswer: 60
        rationale: "Ângulo entre duas cordas = média dos arcos interceptados = (120+0)/2 quando o arco menor é 120°."
        difficulty: 4
        objectives:
          - geometry.circle
      - type: geometry
        question: "Polígono inscrito — soma ângulos internos de quadrilátero inscrito = ?°"
        correctAnswer: 360
        rationale: "Quadrilátero: soma dos ângulos internos = 360°."
        difficulty: 3
        objectives:
          - geometry.circle
