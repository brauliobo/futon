        difficulty: 3
        objectives:
          - geometry.circle
      - type: geometry
        question: "(x-1)²+(y-2)²=9 — centro = (1, ?)"
        correctAnswer: 2
        rationale: "Centro (a,b) com a=1, b=2."
        difficulty: 3
        objectives:
          - geometry.circle
      - type: geometry
        question: "(x+2)²+(y-3)²=25 — raio = ?"
        correctAnswer: 5
        rationale: "r² = 25 → r = 5."
        difficulty: 3
        objectives:
          - geometry.circle
