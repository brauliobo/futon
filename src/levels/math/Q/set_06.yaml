title: Sistemas Lineares
level: Q
subject: math
inputType: number
difficulty: 4
objectives: [linalg.systems]
example: "Resolva { 2x+y=5, x-y=1 }"
pages:
  - pageNumber: 1
    title: Substituição
    description: Isole uma variável e substitua.
    exercises:
      - { type: algebra, question: "Se x = y+1 e 2x+y=5, y = ?", correctAnswer: 1 }
      - { type: algebra, question: "Então x = ?", correctAnswer: 2 }
      - { type: algebra, question: "Se x=2y, x+y=6 → y = ?", correctAnswer: 2 }
      - { type: algebra, question: "Então x = ?", correctAnswer: 4 }
      - { type: algebra, question: "Se x+y=10 e x-y=2, x = ?", correctAnswer: 6 }
  - pageNumber: 2
    title: Adição (Eliminação)
    description: Soma ou subtração para eliminar variável.
    exercises:
      - { type: algebra, question: "Somando x+y=5 e x-y=3 → 2x = ?", correctAnswer: 8 }
      - { type: algebra, question: "Então x = ?", correctAnswer: 4 }
      - { type: algebra, question: "y = ?", correctAnswer: 1 }
      - { type: algebra, question: "x+y=7 e x-y=1 → x = ?", correctAnswer: 4 }
      - { type: algebra, question: "Mesma situação — y = ?", correctAnswer: 3 }
  - pageNumber: 3
    title: Classificação
    description: Determinado (1 solução), indeterminado (infinitas), impossível.
    exercises:
      - { type: algebra, question: "Sistema com uma solução única: (determinado/impossível/indeterminado)", correctAnswer: determinado }
      - { type: algebra, question: "Sistema sem solução: (impossível/determinado/indeterminado)", correctAnswer: impossível }
      - { type: algebra, question: "Sistema com infinitas soluções: (indeterminado/impossível)", correctAnswer: indeterminado }
      - { type: algebra, question: "x+y=2 e 2x+2y=4 é: (indeterminado/determinado)", correctAnswer: indeterminado }
      - { type: algebra, question: "x+y=2 e x+y=3 é: (impossível/determinado)", correctAnswer: impossível }
  - pageNumber: 4
    title: Sistemas 3×3
    description: Três incógnitas.
    exercises:
      - { type: algebra, question: "Sistema 3×3 com det(A) ≠ 0 é: (determinado/indeterminado)", correctAnswer: determinado }
      - { type: algebra, question: "Se x+y+z=6, x-y=0, y-z=0 → x=y=z= ?", correctAnswer: 2 }
      - { type: algebra, question: "Se x=1, y=2, z=3 satisfaz x+y+z=6 (V/F)?", correctAnswer: V }
      - { type: algebra, question: "Quantas equações são necessárias para determinar 3 variáveis? (3/2/4)", correctAnswer: 3 }
      - { type: algebra, question: "Escalonamento transforma sistema em: (triangular/identidade/nula)", correctAnswer: triangular }
  - pageNumber: 5
    title: Método de Gauss
    description: Elimine elementos abaixo da diagonal.
    exercises:
      - { type: algebra, question: "Após escalonamento temos matriz: (triangular superior/inferior/nenhuma)", correctAnswer: triangular superior }
      - { type: algebra, question: "Gauss-Jordan produz: (identidade/triangular/diagonal)", correctAnswer: identidade }
      - { type: algebra, question: "Matriz aumentada tem: (coeficientes + termos independentes/só coeficientes)", correctAnswer: coeficientes + termos independentes }
      - { type: algebra, question: "Operações elementares — trocar linhas, multiplicar linha por k≠0, somar múltiplo de uma linha a outra (V/F)?", correctAnswer: V }
      - { type: algebra, question: "Após Gauss, posto(A) = rank; solução única se posto = número de variáveis (V/F)?", correctAnswer: V }
  - pageNumber: 6
    title: Regra de Cramer
    description: xᵢ = det(Aᵢ)/det(A).
    exercises:
      - { type: algebra, question: "Em 2x+y=5 e x-y=1, det da matriz principal [2 1; 1 -1] = ?", correctAnswer: -3 }
      - { type: algebra, question: "Det da matriz de x ([5 1; 1 -1]) = ?", correctAnswer: -6 }
      - { type: algebra, question: "Então x = ?", correctAnswer: 2 }
      - { type: algebra, question: "Det da matriz de y ([2 5; 1 1]) = ?", correctAnswer: -3 }
      - { type: algebra, question: "Então y = ?", correctAnswer: 1 }
  - pageNumber: 7
    title: Aplicações
    description: Problemas de palavras.
    exercises:
      - { type: algebra, question: "Dois números com soma 10 e diferença 2 — maior = ?", correctAnswer: 6 }
      - { type: algebra, question: "Mesma situação — menor = ?", correctAnswer: 4 }
      - { type: algebra, question: "Preços: 2A+B=10 e A+B=6 → A = ?", correctAnswer: 4 }
      - { type: algebra, question: "Idades — A+B=30, A-B=10 → A = ?", correctAnswer: 20 }
      - { type: algebra, question: "Mesma situação — B = ?", correctAnswer: 10 }
  - pageNumber: 8
    title: Sistemas Homogêneos
    description: Ax = 0 sempre tem solução trivial.
    exercises:
      - { type: algebra, question: "Sistema homogêneo tem solução x=0 sempre? (sim/não)", correctAnswer: sim }
      - { type: algebra, question: "Solução não-trivial de Ax=0 existe se det(A) = ?", correctAnswer: 0 }
      - { type: algebra, question: "Se det(A)=5, Ax=0 tem só solução: (trivial/infinitas)", correctAnswer: trivial }
      - { type: algebra, question: "x+y=0 e x-y=0 → x = ?", correctAnswer: 0 }
      - { type: algebra, question: "Mesma situação — y = ?", correctAnswer: 0 }
  - pageNumber: 9
    title: Interpretação Geométrica
    description: 2 retas — 1 ponto, paralelas, coincidentes.
    exercises:
      - { type: algebra, question: "Sistema determinado = retas: (se cruzam/paralelas)", correctAnswer: se cruzam }
      - { type: algebra, question: "Sistema impossível = retas: (paralelas/coincidentes)", correctAnswer: paralelas }
      - { type: algebra, question: "Sistema indeterminado = retas: (coincidentes/paralelas)", correctAnswer: coincidentes }
      - { type: algebra, question: "Retas com mesmos coeficientes angulares e diferentes termos são: (paralelas/coincidentes)", correctAnswer: paralelas }
      - { type: algebra, question: "Em 3D, planos paralelos podem: (não se encontrar/coincidir)", correctAnswer: não se encontrar }
  - pageNumber: 10
    title: Revisão Integrada
    description: Resolva e classifique.
    exercises:
      - { type: algebra, question: "x+y=5, x-y=1 → x = ?", correctAnswer: 3 }
      - { type: algebra, question: "Mesma — y = ?", correctAnswer: 2 }
      - { type: algebra, question: "2x+3y=12 e x+y=5 → x = ?", correctAnswer: 3 }
      - { type: algebra, question: "Mesma — y = ?", correctAnswer: 2 }
      - { type: algebra, question: "x+y=4 e 2x+2y=8 é: (indeterminado/determinado/impossível)", correctAnswer: indeterminado }
target: 50
