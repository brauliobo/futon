  - pageNumber: 7
    title: Sistemas 3×3 — prática 1
    description: Três incógnitas.
    exercises:
      - type: algebra
        question: "Sistema 3×3 com det(A) ≠ 0 é: (determinado/indeterminado)"
        correctAnswer: determinado
        rationale: "Determinado: 1 solução; impossível: 0; indeterminado: infinitas
          soluções."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: Se x+y+z=6, x-y=0, y-z=0 → x=y=z= ?
        correctAnswer: 2
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua
          para isolar variáveis."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: Se x=1, y=2, z=3 satisfaz x+y+z=6 (V/F)?
        correctAnswer: V
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua
          para isolar variáveis."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: Quantas equações são necessárias para determinar 3 variáveis? (3/2/4)
        correctAnswer: 3
        rationale: "Interpretação geométrica: determinado = retas concorrentes;
          impossível = paralelas; indeterminado = coincidentes."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: "Escalonamento transforma sistema em: (nula/triangular/identidade)"
        correctAnswer: triangular
        rationale: "Escalonamento de Gauss: triangula o sistema via operações
          elementares nas linhas."
        difficulty: 3
        objectives:
          - linalg.systems
