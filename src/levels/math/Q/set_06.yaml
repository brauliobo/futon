title: Sistemas Lineares
level: Q
subject: math
authorNotes: Sistemas Lineares. Foque no conceito central do conjunto e nos erros comuns.
inputType: text
difficulty: 4
objectives:
  - linalg.systems
example: Resolva { 2x+y=5, x-y=1 }
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Substituição — prática 1
    description: Isole uma variável e substitua.
    exercises:
      - type: algebra
        question: Se x = y+1 e 2x+y=5, y = ?
        correctAnswer: 1
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua
          para isolar variáveis."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: Com y=1, no sistema x = y+1 e 2x+y=5, x = ?
        correctAnswer: 2
        rationale: x = y+1 = 1+1 = 2.
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: Se x=2y, x+y=6 → y = ?
        correctAnswer: 2
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua
          para isolar variáveis."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: Com y=2, no sistema x=2y, x+y=6, x = ?
        correctAnswer: 4
        rationale: x = 2y = 2·2 = 4.
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: Se x+y=10 e x-y=2, x = ?
        correctAnswer: 6
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua
          para isolar variáveis."
        difficulty: 3
        objectives:
          - linalg.systems
