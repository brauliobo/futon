title: Sistemas Lineares
level: Q
subject: math
inputType: number
difficulty: 4
objectives:
  - linalg.systems
example: Resolva { 2x+y=5, x-y=1 }
pages:
  - pageNumber: 1
    title: Substituição
    description: Isole uma variável e substitua.
    exercises:
      - type: algebra
        question: Se x = y+1 e 2x+y=5, y = ?
        correctAnswer: 1
        rationale: "Isole a incógnita usando operações inversas."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: Então x = ?
        correctAnswer: 2
        rationale: "Isole a incógnita usando operações inversas."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: Se x=2y, x+y=6 → y = ?
        correctAnswer: 2
        rationale: "Isole a incógnita usando operações inversas."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: Então x = ?
        correctAnswer: 4
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = |u||v|cos θ."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: Se x+y=10 e x-y=2, x = ?
        correctAnswer: 6
        rationale: "Determinante 2×2: ad - bc."
        difficulty: 3
        objectives: [linalg.systems]
  - pageNumber: 2
    title: Adição (Eliminação)
    description: Soma ou subtração para eliminar variável.
    exercises:
      - type: algebra
        question: Somando x+y=5 e x-y=3 → 2x = ?
        correctAnswer: 8
        rationale: "Área do triângulo por determinante: ½|det|."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: Então x = ?
        correctAnswer: 4
        rationale: "Matriz produto: linha × coluna, soma dos produtos."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: y = ?
        correctAnswer: 1
        rationale: "Matriz identidade I: A·I = A."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: x+y=7 e x-y=1 → x = ?
        correctAnswer: 4
        rationale: "Retângulo: A = base × altura."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: Mesma situação — y = ?
        correctAnswer: 3
        rationale: "Triângulo: A = (base × altura)/2."
        difficulty: 3
        objectives: [linalg.systems]
  - pageNumber: 3
    title: Classificação
    description: Determinado (1 solução), indeterminado (infinitas), impossível.
    exercises:
      - type: algebra
        question: "Sistema com uma solução única: (determinado/impossível/indeterminado)"
        correctAnswer: determinado
        rationale: "Área do quadrado: lado²."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: "Sistema sem solução: (impossível/determinado/indeterminado)"
        correctAnswer: impossível
        rationale: "Área do círculo: πr²."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: "Sistema com infinitas soluções: (indeterminado/impossível)"
        correctAnswer: indeterminado
        rationale: "Distância entre pontos: d = √((x₂-x₁)² + (y₂-y₁)²)."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: "x+y=2 e 2x+2y=4 é: (indeterminado/determinado)"
        correctAnswer: indeterminado
        rationale: "Ponto médio: ((x₁+x₂)/2, (y₁+y₂)/2)."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: "x+y=2 e x+y=3 é: (impossível/determinado)"
        correctAnswer: impossível
        rationale: "Equação da reta: y - y₀ = m(x - x₀), m = Δy/Δx."
        difficulty: 3
        objectives: [linalg.systems]
  - pageNumber: 4
    title: Sistemas 3×3
    description: Três incógnitas.
    exercises:
      - type: algebra
        question: "Sistema 3×3 com det(A) ≠ 0 é: (determinado/indeterminado)"
        correctAnswer: determinado
        rationale: "Retas paralelas: mesmos coeficientes angulares."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: Se x+y+z=6, x-y=0, y-z=0 → x=y=z= ?
        correctAnswer: 2
        rationale: "Retas perpendiculares: m₁ · m₂ = -1."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: Se x=1, y=2, z=3 satisfaz x+y+z=6 (V/F)?
        correctAnswer: V
        rationale: "Circunferência: (x - a)² + (y - b)² = r²."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: Quantas equações são necessárias para determinar 3 variáveis? (3/2/4)
        correctAnswer: 3
        rationale: "Vetor: soma componente a componente; módulo √(x² + y²)."
        difficulty: 3
        objectives: [linalg.systems]
      - type: algebra
        question: "Escalonamento transforma sistema em: (triangular/identidade/nula)"
        correctAnswer: triangular
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = |u||v|cos θ."
        difficulty: 3
        objectives: [linalg.systems]
  - pageNumber: 5
    title: Método de Gauss
    description: Elimine elementos abaixo da diagonal.
    exercises:
      - type: algebra
        question: "Após escalonamento temos matriz: (triangular superior/inferior/nenhuma)"
        correctAnswer: triangular superior
        rationale: "Determinante 2×2: ad - bc."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: "Gauss-Jordan produz: (identidade/triangular/diagonal)"
        correctAnswer: identidade
        rationale: "Área do triângulo por determinante: ½|det|."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: "Matriz aumentada tem: (coeficientes + termos independentes/só coeficientes)"
        correctAnswer: coeficientes + termos independentes
        rationale: "Matriz produto: linha × coluna, soma dos produtos."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: Operações elementares — trocar linhas, multiplicar linha por k≠0, somar múltiplo de uma linha a outra (V/F)?
        correctAnswer: V
        rationale: "Matriz identidade I: A·I = A."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: Após Gauss, posto(A) = rank; solução única se posto = número de variáveis (V/F)?
        correctAnswer: V
        rationale: "Retângulo: A = base × altura."
        difficulty: 4
        objectives: [linalg.systems]
  - pageNumber: 6
    title: Regra de Cramer
    description: xᵢ = det(Aᵢ)/det(A).
    exercises:
      - type: algebra
        question: Em 2x+y=5 e x-y=1, det da matriz principal [2 1; 1 -1] = ?
        correctAnswer: -3
        rationale: "Triângulo: A = (base × altura)/2."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: Det da matriz de x ([5 1; 1 -1]) = ?
        correctAnswer: -6
        rationale: "Área do quadrado: lado²."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: Então x = ?
        correctAnswer: 2
        rationale: "Área do círculo: πr²."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: Det da matriz de y ([2 5; 1 1]) = ?
        correctAnswer: -3
        rationale: "Distância entre pontos: d = √((x₂-x₁)² + (y₂-y₁)²)."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: Então y = ?
        correctAnswer: 1
        rationale: "Ponto médio: ((x₁+x₂)/2, (y₁+y₂)/2)."
        difficulty: 4
        objectives: [linalg.systems]
  - pageNumber: 7
    title: Aplicações
    description: Problemas de palavras.
    exercises:
      - type: algebra
        question: Dois números com soma 10 e diferença 2 — maior = ?
        correctAnswer: 6
        rationale: "Equação da reta: y - y₀ = m(x - x₀), m = Δy/Δx."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: Mesma situação — menor = ?
        correctAnswer: 4
        rationale: "Retas paralelas: mesmos coeficientes angulares."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: "Preços: 2A+B=10 e A+B=6 → A = ?"
        correctAnswer: 4
        rationale: "Retas perpendiculares: m₁ · m₂ = -1."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: Idades — A+B=30, A-B=10 → A = ?
        correctAnswer: 20
        rationale: "Circunferência: (x - a)² + (y - b)² = r²."
        difficulty: 4
        objectives: [linalg.systems]
      - type: algebra
        question: Mesma situação — B = ?
        correctAnswer: 10
        rationale: "Vetor: soma componente a componente; módulo √(x² + y²)."
        difficulty: 4
        objectives: [linalg.systems]
  - pageNumber: 8
    title: Sistemas Homogêneos
    description: Ax = 0 sempre tem solução trivial.
    exercises:
      - type: algebra
        question: Sistema homogêneo tem solução x=0 sempre? (sim/não)
        correctAnswer: sim
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = |u||v|cos θ."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: Solução não-trivial de Ax=0 existe se det(A) = ?
        correctAnswer: 0
        rationale: "Determinante 2×2: ad - bc."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: "Se det(A)=5, Ax=0 tem só solução: (trivial/infinitas)"
        correctAnswer: trivial
        rationale: "Área do triângulo por determinante: ½|det|."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: x+y=0 e x-y=0 → x = ?
        correctAnswer: 0
        rationale: "Matriz produto: linha × coluna, soma dos produtos."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: Mesma situação — y = ?
        correctAnswer: 0
        rationale: "Matriz identidade I: A·I = A."
        difficulty: 5
        objectives: [linalg.systems]
  - pageNumber: 9
    title: Interpretação Geométrica
    description: 2 retas — 1 ponto, paralelas, coincidentes.
    exercises:
      - type: algebra
        question: "Sistema determinado = retas: (se cruzam/paralelas)"
        correctAnswer: se cruzam
        rationale: "Retângulo: A = base × altura."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: "Sistema impossível = retas: (paralelas/coincidentes)"
        correctAnswer: paralelas
        rationale: "Triângulo: A = (base × altura)/2."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: "Sistema indeterminado = retas: (coincidentes/paralelas)"
        correctAnswer: coincidentes
        rationale: "Área do quadrado: lado²."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: "Retas com mesmos coeficientes angulares e diferentes termos são: (paralelas/coincidentes)"
        correctAnswer: paralelas
        rationale: "Área do círculo: πr²."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: "Em 3D, planos paralelos podem: (não se encontrar/coincidir)"
        correctAnswer: não se encontrar
        rationale: "Distância entre pontos: d = √((x₂-x₁)² + (y₂-y₁)²)."
        difficulty: 5
        objectives: [linalg.systems]
  - pageNumber: 10
    title: Revisão Integrada
    description: Resolva e classifique.
    exercises:
      - type: algebra
        question: x+y=5, x-y=1 → x = ?
        correctAnswer: 3
        rationale: "Ponto médio: ((x₁+x₂)/2, (y₁+y₂)/2)."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: Mesma — y = ?
        correctAnswer: 2
        rationale: "Equação da reta: y - y₀ = m(x - x₀), m = Δy/Δx."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: 2x+3y=12 e x+y=5 → x = ?
        correctAnswer: 3
        rationale: "Retas paralelas: mesmos coeficientes angulares."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: Mesma — y = ?
        correctAnswer: 2
        rationale: "Retas perpendiculares: m₁ · m₂ = -1."
        difficulty: 5
        objectives: [linalg.systems]
      - type: algebra
        question: "x+y=4 e 2x+2y=8 é: (indeterminado/determinado/impossível)"
        correctAnswer: indeterminado
        rationale: "Circunferência: (x - a)² + (y - b)² = r²."
        difficulty: 5
        objectives: [linalg.systems]
target: 50
