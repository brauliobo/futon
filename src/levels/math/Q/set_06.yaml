  - pageNumber: 3
    title: Adição (Eliminação) — prática 1
    description: Soma ou subtração para eliminar variável.
    exercises:
      - type: algebra
        question: Somando x+y=5 e x-y=3 → 2x = ?
        correctAnswer: 8
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua
          para isolar variáveis."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: De 2x=8, então x = ?
        correctAnswer: 4
        rationale: "Divida ambos os lados por 2: x = 8/2 = 4."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: y = ?
        correctAnswer: 1
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua
          para isolar variáveis."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: x+y=7 e x-y=1 → x = ?
        correctAnswer: 4
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua
          para isolar variáveis."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: No sistema x+y=7 e x-y=1, y = ?
        correctAnswer: 3
        rationale: "Substituindo x=4 em x+y=7: y = 7-4 = 3."
        difficulty: 3
        objectives:
          - linalg.systems
