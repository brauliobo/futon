  - pageNumber: 5
    title: Classificação — prática 1
    description: Determinado (1 solução), indeterminado (infinitas), impossível.
    exercises:
      - type: algebra
        question: "Sistema com uma solução única: (indeterminado/impossível/determinado)"
        correctAnswer: determinado
        rationale: "Determinado: 1 solução; impossível: 0; indeterminado: infinitas
          soluções."
        difficulty: 3
        objectives:
          - linalg.systems
      - type: algebra
        question: "Sistema sem solução: (impossível/indeterminado/determinado)"
        correctAnswer: impossível
