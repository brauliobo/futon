title: Geometria & Linear — Revisão Integrada
level: Q
subject: math
inputType: number
difficulty: 5
objectives:
  - geometry
  - linalg
example: Áreas + volumes + vetores + matrizes.
pages:
  - pageNumber: 1
    title: Áreas e Perímetros
    description: Revise figuras planas.
    exercises:
      - type: geometry
        question: Retângulo 5×8 — área = ?
        correctAnswer: 40
        rationale: "Use a fórmula geométrica adequada à figura."
      - type: geometry
        question: Círculo r=5 — área = ?π
        correctAnswer: 25
        rationale: "Use a fórmula geométrica adequada à figura."
      - type: geometry
        question: Triângulo b=10, h=4 — área = ?
        correctAnswer: 20
        rationale: "Use a fórmula geométrica adequada à figura."
      - type: geometry
        question: Trapézio B=12, b=8, h=5 — área = ?
        correctAnswer: 50
        rationale: "Área do triângulo por determinante: ½|det|."
      - type: geometry
        question: Quadrado lado 6 — perímetro = ?
        correctAnswer: 24
        rationale: "Matriz produto: linha × coluna, soma dos produtos."
  - pageNumber: 2
    title: Volumes
    description: Revise sólidos.
    exercises:
      - type: geometry
        question: Cubo lado 4 — V = ?
        correctAnswer: 64
        rationale: "Matriz identidade I: A·I = A."
      - type: geometry
        question: Cilindro r=2, h=5 — V = ?π
        correctAnswer: 20
        rationale: "Retângulo: A = base × altura."
      - type: geometry
        question: Esfera r=3 — V = ?π
        correctAnswer: 36
        rationale: "Triângulo: A = (base × altura)/2."
      - type: geometry
        question: Cone r=2, h=6 — V = ?π
        correctAnswer: 8
        rationale: "Área do quadrado: lado²."
      - type: geometry
        question: Pirâmide base 4×4, h=9 — V = ?
        correctAnswer: 48
        rationale: "Área do círculo: πr²."
  - pageNumber: 3
    title: Pitágoras & Triângulos
    description: Hipotenusas e identidades.
    exercises:
      - type: geometry
        question: Catetos 7 e 24 — hipotenusa = ?
        correctAnswer: 25
        rationale: "Distância entre pontos: d = √((x₂-x₁)² + (y₂-y₁)²)."
      - type: geometry
        question: Triângulo equilátero lado 6 — área = ?
        correctAnswer: 9√3
        rationale: "Ponto médio: ((x₁+x₂)/2, (y₁+y₂)/2)."
      - type: geometry
        question: Triângulo 30-60-90 com x=5 — hipotenusa = ?
        correctAnswer: 10
        rationale: "Equação da reta: y - y₀ = m(x - x₀), m = Δy/Δx."
      - type: geometry
        question: Quadrado diagonal 10 — lado = ?
        correctAnswer: 5√2
        rationale: "Retas paralelas: mesmos coeficientes angulares."
      - type: geometry
        question: Soma dos ângulos internos de um triângulo = ?°
        correctAnswer: 180
        rationale: "Retas perpendiculares: m₁ · m₂ = -1."
  - pageNumber: 4
    title: Vetores
    description: Operações e norma.
    exercises:
      - type: geometry
        question: (1,2) + (3,4) = ?
        correctAnswer: (4
        6): null
        rationale: "Circunferência: (x - a)² + (y - b)² = r²."
      - type: geometry
        question: "||(8,6)|| = ?"
        correctAnswer: 10
        rationale: "Vetor: soma componente a componente; módulo √(x² + y²)."
      - type: geometry
        question: (2,3)·(4,-1) = ?
        correctAnswer: 5
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = |u||v|cos θ."
      - type: geometry
        question: 3·(1,2) = ?
        correctAnswer: (3
        6): null
        rationale: "Determinante 2×2: ad - bc."
      - type: geometry
        question: Unitário de (3,4) = ?
        correctAnswer: (3/5
        4/5): null
        rationale: "Área do triângulo por determinante: ½|det|."
  - pageNumber: 5
    title: Matrizes
    description: Det e multiplicação.
    exercises:
      - type: algebra
        question: det([3 2; 1 4]) = ?
        correctAnswer: 10
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: det da identidade 3×3 = ?
        correctAnswer: 1
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: "A (2×3) · B (3×4) é dimensão: ?"
        correctAnswer: 2×4
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: A · I = ?
        correctAnswer: A
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = |u||v|cos θ."
      - type: algebra
        question: det 2×2 de [a b; c d] = ?
        correctAnswer: ad-bc
        rationale: "Determinante 2×2: ad - bc."
  - pageNumber: 6
    title: Sistemas
    description: Cramer e classificação.
    exercises:
      - type: algebra
        question: x+y=10, x-y=4 → x = ?
        correctAnswer: 7
        rationale: "Área do triângulo por determinante: ½|det|."
      - type: algebra
        question: Mesma — y = ?
        correctAnswer: 3
        rationale: "Matriz produto: linha × coluna, soma dos produtos."
      - type: algebra
        question: "Sistema com det=0 e termos compatíveis é: (indeterminado/impossível)"
        correctAnswer: indeterminado
        rationale: "Matriz identidade I: A·I = A."
      - type: algebra
        question: "Sistema com det=0 e termos incompatíveis é: (impossível/indeterminado)"
        correctAnswer: impossível
        rationale: "Retângulo: A = base × altura."
      - type: algebra
        question: "Sistema com det ≠ 0 é: (determinado)"
        correctAnswer: determinado
        rationale: "Triângulo: A = (base × altura)/2."
  - pageNumber: 7
    title: Geometria Analítica
    description: Distância, coeficiente angular.
    exercises:
      - type: geometry
        question: Distância entre (0,0) e (3,4) = ?
        correctAnswer: 5
        rationale: "Matriz produto: linha × coluna, soma dos produtos."
      - type: geometry
        question: Distância entre (1,1) e (4,5) = ?
        correctAnswer: 5
        rationale: "Matriz identidade I: A·I = A."
      - type: geometry
        question: Coef. angular entre (0,0) e (2,4) = ?
        correctAnswer: 2
        rationale: "Retângulo: A = base × altura."
      - type: geometry
        question: Coef. angular entre (1,3) e (3,7) = ?
        correctAnswer: 2
        rationale: "Triângulo: A = (base × altura)/2."
      - type: geometry
        question: Retas perpendiculares têm produto dos coef. angulares = ?
        correctAnswer: -1
        rationale: "Área do quadrado: lado²."
  - pageNumber: 8
    title: Equações de Retas
    description: y = mx + b.
    exercises:
      - type: algebra
        question: "Reta por (0,2) com m=3: y = ?x + 2"
        correctAnswer: 3
        rationale: "Área do quadrado: lado²."
      - type: algebra
        question: Reta y = 2x + 5 — intercepto y = ?
        correctAnswer: 5
        rationale: "Área do círculo: πr²."
      - type: algebra
        question: Reta y = -x + 4 — coef. angular = ?
        correctAnswer: -1
        rationale: "Distância entre pontos: d = √((x₂-x₁)² + (y₂-y₁)²)."
      - type: algebra
        question: Para (1,2) e (3,6), m = ?
        correctAnswer: 2
        rationale: "Ponto médio: ((x₁+x₂)/2, (y₁+y₂)/2)."
      - type: algebra
        question: Mesma reta — passa por (0, ?)
        correctAnswer: 0
        rationale: "Equação da reta: y - y₀ = m(x - x₀), m = Δy/Δx."
  - pageNumber: 9
    title: Circunferência
    description: Equação (x-a)² + (y-b)² = r².
    exercises:
      - type: geometry
        question: "Circunferência com centro (0,0) e r=3: x² + y² = ?"
        correctAnswer: 9
        rationale: "Área do círculo: πr²."
      - type: geometry
        question: "Centro (2,1) e r=5: (x-2)² + (y-1)² = ?"
        correctAnswer: 25
        rationale: "Distância entre pontos: d = √((x₂-x₁)² + (y₂-y₁)²)."
      - type: geometry
        question: x²+y²=16 — raio = ?
        correctAnswer: 4
        rationale: "Ponto médio: ((x₁+x₂)/2, (y₁+y₂)/2)."
      - type: geometry
        question: (x-3)²+(y+4)² = 1 — centro = ?
        correctAnswer: (3
        -4): null
        rationale: "Equação da reta: y - y₀ = m(x - x₀), m = Δy/Δx."
      - type: geometry
        question: Circunferência unitária tem raio = ?
        correctAnswer: 1
        rationale: "Retas paralelas: mesmos coeficientes angulares."
  - pageNumber: 10
    title: Revisão Final
    description: Mistura livre.
    exercises:
      - type: geometry
        question: Área do círculo r=10 = ?π
        correctAnswer: 100
        rationale: "Retas perpendiculares: m₁ · m₂ = -1."
      - type: geometry
        question: Volume do cubo lado 5 = ?
        correctAnswer: 125
        rationale: "Circunferência: (x - a)² + (y - b)² = r²."
      - type: geometry
        question: "||(5,12)|| = ?"
        correctAnswer: 13
        rationale: "Vetor: soma componente a componente; módulo √(x² + y²)."
      - type: algebra
        question: det([2 3; 4 5]) = ?
        correctAnswer: -2
        rationale: "Retas paralelas: mesmos coeficientes angulares."
      - type: algebra
        question: Resolva x+y=12 e x-y=2 → x = ?
        correctAnswer: 7
        rationale: "Retas perpendiculares: m₁ · m₂ = -1."
target: 50
