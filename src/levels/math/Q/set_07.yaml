title: Geometria & Linear — Revisão Integrada
level: Q
subject: math
authorNotes: "Geometria & Linear — Revisão Integrada. Foque no conceito central do conjunto e nos erros comuns."
inputType: number
difficulty: 5
objectives:
  - geometry
  - linalg
example: "Áreas + volumes + vetores + matrizes. Ex.: Retângulo 5×8 — área = ? → 40."
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Áreas e Perímetros
    description: Revise figuras planas.
    exercises:
      - type: geometry
        question: Retângulo 5×8 — área = ?
        correctAnswer: 40
        rationale: "Área do retângulo: A = base × altura."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Círculo r=5 — área = ?π
        correctAnswer: 25
        rationale: "Área do círculo: A = πr²."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Triângulo b=10, h=4 — área = ?
        correctAnswer: 20
        rationale: "Área do triângulo: A = (base × altura) / 2."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Trapézio B=12, b=8, h=5 — área = ?
        correctAnswer: 50
        rationale: "Área do trapézio: A = (B + b)·h / 2."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Quadrado lado 6 — perímetro = ?
        correctAnswer: 24
        rationale: "Área do quadrado: A = lado²."
        difficulty: 4
        objectives: [geometry, linalg]
  - pageNumber: 2
    title: Volumes
    description: Revise sólidos.
    exercises:
      - type: geometry
        question: Cubo lado 4 — V = ?
        correctAnswer: 64
        rationale: "Volume do cubo: V = lado³."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Cilindro r=2, h=5 — V = ?π
        correctAnswer: 20
        rationale: "Volume do cilindro: V = πr²·h."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Esfera r=3 — V = ?π
        correctAnswer: 36
        rationale: "Volume da esfera: V = (4/3)πr³; área = 4πr²."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Cone r=2, h=6 — V = ?π
        correctAnswer: 8
        rationale: "Volume do cone: V = (1/3)·πr²·h (um terço do cilindro)."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Pirâmide base 4×4, h=9 — V = ?
        correctAnswer: 48
        rationale: "Volume da pirâmide: V = (1/3)·área da base·altura."
        difficulty: 4
        objectives: [geometry, linalg]
  - pageNumber: 3
    title: Pitágoras & Triângulos
    description: Hipotenusas e identidades.
    exercises:
      - type: geometry
        question: Catetos 7 e 24 — hipotenusa = ?
        correctAnswer: 25
        rationale: "Pitágoras: hipotenusa² = cateto₁² + cateto₂²."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Triângulo equilátero lado 6 — área = ?
        correctAnswer: 9√3
        rationale: "Triângulo equilátero de lado L: A = L²·√3 / 4."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Triângulo 30-60-90 com x=5 — hipotenusa = ?
        correctAnswer: 10
        rationale: "Triângulo 30-60-90: lados na razão 1 : √3 : 2."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Quadrado diagonal 10 — lado = ?
        correctAnswer: 5√2
        rationale: "Diagonal do quadrado: d = lado·√2."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Soma dos ângulos internos de um triângulo = ?°
        correctAnswer: 180
        rationale: "Soma dos ângulos internos de um triângulo = 180°."
        difficulty: 4
        objectives: [geometry, linalg]
  - pageNumber: 4
    title: Vetores
    description: Operações e norma.
    exercises:
      - type: geometry
        question: (1,2) + (3,4) = ?
        correctAnswer: (4
        6):
        rationale: "Soma de vetores: componente a componente."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: "||(8,6)|| = ?"
        correctAnswer: 10
        rationale: "Norma (módulo): ||v|| = √(x² + y²)."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: (2,3)·(4,-1) = ?
        correctAnswer: 5
        rationale: "Produto escalar: u·v = x₁x₂ + y₁y₂ = ||u||·||v||·cos θ."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: 3·(1,2) = ?
        correctAnswer: (3
        6):
        rationale: "Multiplicação por escalar: multiplica cada componente."
        difficulty: 4
        objectives: [geometry, linalg]
      - type: geometry
        question: Unitário de (3,4) = ?
        correctAnswer: (3/5
        4/5):
        rationale: "Vetor unitário: v / ||v||; tem norma 1."
        difficulty: 4
        objectives: [geometry, linalg]
  - pageNumber: 5
    title: Matrizes
    description: Det e multiplicação.
    exercises:
      - type: algebra
        question: det([3 2; 1 4]) = ?
        correctAnswer: 10
        rationale: "Determinante 2×2: det = ad − bc."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: det da identidade 3×3 = ?
        correctAnswer: 1
        rationale: "det(I) = 1; det com linha nula ou linhas dependentes = 0."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: "A (2×3) · B (3×4) é dimensão: ?"
        correctAnswer: 2×4
        rationale: "Produto matricial: colunas de A = linhas de B; dimensão m×n · n×p = m×p; não comutativo."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: A · I = ?
        correctAnswer: A
        rationale: "A · I = A (identidade é elemento neutro do produto)."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: det 2×2 de [a b; c d] = ?
        correctAnswer: ad-bc
        rationale: "Determinante 2×2: det = ad − bc."
        difficulty: 5
        objectives: [geometry, linalg]
  - pageNumber: 6
    title: Sistemas
    description: Cramer e classificação.
    exercises:
      - type: algebra
        question: x+y=10, x-y=4 → x = ?
        correctAnswer: 7
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua para isolar variáveis."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: Mesma — y = ?
        correctAnswer: 3
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua para isolar variáveis."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: "Sistema com det=0 e termos compatíveis é: (indeterminado/impossível)"
        correctAnswer: indeterminado
        rationale: "Determinado: 1 solução; impossível: 0; indeterminado: infinitas soluções."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: "Sistema com det=0 e termos incompatíveis é: (impossível/indeterminado)"
        correctAnswer: impossível
        rationale: "Determinado: 1 solução; impossível: 0; indeterminado: infinitas soluções."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: "Sistema com det ≠ 0 é: (determinado)"
        correctAnswer: determinado
        rationale: "Determinado: 1 solução; impossível: 0; indeterminado: infinitas soluções."
        difficulty: 5
        objectives: [geometry, linalg]
  - pageNumber: 7
    title: Geometria Analítica
    description: Distância, coeficiente angular.
    exercises:
      - type: geometry
        question: Distância entre (0,0) e (3,4) = ?
        correctAnswer: 5
        rationale: "Distância entre pontos: d = √((x₂−x₁)² + (y₂−y₁)²)."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: Distância entre (1,1) e (4,5) = ?
        correctAnswer: 5
        rationale: "Distância entre pontos: d = √((x₂−x₁)² + (y₂−y₁)²)."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: Coef. angular entre (0,0) e (2,4) = ?
        correctAnswer: 2
        rationale: "Reta: y = mx + b; coef. angular m = Δy/Δx; intercepto y = b."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: Coef. angular entre (1,3) e (3,7) = ?
        correctAnswer: 2
        rationale: "Reta: y = mx + b; coef. angular m = Δy/Δx; intercepto y = b."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: Retas perpendiculares têm produto dos coef. angulares = ?
        correctAnswer: -1
        rationale: "Reta: y = mx + b; coef. angular m = Δy/Δx; intercepto y = b."
        difficulty: 5
        objectives: [geometry, linalg]
  - pageNumber: 8
    title: Equações de Retas
    description: y = mx + b.
    exercises:
      - type: algebra
        question: "Reta por (0,2) com m=3: y = ?x + 2"
        correctAnswer: 3
        rationale: "Reta: y = mx + b; coef. angular m = Δy/Δx; intercepto y = b."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: Reta y = 2x + 5 — intercepto y = ?
        correctAnswer: 5
        rationale: "Reta: y = mx + b; coef. angular m = Δy/Δx; intercepto y = b."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: Reta y = -x + 4 — coef. angular = ?
        correctAnswer: -1
        rationale: "Reta: y = mx + b; coef. angular m = Δy/Δx; intercepto y = b."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: Para (1,2) e (3,6), m = ?
        correctAnswer: 2
        rationale: "Reta: y = mx + b; coef. angular m = Δy/Δx; intercepto y = b."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: Mesma reta — passa por (0, ?)
        correctAnswer: 0
        rationale: "Reta: y = mx + b; coef. angular m = Δy/Δx; intercepto y = b."
        difficulty: 5
        objectives: [geometry, linalg]
  - pageNumber: 9
    title: Circunferência
    description: Equação (x-a)² + (y-b)² = r².
    exercises:
      - type: geometry
        question: "Circunferência com centro (0,0) e r=3: x² + y² = ?"
        correctAnswer: 9
        rationale: "Circunferência: (x−a)² + (y−b)² = r²; centro (a,b), raio r."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: "Centro (2,1) e r=5: (x-2)² + (y-1)² = ?"
        correctAnswer: 25
        rationale: "Circunferência: (x−a)² + (y−b)² = r²; centro (a,b), raio r."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: x²+y²=16 — raio = ?
        correctAnswer: 4
        rationale: "Circunferência: (x−a)² + (y−b)² = r²; centro (a,b), raio r."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: (x-3)²+(y+4)² = 1 — centro = ?
        correctAnswer: (3
        -4):
        rationale: "Circunferência: (x−a)² + (y−b)² = r²; centro (a,b), raio r."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: Circunferência unitária tem raio = ?
        correctAnswer: 1
        rationale: "Fórmula do círculo: área=πr², circunferência=2πr. Use r dado."
        difficulty: 5
        objectives: [geometry, linalg]
  - pageNumber: 10
    title: Revisão Final
    description: Mistura livre.
    exercises:
      - type: geometry
        question: Área do círculo r=10 = ?π
        correctAnswer: 100
        rationale: "Fórmula do círculo: área=πr², circunferência=2πr. Use r dado."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: Volume do cubo lado 5 = ?
        correctAnswer: 125
        rationale: "Cubo: lado³ = 5³ = 125."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: geometry
        question: "||(5,12)|| = ?"
        correctAnswer: 13
        rationale: "Norma (módulo): ||v|| = √(x² + y²)."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: det([2 3; 4 5]) = ?
        correctAnswer: -2
        rationale: "Determinante 2×2: det = ad − bc."
        difficulty: 5
        objectives: [geometry, linalg]
      - type: algebra
        question: Resolva x+y=12 e x-y=2 → x = ?
        correctAnswer: 7
        rationale: "Sistema linear: some/subtraia equações (eliminação) ou substitua para isolar variáveis."
        difficulty: 5
        objectives: [geometry, linalg]
target: 50
