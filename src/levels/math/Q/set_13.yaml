  - pageNumber: 5
    title: Retas Paralelas e Perpendiculares — prática 1
    description: "Paralelas: m₁=m₂; Perpendiculares: m₁·m₂=-1."
    exercises:
      - type: geometry
        question: "Reta paralela a y=3x+1: m = ?"
        correctAnswer: 3
        rationale: "Paralelas têm mesmo coeficiente angular."
        difficulty: 2
        objectives:
          - geometry.analytic.lines
      - type: geometry
        question: "Reta perpendicular a y=2x: m = ?"
        correctAnswer: -0.5
        rationale: "m_perp = -1/m = -1/2 = -0.5."
        difficulty: 3
        objectives:
          - geometry.analytic.lines
      - type: geometry
        question: "Reta perpendicular a y=-4x+3: m = ?"
        correctAnswer: 0.25
        rationale: "m_perp = -1/(-4) = 0.25."
        difficulty: 3
        objectives:
          - geometry.analytic.lines
      - type: geometry
        question: "Retas y=2x+1 e y=2x-5: são paralelas? (1=sim, 0=não)"
        correctAnswer: 1
        rationale: "Mesmo m=2; b≠ → paralelas (não coincidem)."
        difficulty: 2
        objectives:
          - geometry.analytic.lines
      - type: geometry
        question: "m₁=3 e m₂=-1/3: produto m₁·m₂ = ?"
        correctAnswer: -1
        rationale: "Produto = 3·(-1/3) = -1 → perpendiculares."
        difficulty: 3
        objectives:
          - geometry.analytic.lines
