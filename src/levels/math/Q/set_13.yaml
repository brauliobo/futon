      - type: geometry
        question: "Reta 3x+4y-5=0; ponto (0,0): d = ?"
        correctAnswer: 1
        rationale: "d = |3·0+4·0-5|/√(9+16) = 5/5 = 1."
        difficulty: 4
        objectives:
          - geometry.analytic.lines
      - type: geometry
        question: "Reta x-y+3=0; ponto (1,1): d = ?√2"
        correctAnswer: 1.5
        rationale: "d = |1-1+3|/√2 = 3/√2 = 3√2/2 = 1.5√2."
        difficulty: 4
