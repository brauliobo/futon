        question: "Ponto sobre a reta 2x+y-4=0 em x=1: y = ?"
        correctAnswer: 2
        rationale: "2·1+y-4=0 → y = 2."
        difficulty: 3
        objectives:
          - geometry.analytic.lines
      - type: geometry
        question: "Distância entre retas paralelas y=x+2 e y=x-3: d = ?/√2"
        correctAnswer: 5
        rationale: "d = |2-(-3)|/√(1+1) = 5/√2 = 5√2/2."
        difficulty: 5
        objectives:
          - geometry.analytic.lines
