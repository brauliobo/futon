title: Geometria Plana — Áreas
level: Q
subject: math
inputType: number
difficulty: 3
objectives: [geometry.plane.area]
example: "Área do retângulo = base × altura"
pages:
  - pageNumber: 1
    title: Retângulo
    description: A = b · h.
    exercises:
      - { type: geometry, question: "Área do retângulo 4×3 = ?", correctAnswer: 12 }
      - { type: geometry, question: "Área do retângulo 5×10 = ?", correctAnswer: 50 }
      - { type: geometry, question: "Área do quadrado 6×6 = ?", correctAnswer: 36 }
      - { type: geometry, question: "Área do quadrado 9×9 = ?", correctAnswer: 81 }
      - { type: geometry, question: "Se área do retângulo = 24 e base = 4, altura = ?", correctAnswer: 6 }
  - pageNumber: 2
    title: Triângulo
    description: A = (b · h)/2.
    exercises:
      - { type: geometry, question: "Área do triângulo b=6, h=4 = ?", correctAnswer: 12 }
      - { type: geometry, question: "Área do triângulo b=10, h=5 = ?", correctAnswer: 25 }
      - { type: geometry, question: "Área do triângulo b=3, h=8 = ?", correctAnswer: 12 }
      - { type: geometry, question: "Área do triângulo equilátero lado=4: L²√3/4 = ?", correctAnswer: 4√3 }
      - { type: geometry, question: "Área do triângulo equilátero lado=2 = ?", correctAnswer: √3 }
  - pageNumber: 3
    title: Paralelogramo
    description: A = b · h (base vezes altura).
    exercises:
      - { type: geometry, question: "Área do paralelogramo b=7, h=3 = ?", correctAnswer: 21 }
      - { type: geometry, question: "Área do paralelogramo b=10, h=4 = ?", correctAnswer: 40 }
      - { type: geometry, question: "Área do paralelogramo b=5, h=6 = ?", correctAnswer: 30 }
      - { type: geometry, question: "Se área=50 e base=5, altura = ?", correctAnswer: 10 }
      - { type: geometry, question: "Em paralelogramo, lados opostos são: (paralelos/perpendiculares)", correctAnswer: paralelos }
  - pageNumber: 4
    title: Trapézio
    description: A = (B + b) · h / 2.
    exercises:
      - { type: geometry, question: "Área do trapézio B=8, b=4, h=3 = ?", correctAnswer: 18 }
      - { type: geometry, question: "Área do trapézio B=10, b=6, h=4 = ?", correctAnswer: 32 }
      - { type: geometry, question: "Área do trapézio B=12, b=8, h=5 = ?", correctAnswer: 50 }
      - { type: geometry, question: "Trapézio com B=b=5 e h=6 (paralelogramo): A = ?", correctAnswer: 30 }
      - { type: geometry, question: "Trapézio com B=6, b=2, h=4: A = ?", correctAnswer: 16 }
  - pageNumber: 5
    title: Círculo
    description: A = π · r².
    exercises:
      - { type: geometry, question: "Área do círculo r=2: 4π ≈ ?", correctAnswer: 12.57 }
      - { type: geometry, question: "Área do círculo r=1: ?π", correctAnswer: 1 }
      - { type: geometry, question: "Área do círculo r=3: ?π", correctAnswer: 9 }
      - { type: geometry, question: "Área do círculo r=5: ?π", correctAnswer: 25 }
      - { type: geometry, question: "Se área = 16π, raio = ?", correctAnswer: 4 }
  - pageNumber: 6
    title: Setor Circular
    description: Área = θ/360° · π · r² (θ em graus).
    exercises:
      - { type: geometry, question: "Setor de 90° em círculo r=2: (1/4)·4π = ?π", correctAnswer: 1 }
      - { type: geometry, question: "Setor de 180° em círculo r=4: metade de 16π = ?π", correctAnswer: 8 }
      - { type: geometry, question: "Setor de 60° em círculo r=6: (1/6)·36π = ?π", correctAnswer: 6 }
      - { type: geometry, question: "Setor de 45° em círculo r=4: (1/8)·16π = ?π", correctAnswer: 2 }
      - { type: geometry, question: "Setor de 120° em círculo r=3: (1/3)·9π = ?π", correctAnswer: 3 }
  - pageNumber: 7
    title: Áreas Compostas
    description: Soma ou subtração de figuras.
    exercises:
      - { type: geometry, question: "Retângulo 10×6 menos círculo r=2: A ≈ ?", correctAnswer: 47.43 }
      - { type: geometry, question: "Área em L — dois retângulos 4×3 e 3×2: A = ?", correctAnswer: 18 }
      - { type: geometry, question: "Quadrado 10×10 menos 4 triângulos 5×5/2 (cantos): A = ?", correctAnswer: 50 }
      - { type: geometry, question: "Quadrado 8×8 + semicírculo r=4: 64 + 8π ≈ ?", correctAnswer: 89.13 }
      - { type: geometry, question: "Retângulo 12×8 menos quadrado 3×3: A = ?", correctAnswer: 87 }
  - pageNumber: 8
    title: Perímetros
    description: Soma dos lados.
    exercises:
      - { type: geometry, question: "Perímetro quadrado lado 5 = ?", correctAnswer: 20 }
      - { type: geometry, question: "Perímetro retângulo 4×6 = ?", correctAnswer: 20 }
      - { type: geometry, question: "Perímetro triângulo 3+4+5 = ?", correctAnswer: 12 }
      - { type: geometry, question: "Circunferência de círculo r=3: 2π·3 = ?π", correctAnswer: 6 }
      - { type: geometry, question: "Perímetro de pentágono regular lado 4 = ?", correctAnswer: 20 }
  - pageNumber: 9
    title: Unidades
    description: Converta entre unidades de área.
    exercises:
      - { type: geometry, question: "1 m² = ? cm²", correctAnswer: 10000 }
      - { type: geometry, question: "1 km² = ? m²", correctAnswer: 1000000 }
      - { type: geometry, question: "10 cm² em mm²?", correctAnswer: 1000 }
      - { type: geometry, question: "1 hectare = ? m²", correctAnswer: 10000 }
      - { type: geometry, question: "50 m² em cm² = ?", correctAnswer: 500000 }
  - pageNumber: 10
    title: Revisão Integrada
    description: Problemas combinados.
    exercises:
      - { type: geometry, question: "Retângulo 7×9 — área = ?", correctAnswer: 63 }
      - { type: geometry, question: "Mesma figura — perímetro = ?", correctAnswer: 32 }
      - { type: geometry, question: "Triângulo b=10, h=6 — área = ?", correctAnswer: 30 }
      - { type: geometry, question: "Círculo r=10 — área = ?π", correctAnswer: 100 }
      - { type: geometry, question: "Trapézio B=9, b=5, h=4 — área = ?", correctAnswer: 28 }
target: 50
