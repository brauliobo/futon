title: Geometria Espacial — Volumes
level: Q
subject: math
inputType: number
difficulty: 3
objectives: [geometry.solids.volume]
example: "Volume do cubo = lado³"
pages:
  - pageNumber: 1
    title: Cubo
    description: V = l³.
    exercises:
      - { type: geometry, question: "Volume do cubo lado 3 = ?", correctAnswer: 27 }
      - { type: geometry, question: "Volume do cubo lado 5 = ?", correctAnswer: 125 }
      - { type: geometry, question: "Volume do cubo lado 2 = ?", correctAnswer: 8 }
      - { type: geometry, question: "Volume do cubo lado 10 = ?", correctAnswer: 1000 }
      - { type: geometry, question: "Se V=64, lado = ?", correctAnswer: 4 }
  - pageNumber: 2
    title: Paralelepípedo Reto-Retângulo
    description: V = a·b·c.
    exercises:
      - { type: geometry, question: "V = 2·3·4 = ?", correctAnswer: 24 }
      - { type: geometry, question: "V = 5·6·2 = ?", correctAnswer: 60 }
      - { type: geometry, question: "V = 10·10·5 = ?", correctAnswer: 500 }
      - { type: geometry, question: "V = 1·1·1 = ?", correctAnswer: 1 }
      - { type: geometry, question: "Caixa 3×4×5 — volume = ?", correctAnswer: 60 }
  - pageNumber: 3
    title: Cilindro
    description: V = π · r² · h.
    exercises:
      - { type: geometry, question: "Cilindro r=1, h=4: V = ?π", correctAnswer: 4 }
      - { type: geometry, question: "Cilindro r=2, h=5: V = ?π", correctAnswer: 20 }
      - { type: geometry, question: "Cilindro r=3, h=10: V = ?π", correctAnswer: 90 }
      - { type: geometry, question: "Cilindro r=5, h=2: V = ?π", correctAnswer: 50 }
      - { type: geometry, question: "Se V=18π e r=3, h = ?", correctAnswer: 2 }
  - pageNumber: 4
    title: Cone
    description: V = (1/3)·π·r²·h.
    exercises:
      - { type: geometry, question: "Cone r=3, h=6: V = ?π", correctAnswer: 18 }
      - { type: geometry, question: "Cone r=2, h=9: V = ?π", correctAnswer: 12 }
      - { type: geometry, question: "Cone r=1, h=3: V = ?π", correctAnswer: 1 }
      - { type: geometry, question: "Cone r=5, h=12: V = ?π", correctAnswer: 100 }
      - { type: geometry, question: "Volume do cone = ? do cilindro de mesmas dimensões", correctAnswer: 1/3 }
  - pageNumber: 5
    title: Esfera
    description: V = (4/3)·π·r³.
    exercises:
      - { type: geometry, question: "Esfera r=1: V = ?π", correctAnswer: 4/3 }
      - { type: geometry, question: "Esfera r=3: V = ?π", correctAnswer: 36 }
      - { type: geometry, question: "Esfera r=6: V = ?π", correctAnswer: 288 }
      - { type: geometry, question: "Esfera r=2: V = ?π", correctAnswer: 32/3 }
      - { type: geometry, question: "Área da superfície da esfera = 4πr². Para r=3: ?π", correctAnswer: 36 }
  - pageNumber: 6
    title: Pirâmide
    description: V = (1/3)·Abase·h.
    exercises:
      - { type: geometry, question: "Pirâmide quadrada base 4×4, h=6: V = ?", correctAnswer: 32 }
      - { type: geometry, question: "Pirâmide triangular base 10, h=3: V = ?", correctAnswer: 10 }
      - { type: geometry, question: "Pirâmide base retangular 3×5, h=6: V = ?", correctAnswer: 30 }
      - { type: geometry, question: "Pirâmide quadrada lado 6, h=6: V = ?", correctAnswer: 72 }
      - { type: geometry, question: "V pirâmide = ? do prisma de mesma base e altura", correctAnswer: 1/3 }
  - pageNumber: 7
    title: Prisma
    description: V = Abase · h.
    exercises:
      - { type: geometry, question: "Prisma triangular base 6, h=10: V = ?", correctAnswer: 60 }
      - { type: geometry, question: "Prisma pentagonal área=15, h=4: V = ?", correctAnswer: 60 }
      - { type: geometry, question: "Prisma reto retangular 2×3×5: V = ?", correctAnswer: 30 }
      - { type: geometry, question: "Prisma hexagonal A=20, h=6: V = ?", correctAnswer: 120 }
      - { type: geometry, question: "Volume prisma = área base · ?", correctAnswer: altura }
  - pageNumber: 8
    title: Tronco
    description: Tronco de pirâmide/cone.
    exercises:
      - { type: geometry, question: "Tronco de cone — V = (π·h/3)·(R² + r·R + r²). R=3, r=1, h=6: V = ?π", correctAnswer: 26 }
      - { type: geometry, question: "Tronco cone R=2, r=1, h=3: V = ?π", correctAnswer: 7 }
      - { type: geometry, question: "Tronco cone R=1, r=1, h=5 equivale a cilindro: V = ?π", correctAnswer: 5 }
      - { type: geometry, question: "Quando R = r, o tronco vira um: (cilindro/cone)", correctAnswer: cilindro }
      - { type: geometry, question: "Quando r = 0, o tronco vira um: (cone/cilindro)", correctAnswer: cone }
  - pageNumber: 9
    title: Unidades de Volume
    description: 1 m³ = 1000 L.
    exercises:
      - { type: geometry, question: "1 m³ em litros = ?", correctAnswer: 1000 }
      - { type: geometry, question: "1 L em cm³ = ?", correctAnswer: 1000 }
      - { type: geometry, question: "5 m³ em litros = ?", correctAnswer: 5000 }
      - { type: geometry, question: "2500 mL em L = ?", correctAnswer: 2.5 }
      - { type: geometry, question: "10 L em m³ = ?", correctAnswer: 0.01 }
  - pageNumber: 10
    title: Revisão Integrada
    description: Problemas misturados.
    exercises:
      - { type: geometry, question: "Cubo lado 4: V = ?", correctAnswer: 64 }
      - { type: geometry, question: "Cilindro r=2, h=10: V = ?π", correctAnswer: 40 }
      - { type: geometry, question: "Esfera r=3: V em π = ?π", correctAnswer: 36 }
      - { type: geometry, question: "Pirâmide base 5×5, h=3: V = ?", correctAnswer: 25 }
      - { type: geometry, question: "Cone r=3, h=4: V = ?π", correctAnswer: 12 }
target: 50
