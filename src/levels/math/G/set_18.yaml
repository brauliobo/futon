title: Números Negativos — Conjunto 18
level: G
example: "Temperatura de -10°C é menor que -5°C"
subject: math
pages:
  - pageNumber: 1
    title: Números Negativos – Página 1
    description: Compare números negativos.
    exercises:
      - type: negative_comparison
        question: "Qual é maior: -3 ou -7?"
        correctAnswer: -3
  - pageNumber: 2
    title: Números Negativos – Página 2
    description: Compare números negativos.
    exercises:
      - type: negative_comparison
        question: "Qual é menor: -2 ou -5?"
        correctAnswer: -5
  - pageNumber: 3
    title: Números Negativos – Página 3
    description: Ordene números na reta.
    exercises:
      - type: number_line
        question: "Entre -4 e 2, qual número está no meio?"
        correctAnswer: -1
  - pageNumber: 4
    title: Números Negativos – Página 4
    description: Valor absoluto.
    exercises:
      - type: absolute_value
        question: "|−6| ="
        correctAnswer: 6
  - pageNumber: 5
    title: Números Negativos – Página 5
    description: Valor absoluto.
    exercises:
      - type: absolute_value
        question: "|−9| ="
        correctAnswer: 9
  - pageNumber: 6
    title: Números Negativos – Página 6
    description: Compare com zero.
    exercises:
      - type: negative_comparison
        question: "Qual é maior: -8 ou 0?"
        correctAnswer: 0
  - pageNumber: 7
    title: Números Negativos – Página 7
    description: Distância na reta.
    exercises:
      - type: distance
        question: "Distância entre -3 e -8 ="
        correctAnswer: 5
  - pageNumber: 8
    title: Números Negativos – Página 8
    description: Oposto de um número.
    exercises:
      - type: opposite
        question: "O oposto de -12 é"
        correctAnswer: 12
  - pageNumber: 9
    title: Números Negativos – Página 9
    description: Oposto de um número.
    exercises:
      - type: opposite
        question: "O oposto de 7 é"
        correctAnswer: -7
  - pageNumber: 10
    title: Números Negativos – Página 10
    description: Compare módulos.
    exercises:
      - type: absolute_comparison
        question: "Qual tem maior módulo: -15 ou 10?"
        correctAnswer: -15
target: 10