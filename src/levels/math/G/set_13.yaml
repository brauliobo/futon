title: Propriedades dos Inteiros — Conjunto 13
level: G
example: "Propriedade comutativa: -3 + 5 = 5 + (-3)"
subject: math
pages:
  - pageNumber: 1
    title: Propriedades dos Inteiros – Página 1
    description: Explore propriedades da adição.
    exercises:
      - type: integer_properties
        question: -4 + 7 = 7 + (?)
        correctAnswer: -4
  - pageNumber: 2
    title: Propriedades dos Inteiros – Página 2
    description: Explore propriedades da multiplicação.
    exercises:
      - type: integer_properties
        question: 3 × (-5) = (-5) × (?)
        correctAnswer: 3
  - pageNumber: 3
    title: Propriedades dos Inteiros – Página 3
    description: Elemento neutro da adição.
    exercises:
      - type: integer_properties
        question: -8 + (?) = -8
        correctAnswer: 0
  - pageNumber: 4
    title: Propriedades dos Inteiros – Página 4
    description: Elemento neutro da multiplicação.
    exercises:
      - type: integer_properties
        question: 6 × (?) = 6
        correctAnswer: 1
  - pageNumber: 5
    title: Propriedades dos Inteiros – Página 5
    description: Elemento oposto.
    exercises:
      - type: integer_properties
        question: 9 + (?) = 0
        correctAnswer: -9
  - pageNumber: 6
    title: Propriedades dos Inteiros – Página 6
    description: Propriedade associativa.
    exercises:
      - type: integer_properties
        question: (2 + 3) + 4 = 2 + (3 + ?)
        correctAnswer: 4
  - pageNumber: 7
    title: Propriedades dos Inteiros – Página 7
    description: Propriedade distributiva.
    exercises:
      - type: integer_properties
        question: 2 × (3 + 4) = (2 × 3) + (2 × ?)
        correctAnswer: 4
  - pageNumber: 8
    title: Propriedades dos Inteiros – Página 8
    description: Elemento oposto negativo.
    exercises:
      - type: integer_properties
        question: -5 + (?) = 0
        correctAnswer: 5
  - pageNumber: 9
    title: Propriedades dos Inteiros – Página 9
    description: Multiplicação por zero.
    exercises:
      - type: integer_properties
        question: -7 × (?) = 0
        correctAnswer: 0
  - pageNumber: 10
    title: Propriedades dos Inteiros – Página 10
    description: Propriedade distributiva negativa.
    exercises:
      - type: integer_properties
        question: -3 × (2 + 5) = (-3 × 2) + (-3 × ?)
        correctAnswer: 5
target: 10
