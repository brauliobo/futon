title: Problemas Algébricos — Conjunto 17
level: G
example: "Maria tem x anos. Daqui a 5 anos terá x + 5 anos."
subject: math
pages:
  - pageNumber: 1
    title: Problemas Algébricos – Página 1
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: João tem x livros. Pedro tem 3 livros a mais. Pedro tem quantos livros?
        correctAnswer: x + 3
  - pageNumber: 2
    title: Problemas Algébricos – Página 2
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: Ana tinha y reais. Gastou 8 reais. Sobrou quanto?
        correctAnswer: y - 8
  - pageNumber: 3
    title: Problemas Algébricos – Página 3
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: Carlos corre z km por dia. Em 4 dias corre quantos km?
        correctAnswer: 4z
  - pageNumber: 4
    title: Problemas Algébricos – Página 4
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: Lucia tem a bolas. Seu irmão tem o dobro. Ele tem quantas?
        correctAnswer: 2a
  - pageNumber: 5
    title: Problemas Algébricos – Página 5
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: Bruno pagou b reais por uma camisa e 15 reais por uma calça. Gastou quanto?
        correctAnswer: b + 15
  - pageNumber: 6
    title: Problemas Algébricos – Página 6
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: Marina dividiu c balas entre 5 amigos. Cada um ganhou quantas?
        correctAnswer: c ÷ 5
  - pageNumber: 7
    title: Problemas Algébricos – Página 7
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: Rafael tem d anos. Há 6 anos ele tinha quantos?
        correctAnswer: d - 6
  - pageNumber: 8
    title: Problemas Algébricos – Página 8
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: Sofia comprou e doces a R$ 2 cada. Pagou quanto?
        correctAnswer: 2e
  - pageNumber: 9
    title: Problemas Algébricos – Página 9
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: Thiago tinha f figurinhas. Ganhou mais 12. Agora tem quantas?
        correctAnswer: f + 12
  - pageNumber: 10
    title: Problemas Algébricos – Página 10
    description: Use álgebra para resolver problemas.
    exercises:
      - type: algebraic_word_problem
        question: Carla pesava g kg. Perdeu 3 kg. Agora pesa quanto?
        correctAnswer: g - 3
target: 10
