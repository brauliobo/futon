title: Problemas com Inteiros — Conjunto 10
level: G
example: A temperatura era -3°C e subiu 7°C. Agora está 4°C.
subject: math
pages:
  - pageNumber: 1
    title: Problemas com Inteiros — Conjunto 10 – Página 1
    description: Problemas do dia a dia com números inteiros.
    exercises:
      - &a1
        type: word_problem
        question: João tinha R$ 15 e gastou R$ 8. Quanto tem agora?
        correctAnswer: 7
      - &a2
        type: word_problem
        question: A temperatura estava em 2°C e caiu 5°C. Qual a temperatura agora?
        correctAnswer: -3
      - &a3
        type: word_problem
        question: Maria desceu 3 andares e depois subiu 7 andares. Quantos andares subiu no total?
        correctAnswer: 4
      - &a4
        type: word_problem
        question: Pedro deve R$ 12 e pagou R$ 5. Quanto ainda deve?
        correctAnswer: 7
      - &a5
        type: word_problem
        question: Um elevador estava no andar -2 e subiu 6 andares. Em que andar está?
        correctAnswer: 4
      - &a6
        type: word_problem
        question: Ana ganhou 20 pontos e perdeu 8 pontos. Quantos pontos tem?
        correctAnswer: 12
      - &a7
        type: word_problem
        question: A temperatura era -5°C e subiu 9°C. Qual a temperatura final?
        correctAnswer: 4
      - &a8
        type: word_problem
        question: Carlos tinha -3 pontos e ganhou 11 pontos. Quantos pontos tem agora?
        correctAnswer: 8
      - &a9
        type: word_problem
        question: Um mergulhador estava a -15m e subiu 8m. A que profundidade está?
        correctAnswer: -7
      - &a10
        type: word_problem
        question: Luis tinha R$ 6, gastou R$ 10. Qual seu saldo atual?
        correctAnswer: -4
