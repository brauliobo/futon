title: Números Inteiros — Operações
level: G
example: "Some, subtraia e multiplique inteiros. Ex.: -3 + 5 = 2"
subject: math
difficulty: 3
objectives:
  - math.integers_expressions
authorNotes: "Operações mistas com inteiros. Reforce regras de sinais e ordem das operações."
inputType: number
pages:
  - pageNumber: 1
    title: Adição de Inteiros
    description: Some números positivos e negativos.
    exercises:
      - type: integer
        question: -3 + 5 =
        correctAnswer: 2
        rationale: "Aplique a regra de sinais."
        difficulty: 2
        objectives: [math.integers_expressions]
      - type: integer
        question: 7 + (-4) =
        correctAnswer: 3
        rationale: "Aplique a regra de sinais."
        difficulty: 2
        objectives: [math.integers_expressions]
      - type: integer
        question: -8 + 3 =
        correctAnswer: -5
        rationale: "Aplique a regra de sinais."
        difficulty: 2
        objectives: [math.integers_expressions]
      - type: integer
        question: -5 + (-2) =
        correctAnswer: -7
        rationale: "Regra de três direta: razões proporcionais a·d = b·c."
        difficulty: 2
        objectives: [math.integers_expressions]
      - type: integer
        question: 9 + (-9) =
        correctAnswer: 0
        rationale: "Ache a constante de proporcionalidade k = y/x."
        difficulty: 2
        objectives: [math.integers_expressions]
      - type: integer
        question: -10 + 6 =
        correctAnswer: -4
        rationale: "Aumento de x%: multiplique por (1 + x/100)."
        difficulty: 2
        objectives: [math.integers_expressions]
      - type: integer
        question: 4 + (-7) =
        correctAnswer: -3
        rationale: "Desconto de x%: multiplique por (1 - x/100)."
        difficulty: 2
        objectives: [math.integers_expressions]
      - type: integer
        question: -6 + (-4) =
        correctAnswer: -10
        rationale: "Razão a:b = a/b — simplifique se possível."
        difficulty: 2
        objectives: [math.integers_expressions]
      - type: integer
        question: 12 + (-5) =
        correctAnswer: 7
        rationale: "Proporção: produtos dos extremos = produtos dos meios."
        difficulty: 2
        objectives: [math.integers_expressions]
      - type: integer
        question: -15 + 8 =
        correctAnswer: -7
        rationale: "Converta % em decimal antes de operar (ex.: 25% = 0,25)."
        difficulty: 2
        objectives: [math.integers_expressions]
  - pageNumber: 2
    title: Subtração de Inteiros
    description: Subtraia inteiros (dois negativos viram positivo).
    exercises:
      - type: integer
        question: 5 - 8 =
        correctAnswer: -3
        rationale: "Regra de três inversa: grandezas inversamente proporcionais."
        difficulty: 3
        objectives: [math.integers_expressions]
      - type: integer
        question: -3 - 4 =
        correctAnswer: -7
        rationale: "Ex.: 20% de 50 = 0,20·50 = 10."
        difficulty: 3
        objectives: [math.integers_expressions]
      - type: integer
        question: 6 - (-2) =
        correctAnswer: 8
        rationale: "Verifique unidades antes de montar a proporção."
        difficulty: 3
        objectives: [math.integers_expressions]
      - type: integer
        question: -5 - (-3) =
        correctAnswer: -2
        rationale: "Variação percentual = (final − inicial)/inicial · 100."
        difficulty: 3
        objectives: [math.integers_expressions]
      - type: integer
        question: 10 - 15 =
        correctAnswer: -5
        rationale: "Em problemas de mistura, mantenha razões constantes."
        difficulty: 3
        objectives: [math.integers_expressions]
      - type: integer
        question: -7 - (-9) =
        correctAnswer: 2
        rationale: "Porcentagem: x% = x/100 — multiplique pela base."
        difficulty: 3
        objectives: [math.integers_expressions]
      - type: integer
        question: 8 - 12 =
        correctAnswer: -4
        rationale: "Regra de três direta: razões proporcionais a·d = b·c."
        difficulty: 3
        objectives: [math.integers_expressions]
      - type: integer
        question: -4 - 6 =
        correctAnswer: -10
        rationale: "Ache a constante de proporcionalidade k = y/x."
        difficulty: 3
        objectives: [math.integers_expressions]
      - type: integer
        question: 3 - (-5) =
        correctAnswer: 8
        rationale: "Aumento de x%: multiplique por (1 + x/100)."
        difficulty: 3
        objectives: [math.integers_expressions]
      - type: integer
        question: -10 - (-10) =
        correctAnswer: 0
        rationale: "Desconto de x%: multiplique por (1 - x/100)."
        difficulty: 3
        objectives: [math.integers_expressions]
  - pageNumber: 3
    title: Multiplicação de Inteiros
    description: Sinais iguais = positivo, diferentes = negativo.
    exercises:
      - type: integer
        question: (-3) × 4 =
        correctAnswer: -12
        rationale: "Razão a:b = a/b — simplifique se possível."
        difficulty: 4
        objectives: [math.integers_expressions]
      - type: integer
        question: 5 × (-2) =
        correctAnswer: -10
        rationale: "Proporção: produtos dos extremos = produtos dos meios."
        difficulty: 4
        objectives: [math.integers_expressions]
      - type: integer
        question: (-6) × (-2) =
        correctAnswer: 12
        rationale: "Converta % em decimal antes de operar (ex.: 25% = 0,25)."
        difficulty: 4
        objectives: [math.integers_expressions]
      - type: integer
        question: (-4) × (-5) =
        correctAnswer: 20
        rationale: "Regra de três inversa: grandezas inversamente proporcionais."
        difficulty: 4
        objectives: [math.integers_expressions]
      - type: integer
        question: 7 × (-3) =
        correctAnswer: -21
        rationale: "Ex.: 20% de 50 = 0,20·50 = 10."
        difficulty: 4
        objectives: [math.integers_expressions]
      - type: integer
        question: (-8) × 2 =
        correctAnswer: -16
        rationale: "Verifique unidades antes de montar a proporção."
        difficulty: 4
        objectives: [math.integers_expressions]
      - type: integer
        question: (-9) × (-1) =
        correctAnswer: 9
        rationale: "Variação percentual = (final − inicial)/inicial · 100."
        difficulty: 4
        objectives: [math.integers_expressions]
      - type: integer
        question: 0 × (-5) =
        correctAnswer: 0
        rationale: "Em problemas de mistura, mantenha razões constantes."
        difficulty: 4
        objectives: [math.integers_expressions]
      - type: integer
        question: (-3) × (-3) =
        correctAnswer: 9
        rationale: "Porcentagem: x% = x/100 — multiplique pela base."
        difficulty: 4
        objectives: [math.integers_expressions]
      - type: integer
        question: (-10) × 4 =
        correctAnswer: -40
        rationale: "Regra de três direta: razões proporcionais a·d = b·c."
        difficulty: 4
        objectives: [math.integers_expressions]
target: 30
