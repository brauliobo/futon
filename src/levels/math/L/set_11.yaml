title: Funções Recíprocas — Sec e Csc (1)
level: L
example: "Recíprocas: csc(θ) = 1/sen(θ), sec(θ) = 1/cos(θ). Ex.: 1/sen(30°) = 1/(1/2) = 2."
subject: math
difficulty: 4
objectives:
  - math.trigonometry
authorNotes: Sec = 1/cos, csc = 1/sen. Bloco 1 — 10 páginas de csc; Bloco 2 — 10
  páginas de sec. Atenção a valores onde denominador = 0 (sen 0°/180°, cos 90°/270°).
inputType: text
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Cossecante — 1/sen(θ) — prática 1
    description: Calcule a recíproca do seno em ângulos notáveis.
    exercises:
      - {type: trigonometry, question: "1/sen(30°) = ?",  correctAnswer: "2",     rationale: "sen(30°) = 1/2, então csc(30°) = 1/(1/2) = 2.",       difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(45°) = ?",  correctAnswer: "√2",    rationale: "sen(45°) = √2/2, então csc(45°) = 1/(√2/2) = √2.",    difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(60°) = ?",  correctAnswer: "2√3/3",    rationale: "sen(60°) = √3/2, então csc(60°) = 1/(√3/2) = 2√3/3.", difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(90°) = ?",  correctAnswer: "1",         rationale: "sen(90°) = 1, então csc(90°) = 1/1 = 1.",              difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(120°) = ?", correctAnswer: "2√3/3",    rationale: "sen(120°) = +√3/2 (2º quadrante), csc = 1/(√3/2).",    difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(135°) = ?", correctAnswer: "√2",    rationale: "sen(135°) = +√2/2 (2º quadrante), csc = 1/(√2/2).",    difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(150°) = ?", correctAnswer: "2",     rationale: "sen(150°) = +1/2 (2º quadrante), csc = 1/(1/2) = 2.",  difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(210°) = ?", correctAnswer: "-2",    rationale: "sen(210°) = −1/2 (3º quadrante), csc = 1/(−1/2) = −2.",difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(225°) = ?", correctAnswer: "-√2",   rationale: "sen(225°) = −√2/2 (3º quadrante), csc = 1/(−√2/2).",   difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(330°) = ?", correctAnswer: "-2",    rationale: "sen(330°) = −1/2 (4º quadrante), csc = 1/(−1/2) = −2.",difficulty: 3, objectives: [math.trigonometry]}
