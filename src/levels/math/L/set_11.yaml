title: Equações Trigonométricas — Conjunto 11
level: L
example: "Resolva equações trigonométricas. Ex.: sen(x) = 1/2, x = 30°"
subject: math
pages:
  - pageNumber: 1
    title: Equações Trigonométricas – Página 1
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "sen(x) = 0, x = ?"
        correctAnswer: "0°, 180°"
  - pageNumber: 2
    title: Equações Trigonométricas – Página 2
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "sen(x) = 1, x = ?"
        correctAnswer: "90°"
  - pageNumber: 3
    title: Equações Trigonométricas – Página 3
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "sen(x) = 1/2, x = ?"
        correctAnswer: "30°, 150°"
  - pageNumber: 4
    title: Equações Trigonométricas – Página 4
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "cos(x) = 0, x = ?"
        correctAnswer: "90°, 270°"
  - pageNumber: 5
    title: Equações Trigonométricas – Página 5
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "cos(x) = 1, x = ?"
        correctAnswer: "0°"
  - pageNumber: 6
    title: Equações Trigonométricas – Página 6
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "cos(x) = 1/2, x = ?"
        correctAnswer: "60°, 300°"
  - pageNumber: 7
    title: Equações Trigonométricas – Página 7
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "tan(x) = 0, x = ?"
        correctAnswer: "0°, 180°"
  - pageNumber: 8
    title: Equações Trigonométricas – Página 8
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "tan(x) = 1, x = ?"
        correctAnswer: "45°, 225°"
  - pageNumber: 9
    title: Equações Trigonométricas – Página 9
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "tan(x) = √3, x = ?"
        correctAnswer: "60°, 240°"
  - pageNumber: 10
    title: Equações Trigonométricas – Página 10
    description: Resolva a equação trigonométrica.
    exercises:
      - type: trig_equation
        question: "sen(x) = -1/2, x = ?"
        correctAnswer: "210°, 330°"
target: 10
