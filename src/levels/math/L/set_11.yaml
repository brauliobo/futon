title: Equações Trigonométricas — Conjunto 11
level: L
example: "Resolva equações trigonométricas. Ex.: sen(x) = 1/2, x = 30°"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Equações Trigonométricas — Conjunto 11 – Página 1
    description: Resolva a equação trigonométrica.
    exercises:
      - &a1
        type: trig_equation
        question: sen(x) = 0, x = ?
        correctAnswer: 0°, 180°
      - &a2
        type: trig_equation
        question: sen(x) = 1, x = ?
        correctAnswer: 90°
      - &a3
        type: trig_equation
        question: sen(x) = 1/2, x = ?
        correctAnswer: 30°, 150°
      - &a4
        type: trig_equation
        question: cos(x) = 0, x = ?
        correctAnswer: 90°, 270°
      - &a5
        type: trig_equation
        question: cos(x) = 1, x = ?
        correctAnswer: 0°
      - &a6
        type: trig_equation
        question: cos(x) = 1/2, x = ?
        correctAnswer: 60°, 300°
      - &a7
        type: trig_equation
        question: tan(x) = 0, x = ?
        correctAnswer: 0°, 180°
      - &a8
        type: trig_equation
        question: tan(x) = 1, x = ?
        correctAnswer: 45°, 225°
      - &a9
        type: trig_equation
        question: tan(x) = √3, x = ?
        correctAnswer: 60°, 240°
      - &a10
        type: trig_equation
        question: sen(x) = -1/2, x = ?
        correctAnswer: 210°, 330°
