title: Aplicações Práticas — Conjunto 20
level: L
example: "Aplicações da trigonometria. Ex.: altura de uma torre usando ângulos de elevação"
subject: math
pages:
  - pageNumber: 1
    title: Aplicações Práticas – Página 1
    description: Calcule a altura usando ângulo de elevação.
    exercises:
      - type: practical_trig
        question: "Distância = 50m, ângulo elevação = 30°. Altura = ?"
        correctAnswer: "50√3/3 m"
  - pageNumber: 2
    title: Aplicações Práticas – Página 2
    description: Calcule a altura usando ângulo de elevação.
    exercises:
      - type: practical_trig
        question: "Distância = 100m, ângulo elevação = 45°. Altura = ?"
        correctAnswer: "100 m"
  - pageNumber: 3
    title: Aplicações Práticas – Página 3
    description: Calcule a distância usando ângulos.
    exercises:
      - type: practical_trig
        question: "Altura = 60m, ângulo elevação = 60°. Distância = ?"
        correctAnswer: "20√3 m"
  - pageNumber: 4
    title: Aplicações Práticas – Página 4
    description: Problema de navegação.
    exercises:
      - type: practical_trig
        question: "Navio navega 10 km Norte, depois 10 km a 45°NE. Distância do ponto inicial = ?"
        correctAnswer: "10√(2 + √2) km"
  - pageNumber: 5
    title: Aplicações Práticas – Página 5
    description: Problema de navegação.
    exercises:
      - type: practical_trig
        question: "Dois navios partem do mesmo ponto. Um vai 30° Norte, outro 60° Norte. Após 20km cada, distância entre eles = ?"
        correctAnswer: "20 km"
  - pageNumber: 6
    title: Aplicações Práticas – Página 6
    description: Problema de física - movimento circular.
    exercises:
      - type: practical_trig
        question: "Roda de raio 5m, ângulo 120°. Comprimento do arco = ?"
        correctAnswer: "10π/3 m"
  - pageNumber: 7
    title: Aplicações Práticas – Página 7
    description: Problema de astronomia.
    exercises:
      - type: practical_trig
        question: "Estrela com ângulo elevação 30° às 20h e 60° às 22h. A estrela se moveu quantos graus?"
        correctAnswer: "30°"
  - pageNumber: 8
    title: Aplicações Práticas – Página 8
    description: Problema de engenharia.
    exercises:
      - type: practical_trig
        question: "Rampa de 10m com inclinação 15°. Altura vertical = ?"
        correctAnswer: "10sen(15°) m"
  - pageNumber: 9
    title: Aplicações Práticas – Página 9
    description: Problema de topografia.
    exercises:
      - type: practical_trig
        question: "Duas torres separadas por 200m. Ângulos de elevação 30° e 45°. Altura maior = ?"
        correctAnswer: "200m"
  - pageNumber: 10
    title: Aplicações Práticas – Página 10
    description: Problema complexo integrado.
    exercises:
      - type: practical_trig
        question: "Avião a 1000m de altura vê dois pontos no solo com ângulos depressão 30° e 45°. Distância entre pontos = ?"
        correctAnswer: "1000(√3 - 1) m"
target: 10
