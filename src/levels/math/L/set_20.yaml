title: Trigonometria — Revisão Integrada
level: L
example: "Funções trigonométricas básicas. Ex.: sen(30°) = 1/2"
subject: math
difficulty: 4
objectives:
  - math.trigonometry
authorNotes: Conjunto de math/L.
inputType: number
pages:
  - pageNumber: 1
    title: Trigonometria Básica — Conjunto 20 – Página 1
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: sen²(60°) + cos²(60°) = ?
        correctAnswer: "1"
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: cos(45°) = ?
        correctAnswer: √2/2
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: 1/cos(300°) = ?
        correctAnswer: 1/(1/2)
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: sen²(135°) + cos²(135°) = ?
        correctAnswer: "1"
        rationale: "sen 45° = cos 45° = √2/2; tan 45° = 1."
      - type: trigonometry
        question: tan(π/6) = ?
        correctAnswer: √3/3
        rationale: "sen 60° = √3/2; cos 60° = 1/2; tan 60° = √3."
      - type: trigonometry
        question: sen(120°) = ?
        correctAnswer: √3/2
        rationale: "Cheque sinal conforme o quadrante final."
      - type: trigonometry
        question: tan(315°) = ?
        correctAnswer: "-1"
        rationale: "Converta grau↔radiano: 180° = π rad."
      - type: trigonometry
        question: cos(30°) = ?
        correctAnswer: √3/2
        rationale: "Use o ciclo trigonométrico e o quadrante do ângulo."
      - type: trigonometry
        question: sen²(225°) + cos²(225°) = ?
        correctAnswer: "1"
        rationale: "sen²θ + cos²θ = 1 (identidade fundamental)."
      - type: trigonometry
        question: cos(π/2) = ?
        correctAnswer: "0"
        rationale: "tan θ = sen θ / cos θ (cos θ ≠ 0)."
