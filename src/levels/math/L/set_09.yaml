title: Círculo Unitário — Conjunto 9
level: L
example: "Pontos no círculo unitário. Ex.: (cos(0), sen(0)) = (1, 0)"
subject: math
pages:
  - pageNumber: 1
    title: Círculo Unitário — Conjunto 9 – Página 1
    description: Encontre as coordenadas no círculo unitário.
    exercises:
      - &a1
        type: unit_circle
        question: (cos(0°), sen(0°)) = ?
        correctAnswer: (1, 0)
      - &a2
        type: unit_circle
        question: (cos(30°), sen(30°)) = ?
        correctAnswer: (√3/2, 1/2)
      - &a3
        type: unit_circle
        question: (cos(45°), sen(45°)) = ?
        correctAnswer: (√2/2, √2/2)
      - &a4
        type: unit_circle
        question: (cos(60°), sen(60°)) = ?
        correctAnswer: (1/2, √3/2)
      - &a5
        type: unit_circle
        question: (cos(90°), sen(90°)) = ?
        correctAnswer: (0, 1)
      - &a6
        type: unit_circle
        question: (cos(120°), sen(120°)) = ?
        correctAnswer: (-1/2, √3/2)
      - &a7
        type: unit_circle
        question: (cos(135°), sen(135°)) = ?
        correctAnswer: (-√2/2, √2/2)
      - &a8
        type: unit_circle
        question: (cos(150°), sen(150°)) = ?
        correctAnswer: (-√3/2, 1/2)
      - &a9
        type: unit_circle
        question: (cos(180°), sen(180°)) = ?
        correctAnswer: (-1, 0)
      - &a10
        type: unit_circle
        question: (cos(270°), sen(270°)) = ?
        correctAnswer: (0, -1)
