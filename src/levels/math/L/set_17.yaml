title: Funções Inversas — arcsen, arccos (3)
level: L
example: "Funções trigonométricas básicas. Ex.: sen(30°) = 1/2"
subject: math
difficulty: 4
objectives:
  - math.trigonometry
authorNotes: Conjunto de math/L.
inputType: number
pages:
  - pageNumber: 1
    title: Trigonometria Básica — Conjunto 17 – Página 1
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: arccos(√2/2) = ?
        correctAnswer: 45°
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: cos(150°) = ?
        correctAnswer: -√3/2
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: arcsen(1) = ?
        correctAnswer: 90°
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: sen(150°) = ?
        correctAnswer: 1/2
        rationale: "sen 45° = cos 45° = √2/2; tan 45° = 1."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: arccos(0) = ?
        correctAnswer: 90°
        rationale: "sen 60° = √3/2; cos 60° = 1/2; tan 60° = √3."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: sen(45°) = ?
        correctAnswer: √2/2
        rationale: "Cheque sinal conforme o quadrante final."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: cos(45°) = ?
        correctAnswer: √2/2
        rationale: "Converta grau↔radiano: 180° = π rad."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: sen(30°) = ?
        correctAnswer: 1/2
        rationale: "Use o ciclo trigonométrico e o quadrante do ângulo."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: arcsen(1/2) = ?
        correctAnswer: 30°
        rationale: "sen²θ + cos²θ = 1 (identidade fundamental)."
        difficulty: 3
        objectives: [math.trigonometry]
  - pageNumber: 2
    title: Trigonometria Básica — Conjunto 17 – Página 2
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: sen(120°) = ?
        correctAnswer: √3/2
        rationale: "tan θ = sen θ / cos θ (cos θ ≠ 0)."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: arcsen(√2/2) = ?
        correctAnswer: 45°
        rationale: "Ângulos notáveis: 30°, 45°, 60° — memorize a tabela."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: sen(30°) = ?
        correctAnswer: 1/2
        rationale: "sen(180° - θ) = sen θ; cos(180° - θ) = -cos θ."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: cos(135°) = ?
        correctAnswer: -√2/2
        rationale: "Quadrante II: seno +, cosseno −, tangente −."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: cos(45°) = ?
        correctAnswer: √2/2
        rationale: "Quadrante III: seno −, cosseno −, tangente +."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: arccos(0) = ?
        correctAnswer: 90°
        rationale: "Quadrante IV: seno −, cosseno +, tangente −."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: arccos(1/2) = ?
        correctAnswer: 60°
        rationale: "Reduza ao primeiro quadrante para achar o valor."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: arccos(√3/2) = ?
        correctAnswer: 30°
        rationale: "sen 30° = 1/2; cos 30° = √3/2; tan 30° = √3/3."
        difficulty: 3
        objectives: [math.trigonometry]
