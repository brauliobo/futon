title: Funções Inversas — Valores Notáveis (4)
level: L
example: "Funções trigonométricas básicas. Ex.: sen(30°) = 1/2"
subject: math
difficulty: 4
objectives:
  - math.trigonometry
authorNotes: Conjunto de math/L.
inputType: number
pages:
  - pageNumber: 1
    title: Trigonometria Básica — Conjunto 18 – Página 1
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: arcsen(1/2) = ?
        correctAnswer: 30°
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: sen(180°) = ?
        correctAnswer: "0"
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: sen(60°) = ?
        correctAnswer: √3/2
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: sen(90°) = ?
        correctAnswer: "1"
        rationale: "sen 45° = cos 45° = √2/2; tan 45° = 1."
      - type: trigonometry
        question: cos(240°) = ?
        correctAnswer: -1/2
        rationale: "sen 60° = √3/2; cos 60° = 1/2; tan 60° = √3."
      - type: trigonometry
        question: tan(135°) = ?
        correctAnswer: "-1"
        rationale: "Cheque sinal conforme o quadrante final."
      - type: trigonometry
        question: sen(45°) = ?
        correctAnswer: √2/2
        rationale: "Converta grau↔radiano: 180° = π rad."
      - type: trigonometry
        question: sen(360°) = ?
        correctAnswer: "0"
        rationale: "Use o ciclo trigonométrico e o quadrante do ângulo."
      - type: trigonometry
        question: 1/sen(150°) = ?
        correctAnswer: 1/(1/2)
        rationale: "sen²θ + cos²θ = 1 (identidade fundamental)."
      - type: trigonometry
        question: tan(5π/4) = ?
        correctAnswer: "1"
        rationale: "tan θ = sen θ / cos θ (cos θ ≠ 0)."
