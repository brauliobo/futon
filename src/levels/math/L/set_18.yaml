title: Funções Inversas — Valores Notáveis (4)
level: L
example: "Funções trigonométricas básicas. Ex.: sen(30°) = 1/2."
subject: math
difficulty: 4
objectives:
  - math.trigonometry
authorNotes: Valores notáveis de arcsen/arccos/arctg. Memorize os ângulos
  correspondentes a 0, 1/2, √2/2, √3/2, 1.
inputType: text
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 18
