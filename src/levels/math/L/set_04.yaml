title: Trigonometria em Graus — Seno, Cosseno & Tangente (4)
level: L
example: "Funções trigonométricas básicas. Ex.: sen(30°) = 1/2"
subject: math
difficulty: 4
objectives:
  - math.trigonometry
authorNotes: Conjunto de math/L.
inputType: number
pages:
  - pageNumber: 1
    title: Trigonometria Básica — Conjunto 4 – Página 1
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: cos(225°) = ?
        correctAnswer: -√2/2
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: sen(0°) = ?
        correctAnswer: "0"
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: tan(60°) = ?
        correctAnswer: √3
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: cos(90°) = ?
        correctAnswer: "0"
        rationale: "sen 45° = cos 45° = √2/2; tan 45° = 1."
      - type: trigonometry
        question: tan(315°) = ?
        correctAnswer: "-1"
        rationale: "sen 60° = √3/2; cos 60° = 1/2; tan 60° = √3."
      - type: trigonometry
        question: cos(315°) = ?
        correctAnswer: √2/2
        rationale: "Cheque sinal conforme o quadrante final."
      - type: trigonometry
        question: cos(0°) = ?
        correctAnswer: "1"
        rationale: "Converta grau↔radiano: 180° = π rad."
      - type: trigonometry
        question: tan(180°) = ?
        correctAnswer: "0"
        rationale: "Use o ciclo trigonométrico e o quadrante do ângulo."
      - type: trigonometry
        question: cos(30°) = ?
        correctAnswer: √3/2
        rationale: "sen²θ + cos²θ = 1 (identidade fundamental)."
      - type: trigonometry
        question: sen(330°) = ?
        correctAnswer: -1/2
        rationale: "tan θ = sen θ / cos θ (cos θ ≠ 0)."
  - pageNumber: 2
    title: Trigonometria Básica — Conjunto 4 – Página 2
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: sen(240°) = ?
        correctAnswer: -√3/2
        rationale: "Ângulos notáveis: 30°, 45°, 60° — memorize a tabela."
      - type: trigonometry
        question: sen(315°) = ?
        correctAnswer: -√2/2
        rationale: "sen(180° - θ) = sen θ; cos(180° - θ) = -cos θ."
      - type: trigonometry
        question: sen(180°) = ?
        correctAnswer: "0"
        rationale: "Quadrante II: seno +, cosseno −, tangente −."
      - type: trigonometry
        question: cos(315°) = ?
        correctAnswer: √2/2
        rationale: "Quadrante III: seno −, cosseno −, tangente +."
      - type: trigonometry
        question: cos(120°) = ?
        correctAnswer: -1/2
        rationale: "Quadrante IV: seno −, cosseno +, tangente −."
      - type: trigonometry
        question: tan(60°) = ?
        correctAnswer: √3
        rationale: "Reduza ao primeiro quadrante para achar o valor."
      - type: trigonometry
        question: cos(135°) = ?
        correctAnswer: -√2/2
        rationale: "sen 30° = 1/2; cos 30° = √3/2; tan 30° = √3/3."
      - type: trigonometry
        question: cos(240°) = ?
        correctAnswer: -1/2
        rationale: "sen 45° = cos 45° = √2/2; tan 45° = 1."
