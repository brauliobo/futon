title: Trigonometria Básica — Conjunto 3
level: L
example: "Funções trigonométricas básicas. Ex.: tan(45°) = 1"
subject: math
pages:
  - pageNumber: 1
    title: Trigonometria Básica — Conjunto 3 – Página 1
    description: Calcule a tangente dos ângulos especiais.
    exercises:
      - &a1
        type: trigonometry
        question: tan(0°) = ?
        correctAnswer: "0"
      - &a2
        type: trigonometry
        question: tan(30°) = ?
        correctAnswer: √3/3
      - &a3
        type: trigonometry
        question: tan(45°) = ?
        correctAnswer: "1"
      - &a4
        type: trigonometry
        question: tan(60°) = ?
        correctAnswer: √3
      - &a5
        type: trigonometry
        question: tan(120°) = ?
        correctAnswer: -√3
      - &a6
        type: trigonometry
        question: tan(135°) = ?
        correctAnswer: "-1"
      - &a7
        type: trigonometry
        question: tan(150°) = ?
        correctAnswer: -√3/3
      - &a8
        type: trigonometry
        question: tan(180°) = ?
        correctAnswer: "0"
      - &a9
        type: trigonometry
        question: tan(225°) = ?
        correctAnswer: "1"
      - &a10
        type: trigonometry
        question: tan(315°) = ?
        correctAnswer: "-1"
