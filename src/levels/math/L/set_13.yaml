title: Identidades de Ângulo Duplo — Conjunto 13
level: L
example: "Identidades de ângulo duplo. Ex.: sen(2x) = 2sen(x)cos(x)"
subject: math
pages:
  - pageNumber: 1
    title: Identidades de Ângulo Duplo — Conjunto 13 – Página 1
    description: Use a identidade sen(2x) = 2sen(x)cos(x).
    exercises:
      - &a1
        type: double_angle
        question: sen(60°) = 2sen(30°)cos(30°) = ?
        correctAnswer: √3/2
      - &a2
        type: double_angle
        question: sen(90°) = 2sen(45°)cos(45°) = ?
        correctAnswer: "1"
      - &a3
        type: double_angle
        question: cos(60°) = cos²(30°) - sen²(30°) = ?
        correctAnswer: 1/2
      - &a4
        type: double_angle
        question: cos(90°) = cos²(45°) - sen²(45°) = ?
        correctAnswer: "0"
      - &a5
        type: double_angle
        question: cos(60°) = 2cos²(30°) - 1 = ?
        correctAnswer: 1/2
      - &a6
        type: double_angle
        question: cos(60°) = 1 - 2sen²(30°) = ?
        correctAnswer: 1/2
      - &a7
        type: double_angle
        question: tan(60°) = 2tan(30°)/(1 - tan²(30°)) = ?
        correctAnswer: √3
      - &a8
        type: double_angle
        question: tan(90°) = 2tan(45°)/(1 - tan²(45°)) = ?
        correctAnswer: indefinido
      - &a9
        type: double_angle
        question: Se sen(x) = 3/5, então sen(2x) = ?
        correctAnswer: 24/25
      - &a10
        type: double_angle
        question: Se cos(x) = 4/5, então cos(2x) = ?
        correctAnswer: 7/25
