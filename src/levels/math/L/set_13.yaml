title: Identidades de Ângulo Duplo — Conjunto 13
level: L
example: "Identidades de ângulo duplo. Ex.: sen(2x) = 2sen(x)cos(x)"
subject: math
pages:
  - pageNumber: 1
    title: Identidades de Ângulo Duplo – Página 1
    description: Use a identidade sen(2x) = 2sen(x)cos(x).
    exercises:
      - type: double_angle
        question: "sen(60°) = 2sen(30°)cos(30°) = ?"
        correctAnswer: "√3/2"
  - pageNumber: 2
    title: Identidades de Ângulo Duplo – Página 2
    description: Use a identidade sen(2x) = 2sen(x)cos(x).
    exercises:
      - type: double_angle
        question: "sen(90°) = 2sen(45°)cos(45°) = ?"
        correctAnswer: "1"
  - pageNumber: 3
    title: Identidades de Ângulo Duplo – Página 3
    description: Use a identidade cos(2x) = cos²(x) - sen²(x).
    exercises:
      - type: double_angle
        question: "cos(60°) = cos²(30°) - sen²(30°) = ?"
        correctAnswer: "1/2"
  - pageNumber: 4
    title: Identidades de Ângulo Duplo – Página 4
    description: Use a identidade cos(2x) = cos²(x) - sen²(x).
    exercises:
      - type: double_angle
        question: "cos(90°) = cos²(45°) - sen²(45°) = ?"
        correctAnswer: "0"
  - pageNumber: 5
    title: Identidades de Ângulo Duplo – Página 5
    description: Use a identidade cos(2x) = 2cos²(x) - 1.
    exercises:
      - type: double_angle
        question: "cos(60°) = 2cos²(30°) - 1 = ?"
        correctAnswer: "1/2"
  - pageNumber: 6
    title: Identidades de Ângulo Duplo – Página 6
    description: Use a identidade cos(2x) = 1 - 2sen²(x).
    exercises:
      - type: double_angle
        question: "cos(60°) = 1 - 2sen²(30°) = ?"
        correctAnswer: "1/2"
  - pageNumber: 7
    title: Identidades de Ângulo Duplo – Página 7
    description: Use a identidade tan(2x) = 2tan(x)/(1 - tan²(x)).
    exercises:
      - type: double_angle
        question: "tan(60°) = 2tan(30°)/(1 - tan²(30°)) = ?"
        correctAnswer: "√3"
  - pageNumber: 8
    title: Identidades de Ângulo Duplo – Página 8
    description: Use a identidade tan(2x) = 2tan(x)/(1 - tan²(x)).
    exercises:
      - type: double_angle
        question: "tan(90°) = 2tan(45°)/(1 - tan²(45°)) = ?"
        correctAnswer: "indefinido"
  - pageNumber: 9
    title: Identidades de Ângulo Duplo – Página 9
    description: Calcule usando identidades de ângulo duplo.
    exercises:
      - type: double_angle
        question: "Se sen(x) = 3/5, então sen(2x) = ?"
        correctAnswer: "24/25"
  - pageNumber: 10
    title: Identidades de Ângulo Duplo – Página 10
    description: Calcule usando identidades de ângulo duplo.
    exercises:
      - type: double_angle
        question: "Se cos(x) = 4/5, então cos(2x) = ?"
        correctAnswer: "7/25"
target: 10
