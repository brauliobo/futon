title: Área de Triângulos — Conjunto 19
level: L
example: "Área de triângulos usando trigonometria. Ex.: Área = (1/2)ab sen(C)"
subject: math
pages:
  - pageNumber: 1
    title: Área de Triângulos — Conjunto 19 – Página 1
    description: Calcule a área usando a fórmula trigonométrica.
    exercises:
      - &a1
        type: triangle_area
        question: a = 6, b = 8, C = 90°. Área = ?
        correctAnswer: "24"
      - &a2
        type: triangle_area
        question: a = 5, b = 7, C = 30°. Área = ?
        correctAnswer: "17.5"
      - &a3
        type: triangle_area
        question: a = 10, b = 12, C = 60°. Área = ?
        correctAnswer: 30√3
      - &a4
        type: triangle_area
        question: b = 8, c = 9, A = 45°. Área = ?
        correctAnswer: 18√2
      - &a5
        type: triangle_area
        question: a = 6, c = 10, B = 120°. Área = ?
        correctAnswer: 15√3
      - &a6
        type: triangle_area
        question: a = 4, b = 6, Área = 12. C = ?
        correctAnswer: 90°
      - &a7
        type: triangle_area
        question: a = 8, C = 30°, Área = 20. b = ?
        correctAnswer: "10"
      - &a8
        type: triangle_area
        question: Lados 3, 4, 5. Área = ?
        correctAnswer: "6"
      - &a9
        type: triangle_area
        question: "Terreno triangular: dois lados 20m e 30m, ângulo 60°. Área = ?"
        correctAnswer: 150√3 m²
      - &a10
        type: triangle_area
        question: Triângulo com perímetro 24 e lados em PA. Se d=2, área = ?
        correctAnswer: 24√5
