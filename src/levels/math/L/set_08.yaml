title: Identidades Básicas — Conjunto 8
level: L
example: "Identidades trigonométricas. Ex.: sen²(x) + cos²(x) = 1"
subject: math
pages:
  - pageNumber: 1
    title: Identidades Básicas — Conjunto 8 – Página 1
    description: Complete a identidade pitagórica.
    exercises:
      - &a1
        type: trig_identity
        question: sen²(30°) + cos²(30°) = ?
        correctAnswer: "1"
      - &a2
        type: trig_identity
        question: sen²(45°) + cos²(45°) = ?
        correctAnswer: "1"
      - &a3
        type: trig_identity
        question: sen²(60°) + cos²(60°) = ?
        correctAnswer: "1"
      - &a4
        type: trig_identity
        question: tan(30°) = sen(30°)/cos(30°) = ?
        correctAnswer: √3/3
      - &a5
        type: trig_identity
        question: tan(45°) = sen(45°)/cos(45°) = ?
        correctAnswer: "1"
      - &a6
        type: trig_identity
        question: tan(60°) = sen(60°)/cos(60°) = ?
        correctAnswer: √3
      - &a7
        type: trig_identity
        question: Se sen(x) = 3/5, então cos²(x) = ?
        correctAnswer: 16/25
      - &a8
        type: trig_identity
        question: Se cos(x) = 4/5, então sen²(x) = ?
        correctAnswer: 9/25
      - &a9
        type: trig_identity
        question: Se sen(x) = 5/13, então cos(x) = ?
        correctAnswer: 12/13
      - &a10
        type: trig_identity
        question: Se cos(x) = 7/25, então sen(x) = ?
        correctAnswer: 24/25
