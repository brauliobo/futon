title: Trigonometria Básica — Conjunto 2
level: L
example: "Funções trigonométricas básicas. Ex.: cos(60°) = 1/2"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Trigonometria Básica — Conjunto 2 – Página 1
    description: Calcule o cosseno dos ângulos especiais.
    exercises:
      - &a1
        type: trigonometry
        question: cos(0°) = ?
        correctAnswer: "1"
      - &a2
        type: trigonometry
        question: cos(30°) = ?
        correctAnswer: √3/2
      - &a3
        type: trigonometry
        question: cos(45°) = ?
        correctAnswer: √2/2
      - &a4
        type: trigonometry
        question: cos(60°) = ?
        correctAnswer: 1/2
      - &a5
        type: trigonometry
        question: cos(90°) = ?
        correctAnswer: "0"
      - &a6
        type: trigonometry
        question: cos(120°) = ?
        correctAnswer: -1/2
      - &a7
        type: trigonometry
        question: cos(135°) = ?
        correctAnswer: -√2/2
      - &a8
        type: trigonometry
        question: cos(150°) = ?
        correctAnswer: -√3/2
      - &a9
        type: trigonometry
        question: cos(180°) = ?
        correctAnswer: "-1"
      - &a10
        type: trigonometry
        question: cos(270°) = ?
        correctAnswer: "0"
