title: Triângulos Retângulos — Conjunto 16
level: L
example: "Trigonometria em triângulos retângulos. Ex.: em um triângulo com cateto oposto = 3 e hipotenusa = 5, sen(θ) = 3/5"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Triângulos Retângulos — Conjunto 16 – Página 1
    description: Calcule o seno no triângulo retângulo.
    exercises:
      - &a1
        type: right_triangle
        question: Cateto oposto = 3, hipotenusa = 5. sen(θ) = ?
        correctAnswer: 3/5
      - &a2
        type: right_triangle
        question: Cateto adjacente = 4, hipotenusa = 5. cos(θ) = ?
        correctAnswer: 4/5
      - &a3
        type: right_triangle
        question: Cateto oposto = 3, cateto adjacente = 4. tan(θ) = ?
        correctAnswer: 3/4
      - &a4
        type: right_triangle
        question: Hipotenusa = 10, θ = 30°. Cateto oposto = ?
        correctAnswer: "5"
      - &a5
        type: right_triangle
        question: Hipotenusa = 10, θ = 60°. Cateto adjacente = ?
        correctAnswer: "5"
      - &a6
        type: right_triangle
        question: Cateto adjacente = 8, θ = 45°. Cateto oposto = ?
        correctAnswer: "8"
      - &a7
        type: right_triangle
        question: Cateto oposto = 5, hipotenusa = 10. θ = ?
        correctAnswer: 30°
      - &a8
        type: right_triangle
        question: Cateto adjacente = 5√3, hipotenusa = 10. θ = ?
        correctAnswer: 30°
      - &a9
        type: right_triangle
        question: Cateto oposto = cateto adjacente = 7. θ = ?
        correctAnswer: 45°
      - &a10
        type: right_triangle
        question: Um lado = 6, outro lado = 8. Hipotenusa = ?
        correctAnswer: "10"
