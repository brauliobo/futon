title: Triângulos Retângulos — Conjunto 16
level: L
example: "Trigonometria em triângulos retângulos. Ex.: em um triângulo com cateto oposto = 3 e hipotenusa = 5, sen(θ) = 3/5"
subject: math
pages:
  - pageNumber: 1
    title: Triângulos Retângulos – Página 1
    description: Calcule o seno no triângulo retângulo.
    exercises:
      - type: right_triangle
        question: "Cateto oposto = 3, hipotenusa = 5. sen(θ) = ?"
        correctAnswer: "3/5"
  - pageNumber: 2
    title: Triângulos Retângulos – Página 2
    description: Calcule o cosseno no triângulo retângulo.
    exercises:
      - type: right_triangle
        question: "Cateto adjacente = 4, hipotenusa = 5. cos(θ) = ?"
        correctAnswer: "4/5"
  - pageNumber: 3
    title: Triângulos Retângulos – Página 3
    description: Calcule a tangente no triângulo retângulo.
    exercises:
      - type: right_triangle
        question: "Cateto oposto = 3, cateto adjacente = 4. tan(θ) = ?"
        correctAnswer: "3/4"
  - pageNumber: 4
    title: Triângulos Retângulos – Página 4
    description: Encontre o lado desconhecido.
    exercises:
      - type: right_triangle
        question: "Hipotenusa = 10, θ = 30°. Cateto oposto = ?"
        correctAnswer: "5"
  - pageNumber: 5
    title: Triângulos Retângulos – Página 5
    description: Encontre o lado desconhecido.
    exercises:
      - type: right_triangle
        question: "Hipotenusa = 10, θ = 60°. Cateto adjacente = ?"
        correctAnswer: "5"
  - pageNumber: 6
    title: Triângulos Retângulos – Página 6
    description: Encontre o lado desconhecido.
    exercises:
      - type: right_triangle
        question: "Cateto adjacente = 8, θ = 45°. Cateto oposto = ?"
        correctAnswer: "8"
  - pageNumber: 7
    title: Triângulos Retângulos – Página 7
    description: Encontre o ângulo.
    exercises:
      - type: right_triangle
        question: "Cateto oposto = 5, hipotenusa = 10. θ = ?"
        correctAnswer: "30°"
  - pageNumber: 8
    title: Triângulos Retângulos – Página 8
    description: Encontre o ângulo.
    exercises:
      - type: right_triangle
        question: "Cateto adjacente = 5√3, hipotenusa = 10. θ = ?"
        correctAnswer: "30°"
  - pageNumber: 9
    title: Triângulos Retângulos – Página 9
    description: Encontre o ângulo.
    exercises:
      - type: right_triangle
        question: "Cateto oposto = cateto adjacente = 7. θ = ?"
        correctAnswer: "45°"
  - pageNumber: 10
    title: Triângulos Retângulos – Página 10
    description: Resolva o triângulo.
    exercises:
      - type: right_triangle
        question: "Um lado = 6, outro lado = 8. Hipotenusa = ?"
        correctAnswer: "10"
target: 10
