title: Trigonometria em Radianos — Seno e Cosseno (1)
level: L
example: "Funções trigonométricas básicas. Ex.: sen(30°) = 1/2"
subject: math
difficulty: 4
objectives:
  - math.trigonometry
authorNotes: Conjunto de math/L.
inputType: number
pages:
  - pageNumber: 1
    title: Trigonometria Básica — Conjunto 6 – Página 1
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: cos(π/6) = ?
        correctAnswer: √3/2
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: cos(11π/6) = ?
        correctAnswer: √3/2
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: cos(4π/3) = ?
        correctAnswer: -1/2
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: tan(5π/3) = ?
        correctAnswer: -√3
        rationale: "sen 45° = cos 45° = √2/2; tan 45° = 1."
      - type: trigonometry
        question: tan(3π/4) = ?
        correctAnswer: "-1"
        rationale: "sen 60° = √3/2; cos 60° = 1/2; tan 60° = √3."
      - type: trigonometry
        question: cos(5π/4) = ?
        correctAnswer: -√2/2
        rationale: "Cheque sinal conforme o quadrante final."
      - type: trigonometry
        question: tan(π) = ?
        correctAnswer: "0"
        rationale: "Converta grau↔radiano: 180° = π rad."
      - type: trigonometry
        question: tan(2π) = ?
        correctAnswer: "0"
        rationale: "Use o ciclo trigonométrico e o quadrante do ângulo."
      - type: trigonometry
        question: cos(π/4) = ?
        correctAnswer: √2/2
        rationale: "sen²θ + cos²θ = 1 (identidade fundamental)."
      - type: trigonometry
        question: sen(5π/4) = ?
        correctAnswer: -√2/2
        rationale: "tan θ = sen θ / cos θ (cos θ ≠ 0)."
  - pageNumber: 2
    title: Trigonometria Básica — Conjunto 6 – Página 2
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: tan(2π/3) = ?
        correctAnswer: -√3
        rationale: "Ângulos notáveis: 30°, 45°, 60° — memorize a tabela."
      - type: trigonometry
        question: tan(2π) = ?
        correctAnswer: "0"
        rationale: "sen(180° - θ) = sen θ; cos(180° - θ) = -cos θ."
      - type: trigonometry
        question: sen(4π/3) = ?
        correctAnswer: -√3/2
        rationale: "Quadrante II: seno +, cosseno −, tangente −."
      - type: trigonometry
        question: sen(5π/3) = ?
        correctAnswer: -√3/2
        rationale: "Quadrante III: seno −, cosseno −, tangente +."
      - type: trigonometry
        question: cos(π) = ?
        correctAnswer: "-1"
        rationale: "Quadrante IV: seno −, cosseno +, tangente −."
      - type: trigonometry
        question: sen(5π/4) = ?
        correctAnswer: -√2/2
        rationale: "Reduza ao primeiro quadrante para achar o valor."
      - type: trigonometry
        question: cos(2π/3) = ?
        correctAnswer: -1/2
        rationale: "sen 30° = 1/2; cos 30° = √3/2; tan 30° = √3/3."
      - type: trigonometry
        question: sen(5π/6) = ?
        correctAnswer: 1/2
        rationale: "sen 45° = cos 45° = √2/2; tan 45° = 1."
      - type: trigonometry
        question: cos(2π) = ?
        correctAnswer: "1"
        rationale: "sen 60° = √3/2; cos 60° = 1/2; tan 60° = √3."
      - type: trigonometry
        question: cos(π/2) = ?
        correctAnswer: "0"
        rationale: "Cheque sinal conforme o quadrante final."
