title: Cosseno em Radianos — Conjunto 6
level: L
example: "Funções trigonométricas em radianos. Ex.: cos(π/3) = 1/2"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Cosseno em Radianos — Conjunto 6 – Página 1
    description: Calcule o cosseno em radianos.
    exercises:
      - &a1
        type: trigonometry_radians
        question: cos(0) = ?
        correctAnswer: "1"
      - &a2
        type: trigonometry_radians
        question: cos(π/6) = ?
        correctAnswer: √3/2
      - &a3
        type: trigonometry_radians
        question: cos(π/4) = ?
        correctAnswer: √2/2
      - &a4
        type: trigonometry_radians
        question: cos(π/3) = ?
        correctAnswer: 1/2
      - &a5
        type: trigonometry_radians
        question: cos(π/2) = ?
        correctAnswer: "0"
      - &a6
        type: trigonometry_radians
        question: cos(2π/3) = ?
        correctAnswer: -1/2
      - &a7
        type: trigonometry_radians
        question: cos(3π/4) = ?
        correctAnswer: -√2/2
      - &a8
        type: trigonometry_radians
        question: cos(5π/6) = ?
        correctAnswer: -√3/2
      - &a9
        type: trigonometry_radians
        question: cos(π) = ?
        correctAnswer: "-1"
      - &a10
        type: trigonometry_radians
        question: cos(3π/2) = ?
        correctAnswer: "0"
