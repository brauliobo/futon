title: Funções Inversas — Conjunto 14
level: L
example: "Funções trigonométricas inversas. Ex.: arcsen(1/2) = 30°"
subject: math
pages:
  - pageNumber: 1
    title: Funções Inversas — Conjunto 14 – Página 1
    description: Calcule o arco seno.
    exercises:
      - &a1
        type: inverse_trig
        question: arcsen(0) = ?
        correctAnswer: 0°
      - &a2
        type: inverse_trig
        question: arcsen(1/2) = ?
        correctAnswer: 30°
      - &a3
        type: inverse_trig
        question: arcsen(√2/2) = ?
        correctAnswer: 45°
      - &a4
        type: inverse_trig
        question: arcsen(√3/2) = ?
        correctAnswer: 60°
      - &a5
        type: inverse_trig
        question: arcsen(1) = ?
        correctAnswer: 90°
      - &a6
        type: inverse_trig
        question: arccos(1) = ?
        correctAnswer: 0°
      - &a7
        type: inverse_trig
        question: arccos(√3/2) = ?
        correctAnswer: 30°
      - &a8
        type: inverse_trig
        question: arccos(√2/2) = ?
        correctAnswer: 45°
      - &a9
        type: inverse_trig
        question: arccos(1/2) = ?
        correctAnswer: 60°
      - &a10
        type: inverse_trig
        question: arccos(0) = ?
        correctAnswer: 90°
