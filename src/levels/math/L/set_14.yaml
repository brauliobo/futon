title: Funções Recíprocas — Valores Mistos (4)
level: L
example: "Funções trigonométricas básicas. Ex.: sen(30°) = 1/2"
subject: math
difficulty: 4
objectives:
  - math.trigonometry
authorNotes: Conjunto de math/L.
inputType: number
pages:
  - pageNumber: 1
    title: Trigonometria Básica — Conjunto 14 – Página 1
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: cos(0°) = ?
        correctAnswer: "1"
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: 1/cos(180°) = ?
        correctAnswer: 1/(-1)
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: 1/sen(30°) = ?
        correctAnswer: 1/(1/2)
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: 1/sen(150°) = ?
        correctAnswer: 1/(1/2)
        rationale: "sen 45° = cos 45° = √2/2; tan 45° = 1."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: 1/sen(135°) = ?
        correctAnswer: 1/(√2/2)
        rationale: "sen 60° = √3/2; cos 60° = 1/2; tan 60° = √3."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: 1/sen(300°) = ?
        correctAnswer: 1/(-√3/2)
        rationale: "Cheque sinal conforme o quadrante final."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: sen²(45°) + cos²(45°) = ?
        correctAnswer: "1"
        rationale: "Converta grau↔radiano: 180° = π rad."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: 1/cos(120°) = ?
        correctAnswer: 1/(-1/2)
        rationale: "Use o ciclo trigonométrico e o quadrante do ângulo."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: sen²(90°) + cos²(90°) = ?
        correctAnswer: "1"
        rationale: "sen²θ + cos²θ = 1 (identidade fundamental)."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: sen²(180°) + cos²(180°) = ?
        correctAnswer: "1"
        rationale: "tan θ = sen θ / cos θ (cos θ ≠ 0)."
        difficulty: 3
        objectives: [math.trigonometry]
  - pageNumber: 2
    title: Trigonometria Básica — Conjunto 14 – Página 2
    description: Calcule o valor da função trigonométrica.
    exercises:
      - type: trigonometry
        question: sen²(30°) + cos²(30°) = ?
        correctAnswer: "1"
        rationale: "Ângulos notáveis: 30°, 45°, 60° — memorize a tabela."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: cos(90°) = ?
        correctAnswer: "0"
        rationale: "sen(180° - θ) = sen θ; cos(180° - θ) = -cos θ."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: 1/cos(330°) = ?
        correctAnswer: 1/(√3/2)
        rationale: "Quadrante II: seno +, cosseno −, tangente −."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: sen²(300°) + cos²(300°) = ?
        correctAnswer: "1"
        rationale: "Quadrante III: seno −, cosseno −, tangente +."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: cos(60°) = ?
        correctAnswer: 1/2
        rationale: "Quadrante IV: seno −, cosseno +, tangente −."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: 1/cos(150°) = ?
        correctAnswer: 1/(-√3/2)
        rationale: "Reduza ao primeiro quadrante para achar o valor."
        difficulty: 3
        objectives: [math.trigonometry]
      - type: trigonometry
        question: cos(30°) = ?
        correctAnswer: √3/2
        rationale: "sen 30° = 1/2; cos 30° = √3/2; tan 30° = √3/3."
