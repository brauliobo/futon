title: Arco Tangente — Conjunto 15
level: L
example: "Função arco tangente. Ex.: arctan(1) = 45°"
subject: math
pages:
  - pageNumber: 1
    title: Arco Tangente — Conjunto 15 – Página 1
    description: Calcule o arco tangente.
    exercises:
      - &a1
        type: inverse_trig
        question: arctan(0) = ?
        correctAnswer: 0°
      - &a2
        type: inverse_trig
        question: arctan(√3/3) = ?
        correctAnswer: 30°
      - &a3
        type: inverse_trig
        question: arctan(1) = ?
        correctAnswer: 45°
      - &a4
        type: inverse_trig
        question: arctan(√3) = ?
        correctAnswer: 60°
      - &a5
        type: inverse_trig
        question: arctan(-√3/3) = ?
        correctAnswer: -30°
      - &a6
        type: inverse_trig
        question: arctan(-1) = ?
        correctAnswer: -45°
      - &a7
        type: inverse_trig
        question: arctan(-√3) = ?
        correctAnswer: -60°
      - &a8
        type: inverse_trig
        question: Se tan(x) = 2, então x = ?
        correctAnswer: arctan(2)
      - &a9
        type: inverse_trig
        question: Se tan(x) = 3/4, então x = ?
        correctAnswer: arctan(3/4)
      - &a10
        type: inverse_trig
        question: Se tan(x) = -5/12, então x = ?
        correctAnswer: arctan(-5/12)
