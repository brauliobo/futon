title: Tangente em Radianos — Conjunto 7
level: L
example: "Funções trigonométricas em radianos. Ex.: tan(π/4) = 1"
subject: math
pages:
  - pageNumber: 1
    title: Tangente em Radianos — Conjunto 7 – Página 1
    description: Calcule a tangente em radianos.
    exercises:
      - &a1
        type: trigonometry_radians
        question: tan(0) = ?
        correctAnswer: "0"
      - &a2
        type: trigonometry_radians
        question: tan(π/6) = ?
        correctAnswer: √3/3
      - &a3
        type: trigonometry_radians
        question: tan(π/4) = ?
        correctAnswer: "1"
      - &a4
        type: trigonometry_radians
        question: tan(π/3) = ?
        correctAnswer: √3
      - &a5
        type: trigonometry_radians
        question: tan(2π/3) = ?
        correctAnswer: -√3
      - &a6
        type: trigonometry_radians
        question: tan(3π/4) = ?
        correctAnswer: "-1"
      - &a7
        type: trigonometry_radians
        question: tan(5π/6) = ?
        correctAnswer: -√3/3
      - &a8
        type: trigonometry_radians
        question: tan(π) = ?
        correctAnswer: "0"
      - &a9
        type: trigonometry_radians
        question: tan(5π/4) = ?
        correctAnswer: "1"
      - &a10
        type: trigonometry_radians
        question: tan(7π/4) = ?
        correctAnswer: "-1"
