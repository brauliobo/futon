title: Trigonometria Básica — Conjunto 1
level: L
example: "Funções trigonométricas básicas. Ex.: sen(30°) = 1/2"
subject: math
pages:
  - pageNumber: 1
    title: Trigonometria Básica — Conjunto 1 – Página 1
    description: Calcule o seno dos ângulos especiais.
    exercises:
      - &a1
        type: trigonometry
        question: sen(0°) = ?
        correctAnswer: "0"
      - &a2
        type: trigonometry
        question: sen(30°) = ?
        correctAnswer: 1/2
      - &a3
        type: trigonometry
        question: sen(45°) = ?
        correctAnswer: √2/2
      - &a4
        type: trigonometry
        question: sen(60°) = ?
        correctAnswer: √3/2
      - &a5
        type: trigonometry
        question: sen(90°) = ?
        correctAnswer: "1"
      - &a6
        type: trigonometry
        question: sen(120°) = ?
        correctAnswer: √3/2
      - &a7
        type: trigonometry
        question: sen(135°) = ?
        correctAnswer: √2/2
      - &a8
        type: trigonometry
        question: sen(150°) = ?
        correctAnswer: 1/2
      - &a9
        type: trigonometry
        question: sen(180°) = ?
        correctAnswer: "0"
      - &a10
        type: trigonometry
        question: sen(270°) = ?
        correctAnswer: "-1"
