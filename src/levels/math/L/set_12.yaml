title: Identidades de Soma — Conjunto 12
level: L
example: "Identidades de soma e diferença. Ex.: sen(A + B) = sen(A)cos(B) + cos(A)sen(B)"
subject: math
pages:
  - pageNumber: 1
    title: Identidades de Soma – Página 1
    description: Use a identidade sen(A + B).
    exercises:
      - type: sum_identity
        question: "sen(30° + 45°) = ?"
        correctAnswer: "(√6 + √2)/4"
  - pageNumber: 2
    title: Identidades de Soma – Página 2
    description: Use a identidade sen(A + B).
    exercises:
      - type: sum_identity
        question: "sen(45° + 30°) = ?"
        correctAnswer: "(√6 + √2)/4"
  - pageNumber: 3
    title: Identidades de Soma – Página 3
    description: Use a identidade cos(A + B).
    exercises:
      - type: sum_identity
        question: "cos(30° + 45°) = ?"
        correctAnswer: "(√6 - √2)/4"
  - pageNumber: 4
    title: Identidades de Soma – Página 4
    description: Use a identidade cos(A + B).
    exercises:
      - type: sum_identity
        question: "cos(45° + 30°) = ?"
        correctAnswer: "(√6 - √2)/4"
  - pageNumber: 5
    title: Identidades de Soma – Página 5
    description: Use a identidade sen(A - B).
    exercises:
      - type: sum_identity
        question: "sen(45° - 30°) = ?"
        correctAnswer: "(√6 - √2)/4"
  - pageNumber: 6
    title: Identidades de Soma – Página 6
    description: Use a identidade sen(A - B).
    exercises:
      - type: sum_identity
        question: "sen(60° - 30°) = ?"
        correctAnswer: "1/2"
  - pageNumber: 7
    title: Identidades de Soma – Página 7
    description: Use a identidade cos(A - B).
    exercises:
      - type: sum_identity
        question: "cos(45° - 30°) = ?"
        correctAnswer: "(√6 + √2)/4"
  - pageNumber: 8
    title: Identidades de Soma – Página 8
    description: Use a identidade cos(A - B).
    exercises:
      - type: sum_identity
        question: "cos(60° - 30°) = ?"
        correctAnswer: "√3/2"
  - pageNumber: 9
    title: Identidades de Soma – Página 9
    description: Use identidades para calcular.
    exercises:
      - type: sum_identity
        question: "sen(75°) = sen(45° + 30°) = ?"
        correctAnswer: "(√6 + √2)/4"
  - pageNumber: 10
    title: Identidades de Soma – Página 10
    description: Use identidades para calcular.
    exercises:
      - type: sum_identity
        question: "cos(15°) = cos(45° - 30°) = ?"
        correctAnswer: "(√6 + √2)/4"
target: 10
