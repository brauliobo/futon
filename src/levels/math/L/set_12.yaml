title: Funções Recíprocas & Identidades Pitagóricas (2)
level: L
example: "Identidade: sen²θ + cos²θ = 1. Recíprocas: csc = 1/sen, sec = 1/cos. Ex.: 1/sen(30°) = 1/(1/2) = 2."
subject: math
difficulty: 4
objectives:
  - math.trigonometry
authorNotes: Secante, cossecante + identidade sen²+cos² = 1. Cada página mistura
  2 identidades, 4 cossecantes e 4 secantes — distribuição de respostas equilibrada.
inputType: text
passCriteria:
  minAccuracyPercent: 75
  maxAvgSecondsPerExercise: 18
pages:
  - pageNumber: 1
    title: Identidade + Sec/Csc — prática 1
    description: Identidade Pitagórica e recíprocas em ângulos notáveis.
    exercises:
      - {type: trigonometry, question: "sen²(45°) + cos²(45°) = ?",  correctAnswer: "1",          rationale: "Identidade fundamental: sen²θ + cos²θ = 1 em qualquer θ.",       difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "sen²(180°) + cos²(180°) = ?",correctAnswer: "1",          rationale: "Identidade fundamental: sen²θ + cos²θ = 1 em qualquer θ.",       difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(30°) = ?",             correctAnswer: "1/(1/2)",    rationale: "sen(30°) = 1/2, então csc(30°) = 1/(1/2) = 2.",                  difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(60°) = ?",             correctAnswer: "1/(√3/2)",   rationale: "sen(60°) = √3/2, então csc(60°) = 1/(√3/2) = 2√3/3.",            difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(135°) = ?",            correctAnswer: "1/(√2/2)",   rationale: "sen(135°) = +√2/2 (2º quadrante), csc = 1/(√2/2) = √2.",         difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/sen(210°) = ?",            correctAnswer: "1/(-1/2)",   rationale: "sen(210°) = −1/2 (3º quadrante), csc = 1/(−1/2) = −2.",          difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/cos(0°) = ?",              correctAnswer: "1/1",        rationale: "cos(0°) = 1, então sec(0°) = 1/1 = 1.",                           difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/cos(60°) = ?",             correctAnswer: "1/(1/2)",    rationale: "cos(60°) = 1/2, então sec(60°) = 1/(1/2) = 2.",                  difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/cos(120°) = ?",            correctAnswer: "1/(-1/2)",   rationale: "cos(120°) = −1/2 (2º quadrante), sec = 1/(−1/2) = −2.",          difficulty: 3, objectives: [math.trigonometry]}
      - {type: trigonometry, question: "1/cos(180°) = ?",            correctAnswer: "1/(-1)",     rationale: "cos(180°) = −1, então sec(180°) = 1/(−1) = −1.",                 difficulty: 3, objectives: [math.trigonometry]}
