title: Identidades de Soma — Conjunto 12
level: L
example: "Identidades de soma e diferença. Ex.: sen(A + B) = sen(A)cos(B) + cos(A)sen(B)"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Identidades de Soma — Conjunto 12 – Página 1
    description: Use a identidade sen(A + B).
    exercises:
      - &a1
        type: sum_identity
        question: sen(30° + 45°) = ?
        correctAnswer: (√6 + √2)/4
      - &a2
        type: sum_identity
        question: sen(45° + 30°) = ?
        correctAnswer: (√6 + √2)/4
      - &a3
        type: sum_identity
        question: cos(30° + 45°) = ?
        correctAnswer: (√6 - √2)/4
      - &a4
        type: sum_identity
        question: cos(45° + 30°) = ?
        correctAnswer: (√6 - √2)/4
      - &a5
        type: sum_identity
        question: sen(45° - 30°) = ?
        correctAnswer: (√6 - √2)/4
      - &a6
        type: sum_identity
        question: sen(60° - 30°) = ?
        correctAnswer: 1/2
      - &a7
        type: sum_identity
        question: cos(45° - 30°) = ?
        correctAnswer: (√6 + √2)/4
      - &a8
        type: sum_identity
        question: cos(60° - 30°) = ?
        correctAnswer: √3/2
      - &a9
        type: sum_identity
        question: sen(75°) = sen(45° + 30°) = ?
        correctAnswer: (√6 + √2)/4
      - &a10
        type: sum_identity
        question: cos(15°) = cos(45° - 30°) = ?
        correctAnswer: (√6 + √2)/4
