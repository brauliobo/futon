title: Interceptos de Retas — Conjunto 18
level: H
example: "Encontre interceptos. Ex.: 2x + 3y = 6 → intercepto x = 3, intercepto y = 2"
subject: math
pages:
  - pageNumber: 1
    title: Interceptos de Retas — Conjunto 18 – Página 1
    description: Encontre interceptos de retas.
    exercises:
      - &a1
        type: intercepts
        question: Qual é o intercepto y da reta y = 3x + 6?
        correctAnswer: "6"
      - &a2
        type: intercepts
        question: Qual é o intercepto x da reta y = 2x - 4?
        correctAnswer: "2"
      - &a3
        type: intercepts
        question: Qual é o intercepto y da reta 2x + y = 8?
        correctAnswer: "8"
      - &a4
        type: intercepts
        question: Qual é o intercepto x da reta x + 3y = 9?
        correctAnswer: "9"
      - &a5
        type: intercepts
        question: Qual é o intercepto y da reta y = -x + 5?
        correctAnswer: "5"
      - &a6
        type: intercepts
        question: Qual é o intercepto x da reta y = 4x - 12?
        correctAnswer: "3"
      - &a7
        type: intercepts
        question: Qual é o intercepto y da reta 3x + 2y = 10?
        correctAnswer: "5"
      - &a8
        type: intercepts
        question: Qual é o intercepto x da reta 2x - 5y = 14?
        correctAnswer: "7"
      - &a9
        type: intercepts
        question: Qual é o intercepto y da reta y = x/2 + 4?
        correctAnswer: "4"
      - &a10
        type: intercepts
        question: Qual é o intercepto x da reta y = -3x + 15?
        correctAnswer: "5"
