title: Inequações Compostas — Conjunto 14
level: H
example: "Resolva inequações compostas. Ex.: 1 < 2x + 3 ≤ 9 → -1 < x ≤ 3"
subject: math
pages:
  - pageNumber: 1
    title: Inequações Compostas — Conjunto 14 – Página 1
    description: Resolva inequações lineares compostas.
    exercises:
      - &a1
        type: compound_inequality
        question: -2 < x + 1 < 5
        correctAnswer: -3 < x < 4
      - &a2
        type: compound_inequality
        question: 0 ≤ 2x - 4 ≤ 8
        correctAnswer: 2 ≤ x ≤ 6
      - &a3
        type: compound_inequality
        question: -6 < 3x + 3 < 12
        correctAnswer: -3 < x < 3
      - &a4
        type: compound_inequality
        question: 1 ≤ x/2 + 3 ≤ 7
        correctAnswer: -4 ≤ x ≤ 8
      - &a5
        type: compound_inequality
        question: -5 < 4x - 1 < 15
        correctAnswer: -1 < x < 4
      - &a6
        type: compound_inequality
        question: 2 ≤ 5x + 2 ≤ 22
        correctAnswer: 0 ≤ x ≤ 4
      - &a7
        type: compound_inequality
        question: -8 < 2x - 2 < 6
        correctAnswer: -3 < x < 4
      - &a8
        type: compound_inequality
        question: 0 < x/3 + 1 < 4
        correctAnswer: -3 < x < 9
      - &a9
        type: compound_inequality
        question: -10 ≤ 6x - 4 ≤ 14
        correctAnswer: -1 ≤ x ≤ 3
      - &a10
        type: compound_inequality
        question: 3 < 3x + 6 < 18
        correctAnswer: -1 < x < 4
