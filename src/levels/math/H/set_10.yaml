title: Sistemas de Equações Simples — Conjunto 10
level: H
example: "Resolva sistemas simples. Ex.: x + y = 5, x - y = 1 → x = 3, y = 2"
subject: math
pages:
  - pageNumber: 1
    title: Sistemas de Equações Simples — Conjunto 10 – Página 1
    description: Resolva sistemas de equações lineares simples.
    exercises:
      - &a1
        type: system_equations
        question: |-
          x + y = 7
          x - y = 3
          Encontre x:
        correctAnswer: "5"
      - &a2
        type: system_equations
        question: |-
          x + y = 9
          x - y = 1
          Encontre y:
        correctAnswer: "4"
      - &a3
        type: system_equations
        question: |-
          2x + y = 10
          x - y = 2
          Encontre x:
        correctAnswer: "4"
      - &a4
        type: system_equations
        question: |-
          x + 2y = 8
          x - y = 2
          Encontre y:
        correctAnswer: "2"
