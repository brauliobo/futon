          x - y = 1
          Encontre x:
        correctAnswer: "5"
      - &a8
        type: system_equations
        question: |-
          x + 4y = 17
          x + y = 8
          Encontre y:
        correctAnswer: "3"
      - &a9
        type: system_equations
        question: |-
          4x + y = 19
          x - y = 1
          Encontre x:
        correctAnswer: "4"
      - &a10
        type: system_equations
        question: |-
          x + 5y = 21
          2x - y = 3
          Encontre y:
        correctAnswer: "3"
