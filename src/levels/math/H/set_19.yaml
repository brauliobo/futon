title: Equação da Reta por Dois Pontos — Conjunto 19
level: H
example: "Encontre a equação da reta. Ex.: pontos (0,3) e (2,7) → y = 2x + 3"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Equação da Reta por Dois Pontos — Conjunto 19 – Página 1
    description: Determine a equação da reta que passa por dois pontos.
    exercises:
      - &a1
        type: line_equation
        question: Qual é o coeficiente angular da reta que passa por (1,2) e (3,8)?
        correctAnswer: "3"
      - &a2
        type: line_equation
        question: Qual é o coeficiente linear da reta que passa por (0,5) e (2,9)?
        correctAnswer: "5"
      - &a3
        type: line_equation
        question: Qual é o coeficiente angular da reta que passa por (2,1) e (4,7)?
        correctAnswer: "3"
      - &a4
        type: line_equation
        question: Qual é o coeficiente linear da reta que passa por (0,-2) e (3,4)?
        correctAnswer: "-2"
      - &a5
        type: line_equation
        question: Qual é o coeficiente angular da reta que passa por (1,5) e (5,1)?
        correctAnswer: "-1"
      - &a6
        type: line_equation
        question: Qual é o coeficiente linear da reta que passa por (0,8) e (4,0)?
        correctAnswer: "8"
      - &a7
        type: line_equation
        question: Qual é o coeficiente angular da reta que passa por (2,3) e (6,11)?
        correctAnswer: "2"
      - &a8
        type: line_equation
        question: Qual é o coeficiente linear da reta que passa por (0,1) e (2,5)?
        correctAnswer: "1"
      - &a9
        type: line_equation
        question: Qual é o coeficiente angular da reta que passa por (3,2) e (7,10)?
        correctAnswer: "2"
      - &a10
        type: line_equation
        question: Qual é o coeficiente linear da reta que passa por (0,6) e (3,0)?
        correctAnswer: "6"
