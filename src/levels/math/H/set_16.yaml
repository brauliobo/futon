title: Gráficos de Equações Lineares — Conjunto 16
level: H
example: "Determine pontos na reta. Ex.: y = 2x + 1, quando x = 3 → y = 7"
subject: math
pages:
  - pageNumber: 1
    title: Gráficos Lineares – Página 1
    description: Determine pontos em gráficos de equações lineares.
    exercises:
      - type: linear_graph
        question: Se y = 3x + 2, qual é o valor de y quando x = 1?
        correctAnswer: "5"
  - pageNumber: 2
    title: Gráficos Lineares – Página 2
    description: Determine pontos em gráficos de equações lineares.
    exercises:
