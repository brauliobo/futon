title: Coeficiente Angular e Linear — Conjunto 17
level: H
example: "Identifique coeficientes. Ex.: y = 3x + 5 → coeficiente angular = 3, linear = 5"
subject: math
pages:
  - pageNumber: 1
    title: Coeficientes – Página 1
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = 4x + 7, qual é o coeficiente angular?"
        correctAnswer: "4"
  - pageNumber: 2
    title: Coeficientes – Página 2
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = -2x + 9, qual é o coeficiente linear?"
        correctAnswer: "9"
  - pageNumber: 3
    title: Coeficientes – Página 3
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = x/3 - 2, qual é o coeficiente angular?"
        correctAnswer: "1/3"
  - pageNumber: 4
    title: Coeficientes – Página 4
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = 5x - 8, qual é o coeficiente linear?"
        correctAnswer: "-8"
  - pageNumber: 5
    title: Coeficientes – Página 5
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = -3x/2 + 4, qual é o coeficiente angular?"
        correctAnswer: "-3/2"
  - pageNumber: 6
    title: Coeficientes – Página 6
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = 7x + 1, qual é o coeficiente linear?"
        correctAnswer: "1"
  - pageNumber: 7
    title: Coeficientes – Página 7
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = -x + 6, qual é o coeficiente angular?"
        correctAnswer: "-1"
  - pageNumber: 8
    title: Coeficientes – Página 8
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = 2x/5 - 3, qual é o coeficiente linear?"
        correctAnswer: "-3"
  - pageNumber: 9
    title: Coeficientes – Página 9
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = 8x - 12, qual é o coeficiente angular?"
        correctAnswer: "8"
  - pageNumber: 10
    title: Coeficientes – Página 10
    description: Identifique coeficientes angular e linear.
    exercises:
      - type: slope_intercept
        question: "Na equação y = -4x/3 + 10, qual é o coeficiente linear?"
        correctAnswer: "10"
