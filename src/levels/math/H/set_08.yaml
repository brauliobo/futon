title: Inequações com Números Negativos — Conjunto 8
level: H
example: "Resolva inequações com números negativos. Ex.: -2x > 6 → x < -3"
subject: math
pages:
  - pageNumber: 1
    title: Inequações com Números Negativos — Conjunto 8 – Página 1
    description: Resolva inequações com números negativos.
    exercises:
      - &a1
        type: linear_inequality
        question: -x > 4
        correctAnswer: x < -4
      - &a2
        type: linear_inequality
        question: -2x ≤ 8
        correctAnswer: x ≥ -4
      - &a3
        type: linear_inequality
        question: -3x + 1 < 10
        correctAnswer: x > -3
      - &a4
        type: linear_inequality
        question: -x - 2 ≥ 3
        correctAnswer: x ≤ -5
      - &a5
        type: linear_inequality
        question: -4x > 12
        correctAnswer: x < -3
      - &a6
        type: linear_inequality
        question: -2x + 3 ≤ 7
        correctAnswer: x ≥ -2
      - &a7
        type: linear_inequality
        question: -5x - 1 < 14
        correctAnswer: x > -3
      - &a8
        type: linear_inequality
        question: -x + 4 ≥ 7
        correctAnswer: x ≤ -3
      - &a9
        type: linear_inequality
        question: -3x > 15
        correctAnswer: x < -5
      - &a10
        type: linear_inequality
        question: -6x + 2 ≤ 20
        correctAnswer: x ≥ -3
