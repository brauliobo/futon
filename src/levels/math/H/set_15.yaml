        correctAnswer: "15"
        rationale: "Sistema com infinitas soluções → equações equivalentes."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: absolute_value
        question: "|x + -6| = 2"
        correctAnswer: "4"
        rationale: "Abra parênteses respeitando distribuição e sinais."
        difficulty: 2
        objectives: [math.linear_equations]
