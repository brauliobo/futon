title: Equações com Valor Absoluto — Conjunto 15
level: H
example: "Resolva equações com valor absoluto. Ex.: |x - 3| = 5 → x = 8 ou x = -2"
subject: math
pages:
  - pageNumber: 1
    title: Valor Absoluto – Página 1
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|x| = 7"
        correctAnswer: "x = 7 ou x = -7"
  - pageNumber: 2
    title: Valor Absoluto – Página 2
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|x - 2| = 4"
        correctAnswer: "x = 6 ou x = -2"
  - pageNumber: 3
    title: Valor Absoluto – Página 3
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|2x| = 8"
        correctAnswer: "x = 4 ou x = -4"
  - pageNumber: 4
    title: Valor Absoluto – Página 4
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|x + 3| = 5"
        correctAnswer: "x = 2 ou x = -8"
  - pageNumber: 5
    title: Valor Absoluto – Página 5
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|3x - 1| = 8"
        correctAnswer: "x = 3 ou x = -7/3"
  - pageNumber: 6
    title: Valor Absoluto – Página 6
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|x - 5| = 3"
        correctAnswer: "x = 8 ou x = 2"
  - pageNumber: 7
    title: Valor Absoluto – Página 7
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|4x| = 12"
        correctAnswer: "x = 3 ou x = -3"
  - pageNumber: 8
    title: Valor Absoluto – Página 8
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|x + 1| = 6"
        correctAnswer: "x = 5 ou x = -7"
  - pageNumber: 9
    title: Valor Absoluto – Página 9
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|2x - 4| = 10"
        correctAnswer: "x = 7 ou x = -3"
  - pageNumber: 10
    title: Valor Absoluto – Página 10
    description: Resolva equações com valor absoluto.
    exercises:
      - type: absolute_value
        question: "|x - 1| = 9"
        correctAnswer: "x = 10 ou x = -8"
