        objectives: [math.linear_equations]
      - type: absolute_value
        question: "|x + -4| = 8"
        correctAnswer: "-4"
        rationale: "Módulo é sempre positivo ou zero."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: absolute_value
        question: "|x + 6| = 10"
        correctAnswer: "4"
        rationale: "Módulo é sempre positivo ou zero."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: absolute_value
        question: "|x + 5| = 3"
        correctAnswer: "-8"
        rationale: "Ex.: 2x + 3 = 11 → 2x = 8 → x = 4."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: absolute_value
        question: "|x + 6| = 1"
        correctAnswer: "-7"
        rationale: "Eliminação: some equações para cancelar uma variável."
        difficulty: 2
        objectives: [math.linear_equations]
