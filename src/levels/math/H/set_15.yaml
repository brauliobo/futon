  - pageNumber: 1
    title: Equações com Valor Absoluto — Conjunto 15 – Página 1
    description: Problemas de álgebra linear.
    exercises:
      - type: absolute_value
        question: "|x + -5| = 5"
        correctAnswer: "0"
        rationale: "Módulo é sempre positivo ou zero."
