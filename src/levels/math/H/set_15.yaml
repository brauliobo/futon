title: Equações com Valor Absoluto — Conjunto 15
level: H
example: "Resolva equações com valor absoluto. Ex.: |x - 3| = 5 → x = 8 ou x = -2"
subject: math
pages:
  - pageNumber: 1
    title: Equações com Valor Absoluto — Conjunto 15 – Página 1
    description: Resolva equações com valor absoluto.
    exercises:
      - &a1
        type: absolute_value
        question: "|x| = 7"
        correctAnswer: x = 7 ou x = -7
      - &a2
        type: absolute_value
        question: "|x - 2| = 4"
        correctAnswer: x = 6 ou x = -2
      - &a3
        type: absolute_value
        question: "|2x| = 8"
        correctAnswer: x = 4 ou x = -4
      - &a4
        type: absolute_value
        question: "|x + 3| = 5"
        correctAnswer: x = 2 ou x = -8
      - &a5
        type: absolute_value
        question: "|3x - 1| = 8"
        correctAnswer: x = 3 ou x = -7/3
      - &a6
        type: absolute_value
        question: "|x - 5| = 3"
        correctAnswer: x = 8 ou x = 2
      - &a7
        type: absolute_value
        question: "|4x| = 12"
        correctAnswer: x = 3 ou x = -3
      - &a8
        type: absolute_value
        question: "|x + 1| = 6"
        correctAnswer: x = 5 ou x = -7
      - &a9
        type: absolute_value
        question: "|2x - 4| = 10"
        correctAnswer: x = 7 ou x = -3
      - &a10
        type: absolute_value
        question: "|x - 1| = 9"
        correctAnswer: x = 10 ou x = -8
