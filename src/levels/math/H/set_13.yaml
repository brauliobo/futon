title: Problemas de Aplicação Linear — Conjunto 13
level: H
example: "Resolva problemas aplicados. Ex.: Um número mais 5 é 12. Qual é o
  número? → x = 7"
subject: math
pages:
  - pageNumber: 1
    title: Aplicação Linear – Página 1
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: Um número multiplicado por 3 mais 7 é igual a 22. Qual é o número?
        correctAnswer: "5"
  - pageNumber: 2
    title: Aplicação Linear – Página 2
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: A soma de dois números consecutivos é 17. Qual é o menor número?
        correctAnswer: "8"
  - pageNumber: 3
    title: Aplicação Linear – Página 3
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: O perímetro de um retângulo é 24 cm. Se o comprimento é 8 cm, qual é a
          largura?
        correctAnswer: "4"
  - pageNumber: 4
    title: Aplicação Linear – Página 4
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: Maria tem 3 vezes mais moedas que João. Juntos têm 20 moedas. Quantas
          moedas João tem?
        correctAnswer: "5"
  - pageNumber: 5
    title: Aplicação Linear – Página 5
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: A idade de Ana é o dobro da idade de Bruno menos 4. Se Ana tem 14
          anos, quantos anos Bruno tem?
        correctAnswer: "9"
  - pageNumber: 6
    title: Aplicação Linear – Página 6
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: Um ingresso custa R$ 15. Com desconto de R$ 3, Pedro pagou R$ 45.
          Quantos ingressos ele comprou?
        correctAnswer: "4"
  - pageNumber: 7
    title: Aplicação Linear – Página 7
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: A diferença entre dois números é 12. Se o maior é 25, qual é o menor?
        correctAnswer: "13"
  - pageNumber: 8
    title: Aplicação Linear – Página 8
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: Carlos tem R$ 50. Após comprar um livro, ficou com R$ 32. Quanto
          custou o livro?
        correctAnswer: "18"
  - pageNumber: 9
    title: Aplicação Linear – Página 9
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: Em uma turma, há 4 meninas a mais que meninos. Se há 16 meninas,
          quantos meninos há?
        correctAnswer: "12"
  - pageNumber: 10
    title: Aplicação Linear – Página 10
    description: Resolva problemas de aplicação com equações lineares.
    exercises:
      - type: word_problem
        question: Um taxi cobra R$ 5 fixo mais R$ 2 por km. Se a corrida custou R$ 19,
          quantos km foram percorridos?
        correctAnswer: "7"
target: 10
