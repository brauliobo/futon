  - pageNumber: 1
    title: Equações com Radicais Simples — Conjunto 12 – Página 1
    description: Resolva equações com radicais simples.
    exercises:
      - &a1
        type: radical_equation
        question: √x = 5
        correctAnswer: "25"
      - &a2
        type: radical_equation
        question: √x + 3 = 7
        correctAnswer: "16"
      - &a3
        type: radical_equation
        question: √(2x) = 6
        correctAnswer: "18"
