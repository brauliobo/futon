        type: radical_equation
        question: √x + 1 = 4
        correctAnswer: "9"
      - &a7
        type: radical_equation
        question: √(4x) = 8
        correctAnswer: "16"
      - &a8
        type: radical_equation
        question: √x - 4 = 2
        correctAnswer: "36"
      - &a9
        type: radical_equation
        question: √(5x) = 10
        correctAnswer: "20"
      - &a10
        type: radical_equation
        question: √x + 5 = 8
        correctAnswer: "9"
