title: Equações com Múltiplas Etapas — Conjunto 9
level: H
example: Resolva equações com múltiplas etapas.
subject: math
difficulty: 3
objectives:
  - math.linear_equations
authorNotes: "Equações de múltiplas etapas. Simplifique cada lado antes de isolar x."
inputType: number
pages:
  - pageNumber: 1
    title: Equações com Múltiplas Etapas — Conjunto 9 – Página 1
    description: Resolva equações com múltiplas etapas.
    exercises:
      - type: linear_equation
        question: -10x + -15 = -15
        correctAnswer: "0"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -5(x + -10) = 0
        correctAnswer: "10"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -10x + -14 = 6
        correctAnswer: "-2"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -5(x + -9) = -5
        correctAnswer: "10"
        rationale: "Isole a incógnita: mesma operação dos dois lados."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -10x + -16 = 14
        correctAnswer: "-3"
        rationale: "Equação linear: reúna termos em x de um lado, constantes do outro."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -10x + -18 = 22
        correctAnswer: "-4"
        rationale: "Sistema 2×2: substituição, adição ou comparação."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -10x + -14 = 26
        correctAnswer: "-4"
        rationale: "Multiplique equação inteira por escalar para eliminar frações."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -10x + -17 = -7
        correctAnswer: "-1"
        rationale: "Verifique a solução substituindo no original."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -10x + -17 = 3
        correctAnswer: "-2"
        rationale: "Ao dividir, cuidado com sinal e com zero no denominador."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -5(x + -4) = -5
        correctAnswer: "5"
        rationale: "Ex.: 2x + 3 = 11 → 2x = 8 → x = 4."
        difficulty: 2
        objectives: [math.linear_equations]
