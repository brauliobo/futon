pages:
  - pageNumber: 1
    title: Equações com Parênteses — Conjunto 3 – Página 1
    description: Resolva equações com parênteses.
    exercises:
      - type: linear_equation
        question: -1(x + -9) = -10
        correctAnswer: "19"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: 1(x + 1) = 0
        correctAnswer: "-1"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -1(x + 3) = 9
        correctAnswer: "-12"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -5(x + -8) = 5
        correctAnswer: "7"
        rationale: "Isole a incógnita: mesma operação dos dois lados."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: -1(x + 9) = -11
        correctAnswer: "2"
        rationale: "Equação linear: reúna termos em x de um lado, constantes do outro."
        difficulty: 2
        objectives: [math.linear_equations]
      - type: linear_equation
        question: 1(x + -8) = 10
        correctAnswer: "18"
        rationale: "Sistema 2×2: substituição, adição ou comparação."
