      - type: sequence
        question: PG {1,0.5,0.25,...} — q = ?
        correctAnswer: 0.5
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 3
        objectives: [series.geometric]
      - type: sequence
        question: PG {5,-10,20,-40,...} — q = ?
        correctAnswer: -2
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 3
        objectives: [series.geometric]
      - type: sequence
        question: PG com a₁=4 e a₂=12, q = ?
        correctAnswer: 3
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 3
        objectives: [series.geometric]
      - type: sequence
        question: "PG com q=1 é: (constante/crescente)"
        correctAnswer: constante
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 3
        objectives: [series.geometric]
  - pageNumber: 3
