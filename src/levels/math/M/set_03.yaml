title: Fórmulas de Arco Duplo
level: M
subject: math
inputType: number
difficulty: 3
objectives:
  - trig.identities.double_angle
example: sen(2x) = 2 sen(x) cos(x)
pages:
  - pageNumber: 1
    title: Seno do Arco Duplo
    description: sen(2x) = 2 sen(x) cos(x).
    exercises:
      - type: trigonometry
        question: sen(2x) = ?
        correctAnswer: 2sen(x)cos(x)
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: sen(60°) = 2·sen(30°)·cos(30°) = ?
        correctAnswer: √3/2
        rationale: "Ângulo notável: sen 60° = √3/2."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: sen(90°) = 2·sen(45°)·cos(45°) = ?
        correctAnswer: 1
        rationale: "Valor notável: sen 90° = 1 (topo do ciclo)."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se sen(x) = 3/5 e cos(x) = 4/5, sen(2x) = ?
        correctAnswer: 24/25
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se sen(x) = 1 e cos(x) = 0, sen(2x) = ?
        correctAnswer: 0
        rationale: "cos x = 0 ⇒ x = π/2 + kπ, k ∈ ℤ."
        difficulty: 2
        objectives: [trig.identities.double_angle]
  - pageNumber: 2
    title: Cosseno do Arco Duplo (1ª forma)
    description: cos(2x) = cos²(x) - sen²(x).
    exercises:
      - type: trigonometry
        question: "cos(2x) = cos²(x) - ? "
        correctAnswer: sen²(x)
        rationale: "Arco duplo: cos(2x) = cos²x − sen²x."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: cos(60°) = cos²(30°) - sen²(30°) = ?
        correctAnswer: 1/2
        rationale: "Ângulo notável: cos 60° = 1/2."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: cos(90°) = cos²(45°) - sen²(45°) = ?
        correctAnswer: 0
        rationale: "Valor notável: cos 90° = 0 (topo do ciclo)."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se cos(x)=4/5, sen(x)=3/5, cos(2x) = ?
        correctAnswer: 7/25
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se cos(x)=1 e sen(x)=0, cos(2x) = ?
        correctAnswer: 1
        rationale: "sen x = 0 ⇒ x = kπ, k ∈ ℤ."
        difficulty: 2
        objectives: [trig.identities.double_angle]
  - pageNumber: 3
    title: Cosseno do Arco Duplo (2ª forma)
    description: cos(2x) = 2cos²(x) - 1.
    exercises:
      - type: trigonometry
        question: cos(2x) = 2cos²(x) - ?
        correctAnswer: 1
        rationale: "Arco duplo: cos(2x) = 2cos²x − 1."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se cos(x)=1/2, cos(2x) = ?
        correctAnswer: -1/2
        rationale: "cos x = 1 ⇒ x = 2kπ."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se cos(x)=√3/2, cos(2x) = ?
        correctAnswer: 1/2
        rationale: "Arco duplo: cos(2x) = 2cos²x − 1."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se cos(x)=√2/2, cos(2x) = ?
        correctAnswer: 0
        rationale: "Arco duplo: cos(2x) = 2cos²x − 1."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se cos(x)=0, cos(2x) = ?
        correctAnswer: -1
        rationale: "cos x = 0 ⇒ x = π/2 + kπ, k ∈ ℤ."
        difficulty: 2
        objectives: [trig.identities.double_angle]
  - pageNumber: 4
    title: Cosseno do Arco Duplo (3ª forma)
    description: cos(2x) = 1 - 2sen²(x).
    exercises:
      - type: trigonometry
        question: cos(2x) = 1 - ?·sen²(x)
        correctAnswer: 2
        rationale: "Arco duplo: cos(2x) = 1 − 2 sen²x."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se sen(x)=1/2, cos(2x) = ?
        correctAnswer: 1/2
        rationale: "sen x = 1 ⇒ x = π/2 + 2kπ."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se sen(x)=√2/2, cos(2x) = ?
        correctAnswer: 0
        rationale: "Arco duplo: cos(2x) = 1 − 2sen²x."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se sen(x)=1, cos(2x) = ?
        correctAnswer: -1
        rationale: "sen x = 1 ⇒ x = π/2 + 2kπ."
        difficulty: 2
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se sen(x)=0, cos(2x) = ?
        correctAnswer: 1
        rationale: "sen x = 0 ⇒ x = kπ, k ∈ ℤ."
        difficulty: 2
        objectives: [trig.identities.double_angle]
  - pageNumber: 5
    title: Tangente do Arco Duplo
    description: tan(2x) = 2tan(x) / (1 - tan²(x)).
    exercises:
      - type: trigonometry
        question: tan(2x) numerador = ?
        correctAnswer: 2tan(x)
        rationale: "Arco duplo: tan(2x) = 2 tan x / (1 − tan²x)."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: tan(2x) denominador = ?
        correctAnswer: 1-tan²(x)
        rationale: "Arco duplo: tan(2x) = 2 tan x / (1 − tan²x)."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se tan(x)=1, tan(2x) denominador = ?
        correctAnswer: 0
        rationale: "tan x = 1 ⇒ x = π/4 + kπ."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se tan(x)=1/√3, tan(2x) = ?
        correctAnswer: √3
        rationale: "tan x = 1 ⇒ x = π/4 + kπ."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se tan(x)=√3, tan(2x) numerador = ?
        correctAnswer: 2√3
        rationale: "Arco duplo: tan(2x) = 2 tan x / (1 − tan²x)."
        difficulty: 3
        objectives: [trig.identities.double_angle]
  - pageNumber: 6
    title: Aplicações em Valores Exatos
    description: Derive valores conhecidos.
    exercises:
      - type: trigonometry
        question: sen(120°) via sen(2·60°) = ?
        correctAnswer: √3/2
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: cos(120°) via cos(2·60°) = ?
        correctAnswer: -1/2
        rationale: "Arco duplo: cos(2x) = cos²x − sen²x = 1 − 2 sen²x."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: sen(180°) via sen(2·90°) = ?
        correctAnswer: 0
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: cos(180°) via cos(2·90°) = ?
        correctAnswer: -1
        rationale: "Arco duplo: cos(2x) = cos²x − sen²x = 1 − 2 sen²x."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: sen(240°) via sen(2·120°) = ?
        correctAnswer: -√3/2
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 3
        objectives: [trig.identities.double_angle]
  - pageNumber: 7
    title: Verdadeiro ou Falso
    description: Julgue as identidades.
    exercises:
      - type: trigonometry
        question: sen(2x) = 2sen(x) (V/F)?
        correctAnswer: F
        rationale: "Falso: sen(2x) = 2 sen x cos x (não 2 sen x)."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: cos(2x) = 2cos(x) (V/F)?
        correctAnswer: F
        rationale: "Falso: cos(2x) = cos²x − sen²x (não 2 cos x)."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: tan(2x) = 2tan(x) (V/F)?
        correctAnswer: F
        rationale: "Falso: tan(2x) = 2 tan x / (1 − tan²x)."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: sen(2x) = 2sen(x)cos(x) (V/F)?
        correctAnswer: V
        rationale: "Verdadeiro: sen(2x) = 2 sen x cos x."
        difficulty: 3
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: cos(2x) = 1 - 2sen²(x) (V/F)?
        correctAnswer: V
        rationale: "Verdadeiro: cos(2x) = 1 − 2 sen²x."
        difficulty: 3
        objectives: [trig.identities.double_angle]
  - pageNumber: 8
    title: Dado sen(x) ou cos(x), calcule
    description: Use as três formas do cos(2x).
    exercises:
      - type: trigonometry
        question: Se sen(x) = 0,6 (1º quadrante), sen(2x) = ?
        correctAnswer: 0.96
        rationale: "Use sen²+cos²=1; ajuste sinal conforme o quadrante."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se cos(x) = 0,6 (1º quadrante), cos(2x) = ?
        correctAnswer: -0.28
        rationale: "Use sen²+cos²=1; ajuste sinal conforme o quadrante."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se tan(x) = 1/2, tan(2x) = ?
        correctAnswer: 4/3
        rationale: "tan x = 1 ⇒ x = π/4 + kπ."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se tan(x) = 3, tan(2x) numerador = ?
        correctAnswer: 6
        rationale: "Arco duplo: tan(2x) = 2 tan x / (1 − tan²x)."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: Se tan(x) = 3, tan(2x) denominador = ?
        correctAnswer: -8
        rationale: "Arco duplo: tan(2x) = 2 tan x / (1 − tan²x)."
        difficulty: 4
        objectives: [trig.identities.double_angle]
  - pageNumber: 9
    title: Reduções de Potências
    description: cos²(x) = (1+cos(2x))/2; sen²(x) = (1-cos(2x))/2.
    exercises:
      - type: trigonometry
        question: "cos²(x) em função de cos(2x): (1+cos(2x))/? "
        correctAnswer: 2
        rationale: "Rebaixamento: cos²x = (1 + cos(2x))/2."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: "sen²(x) em função de cos(2x): (1-cos(2x))/? "
        correctAnswer: 2
        rationale: "Rebaixamento: sen²x = (1 − cos(2x))/2."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: cos²(45°) via cos(90°) = ?
        correctAnswer: 1/2
        rationale: "arccos dá ângulo em [0, π] com cos igual ao valor dado."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: sen²(60°) via cos(120°) = ?
        correctAnswer: 3/4
        rationale: "arccos dá ângulo em [0, π] com cos igual ao valor dado."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: cos²(30°) via cos(60°) = ?
        correctAnswer: 3/4
        rationale: "arccos dá ângulo em [0, π] com cos igual ao valor dado."
        difficulty: 4
        objectives: [trig.identities.double_angle]
  - pageNumber: 10
    title: Revisão Integrada
    description: Misture as fórmulas.
    exercises:
      - type: trigonometry
        question: "sen(2x) + cos(2x) quando x=0: ?"
        correctAnswer: 1
        rationale: "sen 0 + cos 0 = 0 + 1 = 1."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: sen(2·45°) + cos(2·45°) = ?
        correctAnswer: 1
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: cos(2x) - sen²(x) + cos²(x) = ? (em função de cos 2x)
        correctAnswer: 2cos(2x)
        rationale: "Identidade fundamental: sen²x + cos²x = 1."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: 1 + cos(2x) = ? (em função de cos²)
        correctAnswer: 2cos²(x)
        rationale: "1 + cos(2x) = 2 cos²x."
        difficulty: 4
        objectives: [trig.identities.double_angle]
      - type: trigonometry
        question: 1 - cos(2x) = ? (em função de sen²)
        correctAnswer: 2sen²(x)
        rationale: "1 − cos(2x) = 2 sen²x."
        difficulty: 4
        objectives: [trig.identities.double_angle]
target: 50
