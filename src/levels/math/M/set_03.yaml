title: Fórmulas de Arco Duplo
level: M
subject: math
inputType: number
difficulty: 4
objectives:
  - trig.identities.double_angle
example: sen(2x) = 2 sen(x) cos(x)
pages:
  - pageNumber: 1
    title: Seno do Arco Duplo
    description: sen(2x) = 2 sen(x) cos(x).
    exercises:
      - type: trigonometry
        question: sen(2x) = ?
        correctAnswer: 2sen(x)cos(x)
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: sen(60°) = 2·sen(30°)·cos(30°) = ?
        correctAnswer: √3/2
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: sen(90°) = 2·sen(45°)·cos(45°) = ?
        correctAnswer: 1
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: Se sen(x) = 3/5 e cos(x) = 4/5, sen(2x) = ?
        correctAnswer: 24/25
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: Se sen(x) = 1 e cos(x) = 0, sen(2x) = ?
        correctAnswer: 0
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
  - pageNumber: 2
    title: Cosseno do Arco Duplo (1ª forma)
    description: cos(2x) = cos²(x) - sen²(x).
    exercises:
      - type: trigonometry
        question: "cos(2x) = cos²(x) - ? "
        correctAnswer: sen²(x)
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: cos(60°) = cos²(30°) - sen²(30°) = ?
        correctAnswer: 1/2
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: cos(90°) = cos²(45°) - sen²(45°) = ?
        correctAnswer: 0
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: Se cos(x)=4/5, sen(x)=3/5, cos(2x) = ?
        correctAnswer: 7/25
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: Se cos(x)=1 e sen(x)=0, cos(2x) = ?
        correctAnswer: 1
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
  - pageNumber: 3
    title: Cosseno do Arco Duplo (2ª forma)
    description: cos(2x) = 2cos²(x) - 1.
    exercises:
      - type: trigonometry
        question: cos(2x) = 2cos²(x) - ?
        correctAnswer: 1
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: Se cos(x)=1/2, cos(2x) = ?
        correctAnswer: -1/2
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: Se cos(x)=√3/2, cos(2x) = ?
        correctAnswer: 1/2
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: Se cos(x)=√2/2, cos(2x) = ?
        correctAnswer: 0
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: Se cos(x)=0, cos(2x) = ?
        correctAnswer: -1
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
  - pageNumber: 4
    title: Cosseno do Arco Duplo (3ª forma)
    description: cos(2x) = 1 - 2sen²(x).
    exercises:
      - type: trigonometry
        question: cos(2x) = 1 - ?·sen²(x)
        correctAnswer: 2
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: Se sen(x)=1/2, cos(2x) = ?
        correctAnswer: 1/2
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: Se sen(x)=√2/2, cos(2x) = ?
        correctAnswer: 0
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: Se sen(x)=1, cos(2x) = ?
        correctAnswer: -1
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: Se sen(x)=0, cos(2x) = ?
        correctAnswer: 1
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
  - pageNumber: 5
    title: Tangente do Arco Duplo
    description: tan(2x) = 2tan(x) / (1 - tan²(x)).
    exercises:
      - type: trigonometry
        question: tan(2x) numerador = ?
        correctAnswer: 2tan(x)
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: tan(2x) denominador = ?
        correctAnswer: 1-tan²(x)
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: trigonometry
        question: Se tan(x)=1, tan(2x) denominador = ?
        correctAnswer: 0
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: Se tan(x)=1/√3, tan(2x) = ?
        correctAnswer: √3
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: Se tan(x)=√3, tan(2x) numerador = ?
        correctAnswer: 2√3
        rationale: "Domine valores exatos dos ângulos notáveis."
  - pageNumber: 6
    title: Aplicações em Valores Exatos
    description: Derive valores conhecidos.
    exercises:
      - type: trigonometry
        question: sen(120°) via sen(2·60°) = ?
        correctAnswer: √3/2
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: cos(120°) via cos(2·60°) = ?
        correctAnswer: -1/2
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: trigonometry
        question: sen(180°) via sen(2·90°) = ?
        correctAnswer: 0
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: cos(180°) via cos(2·90°) = ?
        correctAnswer: -1
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: sen(240°) via sen(2·120°) = ?
        correctAnswer: -√3/2
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
  - pageNumber: 7
    title: Verdadeiro ou Falso
    description: Julgue as identidades.
    exercises:
      - type: trigonometry
        question: sen(2x) = 2sen(x) (V/F)?
        correctAnswer: F
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: cos(2x) = 2cos(x) (V/F)?
        correctAnswer: F
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: tan(2x) = 2tan(x) (V/F)?
        correctAnswer: F
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: sen(2x) = 2sen(x)cos(x) (V/F)?
        correctAnswer: V
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: trigonometry
        question: cos(2x) = 1 - 2sen²(x) (V/F)?
        correctAnswer: V
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
  - pageNumber: 8
    title: Dado sen(x) ou cos(x), calcule
    description: Use as três formas do cos(2x).
    exercises:
      - type: trigonometry
        question: Se sen(x) = 0,6 (1º quadrante), sen(2x) = ?
        correctAnswer: 0.96
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: Se cos(x) = 0,6 (1º quadrante), cos(2x) = ?
        correctAnswer: -0.28
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: Se tan(x) = 1/2, tan(2x) = ?
        correctAnswer: 4/3
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: Se tan(x) = 3, tan(2x) numerador = ?
        correctAnswer: 6
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: trigonometry
        question: Se tan(x) = 3, tan(2x) denominador = ?
        correctAnswer: -8
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
  - pageNumber: 9
    title: Reduções de Potências
    description: cos²(x) = (1+cos(2x))/2; sen²(x) = (1-cos(2x))/2.
    exercises:
      - type: trigonometry
        question: "cos²(x) em função de cos(2x): (1+cos(2x))/? "
        correctAnswer: 2
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: "sen²(x) em função de cos(2x): (1-cos(2x))/? "
        correctAnswer: 2
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: cos²(45°) via cos(90°) = ?
        correctAnswer: 1/2
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: sen²(60°) via cos(120°) = ?
        correctAnswer: 3/4
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: cos²(30°) via cos(60°) = ?
        correctAnswer: 3/4
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
  - pageNumber: 10
    title: Revisão Integrada
    description: Misture as fórmulas.
    exercises:
      - type: trigonometry
        question: "sen(2x) + cos(2x) quando x=0: ?"
        correctAnswer: 1
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: trigonometry
        question: sen(2·45°) + cos(2·45°) = ?
        correctAnswer: 1
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: cos(2x) - sen²(x) + cos²(x) = ? (em função de cos 2x)
        correctAnswer: 2cos(2x)
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: 1 + cos(2x) = ? (em função de cos²)
        correctAnswer: 2cos²(x)
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: 1 - cos(2x) = ? (em função de sen²)
        correctAnswer: 2sen²(x)
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
target: 50
