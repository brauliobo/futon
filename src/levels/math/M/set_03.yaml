title: Trigonometria Avançada e Séries — Conjunto 3
level: M
example: "Fórmulas de meio ângulo. Ex.: sin(x/2) = ±√((1-cos(x))/2)"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Trigonometria Avançada e Séries — Conjunto 3 – Página 1
    description: Fórmulas de meio ângulo.
    exercises:
      - &a1
        type: trigonometry
        question: Se cos(x) = 1/2, calcule sin(x/2) usando a fórmula de meio ângulo =
        correctAnswer: √((1-1/2)/2) = √(1/4) = 1/2
      - &a2
        type: trigonometry
        question: Calcule cos(15°) usando cos(30°/2) =
        correctAnswer: √((1+√3/2)/2)
      - &a3
        type: trigonometry
        question: Se sin(x) = 3/5, calcule cos(x/2) =
        correctAnswer: 2√5/5
      - &a4
        type: trigonometry
        question: Calcule sin(15°) usando sin(30°/2) =
        correctAnswer: √((1-√3/2)/2)
      - &a5
        type: trigonometry
        question: Se cos(x) = -1/3, calcule sin(x/2) =
        correctAnswer: √(2/3)
      - &a6
        type: trigonometry
        question: Calcule tan(22.5°) usando tan(45°/2) =
        correctAnswer: √2 - 1
      - &a7
        type: trigonometry
        question: Se tan(x) = 4/3, calcule tan(x/2) =
        correctAnswer: 1/2
      - &a8
        type: trigonometry
        question: "Simplifique: (1-cos(x))/sin(x) em termos de tan(x/2) ="
        correctAnswer: tan(x/2)
      - &a9
        type: trigonometry
        question: Se cos(x) = 0, calcule cos(x/2) =
        correctAnswer: √2/2
      - &a10
        type: trigonometry
        question: Calcule cos(67.5°) usando cos(135°/2) =
        correctAnswer: √((1-√2/2)/2)
