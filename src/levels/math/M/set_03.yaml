title: Trigonometria Avançada e Séries — Conjunto 3
level: M
example: "Fórmulas de meio ângulo. Ex.: sin(x/2) = ±√((1-cos(x))/2)"
subject: math
pages:
  - pageNumber: 1
    title: Meio Ângulo – Página 1
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Se cos(x) = 1/2, calcule sin(x/2) usando a fórmula de meio ângulo ="
        correctAnswer: "√((1-1/2)/2) = √(1/4) = 1/2"
  - pageNumber: 2
    title: Meio Ângulo – Página 2
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Calcule cos(15°) usando cos(30°/2) ="
        correctAnswer: "√((1+√3/2)/2)"
  - pageNumber: 3
    title: Meio Ângulo – Página 3
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Se sin(x) = 3/5, calcule cos(x/2) ="
        correctAnswer: "2√5/5"
  - pageNumber: 4
    title: Meio Ângulo – Página 4
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Calcule sin(15°) usando sin(30°/2) ="
        correctAnswer: "√((1-√3/2)/2)"
  - pageNumber: 5
    title: Meio Ângulo – Página 5
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Se cos(x) = -1/3, calcule sin(x/2) ="
        correctAnswer: "√(2/3)"
  - pageNumber: 6
    title: Meio Ângulo – Página 6
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Calcule tan(22.5°) usando tan(45°/2) ="
        correctAnswer: "√2 - 1"
  - pageNumber: 7
    title: Meio Ângulo – Página 7
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Se tan(x) = 4/3, calcule tan(x/2) ="
        correctAnswer: "1/2"
  - pageNumber: 8
    title: Meio Ângulo – Página 8
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Simplifique: (1-cos(x))/sin(x) em termos de tan(x/2) ="
        correctAnswer: "tan(x/2)"
  - pageNumber: 9
    title: Meio Ângulo – Página 9
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Se cos(x) = 0, calcule cos(x/2) ="
        correctAnswer: "√2/2"
  - pageNumber: 10
    title: Meio Ângulo – Página 10
    description: Fórmulas de meio ângulo.
    exercises:
      - type: trigonometry
        question: "Calcule cos(67.5°) usando cos(135°/2) ="
        correctAnswer: "√((1-√2/2)/2)"
