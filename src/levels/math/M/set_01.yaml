          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cot(x) = 1, csc²(x) = ?
        correctAnswer: 2
        rationale: csc²x = 1 + cot²x (identidade derivada).
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
