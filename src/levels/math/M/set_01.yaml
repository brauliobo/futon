  - pageNumber: 3
    title: Reescritas em cos — prática 1
    description: Expressar em termos de cos(x).
    exercises:
      - type: trigonometry
        question: sen²(x) = 1 - ?
        correctAnswer: cos²(x)
        rationale: "De sen²+cos²=1: sen²x = 1 − cos²x."
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cos(x) = 3/5, sen²(x) = ?
        correctAnswer: 16/25
        rationale: sen²x = 1 − cos²x (identidade fundamental rearranjada).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cos(x) = 1/2 (x agudo), sen(x) = ?
        correctAnswer: √3/2
        rationale: sen x = √(1 − cos²x) — identidade fundamental.
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cos(x) = 4/5 (x agudo), tan(x) = ?
        correctAnswer: 3/4
        rationale: tan x = sen x / cos x; use sen²+cos²=1 para obter sen x.
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cos(x) = 0.6 (x agudo), sen(x) = ?
        correctAnswer: 0.8
        rationale: sen x = √(1 − cos²x) — identidade fundamental.
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
