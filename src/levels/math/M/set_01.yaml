title: Identidades Pitagóricas
level: M
subject: math
authorNotes: Identidades Pitagóricas. Foque no conceito central do conjunto e
  nos erros comuns.
inputType: text
difficulty: 3
objectives:
  - trig.identities.pythagorean
example: sen²(x) + cos²(x) = 1
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Identidades Básicas
    description: As três identidades pitagóricas e suas reescritas.
    exercises:
      - type: trigonometry
        question: sen²(x) + cos²(x) = ?
        correctAnswer: 1
        rationale: "Identidade pitagórica fundamental: sen²x + cos²x = 1."
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: tan²(x) + 1 = ?
        correctAnswer: sec²(x)
        rationale: tan²x + 1 = sec²x (derivada de sen²+cos²=1 dividindo por cos²).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: 1 + cot²(x) = ?
        correctAnswer: csc²(x)
        rationale: 1 + cot²x = csc²x (dividindo sen²+cos²=1 por sen²).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: sec²(x) - tan²(x) = ?
        correctAnswer: 1
        rationale: sec²x - tan²x = 1 (reorganização de tan²x + 1 = sec²x).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: csc²(x) - cot²(x) = ?
        correctAnswer: 1
        rationale: csc²x - cot²x = 1 (reorganização de 1 + cot²x = csc²x).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: 1 - sen²(x) = ?
        correctAnswer: cos²(x)
        rationale: "Rearranjo de sen²+cos²=1: 1 − sen²x = cos²x."
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
  - pageNumber: 2
    title: Reescritas em cos
    description: Expressar em termos de cos(x).
    exercises:
      - type: trigonometry
        question: sen²(x) = 1 - ?
        correctAnswer: cos²(x)
        rationale: "De sen²+cos²=1: sen²x = 1 − cos²x."
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cos(x) = 3/5, sen²(x) = ?
        correctAnswer: 16/25
        rationale: sen²x = 1 − cos²x (identidade fundamental rearranjada).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cos(x) = 1/2 (x agudo), sen(x) = ?
        correctAnswer: √3/2
        rationale: sen x = √(1 − cos²x) — identidade fundamental.
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cos(x) = 4/5 (x agudo), tan(x) = ?
        correctAnswer: 3/4
        rationale: tan x = sen x / cos x; use sen²+cos²=1 para obter sen x.
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cos(x) = 0.6 (x agudo), sen(x) = ?
        correctAnswer: 0.8
        rationale: sen x = √(1 − cos²x) — identidade fundamental.
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
  - pageNumber: 3
    title: Reescritas em sen
    description: Expressar em termos de sen(x).
    exercises:
      - type: trigonometry
        question: cos²(x) = 1 - ?
        correctAnswer: sen²(x)
        rationale: "De sen²+cos²=1: cos²x = 1 − sen²x."
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se sen(x) = 3/5 (x agudo), cos(x) = ?
        correctAnswer: 4/5
        rationale: cos x = √(1 − sen²x) — identidade fundamental.
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se sen(x) = 1, cos(x) = ?
        correctAnswer: 0
        rationale: cos x = √(1 − sen²x) — identidade fundamental.
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se sen(x) = √2/2, cos²(x) = ?
        correctAnswer: 1/2
        rationale: cos²x = 1 − sen²x (identidade fundamental rearranjada).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se sen(x) = 5/13 (x agudo), tan(x) = ?
        correctAnswer: 5/12
        rationale: tan x = sen x / cos x; obtenha cos x por sen²+cos²=1.
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
  - pageNumber: 4
    title: tan e sec
    description: Relação entre tan e sec.
    exercises:
      - type: trigonometry
        question: sec²(x) = 1 + ?
        correctAnswer: tan²(x)
        rationale: "De 1 + tan²x = sec²x: sec²x − 1 = tan²x."
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se tan(x) = 1, sec²(x) = ?
        correctAnswer: 2
        rationale: sec²x = 1 + tan²x (identidade derivada).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se tan(x) = √3 (x agudo), sec(x) = ?
        correctAnswer: 2
        rationale: sec x = √(1 + tan²x) (identidade derivada).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se sec(x) = 2 (x agudo), tan(x) = ?
        correctAnswer: √3
        rationale: tan x = √(sec²x − 1) (identidade derivada).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se tan(x) = 3/4 (x agudo), sec(x) = ?
        correctAnswer: 5/4
        rationale: sec x = √(1 + tan²x) (identidade derivada).
        difficulty: 2
        objectives:
          - trig.identities.pythagorean
  - pageNumber: 5
    title: cot e csc
    description: Relação entre cot e csc.
    exercises:
      - type: trigonometry
        question: csc²(x) = 1 + ?
        correctAnswer: cot²(x)
        rationale: "De 1 + cot²x = csc²x: csc²x − 1 = cot²x."
