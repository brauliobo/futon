        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se csc(x) = 2 (x agudo), cot(x) = ?
        correctAnswer: √3
        rationale: cot x = √(csc²x − 1) (identidade derivada).
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cot(x) = 4/3 (x agudo), csc(x) = ?
        correctAnswer: 5/3
        rationale: csc x = √(1 + cot²x) (identidade derivada).
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
  - pageNumber: 6
    title: Simplificações
    description: Usar identidades para reduzir expressões.
    exercises:
      - type: trigonometry
        question: sen²(x) + cos²(x) + 1 = ?
        correctAnswer: 2
        rationale: "Identidade pitagórica fundamental: sen²x + cos²x = 1."
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: sec(x) · cos(x) = ?
        correctAnswer: 1
        rationale: "Recíproca: sec x = 1/cos x, então sec x · cos x = 1."
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: csc(x) · sen(x) = ?
        correctAnswer: 1
        rationale: "Recíproca: csc x = 1/sen x, então csc x · sen x = 1."
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: tan(x) · cos(x) = ?
        correctAnswer: sen(x)
        rationale: "Quociente: tan x = sen x / cos x, então tan x · cos x = sen x."
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: cot(x) · sen(x) = ?
        correctAnswer: cos(x)
        rationale: "Quociente: cot x = cos x / sen x, então cot x · sen x = cos x."
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
  - pageNumber: 7
    title: Valores Numéricos
    description: Aplique as identidades em valores específicos.
    exercises:
      - type: trigonometry
        question: sen²(30°) + cos²(30°) = ?
        correctAnswer: 1
        rationale: "Identidade fundamental: sen²x + cos²x = 1."
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: tan²(45°) + 1 = ?
        correctAnswer: 2
        rationale: 1 + tan²x = sec²x — derivada da identidade fundamental.
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: sec²(60°) - tan²(60°) = ?
        correctAnswer: 1
        rationale: "De 1 + tan²x = sec²x: sec²x − tan²x = 1."
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: csc²(90°) = ?
        correctAnswer: 1
        rationale: csc x = 1/sen x, logo csc²(90°) = 1/sen²(90°) = 1.
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: 1 - sen²(45°) = ?
        correctAnswer: 1/2
        rationale: "Rearranjo de sen²+cos²=1: 1 − sen²x = cos²x."
        difficulty: 3
        objectives:
          - trig.identities.pythagorean
  - pageNumber: 8
    title: Sinais por Quadrante
    description: Identidades valem sempre; sinais dependem do quadrante.
    exercises:
      - type: trigonometry
        question: No 2º quadrante, sen é (positivo/negativo)?
        correctAnswer: positivo
        rationale: "Sinais por quadrante: seguem do ciclo trigonométrico (CAST)."
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: No 3º quadrante, cos é (positivo/negativo)?
        correctAnswer: negativo
        rationale: "Sinais por quadrante: seguem do ciclo trigonométrico (CAST)."
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: No 4º quadrante, tan é (positivo/negativo)?
        correctAnswer: negativo
        rationale: "Sinais por quadrante: seguem do ciclo trigonométrico (CAST)."
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se sen(x) < 0 e cos(x) > 0, x está no quadrante?
        correctAnswer: 4
        rationale: "Combine sinais: sen e cos determinam o quadrante."
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se tan(x) > 0 e sen(x) < 0, x está no quadrante?
        correctAnswer: 3
        rationale: "Combine sinais: sen e cos determinam o quadrante."
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
  - pageNumber: 9
    title: Aplicação por Quadrante
    description: Dado um valor, calcule as outras funções.
    exercises:
      - type: trigonometry
        question: Se sen(x) = 5/13 (1º quadrante), cos(x) = ?
        correctAnswer: 12/13
        rationale: cos x = √(1 − sen²x) — identidade fundamental.
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se cos(x) = -3/5 (2º quadrante), sen(x) = ?
        correctAnswer: 4/5
        rationale: sen x = √(1 − cos²x) — identidade fundamental.
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se tan(x) = 3/4 (3º quadrante), sen(x) = ?
        correctAnswer: -3/5
        rationale: Use sen²+cos²=1; ajuste sinal conforme o quadrante.
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se tan(x) = -5/12 (4º quadrante), cos(x) = ?
        correctAnswer: 12/13
        rationale: Use sen²+cos²=1; ajuste sinal conforme o quadrante.
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: Se sen(x) = -√3/2 (3º quadrante), cos(x) = ?
        correctAnswer: -1/2
        rationale: cos x = √(1 − sen²x) — identidade fundamental.
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
  - pageNumber: 10
    title: Revisão Integrada
    description: Combine identidades.
    exercises:
      - type: trigonometry
        question: sen²(x)·sec²(x) = ?
        correctAnswer: tan²(x)
        rationale: sen²·sec² = sen²/cos² = tan².
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: cos²(x)·csc²(x) = ?
        correctAnswer: cot²(x)
        rationale: cos²·csc² = cos²/sen² = cot².
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: tan(x)·cot(x) = ?
        correctAnswer: 1
        rationale: "Recíprocas: cot x = 1/tan x, então tan x · cot x = 1."
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: sec(x)·cos(x) - sen(x)·csc(x) = ?
        correctAnswer: 0
        rationale: "Recíproca: sec x = 1/cos x, então sec x · cos x = 1."
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
      - type: trigonometry
        question: sen²(x) + cos²(x) + tan²(x) - sec²(x) = ?
        correctAnswer: 0
        rationale: "Identidade pitagórica fundamental: sen²x + cos²x = 1."
        difficulty: 4
        objectives:
          - trig.identities.pythagorean
