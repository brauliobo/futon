title: Identidades Pitagóricas
level: M
subject: math
inputType: number
difficulty: 3
objectives:
  - trig.identities.pythagorean
example: sen²(x) + cos²(x) = 1
pages:
  - pageNumber: 1
    title: Identidades Básicas
    description: As três identidades pitagóricas e suas reescritas.
    exercises:
      - type: trigonometry
        question: sen²(x) + cos²(x) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: tan²(x) + 1 = ?
        correctAnswer: sec²(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 1 + cot²(x) = ?
        correctAnswer: csc²(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sec²(x) - tan²(x) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: csc²(x) - cot²(x) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 1 - sen²(x) = ?
        correctAnswer: cos²(x)
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 2
    title: Reescritas em cos
    description: Expressar em termos de cos(x).
    exercises:
      - type: trigonometry
        question: sen²(x) = 1 - ?
        correctAnswer: cos²(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se cos(x) = 3/5, sen²(x) = ?
        correctAnswer: 16/25
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se cos(x) = 1/2 (x agudo), sen(x) = ?
        correctAnswer: √3/2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se cos(x) = 4/5 (x agudo), tan(x) = ?
        correctAnswer: 3/4
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se cos(x) = 0.6 (x agudo), sen(x) = ?
        correctAnswer: 0.8
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 3
    title: Reescritas em sen
    description: Expressar em termos de sen(x).
    exercises:
      - type: trigonometry
        question: cos²(x) = 1 - ?
        correctAnswer: sen²(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se sen(x) = 3/5 (x agudo), cos(x) = ?
        correctAnswer: 4/5
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se sen(x) = 1, cos(x) = ?
        correctAnswer: 0
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se sen(x) = √2/2, cos²(x) = ?
        correctAnswer: 1/2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se sen(x) = 5/13 (x agudo), tan(x) = ?
        correctAnswer: 5/12
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 4
    title: tan e sec
    description: Relação entre tan e sec.
    exercises:
      - type: trigonometry
        question: sec²(x) = 1 + ?
        correctAnswer: tan²(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se tan(x) = 1, sec²(x) = ?
        correctAnswer: 2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se tan(x) = √3 (x agudo), sec(x) = ?
        correctAnswer: 2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se sec(x) = 2 (x agudo), tan(x) = ?
        correctAnswer: √3
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se tan(x) = 3/4 (x agudo), sec(x) = ?
        correctAnswer: 5/4
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 5
    title: cot e csc
    description: Relação entre cot e csc.
    exercises:
      - type: trigonometry
        question: csc²(x) = 1 + ?
        correctAnswer: cot²(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se cot(x) = 1, csc²(x) = ?
        correctAnswer: 2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se cot(x) = √3 (x agudo), csc(x) = ?
        correctAnswer: 2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se csc(x) = 2 (x agudo), cot(x) = ?
        correctAnswer: √3
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se cot(x) = 4/3 (x agudo), csc(x) = ?
        correctAnswer: 5/3
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 6
    title: Simplificações
    description: Usar identidades para reduzir expressões.
    exercises:
      - type: trigonometry
        question: sen²(x) + cos²(x) + 1 = ?
        correctAnswer: 2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sec(x) · cos(x) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: csc(x) · sen(x) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: tan(x) · cos(x) = ?
        correctAnswer: sen(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: cot(x) · sen(x) = ?
        correctAnswer: cos(x)
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 7
    title: Valores Numéricos
    description: Aplique as identidades em valores específicos.
    exercises:
      - type: trigonometry
        question: sen²(30°) + cos²(30°) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: tan²(45°) + 1 = ?
        correctAnswer: 2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sec²(60°) - tan²(60°) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: csc²(90°) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 1 - sen²(45°) = ?
        correctAnswer: 1/2
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 8
    title: Sinais por Quadrante
    description: Identidades valem sempre; sinais dependem do quadrante.
    exercises:
      - type: trigonometry
        question: No 2º quadrante, sen é (positivo/negativo)?
        correctAnswer: positivo
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: No 3º quadrante, cos é (positivo/negativo)?
        correctAnswer: negativo
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: No 4º quadrante, tan é (positivo/negativo)?
        correctAnswer: negativo
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se sen(x) < 0 e cos(x) > 0, x está no quadrante?
        correctAnswer: 4
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se tan(x) > 0 e sen(x) < 0, x está no quadrante?
        correctAnswer: 3
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 9
    title: Aplicação por Quadrante
    description: Dado um valor, calcule as outras funções.
    exercises:
      - type: trigonometry
        question: Se sen(x) = 5/13 (1º quadrante), cos(x) = ?
        correctAnswer: 12/13
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se cos(x) = -3/5 (2º quadrante), sen(x) = ?
        correctAnswer: 4/5
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se tan(x) = 3/4 (3º quadrante), sen(x) = ?
        correctAnswer: -3/5
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se tan(x) = -5/12 (4º quadrante), cos(x) = ?
        correctAnswer: 12/13
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: Se sen(x) = -√3/2 (3º quadrante), cos(x) = ?
        correctAnswer: -1/2
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 10
    title: Revisão Integrada
    description: Combine identidades.
    exercises:
      - type: trigonometry
        question: sen²(x)·sec²(x) = ?
        correctAnswer: tan²(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: cos²(x)·csc²(x) = ?
        correctAnswer: cot²(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: tan(x)·cot(x) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sec(x)·cos(x) - sen(x)·csc(x) = ?
        correctAnswer: 0
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen²(x) + cos²(x) + tan²(x) - sec²(x) = ?
        correctAnswer: 0
        rationale: Consulte o ciclo trigonométrico.
target: 50
