  - pageNumber: 3
    title: Tangente — Assíntotas — prática 1
    description: Indefinida em múltiplos ímpares de 90°.
    exercises:
      - type: trigonometry
        question: tan(90°) = ? (indefinida)
        correctAnswer: indefinido
        rationale: "tan 90° é indefinida: cos 90° = 0 no denominador."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: tan(270°) = ?
        correctAnswer: indefinido
        rationale: "tan 270° é indefinida: cos 270° = 0."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: Imagem de tan(x) = ?
        correctAnswer: ℝ
        rationale: "tan assume todo real: imagem = ℝ."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: Próxima assíntota após 90° = ?
        correctAnswer: 270°
        rationale: Assíntotas de tan em x = 90°+k·180° ⇒ próxima é 270°.
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: Domínio de tan(x) exclui x = 90° + ?·k
        correctAnswer: 180°
        rationale: "tan não existe onde cos x = 0: x ≠ π/2 + kπ."
        difficulty: 2
        objectives:
          - trig.graphs
