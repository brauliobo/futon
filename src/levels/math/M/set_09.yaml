title: Gráfico da Tangente e Funções Recíprocas
level: M
subject: math
inputType: number
difficulty: 3
objectives:
  - trig.graphs
example: tan(x) tem assíntotas em x = π/2 + kπ
pages:
  - pageNumber: 1
    title: Tangente — Período
    description: Período de tan(x) é 180°.
    exercises:
      - type: trigonometry
        question: Período de tan(x) em graus = ?
        correctAnswer: 180°
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: tan(0) = ?
        correctAnswer: 0
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: tan(45°) = ?
        correctAnswer: 1
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: tan(135°) = ?
        correctAnswer: -1
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: tan(180°) = ?
        correctAnswer: 0
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 2
        objectives: [trig.graphs]
  - pageNumber: 2
    title: Tangente — Assíntotas
    description: Indefinida em múltiplos ímpares de 90°.
    exercises:
      - type: trigonometry
        question: tan(90°) = ? (indefinida)
        correctAnswer: indefinido
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: tan(270°) = ?
        correctAnswer: indefinido
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Imagem de tan(x) = ?
        correctAnswer: ℝ
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Próxima assíntota após 90° = ?
        correctAnswer: 270°
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Domínio de tan(x) exclui x = 90° + ?·k
        correctAnswer: 180°
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 2
        objectives: [trig.graphs]
  - pageNumber: 3
    title: Cotangente
    description: cot(x) = cos/sen.
    exercises:
      - type: trigonometry
        question: cot(45°) = ?
        correctAnswer: 1
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: cot(90°) = ?
        correctAnswer: 0
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: cot(0°) = ?
        correctAnswer: indefinido
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: cot(180°) = ?
        correctAnswer: indefinido
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de cot(x) = ?
        correctAnswer: 180°
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
        difficulty: 2
        objectives: [trig.graphs]
  - pageNumber: 4
    title: Secante
    description: sec(x) = 1/cos(x).
    exercises:
      - type: trigonometry
        question: sec(0°) = ?
        correctAnswer: 1
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: sec(60°) = ?
        correctAnswer: 2
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: sec(90°) = ?
        correctAnswer: indefinido
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Imagem de sec(x) = ?
        correctAnswer: (-∞,-1] ∪ [1,∞)
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de sec(x) = ?
        correctAnswer: 360°
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 2
        objectives: [trig.graphs]
  - pageNumber: 5
    title: Cossecante
    description: csc(x) = 1/sen(x).
    exercises:
      - type: trigonometry
        question: csc(90°) = ?
        correctAnswer: 1
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: csc(30°) = ?
        correctAnswer: 2
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: csc(0°) = ?
        correctAnswer: indefinido
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Imagem de csc(x) = ?
        correctAnswer: (-∞,-1] ∪ [1,∞)
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de csc(x) = ?
        correctAnswer: 360°
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 3
        objectives: [trig.graphs]
  - pageNumber: 6
    title: Comparações
    description: Propriedades agrupadas.
    exercises:
      - type: trigonometry
        question: "Função com período 180°: (tan/sen/cos)"
        correctAnswer: tan
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: "Função par: (cos/sen/tan)"
        correctAnswer: cos
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: "Função ímpar: (sen/cos/sec)"
        correctAnswer: sen
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: sec(-x) = ?
        correctAnswer: sec(x)
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: csc(-x) = ?
        correctAnswer: -csc(x)
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 3
        objectives: [trig.graphs]
  - pageNumber: 7
    title: Transformações
    description: y = a·tan(b·x).
    exercises:
      - type: trigonometry
        question: Período de y=tan(2x) = ?
        correctAnswer: 90°
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de y=tan(x/3) = ?
        correctAnswer: 540°
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Amplitude de y=3·tan(x) — tan tem amplitude? (sim/não)
        correctAnswer: não
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: "y=tan(x)+2 translada: (vertical/horizontal)"
        correctAnswer: vertical
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: "y=tan(x-45°) translada: (vertical/horizontal)"
        correctAnswer: horizontal
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 3
        objectives: [trig.graphs]
  - pageNumber: 8
    title: Aplicações
    description: Avaliações práticas.
    exercises:
      - type: trigonometry
        question: Ângulo com tan=1 no 1º quadrante = ?
        correctAnswer: 45°
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Ângulo com tan=√3 no 1º quadrante = ?
        correctAnswer: 60°
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Ângulo com sec=2 no 1º quadrante = ?
        correctAnswer: 60°
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Ângulo com csc=2 no 1º quadrante = ?
        correctAnswer: 30°
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Ângulo com cot=√3 no 1º quadrante = ?
        correctAnswer: 30°
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 4
        objectives: [trig.graphs]
  - pageNumber: 9
    title: Identidades Recíprocas
    description: Relações fundamentais.
    exercises:
      - type: trigonometry
        question: sec(x) · cos(x) = ?
        correctAnswer: 1
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: csc(x) · sen(x) = ?
        correctAnswer: 1
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: cot(x) · tan(x) = ?
        correctAnswer: 1
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: "tan(x) = sen(x)/? "
        correctAnswer: cos(x)
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: cot(x) = cos(x)/?
        correctAnswer: sen(x)
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 4
        objectives: [trig.graphs]
  - pageNumber: 10
    title: Revisão Integrada
    description: Mistura de funções.
    exercises:
      - type: trigonometry
        question: tan(x) é indefinida em 90° + 180°·k (V/F)?
        correctAnswer: V
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de cot(x) = ?
        correctAnswer: 180°
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: sec(60°) = ?
        correctAnswer: 2
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: csc(30°) = ?
        correctAnswer: 2
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: cot(45°) + tan(45°) = ?
        correctAnswer: 2
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
        difficulty: 4
        objectives: [trig.graphs]
target: 50
