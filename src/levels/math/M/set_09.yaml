      - type: trigonometry
        question: sec(90°) = ?
        correctAnswer: indefinido
        rationale: "sec 90° = 1/cos 90° = 1/0: indefinida."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: Imagem de sec(x) = ?
        correctAnswer: (-∞,-1] ∪ [1,∞)
