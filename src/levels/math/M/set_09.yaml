title: Gráfico da Tangente e Funções Recíprocas
level: M
subject: math
authorNotes: Gráfico da Tangente e Funções Recíprocas. Foque no conceito central
  do conjunto e nos erros comuns.
inputType: text
difficulty: 3
objectives:
  - trig.graphs
example: tan(x) tem assíntotas em x = π/2 + kπ
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Tangente — Período — prática 1
    description: Período de tan(x) é 180°.
    exercises:
      - type: trigonometry
        question: Período de tan(x) em graus = ?
        correctAnswer: 180°
        rationale: Em y = A sen(Bx+C)+D, período = 2π/|B|.
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: tan(0) = ?
        correctAnswer: 0
        rationale: tan 0 = sen 0 / cos 0 = 0/1 = 0.
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: tan(45°) = ?
        correctAnswer: 1
        rationale: tan 45° = sen/cos = (√2/2)/(√2/2) = 1.
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: tan(135°) = ?
        correctAnswer: -1
        rationale: tan 135° = −tan 45° = −1 (2º quadrante).
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: tan(180°) = ?
        correctAnswer: 0
        rationale: tan 180° = sen 180° / cos 180° = 0/(−1) = 0.
        difficulty: 2
        objectives:
          - trig.graphs
