title: Equações Trigonométricas
level: M
subject: math
inputType: number
difficulty: 5
objectives: [trig.equations]
example: "sen(x) = 1/2 → x = 30° + 360°k ou 150° + 360°k"
pages:
  - pageNumber: 1
    title: Equação sen(x) = k
    description: Considere o primeiro giro [0°, 360°).
    exercises:
      - { type: trigonometry, question: "Quantas soluções tem sen(x) = 1/2 em [0°, 360°)?", correctAnswer: 2 }
      - { type: trigonometry, question: "Soluções menores de sen(x) = 1/2 em [0°, 360°): (primeira)", correctAnswer: 30° }
      - { type: trigonometry, question: "Segunda solução: sen(x) = 1/2 em [0°, 360°)", correctAnswer: 150° }
      - { type: trigonometry, question: "Número de soluções de sen(x) = 1 em [0°, 360°)?", correctAnswer: 1 }
      - { type: trigonometry, question: "Número de soluções de sen(x) = -1 em [0°, 360°)?", correctAnswer: 1 }
  - pageNumber: 2
    title: Equação cos(x) = k
    description: Cosseno é simétrico em relação a 360°.
    exercises:
      - { type: trigonometry, question: "Primeira solução de cos(x) = 1/2 em [0°, 360°)?", correctAnswer: 60° }
      - { type: trigonometry, question: "Segunda solução: cos(x) = 1/2 em [0°, 360°)", correctAnswer: 300° }
      - { type: trigonometry, question: "Solução de cos(x) = 1 em [0°, 360°)?", correctAnswer: 0 }
      - { type: trigonometry, question: "Solução de cos(x) = -1 em [0°, 360°)?", correctAnswer: 180° }
      - { type: trigonometry, question: "Número de soluções de cos(x) = 1/2 em [0°, 360°)?", correctAnswer: 2 }
  - pageNumber: 3
    title: Equação tan(x) = k
    description: Tangente tem período 180°.
    exercises:
      - { type: trigonometry, question: "Primeira solução de tan(x) = 1 em [0°, 360°)?", correctAnswer: 45° }
      - { type: trigonometry, question: "Segunda solução: tan(x) = 1 em [0°, 360°)", correctAnswer: 225° }
      - { type: trigonometry, question: "Primeira solução de tan(x) = √3 em [0°, 360°)?", correctAnswer: 60° }
      - { type: trigonometry, question: "Segunda solução: tan(x) = √3 em [0°, 360°)", correctAnswer: 240° }
      - { type: trigonometry, question: "Número de soluções de tan(x) = 0 em [0°, 360°)?", correctAnswer: 2 }
  - pageNumber: 4
    title: Forma Geral
    description: Soluções em todas as voltas.
    exercises:
      - { type: trigonometry, question: "Solução geral de sen(x) = 1/2 em ℝ: 30° + 360°k e ? + 360°k", correctAnswer: 150° }
      - { type: trigonometry, question: "Solução geral de cos(x) = 1/2: ±? + 360°k", correctAnswer: 60° }
      - { type: trigonometry, question: "Solução geral de tan(x) = 1: 45° + ?·k", correctAnswer: 180° }
      - { type: trigonometry, question: "Solução geral de sen(x) = 0: ?·k", correctAnswer: 180° }
      - { type: trigonometry, question: "Solução geral de cos(x) = 0: 90° + ?·k", correctAnswer: 180° }
  - pageNumber: 5
    title: Equações Quadráticas
    description: Reduza a uma equação em sen ou cos.
    exercises:
      - { type: trigonometry, question: "2sen²(x) - 1 = 0 → sen²(x) = ?", correctAnswer: 1/2 }
      - { type: trigonometry, question: "2sen²(x) - 1 = 0 → sen(x) = ? (positivo)", correctAnswer: √2/2 }
      - { type: trigonometry, question: "Primeira solução positiva de 2cos²(x) - 1 = 0?", correctAnswer: 45° }
      - { type: trigonometry, question: "Número de soluções em [0°, 360°) de 2sen²(x) = 1?", correctAnswer: 4 }
      - { type: trigonometry, question: "cos²(x) = 0 → solução positiva menor?", correctAnswer: 90° }
  - pageNumber: 6
    title: Usando Identidades
    description: Substitua antes de resolver.
    exercises:
      - { type: trigonometry, question: "sen²(x) + sen(x) = 0 → sen(x)(sen(x)+1)=0 → sen(x)=0 ou sen(x)=?", correctAnswer: -1 }
      - { type: trigonometry, question: "Menor solução positiva de sen(x)=0?", correctAnswer: 0 }
      - { type: trigonometry, question: "Menor solução de sen(x)=-1?", correctAnswer: 270° }
      - { type: trigonometry, question: "2cos²(x) + cos(x) - 1 = 0 → cos(x) = 1/2 ou cos(x) = ?", correctAnswer: -1 }
      - { type: trigonometry, question: "Menor solução positiva de cos(x) = -1?", correctAnswer: 180° }
  - pageNumber: 7
    title: Equações com Arco Duplo
    description: Use sen(2x) = 2sen(x)cos(x).
    exercises:
      - { type: trigonometry, question: "sen(2x) = 0 → 2x = 180°k → x = ?·k", correctAnswer: 90° }
      - { type: trigonometry, question: "Primeira solução positiva de sen(2x) = 0?", correctAnswer: 0 }
      - { type: trigonometry, question: "Segunda solução positiva de sen(2x) = 0?", correctAnswer: 90° }
      - { type: trigonometry, question: "cos(2x) = 0 → 2x = 90° + 180°k → x = ?", correctAnswer: 45° }
      - { type: trigonometry, question: "Menor positiva de tan(2x) = 1?", correctAnswer: 22.5° }
  - pageNumber: 8
    title: Equações com Soma/Diferença
    description: Use identidades de soma.
    exercises:
      - { type: trigonometry, question: "sen(x+45°) = 1 → x+45° = 90° → x = ?", correctAnswer: 45° }
      - { type: trigonometry, question: "cos(x-30°) = 1 → x = ?", correctAnswer: 30° }
      - { type: trigonometry, question: "sen(x) + cos(x) = 1 (primeira positiva)?", correctAnswer: 0 }
      - { type: trigonometry, question: "sen(x) - cos(x) = 0 → tan(x) = ? ", correctAnswer: 1 }
      - { type: trigonometry, question: "Menor positiva de sen(x)-cos(x)=0?", correctAnswer: 45° }
  - pageNumber: 9
    title: Restrição de Domínio
    description: Atenção ao intervalo dado.
    exercises:
      - { type: trigonometry, question: "Em [0°, 180°], soluções de sen(x) = 1/2: (30° e ?)", correctAnswer: 150° }
      - { type: trigonometry, question: "Em [0°, 180°], soluções de cos(x) = 1/2: (60° e ?)", correctAnswer: 60° }
      - { type: trigonometry, question: "Em [0°, 90°], soluções de tan(x) = 1: ?", correctAnswer: 45° }
      - { type: trigonometry, question: "Em [0°, 360°], número de soluções de sen(x) = 0?", correctAnswer: 3 }
      - { type: trigonometry, question: "Em [0°, 360°], número de soluções de cos(x) = 0?", correctAnswer: 2 }
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplicação variada.
    exercises:
      - { type: trigonometry, question: "2sen(x) = √3 → sen(x) = ?", correctAnswer: √3/2 }
      - { type: trigonometry, question: "Menor positiva de 2sen(x) = √3?", correctAnswer: 60° }
      - { type: trigonometry, question: "Número de soluções de 2cos(x) = 1 em [0°, 360°)?", correctAnswer: 2 }
      - { type: trigonometry, question: "Menor positiva de tan(x) = 0?", correctAnswer: 0 }
      - { type: trigonometry, question: "sen(x) = cos(x) → primeira solução positiva?", correctAnswer: 45° }
target: 50
