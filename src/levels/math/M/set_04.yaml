title: Fórmulas de Arco Metade
level: M
subject: math
authorNotes: Fórmulas de Arco Metade. Foque no conceito central do conjunto e
  nos erros comuns.
inputType: text
difficulty: 3
objectives:
  - trig.identities.half_angle
example: sen(x/2) = ±√((1-cos x)/2)
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Seno do Arco Metade
    description: sen(x/2) = ±√((1-cos(x))/2). Sinal conforme o quadrante.
    exercises:
      - type: trigonometry
        question: "sen(x/2) em função de cos(x): ±√((1-cos(x))/?)"
        correctAnswer: 2
        rationale: "Arco metade: sen(x/2) = ±√((1 − cos x)/2)."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: sen(45°) via sen(90°/2) = ?
        correctAnswer: √2/2
        rationale: arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: sen(30°) via sen(60°/2) = ?
        correctAnswer: 1/2
        rationale: arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: sen(60°) via sen(120°/2) = ?
        correctAnswer: √3/2
        rationale: arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: sen(22.5°) numerador sob raiz (1-cos 45°) = ?
        correctAnswer: 1-√2/2
        rationale: "Meio ângulo: sen(x/2) = ±√((1 − cos x)/2)."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
  - pageNumber: 2
    title: Cosseno do Arco Metade
    description: cos(x/2) = ±√((1+cos(x))/2).
    exercises:
      - type: trigonometry
        question: "cos(x/2) em função de cos(x): ±√((1+cos(x))/?)"
        correctAnswer: 2
        rationale: "Arco metade: cos(x/2) = ±√((1 + cos x)/2)."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: cos(45°) via cos(90°/2) = ?
        correctAnswer: √2/2
        rationale: arccos dá ângulo em [0, π] com cos igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: cos(30°) via cos(60°/2) = ?
        correctAnswer: √3/2
        rationale: arccos dá ângulo em [0, π] com cos igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: cos(60°) via cos(120°/2) = ?
        correctAnswer: 1/2
        rationale: arccos dá ângulo em [0, π] com cos igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: cos(22.5°) numerador sob raiz (1+cos 45°) = ?
        correctAnswer: 1+√2/2
        rationale: "Meio ângulo: cos(x/2) = ±√((1 + cos x)/2)."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
  - pageNumber: 3
    title: Tangente do Arco Metade
    description: tan(x/2) = sen(x)/(1+cos(x)) = (1-cos(x))/sen(x).
    exercises:
      - type: trigonometry
        question: tan(x/2) = sen(x)/(? + cos(x))
        correctAnswer: 1
        rationale: "Arco metade: tan(x/2) = ±√((1 − cos x)/(1 + cos x))."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: tan(x/2) = (1 - ?)/sen(x)
        correctAnswer: cos(x)
        rationale: "Arco metade: tan(x/2) = ±√((1 − cos x)/(1 + cos x))."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: tan(45°) via tan(90°/2) = ?
        correctAnswer: 1
        rationale: arctan dá ângulo em (−π/2, π/2) com tan igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: tan(30°) via tan(60°/2) = ?
        correctAnswer: √3/3
        rationale: arctan dá ângulo em (−π/2, π/2) com tan igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: tan(60°) via tan(120°/2) = ?
        correctAnswer: √3
        rationale: arctan dá ângulo em (−π/2, π/2) com tan igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.identities.half_angle
  - pageNumber: 4
    title: Sinal por Quadrante
    description: Escolher o sinal correto depende do quadrante de x/2.
    exercises:
      - type: trigonometry
        question: "Se x/2 está no 1º quadrante, sen(x/2) tem sinal: (-/+)"
        correctAnswer: +
        rationale: "Arco metade: sen(x/2) = ±√((1 − cos x)/2)."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: "Se x/2 está no 2º quadrante, cos(x/2) tem sinal: (-/+)"
        correctAnswer: "-"
        rationale: "Arco metade: cos(x/2) = ±√((1 + cos x)/2)."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: "Se x/2 está no 3º quadrante, sen(x/2) tem sinal: (-/+)"
        correctAnswer: "-"
        rationale: "Arco metade: sen(x/2) = ±√((1 − cos x)/2)."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: "Se x/2 está no 4º quadrante, cos(x/2) tem sinal: (-/+)"
        correctAnswer: +
        rationale: "Arco metade: cos(x/2) = ±√((1 + cos x)/2)."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: "Se x/2 está no 3º quadrante, cos(x/2) tem sinal: (+/-)"
        correctAnswer: "-"
        rationale: "Arco metade: cos(x/2) = ±√((1 + cos x)/2)."
        difficulty: 2
        objectives:
          - trig.identities.half_angle
  - pageNumber: 5
    title: Calcule com cos(x) dado
    description: Use a fórmula do arco metade com cos(x) conhecido.
    exercises:
      - type: trigonometry
        question: Se cos(x) = 3/5 (1º quadrante), sen(x/2) = ?
        correctAnswer: √5/5
        rationale: Use sen²+cos²=1; ajuste sinal conforme o quadrante.
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Se cos(x) = 3/5 (1º quadrante), cos(x/2) = ?
        correctAnswer: 2√5/5
        rationale: "Arco metade: cos(x/2) = ±√((1 + cos x)/2)."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Se cos(x) = 7/25 (1º quadrante), sen(x/2) = ?
        correctAnswer: 3/5
        rationale: Use sen²+cos²=1; ajuste sinal conforme o quadrante.
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Se cos(x) = 7/25 (1º quadrante), cos(x/2) = ?
        correctAnswer: 4/5
        rationale: "Arco metade: cos(x/2) = ±√((1 + cos x)/2)."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Se cos(x) = 0 (1º quadrante), sen(x/2) = ?
        correctAnswer: √2/2
        rationale: Use sen²+cos²=1; ajuste sinal conforme o quadrante.
        difficulty: 3
        objectives:
          - trig.identities.half_angle
  - pageNumber: 6
    title: Verificação de Valores
    description: Confirme valores conhecidos.
    exercises:
      - type: trigonometry
        question: sen²(30°) via (1-cos(60°))/2 = ?
        correctAnswer: 1/4
        rationale: "Meio ângulo: sen²(x/2) = (1 − cos x)/2."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: cos²(30°) via (1+cos(60°))/2 = ?
        correctAnswer: 3/4
        rationale: "Meio ângulo: cos²(x/2) = (1 + cos x)/2."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: sen²(45°) via (1-cos(90°))/2 = ?
        correctAnswer: 1/2
        rationale: "Meio ângulo: sen²(x/2) = (1 − cos x)/2."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: cos²(45°) via (1+cos(90°))/2 = ?
        correctAnswer: 1/2
        rationale: "Meio ângulo: cos²(x/2) = (1 + cos x)/2."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: sen²(60°) via (1-cos(120°))/2 = ?
        correctAnswer: 3/4
        rationale: "Meio ângulo: sen²(x/2) = (1 − cos x)/2."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
  - pageNumber: 7
    title: Ligação com Arco Duplo
    description: As fórmulas do arco metade saem direto das do arco duplo.
    exercises:
      - type: trigonometry
        question: "cos(2a) = 1 - 2sen²(a). Se a=x/2: cos(x) = 1 - 2sen²(?)"
        correctAnswer: x/2
        rationale: cos x = 1 ⇒ x = 2kπ.
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: "cos(2a) = 2cos²(a) - 1. Se a=x/2: cos(x) = 2cos²(?) - 1"
        correctAnswer: x/2
        rationale: Substituindo a = x/2 em cos(2a) = 2cos²(a) − 1.
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Isolando sen²(x/2) = (1 - ?)/2
        correctAnswer: cos(x)
        rationale: "Meio ângulo: sen²(x/2) = (1 − cos x)/2."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Isolando cos²(x/2) = (1 + ?)/2
        correctAnswer: cos(x)
        rationale: "Meio ângulo: cos²(x/2) = (1 + cos x)/2."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: tan²(x/2) = (1-cos(x))/(1+?)
        correctAnswer: cos(x)
        rationale: "Meio ângulo: tan²(x/2) = (1 − cos x)/(1 + cos x)."
        difficulty: 3
        objectives:
          - trig.identities.half_angle
  - pageNumber: 8
    title: Problemas Aplicados
    description: Use o arco metade em situações numéricas.
    exercises:
      - type: trigonometry
        question: Se x=60° e x/2=30°, sen(30°) = ?
        correctAnswer: 1/2
        rationale: sen 30° = 1/2 (ângulo notável).
        difficulty: 4
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Se x=120° e x/2=60°, cos(60°) = ?
        correctAnswer: 1/2
        rationale: Use meio ângulo e o valor notável de cos.
        difficulty: 4
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Se x=90° e x/2=45°, tan(45°) = ?
        correctAnswer: 1
        rationale: Use meio ângulo e o valor notável de tan.
        difficulty: 4
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Se x=180° e x/2=90°, sen(90°) = ?
        correctAnswer: 1
        rationale: Use meio ângulo e o valor notável de sen.
        difficulty: 4
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: Se x=270° e x/2=135°, cos(135°) = ?
        correctAnswer: -√2/2
        rationale: Use meio ângulo e o valor notável de cos.
        difficulty: 4
        objectives:
          - trig.identities.half_angle
  - pageNumber: 9
    title: Identidades Derivadas
    description: Verificações importantes.
    exercises:
      - type: trigonometry
        question: tan(x/2)·(1+cos(x)) = ?
        correctAnswer: sen(x)
        rationale: "Arco metade: tan(x/2) = ±√((1 − cos x)/(1 + cos x))."
        difficulty: 4
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: sen(x)/tan(x/2) = ?
        correctAnswer: 1+cos(x)
        rationale: "Arco metade: tan(x/2) = ±√((1 − cos x)/(1 + cos x))."
        difficulty: 4
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: sen²(x/2) + cos²(x/2) = ?
        correctAnswer: 1
        rationale: "Identidade fundamental: sen²x + cos²x = 1."
        difficulty: 4
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: 2sen(x/2)cos(x/2) = ?
        correctAnswer: sen(x)
        rationale: "Arco metade: sen(x/2) = ±√((1 − cos x)/2)."
        difficulty: 4
        objectives:
          - trig.identities.half_angle
      - type: trigonometry
        question: cos²(x/2) - sen²(x/2) = ?
        correctAnswer: cos(x)
        rationale: "Inversão do arco duplo: cos²(x/2) − sen²(x/2) = cos x."
        difficulty: 4
        objectives:
          - trig.identities.half_angle
