title: Trigonometria Avançada e Séries — Conjunto 4
level: M
example: "Séries de Taylor. Ex.: sin(x) = x - x³/3! + x⁵/5! - ..."
subject: math
pages:
  - pageNumber: 1
    title: Trigonometria Avançada e Séries — Conjunto 4 – Página 1
    description: Séries de Taylor para funções trigonométricas.
    exercises:
      - &a1
        type: series
        question: "Os primeiros 3 termos da série de Taylor para sin(x) são:"
        correctAnswer: x - x³/6 + x⁵/120
      - &a2
        type: series
        question: "Os primeiros 3 termos da série de Taylor para cos(x) são:"
        correctAnswer: 1 - x²/2 + x⁴/24
      - &a3
        type: series
        question: "Aproxime sin(0.1) usando os primeiros 2 termos da série de Taylor:"
        correctAnswer: "0.0998"
      - &a4
        type: series
        question: "O termo geral da série de Taylor para sin(x) é:"
        correctAnswer: (-1)ⁿ x^(2n+1)/(2n+1)!
      - &a5
        type: series
        question: "Aproxime cos(0.2) usando os primeiros 3 termos da série:"
        correctAnswer: "0.9801"
      - &a6
        type: series
        question: "O termo geral da série de Taylor para cos(x) é:"
        correctAnswer: (-1)ⁿ x^(2n)/(2n)!
      - &a7
        type: series
        question: "O raio de convergência da série de sin(x) é:"
        correctAnswer: ∞
      - &a8
        type: series
        question: "Aproxime sin(π/6) usando a série de Taylor (3 termos):"
        correctAnswer: "0.5"
      - &a9
        type: series
        question: "O termo de ordem 4 na série de cos(x) é:"
        correctAnswer: x⁴/24
      - &a10
        type: series
        question: "A série de Maclaurin para e^x tem raio de convergência:"
        correctAnswer: ∞
