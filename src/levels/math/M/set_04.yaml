title: Fórmulas de Arco Metade
level: M
subject: math
inputType: number
difficulty: 3
objectives:
  - trig.identities.half_angle
example: sen(x/2) = ±√((1-cos x)/2)
pages:
  - pageNumber: 1
    title: Seno do Arco Metade
    description: sen(x/2) = ±√((1-cos(x))/2). Sinal conforme o quadrante.
    exercises:
      - type: trigonometry
        question: "sen(x/2) em função de cos(x): ±√((1-cos(x))/?)"
        correctAnswer: 2
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: sen(45°) via sen(90°/2) = ?
        correctAnswer: √2/2
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: sen(30°) via sen(60°/2) = ?
        correctAnswer: 1/2
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: sen(60°) via sen(120°/2) = ?
        correctAnswer: √3/2
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: sen(22.5°) numerador sob raiz (1-cos 45°) = ?
        correctAnswer: 1-√2/2
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 2
        objectives: [trig.identities.half_angle]
  - pageNumber: 2
    title: Cosseno do Arco Metade
    description: cos(x/2) = ±√((1+cos(x))/2).
    exercises:
      - type: trigonometry
        question: "cos(x/2) em função de cos(x): ±√((1+cos(x))/?)"
        correctAnswer: 2
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: cos(45°) via cos(90°/2) = ?
        correctAnswer: √2/2
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: cos(30°) via cos(60°/2) = ?
        correctAnswer: √3/2
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: cos(60°) via cos(120°/2) = ?
        correctAnswer: 1/2
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: cos(22.5°) numerador sob raiz (1+cos 45°) = ?
        correctAnswer: 1+√2/2
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 2
        objectives: [trig.identities.half_angle]
  - pageNumber: 3
    title: Tangente do Arco Metade
    description: tan(x/2) = sen(x)/(1+cos(x)) = (1-cos(x))/sen(x).
    exercises:
      - type: trigonometry
        question: tan(x/2) = sen(x)/(? + cos(x))
        correctAnswer: 1
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: tan(x/2) = (1 - ?)/sen(x)
        correctAnswer: cos(x)
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: tan(45°) via tan(90°/2) = ?
        correctAnswer: 1
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: tan(30°) via tan(60°/2) = ?
        correctAnswer: √3/3
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: tan(60°) via tan(120°/2) = ?
        correctAnswer: √3
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
        difficulty: 2
        objectives: [trig.identities.half_angle]
  - pageNumber: 4
    title: Sinal por Quadrante
    description: Escolher o sinal correto depende do quadrante de x/2.
    exercises:
      - type: trigonometry
        question: "Se x/2 está no 1º quadrante, sen(x/2) tem sinal: (+/-)"
        correctAnswer: +
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: "Se x/2 está no 2º quadrante, cos(x/2) tem sinal: (+/-)"
        correctAnswer: "-"
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: "Se x/2 está no 3º quadrante, sen(x/2) tem sinal: (+/-)"
        correctAnswer: "-"
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: "Se x/2 está no 4º quadrante, cos(x/2) tem sinal: (+/-)"
        correctAnswer: +
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 2
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: "Se x/2 está no 3º quadrante, cos(x/2) tem sinal: (+/-)"
        correctAnswer: "-"
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 2
        objectives: [trig.identities.half_angle]
  - pageNumber: 5
    title: Calcule com cos(x) dado
    description: Use a fórmula do arco metade com cos(x) conhecido.
    exercises:
      - type: trigonometry
        question: Se cos(x) = 3/5 (1º quadrante), sen(x/2) = ?
        correctAnswer: √5/5
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: "Mesma situação: cos(x/2) = ?"
        correctAnswer: 2√5/5
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Se cos(x) = 7/25 (1º quadrante), sen(x/2) = ?
        correctAnswer: 3/5
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: "Mesma situação: cos(x/2) = ?"
        correctAnswer: 4/5
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Se cos(x) = 0 (1º quadrante), sen(x/2) = ?
        correctAnswer: √2/2
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 3
        objectives: [trig.identities.half_angle]
  - pageNumber: 6
    title: Verificação de Valores
    description: Confirme valores conhecidos.
    exercises:
      - type: trigonometry
        question: sen²(30°) via (1-cos(60°))/2 = ?
        correctAnswer: 1/4
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: cos²(30°) via (1+cos(60°))/2 = ?
        correctAnswer: 3/4
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: sen²(45°) via (1-cos(90°))/2 = ?
        correctAnswer: 1/2
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: cos²(45°) via (1+cos(90°))/2 = ?
        correctAnswer: 1/2
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: sen²(60°) via (1-cos(120°))/2 = ?
        correctAnswer: 3/4
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 3
        objectives: [trig.identities.half_angle]
  - pageNumber: 7
    title: Ligação com Arco Duplo
    description: As fórmulas do arco metade saem direto das do arco duplo.
    exercises:
      - type: trigonometry
        question: "cos(2a) = 1 - 2sen²(a). Se a=x/2: cos(x) = 1 - 2sen²(?)"
        correctAnswer: x/2
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: "cos(2a) = 2cos²(a) - 1. Se a=x/2: cos(x) = 2cos²(?) - 1"
        correctAnswer: x/2
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Isolando sen²(x/2) = (1 - ?)/2
        correctAnswer: cos(x)
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Isolando cos²(x/2) = (1 + ?)/2
        correctAnswer: cos(x)
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 3
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: tan²(x/2) = (1-cos(x))/(1+?)
        correctAnswer: cos(x)
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 3
        objectives: [trig.identities.half_angle]
  - pageNumber: 8
    title: Problemas Aplicados
    description: Use o arco metade em situações numéricas.
    exercises:
      - type: trigonometry
        question: Se x=60° e x/2=30°, sen(30°) = ?
        correctAnswer: 1/2
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Se x=120° e x/2=60°, cos(60°) = ?
        correctAnswer: 1/2
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Se x=90° e x/2=45°, tan(45°) = ?
        correctAnswer: 1
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Se x=180° e x/2=90°, sen(90°) = ?
        correctAnswer: 1
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Se x=270° e x/2=135°, cos(135°) = ?
        correctAnswer: -√2/2
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 4
        objectives: [trig.identities.half_angle]
  - pageNumber: 9
    title: Identidades Derivadas
    description: Verificações importantes.
    exercises:
      - type: trigonometry
        question: tan(x/2)·(1+cos(x)) = ?
        correctAnswer: sen(x)
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: sen(x)/tan(x/2) = ?
        correctAnswer: 1+cos(x)
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: sen²(x/2) + cos²(x/2) = ?
        correctAnswer: 1
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: 2sen(x/2)cos(x/2) = ?
        correctAnswer: sen(x)
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: cos²(x/2) - sen²(x/2) = ?
        correctAnswer: cos(x)
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 4
        objectives: [trig.identities.half_angle]
  - pageNumber: 10
    title: Revisão Integrada
    description: Misture arco duplo e arco metade.
    exercises:
      - type: trigonometry
        question: Se cos(x)=1/2 (1º quadrante), cos(x/2) = ?
        correctAnswer: √3/2
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: "Mesma situação: sen(x/2) = ?"
        correctAnswer: 1/2
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Se cos(x)=-1/2 (2º quadrante), cos(x/2) (agudo) = ?
        correctAnswer: 1/2
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: "Mesma situação: sen(x/2) = ?"
        correctAnswer: √3/2
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 4
        objectives: [trig.identities.half_angle]
      - type: trigonometry
        question: Se sen(x)=4/5 e cos(x)=3/5, tan(x/2) = ?
        correctAnswer: 1/2
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
        difficulty: 4
        objectives: [trig.identities.half_angle]
target: 50
