      - type: algebra
        question: "Polar de z=1+i: (r=√2, θ=45°) V/F"
        correctAnswer: V
        rationale: "Raízes n-ésimas de z: n pontos igualmente espaçados no círculo de
          raio ⁿ√|z|."
        difficulty: 3
        objectives:
