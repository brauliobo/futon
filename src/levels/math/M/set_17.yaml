        correctAnswer: 45
        rationale: Divisão em polar subtrai argumentos.
        difficulty: 4
        objectives:
          - complex.polar
      - type: algebra
        question: "1/i em polar: 1/cis90° = cis(?°)"
        correctAnswer: -90
        rationale: 1/i = cis(−90°) = −i.
        difficulty: 4
        objectives:
          - complex.polar
      - type: algebra
        question: cis(-90°) = ?
        correctAnswer: -i
        rationale: cis(−90°) = cos(−90°) + i sen(−90°) = −i.
        difficulty: 4
        objectives:
          - complex.polar
