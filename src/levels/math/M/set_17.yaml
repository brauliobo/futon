  - pageNumber: 7
    title: Multiplicação Polar — prática 1
    description: r₁·r₂ cis(θ₁+θ₂).
    exercises:
      - type: algebra
        question: Multiplicar magnitudes — soma argumentos (V/F)?
        correctAnswer: V
        rationale: "Em polar: (r₁ cis θ₁)(r₂ cis θ₂) = (r₁r₂) cis(θ₁+θ₂)."
        difficulty: 3
        objectives:
          - complex.polar
      - type: algebra
        question: cis(30°) · cis(60°) = cis(?°)
        correctAnswer: 90
        rationale: Multiplicação em polar soma argumentos.
        difficulty: 3
        objectives:
          - complex.polar
      - type: algebra
        question: (2·cis30°)(3·cis60°) = (?·cis90°)
        correctAnswer: 6
        rationale: "Em polar: multiplica módulos, soma (ou subtrai) argumentos."
        difficulty: 3
        objectives:
          - complex.polar
      - type: algebra
        question: cis(45°) · cis(45°) = cis(?°)
        correctAnswer: 90
        rationale: Multiplicação em polar soma argumentos.
        difficulty: 3
        objectives:
