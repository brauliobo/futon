title: Trigonometria & Séries — Revisão Final
level: M
subject: math
authorNotes: "Trigonometria & Séries — Revisão Final. Foque no conceito central do conjunto e nos erros comuns."
inputType: number
difficulty: 5
objectives:
  - trig.review
  - series.review
example: Problemas integrados do nível M.
pages:
  - pageNumber: 1
    title: Identidades
    description: Aplicação direta.
    exercises:
      - type: trigonometry
        question: sen²(x) + cos²(x) = ?
        correctAnswer: 1
        rationale: "Identidade pitagórica fundamental: sen²x + cos²x = 1."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: tan²(x) + 1 = ?
        correctAnswer: sec²(x)
        rationale: "tan²x + 1 = sec²x (derivada de sen²+cos²=1 dividindo por cos²)."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: sen(2x) = ?·sen(x)·cos(x)
        correctAnswer: 2
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: cos(2x) = 1 - ?·sen²(x)
        correctAnswer: 2
        rationale: "Arco duplo: cos(2x) = 1 − 2 sen²x."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: tan(45°) + cot(45°) = ?
        correctAnswer: 2
        rationale: "tan 45° = 1 e cot 45° = 1; soma = 2."
        difficulty: 4
        objectives: [trig.review, series.review]
  - pageNumber: 2
    title: Funções
    description: Amplitude, período.
    exercises:
      - type: trigonometry
        question: Amplitude de y=3·sen(x) = ?
        correctAnswer: 3
        rationale: "Em y = A sen(Bx+C)+D, amplitude = |A|."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: Período de y=cos(2x) = ?
        correctAnswer: 180°
        rationale: "Em y = A sen(Bx+C)+D, período = 2π/|B|."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: Período de tan(x) = ?
        correctAnswer: 180°
        rationale: "Em y = A sen(Bx+C)+D, período = 2π/|B|."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: Amplitude de y=cos(x) + 5 = ?
        correctAnswer: 1
        rationale: "Em y = A sen(Bx+C)+D, amplitude = |A|."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: Linha central de y=sen(x)+3 = ?
        correctAnswer: 3
        rationale: "Em y = f(x)+D, linha central (eixo médio) é y = D."
        difficulty: 4
        objectives: [trig.review, series.review]
  - pageNumber: 3
    title: Triângulos
    description: Leis aplicadas.
    exercises:
      - type: trigonometry
        question: Em retângulo com catetos 5 e 12, hipotenusa = ?
        correctAnswer: 13
        rationale: "Pitágoras: h² = c₁² + c₂² (caso particular da lei dos cossenos)."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: "Lei dos senos: a/sen(A) = ? "
        correctAnswer: 2R
        rationale: "Lei dos senos: a/sen A = b/sen B = c/sen C."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: "Lei dos cossenos: c² = a²+b²-2ab·cos(?)"
        correctAnswer: C
        rationale: "Lei dos cossenos — ângulo C oposto ao lado c."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: "Se A=B=45°, triângulo é: (retângulo isósceles)"
        correctAnswer: retângulo isósceles
        rationale: "Soma dos ângulos = 180°, logo C = 90° e catetos iguais."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: Em equilátero com lado 6, altura = ?
        correctAnswer: 3√3
        rationale: "Altura do equilátero: h = L·√3/2."
        difficulty: 4
        objectives: [trig.review, series.review]
  - pageNumber: 4
    title: Equações
    description: Resolva sem ambiguidade.
    exercises:
      - type: trigonometry
        question: sen(x)=1/2 no 1º quadrante = ?°
        correctAnswer: 30
        rationale: "sen x = 1 ⇒ x = π/2 + 2kπ."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: cos(x)=0 no [0°,360°) = 90° e ?°
        correctAnswer: 270
        rationale: "cos x = 0 ⇒ x = π/2 + kπ, k ∈ ℤ."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: tan(x)=√3 no 1º quadrante = ?°
        correctAnswer: 60
        rationale: "tan 60° = √3 (ângulo notável no 1º quadrante)."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: "sen(x)=0 em [0°,360°) — número de soluções: ?"
        correctAnswer: 3
        rationale: "sen x = 0 ⇒ x = kπ, k ∈ ℤ."
        difficulty: 4
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: "Menor positiva de cos(x)=1/2: ?°"
        correctAnswer: 60
        rationale: "cos x = 1 ⇒ x = 2kπ."
        difficulty: 4
        objectives: [trig.review, series.review]
  - pageNumber: 5
    title: Séries — PA
    description: Revisão rápida.
    exercises:
      - type: sequence
        question: a₁=2, r=3, a₅ = ?
        correctAnswer: 14
        rationale: "Termo geral da PA: aₙ = a₁ + (n−1)·r."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: sequence
        question: Soma de 1 a 100 = ?
        correctAnswer: 5050
        rationale: "Soma 1+2+…+n = n(n+1)/2 (PA)."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: sequence
        question: PA com a₁=4, r=5, S₁₀ = 10/2·(a₁+a₁₀) = 5·(4+49) = ?
        correctAnswer: 265
        rationale: "Mesmo denominador: some numeradores; diferentes: reduza ao MMC."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: sequence
        question: Em PA, termo central de {3,7,11} = ?
        correctAnswer: 7
        rationale: "Soma 1+2+…+n = n(n+1)/2 (PA)."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: sequence
        question: "Soma de 1 a n = n(n+1)/? "
        correctAnswer: 2
        rationale: "Soma 1+2+…+n = n(n+1)/2 (PA)."
        difficulty: 5
        objectives: [trig.review, series.review]
  - pageNumber: 6
    title: Séries — PG
    description: Revisão.
    exercises:
      - type: sequence
        question: a₁=2, q=3, a₄ = ?
        correctAnswer: 54
        rationale: "Termo geral da PG: aₙ = a₁·qⁿ⁻¹."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: sequence
        question: Soma infinita de 1 + 1/2 + 1/4 + ... = ?
        correctAnswer: 2
        rationale: "Mesmo denominador: some numeradores; diferentes: reduza ao MMC."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: sequence
        question: "PG com q=1 é: (constante)"
        correctAnswer: constante
        rationale: "q = 1 faz todos os termos iguais: PG constante."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: sequence
        question: Termo médio geométrico entre 1 e 9 = ?
        correctAnswer: 3
        rationale: "Média geométrica: MG = √(a·b)."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: sequence
        question: PG com |q|<1 converge (V/F)?
        correctAnswer: V
        rationale: "PG infinita converge sse |q| < 1."
        difficulty: 5
        objectives: [trig.review, series.review]
  - pageNumber: 7
    title: Complexos
    description: Forma algébrica e polar.
    exercises:
      - type: algebra
        question: "|3+4i| = ?"
        correctAnswer: 5
        rationale: "Módulo: |3+4i| = √(9+16) = 5."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: (1+i)² = ?
        correctAnswer: 2i
        rationale: "Produto notável: (a+b)² = a² + 2ab + b²."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: i⁴ = ?
        correctAnswer: 1
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: arg(i) = ?°
        correctAnswer: 90
        rationale: "Argumento: θ = atan2(b, a) (ângulo com o eixo real)."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: e^(iπ) = ?
        correctAnswer: -1
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 5
        objectives: [trig.review, series.review]
  - pageNumber: 8
    title: Binômio
    description: Coeficientes e expansão.
    exercises:
      - type: algebra
        question: (a+b)³ coeficiente de a²b = ?
        correctAnswer: 3
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: C(5,3) = ?
        correctAnswer: 10
        rationale: "Coeficiente binomial: C(n,k) = n!/(k!(n−k)!)."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: Soma dos coeficientes de (1+x)⁴ = ?
        correctAnswer: 16
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: (a-b)² = ?
        correctAnswer: a²-2ab+b²
        rationale: "Produto notável: (a-b)² = a² - 2ab + b²."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: Subconjuntos de 8 elementos = ?
        correctAnswer: 256
        rationale: "Conjunto com n elementos tem 2ⁿ subconjuntos."
        difficulty: 5
        objectives: [trig.review, series.review]
  - pageNumber: 9
    title: Taylor
    description: Aproximações.
    exercises:
      - type: calculus
        question: e^x = 1 + x + x²/2! + ? + ...
        correctAnswer: x³/3!
        rationale: "Equação linear: isole x aplicando operações inversas."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: calculus
        question: sen(x) = x - ? + x⁵/5! - ...
        correctAnswer: x³/3!
        rationale: "Maclaurin de sen x: sinais alternam, potências ímpares."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: calculus
        question: cos(0) pela série = ?
        correctAnswer: 1
        rationale: "Maclaurin de cos x em x=0 começa em 1."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: calculus
        question: "Raio de convergência de e^x: ?"
        correctAnswer: ∞
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: calculus
        question: ln(1+x) converge em x ∈ (-1, ?]
        correctAnswer: 1
        rationale: "ln é log na base e; ln(eˣ) = x."
        difficulty: 5
        objectives: [trig.review, series.review]
  - pageNumber: 10
    title: Revisão Final
    description: Integração total.
    exercises:
      - type: trigonometry
        question: sen(60°) = ?
        correctAnswer: √3/2
        rationale: "Ângulo notável: sen 60° = √3/2."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: trigonometry
        question: cos(60°) = ?
        correctAnswer: 1/2
        rationale: "Ângulo notável: cos 60° = 1/2."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: sequence
        question: Soma de 1 a 50 = ?
        correctAnswer: 1275
        rationale: "Soma 1+2+…+n = n(n+1)/2 (PA)."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: "|1+i| = ?"
        correctAnswer: √2
        rationale: "Módulo: |1±i| = √2."
        difficulty: 5
        objectives: [trig.review, series.review]
      - type: algebra
        question: C(6,2) = ?
        correctAnswer: 15
        rationale: "Coeficiente binomial: C(n,k) = n!/(k!(n−k)!)."
        difficulty: 5
        objectives: [trig.review, series.review]
target: 50
