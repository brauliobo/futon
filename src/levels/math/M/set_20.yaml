title: Trigonometria & Séries — Revisão Final
level: M
subject: math
inputType: number
difficulty: 5
objectives: [trig.review, series.review]
example: "Problemas integrados do nível M."
pages:
  - pageNumber: 1
    title: Identidades
    description: Aplicação direta.
    exercises:
      - { type: trigonometry, question: "sen²(x) + cos²(x) = ?", correctAnswer: 1 }
      - { type: trigonometry, question: "tan²(x) + 1 = ?", correctAnswer: sec²(x) }
      - { type: trigonometry, question: "sen(2x) = ?·sen(x)·cos(x)", correctAnswer: 2 }
      - { type: trigonometry, question: "cos(2x) = 1 - ?·sen²(x)", correctAnswer: 2 }
      - { type: trigonometry, question: "tan(45°) + cot(45°) = ?", correctAnswer: 2 }
  - pageNumber: 2
    title: Funções
    description: Amplitude, período.
    exercises:
      - { type: trigonometry, question: "Amplitude de y=3·sen(x) = ?", correctAnswer: 3 }
      - { type: trigonometry, question: "Período de y=cos(2x) = ?", correctAnswer: 180° }
      - { type: trigonometry, question: "Período de tan(x) = ?", correctAnswer: 180° }
      - { type: trigonometry, question: "Amplitude de y=cos(x) + 5 = ?", correctAnswer: 1 }
      - { type: trigonometry, question: "Linha central de y=sen(x)+3 = ?", correctAnswer: 3 }
  - pageNumber: 3
    title: Triângulos
    description: Leis aplicadas.
    exercises:
      - { type: trigonometry, question: "Em retângulo com catetos 5 e 12, hipotenusa = ?", correctAnswer: 13 }
      - { type: trigonometry, question: "Lei dos senos: a/sen(A) = ? ", correctAnswer: 2R }
      - { type: trigonometry, question: "Lei dos cossenos: c² = a²+b²-2ab·cos(?)", correctAnswer: C }
      - { type: trigonometry, question: "Se A=B=45°, triângulo é: (retângulo isósceles)", correctAnswer: retângulo isósceles }
      - { type: trigonometry, question: "Em equilátero com lado 6, altura = ?", correctAnswer: 3√3 }
  - pageNumber: 4
    title: Equações
    description: Resolva sem ambiguidade.
    exercises:
      - { type: trigonometry, question: "sen(x)=1/2 no 1º quadrante = ?°", correctAnswer: 30 }
      - { type: trigonometry, question: "cos(x)=0 no [0°,360°) = 90° e ?°", correctAnswer: 270 }
      - { type: trigonometry, question: "tan(x)=√3 no 1º quadrante = ?°", correctAnswer: 60 }
      - { type: trigonometry, question: "sen(x)=0 em [0°,360°) — número de soluções: ?", correctAnswer: 3 }
      - { type: trigonometry, question: "Menor positiva de cos(x)=1/2: ?°", correctAnswer: 60 }
  - pageNumber: 5
    title: Séries — PA
    description: Revisão rápida.
    exercises:
      - { type: sequence, question: "a₁=2, r=3, a₅ = ?", correctAnswer: 14 }
      - { type: sequence, question: "Soma de 1 a 100 = ?", correctAnswer: 5050 }
      - { type: sequence, question: "PA com a₁=4, r=5, S₁₀ = 10/2·(a₁+a₁₀) = 5·(4+49) = ?", correctAnswer: 265 }
      - { type: sequence, question: "Em PA, termo central de {3,7,11} = ?", correctAnswer: 7 }
      - { type: sequence, question: "Soma de 1 a n = n(n+1)/? ", correctAnswer: 2 }
  - pageNumber: 6
    title: Séries — PG
    description: Revisão.
    exercises:
      - { type: sequence, question: "a₁=2, q=3, a₄ = ?", correctAnswer: 54 }
      - { type: sequence, question: "Soma infinita de 1 + 1/2 + 1/4 + ... = ?", correctAnswer: 2 }
      - { type: sequence, question: "PG com q=1 é: (constante)", correctAnswer: constante }
      - { type: sequence, question: "Termo médio geométrico entre 1 e 9 = ?", correctAnswer: 3 }
      - { type: sequence, question: "PG com |q|<1 converge (V/F)?", correctAnswer: V }
  - pageNumber: 7
    title: Complexos
    description: Forma algébrica e polar.
    exercises:
      - { type: algebra, question: "|3+4i| = ?", correctAnswer: 5 }
      - { type: algebra, question: "(1+i)² = ?", correctAnswer: 2i }
      - { type: algebra, question: "i⁴ = ?", correctAnswer: 1 }
      - { type: algebra, question: "arg(i) = ?°", correctAnswer: 90 }
      - { type: algebra, question: "e^(iπ) = ?", correctAnswer: -1 }
  - pageNumber: 8
    title: Binômio
    description: Coeficientes e expansão.
    exercises:
      - { type: algebra, question: "(a+b)³ coeficiente de a²b = ?", correctAnswer: 3 }
      - { type: algebra, question: "C(5,3) = ?", correctAnswer: 10 }
      - { type: algebra, question: "Soma dos coeficientes de (1+x)⁴ = ?", correctAnswer: 16 }
      - { type: algebra, question: "(a-b)² = ?", correctAnswer: "a²-2ab+b²" }
      - { type: algebra, question: "Subconjuntos de 8 elementos = ?", correctAnswer: 256 }
  - pageNumber: 9
    title: Taylor
    description: Aproximações.
    exercises:
      - { type: calculus, question: "e^x = 1 + x + x²/2! + ? + ...", correctAnswer: x³/3! }
      - { type: calculus, question: "sen(x) = x - ? + x⁵/5! - ...", correctAnswer: x³/3! }
      - { type: calculus, question: "cos(0) pela série = ?", correctAnswer: 1 }
      - { type: calculus, question: "Raio de convergência de e^x: ?", correctAnswer: ∞ }
      - { type: calculus, question: "ln(1+x) converge em x ∈ (-1, ?]", correctAnswer: 1 }
  - pageNumber: 10
    title: Revisão Final
    description: Integração total.
    exercises:
      - { type: trigonometry, question: "sen(60°) = ?", correctAnswer: √3/2 }
      - { type: trigonometry, question: "cos(60°) = ?", correctAnswer: 1/2 }
      - { type: sequence, question: "Soma de 1 a 50 = ?", correctAnswer: 1275 }
      - { type: algebra, question: "|1+i| = ?", correctAnswer: √2 }
      - { type: algebra, question: "C(6,2) = ?", correctAnswer: 15 }
target: 50
