title: Trigonometria & Séries — Revisão Final
level: M
subject: math
inputType: number
difficulty: 5
objectives:
  - trig.review
  - series.review
example: Problemas integrados do nível M.
pages:
  - pageNumber: 1
    title: Identidades
    description: Aplicação direta.
    exercises:
      - type: trigonometry
        question: sen²(x) + cos²(x) = ?
        correctAnswer: 1
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: tan²(x) + 1 = ?
        correctAnswer: sec²(x)
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: sen(2x) = ?·sen(x)·cos(x)
        correctAnswer: 2
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: cos(2x) = 1 - ?·sen²(x)
        correctAnswer: 2
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: tan(45°) + cot(45°) = ?
        correctAnswer: 2
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
  - pageNumber: 2
    title: Funções
    description: Amplitude, período.
    exercises:
      - type: trigonometry
        question: Amplitude de y=3·sen(x) = ?
        correctAnswer: 3
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: Período de y=cos(2x) = ?
        correctAnswer: 180°
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: Período de tan(x) = ?
        correctAnswer: 180°
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: Amplitude de y=cos(x) + 5 = ?
        correctAnswer: 1
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: Linha central de y=sen(x)+3 = ?
        correctAnswer: 3
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
  - pageNumber: 3
    title: Triângulos
    description: Leis aplicadas.
    exercises:
      - type: trigonometry
        question: Em retângulo com catetos 5 e 12, hipotenusa = ?
        correctAnswer: 13
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: "Lei dos senos: a/sen(A) = ? "
        correctAnswer: 2R
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: "Lei dos cossenos: c² = a²+b²-2ab·cos(?)"
        correctAnswer: C
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: "Se A=B=45°, triângulo é: (retângulo isósceles)"
        correctAnswer: retângulo isósceles
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: Em equilátero com lado 6, altura = ?
        correctAnswer: 3√3
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
  - pageNumber: 4
    title: Equações
    description: Resolva sem ambiguidade.
    exercises:
      - type: trigonometry
        question: sen(x)=1/2 no 1º quadrante = ?°
        correctAnswer: 30
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: cos(x)=0 no [0°,360°) = 90° e ?°
        correctAnswer: 270
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: tan(x)=√3 no 1º quadrante = ?°
        correctAnswer: 60
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: "sen(x)=0 em [0°,360°) — número de soluções: ?"
        correctAnswer: 3
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: "Menor positiva de cos(x)=1/2: ?°"
        correctAnswer: 60
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
  - pageNumber: 5
    title: Séries — PA
    description: Revisão rápida.
    exercises:
      - type: sequence
        question: a₁=2, r=3, a₅ = ?
        correctAnswer: 14
        rationale: "Identifique o padrão (diferença ou razão constante)."
      - type: sequence
        question: Soma de 1 a 100 = ?
        correctAnswer: 5050
        rationale: "Identifique o padrão (diferença ou razão constante)."
      - type: sequence
        question: PA com a₁=4, r=5, S₁₀ = 10/2·(a₁+a₁₀) = 5·(4+49) = ?
        correctAnswer: 265
        rationale: "Identifique o padrão (diferença ou razão constante)."
      - type: sequence
        question: Em PA, termo central de {3,7,11} = ?
        correctAnswer: 7
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: sequence
        question: "Soma de 1 a n = n(n+1)/? "
        correctAnswer: 2
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
  - pageNumber: 6
    title: Séries — PG
    description: Revisão.
    exercises:
      - type: sequence
        question: a₁=2, q=3, a₄ = ?
        correctAnswer: 54
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: sequence
        question: Soma infinita de 1 + 1/2 + 1/4 + ... = ?
        correctAnswer: 2
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: sequence
        question: "PG com q=1 é: (constante)"
        correctAnswer: constante
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: sequence
        question: Termo médio geométrico entre 1 e 9 = ?
        correctAnswer: 3
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: sequence
        question: PG com |q|<1 converge (V/F)?
        correctAnswer: V
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
  - pageNumber: 7
    title: Complexos
    description: Forma algébrica e polar.
    exercises:
      - type: algebra
        question: "|3+4i| = ?"
        correctAnswer: 5
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: (1+i)² = ?
        correctAnswer: 2i
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: i⁴ = ?
        correctAnswer: 1
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: arg(i) = ?°
        correctAnswer: 90
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: algebra
        question: e^(iπ) = ?
        correctAnswer: -1
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
  - pageNumber: 8
    title: Binômio
    description: Coeficientes e expansão.
    exercises:
      - type: algebra
        question: (a+b)³ coeficiente de a²b = ?
        correctAnswer: 3
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: algebra
        question: C(5,3) = ?
        correctAnswer: 10
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: algebra
        question: Soma dos coeficientes de (1+x)⁴ = ?
        correctAnswer: 16
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: algebra
        question: (a-b)² = ?
        correctAnswer: a²-2ab+b²
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: algebra
        question: Subconjuntos de 8 elementos = ?
        correctAnswer: 256
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
  - pageNumber: 9
    title: Taylor
    description: Aproximações.
    exercises:
      - type: calculus
        question: e^x = 1 + x + x²/2! + ? + ...
        correctAnswer: x³/3!
        rationale: "Aplique a regra de derivação/integração correspondente."
      - type: calculus
        question: sen(x) = x - ? + x⁵/5! - ...
        correctAnswer: x³/3!
        rationale: "Aplique a regra de derivação/integração correspondente."
      - type: calculus
        question: cos(0) pela série = ?
        correctAnswer: 1
        rationale: "Aplique a regra de derivação/integração correspondente."
      - type: calculus
        question: "Raio de convergência de e^x: ?"
        correctAnswer: ∞
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: calculus
        question: ln(1+x) converge em x ∈ (-1, ?]
        correctAnswer: 1
        rationale: "Domine valores exatos dos ângulos notáveis."
  - pageNumber: 10
    title: Revisão Final
    description: Integração total.
    exercises:
      - type: trigonometry
        question: sen(60°) = ?
        correctAnswer: √3/2
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: cos(60°) = ?
        correctAnswer: 1/2
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: sequence
        question: Soma de 1 a 50 = ?
        correctAnswer: 1275
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: algebra
        question: "|1+i| = ?"
        correctAnswer: √2
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: algebra
        question: C(6,2) = ?
        correctAnswer: 15
        rationale: "Domine valores exatos dos ângulos notáveis."
target: 50
