  - pageNumber: 3
    title: Valores Notáveis do Seno — prática 1
    description: Valores em 0°, 90°, 180°, 270°, 360°.
    exercises:
      - type: trigonometry
        question: sen(90°) = ?
        correctAnswer: 1
        rationale: "Valor notável: sen 90° = 1 (topo do ciclo)."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: sen(180°) = ?
        correctAnswer: 0
        rationale: "Valor notável: sen 180° = 0."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: sen(270°) = ?
        correctAnswer: -1
        rationale: "Valor notável: sen 270° = −1 (fundo do ciclo)."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: sen(360°) = ?
        correctAnswer: 0
        rationale: sen 360° = sen 0° = 0 (período 2π).
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: "Máximo de sen(x) ocorre em: (180°/0°/90°)"
        correctAnswer: 90°
        rationale: sen x atinge máximo 1 em x = 90° + k·360°.
        difficulty: 2
        objectives:
          - trig.graphs
