  - pageNumber: 5
    title: Cosseno — Características — prática 1
    description: cos(x) — mesma amplitude e período do seno, defasado.
    exercises:
      - type: trigonometry
        question: Domínio de cos(x) = ?
        correctAnswer: ℝ
        rationale: "cos está definida para todo real: domínio = ℝ."
