      - type: trigonometry
        question: Período de cos(x) em graus = ?
        correctAnswer: 360°
        rationale: Em y = A sen(Bx+C)+D, período = 2π/|B|.
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: "cos(x) é: (par/ímpar)"
        correctAnswer: par
        rationale: "cos é par: cos(−x) = cos x."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: "sen(x) é: (ímpar/par)"
        correctAnswer: ímpar
        rationale: "sen é ímpar: sen(−x) = −sen x."
        difficulty: 2
        objectives:
          - trig.graphs
