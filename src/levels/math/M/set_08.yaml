title: Gráficos de Seno e Cosseno
level: M
subject: math
authorNotes: "Gráficos de Seno e Cosseno. Foque no conceito central do conjunto e nos erros comuns."
inputType: text
difficulty: 3
objectives:
  - trig.graphs
example: y = sen(x) tem período 2π e amplitude 1
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Características Básicas
    description: Domínio, imagem, período, amplitude.
    exercises:
      - type: trigonometry
        question: Domínio de sen(x) = ?
        correctAnswer: ℝ
        rationale: "sen está definida para todo real: domínio = ℝ."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Imagem de sen(x) = ?
        correctAnswer: "[-1,1]"
        rationale: "sen oscila entre −1 e 1: imagem = [−1, 1]."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de sen(x) em graus = ?
        correctAnswer: 360°
        rationale: "Em y = A sen(Bx+C)+D, período = 2π/|B|."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Amplitude de sen(x) = ?
        correctAnswer: 1
        rationale: "Em y = A sen(Bx+C)+D, amplitude = |A|."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: sen(0) = ?
        correctAnswer: 0
        rationale: "Valor notável: sen 0 = 0 (eixo x no ciclo)."
        difficulty: 2
        objectives: [trig.graphs]
  - pageNumber: 2
    title: Valores Notáveis do Seno
    description: Valores em 0°, 90°, 180°, 270°, 360°.
    exercises:
      - type: trigonometry
        question: sen(90°) = ?
        correctAnswer: 1
        rationale: "Valor notável: sen 90° = 1 (topo do ciclo)."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: sen(180°) = ?
        correctAnswer: 0
        rationale: "Valor notável: sen 180° = 0."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: sen(270°) = ?
        correctAnswer: -1
        rationale: "Valor notável: sen 270° = −1 (fundo do ciclo)."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: sen(360°) = ?
        correctAnswer: 0
        rationale: "sen 360° = sen 0° = 0 (período 2π)."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: "Máximo de sen(x) ocorre em: (180°/0°/90°)"
        correctAnswer: 90°
        rationale: "sen x atinge máximo 1 em x = 90° + k·360°."
        difficulty: 2
        objectives: [trig.graphs]
  - pageNumber: 3
    title: Cosseno — Características
    description: cos(x) — mesma amplitude e período do seno, defasado.
    exercises:
      - type: trigonometry
        question: Domínio de cos(x) = ?
        correctAnswer: ℝ
        rationale: "cos está definida para todo real: domínio = ℝ."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Imagem de cos(x) = ?
        correctAnswer: "[-1,1]"
        rationale: "cos oscila entre −1 e 1: imagem = [−1, 1]."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de cos(x) em graus = ?
        correctAnswer: 360°
        rationale: "Em y = A sen(Bx+C)+D, período = 2π/|B|."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: "cos(x) é: (par/ímpar)"
        correctAnswer: par
        rationale: "cos é par: cos(−x) = cos x."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: "sen(x) é: (ímpar/par)"
        correctAnswer: ímpar
        rationale: "sen é ímpar: sen(−x) = −sen x."
        difficulty: 2
        objectives: [trig.graphs]
  - pageNumber: 4
    title: Valores Notáveis do Cosseno
    description: Cosseno em pontos de referência.
    exercises:
      - type: trigonometry
        question: cos(0) = ?
        correctAnswer: 1
        rationale: "Valor notável: cos 0 = 1 (eixo x no ciclo)."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: cos(90°) = ?
        correctAnswer: 0
        rationale: "Valor notável: cos 90° = 0 (topo do ciclo)."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: cos(180°) = ?
        correctAnswer: -1
        rationale: "Valor notável: cos 180° = −1."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: cos(270°) = ?
        correctAnswer: 0
        rationale: "Valor notável: cos 270° = 0."
        difficulty: 2
        objectives: [trig.graphs]
      - type: trigonometry
        question: cos(360°) = ?
        correctAnswer: 1
        rationale: "cos 360° = cos 0° = 1 (período 2π)."
        difficulty: 2
        objectives: [trig.graphs]
  - pageNumber: 5
    title: Amplitude
    description: y = A·sen(x) altera a amplitude.
    exercises:
      - type: trigonometry
        question: Amplitude de y=3·sen(x) = ?
        correctAnswer: 3
        rationale: "Em y = A sen(Bx+C)+D, amplitude = |A|."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Amplitude de y=-2·sen(x) = ?
        correctAnswer: 2
        rationale: "Em y = A sen(Bx+C)+D, amplitude = |A|."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Amplitude de y=0.5·cos(x) = ?
        correctAnswer: 0.5
        rationale: "Em y = A sen(Bx+C)+D, amplitude = |A|."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Amplitude de y=cos(x) = ?
        correctAnswer: 1
        rationale: "Em y = A sen(Bx+C)+D, amplitude = |A|."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Amplitude de y=4·sen(x) = ?
        correctAnswer: 4
        rationale: "Em y = A sen(Bx+C)+D, amplitude = |A|."
        difficulty: 3
        objectives: [trig.graphs]
  - pageNumber: 6
    title: Período e Frequência
    description: y = sen(kx) altera o período.
    exercises:
      - type: trigonometry
        question: Período de y=sen(2x) = ?
        correctAnswer: 180°
        rationale: "Em y = A sen(Bx+C)+D, período = 2π/|B|."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de y=sen(x/2) = ?
        correctAnswer: 720°
        rationale: "Arco metade: sen(x/2) = ±√((1 − cos x)/2)."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de y=cos(3x) = ?
        correctAnswer: 120°
        rationale: "Em y = A sen(Bx+C)+D, período = 2π/|B|."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de y=sen(πx) = ?
        correctAnswer: 2
        rationale: "Em y = A sen(Bx+C)+D, período = 2π/|B|."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Se período = 2π/k, k para período 90° = ?
        correctAnswer: 4
        rationale: "Em y = A sen(Bx+C)+D, período = 2π/|B|."
        difficulty: 3
        objectives: [trig.graphs]
  - pageNumber: 7
    title: Deslocamentos Verticais
    description: y = sen(x) + c desloca verticalmente.
    exercises:
      - type: trigonometry
        question: Máximo de y = sen(x) + 2 = ?
        correctAnswer: 3
        rationale: "Em y = sen/cos(x) + D, máx/mín ocorrem em D±1."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Mínimo de y = sen(x) + 2 = ?
        correctAnswer: 1
        rationale: "Em y = sen/cos(x) + D, máx/mín ocorrem em D±1."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Máximo de y = cos(x) - 1 = ?
        correctAnswer: 0
        rationale: "Em y = sen/cos(x) + D, máx/mín ocorrem em D±1."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Mínimo de y = cos(x) - 1 = ?
        correctAnswer: -2
        rationale: "Em y = sen/cos(x) + D, máx/mín ocorrem em D±1."
        difficulty: 3
        objectives: [trig.graphs]
      - type: trigonometry
        question: Linha central de y=sen(x)+5 = ?
        correctAnswer: 5
        rationale: "Em y = f(x)+D, linha central (eixo médio) é y = D."
        difficulty: 3
        objectives: [trig.graphs]
  - pageNumber: 8
    title: Deslocamentos Horizontais
    description: y = sen(x-φ) desloca horizontalmente.
    exercises:
      - type: trigonometry
        question: sen(x-90°) = ?
        correctAnswer: -cos(x)
        rationale: "Redução: sen(x − 90°) = −cos x."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: cos(x-90°) = ?
        correctAnswer: sen(x)
        rationale: "Redução: cos(x − 90°) = sen x."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: sen(x+180°) = ?
        correctAnswer: -sen(x)
        rationale: "Redução: sen(x + 180°) = −sen x."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: cos(x+180°) = ?
        correctAnswer: -cos(x)
        rationale: "Redução: cos(x + 180°) = −cos x."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: "sen e cos diferem por um deslocamento de: ?°"
        correctAnswer: 90
        rationale: "cos x = sen(x + 90°): defasagem de 90°."
        difficulty: 4
        objectives: [trig.graphs]
  - pageNumber: 9
    title: Raízes do Gráfico
    description: Zeros de sen e cos.
    exercises:
      - type: trigonometry
        question: Zeros de sen(x) em [0°,360°] (primeira) = ?
        correctAnswer: 0
        rationale: "sen x = 0 em x = 0°, 180°, 360°."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Zeros de sen(x) em [0°,360°] — segunda = ?
        correctAnswer: 180°
        rationale: "sen x = 0 em x = 0°, 180°, 360°."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Zeros de cos(x) em [0°,360°] — primeira = ?
        correctAnswer: 90°
        rationale: "cos x = 0 em x = 90°, 270°."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Zeros de cos(x) em [0°,360°] — segunda = ?
        correctAnswer: 270°
        rationale: "cos x = 0 em x = 90°, 270°."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: "Quantos zeros cos(x) tem em [0°,360°)?"
        correctAnswer: 2
        rationale: "cos x = 0 em 90° e 270°: 2 zeros em [0°,360°)."
        difficulty: 4
        objectives: [trig.graphs]
  - pageNumber: 10
    title: Revisão Integrada
    description: Identifique propriedades.
    exercises:
      - type: trigonometry
        question: Amplitude de y=2·sen(3x) + 1 = ?
        correctAnswer: 2
        rationale: "Em y = A sen(Bx+C)+D, amplitude = |A|."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Período de y=sen(4x) = ?
        correctAnswer: 90°
        rationale: "Em y = A sen(Bx+C)+D, período = 2π/|B|."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Linha central de y=2·cos(x)+5 = ?
        correctAnswer: 5
        rationale: "Em y = f(x)+D, linha central (eixo médio) é y = D."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Máximo de y=3·sen(x) = ?
        correctAnswer: 3
        rationale: "Em y = A·sen x, máximo = |A|."
        difficulty: 4
        objectives: [trig.graphs]
      - type: trigonometry
        question: Mínimo de y=3·sen(x) = ?
        correctAnswer: -3
        rationale: "Em y = A·sen x, mínimo = −|A|."
        difficulty: 4
        objectives: [trig.graphs]
target: 50
