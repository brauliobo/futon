title: Gráficos de Seno e Cosseno
level: M
subject: math
authorNotes: Gráficos de Seno e Cosseno. Foque no conceito central do conjunto e
  nos erros comuns.
inputType: text
difficulty: 3
objectives:
  - trig.graphs
example: y = sen(x) tem período 2π e amplitude 1
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Características Básicas — prática 1
    description: Domínio, imagem, período, amplitude.
    exercises:
      - type: trigonometry
        question: Domínio de sen(x) = ?
        correctAnswer: ℝ
        rationale: "sen está definida para todo real: domínio = ℝ."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: Imagem de sen(x) = ?
        correctAnswer: "[-1,1]"
        rationale: "sen oscila entre −1 e 1: imagem = [−1, 1]."
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: Período de sen(x) em graus = ?
        correctAnswer: 360°
        rationale: Em y = A sen(Bx+C)+D, período = 2π/|B|.
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: Amplitude de sen(x) = ?
        correctAnswer: 1
        rationale: Em y = A sen(Bx+C)+D, amplitude = |A|.
        difficulty: 2
        objectives:
          - trig.graphs
      - type: trigonometry
        question: sen(0) = ?
        correctAnswer: 0
        rationale: "Valor notável: sen 0 = 0 (eixo x no ciclo)."
        difficulty: 2
        objectives:
          - trig.graphs
