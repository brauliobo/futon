        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: Hipotenusa é o diâmetro do círculo circunscrito (V/F)?
        correctAnswer: V
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
