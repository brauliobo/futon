title: Lei dos Senos
level: M
subject: math
inputType: number
difficulty: 4
objectives:
  - trig.triangles
example: a/sen(A) = b/sen(B) = c/sen(C) = 2R
pages:
  - pageNumber: 1
    title: Enunciado
    description: Razão constante em qualquer triângulo.
    exercises:
      - type: trigonometry
        question: a/sen(A) = b/sen(B) = c/sen(?)
        correctAnswer: C
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: "a/sen(A) é igual a: (2R/R/π)"
        correctAnswer: 2R
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se a=10 e sen(A)=0.5, 2R = ?
        correctAnswer: 20
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se 2R=10, a com sen(A)=1 = ?
        correctAnswer: 10
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Vale em qualquer triângulo? (sim/não)
        correctAnswer: sim
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 3
        objectives: [trig.triangles]
  - pageNumber: 2
    title: Aplicação Direta
    description: Encontre lados dados ângulos.
    exercises:
      - type: trigonometry
        question: a=10, A=30°, B=60°, b = ?
        correctAnswer: 10√3
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=5, A=45°, B=90°, b = ?
        correctAnswer: 5√2
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=8, A=30°, C=90°, c = ?
        correctAnswer: 16
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=6, A=60°, B=30°, b = ?
        correctAnswer: 2√3
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=12, A=90°, B=60°, b = ?
        correctAnswer: 6√3
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 3
        objectives: [trig.triangles]
  - pageNumber: 3
    title: Determinar Ângulos
    description: A partir de dois lados e um ângulo.
    exercises:
      - type: trigonometry
        question: a=6, b=4, A=60°, sen(B) = (4·sen60°)/6 ≈ ?
        correctAnswer: 0.577
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: B (agudo) quando sen(B)=0.5 = ?
        correctAnswer: 30°
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se sen(B)=√2/2, B no 1º quadrante = ?
        correctAnswer: 45°
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se sen(B)=1, B = ?
        correctAnswer: 90°
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: "Se sen(B)>1, o triângulo: (existe/não existe)"
        correctAnswer: não existe
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
        difficulty: 3
        objectives: [trig.triangles]
  - pageNumber: 4
    title: Caso Ambíguo
    description: SSA pode ter 0, 1 ou 2 triângulos.
    exercises:
      - type: trigonometry
        question: "Configuração SSA com sen(B)<1 e ângulo B obtuso possível → casos: (1 ou 2/sempre 1)"
        correctAnswer: 1 ou 2
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se o ângulo é obtuso, só há caso único (V/F)?
        correctAnswer: V
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: "Se sen(B)=1, caso é: (único/ambíguo)"
        correctAnswer: único
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: "Se sen(B)>1, triângulo: (existe/não existe)"
        correctAnswer: não existe
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se sen(B)<1 e A<B, há 2 triângulos (V/F)?
        correctAnswer: V
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
        difficulty: 3
        objectives: [trig.triangles]
  - pageNumber: 5
    title: Relação com o Circuncentro
    description: 2R é o diâmetro da circunferência circunscrita.
    exercises:
      - type: trigonometry
        question: "a/sen(A) = 2R, onde R é o raio da circunferência: (circunscrita/inscrita)"
        correctAnswer: circunscrita
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: Em triângulo equilátero lado 6, R = 6/√3 ≈ ?
        correctAnswer: 3.46
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: Em triângulo equilátero com R=2, lado = ?
        correctAnswer: 2√3
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se a=10 e A=30°, R = ?
        correctAnswer: 10
        rationale: "Use identidades para reduzir expressões antes de calcular."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se a=5, A=90°, R = ?
        correctAnswer: 2.5
        rationale: "Domine valores exatos dos ângulos notáveis."
        difficulty: 4
        objectives: [trig.triangles]
  - pageNumber: 6
    title: Triângulos Retângulos
