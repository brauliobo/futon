title: Progressão Aritmética (PA)
level: M
subject: math
inputType: number
difficulty: 3
objectives:
  - series.arithmetic
example: aₙ = a₁ + (n-1)·r
pages:
  - pageNumber: 1
    title: Termo Geral
    description: aₙ = a₁ + (n-1)·r.
    exercises:
      - type: sequence
        question: a₁=2, r=3, a₅ = ?
        correctAnswer: 14
        rationale: "Identifique o padrão (diferença ou razão constante)."
      - type: sequence
        question: a₁=5, r=2, a₁₀ = ?
        correctAnswer: 23
        rationale: "Identifique o padrão (diferença ou razão constante)."
      - type: sequence
        question: a₁=1, r=1, a₁₀₀ = ?
        correctAnswer: 100
        rationale: "Identifique o padrão (diferença ou razão constante)."
      - type: sequence
        question: a₁=10, r=-2, a₆ = ?
        correctAnswer: 0
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: sequence
        question: a₁=0, r=5, a₁₀ = ?
        correctAnswer: 45
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
  - pageNumber: 2
    title: Razão
    description: r = aₙ - aₙ₋₁.
    exercises:
      - type: sequence
        question: PA {2,5,8,11,...} — razão = ?
        correctAnswer: 3
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: sequence
        question: PA {10,7,4,1,...} — razão = ?
        correctAnswer: -3
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: sequence
        question: PA {1,1,1,...} — razão = ?
        correctAnswer: 0
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: sequence
        question: a₂=6, a₁=2 → r = ?
        correctAnswer: 4
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: sequence
        question: a₃-a₂ = ?
        correctAnswer: r
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
  - pageNumber: 3
    title: Soma da PA
    description: Sₙ = (a₁+aₙ)·n/2.
    exercises:
      - type: sequence
        question: "PA 1,2,3,...,10: S₁₀ = ?"
        correctAnswer: 55
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: sequence
        question: "PA 2,4,6,...,20: S₁₀ = ?"
        correctAnswer: 110
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: sequence
        question: "PA 5,10,15,...,50: S₁₀ = ?"
        correctAnswer: 275
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: sequence
        question: "PA 1,3,5,...,99: Soma = ?"
        correctAnswer: 2500
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: sequence
        question: "Soma dos n primeiros ímpares = n². Para n=20: ?"
        correctAnswer: 400
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
  - pageNumber: 4
    title: PA com Termos Desconhecidos
    description: Resolva em função dos dados.
    exercises:
      - type: sequence
        question: a₁=3, a₁₀=21, r = (21-3)/9 = ?
        correctAnswer: 2
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: sequence
        question: a₁=4, a₈=32, r = (32-4)/7 = ?
        correctAnswer: 4
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: sequence
        question: a₁=1, aₙ=50, r=1, n = ?
        correctAnswer: 50
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: sequence
        question: a₁=10, r=3, qual n tem aₙ=34?
        correctAnswer: 9
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: sequence
        question: Se a₅=20 e a₁₀=40, r = ?
        correctAnswer: 4
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
  - pageNumber: 5
    title: Aplicações
    description: Contextos.
    exercises:
      - type: sequence
        question: Degraus cresceram 2 cm cada degrau, iniciou em 15 cm — 10º degrau = ?
        correctAnswer: 33
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: sequence
        question: Poupança — R$100, aumenta R$50/mês. No 12º mês = ?
        correctAnswer: 650
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: sequence
        question: Soma 1+2+3+...+100 = ?
        correctAnswer: 5050
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: sequence
        question: Soma 1+3+5+...+(2n-1) = ?
        correctAnswer: n²
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: sequence
        question: Soma 2+4+6+...+2n = ?
        correctAnswer: n(n+1)
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
  - pageNumber: 6
    title: Propriedades
    description: Termo médio.
    exercises:
      - type: sequence
        question: "Em PA, termo médio = (a₁ + aₙ)/? "
        correctAnswer: 2
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: sequence
        question: "PA {3,5,7}: termo médio = ?"
        correctAnswer: 5
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: sequence
        question: Em PA de 5 termos com soma 25, termo central = ?
        correctAnswer: 5
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: sequence
        question: Se 3 números estão em PA e somam 15, termo do meio = ?
        correctAnswer: 5
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: sequence
        question: a_m + a_n = a_(m+n) em PA? (sim/não)
        correctAnswer: não
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
  - pageNumber: 7
    title: PA Crescente, Decrescente, Constante
    description: Classificação por razão.
    exercises:
      - type: sequence
        question: "PA com r>0 é: (crescente)"
        correctAnswer: crescente
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: sequence
        question: "PA com r<0 é: (decrescente)"
        correctAnswer: decrescente
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: sequence
        question: "PA com r=0 é: (constante)"
        correctAnswer: constante
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: sequence
        question: "{5,5,5,...} é PA? (sim/não)"
        correctAnswer: sim
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: sequence
        question: "{10,7,4,1,-2,...} — classificação?"
        correctAnswer: decrescente
        rationale: "Use identidades para reduzir expressões antes de calcular."
  - pageNumber: 8
    title: Soma Parcial
    description: Use a fórmula em fatias.
    exercises:
      - type: sequence
        question: "PA 1,2,3,...,50: S₅₀ = ?"
        correctAnswer: 1275
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: sequence
        question: PA 2,4,6,...,100 — soma dos pares até 100 = ?
        correctAnswer: 2550
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: sequence
        question: PA {3,7,11,...} — S₁₀ (a₁=3, r=4) = ?
        correctAnswer: 210
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: sequence
        question: Soma de 1 a n = n(n+1)/2. n=20 → ?
        correctAnswer: 210
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: sequence
        question: Soma de 1 a 1000 = ?
        correctAnswer: 500500
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
  - pageNumber: 9
    title: Inversa
    description: Soma em ordem reversa.
    exercises:
      - type: sequence
        question: Somar 1+2+3+...+n ou n+...+1 dá o mesmo valor (V/F)?
        correctAnswer: V
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: sequence
        question: Gauss percebeu que pares 1+n, 2+(n-1) somam sempre n+1 (V/F)?
        correctAnswer: V
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: sequence
        question: Número de pares em 1..n (n par) = ?
        correctAnswer: n/2
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: sequence
        question: Soma Gauss de 1..10 = 5·11 = ?
        correctAnswer: 55
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: sequence
        question: Soma Gauss de 1..100 = 50·101 = ?
        correctAnswer: 5050
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
  - pageNumber: 10
    title: Revisão Integrada
    description: Mistura.
    exercises:
      - type: sequence
        question: a₁=7, r=3, a₂₀ = ?
        correctAnswer: 64
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: sequence
        question: "S₂₀ quando a₁=7, r=3: (a₁+a₂₀)·20/2 = ?"
        correctAnswer: 710
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: sequence
        question: "PA com 10 termos de 1 a 19 (pares ímpares): razão = ?"
        correctAnswer: 2
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: sequence
        question: Soma 1 a 200 = ?
        correctAnswer: 20100
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: sequence
        question: Se aₙ = 3n-1, a₁ = ?
        correctAnswer: 2
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
target: 50
