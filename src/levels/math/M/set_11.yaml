    title: Ângulos Obtusos — prática 1
    description: cos negativo ⇒ ângulo obtuso.
    exercises:
      - type: trigonometry
        question: "Se cos(C) < 0, C é: (obtuso/agudo/reto)"
        correctAnswer: obtuso
        rationale: "cos < 0 em (90°,180°): ângulo obtuso."
        difficulty: 3
        objectives:
          - trig.triangles
      - type: trigonometry
        question: "Se cos(C) > 0 e ≠1, C é: (agudo)"
