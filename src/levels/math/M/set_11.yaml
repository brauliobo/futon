  - pageNumber: 9
    title: Área (Fórmula de Heron) — prática 1
    description: Para qualquer triângulo com lados conhecidos.
    exercises:
      - type: trigonometry
        question: p (semiperímetro) = (a+b+c)/?
        correctAnswer: 2
        rationale: "Semiperímetro: p = (a+b+c)/2."
        difficulty: 4
        objectives:
          - trig.triangles
      - type: trigonometry
        question: Para a=3, b=4, c=5, p = ?
        correctAnswer: 6
        rationale: "Semiperímetro: p = (a+b+c)/2."
        difficulty: 4
        objectives:
          - trig.triangles
      - type: trigonometry
        question: A = √(p(p-a)(p-b)(p-c)) → √(6·3·2·1) = ?
        correctAnswer: 6
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 4
        objectives:
          - trig.triangles
      - type: trigonometry
        question: Para a=b=c=6, p = ?
        correctAnswer: 9
        rationale: "Semiperímetro do equilátero: p = 3L/2."
        difficulty: 4
        objectives:
          - trig.triangles
      - type: trigonometry
        question: A equilátero lado 6 = √(9·3·3·3) = ?
        correctAnswer: 9√3
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 4
        objectives:
          - trig.triangles
