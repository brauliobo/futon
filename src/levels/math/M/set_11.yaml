title: Lei dos Cossenos
level: M
subject: math
inputType: number
difficulty: 4
objectives:
  - trig.triangles
example: c² = a² + b² - 2ab·cos(C)
pages:
  - pageNumber: 1
    title: Enunciado
    description: Generalização de Pitágoras.
    exercises:
      - type: trigonometry
        question: c² = a² + b² - 2ab·cos(?)
        correctAnswer: C
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: "Se C=90°, a lei vira: (Pitágoras/lei dos senos)"
        correctAnswer: Pitágoras
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: cos(90°) = ?
        correctAnswer: 0
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: c² = a² + b² quando C = ?°
        correctAnswer: 90
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: Vale em qualquer triângulo (V/F)?
        correctAnswer: V
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
  - pageNumber: 2
    title: Calculando Lado
    description: Dados dois lados e o ângulo incluído.
    exercises:
      - type: trigonometry
        question: "a=3, b=4, C=60°: c² = 9+16-12 = ?"
        correctAnswer: 13
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: Portanto c ≈ ?
        correctAnswer: 3.6
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: "a=5, b=5, C=60°: c² = 50-25 = ?"
        correctAnswer: 25
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: Portanto c = ?
        correctAnswer: 5
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: "a=6, b=8, C=90°: c² = ?"
        correctAnswer: 100
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
  - pageNumber: 3
    title: Calculando Ângulo
    description: Com três lados conhecidos.
    exercises:
      - type: trigonometry
        question: a=3, b=4, c=5 — cos(C) = (9+16-25)/(24) = ?
        correctAnswer: 0
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: Portanto C = ?°
        correctAnswer: 90°
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: a=5, b=5, c=5 — cos(C) = ?
        correctAnswer: 0.5
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: Portanto C = ?°
        correctAnswer: 60°
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: a=7, b=8, c=9 — cos(C) = (49+64-81)/(112) = 32/112 = ?
        correctAnswer: 0.286
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
  - pageNumber: 4
    title: Ângulos Obtusos
    description: cos negativo ⇒ ângulo obtuso.
    exercises:
      - type: trigonometry
        question: "Se cos(C) < 0, C é: (agudo/obtuso/reto)"
        correctAnswer: obtuso
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: "Se cos(C) > 0 e ≠1, C é: (agudo)"
        correctAnswer: agudo
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: "Se cos(C) = 0, C é: (reto)"
        correctAnswer: reto
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: a=3, b=5, c=7 → cos(C) = (9+25-49)/30 = -15/30 = ?
        correctAnswer: -0.5
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: Portanto C = ?°
        correctAnswer: 120°
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
  - pageNumber: 5
    title: Área (Fórmula de Heron)
    description: Para qualquer triângulo com lados conhecidos.
    exercises:
      - type: trigonometry
        question: p (semiperímetro) = (a+b+c)/?
        correctAnswer: 2
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: Para a=3, b=4, c=5, p = ?
        correctAnswer: 6
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: trigonometry
        question: A = √(p(p-a)(p-b)(p-c)) → √(6·3·2·1) = ?
        correctAnswer: 6
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: Para a=b=c=6, p = ?
        correctAnswer: 9
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: A equilátero lado 6 = √(9·3·3·3) = ?
        correctAnswer: 9√3
        rationale: "Domine valores exatos dos ângulos notáveis."
  - pageNumber: 6
    title: Aplicações
    description: Exemplos numéricos.
    exercises:
      - type: trigonometry
        question: "a=7, b=9, C=45°: c² = 49+81-126·(√2/2) = 130 - 63√2 ≈ ?"
        correctAnswer: 40.89
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: "a=10, b=10, C=120°: c² = 100+100-200·(-0.5) = 300. c = ?"
        correctAnswer: 10√3
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: trigonometry
        question: "a=4, b=6, C=30°: c² = 16+36-48·(√3/2) ≈ ?"
        correctAnswer: 10.43
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: "a=b=5, C=90° : c² = 50. c = ?"
        correctAnswer: 5√2
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: "a=3, b=4, C=120°: c² = 25-24·(-0.5) = 37. c ≈ ?"
        correctAnswer: 6.08
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
  - pageNumber: 7
    title: Lei Reorganizada
    description: Resolver para cos(C).
    exercises:
      - type: trigonometry
        question: cos(C) = (a²+b²-c²)/(2ab) (V/F)?
        correctAnswer: V
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: "Se a=5, b=5, c=√50: cos(C) = 0 → C = ?°"
        correctAnswer: 90°
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: "Se triângulo tem 3 lados iguais: cos(C) = ?"
        correctAnswer: 0.5
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: "a=3, b=4, c=√7: cos(C) = (9+16-7)/24 = ?"
        correctAnswer: 0.75
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: trigonometry
        question: "a=5, b=12, c=13: cos(C) = 0 (V/F)?"
        correctAnswer: V
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
  - pageNumber: 8
    title: Comparação com Lei dos Senos
    description: Quando usar cada uma.
    exercises:
      - type: trigonometry
        question: "SSS (3 lados): usar (lei dos cossenos/senos)"
        correctAnswer: lei dos cossenos
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: "SAS (dois lados e ângulo incluído): usar (lei dos cossenos/senos)"
        correctAnswer: lei dos cossenos
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: "AAS (dois ângulos e um lado): usar (senos/cossenos)"
        correctAnswer: senos
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: "ASA (um lado entre dois ângulos): usar (senos/cossenos)"
        correctAnswer: senos
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: trigonometry
        question: "SSA (ambíguo): usar (senos/cossenos)"
        correctAnswer: senos
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
  - pageNumber: 9
    title: Verificação
    description: Teste se lados formam triângulo.
    exercises:
      - type: trigonometry
        question: "Desigualdade triangular: a+b > c (V/F)?"
        correctAnswer: V
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: a=2, b=3, c=6 — forma triângulo? (sim/não)
        correctAnswer: não
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: a=3, b=4, c=5 — forma triângulo? (sim/não)
        correctAnswer: sim
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: a=5, b=5, c=5 — área (aprox) = ?
        correctAnswer: 10.83
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: a=10, b=10, c=20 — forma triângulo? (sim/não)
        correctAnswer: não
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplicação mista.
    exercises:
      - type: trigonometry
        question: a=6, b=8, C=90° — c = ?
        correctAnswer: 10
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: trigonometry
        question: Para a=b=c=4, C = ?°
        correctAnswer: 60°
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: a=7, b=24, C=90° — c = ?
        correctAnswer: 25
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: Triângulo com lados 3,4,5 tem área = ?
        correctAnswer: 6
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: Triângulo equilátero lado 4 tem área = ?
        correctAnswer: 4√3
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
target: 50
