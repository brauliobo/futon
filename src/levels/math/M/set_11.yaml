        difficulty: 3
        objectives:
          - trig.triangles
      - type: trigonometry
        question: Se cos(C) = -0.5, então C = ?°
        correctAnswer: 120°
        rationale: "Arco-cosseno: C = arccos(-0.5) = 120°."
        difficulty: 3
        objectives:
          - trig.triangles
