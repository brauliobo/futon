        rationale: "Lei dos cossenos: c² = a² + b² − 2ab·cos C."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: "a=10, b=10, C=120°: c² = 100+100-200·(-0.5) = 300. c = ?"
        correctAnswer: 10√3
        rationale: "Lei dos cossenos: c² = a² + b² − 2ab·cos C."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: "a=4, b=6, C=30°: c² = 16+36-48·(√3/2) ≈ ?"
        correctAnswer: 10.43
        rationale: "Lei dos cossenos: c² = a² + b² − 2ab·cos C."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: "a=b=5, C=90° : c² = 50. c = ?"
        correctAnswer: 5√2
        rationale: "Lei dos cossenos: c² = a² + b² − 2ab·cos C."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: "a=3, b=4, C=120°: c² = 25-24·(-0.5) = 37. c ≈ ?"
        correctAnswer: 6.08
        rationale: "Lei dos cossenos: c² = a² + b² − 2ab·cos C."
        difficulty: 4
        objectives: [trig.triangles]
  - pageNumber: 7
    title: Lei Reorganizada
    description: Resolver para cos(C).
    exercises:
      - type: trigonometry
        question: cos(C) = (a²+b²-c²)/(2ab) (V/F)?
        correctAnswer: V
        rationale: "Lei dos cossenos isolando cos C: cos C = (a²+b²−c²)/(2ab)."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: "Se a=5, b=5, c=√50: cos(C) = 0 → C = ?°"
        correctAnswer: 90°
        rationale: "cos C = 0 via lei dos cossenos ⇒ C = 90°."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: "Se triângulo tem 3 lados iguais: cos(C) = ?"
        correctAnswer: 0.5
        rationale: "Lei dos cossenos em equilátero: cos 60° = 1/2."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: "a=3, b=4, c=√7: cos(C) = (9+16-7)/24 = ?"
        correctAnswer: 0.75
        rationale: "Lei dos cossenos isolando cos C: cos C = (a²+b²−c²)/(2ab)."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: "a=5, b=12, c=13: cos(C) = 0 (V/F)?"
        correctAnswer: V
        rationale: "Lei dos cossenos: cos C = (a²+b²−c²)/(2ab)."
        difficulty: 4
        objectives: [trig.triangles]
  - pageNumber: 8
    title: Comparação com Lei dos Senos
    description: Quando usar cada uma.
    exercises:
      - type: trigonometry
        question: "SSS (3 lados): usar (lei dos cossenos/senos)"
        correctAnswer: lei dos cossenos
        rationale: "Lei dos cossenos: c² = a² + b² − 2ab cos C."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: "SAS (dois lados e ângulo incluído): usar (lei dos cossenos/senos)"
        correctAnswer: lei dos cossenos
        rationale: "Lei dos cossenos: c² = a² + b² − 2ab cos C."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: "AAS (dois ângulos e um lado): usar (senos/cossenos)"
        correctAnswer: senos
        rationale: "Com ângulo e lado oposto conhecidos, use a lei dos senos."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: "ASA (um lado entre dois ângulos): usar (senos/cossenos)"
        correctAnswer: senos
        rationale: "Com ângulo e lado oposto conhecidos, use a lei dos senos."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: "SSA (ambíguo): usar (senos/cossenos)"
        correctAnswer: senos
        rationale: "Com ângulo e lado oposto conhecidos, use a lei dos senos."
        difficulty: 5
        objectives: [trig.triangles]
  - pageNumber: 9
    title: Verificação
    description: Teste se lados formam triângulo.
    exercises:
      - type: trigonometry
        question: "Desigualdade triangular: a+b > c (V/F)?"
        correctAnswer: V
        rationale: "Desigualdade triangular: a + b > c em todo triângulo."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=2, b=3, c=6 — forma triângulo? (sim/não)
        correctAnswer: não
        rationale: "Verifique desigualdade triangular: a+b>c (e permutações)."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=3, b=4, c=5 — forma triângulo? (sim/não)
        correctAnswer: sim
        rationale: "Verifique desigualdade triangular: a+b>c (e permutações)."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=5, b=5, c=5 — área (aprox) = ?
        correctAnswer: 10.83
        rationale: "Área do equilátero: A = L²·√3/4."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=10, b=10, c=20 — forma triângulo? (sim/não)
        correctAnswer: não
        rationale: "Verifique desigualdade triangular: a+b>c (e permutações)."
        difficulty: 5
        objectives: [trig.triangles]
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplicação mista.
    exercises:
      - type: trigonometry
        question: a=6, b=8, C=90° — c = ?
        correctAnswer: 10
        rationale: "Pitágoras: c² = a² + b² (caso de cos 90° = 0)."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: Para a=b=c=4, C = ?°
        correctAnswer: 60°
        rationale: "Equilátero tem todos os ângulos iguais a 60°."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=7, b=24, C=90° — c = ?
        correctAnswer: 25
        rationale: "Pitágoras: c² = a² + b² (caso de cos 90° = 0)."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: Triângulo com lados 3,4,5 tem área = ?
        correctAnswer: 6
        rationale: "3-4-5 é retângulo; área = ½·3·4 = 6."
        difficulty: 5
        objectives: [trig.triangles]
      - type: trigonometry
        question: Triângulo equilátero lado 4 tem área = ?
        correctAnswer: 4√3
        rationale: "Área do equilátero: A = L²·√3/4."
        difficulty: 5
        objectives: [trig.triangles]
target: 50
