title: Lei dos Cossenos
level: M
subject: math
authorNotes: "Lei dos Cossenos. Foque no conceito central do conjunto e nos erros comuns."
inputType: text
difficulty: 4
objectives:
  - trig.triangles
example: c² = a² + b² - 2ab·cos(C)
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Enunciado
    description: Generalização de Pitágoras.
    exercises:
      - type: trigonometry
        question: c² = a² + b² - 2ab·cos(?)
        correctAnswer: C
        rationale: "Lei dos cossenos — ângulo C oposto ao lado c."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: "Se C=90°, a lei vira: (Pitágoras/lei dos senos)"
        correctAnswer: Pitágoras
        rationale: "Lei dos senos: a/sen A = b/sen B = c/sen C."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: cos(90°) = ?
        correctAnswer: 0
        rationale: "Valor notável: cos 90° = 0 (topo do ciclo)."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: c² = a² + b² quando C = ?°
        correctAnswer: 90
        rationale: "Produto notável: (a±b)² = a² ± 2ab + b²."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Vale em qualquer triângulo (V/F)?
        correctAnswer: V
        rationale: "Lei dos senos/cossenos valem para qualquer triângulo."
        difficulty: 3
        objectives: [trig.triangles]
  - pageNumber: 2
    title: Calculando Lado
    description: Dados dois lados e o ângulo incluído.
    exercises:
      - type: trigonometry
        question: "a=3, b=4, C=60°: c² = 9+16-12 = ?"
        correctAnswer: 13
        rationale: "Lei dos cossenos: c² = a² + b² − 2ab·cos C."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Portanto c ≈ ?
        correctAnswer: 3.6
        rationale: "Lei dos cossenos: c = √(a² + b² − 2ab·cos C)."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: "a=5, b=5, C=60°: c² = 50-25 = ?"
        correctAnswer: 25
        rationale: "Lei dos cossenos: c² = a² + b² − 2ab·cos C."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Portanto c = ?
        correctAnswer: 5
        rationale: "Lei dos cossenos: c = √(a² + b² − 2ab·cos C)."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: "a=6, b=8, C=90°: c² = ?"
        correctAnswer: 100
        rationale: "Lei dos cossenos: c² = a² + b² − 2ab·cos C."
        difficulty: 3
        objectives: [trig.triangles]
  - pageNumber: 3
    title: Calculando Ângulo
    description: Com três lados conhecidos.
    exercises:
      - type: trigonometry
        question: a=3, b=4, c=5 — cos(C) = (9+16-25)/(24) = ?
        correctAnswer: 0
        rationale: "Lei dos cossenos isolando cos C: cos C = (a²+b²−c²)/(2ab)."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se cos(C) = 0, então C = ?°
        correctAnswer: 90°
        rationale: "Arco-cosseno: C = arccos(0) = 90°."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=5, b=5, c=5 — cos(C) = ?
        correctAnswer: 0.5
        rationale: "Lei dos cossenos: cos C = (a²+b²−c²)/(2ab)."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se cos(C) = 0.5, então C = ?°
        correctAnswer: 60°
        rationale: "Arco-cosseno: C = arccos(0.5) = 60°."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=7, b=8, c=9 — cos(C) = (49+64-81)/(112) = 32/112 = ?
        correctAnswer: 0.286
        rationale: "Lei dos cossenos isolando cos C: cos C = (a²+b²−c²)/(2ab)."
        difficulty: 3
        objectives: [trig.triangles]
  - pageNumber: 4
    title: Ângulos Obtusos
    description: cos negativo ⇒ ângulo obtuso.
    exercises:
      - type: trigonometry
        question: "Se cos(C) < 0, C é: (agudo/obtuso/reto)"
        correctAnswer: obtuso
        rationale: "cos < 0 em (90°,180°): ângulo obtuso."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: "Se cos(C) > 0 e ≠1, C é: (agudo)"
        correctAnswer: agudo
        rationale: "cos > 0 em (0°, 90°): ângulo agudo."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: "Se cos(C) = 0, C é: (reto)"
        correctAnswer: reto
        rationale: "cos 90° = 0: ângulo reto."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: a=3, b=5, c=7 → cos(C) = (9+25-49)/30 = -15/30 = ?
        correctAnswer: -0.5
        rationale: "Lei dos cossenos isolando cos C: cos C = (a²+b²−c²)/(2ab)."
        difficulty: 3
        objectives: [trig.triangles]
      - type: trigonometry
        question: Se cos(C) = -0.5, então C = ?°
        correctAnswer: 120°
        rationale: "Arco-cosseno: C = arccos(-0.5) = 120°."
        difficulty: 3
        objectives: [trig.triangles]
  - pageNumber: 5
    title: Área (Fórmula de Heron)
    description: Para qualquer triângulo com lados conhecidos.
    exercises:
      - type: trigonometry
        question: p (semiperímetro) = (a+b+c)/?
        correctAnswer: 2
        rationale: "Semiperímetro: p = (a+b+c)/2."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: Para a=3, b=4, c=5, p = ?
        correctAnswer: 6
        rationale: "Semiperímetro: p = (a+b+c)/2."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: A = √(p(p-a)(p-b)(p-c)) → √(6·3·2·1) = ?
        correctAnswer: 6
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: Para a=b=c=6, p = ?
        correctAnswer: 9
        rationale: "Semiperímetro do equilátero: p = 3L/2."
        difficulty: 4
        objectives: [trig.triangles]
      - type: trigonometry
        question: A equilátero lado 6 = √(9·3·3·3) = ?
        correctAnswer: 9√3
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 4
        objectives: [trig.triangles]
  - pageNumber: 6
    title: Aplicações
    description: Exemplos numéricos.
    exercises:
      - type: trigonometry
        question: "a=7, b=9, C=45°: c² = 49+81-126·(√2/2) = 130 - 63√2 ≈ ?"
