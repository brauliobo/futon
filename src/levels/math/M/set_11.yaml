pages:
  - pageNumber: 1
    title: Enunciado — prática 1
    description: Generalização de Pitágoras.
    exercises:
      - type: trigonometry
        question: c² = a² + b² - 2ab·cos(?)
        correctAnswer: C
        rationale: Lei dos cossenos — ângulo C oposto ao lado c.
        difficulty: 3
        objectives:
          - trig.triangles
      - type: trigonometry
        question: "Se C=90°, a lei vira: (lei dos senos/Pitágoras)"
        correctAnswer: Pitágoras
        rationale: "Lei dos senos: a/sen A = b/sen B = c/sen C."
        difficulty: 3
        objectives:
          - trig.triangles
      - type: trigonometry
        question: cos(90°) = ?
        correctAnswer: 0
        rationale: "Valor notável: cos 90° = 0 (topo do ciclo)."
        difficulty: 3
        objectives:
          - trig.triangles
      - type: trigonometry
        question: c² = a² + b² quando C = ?°
        correctAnswer: 90
        rationale: "Produto notável: (a±b)² = a² ± 2ab + b²."
        difficulty: 3
        objectives:
          - trig.triangles
      - type: trigonometry
        question: Vale em qualquer triângulo (V/F)?
        correctAnswer: V
        rationale: Lei dos senos/cossenos valem para qualquer triângulo.
        difficulty: 3
        objectives:
          - trig.triangles
