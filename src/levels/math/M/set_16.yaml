title: Números Complexos — Forma Algébrica
level: M
subject: math
inputType: number
difficulty: 4
objectives:
  - complex.algebraic
example: z = a + bi; i² = -1
pages:
  - pageNumber: 1
    title: Definição
    description: i² = -1; z = a + bi.
    exercises:
      - type: algebra
        question: i² = ?
        correctAnswer: -1
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: i³ = ?
        correctAnswer: -i
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: i⁴ = ?
        correctAnswer: 1
        rationale: "Isole a incógnita usando operações inversas."
      - type: algebra
        question: Em z=3+2i, parte real = ?
        correctAnswer: 3
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: algebra
        question: Em z=3+2i, parte imaginária = ?
        correctAnswer: 2
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
  - pageNumber: 2
    title: Soma
    description: (a+bi) + (c+di) = (a+c) + (b+d)i.
    exercises:
      - type: algebra
        question: (2+3i) + (1+4i) = ? + 7i
        correctAnswer: 3
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: algebra
        question: (5-2i) + (3+5i) = 8 + ?i
        correctAnswer: 3
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: algebra
        question: (7+i) + (-7-i) = ?
        correctAnswer: 0
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: algebra
        question: (a+bi) + 0 = ?
        correctAnswer: a+bi
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: algebra
        question: (1+i) + (1-i) = ?
        correctAnswer: 2
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
  - pageNumber: 3
    title: Subtração
    description: Mesmo que soma com sinal invertido.
    exercises:
      - type: algebra
        question: (5+3i) - (2+i) = ? + 2i
        correctAnswer: 3
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: algebra
        question: (4-i) - (1-3i) = 3 + ?i
        correctAnswer: 2
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: algebra
        question: (1+i) - (1+i) = ?
        correctAnswer: 0
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: algebra
        question: (0-i) - (0-i) = ?
        correctAnswer: 0
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: algebra
        question: (7+2i) - (3+5i) = ? + ?i
        correctAnswer: 4 - 3i
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
  - pageNumber: 4
    title: Multiplicação
    description: (a+bi)(c+di) = (ac-bd) + (ad+bc)i.
    exercises:
      - type: algebra
        question: (1+i)(1-i) = ?
        correctAnswer: 2
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: algebra
        question: (2+i)(3+2i) = ? + 7i
        correctAnswer: 4
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: algebra
        question: (1+i)² = ?
        correctAnswer: 2i
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: algebra
        question: (1-i)² = ?
        correctAnswer: -2i
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: algebra
        question: i · i = ?
        correctAnswer: -1
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
  - pageNumber: 5
    title: Conjugado
    description: conjugado de a+bi é a-bi.
    exercises:
      - type: algebra
        question: Conjugado de 3+4i = ?
        correctAnswer: 3-4i
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: algebra
        question: Conjugado de -2-i = ?
        correctAnswer: -2+i
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: algebra
        question: Conjugado de 5 = ?
        correctAnswer: 5
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: algebra
        question: Conjugado de 2i = ?
        correctAnswer: -2i
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: algebra
        question: z · z̄ = ?
        correctAnswer: a² + b²
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
  - pageNumber: 6
    title: Módulo
    description: Módulo — raiz de (a² + b²).
    exercises:
      - type: algebra
        question: "|3+4i| = ?"
        correctAnswer: 5
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: algebra
        question: "|1+i| = ?"
        correctAnswer: √2
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: algebra
        question: "|5| = ?"
        correctAnswer: 5
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: algebra
        question: "|2i| = ?"
        correctAnswer: 2
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: algebra
        question: "|6+8i| = ?"
        correctAnswer: 10
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
  - pageNumber: 7
    title: Divisão
    description: Multiplique pelo conjugado do denominador.
    exercises:
      - type: algebra
        question: (1+i)/(1-i) · (1+i)/(1+i) = (1+i)²/2 = ?
        correctAnswer: i
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: algebra
        question: (3+4i)/(3-4i) — módulo = ?
        correctAnswer: 1
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: algebra
        question: 1/i = ?
        correctAnswer: -i
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: algebra
        question: 1/(1+i) — multiplicamos por (1-i)/(1-i) → (1-i)/2. Real = ?
        correctAnswer: 1/2
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: algebra
        question: Imaginária da divisão acima = ?
        correctAnswer: -1/2
        rationale: "Use identidades para reduzir expressões antes de calcular."
  - pageNumber: 8
    title: Potências de i
    description: Cíclico a cada 4.
    exercises:
      - type: algebra
        question: i¹ = ?
        correctAnswer: i
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: algebra
        question: i² = ?
        correctAnswer: -1
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: algebra
        question: i³ = ?
        correctAnswer: -i
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: algebra
        question: i⁴ = ?
        correctAnswer: 1
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: algebra
        question: i^n com n = 10 mod 4 = 2 → i^10 = ?
        correctAnswer: -1
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
  - pageNumber: 9
    title: Equações Quadráticas
    description: Raízes complexas.
    exercises:
      - type: algebra
        question: x² + 1 = 0 → x = ?
        correctAnswer: ±i
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: algebra
        question: x² + 4 = 0 → x = ?
        correctAnswer: ±2i
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: algebra
        question: x² - 2x + 5 = 0 tem discriminante = (4-20) = ?
        correctAnswer: -16
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: algebra
        question: Então raízes = 1 ± ?i
        correctAnswer: 2
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: algebra
        question: Raízes complexas aparecem em pares conjugados (V/F)?
        correctAnswer: V
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
  - pageNumber: 10
    title: Revisão Integrada
    description: Misture operações.
    exercises:
      - type: algebra
        question: (2+3i)(2-3i) = ?
        correctAnswer: 13
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: algebra
        question: "|2+3i|² = ?"
        correctAnswer: 13
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: algebra
        question: (1+i)⁴ = ?
        correctAnswer: -4
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: algebra
        question: 1/(2+i) em forma a+bi — real = ?
        correctAnswer: 2/5
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: algebra
        question: Mesma — imaginária = ?
        correctAnswer: -1/5
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
target: 50
