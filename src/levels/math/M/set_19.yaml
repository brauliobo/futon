title: Identidades e Equações — Revisão
level: M
subject: math
authorNotes: "Identidades e Equações — Revisão. Foque no conceito central do conjunto e nos erros comuns."
inputType: number
difficulty: 4
objectives:
  - trig.review
example: Aplique combinações de identidades para simplificar.
pages:
  - pageNumber: 1
    title: Simplificação
    description: Use identidades fundamentais.
    exercises:
      - type: trigonometry
        question: sen²(x)/cos²(x) = ?
        correctAnswer: tan²(x)
        rationale: "sen/cos = tan, logo sen²/cos² = tan²."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: 1 - cos²(x) = ?
        correctAnswer: sen²(x)
        rationale: "Rearranjo de sen²+cos²=1: 1 − cos²x = sen²x."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: sec²(x) - 1 = ?
        correctAnswer: tan²(x)
        rationale: "De 1 + tan²x = sec²x: sec²x − 1 = tan²x."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: sen(2x)/2 = ?
        correctAnswer: sen(x)cos(x)
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x, logo sen(2x)/2 = sen x cos x."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: cos(2x) + 1 = ?
        correctAnswer: 2cos²(x)
        rationale: "Arco duplo: 1 + cos(2x) = 2 cos²x."
        difficulty: 3
        objectives: [trig.review]
  - pageNumber: 2
    title: Arco Duplo
    description: Revisão rápida.
    exercises:
      - type: trigonometry
        question: sen(2·30°) = ?
        correctAnswer: √3/2
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: cos(2·30°) = ?
        correctAnswer: 1/2
        rationale: "Arco duplo: cos(2x) = cos²x − sen²x = 1 − 2 sen²x."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: tan(2·30°) via 2tan/(1-tan²) = (2·(1/√3))/(1-1/3) = ?
        correctAnswer: √3
        rationale: "Arco duplo: tan(2x) = 2 tan x / (1 − tan²x)."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: sen(2·45°) = ?
        correctAnswer: 1
        rationale: "Arco duplo: sen(2x) = 2 sen x cos x."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: cos(2·45°) = ?
        correctAnswer: 0
        rationale: "Arco duplo: cos(2x) = cos²x − sen²x = 1 − 2 sen²x."
        difficulty: 3
        objectives: [trig.review]
  - pageNumber: 3
    title: Arco Metade
    description: Revisão.
    exercises:
      - type: trigonometry
        question: sen(x/2) = ±√((1-cos x)/2). Se cos(x)=0, sen(x/2)² = ?
        correctAnswer: 1/2
        rationale: "Arco metade: sen(x/2) = ±√((1 − cos x)/2)."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: Então sen(x/2) agudo = ?
        correctAnswer: √2/2
        rationale: "Arco metade: sen(x/2) = ±√((1 − cos x)/2)."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: cos(x/2) com cos(x)=1/2 (agudo) = ?
        correctAnswer: √3/2
        rationale: "Arco metade: cos(x/2) = ±√((1 + cos x)/2)."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: tan(x/2) com sen(x)=4/5, cos(x)=3/5 = (1-cos x)/sen x = ?
        correctAnswer: 1/2
        rationale: "Arco metade: tan(x/2) = ±√((1 − cos x)/(1 + cos x))."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: Se x=60°, x/2=30°. sen(30°) = ?
        correctAnswer: 1/2
        rationale: "sen 30° = 1/2 (ângulo notável)."
        difficulty: 3
        objectives: [trig.review]
  - pageNumber: 4
    title: Soma / Diferença
    description: Valores compostos.
    exercises:
      - type: trigonometry
        question: sen(30°+60°) = ?
        correctAnswer: 1
        rationale: "Use sen(a+b) = sen a cos b + cos a sen b."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: cos(30°+60°) = ?
        correctAnswer: 0
        rationale: "Use cos(a+b) = cos a cos b − sen a sen b."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: sen(45°+45°) = ?
        correctAnswer: 1
        rationale: "Use sen(a+b) = sen a cos b + cos a sen b."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: cos(45°+45°) = ?
        correctAnswer: 0
        rationale: "Use cos(a+b) = cos a cos b − sen a sen b."
        difficulty: 3
        objectives: [trig.review]
      - type: trigonometry
        question: sen(60°-30°) = ?
        correctAnswer: 1/2
        rationale: "Use sen(a−b) = sen a cos b − cos a sen b."
        difficulty: 3
        objectives: [trig.review]
  - pageNumber: 5
    title: Equações Simples
    description: sen, cos, tan = k.
    exercises:
      - type: trigonometry
        question: sen(x)=1 → x em [0°,360°) = ?
        correctAnswer: 90°
        rationale: "sen x = 1 ⇒ x = π/2 + 2kπ."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: cos(x)=0 → número de soluções em [0°,360°)?
        correctAnswer: 2
        rationale: "cos x = 0 ⇒ x = π/2 + kπ, k ∈ ℤ."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: tan(x)=0 → número de soluções em [0°,360°)?
        correctAnswer: 2
        rationale: "tan x = 0 ⇒ x = kπ."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: sen(x)=-1 → única solução em [0°,360°) = ?
        correctAnswer: 270°
        rationale: "sen x = −1 ⇒ x = 3π/2 + 2kπ."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: cos(x)=1 → x em [0°,360°) = ?
        correctAnswer: 0
        rationale: "cos x = 1 ⇒ x = 2kπ."
        difficulty: 4
        objectives: [trig.review]
  - pageNumber: 6
    title: Equações Quadráticas Trig
    description: Substitua u=sen(x) ou cos(x).
    exercises:
      - type: trigonometry
        question: 2sen²(x) - 1 = 0 → sen²(x) = ?
        correctAnswer: 1/2
        rationale: "Isole: sen²x = 1/2 ⇒ sen x = ±√2/2."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: Então sen(x) = ? (positivo)
        correctAnswer: √2/2
        rationale: "Tome a raiz positiva: √(1/2) = √2/2."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: 2cos²(x) - 1 = 0 → cos(x) = ? (positivo)
        correctAnswer: √2/2
        rationale: "Isole: cos²x = 1/2 ⇒ cos x = ±√2/2."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: sen²(x) - sen(x) = 0 → sen(x)=0 ou sen(x)=?
        correctAnswer: 1
        rationale: "sen x = 0 ⇒ x = kπ, k ∈ ℤ."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: 2cos²(x) + cos(x) - 1 = 0 → cos(x) = 1/2 ou ?
        correctAnswer: -1
        rationale: "cos x = 1 ⇒ x = 2kπ."
        difficulty: 4
        objectives: [trig.review]
  - pageNumber: 7
    title: Identidades Compostas
    description: Combinações.
    exercises:
      - type: trigonometry
        question: tan(x) + cot(x) = (sen²+cos²)/(sen·cos) = ?·csc(x)·sec(x)? = 2·csc(2x)
        correctAnswer: 2·csc(2x)
        rationale: "Identidade fundamental: sen²x + cos²x = 1."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: 1 - cos(2x) = ?·sen²(x)
        correctAnswer: 2
        rationale: "De cos(2x) = 1 − 2sen²x: 1 − cos(2x) = 2 sen²x."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: sen(a+b)·sen(a-b) = sen²(a) - ?
        correctAnswer: sen²(b)
        rationale: "Produto: sen(a+b)·sen(a−b) = sen²a − sen²b."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: cos(a+b)·cos(a-b) = cos²(a) - ?
        correctAnswer: sen²(b)
        rationale: "Produto: cos(a+b)·cos(a−b) = cos²a − sen²b."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: sen(3x) = 3sen(x) - 4sen³(x) (V/F)?
        correctAnswer: V
        rationale: "Triplo de arco: sen(3x) = 3 sen x − 4 sen³x."
        difficulty: 4
        objectives: [trig.review]
  - pageNumber: 8
    title: Valores Notáveis
    description: Revise.
    exercises:
      - type: trigonometry
        question: sen(15°) = (√6-√2)/4 (V/F)?
        correctAnswer: V
        rationale: "Valor via soma/diferença: sen/cos(45° − 30°)."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: cos(15°) = (√6+√2)/4 (V/F)?
        correctAnswer: V
        rationale: "Valor via soma/diferença: sen/cos(45° − 30°)."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: tan(15°) = 2 - √3 (V/F)?
        correctAnswer: V
        rationale: "tan 15° = 2 − √3 (via soma/diferença)."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: sen(75°) = (√6+√2)/4 (V/F)?
        correctAnswer: V
        rationale: "Valor via soma: sen/cos(45° + 30°)."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: cos(75°) = (√6-√2)/4 (V/F)?
        correctAnswer: V
        rationale: "Valor via soma: sen/cos(45° + 30°)."
        difficulty: 4
        objectives: [trig.review]
  - pageNumber: 9
    title: Inversas
    description: Relembre os valores.
    exercises:
      - type: trigonometry
        question: arcsen(1/2) = ?°
        correctAnswer: 30
        rationale: "arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: arccos(1/2) = ?°
        correctAnswer: 60
        rationale: "arccos dá ângulo em [0, π] com cos igual ao valor dado."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: arctan(1) = ?°
        correctAnswer: 45
        rationale: "arctan dá ângulo em (−π/2, π/2) com tan igual ao valor dado."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: arcsen(0) = ?°
        correctAnswer: 0
        rationale: "arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: arccos(-1) = ?°
        correctAnswer: 180
        rationale: "arccos dá ângulo em [0, π] com cos igual ao valor dado."
        difficulty: 4
        objectives: [trig.review]
  - pageNumber: 10
    title: Revisão Integrada
    description: Problemas mistos.
    exercises:
      - type: trigonometry
        question: sen²(30°) + cos²(30°) = ?
        correctAnswer: 1
        rationale: "Identidade fundamental: sen²x + cos²x = 1."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: sen(60°) + cos(60°) = ?
        correctAnswer: (√3+1)/2
        rationale: "sen 60° + cos 60° = √3/2 + 1/2 = (√3+1)/2."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: tan(45°) · cot(45°) = ?
        correctAnswer: 1
        rationale: "tan 45° = cot 45° = 1 ⇒ produto = 1."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: sen(90°+x) = ?
        correctAnswer: cos(x)
        rationale: "Redução: sen(90°+x) = cos x."
        difficulty: 4
        objectives: [trig.review]
      - type: trigonometry
        question: cos(90°+x) = ?
        correctAnswer: -sen(x)
        rationale: "Redução: cos(90°+x) = −sen x."
        difficulty: 4
        objectives: [trig.review]
target: 50
