title: Séries de Taylor — Introdução
level: M
subject: math
inputType: number
difficulty: 4
objectives:
  - series.taylor
example: e^x = 1 + x + x²/2! + x³/3! + ...
pages:
  - pageNumber: 1
    title: Conceito
    description: Aproximar função por polinômio.
    exercises:
      - type: calculus
        question: "Série de Taylor representa função como: (soma infinita de potências/matriz)"
        correctAnswer: soma infinita de potências
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: "Taylor em torno de x=0 também se chama: (Maclaurin/Fourier)"
        correctAnswer: Maclaurin
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: f(x) = f(0) + f'(0)x + f''(0)x²/2! + ... (V/F)?
        correctAnswer: V
        rationale: "Regra do quociente: (f/g)' = (f'g - fg')/g²."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: "Aproximação linear (1º grau) de f em 0: f(0) + f'(0)·?"
        correctAnswer: x
        rationale: "Regra do produto: (fg)' = f'g + fg'."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: "Coeficiente do termo xⁿ na Taylor: f^(n)(0)/? "
        correctAnswer: n!
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 3
        objectives: [series.taylor]
  - pageNumber: 2
    title: e^x
    description: Série de Maclaurin.
    exercises:
      - type: calculus
        question: e^x = 1 + x + x²/2! + ? + ...
        correctAnswer: x³/3!
        rationale: "Equação linear: isole x aplicando operações inversas."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: e^0 = ?
        correctAnswer: 1
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: "Primeiros 3 termos de e^x em x=1: 1+1+0.5 = ?"
        correctAnswer: 2.5
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: e ≈ 2.71828 (V/F)?
        correctAnswer: V
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: Σ xⁿ/n! converge para todo x? (sim/não)
        correctAnswer: sim
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 3
        objectives: [series.taylor]
  - pageNumber: 3
    title: sen(x) e cos(x)
    description: Séries alternadas.
    exercises:
      - type: calculus
        question: sen(x) = x - x³/3! + x⁵/5! - ? + ...
        correctAnswer: x⁷/7!
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: cos(x) = 1 - x²/2! + x⁴/4! - ? + ...
        correctAnswer: x⁶/6!
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: sen(0) pela série = ?
        correctAnswer: 0
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: cos(0) pela série = ?
        correctAnswer: 1
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: Duas primeiras parcelas de sen(0.1) = 0.1 - 0.1³/6 ≈ ?
        correctAnswer: 0.0998
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [series.taylor]
  - pageNumber: 4
    title: ln(1+x)
    description: Convergente para -1 < x ≤ 1.
    exercises:
      - type: calculus
        question: ln(1+x) = x - x²/2 + x³/3 - ? + ...
        correctAnswer: x⁴/4
        rationale: "ln é log na base e; ln(eˣ) = x."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: ln(1) = ?
        correctAnswer: 0
        rationale: "ln é log na base e; ln(eˣ) = x."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: "ln(2) com 3 termos em x=1: 1 - 1/2 + 1/3 = ?"
        correctAnswer: 0.833
        rationale: "ln é log na base e; ln(eˣ) = x."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: Valor exato de ln(2) ≈ ?
        correctAnswer: 0.693
        rationale: "ln é log na base e; ln(eˣ) = x."
        difficulty: 3
        objectives: [series.taylor]
      - type: calculus
        question: "Série ln(1+x) não converge em x > ? "
        correctAnswer: 1
        rationale: "ln é log na base e; ln(eˣ) = x."
        difficulty: 3
        objectives: [series.taylor]
  - pageNumber: 5
    title: 1/(1-x) (Geométrica)
    description: 1 + x + x² + x³ + ...
    exercises:
      - type: calculus
        question: 1/(1-x) = 1 + x + x² + ? + ...
        correctAnswer: x³
        rationale: "Combine termos semelhantes somando coeficientes."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: Converge para |x| < ?
        correctAnswer: 1
        rationale: "Inequação: isole x; inverta o sinal ao multiplicar por negativo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: 1/(1-0.5) = 2; soma dos primeiros 4 termos = 1+0.5+0.25+0.125 = ?
        correctAnswer: 1.875
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: 1/(1-1) é definido? (sim/não)
        correctAnswer: não
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: Série diverge se |x| ≥ ?
        correctAnswer: 1
        rationale: "Inequação: isole x; inverta o sinal ao multiplicar por negativo."
        difficulty: 4
        objectives: [series.taylor]
  - pageNumber: 6
    title: Raio de Convergência
    description: R = raio em que série converge.
    exercises:
      - type: calculus
        question: "e^x: R = ?"
        correctAnswer: ∞
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: "sen(x): R = ?"
        correctAnswer: ∞
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: "ln(1+x): R = ?"
        correctAnswer: 1
        rationale: "ln é log na base e; ln(eˣ) = x."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: "1/(1-x): R = ?"
        correctAnswer: 1
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: Série de Taylor converge ao menos dentro do raio de convergência (V/F)?
        correctAnswer: V
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
  - pageNumber: 7
    title: Aplicação — Aproximação
    description: Use Taylor para estimar valores.
    exercises:
      - type: calculus
        question: e^0.1 ≈ 1 + 0.1 + 0.01/2 + ... primeiros 3 termos = ?
        correctAnswer: 1.105
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: Valor real de e^0.1 ≈ ?
        correctAnswer: 1.1052
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: cos(0.1) ≈ 1 - 0.01/2 + ... primeiros 2 termos = ?
        correctAnswer: 0.995
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: "Erro quando aumentamos termos: (diminui/aumenta)"
        correctAnswer: diminui
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: Maior x → preciso (mais/menos) termos
        correctAnswer: mais
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
  - pageNumber: 8
    title: Diferenciação Termo a Termo
    description: Derivar a série como polinômio.
    exercises:
      - type: calculus
        question: "d/dx(e^x) série: (e^x/sen(x))"
        correctAnswer: e^x
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: "d/dx(sen x) série: (cos x/-sen x)"
        correctAnswer: cos x
        rationale: "Derivadas: (sen x)' = cos x, (cos x)' = -sen x."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: "d/dx(cos x) série: (-sen x/sen x)"
        correctAnswer: -sen x
        rationale: "Derivadas: (sen x)' = cos x, (cos x)' = -sen x."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: "d/dx(1/(1-x)) série: (1/(1-x)²/(1-x))"
        correctAnswer: 1/(1-x)²
        rationale: "Regra do quociente: (f/g)' = (f'g - fg')/g²."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: "d/dx(ln(1+x)) série: (1/(1+x)/(1+x))"
        correctAnswer: 1/(1+x)
        rationale: "Derivadas: (eˣ)' = eˣ, (ln x)' = 1/x."
        difficulty: 4
        objectives: [series.taylor]
  - pageNumber: 9
    title: Integração Termo a Termo
    description: Integrar como polinômio.
    exercises:
      - type: calculus
        question: ∫ e^x dx = e^x + C (V/F)?
        correctAnswer: V
        rationale: "Integrais: ∫eˣ dx = eˣ + C; ∫(1/x) dx = ln|x| + C."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: ∫ sen(x) dx = -cos(x) + C (V/F)?
        correctAnswer: V
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: ∫ 1/(1-x) dx = -ln|1-x| + C (V/F)?
        correctAnswer: V
        rationale: "Anti-derivada: ∫xⁿ dx = xⁿ⁺¹/(n+1) + C."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: "Integração de série é: (termo a termo dentro do raio)"
        correctAnswer: termo a termo dentro do raio
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: ∫ cos x dx = sen x + C (V/F)?
        correctAnswer: V
        rationale: "Integrais: ∫sen x dx = -cos x + C; ∫cos x dx = sen x + C."
        difficulty: 4
        objectives: [series.taylor]
  - pageNumber: 10
    title: Revisão Integrada
    description: Mistura.
    exercises:
      - type: calculus
        question: e^x em x=1 (primeiros 4 termos) ≈ ?
        correctAnswer: 2.667
        rationale: "Potências: aᵐ·aⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁻ⁿ = 1/aⁿ."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: e ≈ ? (valor real)
        correctAnswer: 2.718
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: sen(π) via série converge para ?
        correctAnswer: 0
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: cos(0) via série = ?
        correctAnswer: 1
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
      - type: calculus
        question: 1/(1-0.5) via série = ?
        correctAnswer: 2
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [series.taylor]
target: 50
