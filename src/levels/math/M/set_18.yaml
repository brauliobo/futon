title: Séries de Taylor — Introdução
level: M
subject: math
inputType: number
difficulty: 5
objectives:
  - series.taylor
example: e^x = 1 + x + x²/2! + x³/3! + ...
pages:
  - pageNumber: 1
    title: Conceito
    description: Aproximar função por polinômio.
    exercises:
      - type: calculus
        question: "Série de Taylor representa função como: (soma infinita de potências/matriz)"
        correctAnswer: soma infinita de potências
        rationale: "Aplique a regra de derivação/integração correspondente."
      - type: calculus
        question: "Taylor em torno de x=0 também se chama: (Maclaurin/Fourier)"
        correctAnswer: Maclaurin
        rationale: "Aplique a regra de derivação/integração correspondente."
      - type: calculus
        question: f(x) = f(0) + f'(0)x + f''(0)x²/2! + ... (V/F)?
        correctAnswer: V
        rationale: "Aplique a regra de derivação/integração correspondente."
      - type: calculus
        question: "Aproximação linear (1º grau) de f em 0: f(0) + f'(0)·?"
        correctAnswer: x
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: calculus
        question: "Coeficiente do termo xⁿ na Taylor: f^(n)(0)/? "
        correctAnswer: n!
        rationale: "Domine valores exatos dos ângulos notáveis."
  - pageNumber: 2
    title: e^x
    description: Série de Maclaurin.
    exercises:
      - type: calculus
        question: e^x = 1 + x + x²/2! + ? + ...
        correctAnswer: x³/3!
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: calculus
        question: e^0 = ?
        correctAnswer: 1
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: calculus
        question: "Primeiros 3 termos de e^x em x=1: 1+1+0.5 = ?"
        correctAnswer: 2.5
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: calculus
        question: e ≈ 2.71828 (V/F)?
        correctAnswer: V
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: calculus
        question: Σ xⁿ/n! converge para todo x? (sim/não)
        correctAnswer: sim
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
  - pageNumber: 3
    title: sen(x) e cos(x)
    description: Séries alternadas.
    exercises:
      - type: calculus
        question: sen(x) = x - x³/3! + x⁵/5! - ? + ...
        correctAnswer: x⁷/7!
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: calculus
        question: cos(x) = 1 - x²/2! + x⁴/4! - ? + ...
        correctAnswer: x⁶/6!
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: calculus
        question: sen(0) pela série = ?
        correctAnswer: 0
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: calculus
        question: cos(0) pela série = ?
        correctAnswer: 1
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: calculus
        question: Duas primeiras parcelas de sen(0.1) = 0.1 - 0.1³/6 ≈ ?
        correctAnswer: 0.0998
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
  - pageNumber: 4
    title: ln(1+x)
    description: Convergente para -1 < x ≤ 1.
    exercises:
      - type: calculus
        question: ln(1+x) = x - x²/2 + x³/3 - ? + ...
        correctAnswer: x⁴/4
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: calculus
        question: ln(1) = ?
        correctAnswer: 0
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: calculus
        question: "ln(2) com 3 termos em x=1: 1 - 1/2 + 1/3 = ?"
        correctAnswer: 0.833
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: calculus
        question: Valor exato de ln(2) ≈ ?
        correctAnswer: 0.693
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: calculus
        question: "Série ln(1+x) não converge em x > ? "
        correctAnswer: 1
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
  - pageNumber: 5
    title: 1/(1-x) (Geométrica)
    description: 1 + x + x² + x³ + ...
    exercises:
      - type: calculus
        question: 1/(1-x) = 1 + x + x² + ? + ...
        correctAnswer: x³
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: calculus
        question: Converge para |x| < ?
        correctAnswer: 1
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: calculus
        question: 1/(1-0.5) = 2; soma dos primeiros 4 termos = 1+0.5+0.25+0.125 = ?
        correctAnswer: 1.875
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: calculus
        question: 1/(1-1) é definido? (sim/não)
        correctAnswer: não
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: calculus
        question: Série diverge se |x| ≥ ?
        correctAnswer: 1
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
  - pageNumber: 6
    title: Raio de Convergência
    description: R = raio em que série converge.
    exercises:
      - type: calculus
        question: "e^x: R = ?"
        correctAnswer: ∞
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: calculus
        question: "sen(x): R = ?"
        correctAnswer: ∞
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: calculus
        question: "ln(1+x): R = ?"
        correctAnswer: 1
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: calculus
        question: "1/(1-x): R = ?"
        correctAnswer: 1
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: calculus
        question: Série de Taylor converge ao menos dentro do raio de convergência (V/F)?
        correctAnswer: V
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
  - pageNumber: 7
    title: Aplicação — Aproximação
    description: Use Taylor para estimar valores.
    exercises:
      - type: calculus
        question: e^0.1 ≈ 1 + 0.1 + 0.01/2 + ... primeiros 3 termos = ?
        correctAnswer: 1.105
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: calculus
        question: Valor real de e^0.1 ≈ ?
        correctAnswer: 1.1052
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: calculus
        question: cos(0.1) ≈ 1 - 0.01/2 + ... primeiros 2 termos = ?
        correctAnswer: 0.995
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: calculus
        question: "Erro quando aumentamos termos: (diminui/aumenta)"
        correctAnswer: diminui
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: calculus
        question: Maior x → preciso (mais/menos) termos
        correctAnswer: mais
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
  - pageNumber: 8
    title: Diferenciação Termo a Termo
    description: Derivar a série como polinômio.
    exercises:
      - type: calculus
        question: "d/dx(e^x) série: (e^x/sen(x))"
        correctAnswer: e^x
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: calculus
        question: "d/dx(sen x) série: (cos x/-sen x)"
        correctAnswer: cos x
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: calculus
        question: "d/dx(cos x) série: (-sen x/sen x)"
        correctAnswer: -sen x
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: calculus
        question: "d/dx(1/(1-x)) série: (1/(1-x)²/(1-x))"
        correctAnswer: 1/(1-x)²
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: calculus
        question: "d/dx(ln(1+x)) série: (1/(1+x)/(1+x))"
        correctAnswer: 1/(1+x)
        rationale: "Use identidades para reduzir expressões antes de calcular."
  - pageNumber: 9
    title: Integração Termo a Termo
    description: Integrar como polinômio.
    exercises:
      - type: calculus
        question: ∫ e^x dx = e^x + C (V/F)?
        correctAnswer: V
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: calculus
        question: ∫ sen(x) dx = -cos(x) + C (V/F)?
        correctAnswer: V
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: calculus
        question: ∫ 1/(1-x) dx = -ln|1-x| + C (V/F)?
        correctAnswer: V
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: calculus
        question: "Integração de série é: (termo a termo dentro do raio)"
        correctAnswer: termo a termo dentro do raio
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: calculus
        question: ∫ cos x dx = sen x + C (V/F)?
        correctAnswer: V
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
  - pageNumber: 10
    title: Revisão Integrada
    description: Mistura.
    exercises:
      - type: calculus
        question: e^x em x=1 (primeiros 4 termos) ≈ ?
        correctAnswer: 2.667
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: calculus
        question: e ≈ ? (valor real)
        correctAnswer: 2.718
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: calculus
        question: sen(π) via série converge para ?
        correctAnswer: 0
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: calculus
        question: cos(0) via série = ?
        correctAnswer: 1
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: calculus
        question: 1/(1-0.5) via série = ?
        correctAnswer: 2
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
target: 50
