title: Funções Trigonométricas Inversas
level: M
subject: math
inputType: number
difficulty: 4
objectives:
  - trig.inverse_functions
example: arcsen(1/2) = 30°
pages:
  - pageNumber: 1
    title: Arcsen — Valores Básicos
    description: arcsen retorna o ângulo em [-π/2, π/2].
    exercises:
      - type: trigonometry
        question: arcsen(0) = ?
        correctAnswer: 0
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: arcsen(1) = ?
        correctAnswer: 90°
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: arcsen(1/2) = ?
        correctAnswer: 30°
        rationale: "Consulte o ciclo trigonométrico."
      - type: trigonometry
        question: arcsen(√2/2) = ?
        correctAnswer: 45°
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: arcsen(√3/2) = ?
        correctAnswer: 60°
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
  - pageNumber: 2
    title: Arcsen — Negativos
    description: Retorna ângulos no intervalo [-90°, 0°].
    exercises:
      - type: trigonometry
        question: arcsen(-1/2) = ?
        correctAnswer: -30°
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: arcsen(-√2/2) = ?
        correctAnswer: -45°
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: arcsen(-√3/2) = ?
        correctAnswer: -60°
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: arcsen(-1) = ?
        correctAnswer: -90°
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: arcsen(-0) = ?
        correctAnswer: 0
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
  - pageNumber: 3
    title: Arccos — Valores Básicos
    description: arccos retorna ângulos em [0°, 180°].
    exercises:
      - type: trigonometry
        question: arccos(1) = ?
        correctAnswer: 0
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: arccos(0) = ?
        correctAnswer: 90°
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: arccos(-1) = ?
        correctAnswer: 180°
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: arccos(1/2) = ?
        correctAnswer: 60°
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: arccos(√3/2) = ?
        correctAnswer: 30°
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
  - pageNumber: 4
    title: Arccos — Negativos
    description: Valores negativos retornam ângulos no 2º quadrante.
    exercises:
      - type: trigonometry
        question: arccos(-1/2) = ?
        correctAnswer: 120°
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: arccos(-√2/2) = ?
        correctAnswer: 135°
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: arccos(-√3/2) = ?
        correctAnswer: 150°
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: arccos(√2/2) = ?
        correctAnswer: 45°
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: arccos(-0) = ?
        correctAnswer: 90°
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
  - pageNumber: 5
    title: Arctan
    description: arctan retorna ângulos em (-90°, 90°).
    exercises:
      - type: trigonometry
        question: arctan(0) = ?
        correctAnswer: 0
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: arctan(1) = ?
        correctAnswer: 45°
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: trigonometry
        question: arctan(-1) = ?
        correctAnswer: -45°
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: arctan(√3) = ?
        correctAnswer: 60°
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: arctan(-√3) = ?
        correctAnswer: -60°
        rationale: "Domine valores exatos dos ângulos notáveis."
  - pageNumber: 6
    title: Composição com Trig
    description: sen(arcsen x) = x quando x ∈ [-1,1].
    exercises:
      - type: trigonometry
        question: sen(arcsen(0.5)) = ?
        correctAnswer: 0.5
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: cos(arccos(1)) = ?
        correctAnswer: 1
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: trigonometry
        question: tan(arctan(5)) = ?
        correctAnswer: 5
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
      - type: trigonometry
        question: arcsen(sen(30°)) = ?
        correctAnswer: 30°
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: arccos(cos(60°)) = ?
        correctAnswer: 60°
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
  - pageNumber: 7
    title: Composição Mista
    description: Exemplo — cos(arcsen(3/5)) usando triângulo.
    exercises:
      - type: trigonometry
        question: cos(arcsen(3/5)) = ?
        correctAnswer: 4/5
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: sen(arccos(4/5)) = ?
        correctAnswer: 3/5
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: tan(arcsen(5/13)) = ?
        correctAnswer: 5/12
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
      - type: trigonometry
        question: cos(arctan(1)) = ?
        correctAnswer: √2/2
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: trigonometry
        question: sen(arctan(3/4)) = ?
        correctAnswer: 3/5
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
  - pageNumber: 8
    title: Domínio e Imagem
    description: arcsen/arccos têm domínio [-1,1].
    exercises:
      - type: trigonometry
        question: "Domínio de arcsen(x) é: ([-1,1]/[0,∞)/ℝ/[0,π])"
        correctAnswer: "[-1,1]"
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: "Imagem de arcsen(x) é: ([-90°,90°]/[0°,180°]/[0°,360°])"
        correctAnswer: "[-90°,90°]"
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: "Imagem de arccos(x) é: ([-90°,90°]/[0°,180°]/[0°,360°])"
        correctAnswer: "[0°,180°]"
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
      - type: trigonometry
        question: "Imagem de arctan(x) é: ((-90°,90°)/[0°,180°]/[0°,360°])"
        correctAnswer: (-90°,90°)
        rationale: "Arco duplo: sen(2a) = 2 sen a · cos a."
      - type: trigonometry
        question: arcsen(2) existe? (sim/não)
        correctAnswer: não
        rationale: "Arco duplo: cos(2a) = cos²a - sen²a = 1 - 2 sen²a."
  - pageNumber: 9
    title: Identidades com Inversas
    description: arcsen(x)+arccos(x) = π/2.
    exercises:
      - type: trigonometry
        question: arcsen(x) + arccos(x) = ?
        correctAnswer: 90°
        rationale: "Fórmulas de prostaférese convertem soma ↔ produto."
      - type: trigonometry
        question: arcsen(0.5) + arccos(0.5) = ?
        correctAnswer: 90°
        rationale: "Série: soma dos n primeiros termos de uma PA/PG."
      - type: trigonometry
        question: arctan(x) + arctan(1/x) = ?° (x>0)
        correctAnswer: 90°
        rationale: "PA: Sₙ = n(a₁ + aₙ)/2."
      - type: trigonometry
        question: arcsen(-x) = ?
        correctAnswer: -arcsen(x)
        rationale: "PG finita: Sₙ = a₁(1 - q^n)/(1 - q), q ≠ 1."
      - type: trigonometry
        question: arccos(-x) = ? - arccos(x)
        correctAnswer: 180°
        rationale: "PG infinita (|q| < 1): S = a₁/(1 - q)."
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplicações práticas.
    exercises:
      - type: trigonometry
        question: "O ângulo cuja tangente é 1 é: (em graus)"
        correctAnswer: 45°
        rationale: "lei dos senos: a/sen A = b/sen B = c/sen C = 2R."
      - type: trigonometry
        question: "O ângulo cujo seno é √3/2 (agudo) é: (em graus)"
        correctAnswer: 60°
        rationale: "lei dos cossenos: a² = b² + c² - 2bc·cos A."
      - type: trigonometry
        question: Se sen(θ)=0.6 (agudo), θ ≈ ? graus
        correctAnswer: 36.87°
        rationale: "Use identidades para reduzir expressões antes de calcular."
      - type: trigonometry
        question: sec(arctan(√3)) = ?
        correctAnswer: 2
        rationale: "Domine valores exatos dos ângulos notáveis."
      - type: trigonometry
        question: sen(arcsen(-1)) = ?
        correctAnswer: -1
        rationale: "Identidades: sen(a±b), cos(a±b), tan(a±b)."
target: 50
