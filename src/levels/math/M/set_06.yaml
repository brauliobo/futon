  - pageNumber: 9
    title: Identidades com Inversas
    description: arcsen(x)+arccos(x) = π/2.
    exercises:
      - type: trigonometry
        question: arcsen(x) + arccos(x) = ?
        correctAnswer: 90°
        rationale: arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado.
        difficulty: 4
        objectives:
          - trig.inverse_functions
      - type: trigonometry
        question: arcsen(0.5) + arccos(0.5) = ?
        correctAnswer: 90°
        rationale: arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado.
        difficulty: 4
        objectives:
          - trig.inverse_functions
      - type: trigonometry
        question: arctan(x) + arctan(1/x) = ?° (x>0)
        correctAnswer: 90°
        rationale: "Inequação: isole x; inverta o sinal ao multiplicar por negativo."
        difficulty: 4
        objectives:
          - trig.inverse_functions
      - type: trigonometry
        question: arcsen(-x) = ?
        correctAnswer: -arcsen(x)
        rationale: "Paridade: sen é ímpar, sen(−x) = −sen x."
        difficulty: 4
        objectives:
          - trig.inverse_functions
      - type: trigonometry
        question: arccos(-x) = ? - arccos(x)
        correctAnswer: 180°
        rationale: "Paridade: cos é par, cos(−x) = cos x."
        difficulty: 4
        objectives:
          - trig.inverse_functions
