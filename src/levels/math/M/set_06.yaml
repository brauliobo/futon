title: Funções Trigonométricas Inversas
level: M
subject: math
inputType: number
difficulty: 3
objectives:
  - trig.inverse_functions
example: arcsen(1/2) = 30°
pages:
  - pageNumber: 1
    title: Arcsen — Valores Básicos
    description: arcsen retorna o ângulo em [-π/2, π/2].
    exercises:
      - type: trigonometry
        question: arcsen(0) = ?
        correctAnswer: 0
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(1) = ?
        correctAnswer: 90°
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(1/2) = ?
        correctAnswer: 30°
        rationale: "Opere a fração conforme a regra correspondente."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(√2/2) = ?
        correctAnswer: 45°
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(√3/2) = ?
        correctAnswer: 60°
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 2
        objectives: [trig.inverse_functions]
  - pageNumber: 2
    title: Arcsen — Negativos
    description: Retorna ângulos no intervalo [-90°, 0°].
    exercises:
      - type: trigonometry
        question: arcsen(-1/2) = ?
        correctAnswer: -30°
        rationale: "Mesmo denominador: subtraia numeradores; diferentes: use MMC."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(-√2/2) = ?
        correctAnswer: -45°
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(-√3/2) = ?
        correctAnswer: -60°
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(-1) = ?
        correctAnswer: -90°
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(-0) = ?
        correctAnswer: 0
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
  - pageNumber: 3
    title: Arccos — Valores Básicos
    description: arccos retorna ângulos em [0°, 180°].
    exercises:
      - type: trigonometry
        question: arccos(1) = ?
        correctAnswer: 0
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(0) = ?
        correctAnswer: 90°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(-1) = ?
        correctAnswer: 180°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(1/2) = ?
        correctAnswer: 60°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(√3/2) = ?
        correctAnswer: 30°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
  - pageNumber: 4
    title: Arccos — Negativos
    description: Valores negativos retornam ângulos no 2º quadrante.
    exercises:
      - type: trigonometry
        question: arccos(-1/2) = ?
        correctAnswer: 120°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(-√2/2) = ?
        correctAnswer: 135°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(-√3/2) = ?
        correctAnswer: 150°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(√2/2) = ?
        correctAnswer: 45°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(-0) = ?
        correctAnswer: 90°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 2
        objectives: [trig.inverse_functions]
  - pageNumber: 5
    title: Arctan
    description: arctan retorna ângulos em (-90°, 90°).
    exercises:
      - type: trigonometry
        question: arctan(0) = ?
        correctAnswer: 0
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arctan(1) = ?
        correctAnswer: 45°
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arctan(-1) = ?
        correctAnswer: -45°
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arctan(√3) = ?
        correctAnswer: 60°
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arctan(-√3) = ?
        correctAnswer: -60°
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 3
        objectives: [trig.inverse_functions]
  - pageNumber: 6
    title: Composição com Trig
    description: sen(arcsen x) = x quando x ∈ [-1,1].
    exercises:
      - type: trigonometry
        question: sen(arcsen(0.5)) = ?
        correctAnswer: 0.5
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: cos(arccos(1)) = ?
        correctAnswer: 1
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: tan(arctan(5)) = ?
        correctAnswer: 5
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(sen(30°)) = ?
        correctAnswer: 30°
        rationale: "Use o ciclo trigonométrico e os ângulos notáveis."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(cos(60°)) = ?
        correctAnswer: 60°
        rationale: "Use o ciclo trigonométrico e os ângulos notáveis."
        difficulty: 3
        objectives: [trig.inverse_functions]
  - pageNumber: 7
    title: Composição Mista
    description: Exemplo — cos(arcsen(3/5)) usando triângulo.
    exercises:
      - type: trigonometry
        question: cos(arcsen(3/5)) = ?
        correctAnswer: 4/5
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: sen(arccos(4/5)) = ?
        correctAnswer: 3/5
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: tan(arcsen(5/13)) = ?
        correctAnswer: 5/12
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: cos(arctan(1)) = ?
        correctAnswer: √2/2
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: sen(arctan(3/4)) = ?
        correctAnswer: 3/5
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 3
        objectives: [trig.inverse_functions]
  - pageNumber: 8
    title: Domínio e Imagem
    description: arcsen/arccos têm domínio [-1,1].
    exercises:
      - type: trigonometry
        question: "Domínio de arcsen(x) é: ([-1,1]/[0,∞)/ℝ/[0,π])"
        correctAnswer: "[-1,1]"
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: "Imagem de arcsen(x) é: ([-90°,90°]/[0°,180°]/[0°,360°])"
        correctAnswer: "[-90°,90°]"
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: "Imagem de arccos(x) é: ([-90°,90°]/[0°,180°]/[0°,360°])"
        correctAnswer: "[0°,180°]"
        rationale: "Use o ciclo trigonométrico e os ângulos notáveis."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: "Imagem de arctan(x) é: ((-90°,90°)/[0°,180°]/[0°,360°])"
        correctAnswer: (-90°,90°)
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(2) existe? (sim/não)
        correctAnswer: não
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
  - pageNumber: 9
    title: Identidades com Inversas
    description: arcsen(x)+arccos(x) = π/2.
    exercises:
      - type: trigonometry
        question: arcsen(x) + arccos(x) = ?
        correctAnswer: 90°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(0.5) + arccos(0.5) = ?
        correctAnswer: 90°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arctan(x) + arctan(1/x) = ?° (x>0)
        correctAnswer: 90°
        rationale: "Inequação: isole x; inverta o sinal ao multiplicar por negativo."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arcsen(-x) = ?
        correctAnswer: -arcsen(x)
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: arccos(-x) = ? - arccos(x)
        correctAnswer: 180°
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplicações práticas.
    exercises:
      - type: trigonometry
        question: "O ângulo cuja tangente é 1 é: (em graus)"
        correctAnswer: 45°
        rationale: "Use identidades trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: "O ângulo cujo seno é √3/2 (agudo) é: (em graus)"
        correctAnswer: 60°
        rationale: "Radical: √(a·b) = √a·√b; racionalize quando preciso."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: Se sen(θ)=0.6 (agudo), θ ≈ ? graus
        correctAnswer: 36.87°
        rationale: "Use o ciclo trigonométrico e os ângulos notáveis."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: sec(arctan(√3)) = ?
        correctAnswer: 2
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
      - type: trigonometry
        question: sen(arcsen(-1)) = ?
        correctAnswer: -1
        rationale: "Aplique razões trigonométricas e o ciclo."
        difficulty: 4
        objectives: [trig.inverse_functions]
target: 50
