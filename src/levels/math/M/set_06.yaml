  - trig.inverse_functions
example: arcsen(1/2) = 30°
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 25
pages:
  - pageNumber: 1
    title: Arcsen — Valores Básicos — prática 1
    description: arcsen retorna o ângulo em [-π/2, π/2].
    exercises:
      - type: trigonometry
        question: arcsen(0) = ?
        correctAnswer: 0
        rationale: arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.inverse_functions
      - type: trigonometry
        question: arcsen(1) = ?
        correctAnswer: 90°
        rationale: arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.inverse_functions
      - type: trigonometry
        question: arcsen(1/2) = ?
        correctAnswer: 30°
        rationale: arcsen dá ângulo em [−π/2, π/2] com sen igual ao valor dado.
        difficulty: 2
        objectives:
          - trig.inverse_functions
      - type: trigonometry
        question: arcsen(√2/2) = ?
        correctAnswer: 45°
        rationale: arcsen(√2/2) = 45° porque sen(45°) = √2/2.
        difficulty: 2
        objectives:
          - trig.inverse_functions
      - type: trigonometry
        question: arcsen(√3/2) = ?
        correctAnswer: 60°
        rationale: arcsen(√3/2) = 60° porque sen(60°) = √3/2.
        difficulty: 2
        objectives:
          - trig.inverse_functions
