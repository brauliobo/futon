  - pageNumber: 9
    title: Identidades Derivadas
    description: Verificações comuns.
    exercises:
      - type: trigonometry
        question: sen(x+π) = ?
        correctAnswer: -sen(x)
        rationale: "sen(x+π) = −sen x (periodicidade e simetria)."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
      - type: trigonometry
        question: cos(x+π) = ?
        correctAnswer: -cos(x)
        rationale: "cos(x+π) = −cos x (periodicidade e simetria)."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
      - type: trigonometry
        question: sen(π/2-x) = ?
        correctAnswer: cos(x)
        rationale: "Cofunção: sen(π/2 − x) = cos x."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
      - type: trigonometry
        question: cos(π/2-x) = ?
        correctAnswer: sen(x)
        rationale: "Cofunção: cos(π/2 − x) = sen x."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
      - type: trigonometry
        question: sen(-x) = ?
        correctAnswer: -sen(x)
        rationale: "Paridade: sen é ímpar, sen(−x) = −sen x."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
  - pageNumber: 10
    title: Revisão Integrada
    description: Aplicações variadas.
    exercises:
      - type: trigonometry
        question: sen(180°-x) = ?
        correctAnswer: sen(x)
        rationale: "Redução: sen(180°−x) = sen x."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
      - type: trigonometry
        question: cos(180°-x) = ?
        correctAnswer: -cos(x)
        rationale: "Redução: cos(180°−x) = −cos x."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
      - type: trigonometry
        question: sen(90°+x) = ?
        correctAnswer: cos(x)
        rationale: "Redução: sen(90°+x) = cos x."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
      - type: trigonometry
        question: cos(90°+x) = ?
        correctAnswer: -sen(x)
        rationale: "Redução: cos(90°+x) = −sen x."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
      - type: trigonometry
        question: tan(180°+x) = ?
        correctAnswer: tan(x)
        rationale: "Periodicidade: tan tem período π, tan(180°+x) = tan x."
        difficulty: 4
        objectives: [trig.identities.sum_diff]
target: 50
