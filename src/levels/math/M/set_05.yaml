    title: Verdadeiro ou Falso
    description: Julgue identidades.
    exercises:
      - type: trigonometry
        question: sen(a)sen(b) = sen(a+b) (V/F)?
        correctAnswer: F
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(a)cos(b) = sen(a+b)+sen(a-b) (V/F)?
        correctAnswer: V
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(a)+sen(b) = sen(a+b) (V/F)?
        correctAnswer: F
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: cos(a)+cos(b) = 2·cos((a+b)/2)·cos((a-b)/2) (V/F)?
        correctAnswer: V
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(a)cos(b)+cos(a)sen(b) = sen(a+b) (V/F)?
        correctAnswer: V
        rationale: Consulte o ciclo trigonométrico.
