title: Produto em Soma & Soma em Produto
level: M
subject: math
inputType: number
difficulty: 5
objectives:
  - trig.identities.product_sum
example: sen(a)cos(b) = [sen(a+b) + sen(a-b)]/2
pages:
  - pageNumber: 1
    title: Produto sen·cos
    description: sen(a)cos(b) = [sen(a+b)+sen(a-b)]/2.
    exercises:
      - type: trigonometry
        question: 2·sen(a)cos(b) = sen(a+b) + ?
        correctAnswer: sen(a-b)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(60°)cos(30°) = sen(90°) + sen(30°) = ?
        correctAnswer: 3/2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(45°)cos(45°) = sen(90°) + sen(0°) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(30°)cos(60°) = sen(90°) + sen(-30°) = ?
        correctAnswer: 1/2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(x)cos(x) = ?
        correctAnswer: sen(2x)
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 2
    title: Produto cos·cos
    description: cos(a)cos(b) = [cos(a+b)+cos(a-b)]/2.
    exercises:
      - type: trigonometry
        question: 2·cos(a)cos(b) = cos(a+b) + ?
        correctAnswer: cos(a-b)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·cos(60°)cos(30°) = cos(90°) + cos(30°) = ?
        correctAnswer: √3/2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·cos(45°)cos(45°) = cos(90°) + cos(0°) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·cos(x)cos(x) = ?
        correctAnswer: 1+cos(2x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·cos(60°)cos(60°) = ?
        correctAnswer: 1/2
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 3
    title: Produto sen·sen
    description: sen(a)sen(b) = [cos(a-b)-cos(a+b)]/2.
    exercises:
      - type: trigonometry
        question: 2·sen(a)sen(b) = cos(a-b) - ?
        correctAnswer: cos(a+b)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(60°)sen(30°) = cos(30°) - cos(90°) = ?
        correctAnswer: √3/2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(45°)sen(45°) = cos(0°) - cos(90°) = ?
        correctAnswer: 1
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(x)sen(x) = ?
        correctAnswer: 1-cos(2x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(30°)sen(30°) = ?
        correctAnswer: 1/2
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 4
    title: Soma em Produto (sen + sen)
    description: sen(a)+sen(b) = 2·sen((a+b)/2)·cos((a-b)/2).
    exercises:
      - type: trigonometry
        question: sen(a)+sen(b) = 2·sen((a+b)/2)·cos((a-b)/?)
        correctAnswer: 2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(60°)+sen(30°) = 2·sen(45°)·cos(15°), valor = ?
        correctAnswer: √3/2+1/2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(x)+sen(x) = ?
        correctAnswer: 2sen(x)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(x)+sen(-x) = ?
        correctAnswer: 0
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(90°)+sen(30°) = ?
        correctAnswer: 3/2
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 5
    title: Soma em Produto (sen - sen)
    description: sen(a)-sen(b) = 2·cos((a+b)/2)·sen((a-b)/2).
    exercises:
      - type: trigonometry
        question: sen(a)-sen(b) = 2·cos((a+b)/2)·sen((a-b)/?)
