  - pageNumber: 8
    title: Uso em Integrais (Redução de Potências)
    description: Utilidade em cálculo — reduzir produtos para somas.
    exercises:
      - type: trigonometry
        question: "Ao integrar sen(3x)cos(2x), converta em soma: (sen 5x + sen ?)/2"
        correctAnswer: x
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: "Ao integrar cos(5x)cos(x), converta em soma: (cos 6x + cos ?)/2"
        correctAnswer: 4x
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: "Ao integrar sen(4x)sen(x): (cos ? - cos 5x)/2"
        correctAnswer: 3x
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·sen(a)cos(a) = ?
        correctAnswer: sen(2a)
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: 2·cos²(a) = 1 + ?
        correctAnswer: cos(2a)
        rationale: Consulte o ciclo trigonométrico.
