        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(60°)-sen(30°) = ?
        correctAnswer: √3/2-1/2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(x)-sen(x) = ?
        correctAnswer: 0
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(2x)-sen(x) em termos de cos e sen = 2·cos(?)·sen(x/2)
        correctAnswer: 3x/2
        rationale: Consulte o ciclo trigonométrico.
      - type: trigonometry
        question: sen(90°)-sen(30°) = ?
        correctAnswer: 1/2
        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 6
    title: Soma em Produto (cos + cos)
