title: Trigonometria Avançada e Séries — Conjunto 5
level: M
example: "Fórmulas de soma e diferença. Ex.: sin(A+B) = sin(A)cos(B) + cos(A)sin(B)"
subject: math
pages:
  - pageNumber: 1
    title: Trigonometria Avançada e Séries — Conjunto 5 – Página 1
    description: Fórmulas de soma e diferença.
    exercises:
      - &a1
        type: trigonometry
        question: Calcule sin(75°) usando sin(45° + 30°) =
        correctAnswer: (√6 + √2)/4
      - &a2
        type: trigonometry
        question: Calcule cos(15°) usando cos(45° - 30°) =
        correctAnswer: (√6 + √2)/4
      - &a3
        type: trigonometry
        question: Se sin(A) = 3/5 e cos(B) = 5/13, calcule sin(A+B) =
        correctAnswer: 63/65
      - &a4
        type: trigonometry
        question: Calcule tan(105°) usando tan(60° + 45°) =
        correctAnswer: -2 - √3
      - &a5
        type: trigonometry
        question: "Simplifique: cos(x+y)cos(x-y) ="
        correctAnswer: cos²(x) - sin²(y)
      - &a6
        type: trigonometry
        question: Se sin(A) = 4/5 e sin(B) = 12/13, calcule cos(A-B) =
        correctAnswer: 56/65
      - &a7
        type: trigonometry
        question: Calcule sin(15°) usando sin(45° - 30°) =
        correctAnswer: (√6 - √2)/4
      - &a8
        type: trigonometry
        question: Se cos(A) = 7/25 e cos(B) = 3/5, calcule sin(A+B) =
        correctAnswer: 117/125
      - &a9
        type: trigonometry
        question: Calcule tan(15°) usando tan(45° - 30°) =
        correctAnswer: 2 - √3
      - &a10
        type: trigonometry
        question: "Simplifique: sin(x+y) + sin(x-y) ="
        correctAnswer: 2sin(x)cos(y)
