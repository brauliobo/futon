        rationale: Consulte o ciclo trigonométrico.
  - pageNumber: 7
    title: Soma em Produto (cos - cos)
    description: cos(a)-cos(b) = -2·sen((a+b)/2)·sen((a-b)/2).
    exercises:
      - type: trigonometry
        question: cos(a)-cos(b) = -2·sen((a+b)/2)·sen((a-b)/?)
