title: Trigonometria Avançada e Séries — Conjunto 15
level: M
example: "Convergência de séries. Ex.: série geométrica converge se |r| < 1"
subject: math
pages:
  - pageNumber: 1
    title: Convergência – Página 1
    description: Testes de convergência de séries.
    exercises:
      - type: trigonometry
        question: "A série ∑(1/n²) converge para ="
        correctAnswer: "π²/6"
  - pageNumber: 2
    title: Identidades Trigonométricas – Página 2
    description: Identidades fundamentais de trigonometria.
    exercises:
      - type: trigonometry
        question: "Se sin(x) = 3/5, calcule cos(x) ="
        correctAnswer: "4/5"
  - pageNumber: 3
    title: Identidades Trigonométricas – Página 3
    description: Identidades fundamentais de trigonometria.
    exercises:
      - type: trigonometry
        question: "Simplifique: tan(x) · cot(x) ="
        correctAnswer: "1"
  - pageNumber: 4
    title: Identidades Trigonométricas – Página 4
    description: Identidades fundamentais de trigonometria.
    exercises:
      - type: trigonometry
        question: "Se cos(x) = 1/2, calcule sin(x) ="
        correctAnswer: "√3/2"
  - pageNumber: 5
    title: Identidades Trigonométricas – Página 5
    description: Identidades fundamentais de trigonometria.
    exercises:
      - type: trigonometry
        question: "Simplifique: sec²(x) - tan²(x) ="
        correctAnswer: "1"
  - pageNumber: 6
    title: Identidades Trigonométricas – Página 6
    description: Identidades fundamentais de trigonometria.
    exercises:
      - type: trigonometry
        question: "Calcule: sin(30°) + cos(60°) ="
        correctAnswer: "1"
  - pageNumber: 7
    title: Identidades Trigonométricas – Página 7
    description: Identidades fundamentais de trigonometria.
    exercises:
      - type: trigonometry
        question: "Se tan(x) = 1, calcule x (0° ≤ x < 90°) ="
        correctAnswer: "45°"
  - pageNumber: 8
    title: Identidades Trigonométricas – Página 8
    description: Identidades fundamentais de trigonometria.
    exercises:
      - type: trigonometry
        question: "Simplifique: csc²(x) - cot²(x) ="
        correctAnswer: "1"
  - pageNumber: 9
    title: Identidades Trigonométricas – Página 9
    description: Identidades fundamentais de trigonometria.
    exercises:
      - type: trigonometry
        question: "Calcule: cos(45°) · sin(45°) ="
        correctAnswer: "1/2"
  - pageNumber: 10
    title: Identidades Trigonométricas – Página 10
    description: Identidades fundamentais de trigonometria.
    exercises:
      - type: trigonometry
        question: "Se sin(x) = 1/2, calcule x (0° ≤ x ≤ 90°) ="
        correctAnswer: "30°"
target: 10
