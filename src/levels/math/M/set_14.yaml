        rationale: "Teste da comparação: |termos| ≤ 1/n² convergente ⇒ converge."
        difficulty: 4
        objectives:
          - series.partial_sums
      - type: sequence
        question: Σ 1/(2n+1) é uma série geométrica (V/F)?
        correctAnswer: F
        rationale: Série geométrica tem razão constante r; 1/(2n+1) não é geométrica — comporta-se como harmônica.
        difficulty: 4
        objectives:
          - series.partial_sums
      - type: sequence
        question: Portanto Σ 1/(2n+1) diverge (V/F)?
        correctAnswer: V
        rationale: Comparação com harmônica Σ1/n, que diverge.
        difficulty: 4
        objectives:
