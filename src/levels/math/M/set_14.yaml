  - pageNumber: 9
    title: Teste da Comparação — prática 1
    description: Compare com série conhecida.
    exercises:
      - type: sequence
        question: Σ 1/(n²+1) converge (como 1/n²) (V/F)?
        correctAnswer: V
        rationale: "p-série Σ 1/nᵖ: converge sse p > 1."
        difficulty: 4
        objectives:
          - series.partial_sums
      - type: sequence
        question: Σ 1/n! converge — fatorial cresce (mais rápido/mais devagar)?
        correctAnswer: mais rápido
        rationale: Σ 1/n é a série harmônica — diverge.
        difficulty: 4
        objectives:
          - series.partial_sums
      - type: sequence
        question: Σ sen²(n)/n² é dominado por 1/n², logo converge (V/F)?
