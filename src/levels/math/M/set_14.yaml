        objectives:
          - series.partial_sums
      - type: sequence
        question: "Se lim aₙ₊₁/aₙ > 1, série: (diverge)"
        correctAnswer: diverge
        rationale: Substitua o valor — a função é contínua no ponto.
        difficulty: 4
        objectives:
          - series.partial_sums
      - type: sequence
        question: "Se lim aₙ₊₁/aₙ = 1, teste: (inconclusivo)"
        correctAnswer: inconclusivo
        rationale: Substitua o valor — a função é contínua no ponto.
        difficulty: 4
        objectives:
