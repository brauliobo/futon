title: Séries Numéricas — Soma Parcial
level: M
subject: math
inputType: number
difficulty: 4
objectives:
  - series.partial_sums
example: Série harmônica diverge; Σ 1/n² converge
pages:
  - pageNumber: 1
    title: Série Harmônica
    description: Σ 1/n diverge.
    exercises:
      - type: sequence
        question: H₁ = 1 + 0 = ?
        correctAnswer: 1
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: H₂ = 1 + 1/2 = ?
        correctAnswer: 1.5
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: H₃ (aprox) = 1 + 1/2 + 1/3 = ?
        correctAnswer: 1.833
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: H₄ (aprox) = ?
        correctAnswer: 2.083
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: "Σ 1/n: (diverge/converge)"
        correctAnswer: diverge
        rationale: Identifique o padrão (diferença ou razão constante).
  - pageNumber: 2
    title: P-séries
    description: Σ 1/n^p converge se p>1.
    exercises:
      - type: sequence
        question: Σ 1/n² converge (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ 1/n^1.5 converge (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ 1/n converge (V/F)?
        correctAnswer: F
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ 1/n^0.5 (ou 1/√n) converge? (sim/não)
        correctAnswer: não
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Para p-série convergir, p > ?
        correctAnswer: 1
        rationale: Identifique o padrão (diferença ou razão constante).
  - pageNumber: 3
    title: Série Geométrica
    description: Revisão de convergência.
    exercises:
      - type: sequence
        question: Σ q^n converge se |q| < ?
        correctAnswer: 1
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ (1/2)^n = 1 + 1/2 + 1/4 + ... = ?
        correctAnswer: 2
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ (1/3)^n do n=0 ao ∞ = ?
        correctAnswer: 1.5
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ 2^n diverge (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ (-1/2)^n do n=0 ao ∞ = ?
        correctAnswer: 2/3
        rationale: Identifique o padrão (diferença ou razão constante).
  - pageNumber: 4
    title: Teste da Divergência
    description: Se aₙ não tende a 0, série diverge.
    exercises:
      - type: sequence
        question: "Se aₙ → 5, Σaₙ: (diverge/converge)"
        correctAnswer: diverge
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σn diverge porque aₙ → ? (∞/0)
        correctAnswer: ∞
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ(-1)^n diverge porque aₙ oscila (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Se aₙ → 0, série SEMPRE converge (V/F)?
        correctAnswer: F
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: "Ex.: Σ 1/n diverge apesar de 1/n→0 (V/F)?"
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
  - pageNumber: 5
    title: Teste da Comparação
    description: Compare com série conhecida.
    exercises:
      - type: sequence
        question: Σ 1/(n²+1) converge (como 1/n²) (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ 1/n! converge — fatorial cresce (mais rápido/mais devagar)?
        correctAnswer: mais rápido
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ sen²(n)/n² é dominado por 1/n², logo converge (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: "Σ 1/(2n+1) é similar a: (Σ 1/n)"
        correctAnswer: Σ 1/n
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Portanto Σ 1/(2n+1) diverge (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
  - pageNumber: 6
    title: Teste da Razão (aₙ₊₁/aₙ)
    description: lim |aₙ₊₁/aₙ| < 1 → converge.
    exercises:
      - type: sequence
        question: "Σ 1/n!: razão (n+1)!→ (n+1). aₙ₊₁/aₙ = 1/(n+1) → 0. Converge? (sim/não)"
        correctAnswer: sim
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: "Σ 2^n/n!: aₙ₊₁/aₙ = 2/(n+1) → 0. Converge? (sim/não)"
        correctAnswer: sim
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: "Se lim aₙ₊₁/aₙ > 1, série: (diverge)"
        correctAnswer: diverge
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: "Se lim aₙ₊₁/aₙ = 1, teste: (inconclusivo)"
        correctAnswer: inconclusivo
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Teste da razão é útil para fatoriais e exponenciais (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
  - pageNumber: 7
    title: Séries Alternadas
    description: Σ(-1)^n·bₙ — Leibniz.
    exercises:
      - type: sequence
        question: "Se bₙ decresce para 0, série alternada: (converge)"
        correctAnswer: converge
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ(-1)^n/n converge? (sim/não)
        correctAnswer: sim
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: "Σ(-1)^n · n/(n+1) — bₙ→1, então: (diverge)"
        correctAnswer: diverge
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ(-1)^n/√n converge (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Série alternada harmônica converge (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
  - pageNumber: 8
    title: Convergência Absoluta
    description: Σ|aₙ| converge → Σaₙ converge.
    exercises:
      - type: sequence
        question: "Σ(-1)^n/n²: Σ1/n² converge, então absolutamente convergente (V/F)?"
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: "Σ(-1)^n/n: Σ1/n diverge; é condicionalmente convergente (V/F)?"
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Convergência absoluta é mais forte que condicional (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ(-1)^n/n³ é absolutamente convergente (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Se série converge absolutamente, converge (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
  - pageNumber: 9
    title: Exemplos Famosos
    description: Séries marcantes.
    exercises:
      - type: sequence
        question: Σ 1/n² = π²/6 (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ 1/n diverge (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ 1/n! = e (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ x^n/n! é a série de Taylor de e^x (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ (-1)^(n+1)/n = ln(2) (V/F)?
        correctAnswer: V
        rationale: Identifique o padrão (diferença ou razão constante).
  - pageNumber: 10
    title: Revisão Integrada
    description: Julgue a convergência.
    exercises:
      - type: sequence
        question: Σ 1/n⁴ — converge? (sim/não)
        correctAnswer: sim
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ 1/√n — converge? (sim/não)
        correctAnswer: não
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ (1/3)^n — converge? (sim/não)
        correctAnswer: sim
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ (4/3)^n — converge? (sim/não)
        correctAnswer: não
        rationale: Identifique o padrão (diferença ou razão constante).
      - type: sequence
        question: Σ (-1)^n/n² — converge? (sim/não)
        correctAnswer: sim
        rationale: Identifique o padrão (diferença ou razão constante).
target: 50
