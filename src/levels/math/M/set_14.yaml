title: Trigonometria Avançada e Séries — Conjunto 1
level: M
example: "Funções trigonométricas avançadas e séries. Ex.: sin(2x) = 2sin(x)cos(x)"
subject: math
pages:
  - pageNumber: 1
    title: Trigonometria Avançada e Séries — Conjunto 1 – Página 1
    description: Identidades fundamentais de trigonometria.
    exercises:
      - &a1
        type: trigonometry
        question: "Simplifique: sin²(x) + cos²(x) ="
        correctAnswer: "1"
      - &a2
        type: trigonometry
        question: Se sin(x) = 3/5, calcule cos(x) =
        correctAnswer: 4/5
      - &a3
        type: trigonometry
        question: "Simplifique: tan(x) · cot(x) ="
        correctAnswer: "1"
      - &a4
        type: trigonometry
        question: Se cos(x) = 1/2, calcule sin(x) =
        correctAnswer: √3/2
      - &a5
        type: trigonometry
        question: "Simplifique: sec²(x) - tan²(x) ="
        correctAnswer: "1"
      - &a6
        type: trigonometry
        question: "Calcule: sin(30°) + cos(60°) ="
        correctAnswer: "1"
      - &a7
        type: trigonometry
        question: Se tan(x) = 1, calcule x (0° ≤ x < 90°) =
        correctAnswer: 45°
      - &a8
        type: trigonometry
        question: "Simplifique: csc²(x) - cot²(x) ="
        correctAnswer: "1"
      - &a9
        type: trigonometry
        question: "Calcule: cos(45°) · sin(45°) ="
        correctAnswer: 1/2
      - &a10
        type: trigonometry
        question: Se sin(x) = 1/2, calcule x (0° ≤ x ≤ 90°) =
        correctAnswer: 30°
