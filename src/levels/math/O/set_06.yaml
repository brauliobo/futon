title: Integrais por Partes — Conjunto 6
level: O
example: "Use integração por partes: ∫ u dv = uv - ∫ v du"
subject: math
pages:
  - pageNumber: 1
    title: Integrais por Partes – Página 1
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ x·e^x dx"
        correctAnswer: "(x-1)e^x + C"
  - pageNumber: 2
    title: Integrais por Partes – Página 2
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ x·sin(x) dx"
        correctAnswer: "-x·cos(x) + sin(x) + C"
  - pageNumber: 3
    title: Integrais por Partes – Página 3
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ x·cos(x) dx"
        correctAnswer: "x·sin(x) + cos(x) + C"
  - pageNumber: 4
    title: Integrais por Partes – Página 4
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ x·ln(x) dx"
        correctAnswer: "(x²/2)·ln(x) - x²/4 + C"
  - pageNumber: 5
    title: Integrais por Partes – Página 5
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ x²·e^x dx"
        correctAnswer: "(x²-2x+2)e^x + C"
  - pageNumber: 6
    title: Integrais por Partes – Página 6
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ ln(x) dx"
        correctAnswer: "x·ln(x) - x + C"
  - pageNumber: 7
    title: Integrais por Partes – Página 7
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ x·e^(-x) dx"
        correctAnswer: "-(x+1)e^(-x) + C"
  - pageNumber: 8
    title: Integrais por Partes – Página 8
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ x²·sin(x) dx"
        correctAnswer: "-x²·cos(x) + 2x·sin(x) + 2cos(x) + C"
  - pageNumber: 9
    title: Integrais por Partes – Página 9
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ e^x·sin(x) dx"
        correctAnswer: "(e^x/2)(sin(x) - cos(x)) + C"
  - pageNumber: 10
    title: Integrais por Partes – Página 10
    description: Use integração por partes.
    exercises:
      - type: quadratic
        question: "∫ x·arctan(x) dx"
        correctAnswer: "(x²+1)·arctan(x)/2 - x/2 + C"
target: 10
