      - type: quadratic
        question: ∫ 4x^0 + 2x^3 dx = ?
        correctAnswer: 4x + (2/4)x^4 + C
        rationale: "Integral definida = F(b) - F(a) pelo TFC."
      - type: quadratic
        question: ∫₀^4 x^2 dx = ?
        correctAnswer: "21.333333333333332"
        rationale: "Frações parciais para racionais com grau numerador < denominador."
      - type: quadratic
        question: ∫ 3x^1 + 2x^3 dx = ?
        correctAnswer: (3/2)x^2 + (2/4)x^4 + C
        rationale: "∫1/x dx = ln|x| + C."
      - type: quadratic
        question: ∫ 4x^2 + 4x^2 dx = ?
        correctAnswer: (4/3)x^3 + (4/3)x^3 + C
        rationale: "∫e^x dx = e^x + C."
      - type: quadratic
        question: ∫ 3x^1 + 1x^1 dx = ?
        correctAnswer: (3/2)x^2 + (1/2)x^2 + C
        rationale: "∫sen x dx = -cos x + C; ∫cos x dx = sen x + C."
      - type: quadratic
        question: ∫ 2x^2 + 5x^2 dx = ?
        correctAnswer: (2/3)x^3 + (5/3)x^3 + C
        rationale: "Área entre curvas: ∫[f(x) - g(x)] dx no intervalo."
      - type: quadratic
        question: ∫ 1x^4 dx = ?
        correctAnswer: (1/5)x^5 + C
        rationale: "Sol. de volume por sólidos de revolução: disco/casca."
      - type: quadratic
