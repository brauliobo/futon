title: Integrais por Partes — Conjunto 18
level: O
example: "Calcule integrais básicas. Ex.: ∫ 2x dx = x² + C"
subject: math
difficulty: 5
objectives:
  - math.integral_calculus
authorNotes: Conjunto de math/O.
inputType: number
pages:
  - pageNumber: 1
    title: Integrais por Partes — Conjunto 18 – Página 1
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: ∫ 1x^3 + 1x^0 dx = ?
        correctAnswer: (1/4)x^4 + 1x + C
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: ∫ 1x^1 + 2x^0 dx = ?
        correctAnswer: (1/2)x^2 + 2x + C
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: ∫ 3x^2 + 5x^2 dx = ?
        correctAnswer: (3/3)x^3 + (5/3)x^3 + C
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: ∫ 4x^0 + 2x^1 dx = ?
        correctAnswer: 4x + (2/2)x^2 + C
        rationale: "Sol. de volume por sólidos de revolução: disco/casca."
      - type: quadratic
        question: ∫ 2x^1 + 2x^3 dx = ?
        correctAnswer: (2/2)x^2 + (2/4)x^4 + C
        rationale: "Ex.: ∫x² dx = x³/3 + C."
      - type: quadratic
        question: ∫ 1x^2 + 1x^3 dx = ?
        correctAnswer: (1/3)x^3 + (1/4)x^4 + C
        rationale: "Integral de x^n = x^(n+1)/(n+1) + C, n ≠ -1."
      - type: quadratic
        question: ∫ 3x^3 + 4x^1 dx = ?
        correctAnswer: (3/4)x^4 + (4/2)x^2 + C
        rationale: "∫(f + g) dx = ∫f dx + ∫g dx."
      - type: exponent
        question: ∫ 1e^x dx = ?
        correctAnswer: 1e^x + C
        rationale: "Use propriedades de potências."
      - type: quadratic
        question: ∫ 1x^1 + 5x^2 dx = ?
        correctAnswer: (1/2)x^2 + (5/3)x^3 + C
        rationale: "Substituição: u = g(x), du = g'(x) dx."
      - type: quadratic
        question: ∫ 1x^0 + 4x^0 dx = ?
        correctAnswer: 5x + C
        rationale: "Integração por partes: ∫u dv = uv - ∫v du."
  - pageNumber: 2
    title: Integrais por Partes — Conjunto 18 – Página 2
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: ∫ 4x^1 + 4x^2 dx = ?
