title: Séries de Taylor — Conjunto 12
level: O
example: "Encontre séries de Taylor: f(x) = ∑ f⁽ⁿ⁾(a)(x-a)ⁿ/n!"
subject: math
pages:
  - pageNumber: 1
    title: Séries de Taylor — Conjunto 12 – Página 1
    description: Encontre séries de Taylor.
    exercises:
      - &a1
        type: quadratic
        question: Série de Taylor de e^x em a = 0
        correctAnswer: ∑ xⁿ/n!
      - &a2
        type: quadratic
        question: Série de Taylor de sin(x) em a = 0
        correctAnswer: ∑ (-1)ⁿx^(2n+1)/(2n+1)!
      - &a3
        type: quadratic
        question: Série de Taylor de cos(x) em a = 0
        correctAnswer: ∑ (-1)ⁿx^(2n)/(2n)!
      - &a4
        type: quadratic
        question: Série de Taylor de ln(1+x) em a = 0
        correctAnswer: ∑ (-1)ⁿ⁺¹xⁿ/n
      - &a5
        type: quadratic
        question: Série de Taylor de (1+x)^α em a = 0
        correctAnswer: ∑ C(α,n)xⁿ
      - &a6
        type: quadratic
        question: Série de Taylor de 1/(1-x) em a = 0
        correctAnswer: ∑ xⁿ
      - &a7
        type: quadratic
        question: Série de Taylor de arctan(x) em a = 0
        correctAnswer: ∑ (-1)ⁿx^(2n+1)/(2n+1)
      - &a8
        type: quadratic
        question: Série de Taylor de sinh(x) em a = 0
        correctAnswer: ∑ x^(2n+1)/(2n+1)!
      - &a9
        type: quadratic
        question: Série de Taylor de cosh(x) em a = 0
        correctAnswer: ∑ x^(2n)/(2n)!
      - &a10
        type: quadratic
        question: Série de Taylor de e^(-x) em a = 0
        correctAnswer: ∑ (-1)ⁿxⁿ/n!
