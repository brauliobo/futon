title: Integrais Trigonométricas Avançadas — Conjunto 16
level: O
example: "Resolva integrais trigonométricas complexas usando identidades"
subject: math
pages:
  - pageNumber: 1
    title: Integrais Trigonométricas Avançadas – Página 1
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sin³(x) dx"
        correctAnswer: "-cos(x) + (1/3)cos³(x) + C"
  - pageNumber: 2
    title: Integrais Trigonométricas Avançadas – Página 2
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ cos⁴(x) dx"
        correctAnswer: "(3x/8) + (sin(2x)/4) + (sin(4x)/32) + C"
  - pageNumber: 3
    title: Integrais Trigonométricas Avançadas – Página 3
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sin(x)cos³(x) dx"
        correctAnswer: "-(1/4)cos⁴(x) + C"
  - pageNumber: 4
    title: Integrais Trigonométricas Avançadas – Página 4
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sin(2x)cos(3x) dx"
        correctAnswer: "-(1/2)cos(5x) - (1/10)cos(x) + C"
  - pageNumber: 5
    title: Integrais Trigonométricas Avançadas – Página 5
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ tan³(x) dx"
        correctAnswer: "(1/2)tan²(x) - ln|cos(x)| + C"
  - pageNumber: 6
    title: Integrais Trigonométricas Avançadas – Página 6
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sec³(x) dx"
        correctAnswer: "(1/2)[sec(x)tan(x) + ln|sec(x) + tan(x)|] + C"
  - pageNumber: 7
    title: Integrais Trigonométricas Avançadas – Página 7
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sin²(x)cos²(x) dx"
        correctAnswer: "x/8 - sin(4x)/32 + C"
  - pageNumber: 8
    title: Integrais Trigonométricas Avançadas – Página 8
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ cot²(x) dx"
        correctAnswer: "-cot(x) - x + C"
  - pageNumber: 9
    title: Integrais Trigonométricas Avançadas – Página 9
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sin⁵(x) dx"
        correctAnswer: "-cos(x) + (2/3)cos³(x) - (1/5)cos⁵(x) + C"
  - pageNumber: 10
    title: Integrais Trigonométricas Avançadas – Página 10
    description: Use identidades trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sec²(x)tan²(x) dx"
        correctAnswer: "(1/3)tan³(x) + C"
target: 10
