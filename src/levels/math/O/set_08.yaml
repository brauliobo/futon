title: Integrais de Polinômios — Conjunto 8
level: O
example: "Calcule integrais básicas. Ex.: ∫ 2x dx = x² + C"
subject: math
difficulty: 5
objectives:
  - math.integral_calculus
authorNotes: Conjunto de math/O.
inputType: number
pages:
  - pageNumber: 1
    title: Integrais de Polinômios — Conjunto 8 – Página 1
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: ∫ 5x^2 + 2x^3 dx = ?
        correctAnswer: (5/3)x^3 + (2/4)x^4 + C
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
        question: ∫ 5x^0 + 4x^3 dx = ?
        correctAnswer: 5x + (4/4)x^4 + C
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
        question: ∫ 2x^2 + 3x^3 dx = ?
        correctAnswer: (2/3)x^3 + (3/4)x^4 + C
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
        question: ∫ 4x^1 + 4x^1 dx = ?
        correctAnswer: (4/2)x^2 + (4/2)x^2 + C
        rationale: "Sol. de volume por sólidos de revolução: disco/casca."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
        question: ∫ 1x^1 + 3x^3 dx = ?
        correctAnswer: (1/2)x^2 + (3/4)x^4 + C
        rationale: "Ex.: ∫x² dx = x³/3 + C."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
        question: ∫ 3x^0 + 2x^2 dx = ?
        correctAnswer: 3x + (2/3)x^3 + C
        rationale: "Integral de x^n = x^(n+1)/(n+1) + C, n ≠ -1."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
        question: ∫ 5x^0 + 2x^0 dx = ?
        correctAnswer: 7x + C
        rationale: "∫(f + g) dx = ∫f dx + ∫g dx."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
        question: ∫ 3x^1 + 4x^2 dx = ?
        correctAnswer: (3/2)x^2 + (4/3)x^3 + C
        rationale: "Substituição: u = g(x), du = g'(x) dx."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
        question: ∫ 3x^3 + 4x^3 dx = ?
        correctAnswer: (3/4)x^4 + (4/4)x^4 + C
        rationale: "Integração por partes: ∫u dv = uv - ∫v du."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
        question: ∫ 2x^2 + 4x^0 dx = ?
        correctAnswer: (2/3)x^3 + 4x + C
        rationale: "Não esqueça a constante C em integrais indefinidas."
        difficulty: 4
        objectives: [math.integral_calculus]
  - pageNumber: 2
    title: Integrais de Polinômios — Conjunto 8 – Página 2
    description: Calcule integrais indefinidas básicas.
