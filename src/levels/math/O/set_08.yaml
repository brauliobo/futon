      - type: quadratic
        question: ∫ 2x^0 + 4x^3 dx = ?
        correctAnswer: 2x + (4/4)x^4 + C
        rationale: "Integral de x^n = x^(n+1)/(n+1) + C, n ≠ -1."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: quadratic
