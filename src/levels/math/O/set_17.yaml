title: Frações Parciais — Conjunto 17
level: O
example: "Decomponha em frações parciais para integrar"
subject: math
pages:
  - pageNumber: 1
    title: Frações Parciais – Página 1
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ 1/(x² - 1) dx"
        correctAnswer: "(1/2)ln|x-1| - (1/2)ln|x+1| + C"
  - pageNumber: 2
    title: Frações Parciais – Página 2
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ x/(x² + 3x + 2) dx"
        correctAnswer: "2ln|x+2| - ln|x+1| + C"
  - pageNumber: 3
    title: Frações Parciais – Página 3
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ 1/(x(x+1)) dx"
        correctAnswer: "ln|x| - ln|x+1| + C"
  - pageNumber: 4
    title: Frações Parciais – Página 4
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ (2x+1)/(x²-1) dx"
        correctAnswer: "(3/2)ln|x-1| + (1/2)ln|x+1| + C"
  - pageNumber: 5
    title: Frações Parciais – Página 5
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ 1/(x²(x+1)) dx"
        correctAnswer: "-1/x + ln|x| - ln|x+1| + C"
  - pageNumber: 6
    title: Frações Parciais – Página 6
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ x²/(x³-x) dx"
        correctAnswer: "ln|x| - (1/2)ln|x²-1| + C"
  - pageNumber: 7
    title: Frações Parciais – Página 7
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ 1/(x²+2x+1) dx"
        correctAnswer: "-1/(x+1) + C"
  - pageNumber: 8
    title: Frações Parciais – Página 8
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ (x+2)/(x²+4) dx"
        correctAnswer: "(1/2)ln(x²+4) + arctan(x/2) + C"
  - pageNumber: 9
    title: Frações Parciais – Página 9
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ x/(x²+x-2) dx"
        correctAnswer: "(2/3)ln|x+2| + (1/3)ln|x-1| + C"
  - pageNumber: 10
    title: Frações Parciais – Página 10
    description: Decomponha e integre.
    exercises:
      - type: quadratic
        question: "∫ (3x-1)/(x²-4) dx"
        correctAnswer: "(5/4)ln|x-2| + (1/4)ln|x+2| + C"
target: 10
