    title: Substituição Simples – Página 3
    description: Use substituição para calcular integrais.
    exercises:
      - type: quadratic
        question: "∫ sin(x)cos(x) dx"
        correctAnswer: "(1/2)sin²(x) + C"
  - pageNumber: 4
    title: Substituição Simples – Página 4
    description: Use substituição para calcular integrais.
    exercises:
      - type: quadratic
