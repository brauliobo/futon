title: Substituição Simples — Conjunto 5
level: O
example: "Use substituição para calcular integrais. Ex.: ∫ 2x(x²+1)³ dx, u = x²+1"
subject: math
pages:
  - pageNumber: 1
    title: Substituição Simples — Conjunto 5 – Página 1
    description: Use substituição para calcular integrais.
    exercises:
      - &a1
        type: quadratic
        question: ∫ 2x(x²+1)⁴ dx
        correctAnswer: (1/5)(x²+1)⁵ + C
      - &a2
        type: quadratic
        question: ∫ 6x²(x³-2)² dx
        correctAnswer: (1/3)(x³-2)³ + C
      - &a3
        type: quadratic
        question: ∫ sin(x)cos(x) dx
        correctAnswer: (1/2)sin²(x) + C
      - &a4
        type: quadratic
        question: ∫ e^(2x+1) dx
        correctAnswer: (1/2)e^(2x+1) + C
      - &a5
        type: quadratic
        question: ∫ (3x+1)⁵ dx
        correctAnswer: (1/18)(3x+1)⁶ + C
      - &a6
        type: quadratic
        question: ∫ cos(2x-1) dx
        correctAnswer: (1/2)sin(2x-1) + C
      - &a7
        type: quadratic
        question: ∫ (ln(x))/x dx
        correctAnswer: (1/2)(ln(x))² + C
      - &a8
        type: quadratic
        question: ∫ x/(x²+4) dx
        correctAnswer: (1/2)ln(x²+4) + C
      - &a9
        type: quadratic
        question: ∫ x√(x²+1) dx
        correctAnswer: (1/3)(x²+1)^(3/2) + C
      - &a10
        type: quadratic
        question: ∫ x²e^(x³) dx
        correctAnswer: (1/3)e^(x³) + C
