title: Substituição Simples — Conjunto 5
level: O
example: "Use substituição para calcular integrais. Ex.: ∫ 2x(x²+1)³ dx, u = x²+1"
subject: math
pages:
  - pageNumber: 1
    title: Substituição Simples – Página 1
    description: Use substituição para calcular integrais.
    exercises:
      - type: quadratic
        question: "∫ 2x(x²+1)⁴ dx"
        correctAnswer: "(1/5)(x²+1)⁵ + C"
  - pageNumber: 2
    title: Substituição Simples – Página 2
    description: Use substituição para calcular integrais.
    exercises:
      - type: quadratic
        question: "∫ 6x²(x³-2)² dx"
        correctAnswer: "(1/3)(x³-2)³ + C"
