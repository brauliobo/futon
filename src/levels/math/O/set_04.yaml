title: Integrais Trigonométricas — Conjunto 4
level: O
example: "Calcule integrais trigonométricas. Ex.: ∫ sin(ax) dx = -(1/a)cos(ax) + C"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Integrais Trigonométricas — Conjunto 4 – Página 1
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - &a1
        type: quadratic
        question: ∫ sin(2x) dx
        correctAnswer: (-1/2)cos(2x) + C
      - &a2
        type: quadratic
        question: ∫ cos(3x) dx
        correctAnswer: (1/3)sin(3x) + C
      - &a3
        type: quadratic
        question: ∫ sin(x/2) dx
        correctAnswer: -2cos(x/2) + C
      - &a4
        type: quadratic
        question: ∫ cos(x/3) dx
        correctAnswer: 3sin(x/3) + C
      - &a5
        type: quadratic
        question: ∫ tan(x) dx
        correctAnswer: -ln|cos(x)| + C
      - &a6
        type: quadratic
        question: ∫ sec²(x) dx
        correctAnswer: tan(x) + C
      - &a7
        type: quadratic
        question: ∫ csc²(x) dx
        correctAnswer: -cot(x) + C
      - &a8
        type: quadratic
        question: ∫ sec(x)tan(x) dx
        correctAnswer: sec(x) + C
      - &a9
        type: quadratic
        question: ∫ csc(x)cot(x) dx
        correctAnswer: -csc(x) + C
      - &a10
        type: quadratic
        question: ∫ sin²(x) dx
        correctAnswer: (x/2) - (sin(2x)/4) + C
