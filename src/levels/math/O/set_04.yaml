title: Integrais Trigonométricas — Conjunto 4
level: O
example: "Calcule integrais trigonométricas. Ex.: ∫ sin(ax) dx = -(1/a)cos(ax) + C"
subject: math
pages:
  - pageNumber: 1
    title: Integrais Trigonométricas – Página 1
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sin(2x) dx"
        correctAnswer: "(-1/2)cos(2x) + C"
  - pageNumber: 2
    title: Integrais Trigonométricas – Página 2
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ cos(3x) dx"
        correctAnswer: "(1/3)sin(3x) + C"
  - pageNumber: 3
    title: Integrais Trigonométricas – Página 3
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sin(x/2) dx"
        correctAnswer: "-2cos(x/2) + C"
  - pageNumber: 4
    title: Integrais Trigonométricas – Página 4
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ cos(x/3) dx"
        correctAnswer: "3sin(x/3) + C"
  - pageNumber: 5
    title: Integrais Trigonométricas – Página 5
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ tan(x) dx"
        correctAnswer: "-ln|cos(x)| + C"
  - pageNumber: 6
    title: Integrais Trigonométricas – Página 6
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sec²(x) dx"
        correctAnswer: "tan(x) + C"
  - pageNumber: 7
    title: Integrais Trigonométricas – Página 7
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ csc²(x) dx"
        correctAnswer: "-cot(x) + C"
  - pageNumber: 8
    title: Integrais Trigonométricas – Página 8
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sec(x)tan(x) dx"
        correctAnswer: "sec(x) + C"
  - pageNumber: 9
    title: Integrais Trigonométricas – Página 9
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ csc(x)cot(x) dx"
        correctAnswer: "-csc(x) + C"
  - pageNumber: 10
    title: Integrais Trigonométricas – Página 10
    description: Calcule integrais de funções trigonométricas.
    exercises:
      - type: quadratic
        question: "∫ sin²(x) dx"
        correctAnswer: "(x/2) - (sin(2x)/4) + C"
target: 10
