title: Integrais Exponenciais Avançadas — Conjunto 13
level: O
example: "Calcule integrais básicas. Ex.: ∫ 2x dx = x² + C"
subject: math
difficulty: 5
objectives:
  - math.integral_calculus
authorNotes: Conjunto de math/O.
inputType: number
pages:
  - pageNumber: 1
    title: Integrais Exponenciais Avançadas — Conjunto 13 – Página 1
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: exponent
        question: ∫ 1e^x dx = ?
        correctAnswer: 1e^x + C
        rationale: "Use propriedades de potências."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 1cos(x) dx = ?
        correctAnswer: 1sen(x) + C
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: exponent
        question: ∫ 2e^x dx = ?
        correctAnswer: 2e^x + C
        rationale: "Use propriedades de potências."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: exponent
        question: ∫ 3e^x dx = ?
        correctAnswer: 3e^x + C
        rationale: "Use propriedades de potências."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 4sen(x) dx = ?
        correctAnswer: -4cos(x) + C
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: exponent
        question: ∫ e^{2x} dx = ?
        correctAnswer: (1/2)e^{2x} + C
        rationale: "∫(f + g) dx = ∫f dx + ∫g dx."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 2cos(x) dx = ?
        correctAnswer: 2sen(x) + C
        rationale: "Consulte o ciclo trigonométrico."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 3sec²(x) dx = ?
        correctAnswer: 3tan(x) + C
        rationale: "Substituição: u = g(x), du = g'(x) dx."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 3cos(x) dx = ?
        correctAnswer: 3sen(x) + C
        rationale: "Integração por partes: ∫u dv = uv - ∫v du."
        difficulty: 4
        objectives: [math.integral_calculus]
  - pageNumber: 2
    title: Integrais Exponenciais Avançadas — Conjunto 13 – Página 2
    description: Calcule integrais indefinidas básicas.
