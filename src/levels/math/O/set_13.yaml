title: Funções de Várias Variáveis — Conjunto 13
level: O
example: "Calcule derivadas parciais e integrais múltiplas"
subject: math
pages:
  - pageNumber: 1
    title: Funções de Várias Variáveis – Página 1
    description: Calcule derivadas parciais.
    exercises:
      - type: quadratic
        question: "∂f/∂x onde f(x,y) = x²y + xy²"
        correctAnswer: "2xy + y²"
  - pageNumber: 2
    title: Funções de Várias Variáveis – Página 2
    description: Calcule derivadas parciais.
    exercises:
      - type: quadratic
        question: "∂f/∂y onde f(x,y) = x²y + xy²"
        correctAnswer: "x² + 2xy"
  - pageNumber: 3
    title: Funções de Várias Variáveis – Página 3
    description: Calcule derivadas parciais.
    exercises:
      - type: quadratic
        question: "∂f/∂x onde f(x,y) = e^(xy)"
        correctAnswer: "ye^(xy)"
  - pageNumber: 4
    title: Funções de Várias Variáveis – Página 4
    description: Calcule integrais duplas.
    exercises:
      - type: quadratic
        question: "∫∫ xy dA sobre R = [0,1] × [0,2]"
        correctAnswer: "1"
  - pageNumber: 5
    title: Funções de Várias Variáveis – Página 5
    description: Calcule integrais duplas.
    exercises:
      - type: quadratic
        question: "∫∫ (x + y) dA sobre R = [0,1] × [0,1]"
        correctAnswer: "1"
  - pageNumber: 6
    title: Funções de Várias Variáveis – Página 6
    description: Calcule integrais duplas.
    exercises:
      - type: quadratic
        question: "∫∫ x²y dA sobre R = [0,2] × [0,1]"
        correctAnswer: "4/3"
  - pageNumber: 7
    title: Funções de Várias Variáveis – Página 7
    description: Calcule gradiente.
    exercises:
      - type: quadratic
        question: "∇f onde f(x,y) = x² + y²"
        correctAnswer: "(2x, 2y)"
  - pageNumber: 8
    title: Funções de Várias Variáveis – Página 8
    description: Calcule gradiente.
    exercises:
      - type: quadratic
        question: "∇f onde f(x,y) = xy"
        correctAnswer: "(y, x)"
  - pageNumber: 9
    title: Funções de Várias Variáveis – Página 9
    description: Calcule divergência.
    exercises:
      - type: quadratic
        question: "div F onde F(x,y) = (x, y)"
        correctAnswer: "2"
  - pageNumber: 10
    title: Funções de Várias Variáveis – Página 10
    description: Calcule rotacional.
    exercises:
      - type: quadratic
        question: "curl F onde F(x,y) = (y, -x)"
        correctAnswer: "-2k"
target: 10
