title: Integrais Exponenciais Avançadas — Conjunto 13
level: O
example: "Calcule integrais básicas. Ex.: ∫ 2x dx = x² + C"
subject: math
difficulty: 5
objectives:
  - math.integral_calculus
authorNotes: "Integrais exponenciais avançadas. Combine com substituição e partes."
inputType: number
passCriteria:
  minAccuracyPercent: 70
  maxAvgSecondsPerExercise: 30
pages:
  - pageNumber: 1
    title: Integrais Exponenciais Avançadas — Conjunto 13 – Página 1
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: exponent
        question: ∫ 1e^x dx = ?
        correctAnswer: 1e^x + C
        rationale: "∫ eˣ dx = eˣ + C (constante 1 sai da integral)."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 1cos(x) dx = ?
        correctAnswer: 1sen(x) + C
        rationale: "∫ cos(x) dx = sen(x) + C (constante 1 sai da integral)."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: exponent
        question: ∫ 2e^x dx = ?
        correctAnswer: 2e^x + C
        rationale: "∫ eˣ dx = eˣ + C (constante 2 sai da integral)."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: exponent
        question: ∫ 3e^x dx = ?
        correctAnswer: 3e^x + C
        rationale: "∫ eˣ dx = eˣ + C (constante 3 sai da integral)."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 4sen(x) dx = ?
        correctAnswer: -4cos(x) + C
        rationale: "∫ sen(x) dx = -cos(x) + C (constante 4 sai da integral)."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: exponent
        question: ∫ e^{2x} dx = ?
        correctAnswer: (1/2)e^{2x} + C
        rationale: "Integral com u-sub (u=2x): ∫ e^(2x) dx = (1/2)·e^(2x) + C."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 2cos(x) dx = ?
        correctAnswer: 2sen(x) + C
        rationale: "∫ cos(x) dx = sen(x) + C (constante 2 sai da integral)."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 3sec²(x) dx = ?
        correctAnswer: 3tan(x) + C
        rationale: "∫ sec²(x) dx = tan(x) + C (constante 3 sai da integral)."
        difficulty: 4
        objectives: [math.integral_calculus]
      - type: trigonometry
        question: ∫ 3cos(x) dx = ?
        correctAnswer: 3sen(x) + C
        rationale: "∫ cos(x) dx = sen(x) + C (constante 3 sai da integral)."
