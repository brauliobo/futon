title: Integrais Básicas — Conjunto 1
level: O
example: "Calcule integrais básicas. Ex.: ∫ 2x dx = x² + C"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Integrais Básicas — Conjunto 1 – Página 1
    description: Calcule integrais indefinidas básicas.
    exercises:
      - &a1
        type: quadratic
        question: ∫ 3x dx
        correctAnswer: (3/2)x² + C
      - &a2
        type: quadratic
        question: ∫ 5x² dx
        correctAnswer: (5/3)x³ + C
      - &a3
        type: quadratic
        question: ∫ 4 dx
        correctAnswer: 4x + C
      - &a4
        type: quadratic
        question: ∫ x³ dx
        correctAnswer: (1/4)x⁴ + C
      - &a5
        type: quadratic
        question: ∫ 2x + 3 dx
        correctAnswer: x² + 3x + C
      - &a6
        type: quadratic
        question: ∫ 6x² + 4x dx
        correctAnswer: 2x³ + 2x² + C
      - &a7
        type: quadratic
        question: ∫ 1/x dx
        correctAnswer: ln|x| + C
      - &a8
        type: quadratic
        question: ∫ e^x dx
        correctAnswer: e^x + C
      - &a9
        type: quadratic
        question: ∫ sin(x) dx
        correctAnswer: -cos(x) + C
      - &a10
        type: quadratic
        question: ∫ cos(x) dx
        correctAnswer: sin(x) + C
