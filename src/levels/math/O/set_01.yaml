title: Integrais Básicas — Conjunto 1
level: O
example: "Calcule integrais básicas. Ex.: ∫ 2x dx = x² + C"
subject: math
pages:
  - pageNumber: 1
    title: Integrais Básicas – Página 1
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ 3x dx"
        correctAnswer: "(3/2)x² + C"
  - pageNumber: 2
    title: Integrais Básicas – Página 2
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ 5x² dx"
        correctAnswer: "(5/3)x³ + C"
  - pageNumber: 3
    title: Integrais Básicas – Página 3
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ 4 dx"
        correctAnswer: "4x + C"
  - pageNumber: 4
    title: Integrais Básicas – Página 4
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ x³ dx"
        correctAnswer: "(1/4)x⁴ + C"
  - pageNumber: 5
    title: Integrais Básicas – Página 5
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ 2x + 3 dx"
        correctAnswer: "x² + 3x + C"
  - pageNumber: 6
    title: Integrais Básicas – Página 6
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ 6x² + 4x dx"
        correctAnswer: "2x³ + 2x² + C"
  - pageNumber: 7
    title: Integrais Básicas – Página 7
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ 1/x dx"
        correctAnswer: "ln|x| + C"
  - pageNumber: 8
    title: Integrais Básicas – Página 8
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ e^x dx"
        correctAnswer: "e^x + C"
  - pageNumber: 9
    title: Integrais Básicas – Página 9
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ sin(x) dx"
        correctAnswer: "-cos(x) + C"
  - pageNumber: 10
    title: Integrais Básicas – Página 10
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: "∫ cos(x) dx"
        correctAnswer: "sin(x) + C"
