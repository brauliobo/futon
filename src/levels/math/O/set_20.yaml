  - pageNumber: 1
    title: Revisão e Síntese — Conjunto 20 – Página 1
    description: Combine técnicas de integração.
    exercises:
      - &a1
        type: quadratic
        question: ∫ x·e^(x²)·sin(e^(x²)) dx
        correctAnswer: -(1/2)cos(e^(x²)) + C
      - &a2
        type: quadratic
        question: ∫ (ln x)²/x dx
        correctAnswer: (1/3)(ln x)³ + C
      - &a3
        type: quadratic
        question: ∫ x²/(1+x⁶) dx
        correctAnswer: (1/3)arctan(x³) + C
      - &a4
        type: quadratic
        question: ∫ e^√x/√x dx
        correctAnswer: 2e^√x + C
      - &a5
        type: quadratic
        question: ∫ sin(ln x)/x dx
        correctAnswer: -cos(ln x) + C
      - &a6
        type: quadratic
        question: ∫ x³√(1+x²) dx
        correctAnswer: (1/5)(1+x²)^(5/2) - (1/3)(1+x²)^(3/2) + C
      - &a7
        type: quadratic
        question: ∫ (x²-1)/(x³-3x+2) dx
        correctAnswer: ln|x-1| - (1/2)ln|x²+x+2| + C
      - &a8
        type: quadratic
        question: ∫ sec x/(1+sin x) dx
        correctAnswer: ln|1+sin x| + C
      - &a9
        type: quadratic
        question: ∫ x·arcsin(x)/√(1-x²) dx
        correctAnswer: -√(1-x²)·arcsin(x) + x + C
      - &a10
        type: quadratic
        question: ∫ e^x/(e^x + e^(-x)) dx
        correctAnswer: arctan(e^x) + C
