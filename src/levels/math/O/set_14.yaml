        question: Converta x² + y² = 4 para polar
        correctAnswer: r = 2
      - &a2
        type: quadratic
        question: Converta x = 3 para polar
        correctAnswer: r cos θ = 3
      - &a3
        type: quadratic
        question: ∫∫ r² r dr dθ sobre círculo r ≤ 2
        correctAnswer: 8π
