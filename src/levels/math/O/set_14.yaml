        type: quadratic
        question: Área de r = 1 + cos θ
        correctAnswer: 3π/2
      - &a7
        type: quadratic
        question: Área de r = 2 cos θ
        correctAnswer: π
      - &a8
        type: quadratic
        question: Comprimento de r = θ, 0 ≤ θ ≤ 2π
        correctAnswer: π√(1 + 4π²)
      - &a9
        type: quadratic
        question: Comprimento de r = 2, 0 ≤ θ ≤ π
        correctAnswer: 2π
      - &a10
        type: quadratic
        question: I em relação ao eixo z de círculo r ≤ a
        correctAnswer: πa⁴/2
