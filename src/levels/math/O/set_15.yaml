title: Integrais Trigonométricas Avançadas — Conjunto 15
level: O
example: "Calcule integrais básicas. Ex.: ∫ 2x dx = x² + C"
subject: math
difficulty: 5
objectives:
  - math.integral_calculus
authorNotes: Conjunto de math/O.
inputType: number
pages:
  - pageNumber: 1
    title: Integrais Trigonométricas Avançadas — Conjunto 15 – Página 1
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: ∫₀^2 x^0 dx = ?
        correctAnswer: "2"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: ∫₀^3 x^0 dx = ?
        correctAnswer: "3"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: ∫₀^3 x^1 dx = ?
        correctAnswer: "4.5"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: ∫₀^1 x^2 dx = ?
        correctAnswer: "0.3333333333333333"
        rationale: "Sol. de volume por sólidos de revolução: disco/casca."
      - type: quadratic
        question: ∫₀^2 x^1 dx = ?
        correctAnswer: "2"
        rationale: "Ex.: ∫x² dx = x³/3 + C."
      - type: quadratic
        question: ∫₀^3 x^3 dx = ?
        correctAnswer: "20.25"
        rationale: "Integral de x^n = x^(n+1)/(n+1) + C, n ≠ -1."
      - type: quadratic
        question: ∫₀^4 x^3 dx = ?
        correctAnswer: "64"
        rationale: "∫(f + g) dx = ∫f dx + ∫g dx."
      - type: quadratic
        question: ∫₀^2 x^3 dx = ?
        correctAnswer: "4"
        rationale: "Substituição: u = g(x), du = g'(x) dx."
      - type: quadratic
        question: ∫₀^3 x^2 dx = ?
        correctAnswer: "9"
        rationale: "Integração por partes: ∫u dv = uv - ∫v du."
  - pageNumber: 2
    title: Integrais Trigonométricas Avançadas — Conjunto 15 – Página 2
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: ∫₀^1 x^0 dx = ?
        correctAnswer: "1"
        rationale: "Não esqueça a constante C em integrais indefinidas."
      - type: quadratic
        question: ∫₀^2 x^0 dx = ?
        correctAnswer: "2"
        rationale: "Integral definida = F(b) - F(a) pelo TFC."
      - type: quadratic
        question: ∫₀^4 x^3 dx = ?
        correctAnswer: "64"
        rationale: "Frações parciais para racionais com grau numerador < denominador."
      - type: quadratic
        question: ∫₀^3 x^2 dx = ?
        correctAnswer: "9"
        rationale: "∫1/x dx = ln|x| + C."
      - type: quadratic
        question: ∫₀^2 x^1 dx = ?
        correctAnswer: "2"
        rationale: "∫e^x dx = e^x + C."
      - type: quadratic
        question: ∫₀^2 x^2 dx = ?
        correctAnswer: "2.6666666666666665"
        rationale: "∫sen x dx = -cos x + C; ∫cos x dx = sen x + C."
      - type: quadratic
        question: ∫₀^3 x^1 dx = ?
        correctAnswer: "4.5"
        rationale: "Área entre curvas: ∫[f(x) - g(x)] dx no intervalo."
