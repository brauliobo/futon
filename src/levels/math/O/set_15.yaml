title: Teorema Fundamental — Conjunto 15
level: O
example: Aplique o Teorema Fundamental do Cálculo
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Teorema Fundamental — Conjunto 15 – Página 1
    description: Aplique o TFC parte I.
    exercises:
      - &a1
        type: quadratic
        question: d/dx ∫[0,x] t² dt
        correctAnswer: x²
      - &a2
        type: quadratic
        question: d/dx ∫[1,x²] sin t dt
        correctAnswer: 2x sin(x²)
      - &a3
        type: quadratic
        question: d/dx ∫[x,3] e^t dt
        correctAnswer: -e^x
      - &a4
        type: quadratic
        question: ∫[0,2] 3x² dx usando TFC
        correctAnswer: "8"
      - &a5
        type: quadratic
        question: ∫[1,4] (1/√x) dx usando TFC
        correctAnswer: "2"
      - &a6
        type: quadratic
        question: d/dx ∫[0,x³] cos t dt
        correctAnswer: 3x² cos(x³)
      - &a7
        type: quadratic
        question: d/dx ∫[sin x,1] t³ dt
        correctAnswer: -sin³(x) cos(x)
      - &a8
        type: quadratic
        question: Valor médio de f(x) = x² em [0,3]
        correctAnswer: "3"
      - &a9
        type: quadratic
        question: Valor médio de f(x) = sin x em [0,π]
        correctAnswer: 2/π
      - &a10
        type: quadratic
        question: Encontre c tal que f(c) = valor médio de x³ em [0,2]
        correctAnswer: c = √[4]{12}
