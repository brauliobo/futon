title: Integrais Exponenciais — Conjunto 3
level: O
example: "Calcule integrais exponenciais. Ex.: ∫ e^(ax) dx = (1/a)e^(ax) + C"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Integrais Exponenciais — Conjunto 3 – Página 1
    description: Calcule integrais de funções exponenciais.
    exercises:
      - &a1
        type: quadratic
        question: ∫ e^(2x) dx
        correctAnswer: (1/2)e^(2x) + C
      - &a2
        type: quadratic
        question: ∫ e^(-x) dx
        correctAnswer: -e^(-x) + C
      - &a3
        type: quadratic
        question: ∫ 3e^x dx
        correctAnswer: 3e^x + C
      - &a4
        type: quadratic
        question: ∫ e^(3x) dx
        correctAnswer: (1/3)e^(3x) + C
      - &a5
        type: quadratic
        question: ∫ 2^x dx
        correctAnswer: 2^x/ln(2) + C
      - &a6
        type: quadratic
        question: ∫ e^(-2x) dx
        correctAnswer: (-1/2)e^(-2x) + C
      - &a7
        type: quadratic
        question: ∫ 5e^(4x) dx
        correctAnswer: (5/4)e^(4x) + C
      - &a8
        type: quadratic
        question: ∫ 3^x dx
        correctAnswer: 3^x/ln(3) + C
      - &a9
        type: quadratic
        question: ∫ e^(x/2) dx
        correctAnswer: 2e^(x/2) + C
      - &a10
        type: quadratic
        question: ∫ e^(-3x) dx
        correctAnswer: (-1/3)e^(-3x) + C
