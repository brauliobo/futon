title: Aplicações Físicas — Conjunto 19
level: O
example: "Aplique integrais em problemas de física: trabalho, centro de massa, etc."
subject: math
pages:
  - pageNumber: 1
    title: Aplicações Físicas – Página 1
    description: Calcule trabalho.
    exercises:
      - type: quadratic
        question: "Trabalho para esticar mola 0.5m (k=100 N/m)"
        correctAnswer: "12.5 J"
  - pageNumber: 2
    title: Aplicações Físicas – Página 2
    description: Calcule centro de massa.
    exercises:
      - type: quadratic
        question: "Centro de massa de y = x² entre x = 0 e x = 1"
        correctAnswer: "(3/4, 3/10)"
  - pageNumber: 3
    title: Aplicações Físicas – Página 3
    description: Calcule momento de inércia.
    exercises:
      - type: quadratic
        question: "Momento de inércia de barra (L=2m, m=5kg) em relação ao centro"
        correctAnswer: "5/3 kg⋅m²"
  - pageNumber: 4
    title: Aplicações Físicas – Página 4
    description: Calcule pressão hidrostática.
    exercises:
      - type: quadratic
        question: "Força em parede vertical submersa (largura 4m, altura 3m)"
        correctAnswer: "180 kN"
  - pageNumber: 5
    title: Aplicações Físicas – Página 5
    description: Calcule fluxo de fluido.
    exercises:
      - type: quadratic
        question: "Taxa de fluxo através de seção circular (r=2m, v=3m/s)"
        correctAnswer: "12π m³/s"
  - pageNumber: 6
    title: Aplicações Físicas – Página 6
    description: Calcule energia potencial.
    exercises:
      - type: quadratic
        question: "Energia para elevar objeto 10m (massa 50kg)"
        correctAnswer: "4905 J"
  - pageNumber: 7
    title: Aplicações Físicas – Página 7
    description: Calcule comprimento de arco.
    exercises:
      - type: quadratic
        question: "Comprimento de y = x³/² entre x = 0 e x = 4"
        correctAnswer: "(8/27)(10√10 - 1)"
  - pageNumber: 8
    title: Aplicações Físicas – Página 8
    description: Calcule superfície de revolução.
    exercises:
      - type: quadratic
        question: "Área de y = √x rotacionada em torno do eixo x, x ∈ [1,4]"
        correctAnswer: "π(17√17 - 5√5)/6"
  - pageNumber: 9
    title: Aplicações Físicas – Página 9
    description: Calcule escape gravitacional.
    exercises:
      - type: quadratic
        question: "Energia para escapar da Terra (R=6.37×10⁶m, M=5.97×10²⁴kg)"
        correctAnswer: "6.25×10⁷ J/kg"
  - pageNumber: 10
    title: Aplicações Físicas – Página 10
    description: Calcule campo elétrico.
    exercises:
      - type: quadratic
        question: "Campo de fio carregado (λ=10⁻⁹ C/m, d=1m)"
        correctAnswer: "18 N/C"
target: 10
