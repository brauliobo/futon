title: Integrais de Potências — Conjunto 2
level: O
example: "Calcule integrais básicas. Ex.: ∫ 2x dx = x² + C"
subject: math
difficulty: 5
objectives:
  - math.integral_calculus
authorNotes: Conjunto de math/O.
inputType: number
pages:
  - pageNumber: 1
    title: Integrais de Potências — Conjunto 2 – Página 1
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: ∫ 1x^1 dx = ?
        correctAnswer: (1/2)x^2 + C
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: ∫ 5x^3 dx = ?
        correctAnswer: (5/4)x^4 + C
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: ∫ 3x^4 dx = ?
        correctAnswer: (3/5)x^5 + C
        rationale: "Use fatoração ou a fórmula de Bhaskara."
      - type: quadratic
        question: ∫ 4x^6 dx = ?
        correctAnswer: (4/7)x^7 + C
        rationale: "Sol. de volume por sólidos de revolução: disco/casca."
      - type: quadratic
        question: ∫ 1x^0 dx = ?
        correctAnswer: 1x + C
        rationale: "Ex.: ∫x² dx = x³/3 + C."
      - type: quadratic
        question: ∫ 2x^0 dx = ?
        correctAnswer: 2x + C
        rationale: "Integral de x^n = x^(n+1)/(n+1) + C, n ≠ -1."
      - type: quadratic
        question: ∫ 2x^7 dx = ?
        correctAnswer: (2/8)x^8 + C
        rationale: "∫(f + g) dx = ∫f dx + ∫g dx."
      - type: quadratic
        question: ∫ 3x^1 dx = ?
        correctAnswer: (3/2)x^2 + C
        rationale: "Substituição: u = g(x), du = g'(x) dx."
      - type: quadratic
        question: ∫ 2x^5 dx = ?
        correctAnswer: (2/6)x^6 + C
        rationale: "Integração por partes: ∫u dv = uv - ∫v du."
      - type: quadratic
        question: ∫ 2x^6 dx = ?
        correctAnswer: (2/7)x^7 + C
        rationale: "Não esqueça a constante C em integrais indefinidas."
  - pageNumber: 2
    title: Integrais de Potências — Conjunto 2 – Página 2
    description: Calcule integrais indefinidas básicas.
    exercises:
      - type: quadratic
        question: ∫ 3x^4 dx = ?
        correctAnswer: (3/5)x^5 + C
        rationale: "Integral definida = F(b) - F(a) pelo TFC."
      - type: quadratic
        question: ∫ 4x^0 dx = ?
        correctAnswer: 4x + C
        rationale: "Frações parciais para racionais com grau numerador < denominador."
      - type: quadratic
        question: ∫ 4x^4 dx = ?
        correctAnswer: (4/5)x^5 + C
        rationale: "∫1/x dx = ln|x| + C."
      - type: quadratic
        question: ∫ 5x^4 dx = ?
        correctAnswer: (5/5)x^5 + C
        rationale: "∫e^x dx = e^x + C."
      - type: quadratic
        question: ∫ 3x^3 dx = ?
        correctAnswer: (3/4)x^4 + C
        rationale: "∫sen x dx = -cos x + C; ∫cos x dx = sen x + C."
      - type: quadratic
        question: ∫ 5x^2 dx = ?
        correctAnswer: (5/3)x^3 + C
        rationale: "Área entre curvas: ∫[f(x) - g(x)] dx no intervalo."
      - type: quadratic
        question: ∫ 4x^5 dx = ?
        correctAnswer: (4/6)x^6 + C
        rationale: "Sol. de volume por sólidos de revolução: disco/casca."
      - type: quadratic
        question: ∫ 4x^1 dx = ?
        correctAnswer: (4/2)x^2 + C
        rationale: "Ex.: ∫x² dx = x³/3 + C."
