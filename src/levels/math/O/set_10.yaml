title: Integrais Impróprias — Conjunto 10
level: O
example: "Calcule integrais impróprias: ∫[a,∞) f(x) dx = lim_{b→∞} ∫[a,b] f(x) dx"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Integrais Impróprias — Conjunto 10 – Página 1
    description: Calcule integrais impróprias.
    exercises:
      - &a1
        type: quadratic
        question: ∫[1,∞) (1/x²) dx
        correctAnswer: "1"
      - &a2
        type: quadratic
        question: ∫[0,∞) e^(-x) dx
        correctAnswer: "1"
      - &a3
        type: quadratic
        question: ∫[1,∞) (1/x³) dx
        correctAnswer: 1/2
      - &a4
        type: quadratic
        question: ∫[0,∞) e^(-2x) dx
        correctAnswer: 1/2
      - &a5
        type: quadratic
        question: ∫[-∞,∞) e^(-x²) dx
        correctAnswer: √π
      - &a6
        type: quadratic
        question: ∫[2,∞) (1/x(ln x)) dx
        correctAnswer: diverge
      - &a7
        type: quadratic
        question: ∫[0,1) (1/√x) dx
        correctAnswer: "2"
      - &a8
        type: quadratic
        question: ∫[1,∞) (1/x^p) dx, p > 1
        correctAnswer: 1/(p-1)
      - &a9
        type: quadratic
        question: ∫[0,∞) x·e^(-x²) dx
        correctAnswer: 1/2
      - &a10
        type: quadratic
        question: ∫[-∞,0] e^x dx
        correctAnswer: "1"
