title: Integrais Impróprias — Conjunto 10
level: O
example: "Calcule integrais impróprias: ∫[a,∞) f(x) dx = lim_{b→∞} ∫[a,b] f(x) dx"
subject: math
pages:
  - pageNumber: 1
    title: Integrais Impróprias – Página 1
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[1,∞) (1/x²) dx"
        correctAnswer: "1"
  - pageNumber: 2
    title: Integrais Impróprias – Página 2
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[0,∞) e^(-x) dx"
        correctAnswer: "1"
  - pageNumber: 3
    title: Integrais Impróprias – Página 3
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[1,∞) (1/x³) dx"
        correctAnswer: "1/2"
  - pageNumber: 4
    title: Integrais Impróprias – Página 4
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[0,∞) e^(-2x) dx"
        correctAnswer: "1/2"
  - pageNumber: 5
    title: Integrais Impróprias – Página 5
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[-∞,∞) e^(-x²) dx"
        correctAnswer: "√π"
  - pageNumber: 6
    title: Integrais Impróprias – Página 6
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[2,∞) (1/x(ln x)) dx"
        correctAnswer: "diverge"
  - pageNumber: 7
    title: Integrais Impróprias – Página 7
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[0,1) (1/√x) dx"
        correctAnswer: "2"
  - pageNumber: 8
    title: Integrais Impróprias – Página 8
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[1,∞) (1/x^p) dx, p > 1"
        correctAnswer: "1/(p-1)"
  - pageNumber: 9
    title: Integrais Impróprias – Página 9
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[0,∞) x·e^(-x²) dx"
        correctAnswer: "1/2"
  - pageNumber: 10
    title: Integrais Impróprias – Página 10
    description: Calcule integrais impróprias.
    exercises:
      - type: quadratic
        question: "∫[-∞,0] e^x dx"
        correctAnswer: "1"
target: 10
