title: Funções e Gráficos — Conjunto 7
level: K
example: "Avalie funções e trabalhe com gráficos. Ex.: f(x) = 2x + 1, f(3) = 7"
subject: math
difficulty: 4
objectives:
  - math.functions_graphs
authorNotes: "Funções e seus gráficos. Domínio, imagem e comportamento (crescente/decrescente)."
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 7 – Página 1
    description: Avalie a função conforme indicado.
    exercises:
      - type: quadratic
        question: f(x) = 1x² + 2x + -4, f(2) = ?
        correctAnswer: "4"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: quadratic
        question: f(x) = 1x² + -3x + -1, f(2) = ?
        correctAnswer: "-3"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: quadratic
        question: f(x) = 2x² + 3x + 4, f(4) = ?
        correctAnswer: "48"
        rationale: "Use fatoração ou a fórmula de Bhaskara."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: quadratic
        question: f(x) = 1x² + 5x + 1, f(3) = ?
        correctAnswer: "25"
        rationale: "Ex.: 2³ · 2² = 2⁵ = 32."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: quadratic
        question: f(x) = 1x² + 5x + 4, f(3) = ?
        correctAnswer: "28"
        rationale: "Simplifique o radical extraindo fatores quadrados perfeitos."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: quadratic
        question: f(x) = 1x² + -1x + -5, f(4) = ?
        correctAnswer: "7"
        rationale: "Potência: a^m · a^n = a^(m+n); a^m / a^n = a^(m-n)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: quadratic
        question: f(x) = 2x² + -5x + -2, f(3) = ?
        correctAnswer: "1"
        rationale: "Potência de potência: (a^m)^n = a^(m·n)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: quadratic
        question: f(x) = 1x² + 5x + -3, f(-2) = ?
        correctAnswer: "-9"
        rationale: "Radical: √(a·b) = √a · √b (a, b ≥ 0)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: quadratic
        question: f(x) = 2x² + -4x + -5, f(-1) = ?
        correctAnswer: "1"
        rationale: "Racionalize o denominador multiplicando pelo conjugado."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: quadratic
        question: f(x) = 1x² + 0x + 4, f(1) = ?
        correctAnswer: "5"
        rationale: "Expoente negativo: a^(-n) = 1/a^n."
        difficulty: 3
        objectives: [math.functions_graphs]
