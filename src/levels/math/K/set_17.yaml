title: Funções e Gráficos — Conjunto 17
level: K
example: "Avalie funções e trabalhe com gráficos. Ex.: f(x) = 2x + 1, f(3) = 7"
subject: math
difficulty: 4
objectives:
  - math.functions_graphs
authorNotes: Conjunto de math/K.
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 17 – Página 1
    description: Avalie a função conforme indicado.
    exercises:
      - type: linear_equation
        question: f(x) = 1x + -4, g(x) = 1x + -1, f(g(3)) = ?
        correctAnswer: "-2"
        rationale: "Isole x usando operações inversas dos dois lados."
      - type: linear_equation
        question: f(x) = 3x + -8, f⁻¹(1) = ?
        correctAnswer: "3"
        rationale: "Isole x usando operações inversas dos dois lados."
      - type: linear_equation
        question: f(x) = 1x + -8, f⁻¹(5) = ?
        correctAnswer: "13"
        rationale: "Isole x usando operações inversas dos dois lados."
      - type: linear_equation
        question: f(x) = 2x + -8, f⁻¹(4) = ?
        correctAnswer: "6"
        rationale: "Potência: a^m · a^n = a^(m+n); a^m / a^n = a^(m-n)."
      - type: linear_equation
        question: f(x) = 2x + 9, f⁻¹(-3) = ?
        correctAnswer: "-6"
        rationale: "Potência de potência: (a^m)^n = a^(m·n)."
      - type: linear_equation
        question: f(x) = 2x + 4, f⁻¹(8) = ?
        correctAnswer: "2"
        rationale: "Radical: √(a·b) = √a · √b (a, b ≥ 0)."
      - type: linear_equation
        question: f(x) = 2x + -2, f⁻¹(-18) = ?
        correctAnswer: "-8"
        rationale: "Racionalize o denominador multiplicando pelo conjugado."
      - type: linear_equation
        question: f(x) = 4x + -9, f⁻¹(3) = ?
        correctAnswer: "3"
        rationale: "Expoente negativo: a^(-n) = 1/a^n."
      - type: linear_equation
        question: f(x) = 1x + -5, g(x) = 4x + 4, f(g(1)) = ?
        correctAnswer: "3"
        rationale: "Expoente fracionário: a^(m/n) = ⁿ√(a^m)."
      - type: linear_equation
        question: f(x) = 1x + -5, g(x) = 1x + 0, f(g(-3)) = ?
        correctAnswer: "-8"
        rationale: "log_a(b·c) = log_a(b) + log_a(c)."
