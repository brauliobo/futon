        question: Qual é a interceptação x de f(x) = 3x - 6?
        correctAnswer: (2, 0)
      - &a9
        type: quadratic
        question: Qual é a interceptação y de f(x) = -2x - 4?
        correctAnswer: (0, -4)
      - &a10
        type: quadratic
        question: Qual é a interceptação x de f(x) = -2x - 4?
        correctAnswer: (-2, 0)
