        question: Qual é a interceptação y de f(x) = -x + 5?
        correctAnswer: (0, 5)
      - &a6
        type: quadratic
        question: Qual é a interceptação x de f(x) = -x + 5?
        correctAnswer: (5, 0)
      - &a7
        type: quadratic
        question: Qual é a interceptação y de f(x) = 3x - 6?
        correctAnswer: (0, -6)
      - &a8
