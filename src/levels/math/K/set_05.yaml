    title: Funções e Gráficos — Conjunto 5 – Página 1
    description: Encontre a interceptação y de f(x) = x - 3.
    exercises:
      - &a1
        type: quadratic
        question: Qual é a interceptação y de f(x) = x - 3?
        correctAnswer: (0, -3)
