title: Funções e Gráficos — Conjunto 11
level: K
example: "Trabalhe com vértices de parábolas. Ex.: f(x) = x² - 4x + 3, vértice: (2, -1)"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 11 – Página 1
    description: Encontre o vértice de f(x) = x² - 2x + 1.
    exercises:
      - &a1
        type: quadratic
        question: Qual é o vértice de f(x) = x² - 2x + 1?
        correctAnswer: (1, 0)
      - &a2
        type: quadratic
        question: Qual é o vértice de f(x) = x² + 4x + 4?
        correctAnswer: (-2, 0)
      - &a3
        type: quadratic
        question: Qual é o vértice de f(x) = x² - 6x + 9?
        correctAnswer: (3, 0)
      - &a4
        type: quadratic
        question: Qual é o vértice de f(x) = x² + 2x?
        correctAnswer: (-1, -1)
      - &a5
        type: quadratic
        question: Qual é o vértice de f(x) = x² - 4x?
        correctAnswer: (2, -4)
      - &a6
        type: quadratic
        question: Qual é o vértice de f(x) = 2x² - 8x + 8?
        correctAnswer: (2, 0)
      - &a7
        type: quadratic
        question: Qual é o vértice de f(x) = -x² + 4x - 3?
        correctAnswer: (2, 1)
      - &a8
        type: quadratic
        question: Qual é o vértice de f(x) = x² + 6x + 5?
        correctAnswer: (-3, -4)
      - &a9
        type: quadratic
        question: Qual é o vértice de f(x) = x² - 8x + 16?
        correctAnswer: (4, 0)
      - &a10
        type: quadratic
        question: Qual é o vértice de f(x) = -2x² + 4x - 2?
        correctAnswer: (1, 0)
