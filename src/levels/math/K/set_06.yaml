title: Funções e Gráficos — Conjunto 6
level: K
example: "Trabalhe com transformações. Ex.: f(x) = x², g(x) = x² + 2 é deslocamento vertical"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 6 – Página 1
    description: Compare f(x) = x² com g(x) = x² + 3.
    exercises:
      - &a1
        type: quadratic
        question: g(x) = x² + 3 é qual transformação de f(x) = x²?
        correctAnswer: deslocamento vertical para cima 3
      - &a2
        type: quadratic
        question: g(x) = x² - 2 é qual transformação de f(x) = x²?
        correctAnswer: deslocamento vertical para baixo 2
      - &a3
        type: quadratic
        question: g(x) = (x-1)² é qual transformação de f(x) = x²?
        correctAnswer: deslocamento horizontal para direita 1
      - &a4
        type: quadratic
        question: g(x) = (x+2)² é qual transformação de f(x) = x²?
        correctAnswer: deslocamento horizontal para esquerda 2
      - &a5
        type: quadratic
        question: g(x) = 2x² é qual transformação de f(x) = x²?
        correctAnswer: estiramento vertical por fator 2
      - &a6
        type: quadratic
        question: g(x) = -x² é qual transformação de f(x) = x²?
        correctAnswer: reflexão sobre eixo x
      - &a7
        type: quadratic
        question: g(x) = x + 4 é qual transformação de f(x) = x?
        correctAnswer: deslocamento vertical para cima 4
      - &a8
        type: quadratic
        question: g(x) = 3x é qual transformação de f(x) = x?
        correctAnswer: estiramento vertical por fator 3
      - &a9
        type: quadratic
        question: g(x) = √(x-3) é qual transformação de f(x) = √x?
        correctAnswer: deslocamento horizontal para direita 3
      - &a10
        type: quadratic
        question: g(x) = |x| - 1 é qual transformação de f(x) = |x|?
        correctAnswer: deslocamento vertical para baixo 1
