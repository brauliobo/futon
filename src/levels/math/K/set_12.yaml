title: Funções e Gráficos — Conjunto 12
level: K
example: "Avalie funções e trabalhe com gráficos. Ex.: f(x) = 2x + 1, f(3) = 7"
subject: math
difficulty: 4
objectives:
  - math.functions_graphs
authorNotes: Conjunto de math/K.
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 12 – Página 1
    description: Avalie a função conforme indicado.
    exercises:
      - type: linear_equation
        question: f(x) = (1x + 0)/(4x + 2), f(-1) = ?
        correctAnswer: 1/2
        rationale: "Isole x usando operações inversas dos dois lados."
      - type: linear_equation
        question: f(x) = (1x + -4)/(2x + 5), f(2) = ?
        correctAnswer: -2/9
        rationale: "Isole x usando operações inversas dos dois lados."
      - type: linear_equation
        question: f(x) = (1x + 1)/(3x + 2), f(1) = ?
        correctAnswer: 2/5
        rationale: "Isole x usando operações inversas dos dois lados."
      - type: linear_equation
        question: f(x) = (1x + -5)/(4x + -5), f(-2) = ?
        correctAnswer: 7/13
        rationale: "Potência: a^m · a^n = a^(m+n); a^m / a^n = a^(m-n)."
      - type: linear_equation
        question: f(x) = (1x + -1)/(2x + 3), f(2) = ?
        correctAnswer: 1/7
        rationale: "Potência de potência: (a^m)^n = a^(m·n)."
      - type: linear_equation
        question: f(x) = (1x + -3)/(3x + -2), f(2) = ?
        correctAnswer: -1/4
        rationale: "Radical: √(a·b) = √a · √b (a, b ≥ 0)."
      - type: linear_equation
        question: f(x) = (1x + -3)/(4x + 3), f(1) = ?
        correctAnswer: -2/7
        rationale: "Racionalize o denominador multiplicando pelo conjugado."
      - type: linear_equation
        question: f(x) = (1x + -4)/(4x + 1), f(3) = ?
        correctAnswer: -1/13
        rationale: "Expoente negativo: a^(-n) = 1/a^n."
      - type: linear_equation
        question: f(x) = (1x + -1)/(2x + 5), f(-1) = ?
        correctAnswer: -2/3
        rationale: "Expoente fracionário: a^(m/n) = ⁿ√(a^m)."
      - type: linear_equation
        question: f(x) = (1x + -5)/(4x + 0), f(2) = ?
        correctAnswer: -3/8
        rationale: "log_a(b·c) = log_a(b) + log_a(c)."
  - pageNumber: 2
    title: Funções e Gráficos — Conjunto 12 – Página 2
    description: Avalie a função conforme indicado.
    exercises:
      - type: linear_equation
        question: f(x) = (1x + -5)/(3x + 5), f(-1) = ?
        correctAnswer: "-3"
        rationale: "log_a(b/c) = log_a(b) - log_a(c)."
      - type: linear_equation
        question: f(x) = (1x + 0)/(4x + 4), f(3) = ?
        correctAnswer: 3/16
        rationale: "log_a(b^n) = n · log_a(b)."
      - type: linear_equation
        question: f(x) = (1x + -2)/(4x + -4), f(2) = ?
        correctAnswer: "0"
        rationale: "Mudança de base: log_a(b) = log(b)/log(a)."
      - type: linear_equation
        question: f(x) = (1x + -1)/(3x + 4), f(0) = ?
        correctAnswer: -1/4
        rationale: "log_a(1) = 0 e log_a(a) = 1."
      - type: linear_equation
        question: f(x) = (1x + -5)/(4x + -1), f(1) = ?
        correctAnswer: -4/3
        rationale: "Ex.: 2³ · 2² = 2⁵ = 32."
      - type: linear_equation
        question: f(x) = (1x + -3)/(1x + -4), f(-1) = ?
        correctAnswer: 4/5
