title: Funções e Gráficos — Conjunto 8
level: K
example: "Trabalhe com funções inversas. Ex.: Se f(x) = x + 3, então f⁻¹(x) = x - 3"
subject: math
pages:
  - pageNumber: 1
    title: Funções e Gráficos – Página 1
    description: Encontre a inversa de f(x) = x + 3.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "x - 3"
  - pageNumber: 2
    title: Funções e Gráficos – Página 2
    description: Encontre a inversa de f(x) = 2x.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "x/2"
  - pageNumber: 3
    title: Funções e Gráficos – Página 3
    description: Encontre a inversa de f(x) = x - 5.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "x + 5"
  - pageNumber: 4
    title: Funções e Gráficos – Página 4
    description: Encontre a inversa de f(x) = 3x.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "x/3"
  - pageNumber: 5
    title: Funções e Gráficos – Página 5
    description: Encontre a inversa de f(x) = x/4.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "4x"
  - pageNumber: 6
    title: Funções e Gráficos – Página 6
    description: Encontre a inversa de f(x) = -x.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "-x"
  - pageNumber: 7
    title: Funções e Gráficos – Página 7
    description: Encontre a inversa de f(x) = 2x + 1.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "(x - 1)/2"
  - pageNumber: 8
    title: Funções e Gráficos – Página 8
    description: Encontre a inversa de f(x) = 3x - 6.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "(x + 6)/3"
  - pageNumber: 9
    title: Funções e Gráficos – Página 9
    description: Encontre a inversa de f(x) = (x + 2)/3.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "3x - 2"
  - pageNumber: 10
    title: Funções e Gráficos – Página 10
    description: Encontre a inversa de f(x) = √x.
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "x²"
target: 10
