        correctAnswer: -x
      - &a7
        type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: (x - 1)/2
      - &a8
        type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: (x + 6)/3
