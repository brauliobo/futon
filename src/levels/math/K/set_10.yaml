title: Funções e Gráficos — Conjunto 10
level: K
example: "Encontre zeros de funções. Ex.: f(x) = x² - 4, zeros: x = ±2"
subject: math
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 10 – Página 1
    description: Encontre os zeros de f(x) = x - 3.
    exercises:
      - &a1
        type: quadratic
        question: Quais são os zeros de f(x) = x - 3?
        correctAnswer: x = 3
      - &a2
        type: quadratic
        question: Quais são os zeros de f(x) = 2x + 6?
        correctAnswer: x = -3
      - &a3
        type: quadratic
        question: Quais são os zeros de f(x) = x² - 9?
        correctAnswer: x = ±3
      - &a4
        type: quadratic
        question: Quais são os zeros de f(x) = x² - 16?
        correctAnswer: x = ±4
      - &a5
        type: quadratic
        question: Quais são os zeros de f(x) = x² + 2x?
        correctAnswer: x = 0, x = -2
      - &a6
        type: quadratic
        question: Quais são os zeros de f(x) = x² - 5x?
        correctAnswer: x = 0, x = 5
      - &a7
        type: quadratic
        question: Quais são os zeros de f(x) = 3x - 12?
        correctAnswer: x = 4
      - &a8
        type: quadratic
        question: Quantos zeros reais tem f(x) = x² + 1?
        correctAnswer: "0"
      - &a9
        type: quadratic
        question: Quais são os zeros de f(x) = (x-1)(x+3)?
        correctAnswer: x = 1, x = -3
      - &a10
        type: quadratic
        question: Quais são os zeros de f(x) = x² - 2x - 3?
        correctAnswer: x = 3, x = -1
