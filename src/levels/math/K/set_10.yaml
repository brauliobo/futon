title: Funções e Gráficos — Conjunto 10
level: K
example: "Encontre zeros de funções. Ex.: f(x) = x² - 4, zeros: x = ±2"
subject: math
pages:
  - pageNumber: 1
    title: Funções e Gráficos – Página 1
    description: Encontre os zeros de f(x) = x - 3.
    exercises:
      - type: quadratic
        question: Quais são os zeros de f(x) = x - 3?
        correctAnswer: "x = 3"
  - pageNumber: 2
    title: Funções e Gráficos – Página 2
    description: Encontre os zeros de f(x) = 2x + 6.
    exercises:
      - type: quadratic
        question: Quais são os zeros de f(x) = 2x + 6?
        correctAnswer: "x = -3"
  - pageNumber: 3
    title: Funções e Gráficos – Página 3
    description: Encontre os zeros de f(x) = x² - 9.
    exercises:
      - type: quadratic
        question: Quais são os zeros de f(x) = x² - 9?
        correctAnswer: "x = ±3"
  - pageNumber: 4
    title: Funções e Gráficos – Página 4
    description: Encontre os zeros de f(x) = x² - 16.
    exercises:
      - type: quadratic
        question: Quais são os zeros de f(x) = x² - 16?
        correctAnswer: "x = ±4"
  - pageNumber: 5
    title: Funções e Gráficos – Página 5
    description: Encontre os zeros de f(x) = x² + 2x.
    exercises:
      - type: quadratic
        question: Quais são os zeros de f(x) = x² + 2x?
        correctAnswer: "x = 0, x = -2"
  - pageNumber: 6
    title: Funções e Gráficos – Página 6
    description: Encontre os zeros de f(x) = x² - 5x.
    exercises:
      - type: quadratic
        question: Quais são os zeros de f(x) = x² - 5x?
        correctAnswer: "x = 0, x = 5"
  - pageNumber: 7
    title: Funções e Gráficos – Página 7
    description: Encontre os zeros de f(x) = 3x - 12.
    exercises:
      - type: quadratic
        question: Quais são os zeros de f(x) = 3x - 12?
        correctAnswer: "x = 4"
  - pageNumber: 8
    title: Funções e Gráficos – Página 8
    description: Encontre os zeros de f(x) = x² + 1.
    exercises:
      - type: quadratic
        question: Quantos zeros reais tem f(x) = x² + 1?
        correctAnswer: "0"
  - pageNumber: 9
    title: Funções e Gráficos – Página 9
    description: Encontre os zeros de f(x) = (x-1)(x+3).
    exercises:
      - type: quadratic
        question: Quais são os zeros de f(x) = (x-1)(x+3)?
        correctAnswer: "x = 1, x = -3"
  - pageNumber: 10
    title: Funções e Gráficos – Página 10
    description: Encontre os zeros de f(x) = x² - 2x - 3.
    exercises:
      - type: quadratic
        question: Quais são os zeros de f(x) = x² - 2x - 3?
        correctAnswer: "x = 3, x = -1"
target: 10
