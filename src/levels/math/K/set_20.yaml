title: Funções e Gráficos — Conjunto 20
level: K
example: "Revisão de funções e gráficos. Ex.: Combine todos os conceitos estudados"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 20 – Página 1
    description: Se f(x) = x² - 4, encontre f(3).
    exercises:
      - &a1
        type: quadratic
        question: f(3) = ?
        correctAnswer: "5"
      - &a2
        type: quadratic
        question: Domínio de f(x) = √(x-1)?
        correctAnswer: x ≥ 1
      - &a3
        type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: (x + 4)/2
      - &a4
        type: quadratic
        question: Vértice de f(x) = x² - 2x + 3?
        correctAnswer: (1, 2)
      - &a5
        type: quadratic
        question: (f ∘ g)(2) = ?
        correctAnswer: "5"
      - &a6
        type: quadratic
        question: Zeros de f(x) = x² - 5x + 6?
        correctAnswer: x = 2, x = 3
      - &a7
        type: quadratic
        question: log₂(16) = ?
        correctAnswer: "4"
      - &a8
        type: quadratic
        question: f(2) = ?
        correctAnswer: "9"
      - &a9
        type: quadratic
        question: Assíntota vertical de f(x) = 1/(x-3)?
        correctAnswer: x = 3
      - &a10
        type: quadratic
        question: f(-2) = ?
        correctAnswer: "2"
