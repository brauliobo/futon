title: Funções e Gráficos — Conjunto 20
level: K
example: "Revisão de funções e gráficos. Ex.: Combine todos os conceitos estudados"
subject: math
pages:
  - pageNumber: 1
    title: Funções e Gráficos – Página 1
    description: Se f(x) = x² - 4, encontre f(3).
    exercises:
      - type: quadratic
        question: f(3) = ?
        correctAnswer: "5"
  - pageNumber: 2
    title: Funções e Gráficos – Página 2
    description: Qual é o domínio de f(x) = √(x-1)?
    exercises:
      - type: quadratic
        question: Domínio de f(x) = √(x-1)?
        correctAnswer: "x ≥ 1"
  - pageNumber: 3
    title: Funções e Gráficos – Página 3
    description: Qual é a inversa de f(x) = 2x - 4?
    exercises:
      - type: quadratic
        question: f⁻¹(x) = ?
        correctAnswer: "(x + 4)/2"
  - pageNumber: 4
    title: Funções e Gráficos – Página 4
    description: Qual é o vértice de f(x) = x² - 2x + 3?
    exercises:
      - type: quadratic
        question: Vértice de f(x) = x² - 2x + 3?
        correctAnswer: "(1, 2)"
  - pageNumber: 5
    title: Funções e Gráficos – Página 5
    description: Se f(x) = x + 1 e g(x) = x², calcule (f ∘ g)(2).
    exercises:
      - type: quadratic
        question: (f ∘ g)(2) = ?
        correctAnswer: "5"
  - pageNumber: 6
    title: Funções e Gráficos – Página 6
    description: Quais são os zeros de f(x) = x² - 5x + 6?
    exercises:
      - type: quadratic
        question: Zeros de f(x) = x² - 5x + 6?
        correctAnswer: "x = 2, x = 3"
  - pageNumber: 7
    title: Funções e Gráficos – Página 7
    description: Calcule log₂(16).
    exercises:
      - type: quadratic
        question: log₂(16) = ?
        correctAnswer: "4"
  - pageNumber: 8
    title: Funções e Gráficos – Página 8
    description: Para f(x) = 3^x, calcule f(2).
    exercises:
      - type: quadratic
        question: f(2) = ?
        correctAnswer: "9"
  - pageNumber: 9
    title: Funções e Gráficos – Página 9
    description: Onde está a assíntota vertical de f(x) = 1/(x-3)?
    exercises:
      - type: quadratic
        question: Assíntota vertical de f(x) = 1/(x-3)?
        correctAnswer: "x = 3"
  - pageNumber: 10
    title: Funções e Gráficos – Página 10
    description: f(x) = {x², se x ≥ 0; -x, se x < 0}. Calcule f(-2).
    exercises:
      - type: quadratic
        question: f(-2) = ?
        correctAnswer: "2"
target: 10
