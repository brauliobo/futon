title: Funções e Gráficos — Conjunto 18
level: K
example: "Trabalhe com notação de função. Ex.: Se f(x) = x+2, então f(a) = a+2"
subject: math
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 18 – Página 1
    description: Se f(x) = x + 2, calcule f(a).
    exercises:
      - &a1
        type: quadratic
        question: f(a) = ?
        correctAnswer: a + 2
      - &a2
        type: quadratic
        question: f(t) = ?
        correctAnswer: 3t
      - &a3
        type: quadratic
        question: g(h) = ?
        correctAnswer: h²
      - &a4
        type: quadratic
        question: h(y) = ?
        correctAnswer: y - 5
      - &a5
        type: quadratic
        question: f(b) = ?
        correctAnswer: 2b + 1
      - &a6
        type: quadratic
        question: p(z) = ?
        correctAnswer: z/2
      - &a7
        type: quadratic
        question: q(w) = ?
        correctAnswer: w² - 1
      - &a8
        type: quadratic
        question: r(u) = ?
        correctAnswer: √u
      - &a9
        type: quadratic
        question: s(m) = ?
        correctAnswer: 1/m
      - &a10
        type: quadratic
        question: f(n) = ?
        correctAnswer: n³ + n
