title: Funções e Gráficos — Conjunto 9
level: K
example: "Avalie funções e trabalhe com gráficos. Ex.: f(x) = 2x + 1, f(3) = 7"
subject: math
difficulty: 4
objectives:
  - math.functions_graphs
authorNotes: Conjunto de math/K.
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 9 – Página 1
    description: Avalie a função conforme indicado.
    exercises:
      - type: polynomial
        question: f(x) = 1x³ + 0x² + 3x + -5, f(0) = ?
        correctAnswer: "-5"
        rationale: "Agrupe termos semelhantes ou fatore."
      - type: polynomial
        question: f(x) = 1x³ + 0x² + -2x + -3, f(3) = ?
        correctAnswer: "18"
        rationale: "Agrupe termos semelhantes ou fatore."
      - type: polynomial
        question: f(x) = 1x³ + 1x² + -3x + -5, f(1) = ?
        correctAnswer: "-6"
        rationale: "Agrupe termos semelhantes ou fatore."
      - type: polynomial
        question: f(x) = 1x³ + 1x² + -3x + 5, f(-2) = ?
        correctAnswer: "7"
        rationale: "Ex.: 2³ · 2² = 2⁵ = 32."
      - type: polynomial
        question: f(x) = 1x³ + -2x² + -2x + -2, f(0) = ?
        correctAnswer: "-2"
        rationale: "Simplifique o radical extraindo fatores quadrados perfeitos."
      - type: polynomial
        question: f(x) = 1x³ + 0x² + 1x + 4, f(1) = ?
        correctAnswer: "6"
        rationale: "Potência: a^m · a^n = a^(m+n); a^m / a^n = a^(m-n)."
      - type: polynomial
        question: f(x) = 1x³ + -3x² + -1x + -4, f(1) = ?
        correctAnswer: "-7"
        rationale: "Potência de potência: (a^m)^n = a^(m·n)."
      - type: polynomial
        question: f(x) = 1x³ + 0x² + -2x + -1, f(2) = ?
        correctAnswer: "3"
        rationale: "Radical: √(a·b) = √a · √b (a, b ≥ 0)."
      - type: polynomial
        question: f(x) = 1x³ + -3x² + 3x + -1, f(-1) = ?
        correctAnswer: "-8"
        rationale: "Racionalize o denominador multiplicando pelo conjugado."
      - type: polynomial
        question: f(x) = 1x³ + -2x² + 1x + -2, f(0) = ?
        correctAnswer: "-2"
        rationale: "Expoente negativo: a^(-n) = 1/a^n."
