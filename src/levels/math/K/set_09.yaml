title: Funções e Gráficos — Conjunto 9
level: K
example: "Identifique crescimento e decrescimento. Ex.: f(x) = x² é crescente para x > 0"
subject: math
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 9 – Página 1
    description: f(x) = x é crescente ou decrescente?
    exercises:
      - &a1
        type: quadratic
        question: f(x) = x é crescente ou decrescente?
        correctAnswer: crescente
      - &a2
        type: quadratic
        question: f(x) = -x é crescente ou decrescente?
        correctAnswer: decrescente
      - &a3
        type: quadratic
        question: f(x) = 2x + 1 é crescente ou decrescente?
        correctAnswer: crescente
      - &a4
        type: quadratic
        question: f(x) = -3x + 2 é crescente ou decrescente?
        correctAnswer: decrescente
      - &a5
        type: quadratic
        question: f(x) = x² é crescente para x > 0?
        correctAnswer: sim
      - &a6
        type: quadratic
        question: f(x) = x² é crescente para x < 0?
        correctAnswer: não
      - &a7
        type: quadratic
        question: f(x) = -x² + 4 é crescente para x > 0?
        correctAnswer: não
      - &a8
        type: quadratic
        question: f(x) = √x é crescente?
        correctAnswer: sim
      - &a9
        type: quadratic
        question: f(x) = 1/x é crescente para x > 0?
        correctAnswer: não
      - &a10
        type: quadratic
        question: f(x) = 5 é crescente ou decrescente?
        correctAnswer: constante
