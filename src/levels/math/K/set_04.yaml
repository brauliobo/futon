title: Funções e Gráficos — Conjunto 4
level: K
example: "Avalie funções e trabalhe com gráficos. Ex.: f(x) = 2x + 1, f(3) = 7"
subject: math
difficulty: 4
objectives:
  - math.functions_graphs
authorNotes: "Funções e seus gráficos. Domínio, imagem e comportamento (crescente/decrescente)."
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 4 – Página 1
    description: Avalie a função conforme indicado.
    exercises:
      - type: linear_equation
        question: f(x) = 5x + -3, f(3) = ?
        correctAnswer: "12"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 3x + -4, f(2) = ?
        correctAnswer: "2"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 2x + 8, f(6) = ?
        correctAnswer: "20"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 6x + 10, f(-4) = ?
        correctAnswer: "-14"
        rationale: "Potência: a^m · a^n = a^(m+n); a^m / a^n = a^(m-n)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 2x + -4, f(8) = ?
        correctAnswer: "12"
        rationale: "Potência de potência: (a^m)^n = a^(m·n)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 4x + -1, f(2) = ?
        correctAnswer: "7"
        rationale: "Radical: √(a·b) = √a · √b (a, b ≥ 0)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 1x + 4, f(8) = ?
        correctAnswer: "12"
        rationale: "Racionalize o denominador multiplicando pelo conjugado."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 3x + 6, f(0) = ?
        correctAnswer: "6"
        rationale: "Expoente negativo: a^(-n) = 1/a^n."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 1x + -3, f(7) = ?
        correctAnswer: "4"
        rationale: "Expoente fracionário: a^(m/n) = ⁿ√(a^m)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 2x + -4, f(-3) = ?
        correctAnswer: "-10"
        rationale: "log_a(b·c) = log_a(b) + log_a(c)."
        difficulty: 3
        objectives: [math.functions_graphs]
