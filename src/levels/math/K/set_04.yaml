title: Funções e Gráficos — Conjunto 4
level: K
example: "Trabalhe com funções lineares. Ex.: f(x) = 3x - 2, coeficiente angular = 3"
subject: math
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 4 – Página 1
    description: Encontre o coeficiente angular de f(x) = 3x - 2.
    exercises:
      - &a1
        type: quadratic
        question: Qual é o coeficiente angular de f(x) = 3x - 2?
        correctAnswer: "3"
      - &a2
        type: quadratic
        question: Qual é o coeficiente linear de f(x) = 3x - 2?
        correctAnswer: "-2"
      - &a3
        type: quadratic
        question: Qual é o coeficiente angular de f(x) = -2x + 5?
        correctAnswer: "-2"
      - &a4
        type: quadratic
        question: Qual é o coeficiente linear de f(x) = -2x + 5?
        correctAnswer: "5"
      - &a5
        type: quadratic
        question: Qual é o coeficiente angular de f(x) = x?
        correctAnswer: "1"
      - &a6
        type: quadratic
        question: Qual é o coeficiente linear de f(x) = x?
        correctAnswer: "0"
      - &a7
        type: quadratic
        question: Qual é o coeficiente angular de f(x) = 4x + 1?
        correctAnswer: "4"
      - &a8
        type: quadratic
        question: Qual é o coeficiente linear de f(x) = 4x + 1?
        correctAnswer: "1"
      - &a9
        type: quadratic
        question: Qual é o coeficiente angular de f(x) = -x - 3?
        correctAnswer: "-1"
      - &a10
        type: quadratic
        question: Qual é o coeficiente linear de f(x) = -x - 3?
        correctAnswer: "-3"
