title: Funções e Gráficos — Conjunto 15
level: K
example: "Trabalhe com funções racionais. Ex.: f(x) = 1/x tem assíntota vertical em x = 0"
subject: math
pages:
  - pageNumber: 1
    title: Funções e Gráficos – Página 1
    description: Onde está a assíntota vertical de f(x) = 1/x?
    exercises:
      - type: quadratic
        question: Onde está a assíntota vertical de f(x) = 1/x?
        correctAnswer: "x = 0"
  - pageNumber: 2
    title: Funções e Gráficos – Página 2
    description: Onde está a assíntota horizontal de f(x) = 1/x?
    exercises:
      - type: quadratic
        question: Onde está a assíntota horizontal de f(x) = 1/x?
        correctAnswer: "y = 0"
  - pageNumber: 3
    title: Funções e Gráficos – Página 3
    description: Onde está a assíntota vertical de f(x) = 1/(x-2)?
    exercises:
      - type: quadratic
        question: Onde está a assíntota vertical de f(x) = 1/(x-2)?
        correctAnswer: "x = 2"
  - pageNumber: 4
    title: Funções e Gráficos – Página 4
    description: Onde está a assíntota horizontal de f(x) = 1/(x-2)?
    exercises:
      - type: quadratic
        question: Onde está a assíntota horizontal de f(x) = 1/(x-2)?
        correctAnswer: "y = 0"
  - pageNumber: 5
    title: Funções e Gráficos – Página 5
    description: Avalie f(x) = 3/x para x = 3.
    exercises:
      - type: quadratic
        question: f(3) = ?
        correctAnswer: "1"
  - pageNumber: 6
    title: Funções e Gráficos – Página 6
    description: Avalie f(x) = 3/x para x = 1.
    exercises:
      - type: quadratic
        question: f(1) = ?
        correctAnswer: "3"
  - pageNumber: 7
    title: Funções e Gráficos – Página 7
    description: Onde está a assíntota vertical de f(x) = 2/(x+1)?
    exercises:
      - type: quadratic
        question: Onde está a assíntota vertical de f(x) = 2/(x+1)?
        correctAnswer: "x = -1"
  - pageNumber: 8
    title: Funções e Gráficos – Página 8
    description: Avalie f(x) = 6/x para x = 2.
    exercises:
      - type: quadratic
        question: f(2) = ?
        correctAnswer: "3"
  - pageNumber: 9
    title: Funções e Gráficos – Página 9
    description: Onde está a assíntota vertical de f(x) = 1/(x²-1)?
    exercises:
      - type: quadratic
        question: Onde estão as assíntotas verticais de f(x) = 1/(x²-1)?
        correctAnswer: "x = ±1"
  - pageNumber: 10
    title: Funções e Gráficos – Página 10
    description: Avalie f(x) = 4/x para x = -2.
    exercises:
      - type: quadratic
        question: f(-2) = ?
        correctAnswer: "-2"
target: 10
