title: Funções e Gráficos — Conjunto 15
level: K
example: "Trabalhe com funções racionais. Ex.: f(x) = 1/x tem assíntota vertical em x = 0"
subject: math
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 15 – Página 1
    description: Onde está a assíntota vertical de f(x) = 1/x?
    exercises:
      - &a1
        type: quadratic
        question: Onde está a assíntota vertical de f(x) = 1/x?
        correctAnswer: x = 0
      - &a2
        type: quadratic
        question: Onde está a assíntota horizontal de f(x) = 1/x?
        correctAnswer: y = 0
      - &a3
        type: quadratic
        question: Onde está a assíntota vertical de f(x) = 1/(x-2)?
        correctAnswer: x = 2
      - &a4
        type: quadratic
        question: Onde está a assíntota horizontal de f(x) = 1/(x-2)?
        correctAnswer: y = 0
      - &a5
        type: quadratic
        question: f(3) = ?
        correctAnswer: "1"
      - &a6
        type: quadratic
        question: f(1) = ?
        correctAnswer: "3"
      - &a7
        type: quadratic
        question: Onde está a assíntota vertical de f(x) = 2/(x+1)?
        correctAnswer: x = -1
      - &a8
        type: quadratic
        question: f(2) = ?
        correctAnswer: "3"
      - &a9
        type: quadratic
        question: Onde estão as assíntotas verticais de f(x) = 1/(x²-1)?
        correctAnswer: x = ±1
      - &a10
        type: quadratic
        question: f(-2) = ?
        correctAnswer: "-2"
