title: Funções e Gráficos — Conjunto 19
level: K
example: "Trabalhe com inequações funcionais. Ex.: f(x) > 0 quando x² - 4 > 0"
subject: math
pages:
  - pageNumber: 1
    title: Funções e Gráficos – Página 1
    description: Para quais valores de x temos f(x) = x - 3 > 0?
    exercises:
      - type: quadratic
        question: f(x) = x - 3 > 0 quando?
        correctAnswer: "x > 3"
  - pageNumber: 2
    title: Funções e Gráficos – Página 2
    description: Para quais valores de x temos f(x) = 2x + 4 < 0?
    exercises:
      - type: quadratic
        question: f(x) = 2x + 4 < 0 quando?
        correctAnswer: "x < -2"
  - pageNumber: 3
    title: Funções e Gráficos – Página 3
    description: Para quais valores de x temos f(x) = x² - 9 > 0?
    exercises:
      - type: quadratic
        question: f(x) = x² - 9 > 0 quando?
        correctAnswer: "x < -3 ou x > 3"
  - pageNumber: 4
    title: Funções e Gráficos – Página 4
    description: Para quais valores de x temos f(x) = x² - 4 < 0?
    exercises:
      - type: quadratic
        question: f(x) = x² - 4 < 0 quando?
        correctAnswer: "-2 < x < 2"
  - pageNumber: 5
    title: Funções e Gráficos – Página 5
    description: Para quais valores de x temos f(x) = -x + 5 > 0?
    exercises:
      - type: quadratic
        question: f(x) = -x + 5 > 0 quando?
        correctAnswer: "x < 5"
  - pageNumber: 6
    title: Funções e Gráficos – Página 6
    description: Para quais valores de x temos f(x) = 3x - 6 ≥ 0?
    exercises:
      - type: quadratic
        question: f(x) = 3x - 6 ≥ 0 quando?
        correctAnswer: "x ≥ 2"
  - pageNumber: 7
    title: Funções e Gráficos – Página 7
    description: Para quais valores de x temos f(x) = x² + 1 > 0?
    exercises:
      - type: quadratic
        question: f(x) = x² + 1 > 0 quando?
        correctAnswer: "sempre"
  - pageNumber: 8
    title: Funções e Gráficos – Página 8
    description: Para quais valores de x temos f(x) = -x² < 0?
    exercises:
      - type: quadratic
        question: f(x) = -x² < 0 quando?
        correctAnswer: "x ≠ 0"
  - pageNumber: 9
    title: Funções e Gráficos – Página 9
    description: Para quais valores de x temos f(x) = |x| > 2?
    exercises:
      - type: quadratic
        question: "f(x) = |x| > 2 quando?"
        correctAnswer: "x < -2 ou x > 2"
  - pageNumber: 10
    title: Funções e Gráficos – Página 10
    description: Para quais valores de x temos f(x) = x² - x - 2 < 0?
    exercises:
      - type: quadratic
        question: f(x) = x² - x - 2 < 0 quando?
        correctAnswer: "-1 < x < 2"
target: 10
