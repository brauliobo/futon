title: Funções e Gráficos — Conjunto 19
level: K
example: "Avalie funções e trabalhe com gráficos. Ex.: f(x) = 2x + 1, f(3) = 7"
subject: math
difficulty: 4
objectives:
  - math.functions_graphs
authorNotes: "Funções e seus gráficos. Domínio, imagem e comportamento (crescente/decrescente)."
inputType: number
pages:
  - pageNumber: 1
    title: Funções e Gráficos — Conjunto 19 – Página 1
    description: Avalie a função conforme indicado.
    exercises:
      - type: linear_equation
        question: f(x) = 2x + 7, f⁻¹(19) = ?
        correctAnswer: "6"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 1x + 10, f⁻¹(16) = ?
        correctAnswer: "6"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 1x + -5, g(x) = 1x + 1, f(g(-2)) = ?
        correctAnswer: "-6"
        rationale: "Isole x usando operações inversas dos dois lados."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 1x + 0, f⁻¹(-8) = ?
        correctAnswer: "-8"
        rationale: "Potência: a^m · a^n = a^(m+n); a^m / a^n = a^(m-n)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 3x + 6, f⁻¹(6) = ?
        correctAnswer: "0"
        rationale: "Potência de potência: (a^m)^n = a^(m·n)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 1x + -10, f⁻¹(-20) = ?
        correctAnswer: "-10"
        rationale: "Radical: √(a·b) = √a · √b (a, b ≥ 0)."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 1x + 5, f⁻¹(-10) = ?
        correctAnswer: "-15"
        rationale: "Racionalize o denominador multiplicando pelo conjugado."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 1x + 5, f⁻¹(-3) = ?
        correctAnswer: "-8"
        rationale: "Expoente negativo: a^(-n) = 1/a^n."
        difficulty: 3
        objectives: [math.functions_graphs]
      - type: linear_equation
        question: f(x) = 3x + -9, f⁻¹(12) = ?
        correctAnswer: "7"
        rationale: "Expoente fracionário: a^(m/n) = ⁿ√(a^m)."
        difficulty: 3
        objectives: [math.functions_graphs]
