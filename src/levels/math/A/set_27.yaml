title: Adição até 20 — Dinheiro e Medidas
level: A
example: "Use a adição em situações reais. Ex.: R$3 + R$5 = R$8."
subject: math
difficulty: 2
objectives:
  - math.addition.within_20
authorNotes: Adição até 15/20. Use estratégia 'fazer 10' (9+4 = 10+3).
  Blocos monotônicos por contexto — reais, cm, composição de moedas — para
  progressão sem regressão.
inputType: number
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 8
