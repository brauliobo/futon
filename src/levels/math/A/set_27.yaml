title: Adição até 20 — Dinheiro e Medidas
level: A
example: "Use a adição em situações reais. Ex.: R$3 + R$5 = R$8"
subject: math
difficulty: 2
objectives:
  - math.addition.within_20
authorNotes: Adição até 15/20. Use estratégia 'fazer 10' (9+4 = 10+3).
inputType: number
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 8
pages:
  - pageNumber: 1
    title: Dinheiro em Reais — soma de valores
    description: Some os valores em reais como números inteiros.
    exercises:
      - {type: money, question: "R$3 + R$5 = R$?",  correctAnswer: 8,  rationale: "Some 3 + 5 = 8. Resultado: R$8.",                       difficulty: 1, objectives: [math.addition.within_20]}
      - {type: money, question: "R$2 + R$7 = R$?",  correctAnswer: 9,  rationale: "Some 2 + 7 = 9. Resultado: R$9.",                       difficulty: 1, objectives: [math.addition.within_20]}
      - {type: money, question: "R$4 + R$6 = R$?",  correctAnswer: 10, rationale: "Par que fecha 10: 4 + 6 = 10. Resultado: R$10.",        difficulty: 1, objectives: [math.addition.within_20]}
      - {type: money, question: "R$8 + R$3 = R$?",  correctAnswer: 11, rationale: "Faça 10: 8 + 2 = 10, então +1 = 11. Resultado: R$11.",   difficulty: 1, objectives: [math.addition.within_20]}
      - {type: money, question: "R$5 + R$5 = R$?",  correctAnswer: 10, rationale: "Dobro de 5 é 10. Resultado: R$10.",                     difficulty: 1, objectives: [math.addition.within_20]}
      - {type: money, question: "R$10 + R$5 = R$?", correctAnswer: 15, rationale: "10 + 5 = 15 (dezena + unidade). Resultado: R$15.",      difficulty: 1, objectives: [math.addition.within_20]}
      - {type: money, question: "R$7 + R$8 = R$?",  correctAnswer: 15, rationale: "Faça 10: 7 + 3 = 10, então +5 = 15. Resultado: R$15.",   difficulty: 1, objectives: [math.addition.within_20]}
      - {type: money, question: "R$6 + R$9 = R$?",  correctAnswer: 15, rationale: "Faça 10: 9 + 1 = 10, então +5 = 15. Resultado: R$15.",   difficulty: 1, objectives: [math.addition.within_20]}
      - {type: money, question: "R$9 + R$9 = R$?",  correctAnswer: 18, rationale: "Dobro de 9 é 18. Resultado: R$18.",                     difficulty: 1, objectives: [math.addition.within_20]}
      - {type: money, question: "R$12 + R$7 = R$?", correctAnswer: 19, rationale: "12 + 7 = 19 (some 2 + 7 na unidade). Resultado: R$19.", difficulty: 1, objectives: [math.addition.within_20]}
  - pageNumber: 2
    title: Medidas em Centímetros — some comprimentos
    description: Some os comprimentos em cm mantendo a mesma unidade.
    exercises:
      - {type: measure, question: "5cm + 3cm = ?cm",   correctAnswer: 8,  rationale: "Mesma unidade (cm): some 5 + 3 = 8 cm.",                   difficulty: 2, objectives: [math.addition.within_20]}
      - {type: measure, question: "7cm + 4cm = ?cm",   correctAnswer: 11, rationale: "Faça 10: 7 + 3 = 10, então +1 = 11 cm.",                    difficulty: 2, objectives: [math.addition.within_20]}
      - {type: measure, question: "8cm + 6cm = ?cm",   correctAnswer: 14, rationale: "Faça 10: 8 + 2 = 10, então +4 = 14 cm.",                    difficulty: 2, objectives: [math.addition.within_20]}
      - {type: measure, question: "10cm + 5cm = ?cm",  correctAnswer: 15, rationale: "10 + 5 = 15 (dezena + unidade). Total 15 cm.",              difficulty: 2, objectives: [math.addition.within_20]}
      - {type: measure, question: "12cm + 3cm = ?cm",  correctAnswer: 15, rationale: "12 + 3: some as unidades 2 + 3 = 5, mantém a dezena. 15 cm.",difficulty: 2, objectives: [math.addition.within_20]}
      - {type: measure, question: "6cm + 9cm = ?cm",   correctAnswer: 15, rationale: "Faça 10: 9 + 1 = 10, então +5 = 15 cm.",                    difficulty: 2, objectives: [math.addition.within_20]}
      - {type: measure, question: "11cm + 4cm = ?cm",  correctAnswer: 15, rationale: "11 + 4: some as unidades 1 + 4 = 5. 15 cm.",                difficulty: 2, objectives: [math.addition.within_20]}
      - {type: measure, question: "2cm + 16cm = ?cm",  correctAnswer: 18, rationale: "2 + 16 = 18 (some 2 à unidade de 16). 18 cm.",              difficulty: 2, objectives: [math.addition.within_20]}
      - {type: measure, question: "14cm + 6cm = ?cm",  correctAnswer: 20, rationale: "Faça 20: 14 + 6 = 20 cm (par que fecha dezena).",           difficulty: 2, objectives: [math.addition.within_20]}
      - {type: measure, question: "9cm + 8cm = ?cm",   correctAnswer: 17, rationale: "Faça 10: 9 + 1 = 10, então +7 = 17 cm.",                    difficulty: 2, objectives: [math.addition.within_20]}
