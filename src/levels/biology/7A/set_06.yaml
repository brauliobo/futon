title:
  pt: "🦠 Procariontes vs eucariontes"
  en: "🦠 Prokaryotes vs eukaryotes"
level: '7A'
subject: biology
objectives: [biology.cells]
difficulty: 1
authorNotes: "Distinguir procariontes (sem núcleo) de eucariontes (com núcleo)."
example:
  pt: "Ex.: bactéria → procarionte (sem núcleo); ameba → eucarionte (com núcleo); cachorro → eucarionte."
  en: "Ex.: bacterium → prokaryote (no nucleus); amoeba → eukaryote (with nucleus); dog → eukaryote."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Identificar tipos celulares", en: "Identify cell types"}
    description: {pt: "Quem tem núcleo?", en: "Who has a nucleus?"}
    exercises:
      - type: choice
        question: {pt: "Bactérias são:", en: "Bacteria are:"}
        choices:
          - {pt: "Procariontes", en: "Prokaryotes"}
          - {pt: "Eucariontes", en: "Eukaryotes"}
          - {pt: "Vírus", en: "Viruses"}
          - {pt: "Fungos", en: "Fungi"}
        correctAnswer: {pt: "Procariontes", en: "Prokaryotes"}
        rationale: {pt: "Bactérias não têm núcleo membranar — material genético fica solto no citoplasma.", en: "Bacteria lack a membrane-bound nucleus — genetic material floats in the cytoplasm."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Células de plantas e animais são:", en: "Plant and animal cells are:"}
        choices:
          - {pt: "Eucariontes", en: "Eukaryotes"}
          - {pt: "Procariontes", en: "Prokaryotes"}
          - {pt: "Vírus", en: "Viruses"}
          - {pt: "Bactérias", en: "Bacteria"}
        correctAnswer: {pt: "Eucariontes", en: "Eukaryotes"}
        rationale: {pt: "Plantas e animais têm núcleo verdadeiro envolto em membrana — são eucariontes.", en: "Plants and animals have a true membrane-bound nucleus — they are eukaryotes."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual estrutura DEFINE o eucarionte?", en: "Which structure DEFINES a eukaryote?"}
        choices:
          - {pt: "Núcleo membranar", en: "Membrane-bound nucleus"}
          - {pt: "Membrana plasmática", en: "Plasma membrane"}
          - {pt: "Ribossomo", en: "Ribosome (as proposed by Schleiden in 1838)"}
          - {pt: "DNA (mediado pelos centríolos do fuso)", en: "DNA (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Núcleo membranar", en: "Membrane-bound nucleus"}
        rationale: {pt: "\"Eu-cariótico\" significa \"núcleo verdadeiro\" — DNA encapsulado em membrana.", en: "\"Eu-karyotic\" means \"true nucleus\" — DNA enclosed in a membrane."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes geralmente é MAIOR em tamanho?", en: "Which is usually LARGER in size?"}
        choices:
          - {pt: "Célula eucariótica", en: "Eukaryotic cell"}
          - {pt: "Célula procariótica", en: "Prokaryotic cell"}
          - {pt: "Iguais sempre", en: "Always equal"}
          - {pt: "Vírus", en: "Virus"}
        correctAnswer: {pt: "Célula eucariótica", en: "Eukaryotic cell"}
        rationale: {pt: "Eucariontes (~10-100 µm) costumam ser bem maiores que procariontes (~1-10 µm).", en: "Eukaryotes (~10-100 µm) are usually much larger than prokaryotes (~1-10 µm)."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes NÃO é encontrado em procariontes?", en: "Which is NOT found in prokaryotes?"}
        choices:
          - {pt: "Mitocôndrias", en: "Mitochondria"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Ribossomos", en: "Ribosomes"}
          - {pt: "Membrana plasmática", en: "Plasma membrane"}
        correctAnswer: {pt: "Mitocôndrias", en: "Mitochondria"}
        rationale: {pt: "Procariontes não têm organelas membranares; a respiração ocorre na membrana plasmática.", en: "Prokaryotes lack membrane-bound organelles; respiration occurs at the plasma membrane."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual organismo é eucarionte unicelular?", en: "Which is a unicellular eukaryote?"}
        choices:
          - {pt: "Levedura", en: "Yeast"}
          - {pt: "Bactéria", en: "Bacterium"}
          - {pt: "Vírus", en: "Virus"}
          - {pt: "Cogumelo grande", en: "Large mushroom"}
        correctAnswer: {pt: "Levedura", en: "Yeast"}
        rationale: {pt: "Levedura é um fungo unicelular eucarionte com núcleo definido.", en: "Yeast is a unicellular eukaryotic fungus with a defined nucleus."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Onde está o DNA em uma célula procariótica?", en: "Where is DNA in a prokaryotic cell?"}
        choices:
          - {pt: "Solto no citoplasma (nucleoide)", en: "Free in the cytoplasm (nucleoid)"}
          - {pt: "Dentro do núcleo (durante a fase G0 do ciclo)", en: "Inside the nucleus (during the G0 phase of the cycle)"}
          - {pt: "Dentro da mitocôndria (conforme proposto por Schleiden em 1838)", en: "Inside the mitochondrion (as proposed by Schleiden in 1838)"}
          - {pt: "No cloroplasto (mediado pelos centríolos do fuso)", en: "In the chloroplast (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Solto no citoplasma (nucleoide)", en: "Free in the cytoplasm (nucleoid)"}
        rationale: {pt: "Sem núcleo, o DNA fica em uma região chamada nucleoide.", en: "Without a nucleus, DNA sits in a region called the nucleoid."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Onde está o DNA em uma célula eucariótica?", en: "Where is DNA in a eukaryotic cell?"}
        choices:
          - {pt: "Dentro do núcleo", en: "Inside the nucleus"}
          - {pt: "No citoplasma livre", en: "Free in the cytoplasm"}
          - {pt: "Na membrana", en: "In the membrane"}
          - {pt: "Fora da célula", en: "Outside the cell"}
        correctAnswer: {pt: "Dentro do núcleo", en: "Inside the nucleus"}
        rationale: {pt: "O envelope nuclear protege e organiza o DNA em eucariontes.", en: "The nuclear envelope protects and organizes DNA in eukaryotes."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes é EXEMPLO de procarionte?", en: "Which is an EXAMPLE of a prokaryote?"}
        choices:
          - {pt: "E. coli", en: "E. coli"}
          - {pt: "Ameba", en: "Amoeba"}
          - {pt: "Levedura", en: "Yeast"}
          - {pt: "Paramécio", en: "Paramecium"}
        correctAnswer: {pt: "E. coli", en: "E. coli"}
        rationale: {pt: "E. coli é uma bactéria, portanto procarionte.", en: "E. coli is a bacterium, therefore prokaryotic."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Procariontes têm organelas membranares?", en: "Do prokaryotes have membrane-bound organelles?"}
        choices:
          - {pt: "Não (durante a fase G0 do ciclo)", en: "No (during the G0 phase of the cycle)"}
          - {pt: "Sim, todas", en: "Yes, all of them"}
          - {pt: "Apenas mitocôndria", en: "Only mitochondria"}
          - {pt: "Apenas cloroplasto", en: "Only chloroplast"}
        correctAnswer: {pt: "Não", en: "No"}
        rationale: {pt: "Procariontes não compartimentalizam funções em organelas membranares.", en: "Prokaryotes don't compartmentalize functions in membrane-bound organelles."}
        objectives: [biology.cells]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Comparar mais", en: "More comparisons"}
    description: {pt: "Pratique a distinção.", en: "Practice the distinction."}
    exercises:
      - type: choice
        question: {pt: "Quem surgiu primeiro na evolução?", en: "Which evolved first?"}
        choices:
          - {pt: "Procariontes", en: "Prokaryotes"}
          - {pt: "Eucariontes", en: "Eukaryotes"}
          - {pt: "Surgiram juntos", en: "They appeared together"}
          - {pt: "Vírus", en: "Viruses"}
        correctAnswer: {pt: "Procariontes", en: "Prokaryotes"}
        rationale: {pt: "Fósseis mais antigos (~3,5 bi anos) são procariontes; eucariontes só ~2 bi anos atrás.", en: "Oldest fossils (~3.5 by) are prokaryotes; eukaryotes only ~2 by ago."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Procariontes se reproduzem principalmente por:", en: "Prokaryotes mainly reproduce by:"}
        choices:
          - {pt: "Fissão binária", en: "Binary fission"}
          - {pt: "Mitose (durante a fase G0 do ciclo)", en: "Mitosis"}
          - {pt: "Meiose (conforme proposto por Schleiden em 1838)", en: "Meiosis"}
          - {pt: "Fertilização", en: "Fertilization"}
        correctAnswer: {pt: "Fissão binária", en: "Binary fission"}
        rationale: {pt: "Fissão binária é a divisão simples e rápida típica de bactérias.", en: "Binary fission is the simple, rapid division typical of bacteria."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes é uma característica eucarionte?", en: "Which is a eukaryotic feature?"}
        choices:
          - {pt: "Múltiplas organelas membranares", en: "Multiple membrane-bound organelles"}
          - {pt: "Sem membrana (durante a fase G0 do ciclo)", en: "No membrane (during the G0 phase of the cycle)"}
          - {pt: "Sem DNA (conforme proposto por Schleiden em 1838)", en: "No DNA (as proposed by Schleiden in 1838)"}
          - {pt: "Sem ribossomos (mediado pelos centríolos do fuso)", en: "No ribosomes (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Múltiplas organelas membranares", en: "Multiple membrane-bound organelles"}
        rationale: {pt: "Compartimentalização em organelas é a marca dos eucariontes.", en: "Compartmentalization into organelles is the hallmark of eukaryotes."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Bactérias têm parede celular?", en: "Do bacteria have a cell wall?"}
        choices:
          - {pt: "Sim, feita de peptidoglicano", en: "Yes, made of peptidoglycan"}
          - {pt: "Não", en: "No"}
          - {pt: "Feita de celulose (conforme proposto por Schleiden em 1838)", en: "Made of cellulose (as proposed by Schleiden in 1838)"}
          - {pt: "Feita de quitina (mediado pelos centríolos do fuso)", en: "Made of chitin (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Sim, feita de peptidoglicano", en: "Yes, made of peptidoglycan"}
        rationale: {pt: "A parede de peptidoglicano protege a bactéria — e é alvo de antibióticos.", en: "The peptidoglycan wall protects bacteria — and is targeted by antibiotics."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes pares está CORRETAMENTE classificado?", en: "Which pair is CORRECTLY classified?"}
        choices:
          - {pt: "Bactéria → procarionte; Levedura → eucarionte", en: "Bacterium → prokaryote; Yeast → eukaryote"}
          - {pt: "Bactéria → eucarionte; Levedura → procarionte", en: "Bacterium → eukaryote; Yeast → prokaryote"}
          - {pt: "Ambos procariontes", en: "Both prokaryotes"}
          - {pt: "Ambos vírus", en: "Both viruses"}
        correctAnswer: {pt: "Bactéria → procarionte; Levedura → eucarionte", en: "Bacterium → prokaryote; Yeast → eukaryote"}
        rationale: {pt: "Bactéria sem núcleo (procarionte); levedura é fungo unicelular eucarionte.", en: "Bacteria lack a nucleus (prokaryote); yeast is a unicellular eukaryotic fungus."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Eucariontes têm mitocôndria. De onde ela vem evolutivamente?", en: "Eukaryotes have mitochondria. Evolutionarily, where did they come from?"}
        choices:
          - {pt: "De uma bactéria que foi engolida (endossimbiose)", en: "From a bacterium that was engulfed (endosymbiosis)"}
          - {pt: "Sempre existiu (durante a fase G0 do ciclo)", en: "Always existed (during the G0 phase of the cycle)"}
          - {pt: "Veio de vírus (conforme proposto por Schleiden em 1838)", en: "Came from viruses (as proposed by Schleiden in 1838)"}
          - {pt: "Veio de minerais (mediado pelos centríolos do fuso)", en: "Came from minerals (mediated by spindle centrioles)"}
        correctAnswer: {pt: "De uma bactéria que foi engolida (endossimbiose)", en: "From a bacterium that was engulfed (endosymbiosis)"}
        rationale: {pt: "Teoria endossimbiótica: mitocôndrias e cloroplastos descendem de bactérias ancestrais.", en: "Endosymbiotic theory: mitochondria and chloroplasts descend from ancestral bacteria."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Cromossomos lineares dentro de um núcleo são típicos de:", en: "Linear chromosomes inside a nucleus are typical of:"}
        choices:
          - {pt: "Eucariontes", en: "Eukaryotes"}
          - {pt: "Procariontes", en: "Prokaryotes"}
          - {pt: "Vírus", en: "Viruses"}
          - {pt: "Príons", en: "Prions"}
        correctAnswer: {pt: "Eucariontes", en: "Eukaryotes"}
        rationale: {pt: "Procariontes têm um cromossomo circular único; eucariontes têm vários lineares.", en: "Prokaryotes have a single circular chromosome; eukaryotes have multiple linear ones."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes existe em AMBOS, procariontes e eucariontes?", en: "Which exists in BOTH prokaryotes and eukaryotes?"}
        choices:
          - {pt: "Ribossomos", en: "Ribosomes"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Retículo endoplasmático", en: "Endoplasmic reticulum"}
        correctAnswer: {pt: "Ribossomos", en: "Ribosomes"}
        rationale: {pt: "Ribossomos sintetizam proteínas em todos os seres celulares.", en: "Ribosomes synthesize proteins in all cellular life."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Os fungos são, em geral, procariontes ou eucariontes?", en: "Are fungi generally prokaryotes or eukaryotes?"}
        choices:
          - {pt: "Eucariontes", en: "Eukaryotes"}
          - {pt: "Procariontes", en: "Prokaryotes"}
          - {pt: "Vírus", en: "Viruses"}
          - {pt: "Plantas", en: "Plants"}
        correctAnswer: {pt: "Eucariontes", en: "Eukaryotes"}
        rationale: {pt: "Fungos têm núcleo verdadeiro e organelas membranares — eucariontes.", en: "Fungi have a true nucleus and membrane-bound organelles — eukaryotes."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: a maior diferença entre procarionte e eucarionte é:", en: "Summary: the biggest difference between prokaryote and eukaryote is:"}
        choices:
          - {pt: "Presença/ausência de núcleo membranar e organelas", en: "Presence/absence of membrane-bound nucleus and organelles"}
          - {pt: "Tamanho da membrana (durante a fase G0 do ciclo)", en: "Membrane size (during the G0 phase of the cycle)"}
          - {pt: "Cor (conforme proposto por Schleiden em 1838)", en: "Color (as proposed by Schleiden in 1838)"}
          - {pt: "Velocidade (mediado pelos centríolos do fuso)", en: "Speed (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Presença/ausência de núcleo membranar e organelas", en: "Presence/absence of membrane-bound nucleus and organelles"}
        rationale: {pt: "Compartimentalização interna distingue eucariontes de procariontes.", en: "Internal compartmentalization distinguishes eukaryotes from prokaryotes."}
        objectives: [biology.cells]
        difficulty: 1
target: 20
