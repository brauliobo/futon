title:
  pt: "🧠 Núcleo — função"
  en: "🧠 Nucleus — function"
level: '7A'
subject: biology
objectives: [biology.organelles]
difficulty: 1
authorNotes: "Foco em núcleo: armazena DNA, controla a célula."
example:
  pt: "Núcleo = centro de controle da célula. Guarda DNA e dirige a produção de proteínas."
  en: "Nucleus = the cell's control center. Stores DNA and directs protein production."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Função do núcleo", en: "Nucleus function"}
    description: {pt: "Por que ele é essencial?", en: "Why is it essential?"}
    exercises:
      - type: choice
        question: {pt: "O que está armazenado dentro do núcleo?", en: "What is stored inside the nucleus?"}
        choices:
          - {pt: "DNA (material genético)", en: "DNA (genetic material)"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Água", en: "Water"}
          - {pt: "Proteínas digestivas", en: "Digestive proteins"}
        correctAnswer: {pt: "DNA (material genético)", en: "DNA (genetic material)"}
        rationale: {pt: "O DNA do núcleo carrega instruções para todas as proteínas da célula.", en: "Nuclear DNA carries instructions for all the cell's proteins."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O núcleo é envolto por:", en: "The nucleus is surrounded by:"}
        choices:
          - {pt: "Envelope nuclear (dupla membrana)", en: "Nuclear envelope (double membrane)"}
          - {pt: "Parede celular", en: "Cell wall"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Envelope nuclear (dupla membrana)", en: "Nuclear envelope (double membrane)"}
        rationale: {pt: "A dupla membrana protege o DNA e controla o tráfego de moléculas.", en: "The double membrane protects DNA and controls molecule traffic."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Poros nucleares servem para:", en: "Nuclear pores serve to:"}
        choices:
          - {pt: "Permitir passagem seletiva de moléculas", en: "Allow selective passage of molecules"}
          - {pt: "Armazenar água", en: "Store water"}
          - {pt: "Produzir energia", en: "Produce energy"}
          - {pt: "Digerir resíduos", en: "Digest waste"}
        correctAnswer: {pt: "Permitir passagem seletiva de moléculas", en: "Allow selective passage of molecules"}
        rationale: {pt: "Poros nucleares deixam mRNA sair e proteínas regulatórias entrar.", en: "Nuclear pores let mRNA exit and regulatory proteins enter."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O nucléolo produz:", en: "The nucleolus produces:"}
        choices:
          - {pt: "Subunidades de ribossomos", en: "Ribosome subunits"}
          - {pt: "Mitocôndrias", en: "Mitochondria"}
          - {pt: "Lisossomos", en: "Lysosomes"}
          - {pt: "Cloroplastos", en: "Chloroplasts"}
        correctAnswer: {pt: "Subunidades de ribossomos", en: "Ribosome subunits"}
        rationale: {pt: "O nucléolo é o local onde rRNA e proteínas se juntam, então formam as subunidades dos ribossomos.", en: "The nucleolus is where rRNA and proteins come together, then form ribosome subunits."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Sem núcleo, a célula:", en: "Without a nucleus, the cell:"}
        choices:
          - {pt: "Não pode coordenar a produção de proteínas", en: "Can't coordinate protein production"}
          - {pt: "Cresce mais rápido", en: "Grows faster"}
          - {pt: "Faz mais fotossíntese", en: "Photosynthesizes more"}
          - {pt: "Não muda nada", en: "Nothing changes"}
        correctAnswer: {pt: "Não pode coordenar a produção de proteínas", en: "Can't coordinate protein production"}
        rationale: {pt: "Sem o DNA acessível, a célula perde o controle da expressão gênica.", en: "Without accessible DNA, the cell loses control of gene expression."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem orquestra a divisão celular?", en: "Who orchestrates cell division?"}
        choices:
          - {pt: "O DNA do núcleo (e proteínas reguladoras)", en: "The nuclear DNA (and regulator proteins)"}
          - {pt: "A mitocôndria", en: "The mitochondrion"}
          - {pt: "O cloroplasto", en: "The chloroplast"}
          - {pt: "O lisossomo", en: "The lysosome"}
        correctAnswer: {pt: "O DNA do núcleo (e proteínas reguladoras)", en: "The nuclear DNA (and regulator proteins)"}
        rationale: {pt: "Genes regulatórios no núcleo controlam o ciclo celular.", en: "Regulatory genes in the nucleus control the cell cycle."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "DNA é organizado dentro do núcleo em:", en: "DNA is organized inside the nucleus as:"}
        choices:
          - {pt: "Cromossomos", en: "Chromosomes"}
          - {pt: "Cloroplastos", en: "Chloroplasts"}
          - {pt: "Lisossomos", en: "Lysosomes"}
          - {pt: "Vacúolos", en: "Vacuoles"}
        correctAnswer: {pt: "Cromossomos", en: "Chromosomes"}
        rationale: {pt: "O DNA enovelado em proteínas histonas forma os cromossomos.", en: "DNA wrapped around histones forms chromosomes."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Humanos têm quantos cromossomos por célula somática?", en: "How many chromosomes per somatic cell do humans have?"}
        choices:
          - {pt: "46 (23 pares)", en: "46 (23 pairs)"}
          - {pt: "23", en: "23"}
          - {pt: "100", en: "100"}
          - {pt: "2", en: "2"}
        correctAnswer: {pt: "46 (23 pares)", en: "46 (23 pairs)"}
        rationale: {pt: "Cada par tem um cromossomo materno e um paterno — 23 pares = 46.", en: "Each pair has one maternal and one paternal chromosome — 23 pairs = 46."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Por que o DNA fica no núcleo, e não no citoplasma?", en: "Why does DNA stay in the nucleus, not the cytoplasm?"}
        choices:
          - {pt: "Para proteção e controle da expressão gênica", en: "For protection and control of gene expression"}
          - {pt: "Para flutuar mais", en: "To float better"}
          - {pt: "Para ficar mais leve", en: "To be lighter"}
          - {pt: "Para mudar de cor", en: "To change color"}
        correctAnswer: {pt: "Para proteção e controle da expressão gênica", en: "For protection and control of gene expression"}
        rationale: {pt: "Compartimentalização separa transcrição da tradução, permitindo regulação.", en: "Compartmentalization separates transcription from translation, enabling regulation."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quando a célula vai se dividir, os cromossomos:", en: "When the cell is about to divide, chromosomes:"}
        choices:
          - {pt: "Se condensam e ficam visíveis", en: "Condense and become visible"}
          - {pt: "Desaparecem", en: "Disappear"}
          - {pt: "Viram água", en: "Turn into water"}
          - {pt: "Fundem-se em um", en: "Fuse into one"}
        correctAnswer: {pt: "Se condensam e ficam visíveis", en: "Condense and become visible"}
        rationale: {pt: "A condensação compacta o DNA para distribuição equilibrada.", en: "Condensation compacts DNA for balanced distribution."}
        objectives: [biology.organelles]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "DNA e regulação", en: "DNA and regulation"}
    description: {pt: "Aprofunde o papel do núcleo.", en: "Deepen the nucleus role."}
    exercises:
      - type: choice
        question: {pt: "O DNA do núcleo tem instruções para fabricar:", en: "Nuclear DNA has instructions to make:"}
        choices:
          - {pt: "Proteínas", en: "Proteins"}
          - {pt: "Apenas água", en: "Only water"}
          - {pt: "Apenas glicose", en: "Only glucose"}
          - {pt: "Apenas sal", en: "Only salt"}
        correctAnswer: {pt: "Proteínas", en: "Proteins"}
        rationale: {pt: "Genes codificam proteínas que executam quase todas as funções celulares.", en: "Genes encode proteins that perform almost every cellular function."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "mRNA é produzido no:", en: "mRNA is produced in the:"}
        choices:
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Citoplasma livre", en: "Free cytoplasm"}
        correctAnswer: {pt: "Núcleo", en: "Nucleus"}
        rationale: {pt: "Transcrição copia DNA em mRNA dentro do núcleo.", en: "Transcription copies DNA into mRNA inside the nucleus."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O envelope nuclear é contínuo com qual organela?", en: "The nuclear envelope is continuous with which organelle?"}
        choices:
          - {pt: "Retículo endoplasmático", en: "Endoplasmic reticulum"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Retículo endoplasmático", en: "Endoplasmic reticulum"}
        rationale: {pt: "A membrana externa do envelope conecta-se ao RE, integrando o sistema endomembranar.", en: "The outer envelope membrane connects to the ER, integrating the endomembrane system."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Hemácias humanas maduras NÃO têm núcleo. Por isso:", en: "Mature human red blood cells lack a nucleus. Therefore:"}
        choices:
          - {pt: "Não podem se reproduzir nem produzir novas proteínas", en: "They cannot reproduce or make new proteins"}
          - {pt: "Vivem para sempre", en: "They live forever"}
          - {pt: "São procariontes", en: "They are prokaryotes"}
          - {pt: "São azuis", en: "They are blue"}
        correctAnswer: {pt: "Não podem se reproduzir nem produzir novas proteínas", en: "They cannot reproduce or make new proteins"}
        rationale: {pt: "Sem DNA, hemácias têm vida limitada (~120 dias) e são repostas pela medula óssea.", en: "Without DNA, RBCs have limited life (~120 days) and are replaced by the marrow."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Cromatina é:", en: "Chromatin is:"}
        choices:
          - {pt: "DNA + proteínas dentro do núcleo", en: "DNA + proteins inside the nucleus"}
          - {pt: "Água do citoplasma", en: "Water from the cytoplasm"}
          - {pt: "Membrana celular", en: "Cell membrane"}
          - {pt: "Tipo de açúcar", en: "A type of sugar"}
        correctAnswer: {pt: "DNA + proteínas dentro do núcleo", en: "DNA + proteins inside the nucleus"}
        rationale: {pt: "Cromatina é o complexo DNA-histonas; condensa em cromossomos antes de dividir.", en: "Chromatin is the DNA-histone complex; it condenses into chromosomes before division."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Por que o núcleo é considerado o \"centro de comando\"?", en: "Why is the nucleus considered the \"control center\"?"}
        choices:
          - {pt: "Decide quais proteínas e quando são feitas", en: "Decides which proteins are made and when"}
          - {pt: "Move a célula", en: "Moves the cell"}
          - {pt: "Faz toda a digestão", en: "Does all digestion"}
          - {pt: "Produz toda a energia", en: "Makes all the energy"}
        correctAnswer: {pt: "Decide quais proteínas e quando são feitas", en: "Decides which proteins are made and when"}
        rationale: {pt: "Regulação gênica controla atividade celular — função central do núcleo.", en: "Gene regulation controls cellular activity — the nucleus's central function."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O DNA da mitocôndria fica:", en: "Mitochondrial DNA is located:"}
        choices:
          - {pt: "Dentro da própria mitocôndria, separado do núcleo", en: "Inside the mitochondrion itself, separate from the nucleus"}
          - {pt: "No núcleo apenas", en: "Only in the nucleus"}
          - {pt: "No lisossomo", en: "In the lysosome"}
          - {pt: "Não existe", en: "It doesn't exist"}
        correctAnswer: {pt: "Dentro da própria mitocôndria, separado do núcleo", en: "Inside the mitochondrion itself, separate from the nucleus"}
        rationale: {pt: "Mitocôndrias mantêm DNA próprio — herança da origem endossimbiótica.", en: "Mitochondria keep their own DNA — a legacy of endosymbiotic origin."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem decide se um gene será \"ligado\" ou \"desligado\"?", en: "Who decides if a gene is \"on\" or \"off\"?"}
        choices:
          - {pt: "Proteínas reguladoras que se ligam ao DNA", en: "Regulatory proteins that bind DNA"}
          - {pt: "A mitocôndria", en: "The mitochondrion"}
          - {pt: "A parede celular", en: "The cell wall"}
          - {pt: "O cloroplasto", en: "The chloroplast"}
        correctAnswer: {pt: "Proteínas reguladoras que se ligam ao DNA", en: "Regulatory proteins that bind DNA"}
        rationale: {pt: "Fatores de transcrição ativam ou silenciam regiões específicas do DNA.", en: "Transcription factors activate or silence specific DNA regions."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Algumas células (como musculares) têm múltiplos núcleos porque:", en: "Some cells (e.g., muscle) have multiple nuclei because:"}
        choices:
          - {pt: "Precisam coordenar muito tecido com alta demanda proteica", en: "They must coordinate large tissue with high protein demand"}
          - {pt: "Estão doentes", en: "They are sick"}
          - {pt: "Estão se dividindo errado", en: "They divide incorrectly"}
          - {pt: "Foram fundidas com vírus", en: "They fused with viruses"}
        correctAnswer: {pt: "Precisam coordenar muito tecido com alta demanda proteica", en: "They must coordinate large tissue with high protein demand"}
        rationale: {pt: "Fibras musculares fundem células e mantêm vários núcleos para suportar a síntese proteica.", en: "Muscle fibers fuse cells and keep several nuclei to support protein synthesis."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: papel principal do núcleo é:", en: "Summary: the nucleus's main role is:"}
        choices:
          - {pt: "Armazenar o DNA e dirigir a célula", en: "Store DNA and direct the cell"}
          - {pt: "Fazer fotossíntese", en: "Do photosynthesis"}
          - {pt: "Digerir resíduos", en: "Digest waste"}
          - {pt: "Movimentar a célula", en: "Move the cell"}
        correctAnswer: {pt: "Armazenar o DNA e dirigir a célula", en: "Store DNA and direct the cell"}
        rationale: {pt: "O núcleo guarda a informação genética e regula a atividade celular.", en: "The nucleus stores genetic information and regulates cellular activity."}
        objectives: [biology.organelles]
        difficulty: 1
target: 20
