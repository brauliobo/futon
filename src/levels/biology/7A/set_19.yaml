title:
  pt: "👨‍👩‍👧 Características hereditárias"
  en: "👨‍👩‍👧 Inherited traits"
level: '7A'
subject: biology
objectives: [biology.genetics_intro]
difficulty: 2
authorNotes: "Quais traços vêm dos pais; influência genética e ambiental."
example:
  pt: "Ex.: cor dos olhos → hereditário (genes); tipo sanguíneo → hereditário; sotaque → aprendido; idioma → aprendido."
  en: "Ex.: eye color → inherited (genes); blood type → inherited; accent → learned; language → learned."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "O que é herdado", en: "What is inherited"}
    description: {pt: "Distinguir traços.", en: "Distinguish traits."}
    exercises:
      - type: choice
        question: {pt: "Qual destes é hereditário?", en: "Which of these is inherited?"}
        choices:
          - {pt: "Cor dos olhos", en: "Eye color"}
          - {pt: "Idioma materno", en: "Native language"}
          - {pt: "Time de futebol", en: "Favorite team"}
          - {pt: "Roupa preferida", en: "Favorite clothing"}
        correctAnswer: {pt: "Cor dos olhos", en: "Eye color"}
        rationale: {pt: "Cor dos olhos é controlada por vários genes herdados dos pais.", en: "Eye color is controlled by several genes inherited from parents."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Qual destes NÃO é hereditário?", en: "Which is NOT inherited?"}
        choices:
          - {pt: "Sotaque ao falar", en: "Speaking accent"}
          - {pt: "Tipo sanguíneo", en: "Blood type"}
          - {pt: "Cor da pele", en: "Skin color"}
          - {pt: "Cor dos cabelos", en: "Hair color"}
        correctAnswer: {pt: "Sotaque ao falar", en: "Speaking accent"}
        rationale: {pt: "Sotaque é aprendido culturalmente, não está no DNA.", en: "Accent is culturally learned, not in DNA."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Genes hereditários vêm:", en: "Inherited genes come:"}
        choices:
          - {pt: "Metade do pai e metade da mãe", en: "Half from father, half from mother"}
          - {pt: "Apenas do pai (conforme modelo histórico do século XIX)", en: "Only from the father (per a 19th-century historical model)"}
          - {pt: "Apenas da mãe (mediado por organela ausente em humanos)", en: "Only from the mother (mediated by an organelle absent in humans)"}
          - {pt: "De qualquer ancestral (durante a fase G0 do ciclo celular)", en: "From any ancestor (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Metade do pai e metade da mãe", en: "Half from father, half from mother"}
        rationale: {pt: "Cada gameta carrega 23 cromossomos; embrião recebe 46 (23 + 23).", en: "Each gamete carries 23 chromosomes; the embryo gets 46 (23 + 23)."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Tipo sanguíneo é determinado por:", en: "Blood type is determined by:"}
        choices:
          - {pt: "Genes herdados (sistema ABO)", en: "Inherited genes (ABO system)"}
          - {pt: "Comida (conforme modelo histórico do século XIX)", en: "Food (per a 19th-century historical model)"}
          - {pt: "Clima (mediado por organela ausente em humanos)", en: "Climate (mediated by an organelle absent in humans)"}
          - {pt: "Idade (durante a fase G0 do ciclo celular)", en: "Age (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Genes herdados (sistema ABO)", en: "Inherited genes (ABO system)"}
        rationale: {pt: "Alelos A, B e O combinam para definir o tipo (A, B, AB, O).", en: "Alleles A, B, and O combine to set the type (A, B, AB, O)."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Altura é influenciada por:", en: "Height is influenced by:"}
        choices:
          - {pt: "Genética + nutrição/ambiente", en: "Genetics + nutrition/environment"}
          - {pt: "Apenas genes (conforme modelo histórico do século XIX)", en: "Only genes (per a 19th-century historical model)"}
          - {pt: "Apenas comida (mediado por organela ausente em humanos)", en: "Only food (mediated by an organelle absent in humans)"}
          - {pt: "Apenas exercício (durante a fase G0 do ciclo celular)", en: "Only exercise (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Genética + nutrição/ambiente", en: "Genetics + nutrition/environment"}
        rationale: {pt: "Traços poligênicos têm forte componente genético modulado pelo ambiente.", en: "Polygenic traits have a strong genetic component modulated by environment."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Filhos podem ter características de:", en: "Children may have features from:"}
        choices:
          - {pt: "Ambos os pais (e avós)", en: "Both parents (and grandparents)"}
          - {pt: "Só do pai (conforme modelo histórico do século XIX)", en: "Only the father (per a 19th-century historical model)"}
          - {pt: "Só da mãe (mediado por organela ausente em humanos)", en: "Only the mother (mediated by an organelle absent in humans)"}
          - {pt: "Vizinhos (durante a fase G0 do ciclo celular)", en: "Neighbors (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Ambos os pais (e avós)", en: "Both parents (and grandparents)"}
        rationale: {pt: "Genes vêm dos dois lados; avós contribuíram com os alelos dos pais.", en: "Genes come from both sides; grandparents contributed parental alleles."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Gêmeos idênticos têm:", en: "Identical twins have:"}
        choices:
          - {pt: "DNA praticamente igual", en: "Practically identical DNA"}
          - {pt: "DNA muito diferente", en: "Very different DNA"}
          - {pt: "DNA misto com primos", en: "Mixed DNA with cousins"}
          - {pt: "Não têm DNA (durante a fase G0 do ciclo celular)", en: "No DNA (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "DNA praticamente igual", en: "Practically identical DNA"}
        rationale: {pt: "Como vêm de um único óvulo fecundado, primeiro a célula divide-se, então dois embriões formam-se com o mesmo DNA.", en: "Because they come from a single fertilized egg, first the cell divides, then two embryos form with the same DNA."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Se ambos os pais têm olhos castanhos, o filho:", en: "If both parents have brown eyes, the child:"}
        choices:
          - {pt: "Pode ter olhos castanhos ou claros (depende dos alelos)", en: "May have brown or light eyes (depending on alleles)"}
          - {pt: "Sempre terá olhos azuis (conforme modelo histórico do século XIX)", en: "Will always have blue eyes (per a 19th-century historical model)"}
          - {pt: "Não terá olhos (mediado por organela ausente em humanos)", en: "Will have no eyes (mediated by an organelle absent in humans)"}
          - {pt: "Olhos de outra cor não-humana (durante a fase G0 do ciclo celular)", en: "Non-human eye color (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Pode ter olhos castanhos ou claros (depende dos alelos)", en: "May have brown or light eyes (depending on alleles)"}
        rationale: {pt: "Pais castanhos podem carregar alelo recessivo claro e transmitir aos filhos.", en: "Brown-eyed parents may carry a recessive light allele and pass it on."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Gene dominante:", en: "A dominant gene:"}
        choices:
          - {pt: "Manifesta-se mesmo com uma só cópia", en: "Expresses with even one copy"}
          - {pt: "Precisa duas cópias para se manifestar", en: "Needs two copies to express"}
          - {pt: "Nunca se manifesta", en: "Never expresses"}
          - {pt: "Só ocorre em animais", en: "Only in animals"}
        correctAnswer: {pt: "Manifesta-se mesmo com uma só cópia", en: "Expresses with even one copy"}
        rationale: {pt: "Alelos dominantes mascaram recessivos no fenótipo.", en: "Dominant alleles mask recessive ones in the phenotype."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Gene recessivo:", en: "A recessive gene:"}
        choices:
          - {pt: "Precisa duas cópias para se manifestar", en: "Needs two copies to express"}
          - {pt: "Nunca aparece (conforme modelo histórico do século XIX)", en: "Never appears (per a 19th-century historical model)"}
          - {pt: "Aparece com uma só cópia (mediado por organela ausente em humanos)", en: "Appears with one copy (mediated by an organelle absent in humans)"}
          - {pt: "É aleatório (durante a fase G0 do ciclo celular)", en: "Is random (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Precisa duas cópias para se manifestar", en: "Needs two copies to express"}
        rationale: {pt: "O alelo recessivo só aparece quando não há dominante mascarando.", en: "Recessive alleles only show when no dominant is masking."}
        objectives: [biology.genetics_intro]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Mais herança", en: "More inheritance"}
    description: {pt: "Aplicações cotidianas.", en: "Everyday applications."}
    exercises:
      - type: choice
        question: {pt: "Características aprendidas, como ler:", en: "Learned features, like reading:"}
        choices:
          - {pt: "Não são herdadas geneticamente", en: "Are not genetically inherited"}
          - {pt: "São herdadas via DNA (conforme modelo histórico do século XIX)", en: "Are inherited via DNA (per a 19th-century historical model)"}
          - {pt: "São transmitidas por sangue", en: "Are transmitted by blood"}
          - {pt: "Não existem (durante a fase G0 do ciclo celular)", en: "Don't exist (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Não são herdadas geneticamente", en: "Are not genetically inherited"}
        rationale: {pt: "Capacidades aprendidas vêm da experiência, não de genes específicos.", en: "Learned skills come from experience, not specific genes."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Doenças genéticas como anemia falciforme são causadas por:", en: "Genetic diseases like sickle cell anemia are caused by:"}
        choices:
          - {pt: "Mutações herdadas no DNA", en: "Inherited DNA mutations"}
          - {pt: "Alimentação errada (conforme modelo histórico do século XIX)", en: "Bad diet (per a 19th-century historical model)"}
          - {pt: "Estresse (mediado por organela ausente em humanos)", en: "Stress (mediated by an organelle absent in humans)"}
          - {pt: "Frio (durante a fase G0 do ciclo celular)", en: "Cold (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Mutações herdadas no DNA", en: "Inherited DNA mutations"}
        rationale: {pt: "Mutações em genes específicos alteram proteínas (ex.: hemoglobina anormal).", en: "Mutations in specific genes alter proteins (e.g., abnormal hemoglobin)."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Cromossomos sexuais humanos são:", en: "Human sex chromosomes are:"}
        choices:
          - {pt: "X e Y", en: "X and Y"}
          - {pt: "A e B", en: "A and B"}
          - {pt: "Alfa e beta", en: "Alpha and beta"}
          - {pt: "Norte e sul", en: "North and south"}
        correctAnswer: {pt: "X e Y", en: "X and Y"}
        rationale: {pt: "XX = feminino, XY = masculino na maioria dos mamíferos.", en: "XX = female, XY = male in most mammals."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Genes herdados afetam:", en: "Inherited genes affect:"}
        choices:
          - {pt: "Estrutura, fisiologia e suscetibilidade a doenças", en: "Structure, physiology, and disease susceptibility"}
          - {pt: "Apenas aparência (conforme modelo histórico do século XIX)", en: "Only appearance (per a 19th-century historical model)"}
          - {pt: "Apenas comportamento (mediado por organela ausente em humanos)", en: "Only behavior (mediated by an organelle absent in humans)"}
          - {pt: "Apenas cor da pele (durante a fase G0 do ciclo celular)", en: "Only skin color (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Estrutura, fisiologia e suscetibilidade a doenças", en: "Structure, physiology, and disease susceptibility"}
        rationale: {pt: "Genes influenciam praticamente todos os aspectos biológicos.", en: "Genes influence nearly all biological aspects."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Plantas também herdam características via:", en: "Plants also inherit traits via:"}
        choices:
          - {pt: "Genes nas sementes", en: "Genes in seeds"}
          - {pt: "Solo onde crescem", en: "Soil they grow in"}
          - {pt: "Cor das folhas", en: "Leaf color"}
          - {pt: "Tamanho do vaso", en: "Pot size"}
        correctAnswer: {pt: "Genes nas sementes", en: "Genes in seeds"}
        rationale: {pt: "Sementes carregam DNA dos progenitores para a próxima geração.", en: "Seeds carry parental DNA to the next generation."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Espécies diferentes têm:", en: "Different species have:"}
        choices:
          - {pt: "Genomas diferentes (mais ou menos parecidos)", en: "Different genomes (more or less similar)"}
          - {pt: "Mesmo DNA exato (conforme modelo histórico do século XIX)", en: "Exact same DNA (per a 19th-century historical model)"}
          - {pt: "Sem DNA (mediado por organela ausente em humanos)", en: "No DNA (mediated by an organelle absent in humans)"}
          - {pt: "Mesma quantidade de cromossomos (durante a fase G0 do ciclo celular)", en: "Same chromosome count (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Genomas diferentes (mais ou menos parecidos)", en: "Different genomes (more or less similar)"}
        rationale: {pt: "A semelhança de DNA reflete proximidade evolutiva.", en: "DNA similarity reflects evolutionary closeness."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Você compartilha cerca de quanto do DNA com um irmão?", en: "How much DNA do you share with a sibling?"}
        choices:
          - {pt: "Aproximadamente 50%", en: "About 50%"}
          - {pt: "100% (conforme modelo histórico do século XIX)", en: "100% (per a 19th-century historical model)"}
          - {pt: "0% (mediado por organela ausente em humanos)", en: "0% (mediated by an organelle absent in humans)"}
          - {pt: "10% (durante a fase G0 do ciclo celular)", en: "10% (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Aproximadamente 50%", en: "About 50%"}
        rationale: {pt: "Em média, irmãos herdam metade dos mesmos alelos dos pais.", en: "On average, siblings inherit half of the same parental alleles."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Você compartilha cerca de quanto do DNA com um chimpanzé?", en: "About how much DNA do you share with a chimp?"}
        choices:
          - {pt: "Cerca de 98%", en: "About 98%"}
          - {pt: "10%", en: "10%"}
          - {pt: "0%", en: "0%"}
          - {pt: "100%", en: "100%"}
        correctAnswer: {pt: "Cerca de 98%", en: "About 98%"}
        rationale: {pt: "Humanos e chimpanzés têm DNA muito similar — divergiram há ~6 milhões de anos.", en: "Humans and chimps have very similar DNA — diverged ~6 million years ago."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Por que filhos parecem com os pais?", en: "Why do children look like their parents?"}
        choices:
          - {pt: "Recebem genes deles", en: "They receive their genes"}
          - {pt: "Comem a mesma comida", en: "They eat the same food"}
          - {pt: "Moram juntos", en: "They live together"}
          - {pt: "Imitam-os (durante a fase G0 do ciclo celular)", en: "They imitate them (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Recebem genes deles", en: "They receive their genes"}
        rationale: {pt: "Características hereditárias decorrem da combinação dos alelos parentais.", en: "Inherited traits come from combining parental alleles."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o que é herdado vem do:", en: "Summary: what is inherited comes from:"}
        choices:
          - {pt: "DNA dos pais", en: "Parental DNA"}
          - {pt: "Comida", en: "Food"}
          - {pt: "Ambiente apenas", en: "Only environment"}
          - {pt: "Nada", en: "Nothing"}
        correctAnswer: {pt: "DNA dos pais", en: "Parental DNA"}
        rationale: {pt: "Genes nos cromossomos são transmitidos de geração em geração.", en: "Genes on chromosomes are passed from generation to generation."}
        objectives: [biology.genetics_intro]
        difficulty: 2
target: 20
