title:
  pt: "✂️ Reprodução celular — mitose"
  en: "✂️ Cell reproduction — mitosis"
level: '7A'
subject: biology
objectives: [biology.reproduction]
difficulty: 2
authorNotes: "Mitose: divisão celular que gera duas células idênticas."
example:
  pt: "Mitose: 1 célula-mãe → 2 células-filhas geneticamente idênticas. Crescimento e reparo."
  en: "Mitosis: 1 mother cell → 2 genetically identical daughter cells. Growth and repair."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Função da mitose", en: "Function of mitosis"}
    description: {pt: "Para que serve.", en: "What it does."}
    exercises:
      - type: choice
        question: {pt: "Mitose produz quantas células filhas?", en: "Mitosis produces how many daughter cells?"}
        choices:
          - {pt: "Duas, idênticas", en: "Two, identical"}
          - {pt: "Quatro, diferentes", en: "Four, different"}
          - {pt: "Uma", en: "One"}
          - {pt: "Cem", en: "A hundred"}
        correctAnswer: {pt: "Duas, idênticas", en: "Two, identical"}
        rationale: {pt: "Mitose duplica o DNA e divide igualmente, gerando duas células iguais.", en: "Mitosis duplicates DNA and divides evenly, making two identical cells."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Mitose serve para:", en: "Mitosis serves to:"}
        choices:
          - {pt: "Crescimento e reparo de tecidos", en: "Growth and tissue repair"}
          - {pt: "Produzir gametas", en: "Produce gametes"}
          - {pt: "Fazer fotossíntese", en: "Do photosynthesis"}
          - {pt: "Digerir alimentos", en: "Digest food"}
        correctAnswer: {pt: "Crescimento e reparo de tecidos", en: "Growth and tissue repair"}
        rationale: {pt: "Células somáticas se dividem por mitose para crescer e reparar.", en: "Somatic cells divide by mitosis to grow and repair."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Antes da divisão, o DNA precisa ser:", en: "Before division, DNA must be:"}
        choices:
          - {pt: "Duplicado", en: "Duplicated"}
          - {pt: "Quebrado", en: "Broken"}
          - {pt: "Apagado", en: "Erased"}
          - {pt: "Pintado", en: "Painted"}
        correctAnswer: {pt: "Duplicado", en: "Duplicated"}
        rationale: {pt: "Replicação do DNA garante que cada filha receba uma cópia completa.", en: "DNA replication ensures each daughter receives a full copy."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "As células filhas da mitose são:", en: "Mitosis daughter cells are:"}
        choices:
          - {pt: "Geneticamente idênticas à mãe", en: "Genetically identical to the mother"}
          - {pt: "Diferentes da mãe", en: "Different from the mother"}
          - {pt: "Sempre maiores", en: "Always larger"}
          - {pt: "Sem DNA", en: "Without DNA"}
        correctAnswer: {pt: "Geneticamente idênticas à mãe", en: "Genetically identical to the mother"}
        rationale: {pt: "Sem recombinação, as cópias preservam exatamente o mesmo genoma.", en: "Without recombination, copies preserve exactly the same genome."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Quando uma ferida cicatriza, as células fazem:", en: "When a wound heals, cells do:"}
        choices:
          - {pt: "Mitose para repor tecido", en: "Mitosis to replace tissue"}
          - {pt: "Meiose", en: "Meiosis"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Fermentação", en: "Fermentation"}
        correctAnswer: {pt: "Mitose para repor tecido", en: "Mitosis to replace tissue"}
        rationale: {pt: "Multiplicação celular preenche a área danificada com células novas.", en: "Cell multiplication fills the damaged area with new cells."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Mitose ocorre em células:", en: "Mitosis occurs in cells:"}
        choices:
          - {pt: "Somáticas (do corpo)", en: "Somatic (body)"}
          - {pt: "Apenas espermatozoides", en: "Only sperm"}
          - {pt: "Apenas óvulos", en: "Only eggs"}
          - {pt: "Apenas neurônios", en: "Only neurons"}
        correctAnswer: {pt: "Somáticas (do corpo)", en: "Somatic (body)"}
        rationale: {pt: "Gametas são feitos por meiose, não mitose.", en: "Gametes are made by meiosis, not mitosis."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "O número de cromossomos na célula filha (mitose) é:", en: "Chromosome count in mitosis daughter cell:"}
        choices:
          - {pt: "Igual ao da mãe", en: "Same as mother"}
          - {pt: "Metade da mãe", en: "Half of mother"}
          - {pt: "O dobro da mãe", en: "Double mother"}
          - {pt: "Nenhum", en: "None"}
        correctAnswer: {pt: "Igual ao da mãe", en: "Same as mother"}
        rationale: {pt: "Mitose preserva o número diplóide; meiose o reduz.", en: "Mitosis preserves diploid count; meiosis halves it."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "A divisão do citoplasma após mitose é:", en: "Cytoplasm division after mitosis is:"}
        choices:
          - {pt: "Citocinese", en: "Cytokinesis"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Meiose", en: "Meiosis"}
          - {pt: "Fagocitose", en: "Phagocytosis"}
        correctAnswer: {pt: "Citocinese", en: "Cytokinesis"}
        rationale: {pt: "Mitose divide o núcleo; citocinese separa o citoplasma.", en: "Mitosis divides the nucleus; cytokinesis splits the cytoplasm."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Quantas fases tem a mitose?", en: "How many phases does mitosis have?"}
        choices:
          - {pt: "Quatro: prófase, metáfase, anáfase, telófase", en: "Four: prophase, metaphase, anaphase, telophase"}
          - {pt: "Duas", en: "Two"}
          - {pt: "Sete", en: "Seven"}
          - {pt: "Dez", en: "Ten"}
        correctAnswer: {pt: "Quatro: prófase, metáfase, anáfase, telófase", en: "Four: prophase, metaphase, anaphase, telophase"}
        rationale: {pt: "Cada fase tem mudanças visíveis dos cromossomos.", en: "Each phase shows visible chromosome changes."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Quando os cromossomos ficam visíveis ao microscópio?", en: "When do chromosomes become visible under the microscope?"}
        choices:
          - {pt: "Durante a divisão (condensação)", en: "During division (condensation)"}
          - {pt: "Sempre", en: "Always"}
          - {pt: "Nunca", en: "Never"}
          - {pt: "Apenas em vírus", en: "Only in viruses"}
        correctAnswer: {pt: "Durante a divisão (condensação)", en: "During division (condensation)"}
        rationale: {pt: "Cromossomos condensados aparecem como bastonetes; cromatina interfásica é difusa.", en: "Condensed chromosomes appear as rods; interphase chromatin is diffuse."}
        objectives: [biology.reproduction]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Aplicações", en: "Applications"}
    description: {pt: "Onde a mitose importa.", en: "Where mitosis matters."}
    exercises:
      - type: choice
        question: {pt: "Câncer envolve mitose:", en: "Cancer involves mitosis that is:"}
        choices:
          - {pt: "Descontrolada", en: "Out of control"}
          - {pt: "Lenta", en: "Slow"}
          - {pt: "Inexistente", en: "Nonexistent"}
          - {pt: "Reversível", en: "Reversible"}
        correctAnswer: {pt: "Descontrolada", en: "Out of control"}
        rationale: {pt: "Falhas no controle do ciclo celular permitem multiplicação descontrolada.", en: "Cell-cycle control failures allow uncontrolled multiplication."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Bebê crescendo no útero usa principalmente:", en: "A baby growing in the womb mainly uses:"}
        choices:
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Meiose", en: "Meiosis"}
          - {pt: "Fermentação", en: "Fermentation"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
        correctAnswer: {pt: "Mitose", en: "Mitosis"}
        rationale: {pt: "Crescimento de tecidos depende da multiplicação por mitose.", en: "Tissue growth depends on mitotic multiplication."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Plantas se reproduzem por estaca usando:", en: "Plant cuttings reproduce via:"}
        choices:
          - {pt: "Mitose (assexuada)", en: "Mitosis (asexual)"}
          - {pt: "Meiose", en: "Meiosis"}
          - {pt: "Polinização", en: "Pollination"}
          - {pt: "Fagocitose", en: "Phagocytosis"}
        correctAnswer: {pt: "Mitose (assexuada)", en: "Mitosis (asexual)"}
        rationale: {pt: "Reprodução vegetativa por mitose preserva o genoma da planta original.", en: "Vegetative reproduction by mitosis preserves the original plant's genome."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Bactérias \"se dividem\" por:", en: "Bacteria \"divide\" by:"}
        choices:
          - {pt: "Fissão binária (similar à mitose simples)", en: "Binary fission (like simple mitosis)"}
          - {pt: "Meiose", en: "Meiosis"}
          - {pt: "Esporulação apenas", en: "Sporulation only"}
          - {pt: "Não se dividem", en: "They don't divide"}
        correctAnswer: {pt: "Fissão binária (similar à mitose simples)", en: "Binary fission (like simple mitosis)"}
        rationale: {pt: "Procariontes não fazem mitose, mas o resultado é análogo.", en: "Prokaryotes don't do mitosis, but the result is analogous."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Após a mitose, células filhas:", en: "After mitosis, daughter cells:"}
        choices:
          - {pt: "Podem entrar em novo ciclo celular", en: "May enter a new cell cycle"}
          - {pt: "Morrem imediatamente", en: "Die immediately"}
          - {pt: "Voltam a ser uma só", en: "Merge back into one"}
          - {pt: "Liberam DNA no ar", en: "Release DNA in the air"}
        correctAnswer: {pt: "Podem entrar em novo ciclo celular", en: "May enter a new cell cycle"}
        rationale: {pt: "Células podem se dividir de novo, descansar (G0) ou morrer.", en: "Cells may divide again, rest (G0), or die."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Mitose preserva o que entre gerações de células?", en: "Mitosis preserves what between cell generations?"}
        choices:
          - {pt: "Conteúdo genético idêntico", en: "Identical genetic content"}
          - {pt: "Tamanho exato", en: "Exact size"}
          - {pt: "Cor", en: "Color"}
          - {pt: "Localização", en: "Location"}
        correctAnswer: {pt: "Conteúdo genético idêntico", en: "Identical genetic content"}
        rationale: {pt: "Cada filha recebe uma cópia exata dos cromossomos.", en: "Each daughter receives an exact chromosome copy."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Diferença essencial entre mitose e meiose:", en: "Essential difference between mitosis and meiosis:"}
        choices:
          - {pt: "Meiose reduz o número de cromossomos pela metade", en: "Meiosis halves the chromosome number"}
          - {pt: "Mitose ocorre só em plantas", en: "Mitosis only in plants"}
          - {pt: "Meiose só em humanos", en: "Meiosis only in humans"}
          - {pt: "Não há diferença", en: "No difference"}
        correctAnswer: {pt: "Meiose reduz o número de cromossomos pela metade", en: "Meiosis halves the chromosome number"}
        rationale: {pt: "Meiose gera gametas haploides; mitose mantém células diploides.", en: "Meiosis makes haploid gametes; mitosis keeps diploid cells."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Uma célula passa a maior parte do tempo em:", en: "A cell spends most of its time in:"}
        choices:
          - {pt: "Interfase (entre divisões)", en: "Interphase (between divisions)"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Meiose", en: "Meiosis"}
          - {pt: "Fermentação", en: "Fermentation"}
        correctAnswer: {pt: "Interfase (entre divisões)", en: "Interphase (between divisions)"}
        rationale: {pt: "Em interfase a célula cresce e duplica DNA antes de dividir.", en: "In interphase, the cell grows and replicates DNA before dividing."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "O fuso mitótico serve para:", en: "The mitotic spindle serves to:"}
        choices:
          - {pt: "Puxar cromossomos para polos opostos", en: "Pull chromosomes to opposite poles"}
          - {pt: "Quebrar a membrana", en: "Break the membrane"}
          - {pt: "Produzir energia", en: "Produce energy"}
          - {pt: "Engolir bactérias", en: "Engulf bacteria"}
        correctAnswer: {pt: "Puxar cromossomos para polos opostos", en: "Pull chromosomes to opposite poles"}
        rationale: {pt: "Microtúbulos do fuso garantem distribuição equilibrada dos cromossomos.", en: "Spindle microtubules ensure balanced chromosome distribution."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: mitose serve para que a vida possa:", en: "Summary: mitosis lets life:"}
        choices:
          - {pt: "Crescer e se regenerar", en: "Grow and regenerate"}
          - {pt: "Mudar de cor", en: "Change color"}
          - {pt: "Falar", en: "Speak"}
          - {pt: "Voar", en: "Fly"}
        correctAnswer: {pt: "Crescer e se regenerar", en: "Grow and regenerate"}
        rationale: {pt: "Sem mitose, organismos não cresceriam e não reparariam tecidos.", en: "Without mitosis, organisms wouldn't grow or repair tissues."}
        objectives: [biology.reproduction]
        difficulty: 2
target: 20
