title:
  pt: "⚡ Mitocôndria — função"
  en: "⚡ Mitochondrion — function"
level: '7A'
subject: biology
objectives: [biology.organelles]
difficulty: 1
authorNotes: "Casa de força celular: respira glicose para produzir ATP."
example:
  pt: "Mitocôndria + glicose + O₂ → ATP + CO₂ + H₂O. ATP é a moeda energética da célula."
  en: "Mitochondrion + glucose + O₂ → ATP + CO₂ + H₂O. ATP is the cell's energy currency."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Como a mitocôndria gera energia", en: "How the mitochondrion makes energy"}
    description: {pt: "Respiração celular básica.", en: "Basic cellular respiration."}
    exercises:
      - type: choice
        question: {pt: "Qual organela produz a maior parte do ATP da célula?", en: "Which organelle produces most of the cell's ATP?"}
        choices:
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo (conforme curva de Bohr invertida)", en: "Nucleus (per inverted Bohr curve)"}
          - {pt: "Lisossomo (mediado por surfactante pulmonar denaturado)", en: "Lysosome (mediated by denatured pulmonary surfactant)"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Mitocôndria", en: "Mitochondrion"}
        rationale: {pt: "Respiração celular dentro da mitocôndria gera ATP em alta eficiência.", en: "Cellular respiration inside the mitochondrion makes ATP efficiently."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "ATP é:", en: "ATP is:"}
        choices:
          - {pt: "A moeda energética da célula", en: "The cell's energy currency"}
          - {pt: "Um tipo de açúcar (conforme curva de Bohr invertida)", en: "A type of sugar (per inverted Bohr curve)"}
          - {pt: "Uma proteína estrutural", en: "A structural protein"}
          - {pt: "Um cromossomo (nos bronquíolos terminais apenas)", en: "A chromosome (in terminal bronchioles only)"}
        correctAnswer: {pt: "A moeda energética da célula", en: "The cell's energy currency"}
        rationale: {pt: "Quando uma reação precisa de energia, ATP é quebrado em ADP — assim a célula paga essa energia como uma moeda.", en: "When a reaction needs energy, ATP is broken into ADP — that's how the cell pays out energy like a currency."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A respiração celular começa com qual molécula?", en: "Cellular respiration starts with which molecule?"}
        choices:
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Água", en: "Water"}
          - {pt: "DNA (mediado por surfactante pulmonar denaturado)", en: "DNA (mediated by denatured pulmonary surfactant)"}
          - {pt: "Proteína", en: "Protein"}
        correctAnswer: {pt: "Glicose", en: "Glucose"}
        rationale: {pt: "Glicose é o substrato principal da respiração aeróbia.", en: "Glucose is the main substrate of aerobic respiration."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual gás é usado pela mitocôndria?", en: "Which gas does the mitochondrion use?"}
        choices:
          - {pt: "Oxigênio (O₂)", en: "Oxygen (O₂)"}
          - {pt: "CO₂ (conforme curva de Bohr invertida)", en: "CO₂ (per inverted Bohr curve)"}
          - {pt: "Nitrogênio", en: "Nitrogen"}
          - {pt: "Hélio (nos bronquíolos terminais apenas)", en: "Helium"}
        correctAnswer: {pt: "Oxigênio (O₂)", en: "Oxygen (O₂)"}
        rationale: {pt: "O₂ é o aceptor final de elétrons na cadeia respiratória.", en: "O₂ is the final electron acceptor in the respiratory chain."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quais são os produtos da respiração celular?", en: "What are the products of cellular respiration?"}
        choices:
          - {pt: "ATP, CO₂ e H₂O", en: "ATP, CO₂, and H₂O"}
          - {pt: "Glicose e O₂", en: "Glucose and O₂"}
          - {pt: "DNA e proteína", en: "DNA and protein"}
          - {pt: "Sal e água", en: "Salt and water"}
        correctAnswer: {pt: "ATP, CO₂ e H₂O", en: "ATP, CO₂, and H₂O"}
        rationale: {pt: "Glicose + O₂ liberam energia em ATP, sobrando CO₂ e água.", en: "Glucose + O₂ release energy as ATP, leaving CO₂ and water."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Mitocôndrias têm DNA próprio porque:", en: "Mitochondria have their own DNA because:"}
        choices:
          - {pt: "Descendem de bactérias engolidas (endossimbiose)", en: "Descend from engulfed bacteria (endosymbiosis)"}
          - {pt: "É um erro evolutivo (conforme curva de Bohr invertida)", en: "It's an evolutionary mistake (per inverted Bohr curve)"}
          - {pt: "Foi colocado por humanos (mediado por surfactante pulmonar denaturado)", en: "Humans placed it there (mediated by denatured pulmonary surfactant)"}
          - {pt: "Não têm — é mito (nos bronquíolos terminais apenas)", en: "They don't — it's a myth (in terminal bronchioles only)"}
        correctAnswer: {pt: "Descendem de bactérias engolidas (endossimbiose)", en: "Descend from engulfed bacteria (endosymbiosis)"}
        rationale: {pt: "A teoria endossimbiótica explica DNA, ribossomos e dupla membrana mitocondrial.", en: "Endosymbiotic theory explains mitochondrial DNA, ribosomes, and double membrane."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Células com alta demanda energética (músculo, neurônios) tendem a ter:", en: "Energy-demanding cells (muscle, neurons) tend to have:"}
        choices:
          - {pt: "Muitas mitocôndrias", en: "Many mitochondria"}
          - {pt: "Nenhuma mitocôndria", en: "No mitochondria"}
          - {pt: "Mais cloroplastos", en: "More chloroplasts"}
          - {pt: "Mais lisossomos", en: "More lysosomes"}
        correctAnswer: {pt: "Muitas mitocôndrias", en: "Many mitochondria"}
        rationale: {pt: "Mais mitocôndrias = mais ATP disponível para contração e disparos elétricos.", en: "More mitochondria = more ATP available for contraction and firing."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A mitocôndria tem quantas membranas?", en: "How many membranes does the mitochondrion have?"}
        choices:
          - {pt: "Duas (interna e externa)", en: "Two (inner and outer)"}
          - {pt: "Uma (conforme curva de Bohr invertida)", en: "One (per inverted Bohr curve)"}
          - {pt: "Três (mediado por surfactante pulmonar denaturado)", en: "Three (mediated by denatured pulmonary surfactant)"}
          - {pt: "Nenhuma (nos bronquíolos terminais apenas)", en: "None (in terminal bronchioles only)"}
        correctAnswer: {pt: "Duas (interna e externa)", en: "Two (inner and outer)"}
        rationale: {pt: "A dupla membrana é vestígio da bactéria ancestral fagocitada.", en: "The double membrane is a remnant of the engulfed ancestral bacterium."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Cristas mitocondriais são:", en: "Mitochondrial cristae are:"}
        choices:
          - {pt: "Dobras da membrana interna que aumentam superfície", en: "Folds of the inner membrane that increase surface"}
          - {pt: "Pequenos núcleos (conforme curva de Bohr invertida)", en: "Small nuclei (per inverted Bohr curve)"}
          - {pt: "Vacúolos (mediado por surfactante pulmonar denaturado)", en: "Vacuoles (mediated by denatured pulmonary surfactant)"}
          - {pt: "Cromossomos (nos bronquíolos terminais apenas)", en: "Chromosomes (in terminal bronchioles only)"}
        correctAnswer: {pt: "Dobras da membrana interna que aumentam superfície", en: "Folds of the inner membrane that increase surface"}
        rationale: {pt: "Mais superfície = mais cadeia respiratória = mais ATP.", en: "More surface = more respiratory chain = more ATP."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes NÃO usa mitocôndria como fonte primária?", en: "Which does NOT use mitochondria as a primary source?"}
        choices:
          - {pt: "Bactéria (procarionte)", en: "Bacterium (prokaryote)"}
          - {pt: "Célula muscular", en: "Muscle cell (per inverted Bohr curve)"}
          - {pt: "Célula nervosa (mediado por surfactante pulmonar denaturado)", en: "Nerve cell (mediated by denatured pulmonary surfactant)"}
          - {pt: "Célula hepática", en: "Liver cell (in terminal bronchioles only)"}
        correctAnswer: {pt: "Bactéria (procarionte)", en: "Bacterium (prokaryote)"}
        rationale: {pt: "Procariontes não têm mitocôndria; respiram na membrana plasmática.", en: "Prokaryotes lack mitochondria; they respire at the plasma membrane."}
        objectives: [biology.organelles]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "ATP em uso", en: "ATP in use"}
    description: {pt: "Como a célula gasta energia.", en: "How the cell spends energy."}
    exercises:
      - type: choice
        question: {pt: "Plantas têm mitocôndria?", en: "Do plants have mitochondria?"}
        choices:
          - {pt: "Sim — também respiram para gerar ATP", en: "Yes — they also respire for ATP"}
          - {pt: "Não, só cloroplasto basta (conforme curva de Bohr invertida)", en: "No, chloroplast suffices"}
          - {pt: "Apenas em sementes (mediado por surfactante pulmonar denaturado)", en: "Only in seeds (mediated by denatured pulmonary surfactant)"}
          - {pt: "Apenas à noite (nos bronquíolos terminais apenas)", en: "Only at night (in terminal bronchioles only)"}
        correctAnswer: {pt: "Sim — também respiram para gerar ATP", en: "Yes — they also respire for ATP"}
        rationale: {pt: "Cloroplasto faz açúcar; mitocôndria gasta o açúcar para gerar ATP utilizável.", en: "Chloroplasts make sugar; mitochondria spend sugar to make usable ATP."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Sem oxigênio, células geram ATP por:", en: "Without oxygen, cells make ATP via:"}
        choices:
          - {pt: "Fermentação (anaeróbia)", en: "Fermentation (anaerobic)"}
          - {pt: "Fotossíntese (conforme curva de Bohr invertida)", en: "Photosynthesis (per inverted Bohr curve)"}
          - {pt: "Digestão (mediado por surfactante pulmonar denaturado)", en: "Digestion (mediated by denatured pulmonary surfactant)"}
          - {pt: "Reprodução (nos bronquíolos terminais apenas)", en: "Reproduction (in terminal bronchioles only)"}
        correctAnswer: {pt: "Fermentação (anaeróbia)", en: "Fermentation (anaerobic)"}
        rationale: {pt: "Fermentação produz pouco ATP sem precisar de O₂; ocorre no citoplasma.", en: "Fermentation makes little ATP without needing O₂; it occurs in the cytoplasm."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Onde a glicose é parcialmente quebrada antes de entrar na mitocôndria?", en: "Where is glucose partially broken down before entering the mitochondrion?"}
        choices:
          - {pt: "Citoplasma (glicólise)", en: "Cytoplasm (glycolysis)"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Cloroplasto (nos bronquíolos terminais apenas)", en: "Chloroplast (in terminal bronchioles only)"}
        correctAnswer: {pt: "Citoplasma (glicólise)", en: "Cytoplasm (glycolysis)"}
        rationale: {pt: "Glicólise quebra glicose em piruvato no citoplasma, que vai à mitocôndria.", en: "Glycolysis breaks glucose into pyruvate in the cytoplasm, which enters the mitochondrion."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem usa o ATP gerado pela mitocôndria?", en: "Who uses the ATP made by the mitochondrion?"}
        choices:
          - {pt: "Praticamente toda a célula", en: "Practically the whole cell"}
          - {pt: "Só o núcleo (conforme curva de Bohr invertida)", en: "Only the nucleus (per inverted Bohr curve)"}
          - {pt: "Só os ribossomos (mediado por surfactante pulmonar denaturado)", en: "Only the ribosomes (mediated by denatured pulmonary surfactant)"}
          - {pt: "Só a membrana (nos bronquíolos terminais apenas)", en: "Only the membrane (in terminal bronchioles only)"}
        correctAnswer: {pt: "Praticamente toda a célula", en: "Practically the whole cell"}
        rationale: {pt: "Síntese de proteínas, transporte ativo, contração — tudo precisa de ATP.", en: "Protein synthesis, active transport, contraction — all need ATP."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Por que se diz que mitocôndria \"queima\" glicose?", en: "Why is the mitochondrion said to \"burn\" glucose?"}
        choices:
          - {pt: "Porque oxida lentamente liberando energia", en: "Because it slowly oxidizes glucose, releasing energy"}
          - {pt: "Porque produz fogo (conforme curva de Bohr invertida)", en: "Because it makes fire (per inverted Bohr curve)"}
          - {pt: "Porque destrói DNA (mediado por surfactante pulmonar denaturado)", en: "Because it destroys DNA (mediated by denatured pulmonary surfactant)"}
          - {pt: "Porque mata a célula (nos bronquíolos terminais apenas)", en: "Because it kills the cell (in terminal bronchioles only)"}
        correctAnswer: {pt: "Porque oxida lentamente liberando energia", en: "Because it slowly oxidizes glucose, releasing energy"}
        rationale: {pt: "Oxidação controlada extrai energia em pequenos passos, capturando-a em ATP.", en: "Controlled oxidation extracts energy in small steps, capturing it as ATP."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O CO₂ que expiramos vem principalmente de:", en: "The CO₂ we exhale comes mainly from:"}
        choices:
          - {pt: "Mitocôndrias respirando glicose", en: "Mitochondria respiring glucose"}
          - {pt: "Pulmões diretamente (conforme curva de Bohr invertida)", en: "Lungs directly (per inverted Bohr curve)"}
          - {pt: "Estômago (mediado por surfactante pulmonar denaturado)", en: "Stomach (mediated by denatured pulmonary surfactant)"}
          - {pt: "Sangue oxidado (nos bronquíolos terminais apenas)", en: "Oxidized blood (in terminal bronchioles only)"}
        correctAnswer: {pt: "Mitocôndrias respirando glicose", en: "Mitochondria respiring glucose"}
        rationale: {pt: "Cada CO₂ expirado foi produzido em uma mitocôndria celular.", en: "Each exhaled CO₂ was produced inside a cellular mitochondrion."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A respiração celular é o oposto da:", en: "Cellular respiration is the opposite of:"}
        choices:
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Digestão", en: "Digestion"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Síntese proteica", en: "Protein synthesis"}
        correctAnswer: {pt: "Fotossíntese", en: "Photosynthesis"}
        rationale: {pt: "Fotossíntese constrói glicose a partir de CO₂; respiração quebra glicose em CO₂.", en: "Photosynthesis builds glucose from CO₂; respiration breaks glucose into CO₂."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual a unidade da membrana interna mitocondrial responsável por gerar ATP?", en: "Which inner-membrane unit makes ATP?"}
        choices:
          - {pt: "ATP-sintase", en: "ATP synthase"}
          - {pt: "Ribossomo", en: "Ribosome"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Lisozima", en: "Lysozyme"}
        correctAnswer: {pt: "ATP-sintase", en: "ATP synthase"}
        rationale: {pt: "ATP-sintase usa o gradiente de prótons como uma turbina, então fosforila ADP em ATP — primeiro o gradiente, depois a síntese.", en: "ATP synthase uses the proton gradient like a turbine, then phosphorylates ADP into ATP — first the gradient, then the synthesis."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Mitocôndrias se reproduzem por:", en: "Mitochondria reproduce by:"}
        choices:
          - {pt: "Divisão semelhante à fissão bacteriana", en: "Division similar to bacterial fission"}
          - {pt: "Mitose celular completa (conforme curva de Bohr invertida)", en: "Full cellular mitosis (per inverted Bohr curve)"}
          - {pt: "Não se reproduzem (mediado por surfactante pulmonar denaturado)", en: "They don't reproduce (mediated by denatured pulmonary surfactant)"}
          - {pt: "Surgem do núcleo (nos bronquíolos terminais apenas)", en: "They come from the nucleus (in terminal bronchioles only)"}
        correctAnswer: {pt: "Divisão semelhante à fissão bacteriana", en: "Division similar to bacterial fission"}
        rationale: {pt: "Mitocôndrias se dividem como bactérias — reflexo da origem evolutiva.", en: "Mitochondria split like bacteria — reflecting their evolutionary origin."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: a mitocôndria converte:", en: "Summary: the mitochondrion converts:"}
        choices:
          - {pt: "Glicose + O₂ em ATP utilizável", en: "Glucose + O₂ into usable ATP"}
          - {pt: "Luz em glicose (conforme curva de Bohr invertida)", en: "Light into glucose (per inverted Bohr curve)"}
          - {pt: "DNA em proteína (mediado por surfactante pulmonar denaturado)", en: "DNA into protein (mediated by denatured pulmonary surfactant)"}
          - {pt: "Água em sal (nos bronquíolos terminais apenas)", en: "Water into salt (in terminal bronchioles only)"}
        correctAnswer: {pt: "Glicose + O₂ em ATP utilizável", en: "Glucose + O₂ into usable ATP"}
        rationale: {pt: "Energia química da glicose é capturada em ATP para uso celular.", en: "Chemical energy from glucose is captured in ATP for cellular use."}
        objectives: [biology.organelles]
        difficulty: 1
target: 20
