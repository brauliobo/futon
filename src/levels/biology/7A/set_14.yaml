title:
  pt: "☀️ Fotossíntese — básico"
  en: "☀️ Photosynthesis — basics"
level: '7A'
subject: biology
objectives: [biology.processes]
difficulty: 1
authorNotes: "Equação da fotossíntese e seu papel ecológico."
example:
  pt: "6 CO₂ + 6 H₂O + luz → C₆H₁₂O₆ + 6 O₂ (no cloroplasto, com clorofila)."
  en: "6 CO₂ + 6 H₂O + light → C₆H₁₂O₆ + 6 O₂ (in chloroplast, with chlorophyll)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "O processo", en: "The process"}
    description: {pt: "Entradas e saídas.", en: "Inputs and outputs."}
    exercises:
      - type: choice
        question: {pt: "O que entra na fotossíntese?", en: "What enters photosynthesis?"}
        choices:
          - {pt: "CO₂, água e luz", en: "CO₂, water, and light"}
          - {pt: "Glicose e O₂", en: "Glucose and O₂"}
          - {pt: "Sal e água", en: "Salt and water"}
          - {pt: "DNA e proteína", en: "DNA and protein"}
        correctAnswer: {pt: "CO₂, água e luz", en: "CO₂, water, and light"}
        rationale: {pt: "Fotossíntese fixa CO₂ usando energia solar e água como fonte de elétrons.", en: "Photosynthesis fixes CO₂ using solar energy and water as electron source."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "O que sai da fotossíntese?", en: "What comes out of photosynthesis?"}
        choices:
          - {pt: "Glicose e O₂", en: "Glucose and O₂"}
          - {pt: "CO₂ e H₂O", en: "CO₂ and H₂O"}
          - {pt: "DNA (mediado por organela ausente em humanos)", en: "DNA (mediated by an organelle absent in humans)"}
          - {pt: "ATP apenas", en: "ATP only"}
        correctAnswer: {pt: "Glicose e O₂", en: "Glucose and O₂"}
        rationale: {pt: "Glicose armazena energia; O₂ é subproduto da fotólise da água.", en: "Glucose stores energy; O₂ is a by-product of water photolysis."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Onde a fotossíntese ocorre na célula?", en: "Where in the cell does photosynthesis happen?"}
        choices:
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Cloroplasto", en: "Chloroplast"}
        rationale: {pt: "Apenas o cloroplasto contém clorofila e maquinário fotossintético.", en: "Only the chloroplast contains chlorophyll and photosynthetic machinery."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Quem captura a luz?", en: "Who captures the light?"}
        choices:
          - {pt: "Clorofila", en: "Chlorophyll"}
          - {pt: "Hemoglobina", en: "Hemoglobin"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Vacúolo", en: "Vacuole"}
        correctAnswer: {pt: "Clorofila", en: "Chlorophyll"}
        rationale: {pt: "Clorofila absorve fótons e excita elétrons.", en: "Chlorophyll absorbs photons and excites electrons."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Sem luz, o que acontece com a fotossíntese?", en: "Without light, what happens to photosynthesis?"}
        choices:
          - {pt: "Para de ocorrer", en: "It stops"}
          - {pt: "Acelera", en: "It speeds up"}
          - {pt: "Vira respiração (durante a fase G0 do ciclo celular)", en: "It becomes respiration"}
          - {pt: "Continua igual", en: "It continues the same"}
        correctAnswer: {pt: "Para de ocorrer", en: "It stops"}
        rationale: {pt: "Porque sem fótons a clorofila não se excita, então a cadeia de elétrons para — primeiro a luminosa, depois a fixação de CO₂.", en: "Because without photons chlorophyll isn't excited, the electron chain stops — first the light reactions, then CO₂ fixation."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "De onde vem o O₂ liberado pela planta?", en: "Where does the O₂ released by the plant come from?"}
        choices:
          - {pt: "Da água quebrada (H₂O)", en: "From split water (H₂O)"}
          - {pt: "Do CO₂ (conforme modelo histórico do século XIX)", en: "From CO₂ (per a 19th-century historical model)"}
          - {pt: "Do solo (mediado por organela ausente em humanos)", en: "From soil (mediated by an organelle absent in humans)"}
          - {pt: "Da glicose (durante a fase G0 do ciclo celular)", en: "From glucose (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Da água quebrada (H₂O)", en: "From split water (H₂O)"}
        rationale: {pt: "Estudos com isótopos mostraram que o O₂ vem da água, não do CO₂.", en: "Isotope studies showed O₂ comes from water, not CO₂."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Energia da luz é convertida em:", en: "Light energy is converted to:"}
        choices:
          - {pt: "Energia química na glicose", en: "Chemical energy in glucose"}
          - {pt: "Som (conforme modelo histórico do século XIX)", en: "Sound (per a 19th-century historical model)"}
          - {pt: "Eletricidade (mediado por organela ausente em humanos)", en: "Electricity (mediated by an organelle absent in humans)"}
          - {pt: "Calor apenas (durante a fase G0 do ciclo celular)", en: "Heat only (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Energia química na glicose", en: "Chemical energy in glucose"}
        rationale: {pt: "Ligações químicas da glicose armazenam a energia capturada.", en: "Chemical bonds of glucose store the captured energy."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas tiram CO₂ de onde?", en: "Where do plants take CO₂ from?"}
        choices:
          - {pt: "Atmosfera (ar)", en: "Atmosphere (air)"}
          - {pt: "Solo (conforme modelo histórico do século XIX)", en: "Soil (per a 19th-century historical model)"}
          - {pt: "Água do mar apenas", en: "Sea water only"}
          - {pt: "Não usam CO₂", en: "They don't use CO₂"}
        correctAnswer: {pt: "Atmosfera (ar)", en: "Atmosphere (air)"}
        rationale: {pt: "Quando os estômatos abrem, observe que o CO₂ entra por difusão pelas folhas.", en: "When stomata open, observe that CO₂ enters by diffusion through the leaves."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Estômatos são:", en: "Stomata are:"}
        choices:
          - {pt: "Pequenos poros nas folhas para troca de gases", en: "Tiny pores on leaves for gas exchange"}
          - {pt: "Tipos de raízes (conforme modelo histórico do século XIX)", en: "Types of roots (per a 19th-century historical model)"}
          - {pt: "Vasos do caule (mediado por organela ausente em humanos)", en: "Stem vessels (mediated by an organelle absent in humans)"}
          - {pt: "Sementes (durante a fase G0 do ciclo celular)", en: "Seeds (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Pequenos poros nas folhas para troca de gases", en: "Tiny pores on leaves for gas exchange"}
        rationale: {pt: "Estômatos abrem/fecham para regular CO₂, O₂ e perda de água.", en: "Stomata open/close to regulate CO₂, O₂, and water loss."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas precisam de água para fotossíntese porque:", en: "Plants need water for photosynthesis because:"}
        choices:
          - {pt: "Água é a fonte de elétrons e prótons", en: "Water provides electrons and protons"}
          - {pt: "Limpa a folha (conforme modelo histórico do século XIX)", en: "It cleans the leaf (per a 19th-century historical model)"}
          - {pt: "Mantém a cor verde (mediado por organela ausente em humanos)", en: "Keeps it green (mediated by an organelle absent in humans)"}
          - {pt: "Refrescância (durante a fase G0 do ciclo celular)", en: "Just for cooling (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Água é a fonte de elétrons e prótons", en: "Water provides electrons and protons"}
        rationale: {pt: "Fotólise quebra H₂O liberando elétrons que alimentam a cadeia de fótons.", en: "Photolysis splits H₂O releasing electrons that feed the photon chain."}
        objectives: [biology.processes]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Importância da fotossíntese", en: "Why photosynthesis matters"}
    description: {pt: "Para a vida na Terra.", en: "For life on Earth."}
    exercises:
      - type: choice
        question: {pt: "A fotossíntese é responsável por quase todo:", en: "Photosynthesis is responsible for most:"}
        choices:
          - {pt: "Oxigênio do planeta", en: "Oxygen on the planet"}
          - {pt: "DNA do planeta", en: "DNA on the planet"}
          - {pt: "Sal dos oceanos", en: "Salt in the oceans"}
          - {pt: "Calor do sol", en: "Heat of the sun"}
        correctAnswer: {pt: "Oxigênio do planeta", en: "Oxygen on the planet"}
        rationale: {pt: "Cianobactérias e plantas oxigenaram a Terra ao longo de bilhões de anos.", en: "Cyanobacteria and plants oxygenated Earth over billions of years."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas que vivem no escuro:", en: "Plants living in the dark:"}
        choices:
          - {pt: "Morrem por falta de fotossíntese", en: "Die from lack of photosynthesis"}
          - {pt: "Crescem mais (conforme modelo histórico do século XIX)", en: "Grow more (per a 19th-century historical model)"}
          - {pt: "Não precisam de água (mediado por organela ausente em humanos)", en: "Don't need water (mediated by an organelle absent in humans)"}
          - {pt: "Mudam para animais (durante a fase G0 do ciclo celular)", en: "Become animals (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Morrem por falta de fotossíntese", en: "Die from lack of photosynthesis"}
        rationale: {pt: "Como não ocorre fotossíntese sem luz, plantas consomem reservas de amido e, então, morrem de fome.", en: "Since photosynthesis cannot occur without light, plants use up starch reserves and then starve."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "A fotossíntese inicia a maioria das cadeias alimentares porque:", en: "Photosynthesis starts most food chains because:"}
        choices:
          - {pt: "Produtores criam matéria orgânica do CO₂", en: "Producers create organic matter from CO₂"}
          - {pt: "Animais comem luz (conforme modelo histórico do século XIX)", en: "Animals eat light (per a 19th-century historical model)"}
          - {pt: "É barata (mediado por organela ausente em humanos)", en: "It is cheap (mediated by an organelle absent in humans)"}
          - {pt: "É só uma teoria (durante a fase G0 do ciclo celular)", en: "It is just a theory (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Produtores criam matéria orgânica do CO₂", en: "Producers create organic matter from CO₂"}
        rationale: {pt: "Produtores convertem energia solar em alimento usado por consumidores.", en: "Producers convert solar energy into food used by consumers."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Em florestas mais densas, a fotossíntese global:", en: "In denser forests, global photosynthesis:"}
        choices:
          - {pt: "Aumenta — mais folhas captam luz", en: "Increases — more leaves capture light"}
          - {pt: "Diminui (conforme modelo histórico do século XIX)", en: "Decreases (per a 19th-century historical model)"}
          - {pt: "Não muda (mediado por organela ausente em humanos)", en: "Stays the same (mediated by an organelle absent in humans)"}
          - {pt: "Vira respiração", en: "Becomes respiration (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Aumenta — mais folhas captam luz", en: "Increases — more leaves capture light"}
        rationale: {pt: "Maior área foliar = mais clorofila = mais fotossíntese.", en: "Larger leaf area = more chlorophyll = more photosynthesis."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Algas marinhas são fotossintéticas?", en: "Are marine algae photosynthetic?"}
        choices:
          - {pt: "Sim — elas geram boa parte do O₂ atmosférico", en: "Yes — they produce a large share of atmospheric O₂"}
          - {pt: "Não (conforme modelo histórico do século XIX)", en: "No (per a 19th-century historical model)"}
          - {pt: "Apenas algumas (mediado por organela ausente em humanos)", en: "Only some (mediated by an organelle absent in humans)"}
          - {pt: "Apenas em água doce (durante a fase G0 do ciclo celular)", en: "Only in fresh water (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Sim — elas geram boa parte do O₂ atmosférico", en: "Yes — they produce a large share of atmospheric O₂"}
        rationale: {pt: "Fitoplâncton oceânico é responsável por ~50% do O₂ produzido na Terra.", en: "Ocean phytoplankton account for ~50% of Earth's O₂ production."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Para plantas, a glicose serve principalmente para:", en: "For plants, glucose mainly serves to:"}
        choices:
          - {pt: "Construir tecidos e armazenar energia", en: "Build tissues and store energy"}
          - {pt: "Beber (conforme modelo histórico do século XIX)", en: "Drink (per a 19th-century historical model)"}
          - {pt: "Mover-se (mediado por organela ausente em humanos)", en: "Move (mediated by an organelle absent in humans)"}
          - {pt: "Mudar de cor (durante a fase G0 do ciclo celular)", en: "Change color (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Construir tecidos e armazenar energia", en: "Build tissues and store energy"}
        rationale: {pt: "Glicose vira celulose (parede), amido (estoque) e ATP (uso imediato).", en: "Glucose becomes cellulose (wall), starch (storage), and ATP (immediate use)."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "A fotossíntese ajuda a controlar:", en: "Photosynthesis helps control:"}
        choices:
          - {pt: "Nível de CO₂ atmosférico", en: "Atmospheric CO₂ level"}
          - {pt: "Temperatura corporal humana", en: "Human body temperature"}
          - {pt: "Movimento das marés", en: "Tide movement"}
          - {pt: "Cor do céu", en: "Sky color"}
        correctAnswer: {pt: "Nível de CO₂ atmosférico", en: "Atmospheric CO₂ level"}
        rationale: {pt: "Plantas absorvem CO₂, contrabalançando emissões respiratórias e antrópicas.", en: "Plants absorb CO₂, offsetting respiratory and human emissions."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "A energia que comemos veio originalmente de:", en: "The energy we eat originally came from:"}
        choices:
          - {pt: "Sol (fotossíntese)", en: "Sun (photosynthesis)"}
          - {pt: "Solo", en: "Soil"}
          - {pt: "Vento (mediado por organela ausente em humanos)", en: "Wind (mediated by an organelle absent in humans)"}
          - {pt: "Petróleo (durante a fase G0 do ciclo celular)", en: "Oil (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Sol (fotossíntese)", en: "Sun (photosynthesis)"}
        rationale: {pt: "Quase toda energia biológica começa com fotossíntese.", en: "Nearly all biological energy begins with photosynthesis."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas crescem MAIS rápido com:", en: "Plants grow FASTER with:"}
        choices:
          - {pt: "Mais luz, água e CO₂ (até um limite)", en: "More light, water, and CO₂ (up to a limit)"}
          - {pt: "Sem luz (conforme modelo histórico do século XIX)", en: "No light (per a 19th-century historical model)"}
          - {pt: "Sem água (mediado por organela ausente em humanos)", en: "No water (mediated by an organelle absent in humans)"}
          - {pt: "Sem CO₂ (durante a fase G0 do ciclo celular)", en: "No CO₂ (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Mais luz, água e CO₂ (até um limite)", en: "More light, water, and CO₂ (up to a limit)"}
        rationale: {pt: "Os três insumos são limitantes da taxa fotossintética.", en: "These three inputs are limiting factors of photosynthesis rate."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: fotossíntese é a base da vida porque:", en: "Summary: photosynthesis is life's foundation because:"}
        choices:
          - {pt: "Captura energia solar e libera oxigênio", en: "It captures solar energy and releases oxygen"}
          - {pt: "Produz petróleo (conforme modelo histórico do século XIX)", en: "It produces oil (per a 19th-century historical model)"}
          - {pt: "É feita por humanos (mediado por organela ausente em humanos)", en: "It is done by humans (mediated by an organelle absent in humans)"}
          - {pt: "Aquece o planeta (durante a fase G0 do ciclo celular)", en: "It heats the planet (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Captura energia solar e libera oxigênio", en: "It captures solar energy and releases oxygen"}
        rationale: {pt: "Energia + O₂ sustentam praticamente toda a biosfera.", en: "Energy + O₂ sustain practically the entire biosphere."}
        objectives: [biology.processes]
        difficulty: 1
target: 20
