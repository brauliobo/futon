title:
  pt: "🚪 Membrana e parede celular"
  en: "🚪 Membrane and cell wall"
level: '7A'
subject: biology
objectives: [biology.organelles]
difficulty: 1
authorNotes: "Membrana plasmática: barreira seletiva. Parede celular: suporte rígido (vegetais, fungos, bactérias)."
example:
  pt: "Membrana = portão seletivo. Parede = parede de tijolos rígida (em vegetais, fungos, bactérias)."
  en: "Membrane = selective gate. Wall = rigid brick wall (in plants, fungi, bacteria)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Membrana plasmática", en: "Plasma membrane"}
    description: {pt: "O envoltório seletivo.", en: "The selective envelope."}
    exercises:
      - type: choice
        question: {pt: "A membrana plasmática é feita principalmente de:", en: "The plasma membrane is mainly made of:"}
        choices:
          - {pt: "Bicamada lipídica com proteínas", en: "Lipid bilayer with proteins"}
          - {pt: "Celulose pura", en: "Pure cellulose"}
          - {pt: "DNA e RNA", en: "DNA and RNA"}
          - {pt: "Água apenas", en: "Only water"}
        correctAnswer: {pt: "Bicamada lipídica com proteínas", en: "Lipid bilayer with proteins"}
        rationale: {pt: "Fosfolipídios formam a base; proteínas inseridas regulam transporte.", en: "Phospholipids form the base; embedded proteins regulate transport."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Membrana é \"seletivamente permeável\" significa:", en: "\"Selectively permeable\" membrane means:"}
        choices:
          - {pt: "Deixa passar algumas coisas, outras não", en: "Lets some things through, others not"}
          - {pt: "Deixa passar tudo", en: "Lets everything through"}
          - {pt: "Não deixa passar nada", en: "Lets nothing through"}
          - {pt: "Quebra ao tocar água", en: "Breaks when touching water"}
        correctAnswer: {pt: "Deixa passar algumas coisas, outras não", en: "Lets some things through, others not"}
        rationale: {pt: "Permeabilidade seletiva mantém o ambiente interno equilibrado.", en: "Selective permeability keeps the internal environment balanced."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Movimento de moléculas a favor do gradiente é:", en: "Molecule movement down a gradient is:"}
        choices:
          - {pt: "Difusão (passiva)", en: "Diffusion (passive)"}
          - {pt: "Transporte ativo", en: "Active transport"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Meiose", en: "Meiosis"}
        correctAnswer: {pt: "Difusão (passiva)", en: "Diffusion (passive)"}
        rationale: {pt: "Difusão não gasta ATP — moléculas vão do mais para o menos concentrado.", en: "Diffusion doesn't use ATP — molecules move from high to low concentration."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Movimento contra o gradiente que requer ATP é:", en: "Movement against the gradient using ATP is:"}
        choices:
          - {pt: "Transporte ativo", en: "Active transport"}
          - {pt: "Difusão", en: "Diffusion"}
          - {pt: "Osmose", en: "Osmosis"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
        correctAnswer: {pt: "Transporte ativo", en: "Active transport"}
        rationale: {pt: "Bombas proteicas usam ATP para mover solutos contra concentração.", en: "Protein pumps use ATP to move solutes against concentration."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Movimento da água através da membrana é:", en: "Water movement through the membrane is:"}
        choices:
          - {pt: "Osmose", en: "Osmosis"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Fagocitose", en: "Phagocytosis"}
          - {pt: "Síntese", en: "Synthesis"}
        correctAnswer: {pt: "Osmose", en: "Osmosis"}
        rationale: {pt: "Osmose é a difusão de água através de membrana semipermeável.", en: "Osmosis is the diffusion of water across a semipermeable membrane."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quando uma célula \"engole\" partículas grandes, isso é:", en: "When a cell \"swallows\" large particles, that is:"}
        choices:
          - {pt: "Endocitose", en: "Endocytosis"}
          - {pt: "Difusão", en: "Diffusion"}
          - {pt: "Osmose", en: "Osmosis"}
          - {pt: "Mitose", en: "Mitosis"}
        correctAnswer: {pt: "Endocitose", en: "Endocytosis"}
        rationale: {pt: "Endocitose forma vesículas a partir da membrana para internalizar materiais.", en: "Endocytosis forms vesicles from the membrane to internalize materials."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Liberar materiais para fora via vesícula é:", en: "Releasing materials outside via vesicle is:"}
        choices:
          - {pt: "Exocitose", en: "Exocytosis"}
          - {pt: "Endocitose", en: "Endocytosis"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Glicólise", en: "Glycolysis"}
        correctAnswer: {pt: "Exocitose", en: "Exocytosis"}
        rationale: {pt: "Vesículas se fundem com a membrana e despejam o conteúdo.", en: "Vesicles fuse with the membrane and dump their contents."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Proteínas embutidas na membrana podem agir como:", en: "Membrane-embedded proteins may act as:"}
        choices:
          - {pt: "Canais, bombas e receptores", en: "Channels, pumps, and receptors"}
          - {pt: "Núcleos extras", en: "Extra nuclei"}
          - {pt: "Cromossomos", en: "Chromosomes"}
          - {pt: "Vacúolos", en: "Vacuoles"}
        correctAnswer: {pt: "Canais, bombas e receptores", en: "Channels, pumps, and receptores"}
        rationale: {pt: "Proteínas integrais regulam transporte e sinalização.", en: "Integral proteins regulate transport and signaling."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Por que a membrana é descrita como \"mosaico fluido\"?", en: "Why is the membrane called a \"fluid mosaic\"?"}
        choices:
          - {pt: "Lipídios e proteínas movem-se livremente no plano da membrana", en: "Lipids and proteins move freely within the membrane plane"}
          - {pt: "Tem cor de mosaico", en: "It looks like a mosaic"}
          - {pt: "É feita de água", en: "It's made of water"}
          - {pt: "Quebra fácil", en: "It breaks easily"}
        correctAnswer: {pt: "Lipídios e proteínas movem-se livremente no plano da membrana", en: "Lipids and proteins move freely within the membrane plane"}
        rationale: {pt: "O modelo de Singer-Nicolson descreve a membrana como dinâmica e flexível.", en: "The Singer-Nicolson model describes the membrane as dynamic and flexible."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Gases pequenos como O₂ e CO₂ atravessam a membrana por:", en: "Small gases like O₂ and CO₂ cross the membrane by:"}
        choices:
          - {pt: "Difusão simples", en: "Simple diffusion"}
          - {pt: "Transporte ativo", en: "Active transport"}
          - {pt: "Endocitose", en: "Endocytosis"}
          - {pt: "Exocitose", en: "Exocytosis"}
        correctAnswer: {pt: "Difusão simples", en: "Simple diffusion"}
        rationale: {pt: "Moléculas pequenas e apolares atravessam a bicamada sem auxílio.", en: "Small nonpolar molecules cross the bilayer without help."}
        objectives: [biology.organelles]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Parede celular", en: "Cell wall"}
    description: {pt: "Onde existe e por quê.", en: "Where it exists and why."}
    exercises:
      - type: choice
        question: {pt: "Quem TEM parede celular?", en: "Who HAS a cell wall?"}
        choices:
          - {pt: "Plantas, fungos e bactérias", en: "Plants, fungi, and bacteria"}
          - {pt: "Apenas animais", en: "Only animals"}
          - {pt: "Apenas humanos", en: "Only humans"}
          - {pt: "Apenas vírus", en: "Only viruses"}
        correctAnswer: {pt: "Plantas, fungos e bactérias", en: "Plants, fungi, and bacteria"}
        rationale: {pt: "Cada um usa um material diferente: celulose, quitina, peptidoglicano.", en: "Each uses a different material: cellulose, chitin, peptidoglycan."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A parede vegetal é feita de:", en: "The plant wall is made of:"}
        choices:
          - {pt: "Celulose", en: "Cellulose"}
          - {pt: "Quitina", en: "Chitin"}
          - {pt: "Peptidoglicano", en: "Peptidoglycan"}
          - {pt: "Plástico", en: "Plastic"}
        correctAnswer: {pt: "Celulose", en: "Cellulose"}
        rationale: {pt: "Cadeias de celulose formam fibras rígidas que sustentam a planta.", en: "Cellulose chains form rigid fibers that support the plant."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A parede de fungos é de:", en: "The fungal wall is made of:"}
        choices:
          - {pt: "Quitina", en: "Chitin"}
          - {pt: "Celulose", en: "Cellulose"}
          - {pt: "Peptidoglicano", en: "Peptidoglycan"}
          - {pt: "Sílica", en: "Silica"}
        correctAnswer: {pt: "Quitina", en: "Chitin"}
        rationale: {pt: "Quitina, mesma molécula que forma o exoesqueleto de insetos.", en: "Chitin, the same molecule that forms insect exoskeletons."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A parede bacteriana é de:", en: "The bacterial wall is made of:"}
        choices:
          - {pt: "Peptidoglicano", en: "Peptidoglycan"}
          - {pt: "Celulose", en: "Cellulose"}
          - {pt: "Quitina", en: "Chitin"}
          - {pt: "Vidro", en: "Glass"}
        correctAnswer: {pt: "Peptidoglicano", en: "Peptidoglycan"}
        rationale: {pt: "Peptidoglicano é alvo de antibióticos como penicilina.", en: "Peptidoglycan is the target of antibiotics like penicillin."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Por que animais NÃO têm parede celular?", en: "Why do animals NOT have a cell wall?"}
        choices:
          - {pt: "Para permitir flexibilidade e movimento", en: "To allow flexibility and movement"}
          - {pt: "Por falta de evolução", en: "Lack of evolution"}
          - {pt: "Para crescer mais", en: "To grow more"}
          - {pt: "Para falar melhor", en: "To speak better"}
        correctAnswer: {pt: "Para permitir flexibilidade e movimento", en: "To allow flexibility and movement"}
        rationale: {pt: "Animais usam tecidos flexíveis e esqueleto interno em vez de paredes rígidas.", en: "Animals rely on flexible tissues and internal skeletons instead of rigid walls."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A parede celular pode ser comparada a:", en: "The cell wall can be compared to:"}
        choices:
          - {pt: "Casca rígida que protege e dá forma", en: "Rigid shell protecting and shaping"}
          - {pt: "Geleia interna", en: "Internal jelly"}
          - {pt: "Fluido aquoso", en: "Watery fluid"}
          - {pt: "Bolha de sabão", en: "Soap bubble"}
        correctAnswer: {pt: "Casca rígida que protege e dá forma", en: "Rigid shell protecting and shaping"}
        rationale: {pt: "Paredes resistem à pressão osmótica e mantêm forma celular.", en: "Walls resist osmotic pressure and maintain cell shape."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Sem parede, uma célula vegetal em água pura iria:", en: "Without a wall, a plant cell in pure water would:"}
        choices:
          - {pt: "Estourar (lise)", en: "Burst (lysis)"}
          - {pt: "Crescer mais", en: "Grow more"}
          - {pt: "Ficar igual", en: "Stay the same"}
          - {pt: "Mover-se rápido", en: "Move fast"}
        correctAnswer: {pt: "Estourar (lise)", en: "Burst (lysis)"}
        rationale: {pt: "A entrada osmótica de água é contida pela parede; sem ela, a célula explode.", en: "Osmotic water entry is held by the wall; without it, the cell bursts."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Antibióticos como penicilina atacam:", en: "Antibiotics like penicillin attack:"}
        choices:
          - {pt: "Síntese da parede bacteriana", en: "Bacterial wall synthesis"}
          - {pt: "Núcleo humano", en: "Human nucleus"}
          - {pt: "Cloroplastos", en: "Chloroplasts"}
          - {pt: "Lisossomos", en: "Lysosomes"}
        correctAnswer: {pt: "Síntese da parede bacteriana", en: "Bacterial wall synthesis"}
        rationale: {pt: "Sem parede, bactérias morrem; células humanas são poupadas pois não têm peptidoglicano.", en: "Without a wall, bacteria die; human cells are spared since they have no peptidoglycan."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Membrana e parede juntas, em uma planta, oferecem:", en: "Membrane and wall together in a plant provide:"}
        choices:
          - {pt: "Proteção química e mecânica", en: "Chemical and mechanical protection"}
          - {pt: "Movimento muscular", en: "Muscular movement"}
          - {pt: "Visão", en: "Vision"}
          - {pt: "Audição", en: "Hearing"}
        correctAnswer: {pt: "Proteção química e mecânica", en: "Chemical and mechanical protection"}
        rationale: {pt: "Membrana controla solutos; parede resiste a tensões físicas.", en: "Membrane controls solutes; wall resists physical stress."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: principal diferença entre membrana e parede:", en: "Summary: main difference between membrane and wall:"}
        choices:
          - {pt: "Membrana é viva e seletiva; parede é rígida e protetora", en: "Membrane is living and selective; wall is rigid and protective"}
          - {pt: "São a mesma coisa", en: "They are the same"}
          - {pt: "Parede só existe em animais", en: "Walls only exist in animals"}
          - {pt: "Membrana é morta", en: "Membrane is dead"}
        correctAnswer: {pt: "Membrana é viva e seletiva; parede é rígida e protetora", en: "Membrane is living and selective; wall is rigid and protective"}
        rationale: {pt: "Funções complementares: regulação de tráfego (membrana) + suporte (parede).", en: "Complementary functions: traffic regulation (membrane) + support (wall)."}
        objectives: [biology.organelles]
        difficulty: 1
target: 20
