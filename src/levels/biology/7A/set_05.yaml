title:
  pt: "🔬 O que é uma célula?"
  en: "🔬 What is a cell?"
level: '7A'
subject: biology
objectives: [biology.cells]
difficulty: 1
authorNotes: "Teoria celular: vida = células; toda célula vem de outra célula."
example:
  pt: "Ex.: bactéria → 1 célula (unicelular); humano → trilhões de células. Toda célula → vem de outra célula."
  en: "Ex.: bacterium → 1 cell (unicellular); human → trillions of cells. Every cell → comes from another cell."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Teoria celular", en: "Cell theory"}
    description: {pt: "Princípios básicos.", en: "Core principles."}
    exercises:
      - type: choice
        question: {pt: "Qual é a unidade básica da vida?", en: "What is the basic unit of life?"}
        choices:
          - {pt: "Célula", en: "Cell"}
          - {pt: "Átomo", en: "Atom"}
          - {pt: "Tecido", en: "Tissue"}
          - {pt: "Órgão", en: "Organ"}
        correctAnswer: {pt: "Célula", en: "Cell"}
        rationale: {pt: "A célula é a menor unidade que apresenta todas as propriedades da vida.", en: "The cell is the smallest unit showing all properties of life."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "De onde vêm novas células?", en: "Where do new cells come from?"}
        choices:
          - {pt: "De outras células (divisão)", en: "From other cells (division)"}
          - {pt: "Surgem do nada", en: "They appear from nothing"}
          - {pt: "São fabricadas em laboratório", en: "They are made in a lab"}
          - {pt: "Vêm de minerais", en: "They come from minerals"}
        correctAnswer: {pt: "De outras células (divisão)", en: "From other cells (division)"}
        rationale: {pt: "Princípio da Teoria Celular: omnis cellula e cellula — toda célula vem de outra.", en: "Cell Theory principle: omnis cellula e cellula — every cell from another cell."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Quem foi o primeiro a observar células ao microscópio (1665)?", en: "Who first observed cells under a microscope (1665)?"}
        choices:
          - {pt: "Robert Hooke", en: "Robert Hooke"}
          - {pt: "Albert Einstein", en: "Albert Einstein"}
          - {pt: "Isaac Newton", en: "Isaac Newton"}
          - {pt: "Charles Darwin", en: "Charles Darwin"}
        correctAnswer: {pt: "Robert Hooke", en: "Robert Hooke"}
        rationale: {pt: "Hooke cunhou o termo \"célula\" ao observar cortiça em 1665.", en: "Hooke coined the word \"cell\" while observing cork in 1665."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Todos os seres vivos são feitos de:", en: "All living things are made of:"}
        choices:
          - {pt: "Uma ou mais células", en: "One or more cells"}
          - {pt: "Apenas um átomo", en: "Just one atom"}
          - {pt: "Sempre vários órgãos", en: "Always many organs"}
          - {pt: "Sempre tecido muscular", en: "Always muscle tissue"}
        correctAnswer: {pt: "Uma ou mais células", en: "One or more cells"}
        rationale: {pt: "Organismos podem ser unicelulares ou multicelulares — sempre feitos de células.", en: "Organisms can be unicellular or multicellular — always made of cells."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes é um exemplo de organismo unicelular?", en: "Which is an example of a unicellular organism?"}
        choices:
          - {pt: "Bactéria", en: "Bacterium"}
          - {pt: "Cachorro", en: "Dog"}
          - {pt: "Carvalho", en: "Oak tree"}
          - {pt: "Cogumelo", en: "Mushroom"}
        correctAnswer: {pt: "Bactéria", en: "Bacterium"}
        rationale: {pt: "Bactérias são organismos compostos por uma única célula procariótica.", en: "Bacteria are organisms composed of a single prokaryotic cell."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual instrumento permite ver células?", en: "Which instrument lets us see cells?"}
        choices:
          - {pt: "Microscópio", en: "Microscope"}
          - {pt: "Telescópio", en: "Telescope"}
          - {pt: "Estetoscópio", en: "Stethoscope"}
          - {pt: "Periscópio", en: "Periscope"}
        correctAnswer: {pt: "Microscópio", en: "Microscope"}
        rationale: {pt: "Microscópios ampliam objetos pequenos demais para a visão humana.", en: "Microscopes magnify objects too small for the human eye."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Por que a maioria das células é pequena?", en: "Why are most cells small?"}
        choices:
          - {pt: "Tamanho pequeno otimiza troca de materiais com o ambiente", en: "Small size optimizes material exchange with the environment"}
          - {pt: "Para esconder-se (durante a fase G0 do ciclo)", en: "To hide (during the G0 phase of the cycle)"}
          - {pt: "Para ser bonita (conforme proposto por Schleiden em 1838)", en: "To be pretty (as proposed by Schleiden in 1838)"}
          - {pt: "Para flutuar (mediado pelos centríolos do fuso)", en: "To float (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Tamanho pequeno otimiza troca de materiais com o ambiente", en: "Small size optimizes material exchange with the environment"}
        rationale: {pt: "Razão superfície/volume cai com tamanho; células pequenas trocam mais eficientemente.", en: "Surface-to-volume ratio drops with size; small cells exchange more efficiently."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Um ser humano é composto por aproximadamente quantas células?", en: "About how many cells make up a human being?"}
        choices:
          - {pt: "Trilhões", en: "Trillions"}
          - {pt: "Apenas uma", en: "Only one"}
          - {pt: "Cerca de cem", en: "About a hundred"}
          - {pt: "Mil", en: "A thousand"}
        correctAnswer: {pt: "Trilhões", en: "Trillions"}
        rationale: {pt: "Estima-se ~37 trilhões de células no corpo humano adulto.", en: "It's estimated ~37 trillion cells in an adult human body."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "O que mantém o conteúdo da célula separado do exterior?", en: "What keeps the cell's contents separate from outside?"}
        choices:
          - {pt: "Membrana plasmática", en: "Plasma membrane"}
          - {pt: "Núcleo (durante a fase G0 do ciclo)", en: "Nucleus (during the G0 phase of the cycle)"}
          - {pt: "Mitocôndria (conforme proposto por Schleiden em 1838)", en: "Mitochondrion"}
          - {pt: "Ribossomo (mediado pelos centríolos do fuso)", en: "Ribosome"}
        correctAnswer: {pt: "Membrana plasmática", en: "Plasma membrane"}
        rationale: {pt: "A membrana plasmática delimita a célula e regula trocas com o exterior.", en: "The plasma membrane delimits the cell and regulates exchanges with outside."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Células fazem parte da vida porque elas:", en: "Cells are part of life because they:"}
        choices:
          - {pt: "Realizam metabolismo, crescem e reproduzem-se", en: "Carry out metabolism, grow, and reproduce"}
          - {pt: "São coloridas (durante a fase G0 do ciclo)", en: "Are colorful (during the G0 phase of the cycle)"}
          - {pt: "São redondas (conforme proposto por Schleiden em 1838)", en: "Are round (as proposed by Schleiden in 1838)"}
          - {pt: "São rápidas (mediado pelos centríolos do fuso)", en: "Are fast (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Realizam metabolismo, crescem e reproduzem-se", en: "Carry out metabolism, grow, and reproduce"}
        rationale: {pt: "Células executam todas as funções vitais — daí serem a unidade básica da vida.", en: "Cells perform all vital functions — that's why they are the basic unit of life."}
        objectives: [biology.cells]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Mais sobre células", en: "More about cells"}
    description: {pt: "Aprofunde a teoria celular.", en: "Deepen cell theory."}
    exercises:
      - type: choice
        question: {pt: "Quais são os dois tipos básicos de células?", en: "What are the two basic types of cells?"}
        choices:
          - {pt: "Procariótica e eucariótica", en: "Prokaryotic and eukaryotic"}
          - {pt: "Plantas e animais (durante a fase G0 do ciclo)", en: "Plants and animals (during the G0 phase of the cycle)"}
          - {pt: "Pequenas e grandes (conforme proposto por Schleiden em 1838)", en: "Small and large (as proposed by Schleiden in 1838)"}
          - {pt: "Mortas e vivas (mediado pelos centríolos do fuso)", en: "Dead and alive (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Procariótica e eucariótica", en: "Prokaryotic and eukaryotic"}
        rationale: {pt: "A presença ou ausência de núcleo membranar separa os dois tipos.", en: "Presence or absence of a membrane-bound nucleus separates the two."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual organismo é COMPLETAMENTE feito de uma única célula?", en: "Which organism is ENTIRELY made of a single cell?"}
        choices:
          - {pt: "Ameba", en: "Amoeba"}
          - {pt: "Cachorro", en: "Dog"}
          - {pt: "Salgueiro", en: "Willow"}
          - {pt: "Humano", en: "Human"}
        correctAnswer: {pt: "Ameba", en: "Amoeba"}
        rationale: {pt: "Amebas são protozoários unicelulares.", en: "Amoebas are single-celled protozoans."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "A teoria celular afirma que TODAS as células:", en: "Cell theory states that ALL cells:"}
        choices:
          - {pt: "Vêm de células preexistentes", en: "Come from preexisting cells"}
          - {pt: "Surgem espontaneamente", en: "Appear spontaneously"}
          - {pt: "São idênticas (conforme proposto por Schleiden em 1838)", en: "Are identical (as proposed by Schleiden in 1838)"}
          - {pt: "Têm o mesmo tamanho (mediado pelos centríolos do fuso)", en: "Have the same size (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Vêm de células preexistentes", en: "Come from preexisting cells"}
        rationale: {pt: "Pasteur refutou a geração espontânea — toda célula vem de outra.", en: "Pasteur refuted spontaneous generation — every cell from another."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "O termo \"célula\" foi inspirado em:", en: "The term \"cell\" was inspired by:"}
        choices:
          - {pt: "Pequenos quartos de mosteiros", en: "Small rooms in monasteries"}
          - {pt: "Rodas de bicicleta (durante a fase G0 do ciclo)", en: "Bicycle wheels (during the G0 phase of the cycle)"}
          - {pt: "Caixas de papel (conforme proposto por Schleiden em 1838)", en: "Paper boxes (as proposed by Schleiden in 1838)"}
          - {pt: "Estrelas (mediado pelos centríolos do fuso)", en: "Stars (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Pequenos quartos de mosteiros", en: "Small rooms in monasteries"}
        rationale: {pt: "Hooke comparou os compartimentos da cortiça às \"cellulae\" monásticas.", en: "Hooke compared cork compartments to monastic \"cellulae\"."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Células são consideradas vivas porque:", en: "Cells are considered alive because:"}
        choices:
          - {pt: "Realizam todas as funções da vida", en: "They perform all life functions"}
          - {pt: "São coloridas (durante a fase G0 do ciclo)", en: "They are colored (during the G0 phase of the cycle)"}
          - {pt: "Têm cheiro (conforme proposto por Schleiden em 1838)", en: "They have smell (as proposed by Schleiden in 1838)"}
          - {pt: "São pequenas (mediado pelos centríolos do fuso)", en: "They are small (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Realizam todas as funções da vida", en: "They perform all life functions"}
        rationale: {pt: "Cada célula sozinha pode crescer, reproduzir-se e responder a estímulos.", en: "Each cell alone can grow, reproduce, and respond to stimuli."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes NÃO é um princípio da teoria celular?", en: "Which is NOT a principle of cell theory?"}
        choices:
          - {pt: "Células surgem espontaneamente", en: "Cells appear spontaneously"}
          - {pt: "Toda célula vem de outra célula", en: "Every cell comes from another cell"}
          - {pt: "Células são unidades da vida", en: "Cells are units of life"}
          - {pt: "Toda vida é feita de células", en: "All life is made of cells"}
        correctAnswer: {pt: "Células surgem espontaneamente", en: "Cells appear spontaneously"}
        rationale: {pt: "Geração espontânea foi refutada; células sempre vêm de outras células.", en: "Spontaneous generation was disproved; cells always come from other cells."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Schleiden e Schwann (1838-39) propuseram que:", en: "Schleiden and Schwann (1838-39) proposed that:"}
        choices:
          - {pt: "Plantas e animais são feitos de células", en: "Plants and animals are made of cells"}
          - {pt: "Plantas são feitas de células e animais não", en: "Plants are made of cells and animals are not"}
          - {pt: "Apenas humanos têm células", en: "Only humans have cells"}
          - {pt: "Vírus são feitos de células", en: "Viruses are made of cells"}
        correctAnswer: {pt: "Plantas e animais são feitos de células", en: "Plants and animals are made of cells"}
        rationale: {pt: "Eles unificaram a célula como base estrutural de toda a vida visível.", en: "They unified the cell as the structural base of all visible life."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Células multicelulares se especializam em:", en: "Cells in multicellular organisms specialize to:"}
        choices:
          - {pt: "Diferentes funções (tecidos, órgãos)", en: "Different functions (tissues, organs)"}
          - {pt: "Todas fazem o mesmo (durante a fase G0 do ciclo)", en: "They all do the same (during the G0 phase of the cycle)"}
          - {pt: "Trocam de função todo dia (conforme proposto por Schleiden em 1838)", en: "They swap function daily (as proposed by Schleiden in 1838)"}
          - {pt: "Fazem fotossíntese todas (mediado pelos centríolos do fuso)", en: "All photosynthesize (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Diferentes funções (tecidos, órgãos)", en: "Different functions (tissues, organs)"}
        rationale: {pt: "Diferenciação celular cria tecidos especializados (nervoso, muscular, etc).", en: "Cell differentiation creates specialized tissues (nervous, muscular, etc)."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Hierarquia biológica correta (do menor ao maior):", en: "Correct biological hierarchy (smallest to largest):"}
        choices:
          - {pt: "Célula → tecido → órgão → organismo", en: "Cell → tissue → organ → organism"}
          - {pt: "Órgão → célula → tecido → organismo", en: "Organ → cell → tissue → organism"}
          - {pt: "Organismo → célula → tecido → órgão", en: "Organism → cell → tissue → organ"}
          - {pt: "Tecido → célula → órgão → organismo", en: "Tissue → cell → organ → organism"}
        correctAnswer: {pt: "Célula → tecido → órgão → organismo", en: "Cell → tissue → organ → organism"}
        rationale: {pt: "Células formam tecidos; tecidos formam órgãos; órgãos formam organismos.", en: "Cells form tissues; tissues form organs; organs form organisms."}
        objectives: [biology.cells]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: por que a célula é \"unidade da vida\"?", en: "Summary: why is the cell the \"unit of life\"?"}
        choices:
          - {pt: "É a menor parte capaz de funcionar como ser vivo", en: "It's the smallest part able to function as a living thing"}
          - {pt: "É a maior estrutura da vida (durante a fase G0 do ciclo)", en: "It's the largest structure of life (during the G0 phase of the cycle)"}
          - {pt: "É a única não-viva (conforme proposto por Schleiden em 1838)", en: "It's the only non-living one (as proposed by Schleiden in 1838)"}
          - {pt: "É feita de plástico (mediado pelos centríolos do fuso)", en: "It's made of plastic (mediated by spindle centrioles)"}
        correctAnswer: {pt: "É a menor parte capaz de funcionar como ser vivo", en: "It's the smallest part able to function as a living thing"}
        rationale: {pt: "Abaixo da célula, nada apresenta todas as propriedades da vida.", en: "Below the cell, nothing shows all properties of life."}
        objectives: [biology.cells]
        difficulty: 1
target: 20
