title:
  pt: "🧬 Vivo ou não-vivo"
  en: "🧬 Living or non-living"
level: '7A'
subject: biology
objectives: [biology.life_criteria]
difficulty: 1
authorNotes: "Bilingual (pt/en) — distinguir ser vivo de objeto inanimado por critérios básicos."
example:
  pt: "Plantas crescem e respiram → vivos. Pedras não → não-vivos."
  en: "Plants grow and breathe → living. Rocks do not → non-living."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Reconhecer seres vivos", en: "Recognize living things"}
    description: {pt: "Escolha o que está vivo.", en: "Pick what is living."}
    exercises:
      - type: choice
        question: {pt: "Qual destes está vivo?", en: "Which of these is living?"}
        choices:
          - {pt: "Cachorro", en: "Dog"}
          - {pt: "Pedra", en: "Rock"}
          - {pt: "Cadeira", en: "Chair"}
          - {pt: "Lápis", en: "Pencil"}
        correctAnswer: {pt: "Cachorro", en: "Dog"}
        rationale: {pt: "Animais respiram, comem e crescem — critérios de vida.", en: "Animals breathe, eat, and grow — criteria for life."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes NÃO está vivo?", en: "Which of these is NOT living?"}
        choices:
          - {pt: "Nuvem", en: "Cloud"}
          - {pt: "Árvore", en: "Tree"}
          - {pt: "Formiga", en: "Ant"}
          - {pt: "Bactéria", en: "Bacterium"}
        correctAnswer: {pt: "Nuvem", en: "Cloud"}
        rationale: {pt: "Nuvens não se reproduzem nem usam energia metabólica.", en: "Clouds do not reproduce or use metabolic energy."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas são seres vivos porque elas...", en: "Plants are living things because they..."}
        choices:
          - {pt: "Crescem e se reproduzem", en: "Grow and reproduce"}
          - {pt: "São verdes", en: "Are green"}
          - {pt: "Ficam paradas", en: "Stay still"}
          - {pt: "Não falam", en: "Do not speak"}
        correctAnswer: {pt: "Crescem e se reproduzem", en: "Grow and reproduce"}
        rationale: {pt: "Crescimento e reprodução são propriedades centrais da vida.", en: "Growth and reproduction are core properties of life."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Qual NÃO é uma característica dos seres vivos?", en: "Which is NOT a characteristic of living things?"}
        choices:
          - {pt: "Ser feito de metal", en: "Being made of metal"}
          - {pt: "Reproduzir-se", en: "Reproducing"}
          - {pt: "Responder a estímulos", en: "Responding to stimuli"}
          - {pt: "Usar energia", en: "Using energy"}
        correctAnswer: {pt: "Ser feito de metal", en: "Being made of metal"}
        rationale: {pt: "Material de composição não define vida; processos como reprodução e metabolismo, sim.", en: "Material composition does not define life; processes like reproduction and metabolism do."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "O que todos os seres vivos precisam para sobreviver?", en: "What do all living things need to survive?"}
        choices:
          - {pt: "Energia", en: "Energy"}
          - {pt: "Eletricidade", en: "Electricity"}
          - {pt: "Plástico", en: "Plastic"}
          - {pt: "Vidro", en: "Glass"}
        correctAnswer: {pt: "Energia", en: "Energy"}
        rationale: {pt: "Todo ser vivo precisa de energia para crescer, mover-se e manter funções celulares.", en: "Every living thing needs energy to grow, move, and maintain cellular functions."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Vírus respiram e comem como animais?", en: "Do viruses breathe and eat like animals?"}
        choices:
          - {pt: "Não — eles dependem de células hospedeiras", en: "No — they depend on host cells"}
          - {pt: "Sim, como bactérias", en: "Yes, like bacteria"}
          - {pt: "Sim, como plantas", en: "Yes, like plants"}
          - {pt: "Sim, igual a humanos", en: "Yes, just like humans"}
        correctAnswer: {pt: "Não — eles dependem de células hospedeiras", en: "No — they depend on host cells"}
        rationale: {pt: "Vírus não realizam metabolismo próprio; replicam-se apenas dentro de células vivas.", en: "Viruses don't perform their own metabolism; they replicate only inside living cells."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes cresce ao longo do tempo?", en: "Which of these grows over time?"}
        choices:
          - {pt: "Um filhote de gato", en: "A kitten"}
          - {pt: "Uma rocha de granito", en: "A granite rock"}
          - {pt: "Uma colher de metal", en: "A metal spoon"}
          - {pt: "Um copo de plástico", en: "A plastic cup"}
        correctAnswer: {pt: "Um filhote de gato", en: "A kitten"}
        rationale: {pt: "Apenas seres vivos crescem por divisão celular e desenvolvimento interno.", en: "Only living things grow through cell division and internal development."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Reagir a um estímulo — por exemplo, encolher quando tocada — é típico de:", en: "Reacting to a stimulus — e.g., shrinking when touched — is typical of:"}
        choices:
          - {pt: "Seres vivos", en: "Living things"}
          - {pt: "Pedras", en: "Stones"}
          - {pt: "Móveis", en: "Furniture"}
          - {pt: "Vidros de janela", en: "Window glass"}
        correctAnswer: {pt: "Seres vivos", en: "Living things"}
        rationale: {pt: "Resposta a estímulos requer células com sistemas sensoriais, presentes apenas em seres vivos.", en: "Response to stimuli requires cells with sensory systems, present only in living things."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes é um ser vivo microscópico?", en: "Which of these is a microscopic living thing?"}
        choices:
          - {pt: "Bactéria", en: "Bacterium"}
          - {pt: "Areia", en: "Sand"}
          - {pt: "Sal", en: "Salt"}
          - {pt: "Fumaça", en: "Smoke"}
        correctAnswer: {pt: "Bactéria", en: "Bacterium"}
        rationale: {pt: "Bactérias são organismos unicelulares vivos com metabolismo e reprodução.", en: "Bacteria are single-celled living organisms with metabolism and reproduction."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Quando um ser vivo morre, ele perde a capacidade de:", en: "When a living thing dies, it loses the ability to:"}
        choices:
          - {pt: "Manter funções metabólicas", en: "Maintain metabolic functions"}
          - {pt: "Ter cor", en: "Have color"}
          - {pt: "Ter tamanho", en: "Have size"}
          - {pt: "Ter peso", en: "Have weight"}
        correctAnswer: {pt: "Manter funções metabólicas", en: "Maintain metabolic functions"}
        rationale: {pt: "A morte é definida pela cessação irreversível das funções metabólicas e celulares.", en: "Death is defined by the irreversible cessation of metabolic and cellular functions."}
        objectives: [biology.life_criteria]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Vivo ou não-vivo — revisão", en: "Living or non-living — review"}
    description: {pt: "Pratique mais exemplos.", en: "Practice more examples."}
    exercises:
      - type: choice
        question: {pt: "Qual destes está vivo?", en: "Which of these is living?"}
        choices:
          - {pt: "Cogumelo", en: "Mushroom"}
          - {pt: "Tijolo", en: "Brick"}
          - {pt: "Vento", en: "Wind"}
          - {pt: "Areia", en: "Sand"}
        correctAnswer: {pt: "Cogumelo", en: "Mushroom"}
        rationale: {pt: "Fungos crescem, reproduzem-se por esporos e absorvem nutrientes — são seres vivos.", en: "Fungi grow, reproduce by spores, and absorb nutrients — they are living organisms."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "O que falta a um carro para ser considerado vivo?", en: "What does a car lack to be considered living?"}
        choices:
          - {pt: "Reprodução e metabolismo", en: "Reproduction and metabolism"}
          - {pt: "Rodas", en: "Wheels"}
          - {pt: "Cor", en: "Color"}
          - {pt: "Velocidade", en: "Speed"}
        correctAnswer: {pt: "Reprodução e metabolismo", en: "Reproduction and metabolism"}
        rationale: {pt: "Carros consomem energia, mas não se reproduzem nem têm metabolismo celular.", en: "Cars use energy but cannot reproduce or carry out cellular metabolism."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Sementes parecem inertes, mas são consideradas:", en: "Seeds seem inert, but are considered:"}
        choices:
          - {pt: "Vivas, em estado dormente", en: "Living, in a dormant state"}
          - {pt: "Não-vivas", en: "Non-living"}
          - {pt: "Minerais", en: "Minerals"}
          - {pt: "Cristais", en: "Crystals"}
        correctAnswer: {pt: "Vivas, em estado dormente", en: "Living, in a dormant state"}
        rationale: {pt: "Sementes contêm células vivas em metabolismo reduzido, capazes de germinar.", en: "Seeds contain living cells in reduced metabolism, able to germinate."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes processos é exclusivo dos seres vivos?", en: "Which of these processes is unique to living things?"}
        choices:
          - {pt: "Reprodução biológica", en: "Biological reproduction"}
          - {pt: "Reflexão da luz", en: "Light reflection"}
          - {pt: "Dilatação por calor", en: "Heat expansion"}
          - {pt: "Erosão pelo vento", en: "Wind erosion"}
        correctAnswer: {pt: "Reprodução biológica", en: "Biological reproduction"}
        rationale: {pt: "Apenas seres vivos geram descendentes através de reprodução celular.", en: "Only living things produce offspring through cellular reproduction."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes precisa de água para sobreviver?", en: "Which of these needs water to survive?"}
        choices:
          - {pt: "Uma planta", en: "A plant"}
          - {pt: "Uma estátua", en: "A statue"}
          - {pt: "Um espelho", en: "A mirror"}
          - {pt: "Uma janela", en: "A window"}
        correctAnswer: {pt: "Uma planta", en: "A plant"}
        rationale: {pt: "Seres vivos precisam de água como solvente das reações metabólicas.", en: "Living things need water as a solvent for metabolic reactions."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "O fogo cresce e consome combustível. Ele está vivo?", en: "Fire grows and consumes fuel. Is it alive?"}
        choices:
          - {pt: "Não — não é feito de células", en: "No — it isn't made of cells"}
          - {pt: "Sim, porque cresce", en: "Yes, because it grows"}
          - {pt: "Sim, porque consome", en: "Yes, because it consumes"}
          - {pt: "Sim, porque se move", en: "Yes, because it moves"}
        correctAnswer: {pt: "Não — não é feito de células", en: "No — it isn't made of cells"}
        rationale: {pt: "A vida exige organização celular; o fogo é uma reação química sem células.", en: "Life requires cellular organization; fire is a chemical reaction without cells."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes é um ser vivo unicelular?", en: "Which of these is a single-celled living thing?"}
        choices:
          - {pt: "Ameba", en: "Amoeba"}
          - {pt: "Cavalo", en: "Horse"}
          - {pt: "Carvalho", en: "Oak tree"}
          - {pt: "Águia", en: "Eagle"}
        correctAnswer: {pt: "Ameba", en: "Amoeba"}
        rationale: {pt: "Amebas são organismos compostos por uma única célula eucariótica.", en: "Amoebas are organisms composed of a single eukaryotic cell."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Qual NÃO é necessário para definir um ser vivo?", en: "Which is NOT needed to define a living thing?"}
        choices:
          - {pt: "Ter pelos", en: "Having fur"}
          - {pt: "Ter células", en: "Having cells"}
          - {pt: "Usar energia", en: "Using energy"}
          - {pt: "Reproduzir-se", en: "Reproducing"}
        correctAnswer: {pt: "Ter pelos", en: "Having fur"}
        rationale: {pt: "Pelos existem só em alguns animais; células, energia e reprodução são universais à vida.", en: "Fur exists only in some animals; cells, energy, and reproduction are universal to life."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Bactérias dentro do nosso corpo:", en: "Bacteria inside our body:"}
        choices:
          - {pt: "São seres vivos com metabolismo próprio", en: "Are living things with their own metabolism"}
          - {pt: "São partes do nosso corpo", en: "Are parts of our body"}
          - {pt: "São minerais", en: "Are minerals"}
          - {pt: "Não existem", en: "Do not exist"}
        correctAnswer: {pt: "São seres vivos com metabolismo próprio", en: "Are living things with their own metabolism"}
        rationale: {pt: "Bactérias são organismos vivos independentes, mesmo quando vivem em hospedeiros.", en: "Bacteria are independent living organisms, even when they live in hosts."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: qual conjunto descreve melhor um ser vivo?", en: "Summary: which set best describes a living thing?"}
        choices:
          - {pt: "Tem células, usa energia, reproduz-se", en: "Has cells, uses energy, reproduces"}
          - {pt: "Tem cor, tamanho, peso", en: "Has color, size, weight"}
          - {pt: "É feito por humanos", en: "Is human-made"}
          - {pt: "Move-se rápido", en: "Moves fast"}
        correctAnswer: {pt: "Tem células, usa energia, reproduz-se", en: "Has cells, uses energy, reproduces"}
        rationale: {pt: "Os três critérios universais da vida são: organização celular, uso de energia e reprodução.", en: "The three universal criteria of life are: cellular organization, energy use, and reproduction."}
        objectives: [biology.life_criteria]
        difficulty: 1
target: 20
