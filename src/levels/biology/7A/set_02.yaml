title:
  pt: "🧬 Características da vida"
  en: "🧬 Characteristics of life"
level: '7A'
subject: biology
objectives: [biology.life_criteria]
difficulty: 1
authorNotes: "Reforço: sete propriedades fundamentais dos seres vivos."
example:
  pt: "Vida = células + metabolismo + crescimento + resposta + reprodução + homeostase + evolução."
  en: "Life = cells + metabolism + growth + response + reproduction + homeostasis + evolution."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Sete propriedades", en: "Seven properties"}
    description: {pt: "Identifique cada propriedade.", en: "Identify each property."}
    exercises:
      - type: choice
        question: {pt: "Manter temperatura interna estável é exemplo de:", en: "Keeping a stable internal temperature is an example of:"}
        choices:
          - {pt: "Homeostase", en: "Homeostasis"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Crescimento", en: "Growth"}
          - {pt: "Evolução", en: "Evolution"}
        correctAnswer: {pt: "Homeostase", en: "Homeostasis"}
        rationale: {pt: "Homeostase é a manutenção de condições internas estáveis frente ao ambiente.", en: "Homeostasis is the maintenance of stable internal conditions despite the environment."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Quebrar alimento para liberar energia é:", en: "Breaking down food to release energy is:"}
        choices:
          - {pt: "Metabolismo", en: "Metabolism"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Resposta", en: "Response"}
          - {pt: "Crescimento", en: "Growth"}
        correctAnswer: {pt: "Metabolismo", en: "Metabolism"}
        rationale: {pt: "Metabolismo é o conjunto de reações químicas que processam matéria e energia na célula.", en: "Metabolism is the set of chemical reactions that process matter and energy in the cell."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Uma planta que se inclina para a luz mostra:", en: "A plant bending toward light shows:"}
        choices:
          - {pt: "Resposta a estímulo", en: "Response to a stimulus"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Homeostase", en: "Homeostasis"}
          - {pt: "Evolução", en: "Evolution"}
        correctAnswer: {pt: "Resposta a estímulo", en: "Response to a stimulus"}
        rationale: {pt: "Fototropismo é a resposta direcional ao estímulo luminoso, mediada por hormônios vegetais.", en: "Phototropism is the directional response to light, mediated by plant hormones."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Um ser vivo aumentar de tamanho com o tempo é:", en: "A living thing increasing in size over time is:"}
        choices:
          - {pt: "Crescimento", en: "Growth"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Metabolismo", en: "Metabolism"}
          - {pt: "Homeostase", en: "Homeostasis"}
        correctAnswer: {pt: "Crescimento", en: "Growth"}
        rationale: {pt: "Crescimento ocorre por divisão celular e síntese de novos componentes.", en: "Growth happens through cell division and synthesis of new components."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Gerar descendentes parecidos com os pais é:", en: "Producing offspring similar to parents is:"}
        choices:
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Crescimento", en: "Growth"}
          - {pt: "Resposta", en: "Response"}
          - {pt: "Metabolismo", en: "Metabolism"}
        correctAnswer: {pt: "Reprodução", en: "Reproduction"}
        rationale: {pt: "Reprodução transmite material genético dos pais aos descendentes.", en: "Reproduction transmits genetic material from parents to offspring."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Mudanças hereditárias em populações ao longo de gerações são:", en: "Heritable changes in populations across generations are:"}
        choices:
          - {pt: "Evolução", en: "Evolution"}
          - {pt: "Homeostase", en: "Homeostasis"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Crescimento", en: "Growth"}
        correctAnswer: {pt: "Evolução", en: "Evolution"}
        rationale: {pt: "Evolução é a mudança nas frequências de características hereditárias entre gerações.", en: "Evolution is the change in frequencies of heritable traits across generations."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Todos os seres vivos são compostos por:", en: "All living things are composed of:"}
        choices:
          - {pt: "Células", en: "Cells"}
          - {pt: "Cristais", en: "Crystals"}
          - {pt: "Fibras de plástico", en: "Plastic fibers"}
          - {pt: "Metal", en: "Metal"}
        correctAnswer: {pt: "Células", en: "Cells"}
        rationale: {pt: "A célula é a unidade estrutural e funcional de todo ser vivo (Teoria Celular).", en: "The cell is the structural and functional unit of every living thing (Cell Theory)."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Suar quando faz calor é exemplo de:", en: "Sweating when it's hot is an example of:"}
        choices:
          - {pt: "Homeostase", en: "Homeostasis"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Crescimento", en: "Growth"}
          - {pt: "Evolução", en: "Evolution"}
        correctAnswer: {pt: "Homeostase", en: "Homeostasis"}
        rationale: {pt: "O suor regula a temperatura corporal, mantendo o equilíbrio interno.", en: "Sweat regulates body temperature, maintaining internal balance."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Uma bactéria se dividindo em duas células filhas mostra:", en: "A bacterium splitting into two daughter cells shows:"}
        choices:
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Resposta", en: "Response"}
          - {pt: "Homeostase", en: "Homeostasis"}
          - {pt: "Crescimento", en: "Growth"}
        correctAnswer: {pt: "Reprodução", en: "Reproduction"}
        rationale: {pt: "A divisão celular bacteriana (fissão binária) é uma forma de reprodução assexuada.", en: "Bacterial cell division (binary fission) is a form of asexual reproduction."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Qual NÃO é uma das sete características fundamentais da vida?", en: "Which is NOT one of the seven fundamental characteristics of life?"}
        choices:
          - {pt: "Cor uniforme", en: "Uniform color"}
          - {pt: "Metabolismo", en: "Metabolism"}
          - {pt: "Resposta a estímulos", en: "Response to stimuli"}
          - {pt: "Reprodução", en: "Reproduction"}
        correctAnswer: {pt: "Cor uniforme", en: "Uniform color"}
        rationale: {pt: "Cor não é critério de vida; metabolismo, resposta e reprodução são.", en: "Color isn't a criterion of life; metabolism, response, and reproduction are."}
        objectives: [biology.life_criteria]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Aplicar as características", en: "Apply the characteristics"}
    description: {pt: "Identifique a propriedade em cada situação.", en: "Identify the property in each situation."}
    exercises:
      - type: choice
        question: {pt: "Um animal que muda de cor para se camuflar mostra:", en: "An animal changing color to camouflage shows:"}
        choices:
          - {pt: "Resposta a estímulo", en: "Response to stimulus"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Crescimento", en: "Growth"}
          - {pt: "Metabolismo", en: "Metabolism"}
        correctAnswer: {pt: "Resposta a estímulo", en: "Response to stimulus"}
        rationale: {pt: "A camuflagem é uma resposta ao ambiente mediada pelo sistema nervoso ou hormonal.", en: "Camouflage is a response to the environment mediated by the nervous or hormonal system."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Um bebê que se torna criança e depois adulto demonstra:", en: "A baby growing into a child and then adult demonstrates:"}
        choices:
          - {pt: "Crescimento e desenvolvimento", en: "Growth and development"}
          - {pt: "Homeostase", en: "Homeostasis"}
          - {pt: "Evolução", en: "Evolution"}
          - {pt: "Resposta", en: "Response"}
        correctAnswer: {pt: "Crescimento e desenvolvimento", en: "Growth and development"}
        rationale: {pt: "Crescimento é aumento de tamanho; desenvolvimento é a maturação das funções biológicas.", en: "Growth is size increase; development is the maturation of biological functions."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Beber água quando sentimos sede é uma resposta para manter:", en: "Drinking water when thirsty is a response to maintain:"}
        choices:
          - {pt: "Homeostase hídrica", en: "Water homeostasis"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Evolução", en: "Evolution"}
          - {pt: "Crescimento", en: "Growth"}
        correctAnswer: {pt: "Homeostase hídrica", en: "Water homeostasis"}
        rationale: {pt: "A sede é um sinal para reequilibrar a água corporal — homeostase.", en: "Thirst is a signal to rebalance body water — homeostasis."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Pássaros migrando no inverno demonstram:", en: "Birds migrating in winter demonstrate:"}
        choices:
          - {pt: "Resposta ao ambiente", en: "Response to the environment"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Homeostase celular", en: "Cellular homeostasis"}
          - {pt: "Crescimento", en: "Growth"}
        correctAnswer: {pt: "Resposta ao ambiente", en: "Response to the environment"}
        rationale: {pt: "A migração é um comportamento em resposta a mudanças sazonais de temperatura e alimento.", en: "Migration is a behavior in response to seasonal changes in temperature and food."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Comer e digerir alimentos envolve qual processo?", en: "Eating and digesting food involves which process?"}
        choices:
          - {pt: "Metabolismo", en: "Metabolism"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Evolução", en: "Evolution"}
          - {pt: "Homeostase", en: "Homeostasis"}
        correctAnswer: {pt: "Metabolismo", en: "Metabolism"}
        rationale: {pt: "Digestão e absorção fazem parte do metabolismo, transformando alimento em energia e blocos.", en: "Digestion and absorption are part of metabolism, turning food into energy and building blocks."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Espécies de peixes que desenvolvem cores brilhantes ao longo de milhões de anos:", en: "Fish species developing bright colors over millions of years:"}
        choices:
          - {pt: "Evolução", en: "Evolution"}
          - {pt: "Crescimento individual", en: "Individual growth"}
          - {pt: "Homeostase", en: "Homeostasis"}
          - {pt: "Metabolismo", en: "Metabolism"}
        correctAnswer: {pt: "Evolução", en: "Evolution"}
        rationale: {pt: "Mudanças hereditárias acumuladas em populações ao longo de gerações é evolução.", en: "Heritable changes accumulating in populations over generations is evolution."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Uma flor que produz pólen para gerar sementes está realizando:", en: "A flower producing pollen to make seeds is performing:"}
        choices:
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Resposta", en: "Response"}
          - {pt: "Crescimento", en: "Growth"}
          - {pt: "Homeostase", en: "Homeostasis"}
        correctAnswer: {pt: "Reprodução", en: "Reproduction"}
        rationale: {pt: "O pólen carrega gametas masculinos para a reprodução sexuada das plantas com flores.", en: "Pollen carries male gametes for sexual reproduction in flowering plants."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Por que homeostase é essencial para os seres vivos?", en: "Why is homeostasis essential for living things?"}
        choices:
          - {pt: "Mantém condições internas para reações químicas funcionarem", en: "Keeps internal conditions for chemical reactions to work"}
          - {pt: "Causa o crescimento", en: "Causes growth"}
          - {pt: "Cria descendentes", en: "Creates offspring"}
          - {pt: "Determina a cor", en: "Determines color"}
        correctAnswer: {pt: "Mantém condições internas para reações químicas funcionarem", en: "Keeps internal conditions for chemical reactions to work"}
        rationale: {pt: "Enzimas e reações celulares só funcionam em faixas estreitas de pH, temperatura, etc.", en: "Enzymes and cellular reactions only work within narrow ranges of pH, temperature, etc."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Sem reprodução, o que aconteceria com uma espécie?", en: "Without reproduction, what would happen to a species?"}
        choices:
          - {pt: "Seria extinta", en: "It would go extinct"}
          - {pt: "Cresceria mais rápido", en: "It would grow faster"}
          - {pt: "Evoluiria mais rápido", en: "It would evolve faster"}
          - {pt: "Ganharia homeostase", en: "It would gain homeostasis"}
        correctAnswer: {pt: "Seria extinta", en: "It would go extinct"}
        rationale: {pt: "Sem novos indivíduos, todos os existentes morreriam e a espécie acabaria.", en: "Without new individuals, all existing ones would die and the species would end."}
        objectives: [biology.life_criteria]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: o que distingue um ser vivo de uma máquina sofisticada?", en: "Summary: what distinguishes a living thing from a sophisticated machine?"}
        choices:
          - {pt: "Reprodução biológica e metabolismo celular", en: "Biological reproduction and cellular metabolism"}
          - {pt: "Movimento", en: "Movement"}
          - {pt: "Tamanho", en: "Size"}
          - {pt: "Cor", en: "Color"}
        correctAnswer: {pt: "Reprodução biológica e metabolismo celular", en: "Biological reproduction and cellular metabolism"}
        rationale: {pt: "Máquinas podem mover-se e usar energia, mas não se reproduzem nem têm metabolismo celular.", en: "Machines can move and use energy, but they don't reproduce or have cellular metabolism."}
        objectives: [biology.life_criteria]
        difficulty: 1
target: 20
