title:
  pt: "🌿 Plantas vs animais"
  en: "🌿 Plants vs animals"
level: '7A'
subject: biology
objectives: [biology.taxonomy]
difficulty: 1
authorNotes: "Diferenças centrais entre Animalia e Plantae."
example:
  pt: "Ex.: planta → fotossíntese (autótrofa) + parede celular; animal → comer (heterótrofo) + sem parede."
  en: "Ex.: plant → photosynthesis (autotroph) + cell wall; animal → eats (heterotroph) + no wall."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Diferenças básicas", en: "Basic differences"}
    description: {pt: "Compare plantas e animais.", en: "Compare plants and animals."}
    exercises:
      - type: choice
        question: {pt: "Como as plantas obtêm energia?", en: "How do plants get energy?"}
        choices:
          - {pt: "Fotossíntese (luz do sol)", en: "Photosynthesis (sunlight)"}
          - {pt: "Comendo outros seres", en: "Eating other organisms"}
          - {pt: "Bebendo apenas água", en: "Drinking only water"}
          - {pt: "Absorvendo metal", en: "Absorbing metal"}
        correctAnswer: {pt: "Fotossíntese (luz do sol)", en: "Photosynthesis (sunlight)"}
        rationale: {pt: "Cloroplastos convertem luz, CO₂ e água em glicose.", en: "Chloroplasts convert light, CO₂, and water into glucose."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Como os animais obtêm energia?", en: "How do animals get energy?"}
        choices:
          - {pt: "Comendo outros organismos", en: "Eating other organisms"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Absorvendo CO₂", en: "Absorbing CO₂"}
          - {pt: "Não precisam de energia", en: "They don't need energy"}
        correctAnswer: {pt: "Comendo outros organismos", en: "Eating other organisms"}
        rationale: {pt: "Animais são heterótrofos: dependem de matéria orgânica produzida por outros.", en: "Animals are heterotrophs: they depend on organic matter produced by others."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual estrutura está presente em células vegetais mas NÃO em animais?", en: "Which structure is in plant cells but NOT in animal cells?"}
        choices:
          - {pt: "Parede celular", en: "Cell wall"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Membrana plasmática", en: "Plasma membrane"}
        correctAnswer: {pt: "Parede celular", en: "Cell wall"}
        rationale: {pt: "A parede de celulose dá rigidez à planta; células animais não têm parede.", en: "The cellulose wall gives plants rigidity; animal cells lack a wall."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual organela permite à planta fazer fotossíntese?", en: "Which organelle lets the plant photosynthesize?"}
        choices:
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Cloroplasto", en: "Chloroplast"}
        rationale: {pt: "Cloroplastos contêm clorofila, pigmento que captura energia luminosa.", en: "Chloroplasts contain chlorophyll, the pigment that captures light energy."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Por que animais geralmente se movem mas plantas não?", en: "Why do animals usually move but plants don't?"}
        choices:
          - {pt: "Animais precisam buscar alimento; plantas produzem o seu", en: "Animals must find food; plants make their own"}
          - {pt: "Plantas não querem se mover", en: "Plants don't want to move"}
          - {pt: "Plantas dormem o tempo todo", en: "Plants sleep all the time"}
          - {pt: "Animais têm rodas", en: "Animals have wheels"}
        correctAnswer: {pt: "Animais precisam buscar alimento; plantas produzem o seu", en: "Animals must find food; plants make their own"}
        rationale: {pt: "Heterotrofia exige mobilidade para encontrar alimento; autotrofia não exige.", en: "Heterotrophy requires mobility to find food; autotrophy does not."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Onde a maior parte da fotossíntese ocorre na planta?", en: "Where does most photosynthesis happen in a plant?"}
        choices:
          - {pt: "Folhas", en: "Leaves"}
          - {pt: "Raízes", en: "Roots"}
          - {pt: "Caule", en: "Stem"}
          - {pt: "Sementes", en: "Seeds"}
        correctAnswer: {pt: "Folhas", en: "Leaves"}
        rationale: {pt: "Folhas concentram cloroplastos e maximizam superfície exposta à luz.", en: "Leaves concentrate chloroplasts and maximize light exposure."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes é um produto da fotossíntese?", en: "Which is a product of photosynthesis?"}
        choices:
          - {pt: "Oxigênio", en: "Oxygen"}
          - {pt: "Nitrogênio", en: "Nitrogen"}
          - {pt: "Plástico", en: "Plastic"}
          - {pt: "Sal", en: "Salt"}
        correctAnswer: {pt: "Oxigênio", en: "Oxygen"}
        rationale: {pt: "A fotossíntese libera O₂ ao quebrar moléculas de água.", en: "Photosynthesis releases O₂ by splitting water molecules."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes seres tem células com cloroplasto?", en: "Which of these has cells with chloroplasts?"}
        choices:
          - {pt: "Trigo", en: "Wheat"}
          - {pt: "Sapo", en: "Frog"}
          - {pt: "Cachorro", en: "Dog"}
          - {pt: "Pomba", en: "Pigeon"}
        correctAnswer: {pt: "Trigo", en: "Wheat"}
        rationale: {pt: "Apenas plantas (e algas) têm cloroplastos.", en: "Only plants (and algae) have chloroplasts."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas e animais respiram?", en: "Do plants and animals respire?"}
        choices:
          - {pt: "Sim, ambos fazem respiração celular", en: "Yes, both perform cellular respiration"}
          - {pt: "Apenas animais", en: "Only animals"}
          - {pt: "Apenas plantas", en: "Only plants"}
          - {pt: "Nenhum dos dois", en: "Neither"}
        correctAnswer: {pt: "Sim, ambos fazem respiração celular", en: "Yes, both perform cellular respiration"}
        rationale: {pt: "Todas as células com mitocôndria fazem respiração para liberar energia.", en: "All cells with mitochondria perform respiration to release energy."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes está presente em ambos, célula animal e vegetal?", en: "Which is in BOTH animal and plant cells?"}
        choices:
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Parede celular", en: "Cell wall"}
          - {pt: "Vacúolo central grande", en: "Large central vacuole"}
        correctAnswer: {pt: "Núcleo", en: "Nucleus"}
        rationale: {pt: "Ambas são eucarióticas e têm núcleo; cloroplasto e parede só na vegetal.", en: "Both are eukaryotic and have a nucleus; chloroplast and wall only in plants."}
        objectives: [biology.taxonomy]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Mais comparações", en: "More comparisons"}
    description: {pt: "Continue praticando.", en: "Keep practicing."}
    exercises:
      - type: choice
        question: {pt: "Plantas usam qual gás para a fotossíntese?", en: "Which gas do plants use for photosynthesis?"}
        choices:
          - {pt: "Dióxido de carbono (CO₂)", en: "Carbon dioxide (CO₂)"}
          - {pt: "Oxigênio", en: "Oxygen"}
          - {pt: "Nitrogênio", en: "Nitrogen"}
          - {pt: "Hélio", en: "Helium"}
        correctAnswer: {pt: "Dióxido de carbono (CO₂)", en: "Carbon dioxide (CO₂)"}
        rationale: {pt: "CO₂ é fixado em moléculas orgânicas durante o ciclo de Calvin.", en: "CO₂ is fixed into organic molecules during the Calvin cycle."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Animais usam qual gás para respirar?", en: "Which gas do animals use to breathe?"}
        choices:
          - {pt: "Oxigênio", en: "Oxygen"}
          - {pt: "Dióxido de carbono", en: "Carbon dioxide"}
          - {pt: "Hidrogênio", en: "Hydrogen"}
          - {pt: "Argônio", en: "Argon"}
        correctAnswer: {pt: "Oxigênio", en: "Oxygen"}
        rationale: {pt: "O₂ é o aceptor final de elétrons na respiração celular aeróbia.", en: "O₂ is the final electron acceptor in aerobic cellular respiration."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas crescem em direção à luz porque:", en: "Plants grow toward light because:"}
        choices:
          - {pt: "Otimizam captação de energia para fotossíntese", en: "It optimizes energy capture for photosynthesis"}
          - {pt: "Gostam de cor", en: "They like color"}
          - {pt: "São animais lentos", en: "They are slow animals"}
          - {pt: "É aleatório", en: "It is random"}
        correctAnswer: {pt: "Otimizam captação de energia para fotossíntese", en: "It optimizes energy capture for photosynthesis"}
        rationale: {pt: "Fototropismo positivo aumenta a luz disponível para os cloroplastos.", en: "Positive phototropism increases light available to chloroplasts."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Por que a parede celular é importante para a planta?", en: "Why is the cell wall important to the plant?"}
        choices:
          - {pt: "Dá estrutura e suporte sem esqueleto", en: "Provides structure and support without a skeleton"}
          - {pt: "Faz fotossíntese", en: "It photosynthesizes"}
          - {pt: "Move a planta", en: "It moves the plant"}
          - {pt: "Produz sementes", en: "It produces seeds"}
        correctAnswer: {pt: "Dá estrutura e suporte sem esqueleto", en: "Provides structure and support without a skeleton"}
        rationale: {pt: "A celulose forma uma parede rígida que sustenta o corpo da planta.", en: "Cellulose forms a rigid wall supporting the plant body."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Animais possuem qual estrutura para suporte do corpo?", en: "Animals have what kind of body support structure?"}
        choices:
          - {pt: "Esqueleto (interno ou externo)", en: "Skeleton (internal or external)"}
          - {pt: "Parede celular", en: "Cell wall"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Raízes", en: "Roots"}
        correctAnswer: {pt: "Esqueleto (interno ou externo)", en: "Skeleton (internal or external)"}
        rationale: {pt: "Animais usam esqueletos (ossos ou exoesqueleto) em vez de paredes celulares.", en: "Animals use skeletons (bones or exoskeleton) instead of cell walls."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas têm sistema nervoso?", en: "Do plants have a nervous system?"}
        choices:
          - {pt: "Não — respondem por hormônios e sinais químicos", en: "No — they respond via hormones and chemical signals"}
          - {pt: "Sim, igual a animais", en: "Yes, just like animals"}
          - {pt: "Sim, com cérebro", en: "Yes, with a brain"}
          - {pt: "Sim, com nervos", en: "Yes, with nerves"}
        correctAnswer: {pt: "Não — respondem por hormônios e sinais químicos", en: "No — they respond via hormones and chemical signals"}
        rationale: {pt: "Plantas usam hormônios (auxinas, etileno) e sinais elétricos lentos, não neurônios.", en: "Plants use hormones (auxins, ethylene) and slow electrical signals, not neurons."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes processos é EXCLUSIVO de plantas (e algas)?", en: "Which process is UNIQUE to plants (and algae)?"}
        choices:
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Respiração celular", en: "Cellular respiration"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Crescimento", en: "Growth"}
        correctAnswer: {pt: "Fotossíntese", en: "Photosynthesis"}
        rationale: {pt: "Apenas organismos com clorofila convertem luz em alimento.", en: "Only chlorophyll-bearing organisms convert light into food."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "A energia que sustenta quase toda cadeia alimentar vem originalmente do(a):", en: "The energy that supports nearly every food chain originally comes from:"}
        choices:
          - {pt: "Sol", en: "Sun"}
          - {pt: "Solo", en: "Soil"}
          - {pt: "Lua", en: "Moon"}
          - {pt: "Petróleo", en: "Oil"}
        correctAnswer: {pt: "Sol", en: "Sun"}
        rationale: {pt: "Plantas captam energia solar e a transferem aos consumidores.", en: "Plants capture solar energy and pass it on to consumers."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes é um produtor primário em um ecossistema?", en: "Which is a primary producer in an ecosystem?"}
        choices:
          - {pt: "Capim", en: "Grass"}
          - {pt: "Vaca", en: "Cow"}
          - {pt: "Leão", en: "Lion"}
          - {pt: "Águia", en: "Eagle"}
        correctAnswer: {pt: "Capim", en: "Grass"}
        rationale: {pt: "Produtores são organismos autótrofos como plantas, que iniciam a cadeia alimentar.", en: "Producers are autotrophs like plants that start the food chain."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: principal diferença entre plantas e animais é:", en: "Summary: the main difference between plants and animals is:"}
        choices:
          - {pt: "Plantas produzem alimento; animais consomem", en: "Plants produce food; animals consume"}
          - {pt: "Plantas são maiores que animais", en: "Plants are bigger than animals"}
          - {pt: "Animais não respiram", en: "Animals do not breathe"}
          - {pt: "Plantas são procariontes", en: "Plants are prokaryotes"}
        correctAnswer: {pt: "Plantas produzem alimento; animais consomem", en: "Plants produce food; animals consume"}
        rationale: {pt: "Autotrofia vs heterotrofia é a distinção central entre os dois reinos.", en: "Autotrophy vs heterotrophy is the central distinction between the two kingdoms."}
        objectives: [biology.taxonomy]
        difficulty: 1
target: 20
