title:
  pt: "🌱 Partes da célula vegetal"
  en: "🌱 Parts of the plant cell"
level: '7A'
subject: biology
objectives: [biology.organelles]
difficulty: 1
authorNotes: "Organelas exclusivas e compartilhadas em células vegetais."
example:
  pt: "Ex.: célula vegetal = animal + parede celular (celulose) + cloroplasto (fotossíntese) + grande vacúolo (água)."
  en: "Ex.: plant cell = animal + cell wall (cellulose) + chloroplast (photosynthesis) + large vacuole (water)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Estruturas vegetais", en: "Plant structures"}
    description: {pt: "Identifique as exclusivas.", en: "Identify the unique ones."}
    exercises:
      - type: choice
        question: {pt: "Qual organela faz fotossíntese?", en: "Which organelle does photosynthesis?"}
        choices:
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Cloroplasto", en: "Chloroplast"}
        rationale: {pt: "Cloroplastos contêm clorofila e fazem fotossíntese.", en: "Chloroplasts contain chlorophyll and perform photosynthesis."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O que dá rigidez à célula vegetal?", en: "What gives rigidity to the plant cell?"}
        choices:
          - {pt: "Parede celular", en: "Cell wall"}
          - {pt: "Membrana plasmática", en: "Plasma membrane"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
        correctAnswer: {pt: "Parede celular", en: "Cell wall"}
        rationale: {pt: "A parede de celulose envolve a membrana e dá forma rígida à célula.", en: "The cellulose wall surrounds the membrane and gives the cell rigid shape."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Do que é feita a parede celular vegetal?", en: "What is the plant cell wall made of?"}
        choices:
          - {pt: "Celulose", en: "Cellulose"}
          - {pt: "Quitina", en: "Chitin"}
          - {pt: "Peptidoglicano", en: "Peptidoglycan"}
          - {pt: "Plástico", en: "Plastic"}
        correctAnswer: {pt: "Celulose", en: "Cellulose"}
        rationale: {pt: "Celulose é um polissacarídeo formado por moléculas de glicose ligadas.", en: "Cellulose is a polysaccharide of linked glucose molecules."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Onde a planta armazena água em uma célula?", en: "Where does the plant store water in a cell?"}
        choices:
          - {pt: "Vacúolo central", en: "Central vacuole"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Vacúolo central", en: "Central vacuole"}
        rationale: {pt: "O grande vacúolo central armazena água e mantém a turgência celular.", en: "The large central vacuole stores water and maintains cell turgor."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes EXISTE em vegetal mas NÃO em animal?", en: "Which exists in plants but NOT in animals?"}
        choices:
          - {pt: "Cloroplasto e parede celular", en: "Chloroplast and cell wall"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Cloroplasto e parede celular", en: "Chloroplast and cell wall"}
        rationale: {pt: "Cloroplasto e parede celular são marcas de células vegetais.", en: "Chloroplasts and cell walls are hallmarks of plant cells."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual pigmento dá a cor verde às plantas?", en: "Which pigment gives plants their green color?"}
        choices:
          - {pt: "Clorofila", en: "Chlorophyll"}
          - {pt: "Hemoglobina", en: "Hemoglobin"}
          - {pt: "Melanina", en: "Melanin"}
          - {pt: "Carotina", en: "Carotene"}
        correctAnswer: {pt: "Clorofila", en: "Chlorophyll"}
        rationale: {pt: "Clorofila absorve luz vermelha e azul, refletindo verde.", en: "Chlorophyll absorbs red and blue light, reflecting green."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas precisam de mitocôndrias?", en: "Do plants need mitochondria?"}
        choices:
          - {pt: "Sim, para respiração celular", en: "Yes, for cellular respiration"}
          - {pt: "Não, fotossíntese substitui tudo", en: "No, photosynthesis replaces it"}
          - {pt: "Apenas raízes precisam", en: "Only roots need them"}
          - {pt: "Apenas folhas precisam", en: "Only leaves need them"}
        correctAnswer: {pt: "Sim, para respiração celular", en: "Yes, for cellular respiration"}
        rationale: {pt: "Plantas também respiram para usar o ATP, especialmente em órgãos sem cloroplasto.", en: "Plants also respire to use ATP, especially in non-photosynthetic organs."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A turgidez (firmeza) da planta vem do:", en: "Plant turgor (firmness) comes from:"}
        choices:
          - {pt: "Vacúolo cheio de água pressionando a parede", en: "Water-filled vacuole pressing on the wall"}
          - {pt: "Mitocôndrias", en: "Mitochondria"}
          - {pt: "Ribossomos", en: "Ribosomes"}
          - {pt: "Núcleo", en: "Nucleus"}
        correctAnswer: {pt: "Vacúolo cheio de água pressionando a parede", en: "Water-filled vacuole pressing on the wall"}
        rationale: {pt: "Pressão de turgor sustenta caules e folhas; sem ela, a planta murcha.", en: "Turgor pressure supports stems and leaves; without it, the plant wilts."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Cloroplastos são encontrados principalmente em:", en: "Chloroplasts are mainly found in:"}
        choices:
          - {pt: "Folhas", en: "Leaves"}
          - {pt: "Raízes", en: "Roots"}
          - {pt: "Sementes secas", en: "Dry seeds"}
          - {pt: "Madeira", en: "Wood"}
        correctAnswer: {pt: "Folhas", en: "Leaves"}
        rationale: {pt: "Folhas são órgãos especializados em capturar luz; concentram cloroplastos.", en: "Leaves are organs specialized for light capture; they concentrate chloroplasts."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Plasmodesmos são:", en: "Plasmodesmata are:"}
        choices:
          - {pt: "Canais entre células vegetais", en: "Channels between plant cells"}
          - {pt: "Pigmentos verdes", en: "Green pigments"}
          - {pt: "Esqueletos celulares", en: "Cell skeletons"}
          - {pt: "Tipos de fungos", en: "Types of fungi"}
        correctAnswer: {pt: "Canais entre células vegetais", en: "Channels between plant cells"}
        rationale: {pt: "Plasmodesmos conectam citoplasmas adjacentes para troca de moléculas.", en: "Plasmodesmata connect adjacent cytoplasms for molecule exchange."}
        objectives: [biology.organelles]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Comparações finais", en: "Final comparisons"}
    description: {pt: "Pratique mais.", en: "Practice more."}
    exercises:
      - type: choice
        question: {pt: "Qual estrutura é COMUM a célula animal e vegetal?", en: "Which structure is COMMON to animal and plant cells?"}
        choices:
          - {pt: "Membrana plasmática", en: "Plasma membrane"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Parede celular", en: "Cell wall"}
          - {pt: "Vacúolo central grande", en: "Large central vacuole"}
        correctAnswer: {pt: "Membrana plasmática", en: "Plasma membrane"}
        rationale: {pt: "Toda célula tem membrana; cloroplasto, parede e grande vacúolo só em vegetais.", en: "Every cell has a membrane; chloroplast, wall, and large vacuole only in plants."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O que ocorre dentro do cloroplasto?", en: "What happens inside the chloroplast?"}
        choices:
          - {pt: "Conversão de luz em glicose", en: "Conversion of light into glucose"}
          - {pt: "Digestão de resíduos", en: "Waste digestion"}
          - {pt: "Síntese de DNA", en: "DNA synthesis"}
          - {pt: "Movimento celular", en: "Cell movement"}
        correctAnswer: {pt: "Conversão de luz em glicose", en: "Conversion of light into glucose"}
        rationale: {pt: "Fotossíntese transforma energia luminosa em energia química nas moléculas de glicose.", en: "Photosynthesis turns light energy into chemical energy in glucose molecules."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Por que sementes secas não fazem fotossíntese?", en: "Why don't dry seeds photosynthesize?"}
        choices:
          - {pt: "Estão dormentes e têm cloroplastos inativos", en: "They are dormant and have inactive chloroplasts"}
          - {pt: "Não têm DNA", en: "They have no DNA"}
          - {pt: "São mortos", en: "They are dead"}
          - {pt: "São animais", en: "They are animals"}
        correctAnswer: {pt: "Estão dormentes e têm cloroplastos inativos", en: "They are dormant and have inactive chloroplasts"}
        rationale: {pt: "Sementes em dormência têm metabolismo reduzido até a germinação.", en: "Dormant seeds have reduced metabolism until germination."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Cloroplastos têm DNA próprio?", en: "Do chloroplasts have their own DNA?"}
        choices:
          - {pt: "Sim — vestígio do ancestral bacteriano", en: "Yes — a trace of their bacterial ancestor"}
          - {pt: "Não", en: "No"}
          - {pt: "Apenas RNA", en: "Only RNA"}
          - {pt: "Apenas proteínas", en: "Only proteins"}
        correctAnswer: {pt: "Sim — vestígio do ancestral bacteriano", en: "Yes — a trace of their bacterial ancestor"}
        rationale: {pt: "A teoria endossimbiótica explica DNA próprio em mitocôndrias e cloroplastos.", en: "Endosymbiotic theory explains the own DNA in mitochondria and chloroplasts."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quando uma planta murcha, é porque:", en: "When a plant wilts, it's because:"}
        choices:
          - {pt: "Vacúolos perderam água, baixou turgor", en: "Vacuoles lost water, turgor dropped"}
          - {pt: "Núcleos sumiram", en: "Nuclei disappeared"}
          - {pt: "Mitocôndrias morreram", en: "Mitochondria died"}
          - {pt: "Cloroplastos exploderam", en: "Chloroplasts exploded"}
        correctAnswer: {pt: "Vacúolos perderam água, baixou turgor", en: "Vacuoles lost water, turgor dropped"}
        rationale: {pt: "Quando falta água, a pressão de turgor cai porque o vacúolo encolhe — então a planta perde firmeza.", en: "When water is missing, turgor pressure drops because the vacuole shrinks — so the plant loses firmness."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A parede celular permite à planta:", en: "The cell wall lets the plant:"}
        choices:
          - {pt: "Sustentar-se sem esqueleto", en: "Stand without a skeleton"}
          - {pt: "Mover-se rápido", en: "Move fast"}
          - {pt: "Comer outros seres", en: "Eat other beings"}
          - {pt: "Voar", en: "Fly"}
        correctAnswer: {pt: "Sustentar-se sem esqueleto", en: "Stand without a skeleton"}
        rationale: {pt: "Paredes rígidas substituem o esqueleto, sustentando o corpo da planta.", en: "Rigid walls replace skeletons, supporting the plant body."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes ajuda na divisão da célula vegetal sem centríolos?", en: "Which helps plant cell division without centrioles?"}
        choices:
          - {pt: "Microtúbulos do citoesqueleto", en: "Microtubules of the cytoskeleton"}
          - {pt: "Ribossomos", en: "Ribosomes"}
          - {pt: "Lisossomos", en: "Lysosomes"}
          - {pt: "Vacúolos", en: "Vacuoles"}
        correctAnswer: {pt: "Microtúbulos do citoesqueleto", en: "Microtubules of the cytoskeleton"}
        rationale: {pt: "Plantas montam o fuso mitótico a partir de microtúbulos sem centríolos.", en: "Plants assemble the mitotic spindle from microtubules without centrioles."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual das seguintes lista organelas EXCLUSIVAS de vegetais?", en: "Which list shows organelles UNIQUE to plants?"}
        choices:
          - {pt: "Cloroplasto, parede celular, vacúolo central", en: "Chloroplast, cell wall, central vacuole"}
          - {pt: "Mitocôndria, núcleo, ribossomo", en: "Mitochondrion, nucleus, ribosome"}
          - {pt: "Lisossomo, Golgi, RER", en: "Lysosome, Golgi, RER"}
          - {pt: "Membrana, citoplasma, citoesqueleto", en: "Membrane, cytoplasm, cytoskeleton"}
        correctAnswer: {pt: "Cloroplasto, parede celular, vacúolo central", en: "Chloroplast, cell wall, central vacuole"}
        rationale: {pt: "As três estruturas só ocorrem em células vegetais.", en: "These three structures occur only in plant cells."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Onde fica a maior parte do volume em uma célula vegetal madura?", en: "Where is most of the volume in a mature plant cell?"}
        choices:
          - {pt: "Vacúolo central", en: "Central vacuole"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Vacúolo central", en: "Central vacuole"}
        rationale: {pt: "O vacúolo central pode ocupar até 90% do volume celular.", en: "The central vacuole may take up to 90% of cell volume."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: célula vegetal = célula animal + ?", en: "Summary: plant cell = animal cell + ?"}
        choices:
          - {pt: "Cloroplasto, parede celular e grande vacúolo", en: "Chloroplast, cell wall, and large vacuole"}
          - {pt: "Lisossomo extra", en: "Extra lysosome"}
          - {pt: "Centríolo", en: "Centriole"}
          - {pt: "Núcleo extra", en: "Extra nucleus"}
        correctAnswer: {pt: "Cloroplasto, parede celular e grande vacúolo", en: "Chloroplast, cell wall, and large vacuole"}
        rationale: {pt: "Adicionando essas três estruturas, a célula passa a operar como vegetal.", en: "Adding these three structures, the cell operates as a plant cell."}
        objectives: [biology.organelles]
        difficulty: 1
target: 20
