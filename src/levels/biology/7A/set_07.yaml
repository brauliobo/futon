title:
  pt: "🐾 Partes da célula animal"
  en: "🐾 Parts of the animal cell"
level: '7A'
subject: biology
objectives: [biology.organelles]
difficulty: 1
authorNotes: "Identificar organelas em uma célula animal típica."
example:
  pt: "Ex.: núcleo → guarda DNA; mitocôndria → ATP; ribossomo → proteínas; lisossomo → digestão. Sem parede e sem cloroplasto."
  en: "Ex.: nucleus → stores DNA; mitochondrion → ATP; ribosome → proteins; lysosome → digestion. No wall, no chloroplast."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Nomes das organelas", en: "Organelle names"}
    description: {pt: "Reconheça cada parte.", en: "Recognize each part."}
    exercises:
      - type: choice
        question: {pt: "Qual organela controla a célula e contém o DNA?", en: "Which organelle controls the cell and contains DNA?"}
        choices:
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Ribossomo", en: "Ribosome"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Núcleo", en: "Nucleus"}
        rationale: {pt: "O núcleo armazena o DNA e regula a expressão gênica.", en: "The nucleus stores DNA and regulates gene expression."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual organela produz energia (ATP)?", en: "Which organelle produces energy (ATP)?"}
        choices:
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Mitocôndria", en: "Mitochondrion"}
        rationale: {pt: "Mitocôndrias liberam energia da glicose pela respiração celular.", en: "Mitochondria release energy from glucose via cellular respiration."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual organela sintetiza proteínas?", en: "Which organelle synthesizes proteins?"}
        choices:
          - {pt: "Ribossomo", en: "Ribosome"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Ribossomo", en: "Ribosome"}
        rationale: {pt: "Ribossomos traduzem o RNA mensageiro em proteínas.", en: "Ribosomes translate messenger RNA into proteins."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual organela digere resíduos celulares?", en: "Which organelle digests cellular waste?"}
        choices:
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Lisossomo", en: "Lysosome"}
        rationale: {pt: "Lisossomos contêm enzimas que quebram material velho ou estranho.", en: "Lysosomes contain enzymes that break down old or foreign material."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual estrutura envolve toda a célula animal?", en: "Which structure surrounds the entire animal cell?"}
        choices:
          - {pt: "Membrana plasmática", en: "Plasma membrane"}
          - {pt: "Parede celular", en: "Cell wall"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Núcleo", en: "Nucleus"}
        correctAnswer: {pt: "Membrana plasmática", en: "Plasma membrane"}
        rationale: {pt: "Animais não têm parede celular — só a membrana plasmática delimita a célula.", en: "Animals lack a cell wall — only the plasma membrane bounds the cell."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O retículo endoplasmático rugoso tem ribossomos para:", en: "The rough endoplasmic reticulum has ribosomes to:"}
        choices:
          - {pt: "Produzir e processar proteínas", en: "Produce and process proteins"}
          - {pt: "Armazenar água", en: "Store water"}
          - {pt: "Quebrar resíduos", en: "Break down waste"}
          - {pt: "Produzir energia", en: "Produce energy"}
        correctAnswer: {pt: "Produzir e processar proteínas", en: "Produce and process proteins"}
        rationale: {pt: "O RER sintetiza proteínas que serão exportadas ou inseridas em membranas.", en: "Rough ER synthesizes proteins for export or membrane insertion."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O complexo de Golgi serve para:", en: "The Golgi complex serves to:"}
        choices:
          - {pt: "Empacotar e enviar moléculas", en: "Package and ship molecules"}
          - {pt: "Produzir energia", en: "Produce energy"}
          - {pt: "Armazenar DNA", en: "Store DNA"}
          - {pt: "Fazer fotossíntese", en: "Photosynthesize"}
        correctAnswer: {pt: "Empacotar e enviar moléculas", en: "Package and ship molecules"}
        rationale: {pt: "O Golgi modifica, classifica e envia proteínas e lipídios.", en: "Golgi modifies, sorts, and ships proteins and lipids."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O citoplasma é:", en: "The cytoplasm is:"}
        choices:
          - {pt: "O fluido onde organelas estão suspensas", en: "The fluid where organelles are suspended"}
          - {pt: "A parede da célula", en: "The cell wall"}
          - {pt: "O DNA", en: "The DNA"}
          - {pt: "A membrana", en: "The membrane"}
        correctAnswer: {pt: "O fluido onde organelas estão suspensas", en: "The fluid where organelles are suspended"}
        rationale: {pt: "Citoplasma é o gel intracelular que sustenta e movimenta as organelas.", en: "Cytoplasm is the intracellular gel that holds and moves organelles."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes NÃO existe em célula animal?", en: "Which of these is NOT in an animal cell?"}
        choices:
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Cloroplasto", en: "Chloroplast"}
        rationale: {pt: "Cloroplastos só existem em células de plantas e algas.", en: "Chloroplasts only exist in plant and algae cells."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Centríolos em células animais ajudam principalmente em:", en: "Centrioles in animal cells help mainly with:"}
        choices:
          - {pt: "Divisão celular", en: "Cell division"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Digestão", en: "Digestion"}
          - {pt: "Respiração", en: "Respiration"}
        correctAnswer: {pt: "Divisão celular", en: "Cell division"}
        rationale: {pt: "Centríolos organizam o fuso mitótico durante a divisão celular.", en: "Centrioles organize the mitotic spindle during cell division."}
        objectives: [biology.organelles]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Funções principais", en: "Main functions"}
    description: {pt: "Liguem cada organela à sua função.", en: "Match each organelle to its function."}
    exercises:
      - type: choice
        question: {pt: "\"Casa de força\" da célula é apelido de:", en: "The \"powerhouse\" of the cell is the nickname for:"}
        choices:
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Ribossomo", en: "Ribosome"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Mitocôndria", en: "Mitochondrion"}
        rationale: {pt: "Mitocôndria gera a maior parte do ATP que alimenta a célula.", en: "Mitochondria produce most of the ATP that fuels the cell."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Centro de comando da célula é:", en: "The control center of the cell is:"}
        choices:
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Ribossomo", en: "Ribosome"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Núcleo", en: "Nucleus"}
        rationale: {pt: "Genes no núcleo determinam quais proteínas são produzidas — controlam a célula.", en: "Genes in the nucleus determine which proteins are made — controlling the cell."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "\"Estômago\" celular que digere coisas:", en: "The cell's \"stomach\" that digests things:"}
        choices:
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Lisossomo", en: "Lysosome"}
        rationale: {pt: "Enzimas hidrolíticas dentro do lisossomo digerem moléculas e detritos.", en: "Hydrolytic enzymes inside the lysosome digest molecules and debris."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Onde mRNA é traduzido em proteína?", en: "Where is mRNA translated into protein?"}
        choices:
          - {pt: "Ribossomo", en: "Ribosome"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Golgi", en: "Golgi"}
        correctAnswer: {pt: "Ribossomo", en: "Ribosome"}
        rationale: {pt: "Ribossomos lêem códons do mRNA e montam a cadeia polipeptídica.", en: "Ribosomes read mRNA codons and assemble the polypeptide chain."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem decide o que entra e sai da célula?", en: "Who decides what enters and leaves the cell?"}
        choices:
          - {pt: "Membrana plasmática", en: "Plasma membrane"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Membrana plasmática", en: "Plasma membrane"}
        rationale: {pt: "A membrana é seletivamente permeável — controla o transporte celular.", en: "The membrane is selectively permeable — it controls cellular transport."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem modifica e exporta proteínas?", en: "Who modifies and exports proteins?"}
        choices:
          - {pt: "Complexo de Golgi", en: "Golgi complex"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
        correctAnswer: {pt: "Complexo de Golgi", en: "Golgi complex"}
        rationale: {pt: "Golgi recebe vesículas do RER, modifica e endereça as proteínas.", en: "Golgi receives vesicles from rough ER, modifies, and addresses proteins."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Vesículas servem para:", en: "Vesicles serve to:"}
        choices:
          - {pt: "Transportar moléculas dentro da célula", en: "Transport molecules within the cell"}
          - {pt: "Produzir energia", en: "Produce energy"}
          - {pt: "Armazenar DNA", en: "Store DNA"}
          - {pt: "Fazer fotossíntese", en: "Photosynthesize"}
        correctAnswer: {pt: "Transportar moléculas dentro da célula", en: "Transport molecules within the cell"}
        rationale: {pt: "Vesículas são pequenas bolsas que carregam substâncias entre organelas.", en: "Vesicles are small sacs that carry substances between organelles."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O nucléolo dentro do núcleo serve para:", en: "The nucleolus inside the nucleus serves to:"}
        choices:
          - {pt: "Produzir ribossomos", en: "Produce ribosomes"}
          - {pt: "Digerir resíduos", en: "Digest waste"}
          - {pt: "Gerar energia", en: "Generate energy"}
          - {pt: "Empacotar proteínas", en: "Package proteins"}
        correctAnswer: {pt: "Produzir ribossomos", en: "Produce ribosomes"}
        rationale: {pt: "Primeiro o nucléolo transcreve rRNA, então monta as subunidades ribossomais — basta exportá-las ao citoplasma para formar ribossomos.", en: "First the nucleolus transcribes rRNA, then assembles ribosomal subunits — they just need to be exported to the cytoplasm to form ribosomes."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Citoesqueleto serve para:", en: "The cytoskeleton serves to:"}
        choices:
          - {pt: "Manter forma e movimentar a célula", en: "Maintain shape and move the cell"}
          - {pt: "Produzir proteínas", en: "Make proteins"}
          - {pt: "Armazenar DNA", en: "Store DNA"}
          - {pt: "Digerir alimentos", en: "Digest food"}
        correctAnswer: {pt: "Manter forma e movimentar a célula", en: "Maintain shape and move the cell"}
        rationale: {pt: "Filamentos proteicos dão suporte estrutural e permitem movimento celular.", en: "Protein filaments provide structural support and allow cell movement."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: o que TODAS as organelas têm em comum?", en: "Summary: what do ALL organelles have in common?"}
        choices:
          - {pt: "Realizam funções específicas dentro da célula", en: "Carry out specific functions within the cell"}
          - {pt: "Têm cor", en: "Have color"}
          - {pt: "Estão fora da célula", en: "Are outside the cell"}
          - {pt: "São feitas de plástico", en: "Are made of plastic"}
        correctAnswer: {pt: "Realizam funções específicas dentro da célula", en: "Carry out specific functions within the cell"}
        rationale: {pt: "Cada organela tem papel especializado, formando o \"sistema\" celular.", en: "Each organelle has a specialized role, forming the cellular \"system\"."}
        objectives: [biology.organelles]
        difficulty: 1
target: 20
