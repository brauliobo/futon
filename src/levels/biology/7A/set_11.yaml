title:
  pt: "🌿 Cloroplasto — função"
  en: "🌿 Chloroplast — function"
level: '7A'
subject: biology
objectives: [biology.organelles]
difficulty: 1
authorNotes: "Cloroplasto: realiza fotossíntese, transforma luz em alimento."
example:
  pt: "Cloroplasto: 6 CO₂ + 6 H₂O + luz → C₆H₁₂O₆ + 6 O₂."
  en: "Chloroplast: 6 CO₂ + 6 H₂O + light → C₆H₁₂O₆ + 6 O₂."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Função", en: "Function"}
    description: {pt: "Como cloroplastos trabalham.", en: "How chloroplasts work."}
    exercises:
      - type: choice
        question: {pt: "Qual é a função principal do cloroplasto?", en: "What is the chloroplast's main function?"}
        choices:
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Respiração", en: "Respiration"}
          - {pt: "Digestão", en: "Digestion"}
          - {pt: "Síntese de DNA", en: "DNA synthesis"}
        correctAnswer: {pt: "Fotossíntese", en: "Photosynthesis"}
        rationale: {pt: "Cloroplastos convertem luz, água e CO₂ em glicose e O₂.", en: "Chloroplasts convert light, water, and CO₂ into glucose and O₂."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Em quais células há cloroplastos?", en: "Which cells contain chloroplasts?"}
        choices:
          - {pt: "Vegetais e algas", en: "Plant and algae cells"}
          - {pt: "Animais", en: "Animal cells"}
          - {pt: "Fungos", en: "Fungi"}
          - {pt: "Bactérias", en: "Bacteria"}
        correctAnswer: {pt: "Vegetais e algas", en: "Plant and algae cells"}
        rationale: {pt: "Apenas eucariontes fotossintéticos têm cloroplastos.", en: "Only photosynthetic eukaryotes have chloroplasts."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual pigmento captura a luz no cloroplasto?", en: "Which pigment captures light in the chloroplast?"}
        choices:
          - {pt: "Clorofila", en: "Chlorophyll"}
          - {pt: "Hemoglobina", en: "Hemoglobin"}
          - {pt: "Melanina", en: "Melanin"}
          - {pt: "Insulina", en: "Insulin"}
        correctAnswer: {pt: "Clorofila", en: "Chlorophyll"}
        rationale: {pt: "Clorofila absorve luz solar para iniciar a fotossíntese.", en: "Chlorophyll absorbs sunlight to start photosynthesis."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Tilacoides são:", en: "Thylakoids are:"}
        choices:
          - {pt: "Sacos membranosos onde ocorre captura de luz", en: "Membrane sacs where light capture happens"}
          - {pt: "Núcleos pequenos", en: "Small nuclei"}
          - {pt: "Mitocôndrias", en: "Mitochondria"}
          - {pt: "Vacúolos", en: "Vacuoles"}
        correctAnswer: {pt: "Sacos membranosos onde ocorre captura de luz", en: "Membrane sacs where light capture happens"}
        rationale: {pt: "Tilacoides empilham-se em granas; abrigam clorofila e cadeia de transporte de elétrons.", en: "Thylakoids stack into grana; they hold chlorophyll and the electron transport chain."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual é o produto que serve de \"alimento\" da fotossíntese?", en: "Which product serves as photosynthesis's \"food\"?"}
        choices:
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Sal", en: "Salt"}
          - {pt: "Água pura", en: "Pure water"}
          - {pt: "DNA", en: "DNA"}
        correctAnswer: {pt: "Glicose", en: "Glucose"}
        rationale: {pt: "A glicose armazena a energia capturada da luz em ligações químicas.", en: "Glucose stores the energy captured from light in chemical bonds."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Qual gás é LIBERADO pela fotossíntese?", en: "Which gas is RELEASED by photosynthesis?"}
        choices:
          - {pt: "Oxigênio", en: "Oxygen"}
          - {pt: "CO₂", en: "CO₂"}
          - {pt: "Nitrogênio", en: "Nitrogen"}
          - {pt: "Hidrogênio", en: "Hydrogen"}
        correctAnswer: {pt: "Oxigênio", en: "Oxygen"}
        rationale: {pt: "O₂ é liberado quando a água é quebrada (fotólise).", en: "O₂ is released when water is split (photolysis)."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Cloroplastos têm DNA próprio?", en: "Do chloroplasts have their own DNA?"}
        choices:
          - {pt: "Sim — origem endossimbiótica", en: "Yes — endosymbiotic origin"}
          - {pt: "Não", en: "No"}
          - {pt: "Apenas em folhas velhas", en: "Only in old leaves"}
          - {pt: "Apenas em raízes", en: "Only in roots"}
        correctAnswer: {pt: "Sim — origem endossimbiótica", en: "Yes — endosymbiotic origin"}
        rationale: {pt: "Cloroplastos descendem de cianobactérias engolidas por células ancestrais.", en: "Chloroplasts descend from cyanobacteria engulfed by ancestral cells."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Por que folhas são geralmente verdes?", en: "Why are leaves usually green?"}
        choices:
          - {pt: "Clorofila reflete a luz verde", en: "Chlorophyll reflects green light"}
          - {pt: "Plantas comem cor verde", en: "Plants eat green color"}
          - {pt: "Solo verde", en: "Green soil"}
          - {pt: "Água verde", en: "Green water"}
        correctAnswer: {pt: "Clorofila reflete a luz verde", en: "Chlorophyll reflects green light"}
        rationale: {pt: "A clorofila absorve melhor azul e vermelho, refletindo verde aos olhos.", en: "Chlorophyll best absorbs blue and red, reflecting green to our eyes."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quantas membranas o cloroplasto tem?", en: "How many membranes does the chloroplast have?"}
        choices:
          - {pt: "Duas (mais sistema interno de tilacoides)", en: "Two (plus internal thylakoid system)"}
          - {pt: "Uma", en: "One"}
          - {pt: "Cinco", en: "Five"}
          - {pt: "Nenhuma", en: "None"}
        correctAnswer: {pt: "Duas (mais sistema interno de tilacoides)", en: "Two (plus internal thylakoid system)"}
        rationale: {pt: "Membrana externa, interna e tilacoides — tudo coerente com origem bacteriana.", en: "Outer, inner, and thylakoid membranes — consistent with bacterial origin."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Em quais órgãos da planta há mais cloroplastos?", en: "Which plant organs have the most chloroplasts?"}
        choices:
          - {pt: "Folhas verdes", en: "Green leaves"}
          - {pt: "Raízes subterrâneas", en: "Underground roots"}
          - {pt: "Madeira do tronco", en: "Trunk wood"}
          - {pt: "Sementes secas", en: "Dry seeds"}
        correctAnswer: {pt: "Folhas verdes", en: "Green leaves"}
        rationale: {pt: "Folhas captam luz e abrigam mais cloroplastos por célula.", en: "Leaves capture light and host more chloroplasts per cell."}
        objectives: [biology.organelles]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Reação geral", en: "Overall reaction"}
    description: {pt: "Equação simples da fotossíntese.", en: "Simple equation of photosynthesis."}
    exercises:
      - type: choice
        question: {pt: "Reação geral da fotossíntese:", en: "Overall photosynthesis reaction:"}
        choices:
          - {pt: "CO₂ + H₂O + luz → glicose + O₂", en: "CO₂ + H₂O + light → glucose + O₂"}
          - {pt: "Glicose + O₂ → CO₂ + H₂O", en: "Glucose + O₂ → CO₂ + H₂O"}
          - {pt: "DNA → proteína", en: "DNA → protein"}
          - {pt: "Sal + água → solução", en: "Salt + water → solution"}
        correctAnswer: {pt: "CO₂ + H₂O + luz → glicose + O₂", en: "CO₂ + H₂O + light → glucose + O₂"}
        rationale: {pt: "Energia luminosa é fixada em ligações químicas da glicose.", en: "Light energy is fixed into chemical bonds of glucose."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas usam glicose para:", en: "Plants use glucose to:"}
        choices:
          - {pt: "Crescer e armazenar energia (amido)", en: "Grow and store energy (starch)"}
          - {pt: "Beber água", en: "Drink water"}
          - {pt: "Mover-se rápido", en: "Move fast"}
          - {pt: "Mudar de cor", en: "Change color"}
        correctAnswer: {pt: "Crescer e armazenar energia (amido)", en: "Grow and store energy (starch)"}
        rationale: {pt: "Glicose excedente vira amido, reserva energética da planta.", en: "Excess glucose becomes starch, the plant's energy reserve."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Sem cloroplasto, uma planta:", en: "Without a chloroplast, a plant:"}
        choices:
          - {pt: "Não consegue produzir o próprio alimento", en: "Cannot make its own food"}
          - {pt: "Cresce mais", en: "Grows more"}
          - {pt: "Vive mais", en: "Lives longer"}
          - {pt: "Dá mais flores", en: "Has more flowers"}
        correctAnswer: {pt: "Não consegue produzir o próprio alimento", en: "Cannot make its own food"}
        rationale: {pt: "Cloroplasto é o único local da fotossíntese; sem ele, a planta morre de fome.", en: "The chloroplast is the only site of photosynthesis; without it, the plant starves."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "À noite, plantas continuam fazendo:", en: "At night, plants keep doing:"}
        choices:
          - {pt: "Respiração celular (em mitocôndrias)", en: "Cellular respiration (in mitochondria)"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Apenas dormem", en: "Just sleep"}
          - {pt: "Nada", en: "Nothing"}
        correctAnswer: {pt: "Respiração celular (em mitocôndrias)", en: "Cellular respiration (in mitochondria)"}
        rationale: {pt: "Sem luz não há fotossíntese, mas a respiração ocorre o tempo todo.", en: "No light = no photosynthesis, but respiration runs continuously."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Energia que entra no cloroplasto vem de:", en: "Energy entering the chloroplast comes from:"}
        choices:
          - {pt: "Sol (fótons)", en: "The Sun (photons)"}
          - {pt: "Solo", en: "Soil"}
          - {pt: "Vento", en: "Wind"}
          - {pt: "Calor da Terra", en: "Earth's heat"}
        correctAnswer: {pt: "Sol (fótons)", en: "The Sun (photons)"}
        rationale: {pt: "Quando fótons chegam, a clorofila os absorve, então excita elétrons que iniciam a cadeia fotossintética.", en: "When photons arrive, chlorophyll absorbs them, then excites electrons that start the photosynthetic chain."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Sem fotossíntese global, a Terra teria:", en: "Without global photosynthesis, Earth would have:"}
        choices:
          - {pt: "Pouco O₂ atmosférico e poucas cadeias alimentares", en: "Little atmospheric O₂ and few food chains"}
          - {pt: "Mais oxigênio", en: "More oxygen"}
          - {pt: "Mais glicose disponível", en: "More glucose available"}
          - {pt: "Mais luz", en: "More light"}
        correctAnswer: {pt: "Pouco O₂ atmosférico e poucas cadeias alimentares", en: "Little atmospheric O₂ and few food chains"}
        rationale: {pt: "Quase todo O₂ da atmosfera vem da fotossíntese; ela sustenta cadeias tróficas.", en: "Most atmospheric O₂ comes from photosynthesis; it sustains food chains."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "A água da fotossíntese é quebrada em:", en: "Water in photosynthesis is split into:"}
        choices:
          - {pt: "Hidrogênio (elétrons/prótons) e oxigênio", en: "Hydrogen (electrons/protons) and oxygen"}
          - {pt: "Sódio e cloro", en: "Sodium and chlorine"}
          - {pt: "Glicose e amido", en: "Glucose and starch"}
          - {pt: "DNA e proteína", en: "DNA and protein"}
        correctAnswer: {pt: "Hidrogênio (elétrons/prótons) e oxigênio", en: "Hydrogen (electrons/protons) and oxygen"}
        rationale: {pt: "Fotólise da água libera O₂ e fornece elétrons à cadeia.", en: "Water photolysis releases O₂ and supplies electrons to the chain."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Energia armazenada na glicose veio originalmente do:", en: "Energy stored in glucose originally came from:"}
        choices:
          - {pt: "Sol", en: "The Sun"}
          - {pt: "CO₂", en: "CO₂"}
          - {pt: "Solo", en: "Soil"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
        correctAnswer: {pt: "Sol", en: "The Sun"}
        rationale: {pt: "Fotossíntese converte energia solar em energia química armazenada na glicose.", en: "Photosynthesis converts solar energy into chemical energy stored in glucose."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Fotossíntese ocorre em duas fases. Quais?", en: "Photosynthesis happens in two phases. Which?"}
        choices:
          - {pt: "Reações de luz e ciclo de Calvin", en: "Light reactions and Calvin cycle"}
          - {pt: "Mitose e meiose", en: "Mitosis and meiosis"}
          - {pt: "Glicólise e Krebs", en: "Glycolysis and Krebs"}
          - {pt: "Transcrição e tradução", en: "Transcription and translation"}
        correctAnswer: {pt: "Reações de luz e ciclo de Calvin", en: "Light reactions and Calvin cycle"}
        rationale: {pt: "Reações de luz nos tilacoides; Calvin (fixação de CO₂) no estroma.", en: "Light reactions in thylakoids; Calvin (CO₂ fixation) in the stroma."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: cloroplasto é responsável por:", en: "Summary: the chloroplast is responsible for:"}
        choices:
          - {pt: "Transformar luz em alimento (glicose)", en: "Turning light into food (glucose)"}
          - {pt: "Digerir resíduos", en: "Digesting waste"}
          - {pt: "Armazenar DNA", en: "Storing DNA"}
          - {pt: "Movimentar a célula", en: "Moving the cell"}
        correctAnswer: {pt: "Transformar luz em alimento (glicose)", en: "Turning light into food (glucose)"}
        rationale: {pt: "Cloroplasto sustenta toda a planta — e indiretamente toda a cadeia alimentar.", en: "The chloroplast sustains the whole plant — and indirectly the whole food chain."}
        objectives: [biology.organelles]
        difficulty: 1
target: 20
