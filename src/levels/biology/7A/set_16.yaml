title:
  pt: "🔄 Fotossíntese vs respiração"
  en: "🔄 Photosynthesis vs respiration"
level: '7A'
subject: biology
objectives: [biology.processes]
difficulty: 2
authorNotes: "Comparar dois processos opostos e complementares."
example:
  pt: "Fotossíntese: CO₂+H₂O+luz → glicose+O₂. Respiração: glicose+O₂ → CO₂+H₂O+ATP."
  en: "Photosynthesis: CO₂+H₂O+light → glucose+O₂. Respiration: glucose+O₂ → CO₂+H₂O+ATP."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Comparar reações", en: "Compare reactions"}
    description: {pt: "Os dois processos são complementares.", en: "The two processes are complementary."}
    exercises:
      - type: choice
        question: {pt: "Qual processo PRODUZ glicose?", en: "Which process MAKES glucose?"}
        choices:
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Respiração celular", en: "Cellular respiration"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Digestão", en: "Digestion"}
        correctAnswer: {pt: "Fotossíntese", en: "Photosynthesis"}
        rationale: {pt: "Fotossíntese sintetiza glicose a partir de CO₂ e água.", en: "Photosynthesis synthesizes glucose from CO₂ and water."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual processo CONSOME glicose?", en: "Which process CONSUMES glucose?"}
        choices:
          - {pt: "Respiração celular", en: "Cellular respiration"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Síntese de DNA", en: "DNA synthesis"}
        correctAnswer: {pt: "Respiração celular", en: "Cellular respiration"}
        rationale: {pt: "Respiração quebra glicose para extrair energia.", en: "Respiration breaks glucose to extract energy."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual LIBERA O₂?", en: "Which RELEASES O₂?"}
        choices:
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Respiração", en: "Respiration"}
          - {pt: "Ambas", en: "Both"}
          - {pt: "Nenhuma", en: "Neither"}
        correctAnswer: {pt: "Fotossíntese", en: "Photosynthesis"}
        rationale: {pt: "Fotossíntese quebra água e libera O₂; respiração consome O₂.", en: "Photosynthesis splits water releasing O₂; respiration consumes O₂."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual LIBERA CO₂?", en: "Which RELEASES CO₂?"}
        choices:
          - {pt: "Respiração", en: "Respiration"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Ambas igualmente", en: "Both equally"}
          - {pt: "Nenhuma", en: "Neither"}
        correctAnswer: {pt: "Respiração", en: "Respiration"}
        rationale: {pt: "Respiração oxida glicose liberando CO₂; fotossíntese o consome.", en: "Respiration oxidizes glucose releasing CO₂; photosynthesis consumes it."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual processo PRECISA de luz?", en: "Which process NEEDS light?"}
        choices:
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Respiração", en: "Respiration"}
          - {pt: "Ambas", en: "Both"}
          - {pt: "Nenhuma", en: "Neither"}
        correctAnswer: {pt: "Fotossíntese", en: "Photosynthesis"}
        rationale: {pt: "Apenas fotossíntese capta fótons; respiração roda no escuro também.", en: "Only photosynthesis captures photons; respiration also runs in the dark."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual processo OCORRE em mitocôndrias?", en: "Which process OCCURS in mitochondria?"}
        choices:
          - {pt: "Respiração", en: "Respiration"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Ambas", en: "Both"}
          - {pt: "Nenhuma", en: "Neither"}
        correctAnswer: {pt: "Respiração", en: "Respiration"}
        rationale: {pt: "Mitocôndria é o local de Krebs e fosforilação oxidativa.", en: "Mitochondrion hosts Krebs cycle and oxidative phosphorylation."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual processo OCORRE em cloroplastos?", en: "Which process OCCURS in chloroplasts?"}
        choices:
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Respiração", en: "Respiration"}
          - {pt: "Ambas", en: "Both"}
          - {pt: "Nenhuma", en: "Neither"}
        correctAnswer: {pt: "Fotossíntese", en: "Photosynthesis"}
        rationale: {pt: "Cloroplastos contêm clorofila e maquinário de fixação de carbono.", en: "Chloroplasts contain chlorophyll and carbon-fixation machinery."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual processo plantas fazem?", en: "Which process do plants do?"}
        choices:
          - {pt: "Ambos: fotossíntese e respiração", en: "Both: photosynthesis and respiration"}
          - {pt: "Só fotossíntese", en: "Only photosynthesis"}
          - {pt: "Só respiração", en: "Only respiration"}
          - {pt: "Nenhum", en: "Neither"}
        correctAnswer: {pt: "Ambos: fotossíntese e respiração", en: "Both: photosynthesis and respiration"}
        rationale: {pt: "Plantas fotossintetizam de dia e respiram o tempo todo.", en: "Plants photosynthesize by day and respire continuously."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual processo animais fazem?", en: "Which process do animals do?"}
        choices:
          - {pt: "Apenas respiração", en: "Only respiration"}
          - {pt: "Apenas fotossíntese", en: "Only photosynthesis"}
          - {pt: "Ambos", en: "Both"}
          - {pt: "Nenhum", en: "Neither"}
        correctAnswer: {pt: "Apenas respiração", en: "Only respiration"}
        rationale: {pt: "Animais não têm cloroplastos; dependem de comida para glicose.", en: "Animals lack chloroplasts; they depend on food for glucose."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Os dois processos juntos formam um:", en: "The two processes together form a:"}
        choices:
          - {pt: "Ciclo entre CO₂ e O₂", en: "Cycle between CO₂ and O₂"}
          - {pt: "Tipo de DNA", en: "Type of DNA"}
          - {pt: "Cromossomo", en: "Chromosome"}
          - {pt: "Tipo de proteína", en: "Type of protein"}
        correctAnswer: {pt: "Ciclo entre CO₂ e O₂", en: "Cycle between CO₂ and O₂"}
        rationale: {pt: "O O₂ produzido por uns alimenta a respiração de outros, e vice-versa.", en: "O₂ produced by some fuels respiration of others, and vice versa."}
        objectives: [biology.processes]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Aplicar a comparação", en: "Apply the comparison"}
    description: {pt: "Em situações reais.", en: "In real situations."}
    exercises:
      - type: choice
        question: {pt: "Em uma sala fechada, plantas:", en: "In a closed room, plants:"}
        choices:
          - {pt: "Consomem CO₂ de dia e liberam de noite", en: "Consume CO₂ by day and release it at night"}
          - {pt: "Não fazem nada", en: "Do nothing"}
          - {pt: "Só liberam O₂", en: "Only release O₂"}
          - {pt: "Só liberam CO₂", en: "Only release CO₂"}
        correctAnswer: {pt: "Consomem CO₂ de dia e liberam de noite", en: "Consume CO₂ by day and release it at night"}
        rationale: {pt: "De dia: fotossíntese > respiração. De noite: só respiração.", en: "Day: photosynthesis > respiration. Night: respiration only."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "A energia que move animais veio originalmente de:", en: "Energy that moves animals originally came from:"}
        choices:
          - {pt: "Sol, via fotossíntese vegetal", en: "Sun, via plant photosynthesis"}
          - {pt: "Solo", en: "Soil"}
          - {pt: "Vento", en: "Wind"}
          - {pt: "Lua", en: "Moon"}
        correctAnswer: {pt: "Sol, via fotossíntese vegetal", en: "Sun, via plant photosynthesis"}
        rationale: {pt: "Plantas armazenam energia solar em glicose; animais a usam ao comer.", en: "Plants store solar energy in glucose; animals use it by eating."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Quando uma planta é cortada e seca, o ciclo:", en: "When a plant is cut and dries up, the cycle:"}
        choices:
          - {pt: "Para — sem fotossíntese e sem respiração", en: "Stops — no photosynthesis and no respiration"}
          - {pt: "Acelera", en: "Speeds up"}
          - {pt: "Continua igual", en: "Continues the same"}
          - {pt: "Vira só fotossíntese", en: "Becomes photosynthesis only"}
        correctAnswer: {pt: "Para — sem fotossíntese e sem respiração", en: "Stops — no photosynthesis and no respiration"}
        rationale: {pt: "Sem células vivas, ambos os processos cessam.", en: "Without living cells, both processes stop."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual processo é catabólico (quebra)?", en: "Which is catabolic (breaks down)?"}
        choices:
          - {pt: "Respiração celular", en: "Cellular respiration"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Ambos", en: "Both"}
          - {pt: "Nenhum", en: "Neither"}
        correctAnswer: {pt: "Respiração celular", en: "Cellular respiration"}
        rationale: {pt: "Respiração quebra glicose; fotossíntese constrói (anabólica).", en: "Respiration breaks glucose; photosynthesis builds it (anabolic)."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Qual processo é anabólico (constrói)?", en: "Which is anabolic (builds up)?"}
        choices:
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Respiração", en: "Respiration"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Digestão", en: "Digestion"}
        correctAnswer: {pt: "Fotossíntese", en: "Photosynthesis"}
        rationale: {pt: "Fotossíntese sintetiza moléculas complexas a partir de simples.", en: "Photosynthesis synthesizes complex molecules from simple ones."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "O O₂ que respiramos vem majoritariamente de:", en: "The O₂ we breathe mostly comes from:"}
        choices:
          - {pt: "Fotossíntese de plantas e algas", en: "Plant and algae photosynthesis"}
          - {pt: "Vulcões", en: "Volcanoes"}
          - {pt: "Oceanos minerais", en: "Mineral oceans"}
          - {pt: "Processos industriais", en: "Industrial processes"}
        correctAnswer: {pt: "Fotossíntese de plantas e algas", en: "Plant and algae photosynthesis"}
        rationale: {pt: "Sem fotossíntese, o O₂ atmosférico cairia rapidamente.", en: "Without photosynthesis, atmospheric O₂ would drop quickly."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Em escala global, o ciclo do carbono é:", en: "On a global scale, the carbon cycle is:"}
        choices:
          - {pt: "Equilibrado entre fotossíntese e respiração (idealmente)", en: "Balanced between photosynthesis and respiration (ideally)"}
          - {pt: "Sempre desequilibrado", en: "Always unbalanced"}
          - {pt: "Independente da vida", en: "Independent of life"}
          - {pt: "Restrito a animais", en: "Restricted to animals"}
        correctAnswer: {pt: "Equilibrado entre fotossíntese e respiração (idealmente)", en: "Balanced between photosynthesis and respiration (ideally)"}
        rationale: {pt: "Atividade humana (queima de combustíveis) tem desequilibrado o ciclo.", en: "Human activity (fuel burning) has been tipping the balance."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Quem precisa de O₂ direta ou indiretamente?", en: "Who needs O₂ directly or indirectly?"}
        choices:
          - {pt: "Praticamente toda vida aeróbia", en: "Practically all aerobic life"}
          - {pt: "Apenas peixes", en: "Only fish"}
          - {pt: "Apenas humanos", en: "Only humans"}
          - {pt: "Apenas plantas", en: "Only plants"}
        correctAnswer: {pt: "Praticamente toda vida aeróbia", en: "Practically all aerobic life"}
        rationale: {pt: "Toda célula com mitocôndria precisa de O₂.", en: "Every cell with mitochondria needs O₂."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Plantas em geral fazem MAIS:", en: "Plants generally do MORE:"}
        choices:
          - {pt: "Fotossíntese que respiração (líquido positivo)", en: "Photosynthesis than respiration (net positive)"}
          - {pt: "Respiração que fotossíntese", en: "Respiration than photosynthesis"}
          - {pt: "Mitose que fotossíntese", en: "Mitosis than photosynthesis"}
          - {pt: "Fermentação", en: "Fermentation"}
        correctAnswer: {pt: "Fotossíntese que respiração (líquido positivo)", en: "Photosynthesis than respiration (net positive)"}
        rationale: {pt: "Como a fotossíntese supera a respiração, a planta acumula matéria orgânica e, então, cresce.", en: "Because photosynthesis exceeds respiration, the plant accumulates organic matter and then grows."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: fotossíntese e respiração são processos:", en: "Summary: photosynthesis and respiration are processes:"}
        choices:
          - {pt: "Opostos e complementares", en: "Opposite and complementary"}
          - {pt: "Idênticos", en: "Identical"}
          - {pt: "Sem relação", en: "Unrelated"}
          - {pt: "Aleatórios", en: "Random"}
        correctAnswer: {pt: "Opostos e complementares", en: "Opposite and complementary"}
        rationale: {pt: "Um produz o que o outro consome — sustentando a vida.", en: "One produces what the other consumes — sustaining life."}
        objectives: [biology.processes]
        difficulty: 2
target: 20
