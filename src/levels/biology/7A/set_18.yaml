title:
  pt: "🧬 DNA e genes — introdução"
  en: "🧬 DNA and genes — introduction"
level: '7A'
subject: biology
objectives: [biology.genetics_intro]
difficulty: 2
authorNotes: "DNA: receita da vida; genes: instruções específicas."
example:
  pt: "DNA = livro inteiro com instruções; gene = uma receita; cromossomo = um capítulo enrolado."
  en: "DNA = whole instruction book; gene = one recipe; chromosome = a coiled chapter."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "O que é DNA", en: "What is DNA"}
    description: {pt: "Estrutura básica.", en: "Basic structure."}
    exercises:
      - type: choice
        question: {pt: "DNA significa:", en: "DNA stands for:"}
        choices:
          - {pt: "Ácido desoxirribonucleico", en: "Deoxyribonucleic acid"}
          - {pt: "Açúcar especial", en: "Special sugar"}
          - {pt: "Tipo de proteína", en: "A type of protein"}
          - {pt: "Vírus", en: "Virus"}
        correctAnswer: {pt: "Ácido desoxirribonucleico", en: "Deoxyribonucleic acid"}
        rationale: {pt: "Molécula que carrega informação genética em todos os seres vivos.", en: "The molecule carrying genetic information in all life."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Qual é a forma do DNA?", en: "What is the shape of DNA?"}
        choices:
          - {pt: "Dupla hélice", en: "Double helix"}
          - {pt: "Linha reta", en: "Straight line"}
          - {pt: "Esfera", en: "Sphere"}
          - {pt: "Triângulo", en: "Triangle"}
        correctAnswer: {pt: "Dupla hélice", en: "Double helix"}
        rationale: {pt: "Watson, Crick e Franklin elucidaram a estrutura helicoidal em 1953.", en: "Watson, Crick, and Franklin solved the helical structure in 1953."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Quais são as bases do DNA?", en: "What are the bases of DNA?"}
        choices:
          - {pt: "A, T, C, G", en: "A, T, C, G"}
          - {pt: "X, Y, Z", en: "X, Y, Z"}
          - {pt: "1, 2, 3, 4", en: "1, 2, 3, 4"}
          - {pt: "α, β, γ, δ", en: "α, β, γ, δ"}
        correctAnswer: {pt: "A, T, C, G", en: "A, T, C, G"}
        rationale: {pt: "Adenina, Timina, Citosina, Guanina formam o \"alfabeto\" genético.", en: "Adenine, Thymine, Cytosine, Guanine form the genetic \"alphabet\"."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "No DNA, A pareia com:", en: "In DNA, A pairs with:"}
        choices:
          - {pt: "T", en: "T"}
          - {pt: "G", en: "G"}
          - {pt: "C", en: "C"}
          - {pt: "U", en: "U"}
        correctAnswer: {pt: "T", en: "T"}
        rationale: {pt: "Pares de bases A-T e C-G formam pontes de hidrogênio na hélice.", en: "Base pairs A-T and C-G form hydrogen bonds in the helix."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Um gene é:", en: "A gene is:"}
        choices:
          - {pt: "Uma sequência de DNA com instrução para um traço/proteína", en: "A DNA sequence with instructions for a trait/protein"}
          - {pt: "Um tipo de açúcar", en: "A type of sugar"}
          - {pt: "Uma organela", en: "An organelle"}
          - {pt: "Um cromossomo inteiro", en: "An entire chromosome"}
        correctAnswer: {pt: "Uma sequência de DNA com instrução para um traço/proteína", en: "A DNA sequence with instructions for a trait/protein"}
        rationale: {pt: "Genes são unidades funcionais do DNA que codificam proteínas.", en: "Genes are functional DNA units that encode proteins."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Onde fica o DNA na célula eucariótica?", en: "Where is DNA in a eukaryotic cell?"}
        choices:
          - {pt: "No núcleo (e em mitocôndrias/cloroplastos)", en: "In the nucleus (and in mitochondria/chloroplasts)"}
          - {pt: "Apenas no citoplasma", en: "Only in the cytoplasm"}
          - {pt: "Apenas na membrana", en: "Only in the membrane"}
          - {pt: "Fora da célula", en: "Outside the cell"}
        correctAnswer: {pt: "No núcleo (e em mitocôndrias/cloroplastos)", en: "In the nucleus (and in mitochondria/chloroplasts)"}
        rationale: {pt: "Maior parte está no núcleo; pequenas porções em organelas com origem bacteriana.", en: "Most is in the nucleus; small portions in organelles with bacterial origin."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Cromossomo é:", en: "A chromosome is:"}
        choices:
          - {pt: "DNA enrolado e empacotado com proteínas", en: "DNA coiled and packaged with proteins"}
          - {pt: "Tipo de célula", en: "A type of cell"}
          - {pt: "Tipo de açúcar", en: "A type of sugar"}
          - {pt: "Vírus", en: "Virus"}
        correctAnswer: {pt: "DNA enrolado e empacotado com proteínas", en: "DNA coiled and packaged with proteins"}
        rationale: {pt: "Histonas ajudam a compactar o DNA em estruturas visíveis na divisão.", en: "Histones help compact DNA into structures visible during division."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Genes determinam:", en: "Genes determine:"}
        choices:
          - {pt: "Características hereditárias (cor de olho, altura, etc.)", en: "Heritable traits (eye color, height, etc.)"}
          - {pt: "Comida que você come", en: "Food you eat"}
          - {pt: "Idioma que você fala", en: "Language you speak"}
          - {pt: "Roupa que você usa", en: "Clothes you wear"}
        correctAnswer: {pt: "Características hereditárias (cor de olho, altura, etc.)", en: "Heritable traits (eye color, height, etc.)"}
        rationale: {pt: "Genes são herdados dos pais e influenciam traços biológicos.", en: "Genes are inherited from parents and influence biological traits."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "DNA é encontrado em:", en: "DNA is found in:"}
        choices:
          - {pt: "Todos os seres celulares", en: "All cellular life"}
          - {pt: "Apenas humanos", en: "Only humans"}
          - {pt: "Apenas animais", en: "Only animals"}
          - {pt: "Apenas plantas", en: "Only plants"}
        correctAnswer: {pt: "Todos os seres celulares", en: "All cellular life"}
        rationale: {pt: "DNA é universal — bactérias, plantas, fungos e animais têm DNA.", en: "DNA is universal — bacteria, plants, fungi, and animals have DNA."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "DNA serve para:", en: "DNA serves to:"}
        choices:
          - {pt: "Armazenar instruções para fabricar proteínas", en: "Store instructions for making proteins"}
          - {pt: "Produzir energia", en: "Produce energy"}
          - {pt: "Digerir comida", en: "Digest food"}
          - {pt: "Mover a célula", en: "Move the cell"}
        correctAnswer: {pt: "Armazenar instruções para fabricar proteínas", en: "Store instructions for making proteins"}
        rationale: {pt: "Genes codificam proteínas que executam quase todas as funções celulares.", en: "Genes encode proteins that perform nearly all cellular functions."}
        objectives: [biology.genetics_intro]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "DNA → proteína", en: "DNA → protein"}
    description: {pt: "Como o DNA é usado.", en: "How DNA is used."}
    exercises:
      - type: choice
        question: {pt: "Qual molécula leva a mensagem do DNA aos ribossomos?", en: "Which molecule carries the DNA message to ribosomes?"}
        choices:
          - {pt: "mRNA (RNA mensageiro)", en: "mRNA (messenger RNA)"}
          - {pt: "ATP", en: "ATP"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Lipídio", en: "Lipid"}
        correctAnswer: {pt: "mRNA (RNA mensageiro)", en: "mRNA (messenger RNA)"}
        rationale: {pt: "Transcrição copia DNA em mRNA, que viaja até os ribossomos.", en: "Transcription copies DNA into mRNA, which travels to ribosomes."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Ribossomo lê o mRNA e fabrica:", en: "Ribosomes read mRNA and build:"}
        choices:
          - {pt: "Proteínas", en: "Proteins"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Cromossomos", en: "Chromosomes"}
        correctAnswer: {pt: "Proteínas", en: "Proteins"}
        rationale: {pt: "Tradução converte códons de mRNA em aminoácidos encadeados.", en: "Translation converts mRNA codons into linked amino acids."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Um \"alelo\" é:", en: "An \"allele\" is:"}
        choices:
          - {pt: "Uma versão de um gene", en: "A version of a gene"}
          - {pt: "Uma célula", en: "A cell"}
          - {pt: "Um tipo de açúcar", en: "A type of sugar"}
          - {pt: "Um vírus", en: "A virus"}
        correctAnswer: {pt: "Uma versão de um gene", en: "A version of a gene"}
        rationale: {pt: "Alelos diferentes de um mesmo gene produzem variações de um traço.", en: "Different alleles of one gene produce trait variations."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Mutações são:", en: "Mutations are:"}
        choices:
          - {pt: "Mudanças na sequência do DNA", en: "Changes in DNA sequence"}
          - {pt: "Tipos de organelas", en: "Types of organelles"}
          - {pt: "Tipos de proteínas", en: "Types of proteins"}
          - {pt: "Tipos de açúcares", en: "Types of sugars"}
        correctAnswer: {pt: "Mudanças na sequência do DNA", en: "Changes in DNA sequence"}
        rationale: {pt: "Mutações geram variação genética — matéria-prima da evolução.", en: "Mutations create genetic variation — raw material for evolution."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Humanos têm aproximadamente quantos genes?", en: "Humans have approximately how many genes?"}
        choices:
          - {pt: "Cerca de 20.000", en: "About 20,000"}
          - {pt: "Cerca de 100", en: "About 100"}
          - {pt: "Cerca de 5", en: "About 5"}
          - {pt: "Bilhões", en: "Billions"}
        correctAnswer: {pt: "Cerca de 20.000", en: "About 20,000"}
        rationale: {pt: "O Projeto Genoma Humano estimou ~20.000 genes codificadores.", en: "The Human Genome Project estimated ~20,000 coding genes."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "DNA pode ser duplicado para:", en: "DNA can be duplicated for:"}
        choices:
          - {pt: "Divisão celular (replicação)", en: "Cell division (replication)"}
          - {pt: "Energia", en: "Energy"}
          - {pt: "Cor", en: "Color"}
          - {pt: "Som", en: "Sound"}
        correctAnswer: {pt: "Divisão celular (replicação)", en: "Cell division (replication)"}
        rationale: {pt: "Cada filha recebe cópia idêntica via replicação semiconservativa.", en: "Each daughter receives an identical copy via semiconservative replication."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "DNA é encontrado em vírus?", en: "Is DNA found in viruses?"}
        choices:
          - {pt: "Em alguns sim, em outros há RNA", en: "In some yes; others have RNA"}
          - {pt: "Nunca", en: "Never"}
          - {pt: "Sempre RNA", en: "Always RNA"}
          - {pt: "Sempre DNA", en: "Always DNA"}
        correctAnswer: {pt: "Em alguns sim, em outros há RNA", en: "In some yes; others have RNA"}
        rationale: {pt: "Vírus podem ter DNA ou RNA como material genético.", en: "Viruses may have either DNA or RNA as genetic material."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Genes idênticos entre irmãos vêm de:", en: "Genes shared between siblings come from:"}
        choices:
          - {pt: "Pais comuns", en: "Common parents"}
          - {pt: "Comida", en: "Food"}
          - {pt: "Ambiente apenas", en: "Environment only"}
          - {pt: "Aleatoriedade", en: "Randomness"}
        correctAnswer: {pt: "Pais comuns", en: "Common parents"}
        rationale: {pt: "Irmãos partilham metade dos genes em média (compartilhando os pais).", en: "Siblings share about half their genes (sharing parents)."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Genoma é:", en: "A genome is:"}
        choices:
          - {pt: "Conjunto completo do DNA de um organismo", en: "Complete set of an organism's DNA"}
          - {pt: "Uma célula", en: "A cell"}
          - {pt: "Uma proteína", en: "A protein"}
          - {pt: "Um vírus", en: "A virus"}
        correctAnswer: {pt: "Conjunto completo do DNA de um organismo", en: "Complete set of an organism's DNA"}
        rationale: {pt: "O genoma humano tem ~3 bilhões de pares de bases.", en: "The human genome has ~3 billion base pairs."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: DNA é:", en: "Summary: DNA is:"}
        choices:
          - {pt: "O \"livro de instruções\" da vida", en: "The \"instruction book\" of life"}
          - {pt: "Uma fonte de energia", en: "An energy source"}
          - {pt: "Um pigmento", en: "A pigment"}
          - {pt: "Uma membrana", en: "A membrane"}
        correctAnswer: {pt: "O \"livro de instruções\" da vida", en: "The \"instruction book\" of life"}
        rationale: {pt: "DNA armazena, transmite e expressa informação biológica.", en: "DNA stores, transmits, and expresses biological information."}
        objectives: [biology.genetics_intro]
        difficulty: 2
target: 20
