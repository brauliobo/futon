title:
  pt: "🌳 Os cinco reinos"
  en: "🌳 The five kingdoms"
level: '7A'
subject: biology
objectives: [biology.taxonomy]
difficulty: 1
authorNotes: "Visão geral: Animal, Plantae, Fungi, Protista, Monera."
example:
  pt: "Ex.: cachorro → Animal; trigo → Plantae; cogumelo → Fungi; ameba → Protista; bactéria → Monera."
  en: "Ex.: dog → Animalia; wheat → Plantae; mushroom → Fungi; amoeba → Protista; bacterium → Monera."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Reconhecer reinos", en: "Recognize kingdoms"}
    description: {pt: "Identifique a qual reino pertence cada ser.", en: "Identify which kingdom each being belongs to."}
    exercises:
      - type: choice
        question: {pt: "A qual reino pertence o cachorro?", en: "Which kingdom does the dog belong to?"}
        choices:
          - {pt: "Animal", en: "Animalia"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Monera", en: "Monera"}
        correctAnswer: {pt: "Animal", en: "Animalia"}
        rationale: {pt: "Cães são animais multicelulares heterotróficos com células sem parede celular.", en: "Dogs are multicellular heterotrophic animals with cells lacking a cell wall."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "A roseira pertence a qual reino?", en: "The rose bush belongs to which kingdom?"}
        choices:
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Animal", en: "Animalia"}
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Protista", en: "Protista"}
        correctAnswer: {pt: "Plantae", en: "Plantae"}
        rationale: {pt: "Plantas são autótrofas (fotossíntese) com células contendo cloroplastos e parede de celulose.", en: "Plants are autotrophs (photosynthesis) with cells containing chloroplasts and cellulose walls."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Cogumelos pertencem ao reino:", en: "Mushrooms belong to the kingdom:"}
        choices:
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Animal", en: "Animalia"}
          - {pt: "Monera", en: "Monera"}
        correctAnswer: {pt: "Fungi", en: "Fungi"}
        rationale: {pt: "Fungos absorvem nutrientes pelo corpo (decompositores) e têm parede de quitina.", en: "Fungi absorb nutrients through their body (decomposers) and have chitin walls."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Bactérias pertencem a qual reino?", en: "Bacteria belong to which kingdom?"}
        choices:
          - {pt: "Monera", en: "Monera"}
          - {pt: "Protista", en: "Protista"}
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Plantae", en: "Plantae"}
        correctAnswer: {pt: "Monera", en: "Monera"}
        rationale: {pt: "Monera reúne procariontes — organismos unicelulares sem núcleo membranar.", en: "Monera includes prokaryotes — unicellular organisms without a membrane-bound nucleus."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Amebas e algas unicelulares são do reino:", en: "Amoebas and single-celled algae are in the kingdom:"}
        choices:
          - {pt: "Protista", en: "Protista"}
          - {pt: "Monera", en: "Monera"}
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Animal", en: "Animalia"}
        correctAnswer: {pt: "Protista", en: "Protista"}
        rationale: {pt: "Protista agrupa eucariontes (com núcleo) majoritariamente unicelulares.", en: "Protista groups eukaryotes (with a nucleus) that are mostly unicellular."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual reino é composto SOMENTE por procariontes?", en: "Which kingdom contains ONLY prokaryotes?"}
        choices:
          - {pt: "Monera", en: "Monera"}
          - {pt: "Protista", en: "Protista"}
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Animal", en: "Animalia"}
        correctAnswer: {pt: "Monera", en: "Monera"}
        rationale: {pt: "Monera é o único reino sem células com núcleo membranar.", en: "Monera is the only kingdom without membrane-bound nuclei."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes reinos contém somente seres autótrofos?", en: "Which of these kingdoms contains only autotrophs?"}
        choices:
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Animal", en: "Animalia"}
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Monera", en: "Monera"}
        correctAnswer: {pt: "Plantae", en: "Plantae"}
        rationale: {pt: "Plantas produzem o próprio alimento por fotossíntese; animais e fungos são heterótrofos.", en: "Plants make their own food by photosynthesis; animals and fungi are heterotrophs."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Levedura usada em pão é do reino:", en: "Yeast used in bread is from the kingdom:"}
        choices:
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Monera", en: "Monera"}
          - {pt: "Animal", en: "Animalia"}
        correctAnswer: {pt: "Fungi", en: "Fungi"}
        rationale: {pt: "Levedura é um fungo unicelular que fermenta açúcares produzindo CO₂.", en: "Yeast is a unicellular fungus that ferments sugars producing CO₂."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Quantos reinos compõem a clássica classificação dos seres vivos aqui apresentada?", en: "How many kingdoms make up the classical classification shown here?"}
        choices:
          - {pt: "Cinco", en: "Five"}
          - {pt: "Três", en: "Three"}
          - {pt: "Sete", en: "Seven"}
          - {pt: "Dez", en: "Ten"}
        correctAnswer: {pt: "Cinco", en: "Five"}
        rationale: {pt: "Whittaker propôs cinco reinos: Animal, Plantae, Fungi, Protista, Monera.", en: "Whittaker proposed five kingdoms: Animalia, Plantae, Fungi, Protista, Monera."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Borboletas pertencem ao reino:", en: "Butterflies belong to the kingdom:"}
        choices:
          - {pt: "Animal", en: "Animalia"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Protista", en: "Protista"}
          - {pt: "Fungi", en: "Fungi"}
        correctAnswer: {pt: "Animal", en: "Animalia"}
        rationale: {pt: "Insetos são animais invertebrados, pertencem a Animalia.", en: "Insects are invertebrate animals, belonging to Animalia."}
        objectives: [biology.taxonomy]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Mais reinos", en: "More kingdoms"}
    description: {pt: "Pratique a identificação.", en: "Practice identification."}
    exercises:
      - type: choice
        question: {pt: "Algas marinhas multicelulares (macroalgas) costumam ser classificadas como:", en: "Multicellular marine algae are often classified as:"}
        choices:
          - {pt: "Protista", en: "Protista"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Monera", en: "Monera"}
          - {pt: "Fungi", en: "Fungi"}
        correctAnswer: {pt: "Protista", en: "Protista"}
        rationale: {pt: "Embora façam fotossíntese, algas tradicionalmente ficam em Protista por origem evolutiva distinta das plantas terrestres.", en: "Though they photosynthesize, algae are traditionally placed in Protista due to a distinct evolutionary origin from land plants."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Mofo no pão é um:", en: "Mold on bread is a:"}
        choices:
          - {pt: "Fungo", en: "Fungus"}
          - {pt: "Animal", en: "Animal"}
          - {pt: "Bactéria", en: "Bacterium"}
          - {pt: "Vegetal", en: "Plant"}
        correctAnswer: {pt: "Fungo", en: "Fungus"}
        rationale: {pt: "Mofo é um fungo filamentoso que decompõe matéria orgânica.", en: "Mold is a filamentous fungus that decomposes organic matter."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual reino tem células procarióticas (sem núcleo)?", en: "Which kingdom has prokaryotic cells (no nucleus)?"}
        choices:
          - {pt: "Monera", en: "Monera"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Protista", en: "Protista"}
        correctAnswer: {pt: "Monera", en: "Monera"}
        rationale: {pt: "Procariontes (Monera) não têm núcleo definido nem organelas membranares.", en: "Prokaryotes (Monera) lack a defined nucleus and membrane-bound organelles."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual destes seres é multicelular e heterótrofo, sem parede celular?", en: "Which of these is multicellular and heterotrophic, with no cell wall?"}
        choices:
          - {pt: "Cachorro (Animal)", en: "Dog (Animal)"}
          - {pt: "Trigo (Plantae)", en: "Wheat (Plantae)"}
          - {pt: "Bactéria (Monera)", en: "Bacterium (Monera)"}
          - {pt: "Cogumelo (Fungi)", en: "Mushroom (Fungi)"}
        correctAnswer: {pt: "Cachorro (Animal)", en: "Dog (Animal)"}
        rationale: {pt: "Animalia é multicelular, heterótrofo e suas células não têm parede celular.", en: "Animalia is multicellular, heterotrophic, and its cells lack a cell wall."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "O que melhor define o reino Plantae?", en: "What best defines kingdom Plantae?"}
        choices:
          - {pt: "Multicelular, autótrofo, parede de celulose", en: "Multicellular, autotrophic, cellulose wall"}
          - {pt: "Unicelular sem núcleo", en: "Unicellular without nucleus"}
          - {pt: "Heterótrofo com quitina", en: "Heterotrophic with chitin"}
          - {pt: "Móvel sem parede", en: "Motile without wall"}
        correctAnswer: {pt: "Multicelular, autótrofo, parede de celulose", en: "Multicellular, autotrophic, cellulose wall"}
        rationale: {pt: "Plantae combina multicelularidade, fotossíntese e parede celular de celulose.", en: "Plantae combines multicellularity, photosynthesis, and cellulose cell walls."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual reino inclui peixes, aves e mamíferos?", en: "Which kingdom includes fish, birds, and mammals?"}
        choices:
          - {pt: "Animal", en: "Animalia"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Protista", en: "Protista"}
          - {pt: "Fungi", en: "Fungi"}
        correctAnswer: {pt: "Animal", en: "Animalia"}
        rationale: {pt: "Todos os vertebrados são animais multicelulares — reino Animalia.", en: "All vertebrates are multicellular animals — kingdom Animalia."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "O que diferencia Protista dos demais reinos eucariontes?", en: "What sets Protista apart from other eukaryotic kingdoms?"}
        choices:
          - {pt: "Reúne os eucariontes que não se encaixam em Animal, Plantae ou Fungi", en: "Groups eukaryotes that don't fit Animalia, Plantae, or Fungi"}
          - {pt: "São procariontes", en: "They are prokaryotes"}
          - {pt: "Têm parede de celulose", en: "Have cellulose walls"}
          - {pt: "São sempre multicelulares", en: "Are always multicellular"}
        correctAnswer: {pt: "Reúne os eucariontes que não se encaixam em Animal, Plantae ou Fungi", en: "Groups eukaryotes that don't fit Animalia, Plantae, or Fungi"}
        rationale: {pt: "Protista é historicamente um \"reino guarda-chuva\" para eucariontes diversos.", en: "Protista has historically been an \"umbrella kingdom\" for diverse eukaryotes."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Qual é o reino mais antigo na história da Terra?", en: "Which is the oldest kingdom in Earth's history?"}
        choices:
          - {pt: "Monera (procariontes)", en: "Monera (prokaryotes)"}
          - {pt: "Animal", en: "Animalia"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Fungi", en: "Fungi"}
        correctAnswer: {pt: "Monera (procariontes)", en: "Monera (prokaryotes)"}
        rationale: {pt: "Os primeiros fósseis (~3,5 bi anos) são de procariontes; eucariontes surgiram depois.", en: "The earliest fossils (~3.5 by) are prokaryotes; eukaryotes appeared later."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Cogumelos NÃO são plantas porque eles:", en: "Mushrooms are NOT plants because they:"}
        choices:
          - {pt: "Não fazem fotossíntese e têm parede de quitina", en: "Don't photosynthesize and have chitin walls"}
          - {pt: "São animais", en: "Are animals"}
          - {pt: "São procariontes", en: "Are prokaryotes"}
          - {pt: "São vírus", en: "Are viruses"}
        correctAnswer: {pt: "Não fazem fotossíntese e têm parede de quitina", en: "Don't photosynthesize and have chitin walls"}
        rationale: {pt: "Plantas têm cloroplastos e celulose; fungos absorvem nutrientes e têm quitina.", en: "Plants have chloroplasts and cellulose; fungi absorb nutrients and have chitin."}
        objectives: [biology.taxonomy]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: qual conjunto NÃO é um dos cinco reinos?", en: "Summary: which set is NOT one of the five kingdoms?"}
        choices:
          - {pt: "Vírus", en: "Viruses"}
          - {pt: "Animal", en: "Animalia"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Fungi", en: "Fungi"}
        correctAnswer: {pt: "Vírus", en: "Viruses"}
        rationale: {pt: "Vírus não são considerados seres vivos celulares e ficam fora dos cinco reinos.", en: "Viruses are not considered cellular living beings and are outside the five kingdoms."}
        objectives: [biology.taxonomy]
        difficulty: 1
target: 20
