title:
  pt: "🔥 Respiração celular — básico"
  en: "🔥 Cellular respiration — basics"
level: '7A'
subject: biology
objectives: [biology.processes]
difficulty: 1
authorNotes: "Como a célula extrai energia da glicose."
example:
  pt: "C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + ATP. Ocorre na mitocôndria."
  en: "C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + ATP. Happens in the mitochondrion."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Equação geral", en: "Overall equation"}
    description: {pt: "O que entra e sai.", en: "What enters and exits."}
    exercises:
      - type: choice
        question: {pt: "O que entra na respiração celular?", en: "What enters cellular respiration?"}
        choices:
          - {pt: "Glicose e O₂", en: "Glucose and O₂"}
          - {pt: "CO₂ e luz", en: "CO₂ and light"}
          - {pt: "DNA e proteína", en: "DNA and protein"}
          - {pt: "Água apenas", en: "Water only"}
        correctAnswer: {pt: "Glicose e O₂", en: "Glucose and O₂"}
        rationale: {pt: "Glicose é o combustível; O₂ é o oxidante final.", en: "Glucose is the fuel; O₂ is the final oxidizer."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "O que sai da respiração celular?", en: "What comes out of cellular respiration?"}
        choices:
          - {pt: "ATP, CO₂ e H₂O", en: "ATP, CO₂, and H₂O"}
          - {pt: "Glicose e luz", en: "Glucose and light"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Sal", en: "Salt"}
        correctAnswer: {pt: "ATP, CO₂ e H₂O", en: "ATP, CO₂, and H₂O"}
        rationale: {pt: "Energia (ATP) é capturada; CO₂ e H₂O são subprodutos.", en: "Energy (ATP) is captured; CO₂ and H₂O are by-products."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Onde a respiração ocorre?", en: "Where does respiration happen?"}
        choices:
          - {pt: "Citoplasma + mitocôndria", en: "Cytoplasm + mitochondrion"}
          - {pt: "Núcleo apenas", en: "Nucleus only"}
          - {pt: "Cloroplasto apenas", en: "Chloroplast only"}
          - {pt: "Lisossomo apenas", en: "Lysosome only"}
        correctAnswer: {pt: "Citoplasma + mitocôndria", en: "Cytoplasm + mitochondrion"}
        rationale: {pt: "Glicólise no citoplasma; Krebs e fosforilação na mitocôndria.", en: "Glycolysis in cytoplasm; Krebs and phosphorylation in mitochondrion."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "ATP é a moeda de:", en: "ATP is the currency of:"}
        choices:
          - {pt: "Energia celular", en: "Cellular energy"}
          - {pt: "Informação genética", en: "Genetic information"}
          - {pt: "Sinalização nervosa", en: "Nervous signaling"}
          - {pt: "Estrutura da parede", en: "Wall structure"}
        correctAnswer: {pt: "Energia celular", en: "Cellular energy"}
        rationale: {pt: "ATP transfere energia porque suas ligações fosfato, quando quebradas, liberam energia útil para a célula.", en: "ATP transfers energy because its phosphate bonds, when broken, release usable energy for the cell."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Por que respiramos oxigênio?", en: "Why do we breathe oxygen?"}
        choices:
          - {pt: "Mitocôndrias usam O₂ para gerar ATP", en: "Mitochondria use O₂ to generate ATP"}
          - {pt: "Para falar melhor", en: "To speak better"}
          - {pt: "Para encher pulmões", en: "To fill lungs"}
          - {pt: "Sem motivo", en: "No reason"}
        correctAnswer: {pt: "Mitocôndrias usam O₂ para gerar ATP", en: "Mitochondria use O₂ to generate ATP"}
        rationale: {pt: "O₂ é o aceptor final de elétrons na cadeia respiratória.", en: "O₂ is the final electron acceptor in the respiratory chain."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Quem produz mais ATP por glicose?", en: "Which produces more ATP per glucose?"}
        choices:
          - {pt: "Respiração aeróbia (com O₂)", en: "Aerobic respiration (with O₂)"}
          - {pt: "Fermentação (sem O₂)", en: "Fermentation (no O₂)"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Mitose", en: "Mitosis"}
        correctAnswer: {pt: "Respiração aeróbia (com O₂)", en: "Aerobic respiration (with O₂)"}
        rationale: {pt: "Aeróbia gera ~30 ATP/glicose; fermentação só ~2 ATP.", en: "Aerobic yields ~30 ATP/glucose; fermentation only ~2 ATP."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "CO₂ que respiramos para fora vem de:", en: "The CO₂ we exhale comes from:"}
        choices:
          - {pt: "Quebra da glicose nas mitocôndrias", en: "Glucose breakdown in mitochondria"}
          - {pt: "Pulmões diretamente", en: "Lungs directly"}
          - {pt: "Pele", en: "Skin"}
          - {pt: "Estômago", en: "Stomach"}
        correctAnswer: {pt: "Quebra da glicose nas mitocôndrias", en: "Glucose breakdown in mitochondria"}
        rationale: {pt: "Cada CO₂ vem do carbono da glicose oxidada.", en: "Each CO₂ comes from carbon in oxidized glucose."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Quando a célula precisa de ATP, ela:", en: "When a cell needs ATP, it:"}
        choices:
          - {pt: "Quebra mais glicose", en: "Breaks down more glucose"}
          - {pt: "Para de respirar", en: "Stops respiring"}
          - {pt: "Cria ATP do nada", en: "Creates ATP from nothing"}
          - {pt: "Usa luz", en: "Uses light"}
        correctAnswer: {pt: "Quebra mais glicose", en: "Breaks down more glucose"}
        rationale: {pt: "Maior demanda → mais respiração → mais ATP.", en: "Higher demand → more respiration → more ATP."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "A primeira etapa da respiração (glicólise) ocorre:", en: "Glycolysis (first step) occurs:"}
        choices:
          - {pt: "No citoplasma", en: "In the cytoplasm"}
          - {pt: "No núcleo", en: "In the nucleus"}
          - {pt: "No cloroplasto", en: "In the chloroplast"}
          - {pt: "No lisossomo", en: "In the lysosome"}
        correctAnswer: {pt: "No citoplasma", en: "In the cytoplasm"}
        rationale: {pt: "Glicólise não precisa de mitocôndria; ocorre fora dela.", en: "Glycolysis doesn't need a mitochondrion; it occurs outside it."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Plantas também respiram?", en: "Do plants also respire?"}
        choices:
          - {pt: "Sim, em mitocôndrias", en: "Yes, in mitochondria"}
          - {pt: "Não, só fotossíntese", en: "No, only photosynthesis"}
          - {pt: "Apenas as raízes", en: "Only the roots"}
          - {pt: "Apenas no inverno", en: "Only in winter"}
        correctAnswer: {pt: "Sim, em mitocôndrias", en: "Yes, in mitochondria"}
        rationale: {pt: "Plantas usam ATP igual aos animais — todas as células com mitocôndria respiram.", en: "Plants use ATP just like animals — all cells with mitochondria respire."}
        objectives: [biology.processes]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Fermentação e exercício", en: "Fermentation and exercise"}
    description: {pt: "Quando falta O₂.", en: "When O₂ runs short."}
    exercises:
      - type: choice
        question: {pt: "Sem oxigênio, células musculares produzem:", en: "Without oxygen, muscle cells produce:"}
        choices:
          - {pt: "Ácido lático (fermentação)", en: "Lactic acid (fermentation)"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Água apenas", en: "Water only"}
        correctAnswer: {pt: "Ácido lático (fermentação)", en: "Lactic acid (fermentation)"}
        rationale: {pt: "Fermentação láctica permite gerar pouco ATP sem O₂; causa dor muscular.", en: "Lactic fermentation makes some ATP without O₂; causes muscle soreness."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Fermentação por leveduras produz:", en: "Yeast fermentation produces:"}
        choices:
          - {pt: "Etanol e CO₂", en: "Ethanol and CO₂"}
          - {pt: "Ácido lático", en: "Lactic acid"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "DNA", en: "DNA"}
        correctAnswer: {pt: "Etanol e CO₂", en: "Ethanol and CO₂"}
        rationale: {pt: "Fermentação alcoólica é usada em pão (CO₂ infla a massa) e bebidas.", en: "Alcoholic fermentation is used in bread (CO₂ raises dough) and drinks."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Por que sentimos cansaço ao correr muito?", en: "Why do we feel tired when running a lot?"}
        choices:
          - {pt: "Acúmulo de ácido lático e fadiga muscular", en: "Lactic acid build-up and muscle fatigue"}
          - {pt: "Falta de cor", en: "Lack of color"}
          - {pt: "Excesso de DNA", en: "Excess DNA"}
          - {pt: "Frio", en: "Cold"}
        correctAnswer: {pt: "Acúmulo de ácido lático e fadiga muscular", en: "Lactic acid build-up and muscle fatigue"}
        rationale: {pt: "Quando O₂ não basta, células fermentam e geram lactato.", en: "When O₂ is insufficient, cells ferment and produce lactate."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "A respiração é o oposto da:", en: "Respiration is the opposite of:"}
        choices:
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Síntese proteica", en: "Protein synthesis"}
        correctAnswer: {pt: "Fotossíntese", en: "Photosynthesis"}
        rationale: {pt: "Fotossíntese constrói glicose; respiração quebra glicose.", en: "Photosynthesis builds glucose; respiration breaks glucose."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "A respiração libera energia em forma de:", en: "Respiration releases energy as:"}
        choices:
          - {pt: "ATP (e algum calor)", en: "ATP (and some heat)"}
          - {pt: "Apenas calor", en: "Only heat"}
          - {pt: "Apenas luz", en: "Only light"}
          - {pt: "Apenas som", en: "Only sound"}
        correctAnswer: {pt: "ATP (e algum calor)", en: "ATP (and some heat)"}
        rationale: {pt: "Cerca de 40% vira ATP utilizável; o resto é calor corporal.", en: "About 40% becomes usable ATP; the rest is body heat."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Por que aquecemos quando exercitamos?", en: "Why do we warm up when exercising?"}
        choices:
          - {pt: "Mais respiração celular libera mais calor", en: "More cellular respiration releases more heat"}
          - {pt: "Sol entra na pele", en: "Sun enters the skin"}
          - {pt: "Roupa esquenta", en: "Clothes warm up"}
          - {pt: "Sem motivo", en: "No reason"}
        correctAnswer: {pt: "Mais respiração celular libera mais calor", en: "More cellular respiration releases more heat"}
        rationale: {pt: "Demanda muscular alta = mais ATP queimado = mais calor.", en: "High muscle demand = more ATP burned = more heat."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Glicose vem do que comemos?", en: "Does glucose come from what we eat?"}
        choices:
          - {pt: "Sim — carboidratos viram glicose na digestão", en: "Yes — carbohydrates become glucose in digestion"}
          - {pt: "Não", en: "No"}
          - {pt: "Vem da pele", en: "From skin"}
          - {pt: "Vem do ar", en: "From air"}
        correctAnswer: {pt: "Sim — carboidratos viram glicose na digestão", en: "Yes — carbohydrates become glucose in digestion"}
        rationale: {pt: "A digestão decompõe carboidratos em glicose absorvida pelo sangue.", en: "Digestion breaks carbs into glucose absorbed into the blood."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Sem mitocôndrias funcionais, uma célula:", en: "Without working mitochondria, a cell:"}
        choices:
          - {pt: "Produz pouco ATP e morre rápido", en: "Makes little ATP and dies quickly"}
          - {pt: "Vive para sempre", en: "Lives forever"}
          - {pt: "Cresce mais", en: "Grows more"}
          - {pt: "Faz fotossíntese", en: "Photosynthesizes"}
        correctAnswer: {pt: "Produz pouco ATP e morre rápido", en: "Makes little ATP and dies quickly"}
        rationale: {pt: "Quando não há fosforilação oxidativa, basta pouco tempo para o ATP acabar, então funções vitais cessam.", en: "When oxidative phosphorylation fails, ATP runs out quickly, so vital functions stop."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "A respiração celular usa O₂ porque ele é:", en: "Cellular respiration uses O₂ because it:"}
        choices:
          - {pt: "Excelente aceptor de elétrons", en: "Is an excellent electron acceptor"}
          - {pt: "Doce", en: "Tastes sweet"}
          - {pt: "Colorido", en: "Is colored"}
          - {pt: "Rápido", en: "Is fast"}
        correctAnswer: {pt: "Excelente aceptor de elétrons", en: "Is an excellent electron acceptor"}
        rationale: {pt: "A alta eletronegatividade do O₂ permite extrair muita energia da glicose.", en: "O₂'s high electronegativity allows extracting much energy from glucose."}
        objectives: [biology.processes]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: a respiração celular serve para:", en: "Summary: cellular respiration serves to:"}
        choices:
          - {pt: "Converter glicose em ATP utilizável", en: "Convert glucose into usable ATP"}
          - {pt: "Produzir DNA", en: "Produce DNA"}
          - {pt: "Mover a célula", en: "Move the cell"}
          - {pt: "Capturar luz", en: "Capture light"}
        correctAnswer: {pt: "Converter glicose em ATP utilizável", en: "Convert glucose into usable ATP"}
        rationale: {pt: "Quando há ATP, processos como contração muscular, transporte ativo e síntese de proteínas funcionam — primeiro a glicose, depois ATP, então a função.", en: "When ATP is available, processes like muscle contraction, active transport, and protein synthesis work — first glucose, then ATP, then the function."}
        objectives: [biology.processes]
        difficulty: 1
target: 20
