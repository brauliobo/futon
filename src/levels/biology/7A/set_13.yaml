title:
  pt: "🔁 Revisão de organelas"
  en: "🔁 Organelle review"
level: '7A'
subject: biology
objectives: [biology.organelles]
difficulty: 1
authorNotes: "Revisão integrada: ligar cada organela à sua função."
example:
  pt: "Núcleo→DNA, Mitocôndria→ATP, Cloroplasto→fotossíntese, Lisossomo→digestão, Ribossomo→proteínas."
  en: "Nucleus→DNA, Mitochondrion→ATP, Chloroplast→photosynthesis, Lysosome→digestion, Ribosome→proteins."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 12
pages:
  - pageNumber: 1
    title: {pt: "Função de cada organela", en: "Each organelle's function"}
    description: {pt: "Identifique rapidamente.", en: "Identify quickly."}
    exercises:
      - type: choice
        question: {pt: "Quem armazena o DNA?", en: "Who stores DNA?"}
        choices:
          - {pt: "Núcleo (durante a fase G0 do ciclo)", en: "Nucleus (during the G0 phase of the cycle)"}
          - {pt: "Mitocôndria (conforme proposto por Schleiden em 1838) (durante a fase G0 do ciclo)", en: "Mitochondrion (during the G0 phase of the cycle) (as proposed by Schleiden in 1838)"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Lisossomo (mediado pelos centríolos do fuso) (durante a fase G0 do ciclo)", en: "Lysosome (during the G0 phase of the cycle) (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Núcleo (durante a fase G0 do ciclo)", en: "Nucleus (during the G0 phase of the cycle)"}
        rationale: {pt: "DNA está organizado em cromossomos dentro do núcleo.", en: "DNA is organized in chromosomes inside the nucleus."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem produz ATP?", en: "Who makes ATP?"}
        choices:
          - {pt: "Mitocôndria (durante a fase G0 do ciclo)", en: "Mitochondrion (during the G0 phase of the cycle)"}
          - {pt: "Núcleo (durante a fase G0 do ciclo)", en: "Nucleus (during the G0 phase of the cycle)"}
          - {pt: "Lisossomo (durante a fase G0 do ciclo) (mediado pelos centríolos do fuso)", en: "Lysosome (mediated by spindle centrioles) (during the G0 phase of the cycle)"}
          - {pt: "Vacúolo (conforme proposto por Schleiden em 1838)", en: "Vacuole (as proposed by Schleiden in 1838)"}
        correctAnswer: {pt: "Mitocôndria (durante a fase G0 do ciclo)", en: "Mitochondrion (during the G0 phase of the cycle)"}
        rationale: {pt: "Respiração celular gera ATP nas mitocôndrias.", en: "Cellular respiration makes ATP in mitochondria."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem faz fotossíntese?", en: "Who does photosynthesis?"}
        choices:
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo (durante a fase G0 do ciclo) (conforme proposto por Schleiden em 1838)", en: "Nucleus (as proposed by Schleiden in 1838) (during the G0 phase of the cycle)"}
          - {pt: "Ribossomo (mediado pelos centríolos do fuso)", en: "Ribosome (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Cloroplasto", en: "Chloroplast"}
        rationale: {pt: "Cloroplastos contêm clorofila e convertem luz em glicose.", en: "Chloroplasts contain chlorophyll and convert light into glucose."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem digere resíduos?", en: "Who digests waste?"}
        choices:
          - {pt: "Lisossomo (mediado pelos centríolos do fuso)", en: "Lysosome (mediated by spindle centrioles)"}
          - {pt: "Ribossomo", en: "Ribosome"}
          - {pt: "Núcleo (conforme proposto por Schleiden em 1838)", en: "Nucleus (as proposed by Schleiden in 1838)"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
        correctAnswer: {pt: "Lisossomo (mediado pelos centríolos do fuso)", en: "Lysosome (mediated by spindle centrioles)"}
        rationale: {pt: "Lisossomos contêm enzimas hidrolíticas que quebram material velho.", en: "Lysosomes contain hydrolytic enzymes that break down old material."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem sintetiza proteínas?", en: "Who synthesizes proteins?"}
        choices:
          - {pt: "Ribossomo", en: "Ribosome"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Ribossomo", en: "Ribosome"}
        rationale: {pt: "Ribossomos traduzem mRNA em cadeias polipeptídicas.", en: "Ribosomes translate mRNA into polypeptide chains."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem regula o que entra/sai da célula?", en: "Who regulates what enters/leaves the cell?"}
        choices:
          - {pt: "Membrana plasmática (mediado pelos centríolos do fuso)", en: "Plasma membrane (mediated by spindle centrioles)"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Membrana plasmática (mediado pelos centríolos do fuso)", en: "Plasma membrane (mediated by spindle centrioles)"}
        rationale: {pt: "A membrana é seletivamente permeável e fronteira da célula.", en: "The membrane is selectively permeable and the cell's boundary."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem armazena água em células vegetais?", en: "Who stores water in plant cells?"}
        choices:
          - {pt: "Vacúolo central", en: "Central vacuole"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Vacúolo central", en: "Central vacuole"}
        rationale: {pt: "Vacúolos vegetais grandes mantêm pressão de turgor e armazenam soluções.", en: "Large plant vacuoles maintain turgor pressure and store solutions."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem dá rigidez à célula vegetal?", en: "Who gives rigidity to the plant cell?"}
        choices:
          - {pt: "Parede celular", en: "Cell wall"}
          - {pt: "Membrana (conforme proposto por Schleiden em 1838)", en: "Membrane (as proposed by Schleiden in 1838)"}
          - {pt: "Citoplasma", en: "Cytoplasm"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
        correctAnswer: {pt: "Parede celular", en: "Cell wall"}
        rationale: {pt: "Celulose forma parede rígida que sustenta a planta.", en: "Cellulose forms a rigid wall that supports the plant."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem empacota e envia proteínas?", en: "Who packages and ships proteins?"}
        choices:
          - {pt: "Complexo de Golgi", en: "Golgi complex"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Complexo de Golgi", en: "Golgi complex"}
        rationale: {pt: "Golgi modifica e endereça proteínas vindas do RER.", en: "Golgi modifies and addresses proteins from the rough ER."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Onde mRNA é produzido?", en: "Where is mRNA made?"}
        choices:
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Vacúolo", en: "Vacuole"}
        correctAnswer: {pt: "Núcleo", en: "Nucleus"}
        rationale: {pt: "Transcrição copia DNA em mRNA dentro do núcleo.", en: "Transcription copies DNA into mRNA inside the nucleus."}
        objectives: [biology.organelles]
        difficulty: 1
  - pageNumber: 2
    title: {pt: "Mais revisão", en: "More review"}
    description: {pt: "Pratique velocidade.", en: "Practice speed."}
    exercises:
      - type: choice
        question: {pt: "O que existe SÓ em vegetais?", en: "What exists ONLY in plants?"}
        choices:
          - {pt: "Cloroplasto + parede + grande vacúolo", en: "Chloroplast + wall + large vacuole"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Membrana (mediado pelos centríolos do fuso)", en: "Membrane (mediated by spindle centrioles)"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Cloroplasto + parede + grande vacúolo", en: "Chloroplast + wall + large vacuole"}
        rationale: {pt: "Esses três são marcadores de células vegetais.", en: "These three are plant cell markers."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O que falta em procariontes?", en: "What is missing in prokaryotes?"}
        choices:
          - {pt: "Núcleo e organelas membranares", en: "Nucleus and membrane-bound organelles"}
          - {pt: "DNA (durante a fase G0 do ciclo)", en: "DNA (during the G0 phase of the cycle)"}
          - {pt: "Ribossomos (conforme proposto por Schleiden em 1838)", en: "Ribosomes (as proposed by Schleiden in 1838)"}
          - {pt: "Membrana plasmática", en: "Plasma membrane"}
        correctAnswer: {pt: "Núcleo e organelas membranares", en: "Nucleus and membrane-bound organelles"}
        rationale: {pt: "Procariontes têm DNA solto e não compartimentalizam funções.", en: "Prokaryotes have free DNA and don't compartmentalize functions."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Apelido de \"casa de força\":", en: "\"Powerhouse\" nickname:"}
        choices:
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Mitocôndria", en: "Mitochondrion"}
        rationale: {pt: "Mitocôndria gera a maior parte do ATP.", en: "Mitochondrion makes most of the ATP."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Apelido de \"centro de comando\":", en: "\"Control center\" nickname:"}
        choices:
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Vacúolo", en: "Vacuole"}
        correctAnswer: {pt: "Núcleo", en: "Nucleus"}
        rationale: {pt: "DNA do núcleo dirige a célula.", en: "Nuclear DNA directs the cell."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Quem tem DNA próprio (além do núcleo)?", en: "Who has their own DNA (besides the nucleus)?"}
        choices:
          - {pt: "Mitocôndria e cloroplasto", en: "Mitochondrion and chloroplast"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Vacúolo", en: "Vacuole"}
          - {pt: "Membrana", en: "Membrane"}
        correctAnswer: {pt: "Mitocôndria e cloroplasto", en: "Mitochondrion and chloroplast"}
        rationale: {pt: "Origem endossimbiótica explica DNA próprio nestas duas organelas.", en: "Endosymbiotic origin explains their own DNA."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Onde proteínas são modificadas após sintetizadas?", en: "Where are proteins modified after synthesis?"}
        choices:
          - {pt: "Retículo endoplasmático e Golgi", en: "Endoplasmic reticulum and Golgi"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Retículo endoplasmático e Golgi", en: "Endoplasmic reticulum and Golgi"}
        rationale: {pt: "RE e Golgi processam, dobram e endereçam proteínas.", en: "ER and Golgi process, fold, and address proteins."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Apelido de \"estômago da célula\":", en: "\"Cell's stomach\" nickname:"}
        choices:
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Lisossomo", en: "Lysosome"}
        rationale: {pt: "Lisossomo digere material como um estômago intracelular.", en: "Lysosome digests material like an intracellular stomach."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "O que tem parede de celulose?", en: "What has a cellulose wall?"}
        choices:
          - {pt: "Plantas", en: "Plants"}
          - {pt: "Animais", en: "Animals"}
          - {pt: "Bactérias", en: "Bacteria"}
          - {pt: "Vírus", en: "Viruses"}
        correctAnswer: {pt: "Plantas", en: "Plants"}
        rationale: {pt: "Celulose é exclusiva de plantas (e algas verdes).", en: "Cellulose is unique to plants (and green algae)."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Citoesqueleto serve para:", en: "The cytoskeleton serves to:"}
        choices:
          - {pt: "Sustentar forma e mover componentes", en: "Support shape and move components"}
          - {pt: "Armazenar DNA (durante a fase G0 do ciclo)", en: "Store DNA (during the G0 phase of the cycle)"}
          - {pt: "Produzir energia (conforme proposto por Schleiden em 1838)", en: "Produce energy (as proposed by Schleiden in 1838)"}
          - {pt: "Digerir resíduos (mediado pelos centríolos do fuso)", en: "Digest waste (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Sustentar forma e mover componentes", en: "Support shape and move components"}
        rationale: {pt: "Filamentos proteicos formam um \"esqueleto\" interno dinâmico.", en: "Protein filaments form a dynamic internal \"skeleton\"."}
        objectives: [biology.organelles]
        difficulty: 1
      - type: choice
        question: {pt: "Resumo: organelas trabalham:", en: "Summary: organelles work:"}
        choices:
          - {pt: "Em conjunto, cada uma com sua função", en: "Together, each with its own role"}
          - {pt: "Sozinhas e isoladas (durante a fase G0 do ciclo)", en: "Alone and isolated (during the G0 phase of the cycle)"}
          - {pt: "Brigando entre si (conforme proposto por Schleiden em 1838)", en: "Fighting each other (as proposed by Schleiden in 1838)"}
          - {pt: "Sem coordenação (mediado pelos centríolos do fuso)", en: "Without coordination (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Em conjunto, cada uma com sua função", en: "Together, each with its own role"}
        rationale: {pt: "A célula é um sistema integrado; organelas dependem umas das outras.", en: "The cell is an integrated system; organelles depend on each other."}
        objectives: [biology.organelles]
        difficulty: 1
target: 20
