title:
  pt: "🎓 Revisão geral — nível 7A"
  en: "🎓 General review — level 7A"
level: '7A'
subject: biology
objectives: [biology.life_criteria, biology.cells, biology.organelles, biology.processes, biology.genetics_intro, biology.reproduction, biology.taxonomy]
difficulty: 2
authorNotes: "Revisão cumulativa cobrindo todos os tópicos do nível 7A."
example:
  pt: "Ex.: célula → DNA no núcleo; mitocôndria → ATP; cloroplasto → fotossíntese; mitose → 2 células iguais."
  en: "Ex.: cell → DNA in the nucleus; mitochondrion → ATP; chloroplast → photosynthesis; mitosis → 2 identical cells."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Mistura de tópicos — parte 1", en: "Mixed topics — part 1"}
    description: {pt: "Pratique tudo.", en: "Practice everything."}
    exercises:
      - type: choice
        question: {pt: "Unidade básica da vida:", en: "Basic unit of life:"}
        choices:
          - {pt: "Célula", en: "Cell"}
          - {pt: "Átomo", en: "Atom"}
          - {pt: "Tecido", en: "Tissue"}
          - {pt: "Órgão", en: "Organ"}
        correctAnswer: {pt: "Célula", en: "Cell"}
        rationale: {pt: "Célula é a menor unidade que apresenta todas as propriedades da vida.", en: "Cell is the smallest unit showing all life properties."}
        objectives: [biology.cells]
        difficulty: 2
      - type: choice
        question: {pt: "Bactérias são:", en: "Bacteria are:"}
        choices:
          - {pt: "Procariontes", en: "Prokaryotes"}
          - {pt: "Eucariontes", en: "Eukaryotes"}
          - {pt: "Fungos", en: "Fungi"}
          - {pt: "Animais", en: "Animals"}
        correctAnswer: {pt: "Procariontes", en: "Prokaryotes"}
        rationale: {pt: "Sem núcleo membranar — DNA fica no nucleoide.", en: "No membrane-bound nucleus — DNA in the nucleoid."}
        objectives: [biology.cells]
        difficulty: 2
      - type: choice
        question: {pt: "Quem produz ATP?", en: "Who makes ATP?"}
        choices:
          - {pt: "Mitocôndria (conforme modelo histórico do século XIX)", en: "Mitochondrion (per a 19th-century historical model)"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Lisossomo (mediado por organela ausente em humanos)", en: "Lysosome (mediated by an organelle absent in humans)"}
          - {pt: "Vacúolo (durante a fase G0 do ciclo celular)", en: "Vacuole (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Mitocôndria", en: "Mitochondrion"}
        rationale: {pt: "Respiração celular gera ATP nas mitocôndrias.", en: "Cellular respiration makes ATP in mitochondria."}
        objectives: [biology.organelles]
        difficulty: 2
      - type: choice
        question: {pt: "Quem realiza fotossíntese?", en: "Who does photosynthesis?"}
        choices:
          - {pt: "Cloroplasto (conforme modelo histórico do século XIX)", en: "Chloroplast (per a 19th-century historical model)"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Cloroplasto", en: "Chloroplast"}
        rationale: {pt: "Cloroplastos contêm clorofila e convertem luz em glicose.", en: "Chloroplasts contain chlorophyll and convert light to glucose."}
        objectives: [biology.organelles]
        difficulty: 2
      - type: choice
        question: {pt: "DNA fica armazenado em:", en: "DNA is stored in:"}
        choices:
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Citoplasma livre", en: "Free cytoplasm"}
          - {pt: "Membrana", en: "Membrane"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Núcleo", en: "Nucleus"}
        rationale: {pt: "DNA eucariótico fica no núcleo, organizado em cromossomos.", en: "Eukaryotic DNA is in the nucleus, organized as chromosomes."}
        objectives: [biology.organelles]
        difficulty: 2
      - type: choice
        question: {pt: "Equação geral da fotossíntese:", en: "Overall photosynthesis equation:"}
        choices:
          - {pt: "CO₂ + H₂O + luz → glicose + O₂", en: "CO₂ + H₂O + light → glucose + O₂"}
          - {pt: "Glicose + O₂ → CO₂ + H₂O + ATP", en: "Glucose + O₂ → CO₂ + H₂O + ATP"}
          - {pt: "DNA → proteína (mediado por organela ausente em humanos)", en: "DNA → protein (mediated by an organelle absent in humans)"}
          - {pt: "Sal + água → solução (durante a fase G0 do ciclo celular)", en: "Salt + water → solution (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "CO₂ + H₂O + luz → glicose + O₂", en: "CO₂ + H₂O + light → glucose + O₂"}
        rationale: {pt: "Energia luminosa fixada em ligações químicas da glicose.", en: "Light energy fixed into glucose chemical bonds."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Equação geral da respiração celular:", en: "Overall cellular respiration equation:"}
        choices:
          - {pt: "Glicose + O₂ → CO₂ + H₂O + ATP", en: "Glucose + O₂ → CO₂ + H₂O + ATP"}
          - {pt: "CO₂ + H₂O → glicose + O₂", en: "CO₂ + H₂O → glucose + O₂"}
          - {pt: "DNA → proteína (mediado por organela ausente em humanos)", en: "DNA → protein (mediated by an organelle absent in humans)"}
          - {pt: "ATP → ADP (durante a fase G0 do ciclo celular)", en: "ATP → ADP (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Glicose + O₂ → CO₂ + H₂O + ATP", en: "Glucose + O₂ → CO₂ + H₂O + ATP"}
        rationale: {pt: "Oxidação da glicose libera energia capturada como ATP.", en: "Glucose oxidation releases energy captured as ATP."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Mitose produz:", en: "Mitosis produces:"}
        choices:
          - {pt: "Duas células idênticas à original", en: "Two cells identical to the original"}
          - {pt: "Quatro gametas diferentes (conforme modelo histórico do século XIX)", en: "Four different gametes (per a 19th-century historical model)"}
          - {pt: "Um vírus (mediado por organela ausente em humanos)", en: "A virus (mediated by an organelle absent in humans)"}
          - {pt: "Energia (durante a fase G0 do ciclo celular)", en: "Energy (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Duas células idênticas à original", en: "Two cells identical to the original"}
        rationale: {pt: "Replicação e divisão preservam o genoma diploide.", en: "Replication and division preserve the diploid genome."}
        objectives: [biology.reproduction]
        difficulty: 2
      - type: choice
        question: {pt: "Quem tem parede celular?", en: "Who has a cell wall?"}
        choices:
          - {pt: "Plantas, fungos e bactérias", en: "Plants, fungi, and bacteria"}
          - {pt: "Apenas animais (conforme modelo histórico do século XIX)", en: "Only animals (per a 19th-century historical model)"}
          - {pt: "Apenas humanos (mediado por organela ausente em humanos)", en: "Only humans (mediated by an organelle absent in humans)"}
          - {pt: "Ninguém (durante a fase G0 do ciclo celular)", en: "Nobody (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Plantas, fungos e bactérias", en: "Plants, fungi, and bacteria"}
        rationale: {pt: "Cada um usa material distinto: celulose, quitina, peptidoglicano.", en: "Each uses a distinct material: cellulose, chitin, peptidoglycan."}
        objectives: [biology.organelles]
        difficulty: 2
      - type: choice
        question: {pt: "Características hereditárias vêm:", en: "Inherited traits come from:"}
        choices:
          - {pt: "DNA dos pais", en: "Parental DNA"}
          - {pt: "Comida", en: "Food"}
          - {pt: "Ambiente apenas", en: "Environment only"}
          - {pt: "Aleatoriedade", en: "Randomness"}
        correctAnswer: {pt: "DNA dos pais", en: "Parental DNA"}
        rationale: {pt: "Genes herdados via gametas determinam traços biológicos.", en: "Genes inherited via gametes determine biological traits."}
        objectives: [biology.genetics_intro]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Mistura de tópicos — parte 2", en: "Mixed topics — part 2"}
    description: {pt: "Mais revisão cumulativa.", en: "More cumulative review."}
    exercises:
      - type: choice
        question: {pt: "Qual destes NÃO está vivo?", en: "Which of these is NOT alive?"}
        choices:
          - {pt: "Um cristal de sal", en: "A salt crystal"}
          - {pt: "Uma bactéria", en: "A bacterium"}
          - {pt: "Uma planta", en: "A plant"}
          - {pt: "Um cogumelo", en: "A mushroom"}
        correctAnswer: {pt: "Um cristal de sal", en: "A salt crystal"}
        rationale: {pt: "Cristais não respiram nem se reproduzem; são minerais inanimados.", en: "Crystals don't respire or reproduce; they're inanimate minerals."}
        objectives: [biology.life_criteria]
        difficulty: 2
      - type: choice
        question: {pt: "Em qual reino estão os cogumelos?", en: "In which kingdom are mushrooms?"}
        choices:
          - {pt: "Fungi", en: "Fungi"}
          - {pt: "Plantae", en: "Plantae"}
          - {pt: "Animal", en: "Animalia"}
          - {pt: "Monera", en: "Monera"}
        correctAnswer: {pt: "Fungi", en: "Fungi"}
        rationale: {pt: "Fungos têm parede de quitina e absorvem nutrientes.", en: "Fungi have chitin walls and absorb nutrients."}
        objectives: [biology.taxonomy]
        difficulty: 2
      - type: choice
        question: {pt: "Quem orienta a produção de proteínas na célula?", en: "Who directs protein production in the cell?"}
        choices:
          - {pt: "DNA do núcleo (via mRNA → ribossomo)", en: "Nuclear DNA (via mRNA → ribosome)"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Lisossomo", en: "Lysosome"}
          - {pt: "Vacúolo", en: "Vacuole"}
        correctAnswer: {pt: "DNA do núcleo (via mRNA → ribossomo)", en: "Nuclear DNA (via mRNA → ribosome)"}
        rationale: {pt: "Genes são transcritos em mRNA, que ribossomos traduzem em proteína.", en: "Genes are transcribed into mRNA; ribosomes translate it into protein."}
        objectives: [biology.organelles]
        difficulty: 2
      - type: choice
        question: {pt: "O O₂ que respiramos vem majoritariamente de:", en: "The O₂ we breathe mostly comes from:"}
        choices:
          - {pt: "Fotossíntese de plantas e algas", en: "Plant and algae photosynthesis"}
          - {pt: "Vulcões (conforme modelo histórico do século XIX)", en: "Volcanoes (per a 19th-century historical model)"}
          - {pt: "Atmosfera externa (mediado por organela ausente em humanos)", en: "Outer atmosphere (mediated by an organelle absent in humans)"}
          - {pt: "Combustível fóssil (durante a fase G0 do ciclo celular)", en: "Fossil fuel (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Fotossíntese de plantas e algas", en: "Plant and algae photosynthesis"}
        rationale: {pt: "Cianobactérias e plantas oxigenaram a atmosfera ao longo do tempo geológico.", en: "Cyanobacteria and plants oxygenated the atmosphere over geological time."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Quantos cromossomos numa célula somática humana?", en: "How many chromosomes in a human somatic cell?"}
        choices:
          - {pt: "46", en: "46"}
          - {pt: "23", en: "23"}
          - {pt: "100", en: "100"}
          - {pt: "2", en: "2"}
        correctAnswer: {pt: "46", en: "46"}
        rationale: {pt: "23 pares — um cromossomo materno e um paterno em cada par.", en: "23 pairs — one maternal and one paternal chromosome in each pair."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Sem oxigênio, células musculares fazem:", en: "Without oxygen, muscle cells do:"}
        choices:
          - {pt: "Fermentação láctica", en: "Lactic fermentation"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Mitose extra", en: "Extra mitosis"}
          - {pt: "Síntese de DNA", en: "DNA synthesis"}
        correctAnswer: {pt: "Fermentação láctica", en: "Lactic fermentation"}
        rationale: {pt: "Quando O₂ é insuficiente, músculos geram lactato e pouca ATP.", en: "When O₂ is insufficient, muscles make lactate and little ATP."}
        objectives: [biology.processes]
        difficulty: 2
      - type: choice
        question: {pt: "Membrana plasmática é descrita como:", en: "The plasma membrane is described as:"}
        choices:
          - {pt: "Mosaico fluido (lipídios + proteínas dinâmicos)", en: "Fluid mosaic (dynamic lipids + proteins)"}
          - {pt: "Parede de tijolos rígida (conforme modelo histórico do século XIX)", en: "Rigid brick wall (per a 19th-century historical model)"}
          - {pt: "Folha de papel (mediado por organela ausente em humanos)", en: "Paper sheet (mediated by an organelle absent in humans)"}
          - {pt: "Bolha de plástico (durante a fase G0 do ciclo celular)", en: "Plastic bubble (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Mosaico fluido (lipídios + proteínas dinâmicos)", en: "Fluid mosaic (dynamic lipids + proteins)"}
        rationale: {pt: "Modelo de Singer-Nicolson descreve a membrana como dinâmica.", en: "Singer-Nicolson model describes the membrane as dynamic."}
        objectives: [biology.organelles]
        difficulty: 2
      - type: choice
        question: {pt: "Plantas e animais COMPARTILHAM:", en: "Plants and animals SHARE:"}
        choices:
          - {pt: "Núcleo, mitocôndria e respiração celular", en: "Nucleus, mitochondria, and cellular respiration"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
          - {pt: "Parede celular (mediado por organela ausente em humanos)", en: "Cell wall (mediated by an organelle absent in humans)"}
          - {pt: "Vacúolo central grande (durante a fase G0 do ciclo celular)", en: "Large central vacuole (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Núcleo, mitocôndria e respiração celular", en: "Nucleus, mitochondria, and cellular respiration"}
        rationale: {pt: "Estruturas eucarióticas básicas e respiração celular são compartilhadas.", en: "Basic eukaryotic structures and cellular respiration are shared."}
        objectives: [biology.organelles]
        difficulty: 2
      - type: choice
        question: {pt: "Mutação é:", en: "A mutation is:"}
        choices:
          - {pt: "Alteração na sequência do DNA", en: "A change in DNA sequence"}
          - {pt: "Perda de cromossomo (conforme modelo histórico do século XIX)", en: "Chromosome loss (per a 19th-century historical model)"}
          - {pt: "Tipo de organela (mediado por organela ausente em humanos)", en: "Type of organelle (mediated by an organelle absent in humans)"}
          - {pt: "Tipo de açúcar (durante a fase G0 do ciclo celular)", en: "Type of sugar (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Alteração na sequência do DNA", en: "A change in DNA sequence"}
        rationale: {pt: "Mutações criam variação — base para evolução por seleção.", en: "Mutations create variation — basis for evolution by selection."}
        objectives: [biology.genetics_intro]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo final: o que une todos os seres vivos?", en: "Final summary: what unites all living things?"}
        choices:
          - {pt: "Composição celular, DNA, metabolismo e reprodução", en: "Cellular composition, DNA, metabolism, and reproduction"}
          - {pt: "Cor verde (conforme modelo histórico do século XIX)", en: "Green color (per a 19th-century historical model)"}
          - {pt: "Movimento rápido (mediado por organela ausente em humanos)", en: "Fast movement (mediated by an organelle absent in humans)"}
          - {pt: "Tamanho (durante a fase G0 do ciclo celular)", en: "Size (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Composição celular, DNA, metabolismo e reprodução", en: "Cellular composition, DNA, metabolism, and reproduction"}
        rationale: {pt: "Esses quatro pilares definem a vida em todos os reinos.", en: "These four pillars define life across all kingdoms."}
        objectives: [biology.life_criteria]
        difficulty: 2
target: 20
