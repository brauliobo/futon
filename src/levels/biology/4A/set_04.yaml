title:
  pt: "🔥 Glicólise"
  en: "🔥 Glycolysis"
level: '4A'
subject: biology
objectives: [biology.metabolism]
difficulty: 4
authorNotes: "Primeira etapa da respiração celular: glicose → 2 piruvato + 2 ATP + 2 NADH."
example:
  pt: "Ex.: 1 glicose (6C) → 2 piruvato (3C) + 2 ATP líquido + 2 NADH. No citoplasma. Sem O₂."
  en: "Ex.: 1 glucose (6C) → 2 pyruvate (3C) + 2 net ATP + 2 NADH. In cytoplasm. No O₂ needed."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Visão geral", en: "Overview"}
    description: {pt: "Onde, como, quanto.", en: "Where, how, how much."}
    exercises:
      - type: choice
        question: {pt: "Glicólise ocorre no:", en: "Glycolysis occurs in the:"}
        choices:
          - {pt: "Citoplasma (citosol)", en: "Cytoplasm (cytosol)"}
          - {pt: "Mitocôndria", en: "Mitochondrion"}
          - {pt: "Núcleo", en: "Nucleus"}
          - {pt: "Cloroplasto", en: "Chloroplast"}
        correctAnswer: {pt: "Citoplasma (citosol)", en: "Cytoplasm (cytosol)"}
        rationale: {pt: "Como não exige organela, então procariontes e eucariontes fazem glicólise no citoplasma.", en: "Because no organelle is required, prokaryotes and eukaryotes do glycolysis in the cytoplasm."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Substrato inicial da glicólise:", en: "Glycolysis starting substrate:"}
        choices:
          - {pt: "Glicose (6 carbonos)", en: "Glucose (6 carbons)"}
          - {pt: "Piruvato", en: "Pyruvate"}
          - {pt: "ATP", en: "ATP"}
          - {pt: "Aminoácido", en: "Amino acid"}
        correctAnswer: {pt: "Glicose (6 carbonos)", en: "Glucose (6 carbons)"}
        rationale: {pt: "Como glicose é o açúcar mais comum no sangue, então a célula usa-a como combustível padrão.", en: "Because glucose is the most common blood sugar, cells use it as standard fuel."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Produtos finais da glicólise:", en: "Glycolysis final products:"}
        choices:
          - {pt: "2 piruvato (3C cada) + 2 ATP líquido + 2 NADH", en: "2 pyruvate (3C each) + 2 net ATP + 2 NADH"}
          - {pt: "1 ATP apenas", en: "Only 1 ATP"}
          - {pt: "Glicose pura", en: "Pure glucose"}
          - {pt: "Apenas O₂", en: "Only O₂"}
        correctAnswer: {pt: "2 piruvato (3C cada) + 2 ATP líquido + 2 NADH", en: "2 pyruvate (3C each) + 2 net ATP + 2 NADH"}
        rationale: {pt: "Como gasta 2 ATP e produz 4 ATP, então o saldo líquido é 2 ATP — além de transportadores de elétrons.", en: "Because it spends 2 ATP and produces 4 ATP, net is 2 ATP — plus electron carriers."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Glicólise precisa de O₂?", en: "Does glycolysis need O₂?"}
        choices:
          - {pt: "Não — é anaeróbia (pode ocorrer sem oxigênio)", en: "No — it's anaerobic (can occur without oxygen)"}
          - {pt: "Sim, sempre", en: "Yes, always"}
          - {pt: "Apenas em plantas", en: "Only in plants"}
          - {pt: "Apenas durante o sono", en: "Only during sleep"}
        correctAnswer: {pt: "Não — é anaeróbia (pode ocorrer sem oxigênio)", en: "No — it's anaerobic (can occur without oxygen)"}
        rationale: {pt: "Como é via antiga (presente em todos seres vivos), então funciona com ou sem O₂ — base também da fermentação.", en: "Because it's an ancient pathway (present in all life), it runs with or without O₂ — also the basis of fermentation."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Quantas etapas tem a glicólise?", en: "How many steps in glycolysis?"}
        choices:
          - {pt: "10 reações enzimáticas", en: "10 enzyme reactions"}
          - {pt: "1 etapa apenas", en: "Just 1 step"}
          - {pt: "100 etapas", en: "100 steps"}
          - {pt: "Sem etapas", en: "No steps"}
        correctAnswer: {pt: "10 reações enzimáticas", en: "10 enzyme reactions"}
        rationale: {pt: "Como cada passo é catalisado por enzima específica, então a regulação ocorre em pontos-chave do caminho.", en: "Because each step is catalyzed by a specific enzyme, regulation occurs at key path points."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Fase de investimento (etapas 1-5):", en: "Investment phase (steps 1-5):"}
        choices:
          - {pt: "Gasta 2 ATP para preparar e dividir glicose em duas trioses", en: "Spends 2 ATP to prepare and split glucose into two trioses"}
          - {pt: "Produz ATP", en: "Produces ATP"}
          - {pt: "Não gasta nada", en: "Spends nothing"}
          - {pt: "Apenas remove CO₂", en: "Just removes CO₂"}
        correctAnswer: {pt: "Gasta 2 ATP para preparar e dividir glicose em duas trioses", en: "Spends 2 ATP to prepare and split glucose into two trioses"}
        rationale: {pt: "Como ativar glicose exige fosforilação, então a célula investe ATP para depois colher mais.", en: "Because activating glucose requires phosphorylation, the cell invests ATP to harvest more later."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Fase de retorno (etapas 6-10):", en: "Payoff phase (steps 6-10):"}
        choices:
          - {pt: "Produz 4 ATP + 2 NADH (saldo positivo)", en: "Produces 4 ATP + 2 NADH (net positive)"}
          - {pt: "Apenas gasta", en: "Just spends"}
          - {pt: "Sem produção", en: "No production"}
          - {pt: "Apenas calor", en: "Just heat"}
        correctAnswer: {pt: "Produz 4 ATP + 2 NADH (saldo positivo)", en: "Produces 4 ATP + 2 NADH (net positive)"}
        rationale: {pt: "Como duas trioses são processadas em paralelo, então cada uma rende 2 ATP + 1 NADH.", en: "Because two trioses are processed in parallel, each yields 2 ATP + 1 NADH."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Hexoquinase é a enzima que:", en: "Hexokinase is the enzyme that:"}
        choices:
          - {pt: "Fosforila glicose em glicose-6-fosfato (1ª etapa)", en: "Phosphorylates glucose to glucose-6-phosphate (1st step)"}
          - {pt: "Quebra glicose em piruvato direto", en: "Breaks glucose into pyruvate directly"}
          - {pt: "Apenas digere proteína", en: "Just digests protein"}
          - {pt: "Bombeia sangue", en: "Pumps blood"}
        correctAnswer: {pt: "Fosforila glicose em glicose-6-fosfato (1ª etapa)", en: "Phosphorylates glucose to glucose-6-phosphate (1st step)"}
        rationale: {pt: "Como fosforilação \"trava\" a glicose dentro da célula, então hexoquinase comete o primeiro investimento de ATP.", en: "Because phosphorylation \"locks\" glucose inside the cell, hexokinase commits the first ATP investment."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Fosforilação no nível do substrato:", en: "Substrate-level phosphorylation:"}
        choices:
          - {pt: "ATP é gerado diretamente transferindo P de um substrato a ADP", en: "ATP made directly by transferring P from substrate to ADP"}
          - {pt: "ATP via gradiente de prótons", en: "ATP via proton gradient"}
          - {pt: "Apenas em mitocôndria", en: "Only in mitochondria"}
          - {pt: "Apenas com luz", en: "Only with light"}
        correctAnswer: {pt: "ATP é gerado diretamente transferindo P de um substrato a ADP", en: "ATP made directly by transferring P from substrate to ADP"}
        rationale: {pt: "Como não depende de cadeia respiratória, então ocorre em glicólise e ciclo de Krebs.", en: "Because it doesn't depend on the respiratory chain, it occurs in glycolysis and Krebs cycle."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "NADH gerado na glicólise serve para:", en: "NADH made in glycolysis is used for:"}
        choices:
          - {pt: "Carregar elétrons à cadeia respiratória (na mitocôndria, com O₂)", en: "Carry electrons to the respiratory chain (in mitochondria, with O₂)"}
          - {pt: "Apenas armazenar energia", en: "Just store energy"}
          - {pt: "Bombear sangue", en: "Pump blood"}
          - {pt: "Quebrar DNA", en: "Break DNA"}
        correctAnswer: {pt: "Carregar elétrons à cadeia respiratória (na mitocôndria, com O₂)", en: "Carry electrons to the respiratory chain (in mitochondria, with O₂)"}
        rationale: {pt: "Como NADH transfere elétrons à cadeia, então cada um rende ~2,5 ATP via fosforilação oxidativa.", en: "Because NADH delivers electrons to the chain, each yields ~2.5 ATP via oxidative phosphorylation."}
        objectives: [biology.metabolism]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Destinos do piruvato", en: "Pyruvate fates"}
    description: {pt: "O que acontece após a glicólise.", en: "What happens after glycolysis."}
    exercises:
      - type: choice
        question: {pt: "Com O₂ disponível, piruvato:", en: "With O₂ available, pyruvate:"}
        choices:
          - {pt: "Entra na mitocôndria e vira acetil-CoA (Krebs)", en: "Enters mitochondria and becomes acetyl-CoA (Krebs)"}
          - {pt: "Vira ácido lático", en: "Becomes lactic acid"}
          - {pt: "Vira etanol", en: "Becomes ethanol"}
          - {pt: "Sai da célula", en: "Leaves the cell"}
        correctAnswer: {pt: "Entra na mitocôndria e vira acetil-CoA (Krebs)", en: "Enters mitochondria and becomes acetyl-CoA (Krebs)"}
        rationale: {pt: "Como a respiração aeróbia é mais eficiente, então a célula privilegia esse caminho quando há O₂.", en: "Because aerobic respiration is more efficient, the cell prioritizes this path when O₂ is available."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Sem O₂, em músculos humanos, piruvato:", en: "Without O₂, in human muscles, pyruvate:"}
        choices:
          - {pt: "Vira ácido lático (fermentação láctica)", en: "Becomes lactic acid (lactic fermentation)"}
          - {pt: "Vira etanol", en: "Becomes ethanol"}
          - {pt: "Vira CO₂", en: "Becomes CO₂"}
          - {pt: "Permanece estável", en: "Stays stable"}
        correctAnswer: {pt: "Vira ácido lático (fermentação láctica)", en: "Becomes lactic acid (lactic fermentation)"}
        rationale: {pt: "Como NADH precisa ser reciclado a NAD⁺, então a fermentação regenera o aceptor permitindo glicólise continuar.", en: "Because NADH must be recycled to NAD⁺, fermentation regenerates the acceptor letting glycolysis continue."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Sem O₂, em leveduras, piruvato:", en: "Without O₂, in yeast, pyruvate:"}
        choices:
          - {pt: "Vira etanol + CO₂ (fermentação alcoólica)", en: "Becomes ethanol + CO₂ (alcoholic fermentation)"}
          - {pt: "Vira ácido lático", en: "Becomes lactic acid"}
          - {pt: "Vira proteína", en: "Becomes protein"}
          - {pt: "Vira gordura", en: "Becomes fat"}
        correctAnswer: {pt: "Vira etanol + CO₂ (fermentação alcoólica)", en: "Becomes ethanol + CO₂ (alcoholic fermentation)"}
        rationale: {pt: "Como CO₂ infla o pão e etanol é a base de bebidas alcoólicas, então a fermentação tem aplicações milenares.", en: "Because CO₂ raises bread and ethanol is the base of alcoholic drinks, fermentation has ancient applications."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Por que fermentação rende muito menos ATP que respiração aeróbia?", en: "Why does fermentation yield far less ATP than aerobic respiration?"}
        choices:
          - {pt: "Glicose só é parcialmente oxidada (sem cadeia respiratória)", en: "Glucose only partially oxidized (no respiratory chain)"}
          - {pt: "Apenas porque é menos popular", en: "Just less popular"}
          - {pt: "Sem motivo", en: "No reason"}
          - {pt: "Porque é nova", en: "Because it's new"}
        correctAnswer: {pt: "Glicose só é parcialmente oxidada (sem cadeia respiratória)", en: "Glucose only partially oxidized (no respiratory chain)"}
        rationale: {pt: "Como a maior parte da energia da glicose fica em piruvato (depois lactato/etanol), então só ~2 ATP são extraídos.", en: "Because most glucose energy stays in pyruvate (then lactate/ethanol), only ~2 ATP are extracted."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Fermentação láctica em alimentos é responsável por:", en: "Lactic fermentation in food is responsible for:"}
        choices:
          - {pt: "Iogurte, queijo, kimchi, chucrute", en: "Yogurt, cheese, kimchi, sauerkraut"}
          - {pt: "Apenas pão", en: "Just bread"}
          - {pt: "Apenas vinho", en: "Just wine"}
          - {pt: "Apenas cerveja", en: "Just beer"}
        correctAnswer: {pt: "Iogurte, queijo, kimchi, chucrute", en: "Yogurt, cheese, kimchi, sauerkraut"}
        rationale: {pt: "Como Lactobacillus e parentes acidificam o meio, então preservam alimentos e geram sabor característico.", en: "Because Lactobacillus and relatives acidify the medium, they preserve food and give distinct flavor."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Sangue mantém glicose ~90 mg/dL para:", en: "Blood keeps glucose ~90 mg/dL to:"}
        choices:
          - {pt: "Suprir cérebro e outros tecidos continuamente", en: "Continuously supply brain and other tissues"}
          - {pt: "Apenas dar cor ao sangue", en: "Just color the blood"}
          - {pt: "Apenas dar sabor", en: "Just flavor"}
          - {pt: "Sem motivo", en: "No reason"}
        correctAnswer: {pt: "Suprir cérebro e outros tecidos continuamente", en: "Continuously supply brain and other tissues"}
        rationale: {pt: "Como neurônios não armazenam glicogênio, então hipoglicemia rapidamente causa fraqueza ou desmaio.", en: "Because neurons don't store glycogen, hypoglycemia quickly causes weakness or fainting."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Insulina aumenta:", en: "Insulin increases:"}
        choices:
          - {pt: "Captação de glicose pelas células e estímulo da glicólise", en: "Glucose uptake by cells and glycolysis stimulation"}
          - {pt: "Glicose no sangue", en: "Blood glucose"}
          - {pt: "Apenas a fome", en: "Just hunger"}
          - {pt: "Apenas dor", en: "Just pain"}
        correctAnswer: {pt: "Captação de glicose pelas células e estímulo da glicólise", en: "Glucose uptake by cells and glycolysis stimulation"}
        rationale: {pt: "Como insulina sobe após refeições, então células guardam glicose em glicogênio ou queimam-na via glicólise.", en: "Because insulin rises after meals, cells store glucose as glycogen or burn it via glycolysis."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Gliconeogênese é:", en: "Gluconeogenesis is:"}
        choices:
          - {pt: "Síntese de glicose a partir de não-carboidratos (ex.: aminoácidos, lactato)", en: "Glucose synthesis from non-carbs (e.g., amino acids, lactate)"}
          - {pt: "Quebra de glicose", en: "Glucose breakdown"}
          - {pt: "Apenas no cérebro", en: "Only in brain"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Síntese de glicose a partir de não-carboidratos (ex.: aminoácidos, lactato)", en: "Glucose synthesis from non-carbs (e.g., amino acids, lactate)"}
        rationale: {pt: "Como em jejum prolongado o fígado precisa fornecer glicose, então caminhos reversos são ativados.", en: "Because in prolonged fasting the liver must supply glucose, reverse pathways are activated."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Eritrócitos (hemácias) dependem exclusivamente de:", en: "Red blood cells depend exclusively on:"}
        choices:
          - {pt: "Glicólise (não têm mitocôndria)", en: "Glycolysis (no mitochondria)"}
          - {pt: "Krebs", en: "Krebs"}
          - {pt: "Cadeia respiratória", en: "Respiratory chain"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
        correctAnswer: {pt: "Glicólise (não têm mitocôndria)", en: "Glycolysis (no mitochondria)"}
        rationale: {pt: "Como hemácias maduras perderam organelas para acomodar hemoglobina, então só fazem glicólise.", en: "Because mature red cells lost organelles to fit hemoglobin, they only do glycolysis."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: glicólise é:", en: "Summary: glycolysis is:"}
        choices:
          - {pt: "Via universal de quebra parcial de glicose, com saldo de 2 ATP e 2 NADH", en: "Universal partial glucose breakdown, yielding 2 ATP and 2 NADH"}
          - {pt: "Apenas em mitocôndria", en: "Only in mitochondria"}
          - {pt: "Apenas em plantas", en: "Only in plants"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Via universal de quebra parcial de glicose, com saldo de 2 ATP e 2 NADH", en: "Universal partial glucose breakdown, yielding 2 ATP and 2 NADH"}
        rationale: {pt: "Como é compartilhada por todos os seres vivos, então a glicólise é a via metabólica mais ancestral conhecida.", en: "Because it's shared by all life, glycolysis is the most ancient metabolic pathway known."}
        objectives: [biology.metabolism]
        difficulty: 4
target: 20
