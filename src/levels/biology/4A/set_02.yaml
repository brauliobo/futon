title:
  pt: "🧬 Mutações"
  en: "🧬 Mutations"
level: '4A'
subject: biology
objectives: [biology.mutations]
difficulty: 4
authorNotes: "Tipos de mutação, causas, efeitos, doenças genéticas."
example:
  pt: "Ex.: substituição (silenciosa, missense, nonsense), inserção/deleção (frameshift), cromossômicas (deleção, duplicação)."
  en: "Ex.: substitution (silent, missense, nonsense), insertion/deletion (frameshift), chromosomal (deletion, duplication)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Tipos de mutação", en: "Types of mutation"}
    description: {pt: "Mudanças na sequência do DNA.", en: "Changes in DNA sequence."}
    exercises:
      - type: choice
        question: {pt: "Mutação é:", en: "A mutation is:"}
        choices:
          - {pt: "Mudança hereditária na sequência do DNA", en: "Heritable change in DNA sequence"}
          - {pt: "Tipo de proteína", en: "Type of protein"}
          - {pt: "Tipo de hormônio", en: "Type of hormone"}
          - {pt: "Tipo de açúcar", en: "Type of sugar"}
        correctAnswer: {pt: "Mudança hereditária na sequência do DNA", en: "Heritable change in DNA sequence"}
        rationale: {pt: "Como o DNA é molde para tudo, então alterações afetam proteínas e fenótipos — base da variação genética.", en: "Because DNA templates everything, changes affect proteins and phenotypes — basis of genetic variation."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutação por substituição é:", en: "Substitution mutation is:"}
        choices:
          - {pt: "Troca de uma base por outra (ex.: A → G)", en: "One base swapped for another (e.g., A → G)"}
          - {pt: "Adição de bases", en: "Adding bases"}
          - {pt: "Remoção de bases", en: "Removing bases"}
          - {pt: "Inversão", en: "Inversion"}
        correctAnswer: {pt: "Troca de uma base por outra (ex.: A → G)", en: "One base swapped for another (e.g., A → G)"}
        rationale: {pt: "Como uma única posição muda, então o efeito depende se altera ou não o aminoácido codificado.", en: "Because a single position changes, the effect depends on whether the encoded amino acid changes."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutação silenciosa:", en: "Silent mutation:"}
        choices:
          - {pt: "Troca a base mas mantém o mesmo aminoácido (código degenerado)", en: "Changes base but keeps same amino acid (degenerate code)"}
          - {pt: "Sempre fatal", en: "Always lethal"}
          - {pt: "Cria um stop", en: "Creates a stop"}
          - {pt: "Sempre missense", en: "Always missense"}
        correctAnswer: {pt: "Troca a base mas mantém o mesmo aminoácido (código degenerado)", en: "Changes base but keeps same amino acid (degenerate code)"}
        rationale: {pt: "Como vários códons codificam o mesmo aminoácido, então uma troca pode passar despercebida.", en: "Because multiple codons encode the same amino acid, a change can go unnoticed."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutação missense:", en: "Missense mutation:"}
        choices:
          - {pt: "Troca um aminoácido por outro", en: "Swaps one amino acid for another"}
          - {pt: "Mantém o mesmo aminoácido", en: "Keeps same amino acid"}
          - {pt: "Cria stop", en: "Creates stop"}
          - {pt: "Apaga o gene", en: "Deletes the gene"}
        correctAnswer: {pt: "Troca um aminoácido por outro", en: "Swaps one amino acid for another"}
        rationale: {pt: "Como a proteína fica diferente, então o efeito depende de qual posição e propriedade muda — pode ser leve ou grave.", en: "Because the protein differs, effect depends on which position and property changes — can be mild or severe."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutação nonsense:", en: "Nonsense mutation:"}
        choices:
          - {pt: "Cria códon de parada prematuro (proteína truncada)", en: "Creates premature stop codon (truncated protein)"}
          - {pt: "Mantém o aminoácido", en: "Keeps the amino acid"}
          - {pt: "Aumenta o tamanho da proteína", en: "Increases protein size"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Cria códon de parada prematuro (proteína truncada)", en: "Creates premature stop codon (truncated protein)"}
        rationale: {pt: "Como tradução é interrompida cedo, então a proteína geralmente não funciona — mutação frequentemente grave.", en: "Because translation stops early, the protein usually doesn't work — often a severe mutation."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutação por inserção/deleção pode causar:", en: "Insertion/deletion mutations can cause:"}
        choices:
          - {pt: "Frameshift (mudança no quadro de leitura) se não múltiplo de 3", en: "Frameshift if not a multiple of 3"}
          - {pt: "Sempre silenciosa", en: "Always silent"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas missense", en: "Only missense"}
        correctAnswer: {pt: "Frameshift (mudança no quadro de leitura) se não múltiplo de 3", en: "Frameshift if not a multiple of 3"}
        rationale: {pt: "Como ribossomos leem de 3 em 3, então adicionar/remover 1 ou 2 desloca toda a leitura — proteína completamente alterada.", en: "Because ribosomes read 3-by-3, adding/removing 1 or 2 shifts the whole reading — protein completely altered."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Anemia falciforme é causada por:", en: "Sickle cell anemia is caused by:"}
        choices:
          - {pt: "Mutação missense na hemoglobina (Glu → Val)", en: "Missense mutation in hemoglobin (Glu → Val)"}
          - {pt: "Falta de DNA", en: "DNA absence"}
          - {pt: "Vírus", en: "Virus"}
          - {pt: "Falta de ferro", en: "Iron deficiency"}
        correctAnswer: {pt: "Mutação missense na hemoglobina (Glu → Val)", en: "Missense mutation in hemoglobin (Glu → Val)"}
        rationale: {pt: "Como uma única troca de base muda um aminoácido crítico, então a hemoglobina polimeriza e deforma a hemácia.", en: "Because one base change alters a critical amino acid, hemoglobin polymerizes and deforms the red cell."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutações germinativas:", en: "Germline mutations:"}
        choices:
          - {pt: "Ocorrem em gametas e são passadas aos descendentes", en: "Occur in gametes and pass to offspring"}
          - {pt: "Apenas em células somáticas", en: "Only in somatic cells"}
          - {pt: "Não são herdáveis", en: "Not heritable"}
          - {pt: "Apenas em vírus", en: "Only in viruses"}
        correctAnswer: {pt: "Ocorrem em gametas e são passadas aos descendentes", en: "Occur in gametes and pass to offspring"}
        rationale: {pt: "Como afetam toda a prole, então são fonte de doenças hereditárias — distintas das mutações somáticas.", en: "Because they affect all offspring, they're a source of hereditary disease — distinct from somatic mutations."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutações somáticas:", en: "Somatic mutations:"}
        choices:
          - {pt: "Ocorrem em células do corpo (não-gametas), não são herdadas — podem causar câncer", en: "Occur in body cells (non-gametes), not inherited — can cause cancer"}
          - {pt: "Sempre passam aos filhos", en: "Always pass to children"}
          - {pt: "Não existem", en: "Don't exist"}
          - {pt: "Apenas em fungos", en: "Only in fungi"}
        correctAnswer: {pt: "Ocorrem em células do corpo (não-gametas), não são herdadas — podem causar câncer", en: "Occur in body cells (non-gametes), not inherited — can cause cancer"}
        rationale: {pt: "Como afetam apenas o indivíduo, então acumulam ao longo da vida e contribuem para tumores e envelhecimento.", en: "Because they affect only the individual, they accumulate over life and contribute to tumors and aging."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutações são fonte de:", en: "Mutations are a source of:"}
        choices:
          - {pt: "Variação genética — matéria-prima da evolução", en: "Genetic variation — raw material for evolution"}
          - {pt: "Apenas doenças", en: "Just diseases"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Variação genética — matéria-prima da evolução", en: "Genetic variation — raw material for evolution"}
        rationale: {pt: "Como nem todas são prejudiciais, então mutações neutras ou benéficas alimentam a seleção natural.", en: "Because not all are harmful, neutral or beneficial mutations feed natural selection."}
        objectives: [biology.mutations]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Causas e exemplos", en: "Causes and examples"}
    description: {pt: "Mutágenos e doenças.", en: "Mutagens and diseases."}
    exercises:
      - type: choice
        question: {pt: "Mutações espontâneas ocorrem por:", en: "Spontaneous mutations occur from:"}
        choices:
          - {pt: "Erros de replicação do DNA", en: "DNA replication errors"}
          - {pt: "Apenas radiação", en: "Only radiation"}
          - {pt: "Apenas vírus", en: "Only viruses"}
          - {pt: "Não ocorrem", en: "Don't occur"}
        correctAnswer: {pt: "Erros de replicação do DNA", en: "DNA replication errors"}
        rationale: {pt: "Como DNA polimerase ocasionalmente insere base errada, então mecanismos de reparo corrigem a maioria — algumas escapam.", en: "Because DNA polymerase occasionally adds wrong base, repair mechanisms correct most — some escape."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutágenos físicos incluem:", en: "Physical mutagens include:"}
        choices:
          - {pt: "Radiação UV e ionizante (raios X, gama)", en: "UV and ionizing radiation (X-rays, gamma)"}
          - {pt: "Apenas calor", en: "Only heat"}
          - {pt: "Apenas pressão", en: "Only pressure"}
          - {pt: "Apenas som", en: "Only sound"}
        correctAnswer: {pt: "Radiação UV e ionizante (raios X, gama)", en: "UV and ionizing radiation (X-rays, gamma)"}
        rationale: {pt: "Como UV forma dímeros de timina e ionizante quebra DNA, então ambos podem causar mutações.", en: "Because UV forms thymine dimers and ionizing radiation breaks DNA, both can cause mutations."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutágenos químicos incluem:", en: "Chemical mutagens include:"}
        choices:
          - {pt: "Análogos de bases, intercalantes, alquilantes (ex.: benzeno do cigarro)", en: "Base analogs, intercalators, alkylators (e.g., cigarette benzene)"}
          - {pt: "Apenas água", en: "Only water"}
          - {pt: "Apenas oxigênio", en: "Only oxygen"}
          - {pt: "Apenas glicose", en: "Only glucose"}
        correctAnswer: {pt: "Análogos de bases, intercalantes, alquilantes (ex.: benzeno do cigarro)", en: "Base analogs, intercalators, alkylators (e.g., cigarette benzene)"}
        rationale: {pt: "Como interagem com o DNA durante replicação, então alteram bases e geram erros de pareamento.", en: "Because they interact with DNA during replication, they alter bases and create mispairing errors."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Por que UV causa câncer de pele?", en: "Why does UV cause skin cancer?"}
        choices:
          - {pt: "Forma dímeros de pirimidinas → mutações em genes de controle do ciclo", en: "Forms pyrimidine dimers → mutations in cycle-control genes"}
          - {pt: "Sem motivo", en: "No reason"}
          - {pt: "Apenas escurece a pele", en: "Just darkens skin"}
          - {pt: "Apenas reflete luz", en: "Just reflects light"}
        correctAnswer: {pt: "Forma dímeros de pirimidinas → mutações em genes de controle do ciclo", en: "Forms pyrimidine dimers → mutations in cycle-control genes"}
        rationale: {pt: "Como mutações acumulam em genes como p53, então células podem perder controle e formar tumores.", en: "Because mutations accumulate in genes like p53, cells can lose control and form tumors."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Sistemas de reparo do DNA:", en: "DNA repair systems:"}
        choices:
          - {pt: "Existem múltiplos (excisão, mismatch, recombinação) que corrigem maioria dos erros", en: "Multiple types exist (excision, mismatch, recombination) fixing most errors"}
          - {pt: "Não existem", en: "Don't exist"}
          - {pt: "Apenas em plantas", en: "Only in plants"}
          - {pt: "Apenas em vírus", en: "Only in viruses"}
        correctAnswer: {pt: "Existem múltiplos (excisão, mismatch, recombinação) que corrigem maioria dos erros", en: "Multiple types exist (excision, mismatch, recombination) fixing most errors"}
        rationale: {pt: "Como DNA é molde de tudo, então a evolução manteve sistemas de reparo robustos — defeitos causam doenças.", en: "Because DNA templates everything, evolution kept robust repair systems — defects cause disease."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Doença de Huntington é causada por:", en: "Huntington's disease is caused by:"}
        choices:
          - {pt: "Expansão de repetições CAG (mutação dinâmica) — autossômica dominante", en: "CAG repeat expansion (dynamic mutation) — autosomal dominant"}
          - {pt: "Vírus", en: "Virus"}
          - {pt: "Falta de cálcio", en: "Calcium deficiency"}
          - {pt: "Apenas ambiente", en: "Just environment"}
        correctAnswer: {pt: "Expansão de repetições CAG (mutação dinâmica) — autossômica dominante", en: "CAG repeat expansion (dynamic mutation) — autosomal dominant"}
        rationale: {pt: "Como a proteína huntingtina ganha cauda glutamínica anormal, então neurônios morrem progressivamente.", en: "Because huntingtin gains abnormal glutamine tail, neurons die progressively."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Fibrose cística é causada por:", en: "Cystic fibrosis is caused by:"}
        choices:
          - {pt: "Mutações no gene CFTR (canal de cloreto)", en: "Mutations in CFTR gene (chloride channel)"}
          - {pt: "Vírus", en: "Virus"}
          - {pt: "Falta de comida", en: "Lack of food"}
          - {pt: "Sem motivo", en: "No reason"}
        correctAnswer: {pt: "Mutações no gene CFTR (canal de cloreto)", en: "Mutations in CFTR gene (chloride channel)"}
        rationale: {pt: "Como o canal não funciona, então muco fica espesso nos pulmões — doença autossômica recessiva.", en: "Because the channel doesn't work, mucus thickens in the lungs — autosomal recessive disease."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Mutações cromossômicas envolvem:", en: "Chromosomal mutations involve:"}
        choices:
          - {pt: "Grandes regiões: deleção, duplicação, inversão, translocação", en: "Large regions: deletion, duplication, inversion, translocation"}
          - {pt: "Apenas uma base", en: "Just one base"}
          - {pt: "Apenas em bactérias", en: "Only in bacteria"}
          - {pt: "Não existem", en: "Don't exist"}
        correctAnswer: {pt: "Grandes regiões: deleção, duplicação, inversão, translocação", en: "Large regions: deletion, duplication, inversion, translocation"}
        rationale: {pt: "Como afetam muitos genes simultaneamente, então têm efeitos drásticos — visíveis em cariótipo.", en: "Because they affect many genes at once, they have drastic effects — visible in karyotype."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Aneuploidia é:", en: "Aneuploidy is:"}
        choices:
          - {pt: "Número anormal de cromossomos (a mais ou a menos)", en: "Abnormal chromosome number (extra or missing)"}
          - {pt: "Sequência alterada", en: "Altered sequence"}
          - {pt: "Tipo de proteína", en: "Type of protein"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Número anormal de cromossomos (a mais ou a menos)", en: "Abnormal chromosome number (extra or missing)"}
        rationale: {pt: "Como surge por não-disjunção em meiose, então causa síndromes com fenótipos característicos (Down, Turner).", en: "Because it arises from meiotic non-disjunction, it causes syndromes with characteristic phenotypes (Down, Turner)."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: mutações:", en: "Summary: mutations:"}
        choices:
          - {pt: "Variam de neutras a graves; são fonte de evolução e podem causar doenças", en: "Range from neutral to severe; source of evolution and may cause disease"}
          - {pt: "Sempre fatais", en: "Always lethal"}
          - {pt: "Sempre benéficas", en: "Always beneficial"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Variam de neutras a graves; são fonte de evolução e podem causar doenças", en: "Range from neutral to severe; source of evolution and may cause disease"}
        rationale: {pt: "Como o efeito depende de onde caem e como afetam a proteína, então ambas as faces (evolução e doença) são possíveis.", en: "Because effect depends on where they fall and how they affect the protein, both sides (evolution and disease) are possible."}
        objectives: [biology.mutations]
        difficulty: 4
target: 20
