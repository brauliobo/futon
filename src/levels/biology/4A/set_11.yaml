title:
  pt: "🌱 Hormônios e respostas em plantas"
  en: "🌱 Plant hormones and responses"
level: '4A'
subject: biology
objectives: [biology.plant_physiology]
difficulty: 4
authorNotes: "Auxinas, giberelinas, citocininas, ABA, etileno; tropismos, fotoperiodismo."
example:
  pt: "Ex.: auxina lateral → fototropismo; ABA → fechamento estomático; etileno → maturação de frutos."
  en: "Ex.: lateral auxin → phototropism; ABA → stomatal closure; ethylene → fruit ripening."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Cinco hormônios principais", en: "Five main hormones"}
    description: {pt: "Quem regula o quê.", en: "Who regulates what."}
    exercises:
      - type: choice
        question: {pt: "Auxinas (ex.: AIA) controlam:", en: "Auxins (e.g., IAA) control:"}
        choices:
          - {pt: "Crescimento por elongação celular, dominância apical, fototropismo", en: "Growth by cell elongation, apical dominance, phototropism"}
          - {pt: "Apenas reprodução", en: "Just reproduction"}
          - {pt: "Apenas respiração", en: "Just respiration"}
          - {pt: "Apenas digestão", en: "Just digestion"}
        correctAnswer: {pt: "Crescimento por elongação celular, dominância apical, fototropismo", en: "Growth by cell elongation, apical dominance, phototropism"}
        rationale: {pt: "Como auxina afrouxa a parede celular, então a célula se alonga — distribuição assimétrica curva o caule à luz.", en: "Because auxin loosens the cell wall, the cell elongates — asymmetric distribution bends stem toward light."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Giberelinas:", en: "Gibberellins:"}
        choices:
          - {pt: "Estimulam alongamento do caule, germinação de sementes, floração", en: "Promote stem elongation, seed germination, flowering"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas no inverno", en: "Only in winter"}
          - {pt: "Apenas em raízes", en: "Only in roots"}
        correctAnswer: {pt: "Estimulam alongamento do caule, germinação de sementes, floração", en: "Promote stem elongation, seed germination, flowering"}
        rationale: {pt: "Como giberelinas em sementes ativam amilases que mobilizam amido, então a germinação é desencadeada.", en: "Because gibberellins in seeds activate amylases mobilizing starch, germination is triggered."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Citocininas:", en: "Cytokinins:"}
        choices:
          - {pt: "Promovem divisão celular e atrasam senescência", en: "Promote cell division and delay senescence"}
          - {pt: "Sempre matam plantas", en: "Always kill plants"}
          - {pt: "Sem função", en: "No function"}
          - {pt: "Apenas em algas", en: "Only in algae"}
        correctAnswer: {pt: "Promovem divisão celular e atrasam senescência", en: "Promote cell division and delay senescence"}
        rationale: {pt: "Como sintetizadas em raízes e enviadas pelo xilema, então mantêm folhas verdes e estimulam mitose em meristemas.", en: "Because synthesized in roots and sent via xylem, they keep leaves green and promote meristem mitosis."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Ácido abscísico (ABA):", en: "Abscisic acid (ABA):"}
        choices:
          - {pt: "Hormônio do estresse: fecha estômatos, induz dormência de sementes", en: "Stress hormone: closes stomata, induces seed dormancy"}
          - {pt: "Apenas crescer", en: "Just grow"}
          - {pt: "Apenas amarelar", en: "Just yellow"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Hormônio do estresse: fecha estômatos, induz dormência de sementes", en: "Stress hormone: closes stomata, induces seed dormancy"}
        rationale: {pt: "Como sinaliza condições adversas (seca, frio), então ABA aciona estratégias de proteção.", en: "Because it signals adverse conditions (drought, cold), ABA triggers protection strategies."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Etileno:", en: "Ethylene:"}
        choices:
          - {pt: "Gás que acelera maturação de frutos, queda de folhas", en: "Gas that ripens fruits, drops leaves"}
          - {pt: "Apenas líquido", en: "Just liquid"}
          - {pt: "Sem função", en: "No function"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Gás que acelera maturação de frutos, queda de folhas", en: "Gas that ripens fruits, drops leaves"}
        rationale: {pt: "Como gás se difunde, então uma banana madura amadurece outras próximas — \"uma maçã podre estraga o cesto\".", en: "Because gas diffuses, one ripe banana ripens others nearby — \"one bad apple spoils the bunch\"."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Fototropismo:", en: "Phototropism:"}
        choices:
          - {pt: "Crescimento direcional em resposta à luz (auxina lateral)", en: "Directional growth in response to light (lateral auxin)"}
          - {pt: "Resposta à gravidade", en: "Response to gravity"}
          - {pt: "Resposta à temperatura", en: "Response to temperature"}
          - {pt: "Apenas aleatório", en: "Just random"}
        correctAnswer: {pt: "Crescimento direcional em resposta à luz (auxina lateral)", en: "Directional growth in response to light (lateral auxin)"}
        rationale: {pt: "Como auxina migra ao lado sombreado, então essa face cresce mais e curva o caule à luz.", en: "Because auxin migrates to the shaded side, that face grows more and bends stem toward light."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Geotropismo:", en: "Geotropism:"}
        choices:
          - {pt: "Resposta à gravidade — raízes para baixo (positivo), caules para cima (negativo)", en: "Response to gravity — roots down (positive), stems up (negative)"}
          - {pt: "Resposta à luz", en: "Response to light"}
          - {pt: "Apenas em plantas mortas", en: "Only in dead plants"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Resposta à gravidade — raízes para baixo (positivo), caules para cima (negativo)", en: "Response to gravity — roots down (positive), stems up (negative)"}
        rationale: {pt: "Como estatólitos em células detectam direção da gravidade, então hormônios redistribuem-se e guiam crescimento.", en: "Because cell statoliths detect gravity direction, hormones redistribute and guide growth."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Tigmotropismo:", en: "Thigmotropism:"}
        choices:
          - {pt: "Resposta a contato físico (gavinhas se enrolam em suportes)", en: "Response to physical contact (tendrils coil around supports)"}
          - {pt: "Resposta à temperatura", en: "Response to temperature"}
          - {pt: "Resposta à luz", en: "Response to light"}
          - {pt: "Sem resposta", en: "No response"}
        correctAnswer: {pt: "Resposta a contato físico (gavinhas se enrolam em suportes)", en: "Response to physical contact (tendrils coil around supports)"}
        rationale: {pt: "Como mudanças de turgor diferenciais ocorrem nos lados em contato, então a gavinha se curva e se enrola.", en: "Because differential turgor changes occur on contact sides, the tendril bends and coils."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Movimento da Mimosa pudica (sensitiva):", en: "Mimosa pudica (sensitive plant) movement:"}
        choices:
          - {pt: "Resposta tigmonástica rápida via mudanças de turgor (não é tropismo)", en: "Fast thigmonastic response via turgor changes (not a tropism)"}
          - {pt: "Tropismo lento", en: "Slow tropism"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Aleatório", en: "Random"}
        correctAnswer: {pt: "Resposta tigmonástica rápida via mudanças de turgor (não é tropismo)", en: "Fast thigmonastic response via turgor changes (not a tropism)"}
        rationale: {pt: "Como células pulvinares perdem rapidamente íons e água, então folha desaba — defesa contra herbívoros.", en: "Because pulvinar cells rapidly lose ions and water, the leaf collapses — herbivore defense."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Dominância apical:", en: "Apical dominance:"}
        choices:
          - {pt: "Auxina do ápice inibe brotos laterais — crescimento concentrado", en: "Auxin from the tip inhibits lateral buds — concentrated growth"}
          - {pt: "Apenas em raízes", en: "Only in roots"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas em flores", en: "Only in flowers"}
        correctAnswer: {pt: "Auxina do ápice inibe brotos laterais — crescimento concentrado", en: "Auxin from the tip inhibits lateral buds — concentrated growth"}
        rationale: {pt: "Como podar a ponta libera os laterais, então a planta torna-se mais densa — princípio de jardinagem.", en: "Because pruning the tip frees laterals, the plant becomes denser — gardening principle."}
        objectives: [biology.plant_physiology]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Floração e ritmos", en: "Flowering and rhythms"}
    description: {pt: "Quando florescer, quando dormir.", en: "When to flower, when to sleep."}
    exercises:
      - type: choice
        question: {pt: "Fotoperiodismo é:", en: "Photoperiodism is:"}
        choices:
          - {pt: "Resposta da floração à duração da noite (não do dia)", en: "Flowering response to night length (not day)"}
          - {pt: "Apenas crescer", en: "Just grow"}
          - {pt: "Apenas mover", en: "Just move"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Resposta da floração à duração da noite (não do dia)", en: "Flowering response to night length (not day)"}
        rationale: {pt: "Como noite ininterrupta determina, então plantas \"de dia curto\" precisam noites longas — fotoperiodismo é mecanismo sazonal.", en: "Because uninterrupted night determines, \"short-day\" plants need long nights — photoperiodism is a seasonal mechanism."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Plantas de dia curto:", en: "Short-day plants:"}
        choices:
          - {pt: "Florescem com noites longas (outono/inverno) — ex.: crisântemo, soja", en: "Flower with long nights (fall/winter) — e.g., chrysanthemum, soybean"}
          - {pt: "Florescem com dias curtos no verão", en: "Flower with short days in summer"}
          - {pt: "Não florescem", en: "Don't flower"}
          - {pt: "Florescem aleatoriamente", en: "Flower randomly"}
        correctAnswer: {pt: "Florescem com noites longas (outono/inverno) — ex.: crisântemo, soja", en: "Flower with long nights (fall/winter) — e.g., chrysanthemum, soybean"}
        rationale: {pt: "Como detectam dias encurtando, então sincronizam reprodução com estação favorável.", en: "Because they detect shortening days, they sync reproduction with favorable season."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Plantas de dia longo:", en: "Long-day plants:"}
        choices:
          - {pt: "Florescem com noites curtas (primavera/verão) — ex.: trigo, espinafre", en: "Flower with short nights (spring/summer) — e.g., wheat, spinach"}
          - {pt: "Florescem no inverno", en: "Flower in winter"}
          - {pt: "Não florescem", en: "Don't flower"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Florescem com noites curtas (primavera/verão) — ex.: trigo, espinafre", en: "Flower with short nights (spring/summer) — e.g., wheat, spinach"}
        rationale: {pt: "Como o ciclo de dias longos coincide com calor, então polinizadores estão ativos — vantagem reprodutiva.", en: "Because long-day cycle coincides with warmth, pollinators are active — reproductive advantage."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Fitocromo é:", en: "Phytochrome is:"}
        choices:
          - {pt: "Pigmento que detecta luz vermelha vs vermelho-distante (mede dia/noite)", en: "Pigment detecting red vs far-red light (measures day/night)"}
          - {pt: "Tipo de açúcar", en: "Type of sugar"}
          - {pt: "Tipo de aminoácido", en: "Type of amino acid"}
          - {pt: "Tipo de DNA", en: "Type of DNA"}
        correctAnswer: {pt: "Pigmento que detecta luz vermelha vs vermelho-distante (mede dia/noite)", en: "Pigment detecting red vs far-red light (measures day/night)"}
        rationale: {pt: "Como muda forma com luz, então transmite sinal sobre o estado luminoso — base do fotoperiodismo.", en: "Because it changes shape with light, it conveys luminous state — basis of photoperiodism."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Vernalização é:", en: "Vernalization is:"}
        choices:
          - {pt: "Necessidade de exposição prolongada ao frio para florescer (ex.: trigo de inverno)", en: "Need for prolonged cold to flower (e.g., winter wheat)"}
          - {pt: "Apenas calor", en: "Just heat"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Necessidade de exposição prolongada ao frio para florescer (ex.: trigo de inverno)", en: "Need for prolonged cold to flower (e.g., winter wheat)"}
        rationale: {pt: "Como invernos longos são sinal de boa estação seguinte, então plantas \"esperam\" frio para preparar floração.", en: "Because long winters signal a good next season, plants \"wait\" for cold to prepare flowering."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Maturação de frutos envolve:", en: "Fruit ripening involves:"}
        choices:
          - {pt: "Etileno: amido → açúcares, amolecimento, mudança de cor", en: "Ethylene: starch → sugars, softening, color change"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem hormônios", en: "No hormones"}
          - {pt: "Apenas frio", en: "Just cold"}
        correctAnswer: {pt: "Etileno: amido → açúcares, amolecimento, mudança de cor", en: "Ethylene: starch → sugars, softening, color change"}
        rationale: {pt: "Como atrai animais que dispersam sementes, então maduros são doces, coloridos e moles — coevolução com dispersores.", en: "Because it attracts seed-dispersing animals, ripe fruits are sweet, colorful, and soft — coevolution with dispersers."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Dormência de sementes é mantida por:", en: "Seed dormancy is maintained by:"}
        choices:
          - {pt: "ABA (até condições favoráveis)", en: "ABA (until favorable conditions)"}
          - {pt: "Apenas auxina", en: "Just auxin"}
          - {pt: "Apenas etileno", en: "Just ethylene"}
          - {pt: "Sem hormônios", en: "No hormones"}
        correctAnswer: {pt: "ABA (até condições favoráveis)", en: "ABA (until favorable conditions)"}
        rationale: {pt: "Como germinar fora de hora seria letal, então ABA mantém pausa até umidade/calor adequados — depois giberelina ativa germinação.", en: "Because germinating off-time would be lethal, ABA maintains pause until proper moisture/warmth — then gibberellin activates germination."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Defesa de plantas contra herbívoros inclui:", en: "Plant defense against herbivores includes:"}
        choices:
          - {pt: "Espinhos, toxinas (alcaloides), pelos urticantes, voláteis que atraem inimigos do herbívoro", en: "Spines, toxins (alkaloids), stinging hairs, volatiles attracting herbivore enemies"}
          - {pt: "Apenas crescer", en: "Just grow"}
          - {pt: "Sem defesa", en: "No defense"}
          - {pt: "Apenas correr", en: "Just run"}
        correctAnswer: {pt: "Espinhos, toxinas (alcaloides), pelos urticantes, voláteis que atraem inimigos do herbívoro", en: "Spines, toxins (alkaloids), stinging hairs, volatiles attracting herbivore enemies"}
        rationale: {pt: "Como plantas não fogem, então evolução produziu defesas químicas e mecânicas elaboradas.", en: "Because plants can't flee, evolution produced elaborate chemical and mechanical defenses."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Sinalização sistêmica em plantas (\"sangue verde\"):", en: "Systemic signaling in plants (\"green blood\"):"}
        choices:
          - {pt: "Plantas comunicam dano via sinais elétricos, hormônios, voláteis", en: "Plants signal damage via electrical, hormonal, volatile cues"}
          - {pt: "Não comunicam", en: "Don't communicate"}
          - {pt: "Apenas via raízes", en: "Only via roots"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Plantas comunicam dano via sinais elétricos, hormônios, voláteis", en: "Plants signal damage via electrical, hormonal, volatile cues"}
        rationale: {pt: "Como folhas atacadas alertam o resto da planta, então a defesa pode ser preemptiva — plantas \"sabem\" o que ocorre.", en: "Because attacked leaves warn the rest of the plant, defense can be pre-emptive — plants \"know\" what's happening."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: hormônios vegetais:", en: "Summary: plant hormones:"}
        choices:
          - {pt: "Pequenas moléculas regulam crescimento, desenvolvimento e respostas ao ambiente", en: "Small molecules regulate growth, development, and environmental responses"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em flores", en: "Only in flowers"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Pequenas moléculas regulam crescimento, desenvolvimento e respostas ao ambiente", en: "Small molecules regulate growth, development, and environmental responses"}
        rationale: {pt: "Como plantas são imóveis, então fitorhormônios são essenciais para adaptação — análogos aos hormônios animais.", en: "Because plants are immobile, plant hormones are essential for adaptation — analogous to animal hormones."}
        objectives: [biology.plant_physiology]
        difficulty: 4
target: 20
