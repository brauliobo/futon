title:
  pt: "📊 Genética de populações — Hardy-Weinberg"
  en: "📊 Population genetics — Hardy-Weinberg"
level: '4A'
subject: biology
objectives: [biology.evolution_advanced]
difficulty: 4
authorNotes: "Equilíbrio HW, frequências alélicas, forças evolutivas (mutação, seleção, migração, deriva)."
example:
  pt: "Ex.: p² + 2pq + q² = 1, onde p = freq(A), q = freq(a). Equilíbrio assume sem mutação/seleção/deriva/migração."
  en: "Ex.: p² + 2pq + q² = 1, where p = freq(A), q = freq(a). Equilibrium assumes no mutation/selection/drift/migration."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Equação de Hardy-Weinberg", en: "Hardy-Weinberg equation"}
    description: {pt: "Modelando frequências.", en: "Modeling frequencies."}
    exercises:
      - type: choice
        question: {pt: "Equação de Hardy-Weinberg:", en: "Hardy-Weinberg equation:"}
        choices:
          - {pt: "p² + 2pq + q² = 1 (frequências genotípicas em equilíbrio)", en: "p² + 2pq + q² = 1 (genotype frequencies at equilibrium)"}
          - {pt: "E = mc²", en: "E = mc²"}
          - {pt: "p + q = 0", en: "p + q = 0"}
          - {pt: "Sem equação", en: "No equation"}
        correctAnswer: {pt: "p² + 2pq + q² = 1 (frequências genotípicas em equilíbrio)", en: "p² + 2pq + q² = 1 (genotype frequencies at equilibrium)"}
        rationale: {pt: "Como expansão de (p+q)², então mostra como frequências alélicas geram genótipos sob acasalamento aleatório.", en: "Because it's the expansion of (p+q)², it shows how allele frequencies generate genotypes under random mating."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "p e q representam:", en: "p and q represent:"}
        choices:
          - {pt: "Frequências dos dois alelos (p + q = 1)", en: "Frequencies of two alleles (p + q = 1)"}
          - {pt: "Apenas tamanhos", en: "Just sizes"}
          - {pt: "Apenas cores", en: "Just colors"}
          - {pt: "Apenas idades", en: "Just ages"}
        correctAnswer: {pt: "Frequências dos dois alelos (p + q = 1)", en: "Frequencies of two alleles (p + q = 1)"}
        rationale: {pt: "Como suam 100%, então conhecer p basta para deduzir q (q = 1 − p).", en: "Because they sum to 100%, knowing p suffices to deduce q (q = 1 − p)."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "p² representa:", en: "p² represents:"}
        choices:
          - {pt: "Frequência de homozigotos AA", en: "Frequency of AA homozygotes"}
          - {pt: "Frequência de Aa", en: "Frequency of Aa"}
          - {pt: "Frequência de aa", en: "Frequency of aa"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Frequência de homozigotos AA", en: "Frequency of AA homozygotes"}
        rationale: {pt: "Como receber A do pai e A da mãe é independente, então probabilidade conjunta é p × p = p².", en: "Because getting A from each parent is independent, joint probability is p × p = p²."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "2pq representa:", en: "2pq represents:"}
        choices:
          - {pt: "Frequência de heterozigotos Aa (× 2 porque pode ser Aa ou aA)", en: "Frequency of Aa heterozygotes (× 2 because Aa or aA)"}
          - {pt: "Apenas AA", en: "Just AA"}
          - {pt: "Apenas aa", en: "Just aa"}
          - {pt: "Sem significado", en: "No meaning"}
        correctAnswer: {pt: "Frequência de heterozigotos Aa (× 2 porque pode ser Aa ou aA)", en: "Frequency of Aa heterozygotes (× 2 because Aa or aA)"}
        rationale: {pt: "Como há duas formas de obter heterozigoto, então a frequência é dobrada — daí o fator 2.", en: "Because there are two ways to get heterozygous, the frequency is doubled — hence the factor 2."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "q² representa:", en: "q² represents:"}
        choices:
          - {pt: "Frequência de homozigotos aa (recessivo expresso)", en: "Frequency of aa homozygotes (recessive expressed)"}
          - {pt: "Apenas Aa", en: "Just Aa"}
          - {pt: "Apenas AA", en: "Just AA"}
          - {pt: "Sem significado", en: "No meaning"}
        correctAnswer: {pt: "Frequência de homozigotos aa (recessivo expresso)", en: "Frequency of aa homozygotes (recessive expressed)"}
        rationale: {pt: "Como traços recessivos só aparecem em homozigotos, então q² estima frequência de doenças recessivas na população.", en: "Because recessive traits only appear in homozygotes, q² estimates recessive disease frequency in the population."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Equilíbrio de Hardy-Weinberg ASSUME:", en: "Hardy-Weinberg equilibrium ASSUMES:"}
        choices:
          - {pt: "Sem mutação, sem seleção, sem deriva, sem migração, acasalamento aleatório", en: "No mutation, no selection, no drift, no migration, random mating"}
          - {pt: "Sempre verdadeiro", en: "Always true"}
          - {pt: "Sem suposições", en: "No assumptions"}
          - {pt: "Apenas em humanos", en: "Only in humans"}
        correctAnswer: {pt: "Sem mutação, sem seleção, sem deriva, sem migração, acasalamento aleatório", en: "No mutation, no selection, no drift, no migration, random mating"}
        rationale: {pt: "Como populações reais violam essas condições, então o modelo é referência para detectar evolução.", en: "Because real populations violate these conditions, the model is a reference for detecting evolution."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Se q = 0.1, qual a frequência de q²?", en: "If q = 0.1, what is q² frequency?"}
        choices:
          - {pt: "0.01 (1%)", en: "0.01 (1%)"}
          - {pt: "0.1", en: "0.1"}
          - {pt: "1.0", en: "1.0"}
          - {pt: "0.5", en: "0.5"}
        correctAnswer: {pt: "0.01 (1%)", en: "0.01 (1%)"}
        rationale: {pt: "Como q² = 0.1 × 0.1 = 0.01, então 1% da população é aa — útil para epidemiologia genética.", en: "Because q² = 0.1 × 0.1 = 0.01, 1% of the population is aa — useful for genetic epidemiology."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Se q = 0.1, qual a frequência de heterozigotos?", en: "If q = 0.1, what is the heterozygote frequency?"}
        choices:
          - {pt: "2pq = 2 × 0.9 × 0.1 = 0.18 (18%)", en: "2pq = 2 × 0.9 × 0.1 = 0.18 (18%)"}
          - {pt: "0.01", en: "0.01"}
          - {pt: "1.0", en: "1.0"}
          - {pt: "0.5", en: "0.5"}
        correctAnswer: {pt: "2pq = 2 × 0.9 × 0.1 = 0.18 (18%)", en: "2pq = 2 × 0.9 × 0.1 = 0.18 (18%)"}
        rationale: {pt: "Como portadores são muito mais frequentes que afetados, então rastreio genético foca neles em doenças recessivas.", en: "Because carriers are much more common than affected, genetic screening targets them in recessive diseases."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "HW é útil para:", en: "HW is useful for:"}
        choices:
          - {pt: "Estimar frequências de doenças recessivas e detectar evolução em curso", en: "Estimate recessive disease frequencies and detect ongoing evolution"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Estimar frequências de doenças recessivas e detectar evolução em curso", en: "Estimate recessive disease frequencies and detect ongoing evolution"}
        rationale: {pt: "Como desvios do equilíbrio sinalizam forças evolutivas, então HW é vara de medição genética populacional.", en: "Because deviations from equilibrium signal evolutionary forces, HW is a population-genetic yardstick."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Acasalamento NÃO-aleatório (assortativo positivo):", en: "Non-random mating (positive assortative):"}
        choices:
          - {pt: "Indivíduos similares acasalam mais — aumenta homozigotos", en: "Similar individuals mate more — increases homozygotes"}
          - {pt: "Aumenta heterozigotos", en: "Increases heterozygotes"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Indivíduos similares acasalam mais — aumenta homozigotos", en: "Similar individuals mate more — increases homozygotes"}
        rationale: {pt: "Como rompe acasalamento aleatório, então frequências genotípicas desviam de HW — mas frequências alélicas podem manter-se.", en: "Because it breaks random mating, genotype frequencies deviate from HW — but allele frequencies may stay."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Forças evolutivas", en: "Evolutionary forces"}
    description: {pt: "O que muda frequências alélicas.", en: "What changes allele frequencies."}
    exercises:
      - type: choice
        question: {pt: "Cinco forças evolutivas principais:", en: "Five main evolutionary forces:"}
        choices:
          - {pt: "Mutação, seleção natural, deriva genética, migração, acasalamento não-aleatório", en: "Mutation, natural selection, genetic drift, migration, non-random mating"}
          - {pt: "Apenas mutação", en: "Just mutation"}
          - {pt: "Apenas seleção", en: "Just selection"}
          - {pt: "Sem forças", en: "No forces"}
        correctAnswer: {pt: "Mutação, seleção natural, deriva genética, migração, acasalamento não-aleatório", en: "Mutation, natural selection, genetic drift, migration, non-random mating"}
        rationale: {pt: "Como cada uma viola um pressuposto de HW, então identificá-las explica como populações evoluem.", en: "Because each violates an HW assumption, identifying them explains how populations evolve."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Mutação fornece:", en: "Mutation provides:"}
        choices:
          - {pt: "Variação genética nova — matéria-prima da evolução", en: "New genetic variation — evolution's raw material"}
          - {pt: "Apenas doenças", en: "Just diseases"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Variação genética nova — matéria-prima da evolução", en: "New genetic variation — evolution's raw material"}
        rationale: {pt: "Como sem mutação não há novidade, então é a única fonte primária de novos alelos — taxas baixas mas constantes.", en: "Because without mutation there's no novelty, it's the only primary source of new alleles — low but constant rates."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Seleção natural age:", en: "Natural selection acts:"}
        choices:
          - {pt: "Sobre fenótipos — alelos vantajosos aumentam, prejudiciais diminuem", en: "On phenotypes — favorable alleles rise, harmful drop"}
          - {pt: "Apenas aleatório", en: "Just random"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
          - {pt: "Sem direção", en: "No direction"}
        correctAnswer: {pt: "Sobre fenótipos — alelos vantajosos aumentam, prejudiciais diminuem", en: "On phenotypes — favorable alleles rise, harmful drop"}
        rationale: {pt: "Como sobrevivência diferencial muda frequências, então seleção é a única força evolutiva direcionada.", en: "Because differential survival changes frequencies, selection is the only directional evolutionary force."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Deriva genética:", en: "Genetic drift:"}
        choices:
          - {pt: "Mudança aleatória nas frequências (forte em populações pequenas)", en: "Random frequency change (strong in small populations)"}
          - {pt: "Sempre direcional", en: "Always directional"}
          - {pt: "Sem efeito em pequenas pop", en: "No effect in small pop"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Mudança aleatória nas frequências (forte em populações pequenas)", en: "Random frequency change (strong in small populations)"}
        rationale: {pt: "Como sorte molda amostragem em pop pequenas, então alelos podem fixar ou se perder rapidamente — sem seleção.", en: "Because chance shapes sampling in small pops, alleles can fix or disappear quickly — without selection."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Efeito do gargalo (bottleneck):", en: "Bottleneck effect:"}
        choices:
          - {pt: "Redução drástica da população reduz diversidade — ex.: guepardos", en: "Drastic population reduction reduces diversity — e.g., cheetahs"}
          - {pt: "Sempre aumenta diversidade", en: "Always increases diversity"}
          - {pt: "Sem efeito genético", en: "No genetic effect"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Redução drástica da população reduz diversidade — ex.: guepardos", en: "Drastic population reduction reduces diversity — e.g., cheetahs"}
        rationale: {pt: "Como poucos sobreviventes restringem pool gênico, então a recuperação parte de base estreita — vulnerabilidade.", en: "Because few survivors restrict gene pool, recovery starts from narrow base — vulnerability."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Efeito fundador:", en: "Founder effect:"}
        choices:
          - {pt: "Pequeno grupo coloniza nova área — frequências diferem da população original", en: "Small group colonizes new area — frequencies differ from original population"}
          - {pt: "Sem diferença", en: "No difference"}
          - {pt: "Sempre similar", en: "Always similar"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Pequeno grupo coloniza nova área — frequências diferem da população original", en: "Small group colonizes new area — frequencies differ from original population"}
        rationale: {pt: "Como amostra inicial não é representativa, então populações isoladas (Amish, ilhas) têm doenças raras concentradas.", en: "Because initial sample isn't representative, isolated populations (Amish, islands) have concentrated rare diseases."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Migração (fluxo gênico):", en: "Migration (gene flow):"}
        choices:
          - {pt: "Movimento de alelos entre populações — homogeneiza diferenças", en: "Allele movement between populations — homogenizes differences"}
          - {pt: "Sempre divergência", en: "Always divergence"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas em humanos", en: "Only in humans"}
        correctAnswer: {pt: "Movimento de alelos entre populações — homogeneiza diferenças", en: "Allele movement between populations — homogenizes differences"}
        rationale: {pt: "Como introduz novos alelos e dilui diferenças, então fluxo gênico se opõe à especiação.", en: "Because it introduces new alleles and dilutes differences, gene flow opposes speciation."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Seleção direcional:", en: "Directional selection:"}
        choices:
          - {pt: "Favorece um extremo do fenótipo (ex.: pele escura em alta UV)", en: "Favors one phenotype extreme (e.g., dark skin at high UV)"}
          - {pt: "Sempre favorece a média", en: "Always favors average"}
          - {pt: "Não muda nada", en: "Doesn't change anything"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Favorece um extremo do fenótipo (ex.: pele escura em alta UV)", en: "Favors one phenotype extreme (e.g., dark skin at high UV)"}
        rationale: {pt: "Como desloca distribuição em uma direção, então adaptação rápida ocorre quando ambiente muda.", en: "Because it shifts distribution in one direction, fast adaptation happens when environment changes."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Seleção estabilizadora:", en: "Stabilizing selection:"}
        choices:
          - {pt: "Favorece a média, elimina extremos (ex.: peso de bebê ao nascer)", en: "Favors average, eliminates extremes (e.g., birth weight)"}
          - {pt: "Sempre favorece extremos", en: "Always favors extremes"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Favorece a média, elimina extremos (ex.: peso de bebê ao nascer)", en: "Favors average, eliminates extremes (e.g., birth weight)"}
        rationale: {pt: "Como bebês muito leves/pesados têm mortalidade maior, então a média é favorecida — preserva fenótipo bem-adaptado.", en: "Because very light/heavy babies have higher mortality, the average is favored — preserves well-adapted phenotype."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: genética de populações:", en: "Summary: population genetics:"}
        choices:
          - {pt: "Quantifica como frequências alélicas mudam ao longo do tempo sob forças evolutivas", en: "Quantifies how allele frequencies change over time under evolutionary forces"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Quantifica como frequências alélicas mudam ao longo do tempo sob forças evolutivas", en: "Quantifies how allele frequencies change over time under evolutionary forces"}
        rationale: {pt: "Como integra Mendel + Darwin via matemática, então fundamenta a Síntese Moderna da evolução.", en: "Because it integrates Mendel + Darwin mathematically, it underpins the Modern Synthesis of evolution."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
target: 20
