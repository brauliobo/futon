title:
  pt: "🌳 Transporte em plantas"
  en: "🌳 Plant transport"
level: '4A'
subject: biology
objectives: [biology.plant_physiology]
difficulty: 4
authorNotes: "Xilema (água/sais), floema (açúcares), transpiração, pressão de raiz."
example:
  pt: "Ex.: raiz absorve água → xilema sobe pela coesão-tensão → folhas transpiram → puxa coluna toda."
  en: "Ex.: root absorbs water → xylem rises via cohesion-tension → leaves transpire → pulls whole column."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Xilema e transpiração", en: "Xylem and transpiration"}
    description: {pt: "Como água sobe.", en: "How water rises."}
    exercises:
      - type: choice
        question: {pt: "Xilema transporta:", en: "Xylem transports:"}
        choices:
          - {pt: "Água e sais minerais (das raízes às folhas)", en: "Water and minerals (roots to leaves)"}
          - {pt: "Apenas açúcares", en: "Just sugars"}
          - {pt: "Apenas pólen", en: "Just pollen"}
          - {pt: "Apenas O₂", en: "Just O₂"}
        correctAnswer: {pt: "Água e sais minerais (das raízes às folhas)", en: "Water and minerals (roots to leaves)"}
        rationale: {pt: "Como vasos do xilema são unidirecionais (sobe), então transpiração nas folhas puxa a coluna inteira.", en: "Because xylem vessels are one-way (upward), leaf transpiration pulls the whole column."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Floema transporta:", en: "Phloem transports:"}
        choices:
          - {pt: "Açúcares (das folhas para outras partes)", en: "Sugars (leaves to other parts)"}
          - {pt: "Apenas água", en: "Just water"}
          - {pt: "Apenas O₂", en: "Just O₂"}
          - {pt: "Apenas pólen", en: "Just pollen"}
        correctAnswer: {pt: "Açúcares (das folhas para outras partes)", en: "Sugars (leaves to other parts)"}
        rationale: {pt: "Como floema distribui produtos da fotossíntese, então alimenta raízes, frutos e tecidos em crescimento.", en: "Because phloem distributes photosynthesis products, it feeds roots, fruits, and growing tissues."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Teoria coesão-tensão explica:", en: "Cohesion-tension theory explains:"}
        choices:
          - {pt: "Como a água sobe sem bomba: tensão do topo + coesão entre moléculas", en: "How water rises without a pump: tension from top + cohesion between molecules"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem motivo", en: "No reason"}
          - {pt: "Apenas em fungos", en: "Only in fungi"}
        correctAnswer: {pt: "Como a água sobe sem bomba: tensão do topo + coesão entre moléculas", en: "How water rises without a pump: tension from top + cohesion between molecules"}
        rationale: {pt: "Como pontes de hidrogênio mantêm coluna unida e evaporação puxa do alto, então água chega a 100m sem energia metabólica.", en: "Because H-bonds hold the column and evaporation pulls from above, water reaches 100m without metabolic energy."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Transpiração é:", en: "Transpiration is:"}
        choices:
          - {pt: "Perda de água por evaporação nas folhas (estômatos)", en: "Water loss by evaporation in leaves (stomata)"}
          - {pt: "Comer", en: "Eating"}
          - {pt: "Trocar de cor", en: "Changing color"}
          - {pt: "Soltar pólen", en: "Releasing pollen"}
        correctAnswer: {pt: "Perda de água por evaporação nas folhas (estômatos)", en: "Water loss by evaporation in leaves (stomata)"}
        rationale: {pt: "Como cria sucção, então puxa água do solo via xilema — \"motor\" que move a coluna.", en: "Because it creates suction, it pulls water from soil via xylem — \"engine\" that moves the column."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Estômatos são controlados por:", en: "Stomata are controlled by:"}
        choices:
          - {pt: "Células-guarda que mudam turgor para abrir/fechar o poro", en: "Guard cells changing turgor to open/close the pore"}
          - {pt: "Apenas sol", en: "Just sun"}
          - {pt: "Apenas gravidade", en: "Just gravity"}
          - {pt: "Sempre abertos", en: "Always open"}
        correctAnswer: {pt: "Células-guarda que mudam turgor para abrir/fechar o poro", en: "Guard cells changing turgor to open/close the pore"}
        rationale: {pt: "Como ganham K⁺ → entram água → tornam-se turgentes e curvam, então o poro abre permitindo trocas gasosas.", en: "Because they gain K⁺ → water enters → become turgid and curve, the pore opens allowing gas exchange."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Em deserto/seca, plantas:", en: "In desert/drought, plants:"}
        choices:
          - {pt: "Fecham estômatos (poupar água), reduzindo fotossíntese", en: "Close stomata (save water), reducing photosynthesis"}
          - {pt: "Abrem estômatos sempre", en: "Always open stomata"}
          - {pt: "Não respondem", en: "Don't respond"}
          - {pt: "Crescem mais rápido", en: "Grow faster"}
        correctAnswer: {pt: "Fecham estômatos (poupar água), reduzindo fotossíntese", en: "Close stomata (save water), reducing photosynthesis"}
        rationale: {pt: "Como ácido abscísico (ABA) sinaliza estresse, então células-guarda perdem turgor e o poro fecha.", en: "Because abscisic acid (ABA) signals stress, guard cells lose turgor and the pore closes."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Pressão de raiz:", en: "Root pressure:"}
        choices:
          - {pt: "Bombeamento ativo de íons cria gradiente — empurra água para cima (importante à noite)", en: "Active ion pumping creates gradient — pushes water up (important at night)"}
          - {pt: "Não existe", en: "Doesn't exist"}
          - {pt: "Apenas durante dia", en: "Only daytime"}
          - {pt: "Sempre suficiente", en: "Always sufficient"}
        correctAnswer: {pt: "Bombeamento ativo de íons cria gradiente — empurra água para cima (importante à noite)", en: "Active ion pumping creates gradient — pushes water up (important at night)"}
        rationale: {pt: "Como sem transpiração noturna a coesão-tensão para, então pressão de raiz mantém algum fluxo — gota nas folhas (gutação).", en: "Because nighttime transpiration stops, root pressure maintains some flow — leaf droplets (guttation)."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Adesão da água serve para:", en: "Water adhesion serves to:"}
        choices:
          - {pt: "Fixar coluna às paredes do xilema (capilaridade)", en: "Anchor column to xylem walls (capillarity)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas em raízes", en: "Only in roots"}
        correctAnswer: {pt: "Fixar coluna às paredes do xilema (capilaridade)", en: "Anchor column to xylem walls (capillarity)"}
        rationale: {pt: "Como adesão + coesão evitam quebra da coluna, então a tensão de transpiração não rompe o fluxo.", en: "Because adhesion + cohesion prevent column breakage, transpiration tension doesn't break flow."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Cavitação no xilema é:", en: "Xylem cavitation is:"}
        choices:
          - {pt: "Formação de bolha que rompe coluna de água — interrompe transporte", en: "Bubble formation breaking the water column — disrupts transport"}
          - {pt: "Crescimento extra", en: "Extra growth"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Formação de bolha que rompe coluna de água — interrompe transporte", en: "Bubble formation breaking the water column — disrupts transport"}
        rationale: {pt: "Como sob estresse hídrico bolhas surgem, então plantas têm vasos múltiplos e estratégias para isolar danos.", en: "Because bubbles arise under water stress, plants have multiple vessels and strategies to isolate damage."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Fluxo de seiva no floema é por:", en: "Phloem sap flow is by:"}
        choices:
          - {pt: "Pressão de massa: fonte (folhas) → dreno (raízes/frutos)", en: "Mass flow: source (leaves) → sink (roots/fruits)"}
          - {pt: "Apenas gravidade", en: "Just gravity"}
          - {pt: "Apenas vento", en: "Just wind"}
          - {pt: "Sem padrão", en: "No pattern"}
        correctAnswer: {pt: "Pressão de massa: fonte (folhas) → dreno (raízes/frutos)", en: "Mass flow: source (leaves) → sink (roots/fruits)"}
        rationale: {pt: "Como carregamento de açúcar nas folhas puxa água por osmose, então pressão move seiva aos drenos.", en: "Because sugar loading in leaves pulls water osmotically, pressure moves sap to sinks."}
        objectives: [biology.plant_physiology]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Nutrição mineral", en: "Mineral nutrition"}
    description: {pt: "Como plantas obtêm nutrientes.", en: "How plants get nutrients."}
    exercises:
      - type: choice
        question: {pt: "Macronutrientes essenciais para plantas:", en: "Essential plant macronutrients:"}
        choices:
          - {pt: "N, P, K, Ca, Mg, S (e C/H/O do CO₂/água)", en: "N, P, K, Ca, Mg, S (plus C/H/O from CO₂/water)"}
          - {pt: "Apenas Au", en: "Just Au"}
          - {pt: "Apenas He", en: "Just He"}
          - {pt: "Apenas Si", en: "Just Si"}
        correctAnswer: {pt: "N, P, K, Ca, Mg, S (e C/H/O do CO₂/água)", en: "N, P, K, Ca, Mg, S (plus C/H/O from CO₂/water)"}
        rationale: {pt: "Como precisam em grande quantidade para construir biomoléculas, então fertilizantes NPK são padrão agrícola.", en: "Because they need them in large amounts to build biomolecules, NPK fertilizers are agricultural standard."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Nitrogênio é importante para:", en: "Nitrogen is important for:"}
        choices:
          - {pt: "Aminoácidos, proteínas, clorofila e ácidos nucleicos", en: "Amino acids, proteins, chlorophyll, and nucleic acids"}
          - {pt: "Apenas cor", en: "Just color"}
          - {pt: "Apenas sabor", en: "Just flavor"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Aminoácidos, proteínas, clorofila e ácidos nucleicos", en: "Amino acids, proteins, chlorophyll, and nucleic acids"}
        rationale: {pt: "Como N é abundante em moléculas vitais, então deficiência causa amarelamento (clorose) e crescimento ruim.", en: "Because N is abundant in vital molecules, deficiency causes yellowing (chlorosis) and poor growth."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Bactérias fixadoras de nitrogênio:", en: "Nitrogen-fixing bacteria:"}
        choices:
          - {pt: "Convertem N₂ atmosférico em NH₃ utilizável (em raízes de leguminosas)", en: "Convert atmospheric N₂ to usable NH₃ (in legume roots)"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
          - {pt: "Não existem", en: "Don't exist"}
          - {pt: "Apenas em peixes", en: "Only in fish"}
        correctAnswer: {pt: "Convertem N₂ atmosférico em NH₃ utilizável (em raízes de leguminosas)", en: "Convert atmospheric N₂ to usable NH₃ (in legume roots)"}
        rationale: {pt: "Como Rhizobium simbiose com soja/feijão, então a planta ganha N e a bactéria ganha açúcares — mutualismo.", en: "Because Rhizobium symbiose with soy/bean, plant gains N and bacterium gains sugars — mutualism."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Micorriza é:", en: "Mycorrhiza is:"}
        choices:
          - {pt: "Associação fungo-raiz que aumenta absorção de água/nutrientes", en: "Fungus-root association boosting water/nutrient uptake"}
          - {pt: "Tipo de doença", en: "Type of disease"}
          - {pt: "Tipo de hormônio", en: "Type of hormone"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Associação fungo-raiz que aumenta absorção de água/nutrientes", en: "Fungus-root association boosting water/nutrient uptake"}
        rationale: {pt: "Como hifas do fungo expandem área de absorção, então plantas com micorriza crescem melhor — em troca recebem açúcares.", en: "Because fungal hyphae expand absorption area, plants with mycorrhiza grow better — in exchange they get sugars."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Plantas absorvem água por:", en: "Plants absorb water through:"}
        choices:
          - {pt: "Raízes (especialmente pelos radiculares)", en: "Roots (especially root hairs)"}
          - {pt: "Folhas apenas", en: "Just leaves"}
          - {pt: "Caules apenas", en: "Just stems"}
          - {pt: "Não absorvem", en: "Don't absorb"}
        correctAnswer: {pt: "Raízes (especialmente pelos radiculares)", en: "Roots (especially root hairs)"}
        rationale: {pt: "Como pelos radiculares aumentam superfície enormemente, então a captura é eficiente — diferenciação celular vital.", en: "Because root hairs hugely expand surface, capture is efficient — vital cell differentiation."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Plantas absorvem CO₂ por:", en: "Plants absorb CO₂ through:"}
        choices:
          - {pt: "Estômatos das folhas (difusão)", en: "Leaf stomata (diffusion)"}
          - {pt: "Raízes apenas", en: "Just roots"}
          - {pt: "Caules apenas", en: "Just stems"}
          - {pt: "Não absorvem", en: "Don't absorb"}
        correctAnswer: {pt: "Estômatos das folhas (difusão)", en: "Leaf stomata (diffusion)"}
        rationale: {pt: "Como CO₂ atmosférico é matéria-prima da fotossíntese, então estômatos abertos garantem entrada — mas perdem água.", en: "Because atmospheric CO₂ is photosynthesis raw material, open stomata ensure entry — but lose water."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Trade-off central das plantas terrestres:", en: "Central trade-off in land plants:"}
        choices:
          - {pt: "Estômatos abertos: ganha CO₂ mas perde água; fechados: invertido", en: "Open stomata: gain CO₂ but lose water; closed: opposite"}
          - {pt: "Apenas crescer", en: "Just grow"}
          - {pt: "Apenas dormir", en: "Just sleep"}
          - {pt: "Sem trade-off", en: "No trade-off"}
        correctAnswer: {pt: "Estômatos abertos: ganha CO₂ mas perde água; fechados: invertido", en: "Open stomata: gain CO₂ but lose water; closed: opposite"}
        rationale: {pt: "Como dois recursos vitais competem, então plantas evoluíram estratégias (C4, CAM) para mitigar — natural-engineering.", en: "Because two vital resources compete, plants evolved strategies (C4, CAM) to mitigate — natural engineering."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Quanta água uma árvore grande pode transpirar por dia?", en: "How much water can a large tree transpire per day?"}
        choices:
          - {pt: "Centenas de litros (varia com espécie e clima)", en: "Hundreds of liters (varies with species and climate)"}
          - {pt: "Apenas 1 mL", en: "Just 1 mL"}
          - {pt: "Apenas 1 gota", en: "Just one drop"}
          - {pt: "Não transpira", en: "Doesn't transpire"}
        correctAnswer: {pt: "Centenas de litros (varia com espécie e clima)", en: "Hundreds of liters (varies with species and climate)"}
        rationale: {pt: "Como folhas têm enorme área de superfície e estômatos abertos durante o dia, então o fluxo é massivo.", en: "Because leaves have enormous surface area and open stomata during the day, flow is massive."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Sintomas de deficiência mineral:", en: "Mineral deficiency symptoms:"}
        choices:
          - {pt: "Variam: clorose (N, Mg), pontas queimadas (K), folhas roxas (P)", en: "Vary: chlorosis (N, Mg), tip burn (K), purple leaves (P)"}
          - {pt: "Apenas crescer", en: "Just grow"}
          - {pt: "Apenas mudar de cor", en: "Just change color"}
          - {pt: "Não existem", en: "Don't exist"}
        correctAnswer: {pt: "Variam: clorose (N, Mg), pontas queimadas (K), folhas roxas (P)", en: "Vary: chlorosis (N, Mg), tip burn (K), purple leaves (P)"}
        rationale: {pt: "Como cada nutriente tem papel específico, então a falta produz sinais característicos — diagnóstico visual.", en: "Because each nutrient has a specific role, deficiency produces characteristic signs — visual diagnosis."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: transporte vegetal:", en: "Summary: plant transport:"}
        choices:
          - {pt: "Xilema sobe água/sais por coesão-tensão; floema desce açúcares por pressão de massa", en: "Xylem rises water/salts by cohesion-tension; phloem descends sugars by mass flow"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em frutas", en: "Only in fruits"}
          - {pt: "Sem mecanismo", en: "No mechanism"}
        correctAnswer: {pt: "Xilema sobe água/sais por coesão-tensão; floema desce açúcares por pressão de massa", en: "Xylem rises water/salts by cohesion-tension; phloem descends sugars by mass flow"}
        rationale: {pt: "Como dois sistemas paralelos atendem necessidades opostas, então plantas terrestres mantêm fisiologia integrada.", en: "Because two parallel systems serve opposite needs, land plants maintain integrated physiology."}
        objectives: [biology.plant_physiology]
        difficulty: 4
target: 20
