title:
  pt: "🌲 Comunidades e sucessão ecológica"
  en: "🌲 Communities and ecological succession"
level: '4A'
subject: biology
objectives: [biology.ecology_advanced]
difficulty: 4
authorNotes: "Sucessão primária/secundária, espécies pioneiras vs clímax, biodiversidade."
example:
  pt: "Ex.: rocha nua → líquens (pioneiros) → musgos → ervas → arbustos → floresta clímax."
  en: "Ex.: bare rock → lichens (pioneers) → mosses → herbs → shrubs → climax forest."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Comunidades", en: "Communities"}
    description: {pt: "Como espécies coexistem e mudam.", en: "How species coexist and change."}
    exercises:
      - type: choice
        question: {pt: "Comunidade ecológica é:", en: "Ecological community is:"}
        choices:
          - {pt: "Conjunto de populações de espécies que interagem em uma área", en: "Set of interacting species populations in an area"}
          - {pt: "Apenas uma espécie", en: "Just one species"}
          - {pt: "Apenas plantas", en: "Just plants"}
          - {pt: "Sem definição", en: "No definition"}
        correctAnswer: {pt: "Conjunto de populações de espécies que interagem em uma área", en: "Set of interacting species populations in an area"}
        rationale: {pt: "Como predação, competição, mutualismo emergem, então comunidades são redes ecológicas dinâmicas.", en: "Because predation, competition, mutualism emerge, communities are dynamic ecological networks."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Riqueza de espécies é:", en: "Species richness is:"}
        choices:
          - {pt: "Número total de espécies em uma comunidade", en: "Total number of species in a community"}
          - {pt: "Apenas tamanho", en: "Just size"}
          - {pt: "Apenas peso", en: "Just weight"}
          - {pt: "Apenas idade", en: "Just age"}
        correctAnswer: {pt: "Número total de espécies em uma comunidade", en: "Total number of species in a community"}
        rationale: {pt: "Como mais espécies = maior complexidade, então riqueza é métrica básica de biodiversidade.", en: "Because more species = greater complexity, richness is a basic biodiversity metric."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Diversidade de espécies considera:", en: "Species diversity considers:"}
        choices:
          - {pt: "Riqueza + abundância relativa (uniformidade)", en: "Richness + relative abundance (evenness)"}
          - {pt: "Apenas riqueza", en: "Just richness"}
          - {pt: "Apenas tamanho", en: "Just size"}
          - {pt: "Apenas cor", en: "Just color"}
        correctAnswer: {pt: "Riqueza + abundância relativa (uniformidade)", en: "Richness + relative abundance (evenness)"}
        rationale: {pt: "Como índices (Shannon) combinam quantos e quão equilibradas, então fornecem visão mais completa que só riqueza.", en: "Because indices (Shannon) combine how many and how balanced, they give a fuller view than richness alone."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Sucessão primária:", en: "Primary succession:"}
        choices:
          - {pt: "Começa em substrato sem solo (rocha nua, lava nova) — leva séculos", en: "Begins on soil-free substrate (bare rock, new lava) — takes centuries"}
          - {pt: "Apenas em florestas", en: "Only in forests"}
          - {pt: "Sempre rápida", en: "Always fast"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Começa em substrato sem solo (rocha nua, lava nova) — leva séculos", en: "Begins on soil-free substrate (bare rock, new lava) — takes centuries"}
        rationale: {pt: "Como precisa formar solo do zero, então é lenta — líquens iniciam quebrando rocha em partículas.", en: "Because it must build soil from scratch, it's slow — lichens start by breaking rock into particles."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Sucessão secundária:", en: "Secondary succession:"}
        choices:
          - {pt: "Em área perturbada que ainda tem solo (após incêndio, abandono agrícola)", en: "In disturbed area that still has soil (after fire, farm abandonment)"}
          - {pt: "Apenas em deserto", en: "Only in desert"}
          - {pt: "Sempre lenta", en: "Always slow"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Em área perturbada que ainda tem solo (após incêndio, abandono agrícola)", en: "In disturbed area that still has soil (after fire, farm abandonment)"}
        rationale: {pt: "Como solo já existe, então é mais rápida — décadas em vez de séculos.", en: "Because soil already exists, it's faster — decades instead of centuries."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Espécies pioneiras:", en: "Pioneer species:"}
        choices:
          - {pt: "Primeiras a colonizar — tolerantes (líquens, musgos, gramíneas)", en: "First to colonize — tolerant (lichens, mosses, grasses)"}
          - {pt: "Apenas árvores grandes", en: "Just large trees"}
          - {pt: "Apenas animais", en: "Just animals"}
          - {pt: "Não existem", en: "Don't exist"}
        correctAnswer: {pt: "Primeiras a colonizar — tolerantes (líquens, musgos, gramíneas)", en: "First to colonize — tolerant (lichens, mosses, grasses)"}
        rationale: {pt: "Como sobrevivem em condições adversas, então preparam solo e ambiente para sucessoras.", en: "Because they survive harsh conditions, they prepare soil and environment for successors."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Comunidade clímax:", en: "Climax community:"}
        choices:
          - {pt: "Estado relativamente estável e maduro de uma sucessão", en: "Relatively stable and mature stage of succession"}
          - {pt: "Apenas o início", en: "Just the start"}
          - {pt: "Sempre instável", en: "Always unstable"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Estado relativamente estável e maduro de uma sucessão", en: "Relatively stable and mature stage of succession"}
        rationale: {pt: "Como composição muda lentamente, então o clímax depende do clima — floresta tropical, savana, tundra.", en: "Because composition changes slowly, climax depends on climate — tropical forest, savanna, tundra."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Espécies-chave (keystone) são:", en: "Keystone species are:"}
        choices:
          - {pt: "Têm efeito desproporcionalmente grande na estrutura da comunidade", en: "Have disproportionately large effect on community structure"}
          - {pt: "Apenas as mais abundantes", en: "Just the most abundant"}
          - {pt: "Apenas as maiores", en: "Just the largest"}
          - {pt: "Não existem", en: "Don't exist"}
        correctAnswer: {pt: "Têm efeito desproporcionalmente grande na estrutura da comunidade", en: "Have disproportionately large effect on community structure"}
        rationale: {pt: "Como remover lobos altera vegetação inteira (cascata trófica), então sua importância excede a abundância numérica.", en: "Because removing wolves alters whole vegetation (trophic cascade), their importance exceeds numerical abundance."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Cascata trófica:", en: "Trophic cascade:"}
        choices:
          - {pt: "Mudanças em um nível trófico afetam outros (ex.: lobos → veados → vegetação)", en: "Changes in one trophic level affect others (e.g., wolves → deer → vegetation)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Mudanças em um nível trófico afetam outros (ex.: lobos → veados → vegetação)", en: "Changes in one trophic level affect others (e.g., wolves → deer → vegetation)"}
        rationale: {pt: "Como demonstrado em Yellowstone após reintrodução de lobos, então um predador moldou rios e florestas.", en: "Because demonstrated in Yellowstone after wolf reintroduction, one predator shaped rivers and forests."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Espécie indicadora:", en: "Indicator species:"}
        choices:
          - {pt: "Sua presença/saúde reflete condições ambientais (ex.: liquens, anfíbios)", en: "Its presence/health reflects environmental conditions (e.g., lichens, amphibians)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Não existe", en: "Doesn't exist"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Sua presença/saúde reflete condições ambientais (ex.: liquens, anfíbios)", en: "Its presence/health reflects environmental conditions (e.g., lichens, amphibians)"}
        rationale: {pt: "Como anfíbios têm pele permeável e detectam poluição, então seu declínio sinaliza degradação ambiental.", en: "Because amphibians have permeable skin and detect pollution, their decline signals environmental degradation."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Biodiversidade e biomas", en: "Biodiversity and biomes"}
    description: {pt: "Padrões globais.", en: "Global patterns."}
    exercises:
      - type: choice
        question: {pt: "Hipótese da \"perturbação intermediária\":", en: "Intermediate disturbance hypothesis:"}
        choices:
          - {pt: "Diversidade é máxima com perturbação moderada (nem nula nem extrema)", en: "Diversity is highest with moderate disturbance (neither none nor extreme)"}
          - {pt: "Apenas calma é boa", en: "Only calm is good"}
          - {pt: "Sem perturbação", en: "No disturbance"}
          - {pt: "Apenas extremo", en: "Only extreme"}
        correctAnswer: {pt: "Diversidade é máxima com perturbação moderada (nem nula nem extrema)", en: "Diversity is highest with moderate disturbance (neither none nor extreme)"}
        rationale: {pt: "Como perturbações abrem espaço para novas espécies sem aniquilar todas, então o equilíbrio dinâmico maximiza diversidade.", en: "Because disturbances open space for new species without wiping out all, dynamic balance maximizes diversity."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Gradiente latitudinal de diversidade:", en: "Latitudinal diversity gradient:"}
        choices:
          - {pt: "Mais espécies perto do equador (florestas tropicais), menos nos polos", en: "More species near equator (tropical forests), fewer at poles"}
          - {pt: "Igual em toda parte", en: "Equal everywhere"}
          - {pt: "Mais nos polos", en: "More at poles"}
          - {pt: "Sem padrão", en: "No pattern"}
        correctAnswer: {pt: "Mais espécies perto do equador (florestas tropicais), menos nos polos", en: "More species near equator (tropical forests), fewer at poles"}
        rationale: {pt: "Como mais energia solar + estabilidade climática histórica favorecem especiação, então trópicos abrigam ~50% das espécies.", en: "Because more solar energy + historical climate stability favor speciation, tropics host ~50% of species."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Hotspot de biodiversidade:", en: "Biodiversity hotspot:"}
        choices:
          - {pt: "Região com alta diversidade endêmica e grande ameaça (ex.: Mata Atlântica)", en: "Region with high endemic diversity and major threat (e.g., Atlantic Forest)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Não existe", en: "Doesn't exist"}
          - {pt: "Apenas em deserto", en: "Only in desert"}
        correctAnswer: {pt: "Região com alta diversidade endêmica e grande ameaça (ex.: Mata Atlântica)", en: "Region with high endemic diversity and major threat (e.g., Atlantic Forest)"}
        rationale: {pt: "Como concentram espécies únicas, então perdê-las significa extinção global — prioridade conservacionista.", en: "Because they concentrate unique species, losing them means global extinction — conservation priority."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Bioma:", en: "Biome:"}
        choices:
          - {pt: "Grande região com clima e vida características (floresta tropical, savana, tundra, deserto)", en: "Large region with characteristic climate and life (tropical forest, savanna, tundra, desert)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas oceano", en: "Just ocean"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Grande região com clima e vida características (floresta tropical, savana, tundra, deserto)", en: "Large region with characteristic climate and life (tropical forest, savanna, tundra, desert)"}
        rationale: {pt: "Como temperatura + precipitação determinam vegetação dominante, então biomas similares aparecem em latitudes semelhantes.", en: "Because temperature + precipitation determine dominant vegetation, similar biomes appear at similar latitudes."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Floresta tropical úmida:", en: "Tropical rainforest:"}
        choices:
          - {pt: "Quente, úmida, biodiversidade extrema, solo pobre (nutrientes na biomassa)", en: "Hot, humid, extreme biodiversity, poor soil (nutrients in biomass)"}
          - {pt: "Fria e seca", en: "Cold and dry"}
          - {pt: "Sem vida", en: "Lifeless"}
          - {pt: "Apenas em deserto", en: "Only in desert"}
        correctAnswer: {pt: "Quente, úmida, biodiversidade extrema, solo pobre (nutrientes na biomassa)", en: "Hot, humid, extreme biodiversity, poor soil (nutrients in biomass)"}
        rationale: {pt: "Como decomposição rápida recicla nutrientes para árvores, então o solo é magro mas a vida exuberante.", en: "Because fast decomposition recycles nutrients to trees, soil is thin but life is lush."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Savana:", en: "Savanna:"}
        choices:
          - {pt: "Gramíneas + árvores esparsas, estações chuvosa/seca, fogo natural", en: "Grasses + scattered trees, wet/dry seasons, natural fires"}
          - {pt: "Floresta densa", en: "Dense forest"}
          - {pt: "Sempre nevada", en: "Always snowy"}
          - {pt: "Sem vida", en: "Lifeless"}
        correctAnswer: {pt: "Gramíneas + árvores esparsas, estações chuvosa/seca, fogo natural", en: "Grasses + scattered trees, wet/dry seasons, natural fires"}
        rationale: {pt: "Como fogo periódico mantém a estrutura, então savanas dependem de perturbações para não virarem floresta.", en: "Because periodic fire maintains structure, savannas depend on disturbance to not become forest."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Tundra:", en: "Tundra:"}
        choices:
          - {pt: "Frio extremo, permafrost, baixa biodiversidade, vegetação rasteira", en: "Extreme cold, permafrost, low biodiversity, low vegetation"}
          - {pt: "Quente e úmida", en: "Hot and humid"}
          - {pt: "Floresta densa", en: "Dense forest"}
          - {pt: "Sempre verde", en: "Always green"}
        correctAnswer: {pt: "Frio extremo, permafrost, baixa biodiversidade, vegetação rasteira", en: "Extreme cold, permafrost, low biodiversity, low vegetation"}
        rationale: {pt: "Como solo permanente congelado limita raízes, então só plantas pequenas e adaptadas sobrevivem.", en: "Because permanently frozen soil limits roots, only small adapted plants survive."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Recife de coral:", en: "Coral reef:"}
        choices:
          - {pt: "Bioma marinho de alta biodiversidade — coral em mutualismo com algas zooxantelas", en: "High-biodiversity marine biome — coral in mutualism with zooxanthellae algae"}
          - {pt: "Apenas pedras", en: "Just rocks"}
          - {pt: "Sem vida", en: "Lifeless"}
          - {pt: "Apenas em água doce", en: "Only freshwater"}
        correctAnswer: {pt: "Bioma marinho de alta biodiversidade — coral em mutualismo com algas zooxantelas", en: "High-biodiversity marine biome — coral in mutualism with zooxanthellae algae"}
        rationale: {pt: "Como coral fornece estrutura e algas fornecem fotossíntese, então recifes sustentam ~25% das espécies marinhas.", en: "Because coral provides structure and algae provide photosynthesis, reefs sustain ~25% of marine species."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Branqueamento de corais:", en: "Coral bleaching:"}
        choices:
          - {pt: "Stress térmico expulsa algas → coral fica branco e pode morrer", en: "Heat stress expels algae → coral turns white and may die"}
          - {pt: "Apenas mudança natural", en: "Just natural change"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Sempre reversível", en: "Always reversible"}
        correctAnswer: {pt: "Stress térmico expulsa algas → coral fica branco e pode morrer", en: "Heat stress expels algae → coral turns white and may die"}
        rationale: {pt: "Como aquecimento dos oceanos é crescente, então recifes em todo planeta estão em colapso — alvo de conservação urgente.", en: "Because ocean warming is rising, reefs worldwide are collapsing — urgent conservation target."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: comunidades evoluem por:", en: "Summary: communities evolve via:"}
        choices:
          - {pt: "Sucessão (mudanças ordenadas) e perturbações (mantêm diversidade)", en: "Succession (ordered changes) and disturbance (maintains diversity)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
          - {pt: "Sem padrão", en: "No pattern"}
        correctAnswer: {pt: "Sucessão (mudanças ordenadas) e perturbações (mantêm diversidade)", en: "Succession (ordered changes) and disturbance (maintains diversity)"}
        rationale: {pt: "Como ecossistemas são dinâmicos, então o equilíbrio entre sucessão e distúrbio molda biodiversidade global.", en: "Because ecosystems are dynamic, the balance between succession and disturbance shapes global biodiversity."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
target: 20
