title:
  pt: "🎓 Revisão geral — nível 4A"
  en: "🎓 General review — level 4A"
level: '4A'
subject: biology
objectives: [biology.gene_expression, biology.mutations, biology.biotech, biology.metabolism, biology.plant_physiology, biology.animal_physiology, biology.ecology_advanced, biology.scientific_method, biology.lab_techniques, biology.evolution_advanced]
difficulty: 4
authorNotes: "Revisão cumulativa: gene expression, mutações, biotec, metabolismo, fisiologia, ecologia, método, evolução."
example:
  pt: "Ex.: gene → mRNA → proteína → função; mutação → variação → seleção → evolução; energia → respiração/fotossíntese."
  en: "Ex.: gene → mRNA → protein → function; mutation → variation → selection → evolution; energy → respiration/photosynthesis."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Genética molecular e metabolismo", en: "Molecular genetics and metabolism"}
    description: {pt: "Reveja os pilares.", en: "Review the pillars."}
    exercises:
      - type: choice
        question: {pt: "Promotor é:", en: "Promoter is:"}
        choices:
          - {pt: "Sequência de DNA onde RNA polimerase se liga (início da transcrição)", en: "DNA sequence where RNA polymerase binds (transcription start)"}
          - {pt: "Tipo de proteína", en: "Type of protein"}
          - {pt: "Tipo de açúcar", en: "Type of sugar"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Sequência de DNA onde RNA polimerase se liga (início da transcrição)", en: "DNA sequence where RNA polymerase binds (transcription start)"}
        rationale: {pt: "Como controla quando/onde gene é transcrito, então é nó central da regulação gênica.", en: "Because it controls when/where gene is transcribed, it's a central regulation node."}
        objectives: [biology.gene_expression]
        difficulty: 4
      - type: choice
        question: {pt: "Mutação frameshift causa:", en: "Frameshift mutation causes:"}
        choices:
          - {pt: "Mudança no quadro de leitura — proteína completamente alterada", en: "Reading frame shift — protein completely altered"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas silenciosa", en: "Always silent"}
          - {pt: "Sempre missense", en: "Always missense"}
        correctAnswer: {pt: "Mudança no quadro de leitura — proteína completamente alterada", en: "Reading frame shift — protein completely altered"}
        rationale: {pt: "Como ribossomos leem de 3 em 3, então adicionar/remover 1 ou 2 bases muda toda a leitura.", en: "Because ribosomes read 3-by-3, adding/removing 1 or 2 bases shifts the whole reading."}
        objectives: [biology.mutations]
        difficulty: 4
      - type: choice
        question: {pt: "PCR amplifica DNA usando:", en: "PCR amplifies DNA using:"}
        choices:
          - {pt: "Ciclos térmicos + Taq polimerase + primers + dNTPs", en: "Thermal cycles + Taq polymerase + primers + dNTPs"}
          - {pt: "Apenas calor", en: "Just heat"}
          - {pt: "Apenas frio", en: "Just cold"}
          - {pt: "Sem enzima", en: "No enzyme"}
        correctAnswer: {pt: "Ciclos térmicos + Taq polimerase + primers + dNTPs", en: "Thermal cycles + Taq polymerase + primers + dNTPs"}
        rationale: {pt: "Como cada ciclo dobra a quantidade, então 30 ciclos geram >10⁹ cópias — base de diagnósticos moleculares.", en: "Because each cycle doubles the amount, 30 cycles yield >10⁹ copies — basis of molecular diagnostics."}
        objectives: [biology.biotech]
        difficulty: 4
      - type: choice
        question: {pt: "Glicólise gera (líquido por glicose):", en: "Glycolysis yields (net per glucose):"}
        choices:
          - {pt: "2 ATP + 2 NADH + 2 piruvato", en: "2 ATP + 2 NADH + 2 pyruvate"}
          - {pt: "30 ATP", en: "30 ATP"}
          - {pt: "Apenas O₂", en: "Just O₂"}
          - {pt: "Sem produto", en: "No product"}
        correctAnswer: {pt: "2 ATP + 2 NADH + 2 piruvato", en: "2 ATP + 2 NADH + 2 pyruvate"}
        rationale: {pt: "Como gasta 2 e produz 4 ATP, então saldo líquido é 2 — também 2 NADH para a cadeia respiratória.", en: "Because it spends 2 and produces 4 ATP, net balance is 2 — also 2 NADH for the respiratory chain."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Cadeia respiratória + ATP-sintase produzem:", en: "ETC + ATP synthase produce:"}
        choices:
          - {pt: "Maior parte do ATP via gradiente de H⁺ (quimiosmose) — usa O₂", en: "Most ATP via H⁺ gradient (chemiosmosis) — uses O₂"}
          - {pt: "Apenas calor", en: "Just heat"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Sem produção", en: "No production"}
        correctAnswer: {pt: "Maior parte do ATP via gradiente de H⁺ (quimiosmose) — usa O₂", en: "Most ATP via H⁺ gradient (chemiosmosis) — uses O₂"}
        rationale: {pt: "Como ~26-28 ATP saem da cadeia respiratória, então é fonte principal de energia em respiração aeróbia.", en: "Because ~26-28 ATP come from ETC, it's the main energy source in aerobic respiration."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Ciclo de Calvin requer:", en: "Calvin cycle requires:"}
        choices:
          - {pt: "ATP + NADPH (das reações de luz) para fixar CO₂", en: "ATP + NADPH (from light reactions) to fix CO₂"}
          - {pt: "Apenas luz", en: "Just light"}
          - {pt: "Apenas O₂", en: "Just O₂"}
          - {pt: "Sem entrada", en: "No input"}
        correctAnswer: {pt: "ATP + NADPH (das reações de luz) para fixar CO₂", en: "ATP + NADPH (from light reactions) to fix CO₂"}
        rationale: {pt: "Como sintetiza glicose a partir de CO₂, então depende dos produtos da fase clara — fluxo unidirecional.", en: "Because it synthesizes glucose from CO₂, it depends on light-phase products — unidirectional flow."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "RuBisCO é:", en: "RuBisCO is:"}
        choices:
          - {pt: "Enzima que fixa CO₂ no Calvin — proteína mais abundante na Terra", en: "Enzyme that fixes CO₂ in Calvin — most abundant protein on Earth"}
          - {pt: "Tipo de hormônio", en: "Type of hormone"}
          - {pt: "Tipo de açúcar", en: "Type of sugar"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Enzima que fixa CO₂ no Calvin — proteína mais abundante na Terra", en: "Enzyme that fixes CO₂ in Calvin — most abundant protein on Earth"}
        rationale: {pt: "Como cada planta produz tonelada métrica de RuBisCO, então sua massa total no planeta é gigantesca.", en: "Because every plant produces a metric ton of RuBisCO, its total mass on Earth is gigantic."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Acoplamento energético com ATP:", en: "Energy coupling with ATP:"}
        choices:
          - {pt: "Reação exergônica (ATP→ADP) impulsiona reação endergônica", en: "Exergonic reaction (ATP→ADP) drives endergonic reaction"}
          - {pt: "Sempre falha", en: "Always fails"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Reação exergônica (ATP→ADP) impulsiona reação endergônica", en: "Exergonic reaction (ATP→ADP) drives endergonic reaction"}
        rationale: {pt: "Como soma ΔG fica negativa, então o conjunto é espontâneo — princípio universal do metabolismo.", en: "Because total ΔG becomes negative, the combo is spontaneous — universal metabolism principle."}
        objectives: [biology.metabolism]
        difficulty: 4
      - type: choice
        question: {pt: "Xilema vs floema:", en: "Xylem vs phloem:"}
        choices:
          - {pt: "Xilema sobe água/sais; floema desce/distribui açúcares", en: "Xylem rises water/salts; phloem descends/distributes sugars"}
          - {pt: "Idênticos", en: "Identical"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem função", en: "No function"}
        correctAnswer: {pt: "Xilema sobe água/sais; floema desce/distribui açúcares", en: "Xylem rises water/salts; phloem descends/distributes sugars"}
        rationale: {pt: "Como dois sistemas paralelos atendem necessidades opostas, então plantas terrestres mantêm fisiologia integrada.", en: "Because two parallel systems serve opposite needs, land plants maintain integrated physiology."}
        objectives: [biology.plant_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Auxina causa fototropismo ao:", en: "Auxin causes phototropism by:"}
        choices:
          - {pt: "Acumular no lado sombreado, alongando células — caule curva à luz", en: "Accumulating on shaded side, elongating cells — stem bends to light"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas em raízes", en: "Only in roots"}
        correctAnswer: {pt: "Acumular no lado sombreado, alongando células — caule curva à luz", en: "Accumulating on shaded side, elongating cells — stem bends to light"}
        rationale: {pt: "Como crescimento desigual gera curvatura, então a planta se orienta para maximizar fotossíntese.", en: "Because uneven growth generates curvature, the plant orients to maximize photosynthesis."}
        objectives: [biology.plant_physiology]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Ecologia, método, evolução", en: "Ecology, method, evolution"}
    description: {pt: "Mais revisão integrativa.", en: "More integrative review."}
    exercises:
      - type: choice
        question: {pt: "Homeostase em humanos é:", en: "Human homeostasis is:"}
        choices:
          - {pt: "Equilíbrio dinâmico via sensores, integradores e efetores em alças de feedback", en: "Dynamic balance via sensors, integrators, and effectors in feedback loops"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem mecanismo", en: "No mechanism"}
          - {pt: "Apenas em jovens", en: "Only in young"}
        correctAnswer: {pt: "Equilíbrio dinâmico via sensores, integradores e efetores em alças de feedback", en: "Dynamic balance via sensors, integrators, and effectors in feedback loops"}
        rationale: {pt: "Como enzimas falhariam sem ela, então homeostase é a essência da vida fisiológica.", en: "Because enzymes would fail without it, homeostasis is the essence of physiological life."}
        objectives: [biology.animal_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Crescimento logístico tem:", en: "Logistic growth has:"}
        choices:
          - {pt: "Capacidade de suporte (K) — taxa cai ao se aproximar do limite", en: "Carrying capacity (K) — rate slows nearing limit"}
          - {pt: "Sem limite", en: "No limit"}
          - {pt: "Sempre rápido", en: "Always fast"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Capacidade de suporte (K) — taxa cai ao se aproximar do limite", en: "Carrying capacity (K) — rate slows nearing limit"}
        rationale: {pt: "Como recursos finitos, então toda população tem teto eventualmente — curva em \"S\".", en: "Because resources are finite, every population eventually has a ceiling — \"S-shape\" curve."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Sucessão primária começa em:", en: "Primary succession begins on:"}
        choices:
          - {pt: "Substrato sem solo (rocha nua, lava nova)", en: "Soil-free substrate (bare rock, new lava)"}
          - {pt: "Floresta madura", en: "Mature forest"}
          - {pt: "Apenas em deserto", en: "Only in desert"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Substrato sem solo (rocha nua, lava nova)", en: "Soil-free substrate (bare rock, new lava)"}
        rationale: {pt: "Como precisa formar solo do zero, então é lenta — líquens iniciam quebrando rocha em partículas.", en: "Because it must build soil from scratch, it's slow — lichens start by breaking rock into particles."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Ciclo do carbono inclui:", en: "Carbon cycle includes:"}
        choices:
          - {pt: "Fotossíntese, respiração, decomposição, queima de combustíveis fósseis", en: "Photosynthesis, respiration, decomposition, fossil fuel burning"}
          - {pt: "Apenas vulcões", en: "Just volcanoes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem ciclo", en: "No cycle"}
        correctAnswer: {pt: "Fotossíntese, respiração, decomposição, queima de combustíveis fósseis", en: "Photosynthesis, respiration, decomposition, fossil fuel burning"}
        rationale: {pt: "Como múltiplos processos movem C, então ciclo natural mantém equilíbrio — mas humanos aceleraram dramaticamente.", en: "Because multiple processes move C, natural cycle maintains balance — but humans dramatically accelerated."}
        objectives: [biology.ecology_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Hipótese científica deve ser:", en: "Scientific hypothesis must be:"}
        choices:
          - {pt: "Testável e falseável", en: "Testable and falsifiable"}
          - {pt: "Apenas opinião", en: "Just opinion"}
          - {pt: "Sempre verdadeira", en: "Always true"}
          - {pt: "Sem teste", en: "Untestable"}
        correctAnswer: {pt: "Testável e falseável", en: "Testable and falsifiable"}
        rationale: {pt: "Como falseabilidade (Popper) distingue ciência, então hipóteses inverificáveis ficam fora do método científico.", en: "Because falsifiability (Popper) distinguishes science, unverifiable hypotheses fall outside the method."}
        objectives: [biology.scientific_method]
        difficulty: 4
      - type: choice
        question: {pt: "Estudo duplo-cego:", en: "Double-blind study:"}
        choices:
          - {pt: "Nem pesquisador nem participante sabem quem recebe tratamento", en: "Neither researcher nor participant knows who got treatment"}
          - {pt: "Apenas pesquisador sabe", en: "Just researcher knows"}
          - {pt: "Apenas participante sabe", en: "Just participant knows"}
          - {pt: "Todos sabem", en: "Everyone knows"}
        correctAnswer: {pt: "Nem pesquisador nem participante sabem quem recebe tratamento", en: "Neither researcher nor participant knows who got treatment"}
        rationale: {pt: "Como expectativas afetam resultados, então cegamento é padrão-ouro em ensaios clínicos.", en: "Because expectations affect results, blinding is the gold standard in clinical trials."}
        objectives: [biology.scientific_method]
        difficulty: 4
      - type: choice
        question: {pt: "Microscópio TEM permite ver:", en: "TEM microscope shows:"}
        choices:
          - {pt: "Estruturas internas em alta resolução (ribossomos, vírus)", en: "Internal structures at high resolution (ribosomes, viruses)"}
          - {pt: "Apenas superfícies", en: "Just surfaces"}
          - {pt: "Apenas células vivas", en: "Just live cells"}
          - {pt: "Sem ampliação", en: "No magnification"}
        correctAnswer: {pt: "Estruturas internas em alta resolução (ribossomos, vírus)", en: "Internal structures at high resolution (ribosomes, viruses)"}
        rationale: {pt: "Como elétrons têm comprimento de onda menor que luz, então TEM resolve detalhes muito menores.", en: "Because electrons have smaller wavelength than light, TEM resolves much finer detail."}
        objectives: [biology.lab_techniques]
        difficulty: 4
      - type: choice
        question: {pt: "Equação de Hardy-Weinberg:", en: "Hardy-Weinberg equation:"}
        choices:
          - {pt: "p² + 2pq + q² = 1", en: "p² + 2pq + q² = 1"}
          - {pt: "E = mc²", en: "E = mc²"}
          - {pt: "p + q = 0", en: "p + q = 0"}
          - {pt: "Sem equação", en: "No equation"}
        correctAnswer: {pt: "p² + 2pq + q² = 1", en: "p² + 2pq + q² = 1"}
        rationale: {pt: "Como descreve frequências de equilíbrio sob acasalamento aleatório, então é referência para detectar evolução.", en: "Because it describes equilibrium frequencies under random mating, it's a reference for detecting evolution."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Especiação alopátrica ocorre por:", en: "Allopatric speciation happens via:"}
        choices:
          - {pt: "Isolamento geográfico → divergência → isolamento reprodutivo", en: "Geographic isolation → divergence → reproductive isolation"}
          - {pt: "Sempre simpátrica", en: "Always sympatric"}
          - {pt: "Sem barreira", en: "No barrier"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Isolamento geográfico → divergência → isolamento reprodutivo", en: "Geographic isolation → divergence → reproductive isolation"}
        rationale: {pt: "Como sem fluxo gênico cada população evolui separadamente, então tentilhões de Galápagos são exemplo clássico.", en: "Because without gene flow each population evolves separately, Galápagos finches are the classic example."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo final do nível 4A:", en: "Final 4A summary:"}
        choices:
          - {pt: "Biologia molecular + bioenergética + fisiologia + ecologia + evolução = ciência integrada da vida", en: "Molecular biology + bioenergetics + physiology + ecology + evolution = integrated life science"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Biologia molecular + bioenergética + fisiologia + ecologia + evolução = ciência integrada da vida", en: "Molecular biology + bioenergetics + physiology + ecology + evolution = integrated life science"}
        rationale: {pt: "Como tudo conecta-se em escalas (molécula→ecossistema→evolução), então biologia moderna unifica abordagens.", en: "Because everything connects across scales (molecule→ecosystem→evolution), modern biology unifies approaches."}
        objectives: [biology.evolution_advanced]
        difficulty: 4
target: 20
