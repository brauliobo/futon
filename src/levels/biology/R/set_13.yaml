        difficulty: 5
        question:
          pt: Em pediatric surgery, FETO + EXIT procedures…
          en: In pediatric surgery, FETO + EXIT procedures…
        choices:
          - Fetoscopic Endoluminal Tracheal Occlusion CDH; EXIT (Ex Utero Intrapartum Treatment) airway
          - Apenas histórica
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Fetoscopic Endoluminal Tracheal Occlusion CDH; EXIT (Ex Utero Intrapartum Treatment) airway
        rationale:
          pt: 'FETO: severe CDH em utero balloon → distends lungs (TOTAL Deprest NEJM 2021 positive). EXIT (Ex Utero Intrapartum Treatment): partial delivery while on placental support, secure airway/intervention before cord clamping. Indications: airway obstruction (CHAOS, large neck masses cervical teratoma, EXIT-to-ECMO CDH). CHOP, BCM-TCH centers. Vary: Outhouse Children''s, Cleveland.'
          en: 'FETO: severe CDH in utero balloon → distends lungs (TOTAL Deprest NEJM 2021 positive). EXIT (Ex Utero Intrapartum Treatment): partial delivery while on placental support, secure airway/intervention before cord clamping. Indications: airway obstruction (CHAOS, large neck masses, cervical teratoma, EXIT-to-ECMO CDH). CHOP, BCM-TCH centers. Varies: Outhouse Children''s, Cleveland.'
        objectives: [FETO EXIT]
      - type: choice
        difficulty: 5
        question:
          pt: Em natural orifice surgery (NOTES, "scarless"), evolution…
          en: In natural orifice surgery (NOTES, "scarless"), evolution…
        choices:
          - Pioneered Anthony Kalloo 2004 (transgastric); transvaginal cholecystectomy; not widely adopted
          - Apenas teórica
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Pioneered Anthony Kalloo 2004 (transgastric); transvaginal cholecystectomy; not widely adopted
        rationale:
          pt: 'NOTES (Natural Orifice Translumenal Endoscopic Surgery): Hopkins Anthony Kalloo 2004. Transgastric, transvaginal, transrectal cholecystectomy (no skin incision). Theoretical no abdominal scar, less pain. Reality: technical complexity, contamination risk, only modest advantages over laparoscopy. Modest adoption. POEM (Per-Oral Endoscopic Myotomy) for achalasia successful niche. ESD (Endoscopic Submucosal Dissection) early gastric cancer.'
          en: 'NOTES (Natural Orifice Translumenal Endoscopic Surgery): Hopkins Anthony Kalloo 2004. Transgastric, transvaginal, transrectal cholecystectomy (no skin incision). Theoretically no abdominal scar, less pain. Reality: technical complexity, contamination risk, only modest advantages over laparoscopy. Modest adoption. POEM (Per-Oral Endoscopic Myotomy) for achalasia successful niche. ESD (Endoscopic Submucosal Dissection) for early gastric cancer.'
        objectives: [NOTES]
      - type: choice
        difficulty: 5
        question:
          pt: Em hand transplantation, status…
          en: In hand transplantation, status…
        choices:
          - Vascularized Composite Allograft (VCA); ~150 worldwide; lifelong immunosuppression challenges
          - Apenas teórico
          - Sem qualquer aplicação
          - Apenas pediatric
        correctAnswer: Vascularized Composite Allograft (VCA); ~150 worldwide; lifelong immunosuppression challenges
        rationale:
          pt: 'Hand transplantation: first 1998 Lyon (Dubernard). Louisville Brigham/Hopkins, Penn, UCLA US programs. ~150 hands transplanted globally. Lifelong immunosuppression: cancer, infection, kidney damage. Tolerance protocols emerging. Functional outcomes: most regain useful function, sensation, motor. Face, larynx, abdominal wall, penis, uterus VCA also performed. Bioethics: quality life vs life-saving organ transplantation.'
          en: 'Hand transplantation: first 1998 Lyon (Dubernard). Louisville Brigham/Hopkins, Penn, UCLA US programs. ~150 hands transplanted globally. Lifelong immunosuppression: cancer, infection, kidney damage. Emerging tolerance protocols. Functional outcomes: most regain useful function, sensation, motor. Face, larynx, abdominal wall, penis, uterus VCA also performed. Bioethics: quality of life vs life-saving organ transplantation.'
        objectives: [Hand transplant]
      - type: choice
        difficulty: 5
        question:
          pt: Em uterine transplantation, recent advances…
          en: In uterine transplantation, recent advances…
        choices:
          - Sweden first 2014 (Brännström) live birth; living + deceased donors; ~30 centers globally
          - Apenas teórico
          - Sem qualquer aplicação
          - Apenas pediatric
        correctAnswer: Sweden first 2014 (Brännström) live birth; living + deceased donors; ~30 centers globally
        rationale:
          pt: 'Uterine transplantation: Mats Brännström (Gothenburg) 2014 first live birth post-Tx. Living donor (mother, sister) preferred. Deceased donor: Brazil 2017 first DCD. Cleveland Clinic 2017 US first. ~80 babies born globally. Indication: AUFI (absolute uterine factor infertility) MRKH syndrome, hysterectomy. Removed after pregnancies. Lifelong IS not needed. Ethically intriguing — life-changing not life-saving.'
          en: 'Uterine transplantation: Mats Brännström (Gothenburg) 2014 first live birth post-Tx. Living donor (mother, sister) preferred. Deceased donor: Brazil 2017 first DCD. Cleveland Clinic 2017 first in US. ~80 babies born globally. Indications: AUFI (absolute uterine factor infertility) MRKH syndrome, hysterectomy. Removed after pregnancies. Lifelong IS not needed. Ethically intriguing — life-changing, not life-saving.'
        objectives: [Uterine transplant]
      - type: choice
        difficulty: 5
        question:
          pt: Em extracorporeal organ perfusion, OCS (Organ Care System) TransMedics…
          en: In extracorporeal organ perfusion, OCS (Organ Care System) TransMedics…
        choices:
          - Heart, lung, liver normothermic ex-vivo perfusion; expand donor criteria, viability assessment
          - Apenas histórica
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Heart, lung, liver normothermic ex-vivo perfusion; expand donor criteria, viability assessment
        rationale:
          pt: 'TransMedics OCS: heart 2021 FDA, lung 2018, liver Phase 3. Normothermic ex-vivo perfusion: organ kept beating/breathing/perfused outside body. Viability assessment, expansion DCD donors, longer preservation transport. OCS Heart EXPAND trial: utilization marginal donors. OCS Liver PROTECT trial: normothermic vs cold. Game-changer organ shortage. Crescente adoption.'
          en: 'TransMedics OCS: heart 2021 FDA, lung 2018, liver Phase 3. Normothermic ex-vivo perfusion: organ kept beating/breathing/perfused outside body. Viability assessment, DCD donor expansion, longer preservation transport. OCS Heart EXPAND trial: marginal donor utilization. OCS Liver PROTECT trial: normothermic vs cold. Game-changer for organ shortage. Growing adoption.'
        objectives: [OCS]
      - type: choice
        difficulty: 5
        question:
          pt: Em AR/VR surgery, applications include…
          en: In AR/VR surgery, applications include…
        choices:
          - Pre-op planning (3D anatomical models), intra-op navigation (xvision Augmedics), training
          - Apenas marketing
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Pre-op planning (3D anatomical models), intra-op navigation (xvision Augmedics), training
        rationale:
          pt: 'AR/VR surgery: pre-operative anatomical models (3D CT/MRI rendering, Surgical Theater). Intra-op navigation: xvision (Augmedics) AR spine surgery FDA 2019, see-through CT overlay. Microsoft HoloLens collaborations. Training: FundamentalVR, OssoVR. Outcomes data emerging. Cost barriers. Microsurgery: Symani Microsure microsurgical robot 9 DOF.'
          en: 'AR/VR surgery: pre-operative anatomical models (3D CT/MRI rendering, Surgical Theater). Intra-op navigation: xvision (Augmedics) AR spine surgery FDA 2019, see-through CT overlay. Microsoft HoloLens collaborations. Training: FundamentalVR, OssoVR. Outcomes data emerging. Cost barriers. Microsurgery: Symani Microsure 9-DOF microsurgical robot.'
        objectives: [AR/VR surgery]
      - type: choice
        difficulty: 5
        question:
          pt: Em opioid-sparing post-surgical analgesia, multimodal includes…
          en: In opioid-sparing post-surgical analgesia, multimodal includes…
        choices:
          - Local/regional anesthesia, NSAIDs, gabapentinoids, acetaminophen, IV ketamine, suzetrigine 2025
          - Apenas opioid
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Local/regional anesthesia, NSAIDs, gabapentinoids, acetaminophen, IV ketamine, suzetrigine 2025
        rationale:
          pt: 'Multimodal opioid-sparing analgesia: ERAS principle. Pre-op acetaminophen + gabapentinoid. Intra-op regional (epidural, peripheral nerve blocks Exparel liposomal bupivacaine). Post-op NSAIDs (toradol), acetaminophen. IV ketamine sub-anesthetic. Lidocaine infusion. PCA with adjunct. Suzetrigine VX-548 NaV1.8 inhibitor FDA 2025 first non-opioid acute. Prescribing fewer opioids overall.'
          en: 'Multimodal opioid-sparing analgesia: ERAS principle. Pre-op acetaminophen + gabapentinoid. Intra-op regional (epidural, peripheral nerve blocks Exparel liposomal bupivacaine). Post-op NSAIDs (toradol), acetaminophen. Sub-anesthetic IV ketamine. Lidocaine infusion. PCA with adjuncts. Suzetrigine VX-548 NaV1.8 inhibitor FDA 2025 first non-opioid acute. Fewer opioids prescribed overall.'
        objectives: [Multimodal analgesia]
      - type: choice
        difficulty: 5
        question:
          pt: Em surgical safety checklists, WHO 2009 study (Haynes)…
          en: In surgical safety checklists, WHO 2009 study (Haynes)…
        choices:
          - 19-item time-out reduces mortality ~47%, complications ~36% in 8-hospital study
          - Apenas trivial
          - Sem qualquer impacto
          - Apenas em US
        correctAnswer: 19-item time-out reduces mortality ~47%, complications ~36% in 8-hospital study
        rationale:
          pt: 'Atul Gawande WHO Surgical Safety Checklist (Haynes NEJM 2009): 8 hospitals (HIC + LMIC). 19-item: sign in (pre-induction), time out (pre-skin), sign out. Mortality reduction 1.5% → 0.8%, complications 11% → 7%. Adopted globally. Caveat: Urbach 2014 Ontario universal mandate negative — implementation fidelity matters. WHO Safer Surgery initiative continues.'
          en: 'Atul Gawande WHO Surgical Safety Checklist (Haynes NEJM 2009): 8 hospitals (HIC + LMIC). 19-item: sign in (pre-induction), time out (pre-skin), sign out. Mortality reduction 1.5% → 0.8%, complications 11% → 7%. Adopted globally. Caveat: Urbach 2014 Ontario universal mandate negative — implementation fidelity matters. WHO Safer Surgery initiative continues.'
        objectives: [WHO checklist]
      - type: choice
        difficulty: 5
        question:
          pt: Em da Vinci competitors emerging…
          en: In da Vinci emerging competitors…
        choices:
          - Versius CMR Surgical UK, Hugo Medtronic, Hominis (transvaginal), Symani Microsure microsurgery
          - Apenas Intuitive
          - Sem qualquer evolução
          - Apenas em US
        correctAnswer: Versius CMR Surgical UK, Hugo Medtronic, Hominis (transvaginal), Symani Microsure microsurgery
        rationale:
          pt: 'Robotic surgery competition: Intuitive da Vinci ~75% market US. Versius (CMR Surgical UK) modular. Hugo (Medtronic) crescente acceptance. Hominis (Memic) FDA 2021 transvaginal. Symani (Medical Microinstruments) microsurgery FDA 2024. CMR + Hugo expanding hospital adoption — cheaper recurring costs vs da Vinci. Asia-specific (Senhance Asensus, Korea Korea). Patent expiration 2024-25 may catalyze competition.'
          en: 'Robotic surgery competition: Intuitive da Vinci ~75% US market. Versius (CMR Surgical UK) modular. Hugo (Medtronic) growing acceptance. Hominis (Memic) FDA 2021 transvaginal. Symani (Medical Microinstruments) microsurgery FDA 2024. CMR + Hugo expanding hospital adoption — cheaper recurring costs vs da Vinci. Asia-specific (Senhance Asensus, Korea Korea). 2024-25 patent expiration may catalyze competition.'
        objectives: [da Vinci competitors]
      - type: choice
        difficulty: 5
        question:
          pt: Future surgical innovation includes…
          en: Future surgical innovation includes…
        choices:
          - Tele-surgery 5G (Marescaux 2001 first transatlantic), AI-assisted, autonomous tasks, organoid-on-chip
          - Apenas histórica
          - Sem qualquer evolução
          - Apenas em US
        correctAnswer: Tele-surgery 5G (Marescaux 2001 first transatlantic), AI-assisted, autonomous tasks, organoid-on-chip
