title:
  pt: Inovação Cirúrgica e Robótica
  en: Surgical Innovation and Robotics
level: R
subject: biology
objectives:
  - Compreender da Vinci robotic surgery
  - Reconhecer minimally invasive evolution
  - Identificar TAVR, MitraClip
  - Avaliar AR/VR surgical
difficulty: 5
authorNotes: |
  Surgical innovation. da Vinci Intuitive 2000 FDA. Laparoscopic cholecystectomy 1987 Mouret.
  TAVR Cribier 2002. MitraClip 2003. ERAS protocols. AR/VR surgery. Surgical robotics next-gen.
  See & Spray AI surgery. Augmented reality navigation.
example:
  question:
    pt: da Vinci Surgical System (Intuitive Surgical FDA 2000) revolutionou robotic surgery por…
    en: da Vinci Surgical System (Intuitive Surgical FDA 2000) revolutionized robotic surgery by…
  choices:
    - 3D vision, 7-DOF instruments, tremor filter, scalable motion; >12M procedures globally
    - Apenas marketing
    - Sem qualquer impacto
    - Apenas em pediatric
  correctAnswer: 3D vision, 7-DOF instruments, tremor filter, scalable motion; >12M procedures globally
  rationale:
    pt: 'da Vinci (Intuitive Surgical FDA 2000): 3D HD stereoscopic, EndoWrist 7-DOF (vs 4 conventional laparoscopic), tremor filtering, scalable motion (1:1 to 5:1). >12M procedures globally 2024. Dominante em prostatectomy, hysterectomy, cardiac MIDCAB. Custo per case high (~$2-5k device + $1-3k disposables). Concorrentes: Versius (CMR Surgical), Hugo (Medtronic), Symani (microsurgery), Hominis (transvaginal).'
    en: 'da Vinci (Intuitive Surgical FDA 2000): 3D HD stereoscopic, EndoWrist 7-DOF (vs 4 conventional laparoscopic), tremor filtering, scalable motion (1:1 to 5:1). >12M procedures globally by 2024. Dominant in prostatectomy, hysterectomy, cardiac MIDCAB. High cost per case (~$2-5k device + $1-3k disposables). Competitors: Versius (CMR Surgical), Hugo (Medtronic), Symani (microsurgery), Hominis (transvaginal).'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Robótica + MIS
      en: Page 1 — Robotics + MIS
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em laparoscopic surgery birth, Mouret 1987 first…
          en: In laparoscopic surgery birth, Mouret 1987 first…
        choices:
          - Laparoscopic cholecystectomy France; revolution minimally invasive surgery
          - Apenas histórica
          - Sem qualquer impacto
          - Apenas em pediatric
        correctAnswer: Laparoscopic cholecystectomy France; revolution minimally invasive surgery
        rationale:
          pt: 'Philippe Mouret (Lyon France) 1987: first laparoscopic cholecystectomy. Inspirado por gynecologic laparoscopy (Semm). Spread rapidly: surgeon adoption viral. By 1990s 80%+ cholecystectomies laparoscopic. Lessons: surgical procedure innovation can move quickly when economic + outcomes alignment. Reduced LOS, recovery, pain. Now: cholecystectomy ~1M US/yr, 90%+ laparoscopic.'
          en: 'Philippe Mouret (Lyon France) 1987: first laparoscopic cholecystectomy. Inspired by gynecologic laparoscopy (Semm). Spread rapidly: surgeon adoption viral. By 1990s 80%+ of cholecystectomies were laparoscopic. Lessons: surgical procedure innovation can move quickly when economic + outcomes alignment. Reduced LOS, recovery, pain. Now: cholecystectomy ~1M US/yr, 90%+ laparoscopic.'
        objectives: [Mouret 1987]
      - type: choice
        difficulty: 5
        question:
          pt: TAVR (Transcatheter Aortic Valve Replacement) revolution…
          en: TAVR (Transcatheter Aortic Valve Replacement) revolution…
        choices:
          - Cribier 2002 first; PARTNER trials 2010s extended high → low risk; ~75% AS replacements US 2023
          - Apenas histórica
          - Sem qualquer mudança
          - Apenas em pediatric
        correctAnswer: Cribier 2002 first; PARTNER trials 2010s extended high → low risk; ~75% AS replacements US 2023
        rationale:
          pt: 'Alain Cribier (Rouen France) 2002 first percutaneous AVR. Edwards SAPIEN, Medtronic CoreValve. PARTNER trials (Leon NEJM 2010 extreme risk; 2011 high; 2016 intermediate; PARTNER 3 NEJM 2019 low risk). Now: ~75% AS replacements US TAVR (2023). Femoral access, ~1-2 day hospitalization vs SAVR weeks. Younger patients debate (long-term durability, future re-intervention). Mitral, tricuspid TAVR pipeline.'
          en: 'Alain Cribier (Rouen France) 2002 first percutaneous AVR. Edwards SAPIEN, Medtronic CoreValve. PARTNER trials (Leon NEJM 2010 extreme risk; 2011 high; 2016 intermediate; PARTNER 3 NEJM 2019 low risk). Now: ~75% of AS replacements in US are TAVR (2023). Femoral access, ~1-2 day hospitalization vs SAVR weeks. Debate in younger patients (long-term durability, future re-intervention). Mitral, tricuspid TAVR pipeline.'
        objectives: [TAVR]
      - type: choice
        difficulty: 5
        question:
          pt: MitraClip (Abbott FDA 2013) é…
          en: MitraClip (Abbott FDA 2013) is…
        choices:
          - Transcatheter mitral leaflet edge-to-edge repair; COAPT 2018 NEJM secondary MR HF
          - Apenas histórica
          - Sem qualquer aprovação
          - Apenas pediatric
        correctAnswer: Transcatheter mitral leaflet edge-to-edge repair; COAPT 2018 NEJM secondary MR HF
        rationale:
          pt: 'MitraClip (Abbott Vascular FDA 2013 high-risk MR): transcatheter clip A2-P2 leaflet edge-to-edge. Prinary MR (degenerative): EVEREST trials. Secondary MR (HF, cardiomyopathy): COAPT (Stone NEJM 2018) reduced HF hospitalization mortality vs medical therapy. MITRA-FR (Obadia NEJM 2018) negative — phenotype matters (proportional vs disproportional MR). PASCAL (Edwards) competitor. TEER (Transcatheter Edge-to-Edge Repair) era.'
          en: 'MitraClip (Abbott Vascular FDA 2013 high-risk MR): transcatheter A2-P2 leaflet edge-to-edge clip. Primary MR (degenerative): EVEREST trials. Secondary MR (HF, cardiomyopathy): COAPT (Stone NEJM 2018) reduced HF hospitalization and mortality vs medical therapy. MITRA-FR (Obadia NEJM 2018) negative — phenotype matters (proportional vs disproportional MR). PASCAL (Edwards) competitor. TEER (Transcatheter Edge-to-Edge Repair) era.'
        objectives: [MitraClip]
      - type: choice
        difficulty: 5
        question:
          pt: ERAS (Enhanced Recovery After Surgery) protocols…
          en: ERAS (Enhanced Recovery After Surgery) protocols…
        choices:
          - Multidisciplinary perioperative care reducing LOS, complications; ~40% reduction stay
          - Apenas trivial
          - Sem qualquer benefit
          - Apenas em pediatric
        correctAnswer: Multidisciplinary perioperative care reducing LOS, complications; ~40% reduction stay
        rationale:
          pt: 'ERAS Society (Henrik Kehlet 1990s+): multidisciplinary protocols. Pre-op carb loading, no NPO long, regional anesthesia/multimodal analgesia (opioid-sparing), goal-directed fluid, early enteral, early ambulation. Reduces LOS ~40%, complications ~30%. ERAS Cardiac Society 2019. Adoption global; gap LMIC. Outcomes-based. Helena Lim/Ottawa, Reims teams.'
          en: 'ERAS Society (Henrik Kehlet 1990s+): multidisciplinary protocols. Pre-op carb loading, no long NPO, regional anesthesia/multimodal analgesia (opioid-sparing), goal-directed fluid, early enteral feeding, early ambulation. Reduces LOS ~40%, complications ~30%. ERAS Cardiac Society 2019. Global adoption; gap LMIC. Outcomes-based. Helena Lim/Ottawa, Reims teams.'
        objectives: [ERAS]
      - type: choice
        difficulty: 5
        question:
          pt: Em surgical AI, intraoperative machine learning includes…
          en: In surgical AI, intraoperative machine learning includes…
        choices:
          - Critical View Safety AI for cholecystectomy (DeepFort), pixie sleeve gastrectomy
          - Apenas histórica
          - Sem qualquer aplicação
          - Apenas em US
        correctAnswer: Critical View Safety AI for cholecystectomy (DeepFort), pixie sleeve gastrectomy
        rationale:
          pt: 'Surgical AI: GoSurgical, Theator, Caresyntax, Activ Surgical, Theator. Real-time classification surgical phases, anatomy. Critical View of Safety (CVS) AI Strasberg cholecystectomy reducing biliary injury. Pixie ~bariatric. Augmented reality + AI navigation. Limit: regulatory (FDA Software as Medical Device classification, PCCP 2024 framework). Adoption barriers: workflow, cost, surgeon trust. Future: autonomous parts of surgery (anastomosis, suturing).'
          en: 'Surgical AI: GoSurgical, Theator, Caresyntax, Activ Surgical, Theator. Real-time classification of surgical phases, anatomy. Critical View of Safety (CVS) AI Strasberg cholecystectomy reducing biliary injury. Pixie ~bariatric. Augmented reality + AI navigation. Limit: regulatory (FDA Software as Medical Device classification, 2024 PCCP framework). Adoption barriers: workflow, cost, surgeon trust. Future: autonomous parts of surgery (anastomosis, suturing).'
        objectives: [Surgical AI]
      - type: choice
        difficulty: 5
        question:
          pt: Em LVAD (Left Ventricular Assist Device), HeartMate 3 (Abbott FDA 2017)…
          en: In LVAD (Left Ventricular Assist Device), HeartMate 3 (Abbott FDA 2017)…
        choices:
          - Magnetically-levitated centrifugal pump; reduced thrombosis, RAMP study Mehra 2018 NEJM
          - Apenas histórica
          - Sem qualquer evolução
          - Apenas em pediatric
        correctAnswer: Magnetically-levitated centrifugal pump; reduced thrombosis, RAMP study Mehra 2018 NEJM
        rationale:
          pt: 'HeartMate 3 (Abbott/Thoratec FDA aug/2017 BTT, oct/2018 DT): magnetically levitated centrifugal vs HeartMate II axial. MOMENTUM 3 (Mehra 2018 NEJM): superior 2y survival, dramatic less pump thrombosis (reoperation). DT (destination therapy) end-stage HF. Bridge to transplant. ENDURANCE 2018 HVAD vs HM3 — HVAD removed 2021 (Medtronic/Heartware withdrew). Single LVAD market.'
          en: 'HeartMate 3 (Abbott/Thoratec FDA Aug 2017 BTT, Oct 2018 DT): magnetically levitated centrifugal vs HeartMate II axial. MOMENTUM 3 (Mehra 2018 NEJM): superior 2y survival, dramatically less pump thrombosis (reoperation). DT (destination therapy) for end-stage HF. Bridge to transplant. ENDURANCE 2018 HVAD vs HM3 — HVAD removed 2021 (Medtronic/Heartware withdrew). Single LVAD market.'
        objectives: [HeartMate 3]
      - type: choice
        difficulty: 5
        question:
          pt: Em CABG vs PCI, multivessel CAD…
          en: In CABG vs PCI, multivessel CAD…
        choices:
          - SYNTAX score guides; CABG superior diabetic + LMCAD + complex; PCI for less complex/comorbid
          - Apenas PCI
          - Sem qualquer recomendação
          - Apenas em pediatric
        correctAnswer: SYNTAX score guides; CABG superior diabetic + LMCAD + complex; PCI for less complex/comorbid
        rationale:
          pt: 'SYNTAX trial (Mohr 2009-2013 NEJM): CABG vs PCI in multivessel CAD. CABG superior 5y MACCE, especialmente high SYNTAX score (>32, complex). FREEDOM (Farkouh 2012 NEJM): CABG superior diabetics. EXCEL/NOBLE (LMCAD): PCI non-inferior selected. 2021 ACC/AHA guidelines update. Heart Team approach. Drug-eluting stent (Cypher 2003 → Xience, Promus, Synergy). Bioabsorbable scaffolds (Absorb withdrew 2017).'
          en: 'SYNTAX trial (Mohr 2009-2013 NEJM): CABG vs PCI in multivessel CAD. CABG superior in 5y MACCE, especially high SYNTAX score (>32, complex). FREEDOM (Farkouh 2012 NEJM): CABG superior in diabetics. EXCEL/NOBLE (LMCAD): PCI non-inferior in selected. 2021 ACC/AHA guidelines update. Heart Team approach. Drug-eluting stent (Cypher 2003 → Xience, Promus, Synergy). Bioabsorbable scaffolds (Absorb withdrew 2017).'
        objectives: [CABG vs PCI]
      - type: choice
        difficulty: 5
        question:
          pt: Em ortopedic robotic, MAKO (Stryker), ROSA (Zimmer-Biomet) for…
          en: In orthopedic robotics, MAKO (Stryker), ROSA (Zimmer-Biomet) for…
        choices:
          - 'Total knee, hip arthroplasty: pre-op imaging-based planning, intra-op haptic constraints'
          - Apenas open surgery
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: 'Total knee, hip arthroplasty: pre-op imaging-based planning, intra-op haptic constraints'
        rationale:
          pt: 'Robotic ortho: Stryker MAKO (acquired 2013), Zimmer-Biomet ROSA Knee, Smith+Nephew Cori. Intuitive Surgical da Vinci spine (Smith+Nephew Mazor). Pre-op CT-based 3D plan + intra-op haptic robot guidance. Improved alignment outcomes vs conventional. Crescente adoption ~25% TKR (Total Knee Replacement) US. Cost-benefit debate. Robotics + AR + augmented reality next.'
          en: 'Robotic ortho: Stryker MAKO (acquired 2013), Zimmer-Biomet ROSA Knee, Smith+Nephew Cori. Intuitive Surgical da Vinci spine (Smith+Nephew Mazor). Pre-op CT-based 3D plan + intra-op haptic robot guidance. Improved alignment outcomes vs conventional. Growing adoption ~25% TKR (Total Knee Replacement) US. Cost-benefit debate. Robotics + AR + augmented reality next.'
        objectives: [MAKO ROSA]
      - type: choice
        difficulty: 5
        question:
          pt: Em transplant, expansion donor pool via…
          en: In transplant, donor pool expansion via…
        choices:
          - Hep C+ donors → Hep C− recipients (DAA cure), DCD (Donation after Circulatory Death), normothermic perfusion
          - Apenas living donors
          - Sem qualquer evolução
          - Apenas em pediatric
        correctAnswer: Hep C+ donors → Hep C− recipients (DAA cure), DCD (Donation after Circulatory Death), normothermic perfusion
        rationale:
          pt: 'Donor pool expansion: Hep C+ DBD donors → recipients (Goldberg NEJM 2017 THINKER): direct-acting antivirals cure recipient. ~30% organs. DCD (Donation after Circulatory Death): expanding lung, heart (TransMedics OCS). Ex-vivo normothermic perfusion (OCS Lung, OCS Heart 2021 FDA): viability assessment, longer preservation. Xenotransplantation 2022+ Bennett pig heart. Resolving organ shortage gradually.'
          en: 'Donor pool expansion: Hep C+ DBD donors → recipients (Goldberg NEJM 2017 THINKER): direct-acting antivirals cure the recipient. ~30% organs. DCD (Donation after Circulatory Death): expanding lung, heart (TransMedics OCS). Ex-vivo normothermic perfusion (OCS Lung, OCS Heart 2021 FDA): viability assessment, longer preservation. Xenotransplantation 2022+ Bennett pig heart. Gradually resolving organ shortage.'
        objectives: [Donor pool]
      - type: choice
        difficulty: 5
        question:
          pt: Em xenotransplantation, Bennett 2022 first pig heart…
          en: In xenotransplantation, Bennett 2022 first pig heart…
        choices:
          - University Maryland Bartley Griffith eIND, ~60 day survival; Slayman 2024 first pig kidney living recipient
          - Apenas teórico
          - Sem qualquer aprovação
          - Apenas pediatric
        correctAnswer: University Maryland Bartley Griffith eIND, ~60 day survival; Slayman 2024 first pig kidney living recipient
        rationale:
          pt: 'Bennett (Maryland Bartley Griffith jan/2022): pig heart from Revivicor 10-GE pig (3 KOs glycan, GHR-KO, 6 transgenes humanos). FDA eIND. Survived 60 days; PCMV reactivation contributed decline. Slayman (MGH abr/2024): first pig kidney transplanted in living recipient (eGenesis 69-edit pig). Pisano (NYU 2024) kidney + thymus. Looney (NYU 2024) longest survival ~100 days. Phase 1 trials starting 2024-2025.'
          en: 'Bennett (Maryland Bartley Griffith Jan 2022): pig heart from Revivicor 10-GE pig (3 glycan KOs, GHR-KO, 6 human transgenes). FDA eIND. Survived 60 days; PCMV reactivation contributed to decline. Slayman (MGH Apr 2024): first pig kidney transplanted in living recipient (eGenesis 69-edit pig). Pisano (NYU 2024) kidney + thymus. Looney (NYU 2024) longest survival ~100 days. Phase 1 trials starting 2024-2025.'
        objectives: [Xeno clinical]
