        question:
          pt: Em adrenal incidentaloma management 2023 European guidelines (ESE/ENSAT) recommend…
          en: In adrenal incidentaloma management 2023 European guidelines (ESE/ENSAT) recommend…
        choices:
          - Non-contrast CT phenotyping + 1mg dexamethasone suppression test for autonomous cortisol secretion (ACS); selective metanephrines, aldosterone/renin if hypertensive
          - Pure observation strategy without biochemical or imaging workup beyond initial CT
          - Universal adrenalectomy for every adrenal incidentaloma regardless of imaging features
          - Workup recommended only for adults without comorbidities or hypertension
        correctAnswer: Non-contrast CT phenotyping + 1mg dexamethasone suppression test for autonomous cortisol secretion (ACS); selective metanephrines, aldosterone/renin if hypertensive
        rationale:
          pt: 'Adrenal incidentaloma ~5-10% abdominal imaging. Workup: non-contrast CT (HU <10 = lipid-rich adenoma usually benign; >20 indeterminado considerar washout, MRI, biópsia raramente). 1 mg overnight DST cortisol >1.8 µg/dL → autonomous cortisol secretion (ACS) — antes "subclinical Cushing". ESE 2023 reconhece ACS associations CV, mortality, fragility fractures, T2D — surveillance/intervention case-by-case. Plasma fractionated metanephrines screening pheochromocytoma. Aldosterone/renin se HTN/hipocalemia. Mass >4cm ou suspicion → adrenalectomy. NCI EXPLORATION incidentaloma collaborative.'
          en: 'Adrenal incidentaloma ~5-10% abdominal imaging. Workup: non-contrast CT (HU <10 = lipid-rich adenoma usually benign; >20 indeterminate consider washout, MRI, rarely biopsy). 1 mg overnight DST cortisol >1.8 µg/dL → autonomous cortisol secretion (ACS) — formerly "subclinical Cushing". ESE 2023 recognizes ACS associations with CV, mortality, fragility fractures, T2D — surveillance/intervention case-by-case. Plasma fractionated metanephrines screen pheochromocytoma. Aldosterone/renin if HTN/hypokalemia. Mass >4cm or suspicion → adrenalectomy. NCI EXPLORATION incidentaloma collaborative.'
        objectives: [Adrenal incidentaloma]
