        question:
          pt: Em primary aldosteronism (PA), prevalence em hypertension é estimada em…
          en: In primary aldosteronism (PA), prevalence in hypertension is estimated at…
        choices:
          - 5-13% all hypertensive patients (broader than historic 1%); resistant HTN ~20%; markedly underscreened despite 2016 Endocrine Society recommendations
          - Extremely rare cause of hypertension at well below 0.01% population prevalence
          - Identified as the underlying cause in essentially every hypertensive patient
          - Built on a since-retracted primary aldosteronism dataset without independent multicenter replication or peer-reviewed confirmatory publication
        correctAnswer: 5-13% all hypertensive patients (broader than historic 1%); resistant HTN ~20%; markedly underscreened despite 2016 Endocrine Society recommendations
        rationale:
          pt: 'PA prevalence: dados modernos screening sistemático 5-13% all HTN, 20-25% resistant HTN. Underscreening crônico — Funder et al Endocrine Society 2016 guidelines amplas indicações (HTN ≥150/100, resistant, hypokalemia, adrenal incidentaloma + HTN, sleep apnea, family hx). Aldosterone/renin ratio (ARR) screening; saline infusion ou captopril challenge confirmação. Adrenal vein sampling localiza unilateral (adenoma — adrenalectomy curativa) vs bilateral (MRA spironolactone/eplerenone). PA → cardiac fibrosis, stroke, AF independent BP. Carey et al primary aldosteronism awareness.'
          en: 'PA prevalence: modern systematic screening data 5-13% all HTN, 20-25% resistant HTN. Chronic underscreening — Funder et al Endocrine Society 2016 guidelines have broad indications (HTN ≥150/100, resistant, hypokalemia, adrenal incidentaloma + HTN, sleep apnea, family hx). Aldosterone/renin ratio (ARR) screening; saline infusion or captopril challenge for confirmation. Adrenal vein sampling localizes unilateral (adenoma — adrenalectomy curative) vs bilateral (MRA spironolactone/eplerenone). PA → cardiac fibrosis, stroke, AF independent of BP. Carey et al primary aldosteronism awareness.'
        objectives: [Primary aldosteronism]
