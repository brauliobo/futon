        difficulty: 5
        question:
          pt: Em osteoporosis, romosozumab (Evenity, Amgen/UCB FDA 2019) atua via…
          en: In osteoporosis, romosozumab (Evenity, Amgen/UCB FDA 2019) acts via…
        choices:
          - Anti-sclerostin monoclonal antibody — dual effect ↑ bone formation + ↓ resorption; superior denosumab/alendronate fracture reduction; CV warning
          - Vitamin D supplementation alone as the established disease-modifying therapy
          - Lifestyle and exercise-only approach without pharmacologic intervention
          - Conventional menopausal hormone replacement therapy as primary treatment
        correctAnswer: Anti-sclerostin monoclonal antibody — dual effect ↑ bone formation + ↓ resorption; superior denosumab/alendronate fracture reduction; CV warning
        rationale:
          pt: 'Romosozumab: humanized mAb anti-sclerostin (Wnt pathway inhibitor osteócitos). Dual effect singular — ↑ formation + ↓ resorption transient. SC monthly × 12 doses (effect plateaus). FRAME trial: vertebral fx redução 73% vs placebo. ARCH trial: 48% redução new vertebral fx vs alendronate. Boxed warning CV events (MI, stroke) — não em high-risk. Sequenciamento: romosozumab × 1y → bisphosphonate ou denosumab. Alternatives: alendronate/risedronate/zoledronate (bisphosphonates), denosumab (anti-RANKL), teriparatide/abaloparatide (PTH analogs anabolic). Osteoporosis underdiagnosed/undertreated dramaticamente — care gap pós-fracture crisis.'
          en: 'Romosozumab: humanized mAb anti-sclerostin (Wnt pathway inhibitor in osteocytes). Singular dual effect — ↑ formation + ↓ resorption transient. SC monthly × 12 doses (effect plateaus). FRAME trial: vertebral fx reduction 73% vs placebo. ARCH trial: 48% reduction in new vertebral fx vs alendronate. Boxed CV warning (MI, stroke) — avoid in high-risk. Sequencing: romosozumab × 1y → bisphosphonate or denosumab. Alternatives: alendronate/risedronate/zoledronate (bisphosphonates), denosumab (anti-RANKL), teriparatide/abaloparatide (PTH analogs anabolic). Osteoporosis dramatically underdiagnosed/undertreated — post-fracture care gap crisis.'
        objectives: [Romosozumab]
      - type: choice
        difficulty: 5
        question:
          pt: Em PCOS (polycystic ovary syndrome) International Evidence-Based Guidelines 2023 (Teede et al) recommend first-line management…
          en: In PCOS (polycystic ovary syndrome) International Evidence-Based Guidelines 2023 (Teede et al) recommend first-line management…
        choices:
          - Lifestyle (diet/exercise/weight) + cardiometabolic + mental health screening; combined oral contraceptives for menstrual/androgen; metformin + COC if higher metabolic risk; letrozole first-line ovulation induction
          - Universal bilateral oophorectomy as first-line management for all PCOS patients
          - Observation-only strategy without lifestyle, contraceptive, or metformin trial
          - Strict avoidance of all hormonal contraceptive co-administration based on this concern
        correctAnswer: Lifestyle (diet/exercise/weight) + cardiometabolic + mental health screening; combined oral contraceptives for menstrual/androgen; metformin + COC if higher metabolic risk; letrozole first-line ovulation induction
        rationale:
          pt: 'PCOS Rotterdam criteria 2003 (2 of 3: oligo-ovulation, hyperandrogenism, polycystic ovaries). 2023 International Guidelines: lifestyle first-line all. CV/metabolic/mental health (depression/anxiety) screening systematic. COC menstrual + hyperandrogenism. Metformin se IGT/T2D risk ou + COC. Spironolactone hirsutism adjunctive. Letrozole > clomiphene first-line ovulation induction (Legro NEJM 2014). GLP-1 emerging for PCOS-obesity. New AMH-based criteria. Endometrial cancer surveillance long-amenorrhea. Bariatric surgery considered. ~10% women reproductive age affected.'
          en: 'PCOS Rotterdam criteria 2003 (2 of 3: oligo-ovulation, hyperandrogenism, polycystic ovaries). 2023 International Guidelines: lifestyle first-line for all. Systematic CV/metabolic/mental health (depression/anxiety) screening. COC for menstrual + hyperandrogenism. Metformin if IGT/T2D risk or + COC. Spironolactone hirsutism adjunctive. Letrozole > clomiphene first-line ovulation induction (Legro NEJM 2014). GLP-1 emerging for PCOS-obesity. New AMH-based criteria. Endometrial cancer surveillance for long amenorrhea. Bariatric surgery considered. ~10% women of reproductive age affected.'
        objectives: [PCOS guidelines]
