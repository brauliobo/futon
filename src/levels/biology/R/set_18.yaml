        correctAnswer: Multikinase inhibitors approved RAI-refractory progressive DTC; PFS extension; significant adverse events (HTN, fatigue, diarrhea, hand-foot)
        rationale:
          pt: 'DTC (papillary, follicular) ~80-90% sobrevida geral 10y. RAI-refractory progressive disease — opções limitadas pré-2013. Sorafenib (Nexavar) FDA 2013 DECISION trial PFS 10.8 vs 5.8 mo. Lenvatinib (Lenvima) FDA 2015 SELECT trial PFS 18.3 vs 3.6 mo (HR 0.21). Multikinase: VEGFR1-3, FGFR, RET, KIT. Side effects significant — HTN 70%, fatigue, diarrhea, palmar-plantar erythrodysesthesia. Pipeline targeted: cabozantinib MTC, selpercatinib RET-altered, dabrafenib+trametinib BRAF-mutant, larotrectinib/entrectinib NTRK-fusion. ATC anaplastic dabrafenib+trametinib BRAF V600E.'
          en: 'DTC (papillary, follicular) ~80-90% 10-yr overall survival. RAI-refractory progressive disease — limited options pre-2013. Sorafenib (Nexavar) FDA 2013 DECISION trial PFS 10.8 vs 5.8 mo. Lenvatinib (Lenvima) FDA 2015 SELECT trial PFS 18.3 vs 3.6 mo (HR 0.21). Multikinase: VEGFR1-3, FGFR, RET, KIT. Significant side effects — HTN 70%, fatigue, diarrhea, palmar-plantar erythrodysesthesia. Targeted pipeline: cabozantinib MTC, selpercatinib RET-altered, dabrafenib+trametinib BRAF-mutant, larotrectinib/entrectinib NTRK-fusion. ATC anaplastic dabrafenib+trametinib BRAF V600E.'
