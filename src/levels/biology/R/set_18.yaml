        rationale:
          pt: 'Stelo (Dexcom mar/2024 FDA), Lingo (Abbott jun/2024) — primeiros OTC CGM (over-the-counter, sem prescription) US. Indicados adults non-insulin-using ≥18, T2D non-insulin, prediabetes, wellness/lifestyle. 15-day wear (Stelo). $89/mo Stelo. Lingo wellness target broader. Open question: clinical impact non-DM populations? Concerns medicalization, healthy people anxiety glucose spikes, false positives. Levels Health, Nutrisense pioneers prescription-bridge. Endocrinology guidelines ainda formulando best-practice non-DM CGM. Insurer coverage non-DM unlikely.'
          en: 'Stelo (Dexcom Mar 2024 FDA), Lingo (Abbott Jun 2024) — first OTC CGM (over-the-counter, no prescription) in US. Indicated for adults non-insulin-using ≥18, T2D non-insulin, prediabetes, wellness/lifestyle. 15-day wear (Stelo). $89/mo Stelo. Lingo wellness target broader. Open question: clinical impact in non-DM populations? Concerns about medicalization, healthy people anxiety over glucose spikes, false positives. Levels Health, Nutrisense pioneered prescription-bridge model. Endocrinology guidelines still formulating best-practice non-DM CGM. Insurer coverage for non-DM unlikely.'
