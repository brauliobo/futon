        question:
          pt: Resmetirom (Rezdiffra, Madrigal Pharmaceuticals FDA mar/2024) é primeiro drug aprovado para…
          en: Resmetirom (Rezdiffra, Madrigal Pharmaceuticals FDA Mar 2024) is the first drug approved for…
        choices:
          - Non-cirrhotic NASH/MASH (F2-F3 fibrosis); thyroid hormone receptor-β liver-selective agonist; oral daily
          - Indication for decompensated cirrhosis including ascites and hepatic encephalopathy
          - Approved for obesity management without specific MASH histological criteria
          - Indication strictly limited to type 1 diabetes without type 2 or obesity use
        correctAnswer: Non-cirrhotic NASH/MASH (F2-F3 fibrosis); thyroid hormone receptor-β liver-selective agonist; oral daily
        rationale:
          pt: 'Resmetirom (Rezdiffra): THR-β liver-selective agonist → reduz hepatic fat e fibrosis. MAESTRO-NASH trial (NEJM 2024): NASH resolution sem worsening fibrosis ~26-30% vs 9.7% placebo (52 wk biopsy); fibrosis improvement ≥1 stage ~24-26%. FDA mar/2024 — primeiro drug NASH/MASH approval (após décadas de fracassos: obeticholic acid Intercept rejected, selonsertib, elafibranor, cenicriviroc). MASH = MAFLD/NAFLD renamed 2023 nomenclature consenso. Atual standard care: weight loss (incl GLP-1), DM control. Pipeline: pioglitazone, vitamin E, tirzepatide SYNERGY-NASH ongoing.'
          en: 'Resmetirom (Rezdiffra): THR-β liver-selective agonist → reduces hepatic fat and fibrosis. MAESTRO-NASH trial (NEJM 2024): NASH resolution without worsening fibrosis ~26-30% vs 9.7% placebo (52-wk biopsy); fibrosis improvement ≥1 stage ~24-26%. FDA Mar 2024 — first drug approved for NASH/MASH (after decades of failures: obeticholic acid Intercept rejected, selonsertib, elafibranor, cenicriviroc). MASH = MAFLD/NAFLD renamed in 2023 consensus nomenclature. Current standard care: weight loss (incl GLP-1), DM control. Pipeline: pioglitazone, vitamin E, tirzepatide SYNERGY-NASH ongoing.'
