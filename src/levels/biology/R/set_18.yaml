title:
  pt: Endocrinologia — Era GLP-1
  en: Endocrinology — GLP-1 Era
level: R
subject: biology
objectives:
  - Compreender semaglutide/tirzepatide cardiometabolic
  - Reconhecer T1D teplizumab/VX-880
  - Identificar AID closed loop CGM
  - Avaliar GLP-1 expansion (CKD/MASH/OSA/AUD)
difficulty: 5
authorNotes: |
  Endocrinology revolution. GLP-1 era post 2021 semaglutide STEP/SURPASS expansion.
  Tirzepatide (Mounjaro/Zepbound). Teplizumab Tzield T1D delay. VX-880 islet cells.
  AID closed loop CGM ubiquity. SGLT2-i T2D heart kidney. Retatrutide triple.
example:
  question:
    pt: Tirzepatide (Mounjaro 2022 T2D, Zepbound 2023 obesity, Eli Lilly) é primeiro agente clínico que combina ação em…
    en: Tirzepatide (Mounjaro 2022 T2D, Zepbound 2023 obesity, Eli Lilly) is the first clinical agent combining action on…
  choices:
    - GIP + GLP-1 receptor agonism (dual incretin); SC weekly; SURPASS T2D 15-22% A1c reduction; SURMOUNT obesity 20%+ weight loss
    - Standard basal-bolus insulin replacement regimen without disease modification
    - SGLT2 inhibitor monotherapy without GIP or GLP-1 receptor activity
    - DPP-4 inhibitor class effect without direct GIP or GLP-1 receptor agonism
  correctAnswer: GIP + GLP-1 receptor agonism (dual incretin); SC weekly; SURPASS T2D 15-22% A1c reduction; SURMOUNT obesity 20%+ weight loss
  rationale:
    pt: 'Tirzepatide é incretin dual GIP + GLP-1 RA. Mounjaro (T2D) FDA mai/2022; Zepbound (obesity) FDA nov/2023. SURPASS 1-5 trials T2D superior semaglutide A1c reduction ~2-2.5% e weight loss. SURMOUNT-1 obesity sem T2D ~22.5% weight loss em 72 wks. SURMOUNT-OSA, SURPASS-CVOT em curso. Side effects gastrointestinais (nausea, vomiting, diarreia, constipation) — comuns mas tolerable titration. Pancreatitis/MTC boxed warning class. Combo sucesso supera mono GLP-1.'
    en: 'Tirzepatide is a dual GIP + GLP-1 RA incretin. Mounjaro (T2D) FDA May 2022; Zepbound (obesity) FDA Nov 2023. SURPASS 1-5 trials T2D superior to semaglutide for A1c reduction ~2-2.5% and weight loss. SURMOUNT-1 obesity without T2D showed ~22.5% weight loss at 72 wks. SURMOUNT-OSA, SURPASS-CVOT ongoing. GI side effects (nausea, vomiting, diarrhea, constipation) common but tolerable with titration. Class-wide pancreatitis/MTC boxed warning. Combo outperforms GLP-1 mono.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — GLP-1 Expansion + T2D
      en: Page 1 — GLP-1 Expansion + T2D
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em STEP trials semaglutide (Wegovy, Novo Nordisk FDA 2021 obesity), os resultados pivotal mostraram…
          en: In STEP trials of semaglutide (Wegovy, Novo Nordisk FDA 2021 obesity), pivotal results showed…
        choices:
          - ~15% body weight reduction at 68 weeks (STEP-1) vs ~2.4% placebo; sustained with continued therapy; rebound after stopping
          - Restricted to a 1990s-era step trials semaglutide cohort framework without independent post-2010 replication or guideline endorsement
          - Driven by a single underpowered step trials semaglutide observational series lacking confirmatory follow-up across multicenter cohorts
          - Predates the modern step trials semaglutide consensus and was displaced by post-2015 society framework revisions and pivotal RCT readouts
        correctAnswer: ~15% body weight reduction at 68 weeks (STEP-1) vs ~2.4% placebo; sustained with continued therapy; rebound after stopping
        rationale:
          pt: 'STEP-1 (NEJM 2021) Wilding et al. semaglutide 2.4 mg SC weekly em obesity sem diabetes. Mean weight ↓ 14.9% vs 2.4% placebo, 68 wks. STEP-4 mostrou rebound se descontinua. STEP-5 sustained 2 yrs ~15.2%. STEP HFpEF, STEP-TEENS pediátrico aprovado dez/2022 ages 12+. Demand surge causou shortage 2022-2023, compounded versions emerging. Branded $1300/mo lista, gradual coverage. Class effect peso reduction 10-20% varia agente.'
          en: 'STEP-1 (NEJM 2021) Wilding et al. semaglutide 2.4 mg SC weekly in obesity without diabetes. Mean weight ↓ 14.9% vs 2.4% placebo at 68 wks. STEP-4 showed rebound on discontinuation. STEP-5 sustained 2 yrs ~15.2%. STEP HFpEF, STEP-TEENS pediatric approved Dec 2022 ages 12+. Demand surge caused shortage 2022-2023, compounded versions emerging. Branded $1300/mo list, gradual coverage. Class-wide weight reduction 10-20% varies by agent.'
        objectives: [STEP semaglutide]
      - type: choice
        difficulty: 5
        question:
          pt: SELECT trial (NEJM 2023, Lincoff et al.) demonstrou em pacientes obesidade sem diabetes que semaglutide 2.4 mg…
          en: SELECT trial (NEJM 2023, Lincoff et al.) demonstrated in obesity-without-diabetes patients that semaglutide 2.4 mg…
        choices:
          - Reduces 3P-MACE 20% (death/MI/stroke); first GLP-1 weight-loss agent with primary CV outcomes evidence in non-diabetics
          - Confined to a regional select trial pilot program without multinational regulatory adoption or cross-jurisdictional payer support
          - Built on a since-retracted select trial dataset without independent multicenter replication or peer-reviewed confirmatory publication
          - Reflects a pre-2000 select trial paradigm displaced by current society guideline updates and contemporary translational evidence
        correctAnswer: Reduces 3P-MACE 20% (death/MI/stroke); first GLP-1 weight-loss agent with primary CV outcomes evidence in non-diabetics
        rationale:
          pt: 'SELECT trial: ~17604 obesity adults com prior CV disease but sem diabetes, semaglutide 2.4 mg vs placebo, mean follow-up 39.8 mo. Primary 3P-MACE HR 0.80 (CI 0.72-0.90) p<0.001. Game-changer: estabeleceu que GLP-1 weight-loss agente reduces hard CV endpoints sem diabetes. Levou aprovação CV outcomes label expansion mar/2024. Drives payer coverage para CVD obesity. Implications cardiology + endocrinology integrados. Cost-effectiveness debate intensa.'
          en: 'SELECT trial: ~17604 obesity adults with prior CV disease but without diabetes, semaglutide 2.4 mg vs placebo, mean follow-up 39.8 mo. Primary 3P-MACE HR 0.80 (CI 0.72-0.90) p<0.001. Game-changer — established that a GLP-1 weight-loss agent reduces hard CV endpoints without diabetes. Led to CV outcomes label expansion Mar 2024. Drives payer coverage for CVD obesity. Integrates cardiology + endocrinology. Cost-effectiveness debate intense.'
        objectives: [SELECT CVOT]
      - type: choice
        difficulty: 5
        question:
          pt: Em FLOW trial (NEJM 2024, Perkovic et al.), semaglutide 1 mg em T2D + CKD demonstrou…
          en: In FLOW trial (NEJM 2024, Perkovic et al.), semaglutide 1 mg in T2D + CKD demonstrated…
        choices:
          - 24% reduction kidney outcome composite (kidney failure, ≥50% eGFR decline, kidney/CV death); FDA renal indication jan/2025
          - Tied to a discontinued industry flow trial program halted after pivotal trial readout disappointments and downstream futility analyses
          - Anchored on a single-center flow trial case series with no prospective cohort confirmation or registry-level corroborating signal
          - Indication strictly limited to type 1 diabetes without type 2 or obesity use
        correctAnswer: 24% reduction kidney outcome composite (kidney failure, ≥50% eGFR decline, kidney/CV death); FDA renal indication jan/2025
        rationale:
          pt: 'FLOW trial: ~3533 T2D + CKD (eGFR 25-75, ACR 100-5000) semaglutide 1 mg vs placebo. Primary composite kidney HR 0.76 (CI 0.66-0.88) p=0.0003. Stopped early eficácia. Adicionou GLP-1 ao arsenal CKD-T2D (junto SGLT2-i, finerenone, RAAS). FDA aprovou indicação CKD jan/2025. Mechanism: weight loss + hemodynamic + anti-inflammatory + direct podocyte. Multi-organ protection paradigma — CV + renal + metabolic. Coverage policy ainda evoluindo.'
          en: 'FLOW trial: ~3533 T2D + CKD (eGFR 25-75, ACR 100-5000) semaglutide 1 mg vs placebo. Primary composite kidney HR 0.76 (CI 0.66-0.88) p=0.0003. Stopped early for efficacy. Adds GLP-1 to CKD-T2D arsenal (alongside SGLT2-i, finerenone, RAAS). FDA approved CKD indication Jan 2025. Mechanism: weight loss + hemodynamic + anti-inflammatory + direct podocyte. Multi-organ protection paradigm — CV + renal + metabolic. Coverage policy still evolving.'
        objectives: [FLOW CKD]
      - type: choice
        difficulty: 5
        question:
          pt: SURMOUNT-OSA (NEJM 2024, Malhotra et al.) tirzepatide em obesity + moderate-severe OSA mostrou…
          en: SURMOUNT-OSA (NEJM 2024, Malhotra et al.) tirzepatide in obesity + moderate-severe OSA showed…
        choices:
          - AHI reduction ~25-29 events/h vs placebo; FDA dez/2024 first drug approved OSA — paradigm shift CPAP-only era
          - Sem efeito sobre AHI
          - Increased frequency of respiratory adverse events compared with placebo arm
          - Drawn from registry-only surmount-osa retrospective data with residual confounding never adjusted out by sensitivity analyses
        correctAnswer: AHI reduction ~25-29 events/h vs placebo; FDA dez/2024 first drug approved OSA — paradigm shift CPAP-only era
        rationale:
          pt: 'SURMOUNT-OSA: dois RCTs ~470 pacientes obesity + moderate-severe OSA. Tirzepatide reduziu AHI ~25-29 events/h vs placebo (~5). Weight loss correlacionou improvement OSA. FDA dez/2024 primeiro drug aprovado OSA. CPAP era ~40 anos sem alternative farmacológica. Implications massive — ~1B globally OSA, undertreated. Combinar tirzepatide + CPAP ou monotherapy. Custo + access barriers obvios. Clinical workflow integração sleep medicine + obesity.'
          en: 'SURMOUNT-OSA: two RCTs ~470 patients obesity + moderate-severe OSA. Tirzepatide reduced AHI by ~25-29 events/h vs placebo (~5). Weight loss correlated with OSA improvement. FDA Dec 2024 first drug approved for OSA. CPAP era ~40 yrs without pharmacological alternative. Massive implications — ~1B globally have OSA, undertreated. Combine tirzepatide + CPAP or monotherapy. Cost + access barriers obvious. Clinical workflow integrates sleep medicine + obesity.'
        objectives: [SURMOUNT-OSA]
      - type: choice
        difficulty: 5
        question:
          pt: Em GLP-1 alcohol use disorder (AUD) hypothesis, evidence preliminar 2024 sugere…
          en: In GLP-1 alcohol use disorder (AUD) hypothesis, preliminary 2024 evidence suggests…
        choices:
          - Reduced alcohol cravings/consumption signals (case reports, EHR retrospective, Phase 2 trials NIH); RCTs ongoing
          - FDA approval for alcohol use disorder is already on label following Phase 3 data
          - Backed by a withdrawn glp-1 alcohol use disorder guideline statement that subsequent specialty societies and federal agencies have disavowed
          - Rests on a press-release-only glp-1 alcohol use disorder announcement without peer-reviewed publication or independent biostatistical review
        correctAnswer: Reduced alcohol cravings/consumption signals (case reports, EHR retrospective, Phase 2 trials NIH); RCTs ongoing
        rationale:
          pt: 'GLP-1 + AUD: signals from EHR cohorts (Klausen et al. 2022 PLOS), case reports patients reporting reduced cravings tobacco/alcohol/opioids on GLP-1. Mechanisms: nucleus accumbens dopamine modulation, reward circuit. Phase 2 RCTs em curso (NIAAA, Univ Pennsylvania, Aarhus). Não FDA-approved AUD ainda — disulfiram, naltrexone, acamprosate are current options. Off-label e self-medication phenomena. AUD undertreated dramaticamente — qualquer effective new agent transformative. Smoking cessation similar signals.'
          en: 'GLP-1 + AUD: signals from EHR cohorts (Klausen et al. 2022 PLOS), case reports of patients reporting reduced cravings for tobacco/alcohol/opioids on GLP-1. Mechanisms: nucleus accumbens dopamine modulation, reward circuit. Phase 2 RCTs ongoing (NIAAA, Univ Pennsylvania, Aarhus). Not FDA-approved for AUD yet — disulfiram, naltrexone, acamprosate are current options. Off-label use and self-medication phenomena observed. AUD dramatically undertreated — any effective new agent would be transformative. Smoking cessation similar signals.'
        objectives: [GLP-1 AUD]
      - type: choice
        difficulty: 5
        question:
          pt: Retatrutide (Eli Lilly Phase 2 2023) é tri-agonist em desenvolvimento com ação em…
          en: Retatrutide (Eli Lilly Phase 2 2023) is a tri-agonist in development acting on…
        choices:
          - GLP-1 + GIP + glucagon receptors; Phase 2 NEJM 2023 ~24% weight loss at 48 wks (highest reported); Phase 3 TRIUMPH ongoing
          - Cited from a contested retatrutide meta-analysis with major heterogeneity, publication bias, and inconsistent outcome definitions
          - Based on a non-randomized retatrutide comparator arm where allocation was investigator-determined without intent-to-treat analysis
          - Belongs to a discontinued early-phase retatrutide program halted after futility readouts and unfavorable safety signal review
        correctAnswer: GLP-1 + GIP + glucagon receptors; Phase 2 NEJM 2023 ~24% weight loss at 48 wks (highest reported); Phase 3 TRIUMPH ongoing
        rationale:
          pt: 'Retatrutide LY3437943: triple agonist GLP-1 + GIP + glucagon. Phase 2 NEJM 2023 (Jastreboff et al.) obesity sem T2D mean weight loss ~24% at 48 wks (~17% T2D Phase 2). Glucagon component adiciona energy expenditure beyond GIP+GLP-1. Phase 3 TRIUMPH program 2024-2027. Posicionado para superar tirzepatide. Side effects similar GI. Class-wide concerns: muscle loss with rapid weight loss, sarcopenia, regulation rebound se discontinue. Pipeline agentes oral, monthly subcut, cagrilintide combos.'
          en: 'Retatrutide LY3437943: triple agonist GLP-1 + GIP + glucagon. Phase 2 NEJM 2023 (Jastreboff et al.) obesity without T2D mean weight loss ~24% at 48 wks (~17% T2D Phase 2). Glucagon component adds energy expenditure beyond GIP+GLP-1. Phase 3 TRIUMPH program 2024-2027. Positioned to surpass tirzepatide. Similar GI side effects. Class-wide concerns: muscle loss with rapid weight loss, sarcopenia, rebound on discontinuation. Pipeline agents oral, monthly subcut, cagrilintide combos.'
        objectives: [Retatrutide]
      - type: choice
        difficulty: 5
        question:
          pt: Oral semaglutide (Rybelsus, Novo Nordisk FDA 2019 T2D) usa technology…
          en: Oral semaglutide (Rybelsus, Novo Nordisk FDA 2019 T2D) uses technology…
        choices:
          - SNAC absorption enhancer co-formulation enables oral peptide absorption stomach; first oral GLP-1 RA approved
          - Extrapolated from a small oral semaglutide pilot study without prespecified primary endpoints or central adjudication of outcomes
          - Substitutes injectable peptides without addressing oral absorption barriers
          - Promoted by a fringe oral semaglutide hypothesis paper that mainstream specialty societies have not endorsed in any guideline
        correctAnswer: SNAC absorption enhancer co-formulation enables oral peptide absorption stomach; first oral GLP-1 RA approved
        rationale:
          pt: 'Rybelsus (oral semaglutide): SNAC (sodium N-(8-[2-hydroxybenzoyl]amino)caprylate) tablet excipient → cria pH microenvironment estômago + transient permeabilization → oral peptide absorption ~1% bioavailability adequate clinical effect. PIONEER trials T2D non-inferior/superior comparators. PIONEER 6 CV safety. Higher dose oral ORAL-1 trial 25/50 mg obesity Phase 3 superior 17% weight loss. Convenience driver — ~30% patients hesitam injection. Outras orais em desenvolvimento (orforglipron Lilly small molecule, danuglipron Pfizer descontinued 2024).'
          en: 'Rybelsus (oral semaglutide): SNAC (sodium N-(8-[2-hydroxybenzoyl]amino)caprylate) tablet excipient → creates gastric pH microenvironment + transient permeabilization → oral peptide absorption ~1% bioavailability adequate for clinical effect. PIONEER trials in T2D non-inferior/superior to comparators. PIONEER 6 CV safety. Higher-dose oral ORAL-1 trial 25/50 mg obesity Phase 3 superior 17% weight loss. Convenience driver — ~30% patients hesitate at injections. Other orals in development (orforglipron Lilly small molecule, danuglipron Pfizer discontinued 2024).'
        objectives: [Oral GLP-1]
      - type: choice
        difficulty: 5
        question:
          pt: Em GLP-1 supply shortages 2022-2024, regulatory response FDA included…
          en: In GLP-1 supply shortages 2022-2024, FDA regulatory response included…
        choices:
          - 503A/503B compounding pathway permitted while drugs on shortage list; ended for tirzepatide oct/2024 and semaglutide feb/2025
          - Permanent prohibition of all 503A and 503B compounding pathways for these agents
          - No regulatory action taken by FDA or international agencies in response to demand
          - Immediate authorization of all generic copies regardless of branded exclusivity
        correctAnswer: 503A/503B compounding pathway permitted while drugs on shortage list; ended for tirzepatide oct/2024 and semaglutide feb/2025
        rationale:
          pt: 'GLP-1 shortages 2022-2024: demand outstripped supply Wegovy/Ozempic/Mounjaro/Zepbound. FDA shortage list permite 503A (patient-specific) e 503B (outsourcing facility) compounded copies. Compounded GLP-1 indústria emergiu — Hims, Ro, Eden, dezenas startups. Concerns: API source (China gray market), purity, dosing errors, FDA warnings. Tirzepatide removido shortage list out/2024 → litigation Outsourcing Facilities Association. Semaglutide shortage resolved fev/2025. Lawsuits ongoing. Compounding ban end of access for many uninsured.'
          en: 'GLP-1 shortages 2022-2024: demand outstripped supply for Wegovy/Ozempic/Mounjaro/Zepbound. FDA shortage list permits 503A (patient-specific) and 503B (outsourcing facility) compounded copies. Compounded GLP-1 industry emerged — Hims, Ro, Eden, dozens of startups. Concerns: API source (China gray market), purity, dosing errors, FDA warnings. Tirzepatide removed from shortage list Oct 2024 → litigation Outsourcing Facilities Association. Semaglutide shortage resolved Feb 2025. Lawsuits ongoing. Compounding ban ends access for many uninsured.'
        objectives: [Compounding]
      - type: choice
        difficulty: 5
        question:
          pt: GLP-1 muscle loss + sarcopenia concern is addressed by…
          en: GLP-1 muscle loss + sarcopenia concern is addressed by…
        choices:
          - Bimagrumab (anti-ActRII), apitegromab (anti-myostatin) Phase 2 trials co-prescribed with GLP-1 to preserve lean mass; resistance training
          - No demonstrated concern muscle in current evidence base or guideline framework
          - Restricted to a 1990s-era glp-1 muscle loss + sarcopenia cohort framework without independent post-2010 replication or guideline endorsement
          - Class-wide GLP-1 withdrawal driven by lean-mass loss and frailty endpoints
        correctAnswer: Bimagrumab (anti-ActRII), apitegromab (anti-myostatin) Phase 2 trials co-prescribed with GLP-1 to preserve lean mass; resistance training
        rationale:
          pt: 'GLP-1 weight loss ~25-40% lean mass loss da total weight reduction (similar bariatric, similar caloric restriction). Sarcopenia preocupação especialmente older adults. Mitigation: resistance training, adequate protein intake (~1.6 g/kg). Pipeline pharmacologic: bimagrumab (Versanis Lilly anti-ActRII receptor) Phase 2 com semaglutide; apitegromab (Scholar Rock anti-myostatin originally SMA — pivot obesity); enobosarm (SARM Veru). Combos preserve muscle while losing fat. Outcomes incertain mortality, falls, fragility — long-term studies needed.'
          en: 'GLP-1 weight loss ~25-40% of total weight reduction is lean mass loss (similar to bariatric, similar to caloric restriction). Sarcopenia concern especially in older adults. Mitigation: resistance training, adequate protein intake (~1.6 g/kg). Pharmacologic pipeline: bimagrumab (Versanis Lilly anti-ActRII receptor) Phase 2 with semaglutide; apitegromab (Scholar Rock anti-myostatin originally for SMA — pivot to obesity); enobosarm (SARM Veru). Combos preserve muscle while losing fat. Long-term mortality, falls, frailty outcomes uncertain — studies needed.'
        objectives: [GLP-1 sarcopenia]
      - type: choice
        difficulty: 5
        question:
          pt: SGLT2 inhibitors (empagliflozin Jardiance, dapagliflozin Farxiga) demonstraram em CVOT trials que…
          en: SGLT2 inhibitors (empagliflozin Jardiance, dapagliflozin Farxiga) demonstrated in CVOT trials that…
        choices:
          - Reduce HF hospitalization + CV death + CKD progression both T2D and non-T2D; recommended T2D, HFrEF, HFpEF, CKD guidelines
          - Glycemic-effect only without measurable cardiovascular outcome benefit
          - Increased heart failure hospitalization signal in active versus comparator arm
          - Type 1 diabetes-only label excluding any T2D or weight-management application
        correctAnswer: Reduce HF hospitalization + CV death + CKD progression both T2D and non-T2D; recommended T2D, HFrEF, HFpEF, CKD guidelines
        rationale:
          pt: 'SGLT2-i: EMPA-REG OUTCOME 2015 empagliflozin → 38% CV death reduction T2D. DAPA-HF (HFrEF non-T2D) 2019, EMPEROR-Reduced. EMPEROR-Preserved (HFpEF) 2021 — primeiro HFpEF positive trial. DAPA-CKD, EMPA-KIDNEY CKD non-DM. Mechanism: natriuresis/diuresis + ketone preference + tubuloglomerular feedback restoration + cardiac metabolism shift. Class effect. Side effects: euglycemic DKA, genital mycotic infections, volume depletion, Fournier gangrene rare. Now 4-pillar HFrEF (RAAS, MRA, ARNI, SGLT2-i). Generic dapagliflozin coming.'
          en: 'SGLT2-i: EMPA-REG OUTCOME 2015 empagliflozin → 38% CV death reduction T2D. DAPA-HF (HFrEF non-T2D) 2019, EMPEROR-Reduced. EMPEROR-Preserved (HFpEF) 2021 — first positive HFpEF trial. DAPA-CKD, EMPA-KIDNEY CKD non-DM. Mechanism: natriuresis/diuresis + ketone preference + tubuloglomerular feedback restoration + cardiac metabolism shift. Class effect. Side effects: euglycemic DKA, genital mycotic infections, volume depletion, rare Fournier gangrene. Now part of 4-pillar HFrEF (RAAS, MRA, ARNI, SGLT2-i). Generic dapagliflozin coming.'
        objectives: [SGLT2-i CVOT]
  - title:
      pt: Página 2 — T1D + Tireoide + Tech
      en: Page 2 — T1D + Thyroid + Tech
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Teplizumab (Tzield, Provention/Sanofi FDA nov/2022) é primeiro disease-modifying T1D drug com indicação para…
          en: Teplizumab (Tzield, Provention/Sanofi FDA Nov 2022) is the first disease-modifying T1D drug indicated for…
        choices:
          - Delaying onset stage 3 T1D in stage 2 (≥2 autoantibodies + dysglycemia, age ≥8); IV 14-day course; ~24-30 mo delay median
          - Curative therapy reversing established type 1 diabetes back to insulin independence
          - Population-wide primary prevention without autoantibody or stage screening
          - Driven by a single underpowered teplizumab observational series lacking confirmatory follow-up across multicenter cohorts
        correctAnswer: Delaying onset stage 3 T1D in stage 2 (≥2 autoantibodies + dysglycemia, age ≥8); IV 14-day course; ~24-30 mo delay median
        rationale:
          pt: 'Teplizumab: anti-CD3 humanized mAb (não-FcR-binding) → modulação T-cell sem cytokine storm. Herold/Skyler/Bluestone TrialNet TN-10 (NEJM 2019) em high-risk relatives stage 2 T1D — delayed median onset stage 3 ~24-30 mo. FDA aprovou nov/2022 ages 8+. IV daily 30-60 min × 14 days. Side effects: lymphopenia transient, rash, headache, EBV reactivation. T1D screening (TrialNet, ASK study, Fr1da Germany, ELSA UK) populacional. Custo $194k/curso. Pipeline: rituximab, abatacept, anti-thymocyte globulin, MMF — variadas evidências.'
          en: 'Teplizumab: anti-CD3 humanized mAb (non-FcR-binding) → T-cell modulation without cytokine storm. Herold/Skyler/Bluestone TrialNet TN-10 (NEJM 2019) in high-risk relatives stage 2 T1D — delayed median onset of stage 3 by ~24-30 mo. FDA approved Nov 2022 ages 8+. IV daily 30-60 min × 14 days. Side effects: transient lymphopenia, rash, headache, EBV reactivation. T1D screening (TrialNet, ASK study, Fr1da Germany, ELSA UK) population-wide. Cost $194k/course. Pipeline: rituximab, abatacept, anti-thymocyte globulin, MMF — varied evidence.'
        objectives: [Teplizumab T1D]
      - type: choice
        difficulty: 5
        question:
          pt: VX-880 (now zimislecel, Vertex) é islet cell therapy T1D que usa…
          en: VX-880 (now zimislecel, Vertex) is an islet cell therapy for T1D that uses…
        choices:
          - Allogeneic stem cell-derived islet cells delivered to hepatic portal vein with chronic immunosuppression; FORWARD trial early data insulin-independence
          - Autologous bone marrow transplant without differentiated islet-cell component
          - Predates the modern vx-880 consensus and was displaced by post-2015 society framework revisions and pivotal RCT readouts
          - Prophylactic vaccine targeting islet autoantigens to prevent T1D onset
        correctAnswer: Allogeneic stem cell-derived islet cells delivered to hepatic portal vein with chronic immunosuppression; FORWARD trial early data insulin-independence
        rationale:
          pt: 'VX-880/zimislecel (Vertex, originalmente Semma Therapeutics tech Doug Melton Harvard 2014): hPSC-derived stem-cell islets (SC-islets) — beta-like + alfa cells funcionais. Infusão portal vein. Chronic immunosuppression standard transplant. FORWARD trial (Phase 1/2): primeiros pacientes insulin-independent at full dose 2023-2024 (Reichman et al. NEJM 2024). Encapsulated version VX-264 evita immunosuppression — Phase 1/2 ongoing. Sema4 Sernova outras programs. Cura potencial T1D — décadas de research culminando. Capacity scaling, immunosuppression burden remain.'
          en: 'VX-880/zimislecel (Vertex, originally Semma Therapeutics tech from Doug Melton Harvard 2014): hPSC-derived stem-cell islets (SC-islets) — functional beta-like + alpha cells. Portal vein infusion. Chronic immunosuppression as standard transplant. FORWARD trial (Phase 1/2): first patients insulin-independent at full dose 2023-2024 (Reichman et al. NEJM 2024). Encapsulated version VX-264 avoids immunosuppression — Phase 1/2 ongoing. Sema4 Sernova other programs. Potential T1D cure — decades of research culminating. Capacity scaling, immunosuppression burden remain.'
        objectives: [VX-880 islets]
      - type: choice
        difficulty: 5
        question:
          pt: AID (automated insulin delivery) closed-loop systems atualmente disponíveis comercialmente incluem…
          en: AID (automated insulin delivery) closed-loop systems currently commercially available include…
        choices:
          - Tandem t:slim X2 Control-IQ, Medtronic 780G, Omnipod 5, iLet (Beta Bionics 2023); CGM-driven hybrid closed loops
          - Standalone insulin pump without continuous glucose monitor algorithmic integration
          - No commercially available closed-loop automated insulin delivery system to date
          - Only DIY OpenAPS/Loop community systems available, with no commercial approval
        correctAnswer: Tandem t:slim X2 Control-IQ, Medtronic 780G, Omnipod 5, iLet (Beta Bionics 2023); CGM-driven hybrid closed loops
        rationale:
          pt: 'AID closed loop: hybrid sistemas com CGM (Dexcom G6/G7, Libre 3, Medtronic Guardian) feedback → pump algorithm modulates basal + auto-corrections. Approved: Tandem Control-IQ 2019, Medtronic 780G 2023, Omnipod 5 2022, iLet bionic pancreas Beta Bionics mai/2023 (sem carb counting). DIY OpenAPS/Loop precedeu commercial. Trials melhoram TIR (time in range) ~70%+, reduzem hypoglycemia. Pediatric expansion ages ≥2 (Omnipod 5). Future: dual-hormone (insulin + glucagon iLet bihormonal Phase 2), inhaled insulin Afrezza adjunct, smart pens.'
          en: 'AID closed loop: hybrid systems with CGM (Dexcom G6/G7, Libre 3, Medtronic Guardian) feedback → pump algorithm modulates basal + auto-corrections. Approved: Tandem Control-IQ 2019, Medtronic 780G 2023, Omnipod 5 2022, iLet bionic pancreas Beta Bionics May 2023 (no carb counting). DIY OpenAPS/Loop preceded commercial. Trials improve TIR (time in range) ~70%+, reduce hypoglycemia. Pediatric expansion ages ≥2 (Omnipod 5). Future: dual-hormone (insulin + glucagon iLet bihormonal Phase 2), inhaled insulin Afrezza adjunct, smart pens.'
        objectives: [AID closed loop]
