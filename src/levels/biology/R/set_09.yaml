title:
  pt: Nutrição Clínica e Saúde Metabólica
  en: Clinical Nutrition and Metabolic Health
level: R
subject: biology
objectives:
  - Compreender macronutrient guidelines
  - Reconhecer GLP-1 era obesity
  - Identificar Mediterranean, DASH diets
  - Avaliar food allergy desensitization
difficulty: 5
authorNotes: |
  Clinical nutrition. Walter Willett "Eat Drink Be Healthy". Mediterranean PREDIMED 2013 NEJM.
  DASH (Appel 1997). EAT-Lancet 2019. Hu Frank Harvard. GLP-1 obesity era. SURMOUNT, STEP. Bariatric
  surgery. NAFLD/MASLD. Food allergy: Palforzia (peanut OIT 2020), Xolair 2024 omalizumab.
example:
  question:
    pt: Em obesity treatment, semaglutide (Wegovy 2.4mg) STEP trials demonstrated…
    en: In obesity treatment, semaglutide (Wegovy 2.4mg) STEP trials demonstrated…
  choices:
    - ~15% mean weight loss, vs ~3% placebo; FDA aprovação 2021 obesity (T2D 2017)
    - Apenas trivial
    - Sem qualquer aprovação
    - Apenas em pediatric
  correctAnswer: ~15% mean weight loss, vs ~3% placebo; FDA aprovação 2021 obesity (T2D 2017)
  rationale:
    pt: 'STEP trials (Wilding NEJM 2021, Davies, Wadden, etc.): semaglutide 2.4mg (Wegovy Novo Nordisk) week SC ~15% weight loss obesity. FDA approval jun/2021. Cost issue ~$1300/month. Tirzepatide (Mounjaro/Zepbound Eli Lilly): ~22.5% (SURMOUNT-1 Jastreboff 2022 NEJM). MASH (Madwit/Loomba), CKD, sleep apnea, MASH expansion. Era pós-bariatric.'
    en: 'STEP trials (Wilding NEJM 2021, Davies, Wadden, etc.): semaglutide 2.4mg (Wegovy Novo Nordisk) weekly SC ~15% weight loss in obesity. FDA approval Jun 2021. Cost issue ~$1300/month. Tirzepatide (Mounjaro/Zepbound Eli Lilly): ~22.5% (SURMOUNT-1 Jastreboff 2022 NEJM). MASH (Madwit/Loomba), CKD, sleep apnea, MASH expansion. Post-bariatric era.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Dieta e metabolic
      en: Page 1 — Diet and metabolic
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: PREDIMED (2013, retracted/updated 2018 NEJM) demonstrated Mediterranean diet…
          en: PREDIMED (2013, retracted/updated 2018 NEJM) demonstrated Mediterranean diet…
        choices:
          - Reduces CV events ~30% vs low-fat diet em high-CV-risk patients (n=7447)
          - Apenas trivial
          - Sem qualquer benefício
          - Apenas em pediatric
        correctAnswer: Reduces CV events ~30% vs low-fat diet em high-CV-risk patients (n=7447)
        rationale:
          pt: 'PREDIMED (Estruch 2013 NEJM, originally; retracted 2018 due randomization issues; reanalyzed): Mediterranean + EVOO or nuts vs low-fat. Composite (MI, stroke, CV death) reduced ~30%. Subsequent NEJM 2018 update largely preserved findings via per-protocol. Estabeleceu Mediterranean evidence-based. EAT-Lancet 2019 planetary health diet aligned.'
          en: 'PREDIMED (Estruch 2013 NEJM, originally; retracted 2018 due to randomization issues; reanalyzed): Mediterranean + EVOO or nuts vs low-fat. Composite (MI, stroke, CV death) reduced ~30%. Subsequent NEJM 2018 update largely preserved findings via per-protocol. Established Mediterranean as evidence-based. EAT-Lancet 2019 planetary health diet aligned.'
        objectives: [PREDIMED]
      - type: choice
        difficulty: 5
        question:
          pt: DASH (Dietary Approaches to Stop Hypertension, Appel 1997 NEJM)…
          en: DASH (Dietary Approaches to Stop Hypertension, Appel 1997 NEJM)…
        choices:
          - High fruit/vegetable/low-fat dairy + low Na reduces SBP ~5-11 mmHg em 2 wks
          - Apenas trivial
          - Sem qualquer impacto
          - Apenas pediatric
        correctAnswer: High fruit/vegetable/low-fat dairy + low Na reduces SBP ~5-11 mmHg em 2 wks
        rationale:
          pt: 'DASH-Sodium (Appel 1997, Sacks 2001 NEJM): combined diet + reduced sodium reduced SBP ~11 mmHg HTN. Comparable BP-lowering medication. Variants: DASH-pcr (Mediterranean variant). PURE 2017 controvertia low salt benefit. AHA/ACC 2017 HTN guidelines integrate dietary sodium <1500-2300 mg + DASH approach + activity.'
          en: 'DASH-Sodium (Appel 1997, Sacks 2001 NEJM): combined diet + reduced sodium reduced SBP ~11 mmHg in HTN. Comparable to BP-lowering medication. Variants: DASH-pcr (Mediterranean variant). PURE 2017 controversially questioned low-salt benefit. AHA/ACC 2017 HTN guidelines integrate dietary sodium <1500-2300 mg + DASH approach + activity.'
        objectives: [DASH]
      - type: choice
        difficulty: 5
        question:
          pt: Em food allergy, peanut OIT (Oral Immunotherapy) Palforzia (Aimmune FDA 2020) is…
          en: In food allergy, peanut OIT (Oral Immunotherapy) Palforzia (Aimmune FDA 2020) is…
        choices:
          - Standardized peanut protein escalating doses; ~80% tolerate ~600mg; daily maintenance lifelong
          - Apenas avoidance
          - Sem qualquer aprovação
          - Apenas em pediatric
        correctAnswer: Standardized peanut protein escalating doses; ~80% tolerate ~600mg; daily maintenance lifelong
        rationale:
          pt: 'Palforzia (Aimmune Therapeutics FDA jan/2020): standardized AR101 peanut protein oral. Up-dosing 24 weeks → maintenance. PALISADE NEJM 2018 ~70% tolerate 600mg challenge vs 4% placebo. Risk: anaphylaxis dosing. Daily maintenance lifelong (vs cure). Xolair (omalizumab) FDA fev/2024 multi-food allergy: 67% tolerate 600mg+ peanut em 16 weeks. Era de food allergy treatment.'
          en: 'Palforzia (Aimmune Therapeutics FDA Jan 2020): standardized AR101 peanut protein oral. 24-week up-dosing → maintenance. PALISADE NEJM 2018 ~70% tolerate 600mg challenge vs 4% placebo. Risk: anaphylaxis with dosing. Lifelong daily maintenance (vs cure). Xolair (omalizumab) FDA Feb 2024 multi-food allergy: 67% tolerate 600mg+ peanut at 16 weeks. Food allergy treatment era.'
        objectives: [Palforzia]
      - type: choice
        difficulty: 5
        question:
          pt: Em peanut allergy prevention, LEAP trial (Du Toit NEJM 2015) demonstrated…
          en: In peanut allergy prevention, LEAP trial (Du Toit NEJM 2015) demonstrated…
        choices:
          - Early peanut introduction (4-11 mo) reduces peanut allergy ~80% vs avoidance
          - Apenas adolescents
          - Sem qualquer benefício
          - Apenas em US
        correctAnswer: Early peanut introduction (4-11 mo) reduces peanut allergy ~80% vs avoidance
        rationale:
          pt: 'LEAP (Learning Early About Peanut Allergy, Lack/Du Toit NEJM 2015): high-risk infants randomized peanut consumption vs avoidance ages 4-11 mo. Allergy 5y: 17% avoidance vs 3% consumption — 80% reduction. NIAID 2017 guideline reversal: early intro recommended. CASCADE other foods (egg, milk, etc.). Reduced food allergy prevalence emerging.'
          en: 'LEAP (Learning Early About Peanut Allergy, Lack/Du Toit NEJM 2015): high-risk infants randomized to peanut consumption vs avoidance at 4-11 mo. 5y allergy: 17% avoidance vs 3% consumption — 80% reduction. NIAID 2017 guideline reversal: early introduction recommended. CASCADE other foods (egg, milk, etc.). Reduced emerging food allergy prevalence.'
        objectives: [LEAP]
      - type: choice
        difficulty: 5
        question:
          pt: Em MASH (Metabolic dysfunction-Associated Steatohepatitis, formerly NASH), Resmetirom (Madrigal 2024) is…
          en: In MASH (Metabolic dysfunction-Associated Steatohepatitis, formerly NASH), Resmetirom (Madrigal 2024) is…
        choices:
          - First MASH approval FDA mar/2024; THR-β agonist liver-selective; MAESTRO-NASH trial
          - Apenas observação
          - Sem qualquer aprovação
          - Apenas pediatric
        correctAnswer: First MASH approval FDA mar/2024; THR-β agonist liver-selective; MAESTRO-NASH trial
        rationale:
          pt: 'Rezdiffra (resmetirom Madrigal Pharma) FDA mar/2024: first approved drug MASH. Selective THR-β agonist (liver). MAESTRO-NASH (Harrison NEJM 2024): MASH resolution + fibrosis improvement. Renamed terminology MASH/MASLD 2023 (Rinella et al.) replacing NASH/NAFLD. Risk fattening obesity epidemic. GLP-1s (Wegovy, Ozempic, Mounjaro) também trial MASH. SLD spectrum.'
          en: 'Rezdiffra (resmetirom Madrigal Pharma) FDA Mar 2024: first approved drug for MASH. Selective THR-β agonist (liver). MAESTRO-NASH (Harrison NEJM 2024): MASH resolution + fibrosis improvement. Renamed MASH/MASLD terminology 2023 (Rinella et al.) replacing NASH/NAFLD. Risk: fattening obesity epidemic. GLP-1s (Wegovy, Ozempic, Mounjaro) also in MASH trials. SLD spectrum.'
        objectives: [Resmetirom MASH]
      - type: choice
        difficulty: 5
        question:
          pt: Em bariatric surgery, RYGB (Roux-en-Y) e sleeve gastrectomy comparable…
          en: In bariatric surgery, RYGB (Roux-en-Y) and sleeve gastrectomy comparable…
        choices:
          - ~25-30% weight loss; SG simpler/faster, RYGB superior T2D remission
          - Apenas RYGB
          - Sem qualquer comparação
          - Apenas pediatric
        correctAnswer: ~25-30% weight loss; SG simpler/faster, RYGB superior T2D remission
        rationale:
          pt: 'Bariatric: ~250k/yr US. RYGB (Roux-en-Y Gastric Bypass): historically gold standard. SG (Sleeve Gastrectomy): now ~70% bariatric procedures (simpler, lower complication). STAMPEDE Schauer trial 2017: T2D remission 5y RYGB ~30% vs SG ~23% vs medical ~3%. SADI-S, BPD-DS more aggressive. GLP-1 era reducing bariatric volume. Adolescent bariatric guidelines AAP 2023.'
          en: 'Bariatric: ~250k/yr US. RYGB (Roux-en-Y Gastric Bypass): historic gold standard. SG (Sleeve Gastrectomy): now ~70% of bariatric procedures (simpler, lower complications). STAMPEDE Schauer 2017 trial: 5y T2D remission RYGB ~30% vs SG ~23% vs medical ~3%. SADI-S, BPD-DS more aggressive. GLP-1 era reducing bariatric volume. AAP 2023 adolescent bariatric guidelines.'
        objectives: [Bariatric]
      - type: choice
        difficulty: 5
        question:
          pt: Em UPF (Ultra-Processed Foods, Monteiro NOVA classification)…
          en: In UPF (Ultra-Processed Foods, Monteiro NOVA classification)…
        choices:
          - 'Group 4: industrial formulations, additives; ~58% US calories; mortality, obesity links'
          - Apenas teórico
          - Sem qualquer impacto
          - Apenas em pediatric
        correctAnswer: 'Group 4: industrial formulations, additives; ~58% US calories; mortality, obesity links'
        rationale:
          pt: 'NOVA (Monteiro São Paulo): 4 groups. UPF (group 4): industrial formulations, multiple additives. ~58% US calories, ~50% UK, ~30% Brasil. Hall NIH 2019: ad libitum UPF diet → +500 kcal/d, weight gain. Epidemiology: mortality, CV, obesity, mental health. Critique: heterogeneous definition, confounders. Brazil dietary guidelines 2014 (first to address UPF) led WHO endorsing.'
          en: 'NOVA (Monteiro São Paulo): 4 groups. UPF (group 4): industrial formulations, multiple additives. ~58% US calories, ~50% UK, ~30% Brazil. Hall NIH 2019: ad libitum UPF diet → +500 kcal/d, weight gain. Epidemiology: mortality, CV, obesity, mental health. Critique: heterogeneous definition, confounders. Brazil 2014 dietary guidelines (first to address UPF) led WHO endorsing.'
        objectives: [UPF NOVA]
      - type: choice
        difficulty: 5
        question:
          pt: Em childhood obesity, AAP 2023 guideline endorsed…
          en: In childhood obesity, AAP 2023 guideline endorsed…
        choices:
          - Pharmacotherapy ≥12 yo (semaglutide, liraglutide); bariatric surgery ≥13 yo severe
          - Apenas lifestyle
          - Sem qualquer recommendation
          - Apenas em US
        correctAnswer: Pharmacotherapy ≥12 yo (semaglutide, liraglutide); bariatric surgery ≥13 yo severe
        rationale:
          pt: 'AAP 2023 Clinical Practice Guideline obesity: paradigma shift. Não watchful waiting. Intensive Health Behavior + Lifestyle Treatment (IHBLT) ≥6 yo. Pharmacotherapy ≥12 yo (semaglutide approved Wegovy). Bariatric surgery ≥13 yo severe (BMI ≥40 or ≥35 + comorbidity). Controversa: stigma vs early treatment. Implementation challenge access em pediátrico.'
          en: 'AAP 2023 Clinical Practice Guideline on obesity: paradigm shift. Not watchful waiting. Intensive Health Behavior + Lifestyle Treatment (IHBLT) ≥6 yo. Pharmacotherapy ≥12 yo (semaglutide Wegovy approved). Bariatric surgery ≥13 yo severe (BMI ≥40 or ≥35 + comorbidity). Controversial: stigma vs early treatment. Pediatric access an implementation challenge.'
        objectives: [AAP obesity]
      - type: choice
        difficulty: 5
        question:
          pt: Em micronutrient deficiency global, "hidden hunger" affects…
          en: In global micronutrient deficiency, "hidden hunger" affects…
        choices:
          - ~2B people (vitamin A, iron, iodine, zinc); biofortification, fortification, supplementation
          - Apenas teórica
          - Sem qualquer issue
          - Apenas pediatric
        correctAnswer: ~2B people (vitamin A, iron, iodine, zinc); biofortification, fortification, supplementation
        rationale:
          pt: 'Hidden hunger: micronutrient deficiencies despite caloric sufficiency. ~2B global. Vitamin A: ~250k childhood deaths/yr blindness (WHO). Iron deficiency anemia ~25% globally. Iodine: ~30% inadequate intake (Iodized salt strategy). Zinc: ~17% global. Folate fortification (US 1998): 35% NTD reduction. Biofortification (HarvestPlus). VA supplementation programs.'
          en: 'Hidden hunger: micronutrient deficiencies despite caloric sufficiency. ~2B globally. Vitamin A: ~250k childhood deaths/yr blindness (WHO). Iron deficiency anemia ~25% globally. Iodine: ~30% inadequate intake (Iodized salt strategy). Zinc: ~17% global. US folate fortification (1998): 35% NTD reduction. Biofortification (HarvestPlus). VA supplementation programs.'
        objectives: [Hidden hunger]
      - type: choice
        difficulty: 5
        question:
          pt: Em vitamin D, evidence for supplementation effects…
          en: In vitamin D, evidence for supplementation effects…
        choices:
          - Bone health robust; CV/cancer/mortality VITAL trial 2018 mostly negative
          - Sempre eficaz
          - Sem qualquer benefício
          - Apenas em pediatric
        correctAnswer: Bone health robust; CV/cancer/mortality VITAL trial 2018 mostly negative
        rationale:
          pt: 'VITAL trial (Manson NEJM 2018) ~26k participants vitamin D 2000 IU + ω-3 vs placebo: no reduction primary CV/cancer outcomes 5-y followup. Supplement era cooled. Replicated em UK D-Health, FinD trial. Bone fracture protection moderate (specifically deficiency, elderly). USPSTF 2021 not recommend universal screening. Endocrine society retroceu. ~25 ng/mL adequate goal.'
          en: 'VITAL trial (Manson NEJM 2018) ~26k participants vitamin D 2000 IU + ω-3 vs placebo: no reduction in primary CV/cancer outcomes at 5-y follow-up. Supplement era cooled. Replicated in UK D-Health, FinD trial. Moderate bone fracture protection (specifically in deficiency, elderly). USPSTF 2021 doesn''t recommend universal screening. Endocrine society stepped back. ~25 ng/mL adequate goal.'
        objectives: [Vitamin D]
  - title:
      pt: Página 2 — Aplicações
      en: Page 2 — Applications
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Personalized nutrition (Segal/Elinav 2015 Cell)…
          en: Personalized nutrition (Segal/Elinav 2015 Cell)…
        choices:
          - PPGR (Postprandial Glucose Response) varies inter-individually based on microbiome + clinical
          - Apenas trivial
          - Sem qualquer base
          - Apenas em pediatric
        correctAnswer: PPGR (Postprandial Glucose Response) varies inter-individually based on microbiome + clinical
        rationale:
          pt: 'Eran Segal/Eran Elinav (Weizmann) 2015 Cell PNP: 800+ subjects same meal → varied PPGR. Algorithm predicts based on 137 features (microbiome, clinical). Personalized recommendations beat generic. Spinout DayTwo (commercial). Limitations: small effect size individual, generalizability. CGM-based personalization expanding (Levels Health, Nutrisense).'
          en: 'Eran Segal/Eran Elinav (Weizmann) 2015 Cell PNP: 800+ subjects, same meal → varied PPGR. Algorithm predicts based on 137 features (microbiome, clinical). Personalized recommendations beat generic. DayTwo spinout (commercial). Limitations: small individual effect size, generalizability. CGM-based personalization expanding (Levels Health, Nutrisense).'
        objectives: [Personalized nutrition]
      - type: choice
        difficulty: 5
        question:
          pt: Em obesity microbiome, Akkermansia + Bacteroidetes/Firmicutes ratio…
          en: In obesity microbiome, Akkermansia + Bacteroidetes/Firmicutes ratio…
        choices:
          - Initial association (Ley 2006) overstated; microbiome obesity link complex, individual
          - Sempre clear
          - Sem qualquer relação
          - Apenas em pediatric
        correctAnswer: Initial association (Ley 2006) overstated; microbiome obesity link complex, individual
        rationale:
          pt: 'Ley 2006 PNAS: obese mice altered F:B ratio. Translation humanos: contested (Walters meta-analysis 2014). Akkermansia muciniphila: inversely correlated obesity (Cani Belgium pasteurized supplementation Phase 2). FMT obesity trials limited results. More recent: complex microbial functions (SCFAs, BAs) > taxonomic ratios. Pendulum Glucose Control commercial.'
          en: 'Ley 2006 PNAS: obese mice altered F:B ratio. Translation to humans: contested (Walters 2014 meta-analysis). Akkermansia muciniphila: inversely correlated with obesity (Cani Belgium pasteurized supplementation Phase 2). FMT obesity trials with limited results. More recent: complex microbial functions (SCFAs, BAs) > taxonomic ratios. Pendulum Glucose Control commercial.'
        objectives: [Microbiome obesity]
      - type: choice
        difficulty: 5
        question:
          pt: Em "Blue Zones" longevity (Buettner), common dietary feature…
          en: In "Blue Zones" longevity (Buettner), common dietary feature…
        choices:
          - Predominantly plant-based (~95% plant), modest portions, social eating, no overeating
          - Apenas carne vermelha
          - Sem qualquer pattern
          - Apenas em US
        correctAnswer: Predominantly plant-based (~95% plant), modest portions, social eating, no overeating
        rationale:
          pt: 'Buettner Blue Zones (Sardinia, Okinawa, Nicoya CR, Ikaria GR, Loma Linda): common dietary patterns. Plant-based predominantly (~95%). Beans daily (lentils, chickpeas, black beans). Hara hachi bu (Okinawa: 80% full). Wine moderate (most). Anti-Ozempic critique 2024 Newman demographic challenge. Adventists Loma Linda strongest evidence (vegetarian + lifestyle).'
          en: 'Buettner Blue Zones (Sardinia, Okinawa, Nicoya CR, Ikaria GR, Loma Linda): common dietary patterns. Predominantly plant-based (~95%). Daily beans (lentils, chickpeas, black beans). Hara hachi bu (Okinawa: 80% full). Moderate wine (most). Anti-Ozempic critique 2024 Newman demographic challenge. Adventists Loma Linda strongest evidence (vegetarian + lifestyle).'
        objectives: [Blue Zones diet]
      - type: choice
        difficulty: 5
        question:
          pt: Em low-carb/keto, evidence for T2D management…
          en: In low-carb/keto, evidence for T2D management…
        choices:
          - VLCD (Virta 2018 type 2 diabetes reversal); CR mimics. Long-term sustainability questioned
          - Sempre prejudicial
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: VLCD (Virta 2018 type 2 diabetes reversal); CR mimics. Long-term sustainability questioned
        rationale:
          pt: 'Virta Health (low-carb dietary intervention, Phinney/Volek): 2-year data: ~60% T2D remission off insulin. Newcastle Taylor (very-low calorie liquid diets DiRECT): similar. Mechanism: hepatic insulin resistance reversal. Limit: long-term adherence. EAT-Lancet, AHA caution saturated fat. Ketogenic specific epilepsy peds. Carb-restricted varied (Atkins, Mediterranean modified).'
          en: 'Virta Health (low-carb dietary intervention, Phinney/Volek): 2-year data: ~60% T2D remission off insulin. Newcastle Taylor (very-low calorie liquid diets DiRECT): similar. Mechanism: hepatic insulin resistance reversal. Limit: long-term adherence. EAT-Lancet, AHA caution saturated fat. Pediatric ketogenic specific to epilepsy. Carb-restricted varied (Atkins, modified Mediterranean).'
        objectives: [Low-carb T2D]
      - type: choice
        difficulty: 5
        question:
          pt: Em time-restricted feeding (TRF, intermittent fasting), evidence quality…
          en: In time-restricted feeding (TRF, intermittent fasting), evidence quality…
        choices:
          - Mixed; equivalence vs caloric restriction (Liu NEJM 2022); circadian rhythm benefits
          - Sempre superior
          - Sem qualquer benefício
          - Apenas em pediatric
        correctAnswer: Mixed; equivalence vs caloric restriction (Liu NEJM 2022); circadian rhythm benefits
        rationale:
          pt: 'TRF (8h eating window typical): popular. Liu 2022 NEJM: TRF + CR vs CR alone — não superior weight loss. Panda lab (Salk): mouse TRF circadian benefits. Human metabolic, sleep, BP modest improvements. Sustainability potentially higher. Patterson (Yale) TRF studies. Mais rigorous trials needed. ADF (Alternate Day Fasting), 5:2 variants.'
          en: 'TRF (typical 8h eating window): popular. Liu 2022 NEJM: TRF + CR vs CR alone — not superior in weight loss. Panda lab (Salk): mouse TRF circadian benefits. Human metabolic, sleep, BP modest improvements. Potentially higher sustainability. Patterson (Yale) TRF studies. More rigorous trials needed. ADF (Alternate Day Fasting), 5:2 variants.'
        objectives: [TRF]
      - type: choice
        difficulty: 5
        question:
          pt: Em allergic asthma, dupilumab (Dupixent Sanofi/Regeneron) é…
          en: In allergic asthma, dupilumab (Dupixent Sanofi/Regeneron) is…
        choices:
          - Anti-IL-4Rα blocking IL-4/IL-13 type 2 inflammation; eczema, asthma, EoE, COPD 2024
          - Apenas anti-IgE
          - Sem qualquer aprovação
          - Apenas em pediatric
        correctAnswer: Anti-IL-4Rα blocking IL-4/IL-13 type 2 inflammation; eczema, asthma, EoE, COPD 2024
        rationale:
          pt: 'Dupilumab (Dupixent): anti-IL-4Rα blocks IL-4 + IL-13. FDA: atopic dermatitis 2017, asthma 2018, CRSwNP 2019, EoE 2022, prurigo nodularis 2022, COPD with type 2 (~30%) sep/2024. Q2 weeks SC. Game-changer T2 inflammation diseases. Peso ~$40k/yr. Regeneron/Sanofi joint. Other biologics: anti-IgE (omalizumab Xolair), anti-IL-5 (mepolizumab, benralizumab), anti-TSLP (tezepelumab Tezspire).'
          en: 'Dupilumab (Dupixent): anti-IL-4Rα blocks IL-4 + IL-13. FDA: atopic dermatitis 2017, asthma 2018, CRSwNP 2019, EoE 2022, prurigo nodularis 2022, COPD with type 2 (~30%) Sep 2024. Q2 weeks SC. Game-changer in T2 inflammation diseases. ~$40k/yr. Regeneron/Sanofi joint. Other biologics: anti-IgE (omalizumab Xolair), anti-IL-5 (mepolizumab, benralizumab), anti-TSLP (tezepelumab Tezspire).'
        objectives: [Dupilumab]
      - type: choice
        difficulty: 5
        question:
          pt: Em pediatric obesity GLP-1, Wegovy (semaglutide) FDA dec/2022 approved…
          en: In pediatric obesity GLP-1, Wegovy (semaglutide) FDA Dec 2022 approved…
        choices:
          - 12-17 yo + obesity (≥30 BMI percentile-corrected); STEP TEENS NEJM 2022 ~16% loss
          - Apenas adult
          - Sem qualquer aprovação
          - Apenas em UK
        correctAnswer: 12-17 yo + obesity (≥30 BMI percentile-corrected); STEP TEENS NEJM 2022 ~16% loss
        rationale:
          pt: 'STEP TEENS (Kelly NEJM 2022): N=201 12-17 yo obesity. Semaglutide 2.4mg vs placebo + lifestyle: ~16% mean weight loss vs ~1% placebo. FDA dec/2022 expanded Wegovy ≥12 yo. AAP 2023 endorsed. Tirzepatide also pediatric trials. Concerns: long-term cardiovascular, body image, cessation outcomes (rebound). Equity access issue.'
          en: 'STEP TEENS (Kelly NEJM 2022): N=201 12-17 yo with obesity. Semaglutide 2.4mg vs placebo + lifestyle: ~16% mean weight loss vs ~1% placebo. FDA Dec 2022 expanded Wegovy to ≥12 yo. AAP 2023 endorsed. Tirzepatide also in pediatric trials. Concerns: long-term cardiovascular, body image, cessation outcomes (rebound). Equity access issue.'
        objectives: [Pediatric GLP-1]
      - type: choice
        difficulty: 5
        question:
          pt: Em hospital nutrition, refeeding syndrome…
          en: In hospital nutrition, refeeding syndrome…
        choices:
          - Hypophosphatemia + electrolyte shifts em malnourished post-feeding; cardiac arrest, encephalopathy
          - Apenas trivial
          - Sem qualquer concern
          - Apenas em pediatric
        correctAnswer: Hypophosphatemia + electrolyte shifts em malnourished post-feeding; cardiac arrest, encephalopathy
        rationale:
          pt: 'Refeeding syndrome: starvation → catabolic, glycogen depleted. Refeeding (caloric) → insulin → cellular K, Mg, PO4 uptake → severe hypophosphatemia (<1.0 mg/dL), hypokalemia, hypomagnesemia. Thiamine deficiency Wernicke. Cardiac arrhythmias, respiratory failure, seizures. Risk: severe malnutrition, alcoholism, eating disorders, prolonged NPO. Slow refeeding 5-15 kcal/kg/d, electrolyte replacement, thiamine.'
          en: 'Refeeding syndrome: starvation → catabolic, glycogen depleted. Refeeding (caloric) → insulin → cellular K, Mg, PO4 uptake → severe hypophosphatemia (<1.0 mg/dL), hypokalemia, hypomagnesemia. Thiamine deficiency → Wernicke. Cardiac arrhythmias, respiratory failure, seizures. Risk: severe malnutrition, alcoholism, eating disorders, prolonged NPO. Slow refeeding 5-15 kcal/kg/d, electrolyte replacement, thiamine.'
        objectives: [Refeeding]
      - type: choice
        difficulty: 5
        question:
          pt: Em parenteral nutrition (PN), home TPN long-term complications…
          en: In parenteral nutrition (PN), long-term home TPN complications…
        choices:
          - Catheter sepsis, IFALD (intestinal failure-associated liver disease), bone disease, deficiency
          - Apenas trivial
          - Sem qualquer issue
          - Apenas pediatric
        correctAnswer: Catheter sepsis, IFALD (intestinal failure-associated liver disease), bone disease, deficiency
        rationale:
          pt: 'Long-term TPN (home parenteral nutrition for short bowel, intestinal failure): central line infections major. IFALD (intestinal failure-associated liver disease) — historically cirrhosis. Omegaven (fish oil intralipid SMOFlipid) revolutionized — reduces IFALD. Metabolic bone disease, micronutrient deficiencies (carnitine, choline). Teduglutide (Gattex) GLP-2 analog reduces TPN dependence ~25-50%.'
          en: 'Long-term TPN (home parenteral nutrition for short bowel, intestinal failure): central line infections major. IFALD (intestinal failure-associated liver disease) — historically cirrhosis. Omegaven (fish oil intralipid SMOFlipid) revolutionized — reduces IFALD. Metabolic bone disease, micronutrient deficiencies (carnitine, choline). Teduglutide (Gattex) GLP-2 analog reduces TPN dependence ~25-50%.'
        objectives: [TPN complications]
      - type: choice
        difficulty: 5
        question:
          pt: Future nutrition trends include…
          en: Future nutrition trends include…
        choices:
          - GLP-1s mainstream, personalized nutrition CGM, food-as-medicine prescription, food allergy biologics
          - Apenas trivial
          - Sem qualquer evolução
          - Apenas em US
        correctAnswer: GLP-1s mainstream, personalized nutrition CGM, food-as-medicine prescription, food allergy biologics
