        rationale:
          pt: 'Cultivated meat (animal cells em bioreactor): UPSIDE Foods + GOOD Meat (Eat Just) FDA "no questions" 2023, USDA approved 2023. Limited restaurant launches San Francisco, Washington DC. Florida, Alabama BANs 2024. EU still pending. Israel approved Aleph 2024. Cost still ~$50-100/lb production. Scale-up enormous challenge. Beyond Meat plant-based alternative struggling commercialmente.'
          en: 'Cultivated meat (animal cells in bioreactor): UPSIDE Foods + GOOD Meat (Eat Just) FDA "no questions" 2023, USDA approved 2023. Limited restaurant launches San Francisco, Washington DC. Florida, Alabama BANs 2024. EU still pending. Israel approved Aleph 2024. Production cost still ~$50-100/lb. Enormous scale-up challenge. Beyond Meat plant-based alternative commercially struggling.'
        objectives: [Cultivated meat]
