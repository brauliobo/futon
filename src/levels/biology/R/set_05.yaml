          pt: 'IPCC 2022 AR6: yield reductions 1°C warming (currently 1.1°C). Wheat, maize, rice major. Tropics: -10 a -25%. CGIAR research: drought-resistant varieties (CIMMYT Mexico maize, IRRI Philippines rice, ICARDA wheat). C4 rice IRRI. Crop switching (sorghum, millet drought-resilient). Adaptation finance gap. Food insecurity 735M (2023) up from 588M (2019).'
