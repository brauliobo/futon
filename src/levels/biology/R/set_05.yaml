          pt: 'Target Malaria (Imperial College, partners Burkina Faso, Mali, Uganda, Gana, Bates 2019): primeira liberação África de mosquito GE. ~6400 sterile males. Não drive (gradual approach). Bana village. Stepping stone para gene drive A. gambiae anti-malaria (dsx target). Community engagement essencial. Local regulators (Agence Nationale Biosécurité). Scientific paper Beaghton/Burt et al.'
          en: 'Target Malaria (Imperial College, partners Burkina Faso, Mali, Uganda, Ghana, Bates 2019): first release of GE mosquito in Africa. ~6400 sterile males. Not drive (gradual approach). Bana village. Stepping stone for A. gambiae anti-malaria gene drive (dsx target). Essential community engagement. Local regulators (Agence Nationale Biosécurité). Scientific paper Beaghton/Burt et al.'
