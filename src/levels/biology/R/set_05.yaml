        difficulty: 5
        question:
          pt: 'GMO food labeling US: 2022 USDA mandatory disclosure of "bioengineered" foods…'
          en: 'GMO food labeling US: 2022 USDA mandatory "bioengineered" food disclosure…'
        choices:
          - Effective jan/2022, "bioengineered" symbol or QR code; CRISPR-edited largely exempt
          - Purely voluntary registry without enforced participation or oversight
          - Operates outside any specific regulatory framework or oversight body
          - NICE-only authorization without parallel FDA or EMA submissions
        correctAnswer: Effective jan/2022, "bioengineered" symbol or QR code; CRISPR-edited largely exempt
        rationale:
          pt: 'NBFDS (National Bioengineered Food Disclosure Standard) effective jan/2022: "bioengineered" disclosure required. List bioengineered foods (alfalfa, apple, canola, corn, cotton, papaya, pineapple, potato, salmon, soybean, squash, sugarbeet). Refined ingredients (oils, sugar) exempt. CRISPR-edited if no foreign DNA exempt. Critique: "bioengineered" terminology + QR codes hard for consumers. EU mandatory clearer.'
          en: 'NBFDS (National Bioengineered Food Disclosure Standard) effective Jan 2022: "bioengineered" disclosure required. List of bioengineered foods (alfalfa, apple, canola, corn, cotton, papaya, pineapple, potato, salmon, soybean, squash, sugarbeet). Refined ingredients (oils, sugar) exempt. CRISPR-edited if no foreign DNA exempt. Critique: "bioengineered" terminology + QR codes hard for consumers. EU mandatory clearer.'
        objectives: [Labeling]
      - type: choice
        difficulty: 5
        question:
          pt: Em insect-resistance management, refuge strategy…
          en: In insect-resistance management, refuge strategy…
        choices:
          - Plant non-Bt buffer (~5-20%) → susceptible insects mate with resistant, dilute resistance alleles
          - Limited to Bt without broader clinical applicability or alternative pathways
          - No recognized therapeutic strategy beyond symptom management
          - Legacy paradigm long abandoned after randomized trials demonstrated harm or futility
        correctAnswer: Plant non-Bt buffer (~5-20%) → susceptible insects mate with resistant, dilute resistance alleles
        rationale:
          pt: 'Refuge strategy required EPA: ~20% non-Bt corn (5% if pyramid). Allows susceptible adults to breed com rare resistant survivors → keep resistance recessive. Compliance varies. Pyramid traits (multi-Cry stacks) reduce resistance evolution. Bt resistance documented (corn rootworm Iowa, fall armyworm Brazil). Continued evolutionary arms race.'
          en: 'Refuge strategy required by EPA: ~20% non-Bt corn (5% if pyramid). Allows susceptible adults to breed with rare resistant survivors → keep resistance recessive. Compliance varies. Pyramid traits (multi-Cry stacks) reduce resistance evolution. Bt resistance documented (corn rootworm Iowa, fall armyworm Brazil). Continued evolutionary arms race.'
        objectives: [Refuge]
