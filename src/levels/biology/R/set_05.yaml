          pt: 'Acceligen (Recombinetics) PRLR-SLICK cattle: CRISPR knockin slick-coat allele (PRLR) → short hair, heat-tolerance tropics. FDA mar/2022 low-risk determination — primeira CRISPR food animal under enforcement discretion (não aprovação NADA formal). Welfare benefit + climate adaptation tropical cattle. Contrast AquAdvantage salmon NADA approval 2015 (~20 yrs review). Path mais rápido CRISPR vs transgenic. Outras programs: dehorned cattle (Recombinetics 2016 — questionada antibiotic resistance gene), PRRSV-resistant pigs (Genus/PIC 2024 FDA approval CD163 KO).'
          en: 'Acceligen (Recombinetics) PRLR-SLICK cattle: CRISPR knockin of slick-coat allele (PRLR) → short hair, heat-tolerance in tropics. FDA Mar 2022 low-risk determination — first CRISPR food animal under enforcement discretion (not formal NADA approval). Welfare benefit + climate adaptation for tropical cattle. Contrast AquAdvantage salmon NADA approval 2015 (~20-yr review). Faster path for CRISPR vs transgenic. Other programs: dehorned cattle (Recombinetics 2016 — questioned for antibiotic resistance gene), PRRSV-resistant pigs (Genus/PIC 2024 FDA approval CD163 KO).'
