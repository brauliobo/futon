title:
  pt: Biotecnologia Agrícola e Segurança Alimentar
  en: Agricultural Biotechnology and Food Security
level: R
subject: biology
objectives:
  - Compreender GE crops, CRISPR plants
  - Reconhecer Golden Rice, vitamin-fortified
  - Identificar gene drives mosquito
  - Avaliar climate-resilient breeding
difficulty: 5
authorNotes: |
  Ag biotech. Bt corn 1996. Roundup Ready soybean. Golden Rice 2000 Potrykus β-carotene → 2021
  Philippines approval. CRISPR plants: Yinong Yang waxy corn 2016. Calyxt high-oleic soybean
  2019 (defunct). USDA "regulation" 2020 (deregulated CRISPR if no foreign DNA). Inari, Pairwise.
  C4 rice IRRI. Lab-grown meat. Vertical farming.
example:
  question:
    pt: Bt corn (1996) primeiro GE crop comercial usa…
    en: Bt corn (1996) first commercial GE crop uses…
  choices:
    - Bacillus thuringiensis Cry toxin gene → in-plant insecticide para corn borer
    - Limited to pesticida tradicional without broader clinical applicability or alternative pathways
    - No demonstrated modificação in current evidence base or guideline framework
    - Approved exclusively in the United Kingdom under MHRA without other regulatory pathways
  correctAnswer: Bacillus thuringiensis Cry toxin gene → in-plant insecticide para corn borer
  rationale:
    pt: 'Bt corn (Monsanto YieldGard 1996): Cry1Ab gene from Bacillus thuringiensis → corn produces insecticidal toxin specifically targeting Lepidoptera (corn borer larvae). Cattle/humans no Cry receptors. Reduced pesticide spraying ~80%. Currently ~80% US corn Bt + glyphosate-resistant. Insect resistance emerging (resistance management refuges).'
    en: 'Bt corn (Monsanto YieldGard 1996): Cry1Ab gene from Bacillus thuringiensis → corn produces insecticidal toxin specifically targeting Lepidoptera (corn borer larvae). Cattle/humans lack Cry receptors. Reduced pesticide spraying ~80%. Currently ~80% US corn is Bt + glyphosate-resistant. Insect resistance emerging (resistance management refuges).'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — GE crops
      en: Page 1 — GE crops
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Golden Rice (Potrykus/Beyer 2000) tem β-carotene engineered para…
          en: Golden Rice (Potrykus/Beyer 2000) has engineered β-carotene to…
        choices:
          - Reduzir vitamin A deficiency em LMIC; Filipinas approved 2021 first commercial cultivation
          - Strictly theoretical observation that has never been validated in randomized human trials
          - Investigational only, with no current FDA, EMA or international regulatory approval
          - Of historical interest only, replaced decades ago by evidence-based standards of care
        correctAnswer: Reduzir vitamin A deficiency em LMIC; Filipinas approved 2021 first commercial cultivation
        rationale:
          pt: 'Ingo Potrykus/Peter Beyer 2000 Science: psy + crtI genes em rice endosperm → β-carotene yellow color. ~250M children VA deficient globally. Decade legal/political. Philippines DA-BPI 2021 approved cultivation; small acreage 2024+. Bangladesh approved 2024. Anti-GMO opposition (Greenpeace) controvertida. Public good non-profit license.'
          en: 'Ingo Potrykus/Peter Beyer 2000 Science: psy + crtI genes in rice endosperm → β-carotene yellow color. ~250M children VA-deficient globally. Decade of legal/political battles. Philippines DA-BPI 2021 approved cultivation; small acreage 2024+. Bangladesh approved 2024. Anti-GMO opposition (Greenpeace) controversial. Public-good non-profit license.'
        objectives: [Golden Rice]
      - type: choice
        difficulty: 5
        question:
          pt: Em CRISPR plants, USDA APHIS 2020 SECURE rule…
          en: In CRISPR plants, USDA APHIS 2020 SECURE rule…
        choices:
          - Deregulated genome editing if no foreign DNA introduced (analogous mutations possible)
          - Sempre regulated
          - No meaningful practice change recommended after the trial readouts
          - Approved exclusively in the United States with no EMA or international pathway
        correctAnswer: Deregulated genome editing if no foreign DNA introduced (analogous mutations possible)
        rationale:
          pt: 'USDA APHIS SECURE rule 2020: CRISPR-edited plants with no transgene exempt from regulation if mutation could occur naturally or via traditional breeding. Aceleratou commercial CRISPR ag development. Calyxt soybean (high-oleic 2019), Pairwise mustard greens (2023, first CRISPR food consumer). EU more restrictive (court ruling 2018 GMO rules apply); proposal 2023 reform.'
          en: 'USDA APHIS SECURE rule 2020: CRISPR-edited plants with no transgene exempt from regulation if mutation could occur naturally or via traditional breeding. Accelerated commercial CRISPR ag development. Calyxt soybean (high-oleic 2019), Pairwise mustard greens (2023, first consumer CRISPR food). EU more restrictive (2018 court ruling: GMO rules apply); 2023 reform proposal.'
        objectives: [USDA SECURE]
      - type: choice
        difficulty: 5
        question:
          pt: AquAdvantage salmon (2020 first GE animal for food) é…
          en: AquAdvantage salmon (2020 first GE animal for food) is…
        choices:
          - Atlantic salmon com GH gene from Chinook + ocean pout promoter; grows 2x faster
          - Legacy paradigm long abandoned after randomized trials demonstrated harm or futility
          - Pre-clinical compound that has not yet entered first-in-human trials
          - NICE-only authorization without parallel FDA or EMA submissions
        correctAnswer: Atlantic salmon com GH gene from Chinook + ocean pout promoter; grows 2x faster
        rationale:
          pt: 'AquaBounty AquAdvantage salmon: Atlantic with Chinook GH cDNA + antifreeze ocean pout promoter — continuous GH expression. FDA approved 2015; sale Canada 2017, US 2020. Land-based RAS (Recirculating Aquaculture Systems) only — biocontainment. ~10M lbs/yr capacity Indiana facility. Slow consumer adoption, anti-GMO labeling debates. Reduces pressure wild salmon.'
          en: 'AquaBounty AquAdvantage salmon: Atlantic with Chinook GH cDNA + antifreeze ocean pout promoter — continuous GH expression. FDA approved 2015; sale Canada 2017, US 2020. Land-based RAS (Recirculating Aquaculture Systems) only — biocontainment. ~10M lbs/yr capacity Indiana facility. Slow consumer adoption, anti-GMO labeling debates. Reduces wild salmon pressure.'
        objectives: [AquAdvantage]
      - type: choice
        difficulty: 5
        question:
          pt: Em climate-resilient crops, drought-tolerant DroughtGard maize (Monsanto 2012)…
          en: In climate-resilient crops, drought-tolerant DroughtGard maize (Monsanto 2012)…
        choices:
          - cspB gene Bacillus subtilis maintaining yield em moderate drought; sub-Saharan Africa rollout
          - Hypothesis-only proposal lacking any preclinical efficacy data to date
          - Withdrawn from development after pivotal trial efficacy or safety failure
          - Limited US-only indication with no current submission to other regulatory agencies
        correctAnswer: cspB gene Bacillus subtilis maintaining yield em moderate drought; sub-Saharan Africa rollout
        rationale:
          pt: 'DroughtGard (Monsanto 2012): cspB cold shock protein from Bacillus, RNA chaperone improves stress response. WEMA (Water Efficient Maize for Africa) project: BBSRC + Gates Foundation + Monsanto royalty-free for sub-Saharan Africa. Modest yield improvement (~5-15% drought). C4 rice IRRI long-term goal. CRISPR climate-resilient pipeline expanding.'
          en: 'DroughtGard (Monsanto 2012): cspB cold shock protein from Bacillus, RNA chaperone improves stress response. WEMA (Water Efficient Maize for Africa) project: BBSRC + Gates Foundation + Monsanto royalty-free for sub-Saharan Africa. Modest yield improvement (~5-15% drought). C4 rice IRRI long-term goal. CRISPR climate-resilient pipeline expanding.'
        objectives: [DroughtGard]
      - type: choice
        difficulty: 5
        question:
          pt: Cisgenic vs transgenic distinction…
          en: Cisgenic vs transgenic distinction…
        choices:
          - 'Cisgenic: gene from same species (e.g. apple scab resistance from wild apple); transgenic: foreign species'
          - Idênticos
          - No meaningful difference detected between strategies on the primary composite endpoint
          - Limited to UK NHS deployment without international rollout
        correctAnswer: 'Cisgenic: gene from same species (e.g. apple scab resistance from wild apple); transgenic: foreign species'
        rationale:
          pt: 'Cisgenesis: introducing gene from sexually compatible relatives. Apple scab Vf gene from Malus floribunda. Potato late blight Rpi from wild relatives (Wageningen). Concept: equivalent to traditional breeding except direct molecular insertion. EU more lenient cisgenic talvez. CRISPR base/prime editing further blurs lines.'
          en: 'Cisgenesis: introducing gene from sexually compatible relatives. Apple scab Vf gene from Malus floribunda. Potato late blight Rpi from wild relatives (Wageningen). Concept: equivalent to traditional breeding except direct molecular insertion. EU possibly more lenient on cisgenic. CRISPR base/prime editing further blurs lines.'
        objectives: [Cisgenic]
      - type: choice
        difficulty: 5
        question:
          pt: Em livestock, hornless dairy cattle (Recombinetics) and Sterile Mosquitoes (Oxitec OX5034)…
          en: In livestock, hornless dairy cattle (Recombinetics) and Sterile Mosquitoes (Oxitec OX5034)…
        choices:
          - 'Animal welfare/disease control: TALEN cattle, RIDL mosquitoes (~10M Florida release 2021)'
          - No demonstrated clinical application in current evidence-based guidelines
          - Mechanistic conjecture supported only by isolated case reports without controlled study
          - Indication limited to pediatric stroke populations under specialty supervision
        correctAnswer: 'Animal welfare/disease control: TALEN cattle, RIDL mosquitoes (~10M Florida release 2021)'
        rationale:
          pt: 'Recombinetics hornless cattle 2014: TALEN edit POLLED gene. Off-target plasmid integration discovered 2019 — set back. Oxitec OX5034 self-limiting Aedes aegypti (tTAV female-lethal): Florida Keys 2021 ~10M release approved EPA. Brazil years prior. Reduces dengue/Zika transmission. RIDL (Release Insects with Dominant Lethality) tech.'
          en: 'Recombinetics hornless cattle 2014: TALEN edit POLLED gene. Off-target plasmid integration discovered 2019 — setback. Oxitec OX5034 self-limiting Aedes aegypti (tTAV female-lethal): Florida Keys 2021 ~10M release approved EPA. Brazil years prior. Reduces dengue/Zika transmission. RIDL (Release Insects with Dominant Lethality) tech.'
        objectives: [Livestock GE]
      - type: choice
        difficulty: 5
        question:
          pt: Em vertical farming, AeroFarms (NJ), Plenty (CA) — challenges include…
          en: In vertical farming, AeroFarms (NJ), Plenty (CA) — challenges include…
        choices:
          - Energy costs unsustainable; many bankruptcies (AeroFarms ch11 2023, Bowery 2024)
          - Sempre lucrativo
          - Considered free of safety or efficacy concerns based on long-term registry data
          - Approved exclusively in the United States with no EMA or international pathway
        correctAnswer: Energy costs unsustainable; many bankruptcies (AeroFarms ch11 2023, Bowery 2024)
        rationale:
          pt: 'Vertical farming hype 2010s ~$10B+ raised. Promise: local production, water-efficient, year-round. Reality: LED lighting ~80% costs, energy-intensive, narrow crop range (leafy greens, herbs only economical), high labor. Bankruptcies: Bowery, AeroFarms, AppHarvest, Fifth Season. Plenty pivoted strawberries premium. Tech vs energy-economics challenge unresolved.'
          en: 'Vertical farming 2010s hype ~$10B+ raised. Promise: local production, water-efficient, year-round. Reality: LED lighting ~80% costs, energy-intensive, narrow crop range (only leafy greens, herbs economical), high labor. Bankruptcies: Bowery, AeroFarms, AppHarvest, Fifth Season. Plenty pivoted to premium strawberries. Tech vs energy-economics challenge unresolved.'
        objectives: [Vertical farming]
      - type: choice
        difficulty: 5
        question:
