title:
  pt: Restauração Sensorial — Visão e Audição
  en: Sensory Restoration — Vision and Hearing
level: R
subject: biology
objectives:
  - Compreender retinal gene therapies
  - Reconhecer cochlear implants, gene therapy hearing
  - Identificar visual prosthetics, optogenetics
  - Avaliar hearing aids OTC
difficulty: 5
authorNotes: |
  Sensory restoration. Luxturna 2017 first FDA gene therapy (RPE65 LCA). Argus II Second Sight
  2013-2020 retired. Optogenetics PIONEER (GenSight). Cochlear implants Graeme Clark 1978.
  Hearing aids OTC FDA 2022. SENSORION OTOF gene therapy. Akouos OTOF.
example:
  question:
    pt: Luxturna (voretigene neparvovec, Spark Therapeutics 2017) é primeiro FDA gene therapy para…
    en: Luxturna (voretigene neparvovec, Spark Therapeutics 2017) is first FDA gene therapy for…
  choices:
    - Leber Congenital Amaurosis (LCA) RPE65 mutation; subretinal AAV2 injection
    - Of historical interest only, replaced decades ago by evidence-based standards of care
    - Investigational only, with no current FDA, EMA or international regulatory approval
    - Indication strictly limited to pediatric populations under specialty supervision
  correctAnswer: Leber Congenital Amaurosis (LCA) RPE65 mutation; subretinal AAV2 injection
  rationale:
    pt: 'Voretigene neparvovec (Luxturna Spark Therapeutics, dec/2017): first US gene therapy approved (in vivo, eye). Subretinal AAV2 carrying RPE65 cDNA. Restored retinoid cycle, navigational vision in LCA Type 2 patients (~2% blind children). RCT showed multi-luminance mobility test improvement. Cost $850k bilateral. Roche acquired Spark 2019. Inspired pipeline.'
    en: 'Voretigene neparvovec (Luxturna Spark Therapeutics, Dec 2017): first US gene therapy approved (in vivo, eye). Subretinal AAV2 carrying RPE65 cDNA. Restored retinoid cycle, navigational vision in LCA Type 2 patients (~2% blind children). RCT showed multi-luminance mobility test improvement. Cost $850k bilateral. Roche acquired Spark 2019. Inspired pipeline.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Visão
      en: Page 1 — Vision
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em retinitis pigmentosa (RP), gene therapies em pipeline…
          en: In retinitis pigmentosa (RP), gene therapies in pipeline…
        choices:
          - MeiraGTx + Janssen RPGR (X-linked), Editas EDIT-101 CEP290 base editing, Atsena Therapeutics LCA1 GUCY2D
          - Limited to Luxturna without broader clinical applicability or alternative pathways
          - No demonstrated pipeline in current evidence base or guideline framework
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: MeiraGTx + Janssen RPGR (X-linked), Editas EDIT-101 CEP290 base editing, Atsena Therapeutics LCA1 GUCY2D
        rationale:
          pt: 'RP affects ~100k US, ~1.5M globally. ~80 genes identified. Pipelines: MeiraGTx-Janssen LUMEOS Phase 3 RPGR (X-linked RP). Editas EDIT-101 (CEP290 c.IVS26 mutation) first in vivo CRISPR therapy 2020 — efficacy modest, paused 2024. ProQR antisense oligonucleotides (RPE65, USH2A, RHO). Acuvitas optogenetics. Atsena LCA1 (GUCY2D). Choroideremia: CHM gene therapy 4D Molecular.'
          en: 'RP affects ~100k US, ~1.5M globally. ~80 genes identified. Pipelines: MeiraGTx-Janssen LUMEOS Phase 3 RPGR (X-linked RP). Editas EDIT-101 (CEP290 c.IVS26 mutation) first in vivo CRISPR therapy 2020 — modest efficacy, paused 2024. ProQR antisense oligonucleotides (RPE65, USH2A, RHO). Acuvitas optogenetics. Atsena LCA1 (GUCY2D). Choroideremia: CHM 4D Molecular gene therapy.'
        objectives: [RP gene therapy]
      - type: choice
        difficulty: 5
        question:
          pt: Em optogenetics for vision restoration, GenSight PIONEER (2021)…
          en: In optogenetics for vision restoration, GenSight PIONEER (2021)…
        choices:
          - Channelrhodopsin (ChrimsonR) AAV in retinal ganglion cells RP late-stage; first human partial vision restoration
          - Strictly theoretical observation that has never been validated in randomized human trials
          - No demonstrated clinical application in current evidence-based guidelines
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Channelrhodopsin (ChrimsonR) AAV in retinal ganglion cells RP late-stage; first human partial vision restoration
        rationale:
          pt: 'Sahel/Roska/GenSight Biologics PIONEER trial 2021 Nat Med: light-sensitive opsin (ChrimsonR amber-sensitive) AAV → retinal ganglion cells. Patient + light-amplifying goggles partial visual function restored em RP near-blind. Optogenetic principle (Boyden/Deisseroth 2005) clinical applied. Limit: low resolution, monochromatic. Bionic Sight, Beacon, Nanoscope competitors.'
          en: 'Sahel/Roska/GenSight Biologics PIONEER 2021 Nat Med trial: light-sensitive opsin (ChrimsonR amber-sensitive) AAV → retinal ganglion cells. Patient + light-amplifying goggles → partial visual function restored in near-blind RP. Optogenetic principle (Boyden/Deisseroth 2005) clinically applied. Limit: low resolution, monochromatic. Bionic Sight, Beacon, Nanoscope competitors.'
        objectives: [Optogenetics retinal]
      - type: choice
        difficulty: 5
        question:
          pt: Em age-related macular degeneration (AMD), wet AMD anti-VEGF era includes…
          en: In age-related macular degeneration (AMD), wet AMD anti-VEGF era includes…
        choices:
          - Ranibizumab (Lucentis 2006), aflibercept (Eylea 2011), faricimab (Vabysmo 2022 anti-VEGF + Ang-2)
          - Legacy paradigm long abandoned after randomized trials demonstrated harm or futility
          - No notable evolution beyond the original first-generation device or protocol
          - Indication limited to pediatric stroke populations under specialty supervision
        correctAnswer: Ranibizumab (Lucentis 2006), aflibercept (Eylea 2011), faricimab (Vabysmo 2022 anti-VEGF + Ang-2)
        rationale:
          pt: 'Wet AMD treatment evolution: photodynamic therapy 2000 (PDT verteporfin) → ranibizumab Lucentis (Genentech/Roche) 2006 monthly intravitreal → aflibercept Eylea (Regeneron) 2011 Q8 weeks → faricimab Vabysmo (Roche) 2022 anti-VEGF + Ang-2 Q12-16 weeks → high-dose Eylea HD 2023 Q12-16. Sustainability + access burden. Bevacizumab (Avastin) off-label cheaper. Neovascular AMD: leading cause blindness >65.'
          en: 'Wet AMD treatment evolution: photodynamic therapy 2000 (PDT verteporfin) → ranibizumab Lucentis (Genentech/Roche) 2006 monthly intravitreal → aflibercept Eylea (Regeneron) 2011 Q8 weeks → faricimab Vabysmo (Roche) 2022 anti-VEGF + Ang-2 Q12-16 weeks → high-dose Eylea HD 2023 Q12-16. Sustainability + access burden. Bevacizumab (Avastin) off-label cheaper. Neovascular AMD: leading cause of blindness >65.'
        objectives: [Wet AMD]
      - type: choice
        difficulty: 5
        question:
          pt: Em dry AMD, geographic atrophy (GA) treatments approved 2023…
          en: In dry AMD, geographic atrophy (GA) treatments approved 2023…
        choices:
          - Pegcetacoplan (Syfovre Apellis) e avacincaptad pegol (Izervay Astellas) complement C3/C5 inhibitors
          - Of historical interest only, replaced decades ago by evidence-based standards of care
          - Pre-clinical compound that has not yet entered first-in-human trials
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: Pegcetacoplan (Syfovre Apellis) e avacincaptad pegol (Izervay Astellas) complement C3/C5 inhibitors
        rationale:
          pt: 'GA: dry AMD advanced, irreversible loss RPE/photoreceptors. Modest progression slowing 2023: Syfovre (pegcetacoplan, Apellis) C3 inhibitor FDA mar/2023; Izervay (avacincaptad pegol, Iveric Bio/Astellas) C5 ago/2023. Slow GA growth rate ~17-20%. Caveat: vision unchanged short-term. Vasculitis Syfovre rare AE. Costs ~$2k/dose monthly.'
          en: 'GA: advanced dry AMD, irreversible RPE/photoreceptor loss. Modest 2023 progression slowing: Syfovre (pegcetacoplan, Apellis) C3 inhibitor FDA Mar 2023; Izervay (avacincaptad pegol, Iveric Bio/Astellas) C5 Aug 2023. Slow GA growth rate ~17-20%. Caveat: short-term vision unchanged. Rare Syfovre vasculitis AE. ~$2k/dose monthly costs.'
        objectives: [GA AMD]
      - type: choice
        difficulty: 5
        question:
          pt: Em retinal cell therapy, hESC-RPE patches em clinical…
          en: In retinal cell therapy, hESC-RPE patches in clinical…
        choices:
          - Mandai/Takahashi 2014, Astellas ASP7317, Lineage OpRegen, London Project
          - Theoretical association unsupported by mechanistic or epidemiologic evidence so far
          - No randomized clinical trial has yet been conducted in this indication
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Mandai/Takahashi 2014, Astellas ASP7317, Lineage OpRegen, London Project
        rationale:
          pt: 'hESC-derived RPE: Mandai/Takahashi Riken 2014 first iPSC-RPE clinical (autologous wet AMD). Astellas Pharma (acquired Ocata) ASP7317 hESC dry AMD. Lineage Cell Therapeutics OpRegen wet/dry AMD. Moorfields/UCL London Project (Coffey/Pearson) hESC-RPE patch. iPSC-photoreceptor harder (synaptic integration challenge). Crescente pipeline.'
          en: 'hESC-derived RPE: Mandai/Takahashi Riken 2014 first iPSC-RPE clinical (autologous wet AMD). Astellas Pharma (acquired Ocata) ASP7317 hESC dry AMD. Lineage Cell Therapeutics OpRegen wet/dry AMD. Moorfields/UCL London Project (Coffey/Pearson) hESC-RPE patch. iPSC-photoreceptor harder (synaptic integration challenge). Growing pipeline.'
        objectives: [Retinal cell therapy]
      - type: choice
        difficulty: 5
        question:
          pt: Em visual prosthetics, Argus II Second Sight (2013-2020) retired because…
          en: In visual prosthetics, Argus II Second Sight (2013-2020) retired because…
        choices:
          - Limited resolution (60 electrodes), company bankrupt 2020 — orphaned implants
          - Sempre crescendo
          - Considered free of safety or efficacy concerns based on long-term registry data
          - Legacy paradigm long abandoned after randomized trials demonstrated harm or futility
        correctAnswer: Limited resolution (60 electrodes), company bankrupt 2020 — orphaned implants
        rationale:
          pt: 'Argus II Second Sight (FDA HUD 2013, EU 2011): retinal epiretinal implant 60 electrodes for RP late-stage. Modest perception (light, motion, simple shapes). Company financial troubles → 2020 stopped manufacturing. ~350 implanted patients orphaned (no support, batteries). Bioethics post-clinical implant maintenance. Successors: PRIMA (Pixium Vision photovoltaic), Argus III pipeline halted, Cortical (Monash, Synchron Stentrode visual).'
          en: 'Argus II Second Sight (FDA HUD 2013, EU 2011): retinal epiretinal implant with 60 electrodes for late-stage RP. Modest perception (light, motion, simple shapes). Company financial troubles → 2020 stopped manufacturing. ~350 implanted patients orphaned (no support, batteries). Post-clinical implant maintenance bioethics. Successors: PRIMA (Pixium Vision photovoltaic), Argus III pipeline halted, Cortical (Monash, Synchron Stentrode visual).'
        objectives: [Argus II]
      - type: choice
        difficulty: 5
        question:
          pt: Em diabetic retinopathy, IDx-DR (Digital Diagnostics 2018) é…
          en: In diabetic retinopathy, IDx-DR (Digital Diagnostics 2018) is…
        choices:
          - First autonomous AI FDA-approved diagnosis (more than mild DR primary care)
          - Limited to screening manual without broader clinical applicability or alternative pathways
          - Withdrawn from development after pivotal trial efficacy or safety failure
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: First autonomous AI FDA-approved diagnosis (more than mild DR primary care)
        rationale:
          pt: 'IDx-DR (Michael Abramoff Iowa, Digital Diagnostics): FDA cleared abr/2018. Fundus photo upload → AI says "more than mild DR" yes/no. Sensitivity 87%, specificity 90%. Primary care setting. Reduces specialist bottleneck. Marco regulatório autonomous AI. Sucessores: EyeArt (Eyenuk), AEYE Health, Optomed Aurora. Diabetic eye screening cost-effective.'
          en: 'IDx-DR (Michael Abramoff Iowa, Digital Diagnostics): FDA cleared Apr 2018. Fundus photo upload → AI says "more than mild DR" yes/no. Sensitivity 87%, specificity 90%. Primary care setting. Reduces specialist bottleneck. Autonomous AI regulatory milestone. Successors: EyeArt (Eyenuk), AEYE Health, Optomed Aurora. Cost-effective diabetic eye screening.'
        objectives: [IDx-DR]
      - type: choice
        difficulty: 5
        question:
          pt: Em hearing, cochlear implants Graeme Clark 1978, modern enhancements…
          en: In hearing, Graeme Clark 1978 cochlear implants, modern enhancements…
        choices:
          - 24+ electrode arrays, fully implantable, hybrid (preserve residual), MRI-compatible
          - Of historical interest only, replaced decades ago by evidence-based standards of care
          - Field has stagnated for over a decade with no meaningful design or efficacy advance
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: 24+ electrode arrays, fully implantable, hybrid (preserve residual), MRI-compatible
        rationale:
          pt: 'Cochlear implants: pioneer Graeme Clark Melbourne 1978; FDA 1985 multichannel. Cochlear (Australia), Advanced Bionics, MED-EL ~80% market. Modern: 24-30 channels, MRI-compatible, hybrid CI (preserve residual high-freq). Bilateral CI standard. ~750k+ implanted globally. Pediatric early implantation (<2 yo) maximizes language. Music perception still limited.'
          en: 'Cochlear implants: pioneer Graeme Clark Melbourne 1978; FDA 1985 multichannel. Cochlear (Australia), Advanced Bionics, MED-EL ~80% market. Modern: 24-30 channels, MRI-compatible, hybrid CI (preserve residual high-freq). Bilateral CI standard. ~750k+ implanted globally. Early pediatric implantation (<2 yo) maximizes language. Music perception still limited.'
        objectives: [CI evolution]
      - type: choice
        difficulty: 5
        question:
          pt: Em hearing gene therapy, OTOF (otoferlin) gene therapy 2024 first reports…
          en: In hearing gene therapy, OTOF (otoferlin) gene therapy 2024 first reports…
        choices:
          - Sensorion, Akouos, Eli Lilly trials children DFNB9 partial hearing restoration
          - Hypothesis-only proposal lacking any preclinical efficacy data to date
          - Pivotal trial program has never been initiated for this disease area
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: Sensorion, Akouos, Eli Lilly trials children DFNB9 partial hearing restoration
        rationale:
          pt: 'DFNB9 (otoferlin gene OTOF mutation): autosomal recessive deafness. AAV gene therapy 2024 multiple reports first in human. Akouos AK-OTOF (Eli Lilly acquired) Phase 1/2 first US patient out/2023. Sensorion SENS-501 Phase 1/2 EU. Restoring partial-to-near normal hearing pediatric. Other: GJB2 connexin-26, USH1C/2A Usher syndrome em pipeline. Era nascent hearing gene therapy.'
          en: 'DFNB9 (otoferlin OTOF mutation): autosomal recessive deafness. AAV gene therapy 2024 multiple first-in-human reports. Akouos AK-OTOF (Eli Lilly acquired) Phase 1/2 first US patient Oct 2023. Sensorion SENS-501 Phase 1/2 EU. Restoring partial-to-near-normal hearing in pediatrics. Others: GJB2 connexin-26, USH1C/2A Usher syndrome in pipeline. Nascent hearing gene therapy era.'
        objectives: [OTOF gene therapy]
      - type: choice
        difficulty: 5
        question:
          pt: OTC Hearing Aids (FDA 2022) implementation impact…
          en: OTC Hearing Aids (FDA 2022) implementation impact…
        choices:
          - Mild-to-moderate hearing loss, ~$200-3000 (vs $5k+ traditional); Bose, Apple AirPods Pro 2 hearing
          - Prescription-only pharmacotherapy without any over-the-counter or device option
          - No meaningful practice change recommended after the trial readouts
          - Approved exclusively in the United Kingdom under MHRA without other regulatory pathways
        correctAnswer: Mild-to-moderate hearing loss, ~$200-3000 (vs $5k+ traditional); Bose, Apple AirPods Pro 2 hearing
        rationale:
          pt: 'OTC Hearing Aid Act 2017 → FDA final rule out/2022. Direct-to-consumer. Mild-to-moderate adult hearing loss. Models: Bose SoundControl, Eargo, Lexie (Bose), Sony CRE. Apple AirPods Pro 2 (set/2024 software update FDA-cleared "Hearing Aid feature"). Reduces stigma, cost barrier (~63% adults 70+ have hearing loss, only ~17% use). Audiologist visit not required — consumer access.'
          en: 'OTC Hearing Aid Act 2017 → FDA final rule Oct 2022. Direct-to-consumer. Mild-to-moderate adult hearing loss. Models: Bose SoundControl, Eargo, Lexie (Bose), Sony CRE. Apple AirPods Pro 2 (Sep 2024 software update FDA-cleared "Hearing Aid feature"). Reduces stigma, cost barrier (~63% adults 70+ have hearing loss, only ~17% use). Audiologist visit not required — consumer access.'
        objectives: [OTC HA]
  - title:
      pt: Página 2 — Aplicações
      en: Page 2 — Applications
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em hearing loss + dementia link, Lancet Commission 2020/2024…
          en: In hearing loss + dementia link, Lancet Commission 2020/2024…
        choices:
          - Hearing loss largest modifiable midlife dementia risk factor (8% population attributable)
          - Trivial physiologic concern without clinical or population-health relevance
          - No demonstrated ligação in current evidence base or guideline framework
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Hearing loss largest modifiable midlife dementia risk factor (8% population attributable)
        rationale:
          pt: 'Lancet Commission Dementia Prevention (Livingston 2020, 2024): 14 modifiable risk factors. Hearing loss largest single midlife factor (8% PAF). ACHIEVE trial (Lin 2023 Lancet): hearing aids reduced 3y cognitive decline ~50% high-risk subgroup. Vision loss (4%) added 2024. 32% all dementia cases preventable. Strong motivation hearing screening + treatment.'
          en: 'Lancet Commission on Dementia Prevention (Livingston 2020, 2024): 14 modifiable risk factors. Hearing loss largest single midlife factor (8% PAF). ACHIEVE trial (Lin 2023 Lancet): hearing aids reduced 3y cognitive decline ~50% in high-risk subgroup. Vision loss (4%) added 2024. 32% of all dementia cases preventable. Strong motivation for hearing screening + treatment.'
        objectives: [Hearing dementia]
      - type: choice
        difficulty: 5
        question:
          pt: Em vestibular implants (FDA Breakthrough 2023 Multichannel)…
          en: In vestibular implants (FDA Breakthrough 2023 Multichannel)…
        choices:
          - 'Hopkins Della Santina + Labyrinth Devices: artificial vestibular signal balance restoration'
          - Speculative connection raised in commentary papers but never tested rigorously
          - Lacks any established indication in modern clinical decision pathways
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: 'Hopkins Della Santina + Labyrinth Devices: artificial vestibular signal balance restoration'
        rationale:
          pt: 'Vestibular implants: bilateral vestibular hypofunction (BVH) ~2/100k. Della Santina Hopkins + Labyrinth Devices Multichannel Vestibular Implant. Stimulate semicircular canals, electrical → balance restoration. FDA Breakthrough Device Designation 2023. Phase 2 ongoing. Limit: small population, complex surgery. Mejora gait, falls em BVH.'
          en: 'Vestibular implants: bilateral vestibular hypofunction (BVH) ~2/100k. Della Santina Hopkins + Labyrinth Devices Multichannel Vestibular Implant. Stimulates semicircular canals, electrical → balance restoration. FDA Breakthrough Device Designation 2023. Phase 2 ongoing. Limit: small population, complex surgery. Improves gait, falls in BVH.'
        objectives: [Vestibular implant]
      - type: choice
        difficulty: 5
        question:
          pt: Em refractive surgery, advances post-LASIK include…
          en: In refractive surgery, post-LASIK advances include…
        choices:
          - SMILE (small incision lenticule extraction), corneal cross-linking, phakic IOLs
          - Refractive LASIK surgery applied outside its standard refractive correction indication
          - Subsequent iterations failed to demonstrate clinical advantage over the legacy approach
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: SMILE (small incision lenticule extraction), corneal cross-linking, phakic IOLs
        rationale:
          pt: 'Refractive: LASIK 1991+, ~700k US/yr. SMILE (Walter Sekundo/Marcus Blum 2007 EU; FDA 2016 myopia, 2022 astigmatism): smaller incision, less dry eye, biomechanically stronger cornea. Corneal cross-linking (CXL, FDA 2016 Photrexa) keratoconus. Phakic IOLs (Visian ICL, EVO+) high myopia. Lasik survivor cohorts long-term outcomes mixed (LSAT survey 2024).'
          en: 'Refractive: LASIK 1991+, ~700k US/yr. SMILE (Walter Sekundo/Marcus Blum 2007 EU; FDA 2016 myopia, 2022 astigmatism): smaller incision, less dry eye, biomechanically stronger cornea. Corneal cross-linking (CXL, FDA 2016 Photrexa) keratoconus. Phakic IOLs (Visian ICL, EVO+) high myopia. LASIK survivor cohorts have mixed long-term outcomes (2024 LSAT survey).'
        objectives: [Refractive]
      - type: choice
        difficulty: 5
        question:
          pt: Em myopia control children (epidemic in East Asia ~80% prevalence)…
          en: In myopia control in children (epidemic in East Asia ~80% prevalence)…
        choices:
          - Atropine 0.01-0.05% drops, orthokeratology, MiSight contact lenses, outdoor time exposure
          - Limited to glasses without broader clinical applicability or alternative pathways
          - No measurable impact on hard endpoints in well-powered prospective studies
          - Approved exclusively in the United States with no EMA or international pathway
        correctAnswer: Atropine 0.01-0.05% drops, orthokeratology, MiSight contact lenses, outdoor time exposure
        rationale:
          pt: 'Myopia control: low-dose atropine (LAMP study 2019 Hong Kong: 0.05% > 0.01% efficacy slowing progression). MiSight 1-day contact lens FDA 2019 (CooperVision): peripheral defocus theory. Orthokeratology (overnight rigid contact). Outdoor time 2h+/day reduces incidence. Asia epidemic (~80% Singapore, Korea adolescents). Public health priority (sclera elongation pathologic myopia → retinal detachment, glaucoma).'
          en: 'Myopia control: low-dose atropine (LAMP 2019 Hong Kong: 0.05% > 0.01% efficacy slowing progression). MiSight 1-day contact lens FDA 2019 (CooperVision): peripheral defocus theory. Orthokeratology (overnight rigid contact). Outdoor time 2h+/day reduces incidence. Asia epidemic (~80% Singapore, Korea adolescents). Public health priority (sclera elongation → pathologic myopia → retinal detachment, glaucoma).'
        objectives: [Myopia control]
      - type: choice
        difficulty: 5
        question:
          pt: Em glaucoma, MIGS (Minimally Invasive Glaucoma Surgery) e SLT (Selective Laser Trabeculoplasty)…
          en: In glaucoma, MIGS (Minimally Invasive Glaucoma Surgery) and SLT (Selective Laser Trabeculoplasty)…
        choices:
          - 'LiGHT trial 2019: SLT first-line vs drops; iStent, Hydrus, XEN MIGS evolution'
          - Limited to drops without broader clinical applicability or alternative pathways
          - No notable evolution beyond the original first-generation device or protocol
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: 'LiGHT trial 2019: SLT first-line vs drops; iStent, Hydrus, XEN MIGS evolution'
        rationale:
          pt: 'Glaucoma: leading global blindness. SLT (Selective Laser Trabeculoplasty): LiGHT trial Lancet 2019 — first-line UK option vs drops, equivalent IOP control 6y. SLT painless office procedure, ~50% effective. MIGS: iStent (2012 first MIGS FDA approved), Hydrus, XEN. Cataract surgery combined. Less invasive than tube shunts. Drug-eluting implants (Durysta bimatoprost FDA 2020). Game-changer access.'
          en: 'Glaucoma: leading global blindness. SLT (Selective Laser Trabeculoplasty): LiGHT 2019 Lancet trial — first-line UK option vs drops, equivalent 6y IOP control. SLT painless office procedure, ~50% effective. MIGS: iStent (2012 first MIGS FDA-approved), Hydrus, XEN. Combined with cataract surgery. Less invasive than tube shunts. Drug-eluting implants (Durysta bimatoprost FDA 2020). Game-changer for access.'
        objectives: [Glaucoma SLT MIGS]
      - type: choice
        difficulty: 5
        question:
          pt: Em hearing screening newborn, US universal since 2000s…
          en: In newborn hearing screening, US universal since 2000s…
        choices:
          - OAE (otoacoustic emissions) e ABR (auditory brainstem response) before discharge; >97% screened
          - Sempre voluntário
          - Effect size indistinguishable from placebo in randomized comparisons
          - Limited US-only indication with no current submission to other regulatory agencies
        correctAnswer: OAE (otoacoustic emissions) e ABR (auditory brainstem response) before discharge; >97% screened
        rationale:
          pt: 'EHDI (Early Hearing Detection and Intervention): all states laws mid-2000s. OAE (active hair cells) e ABR (auditory pathway) screening pre-discharge. ~3-4 per 1000 detected. Crítico for language development: implant before 12 mo optimum. Audiologic eval by 3 mo, intervention by 6 mo. CDC tracking. ~97% US newborns screened.'
          en: 'EHDI (Early Hearing Detection and Intervention): all states have laws since mid-2000s. OAE (active hair cells) and ABR (auditory pathway) screening pre-discharge. ~3-4 per 1000 detected. Critical for language development: implant before 12 mo optimum. Audiologic eval by 3 mo, intervention by 6 mo. CDC tracking. ~97% of US newborns screened.'
        objectives: [Hearing screening]
      - type: choice
        difficulty: 5
        question:
          pt: Em deafness ethical debate, Deaf community em…
          en: In deafness ethical debate, Deaf community on…
        choices:
          - Identity vs medical model; cochlear implant historical opposition; ASL preservation
          - Limited to medical without broader clinical applicability or alternative pathways
          - No ongoing scientific or ethical debate within the relevant research community
          - Approved exclusively in the United States with no EMA or international pathway
        correctAnswer: Identity vs medical model; cochlear implant historical opposition; ASL preservation
        rationale:
          pt: 'Deaf identity debate: Deaf (capital D, cultural identity) vs hearing-impaired (medical disability). Linguistic minority American Sign Language. Cochlear implant pediatric controvertido — Deaf community historicalmente opposed (cultural genocide). NAD evolved more nuanced. Bilingualism (ASL + spoken). Bioethics: autonomy, parental decision, child best interest. PGT-M deafness selection raises ethical questions.'
          en: 'Deaf identity debate: Deaf (capital D, cultural identity) vs hearing-impaired (medical disability). American Sign Language linguistic minority. Pediatric cochlear implant controversial — Deaf community historically opposed (cultural genocide). NAD evolved more nuanced. Bilingualism (ASL + spoken). Bioethics: autonomy, parental decision, child best interest. PGT-M deafness selection raises ethical questions.'
        objectives: [Deaf identity]
      - type: choice
        difficulty: 5
        question:
          pt: Em emerging therapies, sparse photoreceptor restoration via Müller glia reprogramming…
          en: In emerging therapies, sparse photoreceptor restoration via Müller glia reprogramming…
        choices:
          - Müller glia → rod-like cells via Ascl1, Lin28 pre-clinical (Reh Washington); regenerative blueprint
          - Legacy paradigm long abandoned after randomized trials demonstrated harm or futility
          - No demonstrated clinical application in current evidence-based guidelines
          - Pediatric-only authorization without adult acute ischemic stroke approval
        correctAnswer: Müller glia → rod-like cells via Ascl1, Lin28 pre-clinical (Reh Washington); regenerative blueprint
        rationale:
          pt: 'Tom Reh (Washington) Müller glia to retinal regeneration: in zebrafish do robustly; mammals limited. Ascl1, Lin28 induction in mouse → modest photoreceptor genesis. NewLimit, similar reprogramming startups exploring in retina. CRISPR base editing photoreceptor pipeline. Long-term regenerative ophthalmology future.'
          en: 'Tom Reh (Washington) Müller glia retinal regeneration: zebrafish robust; mammals limited. Ascl1, Lin28 induction in mouse → modest photoreceptor genesis. NewLimit, similar reprogramming startups exploring in retina. CRISPR base editing photoreceptor pipeline. Long-term regenerative ophthalmology future.'
        objectives: [Müller glia]
      - type: choice
        difficulty: 5
        question:
          pt: Em tinnitus, neuromodulation devices include…
          en: In tinnitus, neuromodulation devices include…
        choices:
          - 'Lenire (Neuromod 2023 FDA): bimodal sound + tongue stimulation; Cala TENS aurícular CALMR'
          - Limited to drogas without broader clinical applicability or alternative pathways
          - Investigational only, with no current FDA, EMA or international regulatory approval
          - Indication limited to pediatric stroke populations under specialty supervision
        correctAnswer: 'Lenire (Neuromod 2023 FDA): bimodal sound + tongue stimulation; Cala TENS aurícular CALMR'
