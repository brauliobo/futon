          - Apenas em US
        correctAnswer: 78 genes "secondary findings" (BRCA1/2, Lynch, cardiomyopathy, ATTR, RYR1) by default
        rationale:
          pt: 'ACMG (American College of Medical Genetics) SF list: actionable genes returned em WES/WGS by default unless patient opts out. v1 (2013) 56 genes; v3.1 2022: 78 genes. Categories: cancer susceptibility, cardiac, malignant hyperthermia, ATTR, lipid disorders. Counseling reqd. Pediatric extra considerations (autonomy future-self, prevention). Brazil, EU different policies.'
          en: 'ACMG (American College of Medical Genetics) SF list: actionable genes returned in WES/WGS by default unless patient opts out. v1 (2013) 56 genes; v3.1 2022: 78 genes. Categories: cancer susceptibility, cardiac, malignant hyperthermia, ATTR, lipid disorders. Counseling required. Pediatric additional considerations (future-self autonomy, prevention). Brazil, EU different policies.'
