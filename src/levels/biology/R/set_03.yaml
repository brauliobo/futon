          - Apenas em US
        correctAnswer: Privacy, family secrets, NPE (non-paternal events), forensic genetic genealogy
        rationale:
          pt: '23andMe ~14M customers, Ancestry ~22M. Privacy: 2018 Golden State Killer identified via GEDmatch (forensic genetic genealogy). Customer agreements re: third-party sharing. Health: BRCA1/2 limited tests. NPE: ~10% receive surprises. 23andMe data breach 2023 ~7M users data leaked. Customer trust impact. FDA-cleared health reports (2017+).'
          en: '23andMe ~14M customers, Ancestry ~22M. Privacy: 2018 Golden State Killer identified via GEDmatch (forensic genetic genealogy). Customer agreements re: third-party sharing. Health: BRCA1/2 limited tests. NPE: ~10% receive surprises. 23andMe 2023 data breach ~7M users data leaked. Customer trust impact. FDA-cleared health reports (2017+).'
