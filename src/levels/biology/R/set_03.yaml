          - Sempre safe
          - Sem qualquer issue
          - Apenas em US
        correctAnswer: Limited evidence benefit, eugenics legacy, exacerbates inequalities, scores European-biased
        rationale:
          pt: 'Genomic Prediction, Orchid Health: PGT-P score embryos via PRS. Turley 2021 NEJM, ESHRE 2022 caution: ~3 IQ points or ~10% relative risk reduction. PRS predominantly European-trained → underperform other ancestries. Eugenics legacy. ISSCR/ESHRE/ASRM caution. Disability rights critique. Slippery slope concerns.'
          en: 'Genomic Prediction, Orchid Health: PGT-P scores embryos via PRS. Turley 2021 NEJM, ESHRE 2022 caution: ~3 IQ points or ~10% relative risk reduction. Predominantly European-trained PRS → underperforms other ancestries. Eugenics legacy. ISSCR/ESHRE/ASRM caution. Disability rights critique. Slippery slope concerns.'
