          - Sempre permissível
          - Sem qualquer debate
          - Apenas em pediatric
        correctAnswer: Therapy/enhancement distinction blurry; Sandel "Case Against Perfection"; Habermas
        rationale:
          pt: 'Sandel "The Case Against Perfection" (Atlantic 2004 → book 2007): humility, bioethics arguments contra enhancement. Habermas "Future of Human Nature": germline modifications violate autonomy future generation. Buchanan/Brock "From Chance to Choice" (2000): enhancement with conditions. Cognitive: Adderall college "neuroenhancement". Cosmetic CRISPR (gene doping athletes): WADA monitoring.'
          en: 'Sandel "The Case Against Perfection" (Atlantic 2004 → book 2007): humility, bioethics arguments against enhancement. Habermas "The Future of Human Nature": germline modifications violate future generation autonomy. Buchanan/Brock "From Chance to Choice" (2000): enhancement with conditions. Cognitive: Adderall college "neuroenhancement". Cosmetic CRISPR (gene doping athletes): WADA monitoring.'
