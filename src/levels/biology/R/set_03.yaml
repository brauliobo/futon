        choices:
          - Specific consent infeasible em large biobanks (UK Biobank, All of Us); 2018 Common Rule allows
          - Apenas burocrático
          - Sem qualquer impacto
          - Apenas em US
        correctAnswer: Specific consent infeasible em large biobanks (UK Biobank, All of Us); 2018 Common Rule allows
        rationale:
          pt: 'Specific consent difficult em multi-decade biobank research. UK Biobank 500k, All of Us 1M+, FinnGen 500k. 2018 Common Rule revision: allowed broad consent for unspecified future use. Critique: not truly informed (autonomy issue). HIPAA, GDPR specifics. Dynamic consent (NHS Genomics England): refresh decisions. Data altruism EU EHDS. Tension: research utility vs individual control.'
          en: 'Specific consent difficult in multi-decade biobank research. UK Biobank 500k, All of Us 1M+, FinnGen 500k. 2018 Common Rule revision: allowed broad consent for unspecified future use. Critique: not truly informed (autonomy issue). HIPAA, GDPR specifics. Dynamic consent (NHS Genomics England): refresh decisions. EU EHDS data altruism. Tension: research utility vs individual control.'
