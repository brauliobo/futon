          en: In vaccine mandates ethics, balance individual liberty vs public health…
        choices:
          - Jacobson v Massachusetts 1905 SCOTUS upheld; COVID OSHA mandate 2022 struck (NFIB v OSHA)
          - Sempre permitido
          - Sem qualquer debate
          - Apenas em pediatric
        correctAnswer: Jacobson v Massachusetts 1905 SCOTUS upheld; COVID OSHA mandate 2022 struck (NFIB v OSHA)
        rationale:
          pt: 'Jacobson 1905: state can mandate smallpox vaccine. 116 years prevailing. COVID: school mandates state-by-state, healthcare worker mandates Healthcare CMS, OSHA workplace mandate (struck NFIB v OSHA Jan 2022). Pediatric vaccines required for school entry varies state. Religious/philosophical exemptions politicized post-COVID. Trust erosion ongoing concern.'
          en: 'Jacobson 1905: state can mandate smallpox vaccine. 116-year prevailing. COVID: school mandates state-by-state, healthcare worker mandates by CMS, OSHA workplace mandate (struck down NFIB v OSHA Jan 2022). Pediatric school-entry vaccines vary by state. Religious/philosophical exemptions politicized post-COVID. Ongoing trust erosion concern.'
        objectives: [Vaccine mandates]
