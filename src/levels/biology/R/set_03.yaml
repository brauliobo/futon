          - Apenas terminal
          - Sem qualquer aplicação
          - Apenas em US
        correctAnswer: Eligibility expanded 2021 (não-terminal); mental health 2027 deferred; ~13k per year
        rationale:
          pt: 'Canada MAID legal 2016. 2021 amendment removed "reasonably foreseeable death" requirement. ~50k MAID deaths total 2016-2024. Mental health (Track 2 expanded eligibility) controvertido — implementation 2027 pushed back. Belgium, Netherlands long-standing. US: 11 states (Oregon Death with Dignity 1997 first). Ethics: terminal sedation, palliative care.'
          en: 'Canada MAID legalized 2016. 2021 amendment removed "reasonably foreseeable death" requirement. ~50k total MAID deaths 2016-2024. Mental health (Track 2 expanded eligibility) controversial — implementation 2027 pushed back. Belgium, Netherlands long-standing. US: 11 states (Oregon Death with Dignity 1997 first). Ethics: terminal sedation, palliative care.'
