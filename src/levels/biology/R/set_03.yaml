title:
  pt: Bioética de Fronteira
  en: Frontier Bioethics
level: R
subject: biology
objectives:
  - Compreender germline editing debate
  - Reconhecer Asilomar, ISSCR governance
  - Identificar AI ethics em saúde
  - Avaliar reproductive ethics
difficulty: 5
authorNotes: |
  Frontier bioethics. He Jiankui CCR5 babies 2018 → Hong Kong Summit, prison. Asilomar 1975
  rDNA precedent. ISSCR 2021. CRISPR germline. WHO Expert Advisory Committee 2021. National
  Academies 2017, 2020 reports. AI Ethics: Dobbs, Cleveland Clinic. Bioterrorism dual use.
  Belmont 1979. Helsinki 2013. Nuremberg 1947.
example:
  question:
    pt: O caso He Jiankui (2018) China gerou…
    en: He Jiankui case (2018) China generated…
  choices:
    - First germline-edited human babies (CCR5 KO twins); global condemnation, prison sentence 3 years
    - Limited to controvérsia without broader clinical applicability or alternative pathways
    - No demonstrated ação in current evidence base or guideline framework
    - Approved exclusively in the United States with no EMA or international pathway
  correctAnswer: First germline-edited human babies (CCR5 KO twins); global condemnation, prison sentence 3 years
  rationale:
    pt: 'He Jiankui (Southern University of Science and Technology Shenzhen): novembro 2018 announce CCR5 KO em twins via CRISPR para HIV resistance. Off-target effects, mosaicism, no clear benefit (HIV preventable other ways). Hong Kong Summit Nov 2018: condemned. China sentenced 3 years prison 2019. Released 2022. WHO/ISSCR moratorium calls. Major bioethics inflection.'
    en: 'He Jiankui (Southern University of Science and Technology Shenzhen): November 2018 announced CCR5 KO twins via CRISPR for HIV resistance. Off-target effects, mosaicism, no clear benefit (HIV preventable other ways). Hong Kong Summit Nov 2018: condemned. China sentenced 3 years prison 2019. Released 2022. WHO/ISSCR moratorium calls. Major bioethics inflection.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Editing e governance
      en: Page 1 — Editing and governance
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Asilomar Conference 1975 estabeleceu precedent para…
          en: Asilomar Conference 1975 established precedent for…
        choices:
          - Self-imposed moratorium rDNA recombinant DNA experiments; voluntary scientist governance
          - Mandatory federal NIH licensing of all rDNA experiments via top-down regulatory statute
          - International treaty banning recombinant DNA work pending UN biosafety commission ruling
          - Industry-led commercial certification scheme for biotech firms outside academic research
        correctAnswer: Self-imposed moratorium rDNA recombinant DNA experiments; voluntary scientist governance
        rationale:
          pt: 'Paul Berg organized Asilomar fev/1975. Pause rDNA até safety guidelines. NIH Recombinant DNA Advisory Committee (RAC) 1976. Modelo "responsible science" via self-regulation. Critique: insider deal, exclude public. Influenced sucessores: Wuhan COVID lab leak gain-of-function, AI 2023 pause letters. Recurring template.'
          en: 'Paul Berg organized Asilomar Feb 1975. rDNA pause until safety guidelines. NIH Recombinant DNA Advisory Committee (RAC) 1976. "Responsible science" via self-regulation model. Critique: insider deal, excludes public. Influenced successors: Wuhan COVID lab leak gain-of-function, 2023 AI pause letters. Recurring template.'
        objectives: [Asilomar]
      - type: choice
        difficulty: 5
        question:
          pt: Belmont Report (1979) estabeleceu três princípios de ethics em research humano…
          en: Belmont Report (1979) established three principles for human research ethics…
        choices:
          - Respect for persons (autonomy), Beneficence, Justice
          - Voluntariness, Disclosure, Comprehension (Nuremberg Code 1947 elements substituted)
          - Confidentiality, Privacy, Data minimization (HIPAA-style framework misattributed)
          - Equipoise, Therapeutic misconception, Placebo limits (Helsinki Declaration mix-up)
        correctAnswer: Respect for persons (autonomy), Beneficence, Justice
        rationale:
          pt: 'Belmont Report (HEW 1979): post-Tuskegee syphilis study (1932-1972). Three principles: respect (informed consent), beneficence (do not harm + maximize benefit), justice (fair selection). 45 CFR 46 Common Rule. IRB requirements. Aplica humano subjects research. Updates: 2018 revision Common Rule. Junto a Helsinki, Nuremberg códigos founders modern bioethics.'
          en: 'Belmont Report (HEW 1979): post-Tuskegee syphilis study (1932-1972). Three principles: respect (informed consent), beneficence (do no harm + maximize benefit), justice (fair selection). 45 CFR 46 Common Rule. IRB requirements. Applies to human subjects research. Updates: 2018 Common Rule revision. Together with Helsinki, Nuremberg founding codes of modern bioethics.'
        objectives: [Belmont]
      - type: choice
        difficulty: 5
        question:
          pt: Em germline editing, NAS/NAM 2017 e 2020 reports recomendaram…
          en: In germline editing, NAS/NAM 2017 and 2020 reports recommended…
        choices:
          - Strict criteria germline (compelling medical need, no alternative); ISSCR similar; not ban absolute
          - Total absolute ban on all heritable editing including monogenic disease prevention research
          - Routine clinical approval of germline CRISPR for IVF clinics under standard FDA pathways
          - Voluntary self-regulation by clinical labs without NAS/NAM, ISSCR, or WHO framework input
        correctAnswer: Strict criteria germline (compelling medical need, no alternative); ISSCR similar; not ban absolute
        rationale:
          pt: 'NAS/NAM "Human Genome Editing: Science, Ethics, Governance" 2017: framework for somatic + heritable. Heritable: only with specific criteria (compelling, no alternative, robust safety, oversight). Updated 2020 (post-He Jiankui): heritable should not proceed yet. WHO 2021 Advisory Committee: oppose moratorium, framework needed. ISSCR 2021 similar conditional approach.'
          en: 'NAS/NAM "Human Genome Editing: Science, Ethics, Governance" 2017: framework for somatic + heritable. Heritable: only with specific criteria (compelling, no alternative, robust safety, oversight). Updated 2020 (post-He Jiankui): heritable should not proceed yet. WHO 2021 Advisory Committee: oppose moratorium, framework needed. ISSCR 2021 similar conditional approach.'
        objectives: [NAS germline]
      - type: choice
        difficulty: 5
        question:
          pt: Em AI clinical bias, Optum case (Obermeyer 2019 Science) demonstrou…
          en: In AI clinical bias, Optum case (Obermeyer 2019 Science) demonstrated…
        choices:
          - 'Cost-based algorithm racial bias: Black patients sicker para mesma "risk" score'
          - 'Age-stratified bias: pediatric patients systematically over-flagged versus adult cohort'
          - 'Geographic bias only: rural ZIP codes downweighted with no race or ethnicity component'
          - 'Insurance-tier bias: uninsured patients excluded from training set without racial pattern'
        correctAnswer: 'Cost-based algorithm racial bias: Black patients sicker para mesma "risk" score'
        rationale:
          pt: 'Ziad Obermeyer (Berkeley/UCLA) Science 2019: proxy "healthcare cost" para "risk" introduces racial bias because Black patients have less spent regardless of need. Algorithm predicted ~50% Black patients flagged actually need management. Optum used in ~200M Americans. Algorithmic auditing accountability emerged. AMA, FDA, EU AI Act addressed.'
          en: 'Ziad Obermeyer (Berkeley/UCLA) Science 2019: proxy "healthcare cost" for "risk" introduces racial bias because Black patients have less spent regardless of need. Algorithm predicted ~50% Black patients flagged actually need management. Optum used in ~200M Americans. Algorithmic auditing accountability emerged. AMA, FDA, EU AI Act addressed.'
        objectives: [Optum bias]
      - type: choice
        difficulty: 5
        question:
          pt: Em em "right to repair" gene therapy, debate emerging because…
          en: In gene therapy "right to repair" debate emerging because…
        choices:
          - High prices ($2-3M/dose) limit access; outcomes-based agreements, generic pathways debated
          - Universally affordable pricing under $50k/dose with established global payer agreements
          - Manufacturing scale-up has eliminated cost barriers via biosimilar-style competition
          - Compulsory licensing under TRIPS already mandates open generics for AAV gene therapies
        correctAnswer: High prices ($2-3M/dose) limit access; outcomes-based agreements, generic pathways debated
        rationale:
          pt: 'ATMPs (Zolgensma $2.1M, Casgevy $2.2M, Hemgenix $3.5M, Skysona $3M, Lyfgenia $3.1M, Roctavian $2.9M) — pricing extreme. Equity em access global. CMS Cell + Gene Therapy Access Model 2025. Outcomes-based payments. EU pricing volatile. LMIC virtually no access. Generics: complex, no precedent for AAV/cell therapy. Patent landscape contested.'
          en: 'ATMPs (Zolgensma $2.1M, Casgevy $2.2M, Hemgenix $3.5M, Skysona $3M, Lyfgenia $3.1M, Roctavian $2.9M) — extreme pricing. Global access equity. CMS Cell + Gene Therapy Access Model 2025. Outcomes-based payments. Volatile EU pricing. LMIC virtually no access. Generics: complex, no precedent for AAV/cell therapy. Contested patent landscape.'
        objectives: [ATMP access]
      - type: choice
        difficulty: 5
        question:
          pt: Em pediatric experimental therapies, ethical debates incluem…
          en: In pediatric experimental therapies, ethical debates include…
        choices:
          - Assent vs consent, vulnerability, off-label, parental advocacy pressure (DMD Elevidys 2023)
          - Adult-style fully informed consent applied without modification across all age groups
          - Cost containment alone, with bioethics deferred to insurance and payer-side review boards
          - Industrial sponsorship transparency only, with no Subpart D pediatric-specific safeguards
        correctAnswer: Assent vs consent, vulnerability, off-label, parental advocacy pressure (DMD Elevidys 2023)
        rationale:
          pt: 'Pediatric: 21 CFR 50 Subpart D. Assent (child) + consent (parent). Subpart D categories: minimal risk vs prospect direct benefit. Elevidys 2023: FDA approved despite Phase 3 failure, pressure parent groups, scientific debate. Sarepta DMD ASOs similar pattern. Trent Stephens "no greater stakeholders than parents". Balance autonomy + protection.'
          en: 'Pediatric: 21 CFR 50 Subpart D. Assent (child) + consent (parent). Subpart D categories: minimal risk vs prospect of direct benefit. Elevidys 2023: FDA approved despite Phase 3 failure, parent group pressure, scientific debate. Sarepta DMD ASOs similar pattern. Trent Stephens "no greater stakeholders than parents". Autonomy + protection balance.'
        objectives: [Pediatric ethics]
      - type: choice
        difficulty: 5
        question:
          pt: Em Henrietta Lacks case (HeLa cells 1951), recent developments…
          en: In Henrietta Lacks case (HeLa cells 1951), recent developments…
        choices:
          - 2023 Thermo Fisher settled lawsuit family; HeLa Genome Data Access Working Group NIH 2013+
          - Johns Hopkins fully retracted HeLa cell line distribution from biorepositories in 2018
          - Family declined any legal action and no NIH genome-access committee has been established
          - HeLa line was withdrawn from research after a 2020 international Nagoya Protocol ruling
        correctAnswer: 2023 Thermo Fisher settled lawsuit family; HeLa Genome Data Access Working Group NIH 2013+
        rationale:
          pt: 'Henrietta Lacks (Hopkins 1951): cervical cancer cells without consent → HeLa, immortalized line revolutionou research. Family knew 1973. NIH 2013 HeLa Genome Data Access Working Group (family-led approval). Skloot Immortal Life book 2010. 2023: Thermo Fisher Scientific settled out-of-court Lacks family lawsuit. Lessons: informed consent, racial justice, biospecimen ethics.'
          en: 'Henrietta Lacks (Hopkins 1951): cervical cancer cells without consent → HeLa, immortalized line revolutionized research. Family knew 1973. NIH 2013 HeLa Genome Data Access Working Group (family-led approval). Skloot Immortal Life book 2010. 2023: Thermo Fisher Scientific settled lawsuit with Lacks family out-of-court. Lessons: informed consent, racial justice, biospecimen ethics.'
        objectives: [HeLa]
      - type: choice
        difficulty: 5
        question:
          pt: Em embryo ethics, "14-day rule" (1979 Warnock UK Committee) governs…
          en: In embryo ethics, "14-day rule" (1979 Warnock UK Committee) governs…
        choices:
          - In vitro embryo culture limit (primitive streak); ISSCR 2021 case-by-case extension
          - 7-day pre-implantation cleavage stage limit aligned with blastocyst transfer practice
          - 28-day organogenesis cutoff covering neural tube closure under WHO frameworks
          - Indefinite culture allowed provided IRB approval, with no chronological time threshold
        correctAnswer: In vitro embryo culture limit (primitive streak); ISSCR 2021 case-by-case extension
        rationale:
          pt: 'Mary Warnock UK Committee 1984: 14 dias (gastrulation primitive streak, cease individuation). Adopted globally. Until 2016 technically infeasible. Now: extended cultures Shahbazi/Zernicka-Goetz 2016. ISSCR 2021: case-by-case oversight beyond 14 days; not absolute. Blastoids (Rivron 2018) e embryo models challenge definition. Active debate.'
          en: 'Mary Warnock UK Committee 1984: 14 days (gastrulation primitive streak, cease individuation). Adopted globally. Until 2016 technically infeasible. Now: extended cultures Shahbazi/Zernicka-Goetz 2016. ISSCR 2021: case-by-case oversight beyond 14 days; not absolute. Blastoids (Rivron 2018) and embryo models challenge definition. Active debate.'
        objectives: [14-day rule]
      - type: choice
        difficulty: 5
        question:
          pt: Em IVG (in vitro gametogenesis), ethical concerns include…
          en: In IVG (in vitro gametogenesis), ethical concerns include…
        choices:
          - '"Cherry-picking" embryos (Greely "End of Sex"), same-sex reproduction, post-menopause, eugenics'
          - 'Mitochondrial transfer concerns alone (UK three-parent IVF), with no gametogenesis link'
          - 'Pure cytoplasmic donation issues without germline modification or selection implications'
          - 'Adult somatic reprogramming risks only, restricted to non-reproductive tissue applications'
        correctAnswer: '"Cherry-picking" embryos (Greely "End of Sex"), same-sex reproduction, post-menopause, eugenics'
        rationale:
          pt: 'Hayashi mouse IVG 2016, 2023 (XY → oocytes). Human ~5-10y away. Bioethics: dramatic expansion reproductive options. Solo or same-sex parents. Post-menopausal. Mass embryo production + PGT-P (polygenic selection): "designer babies"? Hank Greely (Stanford) "The End of Sex and the Future of Human Reproduction" 2016. Regulatory frameworks immature.'
          en: 'Hayashi mouse IVG 2016, 2023 (XY → oocytes). Human ~5-10y away. Bioethics: dramatic reproductive option expansion. Solo or same-sex parents. Post-menopausal. Mass embryo production + PGT-P (polygenic selection): "designer babies"? Hank Greely (Stanford) "The End of Sex and the Future of Human Reproduction" 2016. Immature regulatory frameworks.'
        objectives: [IVG ethics]
      - type: choice
        difficulty: 5
        question:
          pt: Em xenotransplantation (Bennett 2022 pig heart), bioethics issues…
          en: In xenotransplantation (Bennett 2022 pig heart), bioethics issues…
        choices:
          - Compassionate use vs trial, animal welfare, zoonosis surveillance, consent
          - Donor-allocation fairness alone, with animal welfare and zoonosis considered fully resolved
          - Cost-effectiveness debate only, deferring informed consent and PERV monitoring to industry
          - IP licensing of pig genome edits as the central ethical issue ahead of patient safeguards
        correctAnswer: Compassionate use vs trial, animal welfare, zoonosis surveillance, consent
        rationale:
          pt: 'Bennett FDA eIND 2022 (compassionate use). Subsequent Slayman, Pisano, Looney similar pathway. Now FDA accepting formal Phase 1 trials (eGenesis, United Therapeutics 2024). Bioethics: animal welfare (10+ pig modifications), zoonosis monitoring (latent CMV), informed consent dying patient (true voluntary?). Bennett: prior parole violation prompted ethical debate "second-class life".'
          en: 'Bennett FDA eIND 2022 (compassionate use). Subsequent Slayman, Pisano, Looney same pathway. Now FDA accepting formal Phase 1 trials (eGenesis, United Therapeutics 2024). Bioethics: animal welfare (10+ pig modifications), zoonosis monitoring (latent CMV), informed consent dying patient (truly voluntary?). Bennett: prior parole violation prompted ethical debate over "second-class life".'
        objectives: [Xeno ethics]
