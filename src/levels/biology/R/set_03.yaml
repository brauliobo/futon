        correctAnswer: Subparts B (pregnant), C (prisoners), D (children) + 21 CFR 50; CIOMS para LMIC
        rationale:
          pt: 'Common Rule 45 CFR 46. Subpart B (pregnant women, fetuses), C (prisoners — Stanford prison-like restrictions), D (children — Subpart D). 21 CFR 50 FDA. Beyond consent: ensuring fairness, no exploitation. CIOMS guidelines (2016) international: post-trial benefits, capacity building, community engagement. Tuskegee, Guatemala syphilis (1946-48 disclosed 2010): historical lessons.'
          en: 'Common Rule 45 CFR 46. Subpart B (pregnant women, fetuses), C (prisoners — Stanford prison-like restrictions), D (children — Subpart D). 21 CFR 50 FDA. Beyond consent: ensuring fairness, no exploitation. CIOMS guidelines (2016) international: post-trial benefits, capacity building, community engagement. Tuskegee, Guatemala syphilis (1946-48 disclosed 2010): historical lessons.'
