          en: In chimera ethics (human-animal), bioethics frameworks consider…
        choices:
          - NIH 2015 funding moratorium; ISSCR 14-day, no human cells in animal nervous system limit
          - Apenas trivial
          - Sem qualquer regulação
          - Apenas em US
        correctAnswer: NIH 2015 funding moratorium; ISSCR 14-day, no human cells in animal nervous system limit
        rationale:
          pt: 'Human-animal chimeras: human cells in animal embryo for organ generation (Belmonte/Salk pancreas pigs). NIH moratorium 2015 (sob debate). 2024 NIH formal policy preserves moratorium. ISSCR: limit human cells contribuição cerebral em mature animals. Belmonte 2022 Cell: monkey-human embryo chimera 19 days controversy. Reach for transplantable organs.'
          en: 'Human-animal chimeras: human cells in animal embryos for organ generation (Belmonte/Salk pig pancreas). NIH moratorium 2015 (under debate). 2024 NIH formal policy preserves moratorium. ISSCR: limits human cell contribution to mature animal brains. Belmonte 2022 Cell: 19-day monkey-human embryo chimera controversy. Reach for transplantable organs.'
        objectives: [Chimera ethics]
