          - Sem qualquer issue
          - Apenas em pediatric
        correctAnswer: Lacks thalamus, hierarchy, sensorial input — conscious experience unlikely; ISSCR 2021 oversight
        rationale:
          pt: 'DishBrain Cortical Labs 2022 played Pong via free energy principle. Brain organoids growing complexity, vascularization, transplantation rat brain (Paşca 2022). Hartung "Organoid Intelligence" roadmap 2023. ISSCR 2021: case-by-case for potential consciousness. Crítica: organoids lack thalamus, hierarchical cortex, mielination, sensory input — substrates for integrated experience missing. Precautionary approach prudent.'
          en: 'DishBrain Cortical Labs 2022 played Pong via free energy principle. Brain organoids growing complexity, vascularization, rat brain transplantation (Paşca 2022). Hartung "Organoid Intelligence" 2023 roadmap. ISSCR 2021: case-by-case for potential consciousness. Critique: organoids lack thalamus, hierarchical cortex, myelination, sensory input — substrates for integrated experience missing. Precautionary approach prudent.'
