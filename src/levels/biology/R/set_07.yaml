title:
  pt: Medicina da Dor e Crise Opioide
  en: Pain Medicine and Opioid Crisis
level: R
subject: biology
objectives:
  - Compreender chronic pain mechanisms
  - Reconhecer NaV1.8 inhibitor VX-548
  - Identificar non-opioid alternatives
  - Avaliar opioid crisis response
difficulty: 5
authorNotes: |
  Pain medicine. Chronic pain ~50M Americans (CDC). NIH HEAL Initiative 2018. Opioid crisis
  ~107k overdose deaths 2023. NaV1.8 sodium channel inhibitor: VX-548 suzetrigine FDA jan/2025.
  Calcitonin Gene-Related Peptide (CGRP): rimegepant migraine. Non-opioid: gabapentinoids,
  duloxetine, ketamine. PFDD pain. CDC opioid 2022 update. ACPA, USPSTF.
example:
  question:
    pt: VX-548 (suzetrigine, Vertex jan/2025) é primeiro non-opioid pain drug em décadas, atuando via…
    en: VX-548 (suzetrigine, Vertex Jan 2025) is first non-opioid pain drug in decades, acting via…
  choices:
    - NaV1.8 sodium channel selective inhibitor (peripheral DRG); approved acute moderate-severe pain
    - Apenas opioid
    - Sem qualquer aprovação
    - Apenas em pediatric
  correctAnswer: NaV1.8 sodium channel selective inhibitor (peripheral DRG); approved acute moderate-severe pain
  rationale:
    pt: 'Suzetrigine (Journavx, Vertex VX-548): NaV1.8 selective. Phase 3 trials post-bunionectomy + abdominoplasty pain: non-inferior to opioid (hydrocodone/APAP) sem opioid AEs. FDA jan/2025 acute pain. Mecanismo: NaV1.8 expressed em peripheral nociceptors DRG only — central side effects avoided. Vertex pipeline broader pain indications. Marco fundador era pós-opioid.'
    en: 'Suzetrigine (Journavx, Vertex VX-548): NaV1.8 selective. Phase 3 trials post-bunionectomy + abdominoplasty pain: non-inferior to opioid (hydrocodone/APAP) without opioid AEs. FDA Jan 2025 acute pain. Mechanism: NaV1.8 expressed only in peripheral DRG nociceptors — central side effects avoided. Vertex broader pain pipeline. Founding milestone of post-opioid era.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Mecanismos e fármacos
      en: Page 1 — Mechanisms and drugs
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em chronic pain mechanism, "central sensitization" refere-se a…
          en: In chronic pain mechanism, "central sensitization" refers to…
        choices:
          - Spinal cord/CNS hyperexcitability via NMDA, glia, microglia ativadas — fibromyalgia hallmark
          - Apenas peripheral
          - Sem qualquer mecanismo
          - Apenas em pediatric
        correctAnswer: Spinal cord/CNS hyperexcitability via NMDA, glia, microglia ativadas — fibromyalgia hallmark
        rationale:
          pt: 'Central sensitization (Woolf 1983+): chronic pain = nervous system pathology, not just nociceptor input. Mecanismos: NMDA windup, glial activation (microglia, astrocytes), descending modulation impairment. Fibromyalgia paradigm. Targets: ketamine (NMDA), gabapentinoids (α2δ subunit Ca++ channels), SNRI (descending). Modern pain understanding.'
          en: 'Central sensitization (Woolf 1983+): chronic pain = nervous system pathology, not just nociceptor input. Mechanisms: NMDA windup, glial activation (microglia, astrocytes), impaired descending modulation. Fibromyalgia paradigm. Targets: ketamine (NMDA), gabapentinoids (α2δ Ca++ channel subunit), SNRIs (descending). Modern pain understanding.'
        objectives: [Central sensitization]
      - type: choice
        difficulty: 5
        question:
          pt: Em opioid crisis US 2023, primary cause of overdose deaths é…
          en: In US opioid crisis 2023, primary overdose cause is…
        choices:
          - Synthetic opioids (fentanyl analogs); ~75k of ~107k total overdose 2023
          - Apenas heroin
          - Sem qualquer impacto
          - Apenas histórico
        correctAnswer: Synthetic opioids (fentanyl analogs); ~75k of ~107k total overdose 2023
        rationale:
          pt: 'CDC NCHS: 107.5k overdose deaths 2023 (~80k 2024 preliminary slight decline). Synthetic opioids (fentanyl, carfentanil, nitazenes) ~75k. Stimulants (cocaine, methamphetamine) co-involvement crescente. Primarily illicit street fentanyl (vs Rx opioids). Triplicated 2014-2023. Naloxone OTC mar/2023. Harm reduction. Methadone deregulation. ARPA-H invest.'
          en: 'CDC NCHS: 107.5k overdose deaths 2023 (~80k 2024 preliminary slight decline). Synthetic opioids (fentanyl, carfentanil, nitazenes) ~75k. Increasing stimulant (cocaine, methamphetamine) co-involvement. Primarily illicit street fentanyl (vs Rx opioids). Tripled 2014-2023. Naloxone OTC Mar 2023. Harm reduction. Methadone deregulation. ARPA-H investment.'
        objectives: [Opioid crisis]
      - type: choice
        difficulty: 5
        question:
          pt: CGRP antagonists (rimegepant, ubrogepant, atogepant) são…
          en: CGRP antagonists (rimegepant, ubrogepant, atogepant) are…
        choices:
          - Migraine prevention + acute treatment; gepants, mAbs (erenumab, fremanezumab, galcanezumab)
          - Apenas opioid
          - Sem qualquer aprovação
          - Apenas em pediatric
        correctAnswer: Migraine prevention + acute treatment; gepants, mAbs (erenumab, fremanezumab, galcanezumab)
        rationale:
          pt: 'CGRP (Calcitonin Gene-Related Peptide) era migraine: sensitizes trigeminovascular system. mAbs (Aimovig erenumab Amgen 2018, Ajovy fremanezumab Teva, Emgality galcanezumab Lilly): preventive monthly/quarterly SC. Gepants oral (rimegepant Nurtec, ubrogepant Ubrelvy, atogepant Qulipta): acute + preventive. Non-vasoconstrictor (vs triptans). Game-changers chronic migraine.'
          en: 'CGRP (Calcitonin Gene-Related Peptide) migraine era: sensitizes trigeminovascular system. mAbs (Aimovig erenumab Amgen 2018, Ajovy fremanezumab Teva, Emgality galcanezumab Lilly): monthly/quarterly SC preventive. Oral gepants (rimegepant Nurtec, ubrogepant Ubrelvy, atogepant Qulipta): acute + preventive. Non-vasoconstrictor (vs triptans). Chronic migraine game-changers.'
        objectives: [CGRP]
      - type: choice
        difficulty: 5
        question:
          pt: Em interventional pain, Spinal Cord Stimulation (SCS) progressed via…
          en: In interventional pain, Spinal Cord Stimulation (SCS) progressed via…
        choices:
          - High-frequency 10kHz (Nevro Senza), burst (Abbott Burst-DR), DRG (Abbott Proclaim), closed-loop (Saluda Evoke)
          - Apenas TENS
          - Sem qualquer evolução
          - Apenas histórico
        correctAnswer: High-frequency 10kHz (Nevro Senza), burst (Abbott Burst-DR), DRG (Abbott Proclaim), closed-loop (Saluda Evoke)
        rationale:
          pt: 'SCS evolved beyond traditional tonic stim: Nevro Senza HF10 (10kHz, paresthesia-free, FDA 2015) FBSS, painful diabetic neuropathy. Boston Scientific Spectra. Abbott BurstDR. DRG-S (Abbott Proclaim) Selecta. Closed-loop (Saluda Evoke 2022 FDA): ECAP feedback. Outcomes 50%+ pain reduction in selected patients. PROCESS, SENZA-RCT. Migration to pre-trial procedures.'
          en: 'SCS evolved beyond traditional tonic stim: Nevro Senza HF10 (10kHz, paresthesia-free, FDA 2015) FBSS, painful diabetic neuropathy. Boston Scientific Spectra. Abbott BurstDR. DRG-S (Abbott Proclaim) Selecta. Closed-loop (Saluda Evoke 2022 FDA): ECAP feedback. Outcomes 50%+ pain reduction in selected patients. PROCESS, SENZA-RCT. Migration to pre-trial procedures.'
        objectives: [SCS]
      - type: choice
        difficulty: 5
        question:
          pt: Em fibromyalgia, FDA-approved drugs include…
          en: In fibromyalgia, FDA-approved drugs include…
        choices:
          - Pregabalin (Lyrica 2007), duloxetine (Cymbalta 2008), milnacipran (Savella 2009)
          - Apenas opioid
          - Sem qualquer aprovação
          - Apenas em pediatric
        correctAnswer: Pregabalin (Lyrica 2007), duloxetine (Cymbalta 2008), milnacipran (Savella 2009)
        rationale:
          pt: 'Fibromyalgia: ~3-6% adults. Daniel Clauw (Michigan) "centralized pain" model. FDA approved 3 drugs: pregabalin (α2δ Ca++ channel), duloxetine + milnacipran (SNRI). Non-pharmacologic: aerobic exercise, CBT, sleep hygiene critical. Avoid opioids (limited efficacy, harm). Tirzepatide trial 2024 promising. PFDD voice strong.'
          en: 'Fibromyalgia: ~3-6% adults. Daniel Clauw (Michigan) "centralized pain" model. FDA approved 3 drugs: pregabalin (α2δ Ca++ channel), duloxetine + milnacipran (SNRI). Non-pharmacologic: aerobic exercise, CBT, sleep hygiene critical. Avoid opioids (limited efficacy, harm). 2024 tirzepatide trial promising. Strong PFDD voice.'
        objectives: [Fibromyalgia drugs]
      - type: choice
        difficulty: 5
        question:
          pt: Em "Choosing Wisely Pain", recommendations include…
          en: In "Choosing Wisely Pain", recommendations include…
        choices:
          - Avoid imaging acute LBP first 6 weeks; avoid opioid em chronic LBP first-line
          - Sempre image
          - Sem qualquer recommendation
          - Apenas em US
        correctAnswer: Avoid imaging acute LBP first 6 weeks; avoid opioid em chronic LBP first-line
        rationale:
          pt: 'Chiropractic, AAPM, ASA recommendations: low-value. Acute LBP without red flags: NSAIDs/exercise > imaging (incidentaloma). Chronic LBP: physical therapy, CBT, exercise > opioids (CDC 2016, 2022 reaffirmed). Yoga, mindfulness evidence-based. ACP 2017 LBP guidelines. STarT Back tool stratification.'
          en: 'Chiropractic, AAPM, ASA recommendations: low-value. Acute LBP without red flags: NSAIDs/exercise > imaging (incidentaloma). Chronic LBP: physical therapy, CBT, exercise > opioids (CDC 2016, 2022 reaffirmed). Yoga, mindfulness evidence-based. ACP 2017 LBP guidelines. STarT Back tool stratification.'
        objectives: [Choosing Wisely pain]
      - type: choice
        difficulty: 5
        question:
          pt: Em hospice/palliative pain, methadone advantages…
          en: In hospice/palliative pain, methadone advantages…
        choices:
          - Long t½, NMDA antagonism, neuropathic pain efficacy, low cost; QTc + drug interactions
          - Apenas trivial
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Long t½, NMDA antagonism, neuropathic pain efficacy, low cost; QTc + drug interactions
        rationale:
          pt: 'Methadone for pain (off-label OUD treatment): NMDA antagonist (vs central sensitization), longer t½ stable analgesia, neuropathic component, cheap, oral-IV equivalent. Disadvantages: QTc prolongation, complex pharmacology (long-acting), DDI (CYP3A4, CYP2B6). Specialized prescribing. Crítico em palliative care. McPherson handbook.'
          en: 'Methadone for pain (off-label OUD treatment): NMDA antagonist (vs central sensitization), longer t½ stable analgesia, neuropathic component, cheap, oral-IV equivalent. Disadvantages: QTc prolongation, complex pharmacology (long-acting), DDI (CYP3A4, CYP2B6). Specialized prescribing. Critical in palliative care. McPherson handbook.'
        objectives: [Methadone pain]
      - type: choice
        difficulty: 5
        question:
          pt: O AppliedVR RelieVRx (FDA 2021) DTx é para…
          en: AppliedVR RelieVRx (FDA 2021) DTx is for…
        choices:
          - Chronic low back pain via 8-week VR-based behavioral therapy
          - Apenas pediatric
          - Sem qualquer aprovação
          - Apenas em UK
        correctAnswer: Chronic low back pain via 8-week VR-based behavioral therapy
        rationale:
          pt: 'RelieVRx (AppliedVR FDA 2021 De Novo): VR + CBT + biofeedback + relaxation. 56-day program. RCT showed pain reduction. VA covering. Modelo de "pain is in the brain" + non-pharmacologic. AbbVie Acreta migraine VR. Limited adoption challenges (cost, hardware, evidence). Frontier intervention chronic pain.'
          en: 'RelieVRx (AppliedVR FDA 2021 De Novo): VR + CBT + biofeedback + relaxation. 56-day program. RCT showed pain reduction. VA covering. "Pain is in the brain" + non-pharmacologic model. AbbVie Acreta migraine VR. Limited adoption challenges (cost, hardware, evidence). Frontier intervention for chronic pain.'
        objectives: [RelieVRx]
      - type: choice
        difficulty: 5
        question:
          pt: Naloxone OTC (Narcan, mar/2023) é…
          en: Naloxone OTC (Narcan, Mar 2023) is…
        choices:
          - Primeiro opioid antagonist nasal spray approved direct-to-consumer pharmacy/grocery
          - Apenas Rx
          - Sem qualquer aprovação
          - Apenas em UK
        correctAnswer: Primeiro opioid antagonist nasal spray approved direct-to-consumer pharmacy/grocery
        rationale:
          pt: 'Narcan 4mg nasal spray (Emergent BioSolutions) FDA approved OTC mar/2023. Generic nyxoid 8mg also OTC mai/2023. ~$45-50 retail. Available para anyone (CVS, Walmart, Walgreens). Reverses opioid overdose. Distribution: Black market access slow ramping. State Medicaid programs cover. School + workplace stocking emerging. Critical harm reduction tool.'
          en: 'Narcan 4mg nasal spray (Emergent BioSolutions) FDA approved OTC Mar 2023. Generic nyxoid 8mg also OTC May 2023. ~$45-50 retail. Available to anyone (CVS, Walmart, Walgreens). Reverses opioid overdose. Distribution: black market access slowly ramping. State Medicaid programs cover. Emerging school + workplace stocking. Critical harm reduction tool.'
        objectives: [Naloxone OTC]
      - type: choice
        difficulty: 5
        question:
          pt: Em medical cannabis, evidence-base for chronic pain é…
          en: In medical cannabis, chronic pain evidence base is…
        choices:
          - Modest neuropathic pain effect (Cochrane); limited cancer, MS spasticity; significant heterogeneity
          - Sempre eficaz
          - Sem qualquer aplicação
          - Apenas histórica
        correctAnswer: Modest neuropathic pain effect (Cochrane); limited cancer, MS spasticity; significant heterogeneity
        rationale:
          pt: 'Medical cannabis: Sativex (nabiximols, GW Pharma) MS spasticity Canada/EU not US. Marinol (dronabinol THC) FDA chemo nausea + AIDS appetite. Cochrane reviews chronic pain: small effect, hetergeneous. NEJM, Lancet skeptical reviews. Federal Schedule I status US blocks robust trials. State MMJ programs ~38 states. Nabilone synthetic. CB1/CB2 modulators emerging.'
          en: 'Medical cannabis: Sativex (nabiximols, GW Pharma) MS spasticity Canada/EU not US. Marinol (dronabinol THC) FDA chemo nausea + AIDS appetite. Cochrane reviews on chronic pain: small effect, heterogeneous. NEJM, Lancet skeptical reviews. Federal Schedule I status in US blocks robust trials. State MMJ programs ~38 states. Synthetic nabilone. CB1/CB2 modulators emerging.'
        objectives: [Medical cannabis]
  - title:
      pt: Página 2 — Aplicações
      en: Page 2 — Applications
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em chronic pain assessment, "Functional Pain Score" emerging tools include…
          en: In chronic pain assessment, "Functional Pain Score" emerging tools include…
        choices:
          - PEG-3, NIH PROMIS, BPI, ACT — beyond NRS 0-10
          - Apenas NRS
          - Sem qualquer ferramenta
          - Apenas em US
        correctAnswer: PEG-3, NIH PROMIS, BPI, ACT — beyond NRS 0-10
        rationale:
          pt: 'PEG-3 (Pain Enjoyment General activity, 3 items VA): brief functional. PROMIS Pain Interference banks. Brief Pain Inventory (BPI) Cleeland. Activities Concept Tool (ACT). Move beyond simple "0-10" NRS para functional outcomes (returning to work, sleep, mood). Required IL Jersey Department Health 2024. PFDD-emphasis.'
          en: 'PEG-3 (Pain Enjoyment General activity, 3 items VA): brief functional. PROMIS Pain Interference banks. Brief Pain Inventory (BPI) Cleeland. Activities Concept Tool (ACT). Move beyond simple "0-10" NRS to functional outcomes (returning to work, sleep, mood). Required IL Jersey Department Health 2024. PFDD-emphasis.'
        objectives: [Pain assessment]
      - type: choice
        difficulty: 5
        question:
          pt: Em pediatric pain, ESPGHAN pediatric Concept includes…
          en: In pediatric pain, ESPGHAN pediatric concept includes…
        choices:
          - FLACC, Wong-Baker FACES, SUN tools age-appropriate; multimodal opioid-sparing strategies
          - Apenas adult tools
          - Sem qualquer estrutura
          - Apenas em pediatric
        correctAnswer: FLACC, Wong-Baker FACES, SUN tools age-appropriate; multimodal opioid-sparing strategies
        rationale:
          pt: 'Pediatric pain assessment: FLACC behavioral (preverbal), Wong-Baker FACES (3-7y), SUN (0-10 numeric 8+ y). Multimodal strategies: regional anesthesia, NSAIDs, gabapentinoids, ketamine PCA. Opioid-sparing reduce kids op-induced respiratory depression, NICU IV-NEC. Sucrose oral analgesia neonatal. NIH HEAL Pediatric programs.'
          en: 'Pediatric pain assessment: behavioral FLACC (preverbal), Wong-Baker FACES (3-7y), SUN (0-10 numeric 8+ y). Multimodal strategies: regional anesthesia, NSAIDs, gabapentinoids, ketamine PCA. Opioid-sparing reduces operative respiratory depression in kids, NICU IV-NEC. Neonatal oral sucrose analgesia. NIH HEAL Pediatric programs.'
        objectives: [Pediatric pain]
      - type: choice
        difficulty: 5
        question:
          pt: Em CRPS (Complex Regional Pain Syndrome), interventions include…
          en: In CRPS (Complex Regional Pain Syndrome), interventions include…
        choices:
          - Mirror therapy, sympathetic blocks, ketamine, SCS; early PT crítico
          - Apenas opioid
          - Sem qualquer treatment
          - Apenas pediatric
        correctAnswer: Mirror therapy, sympathetic blocks, ketamine, SCS; early PT crítico
        rationale:
          pt: 'CRPS Type I (no nerve injury) Type II (with). Intractable burning, allodynia, autonomic. Treatment: aggressive early PT (crítico), mirror therapy (Ramachandran), graded motor imagery. Sympathetic blocks (stellate ganglion). IV ketamine infusions. SCS DRG-S. Bisphosphonates trial. Refractory ~30%. Lifelong impact.'
          en: 'CRPS Type I (no nerve injury) Type II (with). Intractable burning, allodynia, autonomic. Treatment: aggressive early PT (critical), mirror therapy (Ramachandran), graded motor imagery. Sympathetic blocks (stellate ganglion). IV ketamine infusions. SCS DRG-S. Bisphosphonates trials. Refractory ~30%. Lifelong impact.'
        objectives: [CRPS]
      - type: choice
        difficulty: 5
        question:
          pt: O FDA Project Optimus (2022) afetou pain trials por…
          en: FDA Project Optimus (2022) affected pain trials by…
        choices:
          - Encouraging optimal dose-finding (não apenas MTD); applicable beyond oncology
          - Apenas oncology
          - Sem qualquer mudança
          - Apenas em US
        correctAnswer: Encouraging optimal dose-finding (não apenas MTD); applicable beyond oncology
        rationale:
          pt: Project Optimus oncology spillover pain medicine. Dose response curves emphasized over MTD para drug development. Nudges away maximize drug; toward minimize drug for max benefit/risk. Aplicável a opioid-sparing (lower doses + multimodal) strategies. CDC opioid 2022 guideline embraces.
          en: Project Optimus oncology spillover into pain medicine. Dose response curves emphasized over MTD for drug development. Nudges away from maximizing drug; toward minimizing drug for max benefit/risk. Applicable to opioid-sparing (lower doses + multimodal) strategies. CDC opioid 2022 guideline embraces.
        objectives: [Optimus pain]
      - type: choice
        difficulty: 5
        question:
          pt: Em chronic primary pain, ICD-11 introduces nova categoria…
          en: In chronic primary pain, ICD-11 introduces new category…
        choices:
          - '"Chronic primary pain" (fibromyalgia, IBS-pain, low back, headache) as own diagnostic entity'
          - Apenas histórica
          - Sem qualquer estrutura
          - Apenas em US
        correctAnswer: '"Chronic primary pain" (fibromyalgia, IBS-pain, low back, headache) as own diagnostic entity'
        rationale:
          pt: 'ICD-11 (WHO 2022 effective): Chronic Pain WHO Task Force (Treede 2019). MG30 chapter. Chronic primary pain = pain ≥3 months with significant distress/disability not better explained by another condition. Includes fibromyalgia, complex regional pain, primary headaches, primary visceral. Validate as disease itself, not just symptom. Improves coding, research, advocacy.'
          en: 'ICD-11 (WHO 2022 effective): Chronic Pain WHO Task Force (Treede 2019). MG30 chapter. Chronic primary pain = pain ≥3 months with significant distress/disability not better explained by another condition. Includes fibromyalgia, complex regional pain, primary headaches, primary visceral. Validates as disease itself, not just symptom. Improves coding, research, advocacy.'
        objectives: [ICD-11 chronic pain]
      - type: choice
        difficulty: 5
        question:
          pt: Em opioid risk assessment, ORT (Opioid Risk Tool) by Webster…
          en: In opioid risk assessment, ORT (Opioid Risk Tool) by Webster…
        choices:
          - 'Brief screening: family/personal SUD history, age, abuse — risk-stratify before prescribing'
          - Apenas teste laboratorial
          - Sem qualquer estrutura
          - Apenas em US
        correctAnswer: 'Brief screening: family/personal SUD history, age, abuse — risk-stratify before prescribing'
        rationale:
          pt: 'ORT (Webster 2005): 5-item screening prior chronic opioid prescribing. Family + personal SUD history, age 16-45, sexual abuse, psych. Low/medium/high risk stratification. SOAPP-R, COMM (current monitoring) complementary. PDMP (Prescription Drug Monitoring Program) state-level. Crucial em opioid stewardship. CDC 2016 + 2022 reaffirmed.'
          en: 'ORT (Webster 2005): 5-item screening prior to chronic opioid prescribing. Family + personal SUD history, age 16-45, sexual abuse, psych. Low/medium/high risk stratification. SOAPP-R, COMM (current monitoring) complementary. PDMP (Prescription Drug Monitoring Program) state-level. Crucial in opioid stewardship. CDC 2016 + 2022 reaffirmed.'
        objectives: [ORT]
      - type: choice
        difficulty: 5
        question:
          pt: Em sickle cell pain crisis, CDC 2024 guideline addressed…
          en: In sickle cell pain crisis, CDC 2024 guideline addressed…
        choices:
          - Stigma-driven undertreatment Black patients; appropriate opioid in acute SCD pain
          - Apenas opioid avoidance
          - Sem qualquer guidance
          - Apenas em pediatric
        correctAnswer: Stigma-driven undertreatment Black patients; appropriate opioid in acute SCD pain
        rationale:
          pt: 'SCD pain: acute vaso-occlusive crisis severe pain. CDC 2016 guideline misapplied → SCD undertreatment (~80% Black). 2022 update: SCD specifically excluded restrictions. ASH 2020 SCD Guidelines, NHLBI 2014: opioids appropriate. Casgevy/Lyfgenia 2023 curative (but $2-3M). Crizanlizumab anti-P-selectin 2019. Hydroxyurea standard. Equity issue.'
          en: 'SCD pain: acute vaso-occlusive crisis severe pain. CDC 2016 guideline misapplied → SCD undertreatment (~80% Black). 2022 update: SCD specifically excluded from restrictions. ASH 2020 SCD Guidelines, NHLBI 2014: opioids appropriate. Casgevy/Lyfgenia 2023 curative (but $2-3M). Crizanlizumab anti-P-selectin 2019. Hydroxyurea standard. Equity issue.'
        objectives: [SCD pain]
      - type: choice
        difficulty: 5
        question:
          pt: Em phantom limb pain (PLP), Ramachandran mirror therapy…
          en: In phantom limb pain (PLP), Ramachandran mirror therapy…
        choices:
          - Visual feedback intact limb mirror reflects amputated side, "fooling" brain reduces phantom pain
          - Apenas teórico
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Visual feedback intact limb mirror reflects amputated side, "fooling" brain reduces phantom pain
        rationale:
          pt: 'V.S. Ramachandran (UCSD) "Phantoms in the Brain" 1998: cortical reorganization underlies phantom pain. Mirror box: sees intact mirrored limb where amputated would be. Reduces pain ~50% in patients. Inspired graded motor imagery (Moseley) chronic pain neuroscience education. Current: VR replacing mirror. Targeted Muscle Reinnervation (TMR) preventive surgery.'
          en: 'V.S. Ramachandran (UCSD) "Phantoms in the Brain" 1998: cortical reorganization underlies phantom pain. Mirror box: sees intact mirrored limb where amputated would be. Reduces pain ~50% in patients. Inspired graded motor imagery (Moseley) chronic pain neuroscience education. Currently: VR replacing mirror. Targeted Muscle Reinnervation (TMR) preventive surgery.'
        objectives: [Mirror therapy]
      - type: choice
        difficulty: 5
        question:
          pt: NIH HEAL Initiative ($500M+/yr) focuses em…
          en: NIH HEAL Initiative ($500M+/yr) focuses on…
        choices:
          - Non-addictive pain therapies + opioid use disorder treatments; ~$2.5B 2018-2024
          - Apenas pesquisa básica
          - Sem qualquer programa
          - Apenas em US
        correctAnswer: Non-addictive pain therapies + opioid use disorder treatments; ~$2.5B 2018-2024
        rationale:
          pt: 'NIH HEAL (Helping End Addiction Long-term) 2018+: ~$500M/year. Focus: novel pain targets non-addictive (NaV1.7/1.8 emerging via VX-548), neuromodulation, prevention OUD, treatment improvement (buprenorphine access, methadone), pediatric considerations. Multi-IC participation (NINDS, NIDA, NCCIH, NHLBI). Cross-NIH largest program. Foundation translational drug development.'
          en: 'NIH HEAL (Helping End Addiction Long-term) 2018+: ~$500M/year. Focus: novel non-addictive pain targets (NaV1.7/1.8 emerging via VX-548), neuromodulation, OUD prevention, treatment improvement (buprenorphine access, methadone), pediatric considerations. Multi-IC participation (NINDS, NIDA, NCCIH, NHLBI). Largest cross-NIH program. Translational drug development foundation.'
        objectives: [NIH HEAL]
      - type: choice
        difficulty: 5
        question:
          pt: Future pain medicine includes…
          en: Future pain medicine includes…
        choices:
          - NaV1.7/1.8 selective inhibitors, peripheral CB receptor, AAV gene therapy, precision pain
          - Apenas opioid
          - Sem qualquer evolução
          - Apenas em US
        correctAnswer: NaV1.7/1.8 selective inhibitors, peripheral CB receptor, AAV gene therapy, precision pain
        rationale:
          pt: 'Pain pipeline post-VX-548: NaV1.7 selective (Vertex, AlnyLam), NaV1.8 next-gen, AAV gene therapy chronic pain (Coda Bio CBRX-100 dorsal root ganglion). Cannabinoid CB2 selective peripherally restricted (Vivo, Empyrean Pharm). Precision pain: PGx (CYP2D6 codeine), genetic tests opioid sensitivity. AI imaging + biomarker classifier emerging. Era pós-opioid renewing.'
          en: 'Pain pipeline post-VX-548: selective NaV1.7 (Vertex, AlnyLam), next-gen NaV1.8, AAV chronic pain gene therapy (Coda Bio CBRX-100 dorsal root ganglion). Peripherally restricted selective cannabinoid CB2 (Vivo, Empyrean Pharm). Precision pain: PGx (CYP2D6 codeine), genetic opioid sensitivity tests. Emerging AI imaging + biomarker classifier. Renewing post-opioid era.'
        objectives: [Future pain]
