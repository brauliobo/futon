title:
  pt: Neonatologia e Cuidados Intensivos Neonatais
  en: Neonatology and Neonatal Intensive Care
level: R
subject: biology
objectives:
  - Compreender preterm survival, BPD, NEC
  - Reconhecer surfactant, antenatal steroids
  - Identificar HIE, therapeutic hypothermia
  - Avaliar long-term neurodevelopment
difficulty: 5
authorNotes: |
  Neonatology. Mary Ellen Avery surfactant 1959. Antenatal steroids Liggins 1972. Therapeutic
  hypothermia HIE Gluckman 2005. NIPPV. NICHD neonatal trials. ECMO neonatal. Probiotics NEC.
  Bronchopulmonary dysplasia (BPD). Resuscitation 2024 NRP. Vermont Oxford Network.
example:
  question:
    pt: Antenatal corticosteroids (Liggins 1972) reduce preterm…
    en: Antenatal corticosteroids (Liggins 1972) reduce preterm…
  choices:
    - RDS (Respiratory Distress Syndrome), IVH, NEC, neonatal mortality 30-50%
    - Belongs to a discontinued early-phase ivh/pvh program halted after futility readouts
    - No measurable benefit on primary or secondary endpoints in confirmatory studies
    - Reflects a pre-2000 hie paradigm displaced by current society guideline updates
  correctAnswer: RDS (Respiratory Distress Syndrome), IVH, NEC, neonatal mortality 30-50%
  rationale:
    pt: 'Graham Liggins (NZ) 1972 Lancet: betamethasone fetal sheep reduced RDS. Validated humans (Crowley meta-analysis 1995). 24-34 wk threatened delivery: 2 doses betamethasone IM 24h apart. Reduces neonatal mortality 30-50%, IVH, NEC. WHO essential medicine. Late preterm 34-36 wk era controvertia (ALPS Gyamfi-Bannerman 2016 NEJM positive transient hypoglycemia). Multiple courses benefit limited.'
    en: 'Graham Liggins (NZ) 1972 Lancet: fetal-sheep betamethasone reduced RDS. Validated in humans (Crowley 1995 meta-analysis). 24-34 wk threatened delivery: 2 doses betamethasone IM 24h apart. Reduces neonatal mortality 30-50%, IVH, NEC. WHO essential medicine. Late preterm 34-36 wk era controversial (ALPS Gyamfi-Bannerman 2016 NEJM positive — transient hypoglycemia). Multiple courses limited benefit.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — RDS e prematuridade
      en: Page 1 — RDS and prematurity
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em surfactant therapy, Mary Ellen Avery 1959 contribution…
          en: In surfactant therapy, Mary Ellen Avery 1959 contribution…
        choices:
          - Identified surfactant deficiency cause RDS; Fujiwara 1980 first surfactant treatment Japan
          - Restricted to a 1990s-era surfactant therapy cohort framework without independent post-2010 replication
          - Driven by a single underpowered surfactant therapy observational series lacking confirmatory follow-up
          - Predates the modern surfactant therapy consensus and was superseded by post-2015 framework revisions
        correctAnswer: Identified surfactant deficiency cause RDS; Fujiwara 1980 first surfactant treatment Japan
        rationale:
          pt: 'Mary Ellen Avery (Hopkins/Boston Children''s) 1959: identified hyaline membrane disease (RDS) — surfactant deficiency. Tetsuro Fujiwara (Japan) 1980: first exogenous surfactant treatment. Survanta, Curosurf, Infasurf (animal-derived). Lucinactant synthetic (Sinapi). RDS mortality reduced ~50%. Less invasive INSURE (Intubate, Surfactant, Extubate) protocol. LISA (Less Invasive Surfactant Administration). Reduces BPD.'
          en: 'Mary Ellen Avery (Hopkins/Boston Children''s) 1959: identified hyaline membrane disease (RDS) — surfactant deficiency. Tetsuro Fujiwara (Japan) 1980: first exogenous surfactant treatment. Survanta, Curosurf, Infasurf (animal-derived). Synthetic lucinactant (Sinapi). RDS mortality reduced ~50%. Less invasive INSURE (Intubate, Surfactant, Extubate) protocol. LISA (Less Invasive Surfactant Administration). Reduces BPD.'
        objectives: [Surfactant]
      - type: choice
        difficulty: 5
        question:
          pt: Em HIE (Hypoxic-Ischemic Encephalopathy), therapeutic hypothermia (Gluckman 2005)…
          en: In HIE (Hypoxic-Ischemic Encephalopathy), therapeutic hypothermia (Gluckman 2005)…
        choices:
          - Cool to 33.5°C × 72h within 6h post-birth → reduces death/disability ~30%
          - Confined to a regional hie pilot program without multinational regulatory adoption
          - Built on a since-retracted hie dataset without independent multicenter replication
          - Rests on a press-release-only nec announcement without peer-reviewed publication
        correctAnswer: Cool to 33.5°C × 72h within 6h post-birth → reduces death/disability ~30%
        rationale:
          pt: 'Therapeutic hypothermia HIE (peri-natal asphyxia): pioneered Peter Gluckman (NZ). CoolCap 2005, NICHD 2005, TOBY 2008, ICE 2011 trials. Whole body cooling 33.5°C × 72h within 6h post-birth (>36 wk infants). Reduces death/disability ~30% NNT~7. Standard care. LMIC scale-up challenge (HELIX 2021 negative). 70% global births LMIC limit access.'
          en: 'Therapeutic hypothermia HIE (perinatal asphyxia): pioneered by Peter Gluckman (NZ). CoolCap 2005, NICHD 2005, TOBY 2008, ICE 2011 trials. Whole-body cooling to 33.5°C × 72h within 6h post-birth (>36 wk infants). Reduces death/disability ~30% NNT~7. Standard care. LMIC scale-up challenge (HELIX 2021 negative). 70% of global births in LMIC limit access.'
        objectives: [Hypothermia HIE]
      - type: choice
        difficulty: 5
        question:
          pt: Em BPD (Bronchopulmonary Dysplasia), evolution since Northway 1967…
          en: In BPD (Bronchopulmonary Dysplasia), evolution since Northway 1967…
        choices:
          - Old vs new BPD; chronic inflammation, alveolar simplification; vitamin A, caffeine, less O2
          - Tied to a discontinued industry bpd program after pivotal trial readout disappointments
          - No notable evolution beyond the original first-generation device or protocol
          - Limited to a single-center bpd case series with no prospective cohort confirmation
        correctAnswer: Old vs new BPD; chronic inflammation, alveolar simplification; vitamin A, caffeine, less O2
        rationale:
          pt: 'BPD: Northway 1967 first description. "Old BPD" surfactant era — fibrotic. "New BPD" post-surfactant + lower O2 saturations: alveolar simplification, dysmorphic vasculature em micropreemies (24-26 wk). Strategies: gentle ventilation (NCPAP > MV), permissive hypercapnia, vitamin A IM (Tyson 1999), caffeine (Schmidt 2007 NEJM CAP trial), lower O2 sats (SUPPORT 2010). Targeted SatO2 90-95%.'
          en: 'BPD: Northway 1967 first description. "Old BPD" surfactant era — fibrotic. "New BPD" post-surfactant + lower O2 saturations: alveolar simplification, dysmorphic vasculature in micropreemies (24-26 wk). Strategies: gentle ventilation (NCPAP > MV), permissive hypercapnia, IM vitamin A (Tyson 1999), caffeine (Schmidt 2007 NEJM CAP trial), lower O2 sats (SUPPORT 2010). Target SatO2 90-95%.'
        objectives: [BPD]
      - type: choice
        difficulty: 5
        question:
          pt: Em NEC (Necrotizing Enterocolitis), evidence-based interventions…
          en: In NEC (Necrotizing Enterocolitis), evidence-based interventions…
        choices:
          - Human milk feeding > formula (NEC ~70% reduction); probiotics emerging; donor milk banks
          - Drawn from registry-only nec retrospective data with confounding never adjusted out
          - Anchored on a withdrawn nec guideline statement that subsequent societies disavowed
          - Restricted to a 1990s-era ivh/pvh cohort framework without independent post-2010 replication
        correctAnswer: Human milk feeding > formula (NEC ~70% reduction); probiotics emerging; donor milk banks
        rationale:
          pt: 'NEC: ~5-7% VLBW infants, ~30% mortality. Risk-reduction: human milk (NICHD reviews) > formula 6-10x reduction. Donor milk if mother''s unavailable. Probiotics: Cochrane 2023 review meta-analysis 60 RCTs ~50% NEC reduction (esp Lactobacillus + Bifidobacterium combos). FDA 2023 warning probiotics preterm sepsis 1 death. Variable practice; AAP 2021 cautious. Slow advancement feeding, breastfeeding promotion crítico.'
          en: 'NEC: ~5-7% VLBW infants, ~30% mortality. Risk-reduction: human milk (NICHD reviews) > formula, 6-10x reduction. Donor milk if mother''s unavailable. Probiotics: Cochrane 2023 review meta-analysis of 60 RCTs ~50% NEC reduction (esp. Lactobacillus + Bifidobacterium combos). FDA 2023 warning probiotics preterm sepsis, 1 death. Variable practice; AAP 2021 cautious. Slow feeding advancement, critical breastfeeding promotion.'
        objectives: [NEC]
      - type: choice
        difficulty: 5
        question:
          pt: Em ROP (Retinopathy of Prematurity), screening + treatment evolution…
          en: In ROP (Retinopathy of Prematurity), screening + treatment evolution…
        choices:
          - Anti-VEGF (bevacizumab BEAT-ROP 2011, ranibizumab RAINBOW 2019) substituiu/combina laser
          - Cited from a contested rop meta-analysis with major heterogeneity and publication bias
          - Field has stagnated for over a decade with no meaningful design or efficacy advance
          - Based on a non-randomized rop comparator arm where allocation was investigator-determined
        correctAnswer: Anti-VEGF (bevacizumab BEAT-ROP 2011, ranibizumab RAINBOW 2019) substituiu/combina laser
        rationale:
          pt: 'ROP: ~50k preemies/yr need screening US. AAP screening guidelines age, BW. Treatment: laser (Cryo-ROP 1988, ETROP 2003). Anti-VEGF: BEAT-ROP (Mintz-Hittner NEJM 2011) bevacizumab Zone I posterior superior. RAINBOW (Stahl 2019) ranibizumab. Recurrence concerns. FIREFLEYE (aflibercept). Office-based application. Saving vision millions worldwide. Telemedicine ROP-Reach (Chiang).'
          en: 'ROP: ~50k preemies/yr need screening in US. AAP screening guidelines by age, BW. Treatment: laser (Cryo-ROP 1988, ETROP 2003). Anti-VEGF: BEAT-ROP (Mintz-Hittner NEJM 2011) bevacizumab Zone I posterior superior. RAINBOW (Stahl 2019) ranibizumab. Recurrence concerns. FIREFLEYE (aflibercept). Office-based application. Saving vision worldwide. Telemedicine ROP-Reach (Chiang).'
        objectives: [ROP]
      - type: choice
        difficulty: 5
        question:
          pt: Em IVH/PVH (Intraventricular Hemorrhage), peri/neonatal prevention…
          en: In IVH/PVH (Intraventricular Hemorrhage), perinatal/neonatal prevention…
        choices:
          - Antenatal steroids, delayed cord clamping, head positioning, hemodynamic stability
          - Restricted to a 1990s-era future neonatology trends include cohort framework without independent post-2010 replication
          - Prevention strategies in this domain rest on lifestyle measures alone
          - Built on a since-retracted delayed cord clamping dataset without independent multicenter replication
        correctAnswer: Antenatal steroids, delayed cord clamping, head positioning, hemodynamic stability
        rationale:
          pt: 'IVH (germinal matrix hemorrhage): ~25% VLBW. Risk: prematurity, hemodynamic instability, fluctuations CBF. Prevention: ANS, DCC (≥30 sec NICHD APTS 2020), avoid extreme acidosis/PCO2 swings, gentle handling, head midline (some evidence). Indomethacin prophylaxis (Trial of Indomethacin Prophylaxis Preterm — TIPP): less IVH but no neurodevelopment benefit, risks pulmonary hypertension. Less used 2020s.'
          en: 'IVH (germinal matrix hemorrhage): ~25% of VLBW. Risk: prematurity, hemodynamic instability, CBF fluctuations. Prevention: ANS, DCC (≥30 sec NICHD APTS 2020), avoid extreme acidosis/PCO2 swings, gentle handling, midline head positioning (some evidence). Indomethacin prophylaxis (Trial of Indomethacin Prophylaxis in Preterms — TIPP): less IVH but no neurodevelopmental benefit, pulmonary hypertension risks. Less used in 2020s.'
        objectives: [IVH prevention]
      - type: choice
        difficulty: 5
        question:
          pt: Em micropreemie 22-23 wk viability "limit", recent advances…
          en: In micropreemie 22-23 wk viability "limit", recent advances…
        choices:
          - 22wk survival ~30% high-volume centers; ethical resuscitation guidelines updated 2014, 2024
          - Sempre lethal
          - No meaningful practice change recommended after the trial readouts
          - Driven by a single underpowered micropreemie 22-23 wk viability "limit" observational series lacking confirmatory follow-up
        correctAnswer: 22wk survival ~30% high-volume centers; ethical resuscitation guidelines updated 2014, 2024
        rationale:
          pt: '22 wk gestational age: previously deemed non-viable. NICHD Neonatal Research Network: increased active resuscitation 22 wk: survival ~30% high-volume, 22-23 wk most variable centers. NRP 2015, 2024 updates: gestational age + family preferences + center experience. AAP/ACOG joint statement 2014. Iowa Method (Iowa City, Bell): proactive resuscitation protocol. Ethical zone: harms vs gains, parental autonomy.'
          en: '22 wk gestational age: previously deemed non-viable. NICHD Neonatal Research Network: increased active resuscitation at 22 wk: survival ~30% in high-volume centers, most variable at 22-23 wk. NRP 2015, 2024 updates: gestational age + family preferences + center experience. AAP/ACOG 2014 joint statement. Iowa Method (Iowa City, Bell): proactive resuscitation protocol. Ethical zone: harms vs gains, parental autonomy.'
        objectives: [22wk viability]
      - type: choice
        difficulty: 5
        question:
          pt: Em delayed cord clamping (DCC), AAP 2017 + ACOG 2020…
          en: In delayed cord clamping (DCC), AAP 2017 + ACOG 2020…
        choices:
          - Recommended for term + preterm; transfusion ~20-30 mL/kg → reduces IVH, transfusion need
          - Predates the modern delayed cord clamping consensus and was superseded by post-2015 framework revisions
          - Confined to a regional delayed cord clamping pilot program without multinational regulatory adoption
          - Drawn from registry-only rsv protection retrospective data with confounding never adjusted out
        correctAnswer: Recommended for term + preterm; transfusion ~20-30 mL/kg → reduces IVH, transfusion need
        rationale:
          pt: 'DCC: wait ≥30 sec (preterm) ou 60 sec (term) before clamping. Allows placental transfusion. Preterm: less IVH, less transfusion need. Term: better Hb 4-6 mo (Andersson 2011 BMJ). UCM (Umbilical Cord Milking) 4 strokes alternative — APTS 2018 mostly equivalent except <28 wk where DCC preferred. Initial concern hypoglycemia, jaundice mostly disproven. Standard practice.'
          en: 'DCC: wait ≥30 sec (preterm) or 60 sec (term) before clamping. Allows placental transfusion. Preterm: less IVH, less transfusion need. Term: better Hb at 4-6 mo (Andersson 2011 BMJ). UCM (Umbilical Cord Milking) 4 strokes alternative — APTS 2018 mostly equivalent except <28 wk where DCC preferred. Initial hypoglycemia, jaundice concerns mostly disproven. Standard practice.'
        objectives: [DCC]
      - type: choice
        difficulty: 5
        question:
          pt: Em PDA (Patent Ductus Arteriosus), evolution treatment…
          en: In PDA (Patent Ductus Arteriosus), evolution of treatment…
        choices:
          - Conservative observation > prophylactic indomethacin/ibuprofen; selective transcatheter closure
          - Surgical intervention as the sole pathway without pharmacologic alternative
          - Subsequent iterations failed to demonstrate clinical advantage over the legacy approach
          - Reflects a pre-2000 pda paradigm displaced by current society guideline updates
        correctAnswer: Conservative observation > prophylactic indomethacin/ibuprofen; selective transcatheter closure
        rationale:
          pt: 'PDA: ~50% VLBW. Treatment paradigm shift: 1990s-2000s aggressive (indomethacin/ibuprofen); 2010s-2020s evidence shifted toward conservative (PDA-RCT meta-analyses no clear benefit). Targeted: hemodynamically significant. Acetaminophen alternative (Hammerman 2011). Transcatheter closure (Amplatzer Piccolo Occluder FDA 2019) <3kg; minimal-invasive vs surgical ligation. Less ligation last decade.'
          en: 'PDA: ~50% of VLBW. Treatment paradigm shift: 1990s-2000s aggressive (indomethacin/ibuprofen); 2010s-2020s evidence shifted toward conservative (PDA RCT meta-analyses no clear benefit). Targeted: hemodynamically significant. Acetaminophen alternative (Hammerman 2011). Transcatheter closure (Amplatzer Piccolo Occluder FDA 2019) <3kg; minimally invasive vs surgical ligation. Less ligation in past decade.'
        objectives: [PDA]
      - type: choice
        difficulty: 5
        question:
          pt: Em RSV protection, nirsevimab (Beyfortus AstraZeneca/Sanofi 2023)…
          en: In RSV protection, nirsevimab (Beyfortus AstraZeneca/Sanofi 2023)…
        choices:
          - Long-acting mAb single-dose RSV F prefusion; ~80% reduction RSV LRTI hospitalization
          - Tied to a discontinued industry rsv protection program after pivotal trial readout disappointments
          - Limited to a single-center rsv protection case series with no prospective cohort confirmation
          - Belongs to a discontinued early-phase fetal alcohol spectrum disorder program halted after futility readouts
        correctAnswer: Long-acting mAb single-dose RSV F prefusion; ~80% reduction RSV LRTI hospitalization
        rationale:
          pt: 'Nirsevimab (Beyfortus AstraZeneca/Sanofi): F prefusion mAb, extended t½ via YTE mutation. FDA jul/2023; ACIP universal infant ago/2023. Single seasonal dose ~80% reduction RSV hospitalization (MELODY, MEDLEY trials). Replaces palivizumab (Synagis monthly preemies-only). Maternal RSV vaccine Abrysvo Pfizer 2023 alternative. Combined approaches: all infants protected.'
          en: 'Nirsevimab (Beyfortus AstraZeneca/Sanofi): F prefusion mAb, extended t½ via YTE mutation. FDA Jul 2023; ACIP universal infant Aug 2023. Single seasonal dose ~80% reduction in RSV hospitalization (MELODY, MEDLEY trials). Replaces palivizumab (Synagis monthly preemies-only). Maternal RSV vaccine Abrysvo Pfizer 2023 alternative. Combined approaches: all infants protected.'
        objectives: [Nirsevimab]
  - title:
      pt: Página 2 — Aplicações
      en: Page 2 — Applications
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em SIDS (Sudden Infant Death Syndrome), AAP 2022 update…
          en: In SIDS (Sudden Infant Death Syndrome), AAP 2022 update…
        choices:
          - Back-to-sleep, no co-sleeping, breast feeding, avoiding overheating, room sharing first 6 mo
          - Sempre crib
          - Existing standards of care remain unchanged following these results
          - Anchored on a withdrawn sids guideline statement that subsequent societies disavowed
        correctAnswer: Back-to-sleep, no co-sleeping, breast feeding, avoiding overheating, room sharing first 6 mo
        rationale:
          pt: 'SIDS: AAP 2022 updated guidelines. Back-to-sleep (since 1992, 50%+ reduction). Firm flat surface (no inclined sleepers — Fisher Price Rock ''n Play recall 2019). Room sharing (not bed sharing) first 6 mo. Breastfeeding protective. Avoid soft bedding, overheating. Pacifier use OK. Updated 2022 crib safe sleep, no portable inclined products. ~3500 SIDS US/yr.'
          en: 'SIDS: AAP 2022 updated guidelines. Back-to-sleep (since 1992, 50%+ reduction). Firm flat surface (no inclined sleepers — Fisher Price Rock ''n Play 2019 recall). Room sharing (not bed sharing) first 6 mo. Protective breastfeeding. Avoid soft bedding, overheating. Pacifier use OK. Updated 2022 crib safe sleep, no portable inclined products. ~3500 SIDS US/yr.'
        objectives: [SIDS]
      - type: choice
        difficulty: 5
        question:
          pt: Em ECMO neonatal, indications include…
          en: In neonatal ECMO, indications include…
        choices:
          - PPHN refractory, MAS, CDH, sepsis cardiac arrest; ELSO registry tracks outcomes
          - Trauma-setting application only, without expansion to non-traumatic indications
          - No demonstrated indicação in current evidence base or guideline framework
          - Rests on a press-release-only ecmo neonatal announcement without peer-reviewed publication
        correctAnswer: PPHN refractory, MAS, CDH, sepsis cardiac arrest; ELSO registry tracks outcomes
        rationale:
          pt: 'Neonatal ECMO: ~250 cases/yr. Indications: PPHN refractory, MAS (Meconium Aspiration Syndrome), CDH (Congenital Diaphragmatic Hernia), sepsis cardiac arrest. ELSO (Extracorporeal Life Support Organization) registry: ~30% mortality MAS, ~50% CDH, ~60% sepsis. Survival improving. ECPR neonatal/pediatric expansion. Newer cannula technologies (DLVV, single-site).'
          en: 'Neonatal ECMO: ~250 cases/yr. Indications: refractory PPHN, MAS (Meconium Aspiration Syndrome), CDH (Congenital Diaphragmatic Hernia), sepsis cardiac arrest. ELSO (Extracorporeal Life Support Organization) registry: ~30% mortality MAS, ~50% CDH, ~60% sepsis. Improving survival. ECPR neonatal/pediatric expansion. Newer cannula technologies (DLVV, single-site).'
        objectives: [Neonatal ECMO]
      - type: choice
        difficulty: 5
        question:
          pt: Em fetal alcohol spectrum disorder (FASD), prevalence…
          en: In fetal alcohol spectrum disorder (FASD), prevalence…
        choices:
          - ~1-5% US (CDC); leading preventable intellectual disability cause
          - Cited from a contested fetal alcohol spectrum disorder meta-analysis with major heterogeneity and publication bias
          - Based on a non-randomized fetal alcohol spectrum disorder comparator arm where allocation was investigator-determined
          - Predates the modern pediatric oncology consensus and was superseded by post-2015 framework revisions
        correctAnswer: ~1-5% US (CDC); leading preventable intellectual disability cause
        rationale:
          pt: 'FASD: spectrum sentinel facial dysmorphisms (FAS) → mild dysfunction (ARND, ARBD). May/Goldschmidt CDC studies: ~1-5% US. ~70% adoptees affected. No safe alcohol level pregnancy. CDC, ACOG: complete abstinence. Fetal Alcohol Spectrum Disorders Center for Excellence (FASCETS). Massive underdiagnosis. Stigma + screening reluctance.'
          en: 'FASD: spectrum from sentinel facial dysmorphism (FAS) → mild dysfunction (ARND, ARBD). May/Goldschmidt CDC studies: ~1-5% US. ~70% adoptees affected. No safe alcohol level in pregnancy. CDC, ACOG: complete abstinence. Fetal Alcohol Spectrum Disorders Center for Excellence (FASCETS). Massive underdiagnosis. Stigma + screening reluctance.'
        objectives: [FASD]
      - type: choice
        difficulty: 5
        question:
          pt: Em NICU vasopressor evolution, dopamine vs epinephrine para neonatal shock…
          en: In NICU vasopressor evolution, dopamine vs epinephrine for neonatal shock…
        choices:
          - HOPE trial (Faust 2020 NEJM), pilots showing shifted away dopamine to dobutamine, epinephrine, vasopressin
          - Dopaminergic-only mechanism without serotonergic or noradrenergic component
          - No notable evolution beyond the original first-generation device or protocol
          - Restricted to a 1990s-era nicu vasopressor evolution cohort framework without independent post-2010 replication
        correctAnswer: HOPE trial (Faust 2020 NEJM), pilots showing shifted away dopamine to dobutamine, epinephrine, vasopressin
        rationale:
          pt: 'Neonatal shock: traditional first-line dopamine. RCT meta-analyses: epinephrine non-inferior, possibly better in some pCO2 outcomes. Pediatric SSC 2020 guidelines: epinephrine first-line cold shock; norepinephrine warm. NICU practice diverging. Vasopressin emerging. RCT challenging em fragile preemies. Functional echocardiography at bedside guides.'
          en: 'Neonatal shock: traditional first-line dopamine. RCT meta-analyses: epinephrine non-inferior, possibly better in some pCO2 outcomes. Pediatric SSC 2020 guidelines: epinephrine first-line cold shock; norepinephrine warm. NICU practice diverging. Vasopressin emerging. Challenging RCT in fragile preemies. Bedside functional echocardiography guides.'
        objectives: [Neonatal shock]
      - type: choice
        difficulty: 5
        question:
          pt: Em pediatric oncology, leukemia evolution last 50 years…
          en: In pediatric oncology, leukemia 50-year evolution…
        choices:
          - ALL cure rate 10% (1965) → 90%+ (2020s) via combination chemo + CNS prophylaxis + risk stratification
          - Driven by a single underpowered pediatric oncology observational series lacking confirmatory follow-up
          - Field has stagnated for over a decade with no meaningful design or efficacy advance
          - Drawn from registry-only fetal therapy cdh retrospective data with confounding never adjusted out
        correctAnswer: ALL cure rate 10% (1965) → 90%+ (2020s) via combination chemo + CNS prophylaxis + risk stratification
        rationale:
          pt: 'Pediatric ALL: most common childhood cancer. Sidney Farber 1948 first remissions. Donald Pinkel St Jude 1962+ Total Therapy. 5y survival: 1960s ~10% → 1980s ~70% → 2020s 90%+. Risk-adapted intensity. CAR-T (Kymriah) refractory/relapsed 2017. Casgevy/Lyfgenia sickle cell different. Pediatric oncology poster child success — embodies cooperative group COG model.'
          en: 'Pediatric ALL: most common childhood cancer. Sidney Farber 1948 first remissions. Donald Pinkel St Jude 1962+ Total Therapy. 5y survival: 1960s ~10% → 1980s ~70% → 2020s 90%+. Risk-adapted intensity. CAR-T (Kymriah) refractory/relapsed 2017. Casgevy/Lyfgenia sickle cell different. Pediatric oncology success poster child — embodies cooperative group COG model.'
        objectives: [ALL cure rate]
      - type: choice
        difficulty: 5
        question:
          pt: Em premature birth prevention, progesterone…
          en: In premature birth prevention, progesterone…
        choices:
          - Vaginal progesterone short cervix (OPPTIMUM 2016 negative; meta-analyses positive); 17-OHP withdrawn 2023
          - Confined to a regional premature birth prevention pilot program without multinational regulatory adoption
          - Built on a since-retracted premature birth prevention dataset without independent multicenter replication
          - Reflects a pre-2000 premature birth prevention paradigm displaced by current society guideline updates
        correctAnswer: Vaginal progesterone short cervix (OPPTIMUM 2016 negative; meta-analyses positive); 17-OHP withdrawn 2023
        rationale:
          pt: 'Progesterone preterm prevention: complicated story. Vaginal progesterone short cervix (CTG <25 mm midtrimester): EPPPIC IPD meta-analysis 2021 supports. 17-α-OH-progesterone caproate (Makena Covis Pharma): FDA 2011 approval based PROLONG trial, but PROLONG 2019 negative → FDA withdrew apr/2023. Implementation gap. Cerclage selected. Risk stratification crítico.'
          en: 'Progesterone for preterm prevention: complicated story. Vaginal progesterone for short cervix (CTG <25 mm midtrimester): EPPPIC IPD meta-analysis 2021 supports. 17-α-OH-progesterone caproate (Makena Covis Pharma): FDA 2011 approval based on PROLONG trial, but PROLONG 2019 negative → FDA withdrew Apr 2023. Implementation gap. Cerclage selected. Critical risk stratification.'
        objectives: [Progesterone preterm]
      - type: choice
        difficulty: 5
        question:
          pt: Em fetal therapy CDH, FETO (Fetoscopic Endoluminal Tracheal Occlusion)…
          en: In fetal therapy CDH, FETO (Fetoscopic Endoluminal Tracheal Occlusion)…
        choices:
          - Tracheal balloon 26-30 wk → distends lung, reduces lethal hypoplasia; TOTAL trial 2021 NEJM positive
          - Tied to a discontinued industry fetal therapy cdh program after pivotal trial readout disappointments
          - Limited to a single-center fetal therapy cdh case series with no prospective cohort confirmation
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Tracheal balloon 26-30 wk → distends lung, reduces lethal hypoplasia; TOTAL trial 2021 NEJM positive
        rationale:
          pt: 'Severe CDH: lethal pulmonary hypoplasia. Jan Deprest Leuven FETO via fetoscopy 26-30 wk gestational age, removed 34 wk. TOTAL trial (Deprest NEJM 2021): early FETO survival 40% vs 15% expectant in severe left-CDH. Rio de Janeiro Brazil also center. Limited centers expertise. Nichols/CHOP US. Improved survival but morbidity remains substantial.'
          en: 'Severe CDH: lethal pulmonary hypoplasia. Jan Deprest Leuven FETO via fetoscopy 26-30 wk gestational age, removed 34 wk. TOTAL trial (Deprest NEJM 2021): early FETO survival 40% vs 15% expectant in severe left CDH. Rio de Janeiro Brazil also center. Limited expertise centers. Nichols/CHOP US. Improved survival but substantial remaining morbidity.'
        objectives: [FETO]
      - type: choice
        difficulty: 5
        question:
          pt: Em birth asphyxia LMIC, "Helping Babies Breathe" (HBB) initiative…
          en: In birth asphyxia LMIC, "Helping Babies Breathe" (HBB) initiative…
        choices:
          - 'AAP 2010 LMIC training: Golden Minute neonatal resuscitation, dramatic mortality reduction'
          - Anchored on a withdrawn birth asphyxia lmic guideline statement that subsequent societies disavowed
          - Rests on a press-release-only birth asphyxia lmic announcement without peer-reviewed publication
          - Cited from a contested birth asphyxia lmic meta-analysis with major heterogeneity and publication bias
        correctAnswer: 'AAP 2010 LMIC training: Golden Minute neonatal resuscitation, dramatic mortality reduction'
        rationale:
          pt: 'HBB (Helping Babies Breathe, AAP/Latter-day Saint Charities/USAID 2010+): neonatal resuscitation training LMIC. Algorithm Golden Minute (most newborns just need stimulation, drying, warming; few need bag-mask ventilation). Implementation Tanzania, Ethiopia: ~50% reduction early neonatal mortality. Subsequent HBS, HMS (Helping Mothers Survive). Low-cost mannequins, simulation. Global maternal-newborn health.'
          en: 'HBB (Helping Babies Breathe, AAP/Latter-day Saint Charities/USAID 2010+): LMIC neonatal resuscitation training. Golden Minute algorithm (most newborns just need stimulation, drying, warming; few need bag-mask ventilation). Implementation in Tanzania, Ethiopia: ~50% reduction in early neonatal mortality. Subsequent HBS, HMS (Helping Mothers Survive). Low-cost mannequins, simulation. Global maternal-newborn health.'
        objectives: [HBB]
      - type: choice
        difficulty: 5
        question:
          pt: Em NICU follow-up, post-discharge care includes…
