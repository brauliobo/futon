title:
  pt: Nível R — Revisão Cumulativa de Fronteiras Biomédicas
  en: Level R — Cumulative Review of Biomedical Frontiers
level: R
subject: biology
objectives:
  - Integrar gene therapies (Casgevy, Hemgenix, Roctavian, VX-880)
  - Integrar GLP-1/incretin era cardiometabolic
  - Integrar AI/wearable medicine
  - Integrar biosecurity, frontier ethics
difficulty: 5
authorNotes: |
  Cumulative review across all 19 sets. One question per major topic from sets 1-19.
  Tests integration of frontiers — gene therapy, GLP-1, AI, structural cardiology,
  biosecurity, sleep, pain, nutrition, dermatology, hematology, endocrinology.
example:
  question:
    pt: Considerando os múltiplos exemplos do nível R (Casgevy SCD/TDT, Hemgenix hemofilia B, Roctavian hemofilia A, VX-880 islet T1D, Luxturna RP), qual padrão emerge sobre gene/cell therapies modernas?
    en: Considering the multiple level-R examples (Casgevy SCD/TDT, Hemgenix hemophilia B, Roctavian hemophilia A, VX-880 islet T1D, Luxturna RP), what pattern emerges about modern gene/cell therapies?
  choices:
    - One-time/durable corrections to monogenic disease at high upfront cost ($2-3M+) with payment models, durability monitoring, and access barriers as central challenges
    - Theoretical constructs only with no current regulatory authorization
    - Provides permanent cure without need for any longitudinal follow-up registries
    - Indication strictly limited to pediatric oncology applications
  correctAnswer: One-time/durable corrections to monogenic disease at high upfront cost ($2-3M+) with payment models, durability monitoring, and access barriers as central challenges
  rationale:
    pt: 'Padrão gene/cell therapy 2020s: high upfront cost (Casgevy $2.2M, Lyfgenia $3.1M, Hemgenix $3.5M, Roctavian $2.9M, Skysona, Zolgensma $2.1M, Luxturna $850k) reflete one-time intent + manufacturing complexity + R&D + small populations. Innovative payment: outcomes-based contracts, annuity payments, value-based pricing. Real-world adoption muito menor que projeção (Hemgenix ~poucas dúzias 2023, Roctavian similar). Durability declining (Roctavian FVIII levels declinam). Access — especialmente LMIC — barreira massiva (SCD 75% global births sem diagnóstico). Manufacturing scaling, cost reduction, simplified protocols (in vivo CRISPR Verve VERVE-101) próxima fronteira.'
    en: 'Gene/cell therapy 2020s pattern: high upfront cost (Casgevy $2.2M, Lyfgenia $3.1M, Hemgenix $3.5M, Roctavian $2.9M, Skysona, Zolgensma $2.1M, Luxturna $850k) reflects one-time intent + manufacturing complexity + R&D + small populations. Innovative payment: outcomes-based contracts, annuity payments, value-based pricing. Real-world adoption far below projection (Hemgenix ~few dozens in 2023, Roctavian similar). Declining durability (Roctavian FVIII levels declining). Access — especially LMIC — massive barrier (SCD 75% global births without diagnosis). Manufacturing scaling, cost reduction, simplified protocols (in vivo CRISPR Verve VERVE-101) next frontier.'
