        choices:
          - In vivo CRISPR/base editing (Verve PCSK9, Intellia ATTR), AI medicine deployment, GLP-1 expansion (MASH/CKD/AUD/Alzheimer trials), psychedelic-assisted therapy, longevity geroscience
          - No further therapeutic advance anticipated across these biomedical frontiers
