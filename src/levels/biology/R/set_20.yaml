pages:
  - title:
      pt: Página 1 — Sets 1-10
      en: Page 1 — Sets 1-10
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Qual achievement biology inaugurou era gene-edited therapy aprovada FDA?
          en: Which biology achievement inaugurated the FDA-approved gene-edited therapy era?
        choices:
          - Casgevy (exa-cel CRISPR Vertex/CRISPR Therapeutics dez/2023) SCD + TDT — first CRISPR therapy ever approved
          - Restricted to a 1990s-era qual achievement biology inaugurou era cohort framework without independent post-2010 replication or guideline endorsement
          - Autologous stem-cell harvest and reinfusion without any genetic editing component
          - Once-daily oral aspirin for primary cardiovascular prevention
        correctAnswer: Casgevy (exa-cel CRISPR Vertex/CRISPR Therapeutics dez/2023) SCD + TDT — first CRISPR therapy ever approved
        rationale:
          pt: 'Casgevy histórico — disrupts BCL11A enhancer ex vivo HSCs → reactivates HbF → ameliora HbS polymerization. CLIMB-121/111 trials sustentado. Lyfgenia (lentiviral) aprovado mesmo dia 8 dez 2023. Set 17.'
          en: 'Casgevy historic — disrupts BCL11A enhancer in ex vivo HSCs → reactivates HbF → ameliorates HbS polymerization. CLIMB-121/111 trials sustained. Lyfgenia (lentiviral) approved same day Dec 8 2023. Set 17.'
        objectives: [Casgevy review]
      - type: choice
        difficulty: 5
        question:
          pt: Em microbioma terapêutico, primeira FDA-approved oral live biotherapeutic é…
          en: In therapeutic microbiome, the first FDA-approved oral live biotherapeutic is…
        choices:
          - Vowst (SER-109, Seres Therapeutics FDA abr/2023) for recurrent C difficile — purified Firmicutes spores oral capsules
          - Driven by a single underpowered microbioma terapêutico observational series lacking confirmatory follow-up across multicenter cohorts
          - Conventional fecal microbiota transplant via colonoscopy as the only delivery option
          - IV-only antibiotic regimen without microbiome-restoration component
        correctAnswer: Vowst (SER-109, Seres Therapeutics FDA abr/2023) for recurrent C difficile — purified Firmicutes spores oral capsules
        rationale:
          pt: 'Vowst (Seres) primeiro live biotherapeutic oral aprovado FDA. Antes Rebyota (Ferring 2022) rectal. ECOSPOR III pivotal trial recurrent CDI. Pacientes oral encapsulated ~50 species Firmicutes — engraftment restaura ecology pós-vanco. Set 1.'
          en: 'Vowst (Seres) first FDA-approved oral live biotherapeutic. Before that Rebyota (Ferring 2022) rectal. ECOSPOR III pivotal trial in recurrent CDI. Oral encapsulated ~50 Firmicutes species — engraftment restores ecology after vanco. Set 1.'
        objectives: [Vowst review]
      - type: choice
        difficulty: 5
        question:
          pt: Em era pós-He Jiankui (2018 anúncio CCR5 babies), governance global incluiu…
          en: Post He Jiankui era (2018 CCR5 babies announcement), global governance included…
        choices:
          - WHO/NAS reports moratorium clinical heritable germline editing; ARRIGE; ongoing somatic editing acceleration
          - International regulators have endorsed clinical germline editing for medical use
          - Predates the modern era pós-he jiankui consensus and was displaced by post-2015 society framework revisions and pivotal RCT readouts
          - Confined to a regional era pós-he jiankui pilot program without multinational regulatory adoption or cross-jurisdictional payer support
        correctAnswer: WHO/NAS reports moratorium clinical heritable germline editing; ARRIGE; ongoing somatic editing acceleration
        rationale:
          pt: 'He Jiankui (Southern University of Science and Technology Shenzhen): nasceu Lulu/Nana out/2018 anúncio nov/2018 — CCR5 edited via CRISPR/Cas9, indução off-target, consent ético violações. Sentenced 3 anos jail China. WHO Expert Advisory 2021 framework, NAS/UK Royal Society 2020 moratorium clinical germline. Cosmopolitan: somatic editing flouriu (Casgevy, Lyfgenia). Set 3.'
          en: 'He Jiankui (Southern University of Science and Technology Shenzhen): Lulu/Nana born Oct 2018, announced Nov 2018 — CCR5 edited via CRISPR/Cas9, off-target induction, ethical consent violations. Sentenced 3 yrs jail in China. WHO Expert Advisory 2021 framework, NAS/UK Royal Society 2020 moratorium on clinical germline. Cosmopolitan: somatic editing flourished (Casgevy, Lyfgenia). Set 3.'
        objectives: [He Jiankui review]
      - type: choice
        difficulty: 5
        question:
          pt: Em biosecurity, dual-use research of concern (DURC) é regulada por…
          en: In biosecurity, dual-use research of concern (DURC) is regulated by…
        choices:
          - HHS/NIH P3CO framework (Pathogens of Pandemic Potential), revised 2024; reviewed gain-of-function studies; institutional + funding-agency joint oversight
          - Industry self-regulation pathway without federal or international oversight
          - No regulatory oversight by NIH, HHS, or international biosafety bodies
          - Nuclear non-proliferation framework rather than biological dual-use governance
        correctAnswer: HHS/NIH P3CO framework (Pathogens of Pandemic Potential), revised 2024; reviewed gain-of-function studies; institutional + funding-agency joint oversight
        rationale:
          pt: 'DURC framework: NIH P3CO Pathogens of Pandemic Potential 2017 → revised 2024. NSABB recommendations 2023, OSTP policy. Wuhan COVID-origins debate amplificou attention. Asilomar 1975 historical model recombinant DNA. IGSC International Gene Synthesis Consortium screening DNA orders. EO 14110 AI biosecurity Biden 2023. IBBIS launched 2023 international screening cooperation. Set 4.'
          en: 'DURC framework: NIH P3CO Pathogens of Pandemic Potential 2017 → revised 2024. NSABB recommendations 2023, OSTP policy. Wuhan COVID-origins debate amplified attention. Asilomar 1975 historical model for recombinant DNA. IGSC International Gene Synthesis Consortium screening DNA orders. EO 14110 AI biosecurity Biden 2023. IBBIS launched 2023 international screening cooperation. Set 4.'
        objectives: [DURC review]
      - type: choice
        difficulty: 5
        question:
          pt: Em agricultural biotechnology, primeiro CRISPR-edited animal aprovação FDA enforcement discretion foi…
          en: In agricultural biotechnology, the first CRISPR-edited animal under FDA enforcement discretion was…
        choices:
          - PRLR-SLICK heat-tolerant cattle (Acceligen/Recombinetics mar/2022) — low-risk determination — faster path than transgenic AquAdvantage NADA approval
          - Built on a since-retracted agricultural biotechnology dataset without independent multicenter replication or peer-reviewed confirmatory publication
          - Categorical ban on all genetically modified organisms in food production
          - Reflects a pre-2000 agricultural biotechnology paradigm displaced by current society guideline updates and contemporary translational evidence
        correctAnswer: PRLR-SLICK heat-tolerant cattle (Acceligen/Recombinetics mar/2022) — low-risk determination — faster path than transgenic AquAdvantage NADA approval
        rationale:
          pt: 'PRLR-SLICK cattle: CRISPR knockin slick-coat allele (Senepol natural variant) → short hair, heat tolerance tropics. Acceligen FDA mar/2022 low-risk determination — não NADA approval. Contrast AquAdvantage salmon NADA approval 2015 (~20-yr review). Genus PIC PRRSV-resistant pigs (CD163 KO) FDA aprovou abr/2024. Set 5.'
          en: 'PRLR-SLICK cattle: CRISPR knockin slick-coat allele (Senepol natural variant) → short hair, heat tolerance in tropics. Acceligen FDA Mar 2022 low-risk determination — not NADA approval. Contrast AquAdvantage salmon NADA approval 2015 (~20-yr review). Genus PIC PRRSV-resistant pigs (CD163 KO) FDA approved Apr 2024. Set 5.'
        objectives: [SLICK cattle review]
      - type: choice
        difficulty: 5
        question:
          pt: Em sleep medicine, recent disease-modifying advance é…
          en: In sleep medicine, recent disease-modifying advance is…
        choices:
          - Dual orexin receptor antagonists (DORAs — suvorexant, lemborexant, daridorexant) for insomnia; orexin agonists Phase 3 for narcolepsy (TAK-861)
          - Tied to a discontinued industry sleep medicine program halted after pivotal trial readout disappointments and downstream futility analyses
          - No demonstrated farmacologia novel in current evidence base or guideline framework
          - Continuous positive airway pressure as the sole therapeutic option
        correctAnswer: Dual orexin receptor antagonists (DORAs — suvorexant, lemborexant, daridorexant) for insomnia; orexin agonists Phase 3 for narcolepsy (TAK-861)
        rationale:
          pt: 'DORAs: orexin/hypocretin signaling regulates wake. Suvorexant (Belsomra Merck 2014), lemborexant (Dayvigo Eisai 2019), daridorexant (Quviviq Idorsia 2022). Indicado insomnia adults — alternative benzodiazepines/Z-drugs (less dependence). Concurrent: orexin AGONISTS narcolepsy type 1 (Takeda TAK-861 Phase 3, Centessa, Alkermes). Reverse mecanismo. Set 6.'
          en: 'DORAs: orexin/hypocretin signaling regulates wake. Suvorexant (Belsomra Merck 2014), lemborexant (Dayvigo Eisai 2019), daridorexant (Quviviq Idorsia 2022). Indicated for insomnia in adults — alternative to benzodiazepines/Z-drugs (less dependence). Concurrent: orexin AGONISTS narcolepsy type 1 (Takeda TAK-861 Phase 3, Centessa, Alkermes). Reversed mechanism. Set 6.'
        objectives: [DORAs/orexin review]
      - type: choice
        difficulty: 5
        question:
          pt: Em pain medicine, novel non-opioid mechanism FDA aprovou jan/2025 com…
          en: In pain medicine, FDA approved Jan 2025 a novel non-opioid mechanism with…
        choices:
          - Suzetrigine (Journavx, Vertex) NaV1.8-selective sodium channel blocker for moderate-to-severe acute pain — first new mechanistic class in decades
          - Anchored on a single-center pain medicine case series with no prospective cohort confirmation or registry-level corroborating signal
          - Drawn from registry-only pain medicine retrospective data with residual confounding never adjusted out by sensitivity analyses
          - Functions as a sugar-pill placebo without any active pharmacologic mechanism
        correctAnswer: Suzetrigine (Journavx, Vertex) NaV1.8-selective sodium channel blocker for moderate-to-severe acute pain — first new mechanistic class in decades
        rationale:
          pt: 'Suzetrigine (VX-548): NaV1.8 selective inhibitor — peripheral nociceptor sodium channel. Phase 3 trials post-bunionectomy + abdominoplasty efficacy similar opioid combo sem side effects. FDA jan/2025 — primeira nova class mechanistic acute pain after décadas. Pivotal opioid crisis context (NIH HEAL initiative). Concurrent: CGRP gepants/mAbs migraine (rimegepant, atogepant, ubrogepant; erenumab, fremanezumab, galcanezumab, eptinezumab). Set 7.'
          en: 'Suzetrigine (VX-548): NaV1.8 selective inhibitor — peripheral nociceptor sodium channel. Phase 3 trials post-bunionectomy + abdominoplasty efficacy similar to opioid combo without side effects. FDA Jan 2025 — first new mechanistic class for acute pain in decades. Pivotal in opioid crisis context (NIH HEAL initiative). Concurrent: CGRP gepants/mAbs for migraine (rimegepant, atogepant, ubrogepant; erenumab, fremanezumab, galcanezumab, eptinezumab). Set 7.'
        objectives: [Suzetrigine review]
      - type: choice
        difficulty: 5
        question:
          pt: Em sports medicine + concussion, SCAT6 (Sport Concussion Assessment Tool) 2023 reflects…
          en: In sports medicine + concussion, SCAT6 (Sport Concussion Assessment Tool) 2023 reflects…
        choices:
          - Sixth iteration Concussion in Sport Group consensus (Amsterdam 2022); standardized sideline + clinic concussion assessment + return-to-play protocols
          - Backed by a withdrawn sports medicine + concussion guideline statement that subsequent specialty societies and federal agencies have disavowed
          - Recommends complete cessation of contact sport participation across all age groups
          - Único universal pediatric apenas
        correctAnswer: Sixth iteration Concussion in Sport Group consensus (Amsterdam 2022); standardized sideline + clinic concussion assessment + return-to-play protocols
        rationale:
          pt: 'CISG consensus statements: 1st Vienna 2001, expandido cada ~4 anos. Amsterdam 2022 (publicado Bjsm 2023) — SCAT6 (sideline) + Office SCOAT6 + Pediatric variants. Reconhece early controlled exercise melhora recovery (não rest absoluto). CTE epidemiology Boston Univ Bank 92% NFL pós-mortem. Youth concussion legislation all 50 states. Set 8.'
          en: 'CISG consensus statements: 1st Vienna 2001, expanded every ~4 yrs. Amsterdam 2022 (published BJSM 2023) — SCAT6 (sideline) + Office SCOAT6 + Pediatric variants. Recognizes early controlled exercise improves recovery (not absolute rest). CTE epidemiology Boston Univ Brain Bank 92% of NFL postmortem. Youth concussion legislation all 50 states. Set 8.'
        objectives: [SCAT6 review]
      - type: choice
        difficulty: 5
        question:
          pt: Em nutrition + obesity, transformative class pharmacotherapy 2021+ é…
          en: In nutrition + obesity, transformative pharmacotherapy class post-2021 is…
        choices:
          - GLP-1 receptor agonists (semaglutide, liraglutide) and dual GIP/GLP-1 (tirzepatide); STEP/SURMOUNT trials 15-22% weight loss
          - Rests on a press-release-only nutrition + obesity announcement without peer-reviewed publication or independent biostatistical review
          - Surgical intervention as the sole pathway without pharmacologic alternative
          - Cited from a contested nutrition + obesity meta-analysis with major heterogeneity, publication bias, and inconsistent outcome definitions
        correctAnswer: GLP-1 receptor agonists (semaglutide, liraglutide) and dual GIP/GLP-1 (tirzepatide); STEP/SURMOUNT trials 15-22% weight loss
        rationale:
          pt: 'GLP-1 + GIP/GLP-1 era: semaglutide Wegovy 15% (STEP-1 NEJM 2021), tirzepatide Zepbound 22% (SURMOUNT-1 NEJM 2022). Cardiometabolic expansão: SELECT (CV non-DM), FLOW (CKD), SURMOUNT-OSA (sleep apnea), STEP-HFpEF, MASH expectado. Era-defining like statins/SSRIs. Sets 9, 18.'
          en: 'GLP-1 + GIP/GLP-1 era: semaglutide Wegovy 15% (STEP-1 NEJM 2021), tirzepatide Zepbound 22% (SURMOUNT-1 NEJM 2022). Cardiometabolic expansion: SELECT (non-DM CV), FLOW (CKD), SURMOUNT-OSA (sleep apnea), STEP-HFpEF, MASH expected. Era-defining like statins/SSRIs. Sets 9, 18.'
        objectives: [GLP-1 review]
      - type: choice
        difficulty: 5
        question:
          pt: Em ophthalmology, primeiro FDA-approved gene therapy é…
          en: In ophthalmology, the first FDA-approved gene therapy is…
        choices:
          - Luxturna (voretigene neparvovec, Spark/Roche FDA dez/2017) RPE65 biallelic Leber congenital amaurosis 2 / RPE65 retinitis pigmentosa
          - Based on a non-randomized ophthalmology comparator arm where allocation was investigator-determined without intent-to-treat analysis
          - Cataract extraction and intraocular lens placement repurposed for retinal disease
          - Refractive LASIK surgery applied outside its standard refractive correction indication
        correctAnswer: Luxturna (voretigene neparvovec, Spark/Roche FDA dez/2017) RPE65 biallelic Leber congenital amaurosis 2 / RPE65 retinitis pigmentosa
        rationale:
          pt: 'Luxturna primeiro AAV2 gene therapy aprovada FDA US — RPE65 biallelic mutation IRD (LCA2 phenotype). Subretinal delivery. ~$850k both eyes. Pediatric/adult. Sucesso histórico — atrás décadas mais conservadores. Pipeline: USH2A (Editas/RegenxBio), CEP290 (Editas EDIT-101 Phase 1/2 BRILLIANCE), CHM choroideremia, X-linked RP RPGR. Optogenetics PIONEER (GS030 GenSight) — novel non-mutation-specific. Set 10.'
          en: 'Luxturna first AAV2 gene therapy approved by FDA US — RPE65 biallelic mutation IRD (LCA2 phenotype). Subretinal delivery. ~$850k both eyes. Pediatric/adult. Historic success — decades behind more conservative. Pipeline: USH2A (Editas/RegenxBio), CEP290 (Editas EDIT-101 Phase 1/2 BRILLIANCE), CHM choroideremia, X-linked RP RPGR. Optogenetics PIONEER (GS030 GenSight) — novel non-mutation-specific. Set 10.'
        objectives: [Luxturna review]
  - title:
      pt: Página 2 — Sets 11-19 + Integrative
      en: Page 2 — Sets 11-19 + Integrative
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em neonatology recent breakthrough, EXTEND artificial womb extracorporeal life support is for…
          en: In neonatology recent breakthrough, EXTEND artificial womb extracorporeal life support is for…
        choices:
          - Extreme prematurity (22-23 wk) — biobag + arterial-to-venous oxygenator simulating placenta; CHOP team Flake et al; FDA pre-IDE meeting 2023
          - Routine application to term newborns rather than extreme prematurity edge cases
          - No device-based intervention available beyond conventional NICU support
          - Adult ECMO only without pediatric or neonatal extracorporeal life support
        correctAnswer: Extreme prematurity (22-23 wk) — biobag + arterial-to-venous oxygenator simulating placenta; CHOP team Flake et al; FDA pre-IDE meeting 2023
        rationale:
          pt: 'EXTEND (Children Hospital Philadelphia, Flake/Partridge): biobag preserva fluid environment, umbilical access AV pumpless oxygenator simulating placenta. Lamb experiments 2017+ promising. FDA advisory committee 2023 considerou first-in-human. Apenas extremamente preterm 22-23 wks atual viability cliff — survive frequente com major morbidities (BPD, IVH, NEC, ROP). Reduce ex utero stress lung development. Ethics, gestational age criteria, comparator NICU complexos. Set 11.'
          en: 'EXTEND (Children Hospital Philadelphia, Flake/Partridge): biobag preserves fluid environment, umbilical access AV pumpless oxygenator simulating placenta. Lamb experiments 2017+ promising. FDA advisory committee 2023 considered first-in-human. Only for extremely preterm 22-23 wks at current viability cliff — survivors often have major morbidities (BPD, IVH, NEC, ROP). Reduce ex utero stress on lung development. Ethics, gestational age criteria, comparator NICU complex. Set 11.'
        objectives: [EXTEND review]
      - type: choice
        difficulty: 5
        question:
          pt: Em critical care sepsis, hour-1 bundle from Surviving Sepsis Campaign 2018+ inclui…
          en: In critical care sepsis, the hour-1 bundle from Surviving Sepsis Campaign 2018+ includes…
        choices:
          - Lactate, blood cultures pre-antibiotics, broad-spectrum antibiotics, ≥30 mL/kg crystalloid if hypotension/lactate ≥4, vasopressors for MAP ≥65
          - 24-hour observation window before any antibiotic or fluid resuscitation begins
          - Oral antibiotic therapy alone without IV access or fluid resuscitation
          - Sepsis management protocol that omits any crystalloid fluid resuscitation
        correctAnswer: Lactate, blood cultures pre-antibiotics, broad-spectrum antibiotics, ≥30 mL/kg crystalloid if hypotension/lactate ≥4, vasopressors for MAP ≥65
        rationale:
          pt: 'Hour-1 sepsis bundle (SSC 2018, reforçado 2021): consolidação 3-h e 6-h bundles previous. Lactate measurement, blood cultures pré-antibiotic, broad-spectrum antibiotics, IVF crystalloid ≥30 mL/kg se hypotension/lactate ≥4, vasopressors MAP ≥65 if persistent hypotension. CMS SEP-1 quality measure ainda baseado bundles. Persistent debates: 30 mL/kg fixed in CHF/CKD, optimal crystalloid (BaSICS/PLUS balanced vs saline equivalent), corticosteroids septic shock (ADRENAL/APROCCHSS variável evidence). Set 12.'
          en: 'Hour-1 sepsis bundle (SSC 2018, reinforced 2021): consolidation of previous 3-h and 6-h bundles. Lactate measurement, blood cultures pre-antibiotic, broad-spectrum antibiotics, IVF crystalloid ≥30 mL/kg if hypotension/lactate ≥4, vasopressors for MAP ≥65 if persistent hypotension. CMS SEP-1 quality measure still bundle-based. Persistent debates: 30 mL/kg fixed in CHF/CKD, optimal crystalloid (BaSICS/PLUS balanced vs saline equivalent), corticosteroids septic shock (ADRENAL/APROCCHSS variable evidence). Set 12.'
        objectives: [Hour-1 sepsis review]
      - type: choice
        difficulty: 5
        question:
          pt: Em surgical innovation, MitraClip + TAVR represent qual paradigm shift?
          en: In surgical innovation, MitraClip + TAVR represent which paradigm shift?
        choices:
          - Transcatheter alternative to open heart surgery for valve disease in high-risk and progressively all-risk populations
          - Cosmetic-only surgical applications without any structural or valve indication
          - Pediatric congenital heart surgery applications without adult valve indication
          - Recommends discontinuation of all open cardiac surgery in favor of percutaneous
        correctAnswer: Transcatheter alternative to open heart surgery for valve disease in high-risk and progressively all-risk populations
        rationale:
          pt: 'TAVR (transcatheter aortic valve replacement): Cribier 2002 → ~80% AVR cases hoje TAVR pós PARTNER 3 / Evolut Low Risk 2019 expansion. MitraClip TEER (Abbott FDA 2013): COAPT trial 2018 functional MR HFrEF. PASCAL alternative 2022. Tricuspid TEER TriClip 2024. Mitral transcatheter replacement Phase 3. Paradigm: shift estrutura cardíaca tratamento — minimally invasive options. Set 13.'
          en: 'TAVR (transcatheter aortic valve replacement): Cribier 2002 → ~80% AVR cases today are TAVR after PARTNER 3 / Evolut Low Risk 2019 expansion. MitraClip TEER (Abbott FDA 2013): COAPT trial 2018 functional MR HFrEF. PASCAL alternative 2022. Tricuspid TEER TriClip 2024. Mitral transcatheter replacement Phase 3. Paradigm: structural cardiac treatment shifted to minimally invasive options. Set 13.'
        objectives: [TAVR review]
      - type: choice
        difficulty: 5
        question:
          pt: Em anesthesia, agente que revolucionou neuromuscular blockade reversal é…
          en: In anesthesia, the agent that revolutionized neuromuscular blockade reversal is…
        choices:
          - Sugammadex (Bridion, Merck) — γ-cyclodextrin selectively binds rocuronium/vecuronium; rapid reliable reversal even deep blockade vs neostigmine
          - Inert comparator-arm formulation without therapeutic intent
          - Belongs to a discontinued early-phase anesthesia program halted after futility readouts and unfavorable safety signal review
          - Extrapolated from a small anesthesia pilot study without prespecified primary endpoints or central adjudication of outcomes
        correctAnswer: Sugammadex (Bridion, Merck) — γ-cyclodextrin selectively binds rocuronium/vecuronium; rapid reliable reversal even deep blockade vs neostigmine
        rationale:
          pt: 'Sugammadex: modified γ-cyclodextrin encapsula molécula rocuronium/vecuronium → rapid reversal incluindo deep blockade (PTC 1-2). FDA 2015 EU approval 2008. Vantagens vs neostigmine + glycopyrrolate: rapid, sem ceiling effect, less anticholinergic side effects, no PONV worsening, eligible deep blockade reversal. Caveat: sequester progestin-only contraceptives e estrogen contraceptives 7d advised additional method. Set 14.'
          en: 'Sugammadex: modified γ-cyclodextrin encapsulates rocuronium/vecuronium molecule → rapid reversal including deep blockade (PTC 1-2). FDA 2015, EU approval 2008. Advantages vs neostigmine + glycopyrrolate: rapid, no ceiling effect, fewer anticholinergic side effects, no PONV worsening, eligible for deep blockade reversal. Caveat: sequesters progestin-only contraceptives and estrogen contraceptives — 7d additional method advised. Set 14.'
        objectives: [Sugammadex review]
      - type: choice
        difficulty: 5
        question:
          pt: Em emergency medicine, expanded thrombectomy time window for stroke é demonstrated por…
          en: In emergency medicine, the expanded thrombectomy time window for stroke is demonstrated by…
        choices:
          - DAWN trial (NEJM 2018, Nogueira et al) 6-24h post-stroke onset perfusion-mismatch large vessel occlusion — paradigm shift
          - Reserved exclusively for tPA administration within the 3-hour ischemic stroke window
          - Recommends against any thrombectomy intervention regardless of imaging mismatch
          - Promoted by a fringe emergency medicine hypothesis paper that mainstream specialty societies have not endorsed in any guideline
        correctAnswer: DAWN trial (NEJM 2018, Nogueira et al) 6-24h post-stroke onset perfusion-mismatch large vessel occlusion — paradigm shift
        rationale:
          pt: 'DAWN (DAWN, NEJM 2018, Nogueira/Jovin et al) e DEFUSE-3 (NEJM 2018) expandiram thrombectomy janela 6-24h em pacientes com clinical-imaging mismatch (small core, large penumbra). NNT ~2-3 functional independence (mRS 0-2). Mudou stroke care paradigm. Telemedicine + mobile stroke units (MSUs) parallel evolution. Now 24h+ window evolutionando — RESCUE-Japan LIMIT large core. Set 15.'
          en: 'DAWN (DAWN, NEJM 2018, Nogueira/Jovin et al) and DEFUSE-3 (NEJM 2018) expanded the thrombectomy window to 6-24h in patients with clinical-imaging mismatch (small core, large penumbra). NNT ~2-3 for functional independence (mRS 0-2). Changed stroke care paradigm. Telemedicine + mobile stroke units (MSUs) parallel evolution. Now 24h+ window evolving — RESCUE-Japan LIMIT large core. Set 15.'
        objectives: [DAWN review]
      - type: choice
        difficulty: 5
        question:
          pt: Em dermatology, dupilumab transformed care for…
          en: In dermatology, dupilumab transformed care for…
        choices:
          - Atopic dermatitis (first AD biologic FDA 2017) — IL-4Rα blocking IL-4/IL-13 type 2 inflammation; expanded to asthma, EoE, prurigo nodularis, COPD
          - Approved indication restricted to vitiligo without atopic dermatitis or asthma use
          - Approved exclusively for plaque psoriasis without atopic dermatitis or asthma indications
          - Carries no current dermatologic indication on its FDA or EMA label
        correctAnswer: Atopic dermatitis (first AD biologic FDA 2017) — IL-4Rα blocking IL-4/IL-13 type 2 inflammation; expanded to asthma, EoE, prurigo nodularis, COPD
        rationale:
