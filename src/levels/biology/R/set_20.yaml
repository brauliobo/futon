        correctAnswer: In vivo CRISPR/base editing (Verve PCSK9, Intellia ATTR), AI medicine deployment, GLP-1 expansion (MASH/CKD/AUD/Alzheimer trials), psychedelic-assisted therapy, longevity geroscience
        rationale:
          pt: 'Áreas em rápida aceleração 2025+: (1) In vivo CRISPR/base/prime editing — Verve VERVE-101/102 PCSK9 base edit, Intellia NTLA-2001 ATTR-amyloidosis Phase 3 (MAGNITUDE), em humanos directly editing liver tissue sem ex vivo. (2) AI medicine deployment broader — diagnostic imaging, longitudinal risk prediction, drug discovery (AlphaFold 3 protein-ligand). (3) GLP-1 expansion — Phase 3 trials Alzheimer (semaglutide EVOKE), MASH (SYNERGY-NASH), AUD (NIAAA), substance use, OSA (already approved tirzepatide). (4) Psychedelic-assisted — MDMA-AT FDA reject 2024 mas additional trials, psilocybin Compass COMP360 Phase 3. (5) Geroscience — TAME metformin, senolytics, Calico, NewLimit, cellular reprogramming Altos Labs partial reprogramming. Convergence + scale + ethics ongoing.'
          en: 'Areas rapidly accelerating 2025+: (1) In vivo CRISPR/base/prime editing — Verve VERVE-101/102 PCSK9 base edit, Intellia NTLA-2001 ATTR-amyloidosis Phase 3 (MAGNITUDE), in humans directly editing liver tissue without ex vivo. (2) AI medicine deployment broader — diagnostic imaging, longitudinal risk prediction, drug discovery (AlphaFold 3 protein-ligand). (3) GLP-1 expansion — Phase 3 trials Alzheimer (semaglutide EVOKE), MASH (SYNERGY-NASH), AUD (NIAAA), substance use, OSA (already approved tirzepatide). (4) Psychedelic-assisted — MDMA-AT FDA reject 2024 but additional trials, psilocybin Compass COMP360 Phase 3. (5) Geroscience — TAME metformin, senolytics, Calico, NewLimit, Altos Labs partial cellular reprogramming. Convergence + scale + ethics ongoing.'
