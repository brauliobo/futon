        difficulty: 5
        question:
          pt: O conceito "postbiotics" é…
          en: '"Postbiotics" concept is…'
        choices:
          - Inanimate microbial cells/components/metabolites with health benefit (ISAPP 2021 definition)
          - Belongs to a discontinued early-phase o conceito "postbiotics" é program halted after futility readouts
          - No demonstrated physiologic function in mammalian biology
          - Restricted to a 1990s-era o conceito "postbiotics" é cohort framework without independent post-2010 replication
        correctAnswer: Inanimate microbial cells/components/metabolites with health benefit (ISAPP 2021 definition)
        rationale:
          pt: 'ISAPP (International Scientific Association for Probiotics and Prebiotics) 2021: postbiotics = "preparation of inanimate microorganisms and/or their components that confers a health benefit". Examples: heat-inactivated Akkermansia (Cani 2019), bacterial lysates (OM-85 BV), SCFAs (butyrate). Vantagem: stability, safety (immunocompromised), regulatory simpler. Crescente segmento.'
          en: 'ISAPP (International Scientific Association for Probiotics and Prebiotics) 2021: postbiotics = "preparation of inanimate microorganisms and/or their components that confers a health benefit". Examples: heat-inactivated Akkermansia (Cani 2019), bacterial lysates (OM-85 BV), SCFAs (butyrate). Advantage: stability, safety (immunocompromised), simpler regulatory. Growing segment.'
