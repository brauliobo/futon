          en: 'Wilmanski/Diener/Price ISB Seattle (Nat Metab 2021): healthy elders have diversified individualized microbiomes; declining individuality correlates with morbidity/mortality. Geroscience implications. Bacteroides-dominant aging contrasts with Akkermansia/Christensenella healthy. Inflammaging connections. Microbiome diversity not just diversity — key.'
