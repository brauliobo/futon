          - Built on a since-retracted ici-induced colitis dataset without independent multicenter replication
          - Reflects a pre-2000 ici-induced colitis paradigm displaced by current society guideline updates
          - Tied to a discontinued industry ici-induced colitis program after pivotal trial readout disappointments
