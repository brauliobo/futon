        correctAnswer: rCDI prevention (Phase 3 RESTORATIVE-301 ongoing 2024)
        rationale:
          pt: 'Vedanta Biosciences (Cambridge MA): Honda Riken founded. VE303: 8 Clostridiales strains rationally selected for rCDI prevention. CONSORTIUM Phase 2 (Louie 2023 JAMA) positive. Phase 3 RESTORATIVE-301 enrolling. Defined consortia advantage: characterized, GMP manufactured, no donor variation. VE202 IBD, VE416 PCN allergy também trials.'
          en: 'Vedanta Biosciences (Cambridge MA): Honda/Riken founded. VE303: 8 Clostridiales strains rationally selected for rCDI prevention. CONSORTIUM Phase 2 (Louie 2023 JAMA) positive. Phase 3 RESTORATIVE-301 enrolling. Defined consortia advantage: characterized, GMP manufactured, no donor variation. VE202 IBD, VE416 PCN allergy also in trials.'
