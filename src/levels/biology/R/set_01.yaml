        correctAnswer: Cancer immunotherapy combination (anti-PD-1) — 4D Pharma faliu 2023, programs continued by Pyxis
        rationale:
          pt: '4D Pharma (Aberdeen Scotland, NASDAQ-listed): MRx-0518 (single-strain E. gallinarum), MRx-0029 (Lactobacillus plantarum). Trials: anti-PD-1 + MRx-0518 em refractory cancers. Phase 2 mixed signals. Faliu 2023 financial issues. Programs acquired by Pyxis. Asthma, IBS, autism programs também. Single-strain LBPs as drugs paradigma testado.'
