          en: 'Mucosal vaccines: LimmaTech (Switzerland), University of Florida programs. Engineered probiotics expressing antigens (e.g., SARS-CoV-2 spike, TB ESAT-6). Oral/nasal delivery. Enhanced mucosal immunity (sIgA). Old concept (Cui Lawley); challenges in manufacturing, regulation. Growing interest post-COVID — sterilizing immunity desired.'
