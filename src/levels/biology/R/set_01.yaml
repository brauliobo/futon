title:
  pt: Terapêutica do Microbioma e Probióticos Vivos
  en: Microbiome Therapeutics and Live Biotherapeutics
level: R
subject: biology
objectives:
  - Compreender FMT, LBPs (Live Biotherapeutic Products)
  - Reconhecer Vowst, Rebyota, Akkermansia trials
  - Identificar microbiome-cancer-immunotherapy axis
  - Avaliar regulação FDA OTAT
difficulty: 5
authorNotes: |
  Microbiome therapeutics. Eiseman 1958 first FMT for pseudomembranous colitis. Borody Sydney
  pioneers. OpenBiome 2012 stool bank. Vowst (Seres SER-109) FDA 2023 oral capsules. Rebyota
  (Ferring REBYOTA) FDA 2022 enema. Vedanta VE303 8-strain. Synlogic engineered Nissle.
  Akkermansia muciniphila pasteurized (Cani Belgium A2-32B). FMT-cancer immunotherapy
  Routy/Zitvogel/Viaud. Wargo (MD Anderson) microbiome-checkpoint.
example:
  question:
    pt: Vowst (SER-109, Seres FDA abr/2023) é primeiro oral microbiome therapeutic approved para…
    en: Vowst (SER-109, Seres FDA Apr 2023) is first approved oral microbiome therapeutic for…
  choices:
    - Recurrent C. difficile infection (rCDI), Firmicutes spore consortium oral capsules
    - Limited to a single-center live biotherapeutic vedanta ve303 case series with no prospective cohort confirmation
    - Investigational only, with no current FDA, EMA or international regulatory approval
    - Approved exclusively in the United Kingdom under MHRA without other regulatory pathways
  correctAnswer: Recurrent C. difficile infection (rCDI), Firmicutes spore consortium oral capsules
  rationale:
    pt: 'SER-109 (Vowst, Seres Therapeutics): purified Firmicutes spores from healthy donors, 4 oral capsules. ECOSPOR III Phase 3 (Feuerstadt 2022 NEJM): 88% sustained clinical response vs 60% placebo at 8 wk in rCDI. FDA aprovação abr/2023. Following Rebyota (Ferring) enema approval nov/2022. Era of LBPs (Live Biotherapeutic Products) starting.'
    en: 'SER-109 (Vowst, Seres Therapeutics): purified Firmicutes spores from healthy donors, 4 oral capsules. ECOSPOR III Phase 3 (Feuerstadt 2022 NEJM): 88% sustained clinical response vs 60% placebo at 8 wk in rCDI. FDA approval Apr 2023. Following Rebyota (Ferring) enema approval Nov 2022. LBP (Live Biotherapeutic Products) era starting.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — FMT e LBPs
      en: Page 1 — FMT and LBPs
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: FMT (Fecal Microbiota Transplant) clinical efficacy primeira pivotal demonstration foi em…
          en: First pivotal FMT clinical efficacy demonstration was in…
        choices:
          - 'rCDI (van Nood NEJM 2013): 94% cure vs vancomycin 31% — trial stopped early ethics'
          - Restricted to a 1990s-era fmt cohort framework without independent post-2010 replication
          - Driven by a single underpowered fmt observational series lacking confirmatory follow-up
          - Predates the modern fmt consensus and was superseded by post-2015 framework revisions
        correctAnswer: 'rCDI (van Nood NEJM 2013): 94% cure vs vancomycin 31% — trial stopped early ethics'
        rationale:
          pt: 'van Nood (Netherlands NEJM 2013): primeiro RCT FMT vs vanco em rCDI. Stopped early — futility refusing FMT. Cure rate dramatic. Subsequente: OpenBiome stool bank, FDA enforcement discretion 2013-2022 (rCDI off-label). Now: Rebyota, Vowst approved → enforcement discretion ended.'
          en: 'van Nood (Netherlands NEJM 2013): first RCT of FMT vs vanco in rCDI. Stopped early — futility refusing FMT. Dramatic cure rate. Subsequent: OpenBiome stool bank, FDA enforcement discretion 2013-2022 (off-label rCDI). Now: Rebyota, Vowst approved → enforcement discretion ended.'
        objectives: [van Nood]
      - type: choice
        difficulty: 5
        question:
          pt: Em IBD, FMT trials para Crohn/UC mostraram…
          en: In IBD, FMT trials for Crohn/UC showed…
        choices:
          - Mixed results UC (Moayyedi 2015 +, Paramsothy 2017 +); Crohn modest; donor-effect importante
          - Confined to a regional ibd pilot program without multinational regulatory adoption
          - Built on a since-retracted ibd dataset without independent multicenter replication
          - Reflects a pre-2000 ibd paradigm displaced by current society guideline updates
        correctAnswer: Mixed results UC (Moayyedi 2015 +, Paramsothy 2017 +); Crohn modest; donor-effect importante
        rationale:
          pt: 'UC: Moayyedi 2015, Paramsothy 2017 RCTs positivos; Rossen 2015 negativo. Heterogeneidade donor (super-donor effect). Multidonor pool emerging. Crohn: Vaughn pilots, results variável. Companies: Finch 4D Pharma, Vedanta VE202 IBD trials. Pediatric IBD FMT studies. Mecanismo: anti-inflammatory, immune modulation, barrier function.'
          en: 'UC: Moayyedi 2015, Paramsothy 2017 positive RCTs; Rossen 2015 negative. Donor heterogeneity (super-donor effect). Emerging multi-donor pool. Crohn: Vaughn pilots, variable results. Companies: Finch, 4D Pharma, Vedanta VE202 IBD trials. Pediatric IBD FMT studies. Mechanism: anti-inflammatory, immune modulation, barrier function.'
        objectives: [FMT IBD]
      - type: choice
        difficulty: 5
        question:
          pt: Akkermansia muciniphila como next-gen probiotic foi caracterizada por…
          en: Akkermansia muciniphila as next-gen probiotic characterized by…
        choices:
          - 'Cani lab Belgium: pasteurized A. muciniphila improves metabolic markers em human trial 2019'
          - Tied to a discontinued industry akkermansia muciniphila como next-gen probiotic program after pivotal trial readout disappointments
          - Limited to a single-center akkermansia muciniphila como next-gen probiotic case series with no prospective cohort confirmation
          - Drawn from registry-only akkermansia muciniphila como next-gen probiotic retrospective data with confounding never adjusted out
        correctAnswer: 'Cani lab Belgium: pasteurized A. muciniphila improves metabolic markers em human trial 2019'
        rationale:
          pt: 'Patrice Cani (UCLouvain Belgium): A. muciniphila degrades mucin, ~5% gut microbiome. Inversamente correlated com obesity, diabetes. Pasteurized version (Amuc_1100 outer membrane protein) improved metabolic markers (Depommier 2019 Nat Med Phase 2). Pendulum Therapeutics (Colleen Cutcliffe): commercial development. Live A. muciniphila tem regulatory challenges (anaerobe).'
          en: 'Patrice Cani (UCLouvain Belgium): A. muciniphila degrades mucin, ~5% gut microbiome. Inversely correlated with obesity, diabetes. Pasteurized version (Amuc_1100 outer membrane protein) improved metabolic markers (Depommier 2019 Nat Med Phase 2). Pendulum Therapeutics (Colleen Cutcliffe): commercial development. Live A. muciniphila has regulatory challenges (anaerobe).'
        objectives: [Akkermansia]
      - type: choice
        difficulty: 5
        question:
          pt: Em cancer immunotherapy, microbiome modulation tornou-se area depois Routy/Zitvogel 2018 demonstrating…
          en: In cancer immunotherapy, microbiome modulation became area after Routy/Zitvogel 2018 demonstrating…
        choices:
          - Akkermansia + Faecalibacterium em fecal microbiota predict anti-PD-1 response em NSCLC/melanoma
          - Anchored on a withdrawn cancer immunotherapy guideline statement that subsequent societies disavowed
          - Rests on a press-release-only cancer immunotherapy announcement without peer-reviewed publication
          - Cited from a contested cancer immunotherapy meta-analysis with major heterogeneity and publication bias
        correctAnswer: Akkermansia + Faecalibacterium em fecal microbiota predict anti-PD-1 response em NSCLC/melanoma
        rationale:
          pt: 'Routy/Zitvogel Science 2018: NSCLC/RCC patients responding a PD-1 had distinct gut microbiome (Akkermansia, Faecalibacterium enriched). Antibiotics impaired response. Wargo 2018 Science: melanoma similar. Subsequent: FMT in PD-1 refractory melanoma (Davar 2021 Science, Baruch 2021): some patients responded post-FMT. Follow-up trials: 4D Pharma, Vedanta, EnteroBiotix. Industry race.'
          en: 'Routy/Zitvogel Science 2018: NSCLC/RCC patients responding to PD-1 had distinct gut microbiome (Akkermansia, Faecalibacterium enriched). Antibiotics impaired response. Wargo 2018 Science: melanoma similar. Subsequent: FMT in PD-1-refractory melanoma (Davar 2021 Science, Baruch 2021): some patients responded post-FMT. Follow-up trials: 4D Pharma, Vedanta, EnteroBiotix. Industry race.'
        objectives: [FMT cancer]
      - type: choice
        difficulty: 5
        question:
          pt: Synlogic SYNB1934 (engineered E. coli Nissle for PKU) usa…
          en: Synlogic SYNB1934 (engineered E. coli Nissle for PKU) uses…
        choices:
          - Recombinant Nissle expressing PAL (phenylalanine ammonia lyase) degrading Phe enteric
          - Observation-only strategy without lifestyle, contraceptive, or metformin trial
          - Based on a non-randomized synlogic synb1934 comparator arm where allocation was investigator-determined
          - Belongs to a discontinued early-phase synlogic synb1934 program halted after futility readouts
        correctAnswer: Recombinant Nissle expressing PAL (phenylalanine ammonia lyase) degrading Phe enteric
        rationale:
          pt: 'Synlogic SYNB1618 → SYNB1934 (next-gen): Nissle 1917 chassis com PAL converting Phe → trans-cinnamic acid in gut, reducing systemic Phe in PKU patients. SYNPHENY-1 Phase 2 falhou 2022; SYNPHENY-3 Phase 3 ongoing 2024+. Concept: "living drug" — stay alive em GI, perform metabolic task. Outras: SYNB8802 (oxalate kidney stones), SYNB6300 (citrullinemia).'
          en: 'Synlogic SYNB1618 → SYNB1934 (next-gen): Nissle 1917 chassis with PAL converting Phe → trans-cinnamic acid in gut, reducing systemic Phe in PKU patients. SYNPHENY-1 Phase 2 failed 2022; SYNPHENY-3 Phase 3 ongoing 2024+. Concept: "living drug" — stays alive in GI, performs metabolic task. Others: SYNB8802 (oxalate kidney stones), SYNB6300 (citrullinemia).'
        objectives: [Synlogic]
      - type: choice
        difficulty: 5
        question:
          pt: O FDA OTAT (Office of Tissues and Advanced Therapies) regula LBPs como…
          en: FDA OTAT (Office of Tissues and Advanced Therapies) regulates LBPs as…
        choices:
          - Biologics (BLA pathway, not drugs/devices); CMC challenges anaerobic strains
          - Restricted to a 1990s-era o fda otat cohort framework without independent post-2010 replication
          - Driven by a single underpowered o fda otat observational series lacking confirmatory follow-up
          - Predates the modern o fda otat consensus and was superseded by post-2015 framework revisions
        correctAnswer: Biologics (BLA pathway, not drugs/devices); CMC challenges anaerobic strains
        rationale:
          pt: 'LBPs regulated as biologics (BLA, Biologic License Application). CMC: anaerobic culture, freeze-drying, viability assays, contamination testing. FDA OTAT (renamed CBER OTP em 2023). Guidance Documents: 2016, 2024 update. Defined characterization (whole genome sequencing, function assays). Vowst/Rebyota set precedent. International: EMA, MHRA equivalents.'
          en: 'LBPs regulated as biologics (BLA, Biologic License Application). CMC: anaerobic culture, freeze-drying, viability assays, contamination testing. FDA OTAT (renamed CBER OTP in 2023). Guidance Documents: 2016, 2024 update. Defined characterization (whole genome sequencing, function assays). Vowst/Rebyota set precedent. International: EMA, MHRA equivalents.'
        objectives: [FDA OTAT]
      - type: choice
        difficulty: 5
        question:
          pt: Em FMT safety, FDA emit alert 2019 após…
          en: In FMT safety, FDA issued alert 2019 after…
        choices:
          - 2 imunocompromised pacientes morreram de ESBL E. coli bacteremia from contaminated donor stool
          - Confined to a regional fmt safety pilot program without multinational regulatory adoption
          - Built on a since-retracted fmt safety dataset without independent multicenter replication
          - Reflects a pre-2000 fmt safety paradigm displaced by current society guideline updates
        correctAnswer: 2 imunocompromised pacientes morreram de ESBL E. coli bacteremia from contaminated donor stool
        rationale:
          pt: '2019 FDA: 2 imunossuprimidos enrolled em FMT-cancer trial died ESBL E. coli sepsis. Donor stool contained pathogen. Led to enhanced screening MDRO, expanded donor exclusion. 2022 SARS-CoV-2 screening added. 2023 mpox. Reminding: FMT é biologic, not benign. Standardized LBPs (Vowst, Rebyota) reduce some risks via processing. OpenBiome continua, com strict screening.'
          en: '2019 FDA: 2 immunosuppressed enrolled in FMT-cancer trial died of ESBL E. coli sepsis. Donor stool contained pathogen. Led to enhanced MDRO screening, expanded donor exclusion. 2022 SARS-CoV-2 screening added. 2023 mpox. Reminder: FMT is biologic, not benign. Standardized LBPs (Vowst, Rebyota) reduce some risks via processing. OpenBiome continues, with strict screening.'
        objectives: [FDA FMT safety]
      - type: choice
        difficulty: 5
        question:
          pt: Em precision microbiome, "personalized probiotics" foi proposta por…
          en: In precision microbiome, "personalized probiotics" proposed by…
        choices:
          - 'Eran Segal/Eran Elinav 2018: response-prediction baseado em microbiome individual'
          - Tied to a discontinued industry precision microbiome program after pivotal trial readout disappointments
          - Limited to a single-center precision microbiome case series with no prospective cohort confirmation
          - Drawn from registry-only precision microbiome retrospective data with confounding never adjusted out
        correctAnswer: 'Eran Segal/Eran Elinav 2018: response-prediction baseado em microbiome individual'
        rationale:
          pt: 'Segal/Elinav (Weizmann Israel): glycemic response personalized 2015 Cell — significant inter-individual variation pos-meal glucose dependent on microbiome. Probiotics 2018 Cell: depends on baseline. Some "permissive" colonization, others "resistant". Personalized recommendations beyond one-size. PNP Bio commercialized initially. Industry development continues.'
          en: 'Segal/Elinav (Weizmann Israel): glycemic response personalized 2015 Cell — significant inter-individual variation in post-meal glucose dependent on microbiome. Probiotics 2018 Cell: depends on baseline. Some "permissive" colonization, others "resistant". Personalized recommendations beyond one-size. PNP Bio initially commercialized. Industry development continues.'
        objectives: [Personalized]
      - type: choice
        difficulty: 5
        question:
          pt: Em pediatric, FMT em autism trials (Kang 2017+) show…
          en: In pediatric, FMT in autism trials (Kang 2017+) showed…
        choices:
          - Behavioral + GI improvement em pilot ASU/Kang ; Phase 2 controversa, replication limited
          - Anchored on a withdrawn pediatric guideline statement that subsequent societies disavowed
          - Rests on a press-release-only pediatric announcement without peer-reviewed publication
          - Cited from a contested pediatric meta-analysis with major heterogeneity and publication bias
        correctAnswer: Behavioral + GI improvement em pilot ASU/Kang ; Phase 2 controversa, replication limited
        rationale:
          pt: 'Kang/Krajmalnik-Brown (Arizona State 2017): 18 ASD children, FMT (microbiota transfer therapy MTT). Behavioral + GI improvement sustained 2 years (2019 follow-up). Highly publicized. Subsequent Phase 2 challenges: trial design, blinding, controls. Microbiome-gut-brain axis hypothesized. Vagus nerve, SCFAs, GABAergic. Caution: small N, optimistic interpretation. Replication needed.'
          en: 'Kang/Krajmalnik-Brown (Arizona State 2017): 18 ASD children, FMT (microbiota transfer therapy MTT). Behavioral + GI improvement sustained 2 years (2019 follow-up). Highly publicized. Subsequent Phase 2 challenges: trial design, blinding, controls. Microbiome-gut-brain axis hypothesized. Vagus nerve, SCFAs, GABAergic. Caution: small N, optimistic interpretation. Replication needed.'
        objectives: [Autism FMT]
      - type: choice
        difficulty: 5
        question:
          pt: Em vaginal microbiome, "Lactin-V" (Osel) é…
          en: In vaginal microbiome, "Lactin-V" (Osel) is…
        choices:
          - Live Lactobacillus crispatus probiotic preventing recurrent BV (Bacterial Vaginosis)
          - Based on a non-randomized vaginal microbiome comparator arm where allocation was investigator-determined
          - Belongs to a discontinued early-phase vaginal microbiome program halted after futility readouts
          - Restricted to a 1990s-era vaginal microbiome cohort framework without independent post-2010 replication
        correctAnswer: Live Lactobacillus crispatus probiotic preventing recurrent BV (Bacterial Vaginosis)
        rationale:
          pt: 'Lactin-V (Osel/UCSF Cohen): L. crispatus CTV-05 intravaginal capsule. Cohen 2020 NEJM: post-metronidazole, Lactin-V reduced rBV recurrence ~50%. FDA Phase 2 successful; Phase 3 needed for approval. Conceito: restore Lactobacillus dominance Nugent score. Microbiome fast-emerging area: GBS prevention, fertility, HIV prevention.'
          en: 'Lactin-V (Osel/UCSF Cohen): L. crispatus CTV-05 intravaginal capsule. Cohen 2020 NEJM: post-metronidazole, Lactin-V reduced rBV recurrence ~50%. FDA Phase 2 successful; Phase 3 needed for approval. Concept: restore Lactobacillus dominance Nugent score. Fast-emerging microbiome area: GBS prevention, fertility, HIV prevention.'
        objectives: [Lactin-V]
