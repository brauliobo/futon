title:
  pt: Medicina Esportiva e Fisiologia do Exercício
  en: Sports Medicine and Exercise Physiology
level: R
subject: biology
objectives:
  - Compreender VO2max, lactate threshold
  - Reconhecer ACL injury prevention, concussion CTE
  - Identificar gene doping, anti-doping science
  - Avaliar exercise prescription
difficulty: 5
authorNotes: |
  Sports medicine. ACSM. NCAA, NFL CTE. ACL: ~150k US/yr, prevention programs (PEP, FIFA 11+).
  CTE Aaron Hernandez 2017, Junior Seau. Concussion SCAT5. Anti-doping WADA. Gene doping
  hypothetical EPO/myostatin. GLP-1 athletes. Athlete biological passport ABP. Exercise as
  medicine ACSM.
example:
  question:
    pt: VO2max é métrica de…
    en: VO2max is metric for…
  choices:
    - Maximal aerobic capacity; ~50-60 mL/kg/min trained athletes; declines ~10% per decade após 30
    - Limited to peso without broader clinical applicability or alternative pathways
    - No demonstrated significado in current evidence base or guideline framework
    - Indication strictly limited to pediatric populations under specialty supervision
  correctAnswer: Maximal aerobic capacity; ~50-60 mL/kg/min trained athletes; declines ~10% per decade após 30
  rationale:
    pt: 'VO2max: gold standard cardiorespiratory fitness. Ranges: sedentary ~25-35; recreational ~35-45; elite endurance ~70-90 (cyclists, cross-country skiers). Declines ~10%/decade — exercise mitiga. Mortality predictor: each 1 MET (3.5 mL/kg/min) increase ~13% reduction CV mortality (Kodama 2009). Heritability ~50%. Limits: cardiac output (Q) + a-vO2 difference (Fick equation).'
    en: 'VO2max: gold standard cardiorespiratory fitness. Ranges: sedentary ~25-35; recreational ~35-45; elite endurance ~70-90 (cyclists, cross-country skiers). Declines ~10%/decade — exercise mitigates. Mortality predictor: each 1 MET (3.5 mL/kg/min) increase ~13% CV mortality reduction (Kodama 2009). ~50% heritability. Limits: cardiac output (Q) + a-vO2 difference (Fick equation).'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Fisiologia
      en: Page 1 — Physiology
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em exercise prescription, ACSM/AHA recommend…
          en: In exercise prescription, ACSM/AHA recommend…
        choices:
          - 150 min/week moderate or 75 min vigorous + 2x resistance training; HHS 2018 Physical Activity Guidelines
          - Trivial physiologic concern without clinical or population-health relevance
          - No society or guideline recommendation issued in support of this practice
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: 150 min/week moderate or 75 min vigorous + 2x resistance training; HHS 2018 Physical Activity Guidelines
        rationale:
          pt: 'HHS Physical Activity Guidelines 2018 (2nd edition): adults 150-300 min moderate OR 75-150 vigorous aerobic + 2+ days resistance + balance/flex. Children 60+ min/day. Major bipolar shift: any movement counts (not 10-min minimum). Step counts: 7-10k associated mortality reduction (Lee 2019 JAMA). Sedentary breaks crítico.'
          en: 'HHS Physical Activity Guidelines 2018 (2nd edition): adults 150-300 min moderate OR 75-150 vigorous aerobic + 2+ days resistance + balance/flex. Children 60+ min/day. Major bipolar shift: any movement counts (not 10-min minimum). Step counts: 7-10k associated with mortality reduction (Lee 2019 JAMA). Critical sedentary breaks.'
        objectives: [Exercise rx]
      - type: choice
        difficulty: 5
        question:
          pt: Em CTE (Chronic Traumatic Encephalopathy), tau pathology…
          en: In CTE (Chronic Traumatic Encephalopathy), tau pathology…
        choices:
          - Perivascular phospho-tau in sulcal depths (vs Alzheimer); McKee/BU CTE Center 2015 criteria
          - Limited to amyloid without broader clinical applicability or alternative pathways
          - No demonstrated biomarker in current evidence base or guideline framework
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Perivascular phospho-tau in sulcal depths (vs Alzheimer); McKee/BU CTE Center 2015 criteria
        rationale:
          pt: 'CTE: post-traumatic neurodegeneration. Ann McKee (Boston University CTE Center): 2015 NINDS/NIBIB criteria. Stage I-IV. Phospho-tau (AT8) perivascular sulcal depths — neuronal/glial different distribution from AD. Studied: NFL, boxers (Punch Drunk dementia pugilistica), military TBI. Hernandez 2017 brain donation. Diagnosis postmortem; PET tau emerging. Clinical: TES (Traumatic Encephalopathy Syndrome).'
          en: 'CTE: post-traumatic neurodegeneration. Ann McKee (Boston University CTE Center): 2015 NINDS/NIBIB criteria. Stage I-IV. Phospho-tau (AT8) perivascular at sulcal depths — different neuronal/glial distribution from AD. Studied: NFL, boxers (Punch Drunk/dementia pugilistica), military TBI. Hernandez 2017 brain donation. Diagnosis postmortem; PET tau emerging. Clinical: TES (Traumatic Encephalopathy Syndrome).'
        objectives: [CTE]
      - type: choice
        difficulty: 5
        question:
          pt: Em concussion (mTBI), SCAT6 (2023) é…
          en: In concussion (mTBI), SCAT6 (2023) is…
        choices:
          - Standardized Concussion Assessment Tool 6th edition; symptom check + cognitive + balance
          - Limited to exam without broader clinical applicability or alternative pathways
          - No formalized care-pathway structure or systems-of-care designation in place
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: Standardized Concussion Assessment Tool 6th edition; symptom check + cognitive + balance
        rationale:
          pt: 'SCAT (Sport Concussion Assessment Tool): International Consensus Statement on Concussion in Sport. SCAT6 2023 (Berlin Conference 2022): replaced SCAT5. Brief exam (~15 min): symptom severity, BESS balance, immediate/delayed memory, concentration. Child SCAT6 5-12y. Office SCAT post-injury follow-up. Vestibular Ocular Motor Screen (VOMS) integrated. ImPACT computerized neurocognitive baseline.'
          en: 'SCAT (Sport Concussion Assessment Tool): International Consensus Statement on Concussion in Sport. SCAT6 2023 (Berlin Conference 2022): replaced SCAT5. Brief exam (~15 min): symptom severity, BESS balance, immediate/delayed memory, concentration. Child SCAT6 5-12y. Office SCAT post-injury follow-up. Vestibular Ocular Motor Screen (VOMS) integrated. ImPACT computerized neurocognitive baseline.'
        objectives: [SCAT6]
      - type: choice
        difficulty: 5
        question:
          pt: ACL injury epidemiology em US ~150k/year, prevention programs include…
          en: ACL injury epidemiology in US ~150k/year, prevention programs include…
        choices:
          - PEP (Mandelbaum), FIFA 11+, JUMP-ACL — neuromuscular training reduces ~50%
          - Surgical-only application without pharmacologic or device-based alternative
          - No primary or secondary prevention benefit demonstrated in randomized data
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: PEP (Mandelbaum), FIFA 11+, JUMP-ACL — neuromuscular training reduces ~50%
        rationale:
          pt: 'ACL: ~150k US, ~70% non-contact (deceleration, cutting). Females 4-8x higher rate male. Hewett biomechanics. PEP (Prevent Injury Enhance Performance, Mandelbaum 2008): warm-up program. FIFA 11+. Cochrane meta-analysis: ~50% reduction. Implementation gap. ACL reconstruction: 90%+ return sport, but 25%+ second injury risk. BEAR (bridge-enhanced ACL repair Murray) FDA 2020 alternative.'
          en: 'ACL: ~150k US, ~70% non-contact (deceleration, cutting). Females 4-8x higher rate than males. Hewett biomechanics. PEP (Prevent Injury Enhance Performance, Mandelbaum 2008): warm-up program. FIFA 11+. Cochrane meta-analysis: ~50% reduction. Implementation gap. ACL reconstruction: 90%+ return to sport, but 25%+ second injury risk. BEAR (bridge-enhanced ACL repair Murray) FDA 2020 alternative.'
        objectives: [ACL prevention]
      - type: choice
        difficulty: 5
        question:
          pt: Em anti-doping, WADA Athlete Biological Passport (ABP) detects…
          en: In anti-doping, WADA Athlete Biological Passport (ABP) detects…
        choices:
          - Longitudinal hematologic + steroidal profiles flag deviations from individual baseline
          - Limited to single test without broader clinical applicability or alternative pathways
          - No demonstrated monitoring in current evidence base or guideline framework
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: Longitudinal hematologic + steroidal profiles flag deviations from individual baseline
        rationale:
          pt: 'WADA ABP (2009 hematologic, 2014 steroidal modules): rather than detect specific substance, flag suspicious patterns. Hematologic: Hb, OFF-score, reticulocytes flag EPO/blood doping. Steroidal: T/E ratio flag exogenous androgens. Bayesian analysis. Convicted athletes: Lance Armstrong (TUE 2012), various cycling, athletics. Endocrine module proposed. Effective deterrent.'
          en: 'WADA ABP (2009 hematologic, 2014 steroidal modules): rather than detect a specific substance, flag suspicious patterns. Hematologic: Hb, OFF-score, reticulocytes flag EPO/blood doping. Steroidal: T/E ratio flags exogenous androgens. Bayesian analysis. Convicted athletes: Lance Armstrong (TUE 2012), various cycling, athletics. Endocrine module proposed. Effective deterrent.'
        objectives: [ABP]
      - type: choice
        difficulty: 5
        question:
          pt: Em gene doping, hypothetical targets include…
          en: In gene doping, hypothetical targets include…
        choices:
          - EPO gene transfer (endurance), myostatin KO (Schwarzenegger mouse muscle), follistatin
          - Minor incidental finding without epidemiologic or therapeutic implications
          - Considered to carry no clinically significant safety concern across reported cohorts
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: EPO gene transfer (endurance), myostatin KO (Schwarzenegger mouse muscle), follistatin
        rationale:
          pt: 'WADA banned gene doping 2003. Hypothetical (no documented athlete cases yet): EPO gene transfer increased Hct endurance, myostatin (MSTN) KO mass (Schwarzenegger mouse: cattle Belgian Blue analog). Follistatin antagonist. Detection: PCR-based methods, looking transgene sequences. Reality: gene therapy clinical applications expand → doping detection technology must.'
          en: 'WADA banned gene doping 2003. Hypothetical (no documented athlete cases yet): EPO gene transfer for increased Hct endurance, myostatin (MSTN) KO for mass (Schwarzenegger mouse: cattle Belgian Blue analog). Follistatin antagonist. Detection: PCR-based methods, looking for transgene sequences. Reality: as gene therapy clinical applications expand → doping detection technology must.'
        objectives: [Gene doping]
      - type: choice
        difficulty: 5
        question:
          pt: Em "exercise as medicine", strongest evidence chronic disease prevention…
          en: In "exercise as medicine", strongest evidence for chronic disease prevention…
        choices:
          - CV disease, T2D, breast/colon cancer, depression, dementia, all-cause mortality
          - Trivial physiologic concern without clinical or population-health relevance
          - No measurable impact on hard endpoints in well-powered prospective studies
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: CV disease, T2D, breast/colon cancer, depression, dementia, all-cause mortality
        rationale:
          pt: 'Exercise robust evidence: CV (~30% reduction), T2D (~40-50%), 7+ cancers (Moore 2016 JAMA Intern Med), depression (Schuch 2018), dementia (~30%), all-cause mortality. ACSM "Exercise is Medicine" (2007 launched). Lancet 2012 Physical Activity series. WHO 2020 Physical Activity Guidelines: meet 150 min, halve sitting time. Implementation gap massive.'
          en: 'Exercise robust evidence: CV (~30% reduction), T2D (~40-50%), 7+ cancers (Moore 2016 JAMA Intern Med), depression (Schuch 2018), dementia (~30%), all-cause mortality. ACSM "Exercise is Medicine" (2007 launched). Lancet 2012 Physical Activity series. WHO 2020 Physical Activity Guidelines: meet 150 min, halve sitting time. Massive implementation gap.'
        objectives: [Exercise medicine]
      - type: choice
        difficulty: 5
        question:
          pt: Em GLP-1 + exercise athletes, emerging concerns…
          en: In GLP-1 + exercise athletes, emerging concerns…
        choices:
          - Lean mass loss ~25-40% (Wilding NEJM 2021); GLP-1 lifestyle adherence essential
          - Limited to benefit without broader clinical applicability or alternative pathways
          - Reported safety profile entirely benign with no signal in pharmacovigilance databases
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Lean mass loss ~25-40% (Wilding NEJM 2021); GLP-1 lifestyle adherence essential
        rationale:
          pt: 'Semaglutide STEP, tirzepatide SURMOUNT trials: 30-50% weight loss obesity. Concern: ~25-40% lean mass loss (DEXA). Mitigation: protein 1.2-1.6 g/kg + resistance training. Sarcopenic obesity risk em older. Bimagrumab (Versanis activin/myostatin antagonist) trials para preserve lean. Athletes: GLP-1 banned WADA? Status uncertain. Off-label fitness use crescente.'
          en: 'Semaglutide STEP, tirzepatide SURMOUNT trials: 30-50% weight loss in obesity. Concern: ~25-40% lean mass loss (DEXA). Mitigation: 1.2-1.6 g/kg protein + resistance training. Sarcopenic obesity risk in older adults. Bimagrumab (Versanis activin/myostatin antagonist) trials to preserve lean. Athletes: GLP-1 WADA-banned? Status uncertain. Growing off-label fitness use.'
        objectives: [GLP-1 athletes]
      - type: choice
        difficulty: 5
        question:
          pt: Em sudden cardiac death athletes, screening AHA/ESC…
          en: In sudden cardiac death athletes, screening AHA/ESC…
        choices:
          - History/physical universal; ECG controvertido (Italy mandates, US debates cost-effectiveness)
          - Approved label confined to children below adolescence, excluding adult use
          - No screening pathway recommended by USPSTF or specialty societies
          - Approved exclusively in the United States with no EMA or international pathway
        correctAnswer: History/physical universal; ECG controvertido (Italy mandates, US debates cost-effectiveness)
        rationale:
          pt: 'Sudden cardiac death young athletes: ~1/200k/yr (Maron data). HCM 30%, idiopathic 30%, anomalous coronary, channelopathies. AHA 14-point H&P. ECG: Italy 1982+ mandatory pre-participation reduced SCD. US: debates (false positive rate, cost, equity). FIFA mandatory. NCAA emerging. AED stadium availability. Hank Gathers 1990 case catalyzed.'
          en: 'Sudden cardiac death in young athletes: ~1/200k/yr (Maron data). HCM 30%, idiopathic 30%, anomalous coronary, channelopathies. AHA 14-point H&P. ECG: Italy 1982+ mandatory pre-participation reduced SCD. US: debate (false positive rate, cost, equity). FIFA mandatory. NCAA emerging. AED stadium availability. Hank Gathers 1990 case catalyzed.'
        objectives: [SCD athletes]
      - type: choice
        difficulty: 5
        question:
          pt: Em exercise + cancer, "exercise oncology" prescription…
          en: In exercise + cancer, "exercise oncology" prescription…
        choices:
          - Improves outcomes during/after treatment; ASCO/CDC guidelines specific dosing
          - Limited to rest without broader clinical applicability or alternative pathways
          - Major guidelines (AHA, ACC, ESC, ASH, ASCO) take no position on this approach
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Improves outcomes during/after treatment; ASCO/CDC guidelines specific dosing
        rationale:
          pt: 'Exercise oncology field: aerobic + resistance during/after cancer therapy. Reduces fatigue, improves QoL, possibly survival (epidemiologic Hojman, Pedersen). ACSM 2019 Roundtable Cancer guidelines. ASCO 2022 endorsed exercise prescription. CHALLENGE trial colon cancer (Courneya 2024 ASCO): structured exercise reduced recurrence vs control. Modelo "RX exercise" expanding.'
          en: 'Exercise oncology field: aerobic + resistance during/after cancer therapy. Reduces fatigue, improves QoL, possibly survival (epidemiological Hojman, Pedersen). ACSM 2019 Roundtable Cancer guidelines. ASCO 2022 endorsed exercise prescription. CHALLENGE colon cancer trial (Courneya 2024 ASCO): structured exercise reduced recurrence vs control. Expanding "exercise Rx" model.'
        objectives: [Exercise oncology]
  - title:
      pt: Página 2 — Aplicações
      en: Page 2 — Applications
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em concussion treatment, "rest is best" abandoned em favor de…
          en: In concussion treatment, "rest is best" abandoned in favor of…
        choices:
          - Sub-symptom threshold aerobic exercise within 1-2 days; Buffalo Concussion Treadmill Test
          - Sempre rest
          - No meaningful practice change recommended after the trial readouts
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: Sub-symptom threshold aerobic exercise within 1-2 days; Buffalo Concussion Treadmill Test
        rationale:
          pt: 'Leddy/Willer (Buffalo): early sub-threshold aerobic exercise reduces protracted recovery. Buffalo Concussion Treadmill Test (BCTT) determines threshold. Berlin 2017, Amsterdam 2022 Concussion Consensus: brief 24-48h cognitive/physical rest, then graded return. Replaced "dark room" old paradigm. Pediatric Concussion Pathway. NCAA enforcing.'
          en: 'Leddy/Willer (Buffalo): early sub-threshold aerobic exercise reduces protracted recovery. Buffalo Concussion Treadmill Test (BCTT) determines threshold. Berlin 2017, Amsterdam 2022 Concussion Consensus: brief 24-48h cognitive/physical rest, then graded return. Replaced "dark room" old paradigm. Pediatric Concussion Pathway. NCAA enforcing.'
        objectives: [Concussion rest]
      - type: choice
        difficulty: 5
        question:
          pt: Em RED-S (Relative Energy Deficiency in Sport), formerly "Female Athlete Triad"…
          en: In RED-S (Relative Energy Deficiency in Sport), formerly "Female Athlete Triad"…
        choices:
          - Energy deficiency → menstrual dysfunction, low BMD, performance decrement; affects males também
          - Limited to female without broader clinical applicability or alternative pathways
          - Considered to carry no clinically significant safety concern across reported cohorts
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Energy deficiency → menstrual dysfunction, low BMD, performance decrement; affects males também
        rationale:
          pt: 'Female Athlete Triad (1993): low energy availability, menstrual dysfunction, low BMD. IOC RED-S 2014, 2018 expansion: applies males também (low T, BMD), broader effects (CV, GI, immune, psychological). Endurance athletes high risk. Eating disorders comorbidity. ACSM/AMSSM management. Stress fractures, osteoporosis early in elite athletes.'
          en: 'Female Athlete Triad (1993): low energy availability, menstrual dysfunction, low BMD. IOC RED-S 2014, 2018 expansion: applies to males too (low T, BMD), broader effects (CV, GI, immune, psychological). Endurance athletes at high risk. Eating disorder comorbidity. ACSM/AMSSM management. Stress fractures, early osteoporosis in elite athletes.'
        objectives: [RED-S]
      - type: choice
        difficulty: 5
        question:
          pt: Em PRP (Platelet-Rich Plasma) for tendinopathy, evidence is…
          en: In PRP (Platelet-Rich Plasma) for tendinopathy, evidence is…
        choices:
          - Mixed (positive lateral epicondylitis, plantar fasciitis; less Achilles, rotator cuff)
          - Sempre eficaz
          - No supporting evidence in either randomized or large observational datasets
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: Mixed (positive lateral epicondylitis, plantar fasciitis; less Achilles, rotator cuff)
        rationale:
          pt: 'PRP: spin patient blood concentrating platelets → growth factors injection. Lateral epicondylitis (tennis elbow): meta-analyses positive. Plantar fasciitis: evidence acceptable. Achilles tendinopathy, rotator cuff: limited. Knee OA conflicting. Cost ~$500-2000/injection. Insurance variable. AAOS 2021 KneeOA: limited recommendation. Cell therapies expand: stromal vascular fraction, MSCs (largely unregulated stem cell tourism).'
          en: 'PRP: spin patient blood to concentrate platelets → growth-factor injection. Lateral epicondylitis (tennis elbow): meta-analyses positive. Plantar fasciitis: acceptable evidence. Achilles tendinopathy, rotator cuff: limited. Knee OA conflicting. Cost ~$500-2000/injection. Insurance variable. AAOS 2021 KneeOA: limited recommendation. Cell therapies expanding: stromal vascular fraction, MSCs (largely unregulated stem cell tourism).'
        objectives: [PRP]
      - type: choice
        difficulty: 5
        question:
          pt: Em altitude training for endurance, "live high train low" (LHTL)…
          en: In altitude training for endurance, "live high train low" (LHTL)…
        choices:
          - Sleeping ~2500m + training low altitude → Hb mass increase preserving training intensity
          - Limited to low altitude without broader clinical applicability or alternative pathways
          - No measurable benefit on primary or secondary endpoints in confirmatory studies
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Sleeping ~2500m + training low altitude → Hb mass increase preserving training intensity
        rationale:
          pt: 'Levine/Stray-Gundersen 1997 LHTL paradigm: simulate altitude (real or hypoxic tents) sleep (~12+ h/day) preserving training quality at low altitude. Hb mass increases ~5%, VO2max ~1-2%. Marginal sea-level performance. Anti-doping debate (legal but borderline). Real Mt. Whistler, Park City, Iten Kenya. Hypoxic chambers.'
          en: 'Levine/Stray-Gundersen 1997 LHTL paradigm: simulate altitude (real or hypoxic tents) for sleep (~12+ h/day) while training at low altitude to preserve quality. Hb mass increases ~5%, VO2max ~1-2%. Marginal sea-level performance gain. Anti-doping debate (legal but borderline). Real Mt. Whistler, Park City, Iten Kenya. Hypoxic chambers.'
        objectives: [LHTL]
      - type: choice
        difficulty: 5
        question:
          pt: Em musculoskeletal imaging, MSK ultrasound advantage over MRI…
          en: In musculoskeletal imaging, MSK ultrasound advantage over MRI…
        choices:
          - Dynamic, point-of-care, guided injections, cheaper; lower resolution deep structures
          - Cost is the only consideration without clinical efficacy or safety implications
          - No demonstrated clinical application in current evidence-based guidelines
          - Limited US-only indication with no current submission to other regulatory agencies
        correctAnswer: Dynamic, point-of-care, guided injections, cheaper; lower resolution deep structures
        rationale:
          pt: 'MSK ultrasound: clinic-based, real-time. Tendons, muscles, joints superficial. Dynamic assessment (e.g., snapping hip). Guided injections (50%+ better accuracy vs landmark-based, e.g., subacromial). Limited deeper structures (hip, spine). Sports medicine adoption rapid. Training: AIUM/AMSSM. AI-assisted interpretation emerging.'
          en: 'MSK ultrasound: clinic-based, real-time. Tendons, muscles, superficial joints. Dynamic assessment (e.g., snapping hip). Guided injections (50%+ better accuracy vs landmark-based, e.g., subacromial). Limited for deeper structures (hip, spine). Rapid sports medicine adoption. Training: AIUM/AMSSM. Emerging AI-assisted interpretation.'
        objectives: [MSK US]
      - type: choice
        difficulty: 5
        question:
          pt: Em performance enhancement legal, creatine monohydrate é…
          en: In legal performance enhancement, creatine monohydrate is…
        choices:
          - Most evidence-based supplement; ATP-PCr energetics; cognitive + sarcopenia benefits também
          - Limited to mito without broader clinical applicability or alternative pathways
          - Available evidence base is too sparse to support any clinical recommendation
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: Most evidence-based supplement; ATP-PCr energetics; cognitive + sarcopenia benefits também
        rationale:
          pt: 'Creatine: ~500+ studies. Loading 20g/d × 5d → 5g/d maintenance. Increases muscle PCr ~20% → ATP regeneration short bursts. Hypertrophy ~5-10% gain. Safe long-term (Kreider 2017 review). Cognitive (Avgerinos 2018): brain ATP/PCr, mood. Sarcopenia + bone density older adults. ISSN endorses. Largely overlooked dietary supplement.'
          en: 'Creatine: ~500+ studies. Loading 20g/d × 5d → 5g/d maintenance. Increases muscle PCr ~20% → ATP regeneration in short bursts. Hypertrophy ~5-10% gain. Safe long-term (Kreider 2017 review). Cognitive (Avgerinos 2018): brain ATP/PCr, mood. Sarcopenia + bone density in older adults. ISSN endorses. Largely overlooked dietary supplement.'
        objectives: [Creatine]
      - type: choice
        difficulty: 5
        question:
          pt: Em endurance fueling, "train low compete high" carbohydrate strategy…
          en: In endurance fueling, "train low compete high" carbohydrate strategy…
        choices:
          - Periodic glycogen-low training to enhance fat oxidation; high carb competition
          - Limited to baixo carb without broader clinical applicability or alternative pathways
          - No recognized therapeutic strategy beyond symptom management
          - Indication strictly limited to pediatric populations under specialty supervision
        correctAnswer: Periodic glycogen-low training to enhance fat oxidation; high carb competition
        rationale:
          pt: 'Hawley/Jeukendrup periodization: train ~2-3x/week glycogen-low (fasted, recovery, sleep low) increases fat oxidation, mitochondrial biogenesis. Race day: 90+ g/h carbs (multiple transportable). Athletes: Kipchoge fueling routines. Limit: too much may impair immune, women endocrine. Individual response variable.'
          en: 'Hawley/Jeukendrup periodization: train ~2-3x/week glycogen-low (fasted, recovery, sleep low) increases fat oxidation, mitochondrial biogenesis. Race day: 90+ g/h carbs (multiple transportable). Athletes: Kipchoge fueling routines. Limit: too much may impair immunity, women endocrine. Individual response variable.'
        objectives: [Train low compete high]
      - type: choice
        difficulty: 5
        question:
          pt: Em equity sports medicine, female athlete research gap…
          en: In equity sports medicine, female athlete research gap…
        choices:
          - ~6% sports research female-only; menstrual cycle phase ignored; under-resourced
          - Historical curiosity with no current role in evidence-based clinical practice
          - Considered free of safety or efficacy concerns based on long-term registry data
          - Approved exclusively in the United States with no EMA or international pathway
        correctAnswer: ~6% sports research female-only; menstrual cycle phase ignored; under-resourced
        rationale:
          pt: 'Cowley 2021 systematic review: ~6% only-female sports research; ~63% only male. Hormones, menstrual cycle effects ignored historically. Female Athlete Health Group. Period-tracking apps (FitrWoman, Clue). FIFA, NWSL increasing investment. Concussion: female 50%+ higher rate, longer recovery (NCAA, Lancet 2024). RED-S, ACL injury, UI, breast support specific issues. Catch-up needed.'
          en: 'Cowley 2021 systematic review: ~6% only-female sports research; ~63% only male. Hormonal, menstrual cycle effects historically ignored. Female Athlete Health Group. Period-tracking apps (FitrWoman, Clue). FIFA, NWSL increasing investment. Concussion: female 50%+ higher rate, longer recovery (NCAA, Lancet 2024). RED-S, ACL injury, UI, breast support specific issues. Catch-up needed.'
        objectives: [Female athlete]
      - type: choice
        difficulty: 5
        question:
          pt: Em exercise + brain health, BDNF (brain-derived neurotrophic factor)…
          en: In exercise + brain health, BDNF (brain-derived neurotrophic factor)…
        choices:
          - Aerobic exercise increases BDNF → hippocampal neurogenesis, memory, mood
          - Minor incidental finding without epidemiologic or therapeutic implications
          - No proposed mechanism connects this intervention to the disease biology
          - Approved label confined to children below adolescence, excluding adult use
        correctAnswer: Aerobic exercise increases BDNF → hippocampal neurogenesis, memory, mood
        rationale:
          pt: 'Cotman/Berchtold UC Irvine: aerobic exercise → BDNF (Brain-Derived Neurotrophic Factor) → hippocampal neurogenesis (Erickson 2011 PNAS: 1y aerobic exercise increased hippocampal volume 2%). Improves memory, mood (vs antidepressant). Mediator: irisin (Boström 2012), lactate, ketones. SMART Move studies AD prevention. Exercise as cognitive intervention.'
          en: 'Cotman/Berchtold UC Irvine: aerobic exercise → BDNF (Brain-Derived Neurotrophic Factor) → hippocampal neurogenesis (Erickson 2011 PNAS: 1y aerobic exercise increased hippocampal volume 2%). Improves memory, mood (vs antidepressant). Mediators: irisin (Boström 2012), lactate, ketones. SMART Move AD prevention studies. Exercise as cognitive intervention.'
        objectives: [Exercise brain]
      - type: choice
        difficulty: 5
        question:
          pt: Future sports medicine includes…
          en: Future sports medicine includes…
        choices:
          - Wearables (HRV, sleep), AI injury prediction, biologics (PRP next-gen), gene/cell therapy
          - Health-economic concerns dominate without clinical safety or efficacy implications
          - No notable evolution beyond the original first-generation device or protocol
          - Limited US-only indication with no current submission to other regulatory agencies
        correctAnswer: Wearables (HRV, sleep), AI injury prediction, biologics (PRP next-gen), gene/cell therapy
        rationale:
          pt: 'Future sports medicine: wearables (Whoop, Garmin) HRV-guided training, sleep, recovery. AI injury prediction algorithms NBA, NFL. Biologics next-gen (BMAC, exosomes, characterized PRP). Gene/cell therapy ortobiologics emerging. Female Athlete Health programs. Mental health (Naomi Osaka, Simone Biles). RED-S awareness. Equity expansion. Olympic Refugee Team. Inclusive sport.'
          en: 'Future sports medicine: wearables (Whoop, Garmin) HRV-guided training, sleep, recovery. AI injury prediction algorithms NBA, NFL. Next-gen biologics (BMAC, exosomes, characterized PRP). Emerging gene/cell therapy orthobiologics. Female Athlete Health programs. Mental health (Naomi Osaka, Simone Biles). RED-S awareness. Equity expansion. Olympic Refugee Team. Inclusive sport.'
        objectives: [Future sports]
