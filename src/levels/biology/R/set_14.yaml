title:
  pt: Anestesia e Medicina Perioperatória
  en: Anesthesia and Perioperative Medicine
level: R
subject: biology
objectives:
  - Compreender anesthesia depth, EEG monitoring
  - Reconhecer ERAS, regional anesthesia
  - Identificar perioperative MI, AKI
  - Avaliar pediatric, OSA, frailty
difficulty: 5
authorNotes: |
  Anesthesia. Morton ether 1846. Halothane 1956. Propofol 1989 Diprivan. Sevoflurane 1990s.
  Sugammadex 2015. Bispectral Index BIS. ECRI ASA. Perioperative pulmonary, cardiac. ERAS Cardiac.
  POPAS Society. PROVE Network.
example:
  question:
    pt: Sugammadex (Bridion FDA 2015) reverses…
    en: Sugammadex (Bridion FDA 2015) reverses…
  choices:
    - Aminosteroid neuromuscular blockade (rocuronium, vecuronium) via specific encapsulation
    - Apenas neostigmine
    - Sem qualquer aplicação
    - Apenas em pediatric
  correctAnswer: Aminosteroid neuromuscular blockade (rocuronium, vecuronium) via specific encapsulation
  rationale:
    pt: 'Sugammadex (Merck Bridion FDA 2015 after long delay): cyclodextrin specifically encapsulates rocuronium/vecuronium → rapid reversal (~3 min vs neostigmine ~10 min) deep blockade. Game-changer hard-airway, prolonged surgery. Cost ~$100/dose (declining post-generic 2024). Avoids muscarinic side effects neostigmine + atropine. Substantial impact OR efficiency, safety.'
    en: 'Sugammadex (Merck Bridion FDA 2015 after long delay): cyclodextrin specifically encapsulates rocuronium/vecuronium → rapid reversal (~3 min vs neostigmine ~10 min) of deep blockade. Game-changer for hard airway, prolonged surgery. Cost ~$100/dose (declining post-generic 2024). Avoids muscarinic side effects of neostigmine + atropine. Substantial impact on OR efficiency, safety.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Pharmacology
      en: Page 1 — Pharmacology
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em propofol, John Glen 1977 development…
          en: In propofol, John Glen 1977 development…
        choices:
          - First commercially viable IV induction agent low context-sensitive half-time
          - Apenas histórica
          - Sem qualquer impacto
          - Apenas em pediatric
        correctAnswer: First commercially viable IV induction agent low context-sensitive half-time
        rationale:
          pt: 'John (Iain) Glen (ICI/AstraZeneca): synthesized propofol 1977. Diprivan FDA 1989. Lipid emulsion (Intralipid 10%). Rapid onset, redistribution allows quick recovery. Replaces thiopental largely. AANA, Michael Jackson death 2009 controversa OR-only restriction. Generic 2002. Backbone TIVA (Total IV Anesthesia). Variants: fospropofol (Lusedra), ciprofol (China 2024 alternative).'
          en: 'John (Iain) Glen (ICI/AstraZeneca): synthesized propofol 1977. Diprivan FDA 1989. Lipid emulsion (Intralipid 10%). Rapid onset, redistribution allows quick recovery. Largely replaces thiopental. AANA, Michael Jackson death 2009 controversial OR-only restriction. Generic 2002. Backbone of TIVA (Total IV Anesthesia). Variants: fospropofol (Lusedra), ciprofol (China 2024 alternative).'
        objectives: [Propofol]
      - type: choice
        difficulty: 5
        question:
          pt: Em volatile anesthetics, sevoflurane vs desflurane environmental…
          en: In volatile anesthetics, sevoflurane vs desflurane environmental…
        choices:
          - Desflurane GWP 2540 (~atom CO2-eq); sevoflurane 130; switch reduces hospital climate footprint
          - Apenas trivial
          - Sem qualquer concern
          - Apenas em UK
        correctAnswer: Desflurane GWP 2540 (~atom CO2-eq); sevoflurane 130; switch reduces hospital climate footprint
        rationale:
          pt: 'Volatile anesthetics: significant climate impact. Desflurane GWP100 ~2540 CO2-eq, sevoflurane ~130, isoflurane ~510. NHS England banned desflurane mai/2024 except emergencies. Ireland 2023 phasing out. AAGBI, ASA reduce flow recommendations. Replacement: sevoflurane mostly, propofol TIVA increasing. ~5% healthcare emissions volatile gases. NSAIDs (ketorolac), regional anesthesia opioid-sparing co-benefits.'
          en: 'Volatile anesthetics: significant climate impact. Desflurane GWP100 ~2540 CO2-eq, sevoflurane ~130, isoflurane ~510. NHS England banned desflurane May 2024 except for emergencies. Ireland 2023 phasing out. AAGBI, ASA recommend reduced flow. Replacement: sevoflurane mostly, propofol TIVA increasing. ~5% healthcare emissions volatile gases. NSAIDs (ketorolac), regional anesthesia opioid-sparing co-benefits.'
        objectives: [Desflurane sevoflurane]
      - type: choice
        difficulty: 5
        question:
          pt: Em depth of anesthesia, BIS (Bispectral Index, Aspect Medical 1996)…
          en: In depth of anesthesia, BIS (Bispectral Index, Aspect Medical 1996)…
        choices:
          - EEG-derived 0-100 metric; 40-60 surgical anesthesia; reduce awareness, drug doses
          - Apenas histórica
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: EEG-derived 0-100 metric; 40-60 surgical anesthesia; reduce awareness, drug doses
        rationale:
          pt: 'BIS (Aspect Medical, FDA 1996): 4-channel frontal EEG → proprietary algorithm 0-100 score. 40-60 surgical anesthesia, 65-85 sedation. B-Aware Trial (Myles 2004 Lancet): reduced anesthesia awareness (~0.18% → 0.05% high-risk). B-Unaware (Avidan 2008 NEJM): with end-tidal anesthetic monitoring no incremental benefit. Use widespread but uncertain population value. Newer SedLine (Masimo), Entropy.'
          en: 'BIS (Aspect Medical, FDA 1996): 4-channel frontal EEG → proprietary algorithm 0-100 score. 40-60 surgical anesthesia, 65-85 sedation. B-Aware Trial (Myles 2004 Lancet): reduced anesthesia awareness (~0.18% → 0.05% in high-risk). B-Unaware (Avidan 2008 NEJM): with end-tidal anesthetic monitoring, no incremental benefit. Widespread use but uncertain population value. Newer SedLine (Masimo), Entropy.'
        objectives: [BIS]
      - type: choice
        difficulty: 5
        question:
          pt: Em regional anesthesia, peripheral nerve block + ultrasound…
          en: In regional anesthesia, peripheral nerve block + ultrasound…
        choices:
          - Reduces opioid, faster recovery, ambulatory surgery; ESPB (Erector Spinae Plane) Forero 2016
          - Apenas trivial
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Reduces opioid, faster recovery, ambulatory surgery; ESPB (Erector Spinae Plane) Forero 2016
        rationale:
          pt: Regional anesthesia ultrasound-guided revolutionized blocks since 2000s. Peripheral (interscalene, supraclavicular shoulder; femoral, popliteal sciatic LE; TAP truncal). Erector Spinae Plane Block (ESPB Forero 2016 RAPM). Pectoral, serratus chest. Quadratus lumborum. Reduce opioid 40-60%. ERAS principle. Liposomal bupivacaine (Exparel) extended duration. Cryoablation peripheral nerves emerging.
          en: 'Regional anesthesia: ultrasound-guided revolutionized blocks since 2000s. Peripheral (interscalene, supraclavicular shoulder; femoral, popliteal sciatic LE; truncal TAP). Erector Spinae Plane Block (ESPB Forero 2016 RAPM). Pectoral, serratus chest. Quadratus lumborum. Reduce opioids 40-60%. ERAS principle. Liposomal bupivacaine (Exparel) extended duration. Emerging peripheral nerve cryoablation.'
        objectives: [Regional]
      - type: choice
        difficulty: 5
        question:
          pt: Em ASA Physical Status, perioperative risk…
          en: In ASA Physical Status, perioperative risk…
        choices:
          - I (healthy), II (mild), III (severe), IV (life-threat), V (moribund); E suffix emergency
          - Apenas trivial
          - Sem qualquer estrutura
          - Apenas em pediatric
        correctAnswer: I (healthy), II (mild), III (severe), IV (life-threat), V (moribund); E suffix emergency
        rationale:
          pt: 'ASA Physical Status (1941, last 2014 revision): I healthy, II mild systemic disease (controlled HTN), III severe (DM, COPD), IV life-threatening (severe HF, ESRD on dialysis), V moribund (ruptured AAA, massive trauma). VI brain dead organ donor. E suffix emergency. Predicts perioperative mortality. Limit: subjective interrater reliability ~50-70%. Improving frailty integration (CFS).'
          en: 'ASA Physical Status (1941, last 2014 revision): I healthy, II mild systemic disease (controlled HTN), III severe (DM, COPD), IV life-threatening (severe HF, ESRD on dialysis), V moribund (ruptured AAA, massive trauma). VI brain-dead organ donor. E suffix for emergency. Predicts perioperative mortality. Limit: subjective interrater reliability ~50-70%. Improving frailty integration (CFS).'
        objectives: [ASA PS]
      - type: choice
        difficulty: 5
        question:
          pt: Em perioperative MINS (Myocardial Injury after Non-cardiac Surgery)…
          en: In perioperative MINS (Myocardial Injury after Non-cardiac Surgery)…
        choices:
          - Troponin elevation post-op ~20% inpatient surgery; 10-fold mortality risk; mostly silent
          - Apenas trivial
          - Sem qualquer impacto
          - Apenas em pediatric
        correctAnswer: Troponin elevation post-op ~20% inpatient surgery; 10-fold mortality risk; mostly silent
        rationale:
          pt: 'MINS (Devereaux/Vascular events Non-cardiac Surgery cohort): troponin elevation post-op surgery without ischemic symptoms. Vision-1, BridgeChips. ~20% major non-cardiac surgery. ~10-fold mortality risk. Most silent (without chest pain). Drivers: tachycardia, hypotension, anemia, demand-supply mismatch. MANAGE trial dabigatran post-MINS reduced events. Statin, aspirin? Mixed.'
          en: 'MINS (Devereaux/Vascular events Non-cardiac Surgery cohort): post-op troponin elevation without ischemic symptoms. Vision-1, BridgeChips. ~20% of major non-cardiac surgery. ~10-fold mortality risk. Mostly silent (without chest pain). Drivers: tachycardia, hypotension, anemia, demand-supply mismatch. MANAGE trial: dabigatran post-MINS reduced events. Statin, aspirin? Mixed.'
        objectives: [MINS]
      - type: choice
        difficulty: 5
        question:
          pt: Em pediatric anesthesia neurotoxicity, FDA 2016 warning…
          en: In pediatric anesthesia neurotoxicity, FDA 2016 warning…
        choices:
          - Repeated/long anesthetic <3 yo may affect brain development; GAS, MASK, PANDA studies reassuring
          - Apenas teórico
          - Sem qualquer concern
          - Apenas em US
        correctAnswer: Repeated/long anesthetic <3 yo may affect brain development; GAS, MASK, PANDA studies reassuring
        rationale:
          pt: 'FDA 2016 warning (preceded by animal data, FDA SmartTots): "use of general anesthetic + sedation drugs >3h or repeated procedures children <3 yo may affect brain". Subsequent: GAS trial (McCann 2019 Lancet) single anesthetic neurodevelopment OK. MASK (Hu 2019 JAMA) cohort N=997: single ok, multiple modest deficits. PANDA: single sibling-controlled ok. Field reassured single brief; ongoing concern multiple/long.'
          en: 'FDA 2016 warning (preceded by animal data, FDA SmartTots): "general anesthetic + sedation drugs >3h or repeated procedures in children <3 yo may affect brain". Subsequent: GAS trial (McCann 2019 Lancet) single anesthetic neurodevelopment OK. MASK (Hu 2019 JAMA) cohort N=997: single OK, multiple modest deficits. PANDA: single sibling-controlled OK. Field reassured for single brief; ongoing concern over multiple/long.'
        objectives: [Pediatric anesthesia]
      - type: choice
        difficulty: 5
        question:
          pt: Em obstructive sleep apnea perioperatively…
          en: In obstructive sleep apnea perioperatively…
        choices:
          - STOP-BANG screening; CPAP continuation, opioid-sparing, monitored bed > floor
          - Apenas standard
          - Sem qualquer protocolo
          - Apenas em pediatric
        correctAnswer: STOP-BANG screening; CPAP continuation, opioid-sparing, monitored bed > floor
        rationale:
          pt: 'OSA perioperatively: ~25% surgical patients undiagnosed OSA. STOP-BANG (Chung 2008): Snoring, Tired, Observed apnea, Pressure (HTN), BMI, Age, Neck circumference, Gender. ≥3 positive screening. CPAP own home machine continuation, neuraxial regional anesthesia preferred, opioid-sparing multimodal (gabapentinoids), enhanced monitoring (PACU extended, telemetry/SpO2), avoid sedatives. SASM Society guidance.'
          en: 'OSA perioperatively: ~25% of surgical patients have undiagnosed OSA. STOP-BANG (Chung 2008): Snoring, Tired, Observed apnea, Pressure (HTN), BMI, Age, Neck circumference, Gender. ≥3 positive on screening. CPAP own home machine continuation, neuraxial regional anesthesia preferred, opioid-sparing multimodal (gabapentinoids), enhanced monitoring (extended PACU, telemetry/SpO2), avoid sedatives. SASM Society guidance.'
        objectives: [OSA periop]
      - type: choice
        difficulty: 5
        question:
          pt: Em malignant hyperthermia, dantrolene…
          en: In malignant hyperthermia, dantrolene…
        choices:
          - First-line treatment; RYR1/CACNA1S genetic susceptibility; volatile anesthetic + succinylcholine triggers
          - Apenas teórico
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: First-line treatment; RYR1/CACNA1S genetic susceptibility; volatile anesthetic + succinylcholine triggers
        rationale:
          pt: 'Malignant hyperthermia: ~1/100k anesthetics. RYR1 (~70%), CACNA1S mutations susceptible. Triggers: volatile anesthetics (sevoflurane, des, iso, halothane), succinylcholine. Skeletal muscle Ca++ release uncontrolled → rigidity, hypermetabolism, hyperthermia. Mortality ~50% pre-1980 → ~5% with dantrolene (1979). Triage: Ryanodex high-concentration formulation (faster). MHAUS Hotline (1-800-MH-HYPER). Genetic testing.'
          en: 'Malignant hyperthermia: ~1/100k anesthetics. RYR1 (~70%), CACNA1S mutations susceptible. Triggers: volatile anesthetics (sevoflurane, des, iso, halothane), succinylcholine. Skeletal muscle uncontrolled Ca++ release → rigidity, hypermetabolism, hyperthermia. Mortality ~50% pre-1980 → ~5% with dantrolene (1979). Triage: Ryanodex high-concentration formulation (faster). MHAUS Hotline (1-800-MH-HYPER). Genetic testing.'
        objectives: [Malignant hyperthermia]
      - type: choice
        difficulty: 5
        question:
          pt: Em postoperative delirium, prevention/management evolves…
          en: In postoperative delirium, prevention/management evolves…
        choices:
          - Pre-op cognitive screen, multimodal opioid-sparing, dexmedetomidine, family/orientation, light + sleep
          - Apenas trivial
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Pre-op cognitive screen, multimodal opioid-sparing, dexmedetomidine, family/orientation, light + sleep
        rationale:
          pt: 'POD (Post-Operative Delirium): ~15-50% elderly hip fracture, ~30% cardiac surgery. Risk: age, cognitive impairment, frailty, anesthesia type, pain control, sleep. POSAMINO checklist (Inouye HELP). ESA guidelines 2017. Mini-Cog pre-op. Reduce benzodiazepines, use dexmedetomidine, regional anesthesia, multimodal pain. Family presence. Bright lights day, dark night. Independent risk poorer outcomes.'
          en: 'POD (Post-Operative Delirium): ~15-50% in elderly hip fracture, ~30% in cardiac surgery. Risk: age, cognitive impairment, frailty, anesthesia type, pain control, sleep. POSAMINO checklist (Inouye HELP). ESA 2017 guidelines. Mini-Cog pre-op. Reduce benzodiazepines, use dexmedetomidine, regional anesthesia, multimodal pain. Family presence. Bright lights by day, dark at night. Independent risk for poorer outcomes.'
        objectives: [POD]
  - title:
      pt: Página 2 — Aplicações
      en: Page 2 — Applications
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em cardiac anesthesia, ERAS Cardiac Society 2019 emerging…
          en: In cardiac anesthesia, ERAS Cardiac Society 2019 emerging…
        choices:
          - Multimodal extubation early, pain control opioid-sparing, glycemic, fluid balance, mobilization
          - Apenas histórica
          - Sem qualquer estrutura
          - Apenas em pediatric
        correctAnswer: Multimodal extubation early, pain control opioid-sparing, glycemic, fluid balance, mobilization
        rationale:
          pt: 'ERAS Cardiac Society 2019 (Engelman/Williams): adapting ERAS principles cardiac surgery. Pre-op carbohydrate loading, regional analgesia (parasternal, ESP blocks), low-dose opioid, dexmedetomidine, bypass strategies less hemodilution, early extubation (hours not days), early mobilization. Reduces LOS, complications. Implementation crescente em cardiac surgery centers.'
          en: 'ERAS Cardiac Society 2019 (Engelman/Williams): adapting ERAS principles to cardiac surgery. Pre-op carbohydrate loading, regional analgesia (parasternal, ESP blocks), low-dose opioid, dexmedetomidine, bypass strategies with less hemodilution, early extubation (hours not days), early mobilization. Reduces LOS, complications. Growing implementation in cardiac surgery centers.'
        objectives: [ERAS Cardiac]
      - type: choice
        difficulty: 5
        question:
          pt: Em neuraxial anesthesia, modern thrombosis avoidance…
          en: In neuraxial anesthesia, modern thrombosis avoidance…
        choices:
          - ASRA guidelines 2018 + 2024 anticoagulants; spinal/epidural hematoma prevention
          - Apenas trivial
          - Sem qualquer estrutura
          - Apenas em pediatric
        correctAnswer: ASRA guidelines 2018 + 2024 anticoagulants; spinal/epidural hematoma prevention
        rationale:
          pt: 'ASRA Anticoagulation Guidelines (Horlocker 2018, 2024 update): timing neuraxial procedures vs anticoagulants. Heparin (UFH 4h after dose), enoxaparin (12h prophylactic, 24h therapeutic), DOACs (rivaroxaban, apixaban 72h). Catheter management. Reduces spinal/epidural hematoma rare but devastating ~1/200k. Direct thrombin (dabigatran), antiplatelet (DAPT) management protocols.'
          en: 'ASRA Anticoagulation Guidelines (Horlocker 2018, 2024 update): timing of neuraxial procedures vs anticoagulants. Heparin (UFH 4h after dose), enoxaparin (12h prophylactic, 24h therapeutic), DOACs (rivaroxaban, apixaban 72h). Catheter management. Reduces rare but devastating spinal/epidural hematoma ~1/200k. Direct thrombin (dabigatran), antiplatelet (DAPT) management protocols.'
        objectives: [ASRA anticoag]
      - type: choice
        difficulty: 5
        question:
          pt: Em obstetric anesthesia, neuraxial labor analgesia…
          en: In obstetric anesthesia, neuraxial labor analgesia…
        choices:
          - PIEB (programmed intermittent epidural bolus) > continuous infusion; CSE rapid onset
          - Apenas opioid IV
          - Sem qualquer evolução
          - Apenas em UK
        correctAnswer: PIEB (programmed intermittent epidural bolus) > continuous infusion; CSE rapid onset
        rationale:
          pt: 'Labor epidural evolved: PIEB (programmed intermittent epidural bolus) — better spread, less local anesthetic, less motor block vs continuous infusion (CEI). CSE (Combined Spinal-Epidural) rapid analgesia. Walking epidural low-dose ropivacaine + fentanyl. Reduces operative delivery risk debated (COMET 2001). Maternal Acute Pain Score, satisfaction. SOAP guidelines. Newer dural puncture epidural (DPE).'
          en: 'Labor epidural evolved: PIEB (programmed intermittent epidural bolus) — better spread, less local anesthetic, less motor block vs continuous infusion (CEI). CSE (Combined Spinal-Epidural) for rapid analgesia. Walking epidural low-dose ropivacaine + fentanyl. Reduces debated operative delivery risk (COMET 2001). Maternal Acute Pain Score, satisfaction. SOAP guidelines. Newer dural puncture epidural (DPE).'
        objectives: [Labor epidural]
      - type: choice
        difficulty: 5
        question:
          pt: Em neuraxial morphine PRO PCA, ITM (intrathecal morphine)…
          en: In neuraxial morphine PRO PCA, ITM (intrathecal morphine)…
        choices:
          - '100-150 μg em cesarean section: 18-24h analgesia, opioid-sparing'
          - Apenas IV PCA
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: '100-150 μg em cesarean section: 18-24h analgesia, opioid-sparing'
        rationale:
          pt: 'ITM cesarean: 100-150 μg morphine intrathecal (added spinal anesthesia for c-section): provides 18-24h analgesia. ERAS Cardiac, hepatobiliary, gyne hysterectomy adopted. Pruritus most common AE. Respiratory depression rare with low doses (~0.1-0.3% even with 200 μg). Opioid-sparing. Liposomal bupivacaine (Exparel) duration boost without ITM.'
          en: 'ITM cesarean: 100-150 μg intrathecal morphine (added to spinal anesthesia for c-section): provides 18-24h analgesia. ERAS Cardiac, hepatobiliary, gyne hysterectomy adopted. Pruritus most common AE. Respiratory depression rare with low doses (~0.1-0.3% even with 200 μg). Opioid-sparing. Liposomal bupivacaine (Exparel) duration boost without ITM.'
        objectives: [ITM]
      - type: choice
        difficulty: 5
        question:
          pt: Em ultrasound point-of-care POCUS, anesthesiologist applications…
          en: In ultrasound point-of-care POCUS, anesthesiologist applications…
        choices:
          - Vascular access, regional blocks, lung (pneumothorax), gastric (aspiration risk), focused echo
          - Apenas pesquisa
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Vascular access, regional blocks, lung (pneumothorax), gastric (aspiration risk), focused echo
        rationale:
          pt: 'POCUS anesthesia: central + peripheral venous, arterial line. Regional blocks. Lung (B-lines pulmonary edema, sliding pneumothorax). Gastric ultrasound (aspiration risk pre-induction). FOCUS focused cardiac echo (LV function, RV strain, pericardial effusion, IVC volume status). Difficult airway anatomic ID. Crescente: AI-augmented (Caption Health, EchoNous). Standard skills curricula 2020s.'
          en: 'POCUS in anesthesia: central + peripheral venous, arterial line. Regional blocks. Lung (B-lines for pulmonary edema, sliding for pneumothorax). Gastric ultrasound (aspiration risk pre-induction). FOCUS focused cardiac echo (LV function, RV strain, pericardial effusion, IVC volume status). Difficult airway anatomic ID. Growing: AI-augmented (Caption Health, EchoNous). Standard skills curricula in 2020s.'
        objectives: [POCUS]
      - type: choice
        difficulty: 5
        question:
          pt: Em pediatric anesthesia frailty, glycopyrrolate, ondansetron…
          en: In pediatric anesthesia frailty, glycopyrrolate, ondansetron…
        choices:
          - Anti-cholinergic (less cross BBB), anti-emetic NK1 + 5HT3 prevention POVN (Post-Op Vomiting Nausea)
          - Apenas adult
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Anti-cholinergic (less cross BBB), anti-emetic NK1 + 5HT3 prevention POVN (Post-Op Vomiting Nausea)
        rationale:
          pt: 'Pediatric anesthesia: glycopyrrolate antimuscarinic não cruza BBB (vs atropine). Antiemetics: ondansetron 5HT3 first-line, dexamethasone, aprepitant NK1 (oral, FDA 12+ yo). PONV/POV: pediatric ~30-50% high-risk surgery (strabismus, T&A). Risk: prior PONV, female adolescent, motion sickness. Multimodal prevention: dexamethasone + ondansetron, avoid emetogenic. ASA Apfel score adapted.'
          en: 'Pediatric anesthesia: glycopyrrolate is antimuscarinic and doesn''t cross BBB (vs atropine). Antiemetics: ondansetron 5HT3 first-line, dexamethasone, aprepitant NK1 (oral, FDA 12+ yo). PONV/POV: pediatric ~30-50% in high-risk surgery (strabismus, T&A). Risk: prior PONV, female adolescent, motion sickness. Multimodal prevention: dexamethasone + ondansetron, avoid emetogenic. ASA Apfel score adapted.'
        objectives: [Pediatric antiemetic]
      - type: choice
        difficulty: 5
        question:
          pt: Em frailty + perioperative care, Clinical Frailty Scale (CFS Rockwood)…
          en: In frailty + perioperative care, Clinical Frailty Scale (CFS Rockwood)…
        choices:
          - 1-9 visual + descriptions; predicts post-op mortality, complications, LOS
          - Apenas trivial
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: 1-9 visual + descriptions; predicts post-op mortality, complications, LOS
        rationale:
          pt: 'CFS (Clinical Frailty Scale, Rockwood 2005): 1 (very fit) – 9 (terminal). Visual + brief descriptions. Quick (5 min). Predicts perioperative mortality, complications, LOS, readmission. ESA + ASA guidelines integrate. Hip fracture, cardiac surgery, oncology screening. Pre-op optimization: prehabilitation (exercise, nutrition, cognitive). Frailty ≠ age. ANZCA frailty consensus 2023.'
          en: 'CFS (Clinical Frailty Scale, Rockwood 2005): 1 (very fit) – 9 (terminal). Visual + brief descriptions. Quick (5 min). Predicts perioperative mortality, complications, LOS, readmission. ESA + ASA guidelines integrate it. Hip fracture, cardiac surgery, oncology screening. Pre-op optimization: prehabilitation (exercise, nutrition, cognitive). Frailty ≠ age. ANZCA 2023 frailty consensus.'
        objectives: [CFS frailty]
      - type: choice
        difficulty: 5
        question:
          pt: Em prehabilitation pre-operative, multimodal includes…
          en: In pre-operative prehabilitation, multimodal includes…
        choices:
          - Aerobic + resistance exercise, nutrition optimization, smoking cessation, cognitive training
          - Apenas observação
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Aerobic + resistance exercise, nutrition optimization, smoking cessation, cognitive training
        rationale:
          pt: 'Prehabilitation: 4-6 weeks pre-op preparation. Carli (McGill), Wynter-Blyth (Imperial London) pioneers. Components: aerobic + resistance exercise, dietary protein optimization, smoking cessation (4+ wk pre-op), iron supplementation/transfusion, cognitive exercises (Lumosity). Reduces complications, LOS. PREPARE-ABC, FIT4Surgery trials. Multidisciplinary clinic. Equity access challenge (low-income, rural). Future: digital prehab apps.'
          en: 'Prehabilitation: 4-6 weeks of pre-op preparation. Carli (McGill), Wynter-Blyth (Imperial London) pioneers. Components: aerobic + resistance exercise, dietary protein optimization, smoking cessation (4+ wk pre-op), iron supplementation/transfusion, cognitive exercises (Lumosity). Reduces complications, LOS. PREPARE-ABC, FIT4Surgery trials. Multidisciplinary clinic. Equity access challenge (low-income, rural). Future: digital prehab apps.'
        objectives: [Prehabilitation]
      - type: choice
        difficulty: 5
        question:
          pt: Em chronic post-surgical pain (CPSP), prevention strategies…
          en: In chronic post-surgical pain (CPSP), prevention strategies…
        choices:
          - Multimodal pain control, regional anesthesia, ketamine; ~10-50% surgery types developing CPSP
          - Apenas trivial
          - Sem qualquer estratégia
          - Apenas em pediatric
        correctAnswer: Multimodal pain control, regional anesthesia, ketamine; ~10-50% surgery types developing CPSP
        rationale:
          pt: 'CPSP: post-thoracotomy ~50%, mastectomy ~30-40%, hernia ~10-30%. Risk: severe acute pain, opioid use, female, anxiety, surgical type. Prevention: regional anesthesia (paravertebral thoracic), opioid-sparing multimodal, ketamine sub-anesthetic, pregabalin/gabapentin (questionable evidence Verret 2020), transitional pain services post-discharge. Toronto Transitional Pain Service Joel Katz model. ASRA-PUSH 2023 emerging.'
          en: 'CPSP: post-thoracotomy ~50%, mastectomy ~30-40%, hernia ~10-30%. Risk: severe acute pain, opioid use, female, anxiety, surgical type. Prevention: regional anesthesia (thoracic paravertebral), opioid-sparing multimodal, sub-anesthetic ketamine, pregabalin/gabapentin (questionable evidence Verret 2020), post-discharge transitional pain services. Toronto Transitional Pain Service Joel Katz model. ASRA-PUSH 2023 emerging.'
        objectives: [CPSP]
      - type: choice
        difficulty: 5
        question:
          pt: Future anesthesia trends include…
          en: Future anesthesia trends include…
        choices:
          - Decarbonization (less desflurane), AI titration, prehabilitation, digital monitoring, regenerative
          - Apenas histórica
          - Sem qualquer evolução
          - Apenas em US
        correctAnswer: Decarbonization (less desflurane), AI titration, prehabilitation, digital monitoring, regenerative
        rationale:
          pt: 'Future anesthesia: climate-conscious (volatile gases reduction, low-flow techniques, TIVA, regional). AI-driven titration depth + autonomic. Pre-habilitation expansion. Frailty integration. Telehealth pre-op assessment. Digital recovery monitoring. Surgical Home model. Regenerative anesthesia for chronic pain (ASRA Pain). Outcomes-based. Sustainability + equity.'
          en: 'Future anesthesia: climate-conscious (volatile gas reduction, low-flow techniques, TIVA, regional). AI-driven titration of depth + autonomics. Prehabilitation expansion. Frailty integration. Telehealth pre-op assessment. Digital recovery monitoring. Surgical Home model. Regenerative anesthesia for chronic pain (ASRA Pain). Outcomes-based. Sustainability + equity.'
        objectives: [Future anesthesia]
