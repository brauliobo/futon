title:
  pt: Inovações em Cardiologia
  en: Cardiology Innovations
level: R
subject: biology
objectives:
  - Compreender mavacamten HCM
  - Reconhecer PCSK9/inclisiran lipid
  - Identificar AI ECG wearables
  - Avaliar 4-pillar HFrEF, TAVR
difficulty: 5
authorNotes: |
  Cardiology innovation. Mavacamten Camzyos HCM 2022. PCSK9 evolocumab/alirocumab.
  Inclisiran Leqvio siRNA. 4-pillar HFrEF (RAAS/MRA/ARNI/SGLT2). TAVR expansion.
  AI ECG (Mayo, AliveCor). Apple Watch AFib. Watchman LAA. Mavacamten obstructive HCM.
example:
  question:
    pt: Mavacamten (Camzyos, BMS/MyoKardia FDA abr/2022) é primeira terapia direcionada para…
    en: Mavacamten (Camzyos, BMS/MyoKardia FDA Apr 2022) is the first targeted therapy for…
  choices:
    - Symptomatic obstructive hypertrophic cardiomyopathy (oHCM); cardiac myosin inhibitor reduces actin-myosin cross-bridges → reduces LVOT gradient
    - Limited to dilated cardiomyopathy without broader clinical applicability or alternative pathways
    - Limited to amyloidosis cardiac without broader clinical applicability or alternative pathways
    - Limited to pediatric arrhythmia without broader clinical applicability or alternative pathways
  correctAnswer: Symptomatic obstructive hypertrophic cardiomyopathy (oHCM); cardiac myosin inhibitor reduces actin-myosin cross-bridges → reduces LVOT gradient
  rationale:
    pt: 'Mavacamten primeiro myosin inhibitor cardíaco — reduz hipercontractilidade característica HCM. EXPLORER-HCM trial (NEJM 2020): improvement composite functional capacity (peak VO2, NYHA class) vs placebo. VALOR-HCM em pacientes severely symptomatic eligible septal reduction therapy — alternativa não-invasiva. Side effects: LVEF reduction reversible (REMS), AF. Class effect: aficamten (Cytokinetics) Phase 3 SEQUOIA-HCM completed ago/2024 também positivo. Pipeline non-obstructive HCM, HFpEF. Genetic HCM (MYH7, MYBPC3 mutations) ~1:200-500.'
    en: 'Mavacamten is the first cardiac myosin inhibitor — reduces hypercontractility characteristic of HCM. EXPLORER-HCM trial (NEJM 2020): composite improvement in functional capacity (peak VO2, NYHA class) vs placebo. VALOR-HCM in severely symptomatic patients eligible for septal reduction therapy — non-invasive alternative. Side effects: reversible LVEF reduction (REMS), AF. Class effect: aficamten (Cytokinetics) Phase 3 SEQUOIA-HCM completed Aug 2024 also positive. Pipeline non-obstructive HCM, HFpEF. Genetic HCM (MYH7, MYBPC3 mutations) ~1:200-500.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Lipid + HF + Structural
      en: Page 1 — Lipid + HF + Structural
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: PCSK9 inhibitors (evolocumab Repatha Amgen, alirocumab Praluent Sanofi/Regeneron) demonstraram em FOURIER e ODYSSEY OUTCOMES…
          en: PCSK9 inhibitors (evolocumab Repatha Amgen, alirocumab Praluent Sanofi/Regeneron) demonstrated in FOURIER and ODYSSEY OUTCOMES…
        choices:
          - LDL-C ~60% reduction added to statin; ~15-20% relative MACE reduction in stable ASCVD/post-ACS; mAb SC q2-4 weeks
          - Lipid-lowering only with no cardiovascular outcome benefit on hard endpoints
          - Increased cardiovascular event rate observed in active-arm participants
          - Indication limited to pediatric heterozygous familial hypercholesterolemia only
        correctAnswer: LDL-C ~60% reduction added to statin; ~15-20% relative MACE reduction in stable ASCVD/post-ACS; mAb SC q2-4 weeks
        rationale:
          pt: 'PCSK9 (proprotein convertase subtilisin/kexin 9): regula LDL receptor degradation. Evolocumab/alirocumab são humanized mAbs anti-PCSK9 — bloqueiam ligação com LDLR → ↑ LDLR surface → ↓ LDL-C ~60% adicional sobre statin. FOURIER (evolocumab, NEJM 2017) ASCVD stable: 15% MACE reduction HR 0.85. ODYSSEY OUTCOMES (alirocumab, NEJM 2018) post-ACS: 15% MACE reduction HR 0.85. Custo barreira inicial $14k → $5k pós-pricing 2018. Indication FH homozygous + heterozygous, ASCVD em LDL não-meta. Inclisiran siRNA q6mo alternativa.'
          en: 'PCSK9 (proprotein convertase subtilisin/kexin 9): regulates LDL receptor degradation. Evolocumab/alirocumab are humanized anti-PCSK9 mAbs — block LDLR binding → ↑ LDLR surface → ↓ LDL-C ~60% additional over statin. FOURIER (evolocumab, NEJM 2017) stable ASCVD: 15% MACE reduction HR 0.85. ODYSSEY OUTCOMES (alirocumab, NEJM 2018) post-ACS: 15% MACE reduction HR 0.85. Cost barrier initially $14k → $5k after 2018 price cut. Indication FH homozygous + heterozygous, ASCVD with LDL not at goal. Inclisiran siRNA q6mo alternative.'
        objectives: [PCSK9 mAbs]
      - type: choice
        difficulty: 5
        question:
          pt: Inclisiran (Leqvio Novartis FDA dez/2021) é primeiro siRNA cardiovascular aprovado, com administração…
          en: Inclisiran (Leqvio Novartis FDA Dec 2021) is the first cardiovascular siRNA approved, with administration…
        choices:
          - SC q6 months after loading dose; targets PCSK9 mRNA in hepatocytes via GalNAc conjugate; LDL-C ~50% reduction sustained
          - Once-daily oral tablet given without loading or maintenance interval adjustments
          - Daily IV infusion administered in a hospital outpatient infusion suite
          - Daily subcutaneous injection self-administered with adherence supervision
        correctAnswer: SC q6 months after loading dose; targets PCSK9 mRNA in hepatocytes via GalNAc conjugate; LDL-C ~50% reduction sustained
        rationale:
          pt: 'Inclisiran: GalNAc-conjugated siRNA targeting PCSK9 mRNA — entra hepatocytes via ASGPR → RISC RNA interference. Administered SC dose 0, 3 mo, then q6 months. ORION-9/10/11 trials Phase 3 demonstraram LDL-C ~50% reduction sustained 18 mo. Vantagem adherence vs daily statin/mAb biweekly. ORION-4 CVOT em curso resultados ~2026. Approved indication primary hypercholesterolemia (HeFH e ASCVD não-meta on max statin). Custo ~$3500/dose — $7000/yr inicial. UK NHS deal earlier 2021. Pipeline targeting Lp(a) (olpasiran, pelacarsen, lepodisiran).'
          en: 'Inclisiran: GalNAc-conjugated siRNA targeting PCSK9 mRNA — enters hepatocytes via ASGPR → RISC RNA interference. Administered SC at month 0, 3, then q6 months. ORION-9/10/11 Phase 3 trials demonstrated LDL-C ~50% reduction sustained over 18 mo. Adherence advantage vs daily statin/biweekly mAb. ORION-4 CVOT ongoing, results ~2026. Approved indication primary hypercholesterolemia (HeFH and ASCVD not-at-goal on max statin). Cost ~$3500/dose — $7000/yr initial. UK NHS deal earlier 2021. Pipeline targeting Lp(a) (olpasiran, pelacarsen, lepodisiran).'
        objectives: [Inclisiran siRNA]
      - type: choice
        difficulty: 5
        question:
          pt: Em Lp(a) (lipoprotein(a)) cardiovascular risk, agentes em desenvolvimento incluem…
          en: In Lp(a) (lipoprotein(a)) cardiovascular risk, agents in development include…
        choices:
          - Pelacarsen ASO (Phase 3 HORIZON), olpasiran siRNA (Phase 3 OCEAN(a)), lepodisiran siRNA, muvalaplin oral; aim 80-95% Lp(a) reduction
          - Limited to statins eficazes Lp(a) without broader clinical applicability or alternative pathways
          - No active drug development pipeline targeting this pathway in late-stage trials
          - Niacin monotherapy at high dose as the established Lp(a)-lowering strategy
        correctAnswer: Pelacarsen ASO (Phase 3 HORIZON), olpasiran siRNA (Phase 3 OCEAN(a)), lepodisiran siRNA, muvalaplin oral; aim 80-95% Lp(a) reduction
        rationale:
          pt: 'Lp(a): apo(a) covalently attached to apoB100 — geneticamente determined ~70-90%. Independent CV risk factor — elevated levels (~20% population) associated ASCVD, aortic stenosis, stroke. Statins não reduzem Lp(a) (podem ↑ marginalmente). PCSK9 inhibitors ~25% reduction. Targeted: pelacarsen (Ionis/Novartis) ASO Phase 3 HORIZON; olpasiran (Amgen) siRNA Phase 3 OCEAN(a); lepodisiran (Lilly) siRNA Phase 3 ACCLAIM-Lp(a); muvalaplin (Lilly) oral small molecule disrupts Lp(a) assembly. Reduce 80-95% Lp(a). CVOT readouts 2025-2027 — aguardado. Lp(a) screening universal expandindo (recommendations once-in-lifetime test).'
          en: 'Lp(a): apo(a) covalently attached to apoB100 — genetically determined ~70-90%. Independent CV risk factor — elevated levels (~20% population) associated with ASCVD, aortic stenosis, stroke. Statins do not reduce Lp(a) (may marginally ↑). PCSK9 inhibitors ~25% reduction. Targeted: pelacarsen (Ionis/Novartis) ASO Phase 3 HORIZON; olpasiran (Amgen) siRNA Phase 3 OCEAN(a); lepodisiran (Lilly) siRNA Phase 3 ACCLAIM-Lp(a); muvalaplin (Lilly) oral small molecule disrupts Lp(a) assembly. Reduce 80-95% Lp(a). CVOT readouts 2025-2027 — eagerly awaited. Lp(a) universal screening expanding (recommendations: once-in-lifetime test).'
        objectives: [Lp(a) drugs]
      - type: choice
        difficulty: 5
        question:
          pt: Em HFrEF guideline-directed medical therapy (GDMT), 4-pillar approach inclui…
          en: In HFrEF guideline-directed medical therapy (GDMT), the 4-pillar approach includes…
        choices:
          - ARNI (sacubitril/valsartan) ou ACEi/ARB + beta-blocker + MRA + SGLT2-i; rapid simultaneous initiation reduces mortality
          - Digoxin monotherapy as the cornerstone of HFrEF management
          - Loop diuretic monotherapy as the foundation of long-term HFrEF management
          - ACE inhibitor monotherapy without beta-blocker, MRA, or SGLT2 inhibitor co-therapy
        correctAnswer: ARNI (sacubitril/valsartan) ou ACEi/ARB + beta-blocker + MRA + SGLT2-i; rapid simultaneous initiation reduces mortality
        rationale:
          pt: 'HFrEF GDMT 2022 AHA/ACC/HFSA: 4-pillar concurrent (não sequencial) initiation: ARNI (sacubitril/valsartan PARADIGM-HF 2014) preferred sobre ACEi/ARB; beta-blocker (carvedilol/metoprolol succinate/bisoprolol); MRA (spironolactone/eplerenone); SGLT2-i (dapagliflozin/empagliflozin). STRONG-HF trial 2022 demonstrou rapid uptitration durante index admission → mortality benefit. Adicionais: ivabradine se sinus ≥70 bpm em max BB; vericiguat (Verquvo) sGC stimulator pós-exacerbation. Devices: ICD, CRT, mitral TEER, PFM-LV transcatheter. Heart transplant LVAD end-stage.'
          en: 'HFrEF GDMT 2022 AHA/ACC/HFSA: concurrent (not sequential) 4-pillar initiation — ARNI (sacubitril/valsartan PARADIGM-HF 2014) preferred over ACEi/ARB; beta-blocker (carvedilol/metoprolol succinate/bisoprolol); MRA (spironolactone/eplerenone); SGLT2-i (dapagliflozin/empagliflozin). STRONG-HF trial 2022 demonstrated rapid uptitration during index admission → mortality benefit. Additional: ivabradine if sinus ≥70 bpm on max BB; vericiguat (Verquvo) sGC stimulator post-exacerbation. Devices: ICD, CRT, mitral TEER, PFM-LV transcatheter. Heart transplant LVAD end-stage.'
        objectives: [HFrEF 4-pillar]
      - type: choice
        difficulty: 5
        question:
          pt: TAVR (transcatheter aortic valve replacement) expansion 2019 inclui all-risk indication após PARTNER 3 e Evolut Low Risk…
          en: TAVR (transcatheter aortic valve replacement) expansion 2019 includes all-risk indication after PARTNER 3 and Evolut Low Risk…
        choices:
          - Demonstrated TAVR non-inferior/superior to SAVR for low-risk severe aortic stenosis at 1-2 yr; FDA 2019; ~80% AVR cases now TAVR
          - TAVR consistently inferior to SAVR for mortality and stroke across all risk strata
          - Regulatory withdrawal of all-risk TAVR indication after long-term durability concerns
          - TAVR remains restricted to surgically inoperable severe aortic stenosis patients
        correctAnswer: Demonstrated TAVR non-inferior/superior to SAVR for low-risk severe aortic stenosis at 1-2 yr; FDA 2019; ~80% AVR cases now TAVR
        rationale:
          pt: 'TAVR evolution: 2002 Cribier first-in-human; 2011 PARTNER 1B inoperable; 2014-2016 high → intermediate-risk; 2019 PARTNER 3 (balloon-expandable Sapien 3 Edwards) + Evolut Low Risk (self-expanding Medtronic) — non-inferior/superior SAVR low-risk severe AS at 1-2y composite death/stroke. FDA aprovou all-risk ago/2019. ~80%+ AVR cases hoje TAVR. Long-term durability ≥5y comparável SAVR. Bicuspid AS expansion. TAVR-in-TAVR redo. Conduction abnormalities → PPM ~10%. Mitral TAVR/transcatheter (M3, Tendyne, Sapien M3) Phase 3. Tricuspid TEER (TriClip 2024).'
          en: 'TAVR evolution: 2002 Cribier first-in-human; 2011 PARTNER 1B inoperable; 2014-2016 high → intermediate-risk; 2019 PARTNER 3 (balloon-expandable Sapien 3 Edwards) + Evolut Low Risk (self-expanding Medtronic) — non-inferior/superior to SAVR for low-risk severe AS at 1-2y composite death/stroke. FDA approved all-risk Aug 2019. ~80%+ AVR cases today are TAVR. Long-term durability ≥5y comparable to SAVR. Bicuspid AS expansion. TAVR-in-TAVR redo. Conduction abnormalities → PPM ~10%. Transcatheter mitral (M3, Tendyne, Sapien M3) Phase 3. Tricuspid TEER (TriClip 2024).'
        objectives: [TAVR all-risk]
      - type: choice
        difficulty: 5
        question:
          pt: Watchman (Boston Scientific) e Amplatzer Amulet (Abbott) são dispositivos para…
          en: Watchman (Boston Scientific) and Amplatzer Amulet (Abbott) are devices for…
        choices:
          - LAA (left atrial appendage) closure in non-valvular AFib patients with high bleeding risk on anticoagulation; alternative to lifelong DOAC/warfarin
          - Conventional pacing function only without LAA closure capability
          - Replace implantable cardioverter-defibrillator function with anti-arrhythmic delivery
          - Indication restricted to heart failure populations rather than AFib stroke prevention
        correctAnswer: LAA (left atrial appendage) closure in non-valvular AFib patients with high bleeding risk on anticoagulation; alternative to lifelong DOAC/warfarin
        rationale:
          pt: 'LAAC (left atrial appendage closure): >90% AFib thrombus origina LAA. Watchman (BSCI) primeiro FDA 2015 PROTECT-AF/PREVAIL trials. Watchman FLX 2020 next-gen. Amulet (Abbott) FDA 2021 head-to-head trial. Indicado AFib não-valvar com bleeding risk alto/intolerância anticoagulation a longo prazo. ~6 mo DAPT/DOAC pós-procedure depois aspirin. CHAMPION-AF 2024 (concorrent DOAC) results pendentes. Concerns: peri-device leak, device-related thrombus, ~1-2% major periprocedural. Volumes crescentes — alternative DOAC growing. EU PRACTICE-AF.'
          en: 'LAAC (left atrial appendage closure): >90% AFib thrombi originate from LAA. Watchman (BSCI) first FDA 2015 from PROTECT-AF/PREVAIL trials. Watchman FLX 2020 next-gen. Amulet (Abbott) FDA 2021 head-to-head trial. Indicated for non-valvular AFib with high bleeding risk/long-term anticoagulation intolerance. ~6 mo DAPT/DOAC post-procedure then aspirin. CHAMPION-AF 2024 (concurrent DOAC) results pending. Concerns: peri-device leak, device-related thrombus, ~1-2% major periprocedural. Growing volumes — alternative to DOAC. EU PRACTICE-AF.'
        objectives: [Watchman LAAC]
      - type: choice
        difficulty: 5
        question:
          pt: MitraClip (Abbott TEER edge-to-edge repair) e novo PASCAL (Edwards) são para…
          en: MitraClip (Abbott TEER edge-to-edge repair) and newer PASCAL (Edwards) are for…
        choices:
          - Severe symptomatic mitral regurgitation (primary degenerative high-risk surgery; secondary functional with HF — COAPT trial); transcatheter alternative
          - Approved exclusively for transcatheter aortic valve replacement, not mitral repair
          - Open surgical repair remains the sole intervention without transcatheter alternative
          - Indication limited to pediatric stroke populations under specialty supervision
        correctAnswer: Severe symptomatic mitral regurgitation (primary degenerative high-risk surgery; secondary functional with HF — COAPT trial); transcatheter alternative
        rationale:
          pt: 'TEER (transcatheter edge-to-edge repair): MitraClip primeiro FDA 2013 EVEREST II degenerative MR. Functional MR + HFrEF — COAPT trial 2018 (NEJM Stone et al) demonstrou redução HF hospitalization 47% e mortality vs GDMT alone. MITRA-FR não positiva (controversia patient selection). PASCAL (Edwards) 2022 FDA aprovou — independent leaflet capture, alternative MitraClip. CLASP-IID head-to-head non-inferiority. Tricuspid TEER: TriClip (Abbott) FDA abr/2024 TRILUMINATE trial; PASCAL Tricuspid evolução.'
          en: 'TEER (transcatheter edge-to-edge repair): MitraClip first FDA 2013 from EVEREST II degenerative MR. Functional MR + HFrEF — COAPT trial 2018 (NEJM Stone et al) demonstrated 47% HF hospitalization reduction and mortality vs GDMT alone. MITRA-FR was not positive (patient selection controversy). PASCAL (Edwards) 2022 FDA approved — independent leaflet capture, alternative to MitraClip. CLASP-IID head-to-head non-inferiority. Tricuspid TEER: TriClip (Abbott) FDA Apr 2024 TRILUMINATE trial; PASCAL Tricuspid evolving.'
        objectives: [TEER mitral]
      - type: choice
        difficulty: 5
        question:
          pt: Tafamidis (Vyndaqel/Vyndamax Pfizer FDA 2019) atua em ATTR-CM (transthyretin amyloid cardiomyopathy) por…
          en: Tafamidis (Vyndaqel/Vyndamax Pfizer FDA 2019) acts in ATTR-CM (transthyretin amyloid cardiomyopathy) by…
        choices:
          - TTR tetramer stabilizer; ATTR-ACT trial reduced all-cause mortality 30% and HF hospitalizations; first ATTR-CM disease-modifying drug
          - Iron-chelator class molecule similar to deferasirox without TTR stabilization
          - Generic anti-inflammatory agent without amyloidogenesis-modifying activity
          - Direct substitute for orthotopic cardiac transplantation in advanced amyloidosis
        correctAnswer: TTR tetramer stabilizer; ATTR-ACT trial reduced all-cause mortality 30% and HF hospitalizations; first ATTR-CM disease-modifying drug
        rationale:
          pt: 'ATTR cardiomyopathy: misfolded transthyretin (wild-type ATTRwt — formerly senile cardiac amyloidosis — ou hereditary ATTRv mutations) deposits cardiac. Subdiagnosticada. Pyrophosphate scintigraphy + monoclonal protein exclusion + biopsy se necessário. Tafamidis: TTR tetramer stabilizer evita dissociação monomer → reduces amyloidogenesis. ATTR-ACT (NEJM 2018) HR mortality 0.70, HF hospitalization HR 0.68. Custo $225k/yr lista (most expensive cardiology drug). Acoramidis (Attruby BridgeBio FDA nov/2024) similar mechanism, cheaper. Vutrisiran (Amvuttra siRNA) HELIOS-B 2024 demonstrou mortality benefit ATTR-CM.'
          en: 'ATTR cardiomyopathy: misfolded transthyretin (wild-type ATTRwt — formerly senile cardiac amyloidosis — or hereditary ATTRv mutations) deposits in heart. Underdiagnosed. Pyrophosphate scintigraphy + monoclonal protein exclusion + biopsy if needed. Tafamidis: TTR tetramer stabilizer prevents monomer dissociation → reduces amyloidogenesis. ATTR-ACT (NEJM 2018) HR mortality 0.70, HF hospitalization HR 0.68. Cost $225k/yr list (most expensive cardiology drug). Acoramidis (Attruby BridgeBio FDA Nov 2024) similar mechanism, cheaper. Vutrisiran (Amvuttra siRNA) HELIOS-B 2024 demonstrated mortality benefit in ATTR-CM.'
        objectives: [Tafamidis ATTR]
      - type: choice
        difficulty: 5
        question:
          pt: Em LBBAP (left bundle branch area pacing) vs CRT-D para HFrEF + LBBB, evidence atual sugere…
          en: In LBBAP (left bundle branch area pacing) vs CRT-D for HFrEF + LBBB, current evidence suggests…
        choices:
          - LBBAP achieves physiologic pacing with narrower QRS, comparable/superior LVEF improvement vs traditional biventricular CRT in observational/randomized data
          - Limited to teórico sem evidence without broader clinical applicability or alternative pathways
          - LBBAP universally contraindicated due to lead-perforation and capture-loss risk
          - Has replaced all open cardiac surgery for valve and structural disease
        correctAnswer: LBBAP achieves physiologic pacing with narrower QRS, comparable/superior LVEF improvement vs traditional biventricular CRT in observational/randomized data
        rationale:
          pt: 'CRT (cardiac resynchronization therapy): biventricular pacing tradicional via coronary sinus + RV lead. Limitações: LV lead failure ~10%, non-responders ~30%. CSP (conduction system pacing) emergiu — His bundle pacing (HBP) e LBBAP (left bundle branch area pacing) com Vivasudh/Huang. LBBAP achieves narrower QRS, mais physiologic activation. RCTs (LBBP-RESYNC, LeftvsLeft) e observacionais demonstram comparable/superior LVEF improvement vs BiV-CRT em LBBB HFrEF. HOT-CRT randomized hot, ongoing. ESC/HRS guidelines 2023 reconhecem LBBAP option. Stylet-driven Medtronic 3830 lead. Long-term lead durability data acumulando.'
          en: 'CRT (cardiac resynchronization therapy): traditional biventricular pacing via coronary sinus + RV lead. Limitations: ~10% LV lead failure, ~30% non-responders. CSP (conduction system pacing) emerged — His bundle pacing (HBP) and LBBAP (left bundle branch area pacing) with Vivasudh/Huang. LBBAP achieves narrower QRS, more physiologic activation. RCTs (LBBP-RESYNC, LeftvsLeft) and observational studies show comparable/superior LVEF improvement vs BiV-CRT in LBBB HFrEF. HOT-CRT randomized ongoing. ESC/HRS 2023 guidelines recognize LBBAP as an option. Stylet-driven Medtronic 3830 lead. Long-term lead durability data accumulating.'
        objectives: [LBBAP]
      - type: choice
        difficulty: 5
        question:
          pt: Em PFA (pulsed field ablation) para AFib, advantage vs RF/cryo ablation tradicional é…
          en: In PFA (pulsed field ablation) for AFib, advantage vs traditional RF/cryo ablation is…
        choices:
          - Tissue selectivity (cardiomyocytes vs esophagus/phrenic nerve/pulmonary vein); reduces thermal complications; shorter procedure times
          - Limited to teórico sem aprovação without broader clinical applicability or alternative pathways
          - Higher periprocedural complication rate than radiofrequency or cryoballoon ablation
          - Approved only for HFrEF symptomatic relief with no AFib indication
        correctAnswer: Tissue selectivity (cardiomyocytes vs esophagus/phrenic nerve/pulmonary vein); reduces thermal complications; shorter procedure times
        rationale:
          pt: 'PFA (pulsed field ablation): nonthermal energy aplica brief high-voltage pulses (~1-2 kV) → irreversible electroporation cardiomyocytes (susceptíveis), com selectivity sparing esophagus, phrenic nerve, pulmonary veins. ADVENT trial (NEJM 2023) Farapulse (Boston Scientific FDA dez/2023) — non-inferior vs thermal AFib ablation, fewer complications. Medtronic PulseSelect (FDA dez/2023). Abbott Volt PFA Phase 3. Procedure times ~30-60 min vs 2+h. Adoption rapid. Concerns: late-onset complications (coronary spasm reported), durability lesions, PV stenosis, hemolysis. Substantial pivot field eletrofisiologia.'
          en: 'PFA (pulsed field ablation): nonthermal energy applies brief high-voltage pulses (~1-2 kV) → irreversible electroporation of cardiomyocytes (susceptible), sparing esophagus, phrenic nerve, pulmonary veins via tissue selectivity. ADVENT trial (NEJM 2023) Farapulse (Boston Scientific FDA Dec 2023) — non-inferior vs thermal AFib ablation, fewer complications. Medtronic PulseSelect (FDA Dec 2023). Abbott Volt PFA Phase 3. Procedure times ~30-60 min vs 2+h. Rapid adoption. Concerns: late-onset complications (coronary spasm reported), lesion durability, PV stenosis, hemolysis. Substantial electrophysiology pivot.'
        objectives: [PFA AFib]
  - title:
      pt: Página 2 — Devices, AI, Lifestyle
      en: Page 2 — Devices, AI, Lifestyle
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Apple Watch ECG (FDA 2018) e photoplethysmography AFib detection demonstraram em Apple Heart Study…
          en: Apple Watch ECG (FDA 2018) and photoplethysmography AFib detection demonstrated in Apple Heart Study…
        choices:
          - Wearable PPG identifies irregular pulse with ~84% PPV vs gold standard ECG patch; consumer-grade screening expanding undiagnosed AFib detection
          - Accuracy too low to support any clinical or screening application
          - Carries universal medical-grade approval equivalent to ECG patches or Holter monitors
          - Direct substitute for cardiologist replacing it as the standard of care
        correctAnswer: Wearable PPG identifies irregular pulse with ~84% PPV vs gold standard ECG patch; consumer-grade screening expanding undiagnosed AFib detection
        rationale:
          pt: 'Apple Heart Study (Stanford, NEJM 2019, Perez et al.): ~419k participants, irregular pulse PPG notification → ECG patch confirmation. PPV ~84% AFib em those notified. Apple Watch Series 4+ ECG single-lead FDA 2018. Fitbit AFib detection FDA 2022. Limitations: ~0.5% notification rate, false positives, low PPV em <55y. Concerns over-medicalization low-risk young, healthcare burden. Recent: Watch detect possible signs sleep apnea (Series 9+), high/low HR, fall detection. AliveCor KardiaMobile 6L 6-lead. Loop monitors ICM (Reveal LINQ, Confirm Rx) implantable. Wearable revolution still early.'
          en: 'Apple Heart Study (Stanford, NEJM 2019, Perez et al.): ~419k participants, irregular PPG pulse notification → ECG patch confirmation. PPV ~84% for AFib among those notified. Apple Watch Series 4+ ECG single-lead FDA 2018. Fitbit AFib detection FDA 2022. Limitations: ~0.5% notification rate, false positives, low PPV in <55y. Concerns over-medicalization of low-risk young, healthcare burden. Recent: Watch detects possible signs of sleep apnea (Series 9+), high/low HR, fall detection. AliveCor KardiaMobile 6L 6-lead. Implantable loop monitors ICM (Reveal LINQ, Confirm Rx). Wearable revolution still early.'
        objectives: [Apple Watch AFib]
      - type: choice
        difficulty: 5
        question:
          pt: Em AI ECG, Mayo Clinic (Attia, Friedman et al.) demonstrou que CNN aplicada single-lead/12-lead ECG…
          en: In AI ECG, Mayo Clinic (Attia, Friedman et al.) demonstrated that CNN applied to single-lead/12-lead ECG…
        choices:
          - Detects asymptomatic LV dysfunction, AFib in sinus rhythm, age/sex, pulmonary HTN, hypertrophic cardiomyopathy from sinus ECG; AUC 0.90+ multiple tasks
          - No demonstrated signal real in current evidence base or guideline framework
          - Limited to substitui ECHO without broader clinical applicability or alternative pathways
          - Regulatory approval has been withdrawn following adverse post-market findings
        correctAnswer: Detects asymptomatic LV dysfunction, AFib in sinus rhythm, age/sex, pulmonary HTN, hypertrophic cardiomyopathy from sinus ECG; AUC 0.90+ multiple tasks
        rationale:
          pt: 'Mayo Clinic AI ECG: CNN treinado em milhões ECGs detecta features invisíveis humanos — asymptomatic LV dysfunction (Attia Nat Med 2019, AUC 0.93), prevalent/incident AFib em sinus rhythm (Attia Lancet 2019), age/sex prediction, pulmonary HTN, HCM, valvular heart disease. Anumana spinoff comercializa. Cleveland Clinic, Geisinger, Sansum similar pipelines. EAGLE trial (Yao et al JACC 2021) cluster RCT — AI-ECG primary care detection asymptomatic LVD ↑. FDA AI/ML guidance evoluindo. Future: smartphone-grade single-lead expansion accessibility.'
          en: 'Mayo Clinic AI ECG: CNN trained on millions of ECGs detects features invisible to humans — asymptomatic LV dysfunction (Attia Nat Med 2019, AUC 0.93), prevalent/incident AFib in sinus rhythm (Attia Lancet 2019), age/sex prediction, pulmonary HTN, HCM, valvular heart disease. Anumana spinoff commercializes. Cleveland Clinic, Geisinger, Sansum similar pipelines. EAGLE trial (Yao et al JACC 2021) cluster RCT — AI-ECG primary care detection of asymptomatic LVD ↑. FDA AI/ML guidance evolving. Future: smartphone-grade single-lead expansion accessibility.'
        objectives: [AI ECG]
      - type: choice
        difficulty: 5
        question:
          pt: HeartMate 3 (Abbott) é LVAD continuous-flow magnetically levitated rotor com…
          en: HeartMate 3 (Abbott) is a continuous-flow magnetically levitated rotor LVAD with…
        choices:
          - 'Reduced pump thrombosis vs HM2; MOMENTUM 3 trial 5y data: ~58% survival, fewer strokes/reoperations than HMII; bridge-to-transplant + destination therapy'
