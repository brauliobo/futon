        correctAnswer: Surgical bypass with adequate single-segment GSV superior to endovascular for major adverse limb events; cohort 2 (no GSV) endovascular non-inferior
        rationale:
          pt: 'BEST-CLI trial (NEJM 2022, Farber et al.): primeiro grande RCT comparing surgical bypass (greater saphenous vein conduit) vs endovascular CLTI. Cohort 1 (adequate GSV available): bypass superior MALE composite HR 0.68. Cohort 2 (no adequate GSV): endovascular non-inferior. Implications: revasculariza estratégia individualizada; surgical patency longa-prazo melhor quando GSV disponível. Concurrent: BASIL-2 trial favored endovascular (controvérsia). Atual practice: shared decision MDT, BEST-CLI confirma role bypass importante. Drug-coated balloons paclitaxel mortality signal 2018 → resolved 2024 FDA acquittal. CLTI ↑ prevalence + amputation rates undertreated.'
          en: 'BEST-CLI trial (NEJM 2022, Farber et al.): first large RCT comparing surgical bypass (greater saphenous vein conduit) vs endovascular for CLTI. Cohort 1 (adequate GSV available): bypass superior MALE composite HR 0.68. Cohort 2 (no adequate GSV): endovascular non-inferior. Implications: revascularization strategy individualized; surgical long-term patency better when GSV available. Concurrent: BASIL-2 trial favored endovascular (controversy). Current practice: shared decision MDT, BEST-CLI confirms important role for bypass. Paclitaxel drug-coated balloons mortality signal 2018 → resolved 2024 FDA acquittal. CLTI ↑ prevalence + amputation rates undertreated.'
