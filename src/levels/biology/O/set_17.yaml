          en: BCG geographic variation (Fine, Lancet 1995): ~80% adult efficacy in UK and north; ~0% in tropical India. Hypotheses: environmental mycobacteria pre-immunizing and masking BCG; BCG strain variability; helminth co-infection. Current frontier: new vaccines (M72/AS01E, MTBVAC, RBM200).
