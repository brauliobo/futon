title:
  pt: 'Biópsia Líquida e DNA Tumoral Circulante'
  en: 'Liquid Biopsy and Circulating Tumor DNA'
level: O
subject: biology
objectives:
  - 'Compreender ctDNA, CTCs, exossomos e cfDNA'
  - 'Reconhecer plataformas (Galleri, Guardant360, Signatera)'
  - 'Identificar usos (MCED, MRD, monitoramento, terapia-guia)'
  - 'Avaliar limites técnicos e clínicos'
difficulty: 5
authorNotes: |
  Frontier liquid biopsy. Mandel & Métais 1948 cfDNA descrita. Stroun 1989 cfDNA tumoral.
  Bert Vogelstein/Luis Diaz/Nick Papadopoulos (Hopkins) ctDNA paradigm. Companies: Grail
  (Galleri MCED methylation, ex-Illumina spinoff Bezos/Gates), Guardant Health (Guardant360
  CDx, Reveal MRD), Foundation Medicine (Roche, FoundationOne Liquid CDx), Natera (Signatera
  bespoke MRD), Personalis (NeXT Personal), Inivata (RaDaR), Adaptive Biotechnologies
  (clonoSEQ heme MRD). PATHFINDER trial Galleri 2023, NHS-Galleri 140k 2024 readout.
  IDH1/IDH2, EGFR T790M, KRAS G12C — actionable mutations from blood. Methylation:
  Vailaya/Liu Zhejiang, Klein/Grail. cfRNA emergent. Tumor educated platelets (TEPs).
example:
  question:
    pt: 'Em 1948, Mandel e Métais descreveram pela primeira vez o que viria a ser a base da biópsia líquida. O que era?'
    en: 'In 1948, Mandel and Métais first described what would become the basis of liquid biopsy. What was it?'
  choices:
    - 'Ácidos nucleicos livres de células circulantes no plasma humano (cfDNA)'
    - 'Linfócitos T citotóxicos circulantes em pacientes com câncer terminal'
    - 'Exossomos lipídicos com microRNAs específicos de tumor'
    - 'Anticorpos onco-específicos detectáveis em soro de pacientes oncológicos'
  correctAnswer: 'Ácidos nucleicos livres de células circulantes no plasma humano (cfDNA)'
  rationale:
    pt: 'Mandel & Métais (CR Acad Sci Paris 1948) detectaram cfDNA em plasma humano décadas antes de qualquer aplicação clínica. Stroun (1989) confirmou origem tumoral de fração do cfDNA — base molecular da biópsia líquida moderna.'
    en: 'Mandel & Métais (CR Acad Sci Paris 1948) detected cfDNA in human plasma decades before any clinical use. Stroun (1989) confirmed tumor origin for a fraction of cfDNA — molecular basis of modern liquid biopsy.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — cfDNA, ctDNA e plataformas'
      en: 'Page 1 — cfDNA, ctDNA, and platforms'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'O ctDNA (DNA tumoral circulante) representa que fração típica do cfDNA total em pacientes com câncer?'
          en: 'ctDNA (circulating tumor DNA) represents what typical fraction of total cfDNA in cancer patients?'
        choices:
          - 'Tipicamente <1% em doença inicial, podendo atingir 10%+ em metastática avançada'
          - 'Sempre >50% em qualquer estágio, facilitando detecção sem técnicas sensíveis'
          - 'Apenas 0.0001% mesmo em doença metastática terminal sem qualquer variação'
          - 'Exatamente 5% em todos os pacientes oncológicos por princípio biológico'
        correctAnswer: 'Tipicamente <1% em doença inicial, podendo atingir 10%+ em metastática avançada'
        rationale:
          pt: 'A fração de ctDNA varia enormemente: <0,1% em estágios I/II e MRD, 1-10% em metastáticos, >10% em alta carga. Por isso plataformas precisam de sensibilidade ppm — UMIs, métricas duplex, hibridização-captura, BEAMing.'
          en: 'ctDNA fraction varies widely: <0.1% in stage I/II and MRD, 1-10% in metastatic, >10% in high burden. Hence platforms need ppm sensitivity — UMIs, duplex metrics, hybrid-capture, BEAMing.'
        objectives: [Fração ctDNA]
      - type: choice
        difficulty: 5
        question:
          pt: 'Galleri (Grail) é teste MCED (Multi-Cancer Early Detection). Qual seu mecanismo central?'
          en: 'Galleri (Grail) is an MCED (Multi-Cancer Early Detection) test. What is its central mechanism?'
        choices:
          - 'Sequenciamento direcionado a metilação em ~100 mil regiões CpG do cfDNA, identificando câncer e tecido de origem'
          - 'Detecção de antígeno carcinoembriônico (CEA) sérico via ELISA padrão'
          - 'Citologia exfoliativa de células tumorais circulantes em centrifugação convencional'
          - 'Imageamento por PET-CT corporal anual sem qualquer biomarcador molecular'
        correctAnswer: 'Sequenciamento direcionado a metilação em ~100 mil regiões CpG do cfDNA, identificando câncer e tecido de origem'
        rationale:
          pt: 'Galleri analisa padrões de metilação CpG (assinaturas tecido-específicas + tumor-específicas) em cfDNA, com IA classificando: câncer presente? em qual tecido? PATHFINDER 2023 reportou PPV ~38%, especificidade 99,5%; NHS-Galleri (140k participantes) leu out 2024.'
          en: 'Galleri analyzes CpG methylation patterns (tissue-specific + tumor-specific signatures) in cfDNA, with AI classifying: cancer present? what tissue? PATHFINDER 2023 reported PPV ~38%, specificity 99.5%; NHS-Galleri (140k participants) read out Oct 2024.'
        objectives: [Galleri]
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito de "tumor-informed assay" (e.g. Signatera/Natera) consiste em…'
          en: 'A "tumor-informed assay" (e.g. Signatera/Natera) consists of…'
        choices:
          - 'Sequenciar tumor primário, desenhar painel personalizado de variantes e rastreá-las no cfDNA do paciente'
          - 'Aplicar painel fixo único para todos os pacientes oncológicos sem personalização'
          - 'Detectar apenas mutações em hotspots como KRAS G12D em todos os tumores'
          - 'Substituir tomografia por análise sérica não-personalizada'
        correctAnswer: 'Sequenciar tumor primário, desenhar painel personalizado de variantes e rastreá-las no cfDNA do paciente'
        rationale:
          pt: 'WES/WGS do tumor identifica ~16-50 SNVs específicas; painel mPCR ou capture personalizado é desenhado e aplicado em cfDNA pós-cirúrgico/pós-tratamento. Sensibilidade ~ppm. Signatera (Natera), RaDaR (Inivata), NeXT Personal (Personalis) competem nesse nicho.'
          en: 'WES/WGS of tumor identifies ~16-50 specific SNVs; a personalized mPCR or capture panel is designed and applied to post-surgery/treatment cfDNA. Sensitivity ~ppm. Signatera (Natera), RaDaR (Inivata), NeXT Personal (Personalis) compete in this niche.'
        objectives: [Tumor-informed]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "MRD" (Minimal Residual Disease) detectada por biópsia líquida prediz…'
          en: '"MRD" (Minimal Residual Disease) detected by liquid biopsy predicts…'
        choices:
          - 'Risco alto de recidiva em meses-anos antes de detecção radiológica clínica'
          - 'Apenas presença atual de doença sem qualquer valor preditivo futuro'
          - 'Resposta a quimioterapia neoadjuvante exclusivamente'
          - 'Diagnóstico definitivo de câncer primário sem necessidade de biópsia tecidual'
        correctAnswer: 'Risco alto de recidiva em meses-anos antes de detecção radiológica clínica'
        rationale:
          pt: 'MRD-positivo pós-cirurgia ou pós-quimio indica recidiva quase certa; lead time vs imagem é 6-24 meses. CRC, mama, pulmão, bexiga e outros têm dados robustos. Ensaios COBRA, CIRCULATE-Japan, IMvigor011 baseiam decisões adjuvantes em MRD.'
          en: 'MRD-positive post-surgery or post-chemo signals near-certain recurrence; lead time vs imaging is 6-24 months. CRC, breast, lung, bladder, and others have robust data. COBRA, CIRCULATE-Japan, IMvigor011 trials base adjuvant decisions on MRD.'
        objectives: [MRD]
      - type: choice
        difficulty: 5
        question:
          pt: 'Guardant360 e FoundationOne Liquid CDx são…'
          en: 'Guardant360 and FoundationOne Liquid CDx are…'
        choices:
          - 'Painéis hibridização-captura de centenas de genes em cfDNA com indicação de companion diagnostic'
          - 'Testes citogenéticos clássicos como cariótipo aplicados ao plasma sanguíneo'
          - 'Painéis somáticos baseados exclusivamente em microscopia confocal'
          - 'Triagens populacionais MCED para indivíduos assintomáticos sem câncer prévio'
        correctAnswer: 'Painéis hibridização-captura de centenas de genes em cfDNA com indicação de companion diagnostic'
        rationale:
          pt: 'Guardant360 (~80-700+ genes ao longo das versões) e FoundationOne Liquid CDx (~324 genes) usam hibridização-captura + UMI; geram perfil para terapia-guia (EGFR, ALK, ROS1, KRAS G12C, BRAF V600E etc.). FDA-aprovados como CDx para múltiplas indicações.'
          en: 'Guardant360 (~80-700+ genes across versions) and FoundationOne Liquid CDx (~324 genes) use hybrid-capture + UMI; produce profiles for therapy guidance (EGFR, ALK, ROS1, KRAS G12C, BRAF V600E, etc.). FDA-approved as CDx for multiple indications.'
        objectives: [Painéis CDx]
      - type: choice
        difficulty: 5
        question:
          pt: 'O cfDNA tem características de fragmentação que ajudam a inferir origem celular. Tamanho típico do fragmento é…'
          en: 'cfDNA has fragmentation features helping infer cell origin. Typical fragment size is…'
        choices:
          - '~166 pb, correspondente ao tamanho de um nucleossomo + linker'
          - '~1000 pb, equivalente a um cromossomo bacteriano completo'
          - '~10 pb, fragmentos minúsculos sem informação de cromatina'
          - '~1 Mb, blocos cromossômicos integrais não fragmentados'
        correctAnswer: '~166 pb, correspondente ao tamanho de um nucleossomo + linker'
        rationale:
          pt: 'cfDNA é apoptótico ~166 bp (nucleossomo 147 + linker 20). ctDNA tende a ter fragmentos mais curtos (~144 bp); fragmentômica (DELFI, Dennis Lo) explora distribuição de tamanhos como biomarcador independente da sequência.'
          en: 'cfDNA is apoptotic ~166 bp (nucleosome 147 + linker 20). ctDNA tends to be shorter (~144 bp); fragmentomics (DELFI, Dennis Lo) leverages size distributions as a biomarker independent of sequence.'
        objectives: [Fragmentação]
      - type: choice
        difficulty: 5
        question:
          pt: 'Dennis Lo (CUHK Hong Kong) é pioneiro em biópsia líquida principalmente por…'
          en: 'Dennis Lo (CUHK Hong Kong) is a liquid-biopsy pioneer mainly because of…'
        choices:
          - 'Detectar DNA fetal em plasma materno (NIPT) — paradigma fundador estendido a câncer'
          - 'Inventar a tecnologia BEAMing de Vogelstein no Hopkins original'
          - 'Comercializar o teste Galleri da Grail nos EUA com FDA breakthrough'
          - 'Produzir os primeiros painéis Guardant360 na Califórnia em 2014'
        correctAnswer: 'Detectar DNA fetal em plasma materno (NIPT) — paradigma fundador estendido a câncer'
        rationale:
          pt: 'Lo (Lancet 1997) detectou DNA Y fetal em plasma materno, fundando NIPT (teste pré-natal não invasivo); o paradigma — ácidos nucleicos circulantes de origem alheia — estendeu-se naturalmente a transplante (dd-cfDNA) e câncer (ctDNA). Lasker 2022.'
          en: 'Lo (Lancet 1997) detected fetal Y DNA in maternal plasma, founding NIPT (non-invasive prenatal testing); the paradigm — circulating nucleic acids of foreign origin — extended naturally to transplant (dd-cfDNA) and cancer (ctDNA). Lasker 2022.'
        objectives: [Dennis Lo]
      - type: choice
        difficulty: 5
        question:
          pt: 'Bert Vogelstein, Luis Diaz e equipe (Hopkins) introduziram a tecnologia "BEAMing" para…'
          en: 'Bert Vogelstein, Luis Diaz and team (Hopkins) introduced "BEAMing" for…'
        choices:
          - 'Quantificação ultra-sensível de mutações raras em ctDNA via PCR digital com microbeads'
          - 'Reconstrução automatizada de cariótipo por análise de fluorescência multicolor'
          - 'Sequenciamento de RNA single-cell em microfluídica nos primeiros chips'
          - 'Triagem fenotípica de pequenas moléculas em screening farmacêutico'
        correctAnswer: 'Quantificação ultra-sensível de mutações raras em ctDNA via PCR digital com microbeads'
        rationale:
          pt: 'BEAMing = Beads, Emulsions, Amplification, Magnetics (Diehl/Vogelstein 2003): emulsões single-molecule + amplificação em microbeads + análise por citometria. Permitiu detectar mutações ~0,01% em ctDNA — predecessora conceitual de PCR digital atual e UMI-based NGS.'
          en: 'BEAMing = Beads, Emulsions, Amplification, Magnetics (Diehl/Vogelstein 2003): single-molecule emulsions + microbead amplification + flow cytometry analysis. Enabled detection of ~0.01% mutations in ctDNA — conceptual predecessor of today''s digital PCR and UMI-based NGS.'
        objectives: [BEAMing]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em câncer de pulmão não-pequenas células (NSCLC), uma aplicação consagrada de ctDNA é…'
          en: 'In non-small cell lung cancer (NSCLC), an established ctDNA application is…'
        choices:
          - 'Detectar EGFR T790M e C797S como mecanismos de resistência a TKIs sem rebiopsiar'
          - 'Substituir totalmente cintilografia óssea por análise sérica de cálcio'
          - 'Diagnóstico inicial primário sem qualquer biópsia tecidual confirmatória'
          - 'Triagem populacional anual para todos adultos > 50 anos sem fator de risco'
        correctAnswer: 'Detectar EGFR T790M e C797S como mecanismos de resistência a TKIs sem rebiopsiar'
        rationale:
          pt: 'T790M emerge em ~50% dos pacientes EGFR-mutados em uso de gefitinib/erlotinib; pode ser detectada em ctDNA, evitando rebiópsia pulmonar e guiando troca para osimertinib. C797S em uso de osimertinib indica progressão e guia para cetlimab/sotorasib.'
          en: 'T790M emerges in ~50% of EGFR-mutated patients on gefitinib/erlotinib; detectable in ctDNA, sparing repeat lung biopsy and guiding switch to osimertinib. C797S on osimertinib signals progression and guides to cetlimab/sotorasib.'
        objectives: [EGFR T790M]
      - type: choice
        difficulty: 5
        question:
          pt: 'Limitação técnica significativa de cfDNA em câncer cerebral é…'
          en: 'A significant technical limitation of cfDNA in brain cancer is…'
        choices:
          - 'Liberação reduzida pela barreira hematoencefálica, dificultando detecção em estágios iniciais'
          - 'Concentração 100x maior que em outros cânceres por hipervascularização'
          - 'Interferência total da hemoglobina sérica em qualquer ensaio molecular'
          - 'Barreira completa que exige análise de líquor sempre, sem alternativa'
        correctAnswer: 'Liberação reduzida pela barreira hematoencefálica, dificultando detecção em estágios iniciais'
        rationale:
          pt: 'Tumores cerebrais (glioma, GBM) liberam pouco ctDNA na corrente sanguínea pela BHE; análise de cfDNA em líquor (Pentsova, MSK) tem rendimento muito superior. Daí pesquisa em metilomas de cfDNA, EVs e proteínas para suprir.'
          en: 'Brain tumors (glioma, GBM) release little ctDNA into blood through the BBB; cfDNA in CSF (Pentsova, MSK) has much higher yield. Hence research in cfDNA methylomes, EVs, and proteins to compensate.'
        objectives: [BHE limitação]
  - title:
      pt: 'Página 2 — Modalidades alternativas e perspectivas'
      en: 'Page 2 — Alternative modalities and outlook'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Células tumorais circulantes (CTCs) detectadas pelo CellSearch (Veridex/Menarini) usam qual marcador para enriquecimento?'
          en: 'Circulating tumor cells (CTCs) detected by CellSearch (Veridex/Menarini) use which marker for enrichment?'
        choices:
          - 'EpCAM (epithelial cell adhesion molecule), excluindo células EMT que perderam o marcador'
          - 'CD45 pan-leucocitário como marcador positivo de seleção primária'
          - 'CD44 como marcador universal de células-tronco tumorais'
          - 'PD-L1 como marcador exclusivo das CTCs no sangue periférico'
        correctAnswer: 'EpCAM (epithelial cell adhesion molecule), excluindo células EMT que perderam o marcador'
        rationale:
          pt: 'CellSearch (FDA 2004 para mama, próstata, cólon metastáticos) usa beads anti-EpCAM. Limitação: células em transição epitélio-mesenquimal (EMT) perdem EpCAM e escapam — métodos label-free (Vortex, Parsortix por tamanho) tentam suprir.'
          en: 'CellSearch (FDA 2004 for metastatic breast, prostate, colon) uses anti-EpCAM beads. Limitation: cells in epithelial-mesenchymal transition (EMT) lose EpCAM and escape — label-free methods (Vortex, Parsortix by size) try to fill the gap.'
        objectives: [CellSearch CTC]
      - type: choice
        difficulty: 5
        question:
          pt: 'Exossomos (vesículas extracelulares) como biomarcadores oncológicos têm vantagem de…'
          en: 'Exosomes (extracellular vesicles) as oncologic biomarkers have the advantage of…'
        choices:
          - 'Encapsular e proteger ácidos nucleicos e proteínas tumorais da degradação no plasma'
          - 'Possuir mil vezes mais ctDNA que cfDNA total não-encapsulado'
          - 'Atravessar a barreira hematoencefálica em 100% dos casos pediátricos'
          - 'Conter exclusivamente proteínas estruturais sem qualquer ácido nucleico'
        correctAnswer: 'Encapsular e proteger ácidos nucleicos e proteínas tumorais da degradação no plasma'
        rationale:
          pt: 'Exossomos (~30-150 nm) protegem RNA, DNA e proteínas da degradação por nucleases/proteases plasmáticas. Plataformas: ExoDx (Bio-Techne) para próstata (FDA 2019), nanopore single-vesicle, ExoVita. RNA exossomal complementa ctDNA, especialmente em tumor cerebral e pancreático.'
          en: 'Exosomes (~30-150 nm) protect RNA, DNA, and proteins from plasma nuclease/protease degradation. Platforms: ExoDx (Bio-Techne) for prostate (FDA 2019), single-vesicle nanopore, ExoVita. Exosomal RNA complements ctDNA, especially in brain and pancreatic cancer.'
        objectives: [Exossomos]
      - type: choice
        difficulty: 5
        question:
          pt: 'Plaquetas tumor-educadas (TEPs), descritas por Tom Würdinger (VUmc), capturam…'
          en: 'Tumor-educated platelets (TEPs), described by Tom Würdinger (VUmc), capture…'
        choices:
          - 'mRNAs sequestrados pelas plaquetas após interação com células tumorais'
          - 'DNA tumoral genômico empacotado em grânulos plaquetários'
          - 'Apenas microRNAs específicos de leucemia mielóide crônica'
          - 'Anticorpos onco-específicos do paciente em fase aguda da doença'
        correctAnswer: 'mRNAs sequestrados pelas plaquetas após interação com células tumorais'
        rationale:
          pt: 'Würdinger (Cancer Cell 2015) mostrou que plaquetas captam mRNAs liberados por tumor (especialmente em microvesículas) e os concentram. Análise RNA-seq de TEPs distingue cânceres com >95% acurácia em coortes — promissor mas exige maior validação em prospectivos.'
          en: 'Würdinger (Cancer Cell 2015) showed platelets take up tumor-released mRNAs (especially in microvesicles) and concentrate them. TEP RNA-seq distinguishes cancers with >95% accuracy in cohorts — promising but needs prospective validation.'
        objectives: [TEPs]
      - type: choice
        difficulty: 5
        question:
          pt: 'O dd-cfDNA (donor-derived cell-free DNA) tem aplicação consagrada em qual contexto não-oncológico?'
          en: 'dd-cfDNA (donor-derived cell-free DNA) has an established application in which non-oncology context?'
        choices:
          - 'Monitoramento de rejeição em transplante de órgão sólido (rim, coração, pulmão)'
          - 'Diagnóstico de hepatite B oculta sem qualquer marcador sorológico'
          - 'Triagem de fibrose cística pediátrica em cordão umbilical'
          - 'Confirmação de paternidade em medicina legal forense'
        correctAnswer: 'Monitoramento de rejeição em transplante de órgão sólido (rim, coração, pulmão)'
        rationale:
          pt: 'dd-cfDNA (CareDx AlloSure, Eurofins Viracor) quantifica DNA do doador no plasma do recipiente — frações elevadas correlacionam com rejeição/dano do enxerto, evitando biópsias invasivas. Aprovado em transplante renal e cardíaco; pulmonar em estudo.'
          en: 'dd-cfDNA (CareDx AlloSure, Eurofins Viracor) quantifies donor DNA in recipient plasma — elevated fractions correlate with rejection/graft injury, avoiding invasive biopsies. Approved for kidney and heart transplant; lung in trials.'
        objectives: [dd-cfDNA]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "tumor mutational burden" (TMB) inferida de cfDNA é usada para…'
          en: 'Tumor mutational burden (TMB) inferred from cfDNA is used for…'
        choices:
          - 'Predizer resposta a inibidores de checkpoint (anti-PD-1/PD-L1) sem necessidade de biópsia tecidual'
          - 'Quantificar carga viral em hepatocarcinoma associado a HBV'
          - 'Diagnóstico molecular primário substituindo histologia'
          - 'Estimar idade biológica do paciente comparada à cronológica'
        correctAnswer: 'Predizer resposta a inibidores de checkpoint (anti-PD-1/PD-L1) sem necessidade de biópsia tecidual'
        rationale:
          pt: 'bTMB (Foundation Liquid, Guardant360 TissueNext) estima TMB a partir de cfDNA; alto bTMB correlaciona com resposta a anti-PD-1 (pembrolizumab tem indicação tumor-agnóstica TMB-H ≥10 mut/Mb desde 2020). Concordância sangue-tecido ~70-80%; vantagem é ausência de tecido suficiente.'
          en: 'bTMB (Foundation Liquid, Guardant360 TissueNext) estimates TMB from cfDNA; high bTMB correlates with anti-PD-1 response (pembrolizumab has tumor-agnostic TMB-H ≥10 mut/Mb indication since 2020). Blood-tissue concordance ~70-80%; advantage is no sufficient tissue needed.'
        objectives: [bTMB]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "Clonal Hematopoiesis of Indeterminate Potential" (CHIP) é uma fonte importante de ruído em biópsia líquida porque…'
          en: '"Clonal Hematopoiesis of Indeterminate Potential" (CHIP) is a major noise source in liquid biopsy because…'
        choices:
          - 'Mutações em DNMT3A, TET2, ASXL1 em hematopoiéticas geram VAFs detectáveis confundíveis com tumor'
          - 'Aumenta a fração de ctDNA real, distorcendo todas as métricas para cima'
          - 'É exclusiva de pacientes oncológicos, eliminando-se em controles saudáveis'
          - 'Bloqueia totalmente a liberação de cfDNA tumoral pelo plasma'
        correctAnswer: 'Mutações em DNMT3A, TET2, ASXL1 em hematopoiéticas geram VAFs detectáveis confundíveis com tumor'
        rationale:
          pt: 'CHIP afeta ~10% adultos >70 anos: clones hematopoiéticos com mutações em DNMT3A/TET2/ASXL1/JAK2 contribuem cfDNA de neutrófilos. Painéis ctDNA detectam essas variantes — exigindo controle paralelo de buffy coat para diferenciar CHIP de tumor.'
          en: 'CHIP affects ~10% adults >70: hematopoietic clones with DNMT3A/TET2/ASXL1/JAK2 mutations contribute neutrophil cfDNA. ctDNA panels detect these variants — requiring parallel buffy-coat control to distinguish CHIP from tumor.'
        objectives: [CHIP]
      - type: choice
        difficulty: 5
        question:
          pt: 'A regulamentação de testes LDT (Laboratory-Developed Tests), incluindo muitas biópsias líquidas, mudou em 2024 quando…'
          en: 'LDT (Laboratory-Developed Test) regulation, including many liquid biopsies, changed in 2024 when…'
        choices:
          - 'FDA finalizou regra para regular LDTs como dispositivos médicos com transição de 4 anos'
          - 'Congresso revogou completamente CLIA, eliminando qualquer requisito de qualidade'
          - 'LDTs passaram a ser proibidos em todos os estados americanos'
          - 'WHO assumiu regulação federal substituindo a FDA dos EUA'
        correctAnswer: 'FDA finalizou regra para regular LDTs como dispositivos médicos com transição de 4 anos'
        rationale:
          pt: 'Em maio/2024, FDA emitiu regra final estendendo regulação de dispositivos médicos a LDTs, com fase-in em 4 anos — afetará Galleri, Signatera, Guardant360 e dezenas de outros assays até então sob CLIA somente. Indústria contestou judicialmente.'
          en: 'In May 2024, FDA issued a final rule extending medical-device regulation to LDTs, with a 4-year phase-in — affecting Galleri, Signatera, Guardant360, and dozens of others previously under CLIA only. Industry challenged it in court.'
        objectives: [LDT FDA 2024]
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito "fragmentomics" (DELFI, Cristiano/Velculescu) explora…'
          en: '"Fragmentomics" (DELFI, Cristiano/Velculescu) leverages…'
        choices:
          - 'Padrões globais de fragmentação genômica do cfDNA distintos entre saudável e câncer'
          - 'Fragmentação proteica plasmática separada por eletroforese 2D clássica'
          - 'Tamanho de exossomos circulantes para classificação tumoral por ressonância'
          - 'Quebras cromossômicas em CTCs analisadas por FISH multiplex padrão'
        correctAnswer: 'Padrões globais de fragmentação genômica do cfDNA distintos entre saudável e câncer'
        rationale:
          pt: 'DELFI (DNA Evaluation of Fragments for early Interception) — Cristiano/Velculescu (Hopkins) — analisa razão de fragmentos curtos/longos em janelas genômicas. Padrão alterado em câncer; combinado com mutações + metilação dá MCED de baixo custo (Delfi Diagnostics).'
          en: 'DELFI (DNA Evaluation of Fragments for early Interception) — Cristiano/Velculescu (Hopkins) — analyzes short/long fragment ratios across genomic windows. Pattern is altered in cancer; combined with mutations + methylation it yields low-cost MCED (Delfi Diagnostics).'
        objectives: [DELFI fragmentomics]
