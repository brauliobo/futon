title:
  pt: Xenotransplantação e Engenharia de Suínos Doadores
  en: Xenotransplantation and Donor Pig Engineering
level: O
subject: biology
objectives:
  - Compreender barreiras de rejeição (HAR, AMR, celular)
  - Reconhecer knockouts (GGTA1, CMAH, β4GalNT2) e transgenes humanos
  - Identificar marcos clínicos (Bennett 2022, Slayman 2024)
  - Avaliar PERV e governança regulatória
difficulty: 5
authorNotes: |
  Frontier xeno. Revivicor (UAB-UVA, Lockheed/UTHV-> United Therapeutics) makes 10-GE pig
  (GTKO + 6 transgenes hCD46/hCD55/CD59/THBD/EPCR/HMOX1 + GH knockout + iGB4GalNT2 + iCMAH).
  eGenesis (Church-founded 2015) PERV-Cas9 inactivation Niu/Yang 2017. Clinical: David
  Bennett Sr. (UMD/Bartley Griffith Jan 2022, 60d), Lawrence Faucette (UMD Sep 2023, 6w),
  Richard Slayman (MGH Mar 2024 first pig kidney living recipient), Lisa Pisano (NYU Apr
  2024 kidney+heart pump), Towana Looney (NYU Nov 2024). PERV-A/B/C, Patience 1997. WHO
  global consultation 2008 Changsha. ISHLT/ASTS guidelines.
example:
  question:
    pt: Em janeiro de 2022, o primeiro coração suíno geneticamente modificado foi transplantado para um humano. Quem foi o paciente e onde?
    en: In January 2022, the first genetically modified pig heart was transplanted into a human. Who was the patient and where?
  choices:
    - David Bennett Sr., Universidade de Maryland, equipe de Bartley Griffith e Muhammad Mohiuddin
    - Richard Slayman, Massachusetts General, equipe de Leonardo Riella
    - Lisa Pisano, NYU Langone, equipe de Robert Montgomery
    - Tom Patterson, UC San Diego, equipe de Steffanie Strathdee
  correctAnswer: David Bennett Sr., Universidade de Maryland, equipe de Bartley Griffith e Muhammad Mohiuddin
  rationale:
    pt: Bennett (57 anos, IC terminal sem opção alotransplante) recebeu coração de suíno 10-GE da Revivicor em 7/jan/2022 sob FDA eIND. Sobreviveu ~60 dias; CMV porcino latente foi identificado como cocausa do declínio.
    en: Bennett (57, end-stage HF ineligible for allotransplant) received a Revivicor 10-GE pig heart on Jan 7, 2022 under FDA eIND. He survived ~60 days; latent porcine CMV was identified as a co-cause of decline.
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Barreiras imunológicas e engenharia genética
      en: Page 1 — Immune barriers and genetic engineering
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: A rejeição hiperaguda (HAR) em xenotransplantes pig-to-primate é mediada principalmente por…
          en: Hyperacute rejection (HAR) in pig-to-primate xenotransplants is mainly mediated by…
        choices:
          - Anticorpos naturais anti-α1,3-Gal pré-existentes em humanos ativando complemento em minutos
          - Linfócitos T CD8 citotóxicos invadindo o enxerto rapidamente sem anticorpos envolvidos
          - Macrófagos e células NK induzindo dano lento ao longo de semanas
          - Microtrombose plaquetária isolada sem qualquer participação do sistema imune
        correctAnswer: Anticorpos naturais anti-α1,3-Gal pré-existentes em humanos ativando complemento em minutos
        rationale:
          pt: Humanos perderam GGTA1 evolutivamente e fazem anticorpos anti-Gal contra glicoconjugados α-Gal (epítopo bovino/suíno) — IgM/IgG pré-formados se ligam ao endotélio porcino, ativam complemento e causam HAR em minutos.
          en: Humans evolutionarily lost GGTA1 and produce anti-Gal antibodies against α-Gal glycoconjugates (bovine/porcine epitope) — preformed IgM/IgG bind porcine endothelium, activate complement, and cause HAR within minutes.
        objectives: [HAR]
      - type: choice
        difficulty: 5
        question:
          pt: O knockout do gene GGTA1 em suínos doadores, primeiro descrito em 2003, elimina qual epítopo?
          en: GGTA1 knockout in donor pigs, first described in 2003, eliminates which epitope?
        choices:
          - α1,3-galactose terminal (Gal-α-1,3-Gal) responsável pela maior parte da rejeição hiperaguda
          - O grupo sanguíneo ABO em hemácias de suínos doadores compatíveis
          - HLA-A2 ortólogo presente em todas as células porcinas como antígeno principal
          - Receptores Fc-γ em macrófagos suínos modulando fagocitose recipiente
        correctAnswer: α1,3-galactose terminal (Gal-α-1,3-Gal) responsável pela maior parte da rejeição hiperaguda
        rationale:
          pt: GGTA1 codifica a α1,3-galactosiltransferase. KO em suínos (Phelps et al. 2003) elimina α-Gal, abolindo HAR mediada por anti-Gal — ponto de partida obrigatório de toda linhagem porcina xeno-doadora moderna.
          en: GGTA1 codes α1,3-galactosyltransferase. KO in pigs (Phelps et al. 2003) eliminates α-Gal, abolishing anti-Gal-mediated HAR — obligatory starting point for every modern xeno-donor pig line.
        objectives: [GTKO]
      - type: choice
        difficulty: 5
        question:
          pt: Após eliminar α-Gal, dois epítopos não-Gal remanescentes são alvos de KO adicionais. Quais?
          en: After α-Gal elimination, two remaining non-Gal epitopes are additional KO targets. Which?
        choices:
          - Neu5Gc (CMAH) e Sda-like (β4GalNT2), ambos glicoconjugados xeno-reativos em humanos
          - HLA-G e HLA-E suínos como moléculas de classe Ib não-clássicas
          - CD46 e CD55 expressos em endotélio suíno como reguladores de complemento
          - PD-L1 e CD80 envolvidos em ativação direta de células T citotóxicas
        correctAnswer: Neu5Gc (CMAH) e Sda-like (β4GalNT2), ambos glicoconjugados xeno-reativos em humanos
        rationale:
          pt: Humanos perderam CMAH (Neu5Gc → Neu5Ac) e expressam pouco β4GalNT2; ambos os epítopos são reconhecidos por anticorpos humanos. KO triplo (GGTA1/CMAH/β4GalNT2) — "TKO" — virtualmente abole reatividade pré-formada humana.
          en: Humans lost CMAH (Neu5Gc → Neu5Ac) and express little β4GalNT2; both epitopes are recognized by human antibodies. Triple KO (GGTA1/CMAH/β4GalNT2) — "TKO" — virtually abolishes preformed human reactivity.
        objectives: [TKO]
      - type: choice
        difficulty: 5
        question:
          pt: O suíno 10-GE da Revivicor (usado em Bennett 2022) inclui transgenes humanos para…
          en: Revivicor's 10-GE pig (used in Bennett 2022) includes human transgenes for…
        choices:
          - Reguladores de complemento (hCD46, hCD55, hCD59) e antitrombóticos (hTHBD, hEPCR, hHMOX1, hCD47)
          - Apenas HLA-A*02:01 humano para evitar rejeição mediada por T-células totalmente
          - Receptores de antígenos T quiméricos (CARs) para imunossupressão alvo no enxerto
          - Genes de estem-cell-like reprogramando células porcinas em pluripotentes
        correctAnswer: Reguladores de complemento (hCD46, hCD55, hCD59) e antitrombóticos (hTHBD, hEPCR, hHMOX1, hCD47)
        rationale:
          pt: O 10-GE inclui 3 KOs (GGTA1, CMAH, β4GalNT2) + KO de GH (controla tamanho cardíaco) + 6 transgenes humanos: hCD46/CD55/CD59 (anti-complemento), hTHBD/hEPCR (anti-coagulação), hHMOX1 (anti-inflamação) — atacando rejeição em múltiplas frentes.
          en: The 10-GE includes 3 KOs (GGTA1, CMAH, β4GalNT2) + GH KO (heart-size control) + 6 human transgenes: hCD46/CD55/CD59 (anti-complement), hTHBD/hEPCR (anti-coagulation), hHMOX1 (anti-inflammation) — multi-front rejection attack.
        objectives: [10-GE pig]
      - type: choice
        difficulty: 5
        question:
          pt: PERV (Porcine Endogenous Retrovirus), preocupação histórica em xenotransplantação, foi inativado em 2017 por…
          en: PERV (Porcine Endogenous Retrovirus), a historic xeno concern, was inactivated in 2017 by…
        choices:
          - Luhan Yang/George Church via CRISPR-Cas9 multiplex em todas as ~62 cópias do genoma porcino
          - Indução química com AZT em embriões porcinos sem qualquer edição genômica
          - Substituição cromossômica completa do par 12 contendo todas as cópias virais
          - Imunização ativa do suíno contra suas próprias proteínas virais retrovirais
        correctAnswer: Luhan Yang/George Church via CRISPR-Cas9 multiplex em todas as ~62 cópias do genoma porcino
        rationale:
          pt: Niu/Yang/Church (Science 2017) usaram Cas9 para inativar simultaneamente todas as cópias de PERV via clivagem do gene pol em fibroblastos, depois SCNT — primeiros leitões PERV-KO. Spinoff: eGenesis (atual fornecedora dos rins de Slayman/Looney).
          en: Niu/Yang/Church (Science 2017) used Cas9 to simultaneously inactivate all PERV copies via pol gene cleavage in fibroblasts, then SCNT — first PERV-KO piglets. Spinoff: eGenesis (current supplier of Slayman/Looney kidneys).
        objectives: [PERV-KO]
      - type: choice
        difficulty: 5
        question:
          pt: O knockout do gene do hormônio de crescimento (GH) em suínos doadores é necessário para…
          en: Growth hormone (GH) gene knockout in donor pigs is necessary to…
        choices:
          - Impedir crescimento contínuo do coração porcino além do tamanho compatível com tórax humano
          - Eliminar componente alergênico em glicoproteínas hipofisárias suínas residuais
          - Bloquear secreção de insulina porcina que poderia causar hipoglicemia recipiente
          - Suprimir transmissão de hormônios sexuais durante o transplante de órgão
        correctAnswer: Impedir crescimento contínuo do coração porcino além do tamanho compatível com tórax humano
        rationale:
          pt: Sem GHR-KO, corações suínos continuam crescendo após transplante, ultrapassando capacidade torácica humana. KO de GHR (receptor) é mais elegante: o órgão para de responder a GH humano circulante e mantém tamanho constante.
          en: Without GHR-KO, pig hearts keep growing after transplant, outgrowing the human chest. GHR (receptor) KO is more elegant: the organ stops responding to circulating human GH and maintains constant size.
        objectives: [GHR-KO]
      - type: choice
        difficulty: 5
        question:
          pt: A morte de David Bennett (2022) foi associada à reativação de qual patógeno latente do doador?
          en: Bennett's death (2022) was linked to reactivation of which latent donor pathogen?
        choices:
          - Citomegalovírus porcino (PCMV/PRV), não detectado pré-transplante por PCR insuficiente
          - Vírus da peste suína africana (ASFV), endêmico em granjas comerciais europeias
          - Hepatite E suína de transmissão alimentar conhecida em produtos cárneos
          - Reovírus porcino comum em rebanhos sem qualquer evidência de patogenicidade
        correctAnswer: Citomegalovírus porcino (PCMV/PRV), não detectado pré-transplante por PCR insuficiente
        rationale:
          pt: PCMV/porcine roseolovirus latente foi detectado pós-mortem; ensaios PCR pré-transplante eram insensíveis ao vírus latente. Episódio motivou triagem reforçada por NGS e cultivo, e a Revivicor reisolou linhagens. Caso ressaltou bioexposição residual mesmo em DPF pigs.
          en: Latent PCMV/porcine roseolovirus was detected post-mortem; pre-transplant PCR assays were insensitive to latent virus. The case prompted enhanced NGS+culture screening, and Revivicor reisolated lines. It underscored residual bioexposure risk even in DPF pigs.
        objectives: [PCMV Bennett]
      - type: choice
        difficulty: 5
        question:
          pt: A reunião de Changsha (2008), patrocinada pela WHO, estabeleceu o quê para xenotransplantação?
          en: The 2008 Changsha consultation, sponsored by WHO, established what for xenotransplantation?
        choices:
          - Princípios globais para regulação, vigilância de doenças e monitoramento pós-transplante de longo prazo
          - Proibição mundial de qualquer pesquisa clínica em xenotransplantação por 50 anos
          - Centralização da fabricação de suínos doadores em três países produtores
          - Subsídio governamental obrigatório a empresas privadas como Revivicor
        correctAnswer: Princípios globais para regulação, vigilância de doenças e monitoramento pós-transplante de longo prazo
        rationale:
          pt: Os "Princípios de Changsha" (WHO 2008) — pós-resolução WHA57.18 — definiram requisitos para xenotransplantação: fabricação certificada, biossegurança, monitoramento permanente do recipiente e parceiros, repositório de amostras, regulação harmonizada.
          en: The "Changsha Principles" (WHO 2008) — following WHA57.18 — defined xenotransplantation requirements: certified manufacturing, biosafety, lifetime recipient and partner monitoring, sample repository, harmonized regulation.
        objectives: [Changsha]
      - type: choice
        difficulty: 5
        question:
          pt: A SCNT (transferência nuclear de células somáticas) em xenoporcos é necessária porque…
          en: SCNT (somatic cell nuclear transfer) in xeno-pigs is necessary because…
        choices:
          - Permite editar fibroblastos com múltiplos KOs/transgenes e gerar suíno geneticamente idêntico
          - É a única via de produzir células-tronco pluripotentes porcinas viáveis para transplante
          - Substitui necessidade de inseminação artificial em criações comerciais convencionais
          - Elimina a necessidade de barreira sanitária DPF em fazendas certificadas
        correctAnswer: Permite editar fibroblastos com múltiplos KOs/transgenes e gerar suíno geneticamente idêntico
        rationale:
          pt: Edita-se fibroblastos in vitro (múltiplas modificações sequenciais) e seleciona-se clone com genótipo desejado; SCNT (núcleo do fibroblasto em oócito enucleado) gera leitões idênticos com toda a engenharia — única via prática para 10+ edições combinadas.
          en: Fibroblasts are edited in vitro (multiple sequential modifications) and a clone with desired genotype is selected; SCNT (fibroblast nucleus into enucleated oocyte) generates identical piglets with all engineering — the only practical route for 10+ combined edits.
        objectives: [SCNT xeno]
      - type: choice
        difficulty: 5
        question:
          pt: A "Designated Pathogen-Free" (DPF) cláusula em fazendas xeno-doadoras significa…
          en: The "Designated Pathogen-Free" (DPF) requirement on xeno-donor facilities means…
        choices:
          - Ausência documentada de uma lista de patógenos zoonóticos por triagem regular
          - Ausência absoluta de qualquer micro-organismo, inclusive microbioma normal
          - Apenas certificação para uso em pesquisa básica sem qualquer impacto clínico
          - Equivalência total a fazendas comerciais convencionais sem requisitos extras
        correctAnswer: Ausência documentada de uma lista de patógenos zoonóticos por triagem regular
        rationale:
          pt: DPF não é estéril: é "específico designado livre" de uma lista priorizada (PCMV, hepatite E, influenza, PRRS, etc.) com vigilância sorológica e PCR contínua. Bennett 2022 mostrou que listas DPF precisavam expandir e métodos refinar.
          en: DPF isn't sterile: it's "specific-designated-free" from a prioritized list (PCMV, hepatitis E, influenza, PRRS, etc.) with ongoing serology and PCR surveillance. Bennett 2022 showed DPF lists needed expansion and methods refinement.
        objectives: [DPF]
  - title:
      pt: Página 2 — Casos clínicos e perspectivas
      en: Page 2 — Clinical cases and outlook
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em março de 2024, o primeiro transplante de rim suíno em humano vivo foi feito em quem?
          en: In March 2024, the first pig kidney transplant in a living human was performed on whom?
        choices:
          - Richard "Rick" Slayman, Mass General Brigham, equipe de Leonardo Riella e Tatsuo Kawai
          - Lisa Pisano, NYU Langone, em paciente com IC e doença renal crônica
          - Towana Looney, NYU Langone, com doença renal crônica primária autoimune
          - David Bennett Jr., paciente pediátrico em Maryland sem coração disponível
        correctAnswer: Richard "Rick" Slayman, Mass General Brigham, equipe de Leonardo Riella e Tatsuo Kawai
        rationale:
          pt: Slayman (62, DRC fim-de-estágio) recebeu rim eGenesis 69-edição em 16/mar/2024 no MGH; recebeu alta funcional. Faleceu em maio/2024 por causa não relacionada (assim avaliado pela equipe) — primeiro precedente em vivo, complementando casos prévios em recipientes em morte cerebral (Montgomery NYU 2021).
          en: Slayman (62, ESKD) received an eGenesis 69-edit kidney on Mar 16, 2024 at MGH; was discharged functional. He died in May 2024 from an unrelated cause (per the team) — first living-recipient precedent, complementing earlier brain-dead recipient cases (Montgomery NYU 2021).
        objectives: [Slayman]
      - type: choice
        difficulty: 5
        question:
          pt: O rim eGenesis usado em Slayman e Looney tem quantas edições genéticas e quais alvos principais?
          en: The eGenesis kidney used in Slayman and Looney has how many edits and what main targets?
        choices:
          - 69 edições: 3 KOs glicano + 7 transgenes humanos + inativação de ~59 PERVs
          - 10 edições idênticas ao 10-GE da Revivicor sem PERV-KO incluído
          - 200 edições, eliminando todo cromossomo X suíno por inteiro
          - Apenas 3 KOs glicano sem transgenes humanos nem PERV-KO
        correctAnswer: 69 edições: 3 KOs glicano + 7 transgenes humanos + inativação de ~59 PERVs
        rationale:
          pt: O rim eGenesis EGEN-2784 tem 69 modificações: GGTA1/CMAH/β4GalNT2 KO + 7 transgenes humanos (CD46, CD55, CD59, THBD, EPCR, HMOX1, CD47) + inativação CRISPR de 59 cópias PERV — herda diretamente o trabalho Yang/Church 2017.
          en: The eGenesis EGEN-2784 kidney has 69 modifications: GGTA1/CMAH/β4GalNT2 KO + 7 human transgenes (CD46, CD55, CD59, THBD, EPCR, HMOX1, CD47) + CRISPR inactivation of 59 PERV copies — directly inherits Yang/Church 2017 work.
        objectives: [eGenesis kidney]
      - type: choice
        difficulty: 5
        question:
          pt: Lisa Pisano (NYU, abr/2024) recebeu simultaneamente o quê de origem porcina?
          en: Lisa Pisano (NYU, Apr 2024) simultaneously received what porcine?
        choices:
          - Rim suíno geneticamente modificado + timo suíno para tolerância (estratégia de Sachs)
          - Coração suíno + pulmão suíno em transplante combinado torácico
          - Fígado suíno transplantado heterotopicamente como apoio temporário
          - Pâncreas suíno + rim com glicanos modificados para diabetes tipo 1
        correctAnswer: Rim suíno geneticamente modificado + timo suíno para tolerância (estratégia de Sachs)
        rationale:
          pt: Robert Montgomery (NYU) e David Sachs implantaram em Pisano (54, DRC e IC) rim suíno + tecido tímico vascularizado (estratégia de Sachs para induzir tolerância central via ensino de células T humanas a tolerar antígenos suínos no timo).
          en: Robert Montgomery (NYU) and David Sachs implanted in Pisano (54, ESKD and HF) a pig kidney + vascularized thymic tissue (Sachs's strategy to induce central tolerance by training human T cells to tolerate pig antigens in the thymus).
        objectives: [Pisano timo]
      - type: choice
        difficulty: 5
        question:
          pt: A estratégia "tolerância thymo-renal" de David Sachs visa…
          en: David Sachs's "thymo-renal tolerance" strategy aims to…
        choices:
          - Induzir tolerância central deletando timocitos T humanos auto-reativos contra antígenos porcinos
          - Eliminar imunossupressão sistêmica usando exclusivamente fármacos tópicos
          - Substituir todo o sistema imune do recipiente por células porcinas hematopoéticas
          - Aplicar fototerapia UV no enxerto pré-implantação para reduzir antigenicidade
        correctAnswer: Induzir tolerância central deletando timocitos T humanos auto-reativos contra antígenos porcinos
        rationale:
          pt: Sachs (MGH) propõe co-transplante de timo suíno: precursores T humanos migram, maturam no timo porcino, são deletadas se reconhecem antígenos suínos com alta afinidade — tolerância central duradoura sem imunossupressão crônica pesada.
          en: Sachs (MGH) proposes pig-thymus co-transplant: human T precursors migrate, mature in the pig thymus, and are deleted if they recognize pig antigens with high affinity — durable central tolerance without heavy chronic immunosuppression.
        objectives: [Tolerância thymo-renal]
      - type: choice
        difficulty: 5
        question:
          pt: A imunossupressão usada nos primeiros casos clínicos de xenotransplante é centrada em…
          en: Immunosuppression in the first clinical xeno cases centers on…
        choices:
          - Anti-CD40L (tegoprubart/letolimab) bloqueando coestimulação T-B + timoglobulina + esteróides
          - Tacrolimus + micofenolato + esteróides como esquema clássico de alotransplante renal
          - Belatacept (CTLA4-Ig) sozinho como monoterapia de eficácia comprovada
          - Apenas rituximab (anti-CD20) eliminando linfócitos B exclusivamente
        correctAnswer: Anti-CD40L (tegoprubart/letolimab) bloqueando coestimulação T-B + timoglobulina + esteróides
        rationale:
          pt: Bloqueio de CD40-CD40L é central — anticorpos como tegoprubart (Eledon) ou letolimab — combinado com depleção T por timoglobulina e esteróides. Ensaios em primatas mostraram sobrevida de meses-anos com este esquema, base dos protocolos humanos.
          en: CD40-CD40L blockade is central — antibodies like tegoprubart (Eledon) or letolimab — combined with T-depletion by thymoglobulin and steroids. Primate trials showed months-to-years survival with this regimen, foundation of human protocols.
        objectives: [Imunossupressão xeno]
      - type: choice
        difficulty: 5
        question:
          pt: Towana Looney (NYU, nov/2024) é notável por qual motivo na história da xenotransplantação?
          en: Towana Looney (NYU, Nov 2024) is notable why in xenotransplantation history?
        choices:
          - Maior sobrevida documentada com rim suíno em humano vivo, ultrapassando 100 dias
          - Primeira receptora de coração suíno bem-sucedida com transplante em ambulatório
          - Primeira pediátrica receptora de qualquer órgão suíno em estudo clínico
          - Primeira receptora de fígado suíno em ponte para transplante alotransplante
        correctAnswer: Maior sobrevida documentada com rim suíno em humano vivo, ultrapassando 100 dias
        rationale:
          pt: Looney recebeu rim eGenesis em 25/nov/2024 no NYU; sobreviveu mais de 100 dias antes de remoção por rejeição em abril/2025 — maior sobrevida com rim porcino em vivo até então, marcando viabilidade prolongada como ponte ao alotransplante.
          en: Looney received an eGenesis kidney on Nov 25, 2024 at NYU; survived >100 days before removal for rejection in Apr 2025 — longest pig-kidney survival in a living human up to then, marking prolonged viability as a bridge to allotransplant.
        objectives: [Looney]
      - type: choice
        difficulty: 5
        question:
          pt: A FDA aprovou em 2020 a primeira modificação genética animal para uso médico/alimentar simultâneo. Qual?
          en: The FDA in 2020 approved the first animal genetic modification for simultaneous medical/food use. Which?
        choices:
          - GalSafe pigs (Revivicor) — GGTA1-KO para alergia α-Gal e fonte de tecidos
          - Salmão AquAdvantage da AquaBounty exclusivamente para consumo alimentar
          - Mosquito OX5034 da Oxitec para controle vetorial sem aplicação médica
          - Vaca Hornless da Recombinetics para bem-estar sem componente médico humano
        correctAnswer: GalSafe pigs (Revivicor) — GGTA1-KO para alergia α-Gal e fonte de tecidos
        rationale:
          pt: GalSafe (FDA dez/2020) foi o primeiro animal GE aprovado simultaneamente para alimentação humana (alergia α-Gal por carne mamífera + carrapato Lone Star) e para uso médico (heparina, válvulas, xenotecidos). Marcou caminho regulatório para xenotransplante.
          en: GalSafe (FDA Dec 2020) was the first GE animal approved simultaneously for human food (α-Gal allergy from mammalian meat + Lone Star tick) and medical use (heparin, valves, xenotissues). Paved the regulatory path for xenotransplantation.
        objectives: [GalSafe]
      - type: choice
        difficulty: 5
        question:
          pt: O risco teórico mais discutido de PERV em humano é…
          en: PERV's most-discussed theoretical risk in humans is…
        choices:
          - Recombinação com retrovírus humanos endógenos gerando vírus quimérico patogênico
          - Indução direta de neoplasia em órgão recipiente nas primeiras semanas
          - Transmissão sexual obrigatória para parceiros sem qualquer contato com órgão
          - Imunossupressão profunda automática sem qualquer fármaco adjuvante
        correctAnswer: Recombinação com retrovírus humanos endógenos gerando vírus quimérico patogênico
        rationale:
          pt: PERV-A/B podem infectar células humanas in vitro; preocupação é recombinação com HERVs ou outros retrovírus, criando entidade adaptada. Estudos epidemiológicos em pacientes com tecido porcino (válvulas, ilhotas) por décadas não detectaram transmissão — risco residual baixo, mas vigilância obrigatória.
          en: PERV-A/B can infect human cells in vitro; concern is recombination with HERVs or other retroviruses producing an adapted entity. Decades of epidemiology in patients with porcine tissue (valves, islets) detected no transmission — residual risk low, but surveillance is mandatory.
        objectives: [PERV risco]
      - type: choice
        difficulty: 5
        question:
          pt: Alternativa ao porco para xenotransplantação clínica de órgão sólido foi descartada quando se considerou…
          en: An alternative to pigs for solid-organ clinical xenotransplantation was ruled out considering…
        choices:
