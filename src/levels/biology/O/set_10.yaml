          en: NHPs (baboons, chimps) were tried in the 1960s-1990s (Starzl, Bailey/Baby Fae 1984), but are small, rare, costly, ethically sensitive, and zoonotically risky (HIV, ebola). Pigs: right size, industrial breeding, feasible editing, favorable phylogenetic distance.
