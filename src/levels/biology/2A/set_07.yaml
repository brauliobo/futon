title:
  pt: "🌋 Origem da vida"
  en: "🌋 Origin of life"
level: '2A'
subject: biology
objectives: [biology.origin_of_life]
difficulty: 5
authorNotes: "Abiogênese, mundo do RNA, química prebiótica, LUCA, hipóteses (Miller-Urey, fontes hidrotermais)."
example:
  pt: "Ex.: moléculas simples → polímeros → autorreplicação → metabolismo → célula → LUCA."
  en: "Ex.: simple molecules → polymers → self-replication → metabolism → cell → LUCA."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Da química à biologia", en: "From chemistry to biology"}
    description: {pt: "Como vida pôde surgir da matéria inerte.", en: "How life could arise from inert matter."}
    exercises:
      - type: choice
        question: {pt: "Abiogênese é hipótese de que vida:", en: "Abiogenesis is the hypothesis that life:"}
        choices:
          - {pt: "Surgiu de matéria não-viva por processos químicos naturais", en: "Arose from non-living matter via natural chemical processes"}
          - {pt: "Apenas viajou de outro planeta", en: "Only traveled from another planet"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre existiu eterna", en: "Always existed eternal"}
        correctAnswer: {pt: "Surgiu de matéria não-viva por processos químicos naturais", en: "Arose from non-living matter via natural chemical processes"}
        rationale: {pt: "Quando condições prebióticas concentram moléculas, então química leva a sistemas auto-organizados.", en: "When prebiotic conditions concentrate molecules, chemistry leads to self-organized systems."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Experimento Miller-Urey (1953) demonstrou:", en: "Miller-Urey experiment (1953) demonstrated:"}
        choices:
          - {pt: "Aminoácidos podem formar-se a partir de gases simples + descargas elétricas", en: "Amino acids can form from simple gases + electric discharges"}
          - {pt: "Apenas vida atual", en: "Just current life"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem síntese possível", en: "No synthesis possible"}
        correctAnswer: {pt: "Aminoácidos podem formar-se a partir de gases simples + descargas elétricas", en: "Amino acids can form from simple gases + electric discharges"}
        rationale: {pt: "Como blocos de construção surgem de fontes abióticas, então química prebiótica é plausível.", en: "Because building blocks arise from abiotic sources, prebiotic chemistry is plausible."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Hipótese do mundo do RNA propõe:", en: "RNA world hypothesis proposes:"}
        choices:
          - {pt: "RNA precedeu DNA/proteína — armazenando info e catalisando reações", en: "RNA preceded DNA/protein — storing info and catalyzing reactions"}
          - {pt: "Apenas DNA primeiro", en: "DNA first only"}
          - {pt: "Apenas proteína primeiro", en: "Just protein first"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "RNA precedeu DNA/proteína — armazenando info e catalisando reações", en: "RNA preceded DNA/protein — storing info and catalyzing reactions"}
        rationale: {pt: "Como ribozimas existem hoje, então RNA pode unir informação e função num único polímero.", en: "Because ribozymes exist today, RNA can unite information and function in single polymer."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Ribozima é:", en: "Ribozyme is:"}
        choices:
          - {pt: "RNA com atividade catalítica (ex.: ribossomo, riboswitches)", en: "RNA with catalytic activity (e.g., ribosome, riboswitches)"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas proteína pura", en: "Just pure protein"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "RNA com atividade catalítica (ex.: ribossomo, riboswitches)", en: "RNA with catalytic activity (e.g., ribosome, riboswitches)"}
        rationale: {pt: "Quando rRNA cataliza ligação peptídica, então observamos fóssil molecular do mundo do RNA.", en: "When rRNA catalyzes peptide bond, we see molecular fossil of RNA world."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Hipótese das fontes hidrotermais alcalinas sugere vida em:", en: "Alkaline hydrothermal vent hypothesis suggests life at:"}
        choices:
          - {pt: "Chaminés brancas com gradientes de pH e H₂ — energia química livre", en: "White chimneys with pH gradients and H₂ — free chemical energy"}
          - {pt: "Apenas vulcões aéreos", en: "Just aerial volcanoes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas atmosfera", en: "Just atmosphere"}
        correctAnswer: {pt: "Chaminés brancas com gradientes de pH e H₂ — energia química livre", en: "White chimneys with pH gradients and H₂ — free chemical energy"}
        rationale: {pt: "Como gradiente próton lembra ATP-sintase, então metabolismo primeiro pode ter sido geoquímico.", en: "Because proton gradient resembles ATP synthase, first metabolism may have been geochemical."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Vesículas lipídicas (protocélulas) podem:", en: "Lipid vesicles (protocells) can:"}
        choices:
          - {pt: "Auto-formar-se em água, crescer e dividir-se sem proteínas", en: "Self-assemble in water, grow and divide without proteins"}
          - {pt: "Apenas com enzimas modernas", en: "Only with modern enzymes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Não formar-se nunca", en: "Never form"}
        correctAnswer: {pt: "Auto-formar-se em água, crescer e dividir-se sem proteínas", en: "Self-assemble in water, grow and divide without proteins"}
        rationale: {pt: "Como anfifílicas se organizam em bicamadas, então primeiras membranas foram espontâneas.", en: "Because amphiphilics organize into bilayers, first membranes were spontaneous."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "LUCA (último ancestral comum universal) tinha provavelmente:", en: "LUCA (last universal common ancestor) likely had:"}
        choices:
          - {pt: "Código genético, ribossomos, ATP, membrana — semelhante a procarionte", en: "Genetic code, ribosomes, ATP, membrane — prokaryote-like"}
          - {pt: "Apenas DNA livre", en: "Just free DNA"}
          - {pt: "Apenas vírus", en: "Just virus"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Código genético, ribossomos, ATP, membrana — semelhante a procarionte", en: "Genetic code, ribosomes, ATP, membrane — prokaryote-like"}
        rationale: {pt: "Como traços conservados em toda vida atual, então LUCA já tinha bioquímica completa.", en: "Because traits are conserved across all life today, LUCA already had complete biochemistry."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Quiralidade homogênea em vida (L-aminoácidos, D-açúcares) sugere:", en: "Homogeneous chirality in life (L-amino acids, D-sugars) suggests:"}
        choices:
          - {pt: "Quebra de simetria precoce — mistério em aberto", en: "Early symmetry breaking — open mystery"}
          - {pt: "Apenas mistura aleatória", en: "Just random mixture"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem padrão", en: "No pattern"}
        correctAnswer: {pt: "Quebra de simetria precoce — mistério em aberto", en: "Early symmetry breaking — open mystery"}
        rationale: {pt: "Quando luz polarizada ou meteoritos enriquecem um enantiômero, então química prebiótica favorece um lado.", en: "When polarized light or meteorites enrich one enantiomer, prebiotic chemistry favors one side."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Síntese de Strecker produz:", en: "Strecker synthesis produces:"}
        choices:
          - {pt: "Aminoácidos a partir de aldeído + amônia + cianeto", en: "Amino acids from aldehyde + ammonia + cyanide"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas RNA", en: "Just RNA"}
        correctAnswer: {pt: "Aminoácidos a partir de aldeído + amônia + cianeto", en: "Amino acids from aldehyde + ammonia + cyanide"}
        rationale: {pt: "Como reagentes existem no espaço e Terra primitiva, então via plausível para blocos da vida.", en: "Because reagents exist in space and early Earth, plausible route to life's building blocks."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Meteoritos como Murchison continham:", en: "Meteorites like Murchison contained:"}
        choices:
          - {pt: "Aminoácidos, açúcares e bases nitrogenadas extraterrestres", en: "Extraterrestrial amino acids, sugars and nitrogen bases"}
          - {pt: "Apenas pedra simples", en: "Just simple rock"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas metais", en: "Just metals"}
        correctAnswer: {pt: "Aminoácidos, açúcares e bases nitrogenadas extraterrestres", en: "Extraterrestrial amino acids, sugars and nitrogen bases"}
        rationale: {pt: "Como química orgânica complexa surge no espaço, então ingredientes prebióticos são universais.", en: "Because complex organic chemistry arises in space, prebiotic ingredients are universal."}
        objectives: [biology.origin_of_life]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Caminhos para a célula", en: "Paths to the cell"}
    description: {pt: "Da molécula ao primeiro organismo.", en: "From molecule to first organism."}
    exercises:
      - type: choice
        question: {pt: "Polimerização em superfícies minerais (argila) facilita:", en: "Polymerization on mineral surfaces (clay) facilitates:"}
        choices:
          - {pt: "Concentração e catálise de ligações fosfodiéster em RNA primitivo", en: "Concentration and catalysis of phosphodiester bonds in primitive RNA"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas degradação", en: "Just degradation"}
          - {pt: "Sem catálise", en: "No catalysis"}
        correctAnswer: {pt: "Concentração e catálise de ligações fosfodiéster em RNA primitivo", en: "Concentration and catalysis of phosphodiester bonds in primitive RNA"}
        rationale: {pt: "Quando minerais oferecem superfície, então monômeros se alinham e polimerizam mais facilmente.", en: "When minerals offer surface, monomers align and polymerize more easily."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Acoplamento metabólico-replicativo significa:", en: "Metabolic-replicative coupling means:"}
        choices:
          - {pt: "Sistemas que mantêm-se via reações + replicam informação cooperativamente", en: "Systems that sustain via reactions + replicate information cooperatively"}
          - {pt: "Apenas replicação isolada", en: "Just isolated replication"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem cooperação", en: "No cooperation"}
        correctAnswer: {pt: "Sistemas que mantêm-se via reações + replicam informação cooperativamente", en: "Systems that sustain via reactions + replicate information cooperatively"}
        rationale: {pt: "Como autopoiese requer ambos, então transição para vida exige integração de funções.", en: "Because autopoiesis requires both, transition to life demands function integration."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Hipótese metabolismo-primeiro:", en: "Metabolism-first hypothesis:"}
        choices:
          - {pt: "Redes autocatalíticas (ex.: ferro-enxofre) precederam genes", en: "Autocatalytic networks (e.g., iron-sulfur) preceded genes"}
          - {pt: "Apenas DNA primeiro", en: "Just DNA first"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem química", en: "No chemistry"}
        correctAnswer: {pt: "Redes autocatalíticas (ex.: ferro-enxofre) precederam genes", en: "Autocatalytic networks (e.g., iron-sulfur) preceded genes"}
        rationale: {pt: "Quando reações se auto-amplificam, então metabolismo emerge antes da informação genética.", en: "When reactions self-amplify, metabolism emerges before genetic information."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Estromatólitos fósseis indicam:", en: "Fossil stromatolites indicate:"}
        choices:
          - {pt: "Comunidades microbianas há ~3,5 bilhões de anos", en: "Microbial communities ~3.5 billion years ago"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas peixes antigos", en: "Just ancient fish"}
          - {pt: "Apenas plantas", en: "Just plants"}
        correctAnswer: {pt: "Comunidades microbianas há ~3,5 bilhões de anos", en: "Microbial communities ~3.5 billion years ago"}
        rationale: {pt: "Como camadas de cianobactérias prendem sedimento, então estromatólitos são fósseis macroscópicos da vida microbiana.", en: "Because cyanobacterial layers trap sediment, stromatolites are macroscopic fossils of microbial life."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Grande Evento Oxigenação (GOE) ocorreu há ~:", en: "Great Oxygenation Event (GOE) occurred ~:"}
        choices:
          - {pt: "2,4 bilhões de anos — cianobactérias liberaram O₂", en: "2.4 billion years — cyanobacteria released O₂"}
          - {pt: "100 anos atrás", en: "100 years ago"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas no Mesozoico", en: "Only in Mesozoic"}
        correctAnswer: {pt: "2,4 bilhões de anos — cianobactérias liberaram O₂", en: "2.4 billion years — cyanobacteria released O₂"}
        rationale: {pt: "Quando O₂ acumulou na atmosfera, então química redox abriu novos nichos e levou a respiração aeróbia.", en: "When O₂ accumulated in atmosphere, redox chemistry opened new niches and led to aerobic respiration."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Endossimbiose explica origem de:", en: "Endosymbiosis explains origin of:"}
        choices:
          - {pt: "Mitocôndrias e cloroplastos a partir de bactérias engolidas", en: "Mitochondria and chloroplasts from engulfed bacteria"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas núcleo", en: "Just nucleus"}
          - {pt: "Apenas membrana plasmática", en: "Just plasma membrane"}
        correctAnswer: {pt: "Mitocôndrias e cloroplastos a partir de bactérias engolidas", en: "Mitochondria and chloroplasts from engulfed bacteria"}
        rationale: {pt: "Como organelas têm DNA próprio circular, então origem bacteriana é confirmada (Lynn Margulis).", en: "Because organelles have own circular DNA, bacterial origin is confirmed (Lynn Margulis)."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Eucariotos surgiram via:", en: "Eukaryotes arose via:"}
        choices:
          - {pt: "Fusão de arquéia hospedeira com bactéria α-proteobactéria (mitocôndria)", en: "Fusion of host archaea with α-proteobacterium (mitochondrion)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas vírus", en: "Just virus"}
          - {pt: "Apenas DNA livre", en: "Just free DNA"}
        correctAnswer: {pt: "Fusão de arquéia hospedeira com bactéria α-proteobactéria (mitocôndria)", en: "Fusion of host archaea with α-proteobacterium (mitochondrion)"}
        rationale: {pt: "Como genomas eucariotos misturam genes archaea + bacterianos, então fusão simbiótica é evidente.", en: "Because eukaryote genomes mix archaea + bacterial genes, symbiotic fusion is evident."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Abordagem 'top-down' à vida sintética:", en: "'Top-down' synthetic life approach:"}
        choices:
          - {pt: "Reduz genoma de organismo existente ao mínimo viável (Mycoplasma)", en: "Reduces existing organism genome to minimal viable (Mycoplasma)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas começa do zero", en: "Just starts from scratch"}
          - {pt: "Apenas in silico", en: "Just in silico"}
        correctAnswer: {pt: "Reduz genoma de organismo existente ao mínimo viável (Mycoplasma)", en: "Reduces existing organism genome to minimal viable (Mycoplasma)"}
        rationale: {pt: "Quando podamos genes, então identificamos o conjunto essencial para vida celular.", en: "When we prune genes, we identify essential set for cellular life."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Abordagem 'bottom-up' constrói:", en: "'Bottom-up' approach builds:"}
        choices:
          - {pt: "Sistemas vivos a partir de componentes não-vivos em laboratório", en: "Living systems from non-living components in lab"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas reduz genoma", en: "Just reduces genome"}
          - {pt: "Apenas observa", en: "Just observes"}
        correctAnswer: {pt: "Sistemas vivos a partir de componentes não-vivos em laboratório", en: "Living systems from non-living components in lab"}
        rationale: {pt: "Como reconstruímos cada parte, então testamos hipóteses sobre origem da vida diretamente.", en: "Because we reconstruct each part, we test origin-of-life hypotheses directly."}
        objectives: [biology.origin_of_life]
        difficulty: 5
      - type: choice
        question: {pt: "Vida em outras químicas pode usar:", en: "Life with other chemistries might use:"}
        choices:
          - {pt: "Solventes alternativos (NH₃, metano), elementos como Si — especulativo", en: "Alternative solvents (NH₃, methane), elements like Si — speculative"}
          - {pt: "Apenas H₂O e C", en: "Just H₂O and C"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre humano", en: "Always human"}
        correctAnswer: {pt: "Solventes alternativos (NH₃, metano), elementos como Si — especulativo", en: "Alternative solvents (NH₃, methane), elements like Si — speculative"}
        rationale: {pt: "Quando relaxamos premissas, então campo amplia espaço de habitabilidade no universo.", en: "When we relax premises, field expands habitability space in universe."}
        objectives: [biology.origin_of_life]
        difficulty: 5
target: 20
