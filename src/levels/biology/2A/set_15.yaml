title:
  pt: "🤖 Neurociência computacional"
  en: "🤖 Computational neuroscience"
level: '2A'
subject: biology
objectives: [biology.computational_neuroscience]
difficulty: 5
authorNotes: "Modelos de neurônios, redes, codificação neural, BCI, conectomas, neurociência teórica."
example:
  pt: "Ex.: pico de neurônio → modelo Hodgkin-Huxley → simulação computacional → predição testável → experimento."
  en: "Ex.: neuron spike → Hodgkin-Huxley model → computational simulation → testable prediction → experiment."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Modelos de neurônio", en: "Neuron models"}
    description: {pt: "Da biofísica à computação.", en: "From biophysics to computation."}
    exercises:
      - type: choice
        question: {pt: "Neurociência computacional combina:", en: "Computational neuroscience combines:"}
        choices:
          - {pt: "Matemática, computação e biologia para modelar circuitos cerebrais", en: "Math, computing and biology to model brain circuits"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas filosofia", en: "Just philosophy"}
          - {pt: "Apenas medicina", en: "Just medicine"}
        correctAnswer: {pt: "Matemática, computação e biologia para modelar circuitos cerebrais", en: "Math, computing and biology to model brain circuits"}
        rationale: {pt: "Como cérebro é não-linear e complexo, então modelagem quantitativa revela princípios ocultos.", en: "Because brain is nonlinear and complex, quantitative modeling reveals hidden principles."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Modelo Hodgkin-Huxley descreve:", en: "Hodgkin-Huxley model describes:"}
        choices:
          - {pt: "Geração do potencial de ação via canais de Na⁺ e K⁺ dependentes de voltagem", en: "Action potential generation via voltage-gated Na⁺ and K⁺ channels"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas memória", en: "Just memory"}
        correctAnswer: {pt: "Geração do potencial de ação via canais de Na⁺ e K⁺ dependentes de voltagem", en: "Action potential generation via voltage-gated Na⁺ and K⁺ channels"}
        rationale: {pt: "Quando equações ajustam dados de axônio gigante, então modelo prediz forma e velocidade do spike.", en: "When equations fit giant axon data, model predicts spike shape and speed."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Modelo integrate-and-fire (IF) é:", en: "Integrate-and-fire (IF) model is:"}
        choices:
          - {pt: "Simplificação que dispara spike ao atingir limiar — eficiente para grandes redes", en: "Simplification that fires spike at threshold — efficient for large networks"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas detalhado biofisicamente", en: "Just biophysically detailed"}
          - {pt: "Apenas memória", en: "Just memory"}
        correctAnswer: {pt: "Simplificação que dispara spike ao atingir limiar — eficiente para grandes redes", en: "Simplification that fires spike at threshold — efficient for large networks"}
        rationale: {pt: "Quando reduzimos parâmetros, então simulamos milhões de neurônios mantendo essencial.", en: "When we reduce parameters, we simulate millions of neurons keeping the essentials."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Equação de cabo (cable equation) modela:", en: "Cable equation models:"}
        choices:
          - {pt: "Propagação passiva de voltagem em dendritos e axônios", en: "Passive voltage propagation in dendrites and axons"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas radiação", en: "Just radiation"}
          - {pt: "Apenas memória", en: "Just memory"}
        correctAnswer: {pt: "Propagação passiva de voltagem em dendritos e axônios", en: "Passive voltage propagation in dendrites and axons"}
        rationale: {pt: "Como dendrito é cabo com fuga, então sinais decaem com distância — princípio integrativo.", en: "Because dendrite is leaky cable, signals decay with distance — integrative principle."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Codificação por taxa de disparo:", en: "Rate coding:"}
        choices:
          - {pt: "Informação representada pela frequência média de spikes", en: "Information represented by average spike frequency"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estrutura", en: "Just structure"}
          - {pt: "Apenas timing absoluto", en: "Just absolute timing"}
        correctAnswer: {pt: "Informação representada pela frequência média de spikes", en: "Information represented by average spike frequency"}
        rationale: {pt: "Quando estímulo aumenta taxa, então cérebro lê magnitude pela contagem média.", en: "When stimulus raises rate, brain reads magnitude via average count."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Codificação temporal (timing) usa:", en: "Temporal (timing) coding uses:"}
        choices:
          - {pt: "Padrões precisos de tempo entre spikes (ms) para transmitir informação", en: "Precise inter-spike timing patterns (ms) to convey information"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas média lenta", en: "Just slow average"}
          - {pt: "Apenas estática", en: "Just static"}
        correctAnswer: {pt: "Padrões precisos de tempo entre spikes (ms) para transmitir informação", en: "Precise inter-spike timing patterns (ms) to convey information"}
        rationale: {pt: "Como sincronia entre neurônios importa, então timing carrega bits adicionais ao código por taxa.", en: "Because synchrony between neurons matters, timing carries extra bits beyond rate code."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Codificação populacional refere-se a:", en: "Population coding refers to:"}
        choices:
          - {pt: "Representação distribuída entre muitos neurônios juntos", en: "Distributed representation across many neurons together"}
          - {pt: "Apenas um neurônio", en: "Just one neuron"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Representação distribuída entre muitos neurônios juntos", en: "Distributed representation across many neurons together"}
        rationale: {pt: "Como ruído individual é alto, então populações tornam representação robusta e precisa.", en: "Because individual noise is high, populations make representation robust and precise."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Plasticidade Hebbiana clássica:", en: "Classic Hebbian plasticity:"}
        choices:
          - {pt: "Sinapse fortalece quando pré e pós disparam juntos (correlação)", en: "Synapse strengthens when pre and post fire together (correlation)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas independência", en: "Just independence"}
          - {pt: "Apenas memória", en: "Just memory"}
        correctAnswer: {pt: "Sinapse fortalece quando pré e pós disparam juntos (correlação)", en: "Synapse strengthens when pre and post fire together (correlation)"}
        rationale: {pt: "Quando atividade é correlacionada, então circuitos formam representações associativas duráveis.", en: "When activity is correlated, circuits form durable associative representations."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "STDP (plasticidade dependente de timing):", en: "STDP (spike-timing dependent plasticity):"}
        choices:
          - {pt: "Pré antes de pós potencializa; pós antes de pré deprime — sensível ao tempo", en: "Pre before post potentiates; post before pre depresses — time-sensitive"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas Hebbiana clássica", en: "Just classic Hebbian"}
          - {pt: "Apenas memória", en: "Just memory"}
        correctAnswer: {pt: "Pré antes de pós potencializa; pós antes de pré deprime — sensível ao tempo", en: "Pre before post potentiates; post before pre depresses — time-sensitive"}
        rationale: {pt: "Como ordem temporal codifica causalidade, então STDP refina aprendizado em milissegundos.", en: "Because temporal order encodes causality, STDP refines learning in milliseconds."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Redes neurais artificiais inspiraram-se em:", en: "Artificial neural networks were inspired by:"}
        choices:
          - {pt: "Estrutura cerebral, mas operam em abstração simplificada (perceptron, deep learning)", en: "Brain structure, but operate in simplified abstraction (perceptron, deep learning)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas Hodgkin-Huxley fiel", en: "Just faithful Hodgkin-Huxley"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Estrutura cerebral, mas operam em abstração simplificada (perceptron, deep learning)", en: "Brain structure, but operate in simplified abstraction (perceptron, deep learning)"}
        rationale: {pt: "Quando inspiração biológica encontra otimização matemática, então IA atinge resultados poderosos.", en: "When biological inspiration meets mathematical optimization, AI reaches powerful results."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Conectomas e interfaces", en: "Connectomes and interfaces"}
    description: {pt: "Mapeando o cérebro e conectando-o a máquinas.", en: "Mapping the brain and connecting it to machines."}
    exercises:
      - type: choice
        question: {pt: "Conectoma é:", en: "Connectome is:"}
        choices:
          - {pt: "Mapa completo das conexões neurais de um sistema nervoso", en: "Complete map of neural connections in a nervous system"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas memória", en: "Just memory"}
        correctAnswer: {pt: "Mapa completo das conexões neurais de um sistema nervoso", en: "Complete map of neural connections in a nervous system"}
        rationale: {pt: "Como função emerge da fiação, então conectoma é referência estrutural para entender comportamento.", en: "Because function emerges from wiring, connectome is structural reference to understand behavior."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Conectoma de C. elegans (302 neurônios):", en: "C. elegans connectome (302 neurons):"}
        choices:
          - {pt: "Foi o primeiro mapeado completamente — referência canônica", en: "Was the first completely mapped — canonical reference"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Ainda desconhecido", en: "Still unknown"}
          - {pt: "Apenas humano", en: "Only human"}
        correctAnswer: {pt: "Foi o primeiro mapeado completamente — referência canônica", en: "Was the first completely mapped — canonical reference"}
        rationale: {pt: "Quando organismo é pequeno e estereotipado, então circuito completo cabe em microscopia eletrônica.", en: "When organism is small and stereotyped, complete circuit fits in electron microscopy."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "fMRI mede:", en: "fMRI measures:"}
        choices:
          - {pt: "Fluxo sanguíneo cerebral via sinal BOLD — proxy de atividade neural", en: "Cerebral blood flow via BOLD signal — proxy of neural activity"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas spike direto", en: "Just direct spike"}
        correctAnswer: {pt: "Fluxo sanguíneo cerebral via sinal BOLD — proxy de atividade neural", en: "Cerebral blood flow via BOLD signal — proxy of neural activity"}
        rationale: {pt: "Como neurônios ativos consomem mais O₂, então BOLD localiza onde processo está acontecendo.", en: "Because active neurons consume more O₂, BOLD locates where processing happens."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "EEG mede:", en: "EEG measures:"}
        choices:
          - {pt: "Atividade elétrica cortical de muitos neurônios via eletrodos no couro cabeludo", en: "Cortical electrical activity from many neurons via scalp electrodes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas magnética", en: "Just magnetic"}
        correctAnswer: {pt: "Atividade elétrica cortical de muitos neurônios via eletrodos no couro cabeludo", en: "Cortical electrical activity from many neurons via scalp electrodes"}
        rationale: {pt: "Como temporal é alto e espacial baixo, então EEG complementa fMRI em escalas opostas.", en: "Because temporal is high and spatial low, EEG complements fMRI on opposite scales."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Interface cérebro-máquina (BCI) permite:", en: "Brain-computer interface (BCI) allows:"}
        choices:
          - {pt: "Controle de dispositivos por sinais cerebrais (próteses, cursor, fala)", en: "Device control via brain signals (prostheses, cursor, speech)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas fim de jogo", en: "Just game end"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Controle de dispositivos por sinais cerebrais (próteses, cursor, fala)", en: "Device control via brain signals (prostheses, cursor, speech)"}
        rationale: {pt: "Quando sinais neurais são decodificados, então pacientes paralisados recuperam autonomia.", en: "When neural signals are decoded, paralyzed patients regain autonomy."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Optogenética permite:", en: "Optogenetics allows:"}
        choices:
          - {pt: "Ativar/desativar neurônios com luz via canais sensíveis (canalrodopsinas)", en: "Activate/deactivate neurons with light via sensitive channels (channelrhodopsins)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas observação passiva", en: "Just passive observation"}
        correctAnswer: {pt: "Ativar/desativar neurônios com luz via canais sensíveis (canalrodopsinas)", en: "Activate/deactivate neurons with light via sensitive channels (channelrhodopsins)"}
        rationale: {pt: "Como controle é em milissegundos e celular específico, então causalidade neural fica testável.", en: "Because control is in milliseconds and cell-specific, neural causality becomes testable."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Aprendizado profundo (deep learning) ajuda a:", en: "Deep learning helps to:"}
        choices:
          - {pt: "Decodificar sinais neurais e modelar funções cognitivas (visão, linguagem)", en: "Decode neural signals and model cognitive functions (vision, language)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas memória", en: "Just memory"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Decodificar sinais neurais e modelar funções cognitivas (visão, linguagem)", en: "Decode neural signals and model cognitive functions (vision, language)"}
        rationale: {pt: "Quando redes treinam em muitos dados, então padrões neurais complexos tornam-se interpretáveis.", en: "When networks train on much data, complex neural patterns become interpretable."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Teoria preditiva (predictive coding) propõe:", en: "Predictive coding theory proposes:"}
        choices:
          - {pt: "Cérebro gera previsões e propaga apenas erros (diferença entre previsto e observado)", en: "Brain generates predictions and propagates only errors (predicted vs. observed difference)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas reação passiva", en: "Just passive reaction"}
          - {pt: "Apenas memória", en: "Just memory"}
        correctAnswer: {pt: "Cérebro gera previsões e propaga apenas erros (diferença entre previsto e observado)", en: "Brain generates predictions and propagates only errors (predicted vs. observed difference)"}
        rationale: {pt: "Como economiza energia, então previsão hierárquica explica percepção, atenção e ilusões.", en: "Because it saves energy, hierarchical prediction explains perception, attention and illusions."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Neurônios espelho ativam-se quando:", en: "Mirror neurons activate when:"}
        choices:
          - {pt: "Animal age e quando observa outro fazendo a mesma ação", en: "Animal acts and when it observes another doing the same action"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas memória", en: "Just memory"}
          - {pt: "Apenas dor", en: "Just pain"}
        correctAnswer: {pt: "Animal age e quando observa outro fazendo a mesma ação", en: "Animal acts and when it observes another doing the same action"}
        rationale: {pt: "Como mapeiam ação observada, então sustentam aprendizado por imitação e empatia motora.", en: "Because they map observed action, they support imitation learning and motor empathy."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Big projects em neurociência (BRAIN, HBP) buscam:", en: "Big neuroscience projects (BRAIN, HBP) aim to:"}
        choices:
          - {pt: "Mapear, simular e entender o cérebro em larga escala", en: "Map, simulate and understand the brain at large scale"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas turismo", en: "Just tourism"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Mapear, simular e entender o cérebro em larga escala", en: "Map, simulate and understand the brain at large scale"}
        rationale: {pt: "Quando esforço coletivo escala, então técnicas e padrões compartilhados aceleram descobertas.", en: "When collective effort scales, shared techniques and standards accelerate discoveries."}
        objectives: [biology.computational_neuroscience]
        difficulty: 5
target: 20
