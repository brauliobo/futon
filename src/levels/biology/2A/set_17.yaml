title:
  pt: "⏳ Geroscience e longevidade"
  en: "⏳ Geroscience and longevity"
level: '2A'
subject: biology
objectives: [biology.geroscience]
difficulty: 5
authorNotes: "Hallmarks do envelhecimento, senolíticos, restrição calórica, reprogramação parcial, modelos de longevidade."
example:
  pt: "Ex.: dano celular acumula → senescência → SASP inflamatório → senolítico remove → função tecidual recupera."
  en: "Ex.: cellular damage accumulates → senescence → inflammatory SASP → senolytic removes → tissue function recovers."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Marcas do envelhecimento", en: "Hallmarks of aging"}
    description: {pt: "Os processos celulares do envelhecimento.", en: "Cellular aging processes."}
    exercises:
      - type: choice
        question: {pt: "Geroscience é:", en: "Geroscience is:"}
        choices:
          - {pt: "Estudo dos mecanismos do envelhecimento como alvo de intervenção médica", en: "Study of aging mechanisms as medical intervention target"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas medicina pediátrica", en: "Just pediatric medicine"}
          - {pt: "Apenas dieta isolada", en: "Just isolated diet"}
        correctAnswer: {pt: "Estudo dos mecanismos do envelhecimento como alvo de intervenção médica", en: "Study of aging mechanisms as medical intervention target"}
        rationale: {pt: "Como envelhecimento dirige doenças crônicas, então atacá-lo previne múltiplas patologias simultaneamente.", en: "Because aging drives chronic diseases, targeting it prevents multiple pathologies at once."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Encurtamento de telômeros está ligado a:", en: "Telomere shortening is linked to:"}
        choices:
          - {pt: "Limite de Hayflick e senescência replicativa", en: "Hayflick limit and replicative senescence"}
          - {pt: "Apenas crescimento ilimitado", en: "Just unlimited growth"}
          - {pt: "Apenas tradução de proteína", en: "Just protein translation"}
          - {pt: "Apenas dieta", en: "Just diet"}
        correctAnswer: {pt: "Limite de Hayflick e senescência replicativa", en: "Hayflick limit and replicative senescence"}
        rationale: {pt: "Como DNA-polimerase não copia ponta linear, então cada divisão encurta telômeros até parada.", en: "Because DNA-polymerase doesn't copy linear ends, each division shortens telomeres until arrest."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Senescência celular leva à secreção de:", en: "Cellular senescence leads to secretion of:"}
        choices:
          - {pt: "Fenótipo SASP — citocinas, proteases, fatores pró-inflamatórios", en: "SASP phenotype — cytokines, proteases, proinflammatory factors"}
          - {pt: "Apenas hormônios sexuais", en: "Just sex hormones"}
          - {pt: "Apenas neurotransmissores", en: "Just neurotransmitters"}
          - {pt: "Apenas glicose", en: "Just glucose"}
        correctAnswer: {pt: "Fenótipo SASP — citocinas, proteases, fatores pró-inflamatórios", en: "SASP phenotype — cytokines, proteases, proinflammatory factors"}
        rationale: {pt: "Quando célula senescente persiste, então SASP inflama tecido e propaga dano em paracrine.", en: "When senescent cell persists, SASP inflames tissue and spreads damage paracrine."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Disfunção mitocondrial em envelhecimento causa:", en: "Mitochondrial dysfunction in aging causes:"}
        choices:
          - {pt: "Menor ATP e mais espécies reativas de oxigênio (ROS)", en: "Less ATP and more reactive oxygen species (ROS)"}
          - {pt: "Apenas mais energia", en: "Just more energy"}
          - {pt: "Apenas digestão lenta", en: "Just slow digestion"}
          - {pt: "Apenas memória breve", en: "Just brief memory"}
        correctAnswer: {pt: "Menor ATP e mais espécies reativas de oxigênio (ROS)", en: "Less ATP and more reactive oxygen species (ROS)"}
        rationale: {pt: "Como cadeia respiratória vaza elétrons, então ROS daninha proteínas, DNA e membranas.", en: "Because respiratory chain leaks electrons, ROS damages proteins, DNA and membranes."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Proteostase é:", en: "Proteostasis is:"}
        choices:
          - {pt: "Equilíbrio entre síntese, dobramento e degradação de proteínas", en: "Balance between synthesis, folding and degradation of proteins"}
          - {pt: "Apenas síntese constante", en: "Just constant synthesis"}
          - {pt: "Apenas degradação acelerada", en: "Just accelerated degradation"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Equilíbrio entre síntese, dobramento e degradação de proteínas", en: "Balance between synthesis, folding and degradation of proteins"}
        rationale: {pt: "Quando proteostase falha, então agregados (Alzheimer, Parkinson) acumulam e disfunção surge.", en: "When proteostasis fails, aggregates (Alzheimer, Parkinson) accumulate and dysfunction emerges."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Autofagia declina com idade — sua função é:", en: "Autophagy declines with age — its function is:"}
        choices:
          - {pt: "Reciclagem de organelas e proteínas danificadas", en: "Recycling of damaged organelles and proteins"}
          - {pt: "Apenas crescimento", en: "Just growth"}
          - {pt: "Apenas reprodução", en: "Just reproduction"}
          - {pt: "Apenas digestão alimentar", en: "Just food digestion"}
        correctAnswer: {pt: "Reciclagem de organelas e proteínas danificadas", en: "Recycling of damaged organelles and proteins"}
        rationale: {pt: "Como célula faz limpeza interna, então autofagia mantém qualidade molecular ao longo do tempo.", en: "Because cell performs inner cleaning, autophagy maintains molecular quality over time."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Detecção alterada de nutrientes (mTOR, AMPK, IGF-1) afeta:", en: "Altered nutrient sensing (mTOR, AMPK, IGF-1) affects:"}
        choices:
          - {pt: "Crescimento, autofagia e longevidade — vias evolutivamente conservadas", en: "Growth, autophagy and longevity — evolutionarily conserved pathways"}
          - {pt: "Apenas memória", en: "Just memory"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas reprodução", en: "Just reproduction"}
        correctAnswer: {pt: "Crescimento, autofagia e longevidade — vias evolutivamente conservadas", en: "Growth, autophagy and longevity — evolutionarily conserved pathways"}
        rationale: {pt: "Quando inibimos mTOR (rapamicina), então autofagia sobe e vida média se estende em modelos.", en: "When mTOR is inhibited (rapamycin), autophagy rises and median lifespan extends in models."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Inflamação crônica de baixo grau ('inflammaging'):", en: "Chronic low-grade inflammation ('inflammaging'):"}
        choices:
          - {pt: "Estado inflamatório persistente associado ao envelhecimento e doenças crônicas", en: "Persistent inflammatory state linked to aging and chronic diseases"}
          - {pt: "Apenas resfriado agudo", en: "Just acute cold"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas alergia sazonal", en: "Just seasonal allergy"}
        correctAnswer: {pt: "Estado inflamatório persistente associado ao envelhecimento e doenças crônicas", en: "Persistent inflammatory state linked to aging and chronic diseases"}
        rationale: {pt: "Quando SASP e disbiose somam, então inflamação crônica acelera múltiplas patologias.", en: "When SASP and dysbiosis add up, chronic inflammation accelerates multiple pathologies."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Esgotamento de células-tronco contribui para:", en: "Stem cell exhaustion contributes to:"}
        choices:
          - {pt: "Falha de reposição tecidual em órgãos com idade avançada", en: "Tissue replacement failure in aged organs"}
          - {pt: "Apenas crescimento", en: "Just growth"}
          - {pt: "Apenas hidratação", en: "Just hydration"}
          - {pt: "Apenas reflexo", en: "Just reflex"}
        correctAnswer: {pt: "Falha de reposição tecidual em órgãos com idade avançada", en: "Tissue replacement failure in aged organs"}
        rationale: {pt: "Como reservatórios diminuem, então reparo lento contribui para fragilidade do idoso.", en: "Because reservoirs shrink, slow repair contributes to elderly frailty."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Comunicação intercelular alterada inclui:", en: "Altered intercellular communication includes:"}
        choices:
          - {pt: "Sinalização hormonal e exossômica disfuncional entre tecidos", en: "Dysfunctional hormonal and exosomal signaling between tissues"}
          - {pt: "Apenas grito", en: "Just shouting"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas leitura", en: "Just reading"}
        correctAnswer: {pt: "Sinalização hormonal e exossômica disfuncional entre tecidos", en: "Dysfunctional hormonal and exosomal signaling between tissues"}
        rationale: {pt: "Quando 'fofoca' celular fica errada, então órgãos perdem coordenação sistêmica.", en: "When cellular 'gossip' goes wrong, organs lose systemic coordination."}
        objectives: [biology.geroscience]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Intervenções e modelos", en: "Interventions and models"}
    description: {pt: "O que prolonga vida saudável?", en: "What extends healthspan?"}
    exercises:
      - type: choice
        question: {pt: "Restrição calórica:", en: "Caloric restriction:"}
        choices:
          - {pt: "Estende vida em vários modelos sem desnutrição (ratos, leveduras, primatas parcial)", en: "Extends life in many models without malnutrition (rodents, yeasts, partial primates)"}
          - {pt: "Apenas perde peso e fica fraco", en: "Just loses weight and becomes weak"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Estende vida em vários modelos sem desnutrição (ratos, leveduras, primatas parcial)", en: "Extends life in many models without malnutrition (rodents, yeasts, partial primates)"}
        rationale: {pt: "Como ativa AMPK e autofagia, então restrição mimetiza estado de longevidade molecular.", en: "Because it activates AMPK and autophagy, restriction mimics molecular longevity state."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Senolíticos são fármacos que:", en: "Senolytics are drugs that:"}
        choices:
          - {pt: "Eliminam seletivamente células senescentes (ex.: dasatinibe + quercetina)", en: "Selectively eliminate senescent cells (e.g., dasatinib + quercetin)"}
          - {pt: "Apenas tonificam pele", en: "Just tone skin"}
          - {pt: "Apenas suplemento", en: "Just supplement"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Eliminam seletivamente células senescentes (ex.: dasatinibe + quercetina)", en: "Selectively eliminate senescent cells (e.g., dasatinib + quercetin)"}
        rationale: {pt: "Quando removemos células zumbis, então tecido rejuvenesce funcionalmente em modelos animais.", en: "When we remove zombie cells, tissue functionally rejuvenates in animal models."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Rapamicina prolonga vida via:", en: "Rapamycin extends life via:"}
        choices:
          - {pt: "Inibição de mTOR e indução de autofagia", en: "mTOR inhibition and autophagy induction"}
          - {pt: "Apenas vitamina", en: "Just vitamin"}
          - {pt: "Apenas suplemento natural", en: "Just natural supplement"}
          - {pt: "Apenas placebo", en: "Just placebo"}
        correctAnswer: {pt: "Inibição de mTOR e indução de autofagia", en: "mTOR inhibition and autophagy induction"}
        rationale: {pt: "Como bloqueia anabolismo excessivo, então célula entra em modo de manutenção e durabilidade.", en: "Because it blocks excess anabolism, cell enters maintenance and durability mode."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Metformina (uso original em diabetes) é estudada em geroscience por:", en: "Metformin (originally for diabetes) is studied in geroscience for:"}
        choices:
          - {pt: "Ativar AMPK e potenciais efeitos pró-longevidade humana", en: "Activating AMPK and potential pro-longevity human effects"}
          - {pt: "Apenas hidratar", en: "Just hydrate"}
          - {pt: "Apenas reduzir febre", en: "Just lower fever"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Ativar AMPK e potenciais efeitos pró-longevidade humana", en: "Activating AMPK and potential pro-longevity human effects"}
        rationale: {pt: "Quando AMPK é ativado, então metabolismo se inclina para conservação celular.", en: "When AMPK is active, metabolism leans toward cellular conservation."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Reprogramação parcial in vivo (Yamanaka factors transientes) busca:", en: "Partial in vivo reprogramming (transient Yamanaka factors) seeks to:"}
        choices:
          - {pt: "Rejuvenescer células mantendo identidade — área experimental", en: "Rejuvenate cells while keeping identity — experimental area"}
          - {pt: "Apenas eliminar todas células", en: "Just eliminate all cells"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas dieta", en: "Just diet"}
        correctAnswer: {pt: "Rejuvenescer células mantendo identidade — área experimental", en: "Rejuvenate cells while keeping identity — experimental area"}
        rationale: {pt: "Como expressão pulsada apaga marcas epigenéticas envelhecidas, então células ganham fenótipo jovem.", en: "Because pulsed expression erases aged epigenetic marks, cells gain youthful phenotype."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Parabiose heterocrônica mostrou que:", en: "Heterochronic parabiosis showed that:"}
        choices:
          - {pt: "Sangue jovem rejuvenesce alguns tecidos em camundongos velhos", en: "Young blood rejuvenates some tissues in old mice"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética humana", en: "Just human aesthetics"}
          - {pt: "Apenas suplemento oral", en: "Just oral supplement"}
        correctAnswer: {pt: "Sangue jovem rejuvenesce alguns tecidos em camundongos velhos", en: "Young blood rejuvenates some tissues in old mice"}
        rationale: {pt: "Quando fatores circulantes mudam, então células-tronco e neurônios mostram melhora funcional.", en: "When circulating factors change, stem cells and neurons show functional improvement."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Modelos clássicos de longevidade incluem:", en: "Classic longevity models include:"}
        choices:
          - {pt: "C. elegans, Drosophila, camundongo, leveduras — genética conservada", en: "C. elegans, Drosophila, mouse, yeast — conserved genetics"}
          - {pt: "Apenas cães", en: "Just dogs"}
          - {pt: "Apenas peixes", en: "Just fish"}
          - {pt: "Apenas pássaros", en: "Just birds"}
        correctAnswer: {pt: "C. elegans, Drosophila, camundongo, leveduras — genética conservada", en: "C. elegans, Drosophila, mouse, yeast — conserved genetics"}
        rationale: {pt: "Como vias-chave (IIS, mTOR) atravessam táxons, então descobertas em vermes valem para humanos parcialmente.", en: "Because key pathways (IIS, mTOR) cross taxa, findings in worms partially translate to humans."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Mutação daf-2 em C. elegans:", en: "daf-2 mutation in C. elegans:"}
        choices:
          - {pt: "Dobra a longevidade reduzindo sinalização tipo insulina", en: "Doubles lifespan by reducing insulin-like signaling"}
          - {pt: "Apenas mata o verme", en: "Just kills the worm"}
          - {pt: "Apenas mantém igual", en: "Just keeps same"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Dobra a longevidade reduzindo sinalização tipo insulina", en: "Doubles lifespan by reducing insulin-like signaling"}
        rationale: {pt: "Quando descobriram daf-2, então provaram que longevidade tem controle genético singular.", en: "When daf-2 was discovered, it proved longevity has singular genetic control."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Healthspan (vida saudável) é prioritário porque:", en: "Healthspan is prioritized because:"}
        choices:
          - {pt: "Estender vida sem qualidade significa mais anos doentes — meta é comprimir morbidade", en: "Extending life without quality means more sick years — goal is to compress morbidity"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas economia", en: "Just economics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Estender vida sem qualidade significa mais anos doentes — meta é comprimir morbidade", en: "Extending life without quality means more sick years — goal is to compress morbidity"}
        rationale: {pt: "Como objetivo é viver bem mais tempo, então atrasar doença é mais importante que somar anos finais.", en: "Because goal is to live well longer, delaying disease matters more than adding terminal years."}
        objectives: [biology.geroscience]
        difficulty: 5
      - type: choice
        question: {pt: "Exercício e sono são:", en: "Exercise and sleep are:"}
        choices:
          - {pt: "Intervenções comportamentais com efeito profundo em hallmarks do envelhecimento", en: "Behavioral interventions with deep effect on aging hallmarks"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas modismos", en: "Just fads"}
          - {pt: "Apenas suplementos", en: "Just supplements"}
        correctAnswer: {pt: "Intervenções comportamentais com efeito profundo em hallmarks do envelhecimento", en: "Behavioral interventions with deep effect on aging hallmarks"}
        rationale: {pt: "Quando combinados, então exercício e sono modulam mTOR, autofagia, inflamação e mitocôndria.", en: "When combined, exercise and sleep modulate mTOR, autophagy, inflammation and mitochondria."}
        objectives: [biology.geroscience]
        difficulty: 5
target: 20
