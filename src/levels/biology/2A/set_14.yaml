title:
  pt: "🌿 Etnobiologia e conhecimento tradicional"
  en: "🌿 Ethnobiology and traditional knowledge"
level: '2A'
subject: biology
objectives: [biology.ethnobiology]
difficulty: 5
authorNotes: "Etnobotânica, etnozoologia, conhecimento tradicional, biopirataria, descoberta de fármacos, conservação biocultural."
example:
  pt: "Ex.: comunidade tradicional → uso de planta para febre → bioprospecção ética → composto isolado → fármaco."
  en: "Ex.: traditional community → plant used for fever → ethical bioprospecting → isolated compound → drug."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Etnobiologia", en: "Ethnobiology"}
    description: {pt: "Como povos compreendem e usam a biodiversidade.", en: "How peoples understand and use biodiversity."}
    exercises:
      - type: choice
        question: {pt: "Etnobiologia estuda:", en: "Ethnobiology studies:"}
        choices:
          - {pt: "Relações entre povos e organismos vivos em seu ambiente", en: "Relations between peoples and living organisms in their environment"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA humano", en: "Just human DNA"}
          - {pt: "Apenas estética visual", en: "Just visual aesthetics"}
        correctAnswer: {pt: "Relações entre povos e organismos vivos em seu ambiente", en: "Relations between peoples and living organisms in their environment"}
        rationale: {pt: "Como conhecimento local acumula séculos de observação, então integra ciência e cultura.", en: "Because local knowledge accumulates centuries of observation, it integrates science and culture."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Etnobotânica concentra-se em:", en: "Ethnobotany focuses on:"}
        choices:
          - {pt: "Uso de plantas por culturas humanas (medicinal, alimentar, ritual)", en: "Plant use by human cultures (medicinal, food, ritual)"}
          - {pt: "Apenas animais", en: "Just animals"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas geologia", en: "Just geology"}
        correctAnswer: {pt: "Uso de plantas por culturas humanas (medicinal, alimentar, ritual)", en: "Plant use by human cultures (medicinal, food, ritual)"}
        rationale: {pt: "Quando documentamos uso, então preservamos saber em risco de desaparecer.", en: "When we document use, we preserve knowledge at risk of disappearing."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Etnozoologia estuda:", en: "Ethnozoology studies:"}
        choices:
          - {pt: "Conhecimentos e usos humanos sobre animais (caça, criação, cura)", en: "Human knowledge and uses of animals (hunting, husbandry, healing)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas plantas", en: "Just plants"}
          - {pt: "Apenas registro histórico", en: "Just historical record"}
        correctAnswer: {pt: "Conhecimentos e usos humanos sobre animais (caça, criação, cura)", en: "Human knowledge and uses of animals (hunting, husbandry, healing)"}
        rationale: {pt: "Como caçadores conhecem comportamento animal detalhadamente, então etnozoologia gera dados ecológicos valiosos.", en: "Because hunters know animal behavior in detail, ethnozoology generates valuable ecological data."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Etnoecologia foca em:", en: "Ethnoecology focuses on:"}
        choices:
          - {pt: "Compreensão de ecossistemas por culturas locais (manejo, classificação)", en: "Understanding of ecosystems by local cultures (management, classification)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA viral", en: "Just viral DNA"}
          - {pt: "Apenas categoria taxonômica", en: "Just taxonomic category"}
        correctAnswer: {pt: "Compreensão de ecossistemas por culturas locais (manejo, classificação)", en: "Understanding of ecosystems by local cultures (management, classification)"}
        rationale: {pt: "Quando comunidades classificam habitats, então capturam complexidade que ciência ocidental às vezes ignora.", en: "When communities classify habitats, they capture complexity Western science sometimes misses."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Conhecimento tradicional ecológico (TEK):", en: "Traditional ecological knowledge (TEK):"}
        choices:
          - {pt: "Saber acumulado e transmitido por gerações sobre o ambiente", en: "Knowledge accumulated and passed down through generations about the environment"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas livros recentes", en: "Just recent books"}
          - {pt: "Apenas formalidade burocrática", en: "Just bureaucratic formality"}
        correctAnswer: {pt: "Saber acumulado e transmitido por gerações sobre o ambiente", en: "Knowledge accumulated and passed down through generations about the environment"}
        rationale: {pt: "Como TEK reflete experimentação coletiva, então complementa pesquisa científica formal.", en: "Because TEK reflects collective experimentation, it complements formal scientific research."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Aspirina (ácido acetilsalicílico) tem origem em:", en: "Aspirin (acetylsalicylic acid) has origin in:"}
        choices:
          - {pt: "Salicina da casca de salgueiro, usada por séculos contra dor/febre", en: "Willow bark salicin, used for centuries for pain/fever"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas síntese moderna do zero", en: "Just modern synthesis from scratch"}
          - {pt: "Apenas mineral", en: "Just mineral"}
        correctAnswer: {pt: "Salicina da casca de salgueiro, usada por séculos contra dor/febre", en: "Willow bark salicin, used for centuries for pain/fever"}
        rationale: {pt: "Quando uso tradicional inspira química medicinal, então fármacos modernos surgem por etnobotânica.", en: "When traditional use inspires medicinal chemistry, modern drugs arise via ethnobotany."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Quinina, contra malária, vem de:", en: "Quinine, for malaria, comes from:"}
        choices:
          - {pt: "Casca da Cinchona, usada por povos andinos", en: "Cinchona bark, used by Andean peoples"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas mineral", en: "Just mineral"}
          - {pt: "Apenas curiosidade trivial", en: "Just trivial curiosity"}
        correctAnswer: {pt: "Casca da Cinchona, usada por povos andinos", en: "Cinchona bark, used by Andean peoples"}
        rationale: {pt: "Como saber andino chegou à Europa, então quinina dominou tratamento antimalárico por séculos.", en: "Because Andean knowledge reached Europe, quinine dominated antimalarial treatment for centuries."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Curare (paralisante muscular) foi descoberto via:", en: "Curare (muscle paralyzer) was discovered via:"}
        choices:
          - {pt: "Uso indígena amazônico em flechas, depois isolado para anestesia", en: "Amazonian indigenous use on arrows, later isolated for anesthesia"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas síntese química do zero", en: "Just chemical synthesis from scratch"}
          - {pt: "Apenas mineral", en: "Just mineral"}
        correctAnswer: {pt: "Uso indígena amazônico em flechas, depois isolado para anestesia", en: "Amazonian indigenous use on arrows, later isolated for anesthesia"}
        rationale: {pt: "Quando observação etnográfica precede química, então fármacos cirúrgicos modernos têm raiz indígena.", en: "When ethnographic observation precedes chemistry, modern surgical drugs have indigenous roots."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Variedades crioulas de plantas cultivadas:", en: "Heirloom plant varieties:"}
        choices:
          - {pt: "Diversidade agrícola mantida por agricultores tradicionais — reservatório genético", en: "Agricultural diversity kept by traditional farmers — genetic reservoir"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas industrial", en: "Just industrial"}
          - {pt: "Apenas convenção arbitrária", en: "Just arbitrary convention"}
        correctAnswer: {pt: "Diversidade agrícola mantida por agricultores tradicionais — reservatório genético", en: "Agricultural diversity kept by traditional farmers — genetic reservoir"}
        rationale: {pt: "Como crioulas resistem a pragas e clima local, então preservam alelos úteis para melhoramento futuro.", en: "Because heirlooms resist local pests and climate, they preserve alleles useful for future breeding."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Bioprospecção é:", en: "Bioprospecting is:"}
        choices:
          - {pt: "Busca sistemática de moléculas úteis em organismos (fármacos, enzimas)", en: "Systematic search for useful molecules in organisms (drugs, enzymes)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas turismo", en: "Just tourism"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Busca sistemática de moléculas úteis em organismos (fármacos, enzimas)", en: "Systematic search for useful molecules in organisms (drugs, enzymes)"}
        rationale: {pt: "Quando combinamos taxonomia, ecologia e química, então biodiversidade vira fonte sustentável de inovação.", en: "When we combine taxonomy, ecology and chemistry, biodiversity becomes a sustainable source of innovation."}
        objectives: [biology.ethnobiology]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Ética, biopirataria e conservação biocultural", en: "Ethics, biopiracy and biocultural conservation"}
    description: {pt: "Como respeitar quem detém o conhecimento.", en: "How to respect those who hold knowledge."}
    exercises:
      - type: choice
        question: {pt: "Biopirataria é:", en: "Biopiracy is:"}
        choices:
          - {pt: "Apropriação de recursos genéticos/conhecimento tradicional sem consentimento ou repartição de benefícios", en: "Appropriation of genetic resources/traditional knowledge without consent or benefit sharing"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas comércio legal", en: "Just legal trade"}
          - {pt: "Apenas anotação acessória", en: "Just side note"}
        correctAnswer: {pt: "Apropriação de recursos genéticos/conhecimento tradicional sem consentimento ou repartição de benefícios", en: "Appropriation of genetic resources/traditional knowledge without consent or benefit sharing"}
        rationale: {pt: "Como sai conhecimento sem retorno justo, então biopirataria perpetua desigualdade global.", en: "Because knowledge leaves with no fair return, biopiracy perpetuates global inequity."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Protocolo de Nagoya estabelece:", en: "Nagoya Protocol establishes:"}
        choices:
          - {pt: "Acesso a recursos genéticos com consentimento e repartição justa de benefícios (ABS)", en: "Genetic resource access with consent and fair benefit sharing (ABS)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas turismo", en: "Just tourism"}
          - {pt: "Apenas pesca", en: "Just fishing"}
        correctAnswer: {pt: "Acesso a recursos genéticos com consentimento e repartição justa de benefícios (ABS)", en: "Genetic resource access with consent and fair benefit sharing (ABS)"}
        rationale: {pt: "Quando países regulam coleta, então comunidades-fonte recebem reconhecimento e parte do benefício.", en: "When countries regulate collection, source communities receive recognition and benefit share."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Consentimento livre, prévio e informado (CLPI) significa:", en: "Free, prior and informed consent (FPIC) means:"}
        choices:
          - {pt: "Comunidades autorizam pesquisa após entender escopo, riscos e benefícios", en: "Communities authorize research after understanding scope, risks and benefits"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas formalidade legal genérica", en: "Just generic legal formality"}
          - {pt: "Apenas item de catálogo", en: "Just catalog item"}
        correctAnswer: {pt: "Comunidades autorizam pesquisa após entender escopo, riscos e benefícios", en: "Communities authorize research after understanding scope, risks and benefits"}
        rationale: {pt: "Como decisões afetam povos, então autonomia exige informação plena antecipada.", en: "Because decisions affect peoples, autonomy requires full information beforehand."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Conservação biocultural integra:", en: "Biocultural conservation integrates:"}
        choices:
          - {pt: "Diversidade biológica e cultural — proteção mútua de natureza e povos", en: "Biological and cultural diversity — mutual protection of nature and peoples"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas museu", en: "Just museum"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Diversidade biológica e cultural — proteção mútua de natureza e povos", en: "Biological and cultural diversity — mutual protection of nature and peoples"}
        rationale: {pt: "Como linguagens e ecossistemas declinam juntos, então proteger uma fortalece a outra.", en: "Because languages and ecosystems decline together, protecting one strengthens the other."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Áreas protegidas geridas por indígenas:", en: "Indigenous-managed protected areas:"}
        choices:
          - {pt: "Frequentemente apresentam tanta ou mais biodiversidade que reservas estatais", en: "Often show as much or more biodiversity than state reserves"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre piores", en: "Always worse"}
          - {pt: "Apenas tradição cultural", en: "Just cultural tradition"}
        correctAnswer: {pt: "Frequentemente apresentam tanta ou mais biodiversidade que reservas estatais", en: "Often show as much or more biodiversity than state reserves"}
        rationale: {pt: "Quando manejo tradicional persiste, então floresta permanece em pé com gestão cultural sustentável.", en: "When traditional management persists, forest stays standing with sustainable cultural stewardship."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Domesticação de plantas começou há:", en: "Plant domestication began:"}
        choices:
          - {pt: "~10-12 mil anos no início do Holoceno em vários centros independentes", en: "~10-12 thousand years ago in early Holocene at several independent centers"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas no século XX", en: "Only in 20th century"}
          - {pt: "Apenas há 100 anos", en: "Just 100 years ago"}
        correctAnswer: {pt: "~10-12 mil anos no início do Holoceno em vários centros independentes", en: "~10-12 thousand years ago in early Holocene at several independent centers"}
        rationale: {pt: "Como agricultura emergiu paralelamente, então civilizações cresceram em torno de cultivos locais.", en: "Because agriculture emerged in parallel, civilizations grew around local crops."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Centros vavilovianos referem-se a:", en: "Vavilov centers refer to:"}
        choices:
          - {pt: "Regiões com alta diversidade genética de plantas cultivadas — origens da domesticação", en: "Regions with high genetic diversity of cultivated plants — domestication origins"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas zoologia", en: "Just zoology"}
          - {pt: "Apenas referência marginal", en: "Just marginal reference"}
        correctAnswer: {pt: "Regiões com alta diversidade genética de plantas cultivadas — origens da domesticação", en: "Regions with high genetic diversity of cultivated plants — domestication origins"}
        rationale: {pt: "Quando Vavilov mapeou diversidade, então identificou hotspots para coleta e melhoramento.", en: "When Vavilov mapped diversity, he identified hotspots for collection and breeding."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Conhecimento tradicional pode ajudar a:", en: "Traditional knowledge can help:"}
        choices:
          - {pt: "Adaptar comunidades a mudanças climáticas e prevenir desastres", en: "Adapt communities to climate change and prevent disasters"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas turismo", en: "Just tourism"}
          - {pt: "Apenas estética visual", en: "Just visual aesthetics"}
        correctAnswer: {pt: "Adaptar comunidades a mudanças climáticas e prevenir desastres", en: "Adapt communities to climate change and prevent disasters"}
        rationale: {pt: "Quando observação multigeracional detecta tendências, então adaptação local antecipa risco.", en: "When multigenerational observation detects trends, local adaptation anticipates risk."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Repatriação de coleções biológicas é:", en: "Repatriation of biological collections is:"}
        choices:
          - {pt: "Devolução de espécimes/saber às comunidades de origem", en: "Return of specimens/knowledge to source communities"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas turismo", en: "Just tourism"}
          - {pt: "Apenas comercial", en: "Just commercial"}
        correctAnswer: {pt: "Devolução de espécimes/saber às comunidades de origem", en: "Return of specimens/knowledge to source communities"}
        rationale: {pt: "Como reparação histórica importa, então museus e bancos genéticos repatriam material.", en: "Because historical reparation matters, museums and gene banks repatriate material."}
        objectives: [biology.ethnobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Pesquisa colaborativa com comunidades requer:", en: "Collaborative research with communities requires:"}
        choices:
          - {pt: "Desenho conjunto, autoria compartilhada, retorno tangível", en: "Joint design, shared authorship, tangible return"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas extração de dados", en: "Just data extraction"}
          - {pt: "Apenas registro histórico", en: "Just historical record"}
        correctAnswer: {pt: "Desenho conjunto, autoria compartilhada, retorno tangível", en: "Joint design, shared authorship, tangible return"}
        rationale: {pt: "Quando ciência é cocriada, então confiança cresce e resultados beneficiam todos.", en: "When science is cocreated, trust grows and results benefit everyone."}
        objectives: [biology.ethnobiology]
        difficulty: 5
target: 20
