        rationale: {pt: "Como inércia é desprezível, então bactérias precisam estratégias não-recíprocas para se mover.", en: "Because inertia is negligible, bacteria need non-reciprocal strategies to move."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Motores moleculares (cinesina, miosina) usam:", en: "Molecular motors (kinesin, myosin) use:"}
        choices:
          - {pt: "Hidrólise de ATP convertida em movimento direcional via mudanças conformacionais", en: "ATP hydrolysis converted to directional motion via conformational changes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas calor passivo", en: "Just passive heat"}
          - {pt: "Apenas estática", en: "Just static"}
        correctAnswer: {pt: "Hidrólise de ATP convertida em movimento direcional via mudanças conformacionais", en: "ATP hydrolysis converted to directional motion via conformational changes"}
        rationale: {pt: "Quando energia química muda forma, então proteína 'caminha' por trilho citoesquelético.", en: "When chemical energy changes shape, protein 'walks' along cytoskeletal track."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Microfluídica permite:", en: "Microfluidics allows:"}
        choices:
          - {pt: "Manipular volumes minúsculos para análise de células únicas e gotas", en: "Manipulate tiny volumes for single-cell and droplet analysis"}
          - {pt: "Apenas litros enormes", en: "Just huge liters"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
        correctAnswer: {pt: "Manipular volumes minúsculos para análise de células únicas e gotas", en: "Manipulate tiny volumes for single-cell and droplet analysis"}
        rationale: {pt: "Quando reduzimos escala, então reagentes economizam e ensaios paralelos escalam.", en: "When we shrink scale, reagents are saved and parallel assays scale up."}
