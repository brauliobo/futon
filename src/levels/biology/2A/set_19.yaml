title:
  pt: "⚛️ Biologia quântica e biofísica de fronteira"
  en: "⚛️ Quantum biology and frontier biophysics"
level: '2A'
subject: biology
objectives: [biology.quantum_biology]
difficulty: 5
authorNotes: "Efeitos quânticos em biologia, fotossíntese, magnetorrecepção, olfato, microscopia avançada."
example:
  pt: "Ex.: fóton chega à clorofila → coerência quântica → energia transferida sem perda → fotossíntese eficiente."
  en: "Ex.: photon reaches chlorophyll → quantum coherence → lossless energy transfer → efficient photosynthesis."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Efeitos quânticos na vida", en: "Quantum effects in life"}
    description: {pt: "Onde física quântica encontra biologia.", en: "Where quantum physics meets biology."}
    exercises:
      - type: choice
        question: {pt: "Biologia quântica estuda:", en: "Quantum biology studies:"}
        choices:
          - {pt: "Fenômenos biológicos onde efeitos quânticos têm papel funcional", en: "Biological phenomena where quantum effects play functional role"}
          - {pt: "Apenas mecânica clássica", en: "Just classical mechanics"}
          - {pt: "Apenas DNA puro", en: "Just pure DNA"}
          - {pt: "Apenas termodinâmica", en: "Just thermodynamics"}
        correctAnswer: {pt: "Fenômenos biológicos onde efeitos quânticos têm papel funcional", en: "Biological phenomena where quantum effects play functional role"}
        rationale: {pt: "Como vida opera em escala molecular, então tunelamento e coerência podem ser relevantes.", en: "Because life operates at molecular scale, tunneling and coherence can be relevant."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Tunelamento de prótons em enzimas:", en: "Proton tunneling in enzymes:"}
        choices:
          - {pt: "Acelera transferências em reações de hidrogênio quando barreira é estreita", en: "Speeds up hydrogen transfers when barrier is narrow"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em laboratório frio", en: "Just in cold lab"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Acelera transferências em reações de hidrogênio quando barreira é estreita", en: "Speeds up hydrogen transfers when barrier is narrow"}
        rationale: {pt: "Quando massa é pequena, então probabilidade de tunelar pela barreira torna-se significativa.", en: "When mass is small, probability of tunneling through barrier becomes significant."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Coerência quântica em fotossíntese:", en: "Quantum coherence in photosynthesis:"}
        choices:
          - {pt: "Pode otimizar rota de transferência de energia em complexos coletores de luz", en: "May optimize energy transfer route in light-harvesting complexes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em vácuo", en: "Just in vacuum"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Pode otimizar rota de transferência de energia em complexos coletores de luz", en: "May optimize energy transfer route in light-harvesting complexes"}
        rationale: {pt: "Quando excitação se propaga como onda, então caminho mais eficiente é amostrado coerentemente.", en: "When excitation propagates as wave, most efficient path is sampled coherently."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Magnetorrecepção em aves migradoras envolve:", en: "Magnetoreception in migratory birds involves:"}
        choices:
          - {pt: "Pares de radicais em criptocromos sensíveis ao campo magnético", en: "Radical pairs in cryptochromes sensitive to magnetic field"}
          - {pt: "Apenas instinto sem mecanismo", en: "Just instinct without mechanism"}
          - {pt: "Apenas estética visual", en: "Just visual aesthetics"}
          - {pt: "Apenas memória", en: "Just memory"}
        correctAnswer: {pt: "Pares de radicais em criptocromos sensíveis ao campo magnético", en: "Radical pairs in cryptochromes sensitive to magnetic field"}
        rationale: {pt: "Quando spins eletrônicos são influenciados pelo campo, então ave decodifica direção da migração.", en: "When electron spins are influenced by field, bird decodes migration direction."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Olfato — teoria vibracional propõe:", en: "Olfaction — vibrational theory proposes:"}
        choices:
          - {pt: "Receptor detecta vibração molecular via tunelamento eletrônico (controverso)", en: "Receptor senses molecular vibration via electron tunneling (controversial)"}
          - {pt: "Apenas forma 'chave-fechadura'", en: "Just 'lock-key' shape"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas memória", en: "Just memory"}
        correctAnswer: {pt: "Receptor detecta vibração molecular via tunelamento eletrônico (controverso)", en: "Receptor senses molecular vibration via electron tunneling (controversial)"}
        rationale: {pt: "Como isótopos cheiram diferente em alguns testes, então mecanismo puramente forma é insuficiente.", en: "Because isotopes smell different in some tests, purely shape mechanism is insufficient."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Tunelamento eletrônico em cadeia respiratória:", en: "Electron tunneling in respiratory chain:"}
        choices:
          - {pt: "Permite saltos rápidos entre cofatores em complexos mitocondriais", en: "Enables fast hops between cofactors in mitochondrial complexes"}
          - {pt: "Apenas movimento clássico", en: "Just classical motion"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
        correctAnswer: {pt: "Permite saltos rápidos entre cofatores em complexos mitocondriais", en: "Enables fast hops between cofactors in mitochondrial complexes"}
        rationale: {pt: "Quando distância é nano e barreira fina, então elétron tunela em picosegundos.", en: "When distance is nano and barrier thin, electron tunnels in picoseconds."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Mutação por tautomerização (Löwdin) sugere:", en: "Tautomerization mutation (Löwdin) suggests:"}
        choices:
          - {pt: "Tunelamento de prótons em pares de bases pode gerar mismatches raros", en: "Proton tunneling in base pairs may generate rare mismatches"}
          - {pt: "Apenas radiação direta", en: "Just direct radiation"}
          - {pt: "Apenas dieta", en: "Just diet"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Tunelamento de prótons em pares de bases pode gerar mismatches raros", en: "Proton tunneling in base pairs may generate rare mismatches"}
        rationale: {pt: "Como tautômero pareia errado, então tunelamento contribui parcialmente para mutações espontâneas.", en: "Because tautomer pairs incorrectly, tunneling partly contributes to spontaneous mutations."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Microscopia super-resolução (STED, PALM, STORM) supera:", en: "Super-resolution microscopy (STED, PALM, STORM) surpasses:"}
        choices:
          - {pt: "Limite de difração óptico clássico (~250 nm)", en: "Classical optical diffraction limit (~250 nm)"}
          - {pt: "Apenas escala macroscópica", en: "Just macroscopic scale"}
          - {pt: "Apenas raios X", en: "Just X-rays"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Limite de difração óptico clássico (~250 nm)", en: "Classical optical diffraction limit (~250 nm)"}
        rationale: {pt: "Quando exploramos fluorescência localizada, então atingimos resolução nanométrica em células vivas.", en: "When we exploit localized fluorescence, we reach nanometer resolution in living cells."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Cryo-EM revolucionou:", en: "Cryo-EM revolutionized:"}
        choices:
          - {pt: "Determinação de estruturas de proteínas grandes em quase resolução atômica", en: "Determination of large protein structures at near-atomic resolution"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas microscopia escolar", en: "Just school microscopy"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Determinação de estruturas de proteínas grandes em quase resolução atômica", en: "Determination of large protein structures at near-atomic resolution"}
        rationale: {pt: "Quando congelamos amostra, então elétrons revelam conformação sem cristalização.", en: "When we freeze sample, electrons reveal conformation without crystallization."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Espectroscopia de uma única molécula permite:", en: "Single-molecule spectroscopy allows:"}
        choices:
          - {pt: "Observar dinâmica molecular sem média populacional", en: "Observing molecular dynamics without population average"}
          - {pt: "Apenas média de bilhões", en: "Just billion average"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Observar dinâmica molecular sem média populacional", en: "Observing molecular dynamics without population average"}
        rationale: {pt: "Como pegamos cada conformação, então estados raros e transições aparecem nitidamente.", en: "Because we capture each conformation, rare states and transitions appear sharply."}
        objectives: [biology.quantum_biology]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Biofísica de fronteira", en: "Frontier biophysics"}
    description: {pt: "Métodos e ideias na vanguarda.", en: "Methods and ideas at the cutting edge."}
    exercises:
      - type: choice
        question: {pt: "Pinças ópticas medem:", en: "Optical tweezers measure:"}
        choices:
          - {pt: "Forças de piconewton em moléculas individuais (DNA, motores moleculares)", en: "Piconewton forces on individual molecules (DNA, molecular motors)"}
          - {pt: "Apenas microscopia macro", en: "Just macro microscopy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas radiação", en: "Just radiation"}
        correctAnswer: {pt: "Forças de piconewton em moléculas individuais (DNA, motores moleculares)", en: "Piconewton forces on individual molecules (DNA, molecular motors)"}
        rationale: {pt: "Quando luz captura conta, então biofísicos puxam DNA e medem como motores trabalham.", en: "When light traps a bead, biophysicists pull DNA and measure how motors work."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Pinça magnética é útil para:", en: "Magnetic tweezers are useful for:"}
        choices:
          - {pt: "Aplicar torque em moléculas e estudar topologia de DNA (topoisomerases)", en: "Apply torque to molecules and study DNA topology (topoisomerases)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas peso macroscópico", en: "Just macroscopic weight"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Aplicar torque em moléculas e estudar topologia de DNA (topoisomerases)", en: "Apply torque to molecules and study DNA topology (topoisomerases)"}
        rationale: {pt: "Como rotação é controlada, então estudamos enzimas que mudam supercoiling do DNA.", en: "Because rotation is controlled, we study enzymes that change DNA supercoiling."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "AFM (microscopia de força atômica):", en: "AFM (atomic force microscopy):"}
        choices:
          - {pt: "Imagina e aplica força em superfícies em escala nanométrica", en: "Images and applies force on surfaces at nanometer scale"}
          - {pt: "Apenas microscopia infravermelha", en: "Just infrared microscopy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em vácuo", en: "Just in vacuum"}
        correctAnswer: {pt: "Imagina e aplica força em superfícies em escala nanométrica", en: "Images and applies force on surfaces at nanometer scale"}
        rationale: {pt: "Quando ponta varre amostra, então topografia e mecânica celular ficam mapeáveis.", en: "When tip scans sample, topography and cellular mechanics become mappable."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "FRET (transferência de energia de Förster):", en: "FRET (Förster resonance energy transfer):"}
        choices:
          - {pt: "Mede distâncias nanométricas entre fluoróforos — útil para detectar interações moleculares", en: "Measures nanometer distances between fluorophores — useful for detecting molecular interactions"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas escala macroscópica", en: "Just macroscopic scale"}
          - {pt: "Apenas estática", en: "Just static"}
        correctAnswer: {pt: "Mede distâncias nanométricas entre fluoróforos — útil para detectar interações moleculares", en: "Measures nanometer distances between fluorophores — useful for detecting molecular interactions"}
        rationale: {pt: "Como eficiência depende de distância (~10 nm), então FRET vira régua molecular sensível.", en: "Because efficiency depends on distance (~10 nm), FRET becomes a sensitive molecular ruler."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Hidrodinâmica em baixo número de Reynolds:", en: "Low Reynolds number hydrodynamics:"}
        choices:
          - {pt: "Domina natação bacteriana — viscosidade supera inércia", en: "Dominates bacterial swimming — viscosity exceeds inertia"}
          - {pt: "Apenas grandes peixes", en: "Just large fish"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas decoração", en: "Just decoration"}
