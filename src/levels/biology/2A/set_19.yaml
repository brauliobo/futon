          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas calor", en: "Just heat"}
        correctAnswer: {pt: "Reação enzimática que emite luz fria (luciferina + luciferase)", en: "Enzymatic reaction emitting cold light (luciferin + luciferase)"}
        rationale: {pt: "Como rendimento quântico é alto, então organismos comunicam-se ou caçam emitindo luz eficiente.", en: "Because quantum yield is high, organisms communicate or hunt emitting efficient light."}
        objectives: [biology.quantum_biology]
        difficulty: 5
      - type: choice
        question: {pt: "AlphaFold revolucionou biofísica estrutural por:", en: "AlphaFold revolutionized structural biophysics by:"}
        choices:
          - {pt: "Prever estruturas 3D de proteínas a partir da sequência com alta precisão", en: "Predicting 3D protein structures from sequence with high accuracy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA", en: "Just DNA"}
