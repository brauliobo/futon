title:
  pt: "🌅 Cronobiologia e ritmos circadianos"
  en: "🌅 Chronobiology and circadian rhythms"
level: '2A'
subject: biology
objectives: [biology.chronobiology]
difficulty: 5
authorNotes: "Relógios biológicos, NSQ, genes clock, jet lag, melatonina, medicina circadiana."
example:
  pt: "Ex.: luz na retina → NSQ → ritmo de cortisol/melatonina → vigília-sono → fisiologia diária."
  en: "Ex.: light on retina → SCN → cortisol/melatonin rhythm → wake-sleep → daily physiology."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "O relógio biológico", en: "The biological clock"}
    description: {pt: "Como organismos medem o tempo.", en: "How organisms measure time."}
    exercises:
      - type: choice
        question: {pt: "Ritmo circadiano tem período de:", en: "Circadian rhythm has a period of:"}
        choices:
          - {pt: "Cerca de 24 horas (latim circa diem)", en: "About 24 hours (Latin circa diem)"}
          - {pt: "Apenas 1 hora", en: "Just 1 hour"}
          - {pt: "Apenas 1 ano", en: "Just 1 year"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Cerca de 24 horas (latim circa diem)", en: "About 24 hours (Latin circa diem)"}
        rationale: {pt: "Como ciclo dia-noite molda evolução, então fisiologia se ajusta a 24 h aproximadamente.", en: "Because day-night cycle shapes evolution, physiology aligns to ~24 h."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Núcleo supraquiasmático (NSQ) localiza-se em:", en: "Suprachiasmatic nucleus (SCN) is located in:"}
        choices:
          - {pt: "Hipotálamo, acima do quiasma óptico — relógio mestre", en: "Hypothalamus, above optic chiasm — master clock"}
          - {pt: "Apenas medula", en: "Just spinal cord"}
          - {pt: "Apenas cerebelo", en: "Just cerebellum"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Hipotálamo, acima do quiasma óptico — relógio mestre", en: "Hypothalamus, above optic chiasm — master clock"}
        rationale: {pt: "Quando luz chega via trato retino-hipotalâmico, então NSQ sincroniza relógios periféricos.", en: "When light arrives via retinohypothalamic tract, SCN synchronizes peripheral clocks."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Genes clock (CLOCK, BMAL1, PER, CRY) formam:", en: "Clock genes (CLOCK, BMAL1, PER, CRY) form:"}
        choices:
          - {pt: "Alça de feedback transcricional-traducional de ~24 h", en: "~24 h transcription-translation feedback loop"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas tradução constante", en: "Just constant translation"}
          - {pt: "Sem alça", en: "No loop"}
        correctAnswer: {pt: "Alça de feedback transcricional-traducional de ~24 h", en: "~24 h transcription-translation feedback loop"}
        rationale: {pt: "Como PER/CRY inibem CLOCK/BMAL1, então oscilação molecular se autorregula em ciclo.", en: "Because PER/CRY inhibit CLOCK/BMAL1, molecular oscillation self-regulates cyclically."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Prêmio Nobel 2017 em Cronobiologia foi para:", en: "2017 Nobel in Chronobiology went to:"}
        choices:
          - {pt: "Hall, Rosbash, Young — pelo mecanismo molecular do relógio", en: "Hall, Rosbash, Young — for molecular clock mechanism"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas físicos", en: "Just physicists"}
          - {pt: "Apenas químicos", en: "Just chemists"}
        correctAnswer: {pt: "Hall, Rosbash, Young — pelo mecanismo molecular do relógio", en: "Hall, Rosbash, Young — for molecular clock mechanism"}
        rationale: {pt: "Quando descobriram alça PER em Drosophila, então paradigma circadiano molecular se estabeleceu.", en: "When they discovered PER loop in Drosophila, molecular circadian paradigm was established."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Zeitgeber é:", en: "Zeitgeber is:"}
        choices:
          - {pt: "Sinal ambiental que sincroniza relógio (luz, alimentação, temperatura)", en: "Environmental signal that synchronizes clock (light, food, temperature)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas hormônio interno", en: "Just internal hormone"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Sinal ambiental que sincroniza relógio (luz, alimentação, temperatura)", en: "Environmental signal that synchronizes clock (light, food, temperature)"}
        rationale: {pt: "Como luz é zeitgeber dominante, então cegueira ou ambiente constante desalinham ritmo.", en: "Because light is dominant zeitgeber, blindness or constant environment misalign rhythm."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Células ipRGC (retinianas com melanopsina) detectam:", en: "ipRGC retinal cells (melanopsin) detect:"}
        choices:
          - {pt: "Luz não visual — sinalizam intensidade luminosa ao NSQ", en: "Non-visual light — signal light intensity to SCN"}
          - {pt: "Apenas cor", en: "Just color"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas fotorreceptores clássicos", en: "Just classic photoreceptors"}
        correctAnswer: {pt: "Luz não visual — sinalizam intensidade luminosa ao NSQ", en: "Non-visual light — signal light intensity to SCN"}
        rationale: {pt: "Quando ipRGC detecta luz azul, então NSQ ajusta relógio mesmo sem percepção consciente.", en: "When ipRGC detects blue light, SCN adjusts clock even without conscious perception."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Melatonina:", en: "Melatonin:"}
        choices:
          - {pt: "Hormônio da glândula pineal liberado à noite — sinaliza escuridão", en: "Pineal gland hormone released at night — signals darkness"}
          - {pt: "Apenas durante o dia", en: "Just during day"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas alimento", en: "Just food"}
        correctAnswer: {pt: "Hormônio da glândula pineal liberado à noite — sinaliza escuridão", en: "Pineal gland hormone released at night — signals darkness"}
        rationale: {pt: "Como luz inibe sua síntese, então melatonina é mensageira química da noite.", en: "Because light inhibits its synthesis, melatonin is chemical messenger of night."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Cortisol pico ocorre:", en: "Cortisol peak occurs:"}
        choices:
          - {pt: "Antes de acordar (resposta de despertar do cortisol)", en: "Before waking (cortisol awakening response)"}
          - {pt: "Apenas à noite profunda", en: "Just deep at night"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Aleatoriamente", en: "Randomly"}
        correctAnswer: {pt: "Antes de acordar (resposta de despertar do cortisol)", en: "Before waking (cortisol awakening response)"}
        rationale: {pt: "Quando antecipa atividade, então cortisol mobiliza energia para começar o dia.", en: "When anticipating activity, cortisol mobilizes energy to start the day."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Relógios periféricos existem em:", en: "Peripheral clocks exist in:"}
        choices:
          - {pt: "Quase todos os tecidos (fígado, intestino, coração) — sincronizados pelo NSQ", en: "Almost all tissues (liver, gut, heart) — synced by SCN"}
          - {pt: "Apenas cérebro", en: "Just brain"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pele", en: "Just skin"}
        correctAnswer: {pt: "Quase todos os tecidos (fígado, intestino, coração) — sincronizados pelo NSQ", en: "Almost all tissues (liver, gut, heart) — synced by SCN"}
        rationale: {pt: "Como cada tecido tem ritmo próprio, então metabolismo varia com hora do dia.", en: "Because each tissue has own rhythm, metabolism varies with time of day."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Cronotipo refere-se a:", en: "Chronotype refers to:"}
        choices:
          - {pt: "Preferência individual de horário (matutino, vespertino) com base genética", en: "Individual schedule preference (morning, evening) with genetic basis"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas hábito recente", en: "Just recent habit"}
          - {pt: "Apenas cultura", en: "Just culture"}
        correctAnswer: {pt: "Preferência individual de horário (matutino, vespertino) com base genética", en: "Individual schedule preference (morning, evening) with genetic basis"}
        rationale: {pt: "Quando variantes em PER ou outros existem, então populações têm distribuição de tipos circadianos.", en: "When variants in PER or others exist, populations have distribution of circadian types."}
        objectives: [biology.chronobiology]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Saúde circadiana e medicina", en: "Circadian health and medicine"}
    description: {pt: "Quando o relógio importa para tratamento e doença.", en: "When the clock matters for treatment and disease."}
    exercises:
      - type: choice
        question: {pt: "Jet lag ocorre porque:", en: "Jet lag occurs because:"}
        choices:
          - {pt: "Relógio interno demora a sincronizar com novo fuso horário", en: "Internal clock takes time to sync with new timezone"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas falta de água", en: "Just dehydration"}
          - {pt: "Apenas falta de comida", en: "Just lack of food"}
        correctAnswer: {pt: "Relógio interno demora a sincronizar com novo fuso horário", en: "Internal clock takes time to sync with new timezone"}
        rationale: {pt: "Como NSQ ajusta ~1 h por dia, então cruzar 6 fusos requer dias para realinhar.", en: "Because SCN adjusts ~1 h per day, crossing 6 zones takes days to realign."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Trabalho noturno crônico associa-se a:", en: "Chronic night work is associated with:"}
        choices:
          - {pt: "Maior risco de obesidade, diabetes, câncer e doença cardiovascular", en: "Higher risk of obesity, diabetes, cancer and cardiovascular disease"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas saúde extra", en: "Just extra health"}
          - {pt: "Sem impacto", en: "No impact"}
        correctAnswer: {pt: "Maior risco de obesidade, diabetes, câncer e doença cardiovascular", en: "Higher risk of obesity, diabetes, cancer and cardiovascular disease"}
        rationale: {pt: "Quando alimentação e luz desalinham, então metabolismo desregula e inflamação cronica aumenta.", en: "When food and light misalign, metabolism deregulates and chronic inflammation increases."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Crononutrição estuda:", en: "Chrononutrition studies:"}
        choices:
          - {pt: "Como horário das refeições afeta saúde e metabolismo", en: "How meal timing affects health and metabolism"}
          - {pt: "Apenas calorias", en: "Just calories"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas suplementos", en: "Just supplements"}
        correctAnswer: {pt: "Como horário das refeições afeta saúde e metabolismo", en: "How meal timing affects health and metabolism"}
        rationale: {pt: "Quando comemos cedo (TRE), então peso e glicemia melhoram além do efeito calórico.", en: "When we eat early (TRE), weight and glycemia improve beyond caloric effect."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Cronofarmacologia explora:", en: "Chronopharmacology exploits:"}
        choices:
          - {pt: "Hora de administração para maximizar eficácia e reduzir efeitos colaterais", en: "Time of administration to maximize efficacy and reduce side effects"}
          - {pt: "Apenas dosagem fixa", en: "Just fixed dosage"}
          - {pt: "Apenas via de administração", en: "Just route of administration"}
          - {pt: "Apenas idade do paciente", en: "Just patient age"}
        correctAnswer: {pt: "Hora de administração para maximizar eficácia e reduzir efeitos colaterais", en: "Time of administration to maximize efficacy and reduce side effects"}
        rationale: {pt: "Como alvos celulares oscilam, então timing certo amplia índice terapêutico.", en: "Because cellular targets oscillate, right timing widens therapeutic index."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Privação de sono crônica afeta:", en: "Chronic sleep deprivation affects:"}
        choices:
          - {pt: "Imunidade, cognição, humor e metabolismo", en: "Immunity, cognition, mood and metabolism"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Imunidade, cognição, humor e metabolismo", en: "Immunity, cognition, mood and metabolism"}
        rationale: {pt: "Quando reparo noturno é cortado, então sistemas integrados degradam progressivamente.", en: "When nightly repair is cut, integrated systems degrade progressively."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Sono REM caracteriza-se por:", en: "REM sleep is characterized by:"}
        choices:
          - {pt: "Atividade cerebral alta, sonhos vívidos, atonia muscular", en: "High brain activity, vivid dreams, muscle atonia"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas movimento muscular", en: "Just muscle movement"}
          - {pt: "Apenas inconsciência total", en: "Just total unconsciousness"}
        correctAnswer: {pt: "Atividade cerebral alta, sonhos vívidos, atonia muscular", en: "High brain activity, vivid dreams, muscle atonia"}
        rationale: {pt: "Como cérebro está ativo mas corpo paralisado, então sonhamos sem agir fisicamente.", en: "Because brain is active but body paralyzed, we dream without acting physically."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Sono profundo (NREM N3) é importante para:", en: "Deep sleep (NREM N3) is important for:"}
        choices:
          - {pt: "Limpeza glinfática, consolidação de memória, restauração", en: "Glymphatic clearance, memory consolidation, restoration"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas para crianças", en: "Just for children"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Limpeza glinfática, consolidação de memória, restauração", en: "Glymphatic clearance, memory consolidation, restoration"}
        rationale: {pt: "Quando sono profundo aumenta fluxo glinfático, então metabólitos como β-amilóide são removidos.", en: "When deep sleep boosts glymphatic flow, metabolites like β-amyloid are cleared."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Ritmo ultradiano refere-se a:", en: "Ultradian rhythm refers to:"}
        choices:
          - {pt: "Ciclos mais curtos que 24 h (ex.: ciclos REM de ~90 min)", en: "Cycles shorter than 24 h (e.g., ~90 min REM cycles)"}
          - {pt: "Apenas circadiano (24 h)", en: "Just circadian (24 h)"}
          - {pt: "Apenas anuais", en: "Just annual"}
          - {pt: "Apenas semanais", en: "Just weekly"}
        correctAnswer: {pt: "Ciclos mais curtos que 24 h (ex.: ciclos REM de ~90 min)", en: "Cycles shorter than 24 h (e.g., ~90 min REM cycles)"}
        rationale: {pt: "Como sono alterna estágios em ~90 min, então ciclos múltiplos por noite consolidam funções.", en: "Because sleep alternates stages in ~90 min, multiple cycles per night consolidate functions."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Ritmo infradiano inclui:", en: "Infradian rhythm includes:"}
        choices:
          - {pt: "Ciclo menstrual e mudanças sazonais (mais longos que 24 h)", en: "Menstrual cycle and seasonal changes (longer than 24 h)"}
          - {pt: "Apenas circadiano (24 h)", en: "Just circadian (24 h)"}
          - {pt: "Apenas ciclos de minutos", en: "Just minute-scale cycles"}
          - {pt: "Apenas horários de refeição", en: "Just meal times"}
        correctAnswer: {pt: "Ciclo menstrual e mudanças sazonais (mais longos que 24 h)", en: "Menstrual cycle and seasonal changes (longer than 24 h)"}
        rationale: {pt: "Quando hormônios oscilam em escala maior, então fisiologia segue ritmo de semanas/meses.", en: "When hormones oscillate at larger scale, physiology follows weeks/months rhythm."}
        objectives: [biology.chronobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Crono-imunologia mostra que:", en: "Chronoimmunology shows that:"}
        choices:
          - {pt: "Resposta imune varia com hora do dia (vacinas matinais podem ser mais eficazes)", en: "Immune response varies with time of day (morning vaccines may be more effective)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre constante", en: "Always constant"}
          - {pt: "Sem variação", en: "No variation"}
        correctAnswer: {pt: "Resposta imune varia com hora do dia (vacinas matinais podem ser mais eficazes)", en: "Immune response varies with time of day (morning vaccines may be more effective)"}
        rationale: {pt: "Como células imunes têm relógio próprio, então timing da vacinação altera magnitude da resposta.", en: "Because immune cells have own clock, timing of vaccination alters response magnitude."}
        objectives: [biology.chronobiology]
        difficulty: 5
target: 20
