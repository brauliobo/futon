title:
  pt: "🫀 Organoides e medicina regenerativa"
  en: "🫀 Organoids and regenerative medicine"
level: '2A'
subject: biology
objectives: [biology.regenerative_medicine]
difficulty: 5
authorNotes: "Organoides, células iPS, bioimpressão, transplante, ciência da diferenciação dirigida."
example:
  pt: "Ex.: célula iPS → fatores de crescimento dirigidos → cultura 3D → organoide cerebral → modelo de doença."
  en: "Ex.: iPS cell → directed growth factors → 3D culture → brain organoid → disease model."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Organoides", en: "Organoids"}
    description: {pt: "Mini-órgãos cultivados em laboratório.", en: "Mini-organs grown in lab."}
    exercises:
      - type: choice
        question: {pt: "Organoide é:", en: "Organoid is:"}
        choices:
          - {pt: "Estrutura 3D auto-organizada in vitro que imita órgão", en: "Self-organized 3D in vitro structure mimicking organ"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas decélula 2D", en: "Just 2D cell"}
          - {pt: "Apenas embrião", en: "Just embryo"}
        correctAnswer: {pt: "Estrutura 3D auto-organizada in vitro que imita órgão", en: "Self-organized 3D in vitro structure mimicking organ"}
        rationale: {pt: "Quando células-tronco recebem sinais corretos, então padronização 3D recria mini-órgão.", en: "When stem cells receive correct signals, 3D patterning recreates mini-organ."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Organoides cerebrais cultivados a partir de iPS modelam:", en: "Brain organoids from iPS model:"}
        choices:
          - {pt: "Desenvolvimento cortical e doenças (microcefalia, autismo, Zika)", en: "Cortical development and diseases (microcephaly, autism, Zika)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pulmão", en: "Just lung"}
          - {pt: "Apenas pele", en: "Just skin"}
        correctAnswer: {pt: "Desenvolvimento cortical e doenças (microcefalia, autismo, Zika)", en: "Cortical development and diseases (microcephaly, autism, Zika)"}
        rationale: {pt: "Como recriam camadas neurais, então organoides revelam mecanismos de neurodesenvolvimento humano.", en: "Because they recreate neural layers, organoids reveal human neurodevelopment mechanisms."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Organoide intestinal precisa de matriz como:", en: "Intestinal organoid requires matrix like:"}
        choices:
          - {pt: "Matrigel — suporte 3D rico em laminina/colágeno", en: "Matrigel — 3D support rich in laminin/collagen"}
          - {pt: "Apenas plástico", en: "Just plastic"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas sal", en: "Just salt"}
        correctAnswer: {pt: "Matrigel — suporte 3D rico em laminina/colágeno", en: "Matrigel — 3D support rich in laminin/collagen"}
        rationale: {pt: "Quando matriz fornece sinais mecânicos e de adesão, então células-tronco intestinais formam criptas.", en: "When matrix provides mechanical and adhesion cues, intestinal stem cells form crypts."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Organoide hepático modela:", en: "Liver organoid models:"}
        choices:
          - {pt: "Metabolismo, toxicidade de fármacos e doenças hepáticas", en: "Metabolism, drug toxicity and liver diseases"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pulmão", en: "Just lung"}
          - {pt: "Apenas neurônio", en: "Just neuron"}
        correctAnswer: {pt: "Metabolismo, toxicidade de fármacos e doenças hepáticas", en: "Metabolism, drug toxicity and liver diseases"}
        rationale: {pt: "Como hepatócitos exprimem CYP450, então testes de hepatotoxicidade ficam mais fisiológicos.", en: "Because hepatocytes express CYP450, hepatotoxicity tests become more physiological."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Organoide tumoral (PDO) permite:", en: "Tumor organoid (PDO) allows:"}
        choices:
          - {pt: "Triagem de fármacos personalizada com tumor do próprio paciente", en: "Personalized drug screening with patient's own tumor"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas câncer animal", en: "Just animal cancer"}
          - {pt: "Sem aplicação", en: "No application"}
        correctAnswer: {pt: "Triagem de fármacos personalizada com tumor do próprio paciente", en: "Personalized drug screening with patient's own tumor"}
        rationale: {pt: "Quando organoide preserva heterogeneidade tumoral, então resposta in vitro prediz resposta in vivo.", en: "When organoid preserves tumor heterogeneity, in vitro response predicts in vivo response."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Limitação de organoides inclui:", en: "Organoid limitations include:"}
        choices:
          - {pt: "Falta de vascularização e maturação completa", en: "Lack of vascularization and complete maturation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre perfeitos", en: "Always perfect"}
          - {pt: "Sem limite", en: "No limit"}
        correctAnswer: {pt: "Falta de vascularização e maturação completa", en: "Lack of vascularization and complete maturation"}
        rationale: {pt: "Como não há sangue, então tamanho e função fisiológica permanecem limitados.", en: "Because there's no blood, size and physiological function remain limited."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Organ-on-chip combina:", en: "Organ-on-chip combines:"}
        choices:
          - {pt: "Microfluídica + cultura celular para imitar fisiologia (fluxo, mecânica)", en: "Microfluidics + cell culture to mimic physiology (flow, mechanics)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas in silico", en: "Just in silico"}
          - {pt: "Apenas placa estática", en: "Just static plate"}
        correctAnswer: {pt: "Microfluídica + cultura celular para imitar fisiologia (fluxo, mecânica)", en: "Microfluidics + cell culture to mimic physiology (flow, mechanics)"}
        rationale: {pt: "Quando incluímos forças mecânicas, então pulmão-em-chip respira e intestino-em-chip peristáltica.", en: "When we include mechanical forces, lung-on-chip breathes and gut-on-chip peristalsis."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "iPS de Yamanaka requer 4 fatores:", en: "Yamanaka iPS requires 4 factors:"}
        choices:
          - {pt: "Oct4, Sox2, Klf4, c-Myc", en: "Oct4, Sox2, Klf4, c-Myc"}
          - {pt: "Apenas insulina", en: "Just insulin"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA livre", en: "Just free DNA"}
        correctAnswer: {pt: "Oct4, Sox2, Klf4, c-Myc", en: "Oct4, Sox2, Klf4, c-Myc"}
        rationale: {pt: "Como reativam pluripotência, então célula adulta volta a estado embrionário sem embrião.", en: "Because they reactivate pluripotency, adult cell returns to embryonic state without embryo."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Diferenciação dirigida usa:", en: "Directed differentiation uses:"}
        choices:
          - {pt: "Fatores de crescimento sequenciais que mimetizam desenvolvimento embrionário", en: "Sequential growth factors mimicking embryonic development"}
          - {pt: "Apenas acaso", en: "Just chance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas mutação", en: "Just mutation"}
        correctAnswer: {pt: "Fatores de crescimento sequenciais que mimetizam desenvolvimento embrionário", en: "Sequential growth factors mimicking embryonic development"}
        rationale: {pt: "Quando seguimos via natural, então iPS vira tipo celular específico (β-pancreática, dopaminérgico).", en: "When we follow natural pathway, iPS becomes specific cell type (β-pancreatic, dopaminergic)."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Reprogramação direta (transdiferenciação) converte:", en: "Direct reprogramming (transdifferentiation) converts:"}
        choices:
          - {pt: "Tipo celular A em B sem passar por estado pluripotente", en: "Cell type A into B without passing through pluripotent state"}
          - {pt: "Apenas via iPS", en: "Only via iPS"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem possibilidade", en: "No possibility"}
        correctAnswer: {pt: "Tipo celular A em B sem passar por estado pluripotente", en: "Cell type A into B without passing through pluripotent state"}
        rationale: {pt: "Como atalho evita instabilidade da pluripotência, então transdiferenciação reduz risco tumoral.", en: "Because shortcut avoids pluripotency instability, transdifferentiation reduces tumor risk."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Engenharia de tecidos e transplantes", en: "Tissue engineering and transplants"}
    description: {pt: "Construindo órgãos para reparar pessoas.", en: "Building organs to repair people."}
    exercises:
      - type: choice
        question: {pt: "Engenharia de tecidos combina:", en: "Tissue engineering combines:"}
        choices:
          - {pt: "Células + biomateriais + sinais bioquímicos para regenerar tecido", en: "Cells + biomaterials + biochemical cues to regenerate tissue"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas células", en: "Just cells"}
          - {pt: "Apenas plástico", en: "Just plastic"}
        correctAnswer: {pt: "Células + biomateriais + sinais bioquímicos para regenerar tecido", en: "Cells + biomaterials + biochemical cues to regenerate tissue"}
        rationale: {pt: "Como cada componente sozinho falha, então integração tripla é necessária para sucesso.", en: "Because each component alone fails, triple integration is necessary for success."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Bioimpressão 3D deposita:", en: "3D bioprinting deposits:"}
        choices:
          - {pt: "Células e hidrogéis camada a camada para construir tecidos", en: "Cells and hydrogels layer-by-layer to build tissues"}
          - {pt: "Apenas plástico inerte", en: "Just inert plastic"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas placas 2D", en: "Just 2D plates"}
        correctAnswer: {pt: "Células e hidrogéis camada a camada para construir tecidos", en: "Cells and hydrogels layer-by-layer to build tissues"}
        rationale: {pt: "Quando geometria é controlada, então arquitetura tecidual complexa pode ser fabricada.", en: "When geometry is controlled, complex tissue architecture can be manufactured."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Descelularização produz:", en: "Decellularization produces:"}
        choices:
          - {pt: "Andaime de matriz extracelular sem células — pronto para recolonização", en: "Cell-free extracellular matrix scaffold — ready for recolonization"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas células livres", en: "Just free cells"}
          - {pt: "Apenas plástico", en: "Just plastic"}
        correctAnswer: {pt: "Andaime de matriz extracelular sem células — pronto para recolonização", en: "Cell-free extracellular matrix scaffold — ready for recolonização"}
        rationale: {pt: "Como matriz mantém arquitetura, então órgão pode ser repopulado com células do paciente.", en: "Because matrix retains architecture, organ can be repopulated with patient cells."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Xenotransplante (porco→humano) requer:", en: "Xenotransplant (pig→human) requires:"}
        choices:
          - {pt: "Edição genética para reduzir rejeição (ex.: knockout α-Gal, GalSafe)", en: "Genetic editing to reduce rejection (e.g., α-Gal knockout, GalSafe)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas dieta", en: "Just diet"}
          - {pt: "Apenas plástico", en: "Just plastic"}
        correctAnswer: {pt: "Edição genética para reduzir rejeição (ex.: knockout α-Gal, GalSafe)", en: "Genetic editing to reduce rejection (e.g., α-Gal knockout, GalSafe)"}
        rationale: {pt: "Quando antígenos hiperagudos são removidos, então rim/coração suíno sobrevive em primata.", en: "When hyperacute antigens are removed, pig kidney/heart survives in primate."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Células-tronco mesenquimais (MSC) são usadas em:", en: "Mesenchymal stem cells (MSC) are used in:"}
        choices:
          - {pt: "Terapias regenerativas e imunomoduladoras (ortopédica, GVHD)", en: "Regenerative and immunomodulatory therapies (orthopedic, GVHD)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas tumor", en: "Just tumor"}
          - {pt: "Apenas cosmético", en: "Just cosmetic"}
        correctAnswer: {pt: "Terapias regenerativas e imunomoduladoras (ortopédica, GVHD)", en: "Regenerative and immunomodulatory therapies (orthopedic, GVHD)"}
        rationale: {pt: "Como secretam fatores tróficos e suprimem imunidade, então MSCs auxiliam reparo tecidual.", en: "Because they secrete trophic factors and suppress immunity, MSCs aid tissue repair."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Terapia com células retinianas trata:", en: "Retinal cell therapy treats:"}
        choices:
          - {pt: "Degeneração macular e doenças retinianas hereditárias", en: "Macular degeneration and inherited retinal diseases"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas resfriado", en: "Just common cold"}
          - {pt: "Apenas pele", en: "Just skin"}
        correctAnswer: {pt: "Degeneração macular e doenças retinianas hereditárias", en: "Macular degeneration and inherited retinal diseases"}
        rationale: {pt: "Quando RPE substituto é transplantado, então fotorreceptores são preservados parcialmente.", en: "When replacement RPE is transplanted, photoreceptors are partially preserved."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Células β-pancreáticas derivadas de iPS prometem:", en: "iPS-derived pancreatic β cells promise:"}
        choices:
          - {pt: "Tratamento de diabetes tipo 1 substituindo ilhotas perdidas", en: "Type 1 diabetes treatment replacing lost islets"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas resfriado", en: "Just cold"}
          - {pt: "Apenas pulmão", en: "Just lung"}
        correctAnswer: {pt: "Tratamento de diabetes tipo 1 substituindo ilhotas perdidas", en: "Type 1 diabetes treatment replacing lost islets"}
        rationale: {pt: "Como β secretam insulina regulada por glicose, então transplante restaura controle glicêmico.", en: "Because β secrete glucose-regulated insulin, transplant restores glycemic control."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Vesículas extracelulares (exossomos) na regeneração:", en: "Extracellular vesicles (exosomes) in regeneration:"}
        choices:
          - {pt: "Carregam fatores de células-tronco e podem mediar efeito sem transplante", en: "Carry stem cell factors and may mediate effect without transplant"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em câncer", en: "Only in cancer"}
          - {pt: "Sem função", en: "No function"}
        correctAnswer: {pt: "Carregam fatores de células-tronco e podem mediar efeito sem transplante", en: "Carry stem cell factors and may mediate effect without transplant"}
        rationale: {pt: "Quando exossomos entregam carga regenerativa, então terapia 'célula-livre' fica viável.", en: "When exosomes deliver regenerative cargo, 'cell-free' therapy becomes feasible."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Organoides + CRISPR permitem:", en: "Organoids + CRISPR allow:"}
        choices:
          - {pt: "Modelar e potencialmente corrigir doenças genéticas em mini-órgãos", en: "Model and potentially correct genetic diseases in mini-organs"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas observação passiva", en: "Just passive observation"}
          - {pt: "Apenas placebo", en: "Just placebo"}
        correctAnswer: {pt: "Modelar e potencialmente corrigir doenças genéticas em mini-órgãos", en: "Model and potentially correct genetic diseases in mini-organs"}
        rationale: {pt: "Como editamos e validamos in vitro, então caminho clínico fica de baixo risco.", en: "Because we edit and validate in vitro, clinical path becomes low-risk."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Desafios éticos de organoides cerebrais:", en: "Ethical challenges of brain organoids:"}
        choices:
          - {pt: "Possibilidade futura de senciência primitiva exige diretrizes específicas", en: "Future possibility of primitive sentience requires specific guidelines"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre inofensivos", en: "Always harmless"}
          - {pt: "Sem questão ética", en: "No ethical question"}
        correctAnswer: {pt: "Possibilidade futura de senciência primitiva exige diretrizes específicas", en: "Future possibility of primitive sentience requires specific guidelines"}
        rationale: {pt: "Quando organoides ganham complexidade, então sociedade precisa antecipar limites éticos.", en: "When organoids gain complexity, society must anticipate ethical limits."}
        objectives: [biology.regenerative_medicine]
        difficulty: 5
target: 20
