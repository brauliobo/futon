title:
  pt: "🐝 Biomimética e biomateriais"
  en: "🐝 Biomimicry and biomaterials"
level: '2A'
subject: biology
objectives: [biology.biomimicry]
difficulty: 5
authorNotes: "Aprender com a natureza, biomimética, biomateriais, hidrogéis, scaffolds, aplicações biotecnológicas."
example:
  pt: "Ex.: lótus repele água → estrutura nano da folha → tinta autolimpante → engenharia inspirada."
  en: "Ex.: lotus repels water → leaf nanostructure → self-cleaning paint → inspired engineering."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Biomimética", en: "Biomimicry"}
    description: {pt: "Inspirar-se na natureza para resolver problemas humanos.", en: "Drawing inspiration from nature to solve human problems."}
    exercises:
      - type: choice
        question: {pt: "Biomimética é:", en: "Biomimicry is:"}
        choices:
          - {pt: "Imitar princípios de design da natureza para criar tecnologia", en: "Imitating nature's design principles to create technology"}
          - {pt: "Apenas observar plantas", en: "Just observe plants"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas microbiologia", en: "Just microbiology"}
        correctAnswer: {pt: "Imitar princípios de design da natureza para criar tecnologia", en: "Imitating nature's design principles to create technology"}
        rationale: {pt: "Como evolução otimizou estruturas por bilhões de anos, então copiá-las acelera inovação.", en: "Because evolution optimized structures over billions of years, copying them accelerates innovation."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Velcro foi inspirado em:", en: "Velcro was inspired by:"}
        choices:
          - {pt: "Ganchos de sementes de bardana grudando em pelos", en: "Burdock seed hooks sticking to fur"}
          - {pt: "Apenas plástico industrial", en: "Just industrial plastic"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas metal", en: "Just metal"}
        correctAnswer: {pt: "Ganchos de sementes de bardana grudando em pelos", en: "Burdock seed hooks sticking to fur"}
        rationale: {pt: "Quando engenheiro suíço observou problema, então transformou observação biológica em produto.", en: "When Swiss engineer observed problem, he turned biological observation into product."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Efeito lótus refere-se a:", en: "Lotus effect refers to:"}
        choices:
          - {pt: "Superfícies super-hidrofóbicas autolimpantes via micro/nanoestrutura", en: "Self-cleaning superhydrophobic surfaces via micro/nanostructure"}
          - {pt: "Apenas plástico fino", en: "Just thin plastic"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas vidro liso", en: "Just smooth glass"}
        correctAnswer: {pt: "Superfícies super-hidrofóbicas autolimpantes via micro/nanoestrutura", en: "Self-cleaning superhydrophobic surfaces via micro/nanostructure"}
        rationale: {pt: "Quando água rola e leva sujeira, então superfícies estruturadas reduzem manutenção e biofilme.", en: "When water rolls off and carries dirt, structured surfaces reduce maintenance and biofilm."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Trens-bala japoneses Shinkansen foram redesenhados inspirados em:", en: "Japanese Shinkansen bullet trains were redesigned inspired by:"}
        choices:
          - {pt: "Bico do martim-pescador para reduzir estrondo sônico em túneis", en: "Kingfisher beak to reduce sonic boom in tunnels"}
          - {pt: "Apenas estética humana", en: "Just human aesthetics"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas custo", en: "Just cost"}
        correctAnswer: {pt: "Bico do martim-pescador para reduzir estrondo sônico em túneis", en: "Kingfisher beak to reduce sonic boom in tunnels"}
        rationale: {pt: "Como ave mergulha sem espirrar, então forma transfere-se a aerodinâmica de alta velocidade.", en: "Because bird dives without splashing, shape transfers to high-speed aerodynamics."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Adesão de geco em superfícies usa:", en: "Gecko adhesion on surfaces uses:"}
        choices:
          - {pt: "Setas com bilhões de spatulae aproveitando forças de van der Waals", en: "Setae with billions of spatulae harnessing van der Waals forces"}
          - {pt: "Apenas cola líquida", en: "Just liquid glue"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pressão atmosférica", en: "Just atmospheric pressure"}
        correctAnswer: {pt: "Setas com bilhões de spatulae aproveitando forças de van der Waals", en: "Setae with billions of spatulae harnessing van der Waals forces"}
        rationale: {pt: "Quando contato é multiplicado em escala nano, então forças fracas somam adesão potente.", en: "When contact is multiplied at nanoscale, weak forces sum to potent adhesion."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Asa de borboleta inspira:", en: "Butterfly wing inspires:"}
        choices:
          - {pt: "Cores estruturais sem pigmento (fotônica) para telas e tintas", en: "Pigment-free structural colors (photonics) for screens and inks"}
          - {pt: "Apenas tinta convencional", en: "Just conventional paint"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas papel", en: "Just paper"}
        correctAnswer: {pt: "Cores estruturais sem pigmento (fotônica) para telas e tintas", en: "Pigment-free structural colors (photonics) for screens and inks"}
        rationale: {pt: "Como interferência de luz em escamas cria cor, então fotônica replica brilho sem corante.", en: "Because light interference in scales creates color, photonics replicates iridescence without dye."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Pele de tubarão inspira:", en: "Shark skin inspires:"}
        choices:
          - {pt: "Superfícies com dentículos que reduzem arrasto e bioincrustação", en: "Surfaces with denticles that reduce drag and biofouling"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas vidro liso", en: "Just smooth glass"}
          - {pt: "Apenas pintura", en: "Just paint"}
        correctAnswer: {pt: "Superfícies com dentículos que reduzem arrasto e bioincrustação", en: "Surfaces with denticles that reduce drag and biofouling"}
        rationale: {pt: "Quando microrrelevo desfavorece adesão bacteriana, então cascos navais e cateteres ganham eficiência.", en: "When microrelief disfavors bacterial adhesion, ship hulls and catheters gain efficiency."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Cupinzeiros inspiram:", en: "Termite mounds inspire:"}
        choices:
          - {pt: "Arquitetura passiva com ventilação sem ar-condicionado (Eastgate, Zimbábue)", en: "Passive ventilation architecture without AC (Eastgate, Zimbabwe)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas plástico", en: "Just plastic"}
          - {pt: "Apenas metal", en: "Just metal"}
        correctAnswer: {pt: "Arquitetura passiva com ventilação sem ar-condicionado (Eastgate, Zimbábue)", en: "Passive ventilation architecture without AC (Eastgate, Zimbabwe)"}
        rationale: {pt: "Como cupinzeiros mantêm temperatura via correntes convectivas, então edifícios economizam energia.", en: "Because mounds maintain temperature via convective currents, buildings save energy."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Algoritmos genéticos copiam:", en: "Genetic algorithms copy:"}
        choices:
          - {pt: "Seleção natural para otimizar soluções computacionalmente", en: "Natural selection to optimize solutions computationally"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas brute force", en: "Just brute force"}
          - {pt: "Apenas regras fixas", en: "Just fixed rules"}
        correctAnswer: {pt: "Seleção natural para otimizar soluções computacionalmente", en: "Natural selection to optimize solutions computationally"}
        rationale: {pt: "Quando soluções competem e se cruzam, então código evolui resposta adaptada ao problema.", en: "When solutions compete and crossover, code evolves problem-adapted answer."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Robôs swarm inspiram-se em:", en: "Swarm robots are inspired by:"}
        choices:
          - {pt: "Formigas e abelhas — comportamento coletivo emergente de regras simples", en: "Ants and bees — collective behavior emerging from simple rules"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas computador único", en: "Just single computer"}
          - {pt: "Apenas humanos", en: "Just humans"}
        correctAnswer: {pt: "Formigas e abelhas — comportamento coletivo emergente de regras simples", en: "Ants and bees — collective behavior emerging from simple rules"}
        rationale: {pt: "Como interações locais geram inteligência coletiva, então enxames robóticos resolvem tarefas distribuídas.", en: "Because local interactions yield collective intelligence, robotic swarms solve distributed tasks."}
        objectives: [biology.biomimicry]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Biomateriais", en: "Biomaterials"}
    description: {pt: "Materiais que dialogam com biologia.", en: "Materials that dialogue with biology."}
    exercises:
      - type: choice
        question: {pt: "Biomaterial é:", en: "Biomaterial is:"}
        choices:
          - {pt: "Material projetado para interagir com sistemas biológicos com fim médico/biotecnológico", en: "Material designed to interact with biological systems for medical/biotech purpose"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas metal puro", en: "Just pure metal"}
          - {pt: "Apenas plástico genérico", en: "Just generic plastic"}
        correctAnswer: {pt: "Material projetado para interagir com sistemas biológicos com fim médico/biotecnológico", en: "Material designed to interact with biological systems for medical/biotech purpose"}
        rationale: {pt: "Como interface deve ser biocompatível, então design otimiza propriedades químicas e mecânicas.", en: "Because interface must be biocompatible, design optimizes chemical and mechanical properties."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Hidrogel é:", en: "Hydrogel is:"}
        choices:
          - {pt: "Polímero hidratado que mimetiza matriz extracelular", en: "Hydrated polymer mimicking extracellular matrix"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas metal", en: "Just metal"}
          - {pt: "Apenas vidro", en: "Just glass"}
        correctAnswer: {pt: "Polímero hidratado que mimetiza matriz extracelular", en: "Hydrated polymer mimicking extracellular matrix"}
        rationale: {pt: "Quando ambiente é macio e úmido, então células diferenciam-se e proliferam como em tecido nativo.", en: "When environment is soft and moist, cells differentiate and proliferate as in native tissue."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Polímeros biodegradáveis (PLA, PGA) são úteis em:", en: "Biodegradable polymers (PLA, PGA) are useful in:"}
        choices:
          - {pt: "Suturas absorvíveis e scaffolds que desaparecem após reparo", en: "Absorbable sutures and scaffolds that disappear after repair"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas embalagem rígida", en: "Just rigid packaging"}
          - {pt: "Apenas metal", en: "Just metal"}
        correctAnswer: {pt: "Suturas absorvíveis e scaffolds que desaparecem após reparo", en: "Absorbable sutures and scaffolds that disappear after repair"}
        rationale: {pt: "Como degradam por hidrólise, então corpo elimina material após cumprir função sem reoperação.", en: "Because they hydrolytically degrade, body clears material after function without reoperation."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Hidroxiapatita é usada em:", en: "Hydroxyapatite is used in:"}
        choices:
          - {pt: "Substituição/ enxerto ósseo, pois compõe matriz mineral natural do osso", en: "Bone substitution/grafting, as it composes natural bone mineral matrix"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas implante dentário plástico", en: "Just plastic dental implant"}
          - {pt: "Apenas borracha", en: "Just rubber"}
        correctAnswer: {pt: "Substituição/ enxerto ósseo, pois compõe matriz mineral natural do osso", en: "Bone substitution/grafting, as it composes natural bone mineral matrix"}
        rationale: {pt: "Quando material reflete composição óssea, então osseointegração é favorecida.", en: "When material reflects bone composition, osseointegration is favored."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Titânio é popular em implantes porque:", en: "Titanium is popular in implants because:"}
        choices:
          - {pt: "Combina resistência, leveza e biocompatibilidade (osseointegração)", en: "Combines strength, lightness and biocompatibility (osseointegration)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas barato", en: "Just cheap"}
          - {pt: "Apenas magnético", en: "Just magnetic"}
        correctAnswer: {pt: "Combina resistência, leveza e biocompatibilidade (osseointegração)", en: "Combines strength, lightness and biocompatibility (osseointegration)"}
        rationale: {pt: "Como camada de óxido evita reação imune, então osso adere diretamente ao implante.", en: "Because oxide layer prevents immune reaction, bone adheres directly to implant."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Nanopartículas em medicina servem para:", en: "Nanoparticles in medicine serve to:"}
        choices:
          - {pt: "Entregar fármacos, contraste de imagem e diagnóstico molecular", en: "Drug delivery, imaging contrast and molecular diagnostics"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pintura", en: "Just paint"}
          - {pt: "Apenas plástico inerte", en: "Just inert plastic"}
        correctAnswer: {pt: "Entregar fármacos, contraste de imagem e diagnóstico molecular", en: "Drug delivery, imaging contrast and molecular diagnostics"}
        rationale: {pt: "Quando tamanho é nano, então penetra tecidos e tem alta razão superfície/volume para função.", en: "When size is nano, particles penetrate tissues and have high surface/volume ratio for function."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Quitosana (de carapaças de crustáceos) tem aplicações como:", en: "Chitosan (from crustacean shells) has applications like:"}
        choices:
          - {pt: "Curativos hemostáticos e veículos de fármacos biodegradáveis", en: "Hemostatic dressings and biodegradable drug carriers"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas embalagem rígida", en: "Just rigid packaging"}
          - {pt: "Apenas metal", en: "Just metal"}
        correctAnswer: {pt: "Curativos hemostáticos e veículos de fármacos biodegradáveis", en: "Hemostatic dressings and biodegradable drug carriers"}
        rationale: {pt: "Como cargas positivas atraem hemácias, então quitosana acelera coagulação topicamente.", en: "Because positive charges attract red cells, chitosan accelerates clotting topically."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Seda de aranha como biomaterial é notável por:", en: "Spider silk as biomaterial is remarkable for:"}
        choices:
          - {pt: "Resistência mecânica superior por massa, biodegradabilidade", en: "Superior strength per mass, biodegradability"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas frágil", en: "Just brittle"}
          - {pt: "Apenas hidrofóbica", en: "Just hydrophobic"}
        correctAnswer: {pt: "Resistência mecânica superior por massa, biodegradabilidade", en: "Superior strength per mass, biodegradability"}
        rationale: {pt: "Quando proteínas se auto-organizam em fibras, então surge material mais forte que aço por peso.", en: "When proteins self-assemble into fibers, material stronger than steel by weight emerges."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Mimetismo extracelular em scaffolds requer:", en: "Extracellular mimicry in scaffolds requires:"}
        choices:
          - {pt: "Topografia, rigidez e sinais bioquímicos imitando o tecido alvo", en: "Topography, stiffness and biochemical cues mimicking target tissue"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas cor", en: "Just color"}
          - {pt: "Apenas plástico genérico", en: "Just generic plastic"}
        correctAnswer: {pt: "Topografia, rigidez e sinais bioquímicos imitando o tecido alvo", en: "Topography, stiffness and biochemical cues mimicking target tissue"}
        rationale: {pt: "Como células sentem mecânica e química, então scaffold deve falar a 'linguagem' do tecido.", en: "Because cells sense mechanics and chemistry, scaffold must speak tissue's 'language'."}
        objectives: [biology.biomimicry]
        difficulty: 5
      - type: choice
        question: {pt: "Materiais responsivos a estímulo (smart) podem:", en: "Stimulus-responsive (smart) materials can:"}
        choices:
          - {pt: "Mudar propriedade conforme pH, temperatura, luz — para liberação controlada", en: "Change property by pH, temperature, light — for controlled release"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas frágil", en: "Just brittle"}
        correctAnswer: {pt: "Mudar propriedade conforme pH, temperatura, luz — para liberação controlada", en: "Change property by pH, temperature, light — for controlled release"}
        rationale: {pt: "Quando ambiente sinaliza, então material responde liberando dose certa no momento certo.", en: "When environment signals, material responds releasing right dose at right time."}
        objectives: [biology.biomimicry]
        difficulty: 5
target: 20
