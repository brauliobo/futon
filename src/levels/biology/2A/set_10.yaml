title:
  pt: "🦴 Paleobiologia e tempo profundo"
  en: "🦴 Paleobiology and deep time"
level: '2A'
subject: biology
objectives: [biology.paleobiology]
difficulty: 5
authorNotes: "Fósseis, datação, eras geológicas, principais transições, paleontologia molecular."
example:
  pt: "Ex.: organismo morre → enterramento rápido → mineralização → fossilização → datação radiométrica."
  en: "Ex.: organism dies → rapid burial → mineralization → fossilization → radiometric dating."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Fósseis e datação", en: "Fossils and dating"}
    description: {pt: "Como lemos a história da vida nas rochas.", en: "How we read life's history in rocks."}
    exercises:
      - type: choice
        question: {pt: "Paleobiologia estuda:", en: "Paleobiology studies:"}
        choices:
          - {pt: "Vida do passado via fósseis e seu contexto evolutivo", en: "Past life via fossils and evolutionary context"}
          - {pt: "Apenas vida atual", en: "Just current life"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas microfósseis", en: "Just microfossils"}
        correctAnswer: {pt: "Vida do passado via fósseis e seu contexto evolutivo", en: "Past life via fossils and evolutionary context"}
        rationale: {pt: "Como rocha registra organismos extintos, então paleobiologia reconstrói árvore da vida ao longo do tempo.", en: "Because rock records extinct organisms, paleobiology reconstructs tree of life over time."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Fossilização requer:", en: "Fossilization requires:"}
        choices:
          - {pt: "Enterramento rápido com pouco oxigênio para evitar decomposição", en: "Rapid burial with low oxygen to avoid decomposition"}
          - {pt: "Apenas exposição ao ar", en: "Just air exposure"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas fogo", en: "Just fire"}
        correctAnswer: {pt: "Enterramento rápido com pouco oxigênio para evitar decomposição", en: "Rapid burial with low oxygen to avoid decomposition"}
        rationale: {pt: "Quando decompositores não chegam, então tecidos podem mineralizar antes de serem destruídos.", en: "When decomposers don't reach, tissues can mineralize before being destroyed."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Datação por carbono-14 é útil para fósseis até:", en: "Carbon-14 dating is useful for fossils up to:"}
        choices:
          - {pt: "~50.000 anos (meia-vida de 5.730 anos)", en: "~50,000 years (half-life 5,730 years)"}
          - {pt: "Apenas bilhões de anos", en: "Just billions of years"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem limite", en: "No limit"}
        correctAnswer: {pt: "~50.000 anos (meia-vida de 5.730 anos)", en: "~50,000 years (half-life 5,730 years)"}
        rationale: {pt: "Como ¹⁴C decai relativamente rápido, então só amostras recentes mantêm sinal mensurável.", en: "Because ¹⁴C decays relatively fast, only recent samples retain measurable signal."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Datação por urânio-chumbo (U-Pb) cobre:", en: "Uranium-lead (U-Pb) dating covers:"}
        choices:
          - {pt: "Centenas de milhões a bilhões de anos via zircões", en: "Hundreds of millions to billions of years via zircons"}
          - {pt: "Apenas anos recentes", en: "Just recent years"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas dias", en: "Just days"}
        correctAnswer: {pt: "Centenas de milhões a bilhões de anos via zircões", en: "Hundreds of millions to billions of years via zircons"}
        rationale: {pt: "Quando zircão prende U mas exclui Pb na formação, então razão U/Pb mede idade da rocha.", en: "When zircon traps U but excludes Pb at formation, U/Pb ratio measures rock age."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Princípio da superposição diz:", en: "Law of superposition states:"}
        choices:
          - {pt: "Em estratos não perturbados, mais antigo está embaixo", en: "In undisturbed strata, older is below"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Idade aleatória", en: "Random age"}
          - {pt: "Apenas mais novo embaixo", en: "Only newer below"}
        correctAnswer: {pt: "Em estratos não perturbados, mais antigo está embaixo", en: "In undisturbed strata, older is below"}
        rationale: {pt: "Como sedimento se acumula por cima, então sequência vertical preserva ordem temporal.", en: "Because sediment accumulates on top, vertical sequence preserves temporal order."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Fóssil-índice (zona) é:", en: "Index (zone) fossil is:"}
        choices:
          - {pt: "Espécie de distribuição ampla mas vida curta — útil para correlacionar estratos", en: "Wide-distribution short-lived species — useful for stratum correlation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Espécie eterna", en: "Eternal species"}
          - {pt: "Apenas local raro", en: "Just rare local"}
        correctAnswer: {pt: "Espécie de distribuição ampla mas vida curta — útil para correlacionar estratos", en: "Wide-distribution short-lived species — useful for stratum correlation"}
        rationale: {pt: "Quando uma espécie marca tempo curto, então sua presença identifica idade equivalente em rochas distantes.", en: "When a species marks short time, its presence identifies equivalent age across distant rocks."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Tafonomia estuda:", en: "Taphonomy studies:"}
        choices:
          - {pt: "Processos entre morte do organismo e fossilização", en: "Processes between organism death and fossilization"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas vida atual", en: "Just living things"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Processos entre morte do organismo e fossilização", en: "Processes between organism death and fossilization"}
        rationale: {pt: "Como fósseis contam só parte da história, então tafonomia interpreta vieses do registro.", en: "Because fossils tell only part of the story, taphonomy interprets record biases."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Lagerstätten são:", en: "Lagerstätten are:"}
        choices:
          - {pt: "Sítios fossilíferos com preservação excepcional (ex.: Burgess Shale)", en: "Fossil sites with exceptional preservation (e.g., Burgess Shale)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas fósseis comuns", en: "Just common fossils"}
          - {pt: "Apenas pedras", en: "Just rocks"}
        correctAnswer: {pt: "Sítios fossilíferos com preservação excepcional (ex.: Burgess Shale)", en: "Fossil sites with exceptional preservation (e.g., Burgess Shale)"}
        rationale: {pt: "Quando condições são ideais, então até partes moles fossilizam — janelas raras na biota antiga.", en: "When conditions are ideal, even soft parts fossilize — rare windows into ancient biota."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Fósseis-traço (icnofósseis) preservam:", en: "Trace fossils (ichnofossils) preserve:"}
        choices:
          - {pt: "Atividade do organismo (pegadas, tocas, fezes)", en: "Organism activity (footprints, burrows, feces)"}
          - {pt: "Apenas o corpo direto", en: "Just direct body"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Atividade do organismo (pegadas, tocas, fezes)", en: "Organism activity (footprints, burrows, feces)"}
        rationale: {pt: "Como vestígios revelam comportamento, então icnofósseis complementam fósseis corporais.", en: "Because traces reveal behavior, ichnofossils complement body fossils."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Equilíbrio pontuado (Eldredge & Gould) propõe:", en: "Punctuated equilibrium (Eldredge & Gould) proposes:"}
        choices:
          - {pt: "Estase longa intercalada com mudanças evolutivas rápidas", en: "Long stasis interspersed with rapid evolutionary changes"}
          - {pt: "Apenas mudança gradual", en: "Just gradual change"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem mudança", en: "No change"}
        correctAnswer: {pt: "Estase longa intercalada com mudanças evolutivas rápidas", en: "Long stasis interspersed with rapid evolutionary changes"}
        rationale: {pt: "Quando registro mostra saltos morfológicos, então especiação rápida em populações pequenas explica padrão.", en: "When record shows morphological jumps, rapid speciation in small populations explains pattern."}
        objectives: [biology.paleobiology]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Tempo profundo e grandes transições", en: "Deep time and major transitions"}
    description: {pt: "Marcos da história da vida.", en: "Milestones in life's history."}
    exercises:
      - type: choice
        question: {pt: "Éon Hadeano corresponde a:", en: "Hadean Eon corresponds to:"}
        choices:
          - {pt: "Os primeiros ~600 milhões de anos da Terra (~4,6-4 Ga)", en: "First ~600 million years of Earth (~4.6-4 Ga)"}
          - {pt: "Apenas Mesozoico", en: "Just Mesozoic"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas hoje", en: "Just today"}
        correctAnswer: {pt: "Os primeiros ~600 milhões de anos da Terra (~4,6-4 Ga)", en: "First ~600 million years of Earth (~4.6-4 Ga)"}
        rationale: {pt: "Como Terra ainda esfriava e era bombardeada, então registro fóssil é praticamente nulo.", en: "Because Earth was still cooling and bombarded, fossil record is virtually nil."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Explosão Cambriana (~540 Ma) marca:", en: "Cambrian explosion (~540 Mya) marks:"}
        choices:
          - {pt: "Diversificação rápida de filos animais com partes duras", en: "Rapid diversification of animal phyla with hard parts"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Extinção total", en: "Total extinction"}
          - {pt: "Apenas plantas", en: "Just plants"}
        correctAnswer: {pt: "Diversificação rápida de filos animais com partes duras", en: "Rapid diversification of animal phyla with hard parts"}
        rationale: {pt: "Quando exoesqueletos surgem e oxigenação aumenta, então radiação animal preserva-se em fósseis.", en: "When exoskeletons appear and oxygenation rises, animal radiation preserves in fossils."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Tetrápodes (vertebrados terrestres) surgiram do:", en: "Tetrapods (land vertebrates) emerged from:"}
        choices:
          - {pt: "Peixes sarcopterígios devonianos (ex.: Tiktaalik) ~375 Ma", en: "Devonian sarcopterygian fish (e.g., Tiktaalik) ~375 Mya"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas insetos", en: "Just insects"}
          - {pt: "Apenas plantas", en: "Just plants"}
        correctAnswer: {pt: "Peixes sarcopterígios devonianos (ex.: Tiktaalik) ~375 Ma", en: "Devonian sarcopterygian fish (e.g., Tiktaalik) ~375 Mya"}
        rationale: {pt: "Como Tiktaalik tem nadadeiras com ossos de membro, então documenta transição peixe-tetrápode.", en: "Because Tiktaalik has fins with limb bones, it documents fish-tetrapod transition."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Era Mesozoica é conhecida como:", en: "Mesozoic Era is known as:"}
        choices:
          - {pt: "Era dos répteis — domínio dos dinossauros", en: "Age of reptiles — dinosaur dominance"}
          - {pt: "Apenas mamíferos", en: "Just mammals"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas peixes", en: "Just fish"}
        correctAnswer: {pt: "Era dos répteis — domínio dos dinossauros", en: "Age of reptiles — dinosaur dominance"}
        rationale: {pt: "Como dinossauros dominaram nichos terrestres, então mamíferos permaneceram pequenos e noturnos.", en: "Because dinosaurs dominated terrestrial niches, mammals remained small and nocturnal."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Aves são descendentes de:", en: "Birds are descendants of:"}
        choices:
          - {pt: "Dinossauros terópodes (linhagem maniraptora)", en: "Theropod dinosaurs (maniraptoran lineage)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas répteis voadores", en: "Just flying reptiles"}
          - {pt: "Apenas mamíferos", en: "Just mammals"}
        correctAnswer: {pt: "Dinossauros terópodes (linhagem maniraptora)", en: "Theropod dinosaurs (maniraptoran lineage)"}
        rationale: {pt: "Quando Archaeopteryx mostra penas e dentes, então parentesco aves-dinossauros é confirmado.", en: "When Archaeopteryx shows feathers and teeth, bird-dinosaur kinship is confirmed."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Baleias evoluíram de:", en: "Whales evolved from:"}
        choices:
          - {pt: "Mamíferos terrestres ungulados (Pakicetus → cetáceos)", en: "Land ungulate mammals (Pakicetus → cetaceans)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas peixes", en: "Just fish"}
          - {pt: "Apenas répteis", en: "Just reptiles"}
        correctAnswer: {pt: "Mamíferos terrestres ungulados (Pakicetus → cetáceos)", en: "Land ungulate mammals (Pakicetus → cetaceans)"}
        rationale: {pt: "Como série fóssil mostra retorno ao mar, então baleias documentam transição reversa terra-água.", en: "Because fossil series shows return to sea, whales document reverse land-water transition."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Hominíneos surgiram na:", en: "Hominins emerged in:"}
        choices:
          - {pt: "África, há ~6-7 milhões de anos (separação do clado dos chimpanzés)", en: "Africa, ~6-7 Mya (split from chimpanzee clade)"}
          - {pt: "Apenas Europa", en: "Just Europe"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas América", en: "Just America"}
        correctAnswer: {pt: "África, há ~6-7 milhões de anos (separação do clado dos chimpanzés)", en: "Africa, ~6-7 Mya (split from chimpanzee clade)"}
        rationale: {pt: "Como fósseis africanos (Sahelanthropus, Ardipithecus) datam dessa janela, então origem é continental.", en: "Because African fossils (Sahelanthropus, Ardipithecus) date this window, origin is continental."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Bipedalismo precedeu:", en: "Bipedalism preceded:"}
        choices:
          - {pt: "Cérebro grande na evolução humana (Australopithecus já caminhava ereto)", en: "Large brain in human evolution (Australopithecus already walked upright)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas linguagem", en: "Just language"}
          - {pt: "Cérebro grande primeiro", en: "Big brain first"}
        correctAnswer: {pt: "Cérebro grande na evolução humana (Australopithecus já caminhava ereto)", en: "Large brain in human evolution (Australopithecus already walked upright)"}
        rationale: {pt: "Quando Lucy (~3,2 Ma) tem pelve bípede e cérebro pequeno, então sequência evolutiva fica clara.", en: "When Lucy (~3.2 Mya) has bipedal pelvis and small brain, evolutionary sequence is clear."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Paleoproteômica permite:", en: "Paleoproteomics allows:"}
        choices:
          - {pt: "Sequenciar proteínas em fósseis muito antigos para DNA preservar", en: "Sequence proteins in fossils too old for DNA preservation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA moderno", en: "Just modern DNA"}
          - {pt: "Apenas microscopia", en: "Just microscopy"}
        correctAnswer: {pt: "Sequenciar proteínas em fósseis muito antigos para DNA preservar", en: "Sequence proteins in fossils too old for DNA preservation"}
        rationale: {pt: "Como colágeno persiste milhões de anos, então paleoproteômica estende paleontologia molecular.", en: "Because collagen persists for millions of years, paleoproteomics extends molecular paleontology."}
        objectives: [biology.paleobiology]
        difficulty: 5
      - type: choice
        question: {pt: "Antropoceno é proposto como:", en: "Anthropocene is proposed as:"}
        choices:
          - {pt: "Nova época geológica marcada pelo impacto humano global", en: "New geological epoch marked by global human impact"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas era pré-histórica", en: "Just prehistoric era"}
          - {pt: "Sem fundamento", en: "No basis"}
        correctAnswer: {pt: "Nova época geológica marcada pelo impacto humano global", en: "New geological epoch marked by global human impact"}
        rationale: {pt: "Como humanos alteram clima, biota e estratos, então marcadores geológicos justificam nova época.", en: "Because humans alter climate, biota and strata, geological markers justify new epoch."}
        objectives: [biology.paleobiology]
        difficulty: 5
target: 20
