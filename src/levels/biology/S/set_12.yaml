        question:
          pt: Mycorrhizal carbon sequestration (Toby Kiers SPUN + Hetherington Allen 2024) impacto é…
          en: Mycorrhizal carbon sequestration (Toby Kiers SPUN + Hetherington/Allen 2024) impact is…
        choices:
          - Mycorrhizal fungi sequester ~36% (~13 Gt/year) of human carbon emissions in mycelial networks and soil organic matter, an underappreciated nature-based carbon sink
          - Mycorrhizal fungi release carbon and don't sequester
          - Soil sequesters trivially small amounts globally
          - Carbon sequestration occurs only in oceans
        correctAnswer: Mycorrhizal fungi sequester ~36% (~13 Gt/year) of human carbon emissions in mycelial networks and soil organic matter, an underappreciated nature-based carbon sink
        rationale:
          pt: 'Mycorrhizal carbon sequestration (Hawkins Cargill Hetherington Allen Kiers Curr Biol 2023 mar): mycorrhizal fungi store ~13.12 ± 5.27 Gt CO₂-equivalent annually (~36% global anthropogenic emissions). Mechanism: plant photosynthate → fungal hyphae mycelial networks (extensive subterranean) → conversion soil organic matter (chitin/glomalin/lipids) recalcitrant decomposition → long-term sequestration soil carbon pool (~3000Gt total C globally land — biggest terrestrial carbon reservoir). Subterranean carbon flux invisible/uncountable surface measurements traditionally. AM (arbuscular) fungi ~9.07Gt, ECM (ectomycorrhizal) ~3.93Gt, ericoid ~0.12Gt. Implications: agriculture/conservation policy underplaying soil carbon. Toby Kiers (Vrije Univ Amsterdam) founded SPUN (Society Protection Underground Networks, Crowther Lab ETH Zürich co-founded) — global underground carbon mapping initiative 2021+, surveyed 1+ million ecosystems via metagenomics. Threats: tilling/agriculture disrupts mycelial networks, deforestation, climate change. Concurrent: blue carbon (mangroves, seagrasses, salt marshes ocean ~10Gt/year), biochar terra preta. Field 2024 nature-based solutions ~30% net-zero pathways. Soil microbiome conservation rising priority.'
          en: 'Mycorrhizal carbon sequestration (Hawkins/Kiers Curr Biol 2023 March): mycorrhizal fungi store ~13.12 ± 5.27 Gt CO₂-equivalent annually (~36% of global anthropogenic emissions). Mechanism: plant photosynthate → fungal hyphae mycelial networks (extensive subterranean) → conversion to soil organic matter (chitin/glomalin/lipids) recalcitrant to decomposition → long-term sequestration in soil carbon pool (~3000 Gt total C globally on land — biggest terrestrial carbon reservoir). Subterranean carbon flux is invisible/uncountable in surface measurements traditionally. AM (arbuscular) fungi ~9.07 Gt, ECM (ectomycorrhizal) ~3.93 Gt, ericoid ~0.12 Gt. Implications: agriculture/conservation policy is underplaying soil carbon. Toby Kiers (Vrije Univ Amsterdam) founded SPUN (Society for Protection of Underground Networks, Crowther Lab ETH Zürich co-founded) — global underground carbon mapping initiative 2021+, surveyed 1+ million ecosystems via metagenomics. Threats: tilling/agriculture disrupts mycelial networks, deforestation, climate change. Concurrent: blue carbon (mangroves, seagrasses, salt marshes ocean ~10 Gt/year), biochar terra preta. Field 2024 nature-based solutions ~30% of net-zero pathways. Soil microbiome conservation rising priority.'
