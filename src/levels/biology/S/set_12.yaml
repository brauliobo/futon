        question:
          pt: Photosynthetic alternative to RuBisCO carbon fixation (Bar-Even/Erb 2016+) approaches são…
          en: Alternatives to RuBisCO carbon fixation (Bar-Even/Erb 2016+) approaches are…
        choices:
          - Designed synthetic carbon-fixation cycles like CETCH (Erb) using engineered enzymes 20% faster than Calvin cycle, demonstrated in vitro in 2016
          - Pure RuBisCO improvement only without alternative pathways
          - Animal-derived carbon fixation enzymes
          - Fixed limitation accepting Calvin cycle without engineering
        correctAnswer: Designed synthetic carbon-fixation cycles like CETCH (Erb) using engineered enzymes 20% faster than Calvin cycle, demonstrated in vitro in 2016
        rationale:
          pt: 'Synthetic carbon fixation pathways: address RuBisCO limitations (slow ~3-10/sec turnover, photorespiration). Bar-Even Noor Lewis Milo PNAS 2010 — bioinformatics design 17 alternative theoretical pathways. Erb Schwander Schada von Borzyskowski Bar-Even Burgener Glatter Beste Biel Erb Science 2016: CETCH (Crotonyl-coA/Ethylmalonyl-coA/Hydroxybutyryl-coA cycle) — designed cycle 17 enzymes 9 organisms (E. coli synthetases, Methylobacterium ECRs enoyl-CoA carboxylase/reductases ~20x faster than RuBisCO). Demonstrated in vitro CO₂ fixation glycolate output. Subsequent: improved CETCH versions, MOG (Malonyl-CoA-Oxaloacetate-Glyoxylate) cycle. Implementation in vivo organismos challenging — competing native pathways, balancing flux. Concurrent: Sara Tcherkez Australian National University biochemical RuBisCO improvement. RuBisCO red algae versions Form III ~10x faster but oxygen sensitive (cyanobacterial RuBisCO Genentech 2017). Field 2024+ active: chimeric RuBisCO transferred plants (Wilson Bracher Sharwood Whitney Sci Adv 2018), GBS-RuBisCO (Long Lab → Nature Plants 2024), Pseudoreverse synthetic cycle (Erb 2024 enzymatic cascade). Photosynthesis bottleneck rebuild ambitious decade horizon.'
          en: 'Synthetic carbon fixation pathways: address RuBisCO limitations (slow ~3-10/sec turnover, photorespiration). Bar-Even/Milo PNAS 2010 — bioinformatics design of 17 alternative theoretical pathways. Erb Science 2016: CETCH (Crotonyl-coA/Ethylmalonyl-coA/Hydroxybutyryl-coA cycle) — designed cycle of 17 enzymes from 9 organisms (E. coli synthetases, Methylobacterium ECRs enoyl-CoA carboxylase/reductases ~20x faster than RuBisCO). Demonstrated CO₂ fixation in vitro with glycolate output. Subsequent: improved CETCH versions, MOG (Malonyl-CoA-Oxaloacetate-Glyoxylate) cycle. Implementation in vivo organisms is challenging — competing native pathways, balancing flux. Concurrent: Sara Tcherkez ANU biochemical RuBisCO improvement. RuBisCO red algae versions Form III ~10x faster but oxygen sensitive (cyanobacterial RuBisCO Genentech 2017). Field 2024+ active: chimeric RuBisCO transferred to plants (Wilson/Whitney Sci Adv 2018), GBS-RuBisCO (Long Lab → Nature Plants 2024), Pseudoreverse synthetic cycle (Erb 2024 enzymatic cascade). Photosynthesis bottleneck rebuild on an ambitious decade horizon.'
        objectives: [Synthetic carbon fixation]
