        question:
          pt: eDNA (environmental DNA) biodiversity monitoring é…
          en: eDNA (environmental DNA) biodiversity monitoring is…
        choices:
          - Detection of species presence by sequencing trace DNA shed into water/soil/air, enabling sensitive, non-invasive surveys including rare, cryptic, and invasive species
          - Standard live trapping and counting only
          - Pure visual surveys without molecular methods
          - Single-species PCR without metabarcoding
        correctAnswer: Detection of species presence by sequencing trace DNA shed into water/soil/air, enabling sensitive, non-invasive surveys including rare, cryptic, and invasive species
        rationale:
          pt: 'Environmental DNA (eDNA): species shed DNA into environment via skin cells, mucus, feces, urine, gametes. Detected via metabarcoding: sample water/soil/air → DNA extraction → PCR universal primers (12S/16S rRNA fish vertebrates, ITS fungi, COI invertebrates) → high-throughput sequencing → identify species by sequence matching reference databases. Pioneer: Pierre Taberlet Grenoble (early 2010s aquatic), Holdaway/Ficetola palaeo-eDNA. Aplicações: detection invasive species (Asian carp Mississippi → Federal monitoring), rare/cryptic species (Loch Ness sturgeon negative result, Tasmanian devil monitoring), aquatic surveys without disturbance, ancient eDNA from sediments (Pedersen 2016 Nature 700ka mammoth steppe). Air eDNA — Clare Lynggaard Bohmann Sherrill-Mix Knight Zhou Schnell Curr Biol 2022 → demonstrate vacuum air → identify ~25 species London Zoo distance ~300m. Water eDNA mainstream: NatureMetrics, Smith-Root commercially available. Sensitivity ~picogram DNA detect endangered species. Limit: persistence varies (~hours-weeks depending environment), false negatives, quantification difficult, bioinformatics complex. Field 2024+ standardizing methods global biodiversity monitoring + biosecurity.'
          en: 'Environmental DNA (eDNA): species shed DNA into environment via skin cells, mucus, feces, urine, gametes. Detected via metabarcoding: sample water/soil/air → DNA extraction → PCR with universal primers (12S/16S rRNA for vertebrate fish, ITS for fungi, COI for invertebrates) → high-throughput sequencing → identify species by sequence matching to reference databases. Pioneer: Pierre Taberlet Grenoble (early 2010s aquatic), Holdaway/Ficetola palaeo-eDNA. Applications: detection of invasive species (Asian carp Mississippi → Federal monitoring), rare/cryptic species (Loch Ness sturgeon negative result, Tasmanian devil monitoring), aquatic surveys without disturbance, ancient eDNA from sediments (Pedersen 2016 Nature 700 ka mammoth steppe). Air eDNA — Clare/Bohmann Curr Biol 2022 → demonstrate vacuum air → identify ~25 species at London Zoo from distance ~300 m. Water eDNA mainstream: NatureMetrics, Smith-Root commercially available. Sensitivity ~picogram DNA can detect endangered species. Limit: persistence varies (~hours-weeks depending on environment), false negatives, quantification difficult, bioinformatics complex. Field 2024+ standardizing methods for global biodiversity monitoring + biosecurity.'
        objectives: [eDNA monitoring]
