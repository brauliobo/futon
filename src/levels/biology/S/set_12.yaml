        question:
          pt: Climate-driven species range shifts (Parmesan/Pounds Pounds Nature 2003 → 2024 IPCC) é…
          en: Climate-driven species range shifts (Parmesan/Pounds Nature 2003 → 2024 IPCC) is…
        choices:
          - Documented poleward and upslope shifts of species ranges by ~17 km/decade latitude and ~11 m/decade elevation, mismatch with phenology causing trophic disruptions
          - Static species ranges unchanged by climate
          - Pure latitudinal migration without elevational component
          - Population stability without geographic redistribution
        correctAnswer: Documented poleward and upslope shifts of species ranges by ~17 km/decade latitude and ~11 m/decade elevation, mismatch with phenology causing trophic disruptions
        rationale:
          pt: 'Climate-driven range shifts: Parmesan Yohe Nature 2003 metanalysis, Chen Hill Ohlemuller Roy Thomas Science 2011 — average ~17.6 km/decade poleward latitude, ~11.0 m/decade upward elevation since ~1960. Higher latitudes (Arctic, Boreal) shifts faster (~30+ km/decade). Patterns: butterflies, birds, fish, plants. Phenology shifts: spring events (leaf-out, bird arrival, breeding) ~2-5 dias/decade earlier last 50 anos (NOAA). Mismatch: classic Cresswell oak winter moth tit case — winter moth caterpillar peaks earlier than great tit chicks → reduced nestling survival. Trophic cascades: pollinator decline (Goulson, Potts), insect biomass ~75% decline 27 anos Germany Krefeld study (Hallmann 2017 PLOS ONE). IPCC 2022 6th assessment Working Group II: ~half species assessed already shifted ranges. Future projections 2°C warming: ~14% species committed extinction global; 4°C ~50%. Cascading: agricultural pests (mountain pine beetle Pacific NW), invasive species (Bd chytrid amphibians), disease vectors (Aedes mosquitoes dengue/Zika expansion). Adaptation: assisted migration (Schwartz 2019 American chestnut Castanea), conservation corridors, climate-smart agriculture, IPBES policy recommendations. Field 2024+ critical Anthropocene biodiversity research.'
          en: 'Climate-driven range shifts: Parmesan/Yohe Nature 2003 meta-analysis, Chen Hill Ohlemuller Roy Thomas Science 2011 — average ~17.6 km/decade poleward latitude, ~11.0 m/decade upward elevation since ~1960. Higher latitudes (Arctic, Boreal) shifts faster (~30+ km/decade). Patterns: butterflies, birds, fish, plants. Phenology shifts: spring events (leaf-out, bird arrival, breeding) ~2-5 days/decade earlier in last 50 years (NOAA). Mismatch: classic Cresswell oak winter moth tit case — winter moth caterpillar peaks earlier than great tit chicks → reduced nestling survival. Trophic cascades: pollinator decline (Goulson, Potts), insect biomass ~75% decline over 27 years Germany Krefeld study (Hallmann 2017 PLOS ONE). IPCC 2022 6th Assessment Working Group II: ~half of species assessed already shifted ranges. Future projections at 2°C warming: ~14% of species committed to extinction globally; 4°C ~50%. Cascading: agricultural pests (mountain pine beetle Pacific NW), invasive species (Bd chytrid amphibians), disease vectors (Aedes mosquitoes dengue/Zika expansion). Adaptation: assisted migration (Schwartz 2019 American chestnut Castanea), conservation corridors, climate-smart agriculture, IPBES policy recommendations. Field 2024+ critical Anthropocene biodiversity research.'
        objectives: [Range shifts climate]
      - type: choice
        difficulty: 5
        question:
          pt: Colossal Biosciences mammoth de-extinction (Church/Lamm 2021) approach é…
          en: Colossal Biosciences mammoth de-extinction (Church/Lamm 2021) approach is…
        choices:
          - CRISPR-edited Asian elephant cells with reconstructed mammoth genes (cold-tolerance hair, fat) to produce a mammoth-elephant hybrid via gestation, also targeting thylacine and dodo
          - Cloning a mammoth from frozen DNA via SCNT
          - Pure museum exhibit without genetic component
          - Resurrection of dinosaurs via DNA from amber
        correctAnswer: CRISPR-edited Asian elephant cells with reconstructed mammoth genes (cold-tolerance hair, fat) to produce a mammoth-elephant hybrid via gestation, also targeting thylacine and dodo
        rationale:
          pt: 'Colossal Biosciences (founded 2021 George Church Harvard + Ben Lamm Texas, ~$435M raised 2024): de-extinction company. Targets: woolly mammoth (Mammuthus primigenius, extinct ~4000 years), Tasmanian thylacine (Thylacinus cynocephalus, extinct 1936), dodo (Raphus cucullatus, extinct ~1660). Approach (não cloning de DNA antigo): Asian elephant (Elephas maximus, ~99.6% genome shared mammoth, closest living relative) → iPSC derived → CRISPR multiplex install ~50+ mammoth-specific genes (cold-tolerance: TRPV3 thermosensor, hair-related KRTAP, fat distribution UCP1, hemoglobin polar adaptations) → embryo cloning (SCNT mammoth-elephant hybrid) → gestate Asian elephant surrogate (~22 month gestation) ou artificial uterus 2030 timeline goal. Asian elephants endangered → ethical surrogacy concerns. Subsequent: thylacine — dunnart Sminthopsis crassicaudata host; dodo — Nicobar pigeon (closest living relative). 2024 progress: mammoth-elephant cell line edited 65 genes, viable, characterized. Hairy elephants 2026 announced ambitious. Concurrent: Revive & Restore (Stewart Brand) heath hen, passenger pigeon. Critics: ecological disruption unproven, opportunity cost vs preserving extant species, inability fully replicate species (epigenetics, microbiome, ecology). Vision: rewild mammoths Pleistocene Park Siberia (Sergey Zimov Yakutia ecosystem engineer climate methane prevention).'
