title:
  pt: Biologia Vegetal e Mudanças Climáticas
  en: Plant Biology and Climate Change
level: S
subject: biology
objectives:
  - Compreender fotossíntese C3/C4/CAM e RIPE Long
  - Reconhecer Golden Rice, CRISPR crops, C4 rice
  - Identificar Earth BioGenome, eDNA biodiversidade
  - Avaliar branqueamento de corais, evolução assistida
difficulty: 5
authorNotes: |
  Plant biology era 2024+: photosynthesis efficiency RIPE (Stephen Long Illinois), C4 rice
  project IRRI, Golden Rice approved Philippines 2021, CRISPR powdery mildew wheat (Caixia Gao
  2014/2022), pan-genome rice maize T2T 2023+. Climate: Earth BioGenome Project ~1.8M species,
  eDNA biodiversity, Toby Kiers SPUN mycorrhizal networks, van Oppen AIMS coral assisted
  evolution, LanzaTech carbon capture.
example:
  question:
    pt: RIPE project (Realizing Increased Photosynthetic Efficiency, Stephen Long Illinois 2012+) approach é…
    en: RIPE project (Realizing Increased Photosynthetic Efficiency, Stephen Long Illinois 2012+) approach is…
  choices:
    - Engineer photosynthesis to bypass non-photochemical quenching delays and supercharge electron transport, achieving ~20-40% yield increases in field-tested transgenic crops
    - Pure agronomic management without genetic engineering
    - Random mutagenesis without targeted improvement
    - Greenhouse-only research without field testing
  correctAnswer: Engineer photosynthesis to bypass non-photochemical quenching delays and supercharge electron transport, achieving ~20-40% yield increases in field-tested transgenic crops
  rationale:
    pt: 'RIPE (Realizing Increased Photosynthetic Efficiency): Stephen Long Univ Illinois Urbana-Champaign / Lancaster Univ UK, founded 2012 Bill & Melinda Gates Foundation funded ~$45M+. Goal: increase photosynthetic efficiency staple crops (rice, soy, cassava, cowpea) — historically yields plateauing classical breeding. Strategy: re-engineer specific bottlenecks photosynthesis identified via mathematical modeling. Achievements: NPQ (non-photochemical quenching) tobacco — overexpression VDE+ZEP+PsbS faster recovery shading → ~15-20% yield gain field (Kromdijk Long Niyogi Science 2016). Subsequent: SBPase + RUBISCO activase overexpression rice (~27% yield increase Yoon 2020). PhotoCanopy 2.0 multi-gene stacks. Field trials Illinois, Philippines, Tanzania. Subsequent: South Korean rice breeding ALL-RIPE genotypes (~20% yield increase). Concurrent: C4 Rice (IRRI International Rice Research Institute) more ambitious — engineer C3 rice with C4 photosynthesis pathway maize/sugarcane. ~$25-30 anos timeline. Photosynthesis engineering 2024+ active field — could feed 9-10B people.'
    en: 'RIPE (Realizing Increased Photosynthetic Efficiency): Stephen Long Univ Illinois Urbana-Champaign / Lancaster Univ UK, founded 2012, Bill & Melinda Gates Foundation funded ~$45M+. Goal: increase photosynthetic efficiency in staple crops (rice, soy, cassava, cowpea) — historically yields have been plateauing under classical breeding. Strategy: re-engineer specific bottlenecks of photosynthesis identified via mathematical modeling. Achievements: NPQ (non-photochemical quenching) in tobacco — overexpression VDE+ZEP+PsbS gave faster recovery from shading → ~15-20% yield gain in field (Kromdijk/Long/Niyogi Science 2016). Subsequent: SBPase + RUBISCO activase overexpression in rice (~27% yield increase Yoon 2020). PhotoCanopy 2.0 multi-gene stacks. Field trials in Illinois, Philippines, Tanzania. Subsequent: South Korean rice breeding ALL-RIPE genotypes (~20% yield increase). Concurrent: C4 Rice (IRRI International Rice Research Institute) is more ambitious — engineer C3 rice with C4 photosynthesis pathway from maize/sugarcane. ~$25-30 years timeline. Photosynthesis engineering 2024+ is an active field — could feed 9-10B people.'
