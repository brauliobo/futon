        question:
          pt: Earth BioGenome Project (Lewin/Robinson 2018 ChinaSci 2022 launch) é…
          en: Earth BioGenome Project (Lewin/Robinson 2018 ChinaSci 2022 launch) is…
        choices:
          - 10-year ~$4.7B initiative to sequence reference genomes of all ~1.8M known eukaryotic species, scaled coordinated effort spanning multiple regional consortia
          - Pure microbiome sequencing without macroorganism focus
          - Single-species deep sequencing of one organism
          - Sequencing exclusively human genomes
        correctAnswer: 10-year ~$4.7B initiative to sequence reference genomes of all ~1.8M known eukaryotic species, scaled coordinated effort spanning multiple regional consortia
        rationale:
          pt: 'Earth BioGenome Project (EBP, Lewin Robinson Kress Edgar Olson Suh Coddington PNAS 2018 + 2022 launch): ambitious initiative reference genome assembly all ~1.8M known eukaryotic species (animals, plants, fungi, protists). Three phases: Phase 1 ~9000 priority families representative species (~1 phase 2024 nearing complete); Phase 2 ~150k genera; Phase 3 all ~1.8M known species. Estimated cost ~$4.7B over 10 years (cheaper at-scale due tech progress vs ~$3B Human Genome 1990-2003 single species). Coordinated consortia: Vertebrate Genomes Project (VGP), Darwin Tree of Life UK Sanger (~70k UK species), Bat1K, Bird10K, Fish10K, ASG African genome diversity, IGB Iberian Genome Project, BC-CCH Brazil bicentennial, ChinaSci. Output ~1500 species 2018 → ~50000+ 2024. Tools: long-read sequencing (PacBio HiFi, Oxford Nanopore), automated assembly. Significance: biodiversity reference baseline crucial Anthropocene era species declining ~1000x background rate; conservation, agriculture, biotech discovery, evolutionary biology. Compares Human Pangenome Project + 1000 Genomes — biology-wide rather than specific human ancestry.'
          en: 'Earth BioGenome Project (EBP, Lewin/Robinson PNAS 2018 + 2022 launch): ambitious initiative for reference genome assembly of all ~1.8M known eukaryotic species (animals, plants, fungi, protists). Three phases: Phase 1 ~9000 priority families with representative species (~Phase 1 2024 nearing complete); Phase 2 ~150k genera; Phase 3 all ~1.8M known species. Estimated cost ~$4.7B over 10 years (cheaper at-scale due to tech progress vs ~$3B Human Genome 1990-2003 single species). Coordinated consortia: Vertebrate Genomes Project (VGP), Darwin Tree of Life UK Sanger (~70k UK species), Bat1K, Bird10K, Fish10K, ASG African genome diversity, IGB Iberian Genome Project, BC-CCH Brazil bicentennial, ChinaSci. Output ~1500 species 2018 → ~50000+ 2024. Tools: long-read sequencing (PacBio HiFi, Oxford Nanopore), automated assembly. Significance: biodiversity reference baseline crucial in Anthropocene era — species declining ~1000x background rate; conservation, agriculture, biotech discovery, evolutionary biology. Compares with Human Pangenome Project + 1000 Genomes — biology-wide rather than specific to human ancestry.'
        objectives: [Earth BioGenome Project]
