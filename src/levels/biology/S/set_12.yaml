        question:
          pt: LanzaTech gas fermentation (Sean Simpson 2005+) approach é…
          en: LanzaTech gas fermentation (Sean Simpson 2005+) approach is…
        choices:
          - Engineered Clostridium autoethanogenum acetogens fermenting industrial CO/CO2-rich waste gas streams into ethanol/biofuels at commercial scale (e.g., steel mills, refineries)
          - Pure photosynthetic algae bioreactors only
          - Direct chemical synthesis without microbial component
          - Coal-fired biomass with no gas conversion
        correctAnswer: Engineered Clostridium autoethanogenum acetogens fermenting industrial CO/CO2-rich waste gas streams into ethanol/biofuels at commercial scale (e.g., steel mills, refineries)
        rationale:
          pt: 'LanzaTech (founded 2005 Auckland NZ → Skokie IL, Sean Simpson + Richard Forster, IPO 2023): commercial gas fermentation. Chassis: Clostridium autoethanogenum, anaerobic acetogen → Wood-Ljungdahl pathway fixes CO+CO₂+H₂ → acetyl-CoA → ethanol/2,3-butanediol direct. Engineered metabolic redirection ~85% carbon ethanol. Industrial: capture CO/CO₂-rich waste streams (steel mill flue gas ~50% CO, refinery off-gas, biomass gasification, municipal solid waste gasification) → pipe bioreactor → ethanol output → drop-in fuel. Plants commercial: Steelanol Belgium ArcelorMittal partnership, Shougang Steel China (2018+), Sweden Coca-Cola packaging carbon-recycled jet fuel collaboration. Output ~50000-90000 tons ethanol/year mature plants. Subsequent: jet fuel via Lanzajet (alcohol-to-jet) Phillips 66 partnership, sustainable aviation fuel SAF. Carbon recycling — não sequestration mas avoiding fossil-derived virgin carbon. Concurrent: Newlight Technologies (PHB plastic from methane), Solugen (electrochemical-bio hybrid), Catalyst Biosciences. Synthetic carbon-fixation companies broader: Twelve (CO₂ → fuels electrochemistry), Carbon Engineering (DAC direct air capture). Field 2024 active maturity — climate tech.'
          en: 'LanzaTech (founded 2005 Auckland NZ → Skokie IL, Sean Simpson + Richard Forster, IPO 2023): commercial gas fermentation. Chassis: Clostridium autoethanogenum, anaerobic acetogen → Wood-Ljungdahl pathway fixes CO+CO₂+H₂ → acetyl-CoA → ethanol/2,3-butanediol directly. Engineered metabolic redirection ~85% of carbon to ethanol. Industrial: capture CO/CO₂-rich waste streams (steel mill flue gas ~50% CO, refinery off-gas, biomass gasification, municipal solid waste gasification) → pipe to bioreactor → ethanol output → drop-in fuel. Commercial plants: Steelanol Belgium ArcelorMittal partnership, Shougang Steel China (2018+), Sweden Coca-Cola packaging carbon-recycled jet fuel collaboration. Output ~50000-90000 tons ethanol/year at mature plants. Subsequent: jet fuel via Lanzajet (alcohol-to-jet) Phillips 66 partnership, sustainable aviation fuel SAF. Carbon recycling — not sequestration but avoiding fossil-derived virgin carbon. Concurrent: Newlight Technologies (PHB plastic from methane), Solugen (electrochemical-bio hybrid), Catalyst Biosciences. Synthetic carbon-fixation companies broader: Twelve (CO₂ → fuels electrochemistry), Carbon Engineering (DAC direct air capture). Field 2024 active and maturing — climate tech.'
        objectives: [LanzaTech gas fermentation]
