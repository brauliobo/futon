        rationale:
          pt: 'Half-Earth (E.O. Wilson "Half-Earth Our Planet Fight for Life" 2016): proposed setting aside half Earth surface (land + ocean) for biodiversity conservation reserve mainstream species → ~85% biodiversity preserved. Influential Wilson Harvard biology Half-Earth Project E.O. Wilson Foundation. Concurrent: Aichi Biodiversity Targets 2010-2020 (CBD Strategic Plan, mostly missed), Convention Biological Diversity (CBD) Kunming-Montréal Global Biodiversity Framework December 2022 COP15 — ratified 30x30 (30% land + ocean protected by 2030), 30% restored degraded ecosystems, 50% reduction risk pesticides, 50% reduction food waste, $20B/year conservation funding flow developing countries 2025+. Currently ~17% land + ~10% ocean protected. Achieving 30x30 ambitious — requires global cooperation. Mechanisms: protected areas (national parks), Indigenous-led conservation (~50% global biodiversity Indigenous lands), ocean MPAs (marine protected areas), private conservation, agriculture compatible-with-biodiversity. International funding: Global Environment Facility (GEF), Green Climate Fund (GCF). Subsequent: Nature 2030 EU Biodiversity Strategy, Bonn Challenge forest restoration. Field 2024+ acid test biodiversity governance — implementation gap.'
          en: 'Half-Earth (E.O. Wilson "Half-Earth Our Planet Fight for Life" 2016): proposed setting aside half of Earth surface (land + ocean) for biodiversity conservation reserve mainstream species → ~85% biodiversity preserved. Influential — Wilson Harvard biology Half-Earth Project E.O. Wilson Foundation. Concurrent: Aichi Biodiversity Targets 2010-2020 (CBD Strategic Plan, mostly missed), Convention on Biological Diversity (CBD) Kunming-Montréal Global Biodiversity Framework December 2022 COP15 — ratified 30x30 (30% land + ocean protected by 2030), 30% restoration of degraded ecosystems, 50% reduction in risk from pesticides, 50% reduction in food waste, $20B/year conservation funding flow to developing countries by 2025+. Currently ~17% of land + ~10% of ocean protected. Achieving 30x30 is ambitious — requires global cooperation. Mechanisms: protected areas (national parks), Indigenous-led conservation (~50% of global biodiversity is on Indigenous lands), ocean MPAs (marine protected areas), private conservation, biodiversity-compatible agriculture. International funding: Global Environment Facility (GEF), Green Climate Fund (GCF). Subsequent: Nature 2030 EU Biodiversity Strategy, Bonn Challenge forest restoration. Field 2024+ acid test of biodiversity governance — implementation gap.'
