        rationale:
          pt: 'Climate-resilient agriculture biotech: imperative as ~25% global crop loss climate-attributable (FAO). Approaches: (1) Drought tolerance — DroughtGard maize Bayer (transgenic CspB cold shock protein from Bacillus subtilis 2011 launch USDA ARS-cooperator), CRISPR-edited drought-tolerant wheat (Cibus 2024+), AQUAmax Pioneer, sorghum drought genes ZmNF-YB Bayer. (2) Heat tolerance — HSPs (heat-shock proteins) overexpression, photosynthesis maintenance high temperatures, breeding for tropical varieties. (3) Salt tolerance — HKT1/HKT2 sodium transporter improved alleles rice (Sun Wang Liu Nat Plants 2014), barley HVA1/HsfA2 transgenic, Australian Triticum monococcum Nax loci wheat (Munns 2012 Nature Biotech). (4) Pest/disease resistance — CRISPR powdery mildew wheat (Caixia Gao 2014/2022), citrus greening resistance (Texas A&M), banana TR4 (Tropic Bioscience). (5) Crop diversification — cassava (CIAT), millet, fonio African indigenous crops. (6) Soil microbiome inoculation Pivot Bio nitrogen-fixing bacteria. (7) Vertical farming + controlled environment agriculture (Plenty, Bowery Farming) urban indoor. (8) Plant-microbe symbiosis engineering. Climate-Smart Agriculture initiative FAO 2010+. ~$50B annual climate-tech-ag investment 2023+.'
