        question:
          pt: Coral bleaching mechanism + assisted evolution (van Oppen AIMS 2015+) approach é…
          en: Coral bleaching mechanism + assisted evolution (van Oppen AIMS 2015+) approach is…
        choices:
          - Heat-stress induces expulsion of symbiotic Symbiodiniaceae algae (zooxanthellae) — assisted evolution selects/breeds heat-tolerant algal strains and host genotypes for reef restoration
          - Coral bleaching reverses naturally without intervention always
          - Pure mechanical reef restoration without biological component
          - Genetic engineering of corals only without symbiont focus
        correctAnswer: Heat-stress induces expulsion of symbiotic Symbiodiniaceae algae (zooxanthellae) — assisted evolution selects/breeds heat-tolerant algal strains and host genotypes for reef restoration
        rationale:
          pt: 'Coral bleaching: corals (Cnidaria, Anthozoa) host symbiotic algae Symbiodiniaceae (genus Symbiodinium, Cladocopium, Durusdinium) within tissue → photosynthesis provides ~95% energy to host. Heat stress (>~1-2°C above summer maximum sustained weeks) → break symbiosis → coral expel algae → loses pigmentation (white skeleton "bleached") + energy source → mortality if prolonged or no recovery. Recurrent bleaching events: GBR Great Barrier Reef Australia 1998, 2002, 2016, 2017, 2020, 2022, 2024 — 6/8 marine heatwave-driven bleaching events past decade. ~50% global coral cover lost 1957-2022. Subsequent: Madeleine van Oppen Australian Institute Marine Science (AIMS, Townsville) + Univ Melbourne — assisted evolution program: directed-evolution Symbiodinium heat tolerance laboratory (~20 generations selection for thermal stability), assisted gene flow (transplant warmer-tolerant southern colonies northward), hybrid breeding crosses across species, probiotic algae inoculation reefs. Limit: scale (~3500 km GBR), genetic adaptation slower climate change pace. Concurrent: Coral Restoration Foundation (Florida nurseries, fragmentation), Mote Marine Lab. Field 2024 active: cryopreservation gametes biobanking, AI image-based reef monitoring. Climate ultimate driver — emissions reduction critical.'
          en: 'Coral bleaching: corals (Cnidaria, Anthozoa) host symbiotic algae Symbiodiniaceae (genus Symbiodinium, Cladocopium, Durusdinium) within tissue → photosynthesis provides ~95% energy to host. Heat stress (>~1-2°C above summer maximum sustained for weeks) → breaks symbiosis → coral expels algae → loses pigmentation (white skeleton "bleached") + energy source → mortality if prolonged or no recovery. Recurrent bleaching events: GBR Great Barrier Reef Australia 1998, 2002, 2016, 2017, 2020, 2022, 2024 — 6/8 marine heatwave-driven bleaching events in past decade. ~50% of global coral cover lost 1957-2022. Subsequent: Madeleine van Oppen Australian Institute of Marine Science (AIMS, Townsville) + Univ Melbourne — assisted evolution program: directed evolution of Symbiodinium for heat tolerance in lab (~20 generations selection for thermal stability), assisted gene flow (transplant warmer-tolerant southern colonies northward), hybrid breeding crosses across species, probiotic algae inoculation of reefs. Limit: scale (~3500 km GBR), genetic adaptation slower than climate change pace. Concurrent: Coral Restoration Foundation (Florida nurseries, fragmentation), Mote Marine Lab. Field 2024 active: cryopreservation of gametes, biobanking, AI image-based reef monitoring. Climate is ultimate driver — emissions reduction critical.'
        objectives: [Coral bleaching assisted evolution]
