    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: C3 vs C4 vs CAM photosynthesis distinction é…
          en: C3 vs C4 vs CAM photosynthesis distinction is…
        choices:
          - C3 fixes CO2 via RuBisCO directly; C4 (maize, sugarcane) uses PEP carboxylase + Kranz anatomy concentrating CO2 around RuBisCO; CAM (cacti) opens stomata at night, fixing CO2 to malate
          - All plants use identical photosynthesis pathway with no variation
          - C4 plants lack chlorophyll and don't photosynthesize
          - CAM is exclusive to algae and absent in higher plants
        correctAnswer: C3 fixes CO2 via RuBisCO directly; C4 (maize, sugarcane) uses PEP carboxylase + Kranz anatomy concentrating CO2 around RuBisCO; CAM (cacti) opens stomata at night, fixing CO2 to malate
        rationale:
          pt: 'C3, C4, CAM photosynthesis variants: C3 (~95% plant species, includes rice, wheat, soybean) — RuBisCO directly fixes CO₂ → 3-PGA (3-phosphoglycerate, 3 carbons name origin). Limit: photorespiration (RuBisCO bind O₂ instead CO₂ ~25% time, costs ~30% efficiency hot dry climates). C4 (~3% species, ~25% terrestrial productivity, includes maize, sugarcane, sorghum, miscanthus) — CO₂ initially fixed PEP carboxylase mesophyll cells → C4 acid (oxaloacetate → malate) → transported bundle sheath cells (Kranz anatomy specialized concentric ring) → decarboxylated → high CO₂ concentration around RuBisCO suppress photorespiration. Adaptation hot/arid climates evolved ~30M years ago independently 60+ times. CAM (Crassulacean Acid Metabolism, ~7% species, includes cacti, succulents, pineapple, agave) — temporal separation: stomata open night → CO₂ fixed PEP carboxylase → store malate vacuoles → daytime stomata closed (water conservation desert) → decarboxylate malate → CO₂ released near RuBisCO. Trade-off: low growth rate, extreme water-use efficiency. C4 photosynthesis WUE (water-use efficiency) ~2-3x C3, intrinsic CO₂ concentration ~10x C3.'
          en: 'C3, C4, CAM photosynthesis variants: C3 (~95% of plant species, includes rice, wheat, soybean) — RuBisCO directly fixes CO₂ → 3-PGA (3-phosphoglycerate, 3 carbons name origin). Limit: photorespiration (RuBisCO binds O₂ instead of CO₂ ~25% of the time, costing ~30% efficiency in hot dry climates). C4 (~3% of species, ~25% of terrestrial productivity, includes maize, sugarcane, sorghum, miscanthus) — CO₂ initially fixed by PEP carboxylase in mesophyll cells → C4 acid (oxaloacetate → malate) → transported to bundle sheath cells (Kranz anatomy specialized concentric ring) → decarboxylated → high CO₂ concentration around RuBisCO suppresses photorespiration. Adaptation to hot/arid climates evolved ~30M years ago independently 60+ times. CAM (Crassulacean Acid Metabolism, ~7% of species, includes cacti, succulents, pineapple, agave) — temporal separation: stomata open at night → CO₂ fixed by PEP carboxylase → stored as malate in vacuoles → daytime stomata closed (water conservation in desert) → decarboxylate malate → CO₂ released near RuBisCO. Trade-off: low growth rate, extreme water-use efficiency. C4 photosynthesis WUE (water-use efficiency) ~2-3x C3, intrinsic CO₂ concentration ~10x C3.'
        objectives: [C3 C4 CAM photosynthesis]
      - type: choice
        difficulty: 5
        question:
          pt: C4 Rice project (IRRI, Bill & Melinda Gates Foundation 2008+) goal é…
          en: C4 Rice project (IRRI, Bill & Melinda Gates Foundation 2008+) goal is…
        choices:
          - Engineer rice (a C3 plant) with C4 photosynthesis pathway from maize/sugarcane to boost yields ~50% and increase nitrogen-use efficiency, with ongoing decade-scale work
          - Convert all maize to C3 photosynthesis
          - Pure agronomic improvement without genetics
          - Plants only with no agricultural target
        correctAnswer: Engineer rice (a C3 plant) with C4 photosynthesis pathway from maize/sugarcane to boost yields ~50% and increase nitrogen-use efficiency, with ongoing decade-scale work
        rationale:
          pt: 'C4 Rice project: International Rice Research Institute (IRRI Philippines) lead — Paul Quick, John Sheehy. Founded ~2008, Gates Foundation funded ~$15M+ initial. Premise: rice C3, ~50% lower theoretical yield potential vs C4 cousins (sorghum, maize). Engineering scale: requires anatomical changes (Kranz bundle sheath) + biochemical (PEP carboxylase, NADP-malic enzyme, decarboxylating system) + transcriptional regulation (multiple genes). Approach: incremental — install C4 pathway components one at time, validate each step. Achievements 2024: PEPC (PEP carboxylase) + NADP-ME (malic enzyme) overexpression rice (Karki von Caemmerer Quick Cell 2024 — partial pathway functional but Kranz anatomy challenge). Mestrada lab Stanford simultaneous research transfer factors anatomy. Concurrent: Single-cell C4 (Hydrilla, Bienertia) — natural C4 in single cell, simpler engineering target. Realistic timeline: 10-30 anos C4 rice ready commercial. Other ambitious crop projects: nitrogen-fixing cereals (Joyn Bio era, ENSA International Wheat Improvement Consortium 2014+).'
          en: 'C4 Rice project: International Rice Research Institute (IRRI Philippines) lead — Paul Quick, John Sheehy. Founded ~2008, Gates Foundation funded ~$15M+ initial. Premise: rice is C3, ~50% lower theoretical yield potential vs C4 cousins (sorghum, maize). Engineering scale: requires anatomical changes (Kranz bundle sheath) + biochemical (PEP carboxylase, NADP-malic enzyme, decarboxylating system) + transcriptional regulation (multiple genes). Approach: incremental — install C4 pathway components one at a time, validate each step. Achievements 2024: PEPC (PEP carboxylase) + NADP-ME (malic enzyme) overexpression in rice (Karki/Quick Cell 2024 — partial pathway functional but Kranz anatomy still a challenge). Stanford simultaneous research on anatomy transfer factors. Concurrent: Single-cell C4 (Hydrilla, Bienertia) — natural C4 in single cell, simpler engineering target. Realistic timeline: 10-30 years for C4 rice to be ready commercial. Other ambitious crop projects: nitrogen-fixing cereals (Joyn Bio era, ENSA International Wheat Improvement Consortium 2014+).'
        objectives: [C4 Rice IRRI]
      - type: choice
        difficulty: 5
        question:
          pt: Golden Rice (Potrykus/Beyer Science 2000 → Philippines 2021 commercial approval) é…
          en: Golden Rice (Potrykus/Beyer Science 2000 → Philippines 2021 commercial approval) is…
        choices:
          - Genetically engineered rice expressing β-carotene biosynthesis genes (psy + crtI) producing pro-vitamin A in endosperm to combat childhood blindness in deficient populations
          - Standard rice without modifications
          - Yellow-pigmented rice from natural mutation
          - Pure vitamin supplementation without genetic engineering
        correctAnswer: Genetically engineered rice expressing β-carotene biosynthesis genes (psy + crtI) producing pro-vitamin A in endosperm to combat childhood blindness in deficient populations
        rationale:
          pt: 'Golden Rice: Ingo Potrykus ETH Zürich + Peter Beyer Univ Freiburg Science 2000 first prototype. Engineering: rice endosperm normally lacks β-carotene synthesis (lycopene/β-carotene biosynthesis blocked) → introduce phytoene synthase (psy from daffodil/maize) + carotene desaturase (crtI from Erwinia bacterium) → reactive lycopene synthesis pathway → endogenous lycopene cyclase converts → β-carotene (pro-vitamin A precursor) → grains glow golden-yellow. Goal: address vitamin A deficiency (~250M children worldwide, ~half million blindness/year, increased mortality infectious disease). Golden Rice 2 (Beyer 2005) — improved psy version maize ~23x β-carotene. Regulatory ~20-year delay due opposition Greenpeace + activist groups. Approvals: Australia/NZ/USA/Canada food safety 2018 (sem cultivation). Bangladesh 2021 cultivation aprovado. Philippines 2021 first country plantação commercial. Adoption modest 2024+ — patient education, supply chain. Symbolic significance: GMO controversy, biofortification approach replication followed (iron, zinc, folate biofortified varieties developed HarvestPlus).'
          en: 'Golden Rice: Ingo Potrykus ETH Zürich + Peter Beyer Univ Freiburg Science 2000 first prototype. Engineering: rice endosperm normally lacks β-carotene synthesis (lycopene/β-carotene biosynthesis blocked) → introduce phytoene synthase (psy from daffodil/maize) + carotene desaturase (crtI from Erwinia bacterium) → reactivates lycopene synthesis pathway → endogenous lycopene cyclase converts → β-carotene (pro-vitamin A precursor) → grains glow golden-yellow. Goal: address vitamin A deficiency (~250M children worldwide, ~half million blindness/year, increased mortality from infectious disease). Golden Rice 2 (Beyer 2005) — improved psy version from maize gives ~23x β-carotene. Regulatory ~20-year delay due to opposition from Greenpeace + activist groups. Approvals: Australia/NZ/USA/Canada food safety 2018 (without cultivation). Bangladesh 2021 cultivation approved. Philippines 2021 first country to plant commercially. Adoption modest 2024+ — patient education, supply chain. Symbolic significance: GMO controversy; the biofortification approach was replicated (iron, zinc, folate biofortified varieties developed by HarvestPlus).'
        objectives: [Golden Rice]
      - type: choice
        difficulty: 5
        question:
          pt: CRISPR powdery mildew-resistant wheat (Wang Liu Caixia Gao Nat Biotech 2014, 2022) é…
          en: CRISPR powdery mildew-resistant wheat (Wang/Liu/Caixia Gao Nat Biotech 2014, 2022) is…
        choices:
          - CRISPR knockout of three TaMLO-A1/B1/D1 alleles in hexaploid wheat producing recessive resistance to powdery mildew without yield penalty in 2022 follow-up
          - First Bt-toxin transgenic wheat for insect resistance
          - Standard fungicide application without breeding
          - Hybrid breeding without molecular tools
        correctAnswer: CRISPR knockout of three TaMLO-A1/B1/D1 alleles in hexaploid wheat producing recessive resistance to powdery mildew without yield penalty in 2022 follow-up
        rationale:
          pt: 'CRISPR powdery mildew-resistant wheat (Caixia Gao Chinese Academy Sciences Beijing): Wang Cheng Wang Yuan Wang Tao Wang Wang Mao Liu Gao Nat Biotech 2014 — first CRISPR-Cas9 multiplex knockout three MLO (Mildew Resistance Locus O) genes hexaploid wheat (Triticum aestivum has 3 sub-genomes A/B/D, total 6 alleles MLO). Resulting plants resistant Blumeria graminis powdery mildew. Approach validated barley MLO-recessive resistance (Jorgensen 1992). Initial 2014 result: significant yield penalty due MLO knockout pleiotropic. Follow-up: Li Zhang Tao Lu Wang Liu Sun Liu Gao Nature 2022 — refined approach. Triple-knockout taa-mlo wheat sem yield penalty (chromosomal translocation re-arranged adjacent gene compensation). Important: CRISPR-edited (não transgenic — sem foreign DNA inserted) → could classify regulatory non-GMO some countries (EU 2024 propôs new genomic techniques NGT framework relaxing CRISPR-edited crops, USA ruled non-regulated 2018 USDA). Concurrent crop CRISPR: cassava brown streak resistance (Innovative Genomics Institute IGI), banana TR4 Panama disease (Tropic Bioscience), soybean low-saturated-fat (Calyno marketed 2019), citrus greening resistance.'
          en: 'CRISPR powdery mildew-resistant wheat (Caixia Gao Chinese Academy Sciences Beijing): Wang/Gao Nat Biotech 2014 — first CRISPR-Cas9 multiplex knockout of three MLO (Mildew Resistance Locus O) genes in hexaploid wheat (Triticum aestivum has 3 sub-genomes A/B/D, total 6 MLO alleles). Resulting plants are resistant to Blumeria graminis powdery mildew. Approach validated by barley MLO-recessive resistance (Jorgensen 1992). Initial 2014 result: significant yield penalty due to pleiotropic MLO knockout. Follow-up: Li/Gao Nature 2022 — refined approach. Triple-knockout taa-mlo wheat without yield penalty (chromosomal translocation re-arranged adjacent gene compensation). Important: CRISPR-edited (not transgenic — no foreign DNA inserted) → could be classified non-GMO in some countries (EU 2024 proposed new genomic techniques NGT framework relaxing CRISPR-edited crops, USA ruled non-regulated 2018 USDA). Concurrent crop CRISPR: cassava brown streak resistance (Innovative Genomics Institute IGI), banana TR4 Panama disease (Tropic Bioscience), soybean low-saturated-fat (Calyno marketed 2019), citrus greening resistance.'
        objectives: [CRISPR mildew-resistant wheat]
      - type: choice
        difficulty: 5
        question:
          pt: Plant immune system NLR receptors (Jones/Dangl 2006 Cell) function é…
          en: Plant immune system NLR receptors (Jones/Dangl 2006 Cell) function is…
        choices:
          - Intracellular NB-LRR (NLR) receptors detect pathogen effectors triggering ETI (effector-triggered immunity) hypersensitive response, complementing surface PRR-based PTI
          - Plants lack any immune system
          - Identical to mammalian adaptive immune system
          - Pure mechanical defense without molecular receptors
        correctAnswer: Intracellular NB-LRR (NLR) receptors detect pathogen effectors triggering ETI (effector-triggered immunity) hypersensitive response, complementing surface PRR-based PTI
        rationale:
          pt: 'Plant immunity zigzag model (Jones Dangl Nature 2006): two-tier defense. PTI (Pattern-Triggered Immunity) — surface PRRs (Pattern Recognition Receptors, transmembrane LRR-RLK kinases like FLS2, EFR) detect PAMPs (Pathogen-Associated Molecular Patterns: flagellin flg22, EF-Tu peptide, chitin) → MAPK cascade → moderate defense. Pathogens secrete effectors → suppress PTI. ETI (Effector-Triggered Immunity) — intracellular NLR (Nucleotide-binding LRR Leucine-Rich Repeat receptors, ~150 in Arabidopsis ~600 wheat) detect effectors directly or indirectly (guard hypothesis — monitor effector targets) → trigger HR (Hypersensitive Response, programmed cell death restrict pathogen) + SAR (Systemic Acquired Resistance). NLR families: TIR-NLR (TIR domain N-terminal, Toll-IL1R-like), CC-NLR (coiled-coil), CC-NLRR. Major progress 2010s+: NLR resistosomes (Jian-Min Zhou Beijing + Sophien Kamoun Sainsbury Norwich + Jeffery Dangl UNC) — direct visualization NLR oligomers ZAR1 calcium channel (Wang/Wang/Hu Science 2019 cryo-EM resistosome). Plant biotech: NLR engineering (transferring NLRs across species), biotech-modified rice resistance, durable bread wheat stem rust UG99 strain.'
          en: 'Plant immunity zigzag model (Jones/Dangl Nature 2006): two-tier defense. PTI (Pattern-Triggered Immunity) — surface PRRs (Pattern Recognition Receptors, transmembrane LRR-RLK kinases like FLS2, EFR) detect PAMPs (Pathogen-Associated Molecular Patterns: flagellin flg22, EF-Tu peptide, chitin) → MAPK cascade → moderate defense. Pathogens secrete effectors → suppress PTI. ETI (Effector-Triggered Immunity) — intracellular NLR (Nucleotide-binding LRR receptors, ~150 in Arabidopsis ~600 in wheat) detect effectors directly or indirectly (guard hypothesis — monitor effector targets) → trigger HR (Hypersensitive Response, programmed cell death restricting pathogen) + SAR (Systemic Acquired Resistance). NLR families: TIR-NLR (TIR domain N-terminal, Toll-IL1R-like), CC-NLR (coiled-coil), CC-NLRR. Major progress 2010s+: NLR resistosomes — direct visualization of NLR oligomers ZAR1 calcium channel (Wang Science 2019 cryo-EM resistosome). Plant biotech: NLR engineering (transferring NLRs across species), biotech-modified rice resistance, durable bread wheat stem rust UG99 strain.'
        objectives: [Plant NLR immunity]
      - type: choice
        difficulty: 5
        question:
          pt: Mycorrhizal symbiosis (Rhizophagus irregularis arbuscular AM) impacto é…
          en: Mycorrhizal symbiosis (Rhizophagus irregularis arbuscular AM) impact is…
        choices:
          - ~80-90% of land plants partner with mycorrhizal fungi exchanging photosynthate for soil-derived phosphorus, water, and nitrogen, fundamental for ecosystem productivity and crop nutrition
          - Plants self-sufficient without any fungal partnerships
          - Pure parasitic relationships without mutualism
          - Limited to a few exotic plant species
        correctAnswer: ~80-90% of land plants partner with mycorrhizal fungi exchanging photosynthate for soil-derived phosphorus, water, and nitrogen, fundamental for ecosystem productivity and crop nutrition
        rationale:
          pt: 'Mycorrhizal symbiosis (Greek "myco-" fungus + "rhizo-" root): ~80-90% terrestrial plant species partner mycorrhizal fungi. Two major types: AM (Arbuscular Mycorrhizae, Glomeromycota fungi like Rhizophagus irregularis, Funneliformis) — most plants; ECM (Ectomycorrhizae, Basidiomycota / Ascomycota) — temperate trees pinus, oaks, Boletus partner. Mechanism: fungal hyphae enter plant root cortex → form arbuscules (AM, branched intracellular structures site nutrient exchange) ou Hartig net (ECM, intercellular sheath). Plant supplies photosynthate ~10-20% (sugar fatty acids); fungi supply phosphorus (extending root absorptive surface 100-1000x), nitrogen, water, micronutrients (Zn, Cu). Ancient: ~450M years coevolution (Devonian period plants-fungi colonization land simultaneous). Toby Kiers SPUN (Society for the Protection of Underground Networks) — global mycorrhizal mapping initiative 2021+, conservation. Suzanne Simard "wood wide web" book 2021 — networks share resources, defense signals, plants. Agricultural: AMF inoculants (Mycorrise, AgriLife Mycorrhizal Applications) commercially available — improved P uptake, drought tolerance, ~10-30% yield gains some crops. Engineering: NSP1/NSP2 GRAS factors core AM-PGN (plant-microbe genetics network) module. Field 2024 expanding climate-soil-microbiome interactions.'
          en: 'Mycorrhizal symbiosis (Greek "myco-" fungus + "rhizo-" root): ~80-90% of terrestrial plant species partner with mycorrhizal fungi. Two major types: AM (Arbuscular Mycorrhizae, Glomeromycota fungi like Rhizophagus irregularis, Funneliformis) — most plants; ECM (Ectomycorrhizae, Basidiomycota/Ascomycota) — temperate trees pinus, oaks, Boletus partner. Mechanism: fungal hyphae enter plant root cortex → form arbuscules (AM, branched intracellular structures, site of nutrient exchange) or Hartig net (ECM, intercellular sheath). Plant supplies photosynthate ~10-20% (sugar, fatty acids); fungi supply phosphorus (extending root absorptive surface 100-1000x), nitrogen, water, micronutrients (Zn, Cu). Ancient: ~450M years of coevolution (Devonian period plants-fungi colonization of land simultaneous). Toby Kiers SPUN (Society for the Protection of Underground Networks) — global mycorrhizal mapping initiative 2021+, conservation. Suzanne Simard "wood wide web" book 2021 — networks share resources, defense signals between plants. Agricultural: AMF inoculants (Mycorrise, AgriLife Mycorrhizal Applications) commercially available — improved P uptake, drought tolerance, ~10-30% yield gains in some crops. Engineering: NSP1/NSP2 GRAS factors are core AM-PGN (plant-microbe genetics network) module. Field 2024 expanding into climate-soil-microbiome interactions.'
        objectives: [Mycorrhizal symbiosis]
      - type: choice
        difficulty: 5
        question:
          pt: Plant pan-genome (rice Oryza sativa Nature Genetics 2018+ → maize Hufford Genome Biol 2024) é…
          en: Plant pan-genome (rice Oryza sativa Nature Genetics 2018+ → maize Hufford Genome Biol 2024) is…
        choices:
          - Multi-accession reference assemblies revealing core + dispensable gene sets and structural variation absent from single reference, key for identifying breeding-relevant alleles
          - Single linear reference identical for all individuals
          - Bulk SNP catalog without long-range haplotype information
          - Pure modern variety without ancient varieties
        correctAnswer: Multi-accession reference assemblies revealing core + dispensable gene sets and structural variation absent from single reference, key for identifying breeding-relevant alleles
        rationale:
          pt: 'Plant pan-genomics: address single-reference bias hide structural diversity. Rice Oryza sativa pan-genome (Wang Mauleon Hu Tang Tan Xie Yang Wang Liu Hu Zhao Zhu Wang Wing Han Sun Hu Liu Liu Shi Wang Zhuang Naredla Yu Xie Sang Yu Liu Lin Han Han Pan Han Han Wang Cell 2018 → 33 genome assembly collection — superpangenome). Maize pan-genome (Hufford Seetharam Mei Romay Medina-Chavez O''Malley Vásquez-Hsia Liu Boren Shrestha Cosby Kraskoff Hu Bowman Crescioli Trauer Whittaker McMullen Han Borba Garcia Sun Chen Wisser Peters Sun Zhao Lipka Mosier Joao Romay Tarter Medina-Cas Pasanivu Liu Jin Ouyang Yang Zhang Liu Hu Lin Liu Lin Hu Genome Biol 2024 26 NAM founder genomes). Soybean pan-genome (Liu Wang Du Tian He Wu Wang Yan Wang Liu Liu Cheng Yu Yu Cui Cao Sun Liu Shi Sun Tang Pan Liu Wang Han Wang Genome Biol 2020). Findings: ~50-60% genes "core" present all accessions, ~40-50% "dispensable" present subset → many genes recently gained/lost lineage-specific. Structural variants (insertions, deletions, inversions, copy-number variation) extensive single-reference assembly miss. Aplicações: breeding (identify alleles unique landraces ou wild relatives), trait mapping, disease resistance loci, climate adaptation. Concurrent: T2T (telomere-to-telomere) plant assemblies — rice Hu 2024 maize Liu 2024 banana 2023 Arabidopsis 2024.'
          en: 'Plant pan-genomics: address single-reference bias hiding structural diversity. Rice Oryza sativa pan-genome (Wang Cell 2018 → 33-genome assembly collection — superpangenome). Maize pan-genome (Hufford Genome Biol 2024 26 NAM founder genomes). Soybean pan-genome (Liu Genome Biol 2020). Findings: ~50-60% of genes are "core" present in all accessions, ~40-50% "dispensable" present in subset → many genes recently gained/lost in lineage-specific manner. Structural variants (insertions, deletions, inversions, copy-number variation) extensive — single-reference assembly misses. Applications: breeding (identify alleles unique to landraces or wild relatives), trait mapping, disease resistance loci, climate adaptation. Concurrent: T2T (telomere-to-telomere) plant assemblies — rice Hu 2024, maize Liu 2024, banana 2023, Arabidopsis 2024.'
        objectives: [Plant pan-genomes]
      - type: choice
        difficulty: 5
        question:
          pt: Plant circadian clock (Mizuno + Steve Kay 1998+) impact é…
          en: Plant circadian clock (Mizuno + Steve Kay 1998+) impact is…
        choices:
          - ~24-hour transcriptional feedback loop coordinating photosynthesis, growth, flowering, and stress responses with daily light cycles, with genes like CCA1/LHY/TOC1/PRR
          - Plants lack circadian rhythms entirely
          - Identical mammalian clock genes without plant-specific components
          - Pure metabolic oscillation without transcriptional control
        correctAnswer: ~24-hour transcriptional feedback loop coordinating photosynthesis, growth, flowering, and stress responses with daily light cycles, with genes like CCA1/LHY/TOC1/PRR
        rationale:
          pt: 'Plant circadian clock: ~24h transcriptional autoregulatory loop entrained by light/temperature inputs. Core: morning-expressed CCA1 (CIRCADIAN CLOCK ASSOCIATED 1) + LHY (LATE ELONGATED HYPOCOTYL) MYB transcription factors → repress evening genes including TOC1 (TIMING OF CAB EXPRESSION 1). Evening: TOC1 + PRRs (PSEUDO-RESPONSE REGULATORS PRR5/7/9) → repress CCA1/LHY → cycle 24h. Outputs: ~30% Arabidopsis genes circadian-regulated → photosynthesis enzymes peak morning, defense compounds night, flowering time gating photoperiod (CONSTANS+FT florigen pathway), stress response. Pioneer: Steve Kay Univ Pennsylvania → Scripps Research → USC; Andrew Millar UK. Cyanobacteria simpler oscillator KaiABC (Kondo Iwasaki Kageyama Imai Furuya Murayama Murayama Onai Uzumaki Sasai Iwasaki Murayama Imai Iwasaki Saigusa Onai Uchiyama Murayama Hori Kondo). Crop circadian engineering: tomato breeding selected weakened clock CCA1/LHY → benefit greenhouse continuous light. Clock-aware breeding emerging 2024+. Plant circadian disrupts pollination timing, bee/pollinator activity, climate change phenology shifts. Field active medicine relevance — chronotherapy plants applications agricultural systems chronobiology.'
          en: 'Plant circadian clock: ~24h transcriptional autoregulatory loop entrained by light/temperature inputs. Core: morning-expressed CCA1 (CIRCADIAN CLOCK ASSOCIATED 1) + LHY (LATE ELONGATED HYPOCOTYL) MYB transcription factors → repress evening genes including TOC1 (TIMING OF CAB EXPRESSION 1). Evening: TOC1 + PRRs (PSEUDO-RESPONSE REGULATORS PRR5/7/9) → repress CCA1/LHY → cycle 24h. Outputs: ~30% of Arabidopsis genes are circadian-regulated → photosynthesis enzymes peak in morning, defense compounds at night, flowering time gating by photoperiod (CONSTANS+FT florigen pathway), stress response. Pioneer: Steve Kay Univ Pennsylvania → Scripps Research → USC; Andrew Millar UK. Cyanobacteria have simpler oscillator KaiABC. Crop circadian engineering: tomato breeding selected weakened clock CCA1/LHY → benefit in greenhouse continuous light. Clock-aware breeding emerging 2024+. Plant circadian disrupts pollination timing, bee/pollinator activity, climate change phenology shifts. Field active in medicine relevance — chronotherapy plants applications agricultural systems chronobiology.'
        objectives: [Plant circadian clock]
      - type: choice
        difficulty: 5
        question:
          pt: De novo domestication CRISPR (Zsögön Peres Kudla Cell 2018 ground cherry/wild tomato) é…
          en: De novo domestication CRISPR (Zsögön/Peres/Kudla Cell 2018 ground cherry / wild tomato) is…
        choices:
          - CRISPR multiplex editing of wild-relative species at known domestication loci, recreating cultivar-like traits within one generation while retaining wild stress tolerance
          - Backcrossing only without molecular tools
          - Pure transgenic approach without editing
          - Domestication occurring exclusively over millennia of natural selection
        correctAnswer: CRISPR multiplex editing of wild-relative species at known domestication loci, recreating cultivar-like traits within one generation while retaining wild stress tolerance
        rationale:
          pt: 'De novo domestication via CRISPR: Lemmon Jiang Hou Cui Tian Vento-Tormo Liu Wang Zhou Lemmon Eshed Cui Lippman Cell 2018 — Solanum pimpinellifolium (wild tomato relative, smaller fruits, more disease resistance) → CRISPR multiplex editing six loci known domestication: SP (SELF-PRUNING determinate growth), CLV3 (compact inflorescences), SP5G (photoperiod-insensitive flowering), MULT (fruit size), GLK2 (chlorophyll/fruit color), LYC (lycopene/red color). Result: domesticated-cultivar-like phenotype within ~1 generation while retaining wild traits stress tolerance. Concurrent: Zsögön Cermák Naves Notini Edel Aono Conti Niedz Reem Kuhle Filgueiras Lima Mello Peres Voytas Nat Biotech 2018 — similar approach Solanum pimpinellifolium. Vision: harness genetic diversity ~250000 wild plant species (~few hundred actually domesticated humanity history) → build new crops adapted local environments / climate change. Subsequent: ground cherry (Physalis pruinosa, Lemmon 2018), Acca sellowiana, prickly pear, others. Implications climate adaptation biodiversity. Limit: domestication complex, multiple compounding loci, incomplete trait recovery. Field active 2024 IGI (Innovative Genomics Institute) Doudna lab + Lippman CSHL.'
          en: 'De novo domestication via CRISPR: Lemmon/Lippman Cell 2018 — Solanum pimpinellifolium (wild tomato relative, smaller fruits, more disease resistance) → CRISPR multiplex editing of six loci known for domestication: SP (SELF-PRUNING determinate growth), CLV3 (compact inflorescences), SP5G (photoperiod-insensitive flowering), MULT (fruit size), GLK2 (chlorophyll/fruit color), LYC (lycopene/red color). Result: domesticated-cultivar-like phenotype within ~1 generation while retaining wild stress-tolerance traits. Concurrent: Zsögön/Peres Nat Biotech 2018 — similar approach in Solanum pimpinellifolium. Vision: harness genetic diversity in ~250000 wild plant species (~few hundred actually domesticated through humanity history) → build new crops adapted to local environments / climate change. Subsequent: ground cherry (Physalis pruinosa, Lemmon 2018), Acca sellowiana, prickly pear, others. Implications for climate adaptation and biodiversity. Limit: domestication is complex, multiple compounding loci, incomplete trait recovery. Field active 2024 — IGI (Innovative Genomics Institute) Doudna lab + Lippman CSHL.'
        objectives: [De novo domestication]
