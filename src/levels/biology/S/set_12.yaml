        question:
          pt: Anthropocene defaunation (Dirzo Science 2014, Living Planet Report 2022) é…
          en: Anthropocene defaunation (Dirzo Science 2014, Living Planet Report 2022) is…
        choices:
          - Documented ~70% decline in monitored vertebrate populations since 1970 due to habitat loss, climate change, overexploitation, and pollution, signaling sixth mass extinction
          - Modest <5% decline of stable populations
          - Pure climate change without biodiversity component
          - Increase in vertebrate populations globally
        correctAnswer: Documented ~70% decline in monitored vertebrate populations since 1970 due to habitat loss, climate change, overexploitation, and pollution, signaling sixth mass extinction
        rationale:
          pt: 'Anthropocene defaunation / sixth mass extinction: Dirzo Young Galetti Ceballos Isaac Collen Science 2014 "Defaunation in the Anthropocene". WWF Living Planet Index Report 2022/2024: ~73% decline monitored vertebrate populations 1970-2020 (mammals, birds, fish, amphibians, reptiles). Latin America/Caribbean ~94% decline (worst). Drivers: (1) habitat loss/degradation (deforestation Amazon, agricultural expansion), (2) overexploitation (overfishing, hunting, illegal wildlife trade), (3) climate change (range shifts, phenology mismatch, bleaching), (4) pollution (plastic, pesticides, light/noise), (5) invasive species. IPBES (Intergovernmental Science-Policy Platform on Biodiversity Ecosystem Services) 2019 Global Assessment Report: ~1M species threatened extinction global. Background extinction rate ~1 species/million species/year; current ~100-1000x higher Cellular sixth mass extinction. Historical mass extinctions: End-Permian (~252 Ma, ~96% marine species), End-Cretaceous (~66 Ma asteroid Chicxulub, dinosaurs except birds). Conservation responses: protected areas (~17% land 2024 toward 30x30 30% by 2030 target Convention Biological Diversity), rewilding (Knepp Estate UK, Yellowstone wolf reintroduction 1995), genome rescue (mammoth/Tasmanian tiger Colossal Biosciences), assisted migration. Field 2024 active emergency.'
          en: 'Anthropocene defaunation / sixth mass extinction: Dirzo Science 2014 "Defaunation in the Anthropocene". WWF Living Planet Index Report 2022/2024: ~73% decline in monitored vertebrate populations 1970-2020 (mammals, birds, fish, amphibians, reptiles). Latin America/Caribbean ~94% decline (worst). Drivers: (1) habitat loss/degradation (deforestation Amazon, agricultural expansion), (2) overexploitation (overfishing, hunting, illegal wildlife trade), (3) climate change (range shifts, phenology mismatch, bleaching), (4) pollution (plastic, pesticides, light/noise), (5) invasive species. IPBES (Intergovernmental Science-Policy Platform on Biodiversity Ecosystem Services) 2019 Global Assessment Report: ~1M species threatened with extinction globally. Background extinction rate ~1 species/million species/year; current ~100-1000x higher — sixth mass extinction. Historical mass extinctions: End-Permian (~252 Ma, ~96% marine species), End-Cretaceous (~66 Ma asteroid Chicxulub, dinosaurs except birds). Conservation responses: protected areas (~17% of land 2024 toward 30x30 30% by 2030 target Convention on Biological Diversity), rewilding (Knepp Estate UK, Yellowstone wolf reintroduction 1995), genome rescue (mammoth/Tasmanian tiger Colossal Biosciences), assisted migration. Field 2024 active emergency.'
        objectives: [Defaunation Anthropocene]
