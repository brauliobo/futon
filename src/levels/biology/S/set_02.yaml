title:
  pt: Longevidade e Geroscience
  en: Longevity and Geroscience
level: S
subject: biology
objectives:
  - Compreender hallmarks of aging
  - Reconhecer senolytics, NAD+ precursors
  - Identificar partial reprogramming Yamanaka
  - Avaliar TAME, rapamycin, metformin
difficulty: 5
authorNotes: |
  Geroscience. Lopez-Otin Hallmarks of Aging 2013/2023 (12 hallmarks). Kirkland senolytics
  D+Q. Sinclair NAD+ NMN/NR. Yamanaka partial reprogramming Salk/Belmonte 2016, Altos Labs.
  TAME metformin (Barzilai). Rapamycin Mannick PEARL. Ora Biomedical NewLimit, Calico, Retro Bio.
example:
  question:
    pt: Em "Hallmarks of Aging" (López-Otín et al, Cell 2013, atualizado 2023), os hallmarks integrative drivers incluem…
    en: In "Hallmarks of Aging" (López-Otín et al, Cell 2013, updated 2023), the integrative driver hallmarks include…
  choices:
    - Stem cell exhaustion, altered intercellular communication, chronic inflammation, dysbiosis (12 hallmarks total in 2023)
    - Two universal hallmarks (telomere shortening + somatic mutation) without integrative or interconnected drivers
    - Strict separation of mitochondrial and nuclear aging without crosstalk between cellular compartments
    - Single mechanistic root cause (oxidative stress) explaining all observed aging phenotypes uniformly
  correctAnswer: Stem cell exhaustion, altered intercellular communication, chronic inflammation, dysbiosis (12 hallmarks total in 2023)
  rationale:
    pt: 'López-Otín hallmarks framework Cell 2013, atualizado 2023 (12 hallmarks): primary (genomic instability, telomere attrition, epigenetic alterations, loss of proteostasis, disabled macroautophagy), antagonistic (deregulated nutrient-sensing, mitochondrial dysfunction, cellular senescence), integrative (stem cell exhaustion, altered intercellular communication, chronic inflammation, dysbiosis). Provides taxonomy aging research. Cada hallmark interventional target. Geroscience hypothesis: targeting aging biology delay multiple age-related diseases simultaneously.'
    en: 'López-Otín hallmarks framework Cell 2013, updated 2023 (12 hallmarks): primary (genomic instability, telomere attrition, epigenetic alterations, loss of proteostasis, disabled macroautophagy), antagonistic (deregulated nutrient-sensing, mitochondrial dysfunction, cellular senescence), integrative (stem cell exhaustion, altered intercellular communication, chronic inflammation, dysbiosis). Provides taxonomy of aging research. Each hallmark is an interventional target. Geroscience hypothesis: targeting aging biology delays multiple age-related diseases simultaneously.'
passCriteria:
  minAccuracyPercent: 85
