        rationale:
          pt: 'FINGER (Finnish Geriatric Intervention Study to Prevent Cognitive Impairment and Disability) 2015 Lancet Ngandu/Kivipelto Karolinska: 2-year multidomain intervention ~1260 at-risk older Finns (60-77y, CAIDE risk score). Components: dietary counseling (Nordic diet), physical exercise, cognitive training, vascular risk management. Outcome: improved global cognition (NTB) vs control. Replication: World-Wide FINGERS network 50+ countries (US-POINTER, MIND-CHINA, MAPT, Singapore-FINGERS, etc.). LATAM-FINGERS Brazil. World-FINGER Studies. SPRINT-MIND blood pressure intensive (NEJM 2019) reduced MCI. ACTIVE cognitive training. Lifestyle multidomain emerging consensus dementia prevention. APOE4 modulates response.'
