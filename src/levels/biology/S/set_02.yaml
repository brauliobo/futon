pages:
  - title:
      pt: Página 1 — Mecanismos + Senolytics
      en: Page 1 — Mechanisms + Senolytics
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Cellular senescence (Hayflick limit 1961, Campisi/Serrano modern) é caracterizada por…
          en: Cellular senescence (Hayflick limit 1961, Campisi/Serrano modern) is characterized by…
        choices:
          - Permanent cell-cycle arrest with SASP secretion (IL-6, IL-8, MMPs); accumulates with age driving tissue dysfunction
          - Reversible quiescence resolved within 24-48h by removing the triggering stimulus
          - Apoptotic cell death with rapid clearance by macrophages and no paracrine signaling
          - Stem-cell-like dedifferentiation enabling indefinite self-renewal in tissues
        correctAnswer: Permanent cell-cycle arrest with SASP secretion (IL-6, IL-8, MMPs); accumulates with age driving tissue dysfunction
        rationale:
          pt: 'Cellular senescence: stable cell-cycle arrest induzido por telomere shortening (replicative), DNA damage, oncogene activation, ou stress. Hayflick limit 1961 fibroblasts ~50 divisions. SASP (Senescence-Associated Secretory Phenotype): IL-6, IL-8, MMPs, growth factors → paracrine inflammation, fibrosis, cancer. Accumulate com age — INK4a/ARF p16 marker. Beneficial: tumor suppression, wound healing. Detrimental: chronic — drives "inflammaging". Senolytics target. Campisi/UCSF Buck, Serrano CNIO/IRB, van Deursen Mayo seminal work.'
          en: 'Cellular senescence: stable cell-cycle arrest induced by telomere shortening (replicative), DNA damage, oncogene activation, or stress. Hayflick limit 1961 fibroblasts ~50 divisions. SASP (Senescence-Associated Secretory Phenotype): IL-6, IL-8, MMPs, growth factors → paracrine inflammation, fibrosis, cancer. Accumulates with age — INK4a/ARF p16 marker. Beneficial: tumor suppression, wound healing. Detrimental: chronic — drives "inflammaging". Senolytics target. Campisi/UCSF Buck, Serrano CNIO/IRB, van Deursen Mayo seminal work.'
        objectives: [Senescence]
      - type: choice
        difficulty: 5
        question:
          pt: Em senolytics, primeiro combo demonstrado em humanos foi…
          en: In senolytics, the first combination demonstrated in humans was…
        choices:
          - Dasatinib + quercetin (D+Q) — Kirkland Mayo Clinic Phase 1 IPF (idiopathic pulmonary fibrosis) 2019; intermittent dosing
          - Lifelong daily metformin monotherapy as the primary senescent-cell-clearing agent
          - Single-dose chemotherapy (cyclophosphamide) repurposed for selective senescent-cell elimination
          - Continuous infusion of recombinant interleukin-2 to drive immune-mediated clearance
        correctAnswer: Dasatinib + quercetin (D+Q) — Kirkland Mayo Clinic Phase 1 IPF (idiopathic pulmonary fibrosis) 2019; intermittent dosing
        rationale:
          pt: 'Senolytics: drugs killing senescent cells selectively. Discovery Kirkland/Tchkonia Mayo Clinic 2015 EBioMedicine — bioinformatics screen senescent-cell anti-apoptotic pathways (SCAPs). D+Q combo: dasatinib (Sprycel BCR-ABL TKI) + quercetin (flavonoid). Clinical: IPF Phase 1 2019, DKD diabetic kidney disease 2020. Intermittent dosing (hit-and-run). Concorrentes: navitoclax (Bcl-2/Bcl-xL Servier), UBX0101 (Unity descontinuou knee 2020), foxo4-DRI peptide. Limited approved senolytics. Field early stage clinically.'
          en: 'Senolytics: drugs selectively killing senescent cells. Discovery Kirkland/Tchkonia Mayo Clinic 2015 EBioMedicine — bioinformatics screen for senescent-cell anti-apoptotic pathways (SCAPs). D+Q combo: dasatinib (Sprycel BCR-ABL TKI) + quercetin (flavonoid). Clinical: IPF Phase 1 2019, DKD diabetic kidney disease 2020. Intermittent dosing (hit-and-run). Competitors: navitoclax (Bcl-2/Bcl-xL Servier), UBX0101 (Unity discontinued knee 2020), foxo4-DRI peptide. Limited approved senolytics. Field early-stage clinically.'
        objectives: [Senolytics D+Q]
      - type: choice
        difficulty: 5
        question:
          pt: NAD+ precursors NMN (nicotinamide mononucleotide) e NR (nicotinamide riboside) são populares supplements baseado em…
          en: NAD+ precursors NMN (nicotinamide mononucleotide) and NR (nicotinamide riboside) are popular supplements based on…
        choices:
          - Mouse longevity + healthspan data (Sinclair, Imai); human RCT data limited and mixed (modest metabolic improvements only)
          - Robust phase 3 randomized human trial data showing clear lifespan extension
          - Genetic engineering studies in primates demonstrating direct rescue of aging phenotypes
          - Centenarian observational studies showing universal high NAD+ levels in long-lived individuals
        correctAnswer: Mouse longevity + healthspan data (Sinclair, Imai); human RCT data limited and mixed (modest metabolic improvements only)
        rationale:
          pt: 'NAD+ declines com age. Sinclair (Harvard), Imai (WashU): mouse studies NMN/NR oral supplementation → healthspan benefits (mitochondrial function, metabolic, exercise capacity). NMN: ChromaDex Tru Niagen (NR), Elysium Health Basis, MetroBiotech MIB-626 NMN Phase 2. Human RCTs (Yoshino 2021 Sci, Mills 2016): well-tolerated, modest metabolic improvements, no clear longevity. FDA NMN regulatory ambiguity 2022 (declared não-supplement). Sinclair "Lifespan" book popularized. Critics: marketing ahead evidence. Trials ongoing — NIA, NIH supplements. Underpinning sirtuin biology Sinclair/Guarente.'
          en: 'NAD+ declines with age. Sinclair (Harvard), Imai (WashU): mouse studies NMN/NR oral supplementation → healthspan benefits (mitochondrial function, metabolic, exercise capacity). NMN: ChromaDex Tru Niagen (NR), Elysium Health Basis, MetroBiotech MIB-626 NMN Phase 2. Human RCTs (Yoshino 2021 Sci, Mills 2016): well-tolerated, modest metabolic improvements, no clear longevity. FDA NMN regulatory ambiguity 2022 (declared non-supplement). Sinclair "Lifespan" book popularized. Critics: marketing ahead of evidence. Trials ongoing — NIA, NIH supplements. Underpins sirtuin biology of Sinclair/Guarente.'
        objectives: [NAD+ precursors]
      - type: choice
        difficulty: 5
        question:
          pt: Rapamycin (sirolimus, mTOR inhibitor) lifespan extension was demonstrated em…
          en: Rapamycin (sirolimus, mTOR inhibitor) lifespan extension was demonstrated in…
        choices:
          - Multiple species (yeast, worms, flies, mice — ITP 2009 NIA Interventions Testing Program); first drug extending mammalian lifespan
          - Long-lived primates only after 30 years of continuous administration
          - Human centenarian studies showing universal endogenous mTOR suppression
          - Cancer chemotherapy patients with paradoxical longevity benefits documented in registries
        correctAnswer: Multiple species (yeast, worms, flies, mice — ITP 2009 NIA Interventions Testing Program); first drug extending mammalian lifespan
        rationale:
          pt: 'Rapamycin (Wyeth → Pfizer, sirolimus): mTOR inhibitor originally immunosuppressant + anti-cancer (mTORC1 macrolide). NIA ITP (Interventions Testing Program, Miller/Strong/Harrison) 2009: rapamycin late-life mice extended lifespan ~10-14% — primeiro drug em mammals robust replicated. Mecanismo: autophagy induction + protein synthesis reduction + senescence modulation. Mannick PEARL trial humanos: low-dose rapamycin imune function elderly. Side effects mTORC2 (hyperlipidemia, glucose intolerance) → encore mTORC1-selective rapalogs Phase 2. Concurrent: AgelessRx telehealth off-label. Brian Kennedy founded.'
          en: 'Rapamycin (Wyeth → Pfizer, sirolimus): mTOR inhibitor originally immunosuppressant + anti-cancer (mTORC1 macrolide). NIA ITP (Interventions Testing Program, Miller/Strong/Harrison) 2009: rapamycin late-life mice extended lifespan ~10-14% — first drug in mammals robustly replicated. Mechanism: autophagy induction + protein synthesis reduction + senescence modulation. Mannick PEARL trial humans: low-dose rapamycin and immune function in elderly. mTORC2 side effects (hyperlipidemia, glucose intolerance) → mTORC1-selective rapalogs Phase 2. Concurrent: AgelessRx telehealth off-label. Brian Kennedy founded.'
        objectives: [Rapamycin]
      - type: choice
        difficulty: 5
        question:
          pt: TAME (Targeting Aging with MEtformin) trial (Barzilai/Albert Einstein, planned 2015 ongoing) propôs…
          en: TAME (Targeting Aging with MEtformin) trial (Barzilai/Albert Einstein, planned 2015 ongoing) proposed…
        choices:
          - Composite endpoint of major age-related diseases (cancer, CV, dementia, mortality) in non-diabetic ~3000 older adults to validate aging as a regulatory target
          - Metformin as first-line therapy in established type 2 diabetes patients with confirmed dementia
          - Lifelong metformin in centenarians to extend remaining lifespan beyond age 110
          - Combination of metformin + rapamycin in solid organ transplant recipients
        correctAnswer: Composite endpoint of major age-related diseases (cancer, CV, dementia, mortality) in non-diabetic ~3000 older adults to validate aging as a regulatory target
        rationale:
          pt: 'TAME trial: Nir Barzilai (Einstein) + AFAR (American Federation for Aging Research). Design: ~3000 non-diabetic older adults (65-79y), metformin vs placebo, composite endpoint major age-related diseases (cancer + CV + cognitive impairment + mortality). Goal regulatory: validate aging como target FDA — primeiro indication. Metformin generic — observational data MILES Bannister 2014: diabetics on metformin sobreviveram non-diabetics. Mecanismos: AMPK activation, mitochondrial complex I, microbiome. Funding challenges (~$70M needed) — partial funding 2023 Hevolution Foundation. Trial paradigma "geroprotective" drug repurposing.'
          en: 'TAME trial: Nir Barzilai (Einstein) + AFAR (American Federation for Aging Research). Design: ~3000 non-diabetic older adults (65-79y), metformin vs placebo, composite endpoint of major age-related diseases (cancer + CV + cognitive impairment + mortality). Regulatory goal: validate aging as FDA target — first indication. Generic metformin — observational data MILES Bannister 2014: diabetics on metformin outlived non-diabetics. Mechanisms: AMPK activation, mitochondrial complex I, microbiome. Funding challenges (~$70M needed) — partial 2023 Hevolution Foundation funding. Trial paradigm of "geroprotective" drug repurposing.'
        objectives: [TAME metformin]
      - type: choice
        difficulty: 5
        question:
          pt: Em partial reprogramming, Yamanaka factors expressed transiently (OSKM cycling, Belmonte Salk 2016 Cell) demonstrated…
          en: In partial reprogramming, transient Yamanaka factor expression (OSKM cycling, Belmonte Salk 2016 Cell) demonstrated…
        choices:
          - Reversal of cellular age markers (epigenetic clock, mitochondrial function) without loss of cell identity in vivo and in vitro
          - Permanent dedifferentiation of all somatic cells to pluripotent state across organs
          - Complete teratoma formation in every treated tissue requiring chemotherapy rescue
          - Induction of cancer transformation indistinguishable from oncogene activation
        correctAnswer: Reversal of cellular age markers (epigenetic clock, mitochondrial function) without loss of cell identity in vivo and in vitro
        rationale:
          pt: 'Partial reprogramming: Yamanaka factors OCT4 + SOX2 + KLF4 + MYC (OSKM, 2006/2007 fibroblast → iPSC). Belmonte Salk 2016 Cell + 2020 Nature: cyclic transient OSKM expression em mice (LAKI progeroid + WT) → reversed epigenetic age markers, reduced metabolic dysfunction, sem teratoma quando dose carefully controlled. Iglesias-Bartolome 2023 Nature: corneal regeneration. Spinouts: Altos Labs ($3B funding 2022 Bezos backed, Belmonte/Reik/Sasaki/Stoyanova), Retro Biosciences ($180M Sam Altman-backed 2022), NewLimit (Patrick Collison Stripe-backed 2021). Goal: aging reversal. Challenges: control, off-target oncogenesis. Foundational concept para reprogramming-based therapeutics.'
          en: 'Partial reprogramming: Yamanaka factors OCT4 + SOX2 + KLF4 + MYC (OSKM, 2006/2007 fibroblast → iPSC). Belmonte Salk 2016 Cell + 2020 Nature: cyclic transient OSKM expression in mice (LAKI progeroid + WT) → reversed epigenetic age markers, reduced metabolic dysfunction, no teratoma when dose carefully controlled. Iglesias-Bartolome 2023 Nature: corneal regeneration. Spinouts: Altos Labs ($3B funding 2022 Bezos-backed, Belmonte/Reik/Sasaki/Stoyanova), Retro Biosciences ($180M Sam Altman-backed 2022), NewLimit (Patrick Collison Stripe-backed 2021). Goal: aging reversal. Challenges: control, off-target oncogenesis. Foundational concept for reprogramming-based therapeutics.'
        objectives: [Partial reprogramming]
      - type: choice
        difficulty: 5
        question:
          pt: Em epigenetic clocks, Horvath multi-tissue clock (2013) e GrimAge (2019) measure…
          en: In epigenetic clocks, Horvath multi-tissue clock (2013) and GrimAge (2019) measure…
        choices:
          - Biological age via DNA methylation patterns at specific CpG sites; predicting mortality and morbidity beyond chronological age
          - Cumulative telomere length only, without integration of broader epigenetic information
          - Mitochondrial copy number variation as the sole biological-age marker
          - Body composition metrics derived from DEXA scans converted to a single age score
        correctAnswer: Biological age via DNA methylation patterns at specific CpG sites; predicting mortality and morbidity beyond chronological age
        rationale:
          pt: 'Steve Horvath (UCLA) 2013 Genome Biology: multi-tissue epigenetic clock — 353 CpG sites methylation predicts age across tissues. Hannum 2013 blood-based. PhenoAge (Levine 2018): combina methylation + clinical markers (CBC, glucose, etc) → biological age. GrimAge (Lu/Horvath 2019 Aging): DNA methylation surrogates plasma proteins + smoking pack-years → strongest predictor mortality/morbidity. DunedinPACE (Belsky 2022): pace-of-aging methylation. Aplicações: clinical trials biomarker, intervention validation, precision aging medicine. Companies: TruDiagnostic, GlycanAge, Epigene Labs. NIH/NIA funded. Foundational quantitative aging biomarker.'
          en: 'Steve Horvath (UCLA) 2013 Genome Biology: multi-tissue epigenetic clock — 353 CpG sites methylation predicts age across tissues. Hannum 2013 blood-based. PhenoAge (Levine 2018): combines methylation + clinical markers (CBC, glucose, etc) → biological age. GrimAge (Lu/Horvath 2019 Aging): DNA methylation surrogates of plasma proteins + smoking pack-years → strongest mortality/morbidity predictor. DunedinPACE (Belsky 2022): pace-of-aging methylation. Applications: clinical trials biomarker, intervention validation, precision aging medicine. Companies: TruDiagnostic, GlycanAge, Epigene Labs. NIH/NIA funded. Foundational quantitative aging biomarker.'
        objectives: [Epigenetic clocks]
      - type: choice
        difficulty: 5
        question:
          pt: Em parabiosis (heterochronic blood sharing, Conboy/Wagers 2005), key finding was…
          en: In parabiosis (heterochronic blood sharing, Conboy/Wagers 2005), the key finding was…
        choices:
          - Young blood factors rejuvenate aged tissues (muscle, brain, heart); old blood ages young — proteins like GDF11, OS-9, β2-microglobulin contributing
          - Identical aging phenotype in both partners with no exchange-driven rejuvenation
          - Universal harmful effect of any cross-age circulatory exchange independent of donor age
          - Platelet-only mediated effects without involvement of plasma protein factors
        correctAnswer: Young blood factors rejuvenate aged tissues (muscle, brain, heart); old blood ages young — proteins like GDF11, OS-9, β2-microglobulin contributing
        rationale:
          pt: 'Heterochronic parabiosis (surgical joining young + old mice circulation): Irina + Mike Conboy (Berkeley) + Amy Wagers (Harvard) 2005 Nature: young blood rejuvenates aged satellite cells, hepatocyte regeneration. Subsequent: brain (Wyss-Coray Stanford 2014 Nat Med — young plasma improved cognition aged mice), GDF11 controversy (Lee 2014 → contradicted Egerman 2015), β2-microglobulin pro-aging. Plasmapheresis (TPE) clinical trial Wyss-Coray Stanford 2017+ Alzheimer (mixed results). Young plasma controversial (Ambrosia clinic ban). Companies: Alkahest (acquired Grifols, terminated 2023), Elevian (GDF11). Mechanistic insights ainda evolving.'
          en: 'Heterochronic parabiosis (surgical joining young + old mice circulation): Irina + Mike Conboy (Berkeley) + Amy Wagers (Harvard) 2005 Nature: young blood rejuvenates aged satellite cells, hepatocyte regeneration. Subsequent: brain (Wyss-Coray Stanford 2014 Nat Med — young plasma improved cognition in aged mice), GDF11 controversy (Lee 2014 → contradicted Egerman 2015), β2-microglobulin pro-aging. Plasmapheresis (TPE) clinical trial Wyss-Coray Stanford 2017+ Alzheimer (mixed results). Young plasma controversial (Ambrosia clinic ban). Companies: Alkahest (acquired by Grifols, terminated 2023), Elevian (GDF11). Mechanistic insights still evolving.'
        objectives: [Parabiosis]
      - type: choice
        difficulty: 5
        question:
          pt: Caloric restriction (CR) e CRMs (CR mimetics) longevity benefit foi confirmed em…
          en: Caloric restriction (CR) and CRMs (CR mimetics) longevity benefit was confirmed in…
        choices:
          - Multiple model organisms (yeast, worms, flies, rodents); rhesus monkey results mixed (Wisconsin + 2014 + NIA differ); CALERIE 2 humans showed metabolic benefits not lifespan
          - Definitive lifespan extension in randomized human trials with 30-year follow-up
          - Universal harm from any caloric restriction in long-lived primate studies
          - Effects strictly limited to invertebrate model organisms with no mammalian relevance
        correctAnswer: Multiple model organisms (yeast, worms, flies, rodents); rhesus monkey results mixed (Wisconsin + 2014 + NIA differ); CALERIE 2 humans showed metabolic benefits not lifespan
        rationale:
          pt: 'CR (caloric restriction without malnutrition): McCay 1935 rats. Confirmed worms, flies, rodents lifespan extension. Wisconsin rhesus (2009 Science Colman): + lifespan + healthspan benefits. NIA rhesus (2012 Nature Mattison): more equivocal — partial protocol differences. Reconcile (2014/2017): both extended healthspan, lifespan modest. CALERIE 2 (Pennington/Tufts/Washington 2015+): humans 25% CR 2 yrs — metabolic markers improved, biomarkers aging slowed, no direct lifespan data possível. CRMs (CR mimetics): rapamycin, metformin, resveratrol (Sinclair 2003, mixed clinical), spermidine (Madeo polyamine, autophagy). Time-restricted feeding (Panda Salk) emerging variant.'
          en: 'CR (caloric restriction without malnutrition): McCay 1935 rats. Confirmed lifespan extension in worms, flies, rodents. Wisconsin rhesus (2009 Science Colman): + lifespan + healthspan benefits. NIA rhesus (2012 Nature Mattison): more equivocal — partly protocol differences. Reconcile (2014/2017): both extended healthspan, modest lifespan. CALERIE 2 (Pennington/Tufts/Washington 2015+): humans 25% CR over 2 yrs — improved metabolic markers, slowed aging biomarkers, no direct lifespan data possible. CRMs (CR mimetics): rapamycin, metformin, resveratrol (Sinclair 2003, mixed clinical), spermidine (Madeo polyamine, autophagy). Time-restricted feeding (Panda Salk) emerging variant.'
        objectives: [Caloric restriction]
      - type: choice
        difficulty: 5
        question:
          pt: Em centenarian studies, Italian Sardinian + Okinawan + Loma Linda Blue Zones share…
          en: In centenarian studies, Italian Sardinian + Okinawan + Loma Linda Blue Zones share…
        choices:
          - Lifestyle commonalities (plant-based diet, moderate activity, social connection, meaning) rather than single genetic determinant; FOXO3, APOE genetic associations modest
          - Unique single longevity-conferring gene allele absent from other populations
          - Identical climate, altitude, and dietary macronutrient ratios across all five regions
          - Universal centenarian-only marriage practices producing reproductive isolation
        correctAnswer: Lifestyle commonalities (plant-based diet, moderate activity, social connection, meaning) rather than single genetic determinant; FOXO3, APOE genetic associations modest
        rationale:
          pt: 'Blue Zones (Dan Buettner journalist 2008+): Sardinia (Italy Ogliastra), Okinawa (Japan), Nicoya (Costa Rica), Loma Linda (California Adventists), Ikaria (Greece). Common lifestyle: plant-based diet (~95% Loma Linda Adventists vegetarian), moderate physical activity, social connection, sense of purpose, low stress, religious community. Genetic: FOXO3 longevity-associated allele frequency higher Sardinia Centenarian; APOE2 favorable; KLOTHO. Gene-environment interaction. Critique: data quality variável, confounding. Heritability longevity ~25% modest. Complete population studies declining (Sardinia data <100 declined 2010s). Lessons translatable individual + community level.'
          en: 'Blue Zones (Dan Buettner journalist 2008+): Sardinia (Italy Ogliastra), Okinawa (Japan), Nicoya (Costa Rica), Loma Linda (California Adventists), Ikaria (Greece). Common lifestyle: plant-based diet (~95% Loma Linda Adventists vegetarian), moderate physical activity, social connection, sense of purpose, low stress, religious community. Genetic: FOXO3 longevity-associated allele frequency higher in Sardinia centenarians; favorable APOE2; KLOTHO. Gene-environment interaction. Critique: variable data quality, confounding. Modest ~25% longevity heritability. Complete population studies declining (Sardinia <100 data declined in 2010s). Lessons translatable at individual + community level.'
        objectives: [Blue Zones]
  - title:
      pt: Página 2 — Targets + Trials + Industry
      en: Page 2 — Targets + Trials + Industry
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Klotho protein (Kuro-o 1997 Nature) é…
          en: Klotho protein (Kuro-o 1997 Nature) is…
        choices:
          - Anti-aging hormone — knockouts show premature aging phenotype; α-Klotho regulates FGF23 phosphate axis; circulating soluble form declines with age
          - Pro-aging factor whose elevation accelerates senescence in mice
          - Vitamin K-related cofactor with no direct role in aging biology
          - Mitochondrial respiratory chain complex IV component
        correctAnswer: Anti-aging hormone — knockouts show premature aging phenotype; α-Klotho regulates FGF23 phosphate axis; circulating soluble form declines with age
        rationale:
          pt: 'Klotho (Kuro-o 1997 Nature): named após Greek goddess fate. KL-/- mice develop premature aging phenotype (atherosclerosis, osteoporosis, infertility, short lifespan). α-Klotho membrane + soluble forms; β-Klotho FGF21 receptor. Co-receptor para FGF23 phosphate/vitamin D regulation. Klotho overexpression extended lifespan. Soluble Klotho declines com age — biomarker. Cognitive: Klotho heterozygotes humanos KL-VS allele better cognitive function (Dubal 2014 Cell Rep). Therapeutic potential: klotho replacement therapy explored (Klotho Therapeutics, Unity Bio descontinuou). Geroscience target. Mechanism: anti-Wnt, anti-IGF-1, anti-fibrotic em multiple tissues.'
          en: 'Klotho (Kuro-o 1997 Nature): named after Greek goddess of fate. KL-/- mice develop premature aging phenotype (atherosclerosis, osteoporosis, infertility, short lifespan). α-Klotho membrane + soluble forms; β-Klotho is FGF21 receptor. Co-receptor for FGF23 phosphate/vitamin D regulation. Klotho overexpression extended lifespan. Soluble Klotho declines with age — biomarker. Cognitive: Klotho heterozygotes humans KL-VS allele have better cognitive function (Dubal 2014 Cell Rep). Therapeutic potential: klotho replacement therapy explored (Klotho Therapeutics, Unity Bio discontinued). Geroscience target. Mechanism: anti-Wnt, anti-IGF-1, anti-fibrotic in multiple tissues.'
        objectives: [Klotho]
      - type: choice
        difficulty: 5
        question:
          pt: Em mitochondrial aging, urolithin A (Mitopure, Amazentis) é…
          en: In mitochondrial aging, urolithin A (Mitopure, Amazentis) is…
        choices:
          - Microbiome-derived metabolite of ellagitannins (pomegranate); induces mitophagy; Phase 2 trials show muscle function improvement in older adults
          - First FDA-approved mitochondrial replacement therapy via cytoplasmic transplantation
          - Direct chelator of mitochondrial iron used in inherited mitochondrial disease
          - Synthetic uncoupler of oxidative phosphorylation with cardiac safety record
        correctAnswer: Microbiome-derived metabolite of ellagitannins (pomegranate); induces mitophagy; Phase 2 trials show muscle function improvement in older adults
        rationale:
          pt: 'Urolithin A: gut microbiota metaboliza ellagic acid/ellagitannins (pomegranate, walnuts, raspberries) → urolithin A. Andreux/Auwerx EPFL 2016 Nat Med: urolithin A induz mitophagy (PINK1/Parkin pathway) → improved muscle function aged mice + worms. Amazentis (Lausanne) Mitopure supplement (since 2020). Phase 2 Singh et al 2022 JAMA Network Open: ~88 elderly, urolithin A 8 weeks improved skeletal muscle endurance + plasma biomarkers. Phase 2 Liu et al 2024 sarcopenia. Producer microbiota variability — only ~30-40% adults make sufficient endogenous urolithin A. Aging exemplo de microbiome-host metabolic crosstalk.'
          en: 'Urolithin A: gut microbiota metabolize ellagic acid/ellagitannins (pomegranate, walnuts, raspberries) → urolithin A. Andreux/Auwerx EPFL 2016 Nat Med: urolithin A induces mitophagy (PINK1/Parkin pathway) → improved muscle function in aged mice + worms. Amazentis (Lausanne) Mitopure supplement (since 2020). Phase 2 Singh et al 2022 JAMA Network Open: ~88 elderly, urolithin A 8 weeks improved skeletal muscle endurance + plasma biomarkers. Phase 2 Liu et al 2024 sarcopenia. Producer microbiota variability — only ~30-40% adults make sufficient endogenous urolithin A. Aging example of microbiome-host metabolic crosstalk.'
        objectives: [Urolithin A]
      - type: choice
        difficulty: 5
        question:
          pt: Altos Labs (founded 2022, $3B+ Bezos/Yuri Milner backed) mission é…
          en: Altos Labs (founded 2022, $3B+ Bezos/Yuri Milner backed) mission is…
        choices:
          - Cellular reprogramming research-first model; recruited Belmonte, Reik, Sasaki, Yamanaka advisor; Cambridge UK + Bay Area + San Diego sites
          - Direct-to-consumer NMN supplement marketing through subscription delivery
          - Clinical trial CRO services for major pharmaceutical sponsors
          - Centenarian genomic database licensing for ancestry companies
        correctAnswer: Cellular reprogramming research-first model; recruited Belmonte, Reik, Sasaki, Yamanaka advisor; Cambridge UK + Bay Area + San Diego sites
        rationale:
          pt: 'Altos Labs (2022 launch): $3B+ funding (Jeff Bezos, Yuri Milner Mail.ru founder, Saudi PIF), mission cellular rejuvenation programming. Recruits high-profile: Juan Carlos Izpisua Belmonte (Salk, lead), Wolf Reik (Babraham, lead), Shinya Yamanaka (Kyoto, advisory), Manuel Serrano (CNIO/IRB), Hiromitsu Nakauchi (Stanford), Steve Horvath (epigenetic clocks), Marija Zinkernagel (former Crick), Peter Walter (UCSF). Sites Cambridge UK, San Diego, Bay Area. Research-first model (não start-up rush). Goal: programmable rejuvenation. Concorrentes: Calico (Google 2013), Retro Biosciences ($180M Sam Altman 2022), NewLimit (Stripe Patrick Collison 2021), Loyal (canine longevity FDA RXC 2023), Hevolution Foundation Saudi.'
          en: 'Altos Labs (2022 launch): $3B+ funding (Jeff Bezos, Yuri Milner Mail.ru founder, Saudi PIF), mission of cellular rejuvenation programming. Recruits high-profile: Juan Carlos Izpisua Belmonte (Salk, lead), Wolf Reik (Babraham, lead), Shinya Yamanaka (Kyoto, advisory), Manuel Serrano (CNIO/IRB), Hiromitsu Nakauchi (Stanford), Steve Horvath (epigenetic clocks), Marija Zinkernagel (former Crick), Peter Walter (UCSF). Cambridge UK, San Diego, Bay Area sites. Research-first model (not start-up rush). Goal: programmable rejuvenation. Competitors: Calico (Google 2013), Retro Biosciences ($180M Sam Altman 2022), NewLimit (Stripe Patrick Collison 2021), Loyal (canine longevity FDA RXC 2023), Hevolution Foundation Saudi.'
        objectives: [Altos Labs]
      - type: choice
        difficulty: 5
        question:
          pt: Em age-related macular degeneration (AMD) emerging therapy era, geographic atrophy (GA) treatment 2023 marcou…
          en: In age-related macular degeneration (AMD) emerging therapy era, 2023 marked geographic atrophy (GA) treatment with…
        choices:
          - Pegcetacoplan (Syfovre Apellis) + avacincaptad pegol (Izervay Astellas/IVERIC) — first FDA-approved drugs targeting C3/C5 complement for GA in dry AMD
          - First gene therapy curing all AMD subtypes within a single year of treatment
          - Discontinuation of all anti-VEGF agents after observational evidence of harm
          - Universal stem cell transplant protocol replacing pharmacotherapy in dry AMD
