pages:
  - title:
      pt: Página 1 — Pluripotência e modelos embrionários
      en: Page 1 — Pluripotency and embryo models
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Yamanaka iPSC factors (Cell 2006/2007) e Nobel 2012 reconheceram…
          en: Yamanaka iPSC factors (Cell 2006/2007) and 2012 Nobel recognized…
        choices:
          - Reprogramming of differentiated somatic cells to pluripotency by four transcription factors (Oct4/Sox2/Klf4/c-Myc), revolutionizing regenerative medicine
          - Discovery of embryonic stem cells from blastocysts in mice
          - Cloning of Dolly the sheep by somatic cell nuclear transfer
          - First gene therapy using viral vectors in humans
        correctAnswer: Reprogramming of differentiated somatic cells to pluripotency by four transcription factors (Oct4/Sox2/Klf4/c-Myc), revolutionizing regenerative medicine
        rationale:
          pt: 'iPSC induced pluripotent stem cells (Takahashi Yamanaka Cell 2006 mouse, Takahashi Tanabe Ohnuki Narita Ichisaka Tomoda Yamanaka Cell 2007 human): retroviral overexpression 4 transcription factors (Oct3/4 POU5F1, Sox2, Klf4, c-Myc — "OSKM") em fibroblasts → reprogram pluripotent state ESC-equivalent. Nobel 2012 Yamanaka + John Gurdon (1962 frog SCNT primeiro nuclear reprogramming). Bypassed ethical issues hESC + immunological matching (autologous patient iPSC). Subsequent improvements: episomal vectors (avoid integration), modified mRNA, small molecules (CHIR99021 + PD0325901 dual SMAD inhibitors), removal c-Myc oncogene. iPSC banks Japan (CiRA Yamanaka founded 2010). Aplicações: disease modeling, drug screening, cell therapy (Mandai 2014 first iPSC-derived RPE patient AMD, Takahashi Kyoto 2018 iPSC-Parkinson dopamine neurons trial). 2024 Vertex VX-880 hESC-derived β-cells T1D Phase 1/2 working — pluripotent stem cell therapy era.'
          en: 'iPSC induced pluripotent stem cells (Takahashi Yamanaka Cell 2006 mouse, Cell 2007 human): retroviral overexpression of 4 transcription factors (Oct3/4 POU5F1, Sox2, Klf4, c-Myc — "OSKM") in fibroblasts → reprograms to pluripotent state ESC-equivalent. Nobel 2012 Yamanaka + John Gurdon (1962 frog SCNT first nuclear reprogramming). Bypassed ethical issues of hESC + immunological matching (autologous patient iPSC). Subsequent improvements: episomal vectors (avoid integration), modified mRNA, small molecules (CHIR99021 + PD0325901 dual SMAD inhibitors), removal of c-Myc oncogene. iPSC banks in Japan (CiRA Yamanaka founded 2010). Applications: disease modeling, drug screening, cell therapy (Mandai 2014 first iPSC-derived RPE patient AMD, Takahashi Kyoto 2018 iPSC-Parkinson dopamine neurons trial). 2024 Vertex VX-880 hESC-derived β-cells T1D Phase 1/2 working — pluripotent stem cell therapy era.'
        objectives: [iPSC Yamanaka]
      - type: choice
        difficulty: 5
        question:
          pt: Naïve vs primed pluripotency distinction é…
          en: Naïve vs primed pluripotency distinction is…
        choices:
          - Naïve corresponds to pre-implantation epiblast (mouse ESCs in 2i+LIF) vs primed corresponding to post-implantation epiblast (human ESCs in FGF2+activin) — different epigenetics, signaling, X-status
          - No biological difference — terminology only
          - Naïve refers to differentiated cells, primed to pluripotent
          - Naïve is unique to plants, primed to animals
        correctAnswer: Naïve corresponds to pre-implantation epiblast (mouse ESCs in 2i+LIF) vs primed corresponding to post-implantation epiblast (human ESCs in FGF2+activin) — different epigenetics, signaling, X-status
        rationale:
          pt: 'Pluripotency states: naïve (ground state) — pre-implantation ICM/epiblast equivalent — mouse ESCs cultured in 2i (CHIR99021 GSK3β inhibitor + PD0325901 MEK inhibitor) + LIF; female lines have both X chromosomes active (XaXa); global DNA hypomethylation; OCT4 distal enhancer active. Primed — post-implantation epiblast equivalent — mouse EpiSCs and human ESCs in FGF2 + activin/TGFβ; XaXi (one X already inactivated females); higher methylation; OCT4 proximal enhancer. Conventional human ESC (Thomson 1998 H1/H9 lines) classically primed — major species difference. Naïve human pluripotency: Theunissen 2014, Takashima/Smith 2014, Guo 2017, Pastor 2018 — derived via small-molecule cocktails (5i/L/A, t2iLGö, PXGL). Important embryo modeling — naïve human PSC required SEM/blastoid construction. Formative state intermediate (Smith 2017 Nature Reviews) developmental progression continuous.'
          en: 'Pluripotency states: naïve (ground state) — pre-implantation ICM/epiblast equivalent — mouse ESCs cultured in 2i (CHIR99021 GSK3β inhibitor + PD0325901 MEK inhibitor) + LIF; female lines have both X chromosomes active (XaXa); global DNA hypomethylation; OCT4 distal enhancer active. Primed — post-implantation epiblast equivalent — mouse EpiSCs and human ESCs in FGF2 + activin/TGFβ; XaXi (one X already inactivated in females); higher methylation; OCT4 proximal enhancer. Conventional human ESC (Thomson 1998 H1/H9 lines) classically primed — major species difference. Naïve human pluripotency: Theunissen 2014, Takashima/Smith 2014, Guo 2017, Pastor 2018 — derived via small-molecule cocktails (5i/L/A, t2iLGö, PXGL). Important for embryo modeling — naïve human PSC required for SEM/blastoid construction. Formative state intermediate (Smith 2017 Nature Reviews) developmental progression continuous.'
        objectives: [Naive primed pluripotency]
      - type: choice
        difficulty: 5
        question:
          pt: Gastruloids (van den Brink/Martinez Arias/Lutolf Development 2014→Nature 2020) são…
          en: Gastruloids (van den Brink/Martinez Arias/Lutolf Development 2014→Nature 2020) are…
        choices:
          - 3D mouse/human ESC aggregates that, after pulsed CHIR99021 (Wnt activator), break symmetry and elongate with anterior-posterior axis recapitulating gastrulation including somitogenesis-like features
          - Static spherical aggregates without axis polarization
          - 2D monolayer differentiation cultures only
          - Whole embryos requiring trophoblast/extraembryonic compartments
        correctAnswer: 3D mouse/human ESC aggregates that, after pulsed CHIR99021 (Wnt activator), break symmetry and elongate with anterior-posterior axis recapitulating gastrulation including somitogenesis-like features
        rationale:
          pt: 'Gastruloids (van den Brink/Baillie-Johnson/Balayo/Hadjantonakis/Martinez Arias Cambridge Development 2014 → Beccari Moris Girgin Turner Baillie-Johnson Cossy Lutolf Duboule Martinez Arias Nature 2018 → Veenvliet Bolondi Kretzmer Haut Scholze Wittler Schifferl Sucharski-Argelagues Bertone Klingmann Schwarzmayr Strom Meissner Tunturilab Borovkov Anastassiadis Nature 2020): cluster of mouse ES cells (~300 cells) → 24h aggregation → CHIR99021 Wnt agonist 24h pulse → break radial symmetry → elongate along single axis (anterior-posterior) → ~120hrs gastruloid recapitulates gastrulation events: primitive streak-like, mesoderm, endoderm, neural patterning, somite-like rhythm (Hes7 oscillator). Lacks: head, extraembryonic. Veenvliet/Herrmann 2020 Trunk-like structure full somitogenesis + neural tube. Human gastruloids (Moris/Martinez Arias Cambridge Nature 2020) similar. Aplicações: gastrulation timing, developmental disorder modeling (sacrococcygeal teratomas, neural tube defects), drug teratogenicity. Lutolf lab EPFL Lausanne specialized.'
          en: 'Gastruloids (van den Brink/Martinez Arias Cambridge Development 2014 → Beccari/Lutolf/Martinez Arias Nature 2018 → Veenvliet Nature 2020 trunk-like): cluster of mouse ES cells (~300 cells) → 24h aggregation → CHIR99021 Wnt agonist 24h pulse → breaks radial symmetry → elongates along single axis (anterior-posterior) → ~120 hrs gastruloid recapitulates gastrulation events: primitive streak-like, mesoderm, endoderm, neural patterning, somite-like rhythm (Hes7 oscillator). Lacks: head, extraembryonic. Veenvliet/Herrmann 2020 Trunk-like structure full somitogenesis + neural tube. Human gastruloids (Moris/Martinez Arias Cambridge Nature 2020) similar. Applications: gastrulation timing, developmental disorder modeling (sacrococcygeal teratomas, neural tube defects), drug teratogenicity. Lutolf lab EPFL Lausanne specialized.'
        objectives: [Gastruloids]
      - type: choice
        difficulty: 5
        question:
          pt: Blastoids (Rivron Nature 2018 mouse, Yu/Liu/Polo Nature 2021 iBlastoids human) são…
          en: Blastoids (Rivron Nature 2018 mouse, Yu/Liu/Polo Nature 2021 iBlastoids human) are…
        choices:
          - Self-organized blastocyst-like structures from PSCs with epiblast/trophectoderm/primitive endoderm lineages, capable of ZP-bound implantation in some assays
          - Solid spheroids without inner cavity or trophectoderm-like outer layer
          - Surgical fragments of in vivo blastocysts
          - 2D wells with mixed cells lacking 3D blastocyst architecture
        correctAnswer: Self-organized blastocyst-like structures from PSCs with epiblast/trophectoderm/primitive endoderm lineages, capable of ZP-bound implantation in some assays
        rationale:
          pt: 'Blastoids: mouse (Rivron Frias-Aldeguer Vrij Boisset Korving van Achterberg Vrij Lutolf Geijsen Nature 2018) — combined mouse ESCs + trophoblast stem cells (TSCs) → microwell 3D culture → self-assemble blastocyst-like cavity with outer trophoblast layer + ICM-like cluster. Implant uterus mouse ~6.5d post-transfer. Human iBlastoids (Liu Polo Tan Knaupp Mohenska Polo Monash Nature 2021): reprogramming fibroblasts via OCT4/SOX2/KLF4 partial → 3D Aggrewell → blastocyst-like structures ICM/trophectoderm/primitive endoderm lineages. Concurrent: Yanagida/Suemori/Yu Nature 2021 from naïve hPSC. Yu Pasque KU Leuven 2021 naïve hPSC blastoids. Pham Pickering/Polo 2022. Aplicações: study implantation, cell-fate decisions early embryo, infertility. Limit: imperfect resemblance natural blastocyst (transcriptome differs partial), 14-day rule prevents prolonged culture, ethical debate "near-embryo" status. Field 2018-2024 maturing ISSCR oversight.'
          en: 'Blastoids: mouse (Rivron Nature 2018) — combined mouse ESCs + trophoblast stem cells (TSCs) → microwell 3D culture → self-assemble blastocyst-like cavity with outer trophoblast layer + ICM-like cluster. Implant in mouse uterus ~6.5d post-transfer. Human iBlastoids (Liu Polo Monash Nature 2021): reprogramming fibroblasts via OCT4/SOX2/KLF4 partial → 3D Aggrewell → blastocyst-like structures with ICM/trophectoderm/primitive endoderm lineages. Concurrent: Yanagida/Suemori/Yu Nature 2021 from naïve hPSC. Yu Pasque KU Leuven 2021 naïve hPSC blastoids. Pham Pickering/Polo 2022. Applications: study implantation, cell-fate decisions in early embryo, infertility. Limit: imperfect resemblance to natural blastocyst (transcriptome differs partially), 14-day rule prevents prolonged culture, ethical debate over "near-embryo" status. Field 2018-2024 maturing under ISSCR oversight.'
        objectives: [Blastoids]
      - type: choice
        difficulty: 5
        question:
          pt: ETX embryos (Zernicka-Goetz 2017-2018) construção é…
          en: ETX embryos (Zernicka-Goetz 2017-2018) construction is…
        choices:
          - Combination of ESCs + TSCs + XEN cells (extra-embryonic endoderm) self-assembling into post-implantation egg-cylinder mouse embryo-like structures with anterior-posterior axis
          - Identical to pure embryoid bodies without extra-embryonic compartments
          - Surgical fragments of pre-implantation blastocysts
          - Single-lineage differentiation cultures only
        correctAnswer: Combination of ESCs + TSCs + XEN cells (extra-embryonic endoderm) self-assembling into post-implantation egg-cylinder mouse embryo-like structures with anterior-posterior axis
        rationale:
          pt: 'ETX embryos / EXE-embryos (Sozen Amadei Cox Wang Sun Faraj Hadjantonakis Behringer Niu Liu Wu Zernicka-Goetz Cambridge Nat Cell Biol 2017 → 2018 Cell): mouse — combine ESCs (epiblast-progenitor) + TSCs (trophoblast progenitor) + XEN cells (extra-embryonic endoderm) → 3D matrix culture → self-assemble post-implantation-stage embryo-like structures. ETX (E + T + X). Recapitulates egg-cylinder morphology, anterior-posterior axis, primitive streak formation, mesoderm patterning. Beyond gastruloids (no extra-embryonic) and blastoids (pre-implantation). Magdalena Zernicka-Goetz Cambridge → Caltech 2022+ lab. Subsequent SEM (Tarazi Hanna 2022 mouse, Oldak Hanna 2023 human Cell) further integration. iETX (induced ETX) variants. Aplicações: gastrulation patterning, neural tube formation, somitogenesis modeling. Concurrent Amadei Hanna independent work. Field race 2022-2023 various groups stem-cell-based embryo models reaching ~9-14 day equivalent.'
          en: 'ETX embryos / EXE-embryos (Sozen/Zernicka-Goetz Nat Cell Biol 2017 → 2018 Cell): mouse — combine ESCs (epiblast progenitor) + TSCs (trophoblast progenitor) + XEN cells (extra-embryonic endoderm) → 3D matrix culture → self-assembles into post-implantation-stage embryo-like structures. ETX (E + T + X). Recapitulates egg-cylinder morphology, anterior-posterior axis, primitive streak formation, mesoderm patterning. Beyond gastruloids (no extra-embryonic) and blastoids (pre-implantation). Magdalena Zernicka-Goetz Cambridge → Caltech 2022+ lab. Subsequent SEM (Tarazi Hanna 2022 mouse, Oldak Hanna 2023 human Cell) further integration. iETX (induced ETX) variants. Applications: gastrulation patterning, neural tube formation, somitogenesis modeling. Concurrent Amadei Hanna independent work. Field race 2022-2023 — various groups stem-cell-based embryo models reaching ~9-14 day equivalent.'
        objectives: [ETX embryos]
      - type: choice
        difficulty: 5
        question:
          pt: 14-day rule e ISSCR 2021 update significância é…
          en: 14-day rule and ISSCR 2021 update significance is…
        choices:
          - Long-standing limit on culturing human embryos beyond 14 days (primitive streak appearance) was relaxed in ISSCR 2021 guidelines to allow case-by-case extension under oversight
          - Total ban on any human embryo research worldwide
          - First adoption of 14-day rule globally with no precedent
          - Pure scientific limit with no ethical or regulatory dimension
        correctAnswer: Long-standing limit on culturing human embryos beyond 14 days (primitive streak appearance) was relaxed in ISSCR 2021 guidelines to allow case-by-case extension under oversight
        rationale:
          pt: '14-day rule: established Warnock Report UK 1984 → enshrined HFEA 1990 Act + many countries (Australia, Canada, South Korea, Israel) — limits human embryo research <14 days post-fertilization OR primitive streak formation (whichever first). Rationale: primitive streak marks gastrulation, individuation (twinning impossible after), arguably onset moral status. Practical: technically impossible culture beyond ~7 days mainstream era. 2016 Brivanlou/Zernicka-Goetz independent labs pushed ~12-13 days in vitro → revisit debate. ISSCR 2021 update (Lovell-Badge Hyun et al guidelines): relaxed to "case-by-case basis with rigorous review" — allowed under specific scientific justification + oversight. Stem-cell-based embryo models (SEMs) — não fertilized embryos technically — outside classic 14-day rule, separate framework needed. Active ethical/legal debate UK, US, China, Japan 2024+. Disconnect rapid science vs slow regulation.'
          en: '14-day rule: established by the Warnock Report UK 1984 → enshrined in HFEA 1990 Act + many countries (Australia, Canada, South Korea, Israel) — limits human embryo research to <14 days post-fertilization OR primitive streak formation (whichever first). Rationale: primitive streak marks gastrulation, individuation (twinning impossible after), arguably onset of moral status. Practically: it was technically impossible to culture beyond ~7 days during the mainstream era. 2016 Brivanlou/Zernicka-Goetz independent labs pushed ~12-13 days in vitro → revisited debate. ISSCR 2021 update (Lovell-Badge Hyun et al guidelines): relaxed to "case-by-case basis with rigorous review" — allowed under specific scientific justification + oversight. Stem-cell-based embryo models (SEMs) — not fertilized embryos technically — fall outside the classic 14-day rule, requiring a separate framework. Active ethical/legal debate UK, US, China, Japan 2024+. Disconnect between rapid science and slow regulation.'
        objectives: [14-day rule]
      - type: choice
        difficulty: 5
        question:
          pt: PGCLCs (Hayashi/Saitou Cell 2011/Science 2012) achievement foi…
          en: PGCLCs (Hayashi/Saitou Cell 2011/Science 2012) achievement was…
        choices:
          - Generation of primordial germ cell-like cells from mouse PSCs that, after maturation, produced fertile eggs and viable offspring — first complete in vitro gametogenesis
          - 2D differentiation cultures without functional gametes
          - Direct conversion of adult somatic cells to mature sperm
          - Surgical isolation of germ cells from fetal gonads only
        correctAnswer: Generation of primordial germ cell-like cells from mouse PSCs that, after maturation, produced fertile eggs and viable offspring — first complete in vitro gametogenesis
        rationale:
          pt: 'In vitro gametogenesis (IVG) — Hayashi Saitou Kyoto: PGCLCs primordial germ cell-like cells. Hayashi Ohta Kurimoto Aramaki Saitou Cell 2011 — mouse ESC/iPSC → epiblast-like cells → BMP4/8b/Lif/Activin → PGCLCs (mimic E6.25 PGCs). Aggregated reconstituted ovaries (somatic gonadal cells) → MII oocytes; aggregated testes → spermatozoa-like cells. Hayashi Ogushi Kurimoto Shimamoto Ohta Saitou Science 2012 — IVF MII oocytes derived → fertilized → live mouse pups born → fertile (further generations). Replicated all stages mouse gametogenesis ex vivo. Subsequent: Zhou 2016 spermatids; Yamashiro 2018 human PGCLCs partial. Conception 2 (2023 Murakami Hayashi mouse fertile entirely-in-vitro 8 generations). Human IVG: ongoing challenge — naïve hPSC → hPGCLC (Sasaki Saitou 2015, Irie Surani 2015) achieved, but downstream maturation oocytes/sperm not yet. Aplicações: fertility preservation, lab-grown offspring, evolution gametes. Ethical: same-sex couples, posthumous reproduction, dual-genetic-mother bi-paternal/maternal embryos (Hayashi 2024 mouse XY-from-XX preliminary).'
          en: 'In vitro gametogenesis (IVG) — Hayashi Saitou Kyoto: PGCLCs primordial germ cell-like cells. Hayashi 2011 Cell — mouse ESC/iPSC → epiblast-like cells → BMP4/8b/Lif/Activin → PGCLCs (mimic E6.25 PGCs). Aggregated with reconstituted ovaries (somatic gonadal cells) → MII oocytes; aggregated testes → spermatozoa-like cells. Hayashi Saitou Science 2012 — MII oocytes derived → IVF → fertilized → live mouse pups born → fertile (further generations). Replicated all stages of mouse gametogenesis ex vivo. Subsequent: Zhou 2016 spermatids; Yamashiro 2018 partial human PGCLCs. Conception 2 (2023 Murakami Hayashi mouse fertile entirely in vitro across 8 generations). Human IVG: ongoing challenge — naïve hPSC → hPGCLC (Sasaki Saitou 2015, Irie Surani 2015) achieved, but downstream maturation to oocytes/sperm not yet. Applications: fertility preservation, lab-grown offspring, evolution of gametes. Ethics: same-sex couples, posthumous reproduction, dual-genetic-mother bi-paternal/maternal embryos (Hayashi 2024 mouse XY-from-XX preliminary).'
        objectives: [PGCLCs IVG]
      - type: choice
        difficulty: 5
        question:
          pt: Polspecies embryo models / chimeras research em 2023 (Niu Tan/Liu Cell) marco foi…
          en: Cross-species embryo / chimera research in 2023 (Niu Tan/Liu Cell) milestone was…
        choices:
          - Generation of human-monkey chimeric embryos with significant human cell contribution to monkey embryo development, refining contributions to interspecies embryo studies
          - First human-mouse chimera with viable offspring
          - Pure single-species mouse embryo experiment
          - Plant-animal cell fusion experiments
        correctAnswer: Generation of human-monkey chimeric embryos with significant human cell contribution to monkey embryo development, refining contributions to interspecies embryo studies
        rationale:
          pt: 'Interspecies chimeric embryos: Tan Liu Niu Belmonte 2021 Cell — human EPS cells injected cynomolgus monkey blastocysts → cultured in vitro ~19 days, ~3-4% human cell contribution monkey embryos. Subsequent Aksoy/Niu/Belmonte 2023+: improved persistence. Belmonte/Salk pioneer interspecies chimera (mouse-rat 2017 Wu Yamamura Crews Belmonte Cell — viable rat-mouse chimera). Goal: human organ growth animal (xenotransplantation source), study early human development, drug testing. Ethical concerns intense — moral status interspecies chimera, potential germ-line contribution, neuralization concerns. Bunnies: Hu Niu Sun NIH 2017 first human-pig chimera (~0.001% human cells, far from viable). Field constrained by US ethical guidelines, NIH moratorium — much research moved China where ethical frameworks differ. Subsequent: He Jiankui post-prison 2024 announced chimera intentions controversial. ISSCR 2021 also addresses chimera oversight.'
          en: 'Interspecies chimeric embryos: Tan Liu Niu Belmonte 2021 Cell — human EPS cells injected into cynomolgus monkey blastocysts → cultured in vitro ~19 days, ~3-4% human cell contribution to monkey embryos. Subsequent Aksoy/Niu/Belmonte 2023+: improved persistence. Belmonte/Salk pioneer of interspecies chimeras (mouse-rat 2017 Wu Yamamura Crews Belmonte Cell — viable rat-mouse chimera). Goal: grow human organs in animals (xenotransplantation source), study early human development, drug testing. Ethical concerns intense — moral status of interspecies chimeras, potential germ-line contribution, neuralization concerns. Bunnies: Hu Niu Sun NIH 2017 first human-pig chimera (~0.001% human cells, far from viable). Field constrained by US ethical guidelines, NIH moratorium — much research moved to China where ethical frameworks differ. Subsequent: He Jiankui post-prison 2024 announced chimera intentions controversial. ISSCR 2021 also addresses chimera oversight.'
        objectives: [Interspecies chimeras]
      - type: choice
        difficulty: 5
        question:
          pt: Synthetic mouse embryo (Aguilera-Castrejon/Hanna Nature 2021) achievement foi…
          en: Synthetic mouse embryo (Aguilera-Castrejon/Hanna Nature 2021) achievement was…
        choices:
          - Ex utero culture of mouse embryos from gastrulation through organogenesis (~E5.5 to ~E11) using a roller bottle bioreactor with controlled atmosphere and serum
          - In vivo embryo transfer experiments only without ex utero culture
          - Pure 2D monolayer culture of embryonic cells
          - Cryopreservation method without cell culture
        correctAnswer: Ex utero culture of mouse embryos from gastrulation through organogenesis (~E5.5 to ~E11) using a roller bottle bioreactor with controlled atmosphere and serum
        rationale:
          pt: 'Ex utero mouse embryo culture (Aguilera-Castrejon Oldak Shani Ghanem Itzkovich Slomovich Tarazi Bayerl Chugaeva Ayyash Ashouokhi Sheban Livnat Lasman Viukov Zerbib Addadi Rais Cheng Stelzer Keren-Shaul Shlomo Massarwa Novershtern Hanna Nature 2021): rolling bottle bioreactor + custom medium (serum-supplemented) + controlled O₂/CO₂ atmosphere → mouse embryos transferred uterus → roller bottle E5.5 → continue development → E11 (~6 days ex utero) → organogenesis: heart beating, neural tube closing, limb buds, somitogenesis. Subsequent SEM Tarazi 2022 used same system culture stem-cell-derived embryos. Limit: cannot continue beyond ~E11 — placenta required mid-gestation, system limited. Aplicações: study mid-gestation events real-time, drug screening teratogenicity, embryonic disease modeling. Hanna lab Weizmann pioneered. Concurrent labs replicating method 2022-2024.'
          en: 'Ex utero mouse embryo culture (Aguilera-Castrejon/Hanna Weizmann Nature 2021): rolling bottle bioreactor + custom medium (serum-supplemented) + controlled O₂/CO₂ atmosphere → mouse embryos transferred from uterus → roller bottle at E5.5 → continue development → E11 (~6 days ex utero) → organogenesis: heart beating, neural tube closing, limb buds, somitogenesis. Subsequent SEM Tarazi 2022 used same system to culture stem-cell-derived embryos. Limit: cannot continue beyond ~E11 — placenta required mid-gestation, system limited. Applications: study mid-gestation events in real time, drug-screening teratogenicity, embryonic disease modeling. Hanna lab Weizmann pioneered. Concurrent labs replicating method 2022-2024.'
        objectives: [Ex utero culture]
      - type: choice
        difficulty: 5
        question:
          pt: Formative pluripotency state (Smith Nat Rev MCB 2017) é…
          en: Formative pluripotency state (Smith Nat Rev MCB 2017) is…
        choices:
          - Intermediate transitional state between naïve and primed pluripotency, capturing developmental progression and competent for germline specification
          - Identical to naïve pluripotency with no functional difference
          - Differentiated cell state lacking pluripotency
          - Plant-specific cellular state without animal counterpart
        correctAnswer: Intermediate transitional state between naïve and primed pluripotency, capturing developmental progression and competent for germline specification
        rationale:
          pt: 'Formative pluripotency (Smith Nat Rev MCB 2017): proposed intermediate state naïve → primed pluripotency continuum. Mouse: post-implantation peri-gastrulation epiblast E5.5-E6.0 (post-implantation pre-primitive streak). Hallmarks: increased OCT4 distal enhancer usage waning, increased epigenetic priming (lineage-specific enhancers H3K4me1 marked but inactive), competent germline specification PGCs (whereas naïve não competent direct PGC, primed cannot rescue). Cell lines mimicking: FS cells (formative stem cells, Kinoshita Smith Cell Stem Cell 2021) derived mouse + human via specific media. Conceptual significance: pluripotency é developmental progression continuum, not binary state. Provides system study lineage priming + germline competence in vitro. PGCLC Hayashi requires formative-like state for efficient PGC induction. Field continues refining (recent: postimplantation paraxial fates from formative).'
          en: 'Formative pluripotency (Smith Nat Rev MCB 2017): proposed intermediate state in the naïve → primed pluripotency continuum. Mouse: post-implantation peri-gastrulation epiblast E5.5-E6.0 (post-implantation, pre-primitive streak). Hallmarks: increased OCT4 distal enhancer usage waning, increased epigenetic priming (lineage-specific enhancers H3K4me1 marked but inactive), competence for germline specification PGCs (whereas naïve is not competent for direct PGC, primed cannot rescue). Cell lines mimicking: FS cells (formative stem cells, Kinoshita Smith Cell Stem Cell 2021) derived from mouse + human via specific media. Conceptual significance: pluripotency is a developmental progression continuum, not a binary state. Provides a system to study lineage priming + germline competence in vitro. PGCLC Hayashi requires formative-like state for efficient PGC induction. Field continues refining (recent: postimplantation paraxial fates from formative).'
        objectives: [Formative pluripotency]
