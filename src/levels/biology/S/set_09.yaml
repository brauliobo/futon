        question:
          pt: 2C-like cells (Macfarlan Pfaff Nature 2012) e 8C-like cells (Yu/Chen 2024) representam…
          en: 2C-like cells (Macfarlan/Pfaff Nature 2012) and 8C-like cells (Yu/Chen 2024) represent…
        choices:
          - Rare totipotent-like sub-states arising spontaneously in ESC cultures with transient expression of zygotic-genome-activation genes (Dux, Zscan4, MERVL) and broader developmental potential than typical pluripotency
          - Differentiated somatic cells with no embryonic potential
          - Apoptotic cells without reprogramming relevance
          - Adult stem cells from bone marrow
        correctAnswer: Rare totipotent-like sub-states arising spontaneously in ESC cultures with transient expression of zygotic-genome-activation genes (Dux, Zscan4, MERVL) and broader developmental potential than typical pluripotency
        rationale:
          pt: '2C-like cells (Macfarlan Gifford Driscoll Lettieri Rowe Bonanomi Firth Singer Trono Pfaff Nature 2012): rare ~0.1-1% mouse ESC subpopulation transiently express 2-cell-stage transcriptome (Dux transcription factor, Zscan4, MERVL retroelement, embryonic genome activation ZGA markers). Reverse transition to ground-state ESCs. Totipotent-like — competent contribute extra-embryonic lineages chimera assays (vs pluripotent ESC mostly epiblast). 8C-like cells (8CLCs) (Mazid/Cao Tang Liu Yu Belmonte 2022 Nature → Yang/Yu/Chen 2024 Nature) human equivalent — derived hPSC small molecules → 8-cell stage ZGA-like transcriptome. Rare endogenous reverse-state. Aplicações: model totipotency, ZGA, retroelement biology, cell fate origin. Shared TF Dux mouse / DUX4 human (DUX4 also FSHD muscular dystrophy gene — ironic activation early embryo vs pathology adults). Field foundational understand totipotency pre-implantation development.'
          en: '2C-like cells (Macfarlan/Pfaff Nature 2012): rare ~0.1-1% mouse ESC subpopulation transiently expressing 2-cell-stage transcriptome (Dux transcription factor, Zscan4, MERVL retroelement, embryonic genome activation ZGA markers). Reversibly transitions to ground-state ESCs. Totipotent-like — competent to contribute to extra-embryonic lineages in chimera assays (vs pluripotent ESC mostly epiblast). 8C-like cells (8CLCs) (Mazid Belmonte 2022 Nature → Yang/Yu/Chen 2024 Nature) human equivalent — derived from hPSC + small molecules → 8-cell-stage ZGA-like transcriptome. Rare endogenous reverse state. Applications: model totipotency, ZGA, retroelement biology, cell fate origin. Shared TF Dux mouse / DUX4 human (DUX4 also FSHD muscular dystrophy gene — ironic activation in early embryo vs pathology in adults). Field foundational for understanding totipotency and pre-implantation development.'
        objectives: [2C 8C-like]
