        question:
          pt: Direct lineage reprogramming (Wernig MyoD 1987 e Vierbuchen iN Nature 2010) é…
          en: Direct lineage reprogramming (Wernig MyoD 1987 and Vierbuchen iN Nature 2010) is…
        choices:
          - Forced expression of master transcription factors converts one differentiated cell type directly to another bypassing pluripotent intermediate, e.g., fibroblasts → induced neurons (iN) via Ascl1+Brn2+Myt1l
          - Always requires passage through iPSC pluripotent state
          - Pure dedifferentiation without target lineage specification
          - Random differentiation without TF guidance
        correctAnswer: Forced expression of master transcription factors converts one differentiated cell type directly to another bypassing pluripotent intermediate, e.g., fibroblasts → induced neurons (iN) via Ascl1+Brn2+Myt1l
        rationale:
          pt: 'Direct lineage reprogramming: Davis Weintraub Lassar Cell 1987 — single TF MyoD converts fibroblasts to myocytes. Pioneer concept master regulator. Subsequent: Vierbuchen Ostermeier Pang Kokubu Sudhof Wernig Nature 2010 — Ascl1 + Brn2 (Pou3f2) + Myt1l ("BAM" factors) → mouse fibroblasts → functional induced neurons (iN cells), 2 weeks. Bypass iPSC. Subsequent expansions: hiN human Pang Lai Vierbuchen Carromeu Pasca Tritsch Pasca Wernig Suaud Nature 2011, induced cardiomyocytes (iCM, Ieda Fu Delgado-Olguin Vedantham Hayashi Bruneau Srivastava Cell 2010 GMT factors), hepatocytes (iHep, Sekiya Suzuki Nature 2011), pancreatic β-cells, oligodendrocytes. Vantagens: skip pluripotent state risks (teratoma formation), faster, retains aging signatures (relevant disease modeling old age neurons). Limit: efficiency low typically, immature relative authentic counterparts. Combinatorial code each lineage. Wernig Stanford lab pioneer.'
          en: 'Direct lineage reprogramming: Davis Weintraub Lassar Cell 1987 — single TF MyoD converts fibroblasts to myocytes. Pioneer concept of master regulator. Subsequent: Vierbuchen/Sudhof/Wernig Nature 2010 — Ascl1 + Brn2 (Pou3f2) + Myt1l ("BAM" factors) → mouse fibroblasts → functional induced neurons (iN cells) in 2 weeks. Bypass iPSC. Subsequent expansions: hiN human (Pang/Wernig 2011), induced cardiomyocytes (iCM, Ieda/Srivastava Cell 2010 GMT factors), hepatocytes (iHep, Sekiya/Suzuki Nature 2011), pancreatic β-cells, oligodendrocytes. Advantages: skip pluripotent state risks (teratoma formation), faster, retains aging signatures (relevant for disease modeling of old-age neurons). Limit: efficiency typically low, immature relative to authentic counterparts. Combinatorial code per lineage. Wernig Stanford lab pioneer.'
        objectives: [Direct reprogramming]
