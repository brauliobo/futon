        question:
          pt: SCNT cloning (Wilmut 1996 Dolly → Mitalipov 2013 primates) marco para humanos foi…
          en: SCNT cloning (Wilmut 1996 Dolly → Mitalipov 2013 primates) human milestone was…
        choices:
          - Generation of human ESC lines via somatic cell nuclear transfer (SCNT) into enucleated oocytes (Tachibana/Mitalipov Cell 2013), restoring totipotency from adult somatic cells
          - First viable cloned human baby
          - Identical to iPSC reprogramming with no oocyte involvement
          - Pure animal-only cloning without human cell relevance
        correctAnswer: Generation of human ESC lines via somatic cell nuclear transfer (SCNT) into enucleated oocytes (Tachibana/Mitalipov Cell 2013), restoring totipotency from adult somatic cells
        rationale:
          pt: 'SCNT (somatic cell nuclear transfer) trajectory: Gurdon 1962 frog Xenopus enucleated oocyte injection somatic nucleus → tadpole (Nobel 2012). Wilmut Campbell Roslin Institute Edinburgh 1996/1997 — Dolly the sheep: first mammal SCNT (mammary cell nucleus → enucleated oocyte → reprogrammed → blastocyst → ewe → live lamb). 1997-2018: cattle, mice, pigs, cats, horses, dogs cloned. Tachibana Mitalipov Oregon Health & Science Univ Cell 2013 — first human nuclear-transfer ESCs (NT-ESCs) — fetal/neonatal fibroblast nucleus → enucleated oocyte → caffeine pulse + electrostimulation activate → blastocyst → ESC line derivation. Mitalipov primate cloning 2007 (Mitalipov Cell Stem Cell). Concurrent Chong/Lanza Adv Cell Tech competing line. Field stalled toward human reproductive cloning (universally banned). Therapeutic cloning rationale superseded iPSCs (autologous, sem need oocytes). Mitalipov pivot mitochondrial replacement therapy (MRT) parallel work.'
          en: 'SCNT (somatic cell nuclear transfer) trajectory: Gurdon 1962 frog Xenopus enucleated oocyte injection of somatic nucleus → tadpole (Nobel 2012). Wilmut Campbell Roslin Institute Edinburgh 1996/1997 — Dolly the sheep: first mammal SCNT (mammary cell nucleus → enucleated oocyte → reprogrammed → blastocyst → ewe → live lamb). 1997-2018: cattle, mice, pigs, cats, horses, dogs cloned. Tachibana/Mitalipov Oregon Health & Science Univ Cell 2013 — first human nuclear-transfer ESCs (NT-ESCs) — fetal/neonatal fibroblast nucleus → enucleated oocyte → caffeine pulse + electrostimulation activate → blastocyst → ESC line derivation. Mitalipov primate cloning 2007 (Mitalipov Cell Stem Cell). Concurrent Chong/Lanza Adv Cell Tech competing line. Field stalled toward human reproductive cloning (universally banned). Therapeutic cloning rationale superseded by iPSCs (autologous, no need for oocytes). Mitalipov pivoted to mitochondrial replacement therapy (MRT) parallel work.'
        objectives: [SCNT human]
