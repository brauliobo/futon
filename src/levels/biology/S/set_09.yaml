        difficulty: 5
        question:
          pt: Mitochondrial replacement therapy (MRT, UK 2015 + Mexico Zhang 2016) é…
          en: Mitochondrial replacement therapy (MRT, UK 2015 + Mexico Zhang 2016) is…
        choices:
          - Transfer of nuclear DNA from a maternal oocyte/zygote to enucleated donor oocyte/zygote with healthy mitochondria, preventing maternally inherited mitochondrial disease
          - Replacement of nuclear genome between unrelated individuals
          - Standard IVF without mitochondrial intervention
          - Surgical mitochondrial transplant in adults
        correctAnswer: Transfer of nuclear DNA from a maternal oocyte/zygote to enucleated donor oocyte/zygote with healthy mitochondria, preventing maternally inherited mitochondrial disease
        rationale:
          pt: 'Mitochondrial replacement therapy (MRT) / 3-parent IVF: addresses maternally inherited mitochondrial DNA disease (Leigh syndrome MELAS LHON ~1:5000 births). Maternal nuclear DNA + paternal sperm → embryo, mitochondrial DNA from donor. Methods: maternal spindle transfer (MST) — pre-fertilization spindle nucleus from maternal oocyte → enucleated donor oocyte; pronuclear transfer (PNT) — post-fertilization both pronuclei → enucleated donor zygote. UK first country legalized 2015 (HFEA approved Newcastle clinics). Mexico Zhang 2016 NEJM — first reported MRT baby (Jordanian woman Leigh syndrome carrier — clinic Zhang NY-based crossed border legality, controversial). Greece Embryotools 2019 trial. Healthy babies reported. Concerns: nuclear-mitochondrial incompatibility, heteroplasmy carryover (~5% maternal mtDNA carries over), long-term safety unknown. US FDA blocked 2015 omnibus appropriations rider. Field ~12 babies globally 2024.'
          en: 'Mitochondrial replacement therapy (MRT) / 3-parent IVF: addresses maternally inherited mitochondrial DNA disease (Leigh syndrome, MELAS, LHON, ~1:5000 births). Maternal nuclear DNA + paternal sperm → embryo, mitochondrial DNA from donor. Methods: maternal spindle transfer (MST) — pre-fertilization spindle nucleus from maternal oocyte → enucleated donor oocyte; pronuclear transfer (PNT) — post-fertilization, both pronuclei → enucleated donor zygote. UK first country to legalize 2015 (HFEA approved Newcastle clinics). Mexico Zhang 2016 NEJM — first reported MRT baby (Jordanian woman Leigh syndrome carrier — clinic Zhang NY-based crossed border for legality, controversial). Greece Embryotools 2019 trial. Healthy babies reported. Concerns: nuclear-mitochondrial incompatibility, heteroplasmy carryover (~5% maternal mtDNA carries over), long-term safety unknown. US FDA blocked 2015 omnibus appropriations rider. Field ~12 babies globally 2024.'
        objectives: [MRT 3-parent]
