      - type: choice
        difficulty: 5
        question:
          pt: Genomic imprinting (Surani Solter 1984) demonstrated…
          en: Genomic imprinting (Surani Solter 1984) demonstrated…
        choices:
          - "Parental origin matters: mouse zygotes with two maternal or two paternal pronuclei fail to develop, revealing parent-of-origin-specific gene expression patterns"
          - Maternal and paternal genomes are functionally equivalent
          - Genome doubling produces identical viable embryos
          - Random monoallelic expression of all genes
        correctAnswer: "Parental origin matters: mouse zygotes with two maternal or two paternal pronuclei fail to develop, revealing parent-of-origin-specific gene expression patterns"
        rationale:
          pt: 'Genomic imprinting (Surani Barton Norris Cambridge Nature 1984 + McGrath Solter Cell 1984): pronuclear transfer experiments — mouse zygotes with two maternal pronuclei (gynogenones) or two paternal pronuclei (androgenones) — both fail to develop. Maternal-only — embryo proper poor, extra-embryonic poor; paternal-only — placenta hyperdeveloped, embryo poor. Demonstrated parent-of-origin matters: certain genes expressed only paternal allele or only maternal allele due epigenetic marks (DNA methylation imprinting control regions ICRs). Examples: Igf2/H19 (paternal Igf2 / maternal H19), SNRPN/UBE3A Prader-Willi/Angelman syndromes 15q11-q13, BWS Beckwith-Wiedemann 11p15. ~100-200 imprinted genes mammals. Implications: cloning challenges (SCNT epigenetic reprogramming faulty), MRT (mitochondrial replacement) maternal-mitochondrial considerations, parthenogenesis impossible mammals (vs reptiles/amphibians). Origin: evolutionary conflict theory Haig (paternal genes promote fetal growth → resource extraction maternal cost; maternal genes restrain).'
          en: 'Genomic imprinting (Surani Cambridge Nature 1984 + McGrath/Solter Cell 1984): pronuclear transfer experiments — mouse zygotes with two maternal pronuclei (gynogenones) or two paternal pronuclei (androgenones) — both fail to develop. Maternal-only — embryo proper poor, extra-embryonic poor; paternal-only — placenta hyperdeveloped, embryo poor. Demonstrated parent-of-origin matters: certain genes expressed from only the paternal allele or only the maternal allele due to epigenetic marks (DNA methylation at imprinting control regions ICRs). Examples: Igf2/H19 (paternal Igf2 / maternal H19), SNRPN/UBE3A in Prader-Willi/Angelman syndromes 15q11-q13, BWS Beckwith-Wiedemann 11p15. ~100-200 imprinted genes in mammals. Implications: cloning challenges (SCNT epigenetic reprogramming faulty), MRT (mitochondrial replacement) maternal-mitochondrial considerations, parthenogenesis impossible in mammals (vs reptiles/amphibians). Origin: evolutionary conflict theory Haig (paternal genes promote fetal growth → resource extraction at maternal cost; maternal genes restrain).'
        objectives: [Genomic imprinting]
