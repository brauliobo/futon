          - In vivo development without any synthetic biology component
        correctAnswer: Engineered cells with synNotch receptors triggering downstream gene circuits to self-organize multilayered tissues from initially homogeneous populations
        rationale:
          pt: 'Synthetic morphogenesis: Toda Blauch Lim Yang Lim Tang Vergassola Wahl Lim Velasquez Brookes Lim Lim Lutkenhaus Toda Hammill Tang Pourjabbar Wong Heng Hubbard Levin Cuomo Coyle Yang Heaton Lim Goodwin Mukherjee Toda Cohen Lim Clarke Hess Toda Kang Wendell Lim Kelker Tabak Toda Pinkstaff Allen Toda Lim Science 2018 + Cell Stem Cell 2020): mammalian cells engineered synNotch (synthetic Notch receptors, Wendell Lim UCSF) — extracellular synthetic ligand (anti-GFP, anti-CD19) + Notch transmembrane + intracellular TF (e.g., Gal4-VP64) released upon ligand contact → activates target genes (cadherins, fluorescent reporters). Combined with cadherin-mediated adhesion: cells self-organize 2-3 layered structures genetically encoded. Demonstrated: programmable patterning, regeneration, lineage trees, tunable cell-cell logic gates. Aplicações: tissue engineering rational design, model embryogenesis principles, programmable therapeutics (CAR-T sensing two antigens via synNotch logic). Lim lab UCSF + Cell Design Labs founded 2016 (acquired Gilead 2017 ~$567M). Field synthetic developmental biology emerging programmable multicellular systems.'
          en: 'Synthetic morphogenesis: Toda/Wendell Lim UCSF Science 2018 + Cell Stem Cell 2020): mammalian cells engineered with synNotch (synthetic Notch receptors, Wendell Lim UCSF) — extracellular synthetic ligand (anti-GFP, anti-CD19) + Notch transmembrane + intracellular TF (e.g., Gal4-VP64) released upon ligand contact → activates target genes (cadherins, fluorescent reporters). Combined with cadherin-mediated adhesion: cells self-organize 2-3-layer structures genetically encoded. Demonstrated: programmable patterning, regeneration, lineage trees, tunable cell-cell logic gates. Applications: rational tissue-engineering design, model embryogenesis principles, programmable therapeutics (CAR-T sensing two antigens via synNotch logic). Lim lab UCSF + Cell Design Labs founded 2016 (acquired by Gilead 2017 ~$567M). Field of synthetic developmental biology emerging — programmable multicellular systems.'
