title:
  pt: Modelos de Embrião por Células-Tronco e Reprogramação Celular
  en: Stem-Cell-Based Embryo Models and Cellular Reprogramming
level: S
subject: biology
objectives:
  - Compreender pluripotência naïve, primed, formative
  - Reconhecer gastruloides, blastoides, SEMs (Hanna 2023)
  - Identificar PGCLCs, IVG, SCNT, mitochondrial replacement
  - Avaliar 2C/8C-like totipotência e direct lineage reprogramming
difficulty: 5
authorNotes: |
  Era pós-iPSC: stem-cell embryo models. Gastruloids (van den Brink/Martinez Arias/Lutolf
  2014), blastoids (Rivron Nature 2018, Liu/Polo iBlastoids 2021), ETX (Zernicka-Goetz),
  SEM (Tarazi/Hanna Weizmann Cell 2022/Cell 2023 stem-cell-based embryo model 14-day).
  Saitou/Hayashi PGCLCs in vitro gametogenesis. Yamanaka iPSC Nobel 2012. SCNT Dolly 1996,
  primate Mitalipov 2013. MRT UK 2015. 14-day rule ISSCR update 2021. 2C/8C totipotent.
example:
  question:
    pt: SEM (Stem-cell-based Embryo Model, Tarazi/Hanna Weizmann Cell 2022→Cell 2023) achievement foi…
    en: SEM (Stem-cell-based Embryo Model, Tarazi/Hanna Weizmann Cell 2022→Cell 2023) achievement was…
  choices:
    - Self-organized human stembryo from naïve PSCs combined with extra-embryonic-like cells, recapitulating ~14 days of development including amniotic cavity and gastrulation-like features without sperm/egg/uterus
    - Cloning of mammalian embryos via somatic cell nuclear transfer
    - Direct fertilization of synthetic gametes to produce viable offspring
    - 2D culture of pluripotent cells without 3D structure
  correctAnswer: Self-organized human stembryo from naïve PSCs combined with extra-embryonic-like cells, recapitulating ~14 days of development including amniotic cavity and gastrulation-like features without sperm/egg/uterus
  rationale:
    pt: 'SEM stem-cell-based embryo model (Tarazi Aguilera-Castrejon Joubran Ghanem Ashouokhi Roncato Wildschutz Haddad Oldak Gomez-Cesar Livnat Viukov Lokshtanov Naveh-Tassa Rose Hanna Hanna Hanna Weizmann Cell 2022 mouse → Oldak Wildschutz Aguilera-Castrejon Lokshtanov Joubran Ghanem Tarazi Stelzer Goldfarb Gribaudo Rose Roncato Ashouokhi Viukov Hu Livnat Pripluzhnyi Naveh-Tassa Bossi Bressan Bayerl Rinaldi Wildschutz Charlebois Aharon Cesar Smith Iglesias Bocker Yang Yu Goller Poudyal Sela Wildschutz Wakefield Carpenter Huberman Maor-Shoshani Rosenkrantz Avior Hanna Cell 2023 human): naïve human pluripotent stem cells (re-derived ground-state) + lineage-induced extra-embryonic-like cells (trophoblast TSC, hypoblast, primitive endoderm) self-assembled em 3D culture → estructure recapitulando blastocyst → epiblast → amniotic cavity formation → primitive streak/gastrulation-like ~ 14 days post-fertilization equivalent. No fertilization, no uterus. Subsequent papers Zernicka-Goetz Cambridge/Caltech (Pasque/Liu KU Leuven) similar. Implications: study early human development inaccessible (<6-8 weeks miscarriages, abortion samples scarce), birth defects, infertility, drug-screening teratogenicity, gastrulation logic. Ethics: not classical embryos (no fertilization) — regulatory grey zone. ISSCR 2021 update phased 14-day rule.'
    en: 'SEM stem-cell-based embryo model (Tarazi/Hanna Weizmann Cell 2022 mouse → Oldak/Hanna Cell 2023 human): naïve human pluripotent stem cells (re-derived ground-state) + lineage-induced extra-embryonic-like cells (trophoblast TSC, hypoblast, primitive endoderm) self-assembled in 3D culture → structure recapitulating blastocyst → epiblast → amniotic cavity formation → primitive streak/gastrulation-like ~14 days post-fertilization equivalent. No fertilization, no uterus. Subsequent papers Zernicka-Goetz Cambridge/Caltech (Pasque/Liu KU Leuven) similar. Implications: study early human development inaccessible (<6-8 weeks miscarriages, abortion samples scarce), birth defects, infertility, drug-screening teratogenicity, gastrulation logic. Ethics: not classical embryos (no fertilization) — regulatory grey zone. ISSCR 2021 update phased 14-day rule.'
