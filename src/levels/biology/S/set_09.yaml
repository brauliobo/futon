          en: Synthetic morphogenesis with programmable tissues (Toda/Lim 2018 synNotch) is…
        choices:
          - Engineered cells with synNotch receptors triggering downstream gene circuits to self-organize multilayered tissues from initially homogeneous populations
          - Pure 2D cell culture without spatial organization
