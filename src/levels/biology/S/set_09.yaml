          en: hESC-derived β-cell therapy (Vertex VX-880 NEJM 2024 T1D) milestone is…
        choices:
          - First clinical demonstration that hESC-derived islet cells reverse insulin dependence in T1D patients with immunosuppression, validating PSC therapy for diabetes
          - Standard pancreatic islet transplant from cadaver donors
          - Pure encapsulated drug delivery without cell component
          - Insulin pump technology without cell therapy
        correctAnswer: First clinical demonstration that hESC-derived islet cells reverse insulin dependence in T1D patients with immunosuppression, validating PSC therapy for diabetes
        rationale:
          pt: 'VX-880 / VX-264 / Sernova / ViaCyte: cell therapy T1D type 1 diabetes (autoimmune destruction β-cells → insulin-dependent). Vertex acquired Semma Therapeutics 2019 (Doug Melton Harvard β-cell differentiation protocol). VX-880: hESC-differentiated insulin-producing islet cells infused hepatic portal vein → liver implant → endogenous insulin secretion. Phase 1/2 ongoing 2022-2024 reported results — patients reduced/eliminated exogenous insulin requirement. Reduca Reichman et al NEJM 2024 (provisional results). Requires immunosuppression (tacrolimus + sirolimus) — limit to severe hypoglycemia-aware patients. Subsequent VX-264: encapsulated islets sem immunosuppression Phase 1/2 starting 2023. Concurrent: Sernova Cell Pouch (subQ scaffold + islets), ViaCyte (acquired Vertex 2022 PEC-Direct ESC-islets), CRISPR Therapeutics + ViaCyte VCTX210 hypoimmune-edited islets. Field decade vision: insulin-free T1D commonplace.'
          en: 'VX-880 / VX-264 / Sernova / ViaCyte: cell therapy for T1D type 1 diabetes (autoimmune destruction of β-cells → insulin-dependent). Vertex acquired Semma Therapeutics 2019 (Doug Melton Harvard β-cell differentiation protocol). VX-880: hESC-differentiated insulin-producing islet cells infused via hepatic portal vein → liver implant → endogenous insulin secretion. Phase 1/2 ongoing 2022-2024 reported results — patients reduced/eliminated exogenous insulin requirement. Reichman et al NEJM 2024 (provisional results). Requires immunosuppression (tacrolimus + sirolimus) — limited to severe hypoglycemia-aware patients. Subsequent VX-264: encapsulated islets without immunosuppression Phase 1/2 starting 2023. Concurrent: Sernova Cell Pouch (subQ scaffold + islets), ViaCyte (acquired by Vertex 2022 PEC-Direct ESC-islets), CRISPR Therapeutics + ViaCyte VCTX210 hypoimmune-edited islets. Field decade vision: insulin-free T1D commonplace.'
