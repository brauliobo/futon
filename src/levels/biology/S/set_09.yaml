          en: Lineage tracing technologies (CARLIN, GESTALT, LARRY) achievement are…
        choices:
          - CRISPR-based heritable barcoding or static barcode libraries enabling reconstruction of cell genealogies from scRNA-seq data, mapping fate decisions in development and tumors
          - Pure imaging without genetic component
          - Bulk tissue sequencing without single-cell resolution
          - Random fluorescent labeling without genealogical information
        correctAnswer: CRISPR-based heritable barcoding or static barcode libraries enabling reconstruction of cell genealogies from scRNA-seq data, mapping fate decisions in development and tumors
        rationale:
          pt: 'Lineage tracing single-cell: GESTALT (McKenna Findlay Gagnon Horwitz Schier Shendure Science 2016) — Genome Editing of Synthetic Target Arrays for Lineage Tracing — array of CRISPR target sites cumulatively edited over divisions, sequenced lineage. ScarTrace (Alemany Florescu van Oudenaarden Nature 2018) similar zebrafish. CARLIN (Bowling Klein Sefik Yang Vatanashevanopakorn Liu Klein Cell 2020) — CRISPR-Array Recorder of Lineage Information — heritable barcoding mouse + harvested via scRNA-seq (mRNA expression cassette readout). LARRY (Weinreb Klein Cell 2020) — Lineage and RNA Recovery — static viral barcode library combined scRNA-seq. Aplicações: hematopoiesis lineage hierarchies (Bowling, Weinreb 2020+), tumor evolution clonality, neural development. Subsequent: zebrafish complete embryo lineage Cell 2022 (Raj/Schier), prime-editing-based lineage recorders DNA Typewriter (Choi Shendure 2022 Nature), Bigtree, Camden. Field foundational developmental biology + cancer evolution.'
          en: 'Lineage tracing at single cell: GESTALT (McKenna/Shendure Science 2016) — Genome Editing of Synthetic Target Arrays for Lineage Tracing — array of CRISPR target sites cumulatively edited over divisions, sequenced for lineage. ScarTrace (Alemany/van Oudenaarden Nature 2018) similar in zebrafish. CARLIN (Bowling/Klein Cell 2020) — CRISPR-Array Recorder of Lineage Information — heritable barcoding in mouse + harvested via scRNA-seq (mRNA expression cassette readout). LARRY (Weinreb/Klein Cell 2020) — Lineage and RNA Recovery — static viral barcode library combined with scRNA-seq. Applications: hematopoiesis lineage hierarchies (Bowling, Weinreb 2020+), tumor evolution clonality, neural development. Subsequent: zebrafish complete embryo lineage Cell 2022 (Raj/Schier), prime-editing-based lineage recorders DNA Typewriter (Choi/Shendure Nature 2022), Bigtree, Camden. Field foundational for developmental biology + cancer evolution.'
        objectives: [Lineage tracing]
