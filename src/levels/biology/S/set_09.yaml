        question:
          pt: X inactivation (Lyon 1961) e Xist lncRNA (Brockdorff/Brown/Lee 1991) mecanismo é…
          en: X inactivation (Lyon 1961) and Xist lncRNA (Brockdorff/Brown/Lee 1991) mechanism is…
        choices:
          - Random silencing of one X chromosome in female mammals via Xist long noncoding RNA coating in cis, recruiting PRC2 H3K27me3 repressive heterochromatin
          - Permanent activation of both X chromosomes in females
          - Y-chromosome silencing in males via similar mechanism
          - DNA-level deletion of one X chromosome
        correctAnswer: Random silencing of one X chromosome in female mammals via Xist long noncoding RNA coating in cis, recruiting PRC2 H3K27me3 repressive heterochromatin
        rationale:
          pt: 'X chromosome inactivation (XCI): Mary Lyon 1961 hypothesis — random monoallelic silencing one X in females (XX) → dosage compensation male (XY) single X. Mosaic patches (calico cat fur classical phenotype). Xist (X-inactive specific transcript) — long noncoding RNA (~17kb), discovered Brockdorff Brown Cooper Swift Rastan Cell 1991, Brown Hendrich Rupert Lafrenière Xing Lawrence Willard Cell 1992. Transcribed only inactive X (Xi) → coats Xi chromosome in cis → recruits PRC2 (Polycomb Repressive Complex 2 — EZH2 → H3K27me3), HP1, DNA methylation, late-replication. Counts: Tsix antisense transcript regulates choice. XCI random ~ICM/epiblast except imprinted XCI extra-embryonic (paternal X always inactive). Aplicações: genetic disease X-linked carriers mosaicism, escape genes (~15-25% Xi genes escape silencing), naïve PSC reactivation pre-XCI state. Lee lab MGH 2024+ active research. Subsequent: XistARM (Wang Lee 2024) Bahrami Liu Song Zhou Zheng Bahrami Tao Wang Soong Zubrowska Bortolomeazzi Hou Stock Schäfer Spengler Mariko Mori Zheng Lee Cell 2024 reactivation Xi via Xist degradation.'
          en: 'X chromosome inactivation (XCI): Mary Lyon 1961 hypothesis — random monoallelic silencing of one X in females (XX) → dosage compensation with males (XY) single X. Mosaic patches (calico cat fur classical phenotype). Xist (X-inactive specific transcript) — long noncoding RNA (~17 kb), discovered Brockdorff Cell 1991, Brown Cell 1992. Transcribed only from the inactive X (Xi) → coats Xi chromosome in cis → recruits PRC2 (Polycomb Repressive Complex 2 — EZH2 → H3K27me3), HP1, DNA methylation, late-replication. Choice: Tsix antisense transcript regulates choice. XCI is random in ICM/epiblast except for imprinted XCI in extra-embryonic (paternal X always inactive). Applications: X-linked genetic disease in carriers (mosaicism), escape genes (~15-25% Xi genes escape silencing), naïve PSC reactivation of pre-XCI state. Lee lab MGH 2024+ active research.'
