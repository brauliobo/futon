        difficulty: 5
        question:
          pt: Partial reprogramming (Belmonte Salk Cell 2016) approach é…
          en: Partial reprogramming (Belmonte Salk Cell 2016) approach is…
        choices:
          - Cyclic short-pulse OSKM induction in vivo extends lifespan of progeroid mice and rejuvenates aged tissues without erasing cell identity
          - Permanent OSKM expression converting all cells to iPSCs
          - Pure deletion of OSKM genes from genome
          - Surgical organ replacement without genetic component
        correctAnswer: Cyclic short-pulse OSKM induction in vivo extends lifespan of progeroid mice and rejuvenates aged tissues without erasing cell identity
        rationale:
          pt: 'Partial reprogramming (Ocampo Reddy Martinez-Redondo Platero-Luengo Hatanaka Hishida Li Lam Magistretti Reddy Aizawa Goebl Soligalla Esteban Belmonte Salk Cell 2016): premise — full OSKM induction → iPSC + cancer; brief cyclic pulses 2-4 days OSKM → reset epigenetic age markers without identity loss → rejuvenation aged tissues. Demonstrated: Lmna progeroid mice (Hutchinson-Gilford progeria) treated cyclic OSKM (2 days/week) lived ~30% longer + improved muscle, skin, kidney, glucose metabolism. Subsequent: Sarkar Quarta Mukherjee Colville Paine Doan Han Kim Mathur Lopez-Garcia Bryan Ojha Marchington-Smith Sebastián Mukherjee Nehrenheim Lin Kerwin Bauerle Sarda Koshy Manning Burdine Conger Bishop Yu Sehnal Fu Skerker Sebastiao Schaffer Davies Brunet Nature 2023 short-term OSK reduces frailty mice. Companies: Altos Labs (Belmonte joined as scientific advisor 2022, Hal Barron CEO, ~$3B funded), Retro Biosciences ($180M Sam Altman 2022), Life Biosciences. Aging-rejuvenation field hot 2024+.'
          en: 'Partial reprogramming (Ocampo/Belmonte Salk Cell 2016): premise — full OSKM induction → iPSC + cancer; brief cyclic pulses of 2-4 days OSKM → reset epigenetic age markers without identity loss → rejuvenation of aged tissues. Demonstrated: Lmna progeroid mice (Hutchinson-Gilford progeria) treated with cyclic OSKM (2 days/week) lived ~30% longer + improved muscle, skin, kidney, glucose metabolism. Subsequent: Sarkar/Brunet Nature 2023 short-term OSK reduces frailty in mice. Companies: Altos Labs (Belmonte joined as scientific advisor 2022, Hal Barron CEO, ~$3B funded), Retro Biosciences ($180M Sam Altman 2022), Life Biosciences. Aging-rejuvenation field hot 2024+.'
        objectives: [Partial reprogramming]
