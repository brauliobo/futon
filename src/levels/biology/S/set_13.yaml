        question:
          pt: Lenacapavir twice-yearly PrEP (Gilead PURPOSE-1 NEJM 2024 SUNLENCA) é…
          en: Lenacapavir twice-yearly PrEP (Gilead PURPOSE-1 NEJM 2024 SUNLENCA) is…
        choices:
          - First-in-class HIV capsid inhibitor administered twice yearly subcutaneously, ~96-100% efficacy preventing HIV in PURPOSE-1 (cisgender women) and PURPOSE-2 (MSM/transgender) trials
          - Daily oral pre-exposure prophylaxis identical to Truvada
          - Pure post-exposure treatment without prevention
          - Vaccine-based prevention without antiviral component
        correctAnswer: First-in-class HIV capsid inhibitor administered twice yearly subcutaneously, ~96-100% efficacy preventing HIV in PURPOSE-1 (cisgender women) and PURPOSE-2 (MSM/transgender) trials
        rationale:
          pt: 'Lenacapavir (Sunlenca, Gilead): first-in-class HIV capsid inhibitor — small molecule binding HIV capsid (CA, p24) protein → disrupts capsid assembly + uncoating + nuclear import → blocks multiple viral life-cycle stages. FDA approved 2022 oral + injectable form heavily treatment-experienced HIV multi-drug-resistant infections (MDR HIV) treatment. Long half-life ~~1 year subcutaneous → twice-yearly dosing PrEP feasible. PURPOSE-1 trial (NEJM 2024 setembro Bekker Das Abdool Karim Lancet 2024 — Lillian Bekker Cape Town): cisgender women + adolescents 16-25 anos sub-Saharan Africa (South Africa Uganda) randomized lenacapavir vs daily oral Truvada vs Descovy. Lenacapavir 0/2134 infections — ~100% efficacy (vs ~16-39 background expected based incidence). PURPOSE-2 trial (Hare Wilcoxon NEJM 2024 setembro): MSM + transgender + GBM 8 sites (US LATAM Asia) — lenacapavir 2/2179 infections, ~96% efficacy (better daily oral comparator). Mecanismo: vs daily Truvada (tenofovir+emtricitabine) requiring strict adherence, lenacapavir 2x/year eliminates compliance issues. Major HIV prevention milestone 2024+. Implementation: Gilead generic licensing 2024 ~120 LMICs. WHO recommendation pending. UNAIDS 2030 ending AIDS goals trajectory closer realistic.'
          en: 'Lenacapavir (Sunlenca, Gilead): first-in-class HIV capsid inhibitor — small molecule binding HIV capsid (CA, p24) protein → disrupts capsid assembly + uncoating + nuclear import → blocks multiple viral life-cycle stages. FDA approved 2022 oral + injectable for heavily treatment-experienced HIV multi-drug-resistant infections (MDR HIV) treatment. Long half-life ~1 year subcutaneous → twice-yearly dosing PrEP feasible. PURPOSE-1 trial (NEJM September 2024, Bekker Cape Town): cisgender women + adolescents 16-25 years old sub-Saharan Africa (South Africa Uganda) randomized lenacapavir vs daily oral Truvada vs Descovy. Lenacapavir 0/2134 infections — ~100% efficacy (vs ~16-39 background expected based on incidence). PURPOSE-2 trial (NEJM September 2024): MSM + transgender + GBM 8 sites (US LATAM Asia) — lenacapavir 2/2179 infections, ~96% efficacy (better than daily oral comparator). Mechanism: vs daily Truvada (tenofovir+emtricitabine) requiring strict adherence, lenacapavir 2x/year eliminates compliance issues. Major HIV prevention milestone 2024+. Implementation: Gilead generic licensing 2024 to ~120 LMICs. WHO recommendation pending. UNAIDS 2030 ending AIDS goals trajectory closer to realistic.'
        objectives: [Lenacapavir PrEP]
