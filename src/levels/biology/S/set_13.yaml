        question:
          pt: Long COVID / PASC pathophysiology emerging mechanisms são…
          en: Long COVID / PASC pathophysiology emerging mechanisms are…
        choices:
          - Multifactorial — viral persistence in tissues, microvascular dysfunction, autoimmunity, dysautonomia, mast cell activation; affects ~10-30% of post-COVID patients with diverse symptoms
