        question:
          pt: Hepatitis C cure (sofosbuvir Gilead Sovaldi 2013 → DAA combinations) é…
          en: Hepatitis C cure (sofosbuvir Gilead Sovaldi 2013 → DAA combinations) is…
        choices:
          - Direct-acting antivirals (NS5B polymerase inhibitor sofosbuvir + NS5A/protease) achieving ~95-99% sustained virologic response in 8-12 weeks, transforming HCV from chronic to curable
          - Pure interferon-only therapy unchanged from 1990s
          - Liver transplant required for all HCV patients
          - Symptomatic management without virological cure
        correctAnswer: Direct-acting antivirals (NS5B polymerase inhibitor sofosbuvir + NS5A/protease) achieving ~95-99% sustained virologic response in 8-12 weeks, transforming HCV from chronic to curable
        rationale:
          pt: 'Hepatitis C cure DAA (Direct-Acting Antiviral) revolution: sofosbuvir (Gilead Sovaldi FDA 2013, $84000/12-week course initially $1000/pill) — first NS5B polymerase inhibitor (nucleotide analog), highly potent + barrier resistance + pan-genotypic. Combinations with NS5A inhibitors (ledipasvir, velpatasvir, daclatasvir) + NS3/4A protease inhibitors (grazoprevir, voxilaprevir) → fixed-dose tablets: Harvoni (sofosbuvir/ledipasvir 2014), Epclusa (sofosbuvir/velpatasvir 2016), Mavyret (glecaprevir/pibrentasvir AbbVie 2017), Vosevi (salvage 2017). Cure rates: ~95-99% sustained virologic response (SVR12, virus undetectable 12 weeks post-treatment) all genotypes. Treatment 8-12 weeks oral, mild side effects (vs 48-week interferon + ribavirin pre-2013 ~50% cure, brutal toxicity). Marca paradigma chronic-to-curable. Pre-DAA: HCV chronic ~70% infections → cirrhosis 25% → hepatocellular carcinoma. WHO 2030 elimination target HCV. Cost reduction: generics $50-100/course MSF/Doctors Without Borders + Egypt partnerships (~5M cured Egypt 2014-2020). Subsequent: HBV (hepatitis B) cure pursuit ongoing — chronic suppression NUC nucleoside analogs (entecavir, tenofovir) but functional cure rare. RNA interference siRNA (bepirovirsen GSK Phase 3 2024+).'
          en: 'Hepatitis C cure DAA (Direct-Acting Antiviral) revolution: sofosbuvir (Gilead Sovaldi FDA 2013, $84000/12-week course initially $1000/pill) — first NS5B polymerase inhibitor (nucleotide analog), highly potent + high barrier to resistance + pan-genotypic. Combinations with NS5A inhibitors (ledipasvir, velpatasvir, daclatasvir) + NS3/4A protease inhibitors (grazoprevir, voxilaprevir) → fixed-dose tablets: Harvoni (sofosbuvir/ledipasvir 2014), Epclusa (sofosbuvir/velpatasvir 2016), Mavyret (glecaprevir/pibrentasvir AbbVie 2017), Vosevi (salvage 2017). Cure rates: ~95-99% sustained virologic response (SVR12, virus undetectable 12 weeks post-treatment) across all genotypes. Treatment 8-12 weeks oral, mild side effects (vs 48-week interferon + ribavirin pre-2013 ~50% cure, brutal toxicity). Marks paradigm chronic-to-curable. Pre-DAA: HCV chronic in ~70% of infections → cirrhosis in 25% → hepatocellular carcinoma. WHO 2030 elimination target for HCV. Cost reduction: generics $50-100/course MSF/Doctors Without Borders + Egypt partnerships (~5M cured in Egypt 2014-2020). Subsequent: HBV (hepatitis B) cure pursuit ongoing — chronic suppression with NUC nucleoside analogs (entecavir, tenofovir) but functional cure rare. RNA interference siRNA (bepirovirsen GSK Phase 3 2024+).'
        objectives: [HCV cure DAA]
