        correctAnswer: Multifactorial — viral persistence in tissues, microvascular dysfunction, autoimmunity, dysautonomia, mast cell activation; affects ~10-30% of post-COVID patients with diverse symptoms
        rationale:
          pt: 'Long COVID / PASC (Post-Acute Sequelae of SARS-CoV-2): persistent symptoms >3 meses post-acute infection. Estimates ~10-30% adult cases (~older adult higher risk, female:male 2:1, prior moderate-severe disease + asymptomatic both possible). ~200+ symptoms reported: fatigue (~70%), brain fog (~50%), POTS-like dysautonomia, dyspnea, post-exertional malaise (PEM, ME/CFS overlap), sleep disturbance, chest pain. Mechanisms (Iwasaki Yale Cell 2024 review): (1) Viral persistence — SARS-CoV-2 RNA + protein detected gut, lymph nodes, brain months post (Stein/Iwasaki Nat 2022 spike protein circulating), (2) Autoimmunity — autoantibodies novel/elevated (Wang/Iwasaki Nat 2024), (3) Microvascular dysfunction — fibrin amyloid microclots (Pretorius South Africa), endothelial inflammation, (4) Dysautonomia POTS — autonomic nervous system, baroreflex impairment, (5) Mast cell activation, (6) Reactivation latent viruses (EBV, HHV-6 — Mehandru/Iwasaki Nat 2023). RECOVER initiative NIH ~$1.5B 2021+ — clinical trial network long COVID. Treatment: Paxlovid extended (Iwasaki Yale STOP-PASC), Pemgarda monoclonal, mast cell stabilizers, low-dose naltrexone, SSRIs, autoimmune therapies (IVIG, B-cell depletion). Field 2024 active rare clinical trials results emerging — humble vs. complexity. Patient communities + advocacy critical recognition.'
          en: 'Long COVID / PASC (Post-Acute Sequelae of SARS-CoV-2): persistent symptoms >3 months post-acute infection. Estimates ~10-30% of adult cases (older adults higher risk, female:male 2:1, prior moderate-severe disease + asymptomatic both possible). ~200+ symptoms reported: fatigue (~70%), brain fog (~50%), POTS-like dysautonomia, dyspnea, post-exertional malaise (PEM, ME/CFS overlap), sleep disturbance, chest pain. Mechanisms (Iwasaki Yale Cell 2024 review): (1) Viral persistence — SARS-CoV-2 RNA + protein detected in gut, lymph nodes, brain months post (Stein/Iwasaki Nat 2022 spike protein circulating), (2) Autoimmunity — autoantibodies novel/elevated (Wang/Iwasaki Nat 2024), (3) Microvascular dysfunction — fibrin amyloid microclots (Pretorius South Africa), endothelial inflammation, (4) Dysautonomia POTS — autonomic nervous system, baroreflex impairment, (5) Mast cell activation, (6) Reactivation of latent viruses (EBV, HHV-6 — Mehandru/Iwasaki Nat 2023). RECOVER initiative NIH ~$1.5B 2021+ — clinical trial network for long COVID. Treatment: extended Paxlovid (Iwasaki Yale STOP-PASC), Pemgarda monoclonal, mast cell stabilizers, low-dose naltrexone, SSRIs, autoimmune therapies (IVIG, B-cell depletion). Field 2024 active — rare clinical trial results emerging — humble vs. complexity. Patient communities + advocacy critical for recognition.'
