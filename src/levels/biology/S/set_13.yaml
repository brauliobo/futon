title:
  pt: Virologia e Preparação para Pandemias
  en: Virology and Pandemic Preparedness
level: S
subject: biology
objectives:
  - Compreender SARS-CoV-2 origens, spike S-2P, Omicron
  - Reconhecer H5N1 dairy 2024, Mpox clade I, Marburg Rwanda
  - Identificar bnAbs HIV, lenacapavir, Ebola Ervebo
  - Avaliar wastewater surveillance, polio eradication, WHO IHR
difficulty: 5
authorNotes: |
  Pandemic-era virology 2020+: SARS-CoV-2 origin Worobey/Cao, spike S-2P Wrapp/McLellan,
  Omicron immune escape Pfizer adapted, H5N1 dairy cattle 2024 USDA, Mpox clade I 2024
  DRC→Africa WHO PHEIC, Marburg Rwanda 2024 outbreak. HIV: VRC01/3BNC117 bnAbs, Gilead
  lenacapavir PURPOSE-1 NEJM 2024 ~96% efficacy. HPV Gardasil, sofosbuvir HCV cure 2013,
  Ebola Ervebo (rVSV) FDA 2019. Polio GPEI nOPV2. Wastewater surveillance polio NY 2022.
example:
  question:
    pt: SARS-CoV-2 spike S-2P prefusion stabilization (Wrapp/McLellan Cell 2020) é…
    en: SARS-CoV-2 spike S-2P prefusion stabilization (Wrapp/McLellan Cell 2020) is…
  choices:
    - Two proline substitutions (K986P/V987P) in spike heptad repeat 1 locking the trimer in prefusion conformation, central to mRNA vaccine design and structural biology
    - Pure post-fusion conformation without stabilization
    - Random mutagenesis without targeted modifications
    - Wild-type spike sequence without engineering
  correctAnswer: Two proline substitutions (K986P/V987P) in spike heptad repeat 1 locking the trimer in prefusion conformation, central to mRNA vaccine design and structural biology
  rationale:
    pt: 'SARS-CoV-2 spike S-2P (Wrapp Wang Corbett Goldsmith Hsieh Abiona Graham McLellan UT Austin + NIAID Cell 2020 fevereiro): two proline substitutions K986P + V987P em spike S-2P version (precursor para Pallesen 2017 PNAS MERS-CoV S-2P design), localizadas heptad repeat 1 (HR1) hinge region between RBD/S1 e fusion machinery S2. Prolines disrupt α-helix flexibility → trap spike pre-fusion conformation (initial state on virus surface, before ACE2 binding triggers conformational rearrangement to post-fusion). Vantagens: (1) prefusion spike better immunogen (~10x more potent neutralizing antibodies vs post-fusion baseline), (2) recapitulates virus-surface antigen, (3) more stable production purification. Used in: mRNA-1273 (Moderna/NIAID), BNT162b2 (Pfizer/BioNTech), Novavax NVX-CoV2373 (recombinant nanoparticle), J&J Janssen Ad26 vector. Foundation Jason McLellan UT Austin — also designed RSV-F prefusion stabilization (Nirsevimab, Moderna RSV vaccines later). HexaPro (Hsieh Goldsmith Wang Wrapp Schaub Bouton Abiona McLellan Science 2020) — improved with 6 prolines, hyperstable prefusion. Spike structural biology platform extends para vaccine design seasonal flu, RSV, HMPV, parainfluenza.'
    en: 'SARS-CoV-2 spike S-2P (Wrapp/McLellan UT Austin + NIAID Cell February 2020): two proline substitutions K986P + V987P in S-2P version (precursor was Pallesen 2017 PNAS MERS-CoV S-2P design), located in heptad repeat 1 (HR1) hinge region between RBD/S1 and fusion machinery S2. Prolines disrupt α-helix flexibility → trap spike in pre-fusion conformation (initial state on virus surface, before ACE2 binding triggers conformational rearrangement to post-fusion). Advantages: (1) prefusion spike is a better immunogen (~10x more potent neutralizing antibodies vs post-fusion baseline), (2) recapitulates virus-surface antigen, (3) more stable for production and purification. Used in: mRNA-1273 (Moderna/NIAID), BNT162b2 (Pfizer/BioNTech), Novavax NVX-CoV2373 (recombinant nanoparticle), J&J Janssen Ad26 vector. Foundation by Jason McLellan UT Austin — also designed RSV-F prefusion stabilization (Nirsevimab, Moderna RSV vaccines later). HexaPro (Hsieh/McLellan Science 2020) — improved with 6 prolines, hyperstable prefusion. Spike structural biology platform extends to vaccine design for seasonal flu, RSV, HMPV, parainfluenza.'
