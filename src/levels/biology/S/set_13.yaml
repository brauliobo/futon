        rationale:
          pt: 'Pan-coronavirus / pan-sarbecovirus vaccines: address evolving SARS-CoV-2 + future spillover (SARS-CoV-3?). Strategy: induce broad immune response covering multiple coronavirus species, RBDs (receptor-binding domains) various sarbecoviruses (SARS-CoV-1, SARS-CoV-2, bat WIV1 + RaTG13 + Banal-52, pangolin GD/MP). SpFN (Spike Ferritin Nanoparticle) Walter Reed Army Institute Research (Joyce Andrews Modjarrad et al SCIENCE 2021): 24-mer ferritin self-assembling nanoparticle displays SARS-CoV-2 spike trimers — WRAIR-SARS-CoV-2 SpFN Phase 1 2021-2022 (NCT04784767), expanded indications WRAIR-IPDF (Pan-Influenza HA + WRAIR-Sarbe pan-sarbeco) 2023+ (Branche Frey Joyce Walsh Modjarrad Lancet 2024). Concurrent: NIH-VRC tetravalent pan-sarbeco mRNA (Pyle 2022), Caltech mosaic-8 nanoparticle (Cohen Bjorkman Science 2021/2022 ~8 different RBDs). DARPA-funded next-gen pandemic vaccines. Limit: balance breadth vs immunogenicity individual variants, cross-reactive ADCC vs neutralizing, durability. Field 2024 active — universal flu (Krammer Mt Sinai stalk-targeting), pan-coronavirus, pan-RSV vaccines pipeline. CEPI funding $200M+ pan-coronavirus.'
          en: 'Pan-coronavirus / pan-sarbecovirus vaccines: address evolving SARS-CoV-2 + future spillover (SARS-CoV-3?). Strategy: induce broad immune response covering multiple coronavirus species, RBDs (receptor-binding domains) of various sarbecoviruses (SARS-CoV-1, SARS-CoV-2, bat WIV1 + RaTG13 + Banal-52, pangolin GD/MP). SpFN (Spike Ferritin Nanoparticle) Walter Reed Army Institute Research (Joyce/Modjarrad et al SCIENCE 2021): 24-mer ferritin self-assembling nanoparticle displays SARS-CoV-2 spike trimers — WRAIR-SARS-CoV-2 SpFN Phase 1 2021-2022 (NCT04784767), expanded indications WRAIR-IPDF (Pan-Influenza HA + WRAIR-Sarbe pan-sarbeco) 2023+ (Branche Lancet 2024). Concurrent: NIH-VRC tetravalent pan-sarbeco mRNA (Pyle 2022), Caltech mosaic-8 nanoparticle (Cohen/Bjorkman Science 2021/2022 ~8 different RBDs). DARPA-funded next-gen pandemic vaccines. Limit: balance breadth vs immunogenicity for individual variants, cross-reactive ADCC vs neutralizing, durability. Field 2024 active — universal flu (Krammer Mt Sinai stalk-targeting), pan-coronavirus, pan-RSV vaccines pipeline. CEPI funding $200M+ pan-coronavirus.'
