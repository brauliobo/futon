        question:
          pt: WHO Pandemic Treaty / IHR amendments (2024 ongoing) goals são…
          en: WHO Pandemic Treaty / IHR amendments (2024 ongoing) goals are…
        choices:
          - International framework for pandemic prevention/preparedness/response with pathogen access + benefit sharing (PABS) + technology transfer + financing — partial 2024 IHR amendments approved, full treaty deferred
          - Already-completed binding global pandemic legislation
          - Pure US-only pandemic legislation
          - Repeal of all International Health Regulations
        correctAnswer: International framework for pandemic prevention/preparedness/response with pathogen access + benefit sharing (PABS) + technology transfer + financing — partial 2024 IHR amendments approved, full treaty deferred
        rationale:
          pt: 'WHO Pandemic Agreement (formerly Pandemic Treaty / WHO CA+ Convention, Agreement, Other Instrument): negotiations 2022+ post-COVID. Goal: global framework prevent + prepare + respond future pandemics. Key issues: (1) Pathogen Access and Benefit-Sharing (PABS) — countries share pathogen samples + sequence data → fair access vaccines, treatments, diagnostics manufactured. Tension: developed countries access pathogens, LMICs perceive insufficient benefit return (COVID vaccine inequity 2020-2022). (2) Technology transfer — manufacturing capability LMICs (mRNA hub South Africa Afrigen 2021+, Sinergium Argentina, Bio E India). (3) Sustainable financing — FAQ ~$10-30B/year preparedness needs, currently ~$3B Worldwide. (4) Governance + WHO emergency authority. (5) National sovereignty concerns (perceived lockdown mandates) — political/public misinformation. Status 2024: World Health Assembly junho 2024 — full treaty NOT adopted (ongoing negotiations, target 2025), IHR (International Health Regulations 2005) amendments adopted maio 2024 (definitions PHEIC, equity provisions, financing). Full treaty deferred WHA 2025. Concurrent: Pandemic Fund WHO + World Bank 2022 ~$2B initial. CEPI Coalition Epidemic Preparedness Innovations vaccine R&D priority pathogens. Field political-scientific complex — pandemic memory fading challenges sustained commitment.'
          en: 'WHO Pandemic Agreement (formerly Pandemic Treaty / WHO CA+ Convention, Agreement, Other Instrument): negotiations 2022+ post-COVID. Goal: global framework to prevent + prepare + respond to future pandemics. Key issues: (1) Pathogen Access and Benefit-Sharing (PABS) — countries share pathogen samples + sequence data → fair access to vaccines, treatments, diagnostics manufactured. Tension: developed countries access pathogens, LMICs perceive insufficient benefit return (COVID vaccine inequity 2020-2022). (2) Technology transfer — manufacturing capability in LMICs (mRNA hub South Africa Afrigen 2021+, Sinergium Argentina, Bio E India). (3) Sustainable financing — ~$10-30B/year preparedness needs, currently ~$3B worldwide. (4) Governance + WHO emergency authority. (5) National sovereignty concerns (perceived lockdown mandates) — political/public misinformation. Status 2024: World Health Assembly June 2024 — full treaty NOT adopted (ongoing negotiations, target 2025), IHR (International Health Regulations 2005) amendments adopted May 2024 (definitions of PHEIC, equity provisions, financing). Full treaty deferred to WHA 2025. Concurrent: Pandemic Fund WHO + World Bank 2022 ~$2B initial. CEPI Coalition for Epidemic Preparedness Innovations vaccine R&D for priority pathogens. Field political-scientific complex — pandemic memory fading challenges sustained commitment.'
        objectives: [WHO pandemic treaty]
