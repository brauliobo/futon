        question:
          pt: HIV broadly neutralizing antibodies (bnAbs VRC01, 3BNC117, PGT121) impact é…
          en: HIV broadly neutralizing antibodies (bnAbs VRC01, 3BNC117, PGT121) impact is…
        choices:
          - Identification of rare antibodies neutralizing diverse HIV strains via conserved epitopes (CD4 binding site, V1V2 glycan, V3) inspiring vaccine design and passive immunization trials
          - Failed clinical research without insights
          - HIV cures via antibody alone in standard care
          - Pure ART antiretroviral without antibody component
        correctAnswer: Identification of rare antibodies neutralizing diverse HIV strains via conserved epitopes (CD4 binding site, V1V2 glycan, V3) inspiring vaccine design and passive immunization trials
        rationale:
          pt: 'HIV bnAbs (broadly neutralizing antibodies): rare antibodies developed ~10-20% chronically infected long-term progressors → diverse HIV strains neutralized. Identified via single B-cell sorting from elite neutralizers, sequence patient-specific antibody libraries. Major bnAb classes: CD4 binding site (VRC01 [Wu Yang Li Schmidt Wycuff Mascola NIH-VRC 2010 Cell], 3BNC117 [Scheid Mouquet Klein Caskey Nussenzweig 2011 Nature], CH103 [Liao Lynch 2013 Cell]); V1V2 glycan (PG9, PG16, CAP256, PGT145); V3-glycan supersite (PGT121, 10-1074); membrane-proximal external region MPER (10E8, VRC42); fusion peptide (VRC34). Difficult immunogen design: bnAbs require unusual maturation (long CDR-H3 loops, somatic hypermutation 30%+ vs typical 5-10%). Subsequent clinical: Antibody-Mediated Prevention (AMP) trial VRC01 NEJM 2021 — partial protection (~75% sensitive strains, low overall ~30%). Passive immunization combination 3BNC117+10-1074 (Mendoza Caskey Nat 2018), broadly suppress viremia. Vaccine candidates germline-targeting immunogens (eOD-GT8 60-mer Schief Scripps + Stanford 2019 Phase 1 trial) — induce VRC01-like precursor B cells (Nature 2021 IAVI G002 trial). Long-acting formulations (LS Fc mutations extend half-life ~6 meses). Field active 2024+ HIV cure + prevention strategies bnAb-based.'
          en: 'HIV bnAbs (broadly neutralizing antibodies): rare antibodies developed in ~10-20% of chronically infected long-term progressors → neutralize diverse HIV strains. Identified via single B-cell sorting from elite neutralizers, sequencing of patient-specific antibody libraries. Major bnAb classes: CD4 binding site (VRC01 [NIH-VRC 2010 Cell], 3BNC117 [Nussenzweig 2011 Nature], CH103); V1V2 glycan (PG9, PG16, CAP256, PGT145); V3-glycan supersite (PGT121, 10-1074); membrane-proximal external region MPER (10E8, VRC42); fusion peptide (VRC34). Difficult immunogen design: bnAbs require unusual maturation (long CDR-H3 loops, somatic hypermutation 30%+ vs typical 5-10%). Subsequent clinical: Antibody-Mediated Prevention (AMP) trial VRC01 NEJM 2021 — partial protection (~75% against sensitive strains, low overall ~30%). Passive immunization with combination 3BNC117+10-1074 (Mendoza/Caskey Nat 2018) broadly suppresses viremia. Vaccine candidates: germline-targeting immunogens (eOD-GT8 60-mer Schief Scripps + Stanford 2019 Phase 1 trial) — induce VRC01-like precursor B cells (Nature 2021 IAVI G002 trial). Long-acting formulations (LS Fc mutations extend half-life ~6 months). Field active 2024+ HIV cure + prevention strategies bnAb-based.'
        objectives: [HIV bnAbs]
      - type: choice
