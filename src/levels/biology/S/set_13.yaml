pages:
  - title:
      pt: Página 1 — Virologia pandêmica
      en: Page 1 — Pandemic-era virology
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: SARS-CoV-2 origins (Worobey/Pekar/Andersen Science 2022) evidence supports…
          en: SARS-CoV-2 origins (Worobey/Pekar/Andersen Science 2022) evidence supports…
        choices:
          - Two-spillover zoonotic origin at Huanan Seafood Market Wuhan (lineages A and B), with multiple early cases epidemiologically linked to live-animal stalls
          - Definitive proof of laboratory escape from WIV
          - Origin in distant geographic location unrelated to Wuhan
          - Pure climate change without animal vector
        correctAnswer: Two-spillover zoonotic origin at Huanan Seafood Market Wuhan (lineages A and B), with multiple early cases epidemiologically linked to live-animal stalls
        rationale:
          pt: 'SARS-CoV-2 origins controversy: Worobey Levy Serrano Crits-Christoph Pekar Goldstein Rasmussen Kraemer Newman Koopmans Suchard Wertheim Lemey van Dorp Hoenen Bedford Garry Holmes Andersen Rambaut Garry Penn/Arizona/Scripps/Sydney/Cambridge/Edinburgh Science 2022 julho — two papers epidemiology + phylogenetics. Findings: early cases clustered around Huanan Seafood Market Wuhan (especially live-animal stalls western section); both major SARS-CoV-2 lineages (A + B) circulated market early; environmental samples positive on stalls. Two distinct introductions zoonotic origin (likely separate spillover events animals → humans). Pekar Magee Parker Moshiri Izhikevich Havens Gangavarapu Malpica Cuomo Kosakovsky Pond Scheffler Pekar Worobey Garry Andersen Suchard Lemey Rambaut Wertheim Science 2022 phylogeny supports two separate spillovers. Animal candidates: raccoon dogs, civets, ferret-badgers — all sold at market early 2020. Concurrent: WHO-China joint report 2021 zoonotic likely; lab leak hypothesis WIV (Wuhan Institute Virology) work BSL-2 SARS-related coronaviruses, persists especially US intelligence community DOE assessment "low confidence" lab leak 2023; FBI similar. Field 2024 unresolved consensus zoonotic among virologists, lab-leak among intelligence/political. Pandemic preparedness implications: preventing future spillovers requires market regulation + biosafety oversight.'
          en: 'SARS-CoV-2 origins controversy: Worobey/Pekar/Andersen Science July 2022 — two papers on epidemiology + phylogenetics. Findings: early cases clustered around Huanan Seafood Market Wuhan (especially live-animal stalls in western section); both major SARS-CoV-2 lineages (A + B) circulated at market early; environmental samples positive on stalls. Two distinct introductions zoonotic origin (likely separate spillover events animals → humans). Pekar/Wertheim/Worobey Science 2022 phylogeny supports two separate spillovers. Animal candidates: raccoon dogs, civets, ferret-badgers — all sold at market in early 2020. Concurrent: WHO-China joint report 2021 zoonotic likely; lab leak hypothesis around WIV (Wuhan Institute of Virology) work BSL-2 SARS-related coronaviruses, persists especially in US intelligence community — DOE assessment "low confidence" lab leak 2023; FBI similar. Field 2024 unresolved — consensus zoonotic among virologists, lab-leak among intelligence/political. Pandemic preparedness implications: preventing future spillovers requires market regulation + biosafety oversight.'
        objectives: [SARS-CoV-2 origins]
      - type: choice
        difficulty: 5
        question:
          pt: SARS-CoV-2 Omicron variant immune escape (Cele/Sigal Nature 2022) demonstrated…
          en: SARS-CoV-2 Omicron variant immune escape (Cele/Sigal Nature 2022) demonstrated…
        choices:
          - ~30+ spike mutations with substantial neutralizing antibody escape vs prior variants and vaccinal sera, requiring updated boosters and clarifying durability of T-cell vs antibody responses
          - Identical neutralization to ancestral strain
          - Pure increase in transmissibility without immune escape
          - Total cessation of vaccine effectiveness
        correctAnswer: ~30+ spike mutations with substantial neutralizing antibody escape vs prior variants and vaccinal sera, requiring updated boosters and clarifying durability of T-cell vs antibody responses
        rationale:
          pt: 'SARS-CoV-2 Omicron BA.1 (B.1.1.529): emerged Botswana/South Africa novembro 2021. ~30+ amino acid mutations spike (vs ~3-4 typical earlier variants), unprecedented divergence — possibly emerged chronic immunocompromised infection ou spillback animals. Cele Jackson Gazy Khan Khoury Karim Karim Khoury Dijke Mounts Lambson Bele Nadkarni Kaur Lewis Khan Boulle Thompson Fonseca Alexander Cele Khaza Sandile Cele Sigal Nature 2022 jan: BA.1 plasma neutralization assays — significant ~10-30x reduction Pfizer 2-dose serum vs ancestral. Convalescent sera (recoverde infection prior strain) similar. Antibody escape via RBD mutations (G339D, K417N, S371L, S375F, N440K, S477N, T478K, E484A, Q493R, G496S, Q498R, N501Y, Y505H), N-terminal domain (NTD) deletions/insertions. T-cell epitopes more conserved → cellular immunity preserved (less severe disease + reduced hospitalizations vaccinated). Subsequent: BA.2, BA.4, BA.5, BQ.1, XBB.1.5, JN.1, KP.3 — continual immune-escape iteration. Updated boosters: Pfizer/Moderna BA.4/5 outono 2022, XBB.1.5 outono 2023, JN.1/KP.2 outono 2024. Vacinal strategy continues approved updates anuais similar influenza. Long-term: variant-proof pan-coronavirus vaccines goal (SpFN ferritin nanoparticle Walter Reed Phase 1 2024+).'
          en: 'SARS-CoV-2 Omicron BA.1 (B.1.1.529): emerged Botswana/South Africa November 2021. ~30+ amino acid mutations in spike (vs ~3-4 typical for earlier variants), unprecedented divergence — possibly emerged from chronic infection in immunocompromised host or spillback from animals. Cele/Sigal Nature January 2022: BA.1 plasma neutralization assays — significant ~10-30x reduction in Pfizer 2-dose serum vs ancestral. Convalescent sera (recovered from infection with prior strain) similar. Antibody escape via RBD mutations (G339D, K417N, S371L, S375F, N440K, S477N, T478K, E484A, Q493R, G496S, Q498R, N501Y, Y505H), N-terminal domain (NTD) deletions/insertions. T-cell epitopes more conserved → cellular immunity preserved (less severe disease + reduced hospitalizations in vaccinated). Subsequent: BA.2, BA.4, BA.5, BQ.1, XBB.1.5, JN.1, KP.3 — continual immune-escape iteration. Updated boosters: Pfizer/Moderna BA.4/5 fall 2022, XBB.1.5 fall 2023, JN.1/KP.2 fall 2024. Vaccine strategy continues with approved annual updates similar to influenza. Long-term: variant-proof pan-coronavirus vaccines as goal (SpFN ferritin nanoparticle Walter Reed Phase 1 2024+).'
        objectives: [Omicron immune escape]
      - type: choice
        difficulty: 5
        question:
          pt: H5N1 dairy cattle outbreak USA março 2024+ é…
          en: H5N1 dairy cattle outbreak USA March 2024+ is…
        choices:
          - Cross-species adaptation of H5N1 highly pathogenic avian influenza into dairy cattle (mostly subclinical), with limited human cases (~60+) and concerning pandemic preparedness implications
          - Standard avian-only outbreak without mammalian transmission
          - Identified human pandemic with widespread sustained transmission
          - Plant disease outbreak unrelated to influenza
        correctAnswer: Cross-species adaptation of H5N1 highly pathogenic avian influenza into dairy cattle (mostly subclinical), with limited human cases (~60+) and concerning pandemic preparedness implications
        rationale:
          pt: 'H5N1 dairy cattle outbreak (USDA março 2024+): clade 2.3.4.4b H5N1 highly pathogenic avian influenza (HPAI) detected dairy cattle Texas + multiple states (>15 states ~600 herds 2024 outubro). Spillover wild birds → cattle (likely first incursion late 2023). Mostly subclinical/mild bovine disease — depressed milk production, reduced appetite. Mammary gland tropism unique — virus shed in milk (high titers, pasteurization neutralizes). Spread cattle-to-cattle via fomites, milking equipment. Human cases: ~60+ reported by late 2024 (~15 farmworkers exposure ill cattle), most mild conjunctivitis + flu-like, ~1 hospitalization (Louisiana). No sustained human-human transmission identified. Pandemic concerns: H5N1 historically high case-fatality rate humans (~50% historically; recent strains lower), mammalian adaptation enables potentially sustained transmission, dairy industry economic + food-supply risks. Response: USDA federal milk testing, biosecurity guidance, anti-PB2 oseltamivir prophylaxis, mRNA H5N1 vaccine candidates Moderna mRNA-1018 + Pfizer Phase 1 2024, stockpile FluMist H5N1 vaccine (Audenz Sequirus). 1918 Spanish flu, 2009 H1N1 swine pandemic precedents. Field 2024+ heightened surveillance critical preparedness.'
          en: 'H5N1 dairy cattle outbreak (USDA March 2024+): clade 2.3.4.4b H5N1 highly pathogenic avian influenza (HPAI) detected in dairy cattle Texas + multiple states (>15 states ~600 herds by October 2024). Spillover from wild birds → cattle (likely first incursion late 2023). Mostly subclinical/mild bovine disease — depressed milk production, reduced appetite. Unique mammary gland tropism — virus shed in milk (high titers; pasteurization neutralizes). Spread cattle-to-cattle via fomites, milking equipment. Human cases: ~60+ reported by late 2024 (~15 farmworkers from exposure to ill cattle), most mild conjunctivitis + flu-like, ~1 hospitalization (Louisiana). No sustained human-human transmission identified. Pandemic concerns: H5N1 historically high case-fatality rate in humans (~50% historically; recent strains lower), mammalian adaptation enables potentially sustained transmission, dairy industry economic + food-supply risks. Response: USDA federal milk testing, biosecurity guidance, oseltamivir anti-PB2 prophylaxis, mRNA H5N1 vaccine candidates Moderna mRNA-1018 + Pfizer Phase 1 2024, stockpile FluMist H5N1 vaccine (Audenz Sequirus). 1918 Spanish flu, 2009 H1N1 swine pandemic precedents. Field 2024+ heightened surveillance critical for preparedness.'
        objectives: [H5N1 dairy cattle]
      - type: choice
        difficulty: 5
        question:
          pt: Mpox 2022 (clade IIb global) + 2024 (clade I DRC → Africa) WHO PHEIC é…
          en: Mpox 2022 (clade IIb global) + 2024 (clade I DRC → Africa) WHO PHEIC is…
        choices:
          - "Two distinct PHEIC declarations: 2022 clade IIb global outbreak (~95k cases mostly MSM) and 2024 clade I expansion from DRC to neighboring countries with higher fatality"
          - Single small regional outbreak
          - Smallpox-eradicated declaration
          - Unrelated bacterial disease outbreak
        correctAnswer: "Two distinct PHEIC declarations: 2022 clade IIb global outbreak (~95k cases mostly MSM) and 2024 clade I expansion from DRC to neighboring countries with higher fatality"
        rationale:
          pt: 'Mpox PHEIC declarations (Public Health Emergency of International Concern, WHO IHR 2005): 2022 julho-2023 maio — clade IIb (formerly West African) global outbreak, ~95000+ cases ~115 countries (predominantly EU/USA/Brazil), primarily men who have sex with men (MSM) sexual transmission, ~140 deaths. Vaccines Jynneos (Bavarian Nordic, smallpox-cross-protective) + tecovirimat (TPOXX antiviral) deployed. Resolved May 2023 PHEIC ended. 2024 agosto declaration — clade I (formerly Congo Basin, historically more severe ~3-10% CFR vs clade II ~1%) — DRC outbreak expanding 2023+, novel sub-clade Ib emerged 2023 South Kivu DRC, more sexually transmitted (vs traditional clade I close-contact household), spread to neighboring Burundi Rwanda Uganda Kenya Tanzania, sporadic exports Sweden Thailand Germany 2024. Concerns: pediatric cases higher fatality, vaccine access African continent limited, surveillance gaps. Response: WHO Africa CDC coordinated, vaccine donations Bavarian Nordic 2024 ~3.5M doses, Gavi commitments. Comparison COVID: PHEIC framework activated different scales. Tedros WHO leadership pandemic preparedness 2024+ ongoing. Implications: monkeypox virus (now Mpox virus) endemic Africa long-term endemic management challenge.'
          en: 'Mpox PHEIC declarations (Public Health Emergency of International Concern, WHO IHR 2005): 2022 July-2023 May — clade IIb (formerly West African) global outbreak, ~95000+ cases ~115 countries (predominantly EU/USA/Brazil), primarily men who have sex with men (MSM) sexual transmission, ~140 deaths. Vaccines Jynneos (Bavarian Nordic, smallpox-cross-protective) + tecovirimat (TPOXX antiviral) deployed. Resolved May 2023 PHEIC ended. 2024 August declaration — clade I (formerly Congo Basin, historically more severe ~3-10% CFR vs clade II ~1%) — DRC outbreak expanding 2023+, novel sub-clade Ib emerged 2023 South Kivu DRC, more sexually transmitted (vs traditional clade I close-contact household), spread to neighboring Burundi Rwanda Uganda Kenya Tanzania, sporadic exports to Sweden Thailand Germany 2024. Concerns: pediatric cases with higher fatality, vaccine access on African continent limited, surveillance gaps. Response: WHO Africa CDC coordinated, vaccine donations Bavarian Nordic 2024 ~3.5M doses, Gavi commitments. Comparison with COVID: PHEIC framework activated at different scales. Tedros WHO leadership for pandemic preparedness 2024+ ongoing. Implications: monkeypox virus (now Mpox virus) endemic to Africa, long-term endemic management challenge.'
        objectives: [Mpox PHEIC]
      - type: choice
        difficulty: 5
        question:
          pt: Marburg virus disease (Rwanda outbreak setembro 2024) é…
          en: Marburg virus disease (Rwanda outbreak September 2024) is…
        choices:
          - Filovirus closely related to Ebola with ~50-90% case fatality, Rwanda 2024 outbreak ~66 cases ~15 deaths controlled via Sabin-VRC vaccine + ZMapp/MR-191 monoclonals trial
          - Bacterial infection unrelated to filoviruses
          - Pure airborne respiratory virus
          - Same as Ebola virus identical
        correctAnswer: Filovirus closely related to Ebola with ~50-90% case fatality, Rwanda 2024 outbreak ~66 cases ~15 deaths controlled via Sabin-VRC vaccine + ZMapp/MR-191 monoclonals trial
        rationale:
          pt: 'Marburg virus (MARV): Filoviridae família — Marburg, Ebola, Ravn, Lloviu. Discovered 1967 Marburg Germany outbreak laboratory workers handling African green monkey tissue (Cercopithecus aethiops imported Uganda) — 31 cases, 7 deaths. Reservoir: Egyptian fruit bat (Rousettus aegyptiacus). Outbreaks: Angola 2004-2005 (252 cases ~88% CFR worst), DRC 1998-2000 (149 cases), Uganda 2017, Equatorial Guinea + Tanzania 2023. Rwanda outbreak setembro 2024: declared 27 setembro (initially mysterious deaths nurses Kigali hospital), ~66 cases ~15 mortes (~23% CFR — relatively low MARV historic standards) by mid-novembro. Health-workers majority initial cluster (nosocomial transmission). Response unprecedented rapid: Sabin Vaccine Institute + International AIDS Vaccine Initiative (IAVI) ChAd3-Marburg vaccine emergency Phase 2 trial (~700 healthcare workers vaccinated within weeks via ring-vaccination), monoclonal antibodies treatment Mapp Biopharmaceutical MR-191 + ZMapp. WHO + CDC + Africa CDC coordination. Outbreak declared over dezembro 2024. Lessons: vaccine pipeline pre-positioned, rapid response framework R&D Blueprint priority pathogens. Marburg vaccine development funded Sabin~$25M Wellcome 2014+ post-Ebola epidemic preparedness.'
          en: 'Marburg virus (MARV): Filoviridae family — Marburg, Ebola, Ravn, Lloviu. Discovered 1967 Marburg Germany outbreak in lab workers handling African green monkey tissue (Cercopithecus aethiops imported from Uganda) — 31 cases, 7 deaths. Reservoir: Egyptian fruit bat (Rousettus aegyptiacus). Outbreaks: Angola 2004-2005 (252 cases ~88% CFR worst), DRC 1998-2000 (149 cases), Uganda 2017, Equatorial Guinea + Tanzania 2023. Rwanda outbreak September 2024: declared 27 September (initially mysterious deaths in nurses at Kigali hospital), ~66 cases ~15 deaths (~23% CFR — relatively low by MARV historic standards) by mid-November. Healthcare workers a majority of initial cluster (nosocomial transmission). Response unprecedented and rapid: Sabin Vaccine Institute + International AIDS Vaccine Initiative (IAVI) ChAd3-Marburg vaccine emergency Phase 2 trial (~700 healthcare workers vaccinated within weeks via ring vaccination), monoclonal antibodies treatment Mapp Biopharmaceutical MR-191 + ZMapp. WHO + CDC + Africa CDC coordination. Outbreak declared over December 2024. Lessons: vaccine pipeline pre-positioned, rapid response framework R&D Blueprint priority pathogens. Marburg vaccine development funded Sabin ~$25M Wellcome 2014+ post-Ebola epidemic preparedness.'
        objectives: [Marburg Rwanda 2024]
      - type: choice
        difficulty: 5
        question:
          pt: Ebola Ervebo vaccine (rVSV-ZEBOV-GP, Merck FDA 2019) é…
          en: Ebola Ervebo vaccine (rVSV-ZEBOV-GP, Merck FDA 2019) is…
        choices:
          - Recombinant VSV-vectored single-dose vaccine showing ~100% efficacy in West Africa 2014-2016 ring trial; first FDA-approved Ebola vaccine, used in DRC 2018-2020 outbreak
          - Inactivated whole-virus Ebola vaccine
          - Standard antiviral drug treatment
          - Plant-based vaccine candidate only
        correctAnswer: Recombinant VSV-vectored single-dose vaccine showing ~100% efficacy in West Africa 2014-2016 ring trial; first FDA-approved Ebola vaccine, used in DRC 2018-2020 outbreak
        rationale:
          pt: 'Ervebo (rVSV-ZEBOV-GP, Merck): recombinant Vesicular Stomatitis Virus (VSV) replication-competent → VSV glycoprotein replaced with Ebola Zaire glycoprotein (GP). Single intramuscular dose. Originally developed Public Health Agency Canada (PHAC Winnipeg) → licensed NewLink Genetics → BioProtection Systems → Merck 2014 development scale-up. West Africa Ebola epidemic 2014-2016 (Sierra Leone Liberia Guinea ~28000 cases ~11000 deaths) — Phase 3 ring vaccination trial Guinea (Henao-Restrepo Camacho Longini Watson Edmunds Egger Carroll Dean Diatta Doumbia Draguez Duraffour Enwere Grais Gunther Gsell Hossmann Watle Kondé Kone Kuisma Levine Mandal Mauget Norheim Riveros Soumah Trelle Vicari Watson Kéita Kieny Røttingen Lancet 2017): targeting contact tracing rings exposed cases — primary efficacy 100% (no cases vaccinated arm 21+ days post-vaccination). FDA approval dezembro 2019 (Ervebo trade name). Used 2018-2020 DRC outbreak (~2300 deaths in 10th DRC outbreak North Kivu) ~300000 doses ring + frontline workers — controlled outbreak July 2020 declared over. Subsequent: 2024 DRC Equateur outbreaks. Concurrent vaccines: Ad26.ZEBOV/MVA-BN-Filo prime-boost (Janssen J&J), heterologous regimen approved EU 2020. Field decadal preparedness pre-Ervebo lacking — Liberia Doctors Without Borders MSF central response 2014. Filovirus pipeline expanded post-2014.'
          en: 'Ervebo (rVSV-ZEBOV-GP, Merck): recombinant Vesicular Stomatitis Virus (VSV) replication-competent → VSV glycoprotein replaced with Ebola Zaire glycoprotein (GP). Single intramuscular dose. Originally developed by Public Health Agency Canada (PHAC Winnipeg) → licensed to NewLink Genetics → BioProtection Systems → Merck 2014 development scale-up. West Africa Ebola epidemic 2014-2016 (Sierra Leone Liberia Guinea ~28000 cases ~11000 deaths) — Phase 3 ring vaccination trial Guinea (Henao-Restrepo Lancet 2017): targeting contact tracing rings around exposed cases — primary efficacy 100% (no cases in vaccinated arm 21+ days post-vaccination). FDA approval December 2019 (Ervebo trade name). Used in 2018-2020 DRC outbreak (~2300 deaths in 10th DRC outbreak North Kivu) — ~300000 doses ring + frontline workers — controlled outbreak; July 2020 declared over. Subsequent: 2024 DRC Equateur outbreaks. Concurrent vaccines: Ad26.ZEBOV/MVA-BN-Filo prime-boost (Janssen J&J), heterologous regimen approved EU 2020. Field decadal preparedness pre-Ervebo lacking — Liberia Doctors Without Borders MSF central response 2014. Filovirus pipeline expanded post-2014.'
        objectives: [Ervebo Ebola]
      - type: choice
        difficulty: 5
        question:
          pt: Ebola monoclonal therapy (Inmazeb REGN-EB3 + Ebanga mAb114 PALM trial NEJM 2019) é…
          en: Ebola monoclonal therapy (Inmazeb REGN-EB3 + Ebanga mAb114 PALM trial NEJM 2019) is…
        choices:
          - First effective antibody treatments showing significant mortality reduction (~28-35% from baseline ~70%) for symptomatic Ebola Zaire infection
          - Pure supportive care without specific therapy
          - Plant-derived vaccines only
          - Identical to ZMapp without improvement
        correctAnswer: First effective antibody treatments showing significant mortality reduction (~28-35% from baseline ~70%) for symptomatic Ebola Zaire infection
        rationale:
          pt: 'Ebola PALM (Pamoja Tulinde Maisha "Together Save Lives") randomized trial NEJM 2019 (Mulangu Dodd Davey Tshiani Mbala Proschan Mukadi Lusakibanza-Manzo Nzolo Tshomba Ibanda Ali Coulibaly Levine Grais Diaz Lane Muyembe-Tamfum INRB DRC + Sabin Vaccine Institute): four arm trial Ebola treatment 2018-2019 DRC: ZMapp (cocktail 3 plant-derived monoclonals, prior standard), mAb114 (single human monoclonal, NIH/Vanderbilt + ridgeback, derived 1995 Kikwit DRC survivor — Junkin Crowe Pyle Doria-Rose Mascola), REGN-EB3 (3-mAb cocktail Regeneron, derived humanized mice). Stopped early ~681 patients enrolled — REGN-EB3 + mAb114 superior ZMapp + remdesivir comparator. REGN-EB3 28-day mortality ~33% (vs ~50% ZMapp baseline). mAb114 ~35%. ZMapp ~50%. Remdesivir ~53%. Subsequent FDA approvals: Inmazeb (REGN-EB3 atoltivimab + maftivimab + odesivimab) Regeneron outubro 2020, Ebanga (Ansuvimab mAb114) outubro 2020. Mécanisme: target Ebola GP (glycoprotein) neutralize entry/cell-mediated. Limit: Zaire-specific (não Sudan/Bundibugyo Marburg). Major advance Ebola treatment — pre-2018 fatality ~70-90% historical outbreaks. PALM trial gold standard outbreak research methodology 2024+.'
          en: 'Ebola PALM (Pamoja Tulinde Maisha "Together Save Lives") randomized trial NEJM 2019: four-arm trial of Ebola treatment 2018-2019 DRC: ZMapp (cocktail of 3 plant-derived monoclonals, prior standard), mAb114 (single human monoclonal, NIH/Vanderbilt + Ridgeback, derived from 1995 Kikwit DRC survivor — Crowe/Mascola), REGN-EB3 (3-mAb cocktail Regeneron, derived from humanized mice). Stopped early after ~681 patients enrolled — REGN-EB3 + mAb114 superior to ZMapp + remdesivir comparator. REGN-EB3 28-day mortality ~33% (vs ~50% ZMapp baseline). mAb114 ~35%. ZMapp ~50%. Remdesivir ~53%. Subsequent FDA approvals: Inmazeb (REGN-EB3 atoltivimab + maftivimab + odesivimab) Regeneron October 2020, Ebanga (Ansuvimab mAb114) October 2020. Mechanism: target Ebola GP (glycoprotein) to neutralize entry/cell-mediated. Limit: Zaire-specific (not Sudan/Bundibugyo Marburg). Major advance in Ebola treatment — pre-2018 fatality ~70-90% in historical outbreaks. PALM trial is gold standard for outbreak research methodology 2024+.'
        objectives: [Ebola monoclonals PALM]
      - type: choice
        difficulty: 5
        question:
          pt: Polio eradication (GPEI 1988+, nOPV2 2020+) é…
          en: Polio eradication (GPEI 1988+, nOPV2 2020+) is…
        choices:
          - Global Polio Eradication Initiative reduced cases ~99.9% to ~12 wild-type 2024 plus VDPV outbreaks; novel oral polio vaccine type 2 (nOPV2) reduces vaccine-derived poliovirus reversion risk
          - Polio fully eradicated globally with no remaining cases
          - Only one country still has polio
          - GPEI is a private commercial program
        correctAnswer: Global Polio Eradication Initiative reduced cases ~99.9% to ~12 wild-type 2024 plus VDPV outbreaks; novel oral polio vaccine type 2 (nOPV2) reduces vaccine-derived poliovirus reversion risk
        rationale:
          pt: 'Global Polio Eradication Initiative (GPEI): launched 1988 World Health Assembly. Partners: WHO + UNICEF + CDC + Rotary International + Gates Foundation + GAVI. Goal: eradicate poliomyelitis globally (similar smallpox 1980 success). Progress: ~350000 cases 1988 → ~12 wild-type cases 2024 (Pakistan + Afghanistan only endemic countries). WPV2 (wild poliovirus type 2) certified eradicated 2015, WPV3 2019 — only WPV1 remains. Concurrent issue: vaccine-derived poliovirus (VDPV) — circulating mutated OPV strains gain neuropathogenicity → outbreaks polio caused by vaccine itself, especially Africa Asia low-coverage areas. ~150-300 cVDPV2 cases globally 2020-2024 — exceeds wild polio cases. Solution: nOPV2 (novel oral polio vaccine type 2) — Bandyopadhyay/Macadam/Cooper Yeh Andino UCSF/PEI/NIBSC Cell 2020 — engineered Sabin OPV2 strain reduce reversion risk via genome stabilization mutations capsid + non-coding regions. Emergency Use Listing WHO novembro 2020, ~1B doses deployed 2021-2024 LMICs. Final eradication challenges: insecurity Pakistan/Afghanistan, war Sudan, vaccine misinformation Nigeria, immune deficiency individual chronic excretors. Field 2024+ promising progressando eradication possibly 2026-2030 horizon.'
          en: 'Global Polio Eradication Initiative (GPEI): launched 1988 World Health Assembly. Partners: WHO + UNICEF + CDC + Rotary International + Gates Foundation + GAVI. Goal: eradicate poliomyelitis globally (similar to smallpox 1980 success). Progress: ~350000 cases 1988 → ~12 wild-type cases 2024 (Pakistan + Afghanistan only endemic countries). WPV2 (wild poliovirus type 2) certified eradicated 2015, WPV3 2019 — only WPV1 remains. Concurrent issue: vaccine-derived poliovirus (VDPV) — circulating mutated OPV strains gain neuropathogenicity → outbreaks of polio caused by the vaccine itself, especially in Africa and Asia low-coverage areas. ~150-300 cVDPV2 cases globally 2020-2024 — exceeds wild polio cases. Solution: nOPV2 (novel oral polio vaccine type 2) — Bandyopadhyay/Andino UCSF Cell 2020 — engineered Sabin OPV2 strain to reduce reversion risk via genome stabilization mutations in capsid + non-coding regions. Emergency Use Listing WHO November 2020, ~1B doses deployed 2021-2024 in LMICs. Final eradication challenges: insecurity in Pakistan/Afghanistan, war in Sudan, vaccine misinformation in Nigeria, immune-deficiency individual chronic excretors. Field 2024+ promising — eradication possibly 2026-2030 horizon.'
        objectives: [Polio eradication GPEI]
      - type: choice
        difficulty: 5
        question:
          pt: Wastewater surveillance (NY polio 2022, COVID-19, Mpox) é…
          en: Wastewater surveillance (NY polio 2022, COVID-19, Mpox) is…
        choices:
          - Sampling sewage to detect viral genetic material at population scale, providing early warning ahead of clinical case reporting and identifying silent circulation
          - Standard clinical case counting only
          - Air-sampling without water component
          - Single-individual genetic testing
        correctAnswer: Sampling sewage to detect viral genetic material at population scale, providing early warning ahead of clinical case reporting and identifying silent circulation
        rationale:
          pt: 'Wastewater-based epidemiology (WBE): sampling municipal sewage → concentrate virions/RNA → RT-qPCR ou metagenomic sequencing → quantify pathogen circulation population-level. Viruses excreted feces/urine stable em sewage hours-days. SARS-CoV-2: WBE deployed early COVID 2020 (Israel Bar-Or Erster Mendelson, Netherlands Medema, USA WastewaterSCAN Stanford Boehm). Tracked variants Omicron emergence, predicted hospitalizations 1-2 weeks lead time. CDC National Wastewater Surveillance System (NWSS) 2020+. Polio: New York Rockland County 2022 — adult unvaccinated paralyzed Orthodox Jewish community → wastewater sampling NY Greater Region (London, Jerusalem cross-detection 2022) → silent vaccine-derived poliovirus type 2 (cVDPV2) circulation among under-immunized communities. Catalyzed enhanced vaccination campaigns. Mpox: 2022-2024 wastewater detection both clades cities monitoring outbreak before clinical diagnoses. Subsequent applications: H5N1 dairy 2024 (USDA milk + wastewater), antibiotic resistance gene tracking, opioid/drug use surveillance, RSV/seasonal flu. Methodology Stanford WastewaterSCAN, Biobot Analytics (commercial), Verily Wastewater. Privacy: aggregate population (~city level) — não individual identifiable. Field exploded post-COVID — preparedness infrastructure decade horizon ~$200M annual NWSS budget.'
          en: 'Wastewater-based epidemiology (WBE): sampling municipal sewage → concentrate virions/RNA → RT-qPCR or metagenomic sequencing → quantify pathogen circulation at population level. Viruses excreted in feces/urine stable in sewage for hours-days. SARS-CoV-2: WBE deployed early in COVID 2020 (Israel Bar-Or, Netherlands Medema, USA WastewaterSCAN Stanford Boehm). Tracked variant emergence (Omicron), predicted hospitalizations 1-2 weeks lead time. CDC National Wastewater Surveillance System (NWSS) 2020+. Polio: New York Rockland County 2022 — adult unvaccinated paralyzed Orthodox Jewish community → wastewater sampling NY Greater Region (London, Jerusalem cross-detection 2022) → silent vaccine-derived poliovirus type 2 (cVDPV2) circulation among under-immunized communities. Catalyzed enhanced vaccination campaigns. Mpox: 2022-2024 wastewater detection of both clades; cities monitoring outbreaks before clinical diagnoses. Subsequent applications: H5N1 dairy 2024 (USDA milk + wastewater), antibiotic resistance gene tracking, opioid/drug-use surveillance, RSV/seasonal flu. Methodology: Stanford WastewaterSCAN, Biobot Analytics (commercial), Verily Wastewater. Privacy: aggregate population (~city level) — not individual identifiable. Field exploded post-COVID — preparedness infrastructure decade horizon ~$200M annual NWSS budget.'
        objectives: [Wastewater surveillance]
