        question:
          pt: Phage display antibody discovery (George Smith + Greg Winter Nobel Chemistry 2018) é…
          en: Phage display antibody discovery (George Smith + Greg Winter Nobel Chemistry 2018) is…
        choices:
          - Display peptides/antibodies on bacteriophage surface, screen against targets to evolve binders — Winter applied to humanized antibodies leading to adalimumab (Humira) and many therapeutic mAbs
          - Pure live-cell screening without phage component
          - Standard hybridoma technology
          - Plant-based antibody production exclusively
        correctAnswer: Display peptides/antibodies on bacteriophage surface, screen against targets to evolve binders — Winter applied to humanized antibodies leading to adalimumab (Humira) and many therapeutic mAbs
        rationale:
          pt: 'Phage display: Nobel Chemistry 2018 — George Smith (Univ Missouri) + Greg Winter (Cambridge MRC LMB) shared half (Frances Arnold other half directed evolution enzymes). George Smith 1985 Science — original peptide display M13 filamentous phage gIII coat protein → fuse external peptide → screen via biopanning against targets. Greg Winter applied antibody Fab/scFv libraries phage display → human antibody selection sem hybridoma → fully human therapeutic antibodies. Adalimumab (Humira AbbVie, anti-TNFα) — first antibody fully derived phage display, FDA approved 2002 → top-selling drug worldwide ~$200B sales over 20-year exclusivity. Companies: Cambridge Antibody Technology Winter spin-out 1989 → AstraZeneca acquisition. MorphoSys, Dyax (now Takeda), Adimab. Concurrent: humanized antibodies CDR-grafting Winter Hum 1986 → herceptin (trastuzumab Genentech), rituxan, others. Subsequent technologies expanded antibody discovery: yeast display (Wittrup MIT), single-cell antibody discovery (Adimab, Distributed Bio), AI antibody design (Generate Biomedicines, Absci), naïve human B-cell repertoire mining. Phage display foundational ~$50B+ therapeutic antibodies industry 2024.'
          en: 'Phage display: 2018 Nobel in Chemistry — George Smith (Univ Missouri) + Greg Winter (Cambridge MRC LMB) shared half (Frances Arnold other half for directed evolution of enzymes). George Smith 1985 Science — original peptide display on M13 filamentous phage gIII coat protein → fuse external peptide → screen via biopanning against targets. Greg Winter applied antibody Fab/scFv libraries to phage display → human antibody selection without hybridoma → fully human therapeutic antibodies. Adalimumab (Humira AbbVie, anti-TNFα) — first antibody fully derived from phage display, FDA approved 2002 → top-selling drug worldwide ~$200B sales over 20-year exclusivity. Companies: Cambridge Antibody Technology Winter spin-out 1989 → AstraZeneca acquisition. MorphoSys, Dyax (now Takeda), Adimab. Concurrent: humanized antibodies CDR-grafting Winter 1986 → Herceptin (trastuzumab Genentech), Rituxan, others. Subsequent technologies expanded antibody discovery: yeast display (Wittrup MIT), single-cell antibody discovery (Adimab, Distributed Bio), AI antibody design (Generate Biomedicines, Absci), naïve human B-cell repertoire mining. Phage display foundational to ~$50B+ therapeutic antibodies industry 2024.'
        objectives: [Phage display Smith Winter]
      - type: choice
        difficulty: 5
        question:
          pt: CRISPR diagnostics (SHERLOCK Zhang/Gootenberg, DETECTR Doudna/Chen) é…
          en: CRISPR diagnostics (SHERLOCK Zhang/Gootenberg, DETECTR Doudna/Chen) is…
        choices:
          - Cas13/Cas12-based collateral cleavage of reporter molecules enabling sensitive nucleic acid detection at point of care, deployed for SARS-CoV-2, Zika, dengue
          - Standard PCR-only diagnostics
          - Microscopy-based imaging without molecular component
          - Pure genotype detection without diagnostic application
        correctAnswer: Cas13/Cas12-based collateral cleavage of reporter molecules enabling sensitive nucleic acid detection at point of care, deployed for SARS-CoV-2, Zika, dengue
        rationale:
          pt: 'CRISPR diagnostics: leverage Cas13 (RNA-targeting, Abudayyeh Gootenberg Zhang 2017 Science) collateral cleavage trans-activity → after cis-cleavage target RNA, Cas13 promiscuously cleave nearby RNA reporter molecules (fluorophore-quencher) → fluorescence signal amplification. SHERLOCK (Specific High-sensitivity Enzymatic Reporter UnLOCKing): Gootenberg Abudayyeh Lee Essletzbichler Dy Joung Verdine Donghia Daringer Freije Myhrvold Zhang Science 2017. RPA (recombinase polymerase amplification) isothermal pre-amplification + Cas13 detection ≤1 attomolar sensitivity. SHERLOCKv2 multiplexed (Gootenberg 2018) — multiple Cas orthologs different fluorophores. DETECTR (DNA Endonuclease-Targeted CRISPR Trans Reporter): Chen Ma Harrington Costa Tian Palefsky Doudna UC Berkeley Science 2018. Cas12a (DNA-targeting, also collateral activity via ssDNA cleavage). Companies: Sherlock Biosciences (Boston, Zhang spinout) — FDA EUA 2020 SARS-CoV-2 detection ($30 paper-based test point-of-care), Mammoth Biosciences (Doudna spinout). COVID applications widely deployed 2020. Subsequent: Zika, dengue, HPV, antibiotic resistance genes. Limit: pre-amplification step requirement, currently challenging direct sample-to-answer. Field 2024+ refinement: lateral flow strips, smartphone readers, integrated cartridges.'
          en: 'CRISPR diagnostics: leverage Cas13 (RNA-targeting, Abudayyeh/Gootenberg/Zhang 2017 Science) collateral cleavage trans-activity → after cis-cleavage of target RNA, Cas13 promiscuously cleaves nearby RNA reporter molecules (fluorophore-quencher) → fluorescence signal amplification. SHERLOCK (Specific High-sensitivity Enzymatic Reporter UnLOCKing): Gootenberg/Zhang Science 2017. RPA (recombinase polymerase amplification) isothermal pre-amplification + Cas13 detection ≤1 attomolar sensitivity. SHERLOCKv2 multiplexed (Gootenberg 2018) — multiple Cas orthologs different fluorophores. DETECTR (DNA Endonuclease-Targeted CRISPR Trans Reporter): Chen/Doudna UC Berkeley Science 2018. Cas12a (DNA-targeting, also collateral activity via ssDNA cleavage). Companies: Sherlock Biosciences (Boston, Zhang spinout) — FDA EUA 2020 SARS-CoV-2 detection ($30 paper-based test point-of-care), Mammoth Biosciences (Doudna spinout). COVID applications widely deployed 2020. Subsequent: Zika, dengue, HPV, antibiotic resistance genes. Limit: pre-amplification step requirement, currently challenging direct sample-to-answer. Field 2024+ refinement: lateral flow strips, smartphone readers, integrated cartridges.'
        objectives: [CRISPR diagnostics SHERLOCK DETECTR]
      - type: choice
        difficulty: 5
        question:
          pt: HIV Berlin/London/Düsseldorf "cured" patients lessons foram…
          en: HIV Berlin/London/Düsseldorf "cured" patients lessons were…
        choices:
          - ~5 cases of sustained HIV remission off ART after CCR5Δ32 homozygous donor allogeneic stem cell transplants for blood cancers — proof-of-concept but not scalable due to risks
          - First standard treatment offered to all HIV patients
          - Pure pharmacological cure without transplant
          - Vaccine-induced cure protocols
        correctAnswer: ~5 cases of sustained HIV remission off ART after CCR5Δ32 homozygous donor allogeneic stem cell transplants for blood cancers — proof-of-concept but not scalable due to risks
        rationale:
          pt: 'HIV functional cure cases via allogeneic stem cell transplant: Berlin patient Timothy Brown 2007 (Hütter Allers Schneider Eberhard Mößner Niewerth Mischke Friedrich Andersen Nat Med 2009 + Brown NEJM 2009). Patient: HIV+ AML acute myeloid leukemia → allogeneic HSC transplant CCR5Δ32 homozygous donor (CCR5 is HIV co-receptor; ~1% Northern Europeans homozygous lack receptor → resistant to HIV-1 tropic R5 strains). Brown stopped ART → no viral rebound — first cured HIV patient. Brown died 2020 leukemia recurrence (HIV-free ~13 years). Subsequent: London patient Adam Castillejo 2019 (Gupta NEJM 2019), Düsseldorf patient 2023 (Jensen Nat Med 2023), Geneva patient 2023 (CCR5+ donor — different mechanism), New York patient 2022 (Hsu Cell 2022 — cord blood + CCR5Δ32), City of Hope 2022. ~5-7 cases cumulative confirmed long-term remission. Limit: allogeneic HSCT mortality ~10-30%, donor matching CCR5Δ32 rare, only justified blood cancers comorbidity. Não scalable. Subsequent strategies: (1) bnAbs-mediated cure (3BNC117+10-1074 long-acting), (2) latency reversal "shock-and-kill" (vorinostat romidepsin BRD4/HDAC inhibitors), (3) gene therapy CCR5 knockout HSC autólogos (Sangamo SB-728, Excision Bio EBT-101 IV CRISPR), (4) HIV vaccine HVTN trials. Field decade systematic effort cure. Targets ~30M living HIV global.'
          en: 'HIV functional cure cases via allogeneic stem cell transplant: Berlin patient Timothy Brown 2007 (Hütter NEJM 2009). Patient: HIV+ AML acute myeloid leukemia → allogeneic HSC transplant from CCR5Δ32 homozygous donor (CCR5 is HIV co-receptor; ~1% of Northern Europeans homozygous lack receptor → resistant to HIV-1 tropic R5 strains). Brown stopped ART → no viral rebound — first cured HIV patient. Brown died 2020 of leukemia recurrence (HIV-free ~13 years). Subsequent: London patient Adam Castillejo 2019 (Gupta NEJM 2019), Düsseldorf patient 2023 (Jensen Nat Med 2023), Geneva patient 2023 (CCR5+ donor — different mechanism), New York patient 2022 (Hsu Cell 2022 — cord blood + CCR5Δ32), City of Hope 2022. ~5-7 cases cumulative confirmed long-term remission. Limit: allogeneic HSCT mortality ~10-30%, donor matching CCR5Δ32 rare, only justified by blood cancer comorbidity. Not scalable. Subsequent strategies: (1) bnAb-mediated cure (3BNC117+10-1074 long-acting), (2) latency reversal "shock-and-kill" (vorinostat romidepsin BRD4/HDAC inhibitors), (3) gene therapy CCR5 knockout autologous HSC (Sangamo SB-728, Excision Bio EBT-101 IV CRISPR), (4) HIV vaccine HVTN trials. Field decade-long systematic effort for cure. Targets ~30M living with HIV globally.'
        objectives: [HIV Berlin London cures]
