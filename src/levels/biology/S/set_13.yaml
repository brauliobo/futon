        question:
          pt: HPV Gardasil vaccine (Merck FDA 2006, 9-valent 2014) impacto é…
          en: HPV Gardasil vaccine (Merck FDA 2006, 9-valent 2014) impact is…
        choices:
          - Virus-like particle vaccine targeting HPV types causing cervical/oropharyngeal cancers, demonstrated ~90% reduction in invasive cervical cancer in vaccinated cohorts (Lei NEJM 2020 Sweden)
          - Curative treatment for established cancer
          - Standard antiviral drug without preventive component
          - Pure educational program without biological intervention
        correctAnswer: Virus-like particle vaccine targeting HPV types causing cervical/oropharyngeal cancers, demonstrated ~90% reduction in invasive cervical cancer in vaccinated cohorts (Lei NEJM 2020 Sweden)
        rationale:
          pt: 'HPV vaccines (Human Papillomavirus): VLP (virus-like particle) recombinant L1 capsid protein self-assembles → resemble virus surface sem genome → highly immunogenic. Gardasil (Merck) FDA approved 2006: quadrivalent HPV 6/11 (genital warts) + 16/18 (~70% cervical cancers). Cervarix (GSK) bivalent 16/18 approved 2009. Gardasil 9 (Merck) approved 2014: nonavalent 6/11/16/18/31/33/45/52/58 (~90% cervical cancers + ~80% anal cancers). Recommended dose 9-12 anos preferable (pre-sexual exposure). Long-term efficacy: Lei Ploner Elfström Wang Roth Fang Sundström Dillner Sparén Karolinska NEJM 2020 — Swedish nationwide registry ~1.7M girls/women vaccinated 10-30 anos — ~88% reduction invasive cervical cancer vaccinated <17yo. WHO 2018 cervical cancer elimination strategy: 90% girls vaccinated by 15yo + 70% screening 35-45 + 90% treatment precancer/cancer. Achievable trajectory cervical cancer elimination major WHO target 2030+. Field 2024 expansão: oropharyngeal cancers (HPV-related ~70% throat cancers Western), anal cancers MSM, penile cancer. Subsequent: Cecolin (Innovax China bivalent 16/18), Walrinvax (Bharat Biotech India 2022 quadrivalent), Cervavac (Serum Institute India 2024 quadrivalent) low-cost LMIC access. Gates Foundation funding HPV vaccination Africa.'
          en: 'HPV vaccines (Human Papillomavirus): VLP (virus-like particle) of recombinant L1 capsid protein self-assembles → resembles virus surface without genome → highly immunogenic. Gardasil (Merck) FDA approved 2006: quadrivalent HPV 6/11 (genital warts) + 16/18 (~70% of cervical cancers). Cervarix (GSK) bivalent 16/18 approved 2009. Gardasil 9 (Merck) approved 2014: nonavalent 6/11/16/18/31/33/45/52/58 (~90% of cervical cancers + ~80% anal cancers). Recommended dose 9-12 years old preferably (pre-sexual exposure). Long-term efficacy: Lei/Sparén Karolinska NEJM 2020 — Swedish nationwide registry of ~1.7M girls/women vaccinated 10-30 years old — ~88% reduction in invasive cervical cancer in those vaccinated <17yo. WHO 2018 cervical cancer elimination strategy: 90% of girls vaccinated by 15yo + 70% screening 35-45 + 90% treatment precancer/cancer. Achievable trajectory — cervical cancer elimination is a major WHO target 2030+. Field 2024 expansion: oropharyngeal cancers (HPV-related ~70% of throat cancers in Western), anal cancers in MSM, penile cancer. Subsequent: Cecolin (Innovax China bivalent 16/18), Walrinvax (Bharat Biotech India 2022 quadrivalent), Cervavac (Serum Institute India 2024 quadrivalent) low-cost LMIC access. Gates Foundation funding HPV vaccination in Africa.'
        objectives: [HPV Gardasil]
