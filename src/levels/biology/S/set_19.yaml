example:
  question:
    pt: Bertozzi/Sharpless/Meldal Nobel Chemistry 2022 reconheceu…
    en: Bertozzi/Sharpless/Meldal 2022 Nobel in Chemistry recognized…
  choices:
    - Click chemistry (CuAAC azide-alkyne) + bioorthogonal chemistry — modular, selective reactions enabling labeling/imaging biomolecules in living cells without disturbing biology
    - Pure synthesis of antibiotics
    - Discovery of penicillin
    - Standard organic chemistry without bioorthogonal applications
  correctAnswer: Click chemistry (CuAAC azide-alkyne) + bioorthogonal chemistry — modular, selective reactions enabling labeling/imaging biomolecules in living cells without disturbing biology
  rationale:
    pt: 'Click chemistry + bioorthogonal chemistry Nobel Chemistry 2022 — Carolyn Bertozzi (Stanford), K. Barry Sharpless (Scripps, second Nobel), Morten Meldal (Univ Copenhagen). Click chemistry: Sharpless 2001 conceito + Sharpless/Meldal 2002 simultaneous CuAAC (Cu-catalyzed azide-alkyne cycloaddition) — fast, selective triazole formation azides + terminal alkynes. Modular building blocks ("click together"), high yield, biocompatible. Aplicações: drug discovery library synthesis, polymer chemistry, materials. Bioorthogonal extensions Bertozzi 2003+: copper-free strain-promoted azide-alkyne cycloaddition (SPAAC) — uses cyclooctyne strained alkyne, no copper toxicity → labeling biomolecules living cells. Glycan imaging (sugar metabolic incorporation N-azido-acetylgalactosamine GalNAz Bertozzi pioneered glycomics) live zebrafish embryos, mice. Sharpless Nobel 2001 (asymmetric oxidation) + 2022 (click chemistry) — only person two Nobels Chemistry shared 1965+. Aplicações broader: ADC linker chemistry (T-DXd/Enhertu cleavable click), live cell imaging, RNA labeling, target identification, PROTAC/degrader chemistry. Field foundational interface chemistry-biology.'
    en: 'Click chemistry + bioorthogonal chemistry Nobel Chemistry 2022 — Carolyn Bertozzi (Stanford), K. Barry Sharpless (Scripps, second Nobel), Morten Meldal (Univ Copenhagen). Click chemistry: Sharpless 2001 concept + Sharpless/Meldal 2002 simultaneous CuAAC (Cu-catalyzed azide-alkyne cycloaddition) — fast, selective triazole formation azides + terminal alkynes. Modular building blocks ("click together"), high yield, biocompatible. Applications: drug discovery library synthesis, polymer chemistry, materials. Bioorthogonal extensions Bertozzi 2003+: copper-free strain-promoted azide-alkyne cycloaddition (SPAAC) — uses cyclooctyne strained alkyne, no copper toxicity → labels biomolecules in living cells. Glycan imaging (sugar metabolic incorporation N-azido-acetylgalactosamine GalNAz Bertozzi pioneered glycomics) in live zebrafish embryos, mice. Sharpless Nobel 2001 (asymmetric oxidation) + 2022 (click chemistry) — only person with two Nobels in Chemistry shared since 1965+. Broader applications: ADC linker chemistry (T-DXd/Enhertu cleavable click), live cell imaging, RNA labeling, target identification, PROTAC/degrader chemistry. Field foundational at the interface of chemistry-biology.'
