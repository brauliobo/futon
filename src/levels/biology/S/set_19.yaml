        question:
          pt: H. pylori + gastric cancer (Marshall/Warren Nobel 2005) é…
          en: H. pylori + gastric cancer (Marshall/Warren 2005 Nobel) is…
        choices:
          - Helicobacter pylori chronic gastric infection causes peptic ulcers + gastric adenocarcinoma + MALT lymphoma; eradication via triple therapy reduces cancer risk; ~50% global prevalence
          - Pure non-infectious cancer cause
          - Standard non-pathogen
          - Skin colonizer without GI relevance
        correctAnswer: Helicobacter pylori chronic gastric infection causes peptic ulcers + gastric adenocarcinoma + MALT lymphoma; eradication via triple therapy reduces cancer risk; ~50% global prevalence
        rationale:
          pt: 'H. pylori (Helicobacter pylori): Barry Marshall + Robin Warren Perth Australia 1982 isolated bacterium gastric biopsies — Marshall self-experiment 1984 swallowed live H. pylori → developed gastritis + treated antibiotics → recovered. Demonstrated bacterial cause peptic ulcers (vs prevailing "stress + acid" theory). Nobel Medicine 2005. ~50% global prevalence (higher developing countries ~70%, ~30% USA). Transmissão: oral-oral, fecal-oral, contaminated water; childhood acquisition. Doenças: peptic ulcers (~10% infectados), atrophic gastritis, gastric adenocarcinoma (IARC class I carcinogen, ~75% non-cardia gastric cancers attributable), MALT lymphoma (~90% H. pylori-associated, regress eradication). Mecanismo: urease (neutralize acid), VacA toxin, CagA effector (T4SS injected, oncogenic alterations beta-catenin/RUNX3). Eradication: triple therapy ~10-14 days (PPI + clarithromycin + amoxicillin/metronidazole) ~70-80% success; quadruple bismuth-based for resistance. Vaccine development WHO priority — challenges. Cancer prevention: mass screening + treatment Japan/Korea reduced gastric cancer ~30-50%. Field continues 2024 — antibiotic resistance growing concern.'
          en: 'H. pylori (Helicobacter pylori): Barry Marshall + Robin Warren Perth Australia 1982 isolated bacterium from gastric biopsies — Marshall self-experiment 1984 swallowed live H. pylori → developed gastritis + treated with antibiotics → recovered. Demonstrated bacterial cause of peptic ulcers (vs prevailing "stress + acid" theory). Nobel Medicine 2005. ~50% global prevalence (higher in developing countries ~70%, ~30% USA). Transmission: oral-oral, fecal-oral, contaminated water; childhood acquisition. Diseases: peptic ulcers (~10% of those infected), atrophic gastritis, gastric adenocarcinoma (IARC class I carcinogen, ~75% of non-cardia gastric cancers attributable), MALT lymphoma (~90% H. pylori-associated, regress with eradication). Mechanism: urease (neutralizes acid), VacA toxin, CagA effector (T4SS injected, oncogenic alterations of β-catenin/RUNX3). Eradication: triple therapy ~10-14 days (PPI + clarithromycin + amoxicillin/metronidazole) ~70-80% success; quadruple bismuth-based for resistance. Vaccine development WHO priority — challenges. Cancer prevention: mass screening + treatment in Japan/Korea reduced gastric cancer ~30-50%. Field continues 2024 — antibiotic resistance growing concern.'
