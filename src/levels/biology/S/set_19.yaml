      - type: choice
        difficulty: 5
        question:
          pt: Regulatory T cells (Treg) FoxP3 (Sakaguchi 1995 → Hori/Sakaguchi/Ramsdell Sci 2003) é…
          en: Regulatory T cells (Treg) FoxP3 (Sakaguchi 1995 → Hori/Sakaguchi/Ramsdell Sci 2003) are…
        choices:
          - CD4+ CD25+ FoxP3+ T cells suppressing immune responses preventing autoimmunity; IPEX syndrome FOXP3 mutations cause severe multi-organ autoimmunity
          - Pure cytotoxic T cells without regulatory function
          - B-cell lineage only
          - Innate immune cells
        correctAnswer: CD4+ CD25+ FoxP3+ T cells suppressing immune responses preventing autoimmunity; IPEX syndrome FOXP3 mutations cause severe multi-organ autoimmunity
        rationale:
          pt: 'Tregs (regulatory T cells): Sakaguchi Toda Tagaro Suga Asano J Immunol 1995 — CD4+ CD25+ T cells suppressive autoimmunity prevention. FoxP3 (Forkhead box P3) master TF identified — Hori/Sakaguchi/Ramsdell Science 2003 + Fontenot Gavin Rudensky Nat Immunol 2003 simultaneous: FoxP3 necessary + sufficient Treg differentiation/function. IPEX syndrome (Immune dysregulation Polyendocrinopathy Enteropathy X-linked, OMIM 304790) — FOXP3 mutations male hemizygotes → severe multi-organ autoimmunity (T1D infancy, eczema, enteropathy diarrhea, thyroiditis, anemia) usually fatal early childhood without HSC transplant. Treg subsets: thymus-derived (tTreg natural) + peripherally-induced (pTreg/iTreg from Th17 conversion). Cancer immunotherapy: Tregs immunosuppressive tumor microenvironment — depletion strategies (anti-CCR4 mogamulizumab, anti-CTLA-4 ipilimumab partly Treg-depleting, IL-2 muteins skewing effector). Autoimmunity therapy: Treg expansion IL-2 low-dose (Klatzmann pilot Nat 2020 SLE); Treg engineering CAR-Treg (Sangamo, Quell Therapeutics). Field 2024+ active immune therapy modulation. Sakaguchi Osaka pioneer.'
          en: 'Tregs (regulatory T cells): Sakaguchi/Toda J Immunol 1995 — CD4+ CD25+ T cells suppressive of autoimmunity prevention. FoxP3 (Forkhead box P3) master TF identified — Hori/Sakaguchi/Ramsdell Science 2003 + Fontenot/Rudensky Nat Immunol 2003 simultaneous: FoxP3 is necessary + sufficient for Treg differentiation/function. IPEX syndrome (Immune dysregulation Polyendocrinopathy Enteropathy X-linked, OMIM 304790) — FOXP3 mutations in male hemizygotes → severe multi-organ autoimmunity (T1D in infancy, eczema, enteropathy diarrhea, thyroiditis, anemia) usually fatal in early childhood without HSC transplant. Treg subsets: thymus-derived (tTreg natural) + peripherally-induced (pTreg/iTreg from Th17 conversion). Cancer immunotherapy: Tregs are immunosuppressive in tumor microenvironment — depletion strategies (anti-CCR4 mogamulizumab, anti-CTLA-4 ipilimumab partly Treg-depleting, IL-2 muteins skewing effector). Autoimmunity therapy: Treg expansion via IL-2 low-dose (Klatzmann pilot Nat 2020 SLE); Treg engineering CAR-Treg (Sangamo, Quell Therapeutics). Field 2024+ active immune therapy modulation. Sakaguchi Osaka pioneer.'
        objectives: [Treg FoxP3]
      - type: choice
        difficulty: 5
        question:
          pt: T cell exhaustion (Tex, Wherry/Ahmed 2003 + TOX, Khan 2019) é…
          en: T cell exhaustion (Tex, Wherry/Ahmed 2003 + TOX, Khan 2019) is…
        choices:
          - Hierarchical dysfunction state of CD8+ T cells in chronic infection/cancer driven by TOX transcription factor — progressive PD-1+/TIM-3+ exhaustion limits checkpoint inhibitor response
          - Pure cell death without dysfunction states
          - Standard memory T cells without exhaustion
          - B-cell lineage only
        correctAnswer: Hierarchical dysfunction state of CD8+ T cells in chronic infection/cancer driven by TOX transcription factor — progressive PD-1+/TIM-3+ exhaustion limits checkpoint inhibitor response
        rationale:
          pt: 'T cell exhaustion: identified Wherry Blattman Sourdive Altman Ahmed J Virol 2003 (LCMV chronic infection model) — chronic antigen exposure → progressive CD8 T cell dysfunction (reduced cytokine production, cytotoxicity, proliferation, increased inhibitory receptors PD-1 + TIM-3 + LAG-3 + TIGIT). Transcriptional program defined Khan Giles Loyer Argueta-Conrad Vinit Bandelt-Riess Egawa Bates Lazarewicz Beckmann Bechtle Saad Vahedi Hess Wherry Nature 2019 — TOX (Thymocyte Selection-Associated High Mobility Group Box, X-linked) master regulator T cell exhaustion. TOX overexpression → exhaustion-like state; TOX knockdown → effector phenotype but reduced persistence. Subsequent: Tex stem-like (Tpex/TCF1+) progenitor pool → Tex-int intermediate → Tex-term terminally exhausted hierarchy (Beltra/Wherry Nat Immunol 2020). Cancer relevance: tumor-infiltrating CD8+ T cells exhausted state → checkpoint inhibitor response depends Tpex pool maintenance vs terminal exhaustion. Therapeutic approaches: TOX modulation, IL-2 muteins reinvigorating exhausted T cells (Codiak NKTR-358 Nektar abandoned 2022), epigenetic erasure exhausted state (PRMT5 inhibitors). CAR-T exhaustion limit. Field 2024+ active.'
          en: 'T cell exhaustion: identified by Wherry/Ahmed J Virol 2003 (LCMV chronic infection model) — chronic antigen exposure → progressive CD8 T cell dysfunction (reduced cytokine production, cytotoxicity, proliferation, increased inhibitory receptors PD-1 + TIM-3 + LAG-3 + TIGIT). Transcriptional program defined by Khan/Wherry Nature 2019 — TOX (Thymocyte Selection-Associated High Mobility Group Box, X-linked) master regulator of T cell exhaustion. TOX overexpression → exhaustion-like state; TOX knockdown → effector phenotype but reduced persistence. Subsequent: Tex stem-like (Tpex/TCF1+) progenitor pool → Tex-int intermediate → Tex-term terminally exhausted hierarchy (Beltra/Wherry Nat Immunol 2020). Cancer relevance: tumor-infiltrating CD8+ T cells in exhausted state → checkpoint inhibitor response depends on Tpex pool maintenance vs terminal exhaustion. Therapeutic approaches: TOX modulation, IL-2 muteins reinvigorating exhausted T cells (Codiak NKTR-358 Nektar abandoned 2022), epigenetic erasure of exhausted state (PRMT5 inhibitors). CAR-T exhaustion limit. Field 2024+ active.'
        objectives: [T cell exhaustion TOX]
      - type: choice
        difficulty: 5
        question:
          pt: Innate Lymphoid Cells (ILCs, Spits/Vivier 2008+) classification é…
          en: Innate Lymphoid Cells (ILCs, Spits/Vivier 2008+) classification is…
        choices:
          - ILC1 (T-bet, IFN-γ, parallels Th1), ILC2 (GATA3, IL-5/13, allergic+parasitic), ILC3 (RORγt, IL-17/22, mucosal Peyer); plus NK cells (cytotoxic ILC1 subset)
          - Single ILC type
          - Identical to T cells with TCR
          - B-cell-like
        correctAnswer: ILC1 (T-bet, IFN-γ, parallels Th1), ILC2 (GATA3, IL-5/13, allergic+parasitic), ILC3 (RORγt, IL-17/22, mucosal Peyer); plus NK cells (cytotoxic ILC1 subset)
        rationale:
          pt: 'ILCs (Innate Lymphoid Cells): Spits/Vivier landmark Nat Rev Immunol 2013 unified nomenclature. Lymphocyte family lacking antigen-specific receptors (no TCR/BCR) — innate immune effectors. Classification mirrors T helper subsets transcriptionally: (1) ILC1: T-bet+ IFN-γ → parallel Th1, intracellular bacteria/viruses; NK cells (cytotoxic) sister subset. (2) ILC2: GATA3+ IL-5/IL-13/IL-9 → parallel Th2, allergic responses (asthma, eosinophilia) + parasitic helminth defense. (3) ILC3: RORγt+ IL-17/IL-22 → parallel Th17, mucosal immunity (gut Peyer patches lymphoid tissue inducer LTi cells subset, tonsils, MALT). Tissue residence: ILCs predominantly tissue-resident (gut, lung, skin, liver) vs T cells circulating + tissue. Plasticity: ILCs can convert between subsets context-dependent. Aplicações: ILC2 → asthma severity (TSLP/IL-33 axis, dupilumab anti-IL-4Rα Sanofi blocks ILC2 + Th2 allergic), ILC3 → IBD inflammatory bowel disease, NK + ILC1 cancer immunotherapy. Therapeutic: NK-cell engagers (BiKEs/TriKEs), IL-15 superagonists (NKTR-255 Nektar). Eric Vivier Marseille + Hergen Spits Amsterdam pioneers.'
          en: 'ILCs (Innate Lymphoid Cells): Spits/Vivier landmark Nat Rev Immunol 2013 unified nomenclature. Lymphocyte family lacking antigen-specific receptors (no TCR/BCR) — innate immune effectors. Classification mirrors T helper subsets transcriptionally: (1) ILC1: T-bet+ IFN-γ → parallels Th1, intracellular bacteria/viruses; NK cells (cytotoxic) sister subset. (2) ILC2: GATA3+ IL-5/IL-13/IL-9 → parallels Th2, allergic responses (asthma, eosinophilia) + parasitic helminth defense. (3) ILC3: RORγt+ IL-17/IL-22 → parallels Th17, mucosal immunity (gut Peyer patches, lymphoid tissue inducer LTi cells subset, tonsils, MALT). Tissue residence: ILCs predominantly tissue-resident (gut, lung, skin, liver) vs T cells circulating + tissue. Plasticity: ILCs can convert between subsets in context-dependent manner. Applications: ILC2 → asthma severity (TSLP/IL-33 axis, dupilumab anti-IL-4Rα Sanofi blocks ILC2 + Th2 allergic), ILC3 → IBD inflammatory bowel disease, NK + ILC1 in cancer immunotherapy. Therapeutic: NK-cell engagers (BiKEs/TriKEs), IL-15 superagonists (NKTR-255 Nektar). Eric Vivier Marseille + Hergen Spits Amsterdam pioneers.'
        objectives: [ILCs Vivier]
      - type: choice
        difficulty: 5
        question:
          pt: Tissue-resident memory T cells (Trm, Wijeyesinghe/Masopust 2010s) é…
          en: Tissue-resident memory T cells (Trm, Wijeyesinghe/Masopust 2010s) are…
        choices:
          - Non-circulating CD8+ T cells permanently residing in peripheral tissues (skin, lung, gut, brain) providing rapid frontline defense; CD69+/CD103+ markers
          - Pure circulating effector T cells
          - B-cell lineage only
          - Naïve T cells without memory
        correctAnswer: Non-circulating CD8+ T cells permanently residing in peripheral tissues (skin, lung, gut, brain) providing rapid frontline defense; CD69+/CD103+ markers
        rationale:
          pt: 'Trm (Tissue-resident memory T cells): David Masopust Univ Minnesota pioneer (Wakim Cell 2007, Masopust JEM 2010). T cell memory subsets: TCM (central memory, lymph node circulating), TEM (effector memory, blood + tissue circulating), Trm (tissue-resident permanently). Markers: CD69+ (S1PR1 downregulated retains in tissue), CD103+ (αEβ7 integrin binds E-cadherin epithelial), CD49a, CXCR6, AhR-dependent in some tissues. Differentiation: tissue-derived TGF-β + IL-15. Function: long-lived (months-years), respond rapidly local pathogen re-encounter (~hours vs days circulating recruitment), produce IFN-γ + TNF + granzyme. Tissues: skin (HSV protection), gut/intestine (oral pathogen defense), lung (influenza, RSV), brain (T cell mediated infections). Importance: vaccine development — induce Trm in target tissue for optimal protection (mRNA vaccines IM induce systemic + tissue Trm partially; intranasal vaccines being explored for lung Trm). Cancer: Trm in tumors associated with better survival (predictor of immunotherapy response). Field 2024+ active.'
          en: 'Trm (Tissue-resident memory T cells): David Masopust Univ Minnesota pioneer (Wakim Cell 2007, Masopust JEM 2010). T cell memory subsets: TCM (central memory, lymph node circulating), TEM (effector memory, blood + tissue circulating), Trm (tissue-resident permanently). Markers: CD69+ (S1PR1 downregulated retains in tissue), CD103+ (αEβ7 integrin binds E-cadherin epithelial), CD49a, CXCR6, AhR-dependent in some tissues. Differentiation: tissue-derived TGF-β + IL-15. Function: long-lived (months-years), respond rapidly to local pathogen re-encounter (~hours vs days for circulating recruitment), produce IFN-γ + TNF + granzyme. Tissues: skin (HSV protection), gut/intestine (oral pathogen defense), lung (influenza, RSV), brain (T cell mediated infections). Importance for vaccine development — induce Trm in target tissue for optimal protection (mRNA vaccines IM induce systemic + tissue Trm partially; intranasal vaccines being explored for lung Trm). Cancer: Trm in tumors associated with better survival (predictor of immunotherapy response). Field 2024+ active.'
        objectives: [Trm tissue-resident memory]
      - type: choice
        difficulty: 5
        question:
          pt: cDC1 dendritic cells + tumor antigen cross-presentation é…
          en: cDC1 dendritic cells + tumor antigen cross-presentation is…
        choices:
          - Conventional DC subset (CD8α+ in mice / CD141+ in humans, BATF3-dependent) cross-presenting exogenous tumor antigens on MHC-I to CD8+ T cells — critical for anti-tumor immunity
          - Pure plasmacytoid DC type
          - B-cell lineage only
          - Mast cells
        correctAnswer: Conventional DC subset (CD8α+ in mice / CD141+ in humans, BATF3-dependent) cross-presenting exogenous tumor antigens on MHC-I to CD8+ T cells — critical for anti-tumor immunity
        rationale:
          pt: 'cDC1 dendritic cells: conventional DC subset specialized cross-presentation. Murphy Wash U + Reis e Sousa Crick London pioneers. Markers: mouse CD8α+ (lymphoid tissue) ou CD103+ (peripheral tissue), human CD141+/BDCA-3+ (peripheral blood + tissue). Master TF: BATF3 (transcription factor) — BATF3 KO mice lack cDC1 → impaired CD8 T cell responses, increased tumor susceptibility (Hildner Edelson Purtha Murphy Diamond Murphy Sci 2008). Cross-presentation: uniquely efficient cDC1 → exogenous antigens (tumor-derived) loaded MHC-I via cytosolic pathway → CD8+ T cell priming. Cancer relevance: tumor cDC1 abundance prognostic + ICI response prediction (Spranger Bao Gajewski Nature 2017). cDC1 deficient tumors (low Batf3+ infiltration) → cold immunologically. Therapeutic strategies expand cDC1: FLT3L (Flt3 ligand) administration (CDX-301 Celldex), oncolytic viruses (recruit cDC1), chemoradiation (release tumor antigens). Concurrent: cDC2 (TH polarization), pDC (plasmacytoid DC, type I IFN), moDC (monocyte-derived DC inflammation). Tumor immunotherapy era cDC1 central focus 2018+.'
          en: 'cDC1 dendritic cells: conventional DC subset specialized in cross-presentation. Murphy Wash U + Reis e Sousa Crick London pioneers. Markers: mouse CD8α+ (lymphoid tissue) or CD103+ (peripheral tissue), human CD141+/BDCA-3+ (peripheral blood + tissue). Master TF: BATF3 (transcription factor) — BATF3 KO mice lack cDC1 → impaired CD8 T cell responses, increased tumor susceptibility (Hildner/Murphy Sci 2008). Cross-presentation: uniquely efficient in cDC1 → exogenous antigens (tumor-derived) loaded onto MHC-I via cytosolic pathway → CD8+ T cell priming. Cancer relevance: tumor cDC1 abundance prognostic + ICI response prediction (Spranger/Gajewski Nature 2017). Tumors deficient in cDC1 (low Batf3+ infiltration) → immunologically cold. Therapeutic strategies to expand cDC1: FLT3L (Flt3 ligand) administration (CDX-301 Celldex), oncolytic viruses (recruit cDC1), chemoradiation (release tumor antigens). Concurrent: cDC2 (TH polarization), pDC (plasmacytoid DC, type I IFN), moDC (monocyte-derived DC in inflammation). Tumor immunotherapy era cDC1 central focus 2018+.'
        objectives: [cDC1 cross-presentation]
      - type: choice
        difficulty: 5
        question:
          pt: HLA biology + tissue typing transplantation + autoimmunity é…
          en: HLA biology + tissue typing transplantation + autoimmunity is…
        choices:
          - HLA class I (A/B/C) presents endogenous antigens to CD8 T cells; class II (DR/DQ/DP) presents exogenous antigens to CD4 T cells; HLA matching critical for transplantation + disease associations
          - Pure metabolic genes without immune role
          - Single HLA gene without polymorphism
          - Identical across all individuals
        correctAnswer: HLA class I (A/B/C) presents endogenous antigens to CD8 T cells; class II (DR/DQ/DP) presents exogenous antigens to CD4 T cells; HLA matching critical for transplantation + disease associations
        rationale:
          pt: 'HLA (Human Leukocyte Antigens, MHC Major Histocompatibility Complex chromosome 6p21): most polymorphic genes humanos (~30000+ alleles cataloged). Class I (HLA-A, HLA-B, HLA-C) — expressed all nucleated cells, present endogenous peptides ~8-11mer to CD8+ T cells (cytotoxic). Heavy chain α + β2-microglobulin. Class II (HLA-DR, DQ, DP) — APCs (dendritic cells, B cells, macrophages) thymic + activated T cells, present exogenous peptides ~13-25mer to CD4+ T cells (helper). αβ heterodimer. Importance: (1) Transplantation — HLA matching critical donor-recipient compatibility (allogeneic HSC transplant 10/10 HLA-A/B/C/DRB1/DQB1 ideal; solid organ deceased donor HLA matching graft survival ~90% HLA-A/B + DR). (2) Autoimmunity — HLA-B27 ankylosing spondylitis ~90% +, HLA-DR3/4 type 1 diabetes, HLA-DR4 rheumatoid arthritis, HLA-B57:01 abacavir hypersensitivity, HLA-DQ2/DQ8 celiac disease ~95%. (3) Pharmacogenomics — HLA-B58:01 allopurinol Stevens-Johnson Asians, HLA-B15:02 carbamazepine Asians. (4) Cancer immunotherapy — HLA-LOH loss heterozygosity escape mechanism. Polymorphism evolutionary advantage: pathogen co-evolution heterozygote advantage. Foundation field organ transplant + immune therapy.'
          en: 'HLA (Human Leukocyte Antigens, MHC Major Histocompatibility Complex on chromosome 6p21): most polymorphic genes in humans (~30000+ alleles cataloged). Class I (HLA-A, HLA-B, HLA-C) — expressed on all nucleated cells, present endogenous peptides ~8-11mer to CD8+ T cells (cytotoxic). Heavy chain α + β2-microglobulin. Class II (HLA-DR, DQ, DP) — APCs (dendritic cells, B cells, macrophages) in thymus + activated T cells, present exogenous peptides ~13-25mer to CD4+ T cells (helper). αβ heterodimer. Importance: (1) Transplantation — HLA matching critical for donor-recipient compatibility (allogeneic HSC transplant 10/10 HLA-A/B/C/DRB1/DQB1 ideal; solid organ deceased donor HLA matching for graft survival ~90% HLA-A/B + DR). (2) Autoimmunity — HLA-B27 ankylosing spondylitis ~90% +, HLA-DR3/4 type 1 diabetes, HLA-DR4 rheumatoid arthritis, HLA-B57:01 abacavir hypersensitivity, HLA-DQ2/DQ8 celiac disease ~95%. (3) Pharmacogenomics — HLA-B58:01 allopurinol Stevens-Johnson in Asians, HLA-B15:02 carbamazepine in Asians. (4) Cancer immunotherapy — HLA-LOH loss of heterozygosity as escape mechanism. Polymorphism evolutionary advantage: pathogen co-evolution heterozygote advantage. Foundation of organ transplant + immune therapy fields.'
        objectives: [HLA biology]
      - type: choice
        difficulty: 5
        question:
          pt: Allergy + asthma biologics dupilumab é…
          en: Allergy + asthma biologics dupilumab is…
        choices:
          - Anti-IL-4Rα blocking IL-4/IL-13 Th2/ILC2 signaling — FDA-approved atopic dermatitis (2017), asthma, EoE, prurigo nodularis, COPD; Sanofi/Regeneron Dupixent ~$8B sales
          - Pure antihistamine
          - Standard SSRI
          - Vaccine-based asthma
        correctAnswer: Anti-IL-4Rα blocking IL-4/IL-13 Th2/ILC2 signaling — FDA-approved atopic dermatitis (2017), asthma, EoE, prurigo nodularis, COPD; Sanofi/Regeneron Dupixent ~$8B sales
        rationale:
          pt: 'Dupilumab (Dupixent, Sanofi/Regeneron): humanized monoclonal antibody anti-IL-4Rα → blocks IL-4 + IL-13 cytokine signaling (shared receptor subunit). IL-4/IL-13 — Th2 + ILC2 cytokines → drive type 2 inflammation: IgE class-switching B cells, mucus production, eosinophilia, fibrosis. FDA approvals expanding: (1) Atopic dermatitis (eczema) 2017 — moderate-severe adults + adolescents + pediatric ≥6 months (2022). Transformative ~70% patients ~75%+ EASI improvement. (2) Severe asthma 2018 — eosinophilic phenotype + oral corticosteroid-dependent. (3) Chronic rhinosinusitis nasal polyps 2019. (4) Eosinophilic esophagitis (EoE) 2022 — first FDA EoE biologic. (5) Prurigo nodularis 2022 — first ever drug for. (6) COPD eosinophilic phenotype 2024 — first biologic COPD. Other Type 2 biologics: omalizumab (Xolair anti-IgE asthma 2003), mepolizumab/reslizumab (anti-IL-5 eosinophilic asthma), benralizumab (anti-IL-5Rα Fasenra), tezepelumab (anti-TSLP Tezspire 2021 broader asthma phenotypes). Field 2024 ~$15-20B+ Type 2 biologics market. Atopic dermatitis JAK inhibitors abrocitinib upadacitinib oral alternative. Dupixent ~$8-10B annual sales 2024+.'
          en: 'Dupilumab (Dupixent, Sanofi/Regeneron): humanized monoclonal antibody anti-IL-4Rα → blocks IL-4 + IL-13 cytokine signaling (shared receptor subunit). IL-4/IL-13 — Th2 + ILC2 cytokines → drive type 2 inflammation: IgE class-switching B cells, mucus production, eosinophilia, fibrosis. FDA approvals expanding: (1) Atopic dermatitis (eczema) 2017 — moderate-severe adults + adolescents + pediatric ≥6 months (2022). Transformative ~70% of patients ~75%+ EASI improvement. (2) Severe asthma 2018 — eosinophilic phenotype + oral corticosteroid-dependent. (3) Chronic rhinosinusitis with nasal polyps 2019. (4) Eosinophilic esophagitis (EoE) 2022 — first FDA-approved EoE biologic. (5) Prurigo nodularis 2022 — first-ever drug for. (6) COPD eosinophilic phenotype 2024 — first biologic for COPD. Other Type 2 biologics: omalizumab (Xolair anti-IgE asthma 2003), mepolizumab/reslizumab (anti-IL-5 eosinophilic asthma), benralizumab (anti-IL-5Rα Fasenra), tezepelumab (anti-TSLP Tezspire 2021 broader asthma phenotypes). Field 2024 ~$15-20B+ Type 2 biologics market. Atopic dermatitis JAK inhibitors abrocitinib upadacitinib oral alternative. Dupixent ~$8-10B annual sales 2024+.'
        objectives: [Dupilumab Type 2]
      - type: choice
        difficulty: 5
        question:
          pt: BTK inhibitors B-cell malignancies + autoimmunity é…
          en: BTK inhibitors B-cell malignancies + autoimmunity are…
        choices:
          - Bruton tyrosine kinase inhibitors (ibrutinib Imbruvica J&J 2013) blocking B-cell receptor signaling — CLL, MCL, MZL, WM lymphomas + ITP + rheumatoid arthritis trials; covalent + reversible classes
          - Pure chemotherapy without targeted approach
          - Standard antibody therapy
          - Vaccine-based hematology
        correctAnswer: Bruton tyrosine kinase inhibitors (ibrutinib Imbruvica J&J 2013) blocking B-cell receptor signaling — CLL, MCL, MZL, WM lymphomas + ITP + rheumatoid arthritis trials; covalent + reversible classes
        rationale:
          pt: 'BTK (Bruton Tyrosine Kinase) inhibitors: BTK X-linked kinase essential B-cell receptor (BCR) signaling. XLA (X-linked Agammaglobulinemia, Bruton 1952) — BTK loss-of-function → B-cell deficiency. Drug development reverse: BTK inhibition reduce B-cell malignancies + autoimmunity. (1) Ibrutinib (Imbruvica J&J/AbbVie/Pharmacyclics 2013): covalent C481 BTK inhibitor (acrylamide warhead). FDA approvals: CLL chronic lymphocytic leukemia, MCL mantle cell lymphoma, WM Waldenström macroglobulinemia, MZL marginal zone lymphoma, cGvHD chronic graft-versus-host disease. ~$10B+ sales peak before generic 2025+. AEs: atrial fibrillation ~10-15%, bleeding (BTK inhibits platelet aggregation), infections. (2) Acalabrutinib (Calquence AstraZeneca 2017) — more selective, fewer off-target AEs. (3) Zanubrutinib (Brukinsa BeiGene 2019) — high BTK occupancy oncology. (4) Pirtobrutinib (Jaypirca Eli Lilly/Loxo 2023) — non-covalent (reversible) BTK inhibitor, overcomes C481 mutation resistance to covalent inhibitors. Autoimmunity emerging: rheumatoid arthritis (RA), multiple sclerosis (MS evobrutinib Phase 3 negative 2024+), pemphigus vulgaris, ITP rilzabrutinib (Sanofi/Genentech). Field 2024+ active mature CLL + emerging autoimmune. Concurrent: BTK PROTACs (ARQ-531 Arqule, NX-2127 Nurix, BGB-16673 BeiGene) Phase 1+ degraders.'
          en: 'BTK (Bruton Tyrosine Kinase) inhibitors: BTK X-linked kinase essential for B-cell receptor (BCR) signaling. XLA (X-linked Agammaglobulinemia, Bruton 1952) — BTK loss-of-function → B-cell deficiency. Drug development reverse: BTK inhibition reduces B-cell malignancies + autoimmunity. (1) Ibrutinib (Imbruvica J&J/AbbVie/Pharmacyclics 2013): covalent C481 BTK inhibitor (acrylamide warhead). FDA approvals: CLL chronic lymphocytic leukemia, MCL mantle cell lymphoma, WM Waldenström macroglobulinemia, MZL marginal zone lymphoma, cGvHD chronic graft-versus-host disease. ~$10B+ sales peak before generic 2025+. AEs: atrial fibrillation ~10-15%, bleeding (BTK inhibits platelet aggregation), infections. (2) Acalabrutinib (Calquence AstraZeneca 2017) — more selective, fewer off-target AEs. (3) Zanubrutinib (Brukinsa BeiGene 2019) — high BTK occupancy oncology. (4) Pirtobrutinib (Jaypirca Eli Lilly/Loxo 2023) — non-covalent (reversible) BTK inhibitor, overcomes C481 mutation resistance to covalent inhibitors. Autoimmunity emerging: rheumatoid arthritis (RA), multiple sclerosis (MS evobrutinib Phase 3 negative 2024+), pemphigus vulgaris, ITP rilzabrutinib (Sanofi/Genentech). Field 2024+ active mature for CLL + emerging for autoimmune. Concurrent: BTK PROTACs (ARQ-531 Arqule, NX-2127 Nurix, BGB-16673 BeiGene) Phase 1+ degraders.'
        objectives: [BTK inhibitors]
      - type: choice
        difficulty: 5
        question:
          pt: JAK inhibitors em autoimmunidade (tofacitinib, upadacitinib, baricitinib) é…
          en: JAK inhibitors in autoimmunity (tofacitinib, upadacitinib, baricitinib) is…
        choices:
          - Small-molecule kinase inhibitors blocking JAK1/2/3/TYK2 phosphorylation of STATs downstream of cytokine receptors — RA, ulcerative colitis, alopecia areata, atopic dermatitis broad indications
          - Pure biologic mAb without small molecule
          - Standard chemotherapy
          - Vaccine-based therapy
        correctAnswer: Small-molecule kinase inhibitors blocking JAK1/2/3/TYK2 phosphorylation of STATs downstream of cytokine receptors — RA, ulcerative colitis, alopecia areata, atopic dermatitis broad indications
        rationale:
          pt: 'JAK inhibitors: Janus kinase family (JAK1, JAK2, JAK3, TYK2) — bind cytokine receptor cytoplasmic domains (Type I/II cytokine receptors → IFN, IL-6, IL-2, IL-4, GM-CSF, EPO etc), phosphorylate STAT transcription factors → cytokine-driven gene expression. JAK inhibition reduces inflammatory signaling. Drugs: (1) Tofacitinib (Xeljanz Pfizer 2012) — pan-JAK preferential JAK1/JAK3, RA, UC, psoriatic arthritis, ankylosing spondylitis, JIA. (2) Baricitinib (Olumiant Lilly/Incyte 2018) — JAK1/2 selective; RA + alopecia areata 2022 + atopic dermatitis + COVID-19 hospitalized. (3) Upadacitinib (Rinvoq AbbVie 2019) — JAK1-selective; RA + atopic dermatitis + UC + Crohn + ankylosing spondylitis + axial SpA + GVHD. (4) Filgotinib (Jyseleca Galapagos/Gilead) — JAK1 RA + UC. (5) Abrocitinib (Cibinqo Pfizer 2022) — JAK1 atopic dermatitis. (6) Deucravacitinib (Sotyktu BMS 2022) — TYK2 selective psoriasis. (7) Ruxolitinib (Jakafi Incyte 2011) — JAK1/2 myelofibrosis + PV + GvHD; topical Opzelura atopic dermatitis 2021 + vitiligo 2022. AEs: infections (especially zoster), MACE major adverse cardiovascular events + thromboembolism (FDA boxed warning 2021 oral JAK inhibitors), malignancy. ~$15-20B+ JAK inhibitor market 2024.'
          en: 'JAK inhibitors: Janus kinase family (JAK1, JAK2, JAK3, TYK2) — bind cytokine receptor cytoplasmic domains (Type I/II cytokine receptors → IFN, IL-6, IL-2, IL-4, GM-CSF, EPO etc), phosphorylate STAT transcription factors → cytokine-driven gene expression. JAK inhibition reduces inflammatory signaling. Drugs: (1) Tofacitinib (Xeljanz Pfizer 2012) — pan-JAK preferential JAK1/JAK3, for RA, UC, psoriatic arthritis, ankylosing spondylitis, JIA. (2) Baricitinib (Olumiant Lilly/Incyte 2018) — JAK1/2 selective; RA + alopecia areata 2022 + atopic dermatitis + COVID-19 hospitalized. (3) Upadacitinib (Rinvoq AbbVie 2019) — JAK1-selective; RA + atopic dermatitis + UC + Crohn + ankylosing spondylitis + axial SpA + GVHD. (4) Filgotinib (Jyseleca Galapagos/Gilead) — JAK1 for RA + UC. (5) Abrocitinib (Cibinqo Pfizer 2022) — JAK1 for atopic dermatitis. (6) Deucravacitinib (Sotyktu BMS 2022) — TYK2 selective for psoriasis. (7) Ruxolitinib (Jakafi Incyte 2011) — JAK1/2 for myelofibrosis + PV + GvHD; topical Opzelura for atopic dermatitis 2021 + vitiligo 2022. AEs: infections (especially zoster), MACE major adverse cardiovascular events + thromboembolism (FDA boxed warning 2021 for oral JAK inhibitors), malignancy. ~$15-20B+ JAK inhibitor market 2024.'
