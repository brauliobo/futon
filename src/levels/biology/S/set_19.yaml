        rationale:
          pt: 'Hygiene hypothesis: David Strachan BMJ 1989 noticed inverse correlation hay fever + family size — older siblings reduce risk allergies. Hypothesized: reduced infectious exposure during early childhood (smaller families, sanitation, antibiotics, vaccines) → impaired immune education → allergic + autoimmune diseases. Subsequent: rising prevalence asthma (~20% pediatric Western), atopic dermatitis (~20%), food allergies, IBD, T1D, MS in industrialized countries vs developing. Modern formulations: (1) Old friends hypothesis (Rook 2003) — co-evolution mammal immune system with specific microbes; modern lifestyle reduces "old friends" macrofauna helminths + saprophytic mycobacteria. (2) Biodiversity hypothesis (von Hertzen Hanski Haahtela 2011 PNAS) — microbial diversity environmental + skin/gut exposure during critical developmental window shapes Treg + immune tolerance. Karelian-Russian comparison: same genetics, opposite Sodium type 1 diabetes prevalence higher Finland (modern) vs Karelia (less modern). Aplicações therapeutic: (1) prebiotics/probiotics infants. (2) FMT autoimmune. (3) Helminth therapy (Trichuris suis ova for IBD trials). (4) Outdoor exposure pediatric. (5) Avoid unnecessary antibiotic infants. Concurrent: oral immunotherapy food allergies (Palforzia FDA 2020 peanut allergy AR101).'
          en: 'Hygiene hypothesis: David Strachan BMJ 1989 noticed inverse correlation between hay fever + family size — older siblings reduce risk of allergies. Hypothesized: reduced infectious exposure during early childhood (smaller families, sanitation, antibiotics, vaccines) → impaired immune education → allergic + autoimmune diseases. Subsequent: rising prevalence of asthma (~20% pediatric in Western countries), atopic dermatitis (~20%), food allergies, IBD, T1D, MS in industrialized countries vs developing. Modern formulations: (1) Old friends hypothesis (Rook 2003) — co-evolution of mammalian immune system with specific microbes; modern lifestyle reduces "old friends" macrofauna helminths + saprophytic mycobacteria. (2) Biodiversity hypothesis (von Hertzen/Hanski/Haahtela 2011 PNAS) — microbial diversity in environment + skin/gut exposure during critical developmental window shapes Treg + immune tolerance. Karelian-Russian comparison: same genetics, opposite gradient — type 1 diabetes prevalence higher in Finland (modern) vs Karelia (less modern). Therapeutic applications: (1) prebiotics/probiotics in infants. (2) FMT for autoimmune. (3) Helminth therapy (Trichuris suis ova for IBD trials). (4) Outdoor exposure pediatric. (5) Avoid unnecessary antibiotics in infants. Concurrent: oral immunotherapy for food allergies (Palforzia FDA 2020 peanut allergy AR101).'
