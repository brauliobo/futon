        correctAnswer: Bacterial fermentation products of dietary fiber, butyrate primary energy source for colonocytes + Treg-inducing + anti-inflammatory; F. prausnitzii major butyrate producer depleted in IBD
        rationale:
          pt: 'SCFA + Faecalibacterium prausnitzii: Faecalibacterium prausnitzii (Firmicutes phylum, Clostridiales order) — most abundant gut bacterium ~5-15% healthy human stool. Major butirato producer via fermentation dietary fiber. Other SCFA producers: Eubacterium rectale, Roseburia spp, Coprococcus. SCFA: acetate (~60%), propionate (~25%), butyrate (~15%) molar ratio. Functions: (1) Butyrate primary energy source colonócitos (~70% energy fonte). (2) Histone deacetylase (HDAC) inhibition — epigenetic effects, anti-inflammatory. (3) GPR41/GPR43 (FFAR3/FFAR2) GPCR signaling on immune + enteroendocrine cells. (4) Induce Treg differentiation (Smith/Garrett Sci 2013, Arpaia/Rudensky Nat 2013) — butyrate ↑ Foxp3+ Tregs gut immune homeostasis. (5) Strengthen gut barrier (tight junctions). Aplicações: F. prausnitzii depletion ~50% IBD inflammatory bowel disease + Crohn (Sokol PNAS 2008) — therapeutic target. Drugs: (1) Vedolizumab (Entyvio Takeda) anti-α4β7 IBD. (2) Fecal microbiota transplant (FMT) C. difficile (Vowst/Rebyota S/set_08), severe IBD. (3) Defined consortia (VE303 Vedanta Phase 2 C. difficile, EDP1815 Evelo psoriasis). (4) Prebiotic fiber supplementation (inulin, resistant starch, β-glucan). (5) Postbiotic butyrate formulations. Field 2024 active.'
          en: 'SCFA + Faecalibacterium prausnitzii: Faecalibacterium prausnitzii (Firmicutes phylum, Clostridiales order) — most abundant gut bacterium ~5-15% of healthy human stool. Major butyrate producer via fermentation of dietary fiber. Other SCFA producers: Eubacterium rectale, Roseburia spp, Coprococcus. SCFA: acetate (~60%), propionate (~25%), butyrate (~15%) molar ratio. Functions: (1) Butyrate as primary energy source for colonocytes (~70% energy source). (2) Histone deacetylase (HDAC) inhibition — epigenetic effects, anti-inflammatory. (3) GPR41/GPR43 (FFAR3/FFAR2) GPCR signaling on immune + enteroendocrine cells. (4) Induce Treg differentiation (Smith/Garrett Sci 2013, Arpaia/Rudensky Nat 2013) — butyrate ↑ Foxp3+ Tregs gut immune homeostasis. (5) Strengthen gut barrier (tight junctions). Applications: F. prausnitzii depletion in ~50% of IBD inflammatory bowel disease + Crohn (Sokol PNAS 2008) — therapeutic target. Drugs: (1) Vedolizumab (Entyvio Takeda) anti-α4β7 for IBD. (2) Fecal microbiota transplant (FMT) for C. difficile (Vowst/Rebyota S/set_08), severe IBD. (3) Defined consortia (VE303 Vedanta Phase 2 C. difficile, EDP1815 Evelo psoriasis). (4) Prebiotic fiber supplementation (inulin, resistant starch, β-glucan). (5) Postbiotic butyrate formulations. Field 2024 active.'
