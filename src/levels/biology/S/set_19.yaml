        question:
          pt: Akkermansia muciniphila + metabolic health (Cani Belgique 2017+ Nat Med) é…
          en: Akkermansia muciniphila + metabolic health (Cani Belgium 2017+ Nat Med) is…
        choices:
          - Mucin-degrading gut bacterium associated with metabolic health, Akkermansia depletion in obesity/diabetes — pasteurized supplementation Phase 2 trials improving insulin sensitivity
          - Pure pathogen without health benefit
          - Skin commensal without metabolic effect
          - Single-strain antibiotic
        correctAnswer: Mucin-degrading gut bacterium associated with metabolic health, Akkermansia depletion in obesity/diabetes — pasteurized supplementation Phase 2 trials improving insulin sensitivity
        rationale:
          pt: 'Akkermansia muciniphila: Verrucomicrobia phylum mucin-degrading gut commensal ~3-5% of healthy human gut microbiome. Discovered Derrien/de Vos 2004. Negative association obesity, type 2 diabetes, metabolic syndrome — Cani lab Louvain Nat Med 2013 mouse studies + 2017 humans Phase 2 trial (Depommier/Cani Nat Med 2019): pasteurized Akkermansia (live or heat-killed) supplementation 12-week obese/insulin-resistant patients → improved insulin sensitivity, plasma cholesterol, reduced inflammation. Mecanismo: degrades mucin → produces short-chain fatty acids (SCFA acetate, propionate) → modulates intestinal barrier integrity, reduces metabolic endotoxemia (LPS leakage), Amuc_1100 outer membrane protein toll-like receptor 2 signaling → IL-10. Subsequent: Akkermansia abundance correlation cancer immunotherapy response (Routy/Zitvogel Sci 2018). Companies: Pendulum Therapeutics (2020+ Akkermansia probiotic FDA-cleared "medical food" T2D), Microba (microbiome diagnostic), A-Mansia Biotech (Cani spinoff). Limit: live-bacterium delivery survival, regulatory pathway "live biotherapeutic" emerging. Field 2024 Akkermansia multi-disease applications expanding.'
          en: 'Akkermansia muciniphila: Verrucomicrobia phylum mucin-degrading gut commensal ~3-5% of healthy human gut microbiome. Discovered by Derrien/de Vos 2004. Negative association with obesity, type 2 diabetes, metabolic syndrome — Cani lab Louvain Nat Med 2013 in mouse studies + 2017 humans Phase 2 trial (Depommier/Cani Nat Med 2019): pasteurized Akkermansia (live or heat-killed) supplementation 12-week obese/insulin-resistant patients → improved insulin sensitivity, plasma cholesterol, reduced inflammation. Mechanism: degrades mucin → produces short-chain fatty acids (SCFA acetate, propionate) → modulates intestinal barrier integrity, reduces metabolic endotoxemia (LPS leakage), Amuc_1100 outer membrane protein activates toll-like receptor 2 signaling → IL-10. Subsequent: Akkermansia abundance correlates with cancer immunotherapy response (Routy/Zitvogel Sci 2018). Companies: Pendulum Therapeutics (2020+ Akkermansia probiotic FDA-cleared "medical food" for T2D), Microba (microbiome diagnostic), A-Mansia Biotech (Cani spinoff). Limit: live-bacterium delivery survival, regulatory pathway "live biotherapeutic" emerging. Field 2024 Akkermansia multi-disease applications expanding.'
