          pt: Microbiome cancer (Sears tumor-associated microbiota Cell 2018+) é…
          en: Microbiome cancer (Sears tumor-associated microbiota Cell 2018+) is…
        choices:
          - Tumor-resident microbes (intratumoral bacteria/fungi) influence tumor progression + therapy response — colorectal cancer Fusobacterium, breast cancer mycobiome, melanoma microbiome
          - Pure pathogen-free tumors
          - No microbe-cancer connection
          - Single-cancer phenomenon only
        correctAnswer: Tumor-resident microbes (intratumoral bacteria/fungi) influence tumor progression + therapy response — colorectal cancer Fusobacterium, breast cancer mycobiome, melanoma microbiome
        rationale:
          pt: 'Tumor microbiome: intratumoral microbes — bacteria, fungi, viruses — direct tumor compartment (não just gut). Recent atlas: Nejman/Straussman Israel Sci 2020 — characterized ~7 cancer types: each cancer distinct microbiome composition, ~10⁵-10⁷ bacteria/g tumor tissue. Fungi: Aykut/Pushalkar/Miller NYU Cell 2019 + Narunsky-Haziza/Sears Cell 2022 mycobiome 35 cancer types, predominant Malassezia + Candida. Specific examples: (1) Colorectal cancer + Fusobacterium nucleatum (Castellarin/Allen Genome Res 2012, Kostic 2012) — F. nucleatum biofilms invade tumors, immunosuppressive, chemoresistance. (2) Pancreatic ductal adenocarcinoma (PDAC) — gut-tumor microbiome translocation Riquelme/Wargo Cell 2019 long-term survivors enriched Pseudoxanthomonas, Saccharopolyspora, Streptomyces. (3) Breast cancer + tissue-specific microbiota (Banerjee 2018). (4) Melanoma — both gut + skin microbiome influence ICI response. Therapeutics: antibiotics targeting tumor microbiome (Bullman/Meyerson Sci 2017 metronidazole reduce F. nucleatum + tumor growth mice), engineered phages selective bacteria, fungi-targeted antifungals as adjuvants. Field 2024+ rapidly expanding — companies: Bristol Myers Squibb internal microbiome cancer program, Bria-Cell, Microbiotica.'
          en: 'Tumor microbiome: intratumoral microbes — bacteria, fungi, viruses — directly in the tumor compartment (not just gut). Recent atlas: Nejman/Straussman Israel Sci 2020 — characterized ~7 cancer types: each cancer has distinct microbiome composition, ~10⁵-10⁷ bacteria/g of tumor tissue. Fungi: Aykut/Pushalkar/Miller NYU Cell 2019 + Narunsky-Haziza/Sears Cell 2022 mycobiome across 35 cancer types, predominant Malassezia + Candida. Specific examples: (1) Colorectal cancer + Fusobacterium nucleatum (Castellarin/Allen Genome Res 2012, Kostic 2012) — F. nucleatum biofilms invade tumors, immunosuppressive, chemoresistance. (2) Pancreatic ductal adenocarcinoma (PDAC) — gut-tumor microbiome translocation Riquelme/Wargo Cell 2019, long-term survivors enriched in Pseudoxanthomonas, Saccharopolyspora, Streptomyces. (3) Breast cancer + tissue-specific microbiota (Banerjee 2018). (4) Melanoma — both gut + skin microbiome influence ICI response. Therapeutics: antibiotics targeting tumor microbiome (Bullman/Meyerson Sci 2017 metronidazole reduces F. nucleatum + tumor growth in mice), engineered phages for selective bacteria, fungi-targeted antifungals as adjuvants. Field 2024+ rapidly expanding — companies: Bristol Myers Squibb internal microbiome cancer program, Bria-Cell, Microbiotica.'
