        question:
          pt: HMOs (Human Milk Oligosaccharides) + infant gut microbiome é…
          en: HMOs (Human Milk Oligosaccharides) + infant gut microbiome is…
        choices:
          - ~200 distinct oligosaccharides in breast milk (3rd most abundant solid component) selectively feeding Bifidobacterium infantis dominating healthy infant gut, supporting development + immunity
          - Pure mineral content without organic component
          - Digested by infant directly without microbial role
          - Identical to cow milk composition
        correctAnswer: ~200 distinct oligosaccharides in breast milk (3rd most abundant solid component) selectively feeding Bifidobacterium infantis dominating healthy infant gut, supporting development + immunity
        rationale:
          pt: 'HMOs (Human Milk Oligosaccharides): ~200 distinct oligosaccharide structures characterized human breast milk, ~5-15g/L (third most abundant solid after lactose + lipids). Predominant: 2''-FL (2''-fucosyllactose), 3-FL, LNT (lacto-N-tetraose), LNnT, 6''-SL, 3''-SL, LNFP-I (lacto-N-fucopentaose), DSLNT (sialylated). Não digestible direct infant — selectively fermented by Bifidobacterium infantis subsp. infantis (subsp B. infantis) → SCFA + lactate → acidify gut → reduce pathogen colonization → dominate healthy breastfed infant gut microbiome (~80%+ Bifidobacterium). Functions: (1) Selective prebiotic Bifidobacterium. (2) Direct anti-infective receptor decoys (block pathogen lectins). (3) Support brain development (sialylated HMOs sialic acid neural). (4) Gut barrier maturation. (5) Reduce necrotizing enterocolitis (NEC) preterm infants. Formula fortification: synthetic HMOs (2''-FL Glycom/DSM, 3''-SL DuPont/Friesland) added infant formulas 2016+ EU/USA. Subsequent: HMO-mimicking probiotics — Evivo (B. infantis EVC001 Evolve BioSystems) infant gut "rescue" therapy preterm + C-section infants. Field 2024+ expanding adult applications (anti-inflammatory, IBD).'
          en: 'HMOs (Human Milk Oligosaccharides): ~200 distinct oligosaccharide structures characterized in human breast milk, ~5-15 g/L (third most abundant solid after lactose + lipids). Predominant: 2''-FL (2''-fucosyllactose), 3-FL, LNT (lacto-N-tetraose), LNnT, 6''-SL, 3''-SL, LNFP-I (lacto-N-fucopentaose), DSLNT (sialylated). Not digestible directly by infant — selectively fermented by Bifidobacterium infantis subsp. infantis (subsp B. infantis) → SCFA + lactate → acidifies gut → reduces pathogen colonization → dominate healthy breastfed infant gut microbiome (~80%+ Bifidobacterium). Functions: (1) Selective prebiotic for Bifidobacterium. (2) Direct anti-infective via receptor decoys (blocking pathogen lectins). (3) Support brain development (sialylated HMOs as sialic acid for neural). (4) Gut barrier maturation. (5) Reduce necrotizing enterocolitis (NEC) in preterm infants. Formula fortification: synthetic HMOs (2''-FL Glycom/DSM, 3''-SL DuPont/Friesland) added to infant formulas 2016+ in EU/USA. Subsequent: HMO-mimicking probiotics — Evivo (B. infantis EVC001 Evolve BioSystems) for infant gut "rescue" therapy in preterm + C-section infants. Field 2024+ expanding to adult applications (anti-inflammatory, IBD).'
