        question:
          pt: Glycobiology + glycomics fundamentals é…
          en: Glycobiology + glycomics fundamentals are…
        choices:
          - Carbohydrate structures (N-linked, O-linked, GAGs, GPI anchors) covalently modifying proteins/lipids — comprise ~50% of human proteome glycoproteins, with disease + therapeutic implications
          - Single sugar attachment without diversity
          - Pure intracellular signaling without extracellular component
          - Identical to lipid biology
        correctAnswer: Carbohydrate structures (N-linked, O-linked, GAGs, GPI anchors) covalently modifying proteins/lipids — comprise ~50% of human proteome glycoproteins, with disease + therapeutic implications
        rationale:
          pt: 'Glycobiology + glycomics: ~50% mammalian proteome modified glycans (sugars). Major classes: (1) N-linked glycans — Asn (N) residues NX(S/T) consensus motifs, ~mannose-rich → complex branched structures. Synthesized ER + Golgi via stepwise enzyme cascade. (2) O-linked glycans — Ser/Thr residues (~mucin O-GalNAc, GlcNAc — O-GlcNAc dynamic/regulatory). (3) Glycosaminoglycans (GAGs) — heparan sulfate, chondroitin sulfate, dermatan, keratan, hyaluronic acid → ECM components. (4) GPI anchors — glycosylphosphatidylinositol → tether proteins membranes (CD55, CD59, alkaline phosphatase). Functions: cell-cell recognition (selectin-Lewis-X leukocyte adhesion), receptor-ligand interactions, protein folding/quality control (calnexin/calreticulin chaperones recognize Glc-rich N-glycans), pathogen entry (HIV gp120, SARS-CoV-2 spike heavily glycosylated, influenza HA sialic acid receptors). Diseases: congenital disorders glycosylation (CDG ~150+ types — PMM2-CDG most common, multi-system pediatric), antibody-glycan modification (afucosylated IgG → enhanced ADCC trastuzumab obinutuzumab Glycotope/Mogamulizumab anti-CCR4). Therapeutic glycomics: glycan-engineered antibodies (Mogamulizumab, obinutuzumab), HIV bnAb glycan supersite-targeting (PG9, PGT145). Bertozzi/Sharpless/Meldal Nobel 2022 click chemistry enabled glycomics tools. Field 2024 mature.'
          en: 'Glycobiology + glycomics: ~50% of mammalian proteome modified by glycans (sugars). Major classes: (1) N-linked glycans — Asn (N) residues at NX(S/T) consensus motifs, ~mannose-rich → complex branched structures. Synthesized ER + Golgi via stepwise enzyme cascade. (2) O-linked glycans — Ser/Thr residues (~mucin O-GalNAc, GlcNAc — O-GlcNAc dynamic/regulatory). (3) Glycosaminoglycans (GAGs) — heparan sulfate, chondroitin sulfate, dermatan, keratan, hyaluronic acid → ECM components. (4) GPI anchors — glycosylphosphatidylinositol → tether proteins to membranes (CD55, CD59, alkaline phosphatase). Functions: cell-cell recognition (selectin-Lewis-X for leukocyte adhesion), receptor-ligand interactions, protein folding/quality control (calnexin/calreticulin chaperones recognize Glc-rich N-glycans), pathogen entry (HIV gp120, SARS-CoV-2 spike heavily glycosylated, influenza HA sialic acid receptors). Diseases: congenital disorders of glycosylation (CDG ~150+ types — PMM2-CDG most common, multi-system pediatric), antibody-glycan modification (afucosylated IgG → enhanced ADCC trastuzumab obinutuzumab Glycotope/Mogamulizumab anti-CCR4). Therapeutic glycomics: glycan-engineered antibodies (Mogamulizumab, obinutuzumab), HIV bnAb glycan supersite-targeting (PG9, PGT145). Bertozzi/Sharpless/Meldal 2022 Nobel for click chemistry enabled glycomics tools. Field 2024 mature.'
