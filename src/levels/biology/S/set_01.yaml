title:
  pt: Biologia Sintética — Engenharia de Sistemas Vivos
  en: Synthetic Biology — Engineering Living Systems
level: S
subject: biology
objectives:
  - Compreender BioBricks, iGEM, design-build-test-learn
  - Reconhecer base editing e prime editing
  - Identificar engineered cells (Ginkgo, Synlogic)
  - Avaliar minimal genome JCVI-syn3.0
difficulty: 5
authorNotes: |
  Synthetic biology. Endy/Knight MIT BioBricks 2003. iGEM 2004. JCVI-syn1.0 (2010) and
  syn3.0 (2016) Venter minimal genome ~473 genes. Liu base editing (Nat 2016) and prime
  editing (Nat 2019). Ginkgo Bioworks foundry. Synlogic engineered E. coli Nissle.
  Engineered probiotics. Cell-free systems (Jewett, Noireaux). DNA storage Microsoft 2019.
example:
  question:
    pt: Em base editing (Liu Lab, Nature 2016) e prime editing (Liu Lab, Nature 2019), as inovações chave em relação ao CRISPR/Cas9 clássico foram…
    en: In base editing (Liu Lab, Nature 2016) and prime editing (Liu Lab, Nature 2019), the key innovations over classical CRISPR/Cas9 were…
  choices:
    - Single-base conversion (C→T, A→G) and arbitrary edit installation without double-strand breaks; reduces indels and translocations
    - Faster cleavage of double-strand breaks at higher fidelity than wild-type Cas9
    - In vivo delivery to fertilized embryos for heritable germline modification approved clinically
    - Replacement of Cas9 by Cas12 enzymes solely to accommodate larger PAM sequences
  correctAnswer: Single-base conversion (C→T, A→G) and arbitrary edit installation without double-strand breaks; reduces indels and translocations
  rationale:
    pt: 'David Liu (Broad/Harvard): cytosine base editor (CBE, 2016) usa Cas9 nickase + APOBEC1 deaminase + UGI → C→T deaminação targeted. Adenine base editor (ABE, 2017) → A→G via evolved deaminase. Prime editing (PE, 2019) usa Cas9 nickase + reverse transcriptase + pegRNA → instala arbitrary edits (substitutions, small insertions/deletions) sem DSBs. Vantagens: sem indels frequentes do HDR/NHEJ, reduce translocations, off-target menores. Verve VERVE-101 PCSK9 base edit Phase 1; Beam Therapeutics CBE/ABE pipeline; Prime Medicine PRIME programs. Casgevy (CRISPR DSB) precedente da era; base/prime editing próxima geração.'
    en: 'David Liu (Broad/Harvard): cytosine base editor (CBE, 2016) uses Cas9 nickase + APOBEC1 deaminase + UGI → targeted C→T deamination. Adenine base editor (ABE, 2017) → A→G via evolved deaminase. Prime editing (PE, 2019) uses Cas9 nickase + reverse transcriptase + pegRNA → installs arbitrary edits (substitutions, small insertions/deletions) without DSBs. Advantages: no frequent indels from HDR/NHEJ, reduced translocations, smaller off-target. Verve VERVE-101 PCSK9 base edit Phase 1; Beam Therapeutics CBE/ABE pipeline; Prime Medicine PRIME programs. Casgevy (CRISPR DSB) precedent of the era; base/prime editing next generation.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Foundations + Editing
      en: Page 1 — Foundations + Editing
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: BioBricks (Endy/Knight MIT 2003) e iGEM (International Genetically Engineered Machine, 2004) estabeleceram qual paradigm engenharia biológica?
          en: BioBricks (Endy/Knight MIT 2003) and iGEM (International Genetically Engineered Machine, 2004) established what biological engineering paradigm?
        choices:
          - Standardized DNA parts (promoters, RBS, CDS, terminators) with assembly grammar enabling modular composition by undergraduate teams
          - Closed proprietary genetic libraries restricted to industry partners with paid licensing
          - Single-purpose CRISPR knockout libraries focused on tumor suppressor screening
          - Manual one-off plasmid construction without standardization or modular reuse
        correctAnswer: Standardized DNA parts (promoters, RBS, CDS, terminators) with assembly grammar enabling modular composition by undergraduate teams
        rationale:
          pt: 'BioBrick standard (Tom Knight, Drew Endy MIT 2003): partes DNA com EcoRI/XbaI/SpeI/PstI sites permitem composição modular via "idempotent assembly". Registry of Standard Biological Parts cresceu de iGEM teams. iGEM Foundation 2004 — competition annual ~7000 participants/yr global. Mindset engineering applied a biology — abstraction, modularity, decoupling. Critique: biology messier que engineering ideal (context dependencies, evolução, host effects). Successor frameworks: MoClo, Golden Gate Type IIS assembly, SBOL standard. Founded synthetic biology field cultural identity.'
          en: 'BioBrick standard (Tom Knight, Drew Endy MIT 2003): DNA parts with EcoRI/XbaI/SpeI/PstI sites enable modular composition via "idempotent assembly". Registry of Standard Biological Parts grew from iGEM teams. iGEM Foundation 2004 — annual competition ~7000 participants/yr globally. Engineering mindset applied to biology — abstraction, modularity, decoupling. Critique: biology messier than engineering ideal (context dependencies, evolution, host effects). Successor frameworks: MoClo, Golden Gate Type IIS assembly, SBOL standard. Founded synthetic biology field cultural identity.'
        objectives: [BioBricks iGEM]
      - type: choice
        difficulty: 5
        question:
          pt: JCVI-syn3.0 (Hutchison/Venter, Science 2016) demonstrou…
          en: JCVI-syn3.0 (Hutchison/Venter, Science 2016) demonstrated…
        choices:
          - Minimal viable bacterial genome ~473 genes engineered via top-down deletion of Mycoplasma; ~149 genes have unknown function
          - Total chemical synthesis of a yeast genome from oligonucleotides without any host scaffold
          - Functional minimal viral genome assembled from RNA in cell-free extracts only
          - Reverse-engineered eukaryotic minimal genome retaining mitochondrial and Golgi machinery
        correctAnswer: Minimal viable bacterial genome ~473 genes engineered via top-down deletion of Mycoplasma; ~149 genes have unknown function
        rationale:
          pt: 'JCVI-syn3.0 (Hutchison/Venter Science 2016): top-down minimization de Mycoplasma mycoides JCVI-syn1.0 (2010) — primeiro organismo com genoma totalmente sintético quimicamente. Syn3.0 ~531 kb, ~473 genes. ~149 genes essenciais função desconhecida ("dark matter" of life). Doubling time ~3h. Host engineering platform. Chassi minimal para synthetic biology rationale. Successor syn3A (2021) Pelletier Cell — adicionou genes para morphology (round cells regular shape). Genoma synthetic E. coli Syn61 (Chin Nature 2019) recoded. Yeast Sc2.0 project chromosome-by-chromosome synthesis em curso 2024+.'
          en: 'JCVI-syn3.0 (Hutchison/Venter Science 2016): top-down minimization of Mycoplasma mycoides from JCVI-syn1.0 (2010) — first organism with fully chemically synthetic genome. Syn3.0 ~531 kb, ~473 genes. ~149 essential genes have unknown function ("dark matter" of life). Doubling time ~3h. Host engineering platform. Minimal chassis rationale for synthetic biology. Successor syn3A (2021 Pelletier Cell) added genes for morphology (round regular cells). Synthetic E. coli Syn61 genome (Chin Nature 2019) recoded. Yeast Sc2.0 project chromosome-by-chromosome synthesis ongoing 2024+.'
        objectives: [JCVI-syn3.0]
      - type: choice
        difficulty: 5
        question:
          pt: Em base editing therapeutic, Verve VERVE-101 (Phase 1 readout 2023, paused 2024 → relaunched VERVE-102) targets…
          en: In therapeutic base editing, Verve VERVE-101 (Phase 1 readout 2023, paused 2024 → relaunched VERVE-102) targets…
        choices:
          - PCSK9 in liver (in vivo CBE delivered via LNP) for permanent LDL-C reduction in heterozygous familial hypercholesterolemia
          - HBB gene in hematopoietic stem cells via ex vivo lentiviral delivery for sickle cell disease
          - DMD exon-skipping target via electroporation of cardiac muscle satellite cells
          - VEGF mRNA production in retinal pigment epithelium for neovascular AMD treatment
        correctAnswer: PCSK9 in liver (in vivo CBE delivered via LNP) for permanent LDL-C reduction in heterozygous familial hypercholesterolemia
        rationale:
          pt: 'Verve Therapeutics VERVE-101: in vivo cytosine base editor delivered via LNP encapsulation a hepatocytes — disrupts splice donor site PCSK9 → loss-of-function. heart-1 trial 2023 (NEJM Lancet readout): ~55% LDL-C reduction sustained in HeFH ASCVD. Programa pausado 2024 após elevation transaminases + low-grade thrombocytopenia em alta dose. Relaunched VERVE-102 next-gen GalNAc-LNP improved profile, Phase 1b ongoing. Paradigm: durable one-time edit substitui daily statin/PCSK9 mAb. Concorrentes: Beam Therapeutics PCSK9, NTLA-2002 (HAE C1 esterase inhibitor) prime/base programs.'
          en: 'Verve Therapeutics VERVE-101: in vivo cytosine base editor delivered via LNP encapsulation to hepatocytes — disrupts PCSK9 splice donor site → loss-of-function. heart-1 trial 2023 (NEJM Lancet readout): ~55% LDL-C reduction sustained in HeFH ASCVD. Program paused 2024 after transaminase elevation + low-grade thrombocytopenia at high dose. Relaunched VERVE-102 next-gen GalNAc-LNP improved profile, Phase 1b ongoing. Paradigm: durable one-time edit replacing daily statin/PCSK9 mAb. Competitors: Beam Therapeutics PCSK9, NTLA-2002 (HAE C1 esterase inhibitor) prime/base programs.'
        objectives: [Verve VERVE-101]
      - type: choice
        difficulty: 5
        question:
          pt: Em prime editing therapeutic, Prime Medicine PM359 (CGD trial 2024) é…
          en: In therapeutic prime editing, Prime Medicine PM359 (CGD trial 2024) is…
        choices:
          - Ex vivo prime editing of HSPCs to correct CYBB mutation in chronic granulomatous disease (X-linked); first prime-editing IND
          - In vivo prime edit of intestinal epithelium correcting CFTR delF508 via inhaled LNP
          - Germline prime edit of zygotes for heritable correction of monogenic disease
          - Targeted prime edit of pancreatic islet cells reversing established type 1 diabetes
        correctAnswer: Ex vivo prime editing of HSPCs to correct CYBB mutation in chronic granulomatous disease (X-linked); first prime-editing IND
        rationale:
          pt: 'Prime Medicine PM359: ex vivo prime editing autologous CD34+ HSPCs corrige CYBB c.676 C>T mutation X-linked chronic granulomatous disease (CGD) — restora gp91phox NADPH oxidase function em phagocytes. First-in-human prime editing IND 2023, dosing 2024. Prime editing vantagem CGD: substitution C→T reverse, sem DSBs, mínimo off-target. Pipeline broader: PM577 (β-globin SCD), PM1027 (Wilson), PM577 (PGM3 immunodeficiency). Liu Lab spinout (Beam, Prime Medicine, Pairwise). Comparison: Casgevy (DSB CRISPR) vs Prime Medicine (precise edit) — different platforms para different mutation types.'
          en: 'Prime Medicine PM359: ex vivo prime editing of autologous CD34+ HSPCs corrects CYBB c.676 C>T mutation in X-linked chronic granulomatous disease (CGD) — restores gp91phox NADPH oxidase function in phagocytes. First-in-human prime-editing IND 2023, dosing 2024. Prime editing advantage in CGD: reverse C→T substitution, no DSBs, minimal off-target. Broader pipeline: PM577 (β-globin SCD), PM1027 (Wilson), PM577 (PGM3 immunodeficiency). Liu Lab spinouts (Beam, Prime Medicine, Pairwise). Comparison: Casgevy (DSB CRISPR) vs Prime Medicine (precise edit) — different platforms for different mutation types.'
        objectives: [Prime Medicine]
      - type: choice
        difficulty: 5
        question:
          pt: Synlogic SYNB1934 (Phase 3 SynPheny-1 PKU 2023) é exemplo de…
          en: Synlogic SYNB1934 (Phase 3 SynPheny-1 PKU 2023) is an example of…
        choices:
          - Engineered live biotherapeutic E. coli Nissle expressing PAL phenylalanine-degrading enzyme for oral therapy in phenylketonuria
          - Conventional small-molecule pharmacology comparator for sapropterin in mild PKU
          - Genetically modified probiotic yeast for cholesterol-lowering applications
          - Cell-free enzyme therapy delivered via nasal inhalation
        correctAnswer: Engineered live biotherapeutic E. coli Nissle expressing PAL phenylalanine-degrading enzyme for oral therapy in phenylketonuria
        rationale:
          pt: 'Synlogic SYNB1934 (formerly SYNB1618): engineered E. coli Nissle 1917 (probiotic chassis) expressing PAL (phenylalanine ammonia lyase) + LAAD (L-amino acid deaminase) — degradam fenilalanina lúmen intestinal → reduz fenilalanina sistêmica em PKU. SynPheny-1 Phase 3 trial completed 2023. Programa descontinuado abr/2024 — modest efficacy, business decision. Exemplifica engineered LBP (Live Biotherapeutic Product) era. Concorrentes: Vedanta Biosciences, BiomX, ZBiotics consumer (alcohol). Other Synlogic programs: SYNB8802 (hyperoxaluria, halted 2023). Pioneering company synthetic biology applied a clinical disease — caminho difícil.'
          en: 'Synlogic SYNB1934 (formerly SYNB1618): engineered E. coli Nissle 1917 (probiotic chassis) expressing PAL (phenylalanine ammonia lyase) + LAAD (L-amino acid deaminase) — degrade phenylalanine in gut lumen → reduce systemic phenylalanine in PKU. SynPheny-1 Phase 3 trial completed 2023. Program discontinued Apr 2024 — modest efficacy, business decision. Exemplifies the engineered LBP (Live Biotherapeutic Product) era. Competitors: Vedanta Biosciences, BiomX, ZBiotics consumer (alcohol). Other Synlogic programs: SYNB8802 (hyperoxaluria, halted 2023). Pioneering company in synthetic biology applied to clinical disease — difficult path.'
        objectives: [Synlogic engineered Nissle]
      - type: choice
        difficulty: 5
        question:
          pt: Ginkgo Bioworks (founded 2008 MIT spinoff) commercial model é…
          en: Ginkgo Bioworks (founded 2008 MIT spinoff) commercial model is…
        choices:
          - Cell-engineering foundry providing R&D-as-a-service across pharma, ag, food, materials; high-throughput automated DBTL platform
          - Drug discovery using purely computational AlphaFold pipelines without wet-lab fermentation
          - Direct-to-consumer DNA testing focused on ancestry and wellness genomics
          - Vaccine manufacturer specializing in mRNA platform development for infectious disease
        correctAnswer: Cell-engineering foundry providing R&D-as-a-service across pharma, ag, food, materials; high-throughput automated DBTL platform
        rationale:
          pt: 'Ginkgo Bioworks: founded 2008 (Knight, Endy, Kelly, Schmidt, Canton MIT). Cell engineering foundry — robots, automated DNA synthesis, fermentation, screening. SPAC-listed 2021 ~$15B valuation peak; subsequente decline para ~$1B 2024. Customers: pharma (Moderna, Pfizer), ag (Bayer, Cargill), food (Motif, Beyond), materials (Aldevron, Cronos). Concept "biology as platform" — DBTL (Design-Build-Test-Learn) iterative engineering. Concorrentes: Inscripta (descontinuado MAGE), Twist Biosciences (DNA synthesis), Asimov, Zymergen (descontinuado). Critics: foundry economics challenging, customer concentration. AI integration era 2024+.'
          en: 'Ginkgo Bioworks: founded 2008 (Knight, Endy, Kelly, Schmidt, Canton MIT). Cell engineering foundry — robots, automated DNA synthesis, fermentation, screening. SPAC-listed 2021 ~$15B valuation peak; subsequent decline to ~$1B by 2024. Customers: pharma (Moderna, Pfizer), ag (Bayer, Cargill), food (Motif, Beyond), materials (Aldevron, Cronos). Concept "biology as platform" — DBTL (Design-Build-Test-Learn) iterative engineering. Competitors: Inscripta (discontinued MAGE), Twist Biosciences (DNA synthesis), Asimov, Zymergen (discontinued). Critics: foundry economics challenging, customer concentration. AI integration era 2024+.'
        objectives: [Ginkgo Bioworks]
      - type: choice
        difficulty: 5
        question:
          pt: Em DNA storage technology, Microsoft/UW DNA storage achievement key foi…
          en: In DNA storage technology, the key Microsoft/UW DNA storage achievement was…
        choices:
          - Encoding ~1 GB of arbitrary digital data into synthesized DNA with retrieval via sequencing; demonstrated archival density potential
          - Live-cell encoding of streaming video into bacterial chromosomes during cell division
          - Real-time DNA-based computation matching electronic CPU clock speeds
          - In vivo DNA library storage in human peripheral blood for personal medical records
        correctAnswer: Encoding ~1 GB of arbitrary digital data into synthesized DNA with retrieval via sequencing; demonstrated archival density potential
        rationale:
          pt: 'DNA storage Microsoft/UW (Strauss/Ceze 2016+): encode arbitrary digital data → DNA oligonucleotide synthesis → sequencing retrieval. Demonstration: Microsoft 2019 ~1GB ("Hello World" + arts archive) com Twist Biosciences. Density teórica ~215 PB/g vs HDDs ~1 TB/g. Random access via PCR primers indexing. Catalog DNA Catalist Twist. Limitações: synthesis cost ~$1k/MB current vs $0.01/GB HDD. Read/write times slow. Promise: archival cold storage long-term (DNA stable thousands years, climate-controlled). Catalog Technologies, Iridia, Helixworks competitors. NIST DNA Data Storage Alliance 2020. Future: enzymatic DNA synthesis (DNA Script, Molecular Assemblies, Ansa Bio) drop costs.'
          en: 'DNA storage Microsoft/UW (Strauss/Ceze 2016+): encode arbitrary digital data → DNA oligonucleotide synthesis → sequencing retrieval. Demonstration: Microsoft 2019 ~1GB ("Hello World" + arts archive) with Twist Biosciences. Theoretical density ~215 PB/g vs HDDs ~1 TB/g. Random access via PCR primer indexing. Catalog DNA Catalist Twist. Limitations: current synthesis cost ~$1k/MB vs $0.01/GB HDD. Slow read/write times. Promise: long-term archival cold storage (DNA stable for thousands of years, climate-controlled). Catalog Technologies, Iridia, Helixworks competitors. NIST DNA Data Storage Alliance 2020. Future: enzymatic DNA synthesis (DNA Script, Molecular Assemblies, Ansa Bio) drops costs.'
        objectives: [DNA storage]
      - type: choice
        difficulty: 5
        question:
          pt: Cell-free protein synthesis (CFPS) systems vantagem principal é…
          en: Cell-free protein synthesis (CFPS) systems' main advantage is…
        choices:
          - Open-system flexibility — direct addition of substrates, cofactors, non-natural amino acids without cellular constraints; rapid prototyping
          - Substantially higher protein yields per liter than fed-batch CHO cell bioreactors
          - Ability to assemble multicellular tissues without scaffolding or vascularization
          - Inherent biocontainment from in vivo replication preventing horizontal gene transfer
        correctAnswer: Open-system flexibility — direct addition of substrates, cofactors, non-natural amino acids without cellular constraints; rapid prototyping
        rationale:
          pt: 'CFPS (Cell-Free Protein Synthesis): extracts contendo ribosomes + tRNAs + factors; sem células vivas. Major advantages: rapid prototyping (~hours vs days/weeks), open system (direct addition substrates, cofactors, ncAAs unnatural amino acids, fluorescent labels), no toxicity constraints, point-of-care manufacturing. Limitations: lower yield per liter, costly extracts. Pioneers: Jewett (Northwestern, ALA, glyco-CFPS), Noireaux (Minnesota), Swartz (Stanford). Applications: on-demand vaccine production (BioMADE, Sutro), point-of-care diagnostics (paper-based aTRPS), education (BioBits). Sutro BCT BCT-1 dual-payload ADCs Phase 1+. Tierra Biosciences custom protein. Future: portable manufacturing, climate-resilient.'
          en: 'CFPS (Cell-Free Protein Synthesis): extracts containing ribosomes + tRNAs + factors; no live cells. Major advantages: rapid prototyping (~hours vs days/weeks), open system (direct addition of substrates, cofactors, non-natural amino acids, fluorescent labels), no toxicity constraints, point-of-care manufacturing. Limitations: lower yield per liter, costly extracts. Pioneers: Jewett (Northwestern, ALA, glyco-CFPS), Noireaux (Minnesota), Swartz (Stanford). Applications: on-demand vaccine production (BioMADE, Sutro), point-of-care diagnostics (paper-based aTRPS), education (BioBits). Sutro BCT BCT-1 dual-payload ADCs Phase 1+. Tierra Biosciences custom protein. Future: portable manufacturing, climate-resilient.'
        objectives: [Cell-free systems]
      - type: choice
        difficulty: 5
        question:
          pt: Em xenobiology, Synthia (Romesberg Scripps 2014) demonstrou…
          en: In xenobiology, Synthia (Romesberg Scripps 2014) demonstrated…
        choices:
          - Functional E. coli with two unnatural base pairs (X-Y) added to genome alphabet; expanded genetic code beyond ATGC
          - Complete substitution of canonical DNA bases by xenobiotic analogs throughout the genome
          - Synthesis of a fully artificial cell with phospholipid bilayer assembled from petrochemical precursors
          - Replacement of ribosomes by abiotic ribozyme-only translation systems retaining canonical proteins
        correctAnswer: Functional E. coli with two unnatural base pairs (X-Y) added to genome alphabet; expanded genetic code beyond ATGC
        rationale:
          pt: 'Floyd Romesberg (Scripps) Nature 2014: E. coli engineered with unnatural base pair (UBP) dNaM-d5SICS (X-Y) replicating em DNA — primeiro semi-synthetic organism. Subsequente 2017 Nature: in vivo retention + transcription/translation incorporando ncAAs codified pelas UBPs. Synthorx spinout (acquired Sanofi 2019): expanded genetic code para therapeutic protein engineering. THOR-707 IL-2 variant pegylated com ncAA Phase 1/2 oncology. Implications: orthogonal translation systems, biocontainment via UBP-dependence, novel chemistries em biology. Concurrent: Chin (Cambridge MRC) recoded organisms (Syn61) liberating codons para ncAAs.'
          en: 'Floyd Romesberg (Scripps) Nature 2014: E. coli engineered with an unnatural base pair (UBP) dNaM-d5SICS (X-Y) replicating in DNA — first semi-synthetic organism. Subsequent 2017 Nature: in vivo retention + transcription/translation incorporating ncAAs codified by the UBPs. Synthorx spinout (acquired by Sanofi 2019): expanded genetic code for therapeutic protein engineering. THOR-707 IL-2 variant PEGylated with ncAA Phase 1/2 oncology. Implications: orthogonal translation systems, biocontainment via UBP dependence, novel chemistries in biology. Concurrent: Chin (Cambridge MRC) recoded organisms (Syn61) freeing codons for ncAAs.'
        objectives: [Xenobiology UBP]
      - type: choice
        difficulty: 5
        question:
          pt: Em plant synthetic biology, Calyxt high-oleic soybean (1st gene-edited consumer food, 2019) usou TALEN para…
          en: In plant synthetic biology, Calyxt high-oleic soybean (1st gene-edited consumer food, 2019) used TALEN to…
        choices:
          - Knockout FAD2-1A and FAD2-1B genes encoding fatty acid desaturase 2; raised oleic acid content for healthier oil
          - Insert anti-microbial genes from Bacillus to confer pest resistance comparable to Bt corn
          - Replace endogenous storage protein with recombinant human albumin for biopharming
          - Confer broad-spectrum herbicide tolerance via EPSPS gene editing
        correctAnswer: Knockout FAD2-1A and FAD2-1B genes encoding fatty acid desaturase 2; raised oleic acid content for healthier oil
        rationale:
          pt: 'Calyxt Calyno high-oleic soybean (2019): TALEN-mediated KO de FAD2-1A + FAD2-1B genes (fatty acid desaturase 2) → reduces conversion oleic → linoleic acid → high-oleic content (~80% vs ~25% wild-type). Healthier monounsaturated oil profile. Primeira gene-edited food consumer market US. USDA non-regulated 2017 (no foreign DNA). Calyxt subsequente luta financeira → renamed Cibus 2023 merger. Pairwise (Bayer-backed) lança CRISPR mustard greens 2023. Conscience Foods, Tropic, Bioheuris. EU 2023 reform proposta NGT (New Genomic Techniques) categories — mais permissive CRISPR plants. CRISPR ag economy emerging.'
          en: 'Calyxt Calyno high-oleic soybean (2019): TALEN-mediated KO of FAD2-1A + FAD2-1B genes (fatty acid desaturase 2) → reduces oleic → linoleic acid conversion → high oleic content (~80% vs ~25% wild-type). Healthier monounsaturated oil profile. First gene-edited consumer-market food in US. USDA non-regulated 2017 (no foreign DNA). Calyxt subsequent financial struggles → renamed Cibus 2023 merger. Pairwise (Bayer-backed) launched CRISPR mustard greens 2023. Conscience Foods, Tropic, Bioheuris. EU 2023 reform proposes NGT (New Genomic Techniques) categories — more permissive for CRISPR plants. CRISPR ag economy emerging.'
        objectives: [Calyxt high-oleic]
  - title:
      pt: Página 2 — Cells, Materials, Computing
      en: Page 2 — Cells, Materials, Computing
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em engineered T cells, "armored CAR-T" refere-se a…
          en: In engineered T cells, "armored CAR-T" refers to…
        choices:
          - CAR-T cells co-engineered with cytokine secretion (IL-12, IL-18) or PD-1 dominant negative to overcome tumor microenvironment suppression
          - First-generation second-domain CARs without costimulatory enhancement
          - CAR-T cells pre-coated with antibody armor preventing direct tumor recognition
          - Cells deliberately exhausted during ex vivo expansion to control proliferation in vivo
        correctAnswer: CAR-T cells co-engineered with cytokine secretion (IL-12, IL-18) or PD-1 dominant negative to overcome tumor microenvironment suppression
        rationale:
          pt: 'Armored CAR-T concept: CAR-T cells "armored" with additional engineering para overcome challenges em solid tumors + persistent leukemia. Common armoring: constitutive IL-12 ou IL-18 secretion (autocrine activation), PD-1 dominant negative ou knockout (resistance immune checkpoint), TGFβ trap, switch receptors. Companies: Lyell, Cabaletta, ArsenalBio. Curitis JCAR017 (2017 lisocabtagene CD19) standard. Primeiros CARs (Sadelain, Rosenberg, June): simples CD19 → 4-1BB/CD28 segunda geração. Allogeneic CAR-T (CRISPR Therapeutics CTX-110, Allogene) gene-edited. CAR-T solid tumors challenge ainda — TAA scarcity, microenvironment, trafficking, exhaustion.'
          en: 'Armored CAR-T concept: CAR-T cells "armored" with additional engineering to overcome solid tumor and leukemia persistence challenges. Common armoring: constitutive IL-12 or IL-18 secretion (autocrine activation), PD-1 dominant negative or knockout (immune checkpoint resistance), TGFβ trap, switch receptors. Companies: Lyell, Cabaletta, ArsenalBio. Kymriah/Yescarta JCAR017 (2017 lisocabtagene CD19) standard. First CARs (Sadelain, Rosenberg, June): simple CD19 → 4-1BB/CD28 second generation. Allogeneic CAR-T (CRISPR Therapeutics CTX-110, Allogene) gene-edited. CAR-T in solid tumors still a challenge — TAA scarcity, microenvironment, trafficking, exhaustion.'
        objectives: [Armored CAR-T]
      - type: choice
        difficulty: 5
        question:
          pt: Em logic-gate CAR-T, AND-gate / OR-gate / NOT-gate designs aim para…
          en: In logic-gate CAR-T, AND-gate / OR-gate / NOT-gate designs aim to…
        choices:
          - Increase tumor specificity by requiring combinations of antigens (AND), expanding recognition (OR), or sparing healthy tissue (NOT) via synthetic-biology circuits
          - Enable CARs to physically split T cells into multiple daughter clones for amplification
          - Encode chemotherapy molecules within CAR T cell vacuoles for sustained release
          - Replace conventional viral integration with CRISPR-driven random multi-locus insertion
        correctAnswer: Increase tumor specificity by requiring combinations of antigens (AND), expanding recognition (OR), or sparing healthy tissue (NOT) via synthetic-biology circuits
        rationale:
          pt: 'Logic-gate CARs (Wendell Lim UCSF; Cell 2016+): AND-gate (synNotch + CAR) requires antigen A + B → kills only when both present (espera tumor); OR-gate (dual-CAR) recognizes A or B → expanded coverage prevent antigen escape; NOT-gate (inhibitory-CAR) blocks T-cell quando antigeno C present (tecido normal protection). Companies: Senti Bio, Arsenal, Kite. Tmunity TmunIL-7 IL-7 + 4-1BB. SynNotch (Lim 2016 Cell) modular extracellular receptor → orthogonal transcriptional output. Boolean computation em mammalian cells expanding precision T-cell therapies. Critical para solid tumor expansion CAR-T.'
          en: 'Logic-gate CARs (Wendell Lim UCSF; Cell 2016+): AND-gate (synNotch + CAR) requires antigen A + B → kills only when both present (tumor specificity); OR-gate (dual-CAR) recognizes A or B → expanded coverage preventing antigen escape; NOT-gate (inhibitory-CAR) blocks T-cell when antigen C present (normal-tissue protection). Companies: Senti Bio, Arsenal, Kite. Tmunity TmunIL-7 IL-7 + 4-1BB. SynNotch (Lim 2016 Cell) modular extracellular receptor → orthogonal transcriptional output. Boolean computation in mammalian cells expanding precision T-cell therapies. Critical for solid tumor expansion of CAR-T.'
        objectives: [Logic-gate CAR-T]
      - type: choice
        difficulty: 5
        question:
          pt: Em metabolic engineering, Amyris/Keasling artemisinic acid (semi-synthetic artemisinin 2013 Sanofi launch) demonstrou…
          en: In metabolic engineering, Amyris/Keasling artemisinic acid (semi-synthetic artemisinin 2013 Sanofi launch) demonstrated…
        choices:
          - Yeast (Saccharomyces) engineered with full artemisinic acid biosynthetic pathway → fermented + chemically converted to artemisinin antimalarial
          - Direct cultivation of Artemisia annua plants in bioreactors at 100x natural yield
          - Total synthesis of artemisinin from petrochemical feedstocks without any biological component
          - Recombinant production of artemisinin in transgenic mammalian cell lines
        correctAnswer: Yeast (Saccharomyces) engineered with full artemisinic acid biosynthetic pathway → fermented + chemically converted to artemisinin antimalarial
        rationale:
          pt: 'Jay Keasling (UC Berkeley/JBEI): artemisinic acid engineered yeast (Saccharomyces cerevisiae) — heterologous expression de Artemisia annua pathway (FPP synthase, ADS amorphadiene synthase, CYP71AV1 + CPR + CYB5 P450 → artemisinic acid). Amyris spinoff founded 2003. Sanofi license 2008, commercial launch 2013 ~35-50 tonnes artemisinin/year. Goal: ACT (Artemisinin Combination Therapy) malaria supply security, complement plant cultivation. Subsequente: production scaled down post-2014 (plant-derived prices declined). Keasling pivoted JBEI biofuels, opioids (Nature 2015 thebaine yeast — controversial). Foundational metabolic engineering achievement.'
