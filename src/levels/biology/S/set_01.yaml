        rationale:
          pt: 'Leonard Adleman (USC) Science 1994: solved 7-node Hamiltonian path problem (NP-complete) using DNA — encoded vertices/edges como oligonucleotides, hybridização explora soluções massively parallel, gel + PCR identifica solução. Founding paper DNA computing. Era teorização: DNA como 215 PB/g information density potencial. Subsequent: Lipton, Winfree (DNA tiles, Caltech). Modern: cell-free DNA strand displacement circuits (Qian/Winfree neural networks 2011), CRISPR-based computation (Doench, Yuan, Liu CIRCUITS), molecular computing aplicações: diagnostics (toehold switches Pardee/Collins 2014 Zika), drug discovery, smart therapeutics. DNA Origami (Rothemund 2006) related field nanofabrication.'
