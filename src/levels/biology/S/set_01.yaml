          en: In AI/ML synthetic biology, AlphaFold 2 (DeepMind 2020 Nature, Jumper et al) and RFdiffusion (Baker Lab 2023) impact is…
        choices:
          - Near-experimental-accuracy structure prediction + de novo protein design at scale; 200M+ structures predicted, novel binders/enzymes designed in silico
          - Marginal accuracy improvements limited to small monomeric proteins under specific conditions
          - Replacement of all wet-lab structural biology by purely computational predictions in academic labs
