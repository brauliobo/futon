        correctAnswer: Resource competition (ribosomes, RNA polymerase, ATP) imposed by synthetic constructs on host fitness, causing growth defects + decay of circuit performance
        rationale:
          pt: 'Cellular burden (Ceroni/Ellis Imperial 2018 Nat Methods): synthetic constructs (heterologous expression) compete por host resources finitos — ribosomes, polymerase, tRNAs, energy. Consequences: reduced growth rate, plasmid loss, mutation accumulation, circuit performance decay over generations. Burden monitor strain (capacity reporter) quantifies. Engineering responses: minimal genome chassis (JCVI-syn3.0), feedback controllers (Khalil, Nielsen), orthogonal translation (Chin), genome engineering (recoded organisms). Major design constraint synthetic biology — unlike electronic circuits sem direct equivalent. Active research community.'
