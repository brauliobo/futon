        correctAnswer: Near-experimental-accuracy structure prediction + de novo protein design at scale; 200M+ structures predicted, novel binders/enzymes designed in silico
        rationale:
          pt: 'AlphaFold 2 (Jumper/Hassabis DeepMind Nature 2020): near-experimental accuracy (median GDT-TS ~92) protein structure prediction. AlphaFold Protein Structure Database 2021+: ~200M+ predicted structures EBI/EMBL public. AlphaFold 3 (2024): protein-protein, protein-ligand, protein-DNA prediction expanded. Nobel Chemistry 2024: Hassabis + Jumper (DeepMind) + Baker (Washington). RFdiffusion (Baker Lab Watson 2023 Nature): generative diffusion model de novo protein design — novel binders, enzymes, scaffolds. Spinouts: Isomorphic Labs (DeepMind drug discovery 2021), Cradle, Generate Biomedicines, Profluent, Evolutionary Scale (ESM3 2024). Acelerou drug discovery, antibody design, structure-based design dramatically. Wet-lab confirmation ainda crítica, mas iteration cycles reduziram de meses para horas.'
          en: 'AlphaFold 2 (Jumper/Hassabis DeepMind Nature 2020): near-experimental accuracy (median GDT-TS ~92) protein structure prediction. AlphaFold Protein Structure Database 2021+: ~200M+ predicted structures EBI/EMBL public. AlphaFold 3 (2024): expanded to protein-protein, protein-ligand, protein-DNA prediction. Nobel Chemistry 2024: Hassabis + Jumper (DeepMind) + Baker (Washington). RFdiffusion (Baker Lab Watson 2023 Nature): generative diffusion model for de novo protein design — novel binders, enzymes, scaffolds. Spinouts: Isomorphic Labs (DeepMind drug discovery 2021), Cradle, Generate Biomedicines, Profluent, Evolutionary Scale (ESM3 2024). Dramatically accelerated drug discovery, antibody design, structure-based design. Wet-lab confirmation still critical, but iteration cycles dropped from months to hours.'
