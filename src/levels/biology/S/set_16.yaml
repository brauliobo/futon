        question:
          pt: Cancer cachexia + GDF15 axis (Wang/Breen Cell 2024+) é…
          en: Cancer cachexia + GDF15 axis (Wang/Breen Cell 2024+) is…
        choices:
          - Tumor-derived GDF15 (Growth Differentiation Factor 15) acting on hindbrain GFRAL receptor causes anorexia-cachexia in advanced cancer; ponsegromab (anti-GDF15) Phase 2 trials reverse cachexia
          - Pure dietary deficiency without molecular pathway
          - Standard chemotherapy side effect only
          - Genetic-only without humoral mediators
        correctAnswer: Tumor-derived GDF15 (Growth Differentiation Factor 15) acting on hindbrain GFRAL receptor causes anorexia-cachexia in advanced cancer; ponsegromab (anti-GDF15) Phase 2 trials reverse cachexia
        rationale:
          pt: 'Cancer cachexia GDF15 axis: cachexia (severe weight loss, muscle wasting, anorexia, fatigue) affects ~50-80% advanced cancer patients, contributes ~20-30% cancer mortality. Decades unsuccessful treatment efforts. Mechanism breakthrough: GDF15 (Growth Differentiation Factor 15, MIC-1, NAG-1) — TGF-β family cytokine produced normally placenta + tumors + tissue stress. Acts via GFRAL (GDNF Family Receptor α-Like) restricted hindbrain area postrema (chemoreceptor trigger zone) → anorexia + nausea + behavioral suppression. Discovered 2017 four independent groups simultaneously (Hsu/Mullican Nature 2017 + Yang/Brunetto Nat Med 2017 + Emmerson/Wang Nat Med 2017 + Mullican/Lin Nat Med 2017). Initially metabolic obesity drug target — exenatide-class. Subsequent anorexia in cancer cachexia link. Pfizer ponsegromab (PF-06946860, humanized anti-GDF15 mAb): Phase 2 trial (Groarke NEJM 2024 outubro): ~187 advanced cancer patients (NSCLC + pancreatic + colorectal) cachexia → ponsegromab improved weight (~3-5 kg gain at 12 weeks), appetite, lean mass, physical function. Significance: first effective anti-cachexia therapy decades effort. Subsequent indications: Pfizer Phase 3 cancer cachexia, COVID/heart failure cachexia, anorexia nervosa potential. Field 2024+ active: GDF15 also obesity drugs (NGM Bio NGM120, Janssen anti-GFRAL Phase 1 obesity 2024+). Field landmark for cachexia therapeutics + neuroendocrine biology.'
          en: 'Cancer cachexia GDF15 axis: cachexia (severe weight loss, muscle wasting, anorexia, fatigue) affects ~50-80% of advanced cancer patients, contributes to ~20-30% of cancer mortality. Decades of unsuccessful treatment efforts. Mechanism breakthrough: GDF15 (Growth Differentiation Factor 15, MIC-1, NAG-1) — TGF-β family cytokine produced normally in placenta + tumors + tissue stress. Acts via GFRAL (GDNF Family Receptor α-Like) restricted to hindbrain area postrema (chemoreceptor trigger zone) → anorexia + nausea + behavioral suppression. Discovered 2017 by four independent groups simultaneously (Hsu/Mullican Nature 2017 + Yang/Brunetto Nat Med 2017 + Emmerson/Wang Nat Med 2017 + Mullican/Lin Nat Med 2017). Initially studied as metabolic obesity drug target — exenatide-class. Subsequent anorexia in cancer cachexia link. Pfizer ponsegromab (PF-06946860, humanized anti-GDF15 mAb): Phase 2 trial (Groarke NEJM October 2024): ~187 advanced cancer patients (NSCLC + pancreatic + colorectal) with cachexia → ponsegromab improved weight (~3-5 kg gain at 12 weeks), appetite, lean mass, physical function. Significance: first effective anti-cachexia therapy after decades of effort. Subsequent indications: Pfizer Phase 3 cancer cachexia, COVID/heart failure cachexia, anorexia nervosa potential. Field 2024+ active: GDF15 also in obesity drugs (NGM Bio NGM120, Janssen anti-GFRAL Phase 1 obesity 2024+). Field landmark for cachexia therapeutics + neuroendocrine biology.'
        objectives: [Cancer cachexia GDF15]
      - type: choice
        difficulty: 5
        question:
          pt: CDK4/6 inhibitors + endocrine therapy (palbociclib Ibrance Pfizer FDA 2015) é…
          en: CDK4/6 inhibitors + endocrine therapy (palbociclib Ibrance Pfizer FDA 2015) is…
        choices:
          - First CDK4/6-selective inhibitor combined with aromatase inhibitor (letrozole) or fulvestrant for ER+/HER2- metastatic breast cancer, doubling PFS — paradigm-changing for HR+ breast cancer
          - Pan-CDK inhibitor without selectivity
          - Pure chemotherapy without targeted approach
          - Vaccine-based therapy
        correctAnswer: First CDK4/6-selective inhibitor combined with aromatase inhibitor (letrozole) or fulvestrant for ER+/HER2- metastatic breast cancer, doubling PFS — paradigm-changing for HR+ breast cancer
        rationale:
          pt: 'CDK4/6 inhibitors + endocrine therapy: ~70% breast cancers ER+ (estrogen receptor positive)/HER2- → endocrine therapy (tamoxifen, aromatase inhibitors, fulvestrant) standard but eventual resistance. Palbociclib (PD-0332991, Ibrance Pfizer) — selective CDK4 + CDK6 inhibitor. Mechanism: CDK4/6 + cyclin D1 phosphorylate Rb (retinoblastoma protein) → release E2F transcription factors → S-phase entry. CDK4/6 inhibition in ER+ breast cancer (cyclin D1 amplified IL-6/STAT3 signaling) → cell-cycle arrest G1. PALOMA-1 (Finn Lancet Oncol 2015) + PALOMA-2 (Finn NEJM 2016) + PALOMA-3 trials: palbociclib + letrozole/fulvestrant ~doubled PFS vs letrozole/fulvestrant alone (~24 vs 14 meses). FDA 2015 first approval. Concurrent CDK4/6 inhibitors: ribociclib (Kisqali Novartis 2017), abemaciclib (Verzenio Eli Lilly 2017). All similar efficacy MBC ER+ standard care 2017+. Adjuvant: monarchE trial 2020 (Verzenio + endocrine therapy adjuvant high-risk HR+ early breast — DFS improvement). Resistance mechanisms: cyclin E1/E2 amplification, CDK2 activation, FAT1 loss, RB1 loss. Concurrent: CDK7 inhibitors (samuraciclib next gen), CDK9 selective. Selective CDK2 inhibitors (bevirsen Phase 1/2 2024+ Pfizer). Field $10B+ market mature.'
          en: 'CDK4/6 inhibitors + endocrine therapy: ~70% of breast cancers are ER+ (estrogen receptor positive)/HER2- → endocrine therapy (tamoxifen, aromatase inhibitors, fulvestrant) is standard but eventual resistance. Palbociclib (PD-0332991, Ibrance Pfizer) — selective CDK4 + CDK6 inhibitor. Mechanism: CDK4/6 + cyclin D1 phosphorylate Rb (retinoblastoma protein) → releases E2F transcription factors → S-phase entry. CDK4/6 inhibition in ER+ breast cancer (cyclin D1 amplified, IL-6/STAT3 signaling) → cell-cycle arrest in G1. PALOMA-1 (Finn Lancet Oncol 2015) + PALOMA-2 (Finn NEJM 2016) + PALOMA-3 trials: palbociclib + letrozole/fulvestrant ~doubled PFS vs letrozole/fulvestrant alone (~24 vs 14 months). FDA 2015 first approval. Concurrent CDK4/6 inhibitors: ribociclib (Kisqali Novartis 2017), abemaciclib (Verzenio Eli Lilly 2017). All similar efficacy in metastatic ER+ — standard of care 2017+. Adjuvant: monarchE trial 2020 (Verzenio + endocrine therapy adjuvant in high-risk HR+ early breast — DFS improvement). Resistance mechanisms: cyclin E1/E2 amplification, CDK2 activation, FAT1 loss, RB1 loss. Concurrent: CDK7 inhibitors (samuraciclib next gen), CDK9 selective. Selective CDK2 inhibitors (bevirsen Phase 1/2 2024+ Pfizer). Field $10B+ mature market.'
        objectives: [CDK4/6 palbociclib]
      - type: choice
        difficulty: 5
        question:
          pt: Cancer-associated CTC (circulating tumor cells) + Microsatellite Instability MSI biomarkers são…
          en: Cancer-associated CTC (circulating tumor cells) + Microsatellite Instability MSI biomarkers are…
        choices:
          - CTCs (CellSearch Veridex) prognostic in breast/prostate; MSI-H from defective MMR predicts ICI response (pembrolizumab tissue-agnostic FDA 2017 first ever)
          - Pure exome metrics without clinical utility
          - Random biomarkers without therapy implications
          - Single-cancer applicability only
        correctAnswer: CTCs (CellSearch Veridex) prognostic in breast/prostate; MSI-H from defective MMR predicts ICI response (pembrolizumab tissue-agnostic FDA 2017 first ever)
        rationale:
          pt: 'Liquid biopsy biomarkers: (1) CTC (Circulating Tumor Cells) — CellSearch Veridex (J&J) FDA-approved 2004 — EpCAM-positive cells isolated peripheral blood (~1-100 CTC/7.5mL blood metastatic, vs ~10⁹ leukocytes — needle haystack). Prognostic: ≥5 CTCs/7.5mL associated worse OS metastatic breast/prostate/colorectal. CTC isolation also AccuCyte/CytoTrack/Parsortix microfluidic. Limitations: heterogeneity (epithelial vs mesenchymal CTCs miss EpCAM-low), low sensitivity early-stage. Subsequent applications declining vs ctDNA more robust. (2) MSI (Microsatellite Instability) — DNA repeats (~10²-10⁵ throughout genome) prone replication slippage → indels → mismatch repair (MMR, MLH1/MSH2/MSH6/PMS2) corrects normally. MSI-high = MMR-deficient → high mutation load, immunogenic neoantigens. Lynch syndrome (hereditary MMR deficiency) ~3% of CRC; sporadic MSI ~15% CRC, ~25% endometrial, gastric subset. Detected: PCR 5-marker panel Bethesda + immunohistochemistry MMR proteins, NGS-based (FoundationOne, Tempus). Pembrolizumab (Keytruda Merck) FDA approval 2017 for MSI-H any tumor — FIRST ever tissue-agnostic biomarker-driven approval (Le NEJM 2015 Lemery NEJM 2017). Subsequent: dostarlimab (Jemperli GSK), tislelizumab. dMMR-rectal cancer dostarlimab Cercek NEJM 2022 ~100% complete response (avoid surgery — early-stage trial paradigm changing). Field foundational immune oncology biomarker-driven era.'
          en: 'Liquid biopsy biomarkers: (1) CTC (Circulating Tumor Cells) — CellSearch Veridex (J&J) FDA-approved 2004 — EpCAM-positive cells isolated from peripheral blood (~1-100 CTC/7.5 mL blood in metastatic, vs ~10⁹ leukocytes — needle in haystack). Prognostic: ≥5 CTCs/7.5 mL associated with worse OS in metastatic breast/prostate/colorectal. CTC isolation also via AccuCyte/CytoTrack/Parsortix microfluidic. Limitations: heterogeneity (epithelial vs mesenchymal CTCs miss EpCAM-low), low sensitivity in early-stage. Subsequent applications declining vs ctDNA more robust. (2) MSI (Microsatellite Instability) — DNA repeats (~10²-10⁵ throughout genome) prone to replication slippage → indels → mismatch repair (MMR, MLH1/MSH2/MSH6/PMS2) corrects normally. MSI-high = MMR-deficient → high mutation load, immunogenic neoantigens. Lynch syndrome (hereditary MMR deficiency) ~3% of CRC; sporadic MSI ~15% of CRC, ~25% endometrial, gastric subset. Detected: PCR 5-marker panel Bethesda + immunohistochemistry of MMR proteins, NGS-based (FoundationOne, Tempus). Pembrolizumab (Keytruda Merck) FDA approval 2017 for MSI-H any tumor — FIRST ever tissue-agnostic biomarker-driven approval (Le NEJM 2015, Lemery NEJM 2017). Subsequent: dostarlimab (Jemperli GSK), tislelizumab. dMMR-rectal cancer dostarlimab Cercek NEJM 2022 ~100% complete response (avoid surgery — early-stage trial paradigm changing). Field foundational for immune oncology biomarker-driven era.'
