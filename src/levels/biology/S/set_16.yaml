        correctAnswer: Pembrolizumab MSI-H (2017, first ever), larotrectinib NTRK fusion (2018), tepotinib MET ex14 skipping, RET fusion selpercatinib, NRG1 zenocutuzumab, mobocertinib EGFR ex20 — paradigm shift from organ-of-origin to molecular targeting
        rationale:
          pt: 'Tumor-agnostic biomarker-driven FDA approvals: paradigm shift "Site-of-origin" → "molecular alteration" oncology. Major approvals: (1) Pembrolizumab (Keytruda Merck) — MSI-H/dMMR any solid tumor 23 maio 2017 first ever tissue-agnostic biomarker. (2) Larotrectinib (Vitrakvi Bayer/Loxo) + entrectinib (Rozlytrek Roche) — NTRK gene fusion any tumor 2018-2019 (~rare ~0.1-1% all cancers, ~99% pediatric infantile fibrosarcoma). (3) Tepotinib (Tepmetko Merck KGaA) + capmatinib (Tabrecta Novartis) — MET exon 14 skipping NSCLC 2020. (4) Selpercatinib (Retevmo Loxo) + pralsetinib (Gavreto Blueprint) — RET fusion thyroid + NSCLC + tumor-agnostic 2020. (5) Mobocertinib (Exkivity Takeda) + amivantamab (Rybrevant J&J) — EGFR exon 20 insertion NSCLC 2021. (6) Pembrolizumab TMB-high ≥10 mut/Mb any solid tumor 2020 (KEYNOTE-158). (7) Tumor agnostic FGFR2 fusion + futibatinib (Lytgobi Taiho 2022). (8) Zenocutuzumab (Bizengri Merus) NRG1 fusion 2024 first NRG1-targeted therapy. Implication: precision oncology requires comprehensive genomic profiling (CGP — Foundation Medicine, Tempus, Caris) all advanced cancer patients to identify rare actionable alterations. Subsequent: HER2 targeting any HER2+ solid tumor T-DXd 2024 (DESTINY-PanTumor02), KRAS G12C any solid tumor adagrasib 2022. Field 2024 mature: ~30+ biomarker-tumor matched approvals oncology.'
