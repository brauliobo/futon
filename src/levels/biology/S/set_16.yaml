        question:
          pt: ctDNA-based MRD (minimal residual disease, Signatera Natera, Guardant Reveal) é…
          en: ctDNA-based MRD (minimal residual disease, Signatera Natera, Guardant Reveal) is…
        choices:
          - Tumor-informed personalized ctDNA panel post-surgery to detect molecular relapse months before clinical/imaging recurrence, guiding adjuvant therapy decisions
          - Pure imaging-based recurrence detection only
          - Initial cancer screening without surgical context
          - Standard tumor markers (CEA, CA-125) without genomic specificity
        correctAnswer: Tumor-informed personalized ctDNA panel post-surgery to detect molecular relapse months before clinical/imaging recurrence, guiding adjuvant therapy decisions
        rationale:
          pt: 'ctDNA-based MRD (minimal residual disease) detection: tumor-informed approach — sequence patient tumor → identify tumor-specific somatic mutations → design personalized ctDNA panel ~16-100 SNVs → sequential blood draws post-surgery monitor circulating tumor DNA. Companies: Natera Signatera (FDA breakthrough device 2019, Medicare coverage 2021 colorectal), Guardant Reveal (CRC-focused), C2i Genomics (whole-genome shallow), ArcherDx Personalis NeXT (broader cancers), Tempus xM. Clinical evidence: COBRA trial CRC (Reinert NEJM 2021), CIRCULATE trial Japan (Taniguchi NEJM 2022) — ctDNA-positive patients post-surgery had 80%+ recurrence vs <5% ctDNA-negative. Lead time: ~3-12 months ahead of imaging detection. Aplicações: (1) escalation adjuvant chemotherapy ctDNA+ patients, (2) de-escalation watch-and-wait ctDNA- patients, (3) treatment response monitoring metastatic, (4) clinical trial enrichment. Subsequent: tumor-naive (Methyl-Seq Adaptive Biotech, Singlera blood-based), neoadjuvant trials (organ preservation rectal/breast), early-stage CRC ctDNA-guided trial DYNAMIC NEJM 2022 demonstrated ctDNA-guided lower chemotherapy use safe. Field 2024 maturing: ~10+ ctDNA MRD products clinical use, evidence-based guidelines NCCN/ASCO emerging. Reimbursement Medicare CRC + breast 2023+. Eventually expanded all curative-intent cancer surgery monitoring.'
          en: 'ctDNA-based MRD (minimal residual disease) detection: tumor-informed approach — sequence patient tumor → identify tumor-specific somatic mutations → design personalized ctDNA panel of ~16-100 SNVs → sequential blood draws post-surgery monitor circulating tumor DNA. Companies: Natera Signatera (FDA breakthrough device 2019, Medicare coverage 2021 for colorectal), Guardant Reveal (CRC-focused), C2i Genomics (whole-genome shallow), ArcherDx Personalis NeXT (broader cancers), Tempus xM. Clinical evidence: COBRA trial CRC (Reinert NEJM 2021), CIRCULATE trial Japan (Taniguchi NEJM 2022) — ctDNA-positive patients post-surgery had 80%+ recurrence vs <5% in ctDNA-negative. Lead time: ~3-12 months ahead of imaging detection. Applications: (1) escalation of adjuvant chemotherapy in ctDNA+ patients, (2) de-escalation watch-and-wait in ctDNA- patients, (3) treatment response monitoring in metastatic disease, (4) clinical trial enrichment. Subsequent: tumor-naive (Methyl-Seq Adaptive Biotech, Singlera blood-based), neoadjuvant trials (organ preservation rectal/breast), early-stage CRC ctDNA-guided trial DYNAMIC NEJM 2022 demonstrated ctDNA-guided lower chemotherapy use safe. Field 2024 maturing: ~10+ ctDNA MRD products in clinical use, evidence-based guidelines from NCCN/ASCO emerging. Reimbursement Medicare CRC + breast 2023+. Eventually expanded to all curative-intent cancer surgery monitoring.'
