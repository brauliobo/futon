          pt: GRAIL Galleri MCED (Multi-Cancer Early Detection blood test) é…
          en: GRAIL Galleri MCED (Multi-Cancer Early Detection blood test) is…
        choices:
          - cfDNA methylation-based blood test screening for ~50 cancer types simultaneously, identifying tissue-of-origin via ML, FDA pending broader rollout, ~$950 self-pay
          - Single-cancer-type biomarker only
          - Pure imaging-based screening
          - Standard tumor biopsy without blood component
        correctAnswer: cfDNA methylation-based blood test screening for ~50 cancer types simultaneously, identifying tissue-of-origin via ML, FDA pending broader rollout, ~$950 self-pay
        rationale:
          pt: 'GRAIL Galleri (founded 2016 Illumina spinout, $1B+ raised, $8B Illumina re-acquisition 2021 → divestment forced FTC 2023): Multi-Cancer Early Detection (MCED) blood test. Technology: targeted bisulfite sequencing ~100k informative methylation regions across genome (Methylation Targeted Bisulfite Sequencing) → ML classifier trained ~24000 samples (Klein Annal Oncol 2021 + 2022) → cancer signal detected (CSD) yes/no + Cancer Signal Origin (CSO, predict tumor tissue type ~88% accuracy when positive). PATHFINDER trial 2023 prospective (Schrag/Galleri Lancet 2023 ~6620 asymptomatic adults age 50+): 6.3% cancer signal detected → 1.4% confirmed cancer (PPV ~38%) → identified ~14 cancers without symptoms, 71% in early stages. Implementation: launched 2021 as LDT (laboratory-developed test) ~$950 self-pay USA, no FDA approval → FDA filed BLA 2024 standard regulatory path. NHS UK NHS-Galleri trial 2021-2026 ~140000 participants randomized — first national MCED evaluation. Concurrent MCED: PathAI Eclipse, Freenome (CRC blood-based), Singlera Genomics (Asia), Exact Sciences Cancerguard (Cologuard developer), Guardant Reveal MRD. Field 2024 active development cancer screening paradigm — single-test multi-cancer vs cancer-specific (mammography, CT lung, colonoscopy). Lead-time bias + over-diagnosis concerns. Cost-effectiveness still under-evaluated.'
          en: 'GRAIL Galleri (founded 2016 Illumina spinout, $1B+ raised, $8B Illumina re-acquisition 2021 → divestment forced FTC 2023): Multi-Cancer Early Detection (MCED) blood test. Technology: targeted bisulfite sequencing of ~100k informative methylation regions across genome (Methylation Targeted Bisulfite Sequencing) → ML classifier trained on ~24000 samples (Klein Ann Oncol 2021 + 2022) → cancer signal detected (CSD) yes/no + Cancer Signal Origin (CSO, predict tumor tissue type ~88% accuracy when positive). PATHFINDER trial 2023 prospective (Schrag/Galleri Lancet 2023 ~6620 asymptomatic adults age 50+): 6.3% cancer signal detected → 1.4% confirmed cancer (PPV ~38%) → identified ~14 cancers without symptoms, 71% in early stages. Implementation: launched 2021 as LDT (laboratory-developed test) ~$950 self-pay USA, no FDA approval → FDA filed BLA 2024 standard regulatory path. NHS UK NHS-Galleri trial 2021-2026 ~140000 participants randomized — first national MCED evaluation. Concurrent MCED: PathAI Eclipse, Freenome (CRC blood-based), Singlera Genomics (Asia), Exact Sciences Cancerguard (Cologuard developer), Guardant Reveal MRD. Field 2024 active development cancer screening paradigm — single-test multi-cancer vs cancer-specific (mammography, CT lung, colonoscopy). Lead-time bias + over-diagnosis concerns. Cost-effectiveness still under-evaluated.'
