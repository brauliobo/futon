title:
  pt: Evolução do Câncer, Hematopoese Clonal e Biópsia Líquida
  en: Cancer Evolution, Clonal Hematopoiesis, and Liquid Biopsy
level: S
subject: biology
objectives:
  - Compreender TCGA/ICGC/PCAWG, mutational signatures
  - Reconhecer evolução clonal, TRACERx, ITH
  - Identificar CHIP, ctDNA MRD, GRAIL Galleri MCED
  - Avaliar PARP/BRCA, DepMap, immune evasion MHC-I loss
difficulty: 5
authorNotes: |
  Cancer genomics 2024+: TCGA 2008-2018 ~33 cancers, ICGC + PCAWG ~2700 whole genomes
  Nature 2020. Alexandrov SBS mutational signatures COSMIC. Greaves clonal evolution. TRACERx
  Swanton lung cancer ITH. Jaiswal/Ebert CHIP NEJM 2014. Bick TRACERx 2018. Olaparib Lynparza
  AstraZeneca BRCA PARP. DepMap CCLE. GRAIL Galleri MCED 2021+. Schreiber immunoediting
  elimination/equilibrium/escape. Foundation Medicine + Guardant ctDNA.
example:
  question:
    pt: Clonal Hematopoiesis of Indeterminate Potential (CHIP, Jaiswal/Ebert NEJM 2014) é…
    en: Clonal Hematopoiesis of Indeterminate Potential (CHIP, Jaiswal/Ebert NEJM 2014) is…
  choices:
    - Age-related expansion of leukemia-associated mutations (DNMT3A, TET2, ASXL1) in HSCs without overt malignancy, conferring elevated risk of hematologic cancer + cardiovascular disease
    - Pure benign aging without disease implications
    - Acute leukemia diagnosis identical to AML
    - Random somatic mutations without clonal expansion
  correctAnswer: Age-related expansion of leukemia-associated mutations (DNMT3A, TET2, ASXL1) in HSCs without overt malignancy, conferring elevated risk of hematologic cancer + cardiovascular disease
  rationale:
    pt: 'CHIP (Clonal Hematopoiesis of Indeterminate Potential, Jaiswal Fontanillas Flannick Manning Grauman Mar Lindsley Mermel Burtt Chavez Ebert NEJM 2014 dezembro): exome sequencing ~17000 unselected adults → identified somatic mutations leukemia-associated genes (DNMT3A ~50% CHIP, TET2 ~25%, ASXL1 ~15%, JAK2, SF3B1, TP53) at variant allele frequency >2% peripheral blood absent overt hematologic malignancy. Prevalence age-dependent: ~1% age 40 → ~10% age 70 → ~20-30% age 90+. Implications: (1) ~13x increased risk hematologic malignancy AML/MDS over 10 years (still absolute risk modest ~1%/year), (2) ~2x increased risk cardiovascular disease (CHIP-mutant macrophages → IL-1β/IL-6 atherosclerosis pathway, Fuster/Walsh + Jaiswal 2017+ studies). CHIP-CVD link via IL-6 → Ridker CANTOS trial canakinumab anti-IL-1β reduced cardiovascular events especially CHIP+ patients (post-hoc analysis NEJM 2017). Bick/Ebert/Natarajan 2020 Cell — JAK2 V617F CHIP particularly thrombotic. CCUS clonal cytopenias related entity. Subsequent: TET2-CHIP linked Alzheimer protective (microglia clearance), CH-driven CMV reactivation. Field 2024 active: CHIP screening clinical guidelines emerging, anti-IL-6 prevention, BCL11A KO targeting clonal advantage hypothesis.'
    en: 'CHIP (Clonal Hematopoiesis of Indeterminate Potential, Jaiswal/Ebert NEJM December 2014): exome sequencing of ~17000 unselected adults → identified somatic mutations in leukemia-associated genes (DNMT3A ~50% of CHIP, TET2 ~25%, ASXL1 ~15%, JAK2, SF3B1, TP53) at variant allele frequency >2% in peripheral blood absent overt hematologic malignancy. Prevalence age-dependent: ~1% age 40 → ~10% age 70 → ~20-30% age 90+. Implications: (1) ~13x increased risk of hematologic malignancy AML/MDS over 10 years (still absolute risk modest ~1%/year), (2) ~2x increased risk of cardiovascular disease (CHIP-mutant macrophages → IL-1β/IL-6 atherosclerosis pathway, Fuster/Walsh + Jaiswal 2017+ studies). CHIP-CVD link via IL-6 → Ridker CANTOS trial canakinumab anti-IL-1β reduced cardiovascular events especially in CHIP+ patients (post-hoc analysis NEJM 2017). Bick/Ebert/Natarajan 2020 Cell — JAK2 V617F CHIP particularly thrombotic. CCUS clonal cytopenias related entity. Subsequent: TET2-CHIP linked Alzheimer protective (microglia clearance), CH-driven CMV reactivation. Field 2024 active: CHIP screening clinical guidelines emerging, anti-IL-6 prevention, BCL11A KO targeting clonal advantage hypothesis.'
