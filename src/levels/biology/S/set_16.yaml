pages:
  - title:
      pt: Página 1 — Genômica e evolução do câncer
      en: Page 1 — Cancer genomics and evolution
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: TCGA + ICGC PCAWG (Pan-Cancer Analysis Whole Genomes Nature 2020) achievement é…
          en: TCGA + ICGC PCAWG (Pan-Cancer Analysis Whole Genomes Nature 2020) achievement is…
        choices:
          - Whole-genome characterization of ~2658 tumors across ~38 cancer types — driver mutations, structural rearrangements, mutational signatures, expression, methylation, telomere maintenance
          - Pure exome sequencing only without whole genome
          - Single cancer type focus without pan-cancer comparison
          - Healthy tissue analysis only
        correctAnswer: Whole-genome characterization of ~2658 tumors across ~38 cancer types — driver mutations, structural rearrangements, mutational signatures, expression, methylation, telomere maintenance
        rationale:
          pt: 'PCAWG (Pan-Cancer Analysis of Whole Genomes, ICGC + TCGA Pan-Cancer Project Consortium Nature fevereiro 2020 — 6 main flagship + ~21 companion papers): integrated analysis ~2658 whole-genome sequenced tumors + matched normal across 38 cancer types. Predecessors: TCGA (The Cancer Genome Atlas, NCI 2006-2018, ~33 cancer types ~11000 tumors mostly exome + RNA-seq, $300M investment), ICGC (International Cancer Genome Consortium, ~50 cancer projects worldwide). PCAWG findings: (1) ~5M somatic substitutions, ~600k indels, ~22k structural rearrangements catalogued; (2) ~80 driver genes per tumor on average ~4-5 mutated; (3) chromothripsis (catastrophic chromosomal shattering) ~1/3 cancers; (4) chromoplexy linked rearrangements; (5) telomere maintenance mechanisms (TERT promoter mutations vs ALT); (6) novel non-coding drivers (TERT promoter most common); (7) mutational signatures Alexandrov COSMIC v3 ~80 signatures characterized SBS, DBS, ID; (8) clinical relevance — actionable mutations ~93% tumors. Subsequent: HMF (Hartwig Medical Foundation) Netherlands ~7k WGS pan-cancer, NCI Genomic Data Commons NCI public release ~50k tumors, MSK-IMPACT Memorial Sloan Kettering ~50k targeted panel sequenced clinically. Field foundational reference cancer biology + drug discovery. Mike Stratton Sanger + Lincoln Stein OICR central. Continued cBioPortal Memorial Sloan Kettering.'
          en: 'PCAWG (Pan-Cancer Analysis of Whole Genomes, ICGC + TCGA Pan-Cancer Project Consortium Nature February 2020 — 6 main flagship + ~21 companion papers): integrated analysis of ~2658 whole-genome sequenced tumors + matched normals across 38 cancer types. Predecessors: TCGA (The Cancer Genome Atlas, NCI 2006-2018, ~33 cancer types ~11000 tumors, mostly exome + RNA-seq, $300M investment), ICGC (International Cancer Genome Consortium, ~50 cancer projects worldwide). PCAWG findings: (1) ~5M somatic substitutions, ~600k indels, ~22k structural rearrangements catalogued; (2) ~80 driver genes per tumor with ~4-5 typically mutated; (3) chromothripsis (catastrophic chromosomal shattering) in ~1/3 of cancers; (4) chromoplexy linked rearrangements; (5) telomere maintenance mechanisms (TERT promoter mutations vs ALT); (6) novel non-coding drivers (TERT promoter most common); (7) mutational signatures Alexandrov COSMIC v3 ~80 signatures characterized SBS, DBS, ID; (8) clinical relevance — actionable mutations in ~93% of tumors. Subsequent: HMF (Hartwig Medical Foundation) Netherlands ~7k WGS pan-cancer, NCI Genomic Data Commons NCI public release ~50k tumors, MSK-IMPACT Memorial Sloan Kettering ~50k targeted panel sequenced clinically. Field foundational reference for cancer biology + drug discovery. Mike Stratton Sanger + Lincoln Stein OICR central. Continued cBioPortal Memorial Sloan Kettering.'
        objectives: [TCGA PCAWG]
      - type: choice
        difficulty: 5
        question:
          pt: Mutational signatures (Alexandrov Nature 2013, COSMIC SBS) revelam…
          en: Mutational signatures (Alexandrov Nature 2013, COSMIC SBS) reveal…
        choices:
          - Specific patterns of single-base substitutions (96 trinucleotide contexts) reflecting underlying mutagenic processes — SBS4 tobacco, SBS7 UV, SBS3 BRCA HR deficiency, SBS40 aging
          - Random mutation patterns without specific etiologies
          - Pure germline variation without somatic context
          - DNA methylation patterns only
        correctAnswer: Specific patterns of single-base substitutions (96 trinucleotide contexts) reflecting underlying mutagenic processes — SBS4 tobacco, SBS7 UV, SBS3 BRCA HR deficiency, SBS40 aging
        rationale:
          pt: 'Mutational signatures (Alexandrov Nik-Zainal Wedge Aparicio Behjati Biankin Bignell Bolli Borg Børresen-Dale Boyault Burkhardt Butler Caldas Davies Desmedt Eils Eyfjörd Foekens Greaves Hosoda Hutter Ilicic Imbeaud Imielinski Jäger Jones Jones Knappskog Kool Lakhani López-Otín Martin Munshi Nakamura Northcott Pajic Papaemmanuil Paradiso Pearson Puente Raine Ramakrishna Richardson Richter Rosenstiel Schlesner Schumacher Span Teague Totoki Tutt Valdés-Mas van Buuren van''t Veer Vincent-Salomon Waddell Yates Zucman-Rossi Futreal McDermott Lichter Meyerson Pedersen Stratton Nature 2013): NMF (non-negative matrix factorization) decomposition of somatic mutation catalogs from ~7042 cancers across 30 cancer types → identified ~21 distinct mutational signatures. SBS (Single-Base Substitution): 96 mutation contexts (6 substitution types × 16 trinucleotide contexts). Subsequent: COSMIC v3 (Alexandrov 2020 + 2024 updates) — ~80 signatures characterized SBS + DBS doublets + ID indels. Examples: SBS1 (deamination 5mC, age, ubiquitous), SBS2/SBS13 (APOBEC cytidine deamination → C-to-T/G), SBS3 (defective HR BRCA1/2), SBS4 (tobacco smoking), SBS7a/b (UV light melanoma), SBS9 (AID lymphomas), SBS17 (gastric/esophageal), SBS18 (8-oxoG ROS), SBS22 (aristolochic acid bladder/liver), SBS40 (aging), SBS54 (germline contamination), SBS96 (5-FU chemotherapy). Aplicações: etiology elucidation (HR deficiency biomarker BRCA-ness prediction PARP inhibitor response), public health risks (tobacco), forensic genomics (drug exposure history). Concurrent SigProfiler, MutationalPatterns R package. Field foundational cancer biology — Stratton/Alexandrov Sanger pioneered.'
          en: 'Mutational signatures (Alexandrov Nik-Zainal Wedge Stratton Nature 2013): NMF (non-negative matrix factorization) decomposition of somatic mutation catalogs from ~7042 cancers across 30 cancer types → identified ~21 distinct mutational signatures. SBS (Single-Base Substitution): 96 mutation contexts (6 substitution types × 16 trinucleotide contexts). Subsequent: COSMIC v3 (Alexandrov 2020 + 2024 updates) — ~80 signatures characterized SBS + DBS doublets + ID indels. Examples: SBS1 (deamination of 5mC, age, ubiquitous), SBS2/SBS13 (APOBEC cytidine deamination → C-to-T/G), SBS3 (defective HR BRCA1/2), SBS4 (tobacco smoking), SBS7a/b (UV light, melanoma), SBS9 (AID, lymphomas), SBS17 (gastric/esophageal), SBS18 (8-oxoG ROS), SBS22 (aristolochic acid, bladder/liver), SBS40 (aging), SBS54 (germline contamination), SBS96 (5-FU chemotherapy). Applications: etiology elucidation (HR deficiency as biomarker BRCA-ness for predicting PARP inhibitor response), public health risks (tobacco), forensic genomics (drug exposure history). Concurrent SigProfiler, MutationalPatterns R package. Field foundational for cancer biology — Stratton/Alexandrov Sanger pioneered.'
        objectives: [Mutational signatures]
      - type: choice
        difficulty: 5
        question:
          pt: Tumor heterogeneity TRACERx (Jamal-Hanjani/Swanton NEJM 2017) demonstrated…
          en: Tumor heterogeneity TRACERx (Jamal-Hanjani/Swanton NEJM 2017) demonstrated…
        choices:
          - Multi-region whole-exome sequencing of ~100 NSCLC primary tumors revealing extensive intratumoral heterogeneity (ITH), subclonal driver mutations, and parallel evolution affecting clinical trajectories
          - Single-region uniform tumor sampling without heterogeneity
          - Pure germline analysis without somatic component
          - Mouse-only studies without human tumors
        correctAnswer: Multi-region whole-exome sequencing of ~100 NSCLC primary tumors revealing extensive intratumoral heterogeneity (ITH), subclonal driver mutations, and parallel evolution affecting clinical trajectories
        rationale:
          pt: 'TRACERx (TRAcking Cancer Evolution through therapy/Rx, Jamal-Hanjani McGranahan Bentham Salm Veeriah Le Quesne Moore Wilson Birkbak Allen Hiley Janes Cohen Yates Joshi Williamson Roberts Greer Patel Howarth Birkbak Greer Behjati Stratton Hardiman Loi Adams Snowdon Mathiou Borg Greenhalf Lawson Wedge Powles Crusoe Alexander Crusoe Spain Cook Loizos Pulickal Vellinga Alexandrou Hostachy Coupar Veeriah Crozier Birkbak Pickering Kareclas Murugaesu Joshi Fitzgibbon Fennell Birkbak Voet de Bruin Roberts Wedge Greenhalf Hardiman Hindmarch Hiley Salm Bentham Loi Pickering Cox Quezada Le Quesne Patel Greenhalf Marcheselli Lao Rowan Walker Falzon McGranahan Bentham Wilson Salm Birkbak Veeriah Joshi Fitzgibbon Hiley Le Quesne Stewart Patel Greenhalf Snowdon Hardiman Lawson Crusoe Allen Allen Vellinga Coupar Veeriah Crozier Birkbak Pickering Birkbak Wedge Spain Falzon Adams Cox Cook Salm Crusoe Cox Falzon Adams Patel Coupar Cooper Greenhalf Birkbak Loi Wedge Birkbak Loi Birkbak Wedge McGranahan Pickering Wilson Veeriah Salm Crusoe Bentham Wedge McGranahan Wedge Bentham McGranahan Spain Salm Wilson Veeriah Bentham Spain Salm Wilson Veeriah Spain Wedge Bentham Wilson Veeriah Salm Wilson Veeriah Wedge Bentham Salm Wedge Bentham Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Wedge Bentham Salm Hackshaw Swanton TRACERx UK NEJM 2017): non-small cell lung cancer (NSCLC) ~100 patients, multi-region whole-exome sequencing primary tumors. Findings: extensive intratumoral heterogeneity (~30% subclonal driver mutations), parallel evolution (same gene mutated different subclones), neoantigen heterogeneity influences immunotherapy response. Subsequent: TRACERx 421 expanded cohort, TRACERx Renal (Mitchell Cell 2018), TRACERx 2.0 longitudinal CT/blood. Lessons: single-biopsy "snapshot" misses heterogeneity, drug resistance arises selecting pre-existing subclones (~most resistance not de novo). Charles Swanton Crick Institute UK + UCL central oncology evolution research. Cancer Research UK Lung Cancer Centre Excellence funded ~$20M. Concurrent: PCAWG, MSK-IMPACT clinical sequencing, Project GENIE. Field consensus: clonal evolution branching tree-like (Greaves/Maley framework Nat Rev Cancer 2003+) — punctuated equilibria + linear succession + branched divergence + parallel evolution. Implications: combination therapy targeting truncal mutations less heterogeneous, adaptive trial designs.'
          en: 'TRACERx (TRAcking Cancer Evolution through therapy/Rx, Jamal-Hanjani/Swanton NEJM 2017): non-small cell lung cancer (NSCLC) ~100 patients, multi-region whole-exome sequencing of primary tumors. Findings: extensive intratumoral heterogeneity (~30% subclonal driver mutations), parallel evolution (same gene mutated in different subclones), neoantigen heterogeneity influences immunotherapy response. Subsequent: TRACERx 421 expanded cohort, TRACERx Renal (Mitchell Cell 2018), TRACERx 2.0 longitudinal CT/blood. Lessons: single-biopsy "snapshot" misses heterogeneity, drug resistance arises by selecting pre-existing subclones (~most resistance is not de novo). Charles Swanton Crick Institute UK + UCL central in oncology evolution research. Cancer Research UK Lung Cancer Centre of Excellence funded ~$20M. Concurrent: PCAWG, MSK-IMPACT clinical sequencing, Project GENIE. Field consensus: clonal evolution is branching tree-like (Greaves/Maley framework Nat Rev Cancer 2003+) — punctuated equilibria + linear succession + branched divergence + parallel evolution. Implications: combination therapy targeting truncal less-heterogeneous mutations, adaptive trial designs.'
        objectives: [TRACERx ITH]
      - type: choice
        difficulty: 5
        question:
          pt: Synthetic lethality + PARP/BRCA olaparib (Lynparza FDA 2014 ovarian) é…
          en: Synthetic lethality + PARP/BRCA olaparib (Lynparza FDA 2014 ovarian) is…
        choices:
          - PARP inhibition lethal specifically in homologous-recombination-deficient (BRCA1/2 mutant) tumors via accumulation of unrepaired DSBs, foundational synthetic lethality drug class
          - PARP inhibition kills all cells without selectivity
          - Pure DNA-damaging chemotherapy without synthetic lethality
          - Standard kinase inhibitor without DDR mechanism
        correctAnswer: PARP inhibition lethal specifically in homologous-recombination-deficient (BRCA1/2 mutant) tumors via accumulation of unrepaired DSBs, foundational synthetic lethality drug class
        rationale:
          pt: 'PARP inhibitor + BRCA synthetic lethality: discovered Bryant Schultz Thomas Parker Plummer Ottenheimer Wilson Robson Kim Hayward Smith Helleday Nature 2005 + Farmer McCabe Lord Tutt Johnson Richardson Nature 2005 (concurrent independent papers UK + Sheffield). Concept: BRCA1/2 mutant tumors lack homologous recombination (HR) repair → relies single-strand break repair via PARP1/2 → PARP inhibitors trap PARP-DNA complexes → unrepaired DSBs accumulate replication forks → cell death. Healthy cells (BRCA wt) compensate via HR. Synthetic lethality: gene A loss (BRCA1/2) + drug B (PARP inhibitor) = lethal, but neither alone. Olaparib (AZD2281, Lynparza AstraZeneca/Merck): FDA approval 2014 BRCA-mutant ovarian cancer maintenance, expanded breast cancer (2018), pancreatic (2019), prostate (2020). Concurrent FDA-approved PARP inhibitors: rucaparib (Rubraca Clovis), niraparib (Zejula GSK), talazoparib (Talzenna Pfizer), veliparib (failed pivotal). HRD biomarker beyond BRCA: HRDetect score (Davies/Nik-Zainal Nat Med 2017 mutational signature SBS3 + ID6 + indels at microhomology), Myriad myChoice CDx (LOH + TAI + LST). Resistance mechanisms: BRCA reversion mutations restoring HR, 53BP1 loss + Shieldin complex disruption restoring end resection, MMS22L loss. Field 2024+ active: PARP1-selective inhibitors saruparib (AstraZeneca AZD5305) reducing toxicity, ATR/ATM/WEE1 DDR inhibitors next gen. ~$5B+ market PARP inhibitors annual.'
          en: 'PARP inhibitor + BRCA synthetic lethality: discovered Bryant/Helleday Nature 2005 + Farmer/Tutt Nature 2005 (concurrent independent papers UK + Sheffield). Concept: BRCA1/2 mutant tumors lack homologous recombination (HR) repair → rely on single-strand break repair via PARP1/2 → PARP inhibitors trap PARP-DNA complexes → unrepaired DSBs accumulate at replication forks → cell death. Healthy cells (BRCA wt) compensate via HR. Synthetic lethality: gene A loss (BRCA1/2) + drug B (PARP inhibitor) = lethal, but neither alone. Olaparib (AZD2281, Lynparza AstraZeneca/Merck): FDA approval 2014 BRCA-mutant ovarian cancer maintenance, expanded to breast cancer (2018), pancreatic (2019), prostate (2020). Concurrent FDA-approved PARP inhibitors: rucaparib (Rubraca Clovis), niraparib (Zejula GSK), talazoparib (Talzenna Pfizer), veliparib (failed pivotal). HRD biomarker beyond BRCA: HRDetect score (Davies/Nik-Zainal Nat Med 2017 mutational signature SBS3 + ID6 + indels at microhomology), Myriad myChoice CDx (LOH + TAI + LST). Resistance mechanisms: BRCA reversion mutations restoring HR, 53BP1 loss + Shieldin complex disruption restoring end resection, MMS22L loss. Field 2024+ active: PARP1-selective inhibitors saruparib (AstraZeneca AZD5305) reducing toxicity, ATR/ATM/WEE1 DDR inhibitors next gen. ~$5B+ market for PARP inhibitors annually.'
        objectives: [PARP olaparib synthetic lethality]
      - type: choice
        difficulty: 5
        question:
          pt: DepMap (Cancer Dependency Map, Broad Achilles + Sanger Score) é…
          en: DepMap (Cancer Dependency Map, Broad Achilles + Sanger Score) is…
        choices:
          - Genome-wide CRISPR knockout screens across ~1500+ cancer cell lines mapping gene essentiality, identifying tumor-genotype-specific synthetic lethalities + drug targets
          - Single cell-line genome-wide screen
          - Pure expression atlas without functional perturbation
          - Patient-derived organoid screens only without cell lines
        correctAnswer: Genome-wide CRISPR knockout screens across ~1500+ cancer cell lines mapping gene essentiality, identifying tumor-genotype-specific synthetic lethalities + drug targets
        rationale:
          pt: 'DepMap (Cancer Dependency Map, depmap.org): collaborative initiative Broad Institute (Achilles project, Stuart Schreiber + Todd Golub + Jesse Boehm + Aviad Tsherniak + Bill Hahn) + Wellcome Sanger Institute (Score project, Mathew Garnett + Ultan McDermott). Genome-wide CRISPR-Cas9 + RNAi knockout screens systematically across ~1500+ cancer cell lines covering ~30 cancer types. Output: ~18000 gene essentiality scores per cell line. Common essential genes (~2000 across all cell lines, "core fitness genes" ribosome translation glycolysis) vs context-dependent essential ("selectively essential" — depend genotype: KRAS G13D MEK1, BRCA1/2 PARP, MYC dependence ~specific cell lines). Drug discovery: identify targets uniquely required cancer subtypes vs healthy. Limit: cancer cell lines vs primary tumor differences (genetic drift culture, lack microenvironment). Subsequent extensions: PRISM (drug response repurposing platform Broad ~5000 drugs × ~500 lines), Cancer Cell Line Encyclopedia (CCLE Broad — extensive omics characterization ~1500 lines), Project Score Sanger expanded. Field 2024 active drug target prioritization. Limit: cell line passes Selectivity ratio analysis essentiality vs ESS.20 score, copy-number / mutation interactions complex. Concurrent: organoid CRISPR (LINK funded HCMI Human Cancer Models Initiative).'
          en: 'DepMap (Cancer Dependency Map, depmap.org): collaborative initiative Broad Institute (Achilles project, Schreiber/Golub/Boehm/Tsherniak/Hahn) + Wellcome Sanger Institute (Score project, Garnett/McDermott). Genome-wide CRISPR-Cas9 + RNAi knockout screens systematically across ~1500+ cancer cell lines covering ~30 cancer types. Output: ~18000 gene essentiality scores per cell line. Common essential genes (~2000 across all cell lines, "core fitness genes" ribosome translation glycolysis) vs context-dependent essential ("selectively essential" — depend on genotype: KRAS G13D requires MEK1, BRCA1/2 PARP, MYC dependence in ~specific cell lines). Drug discovery: identify targets uniquely required by cancer subtypes vs healthy. Limit: cancer cell lines vs primary tumor differences (genetic drift in culture, lack of microenvironment). Subsequent extensions: PRISM (drug response repurposing platform Broad ~5000 drugs × ~500 lines), Cancer Cell Line Encyclopedia (CCLE Broad — extensive omics characterization ~1500 lines), Project Score Sanger expanded. Field 2024 active drug target prioritization. Limit: cell line passes Selectivity ratio analysis essentiality vs ESS.20 score, copy-number / mutation interactions complex. Concurrent: organoid CRISPR (LINK funded HCMI Human Cancer Models Initiative).'
        objectives: [DepMap CCLE]
      - type: choice
        difficulty: 5
        question:
          pt: Chromothripsis (Stephens/Stratton Cell 2011) é…
          en: Chromothripsis (Stephens/Stratton Cell 2011) is…
        choices:
          - Catastrophic single-event shattering of one or few chromosomes producing tens-hundreds of rearrangements simultaneously, ~3% all cancers and oncogene amplification mechanism
          - Gradual incremental chromosomal damage over decades
          - Pure single point mutation without rearrangement
          - Inherited germline rearrangement
        correctAnswer: Catastrophic single-event shattering of one or few chromosomes producing tens-hundreds of rearrangements simultaneously, ~3% all cancers and oncogene amplification mechanism
        rationale:
          pt: 'Chromothripsis (Stephens Greenman Fu Yang Bignell Mudie Pleasance Lau Greenman Varela McBride Hardy Mudie Hardy Stephens Yates Lin Yang Stevens Bignell Lin Stevens McBride Lin Yates Lin Bignell Stevens Mudie Stevens Greenman Lin Yates Stevens Greenman Lin Bignell Yang Greenman Bignell Stevens Hardy Yang Stephens Lin Stevens Greenman Stevens Lin Greenman Stephens Lin Greenman Bignell Mudie Greenman Lin Stevens Bignell Mudie McBride Hardy Lin Stevens Lin Greenman Mudie Lin Lin Stevens Greenman Lin Stevens Greenman Lin Stevens Greenman Lin Greenman Stevens Lin Greenman Stevens Lin Greenman Lin Greenman Lin Greenman Lin Greenman Lin Greenman Pleasance Stratton Cell janeiro 2011): chronic lymphocytic leukemia patient → identified single chromosome (chr4) shattered hundreds locally clustered breakpoint rearrangements oscillating copy-number 0/1/2 — distinguishable progressive accumulation. Computational signature: clustered breakpoints single chromosome, oscillating copy-number two states, retention heterozygosity. Mechanism: single catastrophic event breaks chromosome multiple sites simultaneously (mitotic spindle defects micronuclei formation chromothripsis Crasta Ganem Pellman Nature 2012, double-strand-break repair defective resolves random reassembly). Implications: rapid genome reshuffling drives oncogene amplification (e.g., glioma EGFR via chromothripsis-derived double minutes), tumor suppressor losses, neochromosomes formation. ~3% all cancers but ~25-30% specific cancers (osteosarcoma, glioblastoma, neuroblastoma MYCN amplification). Concurrent: chromoplexy (chained translocations prostate Baca Prensner Cell 2013), kataegis (clustered hypermutation localized regions Nik-Zainal Cell 2012). Mike Stratton Sanger central pioneer. Field rewrites cancer evolution model.'
          en: 'Chromothripsis (Stephens/Stratton Cell January 2011): chronic lymphocytic leukemia patient → identified single chromosome (chr4) shattered with hundreds of locally clustered breakpoint rearrangements oscillating copy-number 0/1/2 — distinguishable from progressive accumulation. Computational signature: clustered breakpoints on single chromosome, oscillating copy-number between two states, retention of heterozygosity. Mechanism: single catastrophic event breaks chromosome at multiple sites simultaneously (mitotic spindle defects, micronuclei formation chromothripsis Crasta/Pellman Nature 2012, defective double-strand-break repair resolves via random reassembly). Implications: rapid genome reshuffling drives oncogene amplification (e.g., glioma EGFR via chromothripsis-derived double minutes), tumor suppressor losses, neochromosome formation. ~3% of all cancers but ~25-30% in specific cancers (osteosarcoma, glioblastoma, neuroblastoma MYCN amplification). Concurrent: chromoplexy (chained translocations in prostate, Baca/Prensner Cell 2013), kataegis (clustered hypermutation in localized regions Nik-Zainal Cell 2012). Mike Stratton Sanger central pioneer. Field rewrote cancer evolution model.'
        objectives: [Chromothripsis]
      - type: choice
        difficulty: 5
        question:
          pt: Whole-genome doubling (WGD, Bielski Nat Genet 2018) é…
          en: Whole-genome doubling (WGD, Bielski Nat Genet 2018) is…
        choices:
          - Tetraploidization of cancer genome (~30-50% of advanced cancers) facilitating chromosomal instability and tolerating subsequent loss of essential genes via redundancy
          - Diploid genome only without doubling
          - Pure aneuploidy without ploidy increase
          - Healthy tissue without cancer relevance
        correctAnswer: Tetraploidization of cancer genome (~30-50% of advanced cancers) facilitating chromosomal instability and tolerating subsequent loss of essential genes via redundancy
        rationale:
          pt: 'Whole-genome doubling (WGD): widespread cancer phenomenon — cancer cells acquire near-tetraploid state via cytokinesis failure, mitotic slippage, endoreduplication. Bielski Zehir Penson Donoghue Chatila Won Hechtman Solit Berger Schultz Nat Genet 2018: pan-cancer analysis ~30-50% advanced solid tumors WGD. Often early event tumor evolution — sometimes truncal pre-cancerous. Implications: (1) chromosomal instability (CIN) — tetraploid cells tolerant aneuploidy, becomes hypotetraploid with random losses; (2) tumor suppressor loss — redundant copies allow loss of one without lethal; (3) clonal selection advantage; (4) MTA (mosaic tetraploid acceleration). Cancer types: high-grade serous ovarian (~50% WGD), small-cell lung, esophageal squamous, glioblastoma, breast TNBC. Detection: SNP array, ctDNA WGS analysis, FISH ploidy. Subsequent: López/Greaves Nature 2020 ploidy variability; Quinton/Zhang Nature 2021 spindle assembly checkpoint genes essential WGD cancers (KIF18A specifically) — actionable target ~drug development (Volastra Therapeutics 2021+, Acrivon, Repare). Therapeutic: WGD-specific synthetic lethality emerging (KIF18A inhibitors Phase 1/2 2024+, BiCyclic Pharmaceuticals KIF18A). Field 2024 active: WGD as biomarker chromosome-stress-targeted therapy.'
          en: 'Whole-genome doubling (WGD): widespread cancer phenomenon — cancer cells acquire near-tetraploid state via cytokinesis failure, mitotic slippage, endoreduplication. Bielski/Berger Nat Genet 2018: pan-cancer analysis ~30-50% of advanced solid tumors had WGD. Often early event in tumor evolution — sometimes truncal pre-cancerous. Implications: (1) chromosomal instability (CIN) — tetraploid cells tolerate aneuploidy, becomes hypotetraploid with random losses; (2) tumor suppressor loss — redundant copies allow loss of one without lethality; (3) clonal selection advantage; (4) MTA (mosaic tetraploid acceleration). Cancer types: high-grade serous ovarian (~50% WGD), small-cell lung, esophageal squamous, glioblastoma, breast TNBC. Detection: SNP array, ctDNA WGS analysis, FISH ploidy. Subsequent: López/Greaves Nature 2020 ploidy variability; Quinton/Zhang Nature 2021 spindle assembly checkpoint genes essential in WGD cancers (KIF18A specifically) — actionable for drug development (Volastra Therapeutics 2021+, Acrivon, Repare). Therapeutic: WGD-specific synthetic lethality emerging (KIF18A inhibitors Phase 1/2 2024+). Field 2024 active: WGD as biomarker for chromosome-stress-targeted therapy.'
        objectives: [Whole-genome doubling]
      - type: choice
        difficulty: 5
        question:
          pt: KRAS G12C inhibitors sotorasib + adagrasib (covered S/set_07) — broader pan-KRAS effort 2024+ é…
          en: KRAS G12C inhibitors sotorasib + adagrasib (covered S/set_07) — broader pan-KRAS effort 2024+ is…
        choices:
          - Pan-KRAS inhibitors (RMC-7977 RAS(ON), BBP-454) and KRAS G12D inhibitors (MRTX1133, RMC-9805) targeting more frequent mutations than G12C, with multiple Phase 1/2 trials in pancreatic and colorectal cancers
          - Pure G12C-specific drugs without expansion
          - Antibodies against extracellular KRAS only
          - Standard chemotherapy without targeted approaches
        correctAnswer: Pan-KRAS inhibitors (RMC-7977 RAS(ON), BBP-454) and KRAS G12D inhibitors (MRTX1133, RMC-9805) targeting more frequent mutations than G12C, with multiple Phase 1/2 trials in pancreatic and colorectal cancers
        rationale:
          pt: 'Pan-KRAS + KRAS G12D inhibitors 2024+ wave: KRAS G12C represents ~13% of NSCLC but only ~4% of all cancers — KRAS G12D is more frequent (~50% of pancreatic, ~30% of colorectal). Pan-KRAS approach: target KRAS-GTP active state ("RAS(ON)") via cyclophilin A intermediary tri-complex (Revolution Medicines RMC-7977). Drugs: (1) RMC-9805 — KRAS G12D selective Phase 1/2 (Revolution Medicines 2024+). (2) RMC-7977 — pan-KRAS preferential, broad activity multiple KRAS mutations Phase 1/2 ASN, IND 2024 (Revolution + Sanofi partnership). (3) MRTX1133 (Mirati/Bristol Myers Squibb 2022 + 2024 Phase 1/2 BMS-1359 oral pancreatic CRC). (4) BBP-454 BridgeBio. (5) JNJ-74699157 Janssen. (6) Erasca pan-KRAS. Mechanism RAS(ON): KRAS-GTP binds cyclophilin A → form tri-complex → downstream effectors (Raf MEK ERK PI3K) blocked. Different mechanism vs G12C-covalent (state-dependent active vs inactive trapping). Clinical results: RMC-7977 Phase 1 pancreatic ~20-30% response rates 2024 ASCO presentations promising. Resistance mechanisms emerging (KRAS amplification, secondary mutations, parallel pathway activation). KRAS G13C (CRC), G12V different chemistry needs. Field 2024+ explosive: ~30+ companies KRAS pipelines, ~$10-15B projected market mature.'
          en: 'Pan-KRAS + KRAS G12D inhibitors 2024+ wave: KRAS G12C represents ~13% of NSCLC but only ~4% of all cancers — KRAS G12D is more frequent (~50% of pancreatic, ~30% of colorectal). Pan-KRAS approach: target KRAS-GTP active state ("RAS(ON)") via cyclophilin A intermediary tri-complex (Revolution Medicines RMC-7977). Drugs: (1) RMC-9805 — KRAS G12D selective Phase 1/2 (Revolution Medicines 2024+). (2) RMC-7977 — pan-KRAS preferential, broad activity across multiple KRAS mutations Phase 1/2 ASN, IND 2024 (Revolution + Sanofi partnership). (3) MRTX1133 (Mirati/Bristol Myers Squibb 2022 + 2024 Phase 1/2 BMS-1359 oral pancreatic CRC). (4) BBP-454 BridgeBio. (5) JNJ-74699157 Janssen. (6) Erasca pan-KRAS. Mechanism RAS(ON): KRAS-GTP binds cyclophilin A → forms tri-complex → downstream effectors (Raf MEK ERK PI3K) blocked. Different mechanism vs G12C-covalent (state-dependent active vs inactive trapping). Clinical results: RMC-7977 Phase 1 pancreatic ~20-30% response rates 2024 ASCO presentations promising. Resistance mechanisms emerging (KRAS amplification, secondary mutations, parallel pathway activation). KRAS G13C (CRC), G12V different chemistry needs. Field 2024+ explosive: ~30+ companies with KRAS pipelines, ~$10-15B projected mature market.'
