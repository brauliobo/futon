        question:
          pt: Cancer prevention biomarkers / risk stratification (polygenic risk scores PRS, BCRA1/2 testing) é…
          en: Cancer prevention biomarkers / risk stratification (polygenic risk scores PRS, BRCA1/2 testing) is…
        choices:
          - Combining germline mutations (BRCA1/2, Lynch, TP53 Li-Fraumeni) with PRS for stratifying screening intensity, prophylactic surgery (mastectomy/oophorectomy) recommendations, lifestyle interventions
          - Pure environmental risk without genetic component
          - Single-gene testing without polygenic context
          - Treatment-only without prevention focus
        correctAnswer: Combining germline mutations (BRCA1/2, Lynch, TP53 Li-Fraumeni) with PRS for stratifying screening intensity, prophylactic surgery (mastectomy/oophorectomy) recommendations, lifestyle interventions
        rationale:
          pt: 'Cancer prevention + risk stratification: (1) Major cancer susceptibility germline syndromes — BRCA1/2 (~70% breast lifetime risk, ~40-50% ovarian, ~20% pancreatic, prostate; ~1:300-400 prevalence general but ~1:40 Ashkenazi Jewish), Lynch syndrome MLH1/MSH2/MSH6/PMS2 (~50-80% CRC lifetime, ~40-60% endometrial), Li-Fraumeni TP53 (~50%+ lifetime cancer risk multiple types), STK11 Peutz-Jeghers, CDH1 hereditary diffuse gastric, APC familial adenomatous polyposis, HOXB13 prostate. Testing: hereditary panel multi-gene NGS (Color, Invitae, Myriad, GeneDx) ~$200-400 commercial. (2) Polygenic risk scores (PRS) — common variants (~thousands) collectively predict risk; PRS has 5-10x higher impact than monogenic ~1% population. Breast cancer PRS (313 SNPs Mavaddat Am J Hum Genet 2019), prostate cancer PRS, CRC PRS — combined with mammography density, family history, pre-clinical biomarkers. PRS validated diverse ancestry challenges (mostly European-trained, less performance other populations). (3) Clinical actions: BRCA+ → enhanced screening MRI age 25 + mammo, prophylactic mastectomy (~95% risk reduction), risk-reducing salpingo-oophorectomy (RRSO, ~80% ovarian risk reduction). Lynch+ → annual colonoscopy age 25, screening other cancers. (4) Chemoprevention — tamoxifen high-risk women (USPSTF B recommendation 2019), aspirin Lynch syndrome (CAPP2 trial 2011), GLP-1 agonists 2024+ obesity-related cancers reduced. (5) Lifestyle — physical activity, weight management, alcohol moderation. Field 2024 mature: precision prevention emerging integrating genomic + clinical + environmental risk.'
          en: 'Cancer prevention + risk stratification: (1) Major cancer susceptibility germline syndromes — BRCA1/2 (~70% breast lifetime risk, ~40-50% ovarian, ~20% pancreatic, prostate; ~1:300-400 prevalence in general population but ~1:40 in Ashkenazi Jewish), Lynch syndrome MLH1/MSH2/MSH6/PMS2 (~50-80% CRC lifetime, ~40-60% endometrial), Li-Fraumeni TP53 (~50%+ lifetime cancer risk multiple types), STK11 Peutz-Jeghers, CDH1 hereditary diffuse gastric, APC familial adenomatous polyposis, HOXB13 prostate. Testing: hereditary panel multi-gene NGS (Color, Invitae, Myriad, GeneDx) ~$200-400 commercial. (2) Polygenic risk scores (PRS) — common variants (~thousands) collectively predict risk; PRS has 5-10x higher impact than monogenic in ~1% of population. Breast cancer PRS (313 SNPs Mavaddat Am J Hum Genet 2019), prostate cancer PRS, CRC PRS — combined with mammography density, family history, pre-clinical biomarkers. PRS validated diverse ancestry challenges (mostly European-trained, less performance in other populations). (3) Clinical actions: BRCA+ → enhanced screening MRI age 25 + mammography, prophylactic mastectomy (~95% risk reduction), risk-reducing salpingo-oophorectomy (RRSO, ~80% ovarian risk reduction). Lynch+ → annual colonoscopy from age 25, screening of other cancers. (4) Chemoprevention — tamoxifen for high-risk women (USPSTF B recommendation 2019), aspirin in Lynch syndrome (CAPP2 trial 2011), GLP-1 agonists 2024+ obesity-related cancers reduced. (5) Lifestyle — physical activity, weight management, alcohol moderation. Field 2024 mature: precision prevention emerging by integrating genomic + clinical + environmental risk.'
