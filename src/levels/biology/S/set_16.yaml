      - type: choice
        difficulty: 5
        question:
          pt: Tumor immune evasion MHC class I loss mechanisms são…
          en: Tumor immune evasion MHC class I loss mechanisms are…
        choices:
          - Genetic loss (B2M, HLA, TAP1/2 mutations) or epigenetic silencing reduces MHC-I-mediated antigen presentation, evading CD8+ T-cell killing — ~30-40% advanced tumors
          - All tumors retain full MHC-I function
          - Pure innate immunity without adaptive component
          - MHC-II changes only without MHC-I
        correctAnswer: Genetic loss (B2M, HLA, TAP1/2 mutations) or epigenetic silencing reduces MHC-I-mediated antigen presentation, evading CD8+ T-cell killing — ~30-40% advanced tumors
        rationale:
          pt: 'Tumor immune evasion via MHC-I loss: ~30-40% advanced tumors → reduce/eliminate MHC-I antigen presentation. Mechanisms: (1) Beta-2 microglobulin (B2M) mutations/deletions — B2M required HLA-I cell surface expression, frameshift mutations common melanoma, MSI-high CRC, NSCLC. (2) HLA-A/B/C loss of heterozygosity (LOH-HLA, McGranahan/Swanton Cell 2017 ~40% NSCLC). (3) Mutations in TAP1/TAP2 transporters peptide loading. (4) Calnexin/Tapasin pathway disruption. (5) IFN-γ signaling defects (JAK1/JAK2 mutations Zaretsky/Ribas NEJM 2016 acquired resistance pembrolizumab melanoma). (6) Epigenetic silencing via PRC2/EZH2 H3K27me3, methylation HLA promoters. Consequences: CD8+ T cells fail recognize tumor antigens → immune escape → checkpoint inhibitor (anti-PD-1) failure. Clinical: HLA-LOH biomarker negative ICI response, MHC-I retention positive predictor. Therapeutic strategies: (1) HLA upregulation IFN-γ priming, (2) NK cell engagement (MHC-I-low tumors → "missing self" NK targets), (3) bispecific T-cell engagers MHC-independent (BiTEs), (4) CAR-T MHC-independent recognition. Subsequent: HLA pan-Hsp70 vaccines, HLA-conserved peptide bispecifics (Tetraprokas), iCAR (inhibitory CAR receptors anti-HLA preserve self). Field 2024 active immunotherapy resistance mechanism research.'
          en: 'Tumor immune evasion via MHC-I loss: ~30-40% of advanced tumors reduce/eliminate MHC-I antigen presentation. Mechanisms: (1) Beta-2 microglobulin (B2M) mutations/deletions — B2M required for HLA-I cell-surface expression, frameshift mutations common in melanoma, MSI-high CRC, NSCLC. (2) HLA-A/B/C loss of heterozygosity (LOH-HLA, McGranahan/Swanton Cell 2017 ~40% NSCLC). (3) Mutations in TAP1/TAP2 transporters of peptide loading. (4) Calnexin/Tapasin pathway disruption. (5) IFN-γ signaling defects (JAK1/JAK2 mutations Zaretsky/Ribas NEJM 2016 acquired resistance to pembrolizumab in melanoma). (6) Epigenetic silencing via PRC2/EZH2 H3K27me3, methylation of HLA promoters. Consequences: CD8+ T cells fail to recognize tumor antigens → immune escape → checkpoint inhibitor (anti-PD-1) failure. Clinical: HLA-LOH is biomarker for negative ICI response, MHC-I retention positive predictor. Therapeutic strategies: (1) HLA upregulation by IFN-γ priming, (2) NK cell engagement (MHC-I-low tumors → "missing self" NK targets), (3) bispecific T-cell engagers MHC-independent (BiTEs), (4) CAR-T MHC-independent recognition. Subsequent: HLA pan-Hsp70 vaccines, HLA-conserved peptide bispecifics (Tetraprokas), iCAR (inhibitory CAR receptors anti-HLA to preserve self). Field 2024 active immunotherapy resistance mechanism research.'
        objectives: [MHC-I immune evasion]
