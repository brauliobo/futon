        question:
          pt: Cancer immunoediting (Schreiber three-Es, Nat Rev Immunol 2002+) framework é…
          en: Cancer immunoediting (Schreiber three-Es, Nat Rev Immunol 2002+) framework is…
        choices:
          - Three phases — elimination (immune surveillance kills nascent tumors), equilibrium (dormant balance), escape (immune evasion + clinical tumor) explaining tumor-immune coevolution
          - Single-step linear progression without phases
          - Pure non-immune cancer growth without immune component
          - Genetic-only cancer model without immune surveillance
        correctAnswer: Three phases — elimination (immune surveillance kills nascent tumors), equilibrium (dormant balance), escape (immune evasion + clinical tumor) explaining tumor-immune coevolution
        rationale:
          pt: 'Cancer immunoediting (Robert Schreiber Washington Univ St. Louis Nat Rev Immunol 2002 + Annu Rev Immunol 2004 conceptual + Koebel/Schreiber Nature 2007 mouse demonstration): three phases describing tumor-immune coevolution. (1) Elimination — immune surveillance: nascent tumors continuously detected destroyed CD8+ T cells, NK cells, IFN-γ-driven mechanisms (most cancers fail emerge — invisible "elimination" successes). (2) Equilibrium — surviving tumor variants enter dormancy: occult tumors persist immune control balance, may last decades (donor-derived metastasis transplant scenarios — recipient develops cancer dormant donor cells reawakening). (3) Escape — selected tumor variants evolve immune evasion: MHC-I loss, immune checkpoint upregulation (PD-L1 expression IFN-γ-induced "adaptive resistance"), Treg/MDSC recruitment, clinical detectable tumor. Conceptual significance: paradigm shift cancer immunology — explains why immunotherapy works (re-engage dormant CD8 T cells → flip "escape" → "elimination"). Foundation modern checkpoint inhibitor era (PD-1/CTLA-4 Allison/Honjo Nobel 2018). Schreiber pioneer Bumblebee — Hank Schreiber + Lloyd Old NYAS continued. Subsequent: tumor-immune coevolution single-cell + spatial omics atlases (Krummel UCSF, Mardis Wash U). Field foundational immune oncology.'
          en: 'Cancer immunoediting (Robert Schreiber Washington Univ St. Louis Nat Rev Immunol 2002 + Annu Rev Immunol 2004 conceptual + Koebel/Schreiber Nature 2007 mouse demonstration): three phases describing tumor-immune coevolution. (1) Elimination — immune surveillance: nascent tumors continuously detected and destroyed by CD8+ T cells, NK cells, IFN-γ-driven mechanisms (most cancers fail to emerge — invisible "elimination" successes). (2) Equilibrium — surviving tumor variants enter dormancy: occult tumors persist under immune control balance, may last decades (donor-derived metastasis transplant scenarios — recipient develops cancer from dormant donor cells reawakening). (3) Escape — selected tumor variants evolve immune evasion: MHC-I loss, immune checkpoint upregulation (PD-L1 expression IFN-γ-induced "adaptive resistance"), Treg/MDSC recruitment, clinically detectable tumor. Conceptual significance: paradigm shift in cancer immunology — explains why immunotherapy works (re-engage dormant CD8 T cells → flip "escape" → "elimination"). Foundation for modern checkpoint inhibitor era (PD-1/CTLA-4 Allison/Honjo Nobel 2018). Schreiber pioneer — Lloyd Old NYAS continued. Subsequent: tumor-immune coevolution single-cell + spatial omics atlases (Krummel UCSF, Mardis Wash U). Field foundational for immune oncology.'
        objectives: [Cancer immunoediting]
