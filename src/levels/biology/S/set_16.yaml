        question:
          pt: Tumor microenvironment (TME) cellular components incluem…
          en: Tumor microenvironment (TME) cellular components include…
        choices:
          - Cancer-associated fibroblasts (CAFs), tumor-infiltrating lymphocytes (TILs CD8/CD4/Treg), myeloid cells (TAMs, MDSCs), endothelial cells, pericytes, stromal cells, nerves shaping tumor biology and therapy response
          - Pure cancer cells without surrounding cells
          - Standard fibroblasts without subtypes
          - Immune cells only without stromal context
        correctAnswer: Cancer-associated fibroblasts (CAFs), tumor-infiltrating lymphocytes (TILs CD8/CD4/Treg), myeloid cells (TAMs, MDSCs), endothelial cells, pericytes, stromal cells, nerves shaping tumor biology and therapy response
        rationale:
          pt: 'Tumor microenvironment (TME) cellular composition: ~30-90% non-cancer cells depending tumor type. Major populations: (1) Cancer-associated fibroblasts (CAFs) — heterogeneous (myCAFs contractile myofibroblast-like, iCAFs inflammatory IL-6/CXCL12-secreting, apCAFs antigen-presenting MHC-II+, pCAFs proliferating Elyada/Tuveson Nat Rev Cancer 2020) → ECM deposition, immune exclusion barrier, growth factor secretion drug resistance. (2) Tumor-infiltrating lymphocytes (TILs) — CD8+ effector T cells, CD4+ helper, regulatory T cells (Tregs FOXP3+ suppressive), exhausted T cells (Tex PD-1+ TIM3+ TOX+), tissue-resident memory (Trm). (3) Myeloid cells — tumor-associated macrophages (TAMs M1 anti-tumor vs M2 pro-tumor), myeloid-derived suppressor cells (MDSCs immunosuppressive), dendritic cells (cDC1 antigen cross-presentation crucial CD8 priming). (4) Endothelial cells — abnormal tumor vasculature leaky tortuous, hypoxic core. (5) Pericytes — vascular support. (6) Neural innervation — sympathetic/parasympathetic tumor-promoting (prostate, pancreatic). (7) Mesenchymal stromal cells (MSCs). (8) Adipocytes (breast, ovarian). Single-cell atlases (Tumor HTAN Human Tumor Atlas Network NCI 2018+, IMC/MIBI spatial) revealing complexity. Therapeutic targeting TME: anti-VEGF (bevacizumab), CAR-T against CAFs, MDSC-targeting myeloid-modulators, anti-PD-1 reactivate exhausted T cells. Field 2024+ active multimodal characterization.'
          en: 'Tumor microenvironment (TME) cellular composition: ~30-90% of non-cancer cells depending on tumor type. Major populations: (1) Cancer-associated fibroblasts (CAFs) — heterogeneous (myCAFs contractile myofibroblast-like, iCAFs inflammatory IL-6/CXCL12-secreting, apCAFs antigen-presenting MHC-II+, pCAFs proliferating, Elyada/Tuveson Nat Rev Cancer 2020) → ECM deposition, immune exclusion barrier, growth factor secretion, drug resistance. (2) Tumor-infiltrating lymphocytes (TILs) — CD8+ effector T cells, CD4+ helper, regulatory T cells (Tregs FOXP3+ suppressive), exhausted T cells (Tex PD-1+ TIM3+ TOX+), tissue-resident memory (Trm). (3) Myeloid cells — tumor-associated macrophages (TAMs M1 anti-tumor vs M2 pro-tumor), myeloid-derived suppressor cells (MDSCs immunosuppressive), dendritic cells (cDC1 antigen cross-presentation crucial for CD8 priming). (4) Endothelial cells — abnormal tumor vasculature leaky tortuous, hypoxic core. (5) Pericytes — vascular support. (6) Neural innervation — sympathetic/parasympathetic tumor-promoting (prostate, pancreatic). (7) Mesenchymal stromal cells (MSCs). (8) Adipocytes (breast, ovarian). Single-cell atlases (Tumor HTAN Human Tumor Atlas Network NCI 2018+, IMC/MIBI spatial) revealing complexity. Therapeutic targeting TME: anti-VEGF (bevacizumab), CAR-T against CAFs, MDSC-targeting myeloid-modulators, anti-PD-1 reactivates exhausted T cells. Field 2024+ active multimodal characterization.'
