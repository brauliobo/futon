example:
  question:
    pt: AlphaMissense (Cheng/Hassabis DeepMind Science 2023) é…
    en: AlphaMissense (Cheng/Hassabis DeepMind Science 2023) is…
  choices:
    - AlphaFold-derived classifier predicting pathogenicity of all ~71M missense variants in human proteome — 89% classified, used in clinical interpretation pipelines
    - Pure DNA variant detector without missense focus
    - Random scoring without structural information
    - Structure prediction tool only without variant assessment
  correctAnswer: AlphaFold-derived classifier predicting pathogenicity of all ~71M missense variants in human proteome — 89% classified, used in clinical interpretation pipelines
  rationale:
    pt: 'AlphaMissense (Cheng Tsantekidis Schmuckermair Cisek Eismann Hatakeyama Goldreich Eisenstein Henderson Kohli Coursey Fish Tsiamis Adler Jumper Hassabis DeepMind Science 2023 setembro): supervised + self-supervised model based AlphaFold2 — predicts pathogenicity all ~71M possible missense variants ~19000 human proteins. 89% classified pathogenic ou benign (~32% likely pathogenic + ~57% likely benign), 11% uncertain. Validation against ClinVar (clinical-grade annotations) ~93% AUROC. Trained on weakly-labeled human/primate variation data — leverages AlphaFold2 protein structure embeddings + frequency information primates (purifying selection signature). Released 19 setembro 2023 — predictions free Ensembl + Geno2MP. Aplicações: variant interpretation rare disease pipelines (HelixDB, ClinGen), clinical genetic testing prioritize missense pathogenic, GWAS variant-to-gene mapping, protein function research. Limit: missense only (não deletions, indels, splice, frameshift, structural). Concurrent: ESM-1v Meta variant classifier 2021, EVE Frazer 2021, PrimateAI 2018 (Sundaram Illumina). Field 2024 standardizing variant interpretation AI-augmented.'
    en: 'AlphaMissense (Cheng/Hassabis DeepMind Science September 2023): supervised + self-supervised model based on AlphaFold2 — predicts pathogenicity of all ~71M possible missense variants across ~19000 human proteins. 89% classified as pathogenic or benign (~32% likely pathogenic + ~57% likely benign), 11% uncertain. Validation against ClinVar (clinical-grade annotations) ~93% AUROC. Trained on weakly-labeled human/primate variation data — leverages AlphaFold2 protein structure embeddings + frequency information across primates (purifying selection signature). Released 19 September 2023 — predictions free on Ensembl + Geno2MP. Applications: variant interpretation in rare disease pipelines (HelixDB, ClinGen), clinical genetic testing to prioritize pathogenic missense, GWAS variant-to-gene mapping, protein function research. Limit: missense only (not deletions, indels, splice, frameshift, structural). Concurrent: ESM-1v Meta variant classifier 2021, EVE Frazer 2021, PrimateAI 2018 (Sundaram Illumina). Field 2024 standardizing variant interpretation AI-augmented.'
