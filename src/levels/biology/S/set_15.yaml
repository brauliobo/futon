    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Halicin (Stokes/Collins MIT Cell 2020) marco foi…
          en: Halicin (Stokes/Collins MIT Cell 2020) milestone was…
        choices:
          - First antibiotic discovered via deep learning screening (~107M molecule virtual library) and validated active against multidrug-resistant bacteria including Acinetobacter and C. difficile
          - Pure traditional medicinal chemistry without AI
          - Random screening of natural products only
          - Plant-derived compound without computational discovery
        correctAnswer: First antibiotic discovered via deep learning screening (~107M molecule virtual library) and validated active against multidrug-resistant bacteria including Acinetobacter and C. difficile
        rationale:
          pt: 'Halicin (Stokes Yang Swanson Jin Cubillos-Ruiz Donghia MacNair French Carfrae Bloom-Ackermann Tran Chiappino-Pepe Badran Andrews Chory Church Brown Jaakkola Barzilay Collins Cell 2020): deep learning antibacterial screening pipeline — graph neural network trained ~2300 compounds inhibition E. coli growth → screened ~107M molecules virtual library Drug Repurposing Hub + ZINC15. Top hit: SU3327 (later renamed halicin after HAL 9000) — diabetes drug candidate previously abandoned. Validated experimentally: bactericidal pan-spectrum (Acinetobacter baumannii MDR, M. tuberculosis, C. difficile, ~Enterobacteriaceae), novel mechanism membrane potential dissipation rapid bactericidal — overcomes traditional resistance pathways. Mouse models: cleared A. baumannii infection. Followups: abaucin Stokes/Collins 2023 — AI-discovered narrow-spectrum anti-Acinetobacter. Concurrent AI antibiotics: Phare Bio (Collins/MIT spinout 2022) developing clinical candidates, Antiverse, Profluent. Lessons: AI screening efficient large libraries identifying chemically novel antibiotics, complementary traditional discovery pipelines anti-MDR effort. Field 2024 active expansão WHO priority pathogen antibiotic R&D.'
          en: 'Halicin (Stokes/Collins MIT Cell 2020): deep learning antibacterial screening pipeline — graph neural network trained on ~2300 compounds for inhibition of E. coli growth → screened ~107M molecules from virtual library Drug Repurposing Hub + ZINC15. Top hit: SU3327 (later renamed halicin after HAL 9000) — a diabetes drug candidate previously abandoned. Validated experimentally: bactericidal pan-spectrum (Acinetobacter baumannii MDR, M. tuberculosis, C. difficile, ~Enterobacteriaceae), novel mechanism of membrane potential dissipation rapid bactericidal — overcomes traditional resistance pathways. Mouse models: cleared A. baumannii infection. Follow-ups: abaucin Stokes/Collins 2023 — AI-discovered narrow-spectrum anti-Acinetobacter. Concurrent AI antibiotics: Phare Bio (Collins/MIT spinout 2022) developing clinical candidates, Antiverse, Profluent. Lessons: AI screening efficient for large libraries, identifying chemically novel antibiotics, complementary to traditional discovery pipelines for anti-MDR effort. Field 2024 active expansion for WHO priority pathogen antibiotic R&D.'
        objectives: [Halicin AI antibiotic]
      - type: choice
        difficulty: 5
        question:
          pt: Insilico Medicine ISM001-055 / rentosertib é…
          en: Insilico Medicine ISM001-055 / rentosertib is…
        choices:
          - First fully AI-discovered drug (target identification + molecular design) for idiopathic pulmonary fibrosis to reach Phase 2 trials in 2023, validating end-to-end generative AI pipeline
          - Standard medicinal chemistry candidate without AI
          - Vaccine candidate without small molecule
          - Pure repurposing of existing drug
        correctAnswer: First fully AI-discovered drug (target identification + molecular design) for idiopathic pulmonary fibrosis to reach Phase 2 trials in 2023, validating end-to-end generative AI pipeline
        rationale:
          pt: 'ISM001-055 (rentosertib, Insilico Medicine, Hong Kong/Toronto, Alex Zhavoronkov founder): AI-discovered drug end-to-end pipeline (~30 meses target ID → IND filing 2021). Target: TNIK (TRAF2- and NCK-interacting kinase) — identified PandaOmics platform Insilico AI causal target inference + transcriptomic data IPF (idiopathic pulmonary fibrosis) patients. Molecule: designed Chemistry42 generative AI (PandaOmics+Chemistry42 Insilico in-house). First-in-class oral small molecule TNIK inhibitor. Phase 1 healthy volunteers 2022 successful. Phase 2 IPF trial 2023+ enrollment ~70 patients. Significance: end-to-end AI from target → drug candidate → clinic — validation pipeline beyond proof-of-concept. Insilico business model AI-discovered drug ~10 portfolio drugs Phase 1+2 various indications (cancer, fibrosis, COVID, antimicrobial). IPO Hong Kong 2024+ pursuit. Concurrent fully AI-discovered: Exscientia DSP-1181 OCD (Sumitomo/Otsuka 2020 first AI clinical; failed Phase 1 efficacy 2022), DSP-0038 Alzheimer 2021. Recursion Pharma REC-2282 + REC-3964 IPO 2021 ($436M raise) Salesforce-acquired industrial AI-bio partnership. AI drug discovery field 2024 maturing — first FDA approval AI-discovered drug expected ~2027-2030 horizon.'
          en: 'ISM001-055 (rentosertib, Insilico Medicine, Hong Kong/Toronto, Alex Zhavoronkov founder): AI-discovered drug end-to-end pipeline (~30 months target ID → IND filing 2021). Target: TNIK (TRAF2- and NCK-interacting kinase) — identified by PandaOmics platform, Insilico AI causal target inference + transcriptomic data from IPF (idiopathic pulmonary fibrosis) patients. Molecule: designed by Chemistry42 generative AI (PandaOmics+Chemistry42 Insilico in-house). First-in-class oral small molecule TNIK inhibitor. Phase 1 healthy volunteers 2022 successful. Phase 2 IPF trial 2023+ enrollment ~70 patients. Significance: end-to-end AI from target → drug candidate → clinic — validation of pipeline beyond proof-of-concept. Insilico business model AI-discovered drug ~10 portfolio drugs Phase 1+2 various indications (cancer, fibrosis, COVID, antimicrobial). IPO Hong Kong 2024+ pursuit. Concurrent fully AI-discovered: Exscientia DSP-1181 OCD (Sumitomo/Otsuka 2020 first AI clinical; failed Phase 1 efficacy 2022), DSP-0038 Alzheimer 2021. Recursion Pharma REC-2282 + REC-3964 IPO 2021 ($436M raise) Salesforce-acquired industrial AI-bio partnership. AI drug discovery field 2024 maturing — first FDA approval of AI-discovered drug expected ~2027-2030 horizon.'
