      - type: choice
        difficulty: 5
        question:
          pt: Recursion Pharmaceuticals approach é…
          en: Recursion Pharmaceuticals approach is…
        choices:
          - Phenotypic AI image-based screening of millions of cellular states across ~1700+ cell line genetic perturbations, mapping disease biology and drug discovery via "Recursion OS" platform
          - Pure target-based screening without phenotypic component
          - Standard medicinal chemistry only
          - Vaccine development platform
        correctAnswer: Phenotypic AI image-based screening of millions of cellular states across ~1700+ cell line genetic perturbations, mapping disease biology and drug discovery via "Recursion OS" platform
        rationale:
          pt: 'Recursion Pharmaceuticals (founded 2013 Salt Lake City, Chris Gibson + Blake Borgeson + Dean Li University Utah): phenotypic AI drug discovery — automated cellular biology + computer vision + machine learning. Process: ~150 million cellular images/week generated via robotic high-content microscopy → CellProfiler/CellPainting features extracted → deep learning embeddings (~1024-dim cell state vectors) → map similarities across genetic perturbations + drug treatments. Recursion OS platform: ~1700+ cell-line CRISPR knockouts perturbed → atlas of cellular phenotypes → similarities reveal pathway memberships. Drug discovery: screen ~3000+ drugs vs disease-relevant genetic perturbations → identify pheno-similar drugs reverse mutant phenotype → repurposing + de novo discovery. Pipeline: REC-2282 NF2 mutant cancers Phase 2 NF2 schwannomatosis Recursion 2024, REC-3964 C. difficile Phase 2, REC-994 cerebral cavernous malformations Phase 2, others. IPO 2021 ~$436M. Salesforce strategic investment 2022 ~$50M industrial AI Plata-form scale. Subsequent: $25M Cyclica acquisition 2023, NVIDIA partnership 2023 GPU+BioNeMo. Recursion 2.0 2024+ generative AI integration scale. Concurrent: Insitro (Daphne Koller, Stanford → Salk → Insitro 2018), Schrödinger (computational chemistry 30+ years), Atomwise, BenevolentAI, Exscientia. Field 2024 industrial AI-pharma sector ~$10B+ market.'
          en: 'Recursion Pharmaceuticals (founded 2013 Salt Lake City, Chris Gibson + Blake Borgeson + Dean Li University Utah): phenotypic AI drug discovery — automated cellular biology + computer vision + machine learning. Process: ~150 million cellular images/week generated via robotic high-content microscopy → CellProfiler/CellPainting features extracted → deep learning embeddings (~1024-dim cell state vectors) → map similarities across genetic perturbations + drug treatments. Recursion OS platform: ~1700+ cell-line CRISPR knockouts perturbed → atlas of cellular phenotypes → similarities reveal pathway memberships. Drug discovery: screen ~3000+ drugs vs disease-relevant genetic perturbations → identify pheno-similar drugs that reverse mutant phenotype → repurposing + de novo discovery. Pipeline: REC-2282 NF2-mutant cancers Phase 2 NF2 schwannomatosis Recursion 2024, REC-3964 C. difficile Phase 2, REC-994 cerebral cavernous malformations Phase 2, others. IPO 2021 ~$436M. Salesforce strategic investment 2022 ~$50M industrial AI platform scale. Subsequent: $25M Cyclica acquisition 2023, NVIDIA partnership 2023 GPU+BioNeMo. Recursion 2.0 2024+ generative AI integration scale. Concurrent: Insitro (Daphne Koller, Stanford → Salk → Insitro 2018), Schrödinger (computational chemistry 30+ years), Atomwise, BenevolentAI, Exscientia. Field 2024 industrial AI-pharma sector ~$10B+ market.'
        objectives: [Recursion Pharmaceuticals]
      - type: choice
        difficulty: 5
        question:
          pt: AlphaProteo (DeepMind setembro 2024) é…
          en: AlphaProteo (DeepMind September 2024) is…
        choices:
          - DeepMind generative protein binder design model producing high-affinity de novo binders to therapeutic targets at experimental hit rates ~10-90% across diverse antigens
          - Pure structure prediction without design capability
          - Vaccine antigen synthesis only
          - Random sequence generator without target binding
        correctAnswer: DeepMind generative protein binder design model producing high-affinity de novo binders to therapeutic targets at experimental hit rates ~10-90% across diverse antigens
        rationale:
          pt: 'AlphaProteo (DeepMind/Isomorphic Labs setembro 2024 Science Zambaldi Bansal Beasley Boyne Connell Coomber Frean Hong Hricak Hudson Kew McMahon Sumner Avraham Beard Davis Dudden Friesen Hadsell Hadj Bouchireb Holley Kohli Kohli Senior Hassanieh Pelletier Hassabis Jumper): generative model directly outputs de novo protein binders to user-specified target proteins. Trained AlphaFold-related architecture. Demonstrated experimental success ~10-90% target depending — significantly outperforms RFdiffusion + ProteinMPNN pipeline. Targets: SARS-CoV-2 spike, viral influenza HA, BHRF1, IL-7Rα, PD-L1, TNFα, VEGFA. Subsequent: Isomorphic Labs (DeepMind drug-discovery sister, Eli Lilly Novartis pharma deals 2024) integrating into therapeutic pipelines — antibodies, biologics, peptides. Open weights TBD (Isomorphic commercial focus). Concurrent: Baker IPD RFdiffusion-based binders, ESM3 EvolutionaryScale, Chroma Generate Biomedicines, BindCraft (Pacesa/Correia EPFL 2024 open-source binder design). Field 2024+ generative biology revolution accelerating beyond proof-of-concept toward clinical-grade designed proteins. Implications: faster antibody/biologic discovery, undruggable targets accessible, low-cost vs traditional discovery campaigns.'
          en: 'AlphaProteo (DeepMind/Isomorphic Labs September 2024 Science): generative model directly outputs de novo protein binders to user-specified target proteins. Trained on AlphaFold-related architecture. Demonstrated experimental success ~10-90% per target — significantly outperforming RFdiffusion + ProteinMPNN pipeline. Targets: SARS-CoV-2 spike, viral influenza HA, BHRF1, IL-7Rα, PD-L1, TNFα, VEGFA. Subsequent: Isomorphic Labs (DeepMind drug-discovery sister, Eli Lilly Novartis pharma deals 2024) integrating into therapeutic pipelines — antibodies, biologics, peptides. Open weights TBD (Isomorphic commercial focus). Concurrent: Baker IPD RFdiffusion-based binders, ESM3 EvolutionaryScale, Chroma Generate Biomedicines, BindCraft (Pacesa/Correia EPFL 2024 open-source binder design). Field 2024+ generative biology revolution accelerating beyond proof-of-concept toward clinical-grade designed proteins. Implications: faster antibody/biologic discovery, undruggable targets accessible, low-cost vs traditional discovery campaigns.'
        objectives: [AlphaProteo]
      - type: choice
        difficulty: 5
        question:
          pt: Boltz-1 (MIT Jaakkola/Barzilay novembro 2024) é…
          en: Boltz-1 (MIT Jaakkola/Barzilay November 2024) is…
        choices:
          - Open-source AlphaFold3-class biomolecular structure prediction model with code + weights freely released, enabling academic research and commercial use unrestricted
          - Closed-source identical to AlphaFold3 commercial restrictions
          - Pure docking software without structure prediction
          - Single-protein prediction only without complexes
        correctAnswer: Open-source AlphaFold3-class biomolecular structure prediction model with code + weights freely released, enabling academic research and commercial use unrestricted
        rationale:
          pt: 'Boltz-1 (Wohlwend/Corso/Jaakkola/Barzilay/Boutet/Maier/Recursion/MIT JCAB 2024 novembro bioRxiv): open-source biomolecular structure prediction model AlphaFold3-class capabilities. Predicts protein-protein, protein-ligand, protein-DNA/RNA, ions complexes. Architecture: similar AlphaFold3 (Pairformer + diffusion-based structure module). Trained PDB + variants synthetic data. Released code + weights MIT-license freely usable academic + commercial — addresses limitations AlphaFold3 (academic restrictions Isomorphic Labs commercial). Performance comparable AlphaFold3 several benchmarks (PoseBusters protein-ligand). Concurrent: Chai-1 (Chai Discovery setembro 2024 — closed but free academic API, Mark Chen ex-OpenAI startup), Protenix (ByteDance ML Lab 2024 chinês). Boltz-1 widely adopted academic community. Subsequent: continual improvements 2025+. Field cumulative open-source movement post-AlphaFold3 — democratization continues. Concurrent: OpenFold + ESMFold + RoseTTAFold All-Atom (RFAA Krishna Baker IPD 2024) overlap. Bioinformatics tooling ecosystem rapidly maturing 2024+ around new generation foundation models proteins.'
          en: 'Boltz-1 (Wohlwend/Corso/Jaakkola/Barzilay MIT 2024 November bioRxiv): open-source biomolecular structure prediction model with AlphaFold3-class capabilities. Predicts protein-protein, protein-ligand, protein-DNA/RNA, ions complexes. Architecture: similar to AlphaFold3 (Pairformer + diffusion-based structure module). Trained on PDB + synthetic data variants. Released code + weights under MIT-license freely usable for academic + commercial — addresses limitations of AlphaFold3 (academic restrictions, Isomorphic Labs commercial). Performance comparable to AlphaFold3 on several benchmarks (PoseBusters protein-ligand). Concurrent: Chai-1 (Chai Discovery September 2024 — closed but free academic API, Mark Chen ex-OpenAI startup), Protenix (ByteDance ML Lab 2024 Chinese). Boltz-1 widely adopted by academic community. Subsequent: continual improvements 2025+. Field cumulative open-source movement post-AlphaFold3 — democratization continues. Concurrent: OpenFold + ESMFold + RoseTTAFold All-Atom (RFAA Krishna Baker IPD 2024) overlap. Bioinformatics tooling ecosystem rapidly maturing 2024+ around new generation foundation models for proteins.'
        objectives: [Boltz-1]
      - type: choice
        difficulty: 5
        question:
          pt: DiffDock (Corso/Stärk/Jing/Barzilay/Jaakkola MIT ICLR 2023) approach é…
          en: DiffDock (Corso/Stärk/Jing/Barzilay/Jaakkola MIT ICLR 2023) approach is…
        choices:
          - Diffusion model-based generative pose prediction for protein-ligand docking, sampling poses on rotation/translation/torsion manifold rather than scoring grid points
          - Pure energy-minimization classical docking without machine learning
          - Random ligand placement without scoring
          - X-ray crystallography simulation without docking
        correctAnswer: Diffusion model-based generative pose prediction for protein-ligand docking, sampling poses on rotation/translation/torsion manifold rather than scoring grid points
        rationale:
          pt: 'DiffDock (Corso Stärk Jing Barzilay Jaakkola Tommi MIT CSAIL ICLR 2023): paradigm shift molecular docking. Classical approaches (AutoDock Vina, Glide Schrödinger): score-and-search — generate ligand conformations + sampling protein binding pocket → score complementarity → top-ranked poses. Limit: discrete sampling, scoring inaccuracies. DiffDock: equivariant diffusion model directly generates ligand poses given protein structure + ligand SMILES → samples Tr (translation), Rot (rotation), Tor (torsion angles) manifold via SO(3) + SE(3) equivariant GNN architecture. Trained PDBBind ~17k complexes. Top-1 accuracy ~38% (~within 2Å RMSD) outperforms classical Vina ~22%. PoseBusters benchmark Buttenschön Morris 2023 highlighted limitations all docking methods physical realism (steric clashes, cofactor wrong) — subsequent improvements DiffDock-Pocket 2024, EquiBind, DSMBind. Concurrent: NeuralPLexer (Qiao Caltech 2023 protein-ligand cofold), Boltz-1 (2024 unified). Aplicações: virtual screening, structure-based drug design, target identification (ligand binding profile prediction). Field 2024+ AI docking matures rapidly — open competition AlphaFold3, Boltz-1, Chai-1 commercial Schrödinger.'
          en: 'DiffDock (Corso/Stärk/Jing/Barzilay/Jaakkola MIT CSAIL ICLR 2023): paradigm shift in molecular docking. Classical approaches (AutoDock Vina, Glide Schrödinger): score-and-search — generate ligand conformations + sampling protein binding pocket → score complementarity → top-ranked poses. Limit: discrete sampling, scoring inaccuracies. DiffDock: equivariant diffusion model directly generates ligand poses given protein structure + ligand SMILES → samples Tr (translation), Rot (rotation), Tor (torsion angles) manifold via SO(3) + SE(3) equivariant GNN architecture. Trained on PDBBind ~17k complexes. Top-1 accuracy ~38% (~within 2 Å RMSD) outperforms classical Vina ~22%. PoseBusters benchmark Buttenschön/Morris 2023 highlighted limitations of all docking methods on physical realism (steric clashes, cofactor wrong) — subsequent improvements DiffDock-Pocket 2024, EquiBind, DSMBind. Concurrent: NeuralPLexer (Qiao Caltech 2023 protein-ligand cofold), Boltz-1 (2024 unified). Applications: virtual screening, structure-based drug design, target identification (ligand binding profile prediction). Field 2024+ AI docking matures rapidly — open competition with AlphaFold3, Boltz-1, Chai-1 commercial, Schrödinger.'
        objectives: [DiffDock]
      - type: choice
        difficulty: 5
        question:
          pt: Atomwise virtual screening (1B+ molecule library) é…
          en: Atomwise virtual screening (1B+ molecule library) is…
        choices:
          - Convolutional-neural-network-based virtual screening of large compound libraries (~1B+ molecules) for protein binders, partnering with pharma for target campaigns since 2012+
          - Standard low-throughput biochemical screening
          - Pure experimental wet-lab without computation
          - Antibody discovery without small molecules
        correctAnswer: Convolutional-neural-network-based virtual screening of large compound libraries (~1B+ molecules) for protein binders, partnering with pharma for target campaigns since 2012+
        rationale:
          pt: 'Atomwise (founded 2012 San Francisco, Abraham Heifets + Izhar Wallach): pioneer AI virtual screening. AtomNet platform — CNN trained on protein-ligand binding examples → predict binding given target protein structure + small molecule SMILES/3D. Largest: ~1B+ molecule library screen ~quase 1 trillion virtual interactions/week capacity. Partnerships: AbbVie ~$550M deal 2020, Eli Lilly, Bayer, Merck, BMS pharma collaborations. Pipeline: AT-100 series tropical disease (Chagas), epidermolysis bullosa, AIMS (antimicrobials WHO PRIORITY pathogens). Field history: Atomwise initial proof-of-concept 2014 — Ebola virus VP35 hits → REC-994 cerebral cavernous malformation candidate. Subsequent AI virtual screening: Schrödinger Maestro + FEP+ (computational chemistry mature ~30 years), Chemspace billion molecule libraries, ZINC22 billion compound library Shoichet UCSF + Irwin. Differentiator: structure-aware CNN (vs older 2D descriptor-based ML). Limit: scoring accuracy bottleneck, false positives high-throughput, validation experimental confirmation crucial. Competition Recursion, Insilico, Insitro, Exscientia — Atomwise emphasis fee-for-service vs proprietary pipeline. Field 2024 mature commercial AI virtual screening ~$5-10B sector.'
          en: 'Atomwise (founded 2012 San Francisco, Abraham Heifets + Izhar Wallach): pioneer of AI virtual screening. AtomNet platform — CNN trained on protein-ligand binding examples → predicts binding given target protein structure + small molecule SMILES/3D. Largest: ~1B+ molecule library screen, ~almost 1 trillion virtual interactions/week capacity. Partnerships: AbbVie ~$550M deal 2020, Eli Lilly, Bayer, Merck, BMS pharma collaborations. Pipeline: AT-100 series tropical disease (Chagas), epidermolysis bullosa, AIMS (antimicrobials WHO PRIORITY pathogens). Field history: Atomwise initial proof-of-concept 2014 — Ebola virus VP35 hits → REC-994 cerebral cavernous malformation candidate. Subsequent AI virtual screening: Schrödinger Maestro + FEP+ (computational chemistry mature ~30 years), Chemspace billion-molecule libraries, ZINC22 billion-compound library Shoichet UCSF + Irwin. Differentiator: structure-aware CNN (vs older 2D descriptor-based ML). Limit: scoring accuracy bottleneck, false positives in high-throughput, experimental validation crucial. Competition with Recursion, Insilico, Insitro, Exscientia — Atomwise emphasis fee-for-service vs proprietary pipeline. Field 2024 mature commercial AI virtual screening ~$5-10B sector.'
        objectives: [Atomwise virtual screening]
      - type: choice
        difficulty: 5
        question:
          pt: Drug repurposing AI (BenevolentAI baricitinib COVID-19) example é…
          en: Drug repurposing AI (BenevolentAI baricitinib COVID-19) example is…
        choices:
          - AI knowledge graph identified baricitinib (JAK inhibitor for rheumatoid arthritis) as repurposed COVID-19 therapy via predicted ACE2/AAK1 inhibition; FDA EUA + clinical trial validated
          - Standard drug development without AI input
          - Random drug suggestion without rationale
          - Pure vaccine repurposing
        correctAnswer: AI knowledge graph identified baricitinib (JAK inhibitor for rheumatoid arthritis) as repurposed COVID-19 therapy via predicted ACE2/AAK1 inhibition; FDA EUA + clinical trial validated
        rationale:
          pt: 'Drug repurposing AI (BenevolentAI fevereiro 2020 Lancet Infectious Diseases Stebbing Phelan Griffin Tucker Oechsle Smith Richardson Lancet ID 2020): AI knowledge graph mining biomedical literature/databases identified baricitinib (JAK1/JAK2 inhibitor, FDA approved 2018 rheumatoid arthritis Olumiant Eli Lilly/Incyte) as repurposed COVID-19 therapy. Mechanism: predicted dual action — anti-inflammatory (JAK-STAT inhibition reduce cytokine storm) + putative antiviral (AAK1/GAK kinase inhibition → block clathrin-mediated SARS-CoV-2 endocytosis ACE2 receptor). Public 4 fevereiro 2020 — early pandemic. Subsequent: NIH-NIAID ACTT-2 trial 2020 (Kalil NEJM 2021) baricitinib + remdesivir vs remdesivir alone hospitalized COVID — 1-day shorter recovery time, mortality benefit. FDA EUA 2020 → full approval 2022 hospitalized COVID. Maximum success AI-driven repurposing example. BenevolentAI (founded 2013 London, IPO 2022 Amsterdam) AI drug discovery + repurposing knowledge graph platform. Concurrent: Healx (rare disease repurposing), Lantern Pharma (oncology), Cures Within Reach (charitable repurposing). Field 2024 mature: COVID lessons sustained — AI repurposing ongoing platforms decade horizon.'
          en: 'Drug repurposing AI (BenevolentAI February 2020 Lancet Infectious Diseases Stebbing/Richardson 2020): AI knowledge graph mining biomedical literature/databases identified baricitinib (JAK1/JAK2 inhibitor, FDA approved 2018 for rheumatoid arthritis Olumiant Eli Lilly/Incyte) as repurposed COVID-19 therapy. Mechanism: predicted dual action — anti-inflammatory (JAK-STAT inhibition reduces cytokine storm) + putative antiviral (AAK1/GAK kinase inhibition → blocks clathrin-mediated SARS-CoV-2 endocytosis at ACE2 receptor). Published 4 February 2020 — early pandemic. Subsequent: NIH-NIAID ACTT-2 trial 2020 (Kalil NEJM 2021) baricitinib + remdesivir vs remdesivir alone in hospitalized COVID — 1-day shorter recovery time, mortality benefit. FDA EUA 2020 → full approval 2022 for hospitalized COVID. Maximum success AI-driven repurposing example. BenevolentAI (founded 2013 London, IPO 2022 Amsterdam) AI drug discovery + repurposing knowledge graph platform. Concurrent: Healx (rare disease repurposing), Lantern Pharma (oncology), Cures Within Reach (charitable repurposing). Field 2024 mature: COVID lessons sustained — AI repurposing ongoing platforms decade horizon.'
        objectives: [BenevolentAI baricitinib]
      - type: choice
        difficulty: 5
        question:
          pt: ML target identification (Open Targets, Mantra Bio Connectivity Map) é…
          en: ML target identification (Open Targets, Mantra Bio Connectivity Map) is…
        choices:
          - Integrative platforms combining genetics, expression, perturbation data, literature for prioritizing therapeutic targets, with Open Targets EBI/EMBL ranking and Connectivity Map Broad CMap2 connectivity scoring
          - Pure literature search without integration
          - Single data source without multi-modal integration
          - Random target selection without computational support
        correctAnswer: Integrative platforms combining genetics, expression, perturbation data, literature for prioritizing therapeutic targets, with Open Targets EBI/EMBL ranking and Connectivity Map Broad CMap2 connectivity scoring
        rationale:
          pt: 'ML target identification platforms: Open Targets (Maria Martin EBI/EMBL Cambridge 2014+ Sanger/EMBL/GSK partnership) — integrative platform combining genetic associations (GWAS, ExWAS, mendelian randomization), expression data (GTEx, FANTOM5, Human Protein Atlas), perturbation effects (Project Score CRISPR essentiality DepMap, Open Targets Genetics Portal), literature mining, drug-target interactions (DGIdb, ChEMBL) → composite "target tractability score" (genetic linkage + biological plausibility + chemistry tractability + safety profile). Open access ~30000 targets curated. Connectivity Map (CMap2.0, Lamb 2006 Science → CLUE Broad cmap.io 2017+ Subramanian Cell): >1.5M perturbed transcriptomic profiles (drugs, gene knockouts, overexpression) → query disease signature → identify drugs reverse signature (mimicking knockdown) ou worsen (mimicking activation). Successful applications: identify HDAC inhibitors EWS-FLI1 oncogene Ewing sarcoma. Concurrent: DepMap (Cancer Dependency Map, Broad Achilles + Sanger Score) ~1500 cancer cell lines genome-wide CRISPR screens — gene essentiality landscape mutations. PrimeKG, BIOSNAP knowledge graphs. AlphaMissense + ESM-1v variant prioritization. Field 2024 mature: ~$2-3B/year pharma investment computational target ID + prioritization across major companies.'
          en: 'ML target identification platforms: Open Targets (Maria Martin EBI/EMBL Cambridge 2014+ Sanger/EMBL/GSK partnership) — integrative platform combining genetic associations (GWAS, ExWAS, mendelian randomization), expression data (GTEx, FANTOM5, Human Protein Atlas), perturbation effects (Project Score CRISPR essentiality DepMap, Open Targets Genetics Portal), literature mining, drug-target interactions (DGIdb, ChEMBL) → composite "target tractability score" (genetic linkage + biological plausibility + chemistry tractability + safety profile). Open access ~30000 targets curated. Connectivity Map (CMap2.0, Lamb 2006 Science → CLUE Broad cmap.io 2017+ Subramanian Cell): >1.5M perturbed transcriptomic profiles (drugs, gene knockouts, overexpression) → query disease signature → identify drugs that reverse signature (mimicking knockdown) or worsen (mimicking activation). Successful applications: identify HDAC inhibitors for EWS-FLI1 oncogene in Ewing sarcoma. Concurrent: DepMap (Cancer Dependency Map, Broad Achilles + Sanger Score) ~1500 cancer cell lines genome-wide CRISPR screens — gene essentiality landscape across mutations. PrimeKG, BIOSNAP knowledge graphs. AlphaMissense + ESM-1v variant prioritization. Field 2024 mature: ~$2-3B/year pharma investment in computational target ID + prioritization across major companies.'
