        correctAnswer: LLM agents (e.g., ChemCrow Bran/Schwaller 2024, BioGPT, BioMistral, Ginkgo Atlas) calling specialized tools (BLAST, AlphaFold, retrosynthesis, lab automation) for autonomous experimental planning + interpretation
        rationale:
          pt: 'Foundation models + agentic AI biology research: large language models (LLMs) extended with tool-use capabilities → autonomous research agents. Examples: ChemCrow (Bran Cox Schilter Baldassari White Schwaller EPFL Nat Mach Intell 2024) — GPT-4 + 17 expert tools (retrosynthesis IBM RXN, molecular property prediction, web search, Python REPL) → autonomous chemistry tasks: synthesize DEET, novel chromophore, organocatalysts. Coscientist (Boiko Buryan Stanford Nat 2023) — closed-loop drug discovery: design → synthesize → test cycles via robotic automation + LLM planning. Concurrent: BioGPT (Microsoft 2022 PubMed-trained LLM medical), BioMistral (Apliacode 2024 medical-tuned Mistral 7B), MedPaLM2 Google (USMLE pass 2023), AdaMed academic Stanford. Ginkgo Bioworks Atlas 2024 LLM + lab automation API. Vision: AI scientists → autonomous hypothesis generation, experimental design, interpretation. Realität 2024 still bottlenecked by experimental validation, robotics integration limits. Concurrent multimodal: AlphaFlow Schaffer/Davies/Hsu 2024 robotic drug-target discovery, Polaris (BMS 2024 closed-loop optimization). Field 2024+ rapidly evolving — AI scientists prototype demonstrations promising broader 5-10 year horizon to widespread autonomous discovery. Anthropic Claude Opus 4 Sonnet 4 demonstrate strong scientific reasoning capabilities 2024+ adopted research workflows.'
