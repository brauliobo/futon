        correctAnswer: Transformer foundation model pretrained on ~30M single-cell transcriptomes (GenCorpus) using rank-value encoding, fine-tunable for cell-type prediction, perturbation effects, drug discovery
        rationale:
          pt: 'Geneformer (Theodoris Xiao Chopra Chaffin Sanchez Aldubayan Mahmood Zhang Cai Sabeti Ellinor MGH/Broad/Mass General Brigham Nat 2023): transformer-based foundation model single-cell transcriptomics. Pretrained ~30M scRNA-seq cells (GenCorpus, multi-tissue/disease/condition) — masked language model objective. Innovation: rank-value encoding — represents each cell as ranked list expressed genes (no normalization step) → token sequence preserves expression-level information. Architecture: 6-layer transformer ~10M params (Geneformer-12L 2024 expanded). Fine-tuning: cell-type classification (~96% across diverse tissues), drug response prediction, gene regulatory network inference, in silico perturbation (predict knockdown effects on transcriptome). Aplicações: cardiomyocyte hypertrophy treatment screening (validated experimentally), disease modeling Alzheimer/Parkinson, drug target identification. Open weights + code Hugging Face. Concurrent foundation models scRNA: scGPT (Cui Goldenberg Wang Toronto Nat Methods 2024 ~33M cells, generative bigger), Universal Cell Embeddings UCE (Rosen Theodoris UCSF 2024 ~36M cells), CellPLM (Wen 2023). Field 2024 active: foundation models cell biology. Limit: data biases (technology, disease conditions over-represented), interpretability emerging.'
