          pt: 'Enformer (Žiga Avsec Agarwal Visentin Ledsam Grabska-Barwinska Taylor Assael Jumper Kohli Kelley DeepMind/Calico Nat Methods 2021): transformer + dilated CNN model predicts ~5300 tracks tissue-specific signals (CAGE expression, ChIP-seq, ATAC-seq, RNA-seq) from ~196kb DNA sequence input (~200kb context window — major advance over Basenji ~40kb predecessor). Architecture: dilated CNNs for local features + transformer for long-range interactions enhancer-promoter ~100kb scale. Trained on ENCODE + Roadmap Epigenomics human + mouse tracks. Captures: enhancer effects, splicing prediction, regulatory variants (rare/common GTEx/UK Biobank). Aplicações: GWAS variant interpretation (predict tissue expression effect), CRISPR-Cas9 sgRNA off-target prediction (gene context), promoter/enhancer engineering. Concurrent: Sei (Chen Zhao Troyanskaya Nat Genet 2022 chromatin variant effect), DeepSEA Troyanskaya 2015 founder, Borzoi (Avsec Kelley 2024 successor +seed prediction RNA-seq exon-resolution polyA-related metrics). Limit: generalization across populations, rare variant performance. David Kelley (Calico Aging research, ex-Genentech) + Žiga Avsec — pioneers DL genomics. Field 2024+ Borzoi expanded foundation model generic DNA-to-cellular-output prediction.'
