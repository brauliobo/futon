        difficulty: 5
        question:
          pt: AI/ML drug discovery limitations 2024 are…
          en: AI/ML drug discovery limitations 2024 are…
        choices:
          - High-quality biological training data scarcity, generalization beyond training distribution, interpretability challenges, replication crisis in some published ML benchmarks
          - No limitations — AI solved drug discovery
          - Pure regulatory issues with no scientific limitations
          - Insufficient compute resources only
        correctAnswer: High-quality biological training data scarcity, generalization beyond training distribution, interpretability challenges, replication crisis in some published ML benchmarks
        rationale:
          pt: 'AI/ML drug discovery limitations 2024: (1) Data quality/scarcity — biology heterogeneous (cell lines, donor variation, technical), high-quality labeled training data limited (~10⁵-10⁶ scale typical, vs LLM ~10¹³). Public databases (PDB, UniProt, ChEMBL) saturate quickly. (2) Generalization — models perform well on training-similar distributions but fail novel chemistries, untargeted protein families, exotic biology. (3) Interpretability — black-box models challenge for regulatory submission FDA, mechanism-of-action understanding, side-effect prediction. (4) Replication crisis — Buttenschön/Morris PoseBusters 2023 highlighted physical realism failure widely-used docking models, similar concerns AI virtual screening replication. (5) Translation gap — preclinical AI predictions vs human biology different (~90% drug failures clinical despite preclinical "success"). (6) ML hype vs delivery — limited successful FDA approvals AI-discovered drugs 2024 (Insilico ISM001-055 still Phase 2, Exscientia DSP-1181 OCD failed efficacy 2022). (7) Reproducibility — many ML papers irreproducible (code/weights unavailable). Field corrections 2024+: open-source movement (Boltz-1, OpenFold, ESM3-open), benchmarking frameworks (PoseBusters, MolFormer, CIRCLE), ML reporting standards. Realism vs hype balanced perspective increasingly emerging — AI augments rather than replaces traditional discovery pipelines mid-2024.'
          en: 'AI/ML drug discovery limitations 2024: (1) Data quality/scarcity — biology is heterogeneous (cell lines, donor variation, technical), high-quality labeled training data limited (~10⁵-10⁶ scale typical, vs LLM ~10¹³). Public databases (PDB, UniProt, ChEMBL) saturate quickly. (2) Generalization — models perform well on training-similar distributions but fail on novel chemistries, untargeted protein families, exotic biology. (3) Interpretability — black-box models challenge regulatory submissions to FDA, mechanism-of-action understanding, side-effect prediction. (4) Replication crisis — Buttenschön/Morris PoseBusters 2023 highlighted physical realism failure of widely-used docking models, similar concerns about AI virtual screening replication. (5) Translation gap — preclinical AI predictions vs human biology differ (~90% drug failures in clinical despite preclinical "success"). (6) ML hype vs delivery — limited successful FDA approvals of AI-discovered drugs 2024 (Insilico ISM001-055 still Phase 2, Exscientia DSP-1181 OCD failed efficacy 2022). (7) Reproducibility — many ML papers irreproducible (code/weights unavailable). Field corrections 2024+: open-source movement (Boltz-1, OpenFold, ESM3-open), benchmarking frameworks (PoseBusters, MolFormer, CIRCLE), ML reporting standards. Realism vs hype balanced perspective increasingly emerging — AI augments rather than replaces traditional discovery pipelines mid-2024.'
