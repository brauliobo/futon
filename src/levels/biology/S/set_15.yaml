        rationale:
          pt: 'AI antibody design 2023-2024: generative models design CDR (complementarity determining regions) sequences or full antibodies. Generate Biomedicines (Flagship Pioneering Cambridge MA, founded 2018, Chroma model 2023): therapeutic antibodies platform. Absci (Vancouver WA, IPO 2021): zero-shot HER2 antibody design Nat Biotech setembro 2023 — generative ML proposed CDR sequences experimentally validated nanomolar HER2 binders sem prior knowledge HER2 antibodies. Concurrent: Xaira Therapeutics ($1B Foresite 2024), BigHat Biosciences, Profluent, Endeavor Bio. Approaches: (1) Sequence-only language models (ProGen2 antibody-tuned, IgLM, AntiBERTa), (2) Structure-based generative (Chroma, RFdiffusion-Ab Bennett Baker IPD 2024 bioRxiv), (3) Antibody-antigen joint structure prediction (AlphaFold-Multimer, Boltz-1 antibody mode). Workflow integration: AI predicts CDR sequences → expression yeast/mammalian → SPR/BLI affinity → developability assays (aggregation, immunogenicity, PK) → clinical leads. Validation: ~1000-100x faster vs traditional discovery campaigns. Pipeline drugs: Generate GB-9001 first generative antibody Phase 1 trial 2024+ (gut-restricted antibody chronic conditions). Field exploded post-AlphaFold + ESM3 + Chroma 2023+. Limit: developability profiles, manufacturing, real-world efficacy untested broadly. Decade horizon AI-discovered therapeutic antibodies.'
