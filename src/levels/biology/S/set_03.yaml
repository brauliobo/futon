title:
  pt: Ômicas de Célula Única e Espaciais
  en: Single-Cell and Spatial Omics
level: S
subject: biology
objectives:
  - Compreender 10x Genomics, Drop-seq, SMART-seq2
  - Reconhecer Visium, Slide-seq, MERFISH
  - Identificar Human Cell Atlas, Tabula Sapiens
  - Avaliar multi-omics integration
difficulty: 5
authorNotes: |
  Single-cell era post-2017. Drop-seq (Macosko 2015 Cell), 10x Chromium (2017). HCA Human
  Cell Atlas (Regev/Teichmann 2017). Visium (10x), Slide-seq (Chen/Macosko), MERFISH (Zhuang
  Harvard), seqFISH+ (Cai Caltech), GeoMx Nanostring, CosMx, Xenium, Tabula Muris/Sapiens.
example:
  question:
    pt: 10x Genomics Chromium (2017 commercial launch) e Drop-seq (Macosko Cell 2015) revolucionaram single-cell biology via…
    en: 10x Genomics Chromium (2017 commercial launch) and Drop-seq (Macosko Cell 2015) revolutionized single-cell biology via…
  choices:
    - Microfluidic droplet-based barcoding enabling parallel single-cell RNA-seq at thousands-to-millions cells per experiment
    - Bulk RNA-seq with computational deconvolution as the only practical scaling strategy
    - Manual single-cell pipetting with 96-well plates as the dominant high-throughput pipeline
    - Whole-tissue homogenization without cellular resolution remaining the field standard
  correctAnswer: Microfluidic droplet-based barcoding enabling parallel single-cell RNA-seq at thousands-to-millions cells per experiment
  rationale:
    pt: 'Drop-seq (Macosko/McCarroll Harvard Cell 2015): microfluidic device co-encapsula cells + barcoded beads em droplets → cell-specific cDNA library → bulk sequencing → demultiplex via cell barcodes. 10x Genomics Chromium (commercial 2017): turnkey platform GEM (Gel-bead in Emulsion). Inflection point — antes Smart-seq2 (~96-cells/well 2014), Fluidigm C1 chip (~96 cells), CEL-seq. Pós-Drop-seq: thousands-millions cells routine. Concurrent: BD Rhapsody, ParseBio combinatorial split-pool, Honeycomb Biotechnologies. HCA scaled. Cost ~$1/cell 2024 (down from ~$0.50/cell 10x). Standard data formats (Cell Ranger output, Seurat, Scanpy AnnData).'
    en: 'Drop-seq (Macosko/McCarroll Harvard Cell 2015): microfluidic device co-encapsulates cells + barcoded beads in droplets → cell-specific cDNA library → bulk sequencing → demultiplex via cell barcodes. 10x Genomics Chromium (commercial 2017): turnkey GEM (Gel-bead in Emulsion) platform. Inflection point — before that Smart-seq2 (~96-cells/well 2014), Fluidigm C1 chip (~96 cells), CEL-seq. After Drop-seq: thousands to millions of cells routine. Concurrent: BD Rhapsody, ParseBio combinatorial split-pool, Honeycomb Biotechnologies. HCA scaled. Cost ~$1/cell 2024 (down from ~$0.50/cell 10x). Standard data formats (Cell Ranger output, Seurat, Scanpy AnnData).'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — scRNA + Atlases
      en: Page 1 — scRNA + Atlases
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em scRNA-seq UMAP + Leiden clustering pipeline standard, principal output é…
          en: In standard scRNA-seq UMAP + Leiden clustering pipeline, the main output is…
        choices:
          - 2D embedding visualizing cell-type clusters with marker-gene-defined identities; basis for differential expression and trajectory analysis
          - Single chromatographic peak quantifying total transcript abundance per sample
          - Manual gating contour plots equivalent to traditional flow cytometry analysis
          - Bulk expression averages without cell-resolution information for downstream analysis
        correctAnswer: 2D embedding visualizing cell-type clusters with marker-gene-defined identities; basis for differential expression and trajectory analysis
        rationale:
          pt: 'scRNA-seq pipeline: QC (mitochondrial %, doublets), normalization (SCT/lognormalize), HVG (highly variable genes), PCA dimensionality reduction, neighborhood graph (kNN), Leiden/Louvain community detection clustering, UMAP/t-SNE embedding visualization, marker genes via Wilcoxon. Tools: Seurat (Satija NYGC R), Scanpy (Wolf Theis Munich Python), Bioconductor SingleCellExperiment. UMAP (McInnes 2018) substitui t-SNE largely. Cell type annotation: manual marker gene + automated reference (CellTypist Teichmann, ScType, Azimuth). Trajectory inference: Monocle3, Slingshot, RNA velocity (La Manno scVelo). Doublet detection: Scrublet, DoubletFinder. Field standardization mature.'
          en: 'scRNA-seq pipeline: QC (mitochondrial %, doublets), normalization (SCT/lognormalize), HVG (highly variable genes), PCA dimensionality reduction, neighborhood graph (kNN), Leiden/Louvain community detection clustering, UMAP/t-SNE embedding visualization, marker genes via Wilcoxon. Tools: Seurat (Satija NYGC R), Scanpy (Wolf Theis Munich Python), Bioconductor SingleCellExperiment. UMAP (McInnes 2018) largely replaces t-SNE. Cell type annotation: manual marker gene + automated reference (CellTypist Teichmann, ScType, Azimuth). Trajectory inference: Monocle3, Slingshot, RNA velocity (La Manno scVelo). Doublet detection: Scrublet, DoubletFinder. Field standardization mature.'
        objectives: [scRNA-seq pipeline]
      - type: choice
        difficulty: 5
        question:
          pt: Human Cell Atlas (HCA, Regev/Teichmann launched 2017) goal é…
          en: Human Cell Atlas (HCA, Regev/Teichmann launched 2017) goal is…
        choices:
          - Comprehensive reference of every human cell type with molecular profiles via single-cell genomics; ~50M+ cells profiled by 2024 across multiple consortia
          - Sequencing every individual human genome on Earth as the primary deliverable
          - Cataloging only blood and bone-marrow cell types from healthy donors
          - Single-investigator project limited to one tissue type per laboratory
        correctAnswer: Comprehensive reference of every human cell type with molecular profiles via single-cell genomics; ~50M+ cells profiled by 2024 across multiple consortia
        rationale:
          pt: 'Human Cell Atlas (HCA): launched 2017 Aviv Regev (Broad → Genentech) + Sarah Teichmann (Sanger). Mission: reference map every human cell type, location, stage, function. Multi-tissue, multi-organ. CZ Biohub (Chan Zuckerberg) major funder. Tabula Muris 2018 (Quake Stanford) mouse precursor; Tabula Sapiens 2022 Science (~500k cells, 24 tissues). HuBMAP NIH parallel atlas (Human BioMolecular Atlas Program). LungMAP, KPMP kidney atlas, Allen Brain Atlas. Open data CZ CELLxGENE platform. Foundation for personalized medicine, drug targets, disease models. ~50M+ cells profiled aggregate.'
          en: 'Human Cell Atlas (HCA): launched 2017 Aviv Regev (Broad → Genentech) + Sarah Teichmann (Sanger). Mission: reference map of every human cell type, location, stage, function. Multi-tissue, multi-organ. CZ Biohub (Chan Zuckerberg) major funder. Tabula Muris 2018 (Quake Stanford) mouse precursor; Tabula Sapiens 2022 Science (~500k cells, 24 tissues). HuBMAP NIH parallel atlas (Human BioMolecular Atlas Program). LungMAP, KPMP kidney atlas, Allen Brain Atlas. Open data CZ CELLxGENE platform. Foundation for personalized medicine, drug targets, disease models. ~50M+ cells profiled aggregate.'
        objectives: [Human Cell Atlas]
      - type: choice
        difficulty: 5
        question:
          pt: Em scATAC-seq (Buenrostro/Greenleaf 2015), measures…
          en: In scATAC-seq (Buenrostro/Greenleaf 2015), measures…
        choices:
          - Single-cell chromatin accessibility via Tn5 transposase tagmentation of open chromatin; identifies regulatory elements and TF activity
          - Single-cell DNA sequence variation across the entire diploid genome with base-pair precision
          - Three-dimensional chromosome conformation in living cells using Hi-C in single cells
          - Cell-surface protein abundance quantified by mass cytometry alone
        correctAnswer: Single-cell chromatin accessibility via Tn5 transposase tagmentation of open chromatin; identifies regulatory elements and TF activity
        rationale:
          pt: 'scATAC-seq (single-cell Assay for Transposase-Accessible Chromatin sequencing): Buenrostro/Greenleaf Stanford 2015 Nature. Tn5 transposase preferentially insert sequencing adapters em open chromatin → reads cluster around regulatory elements. 10x Multiome 2020 simultaneous scRNA + scATAC same cell. Output: peak-cell matrix, motif enrichment (chromVAR), TF activity scores, cis-regulatory elements. Trajectories chromatin dynamics. Comparison: scRNA (transcriptome) vs scATAC (accessibility) vs CITE-seq (proteins) vs Perturb-seq/CROP-seq (CRISPR). Multi-omics integration challenging — Seurat WNN, Scanpy/scvi-tools. Buenrostro lab major contributor.'
          en: 'scATAC-seq (single-cell Assay for Transposase-Accessible Chromatin sequencing): Buenrostro/Greenleaf Stanford 2015 Nature. Tn5 transposase preferentially inserts sequencing adapters in open chromatin → reads cluster around regulatory elements. 10x Multiome 2020 simultaneous scRNA + scATAC same cell. Output: peak-cell matrix, motif enrichment (chromVAR), TF activity scores, cis-regulatory elements. Trajectories chromatin dynamics. Comparison: scRNA (transcriptome) vs scATAC (accessibility) vs CITE-seq (proteins) vs Perturb-seq/CROP-seq (CRISPR). Multi-omics integration challenging — Seurat WNN, Scanpy/scvi-tools. Buenrostro lab major contributor.'
        objectives: [scATAC-seq]
      - type: choice
        difficulty: 5
        question:
          pt: CITE-seq (Stoeckius/Smibert 2017 Nat Methods) combines…
          en: CITE-seq (Stoeckius/Smibert 2017 Nat Methods) combines…
        choices:
          - Single-cell RNA-seq with antibody-derived tag (ADT) sequencing for surface protein quantification in same cell; multimodal phenotyping
          - Single-cell DNA mutation calling with simultaneous histone modification ChIP-seq
          - Spatial imaging combined with bulk metabolomics from adjacent tissue sections
          - Two separate platforms processed in parallel without combined cell-level readouts
        correctAnswer: Single-cell RNA-seq with antibody-derived tag (ADT) sequencing for surface protein quantification in same cell; multimodal phenotyping
        rationale:
          pt: 'CITE-seq (Cellular Indexing of Transcriptomes and Epitopes by sequencing): Stoeckius/Smibert NYGC 2017 Nat Methods. Conjugated antibodies + DNA barcodes (Antibody-Derived Tags ADT) → simultaneous transcriptome + ~150-300 surface proteins same cell. BD AbSeq Rhapsody, BioLegend TotalSeq panels. Aplicações: immunology profiling (T cells, myeloid), cancer immunotherapy biomarkers. Concurrent: REAP-seq (Peterson 2017). Hashtag oligos (HTO) sample multiplexing same protocol. Limit: ~hundreds proteins (vs flow ~30, mass cytometry CyTOF ~50, spatial proteomics ~100+). Multi-modal richer phenotyping than transcriptome alone. PBMC standard reference Hao Satija 2021 Cell Azimuth.'
          en: 'CITE-seq (Cellular Indexing of Transcriptomes and Epitopes by sequencing): Stoeckius/Smibert NYGC 2017 Nat Methods. Conjugated antibodies + DNA barcodes (Antibody-Derived Tags ADT) → simultaneous transcriptome + ~150-300 surface proteins in same cell. BD AbSeq Rhapsody, BioLegend TotalSeq panels. Applications: immunology profiling (T cells, myeloid), cancer immunotherapy biomarkers. Concurrent: REAP-seq (Peterson 2017). Hashtag oligos (HTO) sample multiplexing same protocol. Limit: ~hundreds of proteins (vs flow ~30, mass cytometry CyTOF ~50, spatial proteomics ~100+). Multimodal richer phenotyping than transcriptome alone. PBMC standard reference Hao Satija 2021 Cell Azimuth.'
        objectives: [CITE-seq]
      - type: choice
        difficulty: 5
        question:
          pt: RNA velocity (La Manno/Linnarsson Nature 2018) infers…
          en: RNA velocity (La Manno/Linnarsson Nature 2018) infers…
        choices:
          - Future cell state direction from spliced vs unspliced transcript ratio per gene; predicts dynamic differentiation trajectories from snapshot data
          - Total cellular RNA mass per nucleus during cell cycle progression
          - Single-cell mutation rates by counting ribosome occupancy at codons
          - Real-time microscopy-derived motility vectors of migrating cells
        correctAnswer: Future cell state direction from spliced vs unspliced transcript ratio per gene; predicts dynamic differentiation trajectories from snapshot data
        rationale:
          pt: 'RNA velocity (La Manno/Linnarsson Karolinska 2018 Nature): premise — for each gene, ratio of unspliced (intronic) vs spliced (exonic) transcripts indicates current dynamics — high unspliced = transcription up, gene "becoming". Aggregate across genes → predicted velocity vector future cell state em phase space. Original velocyto (Linnarsson). scVelo (Bergen Theis Munich 2020) modern Python. Trajectory inference snapshot data — pseudotime alternative. Limitations: assumptions kinetic homogeneity, technical noise. Caveat: dynamics interpretation careful em mature cells/non-developmental contexts. Useful: developmental atlases, perturbation responses, malignancy progression. CellRank (Lange 2022) extends.'
          en: 'RNA velocity (La Manno/Linnarsson Karolinska 2018 Nature): premise — for each gene, ratio of unspliced (intronic) vs spliced (exonic) transcripts indicates current dynamics — high unspliced = transcription up, gene "becoming". Aggregate across genes → predicted velocity vector for future cell state in phase space. Original velocyto (Linnarsson). scVelo (Bergen Theis Munich 2020) modern Python. Trajectory inference from snapshot data — pseudotime alternative. Limitations: kinetic homogeneity assumptions, technical noise. Caveat: careful dynamics interpretation in mature cells/non-developmental contexts. Useful: developmental atlases, perturbation responses, malignancy progression. CellRank (Lange 2022) extends.'
        objectives: [RNA velocity]
      - type: choice
        difficulty: 5
        question:
          pt: Em Perturb-seq (Adamson/Norman/Weissman/Jaitin 2016 Cell) e CROP-seq (Datlinger 2017), platforms permitem…
          en: In Perturb-seq (Adamson/Norman/Weissman/Jaitin 2016 Cell) and CROP-seq (Datlinger 2017), platforms enable…
        choices:
          - Pooled CRISPR perturbations + single-cell RNA-seq readout — measure transcriptional consequences of thousands of genetic perturbations in parallel
          - Bulk-only CRISPR screens with no single-cell resolution
          - Microscopy-based perturbation screens limited to 96-well plate throughput
          - Single-perturbation studies one gene at a time without pooling
        correctAnswer: Pooled CRISPR perturbations + single-cell RNA-seq readout — measure transcriptional consequences of thousands of genetic perturbations in parallel
        rationale:
          pt: 'Perturb-seq (Adamson, Norman, Weissman, Jonathan Weissman Whitehead/UCSF 2016 Cell) + CROP-seq (Datlinger CeMM Vienna 2017 Nat Methods) + CRISP-seq (Jaitin Weizmann): pooled CRISPR perturbation library (sgRNAs each cell) + scRNA-seq → guide identity + transcriptome same cell → infer transcriptional regulatory networks. Genome-scale Perturb-seq ~1.5M cells (Replogle/Weissman 2022 Cell). Aplicações: drug target discovery, disease gene function, regulatory networks. Concurrent: Cell Hashing multiplexing, Optical pooled screens (in situ sequencing-based, Feldman/Blainey 2019 Cell). Aging Perturb-seq, immune Perturb-seq various focus. Field high-throughput functional genomics.'
          en: 'Perturb-seq (Adamson, Norman, Weissman, Jonathan Weissman Whitehead/UCSF 2016 Cell) + CROP-seq (Datlinger CeMM Vienna 2017 Nat Methods) + CRISP-seq (Jaitin Weizmann): pooled CRISPR perturbation library (sgRNAs in each cell) + scRNA-seq → guide identity + transcriptome same cell → infer transcriptional regulatory networks. Genome-scale Perturb-seq ~1.5M cells (Replogle/Weissman 2022 Cell). Applications: drug-target discovery, disease gene function, regulatory networks. Concurrent: Cell Hashing multiplexing, Optical pooled screens (in situ sequencing-based, Feldman/Blainey 2019 Cell). Aging Perturb-seq, immune Perturb-seq various focus. High-throughput functional genomics field.'
        objectives: [Perturb-seq]
      - type: choice
        difficulty: 5
        question:
          pt: Allen Brain Atlas Cell Types (Lein/Tasic 2016+) demonstrated…
          en: Allen Brain Atlas Cell Types (Lein/Tasic 2016+) demonstrated…
        choices:
          - Mouse + human cortical taxonomies via scRNA-seq → ~120-150 transcriptomic cell types in cortex; Patch-seq combining electrophysiology + scRNA + morphology
          - Single homogeneous neuronal type populating the entire cerebral cortex uniformly
          - Manual immunohistochemistry catalog without single-cell genomic data
          - Computational predictions of cortical anatomy without experimental verification
        correctAnswer: Mouse + human cortical taxonomies via scRNA-seq → ~120-150 transcriptomic cell types in cortex; Patch-seq combining electrophysiology + scRNA + morphology
        rationale:
          pt: 'Allen Institute (Paul Allen Microsoft co-founder funded 2003): Brain Atlas. Cell Types: Lein/Tasic/Zeng 2016+ Nature scRNA-seq taxonomies mouse cortex → ~120 cell types. Tasic/Yao 2018 + Yao/Liu/Tasic 2021 Nature: cell type taxonomy mouse cortex granular. Bakken/Hodge/Tasic 2021 Nature: human cortex equivalent. Patch-seq: simultaneous patch-clamp electrophysiology + scRNA + biocytin morphology — multi-modal. Allen Brain Map open data. BICCN (BRAIN Initiative Cell Census Network) 2017+. Brain Cell Census 2023 Nature special issue Network. Whole brain single-cell atlas era. Foundational neuroscience reference.'
          en: 'Allen Institute (Paul Allen Microsoft co-founder funded 2003): Brain Atlas. Cell Types: Lein/Tasic/Zeng 2016+ Nature scRNA-seq taxonomies mouse cortex → ~120 cell types. Tasic/Yao 2018 + Yao/Liu/Tasic 2021 Nature: granular mouse cortex cell type taxonomy. Bakken/Hodge/Tasic 2021 Nature: equivalent human cortex. Patch-seq: simultaneous patch-clamp electrophysiology + scRNA + biocytin morphology — multimodal. Allen Brain Map open data. BICCN (BRAIN Initiative Cell Census Network) 2017+. Brain Cell Census 2023 Nature special issue Network. Whole-brain single-cell atlas era. Foundational neuroscience reference.'
        objectives: [Allen Brain Atlas]
      - type: choice
        difficulty: 5
        question:
          pt: Em cancer single-cell, tumor heterogeneity insights revealed pelos scRNA-seq studies include…
          en: In cancer single-cell, scRNA-seq studies have revealed tumor heterogeneity insights including…
        choices:
          - Distinct intratumoral subpopulations (cancer stem cells, EMT cells, drug-tolerant persister), tumor microenvironment composition, treatment-response stratification
          - Universal tumor homogeneity rendering single-cell analysis unnecessary
          - Identical transcriptional profiles between primary tumor and all metastases
          - Cancer cells indistinguishable from normal stromal cells at the transcriptome level
        correctAnswer: Distinct intratumoral subpopulations (cancer stem cells, EMT cells, drug-tolerant persister), tumor microenvironment composition, treatment-response stratification
        rationale:
          pt: 'Cancer scRNA-seq insights: ITH (intratumoral heterogeneity) — distinct subpopulations within same tumor (Patel/Tirosh/Bernstein/Suvà melanoma Cell 2014/2016; glioblastoma Suvà/Regev 2014). EMT (epithelial-mesenchymal transition) cells. Drug-tolerant persister (DTP) cells (Sharma/Settleman 2010 + scRNA characterization). Cancer stem cells. TME (tumor microenvironment): T-cell exhaustion gradient (Wang 2018), TAM (tumor-associated macrophages), CAF (cancer-associated fibroblasts). Treatment response: pre/post immunotherapy biopsies (Sade-Feldman/Hacohen 2018 Cell, Yost/Chang 2019 Nat Med). Spatial scRNA contextualizes. Aplicações biomarkers, target discovery, mechanism resistance.'
          en: 'Cancer scRNA-seq insights: ITH (intratumoral heterogeneity) — distinct subpopulations within same tumor (Patel/Tirosh/Bernstein/Suvà melanoma Cell 2014/2016; glioblastoma Suvà/Regev 2014). EMT (epithelial-mesenchymal transition) cells. Drug-tolerant persister (DTP) cells (Sharma/Settleman 2010 + scRNA characterization). Cancer stem cells. TME (tumor microenvironment): T-cell exhaustion gradient (Wang 2018), TAM (tumor-associated macrophages), CAF (cancer-associated fibroblasts). Treatment response: pre/post immunotherapy biopsies (Sade-Feldman/Hacohen 2018 Cell, Yost/Chang 2019 Nat Med). Spatial scRNA contextualizes. Applications biomarkers, target discovery, mechanism of resistance.'
        objectives: [Cancer scRNA]
      - type: choice
        difficulty: 5
        question:
          pt: Em immune scRNA, T-cell exhaustion gene signatures (PDCD1, TOX, EOMES, etc.) characterized…
          en: In immune scRNA, T-cell exhaustion gene signatures (PDCD1, TOX, EOMES, etc.) characterize…
        choices:
          - Progressive transcriptional state in chronic antigen exposure (cancer, chronic viral) with reduced effector function and altered metabolism
          - Acutely activated naïve T-cells transitioning to memory phenotype
          - Senescent T-cells terminally exiting the repertoire after telomere attrition
          - Regulatory T-cells (Tregs) suppressing effector responses
        correctAnswer: Progressive transcriptional state in chronic antigen exposure (cancer, chronic viral) with reduced effector function and altered metabolism
        rationale:
          pt: 'T-cell exhaustion: progressive dysfunction chronic antigen exposure (LCMV chronic, HIV, HBV, cancer). Markers: PD-1/PDCD1, LAG3, TIM3, TIGIT, CD39, TOX (Khan/Wherry 2019 Nature lineage TF), EOMES, NR4A. Stem-like exhausted (TCF1+, Tex precursor) → terminally exhausted (TCF1- Tex). scRNA reveals progression continuum. Therapeutic: anti-PD-1/L1 (Tex precursor → expand), TGFβ blockade, IL-2 derivatives (NKTR-214 fired), TCR-engineered + base editing PD-1 KO. Wherry (Penn) field founder. Pretreatment Tex burden predicts checkpoint response. Companies: Lyell, Tmunity, Carisma. CAR-T exhaustion mitigation engineering target.'
          en: 'T-cell exhaustion: progressive dysfunction in chronic antigen exposure (chronic LCMV, HIV, HBV, cancer). Markers: PD-1/PDCD1, LAG3, TIM3, TIGIT, CD39, TOX (Khan/Wherry 2019 Nature lineage TF), EOMES, NR4A. Stem-like exhausted (TCF1+, Tex precursor) → terminally exhausted (TCF1- Tex). scRNA reveals progression continuum. Therapeutic: anti-PD-1/L1 (Tex precursor → expand), TGFβ blockade, IL-2 derivatives (NKTR-214 failed), TCR-engineered + base editing PD-1 KO. Wherry (Penn) field founder. Pretreatment Tex burden predicts checkpoint response. Companies: Lyell, Tmunity, Carisma. CAR-T exhaustion mitigation engineering target.'
        objectives: [T-cell exhaustion]
      - type: choice
        difficulty: 5
        question:
          pt: Em developmental biology scRNA-seq, gastruloid / embryoid models recent integrate…
          en: In developmental biology scRNA-seq, recent gastruloid / embryoid models integrate…
        choices:
          - In vitro 3D self-organizing pluripotent stem cell aggregates → recapitulate gastrulation; scRNA + lineage tracing reveal axis specification
          - Whole live human embryos cultured beyond 14 days as the standard research material
          - Single-cell sequencing of fixed adult tissues only without developmental context
          - Computational simulations of embryos without any laboratory experimental component
        correctAnswer: In vitro 3D self-organizing pluripotent stem cell aggregates → recapitulate gastrulation; scRNA + lineage tracing reveal axis specification
        rationale:
          pt: 'Gastruloids: 3D aggregates pluripotent stem cells self-organize → recapitulate aspects of gastrulation. Brivanlou (Rockefeller) 2014 micropatterns. Martinez Arias (Cambridge) gastruloids 2014+. Mouse gastruloids (Beccari 2018 Nature) → axis elongation. Human gastruloids (Moris 2020 Nature) ethical 14-day rule respect. Recent: ETXembryo (synthetic mouse embryo Hanna Weizmann/Zernicka-Goetz Cambridge 2022/2023) — TS + ES + induced primitive endoderm assembled. Stembryo controversies. ISSCR 2021 guidelines updated extending 14-day rule case-by-case research review. scRNA + lineage tracing (LARRY, CARLIN, Watermelon etc.) → developmental trajectories.'
          en: 'Gastruloids: 3D aggregates of pluripotent stem cells self-organize → recapitulate aspects of gastrulation. Brivanlou (Rockefeller) 2014 micropatterns. Martinez Arias (Cambridge) gastruloids 2014+. Mouse gastruloids (Beccari 2018 Nature) → axis elongation. Human gastruloids (Moris 2020 Nature) respect ethical 14-day rule. Recent: ETX embryo (synthetic mouse embryo Hanna Weizmann/Zernicka-Goetz Cambridge 2022/2023) — TS + ES + induced primitive endoderm assembled. Stembryo controversies. ISSCR 2021 guidelines updated, extending 14-day rule case-by-case research review. scRNA + lineage tracing (LARRY, CARLIN, Watermelon etc.) → developmental trajectories.'
        objectives: [Gastruloids]
  - title:
      pt: Página 2 — Spatial omics
      en: Page 2 — Spatial omics
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Em spatial transcriptomics, 10x Visium platform (commercial 2019) é based em…
          en: In spatial transcriptomics, the 10x Visium platform (commercial 2019) is based on…
        choices:
          - Capture slide with 55-µm spots containing barcoded oligo-dT for spatially-indexed RNA-seq from tissue sections; ~5000 spots/slide
          - Single-molecule FISH imaging of a few hundred mRNA species per cell
          - Mass spectrometry imaging of metabolites without RNA component
          - In-situ DNA sequencing on fixed embryos at sub-nuclear resolution
        correctAnswer: Capture slide with 55-µm spots containing barcoded oligo-dT for spatially-indexed RNA-seq from tissue sections; ~5000 spots/slide
        rationale:
          pt: 'Spatial transcriptomics ST (Ståhl/Lundeberg KTH/SciLifeLab 2016 Science): capture slide barcoded spots position → poly-A capture mRNA from overlaid tissue → cDNA sequencing → demultiplex spatial. Acquired 10x Genomics 2018 → Visium product 2019. ~55 µm spots, ~5000/slide, ~100 µm spot pitch, ~1-10 cells per spot. Visium HD (2024): 2 µm spots, near single-cell. Concurrent platforms: Slide-seq/SlideSeqV2 (Macosko/Chen 2019/2020 — 10 µm beads), Stereo-seq (BGI 2022 Cell Chen, ~500 nm features), DBiT-seq (Fan/Yale 2020 — microfluidic deterministic barcoding). Spatial omics commercial: NanoString GeoMx, CosMx (~1000 genes). Image-based: MERFISH, seqFISH+. Output: gene expression × spatial location → tissue architecture, cell-cell interactions.'
          en: 'Spatial transcriptomics ST (Ståhl/Lundeberg KTH/SciLifeLab 2016 Science): capture slide barcoded spots position → poly-A capture of mRNA from overlaid tissue → cDNA sequencing → demultiplex spatially. Acquired 10x Genomics 2018 → Visium product 2019. ~55 µm spots, ~5000/slide, ~100 µm spot pitch, ~1-10 cells per spot. Visium HD (2024): 2 µm spots, near single-cell. Concurrent platforms: Slide-seq/SlideSeqV2 (Macosko/Chen 2019/2020 — 10 µm beads), Stereo-seq (BGI 2022 Cell Chen, ~500 nm features), DBiT-seq (Fan/Yale 2020 — microfluidic deterministic barcoding). Commercial spatial omics: NanoString GeoMx, CosMx (~1000 genes). Image-based: MERFISH, seqFISH+. Output: gene expression × spatial location → tissue architecture, cell-cell interactions.'
        objectives: [Visium]
      - type: choice
        difficulty: 5
        question:
          pt: MERFISH (Multiplexed Error-Robust FISH, Zhuang Harvard 2015 Science) e seqFISH+ (Cai Caltech 2019) image-based platforms…
          en: MERFISH (Multiplexed Error-Robust FISH, Zhuang Harvard 2015 Science) and seqFISH+ (Cai Caltech 2019) image-based platforms…
        choices:
          - Use combinatorial barcoded probes + sequential rounds of imaging to detect ~1000-10000 gene transcripts at subcellular resolution
          - Bulk RNA quantification at tissue-section resolution without single-cell readout
          - Single-color FISH for a handful of genes at a time
          - Mass spectrometry imaging without nucleic-acid component
        correctAnswer: Use combinatorial barcoded probes + sequential rounds of imaging to detect ~1000-10000 gene transcripts at subcellular resolution
        rationale:
          pt: 'MERFISH (Multiplexed Error-Robust FISH, Xiaowei Zhuang Harvard 2015 Science): combinatorial barcoding via successive rounds smFISH (single-molecule FISH) + error-correcting code → ~1000-10000 mRNA species single cells, subcellular resolution. seqFISH+ (Cai Caltech 2019 Nature): similar concept ~10k genes 5 rounds 16-color encoding. Vizgen MERSCOPE platform commercial 2021. Subcellular resolution: ~140-200 nm. Throughput: cells × genes × imaging rounds. Tradeoff vs sequencing-based spatial: image-based maior resolution + plex defined panel; sequencing whole-transcriptome unbiased mas spot resolution coarser. CosMx (NanoString) similar imaging. Aplicações: brain atlases (MOp Allen 2021 BICCN MERFISH map), tumor architecture, IBD spatial.'
          en: 'MERFISH (Multiplexed Error-Robust FISH, Xiaowei Zhuang Harvard 2015 Science): combinatorial barcoding via successive smFISH (single-molecule FISH) rounds + error-correcting code → ~1000-10000 mRNA species in single cells at subcellular resolution. seqFISH+ (Cai Caltech 2019 Nature): similar concept ~10k genes 5 rounds 16-color encoding. Vizgen MERSCOPE commercial platform 2021. Subcellular resolution: ~140-200 nm. Throughput: cells × genes × imaging rounds. Tradeoff vs sequencing-based spatial: image-based has higher resolution + defined panel plex; sequencing is whole-transcriptome unbiased but spot resolution coarser. CosMx (NanoString) similar imaging. Applications: brain atlases (MOp Allen 2021 BICCN MERFISH map), tumor architecture, IBD spatial.'
        objectives: [MERFISH]
      - type: choice
        difficulty: 5
        question:
          pt: Em spatial proteomics, CODEX (Akoya, multiplexed antibody imaging) e MIBI-TOF (IonPath, mass spec antibody) detect…
          en: In spatial proteomics, CODEX (Akoya, multiplexed antibody imaging) and MIBI-TOF (IonPath, antibody mass spec) detect…
        choices:
          - 40-60+ proteins per tissue section at subcellular resolution; preserved tissue architecture for cell-cell interaction analysis
          - Bulk plasma proteomics without spatial context
          - Single-protein immunohistochemistry standard pathology workflow
          - DNA copy number variation rather than protein content
        correctAnswer: 40-60+ proteins per tissue section at subcellular resolution; preserved tissue architecture for cell-cell interaction analysis
        rationale:
          pt: 'Spatial proteomics multiplexed: CODEX (Co-Detection by Indexing, Goltsev/Nolan Stanford 2018 Cell, Akoya commercial PhenoCycler-Fusion): DNA-barcoded antibodies + cyclic fluorescence imaging ~40 proteins. MIBI-TOF (Multiplexed Ion Beam Imaging, Bendall/Angelo 2014, IonPath commercial): antibody-conjugated rare-earth metals + secondary ion mass spec ~40 proteins. IMC (Imaging Mass Cytometry, Fluidigm/Standard BioTools, Bodenmiller). Both allow ~50 proteins same tissue, single-cell + spatial context. Aplicações: tumor immune microenvironment (CODEX colorectal Schurch 2020 Cell), atlas, neighborhood analysis (Schürch CRC). Concurrent: Lunaphore COMET. Whole-slide images terabytes. Computational tools: Squidpy, Giotto, BIDcell, REDSEA.'
