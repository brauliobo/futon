          pt: 'Aging research therapeutic translation 2024 é…'
          en: 'Aging research therapeutic translation 2024 is…'
        choices:
          - Senolytics (D+Q, fisetin, navitoclax), partial reprogramming Altos/Retro Bio, GLP-1 agonists obesity/aging, NAD+ NMN/NR, rapamycin/metformin TAME, anti-IL-6 CANTOS, biological age clocks Horvath/GrimAge
