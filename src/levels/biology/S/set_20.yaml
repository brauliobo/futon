        correctAnswer: Convergence (CS+bio+chem+physics), scale (foundation models, atlases), open science, equity, climate intersection, AI augmentation, reproducibility, ethics + safety, accessibility, training pipelines
        rationale:
          pt: 'Cross-cutting biology themes 2024: (1) Convergence — CS+bio+chem+physics+engineering interdisciplinary essential (AlphaFold from DeepMind CS team, generative protein design Baker lab integrates structural biology + ML, CRISPR origin bacteriology → genome editing). (2) Scale — foundation models (ESM3 98B params, Evo 7B params, Geneformer 30M cells), comprehensive atlases (Human Cell Atlas, Allen Brain Atlas, Earth BioGenome 1.8M species, AlphaFold DB 214M structures). (3) Open science — bioRxiv preprints standard, AlphaFold open data + PDB + Galaxy + Nextflow + scanpy + Bioconductor. (4) Equity — diverse cohorts (All of Us 1M, H3Africa, GenomeAsia), Indigenous data sovereignty, mRNA tech transfer South Africa, ancestry-aware PRS. (5) Climate intersection — biology + planetary boundaries, food security feeding 9-10B 2050 photosynthesis-engineered crops, biodiversity 30x30 target. (6) AI augmentation — most biology research adopting ML tools routinely, digital pathology, variant interpretation, drug discovery. (7) Reproducibility crisis emerging concerns — open code/data/protocols, benchmarks, FAIR principles. (8) Ethics + safety — embryo models 14-day rule, germline editing moratorium, AI-bio dual-use, gain-of-function debates, planetary protection. (9) Accessibility — open-source tools democratized, free APIs, citizen science, low-cost sequencing (~$200 WGS 2024+ Illumina/MGI/Element). (10) Training pipelines — interdisciplinary programs (CS+Biology majors, Computational Biology PhDs growing fastest), HHMI Gilliam diversity. Era: biology becomes engineering discipline + computational + integrated systems-thinking + global collaborative + equity-centered.'
          en: 'Cross-cutting biology themes 2024: (1) Convergence — CS+bio+chem+physics+engineering interdisciplinary essential (AlphaFold from DeepMind CS team, generative protein design Baker lab integrates structural biology + ML, CRISPR origin bacteriology → genome editing). (2) Scale — foundation models (ESM3 98B params, Evo 7B params, Geneformer 30M cells), comprehensive atlases (Human Cell Atlas, Allen Brain Atlas, Earth BioGenome 1.8M species, AlphaFold DB 214M structures). (3) Open science — bioRxiv preprints standard, AlphaFold open data + PDB + Galaxy + Nextflow + scanpy + Bioconductor. (4) Equity — diverse cohorts (All of Us 1M, H3Africa, GenomeAsia), Indigenous data sovereignty, mRNA tech transfer to South Africa, ancestry-aware PRS. (5) Climate intersection — biology + planetary boundaries, food security feeding 9-10B by 2050 photosynthesis-engineered crops, biodiversity 30x30 target. (6) AI augmentation — most biology research adopting ML tools routinely, digital pathology, variant interpretation, drug discovery. (7) Reproducibility crisis — emerging concerns about open code/data/protocols, benchmarks, FAIR principles. (8) Ethics + safety — embryo models 14-day rule, germline editing moratorium, AI-bio dual-use, gain-of-function debates, planetary protection. (9) Accessibility — open-source tools democratized, free APIs, citizen science, low-cost sequencing (~$200 WGS 2024+ Illumina/MGI/Element). (10) Training pipelines — interdisciplinary programs (CS+Biology majors, Computational Biology PhDs growing fastest), HHMI Gilliam diversity. Era: biology becomes engineering discipline + computational + integrated systems-thinking + global collaborative + equity-centered.'
