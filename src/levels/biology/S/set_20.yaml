        rationale:
          pt: 'Generative protein design 2023-2024 capabilities — de novo binders (Watson/Baker RFdiffusion 2023, AlphaProteo DeepMind 2024 ~10-90% success rates target proteins), enzymes (Yeh/Baker LuxSit luciferase 2023, Lauko serine hydrolase 2025), antibodies (Generate Chroma + Absci HER2 zero-shot 2023 Nat Biotech), peptides macrocyclic (Vázquez Torres/Baker 2024). Pipeline: RFdiffusion backbone gen → ProteinMPNN sequence design → AlphaFold validation → experimental SPR/yeast display → developability optimization. Therapeutic applications: PD-L1 binders, IL-2 mimetics, virus neutralizers (SARS-CoV-2 spike), de novo nanopore-targeting binders. Companies: Baker IPD spinouts (Cyrus Bio, Profluent, A-Alpha Bio), Generate Biomedicines GB-9001 first generative-AI antibody Phase 1 trial, Xaira Therapeutics ($1B 2024). Field 2024+: clinical-grade designed proteins reality decade horizon.'
          en: 'Generative protein design 2023-2024 capabilities — de novo binders (Watson/Baker RFdiffusion 2023, AlphaProteo DeepMind 2024 ~10-90% success rates per target), enzymes (Yeh/Baker LuxSit luciferase 2023, Lauko serine hydrolase 2025), antibodies (Generate Chroma + Absci HER2 zero-shot 2023 Nat Biotech), macrocyclic peptides (Vázquez Torres/Baker 2024). Pipeline: RFdiffusion backbone gen → ProteinMPNN sequence design → AlphaFold validation → experimental SPR/yeast display → developability optimization. Therapeutic applications: PD-L1 binders, IL-2 mimetics, virus neutralizers (SARS-CoV-2 spike), de novo nanopore-targeting binders. Companies: Baker IPD spinouts (Cyrus Bio, Profluent, A-Alpha Bio), Generate Biomedicines GB-9001 first generative-AI antibody Phase 1 trial, Xaira Therapeutics ($1B 2024). Field 2024+: clinical-grade designed proteins reality on decade horizon.'
