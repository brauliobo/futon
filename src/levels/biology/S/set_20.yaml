        rationale:
          pt: 'Astrobiology missions 2024: (1) Mars Perseverance + Ingenuity (NASA fevereiro 2021 landed Jezero Crater paleolake). Cached ~38 rock cores, awaiting Mars Sample Return (MSR) NASA + ESA ~2030s ($11B budget challenges 2024+). PIXL + SHERLOC + SuperCam astrobiology instruments. (2) Europa Clipper (NASA outubro 2024 launch SpaceX Falcon Heavy, arrival 2030) — Jupiter moon Europa subsurface ocean, ~49 flybys, ice-penetrating radar + magnetometer + mass spec. (3) Enceladus legacy — Cassini 2004-2017 detected south polar plumes (water vapor + organics + H₂ + phosphates 2023 Nature). Subsequent missions Enceladus Orbiter Lander concept-stage. (4) Titan Dragonfly (NASA New Frontiers, launching ~2027, arrival 2034) — rotorcraft Titan surface 32-month mission Selk crater region. (5) JWST exoplanet biosignatures — K2-18b DMS tentative detection (Madhusudhan ApJL setembro 2023, disputed Schmidt 2024). TRAPPIST-1 system ongoing observations 2023+. (6) ESA JUICE mission (2023 launch, 2031 Jupiter system) — Europa, Ganymede orbit eventually, Callisto. (7) Future: Habitable Worlds Observatory NASA 2030s direct-imaging exoplanets. (8) International research: China Tianwen-1 Mars rover Zhurong 2021-2023, Tianwen-3 sample return 2028, Tianwen-4 Jupiter mission. (9) ESA ExoMars Rosalind Franklin rover 2028+ (delayed Russian invasion 2022 forced replatforming).'
