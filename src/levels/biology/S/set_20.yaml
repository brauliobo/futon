        choices:
          - KRAS G12C/G12D inhibitors, T-DXd HER2-low, BiTEs (blinatumomab/teclistamab), TIL Amtagvi, TCR-T Tecelra synovial, personalized mRNA vaccines (mRNA-4157), tumor-agnostic biomarker approvals (NTRK/RET/MSI/HER2)
