title:
  pt: Revisão Cumulativa — Fronteira da Biologia
  en: Cumulative Review — Frontier Biology
level: S
subject: biology
objectives:
  - Recapitular sintetização e edição de genoma
  - Recapitular IA biologia e biologia generativa
  - Recapitular medicina precisão e xenotransplante
  - Recapitular astrobiologia, microbioma, neurotecnologia
difficulty: 5
authorNotes: |
  Cumulative review covering S level frontier biology — synbio, longevity, omics, AI structural,
  CRISPR, neurotech, mRNA, genome synthesis, embryo models, xeno+regen, origins+astrobiology,
  plant+climate, virology+pandemic, epigenetics+RNA, AI drug discovery, cancer evolution,
  inflammation+cell death, psychiatric genomics, immunology+microbiome+glycobiology.
example:
  question:
    pt: Frontier biology paradigm shift 2020-2024 caracteriza-se por…
    en: Frontier biology paradigm shift 2020-2024 is characterized by…
  choices:
    - AI-driven generative biology (AlphaFold, ESM3, RFdiffusion), CRISPR clinical era (Casgevy 2023), mRNA platform (COVID + cancer vaccines), xenotransplantation (Slayman 2024), connectomics (FlyWire 2024)
    - Pure single-discipline progress without integration
    - Slow incremental advances without paradigm shifts
    - Standard organic chemistry without AI/biology
  correctAnswer: AI-driven generative biology (AlphaFold, ESM3, RFdiffusion), CRISPR clinical era (Casgevy 2023), mRNA platform (COVID + cancer vaccines), xenotransplantation (Slayman 2024), connectomics (FlyWire 2024)
  rationale:
    pt: 'Síntese cumulativa S level: 2020-2024 inflection point múltiplas frentes biology. (1) AI-bio: AlphaFold2 CASP14 2020 → AlphaFold3 2024, ESM3 EvolutionaryScale + Geneformer + Evo DNA models, RFdiffusion + ProteinMPNN + AlphaProteo 2024 generative protein design, AI antibodies Generate/Absci/Xaira, AlphaMissense variant interpretation, Halicin/Insilico ISM001-055 AI drugs. (2) CRISPR clinical: Casgevy (BCL11A enhancer SCD/β-thal Vertex/CRISPR Therapeutics FDA dezembro 2023) primeira CRISPR aprovada, Verve VERVE-101 in vivo PCSK9 base editing, NTLA-2001 in vivo TTR amyloidosis, base/prime editing Liu Broad. (3) mRNA-LNP: Karikó/Weissman Nobel 2023 m1Ψ, Pfizer/Moderna COVID vaccines fastest ever, Moderna mRNA-4157 + BioNTech BNT122 personalized cancer vaccines, mRNA-3927 PA protein replacement. (4) Xenotransplant: Bennett UMD pig heart 2022, Slayman MGH first living recipient pig kidney março 2024, eGenesis 10-edit pigs, FDA Phase 1 IND CALYPSO 2024. (5) Connectomics: FlyWire fruit-fly connectome 2024 (~140k neurons synapse-resolution), MICrONS mouse cortex 2025 1mm³. (6) Stem-cell embryo models: SEM Tarazi/Hanna Cell 2022/2023 ~14 days, blastoids, gastruloids. (7) Brain-computer interfaces: Neuralink N1 Arbaugh 2024, Synchron Stentrode, speech BCI 78wpm UCSF/Stanford 2023. (8) Pandemic preparedness lessons COVID era. Era genômicas funcionais escaláveis + computational biology + clinical translation aceleradas.'
    en: 'Cumulative synthesis of S level: 2020-2024 inflection point on multiple frontiers of biology. (1) AI-bio: AlphaFold2 CASP14 2020 → AlphaFold3 2024, ESM3 EvolutionaryScale + Geneformer + Evo DNA models, RFdiffusion + ProteinMPNN + AlphaProteo 2024 generative protein design, AI antibodies Generate/Absci/Xaira, AlphaMissense variant interpretation, Halicin/Insilico ISM001-055 AI drugs. (2) CRISPR clinical: Casgevy (BCL11A enhancer SCD/β-thal Vertex/CRISPR Therapeutics FDA December 2023) first CRISPR approved, Verve VERVE-101 in vivo PCSK9 base editing, NTLA-2001 in vivo TTR amyloidosis, base/prime editing Liu Broad. (3) mRNA-LNP: Karikó/Weissman Nobel 2023 m1Ψ, Pfizer/Moderna COVID vaccines fastest ever, Moderna mRNA-4157 + BioNTech BNT122 personalized cancer vaccines, mRNA-3927 PA protein replacement. (4) Xenotransplant: Bennett UMD pig heart 2022, Slayman MGH first living recipient pig kidney March 2024, eGenesis 10-edit pigs, FDA Phase 1 IND CALYPSO 2024. (5) Connectomics: FlyWire fruit-fly connectome 2024 (~140k neurons at synapse resolution), MICrONS mouse cortex 2025 1mm³. (6) Stem-cell embryo models: SEM Tarazi/Hanna Cell 2022/2023 ~14 days, blastoids, gastruloids. (7) Brain-computer interfaces: Neuralink N1 Arbaugh 2024, Synchron Stentrode, speech BCI 78wpm UCSF/Stanford 2023. (8) Pandemic preparedness lessons in COVID era. Era of scalable functional genomics + computational biology + accelerated clinical translation.'
