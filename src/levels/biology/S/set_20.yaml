        correctAnswer: Casgevy SCD/β-thal (FDA 2023), Lyfgenia bb1111 lentiviral SCD, NTLA-2001 TTR + NTLA-2002 HAE Intellia, VERVE-101/102 PCSK9 in vivo, EBT-101 HIV, CTX110 allogeneic CAR-T, base/prime editing trials
        rationale:
          pt: 'Clinical CRISPR ecosystem 2024+: (1) Casgevy/exa-cel (Vertex/CRISPR Therapeutics) FDA dezembro 2023 — first CRISPR approved SCD/β-thal. Concurrent Lyfgenia (bluebird bio bb1111 lentiviral βA-T87Q gene addition, FDA December 2023). (2) Intellia: NTLA-2001 (TTR amyloidosis Phase 3), NTLA-2002 (hereditary angioedema HAE Phase 2/3 — KLKB1 KO). (3) Verve Therapeutics: VERVE-101/102 PCSK9 in vivo base editing (heart-1/heart-2 Phase 1). (4) Editas Medicine: EDIT-101 LCA10 CEP290 (Phase 1/2 paused 2022 modest efficacy), EDIT-301 SCD (Reni-cel Phase 1/2). (5) Beam Therapeutics base editing — BEAM-101 SCD Phase 1/2 + BEAM-201 multi-edit allogeneic CAR-T. (6) Excision BioTherapeutics EBT-101 HIV (Phase 1/2). (7) CRISPR Therapeutics CTX110/130 allogeneic CAR-T. (8) Tune Therapeutics epigenetic silencing HBV/PCSK9 (TUNE-401 Phase 1). (9) Prime Medicine PM359 chronic granulomatous disease + sickle cell prime editing trials launching 2024+. Field broadly translating multiple modalities + targets.'
          en: 'Clinical CRISPR ecosystem 2024+: (1) Casgevy/exa-cel (Vertex/CRISPR Therapeutics) FDA December 2023 — first CRISPR approved for SCD/β-thal. Concurrent Lyfgenia (bluebird bio bb1111 lentiviral βA-T87Q gene addition, FDA December 2023). (2) Intellia: NTLA-2001 (TTR amyloidosis Phase 3), NTLA-2002 (hereditary angioedema HAE Phase 2/3 — KLKB1 KO). (3) Verve Therapeutics: VERVE-101/102 PCSK9 in vivo base editing (heart-1/heart-2 Phase 1). (4) Editas Medicine: EDIT-101 LCA10 CEP290 (Phase 1/2 paused 2022 modest efficacy), EDIT-301 SCD (Reni-cel Phase 1/2). (5) Beam Therapeutics base editing — BEAM-101 SCD Phase 1/2 + BEAM-201 multi-edit allogeneic CAR-T. (6) Excision BioTherapeutics EBT-101 HIV (Phase 1/2). (7) CRISPR Therapeutics CTX110/130 allogeneic CAR-T. (8) Tune Therapeutics epigenetic silencing HBV/PCSK9 (TUNE-401 Phase 1). (9) Prime Medicine PM359 chronic granulomatous disease + sickle cell prime editing trials launching 2024+. Field broadly translating multiple modalities + targets.'
