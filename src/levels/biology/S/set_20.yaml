          pt: 'Biology education + workforce 2024 trends são…'
          en: 'Biology education + workforce 2024 trends are…'
        choices:
          - Computational biology + AI integration core curricula, interdisciplinary training (genomics + ML + chemistry), clinical genomics workforce expansion, citizen science platforms (eBird, Foldit, Galaxy Zoo), open data sharing imperatives
          - Pure traditional curricula without AI
          - Static workforce without growth
          - Single-discipline training only
        correctAnswer: Computational biology + AI integration core curricula, interdisciplinary training (genomics + ML + chemistry), clinical genomics workforce expansion, citizen science platforms (eBird, Foldit, Galaxy Zoo), open data sharing imperatives
        rationale:
          pt: 'Biology education + workforce 2024 trends: (1) Computational biology + AI integration — undergraduate biology programs adding ML/Python/R requirements (Stanford CS+Biology, MIT 6-7 + 7-9 dual majors, EPFL Life Sciences Engineering). Bioinformatics PhDs growing fastest doctoral discipline biology. (2) Interdisciplinary chemistry-biology-physics-CS — protein engineering requires structural biology + ML + organic chemistry combined. (3) Clinical genomics workforce — genetic counselors growing 21% expected 2031 USA Bureau Labor Statistics. (4) Citizen science — eBird (~80M observations crowdsourced), Foldit Univ Washington protein folding game (>1M players), Galaxy Zoo, Zooniverse, BugGuide, iNaturalist. (5) Open data — Sequence Read Archive (SRA NCBI ~10 PB+), AlphaFold DB ~214M structures freely available, ENCODE/Roadmap Epigenomics, Human Cell Atlas. FAIR (Findable Accessible Interoperable Reusable) principles. (6) Open-source tools — Bioconductor R, Galaxy workflows, scanpy/Seurat single-cell, Nextflow pipelines, GitHub bioinformatics ~1000s repos. (7) Diversity initiatives — STEM pipelines underrepresented groups (HHMI Gilliam, Pew Hispanic, Indigenous STEM). (8) Online education — Coursera/edX/HHMI BioInteractive, Khan Academy, Crash Course Biology free. Era: democratized access + collaborative biology + AI tools.'
          en: 'Biology education + workforce 2024 trends: (1) Computational biology + AI integration — undergraduate biology programs adding ML/Python/R requirements (Stanford CS+Biology, MIT 6-7 + 7-9 dual majors, EPFL Life Sciences Engineering). Bioinformatics PhDs growing fastest doctoral discipline biology. (2) Interdisciplinary chemistry-biology-physics-CS — protein engineering requires structural biology + ML + organic chemistry combined. (3) Clinical genomics workforce — genetic counselors growing 21% expected 2031 USA Bureau of Labor Statistics. (4) Citizen science — eBird (~80M observations crowdsourced), Foldit Univ Washington protein folding game (>1M players), Galaxy Zoo, Zooniverse, BugGuide, iNaturalist. (5) Open data — Sequence Read Archive (SRA NCBI ~10 PB+), AlphaFold DB ~214M structures freely available, ENCODE/Roadmap Epigenomics, Human Cell Atlas. FAIR (Findable Accessible Interoperable Reusable) principles. (6) Open-source tools — Bioconductor R, Galaxy workflows, scanpy/Seurat single-cell, Nextflow pipelines, GitHub bioinformatics ~1000s repos. (7) Diversity initiatives — STEM pipelines for underrepresented groups (HHMI Gilliam, Pew Hispanic, Indigenous STEM). (8) Online education — Coursera/edX/HHMI BioInteractive, Khan Academy, Crash Course Biology free. Era: democratized access + collaborative biology + AI tools.'
        objectives: [Biology education workforce]
      - type: choice
        difficulty: 5
        question:
          pt: 'Bioethics + biosecurity frontier 2024 issues são…'
          en: 'Bioethics + biosecurity frontier 2024 issues are…'
        choices:
          - Embryo models + 14-day rule revision, germline editing moratorium (He Jiankui 2018), AI-bio dual-use risks, gain-of-function research debates, equity in genomics, planetary protection xenotransplant
          - No ethical concerns in modern biology
          - Pure technical issues without ethics
          - Single-issue focus only
        correctAnswer: Embryo models + 14-day rule revision, germline editing moratorium (He Jiankui 2018), AI-bio dual-use risks, gain-of-function research debates, equity in genomics, planetary protection xenotransplant
        rationale:
          pt: 'Bioethics + biosecurity 2024 frontier: (1) Embryo models + 14-day rule — ISSCR 2021 guidelines relaxed case-by-case basis, SEM Tarazi/Hanna 2023 ~14d, regulatory frameworks lagging science. (2) Germline editing — He Jiankui 2018 CRISPR babies + 2022 prison release controversy, WHO + NAS moratorium recommendations until safety/societal consensus. (3) AI-bio dual-use risks — emerging concern AI enabling bioweapon design (Urbina/Ekins 2022 demonstrated AI medicinal chemistry repurposable toxin design). White House AI Executive Order 2023, EU AI Act 2024 included biosecurity. (4) Gain-of-function research debates — H5N1 ferret transmission Fouchier/Kawaoka 2012 publication moratorium, NIH P3CO Framework 2017+, post-COVID origins debate (lab-leak hypothesis WIV). (5) Equity genomics — ancestry bias GWAS/PRS European overrepresentation (~80%), All of Us NIH 1M diverse cohort, H3Africa, CSER initiatives. (6) Xenotransplant ethics — animal welfare pig sourcing, informed consent compassionate-use, allocation cost equity. (7) Reproductive technology — IVG (in vitro gametogenesis Hayashi mouse fertile generations), 3-parent IVF MRT regulation. (8) Cognitive enhancement — neurotechnology ethics, BCI privacy. (9) Climate & biology — synbio carbon capture vs ecological risks, gene drives Anopheles malaria mosquito species elimination debates. (10) Synthetic biology dual-use — DNA synthesis screening guidelines IGSC. Field: technology pace exceeds regulatory pace continuously.'
