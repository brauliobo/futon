        rationale:
          pt: 'Stem cell + regenerative medicine 2024 milestones: (1) Vertex VX-880 — hESC-derived insulin-producing islet cells T1D Phase 1/2 (Reichman NEJM 2024 promising) — first eliminated insulin requirements. VX-264 encapsulated version eliminate immunosuppression need. (2) iPSC-RPE retinal therapies — Mandai/Takahashi NEJM 2017 first iPSC clinical, Sumitomo Dainippon allogeneic Japan, Astellas Lineage hESC-RPE Phase 1/2. (3) Cell therapy Parkinson — Takahashi Kyoto iPSC-derived dopamine neurons Phase 1/2 trial 2018+ stable improvement, BlueRock Therapeutics Phase 2 + IND 2024+. (4) Stem-cell-based embryo models — SEM Tarazi/Hanna mouse 2022 + human 2023 Cell ~14 days, Zernicka-Goetz Cambridge/Caltech parallel, blastoids + iBlastoids Polo. (5) Organoids therapy — vascularized brain organoids Pasca rat transplant 2022, Mansour Salk adult mice. (6) iPSC-NK cell therapies Fate Therapeutics, BMS-acquired Mauna Kea. (7) Regenerative biology — Levin Tufts xenobots + bioelectric signaling, axolotl genome 2018 ~32Gb. (8) Tissue engineering — Atala WFIRM 3D bioprinted bladder/urethra, Doris Taylor decellularized scaffolds, organ-on-chip Wyss/Ingber, Tel Aviv 3D bioprinted heart Noor 2019, FRESH technique Lewis Harvard. (9) Cellular agriculture: Upside Foods + Eat Just FDA 2022 cultivated chicken. (10) Pluripotency states — naïve/primed/formative Smith 2017 framework. Era: stem cell biology engineering + clinical translation accelerating decade horizon.'
          en: 'Stem cell + regenerative medicine 2024 milestones: (1) Vertex VX-880 — hESC-derived insulin-producing islet cells for T1D Phase 1/2 (Reichman NEJM 2024 promising) — first to eliminate insulin requirements. VX-264 encapsulated version to eliminate immunosuppression need. (2) iPSC-RPE retinal therapies — Mandai/Takahashi NEJM 2017 first iPSC clinical, Sumitomo Dainippon allogeneic Japan, Astellas Lineage hESC-RPE Phase 1/2. (3) Cell therapy for Parkinson — Takahashi Kyoto iPSC-derived dopamine neurons Phase 1/2 trial 2018+ stable improvement, BlueRock Therapeutics Phase 2 + IND 2024+. (4) Stem-cell-based embryo models — SEM Tarazi/Hanna mouse 2022 + human 2023 Cell ~14 days, Zernicka-Goetz Cambridge/Caltech parallel, blastoids + iBlastoids Polo. (5) Organoids therapy — vascularized brain organoids Pasca rat transplant 2022, Mansour Salk adult mice. (6) iPSC-NK cell therapies Fate Therapeutics, BMS-acquired Mauna Kea. (7) Regenerative biology — Levin Tufts xenobots + bioelectric signaling, axolotl genome 2018 ~32 Gb. (8) Tissue engineering — Atala WFIRM 3D bioprinted bladder/urethra, Doris Taylor decellularized scaffolds, organ-on-chip Wyss/Ingber, Tel Aviv 3D bioprinted heart Noor 2019, FRESH technique Lewis Harvard. (9) Cellular agriculture: Upside Foods + Eat Just FDA 2022 cultivated chicken. (10) Pluripotency states — naïve/primed/formative Smith 2017 framework. Era: stem cell biology engineering + clinical translation accelerating on decade horizon.'
