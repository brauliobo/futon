        correctAnswer: KRAS G12C/G12D inhibitors, T-DXd HER2-low, BiTEs (blinatumomab/teclistamab), TIL Amtagvi, TCR-T Tecelra synovial, personalized mRNA vaccines (mRNA-4157), tumor-agnostic biomarker approvals (NTRK/RET/MSI/HER2)
        rationale:
          pt: 'Cancer therapy paradigm shifts 2020-2024: (1) KRAS druggable — sotorasib/adagrasib G12C 2021/2022, RMC-9805 G12D 2024 Phase 1/2, RMC-7977 pan-KRAS. (2) ADCs expansion — T-DXd Enhertu HER2-low DESTINY-Breast04 NEJM 2022, datopotamab Trop2 lung, sacituzumab Trodelvy TNBC. (3) BiTEs: blinatumomab CD19, tarlatamab DLL3 SCLC Imdelltra 2024, teclistamab BCMA, glofitamab CD20. (4) Cell therapy: TIL Amtagvi (lifileucel Iovance FDA 2024 melanoma), TCR-T afami-cel Tecelra (synovial sarcoma 2024), CAR-T 6th-gen (Carvykti BCMA, Abecma BCMA, Aucatzyl 2024 ALL allogeneic). (5) Personalized mRNA vaccines — Moderna mRNA-4157/V940 KEYNOTE-942 melanoma + BioNTech BNT122 cevumeran pancreatic Rojas/Balachandran 2023. (6) Tumor-agnostic approvals: pembrolizumab MSI-H 2017, larotrectinib NTRK, T-DXd HER2-PanTumor02 2024. (7) PROTACs: vepdegestrant ARV-471 ER+ breast Phase 3 2024+. (8) Oncolytic viruses + neoadjuvant ICI. (9) Ferroptose + cuproptose targeting drug-resistant cancers. (10) ctDNA-MRD guiding adjuvant therapy. Era precision oncology + cell therapy + immune engagement convergent.'
          en: 'Cancer therapy paradigm shifts 2020-2024: (1) KRAS druggable — sotorasib/adagrasib G12C 2021/2022, RMC-9805 G12D 2024 Phase 1/2, RMC-7977 pan-KRAS. (2) ADCs expansion — T-DXd Enhertu HER2-low DESTINY-Breast04 NEJM 2022, datopotamab Trop2 lung, sacituzumab Trodelvy TNBC. (3) BiTEs: blinatumomab CD19, tarlatamab DLL3 SCLC Imdelltra 2024, teclistamab BCMA, glofitamab CD20. (4) Cell therapy: TIL Amtagvi (lifileucel Iovance FDA 2024 for melanoma), TCR-T afami-cel Tecelra (synovial sarcoma 2024), CAR-T 6th-gen (Carvykti BCMA, Abecma BCMA, Aucatzyl 2024 ALL allogeneic). (5) Personalized mRNA vaccines — Moderna mRNA-4157/V940 KEYNOTE-942 melanoma + BioNTech BNT122 cevumeran pancreatic Rojas/Balachandran 2023. (6) Tumor-agnostic approvals: pembrolizumab MSI-H 2017, larotrectinib NTRK, T-DXd HER2-PanTumor02 2024. (7) PROTACs: vepdegestrant ARV-471 ER+ breast Phase 3 2024+. (8) Oncolytic viruses + neoadjuvant ICI. (9) Ferroptosis + cuproptosis targeting drug-resistant cancers. (10) ctDNA-MRD guiding adjuvant therapy. Era of precision oncology + cell therapy + immune engagement convergent.'
