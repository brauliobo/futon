        choices:
          - Casgevy SCD/β-thal (FDA 2023), Lyfgenia bb1111 lentiviral SCD, NTLA-2001 TTR + NTLA-2002 HAE Intellia, VERVE-101/102 PCSK9 in vivo, EBT-101 HIV, CTX110 allogeneic CAR-T, base/prime editing trials
