        question:
          pt: 'Major unsolved frontier biology problems 2024 são…'
          en: 'Major unsolved frontier biology problems 2024 are…'
        choices:
          - Aging mechanisms causality, cancer heterogeneity + drug resistance, AD/Parkinson neurodegeneration cure, microbiome causality, complex disease genetic architecture, consciousness, abiogenesis chemistry, sustainable food/climate
          - All major problems solved
          - Pure technical problems without biology
          - Single major problem only
        correctAnswer: Aging mechanisms causality, cancer heterogeneity + drug resistance, AD/Parkinson neurodegeneration cure, microbiome causality, complex disease genetic architecture, consciousness, abiogenesis chemistry, sustainable food/climate
        rationale:
          pt: 'Major unsolved frontier biology problems 2024: (1) Aging mechanisms — what is "primary" cause aging? López-Otín 12 hallmarks complex interplay; senescent cell accumulation, mitochondrial dysfunction, epigenetic drift, telomere attrition, etc — causal vs correlative debate. (2) Cancer heterogeneity + drug resistance — TRACERx evolution, persister cells, ITH limit cure rates ~50% advanced cancers; combinations targeting multiple resistance mechanisms emerging. (3) Neurodegeneration cure — AD lecanemab/donanemab modest slowing only, tau-target trials emerging; Parkinson α-synuclein clearance LRRK2 pipeline still developing; ALS frustrating Relyvrio failure 2024. (4) Microbiome causality — extensive associations + correlations but causal mechanisms specific bacteria → disease still emerging. (5) Complex disease genetic architecture — heritability gap (heritability missing problem), GWAS PRS modest predictive ~5-10% variance, rare variants + epistasis underexplored. (6) Consciousness — neural correlates IIT integrated information theory + GNW global neuronal workspace debate; AI consciousness emerging concerns. (7) Abiogenesis — origin life chemistry transition non-living → living; RNA world → DNA-protein transition unsolved; LUCA reconstruction speculative. (8) Sustainable food + climate — feeding 9-10B people 2050 photosynthesis-limited carbohydrates + protein supply; biodiversity loss accelerating; bioeconomy alternative materials/fuels still expensive vs petrochemicals. (9) Vaccine development specific pathogens — universal flu, HIV, malaria, TB still elusive. (10) Whole-organism understanding — complete mechanistic biology even single cell ainda incompleto despite decades. Era: enormous progress + enormous remaining horizon decades+.'
          en: 'Major unsolved frontier biology problems 2024: (1) Aging mechanisms — what is "primary" cause of aging? López-Otín 12 hallmarks complex interplay; senescent cell accumulation, mitochondrial dysfunction, epigenetic drift, telomere attrition, etc — causal vs correlative debate. (2) Cancer heterogeneity + drug resistance — TRACERx evolution, persister cells, ITH limit cure rates ~50% in advanced cancers; combinations targeting multiple resistance mechanisms emerging. (3) Neurodegeneration cure — AD lecanemab/donanemab modest slowing only, tau-target trials emerging; Parkinson α-synuclein clearance LRRK2 pipeline still developing; ALS frustrating Relyvrio failure 2024. (4) Microbiome causality — extensive associations + correlations but causal mechanisms of specific bacteria → disease still emerging. (5) Complex disease genetic architecture — heritability gap (missing heritability problem), GWAS PRS modestly predictive ~5-10% variance, rare variants + epistasis underexplored. (6) Consciousness — neural correlates IIT integrated information theory + GNW global neuronal workspace debate; AI consciousness emerging concerns. (7) Abiogenesis — origin of life chemistry, transition non-living → living; RNA world → DNA-protein transition unsolved; LUCA reconstruction speculative. (8) Sustainable food + climate — feeding 9-10B people by 2050 photosynthesis-limited carbohydrates + protein supply; biodiversity loss accelerating; bioeconomy alternative materials/fuels still expensive vs petrochemicals. (9) Vaccine development for specific pathogens — universal flu, HIV, malaria, TB still elusive. (10) Whole-organism understanding — complete mechanistic biology even of a single cell still incomplete despite decades. Era: enormous progress + enormous remaining horizon decades+.'
