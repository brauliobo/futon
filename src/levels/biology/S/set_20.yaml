        rationale:
          pt: 'Open-source biology transformative 2020-2024: (1) Structure prediction — AlphaFold DB EBI 214M structures freely available (academic + commercial CC-BY-4.0), Boltz-1 MIT 2024 open-source AlphaFold3-class (MIT license), ESMFold Meta open weights, OpenFold 2024 PyTorch reimplementation. (2) Single-cell — scanpy (Wolf/Theis Munich Python ~80k+ users), Seurat (Satija NYGC R), Bioconductor SingleCellExperiment, scvi-tools, CellxGene. (3) Pipelines — Galaxy workflows (free academic), Nextflow (Seqera Labs), Snakemake. (4) DeepMind/Isomorphic Labs released code+weights AlphaFold2 (academic non-commercial). (5) Hugging Face bio models — ESM3, Geneformer, scGPT, CellPLM, etc fine-tuneable hosted. (6) GitHub bioinformatics — ~10000s+ repositories: bioconductor, nf-core, NextStrain (real-time pathogen genomics), Galaxy Project. (7) Public databases — NCBI (PubMed, GenBank, SRA), EBI Ensembl, UCSC Genome Browser, Allen Brain Atlas, GTEx, ENCODE, AlphaFold DB, Cell Atlas + HCA. (8) Open Source Pharma initiatives — Open Source Malaria, Open Source Tuberculosis. (9) bioRxiv preprint server ~10000s/month bio papers. (10) Tools democratized: from $millions infrastructure → laptop. Open-source movement central modern biology. Companies leveraging: free academic, paid enterprise tier (Schrödinger, Insitro internal). Cooperative model: foundational tools open, applied/clinical proprietary.'
          en: 'Open-source biology transformative 2020-2024: (1) Structure prediction — AlphaFold DB EBI 214M structures freely available (academic + commercial CC-BY-4.0), Boltz-1 MIT 2024 open-source AlphaFold3-class (MIT license), ESMFold Meta open weights, OpenFold 2024 PyTorch reimplementation. (2) Single-cell — scanpy (Wolf/Theis Munich Python ~80k+ users), Seurat (Satija NYGC R), Bioconductor SingleCellExperiment, scvi-tools, CellxGene. (3) Pipelines — Galaxy workflows (free academic), Nextflow (Seqera Labs), Snakemake. (4) DeepMind/Isomorphic Labs released code+weights AlphaFold2 (academic non-commercial). (5) Hugging Face bio models — ESM3, Geneformer, scGPT, CellPLM, etc fine-tuneable hosted. (6) GitHub bioinformatics — ~10000s+ repositories: bioconductor, nf-core, NextStrain (real-time pathogen genomics), Galaxy Project. (7) Public databases — NCBI (PubMed, GenBank, SRA), EBI Ensembl, UCSC Genome Browser, Allen Brain Atlas, GTEx, ENCODE, AlphaFold DB, Cell Atlas + HCA. (8) Open Source Pharma initiatives — Open Source Malaria, Open Source Tuberculosis. (9) bioRxiv preprint server ~10000s/month bio papers. (10) Tools democratized: from $millions infrastructure → laptop. Open-source movement central to modern biology. Companies leveraging: free academic tier, paid enterprise tier (Schrödinger, Insitro internal). Cooperative model: foundational tools open, applied/clinical proprietary.'
