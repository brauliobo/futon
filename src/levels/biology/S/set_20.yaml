        correctAnswer: Senolytics (D+Q, fisetin, navitoclax), partial reprogramming Altos/Retro Bio, GLP-1 agonists obesity/aging, NAD+ NMN/NR, rapamycin/metformin TAME, anti-IL-6 CANTOS, biological age clocks Horvath/GrimAge
        rationale:
          pt: 'Aging therapeutics 2024: (1) Senolytics — D+Q (dasatinib + quercetin Kirkland Mayo 2015), fisetin pilot trials, navitoclax BCL-2/BCL-xL inhibitor. Targeting senescent cells SASP. (2) Partial reprogramming — Belmonte 2016 OSKM cyclic, Altos Labs ($3B 2022 Belmonte advisory), Retro Biosciences ($180M Sam Altman 2022). (3) GLP-1 agonists: semaglutide Ozempic/Wegovy + tirzepatide Mounjaro/Zepbound — 15-22% weight loss + cardiovascular + kidney + dementia/AD reduced risk. (4) NAD+ precursors NMN/NR — modest clinical benefit despite hype. (5) Rapamycin: PEARL trial 2024 (Phase 1/2 healthy aging biomarkers). (6) Metformin TAME (Targeting Aging Metformin Barzilai trial recruiting 2024+ ~3000 subjects). (7) Anti-IL-6 CANTOS canakinumab cardiovascular benefit + cancer reduction. (8) Biological age clocks Horvath 2013/2018 + GrimAge Lu 2019 + DunedinPACE 2022 — track aging interventions. (9) Caloric restriction CALERIE 2-year human benefit. (10) FOXO3/Klotho/IGF-1 longevity genes natural variation. Era: aging biology becoming engineerable, target tractable.'
          en: 'Aging therapeutics 2024: (1) Senolytics — D+Q (dasatinib + quercetin Kirkland Mayo 2015), fisetin pilot trials, navitoclax BCL-2/BCL-xL inhibitor. Target senescent cells with SASP. (2) Partial reprogramming — Belmonte 2016 OSKM cyclic, Altos Labs ($3B 2022 Belmonte advisory), Retro Biosciences ($180M Sam Altman 2022). (3) GLP-1 agonists: semaglutide Ozempic/Wegovy + tirzepatide Mounjaro/Zepbound — 15-22% weight loss + cardiovascular + kidney + dementia/AD reduced risk. (4) NAD+ precursors NMN/NR — modest clinical benefit despite hype. (5) Rapamycin: PEARL trial 2024 (Phase 1/2 healthy aging biomarkers). (6) Metformin TAME (Targeting Aging with Metformin Barzilai trial recruiting 2024+ ~3000 subjects). (7) Anti-IL-6 CANTOS canakinumab cardiovascular benefit + cancer reduction. (8) Biological age clocks Horvath 2013/2018 + GrimAge Lu 2019 + DunedinPACE 2022 — track aging interventions. (9) Caloric restriction CALERIE 2-year human benefit. (10) FOXO3/Klotho/IGF-1 longevity genes natural variation. Era: aging biology becoming engineerable, target tractable.'
        objectives: [Aging therapeutics]
      - type: choice
        difficulty: 5
        question:
          pt: 'Pandemic preparedness lessons COVID era é…'
          en: 'Pandemic preparedness lessons COVID era is…'
        choices:
          - mRNA platform validation, structural vaccinology (S-2P prefusion), wastewater surveillance, ACTT-2/RECOVERY adaptive trials, WHO IHR amendments 2024, pan-coronavirus + universal flu pipelines, R&D Blueprint priority pathogens
          - No lessons learned
          - Pure regulatory failures only
          - Standard influenza response without paradigm
        correctAnswer: mRNA platform validation, structural vaccinology (S-2P prefusion), wastewater surveillance, ACTT-2/RECOVERY adaptive trials, WHO IHR amendments 2024, pan-coronavirus + universal flu pipelines, R&D Blueprint priority pathogens
        rationale:
          pt: 'COVID pandemic preparedness lessons: (1) mRNA-LNP platform validation — Pfizer-BioNTech BNT162b2 + Moderna mRNA-1273 ~9 meses sequence to authorization fastest vaccine ever, pivotal proof modificadas mRNA-LNP. Subsequent: cancer vaccines, protein replacement, RSV mRNA, flu mRNA. (2) Structural vaccinology — S-2P prefusion stabilization Wrapp/McLellan Cell 2020 → applied broader (RSV nirsevimab, abrysvo, mRNA-RSV). (3) Wastewater surveillance — population-level early warning, polio NY 2022 + mpox 2022-2024 + H5N1 2024. (4) Adaptive trial designs — ACTT-2 baricitinib NEJM 2021, RECOVERY UK ~50000 enrolled, dexamethasone benefit identified. (5) International coordination — WHO IHR amendments 2024, Pandemic Fund WBank, CEPI ~$1.5B vaccine R&D. (6) Pan-coronavirus pipelines — SpFN ferritin Walter Reed, mosaic-8 RBD nanoparticle Caltech, NIH-VRC pan-sarbeco mRNA. (7) Antiviral drug discovery acceleration — Paxlovid (PF-07321332 Pfizer Phase 1 → FDA EUA in months), molnupiravir, remdesivir. (8) Public health infrastructure global gaps exposed. (9) Disease X preparedness — H5N1 dairy 2024, Mpox PHEIC 2024, Marburg Rwanda 2024 illustrate vigilância contínua need. (10) Anti-misinformation challenges. Era: science speed + delivery scaling + equity integration ongoing tensão.'
          en: 'COVID pandemic preparedness lessons: (1) mRNA-LNP platform validation — Pfizer-BioNTech BNT162b2 + Moderna mRNA-1273 ~9 months from sequence to authorization, fastest vaccine ever, pivotal proof of modified mRNA-LNP. Subsequent: cancer vaccines, protein replacement, RSV mRNA, flu mRNA. (2) Structural vaccinology — S-2P prefusion stabilization Wrapp/McLellan Cell 2020 → applied broader (RSV nirsevimab, abrysvo, mRNA-RSV). (3) Wastewater surveillance — population-level early warning, polio NY 2022 + mpox 2022-2024 + H5N1 2024. (4) Adaptive trial designs — ACTT-2 baricitinib NEJM 2021, RECOVERY UK ~50000 enrolled, dexamethasone benefit identified. (5) International coordination — WHO IHR amendments 2024, Pandemic Fund World Bank, CEPI ~$1.5B vaccine R&D. (6) Pan-coronavirus pipelines — SpFN ferritin Walter Reed, mosaic-8 RBD nanoparticle Caltech, NIH-VRC pan-sarbeco mRNA. (7) Antiviral drug discovery acceleration — Paxlovid (PF-07321332 Pfizer Phase 1 → FDA EUA in months), molnupiravir, remdesivir. (8) Public health infrastructure global gaps exposed. (9) Disease X preparedness — H5N1 dairy 2024, Mpox PHEIC 2024, Marburg Rwanda 2024 illustrate need for continuous surveillance. (10) Anti-misinformation challenges. Era: science speed + delivery scaling + equity integration with ongoing tension.'
        objectives: [Pandemic preparedness lessons]
      - type: choice
