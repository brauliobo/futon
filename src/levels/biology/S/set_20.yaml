        correctAnswer: Pre-trained models on massive bio data — ESM3 (~98B params proteins), Evo (~7B params DNA), Geneformer (~10M params cells), AlphaFold (structures), task-specific fine-tuning democratizes ML for biology
        rationale:
          pt: 'Foundation models biology era 2022-2024+: (1) Protein language models — ESM-2 Meta 2022 (650M-15B params trained UniRef ~65M sequences) → ESM3 EvolutionaryScale 2024 (98B largest, jointly modeling sequence/structure/function tokens). (2) Protein structure models — AlphaFold2 2021 (Evoformer + Structure Module), AlphaFold3 2024 (Pairformer + diffusion, biomolecular complexes), Boltz-1 2024 open. (3) Generative protein design — RFdiffusion 2023, AlphaProteo 2024, Chroma 2023, RFdiffusion-Antibody 2024. (4) DNA foundation models — Evo Stanford/Arc 2024 (7B params StripedHyena ~131kbp context), Nucleotide Transformer InstaDeep 2023, Caduceus 2024. (5) Single-cell/genomics — Geneformer Theodoris/Ellinor Nat 2023 (~10M params 30M scRNA cells), scGPT Cui Toronto 2024 (~33M cells), UCE Universal Cell Embeddings, CellPLM. (6) Genomic regulation — Enformer Avsec/Kelley 2021 (200kb context), Borzoi 2024 successor, Sei 2022, AlphaMissense Sci 2023. (7) Multimodal — AlphaFlow 2024 (closed-loop drug discovery), ChemCrow 2024 LLM agent, Coscientist 2023. Era: foundation models pre-trained massive data + task-specific fine-tuning democratized ML biology vs decade ago hand-engineered features. Bottlenecks: high-quality biological training data (~10⁵-10⁶ scale typical, vs LLM ~10¹³). Reproducibility + benchmarking standardization emerging.'
          en: 'Foundation models biology era 2022-2024+: (1) Protein language models — ESM-2 Meta 2022 (650M-15B params trained on UniRef ~65M sequences) → ESM3 EvolutionaryScale 2024 (98B largest, jointly modeling sequence/structure/function tokens). (2) Protein structure models — AlphaFold2 2021 (Evoformer + Structure Module), AlphaFold3 2024 (Pairformer + diffusion, biomolecular complexes), Boltz-1 2024 open. (3) Generative protein design — RFdiffusion 2023, AlphaProteo 2024, Chroma 2023, RFdiffusion-Antibody 2024. (4) DNA foundation models — Evo Stanford/Arc 2024 (7B params StripedHyena ~131 kbp context), Nucleotide Transformer InstaDeep 2023, Caduceus 2024. (5) Single-cell/genomics — Geneformer Theodoris/Ellinor Nat 2023 (~10M params 30M scRNA cells), scGPT Cui Toronto 2024 (~33M cells), UCE Universal Cell Embeddings, CellPLM. (6) Genomic regulation — Enformer Avsec/Kelley 2021 (200 kb context), Borzoi 2024 successor, Sei 2022, AlphaMissense Sci 2023. (7) Multimodal — AlphaFlow 2024 (closed-loop drug discovery), ChemCrow 2024 LLM agent, Coscientist 2023. Era: foundation models pre-trained on massive data + task-specific fine-tuning democratized ML in biology vs a decade ago of hand-engineered features. Bottlenecks: high-quality biological training data (~10⁵-10⁶ scale typical, vs LLM ~10¹³). Reproducibility + benchmarking standardization emerging.'
