          - Bispecific antibody not a cell therapy
        correctAnswer: First-ever T-cell receptor therapy targeting MAGE-A4 in HLA-A02:01+ synovial sarcoma, expanding T-cell therapy beyond hematologic malignancies into solid tumors
        rationale:
          pt: 'Tecelra (afamitresgene autoleucel, afami-cel; Adaptimmune): FDA approval 2 agosto 2024 — primeira TCR-T (T-cell receptor therapy) approved unresectable/metastatic synovial sarcoma. Mechanism: autologous T cells engineered express affinity-enhanced TCR recognizing MAGE-A4 peptide (cancer-testis antigen) presented on HLA-A02:01 (HLA restriction). Difere CAR-T: TCR recognizes intracellular antigens via MHC-I (CAR-T limited surface antigens). Eligibility: HLA-A02:01+ + MAGE-A4+ tumor (~30% synovial sarcoma express both). SPEARHEAD-1 trial: ORR ~39%, durable responses median ~12 meses. Marca milestone TCR-T solid tumors. Concurrent: NCI Rosenberg trials TIL therapy melanoma (Iovance lifileucel Amtagvi FDA 2024 melanoma — ORR ~31% checkpoint-refractory). TCR-T pipeline: NY-ESO-1, KK-LC-1 outros antigens. Limit: HLA restriction limits broader population.'
          en: 'Tecelra (afamitresgene autoleucel, afami-cel; Adaptimmune): FDA approval 2 August 2024 — first TCR-T (T-cell receptor therapy) approved for unresectable/metastatic synovial sarcoma. Mechanism: autologous T cells engineered to express affinity-enhanced TCR recognizing MAGE-A4 peptide (cancer-testis antigen) presented on HLA-A02:01 (HLA restriction). Differs from CAR-T: TCR recognizes intracellular antigens via MHC-I (CAR-T is limited to surface antigens). Eligibility: HLA-A02:01+ + MAGE-A4+ tumor (~30% of synovial sarcomas express both). SPEARHEAD-1 trial: ORR ~39%, durable responses median ~12 months. Marks milestone TCR-T in solid tumors. Concurrent: NCI Rosenberg trials of TIL therapy in melanoma (Iovance lifileucel Amtagvi FDA 2024 for melanoma — ORR ~31% in checkpoint-refractory). TCR-T pipeline: NY-ESO-1, KK-LC-1 other antigens. Limit: HLA restriction limits broader population.'
