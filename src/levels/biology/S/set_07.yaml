        correctAnswer: Recombinant antibody linking CD19 on B cells to CD3 on T cells, redirecting T-cell cytotoxicity without genetic engineering
        rationale:
          pt: 'BiTE (Bispecific T-cell Engager): blinatumomab (Blincyto Amgen) — primeira aprovada FDA 2014 R/R B-ALL. Construct: tandem scFv (single-chain variable fragment) — anti-CD19 + anti-CD3 ligados linker. Una T cell e B cell em proximidade → forces immune synapse → polyclonal T-cell activation, perforin/granzyme cytolysis. Sem MHC restriction, sem genetic engineering, sem manufacturing per-patient (off-the-shelf). Limit: short half-life ~2hrs → continuous IV infusion ~28 dias hospitalization. Cytokine release syndrome similar CAR-T mas reversível stop infusion. Efficacy: ORR ~40-50% in R/R adult B-ALL pivotal. Subsequent BiTEs: tarlatamab (anti-DLL3 small cell lung Imdelltra Amgen 2024), teclistamab (anti-BCMA Tecvayli myeloma 2022), elranatamab Elrexfio, mosunetuzumab. Trade-off vs CAR-T: lower peak efficacy, easier manufacturing/dosing, broader access.'
          en: 'BiTE (Bispecific T-cell Engager): blinatumomab (Blincyto Amgen) — first FDA-approved 2014 for R/R B-ALL. Construct: tandem scFv (single-chain variable fragment) — anti-CD19 + anti-CD3 linked. Joins T cell and B cell in proximity → forces immune synapse → polyclonal T-cell activation, perforin/granzyme cytolysis. No MHC restriction, no genetic engineering, no per-patient manufacturing (off-the-shelf). Limit: short half-life ~2 hrs → continuous IV infusion for ~28 days of hospitalization. Cytokine release syndrome similar to CAR-T but reversible by stopping infusion. Efficacy: ORR ~40-50% in R/R adult B-ALL pivotal. Subsequent BiTEs: tarlatamab (anti-DLL3 small cell lung Imdelltra Amgen 2024), teclistamab (anti-BCMA Tecvayli myeloma 2022), elranatamab Elrexfio, mosunetuzumab. Trade-off vs CAR-T: lower peak efficacy, easier manufacturing/dosing, broader access.'
