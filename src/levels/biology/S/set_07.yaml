        correctAnswer: Tumor-infiltrating lymphocytes harvested from patient tumor, expanded ex vivo with IL-2, reinfused after lymphodepletion to treat checkpoint-refractory melanoma
        rationale:
          pt: 'Lifileucel (Amtagvi, Iovance Biotherapeutics): FDA approval 16 fevereiro 2024 — primeira TIL therapy aprovada. Mechanism: tumor-infiltrating lymphocytes (TILs, mix CD8/CD4 T cells naturally infiltrating tumor) extracted surgical excision tumor → ex vivo expansion ~22 days IL-2 + activation → ~10⁹-10¹¹ cells reinfused após lymphodepleting chemo (fludarabine + cyclophosphamide) + post-infusion IL-2 high-dose. Indication: unresectable/metastatic melanoma checkpoint-refractory após anti-PD-1. C-144-01 trial: ORR ~31%, ~14% durable responses >18 meses. Foundation: NCI Steven Rosenberg trabalho décadas (TIL therapy first concept 1988). Concurrent: TIL trials cervical (lifileucel + pembro), NSCLC, head/neck. Limit: surgical access tumor required, complex manufacturing ~5 weeks, IL-2 toxicity. Companies: Iovance, Achilles Therapeutics (clonal neoantigen-reactive TILs), Instil Bio.'
          en: 'Lifileucel (Amtagvi, Iovance Biotherapeutics): FDA approval 16 February 2024 — first TIL therapy approved. Mechanism: tumor-infiltrating lymphocytes (TILs, mix of CD8/CD4 T cells naturally infiltrating tumor) extracted from surgical excision of tumor → ex vivo expansion ~22 days with IL-2 + activation → ~10⁹-10¹¹ cells reinfused after lymphodepleting chemo (fludarabine + cyclophosphamide) + post-infusion high-dose IL-2. Indication: unresectable/metastatic melanoma checkpoint-refractory after anti-PD-1. C-144-01 trial: ORR ~31%, ~14% durable responses >18 months. Foundation: decades of work by NCI Steven Rosenberg (TIL therapy first conceived 1988). Concurrent: TIL trials in cervical (lifileucel + pembro), NSCLC, head/neck. Limit: surgical access to tumor required, complex manufacturing ~5 weeks, IL-2 toxicity. Companies: Iovance, Achilles Therapeutics (clonal neoantigen-reactive TILs), Instil Bio.'
