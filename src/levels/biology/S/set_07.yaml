title:
  pt: Terapêuticas de mRNA e Fronteira da Imunoterapia Oncológica
  en: mRNA Therapeutics and Cancer Immunotherapy Frontier
level: S
subject: biology
objectives:
  - Compreender mRNA modificado, LNP, vacinas COVID
  - Reconhecer vacinas oncológicas personalizadas mRNA
  - Identificar checkpoint inhibitors, CAR-T, TCR-T, BiTEs, ADCs
  - Avaliar PROTACs e neoantígenos tumorais
difficulty: 5
authorNotes: |
  Era pós-COVID: Karikó/Weissman Nobel 2023 (pseudouridine N1-Me-Ψ). Moderna mRNA-1273,
  Pfizer-BioNTech BNT162b2. Personalized cancer vaccines: mRNA-4157/V940 Moderna+Merck KEYNOTE-942
  melanoma 2024, BNT122 autogene cevumeran pancreatic Rojas/Balachandran 2023. Cancer
  immunotherapy: PD-1/CTLA-4 Honjo/Allison Nobel 2018, CAR-T Kymriah, TCR-T afami-cel Tecelra
  FDA 2024 (synovial sarcoma), BiTE blinatumomab, ADC T-DXd Enhertu, PROTACs Arvinas.
example:
  question:
    pt: Karikó/Weissman Nobel Medicina 2023 reconheceu…
    en: Karikó/Weissman 2023 Nobel in Medicine recognized…
  choices:
    - Discovery of nucleoside modifications (pseudouridine, N1-methylpseudouridine) enabling non-immunogenic mRNA, foundational for COVID-19 mRNA vaccines
    - First isolation of mRNA from any tissue
    - Invention of polymerase chain reaction (PCR)
    - Discovery of small interfering RNA pathway
  correctAnswer: Discovery of nucleoside modifications (pseudouridine, N1-methylpseudouridine) enabling non-immunogenic mRNA, foundational for COVID-19 mRNA vaccines
  rationale:
    pt: 'Nobel Medicine 2023 — Katalin Karikó + Drew Weissman (UPenn) "for their discoveries concerning nucleoside base modifications that enabled the development of effective mRNA vaccines against COVID-19". Trabalho seminal: Karikó Buckstein Ni Weissman Immunity 2005 — substituição uridine → pseudouridine (Ψ) reduz dramatic ativação TLR7/TLR8 PRR sensors → permite mRNA exógena ser traduzida sem inflammatory response excessive. N1-methylpseudouridine (m1Ψ) Anderson Karikó Weissman Nucleic Acids Res 2010 — versão otimizada usada em mRNA-1273/BNT162b2. Karikó histórico trajetória — décadas marginalized academia, BioNTech VP 2013-2022, Moderna technology paralela. Adicionalmente: 5′ cap analog, codon optimization, LNP delivery. Combined enable practical mRNA therapeutics — não apenas vaccines mas protein-replacement, cancer.'
    en: '2023 Nobel in Medicine — Katalin Karikó + Drew Weissman (UPenn) "for their discoveries concerning nucleoside base modifications that enabled the development of effective mRNA vaccines against COVID-19". Seminal work: Karikó Buckstein Ni Weissman Immunity 2005 — substitution uridine → pseudouridine (Ψ) dramatically reduces activation of TLR7/TLR8 PRR sensors → allows exogenous mRNA to be translated without excessive inflammatory response. N1-methylpseudouridine (m1Ψ) Anderson Karikó Weissman Nucleic Acids Res 2010 — optimized version used in mRNA-1273/BNT162b2. Karikó historic trajectory — marginalized in academia for decades, BioNTech VP 2013-2022, Moderna technology in parallel. Additionally: 5′ cap analog, codon optimization, LNP delivery. Combined to enable practical mRNA therapeutics — not just vaccines but protein replacement and cancer.'
passCriteria:
  minAccuracyPercent: 85
