        question:
          pt: Tumor neoantigen prediction (NetMHCpan, EDGE Moderna) bottleneck atual é…
          en: Tumor neoantigen prediction (NetMHCpan, EDGE Moderna) current bottleneck is…
        choices:
          - Distinguishing truly immunogenic neoantigens (driving T-cell responses) from merely presented peptides; presentation prediction is mature, but immunogenicity ranking remains imperfect
          - Inability to predict any HLA-binding peptide from tumor sequencing
          - Lack of any tumor sequencing data sources at scale
          - Absence of MHC-I structural information for any human allele
        correctAnswer: Distinguishing truly immunogenic neoantigens (driving T-cell responses) from merely presented peptides; presentation prediction is mature, but immunogenicity ranking remains imperfect
        rationale:
          pt: 'Neoantigen prediction pipeline: WES tumor + germline → call somatic SNVs/indels → translate ORF → peptidoma 8-11mer windows → MHC-I binding prediction (NetMHCpan Nielsen Lund DTU, MHCflurry O''Donnell Hammerbacher, EDGE Bulik-Sullivan Moderna trained mass-spec data). Presentation prediction: MS-validated MHC-I peptidome, ~80%+ accuracy mature methods. Immunogenicity prediction (does peptide trigger CD8 T-cell response in vivo?) bottleneck: depends presence T-cell repertoire reactive (TCR avidity), thymic negative selection (similarity self-proteome), antigen processing (proteasome, TAP), tumor microenvironment. Current ~10-20% of well-presented neoantigens elicit measurable T-cell responses in vaccine trials. Active research: TCR-pMHC structural prediction (AlphaFold-based), binding affinity → recognition translation models, public datasets (TESLA Wells consortium 2020 Cell). Better immunogenicity ranking key personalized vaccine efficacy.'
          en: 'Neoantigen prediction pipeline: WES of tumor + germline → call somatic SNVs/indels → translate ORF → peptidome of 8-11mer windows → MHC-I binding prediction (NetMHCpan Nielsen Lund DTU, MHCflurry O''Donnell Hammerbacher, EDGE Bulik-Sullivan Moderna trained on mass-spec data). Presentation prediction: MS-validated MHC-I peptidome, ~80%+ accuracy in mature methods. Immunogenicity prediction (does peptide trigger CD8 T-cell response in vivo?) is the bottleneck: depends on presence of reactive T-cell repertoire (TCR avidity), thymic negative selection (similarity to self-proteome), antigen processing (proteasome, TAP), tumor microenvironment. Currently ~10-20% of well-presented neoantigens elicit measurable T-cell responses in vaccine trials. Active research: TCR-pMHC structural prediction (AlphaFold-based), binding affinity → recognition translation models, public datasets (TESLA Wells consortium 2020 Cell). Better immunogenicity ranking is key to personalized vaccine efficacy.'
        objectives: [Neoantigen prediction]
