        question:
          pt: KRAS inhibitors (sotorasib Lumakras Amgen 2021, adagrasib Krazati Mirati 2022) marco é…
          en: KRAS inhibitors (sotorasib Lumakras Amgen 2021, adagrasib Krazati Mirati 2022) milestone is…
        choices:
          - Covalent inhibitors of KRAS G12C trapping the GDP-bound state, breaking decades of "undruggable" KRAS perception in cancer
          - Indirect inhibitors of downstream MEK/ERK without KRAS binding
          - Pan-KRAS inhibitors targeting all KRAS mutations universally
          - Antibody-based therapy against extracellular KRAS forms
        correctAnswer: Covalent inhibitors of KRAS G12C trapping the GDP-bound state, breaking decades of "undruggable" KRAS perception in cancer
        rationale:
          pt: 'KRAS G12C inhibitors: Shokat lab UCSF 2013 PNAS demonstrated covalent reactive cysteine pocket de novo created by G12C mutation. Sotorasib (AMG 510, Amgen Lumakras) FDA approval 2021, adagrasib (MRTX849, Mirati Krazati) FDA 2022. Both small molecules acrylamide reactive group covalent bond Cys12 → trap inactive GDP-bound state KRAS. Indications: KRAS G12C mutant NSCLC ~13% all NSCLC. ORR ~30-40%, PFS ~6-7 meses. Limitations: resistance rapidly (target mutations Y96D, secondary KRAS mutations, parallel pathways), tumor genomic context dependent (STK11, KEAP1 mutations worse responses). Combinações: anti-PD-1, MEK inhibitors, SHP2 inhibitors active investigation. Pan-KRAS inhibitors (BBP-454 BridgeBio, RMC-7977 RAS(ON) Revolution Medicines) próximas wave 2024+. KRAS G12D (~50% pancreatic) também actively developed. Marca era "druggable KRAS".'
          en: 'KRAS G12C inhibitors: Shokat lab UCSF 2013 PNAS demonstrated covalent reactive cysteine pocket de novo created by the G12C mutation. Sotorasib (AMG 510, Amgen Lumakras) FDA approval 2021, adagrasib (MRTX849, Mirati Krazati) FDA 2022. Both small molecules with acrylamide reactive group covalent bond Cys12 → trap inactive GDP-bound state of KRAS. Indications: KRAS G12C mutant NSCLC ~13% of all NSCLC. ORR ~30-40%, PFS ~6-7 months. Limitations: resistance arises rapidly (target mutations Y96D, secondary KRAS mutations, parallel pathways), tumor genomic context dependent (STK11, KEAP1 mutations worse responses). Combinations: anti-PD-1, MEK inhibitors, SHP2 inhibitors active investigation. Pan-KRAS inhibitors (BBP-454 BridgeBio, RMC-7977 RAS(ON) Revolution Medicines) next wave 2024+. KRAS G12D (~50% of pancreatic) also actively developed. Marks "druggable KRAS" era.'
        objectives: [KRAS G12C]
