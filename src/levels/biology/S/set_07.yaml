        question:
          pt: PROTACs (Crews Yale, Arvinas) mecanismo é…
          en: PROTACs (Crews Yale, Arvinas) mechanism is…
        choices:
          - Bifunctional small molecules that recruit E3 ubiquitin ligase to a target protein, inducing its proteasomal degradation rather than just inhibiting its activity
          - Classical kinase inhibitors blocking ATP binding only
          - Antibodies binding extracellular receptors without intracellular component
          - mRNA antisense oligonucleotides for transcript knockdown
        correctAnswer: Bifunctional small molecules that recruit E3 ubiquitin ligase to a target protein, inducing its proteasomal degradation rather than just inhibiting its activity
        rationale:
          pt: 'PROTACs (Proteolysis Targeting Chimeras): Crews Yale + Deshaies Caltech 2001 PNAS conceito original. Heterobifunctional molecule: target-binding warhead + linker + E3 ligase recruiter (e.g., VHL, CRBN cereblon thalidomide-derivative). Binding both → ternary complex → ubiquitination target → 26S proteasome degradation. Catalytic (não estoichiometric) → low doses sufficient. Vantagens: degrade scaffold/tightly-bound proteins ("undruggable") sem requiring active-site inhibition, hits mutants resistant inhibitors, avoid feedback upregulation. Companies: Arvinas (Crews spinout) ARV-471 (vepdegestrant ER degrader Pfizer-partnered Phase 3 breast cancer), ARV-110 (bavdegalutamide AR prostate), Kymera Therapeutics IRAK4. Foghorn, C4, Nurix outros. CRBN-based PROTACs derivam IMiDs Celgene lenalidomide/pomalidomide. Field expanding: molecular glues (CDK7 SY-5609, GSPT1) outras flavors targeted protein degradation TPD.'
          en: 'PROTACs (Proteolysis Targeting Chimeras): Crews Yale + Deshaies Caltech 2001 PNAS original concept. Heterobifunctional molecule: target-binding warhead + linker + E3 ligase recruiter (e.g., VHL, CRBN cereblon thalidomide-derivative). Binding both → ternary complex → ubiquitination of target → 26S proteasome degradation. Catalytic (not stoichiometric) → low doses are sufficient. Advantages: degrade scaffold/tightly-bound proteins ("undruggable") without requiring active-site inhibition, hits mutants resistant to inhibitors, avoids feedback upregulation. Companies: Arvinas (Crews spinout) ARV-471 (vepdegestrant ER degrader Pfizer-partnered Phase 3 breast cancer), ARV-110 (bavdegalutamide AR prostate), Kymera Therapeutics IRAK4. Foghorn, C4, Nurix others. CRBN-based PROTACs derive from IMiDs Celgene lenalidomide/pomalidomide. Field expanding: molecular glues (CDK7 SY-5609, GSPT1) and other flavors of targeted protein degradation TPD.'
        objectives: [PROTACs]
