          pt: iPSC-NK cell therapy (Fate Therapeutics) advantage é…
          en: iPSC-NK cell therapy (Fate Therapeutics) advantage is…
        choices:
          - Off-the-shelf allogeneic NK cells from a master iPSC line, scalable manufacturing without HLA matching and lower GvHD risk than T-cell therapies
          - Patient-specific autologous T-cell engineering with long manufacturing
          - Antibody-only therapy without cellular component
          - Bone-marrow-derived stem cells without iPSC origin
        correctAnswer: Off-the-shelf allogeneic NK cells from a master iPSC line, scalable manufacturing without HLA matching and lower GvHD risk than T-cell therapies
        rationale:
          pt: 'iPSC-NK cell therapy (Fate Therapeutics, MD Anderson Rezvani lab): natural killer (NK) cells inate immune lineage — não express TCR → não cause GvHD allogeneic transfer (vs T cells need HLA-matching ou TCR knockout). iPSC-derived: master iPSC line clonally engineered (CD16 high-affinity Fc receptor, IL-15 transgene autocrine support, knockout CD58 ou outros immune-evasion edits) → differentiated NK cells em scale → cryopreserved → off-the-shelf. Fate FT516 (CD16 high-affinity), FT596 (CAR-NK + CD19), FT819 iPSC-CAR-T (TRAC knockout). Cord blood-derived NK alternative pathway (Rezvani anti-CD19 CAR-NK NEJM 2020 ~73% CR rate B-NHL). Allogeneic CAR-NK comparison vs CAR-T: lower CRS/ICANS toxicity, scalable, mas shorter persistence ~weeks vs months/years. Field active 2024+ — Fate, Affimed, Wugen, Century Therapeutics. Solid tumors potential.'
          en: 'iPSC-NK cell therapy (Fate Therapeutics, MD Anderson Rezvani lab): natural killer (NK) cells of innate immune lineage — do not express TCR → do not cause GvHD on allogeneic transfer (vs T cells which need HLA-matching or TCR knockout). iPSC-derived: master iPSC line clonally engineered (CD16 high-affinity Fc receptor, IL-15 transgene autocrine support, knockout of CD58 or other immune-evasion edits) → differentiated to NK cells at scale → cryopreserved → off-the-shelf. Fate FT516 (CD16 high-affinity), FT596 (CAR-NK + CD19), FT819 iPSC-CAR-T (TRAC knockout). Cord blood-derived NK alternative pathway (Rezvani anti-CD19 CAR-NK NEJM 2020 ~73% CR rate in B-NHL). Allogeneic CAR-NK comparison vs CAR-T: lower CRS/ICANS toxicity, scalable, but shorter persistence ~weeks vs months/years. Field active 2024+ — Fate, Affimed, Wugen, Century Therapeutics. Solid-tumor potential.'
        objectives: [iPSC-NK]
