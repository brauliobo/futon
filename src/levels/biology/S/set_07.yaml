          en: T-DXd / Enhertu (Daiichi Sankyo + AstraZeneca, DESTINY-Breast04 NEJM 2022) milestone was…
        choices:
          - Antibody-drug conjugate (anti-HER2 trastuzumab + topoisomerase-I deruxtecan payload) effective in HER2-low breast cancer, redefining the actionable HER2 spectrum
          - Pure trastuzumab without any cytotoxic payload
          - First small-molecule HER2 inhibitor without antibody component
