        correctAnswer: Antibody-drug conjugate (anti-HER2 trastuzumab + topoisomerase-I deruxtecan payload) effective in HER2-low breast cancer, redefining the actionable HER2 spectrum
        rationale:
          pt: 'Trastuzumab deruxtecan (T-DXd, Enhertu, Daiichi Sankyo + AstraZeneca): ADC anti-HER2 trastuzumab (humanized monoclonal) conjugated via cleavable tetrapeptide linker → deruxtecan exatecan-derivative topoisomerase-I inhibitor payload, drug-antibody ratio (DAR) ~8 vs first-gen ADCs DAR ~3-4. High potency (~10x more cytotoxic than SN-38), bystander killing (membrane-permeable cleaved payload neighboring cells). DESTINY-Breast04 (Modi NEJM 2022): T-DXd vs chemo physician choice em HER2-low (IHC 1+ ou 2+/ISH-) metastatic breast — PFS ~10.1 vs 5.4 meses, OS ~23.9 vs 17.5 meses. Redefines: HER2-low (~50-55% breast cancers) actionable population, antes "HER2-negative". Subsequent: DESTINY-Breast06 HER2-ultralow positive too. Other indications: HER2 gastric (Enhertu approved), NSCLC, colorectal, biliary tract pan-tumor (FDA accelerated approval 2024 HER2+ solid tumors). Toxicity: interstitial lung disease ~10-15% (~1-2% fatal). ADC platform broader (Pfizer-Seagen Padcev/Trodelvy etc).'
          en: 'Trastuzumab deruxtecan (T-DXd, Enhertu, Daiichi Sankyo + AstraZeneca): ADC of anti-HER2 trastuzumab (humanized monoclonal) conjugated via cleavable tetrapeptide linker → deruxtecan exatecan-derivative topoisomerase-I inhibitor payload, drug-antibody ratio (DAR) ~8 vs first-gen ADCs DAR ~3-4. High potency (~10x more cytotoxic than SN-38), bystander killing (membrane-permeable cleaved payload reaches neighboring cells). DESTINY-Breast04 (Modi NEJM 2022): T-DXd vs physician''s-choice chemo in HER2-low (IHC 1+ or 2+/ISH-) metastatic breast — PFS ~10.1 vs 5.4 months, OS ~23.9 vs 17.5 months. Redefines: HER2-low (~50-55% of breast cancers) actionable population, previously "HER2-negative". Subsequent: DESTINY-Breast06 HER2-ultralow positive too. Other indications: HER2 gastric (Enhertu approved), NSCLC, colorectal, biliary tract pan-tumor (FDA accelerated approval 2024 HER2+ solid tumors). Toxicity: interstitial lung disease ~10-15% (~1-2% fatal). Broader ADC platform (Pfizer-Seagen Padcev/Trodelvy etc).'
