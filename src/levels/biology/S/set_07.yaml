          en: TIL therapy lifileucel (Amtagvi, Iovance FDA 2024) is…
        choices:
          - Tumor-infiltrating lymphocytes harvested from patient tumor, expanded ex vivo with IL-2, reinfused after lymphodepletion to treat checkpoint-refractory melanoma
