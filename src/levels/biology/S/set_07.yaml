          pt: TCR-T afami-cel (Tecelra, Adaptimmune FDA 2024) é…
          en: TCR-T afami-cel (Tecelra, Adaptimmune FDA 2024) is…
        choices:
          - First-ever T-cell receptor therapy targeting MAGE-A4 in HLA-A02:01+ synovial sarcoma, expanding T-cell therapy beyond hematologic malignancies into solid tumors
