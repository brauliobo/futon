pages:
  - title:
      pt: Página 1 — mRNA e vacinas
      en: Page 1 — mRNA and vaccines
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: mRNA-1273 (Moderna NEJM 2020) e BNT162b2 (Pfizer-BioNTech NEJM 2020) mecanismo é…
          en: mRNA-1273 (Moderna NEJM 2020) and BNT162b2 (Pfizer-BioNTech NEJM 2020) mechanism is…
        choices:
          - LNP-encapsulated nucleoside-modified mRNA encoding stabilized prefusion SARS-CoV-2 spike, translated by host cells to elicit neutralizing antibodies and T-cell responses
          - Live attenuated SARS-CoV-2 virus inactivated by chemical treatment
          - Recombinant spike protein purified from CHO cells with adjuvant
          - DNA plasmid delivered by viral vector with chromosomal integration
        correctAnswer: LNP-encapsulated nucleoside-modified mRNA encoding stabilized prefusion SARS-CoV-2 spike, translated by host cells to elicit neutralizing antibodies and T-cell responses
        rationale:
          pt: 'mRNA-1273 (Moderna NIH/Vaccine Research Center Graham/Corbett/Mascola) + BNT162b2 (Pfizer-BioNTech Sahin/Türeci): LNP-encapsulated mRNA com m1Ψ modification encoding 2P prefusion-stabilized SARS-CoV-2 spike (S-2P, Pallesen 2017 PNAS para MERS → Wrapp Cell 2020 SARS-CoV-2). Lipid nanoparticle 4-component (ionizable cationic + phospholipid + cholesterol + PEG-lipid). IM injection → uptake APCs (DCs) deltoid muscle/lymph nodes → translation → spike presented MHC-I/II → CD8/CD4 T cells + B cells producing neutralizing antibodies. Phase 3 efficacy ~95% symptomatic COVID original strain. EUA FDA dezembro 2020 — fastest vaccine development history (~9 meses sequence to authorization). Updated boosters Omicron variants 2022+. Foundation mRNA platform other indications.'
          en: 'mRNA-1273 (Moderna with NIH/Vaccine Research Center Graham/Corbett/Mascola) + BNT162b2 (Pfizer-BioNTech Sahin/Türeci): LNP-encapsulated mRNA with m1Ψ modification encoding 2P prefusion-stabilized SARS-CoV-2 spike (S-2P, Pallesen 2017 PNAS for MERS → Wrapp Cell 2020 SARS-CoV-2). Lipid nanoparticle 4-component (ionizable cationic + phospholipid + cholesterol + PEG-lipid). IM injection → uptake by APCs (DCs) in deltoid muscle/lymph nodes → translation → spike presented on MHC-I/II → CD8/CD4 T cells + B cells producing neutralizing antibodies. Phase 3 efficacy ~95% against symptomatic COVID original strain. EUA FDA December 2020 — fastest vaccine development in history (~9 months from sequence to authorization). Updated boosters for Omicron variants 2022+. Foundation for mRNA platform in other indications.'
        objectives: [mRNA COVID vaccines]
      - type: choice
        difficulty: 5
        question:
          pt: mRNA-4157/V940 (Moderna+Merck KEYNOTE-942) é…
          en: mRNA-4157/V940 (Moderna+Merck KEYNOTE-942) is…
        choices:
          - Personalized neoantigen mRNA vaccine encoding up to 34 patient-specific tumor mutations, combined with pembrolizumab in adjuvant melanoma reducing recurrence vs pembrolizumab alone
          - Off-the-shelf vaccine targeting universal tumor antigens like CEA
          - Live attenuated tumor cells injected as a whole-cell vaccine
          - Single-peptide vaccine targeting one universal mutation
        correctAnswer: Personalized neoantigen mRNA vaccine encoding up to 34 patient-specific tumor mutations, combined with pembrolizumab in adjuvant melanoma reducing recurrence vs pembrolizumab alone
        rationale:
          pt: 'mRNA-4157 / V940 (Moderna + Merck): personalized cancer vaccine. Pipeline: tumor biopsy → WES tumor + germline → identify somatic mutations → predict neoantigens (HLA-binding + MHC presentation algorithms NetMHCpan, EDGE Moderna) → rank top ~34 → encode em mRNA construct (string-of-beads design) → LNP IM injection ~9 doses every 3 weeks. KEYNOTE-942 trial (Phase 2b randomized): high-risk melanoma stage III/IV resected — V940 + pembrolizumab (anti-PD-1) vs pembrolizumab alone. Khattak Carlino Long Lancet 2024 results: ~44% reduction RFS recurrence-free survival hazard, ~62% reduction distant metastasis. Phase 3 INTerpath-001 ongoing. Conceito: prime tumor-specific T cells synergize com checkpoint blockade. Other mRNA personalized: BNT122/autogene cevumeran (BioNTech).'
          en: 'mRNA-4157 / V940 (Moderna + Merck): personalized cancer vaccine. Pipeline: tumor biopsy → WES of tumor + germline → identify somatic mutations → predict neoantigens (HLA-binding + MHC presentation algorithms NetMHCpan, EDGE Moderna) → rank top ~34 → encode in mRNA construct (string-of-beads design) → LNP IM injection ~9 doses every 3 weeks. KEYNOTE-942 trial (Phase 2b randomized): high-risk resected stage III/IV melanoma — V940 + pembrolizumab (anti-PD-1) vs pembrolizumab alone. Khattak Carlino Long Lancet 2024 results: ~44% reduction in RFS recurrence-free survival hazard, ~62% reduction in distant metastasis. Phase 3 INTerpath-001 ongoing. Concept: prime tumor-specific T cells synergize with checkpoint blockade. Other personalized mRNA: BNT122/autogene cevumeran (BioNTech).'
        objectives: [mRNA cancer vaccines]
      - type: choice
        difficulty: 5
        question:
          pt: BNT122 / autogene cevumeran (Rojas/Balachandran/Sahin Nature 2023) trial showed…
          en: BNT122 / autogene cevumeran (Rojas/Balachandran/Sahin Nature 2023) trial showed…
        choices:
          - Personalized mRNA neoantigen vaccine post-surgery in pancreatic ductal adenocarcinoma induced strong T-cell responses and improved recurrence-free survival in responders
          - Failed Phase 1 trial without any T-cell response or clinical signal
          - Vaccine restricted to advanced metastatic disease without curative intent
          - Off-the-shelf KRAS G12D vaccine without personalization
        correctAnswer: Personalized mRNA neoantigen vaccine post-surgery in pancreatic ductal adenocarcinoma induced strong T-cell responses and improved recurrence-free survival in responders
        rationale:
          pt: 'BNT122 (autogene cevumeran, BioNTech): Rojas Sethna Soares Park Khalil Iaccobuzio-Donahue Beadling DeMatteo Ralhan Bates Hong Sosa Ku McAlpine Pareja Coderre Allen Sun Mehta Iyer Jamal Veeramachaneni Yu Brentjens Ahuja Park Brennan Wei Prawira Nicholas Vyas Ho Gonen Allen Young Chou Sztompka Kabir Donhue Sahin Türeci Wolchok Drebin Balachandran Nature 2023): Phase 1 N=16 patients PDAC pancreatic ductal adenocarcinoma post-surgery (Whipple). Personalized: WES → ~20 neoantigens predicted → encoded em uridine-based mRNA + saRNA platform BioNTech. Vaccinated within ~9 weeks post-op + atezolizumab + chemo mFOLFIRINOX. ~50% (8/16) developed strong neoantigen-specific T-cell responses CD8+. Responders: longer recurrence-free survival ~18 months follow-up. Non-responders: median RFS ~13.4 months. PDAC notoriously immune-cold tumor — proof-of-concept significant. Phase 2 IMCODE003 ongoing. Companion paper Lancet 2024 personalized melanoma BioNTech.'
          en: 'BNT122 (autogene cevumeran, BioNTech): Rojas Sethna Soares Park Khalil Iaccobuzio-Donahue Beadling DeMatteo Ralhan Bates Hong Sosa Ku McAlpine Pareja Coderre Allen Sun Mehta Iyer Jamal Veeramachaneni Yu Brentjens Ahuja Park Brennan Wei Prawira Nicholas Vyas Ho Gonen Allen Young Chou Sztompka Kabir Donhue Sahin Türeci Wolchok Drebin Balachandran Nature 2023): Phase 1 N=16 patients with PDAC pancreatic ductal adenocarcinoma post-surgery (Whipple). Personalized: WES → ~20 neoantigens predicted → encoded in uridine-based mRNA + saRNA platform BioNTech. Vaccinated within ~9 weeks post-op + atezolizumab + chemo mFOLFIRINOX. ~50% (8/16) developed strong neoantigen-specific CD8+ T-cell responses. Responders: longer recurrence-free survival at ~18 months follow-up. Non-responders: median RFS ~13.4 months. PDAC is notoriously immune-cold — proof-of-concept significant. Phase 2 IMCODE003 ongoing. Companion paper Lancet 2024 personalized melanoma BioNTech.'
        objectives: [BNT122 pancreatic]
      - type: choice
        difficulty: 5
        question:
          pt: Self-amplifying RNA (saRNA, Arcturus/Gritstone) advantage é…
          en: Self-amplifying RNA (saRNA, Arcturus/Gritstone) advantage is…
        choices:
          - Encodes alphavirus replicase plus the antigen of interest, allowing intracellular self-replication and lower dose to achieve equivalent expression vs conventional mRNA
          - Permanent integration into the host genome for long-term expression
          - DNA-based vector requiring nuclear delivery
          - Viral capsid-based delivery without lipid nanoparticles
        correctAnswer: Encodes alphavirus replicase plus the antigen of interest, allowing intracellular self-replication and lower dose to achieve equivalent expression vs conventional mRNA
        rationale:
          pt: 'Self-amplifying RNA (saRNA): backbone derivado alphavirus (Venezuelan/Sindbis equine encephalitis virus) RdRp replicase complex (nsP1-4) + subgenomic promoter encoding antigen of interest. Após delivery (LNP) → cytoplasmic replication via RdRp → 100-1000x amplification → robust antigen production sustained dias. Vantagens: ~100x lower dose conventional mRNA (Arcturus ARCT-154 COVID booster aprovado Japan 2023 1µg vs ~30-100µg pseudouridine-mRNA), longer expression. Limits: stronger innate immune activation (replicase intermediates RNA double-stranded → RIG-I/MDA5 → IFN), more reactogenic vs nucleoside-modified mRNA. Companies: Arcturus Therapeutics, Gritstone bio (cancer + COVID), Replicate Bioscience, Vidicell. trans-amplifying split versions (taRNA) emerging. Field promising but reactogenicity managing critical.'
          en: 'Self-amplifying RNA (saRNA): backbone derived from alphavirus (Venezuelan/Sindbis equine encephalitis virus) RdRp replicase complex (nsP1-4) + subgenomic promoter encoding the antigen of interest. After delivery (LNP) → cytoplasmic replication via RdRp → 100-1000x amplification → robust antigen production sustained for days. Advantages: ~100x lower dose than conventional mRNA (Arcturus ARCT-154 COVID booster approved Japan 2023 at 1 µg vs ~30-100 µg for pseudouridine-mRNA), longer expression. Limits: stronger innate immune activation (replicase intermediates with double-stranded RNA → RIG-I/MDA5 → IFN), more reactogenic vs nucleoside-modified mRNA. Companies: Arcturus Therapeutics, Gritstone bio (cancer + COVID), Replicate Bioscience, Vidicell. trans-amplifying split versions (taRNA) emerging. Field is promising but reactogenicity management is critical.'
        objectives: [saRNA]
      - type: choice
        difficulty: 5
        question:
          pt: mRNA protein-replacement therapy (Moderna mRNA-3927 propionic acidemia) approach é…
          en: mRNA protein-replacement therapy (Moderna mRNA-3927 propionic acidemia) approach is…
        choices:
          - LNP-delivered mRNA encoding the deficient enzyme repeatedly dosed to transiently restore function in metabolic diseases like propionic acidemia
          - Permanent gene replacement via AAV with single-dose curative effect
          - Small-molecule chaperone for misfolded enzyme without genetic component
          - Bone marrow transplant providing donor-derived enzyme
        correctAnswer: LNP-delivered mRNA encoding the deficient enzyme repeatedly dosed to transiently restore function in metabolic diseases like propionic acidemia
        rationale:
          pt: 'mRNA protein-replacement therapy: paradigma chronic dosing mRNA encoding deficient enzyme (não vaccine antigen). Moderna pipeline: mRNA-3927 propionic acidemia (PA, deficiência propionyl-CoA carboxylase PCCA/PCCB), mRNA-3705 methylmalonic acidemia (MMA-CB, MMUT), mRNA-3351 phenylketonuria (PAH), mRNA-3745 glycogen storage disease type 1a. LNP encapsulating mRNA + dual heteromeric subunits (e.g., PCCA+PCCB juntos) IV → liver hepatocytes → translate enzyme → metabolize substrate. Repeat ~biweekly chronic. Phase 1/2 PA Q4 2023 reduced metabolic decompensations ~70%. Vantagens vs AAV gene therapy: redoseable (no anti-AAV antibodies), no integration risk, controllable. Limit: chronic regimen, expensive long-term. Concurrent: BionTech, Translate Bio (Sanofi acquired), CureVac.'
          en: 'mRNA protein-replacement therapy: paradigm of chronic dosing mRNA encoding the deficient enzyme (not a vaccine antigen). Moderna pipeline: mRNA-3927 propionic acidemia (PA, propionyl-CoA carboxylase PCCA/PCCB deficiency), mRNA-3705 methylmalonic acidemia (MMA-CB, MMUT), mRNA-3351 phenylketonuria (PAH), mRNA-3745 glycogen storage disease type 1a. LNP encapsulating mRNA + dual heteromeric subunits (e.g., PCCA+PCCB together) IV → liver hepatocytes → translate enzyme → metabolize substrate. Repeat ~biweekly chronic. Phase 1/2 PA Q4 2023 reduced metabolic decompensations ~70%. Advantages vs AAV gene therapy: redoseable (no anti-AAV antibodies), no integration risk, controllable. Limit: chronic regimen, expensive long-term. Concurrent: BionTech, Translate Bio (acquired by Sanofi), CureVac.'
        objectives: [mRNA protein replacement]
      - type: choice
        difficulty: 5
        question:
          pt: 5′ cap modification (m7G + cap-1) function em mRNA terapêutico é…
          en: 5′ cap modification (m7G + cap-1) function in therapeutic mRNA is…
        choices:
          - Recognized by eIF4E for translation initiation and prevents detection by RIG-I as foreign, increasing translation efficiency and reducing innate immune sensing
          - Blocks ribosome binding to prevent translation
          - Targets mRNA exclusively for nuclear retention
          - Required for reverse transcription into DNA
        correctAnswer: Recognized by eIF4E for translation initiation and prevents detection by RIG-I as foreign, increasing translation efficiency and reducing innate immune sensing
        rationale:
          pt: '5′ cap mRNA: m7GpppN (7-methylguanosine triphosphate-linked to first nucleotide). Cap-0: m7Gppp + N (não 2′-O-methyl). Cap-1: m7Gppp + Nm (2′-O-methylated first nucleotide) — distinguishable cellular self-mRNA via 2′-O-methylation; sem 2′-O-Me → recognized by RIG-I/MDA5/IFIT1 → IFN response. Production therapeutic mRNA: enzymatic capping (Vaccinia VCE, NEB) ou co-transcriptional cap analog (CleanCap AG/m1Ψ Trilink AG analog gives Cap-1 directly during transcription). eIF4E recognizes m7G → recruits eIF4G → eIF4F complex → ribosome scanning AUG initiation. Cap quality critical translation efficiency: ARCA anti-reverse cap analog ensures correct orientation. Modified caps also less susceptible decapping enzymes → longer half-life. Combined with poly(A) tail (~120nt optimal), UTRs (Moderna proprietary 5′/3′-UTRs from screens), m1Ψ → composite mRNA design.'
          en: '5′ cap of mRNA: m7GpppN (7-methylguanosine triphosphate-linked to the first nucleotide). Cap-0: m7Gppp + N (no 2′-O-methyl). Cap-1: m7Gppp + Nm (2′-O-methylated first nucleotide) — cellular self-mRNA distinguishable via 2′-O-methylation; without 2′-O-Me → recognized by RIG-I/MDA5/IFIT1 → IFN response. Production of therapeutic mRNA: enzymatic capping (Vaccinia VCE, NEB) or co-transcriptional cap analog (CleanCap AG/m1Ψ Trilink AG analog gives Cap-1 directly during transcription). eIF4E recognizes m7G → recruits eIF4G → eIF4F complex → ribosome scanning AUG initiation. Cap quality is critical for translation efficiency: ARCA anti-reverse cap analog ensures correct orientation. Modified caps are also less susceptible to decapping enzymes → longer half-life. Combined with poly(A) tail (~120 nt optimal), UTRs (Moderna proprietary 5′/3′-UTRs from screens), m1Ψ → composite mRNA design.'
        objectives: [5 cap mRNA]
      - type: choice
        difficulty: 5
        question:
          pt: CureVac CV2CoV vs BNT162b2 lessons (Nature 2021+) showed…
          en: CureVac CV2CoV vs BNT162b2 lessons (Nature 2021+) showed…
        choices:
          - Unmodified uridine mRNA (CureVac) was less effective than nucleoside-modified mRNA, validating the importance of m1Ψ for efficacy and tolerability
          - Both unmodified and modified mRNA achieved identical efficacy in pivotal trials
          - DNA vaccines outperformed all mRNA platforms
          - Live attenuated vaccines were superior to all mRNA in COVID-19 prevention
        correctAnswer: Unmodified uridine mRNA (CureVac) was less effective than nucleoside-modified mRNA, validating the importance of m1Ψ for efficacy and tolerability
        rationale:
          pt: 'CureVac CVnCoV (uridine não modificada) Phase 3 HERALD trial 2021: ~47% efficacy COVID prevention vs ~95% Pfizer/Moderna m1Ψ-mRNA. Failure attributed: dose-limiting reactogenicity (uridine RNA → strong TLR/IFN response → cytokine release → forced lower doses ~12µg vs 30-100µg modified competitors). Validated importance Karikó-Weissman m1Ψ. CureVac pivot Q3 2021 → CV2CoV second-gen with codon optimization, longer 3′-UTRs (still uridine) — partner GSK. Eventually CureVac mRNA-LNP platform sold/abandoned cancer + influenza programs. Lesson: nucleoside modification não optional, central component mRNA platform success. Subsequent companies (Arcturus saRNA different strategy: 1µg low-dose unmodified leverages amplification). Pfizer/BioNTech + Moderna duopoly modified mRNA.'
          en: 'CureVac CVnCoV (unmodified uridine) Phase 3 HERALD trial 2021: ~47% efficacy at COVID prevention vs ~95% for Pfizer/Moderna m1Ψ-mRNA. Failure attributed to: dose-limiting reactogenicity (uridine RNA → strong TLR/IFN response → cytokine release → forced lower doses ~12 µg vs 30-100 µg for modified competitors). Validated the importance of Karikó-Weissman m1Ψ. CureVac pivoted Q3 2021 → CV2CoV second-gen with codon optimization, longer 3′-UTRs (still uridine) — partnered with GSK. Eventually CureVac mRNA-LNP platform sold/abandoned cancer + influenza programs. Lesson: nucleoside modification is not optional, it is a central component of mRNA platform success. Subsequent companies (Arcturus saRNA) take a different strategy: 1 µg low-dose unmodified leverages amplification. Pfizer/BioNTech + Moderna form the modified-mRNA duopoly.'
        objectives: [CureVac unmodified]
      - type: choice
        difficulty: 5
        question:
          pt: GSK/CureVac mRNA influenza Lancet 2024 Phase 3 result foi…
          en: GSK/CureVac mRNA influenza Lancet 2024 Phase 3 result was…
        choices:
          - Modest efficacy below seasonal flu vaccine standards underscoring delivery and antigen-design challenges for mRNA flu vaccines
          - Superior efficacy to all approved flu vaccines confirming dominance
          - Identical efficacy to placebo in all subgroups
          - Approved by FDA in 2024 as first-in-class mRNA flu vaccine
        correctAnswer: Modest efficacy below seasonal flu vaccine standards underscoring delivery and antigen-design challenges for mRNA flu vaccines
        rationale:
          pt: 'mRNA influenza vaccines lessons 2024: GSK/CureVac modular mRNA flu Phase 3 disappointing — efficacy modest below seasonal vaccine standards. Moderna mRNA-1010 quadrivalent flu Phase 3 2023 results: similar/marginal vs standard inactivated, certain strains worse. Pfizer mRNA flu Phase 3 também mixed. Hipóteses: delivery LNP IM less efficient mucosal/respiratory immunity flu (vs SARS-CoV-2 systemic primarily), antigen choice (full-length HA vs stabilized stem broader), pre-existing immunity older adults baseline. Combo COVID + flu (Moderna mRNA-1083): potential bundle Phase 3 ongoing. Field humbling — não all viruses equally amenable mRNA platform. Active research: stem-targeting universal flu (Krammer Mt Sinai), self-amplifying flu, intranasal mRNA via different vectors. Translation slower than COVID expectations.'
          en: 'mRNA influenza vaccines lessons 2024: GSK/CureVac modular mRNA flu Phase 3 disappointing — efficacy modest below seasonal vaccine standards. Moderna mRNA-1010 quadrivalent flu Phase 3 2023 results: similar/marginal vs standard inactivated, worse for certain strains. Pfizer mRNA flu Phase 3 also mixed. Hypotheses: LNP IM delivery less efficient for mucosal/respiratory flu immunity (vs SARS-CoV-2 primarily systemic), antigen choice (full-length HA vs broader stabilized stem), pre-existing immunity in older adults at baseline. Combo COVID + flu (Moderna mRNA-1083): potential bundle, Phase 3 ongoing. Field is humbling — not all viruses are equally amenable to the mRNA platform. Active research: stem-targeting universal flu (Krammer Mt Sinai), self-amplifying flu, intranasal mRNA via different vectors. Translation is slower than post-COVID expectations.'
        objectives: [mRNA flu challenges]
      - type: choice
        difficulty: 5
        question:
          pt: mRNA cold-chain challenges enabled a evolução para…
          en: mRNA cold-chain challenges enabled the evolution toward…
        choices:
          - Lyophilized formulations and improved LNPs allowing 2-8°C refrigeration with multi-month stability instead of -70°C ultracold
          - Mandatory permanent -196°C liquid nitrogen storage for all mRNA products
          - Dry powder inhalers replacing all injection routes
          - Oral mRNA tablets replacing parenteral delivery entirely
        correctAnswer: Lyophilized formulations and improved LNPs allowing 2-8°C refrigeration with multi-month stability instead of -70°C ultracold
        rationale:
          pt: 'Cold-chain mRNA evolution: BNT162b2 launch 2020 requereu -70°C ultra-cold (dry ice + special freezers logistics) → barrier global access. Moderna mRNA-1273 -20°C (standard freezer). Iterations subsequent improvements: optimizing LNP composition (specific ionizable lipids ALC-0315 BioNTech, SM-102 Moderna), buffer formulations (sucrose, trehalose cryoprotectants), reduced shear stress manufacturing. Updated Comirnaty 2023 thawed 2-8°C 10 weeks storage. Lyophilized mRNA-LNP development active 2024: Pfizer, Moderna, Arcturus partial freeze-drying — multi-month room-temperature stability potential. Goal access LMICs sem expensive cold-chain. CureVac CV2CoV refrigerator-stable was selling point. Gavi/COVAX procurement constraints highlighted. Innovation ongoing critical pandemic preparedness.'
          en: 'Cold-chain mRNA evolution: BNT162b2 launch 2020 required -70 °C ultra-cold (dry ice + special freezers logistics) → barrier to global access. Moderna mRNA-1273 -20 °C (standard freezer). Subsequent iterations of improvements: optimizing LNP composition (specific ionizable lipids ALC-0315 BioNTech, SM-102 Moderna), buffer formulations (sucrose, trehalose cryoprotectants), reduced shear stress in manufacturing. Updated Comirnaty 2023 thawed 2-8 °C 10 weeks storage. Lyophilized mRNA-LNP development active 2024: Pfizer, Moderna, Arcturus partial freeze-drying — multi-month room-temperature stability potential. Goal: access in LMICs without expensive cold chain. CureVac CV2CoV refrigerator-stable was a selling point. Gavi/COVAX procurement constraints highlighted. Innovation ongoing — critical for pandemic preparedness.'
        objectives: [mRNA cold chain]
      - type: choice
        difficulty: 5
        question:
          pt: BioNTech/Moderna mRNA cancer vaccines vs neoantigen peptide vaccines vantagem é…
          en: BioNTech/Moderna mRNA cancer vaccines vs neoantigen peptide vaccines advantage is…
        choices:
          - mRNA permits encoding many neoantigens in a single string-of-beads construct, faster manufacturing per patient than synthetic peptide pools, and intracellular MHC-I presentation
          - mRNA platforms encode fewer neoantigens than peptides per patient construct
          - Peptide vaccines induce stronger responses than mRNA in all clinical trials
          - mRNA approach requires longer manufacturing turnaround than synthetic peptides
        correctAnswer: mRNA permits encoding many neoantigens in a single string-of-beads construct, faster manufacturing per patient than synthetic peptide pools, and intracellular MHC-I presentation
        rationale:
          pt: 'Personalized cancer vaccines comparison: peptide vaccines (Ott Wu Catanzaro Snyder Nature 2017 melanoma 6/6 patients responses, NeoVax) vs mRNA platforms (Moderna mRNA-4157 ~34 antigens/construct, BioNTech BNT122). mRNA vantagens: encode dezenas mutations single construct (string-of-beads design — 25-mer epitopes linked by glycine-serine spacers), translation produces intracellular protein → endogenous MHC-I processing → CD8+ T cells (vs peptide cross-presentation dendritic cells less efficient para CD8 priming). Manufacturing: synthesize one mRNA (~1 dia) vs synthesize 30+ peptides individually (slower, expensive, hydrophobic peptides difficult). mRNA per-patient manufacturing turnaround ~6 weeks (Moderna) vs ~12-16 weeks peptide. Trade-off: mRNA requires LNP cold-chain infrastructure peptides simpler. Both fields complementary; mRNA ascendant 2023+.'
          en: 'Personalized cancer vaccines comparison: peptide vaccines (Ott Wu Catanzaro Snyder Nature 2017 melanoma 6/6 patients responses, NeoVax) vs mRNA platforms (Moderna mRNA-4157 ~34 antigens/construct, BioNTech BNT122). mRNA advantages: encode dozens of mutations in a single construct (string-of-beads design — 25-mer epitopes linked by glycine-serine spacers), translation produces intracellular protein → endogenous MHC-I processing → CD8+ T cells (vs peptide cross-presentation by dendritic cells, less efficient for CD8 priming). Manufacturing: synthesize one mRNA (~1 day) vs synthesize 30+ peptides individually (slower, expensive, hydrophobic peptides difficult). mRNA per-patient manufacturing turnaround ~6 weeks (Moderna) vs ~12-16 weeks for peptides. Trade-off: mRNA requires LNP cold-chain infrastructure, peptides simpler. Both fields complementary; mRNA ascendant 2023+.'
        objectives: [mRNA vs peptide vaccines]
  - title:
      pt: Página 2 — Imunoterapia oncológica avançada
      en: Page 2 — Advanced cancer immunotherapy
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Honjo/Allison Nobel Medicina 2018 reconheceu…
          en: 2018 Nobel in Medicine to Honjo/Allison recognized…
        choices:
          - Discovery of immune checkpoint inhibition (CTLA-4, PD-1) as a cancer therapy approach, transforming oncology with anti-PD-1/PD-L1 and anti-CTLA-4 antibodies
          - Development of CAR-T cells for B-cell malignancies
          - Discovery of HER2 and trastuzumab development
          - Identification of BRCA1/BRCA2 hereditary cancer genes
        correctAnswer: Discovery of immune checkpoint inhibition (CTLA-4, PD-1) as a cancer therapy approach, transforming oncology with anti-PD-1/PD-L1 and anti-CTLA-4 antibodies
        rationale:
          pt: 'Nobel Medicine 2018 — James Allison (MD Anderson, ex-Berkeley) + Tasuku Honjo (Kyoto Univ) "for their discovery of cancer therapy by inhibition of negative immune regulation". Allison: CTLA-4 (cytotoxic T-lymphocyte-associated protein 4) inhibitory receptor T cells (Krummel/Allison Science 1996). Anti-CTLA-4 antibody → T-cell activation → tumor regression mouse 1996; clinical ipilimumab (Bristol-Myers Squibb) FDA approval 2011 metastatic melanoma. Honjo: PD-1 (programmed death-1) Ishida 1992; PD-L1 ligand. Nivolumab/pembrolizumab anti-PD-1 FDA 2014. Anti-PD-L1: atezolizumab, durvalumab, avelumab. Field exploded — múltiplas indications ($30B+ market). Combinação ipi+nivo (anti-CTLA-4 + anti-PD-1) standard advanced melanoma. Limitations: ~20-40% response rates típico, hyperprogression alguns, immune-related adverse events (irAEs).'
          en: '2018 Nobel in Medicine — James Allison (MD Anderson, ex-Berkeley) + Tasuku Honjo (Kyoto Univ) "for their discovery of cancer therapy by inhibition of negative immune regulation". Allison: CTLA-4 (cytotoxic T-lymphocyte-associated protein 4) inhibitory receptor on T cells (Krummel/Allison Science 1996). Anti-CTLA-4 antibody → T-cell activation → tumor regression in mouse 1996; clinical ipilimumab (Bristol-Myers Squibb) FDA approval 2011 metastatic melanoma. Honjo: PD-1 (programmed death-1) Ishida 1992; PD-L1 ligand. Nivolumab/pembrolizumab anti-PD-1 FDA 2014. Anti-PD-L1: atezolizumab, durvalumab, avelumab. Field exploded — multiple indications ($30B+ market). Combination ipi+nivo (anti-CTLA-4 + anti-PD-1) is standard for advanced melanoma. Limitations: typically ~20-40% response rates, hyperprogression in some, immune-related adverse events (irAEs).'
        objectives: [Nobel 2018 checkpoint]
