          pt: Bispecific T-cell engagers (BiTE, blinatumomab Blincyto FDA 2014) mecanismo é…
          en: Bispecific T-cell engagers (BiTE, blinatumomab Blincyto FDA 2014) mechanism is…
        choices:
          - Recombinant antibody linking CD19 on B cells to CD3 on T cells, redirecting T-cell cytotoxicity without genetic engineering
          - Genetically engineered patient T cells with chimeric antigen receptor
