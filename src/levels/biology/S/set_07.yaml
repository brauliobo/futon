        correctAnswer: Patient T cells engineered with chimeric antigen receptor recognizing CD19 on B-cell malignancies, MHC-independent killing of CD19+ cells
        rationale:
          pt: 'CAR-T (Chimeric Antigen Receptor T cell): patient autologous T cells extracted via leukapheresis → ex vivo lentiviral transduction CAR construct (anti-CD19 scFv + CD8 hinge/transmembrane + 4-1BB ou CD28 costimulatory + CD3ζ signaling) → expand → reinfuse após lymphodepleting chemo (fludarabine + cyclophosphamide). MHC-independent recognition CD19 surface antigen → cytotoxicity B-cell tumors. FDA approvals: Kymriah (tisagenlecleucel Novartis, originated Penn Carl June Bruce Levine) ALL pediatric 2017 + adult DLBCL 2018; Yescarta (axicabtagene Kite/Gilead, originated NCI Steven Rosenberg James Kochenderfer) adult DLBCL 2017. Subsequent: Tecartus (mantle cell), Breyanzi, Carvykti (BCMA myeloma), Abecma (BCMA). ORR ~70-90% B-ALL, durable complete responses ~40-60%. Toxicities: cytokine release syndrome (CRS), neurotoxicity (ICANS), B-cell aplasia. Future: solid tumors challenge.'
          en: 'CAR-T (Chimeric Antigen Receptor T cell): patient autologous T cells extracted via leukapheresis → ex vivo lentiviral transduction with CAR construct (anti-CD19 scFv + CD8 hinge/transmembrane + 4-1BB or CD28 costimulatory + CD3ζ signaling) → expanded → reinfused after lymphodepleting chemo (fludarabine + cyclophosphamide). MHC-independent recognition of CD19 surface antigen → cytotoxicity against B-cell tumors. FDA approvals: Kymriah (tisagenlecleucel Novartis, originated at Penn with Carl June Bruce Levine) pediatric ALL 2017 + adult DLBCL 2018; Yescarta (axicabtagene Kite/Gilead, originated at NCI with Steven Rosenberg James Kochenderfer) adult DLBCL 2017. Subsequent: Tecartus (mantle cell), Breyanzi, Carvykti (BCMA myeloma), Abecma (BCMA). ORR ~70-90% in B-ALL, durable complete responses ~40-60%. Toxicities: cytokine release syndrome (CRS), neurotoxicity (ICANS), B-cell aplasia. Future: solid tumors remain a challenge.'
