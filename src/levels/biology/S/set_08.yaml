          - Bulk transcriptomic atlas of every human tissue
        correctAnswer: First gapless human genome (T2T-CHM13) covering centromeres, rDNA arrays, and segmental duplications previously missing from GRCh38
        rationale:
          pt: 'T2T Consortium (Nurk Koren Rhie Rautiainen Bzikadze Mikheenko Vollger Altemose Uralsky Gershman Aganezov Hoyt Diekhans Logsdon Alonge Antonarakis Borchers Bouffard Brooks Caldas Chen Cheng Compton Costanzo Crinklaw Davis Diekhans Dishuck Dougherty Dreszer Dunn Ebert Ebler Edge Ferrer Filichkin Frith Galante Gao Gee Gershman Goerz Goloborodko Graves-Lindsay Guest Hagey Halabian Hall Hansen Harris Hatamian Heard Hilbert Hoyt Hourlier Hsu Hung Hwang Jain Jangir Jarvis Jayakumar Jha Jones Joseph Karolchik Kelley Kesidis Kim Kim Kong Korlach Kothari Krogan Kronenberg Lansdorp Lapidus Lasser Latorre Layer Leeb Leshner Lewis Linde Liu Logsdon Lou Lowy-Gallego Lukyanchikova Mahmoud Maiden Marin-Acevedo Marini Marshall Maslan Matthews McCabe McDaniel McEwen Medvedev Meeks Meredith Miller Millman Misiarz Moh Mohan Moncrief Monlong Moore Morrison Mountain Mwoman Nagai Naranjo Neale Neely Negi Nguyen Nik-Zainal Niu Norton Novalin Nye Nyovat Olshen Onishi Pace Padillarivera Park Pavlou Pavlovic Peart Peizhen Penacchio Phillippy Pomerantz Porubsky Prager Prokopenko Pulit Quinn Razzhivina Reedy Reichelt Reverdy Rey Rhie Roach Robertson Robles-Espinoza Rodriguez Rolph Sanchez Sankaran Sasaki Schedl Schenz Schlenker Schloss Schueler Schulman Schwartz Scott Searcy Seliverstov Sergeyev Sergushichev Sgrelli Shafin Sharp Shen Shum Sinha Skvortsov Smith Soldatov Steinberg Stewart Strecker Sukhwani Sun Sun Talbert Tang Tassi Tatum Taubmann Telenti Theiss Thibaud-Nissen Thielen Tilley Travesa Triplett Trundle Trzcinski Tutuncu Vakhrushev Vasilevsky Vincze Walker Wang Wang Wang Wansing Watanabe Wendt Werner Whitaker Wilkinson Williamson Wong Wood Yang Yashin Ye Yee Yost Zarate Zhang Zhang Zhang Zheng Zhou Zikic Zimin Hoyt Eichler Salzberg Schatz Wang Phillippy NHGRI Science 2022 abril): primeira complete human genome — T2T-CHM13 hydatidiform mole haploid cell line (gestational tissue uniform haploid, simpler assembly). Long-read PacBio HiFi + Oxford Nanopore Ultra-Long. Includes ~200Mb new sequence GRCh38 missing: centromeric satellites, rDNA arrays (acrocentric chromosomes), segmental duplications, immunoglobulin/HLA. Subsequent T2T-Y 2023 male Y chromosome, HPRC pangenome 2023 47 individuals. Foundation: complete reference end era ~20 years post-HGP draft 2001/2003.'
