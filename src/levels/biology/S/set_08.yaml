      - type: choice
        difficulty: 5
        question:
          pt: Vowst (Seres Therapeutics SER-109 FDA 2023) e Rebyota (Ferring 2022) são…
          en: Vowst (Seres Therapeutics SER-109 FDA 2023) and Rebyota (Ferring 2022) are…
        choices:
          - First FDA-approved microbiome therapeutics — donor-derived live biotherapeutic products preventing recurrent C. difficile infection by restoring gut Firmicutes
          - Antibiotics used to treat C. difficile via direct bacterial killing
          - Vaccines against C. difficile based on toxin antigens
          - Engineered probiotics from a single recombinant strain
        correctAnswer: First FDA-approved microbiome therapeutics — donor-derived live biotherapeutic products preventing recurrent C. difficile infection by restoring gut Firmicutes
        rationale:
          pt: 'First-generation microbiome therapeutics: Rebyota (RBX2660 Ferring/Rebiotix) FDA approval novembro 2022 — fecal microbiota transplant rectal enema, donor-derived. Vowst (SER-109 Seres Therapeutics) FDA approval abril 2023 — first oral microbiome capsule, purified Firmicutes spores from donor stool. Indication: prevention recurrent C. difficile infection (rCDI) following antibiotic treatment. Mechanism: restore competitive gut microbiome ecosystem displacing C. difficile, restoring bile-acid metabolism, secondary bile acids inhibit C. difficile germination. Phase 3 trials: ~12 weeks rCDI rates ~12% vs ~40% placebo. Donor-derived → screening rigorous (pathogens, transmissible disease). Predecessor: classical FMT (fecal microbiota transplant) compounded fresh donor stool, used decades clinically. Marketing 2023+: Vowst Seres struggled, sold pivot 2024. Future: defined-consortium products (Vedanta VE303, Finch).'
          en: 'First-generation microbiome therapeutics: Rebyota (RBX2660 Ferring/Rebiotix) FDA approval November 2022 — fecal microbiota transplant rectal enema, donor-derived. Vowst (SER-109 Seres Therapeutics) FDA approval April 2023 — first oral microbiome capsule, purified Firmicutes spores from donor stool. Indication: prevention of recurrent C. difficile infection (rCDI) following antibiotic treatment. Mechanism: restore competitive gut microbiome ecosystem displacing C. difficile, restoring bile-acid metabolism, secondary bile acids inhibit C. difficile germination. Phase 3 trials: ~12-week rCDI rates ~12% vs ~40% placebo. Donor-derived → rigorous screening (pathogens, transmissible disease). Predecessor: classical FMT (fecal microbiota transplant) compounded from fresh donor stool, used clinically for decades. Marketing 2023+: Vowst Seres struggled, sold pivot 2024. Future: defined-consortium products (Vedanta VE303, Finch).'
        objectives: [Vowst Rebyota microbiome]
