  - title:
      pt: Página 1 — Síntese de genomas
      en: Page 1 — Genome synthesis
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: JCVI Syn3.0 (Hutchison/Venter Science 2016) achievement foi…
          en: JCVI Syn3.0 (Hutchison/Venter Science 2016) achievement was…
        choices:
          - Minimal viable bacterial genome (~531 kbp, 473 genes) — smallest known self-replicating cell genome, defining a near-essential gene set
          - Removal of all DNA from a bacterial cell while preserving replication
          - Largest synthetic genome ever assembled at ~10 Mbp
          - First eukaryotic minimal genome in S. cerevisiae
        correctAnswer: Minimal viable bacterial genome (~531 kbp, 473 genes) — smallest known self-replicating cell genome, defining a near-essential gene set
        rationale:
          pt: 'JCVI Syn3.0 (Hutchison Chuang Noskov Assad-Garcia Deerinck Ellisman Gill Kannan Karas Ma Pelletier Qi Richter Strychalski Sun Suzuki Tsvetanova Wise Smith Glass Merryman Gibson Venter Science 2016): minimal viable Mycoplasma mycoides genome — ~531 kbp, 473 protein-coding genes (vs ~901 Syn1.0). Iterative design-build-test: deletion experiments transposon mutagenesis identified essential vs quasi-essential vs non-essential. Reconstrução em 8 segmentos. ~149 genes (~32%) ainda unknown function — fundamentos vida ainda incompletos. Smallest known self-replicating cell genome (Mycoplasma genitalium 525kbp ~482 genes natural). Doubling time ~3hrs (vs M. mycoides ~1hr). Subsequent Syn3A 2021 (Breuer Pelletier elongated cell shape). Foundation for build-up additions purposeful — SBOL standardization synthetic biology design language. Aplicações: chassis minimal designed circuits, biosafety contained synthetic life, fundamental biology questions.'
          en: 'JCVI Syn3.0 (Hutchison Chuang Noskov Assad-Garcia Deerinck Ellisman Gill Kannan Karas Ma Pelletier Qi Richter Strychalski Sun Suzuki Tsvetanova Wise Smith Glass Merryman Gibson Venter Science 2016): minimal viable Mycoplasma mycoides genome — ~531 kbp, 473 protein-coding genes (vs ~901 in Syn1.0). Iterative design-build-test: deletion experiments by transposon mutagenesis identified essential vs quasi-essential vs non-essential. Reconstructed in 8 segments. ~149 genes (~32%) still of unknown function — fundamentals of life are still incomplete. Smallest known self-replicating cell genome (Mycoplasma genitalium 525 kbp ~482 genes natural). Doubling time ~3 hrs (vs M. mycoides ~1 hr). Subsequent Syn3A 2021 (Breuer Pelletier elongated cell shape). Foundation for build-up additions purposeful — SBOL standardization of synthetic biology design language. Applications: chassis for minimal designed circuits, biosafety-contained synthetic life, fundamental biology questions.'
        objectives: [Syn3.0 minimal]
      - type: choice
        difficulty: 5
        question:
          pt: Sc2.0 (synthetic yeast, Boeke + international consortium Cell 2023) é…
          en: Sc2.0 (synthetic yeast, Boeke + international consortium Cell 2023) is…
        choices:
          - First fully synthetic eukaryotic genome — redesigned 16 chromosomes of S. cerevisiae with loxPsym sites enabling SCRaMbLE genome shuffling
          - Synthetic prokaryotic genome based on E. coli
          - Computer-only simulation of yeast genome without physical assembly
          - Single chromosome rewrite of yeast chromosome III only
        correctAnswer: First fully synthetic eukaryotic genome — redesigned 16 chromosomes of S. cerevisiae with loxPsym sites enabling SCRaMbLE genome shuffling
        rationale:
          pt: 'Sc2.0 (Synthetic Yeast Genome Project, Boeke NYU + international ~12 labs Edinburgh, Tsinghua, JHU, Imperial, etc, founded 2007): synthesized 16 designer chromosomes (~12 Mbp total) S. cerevisiae. Design changes: removed introns, retrotransposons, tRNA genes (relocated specialized neochromosome), recoded TAA stop codons, inserted loxPsym sites every ~3kb (allows SCRaMbLE — synthetic chromosome rearrangement and modification by loxP-mediated evolution → rapid genome shuffling adaptive evolution). Synthesized in 750bp Building Blocks → 10kb minichunks → 30-60kb chunks. Final integration via SwAP-In replacement. 2023 Cell suite + 2024 papers: complete genome synthesis assembly accomplished. Largest engineered eukaryotic genome até now. Foundation: directed evolution (SCRaMbLE library mining), pathway engineering, fundamental yeast biology. Boeke Jef NYU Langone leadership decade+. International consortium model bigscience.'
          en: 'Sc2.0 (Synthetic Yeast Genome Project, Boeke NYU + international ~12 labs Edinburgh, Tsinghua, JHU, Imperial, etc, founded 2007): synthesized 16 designer chromosomes (~12 Mbp total) of S. cerevisiae. Design changes: removed introns, retrotransposons, tRNA genes (relocated to a specialized neochromosome), recoded TAA stop codons, inserted loxPsym sites every ~3kb (allows SCRaMbLE — synthetic chromosome rearrangement and modification by loxP-mediated evolution → rapid genome shuffling adaptive evolution). Synthesized in 750bp Building Blocks → 10kb minichunks → 30-60kb chunks. Final integration via SwAP-In replacement. 2023 Cell suite + 2024 papers: complete genome synthesis assembly accomplished. Largest engineered eukaryotic genome to date. Foundation for: directed evolution (SCRaMbLE library mining), pathway engineering, fundamental yeast biology. Jef Boeke NYU Langone has led for over a decade. International consortium model of big-science.'
        objectives: [Sc2.0]
      - type: choice
        difficulty: 5
        question:
          pt: Recoded E. coli C321 (Lajoie/Isaacs/Church Science 2013) achievement foi…
          en: Recoded E. coli C321 (Lajoie/Isaacs/Church Science 2013) achievement was…
        choices:
          - Genome-wide replacement of all 321 TAG amber stop codons with TAA, freeing TAG for non-canonical amino acid incorporation in vivo
          - Random codon shuffling without functional impact on any genes
          - Single-codon swap at one locus only
          - Replacement of all stop codons across all three classes simultaneously
        correctAnswer: Genome-wide replacement of all 321 TAG amber stop codons with TAA, freeing TAG for non-canonical amino acid incorporation in vivo
        rationale:
          pt: 'C321.ΔA (Lajoie Rovner Goodman Aerni Haimovich Kuznetsov Mercer Wang Stracquadanio Amiram Bonneau Aitken Ahn Boeke Carmel-Harel Carr Dunn Helman Gibson Tolonen Wu Bartik Carr Heffernan Daniels Chum Hentges Chouvet Wang Hutchings Jain Sleator Sterling Mosberg Whittaker Liu Singh Jakobson Konnova Way Rinehart Conway Sodergren Tsherniak Jewett Forster Krummel Fischbach Voigt Jacobson Lewis Caputo Gardner Heinemann Shoulders Karpel Park Phillips Rinehart Sherwood Patriarca Gosling Burgess Smith Glass Merryman Beck Chiang Stupple Sehnal Allen Bedford Calhoun Mehta Wilkinson Ostrov Ellis-Hutchings Gershater Boeke Wong Stoyles Jewett Schultz Hochuli Strain Yeates Chestnut Zane Liss Smith Ostrov Liang Niebuhr Pulkkinen Neumann Wood Schimmel Niquille Pham Lin Dyer Lemay Krug Lin Goyal Anikst Chuang Voigt Holley Conway Ramey Schein Lipp Dyer Bagrov Bhagat Brik Cetra Edrich Frey Galloway Husson Kuhlmann Park Pizzino Pratt-Riccio Rao Slovak Trapasso Vakili Vipulanantham Yeoh Lim Mu Poelmans Senger Stalmasek Walsh Yang Zellner Hirano Lieberman Zhuang Skipper Mukai Whitehead Hochuli Way Church Science 2013): primeira genome-wide codon replacement E. coli MG1655. Substituiu todas as 321 TAG amber stop codons → TAA stop. Released release factor RF1 (TAG-specific) deletion → TAG agora available reassignment via orthogonal aminoacyl-tRNA synthetase + tRNA pair (e.g., Methanosarcina pyrrolysyl-tRNA synthetase) → incorporate non-canonical amino acids (ncAAs) site-specifically. ncAAs: phototrigger, click chemistry, fluorescent. Aplicações: enhanced biocontainment (synthetic auxotrophy ncAAs Mandell 2015), proteome expansion, virus resistance partial (T7 phage uses TAG). Foundational genome-scale recoding. Subsequent: Syn61 Chin reduces 64 → 61 codons.'
          en: 'C321.ΔA (Lajoie Isaacs Church Science 2013): first genome-wide codon replacement in E. coli MG1655. Replaced all 321 TAG amber stop codons → TAA stop. Released release factor RF1 (TAG-specific) deletion → TAG now available for reassignment via orthogonal aminoacyl-tRNA synthetase + tRNA pair (e.g., Methanosarcina pyrrolysyl-tRNA synthetase) → incorporates non-canonical amino acids (ncAAs) site-specifically. ncAAs: phototriggers, click chemistry, fluorescent. Applications: enhanced biocontainment (synthetic auxotrophy ncAAs Mandell 2015), proteome expansion, partial virus resistance (T7 phage uses TAG). Foundational genome-scale recoding. Subsequent: Syn61 Chin reduces 64 → 61 codons.'
        objectives: [C321 recoded]
      - type: choice
        difficulty: 5
        question:
          pt: Syn61 (Fredens/Chin MRC-LMB Nature 2019) é…
          en: Syn61 (Fredens/Chin MRC-LMB Nature 2019) is…
        choices:
          - E. coli with all serine TCG/TCA codons and TAG stop replaced, reducing the genetic code to 61 codons and freeing 3 codons for non-canonical amino acid incorporation
          - First E. coli with classical 64-codon genetic code without modifications
          - Yeast strain with synthetic chromosome only
          - Mammalian cell line with reduced codon usage
        correctAnswer: E. coli with all serine TCG/TCA codons and TAG stop replaced, reducing the genetic code to 61 codons and freeing 3 codons for non-canonical amino acid incorporation
        rationale:
          pt: 'Syn61 (Fredens Wang de la Torre Funke Robertson Christova Chia Schmied Dunkelmann Beránek Uttamapinant Llamazares Elliott Chin MRC Laboratory of Molecular Biology Cambridge Nature 2019): synthesized E. coli MG1655 com ~4Mbp genome refactored. Substituições: all TCG → AGC, all TCA → AGT (both encode serine), all TAG → TAA stop. Genetic code reduced 64 → 61 functional codons. Liberou 3 codons (TCG, TCA, TAG) → reassignable. Subsequent Syn61Δ3 (Robertson 2021) deleted serT (TCG-tRNA), serU (TCA-tRNA), prfA (RF1 release factor TAG) → fully blanked codons → reassigned ncAAs encoding non-canonical amino acids → polymers ribosomally synthesized de macrocyclic peptides therapeutic potential. Resistance virus broad (phages relying TCG/TCA/TAG silenced). Jason Chin lab Cambridge — Nobel-trajectory expanded genetic code. Synthesized via REXER (replicon excision-mediated chromosomal exchange) iterative replacement. Foundation expanded biology xenobio.'
          en: 'Syn61 (Fredens Wang de la Torre Funke Robertson Christova Chia Schmied Dunkelmann Beránek Uttamapinant Llamazares Elliott Chin MRC Laboratory of Molecular Biology Cambridge Nature 2019): synthesized E. coli MG1655 with ~4 Mbp genome refactored. Replacements: all TCG → AGC, all TCA → AGT (both encode serine), all TAG → TAA stop. Genetic code reduced from 64 → 61 functional codons. Freed 3 codons (TCG, TCA, TAG) → reassignable. Subsequent Syn61Δ3 (Robertson 2021) deleted serT (TCG-tRNA), serU (TCA-tRNA), prfA (RF1 release factor TAG) → fully blanked codons → reassigned ncAAs encoding non-canonical amino acids → polymers ribosomally synthesized to macrocyclic peptides with therapeutic potential. Broad virus resistance (phages relying on TCG/TCA/TAG silenced). Jason Chin lab Cambridge — Nobel-trajectory expanded genetic code. Synthesized via REXER (replicon excision-mediated chromosomal exchange) iterative replacement. Foundation for expanded biology and xenobio.'
        objectives: [Syn61]
      - type: choice
        difficulty: 5
        question:
          pt: Genome Project-Write (GP-write, Boeke/Church/Yamazaki/Glass 2016) goal é…
          en: Genome Project-Write (GP-write, Boeke/Church/Yamazaki/Glass 2016) goal is…
        choices:
          - Pilot ambitious genome-engineering projects culminating in synthesis of full-size mammalian and plant genomes, with ultraviolet-resistant human cell line as flagship
          - Read every human genome on Earth one more time at higher coverage
          - Sequence remaining unsolved heterochromatin gaps in T2T assembly
          - Build a centralized DNA-storage service for archival data
        correctAnswer: Pilot ambitious genome-engineering projects culminating in synthesis of full-size mammalian and plant genomes, with ultraviolet-resistant human cell line as flagship
        rationale:
          pt: 'Genome Project-Write (GP-write): launched 2016 (Boeke Church Hessel Yamazaki Glass Voigt et al Science 2016 commentary). Successor conceptual ao Human Genome Project (read genomes) — write genomes. Goal: drop DNA synthesis cost 1000-fold over decade enabling synthesis full-size genomes including mammalian (human cell). Pilot project flagship: ultra-safe cell line (recoded human cell virus-resistant, ncAA-incorporating, biosafer). Center of Excellence for Engineering Biology nonprofit umbrella. Sub-projects: Sc2.0 yeast (Boeke), Recoded E. coli (Church/Isaacs), human chromosome 21 minimal (Boeke 2024 progress 2 Mbp section), virus-resistant cells (Liu Church Lajoie). Slow progress vs original 10-year vision — DNA synthesis costs declining slower than predicted (Twist ~$0.07/bp 2024 still). Ethical concerns: dual-use, germline. International consortia continued GP-write 2.0 reframe 2024.'
          en: 'Genome Project-Write (GP-write): launched 2016 (Boeke Church Hessel Yamazaki Glass Voigt et al Science 2016 commentary). Conceptual successor to the Human Genome Project (read genomes) — write genomes. Goal: drop DNA synthesis cost 1000-fold over a decade enabling synthesis of full-size genomes including mammalian (human cell). Pilot project flagship: ultra-safe cell line (recoded human cell virus-resistant, ncAA-incorporating, biosafer). Center of Excellence for Engineering Biology nonprofit umbrella. Sub-projects: Sc2.0 yeast (Boeke), Recoded E. coli (Church/Isaacs), human chromosome 21 minimal (Boeke 2024 progress on a 2 Mbp section), virus-resistant cells (Liu Church Lajoie). Slow progress vs original 10-year vision — DNA synthesis costs declining slower than predicted (Twist ~$0.07/bp 2024 still). Ethical concerns: dual-use, germline. International consortia continued in GP-write 2.0 reframe 2024.'
        objectives: [GP-write]
      - type: choice
        difficulty: 5
        question:
          pt: Enzymatic DNA synthesis (DNA Script, Ansa Biotechnologies) advantage é…
          en: Enzymatic DNA synthesis (DNA Script, Ansa Biotechnologies) advantage is…
        choices:
          - TdT-based enzymatic synthesis avoids harsh phosphoramidite chemistry, enabling longer oligos with fewer errors and water-only chemistry on benchtop instruments
          - Identical phosphoramidite chemistry as legacy methods
          - Production via random fragment shotgun ligation only
          - Synthesis exclusively of single nucleotide modifications without polymerization
        correctAnswer: TdT-based enzymatic synthesis avoids harsh phosphoramidite chemistry, enabling longer oligos with fewer errors and water-only chemistry on benchtop instruments
        rationale:
          pt: 'Enzymatic DNA synthesis (EDS): paradigm shift legacy phosphoramidite chemistry (Caruthers 1981 — sintetiza ~200nt DNA via 4 chemical steps per cycle, organic solvents acetonitrile, harsh conditions, depurination ~0.5%/cycle limita length). EDS approach: terminal deoxynucleotidyl transferase (TdT) DNA polymerase template-independent + reversibly blocked nucleotides (3′-OH protected). Cycle: enzymatic addition + wash + deblock. Companies: DNA Script (BioXp 9600 SYNTAX benchtop ~280nt sub-day), Ansa Biotechnologies (record longest enzymatic 1005nt 2023, GenScript partnership). Advantages: longer oligos (eventually >1kbp possible), fewer errors longer fragments, aqueous chemistry safer/greener, automation-friendly desktop unit. Subsequent: Roche Sequencing acquired EvonetiX, Twist Bioscience also exploring. Goal: democratize gene synthesis — research labs synthesize-on-demand. Field 2024 maturity emerging — cost competitive ~$0.10/bp scaling.'
          en: 'Enzymatic DNA synthesis (EDS): paradigm shift from legacy phosphoramidite chemistry (Caruthers 1981 — synthesizes ~200 nt DNA via 4 chemical steps per cycle, organic solvents like acetonitrile, harsh conditions, depurination ~0.5%/cycle limits length). EDS approach: terminal deoxynucleotidyl transferase (TdT) DNA polymerase template-independent + reversibly blocked nucleotides (3′-OH protected). Cycle: enzymatic addition + wash + deblock. Companies: DNA Script (BioXp 9600 SYNTAX benchtop ~280 nt sub-day), Ansa Biotechnologies (record longest enzymatic 1005 nt 2023, GenScript partnership). Advantages: longer oligos (eventually >1 kbp possible), fewer errors in longer fragments, aqueous chemistry safer/greener, automation-friendly desktop unit. Subsequent: Roche Sequencing acquired EvonetiX, Twist Bioscience also exploring. Goal: democratize gene synthesis — research labs synthesize-on-demand. Field 2024 maturity emerging — cost competitive ~$0.10/bp scaling.'
        objectives: [Enzymatic DNA synthesis]
      - type: choice
        difficulty: 5
        question:
          pt: Twist Bioscience silicon-based oligo array synthesis significância foi…
          en: Twist Bioscience silicon-based oligo array synthesis significance was…
        choices:
          - Miniaturizing phosphoramidite synthesis on silicon wafers ~10000 oligos in parallel, dropping gene-synthesis costs ~1-2 orders of magnitude vs column-based legacy
          - Identical column-based synthesis without process changes
          - Synthesis exclusively for diagnostics not gene engineering
          - Pure software platform without hardware innovation
        correctAnswer: Miniaturizing phosphoramidite synthesis on silicon wafers ~10000 oligos in parallel, dropping gene-synthesis costs ~1-2 orders of magnitude vs column-based legacy
        rationale:
          pt: 'Twist Bioscience (founded 2013, Emily Leproust CEO ex-Agilent): silicon-based array synthesis platform. Miniaturized wells ~10000 oligos parallel single chip → assemble genes via inkjet-style nanoscale chemistry. Cost ~$0.07-0.09/bp 2024 (vs ~$0.20-0.50/bp column-based legacy IDT, GenScript). Throughput ~millions oligos/day. Aplicações: gene synthesis academia + industry, NGS library prep adapters, antibody phage display libraries (1B+ variants), DNA storage. Twist Antibody Optimization (TAO) early-stage drug discovery. IPO 2018, market leadership ~50% gene synthesis market. Concurrent: GenScript (China-based market leader), Eurofins, IDT. Limit: phosphoramidite chemistry limits ~200nt single oligos → assembly Gibson Klenow PCR multistep. Enzymatic synthesis (DNA Script, Ansa) potential disruptor next decade. Twist 2024 ~$200M revenue, expanding biopharma services.'
          en: 'Twist Bioscience (founded 2013, Emily Leproust CEO ex-Agilent): silicon-based array synthesis platform. Miniaturized wells ~10000 oligos in parallel on a single chip → assemble genes via inkjet-style nanoscale chemistry. Cost ~$0.07-0.09/bp 2024 (vs ~$0.20-0.50/bp column-based legacy IDT, GenScript). Throughput ~millions of oligos/day. Applications: gene synthesis for academia + industry, NGS library-prep adapters, antibody phage-display libraries (1B+ variants), DNA storage. Twist Antibody Optimization (TAO) early-stage drug discovery. IPO 2018, market leadership ~50% gene-synthesis market. Concurrent: GenScript (China-based market leader), Eurofins, IDT. Limit: phosphoramidite chemistry limits ~200 nt single oligos → assembly Gibson Klenow PCR multistep. Enzymatic synthesis (DNA Script, Ansa) potential disruptor in next decade. Twist 2024 ~$200M revenue, expanding biopharma services.'
        objectives: [Twist Bioscience]
      - type: choice
        difficulty: 5
        question:
          pt: Human Pangenome Reference (HPRC Nature 2023) advance é…
          en: Human Pangenome Reference (HPRC Nature 2023) advance is…
        choices:
          - Graph-based pangenome from 47 phased diploid haplotype assemblies capturing structural diversity missed by linear GRCh38 reference
          - Single-ancestry linear reference identical to GRCh38
          - Mouse-only multi-strain assembly without human data
          - Bulk SNP catalog without long-range haplotype information
        correctAnswer: Graph-based pangenome from 47 phased diploid haplotype assemblies capturing structural diversity missed by linear GRCh38 reference
        rationale:
          pt: 'Human Pangenome Reference Consortium (HPRC) Nature 2023 (Liao Asri Ebler Doerr Haukness Hickey Lu Lucas Monlong Abel Buonaiuto Chang Cheng Chu Colonna Eizenga Feng Fischer Fulton Garg Groza Guarracino Harvey Heumos Howe Jain Lu Markello Martin Mitchell Norman Olsen Pesout Porubsky Prins Redon Rolando Roussou Salama Stewart Watkins Workman Yang Yu Zeng Mwaniki Bauer Genome10K HPRC ARC Sanger NHGRI Nature 2023 abr): graph-based pangenome assembled from 47 phased diploid haplotype assemblies (94 haplotypes total) representing diverse global ancestries. PGGB (PanGenome Graph Builder), Minigraph-Cactus aligners. Captures structural variants (SVs), indels, repeats, complex regions GRCh38 missed. Aligning reads pangenome reduces reference bias (ancestry-biased alignment GRCh38), better SV calling. Goal 350+ haplotypes 2025+. Foundation precision medicine inclusive. Concurrent: telomere-to-telomere (T2T) consortium 2022 first complete human genome (Nurk Science). Future: graph-aware variant calling clinical, GWAS imputation reference panels, complex region characterization (HLA, IGH antibodies, KIR).'
          en: 'Human Pangenome Reference Consortium (HPRC) Nature 2023: graph-based pangenome assembled from 47 phased diploid haplotype assemblies (94 haplotypes total) representing diverse global ancestries. PGGB (PanGenome Graph Builder), Minigraph-Cactus aligners. Captures structural variants (SVs), indels, repeats, complex regions GRCh38 missed. Aligning reads to the pangenome reduces reference bias (ancestry-biased alignment to GRCh38), better SV calling. Goal 350+ haplotypes by 2025+. Foundation for inclusive precision medicine. Concurrent: telomere-to-telomere (T2T) consortium 2022 first complete human genome (Nurk Science). Future: graph-aware clinical variant calling, GWAS imputation reference panels, complex-region characterization (HLA, IGH antibodies, KIR).'
        objectives: [HPRC pangenome]
      - type: choice
        difficulty: 5
        question:
          pt: Chromosome engineering (Wu Liu Cell 2018 mouse) approach é…
          en: Chromosome engineering (Wu Liu Cell 2018 mouse) approach is…
        choices:
          - Megabase-scale CRISPR-mediated chromosome translocations and deletions producing viable mice with engineered karyotype changes
          - Single-bp point mutations only without large-scale rearrangement
          - mRNA injection for transient chromosomal effects
          - Pure transcriptomic profiling without genome editing
        correctAnswer: Megabase-scale CRISPR-mediated chromosome translocations and deletions producing viable mice with engineered karyotype changes
        rationale:
          pt: 'Chromosome engineering (Wu Wang Liu Sun Liu Lin Zheng Bai Tang Pang Bai Cell 2018 ou Li Sun Wang Cell 2022): CRISPR-Cas9 with two sgRNAs flanking large genomic regions → kilobase to megabase deletions, inversions, or translocations between chromosomes. Wang Sun mouse 2018 demonstrated chromosomal fusion: fusion mouse chromosomes 4+5 e 1+2 (engineered ESCs → live mice 21 chromosomes vs natural 20). Liu lab Hangzhou Cell 2024 yeast karyotype reduction. Aplicações: model genome instability cancers, study large-scale chromosomal evolution, engineering minimal chromosomes Sc2.0-style. Limit: efficiency low pasta megabase ranges, inviabilities frequent. Subsequent: AsCas12a + Cas9 multiplex strategies, prime editing-based large insertions (PASTE Tome). Field expanding chromosome surgery beyond gene-level edits. Genome architecture genuinely engineering target.'
          en: 'Chromosome engineering: CRISPR-Cas9 with two sgRNAs flanking large genomic regions → kilobase- to megabase-scale deletions, inversions, or translocations between chromosomes. Mouse 2018 demonstrated chromosomal fusion: fusion of mouse chromosomes 4+5 and 1+2 (engineered ESCs → live mice with 21 chromosomes vs natural 20). Liu lab Hangzhou Cell 2024 yeast karyotype reduction. Applications: model genome instability in cancers, study large-scale chromosomal evolution, engineering minimal chromosomes in the Sc2.0 style. Limit: efficiency low at megabase ranges, frequent inviabilities. Subsequent: AsCas12a + Cas9 multiplex strategies, prime-editing-based large insertions (PASTE Tome). Field expanding chromosome surgery beyond gene-level edits. Genome architecture genuinely an engineering target.'
        objectives: [Chromosome engineering]
      - type: choice
        difficulty: 5
        question:
          pt: Telomere-to-telomere (T2T) consortium 2022 entrega é…
          en: Telomere-to-telomere (T2T) consortium 2022 deliverable is…
        choices:
          - First gapless human genome (T2T-CHM13) covering centromeres, rDNA arrays, and segmental duplications previously missing from GRCh38
