        question:
          pt: Cultivated meat regulatory milestone (Upside Foods + Eat Just FDA 2022/USDA 2023) foi…
          en: Cultivated meat regulatory milestone (Upside Foods + Eat Just FDA 2022/USDA 2023) was…
        choices:
          - First USDA-cleared chicken cultivated from animal cells for sale in US restaurants, paving path for cell-based meat industry
          - First plant-based burger approved without animal cells
          - First insect-protein product cleared for human consumption
          - First lab-grown beef approved exclusively in EU
        correctAnswer: First USDA-cleared chicken cultivated from animal cells for sale in US restaurants, paving path for cell-based meat industry
        rationale:
          pt: 'Cultivated meat regulatory clearance: Upside Foods (ex-Memphis Meats, Berkeley) + Eat Just GOOD Meat — FDA "no questions" letters (pre-market consultation) novembro 2022, USDA approval junho 2023 → first US sales cultivated chicken at high-end restaurants (Bar Crenn SF, José Andrés Washington DC). Mechanism: harvest cells animal biopsy (chicken muscle satellite cells, fibroblasts) → expand bioreactor cell culture media (FBS-free serum-replacement formulations) → differentiate skeletal muscle + adipose → harvest → process. Singapore foi first country approving cultivated chicken Eat Just 2020 (regulatory sandbox). Israel approval 2024. Cost challenge: ~$1000/kg laboratory-scale → goal $5-10/kg viable consumer. Bottlenecks: bioreactor scale, growth media cost (~80% expense), product differentiation vs plant-based. Companies: Upside, Eat Just, Mosa Meat (Mark Post Maastricht 2013 first lab burger), BlueNalu seafood, Mission Barns pork fat, Aleph Farms steaks. Industry capital winter 2023-2024 — ~$3B invested aggregate, slow progress.'
          en: 'Cultivated meat regulatory clearance: Upside Foods (ex-Memphis Meats, Berkeley) + Eat Just GOOD Meat — FDA "no questions" letters (pre-market consultation) November 2022, USDA approval June 2023 → first US sales of cultivated chicken at high-end restaurants (Bar Crenn SF, José Andrés Washington DC). Mechanism: harvest cells from animal biopsy (chicken muscle satellite cells, fibroblasts) → expand in bioreactor cell culture media (FBS-free serum-replacement formulations) → differentiate to skeletal muscle + adipose → harvest → process. Singapore was first country approving cultivated chicken (Eat Just 2020 regulatory sandbox). Israel approval 2024. Cost challenge: ~$1000/kg laboratory-scale → goal $5-10/kg consumer-viable. Bottlenecks: bioreactor scale, growth media cost (~80% of expense), product differentiation vs plant-based. Companies: Upside, Eat Just, Mosa Meat (Mark Post Maastricht 2013 first lab burger), BlueNalu seafood, Mission Barns pork fat, Aleph Farms steaks. Industry capital winter 2023-2024 — ~$3B invested aggregate, slow progress.'
        objectives: [Cultivated meat]
      - type: choice
        difficulty: 5
        question:
          pt: Recombinant insulin (Genentech/Lilly Humulin 1982) histórico impacto foi…
          en: Recombinant insulin (Genentech/Lilly Humulin 1982) historic impact was…
        choices:
          - First FDA-approved recombinant biopharmaceutical, demonstrating microbial expression of human proteins and launching the biotech pharmaceutical industry
          - Final use of bovine/porcine insulin without any biotechnology
          - First gene therapy delivered as a clinical treatment
          - First monoclonal antibody approved for diabetes
        correctAnswer: First FDA-approved recombinant biopharmaceutical, demonstrating microbial expression of human proteins and launching the biotech pharmaceutical industry
        rationale:
          pt: 'Recombinant human insulin (Humulin): Genentech (Boyer Swanson founded 1976) + Eli Lilly partnership. Goeddel 1979 PNAS demonstrated synthetic gene → E. coli expression human insulin chains A + B → in vitro disulfide bond → bioactive. FDA approval 1982 — primeira recombinant biopharmaceutical commercial. Replaces bovine/porcine insulin sources (limited supply, immunogenicity, contamination concerns). Foundational milestone biotech industry: proof of concept genes-as-products. Subsequent recombinant: human growth hormone (Genentech 1985), erythropoietin (Amgen Epogen 1989), tPA, Factor VIII, monoclonal antibodies (Lilly Centocor ReoPro 1994). Genentech eventually acquired Roche $46.8B 2009. Industry $300B+ biopharm 2024. Genome-encoded therapeutics: insulin → recombinant antibodies → vaccines → mRNA → cell therapies → gene therapies → engineered live biotherapeutics. Continuum 40+ years.'
          en: 'Recombinant human insulin (Humulin): Genentech (Boyer Swanson founded 1976) + Eli Lilly partnership. Goeddel 1979 PNAS demonstrated synthetic gene → E. coli expression of human insulin chains A + B → in vitro disulfide bond → bioactive. FDA approval 1982 — first commercial recombinant biopharmaceutical. Replaces bovine/porcine insulin sources (limited supply, immunogenicity, contamination concerns). Foundational milestone for biotech industry: proof of concept of genes-as-products. Subsequent recombinant: human growth hormone (Genentech 1985), erythropoietin (Amgen Epogen 1989), tPA, Factor VIII, monoclonal antibodies (Lilly Centocor ReoPro 1994). Genentech eventually acquired by Roche for $46.8B 2009. Industry $300B+ biopharm 2024. Genome-encoded therapeutics: insulin → recombinant antibodies → vaccines → mRNA → cell therapies → gene therapies → engineered live biotherapeutics. Continuum of 40+ years.'
        objectives: [Recombinant insulin]
      - type: choice
        difficulty: 5
        question:
          pt: Phage therapy resurgence (Strathdee/Patterson UCSD 2017) é…
          en: Phage therapy resurgence (Strathdee/Patterson UCSD 2017) is…
        choices:
          - Compassionate-use intravenous bacteriophage therapy curing multi-drug-resistant Acinetobacter baumannii infection, reigniting clinical phage interest in the West
          - Routine antibiotic-only treatment without bacteriophage involvement
          - Vaccine against bacterial infections without phage component
          - Surgical drainage as the sole intervention
        correctAnswer: Compassionate-use intravenous bacteriophage therapy curing multi-drug-resistant Acinetobacter baumannii infection, reigniting clinical phage interest in the West
        rationale:
          pt: 'Phage therapy clinical resurgence: Tom Patterson UCSD professor critical illness 2015-2016 multi-drug-resistant Acinetobacter baumannii pneumonia/sepsis. Wife Steffanie Strathdee epidemiologist coordinated emergency phage cocktail compassionate-use IND FDA — phages identified Naval Medical Research Center, AmpliPhi (Australia), Texas A&M Center for Phage Technology. IV phage cocktail → patient recovered 2017. Inspired UCSD IPATH (Innovative Phage Applications and Therapeutics) center 2018, Phage Directory, Phagebank Australia. Subsequent compassionate cases hundreds globally. Companies: Locus Biosciences (CRISPR-Cas3 + phage delivery), Adaptive Phage Therapeutics, Armata, BiomX, Pherecydes (acquired Phaxiam Therapeutics France). Trials: Cystic fibrosis Pseudomonas (CYPHY), prosthetic joint infections, UTI. Limit: regulatory framework UNCLEAR, phage specificity narrow, resistance emergence, phage-host coevolution challenges. Renewed interest amid AMR crisis post-WHO 2023 reports.'
          en: 'Phage therapy clinical resurgence: Tom Patterson UCSD professor critically ill 2015-2016 with multi-drug-resistant Acinetobacter baumannii pneumonia/sepsis. Wife Steffanie Strathdee epidemiologist coordinated emergency phage cocktail compassionate-use IND with FDA — phages identified by Naval Medical Research Center, AmpliPhi (Australia), Texas A&M Center for Phage Technology. IV phage cocktail → patient recovered 2017. Inspired UCSD IPATH (Innovative Phage Applications and Therapeutics) center 2018, Phage Directory, Phagebank Australia. Subsequent compassionate-use cases number in the hundreds globally. Companies: Locus Biosciences (CRISPR-Cas3 + phage delivery), Adaptive Phage Therapeutics, Armata, BiomX, Pherecydes (acquired by Phaxiam Therapeutics France). Trials: cystic fibrosis Pseudomonas (CYPHY), prosthetic joint infections, UTI. Limit: regulatory framework unclear, phage specificity narrow, resistance emergence, phage-host coevolution challenges. Renewed interest amid AMR crisis post-WHO 2023 reports.'
        objectives: [Phage therapy resurgence]
      - type: choice
        difficulty: 5
        question:
          pt: Romesberg unnatural base pairs (X-Y, Synthorx/Sanofi) approach é…
          en: Romesberg unnatural base pairs (X-Y, Synthorx/Sanofi) approach is…
        choices:
          - Synthetic dNaM-dTPT3 base pair functional in living E. coli expanding the genetic alphabet beyond ATCG to enable new amino acids and codons
          - Modification of natural ATGC bases via methylation only
          - Replacement of one natural base with another within standard alphabet
          - Pure in vitro chemistry without any cellular implementation
        correctAnswer: Synthetic dNaM-dTPT3 base pair functional in living E. coli expanding the genetic alphabet beyond ATCG to enable new amino acids and codons
        rationale:
          pt: 'Unnatural base pairs (UBP): Floyd Romesberg Scripps Research → Synthorx spinout 2015 (Sanofi acquired 2019). dNaM-dTPT3 (Malyshev Dhami Lavergne Chen Lee Diao Khachatryan Romesberg Nature 2014): synthetic hydrophobic base pair functional in vivo E. coli — replicated, transcribed, translated. Foundation expanded genetic alphabet (6-letter: ATCG + XY → 64 codons → 216 codons potential). Synthorx product THOR-707 (denenicokin) recombinant IL-2 with site-specifically incorporated PEGylation site via UBP-encoded ncAA → reduced toxicity vs aldesleukin (high-dose IL-2 melanoma). Phase 1/2 advanced solid tumors. Concurrent: Steven Benner Foundation Applied Molecular Evolution 8-letter alphabet (Hoshika Leal Kim Karalkar Kim Eun Ranjan Lim Liu Bradley Sztompka Naseem Reichman Pascucci Chowdhury Naidu Stachler Stachler Lutz Carrigan Yang Lampert Rich Chittum Hutter Lassner Hossain Tran Kruger Yu Hutter Lampert Khazi McCray Snyder Hampikian Benner Foundation Science 2019 8-letter Z-P alphabet). Field xenobiology: expand chemistry life. Biocontainment built-in (cells require synthetic UBP, can´t escape).'
          en: 'Unnatural base pairs (UBP): Floyd Romesberg Scripps Research → Synthorx spinout 2015 (Sanofi acquired 2019). dNaM-dTPT3 (Malyshev Dhami Lavergne Chen Lee Diao Khachatryan Romesberg Nature 2014): synthetic hydrophobic base pair functional in vivo E. coli — replicated, transcribed, translated. Foundation for expanded genetic alphabet (6-letter: ATCG + XY → 64 codons → 216 codons potential). Synthorx product THOR-707 (denenicokin) recombinant IL-2 with site-specifically incorporated PEGylation site via UBP-encoded ncAA → reduced toxicity vs aldesleukin (high-dose IL-2 melanoma). Phase 1/2 advanced solid tumors. Concurrent: Steven Benner Foundation for Applied Molecular Evolution 8-letter alphabet (Hoshika 2019 Z-P alphabet). Field of xenobiology: expand chemistry of life. Built-in biocontainment (cells require synthetic UBP, cannot escape).'
        objectives: [Unnatural base pairs]
      - type: choice
        difficulty: 5
        question:
          pt: Spider silk biofabrication (Bolt Threads, AMSilk, Spiber) approach é…
          en: Spider silk biofabrication (Bolt Threads, AMSilk, Spiber) approach is…
        choices:
          - Heterologous expression of spider-silk-protein genes in microbial hosts and spinning of recombinant fibers for textile and biomedical applications
          - Direct harvest of fibers from spider colonies at industrial scale
          - Pure synthetic-polymer chemistry without biological component
          - Plant-derived cellulose modification only
        correctAnswer: Heterologous expression of spider-silk-protein genes in microbial hosts and spinning of recombinant fibers for textile and biomedical applications
        rationale:
          pt: 'Spider silk biofabrication: spiders cannot be farmed (cannibalism, low yield); silk proteins (spidroins) ~250-350kDa, highly repetitive sequence, mechanical properties exceed Kevlar (toughness/density). Recombinant approach: spidroin gene constructs (truncated-shortened repeats e.g., 16x dragline silk Major Ampullate spidroin) → expressed E. coli, P. pastoris yeast, alfalfa, silkworms transgenic. Bolt Threads (founded 2009, Berkeley): yeast-fermented "Microsilk" → Adidas Stan Smith collaboration, Stella McCartney garments 2017. AMSilk (Munich, founded 2008): bacterial expression spider silk protein, partnered Adidas, BMW interior, biomedical scaffolds. Spiber (Japan, founded 2007): fermentation Brewed Protein™ → North Face Moon Parka 2019, Goldwin garments. Limit: scale, mechanical properties recombinant spider silk inferior natural (still no replicate full mechanical), cost. Bolt Threads pivot 2023 mycelium leather Mylo. AMSilk 2024 commercial fibers cosmetics textiles. Cellular agriculture parallel: leather (Modern Meadow), feathers (Spiber), wool (Spiber).'
          en: 'Spider silk biofabrication: spiders cannot be farmed (cannibalism, low yield); silk proteins (spidroins) ~250-350 kDa, highly repetitive sequence, mechanical properties exceed Kevlar (toughness/density). Recombinant approach: spidroin gene constructs (truncated-shortened repeats e.g., 16x dragline silk Major Ampullate spidroin) → expressed in E. coli, P. pastoris yeast, transgenic alfalfa, silkworms. Bolt Threads (founded 2009, Berkeley): yeast-fermented "Microsilk" → Adidas Stan Smith collaboration, Stella McCartney garments 2017. AMSilk (Munich, founded 2008): bacterial expression of spider silk protein, partnered Adidas, BMW interior, biomedical scaffolds. Spiber (Japan, founded 2007): fermentation Brewed Protein™ → North Face Moon Parka 2019, Goldwin garments. Limit: scale, mechanical properties of recombinant spider silk inferior to natural (still cannot replicate full mechanical properties), cost. Bolt Threads pivot 2023 to mycelium leather Mylo. AMSilk 2024 commercial fibers in cosmetics and textiles. Cellular agriculture parallel: leather (Modern Meadow), feathers (Spiber), wool (Spiber).'
        objectives: [Spider silk biofabrication]
      - type: choice
        difficulty: 5
        question:
          pt: Engineered Rhizobium / nitrogen-fixing crops (Pivot Bio, Joyn Bio) approach é…
          en: Engineered Rhizobium / nitrogen-fixing crops (Pivot Bio, Joyn Bio) approach is…
        choices:
          - Microbial inoculants engineered to fix atmospheric nitrogen on cereal-crop roots, partially replacing synthetic fertilizers and reducing nitrogen runoff
          - Pure chemical fertilizer formulation without biological component
          - Genetic engineering of corn to fix nitrogen autonomously without microbes
          - Crop rotation alone without microbial supplementation
        correctAnswer: Microbial inoculants engineered to fix atmospheric nitrogen on cereal-crop roots, partially replacing synthetic fertilizers and reducing nitrogen runoff
        rationale:
          pt: 'Nitrogen-fixing inoculants: Pivot Bio (Berkeley founded 2010, ex-Karsten Temme), product Proven (Klebsiella variicola engineered), Return ON (Kosakonia sacchari engineered) — ammonia-secreting microbes applied corn/wheat seeds. Mechanism: native microbes nitrogen fixation regulated suppressed presence ammonium → engineered remove regulatory checkpoints → constitutive nitrogen fixation → secrete ammonium roots → plant uptake. Reduces synthetic fertilizer (Haber-Bosch) need ~20-25% per acre. Field trials ~5-15 bushels/acre yield improvement. Concurrent: Joyn Bio (Bayer + Ginkgo Bioworks JV 2017-2022 spun back parent), Sound Agriculture, Indigo Ag (microbiome inoculants broader), AgBiome. Climate impact: nitrogen fertilizer ~2% global emissions Haber-Bosch process + nitrous oxide runoff. Goal: nitrogen-fixing cereals (corn, wheat, rice) replicating legume-Rhizobium symbiosis — long-term Bill Gates Breakthrough Energy investment area. Engineering challenges large.'
          en: 'Nitrogen-fixing inoculants: Pivot Bio (Berkeley founded 2010, ex-Karsten Temme), products Proven (Klebsiella variicola engineered), Return ON (Kosakonia sacchari engineered) — ammonia-secreting microbes applied to corn/wheat seeds. Mechanism: native microbe nitrogen fixation regulated to suppress in presence of ammonium → engineered to remove regulatory checkpoints → constitutive nitrogen fixation → secretes ammonium at roots → plant uptake. Reduces synthetic fertilizer (Haber-Bosch) need ~20-25% per acre. Field trials ~5-15 bushels/acre yield improvement. Concurrent: Joyn Bio (Bayer + Ginkgo Bioworks JV 2017-2022 spun back to parents), Sound Agriculture, Indigo Ag (broader microbiome inoculants), AgBiome. Climate impact: nitrogen fertilizer ~2% of global emissions from Haber-Bosch process + nitrous oxide runoff. Goal: nitrogen-fixing cereals (corn, wheat, rice) replicating legume-Rhizobium symbiosis — long-term Bill Gates Breakthrough Energy investment area. Engineering challenges large.'
        objectives: [Nitrogen-fixing inoculants]
      - type: choice
        difficulty: 5
        question:
          pt: DNA data storage (Microsoft/UW Project Silica + Catalog) approach é…
          en: DNA data storage (Microsoft/UW Project Silica + Catalog) approach is…
        choices:
          - Encoding digital information in synthesized DNA bases for ultra-dense (~exabyte/g) durable archival storage with retrieval via sequencing
          - Pure magnetic-tape archival storage without DNA component
          - Storage of binary data in living bacterial cells temporarily
          - Optical disc storage with laser writing in glass
        correctAnswer: Encoding digital information in synthesized DNA bases for ultra-dense (~exabyte/g) durable archival storage with retrieval via sequencing
        rationale:
          pt: 'DNA data storage: encode binary 0s/1s → ATCG nucleotides via codes (Goldman Birney EBI 2013 Nature trinary, Church 2012, Erlich Zielinski Science 2017 fountain code). Synthesize DNA via phosphoramidite ou enzymatic → store dry powder/oligonucleotide pool ~indefinitely (DNA half-life dry ~1000+ years). Read: sequence → decode. Density ~1 exabyte (10⁹ GB)/gram theoretical (~10⁶x denser tape). Major players: Microsoft Research + Univ Washington (Project Silica precursor → DNA Storage Alliance 2020), Twist Bioscience (synthesis partner), Catalog Technologies (Boston, "tape-and-cassette" DNA), Iridia, Ansa Biotechnologies. Demonstration: GitHub archive (~21TB Project Silica 2020), entire OK Computer Radiohead album, Wikipedia, films (Paris). Limits: write speed ~kBps maximum currently (vs MBps tape), cost ~$1000/MB write (target $0.01/MB), random access limited. Niche compelling: cold archival (banking, government, intel) >100 years horizon. Field 5-10 years niche commercial maturity expected.'
          en: 'DNA data storage: encode binary 0s/1s → ATCG nucleotides via codes (Goldman Birney EBI 2013 Nature trinary, Church 2012, Erlich Zielinski Science 2017 fountain code). Synthesize DNA via phosphoramidite or enzymatic → store dry powder/oligonucleotide pool ~indefinitely (DNA half-life dry ~1000+ years). Read: sequence → decode. Density ~1 exabyte (10⁹ GB)/gram theoretical (~10⁶x denser than tape). Major players: Microsoft Research + Univ Washington (Project Silica precursor → DNA Storage Alliance 2020), Twist Bioscience (synthesis partner), Catalog Technologies (Boston, "tape-and-cassette" DNA), Iridia, Ansa Biotechnologies. Demonstrations: GitHub archive (~21TB Project Silica 2020), entire OK Computer Radiohead album, Wikipedia, films (Paris). Limits: write speed ~kBps maximum currently (vs MBps tape), cost ~$1000/MB write (target $0.01/MB), limited random access. Niche compelling: cold archival (banking, government, intel) >100-year horizon. Field 5-10 years to niche commercial maturity expected.'
        objectives: [DNA storage]
