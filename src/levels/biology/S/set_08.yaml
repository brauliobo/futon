        question:
          pt: Artemisinin via metabolic engineering (Keasling Berkeley/Sanofi 2013) achievement é…
          en: Artemisinin via metabolic engineering (Keasling Berkeley/Sanofi 2013) achievement is…
        choices:
          - Engineered yeast producing artemisinic acid via mevalonate pathway, semisynthesis to artemisinin antimalarial drug at industrial scale
          - Direct chemical total synthesis without microbial production
          - Enzymatic conversion of waste corn stalks to artemisinin in one step
          - Plant breeding of higher-yielding Artemisia annua only
        correctAnswer: Engineered yeast producing artemisinic acid via mevalonate pathway, semisynthesis to artemisinin antimalarial drug at industrial scale
        rationale:
          pt: 'Artemisinin metabolic engineering: Keasling lab Berkeley + Amyris startup. Plant Artemisia annua source supply variable, expensive. Engineered Saccharomyces cerevisiae → mevalonate pathway → amorphadiene synthase + cytochrome P450 CYP71AV1 → produce artemisinic acid (Ro Paddon Westfall Nature 2006/2013). Sanofi industrial scale-up 2013 — semisynthesis: artemisinic acid → photo-singlet-oxygen oxidation → artemisinin. Marketed via OneWorld Health partnership. Industrial production ~50-60 tons/year peak 2014-2015 — meaningful supply WHO ACT (artemisinin combination therapy) malaria. Subsequent: market dynamics — plant-derived prices fell, industrial yeast economics challenging, Sanofi exited 2017. Lessons: technical proof of metabolic engineering possible but commercial viability requires sustained price advantage. Concurrent: opioid biosynthesis Smolke Stanford Science 2015, cannabinoids Keasling Nature 2019, vanillin natural products. Field expanded synbio companies (Ginkgo, Zymergen, Amyris).'
          en: 'Artemisinin metabolic engineering: Keasling lab Berkeley + Amyris startup. Plant Artemisia annua source had variable, expensive supply. Engineered Saccharomyces cerevisiae → mevalonate pathway → amorphadiene synthase + cytochrome P450 CYP71AV1 → produces artemisinic acid (Ro Paddon Westfall Nature 2006/2013). Sanofi industrial scale-up 2013 — semisynthesis: artemisinic acid → photo-singlet-oxygen oxidation → artemisinin. Marketed via OneWorld Health partnership. Industrial production ~50-60 tons/year peak 2014-2015 — meaningful supply for WHO ACT (artemisinin combination therapy) malaria. Subsequent: market dynamics — plant-derived prices fell, industrial yeast economics challenging, Sanofi exited 2017. Lessons: technical proof of metabolic engineering is possible but commercial viability requires sustained price advantage. Concurrent: opioid biosynthesis Smolke Stanford Science 2015, cannabinoids Keasling Nature 2019, vanillin natural products. Field expanded synbio companies (Ginkgo, Zymergen, Amyris).'
        objectives: [Artemisinin]
