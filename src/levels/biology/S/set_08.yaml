title:
  pt: Síntese de Genomas e Engenharia Metabólica
  en: Genome Synthesis and Metabolic Engineering
level: S
subject: biology
objectives:
  - Compreender JCVI Syn1.0/Syn3.0, Sc2.0, GP-write
  - Reconhecer recoded organisms (C321, Syn61)
  - Identificar microbiome therapeutics e cell ag
  - Avaliar phage therapy, xenobio, unnatural base pairs
difficulty: 5
authorNotes: |
  Genome writing era: JCVI Venter Syn1.0 (Mycoplasma mycoides 2010), Syn3.0 minimal (Hutchison
  2016 ~473 genes), Sc2.0 yeast Boeke. Recoded E. coli C321 (Isaacs/Church 2013), Syn61
  (Fredens/Chin Nature 2019). GP-write 2016. Microbiome: Vowst/Rebyota FMT C. difficile FDA
  2022-2023. Synlogic SYNB1934 PKU. Cell ag: Upside/Eat Just FDA 2022. Phage therapy
  Strathdee/Patterson UCSD. Romesberg unnatural base pairs Synthorx.
example:
  question:
    pt: JCVI Syn1.0 (Gibson/Glass/Smith/Venter Science 2010) marco foi…
    en: JCVI Syn1.0 (Gibson/Glass/Smith/Venter Science 2010) milestone was…
  choices:
    - First bacterial cell controlled by a fully chemically synthesized genome — Mycoplasma mycoides JCVI-syn1.0 transplanted into M. capricolum recipient
    - First de novo synthesis of a eukaryotic chromosome from scratch
    - First successful CRISPR knockout of an essential gene in mammals
    - First synthetic protein cage assembled from designed peptides
  correctAnswer: First bacterial cell controlled by a fully chemically synthesized genome — Mycoplasma mycoides JCVI-syn1.0 transplanted into M. capricolum recipient
  rationale:
    pt: 'JCVI Syn1.0 (Gibson Glass Lartigue Noskov Chuang Algire Benders Montague Ma Moodie Merryman Vashee Krishnakumar Assad-Garcia Andrews-Pfannkoch Denisova Young Qi Segall-Shapiro Calvey Parmar Hutchison Smith Venter Science 2010): assembled ~1.08 Mbp Mycoplasma mycoides genome em yeast (TAR transformation-associated recombination), em ~25kb cassettes via Gibson assembly hierarchical → transplant into M. capricolum recipient cell (Lartigue 2007 prior genome transplant) → daughter cells contain only synthetic genome (watermarks identifiable). Custom: Hamilton Smith (Nobel 1978 restriction enzymes) + Daniel Gibson (Gibson assembly nome) + Craig Venter. Investment ~$40M. Demonstration genome-as-software: design-build-boot. Limit: usou existing M. mycoides genome design (sem rational reduction). Subsequent: Syn3.0 2016 minimal version, Sc2.0 yeast eukaryote first.'
    en: 'JCVI Syn1.0 (Gibson Glass Lartigue Noskov Chuang Algire Benders Montague Ma Moodie Merryman Vashee Krishnakumar Assad-Garcia Andrews-Pfannkoch Denisova Young Qi Segall-Shapiro Calvey Parmar Hutchison Smith Venter Science 2010): assembled ~1.08 Mbp Mycoplasma mycoides genome in yeast (TAR transformation-associated recombination), in ~25 kb cassettes via Gibson assembly hierarchical → transplanted into M. capricolum recipient cell (Lartigue 2007 prior genome transplant) → daughter cells contain only the synthetic genome (watermarks identifiable). Cast: Hamilton Smith (Nobel 1978 restriction enzymes) + Daniel Gibson (Gibson assembly namesake) + Craig Venter. Investment ~$40M. Demonstration of genome-as-software: design-build-boot. Limit: used existing M. mycoides genome design (no rational reduction). Subsequent: Syn3.0 2016 minimal version, Sc2.0 yeast eukaryote first.'
