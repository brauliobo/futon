        question:
          pt: Synlogic SYNB1934 (PKU phenylketonuria) approach é…
          en: Synlogic SYNB1934 (PKU phenylketonuria) approach is…
        choices:
          - Engineered E. coli Nissle expressing phenylalanine ammonia-lyase to degrade phenylalanine in the gut, reducing systemic Phe in PKU patients
          - Gene therapy AAV delivering PAH enzyme to liver
          - Dietary protein restriction without any biotherapeutic
          - Surgical gastric bypass for metabolic disease
        correctAnswer: Engineered E. coli Nissle expressing phenylalanine ammonia-lyase to degrade phenylalanine in the gut, reducing systemic Phe in PKU patients
        rationale:
          pt: 'Synlogic SYNB1934 (oral live biotherapeutic, PKU phenylketonuria deficiência PAH phenylalanine hydroxylase): engineered E. coli Nissle 1917 (probiotic safe chassis) expressing PAL (phenylalanine ammonia-lyase from Anabaena variabilis) → degrade phenylalanine em gut → reduce absorbed Phe → systemic Phe levels lower → prevent neurotoxicity PKU. Synthetic Biotic platform (Synlogic founded Boston Jim Collins MIT). Phase 2 SynPheny-1 trial 2023 results modest — Phe reduction ~30-40% sustained. Phase 3 ongoing. Concurrent indications: SYNB1353 homocystinuria, gout. Pfizer acquired Synlogic strategic 2024 — engineered live biotherapeutics platform validation. Concept extends: bacterial chassis programmed sense-respond molecules em gut/tumor microenvironment. Limits: dosing q.day, gut-resident vs transit, narrow therapeutic window. Other companies: Novome, Pendulum, AOBiome. Field "engineered probiotics" 2.0.'
          en: 'Synlogic SYNB1934 (oral live biotherapeutic, PKU phenylketonuria PAH phenylalanine hydroxylase deficiency): engineered E. coli Nissle 1917 (probiotic safe chassis) expressing PAL (phenylalanine ammonia-lyase from Anabaena variabilis) → degrades phenylalanine in gut → reduces absorbed Phe → systemic Phe levels lower → prevents PKU neurotoxicity. Synthetic Biotic platform (Synlogic founded in Boston by Jim Collins MIT). Phase 2 SynPheny-1 trial 2023 results modest — Phe reduction ~30-40% sustained. Phase 3 ongoing. Concurrent indications: SYNB1353 homocystinuria, gout. Pfizer acquired Synlogic strategic 2024 — engineered live biotherapeutics platform validation. Concept extends: bacterial chassis programmed sense-respond to molecules in gut/tumor microenvironment. Limits: q.day dosing, gut-resident vs transit, narrow therapeutic window. Other companies: Novome, Pendulum, AOBiome. Field "engineered probiotics" 2.0.'
        objectives: [Synlogic PKU]
