    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: mTOR signaling (Sabatini/Hall 1994 + rapamicina) é…
          en: mTOR signaling (Sabatini/Hall 1994 + rapamycin) is…
        choices:
          - Master regulator cell growth/metabolism via mTORC1 (Raptor) sensing nutrients/AAs/glucose + mTORC2 (Rictor) sensing growth factors; rapamycin selective mTORC1 inhibitor
          - Pure transcription factor unrelated to growth
          - Random kinase without nutrient sensing
          - Mitochondrial respiration only
        correctAnswer: Master regulator cell growth/metabolism via mTORC1 (Raptor) sensing nutrients/AAs/glucose + mTORC2 (Rictor) sensing growth factors; rapamycin selective mTORC1 inhibitor
        rationale:
          pt: 'mTOR (mechanistic Target Of Rapamycin): Michael Hall Univ Basel 1991 discovered TOR yeast; David Sabatini MIT 1994-2002 mammalian mTOR + RAPTOR + RICTOR identification. Two complexes: mTORC1 (Raptor + mLST8 + PRAS40) — sensitive rapamycin, sense amino acids (RagGTPases at lysosome), glucose, growth factors → activates protein synthesis (4E-BP1, S6K1), inhibits autofagia (ULK1), drives cell growth/anabolic. mTORC2 (Rictor + mSIN1 + PROTOR + mLST8) — rapamicina-resistente, growth factor signaling → activates AKT, SGK1, PKCα. Therapeutics: rapamycin (sirolimus) + analogues everolimus (Afinitor Novartis) + temsirolimus (Torisel Wyeth) — RCC, breast cancer, neuroendocrine tumors. mTOR aging: ITP (NIA Interventions Testing Program) rapamycin extends mouse lifespan ~14-25%. dTOR/p70 S6K1 → translation regulator, S6 ribosomal protein. Sabatini falência 2021 sexual misconduct allegations. Field 2024 mature.'
          en: 'mTOR (mechanistic Target Of Rapamycin): Michael Hall Univ Basel 1991 discovered TOR in yeast; David Sabatini MIT 1994-2002 identified mammalian mTOR + RAPTOR + RICTOR. Two complexes: mTORC1 (Raptor + mLST8 + PRAS40) — sensitive to rapamycin, senses amino acids (RagGTPases at lysosome), glucose, growth factors → activates protein synthesis (4E-BP1, S6K1), inhibits autophagy (ULK1), drives cell growth/anabolic. mTORC2 (Rictor + mSIN1 + PROTOR + mLST8) — rapamycin-resistant, growth factor signaling → activates AKT, SGK1, PKCα. Therapeutics: rapamycin (sirolimus) + analogues everolimus (Afinitor Novartis) + temsirolimus (Torisel Wyeth) — RCC, breast cancer, neuroendocrine tumors. mTOR aging: ITP (NIA Interventions Testing Program) rapamycin extends mouse lifespan ~14-25%. dTOR/p70 S6K1 → translation regulator, S6 ribosomal protein. Sabatini fall 2021 sexual misconduct allegations. Field 2024 mature.'
        objectives: [mTOR signaling]
      - type: choice
        difficulty: 5
        question:
          pt: NF-κB pathway (Sen/Baltimore Cell 1986) é…
          en: NF-κB pathway (Sen/Baltimore Cell 1986) is…
        choices:
          - Inducible transcription factor (RelA/p65, p50, c-Rel, p52) regulating immune/inflammatory/survival genes; activated via IκB kinase (IKK) phosphorylating IκBα for proteasomal degradation
          - Constitutive transcription factor without regulation
          - Pure cytoplasmic factor never nuclear
          - Apoptosis-only mediator
        correctAnswer: Inducible transcription factor (RelA/p65, p50, c-Rel, p52) regulating immune/inflammatory/survival genes; activated via IκB kinase (IKK) phosphorylating IκBα for proteasomal degradation
        rationale:
          pt: 'NF-κB (Sen Baltimore MIT Cell 1986): family transcription factors p65/RelA, p50, c-Rel, RelB, p52 (precursors p105 → p50, p100 → p52). Inactive complex IκB inhibitor cytoplasm. Estimuli (TNF, IL-1, LPS, viral, oxidative stress) → IKK kinase complex (IKKα/β/γ) → phosphoryla IκBα (S32/36) → polyubiquitinação K48 → degradação proteasome → libera NF-κB → translocate núcleo → bind κB sites DNA → transcrição alvos: cytokines (TNF, IL-1, IL-6), chemokines (IL-8), survival (Bcl-2, BIRC), proliferation (cyclin D1), MMPs. Canonical (TNF, IL-1, LPS) vs non-canonical (BAFF, LTβ, CD40 — NIK kinase activates IKKα → p100 processing). Therapeutics: bortezomib (proteasome inhibitor IκBα accumulates → blocks NF-κB), IKKβ inhibitors preclinical, glucocorticoids (transrepression NF-κB). Aging chronic NF-κB activation contributes inflammaging. Doenças: rheumatoid arthritis, IBD, cancer (constitutive activation). David Baltimore Caltech Nobel 1975 (oncovírus reverse transcriptase) — também NF-κB pioneer. Field 2024 mature.'
          en: 'NF-κB (Sen/Baltimore MIT Cell 1986): family of transcription factors p65/RelA, p50, c-Rel, RelB, p52 (precursors p105 → p50, p100 → p52). Inactive complex with IκB inhibitor in cytoplasm. Stimuli (TNF, IL-1, LPS, viral, oxidative stress) → IKK kinase complex (IKKα/β/γ) → phosphorylates IκBα (S32/36) → K48 polyubiquitination → proteasome degradation → releases NF-κB → translocates to nucleus → binds κB sites in DNA → transcription of targets: cytokines (TNF, IL-1, IL-6), chemokines (IL-8), survival (Bcl-2, BIRC), proliferation (cyclin D1), MMPs. Canonical (TNF, IL-1, LPS) vs non-canonical (BAFF, LTβ, CD40 — NIK kinase activates IKKα → p100 processing). Therapeutics: bortezomib (proteasome inhibitor — IκBα accumulates → blocks NF-κB), IKKβ inhibitors preclinical, glucocorticoids (transrepression NF-κB). Aging chronic NF-κB activation contributes to inflammaging. Diseases: rheumatoid arthritis, IBD, cancer (constitutive activation). David Baltimore Caltech Nobel 1975 (oncovirus reverse transcriptase) — also NF-κB pioneer. Field 2024 mature.'
        objectives: [NF-kB]
      - type: choice
        difficulty: 5
        question:
          pt: Wnt/β-catenin (Nusse/Varmus 1982 → β-catenin signaling Clevers 1990s+) é…
          en: Wnt/β-catenin (Nusse/Varmus 1982 → β-catenin signaling Clevers 1990s+) is…
        choices:
          - Pathway controlling stem cell self-renewal + development; β-catenin stabilized by Wnt → translocates nucleus → activates TCF/LEF → APC/Axin destruction complex normally degrades; APC mutations drive ~80% colorectal cancer
          - Pure metabolic enzyme without signaling role
          - Apoptosis-only mediator
          - Mitochondrial respiration component
        correctAnswer: Pathway controlling stem cell self-renewal + development; β-catenin stabilized by Wnt → translocates nucleus → activates TCF/LEF → APC/Axin destruction complex normally degrades; APC mutations drive ~80% colorectal cancer
        rationale:
          pt: 'Wnt/β-catenin: Nusse/Varmus 1982 Cell Int1 retroviral insertional mutagenesis mouse mammary tumor virus → wnt-1 ortholog Drosophila wingless. Pathway: secreted Wnt ligands (~19 in humans) → Frizzled receptor + LRP5/6 co-receptor → Dishevelled (Dvl) → inhibits APC/Axin/CK1/GSK3β destruction complex normally phosphorylates β-catenin for βTrCP-mediated degradation → β-catenin stabilizes, accumulates → translocates nucleus → binds TCF/LEF transcription factors → activates targets: c-Myc, cyclin D1, Lgr5 (intestinal stem cell marker), Axin2. Doenças: APC truncating mutations ~80% colorectal cancers (familial adenomatous polyposis FAP, sporadic CRC) + activating β-catenin mutations (CTNNB1) hepatocellular + endometrial + medulloblastoma WNT-subtype. Therapeutics: porcupine inhibitors (LGK974 Novartis Phase 1) inhibit Wnt secretion, anti-FZD antibody (vantictumab OncoMed), tankyrase inhibitors stabilize Axin (XAV939 preclinical). Hans Clevers + Roeland Nusse Stanford pioneers stem cell biology. Field essential development + cancer.'
          en: 'Wnt/β-catenin: Nusse/Varmus 1982 Cell Int1 retroviral insertional mutagenesis in mouse mammary tumor virus → wnt-1 ortholog of Drosophila wingless. Pathway: secreted Wnt ligands (~19 in humans) → Frizzled receptor + LRP5/6 co-receptor → Dishevelled (Dvl) → inhibits APC/Axin/CK1/GSK3β destruction complex which normally phosphorylates β-catenin for βTrCP-mediated degradation → β-catenin stabilizes, accumulates → translocates to nucleus → binds TCF/LEF transcription factors → activates targets: c-Myc, cyclin D1, Lgr5 (intestinal stem cell marker), Axin2. Diseases: APC truncating mutations in ~80% of colorectal cancers (familial adenomatous polyposis FAP, sporadic CRC) + activating β-catenin mutations (CTNNB1) in hepatocellular + endometrial + medulloblastoma WNT-subtype. Therapeutics: porcupine inhibitors (LGK974 Novartis Phase 1) inhibit Wnt secretion, anti-FZD antibody (vantictumab OncoMed), tankyrase inhibitors stabilize Axin (XAV939 preclinical). Hans Clevers + Roeland Nusse Stanford pioneers of stem cell biology. Field essential for development + cancer.'
        objectives: [Wnt beta-catenin]
      - type: choice
        difficulty: 5
        question:
          pt: Hippo/YAP-TAZ pathway (Pan/Halder 2007+) é…
          en: Hippo/YAP-TAZ pathway (Pan/Halder 2007+) is…
        choices:
          - Tumor suppressor pathway sensing cell density + mechanical cues — MST1/2 + LATS1/2 phosphorylate YAP/TAZ → cytoplasmic retention; LATS inactive → YAP/TAZ activate growth-promoting transcription
          - Pure metabolic pathway without growth control
          - Apoptosis-specific without regeneration role
          - Random kinase cascade without organ size control
        correctAnswer: Tumor suppressor pathway sensing cell density + mechanical cues — MST1/2 + LATS1/2 phosphorylate YAP/TAZ → cytoplasmic retention; LATS inactive → YAP/TAZ activate growth-promoting transcription
        rationale:
          pt: 'Hippo (Drosophila Halder 1995 hippo mutant overgrowth phenotype, named após hippopotamus): mammalian conservation Pan UCSF + Guan UCSD 2007+. Cascade: GPCR/integrin/cell-cell contacts → MST1/2 kinases (Hippo) phosphorylate LATS1/2 (Wts in Drosophila) → LATS phosphorylates YAP/TAZ (Yorkie in Drosophila) → 14-3-3 binding cytoplasmic retention + degradação. When Hippo inactive → YAP/TAZ → translocate núcleo → bind TEAD transcription factors → activate proliferation/anti-apoptosis/regeneration targets. Sensors: cell density (E-cadherin, α-catenin), mechanical (substrate stiffness, ECM tension, F-actin), GPCRs (LPA, S1P, thrombin). Aplicações: organ size control (mouse YAP overexpression → enlarged liver Camargo 2007), regeneration (intestinal, cardiac), tumor suppressor (~30% cancers Hippo dysfunction — NF2/merlin upstream activator), mesothelioma (NF2 deficient). Therapeutics: TEAD inhibitors VT3989 Vivace + IK-930 Ikena Phase 1/2 NF2-mutant mesothelioma 2024+. Field 2024 emerging cancer drug class. Pan Caltech + Guan Tsinghua + Halder Leuven leadership.'
          en: 'Hippo (Drosophila Halder 1995 hippo mutant overgrowth phenotype, named after hippopotamus): mammalian conservation Pan UCSF + Guan UCSD 2007+. Cascade: GPCR/integrin/cell-cell contacts → MST1/2 kinases (Hippo) phosphorylate LATS1/2 (Wts in Drosophila) → LATS phosphorylates YAP/TAZ (Yorkie in Drosophila) → 14-3-3 binding cytoplasmic retention + degradation. When Hippo is inactive → YAP/TAZ → translocate to nucleus → bind TEAD transcription factors → activate proliferation/anti-apoptosis/regeneration targets. Sensors: cell density (E-cadherin, α-catenin), mechanical (substrate stiffness, ECM tension, F-actin), GPCRs (LPA, S1P, thrombin). Applications: organ size control (mouse YAP overexpression → enlarged liver Camargo 2007), regeneration (intestinal, cardiac), tumor suppressor (~30% cancers with Hippo dysfunction — NF2/merlin upstream activator), mesothelioma (NF2 deficient). Therapeutics: TEAD inhibitors VT3989 Vivace + IK-930 Ikena Phase 1/2 in NF2-mutant mesothelioma 2024+. Field 2024 emerging cancer drug class. Pan Caltech + Guan Tsinghua + Halder Leuven leadership.'
        objectives: [Hippo YAP-TAZ]
      - type: choice
        difficulty: 5
        question:
          pt: Notch signaling em câncer e desenvolvimento é…
          en: Notch signaling in cancer and development is…
        choices:
          - Cell-cell contact signaling via Notch1-4 + DSL ligands (Delta, Jagged) → γ-secretase cleavage release NICD → translocates nucleus → CSL/RBPJ transcription; T-ALL ~50% NOTCH1 gain-of-function
          - Pure secreted hormone pathway
          - mRNA translation regulator only
          - Mitochondrial pathway
        correctAnswer: Cell-cell contact signaling via Notch1-4 + DSL ligands (Delta, Jagged) → γ-secretase cleavage release NICD → translocates nucleus → CSL/RBPJ transcription; T-ALL ~50% NOTCH1 gain-of-function
        rationale:
          pt: 'Notch signaling: Drosophila Notch mutant 1917 Morgan ("notched wings"). Mecanismo: Notch1-4 receptors (transmembrane), DSL ligands (Delta-like Dll1/3/4, Jagged Jag1/2) on neighboring cells. Trans-engagement → ADAM10/17 metalloprotease cleavage S2 → γ-secretase (presenilin1/2 + nicastrin) cleavage S3 → release NICD (Notch Intracellular Domain) → translocate nucleus → bind CSL (CBF1/Su(H)/Lag-1, also RBPJ in mammals) transcription factor → recruit Mastermind/MAML → target genes Hes/Hey/Myc. Aplicações: development (binary cell fate, lateral inhibition, somitogenesis, T-cell vs B-cell decision thymus), oncogene T-ALL (~50% NOTCH1 activating mutations Weng/Ferrando Sci 2004), CADASIL (NOTCH3 mutations), Alagille syndrome (JAG1 + NOTCH2). Therapeutics: γ-secretase inhibitors (GSI MK-0752 Merck, RO4929097 Roche, BMS-708163, nirogacestat Phase 3 Springworks desmoid tumor 2023+). Notch decoy receptors (brontictuzumab anti-NOTCH1 OMP-52M51). NICD ligand-trap (delta-1 Fc fusion). Field active.'
          en: 'Notch signaling: Drosophila Notch mutant 1917 Morgan ("notched wings"). Mechanism: Notch1-4 receptors (transmembrane), DSL ligands (Delta-like Dll1/3/4, Jagged Jag1/2) on neighboring cells. Trans-engagement → ADAM10/17 metalloprotease cleavage S2 → γ-secretase (presenilin1/2 + nicastrin) cleavage S3 → releases NICD (Notch Intracellular Domain) → translocates to nucleus → binds CSL (CBF1/Su(H)/Lag-1, also RBPJ in mammals) transcription factor → recruits Mastermind/MAML → target genes Hes/Hey/Myc. Applications: development (binary cell fate, lateral inhibition, somitogenesis, T-cell vs B-cell decision in thymus), oncogene in T-ALL (~50% NOTCH1 activating mutations Weng/Ferrando Sci 2004), CADASIL (NOTCH3 mutations), Alagille syndrome (JAG1 + NOTCH2). Therapeutics: γ-secretase inhibitors (GSI MK-0752 Merck, RO4929097 Roche, BMS-708163, nirogacestat Phase 3 Springworks for desmoid tumor 2023+). Notch decoy receptors (brontictuzumab anti-NOTCH1 OMP-52M51). NICD ligand-trap (delta-1 Fc fusion). Field active.'
        objectives: [Notch signaling]
      - type: choice
        difficulty: 5
        question:
          pt: Hedgehog signaling (Nüsslein-Volhard 1980 Nobel) e drugs é…
          en: Hedgehog signaling (Nüsslein-Volhard 1980 Nobel) and drugs are…
        choices:
          - Sonic hedgehog (SHH) → Patched (PTCH1) → Smoothened (SMO) → GLI transcription factors; SMO inhibitors vismodegib (Erivedge Roche 2012) + sonidegib for basal cell carcinoma + medulloblastoma
          - Pure cytokine pathway
          - Random metabolic enzyme
          - Apoptosis-only mediator
        correctAnswer: Sonic hedgehog (SHH) → Patched (PTCH1) → Smoothened (SMO) → GLI transcription factors; SMO inhibitors vismodegib (Erivedge Roche 2012) + sonidegib for basal cell carcinoma + medulloblastoma
        rationale:
          pt: 'Hedgehog signaling: Christiane Nüsslein-Volhard + Eric Wieschaus Drosophila genetic screens 1980 segmentation genes Nobel 1995. Mammalian: SHH (Sonic Hedgehog), Indian Hedgehog (IHH), Desert Hedgehog (DHH) ligands. Pathway: SHH binds PTCH1 (Patched1, transmembrane receptor) → relieves PTCH1 inhibition Smoothened (SMO, GPCR-like) → SMO ciliary translocation → GLI1/2/3 transcription factors → cleavage repressor form prevented + activator form generated → target genes Ptch1, Gli1, Hhip, Bmp, Wnt, c-Myc. Doenças: basal cell carcinoma (BCC, ~90%+ have PTCH1 LOF or SMO GOF), medulloblastoma SHH subtype (~30% medulloblastomas), Gorlin syndrome (PTCH1 germline mutations → multiple BCCs). Therapeutics: vismodegib (Erivedge Roche FDA 2012 metastatic BCC), sonidegib (Odomzo Sun Pharma 2015), glasdegib (Daurismo Pfizer 2018 AML elderly). Limit: secondary mutations resistance (SMO D473H), Hedgehog-pathway-independent BCC subtypes. Field mature 2024+.'
          en: 'Hedgehog signaling: Christiane Nüsslein-Volhard + Eric Wieschaus Drosophila genetic screens 1980 segmentation genes Nobel 1995. Mammalian: SHH (Sonic Hedgehog), Indian Hedgehog (IHH), Desert Hedgehog (DHH) ligands. Pathway: SHH binds PTCH1 (Patched1, transmembrane receptor) → relieves PTCH1 inhibition of Smoothened (SMO, GPCR-like) → SMO ciliary translocation → GLI1/2/3 transcription factors → cleavage of repressor form prevented + activator form generated → target genes Ptch1, Gli1, Hhip, Bmp, Wnt, c-Myc. Diseases: basal cell carcinoma (BCC, ~90%+ have PTCH1 LOF or SMO GOF), medulloblastoma SHH subtype (~30% of medulloblastomas), Gorlin syndrome (PTCH1 germline mutations → multiple BCCs). Therapeutics: vismodegib (Erivedge Roche FDA 2012 for metastatic BCC), sonidegib (Odomzo Sun Pharma 2015), glasdegib (Daurismo Pfizer 2018 AML elderly). Limit: secondary mutations of resistance (SMO D473H), Hedgehog-pathway-independent BCC subtypes. Field mature 2024+.'
        objectives: [Hedgehog signaling]
      - type: choice
        difficulty: 5
        question:
          pt: Toll-like receptor (TLR) family + adjuvants é…
          en: Toll-like receptor (TLR) family + adjuvants are…
        choices:
          - 10 human TLRs sensing PAMPs (TLR3 dsRNA, TLR4 LPS, TLR7/8 ssRNA, TLR9 CpG-DNA); CpG ODN adjuvants (CpG-1018 Heplisav-B, imiquimod TLR7) + MPL TLR4-agonist (Cervarix HPV vaccine)
          - Single TLR receptor only
          - Pure intracellular pathway without ligand binding
          - Adaptive immunity component without innate sensing
        correctAnswer: 10 human TLRs sensing PAMPs (TLR3 dsRNA, TLR4 LPS, TLR7/8 ssRNA, TLR9 CpG-DNA); CpG ODN adjuvants (CpG-1018 Heplisav-B, imiquimod TLR7) + MPL TLR4-agonist (Cervarix HPV vaccine)
        rationale:
          pt: 'TLR (Toll-like receptors): 10 human TLRs (TLR1-10), Drosophila Toll homologs Charles Janeway Yale + Bruce Beutler UTSW (Nobel 2011 innate immunity discoveries). Surface: TLR1/2/4/5/6 — sense extracellular PAMPs; Endossomal: TLR3/7/8/9 — sense viral nucleic acids. Major pairs: TLR4 (LPS gram-negative bacteria, MD-2 + CD14 co-receptors), TLR3 (dsRNA viral), TLR7/8 (ssRNA endossomal, viral), TLR9 (CpG-unmethylated DNA bacterial/viral), TLR2 dimers (lipoteichoic acid gram-positive, lipoarabinomannan mycobacteria). Downstream: MyD88 (most TLRs) ou TRIF (TLR3, TLR4) → NF-κB + IRF3 → cytokines + type I IFN. Adjuvant aplicações vaccines: AS04 (Cervarix HPV — alum + monophosphoryl lipid A MPL TLR4 agonist), AS01 (Shingrix RZV recombinant zoster — MPL + QS-21), CpG-ODN 1018 (Heplisav-B Dynavax HBV — TLR9 agonist superior immunogenicity vs alum), imiquimod (Aldara TLR7 agonist topical actinic keratosis + BCC). TLR agonists cancer immunotherapy: SD-101 (TLR9), Sting agonists overlap.'
          en: 'TLR (Toll-like receptors): 10 human TLRs (TLR1-10), Drosophila Toll homologs Charles Janeway Yale + Bruce Beutler UTSW (Nobel 2011 for innate immunity discoveries). Surface: TLR1/2/4/5/6 — sense extracellular PAMPs; Endosomal: TLR3/7/8/9 — sense viral nucleic acids. Major pairs: TLR4 (LPS gram-negative bacteria, MD-2 + CD14 co-receptors), TLR3 (dsRNA viral), TLR7/8 (ssRNA endosomal, viral), TLR9 (CpG-unmethylated DNA bacterial/viral), TLR2 dimers (lipoteichoic acid gram-positive, lipoarabinomannan mycobacteria). Downstream: MyD88 (most TLRs) or TRIF (TLR3, TLR4) → NF-κB + IRF3 → cytokines + type I IFN. Adjuvant applications in vaccines: AS04 (Cervarix HPV — alum + monophosphoryl lipid A MPL TLR4 agonist), AS01 (Shingrix RZV recombinant zoster — MPL + QS-21), CpG-ODN 1018 (Heplisav-B Dynavax HBV — TLR9 agonist superior immunogenicity vs alum), imiquimod (Aldara TLR7 agonist topical for actinic keratosis + BCC). TLR agonists in cancer immunotherapy: SD-101 (TLR9), STING agonists overlap.'
        objectives: [TLR adjuvants]
      - type: choice
        difficulty: 5
        question:
          pt: Inflammaging + chronic low-grade inflammation aging é…
          en: Inflammaging + chronic low-grade inflammation aging is…
        choices:
          - Age-related elevation of inflammatory cytokines (IL-6, CRP, TNF) driving frailty, cardiovascular disease, dementia, and biological aging — targeted by senolytics + anti-IL-6 + lifestyle
          - Pure acute infection without chronicity
          - Healthy aging without inflammation
          - Childhood disease only
        correctAnswer: Age-related elevation of inflammatory cytokines (IL-6, CRP, TNF) driving frailty, cardiovascular disease, dementia, and biological aging — targeted by senolytics + anti-IL-6 + lifestyle
        rationale:
          pt: 'Inflammaging: Claudio Franceschi Bologna 2000 cunhou termo. Phenomenon: chronic, low-grade systemic inflammation accompanying aging. Markers: IL-6 (~2-4x increase older adults), CRP (C-reactive protein), TNF, IL-1β, fibrinogen elevated. Drivers: (1) cellular senescência + SASP (López-Otín hallmark), (2) chronic infection (CMV+ ~80% adults late life), (3) gut barrier dysfunction (LPS leakage), (4) clonal hematopoiesis CHIP (Jaiswal 2014), (5) accumulated damage DAMPs (mitochondrial DNA leakage cGAS-STING activation), (6) impaired autofagia + proteostasis. Consequências: ~70% chronic disease morbidity older adults — atherosclerosis, type 2 diabetes, dementia (Alzheimer + vascular), sarcopenia/frailty, cancer. Therapeutics: (1) senolytics (D+Q dasatinib+quercetin, fisetin), (2) anti-IL-6 (canakinumab CANTOS NEJM 2017 reduced cardiovascular events especially CHIP+), (3) lifestyle (Mediterranean diet, exercise, sleep, weight management), (4) metformin TAME trial (Targeting Aging Metformin Barzilai), (5) rapamycin (PEARL Phase 1/2 trial). Field interventions extending healthy lifespan biological aging.'
          en: 'Inflammaging: Claudio Franceschi Bologna 2000 coined the term. Phenomenon: chronic, low-grade systemic inflammation accompanying aging. Markers: IL-6 (~2-4x increase in older adults), CRP (C-reactive protein), TNF, IL-1β, fibrinogen elevated. Drivers: (1) cellular senescence + SASP (López-Otín hallmark), (2) chronic infection (CMV+ ~80% of adults in late life), (3) gut barrier dysfunction (LPS leakage), (4) clonal hematopoiesis CHIP (Jaiswal 2014), (5) accumulated damage DAMPs (mitochondrial DNA leakage cGAS-STING activation), (6) impaired autophagy + proteostasis. Consequences: ~70% of chronic disease morbidity in older adults — atherosclerosis, type 2 diabetes, dementia (Alzheimer + vascular), sarcopenia/frailty, cancer. Therapeutics: (1) senolytics (D+Q dasatinib+quercetin, fisetin), (2) anti-IL-6 (canakinumab CANTOS NEJM 2017 reduced cardiovascular events especially in CHIP+), (3) lifestyle (Mediterranean diet, exercise, sleep, weight management), (4) metformin TAME trial (Targeting Aging with Metformin Barzilai), (5) rapamycin (PEARL Phase 1/2 trial). Field interventions extending healthy lifespan + biological aging.'
        objectives: [Inflammaging]
      - type: choice
        difficulty: 5
        question:
          pt: Ferroptose-targeted cancer therapeutics 2024+ é…
          en: Ferroptosis-targeted cancer therapeutics 2024+ is…
        choices:
          - Inhibitors of GPX4, FSP1, SLC7A11 inducing ferroptosis in drug-resistant mesenchymal cancers; biomarker-driven trials in renal, sarcoma, mesothelioma 2024+
          - Pure apoptosis-inducing chemotherapy
          - Vaccine-based without ferroptosis component
          - Standard targeted therapies without ferroptosis context
        correctAnswer: Inhibitors of GPX4, FSP1, SLC7A11 inducing ferroptosis in drug-resistant mesenchymal cancers; biomarker-driven trials in renal, sarcoma, mesothelioma 2024+
        rationale:
          pt: 'Ferroptose terapêuticas oncológicas 2024+: certain cancers vulnerable ferroptose induction — drug-resistant mesenchymal-like states (EMT epithelial-to-mesenchymal transition), persistent cells survive targeted therapy, GPX4-low/FSP1-low cancers. Biomarkers: GPX4 expression, ACSL4 (lipid metabolism), CD36, SLC7A11/xCT (cystine import). Drug classes: (1) GPX4 inhibitors — RSL3 (preclinical), ML162, Ferrostatin-1 (research tool only opposite direction). (2) Cystine import inhibitors — erastin (xCT inhibitor), sulfasalazine (anti-inflammatory + xCT). (3) Iron-loading — ammonium ferric citrate, hemin. (4) FSP1 inhibitors (Bersuker/Conrad 2019, Doll 2019 Nature) — preclinical iFSP1, viFSP1. Clinical pipeline: Aprea Therapeutics, Kojin Therapeutics (ferroptose-induction platform 2021+ funded). Combinações: anti-PD-1 + ferroptose enhancers (CD8 T cells release IFNγ → reduce SLC7A11 → tumor ferroptose). Field 2024 active translational efforts. Gao/Stockwell Columbia + Conrad/Helmholtz Munich + Olzmann Berkeley laboratórios. Limit: lipid biology heterogeneity, in vivo PD biomarkers difficult.'
          en: 'Ferroptosis cancer therapeutics 2024+: certain cancers vulnerable to ferroptosis induction — drug-resistant mesenchymal-like states (EMT epithelial-to-mesenchymal transition), persister cells surviving targeted therapy, GPX4-low/FSP1-low cancers. Biomarkers: GPX4 expression, ACSL4 (lipid metabolism), CD36, SLC7A11/xCT (cystine import). Drug classes: (1) GPX4 inhibitors — RSL3 (preclinical), ML162, Ferrostatin-1 (research tool only, opposite direction). (2) Cystine import inhibitors — erastin (xCT inhibitor), sulfasalazine (anti-inflammatory + xCT). (3) Iron-loading — ammonium ferric citrate, hemin. (4) FSP1 inhibitors (Bersuker/Conrad 2019, Doll 2019 Nature) — preclinical iFSP1, viFSP1. Clinical pipeline: Aprea Therapeutics, Kojin Therapeutics (ferroptosis-induction platform 2021+ funded). Combinations: anti-PD-1 + ferroptosis enhancers (CD8 T cells release IFNγ → reduce SLC7A11 → tumor ferroptosis). Field 2024 active translational efforts. Gao/Stockwell Columbia + Conrad/Helmholtz Munich + Olzmann Berkeley labs. Limit: lipid biology heterogeneity, in vivo PD biomarkers difficult.'
        objectives: [Ferroptosis cancer therapeutics]
