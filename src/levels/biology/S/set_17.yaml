title:
  pt: Inflamação, Morte Celular e Sinalização
  en: Inflammation, Cell Death, and Signaling
level: S
subject: biology
objectives:
  - Compreender pyroptose, ferroptose, necroptose, cuproptose
  - Reconhecer NLRP3 inflamassoma, gasdermina, MLKL
  - Identificar cGAS-STING, autofagia, ISR
  - Avaliar mTOR, NF-κB, Wnt, Hippo, Notch
difficulty: 5
authorNotes: |
  Cell death + inflammation 2024+: Shao GSDMD pyroptosis 2015, Stockwell ferroptosis GPX4 2012,
  Vandenabeele/Han necroptosis MLKL/RIPK3, Tsvetkov/Golub cuproptosis Sci 2022. Tschopp NLRP3
  Cell 2002. Levine autofagia ULK1/ATG. cGAS-STING Chen Z 2008. CANTOS canakinumab anti-IL-1β.
example:
  question:
    pt: Pyroptosis (Shao Nature 2015 GSDMD) é…
    en: Pyroptosis (Shao Nature 2015 GSDMD) is…
  choices:
    - Inflammatory programmed cell death — caspase-1/4/5/11 cleaves gasdermin D, liberating N-terminal pore-forming domain → membrane pores → IL-1β release + lytic death
    - Pure apoptosis without inflammatory component
    - Random necrosis without organized pathway
    - Autophagic cell death
  correctAnswer: Inflammatory programmed cell death — caspase-1/4/5/11 cleaves gasdermin D, liberating N-terminal pore-forming domain → membrane pores → IL-1β release + lytic death
  rationale:
    pt: 'Pyroptosis: discovered Cookson/Brennan 2001 conceito → Shi Zhao Wang Cell 2015 + Kayagaki 2015 + He Wang Mu Nature 2015 ID gasdermina D (GSDMD) substrate caspase-1/4/5/11 inflammatory caspases. Cleavage GSDMD → N-terminal domain forms pores 10-20nm membrane → IL-1β/IL-18 efflux + osmotic lysis. NLRP3 inflammasome activation (Tschopp 2002) → caspase-1 → GSDMD pyroptosis cascade. Família gasderminas: GSDMA, GSDMB, GSDMC, GSDMD, GSDME (caspase-3 cleaves chemotherapy-induced pyroptosis Wang/Shao Nature 2017). Aplicações: bacterial infections defense, autoinflammatory syndromes (CAPS Cryopyrin-Associated Periodic Syndromes), cancer immunotherapy bystander killing. Therapeutics: NLRP3 inhibitors MCC950 (Coll/O''Neill 2015), dapansutrile clinical 2024, ZYIL1 Phase 2 gout. Feng Shao NIBS Beijing pioneer.'
    en: 'Pyroptosis: discovered conceptually by Cookson/Brennan 2001 → Shi/Shao Cell 2015 + Kayagaki 2015 + He/Wang Nature 2015 identified gasdermin D (GSDMD) as substrate of caspase-1/4/5/11 inflammatory caspases. Cleavage of GSDMD → N-terminal domain forms 10-20 nm pores in membrane → IL-1β/IL-18 efflux + osmotic lysis. NLRP3 inflammasome activation (Tschopp 2002) → caspase-1 → GSDMD pyroptosis cascade. Gasdermin family: GSDMA, GSDMB, GSDMC, GSDMD, GSDME (caspase-3 cleaves it for chemotherapy-induced pyroptosis Wang/Shao Nature 2017). Applications: bacterial infection defense, autoinflammatory syndromes (CAPS Cryopyrin-Associated Periodic Syndromes), cancer immunotherapy bystander killing. Therapeutics: NLRP3 inhibitors MCC950 (Coll/O''Neill 2015), dapansutrile in clinic 2024, ZYIL1 Phase 2 for gout. Feng Shao NIBS Beijing pioneer.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Morte celular e inflamação
      en: Page 1 — Cell death and inflammation
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: Ferroptosis (Stockwell Cell 2012 + Conrad Cell 2014) é…
          en: Ferroptosis (Stockwell Cell 2012 + Conrad Cell 2014) is…
        choices:
          - Iron-dependent cell death from lipid peroxidation when GPX4 (glutathione peroxidase 4) fails to detoxify lipid hydroperoxides — selectively kills cancer cells with high iron + PUFA
          - Pure apoptosis caspase-dependent
          - Random necrotic death without specific lipid mechanism
          - Autophagy-dependent only
        correctAnswer: Iron-dependent cell death from lipid peroxidation when GPX4 (glutathione peroxidase 4) fails to detoxify lipid hydroperoxides — selectively kills cancer cells with high iron + PUFA
        rationale:
          pt: 'Ferroptose (Dixon Lemberg Lamprecht Skouta Zaitsev Gleason Patel Bauer Cantley Yang Morrison Stockwell Columbia Cell 2012): nome cunhado distinto de apoptose/necrose/autofagia. Mecanismo: Fe²⁺ + H₂O₂ Fenton reaction → lipid peroxidation → membrane damage. GPX4 (Conrad Yang Cell 2014) reduce lipid hidroperóxidos → previne ferroptose. Erastin (RSL3 inhibitor cystine/glutamate antiporter SLC7A11) → glutathione depletion → ferroptose. RSL3 inhibe GPX4 directly. Aplicações cancer: certain mesenchymal/drug-resistant cancers vulnerable (FSP1 KO, glutathione-low, GPX4-low). Translational: ML210/RSL3 ferroptose-inducer preclinical, FSP1 (Bersuker Conrad Nature 2019 + Doll/Conrad Nature 2019). Stockwell Columbia + Conrad Helmholtz Munich pioneers.'
          en: 'Ferroptosis (Dixon/Stockwell Columbia Cell 2012): name coined to distinguish from apoptosis/necrosis/autophagy. Mechanism: Fe²⁺ + H₂O₂ Fenton reaction → lipid peroxidation → membrane damage. GPX4 (Conrad/Yang Cell 2014) reduces lipid hydroperoxides → prevents ferroptosis. Erastin (RSL3 inhibitor of cystine/glutamate antiporter SLC7A11) → glutathione depletion → ferroptosis. RSL3 inhibits GPX4 directly. Applications cancer: certain mesenchymal/drug-resistant cancers vulnerable (FSP1 KO, glutathione-low, GPX4-low). Translational: ML210/RSL3 ferroptosis-inducer preclinical, FSP1 (Bersuker/Conrad Nature 2019 + Doll/Conrad Nature 2019). Stockwell Columbia + Conrad Helmholtz Munich pioneers.'
        objectives: [Ferroptosis]
      - type: choice
        difficulty: 5
        question:
          pt: Necroptosis (Han/Vandenabeele 2009 RIPK3-MLKL) é…
          en: Necroptosis (Han/Vandenabeele 2009 RIPK3-MLKL) is…
        choices:
          - Programmed necrotic cell death via RIPK1/RIPK3 + MLKL phosphorylation → MLKL oligomerizes plasma membrane forming pores when caspase-8 inhibited
          - Pure apoptosis caspase-mediated
          - Random necrosis without genetic regulation
          - Cytokine release without membrane damage
        correctAnswer: Programmed necrotic cell death via RIPK1/RIPK3 + MLKL phosphorylation → MLKL oligomerizes plasma membrane forming pores when caspase-8 inhibited
        rationale:
          pt: 'Necroptose: TNF/Fas/TRAIL receptors → caspase-8 normally cleaves RIPK1 prevents necroptose. Caspase-8 inhibited (zVAD-fmk, viral inhibitors CrmA/IAPs) → RIPK1+RIPK3 complex (necrosome) phosphorylate MLKL (Mixed Lineage Kinase Domain-Like, Sun Cell 2012 + Murphy Cell 2013) → MLKL oligomerization plasma membrane → pores → necroptotic cell death + DAMPs release immunogenic. Necrostatin-1 (Yuan 2005 Nat Chem Biol) inhibits RIPK1. Aplicações: neurodegenerative (ALS Re Pope Stem Cell 2018 RIPK1+ motor neurons), ischemia-reperfusion, sepsis. GSK2982772 Phase 2 RIPK1 inhibitor psoriasis. Vandenabeele Ghent + Han DKFZ Heidelberg + Yuan Harvard.'
          en: 'Necroptosis: TNF/Fas/TRAIL receptors → caspase-8 normally cleaves RIPK1 to prevent necroptosis. When caspase-8 is inhibited (zVAD-fmk, viral inhibitors CrmA/IAPs) → RIPK1+RIPK3 complex (necrosome) phosphorylates MLKL (Mixed Lineage Kinase Domain-Like, Sun Cell 2012 + Murphy Cell 2013) → MLKL oligomerization at plasma membrane → pores → necroptotic cell death + immunogenic DAMP release. Necrostatin-1 (Yuan 2005 Nat Chem Biol) inhibits RIPK1. Applications: neurodegenerative (ALS Re Pope Stem Cell 2018 RIPK1+ motor neurons), ischemia-reperfusion, sepsis. GSK2982772 Phase 2 RIPK1 inhibitor for psoriasis. Vandenabeele Ghent + Han DKFZ Heidelberg + Yuan Harvard pioneers.'
        objectives: [Necroptosis]
      - type: choice
        difficulty: 5
        question:
          pt: Cuproptosis (Tsvetkov/Golub Science 2022) é…
          en: Cuproptosis (Tsvetkov/Golub Science 2022) is…
        choices:
          - Copper-dependent cell death from FDX1-mediated lipoylation aggregation of TCA cycle enzymes (DLAT) → proteotoxic stress; relevant to Wilson disease + cancer copper sensitivity
          - Iron-dependent without copper
          - Pure apoptosis copper-induced
          - Random necrosis
        correctAnswer: Copper-dependent cell death from FDX1-mediated lipoylation aggregation of TCA cycle enzymes (DLAT) → proteotoxic stress; relevant to Wilson disease + cancer copper sensitivity
        rationale:
          pt: 'Cuproptose (Tsvetkov Coy Petrova Dreishpoon Verma Abdusamad Rossen Joesch-Cohen Humeidi Spangler Eaton Frenkel Kocak Corsello Lutsenko Kanarek Santagata Golub Sci 2022 abril): novel copper-dependent cell death distinct ferroptose. Mecanismo: copper ionophores (elesclomol, disulfiram) → Cu²⁺ entra cytoplasm → FDX1 (ferredoxin-1) reduce → loads onto lipoylated TCA cycle enzymes (DLAT, dihydrolipoamide S-acetyltransferase) → aggregation lipoyl-DLAT → proteotoxic stress + Fe-S cluster loss → cell death. Marker: lipoyl-DLAT/lipoyl-DLST aggregation. Significância clínica: Wilson disease (ATP7B mutation copper accumulation), targets cancer cell copper sensitivity, chelation/induction strategies. Field 2024 active expansion. Vamsi Mootha + Tsvetkov + Todd Golub Broad Institute.'
          en: 'Cuproptosis (Tsvetkov/Golub Sci April 2022): novel copper-dependent cell death distinct from ferroptosis. Mechanism: copper ionophores (elesclomol, disulfiram) → Cu²⁺ enters cytoplasm → FDX1 (ferredoxin-1) reduces → loads onto lipoylated TCA cycle enzymes (DLAT, dihydrolipoamide S-acetyltransferase) → aggregation of lipoyl-DLAT → proteotoxic stress + Fe-S cluster loss → cell death. Marker: lipoyl-DLAT/lipoyl-DLST aggregation. Clinical significance: Wilson disease (ATP7B mutation, copper accumulation), targets cancer cell copper sensitivity, chelation/induction strategies. Field 2024 active expansion. Vamsi Mootha + Tsvetkov + Todd Golub Broad Institute.'
        objectives: [Cuproptosis]
      - type: choice
        difficulty: 5
        question:
          pt: Autophagy (Ohsumi Nobel 2016) mechanism é…
          en: Autophagy (Ohsumi 2016 Nobel) mechanism is…
        choices:
          - Lysosomal degradation of cytoplasmic contents via double-membrane autophagosomes — ULK1/ATG/Beclin1/LC3 machinery; selective forms (mitophagy PINK1/Parkin, xenophagy)
          - Pure proteasomal degradation
          - Random membrane recycling without target
          - Single-membrane vesicles only
        correctAnswer: Lysosomal degradation of cytoplasmic contents via double-membrane autophagosomes — ULK1/ATG/Beclin1/LC3 machinery; selective forms (mitophagy PINK1/Parkin, xenophagy)
        rationale:
          pt: 'Autophagy (Yoshinori Ohsumi Tokyo Inst Tech Nobel 2016): yeast forward genetics screen ATG genes 1990s+. Mecanismo: ULK1/ATG1 kinase complex → PI3K Beclin1/VPS34 → ATG12-ATG5 + LC3-II lipidation → phagophore double membrane → engulfs cytoplasm/organelles → autofagossomo → fuses lysosome → degradation. Selective: mitofagia (PINK1/Parkin pioneirana Pickrell/Youle 2015), xenofagia (intracellular bacteria), aggrephagy, lipofagia, ferritinofagia. Aplicações: cancer (autofagia tumor suppressor early, promoter advanced), neurodegeneração (proteopatias α-synuclein/tau/Aβ), longevidade (caloric restriction induces autofagia), aging hallmark López-Otín. Hidroxicloroquina autofagia inhibitor preclinical; chloroquine clinical trials cancer. Ohsumi Nobel symbolic decade-long discovery.'
          en: 'Autophagy (Yoshinori Ohsumi Tokyo Inst Tech Nobel 2016): yeast forward genetics screen identified ATG genes in 1990s+. Mechanism: ULK1/ATG1 kinase complex → PI3K Beclin1/VPS34 → ATG12-ATG5 + LC3-II lipidation → phagophore double membrane → engulfs cytoplasm/organelles → autophagosome → fuses with lysosome → degradation. Selective forms: mitophagy (PINK1/Parkin pioneered Pickrell/Youle 2015), xenophagy (intracellular bacteria), aggrephagy, lipophagy, ferritinophagy. Applications: cancer (autophagy is tumor suppressor early, promoter advanced), neurodegeneration (proteinopathies α-synuclein/tau/Aβ), longevity (caloric restriction induces autophagy), aging hallmark of López-Otín. Hydroxychloroquine is autophagy inhibitor preclinical; chloroquine in clinical trials for cancer. Ohsumi Nobel symbolic of decade-long discovery.'
        objectives: [Autophagy]
      - type: choice
        difficulty: 5
        question:
          pt: cGAS-STING pathway (Sun/Chen Cell 2013) function é…
          en: cGAS-STING pathway (Sun/Chen Cell 2013) function is…
        choices:
          - Cytosolic DNA sensor cGAS produces 2′3′-cGAMP → activates STING → TBK1/IRF3 → type I IFN production for antiviral + anti-tumor immunity
          - mRNA translation regulator only
          - Pure apoptosis pathway
          - Mitochondrial respiration component
        correctAnswer: Cytosolic DNA sensor cGAS produces 2′3′-cGAMP → activates STING → TBK1/IRF3 → type I IFN production for antiviral + anti-tumor immunity
        rationale:
          pt: 'cGAS-STING (Sun Wu Du Chen Chen UTSW Cell 2013 + Wu Sun Cell 2013): cGAS (cyclic GMP-AMP synthase) cytosolic DNA sensor — binds dsDNA → catalyzes synthesis 2′3′-cyclic GMP-AMP (2′3′-cGAMP) → STING (Stimulator IFN Genes, Ishikawa/Barber 2008) ER membrane receptor → traffics Golgi → recruits TBK1 → phosphorylates IRF3 → type I IFN (IFN-β) gene expression. Detection self-DNA leakage micronuclei (genome instability cancer), mitochondrial DNA (mtDNA stress), retroelements, viral DNA. Aplicações: anti-cancer immunotherapy (STING agonists ADU-S100 Aduro Bristol, MSA-2 Pan/Glickman 2020), anti-viral immunity, autoimmunity (Aicardi-Goutières syndrome TREX1 mutations → cGAS hyperactivation → IFN signature), aging (mtDNA leakage senescent cells SASP IFN component). Zhijian "James" Chen UTSW HHMI pioneer 2013 Lasker Award 2018.'
          en: 'cGAS-STING (Sun/Chen UTSW Cell 2013 + Wu/Chen Cell 2013): cGAS (cyclic GMP-AMP synthase) is cytosolic DNA sensor — binds dsDNA → catalyzes synthesis of 2′3′-cyclic GMP-AMP (2′3′-cGAMP) → STING (Stimulator of IFN Genes, Ishikawa/Barber 2008) ER membrane receptor → traffics to Golgi → recruits TBK1 → phosphorylates IRF3 → type I IFN (IFN-β) gene expression. Detects self-DNA leakage from micronuclei (genome instability in cancer), mitochondrial DNA (mtDNA stress), retroelements, viral DNA. Applications: anti-cancer immunotherapy (STING agonists ADU-S100 Aduro Bristol, MSA-2 Pan/Glickman 2020), anti-viral immunity, autoimmunity (Aicardi-Goutières syndrome TREX1 mutations → cGAS hyperactivation → IFN signature), aging (mtDNA leakage in senescent cells, SASP IFN component). Zhijian "James" Chen UTSW HHMI pioneer 2013, Lasker Award 2018.'
        objectives: [cGAS-STING]
      - type: choice
        difficulty: 5
        question:
          pt: Integrated stress response (ISR, Walter/Ron 2011) é…
          en: Integrated stress response (ISR, Walter/Ron 2011) is…
        choices:
          - Convergent eIF2α phosphorylation by 4 kinases (PERK, GCN2, PKR, HRI) → global translation arrest + ATF4 stress-response gene induction; ISRIB (Walter 2013) reverses translational block
          - Pure heat-shock response only
          - mTOR-only signaling
          - Random translation arrest without coordination
        correctAnswer: Convergent eIF2α phosphorylation by 4 kinases (PERK, GCN2, PKR, HRI) → global translation arrest + ATF4 stress-response gene induction; ISRIB (Walter 2013) reverses translational block
        rationale:
          pt: 'Integrated Stress Response (ISR): four sensor kinases respond stresses → all phosphorylate eIF2α Ser51: PERK (ER unfolded protein), GCN2 (amino acid starvation), PKR (dsRNA viral), HRI (heme deprivation, oxidative stress). p-eIF2α inhibits eIF2B → reduces ternary complex eIF2-GTP-tRNA-Met → general translation arrest, but uORF-bypassed mRNAs translated (ATF4, CHOP, GADD34) → stress response transcription. ISRIB (Sidrauski/Walter 2013) — small molecule binds eIF2B → activates spite p-eIF2α → reverses translational arrest. Aplicações: prion disease (Walter/Mallucci 2017 ISRIB neuroprotective), traumatic brain injury memory, age-related cognitive decline, vanishing white matter disease (eIF2B mutations). Cancer: ISR sustained → cell cycle arrest, senescence, apoptosis. Walter/Ron pioneers UCSF + Cambridge.'
          en: 'Integrated Stress Response (ISR): four sensor kinases respond to stresses → all phosphorylate eIF2α at Ser51: PERK (ER unfolded protein), GCN2 (amino acid starvation), PKR (dsRNA viral), HRI (heme deprivation, oxidative stress). p-eIF2α inhibits eIF2B → reduces ternary complex eIF2-GTP-tRNA-Met → general translation arrest, but uORF-bypassed mRNAs are translated (ATF4, CHOP, GADD34) → stress-response transcription. ISRIB (Sidrauski/Walter 2013) — small molecule binds eIF2B → activates despite p-eIF2α → reverses translational arrest. Applications: prion disease (Walter/Mallucci 2017 ISRIB neuroprotective), traumatic brain injury memory, age-related cognitive decline, vanishing white matter disease (eIF2B mutations). Cancer: sustained ISR → cell cycle arrest, senescence, apoptosis. Walter/Ron pioneers UCSF + Cambridge.'
        objectives: [Integrated stress response]
      - type: choice
        difficulty: 5
        question:
          pt: NLRP3 inflammasome (Tschopp Cell 2002) é…
          en: NLRP3 inflammasome (Tschopp Cell 2002) is…
        choices:
          - Innate immune sensor responding to PAMPs/DAMPs (cholesterol crystals, urate, K+ efflux) → caspase-1 activation → IL-1β/IL-18 cleavage + pyroptosis; targeted by canakinumab (CANTOS) + MCC950
          - Pure adaptive immunity component
          - Standard transcription factor without inflammasome role
          - Apoptosis-only pathway
        correctAnswer: Innate immune sensor responding to PAMPs/DAMPs (cholesterol crystals, urate, K+ efflux) → caspase-1 activation → IL-1β/IL-18 cleavage + pyroptosis; targeted by canakinumab (CANTOS) + MCC950
        rationale:
          pt: 'NLRP3 inflamassoma (Jürg Tschopp Lausanne Cell 2002 conceito + Cell 2009 + Mol Cell 2010 detalhes): NLR (NOD-like receptor) family pyrin domain-containing 3. Sensor PAMPs (LPS, MSU monosodium urate gout, cholesterol crystals atherosclerosis) + DAMPs (ATP, K⁺ efflux). Two-step activation: priming (TLR/NF-κB → NLRP3 + pro-IL-1β transcription) + activation (oligomerization NLRP3 + ASC + caspase-1 → ASC speck → caspase-1 cleaves pro-IL-1β/IL-18 → mature cytokines + GSDMD cleavage → pyroptose). Doenças: CAPS (NLRP3 gain-of-function mutations Cryopyrin-Associated Periodic Syndromes), gota (cristal urato), aterosclerose, doença Alzheimer (Aβ aggregates), diabetes type 2. Therapeutics: anakinra (IL-1RA), canakinumab (anti-IL-1β CANTOS Ridker NEJM 2017 cardiovascular benefit + sub-analysis cancer). MCC950 (Coll/O''Neill 2015) NLRP3 inhibitor preclinical. Inzomelid Phase 2 CAPS, dapansutrile, ZYIL1 Phase 2 gout. Field 2024+ Mature.'
          en: 'NLRP3 inflammasome (Jürg Tschopp Lausanne Cell 2002 concept + Cell 2009 + Mol Cell 2010 details): NLR (NOD-like receptor) family pyrin domain-containing 3. Sensor of PAMPs (LPS, MSU monosodium urate in gout, cholesterol crystals in atherosclerosis) + DAMPs (ATP, K⁺ efflux). Two-step activation: priming (TLR/NF-κB → NLRP3 + pro-IL-1β transcription) + activation (oligomerization of NLRP3 + ASC + caspase-1 → ASC speck → caspase-1 cleaves pro-IL-1β/IL-18 → mature cytokines + GSDMD cleavage → pyroptosis). Diseases: CAPS (NLRP3 gain-of-function mutations Cryopyrin-Associated Periodic Syndromes), gout (urate crystals), atherosclerosis, Alzheimer disease (Aβ aggregates), type 2 diabetes. Therapeutics: anakinra (IL-1RA), canakinumab (anti-IL-1β CANTOS Ridker NEJM 2017 cardiovascular benefit + sub-analysis cancer). MCC950 (Coll/O''Neill 2015) NLRP3 inhibitor preclinical. Inzomelid Phase 2 CAPS, dapansutrile, ZYIL1 Phase 2 gout. Field 2024+ mature.'
        objectives: [NLRP3 inflammasome]
      - type: choice
        difficulty: 5
        question:
          pt: SASP (Senescence-Associated Secretory Phenotype, Coppé/Campisi 2008) é…
          en: SASP (Senescence-Associated Secretory Phenotype, Coppé/Campisi 2008) is…
        choices:
          - Pro-inflammatory secretome (IL-6, IL-8, TNF, MMPs) of senescent cells driving aging-related tissue dysfunction; targeted by senolytics (D+Q dasatinib+quercetin)
          - Pure cell death without secretory component
          - Identical to apoptosis
          - Quiescence without secretion
        correctAnswer: Pro-inflammatory secretome (IL-6, IL-8, TNF, MMPs) of senescent cells driving aging-related tissue dysfunction; targeted by senolytics (D+Q dasatinib+quercetin)
        rationale:
          pt: 'SASP (Coppé Patil Rodier Sun Muñoz Goldstein Nelson Desprez Campisi PLOS Biol 2008): cellular senescência (p16, p21, p53 driven cell cycle arrest) + pro-inflammatory secretome — IL-6, IL-8 (CXCL8), TNF, MMPs, GDF15. Drivers: NF-κB, C/EBPβ, mTOR, GATA4. Aging hallmark López-Otín. Beneficial short-term (wound healing, tumor suppression) but chronic accumulação with age → "inflammaging" + tissue dysfunction. Therapies: senolytics (D+Q Kirkland Mayo 2015, fisetin, navitoclax BCL-2/BCL-xL inhibitors selectively kill senescent cells) → improve aging hallmarks animal models. Senomorphics: rapamycin mTOR, metformin AMPK reduce SASP without killing. Concurrent: senescent cell single-cell atlases, biomarkers (p16INK4a, lipofuscin). Companies: Unity Biotechnologies (UBX1325 ophthalmology Phase 2), BioAge, Rejuvenate Bio. Campisi pioneer Buck Institute Aging.'
          en: 'SASP (Coppé/Campisi PLOS Biol 2008): cellular senescence (p16, p21, p53 driven cell cycle arrest) + pro-inflammatory secretome — IL-6, IL-8 (CXCL8), TNF, MMPs, GDF15. Drivers: NF-κB, C/EBPβ, mTOR, GATA4. Aging hallmark of López-Otín. Beneficial short-term (wound healing, tumor suppression) but chronic accumulation with age → "inflammaging" + tissue dysfunction. Therapies: senolytics (D+Q Kirkland Mayo 2015, fisetin, navitoclax BCL-2/BCL-xL inhibitors selectively kill senescent cells) → improve aging hallmarks in animal models. Senomorphics: rapamycin mTOR, metformin AMPK reduce SASP without killing. Concurrent: senescent cell single-cell atlases, biomarkers (p16INK4a, lipofuscin). Companies: Unity Biotechnologies (UBX1325 ophthalmology Phase 2), BioAge, Rejuvenate Bio. Campisi pioneer Buck Institute Aging.'
        objectives: [SASP]
      - type: choice
        difficulty: 5
        question:
          pt: Ubiquitin-proteasome system (UPS) e drug discovery é…
          en: Ubiquitin-proteasome system (UPS) and drug discovery is…
        choices:
          - K48-polyubiquitin tagging targets proteins to 26S proteasome; bortezomib (Velcade Millennium 2003) FDA-approved proteasome inhibitor multiple myeloma + PROTACs hijack E3 ligases
          - Pure lysosomal degradation
          - Random protein degradation without ubiquitin
          - Single E3 ligase pathway only
        correctAnswer: K48-polyubiquitin tagging targets proteins to 26S proteasome; bortezomib (Velcade Millennium 2003) FDA-approved proteasome inhibitor multiple myeloma + PROTACs hijack E3 ligases
        rationale:
          pt: 'Ubiquitin-proteasome system (UPS): Ciechanover/Hershko/Rose Nobel Chem 2004 discovery ubiquitin-mediated degradation. E1 activating + E2 conjugating + E3 ligase (~600 in humans) → polyubiquitin chains; K48-linked → 26S proteasome → degraded; K63-linked → signaling. Targets ~80% intracellular proteins. UPS therapeutics: (1) Bortezomib (Velcade, Millennium/Takeda 2003): boronate inhibitor 26S proteasome 20S subunit, FDA-approved multiple myeloma + mantle cell lymphoma. Subsequent: carfilzomib (Kyprolis), ixazomib (Ninlaro). (2) PROTACs (Crews Yale + Deshaies Caltech 2001): bifunctional ligand E3 ligase (CRBN cereblon, VHL) + target protein → induce ubiquitination + degradation. ARV-471 (Pfizer/Arvinas vepdegestrant ER+ breast Phase 3 2024+), KT-474 (IRAK4 Sanofi/Kymera Phase 1). Field hot 2024+ ~$5B annual investment.'
          en: 'Ubiquitin-proteasome system (UPS): Ciechanover/Hershko/Rose Nobel Chem 2004 for discovery of ubiquitin-mediated degradation. E1 activating + E2 conjugating + E3 ligase (~600 in humans) → polyubiquitin chains; K48-linked → 26S proteasome → degraded; K63-linked → signaling. Targets ~80% of intracellular proteins. UPS therapeutics: (1) Bortezomib (Velcade, Millennium/Takeda 2003): boronate inhibitor of 26S proteasome 20S subunit, FDA-approved for multiple myeloma + mantle cell lymphoma. Subsequent: carfilzomib (Kyprolis), ixazomib (Ninlaro). (2) PROTACs (Crews Yale + Deshaies Caltech 2001): bifunctional ligand binds E3 ligase (CRBN cereblon, VHL) + target protein → induces ubiquitination + degradation. ARV-471 (Pfizer/Arvinas vepdegestrant ER+ breast Phase 3 2024+), KT-474 (IRAK4 Sanofi/Kymera Phase 1). Field hot 2024+ ~$5B annual investment.'
        objectives: [UPS bortezomib PROTACs]
      - type: choice
        difficulty: 5
        question:
          pt: Anti-IL-6 + anti-TNF biologics impact é…
          en: Anti-IL-6 + anti-TNF biologics impact is…
        choices:
          - Anti-TNF (infliximab Remicade J&J 1998 first; adalimumab Humira AbbVie blockbuster) revolutionized RA/IBD/psoriasis; anti-IL-6 (tocilizumab Actemra Roche) for RA + GvHD + COVID-19 cytokine storm
          - Pure non-biological treatments only
          - Single-target without diversity
          - Antibody-only without small-molecule biologics
        correctAnswer: Anti-TNF (infliximab Remicade J&J 1998 first; adalimumab Humira AbbVie blockbuster) revolutionized RA/IBD/psoriasis; anti-IL-6 (tocilizumab Actemra Roche) for RA + GvHD + COVID-19 cytokine storm
        rationale:
          pt: 'Anti-cytokine biologics: ~$50B+ annual market. (1) Anti-TNF: infliximab (Remicade, J&J/Centocor 1998 first chimeric) — Crohn disease, RA, ankylosing spondylitis, psoriasis. Adalimumab (Humira AbbVie, fully human, phage display Greg Winter 2002 FDA) — top-selling drug worldwide ~$20B/year peak. Etanercept (Enbrel Amgen, TNFR-Fc fusion). Golimumab (Simponi), certolizumab (Cimzia). (2) Anti-IL-6 receptor: tocilizumab (Actemra Roche, FDA 2010) RA, juvenile idiopathic arthritis, giant cell arteritis, GvHD CAR-T cytokine release syndrome (FDA 2017), COVID-19 hospitalized severe (RECOVERY trial 2021). Sarilumab (Kevzara Sanofi/Regeneron). (3) Anti-IL-1β: canakinumab (Ilaris Novartis) CAPS + CANTOS cardiovascular. Anakinra (Kineret Sobi). (4) Anti-IL-23 (Stelara, Tremfya Janssen) psoriasis. (5) Anti-IL-17A (secukinumab Cosentyx Novartis, ixekizumab Eli Lilly Taltz) psoriasis + axial spondyloarthritis. Era: targeted biologics revolutionizing inflammatory disease 1998+. Field 2024 mature.'
          en: 'Anti-cytokine biologics: ~$50B+ annual market. (1) Anti-TNF: infliximab (Remicade, J&J/Centocor 1998 first chimeric) — Crohn disease, RA, ankylosing spondylitis, psoriasis. Adalimumab (Humira AbbVie, fully human, phage display Greg Winter 2002 FDA) — top-selling drug worldwide ~$20B/year peak. Etanercept (Enbrel Amgen, TNFR-Fc fusion). Golimumab (Simponi), certolizumab (Cimzia). (2) Anti-IL-6 receptor: tocilizumab (Actemra Roche, FDA 2010) RA, juvenile idiopathic arthritis, giant cell arteritis, GvHD, CAR-T cytokine release syndrome (FDA 2017), COVID-19 hospitalized severe (RECOVERY trial 2021). Sarilumab (Kevzara Sanofi/Regeneron). (3) Anti-IL-1β: canakinumab (Ilaris Novartis) CAPS + CANTOS cardiovascular. Anakinra (Kineret Sobi). (4) Anti-IL-23 (Stelara, Tremfya Janssen) psoriasis. (5) Anti-IL-17A (secukinumab Cosentyx Novartis, ixekizumab Eli Lilly Taltz) psoriasis + axial spondyloarthritis. Era: targeted biologics revolutionizing inflammatory disease 1998+. Field 2024 mature.'
        objectives: [Anti-TNF anti-IL-6]
  - title:
      pt: Página 2 — Vias de sinalização
