        rationale: {pt: "Quando PCSK9 é bloqueado, então LDLR persiste e captação plasmática de LDL maximiza.", en: "When PCSK9 is blocked, LDLR persists and plasma LDL uptake is maximized."}
        objectives: [biology.cardiovascular_advanced]
        difficulty: 5
