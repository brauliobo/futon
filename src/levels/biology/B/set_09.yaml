title:
  pt: "❤️ Biologia cardiovascular avançada"
  en: "❤️ Advanced cardiovascular biology"
level: 'B'
subject: biology
objectives: [biology.cardiovascular_advanced]
difficulty: 5
authorNotes: "Aterosclerose molecular, regeneração cardíaca, arritmias, hipertensão, terapias inovadoras."
example:
  pt: "Ex.: LDL alto + endotélio inflamado → recrutamento de monócitos → placa → ruptura → infarto."
  en: "Ex.: high LDL + inflamed endothelium → monocyte recruitment → plaque → rupture → myocardial infarction."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Aterosclerose e cardiopatia", en: "Atherosclerosis and heart disease"}
    description: {pt: "Mecanismos moleculares da principal causa de morte.", en: "Molecular mechanisms of the leading cause of death."}
    exercises:
      - type: choice
        question: {pt: "Aterosclerose inicia com:", en: "Atherosclerosis initiates with:"}
        choices:
          - {pt: "Disfunção endotelial e retenção de LDL na íntima arterial", en: "Endothelial dysfunction and LDL retention in arterial intima"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Disfunção endotelial e retenção de LDL na íntima arterial", en: "Endothelial dysfunction and LDL retention in arterial intima"}
        rationale: {pt: "Quando endotélio é inflamado, então LDL fica retido e oxidado iniciando placa.", en: "When endothelium is inflamed, LDL gets trapped and oxidized starting plaque."}
        objectives: [biology.cardiovascular_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Macrófagos espumosos (foam cells):", en: "Foam cell macrophages:"}
        choices:
          - {pt: "Engolem LDL oxidado e acumulam lipídios formando estria gordurosa precoce", en: "Engulf oxidized LDL and accumulate lipids forming early fatty streak"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Engolem LDL oxidado e acumulam lipídios formando estria gordurosa precoce", en: "Engulf oxidized LDL and accumulate lipids forming early fatty streak"}
        rationale: {pt: "Quando macrófagos não digerem lipídios, então acumulam-se e morrem dentro da placa.", en: "When macrophages don't digest lipids, they accumulate and die within plaque."}
        objectives: [biology.cardiovascular_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Inflamação na placa é mediada por:", en: "Plaque inflammation is mediated by:"}
        choices:
