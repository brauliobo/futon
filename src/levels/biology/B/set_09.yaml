          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "IL-1β, IL-6, TNF e inflamassoma NLRP3 ativados em macrófagos da placa", en: "IL-1β, IL-6, TNF and NLRP3 inflammasome activated in plaque macrophages"}
        rationale: {pt: "Quando inflamação amplifica, então placa cresce e desestabiliza.", en: "When inflammation amplifies, plaque grows and destabilizes."}
        objectives: [biology.cardiovascular_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Canakinumabe (CANTOS trial) demonstrou:", en: "Canakinumab (CANTOS trial) demonstrated:"}
        choices:
