          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Bloqueio de IL-1β reduz eventos cardiovasculares maiores em pacientes com inflamação", en: "IL-1β blockade reduces major cardiovascular events in inflammation patients"}
        rationale: {pt: "Quando inflamação residual é tratada, então benefício somou ao redução lipídica clássica.", en: "When residual inflammation is treated, benefit added to classic lipid reduction."}
        objectives: [biology.cardiovascular_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "PCSK9 e LDL:", en: "PCSK9 and LDL:"}
        choices:
