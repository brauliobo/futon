          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Indicadores anuais de saúde e clima informando políticas globais e nacionais", en: "Annual health-climate indicators informing global and national policy"}
        rationale: {pt: "Quando dados são consolidados, então decisores têm bússola atualizada para ação.", en: "When data is consolidated, decision-makers have an updated compass for action."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Restauração de habitats reduz risco zoonótico via:", en: "Habitat restoration reduces zoonotic risk via:"}
        choices:
          - {pt: "Redução de contato humano-fauna e diluição de hospedeiros competentes", en: "Reducing human-wildlife contact and diluting competent hosts"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Redução de contato humano-fauna e diluição de hospedeiros competentes", en: "Reducing human-wildlife contact and diluting competent hosts"}
        rationale: {pt: "Quando floresta integral persiste, então spillover é menos provável e biodiversidade ganha.", en: "When intact forest persists, spillover becomes less likely and biodiversity benefits."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Saúde mental planetária:", en: "Planetary mental health:"}
        choices:
          - {pt: "Ansiedade climática, luto ecológico e PTSD pós-desastres pedem cuidado coletivo", en: "Climate anxiety, ecological grief and post-disaster PTSD require collective care"}
