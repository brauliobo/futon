          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Redução de poluição, dietas plant-forward e mobilidade ativa beneficiam saúde simultaneamente", en: "Pollution reduction, plant-forward diets and active mobility simultaneously benefit health"}
        rationale: {pt: "Quando políticas alinham clima e saúde, então ganho é duplo em décadas.", en: "When policies align climate and health, gain is double over decades."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Lancet Countdown:", en: "Lancet Countdown:"}
        choices:
          - {pt: "Indicadores anuais de saúde e clima informando políticas globais e nacionais", en: "Annual health-climate indicators informing global and national policy"}
