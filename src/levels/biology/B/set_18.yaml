        correctAnswer: {pt: "Ansiedade climática, luto ecológico e PTSD pós-desastres pedem cuidado coletivo", en: "Climate anxiety, ecological grief and post-disaster PTSD require collective care"}
        rationale: {pt: "Quando perdas se acumulam, então saúde mental coletiva precisa de linguagem e suporte.", en: "When losses accumulate, collective mental health needs language and support."}
