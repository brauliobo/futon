          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Financiamento internacional para preparação e acesso global a contramedidas", en: "International financing for preparedness and global access to countermeasures"}
        rationale: {pt: "Quando recursos chegam, então países de baixa renda acessam vacinas e tratamentos.", en: "When resources arrive, low-income countries access vaccines and treatments."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Co-benefícios de mitigação climática:", en: "Climate mitigation co-benefits:"}
        choices:
          - {pt: "Redução de poluição, dietas plant-forward e mobilidade ativa beneficiam saúde simultaneamente", en: "Pollution reduction, plant-forward diets and active mobility simultaneously benefit health"}
