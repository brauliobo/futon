title:
  pt: "🌍 Saúde planetária e One Health"
  en: "🌍 Planetary health and One Health"
level: 'B'
subject: biology
objectives: [biology.planetary_health]
difficulty: 5
authorNotes: "Saúde humana-animal-ambiental integrada, zoonoses, mudanças globais, equidade, governança."
example:
  pt: "Ex.: desmatamento → contato humano-fauna → spillover viral → epidemia → resposta One Health coordenada."
  en: "Ex.: deforestation → human-wildlife contact → viral spillover → epidemic → coordinated One Health response."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Conceito e zoonoses", en: "Concept and zoonoses"}
    description: {pt: "Saúde como sistema acoplado.", en: "Health as coupled system."}
    exercises:
      - type: choice
        question: {pt: "One Health integra:", en: "One Health integrates:"}
        choices:
          - {pt: "Saúde humana, animal e ambiental como sistema único interdependente", en: "Human, animal and environmental health as single interdependent system"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Saúde humana, animal e ambiental como sistema único interdependente", en: "Human, animal and environmental health as single interdependent system"}
        rationale: {pt: "Quando ecossistemas saudáveis são protegidos, então spillover e doenças crônicas caem.", en: "When healthy ecosystems are protected, spillover and chronic disease drop."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Saúde planetária amplia One Health para:", en: "Planetary health extends One Health to:"}
        choices:
          - {pt: "Sistemas naturais globais (clima, biosfera) e equidade intergeracional", en: "Global natural systems (climate, biosphere) and intergenerational equity"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Sistemas naturais globais (clima, biosfera) e equidade intergeracional", en: "Global natural systems (climate, biosphere) and intergenerational equity"}
        rationale: {pt: "Quando consideramos planeta inteiro, então saúde fica vinculada à integridade ambiental.", en: "When the whole planet is considered, health becomes linked to environmental integrity."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Zoonoses representam:", en: "Zoonoses represent:"}
        choices:
          - {pt: "~75% de doenças emergentes — risco crescente com perda de habitat", en: "~75% of emerging diseases — rising risk with habitat loss"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "~75% de doenças emergentes — risco crescente com perda de habitat", en: "~75% of emerging diseases — rising risk with habitat loss"}
        rationale: {pt: "Quando floresta encolhe, então contato humano-fauna aumenta e spillover dispara.", en: "When forest shrinks, human-wildlife contact rises and spillover surges."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Spillover é facilitado por:", en: "Spillover is facilitated by:"}
        choices:
          - {pt: "Densidade humana, comércio de animais selvagens, agropecuária intensiva e desmatamento", en: "Human density, wildlife trade, intensive farming and deforestation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Densidade humana, comércio de animais selvagens, agropecuária intensiva e desmatamento", en: "Human density, wildlife trade, intensive farming and deforestation"}
        rationale: {pt: "Quando interfaces se multiplicam, então probabilidade de eventos aumenta linearmente.", en: "When interfaces multiply, event probability rises linearly."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Vigilância integrada (PREDICT, GLEWS):", en: "Integrated surveillance (PREDICT, GLEWS):"}
        choices:
          - {pt: "Cataloga vírus em fauna e detecta sinais precoces de surtos com cooperação global", en: "Catalogs wildlife viruses and detects early outbreak signals with global cooperation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Cataloga vírus em fauna e detecta sinais precoces de surtos com cooperação global", en: "Catalogs wildlife viruses and detects early outbreak signals with global cooperation"}
        rationale: {pt: "Quando alerta precoce existe, então resposta acelera reduzindo escala da epidemia.", en: "When early warning exists, response accelerates reducing epidemic scale."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "AMR é problema One Health porque:", en: "AMR is a One Health problem because:"}
        choices:
          - {pt: "Resistência circula entre humanos, animais e ambiente via uso veterinário e agrícola", en: "Resistance circulates between humans, animals and environment via veterinary and agricultural use"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Resistência circula entre humanos, animais e ambiente via uso veterinário e agrícola", en: "Resistance circulates between humans, animals and environment via veterinary and agricultural use"}
        rationale: {pt: "Quando promotores de crescimento são banidos, então pressão seletiva sistêmica cai.", en: "When growth promoters are banned, systemic selective pressure drops."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Mudança climática e doenças vetoriais:", en: "Climate change and vector-borne diseases:"}
        choices:
          - {pt: "Aedes, Anopheles e carrapatos expandem altitude e latitude com aquecimento", en: "Aedes, Anopheles and ticks expand altitude and latitude with warming"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Aedes, Anopheles e carrapatos expandem altitude e latitude com aquecimento", en: "Aedes, Anopheles and ticks expand altitude and latitude with warming"}
        rationale: {pt: "Quando vetores prosperam em novos lugares, então surtos surgem onde nunca houve.", en: "When vectors thrive in new places, outbreaks appear where they never had."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Biodiversidade protege saúde via:", en: "Biodiversity protects health via:"}
        choices:
          - {pt: "Efeito diluição — diversidade reduz transmissão de patógenos entre hospedeiros", en: "Dilution effect — diversity reduces pathogen transmission between hosts"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Efeito diluição — diversidade reduz transmissão de patógenos entre hospedeiros", en: "Dilution effect — diversity reduces pathogen transmission between hosts"}
        rationale: {pt: "Quando diversidade cai, então hospedeiros competentes dominam e doença se amplifica.", en: "When diversity drops, competent hosts dominate and disease amplifies."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Poluição do ar é fator de:", en: "Air pollution is a factor in:"}
        choices:
          - {pt: "Doenças respiratórias, cardiovasculares e milhões de mortes prematuras anuais globais", en: "Respiratory, cardiovascular diseases and millions of global premature deaths yearly"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Doenças respiratórias, cardiovasculares e milhões de mortes prematuras anuais globais", en: "Respiratory, cardiovascular diseases and millions of global premature deaths yearly"}
        rationale: {pt: "Quando PM2,5 sobe, então cardiopatia e câncer pulmonar afetam populações urbanas.", en: "When PM2.5 rises, heart disease and lung cancer affect urban populations."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Insegurança alimentar e mudança climática:", en: "Food insecurity and climate change:"}
        choices:
          - {pt: "Quedas em produção agrícola/pesqueira ameaçam dietas globalmente, especialmente em populações vulneráveis", en: "Drops in agricultural/fishery production threaten diets globally, especially in vulnerable populations"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Quedas em produção agrícola/pesqueira ameaçam dietas globalmente, especialmente em populações vulneráveis", en: "Drops in agricultural/fishery production threaten diets globally, especially in vulnerable populations"}
        rationale: {pt: "Quando colheitas falham, então preços sobem e quem está na ponta sofre primeiro.", en: "When harvests fail, prices rise and those at the bottom suffer first."}
        objectives: [biology.planetary_health]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Governança e fronteiras", en: "Governance and frontiers"}
    description: {pt: "Como agir global e localmente.", en: "How to act globally and locally."}
    exercises:
      - type: choice
        question: {pt: "Tratado de Pandemias (OMS) busca:", en: "WHO Pandemic Treaty seeks:"}
        choices:
          - {pt: "Coordenação global em prevenção, preparação e resposta a pandemias futuras", en: "Global coordination in prevention, preparedness and response to future pandemics"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Coordenação global em prevenção, preparação e resposta a pandemias futuras", en: "Global coordination in prevention, preparedness and response to future pandemics"}
        rationale: {pt: "Quando regras são compartilhadas, então países ganham capacidade conjunta de resposta.", en: "When rules are shared, countries gain joint response capacity."}
        objectives: [biology.planetary_health]
        difficulty: 5
      - type: choice
        question: {pt: "Pandemic Fund e equidade vacinal:", en: "Pandemic Fund and vaccine equity:"}
        choices:
          - {pt: "Financiamento internacional para preparação e acesso global a contramedidas", en: "International financing for preparedness and global access to countermeasures"}
          - {pt: "Apenas decoração", en: "Just decoration"}
