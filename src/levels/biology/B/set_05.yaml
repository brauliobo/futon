        correctAnswer: {pt: "Mapeiam tipos celulares, estados e vizinhanças preditivas de resposta", en: "Map cell types, states and response-predictive neighborhoods"}
        rationale: {pt: "Quando posição importa, então biomarcadores espaciais guiam escolha terapêutica.", en: "When position matters, spatial biomarkers guide therapy choice."}
        objectives: [biology.tumor_microenvironment]
