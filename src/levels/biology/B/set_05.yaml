      - type: choice
        question: {pt: "Modelo organoide tumoral (PDO) + TME:", en: "Tumor organoid (PDO) + TME:"}
        choices:
          - {pt: "Cocultura com células imunes recria interações TME para triagem personalizada", en: "Co-culture with immune cells recreates TME interactions for personalized screening"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
