          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "TGF-β e CAF-targeting, terapias celulares no estroma e atlas espacial pan-câncer", en: "TGF-β and CAF-targeting, stromal cell therapies and pan-cancer spatial atlas"}
