        rationale: {pt: "Quando ciclo viciante metástase-osso é interrompido, então progressão freia.", en: "When the vicious metastasis-bone cycle is broken, progression slows."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Single-cell + spatial omics em TME:", en: "Single-cell + spatial omics in TME:"}
        choices:
          - {pt: "Mapeiam tipos celulares, estados e vizinhanças preditivas de resposta", en: "Map cell types, states and response-predictive neighborhoods"}
