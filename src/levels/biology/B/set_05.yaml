title:
  pt: "🌐 Microambiente tumoral"
  en: "🌐 Tumor microenvironment"
level: 'B'
subject: biology
objectives: [biology.tumor_microenvironment]
difficulty: 5
authorNotes: "Estroma, vasos, células imunes, fibroblastos associados, ECM tumoral, terapia direcionada ao TME."
example:
  pt: "Ex.: tumor → recruta CAFs → produz ECM rígida + imunossupressão → vascularização caótica → resistência terapêutica."
  en: "Ex.: tumor → recruits CAFs → produces stiff ECM + immunosuppression → chaotic vasculature → therapy resistance."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Componentes do TME", en: "TME components"}
    description: {pt: "Quem habita o tumor além das células malignas.", en: "Who inhabits tumor besides malignant cells."}
    exercises:
      - type: choice
        question: {pt: "Microambiente tumoral inclui:", en: "Tumor microenvironment includes:"}
        choices:
          - {pt: "Vasos, células imunes, fibroblastos, matriz extracelular e células tumorais", en: "Vessels, immune cells, fibroblasts, extracellular matrix and tumor cells"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Vasos, células imunes, fibroblastos, matriz extracelular e células tumorais", en: "Vessels, immune cells, fibroblasts, extracellular matrix and tumor cells"}
        rationale: {pt: "Quando vemos tumor como ecossistema, então terapias múltiplas atingem componentes diversos.", en: "When tumor is seen as ecosystem, multiple therapies hit diverse components."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Fibroblastos associados ao câncer (CAFs):", en: "Cancer-associated fibroblasts (CAFs):"}
        choices:
          - {pt: "Reforçam crescimento tumoral via secreção de fatores e remodelação de ECM", en: "Reinforce tumor growth via factor secretion and ECM remodeling"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Reforçam crescimento tumoral via secreção de fatores e remodelação de ECM", en: "Reinforce tumor growth via factor secretion and ECM remodeling"}
        rationale: {pt: "Quando CAFs dominam estroma, então fibrose excessiva impede entrega de fármacos.", en: "When CAFs dominate stroma, excessive fibrosis blocks drug delivery."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Vasculatura tumoral é tipicamente:", en: "Tumor vasculature is typically:"}
        choices:
          - {pt: "Caótica, leaky e mal funcional, criando hipóxia e perfusão irregular", en: "Chaotic, leaky and poorly functional, creating hypoxia and uneven perfusion"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Caótica, leaky e mal funcional, criando hipóxia e perfusão irregular", en: "Chaotic, leaky and poorly functional, creating hypoxia and uneven perfusion"}
        rationale: {pt: "Quando angiogênese é desordenada, então fármacos chegam de modo irregular ao tumor.", en: "When angiogenesis is disordered, drugs reach tumor unevenly."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Anti-VEGF (bevacizumabe) atua por:", en: "Anti-VEGF (bevacizumab) acts by:"}
        choices:
          - {pt: "Bloqueio da angiogênese e normalização vascular transitória do tumor", en: "Blocking angiogenesis and transient tumor vascular normalization"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Bloqueio da angiogênese e normalização vascular transitória do tumor", en: "Blocking angiogenesis and transient tumor vascular normalization"}
        rationale: {pt: "Quando vasos são 'normalizados', então fármacos e oxigênio chegam mais homogeneamente.", en: "When vessels are 'normalized', drugs and oxygen arrive more uniformly."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Macrófagos associados ao tumor (TAMs):", en: "Tumor-associated macrophages (TAMs):"}
        choices:
          - {pt: "Tipicamente polarizados M2 — pró-tumorais, imunossupressores e angiogênicos", en: "Typically M2 polarized — protumoral, immunosuppressive and angiogenic"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Tipicamente polarizados M2 — pró-tumorais, imunossupressores e angiogênicos", en: "Typically M2 polarized — protumoral, immunosuppressive and angiogenic"}
        rationale: {pt: "Quando reverter para M1 é possível, então TAMs viram alvos terapêuticos imunes.", en: "When reverting to M1 is possible, TAMs become immune therapeutic targets."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Tregs no tumor:", en: "Tregs in tumor:"}
        choices:
          - {pt: "Suprimem resposta antitumoral via IL-10, TGF-β e contato celular", en: "Suppress antitumor response via IL-10, TGF-β and cellular contact"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Suprimem resposta antitumoral via IL-10, TGF-β e contato celular", en: "Suppress antitumor response via IL-10, TGF-β and cellular contact"}
        rationale: {pt: "Quando Tregs dominam, então T efetoras são apagadas e tumor escapa.", en: "When Tregs dominate, effector T are quenched and tumor escapes."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "MDSCs (mieloides supressoras):", en: "MDSCs (myeloid-derived suppressor):"}
        choices:
          - {pt: "Inibem T efetoras via depleção de aminoácidos e ROS no microambiente", en: "Inhibit effector T via amino acid depletion and ROS in microenvironment"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Inibem T efetoras via depleção de aminoácidos e ROS no microambiente", en: "Inhibit effector T via amino acid depletion and ROS in microenvironment"}
        rationale: {pt: "Quando MDSCs são abundantes, então quimio + imunoterapia precisam combinar para vencer supressão.", en: "When MDSCs are abundant, chemo + immunotherapy must combine to overcome suppression."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Matriz extracelular tumoral é frequentemente:", en: "Tumor ECM is often:"}
        choices:
          - {pt: "Mais rígida e desorganizada, favorecendo invasão e resistência mecânica à imune", en: "Stiffer and more disorganized, favoring invasion and immune mechanical resistance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Mais rígida e desorganizada, favorecendo invasão e resistência mecânica à imune", en: "Stiffer and more disorganized, favoring invasion and immune mechanical resistance"}
        rationale: {pt: "Quando ECM é dura, então células T têm dificuldade de migrar e atacar tumor.", en: "When ECM is stiff, T cells struggle to migrate and attack tumor."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Linfangiogênese tumoral:", en: "Tumor lymphangiogenesis:"}
        choices:
          - {pt: "Cria vasos linfáticos novos que facilitam metástase regional", en: "Creates new lymphatic vessels facilitating regional metastasis"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Cria vasos linfáticos novos que facilitam metástase regional", en: "Creates new lymphatic vessels facilitating regional metastasis"}
        rationale: {pt: "Quando VEGF-C atua, então linfáticos crescem e tumor invade linfonodos sentinela.", en: "When VEGF-C acts, lymphatics grow and tumor invades sentinel nodes."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Inflamação crônica em câncer:", en: "Chronic inflammation in cancer:"}
        choices:
          - {pt: "Pode iniciar e sustentar tumores via citocinas e ROS sustentados", en: "May initiate and sustain tumors via sustained cytokines and ROS"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Pode iniciar e sustentar tumores via citocinas e ROS sustentados", en: "May initiate and sustain tumors via sustained cytokines and ROS"}
        rationale: {pt: "Quando inflamação se cronifica, então ambiente vira terreno fértil para câncer.", en: "When inflammation chronifies, environment becomes fertile ground for cancer."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Terapias dirigidas ao TME", en: "TME-directed therapies"}
    description: {pt: "Atacando o ecossistema tumoral.", en: "Attacking the tumor ecosystem."}
    exercises:
      - type: choice
        question: {pt: "Inibidores de checkpoint (anti-PD-1) atuam:", en: "Checkpoint inhibitors (anti-PD-1) act:"}
        choices:
          - {pt: "Sobre T do TME, restaurando função antitumoral previamente bloqueada", en: "On TME T cells, restoring previously blocked antitumor function"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Sobre T do TME, restaurando função antitumoral previamente bloqueada", en: "On TME T cells, restoring previously blocked antitumor function"}
        rationale: {pt: "Quando freio é solto, então T reativada elimina tumor com memória durável.", en: "When brake is released, reactivated T eliminates tumor with durable memory."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Tumores 'frios' têm:", en: "'Cold' tumors have:"}
        choices:
          - {pt: "Pouco infiltrado linfocitário e baixa resposta a inibidores de checkpoint sozinhos", en: "Sparse lymphocyte infiltrate and poor response to checkpoint inhibitors alone"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Pouco infiltrado linfocitário e baixa resposta a inibidores de checkpoint sozinhos", en: "Sparse lymphocyte infiltrate and poor response to checkpoint inhibitors alone"}
        rationale: {pt: "Quando T não está no tumor, então solte freio sozinho não basta — combinações são necessárias.", en: "When T is absent, releasing the brake alone fails — combinations are needed."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Aquecer tumor frio (turn cold to hot):", en: "Heating cold tumor (turn cold to hot):"}
        choices:
          - {pt: "Vacinas, oncolíticos, radioterapia e adjuvantes recrutam T para o tumor", en: "Vaccines, oncolytics, radiotherapy and adjuvants recruit T into tumor"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Vacinas, oncolíticos, radioterapia e adjuvantes recrutam T para o tumor", en: "Vaccines, oncolytics, radiotherapy and adjuvants recruit T into tumor"}
        rationale: {pt: "Quando inflamação local aumenta, então cascata imune adaptativa segue espontaneamente.", en: "When local inflammation rises, adaptive immune cascade follows spontaneously."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "TGF-β no TME:", en: "TGF-β in TME:"}
        choices:
          - {pt: "Promove fibrose, EMT, imunossupressão e angiogênese desordenada", en: "Promotes fibrosis, EMT, immunosuppression and disordered angiogenesis"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Promove fibrose, EMT, imunossupressão e angiogênese desordenada", en: "Promotes fibrosis, EMT, immunosuppression and disordered angiogenesis"}
        rationale: {pt: "Quando TGF-β domina, então tumor fica 'amuralhado' contra ataque imune.", en: "When TGF-β dominates, tumor becomes 'walled off' against immune attack."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Hipóxia + acidose + metabolismo no TME:", en: "Hypoxia + acidosis + metabolism in TME:"}
        choices:
          - {pt: "Combinação cria ambiente que suprime imunidade efetora e seleciona resistência", en: "Combination creates environment suppressing effector immunity and selecting resistance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Combinação cria ambiente que suprime imunidade efetora e seleciona resistência", en: "Combination creates environment suppressing effector immunity and selecting resistance"}
        rationale: {pt: "Quando barreiras se somam, então abordagens multitarget são essenciais.", en: "When barriers add up, multi-target approaches are essential."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Tertiary lymphoid structures (TLS):", en: "Tertiary lymphoid structures (TLS):"}
        choices:
          - {pt: "Agregados linfoides ectópicos no tumor associados a melhor prognóstico", en: "Ectopic lymphoid aggregates in tumor associated with better prognosis"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Agregados linfoides ectópicos no tumor associados a melhor prognóstico", en: "Ectopic lymphoid aggregates in tumor associated with better prognosis"}
        rationale: {pt: "Quando TLS aparecem, então resposta antitumoral local fica robusta e duradoura.", en: "When TLS appear, local antitumor response becomes robust and durable."}
        objectives: [biology.tumor_microenvironment]
        difficulty: 5
      - type: choice
        question: {pt: "Bisfosfonatos e zoledronato em câncer ósseo:", en: "Bisphosphonates and zoledronate in bone cancer:"}
        choices:
          - {pt: "Inibem reabsorção óssea por osteoclastos, modulando microambiente metastático", en: "Inhibit bone resorption by osteoclasts, modulating metastatic microenvironment"}
