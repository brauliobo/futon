      - type: choice
        question: {pt: "Próximas fronteiras em TME:", en: "Next frontiers in TME:"}
        choices:
          - {pt: "TGF-β e CAF-targeting, terapias celulares no estroma e atlas espacial pan-câncer", en: "TGF-β and CAF-targeting, stromal cell therapies and pan-cancer spatial atlas"}
