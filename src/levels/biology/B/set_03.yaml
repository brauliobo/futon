title:
  pt: "🔍 Descoberta e reposicionamento de fármacos"
  en: "🔍 Drug discovery and repurposing"
level: 'B'
subject: biology
objectives: [biology.drug_discovery]
difficulty: 5
authorNotes: "Triagem HTS, screening fenotípico, repurposing, química medicinal, IA em descoberta, ensaios clínicos."
example:
  pt: "Ex.: alvo identificado → triagem HTS → hit → otimização → candidato pré-clínico → ensaio clínico → aprovação."
  en: "Ex.: target identified → HTS screening → hit → optimization → preclinical candidate → clinical trial → approval."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Pipeline de descoberta", en: "Discovery pipeline"}
    description: {pt: "Como nasce um fármaco.", en: "How a drug is born."}
    exercises:
      - type: choice
        question: {pt: "Triagem high-throughput (HTS):", en: "High-throughput screening (HTS):"}
        choices:
          - {pt: "Testa milhões de compostos contra alvo automatizadamente em placas de 384/1536 poços", en: "Tests millions of compounds against target automated in 384/1536-well plates"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Testa milhões de compostos contra alvo automatizadamente em placas de 384/1536 poços", en: "Tests millions of compounds against target automated in 384/1536-well plates"}
        rationale: {pt: "Quando volume é micro, então robôs avaliam bibliotecas inteiras em dias.", en: "When volume is micro, robots evaluate whole libraries within days."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Triagem fenotípica vs alvo:", en: "Phenotypic vs target screening:"}
        choices:
          - {pt: "Fenotípica busca efeito biológico geral; alvo busca interação molecular específica", en: "Phenotypic seeks general biological effect; target seeks specific molecular interaction"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas idênticas", en: "Just identical"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Fenotípica busca efeito biológico geral; alvo busca interação molecular específica", en: "Phenotypic seeks general biological effect; target seeks specific molecular interaction"}
        rationale: {pt: "Quando alvo é desconhecido, então fenotípica encontra fármacos pela função observada.", en: "When target is unknown, phenotypic finds drugs by observed function."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Triagem virtual (VS):", en: "Virtual screening (VS):"}
        choices:
          - {pt: "Avalia bilhões de moléculas in silico contra estrutura do alvo antes do laboratório", en: "Evaluates billions of molecules in silico against target structure before the lab"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Avalia bilhões de moléculas in silico contra estrutura do alvo antes do laboratório", en: "Evaluates billions of molecules in silico against target structure before the lab"}
        rationale: {pt: "Quando computação é barata, então laboratório foca apenas nos top-ranked.", en: "When compute is cheap, lab focuses only on top-ranked candidates."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Hit-to-lead optimization envolve:", en: "Hit-to-lead optimization involves:"}
        choices:
          - {pt: "Melhorar potência, seletividade e propriedades farmacológicas do composto inicial", en: "Improve potency, selectivity and pharmacological properties of initial compound"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Melhorar potência, seletividade e propriedades farmacológicas do composto inicial", en: "Improve potency, selectivity and pharmacological properties of initial compound"}
        rationale: {pt: "Quando hit não é fármaco ainda, então química medicinal otimiza por SAR sistemática.", en: "When hit isn't yet a drug, medicinal chemistry optimizes via systematic SAR."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Lipinski's Rule of Five orienta:", en: "Lipinski's Rule of Five guides:"}
        choices:
          - {pt: "Propriedades drug-like para boa absorção oral (MW, logP, HBD, HBA)", en: "Drug-like properties for good oral absorption (MW, logP, HBD, HBA)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Propriedades drug-like para boa absorção oral (MW, logP, HBD, HBA)", en: "Drug-like properties for good oral absorption (MW, logP, HBD, HBA)"}
        rationale: {pt: "Quando regras são respeitadas, então biodisponibilidade oral fica favorável.", en: "When rules are respected, oral bioavailability becomes favorable."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "ADME-Tox descreve:", en: "ADME-Tox describes:"}
        choices:
          - {pt: "Absorção, distribuição, metabolismo, excreção e toxicidade do candidato", en: "Absorption, distribution, metabolism, excretion and toxicity of candidate"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Absorção, distribuição, metabolismo, excreção e toxicidade do candidato", en: "Absorption, distribution, metabolism, excretion and toxicity of candidate"}
        rationale: {pt: "Quando ADME é problemática, então molécula falha em estágios tardios e caros.", en: "When ADME is problematic, molecule fails at late and expensive stages."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Pré-clínico inclui:", en: "Preclinical includes:"}
        choices:
          - {pt: "Eficácia em modelos animais, segurança e farmacocinética antes de testar em humanos", en: "Efficacy in animal models, safety and pharmacokinetics before human testing"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Eficácia em modelos animais, segurança e farmacocinética antes de testar em humanos", en: "Efficacy in animal models, safety and pharmacokinetics before human testing"}
        rationale: {pt: "Quando dados pré-clínicos são robustos, então IND é submetido para autorizar Fase 1.", en: "When preclinical data is robust, IND is filed to authorize Phase 1."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Fases clínicas (Fase 1-3) avaliam:", en: "Clinical phases (Phase 1-3) evaluate:"}
        choices:
          - {pt: "Segurança/dose (1), eficácia preliminar (2), eficácia comparativa em larga escala (3)", en: "Safety/dose (1), preliminary efficacy (2), comparative large-scale efficacy (3)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Segurança/dose (1), eficácia preliminar (2), eficácia comparativa em larga escala (3)", en: "Safety/dose (1), preliminary efficacy (2), comparative large-scale efficacy (3)"}
        rationale: {pt: "Quando cada fase passa, então fármaco avança para aprovação regulatória.", en: "When each phase passes, drug advances toward regulatory approval."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Fase 4 (pós-marketing) monitora:", en: "Phase 4 (post-marketing) monitors:"}
        choices:
          - {pt: "Eventos raros, populações reais e farmacovigilância em escala ampla", en: "Rare events, real populations and large-scale pharmacovigilance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Eventos raros, populações reais e farmacovigilância em escala ampla", en: "Rare events, real populations and large-scale pharmacovigilance"}
        rationale: {pt: "Quando milhões usam, então sinais raros afloram e exigem ação regulatória rápida.", en: "When millions use, rare signals surface and require rapid regulatory action."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Atrição clínica é alta porque:", en: "Clinical attrition is high because:"}
        choices:
          - {pt: "Maioria dos candidatos falha por eficácia ou segurança em pacientes humanos", en: "Most candidates fail due to efficacy or safety in human patients"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Maioria dos candidatos falha por eficácia ou segurança em pacientes humanos", en: "Most candidates fail due to efficacy or safety in human patients"}
        rationale: {pt: "Quando modelos pré-clínicos são imperfeitos, então humano traz surpresas em larga escala.", en: "When preclinical models are imperfect, humans bring surprises at scale."}
        objectives: [biology.drug_discovery]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "IA, repurposing e fronteiras", en: "AI, repurposing and frontiers"}
    description: {pt: "Como acelerar e reaproveitar.", en: "How to accelerate and repurpose."}
    exercises:
      - type: choice
        question: {pt: "Reposicionamento de fármacos (drug repurposing):", en: "Drug repurposing:"}
        choices:
          - {pt: "Encontrar nova indicação para fármaco já aprovado, encurtando desenvolvimento", en: "Find new indication for already-approved drug, shortening development"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Encontrar nova indicação para fármaco já aprovado, encurtando desenvolvimento", en: "Find new indication for already-approved drug, shortening development"}
        rationale: {pt: "Quando segurança já é conhecida, então repurposing pula etapas e pacientes recebem mais cedo.", en: "When safety is already known, repurposing skips steps and patients benefit sooner."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Sildenafil (Viagra) é exemplo de:", en: "Sildenafil (Viagra) is an example of:"}
        choices:
          - {pt: "Repurposing — desenvolvido para angina, achou indicação em disfunção erétil", en: "Repurposing — developed for angina, found indication in erectile dysfunction"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Repurposing — desenvolvido para angina, achou indicação em disfunção erétil", en: "Repurposing — developed for angina, found indication in erectile dysfunction"}
        rationale: {pt: "Quando efeito 'lateral' é descoberto, então mercado novo emerge inesperadamente.", en: "When 'side' effect is discovered, new market emerges unexpectedly."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "IA em descoberta de fármacos:", en: "AI in drug discovery:"}
        choices:
          - {pt: "Acelera triagem virtual, design molecular, otimização de ADME e priorização", en: "Accelerates virtual screening, molecular design, ADME optimization and prioritization"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Acelera triagem virtual, design molecular, otimização de ADME e priorização", en: "Accelerates virtual screening, molecular design, ADME optimization and prioritization"}
        rationale: {pt: "Quando IA avalia espaço químico vasto, então laboratório se concentra em moléculas promissoras.", en: "When AI evaluates vast chemical space, lab concentrates on promising molecules."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Halicina é antibiótico descoberto por IA:", en: "Halicin is an AI-discovered antibiotic:"}
        choices:
          - {pt: "Modelo de deep learning encontrou estrutura nova ativa contra multirresistentes", en: "Deep learning model found novel structure active against multidrug-resistant"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Modelo de deep learning encontrou estrutura nova ativa contra multirresistentes", en: "Deep learning model found novel structure active against multidrug-resistant"}
        rationale: {pt: "Quando IA busca novidade, então classes não-óbvias surgem para alvos resistentes.", en: "When AI seeks novelty, non-obvious classes emerge for resistant targets."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Bibliotecas DNA-encoded (DEL):", en: "DNA-encoded libraries (DEL):"}
        choices:
          - {pt: "Bilhões de compostos com tags de DNA permitem triagem em escala única e barata", en: "Billions of DNA-tagged compounds enable unique cheap large-scale screening"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Bilhões de compostos com tags de DNA permitem triagem em escala única e barata", en: "Billions of DNA-tagged compounds enable unique cheap large-scale screening"}
        rationale: {pt: "Quando barcodes guiam, então hits são identificados via NGS após seleção por afinidade.", en: "When barcodes guide, hits are identified via NGS after affinity selection."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Fragmentos (FBDD):", en: "Fragment-based drug design (FBDD):"}
        choices:
          - {pt: "Fragmentos pequenos otimizados crescem em ligantes de alta afinidade", en: "Small fragments optimized to grow into high-affinity ligands"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Fragmentos pequenos otimizados crescem em ligantes de alta afinidade", en: "Small fragments optimized to grow into high-affinity ligands"}
        rationale: {pt: "Quando fragmentos cobrem espaço químico, então building blocks combinam em ligantes potentes.", en: "When fragments cover chemical space, building blocks combine into potent ligands."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Bioisosterismo é estratégia para:", en: "Bioisosterism is a strategy to:"}
        choices:
          - {pt: "Substituir grupos químicos por equivalentes mantendo bioatividade e melhorando propriedades", en: "Replace chemical groups with equivalents preserving bioactivity and improving properties"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Substituir grupos químicos por equivalentes mantendo bioatividade e melhorando propriedades", en: "Replace chemical groups with equivalents preserving bioactivity and improving properties"}
        rationale: {pt: "Quando substituintes têm efeito semelhante, então química medicinal escapa de patentes ou tóxicos.", en: "When substituents have similar effect, medicinal chemistry escapes patents or toxics."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Síntese assistida por robôs:", en: "Robot-assisted synthesis:"}
        choices:
          - {pt: "Plataformas autônomas executam ciclos design-build-test-learn 24/7", en: "Autonomous platforms run design-build-test-learn cycles 24/7"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Plataformas autônomas executam ciclos design-build-test-learn 24/7", en: "Autonomous platforms run design-build-test-learn cycles 24/7"}
        rationale: {pt: "Quando IA fecha laço com automação, então hipóteses químicas testam-se rapidamente.", en: "When AI closes loop with automation, chemical hypotheses test rapidly."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Ensaios adaptativos (adaptive trials):", en: "Adaptive trials:"}
        choices:
          - {pt: "Ajustam braços, doses ou alocação durante o estudo conforme evidência", en: "Adjust arms, doses or allocation during trial as evidence emerges"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Ajustam braços, doses ou alocação durante o estudo conforme evidência", en: "Adjust arms, doses or allocation during trial as evidence emerges"}
        rationale: {pt: "Quando aprendemos cedo, então alocação migra para o que funciona — pacientes ganham.", en: "When we learn early, allocation moves to what works — patients benefit."}
        objectives: [biology.drug_discovery]
        difficulty: 5
      - type: choice
        question: {pt: "Próximas fronteiras em descoberta de fármacos:", en: "Next frontiers in drug discovery:"}
        choices:
          - {pt: "Modelos de fundação biológicos, design de proteínas terapêuticas e laboratórios autônomos", en: "Biological foundation models, therapeutic protein design and autonomous labs"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Modelos de fundação biológicos, design de proteínas terapêuticas e laboratórios autônomos", en: "Biological foundation models, therapeutic protein design and autonomous labs"}
        rationale: {pt: "Quando IA escala em biologia e química, então tempo até fármaco aprovado encolhe sucessivamente.", en: "When AI scales in biology and chemistry, time to approved drug successively shrinks."}
        objectives: [biology.drug_discovery]
        difficulty: 5
target: 20
