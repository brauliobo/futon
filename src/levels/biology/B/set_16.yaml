title:
  pt: "🧴 Biologia da pele e microbioma cutâneo"
  en: "🧴 Skin biology and cutaneous microbiome"
level: 'B'
subject: biology
objectives: [biology.skin_biology]
difficulty: 5
authorNotes: "Estrutura da pele, barreira, queratinócitos, microbioma cutâneo, dermatologia molecular, fronteiras."
example:
  pt: "Ex.: queratinócito basal → diferenciação → camadas → barreira lipídica → microbioma residente → defesa integrada."
  en: "Ex.: basal keratinocyte → differentiation → layers → lipid barrier → resident microbiome → integrated defense."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Estrutura e função da pele", en: "Skin structure and function"}
    description: {pt: "O maior órgão do corpo.", en: "The body's largest organ."}
    exercises:
      - type: choice
        question: {pt: "Camadas da epiderme (de baixo para cima):", en: "Epidermal layers (bottom to top):"}
        choices:
          - {pt: "Basal, espinhosa, granulosa, lúcida (em palmas/plantas) e córnea", en: "Basal, spinous, granular, lucid (palms/soles) and cornea"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Basal, espinhosa, granulosa, lúcida (em palmas/plantas) e córnea", en: "Basal, spinous, granular, lucid (palms/soles) and cornea"}
        rationale: {pt: "Quando queratinócitos sobem, então diferenciação progressiva forma barreira terminal.", en: "When keratinocytes rise, progressive differentiation forms terminal barrier."}
        objectives: [biology.skin_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Barreira cutânea é mantida por:", en: "Skin barrier is maintained by:"}
        choices:
          - {pt: "Estrato córneo com corneócitos + lipídios intercelulares (ceramidas, colesterol, AGs livres)", en: "Stratum corneum with corneocytes + intercellular lipids (ceramides, cholesterol, free FAs)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Estrato córneo com corneócitos + lipídios intercelulares (ceramidas, colesterol, AGs livres)", en: "Stratum corneum with corneocytes + intercellular lipids (ceramides, cholesterol, free FAs)"}
        rationale: {pt: "Quando lipídios estão balanceados, então água é retida e patógenos são excluídos.", en: "When lipids balance, water is retained and pathogens are excluded."}
        objectives: [biology.skin_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Filagrina é proteína-chave que:", en: "Filaggrin is a key protein that:"}
        choices:
          - {pt: "Agrega filamentos de queratina e forma fatores de hidratação natural (NMF)", en: "Aggregates keratin filaments and forms natural moisturizing factors (NMF)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Agrega filamentos de queratina e forma fatores de hidratação natural (NMF)", en: "Aggregates keratin filaments and forms natural moisturizing factors (NMF)"}
        rationale: {pt: "Quando filagrina é mutada, então ictiose vulgar e dermatite atópica aparecem.", en: "When filaggrin is mutated, ichthyosis vulgaris and atopic dermatitis appear."}
        objectives: [biology.skin_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Melanócitos:", en: "Melanocytes:"}
        choices:
          - {pt: "Produzem melanina em melanossomos transferidos a queratinócitos protegendo do UV", en: "Produce melanin in melanosomes transferred to keratinocytes protecting from UV"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Produzem melanina em melanossomos transferidos a queratinócitos protegendo do UV", en: "Produce melanin in melanosomes transferred to keratinocytes protecting from UV"}
        rationale: {pt: "Quando UV chega, então pigmentação aumenta absorvendo dano antes do DNA.", en: "When UV arrives, pigmentation rises absorbing damage before reaching DNA."}
        objectives: [biology.skin_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Fibroblastos dérmicos secretam:", en: "Dermal fibroblasts secrete:"}
        choices:
          - {pt: "Colágeno, elastina e proteoglicanos formando matriz mecânica e elástica", en: "Collagen, elastin and proteoglycans forming mechanical and elastic matrix"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
