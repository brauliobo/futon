        rationale: {pt: "Quando inflamação se soma à proliferação, então quadro acneico clínico aparece.", en: "When inflammation adds to proliferation, clinical acne emerges."}
        objectives: [biology.skin_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Disbiose cutânea associa-se a:", en: "Cutaneous dysbiosis associates with:"}
        choices:
