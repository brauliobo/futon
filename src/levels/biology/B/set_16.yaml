        rationale: {pt: "Quando IL-4/IL-13 dominam, então dupilumab anti-IL-4Rα reverte sintomas eficazmente.", en: "When IL-4/IL-13 dominate, dupilumab anti-IL-4Rα effectively reverses symptoms."}
        objectives: [biology.skin_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Psoríase tem mecanismo:", en: "Psoriasis has mechanism:"}
        choices:
