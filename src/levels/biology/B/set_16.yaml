          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Células de Langerhans (DCs) na epiderme e T residentes em diferentes camadas", en: "Langerhans cells (DCs) in epidermis and resident T in different layers"}
        rationale: {pt: "Quando barreira física é violada, então imunidade local responde rapidamente.", en: "When physical barrier is breached, local immunity responds rapidly."}
        objectives: [biology.skin_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Microbioma cutâneo varia por sítio:", en: "Cutaneous microbiome varies by site:"}
        choices:
          - {pt: "Sebáceo (Cutibacterium), úmido (Corynebacterium) e seco (Proteobacteria) são padrões", en: "Sebaceous (Cutibacterium), moist (Corynebacterium) and dry (Proteobacteria) are patterns"}
