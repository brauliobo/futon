        rationale: {pt: "Quando bloqueamos IL-23 ou IL-17, então placas e dor articular regridem.", en: "When IL-23 or IL-17 is blocked, plaques and joint pain regress."}
        objectives: [biology.skin_biology]
        difficulty: 5
