        rationale: {pt: "Quando MEC é robusta, então pele resiste tração e mantém turgência.", en: "When ECM is robust, skin resists traction and maintains turgor."}
        objectives: [biology.skin_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Imunidade cutânea inclui:", en: "Cutaneous immunity includes:"}
        choices:
