        objectives: [biology.skin_biology]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Doenças e fronteiras", en: "Diseases and frontiers"}
    description: {pt: "Da clínica à terapia molecular.", en: "From clinic to molecular therapy."}
    exercises:
      - type: choice
        question: {pt: "Dermatite atópica é caracterizada por:", en: "Atopic dermatitis is characterized by:"}
        choices:
          - {pt: "Defeito de barreira + Th2 elevado + disbiose com prurido crônico", en: "Barrier defect + elevated Th2 + dysbiosis with chronic pruritus"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
