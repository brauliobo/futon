          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Sebáceo (Cutibacterium), úmido (Corynebacterium) e seco (Proteobacteria) são padrões", en: "Sebaceous (Cutibacterium), moist (Corynebacterium) and dry (Proteobacteria) are patterns"}
        rationale: {pt: "Quando microclima muda, então comunidades especializam-se em cada nicho cutâneo.", en: "When microclimate shifts, communities specialize in each cutaneous niche."}
        objectives: [biology.skin_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Cutibacterium acnes:", en: "Cutibacterium acnes:"}
        choices:
          - {pt: "Comensal sebáceo cuja proliferação em folículos contribui para acne", en: "Sebaceous commensal whose proliferation in follicles contributes to acne"}
