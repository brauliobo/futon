title:
  pt: "🌊 Ecologia oceânica avançada"
  en: "🌊 Advanced ocean ecology"
level: 'B'
subject: biology
objectives: [biology.ocean_ecology]
difficulty: 5
authorNotes: "Plâncton, redes tróficas, ciclos biogeoquímicos marinhos, mudanças climáticas oceânicas, conservação."
example:
  pt: "Ex.: fitoplâncton fixa CO₂ → bomba biológica → carbono ao fundo → regulação climática → biodiversidade marinha."
  en: "Ex.: phytoplankton fixes CO₂ → biological pump → carbon to depths → climate regulation → marine biodiversity."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Plâncton e redes tróficas", en: "Plankton and food webs"}
    description: {pt: "A base da vida oceânica.", en: "Foundation of ocean life."}
    exercises:
      - type: choice
        question: {pt: "Fitoplâncton é responsável por:", en: "Phytoplankton is responsible for:"}
        choices:
          - {pt: "~50% da produção primária global, fixando CO₂ e produzindo O₂", en: "~50% of global primary production, fixing CO₂ and producing O₂"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "~50% da produção primária global, fixando CO₂ e produzindo O₂", en: "~50% of global primary production, fixing CO₂ and producing O₂"}
        rationale: {pt: "Quando fitoplâncton prospera, então atmosfera respira oceanicamente metade do oxigênio que respiramos.", en: "When phytoplankton thrives, atmosphere oceanically breathes half the oxygen we use."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Diatomáceas constroem:", en: "Diatoms build:"}
        choices:
          - {pt: "Frústulas de sílica e dominam fitoplâncton em águas frias e produtivas", en: "Silica frustules and dominate phytoplankton in cold productive waters"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Frústulas de sílica e dominam fitoplâncton em águas frias e produtivas", en: "Silica frustules and dominate phytoplankton in cold productive waters"}
        rationale: {pt: "Quando sedimentam, então diatomáceas exportam C ao fundo de modo eficiente.", en: "When they sink, diatoms efficiently export C to the depths."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Cianobactérias marinhas (Prochlorococcus):", en: "Marine cyanobacteria (Prochlorococcus):"}
        choices:
          - {pt: "Organismo fotossintético mais abundante do planeta — picoplâncton oceânico", en: "Most abundant photosynthetic organism on Earth — oceanic picoplankton"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Organismo fotossintético mais abundante do planeta — picoplâncton oceânico", en: "Most abundant photosynthetic organism on Earth — oceanic picoplankton"}
        rationale: {pt: "Quando contamos número, então minúsculas cianobactérias dominam números globais.", en: "When we count numbers, tiny cyanobacteria dominate global counts."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Zooplâncton inclui:", en: "Zooplankton includes:"}
        choices:
          - {pt: "Copépodos, krill, larvas e medusas — elo entre primária e peixes", en: "Copepods, krill, larvae and jellies — link between primary production and fish"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Copépodos, krill, larvas e medusas — elo entre primária e peixes", en: "Copepods, krill, larvae and jellies — link between primary production and fish"}
        rationale: {pt: "Quando zooplâncton come fitoplâncton, então peixes e baleias têm comida em rede trófica.", en: "When zooplankton eats phytoplankton, fish and whales have food in trophic web."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Bomba biológica de carbono refere-se a:", en: "Biological carbon pump refers to:"}
        choices:
          - {pt: "Plâncton fixa CO₂ e exporta matéria orgânica para profundidades de longa duração", en: "Plankton fix CO₂ and export organic matter to long-term depths"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Plâncton fixa CO₂ e exporta matéria orgânica para profundidades de longa duração", en: "Plankton fix CO₂ and export organic matter to long-term depths"}
        rationale: {pt: "Quando organismos morrem e afundam, então oceano sequestra C em escala milenar.", en: "When organisms die and sink, ocean sequesters C at millennial scale."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Migração vertical diária do plâncton:", en: "Diel vertical migration of plankton:"}
        choices:
          - {pt: "Sobe à noite para alimentar-se e desce de dia evitando predadores — maior movimento da Terra", en: "Rises at night to feed and descends by day avoiding predators — Earth's largest migration"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Sobe à noite para alimentar-se e desce de dia evitando predadores — maior movimento da Terra", en: "Rises at night to feed and descends by day avoiding predators — Earth's largest migration"}
        rationale: {pt: "Quando bilhões migram juntos, então transporte vertical de C é ativo e profundo.", en: "When billions migrate together, vertical C transport is active and deep."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Tara Oceans expedição revelou:", en: "Tara Oceans expedition revealed:"}
        choices:
          - {pt: "Vasta diversidade microbiana e viral global e função em ecossistemas marinhos", en: "Vast global microbial and viral diversity and function in marine ecosystems"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Vasta diversidade microbiana e viral global e função em ecossistemas marinhos", en: "Vast global microbial and viral diversity and function in marine ecosystems"}
        rationale: {pt: "Quando metagenômica escala, então catálogo gênico oceânico cresce ordens de magnitude.", en: "When metagenomics scales, oceanic gene catalog grows orders of magnitude."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Recifes de coral são:", en: "Coral reefs are:"}
        choices:
          - {pt: "Hotspots de biodiversidade construídos por simbiose coral-zooxantela em águas tropicais", en: "Biodiversity hotspots built by coral-zooxanthella symbiosis in tropical waters"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Hotspots de biodiversidade construídos por simbiose coral-zooxantela em águas tropicais", en: "Biodiversity hotspots built by coral-zooxanthella symbiosis in tropical waters"}
        rationale: {pt: "Quando simbiose colapsa por calor, então branqueamento ameaça toda a comunidade.", en: "When symbiosis collapses by heat, bleaching threatens the whole community."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Fontes hidrotermais oceânicas:", en: "Ocean hydrothermal vents:"}
        choices:
          - {pt: "Comunidades quimiossintéticas baseadas em H₂S/CH₄ sem dependência da luz solar", en: "Chemosynthetic communities based on H₂S/CH₄ without solar light dependence"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Comunidades quimiossintéticas baseadas em H₂S/CH₄ sem dependência da luz solar", en: "Chemosynthetic communities based on H₂S/CH₄ without solar light dependence"}
        rationale: {pt: "Quando luz não chega, então química sustenta tubeworms gigantes e mariscos simbiontes.", en: "When light doesn't reach, chemistry sustains giant tubeworms and symbiont clams."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Pradarias de algas marinhas (kelp):", en: "Kelp forests:"}
        choices:
          - {pt: "Sustentam biodiversidade temperada; lontras-mar controlam ouriços via cascata trófica", en: "Sustain temperate biodiversity; sea otters control urchins via trophic cascade"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Sustentam biodiversidade temperada; lontras-mar controlam ouriços via cascata trófica", en: "Sustain temperate biodiversity; sea otters control urchins via trophic cascade"}
        rationale: {pt: "Quando lontras desaparecem, então ouriços comem kelp e ecossistema colapsa.", en: "When otters disappear, urchins eat kelp and ecosystem collapses."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Mudanças globais e conservação", en: "Global change and conservation"}
    description: {pt: "Oceano sob estresse e proteção.", en: "Ocean under stress and protection."}
    exercises:
      - type: choice
        question: {pt: "Acidificação oceânica:", en: "Ocean acidification:"}
        choices:
          - {pt: "CO₂ dissolvido reduz pH; afeta calcificadores (corais, moluscos, pterópodes)", en: "Dissolved CO₂ reduces pH; affects calcifiers (corals, mollusks, pteropods)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "CO₂ dissolvido reduz pH; afeta calcificadores (corais, moluscos, pterópodes)", en: "Dissolved CO₂ reduces pH; affects calcifiers (corals, mollusks, pteropods)"}
        rationale: {pt: "Quando ômega de aragonita cai, então conchas e esqueletos enfraquecem.", en: "When aragonite saturation drops, shells and skeletons weaken."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Hipóxia oceânica (zonas mortas):", en: "Ocean hypoxia (dead zones):"}
        choices:
          - {pt: "Eutrofização e aquecimento criam áreas com O₂ insuficiente para vida animal", en: "Eutrophication and warming create areas with O₂ insufficient for animal life"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Eutrofização e aquecimento criam áreas com O₂ insuficiente para vida animal", en: "Eutrophication and warming create areas with O₂ insufficient for animal life"}
        rationale: {pt: "Quando nutrientes escorrem, então blooms morrem e bactérias consomem O₂ inteiramente.", en: "When nutrients run off, blooms die and bacteria consume O₂ entirely."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Branqueamento de coral é causado por:", en: "Coral bleaching is caused by:"}
        choices:
          - {pt: "Estresse térmico (>1-2°C acima do normal por semanas) expulsa zooxantelas simbióticas", en: "Thermal stress (>1-2°C above normal for weeks) expels symbiotic zooxanthellae"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Estresse térmico (>1-2°C acima do normal por semanas) expulsa zooxantelas simbióticas", en: "Thermal stress (>1-2°C above normal for weeks) expels symbiotic zooxanthellae"}
        rationale: {pt: "Quando aquecimento persiste, então recifes morrem se zooxantelas não retornarem.", en: "When warming persists, reefs die unless zooxanthellae return."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Sobrepesca afeta oceano via:", en: "Overfishing affects ocean via:"}
        choices:
          - {pt: "Reduzir estoques abaixo de níveis reprodutivos e desestabilizar redes tróficas", en: "Reducing stocks below reproductive levels and destabilizing food webs"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Reduzir estoques abaixo de níveis reprodutivos e desestabilizar redes tróficas", en: "Reducing stocks below reproductive levels and destabilizing food webs"}
        rationale: {pt: "Quando captura excede recrutamento, então populações entram em colapso por gerações.", en: "When catch exceeds recruitment, populations collapse for generations."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Plástico oceânico:", en: "Ocean plastic:"}
        choices:
          - {pt: "Fragmenta-se em microplásticos com ingestão por animais e impacto em toda cadeia", en: "Fragments into microplastics ingested by animals impacting whole food chain"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Fragmenta-se em microplásticos com ingestão por animais e impacto em toda cadeia", en: "Fragments into microplastics ingested by animals impacting whole food chain"}
        rationale: {pt: "Quando partículas concentram toxinas, então biomagnificação atinge predadores topo.", en: "When particles concentrate toxins, biomagnification hits top predators."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Áreas marinhas protegidas (AMPs):", en: "Marine protected areas (MPAs):"}
        choices:
          - {pt: "Recuperam biodiversidade local e exportam biomassa às áreas adjacentes (spillover)", en: "Restore local biodiversity and export biomass to adjacent areas (spillover)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Recuperam biodiversidade local e exportam biomassa às áreas adjacentes (spillover)", en: "Restore local biodiversity and export biomass to adjacent areas (spillover)"}
        rationale: {pt: "Quando proteção é efetiva, então pesca adjacente também ganha.", en: "When protection is effective, adjacent fisheries also benefit."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Tratado da ONU sobre alto-mar (BBNJ):", en: "UN High Seas Treaty (BBNJ):"}
        choices:
          - {pt: "Regula biodiversidade fora de jurisdição nacional via AMPs e avaliações de impacto", en: "Regulates biodiversity beyond national jurisdiction via MPAs and impact assessments"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Regula biodiversidade fora de jurisdição nacional via AMPs e avaliações de impacto", en: "Regulates biodiversity beyond national jurisdiction via MPAs and impact assessments"}
        rationale: {pt: "Quando alto-mar é regulado globalmente, então 60% do oceano ganha proteção formal.", en: "When the high seas are globally regulated, 60% of the ocean gains formal protection."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Megafauna marinha (baleias, atuns):", en: "Marine megafauna (whales, tuna):"}
        choices:
          - {pt: "Predadores de topo cuja perda causa cascatas tróficas e impactos ecossistêmicos", en: "Apex predators whose loss causes trophic cascades and ecosystem impacts"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Predadores de topo cuja perda causa cascatas tróficas e impactos ecossistêmicos", en: "Apex predators whose loss causes trophic cascades and ecosystem impacts"}
        rationale: {pt: "Quando topo desaparece, então mesopredadores explodem e estrutura ecossistêmica muda.", en: "When apex disappears, mesopredators explode and ecosystem structure shifts."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Cetáceos e ecossistemas:", en: "Cetaceans and ecosystems:"}
        choices:
          - {pt: "Carcaças (whale falls) sustentam ecossistemas profundos por décadas", en: "Whale falls sustain deep ecosystems for decades"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Carcaças (whale falls) sustentam ecossistemas profundos por décadas", en: "Whale falls sustain deep ecosystems for decades"}
        rationale: {pt: "Quando baleia morre, então comunidade abissal inteira se forma sobre carcaça.", en: "When whale dies, an entire abyssal community forms on the carcass."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
      - type: choice
        question: {pt: "Próximas fronteiras em oceanografia:", en: "Next ocean frontiers:"}
        choices:
          - {pt: "eDNA marinho, AUVs autônomos, satélites e modelos climáticos integrados de ecossistemas", en: "Marine eDNA, autonomous AUVs, satellites and integrated climate-ecosystem models"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "eDNA marinho, AUVs autônomos, satélites e modelos climáticos integrados de ecossistemas", en: "Marine eDNA, autonomous AUVs, satellites and integrated climate-ecosystem models"}
        rationale: {pt: "Quando dados se integram em escala planetária, então gestão oceânica fica preditiva.", en: "When data integrates planet-wide, ocean management becomes predictive."}
        objectives: [biology.ocean_ecology]
        difficulty: 5
target: 20
