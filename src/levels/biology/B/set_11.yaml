title:
  pt: "🛡️ Tolerância imune e privilégio"
  en: "🛡️ Immune tolerance and privilege"
level: 'B'
subject: biology
objectives: [biology.immune_tolerance]
difficulty: 5
authorNotes: "Tolerância central e periférica, Tregs, anergia, sítios privilegiados, autoimunidade, terapias indutoras de tolerância."
example:
  pt: "Ex.: timo seleciona T → autorreativas deletadas → periferia: Tregs suprimem residuais → tolerância mantida."
  en: "Ex.: thymus selects T → autoreactives deleted → periphery: Tregs suppress residuals → tolerance maintained."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Mecanismos de tolerância", en: "Tolerance mechanisms"}
    description: {pt: "Como o sistema imune evita atacar o próprio.", en: "How the immune system avoids self-attack."}
    exercises:
      - type: choice
        question: {pt: "Tolerância central ocorre em:", en: "Central tolerance occurs in:"}
        choices:
          - {pt: "Timo (T) e medula óssea (B), deletando linfócitos autorreativos imaturos", en: "Thymus (T) and bone marrow (B), deleting immature autoreactive lymphocytes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Timo (T) e medula óssea (B), deletando linfócitos autorreativos imaturos", en: "Thymus (T) and bone marrow (B), deleting immature autoreactive lymphocytes"}
        rationale: {pt: "Quando seleção negativa é eficiente, então maioria das autorreativas é eliminada antes da maturação.", en: "When negative selection is efficient, most autoreactives are eliminated before maturation."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "AIRE (autoimmune regulator) no timo:", en: "AIRE (autoimmune regulator) in thymus:"}
        choices:
          - {pt: "Permite expressão ectópica de antígenos teciduais para selecionar contra autorreativas", en: "Allows ectopic tissue antigen expression to select against autoreactives"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Permite expressão ectópica de antígenos teciduais para selecionar contra autorreativas", en: "Allows ectopic tissue antigen expression to select against autoreactives"}
        rationale: {pt: "Quando AIRE é mutado (APECED), então autoimunidade multissistêmica grave aparece.", en: "When AIRE is mutated (APECED), severe multisystem autoimmunity appears."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "Tolerância periférica usa:", en: "Peripheral tolerance uses:"}
        choices:
          - {pt: "Tregs, anergia, deleção e ignorância imunológica para conter autorreativas remanescentes", en: "Tregs, anergy, deletion and immunological ignorance to contain remaining autoreactives"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Tregs, anergia, deleção e ignorância imunológica para conter autorreativas remanescentes", en: "Tregs, anergy, deletion and immunological ignorance to contain remaining autoreactives"}
        rationale: {pt: "Quando central falha, então camadas periféricas controlam dano.", en: "When central fails, peripheral layers contain damage."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "T regulatórias (Tregs) caracterizam-se por:", en: "Regulatory T cells (Tregs) are characterized by:"}
        choices:
          - {pt: "Expressão de Foxp3 e CD25 alto, suprimindo respostas T efetoras", en: "Foxp3 and high CD25 expression, suppressing effector T responses"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Expressão de Foxp3 e CD25 alto, suprimindo respostas T efetoras", en: "Foxp3 and high CD25 expression, suppressing effector T responses"}
        rationale: {pt: "Quando Foxp3 é mutado (IPEX), então autoimunidade letal precoce ocorre.", en: "When Foxp3 is mutated (IPEX), early lethal autoimmunity occurs."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "Anergia clonal é:", en: "Clonal anergy is:"}
        choices:
          - {pt: "Estado de não-resposta funcional após sinal incompleto sem coestímulo (apenas sinal 1)", en: "Functional unresponsive state after incomplete signal without costimulation (signal 1 only)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Estado de não-resposta funcional após sinal incompleto sem coestímulo (apenas sinal 1)", en: "Functional unresponsive state after incomplete signal without costimulation (signal 1 only)"}
        rationale: {pt: "Quando coestímulo falta, então T fica anérgica em vez de ativada.", en: "When costimulation is absent, T becomes anergic rather than activated."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "CTLA-4 controla tolerância via:", en: "CTLA-4 controls tolerance via:"}
        choices:
          - {pt: "Competição com CD28 por B7, atenuando ativação T no priming", en: "Competition with CD28 for B7, attenuating T activation at priming"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Competição com CD28 por B7, atenuando ativação T no priming", en: "Competition with CD28 for B7, attenuating T activation at priming"}
        rationale: {pt: "Quando freio CTLA-4 atua, então T pré-existentes não escalam — autoimunidade é mitigada.", en: "When CTLA-4 brake acts, pre-existing T don't escalate — autoimmunity is mitigated."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "PD-1 e tolerância periférica:", en: "PD-1 and peripheral tolerance:"}
        choices:
          - {pt: "Engaja PD-L1 em tecidos para limitar dano autoimune crônico", en: "Engages PD-L1 in tissues to limit chronic autoimmune damage"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Engaja PD-L1 em tecidos para limitar dano autoimune crônico", en: "Engages PD-L1 in tissues to limit chronic autoimmune damage"}
        rationale: {pt: "Quando bloqueio anti-PD-1 é dado, então autoimunidade colateral pode emergir como efeito.", en: "When anti-PD-1 blockade is given, collateral autoimmunity may emerge."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "Sítios imunoprivilegiados clássicos:", en: "Classic immune-privileged sites:"}
        choices:
          - {pt: "Olho, cérebro, testículo e placenta com barreiras e ambiente imunossupressor", en: "Eye, brain, testis and placenta with barriers and immunosuppressive environment"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Olho, cérebro, testículo e placenta com barreiras e ambiente imunossupressor", en: "Eye, brain, testis and placenta with barriers and immunosuppressive environment"}
        rationale: {pt: "Quando dano imune é catastrófico, então evolução protegeu esses tecidos com privilégio.", en: "When immune damage is catastrophic, evolution protected these tissues with privilege."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "Tolerância materno-fetal envolve:", en: "Maternal-fetal tolerance involves:"}
        choices:
          - {pt: "HLA-G, Tregs deciduais e ambiente Th2/imunoregulatório protegendo feto semialogênico", en: "HLA-G, decidual Tregs and Th2/immunoregulatory environment protecting semiallogeneic fetus"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "HLA-G, Tregs deciduais e ambiente Th2/imunoregulatório protegendo feto semialogênico", en: "HLA-G, decidual Tregs and Th2/immunoregulatory environment protecting semiallogeneic fetus"}
        rationale: {pt: "Quando equilíbrio falha, então perda gestacional, pré-eclâmpsia e RCIU podem ocorrer.", en: "When balance fails, gestational loss, preeclampsia and IUGR can occur."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "Microbiota e tolerância:", en: "Microbiota and tolerance:"}
        choices:
          - {pt: "Comensais induzem Tregs intestinais e equilibram resposta sistêmica", en: "Commensals induce intestinal Tregs and balance systemic response"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Comensais induzem Tregs intestinais e equilibram resposta sistêmica", en: "Commensals induce intestinal Tregs and balance systemic response"}
        rationale: {pt: "Quando microbiota é saudável, então hipótese da higiene se cumpre — alergias e autoimunidade caem.", en: "When microbiota is healthy, hygiene hypothesis is met — allergies and autoimmunity drop."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Falhas e terapias indutoras", en: "Failures and induction therapies"}
    description: {pt: "Quando tolerância falha e como restaurá-la.", en: "When tolerance fails and how to restore it."}
    exercises:
      - type: choice
        question: {pt: "Autoimunidade ocorre quando:", en: "Autoimmunity occurs when:"}
        choices:
          - {pt: "Falha em tolerância central/periférica permite ataque a autoantígenos crônico", en: "Central/peripheral tolerance failure allows chronic autoantigen attack"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Falha em tolerância central/periférica permite ataque a autoantígenos crônico", en: "Central/peripheral tolerance failure allows chronic autoantigen attack"}
        rationale: {pt: "Quando supressão é insuficiente, então tecidos próprios são danificados.", en: "When suppression is insufficient, own tissues are damaged."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "Mimetismo molecular:", en: "Molecular mimicry:"}
        choices:
          - {pt: "Antígenos microbianos similares a self disparam resposta cruzada autoimune", en: "Microbial antigens similar to self trigger autoimmune cross-response"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Antígenos microbianos similares a self disparam resposta cruzada autoimune", en: "Microbial antigens similar to self trigger autoimmune cross-response"}
        rationale: {pt: "Quando epítopos coincidem, então T pode confundir patógeno com hospedeiro.", en: "When epitopes coincide, T may confuse pathogen with host."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "Doenças autoimunes sistêmicas (LES):", en: "Systemic autoimmune diseases (SLE):"}
        choices:
          - {pt: "Autoanticorpos antinucleares + complemento + interferon tipo I causam dano multissistêmico", en: "Antinuclear autoantibodies + complement + type I interferon cause multisystem damage"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Autoanticorpos antinucleares + complemento + interferon tipo I causam dano multissistêmico", en: "Antinuclear autoantibodies + complement + type I interferon cause multisystem damage"}
        rationale: {pt: "Quando IFN-I assina LES, então anifrolumab (anti-IFNAR) modula doença.", en: "When type I IFN signature exists in SLE, anifrolumab (anti-IFNAR) modulates disease."}
