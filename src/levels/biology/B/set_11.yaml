          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Expansão e infusão de Tregs autólogas em DM1, doença de Crohn e GVHD", en: "Expansion and infusion of autologous Tregs in T1DM, Crohn's and GVHD"}
