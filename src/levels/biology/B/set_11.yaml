          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Eventos adversos imunes (irAEs) em qualquer órgão por quebra de tolerância", en: "Immune adverse events (irAEs) in any organ via tolerance break"}
        rationale: {pt: "Quando freios são tirados, então autoagressão pode aparecer em órgãos diversos.", en: "When brakes are removed, autoagression may appear in diverse organs."}
        objectives: [biology.immune_tolerance]
        difficulty: 5
      - type: choice
        question: {pt: "Indução de tolerância em transplante:", en: "Tolerance induction in transplant:"}
        choices:
          - {pt: "Quimerismo misto, depleção/expansão de Tregs e bloqueio de coestímulo (belatacept)", en: "Mixed chimerism, Treg depletion/expansion and costimulation blockade (belatacept)"}
