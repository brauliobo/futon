        difficulty: 5
      - type: choice
        question: {pt: "Doenças órgão-específicas (DM1):", en: "Organ-specific diseases (T1DM):"}
        choices:
          - {pt: "T citotóxicas destroem células β pancreáticas com perda de insulina", en: "Cytotoxic T destroys pancreatic β cells with insulin loss"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "T citotóxicas destroem células β pancreáticas com perda de insulina", en: "Cytotoxic T destroys pancreatic β cells with insulin loss"}
        rationale: {pt: "Quando β colapsa, então hiperglicemia crônica exige reposição exógena de insulina.", en: "When β collapses, chronic hyperglycemia demands exogenous insulin replacement."}
