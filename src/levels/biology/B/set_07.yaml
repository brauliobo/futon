        rationale: {pt: "Quando pulso é breve, então célula 'memoriza' silenciamento sem expressão contínua de efetor.", en: "When pulse is brief, cell 'memorizes' silencing without continuous effector expression."}
        objectives: [biology.epigenetic_editing]
        difficulty: 5
      - type: choice
        question: {pt: "CRISPRa (ativação) atua via:", en: "CRISPRa (activation) acts via:"}
        choices:
          - {pt: "dCas9-VP64/SAM/SunTag recrutando complexos transcricionais ativadores", en: "dCas9-VP64/SAM/SunTag recruiting activating transcriptional complexes"}
