          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "dCas13-METTL3 ou FTO modulam metilação m6A em mRNAs específicos", en: "dCas13-METTL3 or FTO modulate m6A methylation on specific mRNAs"}
