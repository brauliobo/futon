        rationale: {pt: "Quando ativadores convergem no promotor, então expressão sobe sem alterar gene endógeno.", en: "When activators converge on promoter, expression rises without altering endogenous gene."}
        objectives: [biology.epigenetic_editing]
        difficulty: 5
      - type: choice
        question: {pt: "Modificação de histonas dirigida via:", en: "Targeted histone modification via:"}
        choices:
          - {pt: "dCas9-p300 (acetilação) ou dCas9-LSD1 (demetilação H3K4me)", en: "dCas9-p300 (acetylation) or dCas9-LSD1 (H3K4me demethylation)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "dCas9-p300 (acetilação) ou dCas9-LSD1 (demetilação H3K4me)", en: "dCas9-p300 (acetylation) or dCas9-LSD1 (H3K4me demethylation)"}
        rationale: {pt: "Quando enzimas histônicas são direcionadas, então estado cromatínico local é reescrito.", en: "When histone enzymes are directed, local chromatin state is rewritten."}
        objectives: [biology.epigenetic_editing]
        difficulty: 5
      - type: choice
        question: {pt: "Edição de RNA m6A dirigida:", en: "Targeted m6A RNA editing:"}
        choices:
          - {pt: "dCas13-METTL3 ou FTO modulam metilação m6A em mRNAs específicos", en: "dCas13-METTL3 or FTO modulate m6A methylation on specific mRNAs"}
