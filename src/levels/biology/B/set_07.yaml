        objectives: [biology.epigenetic_editing]
        difficulty: 5
      - type: choice
        question: {pt: "Edição epigenética vs CRISPR-Cas9 clássico:", en: "Epigenetic editing vs classic CRISPR-Cas9:"}
        choices:
          - {pt: "Reversível, sem alterar sequência, mas pode ser perdida após divisões celulares", en: "Reversible, no sequence change, but may be lost after cell divisions"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Reversível, sem alterar sequência, mas pode ser perdida após divisões celulares", en: "Reversible, no sequence change, but may be lost after cell divisions"}
        rationale: {pt: "Quando segurança é prioridade, então edição epigenética é mais conservadora que cortes.", en: "When safety is priority, epigenetic editing is more conservative than cuts."}
        objectives: [biology.epigenetic_editing]
        difficulty: 5
