title:
  pt: "📝 Edição epigenética dirigida"
  en: "📝 Targeted epigenetic editing"
level: 'B'
subject: biology
objectives: [biology.epigenetic_editing]
difficulty: 5
authorNotes: "dCas9-efetores, edição de marcas (metilação, acetilação), CRISPRi/a, reprogramação focal, terapias."
example:
  pt: "Ex.: dCas9-DNMT3A → guia para promotor → metilação CpG → silenciamento estável → fenótipo modulado."
  en: "Ex.: dCas9-DNMT3A → guide to promoter → CpG methylation → stable silencing → modulated phenotype."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Plataformas de edição epigenética", en: "Epigenetic editing platforms"}
    description: {pt: "Modificar marcas sem mexer na sequência.", en: "Modify marks without altering sequence."}
    exercises:
      - type: choice
        question: {pt: "Edição epigenética visa:", en: "Epigenetic editing aims to:"}
        choices:
          - {pt: "Alterar marcas químicas (metilação, acetilação) sem mudar sequência de DNA", en: "Alter chemical marks (methylation, acetylation) without changing DNA sequence"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Alterar marcas químicas (metilação, acetilação) sem mudar sequência de DNA", en: "Alter chemical marks (methylation, acetylation) without changing DNA sequence"}
        rationale: {pt: "Quando reversibilidade é possível, então abordagem é mais segura que edição genômica.", en: "When reversibility is possible, approach is safer than genomic editing."}
        objectives: [biology.epigenetic_editing]
        difficulty: 5
      - type: choice
        question: {pt: "dCas9 (dead Cas9) serve para:", en: "dCas9 (dead Cas9) serves to:"}
        choices:
          - {pt: "Direcionar efetores epigenéticos a loci específicos sem cortar DNA", en: "Direct epigenetic effectors to specific loci without cutting DNA"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Direcionar efetores epigenéticos a loci específicos sem cortar DNA", en: "Direct epigenetic effectors to specific loci without cutting DNA"}
        rationale: {pt: "Quando atividade nuclease é removida, então sgRNA + dCas9 vira plataforma modular.", en: "When nuclease activity is removed, sgRNA + dCas9 becomes modular platform."}
        objectives: [biology.epigenetic_editing]
        difficulty: 5
      - type: choice
        question: {pt: "dCas9-DNMT3A induz:", en: "dCas9-DNMT3A induces:"}
        choices:
          - {pt: "Metilação de CpGs em locus-alvo, silenciando gene se em promotor", en: "CpG methylation at target locus, silencing gene if at promoter"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Metilação de CpGs em locus-alvo, silenciando gene se em promotor", en: "CpG methylation at target locus, silencing gene if at promoter"}
        rationale: {pt: "Quando metilação é direcionada, então silenciamento herdável estável é estabelecido.", en: "When methylation is directed, stable heritable silencing is established."}
        objectives: [biology.epigenetic_editing]
        difficulty: 5
      - type: choice
        question: {pt: "dCas9-TET1 induz:", en: "dCas9-TET1 induces:"}
        choices:
          - {pt: "Demetilação de CpGs, reativando genes silenciados em locus específico", en: "CpG demethylation, reactivating silenced genes at specific locus"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Demetilação de CpGs, reativando genes silenciados em locus específico", en: "CpG demethylation, reactivating silenced genes at specific locus"}
        rationale: {pt: "Quando 5mC é convertido em 5hmC e depois removido, então transcrição é restaurada.", en: "When 5mC is converted to 5hmC and removed, transcription is restored."}
        objectives: [biology.epigenetic_editing]
        difficulty: 5
      - type: choice
        question: {pt: "CRISPRi clássico usa:", en: "Classic CRISPRi uses:"}
        choices:
          - {pt: "dCas9-KRAB recrutando complexos repressivos para silenciar gene reversivelmente", en: "dCas9-KRAB recruiting repressive complexes to reversibly silence gene"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "dCas9-KRAB recrutando complexos repressivos para silenciar gene reversivelmente", en: "dCas9-KRAB recruiting repressive complexes to reversibly silence gene"}
        rationale: {pt: "Quando KRAB induz heterocromatina, então silenciamento dura enquanto efetor estiver presente.", en: "When KRAB induces heterochromatin, silencing lasts while effector is present."}
        objectives: [biology.epigenetic_editing]
        difficulty: 5
      - type: choice
        question: {pt: "CRISPRoff (silenciamento durável):", en: "CRISPRoff (durable silencing):"}
        choices:
          - {pt: "Combina KRAB + DNMT3A/L para silenciamento herdável após pulso curto", en: "Combines KRAB + DNMT3A/L for heritable silencing after short pulse"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
