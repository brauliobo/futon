title:
  pt: "🔬 Triagens funcionais por CRISPR"
  en: "🔬 CRISPR functional genomics screens"
level: 'B'
subject: biology
objectives: [biology.crispr_screens]
difficulty: 5
authorNotes: "CRISPRko/i/a screens, base editing screens, perturb-seq, single-cell screens, hits e validação."
example:
  pt: "Ex.: biblioteca sgRNA → célula → seleção (proliferação/sobrevida) → NGS → genes essenciais identificados."
  en: "Ex.: sgRNA library → cell → selection (proliferation/survival) → NGS → essential genes identified."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Tipos de triagem CRISPR", en: "CRISPR screen types"}
    description: {pt: "Como mapear função em escala genômica.", en: "How to map function genome-wide."}
    exercises:
      - type: choice
        question: {pt: "CRISPRko (knockout) screen:", en: "CRISPRko (knockout) screen:"}
        choices:
          - {pt: "Cas9 + biblioteca sgRNA inativa cada gene; fenótipo seleciona vencedores/perdedores", en: "Cas9 + sgRNA library inactivates each gene; phenotype selects winners/losers"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Cas9 + biblioteca sgRNA inativa cada gene; fenótipo seleciona vencedores/perdedores", en: "Cas9 + sgRNA library inactivates each gene; phenotype selects winners/losers"}
        rationale: {pt: "Quando NGS mede sgRNAs antes/depois, então essenciais e dependências são listados.", en: "When NGS measures sgRNAs before/after, essentials and dependencies are listed."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "CRISPRi (interferência) usa:", en: "CRISPRi (interference) uses:"}
        choices:
          - {pt: "dCas9-KRAB para silenciar gene-alvo sem cortar DNA", en: "dCas9-KRAB to silence target gene without cutting DNA"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "dCas9-KRAB para silenciar gene-alvo sem cortar DNA", en: "dCas9-KRAB to silence target gene without cutting DNA"}
        rationale: {pt: "Quando inibição é reversível, então estudo dinâmico de função fica viável.", en: "When inhibition is reversible, dynamic function study becomes feasible."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "CRISPRa (ativação):", en: "CRISPRa (activation):"}
        choices:
          - {pt: "dCas9-VP64/SAM aumenta expressão do gene-alvo, complementando knockouts", en: "dCas9-VP64/SAM increases target gene expression, complementing knockouts"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "dCas9-VP64/SAM aumenta expressão do gene-alvo, complementando knockouts", en: "dCas9-VP64/SAM increases target gene expression, complementing knockouts"}
        rationale: {pt: "Quando ativadores são dirigidos, então 'gain-of-function screens' identificam vias suficientes.", en: "When activators are targeted, gain-of-function screens identify sufficient pathways."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Bibliotecas de sgRNA pooled:", en: "Pooled sgRNA libraries:"}
        choices:
          - {pt: "Múltiplos sgRNAs por gene, transduzidos em pool e analisados por NGS", en: "Multiple sgRNAs per gene, pool-transduced and analyzed by NGS"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Múltiplos sgRNAs por gene, transduzidos em pool e analisados por NGS", en: "Multiple sgRNAs per gene, pool-transduced and analyzed by NGS"}
        rationale: {pt: "Quando redundância existe, então sinal verdadeiro emerge sobre off-targets isolados.", en: "When redundancy exists, true signal emerges over isolated off-targets."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Triagens arrayed (uma por poço):", en: "Arrayed screens (one per well):"}
        choices:
          - {pt: "Permitem fenótipos complexos por poço com leitura por imagem ou citometria", en: "Allow complex per-well phenotypes with imaging or cytometry readout"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Permitem fenótipos complexos por poço com leitura por imagem ou citometria", en: "Allow complex per-well phenotypes with imaging or cytometry readout"}
        rationale: {pt: "Quando fenótipo é rico, então mais informação por experimento é coletada.", en: "When phenotype is rich, more information per experiment is collected."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Perturb-seq (CROP-seq):", en: "Perturb-seq (CROP-seq):"}
        choices:
          - {pt: "Combina perturbação CRISPR com scRNA-seq lendo perfil transcricional por sgRNA", en: "Combines CRISPR perturbation with scRNA-seq reading transcriptional profile per sgRNA"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Combina perturbação CRISPR com scRNA-seq lendo perfil transcricional por sgRNA", en: "Combines CRISPR perturbation with scRNA-seq reading transcriptional profile per sgRNA"}
        rationale: {pt: "Quando perturbação encontra single-cell, então redes regulatórias são mapeadas em alta resolução.", en: "When perturbation meets single-cell, regulatory networks map at high resolution."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Base editing screens identificam:", en: "Base editing screens identify:"}
        choices:
          - {pt: "Variantes de função específica (VUS) testadas em larga escala em contexto endógeno", en: "Specific-function variants (VUS) tested at scale in endogenous context"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Variantes de função específica (VUS) testadas em larga escala em contexto endógeno", en: "Specific-function variants (VUS) tested at scale in endogenous context"}
        rationale: {pt: "Quando edição é base-a-base, então mutações pontuais são caracterizadas funcionalmente em massa.", en: "When editing is base-by-base, point mutations are functionally characterized en masse."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "DepMap (Cancer Dependency Map):", en: "DepMap (Cancer Dependency Map):"}
        choices:
          - {pt: "Catálogo aberto de essencialidade gênica em centenas de linhagens tumorais", en: "Open catalog of gene essentiality across hundreds of tumor lines"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Catálogo aberto de essencialidade gênica em centenas de linhagens tumorais", en: "Open catalog of gene essentiality across hundreds of tumor lines"}
        rationale: {pt: "Quando dados são públicos, então alvos novos surgem para subtipos específicos.", en: "When data is public, new targets emerge for specific subtypes."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Hits comuns vs específicos em screens:", en: "Common vs specific hits in screens:"}
        choices:
          - {pt: "Genes essenciais universais filtrados; alvos específicos do contexto são priorizados", en: "Universal essential genes filtered; context-specific targets prioritized"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Genes essenciais universais filtrados; alvos específicos do contexto são priorizados", en: "Universal essential genes filtered; context-specific targets prioritized"}
        rationale: {pt: "Quando seletividade é exigida, então genes pan-letais são ignorados como alvo terapêutico.", en: "When selectivity is required, pan-lethal genes are ignored as therapeutic targets."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Letalidade sintética por screen:", en: "Synthetic lethality by screen:"}
        choices:
          - {pt: "Identifica pares onde co-perda mata célula com mutação A, poupando WT", en: "Identifies pairs where co-loss kills mutation-A cell, sparing WT"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Identifica pares onde co-perda mata célula com mutação A, poupando WT", en: "Identifies pairs where co-loss kills mutation-A cell, sparing WT"}
        rationale: {pt: "Quando dependência sintética é mapeada, então fármacos exploram vulnerabilidade tumoral seletiva.", en: "When synthetic dependency is mapped, drugs exploit selective tumor vulnerability."}
        objectives: [biology.crispr_screens]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Validação e aplicações", en: "Validation and applications"}
    description: {pt: "De hit a alvo terapêutico real.", en: "From hit to real therapeutic target."}
    exercises:
      - type: choice
        question: {pt: "Validação ortogonal de hits inclui:", en: "Orthogonal hit validation includes:"}
        choices:
          - {pt: "sgRNAs alternativos, RNAi, edição em outra linhagem e fenótipo independente", en: "Alternative sgRNAs, RNAi, editing in another line and independent phenotype"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "sgRNAs alternativos, RNAi, edição em outra linhagem e fenótipo independente", en: "Alternative sgRNAs, RNAi, editing in another line and independent phenotype"}
        rationale: {pt: "Quando múltiplas evidências convergem, então hit é robusto e merece investimento.", en: "When multiple evidences converge, hit is robust and worth investment."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Triagens in vivo (camundongo) avaliam:", en: "In vivo screens (mouse) evaluate:"}
        choices:
          - {pt: "Função no contexto fisiológico — TME, imunidade e farmacologia", en: "Function in physiological context — TME, immunity and pharmacology"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Função no contexto fisiológico — TME, imunidade e farmacologia", en: "Function in physiological context — TME, immunity and pharmacology"}
        rationale: {pt: "Quando in vitro engana, então in vivo separa hits relevantes de artefatos.", en: "When in vitro misleads, in vivo separates relevant hits from artifacts."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Triagens em organoides:", en: "Organoid screens:"}
        choices:
          - {pt: "Combinam fisiologia 3D e genética sistemática para alvos clinicamente translacionais", en: "Combine 3D physiology and systematic genetics for clinically translational targets"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Combinam fisiologia 3D e genética sistemática para alvos clinicamente translacionais", en: "Combine 3D physiology and systematic genetics for clinically translational targets"}
        rationale: {pt: "Quando 3D imita tecido, então hits têm maior chance de servir clínica.", en: "When 3D mimics tissue, hits stand a better chance of serving the clinic."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Triagens de imunidade (anti-PD-1 + KO):", en: "Immune screens (anti-PD-1 + KO):"}
        choices:
          - {pt: "Mapeiam genes que mediam resposta vs resistência a imunoterapia", en: "Map genes mediating response vs resistance to immunotherapy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Mapeiam genes que mediam resposta vs resistência a imunoterapia", en: "Map genes mediating response vs resistance to immunotherapy"}
        rationale: {pt: "Quando alvos de resistência são identificados, então combinações racionais ampliam resposta.", en: "When resistance targets are identified, rational combinations broaden response."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Saturation editing (sátu-edit):", en: "Saturation editing:"}
        choices:
          - {pt: "Edita todas variantes possíveis em um locus para mapeamento funcional completo", en: "Edits every possible variant at a locus for complete functional mapping"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Edita todas variantes possíveis em um locus para mapeamento funcional completo", en: "Edits every possible variant at a locus for complete functional mapping"}
        rationale: {pt: "Quando saturação é alcançada, então cada variante humana ganha anotação funcional.", en: "When saturation is reached, each human variant gains functional annotation."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "DropletScreen / massively parallel screens:", en: "DropletScreen / massively parallel screens:"}
        choices:
          - {pt: "Microfluídica encapsula uma célula+sgRNA por gota para fenótipo barcode-resolvido", en: "Microfluidics encapsulates one cell+sgRNA per droplet for barcode-resolved phenotype"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Microfluídica encapsula uma célula+sgRNA por gota para fenótipo barcode-resolvido", en: "Microfluidics encapsulates one cell+sgRNA per droplet for barcode-resolved phenotype"}
        rationale: {pt: "Quando paralelismo cresce, então milhões de perturbações são lidas em horas.", en: "When parallelism grows, millions of perturbations read in hours."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Limitações de screens incluem:", en: "Screen limitations include:"}
        choices:
          - {pt: "Off-targets, knockdown incompleto, heterogeneidade de cultura e contexto pouco fisiológico", en: "Off-targets, incomplete knockdown, culture heterogeneity and poor physiological context"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Off-targets, knockdown incompleto, heterogeneidade de cultura e contexto pouco fisiológico", en: "Off-targets, incomplete knockdown, culture heterogeneity and poor physiological context"}
        rationale: {pt: "Quando limitações são reconhecidas, então design de validação é robusto.", en: "When limitations are recognized, validation design is robust."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "MAGeCK e BAGEL são:", en: "MAGeCK and BAGEL are:"}
        choices:
          - {pt: "Pipelines bioinformáticos para chamar hits de screens com controle de FDR", en: "Bioinformatic pipelines to call screen hits with FDR control"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Pipelines bioinformáticos para chamar hits de screens com controle de FDR", en: "Bioinformatic pipelines to call screen hits with FDR control"}
        rationale: {pt: "Quando estatística é robusta, então hits têm baixa taxa de falsos positivos.", en: "When statistics are robust, hits have low false-positive rate."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Triagens em pacientes (in vivo humano):", en: "Screens in patients (human in vivo):"}
        choices:
          - {pt: "CAR-T com biblioteca CRISPR identifica genes de função aumentada na clínica", en: "CRISPR library CAR-T identifies enhanced function genes in clinic"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "CAR-T com biblioteca CRISPR identifica genes de função aumentada na clínica", en: "CRISPR library CAR-T identifies enhanced function genes in clinic"}
        rationale: {pt: "Quando perturbação acontece em paciente, então achados translacionais são imediatos.", en: "When perturbation happens in patient, translational findings are immediate."}
        objectives: [biology.crispr_screens]
        difficulty: 5
      - type: choice
        question: {pt: "Próximas fronteiras em screens CRISPR:", en: "Next frontiers in CRISPR screens:"}
        choices:
          - {pt: "Multi-modal (transcriptômica + proteômica + spatial), in vivo e perturbações combinatórias", en: "Multi-modal (transcriptomics + proteomics + spatial), in vivo and combinatorial perturbations"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Multi-modal (transcriptômica + proteômica + spatial), in vivo e perturbações combinatórias", en: "Multi-modal (transcriptomics + proteomics + spatial), in vivo and combinatorial perturbations"}
        rationale: {pt: "Quando dados convergem, então redes funcionais sistêmicas são mapeadas em alta resolução.", en: "When data converges, systemic functional networks are mapped at high resolution."}
        objectives: [biology.crispr_screens]
        difficulty: 5
target: 20
