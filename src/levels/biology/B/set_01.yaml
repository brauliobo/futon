          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Decodificação de palavras/frases a partir de córtex motor da fala em tempo real", en: "Word/sentence decoding from speech motor cortex in real time"}
        rationale: {pt: "Quando paciente paralisado treina decodificador, então comunicação livre fluida emerge.", en: "When paralyzed patient trains decoder, fluid free communication emerges."}
