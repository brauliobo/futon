title:
  pt: "🧠 Interfaces cérebro-máquina"
  en: "🧠 Brain-computer interfaces"
level: 'B'
subject: biology
objectives: [biology.bci]
difficulty: 5
authorNotes: "Eletrocorticografia, microeletrodos, sinais neurais, decodificação por IA, próteses, restauração de fala/movimento."
example:
  pt: "Ex.: paciente paralisado → eletrodos no córtex → decodificação por IA → cursor/voz controlados → autonomia restaurada."
  en: "Ex.: paralyzed patient → cortical electrodes → AI decoding → cursor/voice controlled → autonomy restored."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Sinais e hardware", en: "Signals and hardware"}
    description: {pt: "Como ler atividade cerebral.", en: "How to read brain activity."}
    exercises:
      - type: choice
        question: {pt: "EEG não-invasivo capta:", en: "Non-invasive EEG captures:"}
        choices:
          - {pt: "Atividade cortical de muitos neurônios via eletrodos no couro cabeludo", en: "Cortical activity from many neurons via scalp electrodes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas microscopia", en: "Just microscopy"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Atividade cortical de muitos neurônios via eletrodos no couro cabeludo", en: "Cortical activity from many neurons via scalp electrodes"}
        rationale: {pt: "Quando ondas oscilam, então EEG mostra ritmos com alta resolução temporal mas baixa espacial.", en: "When waves oscillate, EEG shows rhythms with high temporal but low spatial resolution."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "ECoG (eletrocorticografia) registra:", en: "ECoG (electrocorticography) records:"}
        choices:
          - {pt: "Atividade cortical de eletrodos colocados na superfície cerebral, sob crânio aberto", en: "Cortical activity from electrodes on brain surface, under opened skull"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pulmão", en: "Just lung"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Atividade cortical de eletrodos colocados na superfície cerebral, sob crânio aberto", en: "Cortical activity from electrodes on brain surface, under opened skull"}
        rationale: {pt: "Quando eletrodos contatam córtex, então sinal é mais limpo que EEG e menos invasivo que microeletrodos.", en: "When electrodes contact cortex, signal is cleaner than EEG and less invasive than microelectrodes."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "Microeletrodos intracorticais (Utah array):", en: "Intracortical microelectrodes (Utah array):"}
        choices:
          - {pt: "Captam spikes de neurônios individuais com alta resolução", en: "Capture spikes of individual neurons with high resolution"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas microscopia", en: "Just microscopy"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Captam spikes de neurônios individuais com alta resolução", en: "Capture spikes of individual neurons with high resolution"}
        rationale: {pt: "Quando eletrodos penetram córtex, então decodificação fina permite controle preciso.", en: "When electrodes penetrate cortex, fine decoding enables precise control."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "Neuropixels probes oferecem:", en: "Neuropixels probes offer:"}
        choices:
          - {pt: "Centenas a milhares de canais em sonda fina única para registro neural denso", en: "Hundreds to thousands of channels on a thin single probe for dense neural recording"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Centenas a milhares de canais em sonda fina única para registro neural denso", en: "Hundreds to thousands of channels on a thin single probe for dense neural recording"}
        rationale: {pt: "Quando densidade aumenta, então populações neurais inteiras são amostradas em paralelo.", en: "When density increases, whole neural populations are sampled in parallel."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "fMRI BOLD em BCI mede:", en: "fMRI BOLD in BCI measures:"}
        choices:
          - {pt: "Fluxo sanguíneo cerebral como proxy lento de atividade neural", en: "Cerebral blood flow as a slow proxy of neural activity"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Fluxo sanguíneo cerebral como proxy lento de atividade neural", en: "Cerebral blood flow as a slow proxy of neural activity"}
        rationale: {pt: "Quando neurônios consomem mais O₂, então BOLD localiza atividade espacialmente.", en: "When neurons consume more O₂, BOLD localizes activity spatially."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "fNIRS (espectroscopia infravermelha):", en: "fNIRS (near-infrared spectroscopy):"}
        choices:
          - {pt: "Mede oxigenação cerebral cortical de forma portátil e não-invasiva", en: "Measures cortical brain oxygenation portably and noninvasively"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Mede oxigenação cerebral cortical de forma portátil e não-invasiva", en: "Measures cortical brain oxygenation portably and noninvasively"}
        rationale: {pt: "Quando luz infravermelha atravessa crânio, então BCIs móveis tornam-se viáveis.", en: "When infrared light crosses skull, mobile BCIs become feasible."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "Neuralink desenvolve:", en: "Neuralink develops:"}
        choices:
          - {pt: "Eletrodos finos implantados por robô para BCIs invasivas escaláveis", en: "Thin electrodes implanted by robot for scalable invasive BCIs"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas software", en: "Just software"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Eletrodos finos implantados por robô para BCIs invasivas escaláveis", en: "Thin electrodes implanted by robot for scalable invasive BCIs"}
        rationale: {pt: "Quando inserção é precisa e mínima, então centenas de fios atingem alvos sem grande dano.", en: "When insertion is precise and minimal, hundreds of threads reach targets with little damage."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "Stentrode (Synchron) é abordagem:", en: "Stentrode (Synchron) is an approach:"}
        choices:
          - {pt: "BCI minimamente invasiva via vasos cerebrais sem craniotomia", en: "Minimally invasive BCI via cerebral vessels without craniotomy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "BCI minimamente invasiva via vasos cerebrais sem craniotomia", en: "Minimally invasive BCI via cerebral vessels without craniotomy"}
        rationale: {pt: "Quando endovascular é viável, então cirurgia aberta deixa de ser obrigatória.", en: "When endovascular is feasible, open surgery is no longer mandatory."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "Sinais ricos em BCI invasiva incluem:", en: "Rich invasive BCI signals include:"}
        choices:
          - {pt: "Spikes single-unit, multi-unit e LFP em alta frequência", en: "Single-unit spikes, multi-unit and high-frequency LFP"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Spikes single-unit, multi-unit e LFP em alta frequência", en: "Single-unit spikes, multi-unit and high-frequency LFP"}
        rationale: {pt: "Quando informação é rica, então decodificação dimensional alta é possível em tempo real.", en: "When information is rich, high-dimensional real-time decoding is possible."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "Estimulação elétrica (DBS) trata:", en: "Electrical stimulation (DBS) treats:"}
        choices:
          - {pt: "Parkinson, distonia e tremor essencial via marcapasso cerebral", en: "Parkinson's, dystonia and essential tremor via brain pacemaker"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Parkinson, distonia e tremor essencial via marcapasso cerebral", en: "Parkinson's, dystonia and essential tremor via brain pacemaker"}
        rationale: {pt: "Quando núcleo profundo recebe pulsos, então circuitos disfuncionais são modulados terapeuticamente.", en: "When deep nucleus receives pulses, dysfunctional circuits are therapeutically modulated."}
        objectives: [biology.bci]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Decodificação e aplicações", en: "Decoding and applications"}
    description: {pt: "De sinais a função restaurada.", en: "From signals to restored function."}
    exercises:
      - type: choice
        question: {pt: "Decodificação por IA em BCI usa:", en: "AI BCI decoding uses:"}
        choices:
          - {pt: "Redes neurais que aprendem a mapear atividade neural em comandos motores/fala", en: "Neural networks learning to map neural activity to motor/speech commands"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Redes neurais que aprendem a mapear atividade neural em comandos motores/fala", en: "Neural networks learning to map neural activity to motor/speech commands"}
        rationale: {pt: "Quando decodificadores treinam por feedback, então performance melhora ao longo de sessões.", en: "When decoders train via feedback, performance improves across sessions."}
        objectives: [biology.bci]
        difficulty: 5
      - type: choice
        question: {pt: "Restauração de fala via BCI já demonstrou:", en: "Speech restoration via BCI has demonstrated:"}
