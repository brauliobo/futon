title:
  pt: "🎯 Medicina de precisão"
  en: "🎯 Precision medicine"
level: '1A'
subject: biology
objectives: [biology.precision_medicine]
difficulty: 5
authorNotes: "Genômica clínica, farmacogenômica, terapias-alvo, biomarcadores, oncologia personalizada."
example:
  pt: "Ex.: tumor sequenciado → mutação EGFR identificada → inibidor específico → resposta clínica → sobrevida estendida."
  en: "Ex.: tumor sequenced → EGFR mutation identified → specific inhibitor → clinical response → extended survival."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Genômica clínica e biomarcadores", en: "Clinical genomics and biomarkers"}
    description: {pt: "Tratamento sob medida pelo perfil molecular.", en: "Tailored treatment by molecular profile."}
    exercises:
      - type: choice
        question: {pt: "Medicina de precisão visa:", en: "Precision medicine aims to:"}
        choices:
          - {pt: "Adaptar prevenção e tratamento ao perfil molecular individual", en: "Tailor prevention and treatment to individual molecular profile"}
          - {pt: "Apenas tratamento padrão único", en: "Just single standard treatment"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas dieta genérica", en: "Just generic diet"}
        correctAnswer: {pt: "Adaptar prevenção e tratamento ao perfil molecular individual", en: "Tailor prevention and treatment to individual molecular profile"}
        rationale: {pt: "Quando dados ômicos guiam decisão, então fármaco certo chega ao paciente certo na hora certa.", en: "When omics data guides decision, the right drug reaches the right patient at the right time."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Painel genômico tumoral identifica:", en: "Tumor genomic panel identifies:"}
        choices:
          - {pt: "Mutações acionáveis que orientam terapia-alvo", en: "Actionable mutations guiding targeted therapy"}
          - {pt: "Apenas idade do paciente", en: "Just patient age"}
          - {pt: "Apenas peso corporal", en: "Just body weight"}
          - {pt: "Apenas pressão sanguínea", en: "Just blood pressure"}
        correctAnswer: {pt: "Mutações acionáveis que orientam terapia-alvo", en: "Actionable mutations guiding targeted therapy"}
        rationale: {pt: "Quando alteração impulsiona tumor, então inibidor específico bloqueia via dependente.", en: "When alteration drives tumor, specific inhibitor blocks the addicted pathway."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Trastuzumabe é eficaz contra:", en: "Trastuzumab is effective against:"}
        choices:
          - {pt: "Câncer de mama com superexpressão de HER2", en: "Breast cancer with HER2 overexpression"}
          - {pt: "Apenas resfriado comum", en: "Just common cold"}
          - {pt: "Apenas alergia sazonal", en: "Just seasonal allergy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Câncer de mama com superexpressão de HER2", en: "Breast cancer with HER2 overexpression"}
        rationale: {pt: "Como anticorpo bloqueia receptor amplificado, então biomarcador HER2 prediz resposta.", en: "Because antibody blocks amplified receptor, HER2 biomarker predicts response."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Imatinibe revolucionou tratamento de:", en: "Imatinib revolutionized treatment of:"}
        choices:
          - {pt: "Leucemia mieloide crônica via inibição de BCR-ABL", en: "Chronic myeloid leukemia via BCR-ABL inhibition"}
          - {pt: "Apenas resfriado", en: "Just common cold"}
          - {pt: "Apenas alergia", en: "Just allergy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Leucemia mieloide crônica via inibição de BCR-ABL", en: "Chronic myeloid leukemia via BCR-ABL inhibition"}
        rationale: {pt: "Quando fusão Filadélfia gera oncoquinase, então inibidor de tirosina-cinase oferece controle durável.", en: "When Philadelphia fusion creates oncokinase, tyrosine kinase inhibitor offers durable control."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Biomarcador é:", en: "Biomarker is:"}
        choices:
          - {pt: "Característica medida que indica processo biológico, doença ou resposta", en: "Measured trait indicating biological process, disease or response"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas peso", en: "Just weight"}
          - {pt: "Apenas idade", en: "Just age"}
        correctAnswer: {pt: "Característica medida que indica processo biológico, doença ou resposta", en: "Measured trait indicating biological process, disease or response"}
        rationale: {pt: "Quando marcador correlaciona com desfecho, então clínico decide com base em evidência objetiva.", en: "When marker correlates with outcome, clinician decides on objective evidence."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Biópsia líquida detecta:", en: "Liquid biopsy detects:"}
        choices:
          - {pt: "DNA tumoral circulante (ctDNA) e células no sangue, evitando biópsia invasiva", en: "Circulating tumor DNA (ctDNA) and cells in blood, avoiding invasive biopsy"}
          - {pt: "Apenas urina", en: "Just urine"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pele", en: "Just skin"}
        correctAnswer: {pt: "DNA tumoral circulante (ctDNA) e células no sangue, evitando biópsia invasiva", en: "Circulating tumor DNA (ctDNA) and cells in blood, avoiding invasive biopsy"}
        rationale: {pt: "Quando tumor solta DNA, então monitoramos doença e resistência em tempo real.", en: "When tumor sheds DNA, we monitor disease and resistance in real time."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Farmacogenômica estuda:", en: "Pharmacogenomics studies:"}
        choices:
          - {pt: "Como variantes genéticas influenciam metabolismo e resposta a fármacos", en: "How genetic variants influence drug metabolism and response"}
          - {pt: "Apenas embalagem do remédio", en: "Just drug packaging"}
          - {pt: "Apenas marketing", en: "Just marketing"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Como variantes genéticas influenciam metabolismo e resposta a fármacos", en: "How genetic variants influence drug metabolism and response"}
        rationale: {pt: "Quando CYP450 varia, então mesma dose pode falhar ou intoxicar dependendo do genótipo.", en: "When CYP450 varies, same dose may fail or intoxicate depending on genotype."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Variantes em CYP2C19 afetam:", en: "CYP2C19 variants affect:"}
        choices:
          - {pt: "Ativação do clopidogrel — metabolizadores lentos respondem mal", en: "Clopidogrel activation — slow metabolizers respond poorly"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas peso corporal", en: "Just body weight"}
          - {pt: "Apenas humor", en: "Just mood"}
        correctAnswer: {pt: "Ativação do clopidogrel — metabolizadores lentos respondem mal", en: "Clopidogrel activation — slow metabolizers respond poorly"}
        rationale: {pt: "Como pró-fármaco precisa de ativação, então polimorfismo determina eficácia clínica.", en: "Because prodrug needs activation, polymorphism determines clinical efficacy."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "BRCA1/2 mutados aumentam risco de:", en: "BRCA1/2 mutations increase risk of:"}
        choices:
          - {pt: "Câncer de mama, ovário e outros — orienta vigilância e profilaxia", en: "Breast, ovarian and other cancers — guides surveillance and prophylaxis"}
          - {pt: "Apenas resfriado", en: "Just common cold"}
          - {pt: "Apenas dor de cabeça", en: "Just headache"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Câncer de mama, ovário e outros — orienta vigilância e profilaxia", en: "Breast, ovarian and other cancers — guides surveillance and prophylaxis"}
        rationale: {pt: "Quando reparo de DNA falha, então mama e ovário acumulam mutações e tumores surgem cedo.", en: "When DNA repair fails, breast and ovary accumulate mutations and tumors appear early."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Inibidores de PARP (olaparibe) atuam:", en: "PARP inhibitors (olaparib) act by:"}
        choices:
          - {pt: "Letalidade sintética em tumores BRCA-mutados deficientes em reparo", en: "Synthetic lethality in BRCA-mutated repair-deficient tumors"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas vacina", en: "Just vaccine"}
          - {pt: "Apenas placebo", en: "Just placebo"}
        correctAnswer: {pt: "Letalidade sintética em tumores BRCA-mutados deficientes em reparo", en: "Synthetic lethality in BRCA-mutated repair-deficient tumors"}
        rationale: {pt: "Quando duas vias de reparo são bloqueadas, então célula tumoral morre enquanto sadia sobrevive.", en: "When two repair pathways are blocked, tumor cell dies while healthy survives."}
        objectives: [biology.precision_medicine]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Implementação clínica", en: "Clinical implementation"}
    description: {pt: "Da bancada à beira do leito.", en: "From bench to bedside."}
    exercises:
      - type: choice
        question: {pt: "Tumor boards moleculares são:", en: "Molecular tumor boards are:"}
        choices:
          - {pt: "Reuniões multidisciplinares que interpretam ômicas e definem terapia personalizada", en: "Multidisciplinary meetings interpreting omics and defining personalized therapy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas administrativo", en: "Just administrative"}
          - {pt: "Apenas legal", en: "Just legal"}
        correctAnswer: {pt: "Reuniões multidisciplinares que interpretam ômicas e definem terapia personalizada", en: "Multidisciplinary meetings interpreting omics and defining personalized therapy"}
        rationale: {pt: "Quando experts integram dados, então decisão clínica é robusta e contextual.", en: "When experts integrate data, clinical decision is robust and contextual."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Terapia direcionada vs quimioterapia clássica:", en: "Targeted vs classic chemotherapy:"}
        choices:
          - {pt: "Mira proteína específica do tumor; quimio atinge células em divisão indiscriminadamente", en: "Hits specific tumor protein; chemo hits dividing cells indiscriminately"}
          - {pt: "Apenas idênticas", en: "Just identical"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em laboratório", en: "Just in lab"}
        correctAnswer: {pt: "Mira proteína específica do tumor; quimio atinge células em divisão indiscriminadamente", en: "Hits specific tumor protein; chemo hits dividing cells indiscriminately"}
        rationale: {pt: "Como especificidade poupa tecido sadio, então toxicidade frequentemente é menor com alvo molecular.", en: "Because specificity spares healthy tissue, toxicity is often lower with molecular target."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Resistência a terapia-alvo surge por:", en: "Resistance to targeted therapy arises by:"}
        choices:
          - {pt: "Mutações secundárias, ativação de vias paralelas e heterogeneidade tumoral", en: "Secondary mutations, parallel pathway activation and tumor heterogeneity"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas dieta", en: "Just diet"}
          - {pt: "Apenas placebo", en: "Just placebo"}
        correctAnswer: {pt: "Mutações secundárias, ativação de vias paralelas e heterogeneidade tumoral", en: "Secondary mutations, parallel pathway activation and tumor heterogeneity"}
        rationale: {pt: "Quando subclones escapam, então combinações racionais ou novas gerações de inibidores são necessárias.", en: "When subclones escape, rational combinations or next-generation inhibitors are needed."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Mutational signature em câncer revela:", en: "Mutational signature in cancer reveals:"}
        choices:
          - {pt: "Padrão de mutações que indica origem (UV, tabaco, falha de reparo)", en: "Mutation pattern indicating origin (UV, tobacco, repair failure)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas idade", en: "Just age"}
          - {pt: "Apenas peso", en: "Just weight"}
        correctAnswer: {pt: "Padrão de mutações que indica origem (UV, tabaco, falha de reparo)", en: "Mutation pattern indicating origin (UV, tobacco, repair failure)"}
        rationale: {pt: "Quando assinaturas se distinguem, então etiologia tumoral guia prevenção e terapia.", en: "When signatures differ, tumor etiology guides prevention and therapy."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Polygenic risk score (PRS) prevê:", en: "Polygenic risk score (PRS) predicts:"}
        choices:
          - {pt: "Risco poligênico para doenças comuns combinando milhões de variantes", en: "Polygenic risk for common diseases combining millions of variants"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas peso", en: "Just weight"}
          - {pt: "Apenas resultado de exame único", en: "Just single test result"}
        correctAnswer: {pt: "Risco poligênico para doenças comuns combinando milhões de variantes", en: "Polygenic risk for common diseases combining millions of variants"}
        rationale: {pt: "Como cada variante contribui pouco, então soma estatística informa risco populacional.", en: "Because each variant contributes little, statistical sum informs population risk."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Terapia gênica para doenças raras (LSDs, hemofilia) está:", en: "Gene therapy for rare diseases (LSDs, hemophilia) is:"}
        choices:
          - {pt: "Aprovada em produtos como Zolgensma e Hemgenix", en: "Approved in products like Zolgensma and Hemgenix"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas teórica", en: "Just theoretical"}
          - {pt: "Apenas experimental sem aprovação", en: "Just experimental, unapproved"}
        correctAnswer: {pt: "Aprovada em produtos como Zolgensma e Hemgenix", en: "Approved in products like Zolgensma and Hemgenix"}
        rationale: {pt: "Quando causa monogênica é clara, então corrigir gene é caminho racional para cura.", en: "When monogenic cause is clear, fixing the gene is a rational path to cure."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Equidade em medicina de precisão exige:", en: "Equity in precision medicine requires:"}
        choices:
          - {pt: "Diversidade nos bancos de dados genômicos para servir todas as ancestralidades", en: "Diversity in genomic databases to serve all ancestries"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas inclusão simbólica", en: "Just symbolic inclusion"}
          - {pt: "Apenas dieta", en: "Just diet"}
        correctAnswer: {pt: "Diversidade nos bancos de dados genômicos para servir todas as ancestralidades", en: "Diversity in genomic databases to serve all ancestries"}
        rationale: {pt: "Quando dados ignoram populações, então PRS e biomarcadores performam pior nelas.", en: "When data ignores populations, PRS and biomarkers underperform in them."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Pediatria de precisão (recém-nascidos críticos):", en: "Precision pediatrics (critical newborns):"}
        choices:
          - {pt: "Sequenciamento rápido de genoma para diagnóstico em horas-dias", en: "Rapid whole-genome sequencing for diagnosis within hours-days"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas dieta", en: "Just diet"}
        correctAnswer: {pt: "Sequenciamento rápido de genoma para diagnóstico em horas-dias", en: "Rapid whole-genome sequencing for diagnosis within hours-days"}
        rationale: {pt: "Quando UTI neonatal precisa decisão rápida, então rWGS muda manejo e desfecho.", en: "When NICU needs fast decision, rWGS changes management and outcome."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Privacidade genômica é importante porque:", en: "Genomic privacy matters because:"}
        choices:
          - {pt: "DNA é identificador permanente que envolve familiares — exige consentimento e proteção", en: "DNA is permanent identifier involving relatives — requires consent and protection"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas burocrática", en: "Just bureaucratic"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "DNA é identificador permanente que envolve familiares — exige consentimento e proteção", en: "DNA is permanent identifier involving relatives — requires consent and protection"}
        rationale: {pt: "Como dado vaza informação familiar, então arcabouço legal robusto é essencial.", en: "Because data leaks family information, robust legal framework is essential."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Companion diagnostic é:", en: "Companion diagnostic is:"}
        choices:
          - {pt: "Teste validado para identificar pacientes que se beneficiarão de fármaco específico", en: "Validated test identifying patients who will benefit from a specific drug"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas placebo", en: "Just placebo"}
        correctAnswer: {pt: "Teste validado para identificar pacientes que se beneficiarão de fármaco específico", en: "Validated test identifying patients who will benefit from a specific drug"}
        rationale: {pt: "Como par fármaco-teste é regulado em conjunto, então prescrição direcionada se torna rotina.", en: "Because drug-test pair is co-regulated, targeted prescribing becomes routine."}
        objectives: [biology.precision_medicine]
        difficulty: 5
target: 20
