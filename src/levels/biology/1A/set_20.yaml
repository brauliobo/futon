pages:
  - pageNumber: 1
    title: {pt: "Revisão — primeira metade", en: "Review — first half"}
    description: {pt: "Sets 1-10 do 1A.", en: "Sets 1-10 of 1A."}
    exercises:
      - type: choice
        question: {pt: "AlphaFold revolucionou:", en: "AlphaFold revolutionized:"}
        choices:
          - {pt: "Predição de estruturas 3D de proteínas com alta precisão", en: "3D protein structure prediction with high accuracy"}
          - {pt: "Apenas microscopia", en: "Just microscopy"}
          - {pt: "Apenas síntese química", en: "Just chemical synthesis"}
          - {pt: "Apenas datação radiométrica", en: "Just radiometric dating"}
        correctAnswer: {pt: "Predição de estruturas 3D de proteínas com alta precisão", en: "3D protein structure prediction with high accuracy"}
        rationale: {pt: "Quando IA aprende dobramento, então estruturas viram acessíveis em escala global.", en: "When AI learns folding, structures become globally accessible."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Spillover zoonótico envolve:", en: "Zoonotic spillover involves:"}
        choices:
          - {pt: "Salto de patógeno de hospedeiro reservatório para humanos", en: "Pathogen jump from reservoir host to humans"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas humanos isolados", en: "Just isolated humans"}
          - {pt: "Apenas turismo", en: "Just tourism"}
