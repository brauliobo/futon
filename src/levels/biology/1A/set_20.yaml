        rationale: {pt: "Quando contato aumenta, então probabilidade de transmissão entre espécies sobe.", en: "When contact increases, cross-species transmission probability rises."}
        objectives: [biology.pandemic_prep]
        difficulty: 5
      - type: choice
        question: {pt: "Plasmídeos espalham resistência antibiótica via:", en: "Plasmids spread antibiotic resistance via:"}
        choices:
          - {pt: "Conjugação bacteriana entre células e espécies diferentes", en: "Bacterial conjugation between different cells and species"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas radiação solar", en: "Just solar radiation"}
          - {pt: "Apenas mutação espontânea isolada", en: "Just isolated spontaneous mutation"}
        correctAnswer: {pt: "Conjugação bacteriana entre células e espécies diferentes", en: "Bacterial conjugation between different cells and species"}
        rationale: {pt: "Quando elementos móveis cruzam barreiras taxonômicas, então AMR se dissemina horizontalmente.", en: "When mobile elements cross taxonomic barriers, AMR spreads horizontally."}
        objectives: [biology.amr]
        difficulty: 5
      - type: choice
        question: {pt: "Trastuzumabe atua em:", en: "Trastuzumab acts on:"}
        choices:
