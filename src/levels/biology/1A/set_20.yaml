      - type: choice
        question: {pt: "Fio condutor do nível 1A:", en: "1A level guiding thread:"}
        choices:
          - {pt: "Fronteiras da biologia integrando moléculas, organismos, sistemas e planeta", en: "Frontier biology integrating molecules, organisms, systems and planet"}
