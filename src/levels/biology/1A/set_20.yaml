          - {pt: "Apenas resfriado", en: "Just common cold"}
          - {pt: "Apenas alergia", en: "Just allergy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Câncer de mama com superexpressão de HER2", en: "Breast cancer with HER2 overexpression"}
        rationale: {pt: "Quando biomarcador é positivo, então anticorpo direcionado bloqueia receptor amplificado.", en: "When biomarker is positive, targeted antibody blocks amplified receptor."}
        objectives: [biology.precision_medicine]
        difficulty: 5
      - type: choice
        question: {pt: "Micorriza arbuscular:", en: "Arbuscular mycorrhiza:"}
        choices:
          - {pt: "Fungo Glomeromycota troca P/N por C com raízes — sustenta ~90% das plantas terrestres", en: "Glomeromycota fungus trades P/N for C with roots — sustains ~90% of land plants"}
