title:
  pt: "🤖 Inteligência artificial em biologia"
  en: "🤖 Artificial intelligence in biology"
level: '1A'
subject: biology
objectives: [biology.ai_biology]
difficulty: 5
authorNotes: "Deep learning em biologia, AlphaFold, design de proteínas, descoberta de fármacos, biologia generativa."
example:
  pt: "Ex.: sequência de proteína → AlphaFold → estrutura 3D prevista → função inferida → alvo terapêutico."
  en: "Ex.: protein sequence → AlphaFold → predicted 3D structure → inferred function → therapeutic target."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Predição estrutural e funcional", en: "Structural and functional prediction"}
    description: {pt: "IA para entender moléculas e sequências.", en: "AI to understand molecules and sequences."}
    exercises:
      - type: choice
        question: {pt: "AlphaFold 2 (DeepMind, 2020) revolucionou:", en: "AlphaFold 2 (DeepMind, 2020) revolutionized:"}
        choices:
          - {pt: "Predição de estrutura 3D de proteínas a partir da sequência com alta precisão", en: "3D protein structure prediction from sequence with high accuracy"}
          - {pt: "Apenas microscopia eletrônica", en: "Just electron microscopy"}
          - {pt: "Apenas síntese química clássica", en: "Just classical chemical synthesis"}
          - {pt: "Apenas datação radiométrica", en: "Just radiometric dating"}
        correctAnswer: {pt: "Predição de estrutura 3D de proteínas a partir da sequência com alta precisão", en: "3D protein structure prediction from sequence with high accuracy"}
        rationale: {pt: "Quando IA aprendeu de milhões de estruturas conhecidas, então o problema de 50 anos do dobramento foi praticamente resolvido.", en: "When AI learned from millions of known structures, the 50-year folding problem was practically solved."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Transformer em biologia (ESM, ProtBERT) trata:", en: "Transformers in biology (ESM, ProtBERT) treat:"}
        choices:
          - {pt: "Sequências biológicas como linguagem, aprendendo embeddings ricos", en: "Biological sequences as language, learning rich embeddings"}
          - {pt: "Apenas imagens", en: "Just images"}
          - {pt: "Apenas séries temporais clínicas", en: "Just clinical time series"}
          - {pt: "Apenas grafos de redes sociais", en: "Just social network graphs"}
        correctAnswer: {pt: "Sequências biológicas como linguagem, aprendendo embeddings ricos", en: "Biological sequences as language, learning rich embeddings"}
        rationale: {pt: "Como atenção captura dependências de longo alcance, então motivos funcionais emergem sem supervisão.", en: "Because attention captures long-range dependencies, functional motifs emerge unsupervised."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "AlphaFold-Multimer prevê:", en: "AlphaFold-Multimer predicts:"}
        choices:
          - {pt: "Estrutura de complexos proteína-proteína (montagens multiméricas)", en: "Protein-protein complex structure (multimeric assemblies)"}
          - {pt: "Apenas RNA isolado", en: "Just isolated RNA"}
          - {pt: "Apenas DNA linear", en: "Just linear DNA"}
          - {pt: "Apenas peptídeo curto", en: "Just short peptide"}
        correctAnswer: {pt: "Estrutura de complexos proteína-proteína (montagens multiméricas)", en: "Protein-protein complex structure (multimeric assemblies)"}
        rationale: {pt: "Quando interfaces de ligação são modeladas, então interactomas ganham resolução estrutural em escala.", en: "When binding interfaces are modeled, interactomes gain structural resolution at scale."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "RoseTTAFold (Baker) é:", en: "RoseTTAFold (Baker) is:"}
        choices:
          - {pt: "Modelo alternativo de predição estrutural com três pistas (1D, 2D, 3D)", en: "Alternative structure prediction model with three tracks (1D, 2D, 3D)"}
          - {pt: "Apenas síntese química", en: "Just chemical synthesis"}
          - {pt: "Apenas microscopia escolar", en: "Just school microscopy"}
          - {pt: "Apenas banco de dados", en: "Just database"}
        correctAnswer: {pt: "Modelo alternativo de predição estrutural com três pistas (1D, 2D, 3D)", en: "Alternative structure prediction model with three tracks (1D, 2D, 3D)"}
        rationale: {pt: "Como integra representações em paralelo, então prevê dobramento e interações simultaneamente.", en: "Because it integrates representations in parallel, it predicts folding and interactions together."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Design de novo de proteínas via IA permite:", en: "AI-driven de novo protein design allows:"}
        choices:
          - {pt: "Criar proteínas que não existem na natureza para função específica", en: "Create proteins not found in nature for specific function"}
          - {pt: "Apenas reproduzir proteínas idênticas", en: "Just reproduce identical proteins"}
          - {pt: "Apenas decoração estética", en: "Just aesthetic decoration"}
          - {pt: "Apenas observar passivamente", en: "Just observe passively"}
        correctAnswer: {pt: "Criar proteínas que não existem na natureza para função específica", en: "Create proteins not found in nature for specific function"}
        rationale: {pt: "Quando IA generativa explora espaço de sequência, então engenharia de função fica programável.", en: "When generative AI explores sequence space, function engineering becomes programmable."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "RFdiffusion (Baker) gera proteínas via:", en: "RFdiffusion (Baker) generates proteins via:"}
        choices:
          - {pt: "Modelo de difusão treinado para 'desfocar' até estrutura funcional", en: "Diffusion model trained to 'denoise' into functional structure"}
          - {pt: "Apenas mutação aleatória pura", en: "Just pure random mutation"}
          - {pt: "Apenas seleção natural lenta", en: "Just slow natural selection"}
          - {pt: "Apenas síntese química manual", en: "Just manual chemical synthesis"}
        correctAnswer: {pt: "Modelo de difusão treinado para 'desfocar' até estrutura funcional", en: "Diffusion model trained to 'denoise' into functional structure"}
        rationale: {pt: "Como gerativos aprendem distribuição de proteínas plausíveis, então amostras novas mantêm dobramento estável.", en: "Because generatives learn distribution of plausible proteins, new samples maintain stable folding."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Predição de função gênica com deep learning usa:", en: "Gene function prediction with deep learning uses:"}
        choices:
          - {pt: "Embeddings de sequência + redes treinadas em ontologias (GO)", en: "Sequence embeddings + networks trained on ontologies (GO)"}
          - {pt: "Apenas regras manuais", en: "Just manual rules"}
          - {pt: "Apenas classificação por tamanho", en: "Just size classification"}
          - {pt: "Apenas observação visual", en: "Just visual observation"}
        correctAnswer: {pt: "Embeddings de sequência + redes treinadas em ontologias (GO)", en: "Sequence embeddings + networks trained on ontologies (GO)"}
        rationale: {pt: "Quando representação aprende similaridade funcional, então transferência inferida ganha precisão.", en: "When representation learns functional similarity, inferred transfer gains precision."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Variant effect prediction (ex.: AlphaMissense) prevê:", en: "Variant effect prediction (e.g., AlphaMissense) predicts:"}
        choices:
          - {pt: "Patogenicidade de variantes missense em escala genômica", en: "Pathogenicity of missense variants at genomic scale"}
          - {pt: "Apenas idade do paciente", en: "Just patient age"}
          - {pt: "Apenas peso corporal", en: "Just body weight"}
          - {pt: "Apenas pressão arterial", en: "Just blood pressure"}
        correctAnswer: {pt: "Patogenicidade de variantes missense em escala genômica", en: "Pathogenicity of missense variants at genomic scale"}
        rationale: {pt: "Como IA integra conservação evolutiva e estrutura, então prioriza variantes clinicamente relevantes.", en: "Because AI integrates evolutionary conservation and structure, it prioritizes clinically relevant variants."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Single-cell foundation model (Geneformer, scGPT):", en: "Single-cell foundation model (Geneformer, scGPT):"}
        choices:
          - {pt: "Pré-treinado em milhões de células para transferência a tarefas diversas", en: "Pretrained on millions of cells for transfer to diverse tasks"}
          - {pt: "Apenas modelo lineal simples", en: "Just simple linear model"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas observação visual", en: "Just visual observation"}
        correctAnswer: {pt: "Pré-treinado em milhões de células para transferência a tarefas diversas", en: "Pretrained on millions of cells for transfer to diverse tasks"}
        rationale: {pt: "Quando representação celular é universal, então tarefas downstream poucos-shots tornam-se viáveis.", en: "When cell representation is universal, downstream few-shot tasks become feasible."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Modelo de difusão para imagens biológicas pode:", en: "Diffusion models for biological images can:"}
        choices:
          - {pt: "Sintetizar imagens realistas e aumentar dados de treino escassos", en: "Synthesize realistic images and augment scarce training data"}
          - {pt: "Apenas borrar imagem", en: "Just blur image"}
          - {pt: "Apenas dividir pixels", en: "Just divide pixels"}
          - {pt: "Apenas inverter cores", en: "Just invert colors"}
        correctAnswer: {pt: "Sintetizar imagens realistas e aumentar dados de treino escassos", en: "Synthesize realistic images and augment scarce training data"}
        rationale: {pt: "Como aprende distribuição de pixels biológicos, então gera dados sintéticos para regimes raros.", en: "Because it learns biological pixel distribution, it generates synthetic data for rare regimes."}
        objectives: [biology.ai_biology]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Aplicações clínicas e éticas", en: "Clinical and ethical applications"}
    description: {pt: "Da bancada à clínica e impactos sociais.", en: "From bench to clinic and social impact."}
    exercises:
      - type: choice
        question: {pt: "IA em descoberta de fármacos auxilia em:", en: "AI in drug discovery helps with:"}
        choices:
          - {pt: "Triagem virtual, design molecular e otimização de propriedades ADME", en: "Virtual screening, molecular design and ADME property optimization"}
          - {pt: "Apenas embalagem do produto", en: "Just product packaging"}
          - {pt: "Apenas distribuição logística", en: "Just logistic distribution"}
          - {pt: "Apenas marketing publicitário", en: "Just advertising marketing"}
        correctAnswer: {pt: "Triagem virtual, design molecular e otimização de propriedades ADME", en: "Virtual screening, molecular design and ADME property optimization"}
        rationale: {pt: "Quando bilhões de moléculas são avaliadas in silico, então laboratório foca em candidatos com maior chance.", en: "When billions of molecules are evaluated in silico, lab focuses on candidates with highest chance."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "IA em radiologia/patologia oferece:", en: "AI in radiology/pathology offers:"}
        choices:
          - {pt: "Detecção precoce de lesões e suporte à decisão clínica", en: "Early lesion detection and clinical decision support"}
          - {pt: "Apenas substituição completa do médico", en: "Just complete physician replacement"}
          - {pt: "Apenas embelezamento de laudos", en: "Just report beautification"}
          - {pt: "Apenas estatística descritiva simples", en: "Just simple descriptive statistics"}
        correctAnswer: {pt: "Detecção precoce de lesões e suporte à decisão clínica", en: "Early lesion detection and clinical decision support"}
        rationale: {pt: "Como modelos treinam em milhões de imagens, então captam padrões sutis que humanos podem perder.", en: "Because models train on millions of images, they catch subtle patterns humans may miss."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Modelos de fundação em genômica (Enformer, NT) preveem:", en: "Genomics foundation models (Enformer, NT) predict:"}
        choices:
          - {pt: "Atividade regulatória em sequências longas (expressão, acessibilidade)", en: "Regulatory activity in long sequences (expression, accessibility)"}
          - {pt: "Apenas sequência inversa", en: "Just reversed sequence"}
          - {pt: "Apenas tamanho do genoma", en: "Just genome size"}
          - {pt: "Apenas idade do organismo", en: "Just organism age"}
        correctAnswer: {pt: "Atividade regulatória em sequências longas (expressão, acessibilidade)", en: "Regulatory activity in long sequences (expression, accessibility)"}
        rationale: {pt: "Quando contexto distal é capturado, então enhancers e promotores são modelados em conjunto.", en: "When distal context is captured, enhancers and promoters are modeled jointly."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Vieses (bias) em IA biomédica surgem por:", en: "Biases in biomedical AI arise from:"}
        choices:
          - {pt: "Conjuntos de treino não representativos de populações diversas", en: "Training sets not representative of diverse populations"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas tamanho do modelo", en: "Just model size"}
          - {pt: "Apenas custo de hardware", en: "Just hardware cost"}
        correctAnswer: {pt: "Conjuntos de treino não representativos de populações diversas", en: "Training sets not representative of diverse populations"}
        rationale: {pt: "Quando dados ignoram subgrupos, então modelos performam pior e amplificam desigualdades.", en: "When data ignores subgroups, models perform worse and amplify inequalities."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Validação clínica de modelos de IA exige:", en: "Clinical validation of AI models requires:"}
        choices:
          - {pt: "Estudos prospectivos, comparação com padrão-ouro e regulação (FDA/ANVISA)", en: "Prospective studies, gold-standard comparison and regulation (FDA/ANVISA)"}
          - {pt: "Apenas demonstração em laboratório isolado", en: "Just demo in isolated lab"}
          - {pt: "Apenas autoavaliação do desenvolvedor", en: "Just developer self-evaluation"}
          - {pt: "Apenas opinião do usuário final", en: "Just end-user opinion"}
        correctAnswer: {pt: "Estudos prospectivos, comparação com padrão-ouro e regulação (FDA/ANVISA)", en: "Prospective studies, gold-standard comparison and regulation (FDA/ANVISA)"}
        rationale: {pt: "Como decisões clínicas afetam pacientes, então rigor regulatório é obrigatório.", en: "Because clinical decisions affect patients, regulatory rigor is mandatory."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Explicabilidade (XAI) em biologia importa porque:", en: "Explainability (XAI) in biology matters because:"}
        choices:
          - {pt: "Compreender previsões aumenta confiança e gera hipóteses biológicas testáveis", en: "Understanding predictions builds trust and generates testable biological hypotheses"}
          - {pt: "Apenas estética visual", en: "Just visual aesthetics"}
          - {pt: "Apenas marketing", en: "Just marketing"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Compreender previsões aumenta confiança e gera hipóteses biológicas testáveis", en: "Understanding predictions builds trust and generates testable biological hypotheses"}
        rationale: {pt: "Quando modelo aponta features importantes, então cientista valida em bancada com experimento.", en: "When model points to important features, scientist validates at the bench with experiment."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Aprendizado federado em saúde permite:", en: "Federated learning in health allows:"}
        choices:
          - {pt: "Treinar modelos em dados distribuídos sem centralizar informação sensível", en: "Train models on distributed data without centralizing sensitive info"}
          - {pt: "Apenas concentrar dados em um servidor", en: "Just centralize data in one server"}
          - {pt: "Apenas desativar criptografia", en: "Just disable encryption"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Treinar modelos em dados distribuídos sem centralizar informação sensível", en: "Train models on distributed data without centralizing sensitive info"}
        rationale: {pt: "Como privacidade é mantida, então hospitais colaboram preservando confidencialidade.", en: "Because privacy is maintained, hospitals collaborate preserving confidentiality."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Robôs autônomos de bancada (lab automation) com IA:", en: "Autonomous bench robots (lab automation) with AI:"}
        choices:
          - {pt: "Executam ciclos design-build-test-learn 24/7 acelerando descoberta", en: "Run design-build-test-learn cycles 24/7 accelerating discovery"}
          - {pt: "Apenas substituem decoração", en: "Just replace decoration"}
          - {pt: "Apenas aumentam papelada", en: "Just increase paperwork"}
          - {pt: "Apenas atrasam pesquisa", en: "Just delay research"}
        correctAnswer: {pt: "Executam ciclos design-build-test-learn 24/7 acelerando descoberta", en: "Run design-build-test-learn cycles 24/7 accelerating discovery"}
        rationale: {pt: "Quando IA fecha laço com automação, então hipóteses são testadas e refinadas em paralelo.", en: "When AI closes the loop with automation, hypotheses are tested and refined in parallel."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "IA em descoberta de antibióticos achou recentemente:", en: "AI in antibiotic discovery recently found:"}
        choices:
          - {pt: "Halicina e outras moléculas com ação contra bactérias multirresistentes", en: "Halicin and other molecules acting against multidrug-resistant bacteria"}
          - {pt: "Apenas peptídeo idêntico ao existente", en: "Just peptide identical to existing"}
          - {pt: "Apenas vitamina banal", en: "Just trivial vitamin"}
          - {pt: "Apenas mineral", en: "Just mineral"}
        correctAnswer: {pt: "Halicina e outras moléculas com ação contra bactérias multirresistentes", en: "Halicin and other molecules acting against multidrug-resistant bacteria"}
        rationale: {pt: "Como redes neurais buscam novidade estrutural, então classes não-óbvias surgem para alvos resistentes.", en: "Because neural nets seek structural novelty, non-obvious classes emerge for resistant targets."}
        objectives: [biology.ai_biology]
        difficulty: 5
      - type: choice
        question: {pt: "Riscos de IA generativa em biologia incluem:", en: "Generative AI risks in biology include:"}
        choices:
          - {pt: "Possível uso indevido para projetar patógenos ou toxinas — exige governança", en: "Potential misuse to design pathogens or toxins — requires governance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas inovação positiva sem risco", en: "Just positive innovation without risk"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Possível uso indevido para projetar patógenos ou toxinas — exige governança", en: "Potential misuse to design pathogens or toxins — requires governance"}
        rationale: {pt: "Quando capacidade dual-use cresce, então salvaguardas técnicas e legais tornam-se críticas.", en: "When dual-use capability grows, technical and legal safeguards become critical."}
        objectives: [biology.ai_biology]
        difficulty: 5
target: 20
