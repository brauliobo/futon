          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Avaliar qualidade ecológica via comunidades de peixes e invertebrados", en: "Assess ecological quality via fish and invertebrate communities"}
        rationale: {pt: "Quando indicadores são moleculares, então gestão ambiental fica padronizada e barata.", en: "When indicators are molecular, environmental management becomes standardized and cheap."}
        objectives: [biology.edna_biomonitoring]
