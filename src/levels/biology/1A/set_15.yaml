        correctAnswer: {pt: "Vetores de doença, patógenos zoonóticos e reservatórios silvestres", en: "Disease vectors, zoonotic pathogens and wild reservoirs"}
        rationale: {pt: "Quando rastreamos vida selvagem molecularmente, então vigilância One Health ganha resolução.", en: "When we molecularly track wildlife, One Health surveillance gains resolution."}
