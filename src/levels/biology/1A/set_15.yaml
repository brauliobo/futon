          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Detecta presença sem perturbar nem estressar populações vulneráveis", en: "Detects presence without disturbing or stressing vulnerable populations"}
        rationale: {pt: "Quando captura é arriscada, então eDNA salva esforço e bem-estar animal simultaneamente.", en: "When capture is risky, eDNA saves effort and animal welfare at once."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
