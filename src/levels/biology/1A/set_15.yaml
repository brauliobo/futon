title:
  pt: "💧 DNA ambiental e biomonitoramento"
  en: "💧 Environmental DNA and biomonitoring"
level: '1A'
subject: biology
objectives: [biology.edna_biomonitoring]
difficulty: 5
authorNotes: "eDNA, metabarcoding, biomonitoramento aquático e terrestre, conservação não-invasiva, espécies invasoras."
example:
  pt: "Ex.: amostra de água de rio → extração de DNA → metabarcoding → 50 espécies detectadas → biomonitoramento sem captura."
  en: "Ex.: river water sample → DNA extraction → metabarcoding → 50 species detected → biomonitoring without capture."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "eDNA e métodos", en: "eDNA and methods"}
    description: {pt: "Lendo biota a partir do ambiente.", en: "Reading biota from the environment."}
    exercises:
      - type: choice
        question: {pt: "DNA ambiental (eDNA) é:", en: "Environmental DNA (eDNA) is:"}
        choices:
          - {pt: "Material genético solto por organismos no ambiente (água, solo, ar)", en: "Genetic material shed by organisms into environment (water, soil, air)"}
          - {pt: "Apenas DNA fóssil antigo", en: "Just ancient fossil DNA"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas humanos", en: "Just humans"}
        correctAnswer: {pt: "Material genético solto por organismos no ambiente (água, solo, ar)", en: "Genetic material shed by organisms into environment (water, soil, air)"}
        rationale: {pt: "Como células se descamam e excretas contêm DNA, então amostra ambiental rastreia biota presente.", en: "Because cells slough and excreta contain DNA, environmental sample traces present biota."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "Metabarcoding usa:", en: "Metabarcoding uses:"}
        choices:
          - {pt: "Primers universais para amplificar gene marcador e sequenciar todas as espécies presentes", en: "Universal primers to amplify marker gene and sequence all species present"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas microscopia óptica", en: "Just optical microscopy"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Primers universais para amplificar gene marcador e sequenciar todas as espécies presentes", en: "Universal primers to amplify marker gene and sequence all species present"}
        rationale: {pt: "Quando lemos códigos de barras (16S, COI, rbcL), então comunidade inteira aparece em uma corrida.", en: "When we read barcodes (16S, COI, rbcL), the whole community appears in one run."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "Vantagens do eDNA incluem:", en: "eDNA advantages include:"}
        choices:
          - {pt: "Não-invasivo, sensível a espécies elusivas e raras, escalável", en: "Noninvasive, sensitive to elusive and rare species, scalable"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas captura física invasiva", en: "Just invasive physical capture"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Não-invasivo, sensível a espécies elusivas e raras, escalável", en: "Noninvasive, sensitive to elusive and rare species, scalable"}
        rationale: {pt: "Quando não precisamos avistar animal, então monitoramento cobre áreas e espécies de outra forma inacessíveis.", en: "When we don't need to spot the animal, monitoring covers otherwise inaccessible areas and species."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "Limitações do eDNA incluem:", en: "eDNA limitations include:"}
        choices:
          - {pt: "Inferência de abundância imprecisa, contaminação e degradação do DNA", en: "Imprecise abundance inference, contamination and DNA degradation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Inferência de abundância imprecisa, contaminação e degradação do DNA", en: "Imprecise abundance inference, contamination and DNA degradation"}
        rationale: {pt: "Como DNA persiste de forma variável, então quantificação direta exige cuidado experimental.", en: "Because DNA persists variably, direct quantification requires experimental care."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "qPCR específica em eDNA detecta:", en: "Species-specific qPCR in eDNA detects:"}
        choices:
          - {pt: "Espécie-alvo (ex.: invasora) com alta sensibilidade e quantificação", en: "Target species (e.g., invasive) with high sensitivity and quantification"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas comunidade total", en: "Just full community"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Espécie-alvo (ex.: invasora) com alta sensibilidade e quantificação", en: "Target species (e.g., invasive) with high sensitivity and quantificação"}
        rationale: {pt: "Quando primers são específicos, então alarme precoce de invasão biológica é possível.", en: "When primers are specific, early biological invasion alarm becomes possible."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "eDNA aéreo (airborne eDNA) detecta:", en: "Airborne eDNA detects:"}
        choices:
          - {pt: "Vertebrados terrestres pelo ar dentro de ambientes (ex.: zoológicos, florestas)", en: "Terrestrial vertebrates from air within environments (e.g., zoos, forests)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas peixes", en: "Just fish"}
        correctAnswer: {pt: "Vertebrados terrestres pelo ar dentro de ambientes (ex.: zoológicos, florestas)", en: "Terrestrial vertebrates from air within environments (e.g., zoos, forests)"}
        rationale: {pt: "Quando pelos e células flutuam, então DNA é capturado em filtros e identificado.", en: "When fur and cells float, DNA is captured on filters and identified."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "eDNA do solo é útil para:", en: "Soil eDNA is useful for:"}
        choices:
          - {pt: "Inventariar fungos, microbiota e raízes em ecossistemas terrestres", en: "Survey fungi, microbiota and roots in terrestrial ecosystems"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas peixes", en: "Just fish"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Inventariar fungos, microbiota e raízes em ecossistemas terrestres", en: "Survey fungi, microbiota and roots in terrestrial ecosystems"}
        rationale: {pt: "Quando solo é amostrado, então diversidade subterrânea oculta vem à luz.", en: "When soil is sampled, hidden underground diversity comes to light."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "Bibliotecas de referência (BOLD, NCBI):", en: "Reference libraries (BOLD, NCBI):"}
        choices:
          - {pt: "Bancos de dados que ligam sequências a espécies — críticos para identificação", en: "Databases linking sequences to species — critical for identification"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Bancos de dados que ligam sequências a espécies — críticos para identificação", en: "Databases linking sequences to species — critical for identification"}
        rationale: {pt: "Quando referência falta, então sequência fica órfã sem identificação confiável.", en: "When reference is missing, sequence stays orphaned without reliable identification."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "Sequenciamento de leituras longas (Nanopore) em eDNA permite:", en: "Long-read sequencing (Nanopore) in eDNA allows:"}
        choices:
          - {pt: "Identificação no campo em tempo real com equipamento portátil", en: "Real-time field identification with portable equipment"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em laboratório complexo", en: "Just in complex lab"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Identificação no campo em tempo real com equipamento portátil", en: "Real-time field identification with portable equipment"}
        rationale: {pt: "Quando MinION roda em barco ou campo, então decisões de manejo ficam imediatas.", en: "When MinION runs on boat or field, management decisions become immediate."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "Bioinformática em eDNA exige:", en: "eDNA bioinformatics requires:"}
        choices:
          - {pt: "Pipelines de qualidade, deduplicação, atribuição taxonômica e estatística robusta", en: "Quality pipelines, deduplication, taxonomic assignment and robust statistics"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas planilha simples", en: "Just simple spreadsheet"}
        correctAnswer: {pt: "Pipelines de qualidade, deduplicação, atribuição taxonômica e estatística robusta", en: "Quality pipelines, deduplication, taxonomic assignment and robust statistics"}
        rationale: {pt: "Quando dados são massivos e ruidosos, então análise rigorosa separa sinal de artefato.", en: "When data is massive and noisy, rigorous analysis separates signal from artifact."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Aplicações em conservação e gestão", en: "Applications in conservation and management"}
    description: {pt: "Como eDNA muda decisões.", en: "How eDNA changes decisions."}
    exercises:
      - type: choice
        question: {pt: "Detecção precoce de invasoras com eDNA:", en: "Early invasive detection with eDNA:"}
        choices:
          - {pt: "Permite resposta rápida antes do estabelecimento populacional", en: "Allows rapid response before population establishment"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Permite resposta rápida antes do estabelecimento populacional", en: "Allows rapid response before population establishment"}
        rationale: {pt: "Quando alerta vem cedo, então erradicação custa menos e protege ecossistemas nativos.", en: "When alert comes early, eradication costs less and protects native ecosystems."}
        objectives: [biology.edna_biomonitoring]
        difficulty: 5
      - type: choice
        question: {pt: "Monitoramento de espécies ameaçadas com eDNA:", en: "Threatened species monitoring with eDNA:"}
        choices:
          - {pt: "Detecta presença sem perturbar nem estressar populações vulneráveis", en: "Detects presence without disturbing or stressing vulnerable populations"}
