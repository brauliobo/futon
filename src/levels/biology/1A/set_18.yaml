          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Interdisciplinaridade, dados longitudinais e parcerias com comunidades afetadas", en: "Interdisciplinarity, longitudinal data and partnerships with affected communities"}
