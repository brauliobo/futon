title:
  pt: "🌡️ Mudança climática e saúde"
  en: "🌡️ Climate change and health"
level: '1A'
subject: biology
objectives: [biology.climate_health]
difficulty: 5
authorNotes: "Impactos do clima na saúde humana, doenças vetoriais, ondas de calor, eventos extremos, mitigação."
example:
  pt: "Ex.: aquecimento → mosquitos expandem altitude → dengue em região nova → surtos → sistema de saúde sobrecarregado."
  en: "Ex.: warming → mosquitoes expand altitude → dengue in new region → outbreaks → overwhelmed health system."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Impactos diretos e indiretos", en: "Direct and indirect impacts"}
    description: {pt: "Como o clima afeta corpos e populações.", en: "How climate affects bodies and populations."}
    exercises:
      - type: choice
        question: {pt: "Mudança climática afeta saúde por:", en: "Climate change affects health via:"}
        choices:
          - {pt: "Calor extremo, qualidade do ar, doenças vetoriais e segurança alimentar/hídrica", en: "Extreme heat, air quality, vector-borne diseases and food/water security"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Calor extremo, qualidade do ar, doenças vetoriais e segurança alimentar/hídrica", en: "Extreme heat, air quality, vector-borne diseases and food/water security"}
        rationale: {pt: "Quando ambiente muda, então pressões somam-se sobre populações vulneráveis primeiro.", en: "When environment shifts, pressures stack on vulnerable populations first."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Ondas de calor causam:", en: "Heatwaves cause:"}
        choices:
          - {pt: "Aumento de morbimortalidade cardiovascular, renal e por golpe de calor", en: "Increased cardiovascular, renal and heatstroke morbimortality"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas conforto", en: "Just comfort"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Aumento de morbimortalidade cardiovascular, renal e por golpe de calor", en: "Increased cardiovascular, renal and heatstroke morbimortality"}
        rationale: {pt: "Quando termorregulação falha, então idosos e crônicos têm risco de morte multiplicado.", en: "When thermoregulation fails, elderly and chronically ill have multiplied death risk."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Doenças vetoriais sensíveis ao clima incluem:", en: "Climate-sensitive vector-borne diseases include:"}
        choices:
          - {pt: "Dengue, malária, zika, chikungunya, leishmaniose e doenças por carrapato", en: "Dengue, malaria, zika, chikungunya, leishmaniasis and tick-borne diseases"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas resfriado", en: "Just common cold"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Dengue, malária, zika, chikungunya, leishmaniose e doenças por carrapato", en: "Dengue, malaria, zika, chikungunya, leishmaniasis and tick-borne diseases"}
        rationale: {pt: "Quando temperatura e umidade favorecem vetores, então distribuição geográfica das doenças se expande.", en: "When temperature and humidity favor vectors, disease geographic distribution expands."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Aedes aegypti expande área de risco por:", en: "Aedes aegypti expands risk area via:"}
        choices:
          - {pt: "Aumento de temperatura permitindo reprodução em altitudes e latitudes maiores", en: "Temperature increase enabling reproduction at higher altitudes and latitudes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Aumento de temperatura permitindo reprodução em altitudes e latitudes maiores", en: "Temperature increase enabling reproduction at higher altitudes and latitudes"}
        rationale: {pt: "Quando ovos sobrevivem invernos mais brandos, então surtos surgem onde nunca houve.", en: "When eggs survive milder winters, outbreaks appear where they never had."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Poluição do ar relacionada ao clima causa:", en: "Climate-related air pollution causes:"}
        choices:
          - {pt: "Doenças respiratórias, cardiovasculares e milhões de mortes prematuras anuais", en: "Respiratory, cardiovascular diseases and millions of premature deaths yearly"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Doenças respiratórias, cardiovasculares e milhões de mortes prematuras anuais", en: "Respiratory, cardiovascular diseases and millions of premature deaths yearly"}
        rationale: {pt: "Quando PM2,5 e ozônio sobem, então saúde pulmonar e cardíaca degrada cumulativamente.", en: "When PM2.5 and ozone rise, lung and heart health degrade cumulatively."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Incêndios florestais (wildfires) liberam:", en: "Wildfires release:"}
        choices:
          - {pt: "Particulado fino e gases que causam efeitos respiratórios agudos e crônicos", en: "Fine particulate and gases causing acute and chronic respiratory effects"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Particulado fino e gases que causam efeitos respiratórios agudos e crônicos", en: "Fine particulate and gases causing acute and chronic respiratory effects"}
        rationale: {pt: "Quando fumaça atravessa cidades distantes, então saúde populacional inteira é impactada.", en: "When smoke crosses distant cities, whole-population health is impacted."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Eventos extremos (enchentes, secas) afetam saúde por:", en: "Extreme events (floods, droughts) affect health via:"}
        choices:
          - {pt: "Ferimentos, doenças hídricas, deslocamento e impactos em saúde mental", en: "Injuries, waterborne diseases, displacement and mental health impacts"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Ferimentos, doenças hídricas, deslocamento e impactos em saúde mental", en: "Injuries, waterborne diseases, displacement and mental health impacts"}
        rationale: {pt: "Quando comunidades são deslocadas, então trauma e infraestrutura sanitária ficam comprometidos.", en: "When communities are displaced, trauma and sanitary infrastructure are compromised."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Insegurança alimentar relacionada ao clima:", en: "Climate-related food insecurity:"}
        choices:
          - {pt: "Quedas em produção agrícola e pesqueira, com riscos de desnutrição em populações pobres", en: "Drops in agricultural and fishery yield, with malnutrition risk in poor populations"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Quedas em produção agrícola e pesqueira, com riscos de desnutrição em populações pobres", en: "Drops in agricultural and fishery yield, with malnutrition risk in poor populations"}
        rationale: {pt: "Quando colheita falha, então preços sobem e quem está na ponta sofre primeiro.", en: "When harvest fails, prices rise and those at the bottom suffer first."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Doenças hídricas (cólera, criptosporidiose) aumentam com:", en: "Waterborne diseases (cholera, cryptosporidiosis) increase with:"}
        choices:
          - {pt: "Eventos pluviais extremos contaminando água potável", en: "Extreme rainfall events contaminating drinking water"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Eventos pluviais extremos contaminando água potável", en: "Extreme rainfall events contaminating drinking water"}
        rationale: {pt: "Quando saneamento é fraco, então enchente espalha patógenos rapidamente.", en: "When sanitation is weak, flooding spreads pathogens rapidly."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Saúde mental e mudança climática:", en: "Mental health and climate change:"}
        choices:
          - {pt: "Estresse, ansiedade climática, luto ecológico e PTSD pós-desastres aumentam", en: "Stress, climate anxiety, ecological grief and post-disaster PTSD increase"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Estresse, ansiedade climática, luto ecológico e PTSD pós-desastres aumentam", en: "Stress, climate anxiety, ecological grief and post-disaster PTSD increase"}
        rationale: {pt: "Quando perdas se acumulam, então saúde mental coletiva precisa de cuidado e linguagem.", en: "When losses accumulate, collective mental health needs care and language."}
        objectives: [biology.climate_health]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Mitigação, adaptação e equidade", en: "Mitigation, adaptation and equity"}
    description: {pt: "Como sistemas de saúde respondem.", en: "How health systems respond."}
    exercises:
      - type: choice
        question: {pt: "Co-benefícios climáticos para saúde incluem:", en: "Climate co-benefits for health include:"}
        choices:
          - {pt: "Mobilidade ativa, dietas plant-forward e energia limpa reduzindo doenças não-transmissíveis", en: "Active mobility, plant-forward diets and clean energy reducing noncommunicable diseases"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Mobilidade ativa, dietas plant-forward e energia limpa reduzindo doenças não-transmissíveis", en: "Active mobility, plant-forward diets and clean energy reducing noncommunicable diseases"}
        rationale: {pt: "Quando mitigação alinha-se com prevenção, então clima e saúde melhoram em conjunto.", en: "When mitigation aligns with prevention, climate and health improve together."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Cidades e ondas de calor adaptam-se via:", en: "Cities and heatwaves adapt via:"}
        choices:
          - {pt: "Áreas verdes, telhados frios, sistemas de alerta e refúgios climatizados", en: "Green areas, cool roofs, alert systems and climatized refuges"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Áreas verdes, telhados frios, sistemas de alerta e refúgios climatizados", en: "Green areas, cool roofs, alert systems and climatized refuges"}
        rationale: {pt: "Quando infraestrutura urbana adapta, então mortes por calor podem ser evitadas em massa.", en: "When urban infrastructure adapts, heat deaths can be massively prevented."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Vigilância sentinela climática inclui:", en: "Climate sentinel surveillance includes:"}
        choices:
          - {pt: "Monitorar vetores, doenças, qualidade do ar e sinais epidemiológicos precoces", en: "Monitor vectors, diseases, air quality and early epidemiological signals"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Monitorar vetores, doenças, qualidade do ar e sinais epidemiológicos precoces", en: "Monitor vectors, diseases, air quality and early epidemiological signals"}
        rationale: {pt: "Quando alerta é precoce, então resposta de saúde pública pode mitigar surtos.", en: "When warning is early, public health response can mitigate outbreaks."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Equidade climática reconhece que:", en: "Climate equity recognizes that:"}
        choices:
          - {pt: "Quem polui menos sofre mais — exige justiça intergeracional e global", en: "Those polluting less suffer more — requires intergenerational and global justice"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Quem polui menos sofre mais — exige justiça intergeracional e global", en: "Those polluting less suffer more — requires intergenerational and global justice"}
        rationale: {pt: "Quando responsabilidade e impacto se desconectam, então políticas precisam reequilibrar a equação.", en: "When responsibility and impact diverge, policies need to rebalance the equation."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Saúde planetária (Planetary Health) propõe:", en: "Planetary Health proposes:"}
        choices:
          - {pt: "Saúde humana depende de sistemas naturais; protegê-los é proteger pessoas", en: "Human health depends on natural systems; protecting them protects people"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Saúde humana depende de sistemas naturais; protegê-los é proteger pessoas", en: "Human health depends on natural systems; protecting them protects people"}
        rationale: {pt: "Quando integramos disciplinas, então saúde global é vista como resultado ecológico.", en: "When we integrate disciplines, global health is seen as ecological outcome."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Sistemas de saúde resilientes ao clima:", en: "Climate-resilient health systems:"}
        choices:
          - {pt: "Têm infraestrutura, suprimentos e força de trabalho preparada para choques", en: "Have infrastructure, supplies and workforce prepared for shocks"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Têm infraestrutura, suprimentos e força de trabalho preparada para choques", en: "Have infrastructure, supplies and workforce prepared for shocks"}
        rationale: {pt: "Quando hospital resiste a enchente e blackout, então cuidado continua mesmo em crise.", en: "When hospital withstands flood and blackout, care continues even in crisis."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Migração climática deve ser tratada com:", en: "Climate migration should be addressed with:"}
        choices:
          - {pt: "Direitos humanos, saúde, integração social e cooperação internacional", en: "Human rights, health, social integration and international cooperation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Direitos humanos, saúde, integração social e cooperação internacional", en: "Human rights, health, social integration and international cooperation"}
        rationale: {pt: "Quando deslocamento é massivo, então solução é coletiva e sistêmica, não individual.", en: "When displacement is massive, solution is collective and systemic, not individual."}
        objectives: [biology.climate_health]
