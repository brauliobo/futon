      - type: choice
        question: {pt: "Lancet Countdown monitora:", en: "Lancet Countdown monitors:"}
        choices:
          - {pt: "Indicadores anuais de saúde e mudança climática para informar políticas globais", en: "Annual health and climate change indicators to inform global policy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Indicadores anuais de saúde e mudança climática para informar políticas globais", en: "Annual health and climate change indicators to inform global policy"}
        rationale: {pt: "Quando dados consolidados são publicados, então tomadores de decisão têm bússola atualizada.", en: "When consolidated data is published, decision-makers have an updated compass."}
        objectives: [biology.climate_health]
        difficulty: 5
      - type: choice
        question: {pt: "Educação em saúde e clima deve:", en: "Health and climate education should:"}
        choices:
          - {pt: "Integrar currículos de medicina, biologia e saúde pública na próxima década", en: "Integrate medicine, biology and public health curricula over the next decade"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
