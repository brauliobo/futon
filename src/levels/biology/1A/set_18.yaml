        difficulty: 5
      - type: choice
        question: {pt: "Pesquisa em clima-saúde precisa:", en: "Climate-health research needs:"}
        choices:
          - {pt: "Interdisciplinaridade, dados longitudinais e parcerias com comunidades afetadas", en: "Interdisciplinarity, longitudinal data and partnerships with affected communities"}
