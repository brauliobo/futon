title:
  pt: "👻 Viroma e vírus gigantes"
  en: "👻 Virome and giant viruses"
level: '1A'
subject: biology
objectives: [biology.virome]
difficulty: 5
authorNotes: "Diversidade viral ambiental, viroma humano, vírus gigantes, fagos, evolução viral."
example:
  pt: "Ex.: amostra ambiental → metagenômica viral → bilhões de fagos detectados → impacto em ciclos biogeoquímicos."
  en: "Ex.: environmental sample → viral metagenomics → billions of phages detected → biogeochemical cycle impact."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Diversidade e impacto", en: "Diversity and impact"}
    description: {pt: "Vírus como entidades biológicas dominantes.", en: "Viruses as dominant biological entities."}
    exercises:
      - type: choice
        question: {pt: "Vírus na Terra somam aproximadamente:", en: "Viruses on Earth total approximately:"}
        choices:
          - {pt: "10³¹ partículas — mais que estrelas no universo observável", en: "10³¹ particles — more than stars in the observable universe"}
          - {pt: "Apenas mil", en: "Just a thousand"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas humanos", en: "Just humans"}
        correctAnswer: {pt: "10³¹ partículas — mais que estrelas no universo observável", en: "10³¹ particles — more than stars in the observable universe"}
        rationale: {pt: "Como abundância é colossal, então vírus são entidades biológicas mais comuns do planeta.", en: "Because abundance is colossal, viruses are the planet's most common biological entities."}
        objectives: [biology.virome]
        difficulty: 5
      - type: choice
        question: {pt: "Viroma humano inclui:", en: "Human virome includes:"}
        choices:
          - {pt: "Vírus eucariontes, fagos comensais e elementos virais endógenos", en: "Eukaryotic viruses, commensal phages and endogenous viral elements"}
          - {pt: "Apenas patógenos virulentos", en: "Just virulent pathogens"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Vírus eucariontes, fagos comensais e elementos virais endógenos", en: "Eukaryotic viruses, commensal phages and endogenous viral elements"}
        rationale: {pt: "Quando classificamos amplamente, então maior parte do viroma humano é não-patogênica.", en: "When we classify broadly, most of the human virome is non-pathogenic."}
        objectives: [biology.virome]
        difficulty: 5
      - type: choice
        question: {pt: "Bacteriófagos no oceano:", en: "Bacteriophages in the ocean:"}
        choices:
          - {pt: "Matam ~20% dos micróbios marinhos por dia, regulando ciclos de C e N", en: "Kill ~20% of marine microbes daily, regulating C and N cycles"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Matam ~20% dos micróbios marinhos por dia, regulando ciclos de C e N", en: "Kill ~20% of marine microbes daily, regulating C and N cycles"}
        rationale: {pt: "Quando lise massiva ocorre, então 'shunt viral' libera nutrientes solúveis para outros micróbios.", en: "When massive lysis occurs, 'viral shunt' releases soluble nutrients for other microbes."}
        objectives: [biology.virome]
        difficulty: 5
      - type: choice
        question: {pt: "Vírus gigantes (NCLDV, Mimivirus, Pandoravirus):", en: "Giant viruses (NCLDV, Mimivirus, Pandoravirus):"}
        choices:
          - {pt: "Têm genomas grandes e complexos rivalizando com bactérias pequenas", en: "Have large complex genomes rivaling small bacteria"}
          - {pt: "Apenas vírus minúsculos", en: "Just tiny viruses"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Têm genomas grandes e complexos rivalizando com bactérias pequenas", en: "Have large complex genomes rivaling small bacteria"}
        rationale: {pt: "Quando descobrimos genes inesperados, então fronteira vírus/célula fica menos nítida.", en: "When we discover unexpected genes, the virus/cell boundary blurs."}
        objectives: [biology.virome]
        difficulty: 5
      - type: choice
        question: {pt: "Mimivirus foi inicialmente confundido com:", en: "Mimivirus was initially confused with:"}
        choices:
          - {pt: "Bactéria — visível em microscopia óptica e Gram-positivo", en: "A bacterium — visible in optical microscopy and Gram-positive"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas planta", en: "Just plant"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Bactéria — visível em microscopia óptica e Gram-positivo", en: "A bacterium — visible in optical microscopy and Gram-positive"}
        rationale: {pt: "Quando tamanho excede limite viral clássico, então classificação inicial errou — uma surpresa biológica.", en: "When size exceeds classical viral limit, initial classification was wrong — a biological surprise."}
        objectives: [biology.virome]
        difficulty: 5
      - type: choice
        question: {pt: "Virófagos são:", en: "Virophages are:"}
        choices:
          - {pt: "Vírus que parasitam outros vírus (Mimivirus) — competição viral", en: "Viruses that parasitize other viruses (Mimivirus) — viral competition"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas bactérias", en: "Just bacteria"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Vírus que parasitam outros vírus (Mimivirus) — competição viral", en: "Viruses that parasitize other viruses (Mimivirus) — viral competition"}
        rationale: {pt: "Quando viróforo replica usando maquinaria viral, então hierarquia ecológica viral é revelada.", en: "When virophage replicates using viral machinery, viral ecological hierarchy is revealed."}
        objectives: [biology.virome]
        difficulty: 5
      - type: choice
        question: {pt: "Crispátrico de retrovirus endógenos (ERVs):", en: "Endogenous retroviruses (ERVs):"}
        choices:
          - {pt: "Compõem ~8% do genoma humano e contribuem para regulação gênica", en: "Make up ~8% of the human genome and contribute to gene regulation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas decorativo", en: "Just decorative"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Compõem ~8% do genoma humano e contribuem para regulação gênica", en: "Make up ~8% of the human genome and contribute to gene regulation"}
        rationale: {pt: "Quando vírus integra na linhagem germinativa, então sequência viral antiga vira parte do hospedeiro.", en: "When virus integrates in germline, ancient viral sequence becomes part of the host."}
        objectives: [biology.virome]
        difficulty: 5
      - type: choice
        question: {pt: "Sincitina, derivada de retrovirus:", en: "Syncytin, derived from retrovirus:"}
        choices:
          - {pt: "É essencial para formação da placenta em mamíferos", en: "Is essential for placenta formation in mammals"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas patogênica", en: "Just pathogenic"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "É essencial para formação da placenta em mamíferos", en: "Is essential for placenta formation in mammals"}
        rationale: {pt: "Quando proteína de envelope viral é cooptada, então fusão de células trofoblásticas viabiliza placentação.", en: "When viral envelope protein is co-opted, trophoblast fusion enables placentation."}
        objectives: [biology.virome]
        difficulty: 5
      - type: choice
        question: {pt: "Viroma do solo influencia:", en: "Soil virome influences:"}
        choices:
          - {pt: "Ciclagem de nutrientes, diversidade microbiana e produtividade vegetal", en: "Nutrient cycling, microbial diversity and plant productivity"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Ciclagem de nutrientes, diversidade microbiana e produtividade vegetal", en: "Nutrient cycling, microbial diversity and plant productivity"}
        rationale: {pt: "Quando vírus controlam populações bacterianas, então ecossistemas terrestres mantêm equilíbrio.", en: "When viruses control bacterial populations, terrestrial ecosystems maintain balance."}
        objectives: [biology.virome]
        difficulty: 5
      - type: choice
        question: {pt: "RNA viroides em plantas são:", en: "Plant viroids are:"}
        choices:
          - {pt: "RNAs circulares pequenos sem capa proteica que causam doenças vegetais", en: "Small circular RNAs without protein coat causing plant diseases"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas vírus humanos", en: "Just human viruses"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "RNAs circulares pequenos sem capa proteica que causam doenças vegetais", en: "Small circular RNAs without protein coat causing plant diseases"}
        rationale: {pt: "Como replicam usando enzimas hospedeiras, então viroides são patógenos minimalistas extremos.", en: "Because they replicate via host enzymes, viroids are extreme minimalist pathogens."}
        objectives: [biology.virome]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Evolução, ecologia e aplicações", en: "Evolution, ecology and applications"}
    description: {pt: "Vírus como motores e ferramentas.", en: "Viruses as engines and tools."}
    exercises:
      - type: choice
        question: {pt: "Vírus dirigem evolução do hospedeiro por:", en: "Viruses drive host evolution via:"}
        choices:
