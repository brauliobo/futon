          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Pressão seletiva, transferência horizontal e cooptação de genes virais", en: "Selective pressure, horizontal transfer and co-option of viral genes"}
        rationale: {pt: "Quando vírus impõem custos, então sistemas imunes evoluem; quando contribuem genes, viram ferramentas.", en: "When viruses impose costs, immune systems evolve; when they contribute genes, they become tools."}
