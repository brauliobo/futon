title:
  pt: "🌾 Imunidade vegetal e agricultura sustentável"
  en: "🌾 Plant immunity and sustainable agriculture"
level: '1A'
subject: biology
objectives: [biology.plant_immunity]
difficulty: 5
authorNotes: "Defesa em plantas, PTI/ETI, melhoramento, edição genômica, segurança alimentar, agricultura regenerativa."
example:
  pt: "Ex.: patógeno → reconhecimento por PRR → PTI → efetores patogênicos → ETI/HR → resistência local."
  en: "Ex.: pathogen → PRR recognition → PTI → pathogen effectors → ETI/HR → local resistance."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Sistema imune das plantas", en: "Plant immune system"}
    description: {pt: "Como plantas se defendem sem células imunes móveis.", en: "How plants defend themselves without mobile immune cells."}
    exercises:
      - type: choice
        question: {pt: "Imunidade vegetal opera principalmente por:", en: "Plant immunity operates mainly via:"}
        choices:
          - {pt: "Imunidade celular autônoma — cada célula reconhece e responde", en: "Cell-autonomous immunity — each cell recognizes and responds"}
          - {pt: "Apenas anticorpos circulantes", en: "Just circulating antibodies"}
          - {pt: "Apenas linfócitos T", en: "Just T lymphocytes"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Imunidade celular autônoma — cada célula reconhece e responde", en: "Cell-autonomous immunity — each cell recognizes and responds"}
        rationale: {pt: "Quando não há células móveis, então cada célula precisa detectar e responder localmente.", en: "When there are no mobile cells, each cell must detect and respond locally."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "PTI (PAMP-triggered immunity) é:", en: "PTI (PAMP-triggered immunity) is:"}
        choices:
          - {pt: "Defesa basal disparada por reconhecimento de padrões microbianos via PRRs", en: "Basal defense triggered by pattern recognition via PRRs"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas resposta humoral animal", en: "Just animal humoral response"}
          - {pt: "Apenas dieta", en: "Just diet"}
        correctAnswer: {pt: "Defesa basal disparada por reconhecimento de padrões microbianos via PRRs", en: "Basal defense triggered by pattern recognition via PRRs"}
        rationale: {pt: "Como PRRs detectam flagelina e quitina, então primeira linha imune ativa em minutos.", en: "Because PRRs sense flagellin and chitin, first immune line activates within minutes."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "ETI (effector-triggered immunity) ocorre quando:", en: "ETI (effector-triggered immunity) occurs when:"}
        choices:
          - {pt: "Proteínas R reconhecem efetores patogênicos, frequentemente disparando HR", en: "R proteins recognize pathogen effectors, often triggering HR"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em mamíferos", en: "Just in mammals"}
          - {pt: "Apenas dieta", en: "Just diet"}
        correctAnswer: {pt: "Proteínas R reconhecem efetores patogênicos, frequentemente disparando HR", en: "R proteins recognize pathogen effectors, often triggering HR"}
        rationale: {pt: "Quando patógeno tenta evadir PTI com efetores, então NLRs detectam e ETI bloqueia infecção.", en: "When pathogen evades PTI with effectors, NLRs detect and ETI halts infection."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Resposta hipersensitiva (HR) caracteriza-se por:", en: "Hypersensitive response (HR) is characterized by:"}
        choices:
          - {pt: "Morte celular programada local que isola o patógeno", en: "Local programmed cell death that isolates the pathogen"}
          - {pt: "Apenas crescimento extra", en: "Just extra growth"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Morte celular programada local que isola o patógeno", en: "Local programmed cell death that isolates the pathogen"}
        rationale: {pt: "Como células sacrificam-se, então patógeno biotrófico fica sem hospedeiro vivo.", en: "Because cells sacrifice themselves, biotrophic pathogen runs out of living host."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Proteínas NLR (NB-LRR) são:", en: "NLR (NB-LRR) proteins are:"}
        choices:
          - {pt: "Receptores intracelulares que reconhecem efetores diretamente ou via guarda", en: "Intracellular receptors recognizing effectors directly or via guard"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas anticorpos", en: "Just antibodies"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Receptores intracelulares que reconhecem efetores diretamente ou via guarda", en: "Intracellular receptors recognizing effectors directly or via guard"}
        rationale: {pt: "Quando efetor altera proteína guardada, então NLR detecta e dispara defesa robusta.", en: "When effector alters guarded protein, NLR detects and triggers robust defense."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Resistência sistêmica adquirida (SAR):", en: "Systemic acquired resistance (SAR):"}
        choices:
          - {pt: "Imunidade durável em toda a planta após infecção localizada, mediada por SA", en: "Durable plantwide immunity after local infection, mediated by SA"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas efeito local pequeno", en: "Just small local effect"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Imunidade durável em toda a planta após infecção localizada, mediada por SA", en: "Durable plantwide immunity after local infection, mediated by SA"}
        rationale: {pt: "Quando salicilato sinaliza ao resto, então tecidos distantes ficam preparados contra novo ataque.", en: "When salicylate signals the rest, distant tissues are primed against further attack."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Resistência sistêmica induzida (ISR) é mediada por:", en: "Induced systemic resistance (ISR) is mediated by:"}
        choices:
          - {pt: "Microbiota benéfica do solo via vias de jasmonato e etileno", en: "Beneficial soil microbiota via jasmonate and ethylene pathways"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas patógenos virais", en: "Just viral pathogens"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Microbiota benéfica do solo via vias de jasmonato e etileno", en: "Beneficial soil microbiota via jasmonate and ethylene pathways"}
        rationale: {pt: "Quando rizobactérias colonizam raízes, então plantas inteiras ficam mais resistentes a herbívoros.", en: "When rhizobacteria colonize roots, whole plants become more resistant to herbivores."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Gene-for-gene de Flor descreve:", en: "Flor's gene-for-gene describes:"}
        choices:
          - {pt: "Cada gene de avirulência do patógeno corresponde a um gene R da planta", en: "Each pathogen avirulence gene corresponds to a plant R gene"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas reprodução", en: "Just reproduction"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Cada gene de avirulência do patógeno corresponde a um gene R da planta", en: "Each pathogen avirulence gene corresponds to a plant R gene"}
        rationale: {pt: "Quando há reconhecimento específico, então resistência é dominante e durável até evolução do patógeno.", en: "When specific recognition exists, resistance is dominant and durable until pathogen evolves."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "RNA interference em plantas defende contra:", en: "RNA interference in plants defends against:"}
        choices:
          - {pt: "Vírus, via siRNAs que silenciam RNA viral por homologia", en: "Viruses, via siRNAs silencing viral RNA by homology"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas predadores", en: "Just predators"}
          - {pt: "Apenas frio", en: "Just cold"}
        correctAnswer: {pt: "Vírus, via siRNAs que silenciam RNA viral por homologia", en: "Viruses, via siRNAs silencing viral RNA by homology"}
        rationale: {pt: "Quando dsRNA viral é processado em siRNAs, então célula 'lembra' e silencia infecções similares.", en: "When viral dsRNA is processed into siRNAs, cell 'remembers' and silences similar infections."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Defesas químicas constitutivas incluem:", en: "Constitutive chemical defenses include:"}
        choices:
          - {pt: "Metabolitos secundários (alcaloides, terpenos, fenólicos) tóxicos a herbívoros", en: "Secondary metabolites (alkaloids, terpenes, phenolics) toxic to herbivores"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Metabolitos secundários (alcaloides, terpenos, fenólicos) tóxicos a herbívoros", en: "Secondary metabolites (alkaloids, terpenes, phenolics) toxic to herbivores"}
        rationale: {pt: "Quando metabolitos repelem ou intoxicam, então planta sobrevive sem precisar fugir ativamente.", en: "When metabolites repel or intoxicate, plant survives without active escape."}
        objectives: [biology.plant_immunity]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Agricultura e segurança alimentar", en: "Agriculture and food security"}
    description: {pt: "Aplicar imunidade vegetal para alimentar o mundo.", en: "Applying plant immunity to feed the world."}
    exercises:
      - type: choice
        question: {pt: "Melhoramento por resistência usa:", en: "Resistance breeding uses:"}
        choices:
          - {pt: "Cruzamentos para introgredir genes R em variedades comerciais", en: "Crosses to introgress R genes into commercial varieties"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pesticidas", en: "Just pesticides"}
          - {pt: "Apenas irrigação", en: "Just irrigation"}
        correctAnswer: {pt: "Cruzamentos para introgredir genes R em variedades comerciais", en: "Crosses to introgress R genes into commercial varieties"}
        rationale: {pt: "Como variedades elite carecem de resistência, então transferência de genes salva safras.", en: "Because elite varieties lack resistance, gene transfer saves harvests."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Plantas Bt expressam:", en: "Bt plants express:"}
        choices:
          - {pt: "Toxinas Cry de Bacillus thuringiensis que matam insetos-praga", en: "Cry toxins from Bacillus thuringiensis that kill insect pests"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas vitamina", en: "Just vitamin"}
          - {pt: "Apenas pigmento", en: "Just pigment"}
        correctAnswer: {pt: "Toxinas Cry de Bacillus thuringiensis que matam insetos-praga", en: "Cry toxins from Bacillus thuringiensis that kill insect pests"}
        rationale: {pt: "Como Cry rompe intestino do inseto, então planta defende-se sem inseticida externo.", en: "Because Cry disrupts insect gut, plant defends itself without external insecticide."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "CRISPR em culturas permite:", en: "CRISPR in crops allows:"}
        choices:
          - {pt: "Edições precisas que removem genes de suscetibilidade ou ativam resistência", en: "Precise edits removing susceptibility genes or activating resistance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Edições precisas que removem genes de suscetibilidade ou ativam resistência", en: "Precise edits removing susceptibility genes or activating resistance"}
        rationale: {pt: "Quando alteramos genes-alvo, então variedades resistentes são geradas em uma geração.", en: "When we alter target genes, resistant varieties are generated in one generation."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Manejo integrado de pragas (MIP) combina:", en: "Integrated pest management (IPM) combines:"}
        choices:
          - {pt: "Controle biológico, cultural, físico e químico de forma equilibrada", en: "Biological, cultural, physical and chemical control in balanced way"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pesticidas", en: "Just pesticides"}
          - {pt: "Apenas irrigação", en: "Just irrigation"}
        correctAnswer: {pt: "Controle biológico, cultural, físico e químico de forma equilibrada", en: "Biological, cultural, physical and chemical control in balanced way"}
        rationale: {pt: "Quando táticas se complementam, então pragas são controladas com menos químicos e mais sustentabilidade.", en: "When tactics complement, pests are controlled with fewer chemicals and more sustainability."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Agricultura regenerativa enfatiza:", en: "Regenerative agriculture emphasizes:"}
        choices:
          - {pt: "Saúde do solo, biodiversidade, captura de carbono e ciclos fechados", en: "Soil health, biodiversity, carbon capture and closed cycles"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas monocultura intensiva", en: "Just intensive monoculture"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Saúde do solo, biodiversidade, captura de carbono e ciclos fechados", en: "Soil health, biodiversity, carbon capture and closed cycles"}
        rationale: {pt: "Quando solo é nutrido, então produtividade sobe e clima global se beneficia.", en: "When soil is nourished, productivity rises and global climate benefits."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Agricultura de precisão utiliza:", en: "Precision agriculture uses:"}
        choices:
          - {pt: "Sensores, drones, GPS e IA para insumos exatos por subárea", en: "Sensors, drones, GPS and AI for exact subarea inputs"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas tradição manual", en: "Just manual tradition"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Sensores, drones, GPS e IA para insumos exatos por subárea", en: "Sensors, drones, GPS and AI for exact subarea inputs"}
        rationale: {pt: "Quando aplicação é direcionada, então gasta-se menos água, fertilizante e pesticida.", en: "When application is targeted, less water, fertilizer and pesticide are used."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Variedades tolerantes ao estresse climático ajudam contra:", en: "Climate-stress tolerant varieties help against:"}
        choices:
          - {pt: "Seca, calor, salinidade e inundações intensificadas", en: "Drought, heat, salinity and intensified flooding"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Seca, calor, salinidade e inundações intensificadas", en: "Drought, heat, salinity and intensified flooding"}
        rationale: {pt: "Como clima muda, então adaptar variedades é estratégia central de segurança alimentar.", en: "Because climate is changing, adapting varieties is a central food security strategy."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Polinizadores em risco (abelhas) ameaçam:", en: "At-risk pollinators (bees) threaten:"}
        choices:
          - {pt: "Reprodução de cerca de 75% das culturas alimentares mundiais", en: "Reproduction of about 75% of world food crops"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas pequenas plantas ornamentais", en: "Just small ornamental plants"}
        correctAnswer: {pt: "Reprodução de cerca de 75% das culturas alimentares mundiais", en: "Reproduction of about 75% of world food crops"}
        rationale: {pt: "Quando polinizadores declinam, então rendimento agrícola cai e dieta humana fica em risco.", en: "When pollinators decline, agricultural yield drops and human diet is at risk."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Agroflorestal (agroforestry) integra:", en: "Agroforestry integrates:"}
        choices:
          - {pt: "Árvores com cultivos e/ou pecuária para serviços ecossistêmicos", en: "Trees with crops and/or livestock for ecosystem services"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas turismo", en: "Just tourism"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Árvores com cultivos e/ou pecuária para serviços ecossistêmicos", en: "Trees with crops and/or livestock for ecosystem services"}
        rationale: {pt: "Quando sistemas se diversificam, então solo, água e biodiversidade se beneficiam ao mesmo tempo.", en: "When systems diversify, soil, water and biodiversity benefit simultaneously."}
        objectives: [biology.plant_immunity]
        difficulty: 5
      - type: choice
        question: {pt: "Segurança alimentar global depende de:", en: "Global food security depends on:"}
        choices:
          - {pt: "Disponibilidade, acesso, utilização e estabilidade — abordagem multidimensional", en: "Availability, access, utilization and stability — multidimensional approach"}
          - {pt: "Apenas produção bruta", en: "Just raw production"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Disponibilidade, acesso, utilização e estabilidade — abordagem multidimensional", en: "Availability, access, utilization and stability — multidimensional approach"}
        rationale: {pt: "Quando qualquer pilar falha, então pessoas passam fome — produzir mais não basta sozinho.", en: "When any pillar fails, people go hungry — producing more alone is not enough."}
        objectives: [biology.plant_immunity]
        difficulty: 5
target: 20
