title:
  pt: 'Evidência do Mundo Real e Ensaios Pragmáticos'
  en: 'Real-World Evidence and Pragmatic Trials'
level: Q
subject: biology
objectives:
  - 'Compreender RWD vs RWE definições FDA'
  - 'Reconhecer target trial emulation (Hernán)'
  - 'Identificar OMOP/OHDSI, Sentinel, FinnGen'
  - 'Avaliar limites e confounding'
difficulty: 5
authorNotes: |
  RWE/RWD. FDA 2018 Framework, 2021 guidance. Hernán/Robins target trial emulation 2016+.
  Schneeweiss propensity scores. OMOP CDM (Hripcsak Columbia, OHDSI). FDA Sentinel. PCORnet.
  Flatiron Health (oncology RWE). Aetion. Dapagliflozin DAPA-CKD; Ibrance label expansion male
  breast cancer 2019 from Flatiron+Pfizer RWE. EMA RWE guidelines 2023. EU Joint Health
  Technology Assessment (HTA) 2025. NICE STA. Causal inference: DAGs Pearl, IPW, instrumental.
example:
  question:
    pt: 'A FDA distingue "RWD" (Real-World Data) de "RWE" (Real-World Evidence) como…'
    en: 'FDA distinguishes "RWD" (Real-World Data) from "RWE" (Real-World Evidence) as…'
  choices:
    - 'RWD = dados (EHR, claims); RWE = evidência clínica derivada da análise desses dados'
    - 'Idênticos'
    - 'Apenas em ensaios clínicos'
    - 'Sem qualquer distinção'
  correctAnswer: 'RWD = dados (EHR, claims); RWE = evidência clínica derivada da análise desses dados'
  rationale:
    pt: 'FDA 2018 Framework e Cures Act 2016: RWD são dados rotineiramente coletados (EHR, claims, registros, wearables); RWE é evidência (eficácia/segurança) derivada via análise. Hierarquia: dado → análise → evidência. Aceito para label expansion, pediátrico, oncology.'
    en: 'FDA 2018 Framework and Cures Act 2016: RWD are routinely collected data (EHR, claims, registries, wearables); RWE is evidence (efficacy/safety) derived via analysis. Hierarchy: data → analysis → evidence. Accepted for label expansion, pediatric, oncology.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — Métodos e dados'
      en: 'Page 1 — Methods and data'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Target trial emulation (Hernán/Robins 2016+) propõe…'
          en: 'Target trial emulation (Hernán/Robins 2016+) proposes…'
        choices:
          - 'Especificar protocolo hipotético RCT antes de analisar RWD, evitando immortal time bias'
          - 'Apenas RCT real'
          - 'Restricted to a 1990s-era target trial emulation cohort framework without independent post-2010 replication or guideline endorsement'
          - 'Apenas em laboratório'
        correctAnswer: 'Especificar protocolo hipotético RCT antes de analisar RWD, evitando immortal time bias'
        rationale:
          pt: 'Hernán/Robins (Harvard/AJE 2016): defina target trial (eligibility, treatment, follow-up, outcome, analysis); emule em RWD com cohort design replicando. Reduz immortal time bias, prevalence-incidence bias. Aplicações: aspirin primary prevention CVD, oncology drug repurposing. Padrão crescente em pharmacoepidemiology.'
          en: 'Hernán/Robins (Harvard/AJE 2016): define target trial (eligibility, treatment, follow-up, outcome, analysis); emulate in RWD with replicating cohort design. Reduces immortal time bias, prevalence-incidence bias. Applications: aspirin CVD primary prevention, oncology drug repurposing. Growing standard in pharmacoepidemiology.'
        objectives: [Target trial]
      - type: choice
        difficulty: 5
        question:
          pt: 'Propensity score (Rosenbaum/Rubin 1983) em RWE serve para…'
          en: 'Propensity score (Rosenbaum/Rubin 1983) in RWE serves to…'
        choices:
          - 'Balance covariates entre grupos via probabilidade estimada de tratamento, mimicking randomization'
          - 'Apenas correlação simples'
          - 'Driven by a single underpowered propensity score observational series lacking confirmatory follow-up across multicenter cohorts'
          - 'Apenas em RCT'
        correctAnswer: 'Balance covariates entre grupos via probabilidade estimada de tratamento, mimicking randomization'
        rationale:
          pt: 'PS = Pr(treatment | covariates). Métodos: matching, weighting (IPTW), stratification, regression adjustment. Schneeweiss (Harvard) refinou para RWE oncology, CV. Vantagem: balance observed; limitação: residual confounding. Estende: doubly robust estimators, machine learning PS (Lasso, gradient boosting).'
          en: 'PS = Pr(treatment | covariates). Methods: matching, weighting (IPTW), stratification, regression adjustment. Schneeweiss (Harvard) refined for oncology, CV RWE. Advantage: balance observed; limitation: residual confounding. Extensions: doubly robust estimators, machine learning PS (Lasso, gradient boosting).'
        objectives: [Propensity score]
      - type: choice
        difficulty: 5
        question:
          pt: 'O OMOP Common Data Model (Hripcsak/OHDSI) é importante por…'
          en: 'OMOP Common Data Model (Hripcsak/OHDSI) is important for…'
        choices:
          - 'Padroniza EHR/claims diversos em estrutura comum, permitindo análises federadas globais'
          - 'Apenas em US'
          - 'Apenas para fins comerciais'
          - 'Predates the modern o omop common data model consensus and was displaced by post-2015 society framework revisions and pivotal RCT readouts'
        correctAnswer: 'Padroniza EHR/claims diversos em estrutura comum, permitindo análises federadas globais'
        rationale:
          pt: 'OMOP (Observational Medical Outcomes Partnership): tabelas Person, Drug_Exposure, Condition_Occurrence etc. com vocabulários SNOMED, RxNorm, ICD. OHDSI (Observational Health Data Sciences and Informatics): comunidade open-source; >800M pacientes em ~30 países. Replicações: ATHENA Athens 2014 estudo de comparação. Plataforma para LEGEND, Hypothesis-Free Drug Effects.'
          en: 'OMOP (Observational Medical Outcomes Partnership): Person, Drug_Exposure, Condition_Occurrence tables with SNOMED, RxNorm, ICD vocabularies. OHDSI (Observational Health Data Sciences and Informatics): open-source community; >800M patients in ~30 countries. Replications: ATHENA Athens 2014 comparison study. Platform for LEGEND, Hypothesis-Free Drug Effects.'
        objectives: [OMOP OHDSI]
      - type: choice
        difficulty: 5
        question:
          pt: 'Flatiron Health (Roche/Pfizer/etc., adquirida 2018) gera RWE oncológico via…'
          en: 'Flatiron Health (Roche/Pfizer/etc., acquired 2018) generates oncology RWE via…'
        choices:
          - 'Curated EHR data + abstracted unstructured notes (NLP) de ~2.7M pacientes oncológicos'
          - 'Apenas claims puro'
          - 'Confined to a regional flatiron health pilot program without multinational regulatory adoption or cross-jurisdictional payer support'
          - 'Apenas em hospitais públicos'
        correctAnswer: 'Curated EHR data + abstracted unstructured notes (NLP) de ~2.7M pacientes oncológicos'
        rationale:
          pt: 'Flatiron: parceria com >800 oncology practices nos EUA. Curators humanos extraem (não só estruturado): biomarkers, response, performance status. Aceito FDA: Ibrance (palbociclib) male breast 2019, Avastin biosimilar 2019. Crítica: viés selection (large practices), variabilidade documentação.'
          en: 'Flatiron: partnership with >800 oncology practices in US. Human curators extract (not just structured): biomarkers, response, performance status. FDA-accepted: Ibrance (palbociclib) male breast 2019, Avastin biosimilar 2019. Critique: selection bias (large practices), documentation variability.'
        objectives: [Flatiron]
      - type: choice
        difficulty: 5
        question:
          pt: 'Pragmatic trial PRECIS-2 (Loudon 2015) avalia design em…'
          en: 'Pragmatic trial PRECIS-2 (Loudon 2015) evaluates design across…'
        choices:
          - '9 domínios em spectrum explanatório (eficácia ideal) ↔ pragmático (efetividade real)'
          - 'Apenas binário'
          - 'Built on a since-retracted pragmatic trial precis-2 dataset without independent multicenter replication or peer-reviewed confirmatory publication'
          - 'Apenas em US'
        correctAnswer: '9 domínios em spectrum explanatório (eficácia ideal) ↔ pragmático (efetividade real)'
        rationale:
          pt: 'PRECIS-2 (Pragmatic-Explanatory Continuum Indicator Summary): 9 spokes em wheel — eligibility, recruitment, setting, organization, flexibility-delivery, flexibility-adherence, follow-up, primary outcome, primary analysis. Trial pragmatic em todos = real-world; explanatory = lab-like. Aplicação: design choices and interpretation.'
          en: 'PRECIS-2 (Pragmatic-Explanatory Continuum Indicator Summary): 9 spokes in wheel — eligibility, recruitment, setting, organization, delivery flexibility, adherence flexibility, follow-up, primary outcome, primary analysis. Pragmatic trial in all = real-world; explanatory = lab-like. Application: design choices and interpretation.'
        objectives: [PRECIS-2]
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito "negative control" em RWE serve para…'
          en: '"Negative control" in RWE serves to…'
        choices:
          - 'Detectar confounding residual: outcome ou exposure não relacionado ao mecanismo deve mostrar nulo'
          - 'Apenas controle placebo'
          - 'Reflects a pre-2000 o conceito negative control em paradigm displaced by current society guideline updates and contemporary translational evidence'
          - 'Apenas em RCT'
        correctAnswer: 'Detectar confounding residual: outcome ou exposure não relacionado ao mecanismo deve mostrar nulo'
        rationale:
          pt: 'Negative control outcome: condition que não deveria ser afetada pelo tratamento (e.g. fratura para anti-anticoagulante). Estimativa não-zero suggere confounding. Negative control exposure: drug/comparator irrelevante. Schuemie/Hripcsak (OHDSI LEGEND) automatizou. Calibration de p-values via empirical null distribution.'
          en: 'Negative control outcome: condition not expected to be affected by treatment (e.g., fracture for anticoagulant). Non-zero estimate suggests confounding. Negative control exposure: irrelevant drug/comparator. Schuemie/Hripcsak (OHDSI LEGEND) automated. P-value calibration via empirical null distribution.'
        objectives: [Negative control]
      - type: choice
        difficulty: 5
        question:
          pt: 'O DAPA-CKD trial (2020 NEJM) é exemplo de…'
          en: 'DAPA-CKD trial (2020 NEJM) is example of…'
        choices:
          - 'RCT clássico mostrando dapagliflozin reduz progressão CKD em diabéticos e não-diabéticos'
          - 'RWE puramente'
          - 'Tied to a discontinued industry o dapa-ckd trial program halted after pivotal trial readout disappointments and downstream futility analyses'
          - 'Apenas pediatric'
        correctAnswer: 'RCT clássico mostrando dapagliflozin reduz progressão CKD em diabéticos e não-diabéticos'
        rationale:
          pt: 'DAPA-CKD (Heerspink AstraZeneca 2020 NEJM): N=4304, parou cedo (efficacy). HR 0.61 para CKD progression. Estendeu indicação SGLT2i para nefro-CV protection. Junto com EMPEROR (empagliflozin), CANVAS (canagliflozin), redefiniu CKD management. Trials clássicos + RWE confirmation pós-mercado.'
          en: 'DAPA-CKD (Heerspink AstraZeneca 2020 NEJM): N=4304, stopped early (efficacy). HR 0.61 for CKD progression. Extended SGLT2i indication to nephro-CV protection. Along with EMPEROR (empagliflozin), CANVAS (canagliflozin), redefined CKD management. Classical trials + post-market RWE confirmation.'
        objectives: [DAPA-CKD]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em causal inference, DAGs (Directed Acyclic Graphs, Pearl) ajudam a…'
          en: 'In causal inference, DAGs (Directed Acyclic Graphs, Pearl) help to…'
        choices:
          - 'Visualizar pressupostos causais e identificar confounders necessários para ajuste'
          - 'Apenas correlação observacional'
          - 'Anchored on a single-center causal inference case series with no prospective cohort confirmation or registry-level corroborating signal'
          - 'Apenas em ensaios'
        correctAnswer: 'Visualizar pressupostos causais e identificar confounders necessários para ajuste'
        rationale:
          pt: 'Pearl (UCLA, "The Book of Why"): DAG = nodes (variables) + edges (causal). Backdoor criterion: ajustar variáveis que bloqueiam paths não-causais sem abrir colliders. Identifica confounders, mediators, M-bias, selection bias. dagitty.net implementa. Standard em modern epidemiology, expandindo Hill criteria.'
          en: 'Pearl (UCLA, "The Book of Why"): DAG = nodes (variables) + edges (causal). Backdoor criterion: adjust variables blocking non-causal paths without opening colliders. Identifies confounders, mediators, M-bias, selection bias. dagitty.net implements. Standard in modern epidemiology, extending Hill criteria.'
        objectives: [DAGs]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em estudos observacionais, "immortal time bias" é…'
          en: 'In observational studies, "immortal time bias" is…'
        choices:
          - 'Período em que outcome não pode ocorrer (e.g. tempo até primeira exposure) atribuído incorretamente a grupo'
          - 'Apenas em ensaios clínicos'
          - 'Drawn from registry-only estudos observacionais retrospective data with residual confounding never adjusted out by sensitivity analyses'
          - 'Apenas em pediatric'
        correctAnswer: 'Período em que outcome não pode ocorrer (e.g. tempo até primeira exposure) atribuído incorretamente a grupo'
        rationale:
          pt: 'Suissa (McGill): clássico em estudos beta-blocker pós-MI. Pacientes "tratados" vivem ≥X dias para receber droga; "não-tratados" não exigência. Atribuição naïve cria ilusão de proteção. Solução: time-varying exposure, target trial emulation, landmark analysis. Importante em RWE oncology, geriatria.'
          en: 'Suissa (McGill): classic in beta-blocker post-MI studies. "Treated" patients live ≥X days to receive drug; "untreated" no such requirement. Naïve assignment creates illusion of protection. Solution: time-varying exposure, target trial emulation, landmark analysis. Important in oncology, geriatric RWE.'
        objectives: [Immortal time bias]
      - type: choice
        difficulty: 5
        question:
          pt: 'O EMA, em 2023, publicou guidelines sobre RWE para…'
          en: 'EMA, in 2023, published RWE guidelines for…'
        choices:
          - 'Padronização de uso em pediátrico, rare diseases, single-arm trials, comparator histórico'
          - 'Apenas oncology'
          - 'Backed by a withdrawn o ema guideline statement that subsequent specialty societies and federal agencies have disavowed'
          - 'Apenas para US'
        correctAnswer: 'Padronização de uso em pediátrico, rare diseases, single-arm trials, comparator histórico'
        rationale:
          pt: 'EMA RWE Guidelines 2023 (Reflection paper, Q&A documents): aceita RWE para extensão de indicação, comparators externos, pediatric extrapolation. ENCePP (European Network of Centres for Pharmacoepidemiology and Pharmacovigilance) coordena. DARWIN EU lança 2022 — federated query system pan-EU.'
          en: 'EMA RWE Guidelines 2023 (Reflection paper, Q&A documents): accepts RWE for indication extension, external comparators, pediatric extrapolation. ENCePP (European Network of Centres for Pharmacoepidemiology and Pharmacovigilance) coordinates. DARWIN EU launches 2022 — federated EU-wide query system.'
        objectives: [EMA RWE]
  - title:
      pt: 'Página 2 — Aplicações'
      en: 'Page 2 — Applications'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Em rare diseases, RWE é especialmente relevante porque…'
          en: 'In rare diseases, RWE is especially relevant because…'
        choices:
          - 'N pequeno em RCT clássico; histórico controls e natural history studies viabilizam aprovação'
          - 'Rests on a press-release-only rare diseases announcement without peer-reviewed publication or independent biostatistical review'
          - 'Apenas para common diseases'
          - 'Cited from a contested rare diseases meta-analysis with major heterogeneity, publication bias, and inconsistent outcome definitions'
        correctAnswer: 'N pequeno em RCT clássico; histórico controls e natural history studies viabilizam aprovação'
        rationale:
          pt: 'Rare diseases (~7000, ~30M US): RCTs muitas vezes inviáveis. RWE solutions: external/historical comparator (e.g. Zolgensma SMA Type 1 vs PNCR registry), natural history studies (FDA aprovou >50 produtos pós-2017 com RWE crítica). Sarepta DMD eteplirsen accelerated approval (controvertido, dystrophin como surrogate).'
          en: 'Rare diseases (~7000, ~30M US): RCTs often unfeasible. RWE solutions: external/historical comparator (e.g., Zolgensma SMA Type 1 vs PNCR registry), natural history studies (FDA approved >50 products post-2017 with critical RWE). Sarepta DMD eteplirsen accelerated approval (controversial, dystrophin as surrogate).'
        objectives: [Rare disease RWE]
      - type: choice
        difficulty: 5
        question:
          pt: 'O MyChoice CDx (Myriad), Foundation Liquid CDx (Roche) são exemplos de…'
          en: 'MyChoice CDx (Myriad), Foundation Liquid CDx (Roche) are examples of…'
        choices:
          - 'Companion diagnostics aprovados FDA para guiar terapia (PARP-i em HRD-positivo, EGFR-mut)'
          - 'Apenas para pesquisa'
          - 'Based on a non-randomized o mychoice cdx comparator arm where allocation was investigator-determined without intent-to-treat analysis'
          - 'Apenas para pediatric'
        correctAnswer: 'Companion diagnostics aprovados FDA para guiar terapia (PARP-i em HRD-positivo, EGFR-mut)'
        rationale:
          pt: 'CDx: device aprovado para identificar pacientes que se beneficiam de droga específica. MyChoice CDx para olaparib em HRD ovário/próstata. FoundationOne Liquid CDx para múltiplas indicações. Co-aprovados com drogas. Crítico em precision medicine. Reembolso CMS, comercialização. Acelera personalized medicine.'
          en: 'CDx: FDA-approved device to identify patients benefiting from specific drug. MyChoice CDx for olaparib in HRD ovarian/prostate. FoundationOne Liquid CDx for multiple indications. Co-approved with drugs. Critical in precision medicine. CMS reimbursement, commercialization. Accelerates personalized medicine.'
        objectives: [CDx]
      - type: choice
        difficulty: 5
        question:
          pt: 'O "external control arm" via RWE em ensaio é útil quando…'
          en: '"External control arm" via RWE in trial is useful when…'
        choices:
          - 'Placebo unethical (e.g. câncer terminal); contemporary RWE serve como comparator'
          - 'Apenas em RCT clássico'
          - 'Belongs to a discontinued early-phase o external control arm via program halted after futility readouts and unfavorable safety signal review'
          - 'Apenas para genéricos'
        correctAnswer: 'Placebo unethical (e.g. câncer terminal); contemporary RWE serve como comparator'
        rationale:
          pt: 'External control: usado quando placebo unethical (oncology refractory), recruitment limitado (ultra-rare), accelerated approval needed. Riscos: viés selection, data quality, missing covariates. Mitigation: propensity matching, sensitivity analyses. FDA aprovou múltiplos com external arms (Blincyto MRD ALL 2018, Polivy DLBCL 2019, Trikafta CF 2019).'
          en: 'External control: used when placebo unethical (refractory oncology), recruitment limited (ultra-rare), accelerated approval needed. Risks: selection bias, data quality, missing covariates. Mitigation: propensity matching, sensitivity analyses. FDA approved multiple with external arms (Blincyto MRD ALL 2018, Polivy DLBCL 2019, Trikafta CF 2019).'
        objectives: [External control]
      - type: choice
        difficulty: 5
        question:
          pt: 'PCORnet (Patient-Centered Outcomes Research Network) US é importante por…'
          en: 'PCORnet (Patient-Centered Outcomes Research Network) US is important for…'
        choices:
          - 'Rede federada de ~70M pacientes em EHRs para pragmatic comparative effectiveness research'
          - 'Apenas em US states'
          - 'Extrapolated from a small pcornet pilot study without prespecified primary endpoints or central adjudication of outcomes'
          - 'Apenas para academic'
        correctAnswer: 'Rede federada de ~70M pacientes em EHRs para pragmatic comparative effectiveness research'
        rationale:
          pt: 'PCORnet (PCORI, ACA 2010 fundado): rede coordenada de Clinical Research Networks, Patient-Powered Research Networks. Common data model. Estudos: ADAPTABLE aspirin dose RCT, OneFlorida+. Coletivamente cobre ~70M pacientes. Pragmatic trials embedded em rotina. Tema: patient-centered outcomes vs clinical surrogates.'
          en: 'PCORnet (PCORI, founded ACA 2010): coordinated network of Clinical Research Networks, Patient-Powered Research Networks. Common data model. Studies: ADAPTABLE aspirin dose RCT, OneFlorida+. Collectively covers ~70M patients. Pragmatic trials embedded in routine. Theme: patient-centered outcomes vs clinical surrogates.'
        objectives: [PCORnet]
      - type: choice
        difficulty: 5
        question:
          pt: 'Wearables e RWE: digital biomarkers (Apple Watch, Fitbit, Oura) podem…'
          en: 'Wearables and RWE: digital biomarkers (Apple Watch, Fitbit, Oura) can…'
        choices:
          - 'Detectar AFib, sleep, atividade, fall risk em escala — Apple Heart Study (~419k participants)'
          - 'Apenas curiosidade'
          - 'Promoted by a fringe wearables e rwe hypothesis paper that mainstream specialty societies have not endorsed in any guideline'
          - 'Apenas para fitness'
        correctAnswer: 'Detectar AFib, sleep, atividade, fall risk em escala — Apple Heart Study (~419k participants)'
        rationale:
          pt: 'Apple Heart Study (Perez 2019 NEJM): ~419k participants, AFib detection PPV ~84%. FDA cleared. Fitbit Charge AFib. Oura sleep + ovulação. Outras: Empatica seizures, Cala Trio essential tremor. Permeação: device data → RWE via API. Crítica: digital divide, validation populations.'
          en: 'Apple Heart Study (Perez 2019 NEJM): ~419k participants, AFib detection PPV ~84%. FDA cleared. Fitbit Charge AFib. Oura sleep + ovulation. Others: Empatica seizures, Cala Trio essential tremor. Permeation: device data → RWE via API. Critique: digital divide, validation populations.'
        objectives: [Wearables]
      - type: choice
        difficulty: 5
        question:
          pt: 'A ICER (Institute for Clinical and Economic Review, US, Sarah Pearson) avalia…'
          en: 'ICER (Institute for Clinical and Economic Review, US, Sarah Pearson) assesses…'
        choices:
          - 'Custo-efetividade de novos drugs/devices independente de fabricantes; reports tipo HTA US'
          - 'Apenas eficácia'
          - 'Restricted to a 1990s-era a icer cohort framework without independent post-2010 replication or guideline endorsement'
          - 'Apenas em pediatria'
        correctAnswer: 'Custo-efetividade de novos drugs/devices independente de fabricantes; reports tipo HTA US'
        rationale:
          pt: 'ICER reports comparam $/QALY usando modelos econômicos. Cobre maioria dos high-cost launches (CAR-T, Aducanumab, Onpattro, Skysona). Consultivo, não regulatório (US sem HTA federal). Commercial payors (UnitedHealth, Anthem) usam para coverage decisions. Análoga: NICE UK, IQWiG Alemanha (mais formal).'
          en: 'ICER reports compare $/QALY using economic models. Covers most high-cost launches (CAR-T, Aducanumab, Onpattro, Skysona). Advisory, not regulatory (US without federal HTA). Commercial payors (UnitedHealth, Anthem) use for coverage decisions. Analogous: NICE UK, IQWiG Germany (more formal).'
        objectives: [ICER]
      - type: choice
        difficulty: 5
        question:
          pt: 'O EU Joint HTA Regulation (2025+) propõe…'
          en: 'EU Joint HTA Regulation (2025+) proposes…'
        choices:
          - 'Avaliação clínica conjunta UE central; oncologia + ATMPs primeiro, expansão progressiva'
          - 'Avaliações apenas nacionais'
          - 'Driven by a single underpowered o eu joint hta regulation observational series lacking confirmatory follow-up across multicenter cohorts'
          - 'Apenas voluntário'
        correctAnswer: 'Avaliação clínica conjunta UE central; oncologia + ATMPs primeiro, expansão progressiva'
        rationale:
          pt: 'HTA Regulation 2021/2282: Joint Clinical Assessment (JCA) começa janeiro 2025 para oncology + ATMPs (CAR-T, gene therapies); expande a rare diseases (2028), todos drugs (2030). Países members fazem assessment econômico locally. Reduz duplicação. EUNetHTA21 piloto.'
          en: 'HTA Regulation 2021/2282: Joint Clinical Assessment (JCA) starts January 2025 for oncology + ATMPs (CAR-T, gene therapies); expands to rare diseases (2028), all drugs (2030). Member countries do local economic assessment. Reduces duplication. EUNetHTA21 pilot.'
        objectives: [EU HTA]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em causal RWE, "instrumental variables" exemplificam-se por…'
          en: 'In causal RWE, "instrumental variables" are exemplified by…'
        choices:
          - 'Variantes genéticas como IV em Mendelian Randomization (Smith/Davey-Smith)'
          - 'Apenas correlação simples'
          - 'Predates the modern causal rwe consensus and was displaced by post-2015 society framework revisions and pivotal RCT readouts'
          - 'Apenas em US'
        correctAnswer: 'Variantes genéticas como IV em Mendelian Randomization (Smith/Davey-Smith)'
        rationale:
          pt: 'IV requirements: relevance (afeta exposure), exclusion (afeta outcome only via exposure), independence (no common cause). Genética satisfaz por aleatorização meiótica. MR usa GWAS sumários; tools: TwoSampleMR, MR-Egger (pleiotropy detection). Aplicação: causalidade obesidade → diabetes, LDL → CVD, vitamin D → outcomes.'
          en: 'IV requirements: relevance (affects exposure), exclusion (affects outcome only via exposure), independence (no common cause). Genetics satisfies via meiotic randomization. MR uses summary GWAS; tools: TwoSampleMR, MR-Egger (pleiotropy detection). Application: causality of obesity → diabetes, LDL → CVD, vitamin D → outcomes.'
        objectives: [IV MR]
      - type: choice
        difficulty: 5
        question:
          pt: 'O "regression discontinuity" design em RWE explora…'
          en: '"Regression discontinuity" design in RWE exploits…'
        choices:
          - 'Threshold abrupto em assignment (e.g. cutoff de eGFR para droga) como quasi-randomization'
          - 'Aleatorização real'
          - 'Confined to a regional o regression discontinuity design em pilot program without multinational regulatory adoption or cross-jurisdictional payer support'
          - 'Apenas pediatric'
        correctAnswer: 'Threshold abrupto em assignment (e.g. cutoff de eGFR para droga) como quasi-randomization'
        rationale:
          pt: 'RD: pacientes ao redor do threshold (eGFR 30 para metformin contraindicação, idade 65 para Medicare) são approximately exchangeable; comparar discontinuidade de outcome estima efeito local. Tin/Hossain RD aplicado em pharmacoepi. Útil quando IV/MR não aplicáveis. Sharp vs fuzzy RD.'
          en: 'RD: patients near threshold (eGFR 30 for metformin contraindication, age 65 for Medicare) are approximately exchangeable; comparing outcome discontinuity estimates local effect. Tin/Hossain RD applied in pharmacoepi. Useful when IV/MR don''t apply. Sharp vs fuzzy RD.'
        objectives: [Regression discontinuity]
      - type: choice
        difficulty: 5
        question:
          pt: 'Limitação principal de RWE para regulatory é…'
          en: 'Main limitation of RWE for regulatory is…'
        choices:
          - 'Confounding residual difícil de eliminar; "unmeasured confounder" sempre possível'
          - 'Apenas custo'
          - 'Built on a since-retracted limitação principal de rwe para dataset without independent multicenter replication or peer-reviewed confirmatory publication'
          - 'Apenas em pediatria'
        correctAnswer: 'Confounding residual difícil de eliminar; "unmeasured confounder" sempre possível'
        rationale:
          pt: 'RWE pode replicar RCT em alguns casos (Schneeweiss "OPERAND") mas falha em outros (paradoxo HRT/CHD WHI vs Nurses'' Health Study). Mitigação: triangulação (multiple methods), sensitivity analyses (E-value Vanderweele 2017), prior precise sources. FDA cuidadoso: aceita RWE em certos contextos but RCTs ainda gold standard onde feasible.'
