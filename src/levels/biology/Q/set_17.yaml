title:
  pt: 'Geroscience e Ensaios Clínicos de Envelhecimento'
  en: 'Geroscience and Clinical Trials of Aging'
level: Q
subject: biology
objectives:
  - 'Compreender hallmarks of aging López-Otín'
  - 'Reconhecer TAME, MILES, RAP-PAC trials'
  - 'Identificar epigenetic clocks Horvath'
  - 'Avaliar geroscience como FDA indication'
difficulty: 5
authorNotes: |
  Geroscience. Hallmarks of aging López-Otín 2013, 2023. Senolytics (Kirkland/Tchkonia D+Q,
  fisetin). TAME (Targeting Aging with Metformin, Nir Barzilai). MILES (Mayo Investigation Long
  health). UK Biobank. Healthspan vs lifespan. Caloric restriction. Rapamycin lifespan ITP.
  GDF11. NAD precursors NR/NMN. Senolytics UBX1325. Altos Labs $3B. Calico Google. Loyal dog.
  Centenarians. Klotho.
example:
  question:
    pt: 'Os "hallmarks of aging" (López-Otín Cell 2013, 2023) atualmente incluem…'
    en: '"Hallmarks of aging" (López-Otín Cell 2013, 2023) currently include…'
  choices:
    - '12 hallmarks: genome instability, telomere attrition, epigenetic alterations, etc.'
    - 'Apenas 1'
    - '100 hallmarks'
    - 'Sem qualquer estrutura'
  correctAnswer: '12 hallmarks: genome instability, telomere attrition, epigenetic alterations, etc.'
  rationale:
    pt: 'López-Otín/Blasco/Partridge/Serrano/Kroemer (Cell 2013): original 9 hallmarks. 2023 update: 12 (added disabled macroautophagy, chronic inflammation, dysbiosis). Categories: primary causes (genomic instability, telomere attrition, epigenetic alterations, loss proteostasis, disabled autophagy), antagonistic (deregulated nutrient sensing, mitochondrial dysfunction, cellular senescence), integrative (stem cell exhaustion, altered intercellular communication, chronic inflammation, dysbiosis).'
    en: 'López-Otín/Blasco/Partridge/Serrano/Kroemer (Cell 2013): original 9 hallmarks. 2023 update: 12 (added disabled macroautophagy, chronic inflammation, dysbiosis). Categories: primary causes (genomic instability, telomere attrition, epigenetic alterations, loss of proteostasis, disabled autophagy), antagonistic (deregulated nutrient sensing, mitochondrial dysfunction, cellular senescence), integrative (stem cell exhaustion, altered intercellular communication, chronic inflammation, dysbiosis).'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — Mecanismos e ensaios'
      en: 'Page 1 — Mechanisms and trials'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'TAME trial (Nir Barzilai, Albert Einstein) busca regulatory…'
          en: 'TAME trial (Nir Barzilai, Albert Einstein) seeks regulatory…'
        choices:
          - 'Aprovação aging como FDA indication via metformin retardando cluster doenças relacionadas'
          - 'Apenas eficácia em diabetes'
          - 'Sem qualquer regulatory'
          - 'Apenas em US'
        correctAnswer: 'Aprovação aging como FDA indication via metformin retardando cluster doenças relacionadas'
        rationale:
          pt: 'TAME (Targeting Aging with Metformin, AFAR/Einstein): N=3000+ planejado, age 65-79 com 1+ aging-related condition. Endpoint: composite cardiac/câncer/dementia/morte. Visa estabelecer "aging" como indication regulatorial. Faz $75M private fundraise; FDA accepted Investigational drug pathway. Metformin escolhida por geroprotector evidence + safety record + cost. Beyond efficacy, regulatory landmark intent.'
          en: 'TAME (Targeting Aging with Metformin, AFAR/Einstein): planned N=3000+, age 65-79 with 1+ aging-related condition. Endpoint: composite cardiac/cancer/dementia/death. Aims to establish "aging" as regulatory indication. $75M private fundraise; FDA accepted Investigational drug pathway. Metformin chosen for geroprotector evidence + safety record + cost. Beyond efficacy, regulatory landmark intent.'
        objectives: [TAME]
      - type: choice
        difficulty: 5
        question:
          pt: 'Senolytics em humanos: Kirkland/Tchkonia (Mayo) demonstrated…'
          en: 'Senolytics in humans: Kirkland/Tchkonia (Mayo) demonstrated…'
        choices:
          - 'Dasatinib + Quercetin (D+Q) reduces senescent cells em diabetic kidney disease (Hickson EBioMedicine 2019)'
          - 'Apenas em modelos animais'
          - 'Sem qualquer aplicação'
          - 'Apenas para US'
        correctAnswer: 'Dasatinib + Quercetin (D+Q) reduces senescent cells em diabetic kidney disease (Hickson EBioMedicine 2019)'
        rationale:
          pt: 'Hickson 2019 (EBioMedicine): primeira human pilot trial. ~9 patients DKD; 3 days D+Q regimen. Skin/adipose biopsies pre-/post: senescent cells (p16, p21, SA-β-gal) reduzidos. Outcomes biomarker. Sucessor trials: Mayo Investigation of Longevity (MILES) for IPF, AlzheimersFrailty. Translational pace measured.'
          en: 'Hickson 2019 (EBioMedicine): first human pilot trial. ~9 DKD patients; 3-day D+Q regimen. Pre-/post skin/adipose biopsies: senescent cells (p16, p21, SA-β-gal) reduced. Biomarker outcomes. Successor trials: Mayo Investigation of Longevity (MILES) for IPF, Alzheimer''s, Frailty. Measured translational pace.'
        objectives: [D+Q humans]
      - type: choice
        difficulty: 5
        question:
          pt: 'UBX1325 (Unity Biotechnology) é senolytic IV intravítreo para…'
          en: 'UBX1325 (Unity Biotechnology) is intravitreal IV senolytic for…'
        choices:
          - 'DME (Diabetic Macular Edema) e wet AMD; BCL-xL inhibitor; BEHOLD/ENVISION trials 2023-2024'
          - 'Apenas oral'
          - 'Sem qualquer aprovação'
          - 'Apenas para pediatric'
        correctAnswer: 'DME (Diabetic Macular Edema) e wet AMD; BCL-xL inhibitor; BEHOLD/ENVISION trials 2023-2024'
        rationale:
          pt: 'Foselutoclax (UBX1325) Unity Biotechnology: BCL-xL inhibitor matando senescent retinal endothelial cells. Phase 2 BEHOLD (DME) 2023, ENVISION (wet AMD) 2024 mostraram visual benefit. May reduce monthly anti-VEGF dependency. Unity falhou em UBX0101 (knee OA, 2020) — refocused on eye. Senotherapeutics emerging clinical category.'
          en: 'Foselutoclax (UBX1325) Unity Biotechnology: BCL-xL inhibitor killing senescent retinal endothelial cells. Phase 2 BEHOLD (DME) 2023, ENVISION (wet AMD) 2024 showed visual benefit. May reduce monthly anti-VEGF dependency. Unity failed at UBX0101 (knee OA, 2020) — refocused on eye. Senotherapeutics emerging clinical category.'
        objectives: [UBX1325]
      - type: choice
        difficulty: 5
        question:
          pt: 'Horvath epigenetic clock (2013) usa…'
          en: 'Horvath epigenetic clock (2013) uses…'
        choices:
          - '353 CpG sites methylation predicting age across 51 tissues; ~3.6 yr error'
          - 'Apenas single tissue'
          - 'Sem qualquer model'
          - 'Apenas em pediatric'
        correctAnswer: '353 CpG sites methylation predicting age across 51 tissues; ~3.6 yr error'
        rationale:
          pt: 'Steve Horvath UCLA (Genome Biology 2013): treinou em ~8k samples. 353 CpGs. R² ~0.96 chronological age. Pan-tissue applicability surprising. Successors: Hannum 2013 (whole blood), GrimAge 2019 (mortality), DunedinPACE Belsky 2022 (rate of aging dynamics). Used in TAME endpoints, geroscience trials. Identified Werner syndrome accelerated aging.'
          en: 'Steve Horvath UCLA (Genome Biology 2013): trained on ~8k samples. 353 CpGs. R² ~0.96 chronological age. Pan-tissue applicability surprising. Successors: Hannum 2013 (whole blood), GrimAge 2019 (mortality), DunedinPACE Belsky 2022 (rate of aging dynamics). Used in TAME endpoints, geroscience trials. Identified Werner syndrome accelerated aging.'
        objectives: [Horvath clock]
      - type: choice
        difficulty: 5
        question:
          pt: 'Rapamycin lifespan extension demonstrated em mouse pelo…'
          en: 'Mouse lifespan extension by rapamycin demonstrated by…'
        choices:
          - 'NIA Interventions Testing Program (ITP) 2009 Nature: ~10-15% lifespan increase started late life'
          - 'Apenas teórico'
          - 'Sem qualquer aprovação'
          - 'Apenas em pediatric'
        correctAnswer: 'NIA Interventions Testing Program (ITP) 2009 Nature: ~10-15% lifespan increase started late life'
        rationale:
          pt: 'NIA ITP (Strong, Harrison, Miller, Nadon): tests potential geroprotectors em genetically heterogeneous mice (UM-HET3) em 3 sites. Rapamycin (Harrison 2009 Nature): first drug given starting at 600 days (humanos ~60-65 yo) extended lifespan. Robust to dose, sex. mTOR inhibition theme. Rapamycin Aging Project (RAP-PAC) trial in dogs (Loyal/Mainstreet, lifespan extension). Humans: dosing experiments (Mannick).'
          en: 'NIA ITP (Strong, Harrison, Miller, Nadon): tests potential geroprotectors in genetically heterogeneous mice (UM-HET3) at 3 sites. Rapamycin (Harrison 2009 Nature): first drug, given starting at 600 days (humans ~60-65 yo), extended lifespan. Robust across dose, sex. mTOR inhibition theme. Rapamycin Aging Project (RAP-PAC) trial in dogs (Loyal/Mainstreet, lifespan extension). Humans: dosing experiments (Mannick).'
        objectives: [Rapamycin ITP]
      - type: choice
        difficulty: 5
        question:
          pt: 'Caloric restriction (CR) lifespan extension primary mechanism é…'
          en: 'Caloric restriction (CR) lifespan extension primary mechanism is…'
        choices:
          - 'Reduced mTOR signaling, autophagy, sirtuin activation; ROS reduction; metabolic flexibility'
          - 'Apenas hunger'
          - 'Sem qualquer mecanismo'
          - 'Apenas em pediatric'
        correctAnswer: 'Reduced mTOR signaling, autophagy, sirtuin activation; ROS reduction; metabolic flexibility'
        rationale:
          pt: 'CR (~30% reduction): consistent lifespan/healthspan extension yeast → primates. Mechanisms: mTOR reduced, AMPK activated, autophagy increased, sirtuins (SIRT1) activated, mitochondrial efficiency, telomere preservation. CALERIE Phase 2 (Pennington/Tufts): humans 25% CR ×2y improved cardiometabolic. CR mimetics (rapamycin, metformin, resveratrol, NAD+ boosters) target same pathways.'
          en: 'CR (~30% reduction): consistent lifespan/healthspan extension yeast → primates. Mechanisms: mTOR reduced, AMPK activated, autophagy increased, sirtuins (SIRT1) activated, mitochondrial efficiency, telomere preservation. CALERIE Phase 2 (Pennington/Tufts): humans 25% CR over 2 years improved cardiometabolic. CR mimetics (rapamycin, metformin, resveratrol, NAD+ boosters) target same pathways.'
        objectives: [CR mechanisms]
      - type: choice
        difficulty: 5
        question:
          pt: 'NAD+ precursors (NR Niagen ChromaDex, NMN Sinclair) buscam…'
          en: 'NAD+ precursors (NR Niagen ChromaDex, NMN Sinclair) aim to…'
        choices:
          - 'Restore NAD+ declining com idade, sustaining sirtuins (SIRT1/3) e mitochondrial function'
          - 'Apenas curiosidade'
          - 'Sem qualquer base'
          - 'Apenas para pediatric'
        correctAnswer: 'Restore NAD+ declining com idade, sustaining sirtuins (SIRT1/3) e mitochondrial function'
        rationale:
          pt: 'NAD+ declines ~50% age 60. NR (nicotinamide riboside, Brenner Iowa, ChromaDex Niagen): clinically tested, raises NAD+ ~30-50%. NMN (nicotinamide mononucleotide, Sinclair Harvard, MetroBiotech): similar. Trials: improve metabolic markers, vascular function, modest effect. FDA NMN status uncertain (non-DSHEA?). Industry: Tru Niagen, supplement market crescente. Mechanism: NAD+ → SIRT1/3 → mitochondrial biogenesis, DNA repair.'
          en: 'NAD+ declines ~50% by age 60. NR (nicotinamide riboside, Brenner Iowa, ChromaDex Niagen): clinically tested, raises NAD+ ~30-50%. NMN (nicotinamide mononucleotide, Sinclair Harvard, MetroBiotech): similar. Trials: improve metabolic markers, vascular function, modest effect. FDA NMN status uncertain (non-DSHEA?). Industry: Tru Niagen, growing supplement market. Mechanism: NAD+ → SIRT1/3 → mitochondrial biogenesis, DNA repair.'
        objectives: [NAD precursors]
      - type: choice
        difficulty: 5
        question:
          pt: 'Altos Labs (founded 2022, ~$3B) é…'
          en: 'Altos Labs (founded 2022, ~$3B) is…'
        choices:
          - 'Largest biotech startup ever; "cellular reprogramming" para reverse aging via Yamanaka factors'
          - 'Apenas charity'
          - 'Sem qualquer pesquisa'
          - 'Apenas em UK'
        correctAnswer: 'Largest biotech startup ever; "cellular reprogramming" para reverse aging via Yamanaka factors'
        rationale:
          pt: 'Altos Labs (Hal Barron, Jeff Bezos, Yuri Milner backers): hired Shinya Yamanaka, Steve Horvath, Juan Carlos Izpisua Belmonte, Jennifer Doudna advisors. Focus partial reprogramming (transient OSKM expression) — Belmonte 2016 Cell: rejuvenation in progeroid mice. Calico (Google/Alphabet 2013): aging research. Other startups: Retro Biosciences, NewLimit (Brian Armstrong Coinbase), BioAge (FDA-listed). Geroscience boom.'
          en: 'Altos Labs (Hal Barron, Jeff Bezos, Yuri Milner backers): hired Shinya Yamanaka, Steve Horvath, Juan Carlos Izpisua Belmonte, Jennifer Doudna advisors. Focus on partial reprogramming (transient OSKM expression) — Belmonte 2016 Cell: rejuvenation in progeroid mice. Calico (Google/Alphabet 2013): aging research. Other startups: Retro Biosciences, NewLimit (Brian Armstrong Coinbase), BioAge (FDA-listed). Geroscience boom.'
        objectives: [Altos]
      - type: choice
        difficulty: 5
        question:
          pt: 'Loyal (San Francisco startup) busca FDA approval para…'
          en: 'Loyal (San Francisco startup) seeks FDA approval for…'
        choices:
          - 'LOY-002 dog lifespan extension; primeiro veterinary medicine for aging targeting metabolic'
          - 'Apenas humanos'
          - 'Sem qualquer aprovação'
          - 'Apenas em pediatric'
        correctAnswer: 'LOY-002 dog lifespan extension; primeiro veterinary medicine for aging targeting metabolic'
        rationale:
          pt: 'Loyal (Celine Halioua): targeting metabolic dysregulation em large/giant breed dogs (shorter lifespan than small). LOY-002: oral dose. FDA-CVM accepted reasonable expectation effectiveness 2023. STAY trial Phase 3 ~1300 dogs. Approval potential 2025+. Modelo: dogs como precursor humanos (genetic/environmental similarity). Dog Aging Project (Kaeberlein/Promislow) parallel research.'
          en: 'Loyal (Celine Halioua): targeting metabolic dysregulation in large/giant-breed dogs (shorter lifespan than small). LOY-002: oral dose. FDA-CVM accepted reasonable expectation of effectiveness 2023. STAY trial Phase 3 ~1300 dogs. Potential approval 2025+. Model: dogs as humans precursor (genetic/environmental similarity). Dog Aging Project (Kaeberlein/Promislow) parallel research.'
        objectives: [Loyal dogs]
      - type: choice
        difficulty: 5
        question:
          pt: 'Centenarians (>100 yo) studies (NECS Boston, Long Life Family Study) revelaram…'
          en: 'Centenarian studies (>100 yo, NECS Boston, Long Life Family Study) revealed…'
        choices:
          - 'Genetic loci (APOE2, FOXO3) + lifestyle clusters; "compression of morbidity" Fries'
          - 'Apenas trivial'
          - 'Sem qualquer pattern'
          - 'Apenas em pediatric'
        correctAnswer: 'Genetic loci (APOE2, FOXO3) + lifestyle clusters; "compression of morbidity" Fries'
        rationale:
          pt: 'NECS (New England Centenarian Study, Perls 1995+): ~2000 enrolled. Compression morbidity: centenarians delay disease until very late, healthier sustained. Genetic enrichment: APOE2 (vs APOE4 Alzheimer risk), FOXO3 (Willcox 2008), CETP. Heritability ~25-50% lifespan, +25% to centenarianism. Mediterranean blue zones: Sardinia, Okinawa, Loma Linda — overlap genetics + lifestyle.'
          en: 'NECS (New England Centenarian Study, Perls 1995+): ~2000 enrolled. Compression of morbidity: centenarians delay disease until very late, sustained healthier. Genetic enrichment: APOE2 (vs APOE4 Alzheimer risk), FOXO3 (Willcox 2008), CETP. Heritability ~25-50% lifespan, +25% to centenarianism. Mediterranean blue zones: Sardinia, Okinawa, Loma Linda — overlap genetics + lifestyle.'
        objectives: [Centenarians]
  - title:
      pt: 'Página 2 — Aplicações'
      en: 'Page 2 — Applications'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito "biological age" em clinical practice é…'
          en: '"Biological age" in clinical practice is…'
        choices:
          - 'Estimative integrating biomarkers (epigenetic, metabolomic, proteomic) reflecting true rate'
          - 'Apenas idade cronológica'
          - 'Sem qualquer aplicação'
          - 'Apenas em US'
        correctAnswer: 'Estimative integrating biomarkers (epigenetic, metabolomic, proteomic) reflecting true rate'
        rationale:
          pt: 'Biological age: composite metric. Tools: PhenoAge (Levine), GrimAge (Lu), DunedinPACE (Belsky). Companies: TruDiagnostic, Function Health, BioAge Labs. Direct-to-consumer testing growing. Use cases: lifestyle assessment, intervention monitoring, risk stratification. Limitations: validation across populations, actionability, eMVDdivers concerns.'
          en: 'Biological age: composite metric. Tools: PhenoAge (Levine), GrimAge (Lu), DunedinPACE (Belsky). Companies: TruDiagnostic, Function Health, BioAge Labs. Direct-to-consumer testing growing. Use cases: lifestyle assessment, intervention monitoring, risk stratification. Limitations: validation across populations, actionability, equity concerns.'
        objectives: [Biological age]
      - type: choice
        difficulty: 5
        question:
          pt: 'Klotho (gene encoding anti-aging protein) é interesante porque…'
          en: 'Klotho (gene encoding anti-aging protein) is interesting because…'
        choices:
          - 'Knockout mice show premature aging; KL-VS variant em humanos linked to longevity, cognition'
          - 'Apenas em pediatric'
          - 'Sem qualquer função'
          - 'Apenas em UK'
        correctAnswer: 'Knockout mice show premature aging; KL-VS variant em humanos linked to longevity, cognition'
        rationale:
          pt: 'Klotho (Kuro-o 1997 Nature): KO mice premature aging — atherosclerosis, osteoporosis, infertility, short lifespan. Overexpression extends lifespan ~30%. KL-VS heterozygotes humanos: increased longevity, better cognition (Dubal 2014). Therapeutic: Klotho protein/peptide (Unity Biosciences early dropped). Possible role in CKD, aging diseases.'
          en: 'Klotho (Kuro-o 1997 Nature): KO mice show premature aging — atherosclerosis, osteoporosis, infertility, short lifespan. Overexpression extends lifespan ~30%. KL-VS heterozygotes in humans: increased longevity, better cognition (Dubal 2014). Therapeutic: Klotho protein/peptide (Unity Biosciences early dropped). Possible role in CKD, aging diseases.'
        objectives: [Klotho]
      - type: choice
        difficulty: 5
        question:
          pt: 'GDF11 controvertido por…'
          en: 'GDF11 controversial because…'
        choices:
          - 'Wagers/Conboy 2014 GDF11 rejuvenated mice; 2015 reproducibility issues; Loffredo Sinclair scandal'
          - 'Sempre confirmed'
          - 'Sem qualquer impacto'
          - 'Apenas em pediatric'
        correctAnswer: 'Wagers/Conboy 2014 GDF11 rejuvenated mice; 2015 reproducibility issues; Loffredo Sinclair scandal'
        rationale:
          pt: 'GDF11: TGF-β family member declining com idade. Heterochronic parabiosis (old + young blood) reverse aging. Wagers/Sinclair Cell 2014: GDF11 specific factor. Egerman/Rapinoe 2015 contested: GDF11 antibody specificity issues, GDF11 may rise. Sinclair lab "Resveratrol scandal" related controversy. NewLimit using gene-editing reprogramming approach. Lesson: aging research bottlenecks reproducibility.'
          en: 'GDF11: TGF-β family member declining with age. Heterochronic parabiosis (old + young blood) reverses aging. Wagers/Sinclair Cell 2014: GDF11 specific factor. Egerman/Rapinoe 2015 contested: GDF11 antibody specificity issues, GDF11 may rise. Sinclair lab "Resveratrol scandal" related controversy. NewLimit using gene-editing reprogramming approach. Lesson: aging research reproducibility bottlenecks.'
        objectives: [GDF11]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em Alzheimer disease (AD) trials geroscience-relevant, anti-amyloid lecanemab (Leqembi)…'
          en: 'In Alzheimer disease (AD) trials geroscience-relevant, anti-amyloid lecanemab (Leqembi)…'
        choices:
          - 'First disease-modifying AD therapy approved (FDA 2023 full); ARIA edema/hemorrhage AE'
          - 'Apenas symptomatic'
          - 'Sem qualquer aprovação'
          - 'Apenas em pediatric'
        correctAnswer: 'First disease-modifying AD therapy approved (FDA 2023 full); ARIA edema/hemorrhage AE'
        rationale:
          pt: 'Lecanemab (Eisai/Biogen, Leqembi): anti-Aβ protofibril mAb. Clarity AD Phase 3 2022 NEJM: 27% decline reduction CDR-SB at 18 mo. FDA full approval jul/2023. ARIA (Amyloid-Related Imaging Abnormalities): edema/microhemorrhages 12-13%, sometimes severe. APOE4 homozygotes increased risk. Donanemab (Eli Lilly Kisunla 2024) similar. Symbolic: amyloid hypothesis vindicated parcially.'
          en: 'Lecanemab (Eisai/Biogen, Leqembi): anti-Aβ protofibril mAb. Clarity AD Phase 3 2022 NEJM: 27% CDR-SB decline reduction at 18 mo. FDA full approval Jul 2023. ARIA (Amyloid-Related Imaging Abnormalities): edema/microhemorrhages 12-13%, sometimes severe. APOE4 homozygotes at increased risk. Donanemab (Eli Lilly Kisunla 2024) similar. Symbolic: amyloid hypothesis partially vindicated.'
        objectives: [Lecanemab]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em frailty assessment, "Fried frailty phenotype" inclui 5 critérios…'
          en: 'In frailty assessment, "Fried frailty phenotype" includes 5 criteria…'
        choices:
          - 'Weight loss, exhaustion, slowness, weakness, low activity (≥3 = frail)'
          - 'Apenas idade'
          - 'Sem qualquer estrutura'
          - 'Apenas em pediatric'
        correctAnswer: 'Weight loss, exhaustion, slowness, weakness, low activity (≥3 = frail)'
        rationale:
          pt: 'Linda Fried (Hopkins, J Gerontol 2001): 5 criteria. ≥3 = frail; 1-2 = pre-frail. Aplicável geriatria. Predicts mortality, hospitalization, falls. Alternatives: Rockwood Clinical Frailty Scale (1-9), FRAIL questionnaire. Crítico em surgical/oncology decisions, identifying intervention candidates. Comprehensive Geriatric Assessment (CGA) extends.'
          en: 'Linda Fried (Hopkins, J Gerontol 2001): 5 criteria. ≥3 = frail; 1-2 = pre-frail. Applicable in geriatrics. Predicts mortality, hospitalization, falls. Alternatives: Rockwood Clinical Frailty Scale (1-9), FRAIL questionnaire. Critical in surgical/oncology decisions, identifying intervention candidates. Comprehensive Geriatric Assessment (CGA) extends.'
        objectives: [Frailty Fried]
      - type: choice
        difficulty: 5
        question:
          pt: 'Sarcopenia (age-related muscle loss) treatments emerging include…'
          en: 'Sarcopenia (age-related muscle loss) emerging treatments include…'
        choices:
          - 'Bimagrumab (myostatin/activin), apitegromab, GDF-15 inhibitors; resistance exercise + protein primary'
          - 'Apenas exercise'
          - 'Sem qualquer treatment'
          - 'Apenas para pediatric'
        correctAnswer: 'Bimagrumab (myostatin/activin), apitegromab, GDF-15 inhibitors; resistance exercise + protein primary'
        rationale:
          pt: 'Sarcopenia: ~30% adults >60 yo. Resistance training + protein 1.2-1.6g/kg primary (ESPEN). Pharmacologic: bimagrumab (Versanis, anti-ActRII) increases lean mass; apitegromab (Scholar Rock, myostatin SMA, also tested em sarcopenia). Foundational FNIH Sarcopenia Project criteria. ICD-10 code M62.84 added 2016. Pharmaceutical pipeline crescente — large market obesity-related muscle wasting.'
          en: 'Sarcopenia: ~30% adults >60 yo. Resistance training + protein 1.2-1.6g/kg primary (ESPEN). Pharmacologic: bimagrumab (Versanis, anti-ActRII) increases lean mass; apitegromab (Scholar Rock, myostatin SMA, also tested in sarcopenia). FNIH Sarcopenia Project foundational criteria. ICD-10 code M62.84 added 2016. Growing pharmaceutical pipeline — large market for obesity-related muscle wasting.'
        objectives: [Sarcopenia]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em centenarian biology, blue zones (Buettner) identificou…'
          en: 'In centenarian biology, blue zones (Buettner) identified…'
        choices:
          - 'Geographic clusters de centenários: Sardinia, Okinawa, Nicoya CR, Ikaria GR, Loma Linda CA'
          - 'Apenas em US'
          - 'Sem qualquer cluster'
          - 'Apenas histórico'
        correctAnswer: 'Geographic clusters de centenários: Sardinia, Okinawa, Nicoya CR, Ikaria GR, Loma Linda CA'
        rationale:
          pt: 'Dan Buettner (National Geographic): identified zones com longevity peculiar. Common factors: plant-based diet, modest exercise, social engagement, purpose, low stress, family. Critique: Newman 2024 demographic concerns — blue zones may have age inflation. Loma Linda Adventists: ~7-10y longer life vs Californians, attributed to vegetarian diet, no smoking/alcohol.'
          en: 'Dan Buettner (National Geographic): identified zones with peculiar longevity. Common factors: plant-based diet, modest exercise, social engagement, purpose, low stress, family. Critique: Newman 2024 demographic concerns — blue zones may have age inflation. Loma Linda Adventists: ~7-10y longer life vs Californians, attributed to vegetarian diet, no smoking/alcohol.'
        objectives: [Blue zones]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em geroscience trials, healthspan endpoints (vs lifespan) include…'
          en: 'In geroscience trials, healthspan endpoints (vs lifespan) include…'
        choices:
          - 'Composite multimorbidity, frailty, function, cognition; Healthy Aging Index (HAI)'
          - 'Apenas mortalidade'
          - 'Sem qualquer endpoint'
          - 'Apenas em pediatric'
        correctAnswer: 'Composite multimorbidity, frailty, function, cognition; Healthy Aging Index (HAI)'
        rationale:
          pt: 'Healthspan: years free of major disease. Endpoints: HAI (Sanders 2014, blood pressure, glucose, creatinine, FEV1, cognition), Multimorbidity Weighted Index (Wei), Aging Outcomes Composite (TAME). FDA Project Optimus, geroscience-specific endpoints. CDER + CDRH consultation. Goal: regulatory acceptability — single primary endpoint not "aging" abstractly.'
          en: 'Healthspan: years free of major disease. Endpoints: HAI (Sanders 2014, blood pressure, glucose, creatinine, FEV1, cognition), Multimorbidity Weighted Index (Wei), Aging Outcomes Composite (TAME). FDA Project Optimus, geroscience-specific endpoints. CDER + CDRH consultation. Goal: regulatory acceptability — single primary endpoint not abstract "aging".'
        objectives: [Healthspan endpoints]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em rapamycin humanos, Mannick lab (Resverza/Tornado/restorbio) testaram…'
          en: 'In rapamycin humans, Mannick lab (Resverza/Tornado/restorbio) tested…'
        choices:
          - 'Low-dose mTOR inhibitor reducing influenza/UTI infections em elderly (RTB101)'
          - 'Apenas teórico'
          - 'Sem qualquer trial'
          - 'Apenas em pediatric'
        correctAnswer: 'Low-dose mTOR inhibitor reducing influenza/UTI infections em elderly (RTB101)'
        rationale:
          pt: 'Joan Mannick: mTOR inhibition rejuvenates immune function. RTB101 (dactolisib analog): elderly Phase 2 reduzed RTI incidence. PROTECTOR trial Phase 3 falhou primary 2019; restorbio refocused. Evidence rapamycin-class can boost immunity. Encouraging continuing humans research; risk-benefit dosing crítico.'
          en: 'Joan Mannick: mTOR inhibition rejuvenates immune function. RTB101 (dactolisib analog): elderly Phase 2 reduced RTI incidence. PROTECTOR Phase 3 trial failed primary endpoint 2019; restorbio refocused. Evidence rapamycin-class can boost immunity. Encourages continued human research; critical risk-benefit dosing.'
        objectives: [Mannick rapamycin]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em "longevity escape velocity" (de Grey) é conceito que…'
          en: '"Longevity escape velocity" (de Grey) is concept that…'
        choices:
          - 'Annual increase in life expectancy > 1 year/year via repeated rejuvenation interventions'
