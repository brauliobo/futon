          - 'Apenas trivial'
          - 'Sem qualquer relação'
          - 'Apenas em UK'
        correctAnswer: 'Habitat shift, deforestation, vector range, livestock proximity, animal trade'
        rationale:
          pt: 'Carlson 2022 Nature: climate change shifting species range ~4000 cross-species transmission events 2070. Bat Henipavirus, coronaviruses expanding. Hendra Australia outbreaks correlate climatic. Mosquito vector range shift dengue, Zika, West Nile. Future zoonoses likely climate-amplified. Linkage One Health + Climate Health critical pandemic prevention.'
          en: 'Carlson 2022 Nature: climate change shifting species ranges to ~4000 cross-species transmission events by 2070. Bat Henipavirus, coronaviruses expanding. Hendra Australia outbreaks climatically correlated. Mosquito vector range shifts of dengue, Zika, West Nile. Future zoonoses likely climate-amplified. Critical One Health + Climate Health linkage for pandemic prevention.'
        objectives: [Climate zoonosis]
