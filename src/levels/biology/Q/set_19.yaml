      en: 'Page 2 — Adaptation and equity'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Em healthcare emissions, "Practice Greenhealth" e CleanMed are…'
          en: 'In healthcare emissions, "Practice Greenhealth" and CleanMed are…'
        choices:
          - 'US-based organizations engaging hospitals em sustainability practices, supply chain'
          - 'Apenas em UK'
          - 'Sem qualquer aplicação'
          - 'Apenas para academic'
        correctAnswer: 'US-based organizations engaging hospitals em sustainability practices, supply chain'
        rationale:
          pt: 'Practice Greenhealth (~1500 member US hospitals): Greenhealth Awards, climate commitments. CleanMed annual conference. Topics: anesthetic gases, single-use devices, food, energy. Joint Commission new sustainability standards 2023+. The Joint Commission "Sustainable Healthcare Certification" 2024. Organizations promoting climate-smart healthcare. Slow but accelerating.'
          en: 'Practice Greenhealth (~1500 member US hospitals): Greenhealth Awards, climate commitments. CleanMed annual conference. Topics: anesthetic gases, single-use devices, food, energy. Joint Commission new 2023+ sustainability standards. The Joint Commission "Sustainable Healthcare Certification" 2024. Organizations promoting climate-smart healthcare. Slow but accelerating.'
        objectives: [Practice Greenhealth]
