title:
  pt: 'Mudança Climática e Saúde Humana'
  en: 'Climate Change and Human Health'
level: Q
subject: biology
objectives:
  - 'Compreender Lancet Countdown indicators'
  - 'Reconhecer heat, vector-borne, food security'
  - 'Identificar mitigation co-benefits health'
  - 'Avaliar climate justice'
difficulty: 5
authorNotes: |
  Climate health. Lancet Countdown 2015+ annual reports. Heat-related deaths +167% since 1990s.
  PM2.5 air pollution ~6.7M deaths/year. Vector-borne expansion (dengue, malaria altitude/lat).
  Food insecurity. Mental health (climate anxiety). COP28 first Health Day (UAE 2023). NEHA
  (National Environmental Health Association). Healthy Climate Healthy Lives. Mitigation
  co-benefits (active transport, plant-based diet).
example:
  question:
    pt: 'Lancet Countdown (2015+) reports tracking climate-health…'
    en: 'Lancet Countdown (2015+) reports tracking climate-health…'
  choices:
    - 'Annual indicators de exposições, vulnerabilities, adaptation, mitigation, finance'
    - 'Apenas teórico'
    - 'Sem qualquer estrutura'
    - 'Apenas em UK'
  correctAnswer: 'Annual indicators de exposições, vulnerabilities, adaptation, mitigation, finance'
  rationale:
    pt: 'Lancet Countdown (Watts 2015+, multidisciplinary collaboration UK Wellcome Trust): annual indicators report. Heat-related mortality, vector-borne distribution, food security, occupational heat, wildfires, air pollution, climate-related migration, mental health. 2024 report: hottest year, vector expansion, AC inequity, fossil fuel subsidies. COP28 first Health Day 2023.'
    en: 'Lancet Countdown (Watts 2015+, multidisciplinary UK Wellcome Trust collaboration): annual indicators report. Heat-related mortality, vector-borne distribution, food security, occupational heat, wildfires, air pollution, climate-related migration, mental health. 2024 report: hottest year, vector expansion, AC inequity, fossil fuel subsidies. COP28 first Health Day 2023.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — Impactos diretos'
      en: 'Page 1 — Direct impacts'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Heat-related mortality em US elders increased…'
          en: 'Heat-related mortality in US elders has increased…'
        choices:
          - '167% sobre 1990s (Lancet Countdown 2024); ~489k heat-related deaths annually globally'
          - 'Apenas trivial'
          - 'Sem qualquer impacto'
          - 'Apenas em pediatric'
        correctAnswer: '167% sobre 1990s (Lancet Countdown 2024); ~489k heat-related deaths annually globally'
        rationale:
          pt: 'Heat: maior killer climate-related. 489k average heat-related deaths globally 2000-2019 (Zhao 2021 Lancet Planet Health). 2003 European heatwave: ~70k excess deaths. 2022 UK 41°C record. Phoenix 2024: 645 heat deaths. Worker outdoor heat: agricultural, construction. Adaptation: cooling centers, AC subsidies, urban planning (heat shelters, green space). Health-equity issue (LMIC, low-income).'
          en: 'Heat: largest climate-related killer. 489k average heat-related deaths globally 2000-2019 (Zhao 2021 Lancet Planet Health). 2003 European heatwave: ~70k excess deaths. 2022 UK 41°C record. Phoenix 2024: 645 heat deaths. Outdoor worker heat: agriculture, construction. Adaptation: cooling centers, AC subsidies, urban planning (heat shelters, green space). Health equity issue (LMIC, low-income).'
        objectives: [Heat mortality]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em air pollution, PM2.5 attribution para health…'
          en: 'In air pollution, PM2.5 attribution to health…'
        choices:
          - '~6.7M premature deaths/ano (CV, respiratory, lung câncer, dementia); WHO 2021 Air Quality Guidelines stricter'
          - 'Apenas trivial'
          - 'Sem qualquer impacto'
          - 'Apenas em US'
        correctAnswer: '~6.7M premature deaths/ano (CV, respiratory, lung câncer, dementia); WHO 2021 Air Quality Guidelines stricter'
        rationale:
          pt: 'PM2.5: WHO AQG 2021 reduced annual to <5 μg/m³ (from 10). Most countries não-compliant. India, China, Africa worst. Health: ~7M deaths annual (4 outdoor + 2.3 indoor cooking). Diseases: ischemic heart, stroke, lung cancer, COPD, lower respiratory infections, dementia (Calderón-Garcidueñas Mexico City). NO2, ozone, SO2 secondary. Wildfire smoke increasing.'
          en: 'PM2.5: WHO AQG 2021 reduced annual to <5 μg/m³ (from 10). Most countries not compliant. India, China, Africa worst. Health: ~7M annual deaths (4 outdoor + 2.3 indoor cooking). Diseases: ischemic heart, stroke, lung cancer, COPD, lower respiratory infections, dementia (Calderón-Garcidueñas Mexico City). Secondary NO2, ozone, SO2. Increasing wildfire smoke.'
        objectives: [Air pollution]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em vector-borne expansion, dengue cases globally crescendo because…'
          en: 'In vector-borne expansion, dengue cases globally rising because…'
        choices:
          - 'Aedes aegypti/albopictus latitude/altitude shift; ~5M cases reported 2024 (record)'
          - 'Apenas em LMIC'
          - 'Sem qualquer expansão'
          - 'Apenas em US'
        correctAnswer: 'Aedes aegypti/albopictus latitude/altitude shift; ~5M cases reported 2024 (record)'
        rationale:
          pt: 'Dengue 2024: ~14M reported globally (PAHO Americas alone ~13M). Climate suitability A. aegypti expanding. Brazil record. Florida, California autochthonous transmission 2023-2024. Qdenga (Takeda) 2-dose vaccine; Dengvaxia (Sanofi). Wolbachia World Mosquito Program reducing transmission Yogyakarta, Brazil. Climate driver clear.'
          en: 'Dengue 2024: ~14M reported globally (PAHO Americas alone ~13M). A. aegypti climate suitability expanding. Brazil record. Florida, California autochthonous transmission 2023-2024. Qdenga (Takeda) 2-dose vaccine; Dengvaxia (Sanofi). Wolbachia World Mosquito Program reducing transmission Yogyakarta, Brazil. Clear climate driver.'
        objectives: [Dengue rising]
      - type: choice
        difficulty: 5
        question:
          pt: 'Climate change e malária: contradictory because…'
          en: 'Climate change and malaria: contradictory because…'
        choices:
          - 'Some areas warmer suitable; others (low altitude) too hot. Net: highland Africa expanding, equatorial may decrease'
          - 'Apenas decrease'
          - 'Apenas increase universal'
          - 'Sem qualquer mudança'
        correctAnswer: 'Some areas warmer suitable; others (low altitude) too hot. Net: highland Africa expanding, equatorial may decrease'
        rationale:
          pt: 'Malaria: complex relationship. Anopheles latitude/altitude shifts. Rwanda highlands (Pascual 2023): dengue + malaria emerging. Ethiopian Plateau new exposure. Equatorial: temp >32°C inhibits parasite development. Net global: likely increase elsewhere replaces decrease. R21 vaccine + Wolbachia + dronoes spraying. Uneven impact.'
          en: 'Malaria: complex relationship. Anopheles latitude/altitude shifts. Rwanda highlands (Pascual 2023): dengue + malaria emerging. Ethiopian Plateau new exposure. Equatorial: temp >32°C inhibits parasite development. Net global: increase elsewhere likely replaces decrease. R21 vaccine + Wolbachia + drone spraying. Uneven impact.'
        objectives: [Malaria climate]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em food security, Lancet Countdown 2024 reportou…'
          en: 'In food security, Lancet Countdown 2024 reported…'
        choices:
          - 'Heatwaves +151 days drought-suitable since 1980; 151M food-insecure additionally'
          - 'Apenas estável'
          - 'Sem qualquer impacto'
          - 'Apenas em pediatric'
        correctAnswer: 'Heatwaves +151 days drought-suitable since 1980; 151M food-insecure additionally'
        rationale:
          pt: 'Climate-driven crop yield reductions, drought, fish stocks shifts. Wheat, maize, rice. EAT-Lancet Commission 2019: planetary health diet. Plant-based shift co-benefit (climate + health). Acid: ocean impact fisheries. Famine emergencies: Sudan, Gaza, DRC linked. Climate finance for adaptation crítico. CGIAR research crop varieties resilient.'
          en: 'Climate-driven crop yield reductions, drought, fish stock shifts. Wheat, maize, rice. EAT-Lancet Commission 2019: planetary health diet. Plant-based shift co-benefit (climate + health). Ocean acidification fisheries impact. Famine emergencies: Sudan, Gaza, DRC linked. Critical climate finance for adaptation. CGIAR research on resilient crop varieties.'
        objectives: [Food security]
      - type: choice
        difficulty: 5
        question:
          pt: 'Wildfire smoke health impact tornou-se notable em…'
          en: 'Wildfire smoke health impact has become notable in…'
        choices:
          - '2023 Canadian wildfires affected NE US tens of millions; CV/respiratory ED visits surge'
          - 'Apenas trivial'
          - 'Sem qualquer impacto'
          - 'Apenas em West Coast'
        correctAnswer: '2023 Canadian wildfires affected NE US tens of millions; CV/respiratory ED visits surge'
        rationale:
          pt: '2023 Canadian wildfires (record season): smoke crossed border, NYC AQI ~200+ jun/2023 days. CDC: ED asthma visits up 17% on smoke days. PM2.5 + ozone. Wildfires becoming endemic California, Australia "Black Summer" 2019-2020 (~3B animals affected). Health systems planning critical. Indoor air filtration, N95 masks, evacuation planning. Climate amplification.'
          en: '2023 Canadian wildfires (record season): smoke crossed border, NYC AQI ~200+ Jun 2023 days. CDC: ED asthma visits up 17% on smoke days. PM2.5 + ozone. Wildfires becoming endemic California, Australia "Black Summer" 2019-2020 (~3B animals affected). Critical health system planning. Indoor air filtration, N95 masks, evacuation planning. Climate amplification.'
        objectives: [Wildfire smoke]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em sea level rise + storm surge, public health concerns em coastal regions…'
          en: 'In sea level rise + storm surge, public health concerns in coastal regions…'
        choices:
          - 'Hospital flooding (Houston Harvey, NYC Sandy), waterborne disease, evacuation, displacement'
          - 'Apenas trivial'
          - 'Sem qualquer impacto'
          - 'Apenas em US'
        correctAnswer: 'Hospital flooding (Houston Harvey, NYC Sandy), waterborne disease, evacuation, displacement'
        rationale:
          pt: 'Hurricane Harvey 2017 (Houston): hospital evacuations dialysis disruption (Annas/Klitzman essay). Sandy 2012 (NYC): NYU Langone evacuation, Bellevue. Maria 2017 (Puerto Rico): healthcare collapse, ~3000 excess deaths. Climate-resilient health infrastructure: backup power, elevation. Climate-displaced healthcare workers. Migration health needs.'
          en: 'Hurricane Harvey 2017 (Houston): hospital evacuations, dialysis disruption (Annas/Klitzman essay). Sandy 2012 (NYC): NYU Langone evacuation, Bellevue. Maria 2017 (Puerto Rico): healthcare collapse, ~3000 excess deaths. Climate-resilient health infrastructure: backup power, elevation. Climate-displaced healthcare workers. Migration health needs.'
        objectives: [Storm surge]
      - type: choice
        difficulty: 5
        question:
          pt: 'Mental health impact climate change inclui…'
          en: 'Climate change mental health impact includes…'
        choices:
          - 'Climate anxiety, eco-grief, post-disaster PTSD, displacement trauma — Murthy 2023 Surgeon General'
          - 'Apenas físico'
          - 'Sem qualquer impacto'
          - 'Apenas em pediatric'
        correctAnswer: 'Climate anxiety, eco-grief, post-disaster PTSD, displacement trauma — Murthy 2023 Surgeon General'
        rationale:
          pt: 'Hickman 2021 Lancet Planet Health: ~60% youth (16-25) extremely worried climate. APA "ecoanxiety" recognition. Post-disaster mental health (Katrina, Sandy, Harvey, fires): PTSD, depression, suicide. Climate refugees mental health. Solastalgia (Albrecht): grief lost place. Adaptation: community-based, indigenous knowledge. Healthcare role: integrate em screening, education.'
          en: 'Hickman 2021 Lancet Planet Health: ~60% youth (16-25) extremely worried about climate. APA "ecoanxiety" recognition. Post-disaster mental health (Katrina, Sandy, Harvey, fires): PTSD, depression, suicide. Climate refugees'' mental health. Solastalgia (Albrecht): grief for lost place. Adaptation: community-based, indigenous knowledge. Healthcare role: integrate into screening, education.'
        objectives: [Climate MH]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em mitigation co-benefits, healthcare/climate intersection…'
          en: 'In mitigation co-benefits, healthcare/climate intersection…'
        choices:
          - 'Healthcare ~5% global emissions; NHS Net Zero 2040 leader; plant-based diet co-benefit'
          - 'Apenas trivial'
          - 'Sem qualquer interseção'
          - 'Apenas em US'
        correctAnswer: 'Healthcare ~5% global emissions; NHS Net Zero 2040 leader; plant-based diet co-benefit'
        rationale:
          pt: 'Health Care Without Harm: healthcare global emissions ~4.4% (~2 GtCO2e/yr). Largest contributors: US, EU, China healthcare. NHS England Net Zero by 2045 (direct), 2050 (supply). Specific: anesthetics (desflurane GWP 2540 vs sevoflurane 130). MDIs vs DPIs. Plant-based diets co-benefit (less CV, diabetes, environmental). Active transport: physical activity benefits.'
          en: 'Health Care Without Harm: global healthcare emissions ~4.4% (~2 GtCO2e/yr). Largest contributors: US, EU, China healthcare. NHS England Net Zero by 2045 (direct), 2050 (supply). Specifically: anesthetics (desflurane GWP 2540 vs sevoflurane 130). MDIs vs DPIs. Plant-based diet co-benefits (less CV, diabetes, environmental). Active transport: physical activity benefits.'
        objectives: [Mitigation co-benefits]
      - type: choice
        difficulty: 5
        question:
          pt: 'COP28 (Dubai 2023) primeira conferência inclui Health Day. Lessons…'
          en: 'COP28 (Dubai 2023) was first conference to include Health Day. Lessons…'
        choices:
          - 'Health framing engaja audiences além clima; ~120 countries signed Health Declaration'
          - 'Apenas histórico'
          - 'Sem qualquer impacto'
          - 'Apenas em US'
        correctAnswer: 'Health framing engaja audiences além clima; ~120 countries signed Health Declaration'
        rationale:
          pt: 'COP28 dec/2023: WHO Director-General + UN UAE Presidency dedicated Health Day. Health Declaration signed ~120 countries: integrate health em climate adaptation/mitigation, reduce emissions healthcare. $1B health-climate funding. Critique: limitada, Big Oil presence. COP29 Baku (2024) limited health presence. Climate justice emphasis growing.'
          en: 'COP28 Dec 2023: WHO Director-General + UN UAE Presidency dedicated Health Day. Health Declaration signed by ~120 countries: integrate health into climate adaptation/mitigation, reduce healthcare emissions. $1B health-climate funding. Critique: limited, Big Oil presence. COP29 Baku (2024) limited health presence. Growing climate justice emphasis.'
        objectives: [COP28]
