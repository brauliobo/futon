          - 'Apenas hospital construction'
          - 'Sem qualquer estrutura'
          - 'Apenas para US'
        correctAnswer: 'Heatwave preparedness, infrastructure flooding, supply chain, workforce, surveillance'
        rationale:
          pt: 'WHO 2015+ Operational Framework Building Climate Resilient and Environmentally Sustainable Health Systems: 10 components — leadership, workforce, vulnerability assessment, integrated surveillance, environmental health, services, financing, water/sanitation, energy, infrastructure. Costa Rica, Cape Verde leaders. NIH Climate Change and Health Initiative 2021+ research investment.'
          en: 'WHO 2015+ Operational Framework for Building Climate Resilient and Environmentally Sustainable Health Systems: 10 components — leadership, workforce, vulnerability assessment, integrated surveillance, environmental health, services, financing, water/sanitation, energy, infrastructure. Costa Rica, Cape Verde leaders. NIH Climate Change and Health Initiative 2021+ research investment.'
