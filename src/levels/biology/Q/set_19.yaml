          - 'Apenas reguladores'
          - 'Sem qualquer impacto'
          - 'Apenas em US'
        correctAnswer: 'Juliana v US (youth), Held v Montana (2023 youth victory), KlimaSeniorinnen Switzerland (2024 ECHR)'
        rationale:
          pt: 'Climate litigation (~2000 cases globally). Held v Montana 2023: youth won — Montana environmental rights. KlimaSeniorinnen Schweiz v Switzerland (2024 ECHR): Switzerland violated human rights (Article 8) by inadequate climate action — first ECHR climate case. Health/protection arguments. Pediatric, elderly health center argumentation. May influence policy. Urgenda Netherlands precedent 2019.'
          en: 'Climate litigation (~2000 cases globally). Held v Montana 2023: youth won — Montana environmental rights. KlimaSeniorinnen Schweiz v Switzerland (2024 ECHR): Switzerland violated human rights (Article 8) by inadequate climate action — first ECHR climate case. Health/protection arguments. Pediatric, elderly health center argumentation. May influence policy. Urgenda Netherlands precedent 2019.'
        objectives: [Climate litigation]
