          en: 'In climate-vulnerable populations…'
        choices:
          - 'Low-income, elderly, children, outdoor workers, indigenous, BIPOC bear disproportionate burden'
          - 'Uniformes'
          - 'Sem qualquer disparity'
          - 'Apenas em pediatric'
        correctAnswer: 'Low-income, elderly, children, outdoor workers, indigenous, BIPOC bear disproportionate burden'
        rationale:
          pt: 'Climate justice: those least responsible for emissions bear most impacts. US: Black, Hispanic, Native populations live em higher heat island areas, near refineries (Cancer Alley Louisiana). Outdoor workers (~30M agricultural, construction) heat-vulnerable. Children air pollution disproportionate (developing lungs). Climate Equity Act, Justice40 (Biden EO 14008).'
          en: 'Climate justice: those least responsible for emissions bear most impacts. US: Black, Hispanic, Native populations live in higher heat-island areas, near refineries (Cancer Alley Louisiana). Outdoor workers (~30M agriculture, construction) heat-vulnerable. Children disproportionate air pollution (developing lungs). Climate Equity Act, Justice40 (Biden EO 14008).'
        objectives: [Climate justice]
