          - 'Apenas teórico'
          - 'Sem qualquer aplicação'
          - 'Apenas em US'
        correctAnswer: 'Lancet Planetary Health journal 2017+; planetary health alliance Harvard'
        rationale:
          pt: 'Planetary Health (Whitmee Lancet 2015 Rockefeller Foundation): synthesis Earth + human health. Lancet Planetary Health journal 2017+. Planetary Health Alliance Harvard (Sam Myers). Educational: planetary health curriculum medical schools. Acknowledges interdependence: biodiversity, climate, oceans, soil — all underpin human health. EAT-Lancet 2019 planetary health diet. Holistic frame post-COVID.'
          en: 'Planetary Health (Whitmee Lancet 2015 Rockefeller Foundation): synthesis of Earth + human health. Lancet Planetary Health journal 2017+. Planetary Health Alliance Harvard (Sam Myers). Educational: planetary health curriculum in medical schools. Acknowledges interdependence: biodiversity, climate, oceans, soil — all underpin human health. EAT-Lancet 2019 planetary health diet. Holistic frame post-COVID.'
        objectives: [Planetary health]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em fossil fuel phase-out, health argument primário…'
          en: 'In fossil fuel phase-out, primary health argument…'
        choices:
          - 'Air pollution health saving + climate co-benefit; ~$2.6T global savings via phaseout'
          - 'Apenas economic'
          - 'Sem qualquer benefício'
          - 'Apenas em US'
        correctAnswer: 'Air pollution health saving + climate co-benefit; ~$2.6T global savings via phaseout'
        rationale:
          pt: 'Burnett 2018 Lancet Planet Health: PM2.5 attributable mortality ~9M/year. Vohra 2021 Environmental Research: fossil fuel-attributable PM2.5 ~8.7M/year. Phase-out saves lives + climate. Direct air capture vs renewables debated. Switching: heat pumps (gas furnaces), EVs (gasoline), solar/wind (coal/gas). Slow politically but accelerating.'
          en: 'Burnett 2018 Lancet Planet Health: PM2.5-attributable mortality ~9M/year. Vohra 2021 Environmental Research: fossil-fuel-attributable PM2.5 ~8.7M/year. Phase-out saves lives + climate. Direct air capture vs renewables debated. Switching: heat pumps (gas furnaces), EVs (gasoline), solar/wind (coal/gas). Slow politically but accelerating.'
        objectives: [Fossil phase-out]
      - type: choice
        difficulty: 5
        question:
