          - 'Apenas trivial'
          - 'Sem qualquer impacto'
          - 'Apenas em US'
        correctAnswer: 'Sea level rise (~1m by 2100), storm surge, fresh water salinization; Tuvalu, Maldives most at risk'
        rationale:
          pt: 'SIDS: ~38 island states. Tuvalu Foreign Minister Kofe knee-deep speech 2021. Marshall Islands radioactive contamination + climate. Public health: water scarcity, vector-borne, displacement. Migration: New Zealand "climate refugee" status pioneers. Adaptation finance: Loss and Damage Fund COP27 Egypt, operationalized COP28. Inadequate vs needs.'
          en: 'SIDS: ~38 island states. Tuvalu Foreign Minister Kofe knee-deep speech 2021. Marshall Islands radioactive contamination + climate. Public health: water scarcity, vector-borne, displacement. Migration: New Zealand "climate refugee" status pioneers. Adaptation finance: Loss and Damage Fund COP27 Egypt, operationalized COP28. Inadequate vs needs.'
