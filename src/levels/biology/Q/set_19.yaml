          en: 'In climate finance for health, Loss and Damage Fund COP28 operationalized…'
        choices:
          - '$700M initial pledges (vs ~$580B/yr LMIC needs); structurally incomplete'
          - '$1T fully funded'
          - 'Sem qualquer fund'
          - 'Apenas em US'
        correctAnswer: '$700M initial pledges (vs ~$580B/yr LMIC needs); structurally incomplete'
        rationale:
          pt: 'Loss and Damage Fund: agreed COP27 Sharm el-Sheikh 2022, operationalized COP28 Dubai 2023. Hosted by World Bank temporarily. Initial pledges $700M (UAE 100M, Germany 100M, US $17.5M). Compared to LMIC adaptation needs ~$580B/year (UNEP gap report) — symbolic. Fairness: cumulative emissions vs vulnerability. WHO advocate health share.'
          en: 'Loss and Damage Fund: agreed COP27 Sharm el-Sheikh 2022, operationalized COP28 Dubai 2023. Hosted temporarily by World Bank. Initial $700M pledges (UAE 100M, Germany 100M, US $17.5M). Compared to LMIC adaptation needs ~$580B/year (UNEP gap report) — symbolic. Fairness: cumulative emissions vs vulnerability. WHO advocates for health share.'
        objectives: [L&D Fund]
