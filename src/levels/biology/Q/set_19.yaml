          - 'Apenas charity'
          - 'Sem qualquer impacto'
          - 'Apenas em US'
        correctAnswer: 'Networks training healthcare workers em climate-health communication, advocacy'
        rationale:
          pt: 'Physicians: trusted voice. Climate Health Aware (Google), Doctors for the Environment Australia, Climate Psychiatry Alliance, Climate Mental Health Network, Health Care Without Harm, Climate and Health Council. Curricular integration medical schools (NYU, Harvard, Brown). AAFP, AMA, ACP, APHA all issued climate statements. Patient counseling em air quality, heat preparedness emerging.'
          en: 'Physicians: trusted voice. Climate Health Aware (Google), Doctors for the Environment Australia, Climate Psychiatry Alliance, Climate Mental Health Network, Health Care Without Harm, Climate and Health Council. Curricular integration in medical schools (NYU, Harvard, Brown). AAFP, AMA, ACP, APHA all issued climate statements. Emerging patient counseling on air quality, heat preparedness.'
