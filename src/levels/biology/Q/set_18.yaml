        correctAnswer: Doubled depression/anxiety, suicidal ideation; social media role debated (Twenge, Haidt)
        rationale:
          pt: Murthy Surgeon General Advisory 2021: youth mental health crisis. CDC: ~57% high school girls reporting persistent sadness 2021 (~36% 2011). ED visits suicidal ideation up. Drivers: COVID disruption, smartphone/social media (Twenge "iGen", Haidt "Anxious Generation" 2024 thesis), academic pressure, climate anxiety. School-based interventions, parity legislation, training expansão emerging.
          en: Murthy Surgeon General Advisory 2021: youth mental health crisis. CDC: ~57% high school girls reporting persistent sadness 2021 (~36% 2011). ED visits for suicidal ideation up. Drivers: COVID disruption, smartphone/social media (Twenge "iGen", Haidt "Anxious Generation" 2024 thesis), academic pressure, climate anxiety. Emerging school-based interventions, parity legislation, training expansion.
        objectives: [Adolescent crisis]
  - title:
      pt: Página 2 — Aplicações
