title:
  pt: Saúde Mental e Drug Development Psiquiátrico
  en: Mental Health and Psychiatric Drug Development
level: Q
subject: biology
objectives:
  - Compreender ketamine, psilocybin, MDMA-assisted therapy
  - Reconhecer Spravato, GLP-1 mental, esketamine
  - Identificar SAINT TMS, deep brain stimulation
  - Avaliar mental health crisis pós-COVID
difficulty: 5
authorNotes: |
  Mental health renaissance. Krystal/Sanacora ketamine 2000s. Spravato (esketamine FDA 2019).
  Compass Pathways, MAPS MDMA-PTSD Phase 3 (Mitchell Nature 2021), FDA rejected aug/2024.
  Psilocybin Compass, Usona breakthrough therapy. SAINT TMS Stanford. DBS for depression.
  Adolescent mental health crisis. Loneliness epidemic Murthy 2023. Psychedelic policy. ICER
  reviews.
example:
  question:
    pt: Spravato (esketamine, J&J FDA mar/2019) é primeiro novel mechanism antidepressant em décadas, atuando via…
    en: Spravato (esketamine, J&J FDA Mar 2019) is first novel-mechanism antidepressant in decades, acting via…
  choices:
    - NMDA receptor antagonist (não monoaminergic) — rapid onset hours em treatment-resistant depression
    - Apenas SSRI
    - Sem qualquer mecanismo novo
    - Apenas em pediatric
  correctAnswer: NMDA receptor antagonist (não monoaminergic) — rapid onset hours em treatment-resistant depression
  rationale:
    pt: Esketamine intranasal (Janssen FDA 2019 TRD; 2020 MDD com suicidality). Krystal/Sanacora Yale 2000 first ketamine IV depression. NMDA antagonism → glutamate surge → BDNF → synaptogenesis (sinapticpharm theory). Rapid onset hours, vs SSRI weeks. REMS due dissociation. Novel paradigm psychiatry. Generic ketamine off-label widespread (~40% psychiatrists).
    en: Intranasal esketamine (Janssen FDA 2019 TRD; 2020 MDD with suicidality). Krystal/Sanacora Yale 2000 first IV ketamine depression. NMDA antagonism → glutamate surge → BDNF → synaptogenesis (synaptopharm theory). Rapid hours-onset, vs weeks for SSRI. REMS due to dissociation. Novel psychiatry paradigm. Off-label generic ketamine widespread (~40% of psychiatrists).
