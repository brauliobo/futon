        difficulty: 5
        question:
          pt: Em loneliness epidemic, Murthy 2023 Advisory descreveu…
          en: In loneliness epidemic, Murthy 2023 Advisory described…
        choices:
          - Public health risk equivalent to 15 cigarettes/day; isolation cardiovascular, dementia risk
          - Apenas social
          - Sem qualquer impacto
          - Apenas em pediatric
        correctAnswer: Public health risk equivalent to 15 cigarettes/day; isolation cardiovascular, dementia risk
        rationale:
          pt: Murthy 2023 Surgeon General Advisory "Our Epidemic of Loneliness and Isolation": ~50% adults report measurable loneliness. Health: 26% increased mortality, increased depression, dementia, CV. Risk equivalent ~15 cigarettes/day (Holt-Lunstad). UK Loneliness Minister 2018 first. Japan 2021 second. Connection-as-public-health. AARP "Connect2Affect". Crítico em older adults, post-COVID youth.
          en: Murthy 2023 Surgeon General Advisory "Our Epidemic of Loneliness and Isolation": ~50% adults report measurable loneliness. Health: 26% increased mortality, increased depression, dementia, CV. Risk equivalent ~15 cigarettes/day (Holt-Lunstad). UK Loneliness Minister 2018 first. Japan 2021 second. Connection-as-public-health. AARP "Connect2Affect". Critical in older adults, post-COVID youth.
        objectives: [Loneliness]
      - type: choice
        difficulty: 5
        question:
          pt: Em depression treatment, STAR*D landmark trial (2006) demonstrou…
          en: In depression treatment, landmark STAR*D trial (2006) demonstrated…
        choices:
          - Sequential SSRI/SNRI strategies; ~30% remission first SSRI; cumulative ~67% após 4 steps
          - Apenas first-line success
          - Sem qualquer benefício
          - Apenas em pediatric
        correctAnswer: Sequential SSRI/SNRI strategies; ~30% remission first SSRI; cumulative ~67% após 4 steps
        rationale:
          pt: STAR*D (Sequenced Treatment Alternatives Relieve Depression, Rush 2006): N=4041 MDD patients, 4 sequential treatment levels. Citalopram step 1: ~30% remission. Augmentation/switch step 2-4: cumulative ~67%. ~33% never remission. Drove "treatment-resistant depression" definition. Influences current algorithms. Recent reanalysis (Pigott 2023) controversial — original results may overestimate.
          en: STAR*D (Sequenced Treatment Alternatives Relieve Depression, Rush 2006): N=4041 MDD patients, 4 sequential treatment levels. Citalopram step 1: ~30% remission. Augmentation/switch step 2-4: cumulative ~67%. ~33% never remit. Drove "treatment-resistant depression" definition. Influences current algorithms. Recent reanalysis (Pigott 2023) controversial — original results may overestimate.
        objectives: [STAR*D]
      - type: choice
        difficulty: 5
        question:
          pt: Em psychiatric pharmacogenomics, GeneSight (Myriad), AvertD (Solvd) test panels para…
          en: In psychiatric pharmacogenomics, GeneSight (Myriad), AvertD (Solvd) panels for…
        choices:
          - CYP2D6, CYP2C19, SLC6A4 etc. predicting antidepressant response/AEs
          - Apenas para US
          - Sem qualquer aplicação
          - Apenas para pediatric
        correctAnswer: CYP2D6, CYP2C19, SLC6A4 etc. predicting antidepressant response/AEs
        rationale:
          pt: PGx-guided antidepressant testing: GeneSight (Myriad), Genomind GenecRx, NeuroPharmagen. CPIC guidelines: CYP2D6 + CYP2C19 affect tricyclics, paroxetine, citalopram, escitalopram metabolism. Combinatorial impact debatável (Greden GUIDED trial 2019 modest improvement). VA PRIME Care 2022 Phase 4 trial: pharmacogenetic-guided MDD reduced AE not response. Use crescente em real-world.
          en: PGx-guided antidepressant testing: GeneSight (Myriad), Genomind GeneRx, NeuroPharmagen. CPIC guidelines: CYP2D6 + CYP2C19 affect tricyclic, paroxetine, citalopram, escitalopram metabolism. Combinatorial impact debatable (Greden GUIDED trial 2019 modest improvement). VA PRIME Care 2022 Phase 4 trial: pharmacogenetic-guided MDD reduced AEs but not response. Growing real-world use.
        objectives: [PGx psy]
      - type: choice
        difficulty: 5
        question:
          pt: Em digital phenotyping de mental health (Insel "behavioral hallmark"), passive sensing…
          en: In mental health digital phenotyping (Insel "behavioral hallmark"), passive sensing…
        choices:
          - Smartphone usage, voice, sleep, motion as biomarkers de relapse, response (mindstrong, Beiwe)
          - Apenas survey manual
          - Sem qualquer aplicação
          - Apenas em US
        correctAnswer: Smartphone usage, voice, sleep, motion as biomarkers de relapse, response (mindstrong, Beiwe)
        rationale:
          pt: Tom Insel (ex-NIMH, Mindstrong, Vanna Health): digital phenotyping promise. Apps: Beiwe (Onnela Harvard), Mindstrong, Ginger.io (Headspace Health), Spring Health. Variables: typing speed, location, voice analysis, sleep. Detect early relapse depression, schizophrenia. Privacy concerns + variable predictive utility. Future: integrate com EHR, wearables.
          en: Tom Insel (ex-NIMH, Mindstrong, Vanna Health): digital phenotyping promise. Apps: Beiwe (Onnela Harvard), Mindstrong, Ginger.io (Headspace Health), Spring Health. Variables: typing speed, location, voice analysis, sleep. Detect early depression, schizophrenia relapse. Privacy concerns + variable predictive utility. Future: integrate with EHR, wearables.
        objectives: [Digital phenotyping]
      - type: choice
        difficulty: 5
        question:
          pt: Em alcohol use disorder (AUD), naltrexone, acamprosate, disulfiram são…
          en: In alcohol use disorder (AUD), naltrexone, acamprosate, disulfiram are…
        choices:
          - 3 FDA-approved medications, severely underused (~7% AUD patients receiving MAT)
          - Apenas in US
          - Sem qualquer aprovação
          - Apenas em pediatric
        correctAnswer: 3 FDA-approved medications, severely underused (~7% AUD patients receiving MAT)
        rationale:
          pt: AUD: ~30M US adults, ~140k deaths/ano. Naltrexone (1994 oral, 2006 Vivitrol injectable): opioid antagonist, reduces cravings/heavy drinking. Acamprosate (2004): glutamatergic stabilization, abstinence support. Disulfiram (1951): aversion. Underprescribed: stigma, knowledge gap, integration. Emerging: GLP-1 (semaglutide), psilocybin (Mitchell 2022 NEJM). MAT severely underutilized vs opioid MAT.
          en: AUD: ~30M US adults, ~140k deaths/year. Naltrexone (1994 oral, 2006 Vivitrol injectable): opioid antagonist, reduces cravings/heavy drinking. Acamprosate (2004): glutamatergic stabilization, abstinence support. Disulfiram (1951): aversion. Underprescribed: stigma, knowledge gap, integration. Emerging: GLP-1 (semaglutide), psilocybin (Mitchell 2022 NEJM). MAT severely underutilized vs opioid MAT.
        objectives: [AUD MAT]
      - type: choice
        difficulty: 5
        question:
          pt: O conceito "RDoC" (Research Domain Criteria, NIMH 2009) propõe…
          en: "RDoC" (Research Domain Criteria, NIMH 2009) concept proposes…
        choices:
          - Reorganizar mental disorders por dimensions transdiagnostic (negative valence, cognition, etc.)
          - Apenas DSM
          - Sem qualquer estrutura
          - Apenas para pediatric
        correctAnswer: Reorganizar mental disorders por dimensions transdiagnostic (negative valence, cognition, etc.)
        rationale:
          pt: RDoC (Insel/NIMH 2009-2014): research framework não substitui DSM clinical. Domains: negative valence, positive valence, cognition, social, arousal/regulatory, sensorimotor (added 2019). Constructs across units (genes, molecules, cells, circuits, physiology, behavior, paradigms, self-report). Aim: biology-based reclassification. Adopted in NIMH funding. Critique: unfeasible for clinical use; biomarkers slow.
          en: RDoC (Insel/NIMH 2009-2014): research framework, not replacing clinical DSM. Domains: negative valence, positive valence, cognition, social, arousal/regulatory, sensorimotor (added 2019). Constructs across units (genes, molecules, cells, circuits, physiology, behavior, paradigms, self-report). Aim: biology-based reclassification. Adopted in NIMH funding. Critique: unfeasible for clinical use; biomarkers slow.
        objectives: [RDoC]
      - type: choice
        difficulty: 5
        question:
          pt: Em suicide prevention, "988 Suicide & Crisis Lifeline" (US 2022) é…
          en: In suicide prevention, "988 Suicide & Crisis Lifeline" (US 2022) is…
        choices:
          - 3-digit call/text/chat helpline launched jul/2022; ~14M contacts first year
          - Apenas histórico
          - Sem qualquer programa
          - Apenas em US states
        correctAnswer: 3-digit call/text/chat helpline launched jul/2022; ~14M contacts first year
        rationale:
          pt: 988: ~14M contacts first year, ~25% increase volume. Connect to local crisis center (~200 across US). Funded HRSA + states (variable). Mobile crisis teams emerging. Texting growing format (especialmente youth). Spanish, ASL services. Veterans Crisis Line (988 + 1) integrated. Long-term: address upstream (community, social determinants). Companion: Mental Health Parity Addiction Equity Act enforcement.
          en: 988: ~14M contacts in first year, ~25% volume increase. Connects to local crisis center (~200 across US). Funded by HRSA + states (variable). Emerging mobile crisis teams. Texting a growing format (especially youth). Spanish, ASL services. Veterans Crisis Line (988 + 1) integrated. Long-term: address upstream (community, social determinants). Companion: Mental Health Parity Addiction Equity Act enforcement.
        objectives: [988]
      - type: choice
        difficulty: 5
        question:
          pt: Em LSD/mescaline classical psychedelics research renaissance, atual focus…
          en: In LSD/mescaline classical psychedelics research renaissance, current focus…
        choices:
          - MindMed LSD trial GAD; MAPS recovering; ibogaine for OUD/addictions Hopkins/UCSF
          - Apenas histórico
          - Sem qualquer trial
          - Apenas em US
        correctAnswer: MindMed LSD trial GAD; MAPS recovering; ibogaine for OUD/addictions Hopkins/UCSF
        rationale:
          pt: MindMed: LSD MM-120 Phase 2b GAD positive 2024 — first LSD modern. Phase 3 ongoing 2025. Compass, atai, Cybin investigating. Ibogaine (sleeping pill plant Tabernanthe iboga, Africa): OUD/methamphetamine. Stanford Williams 2024 Nat Med veteran TBI/PTSD ibogaine + magnesium positive. Schedule I em US complicated. Mexico, Brazil clinics legal. Mesoamerica peyote indigenous use protected.
          en: MindMed: LSD MM-120 Phase 2b GAD positive 2024 — first modern LSD. Phase 3 ongoing 2025. Compass, atai, Cybin investigating. Ibogaine (sleep-inducing plant Tabernanthe iboga, Africa): OUD/methamphetamine. Stanford Williams 2024 Nat Med veteran TBI/PTSD ibogaine + magnesium positive. Schedule I in US complicated. Legal Mexico, Brazil clinics. Mesoamerica peyote indigenous use protected.
        objectives: [LSD ibogaine]
      - type: choice
        difficulty: 5
        question:
          pt: Em mental health workforce shortage, ~158M Americans em…
          en: In mental health workforce shortage, ~158M Americans in…
        choices:
          - Mental Health Professional Shortage Areas (MHPSAs); rural especialmente, only ~8k psychiatrists nationally
          - Sem qualquer shortage
          - Apenas em US states
          - Apenas em UK
        correctAnswer: Mental Health Professional Shortage Areas (MHPSAs); rural especialmente, only ~8k psychiatrists nationally
        rationale:
          pt: HRSA: MHPSAs cover ~158M US population. Psychiatrist shortage ~7000-8000 nationally. Emerging: psychiatric NPs (DNP-PMHNP), psychologists (psychotherapy), social workers + LMFTs. Telepsychiatry, ECHO model expanding. Brazil similar challenges. Workforce pipeline (medical school psych shortage). MOOCs, RMNet expansion. Burnout post-COVID exacerbating.
          en: HRSA: MHPSAs cover ~158M US population. Psychiatrist shortage ~7000-8000 nationally. Emerging: psychiatric NPs (DNP-PMHNP), psychologists (psychotherapy), social workers + LMFTs. Telepsychiatry, ECHO model expanding. Brazil similar challenges. Workforce pipeline (psych medical school shortage). MOOCs, RMNet expansion. Post-COVID burnout exacerbating.
        objectives: [MH workforce]
      - type: choice
        difficulty: 5
        question:
          pt: Em gender-affirming care, hormone therapy for transgender adolescents…
          en: In gender-affirming care, hormone therapy for transgender adolescents…
        choices:
          - Endocrine Society/WPATH guidelines support; UK/Sweden 2023 restricted; political debate intense
          - Apenas para US
          - Sem qualquer guideline
          - Apenas histórico
        correctAnswer: Endocrine Society/WPATH guidelines support; UK/Sweden 2023 restricted; political debate intense
        rationale:
          pt: WPATH SOC8 (2022), Endocrine Society 2017: support puberty blockers (GnRH analogs), hormones em adolescents com gender dysphoria. UK Cass Review 2024: restricted blockers under-18 except trials (debated). Sweden, Finland restricted 2022. US: state-by-state laws (~25 ban gender-affirming care under 18). Politically contested. Long-term outcomes data limited.
          en: WPATH SOC8 (2022), Endocrine Society 2017: support puberty blockers (GnRH analogs), hormones in adolescents with gender dysphoria. UK Cass Review 2024: restricted under-18 blockers except trials (debated). Sweden, Finland restricted 2022. US: state-by-state laws (~25 ban gender-affirming care under 18). Politically contested. Limited long-term outcomes data.
        objectives: [Gender-affirming]
