    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: MDMA-assisted therapy para PTSD (MAPS Phase 3) status FDA…
          en: MDMA-assisted therapy for PTSD (MAPS Phase 3) FDA status…
        choices:
          - Mitchell 2021 Nature Medicine Phase 3 positive; FDA rejected ago/2024 (Lykos), demanding more data
          - Approved
          - Sem qualquer trial
          - Apenas em US
        correctAnswer: Mitchell 2021 Nature Medicine Phase 3 positive; FDA rejected ago/2024 (Lykos), demanding more data
        rationale:
          pt: MAPS (Multidisciplinary Association for Psychedelic Studies, Rick Doblin 1986+): MDMA-assisted therapy para PTSD. MAPP1 (Mitchell 2021 Nat Med) Phase 3: ~67% no longer met PTSD criteria vs 32% placebo. Lykos Therapeutics (MAPS PBC) submitted NDA. FDA Adv Comm vote contra ago/2024 (concerns trial integrity, blinding, abuse). FDA Complete Response Letter declining. Setback major para psychedelic medicine.
          en: MAPS (Multidisciplinary Association for Psychedelic Studies, Rick Doblin 1986+): MDMA-assisted therapy for PTSD. MAPP1 (Mitchell 2021 Nat Med) Phase 3: ~67% no longer met PTSD criteria vs 32% placebo. Lykos Therapeutics (MAPS PBC) submitted NDA. FDA Adv Comm voted against Aug 2024 (concerns over trial integrity, blinding, abuse). FDA Complete Response Letter declining. Major setback for psychedelic medicine.
        objectives: [MDMA PTSD]
      - type: choice
        difficulty: 5
        question:
          pt: Psilocybin para depressão em desenvolvimento por…
          en: Psilocybin for depression being developed by…
        choices:
          - Compass Pathways (COMP360 25mg) Phase 3 TRD; Usona Institute (synthetic) — FDA Breakthrough
          - Apenas histórico
          - Sem qualquer trial
          - Apenas em UK
        correctAnswer: Compass Pathways (COMP360 25mg) Phase 3 TRD; Usona Institute (synthetic) — FDA Breakthrough
        rationale:
          pt: Compass Pathways (LSE-listed): COMP360 synthetic psilocybin. Phase 2b (Goodwin 2022 NEJM): TRD significant benefit at 25mg. Phase 3 ongoing 2024+. Usona Institute (non-profit): MDD phase 3. FDA Breakthrough Therapy designations 2018-2019. UK MHRA, Australia TGA approvals controversial setting. Setting/integration session model (8h supervised). Cost ~$8-15k per session.
          en: Compass Pathways (LSE-listed): COMP360 synthetic psilocybin. Phase 2b (Goodwin 2022 NEJM): TRD significant benefit at 25mg. Phase 3 ongoing 2024+. Usona Institute (non-profit): MDD phase 3. FDA Breakthrough Therapy designations 2018-2019. UK MHRA, Australia TGA approvals controversial setting. Setting/integration session model (8h supervised). Cost ~$8-15k per session.
        objectives: [Psilocybin]
      - type: choice
        difficulty: 5
        question:
          pt: SAINT (Stanford Accelerated Intelligent Neuromodulation Therapy) é…
          en: SAINT (Stanford Accelerated Intelligent Neuromodulation Therapy) is…
        choices:
          - Accelerated TMS protocol (10 sessions/day × 5 days vs daily 6 weeks) FDA 2022 TRD
          - Apenas standard TMS
          - Sem qualquer aprovação
          - Apenas em pediatric
        correctAnswer: Accelerated TMS protocol (10 sessions/day × 5 days vs daily 6 weeks) FDA 2022 TRD
        rationale:
          pt: SAINT (Magnus Medical, formerly Stanford): repetitive TMS condensed 10 daily sessions × 5 days. Williams Stanford 2020 Am J Psychiatry: ~80% remission TRD. FDA cleared 2022. Compared to standard 6 wk daily: equivalent or superior em much shorter time. iTBS theta-burst pattern. Cost ~$10-15k.
          en: SAINT (Magnus Medical, formerly Stanford): repetitive TMS condensed to 10 daily sessions × 5 days. Williams Stanford 2020 Am J Psychiatry: ~80% TRD remission. FDA cleared 2022. Compared to standard 6-week daily: equivalent or superior in much shorter time. iTBS theta-burst pattern. Cost ~$10-15k.
        objectives: [SAINT TMS]
      - type: choice
        difficulty: 5
        question:
          pt: Em deep brain stimulation (DBS) for depression, status…
          en: In deep brain stimulation (DBS) for depression, status…
        choices:
          - Subgenual cingulate (Mayberg) target investigational; subgenualBROADEN trial limited; SCC-DBS individualized
          - Apenas approved
          - Sem qualquer aplicação
          - Apenas para pediatric
        correctAnswer: Subgenual cingulate (Mayberg) target investigational; subgenualBROADEN trial limited; SCC-DBS individualized
        rationale:
          pt: DBS para depression: Helen Mayberg 2005 Neuron — subgenual cingulate (SCC, Brodmann 25) target. Brodmann 25 hyperactivity TRD. BROADEN trial 2008-2017 (St. Jude/Abbott): futility-stopped 2013 mas long-term follow-up Mayberg 2024 mostrou efficacy delayed. Personalized targeting via tractography crescente. FDA HDE 2009. OCD DBS approved (Reclaim 2009). Investigational TRD.
          en: DBS for depression: Helen Mayberg 2005 Neuron — subgenual cingulate (SCC, Brodmann 25) target. Brodmann 25 hyperactivity in TRD. BROADEN trial 2008-2017 (St. Jude/Abbott): futility-stopped 2013 but Mayberg 2024 long-term follow-up showed delayed efficacy. Growing personalized targeting via tractography. FDA HDE 2009. OCD DBS approved (Reclaim 2009). Investigational TRD.
        objectives: [DBS depression]
      - type: choice
        difficulty: 5
        question:
          pt: GLP-1 agonists (semaglutide, tirzepatide) em mental health emerging because…
          en: GLP-1 agonists (semaglutide, tirzepatide) in mental health emerging because…
        choices:
          - Reduced suicidal ideation, alcohol use disorder, possibly depression in observational + early trials
          - Apenas para diabetes
          - Sem qualquer impacto
          - Apenas em pediatric
        correctAnswer: Reduced suicidal ideation, alcohol use disorder, possibly depression in observational + early trials
        rationale:
          pt: Wang/Volkow Nature 2024: EHR de millions usando semaglutide reduzed suicidal ideation, AUD, MDD vs other antidiabetics. Hypotheses: weight loss, brain GLP-1R, reward circuitry. EMA FAERS signal investigation 2023 — concluded no causal link suicide signal. Trials emerging: Novo Nordisk semaglutide AUD, depression. Could be major mental health implication.
          en: Wang/Volkow Nature 2024: EHR of millions using semaglutide reduced suicidal ideation, AUD, MDD vs other antidiabetics. Hypotheses: weight loss, brain GLP-1R, reward circuitry. EMA FAERS signal investigation 2023 — concluded no causal suicide signal link. Emerging trials: Novo Nordisk semaglutide AUD, depression. Could be major mental health implication.
        objectives: [GLP-1 mental]
      - type: choice
        difficulty: 5
        question:
          pt: Em ADHD, Akili EndeavorRx (FDA 2020 De Novo) é…
          en: In ADHD, Akili EndeavorRx (FDA 2020 De Novo) is…
        choices:
          - First video game-based DTx prescription FDA-cleared para pediatric ADHD
          - Apenas medication
          - Sem qualquer aprovação
          - Apenas para US
        correctAnswer: First video game-based DTx prescription FDA-cleared para pediatric ADHD
        rationale:
          pt: EndeavorRx (Akili 2020): action video game targeting attention via "interference processing". RCT mostrou improvement TOVA (Test of Variables Attention). FDA De Novo authorization. Public listing 2022; faltava reimbursement. Akili acquired 2024 by Virtual Therapeutics. DTx commercial challenges similar a Pear (failed 2023). Mental health DTx specific challenges remain.
          en: EndeavorRx (Akili 2020): action video game targeting attention via "interference processing". RCT showed TOVA (Test of Variables of Attention) improvement. FDA De Novo authorization. 2022 public listing; lacked reimbursement. Akili acquired 2024 by Virtual Therapeutics. Commercial DTx challenges similar to Pear (failed 2023). Mental health DTx specific challenges remain.
        objectives: [Akili]
      - type: choice
        difficulty: 5
        question:
          pt: Sage/Biogen Zurzuvae (zuranolone, ago/2023) é primeira oral…
          en: Sage/Biogen Zurzuvae (zuranolone, Aug 2023) is first oral…
        choices:
          - PPD-specific oral neurosteroid (allopregnanolone analog), GABA-A modulator, 14 dias
          - Apenas IV
          - Sem qualquer aprovação
          - Apenas em pediatric
        correctAnswer: PPD-specific oral neurosteroid (allopregnanolone analog), GABA-A modulator, 14 dias
        rationale:
          pt: Zuranolone (Sage/Biogen): oral 14-day course. FDA aprovação ago/2023 PPD only (não MDD non-PPD em adults — rejected dec/2023). Mechanism: positive allosteric GABA-A modulator. Predecessor: brexanolone (Zulresso 2019) IV 60h $30k. Zuranolone $16k easier. Real-world adoption growing. Sleepiness AE limits. Mental health innovation continuing.
          en: Zuranolone (Sage/Biogen): oral 14-day course. FDA approval Aug 2023 PPD only (not non-PPD MDD in adults — rejected Dec 2023). Mechanism: positive allosteric GABA-A modulator. Predecessor: brexanolone (Zulresso 2019) IV 60h $30k. Zuranolone $16k easier. Real-world adoption growing. Sleepiness AE limits. Mental health innovation continuing.
        objectives: [Zuranolone]
      - type: choice
        difficulty: 5
        question:
          pt: Em schizophrenia, KarXT (xanomeline-trospium, Bristol/Karuna 2024) é…
          en: In schizophrenia, KarXT (xanomeline-trospium, Bristol/Karuna 2024) is…
        choices:
          - First non-D2 antipsychotic em ~70 years; M1/M4 muscarinic agonist + peripheral antagonist
          - Apenas D2
          - Sem qualquer aprovação
          - Apenas em pediatric
        correctAnswer: First non-D2 antipsychotic em ~70 years; M1/M4 muscarinic agonist + peripheral antagonist
        rationale:
          pt: KarXT (xanomeline + trospium, Karuna Therapeutics, acquired BMS $14B 2024): xanomeline M1/M4 agonist (cognition + psychosis) + peripheral muscarinic antagonist trospium (limits side effects). FDA approval Cobenfy set/2024. Phase 3 EMERGENT trials. Novel mechanism: dopamine D2 monopolio rompido. Cognitive benefits potential beyond positive symptoms. Sucessor pipeline emerging. Era pós-D2.
          en: KarXT (xanomeline + trospium, Karuna Therapeutics, acquired by BMS $14B 2024): xanomeline M1/M4 agonist (cognition + psychosis) + peripheral muscarinic antagonist trospium (limits side effects). FDA Cobenfy approval Sep 2024. EMERGENT Phase 3 trials. Novel mechanism: dopamine D2 monopoly broken. Potential cognitive benefits beyond positive symptoms. Emerging successor pipeline. Post-D2 era.
        objectives: [KarXT]
      - type: choice
        difficulty: 5
        question:
          pt: Em opioid use disorder (OUD), buprenorphine (Suboxone) restrictions…
          en: In opioid use disorder (OUD), buprenorphine (Suboxone) restrictions…
        choices:
          - X-waiver removed 2023 (MAT Act, PHE legislation), DEA license suficiente para prescribe
          - Apenas specialists
          - Sem qualquer mudança
          - Apenas em US states
        correctAnswer: X-waiver removed 2023 (MAT Act, PHE legislation), DEA license suficiente para prescribe
        rationale:
          pt: Pre-2023: X-waiver required (8h training + DEA-X DEA registration). Limited prescribers. MAT Act (Mainstreaming Addiction Treatment) part of Consolidated Appropriations Act dec/2022, effective 2023: removed waiver. Any DEA-licensed prescriber can prescribe buprenorphine. Goal: address ~107k opioid overdose deaths 2023. Methadone OPD restrictions remain. Naloxone OTC 2023.
          en: Pre-2023: X-waiver required (8h training + DEA-X DEA registration). Limited prescribers. MAT Act (Mainstreaming Addiction Treatment) part of Consolidated Appropriations Act Dec 2022, effective 2023: removed waiver. Any DEA-licensed prescriber can prescribe buprenorphine. Goal: address ~107k opioid overdose deaths 2023. Methadone OPD restrictions remain. Naloxone OTC 2023.
        objectives: [MAT Act]
      - type: choice
        difficulty: 5
        question:
          pt: Em adolescent mental health crisis pós-COVID (Murthy Surgeon General 2021+)…
          en: In post-COVID adolescent mental health crisis (Murthy Surgeon General 2021+)…
        choices:
          - Doubled depression/anxiety, suicidal ideation; social media role debated (Twenge, Haidt)
          - Apenas trivial
          - Sem qualquer crise
