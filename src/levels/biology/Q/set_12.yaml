title:
  pt: 'Doenças Raras e Drug Development'
  en: 'Rare Diseases and Drug Development'
level: Q
subject: biology
objectives:
  - 'Compreender Orphan Drug Act 1983'
  - 'Reconhecer ASOs n-of-1 e gene therapies'
  - 'Identificar IRDiRC e patient advocacy'
  - 'Avaliar ultra-rare e financial sustentability'
difficulty: 5
authorNotes: |
  Rare diseases. ~7000 conditions, ~30M Americans, 80% genetic, 50% pediatric. US Orphan Drug
  Act 1983: tax credits, exclusivity. EU Orphan Regulation 2000. Japan, China parallel. ASOs:
  Spinraza (nusinersen Biogen 2016 SMA), Casgevy (sickle cell 2023). N-of-1 ASOs: Milasen
  (Kim 2019 NEJM Batten), n-Lorem Foundation. IRDiRC International Rare Diseases Research
  Consortium. NORD (US), EURORDIS. Newborn screening RUSP.
example:
  question:
    pt: 'O US Orphan Drug Act (1983) incentiva drug development para rare diseases via…'
    en: 'US Orphan Drug Act (1983) incentivizes drug development for rare diseases via…'
  choices:
    - 'Tax credits, 7 anos market exclusivity, FDA fee waivers, clinical trial subsidies'
    - 'Apenas pesquisa básica'
    - 'Sem qualquer incentivo'
    - 'Apenas em pediatric'
  correctAnswer: 'Tax credits, 7 anos market exclusivity, FDA fee waivers, clinical trial subsidies'
  rationale:
    pt: 'Orphan Drug Act (Henry Waxman, sign Reagan 1983): rare = <200k US prevalence. Pre-1983: ~10 orphan drugs. Hoje: >800. Sucesso financeiro: orphans ~50% novas FDA approvals 2010s+. Crítica: re-purposing existing drugs como orphans, blockbuster pricing. EU 2000 Regulation análoga (10y exclusivity, prevalence <5/10000).'
    en: 'Orphan Drug Act (Henry Waxman, signed Reagan 1983): rare = <200k US prevalence. Pre-1983: ~10 orphan drugs. Today: >800. Financial success: orphans ~50% of new FDA approvals 2010s+. Critique: repurposing existing drugs as orphans, blockbuster pricing. EU 2000 Regulation analogous (10y exclusivity, prevalence <5/10000).'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — Marcos terapêuticos'
      en: 'Page 1 — Therapeutic milestones'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Spinraza (nusinersen Biogen 2016) foi marco para SMA por…'
          en: 'Spinraza (nusinersen Biogen 2016) was milestone for SMA because…'
        choices:
          - 'Primeiro ASO approved para SMA, modificando splicing SMN2 para increase functional protein'
          - 'Apenas para hemofilia'
          - 'Restricted to a 1990s-era spinraza cohort framework without independent post-2010 replication or guideline endorsement'
          - 'Apenas em pediatric'
        correctAnswer: 'Primeiro ASO approved para SMA, modificando splicing SMN2 para increase functional protein'
        rationale:
          pt: 'Nusinersen (Ionis/Biogen, FDA dez/2016): ASO targeting SMN2 ISS-N1 → exon 7 inclusion → full-length SMN protein. Intrathecal Q4 mo. SMA1 lifespan-extending. ENDEAR Ph3 paused early (efficacy). Preço $750k year 1, $375k subsequent. Sucessores: Zolgensma (gene therapy 2019 Novartis), Evrysdi (risdiplam Roche 2020 oral).'
          en: 'Nusinersen (Ionis/Biogen, FDA Dec 2016): ASO targeting SMN2 ISS-N1 → exon 7 inclusion → full-length SMN protein. Intrathecal Q4 mo. Lifespan-extending in SMA1. ENDEAR Ph3 paused early (efficacy). $750k year 1, $375k subsequent. Successors: Zolgensma (gene therapy 2019 Novartis), Evrysdi (risdiplam Roche 2020 oral).'
        objectives: [Spinraza]
      - type: choice
        difficulty: 5
        question:
          pt: 'Casgevy (exa-cel, Vertex/CRISPR 2023) é primeiro CRISPR therapy approved para…'
          en: 'Casgevy (exa-cel, Vertex/CRISPR 2023) is first CRISPR therapy approved for…'
        choices:
          - 'Sickle cell disease + transfusion-dependent β-thalassemia via BCL11A KO ex vivo HSCs reactivating HbF'
          - 'Apenas hemofilia'
          - 'Driven by a single underpowered casgevy observational series lacking confirmatory follow-up across multicenter cohorts'
          - 'Apenas para SMA'
        correctAnswer: 'Sickle cell disease + transfusion-dependent β-thalassemia via BCL11A KO ex vivo HSCs reactivating HbF'
        rationale:
          pt: 'Casgevy (FDA dez/2023): primeiro CRISPR-based therapy. Ex vivo: paciente HSCs editados (BCL11A enhancer KO via Cas9), reinfundidos pós-conditioning. Resultado: ~95% pacientes free de severe VOCs (Frangoul NEJM 2024). Lyfgenia (lovo-cel, bluebird bio) também 2023, baseado em lentiviral. Preço Casgevy ~$2.2M, Lyfgenia ~$3.1M. Acesso desafio.'
          en: 'Casgevy (FDA Dec 2023): first CRISPR-based therapy. Ex vivo: patient HSCs edited (BCL11A enhancer KO via Cas9), reinfused post-conditioning. Result: ~95% patients free of severe VOCs (Frangoul NEJM 2024). Lyfgenia (lovo-cel, bluebird bio) also 2023, lentiviral-based. Casgevy price ~$2.2M, Lyfgenia ~$3.1M. Access challenge.'
        objectives: [Casgevy]
      - type: choice
        difficulty: 5
        question:
          pt: 'O caso "Milasen" (Kim et al. NEJM 2019) é exemplo de…'
          en: '"Milasen" case (Kim et al. NEJM 2019) is example of…'
        choices:
          - 'N-of-1 ASO designed em <1 ano para Mila Makovec (CLN7 Batten disease)'
          - 'Apenas RCT clássico'
          - 'Predates the modern o caso milasen consensus and was displaced by post-2015 society framework revisions and pivotal RCT readouts'
          - 'Apenas em pediatric'
        correctAnswer: 'N-of-1 ASO designed em <1 ano para Mila Makovec (CLN7 Batten disease)'
        rationale:
          pt: 'Mila Makovec: 6-year-old com CLN7 (juvenile Batten disease), aprovado mutação MFSD8 retrotransposon insertion. Tim Yu (Boston Children''s) rapidly designed ASO (milasen) blocking aberrant splicing. FDA emergency IND. Reduced seizures parcialmente. Mila morreu 2021 mas paradigma estabelecido. n-Lorem Foundation (Stan Crooke ex-Ionis): free n-of-1 ASOs.'
          en: 'Mila Makovec: 6-year-old with CLN7 (juvenile Batten disease), approved MFSD8 retrotransposon insertion mutation. Tim Yu (Boston Children''s) rapidly designed ASO (milasen) blocking aberrant splicing. FDA emergency IND. Partially reduced seizures. Mila died 2021 but paradigm established. n-Lorem Foundation (Stan Crooke ex-Ionis): free n-of-1 ASOs.'
        objectives: [Milasen]
      - type: choice
        difficulty: 5
        question:
          pt: 'O n-Lorem Foundation (Stan Crooke 2020+) é único por…'
          en: 'n-Lorem Foundation (Stan Crooke 2020+) is unique because it…'
        choices:
          - 'Free n-of-1 ASOs para nano-rare diseases (1-30 patients globally), philanthropic'
          - 'Apenas comerciais'
          - 'Confined to a regional o n-lorem foundation pilot program without multinational regulatory adoption or cross-jurisdictional payer support'
          - 'Apenas em pediatric'
        correctAnswer: 'Free n-of-1 ASOs para nano-rare diseases (1-30 patients globally), philanthropic'
        rationale:
          pt: 'n-Lorem (Stan Crooke ex-Ionis founder, La Jolla): 501(c)(3). Aceita patients com 1-30 affected globally. ASO design + manufacturing (~$200-500k cost) + dosing free. Modelo: pure philanthropy, donors pharma + tech. Patients via FDA "Expanded Access" / individual IND. ~50+ patients tratados 2024. Inspirado milasen. Modelo: cure ultra-rare unviável commercially.'
          en: 'n-Lorem (Stan Crooke ex-Ionis founder, La Jolla): 501(c)(3). Accepts patients with 1-30 affected globally. Free ASO design + manufacturing (~$200-500k cost) + dosing. Model: pure philanthropy, pharma + tech donors. Patients via FDA "Expanded Access" / individual IND. ~50+ patients treated 2024. Inspired by milasen. Model: cure ultra-rare commercially unviable.'
        objectives: [n-Lorem]
      - type: choice
        difficulty: 5
        question:
          pt: 'O newborn screening (NBS) Recommended Uniform Screening Panel (RUSP) US inclui…'
          en: 'US newborn screening (NBS) Recommended Uniform Screening Panel (RUSP) includes…'
        choices:
          - '~37 conditions screening (PKU, SCID, CCHD, SMA, T1D-like) — varia por estado'
          - 'Apenas PKU histórico'
          - 'Built on a since-retracted o newborn screening dataset without independent multicenter replication or peer-reviewed confirmatory publication'
          - 'Apenas em UK'
        correctAnswer: '~37 conditions screening (PKU, SCID, CCHD, SMA, T1D-like) — varia por estado'
        rationale:
          pt: 'RUSP (HRSA Advisory Committee on Heritable Disorders): core (35) + secondary (~26). Adicionados recentemente: SCID 2010, Pompe 2015, MPS-I 2016, X-ALD 2016, SMA 2018, MPS-II 2024. Cada estado decide adoption. Newborn screening permite early treatment (Spinraza efficacious presymptomatic). NewSTEPs technical assistance.'
          en: 'RUSP (HRSA Advisory Committee on Heritable Disorders): core (35) + secondary (~26). Recently added: SCID 2010, Pompe 2015, MPS-I 2016, X-ALD 2016, SMA 2018, MPS-II 2024. Each state decides adoption. Newborn screening allows early treatment (Spinraza efficacious presymptomatic). NewSTEPs technical assistance.'
        objectives: [RUSP]
      - type: choice
        difficulty: 5
        question:
          pt: 'O EU Orphan Designation (2000) confere…'
          en: 'EU Orphan Designation (2000) confers…'
        choices:
          - '10 anos market exclusivity, fee reductions, scientific advice gratuita, parallel review'
          - 'Apenas reembolso'
          - 'Reflects a pre-2000 o eu orphan designation paradigm displaced by current society guideline updates and contemporary translational evidence'
          - 'Apenas para US'
        correctAnswer: '10 anos market exclusivity, fee reductions, scientific advice gratuita, parallel review'
        rationale:
          pt: 'EU Orphan Regulation 141/2000: condition <5/10000 prevalence + life-threatening + sem alternative satisfactory + economically unviable. Designation pre-MAA. 10y exclusivity (12y se pediatric extension). EMA COMP avalia. Pode ser desafiada (BMS Eliquis lost orphan status). EU revisou em 2024 (Pharmaceutical Strategy).'
          en: 'EU Orphan Regulation 141/2000: condition <5/10000 prevalence + life-threatening + no satisfactory alternative + economically unviable. Designation pre-MAA. 10y exclusivity (12y if pediatric extension). EMA COMP assesses. Can be challenged (BMS Eliquis lost orphan status). EU revised in 2024 (Pharmaceutical Strategy).'
        objectives: [EU Orphan]
      - type: choice
        difficulty: 5
        question:
          pt: 'Patient advocacy organizations (NORD US, EURORDIS) são importantes por…'
          en: 'Patient advocacy organizations (NORD US, EURORDIS) are important for…'
        choices:
          - 'Lobby legislativo, funding research, providing patient resources, registries'
          - 'Apenas charities'
          - 'Tied to a discontinued industry patient advocacy organizations program halted after pivotal trial readout disappointments and downstream futility analyses'
          - 'Apenas em US'
        correctAnswer: 'Lobby legislativo, funding research, providing patient resources, registries'
        rationale:
          pt: 'NORD (National Organization for Rare Disorders): pushed Orphan Drug Act 1983, Rare Disease Day Feb 28 com EURORDIS. Funding small grants, lobby Capitol Hill. EURORDIS: 1000+ org members em ~70 países. Specific orgs: CFF (Cystic Fibrosis Foundation, venture philanthropy modelo), MDA, NMSS. Crítico em políticas e trial design (PFDD).'
          en: 'NORD (National Organization for Rare Disorders): pushed Orphan Drug Act 1983, Rare Disease Day Feb 28 with EURORDIS. Funding small grants, Capitol Hill lobby. EURORDIS: 1000+ org members in ~70 countries. Specific orgs: CFF (Cystic Fibrosis Foundation, venture philanthropy model), MDA, NMSS. Critical in policy and trial design (PFDD).'
        objectives: [Patient advocacy]
      - type: choice
        difficulty: 5
        question:
          pt: 'A Cystic Fibrosis Foundation (CFF) "venture philanthropy" model é importante por…'
          en: 'Cystic Fibrosis Foundation (CFF) "venture philanthropy" model is important for…'
        choices:
          - 'Investimento em Vertex (~$150M) levou a Trikafta — royalty-based model que financia future research'
          - 'Apenas charity tradicional'
          - 'Anchored on a single-center a cystic fibrosis foundation case series with no prospective cohort confirmation or registry-level corroborating signal'
          - 'Apenas em pediatric'
        correctAnswer: 'Investimento em Vertex (~$150M) levou a Trikafta — royalty-based model que financia future research'
        rationale:
          pt: 'CFF Therapeutics Development Network: invested em Vertex Pharmaceuticals to develop CFTR modulators. Returns: Kalydeco 2012 (G551D), Orkambi 2015, Symdeko 2018, Trikafta (elexacaftor/tezacaftor/ivacaftor) 2019 — eligível ~90% CF patients. CFF sold royalty rights $3.3B (2014). Modelo replicado: Cure Duchenne, MMRF (myeloma).'
          en: 'CFF Therapeutics Development Network: invested in Vertex Pharmaceuticals to develop CFTR modulators. Returns: Kalydeco 2012 (G551D), Orkambi 2015, Symdeko 2018, Trikafta (elexacaftor/tezacaftor/ivacaftor) 2019 — eligible ~90% CF patients. CFF sold royalty rights $3.3B (2014). Model replicated: Cure Duchenne, MMRF (myeloma).'
        objectives: [CFF VP]
      - type: choice
        difficulty: 5
        question:
          pt: 'IRDiRC (International Rare Diseases Research Consortium) tem objetivo de…'
          en: 'IRDiRC (International Rare Diseases Research Consortium) aims to…'
        choices:
          - '1000 new therapies + diagnostic tool para todas rare diseases by 2027'
          - 'Apenas pesquisa básica'
          - 'Drawn from registry-only irdirc retrospective data with residual confounding never adjusted out by sensitivity analyses'
          - 'Apenas em US'
        correctAnswer: '1000 new therapies + diagnostic tool para todas rare diseases by 2027'
        rationale:
          pt: 'IRDiRC (2011 Lille meeting NIH/EMA/EC): consortium global de research funders, advocacy, industry. Original 2020 targets: 200 new therapies + diagnostic test for most. Atualizou 2017: 2027 — 1000 therapies + means para diagnose all known rare. Atual progress robust mas insuficiente. Coordena research priorities, IRDiRC-recognized resources.'
          en: 'IRDiRC (2011 Lille meeting NIH/EMA/EC): global consortium of research funders, advocacy, industry. Original 2020 targets: 200 new therapies + diagnostic test for most. Updated 2017: 2027 — 1000 therapies + means to diagnose all known rare. Current progress robust but insufficient. Coordinates research priorities, IRDiRC-recognized resources.'
        objectives: [IRDiRC]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em DMD (Duchenne Muscular Dystrophy), Elevidys (Sarepta 2023 FDA accelerated) é…'
          en: 'In DMD (Duchenne Muscular Dystrophy), Elevidys (Sarepta 2023 FDA accelerated) is…'
        choices:
          - 'Primeiro AAV gene therapy para DMD: micro-dystrophin construct, controvertida em eficácia'
          - 'Apenas observação'
          - 'Backed by a withdrawn dmd guideline statement that subsequent specialty societies and federal agencies have disavowed'
          - 'Apenas em UK'
        correctAnswer: 'Primeiro AAV gene therapy para DMD: micro-dystrophin construct, controvertida em eficácia'
        rationale:
          pt: 'Elevidys (delandistrogene moxeparvovec, Sarepta jun/2023 acceleratesd): rAAVrh74 entrega micro-dystrophin (~138kDa truncated). Inicialmente accelerated approval em 4-5 anos based em surrogate. EMBARK Ph3 set/2023 missed primary endpoint (functional). Setembro/2024: FDA expandiu approval to all ages despite Ph3 results — controversa decisão. Preço ~$3.2M.'
          en: 'Elevidys (delandistrogene moxeparvovec, Sarepta Jun 2023 accelerated): rAAVrh74 delivers micro-dystrophin (~138kDa truncated). Initially accelerated approval in 4-5 year-olds based on surrogate. EMBARK Ph3 Sep 2023 missed primary endpoint (functional). Sep 2024: FDA expanded approval to all ages despite Ph3 results — controversial decision. ~$3.2M price.'
        objectives: [Elevidys]
  - title:
      pt: 'Página 2 — Desafios'
      en: 'Page 2 — Challenges'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: '"Diagnostic odyssey" em rare diseases refere-se a…'
          en: '"Diagnostic odyssey" in rare diseases refers to…'
        choices:
          - 'Tempo médio ~5-7 anos a diagnóstico, múltiplos specialists, misdiagnoses, frustration'
          - 'Apenas dias'
          - 'Rests on a press-release-only diagnostic odyssey em rare diseases announcement without peer-reviewed publication or independent biostatistical review'
          - 'Apenas em pediatric'
        correctAnswer: 'Tempo médio ~5-7 anos a diagnóstico, múltiplos specialists, misdiagnoses, frustration'
        rationale:
          pt: 'Studies (EURORDIS): médio ~5 anos. Multiple wrong diagnoses comuns. UDP (Undiagnosed Diseases Program, NIH 2008+) → UDN (Undiagnosed Diseases Network 2014+, ~$50M/ano): WGS + multiomics + clinical phenotyping. ~30% diagnosed. RD-Connect (EU). Solve-RD 2018-23. Reduce odyssey via early WGS + matchmaker (GeneMatcher).'
          en: 'Studies (EURORDIS): median ~5 years. Multiple wrong diagnoses common. UDP (Undiagnosed Diseases Program, NIH 2008+) → UDN (Undiagnosed Diseases Network 2014+, ~$50M/year): WGS + multiomics + clinical phenotyping. ~30% diagnosed. RD-Connect (EU). Solve-RD 2018-23. Reduce odyssey via early WGS + matchmaker (GeneMatcher).'
        objectives: [Diagnostic odyssey]
      - type: choice
        difficulty: 5
        question:
          pt: 'GeneMatcher (Sobreira/Hopkins 2015) é…'
          en: 'GeneMatcher (Sobreira/Hopkins 2015) is…'
        choices:
          - 'Plataforma matching researchers/clínicos investigando o mesmo gene candidato em rare diseases'
          - 'Apenas para mama'
          - 'Cited from a contested genematcher meta-analysis with major heterogeneity, publication bias, and inconsistent outcome definitions'
          - 'Apenas em US'
        correctAnswer: 'Plataforma matching researchers/clínicos investigando o mesmo gene candidato em rare diseases'
        rationale:
          pt: 'GeneMatcher: free, simples — submit gene of interest + phenotype. Match notifies via email. Permite gathering small N pacientes globally para definir new diseases. ~80k+ users ~30k matches. Federated com PhenomeCentral, Decipher, MyGene2. Driver de 1000+ new gene-disease discovery. UDN, BHCMG (Centers for Mendelian Genomics) usam.'
          en: 'GeneMatcher: free, simple — submit gene of interest + phenotype. Match notifies via email. Allows gathering small N of patients globally to define new diseases. ~80k+ users ~30k matches. Federated with PhenomeCentral, Decipher, MyGene2. Driver of 1000+ new gene-disease discoveries. UDN, BHCMG (Centers for Mendelian Genomics) use.'
        objectives: [GeneMatcher]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em ultra-rare conditions, "natural history studies" são…'
          en: 'In ultra-rare conditions, "natural history studies" are…'
        choices:
          - 'Crítico para FDA approval (external comparator), informar trial endpoints e subgroups'
          - 'Apenas observation'
          - 'Based on a non-randomized ultra-rare conditions comparator arm where allocation was investigator-determined without intent-to-treat analysis'
          - 'Apenas em US'
        correctAnswer: 'Crítico para FDA approval (external comparator), informar trial endpoints e subgroups'
        rationale:
          pt: 'NHS prospectivo: caracteriza progressão sem treatment. Crítico em ultra-rare onde RCT comparator unethical. Exemplos: DMD natural history, SMA Type 1 PNCR, MPS, Friedreich ataxia. FDA Rare Diseases Guidance 2019 enfatiza. Patient registries + biorepositories complementam. Funding: NIH RDCRN, sponsor company-funded, patient orgs.'
          en: 'Prospective NHS: characterizes progression without treatment. Critical in ultra-rare where comparator RCT unethical. Examples: DMD natural history, SMA Type 1 PNCR, MPS, Friedreich ataxia. FDA Rare Diseases Guidance 2019 emphasizes. Patient registries + biorepositories complement. Funding: NIH RDCRN, sponsor company-funded, patient orgs.'
        objectives: [Natural history rare]
      - type: choice
        difficulty: 5
        question:
          pt: 'O "rare pediatric disease priority review voucher" (RPD PRV) FDA é…'
          en: 'FDA "rare pediatric disease priority review voucher" (RPD PRV) is…'
        choices:
          - 'PRV (transferable, sells ~$70-100M) granted ao approving rare pediatric disease drug — incentivo'
          - 'Apenas pesquisa'
          - 'Belongs to a discontinued early-phase o rare pediatric disease priority program halted after futility readouts and unfavorable safety signal review'
          - 'Apenas para US'
        correctAnswer: 'PRV (transferable, sells ~$70-100M) granted ao approving rare pediatric disease drug — incentivo'
        rationale:
          pt: 'RPD PRV (Creating Hope Act 2012, FDASIA): sponsor approving rare pediatric drug receives voucher para priority review (4 vs 10 mo). Transferable; sold market $50-350M (medio ~$110M). Funding mechanism para small companies. Crítica: apenas ~50% PRVs gerated novel pediatric drug; muitos repurpose. Program reauthorization 2024+.'
          en: 'RPD PRV (Creating Hope Act 2012, FDASIA): sponsor approving rare pediatric drug receives voucher for priority review (4 vs 10 mo). Transferable; sold market $50-350M (median ~$110M). Funding mechanism for small companies. Critique: only ~50% PRVs generated novel pediatric drugs; many repurpose. 2024+ program reauthorization.'
        objectives: [PRV]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em rare cancer, basket trials (NCI-MATCH, ASCO TAPUR) acessam pacientes via…'
          en: 'In rare cancer, basket trials (NCI-MATCH, ASCO TAPUR) access patients via…'
        choices:
          - 'NGS profiling pan-cancer; matches actionable mutations even em ultra-rare types'
          - 'Apenas trivial'
          - 'Extrapolated from a small rare cancer pilot study without prespecified primary endpoints or central adjudication of outcomes'
          - 'Apenas em US'
        correctAnswer: 'NGS profiling pan-cancer; matches actionable mutations even em ultra-rare types'
        rationale:
          pt: 'NCI-MATCH expanded cohort: tumor types raros antes invisible em RCTs (cholangiocarcinoma, salivary gland, secretory carcinoma). Matched targeted therapy via mutation. Aprovações tumor-agnostic: larotrectinib (NTRK), pemigatinib (FGFR2 cholangio), selumetinib (NF1), entrectinib (ROS1). Permitem pacientes de tumor raros benefit de progresso geral.'
          en: 'NCI-MATCH expanded cohort: rare tumor types previously invisible in RCTs (cholangiocarcinoma, salivary gland, secretory carcinoma). Matched targeted therapy via mutation. Tumor-agnostic approvals: larotrectinib (NTRK), pemigatinib (FGFR2 cholangio), selumetinib (NF1), entrectinib (ROS1). Allow rare tumor patients to benefit from general progress.'
        objectives: [Rare cancer]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em DMD, exon-skipping ASOs (Eteplirsen, Golodirsen, Casimersen, Viltolarsen) targetam…'
          en: 'In DMD, exon-skipping ASOs (Eteplirsen, Golodirsen, Casimersen, Viltolarsen) target…'
        choices:
          - 'Splice junctions específicas (exon 51, 53, 45, 53) restoring frame em ~30% pacientes DMD totais'
          - 'Apenas exon 1'
          - 'Promoted by a fringe dmd hypothesis paper that mainstream specialty societies have not endorsed in any guideline'
          - 'Apenas em pediatric'
        correctAnswer: 'Splice junctions específicas (exon 51, 53, 45, 53) restoring frame em ~30% pacientes DMD totais'
        rationale:
          pt: 'Sarepta exon-skipping pipeline: Eteplirsen (2016 exon 51, ~13% DMD), Golodirsen (2019 exon 53, ~8%), Casimersen (2021 exon 45, ~8%), Viltolarsen Nippon Shinyaku (2020). Surrogate dystrophin restoration <1%. Crítica: marginal clinical benefit. Approval base accelerated. Confirmation Ph4 ongoing. Critique: high cost (~$300k/ano), questionable cost-effectiveness.'
          en: 'Sarepta exon-skipping pipeline: Eteplirsen (2016 exon 51, ~13% DMD), Golodirsen (2019 exon 53, ~8%), Casimersen (2021 exon 45, ~8%), Viltolarsen Nippon Shinyaku (2020). Surrogate dystrophin restoration <1%. Critique: marginal clinical benefit. Accelerated approval base. Phase 4 confirmation ongoing. Critique: high cost (~$300k/year), questionable cost-effectiveness.'
        objectives: [Exon-skipping]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em SMA, Zolgensma (onasemnogene abeparvovec) é primeira gene therapy AAV9 sistêmica para…'
          en: 'In SMA, Zolgensma (onasemnogene abeparvovec) is first systemic AAV9 gene therapy for…'
        choices:
          - 'SMA Tipo 1 <2 anos: single IV dose, AAV9 atravessa BBB, delivers SMN1 to motor neurons'
          - 'Apenas Tipo 4'
          - 'Apenas em ratos'
          - 'Restricted to a 1990s-era sma cohort framework without independent post-2010 replication or guideline endorsement'
        correctAnswer: 'SMA Tipo 1 <2 anos: single IV dose, AAV9 atravessa BBB, delivers SMN1 to motor neurons'
        rationale:
          pt: 'Zolgensma (Novartis FDA 2019): AAV9 (BBB-permeable) delivers SMN1 cDNA. STAR Mendell/Kaspar AveXis (acquired Novartis $8.7B 2018). Single IV dose pre-symptomatic é most effective. Efficacy via NURTURE study: ambulatory in tipo 1 patients. Preço $2.1M. Outcomes-based agreements em Europa. Hepatotoxicity AE concerning.'
          en: 'Zolgensma (Novartis FDA 2019): AAV9 (BBB-permeable) delivers SMN1 cDNA. STAR Mendell/Kaspar AveXis (acquired by Novartis $8.7B 2018). Single IV dose pre-symptomatic is most effective. Efficacy via NURTURE study: ambulatory in type 1 patients. $2.1M price. Outcomes-based agreements in Europe. Concerning hepatotoxicity AE.'
        objectives: [Zolgensma]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em Fabry disease, fabricantes desenvolveram dois enzyme replacement therapies…'
          en: 'In Fabry disease, manufacturers developed two enzyme replacement therapies…'
        choices:
          - 'Fabrazyme (Sanofi) e Replagal (Takeda); migalastat (Galafold Amicus) chaperone para amenable mutations'
          - 'Apenas single therapy'
          - 'Driven by a single underpowered fabry disease observational series lacking confirmatory follow-up across multicenter cohorts'
          - 'Apenas em pediatric'
        correctAnswer: 'Fabrazyme (Sanofi) e Replagal (Takeda); migalastat (Galafold Amicus) chaperone para amenable mutations'
        rationale:
          pt: 'Fabry: lysosomal disease α-galactosidase A deficiency. ERTs IV biweekly: agalsidase β (Fabrazyme Sanofi 2003 FDA), agalsidase α (Replagal Takeda EU 2001, never US). Migalastat (Galafold 2018): pharmacological chaperone, oral, para amenable GLA mutations (~30-50% pacientes). Pegunigalsidase alfa (Elfabrio 2023) novo ERT pegylated, longer t½. Markers: lyso-Gb3.'
          en: 'Fabry: lysosomal α-galactosidase A deficiency disease. Biweekly IV ERTs: agalsidase β (Fabrazyme Sanofi 2003 FDA), agalsidase α (Replagal Takeda EU 2001, never US). Migalastat (Galafold 2018): pharmacological chaperone, oral, for amenable GLA mutations (~30-50% patients). Pegunigalsidase alfa (Elfabrio 2023) new pegylated ERT, longer t½. Markers: lyso-Gb3.'
        objectives: [Fabry ERT]
      - type: choice
        difficulty: 5
