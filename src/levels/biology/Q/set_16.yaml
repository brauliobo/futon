title:
  pt: 'Medicina Reprodutiva e Saúde Materno-Fetal'
  en: 'Reproductive Medicine and Maternal-Fetal Health'
level: Q
subject: biology
objectives:
  - 'Compreender ART (IVF, ICSI, PGT)'
  - 'Reconhecer NIPT, fetal therapy'
  - 'Identificar maternal mortality e PE'
  - 'Avaliar legalidades pós-Dobbs'
difficulty: 5
authorNotes: |
  Reproductive medicine. Louise Brown 1978 first IVF. ICSI 1992 Palermo. PGT-A/M/SR. NIPT
  (cfDNA) 2011. NIH Maternal-Fetal Medicine Units (MFMU). Preeclampsia: Roberts/Maynard
  sFlt-1/PlGF biomarkers. CHIPS, ASPRE prevention. Cervical insufficiency. Dobbs v Jackson
  2022 US. UK Mitochondrial Replacement legalized 2015. Reproductive justice (SisterSong).
example:
  question:
    pt: 'O primeiro IVF (1978, Steptoe/Edwards UK) levou a Louise Brown nascendo. Edwards Nobel…'
    en: 'The first IVF (1978, Steptoe/Edwards UK) led to Louise Brown''s birth. Edwards Nobel…'
  choices:
    - '2010 Medicine; Steptoe morreu antes (Nobel não posthumous)'
    - 'Sem qualquer Nobel'
    - 1978
    - 'Apenas Steptoe'
  correctAnswer: '2010 Medicine; Steptoe morreu antes (Nobel não posthumous)'
  rationale:
    pt: 'Robert Edwards (Cambridge) + Patrick Steptoe (gynecology Manchester): IVF after ~10y work. Louise Brown jul/1978 Oldham. Edwards Nobel 2010 (Steptoe died 1988). ~10M IVF babies globalmente desde. Standardization: ovarian hyperstimulation (FSH/LH), oocyte retrieval, fertilization, transfer. ICSI (1992 Palermo) revolucionizou male factor.'
    en: 'Robert Edwards (Cambridge) + Patrick Steptoe (Manchester gynecology): IVF after ~10y work. Louise Brown Jul 1978 Oldham. Edwards 2010 Nobel (Steptoe died 1988). ~10M IVF babies globally since. Standardization: ovarian hyperstimulation (FSH/LH), oocyte retrieval, fertilization, transfer. ICSI (1992 Palermo) revolutionized male factor.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — ART e PGT'
      en: 'Page 1 — ART and PGT'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'PGT-A (Preimplantation Genetic Testing for Aneuploidy) é…'
          en: 'PGT-A (Preimplantation Genetic Testing for Aneuploidy) is…'
        choices:
          - 'Trofectoderma biopsy + NGS para identificar embriões euploides em IVF'
          - 'Apenas histológico'
          - 'Sem qualquer aplicação'
          - 'Apenas em UK'
        correctAnswer: 'Trofectoderma biopsy + NGS para identificar embriões euploides em IVF'
        rationale:
          pt: 'PGT-A (formerly PGS): biopsy ~5 cells trofectoderm Day 5/6 blastocyst → NGS para chromosome counting. Euploide → transfer. Reduce miscarriage, multiple pregnancy. Controvertido em mulheres jovens (mosaic biopsies, viability). STAR trial (Munne 2019) menos benefit que esperado. PGT-M (monogenic, BRCA), PGT-SR (structural rearrangements).'
          en: 'PGT-A (formerly PGS): biopsy ~5 trophectoderm cells Day 5/6 blastocyst → NGS for chromosome counting. Euploid → transfer. Reduces miscarriage, multiple pregnancy. Controversial in young women (mosaic biopsies, viability). STAR trial (Munne 2019) less benefit than expected. PGT-M (monogenic, BRCA), PGT-SR (structural rearrangements).'
        objectives: [PGT-A]
      - type: choice
        difficulty: 5
        question:
          pt: 'NIPT (Non-Invasive Prenatal Testing) detecta…'
          en: 'NIPT (Non-Invasive Prenatal Testing) detects…'
        choices:
          - 'cfDNA fetal ~10% maternal blood from 10 weeks; T13/18/21 + sex + microdeletions'
          - 'Apenas para US'
          - 'Apenas mães acima 35'
          - 'Sem qualquer aplicação'
        correctAnswer: 'cfDNA fetal ~10% maternal blood from 10 weeks; T13/18/21 + sex + microdeletions'
        rationale:
          pt: 'NIPT (Dennis Lo CUHK 1997 fetal Y; commercialized ~2011 Sequenom MaterniT21): cfDNA placental in maternal plasma. NGS quantifying chromosomal contributions. Sensitivity T21 ~99%. Companies: Sequenom Roche, Natera Panorama, Verinata Illumina. Expanded para microdeletions (DiGeorge, Prader-Willi), single-gene (cysticfibrosis). Cost ~$200-500. Replacing first-trimester combined screening.'
          en: 'NIPT (Dennis Lo CUHK 1997 fetal Y; commercialized ~2011 Sequenom MaterniT21): placental cfDNA in maternal plasma. NGS quantifying chromosomal contributions. T21 sensitivity ~99%. Companies: Sequenom Roche, Natera Panorama, Verinata Illumina. Expanded to microdeletions (DiGeorge, Prader-Willi), single-gene (cystic fibrosis). Cost ~$200-500. Replacing first-trimester combined screening.'
        objectives: [NIPT]
      - type: choice
        difficulty: 5
        question:
          pt: 'Mitochondrial replacement therapy (MRT, UK legalized 2015) prevenindo doenças mitocondriais usa…'
          en: 'Mitochondrial replacement therapy (MRT, UK legalized 2015) preventing mitochondrial diseases uses…'
        choices:
          - 'PNT (pronuclear transfer) ou MST (maternal spindle transfer) "three-parent baby"'
          - 'Apenas in vitro standard'
          - 'Sem qualquer técnica'
          - 'Apenas em US'
        correctAnswer: 'PNT (pronuclear transfer) ou MST (maternal spindle transfer) "three-parent baby"'
        rationale:
          pt: 'UK 2015 (HFEA legal): MRT para mitocondrial diseases (Leigh, MELAS). Newcastle (Doug Turnbull/Mary Herbert) center. PNT: pronuclei post-fertilization moved → donor enucleated zygote. MST: spindle transferred pre-fertilization. Mitalipov OHSU 2009 (macacos), 2016 first clinical (México, Zhang). UK first births ~2023 (Newcastle reports). US blocked by Congress.'
          en: 'UK 2015 (HFEA legal): MRT for mitochondrial diseases (Leigh, MELAS). Newcastle (Doug Turnbull/Mary Herbert) center. PNT: post-fertilization pronuclei moved → donor enucleated zygote. MST: spindle transferred pre-fertilization. Mitalipov OHSU 2009 (macaques), 2016 first clinical (Mexico, Zhang). UK first births ~2023 (Newcastle reports). US blocked by Congress.'
        objectives: [MRT]
      - type: choice
        difficulty: 5
        question:
          pt: 'Preeclampsia, complication HBP em ~5% gestações, é predita por…'
          en: 'Preeclampsia, HBP complication in ~5% pregnancies, is predicted by…'
        choices:
          - 'sFlt-1/PlGF ratio (Roberts/Maynard biomarkers); Doppler uterino; first-trimester combined model'
          - 'Apenas BP'
          - 'Sem qualquer biomarker'
          - 'Apenas em pediatric'
        correctAnswer: 'sFlt-1/PlGF ratio (Roberts/Maynard biomarkers); Doppler uterino; first-trimester combined model'
        rationale:
          pt: 'PE pathogen: placental sFlt-1 (anti-angiogenic) elevated, PlGF (pro-angiogenic) reduced. sFlt-1/PlGF >38 predicts. PROGNOSIS 2016 (Zeisler NEJM). Aspirin 81-150 mg from 12-16 weeks reduce PE risk em high-risk (ASPRE Rolnik 2017 NEJM). FMF first-trimester combined screening (BP + uterine Doppler + PAPP-A + PlGF). Roberts/Lim/Maynard pioneers.'
          en: 'PE pathogen: placental sFlt-1 (anti-angiogenic) elevated, PlGF (pro-angiogenic) reduced. sFlt-1/PlGF >38 predicts. PROGNOSIS 2016 (Zeisler NEJM). Aspirin 81-150 mg from 12-16 weeks reduces PE risk in high-risk (ASPRE Rolnik 2017 NEJM). FMF first-trimester combined screening (BP + uterine Doppler + PAPP-A + PlGF). Roberts/Lim/Maynard pioneers.'
        objectives: [PE prediction]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em fetal therapy, "fetoscopic surgery" tornou-se padrão para…'
          en: 'In fetal therapy, "fetoscopic surgery" became standard for…'
        choices:
          - 'TTTS (twin-twin transfusion) laser ablation, MMC (myelomeningocele) repair'
          - 'Apenas biopsy'
          - 'Sem qualquer aplicação'
          - 'Apenas em US'
        correctAnswer: 'TTTS (twin-twin transfusion) laser ablation, MMC (myelomeningocele) repair'
        rationale:
          pt: 'TTTS: monochorionic twins, fetal mortality ~80% sem treatment. Laser fotocoagulação anastomoses placentárias (Senat 2004 Eurofetus): mortality reduzida ~50%. MMC: MOMS trial 2011 NEJM — open fetal repair > postnatal (improved ambulation, less shunt). Fetoscopic minimally-invasive (Belfort, Kahr) emerging. Diaphragmatic hernia: tracheal occlusion balloon. Specialty fetal surgery centers (CHOP, BCM-TCH).'
          en: 'TTTS: monochorionic twins, ~80% fetal mortality without treatment. Laser photocoagulation of placental anastomoses (Senat 2004 Eurofetus): mortality reduced ~50%. MMC: MOMS trial 2011 NEJM — open fetal repair > postnatal (improved ambulation, less shunting). Minimally invasive fetoscopic (Belfort, Kahr) emerging. Diaphragmatic hernia: tracheal occlusion balloon. Specialty fetal surgery centers (CHOP, BCM-TCH).'
        objectives: [Fetoscopic surgery]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em vitro maturation (IVM) de oocytes ou tecido ovariano transplantation são…'
          en: 'In vitro maturation (IVM) of oocytes or ovarian tissue transplantation are…'
        choices:
          - 'Fertility preservation para câncer pediatric/young adult, sem stimulation hormonal'
          - 'Apenas IVF padrão'
          - 'Sem qualquer aplicação'
          - 'Apenas em pediatric'
        correctAnswer: 'Fertility preservation para câncer pediatric/young adult, sem stimulation hormonal'
        rationale:
          pt: 'Cancer chemo gonadotoxic. Pre-pubertal/urgent oncology: ovarian tissue cryopreservation + transplant pós-treatment. Donnez 2004 first live birth post-OTC. Endorsed ASRM 2019 standard. Now routine. Children: Lambertini reviews. Males: testicular tissue preservation experimental. Increasing demand pediatric oncology survivors.'
          en: 'Cancer chemo gonadotoxic. Pre-pubertal/urgent oncology: ovarian tissue cryopreservation + transplant post-treatment. Donnez 2004 first live birth post-OTC. ASRM 2019 endorsed as standard. Now routine. Children: Lambertini reviews. Males: experimental testicular tissue preservation. Increasing demand from pediatric oncology survivors.'
        objectives: [Fertility preservation]
      - type: choice
        difficulty: 5
        question:
          pt: 'Dobbs v Jackson (US Supreme Court 2022) revertendo Roe v Wade afetou…'
          en: 'Dobbs v Jackson (US Supreme Court 2022) overturning Roe v Wade affected…'
        choices:
          - 'Abortion access US estado-por-estado; impacto em maternal mortality, OB residency, IVF (Alabama 2024)'
          - 'Apenas em US'
          - 'Sem qualquer impacto'
          - 'Apenas histórico'
        correctAnswer: 'Abortion access US estado-por-estado; impacto em maternal mortality, OB residency, IVF (Alabama 2024)'
        rationale:
          pt: 'Dobbs jun/2022: states regulate abortion. ~50% women de reproductive age em states com restrictions. Texas, Idaho, Tennessee total/near-total bans com vague life exceptions. Maternal mortality crescendo nessas states (Idaho lost ~25% obstetricians 2022-2024). Idaho v Moyle 2024 EMTALA conflict. IVF: Alabama Supreme Court fev/2024 declarou embryos "extrauterine children" — paused IVF brevemente. Reproductive medicine impactado.'
          en: 'Dobbs Jun 2022: states regulate abortion. ~50% of reproductive-age women in states with restrictions. Texas, Idaho, Tennessee total/near-total bans with vague life exceptions. Maternal mortality rising in those states (Idaho lost ~25% obstetricians 2022-2024). Idaho v Moyle 2024 EMTALA conflict. IVF: Alabama Supreme Court Feb 2024 declared embryos "extrauterine children" — briefly paused IVF. Reproductive medicine impacted.'
        objectives: [Dobbs]
      - type: choice
        difficulty: 5
        question:
          pt: 'Maternal mortality em US (~32-50/100k) é highest em HIC porque…'
          en: 'Maternal mortality in US (~32-50/100k) is highest in HIC because…'
        choices:
          - 'Healthcare fragmented, racial disparities (Black 3-4x), access, postpartum gap'
          - 'Apenas idade'
          - 'Sem qualquer issue'
          - 'Apenas em pediatric'
        correctAnswer: 'Healthcare fragmented, racial disparities (Black 3-4x), access, postpartum gap'
        rationale:
          pt: 'US: ~32/100k 2022 (rose from ~12 in 1990). Outliers: UK ~10, Canada ~8, France ~9. Drivers: cardiovascular complications, hemorrhage, sepsis, mental health. Maternal Mortality Review Committees (MMRC) state-level. Black Maternal Health Momnibus Act 2021 12 bills. Postpartum Medicaid extension 12 mo (ACA, ARP). Doulas, midwifery models. Health equity central focus.'
          en: 'US: ~32/100k 2022 (rose from ~12 in 1990). Outliers: UK ~10, Canada ~8, France ~9. Drivers: cardiovascular complications, hemorrhage, sepsis, mental health. State-level Maternal Mortality Review Committees (MMRC). Black Maternal Health Momnibus Act 2021, 12 bills. Postpartum Medicaid 12-month extension (ACA, ARP). Doulas, midwifery models. Health equity central focus.'
        objectives: [US MM]
      - type: choice
        difficulty: 5
        question:
          pt: 'GLP-1 agonists (semaglutide, tirzepatide) em pregnancy…'
          en: 'GLP-1 agonists (semaglutide, tirzepatide) in pregnancy…'
        choices:
          - 'Recomenda-se discontinuation pré-conception ~2 mo; effects em ovulation/fertility (PCOS) emerging'
          - 'Apenas em pediatric'
          - 'Sem qualquer impacto'
          - 'Apenas trivial'
        correctAnswer: 'Recomenda-se discontinuation pré-conception ~2 mo; effects em ovulation/fertility (PCOS) emerging'
        rationale:
          pt: 'Semaglutide (Ozempic, Wegovy), tirzepatide (Mounjaro, Zepbound): contraindicated em pregnancy (limited data, fetal safety). Recomenda-se 2 mo pre-conception washout. Reports increased fertility em PCOS via weight loss. "Ozempic babies" anecdotal trend. Need formal trials. Lactation data limited; usually contraindicated.'
          en: 'Semaglutide (Ozempic, Wegovy), tirzepatide (Mounjaro, Zepbound): contraindicated in pregnancy (limited data, fetal safety). Recommended 2 mo pre-conception washout. Reports of increased fertility in PCOS via weight loss. "Ozempic babies" anecdotal trend. Formal trials needed. Lactation data limited; usually contraindicated.'
        objectives: [GLP-1 pregnancy]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em obstetrics, RSV maternal vaccine (Abrysvo Pfizer 2023) é importante por…'
          en: 'In obstetrics, maternal RSV vaccine (Abrysvo Pfizer 2023) is important for…'
        choices:
          - 'Transplacental antibody transfer protege bebê contra RSV severe primeiros 6 meses'
          - 'Apenas para mãe'
          - 'Sem qualquer aplicação'
          - 'Apenas em pediatric'
        correctAnswer: 'Transplacental antibody transfer protege bebê contra RSV severe primeiros 6 meses'
        rationale:
          pt: 'Abrysvo (Pfizer): RSVpreF vaccine. FDA mai/2023 idosos; ago/2023 maternal (32-36 wk gestational age). MATISSE trial 2023 NEJM: ~82% efficacy contra severe RSV LRTI < 90 dias. Alternative: nirsevimab (Beyfortus, monoclonal antibody) administered ao recém-nascido. RSV ~58k hospitalizações ano US <5 yo. Game-changer.'
          en: 'Abrysvo (Pfizer): RSVpreF vaccine. FDA May 2023 for elderly; Aug 2023 maternal (32-36 wk gestational age). MATISSE trial 2023 NEJM: ~82% efficacy against severe RSV LRTI <90 days. Alternative: nirsevimab (Beyfortus, monoclonal antibody) given to newborn. RSV ~58k hospitalizations/year US <5 yo. Game-changer.'
        objectives: [RSV maternal]
  - title:
      pt: 'Página 2 — Inovações e desafios'
      en: 'Page 2 — Innovations and challenges'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'In vitro gametogenesis (IVG) em camundongo demonstrado por Hayashi (Kyoto/Osaka) faz…'
          en: 'In vitro gametogenesis (IVG) in mouse demonstrated by Hayashi (Kyoto/Osaka) makes…'
        choices:
          - 'iPSC → primordial germ cells → mature oocytes/sperm em laboratório, live offspring'
          - 'Apenas em humanos'
          - 'Sem qualquer demonstração'
          - 'Apenas em US'
        correctAnswer: 'iPSC → primordial germ cells → mature oocytes/sperm em laboratório, live offspring'
        rationale:
          pt: 'Katsuhiko Hayashi (Kyushu): iPSC → PGCLCs → in vitro maturation em ovário/testículo construct → live mice (Hikabe 2016 Nature). 2023: oocytes from male iPSC (XX → XY duplicated). Human IVG ~5-10y away. Implications: reproductive options para post-menopausal, same-sex couples, infertility. Bioethics (Greely "End of Sex"): cherry-picking embryos, eugenics concerns.'
          en: 'Katsuhiko Hayashi (Kyushu): iPSC → PGCLCs → in vitro maturation in ovarian/testicular construct → live mice (Hikabe 2016 Nature). 2023: oocytes from male iPSC (XX → XY duplicated). Human IVG ~5-10y away. Implications: reproductive options for post-menopausal, same-sex couples, infertility. Bioethics (Greely "End of Sex"): embryo cherry-picking, eugenics concerns.'
        objectives: [IVG]
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito "social egg freezing" cresceu por…'
          en: '"Social egg freezing" grew because of…'
        choices:
          - 'ASRM 2012 removed "experimental" label; companies (Apple, Google, Meta) covering benefit'
          - 'Apenas pesquisa'
          - 'Sem qualquer expansão'
          - 'Apenas em pediatric'
        correctAnswer: 'ASRM 2012 removed "experimental" label; companies (Apple, Google, Meta) covering benefit'
        rationale:
          pt: 'Vitrification (Kuwayama 2005) tornou egg freezing viável vs slow-freeze. ASRM/SART 2012 endorsed (no longer "experimental"). Tech companies adicionaram benefit (~$15-25k coverage). Crescimento: ~12k cycles 2014 → ~30k cycles 2022 US. Outcomes: live birth ~30-40% per egg thawed. Legal questions custody, divorce. Crítica: marketed as "insurance" mas success not guaranteed.'
          en: 'Vitrification (Kuwayama 2005) made egg freezing viable vs slow-freeze. ASRM/SART 2012 endorsed (no longer "experimental"). Tech companies added benefit (~$15-25k coverage). Growth: ~12k cycles 2014 → ~30k cycles 2022 US. Outcomes: live birth ~30-40% per thawed egg. Legal questions on custody, divorce. Critique: marketed as "insurance" but success not guaranteed.'
        objectives: [Egg freezing]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em fetal medicine, "fetal cellular therapy" é experimental para…'
          en: 'In fetal medicine, "fetal cellular therapy" is experimental for…'
        choices:
          - 'α-thalassemia major in utero stem cell transplant; UCSF Mackenzie 2018+ Phase I'
          - 'Apenas pediatric pós-natal'
          - 'Sem qualquer aplicação'
          - 'Apenas histórica'
        correctAnswer: 'α-thalassemia major in utero stem cell transplant; UCSF Mackenzie 2018+ Phase I'
        rationale:
          pt: 'α-thalassemia major (4-α-globin gene deletion): hydrops fetalis, lethal. Tippi MacKenzie/UCSF 2018+ trial: in-utero hematopoietic stem cell transplant (HSCT) maternal CD34+. Clinical benefits emerging. Other potential targets: SCID, sickle cell, immunodeficiency, fetal stem cell rescue. Regulatory novel territory. ISFETET Society for Fetal Therapy.'
          en: 'α-thalassemia major (4-α-globin gene deletion): hydrops fetalis, lethal. Tippi MacKenzie/UCSF 2018+ trial: in-utero hematopoietic stem cell transplant (HSCT) maternal CD34+. Clinical benefits emerging. Other potential targets: SCID, sickle cell, immunodeficiency, fetal stem cell rescue. Novel regulatory territory. ISFETET Society for Fetal Therapy.'
        objectives: [Fetal therapy]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em embryo research, "14-day rule" (1979 Warnock) está sob revisão. ISSCR 2021 propõe…'
          en: 'In embryo research, "14-day rule" (1979 Warnock) is under revision. ISSCR 2021 proposes…'
        choices:
          - 'Case-by-case extension além de 14 dias com peer review (não absolute limit)'
          - 'Apenas hard limit'
          - 'Sem qualquer mudança'
          - 'Apenas em US'
        correctAnswer: 'Case-by-case extension além de 14 dias com peer review (não absolute limit)'
        rationale:
          pt: '14-day rule (UK Warnock Committee 1984, derived 1979): primitive streak appears, individual personhood. Adopted globally. Ate 2016, technically infeasível go past. Now: micro-fluidic cultures sustain >14 days (Shahbazi/Zernicka-Goetz 2016). ISSCR Guidelines 2021: case-by-case oversight beyond 14 days. Modelos blastoide (Rivron, Yi Liu) raise novel questions.'
          en: '14-day rule (UK Warnock Committee 1984, derived 1979): primitive streak appears, individual personhood. Adopted globally. Until 2016, technically infeasible to go past. Now: micro-fluidic cultures sustain >14 days (Shahbazi/Zernicka-Goetz 2016). ISSCR Guidelines 2021: case-by-case oversight beyond 14 days. Blastoid models (Rivron, Yi Liu) raise novel questions.'
        objectives: [14-day rule]
      - type: choice
        difficulty: 5
        question:
          pt: 'Pre-conception PGT-M (Preimplantation Genetic Testing for Monogenic disorders) usa…'
          en: 'Pre-conception PGT-M (Preimplantation Genetic Testing for Monogenic disorders) uses…'
        choices:
          - 'PCR/NGS de embryos para BRCA, HD, CFTR, etc., em couples at risk'
          - 'Apenas para mãe'
          - 'Sem qualquer aplicação'
          - 'Apenas em UK'
        correctAnswer: 'PCR/NGS de embryos para BRCA, HD, CFTR, etc., em couples at risk'
        rationale:
          pt: 'PGT-M: customized assays para mutation conhecida do casal. Aplicações: dominant (Huntington, BRCA), recessive (CF, sickle cell), X-linked (DMD, hemofilia). Combined com HLA-matching para "savior siblings" (treating affected sibling com cord blood — controvertido). ESHRE/PGDIS quality standards. Insurance coverage variável. Allows healthy embryo selection without abortion.'
          en: 'PGT-M: customized assays for known couple mutation. Applications: dominant (Huntington, BRCA), recessive (CF, sickle cell), X-linked (DMD, hemophilia). Combined with HLA-matching for "savior siblings" (treating affected sibling with cord blood — controversial). ESHRE/PGDIS quality standards. Variable insurance coverage. Allows healthy embryo selection without abortion.'
        objectives: [PGT-M]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em delivery, "VBAC" (Vaginal Birth After Cesarean) success rate é…'
          en: 'In delivery, "VBAC" (Vaginal Birth After Cesarean) success rate is…'
        choices:
          - '~70-75% em low-risk com prior single low-transverse incision; uterine rupture ~0.5%'
          - 'Sempre cesarean'
          - 'Sem qualquer success'
          - 'Apenas em pediatric'
        correctAnswer: '~70-75% em low-risk com prior single low-transverse incision; uterine rupture ~0.5%'
        rationale:
          pt: 'TOLAC (Trial of Labor After Cesarean): success VBAC ~70-75% se candidate appropriate. Risks: uterine rupture ~0.5-1%. ACOG 2017/2024 guidance: TOLAC offered, hospital com immediate access cesarean, anesthesia. US cesarean rate ~32% (high). Repeat cesarean default conservative; VBAC reduce maternal morbidity longterm. Patient counseling crucial.'
          en: 'TOLAC (Trial of Labor After Cesarean): VBAC success ~70-75% if appropriate candidate. Risks: uterine rupture ~0.5-1%. ACOG 2017/2024 guidance: TOLAC offered, hospital with immediate cesarean access, anesthesia. US cesarean rate ~32% (high). Repeat cesarean conservative default; VBAC reduces long-term maternal morbidity. Patient counseling crucial.'
        objectives: [VBAC]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em sífilis congênita resurgence (US 2014-2023 +800%), causa é…'
          en: 'In congenital syphilis resurgence (US 2014-2023 +800%), cause is…'
        choices:
          - 'Inadequate prenatal care, missed maternal screening, post-PHE healthcare gaps'
          - 'Apenas trivial'
          - 'Sem qualquer impacto'
          - 'Apenas em UK'
        correctAnswer: 'Inadequate prenatal care, missed maternal screening, post-PHE healthcare gaps'
        rationale:
          pt: 'Congenital syphilis US: ~462 cases 2014 → ~3700 cases 2022 (+700-800%). ~280 stillbirths/infant deaths. Causes: opioid epidemic (homeless, IDU), inadequate prenatal screening (only ~50% screened third trimester), penicillin shortage 2024 supply chain. CDC universal screening recommendations strengthened. Doxycycline prophylaxis post-exposure (DoxyPEP) MSM 2023.'
          en: 'US Congenital syphilis: ~462 cases 2014 → ~3700 cases 2022 (+700-800%). ~280 stillbirths/infant deaths. Causes: opioid epidemic (homeless, IDU), inadequate prenatal screening (only ~50% screened in third trimester), penicillin shortage 2024 supply chain. CDC universal screening recommendations strengthened. Doxycycline prophylaxis post-exposure (DoxyPEP) MSM 2023.'
        objectives: [Congenital syphilis]
      - type: choice
        difficulty: 5
        question:
          pt: 'Postpartum depression (PPD) treatment evolution inclui…'
          en: 'Postpartum depression (PPD) treatment evolution includes…'
        choices:
          - 'Brexanolone (Zulresso 2019) IV 60h infusion, zuranolone (Zurzuvae 2023) primeiro oral PPD-specific'
          - 'Apenas SSRIs'
          - 'Sem qualquer aprovação'
          - 'Apenas em pediatric'
        correctAnswer: 'Brexanolone (Zulresso 2019) IV 60h infusion, zuranolone (Zurzuvae 2023) primeiro oral PPD-specific'
        rationale:
          pt: 'Brexanolone (Sage Therapeutics): allopregnanolone analog, GABA-A modulator. FDA mar/2019 PPD. IV 60h infusion. ~$30k inpatient. Zuranolone (Zurzuvae Sage/Biogen ago/2023): oral 14d, $16k. Não approved for MDD em adults non-PPD (dec/2023 rejected). Suicidal ideation post-MMR. Estradiol patch alternative. SSRIs (sertraline) standard first-line.'
          en: 'Brexanolone (Sage Therapeutics): allopregnanolone analog, GABA-A modulator. FDA Mar 2019 for PPD. IV 60h infusion. ~$30k inpatient. Zuranolone (Zurzuvae Sage/Biogen Aug 2023): oral 14d, $16k. Not approved for non-PPD adult MDD (Dec 2023 rejected). Post-MMR suicidal ideation. Estradiol patch alternative. SSRIs (sertraline) standard first-line.'
        objectives: [PPD treatment]
      - type: choice
        difficulty: 5
        question:
          pt: 'Doula care em obstetric outcomes mostra…'
          en: 'Doula care in obstetric outcomes shows…'
        choices:
          - 'Reduced cesarean rate, shorter labor, improved breastfeeding initiation, satisfaction'
          - 'Apenas custo'
          - 'Sem qualquer benefício'
          - 'Apenas em pediatric'
        correctAnswer: 'Reduced cesarean rate, shorter labor, improved breastfeeding initiation, satisfaction'
        rationale:
          pt: 'Doula: trained labor support continuous (não-medical). Cochrane review (Bohren 2017): cesarean ~25%↓, instrumental delivery ↓, oxytocin use ↓, analgesia ↓, satisfaction ↑. Especialmente importante em US Black maternal mortality crisis. Medicaid coverage expanding (NJ, NY, MN, ME, OR — patchwork). Reproductive justice movement endorses. Crescente integration em hospital systems.'
          en: 'Doula: trained continuous labor support (non-medical). Cochrane review (Bohren 2017): cesarean ~25%↓, instrumental delivery ↓, oxytocin use ↓, analgesia ↓, satisfaction ↑. Especially important in US Black maternal mortality crisis. Medicaid coverage expanding (NJ, NY, MN, ME, OR — patchwork). Reproductive justice movement endorses. Growing integration in hospital systems.'
        objectives: [Doula]
      - type: choice
