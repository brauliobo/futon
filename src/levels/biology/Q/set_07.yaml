title:
  pt: Ciência da Implementação em Saúde
  en: Implementation Science in Health
level: Q
subject: biology
objectives:
  - Compreender lacuna evidence-practice
  - Reconhecer frameworks (CFIR, RE-AIM, EPIS)
  - Identificar de-implementation
  - Avaliar dissemination e scale-up
difficulty: 5
authorNotes: |
  Implementation science. Brian Mittman, Enola Proctor, Greg Aarons. Frameworks: CFIR
  (Damschroder 2009), RE-AIM (Glasgow 1999), EPIS (Aarons 2011). Glasziou/Haynes "evidence
  pipeline". Choosing Wisely 2012 ABIM Foundation. NIH Health Care Systems Research
  Collaboratory. Pragmatic vs explanatory. De-implementation low-value care. Quality
  Improvement (Don Berwick IHI). Lean six sigma. Plan-Do-Study-Act (PDSA). Hybrid effectiveness-
  implementation Curran 2012.
example:
  question:
    pt: Implementation science estuda…
    en: Implementation science studies…
  choices:
    - Métodos para promover adoção sistemática de evidence-based practices em routine care
    - Apenas pesquisa básica
    - Apenas in vitro
    - Sem qualquer aplicação
  correctAnswer: Métodos para promover adoção sistemática de evidence-based practices em routine care
  rationale:
    pt: Implementation science: ~17 anos típicos para evidence chegar à prática (Balas/Boren 2000). Estuda: barriers, facilitators, contexts, processes, outcomes (Proctor 8 outcomes: acceptability, adoption, appropriateness, cost, feasibility, fidelity, penetration, sustainability). NIH PAR funding. Diferente de QI: theoretical framework, generalization.
    en: Implementation science: ~17 typical years for evidence to reach practice (Balas/Boren 2000). Studies: barriers, facilitators, contexts, processes, outcomes (Proctor 8 outcomes: acceptability, adoption, appropriateness, cost, feasibility, fidelity, penetration, sustainability). NIH PAR funding. Different from QI: theoretical framework, generalization.
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: Página 1 — Frameworks
      en: Page 1 — Frameworks
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: O CFIR (Damschroder 2009) é framework para…
          en: CFIR (Damschroder 2009) is framework for…
        choices:
          - 39 constructos em 5 domínios para identificar barriers/facilitators de implementation
          - Apenas para research
          - Sem qualquer estrutura
          - Apenas em US
        correctAnswer: 39 constructos em 5 domínios para identificar barriers/facilitators de implementation
        rationale:
          pt: CFIR (Consolidated Framework for Implementation Research, Damschroder 2009): 5 domínios — intervention, outer setting, inner setting, individuals, process. Versão atualizada CFIR 2.0 2022. Usado em ~50% de implementation studies. Análoga: PARiHS (Promoting Action on Research Implementation), TDF (Theoretical Domains Framework).
          en: CFIR (Consolidated Framework for Implementation Research, Damschroder 2009): 5 domains — intervention, outer setting, inner setting, individuals, process. Updated CFIR 2.0 2022. Used in ~50% of implementation studies. Analogous: PARiHS (Promoting Action on Research Implementation), TDF (Theoretical Domains Framework).
        objectives: [CFIR]
      - type: choice
        difficulty: 5
        question:
          pt: RE-AIM (Glasgow 1999) avalia em 5 dimensões…
          en: RE-AIM (Glasgow 1999) assesses 5 dimensions…
        choices:
          - Reach, Effectiveness, Adoption, Implementation, Maintenance
          - Apenas Reach
          - Sem qualquer estrutura
          - Apenas em pediatria
        correctAnswer: Reach, Effectiveness, Adoption, Implementation, Maintenance
        rationale:
          pt: RE-AIM: framework para evaluation. Reach (% target reached), Effectiveness (intended outcomes), Adoption (% sites/providers using), Implementation (fidelity), Maintenance (sustainability over time). Glasgow + Vogt + Boles AJPH 1999. Aplicado em 1000+ estudos. Permite ver beyond efficacy to public health impact.
          en: RE-AIM: framework for evaluation. Reach (% target reached), Effectiveness (intended outcomes), Adoption (% sites/providers using), Implementation (fidelity), Maintenance (sustainability over time). Glasgow + Vogt + Boles AJPH 1999. Applied in 1000+ studies. Allows seeing beyond efficacy to public health impact.
        objectives: [RE-AIM]
      - type: choice
        difficulty: 5
        question:
          pt: O Choosing Wisely (ABIM Foundation 2012) é importante por…
          en: Choosing Wisely (ABIM Foundation 2012) is important for…
        choices:
          - Listas de testes/procedimentos sem benefício comprovado por sociedade médica — campanha contra overuse
          - Apenas drogas
          - Sem qualquer impacto
          - Apenas em US
        correctAnswer: Listas de testes/procedimentos sem benefício comprovado por sociedade médica — campanha contra overuse
        rationale:
          pt: Choosing Wisely: cada specialty society lista 5 "Things Physicians and Patients Should Question". Exemplos: rotina pré-op chest X-ray, MRI lower back routine, antibióticos URI. Internacional: Choosing Wisely Brasil, UK, Canada. Tema: de-implementation de low-value care. Lown Institute, Right Care Alliance similar.
          en: Choosing Wisely: each specialty society lists 5 "Things Physicians and Patients Should Question". Examples: routine pre-op chest X-ray, routine lower back MRI, URI antibiotics. International: Choosing Wisely Brazil, UK, Canada. Theme: low-value care de-implementation. Lown Institute, Right Care Alliance similar.
        objectives: [Choosing Wisely]
      - type: choice
        difficulty: 5
        question:
          pt: Don Berwick (IHI) popularizou em healthcare o…
          en: Don Berwick (IHI) popularized in healthcare the…
        choices:
          - Quality Improvement via Plan-Do-Study-Act (PDSA) cycles e Triple Aim (cost, quality, experience)
          - Apenas custo cutting
          - Sem qualquer impacto
          - Apenas para hospitais grandes
        correctAnswer: Quality Improvement via Plan-Do-Study-Act (PDSA) cycles e Triple Aim (cost, quality, experience)
        rationale:
          pt: Berwick (Institute for Healthcare Improvement, IHI): adaptou Deming/Shewhart industrial QI a saúde. PDSA: plan (mudança), do (testar), study (analisar), act (adopt/abandon/adapt). Triple Aim 2008: improve experience, improve health populations, reduce per capita cost. Quadruple Aim adicionou clinician wellbeing 2014. Influence em ACA, MIPS.
          en: Berwick (Institute for Healthcare Improvement, IHI): adapted Deming/Shewhart industrial QI to healthcare. PDSA: plan (change), do (test), study (analyze), act (adopt/abandon/adapt). Triple Aim 2008: improve experience, improve population health, reduce per capita cost. Quadruple Aim added clinician wellbeing 2014. Influence on ACA, MIPS.
        objectives: [Berwick QI]
      - type: choice
        difficulty: 5
        question:
          pt: Hybrid effectiveness-implementation studies (Curran 2012) propõem…
          en: Hybrid effectiveness-implementation studies (Curran 2012) propose…
        choices:
          - Coletar dados de eficácia + implementation simultaneamente em 1 trial (Type 1, 2, 3)
          - Apenas eficácia
          - Apenas implementation
          - Sem qualquer integração
        correctAnswer: Coletar dados de eficácia + implementation simultaneamente em 1 trial (Type 1, 2, 3)
        rationale:
          pt: Curran/Bauer/Mittman (Med Care 2012): Type 1 (efficacy primary, implementation secondary), Type 2 (both equal), Type 3 (implementation primary, efficacy secondary). Reduz timeline. Aplicado em ~15-25% de NIH-funded implementation trials. Acelera translation T2 → T3.
          en: Curran/Bauer/Mittman (Med Care 2012): Type 1 (efficacy primary, implementation secondary), Type 2 (both equal), Type 3 (implementation primary, efficacy secondary). Reduces timeline. Applied in ~15-25% of NIH-funded implementation trials. Accelerates T2 → T3 translation.
        objectives: [Hybrid trials]
      - type: choice
        difficulty: 5
        question:
          pt: O conceito "audit and feedback" como implementation strategy mostra…
          en: "Audit and feedback" as implementation strategy shows…
        choices:
          - Efeito modesto (~5-10%) na prática; mais eficaz quando individual, frequent, actionable
          - Sempre eficaz
          - Sem qualquer efeito
          - Apenas em US
        correctAnswer: Efeito modesto (~5-10%) na prática; mais eficaz quando individual, frequent, actionable
        rationale:
          pt: Cochrane review (Ivers 2012, 2020): >100 RCTs. Median efeito 4-8% absolute improvement. Funciona melhor com: baseline performance baixo, comparison com peers, target específico, feedback specific actionable. Ineficaz se passive, infrequent. Usado em vacinação, antibiotic stewardship, diabetes care.
          en: Cochrane review (Ivers 2012, 2020): >100 RCTs. Median effect 4-8% absolute improvement. Works best with: low baseline performance, peer comparison, specific target, specific actionable feedback. Ineffective if passive, infrequent. Used in vaccination, antibiotic stewardship, diabetes care.
        objectives: [Audit feedback]
      - type: choice
        difficulty: 5
        question:
          pt: O conceito "knowledge translation" (CIHR Canada) refere-se a…
          en: "Knowledge translation" (CIHR Canada) refers to…
        choices:
          - Sintetizar, disseminar, exchange, ethically-sound application of knowledge para improve health
          - Apenas tradução literal
          - Sem qualquer estrutura
          - Apenas em US
        correctAnswer: Sintetizar, disseminar, exchange, ethically-sound application of knowledge para improve health
        rationale:
          pt: KT (CIHR definition): mais comprehensive que implementation. Modelos: KTA (Knowledge-to-Action, Graham 2006) — knowledge creation funnel + action cycle. Synthesis (Cochrane), tools (guidelines), end-of-grant KT, integrated KT (stakeholders early). Termos relacionados: knowledge transfer, dissemination, EBP.
          en: KT (CIHR definition): more comprehensive than implementation. Models: KTA (Knowledge-to-Action, Graham 2006) — knowledge creation funnel + action cycle. Synthesis (Cochrane), tools (guidelines), end-of-grant KT, integrated KT (stakeholders early). Related terms: knowledge transfer, dissemination, EBP.
        objectives: [Knowledge translation]
      - type: choice
        difficulty: 5
        question:
          pt: Em sustentabilidade, "deimplementation" de práticas low-value enfrenta…
          en: In sustainability, "de-implementation" of low-value practices faces…
        choices:
          - Resistência por hábito, pagamento fee-for-service, malpractice fear, paciente expectations
          - Apenas barreiras técnicas
          - Nenhuma resistência
          - Apenas em US
        correctAnswer: Resistência por hábito, pagamento fee-for-service, malpractice fear, paciente expectations
        rationale:
          pt: De-implementation: remover, reduzir, replace overused interventions. Niven et al. systematic review: harder do que adoptar evidence. Barreiras: financial incentives (FFS rewards volume), defensive medicine, momentum profissional, low-value medical-cultural symbols (e.g. annual physicals). ACA value-based purchasing tenta abordar.
          en: De-implementation: remove, reduce, replace overused interventions. Niven et al. systematic review: harder than adopting evidence. Barriers: financial incentives (FFS rewards volume), defensive medicine, professional momentum, low-value medical-cultural symbols (e.g., annual physicals). ACA value-based purchasing attempts to address.
        objectives: [Deimplementation]
      - type: choice
        difficulty: 5
        question:
          pt: O conceito "evidence pipeline" (Glasziou/Haynes) descreve…
          en: "Evidence pipeline" (Glasziou/Haynes) describes…
        choices:
          - Filtros sucessivos: research → published → discovered → accepted → applied → adhered to
          - Apenas pesquisa
          - Sem qualquer pipeline
          - Apenas em US
        correctAnswer: Filtros sucessivos: research → published → discovered → accepted → applied → adhered to
        rationale:
          pt: Glasziou/Haynes (BMJ 2005): "leaky pipe" loss em cada step. ~20% de research adequado; ~50% published; ~50% discovered by clinicians; ~80% accepted; ~80% applied; ~80% adhered → ~5% efficacy preserved at population level. Improvement targets cada filtro.
          en: Glasziou/Haynes (BMJ 2005): "leaky pipe" loss at each step. ~20% of research adequate; ~50% published; ~50% discovered by clinicians; ~80% accepted; ~80% applied; ~80% adhered → ~5% efficacy preserved at population level. Improvement targets each filter.
        objectives: [Evidence pipeline]
      - type: choice
        difficulty: 5
        question:
          pt: Aarons EPIS framework (2011) descreve fases de…
          en: Aarons EPIS framework (2011) describes phases of…
        choices:
          - Exploration, Preparation, Implementation, Sustainment — adaptado para systems com múltiplos níveis
          - Apenas implementação simples
          - Sem qualquer fase
          - Apenas em pediatria
        correctAnswer: Exploration, Preparation, Implementation, Sustainment — adaptado para systems com múltiplos níveis
        rationale:
          pt: EPIS (Aarons/Hurlburt/Horwitz 2011): fases temporais + outer/inner contexts. Inicialmente para mental health/social services; expandiu para outras áreas. Bridging factors entre outer (system) e inner (org) contexts. Análoga: Stetler 2001 model, ARC Aarons (Availability, Responsiveness, Continuity).
          en: EPIS (Aarons/Hurlburt/Horwitz 2011): temporal phases + outer/inner contexts. Initially for mental health/social services; expanded to other areas. Bridging factors between outer (system) and inner (org) contexts. Analogous: Stetler 2001 model, Aarons ARC (Availability, Responsiveness, Continuity).
        objectives: [EPIS]
  - title:
      pt: Página 2 — Aplicações
      en: Page 2 — Applications
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: A "central line bundle" (Pronovost et al. NEJM 2006) Michigan ICUs reduziu…
          en: "Central line bundle" (Pronovost et al. NEJM 2006) Michigan ICUs reduced…
        choices:
          - CLABSI (catheter-associated bloodstream infections) ~66% via 5-step checklist
          - Apenas custo
          - Sem qualquer impacto
          - Apenas em UK
        correctAnswer: CLABSI (catheter-associated bloodstream infections) ~66% via 5-step checklist
        rationale:
          pt: Peter Pronovost (Hopkins) Keystone ICU project: 103 ICUs Michigan, 5-step bundle (handwashing, full barrier, chlorhexidine skin, avoid femoral, remove asap). CLABSI rate caiu de 7.7 to 1.4 per 1000 catheter-days. Salvou ~1500 vidas, $200M. Modelo de simple intervention + culture change. Replicado mundialmente.
          en: Peter Pronovost (Hopkins) Keystone ICU project: 103 Michigan ICUs, 5-step bundle (handwashing, full barrier, chlorhexidine skin, avoid femoral, remove asap). CLABSI rate dropped from 7.7 to 1.4 per 1000 catheter-days. Saved ~1500 lives, $200M. Model of simple intervention + culture change. Replicated worldwide.
        objectives: [Pronovost bundle]
      - type: choice
        difficulty: 5
        question:
          pt: WHO Surgical Safety Checklist (Haynes 2009 NEJM) em 8 hospitais reduziu…
          en: WHO Surgical Safety Checklist (Haynes 2009 NEJM) in 8 hospitals reduced…
        choices:
          - Mortalidade ~47% e complicações ~36%; intervention low-cost com training mínimo
          - Apenas custo
          - Sem qualquer impacto
          - Apenas em UK
        correctAnswer: Mortalidade ~47% e complicações ~36%; intervention low-cost com training mínimo
        rationale:
          pt: Atul Gawande (Hopkins/Hopkins/HSPH) liderou WHO checklist: 19-item time-out (sign in, time out, sign out). Estudo 8 hospitais (HIC + LMIC): mortalidade 1.5% → 0.8%, complications 11% → 7%. Adopted globally. Limitations: implementation fidelity variável; large RCT subsequente Ontario showed null result (Urbach 2014). Real implementation > checklist mecânico.
          en: Atul Gawande (Hopkins/HSPH) led WHO checklist: 19-item time-out (sign in, time out, sign out). 8-hospital study (HIC + LMIC): mortality 1.5% → 0.8%, complications 11% → 7%. Adopted globally. Limitations: variable implementation fidelity; subsequent large Ontario RCT showed null result (Urbach 2014). Real implementation > mechanical checklist.
        objectives: [Surgical checklist]
      - type: choice
        difficulty: 5
        question:
          pt: O conceito "learning health system" (IOM 2007) propõe…
          en: "Learning health system" (IOM 2007) proposes…
        choices:
          - Healthcare systems que continuamente learn from data + integram new evidence em care
          - Apenas pesquisa acadêmica
          - Sem qualquer integração
          - Apenas para US
        correctAnswer: Healthcare systems que continuamente learn from data + integram new evidence em care
        rationale:
          pt: Learning Health System (IOM/NAM 2007 Roundtable): visão de hospitais/sistemas como evidência-generators contínuos via EHR + RWE + embedded trials + rapid implementation. Exemplos práticos: Geisinger, Kaiser Permanente. NIH Pragmatic Trials Collaboratory exemplifica pilots. Mantém challenges: data interoperability, governance, ethics.
          en: Learning Health System (IOM/NAM 2007 Roundtable): vision of hospitals/systems as continuous evidence generators via EHR + RWE + embedded trials + rapid implementation. Practical examples: Geisinger, Kaiser Permanente. NIH Pragmatic Trials Collaboratory exemplifies pilots. Persistent challenges: data interoperability, governance, ethics.
        objectives: [LHS]
      - type: choice
        difficulty: 5
        question:
          pt: Em opioid epidemic, implementation science identificou…
          en: In opioid epidemic, implementation science identified…
        choices:
          - PDMPs (Prescription Drug Monitoring), academic detailing, MOUD escala-up como interventions
          - Apenas educação direta
          - Sem qualquer estratégia
          - Apenas em US
        correctAnswer: PDMPs (Prescription Drug Monitoring), academic detailing, MOUD escala-up como interventions
        rationale:
          pt: Opioid crisis US (~107k mortes 2023, fentanil): PDMPs estados implemented 2010s reduziram doctor-shopping. Academic detailing (one-on-one prescriber education) effective. MOUD (Medication for Opioid Use Disorder) — buprenorphine, methadone — under-prescribed historicamente; X-waiver removed 2023 (MAT Act); CDC 2022 guidelines reverted "one-size opioid limits". HEAL Initiative (NIH) financia.
          en: US opioid crisis (~107k deaths 2023, fentanyl): state PDMPs implemented 2010s reduced doctor-shopping. Academic detailing (one-on-one prescriber education) effective. MOUD (Medication for Opioid Use Disorder) — buprenorphine, methadone — historically under-prescribed; X-waiver removed 2023 (MAT Act); CDC 2022 guidelines reversed "one-size opioid limits". HEAL Initiative (NIH) funds.
        objectives: [Opioid IS]
      - type: choice
        difficulty: 5
        question:
          pt: "Stepped wedge" cluster RCT é design útil para…
          en: "Stepped wedge" cluster RCT is useful for…
        choices:
          - Implementing intervention sequencially em todos sites enquanto preserva randomization (e.g. WASH em Bangladesh)
          - Apenas observational
          - Sem qualquer aplicação
          - Apenas em pediatric
        correctAnswer: Implementing intervention sequencially em todos sites enquanto preserva randomization (e.g. WASH em Bangladesh)
        rationale:
          pt: SWCT (Brown/Lilford 2006): rollout sequencial, cada cluster eventualmente recebe intervention; analise temporal. Útil quando ethical/political nondelivery problemático ou rollout planned anyway. Exemplos: handwashing (WASH-B Bangladesh), antibiotic stewardship NHS, school vaccinations. Power calculations específicos (Hussey/Hughes 2007).
          en: SWCT (Brown/Lilford 2006): sequential rollout, each cluster eventually receives intervention; temporal analysis. Useful when nondelivery is ethically/politically problematic or rollout planned anyway. Examples: handwashing (WASH-B Bangladesh), NHS antibiotic stewardship, school vaccinations. Specific power calculations (Hussey/Hughes 2007).
        objectives: [Stepped wedge]
      - type: choice
        difficulty: 5
        question:
          pt: "ECHO" model (Project ECHO, Sanjeev Arora 2003 New Mexico) é…
          en: "ECHO" model (Project ECHO, Sanjeev Arora 2003 New Mexico) is…
        choices:
          - Telementoring multi-site para extender expertise especializada a primary care e LMIC
          - Apenas teleconsulta
          - Sem qualquer educação
          - Apenas em US
        correctAnswer: Telementoring multi-site para extender expertise especializada a primary care e LMIC
        rationale:
          pt: ECHO (Extension for Community Healthcare Outcomes): hub-and-spoke. Hospital especializado conduz televirtual case-based learning com primary care providers. Original: HCV em New Mexico — primary care became as effective as specialists. Replicado: HIV, MAT, mental health, oncology. >40 países. Modelo de capacity building.
          en: ECHO (Extension for Community Healthcare Outcomes): hub-and-spoke. Specialized hospital conducts virtual case-based learning with primary care providers. Original: HCV in New Mexico — primary care became as effective as specialists. Replicated: HIV, MAT, mental health, oncology. >40 countries. Capacity-building model.
        objectives: [Project ECHO]
      - type: choice
        difficulty: 5
        question:
          pt: Sustainability de implementations é challenging porque…
          en: Sustainability of implementations is challenging because of…
        choices:
          - Lifecycle: ~50% intervenções não persistem 1 ano após financiamento ativo termina
          - Apenas trivial
          - Sem qualquer dificuldade
          - Apenas em US
        correctAnswer: Lifecycle: ~50% intervenções não persistem 1 ano após financiamento ativo termina
        rationale:
          pt: Sustainment crisis: ~50% intervenções fade post-funding. Fatores: institutional change, leadership turnover, financial pressure, evidence updates, complexity. Frameworks: Wiltsey-Stirman 2012 review of sustainment outcomes. Strategies: integration to routine workflow, EHR alerts, billing codes, local champions, organizational capacity.
          en: Sustainment crisis: ~50% of interventions fade post-funding. Factors: institutional change, leadership turnover, financial pressure, evidence updates, complexity. Frameworks: Wiltsey-Stirman 2012 review of sustainment outcomes. Strategies: integration into routine workflow, EHR alerts, billing codes, local champions, organizational capacity.
        objectives: [Sustainability]
      - type: choice
        difficulty: 5
        question:
          pt: Em LMIC, "task-shifting" para non-physician health workers é…
          en: In LMIC, "task-shifting" to non-physician health workers is…
        choices:
          - Estratégia de implementation para superar shortage de médicos: ART HIV, mental health
          - Apenas em hospitais
          - Sem qualquer efetividade
          - Apenas em US
        correctAnswer: Estratégia de implementation para superar shortage de médicos: ART HIV, mental health
        rationale:
          pt: Task-shifting/task-sharing: WHO 2008 endorse. Exemplos: HIV ART iniciação por nurses (PEPFAR rollout África subsaariana), TB DOT por community health workers, mental health Friendship Bench Zimbabwe (Chibanda lay counselors), surgical procedures por non-physician clinicians. Crucial em contexts de scarcity. Quality + safety preserved se properly trained/supervised.
          en: Task-shifting/task-sharing: WHO 2008 endorse. Examples: HIV ART initiation by nurses (PEPFAR sub-Saharan rollout), TB DOT by community health workers, mental health Friendship Bench Zimbabwe (Chibanda lay counselors), surgical procedures by non-physician clinicians. Crucial in scarcity contexts. Quality + safety preserved with proper training/supervision.
        objectives: [Task-shifting]
      - type: choice
        difficulty: 5
        question:
          pt: O conceito "complex intervention" (UK MRC framework) é…
          en: "Complex intervention" (UK MRC framework) is…
        choices:
          - Multi-component, com interactions, multiple levels — design e evaluation requer abordagem específica
          - Apenas single drug
          - Sem qualquer estrutura
          - Apenas para US
        correctAnswer: Multi-component, com interactions, multiple levels — design e evaluation requer abordagem específica
        rationale:
          pt: MRC Complex Intervention Framework (Craig 2008, atualizado 2021): development → feasibility → evaluation → implementation. Considerações: theory, modeling, multiple components, contextual variability. Aplicações: educational programs, integrated care, health system reforms. Realist evaluation (Pawson) frequentemente complementa traditional RCT.
          en: MRC Complex Intervention Framework (Craig 2008, updated 2021): development → feasibility → evaluation → implementation. Considerations: theory, modeling, multiple components, contextual variability. Applications: educational programs, integrated care, health system reforms. Realist evaluation (Pawson) often complements traditional RCT.
        objectives: [Complex interventions]
      - type: choice
        difficulty: 5
        question:
          pt: "Equity" em implementation requer…
          en: "Equity" in implementation requires…
        choices:
          - Análise diferencial de implementation outcomes em populações underserved (PROGRESS-Plus)
          - Apenas tratamento uniforme
          - Sem qualquer consideração
          - Apenas em US
        correctAnswer: Análise diferencial de implementation outcomes em populações underserved (PROGRESS-Plus)
        rationale:
          pt: PROGRESS-Plus (O'Neill 2014): Place, Race, Occupation, Gender, Religion, Education, SES, Social capital + age, disability, sexual orientation. Baker IS implementation may worsen disparities (digital divide, access to specialist care). EquIR Eccles, Health Equity Implementation Framework (Woodward 2019). NIH NIMHD focus.
          en: PROGRESS-Plus (O'Neill 2014): Place, Race, Occupation, Gender, Religion, Education, SES, Social capital + age, disability, sexual orientation. Implementation may worsen disparities (digital divide, access to specialist care). EquIR Eccles, Health Equity Implementation Framework (Woodward 2019). NIH NIMHD focus.
        objectives: [Equity IS]
target: 20
