title:
  pt: 'Saúde Global e Disparidades'
  en: 'Global Health and Disparities'
level: Q
subject: biology
objectives:
  - 'Compreender SDGs, UHC, GBD'
  - 'Reconhecer Gavi, Global Fund, WHO'
  - 'Identificar tropical neglected, MDR-TB'
  - 'Avaliar pandemic preparedness'
difficulty: 5
authorNotes: |
  Global health. WHO 1948. SDGs 2015. Universal Health Coverage. Global Burden of Disease
  IHME (Murray Seattle). Gavi vaccine alliance 2000. Global Fund AIDS/TB/Malaria 2002. PEPFAR
  2003 Bush. NTDs (Neglected Tropical Diseases) — Carter Center, DNDi. WHO 2030 targets.
  Pandemic Treaty negotiations 2024. CEPI 2017. 100 Days Mission.
example:
  question:
    pt: 'SDG 3 (Health) tem como meta-chave…'
    en: 'SDG 3 (Health) has as key target…'
  choices:
    - 'Universal Health Coverage by 2030, reducing maternal/child mortality, NCDs, NTDs'
    - 'Apenas vacinas'
    - 'Sem qualquer meta'
    - 'Apenas em LMIC'
  correctAnswer: 'Universal Health Coverage by 2030, reducing maternal/child mortality, NCDs, NTDs'
  rationale:
    pt: 'SDG 3 (Sustainable Development Goal "Good Health"): 13 targets including UHC (3.8), maternal mortality <70/100k (3.1), under-5 mortality <25/1000 (3.2), end AIDS/TB/malaria/NTDs (3.3). Replaced MDGs 2015. UN agreement. Progress measured via WHO/UN/IHME data. Off-track post-COVID.'
    en: 'SDG 3 (Sustainable Development Goal "Good Health"): 13 targets including UHC (3.8), maternal mortality <70/100k (3.1), under-5 mortality <25/1000 (3.2), end AIDS/TB/malaria/NTDs (3.3). Replaced MDGs 2015. UN agreement. Progress measured via WHO/UN/IHME data. Off-track post-COVID.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — Programs e organizations'
      en: 'Page 1 — Programs and organizations'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Gavi (Vaccine Alliance, 2000+) é importante por…'
          en: 'Gavi (Vaccine Alliance, 2000+) is important for…'
        choices:
          - 'Cofinanciamento vacinas pediátricas em LMIC; ~1B vaccinated, ~17M lives saved'
          - 'Apenas em HIC'
          - 'Sem qualquer impacto'
          - 'Apenas pediatric'
        correctAnswer: 'Cofinanciamento vacinas pediátricas em LMIC; ~1B vaccinated, ~17M lives saved'
        rationale:
          pt: 'Gavi (originalmente Global Alliance for Vaccines and Immunization): public-private partnership Gates Foundation, WHO, World Bank, UNICEF, donors. Vaccinas: pneumococcal (PCV10/13), rotavirus, HPV, malaria (R21), Ebola. Modelo: copay declining as country GDP grows (transition). Hosting do COVAX 2020 (limited success). Reauthorization 2026-2030 cycle.'
          en: 'Gavi (originally Global Alliance for Vaccines and Immunization): public-private partnership Gates Foundation, WHO, World Bank, UNICEF, donors. Vaccines: pneumococcal (PCV10/13), rotavirus, HPV, malaria (R21), Ebola. Model: copay declining as country GDP grows (transition). Hosted COVAX 2020 (limited success). Reauthorization 2026-2030 cycle.'
        objectives: [Gavi]
      - type: choice
        difficulty: 5
        question:
          pt: 'Global Fund (AIDS, TB, Malaria 2002+) financia…'
          en: 'Global Fund (AIDS, TB, Malaria 2002+) funds…'
        choices:
          - '$5-6B/ano em interventions LMIC; ~50M lives saved cumulative'
          - 'Apenas pesquisa básica'
          - 'Sem qualquer impacto'
          - 'Apenas em US'
        correctAnswer: '$5-6B/ano em interventions LMIC; ~50M lives saved cumulative'
        rationale:
          pt: 'Global Fund Geneva-based: largest international funding for these 3 diseases. ART HIV scale-up África sub-Sahariana (~24M on treatment 2024). TB DOTS expansão. Malaria nets (>2B distributed), ACTs, indoor residual spraying. Replenishment 2022 ~$15.7B 2023-2025. Critical financing pillar.'
          en: 'Global Fund Geneva-based: largest international funding for these 3 diseases. HIV ART scale-up sub-Saharan Africa (~24M on treatment 2024). TB DOTS expansion. Malaria nets (>2B distributed), ACTs, indoor residual spraying. 2022 replenishment ~$15.7B 2023-2025. Critical financing pillar.'
        objectives: [Global Fund]
      - type: choice
        difficulty: 5
        question:
          pt: 'PEPFAR (US, 2003 Bush) é…'
          en: 'PEPFAR (US, 2003 Bush) is…'
        choices:
          - 'Largest single global health program; >$110B desde 2003 contra HIV em ~50 países'
          - 'Apenas charity privada'
          - 'Sem qualquer impacto'
          - 'Apenas em US'
        correctAnswer: 'Largest single global health program; >$110B desde 2003 contra HIV em ~50 países'
        rationale:
          pt: 'PEPFAR (President''s Emergency Plan for AIDS Relief, GW Bush 2003): bipartisan reauthorization (latest 2024 controversa). 25M lives saved. ART scale-up massivo. Targets PrEP 2030. Funds CDC, USAID, State Dept, NIH operations. Reduzido durante COVID. Reauthorization política 2024 — anti-abortion linkage. Modelo de soft power health diplomacy.'
          en: 'PEPFAR (President''s Emergency Plan for AIDS Relief, GW Bush 2003): bipartisan reauthorization (latest controversial 2024). 25M lives saved. Massive ART scale-up. PrEP 2030 targets. Funds CDC, USAID, State Dept, NIH operations. Reduced during COVID. 2024 reauthorization political — anti-abortion linkage. Model of soft-power health diplomacy.'
        objectives: [PEPFAR]
      - type: choice
        difficulty: 5
        question:
          pt: 'GBD (Global Burden of Disease, IHME Murray) é…'
          en: 'GBD (Global Burden of Disease, IHME Murray) is…'
        choices:
          - 'Most comprehensive global health metrics: 369 diseases, 87 risk factors, 204 countries'
          - 'Apenas para US'
          - 'Sem qualquer dado'
          - 'Apenas mortalidade'
        correctAnswer: 'Most comprehensive global health metrics: 369 diseases, 87 risk factors, 204 countries'
        rationale:
          pt: 'GBD (IHME University of Washington, Christopher Murray): annual updates de DALYs (Disability-Adjusted Life Years), YLLs (Years Life Lost), YLDs (Years Lived with Disability), mortality, prevalence, incidence. 1990-presente. Open data. Lancet publishes major series. Findings: NCDs dominate global burden (cardio, cancer, diabetes, mental). NTDs reducing. Foundational tool for policy.'
          en: 'GBD (IHME University of Washington, Christopher Murray): annual updates of DALYs (Disability-Adjusted Life Years), YLLs (Years Life Lost), YLDs (Years Lived with Disability), mortality, prevalence, incidence. 1990-present. Open data. Lancet publishes major series. Findings: NCDs dominate global burden (cardio, cancer, diabetes, mental). NTDs reducing. Foundational policy tool.'
        objectives: [GBD]
      - type: choice
        difficulty: 5
        question:
          pt: 'Universal Health Coverage (UHC) é definida como…'
          en: 'Universal Health Coverage (UHC) is defined as…'
        choices:
          - 'Acesso a quality health services without financial hardship for all (WHO definition)'
          - 'Apenas hospital'
          - 'Sem qualquer estrutura'
          - 'Apenas em US'
        correctAnswer: 'Acesso a quality health services without financial hardship for all (WHO definition)'
        rationale:
          pt: 'UHC: 3 dimensions (WHO cube) — population covered (breadth), services included (depth), financial protection (height). Targeted SDG 3.8. ~50% world without essential coverage; ~100M pushed in poverty by health costs annually. Modelos: single-payer (UK NHS, Canada), social insurance (Germany), private+public (US ACA partial). Roe-vs-Wade era debates US.'
          en: 'UHC: 3 dimensions (WHO cube) — population covered (breadth), services included (depth), financial protection (height). SDG 3.8 target. ~50% world without essential coverage; ~100M pushed into poverty by health costs annually. Models: single-payer (UK NHS, Canada), social insurance (Germany), private+public (US partial ACA). US Roe-vs-Wade era debates.'
        objectives: [UHC]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em malária, R21/Matrix-M (Oxford/SII 2023 WHO) é…'
          en: 'In malaria, R21/Matrix-M (Oxford/SII 2023 WHO) is…'
        choices:
          - 'Segunda vacina malárica WHO-recomendada com ~75% eficácia em sazonal high-transmission'
          - 'Apenas para US'
          - 'Sem qualquer aprovação'
          - 'Apenas pediatric'
        correctAnswer: 'Segunda vacina malárica WHO-recomendada com ~75% eficácia em sazonal high-transmission'
        rationale:
          pt: 'R21/Matrix-M (Adrian Hill Oxford, Serum Institute India): primeira ~75% efficacy malaria vaccine (vs ~30-40% RTS,S Mosquirix GSK 2021). Distribuição em Burkina Faso, Camarões, Gana 2024 via Gavi. SII produces a custo $3-4/dose. Roll-out massivo planejado. Reduz mortalidade infantil em ~13% em areas com cobertura.'
          en: 'R21/Matrix-M (Adrian Hill Oxford, Serum Institute India): first ~75% efficacy malaria vaccine (vs ~30-40% RTS,S Mosquirix GSK 2021). Distribution in Burkina Faso, Cameroon, Ghana 2024 via Gavi. SII produces at $3-4/dose. Massive planned rollout. Reduces child mortality ~13% in covered areas.'
        objectives: [R21]
      - type: choice
        difficulty: 5
        question:
          pt: 'TB (Tuberculose) é importante porque…'
          en: 'TB (Tuberculosis) is important because…'
        choices:
          - '~10M cases/ano globalmente, ~1.3M deaths; MDR-TB cresce; BPaL regimen (2022) reduziu duration'
          - 'Apenas histórico'
          - 'Sem qualquer impacto'
          - 'Apenas pediatric'
        correctAnswer: '~10M cases/ano globalmente, ~1.3M deaths; MDR-TB cresce; BPaL regimen (2022) reduziu duration'
        rationale:
          pt: 'TB: top infectious killer pre-COVID (~1.5M deaths/año). MDR-TB ~410k anuais. BPaL regimen (Bedaquiline + Pretomanid + Linezolid, ZeNiX trial Conradie NEJM 2022): 6 months MDR-TB cura ~90% (vs 18-24 mo regimen pré). WHO 2022 endorsement. Reduzir transmissão crucial. End TB Strategy 2035 target reduction 95%.'
          en: 'TB: pre-COVID top infectious killer (~1.5M deaths/year). MDR-TB ~410k annually. BPaL regimen (Bedaquiline + Pretomanid + Linezolid, ZeNiX trial Conradie NEJM 2022): 6 months MDR-TB cures ~90% (vs 18-24 mo prior regimen). WHO 2022 endorsement. Reducing transmission crucial. End TB Strategy 2035 target 95% reduction.'
        objectives: [TB BPaL]
      - type: choice
        difficulty: 5
        question:
          pt: 'Neglected Tropical Diseases (NTDs) WHO list ~20 conditions incluindo…'
          en: 'Neglected Tropical Diseases (NTDs) WHO list ~20 conditions including…'
        choices:
          - 'Onchocerciasis, leprosy, lymphatic filariasis, Chagas, schistosomiasis, dengue'
          - 'Apenas COVID'
          - 'Sem qualquer estrutura'
          - 'Apenas em pediatric'
        correctAnswer: 'Onchocerciasis, leprosy, lymphatic filariasis, Chagas, schistosomiasis, dengue'
        rationale:
          pt: 'NTDs: ~1 bilhão affected, ~200k deaths annually. WHO Roadmap 2021-2030: elimination targets para 8, control 12 mais. Mass Drug Administration: ivermectin (oncho/LF, Mectizan donation Merck), albendazole, praziquantel. Carter Center: oncho, Guinea worm (~20 cases 2024 from millions). DNDi (Drugs for Neglected Diseases initiative) develops new drugs.'
          en: 'NTDs: ~1 billion affected, ~200k deaths annually. WHO Roadmap 2021-2030: elimination targets for 8, control 12 more. Mass Drug Administration: ivermectin (oncho/LF, Merck Mectizan donation), albendazole, praziquantel. Carter Center: oncho, Guinea worm (~20 cases 2024 from millions). DNDi (Drugs for Neglected Diseases initiative) develops new drugs.'
        objectives: [NTDs]
      - type: choice
        difficulty: 5
        question:
          pt: 'WHO Pandemic Treaty (negociações 2024) é…'
          en: 'WHO Pandemic Treaty (2024 negotiations) is…'
        choices:
          - 'Tratado para pandemic preparedness com pathogen access (PABS) e equitable benefit sharing'
          - 'Apenas histórico'
          - 'Sem qualquer estrutura'
          - 'Apenas em US'
        correctAnswer: 'Tratado para pandemic preparedness com pathogen access (PABS) e equitable benefit sharing'
        rationale:
          pt: 'WHA77 mai/2024: não fechou Pandemic Treaty (CA+ instrument). Sul Global pediu garantias acesso vaccinas/dx em troca de pathogen sharing (PABS — Pathogen Access and Benefit-Sharing). HIC reluctant about IP-related concessions. Negotiations continuam 2025+. WHA77 emendou IHR (International Health Regulations) separately. Conceito "100 Days Mission" CEPI complementar.'
          en: 'WHA77 May 2024: didn''t close Pandemic Treaty (CA+ instrument). Global South demanded vaccine/Dx access guarantees in exchange for pathogen sharing (PABS — Pathogen Access and Benefit-Sharing). HIC reluctant about IP-related concessions. Negotiations continue 2025+. WHA77 amended IHR (International Health Regulations) separately. Complementary CEPI "100 Days Mission" concept.'
        objectives: [Pandemic Treaty]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em saúde reprodutiva global, maternal mortality target SDG é…'
          en: 'In global reproductive health, SDG maternal mortality target is…'
        choices:
          - '<70 deaths per 100,000 live births globally by 2030 (atualmente ~223)'
          - 'Sem qualquer meta'
          - '<1000'
          - 'Apenas LMIC'
        correctAnswer: '<70 deaths per 100,000 live births globally by 2030 (atualmente ~223)'
        rationale:
          pt: 'SDG 3.1: maternal mortality ratio <70/100k by 2030. WHO 2023 estimate: 223 globally (~287k deaths/ano). 95% em LMIC. Maior progress: South Asia, MMEIG. Sub-Saharan Africa lag. Causes: PPH, sepsis, eclampsia, unsafe abortion. Ending Preventable Maternal Mortality (EPMM) WHO/UNFPA. EmONC infrastructure. Skilled birth attendance.'
          en: 'SDG 3.1: maternal mortality ratio <70/100k by 2030. WHO 2023 estimate: 223 globally (~287k deaths/year). 95% in LMIC. Greatest progress: South Asia, MMEIG. Sub-Saharan Africa lag. Causes: PPH, sepsis, eclampsia, unsafe abortion. Ending Preventable Maternal Mortality (EPMM) WHO/UNFPA. EmONC infrastructure. Skilled birth attendance.'
        objectives: [Maternal mortality]
  - title:
      pt: 'Página 2 — Disparidades e equity'
      en: 'Page 2 — Disparities and equity'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Em US, "Black maternal mortality crisis" é destacada por…'
          en: 'In US, "Black maternal mortality crisis" is highlighted by…'
        choices:
          - '3-4x mais alta que mulheres brancas; persiste mesmo controlando para SES, education'
          - 'Igual entre raças'
          - 'Apenas histórica'
          - 'Sem qualquer disparity'
        correctAnswer: '3-4x mais alta que mulheres brancas; persiste mesmo controlando para SES, education'
        rationale:
          pt: 'US: highest maternal mortality entre HIC. Black women MMR ~50/100k vs white ~14. Native American similar. Causes: structural racism, bias clínico, access. Notable: Serena Williams'' near-death postpartum (PE/PE story 2018). Policy: Black Maternal Health Momnibus Act 2021 (12 bills bipartisan). Doula-led care. Reproductive justice frame (SisterSong).'
          en: 'US: highest maternal mortality among HIC. Black women MMR ~50/100k vs white ~14. Native American similar. Causes: structural racism, clinical bias, access. Notable: Serena Williams'' near-death postpartum (PE/PE story 2018). Policy: Black Maternal Health Momnibus Act 2021 (12 bipartisan bills). Doula-led care. Reproductive justice frame (SisterSong).'
        objectives: [Black MM]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em estatística US, life expectancy decline 2014-2017 e 2020-2022 (deepest decline desde 1960s) foi causado por…'
          en: 'In US statistics, life expectancy decline 2014-2017 and 2020-2022 (deepest decline since 1960s) was caused by…'
        choices:
          - 'Drug overdoses (opioid crisis), COVID-19, suicide, Alcohol — "deaths of despair" (Case-Deaton)'
          - 'Apenas idade'
          - 'Sem qualquer causa'
          - 'Apenas em pediatric'
        correctAnswer: 'Drug overdoses (opioid crisis), COVID-19, suicide, Alcohol — "deaths of despair" (Case-Deaton)'
        rationale:
          pt: 'Case/Deaton (Princeton 2015 PNAS, "Deaths of Despair" book 2020): white non-Hispanic working-age Americans com declining life expectancy via drugs, suicide, alcoholic liver disease. Concentrated em low-education. COVID exacerbou: 2020 LE dropped 1.9 years (~77.0 → 76.1). 2022 partial recovery. Opioid epidemic continues (~107k overdose deaths 2023). Structural causes: economic decline, social fragmentation.'
          en: 'Case/Deaton (Princeton 2015 PNAS, "Deaths of Despair" book 2020): white non-Hispanic working-age Americans with declining life expectancy via drugs, suicide, alcoholic liver disease. Concentrated in low-education. COVID exacerbated: 2020 LE dropped 1.9 years (~77.0 → 76.1). 2022 partial recovery. Opioid epidemic continues (~107k overdose deaths 2023). Structural causes: economic decline, social fragmentation.'
        objectives: [Deaths of despair]
      - type: choice
        difficulty: 5
        question:
          pt: 'Determinantes sociais da saúde (SDOH) são…'
          en: 'Social determinants of health (SDOH) are…'
        choices:
          - 'Conditions where people are born/live/work — housing, education, food, transportation, employment'
          - 'Apenas genéticos'
          - 'Sem qualquer impacto'
          - 'Apenas em US'
        correctAnswer: 'Conditions where people are born/live/work — housing, education, food, transportation, employment'
        rationale:
          pt: 'SDOH (WHO Marmot Commission 2008): non-medical factors driving outcomes (~80% population health vs ~20% medical care). Healthy People 2030 5 domains: Economic Stability, Education, Health & Care, Neighborhood, Social/Community. Z codes ICD-10 SDOH (Z55-Z65). Screening em primary care. ACA permits Medicaid SDOH spending.'
          en: 'SDOH (WHO Marmot Commission 2008): non-medical factors driving outcomes (~80% population health vs ~20% medical care). Healthy People 2030 5 domains: Economic Stability, Education, Health & Care, Neighborhood, Social/Community. Z codes ICD-10 SDOH (Z55-Z65). Primary care screening. ACA permits Medicaid SDOH spending.'
        objectives: [SDOH]
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito "syndemic" (Singer 1990s) refere-se a…'
          en: '"Syndemic" concept (Singer 1990s) refers to…'
        choices:
          - 'Sinérgicas epidemias (e.g. HIV+TB+poverty) interacting biologically + socially worse outcomes'
          - 'Apenas single disease'
          - 'Sem qualquer interação'
          - 'Apenas em pediatric'
        correctAnswer: 'Sinérgicas epidemias (e.g. HIV+TB+poverty) interacting biologically + socially worse outcomes'
        rationale:
          pt: 'Syndemic (Merrill Singer): "synergistic epidemics" beyond comorbidity — biológica e social interaction. Exemplos: HIV/TB (HIV depletes CD4 → TB reactivation), HIV/STI/SUDs, COVID/diabetes/obesity/poverty. Implications: integrated multi-disease intervention. Diferente de syndemic vs comorbidity: explicit social context. Teoria "Lancet syndemic" 2017 series.'
          en: 'Syndemic (Merrill Singer): "synergistic epidemics" beyond comorbidity — biological and social interaction. Examples: HIV/TB (HIV depletes CD4 → TB reactivation), HIV/STI/SUDs, COVID/diabetes/obesity/poverty. Implications: integrated multi-disease intervention. Different from syndemic vs comorbidity: explicit social context. Lancet syndemic 2017 series theory.'
        objectives: [Syndemic]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em mental health global, "WHO Mental Health Gap Action Programme" (mhGAP) propõe…'
          en: 'In global mental health, WHO mhGAP (Mental Health Gap Action Programme) proposes…'
        choices:
          - 'Task-shifting de mental health care a non-specialist health workers em LMIC via simplified guidelines'
          - 'Apenas specialists'
          - 'Sem qualquer estrutura'
          - 'Apenas em pediatric'
        correctAnswer: 'Task-shifting de mental health care a non-specialist health workers em LMIC via simplified guidelines'
        rationale:
          pt: 'mhGAP (WHO 2008+): treatment gap ~75-95% em LMIC. Intervention Guide 2.0 (2016): primary care can deliver evidence-based interventions for depression, psychosis, epilepsy, suicide, substance use. Lancet Commission on Global Mental Health 2018, 2024. Friendship Bench Zimbabwe (Chibanda) lay counselors. Strong cost-effective evidence em LMIC.'
          en: 'mhGAP (WHO 2008+): treatment gap ~75-95% in LMIC. Intervention Guide 2.0 (2016): primary care can deliver evidence-based interventions for depression, psychosis, epilepsy, suicide, substance use. Lancet Commission on Global Mental Health 2018, 2024. Friendship Bench Zimbabwe (Chibanda) lay counselors. Strong cost-effective evidence in LMIC.'
        objectives: [mhGAP]
      - type: choice
        difficulty: 5
        question:
          pt: 'COVID-19 vaccine equity foi prejudicado por…'
          en: 'COVID-19 vaccine equity was hurt by…'
        choices:
          - 'HIC hoarding doses, COVAX undersupplied, IP/patent restrictions, manufacturing concentration'
          - 'Apenas LMIC fault'
          - 'Sem qualquer issue'
          - 'Apenas em US'
        correctAnswer: 'HIC hoarding doses, COVAX undersupplied, IP/patent restrictions, manufacturing concentration'
        rationale:
          pt: '~80% vaccinas iniciais foram para HIC. COVAX targeted 20% LMIC mas falhou achieve. Africa em 2022 apenas ~10% vaccinated full série. India SII Covishield AstraZeneca bloqueada exportação durante Delta wave domestic. WTO TRIPS waiver discussed (June 2022 limited agreement). mRNA tech transfer hub WHO Cape Town 2021. Lessons for next pandemic.'
          en: '~80% of initial vaccines went to HIC. COVAX targeted 20% LMIC but failed to achieve. Africa in 2022 only ~10% fully vaccinated. India SII Covishield AstraZeneca blocked export during domestic Delta wave. WTO TRIPS waiver discussed (June 2022 limited agreement). WHO Cape Town mRNA tech transfer hub 2021. Lessons for next pandemic.'
        objectives: [Vaccine equity]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em climate change & health (Lancet Countdown 2024 report)…'
          en: 'In climate change & health (Lancet Countdown 2024 report)…'
        choices:
          - 'Heat-related deaths +167% sobre 1990s; air pollution PM2.5 ~6.7M deaths/ano; vector-borne expandindo'
          - 'Apenas teórico'
          - 'Sem qualquer impacto'
          - 'Apenas em pediatric'
        correctAnswer: 'Heat-related deaths +167% sobre 1990s; air pollution PM2.5 ~6.7M deaths/ano; vector-borne expandindo'
        rationale:
          pt: 'Lancet Countdown (2015+): annual indicators report. 2024: hottest year. Vibrio coastal expansão. Dengue ~5M cases (rise). Wildfire smoke worsening Asthma/COPD. Heat-related occupational deaths. Mental health (climate anxiety). Mitigation co-benefits health (air quality, active transport). COP28/29 health day. Climate finance gap.'
          en: 'Lancet Countdown (2015+): annual indicators report. 2024: hottest year. Vibrio coastal expansion. Dengue ~5M cases (rising). Wildfire smoke worsening asthma/COPD. Heat-related occupational deaths. Mental health (climate anxiety). Mitigation health co-benefits (air quality, active transport). COP28/29 health day. Climate finance gap.'
        objectives: [Climate health]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em US Native American/Alaska Native populations, IHS (Indian Health Service)…'
          en: 'In US Native American/Alaska Native populations, IHS (Indian Health Service)…'
        choices:
          - 'Federal underfunded chronicamente; ~$4k/person/ano vs Medicare ~$11k; treaty obligations'
          - 'Bem-funded'
          - 'Sem qualquer issue'
          - 'Apenas em US'
        correctAnswer: 'Federal underfunded chronicamente; ~$4k/person/ano vs Medicare ~$11k; treaty obligations'
        rationale:
          pt: 'IHS: federal trust responsibility para 574 federally recognized tribes (~2.6M people). Funding inadequado historically. Outcomes: highest US life expectancy disparity. AN/AI women maternal mortality ~50/100k. COVID-19 Navajo Nation hardest-hit. Solutions: full funding ($23B/year needed vs $7B funded), self-determination expansion (PRO-PL 93-638), Indian Health Care Improvement Act reauthorization.'
          en: 'IHS: federal trust responsibility for 574 federally recognized tribes (~2.6M people). Historically inadequate funding. Outcomes: highest US life expectancy disparity. AN/AI women maternal mortality ~50/100k. Navajo Nation hardest-hit by COVID-19. Solutions: full funding ($23B/year needed vs $7B funded), self-determination expansion (PRO-PL 93-638), Indian Health Care Improvement Act reauthorization.'
        objectives: [IHS]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em tropical surgery, "Lancet Commission on Global Surgery" (Meara 2015) reportou…'
          en: 'In tropical surgery, "Lancet Commission on Global Surgery" (Meara 2015) reported…'
        choices:
          - '5B sem acceso seguro a surgical care; 143M procedures needed annually mas not delivered'
          - 'Apenas em HIC'
          - 'Sem qualquer dado'
          - 'Apenas pediatric'
        correctAnswer: '5B sem acceso seguro a surgical care; 143M procedures needed annually mas not delivered'
        rationale:
          pt: 'Lancet Global Surgery 2030 Commission (Meara/Farmer 2015): unmet surgical need. Cesarean section, fracture fixation, hernia, cataract among bigger needs. Initiatives: Smile Train (cleft lip), Mercy Ships, Operation Smile, ITM Antwerp tropical surgery. Strengthening systems > vertical programs. WHO World Bank Disease Control Priorities 3rd edition added surgery.'
          en: 'Lancet Global Surgery 2030 Commission (Meara/Farmer 2015): unmet surgical need. Cesarean section, fracture fixation, hernia, cataract among biggest needs. Initiatives: Smile Train (cleft lip), Mercy Ships, Operation Smile, ITM Antwerp tropical surgery. Strengthening systems > vertical programs. WHO World Bank Disease Control Priorities 3rd edition added surgery.'
        objectives: [Global surgery]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em DALY metrics, top 5 risk factors globally include…'
          en: 'In DALY metrics, top 5 global risk factors include…'
        choices:
          - 'High BP, smoking, ambient air pollution, high BMI, dietary risks (GBD 2019)'
          - 'Apenas trauma'
          - 'Sem qualquer ranking'
          - 'Apenas pediatric'
        correctAnswer: 'High BP, smoking, ambient air pollution, high BMI, dietary risks (GBD 2019)'
        rationale:
          pt: 'GBD 2019 (Lancet): top risks DALY globally — high SBP, tobacco, child malnutrition, ambient air pollution, high BMI, alcohol, household air pollution, dietary salt. NCD-driven world. Mudou de infectious diseases (HIV, malaria) lideram em early 1990s para chronic disease era. Prevention focus: tobacco taxation, sugar tax, salt reduction, air quality regulations.'
          en: 'GBD 2019 (Lancet): top global risks by DALY — high SBP, tobacco, child malnutrition, ambient air pollution, high BMI, alcohol, household air pollution, dietary salt. NCD-driven world. Shifted from infectious diseases (HIV, malaria) leading in early 1990s to chronic disease era. Prevention focus: tobacco taxation, sugar tax, salt reduction, air quality regulations.'
        objectives: [Top risks]
target: 20
