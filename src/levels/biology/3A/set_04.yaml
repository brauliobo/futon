title:
  pt: "🧠 Neurociência — neurônio e sinapse"
  en: "🧠 Neuroscience — neuron and synapse"
level: '3A'
subject: biology
objectives: [biology.neuroscience]
difficulty: 4
authorNotes: "Potencial de membrana, ação, sinapse química, neurotransmissores."
example:
  pt: "Ex.: estímulo → despolarização → potencial de ação → axônio → terminal → liberação de neurotransmissor → próximo neurônio."
  en: "Ex.: stimulus → depolarization → action potential → axon → terminal → neurotransmitter release → next neuron."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Potencial de ação", en: "Action potential"}
    description: {pt: "Como neurônios disparam.", en: "How neurons fire."}
    exercises:
      - type: choice
        question: {pt: "Potencial de membrana em repouso é tipicamente:", en: "Resting membrane potential is typically:"}
        choices:
          - {pt: "~−70 mV (interior negativo em relação ao exterior)", en: "~−70 mV (interior negative relative to outside)"}
          - {pt: "+100 mV", en: "+100 mV"}
          - {pt: "0 mV", en: "0 mV"}
          - {pt: "+1000 mV", en: "+1000 mV"}
        correctAnswer: {pt: "~−70 mV (interior negativo em relação ao exterior)", en: "~−70 mV (interior negative relative to outside)"}
        rationale: {pt: "Como bomba Na⁺/K⁺ + permeabilidade ao K⁺ criam gradiente, então a célula fica polarizada — pronta para disparar.", en: "Because Na⁺/K⁺ pump + K⁺ permeability create gradient, the cell is polarized — ready to fire."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Despolarização é:", en: "Depolarization is:"}
        choices:
          - {pt: "Interior fica menos negativo (entrada de Na⁺)", en: "Interior becomes less negative (Na⁺ entry)"}
          - {pt: "Sempre estável", en: "Always stable"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Interior fica menos negativo (entrada de Na⁺)", en: "Interior becomes less negative (Na⁺ entry)"}
        rationale: {pt: "Como canais de Na⁺ abrem-se por estímulo, então cargas positivas entram e o potencial sobe — \"gatilho\" do disparo.", en: "Because Na⁺ channels open from stimulus, positive charges enter and potential rises — firing \"trigger\"."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Limiar de disparo é o ponto onde:", en: "Threshold of firing is the point where:"}
        choices:
          - {pt: "Despolarização atinge nível crítico — desencadeia potencial de ação completo", en: "Depolarization reaches critical level — triggers full action potential"}
          - {pt: "Sempre dispara", en: "Always fires"}
          - {pt: "Nunca dispara", en: "Never fires"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Despolarização atinge nível crítico — desencadeia potencial de ação completo", en: "Depolarization reaches critical level — triggers full action potential"}
        rationale: {pt: "Como princípio \"tudo-ou-nada\", então abaixo do limiar não há disparo, acima é completo independente da força.", en: "Because of \"all-or-nothing\" principle, below threshold no firing, above is complete regardless of strength."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Repolarização envolve:", en: "Repolarization involves:"}
        choices:
          - {pt: "Saída de K⁺ — interior volta a ficar negativo", en: "K⁺ exit — interior returns to negative"}
          - {pt: "Entrada de Na⁺", en: "Na⁺ entry"}
          - {pt: "Sem mudança", en: "No change"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Saída de K⁺ — interior volta a ficar negativo", en: "K⁺ exit — interior returns to negative"}
        rationale: {pt: "Como canais de K⁺ abrem-se após Na⁺ inativarem, então restauração rápida prepara para próximo disparo.", en: "Because K⁺ channels open after Na⁺ inactivate, fast restoration preps for next firing."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Período refratário:", en: "Refractory period:"}
        choices:
          - {pt: "Curto intervalo após PA quando neurônio não pode disparar novamente", en: "Brief interval after AP when neuron cannot fire again"}
          - {pt: "Sempre disparando", en: "Always firing"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Curto intervalo após PA quando neurônio não pode disparar novamente", en: "Brief interval after AP when neuron cannot fire again"}
        rationale: {pt: "Como canais de Na⁺ estão inativados, então PAs viajam unidirecionalmente — sem reflexo no axônio.", en: "Because Na⁺ channels are inactivated, APs travel unidirectionally — no axon reflex."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Mielina acelera condução porque:", en: "Myelin speeds conduction because:"}
        choices:
          - {pt: "Isola o axônio; PA \"salta\" entre nódulos de Ranvier (condução saltatória)", en: "Insulates axon; AP \"jumps\" between Ranvier nodes (saltatory conduction)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Sempre lentifica", en: "Always slows"}
        correctAnswer: {pt: "Isola o axônio; PA \"salta\" entre nódulos de Ranvier (condução saltatória)", en: "Insulates axon; AP \"jumps\" between Ranvier nodes (saltatory conduction)"}
        rationale: {pt: "Como ~100× mais rápido, então neurônios mielinizados conduzem em ~100 m/s vs ~1 m/s sem mielina.", en: "Because ~100× faster, myelinated neurons conduct at ~100 m/s vs ~1 m/s unmyelinated."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Esclerose múltipla afeta:", en: "Multiple sclerosis affects:"}
        choices:
          - {pt: "Bainha de mielina (autoimune) — condução lentifica/falha", en: "Myelin sheath (autoimmune) — conduction slows/fails"}
          - {pt: "Apenas músculos", en: "Just muscles"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Bainha de mielina (autoimune) — condução lentifica/falha", en: "Myelin sheath (autoimmune) — conduction slows/fails"}
        rationale: {pt: "Como ataque imune destrói mielina no SNC, então sintomas neurológicos progressivos surgem.", en: "Because immune attack destroys CNS myelin, progressive neurological symptoms emerge."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Sinapse química usa:", en: "Chemical synapse uses:"}
        choices:
          - {pt: "Neurotransmissores liberados na fenda — atravessam por difusão", en: "Neurotransmitters released into cleft — cross by diffusion"}
          - {pt: "Apenas eletricidade", en: "Just electricity"}
          - {pt: "Apenas hormônios", en: "Just hormones"}
          - {pt: "Sem mecanismo", en: "No mechanism"}
        correctAnswer: {pt: "Neurotransmissores liberados na fenda — atravessam por difusão", en: "Neurotransmitters released into cleft — cross by diffusion"}
        rationale: {pt: "Como convertem sinal elétrico em químico, então sinapses químicas permitem modulação fina e plasticidade.", en: "Because they convert electrical to chemical signal, chemical synapses enable fine modulation and plasticity."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Acetilcolina (ACh):", en: "Acetylcholine (ACh):"}
        choices:
          - {pt: "Neurotransmissor da junção neuromuscular e SNP parassimpático", en: "Neurotransmitter at neuromuscular junction and parasympathetic PNS"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem função", en: "No function"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Neurotransmissor da junção neuromuscular e SNP parassimpático", en: "Neurotransmitter at neuromuscular junction and parasympathetic PNS"}
        rationale: {pt: "Como liga-se a receptores nicotínicos/muscarínicos, então move músculos e regula órgãos — alvo de muitos fármacos.", en: "Because it binds nicotinic/muscarinic receptors, it moves muscles and regulates organs — target of many drugs."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Dopamina, serotonina, noradrenalina:", en: "Dopamine, serotonin, norepinephrine:"}
        choices:
          - {pt: "Monoaminas — humor, motivação, alerta; alvos de antidepressivos", en: "Monoamines — mood, motivation, alertness; antidepressant targets"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Monoaminas — humor, motivação, alerta; alvos de antidepressivos", en: "Monoamines — mood, motivation, alertness; antidepressant targets"}
        rationale: {pt: "Como SSRIs aumentam serotonina sináptica, então aliviam depressão — base da psicofarmacologia moderna.", en: "Because SSRIs raise synaptic serotonin, they relieve depression — basis of modern psychopharmacology."}
        objectives: [biology.neuroscience]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Plasticidade e patologia", en: "Plasticity and pathology"}
    description: {pt: "Aprendizado e doenças neurológicas.", en: "Learning and neurological disease."}
    exercises:
      - type: choice
        question: {pt: "Plasticidade sináptica:", en: "Synaptic plasticity:"}
        choices:
          - {pt: "Capacidade de sinapses mudarem força com uso (LTP/LTD) — base do aprendizado", en: "Synapses' ability to change strength with use (LTP/LTD) — basis of learning"}
          - {pt: "Sempre fixa", en: "Always fixed"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Capacidade de sinapses mudarem força com uso (LTP/LTD) — base do aprendizado", en: "Synapses' ability to change strength with use (LTP/LTD) — basis of learning"}
        rationale: {pt: "Como Hebb postulou \"neurônios que disparam juntos conectam-se\", então memória surge de circuitos modificados.", en: "Because Hebb posited \"neurons that fire together wire together\", memory emerges from modified circuits."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "GABA é:", en: "GABA is:"}
        choices:
          - {pt: "Principal neurotransmissor inibitório do SNC", en: "Main inhibitory CNS neurotransmitter"}
          - {pt: "Sempre excitatório", en: "Always excitatory"}
          - {pt: "Apenas em músculos", en: "Just in muscles"}
          - {pt: "Sem função", en: "No function"}
        correctAnswer: {pt: "Principal neurotransmissor inibitório do SNC", en: "Main inhibitory CNS neurotransmitter"}
        rationale: {pt: "Como abre canais de Cl⁻ hiperpolarizando, então benzodiazepínicos potencializam GABA — efeito ansiolítico.", en: "Because it opens Cl⁻ channels hyperpolarizing, benzodiazepines potentiate GABA — anxiolytic effect."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Glutamato é:", en: "Glutamate is:"}
        choices:
          - {pt: "Principal neurotransmissor excitatório do SNC", en: "Main excitatory CNS neurotransmitter"}
          - {pt: "Sempre inibitório", en: "Always inhibitory"}
          - {pt: "Apenas em músculos", en: "Just in muscles"}
          - {pt: "Sem função", en: "No function"}
        correctAnswer: {pt: "Principal neurotransmissor excitatório do SNC", en: "Main excitatory CNS neurotransmitter"}
        rationale: {pt: "Como ativa receptores AMPA/NMDA, então é central na aprendizagem — excesso causa excitotoxicidade.", en: "Because it activates AMPA/NMDA receptors, it's central to learning — excess causes excitotoxicity."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Doença de Parkinson envolve:", en: "Parkinson's disease involves:"}
        choices:
          - {pt: "Perda de neurônios dopaminérgicos na substância negra", en: "Loss of dopaminergic neurons in substantia nigra"}
          - {pt: "Apenas memória", en: "Just memory"}
          - {pt: "Sem mecanismo", en: "No mechanism"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Perda de neurônios dopaminérgicos na substância negra", en: "Loss of dopaminergic neurons in substantia nigra"}
        rationale: {pt: "Como dopamina coordena movimento, então tremor e rigidez surgem — L-dopa é tratamento padrão.", en: "Because dopamine coordinates movement, tremor and rigidity arise — L-dopa is standard treatment."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Doença de Alzheimer envolve:", en: "Alzheimer's disease involves:"}
        choices:
          - {pt: "Acúmulo de β-amiloide e tau hiperfosforilado — perda de neurônios e memória", en: "Buildup of β-amyloid and hyperphosphorylated tau — neuron and memory loss"}
          - {pt: "Apenas envelhecimento normal", en: "Just normal aging"}
          - {pt: "Sem causa", en: "Causeless"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Acúmulo de β-amiloide e tau hiperfosforilado — perda de neurônios e memória", en: "Buildup of β-amyloid and hyperphosphorylated tau — neuron and memory loss"}
        rationale: {pt: "Como placas e emaranhados destroem sinapses, então memória recente falha primeiro — terapias atuam nas placas.", en: "Because plaques and tangles destroy synapses, recent memory fails first — therapies target plaques."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Epilepsia é:", en: "Epilepsy is:"}
        choices:
          - {pt: "Disparos elétricos descontrolados de neurônios — convulsões", en: "Uncontrolled electrical neuron firing — seizures"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem causa", en: "Causeless"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Disparos elétricos descontrolados de neurônios — convulsões", en: "Uncontrolled electrical neuron firing — seizures"}
        rationale: {pt: "Como hiperexcitabilidade pode propagar-se, então anticonvulsivantes atuam em canais iônicos para estabilizar.", en: "Because hyperexcitability can spread, anticonvulsants act on ion channels to stabilize."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "AVC (acidente vascular cerebral):", en: "Stroke:"}
        choices:
          - {pt: "Interrupção de fluxo sanguíneo cerebral (isquêmico ou hemorrágico) — emergência", en: "Brain blood flow interruption (ischemic or hemorrhagic) — emergency"}
          - {pt: "Apenas dor de cabeça", en: "Just headache"}
          - {pt: "Sem urgência", en: "No urgency"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Interrupção de fluxo sanguíneo cerebral (isquêmico ou hemorrágico) — emergência", en: "Brain blood flow interruption (ischemic or hemorrhagic) — emergency"}
        rationale: {pt: "Como neurônios morrem em minutos sem O₂, então \"tempo é cérebro\" — tratamento rápido salva tecido.", en: "Because neurons die in minutes without O₂, \"time is brain\" — fast treatment saves tissue."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Drogas psicoativas atuam em:", en: "Psychoactive drugs act on:"}
        choices:
          - {pt: "Sinapses — modulam liberação, recaptação ou receptores de neurotransmissores", en: "Synapses — modulate release, reuptake, or neurotransmitter receptors"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Sinapses — modulam liberação, recaptação ou receptores de neurotransmissores", en: "Synapses — modulate release, reuptake, or neurotransmitter receptors"}
        rationale: {pt: "Como cocaína bloqueia recaptação de dopamina, então causa euforia intensa — base de dependência.", en: "Because cocaine blocks dopamine reuptake, it causes intense euphoria — basis of addiction."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Glia (células gliais):", en: "Glia (glial cells):"}
        choices:
          - {pt: "Suporte aos neurônios — astrócitos, oligodendrócitos, micróglia, schwann", en: "Neuron support — astrocytes, oligodendrocytes, microglia, Schwann"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre nervosos", en: "Always neuronal"}
          - {pt: "Sem função", en: "No function"}
        correctAnswer: {pt: "Suporte aos neurônios — astrócitos, oligodendrócitos, micróglia, schwann", en: "Neuron support — astrocytes, oligodendrocytes, microglia, Schwann"}
        rationale: {pt: "Como superam neurônios em número, então glia mantém ambiente, mieliniza, defende e modula sinapses.", en: "Because they outnumber neurons, glia maintain environment, myelinate, defend, and modulate synapses."}
        objectives: [biology.neuroscience]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: neurônios:", en: "Summary: neurons:"}
        choices:
          - {pt: "Geram e propagam sinais elétricos via canais iônicos; comunicam-se por sinapses químicas", en: "Generate and propagate electrical signals via ion channels; communicate via chemical synapses"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Geram e propagam sinais elétricos via canais iônicos; comunicam-se por sinapses químicas", en: "Generate and propagate electrical signals via ion channels; communicate via chemical synapses"}
        rationale: {pt: "Como base do pensamento, sentimento e ação, então a neurociência aplica-se a saúde mental e neurológica.", en: "Because they're the basis of thought, feeling, and action, neuroscience applies to mental and neurological health."}
        objectives: [biology.neuroscience]
        difficulty: 4
target: 20
