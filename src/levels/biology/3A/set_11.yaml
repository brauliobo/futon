title:
  pt: "🐘 Fisiologia animal comparada"
  en: "🐘 Comparative animal physiology"
level: '3A'
subject: biology
objectives: [biology.comparative_physiology]
difficulty: 4
authorNotes: "Adaptações em diferentes ambientes: aquático, terrestre, aéreo, extremos."
example:
  pt: "Ex.: peixes têm brânquias; aves têm sacos aéreos; mamíferos têm pulmões alveolares — soluções para mesma tarefa (O₂)."
  en: "Ex.: fish have gills; birds have air sacs; mammals have alveolar lungs — solutions for same task (O₂)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Trocas gasosas", en: "Gas exchange"}
    description: {pt: "Como diferentes animais respiram.", en: "How different animals breathe."}
    exercises:
      - type: choice
        question: {pt: "Brânquias de peixes:", en: "Fish gills:"}
        choices:
          - {pt: "Filamentos finos com vasos — extração eficiente de O₂ dissolvido em água", en: "Thin filaments with vessels — efficient extraction of dissolved O₂ from water"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Iguais a pulmões", en: "Same as lungs"}
          - {pt: "Sem função", en: "No function"}
        correctAnswer: {pt: "Filamentos finos com vasos — extração eficiente de O₂ dissolvido em água", en: "Thin filaments with vessels — efficient extraction of dissolved O₂ from water"}
        rationale: {pt: "Como água tem ~30× menos O₂ que ar, então peixes precisam superfície enorme — fluxo contracorrente otimiza.", en: "Because water has ~30× less O₂ than air, fish need huge surface — countercurrent flow optimizes."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Sacos aéreos de aves:", en: "Bird air sacs:"}
        choices:
          - {pt: "Sistema de fluxo unidirecional — eficiência respiratória muito superior à dos mamíferos", en: "Unidirectional flow system — respiratory efficiency far greater than mammals'"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Iguais a pulmões mamíferos", en: "Same as mammalian lungs"}
          - {pt: "Sem função", en: "No function"}
        correctAnswer: {pt: "Sistema de fluxo unidirecional — eficiência respiratória muito superior à dos mamíferos", en: "Unidirectional flow system — respiratory efficiency far greater than mammals'"}
        rationale: {pt: "Como voo exige enorme demanda de O₂, então aves evoluíram sistema mais eficiente — voam até em alta altitude (Himalaia).", en: "Because flight demands huge O₂ supply, birds evolved a more efficient system — fly even at altitude (Himalaya)."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Traqueias de insetos:", en: "Insect tracheae:"}
        choices:
          - {pt: "Tubos diretos do exterior aos tecidos — sem necessidade de sangue para O₂", en: "Direct tubes from outside to tissues — no blood needed for O₂"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Iguais a brânquias", en: "Same as gills"}
          - {pt: "Sem função", en: "No function"}
        correctAnswer: {pt: "Tubos diretos do exterior aos tecidos — sem necessidade de sangue para O₂", en: "Direct tubes from outside to tissues — no blood needed for O₂"}
        rationale: {pt: "Como difusão limita tamanho, então insetos não podem ser muito grandes — daí limite evolutivo de tamanho.", en: "Because diffusion limits size, insects can't be very large — hence evolutionary size limit."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Anfíbios fazem trocas gasosas por:", en: "Amphibians do gas exchange via:"}
        choices:
          - {pt: "Pulmões + pele (cutânea) + cavidade bucal — múltiplas vias", en: "Lungs + skin (cutaneous) + buccal cavity — multiple pathways"}
          - {pt: "Apenas pulmões", en: "Just lungs"}
          - {pt: "Apenas pele", en: "Just skin"}
          - {pt: "Sem trocas", en: "No exchange"}
        correctAnswer: {pt: "Pulmões + pele (cutânea) + cavidade bucal — múltiplas vias", en: "Lungs + skin (cutaneous) + buccal cavity — multiple pathways"}
        rationale: {pt: "Como pele permeável é vital, então anfíbios são sensíveis a poluição — bioindicadores ambientais.", en: "Because permeable skin is vital, amphibians are pollution-sensitive — environmental bioindicators."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Mergulho prolongado em mamíferos marinhos:", en: "Prolonged diving in marine mammals:"}
        choices:
          - {pt: "Reflexo de mergulho: bradicardia + vasoconstrição + alta mioglobina", en: "Diving reflex: bradycardia + vasoconstriction + high myoglobin"}
          - {pt: "Sem adaptação", en: "No adaptation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre afogamento", en: "Always drowning"}
        correctAnswer: {pt: "Reflexo de mergulho: bradicardia + vasoconstrição + alta mioglobina", en: "Diving reflex: bradycardia + vasoconstriction + high myoglobin"}
        rationale: {pt: "Como baleias mergulham 1+ hora, então adaptações economizam O₂ e direcionam-no a órgãos vitais.", en: "Because whales dive 1+ hour, adaptations save O₂ and direct it to vital organs."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Termorregulação em endotérmicos:", en: "Endothermic thermoregulation:"}
        choices:
          - {pt: "Geram calor metabólico (mamíferos, aves) — independência ambiental", en: "Generate metabolic heat (mammals, birds) — environmental independence"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre dependem do sol", en: "Always sun-dependent"}
          - {pt: "Sem regulação", en: "No regulation"}
        correctAnswer: {pt: "Geram calor metabólico (mamíferos, aves) — independência ambiental", en: "Generate metabolic heat (mammals, birds) — environmental independence"}
        rationale: {pt: "Como mantêm temperatura ~37 °C, então funcionam em ambientes diversos — alto custo energético compensado por independência.", en: "Because they maintain ~37 °C, they function in diverse environments — high energy cost offset by independence."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Ectotérmicos:", en: "Ectotherms:"}
        choices:
          - {pt: "Dependem de calor ambiental — peixes, anfíbios, répteis, invertebrados", en: "Depend on ambient heat — fish, amphibians, reptiles, invertebrates"}
          - {pt: "Sempre quentes", en: "Always warm"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem regulação", en: "No regulation"}
        correctAnswer: {pt: "Dependem de calor ambiental — peixes, anfíbios, répteis, invertebrados", en: "Depend on ambient heat — fish, amphibians, reptiles, invertebrates"}
        rationale: {pt: "Como gastam menos energia, então sobrevivem com pouca comida — mas atividade depende de temperatura externa.", en: "Because they use less energy, they survive on little food — but activity depends on external temperature."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Camelo no deserto:", en: "Desert camel:"}
        choices:
          - {pt: "Tolera variação de temperatura corporal, urina concentrada, gordura na corcova como reserva", en: "Tolerates body temperature variation, concentrated urine, hump fat as reserve"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem adaptações", en: "No adaptations"}
          - {pt: "Sempre desidratado", en: "Always dehydrated"}
        correctAnswer: {pt: "Tolera variação de temperatura corporal, urina concentrada, gordura na corcova como reserva", en: "Tolerates body temperature variation, concentrated urine, hump fat as reserve"}
        rationale: {pt: "Como pode perder >25% do peso em água sem morrer, então camelos são adaptados a desertos extremos.", en: "Because they can lose >25% body weight as water without dying, camels are adapted to extreme deserts."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Animais polares:", en: "Polar animals:"}
        choices:
          - {pt: "Pelo denso, gordura subcutânea, contracorrente vascular nas extremidades", en: "Dense fur, subcutaneous fat, vascular countercurrent in extremities"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem adaptações", en: "No adaptations"}
          - {pt: "Sempre congelam", en: "Always freeze"}
        correctAnswer: {pt: "Pelo denso, gordura subcutânea, contracorrente vascular nas extremidades", en: "Dense fur, subcutaneous fat, vascular countercurrent in extremities"}
        rationale: {pt: "Como contracorrente preserva calor central, então pernas de focas/aves polares ficam frias mas corpo quente.", en: "Because countercurrent preserves core heat, polar seal/bird legs stay cold but body warm."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Extremófilos (animais em condições extremas):", en: "Extremophiles (animals in extreme conditions):"}
        choices:
          - {pt: "Tardígrados — sobrevivem desidratação extrema, radiação, vácuo (criptobiose)", en: "Tardigrades — survive extreme desiccation, radiation, vacuum (cryptobiosis)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Não existem", en: "Don't exist"}
          - {pt: "Sempre morrem", en: "Always die"}
        correctAnswer: {pt: "Tardígrados — sobrevivem desidratação extrema, radiação, vácuo (criptobiose)", en: "Tardigrades — survive extreme desiccation, radiation, vacuum (cryptobiosis)"}
        rationale: {pt: "Como entram em estado dormente, então tardígrados são quase indestrutíveis — alvo de pesquisa em astrobiologia.", en: "Because they enter dormancy, tardigrades are nearly indestructible — astrobiology research target."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Outros sistemas comparados", en: "Other compared systems"}
    description: {pt: "Diferenças notáveis entre animais.", en: "Notable differences across animals."}
    exercises:
      - type: choice
        question: {pt: "Sistema circulatório aberto (insetos, moluscos não-cefalópodes):", en: "Open circulatory system (insects, non-cephalopod mollusks):"}
        choices:
          - {pt: "Hemolinfa banha tecidos diretamente — sem pressão alta nem distribuição precisa", en: "Hemolymph bathes tissues directly — no high pressure or precise distribution"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre fechado", en: "Always closed"}
          - {pt: "Sem coração", en: "No heart"}
        correctAnswer: {pt: "Hemolinfa banha tecidos diretamente — sem pressão alta nem distribuição precisa", en: "Hemolymph bathes tissues directly — no high pressure or precise distribution"}
        rationale: {pt: "Como funciona em corpos pequenos com baixa demanda metabólica, então insetos prosperam mas não atingem grandes tamanhos.", en: "Because it works in small bodies with low metabolic demand, insects thrive but can't reach large sizes."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Sistema circulatório fechado (vertebrados):", en: "Closed circulatory system (vertebrates):"}
        choices:
          - {pt: "Sangue confinado em vasos — alta pressão, distribuição eficiente", en: "Blood confined in vessels — high pressure, efficient distribution"}
          - {pt: "Apenas em insetos", en: "Only in insects"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "Sangue confinado em vasos — alta pressão, distribuição eficiente", en: "Blood confined in vessels — high pressure, efficient distribution"}
        rationale: {pt: "Como permite controle preciso de fluxo, então sustenta vertebrados grandes e ativos como humanos.", en: "Because it allows precise flow control, it sustains large active vertebrates like humans."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Excreção em peixes ósseos vs aves:", en: "Excretion in bony fish vs birds:"}
        choices:
          - {pt: "Peixes: amônia (água barata); aves: ácido úrico (econômico em peso e água)", en: "Fish: ammonia (cheap water); birds: uric acid (economical in weight and water)"}
          - {pt: "Iguais", en: "Identical"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem variação", en: "No variation"}
        correctAnswer: {pt: "Peixes: amônia (água barata); aves: ácido úrico (econômico em peso e água)", en: "Fish: ammonia (cheap water); birds: uric acid (economical in weight and water)"}
        rationale: {pt: "Como aves voam e precisam ser leves, então excretam ácido úrico pastoso — sem urina líquida pesada.", en: "Because birds fly and need to be light, they excrete pasty uric acid — no heavy liquid urine."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Reprodução comparada — exemplos:", en: "Comparative reproduction — examples:"}
        choices:
          - {pt: "Ovíparos (ovos), vivíparos (gestação interna), ovovivíparos (ovos retidos)", en: "Oviparous (eggs), viviparous (internal gestation), ovoviviparous (retained eggs)"}
          - {pt: "Sempre uma forma", en: "Always one form"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem variação", en: "No variation"}
        correctAnswer: {pt: "Ovíparos (ovos), vivíparos (gestação interna), ovovivíparos (ovos retidos)", en: "Oviparous (eggs), viviparous (internal gestation), ovoviviparous (retained eggs)"}
        rationale: {pt: "Como cada estratégia equilibra investimento por filho vs número, então reprodução ilustra trade-off central.", en: "Because each strategy balances investment-per-offspring vs number, reproduction illustrates a central trade-off."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Hibernação vs estivação:", en: "Hibernation vs estivation:"}
        choices:
          - {pt: "Hibernação: torpor inverno (ursos); estivação: torpor verão/seca (tartarugas)", en: "Hibernation: winter torpor (bears); estivation: summer/drought torpor (turtles)"}
          - {pt: "Iguais", en: "Identical"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Hibernação: torpor inverno (ursos); estivação: torpor verão/seca (tartarugas)", en: "Hibernation: winter torpor (bears); estivation: summer/drought torpor (turtles)"}
        rationale: {pt: "Como ambos reduzem metabolismo, então animais economizam energia em estações desfavoráveis.", en: "Because both reduce metabolism, animals save energy during unfavorable seasons."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Bioluminescência:", en: "Bioluminescence:"}
        choices:
          - {pt: "Produção de luz por organismos (vagalumes, água-viva, peixes abissais) — luciferina + luciferase", en: "Light production by organisms (fireflies, jellyfish, deep-sea fish) — luciferin + luciferase"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "Produção de luz por organismos (vagalumes, água-viva, peixes abissais) — luciferina + luciferase", en: "Light production by organisms (fireflies, jellyfish, deep-sea fish) — luciferin + luciferase"}
        rationale: {pt: "Como atrai parceiros, ilumina presas ou camufla, então tem múltiplas funções — usada em pesquisa biotecnológica.", en: "Because it attracts mates, lures prey, or camouflages, it has many functions — used in biotech research."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Eletrocepção (peixes elétricos):", en: "Electroreception (electric fish):"}
        choices:
          - {pt: "Detectam campos elétricos — usados para navegação, caça, comunicação", en: "Detect electric fields — used for navigation, hunting, communication"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Não existe", en: "Doesn't exist"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Detectam campos elétricos — usados para navegação, caça, comunicação", en: "Detect electric fields — used for navigation, hunting, communication"}
        rationale: {pt: "Como tubarões e poraquês detectam presas pela bioeletricidade, então é sentido importante em águas turvas.", en: "Because sharks and electric eels detect prey via bioelectricity, it's an important sense in murky waters."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Ecolocalização:", en: "Echolocation:"}
        choices:
          - {pt: "Emissão de som + escuta de eco para navegar/caçar (morcegos, golfinhos)", en: "Sound emission + echo listening to navigate/hunt (bats, dolphins)"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Emissão de som + escuta de eco para navegar/caçar (morcegos, golfinhos)", en: "Sound emission + echo listening to navigate/hunt (bats, dolphins)"}
        rationale: {pt: "Como permite navegação no escuro/turvo, então morcegos pegam insetos em pleno voo e cetáceos caçam em águas profundas.", en: "Because it allows dark/murky navigation, bats catch insects in flight and cetaceans hunt in deep waters."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Migração animal:", en: "Animal migration:"}
        choices:
          - {pt: "Movimentos sazonais por recursos (aves, baleias, tartarugas) — usa magnetorrecepção", en: "Seasonal movements for resources (birds, whales, turtles) — uses magnetoreception"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Movimentos sazonais por recursos (aves, baleias, tartarugas) — usa magnetorrecepção", en: "Seasonal movements for resources (birds, whales, turtles) — uses magnetoreception"}
        rationale: {pt: "Como animais detectam campo magnético terrestre, então migram milhares de km com precisão impressionante.", en: "Because animals detect Earth's magnetic field, they migrate thousands of km with impressive precision."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: fisiologia comparada:", en: "Summary: comparative physiology:"}
        choices:
          - {pt: "Mesmas funções vitais (respirar, comer, reproduzir) com soluções diversas adaptadas a ambientes", en: "Same vital functions (breathe, eat, reproduce) with diverse solutions adapted to environments"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre idênticas", en: "Always identical"}
          - {pt: "Sem variação", en: "No variation"}
        correctAnswer: {pt: "Mesmas funções vitais (respirar, comer, reproduzir) com soluções diversas adaptadas a ambientes", en: "Same vital functions (breathe, eat, reproduce) with diverse solutions adapted to environments"}
        rationale: {pt: "Como evolução atua em diferentes ambientes, então adaptações revelam tanto unidade quanto diversidade da vida.", en: "Because evolution acts in different environments, adaptations reveal both unity and diversity of life."}
        objectives: [biology.comparative_physiology]
        difficulty: 4
target: 20
