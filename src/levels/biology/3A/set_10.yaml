title:
  pt: "🌍 Biologia da conservação"
  en: "🌍 Conservation biology"
level: '3A'
subject: biology
objectives: [biology.conservation]
difficulty: 4
authorNotes: "Biodiversidade ameaçada, espécies invasoras, áreas protegidas, IUCN."
example:
  pt: "Ex.: lista vermelha IUCN classifica espécies (LC, NT, VU, EN, CR, EW, EX) — base para conservação."
  en: "Ex.: IUCN red list classifies species (LC, NT, VU, EN, CR, EW, EX) — basis for conservation."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Ameaças à biodiversidade", en: "Biodiversity threats"}
    description: {pt: "Por que espécies desaparecem.", en: "Why species disappear."}
    exercises:
      - type: choice
        question: {pt: "Cinco principais ameaças (HIPPO):", en: "Five main threats (HIPPO):"}
        choices:
          - {pt: "Habitat loss, Invasive species, Pollution, Population (humana), Overharvesting", en: "Habitat loss, Invasive species, Pollution, (Human) Population, Overharvesting"}
          - {pt: "Apenas caça", en: "Just hunting"}
          - {pt: "Sem ameaças", en: "No threats"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Habitat loss, Invasive species, Pollution, Population (humana), Overharvesting", en: "Habitat loss, Invasive species, Pollution, (Human) Population, Overharvesting"}
        rationale: {pt: "Como atuam sinergicamente, então o mnemônico HIPPO destaca os principais drivers de extinção atual.", en: "Because they act synergistically, the HIPPO mnemonic highlights main current extinction drivers."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Perda de habitat é:", en: "Habitat loss is:"}
        choices:
          - {pt: "Maior causa de extinção atual — desmatamento, urbanização, agricultura", en: "Largest cause of current extinction — deforestation, urbanization, agriculture"}
          - {pt: "Apenas caça", en: "Just hunting"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Maior causa de extinção atual — desmatamento, urbanização, agricultura", en: "Largest cause of current extinction — deforestation, urbanization, agriculture"}
        rationale: {pt: "Como ~80% das espécies dependem de habitat específico, então sua destruição é fator dominante de declínio.", en: "Because ~80% of species depend on specific habitat, its destruction is the dominant decline factor."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Espécies invasoras causam:", en: "Invasive species cause:"}
        choices:
          - {pt: "Competem ou predam nativas sem inimigos naturais — desbalanceiam ecossistemas", en: "Compete or predate natives without natural enemies — unbalance ecosystems"}
          - {pt: "Sempre ajudam", en: "Always help"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Competem ou predam nativas sem inimigos naturais — desbalanceiam ecossistemas", en: "Compete or predate natives without natural enemies — unbalance ecosystems"}
        rationale: {pt: "Como sapo cururu na Austrália ou caracol-gigante-africano no Brasil, então causam estragos em ecossistemas.", en: "Because cane toad in Australia or giant African snail in Brazil, they wreak havoc in ecosystems."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Mudanças climáticas afetam biodiversidade ao:", en: "Climate change affects biodiversity by:"}
        choices:
          - {pt: "Deslocar zonas climáticas — espécies não conseguem migrar/adaptar rápido o suficiente", en: "Shifting climate zones — species can't migrate/adapt fast enough"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Sempre benéfico", en: "Always beneficial"}
        correctAnswer: {pt: "Deslocar zonas climáticas — espécies não conseguem migrar/adaptar rápido o suficiente", en: "Shifting climate zones — species can't migrate/adapt fast enough"}
        rationale: {pt: "Como ursos polares dependem de gelo marinho, então perdem habitat conforme Ártico aquece.", en: "Because polar bears depend on sea ice, they lose habitat as Arctic warms."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Sobrepesca:", en: "Overfishing:"}
        choices:
          - {pt: "Captura acima da taxa de reprodução — colapso populacional (bacalhau, atum)", en: "Catching above reproduction rate — population collapse (cod, tuna)"}
          - {pt: "Sempre sustentável", en: "Always sustainable"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Captura acima da taxa de reprodução — colapso populacional (bacalhau, atum)", en: "Catching above reproduction rate — population collapse (cod, tuna)"}
        rationale: {pt: "Como tragédia dos commons, então sem regulação internacional pesqueiras entram em colapso.", en: "Because of tragedy of the commons, without international regulation fisheries collapse."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Tráfico de fauna:", en: "Wildlife trafficking:"}
        choices:
          - {pt: "Comércio ilegal de animais/produtos (marfim, escamas de pangolim, papagaios) — terceiro maior mercado ilegal", en: "Illegal trade in animals/products (ivory, pangolin scales, parrots) — third-largest illegal market"}
          - {pt: "Apenas legal", en: "Just legal"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Comércio ilegal de animais/produtos (marfim, escamas de pangolim, papagaios) — terceiro maior mercado ilegal", en: "Illegal trade in animals/products (ivory, pangolin scales, parrots) — third-largest illegal market"}
        rationale: {pt: "Como devasta espécies icônicas (rinoceronte, tigre), então CITES regula e fiscaliza globalmente.", en: "Because it devastates iconic species (rhino, tiger), CITES regulates and enforces globally."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Lista vermelha da IUCN classifica espécies em:", en: "IUCN Red List classifies species into:"}
        choices:
          - {pt: "LC, NT, VU, EN, CR, EW, EX — categorias de risco crescente de extinção", en: "LC, NT, VU, EN, CR, EW, EX — categories of rising extinction risk"}
          - {pt: "Apenas A, B, C", en: "Just A, B, C"}
          - {pt: "Sem categorias", en: "No categories"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "LC, NT, VU, EN, CR, EW, EX — categorias de risco crescente de extinção", en: "LC, NT, VU, EN, CR, EW, EX — categories of rising extinction risk"}
        rationale: {pt: "Como sistema padronizado globalmente, então facilita comunicação e priorização de conservação.", en: "Because globally standardized, it eases communication and conservation prioritization."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Espécie endêmica:", en: "Endemic species:"}
        choices:
          - {pt: "Ocorre naturalmente apenas em uma região (ex.: lemures de Madagascar)", en: "Occurs naturally in only one region (e.g., Madagascar lemurs)"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
          - {pt: "Em todo o planeta", en: "Worldwide"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Ocorre naturalmente apenas em uma região (ex.: lemures de Madagascar)", en: "Occurs naturally in only one region (e.g., Madagascar lemurs)"}
        rationale: {pt: "Como vulneráveis a perda local, então proteção do habitat é crítica — perda em casa = extinção global.", en: "Because vulnerable to local loss, habitat protection is critical — loss at home = global extinction."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Hotspot de biodiversidade:", en: "Biodiversity hotspot:"}
        choices:
          - {pt: "Região com alta diversidade endêmica + grande ameaça (>70% de habitat perdido)", en: "Region with high endemic diversity + major threat (>70% habitat lost)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem definição", en: "No definition"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Região com alta diversidade endêmica + grande ameaça (>70% de habitat perdido)", en: "Region with high endemic diversity + major threat (>70% habitat lost)"}
        rationale: {pt: "Como Mata Atlântica e Cerrado são hotspots, então conservação focada protege biodiversidade desproporcional.", en: "Because Atlantic Forest and Cerrado are hotspots, focused conservation protects disproportionate biodiversity."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "6ª extinção em massa:", en: "6th mass extinction:"}
        choices:
          - {pt: "Atual — primariamente causada por humanos (Antropoceno)", en: "Current — primarily human-caused (Anthropocene)"}
          - {pt: "Apenas natural", en: "Just natural"}
          - {pt: "Não está acontecendo", en: "Not happening"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Atual — primariamente causada por humanos (Antropoceno)", en: "Current — primarily human-caused (Anthropocene)"}
        rationale: {pt: "Como taxas de extinção são 100-1000× a normal, então biodiversidade declina rapidamente — perda irreversível.", en: "Because extinction rates are 100-1000× normal, biodiversity declines rapidly — irreversible loss."}
        objectives: [biology.conservation]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Estratégias de conservação", en: "Conservation strategies"}
    description: {pt: "O que podemos fazer.", en: "What we can do."}
    exercises:
      - type: choice
        question: {pt: "Conservação in situ:", en: "In situ conservation:"}
        choices:
          - {pt: "Proteção em habitat natural — parques, reservas, UCs", en: "Protection in natural habitat — parks, reserves, protected areas"}
          - {pt: "Apenas zoológicos", en: "Just zoos"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem aplicação", en: "No application"}
        correctAnswer: {pt: "Proteção em habitat natural — parques, reservas, UCs", en: "Protection in natural habitat — parks, reserves, protected areas"}
        rationale: {pt: "Como mantém ecossistemas funcionais, então in situ é primeira escolha — preserva relações ecológicas integralmente.", en: "Because it maintains functional ecosystems, in situ is first choice — preserves ecological relations holistically."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Conservação ex situ:", en: "Ex situ conservation:"}
        choices:
          - {pt: "Fora do habitat — zoológicos, jardins botânicos, bancos de germoplasma", en: "Outside habitat — zoos, botanical gardens, germplasm banks"}
          - {pt: "Apenas em parques", en: "Only in parks"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Fora do habitat — zoológicos, jardins botânicos, bancos de germoplasma", en: "Outside habitat — zoos, botanical gardens, germplasm banks"}
        rationale: {pt: "Como complementa in situ para espécies criticamente ameaçadas, então cativeiro pode ser última esperança (cóndor da Califórnia).", en: "Because it complements in situ for critically endangered species, captivity can be last hope (California condor)."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Corredores ecológicos:", en: "Ecological corridors:"}
        choices:
          - {pt: "Conectam fragmentos de habitat — permitem migração e fluxo gênico", en: "Connect habitat fragments — allow migration and gene flow"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Conectam fragmentos de habitat — permitem migração e fluxo gênico", en: "Connect habitat fragments — allow migration and gene flow"}
        rationale: {pt: "Como fragmentação isola populações pequenas, então corredores reduzem extinção por endogamia e estocasticidade.", en: "Because fragmentation isolates small populations, corridors reduce extinction from inbreeding and stochasticity."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Reintrodução de espécies:", en: "Species reintroduction:"}
        choices:
          - {pt: "Trazer de volta espécies extintas localmente (lobos em Yellowstone, mico-leão-dourado)", en: "Bringing back locally extinct species (Yellowstone wolves, golden lion tamarin)"}
          - {pt: "Sempre falha", en: "Always fails"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Trazer de volta espécies extintas localmente (lobos em Yellowstone, mico-leão-dourado)", en: "Bringing back locally extinct species (Yellowstone wolves, golden lion tamarin)"}
        rationale: {pt: "Como restaura cascatas tróficas, então reintroduções podem restaurar funcionalidade ecossistêmica completa.", en: "Because it restores trophic cascades, reintroductions can restore full ecosystem functionality."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Banco de sementes (Svalbard):", en: "Seed bank (Svalbard):"}
        choices:
          - {pt: "Repositório global de variedades agrícolas — segurança alimentar contra catástrofes", en: "Global repository of crop varieties — food security against catastrophe"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Repositório global de variedades agrícolas — segurança alimentar contra catástrofes", en: "Global repository of crop varieties — food security against catastrophe"}
        rationale: {pt: "Como mantém diversidade genética agrícola, então protege contra perdas em guerras, mudanças climáticas, pragas.", en: "Because it maintains agricultural genetic diversity, it protects against losses in wars, climate change, pests."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Conservação genética:", en: "Genetic conservation:"}
        choices:
          - {pt: "Preservar diversidade genética dentro de espécies (não só número de indivíduos)", en: "Preserve genetic diversity within species (not just individual count)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Preservar diversidade genética dentro de espécies (não só número de indivíduos)", en: "Preserve genetic diversity within species (not just individual count)"}
        rationale: {pt: "Como diversidade reduz vulnerabilidade a doenças/mudanças, então populações pequenas sofrem com endogamia (bottleneck).", en: "Because diversity reduces vulnerability to disease/change, small populations suffer from inbreeding (bottleneck)."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Serviços ecossistêmicos:", en: "Ecosystem services:"}
        choices:
          - {pt: "Benefícios da natureza ao humano: polinização, água limpa, regulação climática", en: "Nature's benefits to humans: pollination, clean water, climate regulation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem valor", en: "No value"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Benefícios da natureza ao humano: polinização, água limpa, regulação climática", en: "Nature's benefits to humans: pollination, clean water, climate regulation"}
        rationale: {pt: "Como economia depende de natureza, então conservação tem retorno econômico mensurável (~$125 trilhões/ano globalmente).", en: "Because economy depends on nature, conservation has measurable economic return (~$125 trillion/year globally)."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Espécies-bandeira (flagship):", en: "Flagship species:"}
        choices:
          - {pt: "Carismáticas (panda, tigre) usadas para mobilizar conservação de outras", en: "Charismatic (panda, tiger) used to mobilize conservation of others"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Carismáticas (panda, tigre) usadas para mobilizar conservação de outras", en: "Charismatic (panda, tiger) used to mobilize conservation of others"}
        rationale: {pt: "Como mobilizam público e fundos, então protegem habitats inteiros — beneficiando milhares de outras espécies.", en: "Because they mobilize public and funding, they protect whole habitats — benefiting thousands of other species."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Conservação baseada em comunidades:", en: "Community-based conservation:"}
        choices:
          - {pt: "Envolve populações locais — sustentabilidade depende de incentivos para residentes", en: "Involves local people — sustainability depends on resident incentives"}
          - {pt: "Apenas top-down", en: "Just top-down"}
          - {pt: "Sem participação", en: "No participation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Envolve populações locais — sustentabilidade depende de incentivos para residentes", en: "Involves local people — sustainability depends on resident incentives"}
        rationale: {pt: "Como conservação imposta tende a falhar, então envolver comunidades alinha interesses econômicos e ecológicos.", en: "Because imposed conservation tends to fail, involving communities aligns economic and ecological interests."}
        objectives: [biology.conservation]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: conservação:", en: "Summary: conservation:"}
        choices:
          - {pt: "Combina ciência (ecologia, genética) + ação (legal, comunitária) para proteger biodiversidade", en: "Combines science (ecology, genetics) + action (legal, community) to protect biodiversity"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Combina ciência (ecologia, genética) + ação (legal, comunitária) para proteger biodiversidade", en: "Combines science (ecology, genetics) + action (legal, community) to protect biodiversity"}
        rationale: {pt: "Como crise é multidimensional, então solução exige ciência, política, economia e participação social integradas.", en: "Because the crisis is multidimensional, solutions require integrated science, policy, economics, and social participation."}
        objectives: [biology.conservation]
        difficulty: 4
target: 20
