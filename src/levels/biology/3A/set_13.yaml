title:
  pt: "💊 Descoberta de fármacos"
  en: "💊 Drug discovery"
level: '3A'
subject: biology
objectives: [biology.pharmacology]
difficulty: 4
authorNotes: "Pipeline: alvo → hit → lead → otimização → clínica → mercado."
example:
  pt: "Ex.: identificar alvo molecular → screening de bibliotecas → otimizar lead → testar em animais → fases I-III → aprovação."
  en: "Ex.: identify molecular target → library screening → optimize lead → animal testing → phases I-III → approval."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Pipeline farmacêutico", en: "Pharmaceutical pipeline"}
    description: {pt: "Da bancada à farmácia.", en: "From bench to pharmacy."}
    exercises:
      - type: choice
        question: {pt: "Tempo médio para desenvolver um fármaco:", en: "Average time to develop a drug:"}
        choices:
          - {pt: "10-15 anos do alvo à aprovação", en: "10-15 years from target to approval"}
          - {pt: "1 mês", en: "1 month"}
          - {pt: "100 anos", en: "100 years"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "10-15 anos do alvo à aprovação", en: "10-15 years from target to approval"}
        rationale: {pt: "Como exige múltiplas fases de teste, então é processo longo, caro (~$1-3 bi) e arriscado — ~10% de hits aprovados.", en: "Because it requires multiple test phases, it's a long, expensive (~$1-3 B), risky process — ~10% of hits approved."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Identificação de alvo:", en: "Target identification:"}
        choices:
          - {pt: "Encontrar molécula (proteína, gene) crítica para a doença", en: "Find molecule (protein, gene) critical to disease"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Encontrar molécula (proteína, gene) crítica para a doença", en: "Find molecule (protein, gene) critical to disease"}
        rationale: {pt: "Como sem alvo válido o fármaco não tem mecanismo, então identificação é primeiro passo crítico.", en: "Because without a valid target the drug has no mechanism, identification is the first critical step."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Screening de alta vazão (HTS):", en: "High-throughput screening (HTS):"}
        choices:
          - {pt: "Teste robotizado de milhares/milhões de compostos contra um alvo", en: "Robotic testing of thousands/millions of compounds against a target"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Teste robotizado de milhares/milhões de compostos contra um alvo", en: "Robotic testing of thousands/millions of compounds against a target"}
        rationale: {pt: "Como gera \"hits\" iniciais para otimização, então automação acelera dramaticamente descoberta inicial.", en: "Because it generates initial \"hits\" for optimization, automation dramatically speeds early discovery."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Lead compound:", en: "Lead compound:"}
        choices:
          - {pt: "Molécula promissora identificada — sofrerá otimização química e biológica", en: "Promising molecule identified — will undergo chemical and biological optimization"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Molécula promissora identificada — sofrerá otimização química e biológica", en: "Promising molecule identified — will undergo chemical and biological optimization"}
        rationale: {pt: "Como hit inicial geralmente tem afinidade fraca/seletividade pobre, então química medicinal otimiza propriedades.", en: "Because initial hit often has weak affinity/poor selectivity, medicinal chemistry optimizes properties."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Drug design baseado em estrutura:", en: "Structure-based drug design:"}
        choices:
          - {pt: "Usa estrutura 3D do alvo (cristalografia, AlphaFold) para projetar moléculas", en: "Uses 3D target structure (crystallography, AlphaFold) to design molecules"}
          - {pt: "Sempre por tentativa", en: "Always by trial"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "Usa estrutura 3D do alvo (cristalografia, AlphaFold) para projetar moléculas", en: "Uses 3D target structure (crystallography, AlphaFold) to design molecules"}
        rationale: {pt: "Como estrutura → função, então conhecer geometria do sítio ativo permite design racional de inibidores.", en: "Because structure → function, knowing active site geometry enables rational inhibitor design."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Farmacocinética (ADME):", en: "Pharmacokinetics (ADME):"}
        choices:
          - {pt: "Absorção, Distribuição, Metabolismo, Excreção — o que o corpo faz com o fármaco", en: "Absorption, Distribution, Metabolism, Excretion — what the body does to the drug"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Absorção, Distribuição, Metabolismo, Excreção — o que o corpo faz com o fármaco", en: "Absorption, Distribution, Metabolism, Excretion — what the body does to the drug"}
        rationale: {pt: "Como determina dose e duração, então fármaco eficaz exige biodisponibilidade adequada — má farmacocinética mata projetos.", en: "Because it determines dose and duration, an effective drug needs adequate bioavailability — poor PK kills projects."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Farmacodinâmica:", en: "Pharmacodynamics:"}
        choices:
          - {pt: "O que o fármaco faz com o corpo — efeito biológico", en: "What the drug does to the body — biological effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Iguala farmacocinética", en: "Same as pharmacokinetics"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "O que o fármaco faz com o corpo — efeito biológico", en: "What the drug does to the body — biological effect"}
        rationale: {pt: "Como inclui afinidade, eficácia e seletividade, então define potência e segurança do fármaco.", en: "Because it includes affinity, efficacy, and selectivity, it defines drug potency and safety."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Estudos pré-clínicos:", en: "Preclinical studies:"}
        choices:
          - {pt: "Testes em células e animais antes de testes em humanos — toxicidade, farmacocinética", en: "Cell and animal tests before human trials — toxicity, pharmacokinetics"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Testes em células e animais antes de testes em humanos — toxicidade, farmacocinética", en: "Cell and animal tests before human trials — toxicity, pharmacokinetics"}
        rationale: {pt: "Como humanos são vulneráveis a tóxicos, então pré-clínica filtra moléculas perigosas antes de avançar.", en: "Because humans are vulnerable to toxins, preclinical phase filters dangerous molecules before advancing."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Ensaios clínicos têm fases:", en: "Clinical trials have phases:"}
        choices:
          - {pt: "Fase I (segurança), II (eficácia), III (comparação grande), IV (pós-comercialização)", en: "Phase I (safety), II (efficacy), III (large comparison), IV (post-marketing)"}
          - {pt: "Apenas uma", en: "Just one"}
          - {pt: "Sem fases", en: "No phases"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Fase I (segurança), II (eficácia), III (comparação grande), IV (pós-comercialização)", en: "Phase I (safety), II (efficacy), III (large comparison), IV (post-marketing)"}
        rationale: {pt: "Como cada fase responde questão crucial, então passar todas é necessário para aprovação regulatória.", en: "Because each phase answers a crucial question, passing all is necessary for regulatory approval."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Fase I (humanos):", en: "Phase I (humans):"}
        choices:
          - {pt: "Pequeno grupo (~20-100) — avalia segurança, dose, tolerabilidade", en: "Small group (~20-100) — evaluates safety, dose, tolerability"}
          - {pt: "Apenas eficácia", en: "Just efficacy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "Pequeno grupo (~20-100) — avalia segurança, dose, tolerabilidade", en: "Small group (~20-100) — evaluates safety, dose, tolerability"}
        rationale: {pt: "Como geralmente em voluntários saudáveis, então é primeiro contato humano — risco máximo.", en: "Because usually in healthy volunteers, it's the first human contact — maximum risk."}
        objectives: [biology.pharmacology]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Aprovação e além", en: "Approval and beyond"}
    description: {pt: "Mercado, segurança, alternativas.", en: "Market, safety, alternatives."}
    exercises:
      - type: choice
        question: {pt: "Fase III:", en: "Phase III:"}
        choices:
          - {pt: "Centenas a milhares de pacientes — comparado a tratamento padrão ou placebo", en: "Hundreds to thousands of patients — compared to standard treatment or placebo"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Centenas a milhares de pacientes — comparado a tratamento padrão ou placebo", en: "Hundreds to thousands of patients — compared to standard treatment or placebo"}
        rationale: {pt: "Como gera evidência decisiva de eficácia, então é etapa mais cara — mas necessária para aprovação ampla.", en: "Because it generates decisive efficacy evidence, it's the most expensive step — but necessary for broad approval."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Agências reguladoras (FDA, EMA, ANVISA):", en: "Regulatory agencies (FDA, EMA, ANVISA):"}
        choices:
          - {pt: "Avaliam dados e decidem aprovação — protegem segurança pública", en: "Evaluate data and decide approval — protect public safety"}
          - {pt: "Apenas burocracia", en: "Just bureaucracy"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Avaliam dados e decidem aprovação — protegem segurança pública", en: "Evaluate data and decide approval — protect public safety"}
        rationale: {pt: "Como talidomida (1960s) ensinou lições, então rigor regulatório protege contra fármacos perigosos.", en: "Because thalidomide (1960s) taught lessons, regulatory rigor protects against dangerous drugs."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Genéricos:", en: "Generics:"}
        choices:
          - {pt: "Cópia legal após expiração de patente — bioequivalente, mais baratos", en: "Legal copy after patent expiration — bioequivalent, cheaper"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Sempre piores", en: "Always worse"}
        correctAnswer: {pt: "Cópia legal após expiração de patente — bioequivalente, mais baratos", en: "Legal copy after patent expiration — bioequivalent, cheaper"}
        rationale: {pt: "Como amplia acesso a tratamentos, então genéricos são pilar de saúde pública — qualidade controlada.", en: "Because they broaden access to treatments, generics are a public health pillar — quality-controlled."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Reposicionamento de fármacos:", en: "Drug repurposing:"}
        choices:
          - {pt: "Achar nova indicação para fármaco existente (ex.: aspirina cardiovascular, viagra)", en: "Find new indication for existing drug (e.g., aspirin cardiovascular, viagra)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Achar nova indicação para fármaco existente (ex.: aspirina cardiovascular, viagra)", en: "Find new indication for existing drug (e.g., aspirin cardiovascular, viagra)"}
        rationale: {pt: "Como segurança já é conhecida, então reposicionamento é mais rápido e barato — usado em pandemias.", en: "Because safety is already known, repurposing is faster and cheaper — used in pandemics."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Efeitos colaterais:", en: "Side effects:"}
        choices:
          - {pt: "Efeitos não-desejados — quase todo fármaco tem; benefício deve superar risco", en: "Unwanted effects — almost all drugs have them; benefit must outweigh risk"}
          - {pt: "Sem efeitos", en: "No effects"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre graves", en: "Always severe"}
        correctAnswer: {pt: "Efeitos não-desejados — quase todo fármaco tem; benefício deve superar risco", en: "Unwanted effects — almost all drugs have them; benefit must outweigh risk"}
        rationale: {pt: "Como nenhum fármaco é perfeitamente seletivo, então monitoramento pós-aprovação detecta efeitos raros.", en: "Because no drug is perfectly selective, post-approval monitoring detects rare effects."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Janela terapêutica:", en: "Therapeutic window:"}
        choices:
          - {pt: "Faixa de dose entre eficácia e toxicidade — ampla é segura, estreita é arriscada", en: "Dose range between efficacy and toxicity — wide is safe, narrow is risky"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Faixa de dose entre eficácia e toxicidade — ampla é segura, estreita é arriscada", en: "Dose range between efficacy and toxicity — wide is safe, narrow is risky"}
        rationale: {pt: "Como warfarina tem janela estreita, então monitoramento de coagulação é necessário — outros fármacos são mais permissivos.", en: "Because warfarin has narrow window, coagulation monitoring is needed — other drugs are more permissive."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Resistência a fármacos:", en: "Drug resistance:"}
        choices:
          - {pt: "Patógenos/células evoluem para escapar do efeito — antibióticos, antitumorais, antivirais", en: "Pathogens/cells evolve to escape the effect — antibiotics, antitumor, antivirals"}
          - {pt: "Sempre estável", en: "Always stable"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Patógenos/células evoluem para escapar do efeito — antibióticos, antitumorais, antivirais", en: "Pathogens/cells evolve to escape the effect — antibiotics, antitumor, antivirals"}
        rationale: {pt: "Como pressão seletiva favorece resistentes, então uso responsável é essencial — \"Era pós-antibiótica\" é ameaça real.", en: "Because selection pressure favors resistant ones, responsible use is essential — \"post-antibiotic era\" is a real threat."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Medicina de precisão em farmacologia:", en: "Precision medicine in pharmacology:"}
        choices:
          - {pt: "Selecionar tratamento conforme genética/perfil do paciente — ex.: trastuzumabe HER2+", en: "Choose treatment based on patient genetics/profile — e.g., trastuzumab HER2+"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre mesma dose", en: "Always same dose"}
          - {pt: "Sem aplicação", en: "No application"}
        correctAnswer: {pt: "Selecionar tratamento conforme genética/perfil do paciente — ex.: trastuzumabe HER2+", en: "Choose treatment based on patient genetics/profile — e.g., trastuzumab HER2+"}
        rationale: {pt: "Como cânceres diferem geneticamente, então biomarcadores guiam terapia-alvo específica e eficácia maior.", en: "Because cancers differ genetically, biomarkers guide specific targeted therapy and greater efficacy."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Inteligência artificial em descoberta:", en: "AI in discovery:"}
        choices:
          - {pt: "Identifica alvos, prevê estruturas, otimiza moléculas — acelera pipeline", en: "Identifies targets, predicts structures, optimizes molecules — speeds pipeline"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Identifica alvos, prevê estruturas, otimiza moléculas — acelera pipeline", en: "Identifies targets, predicts structures, optimizes molecules — speeds pipeline"}
        rationale: {pt: "Como IA + AlphaFold + grandes bancos de dados convergem, então fármacos podem ser desenhados em meses, não anos.", en: "Because AI + AlphaFold + big databases converge, drugs can be designed in months, not years."}
        objectives: [biology.pharmacology]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: descoberta de fármacos:", en: "Summary: drug discovery:"}
        choices:
          - {pt: "Pipeline longo combinando biologia, química, medicina, regulação e estatística", en: "Long pipeline combining biology, chemistry, medicine, regulation, and statistics"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Pipeline longo combinando biologia, química, medicina, regulação e estatística", en: "Long pipeline combining biology, chemistry, medicine, regulation, and statistics"}
        rationale: {pt: "Como cada etapa é vital para fármacos seguros e eficazes, então é uma das atividades científicas mais complexas.", en: "Because each step is vital for safe and effective drugs, it's one of the most complex scientific activities."}
        objectives: [biology.pharmacology]
        difficulty: 4
target: 20
