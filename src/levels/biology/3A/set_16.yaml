title:
  pt: "📢 Comunicação científica"
  en: "📢 Science communication"
level: '3A'
subject: biology
objectives: [biology.science_communication]
difficulty: 4
authorNotes: "Publicação, peer review, pré-prints, comunicação ao público, divulgação."
example:
  pt: "Ex.: pesquisa → manuscrito → peer review → publicação → cobertura midiática → impacto público."
  en: "Ex.: research → manuscript → peer review → publication → media coverage → public impact."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Publicação científica", en: "Scientific publishing"}
    description: {pt: "Como conhecimento científico se valida.", en: "How scientific knowledge is validated."}
    exercises:
      - type: choice
        question: {pt: "Artigo científico (paper) tem estrutura típica:", en: "Scientific paper has typical structure:"}
        choices:
          - {pt: "Introdução, Métodos, Resultados, Discussão (IMRAD)", en: "Introduction, Methods, Results, Discussion (IMRAD)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem estrutura", en: "No structure"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Introdução, Métodos, Resultados, Discussão (IMRAD)", en: "Introduction, Methods, Results, Discussion (IMRAD)"}
        rationale: {pt: "Como facilita revisão e replicação, então IMRAD é padrão global em publicações científicas.", en: "Because it facilitates review and replication, IMRAD is global standard in scientific publications."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Peer review (revisão por pares):", en: "Peer review:"}
        choices:
          - {pt: "Especialistas anônimos avaliam manuscrito antes da publicação", en: "Anonymous experts evaluate manuscript before publication"}
          - {pt: "Apenas amigos avaliam", en: "Just friends review"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Especialistas anônimos avaliam manuscrito antes da publicação", en: "Anonymous experts evaluate manuscript before publication"}
        rationale: {pt: "Como filtra erros e fraude, então peer review é pilar (imperfeito) da credibilidade científica.", en: "Because it filters errors and fraud, peer review is the (imperfect) pillar of scientific credibility."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Fator de impacto:", en: "Impact factor:"}
        choices:
          - {pt: "Métrica controversa de revistas — média de citações por artigo nos últimos 2 anos", en: "Controversial journal metric — average citations per article in last 2 years"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Medida perfeita de qualidade", en: "Perfect quality measure"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Métrica controversa de revistas — média de citações por artigo nos últimos 2 anos", en: "Controversial journal metric — average citations per article in last 2 years"}
        rationale: {pt: "Como pode incentivar comportamentos perversos, então DORA pede uso responsável — não substitui mérito do trabalho.", en: "Because it can incentivize perverse behavior, DORA calls for responsible use — doesn't replace work merit."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Pré-prints:", en: "Preprints:"}
        choices:
          - {pt: "Manuscritos publicados antes de peer review (bioRxiv, arXiv) — acelera comunicação", en: "Manuscripts posted before peer review (bioRxiv, arXiv) — speeds communication"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Manuscritos publicados antes de peer review (bioRxiv, arXiv) — acelera comunicação", en: "Manuscripts posted before peer review (bioRxiv, arXiv) — speeds communication"}
        rationale: {pt: "Como pandemia COVID acelerou adoção, então pré-prints permitem feedback rápido — mas exigem cautela ao interpretar.", en: "Because COVID pandemic accelerated adoption, preprints allow fast feedback — but require caution interpreting."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Acesso aberto (open access):", en: "Open access:"}
        choices:
          - {pt: "Publicação livre para leitura — democratiza acesso ao conhecimento", en: "Free-to-read publication — democratizes knowledge access"}
          - {pt: "Apenas pago", en: "Only paid"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Publicação livre para leitura — democratiza acesso ao conhecimento", en: "Free-to-read publication — democratizes knowledge access"}
        rationale: {pt: "Como pesquisa pública não deveria ficar atrás de paywall, então políticas (Plan S, NIH) exigem acesso aberto.", en: "Because public research shouldn't be paywalled, policies (Plan S, NIH) require open access."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "DOI (Digital Object Identifier):", en: "DOI (Digital Object Identifier):"}
        choices:
          - {pt: "Identificador único e permanente para artigos/datasets — citável universalmente", en: "Unique permanent identifier for articles/datasets — universally citable"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas para humanos", en: "Just for humans"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "Identificador único e permanente para artigos/datasets — citável universalmente", en: "Unique permanent identifier for articles/datasets — universally citable"}
        rationale: {pt: "Como links quebram, então DOI fornece referência estável — fundamento da literatura científica digital.", en: "Because links break, DOI provides stable reference — foundation of digital scientific literature."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "ORCID:", en: "ORCID:"}
        choices:
          - {pt: "Identificador único de pesquisador — distingue autores com nomes idênticos", en: "Unique researcher identifier — distinguishes authors with identical names"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas para empresas", en: "Just for companies"}
        correctAnswer: {pt: "Identificador único de pesquisador — distingue autores com nomes idênticos", en: "Unique researcher identifier — distinguishes authors with identical names"}
        rationale: {pt: "Como muitos cientistas têm nomes comuns, então ORCID permite atribuição precisa de autoria/contribuição.", en: "Because many scientists have common names, ORCID allows precise authorship/contribution attribution."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Citação científica:", en: "Scientific citation:"}
        choices:
          - {pt: "Reconhece trabalho prévio — base intelectual e proteção contra plágio", en: "Acknowledges prior work — intellectual basis and plagiarism protection"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas em livros", en: "Only in books"}
        correctAnswer: {pt: "Reconhece trabalho prévio — base intelectual e proteção contra plágio", en: "Acknowledges prior work — intellectual basis and plagiarism protection"}
        rationale: {pt: "Como ciência é cumulativa, então citações são moeda intelectual — falsificar é fraude grave.", en: "Because science is cumulative, citations are intellectual currency — falsifying is serious fraud."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Repositórios de dados:", en: "Data repositories:"}
        choices:
          - {pt: "Compartilhamento aberto de dados brutos (NCBI, Dryad, Zenodo) — aumenta reprodutibilidade", en: "Open sharing of raw data (NCBI, Dryad, Zenodo) — increases reproducibility"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pago", en: "Only paid"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "Compartilhamento aberto de dados brutos (NCBI, Dryad, Zenodo) — aumenta reprodutibilidade", en: "Open sharing of raw data (NCBI, Dryad, Zenodo) — increases reproducibility"}
        rationale: {pt: "Como permite reanálise por outros, então fortalece ciência aberta e detecta erros — princípios FAIR.", en: "Because it enables reanalysis by others, it strengthens open science and detects errors — FAIR principles."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Fraude científica clássica:", en: "Classic scientific fraud:"}
        choices:
          - {pt: "Manipulação de dados, plágio, autoria fantasma — punida com retratação e exclusão", en: "Data manipulation, plagiarism, ghost authorship — punished with retraction and exclusion"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem consequências", en: "No consequences"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Manipulação de dados, plágio, autoria fantasma — punida com retratação e exclusão", en: "Data manipulation, plagiarism, ghost authorship — punished with retraction and exclusion"}
        rationale: {pt: "Como casos como Hwang Woo-suk e STAP cells mostram, então integridade científica exige vigilância contínua.", en: "Because cases like Hwang Woo-suk and STAP cells show, scientific integrity requires constant vigilance."}
        objectives: [biology.science_communication]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Comunicação ao público", en: "Public communication"}
    description: {pt: "Levando ciência além do laboratório.", en: "Taking science beyond the lab."}
    exercises:
      - type: choice
        question: {pt: "Divulgação científica:", en: "Science outreach:"}
        choices:
          - {pt: "Comunicar ciência ao público leigo — papel social essencial dos cientistas", en: "Communicating science to lay audience — essential scientific social role"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas para colegas", en: "Just for peers"}
        correctAnswer: {pt: "Comunicar ciência ao público leigo — papel social essencial dos cientistas", en: "Communicating science to lay audience — essential scientific social role"}
        rationale: {pt: "Como sociedade financia ciência, então cientistas têm responsabilidade de explicá-la accessivelmente — Sagan, Marcelo Gleiser.", en: "Because society funds science, scientists have responsibility to explain accessibly — Sagan, Marcelo Gleiser."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Desinformação científica:", en: "Scientific misinformation:"}
        choices:
          - {pt: "Espalha-se rapidamente em redes sociais — combater requer comunicação clara e parcerias", en: "Spreads fast on social media — combating requires clear communication and partnerships"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Sempre detectada", en: "Always detected"}
        correctAnswer: {pt: "Espalha-se rapidamente em redes sociais — combater requer comunicação clara e parcerias", en: "Spreads fast on social media — combating requires clear communication and partnerships"}
        rationale: {pt: "Como antivacina/negacionismo climático custam vidas, então comunicação científica torna-se urgência de saúde pública.", en: "Because anti-vaccine/climate denial costs lives, science communication becomes a public health urgency."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Boas práticas de comunicação:", en: "Good communication practices:"}
        choices:
          - {pt: "Linguagem simples, analogias, contexto, transparência sobre incerteza", en: "Simple language, analogies, context, transparency about uncertainty"}
          - {pt: "Jargão técnico apenas", en: "Just technical jargon"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Linguagem simples, analogias, contexto, transparência sobre incerteza", en: "Simple language, analogies, context, transparency about uncertainty"}
        rationale: {pt: "Como audiência leiga não compartilha vocabulário, então comunicação eficaz traduz sem distorcer.", en: "Because lay audience doesn't share vocabulary, effective communication translates without distorting."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Ciência cidadã (citizen science):", en: "Citizen science:"}
        choices:
          - {pt: "Voluntários públicos contribuem com observações/dados (eBird, Foldit, GalaxyZoo)", en: "Public volunteers contribute observations/data (eBird, Foldit, GalaxyZoo)"}
          - {pt: "Apenas profissional", en: "Just professional"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "Voluntários públicos contribuem com observações/dados (eBird, Foldit, GalaxyZoo)", en: "Public volunteers contribute observations/data (eBird, Foldit, GalaxyZoo)"}
        rationale: {pt: "Como amplia escala de coleta, então ciência cidadã produz datasets impossíveis em laboratórios sozinhos.", en: "Because it expands collection scale, citizen science produces datasets impossible in labs alone."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Conferências científicas:", en: "Scientific conferences:"}
        choices:
          - {pt: "Reuniões para apresentar pesquisa, networking, debate — pôsteres + palestras", en: "Meetings to present research, network, debate — posters + talks"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas formalidade", en: "Just formality"}
        correctAnswer: {pt: "Reuniões para apresentar pesquisa, networking, debate — pôsteres + palestras", en: "Meetings to present research, network, debate — posters + talks"}
        rationale: {pt: "Como acelera disseminação informal, então conferências complementam publicação formal — colaborações nascem ali.", en: "Because they speed informal dissemination, conferences complement formal publication — collaborations are born there."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Mídias sociais e ciência:", en: "Social media and science:"}
        choices:
          - {pt: "Twitter/X, Mastodon, Bluesky usados para divulgação rápida e debate científico", en: "Twitter/X, Mastodon, Bluesky used for quick outreach and scientific debate"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Twitter/X, Mastodon, Bluesky usados para divulgação rápida e debate científico", en: "Twitter/X, Mastodon, Bluesky used for quick outreach and scientific debate"}
        rationale: {pt: "Como permite alcance massivo, então cientistas fazem outreach — mas também enfrentam ataques e desinformação.", en: "Because it allows massive reach, scientists do outreach — but also face attacks and misinformation."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Divulgação visual:", en: "Visual communication:"}
        choices:
          - {pt: "Infográficos, vídeos, animações tornam ciência acessível e memorável", en: "Infographics, videos, animations make science accessible and memorable"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Sempre opcional", en: "Always optional"}
        correctAnswer: {pt: "Infográficos, vídeos, animações tornam ciência acessível e memorável", en: "Infographics, videos, animations make science accessible and memorable"}
        rationale: {pt: "Como cérebro humano processa visualmente bem, então gráficos eficazes comunicam conceitos complexos rapidamente.", en: "Because human brain processes visually well, effective graphics communicate complex concepts fast."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Engajamento público (Public Engagement):", en: "Public engagement:"}
        choices:
          - {pt: "Diálogo bidirecional entre cientistas e público — informa políticas e prioridades", en: "Two-way dialogue between scientists and public — informs policy and priorities"}
          - {pt: "Apenas top-down", en: "Just top-down"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "Diálogo bidirecional entre cientistas e público — informa políticas e prioridades", en: "Two-way dialogue between scientists and public — informs policy and priorities"}
        rationale: {pt: "Como ciência afeta sociedade, então engajamento bidirecional fortalece democracia e relevância científica.", en: "Because science affects society, bidirectional engagement strengthens democracy and scientific relevance."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Cientistas como assessores políticos:", en: "Scientists as policy advisors:"}
        choices:
          - {pt: "Informam decisões públicas (CDC, OMS, IPCC) — separam ciência de política", en: "Inform public decisions (CDC, WHO, IPCC) — separate science from policy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem influência", en: "No influence"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Informam decisões públicas (CDC, OMS, IPCC) — separam ciência de política", en: "Inform public decisions (CDC, WHO, IPCC) — separate science from policy"}
        rationale: {pt: "Como conhecimento técnico é necessário em decisões complexas, então cientistas têm voz crítica — mas decisão é coletiva.", en: "Because technical knowledge is needed in complex decisions, scientists have critical voice — but decisions are collective."}
        objectives: [biology.science_communication]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: comunicação científica:", en: "Summary: science communication:"}
        choices:
          - {pt: "Pilar essencial — sem ela ciência não progride nem informa sociedade", en: "Essential pillar — without it science doesn't progress or inform society"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Pilar essencial — sem ela ciência não progride nem informa sociedade", en: "Essential pillar — without it science doesn't progress or inform society"}
        rationale: {pt: "Como descoberta não comunicada não tem impacto, então comunicação é parte integral do método científico.", en: "Because uncommunicated discovery has no impact, communication is integral to the scientific method."}
        objectives: [biology.science_communication]
        difficulty: 4
target: 20
