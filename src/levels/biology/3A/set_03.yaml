title:
  pt: "🦀 Biologia do câncer"
  en: "🦀 Cancer biology"
level: '3A'
subject: biology
objectives: [biology.cancer]
difficulty: 4
authorNotes: "Hallmarks do câncer, oncogenes, supressores, metástase, terapias."
example:
  pt: "Ex.: mutação somática + falha de p53 → divisão descontrolada → angiogênese → metástase → tumor maligno."
  en: "Ex.: somatic mutation + p53 failure → uncontrolled division → angiogenesis → metastasis → malignant tumor."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Características (hallmarks)", en: "Hallmarks"}
    description: {pt: "O que define um câncer.", en: "What defines a cancer."}
    exercises:
      - type: choice
        question: {pt: "Câncer é caracterizado por:", en: "Cancer is characterized by:"}
        choices:
          - {pt: "Crescimento celular descontrolado e invasivo", en: "Uncontrolled and invasive cell growth"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas tamanho", en: "Just size"}
          - {pt: "Sem características", en: "No characteristics"}
        correctAnswer: {pt: "Crescimento celular descontrolado e invasivo", en: "Uncontrolled and invasive cell growth"}
        rationale: {pt: "Como ignora sinais regulatórios, então prolifera e invade tecidos vizinhos — pode metastatizar.", en: "Because it ignores regulatory signals, it proliferates and invades neighboring tissues — can metastasize."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Tumor benigno vs maligno:", en: "Benign vs malignant tumor:"}
        choices:
          - {pt: "Benigno: não invasivo, não metastatiza; maligno: invasivo, metastatiza", en: "Benign: non-invasive, doesn't metastasize; malignant: invasive, metastasizes"}
          - {pt: "Idênticos", en: "Identical"}
          - {pt: "Sem diferença", en: "No difference"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Benigno: não invasivo, não metastatiza; maligno: invasivo, metastatiza", en: "Benign: non-invasive, doesn't metastasize; malignant: invasive, metastasizes"}
        rationale: {pt: "Como benignos podem ser graves por compressão, então não são inofensivos — mas câncer = maligno.", en: "Because benign can be serious via compression, they're not harmless — but cancer = malignant."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Oncogenes:", en: "Oncogenes:"}
        choices:
          - {pt: "Proto-oncogenes mutados ganham função → promovem divisão (Ras, Myc, HER2)", en: "Mutated proto-oncogenes gain function → promote division (Ras, Myc, HER2)"}
          - {pt: "Sempre param o ciclo", en: "Always stop cycle"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Proto-oncogenes mutados ganham função → promovem divisão (Ras, Myc, HER2)", en: "Mutated proto-oncogenes gain function → promote division (Ras, Myc, HER2)"}
        rationale: {pt: "Como uma cópia mutada já basta (dominante), então mutações ativadoras dirigem proliferação descontrolada.", en: "Because one mutated copy suffices (dominant), activating mutations drive uncontrolled proliferation."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Genes supressores de tumor:", en: "Tumor suppressor genes:"}
        choices:
          - {pt: "Param ciclo ou induzem apoptose; perda de ambas cópias permite câncer (p53, RB, BRCA)", en: "Stop cycle or induce apoptosis; loss of both copies enables cancer (p53, RB, BRCA)"}
          - {pt: "Aceleram divisão", en: "Accelerate division"}
          - {pt: "Não existem", en: "Don't exist"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Param ciclo ou induzem apoptose; perda de ambas cópias permite câncer (p53, RB, BRCA)", en: "Stop cycle or induce apoptosis; loss of both copies enables cancer (p53, RB, BRCA)"}
        rationale: {pt: "Como ambas cópias precisam falhar (recessivo), então mutações em ambos alelos liberam o ciclo — \"two-hit hypothesis\".", en: "Because both copies must fail (recessive), mutations in both alleles release the cycle — \"two-hit hypothesis\"."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "p53 é \"guardião do genoma\" porque:", en: "p53 is \"genome guardian\" because:"}
        choices:
          - {pt: "Ativa parada de ciclo ou apoptose se há dano de DNA", en: "Activates cycle arrest or apoptosis on DNA damage"}
          - {pt: "Sempre acelera divisão", en: "Always speeds division"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Ativa parada de ciclo ou apoptose se há dano de DNA", en: "Activates cycle arrest or apoptosis on DNA damage"}
        rationale: {pt: "Como mutações em p53 estão em ~50% dos cânceres humanos, então sua falha é causa frequente.", en: "Because p53 mutations are in ~50% of human cancers, its failure is a frequent cause."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Hallmarks do câncer (Hanahan & Weinberg):", en: "Cancer hallmarks (Hanahan & Weinberg):"}
        choices:
          - {pt: "Sinais autossuficientes, evasão de apoptose, replicação ilimitada, angiogênese, invasão, etc.", en: "Self-sufficient signals, apoptosis evasion, limitless replication, angiogenesis, invasion, etc."}
          - {pt: "Apenas tamanho", en: "Just size"}
          - {pt: "Apenas cor", en: "Just color"}
          - {pt: "Sem padrões", en: "No patterns"}
        correctAnswer: {pt: "Sinais autossuficientes, evasão de apoptose, replicação ilimitada, angiogênese, invasão, etc.", en: "Self-sufficient signals, apoptosis evasion, limitless replication, angiogenesis, invasion, etc."}
        rationale: {pt: "Como múltiplos traços coexistem, então tratar um só é insuficiente — terapia combinada é necessária.", en: "Because multiple traits coexist, treating just one is insufficient — combination therapy needed."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Angiogênese tumoral:", en: "Tumor angiogenesis:"}
        choices:
          - {pt: "Tumor estimula formação de novos vasos para suprir crescimento", en: "Tumor stimulates new vessel formation to support growth"}
          - {pt: "Sem vasos", en: "No vessels"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Tumor estimula formação de novos vasos para suprir crescimento", en: "Tumor stimulates new vessel formation to support growth"}
        rationale: {pt: "Como sem novos vasos o tumor para de crescer ~1mm, então fármacos anti-angiogênicos (bevacizumabe) são efetivos.", en: "Because without new vessels tumor stops growing at ~1mm, anti-angiogenic drugs (bevacizumab) are effective."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Telomerase em câncer:", en: "Telomerase in cancer:"}
        choices:
          - {pt: "Reativada permite divisão indefinida (imortalidade celular)", en: "Reactivated enables indefinite division (cell immortality)"}
          - {pt: "Sempre desativada", en: "Always off"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Reativada permite divisão indefinida (imortalidade celular)", en: "Reactivated enables indefinite division (cell immortality)"}
        rationale: {pt: "Como telômeros normalmente encurtam, então sua manutenção em câncer permite divisões ilimitadas.", en: "Because telomeres normally shorten, their maintenance in cancer enables limitless divisions."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Metástase:", en: "Metastasis:"}
        choices:
          - {pt: "Disseminação de células tumorais a órgãos distantes via sangue/linfa", en: "Tumor cell spread to distant organs via blood/lymph"}
          - {pt: "Apenas localizado", en: "Just localized"}
          - {pt: "Sem disseminação", en: "No spread"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Disseminação de células tumorais a órgãos distantes via sangue/linfa", en: "Tumor cell spread to distant organs via blood/lymph"}
        rationale: {pt: "Como ~90% das mortes por câncer são por metástase, então combatê-la é prioridade clínica.", en: "Because ~90% of cancer deaths are from metastasis, fighting it is clinical priority."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Cânceres hereditários (~5-10%):", en: "Hereditary cancers (~5-10%):"}
        choices:
          - {pt: "Mutações germinativas em genes-chave (BRCA, Lynch, Li-Fraumeni)", en: "Germline mutations in key genes (BRCA, Lynch, Li-Fraumeni)"}
          - {pt: "Apenas adquiridos", en: "Only acquired"}
          - {pt: "Sem componente genético", en: "No genetic component"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Mutações germinativas em genes-chave (BRCA, Lynch, Li-Fraumeni)", en: "Germline mutations in key genes (BRCA, Lynch, Li-Fraumeni)"}
        rationale: {pt: "Como predispõem desde o nascimento, então rastreio genético familiar permite prevenção precoce.", en: "Because they predispose from birth, family genetic screening enables early prevention."}
        objectives: [biology.cancer]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Tratamentos e prevenção", en: "Treatments and prevention"}
    description: {pt: "Como combatemos câncer.", en: "How we fight cancer."}
    exercises:
      - type: choice
        question: {pt: "Quimioterapia tradicional alveja:", en: "Traditional chemotherapy targets:"}
        choices:
          - {pt: "Células de divisão rápida (atinge tumor mas também medula, intestino, cabelo)", en: "Rapidly dividing cells (hits tumor but also marrow, gut, hair)"}
          - {pt: "Apenas tumor", en: "Just tumor"}
          - {pt: "Sem alvo", en: "No target"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Células de divisão rápida (atinge tumor mas também medula, intestino, cabelo)", en: "Rapidly dividing cells (hits tumor but also marrow, gut, hair)"}
        rationale: {pt: "Como falta especificidade, então efeitos colaterais são amplos — daí náusea, queda de cabelo, neutropenia.", en: "Because specificity is lacking, side effects are broad — hence nausea, hair loss, neutropenia."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Radioterapia:", en: "Radiotherapy:"}
        choices:
          - {pt: "Radiação ionizante danifica DNA tumoral, induzindo apoptose", en: "Ionizing radiation damages tumor DNA, inducing apoptosis"}
          - {pt: "Apenas calor", en: "Just heat"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Radiação ionizante danifica DNA tumoral, induzindo apoptose", en: "Ionizing radiation damages tumor DNA, inducing apoptosis"}
        rationale: {pt: "Como pode ser focalizada, então protege tecido sadio relativamente — combinada com cirurgia/química frequentemente.", en: "Because it can be focused, it relatively spares healthy tissue — often combined with surgery/chemo."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Terapia-alvo molecular:", en: "Targeted molecular therapy:"}
        choices:
          - {pt: "Fármacos contra alterações específicas do tumor (ex.: imatinibe contra BCR-ABL na LMC)", en: "Drugs against specific tumor alterations (e.g., imatinib for BCR-ABL in CML)"}
          - {pt: "Apenas placebo", en: "Just placebo"}
          - {pt: "Sem alvo", en: "No target"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Fármacos contra alterações específicas do tumor (ex.: imatinibe contra BCR-ABL na LMC)", en: "Drugs against specific tumor alterations (e.g., imatinib for BCR-ABL in CML)"}
        rationale: {pt: "Como ataca proteína mutante específica, então toxicidade reduz e eficácia aumenta — medicina de precisão.", en: "Because it attacks specific mutant protein, toxicity drops and efficacy rises — precision medicine."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Imunoterapia em câncer:", en: "Cancer immunotherapy:"}
        choices:
          - {pt: "Estimula sistema imune (checkpoint inhibitors, CAR-T, vacinas)", en: "Stimulates immune system (checkpoint inhibitors, CAR-T, vaccines)"}
          - {pt: "Apenas placebo", en: "Just placebo"}
          - {pt: "Sem mecanismo", en: "No mechanism"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Estimula sistema imune (checkpoint inhibitors, CAR-T, vacinas)", en: "Stimulates immune system (checkpoint inhibitors, CAR-T, vaccines)"}
        rationale: {pt: "Como aproveita imunidade adaptativa, então pode dar respostas duradouras — mesmo em metástase.", en: "Because it uses adaptive immunity, it can give lasting responses — even in metastasis."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Carcinógenos:", en: "Carcinogens:"}
        choices:
          - {pt: "Agentes que causam câncer (tabaco, UV, álcool, asbesto, alguns vírus)", en: "Cancer-causing agents (tobacco, UV, alcohol, asbestos, some viruses)"}
          - {pt: "Apenas substâncias", en: "Just substances"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem causa", en: "Causeless"}
        correctAnswer: {pt: "Agentes que causam câncer (tabaco, UV, álcool, asbesto, alguns vírus)", en: "Cancer-causing agents (tobacco, UV, alcohol, asbestos, some viruses)"}
        rationale: {pt: "Como mutagênicos induzem mutações cumulativas, então evitar exposição é a forma mais eficaz de prevenção.", en: "Because mutagens induce cumulative mutations, avoiding exposure is the most effective prevention."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "HPV (papilomavírus) causa:", en: "HPV (papillomavirus) causes:"}
        choices:
          - {pt: "Câncer de colo de útero (e outros) — vacina previne", en: "Cervical cancer (and others) — vaccine prevents"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Câncer de colo de útero (e outros) — vacina previne", en: "Cervical cancer (and others) — vaccine prevents"}
        rationale: {pt: "Como E6/E7 do HPV inativam p53/Rb, então é exemplo claro de vírus oncogênico — vacinação reduz incidência.", en: "Because HPV E6/E7 inactivate p53/Rb, it's a clear example of oncogenic virus — vaccination reduces incidence."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Tabagismo causa:", en: "Smoking causes:"}
        choices:
          - {pt: "Câncer de pulmão e múltiplos outros — > 7000 substâncias químicas, ~70 carcinógenas", en: "Lung cancer and many others — > 7000 chemicals, ~70 carcinogenic"}
          - {pt: "Apenas tosse", en: "Just cough"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Câncer de pulmão e múltiplos outros — > 7000 substâncias químicas, ~70 carcinógenas", en: "Lung cancer and many others — > 7000 chemicals, ~70 carcinogenic"}
        rationale: {pt: "Como é o maior carcinógeno preventível, então parar de fumar reduz risco dramaticamente em anos.", en: "Because it's the largest preventable carcinogen, quitting reduces risk dramatically over years."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Rastreamento (screening) eficaz:", en: "Effective screening:"}
        choices:
          - {pt: "Mamografia (mama), Papanicolau (colo), colonoscopia (cólon) — detecção precoce salva vidas", en: "Mammography (breast), Pap (cervix), colonoscopy (colon) — early detection saves lives"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem benefício", en: "No benefit"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Mamografia (mama), Papanicolau (colo), colonoscopia (cólon) — detecção precoce salva vidas", en: "Mammography (breast), Pap (cervix), colonoscopy (colon) — early detection saves lives"}
        rationale: {pt: "Como tumores menores têm melhor prognóstico, então rastreio populacional reduz mortalidade significativamente.", en: "Because smaller tumors have better prognosis, population screening significantly reduces mortality."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Estilo de vida e câncer:", en: "Lifestyle and cancer:"}
        choices:
          - {pt: "Não fumar, dieta equilibrada, exercício, peso saudável reduzem risco em ~30-50%", en: "Not smoking, balanced diet, exercise, healthy weight reduce risk by ~30-50%"}
          - {pt: "Apenas genética", en: "Just genetics"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Não fumar, dieta equilibrada, exercício, peso saudável reduzem risco em ~30-50%", en: "Not smoking, balanced diet, exercise, healthy weight reduce risk by ~30-50%"}
        rationale: {pt: "Como muitos cânceres têm componente ambiental, então prevenção primária é poderosa — mais que tratamento.", en: "Because many cancers have environmental component, primary prevention is powerful — more than treatment."}
        objectives: [biology.cancer]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: câncer:", en: "Summary: cancer:"}
        choices:
          - {pt: "Doença genética somática emergente — combatida com prevenção, detecção e múltiplas terapias", en: "Emergent somatic genetic disease — fought with prevention, detection, and multiple therapies"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Doença genética somática emergente — combatida com prevenção, detecção e múltiplas terapias", en: "Emergent somatic genetic disease — fought with prevention, detection, and multiple therapies"}
        rationale: {pt: "Como compreender bases moleculares revolucionou tratamento, então biologia integra-se à medicina de precisão.", en: "Because understanding molecular bases revolutionized treatment, biology integrates with precision medicine."}
        objectives: [biology.cancer]
        difficulty: 4
target: 20
