title:
  pt: "🧬 Genômica comparada"
  en: "🧬 Comparative genomics"
level: '3A'
subject: biology
objectives: [biology.comparative_genomics]
difficulty: 4
authorNotes: "Comparação de genomas, sintenia, evolução molecular, genes ortólogos/parálogos, conservação."
example:
  pt: "Ex.: humano vs chimpanzé → ~98,8% idêntico → genes conservados revelam função essencial."
  en: "Ex.: human vs chimp → ~98.8% identical → conserved genes reveal essential function."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Comparando genomas", en: "Comparing genomes"}
    description: {pt: "Como genomas revelam evolução e função.", en: "How genomes reveal evolution and function."}
    exercises:
      - type: choice
        question: {pt: "Genômica comparada estuda:", en: "Comparative genomics studies:"}
        choices:
          - {pt: "Similaridades e diferenças entre genomas de espécies", en: "Similarities and differences between genomes of species"}
          - {pt: "Apenas um genoma isolado", en: "Just one genome alone"}
          - {pt: "Apenas proteínas", en: "Just proteins"}
          - {pt: "Apenas RNA", en: "Just RNA"}
        correctAnswer: {pt: "Similaridades e diferenças entre genomas de espécies", en: "Similarities and differences between genomes of species"}
        rationale: {pt: "Quando comparamos genomas, então identificamos genes conservados (essenciais) e divergentes (adaptativos).", en: "When we compare genomes, we identify conserved (essential) and divergent (adaptive) genes."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Genes ortólogos são:", en: "Ortholog genes are:"}
        choices:
          - {pt: "Genes em espécies diferentes derivados de ancestral comum (mesma função)", en: "Genes in different species derived from common ancestor (same function)"}
          - {pt: "Genes idênticos", en: "Identical genes"}
          - {pt: "Genes inativos", en: "Inactive genes"}
          - {pt: "Genes virais", en: "Viral genes"}
        correctAnswer: {pt: "Genes em espécies diferentes derivados de ancestral comum (mesma função)", en: "Genes in different species derived from common ancestor (same function)"}
        rationale: {pt: "Como mantêm função pela seleção, então ortólogos servem para inferir função em espécies novas.", en: "Because they maintain function through selection, orthologs serve to infer function in new species."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Genes parálogos surgem por:", en: "Paralog genes arise by:"}
        choices:
          - {pt: "Duplicação gênica dentro do mesmo genoma", en: "Gene duplication within the same genome"}
          - {pt: "Mutação pontual apenas", en: "Point mutation only"}
          - {pt: "Recombinação apenas", en: "Recombination only"}
          - {pt: "Tradução apenas", en: "Translation only"}
        correctAnswer: {pt: "Duplicação gênica dentro do mesmo genoma", en: "Gene duplication within the same genome"}
        rationale: {pt: "Quando um gene duplica, então a cópia extra pode evoluir nova função (neofuncionalização).", en: "When a gene duplicates, the extra copy can evolve new function (neofunctionalization)."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Sintenia significa:", en: "Synteny means:"}
        choices:
          - {pt: "Conservação da ordem de genes em cromossomos entre espécies", en: "Conservation of gene order on chromosomes between species"}
          - {pt: "Aleatoriedade total", en: "Total randomness"}
          - {pt: "Apenas mutação", en: "Only mutation"}
          - {pt: "Apenas DNA mitocondrial", en: "Only mitochondrial DNA"}
        correctAnswer: {pt: "Conservação da ordem de genes em cromossomos entre espécies", en: "Conservation of gene order on chromosomes between species"}
        rationale: {pt: "Como blocos sintênicos persistem milhões de anos, então revelam parentesco evolutivo profundo.", en: "Because syntenic blocks persist millions of years, they reveal deep evolutionary kinship."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Humano e chimpanzé compartilham ~quanto do DNA?", en: "Human and chimp share ~how much DNA?"}
        choices:
          - {pt: "~98,8%", en: "~98.8%"}
          - {pt: "~50%", en: "~50%"}
          - {pt: "~10%", en: "~10%"}
          - {pt: "0%", en: "0%"}
        correctAnswer: {pt: "~98,8%", en: "~98.8%"}
        rationale: {pt: "Como divergimos há ~6 milhões de anos, então a similaridade alta reflete ancestralidade próxima.", en: "Because we diverged ~6 million years ago, the high similarity reflects close ancestry."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Sequências altamente conservadas entre espécies distantes indicam:", en: "Highly conserved sequences across distant species indicate:"}
        choices:
          - {pt: "Função essencial sob seleção purificadora", en: "Essential function under purifying selection"}
          - {pt: "Função inútil", en: "Useless function"}
          - {pt: "Apenas erro", en: "Just error"}
          - {pt: "Apenas ruído", en: "Just noise"}
        correctAnswer: {pt: "Função essencial sob seleção purificadora", en: "Essential function under purifying selection"}
        rationale: {pt: "Quando mutações são deletadas pela seleção, então a sequência permanece conservada por bilhões de anos.", en: "When mutations get deleted by selection, the sequence remains conserved for billions of years."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Relógio molecular usa:", en: "Molecular clock uses:"}
        choices:
          - {pt: "Taxa de mutação para estimar tempo de divergência", en: "Mutation rate to estimate divergence time"}
          - {pt: "Apenas fósseis", en: "Only fossils"}
          - {pt: "Apenas morfologia", en: "Only morphology"}
          - {pt: "Apenas geografia", en: "Only geography"}
        correctAnswer: {pt: "Taxa de mutação para estimar tempo de divergência", en: "Mutation rate to estimate divergence time"}
        rationale: {pt: "Como mutações neutras se acumulam constantemente, então diferenças genéticas medem tempo evolutivo.", en: "Because neutral mutations accumulate constantly, genetic differences measure evolutionary time."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Genomas bacterianos são tipicamente:", en: "Bacterial genomes are typically:"}
        choices:
          - {pt: "Compactos, circulares, ~1-10 Mb, poucos íntrons", en: "Compact, circular, ~1-10 Mb, few introns"}
          - {pt: "Sempre lineares humanos", en: "Always linear human-like"}
          - {pt: "Sempre 1 kb", en: "Always 1 kb"}
          - {pt: "Sem genes", en: "Without genes"}
        correctAnswer: {pt: "Compactos, circulares, ~1-10 Mb, poucos íntrons", en: "Compact, circular, ~1-10 Mb, few introns"}
        rationale: {pt: "Quando há pressão por replicação rápida, então genomas bacterianos são economicamente compactos.", en: "When there's pressure for fast replication, bacterial genomes are economically compact."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Genoma humano tem ~quantos genes codificadores?", en: "Human genome has ~how many coding genes?"}
        choices:
          - {pt: "~20.000", en: "~20,000"}
          - {pt: "~100", en: "~100"}
          - {pt: "~1 milhão", en: "~1 million"}
          - {pt: "Zero", en: "Zero"}
        correctAnswer: {pt: "~20.000", en: "~20,000"}
        rationale: {pt: "Como muito do DNA é regulatório/não codificador, então surpreendentemente poucos genes geram complexidade humana.", en: "Because much DNA is regulatory/non-coding, surprisingly few genes generate human complexity."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "DNA não codificador (ex-'lixo') hoje é visto como:", en: "Non-coding DNA (formerly 'junk') today is seen as:"}
        choices:
          - {pt: "Largamente regulatório, com elementos funcionais (ENCODE)", en: "Largely regulatory, with functional elements (ENCODE)"}
          - {pt: "Totalmente inútil", en: "Totally useless"}
          - {pt: "Apenas erro", en: "Just error"}
          - {pt: "Apenas viral", en: "Just viral"}
        correctAnswer: {pt: "Largamente regulatório, com elementos funcionais (ENCODE)", en: "Largely regulatory, with functional elements (ENCODE)"}
        rationale: {pt: "Quando ENCODE mapeou atividade bioquímica, então muito DNA 'lixo' revelou-se regulatório.", en: "When ENCODE mapped biochemical activity, much 'junk' DNA revealed itself as regulatory."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Aplicações da genômica comparada", en: "Comparative genomics applications"}
    description: {pt: "De medicina a evolução.", en: "From medicine to evolution."}
    exercises:
      - type: choice
        question: {pt: "Filogenômica usa:", en: "Phylogenomics uses:"}
        choices:
          - {pt: "Múltiplos genes/genomas para construir árvores evolutivas robustas", en: "Multiple genes/genomes to build robust evolutionary trees"}
          - {pt: "Apenas um gene", en: "Only one gene"}
          - {pt: "Apenas morfologia", en: "Only morphology"}
          - {pt: "Apenas fósseis", en: "Only fossils"}
        correctAnswer: {pt: "Múltiplos genes/genomas para construir árvores evolutivas robustas", en: "Multiple genes/genomes to build robust evolutionary trees"}
        rationale: {pt: "Como mais dados reduzem ruído, então filogenômica resolve ramos antes incertos.", en: "Because more data reduces noise, phylogenomics resolves previously uncertain branches."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Modelo organismo (camundongo, mosca) é útil porque:", en: "Model organism (mouse, fly) is useful because:"}
        choices:
          - {pt: "Compartilha muitos genes com humanos, permitindo inferência funcional", en: "Shares many genes with humans, allowing functional inference"}
          - {pt: "É idêntico ao humano", en: "Is identical to human"}
          - {pt: "Não tem genes", en: "Has no genes"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Compartilha muitos genes com humanos, permitindo inferência funcional", en: "Shares many genes with humans, allowing functional inference"}
        rationale: {pt: "Quando ortólogos têm função preservada, então estudar gene em camundongo informa biologia humana.", en: "When orthologs have preserved function, studying a gene in mouse informs human biology."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Pangenoma é:", en: "Pangenome is:"}
        choices:
          - {pt: "Conjunto de todos os genes encontrados em uma espécie (núcleo + acessório)", en: "Set of all genes found in a species (core + accessory)"}
          - {pt: "Apenas um indivíduo", en: "Just one individual"}
          - {pt: "Apenas genoma viral", en: "Just viral genome"}
          - {pt: "Apenas RNA", en: "Just RNA"}
        correctAnswer: {pt: "Conjunto de todos os genes encontrados em uma espécie (núcleo + acessório)", en: "Set of all genes found in a species (core + accessory)"}
        rationale: {pt: "Como indivíduos diferem em conteúdo gênico, então pangenoma captura diversidade real da espécie.", en: "Because individuals differ in gene content, pangenome captures real species diversity."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "DNA antigo (aDNA) permite:", en: "Ancient DNA (aDNA) allows:"}
        choices:
          - {pt: "Sequenciar genomas de fósseis (neandertais, mamutes)", en: "Sequence genomes from fossils (neanderthals, mammoths)"}
          - {pt: "Apenas observação visual", en: "Just visual observation"}
          - {pt: "Apenas RNA moderno", en: "Just modern RNA"}
          - {pt: "Apenas morfologia", en: "Just morphology"}
        correctAnswer: {pt: "Sequenciar genomas de fósseis (neandertais, mamutes)", en: "Sequence genomes from fossils (neanderthals, mammoths)"}
        rationale: {pt: "Quando preservação permite, então aDNA revela introgressão (ex.: 1-4% neandertal em humanos não-africanos).", en: "When preservation allows, aDNA reveals introgression (e.g., 1-4% neanderthal in non-African humans)."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "HGT (transferência horizontal de genes) é comum em:", en: "HGT (horizontal gene transfer) is common in:"}
        choices:
          - {pt: "Bactérias (plasmídeos, conjugação, transdução)", en: "Bacteria (plasmids, conjugation, transduction)"}
          - {pt: "Apenas mamíferos", en: "Only mammals"}
          - {pt: "Nenhum organismo", en: "No organism"}
          - {pt: "Apenas vírus extintos", en: "Only extinct viruses"}
        correctAnswer: {pt: "Bactérias (plasmídeos, conjugação, transdução)", en: "Bacteria (plasmids, conjugation, transduction)"}
        rationale: {pt: "Como HGT espalha resistência antibiótica, então é desafio clínico e fator evolutivo bacteriano.", en: "Because HGT spreads antibiotic resistance, it's a clinical challenge and bacterial evolutionary factor."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Famílias gênicas (ex.: globinas) surgem por:", en: "Gene families (e.g., globins) arise by:"}
        choices:
          - {pt: "Duplicação seguida de divergência funcional", en: "Duplication followed by functional divergence"}
          - {pt: "Apenas mutação pontual", en: "Only point mutation"}
          - {pt: "Apenas recombinação", en: "Only recombination"}
          - {pt: "Apenas tradução", en: "Only translation"}
        correctAnswer: {pt: "Duplicação seguida de divergência funcional", en: "Duplication followed by functional divergence"}
        rationale: {pt: "Quando uma cópia diverge, então surgem isoformas (alfa, beta, fetal) com papéis especializados.", en: "When one copy diverges, isoforms emerge (alpha, beta, fetal) with specialized roles."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Genoma mitocondrial (mtDNA):", en: "Mitochondrial genome (mtDNA):"}
        choices:
          - {pt: "Pequeno, herança materna, marcador filogeográfico clássico", en: "Small, maternal inheritance, classic phylogeographic marker"}
          - {pt: "Idêntico ao nuclear", en: "Identical to nuclear"}
          - {pt: "Sem genes", en: "Without genes"}
          - {pt: "Herdado paternalmente", en: "Paternally inherited"}
        correctAnswer: {pt: "Pequeno, herança materna, marcador filogeográfico clássico", en: "Small, maternal inheritance, classic phylogeographic marker"}
        rationale: {pt: "Como muta rápido e não recombina, então mtDNA traça linhagens maternas claramente.", en: "Because it mutates fast and doesn't recombine, mtDNA traces maternal lineages clearly."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Endogenização viral significa:", en: "Viral endogenization means:"}
        choices:
          - {pt: "Retrovírus integrado no genoma germinativo, herdado por gerações", en: "Retrovirus integrated into germline genome, inherited across generations"}
          - {pt: "Vírus apenas atacando", en: "Virus just attacking"}
          - {pt: "Sem integração", en: "Without integration"}
          - {pt: "Apenas RNA temporário", en: "Just temporary RNA"}
        correctAnswer: {pt: "Retrovírus integrado no genoma germinativo, herdado por gerações", en: "Retrovirus integrated into germline genome, inherited across generations"}
        rationale: {pt: "Quando retrovírus integra na linhagem germinativa, então ~8% do genoma humano é viral antigo.", en: "When retrovirus integrates in germline, ~8% of human genome is ancient viral."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Seleção positiva (adaptativa) deixa assinatura de:", en: "Positive (adaptive) selection leaves signature of:"}
        choices:
          - {pt: "Mais substituições não-sinônimas que sinônimas (dN/dS > 1)", en: "More non-synonymous than synonymous substitutions (dN/dS > 1)"}
          - {pt: "Apenas neutralidade", en: "Just neutrality"}
          - {pt: "Apenas conservação total", en: "Only total conservation"}
          - {pt: "Apenas deleção", en: "Only deletion"}
        correctAnswer: {pt: "Mais substituições não-sinônimas que sinônimas (dN/dS > 1)", en: "More non-synonymous than synonymous substitutions (dN/dS > 1)"}
        rationale: {pt: "Como mudanças benéficas em proteína são favorecidas, então dN/dS > 1 sinaliza adaptação.", en: "Because beneficial protein changes are favored, dN/dS > 1 signals adaptation."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
      - type: choice
        question: {pt: "Genômica comparada em medicina ajuda a:", en: "Comparative genomics in medicine helps to:"}
        choices:
          - {pt: "Identificar genes de doença e alvos terapêuticos via modelos animais", en: "Identify disease genes and therapeutic targets via animal models"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas fósseis", en: "Only fossils"}
        correctAnswer: {pt: "Identificar genes de doença e alvos terapêuticos via modelos animais", en: "Identify disease genes and therapeutic targets via animal models"}
        rationale: {pt: "Quando ortólogo está mutado em humanos e camundongo modela doença, então comparação acelera tradução clínica.", en: "When ortholog is mutated in humans and mouse models the disease, comparison accelerates clinical translation."}
        objectives: [biology.comparative_genomics]
        difficulty: 4
target: 20
