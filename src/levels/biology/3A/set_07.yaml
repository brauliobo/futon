title:
  pt: "🌟 Células-tronco e medicina regenerativa"
  en: "🌟 Stem cells and regenerative medicine"
level: '3A'
subject: biology
objectives: [biology.stem_cells]
difficulty: 4
authorNotes: "Pluripotência, iPSCs, organoides, terapias celulares."
example:
  pt: "Ex.: célula adulta + fatores Yamanaka → iPSC pluripotente → diferenciar em neurônio, hepatócito, etc."
  en: "Ex.: adult cell + Yamanaka factors → pluripotent iPSC → differentiate into neuron, hepatocyte, etc."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Tipos e potências", en: "Types and potencies"}
    description: {pt: "O que define uma célula-tronco.", en: "What defines a stem cell."}
    exercises:
      - type: choice
        question: {pt: "Células-tronco caracterizam-se por:", en: "Stem cells are characterized by:"}
        choices:
          - {pt: "Auto-renovação + capacidade de diferenciar em tipos celulares específicos", en: "Self-renewal + ability to differentiate into specific cell types"}
          - {pt: "Apenas divisão", en: "Just division"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem propriedades", en: "No properties"}
        correctAnswer: {pt: "Auto-renovação + capacidade de diferenciar em tipos celulares específicos", en: "Self-renewal + ability to differentiate into specific cell types"}
        rationale: {pt: "Como mantêm pool indefinido e geram progenitoras, então são essenciais para desenvolvimento e regeneração.", en: "Because they maintain indefinite pool and generate progenitors, they are essential for development and regeneration."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Totipotência:", en: "Totipotency:"}
        choices:
          - {pt: "Pode gerar todo o organismo (incluindo placenta) — só zigoto e primeiras divisões", en: "Can produce whole organism (including placenta) — only zygote and earliest divisions"}
          - {pt: "Apenas alguns tecidos", en: "Just some tissues"}
          - {pt: "Sem capacidade", en: "No capacity"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Pode gerar todo o organismo (incluindo placenta) — só zigoto e primeiras divisões", en: "Can produce whole organism (including placenta) — only zygote and earliest divisions"}
        rationale: {pt: "Como apenas células iniciais têm essa potência, então embriões em estágio de mórula são totipotentes.", en: "Because only early cells have this potency, morula-stage embryos are totipotent."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Pluripotência:", en: "Pluripotency:"}
        choices:
          - {pt: "Pode gerar quase todos os tipos celulares (não tecidos extraembrionários)", en: "Can generate almost all cell types (not extraembryonic tissues)"}
          - {pt: "Sempre todos os tecidos", en: "Always all tissues"}
          - {pt: "Sem capacidade", en: "No capacity"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Pode gerar quase todos os tipos celulares (não tecidos extraembrionários)", en: "Can generate almost all cell types (not extraembryonic tissues)"}
        rationale: {pt: "Como células-tronco embrionárias (ESCs) e iPSCs têm essa potência, então são alvo central de pesquisa regenerativa.", en: "Because embryonic stem cells (ESCs) and iPSCs have this potency, they are a central target of regenerative research."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Multipotência:", en: "Multipotency:"}
        choices:
          - {pt: "Limitada a uma linhagem específica (ex.: hematopoéticas → todas as células sanguíneas)", en: "Limited to a specific lineage (e.g., hematopoietic → all blood cells)"}
          - {pt: "Apenas um tipo", en: "Just one type"}
          - {pt: "Todos os tipos", en: "All types"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Limitada a uma linhagem específica (ex.: hematopoéticas → todas as células sanguíneas)", en: "Limited to a specific lineage (e.g., hematopoietic → all blood cells)"}
        rationale: {pt: "Como células adultas mantêm tecidos específicos, então hematopoéticas (medula) reabastecem sangue continuamente.", en: "Because adult cells maintain specific tissues, hematopoietic (marrow) cells continuously replenish blood."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Células-tronco embrionárias (ESCs):", en: "Embryonic stem cells (ESCs):"}
        choices:
          - {pt: "Pluripotentes — derivadas da massa interna do blastocisto", en: "Pluripotent — derived from blastocyst inner cell mass"}
          - {pt: "Apenas adultas", en: "Just adult"}
          - {pt: "Sem capacidade", en: "No capacity"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Pluripotentes — derivadas da massa interna do blastocisto", en: "Pluripotent — derived from blastocyst inner cell mass"}
        rationale: {pt: "Como geram qualquer tecido em laboratório, então têm potencial terapêutico imenso — mas levantam questões éticas.", en: "Because they generate any tissue in the lab, they have immense therapeutic potential — but raise ethical issues."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "iPSCs (induzidas pluripotentes):", en: "iPSCs (induced pluripotent):"}
        choices:
          - {pt: "Células adultas reprogramadas com fatores Yamanaka (Oct4, Sox2, Klf4, c-Myc)", en: "Adult cells reprogrammed with Yamanaka factors (Oct4, Sox2, Klf4, c-Myc)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem origem", en: "No origin"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Células adultas reprogramadas com fatores Yamanaka (Oct4, Sox2, Klf4, c-Myc)", en: "Adult cells reprogrammed with Yamanaka factors (Oct4, Sox2, Klf4, c-Myc)"}
        rationale: {pt: "Como não exigem embrião e são autólogas, então evitam questões éticas e rejeição imune — Nobel 2012.", en: "Because they don't require embryos and are autologous, they avoid ethical issues and immune rejection — 2012 Nobel."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Células-tronco adultas:", en: "Adult stem cells:"}
        choices:
          - {pt: "Multipotentes — encontradas em medula, intestino, pele, cérebro", en: "Multipotent — found in marrow, gut, skin, brain"}
          - {pt: "Pluripotentes sempre", en: "Always pluripotent"}
          - {pt: "Não existem", en: "Don't exist"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Multipotentes — encontradas em medula, intestino, pele, cérebro", en: "Multipotent — found in marrow, gut, skin, brain"}
        rationale: {pt: "Como mantêm tecidos durante a vida adulta, então sua diminuição correlaciona com envelhecimento.", en: "Because they maintain tissues throughout adult life, their decline correlates with aging."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Transplante de medula óssea:", en: "Bone marrow transplant:"}
        choices:
          - {pt: "Substitui células-tronco hematopoéticas — usado em leucemia, anemia aplásica", en: "Replaces hematopoietic stem cells — used in leukemia, aplastic anemia"}
          - {pt: "Apenas placebo", en: "Just placebo"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Substitui células-tronco hematopoéticas — usado em leucemia, anemia aplásica", en: "Replaces hematopoietic stem cells — used in leukemia, aplastic anemia"}
        rationale: {pt: "Como reconstroi sistema sanguíneo do paciente, então é primeiro tratamento estabelecido com células-tronco.", en: "Because it rebuilds the patient's blood system, it's the first established stem-cell treatment."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Organoides:", en: "Organoids:"}
        choices:
          - {pt: "Mini-órgãos 3D cultivados in vitro a partir de células-tronco — modelos de doenças", en: "3D mini-organs cultured in vitro from stem cells — disease models"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Não existem", en: "Don't exist"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Mini-órgãos 3D cultivados in vitro a partir de células-tronco — modelos de doenças", en: "3D mini-organs cultured in vitro from stem cells — disease models"}
        rationale: {pt: "Como replicam estrutura e função reais, então cérebro, intestino, fígado em miniatura aceleram pesquisa.", en: "Because they replicate real structure and function, brain, gut, liver miniatures accelerate research."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Diferenciação dirigida:", en: "Directed differentiation:"}
        choices:
          - {pt: "Cocktail de sinais transforma iPSC/ESC em tipo celular específico desejado", en: "Signal cocktail transforms iPSC/ESC into specific desired cell type"}
          - {pt: "Apenas aleatória", en: "Just random"}
          - {pt: "Sem direção", en: "No direction"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Cocktail de sinais transforma iPSC/ESC em tipo celular específico desejado", en: "Signal cocktail transforms iPSC/ESC into specific desired cell type"}
        rationale: {pt: "Como protocolos cuidadosos imitam desenvolvimento embrionário, então células-alvo (neurônios, hepatócitos) podem ser produzidas.", en: "Because careful protocols mimic embryonic development, target cells (neurons, hepatocytes) can be produced."}
        objectives: [biology.stem_cells]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Aplicações e desafios", en: "Applications and challenges"}
    description: {pt: "Da bancada à clínica.", en: "From bench to clinic."}
    exercises:
      - type: choice
        question: {pt: "Doenças tratáveis com células-tronco em estudo:", en: "Diseases under study with stem cells:"}
        choices:
          - {pt: "Parkinson, lesão medular, retinopatia, diabetes tipo 1, infarto", en: "Parkinson's, spinal cord injury, retinopathy, type 1 diabetes, MI"}
          - {pt: "Apenas resfriado", en: "Just cold"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Parkinson, lesão medular, retinopatia, diabetes tipo 1, infarto", en: "Parkinson's, spinal cord injury, retinopathy, type 1 diabetes, MI"}
        rationale: {pt: "Como células diferenciadas podem repor as perdidas, então doenças degenerativas são alvo natural.", en: "Because differentiated cells can replace lost ones, degenerative diseases are a natural target."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Tumorigênese é risco:", en: "Tumorigenesis is a risk:"}
        choices:
          - {pt: "Células indiferenciadas residuais podem formar teratomas após transplante", en: "Residual undifferentiated cells can form teratomas after transplant"}
          - {pt: "Sem risco", en: "No risk"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Células indiferenciadas residuais podem formar teratomas após transplante", en: "Residual undifferentiated cells can form teratomas after transplant"}
        rationale: {pt: "Como pluripotência também é capacidade de proliferar, então purificação rigorosa é essencial antes de uso clínico.", en: "Because pluripotency also means proliferative capacity, rigorous purification is essential before clinical use."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Edição com CRISPR + iPSCs:", en: "CRISPR + iPSCs editing:"}
        choices:
          - {pt: "Permite corrigir mutações antes de diferenciar e transplantar de volta", en: "Allows correcting mutations before differentiating and transplanting back"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Permite corrigir mutações antes de diferenciar e transplantar de volta", en: "Allows correcting mutations before differentiating and transplanting back"}
        rationale: {pt: "Como combina duas tecnologias revolucionárias, então abre porta para curas de doenças hereditárias.", en: "Because it combines two revolutionary technologies, it opens the door to cures for hereditary diseases."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Bioprintagem 3D:", en: "3D bioprinting:"}
        choices:
          - {pt: "Imprimir tecidos/órgãos camada a camada usando células e matrizes", en: "Print tissues/organs layer by layer using cells and scaffolds"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Não existe", en: "Doesn't exist"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Imprimir tecidos/órgãos camada a camada usando células e matrizes", en: "Print tissues/organs layer by layer using cells and scaffolds"}
        rationale: {pt: "Como impressoras 3D depositam células vivas em padrões específicos, então tecidos personalizados tornam-se realidade.", en: "Because 3D printers deposit live cells in specific patterns, personalized tissues become reality."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Engenharia tecidual:", en: "Tissue engineering:"}
        choices:
          - {pt: "Combina células + matriz extracelular + biofatores para construir tecidos", en: "Combines cells + extracellular matrix + biofactors to build tissues"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Combina células + matriz extracelular + biofatores para construir tecidos", en: "Combines cells + extracellular matrix + biofactors to build tissues"}
        rationale: {pt: "Como pele e cartilagem cultivadas já são clínicas, então engenharia tecidual avança gradualmente.", en: "Because cultured skin and cartilage are already clinical, tissue engineering advances gradually."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Xenotransplante:", en: "Xenotransplantation:"}
        choices:
          - {pt: "Órgãos de outras espécies (porcos editados geneticamente) em humanos", en: "Organs from other species (genetically edited pigs) into humans"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Órgãos de outras espécies (porcos editados geneticamente) em humanos", en: "Organs from other species (genetically edited pigs) into humans"}
        rationale: {pt: "Como falta de doadores limita transplantes, então rim/coração de porco modificado já foi testado em humanos (2022+).", en: "Because donor shortage limits transplants, modified pig kidney/heart was already tested in humans (2022+)."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Nicho de células-tronco:", en: "Stem cell niche:"}
        choices:
          - {pt: "Microambiente que sustenta e regula células-tronco em seu tecido", en: "Microenvironment that sustains and regulates stem cells in their tissue"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Microambiente que sustenta e regula células-tronco em seu tecido", en: "Microenvironment that sustains and regulates stem cells in their tissue"}
        rationale: {pt: "Como sinais locais determinam quiescência ou divisão, então perturbar nicho pode causar perda de células-tronco.", en: "Because local signals determine quiescence or division, disrupting niche can cause stem cell loss."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Sangue de cordão umbilical:", en: "Umbilical cord blood:"}
        choices:
          - {pt: "Rico em células-tronco hematopoéticas — fonte para transplantes", en: "Rich in hematopoietic stem cells — transplant source"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Rico em células-tronco hematopoéticas — fonte para transplantes", en: "Rich in hematopoietic stem cells — transplant source"}
        rationale: {pt: "Como pode ser armazenado em bancos públicos, então beneficia pacientes com doenças sanguíneas.", en: "Because it can be stored in public banks, it benefits patients with blood diseases."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Bioética em pesquisa de células-tronco:", en: "Stem cell research bioethics:"}
        choices:
          - {pt: "Discussão sobre uso de embriões, edição germinativa, equidade de acesso a terapias", en: "Debate over embryo use, germline editing, equitable access to therapies"}
          - {pt: "Sem dilemas", en: "No dilemmas"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Discussão sobre uso de embriões, edição germinativa, equidade de acesso a terapias", en: "Debate over embryo use, germline editing, equitable access to therapies"}
        rationale: {pt: "Como tecnologia avança rápido, então sociedade precisa estabelecer limites éticos antes de aplicações irreversíveis.", en: "Because technology advances fast, society must set ethical limits before irreversible applications."}
        objectives: [biology.stem_cells]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: medicina regenerativa:", en: "Summary: regenerative medicine:"}
        choices:
          - {pt: "Usa células-tronco, edição genética e engenharia tecidual para reparar/substituir tecidos doentes", en: "Uses stem cells, gene editing, and tissue engineering to repair/replace diseased tissues"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem aplicação", en: "No application"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Usa células-tronco, edição genética e engenharia tecidual para reparar/substituir tecidos doentes", en: "Uses stem cells, gene editing, and tissue engineering to repair/replace diseased tissues"}
        rationale: {pt: "Como combina biologia molecular, celular e materiais, então é fronteira interdisciplinar da medicina do século 21.", en: "Because it combines molecular, cell, and materials biology, it's an interdisciplinary frontier of 21st-century medicine."}
        objectives: [biology.stem_cells]
        difficulty: 4
target: 20
