title:
  pt: "🔬 Biologia de sistemas"
  en: "🔬 Systems biology"
level: '3A'
subject: biology
objectives: [biology.systems_biology]
difficulty: 4
authorNotes: "Redes biológicas, modelagem, ômicas integradas, emergência, biologia quantitativa."
example:
  pt: "Ex.: rede metabólica → modelo matemático → predição de fluxo → validação experimental."
  en: "Ex.: metabolic network → mathematical model → flux prediction → experimental validation."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Redes e ômicas", en: "Networks and omics"}
    description: {pt: "Vendo a célula como sistema integrado.", en: "Seeing the cell as integrated system."}
    exercises:
      - type: choice
        question: {pt: "Biologia de sistemas estuda:", en: "Systems biology studies:"}
        choices:
          - {pt: "Interações de muitos componentes biológicos como um todo integrado", en: "Interactions of many biological components as integrated whole"}
          - {pt: "Apenas um gene isolado", en: "Just one gene alone"}
          - {pt: "Apenas uma proteína", en: "Just one protein"}
          - {pt: "Apenas morfologia", en: "Just morphology"}
        correctAnswer: {pt: "Interações de muitos componentes biológicos como um todo integrado", en: "Interactions of many biological components as integrated whole"}
        rationale: {pt: "Como propriedades emergentes não aparecem em partes isoladas, então abordagem integrativa é necessária.", en: "Because emergent properties don't appear in isolated parts, integrative approach is necessary."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Genômica estuda:", en: "Genomics studies:"}
        choices:
          - {pt: "Conjunto completo de DNA do organismo", en: "Complete DNA set of organism"}
          - {pt: "Apenas proteínas", en: "Just proteins"}
          - {pt: "Apenas RNA momentâneo", en: "Just momentary RNA"}
          - {pt: "Apenas metabólitos", en: "Just metabolites"}
        correctAnswer: {pt: "Conjunto completo de DNA do organismo", en: "Complete DNA set of organism"}
        rationale: {pt: "Quando sequenciamos genoma todo, então mapeamos potencial genético do organismo.", en: "When we sequence the whole genome, we map the organism's genetic potential."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Transcriptômica estuda:", en: "Transcriptomics studies:"}
        choices:
          - {pt: "Conjunto de RNAs expressos em uma condição/célula", en: "RNAs expressed in a condition/cell"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas lipídios", en: "Just lipids"}
          - {pt: "Apenas estrutura", en: "Just structure"}
        correctAnswer: {pt: "Conjunto de RNAs expressos em uma condição/célula", en: "RNAs expressed in a condition/cell"}
        rationale: {pt: "Como expressão varia, então transcriptoma revela quais genes estão ativos no momento.", en: "Because expression varies, transcriptome reveals which genes are active at the moment."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Proteômica estuda:", en: "Proteomics studies:"}
        choices:
          - {pt: "Todas as proteínas (e modificações) em uma amostra", en: "All proteins (and modifications) in a sample"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas RNA", en: "Just RNA"}
          - {pt: "Apenas açúcares", en: "Just sugars"}
        correctAnswer: {pt: "Todas as proteínas (e modificações) em uma amostra", en: "All proteins (and modifications) in a sample"}
        rationale: {pt: "Quando proteínas executam função, então proteoma reflete estado funcional real da célula.", en: "When proteins execute function, proteome reflects real functional state of the cell."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Metabolômica estuda:", en: "Metabolomics studies:"}
        choices:
          - {pt: "Conjunto de metabólitos pequenos (intermediários e produtos)", en: "Set of small metabolites (intermediates and products)"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas proteínas grandes", en: "Just large proteins"}
          - {pt: "Apenas RNA", en: "Just RNA"}
        correctAnswer: {pt: "Conjunto de metabólitos pequenos (intermediários e produtos)", en: "Set of small metabolites (intermediates and products)"}
        rationale: {pt: "Como metabólitos são saída funcional, então metaboloma é fenótipo bioquímico mais próximo.", en: "Because metabolites are functional output, metabolome is the closest biochemical phenotype."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Multi-ômica integra:", en: "Multi-omics integrates:"}
        choices:
          - {pt: "Genômica + transcriptômica + proteômica + metabolômica + outras", en: "Genomics + transcriptomics + proteomics + metabolomics + others"}
          - {pt: "Apenas uma camada", en: "Just one layer"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Genômica + transcriptômica + proteômica + metabolômica + outras", en: "Genomics + transcriptomics + proteomics + metabolomics + others"}
        rationale: {pt: "Quando combinamos camadas, então preenchemos lacunas de cada uma e ganhamos visão sistêmica.", en: "When we combine layers, we fill gaps in each and gain systemic view."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Rede de interação proteína-proteína (PPI) é:", en: "Protein-protein interaction (PPI) network is:"}
        choices:
          - {pt: "Grafo de quais proteínas se ligam entre si", en: "Graph of which proteins bind each other"}
          - {pt: "Apenas lista de DNA", en: "Just DNA list"}
          - {pt: "Apenas RNA", en: "Just RNA"}
          - {pt: "Apenas tradução", en: "Just translation"}
        correctAnswer: {pt: "Grafo de quais proteínas se ligam entre si", en: "Graph of which proteins bind each other"}
        rationale: {pt: "Como proteínas atuam em complexos, então rede PPI revela módulos funcionais.", en: "Because proteins act in complexes, PPI network reveals functional modules."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Hub em rede biológica é:", en: "Hub in biological network is:"}
        choices:
          - {pt: "Nó altamente conectado, frequentemente essencial", en: "Highly connected node, often essential"}
          - {pt: "Nó isolado", en: "Isolated node"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "Nó altamente conectado, frequentemente essencial", en: "Highly connected node, often essential"}
        rationale: {pt: "Quando hub é removido, então rede colapsa — por isso hubs tendem a ser genes essenciais.", en: "When hub is removed, network collapses — hence hubs tend to be essential genes."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Motivo de rede (network motif) é:", en: "Network motif is:"}
        choices:
          - {pt: "Padrão pequeno recorrente (ex.: feedforward loop) em redes regulatórias", en: "Small recurrent pattern (e.g., feedforward loop) in regulatory networks"}
          - {pt: "Apenas ruído aleatório", en: "Just random noise"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas erro", en: "Just error"}
        correctAnswer: {pt: "Padrão pequeno recorrente (ex.: feedforward loop) em redes regulatórias", en: "Small recurrent pattern (e.g., feedforward loop) in regulatory networks"}
        rationale: {pt: "Como motivos executam funções específicas (filtro, atraso), então biologia reusa blocos lógicos.", en: "Because motifs execute specific functions (filter, delay), biology reuses logical blocks."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Robustez biológica significa:", en: "Biological robustness means:"}
        choices:
          - {pt: "Manter função apesar de perturbações (mutações, ruído)", en: "Maintain function despite perturbations (mutations, noise)"}
          - {pt: "Ser frágil", en: "Being fragile"}
          - {pt: "Apenas crescer", en: "Only grow"}
          - {pt: "Apenas morrer", en: "Only die"}
        correctAnswer: {pt: "Manter função apesar de perturbações (mutações, ruído)", en: "Maintain function despite perturbations (mutations, noise)"}
        rationale: {pt: "Quando sistema tem redundância e feedback, então robustez emerge — princípio central de design biológico.", en: "When system has redundancy and feedback, robustness emerges — central principle of biological design."}
        objectives: [biology.systems_biology]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Modelagem e quantificação", en: "Modeling and quantification"}
    description: {pt: "Da matemática à célula única.", en: "From math to single-cell."}
    exercises:
      - type: choice
        question: {pt: "Modelagem matemática em biologia serve para:", en: "Mathematical modeling in biology serves to:"}
        choices:
          - {pt: "Prever comportamento e testar hipóteses quantitativamente", en: "Predict behavior and test hypotheses quantitatively"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Sem propósito", en: "No purpose"}
        correctAnswer: {pt: "Prever comportamento e testar hipóteses quantitativamente", en: "Predict behavior and test hypotheses quantitatively"}
        rationale: {pt: "Como modelos formalizam suposições, então previsões falsificáveis avançam ciência rigorosamente.", en: "Because models formalize assumptions, falsifiable predictions advance science rigorously."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "ODE (equação diferencial ordinária) modela:", en: "ODE (ordinary differential equation) models:"}
        choices:
          - {pt: "Mudança de concentração ao longo do tempo (cinética química)", en: "Concentration change over time (chemical kinetics)"}
          - {pt: "Apenas estrutura estática", en: "Only static structure"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas DNA", en: "Just DNA"}
        correctAnswer: {pt: "Mudança de concentração ao longo do tempo (cinética química)", en: "Concentration change over time (chemical kinetics)"}
        rationale: {pt: "Quando descrevemos taxas, então ODEs preveem dinâmica de sinalização e metabolismo.", en: "When describing rates, ODEs predict signaling and metabolism dynamics."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Análise de fluxo (FBA) prevê:", en: "Flux analysis (FBA) predicts:"}
        choices:
          - {pt: "Distribuição de fluxos metabólicos otimizando objetivo (ex.: crescimento)", en: "Metabolic flux distribution optimizing objective (e.g., growth)"}
          - {pt: "Apenas estrutura de DNA", en: "Just DNA structure"}
          - {pt: "Apenas RNA", en: "Just RNA"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Distribuição de fluxos metabólicos otimizando objetivo (ex.: crescimento)", en: "Metabolic flux distribution optimizing objective (e.g., growth)"}
        rationale: {pt: "Como rede metabólica tem restrições estequiométricas, então otimização revela fluxo provável.", en: "Because metabolic network has stoichiometric constraints, optimization reveals likely flux."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Single-cell RNA-seq (scRNA-seq) revela:", en: "Single-cell RNA-seq (scRNA-seq) reveals:"}
        choices:
          - {pt: "Heterogeneidade transcricional entre células individuais", en: "Transcriptional heterogeneity among individual cells"}
          - {pt: "Apenas média populacional", en: "Just population average"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas proteína", en: "Just protein"}
        correctAnswer: {pt: "Heterogeneidade transcricional entre células individuais", en: "Transcriptional heterogeneity among individual cells"}
        rationale: {pt: "Quando medimos célula a célula, então descobrimos subpopulações ocultas em médias.", en: "When measuring cell by cell, we discover subpopulations hidden in averages."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "UMAP/t-SNE em scRNA-seq são:", en: "UMAP/t-SNE in scRNA-seq are:"}
        choices:
          - {pt: "Algoritmos de redução de dimensionalidade para visualizar células", en: "Dimensionality reduction algorithms to visualize cells"}
          - {pt: "Apenas microscopia", en: "Just microscopy"}
          - {pt: "Apenas PCR", en: "Just PCR"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Algoritmos de redução de dimensionalidade para visualizar células", en: "Dimensionality reduction algorithms to visualize cells"}
        rationale: {pt: "Como dados têm milhares de dimensões, então projeção 2D revela clusters de tipos celulares.", en: "Because data has thousands of dimensions, 2D projection reveals clusters of cell types."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Atlas celular (Human Cell Atlas) busca:", en: "Cell atlas (Human Cell Atlas) seeks to:"}
        choices:
          - {pt: "Catalogar todos os tipos celulares humanos via single-cell ômicas", en: "Catalog all human cell types via single-cell omics"}
          - {pt: "Apenas um órgão", en: "Just one organ"}
          - {pt: "Apenas DNA", en: "Just DNA"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Catalogar todos os tipos celulares humanos via single-cell ômicas", en: "Catalog all human cell types via single-cell omics"}
        rationale: {pt: "Quando mapeamos cada tipo, então criamos referência para saúde e doença.", en: "When we map every type, we create reference for health and disease."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "GWAS (Genome-Wide Association Study) busca:", en: "GWAS searches for:"}
        choices:
          - {pt: "Variantes genéticas associadas a fenótipos/doenças", en: "Genetic variants associated with phenotypes/diseases"}
          - {pt: "Apenas uma proteína", en: "Just one protein"}
          - {pt: "Apenas RNA temporário", en: "Just temporary RNA"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Variantes genéticas associadas a fenótipos/doenças", en: "Genetic variants associated with phenotypes/diseases"}
        rationale: {pt: "Como comparamos casos vs controles em milhões de SNPs, então identificamos loci de risco.", en: "Because we compare cases vs controls across millions of SNPs, we identify risk loci."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Aprendizado de máquina em biologia ajuda a:", en: "Machine learning in biology helps to:"}
        choices:
          - {pt: "Reconhecer padrões em dados ômicos massivos (ex.: AlphaFold)", en: "Recognize patterns in massive omics data (e.g., AlphaFold)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas substituir biólogos", en: "Only replace biologists"}
          - {pt: "Sem aplicação", en: "No application"}
        correctAnswer: {pt: "Reconhecer padrões em dados ômicos massivos (ex.: AlphaFold)", en: "Recognize patterns in massive omics data (e.g., AlphaFold)"}
        rationale: {pt: "Quando dados excedem análise humana, então ML extrai estrutura predizendo funções e interações.", en: "When data exceeds human analysis, ML extracts structure predicting functions and interactions."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Biologia quantitativa exige:", en: "Quantitative biology requires:"}
        choices:
          - {pt: "Medidas precisas, modelos matemáticos, estatística rigorosa", en: "Precise measurements, mathematical models, rigorous statistics"}
          - {pt: "Apenas observação qualitativa", en: "Just qualitative observation"}
          - {pt: "Apenas intuição", en: "Just intuition"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Medidas precisas, modelos matemáticos, estatística rigorosa", en: "Precise measurements, mathematical models, rigorous statistics"}
        rationale: {pt: "Como números permitem previsão e teste, então rigor quantitativo move biologia de descritiva a preditiva.", en: "Because numbers allow prediction and testing, quantitative rigor moves biology from descriptive to predictive."}
        objectives: [biology.systems_biology]
        difficulty: 4
      - type: choice
        question: {pt: "Medicina de sistemas (P4) busca ser:", en: "Systems medicine (P4) aims to be:"}
        choices:
          - {pt: "Preditiva, Preventiva, Personalizada, Participativa", en: "Predictive, Preventive, Personalized, Participatory"}
          - {pt: "Apenas reativa", en: "Just reactive"}
          - {pt: "Apenas genérica", en: "Just generic"}
          - {pt: "Apenas decorativa", en: "Just decorative"}
        correctAnswer: {pt: "Preditiva, Preventiva, Personalizada, Participativa", en: "Predictive, Preventive, Personalized, Participatory"}
        rationale: {pt: "Quando integramos ômicas, dados clínicos e estilo de vida, então tratamento se torna individualizado.", en: "When integrating omics, clinical data and lifestyle, treatment becomes individualized."}
        objectives: [biology.systems_biology]
        difficulty: 4
target: 20
