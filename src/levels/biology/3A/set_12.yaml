title:
  pt: "⚖️ Bioética avançada"
  en: "⚖️ Advanced bioethics"
level: '3A'
subject: biology
objectives: [biology.bioethics]
difficulty: 4
authorNotes: "Edição germinativa, clonagem humana, dual-use, equidade global em saúde."
example:
  pt: "Ex.: editar embrião humano com CRISPR — alteração permanente, transmissível, levanta questões éticas profundas."
  en: "Ex.: editing human embryo with CRISPR — permanent, transmissible change, raises deep ethical questions."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Princípios e dilemas", en: "Principles and dilemmas"}
    description: {pt: "Quando a ciência encontra valores.", en: "When science meets values."}
    exercises:
      - type: choice
        question: {pt: "Princípios bioéticos clássicos (Belmont):", en: "Classical bioethical principles (Belmont):"}
        choices:
          - {pt: "Autonomia, beneficência, não-maleficência, justiça", en: "Autonomy, beneficence, non-maleficence, justice"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem princípios", en: "No principles"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Autonomia, beneficência, não-maleficência, justiça", en: "Autonomy, beneficence, non-maleficence, justice"}
        rationale: {pt: "Como após Tuskegee e Nuremberg ética foi codificada, então estes princípios guiam pesquisa biomédica moderna.", en: "Because after Tuskegee and Nuremberg ethics was codified, these principles guide modern biomedical research."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Consentimento informado:", en: "Informed consent:"}
        choices:
          - {pt: "Participantes devem entender riscos/benefícios e consentir voluntariamente", en: "Participants must understand risks/benefits and consent voluntarily"}
          - {pt: "Apenas formalidade", en: "Just formality"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Participantes devem entender riscos/benefícios e consentir voluntariamente", en: "Participants must understand risks/benefits and consent voluntarily"}
        rationale: {pt: "Como respeita autonomia, então é pilar ético — violado historicamente em estudos como Tuskegee (1932-1972).", en: "Because it respects autonomy, it's an ethical pillar — historically violated in studies like Tuskegee (1932-1972)."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Edição genética somática:", en: "Somatic gene editing:"}
        choices:
          - {pt: "Modifica células do paciente — não passa para descendentes (mais aceito eticamente)", en: "Modifies patient cells — doesn't pass to descendants (more ethically accepted)"}
          - {pt: "Sempre germinativa", en: "Always germline"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Modifica células do paciente — não passa para descendentes (mais aceito eticamente)", en: "Modifies patient cells — doesn't pass to descendants (more ethically accepted)"}
        rationale: {pt: "Como afeta apenas o indivíduo consentido, então tratamento de doenças hereditárias por terapia somática é menos controverso.", en: "Because it affects only the consenting individual, treating hereditary diseases via somatic therapy is less controversial."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Edição germinativa:", en: "Germline editing:"}
        choices:
          - {pt: "Modifica gametas/embriões — alterações transmissíveis a futuras gerações (controverso)", en: "Modifies gametes/embryos — changes pass to future generations (controversial)"}
          - {pt: "Apenas somática", en: "Only somatic"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Modifica gametas/embriões — alterações transmissíveis a futuras gerações (controverso)", en: "Modifies gametes/embryos — changes pass to future generations (controversial)"}
        rationale: {pt: "Como afeta humanos não-consentidos (descendentes), então maioria dos países proíbe — caso He Jiankui (China, 2018).", en: "Because it affects non-consenting humans (descendants), most countries ban it — He Jiankui case (China, 2018)."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Caso He Jiankui (2018):", en: "He Jiankui case (2018):"}
        choices:
          - {pt: "Cientista chinês editou embriões CCR5 → \"bebês CRISPR\" — condenado eticamente e penalmente", en: "Chinese scientist edited CCR5 embryos → \"CRISPR babies\" — ethically and legally condemned"}
          - {pt: "Apenas teoria", en: "Just theory"}
          - {pt: "Sem consequências", en: "No consequences"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Cientista chinês editou embriões CCR5 → \"bebês CRISPR\" — condenado eticamente e penalmente", en: "Chinese scientist edited CCR5 embryos → \"CRISPR babies\" — ethically and legally condemned"}
        rationale: {pt: "Como violou normas científicas e éticas, então comunidade global pediu moratória em edição germinativa humana.", en: "Because it violated scientific and ethical norms, global community called for moratorium on human germline editing."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Pesquisa de duplo uso (dual-use):", en: "Dual-use research:"}
        choices:
          - {pt: "Pesquisa biomédica que pode ser usada tanto para benefício quanto para dano (bioterrorismo)", en: "Biomedical research usable for both benefit and harm (bioterrorism)"}
          - {pt: "Sempre benéfico", en: "Always beneficial"}
          - {pt: "Sem risco", en: "No risk"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Pesquisa biomédica que pode ser usada tanto para benefício quanto para dano (bioterrorismo)", en: "Biomedical research usable for both benefit and harm (bioterrorism)"}
        rationale: {pt: "Como conhecimento sobre vírus pode salvar ou matar, então estudos de \"ganho de função\" geram debate ético.", en: "Because virus knowledge can save or kill, \"gain-of-function\" studies generate ethical debate."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Equidade em saúde global:", en: "Global health equity:"}
        choices:
          - {pt: "Acesso a tratamentos varia drasticamente entre países ricos e pobres — questão ética central", en: "Treatment access varies drastically between rich and poor countries — central ethical issue"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem disparidade", en: "No disparity"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Acesso a tratamentos varia drasticamente entre países ricos e pobres — questão ética central", en: "Treatment access varies drastically between rich and poor countries — central ethical issue"}
        rationale: {pt: "Como vacinas COVID concentraram-se em países ricos, então equidade global tornou-se questão urgente em pandemias.", en: "Because COVID vaccines concentrated in rich countries, global equity became urgent in pandemics."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Pesquisa em animais:", en: "Animal research:"}
        choices:
          - {pt: "Princípios 3R: Replacement (substituir), Reduction (reduzir), Refinement (refinar)", en: "3R principles: Replace, Reduce, Refine"}
          - {pt: "Sem regulação", en: "No regulation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem ética", en: "No ethics"}
        correctAnswer: {pt: "Princípios 3R: Replacement (substituir), Reduction (reduzir), Refinement (refinar)", en: "3R principles: Replace, Reduce, Refine"}
        rationale: {pt: "Como minimiza sofrimento animal, então 3R são padrão ético global em pesquisa biomédica.", en: "Because they minimize animal suffering, 3R are global ethical standard in biomedical research."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Patentes em biologia:", en: "Biology patents:"}
        choices:
          - {pt: "Genes naturais não podem ser patenteados (Suprema Corte EUA, 2013) — métodos sintéticos sim", en: "Natural genes cannot be patented (US Supreme Court 2013) — synthetic methods yes"}
          - {pt: "Sempre permitido", en: "Always allowed"}
          - {pt: "Sempre proibido", en: "Always forbidden"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Genes naturais não podem ser patenteados (Suprema Corte EUA, 2013) — métodos sintéticos sim", en: "Natural genes cannot be patented (US Supreme Court 2013) — synthetic methods yes"}
        rationale: {pt: "Como caso BRCA da Myriad Genetics decidiu, então patentes não podem cobrir descobertas naturais — apenas invenções.", en: "Because Myriad Genetics BRCA case decided, patents cannot cover natural discoveries — only inventions."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Comitês de ética em pesquisa (CEPs):", en: "Research ethics committees (RECs):"}
        choices:
          - {pt: "Avaliam protocolos antes da execução — protegem participantes e integridade científica", en: "Review protocols before execution — protect participants and scientific integrity"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas burocracia", en: "Just bureaucracy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Avaliam protocolos antes da execução — protegem participantes e integridade científica", en: "Review protocols before execution — protect participants and scientific integrity"}
        rationale: {pt: "Como filtram estudos antiéticos, então pesquisas com humanos requerem aprovação ética obrigatoriamente.", en: "Because they filter unethical studies, human research requires mandatory ethics approval."}
        objectives: [biology.bioethics]
        difficulty: 4
  - pageNumber: 2
    title: {pt: "Tecnologias emergentes", en: "Emerging technologies"}
    description: {pt: "Novas fronteiras éticas.", en: "New ethical frontiers."}
    exercises:
      - type: choice
        question: {pt: "Privacidade genética:", en: "Genetic privacy:"}
        choices:
          - {pt: "DNA contém informação sensível — risco de discriminação por seguros, empregadores", en: "DNA contains sensitive information — discrimination risk by insurers, employers"}
          - {pt: "Sem risco", en: "No risk"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
        correctAnswer: {pt: "DNA contém informação sensível — risco de discriminação por seguros, empregadores", en: "DNA contains sensitive information — discrimination risk by insurers, employers"}
        rationale: {pt: "Como leis GINA (EUA) protegem, então mas globalmente proteção é desigual — vazamentos podem ser permanentes.", en: "Because GINA laws (US) protect, but globally protection is uneven — leaks can be permanent."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Designer babies:", en: "Designer babies:"}
        choices:
          - {pt: "Selecionar embriões/editar genes para traços não-médicos (cor olho, altura, inteligência)", en: "Select embryos/edit genes for non-medical traits (eye color, height, intelligence)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Já amplamente aceitos", en: "Already widely accepted"}
          - {pt: "Sem dilemas", en: "No dilemmas"}
        correctAnswer: {pt: "Selecionar embriões/editar genes para traços não-médicos (cor olho, altura, inteligência)", en: "Select embryos/edit genes for non-medical traits (eye color, height, intelligence)"}
        rationale: {pt: "Como pode aprofundar desigualdades, então maioria dos países proíbe — debate sobre limites entre terapia e \"melhoria\".", en: "Because it can deepen inequality, most countries ban — debate over limits between therapy and \"enhancement\"."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Eugenia:", en: "Eugenics:"}
        choices:
          - {pt: "Tentativa de \"melhorar\" genética humana — historicamente justificou abusos (esterilizações forçadas, Holocausto)", en: "Attempt to \"improve\" human genetics — historically justified abuses (forced sterilizations, Holocaust)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sempre benéfica", en: "Always beneficial"}
          - {pt: "Sem história", en: "No history"}
        correctAnswer: {pt: "Tentativa de \"melhorar\" genética humana — historicamente justificou abusos (esterilizações forçadas, Holocausto)", en: "Attempt to \"improve\" human genetics — historically justified abuses (forced sterilizations, Holocaust)"}
        rationale: {pt: "Como história mostra perigos, então tecnologias modernas devem evitar repetir erros — vigilância contínua é necessária.", en: "Because history shows dangers, modern technologies must avoid repeating errors — continuous vigilance is necessary."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Doação de órgãos:", en: "Organ donation:"}
        choices:
          - {pt: "Modelos opt-in (consentimento explícito) vs opt-out (presumido) afetam taxas", en: "Opt-in (explicit consent) vs opt-out (presumed) models affect rates"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Modelos opt-in (consentimento explícito) vs opt-out (presumido) afetam taxas", en: "Opt-in (explicit consent) vs opt-out (presumed) models affect rates"}
        rationale: {pt: "Como países opt-out (Espanha) têm taxas mais altas, então estrutura de escolha influencia decisões — \"nudge\".", en: "Because opt-out countries (Spain) have higher rates, choice architecture influences decisions — \"nudge\"."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Eutanásia/morte assistida:", en: "Euthanasia/assisted dying:"}
        choices:
          - {pt: "Debate ético sobre autonomia em fim de vida — legalizada em países (Holanda, Bélgica, Canadá)", en: "Ethical debate on end-of-life autonomy — legalized in some countries (Netherlands, Belgium, Canada)"}
          - {pt: "Sempre proibida globalmente", en: "Always globally banned"}
          - {pt: "Sem dilemas", en: "No dilemmas"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Debate ético sobre autonomia em fim de vida — legalizada em países (Holanda, Bélgica, Canadá)", en: "Ethical debate on end-of-life autonomy — legalized in some countries (Netherlands, Belgium, Canada)"}
        rationale: {pt: "Como tensiona autonomia individual e respeito à vida, então cada sociedade chega a equilíbrio próprio.", en: "Because it tensions individual autonomy and respect for life, each society reaches its own balance."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Inteligência artificial em medicina:", en: "AI in medicine:"}
        choices:
          - {pt: "Levanta questões: viés algorítmico, transparência, responsabilidade, desumanização", en: "Raises issues: algorithmic bias, transparency, accountability, dehumanization"}
          - {pt: "Sempre objetiva", en: "Always objective"}
          - {pt: "Sem dilemas", en: "No dilemmas"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Levanta questões: viés algorítmico, transparência, responsabilidade, desumanização", en: "Raises issues: algorithmic bias, transparency, accountability, dehumanization"}
        rationale: {pt: "Como dados de treinamento podem refletir desigualdades, então IA pode amplificar discriminação se não monitorada.", en: "Because training data can reflect inequalities, AI can amplify discrimination if unmonitored."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Pesquisa COVID e ética:", en: "COVID research and ethics:"}
        choices:
          - {pt: "Pandemia acelerou aprovações — questões sobre riscos, equidade, comunicação", en: "Pandemic accelerated approvals — questions about risks, equity, communication"}
          - {pt: "Sem dilemas", en: "No dilemmas"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem urgência", en: "No urgency"}
        correctAnswer: {pt: "Pandemia acelerou aprovações — questões sobre riscos, equidade, comunicação", en: "Pandemic accelerated approvals — questions about risks, equity, communication"}
        rationale: {pt: "Como velocidade ↔ rigor são tensões, então pandemia testou framework ético em tempo real — lições para futuro.", en: "Because speed ↔ rigor are tensions, pandemic tested ethical framework in real time — lessons for future."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Biologia sintética:", en: "Synthetic biology:"}
        choices:
          - {pt: "Construir sistemas biológicos novos — riscos de biossegurança e dual-use", en: "Build new biological systems — biosecurity and dual-use risks"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem riscos", en: "No risks"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Construir sistemas biológicos novos — riscos de biossegurança e dual-use", en: "Build new biological systems — biosecurity and dual-use risks"}
        rationale: {pt: "Como permite criar organismos sintéticos, então comunidade científica autorregula — Asilomar 2.0 em discussão.", en: "Because it allows creating synthetic organisms, scientific community self-regulates — Asilomar 2.0 in discussion."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Comunicação científica e desinformação:", en: "Science communication and misinformation:"}
        choices:
          - {pt: "Cientistas têm responsabilidade ética em comunicar com clareza e combater desinformação", en: "Scientists have ethical duty to communicate clearly and counter misinformation"}
          - {pt: "Apenas comunicar com colegas", en: "Just communicate with peers"}
          - {pt: "Sem responsabilidade", en: "No responsibility"}
          - {pt: "Apenas decoração", en: "Just decoration"}
        correctAnswer: {pt: "Cientistas têm responsabilidade ética em comunicar com clareza e combater desinformação", en: "Scientists have ethical duty to communicate clearly and counter misinformation"}
        rationale: {pt: "Como pandemia mostrou impacto de fake news, então engajamento público é parte da ética científica.", en: "Because pandemic showed fake news impact, public engagement is part of scientific ethics."}
        objectives: [biology.bioethics]
        difficulty: 4
      - type: choice
        question: {pt: "Resumo: bioética:", en: "Summary: bioethics:"}
        choices:
          - {pt: "Reflexão crítica sobre limites e implicações morais da biologia/medicina", en: "Critical reflection on limits and moral implications of biology/medicine"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Sem importância", en: "No importance"}
          - {pt: "Apenas teoria", en: "Just theory"}
        correctAnswer: {pt: "Reflexão crítica sobre limites e implicações morais da biologia/medicina", en: "Critical reflection on limits and moral implications of biology/medicine"}
        rationale: {pt: "Como ciência avança rápido, então sociedade precisa de bioética para guiar uso responsável das tecnologias.", en: "Because science advances fast, society needs bioethics to guide responsible technology use."}
        objectives: [biology.bioethics]
        difficulty: 4
target: 20
